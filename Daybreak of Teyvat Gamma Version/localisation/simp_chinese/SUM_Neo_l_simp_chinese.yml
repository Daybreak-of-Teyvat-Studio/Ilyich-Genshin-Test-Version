 SUM_Neo_SDH.150.d:"与四邻立约：绿洲不结盟、不驻外兵、不供粮于战。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
