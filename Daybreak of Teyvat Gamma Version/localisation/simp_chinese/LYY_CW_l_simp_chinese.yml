 KQP_Spirit_Red_Citadel:"赤色堡垒"
 KQP_Spirit_Red_Citadel_desc:"城墙上刷着一句口号，字大到城外也看得见。堡垒不是用来住人的，是用来让人相信城里还有人没有走。工事挖得越深，人心反而越稳，走路的人也终于肯把头抬起来。"
 KQP_Spirit_Long_Morning:"漫长黎明"
 KQP_Spirit_Long_Morning_desc:"天亮得很慢，慢到人们开始怀疑夜是不是不会走完。政府照旧开门，学堂照旧开课，灯笼一盏一盏撤下，谁也没有说要庆祝什么。日子重新有了形状，这就是最好的消息。"
 LYY_News.100.t:"璃月斩断仙路"
 LYY_News.100.d:"璃月港的钟声在清晨敲了整整一刻。玉京台上传出的文书很短，却让整座港城的议论声都停了下来：自此之后，仙凡两途正式分开，凡人不再受箓，仙人不再过问政务。多年来悬在头顶的那条路，被人用一纸公文封了起来。有人说这是清醒，也有人说这是忘本。药庐里的老医师把香炉收进了柜子，学堂里新开的课却排到了明年。街上的人照旧买卖，只是路过旧祠时，脚步会不自觉放慢一点。海风把告示吹得哗哗作响，纸角卷起，露出下面压着的旧符。有人伸手想去扶，又缩了回来。"
 LYY_News.100.a:"路断了，人还得往前走。"

