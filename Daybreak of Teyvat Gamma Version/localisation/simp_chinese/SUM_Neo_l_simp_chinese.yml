 SUM_Neo.249.t:"堕落学者"
 SUM_Neo.249.d:"学者被禁忌知识吞掉，教令院把他们从名册上划去。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。"
