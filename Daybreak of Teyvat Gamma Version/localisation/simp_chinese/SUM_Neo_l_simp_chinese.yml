 SUM_Neo.37.t:"神权教义"
 SUM_Neo.37.d:"神权教义成文，草神的判断高于一切学派的争辩。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。"
