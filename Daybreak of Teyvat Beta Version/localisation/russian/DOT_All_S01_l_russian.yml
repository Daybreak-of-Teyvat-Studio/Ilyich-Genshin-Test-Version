 FON_genshin_party_long:0 "§gДворец Мормония — резиденция правительства Фонтейна.\nС момента основания Семи Архонтов здесь правит Бог Воды.§!"
 FON_communism_party:0 "Шип Розы (SdR)"
 FON_communism_party_long:0 "§gШип Розы (Spina di Rosula) основан отцом Навии Каресом для защиты экономики Пуассона. После его убийства организация распалась, но Навия восстановила её. Сейчас в неё входят рабочие, инженеры и радикальные интеллектуалы, выступающие за демократию и права народа.§!"
 FON_neutrality_party:0 "Очаг (HoH)"
 FON_neutrality_party_long:0 "§gОчаг (House of the Hearth) — это сиротский приют Фатуи, управляемый «Слугой». Дети воспитываются для работы на Фатуи, но в Фонтейне они вели себя тихо и даже помогали властям, поэтому их терпят.§!"
 FON_democratic_party:0 "Союз журналистов (UDJ)"
 FON_democratic_party_long:0 "§gСоюз журналистов (Union des journaux) — ассоциация журналистов, борющаяся за свободу прессы.§!"
 FON_fascism_party:0 "Союз ветеранов и полиции (FDACEDLP)"
 FON_fascism_party_long:0 "§gСоюз ветеранов и полиции (Fédération des anciens combattants et de la police) — ассоциация ветеранов и полиции, считающаяся «крышей» для военных и полиции.§!"

 FON_PSF:0 "Народная социалистическая партия Фонтейна (PSF)"
 FON_PSF_long:0 "§gНародная социалистическая партия Фонтейна (Parti social Fontaine) создана на основе Шипа Розы и Свободной федерации труда. Её члены — рабочие, инженеры и радикальные интеллектуалы. Партия придерживается демократического социализма.§!"
 FON_PLCF:0 "Конституционная либеральная партия Фонтейна (PLCF)"
 FON_PLCF_long:0 "§gКонституционная либеральная партия Фонтейна (Parti libéral constitutionnel Fontaine) основана журналисткой Шарлоттой. Партия выступает за свободу слова и личные права.§!"
 FON_PAF:0 "Партия альянса Фонтейна (PAF)"
 FON_PAF_long:0 "§gПартия альянса Фонтейна (Parti Alliance Fontaine) создана Лини из Очага совместно с промышленниками. Партия выступает за экономический либерализм.§!"
