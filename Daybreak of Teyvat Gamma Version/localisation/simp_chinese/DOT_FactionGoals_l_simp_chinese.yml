l_simp_chinese:

# 阵营目标：通用提瓦特世界观（短 / 中 / 长期各三个）

 DOT_fg_compat:0 "旧约遗目"
 DOT_fg_compat_desc:0 "此目标已由同盟新约取代。"
 DOT_fg_alliance_covenant:0 "同盟之契"
 DOT_fg_alliance_covenant_desc:0 "提瓦特诸邦既结同盟，当以信义为先，共担艰险，不相役使，亦不相弃。"
 DOT_fg_ley_line_survey:0 "地脉勘察"
 DOT_fg_ley_line_survey_desc:0 "元素循地脉而行，同盟宜先遣人测绘其经络，注明淤塞之处，以備日后疏导。"
 DOT_fg_abyss_watch:0 "深渊之瞰"
 DOT_fg_abyss_watch_desc:0 "深渊之患不待兵临而后知，宜于边境设瞭望，互通警讯，使诸邦得以先事而备。"
 DOT_fg_shared_ley_lines:0 "地脉同修"
 DOT_fg_shared_ley_lines_desc:0 "地脉淤塞则元素不流，愿同盟协力疏通，并共御深渊之患，使田野与工坊重得生气。"
 DOT_fg_elemental_workshop:0 "元素工坊"
 DOT_fg_elemental_workshop_desc:0 "诸邦各擅一元素，若互通工匠与器用，则风火水雷可以相济，疠疫与荒歉不足以困同盟。"
 DOT_fg_seven_nations_pact:0 "七国盟约"
 DOT_fg_seven_nations_pact_desc:0 "七国异政而同忧，宜立约以平争，凡有征伐必相议，勿使一邦之私念牵动举世之干戈。"
 DOT_fg_dawn_of_teyvat:0 "提瓦特的黎明"
 DOT_fg_dawn_of_teyvat_desc:0 "长夜终有尽时，愿同盟所迎者非新的神座，而是属于人的黎明。"
 DOT_fg_question_of_celestia:0 "天理之问"
 DOT_fg_question_of_celestia_desc:0 "天理高悬久矣，同盟当聚七国之智，问其命数所自来，使人不再以神意为唯一之绳。"
 DOT_fg_abyss_sealed:0 "深渊永锢"
 DOT_fg_abyss_sealed_desc:0 "若深渊终退，愿诸邦不复以干戈相向，共守此土之安宁，使后世但闻黎明，不闻兵甲。"
