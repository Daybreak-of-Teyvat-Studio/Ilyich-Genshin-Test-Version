 #### 等级 / 共振 ####
 SUM_Neo_SGD_T1:"一档：赤王之名只剩传说"
 SUM_Neo_SGD_T1_desc:"一档：赤王之名只剩传说。遗迹荒着，祭礼停了几十年。"
