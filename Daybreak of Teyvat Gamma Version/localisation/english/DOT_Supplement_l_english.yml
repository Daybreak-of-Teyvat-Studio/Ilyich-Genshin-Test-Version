 TUR_a_monopoly_has_been_formed_tt:0 "§YKeçi Ticaret§! has been granted a monopoly over [ROOT.GetNameDef]'s budding industrial base."
 TUR_abdurrahman_gurman:0 "Abdurrahman Gürman"
 TUR_absolutism:0 "Absolutism"
 TUR_absolutism_desc:0 "View not the soil you tread on as mere earth - recognize it! And think about the shroudless thousands who lie so nobly beneath you. You're the glorious son of a martyr - take shame, grieve not your ancestors! Unhand not, even when you're promised worlds, this heavenly homeland."
 TUR_adnan_menderes:0 "Adnan Menderes"
 TUR_ahmet_ali_celikten:0 "Ahmet Ali Çelikten"
 TUR_ali_fuat_cebesoy:0 "Ali Fuat Cebesoy"
 TUR_ali_ihsan_sabis:0 "Ali İhsan Sâbis"
 TUR_ali_orlungat:0 "Ali Örlungat"
 TUR_arctic_wolves_training:0 "Arctic Wolves Training"
 TUR_arctic_wolves_training_desc:0 "Our soldiers shall prowl the snow like wolves hunting prey in the boreal. Through our training, the enemy shall come to fear more than cold in the icy winds."
 TUR_balkan_defense_council_spirit:0 "Balkan Defense Council"
 TUR_balkan_defense_council_spirit_desc:0 "Delegations from every member of the Balkan Entente regularly meet to exchange anecdotes about events in the world and updates on their respective defensive situations. Our shared pool of militaristic knowledge is a great boon to us all."
 TUR_balkan_pact_innovative_transport_techniques:0 "Balkan-wide Innovative Transport Techniques"
 TUR_balkan_pact_innovative_transport_techniques_desc:0 "To better coordinate and facilitate the easy transport of our armies across our many borders, we must as a collective of nations improve our infrastructure. This initiative will hopefully go some lengths in alleviating this hurdle."
 TUR_can_only_have_one_prime_minister_tt:0 "The government can only have one §YPrime Minister§!."
 TUR_cannot_form_kurdish_collaboration_government_tt:0 "§Y[TUR.GetNameDef]§! can never form a Kurdish Collaboration Government."
 TUR_celal_bayar:0 "Celâl Bayar"
 TUR_cemil_cahit_toydemir:0 "Cemil Cahit Toydemir"
 TUR_central_balkan_bank:0 "The Balkan Central Bank"
 TUR_central_balkan_bank_desc:0 "The Balkan Central Bank shall be a forum for the freeflow of materials, commodities, and matters related to commerce for all the nations in the Balkan Pact. Izmir, with time, shall come to rival Frankfurt, Shanghai, and New York as centers of business and trade."
 TUR_central_balkan_bank_wealthy_greece:0 "The Central Balkan Bank of Athens"
 TUR_central_balkan_bank_wealthy_greece_desc:0 "Nobody ever could have predicted that [GRE.GetNameDef] of all countries would be the first one of us to get their financial affairs in such immaculate shape. It was unanimously agreed that the Balkan Central Bank should be founded in Thessaloniki, in light of [GRE.GetAdjective] excellence in fiscal management."
 TUR_communism:0 "Turkish Socialist Republic"
 TUR_communism_ADJ:0 "Ottoman Turkey"
 TUR_communism_DEF:0 "the Turkish Socialist Republic"
 TUR_construct_a_red_navy:0 "A Red Navy"
 TUR_construct_a_red_navy_desc:0 "Without the backing of a strong naval backbone, any attempts to spread a global revolution is doomed to fail."
 TUR_debt_council:0 "Debt Council"
 TUR_debt_council_desc:0 "When the Ottoman Empire was finally confined to the history books, it left us a parting gift: its colossal debt. We owe a great deal of money and assets to the Western powers, but most humiliatingly of all our debt is not even managed here in our country. The Debt Council, in all its infinite wisdom, convenes in France."
 TUR_debt_council_has_no_sway_tt:0 "The §YDebt Council§! has no sway over [ROOT.GetAdjective] economic affairs."
 TUR_debt_council_reined_in_flag:0 "The foreign Debt Council has been reorganized into a national institution"
 TUR_democratic:0 "Republic of Turkey"
 TUR_democratic_ADJ:0 "Ottoman Turkey"
 TUR_democratic_DEF:0 "the Republic of Turkey"
 TUR_disorganised_armed_forces:0 "Disorganized Armed Forces"
 TUR_disorganised_armed_forces_1:0 "Disorganized Armed Forces"
 TUR_disorganised_armed_forces_10:0 "Disorganized Armed Forces"
 TUR_disorganised_armed_forces_10_desc:0 "The Turkish Armed Forces is young much like the country of Turkey itself. Even though our armies emerged from the War of Liberation victorious against the Entente and the Ottomans, our nation paid the price for freedom in blood. There has been little to no enthusiasm for war after losing nearly a quarter of our population in the Great War, but with the spectre of war looming over the world once again it seems that we will have no choice but to either modernize our forces fast, or ensure that the war never reaches our borders."
