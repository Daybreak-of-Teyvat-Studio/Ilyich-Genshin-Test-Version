 SUM_Neo.304.d:"海军学堂在港口开班，教的是风与星。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。"
