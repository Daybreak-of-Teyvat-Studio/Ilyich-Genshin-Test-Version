 SOV_fascist_womens_movement_idea_desc:0 "At the heart of the nationalist movement stands the [ROOT.GetAdjective] woman. Mothers, wives, and daughters of our brave soldiers, organized and ready to support the fight for greatness."
 SOV_for_the_common_good_allies:0 "For the Common Good"
 SOV_for_the_common_good_allies_desc:0 "Every decision made by us or our allies must be aimed at taking a step forward towards the common good."
 SOV_for_the_common_good_subjects:0 "$SOV_for_the_common_good_allies$"
 SOV_for_the_common_good_subjects_desc:0 "Every decision made by our allies is aimed at taking a step forward towards the common good. Thus, we must support these decisions and make sure to follow the guidelines presented to us, even if our sacrifices are not met by an immediate improvement."
