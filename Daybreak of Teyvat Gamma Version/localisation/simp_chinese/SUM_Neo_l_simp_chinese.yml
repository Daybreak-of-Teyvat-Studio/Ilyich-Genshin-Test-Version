 SUM_Neo.248.t:"沙虫觉醒"
 SUM_Neo.248.d:"沉睡的沙虫觉醒，列柱沙原成了它们的猎场。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。教令院的门槛这几天被踩得很低，进去的人比出来的人多。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
