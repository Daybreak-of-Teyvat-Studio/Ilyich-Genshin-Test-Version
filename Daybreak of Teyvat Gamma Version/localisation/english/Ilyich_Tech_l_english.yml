 DOT_Tech.3.t:"Heroic Spirit Summoning"
 DOT_Tech.3.d:"Fill it, fill it, fill it, fill it, fill it!\nMy body shall serve thee, thy sword shall serve my fate; answer the call of destiny. If thou wouldst heed this will and obey this oath, then answer me.\nI shall achieve all good deeds in this world;\nI shall exterminate all evils in this world.\nBreak through the wheel of restraint, appear! Guardian of the scales!"
