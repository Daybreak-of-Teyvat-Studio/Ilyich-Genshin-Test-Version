 NAT_Flower_Feather_Edict_Idea:"羽书自立"
 NAT_Flower_Feather_Edict_Idea_desc:"花羽会下一道羽书令，令写于羽上，由飞龙自高空投下。一日，焱庭驿骑适路过，欲抢在羽书落地前将消息送走。羽书空中盘旋，驿骑打马急奔，眼看将冲过界。花羽会信使立崖上，不慌不忙，候羽书落至驿骑马头前三尺，方开口：「落地矣，汝再走。」驿骑勒马不及，险撞那羽，翻身落马。信使下崖，拾起羽书，展开看了看，对驿骑曰：「本族之令，比汝马快。」驿骑自地上爬起，拍去身上土，牵马绕道去矣。信使将羽书折好，插入腰间羽袋，转身回崖上去。"
