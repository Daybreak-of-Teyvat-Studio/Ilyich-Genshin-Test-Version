 NAT_Plenty_Petition_Idea:"沃陆之邦陈情"
 NAT_Plenty_Petition_Idea_desc:"沃陆之邦欲与焱庭议条款，先将底握于己手。陈情书送出那天，族中长老将田契一摞摞锁入自家仓，又将祭坛钥匙攥于掌心。一后生不解，问老酋：「陈情犹未回，先锁田契何故？」老酋将钥匙在手掂了掂，曰：「候焱庭回文至，田契与钥匙早在吾手，他答不答应，皆须掂量。」后生犹欲问，老酋已走向仓门，扣上末一把锁。陈情信使骑马出谷，扬起一路黄土。老酋立仓前，看那溜烟尘越行越远，直至不见，方将钥匙塞入怀，转身吩咐人将新收颗粒果入仓。"
