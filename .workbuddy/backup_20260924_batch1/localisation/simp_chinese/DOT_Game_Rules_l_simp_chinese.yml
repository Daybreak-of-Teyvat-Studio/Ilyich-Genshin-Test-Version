 #彩蛋国家说明
 ABY_Event.1.t:"§R非常重要：彩蛋国家提示§!"
 ABY_Event.1.d:"亲爱的旅行者，现在提瓦特大陆已经出现了第一个来自异世界的彩蛋国家。由于P社睿智的代码设计，§R如果出现第二个彩蛋国家§!，那么来自天外的邪恶力量将会不断侵蚀你的存档。这是一种类似须弥死域、或层岩巨渊黑泥的力量，它的扩散将会使你的游戏崩溃。所以，请旅行者朋友尽量不要让这件事发生。同时，尽量不要让电脑AI操纵彩蛋国家。P社为原版国家设计了一套AI逻辑，但这套逻辑并不适配于提瓦特世界。最后，彩蛋国家的内容源于P社的设计，我们仅是安排了一个释放彩蛋国家的决议。至于彩蛋国家被释放后，可能会产生一些冲突或问题，例如法国具有拆除马其顿防线的决议，但在提瓦特世界并没有马其顿防线。对于这些问题，我们无法对此负责。我们的主要工作是设计原神世界观下的国家与势力。十分抱歉，还望海涵。最后，我们建议游玩彩蛋国家的朋友§R使用决议，切换国策为通用国策§!，这会让您的存档更加安全。"
 ABY_Event.1.a:"我明白了"
 ABY_Event.2.t:"坦克颂"
 ABY_Event.2.d:"皇穹烈烈兮雷车发，玄铁陆吾兮载震霆。操千钧之璇枢兮，曳长履而碾夜星。左擎朱羽兮右运电戟，喷紫烟以蔽日兮，声殷殷若夔鼓之鸣九京。载我中军之猛士兮，横长野而驱奔鲸。火舌一吐兮穹庐赤，铁雨交驰兮山岳倾。忽敛怒而潜伏兮，草偃偃如无声；俟风师之一麾兮，复腾踏而奔雷霆。嗟乎！斯兽之来，荒榛断，江河溢，六合如沸。既戢戈而偃甲兮，仍眈眈以卫黎氓。愿铸剑为耒兮，与此兽而永宁！"
 ABY_Event.2.a:"美哉！壮哉！"

 #登陆计划
 ABY.3.t:"天空岛的坠落"
 ABY.3.d:"我们击落了天空岛，击败了天理！这是我们的胜利，我们的荣耀，我们的自由！我们不再受制于那些高高在上的神明，不再屈服于他们的法则和命令。我们用我们的力量，我们的智慧，我们的勇气，证明了我们是真正的主宰，我们是新世界的创造者！让我们一起欢呼，一起庆祝，一起迎接新的未来！"
 ABY.3.a:"前进！前进！前进！"
