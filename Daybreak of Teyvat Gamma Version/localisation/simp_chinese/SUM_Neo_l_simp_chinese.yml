 SUM_Neo.15.b:"按自己的判断行事"
 SUM_Neo.16.t:"实验室的来客"
 SUM_Neo.16.d:"愚人众的使者频繁出入实验室，教令院假装没有看见。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。高塔投下的影子越来越长，傍晚时就盖住了半条街。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。实验室的灯整夜没关。"
 SUM_Neo.16.a:"遵循教令院的旧例"
 SUM_Neo.16.b:"听雨林与沙漠的声音"
 SUM_Neo.17.t:"第二席的请帖"
 SUM_Neo.17.d:"第二席的请帖送到大贤者案头，措辞客气，条件苛刻。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。"
 SUM_Neo.17.a:"把卷宗封存"
 SUM_Neo.17.b:"把卷宗摊开"
 SUM_Neo.18.t:"多托雷的提议"
 SUM_Neo.18.d:"多托雷提议用须弥的学者与资源来完成他的实验。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。"
 SUM_Neo.18.a:"按学者的判断行事"
 SUM_Neo.18.b:"按自己的判断行事"
 SUM_Neo.19.t:"沙漠里的工厂"
 SUM_Neo.19.d:"沙漠腹地里冒出愚人众的工厂，烟囱日夜不停。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。教令院的门槛这几天被踩得很低，进去的人比出来的人多。"
 SUM_Neo.19.a:"遵循教令院的旧例"
 SUM_Neo.19.b:"听雨林与沙漠的声音"
 SUM_Neo.20.t:"血的律法"
 SUM_Neo.20.d:"镀金旅团遵守血的律法，血脉与大地相连，饥馑的记忆写在骨子里。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。"
 SUM_Neo.20.a:"把卷宗封存"
 SUM_Neo.20.b:"把卷宗摊开"
 SUM_Neo.21.t:"雇佣兵的契约"
 SUM_Neo.21.d:"佣兵替教令院押运货物，也替沙漠里的部族押运武器。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。"
 SUM_Neo.21.a:"按学者的判断行事"
 SUM_Neo.21.b:"按自己的判断行事"
 SUM_Neo.22.t:"起义的传闻"
 SUM_Neo.22.d:"沙丘间传来起义的传闻，镀金旅团开始聚拢。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。教令院的门槛这几天被踩得很低，进去的人比出来的人多。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。"
 SUM_Neo.22.a:"遵循教令院的旧例"
 SUM_Neo.22.b:"听雨林与沙漠的声音"
 SUM_Neo.23.t:"兰那罗的歌"
 SUM_Neo.23.d:"兰那罗在雨林深处唱歌，只有孩子能听见。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。"
 SUM_Neo.23.a:"把卷宗封存"
 SUM_Neo.23.b:"把卷宗摊开"
 SUM_Neo.24.t:"拉娜的失踪"
 SUM_Neo.24.d:"巡林官拉娜失踪了，据说她跟着兰那罗走进了梦的世界。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。教令院的门槛这几天被踩得很低，进去的人比出来的人多。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。"
 SUM_Neo.24.a:"按学者的判断行事"
 SUM_Neo.24.b:"按自己的判断行事"
 SUM_Neo.25.t:"梦的世界"
 SUM_Neo.25.d:"兰那罗把梦的世界摊开在巡林官面前，那里还留着大慈树王的影子。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。教令院的门槛这几天被踩得很低，进去的人比出来的人多。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。"
 SUM_Neo.25.a:"遵循教令院的旧例"
 SUM_Neo.25.b:"听雨林与沙漠的声音"
 SUM_Neo.26.t:"前路的抉择"
 SUM_Neo.26.d:"三条路摆在须弥面前：迎回神明，把权力交给学者与沙漠民，或者把造神计划做完。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
 SUM_Neo.26.a:"把卷宗封存"
 SUM_Neo.26.b:"把卷宗摊开"

 #################### 甲线 · 圣树加冕 ####################
 SUM_ST_Crown_of_the_Sacred_Tree:"圣树加冕"
 SUM_ST_Crown_of_the_Sacred_Tree_desc:"净善宫的门被推开。被囚五百年的小吉祥草王走出囚笼，须弥的天空第一次为她亮起。"
 SUM_ST_Sanctuary_Open:"开启净善宫"
 SUM_ST_Sanctuary_Open_desc:"守门的卫士接到命令，把净善宫的门打开。"
 SUM_ST_Sanctuary_Free:"解下神的锁链"
 SUM_ST_Sanctuary_Free_desc:"锁链落地。小吉祥草王第一次走出囚室。"
 SUM_ST_Sanctuary_Crown:"草神的冠冕"
 SUM_ST_Sanctuary_Crown_desc:"学者为草神戴上冠冕，不再以看守的身份。"
 SUM_ST_Sanctuary_Court:"神前议政"
 SUM_ST_Sanctuary_Court_desc:"草神临朝，六大学派首座在她面前汇报。"
 SUM_ST_Sanctuary_Monastery:"净善宫僧团"
 SUM_ST_Sanctuary_Monastery_desc:"净善宫恢复旧例，僧人重新诵读古礼。"
 SUM_ST_Sanctuary_Pilgrim:"朝圣之路"
 SUM_ST_Sanctuary_Pilgrim_desc:"通往净善宫的山道上，朝圣者排成长队。"
 SUM_ST_Sanctuary_Shrine:"草神圣所"
 SUM_ST_Sanctuary_Shrine_desc:"草神的圣所在雨林与沙漠各处立起。"
 SUM_ST_Sanctuary_Reform:"神谕改革"
 SUM_ST_Sanctuary_Reform_desc:"草神颁下新的教谕，废去教令院滥权已久的旧条。"
 SUM_ST_Sanctuary_Temple:"神殿重建"
 SUM_ST_Sanctuary_Temple_desc:"荒废的神殿被重新修起，工匠昼夜赶工。"
 SUM_ST_Sanctuary_Doctrine:"神权教义"
 SUM_ST_Sanctuary_Doctrine_desc:"神权教义成文，草神的判断高于一切学派的争辩。"
 SUM_ST_Sanctuary_Clergy:"神职册封"
 SUM_ST_Sanctuary_Clergy_desc:"草神册封新的神职，出身雨林与沙漠的人各占半数。"
 SUM_ST_Sanctuary_Law:"神权法典"
 SUM_ST_Sanctuary_Law_desc:"神权法典颁布，律法以草神之名施行。"
 SUM_ST_Sanctuary_Throne:"神座加冕"
 SUM_ST_Sanctuary_Throne_desc:"小吉祥草王在净善宫加冕。须弥第一次向自己的神明行礼。"
 SUM_ST_Dream_Gate:"梦之门"
 SUM_ST_Dream_Gate_desc:"虚空终端关闭之后，须弥人重新做起梦来。"
 SUM_ST_Dream_Sabzeruz:"花神诞祭重开"
 SUM_ST_Dream_Sabzeruz_desc:"花神诞祭恢复为国之盛典，不再只是学者的表演。"
 SUM_ST_Dream_Night:"长夜与梦"
 SUM_ST_Dream_Night_desc:"长夜里，梦重新回到每个人枕边。"
 SUM_ST_Dream_Mushroom:"梦蕈"
 SUM_ST_Dream_Mushroom_desc:"雨林里的蘑菇吸着梦的气息生长，成为新的药材。"
 SUM_ST_Dream_Theater:"梦剧场"
 SUM_ST_Dream_Theater_desc:"妮露在剧场里演花神，观众里有学者，也有剃了发的沙民。"
 SUM_ST_Dream_Dance:"花神之舞"
 SUM_ST_Dream_Dance_desc:"花神之舞重新编排，舞者从雨林与沙漠一同选出。"
 SUM_ST_Dream_Song:"兰那罗的歌谣"
 SUM_ST_Dream_Song_desc:"兰那罗的歌谣被记成文字，收进须弥的典籍。"
 SUM_ST_Dream_Record:"梦的记录"
 SUM_ST_Dream_Record_desc:"学者开始记录每个人的梦，作为研究的材料。"
 SUM_ST_Dream_School:"梦的学派"
 SUM_ST_Dream_School_desc:"妙论派的画师与素论派的天象学者合开一门梦的学问。"
 SUM_ST_Dream_Heal:"以梦疗伤"
 SUM_ST_Dream_Heal_desc:"医者用梦安抚战争与饥荒留下的旧伤。"
 SUM_ST_Dream_Memory:"回忆的滋味"
 SUM_ST_Dream_Memory_desc:"绿洲里的人们把旧日回忆端上桌，与旅人分享。"
 SUM_ST_Dream_Truth:"梦中的真相"
 SUM_ST_Dream_Truth_desc:"草神在梦中向学者展示世界树被涂抹的那一段记忆。"
 SUM_ST_Dream_Eternal:"永续之梦"
 SUM_ST_Dream_Eternal_desc:"须弥进入一个长梦。梦里没有饥荒，也没有遗忘。"
 SUM_ST_Ara_Meet:"与兰那罗相遇"
 SUM_ST_Ara_Meet_desc:"草神亲自带着学者走进雨林，与兰那罗见面。"
 SUM_ST_Ara_Hymn:"兰那罗的赞美诗"
 SUM_ST_Ara_Hymn_desc:"兰那罗的赞美诗被译成须弥文字流传。"
 SUM_ST_Ara_Vana:"维摩庄的梦"
 SUM_ST_Ara_Vana_desc:"维摩庄的孩子们重新听见兰那罗的声音。"
 SUM_ST_Ara_Rana:"拉娜归来"
 SUM_ST_Ara_Rana_desc:"失踪的拉娜回到村中，带回兰那罗托付的种子。"
 SUM_ST_Ara_Seed:"兰那罗的种子"
 SUM_ST_Ara_Seed_desc:"那颗枯萎的种子被埋在禅那园，等待重新发芽。"
 SUM_ST_Ara_Flower:"那菈花"
 SUM_ST_Ara_Flower_desc:"那菈花在雨林边缘开放，兰那罗称它为约的信物。"
 SUM_ST_Ara_Kusava:"俱利伽罗的草"
 SUM_ST_Ara_Kusava_desc:"俱利伽罗的草被采作药材，医治被禁忌知识侵蚀的人。"
 SUM_ST_Ara_Kalpalata:"劫波莲"
 SUM_ST_Ara_Kalpalata_desc:"劫波莲只在梦最深处开放，兰那罗把它献给草神。"
 SUM_ST_Ara_World:"梦的世界"
 SUM_ST_Ara_World_desc:"草神与兰那罗共同守护梦的世界，须弥的梦境有了边界。"
 SUM_ST_Ara_King:"兰那罗之王"
 SUM_ST_Ara_King_desc:"兰那罗选出新的王，替所有兰那罗说话。"
 SUM_ST_Ara_Alliance:"兰那罗同盟"
 SUM_ST_Ara_Alliance_desc:"兰那罗与须弥立盟，守护雨林的根。"
 SUM_ST_Ara_Blessing:"兰那罗的祝福"
 SUM_ST_Ara_Blessing_desc:"兰那罗的祝福落在须弥每一棵树上。"
 SUM_ST_Ara_Covenant:"绿荫之约"
 SUM_ST_Ara_Covenant_desc:"绿荫之约立下：凡兰那罗所守之林，须弥不伐。"
 SUM_ST_Tree_Root:"世界树的根"
 SUM_ST_Tree_Root_desc:"世界树的根系贯通须弥全境，草神说那是记忆的血管。"
 SUM_ST_Tree_Dream:"世界树的梦"
 SUM_ST_Tree_Dream_desc:"世界树也有梦，梦里是大慈树王还在的日子。"
 SUM_ST_Tree_Rukkhadevata:"大慈树王的遗产"
 SUM_ST_Tree_Rukkhadevata_desc:"大慈树王留下的东西不多，一条被涂抹的印记，一段无人记得的名字。"
 SUM_ST_Tree_Irminsul:"伊尔明苏尔的低语"
 SUM_ST_Tree_Irminsul_desc:"世界树在低语，说的是五百年前那场遗忘。"
 SUM_ST_Tree_Memory:"被抹去的记忆"
 SUM_ST_Tree_Memory_desc:"草神想起一个名字，写下之后又亲手抹去。"
 SUM_ST_Tree_Recall:"唤回旧名"
 SUM_ST_Tree_Recall_desc:"她试图把自己的名字写回世界树，笔停在半空。"
 SUM_ST_Tree_Wither:"枯萎的枝"
 SUM_ST_Tree_Wither_desc:"世界树有一枝正在枯萎，学者找不到原因。"
 SUM_ST_Tree_New:"新生的白枝"
 SUM_ST_Tree_New_desc:"枯枝旁长出新的白枝，草神说那是须弥自己长出来的。"
 SUM_ST_Tree_Scroll:"树下的典籍"
 SUM_ST_Tree_Scroll_desc:"世界树下埋着的典籍被挖出，写满了无人能读的字。"
 SUM_ST_Tree_Sage:"树王的智慧"
 SUM_ST_Tree_Sage_desc:"树王的智慧被整理成册，成为须弥学派的共同根基。"
 SUM_ST_Tree_Light:"净化之光"
 SUM_ST_Tree_Light_desc:"净化之光照进世界树的裂隙，死域退去。"
 SUM_ST_Tree_Truth:"树的真相"
 SUM_ST_Tree_Truth_desc:"须弥人终于知道，草神不是第一代草神。"
 SUM_ST_Tree_Eternal:"常青的圣树"
 SUM_ST_Tree_Eternal_desc:"世界树常青。它的根须之下，是新旧两位草神共同的记忆。"
 SUM_ST_Rain_Watch:"雨林守望"
 SUM_ST_Rain_Watch_desc:"巡林队扩编，雨林的边界第一次有了常设的守望。"
 SUM_ST_Rain_Ranger:"巡林官扩编"
 SUM_ST_Rain_Ranger_desc:"提纳里成了巡林官之首，手下多是雨林里长大的猎人。"
 SUM_ST_Rain_Patrol:"雨林巡逻"
 SUM_ST_Rain_Patrol_desc:"巡林官沿着叶脉一样的小径巡逻。"
