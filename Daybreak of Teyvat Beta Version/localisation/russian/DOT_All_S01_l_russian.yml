# l_simp_chinese: New file
DOT_Activity_decisions:0 "Праздник Земного Мира"
DOT_Activity_decisions_desc:0 "«Праздник Земного Мира» — это проект, направленный на укрепление культурного обмена и сотрудничества между разными странами и регионами. Проект инициирован Семью Архонтами Тейвата и ежегодно приглашает художников, учёных, предпринимателей, спортсменов и общественных деятелей со всего мира. Основные мероприятия включают: выставки, лекции, мастер-классы, представления, встречи, спортивные соревнования и т.д. Участники могут познакомиться с разными культурами, ценностями и инновационным мышлением, а также установить дружеские отношения и механизмы сотрудничества. Цели: углубление взаимопонимания и уважения между народами, содействие интеграции и развитию культурного многообразия, продвижение мира и прогресса на континенте."
########################
Nilotpala_Cup_Beast_Tamers_Tournament_01:0 "Организация турнира дрессировщиков зверей «Кубок Нилотпалы»"
Nilotpala_Cup_Beast_Tamers_Tournament_01_desc:0 "Тейват — мир, полный фантазий и приключений, где обитают таинственные существа, называемые плесенниками, состоящие из грибов и других растений, с разнообразными формами и способностями. В Тейвате проводится грандиозный турнир «Кубок Нилотпалы», целью которого является поиск лучшего дрессировщика плесенников. Участники со своими плесенниками проходят испытания и показывают мастерство и взаимопонимание, чтобы выявить победителя. Призовой фонд составляет 10 миллионов Моры, цель — привлечь внимание к плесенникам. Турнир — это увлекательное приключение и путешествие в мир природы.\nКак организаторы, мы получим преимущество домашней арены и больше шансов на победу."

Nilotpala_Cup_Beast_Tamers_Tournament_02:0 "Подготовка к «Кубку Нилотпалы»"
Nilotpala_Cup_Beast_Tamers_Tournament_02_desc:0 "Идёт подготовка к турниру «Кубок Нилотпалы». Чтобы повысить шансы на победу, мы можем вложить дополнительные усилия в подготовку. Однако даже при тщательной подготовке победа не гарантирована. В настоящее время количество наших победных очков: §Y[?THIS.DOT_PRIcup_Point]§!"
#，全世界胜利分数总和为§Y[?global.DOT_PRIcup_SUMPoint]§!
Nilotpala_Cup_Preing:0"Этап подготовки к «Кубку Нилотпалы»"
Nilotpala_Cup_Preing_desc:0"Мы узнали, что идёт подготовка к турниру «Кубок Нилотпалы». Это отличная возможность показать миру наше мастерство. Наши победные очки: §Y[?THIS.DOT_PRIcup_Point]§!"

Nilotpala_Cup_Beast_Tamers_Tournament_03:0 "Турнир «Кубок Нилотпалы» в разгаре"
Nilotpala_Cup_Beast_Tamers_Tournament_03_desc:0 "Турнир «Кубок Нилотпалы» в самом разгаре. Участники используют сферы для захвата и тренировки плесенников, чтобы соревноваться за 10 миллионов Моры. Турнир привлекает искателей приключений и зрителей со всего мира, делая плесенников центром внимания. Хотите ли вы присоединиться к этому захватывающему состязанию и испытать радость танца с плесенниками?"
Spend_Five_Million_Mora:0 "Потратить пять миллионов Моры"
Enter_Nilotpala_Cup_Beast_Tamers_Tournament:0 "Отправить делегацию на турнир «Кубок Нилотпалы»"
DOT_Activity.1.t:0 "Турнир «Кубок Нилотпалы»"
DOT_Activity.1.d:0 "\nТурнир «Кубок Нилотпалы» прошёл успешно, давайте поздравим нового чемпиона! Это было невероятное соревнование. Участники использовали сферы для захвата, тренировки и управления милыми плесенниками в захватывающих битвах. Турнир не только продемонстрировал уникальную культуру Сумеру, но и укрепил связи между регионами, способствуя культурному обмену и сотрудничеству. Ждём следующего турнира и желаем участникам и их плесенникам новых открытий в этом удивительном мире!\n" 
DOT_Activity.1.a:0 "Ждём следующего турнира!"

DOT_Activity.2.t:0 "Мы выиграли «Кубок Нилотпалы»!"
DOT_Activity.2.d:0 "После ожесточённой борьбы наша команда одержала победу на «Кубке Нилотпалы»! Участники со всего мира аплодировали нашей победе, жители нашей страны прославляют дрессировщиков как героев, и уже начались продажи сувениров с нашими плесенниками. Это славный день!"
DOT_Activity.2.a:0 "Мы — чемпионы!"

DOT_Activity.3.t:0 "Турнир «Кубок Нилотпалы» завершён"
DOT_Activity.3.d:0 "Турнир «Кубок Нилотпалы» завершился. Хотя наша команда не победила, каждый пот и слеза дрессировщиков и плесенников останутся в нашей памяти. После турнира участники с сожалением покидали арену, отправляясь домой на поездах и кораблях.\nНекогда оживлённая арена теперь пуста, но воспоминания о турнире навсегда останутся в сердцах людей."
DOT_Activity.3.a:0 "Прощай, прощай!"

Nilotpala_Cup_Beast_Tamers_Tournament_Champion:0 "Чемпион турнира «Кубок Нилотпалы»"
Nilotpala_Cup_Beast_Tamers_Tournament_Champion_desc:0 "Тейват — мир, полный фантазий и приключений, где обитают таинственные существа, называемые плесенниками, состоящие из грибов и других растений, с разнообразными формами и способностями. В Тейвате проводится грандиозный турнир «Кубок Нилотпалы», целью которого является поиск лучшего дрессировщика плесенников. Участники со своими плесенниками проходят испытания и показывают мастерство и взаимопонимание, чтобы выявить победителя."
Nilotpala_Cup_Beast_Tamers_Tournament_Champion_Get:0 "§YТаинственный участник стал чемпионом турнира «Кубок Нилотпалы» и получил 10 миллионов Моры§!"
NCup_Train_Beast:0"Тренировка плесенников"
NCup_Train_Beast_desc:0"На арене побеждает сила."
NCup_Feed_Beast:0"Приготовление желе"
NCup_Feed_Beast_desc:0"Мы потратим немного средств на вкусное угощение для плесенников, чтобы они лучше проявили себя в бою."
NCup_Fight_Beast:0"Дружеские соревнования"
NCup_Fight_Beast_desc:0"Мы проведём дружеские соревнования с другими командами, желающими участвовать в «Кубке Нилотпалы», чтобы повысить уровень всех участников."
NCup_Special_Beast:0"Специальное финансирование"
NCup_Special_Beast_desc:0"Судьи любят деньги, а мы любим славу. Разве мы не на одной стороне?"
NCup_Hidden_Beast:0"Тайные операции"
NCup_Hidden_Beast_desc:0"Немного особого угощения может помочь нашим соперникам проявить себя... например, быть побеждёнными с одного удара или упасть в обморок."

