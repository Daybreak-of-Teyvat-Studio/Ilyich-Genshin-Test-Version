 TUR_a_monopoly_has_been_formed_tt:0 "§Yケチ貿易§!が[ROOT.GetNameDef]に芽生えつつある産業基盤に対して独占権を与えられている。"
 TUR_abdurrahman_gurman:0 "アブドルラハマーン・ギュルマン"
 TUR_absolutism:0 "絶対主義"
 TUR_absolutism_desc:0 "踏みつけた土をただの土と見るのではなく、しっかりと認識するのです。あなたの下に気高く横たわる数千もの人々を。あなたは栄光ある殉教者たちの息子です。恥と言うものを知り、祖先を決して悲しませてはなりません。祖先との絆を離してはなりません。約束の地、天上の世界に赴くとしても。"
 TUR_adnan_menderes:0 "アドナン・メンデレス"
 TUR_ahmet_ali_celikten:0 "アフメト・アリ・チェリクテン"
 TUR_ali_fuat_cebesoy:0 "アリ・フアト・ジェベソイ"
 TUR_ali_ihsan_sabis:0 "アリ・イフサン・サービス"
 TUR_ali_orlungat:0 "アリ・オルルンガト"
 TUR_arctic_wolves_training:0 "極北群狼演習"
 TUR_arctic_wolves_training_desc:0 "我が軍の兵士は雪中を北極圏で獲物を狩る狼のようにさまよう。厳しい訓練により、標的は凍てつく風の寒さを上回る恐怖を感じることになるだろう。"
 TUR_balkan_defense_council_spirit:0 "バルカン防衛評議会"
 TUR_balkan_defense_council_spirit_desc:0 "バルカン協商の各加盟国の代表団は定期的に会合を開き、世界情勢についての報告や、それぞれの防衛状況についての最新情報を交換している。加盟国間の軍事知識の共有は、加盟国全員にとって大きな恩恵となっている。"
 TUR_balkan_pact_innovative_transport_techniques:0 "バルカン全域の革新的輸送技術"
 TUR_balkan_pact_innovative_transport_techniques_desc:0 "より良い調整と取り決めにより、容易に我が軍の越境移動を可能とするため、我々は国家の集合体としてインフラを改善すべきだ。この主導権が功すれば、いくつかの障壁が緩和されるだろう。"
 TUR_can_only_have_one_prime_minister_tt:0 "政府に§Y首相§!が一人だけである。"
 TUR_cannot_form_kurdish_collaboration_government_tt:0 "§Y[TUR.GetNameDef]§!はクルド人の協力政府を設立できない。"
 TUR_celal_bayar:0 "ジェラル・バヤル"
 TUR_cemil_cahit_toydemir:0 "ジェミル・ジャヒト・トイデミル"
 TUR_central_balkan_bank:0 "バルカン中央銀行"
 TUR_central_balkan_bank_desc:0 "バルカン中央銀行は、材料、商品、バルカン条約加盟国の商業に関連する事項の自由な公開市場とせねばならない。イズミルは時間を経て、ビジネスと交易に中心地として、フランクフルト、上海、ニューヨークに匹敵するだろう。"
 TUR_central_balkan_bank_wealthy_greece:0 "アテネ中央バルカン銀行"
 TUR_central_balkan_bank_wealthy_greece_desc:0 "全ての国の[GRE.GetNameDef]が我々の中で財務状態が完全な状態になるのが最も早いとは誰も予測できなかっただろう。バルカン中央銀行は、[GRE.GetAdjective]の財政運営の優秀さに鑑み、テッサロニキに設立されるべきと全会一致で合意した。"
 TUR_communism:0 "トルコ社会主義共和国"
 TUR_communism_ADJ:0 "トルコ"
 TUR_communism_DEF:0 "トルコ社会主義共和国"
 TUR_construct_a_red_navy:0 "赤軍海軍"
 TUR_construct_a_red_navy_desc:0 "強力な海軍の後ろ盾がなければ、世界革命を拡散する試みは失敗に終わるだろう。"
 TUR_debt_council:0 "債務評議会"
 TUR_debt_council_desc:0 "オスマン帝国が歴史の1ページになったと同時に、我々に置土産を残した。莫大な債務だ。我々は西欧列強に多額の資金と資本を借り入れており、何より屈辱的なのは、債務の管理は我が国の権限で行うことが出来ないのだ。無限の智慧を持つ債務評議会がフランスにおいて開催される。"
 TUR_debt_council_has_no_sway_tt:0 "§Y債務評議会§!が[ROOT.GetAdjective]経済へ影響を与えていない。"
 TUR_debt_council_reined_in_flag:0 "他国の債務評議会が国営へと再編された"
 TUR_democratic:0 "トルコ共和国"
