 Rock_with_Covenant_Harbor:"岩与契约的海港"
 Rock_with_Covenant_Harbor_desc:"君至璃月港矣。于此地卖日落果亦能获厚利。然纵利不入，亦勿违与璃月人所立之任何契约，违者之果，君必不欲知之。除此外，惟有享七星治下无边之繁华而已。绯云坡酒旗相望，白驹逆旅灯火达旦，行旅至此，皆愿少留三日。"
 Please_Immortal_Ceremony:"请仙典仪"
 Please_Immortal_Ceremony_desc:"此璃月一年一度之盛事！岩王帝君今年所赐神谕，必使璃月愈盛！万众翘首，以待鹤书之降，其喜可知也。"
 Send_Rock_Emperor_to_the_Guillotine:"送岩王帝君上断头台"
 Send_Rock_Emperor_to_the_Guillotine_desc:"岩王帝君竟至若此！孰有如此之胆？孰有如此之神力？众人虽不愿信，然帝君确已崩殂，且以如此之形式。自此以后，其事难矣。市井喧传，茶肆罢论，皆曰：神且不免，何况于人。"
 Set_up_a_Task_Force:"成立紧急专案组"
 Set_up_a_Task_Force_desc:"无论何人，无论其意何居，弑摩拉克斯阁下之罪一也。今所当为，惟执凶手而正其法，以此安定璃月大局。玉京台缉榜晨出，观者如堵，赏格之重，为百年来所未有。"
 Hide_the_Sky_and_Cross_the_Sea:"瞒天过海"
 Hide_the_Sky_and_Cross_the_Sea_desc:"此或为璃月转于人治之良机。然此举恐激绝云间之仙众，亦负尽心千年之帝君。然璃月总须前行，不然奈何？众人密议于群玉阁深处，阁门三重，侍者皆屏退。"
 Send_the_Immortal_Ceremony:"送仙典仪"
 Immortals_Inquiries:"兴师问罪"
 Immortals_Inquiries_desc:"兴师问罪"
 The_First_Civil_War_of_Liyue:"第一次璃月内战"
 The_First_Civil_War_of_Liyue_desc:"凝光处置帝君遇刺之策既败，全面之危随至：仙人不平，官吏离心，平民怨望，皆起而攻之，其下台乃必然之势。然所患不止于此，帝君之死，并引爆璃月积年之矛盾：刻晴麾下之工人、甘雨所率之官僚、绝云间之仙众，三方相峙，一触即发。碧水原道上车马日夜不绝，皆载兵粮；轻策庄乡勇结队而守，门书保境二字。"
 War_and_Peace:"璃月：摩拉克斯的遗产"
 War_and_Peace_desc:"璃月各派之争，终至全面爆发之日。甘雨自璃月叛走，入于绝云间。仙家初愕然，继而闻七星隐帝君之死，震怒遂起。既纳被迫害之极端帝君信徒一批，仙人乃兴问罪之师，讨璃月七星。刻晴闻之，即于璃月港夺权，编人类之部，整械备战，以抗仙人之攻。甘雨则率不与刻晴合作之商人、官吏、千岩军一部北上，屯于天衡山一线，南望而蓄势。三方鼎立，战云密布。归离原之田，麦熟而无人刈；石门关吏昼夜不辍，验讫之印用坏者三。父老相语曰：往年迎神，今年迎兵，世道如之何。"
 Seven_Star_Revolutionary_Committee:"七星革命委员会"
 Immortal_Heavenly_Palace:"三眼五显仙人"
 Yuehai_Pavilion_Eight_Provinces_Alliance:"月海亭八省联盟"
Seven_Star_Revolutionary_Committee_desc:"岩王帝君既崩，举市缟素，玉衡星刻晴独曰：此乃人治之机，失之不复。夫璃月之制，神在则人赖其扶，神去则制如朽柱，譬如跛者行于玉京台石阶，无杖则仆。凝光新政之败，已彰其验：百年旧制，非和平更革所能济，必以§t革命§!断之。刻晴乃出其蓝图：新制既立，则财货均输，人尽其才，昔者万政决于神明一谕，今者万政成于市井之议。其署在玉京台东，门无饰，惟悬木牌一，访者日数十，夜则灯不熄。市人闻之，或疑或惧，豪商闭户自守，仙人观望不语。刻晴曰：人不自救，孰能救之？于是七星光下，革命委员会立。总务司吏有投之者，携旧牍一箱，云新制之下，当以能授职，不以族。绯云坡茶肆中，日夜有人论其策，论久则争，争罢各散。§t高举启明之旗帜，追随玉衡星刻晴！§!"
Immortal_Heavenly_Palace_desc:"帝君遇刺，凡人当政，政令频出而乱象愈滋，人治未尝予人自由，反添创痕。于是众仙会于绝云间，共议曰：岩王帝君之遗产，不可委于眼高手低之辈，任其败坏。议定，仙之追随者、帝君旧部、仙力所化之走兽、自动作战之金人，皆已部署完毕。申鹤白衣仗剑，立于仙家宫殿之前，誓曰：吾等起兵，非为夺位，乃为庇民。凡人当受庇护，免于世间之险，如婴儿之倚母。奥藏山云雾所锁，宫阙隐于其中，山径惟仙人可识。山下村镇有老者焚香北望，云仙家旌旗一日不倒，璃月一日不乱。§8复兴仙家盛世，追随仙使申鹤！§!"
Yuehai_Pavilion_Eight_Provinces_Alliance_desc:"当此干戈将起之际，犹有人信璃月当以平稳之道行于未来，其人即半仙甘雨，月海亭之领袖，璃月政务之枢也。彼半人半仙，处两间而通两心：人之所欲，仙之所虑，皆了然于胸。又供职数百年，案牍之事，无不谙熟，深知调和乃璃月之福，相争则两伤。凡厌乱恶斗之士，无论官商，无论仙凡，皆集其麾下，以待其时。月海亭在璃月港高处，亭中案上牍分三色，朱者当日必毕。甘雨每议至夜，铃动则众散，惟其独留，秉烛披牍。仙凡之争方炽，两边皆有书致之，彼皆不答，惟批：容缓图之。§B为璃月众生之福祉，追随总秘书甘雨！§!"
