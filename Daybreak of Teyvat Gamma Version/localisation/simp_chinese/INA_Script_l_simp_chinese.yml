 INA_meiairdesigner_focus:0 "一心流航空设计司"
 INA_meiairdesigner_focus_desc:0 "一心流航空设计司，雷电五传之一，一心传的工匠将为我们重建空中舰队"
 INA_mei_fighter_focus:0 "空中格斗"
 INA_mei_fighter_focus_desc:0 "狂风，臣服于我！" 
 INA_lightfirepower:0 "改进火炮工艺"
 INA_lightfirepower_desc:0 "新式火炮工业，降低成本"
 INA_heavyfirepower:0 "精炼火药"
 INA_heavyfirepower_desc:0 "新式炮弹能极大的提高我们的支援效率。"
 INA_heavyfirepower_effect_tooltip:0 "使得火炮支援连攻击，装甲杀伤+25%，并提升火炮支援连5点HP."
 INA_firepowerstandard:0 "标准化火炮"
