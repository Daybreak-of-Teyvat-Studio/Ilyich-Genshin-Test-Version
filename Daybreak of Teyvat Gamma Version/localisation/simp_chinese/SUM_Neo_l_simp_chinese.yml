 SUM_SGS_PRO_Sage_Rashnu:"拉什努的判词"
 SUM_SGS_PRO_Sage_Rashnu_desc:"拉什努是矫论团里断事的人，判词从不说谁对，只说往后怎么过。"
 SUM_Neo_SGS.8.t:"拉什努的判词"
 SUM_Neo_SGS.8.d:"拉什努是矫论团里断事的人，判词从不说谁对，只说往后怎么过。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
