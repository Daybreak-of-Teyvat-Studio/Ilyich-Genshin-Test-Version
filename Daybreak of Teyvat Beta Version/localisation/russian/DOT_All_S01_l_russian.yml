 Weapon_Wish:0 "Молитва о оружии"
 For_Knight:0 "Орден Рыцарей Запада"
 Thunder_Sword:0 "Удар"
 Thunder_Sword_desc:0 "Матери рассказывают детям легенды о Сёгуне, а солдаты идут в бой с криком «Да будет путь велик». Имя Сёгуна стало верой Инадзумы."
 Great_Unity:0 "Единство, воля народа"
 Great_Unity_desc:0 "Река времени течёт, в ней тонут герои. Горы и реки вечны, а закаты бесконечны."
 Daybreak_of_Teyvat:0 "Рассвет"
 Daybreak_of_Teyvat_desc:0 "Ночь уходит, свет грядёт"
 Polar_Night:0 "Полярная ночь"
 Polar_Night_desc:0 "Небо темно, солнца и луны нет"
 Polar_Night_Meeting:0 "Собрание Полярной ночи"
 Polar_Night_Meeting_desc:0 "После собрания Тейват погрузится в войну."
 idea_Teyvat_People:0 "Народ земли"
 idea_Teyvat_People_desc:0 "В древности кровь Паньгу стала реками, а тело Пруши стало миром. Первый человек создал мир, и боги даровали людям цивилизацию. Но алчность привела к войне и гибели. Цивилизация возродилась, и люди, веря в богов, получили силу стихий. Боги избирают лучших из людей."

traveler:0 "Путешественник"
traveler_desc:0 "Путешественник"
Heroes_of_Night:0 "Герой ночи"
Heroes_of_Night_desc:0 "Четыре года спустя Дилюк вернулся в Мондштадт и стал владельцем «Виноградника Рассвет». Его возвращение прошло незамеченным, так как внимание горожан было приковано к таинственному защитнику города. Его называли «Герой ночи». Дилюк не любил это прозвище."
Swirling_Dance_of_Foam:0 "Танец пены"
Swirling_Dance_of_Foam_desc:0 "Как капитан партизанского отряда Ордена Рыцарей Запада и известная «Пенная Рыцарь», Эола часто патрулирует и имеет множество заслуг. Рыцари в горах часто становятся мишенью монстров, но Эола быстро приходит на помощь и устраняет угрозы, даже атакуя оплоты Ордена Бездны. Но её происхождение — она последняя из рода Лоуренсов — делает её изгоем. Она порвала с семьёй и вступила в Орден. Из-за предрассудков к ней относятся несправедливо, видя в ней «опасную личность». Годы опыта заставили Эолу воздвигнуть невидимый щит. «Месть» — это лишь внешний аспект этого щита. Только отбросив слухи, можно увидеть её истинную суть."
Shining_Idols:0 "Сияющий идол"
Shining_Idols_desc:0 "Барбара — молитвенница Ордена Рыцарей Запада и идол Мондштадта. Увидев её, люди чувствуют себя лучше. Она лечит водой и пением, но её главная магия — это усердный труд."


