 AI_MESSAGE_category2_MES2_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Пройдёт время, и на улицах [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName] будут петь только эпосы о моём [?global.trashtalk_own_country_tag_box1.GetAdjective] величии." #both
 AI_MESSAGE_category2_MES3_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Взгляните на этих разрозненных [?global.trashtalk_other_country_tag_box1.GetAdjective] вояк, осмелившихся бросить вызов моим закалённым в боях [?global.trashtalk_own_country_tag_box1.GetAdjective] элитным войскам. Если бы не предрешённый исход, зрелище было бы ироничным."
 AI_MESSAGE_category2_MES4_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: И это вы называете войной, [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName]? В моих глазах — то же, что убрать колючки с дороги."
 AI_MESSAGE_category2_MES5_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Хорошенько заботьтесь о своих [?global.trashtalk_other_country_tag_box1.GetAdjective] мастерских, скоро они будут ковать оружие для меня."
 AI_MESSAGE_category2_MES6_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Слышите, [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName]? Это эхо моих шагов, сокрушающих ваши границы."
 AI_MESSAGE_category2_MES7_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Эй, [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName], если бы ваши генералы умели строить боевые порядки, а не разбегаться как стадо, сводки были бы интереснее?"
 AI_MESSAGE_category2_MES9_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: В это время года пейзажи [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName] особенно хороши. Мои солдаты наслаждаются ими как наградой."
 #winning and lightly losing?
 AI_MESSAGE_category2_MES8_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Пф, смотрите-ка, [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName] выстроились в боевой порядок! Словно стая слаймов атакует скалу."
 AI_MESSAGE_category2_MES10_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Сдавайтесь скорее, [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName]! Бесполезное сопротивление приведёт лишь к ненужным жертвам."
 #Country loses
 AI_MESSAGE_category3_MES1_BOX1:1"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName] наверняка прибегли к силе Бездны! Честные солдаты не могут одержать такую победу!"
 AI_MESSAGE_category3_MES2_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Это нечестно! Солдаты [?global.trashtalk_other_country_tag_box1.GetAdjective] словно благословлены богами, а мои [?global.trashtalk_own_country_tag_box1.GetAdjective] воины — словно ослаблены!"
 AI_MESSAGE_category3_MES3_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Хм, в мире ещё много неисследованных мест, кто захочет зацикливаться на таких мелочах."
 AI_MESSAGE_category3_MES4_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Если бы не глупость моих союзников, а враги не видели бы нити судьбы, мои благородные легионы не пали бы перед уловками [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName]!"
 AI_MESSAGE_category3_MES5_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Крик, полный гнева и древних проклятий... Этот позор, [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName], я клянусь вечностью, что больше никогда не вступлю с вами в союз!!!"
 AI_MESSAGE_category3_MES6_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: На этот раз вы победили, [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName]. В будущем надеюсь на более равный бой."
 AI_MESSAGE_category3_MES7_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Увы, аномалия в линиях земли в ключевом месте решила исход. Неудивительно, что мы проиграли [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName]."
 AI_MESSAGE_category3_MES8_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: О? Неужели звёзды благоволили [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName]? Иначе бой был бы более справедливым!"
 AI_MESSAGE_category3_MES9_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: В эпоху богов война была более прямой. По тем правилам, [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName] не смогли бы победить такими уловками."
 AI_MESSAGE_category3_MES10_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Да, в решающий момент удача была не на моей стороне. Поэтому и случилось поражение от [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName]. Даже лучшие планы бессильны перед капризами судьбы."
 #Complaining about own allies
 AI_MESSAGE_category4_MES1_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Пусть все запомнят, что [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName] предали союз, нарушив клятву."
 AI_MESSAGE_category4_MES2_BOX1:0"[?global.trashtalk_own_country_tag_box1.GetFlag][?global.trashtalk_own_country_tag_box1.GetLeader]: Можно ли исключить [?global.trashtalk_other_country_tag_box1.GetNonIdeologyName] из союза? Даже наёмники Позолоченной свиты надёжнее таких союзников."

 # BOX2

 AI_MESSAGE_category1_MES1_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Искусство управления поистине открывает глаза, вы умудрились уступить свою страну и власть, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]. Такой «подвиг» станет прекрасным материалом для сатиры историков семи государств."
 AI_MESSAGE_category1_MES2_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Хе... [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName], ваши советники, видно, учатся стратегии у хиличурлов?"
 AI_MESSAGE_category1_MES3_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Похоже, вы ничего не смыслите в военном деле и управлении стихиями, [?global.trashtalk_other_country_tag_box2.GetAdjective] птенцы. Начните с карт."
 AI_MESSAGE_category1_MES4_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Видеть крушение обороны [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] — зрелище, не вызывающее даже скуки."
 AI_MESSAGE_category1_MES5_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Управление государством и баланс интересов явно не ваша стихия, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]. Лучше займитесь торговлей в порту или на рынке Ли Юэ."
 AI_MESSAGE_category1_MES6_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Сильно сомневаюсь, что армия [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] проводила хотя бы один совместный учение. Беспорядок, как у банды Похитителей сокровищ."
 AI_MESSAGE_category1_MES7_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Взгляните на эти богатые земли [?global.trashtalk_other_country_tag_box2.GetAdjective] с их линиями земли — теперь они мои. Старые хозяева не умели ценить дары."
 AI_MESSAGE_category1_MES8_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Слушайте, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName], в следующий раз научите своих солдат целиться во врага, а не в небо. Этот град стрел был просто смешон."
 AI_MESSAGE_category1_MES9_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Почему в [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] слышны стоны? Потому что их знамя и законы стали историей."
 AI_MESSAGE_category1_MES10_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Создавать новый дом для моих подданных и направлять благословения земли — истинная радость. Понимаете ли вы это, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]?"
 AI_MESSAGE_category2_MES1_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Моё наступление подобно приливу, сметающему все ваши укрепления и славу, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]!"
 AI_MESSAGE_category2_MES2_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Скоро на улицах [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] будут петь только о моей [?global.trashtalk_own_country_tag_box2.GetAdjective] славе."
 AI_MESSAGE_category2_MES3_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Взгляните на этих [?global.trashtalk_other_country_tag_box2.GetAdjective] вояк, осмелившихся бросить вызов моим закалённым в войнах богов [?global.trashtalk_own_country_tag_box2.GetAdjective] легионам. Их слепое сопротивление достойно... трагикомедии."
 AI_MESSAGE_category2_MES4_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Это и есть ваша тотальная война, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]? В моих глазах её ценность не больше, чем уборка руин Стража руин."
 AI_MESSAGE_category2_MES5_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Берегите свои [?global.trashtalk_other_country_tag_box2.GetAdjective] кузницы, скоро они будут ковать мечи и доспехи для моих войск."
 AI_MESSAGE_category2_MES6_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Слышите, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]? Это ветер доносит стоны ваших рушащихся крепостей и падающих пограничных столбов — прелюдию к моей победе."
 AI_MESSAGE_category2_MES7_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Эй, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName], если бы ваши генералы понимали тактику, а не прятались, как перепуганные цветы, эта игра заставила бы моих магов немного напрячься."
 AI_MESSAGE_category2_MES8_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Пф, смотрите-ка, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] выстроились в боевой порядок! Словно стая анемо-слаймов штурмует столбы в Облачной бухте."
 AI_MESSAGE_category2_MES9_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: В это время года пейзажи [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] особенно хороши. Мои войска любуются ими как трофеем."
 AI_MESSAGE_category2_MES10_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Будьте благоразумны, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName], присылайте капитуляцию. Бесполезное сопротивление принесёт лишь новые раны и скорбные песни."
 AI_MESSAGE_category3_MES1_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] наверняка призвали силу Бездны! Такой результат невозможен в честном бою!"
 AI_MESSAGE_category3_MES2_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Это несправедливо! Солдаты [?global.trashtalk_other_country_tag_box2.GetAdjective] словно благословлены Драконьими владыками, а мои [?global.trashtalk_own_country_tag_box2.GetAdjective] воины словно прокляты!"
 AI_MESSAGE_category3_MES3_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Хм, Тейват полон тайн и загадок, кто станет тратить время на эту бесславную войну."
 AI_MESSAGE_category3_MES4_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Если бы не глупость союзников и умение врага читать линии земли, мои победоносные [?global.trashtalk_own_country_tag_box2.GetAdjective] войска не пали бы перед уловками [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]!"
 AI_MESSAGE_category3_MES5_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Рёв, полный ярости и древней магии... Позор... [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]! Клянусь законами мира, наши пути больше не пересекутся!!!"
 AI_MESSAGE_category3_MES6_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: На этот раз вы переиграли, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]. Время покажет, кто сильнее в честном бою."
 AI_MESSAGE_category3_MES7_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Увы, аномалия в линиях земли в стратегическом месте оборвала снабжение и нарушила силы. Поражение от [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] — жестокая шутка судьбы."
 AI_MESSAGE_category3_MES8_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: О? Неужели звёзды в этот раз благоволили [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]? Иначе исход был бы иным!"
 AI_MESSAGE_category3_MES9_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: В древние времена боги решали всё силой. По тем правилам, [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] не смогли бы победить такими хитростями."
 AI_MESSAGE_category3_MES10_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Да, в решающий момент удача была не на моей стороне. Поэтому и случилось поражение от [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName]. Даже лучшие планы бессильны перед капризами судьбы."
 AI_MESSAGE_category4_MES1_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Пусть все запомнят, что [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] предали священный союз, их имя навсегда запятнано."
 AI_MESSAGE_category4_MES2_BOX2:"[?global.trashtalk_own_country_tag_box2.GetFlag][?global.trashtalk_own_country_tag_box2.GetLeader]: Достоин ли [?global.trashtalk_other_country_tag_box2.GetNonIdeologyName] оставаться в союзе? Даже наёмники Позолоченной свиты надёжнее таких союзников."

 # BOX3

 AI_MESSAGE_category1_MES1_BOX3:0"[?global.trashtalk_own_country_tag_box3.GetFlag][?global.trashtalk_own_country_tag_box3.GetLeader]: Искусство управления поистине открывает глаза, вы умудрились уступить свои земли, [?global.trashtalk_other_country_tag_box3.GetNonIdeologyName]. Этот «подвиг» стоит высечь на камнях."
 AI_MESSAGE_category1_MES2_BOX3:0"[?global.trashtalk_own_country_tag_box3.GetFlag][?global.trashtalk_own_country_tag_box3.GetLeader]: Хе-хе, [?global.trashtalk_other_country_tag_box3.GetNonIdeologyName], ваши правители, видно, из хиличурлов? Даже азбуку защиты не освоили."
 AI_MESSAGE_category1_MES3_BOX3:0"[?global.trashtalk_own_country_tag_box3.GetFlag][?global.trashtalk_own_country_tag_box3.GetLeader]: Вам стоит поучиться управлению землями и военному делу, [?global.trashtalk_other_country_tag_box3.GetAdjective] детёныши. Не будьте как незрелый кристалл."
 AI_MESSAGE_category1_MES4_BOX3:0"[?global.trashtalk_own_country_tag_box3.GetFlag][?global.trashtalk_own_country_tag_box3.GetLeader]: Полное крушение обороны [?global.trashtalk_other_country_tag_box3.GetNonIdeologyName] вызывает у меня даже некоторую ненужную жалость. Такие стены не выдержали бы и лёгкого ветра."
 AI_MESSAGE_category1_MES5_BOX3:0"[?global.trashtalk_own_country_tag_box3.GetFlag][?global.trashtalk_own_country_tag_box3.GetLeader]: Возможно, управление землями и линиями земли слишком сложно для вас, [?global.trashtalk_other_country_tag_box3.GetNonIdeologyName]. Лучше управляйте чайной."
 AI_MESSAGE_category1_MES6_BOX3:0"[?global.trashtalk_own_country_tag_box3.GetFlag][?global.trashtalk_own_country_tag_box3.GetLeader]: Сильно сомневаюсь, что самураи [?global.trashtalk_other_country_tag_box3.GetNonIdeologyName] вообще готовятся к бою. Пустая трата клинков."
 AI_MESSAGE_category1_MES7_BOX3:0"[?global.trashtalk_own_country_tag_box3.GetFlag][?global.trashtalk_own_country_tag_box3.GetLeader]: Взгляните, эти земли [?global.trashtalk_other_country_tag_box3.GetAdjective], полные силы земли, теперь мои. Старые хозяева не ценили даров и благословений стихий."
 AI_MESSAGE_category1_MES8_BOX3:0"[?global.trashtalk_own_country_tag_box3.GetFlag][?global.trashtalk_own_country_tag_box3.GetLeader]: Эй, [?global.trashtalk_other_country_tag_box3.GetNonIdeologyName], в следующий раз пусть ваши самураи хотя бы держат клинки? А то я видел только их спины."
 AI_MESSAGE_category1_MES9_BOX3:0"[?global.trashtalk_own_country_tag_box3.GetFlag][?global.trashtalk_own_country_tag_box3.GetLeader]: Почему плачут подданные [?global.trashtalk_other_country_tag_box3.GetNonIdeologyName]? Потому что их символы втоптаны в прах."
