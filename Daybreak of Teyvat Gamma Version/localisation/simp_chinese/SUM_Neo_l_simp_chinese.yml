 SUM_Neo_SGS.84.b:"以枪杆立威"
 SUM_SGS_RA_Word_Forest:"致雨林书"
 SUM_SGS_RA_Word_Forest_desc:"给雨林的书信写得客气，说的是商路与水位，不提刀兵。"
 SUM_Neo_SGS.85.t:"致雨林书"
 SUM_Neo_SGS.85.d:"给雨林的书信写得客气，说的是商路与水位，不提刀兵。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
