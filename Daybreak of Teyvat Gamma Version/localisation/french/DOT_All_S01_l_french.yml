  # Personnages
  ABY_lumine:0 "Lumine"
  ABY_lumine_desc:0 "La Voyageuse est adorable, tout le monde dans l'accord religieux est d'accord. Lumine doit dominer ce monde, tous doivent être ses loyaux serviteurs."
  ABY_kong:0 "Aether"
  ABY_kong_desc:0 "Frère et sang de Lumine, narrateur des hauts faits de la Voyageuse, caméraman de ses exploits légendaires."
  ABY_yuanshang:0 "Yuanxia"
  ABY_yuanshang_desc:0 "Chantre de l'Ordre des Profondeurs se faisant appeler Yuanxia. Ce nom lui vient de sa première rencontre aux Profondeurs, pourquoi pas Yuanxiaxia ?"
  ABY_guzhong:0 "Guzhong"
  ABY_guzhong_desc:0 "Chantre de l'Ordre des Profondeurs se faisant appeler Guzhong. Il doit son nom à sa première apparition dans une vallée, où il faillit être offert à Kiniich pour être battu pour amuser la Voyageuse."
  ABY_shanxia:0 "Shanxia"
  ABY_shanxia_desc:0 "Chantre de l'Ordre des Profondeurs se faisant appeler Shanxia, rencontré au pied des montagnes. Il a aidé dans une certaine mesure à résoudre la crise de Natlan, mais c'est un traître des Profondeurs."
  ABY_dawei:0 "Grand Wei"
  ABY_dawei_desc:0 "Hilichurl au prénom Wei. On raconte que le battre avant chaque invocation augmente les chances d'obtenir des personnages. Une ancienne prophétie dit que battre Grand Wei fait des miracles. On se demande pourquoi il garde le souvenir de ses méfaits passés."
