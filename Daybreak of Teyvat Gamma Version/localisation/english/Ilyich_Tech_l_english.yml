 # Hilichurl
 #############
 Ilyich_Hilichurl:"Hilichurl"
 Ilyich_Hilichurl_equipment:"Hilichurl"
 Ilyich_Hilichurl:"Primitive dwellers roaming the wilderness of Teyvat. Human‑like in form, yet bereft of intellect and spirit. Records tell they have wandered these lands for over a thousand years, leaving behind no history nor civilisation. Since the dark catastrophe five hundred years ago, they have spread far and wide across the continent. Though individually weak and disorganised, they can still cause considerable trouble for travellers."
