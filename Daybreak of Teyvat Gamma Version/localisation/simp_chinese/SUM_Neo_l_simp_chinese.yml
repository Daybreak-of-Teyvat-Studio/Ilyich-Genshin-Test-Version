 SUM_Neo.299.d:"须弥舰队成军，旗号挂在奥摩斯港的桅杆上。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。"
