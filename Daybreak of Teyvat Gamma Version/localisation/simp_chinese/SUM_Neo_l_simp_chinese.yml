 SUM_Neo_SGS.8.b:"先看住远方的人"
 SUM_SGS_PRO_Klingsor:"克林索尔的记录"
 SUM_SGS_PRO_Klingsor_desc:"克林索尔把圣显厅里的东西一件件记下来，记完封进箱子。他记得很清楚，说了多少没人知道。"
 SUM_Neo_SGS.9.t:"克林索尔的记录"
 SUM_Neo_SGS.9.d:"克林索尔把圣显厅里的东西一件件记下来，记完封进箱子。他记得很清楚，说了多少没人知道。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGS.9.a:"循教令院发下的旧例"
 SUM_Neo_SGS.9.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Buer_Line:"布尔的旧账"
 SUM_SGS_PRO_Buer_Line_desc:"布尔留下一本旧账，记的是雨天与沙天的水位。账本传到第三代就断了。"
 SUM_Neo_SGS.10.t:"布尔的旧账"
 SUM_Neo_SGS.10.d:"布尔留下一本旧账，记的是雨天与沙天的水位。账本传到第三代就断了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGS.10.a:"把账目封存"
 SUM_Neo_SGS.10.b:"把账目摊开"
 SUM_SGS_PRO_Academy_Tent:"帐中学"
 SUM_SGS_PRO_Academy_Tent_desc:"矫论团在帐中讲学，讲的是经卷，也是算术与地理。来听的人不分族。"
 SUM_Neo_SGS.11.t:"帐中学"
 SUM_Neo_SGS.11.d:"矫论团在帐中讲学，讲的是经卷，也是算术与地理。来听的人不分族。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGS.11.a:"按官署的判断行事"
 SUM_Neo_SGS.11.b:"按自己的判断行事"
 SUM_SGS_PRO_Dune_Route:"沙丘的商道"
 SUM_SGS_PRO_Dune_Route_desc:"商道沿沙丘的脊走，昼伏夜行。走熟了这条路的人，闭着眼也知道哪一段会塌。"
 SUM_Neo_SGS.12.t:"沙丘的商道"
 SUM_Neo_SGS.12.d:"商道沿沙丘的脊走，昼伏夜行。走熟了这条路的人，闭着眼也知道哪一段会塌。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SGS.12.a:"先看住脚下的城"
 SUM_Neo_SGS.12.b:"先看住远方的人"
 SUM_SGS_PRO_Water_Halt:"路上的水驿"
 SUM_SGS_PRO_Water_Halt_desc:"每隔一日路程设一处水驿，水由矫论团管，取水要记账。"
 SUM_Neo_SGS.13.t:"路上的水驿"
 SUM_Neo_SGS.13.d:"每隔一日路程设一处水驿，水由矫论团管，取水要记账。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SGS.13.a:"循教令院发下的旧例"
 SUM_Neo_SGS.13.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Camel_Hire:"雇驼"
 SUM_SGS_PRO_Camel_Hire_desc:"外邦的商队雇本地的驼与驼夫，价钱写在契上，契丢了就得照市价重付。"
 SUM_Neo_SGS.14.t:"雇驼"
 SUM_Neo_SGS.14.d:"外邦的商队雇本地的驼与驼夫，价钱写在契上，契丢了就得照市价重付。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGS.14.a:"把账目封存"
 SUM_Neo_SGS.14.b:"把账目摊开"
 SUM_SGS_PRO_Salt_Trade:"盐与香料"
 SUM_SGS_PRO_Salt_Trade_desc:"沙丘腰带出口的是盐与香料，换回来的是铁与布。换的差价养活了半条路。"
 SUM_Neo_SGS.15.t:"盐与香料"
 SUM_Neo_SGS.15.d:"沙丘腰带出口的是盐与香料，换回来的是铁与布。换的差价养活了半条路。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SGS.15.a:"按官署的判断行事"
 SUM_Neo_SGS.15.b:"按自己的判断行事"
 SUM_SGS_PRO_Merchant_Word:"商户的话"
 SUM_SGS_PRO_Merchant_Word_desc:"几家大商户在沙丘腰带说话有分量，他们点头的事，官署办得快。"
 SUM_Neo_SGS.16.t:"商户的话"
 SUM_Neo_SGS.16.d:"几家大商户在沙丘腰带说话有分量，他们点头的事，官署办得快。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGS.16.a:"先看住脚下的城"
 SUM_Neo_SGS.16.b:"先看住远方的人"
 SUM_SGS_PRO_Hall_of_Mystery:"圣显厅"
 SUM_SGS_PRO_Hall_of_Mystery_desc:"圣显厅的入口被沙埋了半截，进去的人带出来的东西，一半上交，一半不见了。"
 SUM_Neo_SGS.17.t:"圣显厅"
 SUM_Neo_SGS.17.d:"圣显厅的入口被沙埋了半截，进去的人带出来的东西，一半上交，一半不见了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。沙还在往里灌。"
 SUM_Neo_SGS.17.a:"循教令院发下的旧例"
 SUM_Neo_SGS.17.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Key_Slab:"钥匙石板"
 SUM_SGS_PRO_Key_Slab_desc:"有一块石板能开门，石板被分成三块，由三方各执一块。"
 SUM_Neo_SGS.18.t:"钥匙石板"
 SUM_Neo_SGS.18.d:"有一块石板能开门，石板被分成三块，由三方各执一块。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGS.18.a:"把账目封存"
 SUM_Neo_SGS.18.b:"把账目摊开"
 SUM_SGS_PRO_Relic_Record:"遗物入册"
 SUM_SGS_PRO_Relic_Record_desc:"从厅里出来的东西一律入册，谁挖的、归谁看都写清楚。"
 SUM_Neo_SGS.19.t:"遗物入册"
 SUM_Neo_SGS.19.d:"从厅里出来的东西一律入册，谁挖的、归谁看都写清楚。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGS.19.a:"按官署的判断行事"
 SUM_Neo_SGS.19.b:"按自己的判断行事"
 SUM_SGS_PRO_Hieroglyph:"沙海古文字"
 SUM_SGS_PRO_Hieroglyph_desc:"厅里的字是古沙漠文，认得的人不到十个。这十个人如今都在矫论团名下。"
 SUM_Neo_SGS.20.t:"沙海古文字"
 SUM_Neo_SGS.20.d:"厅里的字是古沙漠文，认得的人不到十个。这十个人如今都在矫论团名下。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGS.20.a:"先看住脚下的城"
 SUM_Neo_SGS.20.b:"先看住远方的人"
 SUM_SGS_PRO_Sealed_Door:"封着的门"
 SUM_SGS_PRO_Sealed_Door_desc:"厅子最深处有一扇封着的门，封条是几百年前贴的。没有人动过它。"
 SUM_Neo_SGS.21.t:"封着的门"
 SUM_Neo_SGS.21.d:"厅子最深处有一扇封着的门，封条是几百年前贴的。没有人动过它。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SGS.21.a:"循教令院发下的旧例"
 SUM_Neo_SGS.21.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Sand_Worm_Lore:"沙下的巨虫"
 SUM_SGS_PRO_Sand_Worm_Lore_desc:"沙丘下的巨虫怕光，只在夜里出。商队夜行的时候绕着它走。"
 SUM_Neo_SGS.22.t:"沙下的巨虫"
 SUM_Neo_SGS.22.d:"沙丘下的巨虫怕光，只在夜里出。商队夜行的时候绕着它走。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGS.22.a:"把账目封存"
 SUM_Neo_SGS.22.b:"把账目摊开"
 SUM_SGS_PRO_Sacred_Beast:"沙海圣骸"
 SUM_SGS_PRO_Sacred_Beast_desc:"沙里偶有圣骸兽的遗骸，骨头能制药，也能做兵器。捡到的人多半卖了。"
 SUM_Neo_SGS.23.t:"沙海圣骸"
 SUM_Neo_SGS.23.d:"沙里偶有圣骸兽的遗骸，骨头能制药，也能做兵器。捡到的人多半卖了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SGS.23.a:"按官署的判断行事"
 SUM_Neo_SGS.23.b:"按自己的判断行事"
 SUM_SGS_PRO_Scarab_Swarm:"甲虫成群"
 SUM_SGS_PRO_Scarab_Swarm_desc:"圣甲虫成群的时候，是沙下要松动的前兆。老辈人看虫知天。"
 SUM_Neo_SGS.24.t:"甲虫成群"
 SUM_Neo_SGS.24.d:"圣甲虫成群的时候，是沙下要松动的前兆。老辈人看虫知天。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SGS.24.a:"先看住脚下的城"
 SUM_Neo_SGS.24.b:"先看住远方的人"
 SUM_SGS_PRO_Pari_Beast:"花灵与兽"
 SUM_SGS_PRO_Pari_Beast_desc:"花灵能与沙里的兽说话，说的是很久以前的事。听懂的兽就不再伤人。"
 SUM_Neo_SGS.25.t:"花灵与兽"
 SUM_Neo_SGS.25.d:"花灵能与沙里的兽说话，说的是很久以前的事。听懂的兽就不再伤人。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGS.25.a:"循教令院发下的旧例"
 SUM_Neo_SGS.25.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Beast_Patrol:"护路的人"
 SUM_SGS_PRO_Beast_Patrol_desc:"矫论团雇人护路，护路的人兼着打兽。工钱不高，可管饭。"
 SUM_Neo_SGS.26.t:"护路的人"
 SUM_Neo_SGS.26.d:"矫论团雇人护路，护路的人兼着打兽。工钱不高，可管饭。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGS.26.a:"把账目封存"
 SUM_Neo_SGS.26.b:"把账目摊开"
 SUM_SGS_PRO_Edict_Post:"敕令到沙"
 SUM_SGS_PRO_Edict_Post_desc:"雨林的敕令送到沙丘腰带，管的是赋税与商路。官署接过来照办，矫论团不接。"
 SUM_Neo_SGS.27.t:"敕令到沙"
 SUM_Neo_SGS.27.d:"雨林的敕令送到沙丘腰带，管的是赋税与商路。官署接过来照办，矫论团不接。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SGS.27.a:"按官署的判断行事"
 SUM_Neo_SGS.27.b:"按自己的判断行事"
 SUM_SGS_PRO_Tax_Sand:"沙税的算法"
 SUM_SGS_PRO_Tax_Sand_desc:"沙税按商队计，一年一算。算法是雨林定的，算出来总是雨林多一分。"
 SUM_Neo_SGS.28.t:"沙税的算法"
 SUM_Neo_SGS.28.d:"沙税按商队计，一年一算。算法是雨林定的，算出来总是雨林多一分。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGS.28.a:"先看住脚下的城"
 SUM_Neo_SGS.28.b:"先看住远方的人"
 SUM_SGS_PRO_Forest_Outpost:"雨林的哨所"
 SUM_SGS_PRO_Forest_Outpost_desc:"雨林在商道旁设了哨所，查的是货，也是人。查得多了，商队改道。"
 SUM_Neo_SGS.29.t:"雨林的哨所"
 SUM_Neo_SGS.29.d:"雨林在商道旁设了哨所，查的是货，也是人。查得多了，商队改道。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGS.29.a:"循教令院发下的旧例"
 SUM_Neo_SGS.29.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Clerk_Sand:"书吏的笔"
 SUM_SGS_PRO_Clerk_Sand_desc:"雨林派来的书吏管着账，笔一动，数字就变。商户给了他一个不太好听的名号。"
 SUM_Neo_SGS.30.t:"书吏的笔"
 SUM_Neo_SGS.30.d:"雨林派来的书吏管着账，笔一动，数字就变。商户给了他一个不太好听的名号。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SGS.30.a:"把账目封存"
 SUM_Neo_SGS.30.b:"把账目摊开"
 SUM_SGS_PRO_Vigil_Question:"守望的疑问"
 SUM_SGS_PRO_Vigil_Question_desc:"有花灵问：凡人若一直被人管着，守望还有什么意义。祖尔宛没有回答。"
 SUM_Neo_SGS.31.t:"守望的疑问"
 SUM_Neo_SGS.31.d:"有花灵问：凡人若一直被人管着，守望还有什么意义。祖尔宛没有回答。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。"
 SUM_Neo_SGS.31.a:"按官署的判断行事"
 SUM_Neo_SGS.31.b:"按自己的判断行事"

 #### 独立之路 ####
 SUM_SGS_IND_The_Vigil_Ends:"守望有尽"
 SUM_SGS_IND_The_Vigil_Ends_desc:"花灵守了几百年，守的是凡人能自己站起来的那一天。雨林的敕令压着沙丘腰带，压得凡人的腰弯下去。花灵不再替人做决定，可这一次，她们第一个站到了前面。"
 SUM_Neo_SGS.32.t:"守望有尽"
 SUM_Neo_SGS.32.d:"花灵守了几百年，守的是凡人能自己站起来的那一天。雨林的敕令压着沙丘腰带，压得凡人的腰弯下去。花灵不再替人做决定，可这一次，她们第一个站到了前面。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGS.32.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.32.b:"把盟约收进箱底"
 SUM_SGS_IND_Pari_Council:"花灵与众议"
 SUM_SGS_IND_Pari_Council_desc:"花灵头一回开口向凡人说话，说的是：你们的事，你们自己定。"
 SUM_Neo_SGS.33.t:"花灵与众议"
 SUM_Neo_SGS.33.d:"花灵头一回开口向凡人说话，说的是：你们的事，你们自己定。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGS.33.a:"召集部族共商"
 SUM_Neo_SGS.33.b:"等官署先松口"
 SUM_SGS_IND_Zurvan_Word:"祖尔宛的一句话"
 SUM_SGS_IND_Zurvan_Word_desc:"祖尔宛只说了一句：守着不动，也是一种偏袒。说完就退回沙下去了。"
 SUM_Neo_SGS.34.t:"祖尔宛的一句话"
 SUM_Neo_SGS.34.d:"祖尔宛只说了一句：守着不动，也是一种偏袒。说完就退回沙下去了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGS.34.a:"备好兵与粮"
 SUM_Neo_SGS.34.b:"多派几趟使节"
 SUM_SGS_IND_Jinn_Alliance:"矫论团入盟"
 SUM_SGS_IND_Jinn_Alliance_desc:"矫论团把经卷摊开，说经义讲的就是这一天。于是他们入了盟。"
 SUM_Neo_SGS.35.t:"矫论团入盟"
 SUM_Neo_SGS.35.d:"矫论团把经卷摊开，说经义讲的就是这一天。于是他们入了盟。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGS.35.a:"把旗立起来"
 SUM_Neo_SGS.35.b:"把旗先卷起来"
 SUM_SGS_IND_Wish_End:"不再许愿"
 SUM_SGS_IND_Wish_End_desc:"花灵宣布：从今往后不再替人圆愿，凡人的愿由凡人自己圆。"
 SUM_Neo_SGS.36.t:"不再许愿"
 SUM_Neo_SGS.36.d:"花灵宣布：从今往后不再替人圆愿，凡人的愿由凡人自己圆。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGS.36.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.36.b:"把盟约收进箱底"
 SUM_SGS_IND_Pari_Blessing:"花灵的祝福"
 SUM_SGS_IND_Pari_Blessing_desc:"花灵不替人办事，却给了沙丘腰带一样东西，遇事不必先问神的底气。"
 SUM_Neo_SGS.37.t:"花灵的祝福"
 SUM_Neo_SGS.37.d:"花灵不替人办事，却给了沙丘腰带一样东西，遇事不必先问神的底气。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SGS.37.a:"召集部族共商"
 SUM_Neo_SGS.37.b:"等官署先松口"
 SUM_SGS_IND_Route_Grip:"把控商道"
 SUM_SGS_IND_Route_Grip_desc:"商道上的水驿与关卡换成本地人管，过路的照旧要走这条道。"
 SUM_Neo_SGS.38.t:"把控商道"
 SUM_Neo_SGS.38.d:"商道上的水驿与关卡换成本地人管，过路的照旧要走这条道。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGS.38.a:"备好兵与粮"
 SUM_Neo_SGS.38.b:"多派几趟使节"
 SUM_SGS_IND_Toll_Local:"自设税卡"
 SUM_SGS_IND_Toll_Local_desc:"税卡由本地商户合议设，收的钱用来修路与凿井。"
 SUM_Neo_SGS.39.t:"自设税卡"
 SUM_Neo_SGS.39.d:"税卡由本地商户合议设，收的钱用来修路与凿井。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGS.39.a:"把旗立起来"
 SUM_Neo_SGS.39.b:"把旗先卷起来"
 SUM_SGS_IND_Caravan_Charter:"商队章程"
 SUM_SGS_IND_Caravan_Charter_desc:"立章程：商队在沙丘腰带内许进不许抢，违者不许再走这条路。"
 SUM_Neo_SGS.40.t:"商队章程"
 SUM_Neo_SGS.40.d:"立章程：商队在沙丘腰带内许进不许抢，违者不许再走这条路。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGS.40.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.40.b:"把盟约收进箱底"
 SUM_SGS_IND_Mint_Dune:"沙丘铸钱"
 SUM_SGS_IND_Mint_Dune_desc:"开炉铸钱，成色写在钱边上，周边各邦都收。"
 SUM_Neo_SGS.41.t:"沙丘铸钱"
 SUM_Neo_SGS.41.d:"开炉铸钱，成色写在钱边上，周边各邦都收。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGS.41.a:"召集部族共商"
 SUM_Neo_SGS.41.b:"等官署先松口"
 SUM_SGS_IND_Reserve_Store:"暗仓"
 SUM_SGS_IND_Reserve_Store_desc:"盐与粮悄悄囤进沙丘深处的暗仓，囤的是底气。"
 SUM_Neo_SGS.42.t:"暗仓"
 SUM_Neo_SGS.42.d:"盐与粮悄悄囤进沙丘深处的暗仓，囤的是底气。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGS.42.a:"备好兵与粮"
 SUM_Neo_SGS.42.b:"多派几趟使节"
 SUM_SGS_IND_Dune_Guard:"沙丘守军"
 SUM_SGS_IND_Dune_Guard_desc:"把护路的人、矫论团的护法，与各部民兵合编成一支守军。"
 SUM_Neo_SGS.43.t:"沙丘守军"
 SUM_Neo_SGS.43.d:"把护路的人、矫论团的护法，与各部民兵合编成一支守军。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SGS.43.a:"把旗立起来"
 SUM_Neo_SGS.43.b:"把旗先卷起来"
 SUM_SGS_IND_Pari_Scout:"花灵的眼"
 SUM_SGS_IND_Pari_Scout_desc:"花灵能借风鸟与沙兽的眼睛，替守军看路。她们看，不说。"
 SUM_Neo_SGS.44.t:"花灵的眼"
 SUM_Neo_SGS.44.d:"花灵能借风鸟与沙兽的眼睛，替守军看路。她们看，不说。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGS.44.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.44.b:"把盟约收进箱底"
 SUM_SGS_IND_Beast_Handler:"驭兽人"
 SUM_SGS_IND_Beast_Handler_desc:"驯沙兽的人从矫论团里选，驯好的兽能负辎重，也能冲阵。"
 SUM_Neo_SGS.45.t:"驭兽人"
 SUM_Neo_SGS.45.d:"驯沙兽的人从矫论团里选，驯好的兽能负辎重，也能冲阵。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGS.45.a:"召集部族共商"
 SUM_Neo_SGS.45.b:"等官署先松口"
 SUM_SGS_IND_Storm_Drill:"风沙操演"
 SUM_SGS_IND_Storm_Drill_desc:"操演挑风沙天，练的是辨向与结阵。练熟的人风越大越稳。"
 SUM_Neo_SGS.46.t:"风沙操演"
 SUM_Neo_SGS.46.d:"操演挑风沙天，练的是辨向与结阵。练熟的人风越大越稳。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGS.46.a:"备好兵与粮"
 SUM_Neo_SGS.46.b:"多派几趟使节"
 SUM_SGS_IND_Water_Guard:"守泉的人"
 SUM_SGS_IND_Water_Guard_desc:"水驿都派了人守，守的是水，也是这条商道的命。"
 SUM_Neo_SGS.47.t:"守泉的人"
 SUM_Neo_SGS.47.d:"水驿都派了人守，守的是水，也是这条商道的命。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGS.47.a:"把旗立起来"
 SUM_Neo_SGS.47.b:"把旗先卷起来"
 SUM_SGS_IND_Proclaim:"沙丘的告示"
 SUM_SGS_IND_Proclaim_desc:"告示用古沙漠文与通行文各写一遍，贴在每处水驿的墙上。"
 SUM_Neo_SGS.48.t:"沙丘的告示"
 SUM_Neo_SGS.48.d:"告示用古沙漠文与通行文各写一遍，贴在每处水驿的墙上。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。"
 SUM_Neo_SGS.48.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.48.b:"把盟约收进箱底"
 SUM_SGS_IND_Raise_Banner:"举灵光旗"
 SUM_SGS_IND_Raise_Banner_desc:"沙丘腰带立起自己的旗，旗上是灵光的纹样。"
 SUM_Neo_SGS.49.t:"举灵光旗"
 SUM_Neo_SGS.49.d:"沙丘腰带立起自己的旗，旗上是灵光的纹样。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGS.49.a:"召集部族共商"
 SUM_Neo_SGS.49.b:"等官署先松口"
 SUM_SGS_IND_Reject_Edict:"拒受敕令"
 SUM_SGS_IND_Reject_Edict_desc:"敕令送到水驿，被当众卷起来还给了信使。信使捧着卷轴站了很久。"
 SUM_Neo_SGS.50.t:"拒受敕令"
 SUM_Neo_SGS.50.d:"敕令送到水驿，被当众卷起来还给了信使。信使捧着卷轴站了很久。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGS.50.a:"备好兵与粮"
 SUM_Neo_SGS.50.b:"多派几趟使节"
 SUM_SGS_IND_Redraw_Border:"重定界"
 SUM_SGS_IND_Redraw_Border_desc:"商道两侧的地界重划，把雨林的哨所圈在外头。"
 SUM_Neo_SGS.51.t:"重定界"
 SUM_Neo_SGS.51.d:"商道两侧的地界重划，把雨林的哨所圈在外头。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGS.51.a:"把旗立起来"
 SUM_Neo_SGS.51.b:"把旗先卷起来"
 SUM_SGS_IND_Final_Word:"祖尔宛的最后一句"
 SUM_SGS_IND_Final_Word_desc:"祖尔宛在众议上说了最后一句：凡人的路，从今往后由凡人自己走。"
 SUM_Neo_SGS.52.t:"祖尔宛的最后一句"
 SUM_Neo_SGS.52.d:"祖尔宛在众议上说了最后一句：凡人的路，从今往后由凡人自己走。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGS.52.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.52.b:"把盟约收进箱底"
 SUM_SGS_IND_Envoy_Port:"港口来客"
 SUM_SGS_IND_Envoy_Port_desc:"港口的客商带来船与价，开口就问：沙丘的盐走不走海路。"
 SUM_Neo_SGS.53.t:"港口来客"
 SUM_Neo_SGS.53.d:"港口的客商带来船与价，开口就问：沙丘的盐走不走海路。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGS.53.a:"召集部族共商"
 SUM_Neo_SGS.53.b:"等官署先松口"
 SUM_SGS_IND_Envoy_North:"北国使团"
 SUM_SGS_IND_Envoy_North_desc:"北国的使团愿意出资修水驿，条件是要在商道上设一处他们的驿站。"
 SUM_Neo_SGS.54.t:"北国使团"
 SUM_Neo_SGS.54.d:"北国的使团愿意出资修水驿，条件是要在商道上设一处他们的驿站。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGS.54.a:"备好兵与粮"
 SUM_Neo_SGS.54.b:"多派几趟使节"
 SUM_SGS_IND_Envoy_Rain:"雨林的门"
 SUM_SGS_IND_Envoy_Rain_desc:"对雨林仍留一扇门，派去的人带着商约与账。"
 SUM_Neo_SGS.55.t:"雨林的门"
 SUM_Neo_SGS.55.d:"对雨林仍留一扇门，派去的人带着商约与账。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGS.55.a:"把旗立起来"
 SUM_Neo_SGS.55.b:"把旗先卷起来"
 SUM_SGS_IND_Buy_Iron:"购军械"
 SUM_SGS_IND_Buy_Iron_desc:"向外邦买铁与火，用沙丘的盐与香料抵价。"
 SUM_Neo_SGS.56.t:"购军械"
 SUM_Neo_SGS.56.d:"向外邦买铁与火，用沙丘的盐与香料抵价。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGS.56.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.56.b:"把盟约收进箱底"
 SUM_SGS_IND_Scout_Forest:"探雨林"
 SUM_SGS_IND_Scout_Forest_desc:"派人去雨林，学的是一件事：教令院在沙丘还有几处脚跟。"
 SUM_Neo_SGS.57.t:"探雨林"
 SUM_Neo_SGS.57.d:"派人去雨林，学的是一件事：教令院在沙丘还有几处脚跟。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGS.57.a:"召集部族共商"
 SUM_Neo_SGS.57.b:"等官署先松口"
 SUM_SGS_IND_Declaration:"沙丘腰带宣布独立"
 SUM_SGS_IND_Declaration_desc:"灵光旗升上了水驿的旗杆。花灵没有到场，只托风鸟带来一片羽毛落在旗上。矫论团的人把告示念了两遍，念完把敕令卷起来，交给了等在门外的信使。"
 SUM_Neo_SGS.58.t:"沙丘腰带宣布独立"
 SUM_Neo_SGS.58.d:"灵光旗升上了水驿的旗杆。花灵没有到场，只托风鸟带来一片羽毛落在旗上。矫论团的人把告示念了两遍，念完把敕令卷起来，交给了等在门外的信使。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGS.58.a:"备好兵与粮"
 SUM_Neo_SGS.58.b:"多派几趟使节"

 #### 甲线 · 灵光共鸣 ####
 SUM_SGS_RA_The_Light_Resonance:"灵光共鸣"
 SUM_SGS_RA_The_Light_Resonance_desc:"花灵不替人做决定，却愿意与人同行。有人主张沙丘腰带的路就该这样走：人定事，花灵在旁，愿由人许，路由人担。"
 SUM_Neo_SGS.59.t:"灵光共鸣"
 SUM_Neo_SGS.59.d:"花灵不替人做决定，却愿意与人同行。有人主张沙丘腰带的路就该这样走：人定事，花灵在旁，愿由人许，路由人担。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SGS.59.a:"让商路连通四方"
 SUM_Neo_SGS.59.b:"把商路关起来自守"
 SUM_SGS_RA_Rite_Light:"灵光之礼"
 SUM_SGS_RA_Rite_Light_desc:"在圣显厅外的沙地上办灵光之礼，礼不长，来的人都带一支蜡烛。"
 SUM_Neo_SGS.60.t:"灵光之礼"
 SUM_Neo_SGS.60.d:"在圣显厅外的沙地上办灵光之礼，礼不长，来的人都带一支蜡烛。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGS.60.a:"以契约立信"
 SUM_Neo_SGS.60.b:"以枪杆立威"
 SUM_SGS_RA_Pari_Choir:"花灵的歌"
 SUM_SGS_RA_Pari_Choir_desc:"那塞犹那教人唱花灵的歌，孩子唱得最准，大人唱得最用心。"
 SUM_Neo_SGS.61.t:"花灵的歌"
 SUM_Neo_SGS.61.d:"那塞犹那教人唱花灵的歌，孩子唱得最准，大人唱得最用心。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。调子唱到第二遍才齐。"
 SUM_Neo_SGS.61.a:"把利润分给城邦"
 SUM_Neo_SGS.61.b:"把利润收归官库"
 SUM_SGS_RA_Shrine_Light:"遍立灵龛"
 SUM_SGS_RA_Shrine_Light_desc:"在各处水驿立一处灵龛，龛前不放供品，只放一盏灯。"
 SUM_Neo_SGS.62.t:"遍立灵龛"
 SUM_Neo_SGS.62.d:"在各处水驿立一处灵龛，龛前不放供品，只放一盏灯。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SGS.62.a:"借水草养人"
 SUM_Neo_SGS.62.b:"借商队养兵"
 SUM_SGS_RA_Pilgrim_Dune:"朝圣之路"
 SUM_SGS_RA_Pilgrim_Dune_desc:"去圣显厅的路被重新走通，路上的人结伴而行，遇沙暴躲沟。"
 SUM_Neo_SGS.63.t:"朝圣之路"
 SUM_Neo_SGS.63.d:"去圣显厅的路被重新走通，路上的人结伴而行，遇沙暴躲沟。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SGS.63.a:"让商路连通四方"
 SUM_Neo_SGS.63.b:"把商路关起来自守"
 SUM_SGS_RA_Festival_Light:"灵光节"
 SUM_SGS_RA_Festival_Light_desc:"每年在圣显厅办一次灵光节，节日里不办买卖，只办歌与灯。"
 SUM_Neo_SGS.64.t:"灵光节"
 SUM_Neo_SGS.64.d:"每年在圣显厅办一次灵光节，节日里不办买卖，只办歌与灯。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGS.64.a:"以契约立信"
 SUM_Neo_SGS.64.b:"以枪杆立威"
 SUM_SGS_RA_Pari_Pact:"与花灵的约"
 SUM_SGS_RA_Pari_Pact_desc:"与花灵立约：人不求神断事，神不替人担责。立约的场面很安静。"
 SUM_Neo_SGS.65.t:"与花灵的约"
 SUM_Neo_SGS.65.d:"与花灵立约：人不求神断事，神不替人担责。立约的场面很安静。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGS.65.a:"把利润分给城邦"
 SUM_Neo_SGS.65.b:"把利润收归官库"
 SUM_SGS_RA_Wish_Rule:"许愿之规"
 SUM_SGS_RA_Wish_Rule_desc:"定下许愿的规矩：愿要写明，代价要写明，写不明的不许许。"
 SUM_Neo_SGS.66.t:"许愿之规"
 SUM_Neo_SGS.66.d:"定下许愿的规矩：愿要写明，代价要写明，写不明的不许许。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGS.66.a:"借水草养人"
 SUM_Neo_SGS.66.b:"借商队养兵"
 SUM_SGS_RA_Pari_Teacher:"花灵为师"
 SUM_SGS_RA_Pari_Teacher_desc:"花灵教人看星、看水、看沙。她们不教答案，只教怎么问。"
 SUM_Neo_SGS.67.t:"花灵为师"
 SUM_Neo_SGS.67.d:"花灵教人看星、看水、看沙。她们不教答案，只教怎么问。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGS.67.a:"让商路连通四方"
 SUM_Neo_SGS.67.b:"把商路关起来自守"
 SUM_SGS_RA_Witness_Pari:"花灵作证"
 SUM_SGS_RA_Witness_Pari_desc:"大契立时请花灵作证，证词只有一句：此事是人自己定的。"
 SUM_Neo_SGS.68.t:"花灵作证"
 SUM_Neo_SGS.68.d:"大契立时请花灵作证，证词只有一句：此事是人自己定的。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGS.68.a:"以契约立信"
 SUM_Neo_SGS.68.b:"以枪杆立威"
 SUM_SGS_RA_Duty_Split:"各担其责"
 SUM_SGS_RA_Duty_Split_desc:"把人与花灵各管的事写清楚，写清了就不再互相推诿。"
 SUM_Neo_SGS.69.t:"各担其责"
 SUM_Neo_SGS.69.d:"把人与花灵各管的事写清楚，写清了就不再互相推诿。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。名册重新抄了一遍。"
 SUM_Neo_SGS.69.a:"把利润分给城邦"
 SUM_Neo_SGS.69.b:"把利润收归官库"
 SUM_SGS_RA_Read_Hall:"释读圣显厅"
 SUM_SGS_RA_Read_Hall_desc:"把圣显厅里的字一块块释读，读出来的多是旧规与旧账。"
 SUM_Neo_SGS.70.t:"释读圣显厅"
 SUM_Neo_SGS.70.d:"把圣显厅里的字一块块释读，读出来的多是旧规与旧账。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SGS.70.a:"借水草养人"
 SUM_Neo_SGS.70.b:"借商队养兵"
 SUM_SGS_RA_Slab_Three:"三块石板"
 SUM_SGS_RA_Slab_Three_desc:"三块石板合成一块，合上之后厅门开了一道缝，缝里是风。"
 SUM_Neo_SGS.71.t:"三块石板"
 SUM_Neo_SGS.71.d:"三块石板合成一块，合上之后厅门开了一道缝，缝里是风。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGS.71.a:"让商路连通四方"
 SUM_Neo_SGS.71.b:"把商路关起来自守"
 SUM_SGS_RA_Archive_Light:"灵光藏书"
 SUM_SGS_RA_Archive_Light_desc:"把释读的成果抄成册，存放在水驿的藏书里，谁都能看。"
 SUM_Neo_SGS.72.t:"灵光藏书"
 SUM_Neo_SGS.72.d:"把释读的成果抄成册，存放在水驿的藏书里，谁都能看。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGS.72.a:"以契约立信"
 SUM_Neo_SGS.72.b:"以枪杆立威"
 SUM_SGS_RA_Keep_Seal:"封条不动"
 SUM_SGS_RA_Keep_Seal_desc:"最深处的封条仍不动。祖尔宛说过，那扇门不急。"
 SUM_Neo_SGS.73.t:"封条不动"
 SUM_Neo_SGS.73.d:"最深处的封条仍不动。祖尔宛说过，那扇门不急。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGS.73.a:"把利润分给城邦"
 SUM_Neo_SGS.73.b:"把利润收归官库"
 SUM_SGS_RA_Hall_Guard:"守厅人"
 SUM_SGS_RA_Hall_Guard_desc:"守厅的人由矫论团与守军轮值，轮值表贴在门外。"
 SUM_Neo_SGS.74.t:"守厅人"
 SUM_Neo_SGS.74.d:"守厅的人由矫论团与守军轮值，轮值表贴在门外。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGS.74.a:"借水草养人"
 SUM_Neo_SGS.74.b:"借商队养兵"
 SUM_SGS_RA_Dune_Regiment:"沙丘军团"
 SUM_SGS_RA_Dune_Regiment_desc:"把守军、驭兽人与护路的人编成一支军团，旗上绣着灵光。"
 SUM_Neo_SGS.75.t:"沙丘军团"
 SUM_Neo_SGS.75.d:"把守军、驭兽人与护路的人编成一支军团，旗上绣着灵光。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGS.75.a:"让商路连通四方"
 SUM_Neo_SGS.75.b:"把商路关起来自守"
 SUM_SGS_RA_Light_Scout:"灵光侦骑"
 SUM_SGS_RA_Light_Scout_desc:"侦骑借风鸟看路，看得比人远，也比人早。"
 SUM_Neo_SGS.76.t:"灵光侦骑"
 SUM_Neo_SGS.76.d:"侦骑借风鸟看路，看得比人远，也比人早。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGS.76.a:"以契约立信"
 SUM_Neo_SGS.76.b:"以枪杆立威"
 SUM_SGS_RA_Storm_Company:"风沙连"
 SUM_SGS_RA_Storm_Company_desc:"风沙连专打风天，编成之后第一仗就是在沙暴里打的。"
 SUM_Neo_SGS.77.t:"风沙连"
 SUM_Neo_SGS.77.d:"风沙连专打风天，编成之后第一仗就是在沙暴里打的。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGS.77.a:"把利润分给城邦"
 SUM_Neo_SGS.77.b:"把利润收归官库"
 SUM_SGS_RA_Water_Post:"水驿成兵"
 SUM_SGS_RA_Water_Post_desc:"水驿各设一处守兵，守兵也是守水的。"
 SUM_Neo_SGS.78.t:"水驿成兵"
 SUM_Neo_SGS.78.d:"水驿各设一处守兵，守兵也是守水的。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGS.78.a:"借水草养人"
 SUM_Neo_SGS.78.b:"借商队养兵"
 SUM_SGS_RA_Field_Song:"随军歌"
 SUM_SGS_RA_Field_Song_desc:"军中唱花灵的歌，唱的是守土与同行。唱到第二遍，新兵也会了。"
 SUM_Neo_SGS.79.t:"随军歌"
 SUM_Neo_SGS.79.d:"军中唱花灵的歌，唱的是守土与同行。唱到第二遍，新兵也会了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGS.79.a:"让商路连通四方"
 SUM_Neo_SGS.79.b:"把商路关起来自守"
 SUM_SGS_RA_Sacred_Oasis:"圣所"
 SUM_SGS_RA_Sacred_Oasis_desc:"把几处绿洲立为圣所，许进不许占。"
 SUM_Neo_SGS.80.t:"圣所"
 SUM_Neo_SGS.80.d:"把几处绿洲立为圣所，许进不许占。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGS.80.a:"以契约立信"
 SUM_Neo_SGS.80.b:"以枪杆立威"
 SUM_SGS_RA_Water_Gift:"分水之礼"
 SUM_SGS_RA_Water_Gift_desc:"圣所的水按口分给周围的人，不分族与邦。"
 SUM_Neo_SGS.81.t:"分水之礼"
 SUM_Neo_SGS.81.d:"圣所的水按口分给周围的人，不分族与邦。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGS.81.a:"把利润分给城邦"
 SUM_Neo_SGS.81.b:"把利润收归官库"
 SUM_SGS_RA_Light_Garden:"灵光园"
 SUM_SGS_RA_Light_Garden_desc:"在绿洲边开一座园子，种的是花草与药草。"
 SUM_Neo_SGS.82.t:"灵光园"
 SUM_Neo_SGS.82.d:"在绿洲边开一座园子，种的是花草与药草。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。"
 SUM_Neo_SGS.82.a:"借水草养人"
 SUM_Neo_SGS.82.b:"借商队养兵"
 SUM_SGS_RA_Refuge:"避难所"
 SUM_SGS_RA_Refuge_desc:"圣所兼作避难所，风灾战乱时开门收人。"
 SUM_Neo_SGS.83.t:"避难所"
 SUM_Neo_SGS.83.d:"圣所兼作避难所，风灾战乱时开门收人。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGS.83.a:"让商路连通四方"
 SUM_Neo_SGS.83.b:"把商路关起来自守"
