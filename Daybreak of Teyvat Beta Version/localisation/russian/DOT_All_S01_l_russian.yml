#custom_effect_tooltip
ANR_tt_Unlock_Text3:0"§YПосле завершения одного из следующих фокусов справа откроются политические фокусы\nЕсли новые фокусы не отображаются, перезайдите в окно фокусов§!"
ANR_tt_Unlock_Text2:0"§YОткрылись фокусы, связанные с подготовкой к войне\nЕсли новые фокусы не отображаются, перезайдите в окно фокусов§!"
ANR_tt_Unlock_Text1:0"§YПосле завершения этого фокуса откроются фокусы на подготовку к войне и внутреннее развитие\nЕсли новые фокусы не отображаются, перезайдите в окно фокусов§!"
ANR_tt_Unlock_Text0:0"§YПосле завершения этого фокуса появятся новые фокусы\nЕсли новые фокусы не отображаются, перезайдите в окно фокусов§!"
MOT_AGet_Core:0"§YПосле завершения этого фокуса вы сможете получить ядро всего Мондштадта через решение§!"
ANR_remove_all_the_idea_of_immigrants:0"§RЭто удалит все национальные духи, связанные с беженцами§W"
ANR_give_positive_idea:0"§RЭто даст всем вассалам положительный национальный дух§W"
ANR_released_autonomy:0"§RМы освободим все силы Мондштадта, кроме Ордена Рыцарей и Спрингвейла, как марионеточные государства и разблокируем решение о статусе объединённого Мондштадта§W"
ANR_struggle_from_three_routes_tt:0"В этом решении будет отображаться текущее влияние потенциальных лидеров\n§RБорьба за курс уже началась§W"
ANR_add_or_reduce_influence_tt:0"§RЭто событие повлияет на влияние всех трёх кандидатов!§W"
ANR_add_bennetts_influence:0"£occupation_costs §RВлияние Беннета увеличится на 1§W"
ANR_add_fischls_influence:0"£change_government  §CВлияние Фишль увеличится на 1§W"
