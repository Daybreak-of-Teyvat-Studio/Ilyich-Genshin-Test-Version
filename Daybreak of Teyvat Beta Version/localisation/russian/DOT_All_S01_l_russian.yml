AND_irregular_army:0"Нерегулярная армия"
AND_irregular_army_desc:0"Можно сказать, что в Вольфендоме нет регулярной армии. Наши войска — сброд, и без реорганизации мы не сможем противостоять внешним угрозам."
AND_fight_and_hunt:0"Охота в полях"
AND_fight_and_hunt_desc:0"Охотники и волки Вольфендома закалены в боях, они опытны и полны решимости, могут адаптироваться к бою в нестандартных условиях."
AND_backward_production_mode:0"Отсталые методы производства"
AND_backward_production_mode_desc:0"В Вольфендоме почти нет промышленности, жители — волки и дикари, сложно вести производство и исследования. Если бы мир сохранился, это не было бы проблемой, но..."
AND_backward_living_rate:0"Отсталые условия жизни"
AND_backward_living_rate_desc:0"Связь — только криком, транспорт — пешком, в радиусе сотен миль нет больниц, в тысяче шагов — ни души."
AND_plentiful_resources:0"Богатые природные ресурсы"
AND_plentiful_resources_desc:0"Дикие звери, ягоды и кристальная руда — особенность Вольфендома. Только этим мы можем прокормить себя."
AND_rangers_in_forests:0"Лесные странники"
AND_rangers_in_forests_desc:0"В Вольфендоме всегда можно увидеть странных людей... они скачут по горам, летают по лесам, это не боевик, это обычная жизнь."
AND_many_immigrants:0"Средний приток беженцев"
AND_many_immigrants_desc:0"После раскола Мондштадта множество беженцев покинуло дома. По слухам, Вольфендом — единственное мирное место под защитой Волка Севера, и беженцы хлынули сюда, нарушив покой... но и дав новые возможности."
AND_more_immigrants:0"Большой приток беженцев"
AND_more_immigrants_desc:0"После создания администрации и решения проблем с жильём и едой, слухи о мирном Вольфендоме усилились, привлекая ещё больше беженцев."
