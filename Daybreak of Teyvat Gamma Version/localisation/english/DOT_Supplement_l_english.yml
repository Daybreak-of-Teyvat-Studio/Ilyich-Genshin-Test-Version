 SOV_training_activities_curtailed:0 "Training Activities Curtailed"
 SOV_training_activities_curtailed_desc:0 "A significant percentage of vehicles experienced mechanical failures and several recruits were injured during recent military exercises. Until we find out the true reason for these mechanical defects, we have curtailed major training exercises to avoid further damage to both our recruits and our military assets."
 SOV_trotskyist_revolutionary_agitation:0 "Trotskyist Revolutionary Agitation"
 SOV_trotskyist_revolutionary_agitation_desc:0 "Trotskyist sympathizers and other communist elements aligned with the [SOV.GetAdjective] Bolshevik Party are stirring up the [ROOT.GetAdjective] masses, promoting the Marxist ideology among the working class and calling for an armed struggle against our government."
 SOV_trotskyist_revolutionary_agitation_tt:0 "Activating the decision §Y$ban_communist_party$§! will reduce the effects from this national spirit."
