 HOL_shell_shocked_spectator:0 "Shell-shocked Spectator of the Great War"
 HOL_shell_shocked_spectator_desc:0 "As the neutral Netherlands was the closest safe haven for refugees from the Western Front, the Dutch have been but all too close a spectator to the horrors of the Great War. As a result, a strong pacifist movement has grown to permeate large parts of the public, and presents the government with great difficulties in implementing any increase of military expenditure. Only the navy still enjoys a certain measure of prestige in the public eye.\n\nA defensive war or a 'war on pacifism' would be needed to truly rid the country of this sentiment."
