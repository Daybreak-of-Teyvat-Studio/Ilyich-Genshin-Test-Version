 # add_to_variable = { var = MVK-Prestige-Index value = -10 } custom_effect_tooltip = MVK-Prestige-Index_Decrease_10
 MVK-Prestige-Index_Decrease_10:"§R火神的恩情减10§!"
 NAT-MVK-WIN:"阳焰不熄"
 NAT-MVK-LOSE:"阳焰熄陨"
 NAT-MVK-WIN_desc:"这位最强的火神，拿不灭烈焰当刀，带着六位英杰冲开深渊封锁，在夜神之国与古斯托特当面一战，借死之执政之力，把祸根一刀斩断。圣火因她的意志烧得更旺，纳塔的阳火从没熄过。她一人扛起整个火之国度，令角逐与荣耀之歌，永远在这片土地上回荡。§Y火神的恩情：§!§R[?MVK-Prestige-Index]§!"
 NAT-MVK-LOSE_desc:"火神烈焰终被深渊狂潮吞了，夜神之国整个塌下，圣火庇护一丝不剩。没了主心骨，六族立时互相猜忌，为抢那点残余燃素与立足之地，你防着我，我堵着你，当年盟誓碎了一地，纳塔就此踏进将裂之局。深渊魔物趁虚在全境撒野，地脉一处接一处崩，火之国度的荣耀碾作焦土，所余惟有没完的争斗与黑，压在这片曾经滚烫的土地上。§Y火神的恩情：§!§R[?MVK-Prestige-Index]§!"
 NAT_decisions-02:"诸部举事"
 NAT_decisions-02_desc:"纳塔六族各有各的传承，却长久地各过各的。分裂的根子，是信仰不同、利益相争，还有一代代攒下的旧怨。奥奇坎当政那会儿，阿霍布恨龙族，跟亲妹伊葵翻了脸；莉安歌被亲儿子出卖，死在战场上，隔阂更深。后来荣花演武上，伊马雷为抢圣火结晶，连盟友都害，族与族之间的信任一下子塌了。坎瑞亚灾变时，六族还在争，最后靠特诺切出面才勉强合力。就算有火神在中间调停，宣战、结盟、背叛仍是常事，内耗不断，成了纳塔抵御大祸时最沉的一块石头。"
 # 第一类：内政政治类（1-8）
 # 1. 召开部族联合会议
 NAT_Hold_Tribal_Joint_Council:"诸族联席聚议"
 NAT_Hold_Tribal_Joint_Council_desc:"赤色火山平原上，六族之旗在圣火风中猎猎作响。朝廷以希巴拉克盟约为名，把沃陆农酋、回声锻主、流泉航首等首领尽请到源火城。议事篝火照着各族多年裂痕。烟谜主祭司以灵谜涂鸦，把一条条共识记下；古名里的英雄意志，也似在低声应和。此会非只分权，更是一次重新立誓。散在各处的声响，只有汇进同一堆圣火，深渊低语才钻不了空子；纳塔的安稳，才能如火山岩一般压得实。"

 # 2. 调解部族边境冲突
 NAT_Mediate_Tribal_Border_Conflict:"六部息边争"
 NAT_Mediate_Tribal_Border_Conflict_desc:"边境上为一条火渠、一处猎场，又闹到要拔刀。朝廷照希巴拉克老法子办：令悬木人长老凭对山水的熟稔划界，请烟谜主祭司以燃素涂鸦立契，两下同调。圣火一见证，争执双方各自收了私怨，按「决斗定分止争」的古训来，不再拿血去争。这一场调停，不单灭了眼前之火，也把部族间扯断的绳重又接上。仗未打便散，纳塔的同心又多添一道圣火之墙。"

 # 3. 授予英雄古名
 NAT_Award_Hero_Ancient_Name:"古名赐英豪"
 NAT_Award_Hero_Ancient_Name_desc:"归火圣夜竞技场上，勇士锋芒烧得如燃素烈焰。朝廷照纳塔传了千年的古名之法，自同心、超越、希望这些神圣之号中，挑一个赐与立了大功的战士。礼上，回声锻主把古名一笔一笔刻进黑曜石牌，烟谜祭司以涂鸦引出地脉共鸣，让英雄意志与先祖之魂接上。这份荣耀，把全军战魂都点着，也让族心扎进人里。纳塔的英雄血脉，就靠一个个古名，一代一代往下流。"

 # 4. 镇压部族分离主义叛乱
 NAT_Suppress_Tribal_Separatist_Rebellion:"靖诸部叛离"
 NAT_Suppress_Tribal_Separatist_Rebellion_desc:"有几个部族长老被深渊低语说动了心，要在踞石山竖起反旗，把燃素运道掐断。朝廷打着万火归一的旗号，调花羽驭龙骑士与悬木山地精锐去平叛。战士顺灵谜涂鸦的指点，直捣叛军之窝，龙焰与燃素兵器绞成一股谁也挡不住的攻势。这一仗打完，全境驻军重攥在手，内部乱根也拔干净，希巴拉克所立同心之盟又亮。分裂之念，被圣火一烧，成了灰。"

 # 5. 平反历史冤案
 NAT_Redress_Historical_Injustice:"昭雪旧冤"
 NAT_Redress_Historical_Injustice_desc:"奥奇坎当政那些年留下的冤案，如深渊之影，压在部族心头几代。朝廷翻遍烟谜主珍藏的织卷，又走访奥奇卡纳塔旧遗址，把那些被诬为叛逆的英雄一个一个还原：有护龙族者，有死守人龙之盟者。平反仪式设在圣火祭坛前，蒙冤者名字刻上英雄碑，功绩交灵谜涂鸦去传唱。这一场昭雪，把旧伤慢慢治好，部族间攒了多年的芥蒂也散了。纳塔的安稳，在公道之光里越发扎实。"

 # 6. 规范部族税收制度
 NAT_Standardize_Tribal_Taxation_System:"诸部定赋"
 NAT_Standardize_Tribal_Taxation_System_desc:"各族各收各的税，如一堆接得乱七八糟的燃素管线，怎么也顺不起来。朝廷学希巴拉克统一的老办法，立起全国税制：沃陆按颗粒果收成交粮，回声拿工坊出产抵税，流泉把通商收益报上。烟谜祭司以涂鸦把税目一条一条记清，悬木匠人打出统一税符，务求负担公平、征收有法。这套法子一立，国库鼓了，民间杂耗反倒少了，工坊所出如火山喷发般上蹿，替纳塔跟深渊硬扛攒下厚厚家底。"

 # 7. 拉拢部族长老议会
 NAT_Woo_Tribal_Elder_Council:"结好部族长老"
 NAT_Woo_Tribal_Elder_Council_desc:"长老之会那边总是摇摆，如一颗未稳的燃素核心，说不准何时出岔子。朝廷带上回声之子打的龙鳞礼器，一寨一寨地走，许下话：自治老规矩照旧，燃素新好处众人共享。祭祀那日，使者与长老共饮一碗火山酒，拿希巴拉克的誓约作证，把「朝权与自治各守分寸」立成章程。这一趟走下来，认威权的人多了，长老们也真心向着纳塔。朝廷的话，从此一路畅通，没有一处山寨敢打折扣。"

 # 8. 清剿内部深渊邪教
 NAT_Clean_Up_Internal_Abyss_Cults:"肃清内渊"
 NAT_Clean_Up_Internal_Abyss_Cults_desc:"深渊邪教徒如长在骨上的疮，在纳塔腹地散播黑话，拿荧光角菌作饵哄人，还想趁夜神之国边上裂开缝儿钻进去。朝廷令掌耳目者与烟谜祭司同举事，顺着谜烟里那点异常波动摸到邪教之窝。战士披龙骨甲，执燃素火器，就着灵谜涂鸦的净化之力一网打尽。这一场搜讨，反间之能更硬，圣火的光也把心里的黑照散。纳塔的安稳，如缝影针钉住的地脉一般，再撼不动。"

 # 第二类：军事治安类（9-16）
 # 9. 举办全国决斗演武
 NAT_Hold_National_Duel_Martial_Arts:"举国决斗演武"
 NAT_Hold_National_Duel_Martial_Arts_desc:"荣花演武鼓声在赤色大地上滚，六族勇士又挤满圣火竞技场，把传了千年的决斗之俗演给活人看。朝廷以火神之名主持，回声供燃素兵刃，花羽搭起龙焰试炼场，烟谜祭司以涂鸦守着公平。勇士在比试里磨手艺，在对决里接住古名之魄，刀刃一碰便迸出战魂之光。这一场演武，军中规矩更齐，战技在切磋里越精，尚武之劲如源火一般旺，替纳塔攒下对渊最锐的一批锋芒。"

 # 10. 整编部族民兵武装
 NAT_Restruct_Tribal_Militia:"六部民兵新编"
 NAT_Restruct_Tribal_Militia_desc:"各族民兵如撒开的火星，得拢到一处才烧得旺。朝廷照希巴拉克治军的老路子，把沃陆农兵、悬木猎手、流泉水手整编成正规民兵。回声给他们配燃素兵刃，花羽教他们侦察本事，烟谜祭司以涂鸦鼓起士气。整编既毕的民兵，守得自家乡土，也帮得上官军，后备人力如火山沃土一般厚，征召起来快得多。这些扎在部族里的武装，如纳塔防线的细血管，深渊魔物再想渗进来，连条缝都找不着。"

 # 11. 构筑边境防御隘口
 NAT_Build_Border_Defense_Passes:"筑关守隘"
 NAT_Build_Border_Defense_Passes_desc:"烬寂海黑影逼近，边境关防须筑如铁桶。朝廷把全国人力和料都调来，在踞石山、硫晶支脉这些天险处修隘口：悬木匠人拿巨木绳索搭起吊桥工事，回声以燃素龙骨加固堡垒，烟谜祭司布下涂鸦预警符。隘口里架上火焰炮与喷火器，一道接一道地挡，边地稳如浇死之铁。这一番构筑，陆上防守更硬，来犯之敌陷进天堑出不来，纳塔也争到喘气蓄力的工夫。"

 # 12. 训练部族斥候部队
 NAT_Train_Tribal_Scout_Units:"练诸部斥候"
 NAT_Train_Tribal_Scout_Units_desc:"打仗这件事，先得有眼睛耳朵。朝廷自花羽与悬木里挑出精锐，把龙裔追踪、燃素传信、涂鸦伪装这些本事一样一样教与他们。斥候在烬寂海边磨，在火山群里钻，练出一身侦查潜行的硬功夫。练成之后，把敌人动静看得清清楚楚，军中调度亦随之顺，招招都能抢在深渊前头。纳塔之仗，从此打得心里有数：魔物在哪、要往哪去，早有人趴在高处替全军盯着。"

 # 13. 清缴跨境武装走私
 NAT_Crack_Down_Crossborder_Arms_Smuggling:"严缉跨境兵"
 NAT_Crack_Down_Crossborder_Arms_Smuggling_desc:"有黑心商队把违禁燃素兵器与深渊矿石偷运进境，与邪教串作一处，如一道看不见的裂子，慢慢蚀着纳塔的边。朝廷调流泉水师与烟谜耳目，在海岸山道上一处处设伏，把过路船与商队一个一个查。这一查，不单缴了大堆军械，连邪教粮械之道也一并掐断，阵前之械反而更齐整，反谍眼线也更密。边境管控从此严如一堆烧着的圣火，黑暗里的交易再没地方藏。"

 # 14. 推行全民军事训练
 NAT_Implement_Universal_Military_Training:"举国习武备战"
 NAT_Implement_Universal_Military_Training_desc:"深渊就在门口，人人能上阵，方筑得起推不倒的墙。朝廷下了全民习武之令，男女老少都要学些基本本事：沃陆教近身打法，回声讲燃素兵器怎么用，花羽管防空与预警。考核就放在荣花演武上，拿古名做奖品，让尚武之心扎进每个骨里。此令一行，后备人力足了，仗也打得旺，军中士气如火山将喷一般高。纳塔的每一个寻常人，从此都做好了抄起兵刃守家的准备。"

 # 15. 平定军阀割据势力
 NAT_Pacify_Warlord_Separatist_Forces:"平拥兵诸酋"
 NAT_Pacify_Warlord_Separatist_Forces_desc:"有数拥兵之酋，欲在奥奇卡纳塔旧址左右自立山头，掐断燃素运道，搅乱刚立之国。朝廷举着万火归一之旗，调官军与各族之兵一齐讨伐：花羽驭龙骑士自头顶砸营，悬木山地兵堵住退路，回声燃素炮把工事轰塌。这一仗打下来，朝廷之令又管全境，威权也更重。纳塔的统一如圣火一般，谁也拆不开，分据之影在龙焰与源火里散得干干净净。"

 # 16. 升级军用装备制造线
 NAT_Upgrade_Military_Equipment_Lines:"军坊铸利兵"
 NAT_Upgrade_Military_Equipment_Lines_desc:"旧日军坊，对付深渊魔物已嫌其慢，须以燃素好生翻新。朝廷下令把全国军坊都过一遍：回声引进古龙锻炉的本事，拿龙鳞掺燃素打造甲胄；烟谜祭司以涂鸦把工序理得更顺；流泉则保燃素原料一路运到。炉子一经翻新，造兵刃、出龙骨甲都快得出奇，所出如源火外喷。翻新之军坊，给纳塔之兵铸出一副打不坏的钢爪，与深渊硬碰的本事，也就一日强过一日。"

 # 第三类：经济工业类（17-24）
 # 17. 开发部族传统矿产
 NAT_Develop_Tribal_Traditional_Minerals:"采掘族矿"
 NAT_Develop_Tribal_Traditional_Minerals_desc:"矿洞口，烟谜主祭司蹲石壁前，拿炭笔于壁画一串灵谜涂鸦，画毕退开两步，对那串符号视之良久，回顾曰：「脉往东偏三尺，往下挖。」回声之子匠人将燃素灯系于腰，当先钻入洞；沃陆之邦苦力扛筐随于后；悬木人方在洞口外搭运矿栈道，藤索圈圈缠上木桩。隧洞深处传来锤声，一下，复一下。未几，一筐带暗红纹路之矿石被拖至洞口，匠人抓起一块，以袖拂灰，对灯看那纹路，末了掷入筐中，喊曰：「再深一尺。」"

 # 18. 修建部族间贸易商道
 NAT_Build_Inter_Tribal_Trade_Routes:"诸部通商道"
 NAT_Build_Inter_Tribal_Trade_Routes_desc:"各族之间那道买卖的墙，如一节未接通的燃素管，物货送不过去，日子便富不起来。朝廷学流泉之众通商的老规矩，修起贯穿全境的商道：悬木人在山里搭藤桥，流泉的人疏浚河道，回声之子铺出燃素所驱的轨道。商道一通，沃陆颗粒果、回声工艺品、流泉水产便彼此流转，买卖既快，百姓置办物事也省了钱。这条把六族拴作一处的钱货之绳，令纳塔物产各得其所，亦使同心之种，在一趟趟买卖里扎下根。"

 # 19. 建立部族手工业合作社
 NAT_Establish_Tribal_Crafts_Cooperatives:"立部族匠社"
 NAT_Establish_Tribal_Crafts_Cooperatives_desc:"各族老手艺如撒在各处的珠子，颗颗都好，只是没串成串。朝廷把沃陆编织、回声锻造、烟谜涂鸦都拢到一处，办起手艺之坊：燃素工具共使，法子共学，规矩与销路也定成一样。老手艺这么一合，反倒有了新气象，民间作坊多了，百姓进项也厚了，置办东西更不费钱。那些出自部族的手工物件，身上带着纳塔的记忆，也成了钱粮的一根台柱。珠子串起来，才是一条看得见的项链。"

 # 20. 改革部族土地分配制度
 NAT_Reform_Tribal_Land_Allocation:"部族均田令"
 NAT_Reform_Tribal_Land_Allocation_desc:"部族间为地界争了多少年，如一条早干涸的火渠，把田里的水都误了。朝廷照希巴拉克讲公道的旧法，把地重分：沃陆得火山谷地肥田，悬木守踞石山林子，流泉守沿海渔场。烟谜祭司以涂鸦立下界碑，回声的人帮着修水渠，令一寸地都养得人。这一改，田里收成翻了几番，人心也稳了。纳塔生计如火山岩打的地基一般实，全民去打深渊，身后有满仓的粮撑着。"

 # 21. 引入外来工业技术投资
 NAT_Attract_Foreign_Industrial_Investment:"引外资兴工"
 NAT_Attract_Foreign_Industrial_Investment_desc:"纳塔燃素炉冶行到关口，只凭自家本事，一时突不破。朝廷以燃素物力与市面为质，把提瓦特各国工匠与钱帛都请进来：自璃月学岩系防御的工事，自须弥借治学的路数，自枫丹取精密机械的法子。外来银钱手艺一人，军坊既多，所出亦节节而高，与各国交情随之热络。这一开门，纳塔炉冶如附快马；自家燃素术与外头新法一撞，迸出的火星照亮前路。与深渊相搏的家底，也更厚一层。"

 # 22. 规范部族商品交易市场
 NAT_Standardize_Tribal_Commodity_Markets:"诸部平市"
 NAT_Standardize_Tribal_Commodity_Markets_desc:"各族集市各卖各的、各算各的，如一炉烧乱了的燃素，怎么看都别扭。朝廷立下统一买卖规矩：度量衡划一，价钱定得公道，又请烟谜祭司组一班子盯着。集市上，沃陆之粮、回声之兵器、流泉之海产，一样一样规规矩矩流通，买卖顺了，百姓也少花了冤枉钱。市面既理，纲纪如圣火井然，做买卖的劲头也放开了。各族在互通有无里都得了好处，同心之绳亦越拧越牢。"

 # 23. 建设水利灌溉工程
 NAT_Construct_Irrigation_Projects:"开渠引水"
 NAT_Construct_Irrigation_Projects_desc:"火山地带干得裂口，庄稼年年遭殃，那份急切不比深渊压境小。朝廷学流泉治水的本事，把全国人手都调动起来：悬木人凿山渠，流泉的人清河道，回声以燃素机器抽水，烟谜祭司画符祈雨。水渠一路修到沃陆每块田里，黑土喝饱了水，收成一年比一年好。这些淌过来的活水，养了庄稼，也安了人心，让纳塔生计稳如夜神之国，任外头风雨，也晃不动。"

 # 24. 发行部族统一流通货币
 NAT_Issue_Unified_Tribal_Currency:"诸族同铸通宝"
 NAT_Issue_Unified_Tribal_Currency_desc:"从前各族以物换物，拿粮换刀、拿鱼换布，麻烦得如没炼过的燃素，一桩买卖要扯半天。朝廷拿燃素结晶做底，铸出统一火纹币，由圣殿统一发行，烟谜祭司负责监管。钱在全国一通行，买卖不用再翻来覆去折算，日子稳了，通商与工坊所出亦俱增。这枚刻着圣火图腾的钱，把六族钱货串作一线，纳塔钱脉自此畅通，兴工、打仗，都有了实打实的支撑。"

 # 第四类：文化外交类（25-30）
 # 25. 编撰部族英雄史诗集
 NAT_Compile_Tribal_Heroic_Epics:"编修英雄谱"
 NAT_Compile_Tribal_Heroic_Epics_desc:"纳塔英雄事，如天上数不清的星，散在各处，须编成一部史诗，方能代代传下。朝廷把烟谜说书人与花羽史官请到一处，一寨一寨地走，把希巴拉克屠龙、莉安歌射龙、特诺切抗渊这些故事尽搜集来。书里以涂鸦做插图、燃素做装订，一页一页写的都是纳塔人的胆气与坚守。这部史诗一出，族中自豪劲儿便点着了，古名里的气魄也走进寻常人家。纳塔文化之心，如圣火一般旺，成了把全民拧作一处的一面旗。"

 # 26. 举办纳塔文化交流节
 NAT_Hold_Nata_Cultural_Exchange_Festival:"纳塔文化交流会"
 NAT_Hold_Nata_Cultural_Exchange_Festival_desc:"六族文化如六样颜色不同的火，须凑到一处，才烧得出万火归一的亮。朝廷在源火城办起文化交流节：沃陆跳颗粒果丰收舞，回声演燃素锻造手艺，流泉唱开船歌谣，烟谜祭司当场画涂鸦。各族之人载歌载舞，把自家传统拿出来给人看，也把别家好处学回去，隔着多年的那点生分，在一片笑声里化开。这一场盛会，把人心拢得更紧，纳塔文化的光彩也亮给所有人看，同心之种在热闹里悄然发芽。"

 # 27. 与邻邦签署边境和平协定
 NAT_Sign_Border_Peace_Agreement_With_Neighbors:"四邻息兵盟"
 NAT_Sign_Border_Peace_Agreement_With_Neighbors_desc:"边境上老是磨擦、互相提防，那股子猜忌，跟深渊低语一样蚀人。朝廷本着希巴拉克的和平主张，遣使团往邻邦谈，带上燃素工艺品与火山宝石做礼，许下开放航道、共享深渊消息之利。圣火一见证，两边字都签在盟书上：界划清了，边市开起来，又约好一同防守。这份和约，不单把邻邦关系修好，边关之负也轻了，纳塔得以腾出手专心对付深渊。和平之光，此番真照亮了赤色大地。"

 # 28. 设立部族语言标准化机构
 NAT_Establish_Tribal_Language_Standardization_Body:"定部族雅言"
 NAT_Establish_Tribal_Language_Standardization_Body_desc:"六族各说各的话，如刻着不同符文，办事传话处处隔着一层。朝廷设一正音之所，把六族学者都请来，拿源火祭祀的通用话做底，把各处方言归拢到一处，定出纳塔话的规矩。语法以涂鸦记下，课本拿燃素刻印出去，统一之话很快传遍全国。这么一统一，人心更齐，朝廷之令下达得顺，各族往来也不再打磕绊。纳塔之同心，自同一句话始，一句一句地，说进每个人心里。"

 # 29. 派遣文化使团出访友邦
 NAT_Dispatch_Cultural_Missions_To_Friendly_Nations:"文使通好"
 NAT_Dispatch_Cultural_Missions_To_Friendly_Nations_desc:"纳塔文化那点火，不该只烧在自家山里，须叫提瓦特都看见。朝廷组了文化使团，携了英雄史诗、燃素工艺品、涂鸦卷轴，一国一国地去。使团在异乡把纳塔的决斗、人龙共处的旧俗、燃素的新手艺一一摆出，叫各国之人都识得：这片赤色大地，是何等意思。此一行，纳塔名声大了，与友邦的交情也深了，联合抗渊便有了文化上的根底。纳塔二字，自此在提瓦特各国间被人念起。"

 # 30. 确立纳塔传统决斗为国家仪式
 NAT_Establish_Nata_Traditional_Duel_As_National_Ritual:"纳塔决斗入典"
 NAT_Establish_Nata_Traditional_Duel_As_National_Ritual_desc:"圣火祭坛前，主事者将那道立决斗为国礼之令念毕，台下六部之人皆不出声。烟谜主祭司先上前，将主持大典之烟灰于坛边撒成一圈；回声之子匠人扛来一柄新锻礼刃，当场试锋；花羽会之人在高处拉起彩幡，场内即刻亮堂。一老酋发问：「天大争端，真就凭一场决斗定？」主事者曰：「法典在，动手之处摆在此，谁也做不得假。」老酋遂不复言。归火圣夜那晚头一场国礼决斗开打，二人于场心照规各退三步，看台上六族之人齐探身，把脖子伸长一寸。"
 
#事件
 # 1. 召集部族议会
 NAT_Event.1.t:"六酋火台聚议"
 NAT_Event.1.d:"纳塔六月，赤霞弥天。图兰旧台之上，青烟直起。六部酋首相继而至：沃陆之邦农酋腰插开山斧，入台先觅水饮；回声之子锻主袒臂，肩上铁锤犹赤；流泉之众航首收螺入怀，衣袂未干；悬木人崖主缘藤索翻身而下，双足着地，尘不起；花羽会鹰主肩立青羽龙，龙爪深入其衣；烟谜主巫首灰袍裹身，独立人后。主事者登台，奉玛薇卡火令宣召，言深渊日逼，六族之火若各守一炉，势将尽为敌吞。农酋抗言曰：「沃陆之火，传自阿霍布，历数世矣，孰得而并之？」锻主以锤顿石，火星四迸，应曰：「老酋之言是也。」航首独曰：「海隅亦闻兽吼，并火，吾不阻也。」巫首神色微冷曰：「并火易耳，孰为添柴？」众皆默然。主事者不怒，出六物陈于火前：颗粒果、燃素一锭、海螺一枚、藤绳一束、鹰羽一支、烟灰谜图一幅。火光映之，六影落于地，晃漾不定。农酋见果影，色稍霁；锻主凝视炉影，久之，遂释其锤。主事者曰：「火并为一堆，柴仍各家自添耳。」农酋冷笑一声，解腰间斧，置之火侧；余人次第各弃所携。六物同焚，青烟绞作一缕。远山兽吼复鸣。六部人马皆趋火台而前，火光照面，明暗不定。"
 NAT_Event.1.a:"焚火并坐，共议纳塔"
 NAT_Event.1.b:"执火定规，一言九鼎"

 # 2. 拉拢军阀同盟
 NAT_Event.2.t:"结诸酋之盟"
 NAT_Event.2.d:"纳塔荒原，数路酋长各据一方，营盘仍扎火山口上，栅悬兽骨与风干火榴果，风过，果壳簌簌有声。主事者入大帐，那拥兵最众之老酋以战刀拍案，酒碗乱晃，曰：「纳塔借我兵，将以何物相易？」旁一少年酋长冷笑曰：「与之费口舌何为？火神一言，孰敢不从？」老酋瞋目曰：「火再烈，亦烧不入我釜中。」主事者不恼，斟酒推之曰：「火山酒之专榷、盐井之份，尽归于汝。盟约既立，兵听调，账各算。」少年酋长推刀而前曰：「盟约值几多兵？附魔甲械、先征之权并许之，兵乃速至。」老酋哼曰：「饱其欲，他日谁复能羁之？」二人各按刀柄，帐中燃素炭爆出蓝星数点。主事者展兽皮舆图，压以一酒碗曰：「利可许，械亦可给，惟须先定先驱者为谁。」帐外绒翼龙数头掠过热源，其影落舆图上，一闪即逝。二酋皆俯首视之，久无一言。"

 # 3. 安抚沃陆之邦
 NAT_Event.3.t:"沃陆之邦归心"
 NAT_Event.3.d:"沃陆之邦谷场，黑土深厚，颗粒果本当压弯枝头，此数月却串串空瘪。主事者踏晨露至田埂，见数老农蹲而摇首，脚边竹篓尽空，往年此时已堆积盈筐。白须老汉仰面曰：「火方烧，田反歉，莫非所拜非其神？」一后生以空穗摔地曰：「拜神何益？深渊兽吼已及山口，吾往戍边！」老汉瞋目曰：「汝去，此一季谁收？」主事者蹲而捻黑土曰：「果救不得近火，兵亦饿腹。吾且为汝疏渠、置农坊，翻焦土为熟田，种颗粒果与火榴果，以实仓廪。」后生急曰：「仓既满，边谁守？」主事者指山口曰：「则择壮丁补戍，田且暂芜，边先固，二者吾兼取之。」老汉置穗于渠边，徐徐而起曰：「渠果可修，吾再种一季。」主事者应之。后生已蹲而扶起倒伏果架，露湿二人之袴。"

 # 4. 争取回声之子
 NAT_Event.4.t:"回声之子缔盟"
 NAT_Event.4.d:"回声之子工坊依火山裂隙而立，锤落，则地与火相应。锻主袒胸，胸前烙祖传炉火纹，此数日已三逐扮作行商之深渊来人，却对砧上一块烧红附魔铁坯发呆，炉膛燃素火明灭不定。主事者入坊，铁坯犹在，无人下手。锻主曰：「火则有矣，只恐所出之刀，餍不得如许人。」一老师傅自炉后转出曰：「何惧？尽出看家本领，添炉招徒，好铁一岁可增数倍。」锻主摇首曰：「本领尽出，谁复认回声之子之炉？」主事者探铁坯之热曰：「先拨钱粮，为汝扩战坊、补步兵甲械，此炉火先为纳塔刀兵而燃。」老师傅不服曰：「甲械可支几时？传艺乃长久之策。」主事者并记之曰：「刀须打，徒亦须带，汝出手艺，吾出料。」锻主乃抡锤，一锤重于一锤，锤落处铁坯腾起一圈祖传炉火纹，尽压裂隙之鸣。老师傅转身往炉后添炭一把。"

 # 5. 和解流泉之众
 NAT_Event.5.t:"和解流泉之众"
 NAT_Event.5.d:"流泉之众居纳塔沿海，船首皆雕贝螺，号角一发，雾中便有回响，惊起滩上浮流鸟群群。近以分利之事与内陆数族相持不下，海面冷落，空泊位旁惟余数头鳍游龙于浅滩盘旋。黄昏，航首立于栈桥，望空泊位，见主事者至亦不行礼，但以号角别于腰间。一老船工蹲桩边补网，头亦不举曰：「路有二，汝先言所由。」主事者曰：「拨料为汝扩船坞，商船载纳塔火焰土产，行甚速，以火油、颗粒果易摩拉与铁，海路乃活。」老船工乃举首曰：「海路既活，深渊自水上来，奈何？先修堤坝码头，向更深海底取黑油，防既设矣，他日工坊亦添一把柴。」航首冷笑曰：「护汝之油，抑护吾之船？」主事者止二人曰：「船须扩，堤亦须修，货出于外而门守于内。」海浪拍桩，一声复一声。航首解腰间号角吹之，雾中果有回响荡回。"

 # 6. 联结悬木人
 NAT_Event.6.t:"联结悬木人"
 NAT_Event.6.d:"悬木人栖火山林中，木屋缘树干而架，藤索往来枝桠间。深渊魔物日啃林界，最外一重栅栏已塌其半，树脂焦气杂燃素之呛，飘入寨中，藤索所悬火把尽为熏黑。崖主缘索而下，鞋底沾魔物黑灰，礼数虽在，其言则直：「树可长几许，墙便可垒几许，只恐时不我待。」一老木匠负斧至曰：「时既不予，亦须垒之，伐木垒石，速筑工事，使藩篱入土如老树生根，敌乃难越。」崖主摇首曰：「墙虽高，终须人守，何处告急，皆须飞身以补。」主事者仰视参天树冠曰：「则更制轻装器械，令悬木人来去如林间之豹，何处有缺即飞身补之，全阵乃活。」老木匠以斧杵地曰：「器械虽速，墙不可待。」主事者曰：「汝伐汝木，彼造彼械，两手并举。」崖主闻言，以斧插腰间，只俟一言。林深处，有物踏断枯枝。"

 # 7. 争取花羽会
 NAT_Event.7.t:"争取花羽会"
 NAT_Event.7.d:"花羽会乃纳塔独一能驭空之族，肩上立绒翼龙，一振翼即入云头。然此数日，深渊黑气顺风爬上龙脊，数头老绒翼龙目光发直，飞亦不听号令，即龙厩中最狞之暝视龙亦随之躁动。鹰主乃一女子，臂缠彩绒羽，按一头不安之青羽龙于臂上，以指轻顺其颈羽。见主事者至，不待问而言曰：「龙心已乱，天上此门将不能守。」一老驯龙师自龙厩那头来曰：「心既乱，则重诵古老龙语，吾一句句涤其乱气，制空终须仗龙。」鹰主曰：「能诵者几头？先拨木料，扩龙厩、增驯龙之坊，令飞骑次第补上天，天乃可支。」老驯龙师捋白须曰：「飞骑虽众，龙不奉命，亦属徒然。」主事者仰视黑云低压之天曰：「厩须扩，龙语亦须诵，汝教汝之龙，彼补彼之骑。」青羽龙忽昂首，向黑云一鸣。鹰主笑曰：「彼犹识人。」"

 # 8. 安抚烟谜主
 NAT_Event.8.t:"安抚烟谜主"
 NAT_Event.8.d:"烟谜主藏火山迷雾中，终岁不见天日，以烟为笔、以灰为墨，画消息于石壁布幔，乃纳塔目最锐之一路。近来雾中混入生面，数处灵谜涂鸦为人改易笔画，部族之内转相疑贰。巫首裹灰蓝长袍，面画谜纹，以一幅为人所改之烟画摊于主事者前，指其一笔错符曰：「此非吾族之人。」语讫，屋中静极，惟闻火盆烟灰坠落之声，壁上谜纹于火光中明灭。一少年密探近前曰：「通消息之法宜尽更之，增暗哨、易符记，使迷雾复为外障之墙，人不得窥。」巫首摇首曰：「徒守何益？须探之较彼更速。」密探曰：「则借吾等玄妙之学，以烟谜主之智用于诸处，探愈速、算愈准，深渊诡计未成而先见之。」主事者反覆视烟画曰：「墙须补，目亦须远置，汝改汝之符，彼探彼之消息。」巫首卷画，目中光于火盆里一闪。"

 # 9. 调解部族边境争端
 NAT_Event.9.t:"调解部族争"
 NAT_Event.9.d:"纳塔边境两族以一条火山矿脉相争，皆称先祖所遗。数日之间，两边壮丁各持刀矛列于矿口，火把连成二龙，皆不肯先退，深渊之人伏远处石缝后，专待此火之燃。主事者至时，两族头人隔浅沟对骂，手皆按刀柄。此头人呼曰：「矿乃吾先祖所辟，何得分汝一半？」彼头人应曰：「汝先动手，尚敢出此言！」一老者挤至沟边劝曰：「划而共之，利则两分，各退一步，气自平。」少年头人不从曰：「依纳塔旧规，各出一勇士，于圣火竞技场、火神之前两人对搏，矿归胜者，痛快！」老者急曰：「此端一开，他日处处皆须动刀。」主事者以火把插入沟边火山岩缝曰：「矿先封之，皆不得采。欲斗，则斗于圣火竞技场，吾亲视之；欲谈，则皆坐。」两族头人隔沟相瞋，皆未先收手，沟中水为火把映作赤色。"

 # 10. 订立烈火大契
 NAT_Event.10.t:"焚火缔大契"
 NAT_Event.10.d:"图兰圣城火山祭坛之前，熔岩缘石缝徐流，赤如新血，六部首领层层围立，玛薇卡之志震于空中，人人为之血沸。祭司捧契书而上，兽皮之上留六片空白，专俟各家自按其印，旁压旧火种一枚与六样部族信物。一老酋逡巡不前曰：「契一立，六族之火即系于一处，他日谁复敢言一家之私？」旁一少年酋长以爪按之曰：「善哉，此系也！散者千年之火，今日乃并作一堆。」老酋犹欲争，主事者先自按印记曰：「契但管大事，各家小火，各家自添。」六酋依次而前，或以爪、或以印、或以炭灰，各按标记于兽皮。末印既落，坛火腾起丈余，映六面通明。老人先跪，少年随之而跪。坛沿积灰已久，为热风扑落，无人拂之。脚下熔岩犹徐徐流，旁一旧旗为火舌所舔，无人往扑。"

 # 11. 玛薇卡的意志宣言
 NAT_Event.11.t:"玛薇卡明志"
 NAT_Event.11.d:"赤红披风于图兰圣城最高处猎猎作响，玛薇卡立于崖边，火山之光将其勾作一团火。脚下六部旌旗参差，火纹旗、龙鳞旗、藤纹旗各认其家，人心未齐，观望者众，而深渊之影已压至提瓦特门前。一主战酋长先曰：「当鼓血气，高呼火焰之抗争，人人愿为此土拔刀，人心自归。」一长老摇首曰：「呼之虽响，何益？六族各持一说，号令不一，事终不成。宜尽收权柄，借火神之威，攥众人为拳。」酋长瞋目曰：「攥之既紧，诸酋面上未必好看。」二人争至面赤，玛薇卡回首，火光在眸中一跳，谓主事者曰：「汝为吾言，作何说法，吾皆听之。」主事者望崖下参差之旗曰：「言吾为汝言，旗仍须各家自扛。抗争亦须，画一亦须，两手皆攥。」玛薇卡敛披风，转身向祭坛，崖下之旗为风卷作一片猎猎之声。"

 # 12. 改革部族议会
 NAT_Event.12.t:"部族之会改制"
 NAT_Event.12.d:"图兰圣城议事厅中，六族使者争至半日，一声高于一声，如岩浆在釜中翻，热气熏得岩壁古名发亮。旧规乃诸部平坐之时所定，今则人人发言、事事须议，一令既下，往往如石投海。一少年乘争势之凶，摸炭条于墙角岩画上添一新图，画六旗并作一堆火，长老见之，视良久，终未擦去。一少年使者拍案曰：「议事之序宜一刀截短，惟留数主事者裁决，令行禁止皆速，纲纪自立。」一老酋徐徐曰：「截短则速矣，各家之声何存？宜重分席位，使各族皆知己声不没，宁多费唇舌，以易一真心归附。」少年使者犹欲驳，主事者伸手按之曰：「事宜速办，言亦须令人尽。主事者吾定之，席位依汝所言增。」老酋视那炭画一眼，遂咽所欲驳之言。少年收炭条，指犹黑。"

 # 13. 强化火神权威
 NAT_Event.13.t:"火神权威日隆"
 NAT_Event.13.d:"纳塔之土，尚有数部族不尽信玛薇卡之火，深渊低语乘隙而入，言火神不能保众，数村已阴改祭礼，以火种供于他所。阶下石缝积灰，乃往年圣夜所遗，风过则浮起。老祭司捧旧年经卷立于阶下，边角为烟火熏黄，卷中记归火圣夜旧仪，手微颤曰：「重开讲坛，述火神旧年恩德，以祭礼与税赋尽归圣火名下，使一族之人日日记得火自何来。」一军中领兵者跨前曰：「讲坛能讲回几村？宜以火神之志直灌军中，兵器刻火纹，出征先祭火种，刀锋所指即火神所愿。」老祭司急曰：「信与刀系之太紧，易生他心。」领兵者不退曰：「不系之紧，何以拒深渊？」主事者接经卷，翻至熏黄之页曰：「讲坛照开，兵亦照练，火在庙中，亦在刀上。」老祭司以手拭袍，复捧稳经卷，领兵者转身往教场点起火盆。"

 # 14. 编订古名体系
 NAT_Event.14.t:"古名谱系编定"
 NAT_Event.14.d:"纳塔古籍载各部族自有之火焰古名，乃火神所赐之印，一名即一段来路。年岁既久，少年族人能言自家部族，而不能呼其真名，长屋火塘边为此叹息数回，松木于火中爆响。六族长者坐至天明，塘中柴添了又添，只为争一字之写法。一老者指兽皮册曰：「使每族人重识其古名，归火圣夜当众诵之，文脉既厚，人心自齐。」一司征召之少年接口曰：「诵名何用？以古名系于征召，应名者即应火神之征，名愈响，兵至愈速。」老者沉面曰：「如此，则古名不复为一念。」少年曰：「念能当几人用？」主事者合册曰：「名须认回，亦须有人应征，诵名者归诵名，征兵者别造一册，勿混于一纸。」天光自门缝入，照摊开之兽皮册，老者提笔，将争了一夜之字重描一遍。"

 # 15. 镇压分离主义势力
 NAT_Event.15.t:"讨离叛之族"
 NAT_Event.15.d:"烬寂海之滨有数部族为深渊之言所惑，哗言欲自立门户，谓纳塔之火管不及此。此念如野火，一处既燃，他处随烟而起，尤为要者，其所割地界正当硫晶支脉之隘，为深渊留一跳板。诸自立部族大帐前立新旗，旗上纹样改易二处，风来则旗角抽杆，拍拍有声。主事者以塘报拍于案。一司粮械者曰：「先收驻军与粮道，探子布满路口，民用之物可省则省，使欲遁者无翼可飞，日久自散。」一强硬者拔刀曰：「与之耗何为？直取为首者问罪，杀一以儆百，以血书不许分裂之规。」掌粮械者急曰：「火星既飞，他处未必不燃。」主事者曰：「粮道先塞，人则次第而擒，先断其跳板，再清其首。」强硬者插刀入鞘，大帐前新旗于风中抖了一夜，旗角磨出毛边，终不肯垂。"

 # 16. 纪念灾厄英雄
 NAT_Event.16.t:"灾厄英雄入祀"
 NAT_Event.16.d:"早年深渊大灾，纳塔勇士提刀扑上，以身塞魔物之口，血渗火山岩缝，名姓一一刻于图兰圣城岩壁。岁月既久，岩壁为烟火熏黑，字迹渐淡，少年人过而不知其谁。深渊复逼，主事者决意重举大祭。一主祭抚壁曰：「以勇士之事讲与生者，令血气自故纸中复燃，人人争作后来守火之人。」一军中教头负木刀至曰：「故事讲毕即散，宜以其战法编入操练，令新兵依前辈步法挥刀，少流枉血。」主祭曰：「名且记不住，何谈步法。」教头以木刀顿地曰：「记与不记，临阵自知。」回声之子翻旧歌重唱，唱至中途，或言词误，一人接口曰：「误则误矣，调不错便可。」满场随之哼唱，主事者举手遥指壁上数行最淡之字，教头会意，率众列开木桩。"

 # 17. 平反奥奇坎暴政冤案
 NAT_Event.17.t:"奥奇坎冤案昭雪"
 NAT_Event.17.d:"奥奇坎一族负莫须有之叛名，压数代人。此旧案如火山灰，落入土中无形，而岁岁积之，怨气顺地缝渗入六族之间，深渊最善挑此旧伤以撒盐。主事者决意发其案。案卷搬至，积灰半寸，其上按一枚褪色手印，奥奇坎之老人跪于阶下，不肯起。一司通好者近前曰：「此案不如昭告提瓦特列国，令天下共见纳塔之公道，声望既涨，他日诸事皆顺。」老人猛抬头曰：「吾所要者清白，非为尔等挣颜面！」主事者展案卷曰：「先于圣火竞技场前当众重审，以当年作伪之证一件件摆出，令火为汝烧尽污名。」通好之官急曰：「提瓦特那边奈何？」主事者截之曰：「公道既立，名声自随之。」老人撑膝徐徐起，伸手摸那褪色手印，指停纸上良久，末了以案卷向火盆边又推近些。"

 # 18. 建立决斗调解制度
 NAT_Event.18.t:"决斗调解立制"
 NAT_Event.18.d:"纳塔人好决斗，此乃旧俗，然无规矩之斗，斗久则失其本，自争高下乃至你死我活，深渊最乐见之，专择此等场合下手。主事者决意立一全章，使决斗自野斗复为火神前之荣誉。草案摊火盆边烤，火中煨一块燃素，蓝焰上下跳跃。一老决斗士近前视之，捋须曰：「裁断之权尽收圣火名下，胜负由祭司作证，私怨不得夹带，纳塔之内自少许多枉死之血。」一少年不服曰：「皆听祭司所断，尚何以为决斗？宜以分寸偏于荣誉，胜则光采，败则体面，人心乃服。」老决斗士按膝上旧刀曰：「刀终须见，只须不见这般难看。」少年曰：「见刀乃见真章。」主事者并二草案为一，删去数处可生歹念之隙曰：「胜负归祭司作证，颜面归汝等自挣，二者皆书之。」老决斗士点首，横旧刀于膝，鞘漆早磨尽，露其下铁色发亮。"

 # 19. 统一部族律法
 NAT_Event.19.t:"部族律法归一"
 NAT_Event.19.d:"千百年间，纳塔六族各守其法：或严如熔岩，动辄罚没；或宽如流泉，言定即行。法既不一，族与族间诸事相碍，深渊探子最善钻隙，见哪条律有缝，即自何处撬之。主事者决意合六族之法为一部火律。六族长者坐长屋至天明，塘中柴添了三四回，案上摊六族旧契与火印，一字一字抠之。一主威权之长者曰：「条条皆盖火神之印，不许复言自家有自家之规，纲纪须硬如火山岩。」一司民生之长者驳曰：「硬过其分，作坊商路皆喘不得气。立律之时宜为生民与买卖留余地，减各家杂耗，法非独压人，亦须养人。」主威权之长者曰：「养人养出窟窿，深渊又钻入。」主事者择其最易起争之款曰：「压人者书死，养人者留活口，吾一条条改与汝看。」二长者凑兽皮之前，头抵着头抠那几字，塘中又添柴一根。"

 # 20. 玛薇卡的纳塔誓言
 NAT_Event.20.t:"玛薇卡纳塔立誓"
 NAT_Event.20.d:"火山轰鸣，玛薇卡立于祭坛正中，权杖高举，火自杖头直烧至臂弯。其当六族之面立誓：以火焰守此土，止分裂，拒深渊，令纳塔之名传于提瓦特之每一隅。言讫，满城之火齐扬，龙厩绒翼龙随之长鸣，人面皆映有光。有老族长自箱底取当年所签旧盟约重读，读至落款，忽觉少一印，抬头欲问，四周早已跪倒一片，话头遂为所没。主事者立于人后，心知誓既立，其后在令此火烧得长久。一司火律者前曰：「合六族之兵与粮调于一处，凡违誓者，一切依火律处置，令誓生齿牙。」一司祭仪者不肯曰：「徒以罚压不能止，宜以誓词刻入每一火塘、每一面旗，令童子自幼诵之，誓自生根。」主事者引二人至旧盟约前曰：「齿须生，根亦须扎，火律所管者管之，所不能管者刻于旗。」老族长犹捏那纸盟约，落款空白为火光照着，终不复问，但折而纳之箱底。"

 # 21. 探索图兰圣城
 NAT_Event.21.t:"探图兰圣城"
 NAT_Event.21.d:"图兰圣城埋于火山腹地最深处，甬道口之黑气已凝作水珠。主事者择十二好手而入，火把照见两壁密密龙文，映得壁上守城龙鳞纹一圈圈发亮。一少年战士且行且以刀于随身木牌上刻名，言此去若不返，好歹留一记号；长屋之外那面墙，已挂满此等木牌。老向导伸手止之，指壁上一行龙文曰：「此乃守城龙所留，汝乱刻之，彼以为吾等为贼。」少年战士按刀入鞘曰：「贼与不贼，先取火典再言。工坊学堂候此数卷书，候之不得。」老向导曰：「书在其内，龙亦在其内。汝既得罪于龙，书虽得，亦出不得此门。」二人各执一说，主事者不即断，但以所携旧信物于火把上烤之。火光一晃，壁上龙文宛如生者。少年战士咽了口唾，收木牌入怀。甬道深处，有物一亮，如一只眼。"

 # 22. 研究燃素技术
 NAT_Event.22.t:"研燃素之术"
 NAT_Event.22.d:"燃素埋于火山最深处，一团黑石之中锁着纯粹之火，惟此锁千年无人开。深渊铁皮魔物已摸至矿脉之侧，爪痕拖得甚长。有童子于硫晶支脉边拾得黑石一块，捧献长老，长老以手帕裹之，转身复埋原处。童子蹲其旁不肯去，问曰：「石中果有火乎？」长老但曰：「有之，然非与小儿戏者。」主事者以黑石掂于掌中，心中已定二事。一少年匠人近前曰：「多开熔炼之坊，取石中之火炼而出之，令家家皆得爨，纳塔作坊随之而活。」旁掌粮械者以刀鞘顿地曰：「先紧军用。以燃素灌甲械，刀炮硬几分，目下即须用。民用那头，缓之不死人。」匠人驳曰：「缓之？坊冷一日，人心便冷一日耳。」二人争至额上见汗，主事者以黑石还置童子掌心，令其复埋。童子攥石，蹲矿口视那群铁皮魔物爪痕，移时不动。"

 # 23. 人龙关系政策
 NAT_Event.23.t:"人龙修好"
 NAT_Event.23.d:"火塘边空一位，乃早年为龙使所留，后无人坐，亦无人移去。主事者蹲身，以手摸那块磨得发亮之黑曜石面。一老臣拄杖至曰：「当年火龙一吐气，深渊魔物即成灰。今人嫌龙野，龙嫌人絮，此位遂空。」主事者曰：「则请之归。送还燃素与旧礼，重开此席，信者一点一点焐之。」一少年官佐摇首曰：「焐乎？万一他日失控，咎将谁任？立一章程，何处许飞、何处不许落，皆书明白，龙亦须守法。」老臣以杖顿地曰：「汝以龙为囚徒而管之，彼肯低首乎？」官佐曰：「肯与不肯，皆须低。」二人相持不下。主事者抬头，见一火龙自源火之热源上掠过，鳞上火星洒了一路，其影扫过空席，旋即不见。老臣视影消处，伸手将怀中旧礼拢了拢。"

 # 24. 守护源火之心
 NAT_Event.24.t:"镇守源火之心"
 NAT_Event.24.d:"源火之心埋于图兰火山最底，乃全境火之源。近者火山之内裂开数缝，黑气顺缝渗入，护源火之结界薄如窗纸。六族使者破例聚于一堆燃素火旁，火苗蓝得发亮，皆不肯先开口，盖先开口者，即认别家之规矩。巡夜者自西侧林子归，蹲视那片脚印，只报一句：「不止一伙。」火堆爆响一声，六人同时抬头。主事者心中已定二事。工头主环火山加筑堡垒，层层裹住源火，任黑气漫上亦近不得身；带兵者则曰：「堡垒乃死物，宜择最忠勇之战士别立一军，日夜守于腹地，人与火寸步不离。」工头反问曰：「人能支几日？」带兵者答曰：「支至黑气退而已。」两说终不相下。六人皆不复言，帐外风声亦止，惟闻源火在极深处，起落如鼾。"

 # 25. 建设元素熔炉
 NAT_Event.25.t:"铸元素熔炉"
 NAT_Event.25.d:"元素熔炉乃纳塔独门之技，能炼火山之火为可用之力。数十年来无人经心，炉或锈或塞，工坊次第冷落。主事者入废炉，足下积灰盈寸。悬木人猎手扎营林中，夜只点篝火一堆，省而不用；族中最老之猎手早不出猎，日日坐门首磨刀，刃薄如蝉翼，犹蘸燃素细粉而磨。主事者问旁管炉之匠人曰：「火养不活，先救何头？」匠人以手探炉膛曰：「先送火入寻常人家，多开夜作之坊，灶上有火，纳塔这口气便缓。」掌粮械者在旁冷笑曰：「缓？深渊明日即到。一心提炉火，每座熔炉逼至十分，所出尽供军坊，方来得及。」匠人抽手，满掌皆黑，曰：「军坊须，灶下便不须？」老猎手头亦不抬，磨刀之声霍霍，彻夜不绝，众人之言皆未接。"

 # 26. 争取龙贤士的支持
 NAT_Event.26.t:"龙贤来归"
 NAT_Event.26.d:"龙贤士者，龙族中年高博识之辈，火焰元素之底细无不洞晓。近者深渊黑法专侵老龙之梦，数龙已语焉不清。主事者欲及其未昏，急叩其言。六族使者围坐火旁，各执木片在手，皆不肯先言，恐先言即认别家规矩。未几，一龙贤士须发尽白，为人以担架抬至，眼睑半阖，喉间咕噜作响。随行学士以袖拭其口涎，俯身曰：「请老龙尽吐所学，添炉扩塾，使纳塔百艺日进。」领兵者进步抗言曰：「所学乃远水，救不得近火。莫若编秘术于军中，随军施教，刀兵皆带龙气，目前即用。」学士急伸手拦曰：「此数老龙经不得折腾，须慎用之！」领兵者曰：「慎之则迟，迟则城破。」两下各执一词，火中一炭爆裂，火星溅于木片，烧缺一行字角。龙贤士之手在担架上微动，口角翕张，似尚欲有言。学士与领兵者皆住口，一齐俯身下去，只闻担架竹木在静中轻响一声。"

 # 27. 镇压反龙极端派
 NAT_Event.27.t:"反龙之徒伏法"
 NAT_Event.27.d:"纳塔有伙恨龙入骨之徒，见龙巢辄焚，见龙裔辄殴，口口声声欲驱龙务尽。此等狂态正合深渊之意：彼于暗处推一把，此于明处烧一把。焚过之巢旁，另有一窝未破之卵，被人以毡子裹了，挪到石缝深处去。夜半，一座焚过之龙巢犹冒青烟，焦味顺风飘出甚远。主事者立于焦黑巢边，听两拨人争。主抚者蹲身拾起一枚烧焦之卵壳，曰：「先辨首恶与随声者，抚龙族之伤，亦压族中之火气，人龙乃得复归一处。」主强者以刀插巢边，刀身入土半尺，曰：「直取为首数人问罪，以火律按之，快。惟龙族那头之气，亦须有人往赔不是。」主抚者抗言曰：「按得下去？火伏地底，压得住烟，压不住根。」主强者冷笑一声，拔刀竟去。其后焚巢之侧，新草蔓生，其绿刺目，独焦痕犹在。"

 # 28. 修复古龙锻坊
 NAT_Event.28.t:"古龙锻坊重修"
 NAT_Event.28.d:"古龙锻坊，龙族与纳塔先民同立，所出刀兵皆含龙焰，削铁如泥。岁月与深渊交相为害，今惟余颓垣废坊，铁砧埋灰，锤锈成一坨。往来商队仍从坊前过，然无复停辔求刀者；坊门外坐一补靴老匠，锥子扎一下，便在蜡上蹭一蹭。主事者踏进废坊，踢开碎瓦，底露一截刻龙纹之旧砧。二匠随之争，各执一锤柄不肯放。持短锤者曰：「招还旧匠，添料扩建，使古龙锻坊再出能劈深渊之刀，刀在手乃踏实。」持长锤者曰：「刀须近身，先补足重甲之储，灌龙焰入甲胄，使步卒多一层行走铁壳，撞之不垮。」「铁壳沉，追不上魔物。」「刀虽快，挡不住利爪。」主事者蹲下，以手拂旧砧之灰，掌心蹭一道黑。坊中锤声重响之日，连灰烬平原那头歇着之鹰，亦惊得扑棱棱飞起。"

 # 29. 封印火山深渊裂隙
 NAT_Event.29.t:"封印火山渊隙"
 NAT_Event.29.d:"图兰火山腹地裂开一大口，黑瘴股股外吐，魔物如潮漫入，连火山之火亦被压暗。有一部族取旧盟约重读，至落款处，觉少一枚印；裂口边新落黑灰一层，足踏下去，直陷至踝。主事者聚六族之人于裂口前，听其各执一词。主筑垒者以石锤击地，火星溅上靴面，曰：「沿缝层层筑垒，修封印使坚如火山岩，任魔物百撞不得越，人顶于前可也。」祭司把火把往裂口一探，焰头立时被黑气咬掉半边，曰：「人力有尽。先以火神之信拢住人心，令每族自视为封印一石，人立而封在。」主筑垒者冷笑曰：「立乎？魔物踏至，石亦碾作粉。」祭司曰：「粉亦当堵于口上。」两拨各退半步，无复争。黑瘴中低吼隐隐，火把之光被吞去一截。其后黑瘴为火逼退三尺，魔物嚎叫亦远，守工事者始敢合眼一合。"

 # 30. 掌握秘源技术
 NAT_Event.30.t:"得秘源之术"
 NAT_Event.31.t:"决斗法典初立"
 NAT_Event.30.d:"秘源之术载于纳塔最古之书，能自深渊裂隙之缘榨出至净元素之力，火力之极也。然此学太险，前代试之者皆不还，自是无敢翻其页者。深渊逼门，主事者决意重启禁忌。守书阁的老术士把旧符一张张摊在日头下晒，见主事者至，只言一句：「那页书，翻不得。」主事者摊书于火盆侧，纸页炙而卷边。二术士环书而争，一人以指压书脊，一人以掌覆书页。压书脊者曰：「先事炼化，化秘源之术为工坊可用之力，使纳塔作坊脱胎换骨，火如泉涌。」覆书页者曰：「太缓。先供军坊，专攻至狠之杀器，压秘源之力于兵刃，为抗渊之最后一着。」「险，且杀人。」「不险，死者更多。」老术士收符入匣，以蜡封之，遂不复言。盆中炭忽爆一声，主事者抬头，正见一粒火星落于书页空白处。"

 # 31. 建立决斗法典
 NAT_Event.31.t:"决斗法典初立"
 NAT_Event.31.d:"决斗之俗，纳塔由来已久，然无一善法，热血易为人所用。有枭桀者借决斗争权，深渊探子从中挑唆，死者岁甚一岁。火神代言人新易人，族人视新面孔，无一人即行礼。主事者决意亲纂决斗之法典，何者可斗、何者不可、如何为胜，条条写死于火神之名下。夜则就炉火而书，炭笔秃了一支又一支。二老决斗士在旁争。一者以炭笔敲岩曰：「法典先立规矩，场场决斗皆依条文而行，不得夹带私怨，纳塔之纲纪自稳。」一者抚膝上旧刀曰：「规矩固稳，然亦将刀练钝。莫若引决斗于练兵，作为磨砺刀手之场，胜者得荣，亦练出真本事。」「练兵？教场之事。」「教场无火，此处有。」主事者两说皆记下，法典刻于火山岩上。首往读者，一牧牛童也，诵之磕磕巴巴，然一字不肯跳过。"

 # 32. 修建神圣决斗竞技场
 NAT_Event.32.t:"神圣决斗场成"
 NAT_Event.32.d:"主事者欲于图兰圣城正中，起一神圣决斗之场，使六族争端悉集于此，就火神之目前分明白。地基以火山岩为之，四围嵌自明之火晶，远望若一团凝住之大火。场心犹空，四边火晶已嵌就，入夜自明，照半城如白昼；地基仅铺其半，火山岩晒之发烫，工匠赤足踏之，足底烙痛。众匠扛石往来，热气蒸人，喘不得息。管工者以石尺敲地曰：「促其速成，多开民坊并力赶工，竞技场早立，周围市面亦随之而热。」老石匠则翻覆量一石，曰：「缓些。每一石皆砌出纳塔之气象，使每场决斗皆为聚拢人心之大典，何急？」「深渊不待人。」「既不待人，愈当垒石使稳。」老石匠言讫，又量其石一遍。管工者冷笑一声，催人搬下一块。石匠夯实末一块石料，抹汗抬头，视彼空场心。场心填平之日，工匠皆于其上踏数脚，云欲使其记住纳塔人之足。"

 # 33. 举办荣花演武
 NAT_Event.33.t:"荣花演武开典"
 NAT_Event.33.d:"荣花演武，纳塔最盛之会也。至其日，各族勇士自四方奔赴，火气场上撞得噼啪作响。深渊压境，此典停废多年，主事者决意重开，使沉睡之斗志随鼓点而醒。停多年之鼓自仓底翻出，鼓面蒙灰，敲之闷闷然。告示一贴出去，谷地里便有人扎桩练拳，木桩上旧痕犹在。教头以刀鞘敲桩曰：「以演武为练兵之场，使勇士于真刀真枪间磨出对敌魔物之本领，人人皆有进益。」司赏罚者却摇首曰：「重赏魁首，使其名悬圣火之墙，为全军表率，人争效之，乃有奔头。」「徒有奔头，临阵仍慌。」「无奔头，并临阵之人亦无。」两人各持一说，互不相让。鼓已架起，专待第一声擂下。擂鼓者臂酸汗流，却不肯停，鼓声一浪高过一浪，远处深渊魔物亦惊得抬头张望。"

 # 34. 规范荣誉决斗规则
 NAT_Event.34.t:"荣誉决斗立规"
 NAT_Event.34.d:"荣誉决斗，本纳塔了结恩怨之圣法，然有部族私改规矩，愈打愈狠，竟出阴损致残之下作伎俩。深渊正待此乱，好于中搅扰，乘机下手。旧条文书于兽皮，边角摩挲得发亮，案卷置于圣火竞技场偏殿火盆之侧，数处已为人以刀刮去。主事者决意将规矩重新拧紧，以杜后患。主执法者以指划地曰：「立其威，使规矩如火划黑曜石之线，清清楚楚，越线者严办，部族自安分。」主调停者却道：「严办不了仇。当引决斗复归火神作证之荣誉道，使人知分胜负非结仇，火气既泄，和气犹存。」「和气乎？致残之人肯和气？」「是故改规矩，非改人也。」主事者并新旧两条文为一处，删去数条可启歹念之漏洞。封卷之日，以火漆封之，漆红如一滴凝血，无人敢轻启。"

 # 35. 建立决斗冠军体系
 NAT_Event.35.t:"决斗冠军立制"
 NAT_Event.35.d:"于既立决斗规矩之上，主事者欲予每届魁首以火神所认之名分。魁首之名刻于图兰圣城岩壁，与古之勇士并列，以励后来。祭典所歌换了一字，歌者云老辈所传，听者亦不察其异。岩壁已留数行空位，凿子全新，犹未沾石粉，只待刻名。教头以刀背敲岩曰：「以魁首之本领入军，请其亲授士卒几手看家刀法，全军之刀皆随之而快，此得其用。」管礼者却摇头曰：「刀法能教几人？莫若编其事为歌谣，使每个娃娃皆知纳塔英雄是何模样，人心乃聚得住。」「歌谣填不饱肚。」「刀法亦挡不住渊。」主事者视那数行空白一眼，不即定，但令两人各书其说。风起石粉，落匠人一头一脸，彼浑不在意，但将凿子向岩壁空位比了比，量下一届当刻多宽，才够容纳后来者。"

 # 36. 决斗训练营体系
 NAT_Event.36.t:"设决斗训练营"
 NAT_Event.36.d:"纳塔人生而勇猛，然未曾经练，遇深渊魔物刁钻之打法，尤以掠硫晶支脉那一股为甚，往往吃亏。六族旧营久无人用，木桩朽半，地上犹存往年练刀划痕；有牧人自高处下，言望见远处起一缕烟，长老摆手，戒勿复言。主事者决意于六族各设一决斗训练之营，使欲学真本事者皆有去处。掌征召者以笔杆敲案曰：「先备足兵，使演武之营为少年所趋，入时毛手毛脚，出即可上阵，征兵亦易。」守将却以刀尖指关隘曰：「兵源虽多，临阵而慌，亦属徒然。先守牢边境，使练成好手即驻关隘，魔物一至便顶上去。」「皆驻关隘，营中尚余谁学？」「学成再去，未为迟也。」两人争不能决，主事者遂立第一批木桩。教头握钝刀，方比划与一群垂髫少年看，刀背上犹錾本部族徽。远处那道烟，无复人提。木桩打得稀烂，教练换了三批，少年手茧厚了一层又一层，握刀之手亦稳矣。"

 # 37. 举办归火圣夜巡礼
 NAT_Event.37.t:"归火圣夜大巡"
 NAT_Event.37.d:"归火圣夜，纳塔至庄严之日也。六族之人举火把，绕图兰火山一周，以记火神传火种于世。近年深渊猖獗，巡礼遂停。广场旧火盆倾覆，盆沿磕出数豁口，久无人扶；圣城钟绳断其半，垂于钟楼下，风过则空荡荡而晃。主事者决意复办圣夜。好战之长老举火把曰：「令巡礼喊起族人心头之火，火把连作龙，且行且歌，斗志随烟而上。」司民生者却蹲身扶那倾覆之火盆，曰：「受惊之人尚多。令巡礼安一安人心，老幼亦于火光中得些安慰，日月照旧过将下去。」「安慰能挡魔物乎？」「日子若不过，挡住又与谁看？」主事者听之，不评曲直，但令人扎起火把，堆于圣城广场，若一小山。专待天黑，六条火龙即发。火把绕山竟一夜，天明时，末一人插火把于圣城火盆，火苗腾地窜起老高。"

 # 38. 以决斗解决部族冲突
 NAT_Event.38.t:"以斗平部族争"
 NAT_Event.38.d:"回声与烟谜两族复为硫晶矿坑动刀，刀已出鞘，火把于矿口连成两片，祸且不测。深渊魔物猫在战场边上看热闹，候内乱一起便好下手。六族边市重开，买卖照旧，惟两边之人不肯先笑。主事者驰至，依纳塔旧规矩，令两家各出勇士一名，于圣火竞技场火神之面前，一对一分高下。老族长以杖点地曰：「令此决斗发了火气，胜负既分，矿归谁家皆认，和气亦渐回。」领兵者却以刀背拍掌心曰：「借此决斗磨一磨刀手，使两族勇士皆于阵上长见识，打完这场，后日真遇魔物亦不慌。」「此乃争矿，非操练。」「刀见血，乃记得牢。」两派头人隔矿口对望，皆不肯先眨眼。二勇士于矿口对面站定，火光把影子拉得老长。胜负既分，矿口火把并作一线，两族勇士拱手而退，观者先是愣然，继以哄然叫好。"

 # 39. 为决斗勇士赋予火焰祝福
 NAT_Event.39.t:"勇士受火祝"
 NAT_Event.39.d:"将代纳塔迎战深渊先锋之勇士，齐集火山祭坛前，候火神赐福。此数人将以一当十，往会魔物之首领，胜负系纳塔之颜面。有童儿拾黑石，交长老手中，长老裹而埋回原处；祭坛前石阶磨之凹陷，一道道皆历年勇士所踩。主事者决意以火之力加诸其身。主造械者以锤柄指刀架曰：「赶制精良甲械，补足轻装刀甲，使勇士手中之火锋利无匹，足以砍魔物。」祭司却以朱砂点在刀脊曰：「刀甲虽利，终是死物。请于刀兵上一一刻火纹，使火神之福随每挥砍而落，人乃活物。」「火纹能多砍几人？」「心稳，则砍得准。」主事者听之，两样皆准：甲械照赶，火纹照刻。祭坛之火腾起，勇士次第上前受祝，队末一人紧握刀柄，指节发白。受祝既毕，皆转身下山，步履沉稳，背刀于火光中泛青，无一人回顾。"

 # 40. 英雄的终极决斗
 NAT_Event.40.t:"英雄终极决战"
 NAT_Event.40.d:"深渊一大将亲踏纳塔之土，身上黑气压暗火山之火，族人仆者相踵。纳塔第一勇士挺身出，欲与作一了断，此役既毕，纳塔之生死乃见分晓。平原风卷灰，刮人不能张目，观者反层层围上。决斗设于灰烬平原，四下无人敢出声。主事者立于阵后，听侧畔二人相争。主稳者按住其臂曰：「令其先耗，看清魔物路数再出手，保住性命，往后此等仗方有得打。」主狠者攒拳道：「等不及矣。全力压上，一击决胜，撕开其黑气，人心亦随之而振。」「一击不中奈何？」「那便无后。」勇士不闻此，但横刀于胸前。刀与魔物利爪相撞，火星四溅，火光硬生生将那片黑撕开一口。那一刀劈下，渊将身上裂开一痕，黑血喷于灰烬，滋滋冒烟。众初静然，继以喝彩如雷，连坡上碎石亦似震动。勇士淌血，犹自挺立。"

 # 41. 推广纳塔民族认同
 NAT_Event.41.t:"广纳塔民族认同"
 NAT_Event.41.d:"图兰圣城广场立一面大火旗，旗绳系于新削木杆，绳结上犹带松脂之气。六族稚子环旗下，听白须老祭司讲火神分火种旧事。护送火种者方才折回，数人犹披一路之灰，靴上泥土未及拂去。管旗号之官捧新描旗样挤入，不待讲毕便道：「古事说与娃娃听尚可，然吓不退深渊。依我，六面小旗尽撤，独留此大火旗，称谓亦归一，人若问起，皆答纳塔。」老祭司以烟杆于鞋底磕两下，抬眼道：「旗撤矣，娃娃犹认得自家之山乎？」那官反问：「识得纳塔，尚未足乎？」二人往复相诘，各不相下。稚子不解，但扯老祭司之袖，要他接讲。老祭司遂自火神初分火种与六族那年说起。一阵风来，大火旗掀起一角，旗下稚子往一处挤了挤，仰头看那旗角。"

 # 42. 整合部族物力
 NAT_Event.42.t:"部族物力统合"
 NAT_Event.42.d:"圣城一石室中，大兽皮摊于案上，上画六族之格，或堆铁锭之记，或绘油泉。管账书记以炭条于格间画数杠，谓围立之各族头目道：「铁归铁，油归油，各记一栏，哪家告急先自公中调拨，好铁悉用于刀刃。」沃陆之邦老锻主甫自坊中驰至，袖口犹沾炭，闻言将一块烧红样铁搁于案上，烫得众人缩手，道：「账虽清，料只此数。我那锻炉连烧三日，兵器较订数多两成，所恃非账，乃炉法改得巧。依我，先传炼化之法于各家，一分料多榨出几分力。」书记指兽皮上自画之杠道：「各记一栏，设若谁家多贪一勺，汝亦榨得出乎？」老锻主冷笑一声，将那铁翻一面。两人环兽皮争至日头偏西，皆不肯于自家那栏让出半格。书记遂掷炭条于案上，盆中炭爆一声。"

 # 43. 统一部族军事力量
 NAT_Event.43.t:"部族兵力合一"
 NAT_Event.43.d:"教场新竖一面大旗，六族拼凑之兵按旗列队，甲胄杂色斑斓，耀人眼目。旗面新浆过，硬挺得翻不起褶。一年少之将按刀柄，谓侧畔老将曰：「新军所贵者，快也。攻之猛，招之疾，若熔岩洪流压将过去，一战便冲垮深渊。」老将捻须，指队末数名立不稳之新卒，徐徐道：「昔日守熔岩隘口之老兵，非一战而胜，乃守过三冬。临阵亦然，胜一仗不算本事，胜一冬乃算。依我，先令每兵于行伍间磨出阅历，稳得住，方能顶久。」少年之将曰：「待汝磨得出，深渊早到家门。」老将不恼，趋前将一新兵歪甲扣正。队末一老兵亦蹲下，替旁人系护腕，系了三个，第四个手便停了。日落，新旗之影拖得老长，队中有人悄然将刀握正，肩背亦稍挺。"

 # 44. 忠诚部族的自治政策
 NAT_Event.44.t:"忠诚部族自治"
 NAT_Event.44.d:"一忠心部族之长屋中，老酋长捧一叠呈报之旧牍，纸上摞厚印一层。以指敲纸面曰：「盖一具燃素锻炉须层层呈报，连集市何日开皆候回话，闷甚。依我，自家之事自家做主，忠心之火方烧得旺。」陪坐另一头目摇首，指屋外冷落空地曰：「放手固好听，然咱此处穷得并一具回声锻炉亦无。依我，先扶持作坊、兴起土木，令咱这批人腰带鼓起，方撑得住纳塔这摊子。」老酋长曰：「囊橐既鼓，心便散矣。」那头目应曰：「心之散不散，不在钱之多寡。」两人争着，皆未留意门口。门外有人探头，见老酋在座，又缩了回去。巡夜者傍晚于西侧林边停住，蹲视地上脚印半晌，归报低低一句，屋中遂静一瞬。老酋长末乃掷那叠文书于火塘侧，纸角卷起。"

 # 45. 建立统一税收体系
 NAT_Event.45.t:"统一税制初立"
 NAT_Event.45.d:"税吏数人围一长案拨算盘，算珠拨得噼啪响，案摊六族所送税册，或厚得压手，或薄仅数行字。一年少账房抄新税则于木牍，吹墨道：「税须理清，作坊买卖皆松快些，收得之钱养得住工坊，火乃旺得起。」旁侧老税吏按住算盘，沉声道：「理固善，然钱不入公库，何以支撑一统？依我，先立硬收税之规，每一分皆归库，收之稍紧，民间难免叫苦，亦顾不得矣。」账房道：「收之过紧，民间喘不得气，明年并税亦收不上来。」老税吏不答，但拨算珠又一档。两人各执一端，互不相下，案上算盘声时断时续。火神祭坛前满摆颗粒果与火山酒，一老祭司过来探火，低言今年之火较往年为弱。账房抄毕末笔，抬头视那火一眼，沉吟片刻，将木牍递将过去。"

 # 46. 镇压叛乱部族长老
 NAT_Event.46.t:"叛部长老就擒"
 NAT_Event.46.d:"一封密报送入焱庭案前，火漆拆开，上赫然书一熟识之名。主事者扣密报于案上，半晌无言。案侧二将却先争起。一将主先发制人：「既彼带头，便拿为首数人，余党自散，乱根可尽剜。」一将摇头：「拿人固快，然彼遁入深渊那头奈何？依我，先守死熔岩隘口与颗粒果粮道，外不得入，里头这点乱亦成不了事。」主张拿人者道：「关隘守到几时？彼犹在族中扇风。」主张守隘者应曰：「煽风之人，俟访查得实再动未迟。」两人争至案上火烛烧底，蜡油淌满一摊，互不能服。屋外，硫晶支脉之灰又起，埋半条旧道，驮队改走歇息崖。更远处，竞逐之盟大帐前新旗竖起，纹样改了两处，风过，旗角啪啪抽杆。主事者方压密报于镇纸下，吹灭那截烛。"

 # 47. 统一文化教育体系
 NAT_Event.47.t:"文教一统"
 NAT_Event.47.d:"新漆门板之学屋里，群儿席地而坐，随先生诵第一行字，声参差不齐。先生摊六族旧典，谓旁侧长老曰：「刀、龙、火、水，各家好物悉收于课本，令孩子学出一身纳塔见识，他日将火之故事讲与提瓦特听。」长老却指窗外岩壁曰：「吾先不问讲与谁听。须令每个娃娃记牢，己乃火之子孙，根先立住，余者方可言。」先生曰：「只认一根，六族之学遂亡。」长老应曰：「学亡可复拾，人心一散，收不回矣。」二人往复相诘，诸儿听之茫然，诵字之声亦低。窗外岩壁上，一少年新添一图案，长老先曾视之良久，终未擦去，此刻又多看两眼。一诵得最响之娃娃忽举手，问先生那图案画的是甚么。先生一时竟不能答，但将课本又翻一页。"

 # 48. 制定纳塔统一律法
 NAT_Event.48.t:"纳塔律法归一"
 NAT_Event.48.d:"圣城石壁前，六族使者挨次画押，兽皮上按满手印与爪印，红若一团火。拟法老臣捧末数行条文，谓侧畔商贾曰：「法须立得威严，条条冠以火神之名，纳塔纲纪乃如火山岩之不可动摇。」商贾却蹙眉曰：「法太硬，买卖便死。须与民生交易留足余地，法亦养人，市易方旺。」老臣曰：「法而养人，尚得谓之法乎？」商人应曰：「不养人之法，压不住人。」两人各据一词，石匠在旁錾字，錾声叮当，将话声盖去半截。当此之时，烟谜主密信送至，封蜡完好，拆开纸上只有一个字。老臣视之一眼，折纸条纳袖中，不语。商人犹欲有言，老臣抬手止之，指那刻满条文之石壁。壁上新錾笔画，犹带白茬，触之扎手，石匠以指一抹，浮粉簌簌落。"

 # 49. 整合部族护卫力量
 NAT_Event.49.t:"部族护卫合一"
 NAT_Event.49.d:"谷地之中，六族护卫相继开到，旗色缤纷，将一谷铺得满满。两带队头目首回立于同一面旗下，彼此端详良久。其一以腰间斧杵地曰：「捏人作一支能行之堡垒，犬牙交错，何处告急便填何处，深渊小股魔物钻不得空子。」其一却道：「人少，填一处尚可，十处则不能。依我，先多征多练，使护卫之火铺满纳塔每一寸土。」前者曰：「铺得满，守得住乎？」后者应曰：「守不住，再多练几人便是。」二人声皆不小，然口令已归于一，呼之反齐。护卫列队立旗下，一兵肩上所停之青羽龙忽展翼而起，绕旗一周，又落回原处。口令声荡于谷中，一浪压过一浪，久而不息。谷口望台之上，守望之卒把号角擦了又擦，终未敢吹，旗绳被风绷得笔直。"

 # 50. 全部族统一宣言
 NAT_Event.50.t:"诸族一统宣言"
 NAT_Event.50.d:"图兰圣城火山广场上，六族首领齐举燃炬，玛薇卡立高台尽头视之。誓词句句诵下，声于火山间往来撞击。诵及「纳塔」二字，有人忽止，回顾身旁同族曰：「往后矿归公中，兵亦归公中，咱这把火犹听谁调？」同族将炬举高些，应曰：「听这面旗，亦听汝自己。」两人相视一眼，无复言。六炬并作一处，火光冲天，照满城如白昼。人群中，一老者抹眼，托为烟所熏。花羽会信使带羽饰出发，途中换马三匹，所言一句未改。有一族取旧盟约于箱底重读，至落款，觉少一印，抬头欲问，四下早为人声所没。不知谁先呼一声纳塔，继而万人应和，声浪撞火山壁，久久不散。高台上，玛薇卡披风为火光染赤，将炬往前一送，火苗腾地窜高。"

 # 51. 建立燃素武器研究所
 NAT_Event.51.t:"建燃素武器所"
 NAT_Event.51.d:"燃素兵器坊初立，坊前炉灰堆得齐膝，脚踏上去松软无声，一印便是一个深窝。第一炉点火之日，老师傅守炉口观火色，视之整整一炷香，方令学徒动手。炉门既开，其火蓝亮，众人皆初见。二掌事却在坊中争起。一主先攻火炮：「灌燃素入炮膛，轰出之火能撕魔物之阵，火力与准头皆要，先造数门样炮试之。」一主先铺大坊：「炮虽佳，仅那数门何用？先铺开炉子，使燃素刀枪源源供诸军。」主炮者指炉火曰：「准头差一寸，炮弹便落于自家人头上。」主炉者应曰：「量不足，准头再好，亦杯水车薪。」两人争至炉火渐弱，互不相让。坊外有老匠人蹲着数新铸之炮管，数到第七根便停手，抚之再三。老师傅重合炉门，添一铲燃素，蓝焰复窜起。"

 # 52. 扩建火焰附魔锻坊
 NAT_Event.52.t:"附魔锻坊重拓"
 NAT_Event.52.d:"回声之子锻坊之中，老匠人将一块烧红刀坯按入凉水里，白汽腾起，眯眼端详那道火纹，道：「火须够狠，不可贪多。」旁侧年少坊主却摊两份扩建图样于砧上，不服道：「全军候附魔甲械，炉少愈误事。依我，多开炉、多招徒，使每兵手中皆有一件带火兵器，铺得开方是正理。」老匠人翻过刀坯，火纹于水汽中隐隐发亮，道：「铺得开，件件皆半成之货，砍不断魔物黑血。」坊主道：「有总胜于无。」老匠人不复争，但将那试水刀坯挂上墙，云留作样子。墙上一排旧刀，皆历年退回者，刀脊上各有一道未穿之纹。图样边角已被汗手捏软，二人环图样立了半晌，皆不肯先收图样。炉膛里火星噼啪爆数下，映得两张图样线条忽明忽暗。"

 # 53. 研发龙骨装甲
 NAT_Event.53.t:"龙骨装甲铸成"
 NAT_Event.53.d:"坊门刚开，外头挤着看热闹的匠人，被守卫拦在人墙外。第一副龙骨甲抬出来时，四个壮汉抬之直喘，铁匠拍甲面，嗡嗡回声荡于坊中半日。二匠头环甲而争。一主往厚里打：「甲须密不透风，使步卒若能行之堡垒，渊物撞上来亦不垮。」一主往狠里打：「徒挨打何用？于甲上安一门粗炮，龙息般之威，将挡路者尽数轰开。」主厚甲者气道：「炮一重，人便跑不动，成了活垛。」主炮座者应曰：「跑不动，却打得穿。」两人绕甲一周，一摸甲面，一瞧炮座，皆不松口。甲旁蹲着一补甲之老妇，针线从头至尾不曾停，此时抬头看了一眼，又低下头去。铁匠遂将锤子往甲面上一顿，震得四人手中之甲又沉一分。甲上铆钉尚温，手按上去能觉出余热。"

 # 54. 扩建火山工业区
 NAT_Event.54.t:"火山炉冶扩地"
 NAT_Event.54.d:"图兰火山周边第一根新工坊立柱竖起时，立柱上系着红布，乃开工那日管工亲手所绑，吊索吱呀作响，工人于底下喊号子。二督工立坡上争。一主多盖民用工坊：「炉火遍地开花，纳塔市面随之而热，急用刀兵之家亦等不起。」一主先修基址：「路、渠、地基哪样不要紧？稍缓些，为日后扩地留足地方，免得盖了又拆。」主速成者指山下一片空地曰：「空着便是虚掷，深渊可不等你路修完。」主修底子者应曰：「地基不稳，盖起之炉迟早倾塌。」两人争着，号子声一浪高过一浪，将话头盖去半截。坡下有孩童追逐炉灰，被大人喝了一声，四散跑开。新立柱稳稳落入石槽，工人复喊号子，将石头一块块垒高。坡上土新翻，草木之气混着石粉。"

 # 55. 革新机动战术
 NAT_Event.55.t:"机动战法一新"
 NAT_Event.55.d:"军帐中设一大沙台，上插满小旗，沙是新换的，拈在指间还潮。年少之将主练穿插：「练兵若山中嵴锋龙，自敌缝里钻过，直捣要害。」老将却主练快：「行军与器械转运皆须加速，使任一支兵一昼夜可铺至当去之地，握先手再言其他。」年少之将将手中小旗往缝里一插：「钻将进去，他阵便乱。」老将摇首：「钻得进，出得来乎？」两人环沙盘拨了一遍又一遍，互不服。六族驮队照常过硫晶支脉，惟多一条规矩：不带信。歇息崖又塌半坡，驮队改道，沙台上那条路亦当随之挪一挪。老将看着看着，忽将中间那旗往前推一大步，曰：「就此处。」诸年少之将目之发亮，纷纷颔首。老将却收手，只令亲兵将那旗复往回挪半寸，留一退路。"

 # 56. 研发火焰火炮
 NAT_Event.56.t:"火焰火炮铸成"
 NAT_Event.56.d:"第一门灌燃素样炮抬上坡，炮口黑沉沉指远处，点火之兵手心皆汗。二管炮官于燃素炮位后争。一主先补炮数、练炮手：「火炮欲为阵上可恃之物，须轰得准、轰得狠，先练出一班好手。」一主先多开炉加快造炮：「阵前摆不开炮，练得再准亦空谈，先令铺天盖地之炮压将上去。」主练炮者道：「炮手不熟，弹落偏，反误事。」主造炮者应曰：「无炮，练与谁看？」两人争着，炮手在旁装填，无敢插嘴者。炮架旁堆着几副崩坏之旧轮轴，是前几回试炮所毁，无人收拾，锈已爬上轴心，一碰便掉渣。轰的一声，山坡亮了半边。轰鸣既过，坡上留一片焦黑，数只渊物残骸犹冒烟，炮手顾不得看，忙装填下一炮。那手心出汗之兵，此番手稳矣。"

 # 57. 建设海军锻坊
 NAT_Event.57.t:"水师锻坊初建"
 NAT_Event.57.d:"流泉之众船坞中，第一批龙骨方架上船台，木匠环之量了又量。老船工敲船板道：「船须经得住浪，更须经得住火。」二掌水师之官在旁争起。一主先多造船、练水手：「火焰火船可于烬寂海巡弋，守得海面，沿海买卖方做得成。」一主先盖船坞、铺开家底：「船虽利，无停处、无修处，亦难长年驻沿海，须织成密网。」主造船者道：「网织再密，无船亦空。」主筑坞者应曰：「船造再多，回不来亦属枉然。」两人各执一理，互不肯让，木匠只顾手中活，刨花一卷卷落脚边。老船工将那句话刻于船坞门楣，一刀一笔，刻得极深，凡出海者，必先望一眼方肯上船。敲毕末一锤，收墨斗入怀，又弯腰拾一段刨花，就日头视木纹，随手搁回料堆上。"

 # 58. 扩建航空工业
 NAT_Event.58.t:"广建云翼工坊"
 NAT_Event.58.d:"第一架样机推出来时，花羽会鹰主亲上试之，绕着圣城转了三匝，落地笑曰：「总算不须一人顶着天矣。」然二掌飞骑之官还在争。一主多造飞器、练飞手：「火焰飞器既多，天空可夺回，地面之人不再干挨炸。」一主先攒经验、追学问：「咱御空之本领得之最晚，须先将技艺追上提瓦特最善之数家，造得快亦须会造。」主多造者道：「待追上人家，深渊早掀房顶。」主追艺者应曰：「造一堆飞不起之物，掀得更快。」鹰主听之，摸新造飞器之翼，指腹顺翼骨一路抹过，若验其果能驮人上天。那老驯龙师蹲在旁，只盯天上之龙，半晌方郑重颔首。棚外天色压着黑云，鹰主推样机回棚，自己却抬头看那片天，手中犹攥着一片试飞时蹭落之绒羽。"

 # 59. 精锐火焰战士训练
 NAT_Event.59.t:"精锐火士特训"
 NAT_Event.59.d:"教场上，第一批人选袒臂站定，身上画之部族火纹犹带新墨气。教头一声令下，数十附魔刀同时出鞘，寒光连成一片。二教头在场边争。一主练作奇兵：「专打敌人软肋，来无影去无踪，渊之精锐再硬，亦有够不着处。」一主练作硬骨头：「一人可顶十人，冲上去便莫想令其退，硬碰硬方是正理。」主奇兵者道：「硬碰硬，若遇深渊精英魔物，一个也回不来。」主硬战者应曰：「回不来便回不来，守住了寨后即值。」两人争着，日头爬上旗杆，刀刃之光晃人不能张目。刀皆新淬，刃上犹带水痕，一柄柄插于木架，日光过处，寒芒连成一线。教场边新立一排木靶，靶心以炭画魔物之形，被刀劈得七零八落。喊杀声一浪高过一浪，教头忽收声，趋至队末，将一握刀发抖之少年手腕扶正，方又喝一声「再来」。"

 # 60. 军事工业现代化
 NAT_Event.60.t:"甲械新造"
 NAT_Event.60.d:"第一批新式炉子点起时，回声之子老匠人环之而转，摸这看那，口称「邪门」，手却舍不得离。二掌造之官于炉边争。一主先扩兵坊、架须弥新法连作之制：「造刀造炮如流水之疾，铺张既开，大仗所费方供得上。」一主先提所出：「每一炉每一锤皆榨至极限，件件刀兵赶得上趟，较铺张更紧。」主连作者道：「一炉榨到死，能出几件？连作一开，源源不断。」主榨产者应曰：「线虽架起，火候不继，出来尽是废铁。」两人争到炉门里蹿出一股白汽，方各退半步。炉膛砖缝里嵌着旧年炭渣，一抠便碎，老匠人以指节叩炉壁三下，侧耳听那回响。老匠人口称邪门，手未尝离那新炉，盯了半宿，眼中渐生服气之色。伸手将炉门复开一线，视里头之火，方才合上。"

 # 61. 调查深渊渗透
 NAT_Event.61.t:"暗查渊奸渗透"
 NAT_Event.61.d:"纳塔议事厅这几日常有人走错门，捧炭盆之匠人抬头看看，认错了门，又低头走了出去。主事者摊三物于案上：一枚被人动过之门闩、一片工坊账册上多出之墨迹、一支营中捡来之骨哨。烟谜主巫首裹灰袍入，先取那支骨哨于指间转了一匝，道：「此哨吹不出声，却能教人听墙根。」投哨于案上，又道：「顺此而摸，一处一处掏干净。」主事者未答。管账的老吏捧着册子入来，指着那片墨迹道：「清查固是好事，只是手莫抖。前朝一次，冤了好些本分人。」巫首冷笑：「心软便莫查。」老吏将册子往怀里一收，不肯复言。主事者就灯火摊开第一本可疑名册，提笔。笔尖于头一个名字上顿了顿，终究落了下去。灯芯恰于此时爆了一朵花。"

 # 62. 强化夜神国度防护
 NAT_Event.62.t:"加固夜神国界"
 NAT_Event.62.d:"夜神国度之边界无风，灰雾贴地而行，裹人之足，若夜神之国伸手。主事者踏将进去时，守夜族老正举长明灯一寸一寸前挪，灯罩上结了黑霜一层。一老祭司自雾中迎出，先接灯，以袖口擦霜，且擦且道：「此处水火皆不听人，只听灯。」言未落，另一年轻守卫以长矛杵地，道：「灯再亮，亦须人肯守。三班轮值，无一人喊累，结界方撑得住。」老祭司摇头：「人心齐，灯乃不灭；先讲信念，再讲气力，次序不可乱。」年轻守卫偏争：「先令守夜者吃饱睡足，方有心信。」两人各执一词，置灯于中，互不肯让。主事者伸手端灯，自至边界最薄处，放稳。火苗在黑雾中轻轻晃，竟不灭。主事者蹲身，将油壶嘴对灯芯，徐徐倒了第一滴油。"

 # 63. 清剿深渊邪教势力
 NAT_Event.63.t:"搜渊教巢穴"
 NAT_Event.63.d:"偏僻寨子外头，一座地窖口的枯草烧作黑灰。主事者驰至时，几个族老正把柴往窖口堆，火折子已捏在手里。带队之头领把刀往肩上一扛，拦住道：「一把火烧将进去，里头几处巢穴一夜便平。」一烟谜主老巫师却伸手按柴堆，道：「烧了窖，人心那点邪念犹在。须令其自看，所拜者乃深渊那头能吞魂之何物。」头领将刀换至另一肩：「待其看清，人被捆着早没命矣。」两人隔柴堆相持，火折子在头领手里一明一暗，映得众人脸上明灭不定。主事者令撬窖门，先救人。既撬开，从里头扶出几个被藤索捆着之人，一见外头火光，只会流泪，话亦说不出。头领将火折子凑向柴堆，回顾主事者道：「这火，烧得值。」老巫师不复拦，蹲下替那几人解绳。"

 # 64. 烬寂海的阴影
 NAT_Event.64.t:"烬寂海暗影"
 NAT_Event.64.d:"烬寂海边上的渔村这几夜无人敢点灯，海面泛黑瘴，一浪一浪拍堤。主事者至时，几个匠人正往堤上垒石，锤子声密得像下雨。领头的老石匠抹了一把汗，冲主事者喊：「墙再厚上三尺，它撞上来亦过不去！」一老渔人却蹲滩上，盯退潮所留水痕，慢悠悠道：「徒垒墙无用，须知它几时来、从何处钻出。」老石匠将锤往石缝里一楔：「待摸清，村子早被咬去几口矣。」老渔人不与他争，只从怀里摸出一片贝壳，言黑瘴起时，海水先于夜里发亮。主事者接过贝壳，就灯塔之光视之，壳面果有一层幽幽之蓝色。乃令人取海图，将老渔人此语添于图边。老渔人遂日日蹲海边，替纳塔盯那片会亮之水，一蹲就是半宿，连潮水漫过脚背亦不挪一挪。"

 # 65. 召开抗深渊战争会议
 NAT_Event.65.t:"聚议抗渊大计"
 NAT_Event.65.d:"大帐之中挤三方人：披甲之焱庭之将、披兽皮之六族酋首、鳞上犹挂火之龙贤士，各据一角，座皆离案三尺，无一人先挪。主事者入时，三方正为一言争得面赤。一老将以拳捶案：「先言打！兵如何摆、何处先顶，写出章程，人心自然齐。」一酋首却将兽皮往肩一甩：「章程是死，先得令人愿卖命，钱粮人力方往一处使。」嵴锋龙之龙贤士低低吐一口火，不插话，但按一枚旧符于案上，符遇火即亮。那点亮光在帐中一闪，三方皆住口，目光一齐移向案心。半晌，老将复擂拳于案，重又争起。三方往复相诘，争了半宿，互不相让。末了玛薇卡火令传入，压住满帐嗓音，帐中乃静。次日，那句争了半宿之话写上旗。三家之兵看那面旗，皆觉顺眼，扛之出帐。"

 # 66. 联合龙族抗渊同盟
 NAT_Event.66.t:"人龙缔抗渊盟"
 NAT_Event.66.d:"圣火之前，一条老龙伏在地上，鳞片为火光照亮，几名锻主抬着一件刚出炉之附魔甲械排在旁侧。主事者把盟约摊在火纹之上，请双方落印。一锻主先将甲械推至龙爪边，道：「龙息在前，火械在后，一前一后夹将过去，魔物之阵当场便裂。」一龙贤士却扫尾挡住那甲械，道：「岂有这般容易？它那一身老学问，够我们研出克渊之法，从根上压制，较硬拼为省力。」锻主不服：「研到何年？」龙贤士以杖顿地，鳞片抖了抖，不复答。老龙忽抬爪，重重按于盟约火纹上，火立时窜起老高，将两张脸皆映红。锻主与龙贤士同时住口。围观的族人轰然喝起彩来。老龙收了爪，向玛薇卡低了低头，慢慢退出火圈，它鳞上那道火纹，久久没有褪去。"

 # 67. 修复缝影针封印
 NAT_Event.67.t:"缝影针封印重修"
 NAT_Event.67.d:"圣库门一开，缝影针便被请了出来，针身黯淡得像一根生锈的铁条，裂口那头黑气正一丝丝外冒。几位元素大师围将上去，龙贤士也拄着杖凑近。一大师伸手比缝隙之宽窄：「先把它堵死，外头再加三道垒石，修一回就扛它十年。」一年轻元素师却攒紧拳：「堵得住一时，堵不住人心。令六族皆来搭手，守封印成各家自己之事，方得长久。」大师摇头：「人多手杂，反误事。」年轻元素师不退：「那便一家守一日，轮着来。」两下里争着，谁也没说服谁。大师们不复言，环绕缝影针念起古咒，念了整整三日。第三日夜，针尖方重新亮起一点微芒。年轻元素师忙伸出手去接那点微光，指尖竟觉一丝暖意，将手指蜷了蜷，不曾松开。"

 # 68. 研发抗深渊技术
 NAT_Event.68.t:"研抗渊御术"
 NAT_Event.68.d:"深渊的黑法这些日子蚀起兵器来甚烈，前几日送回来的一批刀，刃上尽是麻点。主事者把几员匠人和几个老兵叫到一处炉边。一位老兵抓起那把废刀，指着刃上的麻点道：「先设法护住人，命在，方有往后。少折一个是一个。」一回声之子铸匠却拍一卷图样于砧上：「护人护人，拿甚么护？先造克制之器，速颁之于全军，铺开用，方顶事。」老兵将那废刀往地上一扔：「待你造出，人早死光。」铸匠涨红了脸，正要回嘴，炉边学徒举起一面新盾，上刻烟谜主密密灵谜符纹。老兵将信将疑，携往阵上试一回。回来时盾上添了好几道黑印，人却囫囵着。以盾顿地，震得炉灰飞扬，道：「此物，可用。」铸匠乃松一口气，蹲下数盾上黑印。"

 # 69. 灾厄英雄纪念碑
 NAT_Event.69.t:"灾厄英雄碑成"
 NAT_Event.69.d:"图兰圣城外，一块碑石自火山口运来，犹带余温，石匠蹲在碑前，一笔一笔往下刻。主事者来时，一位老祭司和一名教头正站在碑侧争。老祭司指碑上之名道：「将这些名字刻全，令后来人认得，勇士之志气遂成纳塔之信仰，代代相传。」教头却摸碑面道：「徒认得何用？将其战法编入操练，后来握刀者接那份斗志，方算真记着。」老祭司摇头道：「名且不存，谁复能记之。」教头道：「记在手上，较记在石上牢。」二人往复相诘，石匠只低着头刻，刻至后头，手抖得握不住錾子。非因力乏，实乃那些名字太重，每一个后头皆藏一段以命换来旧事。末了碑成，他把錾子搁在碑脚，拍了拍手上的石粉，云这活计，往后该让少年来接。"

 # 70. 玛薇卡的焚渊誓言
 NAT_Event.70.t:"玛薇卡焚渊立誓"
 NAT_Event.70.d:"火山绝顶上风大，山风卷火星，扑向崖下六族人马之面，火榴果焦香混于风中。玛薇卡立最高处，火神权杖举过顶，杖头之火顺着小臂缠上去，如藤附木。六族酋首在其身后排立，火把被风刮得东倒西歪。主事者立于侧后，火把之烟熏人不能张目，抬袖挡了挡，听其开口。玛薇卡的嗓音压过了风：「吾以火神之名立焚渊誓言，此杖乃源火所铸，用尽此身之火，将深渊之黑烧个干净，一寸土亦不令占。」崖下六族火把齐扬，照半山如白昼。一老酋首举火把过顶，嗓音发哑：「火神既立此誓，咱再无二话。」旁边年少之战士不应，只把刀往地上顿了顿。风把誓词卷向远处。玛薇卡披风在火中猎猎作响，一动不动，握杖之手，指节皆为火光映亮。"

 # 71. 万火归一
 NAT_Event.71.t:"万火归一"
 NAT_Event.71.d:"焚渊誓言传下去的那一夜，纳塔各处都亮了。六族之火、龙族之息、熔炉之能、勇士刀上附魔之火，一股一股往图兰圣城汇将去。主事者站在圣城的高处，看各路人马举火把自四面涌来。一沃陆老农投一穗颗粒果入火堆，道：「地里之火，亦来凑个热闹。」一花羽鹰主纵龙低飞，龙息喷于火上，腾丈余之焰。回声之子的锻主抡锤砸在燃素锭上，火星四溅。几个孩子举着小火把，跟在大人后头，一路跑一路喊，差点撞翻了火盆。火龙在天上盘了一圈，落时引着图兰圣城火盆。万火汇作一处，火光自每扇窗、每座炉、每杆枪上腾起，连成望不到边之红。老人们仰头看着，久无一言；有个老人抬手，把落在肩头的一点火星轻轻拂了下去。"

 # 72. 与璃月建立外交关系
 NAT_Event.72.t:"通好璃月"
 NAT_Event.72.d:"璃月的码头这一日泊了一条纳塔的船，船上的货箱火红，卸货时围了一圈璃月伙计看稀奇。主事者陪着纳塔的商队头一行上了岸，甫站定，两边便为如何议价争起。领头商队将一箱燃素货往前一推，谓璃月管事道：「先结下交情，买卖路子一通，往后火油、颗粒果换汝等矿石、摩拉，细水长流。」一位随行的老账房却拉住他，道：「结交情太缓。将通商往深里做，商队常年往返，铁与钱方得源源而入。」管事闻之笑曰：「两样皆要，只是先卸货。」伙计七手八脚抬货箱下船，火红之漆在日头下晃眼。箱角还沾着一路的火山灰，擦一把，红得发亮。领头的从管事手里接过一锭摩拉，掂了又掂，回头即令人回纳塔报信，言这买卖，做得。"

 # 73. 提瓦特火焰外交倡议
 NAT_Event.73.t:"提瓦特火盟倡议"
 NAT_Event.73.d:"纳塔一统，又齐心抗渊，提瓦特列国皆重新打量这片烧着之土。主事者把提瓦特火焰通好之文书用火漆封好，漆上按纳塔手印。发出去之前，两位使者为投递之法争起。一主广结朋友之使者道：「各国皆走一遍，将朋友交遍，纳塔在提瓦特发言方有分量。」一司文教之使者却曰：「交情一时，名声一世。传纳塔火俗于外，人皆知火焰之国，名望自然响。」前者摇头：「名望能当饭吃乎？」后者笑曰：「无名望，谁肯与汝结交。」两人说到末尾，谁也不服谁，主事者遂令两依：文书分送各国，火纹照按，并附燃素兵器图样，话亦照讲。信使们领了文书，分头出了圣城，六条大路，通六方向。为首之流泉信使回顾图兰圣城之火一眼，方催马而去。"

 # 74. 与蒙德、稻妻结盟
 NAT_Event.74.t:"盟蒙德稻妻"
 NAT_Event.74.d:"三方使节坐于图兰圣城大厅，风、雷、火三种印记并列案上，旁压一枚纳塔火纹印。主事者请落盟约，言犹未毕，两边先争。蒙德使节指风印记道：「先结牢交情，盟约稳稳当当，胜于一切。」稻妻使节却推雷印记向前，道：「交情归交情，风、雷、火三股力须掺作一处，练出一支无敌之众，为纳塔守硫晶隘口，方不负此会。」蒙德使节笑曰：「无交情，谁与汝掺。」稻妻使节亦笑：「无实力，交情亦保不住。」主事者将三印记一字排开，指头于风纹上点了点，又移至火纹上，不语。两人乃收声。主事者递笔，三人挨次落印，风雷火三印记并列于一处，观者心中发热。散场时，三使节破天荒并肩走出堂中，至门口，皆不抢先迈那一步。"

 # 75. 须弥学术与工业合作
 NAT_Event.75.t:"须弥学工合作"
 NAT_Event.75.d:"第一批纳塔的学徒要动身去须弥了，圣城门口堆着包袱。主事者来送行，正碰上两位长老在争。一位管学堂的长老拄着杖道：「须弥乃做学问之地，先借其智慧，将纳塔火术与其学说掺作一处，学之更快。」一位管作坊的长老却把一卷图样塞进包袱，道：「学来学去，须落成炉里之火。先建起学堂作坊，学得之物果能化为炉中之火，方算数。」管学堂长老摇头：「无学问，拿甚么建。」管作坊长老道：「不建，学问只是纸。」两老往复相诘，学徒们背着包袱站在中间听。有个年纪最小的，把包袱带子绞了又绞。出发时辰至，一老长老撮一撮火种之灰塞入领头学徒行囊，拍其肩，不复多言。那学徒回头望了一眼，跟着队伍出了城门。"

 # 76. 建立永恒火焰军团
 NAT_Event.76.t:"铸永恒火焰军团"
 NAT_Event.76.d:"「永恒火焰军团」之旗号在图兰圣城圣火竞技场旁之教场立起来那日，六族应征者自天亮排至天黑，教场挤得水泄不通，旗杆下堆着应征者交来之旧刀，一柄压一柄。主事者立于旗边，听二头领相争。一主多招者望着人头曰：「先招足兵，声势如火之旺，人多方顶得住长年恶仗。」一主练精者却盯队伍曰：「人多不练，上阵亦白给。招之即来、来即能战，方是插向深渊之尖刀。」多招者笑曰：「汝那点人，填得满阵脚？」练精者曰：「填不满，便莫填。」两人正争，玛薇卡亲来点名，自队首一路点至队尾，火把照到末一个时，风把她的话吹散半句。队中一父将自家附魔刀塞入儿子手中，话到嘴边又咽了下去，只拍了拍儿子肩头。儿子握刀，并不应声，随队伍往前挪了一步。"

 # 77. 纳塔工业复兴
 NAT_Event.77.t:"纳塔炉冶复兴"
 NAT_Event.77.d:"复兴之令一下，歇了许久之回声锻炉，一处接一处重响起来。主事者巡至一处老工坊，炉门旁堆着断掉之旧锤柄，一捆捆靠着墙，无人收，木头已朽，一捏便成粉。二坊主正为如何复兴相争。老者指空院曰：「先将民用与战事之坊尽开，燃素炉之数如图兰火山喷发般涨，声势既大，匠人自归。」少者拍炉壁曰：「炉多何用？将每座之本事提上去，同料多出数倍之活，方为真旺。」老者笑曰：「汝那几座炉，救得纳塔乎？」少者曰：「少作虚言，先看火色。」两人争着，炉火在底下呼呼地烧。主事者未插言，只令先开炉。锤声复起，工坊梁上积年之灰簌簌而落。有人自梁上取下一块旧匾，以袖擦净，重挂门楣，匾上「回声」二字，漆已剥落半边。"

 # 78. 枫丹与至冬外交拓展
 NAT_Event.78.t:"枫丹至冬通使"
 NAT_Event.78.d:"枫丹的使节来时，带来一台会自己走动的机械，回声之子的匠人围着看了整整一天。至冬的使节也摆开一箱冰械，寒气将旁侧之火压矮半截。主事者请两位落盟约，话未讲完，二人先争起来。枫丹的使节道：「先将交情做深，盟约条条牢靠，朋友既多，诸事易办。」至冬的使节却道：「交情是虚。立纳塔之名于列国，令提瓦特皆认这块燃素与火榴之地之分量，方为实在。」枫丹的使节笑曰：「分量靠交情撑。」至冬使节亦笑：「交情靠分量换。」主事者把笔递过去，两人挨个落了印。匠人们还围着那台机械看，火、冰与齿轮旋在一处，谁亦说不清算哪国手艺。至冬的使节在一旁看了半晌，忽言自家的冰械可以略改，令其与纳塔之火相配。"

 # 79. 玛薇卡的永恒火焰祝福
 NAT_Event.79.t:"玛薇卡永炎赐福"
 NAT_Event.79.d:"玛薇卡以火神之力灌注纳塔之炉冶，降下「永恒火焰祝福」那一刻，全境燃素炉火一齐蹿高，炉口铁栅被火烤得发蓝，一格一格，像排开之齿。老工坊烟囱所出之烟，亦较往日红了几分。主事者立于炉边，听二工头争。一主多开战坊者盯那蹿高之火曰：「趁此力多开战坊，每件出来之刀兵皆须极精，以精者压深渊。」一主铺张者却道：「精有何用？铺张开来，令纳塔军坊撑得起长年累月之恶仗，方算本事。」多开工坊者笑曰：「汝铺恁开，顾得过来？」那主张铺张者应曰：「顾不过来便添人。」两人争着，互不相让。工人立于炉边，看着火，半晌说不出话。过了许久，不知是谁先哼起那支传自希巴拉克之老歌，一支接一支，整个工坊皆跟着唱起来。"

 # 80. 燃烧之地纳塔的荣耀
 NAT_Event.80.t:"纳塔燃土荣光"
 NAT_Event.80.d:"胜利之号角在图兰火山上响彻，火光自圣城一直铺至灰烬平原，六族之旗挨着旗，迎风招展。玛薇卡立于最高处望着这一切，披风为火光染赤。主事者立于她身后，看六族之人自四面聚到火山脚下。一沃陆老农把新收之颗粒果撒进火堆，一回声之子锻主把锤子高高举起又落下，火星迸开。流泉之众之航首吹响贝壳号角，声音压过满山之喧声。竞逐之盟使者捧新换之旗，挤在人群里，旗角为风卷得猎猎响。有老者抬手抹眼，托为烟熏。身旁之孙仰头看着旗，手里紧紧攥着半块未吃之糗粮。人堆里有个声音先喊出那两个字，四下便跟着沸起来，声浪在火山壁上撞来撞去，久久不散。玛薇卡并不回顾，只将权杖往地上轻轻一顿，脚下之火，又高一截。"

