 ITA_italian_hegemony_master_1:0 "イタリアの覇権"
 ITA_italian_hegemony_master_1_desc:0 "ファシズム発祥の地に住む我々の目的は明白だ。この思想を守り、遥か遠くの地に至るまでこれを広めるに尽きる。我々の支配下に置かれたありとあらゆる者達に、ファシスト体制に対する義務と忠誠を叩き込むのだ。"
