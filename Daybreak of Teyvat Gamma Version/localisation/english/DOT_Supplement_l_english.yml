 SOV_opposition_popular_support:0 "Popular Support for Opposition"
 SOV_opposition_popular_support_tt:0 "§LWith a large part of the party members, and public opinion, in support of the opposition, maintaining a losing war is much more difficult.§!\n\n"
 SOV_organized_wreckers_idea:0 "Wreckers"
 SOV_organized_wreckers_idea_desc:0 "The enemies of the state have recruited wreckers among the working class, who are disrupting critical industry and making it harder to reach production needs."
 SOV_organized_wreckers_idea_tt:0 "Enemies can execute sabotage missions"
 SOV_paranoia_advance_modifier_increase_effect_tt:0 "  - Political Paranoia increases by §R2§! weekly"
