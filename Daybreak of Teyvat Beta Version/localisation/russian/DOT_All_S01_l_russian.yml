DOT_Space_Program.7.d:0 "Правительство [ROOT.GetNameWithFlag] объявило о пятом эксперименте. Три астронавта достигли космоса, но двое погибли при возвращении. Мы скорбим о них.\nПоздравляем, вы получили технологическую победу!"
