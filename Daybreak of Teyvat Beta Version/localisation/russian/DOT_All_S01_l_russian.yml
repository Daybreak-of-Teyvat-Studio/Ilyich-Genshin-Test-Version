#提瓦特经济体系说明
 Consult_an_Economist:0 "Консультация экономиста" 
 Consult_an_Economist_desc:0 "Консультация по экономике Тейвата." 
 Mora_Event.11.t:0 "Ответ: экономика Тейвата" 
 Mora_Event.11.d:0 "[LYY.GetFlag]Главный экономист Ли Юэ, Тяньцюань Нин Гуан, отвечает:\n\nДоходы зависят от заводов, территорий, стабильности и торговли.\n\nКаждая территория приносит 0.2 млн Моры, один гражданский завод — 1.5 млн Моры. Стабильность определяет долю налогов. Содержание завода стоит 0.1 млн, военного — 0.2 млн, верфи — 0.15 млн. 1000 солдат стоят 0.04 млн.\n\nДоход = базовый налог + налог с заводов + экспорт + доп. доход.\nРасходы = армия + субсидии + администрация + импорт.\n\nТекущее состояние\nЗапас: §Y[?dx]§! млн Моры\nЧистая прибыль: §Y[?nmn]§! млн Моры\n\nБазовый налог: §G[?Core_income]§! млн Моры\nНалог с производства: §G[?tax]§! млн Моры\nКоэф. сбора: §G[?temp_Core_income]§! \nЭкспорт: §G[?resourceincome]§! млн Моры\nДоп. доход: §G[?modifier@mora_gain_daily]§! млн Моры\nАрмия: §R[?ms]§! млн Моры\nПром. субсидии: §R[?io]§! млн Моры\nАдминистрация: §R[?Core_outcome]§! млн Моры\nИмпорт: §R[?resourceexpenses]§! млн Моры\nКоэф. админ. расходов: §R[?temp_mora_cost_daily]§! \n\nДолг: §R[?debttotal]§! млн Моры\n\nДа хранит Тейват мир. [GetDateText]." 
 Mora_Event.11.a:0 "Да хранит мир!" 


