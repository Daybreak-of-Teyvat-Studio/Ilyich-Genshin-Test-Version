l_japanese:

# 阵营目标：通用提瓦特世界观（短 / 中 / 长期各三个）

 DOT_fg_compat:0 "旧き目標"
 DOT_fg_compat_desc:0 "此の目標は同盟の新約に取って代わられたり。"
 DOT_fg_alliance_covenant:0 "同盟の契"
 DOT_fg_alliance_covenant_desc:0 "テイワット諸邦は同盟を結びし以上、信義を先とし、艱難を共にし、支配も見捨てもせぬべし。"
 DOT_fg_ley_line_survey:0 "地脈の測量"
 DOT_fg_ley_line_survey_desc:0 "元素は地脈に沿いて流る。同盟は先んじて人を遣わし、其の経絡を測り、滞る処を記して後に備うべし。"
 DOT_fg_abyss_watch:0 "深淵を瞰ぐ"
 DOT_fg_abyss_watch_desc:0 "深淵の患いは兵の門に至りて初めて知るに非ず。辺境に望楼を設け、警報を通じ、諸邦の先だちて備うるを得しむべし。"
 DOT_fg_shared_ley_lines:0 "地脈を共に修む"
 DOT_fg_shared_ley_lines_desc:0 "地脈が滞れば元素は流れぬ。同盟は力を合わせてこれを疏通し、深淵の患いを共に防ぎ、田野と工房に再び息を吹き込まん。"
 DOT_fg_elemental_workshop:0 "元素の工房"
 DOT_fg_elemental_workshop_desc:0 "諸邦は各々一元素を擅にす。工匠と器用を通ぜば、風火水雷は相済み、疫癘も荒歉も同盟を困らしむるに足らず。"
 DOT_fg_seven_nations_pact:0 "七国の盟約"
 DOT_fg_seven_nations_pact_desc:0 "七国は政を異にして憂いを同じくす。約を立てて争いを平らげ、征伐は必ず相議し、一邦の私念に天下の干戈を動かさしむるな。"
 DOT_fg_dawn_of_teyvat:0 "テイワットの夜明け"
 DOT_fg_dawn_of_teyvat_desc:0 "長き夜にも終わりはある。同盟が迎えるは新たな神座ではなく、人に属する夜明けであれ。"
 DOT_fg_question_of_celestia:0 "天理の問"
 DOT_fg_question_of_celestia_desc:0 "天理の高く懸かりて久し。同盟は七国の智を集め、其の命数の由来を問いて、人をして神意のみを縄とせざらしむべし。"
 DOT_fg_abyss_sealed:0 "深淵を永く封ず"
 DOT_fg_abyss_sealed_desc:0 "深淵遂に退かば、諸邦は再び干戈を相向けず、共に此の土の安寧を守り、後世に夜明けのみを聞かしめ、兵甲を聞かしむるな。"
