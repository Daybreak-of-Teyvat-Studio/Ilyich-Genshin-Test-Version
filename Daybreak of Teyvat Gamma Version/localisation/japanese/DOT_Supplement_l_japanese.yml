 BUL_aircraft_repair_facilities:0 "航空機補修施設"
 BUL_aircraft_repair_facilities_desc:0 "テレム・ゲオルギ・ベンコフスキの航空機補修施設を拡張するプロジェクトを発展させ、我が空軍の最適な修理、整備を行うことを可能にした。"
 BUL_anti_capitalism:0 "反資本主義"
 BUL_anti_capitalism_desc:0 "[GetAntiCapitalismFocusLoc]"
 BUL_anti_capitalism_tt:0 "§Yヨーロッパの主要な民主主義国家§!に対する攻撃ボーナス: §G10.0%§!、§Yヨーロッパの主要な民主主義国家§!に対する防御ボーナス: §G10.0%§!"
 BUL_army_restrictions:0 "陸軍の制限"
 BUL_army_restrictions_desc:0 "ヌイイ＝シュル＝セーヌ条約は加えて我が国の陸軍に厳しい制限を課した。兵役義務の廃止や兵士と将校の数の制限、先進装備の保有の禁止のみならず、軍事演習や作戦計画の立案も禁止され、使用できる小銃の数すらも規定された。"
 BUL_army_restrictions_mobilization_law_tt:0 "§R徴兵法の拡大や宣戦布告ができない。\n部隊の訓練・解散、師団編制の編集ができない。\n戦車・航空機・艦船の製造ができない。§!"
 BUL_asen_dobrev_nikolov:0 "アセン・ドブレフ・ニコロフ"
 BUL_atanas_pavlov_zhilkov:0 "アタナス・パヴロフ・ジルコフ"
 BUL_back_from_the_scw_flag:0 "スペイン内戦から帰還した"
 BUL_balkan_federation_project_propaganda:0 "バルカン連邦のプロパガンダ"
 BUL_balkan_federation_project_propaganda_desc:0 "ブルガリア政府が資金提供している国内におけるプロパガンダによって、民衆のブルガリアのバルカン連邦構想への支持は急速に拡大している。"
 BUL_blagoi_ivanov:0 "ブラゴイ・イヴァノフ"
 BUL_bogdan_filov_ideology_fascism_tt:0 "（ブルガリアがファシズムを受け入れれば、「日毎のファシズムへの支援」に置き換えられる）"
 BUL_bogdan_filov_ideology_neutrality_tt:0 "（ブルガリアがファシズムを受け入れれば、「日毎のファシズムへの支援」に置き換えられる）"
 BUL_bogdan_filov_negotiations_tt:0 "\nボグダン・フィロフは、枢軸国との交渉では成功の確率を上げ、連合国との交渉では成功の確率を下げる。"
 BUL_bonyu_stoev_pironkov:0 "ボニュ・ストエフ・ピロンコフ"
 BUL_brannik:0 "ブランニク"
 BUL_brannik_desc:0 "ボグダン・フィロフによって設立されたこの親ファシスト全国青年組織はますます巨大化しており、設立以来我々に対し軍への参加を熱望するかなりの団員を提供している。"
 BUL_buhovo_uranium_mines:0 "ブホヴォ・ウラン鉱山"
 BUL_buhovo_uranium_mines_desc:0 "ブルガリアのソフィア近郊の都市ブホヴォでは、相当な量のウラン鉱床が発見された。鉱山ではこの貴重な資源の採掘が行われており、新しく強力な軍事兵器の開発に欠かせないものとなっている。"
 BUL_bulgarian_army_01:0 "ブルガリア陸軍"
 BUL_bulgarian_army_01_desc:0 "歴史が厳しくも示したように我々は潜在的な敵に囲まれている。しかるに将来の紛争に打ち勝たんとすれば、強力な軍隊を構築し、次世代の戦術を開発することが必要不可欠だ。"
 BUL_bulgarian_capital_injection:0 "ブルガリア資本の注入"
 BUL_bulgarian_capital_injection_desc:0 "[BUL.GetAdjective]政府は金融部門を安定させ、[ROOT.GetName]経済を支配するため苦境にある[ROOT.GetAdjective]企業に金融的支援を行ってきた。"
 BUL_bulgarian_patriarchate_restored:0 "ブルガリア総主教"
 BUL_bulgarian_patriarchate_restored_desc:0 "我々はついにブルガリア正教会の威厳を回復し、人々は1393年にオスマン帝国支配下のタルノヴォが陥落して以来初めてブルガリア総主教が選出されたことに歓喜している。"
 BUL_communism:0 "ブルガリア社会主義共和国"
 BUL_communism_ADJ:0 "ブルガリア"
 BUL_communism_DEF:0 "ブルガリア社会主義共和国"
 BUL_dar:0 "DAR"
 BUL_dar_desc:0 "国立航空機工房（ダルジャヴナ・アエロプランナ・ラボティルニツァ）"
 BUL_defender_of_the_balkans:0 "バルカン半島の擁護者"
 BUL_defender_of_the_balkans_desc:0 "ブルガリア人の支配者はバルカン半島の防衛の支援をするため新たな防衛システムを構築し、軍事的インフラの改善に努めるよう我々に指示している。"
 BUL_defying_moscow:0 "モスクワへの反逆"
 BUL_defying_moscow_desc:0 "[GetDefyingMoscowFocusLoc]"
 BUL_democratic:0 "ブルガリア共和国"
 BUL_democratic_ADJ:0 "ブルガリア"
 BUL_democratic_DEF:0 "ブルガリア共和国"
 BUL_dobri_bozhilov:0 "ドブリ・ボジロフ"
 BUL_dvf:0 "国立軍事工場"
 BUL_dvf_desc:0 "国立軍事工場（ダルジャヴナ・ヴォエンナ・ファブリカ）"
 BUL_dvf_sopot:0 "DVF＝ソポト"
 BUL_dvf_sopot_desc:0 "ソポト国立軍事工場（ダルジャヴナ・ヴォエンナ・ファブリカ・ソポト）"
 BUL_elites_crushed:0 "粉砕されたエリート"
 BUL_elites_crushed_desc:0 "我々はブルガリアの上流階級から多くの特権を剥奪してきたが、その結果政治的、軍事的に重要な地位にいる者の多くが敵となった。我々はブルガリアの社会的進歩を阻害するしか能がない者どもを排除しなければならない。"
 BUL_fascism:0 "ブルガリア国家軍団"
 BUL_fascism_ADJ:0 "ブルガリア"
 BUL_fascism_DEF:0 "ブルガリア国家軍団"
 BUL_fatherland_front_negative_desc:0 "祖国戦線とは共産主義者、ブルガリア労働者党によって設立された政治的抵抗運動であるが、現在ではブルガリアの親独軍事独裁政権に対し団結し抵抗するため、イデオロギーが大きく異なる複数の組織が団結している。"
 BUL_fatherland_front_positive:0 "祖国戦線"
 BUL_fatherland_front_positive_desc:0 "元々ブルガリアの圧政とファシズムに対抗するためにブルガリア労働者党によって設立された政治的抵抗運動である祖国戦線は、ブルガリアのプロレタリアートを服従させんとする全てのものに団結し抵抗するため、複数の組織のメンバーによって構成されている。"
 BUL_ferdinand_subjects_modifier_tt:0 "  - 従属国からの追加の軍需工場・民需工場: §G+40%§!"
 BUL_ferdinands_puppet:0 "国王フェルディナンドの傀儡"
 BUL_ferdinands_puppet_desc:0 "[ROOT.GetNameDef]は[BUL.GetNameDef]国王フェルディナンド1世に服従しており、[ROOT.GetAdjective]の政府に多大なる影響力を行使し、国家の政治、経済、産業を完全なる支配下に置いている。"
 BUL_foreign_industrial_concern_requirements_eng_tt:0 "ブルガリアがディシジョン§Y外国との協定§!ディシジョンによって[ENG.GetAdjective]系民需工場を[?BUL.BUL_industrial_investments_medium_cap|Y0]個以上建設している。"
 BUL_foreign_industrial_concern_requirements_ger_tt:0 "ブルガリアがディシジョン§Y外国との協定§!ディシジョンによって[GER.GetAdjective]系民需工場を[?BUL.BUL_industrial_investments_medium_cap|Y0]個以上建設している。"
 BUL_foreign_industrial_concern_requirements_sov_tt:0 "ブルガリアがディシジョン§Y外国との協定§!ディシジョンによって[SOV.GetAdjective]系民需工場を[?BUL.BUL_industrial_investments_medium_cap|Y0]個以上建設している。"
 BUL_foreign_industrial_concern_requirements_tt:0 "ブルガリアがディシジョン§Y外国との協定§!ディシジョンによって[THIS.GetAdjective]系民需工場を[?BUL.BUL_industrial_investments_medium_cap|Y0]個以上建設している。"
 BUL_foreign_industry_dynamic_modifier:0 "外国の産業"
 BUL_foreign_industry_dynamic_modifier_desc:0 "我々には自力で強力かつ効率的な産業を構築する手段が不足している。そのため、ブルガリアでの事業展開、拡大に意欲的な外国人投資家に呼びかけることが最善だろう。"
 BUL_generic_communist_revolutionary:0 "ヴァシル・ペトロフ・コラロフ"
 BUL_generic_democratic_reformer:0 "ニコラ・ディミトロフ・ペトコフ"
 BUL_generic_fascist_demagogue:0 "アレクサンダル・ツァンコフ"
 BUL_georgi_ivanov_kyoseivanov:0 "ゲオルギ・イヴァノフ・キョセイヴァノフ"
 BUL_georgi_petsov:0 "ゲオルギ・ペツォフ"
 BUL_government_reforms_communists_01:0 "政府の再編"
 BUL_government_reforms_communists_01_desc:0 "農業および工業分野において政府が行なった改革はブルガリア国家の発展と進歩のためには不可欠であるのは間違いないだろう。"
 BUL_hristo_lukov:0 "フリスト・ルコフ"
 BUL_imro_01:0 "IMRO"
 BUL_imro_01_desc:0 "内部マケドニア革命組織による狂乱的な犯罪は我々の国際関係に対し深刻なダメージを与え、1934年にはペトリチにあるIMROの拠点を武力制圧し組織に致命的な打撃を与え指導者のほとんどは国外逃亡を余儀なくされた。しかし、ブルガリア国内では革命的細胞が未だ活動しており、我が国の外交関係は劣悪な状態が継続している。"
 BUL_imro_02:0 "IMRO"
 BUL_imro_02_desc:0 "内部マケドニア革命組織による狂乱的な犯罪は長い間我々の国際関係に対し深刻なダメージを与えてきたが、少なくとも今は外国列強は我々のバルカン半島の平和の維持のために組織を破壊する努力をついに認めようとしているようである。"
 BUL_imro_04:0 "IMRO"
 BUL_imro_04_desc:0 "我々の内部マケドニア革命組織との協力は、近隣諸国だけでなく近隣諸国や、さらには国内の一部からも広く批判されている。"
 BUL_international_pilot_training_program:0 "国際パイロット演習プログラム"
 BUL_international_pilot_training_program_desc:0 "現在進行中の国際的なパイロット訓練プログラムは、我が空軍の熟練のパイロットや乗員を著しく増加させている。"
 BUL_ira:0 "IRA"
 BUL_ivan_gaidimitriv:0 "イヴァン・ガイディミトリフ"
 BUL_kiril_dimitrov_yanchule:0 "キリル・ディミトロフ・ヤンチュレフ"
 BUL_kiril_stanchev:0 "キリル・スタンチェフ"
 BUL_konstantin_muraviev:0 "コンスタンティン・ムラヴィエフ"
 BUL_liberal_trade_policies:0 "自由貿易政策"
 BUL_liberal_trade_policies_desc:0 "オスマン帝国からの独立以来、我が国は次から次へと危機に陥っている。これまでの経済的自立政策は不十分であることが証明されており、経済の自由化に動く時が来ている。"
 BUL_national_industrial_concern_upgrade_tt:0 "\n国家方針「§Y高度な最適化§!」を完了すると、この設計会社が格上げされる。"
 BUL_national_industry_01:0 "国策工業"
 BUL_national_industry_01_desc:0 "我々は近代的な道具を取得し工業生産を可能にしている。小さな一歩かもしれないが、強固な国策工業を発展させるために必要なのだ。"
 BUL_national_industry_02:0 "国策工業"
 BUL_national_industry_02_desc:0 "我が国の産業開発計画はコストこそかかるが、いくつかの新たな産業の設立と既存の産業の近代化を可能にしたため大きな成功を収めた。"
 BUL_national_military_designer_upgrade_tt:0 "\n国家方針「§Yバルカンのプロイセン§!」を完了すると、この設計会社が格上げされる。\n"
 BUL_national_naval_designer_upgrade_tt:0 "\n国家方針「§Yエーゲ海艦隊§!」を完了すると、この設計会社が格上げされる。\n"
 BUL_nationalized_industry:0 "産業の国有化"
 BUL_nationalized_industry_desc:0 "我々はブルガリア国内の外資工場を全て収容し、工業生産能力を大幅に向上させている。"
 BUL_neutrality:0 "ブルガリア"
 BUL_neutrality_ADJ:0 "ブルガリア"
 BUL_neutrality_DEF:0 "ブルガリア王国"
 BUL_nikola_hadzipetkov:0 "ニコラ・ハジペトコフ"
 BUL_nikola_totev_markov:0 "ニコラ・トテフ・マルコフ"
 BUL_our_duty_in_the_balkans_dynamic_modifier:0 "バルカン半島での責務"
 BUL_paramilitary_organizations:0 "親衛隊"
 BUL_paramilitary_organizations_desc:0 "準軍事組織の団員はそれぞれが既に軍規を保った忠実な人々であり、国家の大いなる栄光のため戦争を起こす準備ができている。我々は既に大義に対する彼らの忠誠を得ており、彼らが有用な人的資源になることは確実である。"
 BUL_petrol_ad:0 "AD石油"
 BUL_pirin:0 "ピリン"
 BUL_prussia_of_the_balkans_01:0 "バルカンのプロイセン"
 BUL_prussia_of_the_balkans_01_desc:0 "ブルガリア王国は、かつての不誠実な同盟国に裏切られるまで、バルカンのプロイセンと称される大規模な軍備を備えた高度の軍国主義国家だった。しかし、屈辱的な敗北を経て国を再建し、かつてのブルガリアの栄光を取り戻す時が来た。世界は再び、我々をバルカンのプロイセンと呼ぶだろう！"
 BUL_ratniks:0 "ラートニク"
 BUL_ratniks_desc:0 "[GetIntegrateTheRatniksFocusLoc]"
 BUL_second_national_catastrophe:0 "二度目の国難"
 BUL_second_national_catastrophe_desc:0 "先の大戦での敗戦後、我が国はヌイイ＝シュル＝セーヌ条約によってユーゴスラビア、ギリシャ、ルーマニアに対し広大な領土の割譲を余儀なくされ、また最近まで国際連盟から多額の戦争賠償金の支払いを優先するよう求められていたため、経済は破綻し国家債務は増加の一途を辿っている。国民の精神はこの打撃からまだ完全に立ち直っていないため、この条約がブルガリアで俗に二度目の国難と呼ばれているのも無理はない……"
 BUL_second_national_catastrophe_tt:0 "大ブルガリアを復活させると取り除かれる:\n§Yソフィア§!、§Yプロブディフ§!、§Yモエシア§!、§Yブルガス§!、§Yセルビア南部§!、§Yマケドニア§!、§Y中央マケドニア§!、§Yトラキア§!、§Yドブロジャ§!、§Y北ドブロジャ§!を完全に支配する。"
