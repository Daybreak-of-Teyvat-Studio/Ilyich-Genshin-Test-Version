 DOT_Intro_text:0 "[Get_DOT_INTRO_TEXT]"
 DOT_Intro_UI_1:0 "Мондштадт"
 DOT_Intro_UI_2:0 "Ли Юэ"
 DOT_Intro_UI_3:0 "Инадзума"
 DOT_Intro_UI_4:0 "Сумеру"
 DOT_Intro_UI_5:0 "Фонтейн"
 DOT_Intro_UI_6:0 "Натлан"
 DOT_Intro_UI_7:0 "Нод-Кале"
 DOT_INTRO_TEXT_1:0 "I. Тысячелетняя симфония\n\nПочти три тысячи лет назад §GБарбатос§!, по молитве жрицы §GГуннхильд§!, привёл народ Мондштадта к свержению тирании §LКороля Башен§! и сам стал Архонтом.\n\nСтав Владыкой Ветра, §GБарбатос§! божественным ветром разогнал снега, расколол горы и превратил Мондштадт в цветущий край.\n\nМондштадтцы покинули старую столицу и основали на этих землях племена, которые со временем превратились в города. Вожди племён стали §8аристократами§!.\n\nПервые §Gлидеры§! быстро развратились и стали §8господами§!. Род §8Лоуренс§! принёс рабство, наслаждаясь роскошью.\nБог ветра, не желающий быть королём, услышал стоны народа, пробудился от сна и, увидев жестокость аристократии, подделал контракт Владыки Камня, §Cподняв народ§!.\n\nНаконец, рабыня-гладиатор из Натлана §R«Веннесса»§! подняла знамя восстания, и весь Мондштадт взялся за оружие, крики прорвали темницу ветра. Старая аристократия пала, и родился новый Мондштадт.\n\nТак Мондштадт пришёл к нынешнему положению, когда Орден Рыцарей Запада защищает центральную часть, а регионы автономны. Однако, подавив угнетение, Мондштадт не породил достаточно передовой гуманитарной мысли, а лишь разрушал всё, что казалось угнетающим. Созданная система отражает лишь поверхностную свободу. Как номинальное центральное правительство, Орден Рыцарей Запада не может влиять на политику автономных владений за пределами города и даже не может гарантировать сбор налогов и военную поддержку, поскольку старая финансовая и централизованная система аристократов противоречит «свободе». Церковь Запада также действует по своему усмотрению, ибо это тоже «свобода».\n\nII. Прелюдия ко второй симфонии\n\nВ таком состоянии Мондштадт просуществовал тысячу лет, пока не наступил новый кризис.\n\nЗа последние сто лет передовые технологии Фонтейна пришли с Запада, и промышленность Мондштадта небывало расцвела. Число промышленных рабочих росло, экономика процветала. Но за этим процветанием таились внутренние и внешние угрозы.\n\nОтношения со Шнежной ухудшались. В последние годы Фатуи постоянно пытались проникнуть в Мондштадт, финансируя амбициозных местных политиков.\nНа юге Ли Юэ не имеет военных планов против Мондштадта, но их идеи и экономика влияют на него, особенно идеология Просвещения, созданная Юйхэн Кэцин, выступающая за радикальное правление людей, набирает популярность.\n\nПолгода назад экспедиция Великого Магистра §GФальки§! нанесла серьёзный удар по обороне Мондштадта, он увёл четыре пятых Ордена. Хотя старшая дочь Гуннхильдр, исполняющая обязанности капитана §CДжин Гуннхильдр§!, уже взяла на себя руководство, слабость стала очевидной.\n\nНа самом деле, у Джин Гуннхильдр была тайная мысль о §Cреформировании системы§!, но этот путь не обязательно вёл к §Gсвободе§!, мог привести и к §8катастрофе§!. Сегодняшний Мондштадт уже не так гармоничен. Под покровом свободы хлынули потоки инакомыслия —\n\n— Долгое отсутствие Барбатоса привело к коррупции в Церкви, вызвав недовольство. Вернувшаяся из Фонтейна §8Розария§! создала §gЦерковную оппозицию§!, глубоко укоренившуюся на востоке Мондштадта, стремясь превратить его в §gстабильный и надёжный меч§! против будущих угроз. §tБарбара§!, неожиданно ставшая номинальным лидером оппозиции, осознавая её опасность, предложила новую интерпретацию — §tТеологию освобождения§!, пытаясь направить §gЦерковную оппозицию§! на §Cумеренный путь§!.\n\n— Экспедиция на Драконий хребет обнаружила богатства и тайны, и §CАльбедо§! был назначен управлять регионом. Он и другие учёные привлекали иммигрантов, развивали ресурсы и торговлю, используя руины Сал Виндагнира, превратив Драконий хребет в процветающую территорию. Драконий хребет верен Мондштадту и свободе, но если Орден падёт, они могут сделать свой §Cвыбор§!.\n\n— Владения Рагнвиндр всегда были сильны. Их глава, §RДилюк§!, придерживается крайнего героизма и судит по своему усмотрению. Если Орден не справится, Дилюк не остановится перед §Rвмешательством§!, вплоть до §gзахвата власти§!.\n\n— Вольфендом всегда был на периферии, будь то индустриализация или экспедиции. Но здесь покоится дух Волка Андриуса, и его воины непобедимы. Если Мондштадт погрузится в хаос, беженцы могут использовать эту силу для самозащиты. Если хаос затянется, они осознают, что держат в руках силу, способную §Rумиротворить§!§CМондштадт§!.\n\n— Владения Гуннхильдр, закалённые в боях на границе со Шнежной, будут сидеть и ждать исхода, пока война не выявит победителя.\n\n— Кроме того, Логово Урагана, находящееся под управлением разведчицы Эмбер, сталкиваясь с нападениями и беспорядками, также повлияет на будущее Мондштадта.\n\nВ последние месяцы жители Мондштадта неоднократно видели нападения Урагана. Если кризис не будет разрешён, §8Лоуренсы§! могут развязать гражданскую войну, а местные силы захотят отделиться. Если §Gсвобода§! не приносит безопасности, люди будут искать §tдругие пути§!, вплоть до §8тирании§!."
 #\n\n蒙德的工业化创造的庞大工人队伍，还有许多境况不如意的冒险家们崇拜着邻国璃月的新理论——启明主义。这种思想由玉衡星刻晴创造，主张极其异端的无神信仰和纯粹人治。尽管目前还没有哪个政权秉持这种理论，但毫无疑问，这一理论正崛起为一种不可忽视的力量。
 #一、往事如烟吹去\n\n1、孤王之梦的破碎\n\n在近三千年前，人民一举推翻了§L高塔孤王§!的暴政，深爱塔中君王的§G阿莫斯§!被暴风撕碎，§G巴巴托斯§!则在这一役中晋升为神，女祭司§G古恩希尔德§!于此立下了「永护蒙德」的祖训，为初生的风神戴上了桂冠。\n\n成为尘世的风之王后，§G巴巴托斯§!用神风吹散冰雪，劈开山峦，使蒙德化为草木繁盛的乐土。一切平息后，巴巴托斯因不愿成为暴君而离去，开始了千年的沉睡，§G「新蒙德」§!就此诞生。\n\n蒙德人纷纷从旧王都迁出，在蒙德大地上建立起一个又一个部族，部族的领袖后来演变成§8贵族§!。彼时的提瓦特并没有先进的人文思想流传，就连§G巴巴托斯§!也没能预料到这些拥有神力的统治者在千年之后会变成什么样子。\n\n2、千年的大乐章\n\n受赠自由的人们自行造出了「人」的暴君。\n新蒙德建城一千六百年后，距今一千年前，蒙德的「自由」陷入了前所未有的恐怖低谷。以「劳伦斯」为首的贵族残暴地统治着蒙德，其中残暴尤甚者是，这一族曾持祭礼之弓，扮演在冰雪中开拓的勇士，用力量与智慧征服大地。但他们渐渐地视自己为征服者、王者，走上了歪曲的道路，将奴隶制带入了这片土地，全然无视人们受压迫的呼喊，却不知自己亦深陷囚栏。\n§C「流浪大地的乐团」§!于此时诞生。流浪乐团仗剑行走天地。以剑为笛、以弓为琴，带来反抗的歌声，最终在自由之路上走向灭亡。侍从骑士§R「莱艮芬德」§!目睹高唱光明之歌的剑舞者在角斗中死去后，成为了§R「晨曦骑士」§!。抗争的意志，如同血脉，永远流传下去。\n\n此后——\n    敬奉风神的教会发生分裂，一派与王侯们随行共饮，一同推翻神像；\n    一派没有神职者之名，祝福着平民与奴隶，谱写着§t不被允许的诗与歌§!。\n    在幽闭的地窖、暗巷中，在破旧的小酒馆中，歌声渗透烈风与铁腕，织成§t抗争的英雄之茧§!。\n    不愿成为王的风之神听见了恸哭的声音，从长眠中醒转，见证了贵族的残暴后，伪造了岩之王的契约§C鼓动人民§!。\n\n最终，来自纳塔的角斗奴§R「温妮莎」§!手执风鹰剑斩杀魔龙乌萨，揭起叛逆的高旗，被称为无名牧者的年长圣徒迅速动员了西风教会真正的教众，唱起救国起事的信号§t「松籁之歌」§!；随着谁人的琴声，呼喝声终于冲破了烈风的监牢。又一次，「塔上孤王」被推翻，而蒙德的人民决定永远消灭一切可能的「塔上孤王」，让未来的蒙德成为永远没有王、没有奴隶、没有暴政的国度。\n但是，此时的提瓦特仍没有人文思想指导一个无神的自由国家的建设，蒙德人民并没有建立起能够保卫自由的完善体制，只是摧毁了一切在他们看来可能带来压迫的东西——比如说中央集权制度、统一的财政税收制度。
 #\n\n    §8劳伦斯§!一族负责第一幕，扮演在冰雪中开拓的勇士，持§G祭礼之弓§!用力量与智慧征服大地的故事。这个角色最终遭到了曲解。他们渐渐地视自己为征服者、王者，渐渐走上了歪曲的道路，并最终失去了蒙德之风的宠爱。\n\n    §t伊蒙洛卡§!一族负责第二幕，舞§G祭礼大剑§!演绎战争的歌剧，饰演被血染黑，厮杀奋战的斗士。如此惘然的血脉，本应无法在历史中长久延续，因为他们的战斗没有终结，也没有胜利的希望。但随着冰雪消融、蒙德建立，他们最终有了值得守护的对象。\n\n    §G古恩希尔德§!一族献出终幕，执§G祭礼之剑§!演绎守护者，讲述守护者，守护生命与自由的故事。祭礼的传统与历史如今已经彻底遗失。但古恩希尔德一族至今仍在扮演守护者。
 DOT_INTRO_TEXT_2:0 "\nЛи Юэ, восточный край Тейвата. На севере — хребет Цинцэ, на юге — море Юньлай, на западе — гора Тяньхэн, на востоке — река Бишуй. Тысячи пиков, как копья, тянутся к небу; мириады ущелий, как драконы, бегут по земле. В древности Владыка Камня, сойдя на землю, отогнал море, усмирил демонов, срезал горы, чтобы создать гавань, и сложил камни, чтобы создать стены, заложив нерушимый фундамент. Земли обширны и разнообразны: море Юньлай омывает солнце и луну, остров Гуюнь стережёт демонов; руины Цзюньцзи хранят память о расцвете и упадке Гуйли; Бездна Цэнъянь уходит в глубь земли, где в рудной тьме скрываются следы битв древних драконов; долина Чэньюй окутана туманом, в ней таятся духи и чайные ароматы. Старцы говорят, что горы и реки выкованы контрактами, каждый камень и родник — воплощение воли Владыки Камня.\n\n\n§YВладыка Камня Моракс, приняв небесный мандат, правил всеми. Он заключил союз с бессмертными в облаках, поклявшись: «Кто нарушит контракт, тот будет наказан». Бессмертные якши подчинялись ему, и тысячекаменные войска сражались ради спокойствия. Но путь богов далёк, и в конце концов наступило правление людей. Владыка правил три тысячи лет, создав Семь Звёзд для управления и Восемь Ворот для торговли. Дворец Юйцзин на горе Тяньхэн стал центром торговли; Главное управление управляло делами народа. В новейшие времена боги ушли, и на сцену вышли люди: Тяньцюань ведает законами, Юйхэн — землями, Хэйянь куёт оружие, Хуанцзинь печатает монеты. Хотя бессмертные исчезли, дух контракта живёт в правительстве и народе, и указы незыблемы, как скалы, а рынки полны порядка, как весенний прилив.§!\n\n\n§CЭкономика Ли Юэ процветает, как нигде в семи государствах. В Бездне Цэнъянь залежи руды, в шахтах Минъюнь — нефрит и алмазы. Кузнец Юнь, благословлённый бессмертными, основал династию кузнецов, и его потомки куют лучшее оружие. Морская торговля — в гавани Ли Юэ. Тысячи кораблей, товары со всего мира: с юга — из Инадзумы, с севера — из Мондштадта. Летучий Облачный Клуб ведёт торговлю, корабли Южного Креста бороздят моря. Контракты — основа всего, товары текут рекой, и море спокойно. Говорят: «Золото и нефрит — ничто без гавани Ли Юэ».§!\n\n\n§GКультура и обычаи уходят корнями вглубь веков. Следы бессмертных — в облаках и туманах: Лююнь Цзефэн обитает на вершине Аоцзан, Сюэюэ Чжуян — на пике Цинъюнь; ночные якши оплакивают судьбу у озера Хуа, а закат солнца освещает руины Гуйли. Искусство и музыка процветают в городах и деревнях: театр Юньхань рассказывает о героях, чайная Цяоин хранит дух гор. Похоронное бюро Ваншэн управляет ритуалами, аптека Бубуку лечит травами. Наука, искусство, кулинария — всё пронизано мудростью бессмертных и людей. Владыка Камня создал Мору как мировую валюту, а народ сделал контракт основой жизни, и так сложилась душа нации.§!\n\n\n§RУвы! Ли Юэ существует три тысячи лет, пережив войны богов и катастрофы Кхенри'ах, но её дух не сломлен. Теперь Владыка ушёл, и на смену пришли люди. Семь Звёзд ведут вперёд, и тысячи кораблей отправляются в плавание. В горах высечены контракты, в ущельях скрыта история богов и демонов. Разве не в этом урок для Тейвата? Богатство Ли Юэ — не в нефрите и золоте, а в верности контракту; не в покровительстве богов, а в единстве народа. Это и есть истинный путь, который нельзя не заметить.§!\n\n\nДругие сценарии для региона Ли Юэ можно посмотреть на видео Bilibili: «Семь звёзд сияют, как струящийся свет» | Оптимизация сценария Ли Юэ для мода Genshin Impact | Рассвет Тейвата, обновление 23\n"
 #§C关于子模组提瓦特黄昏的一点提示：该模组对主模组提瓦特黎明的剧本设计进行了粗放式的删除和改动。故而，我们建议玩家朋友，在认真体验过主模组提瓦特黎明的剧本之后，再谨慎决定是否使用子模组提瓦特黄昏游玩。§!
 #一、魔神战争\n\n在无法追忆的古代，璃月以西的荒原曾有天星坠落。随着天星堕地，直面冲击的荒原化作宏大深邃的巨渊，美玉金石从中生长而出，取之不竭，因而成就了璃月此后千年的采矿产业。\n\n名为摩拉克斯的魔神与仙人签订契约，并和众人建立起了名为「璃月」的城市。他施展神迹，从无杂质的金色石珀中削出长刀一柄，挥剑斫去山峰的一角，以此向子民立下无上庄严的契约——离散的人，必将聚拢回归；背约的人，必然加以惩治。失去挚爱者、痛失珍宝者、蒙受不公者，将得到补偿。\n\n后来，大地上无数魔神与君王在为天定的王座彼此争战，星空与深渊为之失色，悲剧与恶行阻遏了山岩与流水的呼吸。自天空而来的落星不堪其扰，不顾层岩巨渊的挽留，向高天遁逃而去。 自天而降的美玉回归星天之后，留下了深深的天坑。人们在其中建起坚固的城市与要塞，偏安于陨星的遗赠之中闭关自守。\n\n魔神战争期间，提瓦特大陆上每一处都燃烧着战火。尘之魔神、盐之魔神、海之魔神、梦之魔神逐个陨落，海祈大御神奥罗巴斯逃亡稻妻，如今千岩军的前身——千岩团也在此时活跃。也是在这段时间，夜叉追随摩拉克斯屡次与妖邪作战，消除瘟疫与瘴气，世人称他们为「仙众夜叉」。\n\n最终，摩拉克斯登上岩之王座，璃月的魔神战争画下句号。\n\n二、璃月港的兴起\n\n在魔神战争期间，璃月人民难以进行长时间的耕作，就转而专注于商业和手工业，这种专注使得他们在战争后的和平年代发展出繁荣的产业，其中的七位佼佼者联合一体，被称为「七星」，下辖八个行政部门，在摩拉克斯的指导下管理、保卫璃月。经过长久的发展，璃月最终成为了提瓦特商业的中心。
 DOT_INTRO_TEXT_3:0 "I. Победители в хаосе\n\nРайдэн Эй, Бальзэбут, Владыка Гроз, Бог Вечности, правитель Инадзумы, прошла через бесчисленные войны и стала свидетельницей гибели друзей. Эти вошедшие в историю мифы сформировали сегодняшнюю её:\n\nВо время войны богов тысячи лет назад Эй убила змея-бога Оробоси, вторгшегося на остров Ясиори, оставив Рубеж Безымянного Клинка, навсегда разорвав дружбу между Санго и остальной Инадзумой.\n\nВ войне с Кхенри'ах пятьсот лет назад умерла её сестра Макото, и Эй стала холодной, думая лишь о Вечности — залоге спокойствия страны.\n\n«Да будет путь велик, Вечность богов.»\n\nII. Бессмертие\n\nСасаюри, Оёро Тиё, Кёко, Макото... души тех, кого она так звала, были заключены в хрупкие тела и рассеялись, как дым. Эй искала нерушимое вместилище для своей души. С помощью технологий Шнежной она создала куклу — Сёгуна, способную полностью исполнять её обязанности, и ушла в Сердце Чистоты, чтобы избежать эрозии. Кстати, до этого она создала неудачный экземпляр по имени Скарамучча, но бездушная машина вряд ли сможет устроить переполох.\n\nВ Сердце Чистоты Эй придумала дальнейшие меры для укрепления Вечности — Указ об изоляции и Указ об охоте на Глаза Бога. Отрезав неугодных иностранцев и предотвратив мятежи обладателей Глаза Бога, она считала Вечность Инадзумы прочной.\n\nIII. Страна на грани\n\nЭти указы исполняли верные Три Комиссии — Комиссия Дзя рода Камисато, Комиссия Тэнрё рода Кудзё и Комиссия Кандзё рода Томато. Однако за внешней верностью скрывались коррупция, клановые дрязги и расслабленная армия. За пять столетий эти болезни проявились при первых же серьёзных шагах. Войска сопротивления Сангономии во главе с Кокоми подняли мятеж, разбивая сёгунские войска. Паника охватила Инадзуму. Кудзё Сара, Камисато Аяка, Яэ Мико и другие были в замешательстве, а Фатуи протянули руку помощи, испытывая силу злых глаз.\n\nЧто ещё хуже, линия фронта приближалась к Татарасуне, и в случае разрушения реактора могла вырваться сила Оробоси, вызвав катастрофу...\n\nВ спорах и проклятиях Инадзума вступила в новую эпоху. Как долго продлится Вечность — никто не знал."
 DOT_INTRO_TEXT_4:0 "I. Голоса Леса Дхармы (в стадии реконструкции, ожидайте)\n\nПятьсот лет назад, во время катастрофы Кхенри'ах, первый Дендро Архонт, §GВеликая Древесная Владычица§!, внезапно погибла из-за катастрофы и заражения Запретным Знанием, что стало огромной потерей для Сумеру. За долгую историю Сумеру пережил множество бедствий, и именно благодаря силе и мудрости Владычицы многие опасности были предотвращены. Она создала джунгли и заключила союз с Королём Дешретом и Богиней Цветов, сохраняя мир в Сумеру более трёх тысяч лет. Академия Сумеру также была основана под её руководством, и учёные помогали ей управлять страной. Её внезапная смерть оставила Академию в растерянности.\n\nПосле катастрофы учёные Академии нашли ребёнка, в котором, как они считали, воплотилась сила Владычицы, и назвали его §GМалой Богиней Древа§!, доставив его в город. Учёные надеялись, что новый Дендро Архонт будет так же силён и мудр, как и прежний, и защитит Сумеру. Но §GМалая Богиня Древа§! не обладала ни силой, ни мудростью, и учёные сочли её ум ребёнка недостаточным для управления, поэтому заточили её в Дворце Чистоты, не принимая всерьёз.\n\nПосле этого Академия стала фактическим правителем Сумеру, но, лишённая руководства бога, она страдала от ограничений человеческого правления. Совет Мудрецов, где главную роль играл Великий Мудрец, постепенно становился деспотичным из-за алчности, а учёные развращались и боролись за власть, что привело к упадку политики и науки. За пятьсот лет фундаментальная и прикладная наука не продвинулась. Заражение Запретным Знанием привело к появлению Мёртвых зон и болезни Мараны, которые Академия не могла контролировать, жизнь людей ухудшалась, а экономика отставала. Внешняя политика также была грубой по отношению к пустынным племенам, что привело к их отчуждению и даже к призывам возродить §RКороля Дешрета§!.\n\nУсугубляло ситуацию то, что Академия, осознавая проблемы, винила в них отсутствие бога. Великий Мудрец Азар верил, что §GВеликая Древесная Владычица§! всё ещё жива, и с помощью таинственной технологии можно возродить или создать бога, подобного ей, чтобы обрести истинную «мудрость». Так Академия начала безумный план, пригласив даже исполнителя Фатуи §CДоктора§!, и Сумеру вступил в эпоху перемен.\n\nII. Песнь джунглей в мечтах (в стадии разработки)\n\nЛаннара — таинственный народ Сумеру, слуги Дендро Архонта. Несколько сотен лет назад катастрофа уничтожила их дом. Нынешняя Марана до сих пор угрожает Варанаре. В это смутное время, когда конфликты между учёными и богом, джунглями и пустыней обостряются, что выберут Ланнара?\n\nIII. Бескрайние пески (в стадии разработки)\n\nПосле смерти Короля Дешрета тысячу лет назад Великая Древесная Владычица стала победителем в войне богов. Джунгли унаследовали контроль над пустыней, став номинальными правителями. Расцвет пустыни закончился со смертью Дешрета. Племена Гура и других городов пришли в упадок. До сих пор многие племена исчезли под песками, а выжившие борются за существование. Легкая победа джунглей и их жестокое правление вызвали ненависть племён, которые обвиняют Владычицу в убийстве Короля и стремятся к независимости. Куда приведёт пустыня в этом хаосе?"
 DOT_INTRO_TEXT_5:0 "I. Начало всего§!\n\n§4«Море породило всё и поглощает всё».\n\nДревнейшая история Фонтейна почти неизвестна, лишь легенды могут восстановить облик далёкого прошлого.\nГоворят, в первую эпоху люди были настолько нравственны, что не нуждались в законах.\nТогда посланники Небесного Града ходили по земле, направляя людей. Благодаря им люди жили в мире и процветании.\nПравление длилось много поколений, но люди устали от этой вечности.\nОни перестали верить оракулам и желали того, что боги не обещали, пытаясь сбросить оковы судьбы.\nНебеса разгневались. Они обрушили на землю морские волны, сокрушив города.\nЗатем сто дней лил дождь, и воды поглотили все грехи и иллюзии, положив конец первой эпохе.\nКогда вода отступила, на поверхности не осталось ни городов, ни цивилизации. Оставшиеся в живых и новорождённые бродили среди лесов и рек, погрузившись в дикость.\nКак и все существа, люди подчинялись законам природы в бесконечном времени.§!\n\n\n\nII. Слава древнего царства§!\n\n§4«...Прошло много времени, и на юге взошёл и пал трон Гура, а на востоке знатные рода достигли границ моря, а наши предки всё ещё блуждали в невежестве».\n\nКазалось, цивилизация покинула эту землю навсегда. Но появился король, который всё изменил.\nНеизвестно когда после войны богов король Ремус прибыл в Фонтейн на золотом корабле «Фатуна» и принёс цивилизацию и порядок, основав династию Ремурии.\nПод его руководством дикость отступила, появились земледельцы, ремесленники и торговцы, и Фонтейн приблизился к другим цивилизациям.\nИскусство и культура стали славой империи, и многие гении оставили свой след в истории и в истории всего Тейвата. Современное искусство Фонтейна во многом обязано древним мастерам.\nОднако за империю пришлось платить, в том числе конфликтами с драконами. К счастью, они покорились королю.\nЗатем пророк, не желая зла, предрёк конец Золотой Симфонии и гибель Ремурии.\nЧтобы избежать этой судьбы, король установил свою справедливость, но она превратилась в тиранию.\nРемус пытался перенести сознание людей в каменные големы, чтобы достичь бессмертия, но план провалился.\nТирания вызвала восстание, и драконы под предводительством Скулы подняли мятеж. В хаосе наводнение поглотило империю.\nВеликий Ремус, предусмотрительный Ремус, одинокий Ремус, исчез...§!\n\n\n\nIII. Новое рождение водного государства§!\n\n§4«После того как прежнее сердце было вырвано, посланник Небесного Острова, существо, создающее жизнь, в изначальном море создало новое сердце, благородное, как дракон, но не дракон, и величественное, как бог, но без божественной миссии».\n\nЛюди, движимые чувством вины, жаждали суда, а движимые надеждой — милосердия. Так богиня Эголия получила частицу первозданной материи, обрела статус бога и свою миссию. Она привела выживших к основанию Фонтейна, подавила мятежные големы и начала своё правление. Она была мудрой правительницей. При ней Фонтейн стал страной справедливости, известной своими законами.\nОна выбрала мудрейших из народа и даровала им право совещания, что привело к возникновению аристократии и традиционному дуализму божественной и аристократической власти.\nОна создала судебную систему, определяющую поведение, и часто участвовала в судах, но никогда не нарушала закон.\nСтремление к справедливости привело к защите частной собственности, что, в сочетании с ресурсами, породило индустриализацию и расцвет мануфактур.\nПотребности производства стимулировали науку. В Фонтейне была основана Академия наук, ставшая научным центром Тейвата.\nЭголия была милосердным богом. Она основала Крестовый Приют для сирот и детей преступников, поручив его своей чистой водной фее.\nВ целом, по словам историков, «Фонтейн купался в процветании».§!\n\n\n\nIV. Осада Пуассона§!\n\n§4Хотя официально мало упоминается, исторические труды описывают крупнейшую трагедию времён Эголии — осаду Пуассона.\nТогда аристократы начали «озеленение» Фонтейна, изгоняя бедняков. Глава Серой Реки, Эдуардо, был схвачен, но освобождён и захватил Пуассон, взяв заложников. Мэр Пуассона, Рейно де Петрикор, помогал беженцам, а журналист Карл Ингёд пытался уладить конфликт. Но Двор Фонтейна атаковал Пуассон, убив Эдуардо и Рейно. Это событие получило название «Осада Пуассона».\nНекоторые историки считают, что это событие вскрыло проблемы традиционной политической системы Фонтейна и растущие социальные противоречия.§!\n\n\n\nV. Катастрофа§!\n\n§4Пятьсот лет назад полчища Бездны хлынули в мир, и архонты начали войну.\nЭголия также участвовала в войне с Кхенри'ах, но погибла в Сумеру, и место её смерти стало Морем Росы.\n"
#海。\n草之王在甘露之海种下了一颗大树，让水神的意识得以寄宿在树中。其后，花神灵光化身的神鸟西摩格也履行了使命，饮下甘露之水，灵光之力和甘露之力结合，让西摩格身形爆开，如蒲公英散落大地般净化深渊留在坎瑞亚附近的影响。\n与此同时，来自坎瑞亚的巨兽“厄里那斯”来到了枫丹，其剧毒的身体严重腐蚀了枫丹的环境，并对枫丹水体造成了长期的影响，使其不再适合纯水精灵生存。后来，这导致了纯水精灵的大量出逃。在神明陨首他乡的前提下，枫丹海军英勇战斗，最终令厄里那斯的肉体失去生命，进入漫长的结晶化，代价则是枫丹舰队的彻底毁灭。\n\n雪上加霜的是，枫丹此时迎来了一次涨水期，许多位于地势低处的建筑被摧毁。\n\n\n\n§!六：前世今生§!\n\n§4坎瑞亚之灾结束了。可代价是什么呢？\n神明身首异处，故乡破败不堪，亲友离散死伤……\n枫丹人都不想要再出现一场灾难了。\n在一片废墟之中，新任的水神——芙宁娜，出现了。\n人们起初并不信任这个小女孩。但事实证明她做的并不差。\n她邀请了一位漂泊者——那维莱特，前来枫丹担任最高审判官，并实际承担了枫丹的日常政务。随后，这位最高审判官证明了他的手段和能力。\n首先，前水神时期的政治体制被彻底改组，这可能是枫丹最和平的时刻，但也是高海之国最虚弱的时刻，忙于重建工作的人们不愿再将大量资源投入军事建设，甚至参加军队的意愿都严重下滑。\n近几周逐影庭已经反复向那维莱特大人抱怨维护治安的人手严重不足，恳求大审判官再给他们派点人来减轻压力。\n\n枫丹工业化水平在提瓦特是有目共睹的发达，无论是枫丹执律庭使用的警卫机关，还是稻妻幕府曾用的战争机器，再到民间常用的留影机，都产自这片高海之地。\n有人曾评价：工厂耸立，枫丹屹立不倒；工厂倒塌，则枫丹倒塌；枫丹倒塌，整个世界都会崩溃。\n不过也有人觉得这是危言耸听...

