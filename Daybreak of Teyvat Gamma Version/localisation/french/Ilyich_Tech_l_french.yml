 Ruin_Giant_desc:"Broyeur‑de‑Ruines Colosse : « La terre ne se laboure pas avec des outils agricoles, elle se conquiert par le fer et le sang. » — C’est cette conviction qui donna naissance aux Broyeurs‑de‑Ruines."
