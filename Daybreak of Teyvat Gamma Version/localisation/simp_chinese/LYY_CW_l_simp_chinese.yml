l_simp_chinese:

 #################### 刻晴 · 七星革命委员会（KQP） ####################
 KQP_CivilWar_Dawn:"黎明檄文"
 KQP_CivilWar_Dawn_desc:"请仙典仪之后的第三个夜晚，刻晴登上玉京台。她没有煽动，也没有许诺，只在墙上贴了一张纸，「璃月的契约，该换人来签了」。次日清晨，整座港口都在传抄这张纸。有人叫它檄文，有人叫它遗书；刻晴说，两者都对。"
 KQP_The_Yuheng_Banner:"玉衡之帜"
 KQP_The_Yuheng_Banner_desc:"玉衡星是七星中最年轻的一席，也是最不肯低头的一席。当她把印信掷还议事厅、独自竖起一面没有徽号的旗帜时，围观的人都明白：这是一次告别。旧璃月从此刻起有了它的第一个叛徒，也有了第一个公民。"
 KQP_Requisition_the_Millelith:"收编千岩军"
 KQP_Requisition_the_Millelith_desc:"千岩军的少壮军官们排成长队，一个个把佩刀放在桌上。他们不为钱，也不为官，他们只是再也不想向一个从不露面的神明行叩首礼。当最后一名军官把刀放下时，刻晴听见的不只是金属声，还有一个时代的关节在错位。"
 KQP_Open_the_Archives:"开档清账"
 KQP_Open_the_Archives_desc:"尘封三百年的契约库被打开了。泛黄的纸卷一页页翻过，人们第一次看清：那些帝君之约的墨迹下面，还压着无数从未被提起的名字。刻晴说，革命是让所有人看清账是谁记的。灰烬里翻出的，比档案馆里更多。"
 KQP_Enlist_the_Guilds:"招工入盟"
 KQP_Enlist_the_Guilds_desc:"铁匠、船工、染匠、矿工，那些从未被请进议事厅的手，第一次握住了笔。刻晴对他们说：璃月是你们一锤一锤敲出来的。工人们没有鼓掌，只是沉默地把工会的印章盖了上去。那一刻，印章的温度比任何誓言都真实。"
 KQP_Purge_the_Old_Qixing:"罢黜旧七星"
 KQP_Purge_the_Old_Qixing_desc:"罢黜令在拂晓时分送抵七府。有人跪地痛哭，有人连夜出逃，也有人只是平静地摘下冠冕，说了一句早该如此。刻晴没有为任何一人辩护，她比谁都清楚，一个不肯让位的旧秩序，只能用最不体面的方式请它离开，尽管她自己，也曾是它的一部分。"
 KQP_Draft_the_Peoples_Contract:"起草民约"
 KQP_Draft_the_Peoples_Contract_desc:"这支笔握了很久，落不下去。因为要写的是一个人与另一个人的约定。刻晴把起草的活交给了一群最普通的人，面包师、船工、守夜人。她只想看，凡人替自己立约时，第一句会写什么。他们写的是：「谁都不得高于另一个人。」"
 KQP_The_Engineers_Corps:"工程师团"
 KQP_The_Engineers_Corps_desc:"刻晴召来的是匠人。他们不谈主义，只谈图纸：哪座桥断了、哪条巷道塌了、哪座水闸该重修。革命在此刻第一次有了具体的样子，它是有人真的去把桥修好。"
 KQP_Seize_the_Arsenals:"夺占武库"
 KQP_Seize_the_Arsenals_desc:"武库的大门是被矿工用撬棍打开的。里面整齐码放着本该用来保卫璃月的火器，如今却指向璃月人自己。士兵们沉默地清点、擦拭、上膛。刻晴站在门口说：这些炮，从此只听一个命令，璃月的命令。"
 KQP_Militia_Ordinance:"民兵条例"
 KQP_Militia_Ordinance_desc:"条例规定，每个街区、每条巷、每艘船，都该有自己的自卫队。有人说这是把枪塞进每个人手里，太危险。刻晴反问：难道枪只在士绅手心里，才叫安全吗？从此璃月的街巷里多了一种新的声音，普通人学着握枪时，手指摩擦金属的轻响。"
 KQP_Price_of_Bread:"面包的价格"
 KQP_Price_of_Bread_desc:"面粉涨到三倍，饿肚子的从来不是喊得最响的人。刻晴做的第一件事是开仓、定粮价、派人守粮车。她说：一个让百姓吃不起面包的政府，无论叫什么名字，都活该被推翻。粮价落回原处的那天，码头上第一次有人为新政府鼓起掌来。"
 KQP_Land_Reform_Pilot:"土改试点"
 KQP_Land_Reform_Pilot_desc:"第一批被丈量的是最贫瘠的坡地。当那些世代租种他人田地的农户第一次在自己的地契上按下手印时，他们哭了，是为那张纸上终于写着自己的名字。刻晴看着他们，第一次怀疑：这一切，会不会来得太迟，又走得太快。"
 KQP_The_Great_Debate:"御前大辩论"
 KQP_The_Great_Debate_desc:"玉京台前的广场挤满了人。一条路通向议会的高台，一条路通向讲台的灯火。两条路都写着人民，却再也不会相交。刻晴坐在中间，一言不发地听完了所有人的争吵。散场时她对身边人低语：决定璃月走哪条路的，从来不该只有我一个人。"
 KQP_Suppress_the_Gods_Edict:"抑神敕令"
 KQP_Suppress_the_Gods_Edict_desc:"敕令只有一句话：神明可以受祭，不可以判案。神像没有反抗，庙祝也没有，真正动摇的，是无数凡人心里那个「总有人替我拿主意」的念头。刻晴签下这道敕令时手很稳，因为她知道，真正要废的从来是依赖。"
 KQP_Secular_Temple:"世俗神殿"
 KQP_Secular_Temple_desc:"昔日的神殿被改作学堂，神像的基座成了孩子们的课桌。第一堂课，先生问：什么是最公平的？孩子们齐声答：一杆不会偏向任何人的秤。刻晴在门外站了很久。她想起帝君，又想起自己，原来有些信仰是被留下来的。"
 KQP_Constitutional_Assembly:"制宪会议"
 KQP_Constitutional_Assembly_desc:"这是璃月史上第一次，由凡人替自己立约。没有神谕，没有星象，只有争吵、妥协、再争吵。刻晴坐在最后一排，把最好的位置让给了年纪最大的匠人。她说：制宪是让坏人也没法乱来。"
 KQP_Universal_Suffrage:"全民选举"
 KQP_Universal_Suffrage_desc:"选票第一次发到了矿工、船夫、卖唱人的手里。有人讥笑：他们连字都不识，凭什么决定国家？刻晴把一张选票递给一位老矿工，说：他认识一条矿脉，比认识一百个字重要。老矿工捏着那张纸，久久没有放下。"
 KQP_The_Artisans_Charter:"匠人宪章"
 KQP_The_Artisans_Charter_desc:"宪章的核心只有一条：谁造的东西，谁有权决定它去哪儿。锤子的主人，从此也是铁的主人。黑岩厂的老工头看完条文什么也没说，只是从那以后，他干活时会哼一支革命前从不许哼的小调。"
 KQP_Nationalize_the_Mines:"矿脉国有"
 KQP_Nationalize_the_Mines_desc:"矿脉收归国有的那天，井下的灯更亮。矿工们摸着井壁上的矿脉，像抚摸一件终于属于自己的旧物。没有人欢呼，因为所有人都清楚：把矿从旧主人手里夺回来容易，把它真正交还给挖矿的人，才是一辈子的功课。"
 KQP_The_Peoples_Army:"人民军改组"
 KQP_The_Peoples_Army_desc:"旧的徽章被摘下，新的旗帜却迟迟没发下来。军官们换上没有标识的制服，向一面空白的战旗敬礼。刻晴说：不必急着印徽，先想清楚，你们效忠的是一个人，还是这座城。这个问题，往后每晚都要问自己一遍。"
 KQP_Contract_With_Labor:"与劳工立契"
 KQP_Contract_With_Labor_desc:"签约那天，刻晴把笔递给了工人代表，自己退到一边。她说：这份契约，我一个当官的签，就不作数了。工人代表的手在抖，字却写得很重。签完他把笔还给她，说：您可别后悔。刻晴笑了：我怕的是你们哪天不再找我签字。"
 KQP_Abolish_the_Adepti_Court:"裁撤仙家法庭"
 KQP_Abolish_the_Adepti_Court_desc:"仙家法庭的牌匾被摘下时，整条街都安静了。申鹤派人送来一封信，信纸是冷的，字也是冷的。刻晴读完，把它折好收进袖中。她明白，裁掉的是一座法庭，埋下的却可能是一场更长的战争。"
 KQP_The_Latter_People:"后浪之人"
 KQP_The_Latter_People_desc:"新一批官员上任了，他们中许多人比刻晴更年轻、更激进、更不耐烦。刻晴看着他们，欣慰，也不安，她亲手养大的这代人，终有一天会嫌她不够快、不够狠、不够彻底。这正是她想要的，也是她最害怕的。"
 KQP_Manifesto_of_Yuheng:"玉衡宣言"
 KQP_Manifesto_of_Yuheng_desc:"宣言在城市上空一遍遍回响：契约不再属于神，不属于星，而属于每一个签下它的人。宣读结束时广场上万众静默，随后是有生以来最响的一次欢呼。刻晴站在台上，却在那一刻感到一种从未有过的孤独，因为从今往后，再没有人可以为她作保。"
 KQP_Harbor_Of_Equals:"平等之港"
 KQP_Harbor_Of_Equals_desc:"平等之港开港。无论挂谁的旗，所有船都可以在璃月卸货。旧商人骂这是自毁长城，新商人却在码头排起了长队。刻晴说：璃月要的是所有人都想来卸货的地方。"
 KQP_Federate_The_Eight_Wards:"八区联邦"
 KQP_Federate_The_Eight_Wards_desc:"八个区，八种方言，八本账，第一次被一纸联邦契约捆在一起。谈判桌上吵了七天七夜，最后定下的是谁也不能替谁做主。刻晴在契约末尾写道：宁可不整齐，也不要再整齐地被同一个人统治。"
 KQP_The_Forge_Republic:"熔炉共和国"
 KQP_The_Forge_Republic_desc:"熔炉昼夜不熄。共和国把废铁浇成钢，把散沙铸成器。工人们说，炉火照在脸上时，比神像的灯更暖。刻晴知道这很危险，一个把自己比作熔炉的政权，很容易把异议也一并投进炉里。"
 KQP_A_Thousand_Year_Promise:"千年之诺"
 KQP_A_Thousand_Year_Promise_desc:"刻晴站在城头，对着整座港口许下一个谁也来不及验证的诺言：愿璃月千年之后，仍是凡人说了算。她刻意没写「我」字，因为这本来就是一份要一代代传下去、也随时可能被背弃的约定。"
 KQP_Watchful_Engineers:"执政工程师"
 KQP_Watchful_Engineers_desc:"另一条路的第一个脚印，是无声的。工程师们不谈理想，只谈指标；不问民意，只问效率。刻晴在深夜对自己说：也许璃月还没准备好自治，也许该有人先把它建成一台不会出错的机器。这句话，成了后来一切的开端。"
 KQP_Suspend_the_Assembly:"暂停议会"
 KQP_Suspend_the_Assembly_desc:"「非常时期，需要非常手段。」刻晴说这句话时声音很轻，轻到几乎像在道歉。议会的大门合上了，第二天没有人为它守夜。她告诉自己这只是暂时的，可她比谁都清楚，暂时是独裁者最爱用的那个词。"
 KQP_The_Efficiency_Decree:"效率法令"
 KQP_The_Efficiency_Decree_desc:"效率成为最高律法的那天，公文处理的速度第一次超过了争吵的速度。政府的文件在城里穿梭如织，人们却渐渐发现：跑得越快的东西，越没有人在看它写的是什么。"
 KQP_Technocratic_Cabinet:"技术官僚内阁"
 KQP_Technocratic_Cabinet_desc:"新内阁里没有一个政治人物，全是工程师、会计、测绘师。他们不谈信念，只报数据。第一次会议上，刻晴问：谁来为这些数字背后的人负责？全场沉默。最后是一位年轻的会计举起手，又慢慢放下。"
 KQP_Conscription_Of_Minds:"征召心智"
 KQP_Conscription_Of_Minds_desc:"法令落在书院门口：学生毕业后须先服役三年，学什么、去哪儿，由国家决定。孩子们被要求先学会服从，再学会思考。刻晴审阅名单时，在某个名字旁停了很久，那是她恩师的孙儿。"
 KQP_The_Iron_Prefectorate:"铁腕行署"
 KQP_The_Iron_Prefectorate_desc:"行署成立后，异议只能在纸上，不能在街上。街道安静，安静得能听见巡逻队靴子踩过石板的回音。刻晴承认，她换来了秩序；她只是不敢问，这份秩序里，还剩下多少是她最初想要的东西。"
 KQP_Requisition_All_Ores:"全面征矿"
 KQP_Requisition_All_Ores_desc:"全面征矿令下达。矿工们发现，新主人和旧主人用的，是同一根鞭子。有老矿工当着干部的面把矿灯摔在地上，说了一句：「我推翻帝君，不是为了换个老板。」这句话被记了下来，却没有人上报。"
 KQP_The_Silent_Qixing:"沉默的七星"
 KQP_The_Silent_Qixing_desc:"七星不再议事。他们只是坐在空荡荡的议事厅里，替一个不允许反对的政府盖章。旧日争吵不休的席位，如今只剩下纸张翻动的沙沙声。刻晴偶尔路过会停下脚步，然后快步走开，仿佛怕听见什么。"
 KQP_Neon_Purge:"雷霆整肃"
 KQP_Neon_Purge_desc:"整肃之夜，军官团的名单少了三分之一。被带走的人里，有几个曾在她帐下按过佩刀。行刑的士兵手在抖，命令却签得一丝不苟。天亮后，刻晴照常上朝，没有人看出她昨夜是否合过眼。"
 KQP_National_Works_Corps:"国营工兵团"
 KQP_National_Works_Corps_desc:"工兵团用铁轨把八个区缝在一起，也把自己锁在了工地上。他们修的路最长、最快、最直，直得像一句不容反驳的命令。刻晴来视察时说了一句辛苦了，回程的车上却一路无话。"
 KQP_The_Unanswerable_Question:"无解之问"
 KQP_The_Unanswerable_Question_desc:"一位老教员在停办的书院门口问：一个不允许提出反对的共和国，还算是共和国吗？刻晴没有回答，因为她发现自己给不出一个自己不脸红的答案。这个问题进了她的日记，也进了这座城市往后的每一个夜晚。"
 KQP_Perpetual_Tutelage:"永久监护"
 KQP_Perpetual_Tutelage_desc:"永久监护颁行。刻晴承诺「等璃月成熟的那一天」，可没有人知道那一天还有多远，包括她自己。她在文书的措辞上斟酌了很久，最后选了监护。她告诉自己这两个词不一样，尽管连她自己也快信不过了。"
 KQP_The_Benevolent_Iron_Fist:"仁慈铁拳"
 KQP_The_Benevolent_Iron_Fist_desc:"铁拳上罩了一层绒布，是为了让人挨打时不那么疼。刻晴推出了一系列仁慈的条款：减税、抚恤、赈济。可所有人都看得出来，慷慨的手和握拳的手，是同一只。"
 KQP_Burning_the_Sand_Castle:"焚沙堡"
 KQP_Burning_the_Sand_Castle_desc:"刻晴亲手推倒了案上那只沙堡。她说：既然潮水早晚会来，不如我们自己先把它推平。在场的人都没敢接话。只有她自己知道，这话她既是在说璃月，也是在说她自己，说那个曾经相信一切都能被重新垒起来的自己。"
 KQP_Last_Statute:"终章律"
 KQP_Last_Statute_desc:"终章律写成的那个深夜，刻晴把最后一个字改了三遍。她说：我要留一份文件，证明我们至少努力过。没人告诉她，这份文件最终会成为审判她的证据，还是赦免她的凭据，也许，两者都是。"
 KQP_Question_the_Gods:"问神"
 KQP_Question_the_Gods_desc:"刻晴独自走进空无一人的神殿，对着帝君的位置问了一夜的问题：您当年是不是也这样看着我们？您是不是早就知道会有今天？神像没有回答。离开时她对着神像行了一礼，是告别。"
 KQP_Broken_Contract:"断裂的契约"
 KQP_Broken_Contract_desc:"帝君的死，撕开的不只是一份契约，还有无数人对秩序二字最后的幻想。刻晴捡起角落里一片契约残片，上面写着永不变更。她苦笑了一下，把残片收进怀里，像收下一件遗物。"
 KQP_The_Chasm_Garrison:"层岩戍卫"
 KQP_The_Chasm_Garrison_desc:"层岩巨渊的深处，有比内战更古老的东西在呼吸。刻晴把最忠诚的一支部队派了进去，命令只有一句：无论上面打成什么样，你们都不许出来。这支军队从此消失在地图上，成为璃月最后一道没人知道的防线。"
 KQP_Oceanic_Vigil:"海疆警戒"
 KQP_Oceanic_Vigil_desc:"漩涡魔神的传说还压在老渔民的梦里。刻晴下令重建海防，是为了告诉所有人：璃月的海，不该由别人来替她守。瞭望塔上的灯火彻夜不熄，像一双不肯闭上的眼睛。"
 KQP_War_On_Three_Fronts:"三线作战"
 KQP_War_On_Three_Fronts_desc:"北面是山，东面是海，中间是再也无法弥合的裂痕。三线同时燃起烽火的那一刻，刻晴站在沙盘前一动不动。参谋问她先救哪一线，她说：先救最不重要的那一线，因为重要的几线，早就轮不到我救了。"
 KQP_Whispers_From_Snezhnaya:"北国低语"
 KQP_Whispers_From_Snezhnaya_desc:"至冬的使者带来了合约，也带来了一个无法拒绝的价格。他们说：只要一个港口，至冬就能让璃月重新亮起来。刻晴把合约读了两遍，然后问使者一句话：你们的雪，化了以后是什么颜色？使者没有听懂，但她已经知道了答案。"
 KQP_Reunify_Liyue:"光复璃月"
 KQP_Reunify_Liyue_desc:"内战结束的那一天，刻晴登上城头。城墙修好了，旗帜也换了新的，可城里的名字却少了一半。她很久没有说话。风从海上吹来，带着咸味。她终于明白，光复，从来是带着伤，继续往前走。"

 KQP_civilwar_category:"变革之尺"
 KQP_civilwar_category_desc:"刻晴 · 七星革命委员会的内战决议组。围绕变革之尺的两条轴，在革新与秩序之间反复权衡。每一项决议都会推动其中一条轴前进，进而改变委员会当前所处的等级。战争期间，每一次取舍都在决定璃月究竟要快一步，还是稳一分，也在决定新政权将以怎样的面目立于人前。"
 KQP_decision_reform_ruler:"变革之尺"
 KQP_decision_reform_ruler_desc:"一支尺子，量的是决心。每一次用它推进改革，都会更快地逼近那个新的璃月，但体制不会无声退场，它只会把惯性的重量，压在每一个向前迈步的人身上。"
 KQP_decision_draft_militia:"征募城防民兵"
 KQP_decision_draft_militia_desc:"每一条街都需要有人守。征募的是邻居、是船工、是卖豆腐的大婶的儿子。有人说让普通人拿枪太危险，可刻晴说：让普通人永远只能等别人来保护，才是真的危险。"
 KQP_decision_seize_granary:"查封士绅粮仓"
 KQP_decision_seize_granary_desc:"粮仓的钥匙，从来不在最饿的人手里。查封士绅的囤粮是一把双刃剑：一边把面包还给百姓，一边把士绅彻底推到对立面。新米的香气里，飘着背叛的味道。"
 KQP_decision_scholar_registry:"士人登记"
 KQP_decision_scholar_registry_desc:"新政要用人，可旧文人未必都愿为新政府效力。登记造册既是纳贤，也是甄别，谁知道名单上的哪一个名字，会在某个深夜变成一纸告密，或者一纸檄文。"
 KQP_decision_propagate_reform:"宣讲新政"
 KQP_decision_propagate_reform_desc:"口号喊不进肚子，却喊得进人心。宣讲队走遍八区，把「契约属于人民」这句话一遍遍念给码头、茶馆、田头的人听。有人信了，有人只是听着，但只要有人开始转述，种子就落了地。"
 KQP_decision_crackdown_riot:"镇压骚乱"
 KQP_decision_crackdown_riot_desc:"上街的人里，有敌人，也有饿着肚子的人。镇压是最快的办法，也是最钝的办法，它让街道安静，却让怨恨沉到更深的地方。刻晴下令时，要求部队先喊三遍解散，再开枪。"
 KQP_decision_national_service:"征召国民服役"
 KQP_decision_national_service_desc:"国家缺人，也缺一种「大家都是一伙的」的实感。征召服役既是补员，也是把不同出身、不同立场的年轻人塞进同一间营房，让他们在同一个锅里吃饭，学着把「我」改口说成我们。"
 KQP_decision_enlist_adepti:"招揽散仙"
 KQP_decision_enlist_adepti_desc:"仙家未必都忠于旧制。有些散仙早厌倦了人间纷争，只想寻个清静处修行。刻晴递出的橄榄枝是：不要求你们效忠，只希望你们别站在我们的对面。有人接过了，有人只是冷笑。"
 KQP_decision_chasm_survey:"层岩测绘"
 KQP_decision_chasm_survey_desc:"层岩巨渊的每一寸，都刻着比王朝更古老的文字。测绘队带回来的不只是地图，还有一个警告：深渊的气息，比内战更古老，也更饥饿。有些墙，是替敌人修的，也是替自己修的。"
 KQP_decision_proclaim_republic:"宣告共和"
 KQP_decision_proclaim_republic_desc:"共和两个字，写起来只要两笔，站起来却要一代人。宣告共和的那一刻，旧世界正式成为历史，而新世界，那个谁都没见过的世界，才刚刚开始。刻晴说：别急着庆祝，我们只是刚走到起点。"
 KQP_decision_envoy_to_ganyu:"使者赴月海亭"
 KQP_decision_envoy_to_ganyu_desc:"月海亭的檐角还挂着未化的霜。刻晴派去的使者带去了两样东西：一份承认八省自治的文书，和一小包来自璃月港的新米。她附言：政见可以不同，饭总要一起吃。"
 KQP_decision_envoy_to_ningguang:"使者赴天权"
 KQP_decision_envoy_to_ningguang_desc:"凝光的浮空金库依旧悬在港口上空，像一头沉默的巨兽。使者带回的是一份精确到每一枚摩拉的贸易清单。刻晴看了很久，说：她这是在问我，革命能不能算得出账。"
 KQP_decision_envoy_to_shenhe:"使者赴绝云间"
 KQP_decision_envoy_to_shenhe_desc:"绝云间的雪从不落地。使者在山门前站了三天，才等到一句回话：「仙凡殊途，各安其位。」刻晴把这句话念了两遍，提笔在回执上只写了一个字：「好。」"
 KQP_decision_envoy_to_childe:"使者赴云来海"
 KQP_decision_envoy_to_childe_desc:"公子的船队就泊在港口外，炮口对着璃月的天。使者登船时，甲板上却摆着一桌酒。达达利亚笑着说：我不是来打仗的，我是来做生意的，只是我的生意，用的不是钱。"
 KQP_decision_envoy_to_lanyan:"使者赴沉玉谷"
 KQP_decision_envoy_to_lanyan_desc:"沉玉谷的藤编师蓝砚，据说已经很久不见官府的人。使者带着一包茶种上山，被她从篱门外打发走了。第二天，使者发现那包茶种，被种在了她院子的角落里。"
 KQP_decision_proclaim_the_twelve:"十二部民之召"
 KQP_decision_proclaim_the_twelve_desc:"刻晴做了一个违背所有谋士主张的决定：向曾经敌对、中立、观望的十二方，同时发出同一份邀请。她说：一个容不下反对者的共和国，还不配叫共和国。这一纸邀请，是她给自己出的最后一道考题。"

 LYY_Event.2001.t:"檄文之夜"
 LYY_Event.2001.d:"玉京台的钟声还未散尽，刻晴已经站上了城楼。她的檄文只有一句话：璃月的命运，该由璃月人自己来写。\n消息像潮水一样漫过码头、茶馆、田埂。有人连夜把这张纸抄下来贴在门楣上，有人则悄悄撕下带走，准备日后用来告密。这一夜，璃月被劈成了两半，一半害怕明天，一半渴望明天。"
 LYY_Event.2001.a:"让檄文传遍全城"
 LYY_Event.2001.b:"压下来，先稳住局面"
 LYY_Event.2002.t:"千岩军效忠"
 LYY_Event.2002.d:"千岩军的少壮军官递上了投名状。他们是为了一个不肯再向神明低头的自己。\n老将军沉默着把佩刀放在桌上，说：「我们守了璃月三千年，守的从来是这座城。今天谁替这座城说话，我们就替谁站岗。」"
 LYY_Event.2002.a:"全数接纳投诚军官"
 LYY_Event.2002.b:"只留精锐，余者遣散"
 LYY_Event.2003.t:"士绅闭门"
 LYY_Event.2003.d:"士绅们关上了门，也关上了账簿。他们赌刻晴撑不过一个冬天。\n可关门的那一刻，也有人把地契往怀里塞，他们嘴上说着「等着看笑话」，手上却在数自家的粮仓还能撑几天。璃月的旧贵人们第一次发现，自己引以为傲的财富，在新世界里可能连一张选票都换不来。"
 LYY_Event.2003.a:"强征士绅粮仓"
 LYY_Event.2003.b:"与士绅谈判，换取支持"
 LYY_Event.2004.t:"黑岩厂观望"
 LYY_Event.2004.d:"黑岩厂没有表态。工头只说了一句话：谁能保证炉火不熄，我们就听谁的。\n于是双方的使者都在厂门口排起了队。工人不看他们的旗帜，只看他们带来的粮、煤和订单。这座日夜轰鸣的工厂，像一台不肯表态的天平，安静地等待着谁先开出真正的价钱。"
 LYY_Event.2004.a:"承诺保住炉火与订单"
 LYY_Event.2004.b:"强令黑岩厂为革命赶工"
 LYY_Event.2005.t:"仙家质问"
 LYY_Event.2005.d:"仙家派人来了。他们问：帝君尸骨未寒，你就要拆掉他立的规矩吗？\n刻晴没有立即回答。她只是站起身，走到窗边，望着远处不再闪光的琉璃。她说：「帝君立的规矩，是让人有依靠。可如果人永远只会依靠，那规矩就变成了锁链。」来人沉默良久，转身离去时，背影比来时更老。"
 LYY_Event.2005.a:"耐心解释，不强求"
 LYY_Event.2005.b:"当即驳斥仙家的质问"
 LYY_Event.2006.t:"七星残党逃逸"
 LYY_Event.2006.d:"七星残党连夜出城，带走了半箱账册和整整一队私兵。\n城门口的守军认出了他们，却没有人开枪。一个年轻的哨兵后来解释：「我们恨的是他们，可我们更怕变成他们。」这一夜，璃月的界线不再画在城墙上，是画在每一个人的心里。"
 LYY_Event.2006.a:"追击残党，杜绝后患"
 LYY_Event.2006.b:"放他们走，免得激化"
 LYY_Event.2007.t:"档案库的火"
 LYY_Event.2007.d:"档案库起了火。有人想烧掉那些见不得光的旧契，可灰烬里反而翻出了更多。\n消防队赶到时，最先被抢出来的是一摞摞写着名字的契书。刻晴站在火光里，看着那些陌生的名字在风中翻飞，轻声说：「原来我们的国家，一直被这些看不见的人养着。」"
 LYY_Event.2007.a:"彻查纵火案"
 LYY_Event.2007.b:"把档案一律封存"
 LYY_Event.2008.t:"面包的价格"
 LYY_Event.2008.d:"面粉涨到了三倍。面包师说，他不怪革命，只怪革命来得太晚。\n排队的人从街角一直绕到码头，队伍里却出奇地安静。一个母亲把孩子抱得很紧，低声说：「别怕，再等等，会好的。」刻晴远远地看着这支沉默的长队，比任何一场败仗都让她难受。"
 LYY_Event.2008.a:"低价放粮，稳住民心"
 LYY_Event.2008.b:"照常价格，优先财政"
 LYY_Event.2009.t:"矿工请愿"
 LYY_Event.2009.d:"矿工们举着矿灯列队请愿。他们要的是矿脉归谁、工时几何。\n领头的老师傅把一杯井水递到干部面前，说：「我们不识多少字，但我们知道，井水往下挖，都是同一个源头。」这杯水最后被端上了议事厅的桌案，谁也没敢喝。"
 LYY_Event.2009.a:"接受请愿，改善矿工待遇"
 LYY_Event.2009.b:"驱散请愿，先保生产"
 LYY_Event.2010.t:"军官团密议"
 LYY_Event.2010.d:"军官团密议到深夜。有人提议：与其等议会慢慢吵，不如让枪先说话。\n烛火跳了一下，照出满屋子年轻而紧绷的脸。他们并非天生好战，只是被这十年来的屈辱磨得失去了耐心。刻晴听说后，只在名单上批了四个字：「再多想想。」"
 LYY_Event.2010.a:"安抚军官，暂缓军议"
 LYY_Event.2010.b:"默许军官主张，加速行动"
 LYY_Event.2011.t:"凝光的信"
 LYY_Event.2011.d:"凝光来信。信中只有一行字：你若要烧掉旧世界，别忘了自己也住在里面。\n刻晴把信看了三遍，提笔想回，却迟迟落不下字。她与凝光并非敌人，恰恰相反，她们是同一场宴席上，最早看清这桌菜已经坏掉的那两个人。最后她只回了五个字：「我知道。谢谢你。」"
 LYY_Event.2011.a:"回信与凝光坦诚相商"
 LYY_Event.2011.b:"不予理会，专心内政"
 LYY_Event.2012.t:"甘雨的账册"
 LYY_Event.2012.d:"甘雨寄来一册账本，扉页写着：八省的粮，只够撑到下一次大潮。\n账本记得极细，连一石米的去向都不放过。刻晴翻到最后一页，看见夹着一片干枯的叶子，那是甘雨还是麒麟时，第一次学人记账的凭证。她忽然明白，这个大争之世里，还有人愿意认真地记一笔人类的流水账。"
 LYY_Event.2012.a:"回信甘雨，共商粮政"
 LYY_Event.2012.b:"就账论账，公事公办"
 LYY_Event.2013.t:"御前大辩论"
 LYY_Event.2013.d:"御前大辩论。两条道路在玉京台广场上正面相撞，此后再无回头路。\n一边是议会的高台，一边是讲台的灯火；一边喊着「现在就交给人民」，一边喊着「现在还太早」。刻晴从头到尾一言不发，只是把每个人的话都记在本子上。散场时，她把本子合上，对自己说：这将是最后一道由我来做的选择题。"
 LYY_Event.2013.a:"把选择权交给人民"
 LYY_Event.2013.b:"由自己拍板定夺"
 LYY_Event.2014.t:"沙堡之喻"
 LYY_Event.2014.d:"刻晴把一只沙堡摆在案上。她说：这就是璃月港过去的繁荣。潮水，从来不问沙堡的意见。\n在场的人面面相觑，不知道这是警告还是告别。刻晴没有解释。她只是轻轻吹了口气，看着沙堡顶端塌下一角，然后转身走向下一步。"
 LYY_Event.2014.a:"坦然接受沙堡之喻"
 LYY_Event.2014.b:"斥责悲观，鼓舞士气"
 LYY_Event.2015.t:"激进派逼宫"
 LYY_Event.2015.d:"激进派包围了议事厅。他们要求立刻废除仙家法权，一刻也不能等。\n火把的光晃得窗纸通红。刻晴走出来，站在台阶上，说了句让所有人都愣住的话：「你们急，是因为你们怕来不及；可我怕的，是我们急到把自己变成我们反对的那种人。」人群渐渐安静下来，火把一支支熄灭。"
 LYY_Event.2015.a:"安抚激进派，引其归正"
 LYY_Event.2015.b:"强硬取缔激进组织"
 LYY_Event.2016.t:"保守派兵谏"
 LYY_Event.2016.d:"保守派军官联名上书，请求暂缓一切改革，先保住军队不散。\n密密麻麻的签名后面，还附了一句近乎哀求的话：「给我们一点时间。」刻晴把折子压在案头，一夜没睡。她终于懂得，改革之难，不在于说服敌人，而在于如何善待那些害怕的人。"
 LYY_Event.2016.a:"接纳保守意见，稳步推进"
 LYY_Event.2016.b:"压下上书，全速改革"
 LYY_Event.2017.t:"刻晴的失眠"
 LYY_Event.2017.d:"深夜，刻晴独自坐在空荡的议事厅里。她第一次问自己：我是在解放他们，还是在替他们决定？\n窗外的钟敲了十二下，没有回应。她站起身，吹灭了灯，对自己说：如果这个问题我有了答案，也许就该让位了。正因为没有答案，才更要往前走。"
 LYY_Event.2017.a:"承认困惑，与本心和解"
 LYY_Event.2017.b:"压下疑问，继续前行"
 LYY_Event.2018.t:"两条道路"
 LYY_Event.2018.d:"两条道路已经铺开。一条通向议会，一条通向讲台。它们都写着人民，却再也不会相交。\n支持者互不相让，昔日共饮一壶酒的朋友，如今在街头擦肩而过也不打招呼。刻晴看着这一切，明白分裂是理想太满、现实太薄，容不下两种同样真诚的答案。"
 LYY_Event.2018.a:"让两条道路公开竞争"
 LYY_Event.2018.b:"立即统一路线，避免分裂"
 LYY_Event.2019.t:"抑神敕令"
 LYY_Event.2019.d:"抑神敕令颁下。从此，神明只是信仰，不再是法官。\n告示贴满了城门，有人拍手，有人垂泪。一位老妇人跪在贴告示的墙前，为帝君念了整夜的经。刻晴没有驱赶她，只是远远地看着，她知道，废掉一个神容易，安放一颗心很难。"
 LYY_Event.2019.a:"严颁抑神敕令"
 LYY_Event.2019.b:"给信仰留一线余地"
 LYY_Event.2020.t:"神殿改作学堂"
 LYY_Event.2020.d:"昔日的仙家神殿被改作学堂。孩子们在神像的基座上读书，念的是「人人生而平等」。\n阳光从高高的窗棂间洒下，落在褪色的彩绘上。一个孩子举手问：「老师，神会不会不高兴？」先生沉默片刻，说：「神若真是神，就会为你识字而高兴。」"
 LYY_Event.2020.a:"推广世俗学堂"
 LYY_Event.2020.b:"尊重僧侣，暂缓改庙"
 LYY_Event.2021.t:"制宪开幕"
 LYY_Event.2021.d:"制宪会议开幕。这是璃月第一次，由凡人自己给自己立约。\n会场里坐着工匠、船夫、教师，还有几个从旧官府里留下来的文书。他们吵了整整三天，没有一个人退场。刻晴坐在最后一排，第一次觉得，自己不是这场会议的主角，而只是它的一个记录员。"
 LYY_Event.2021.a:"如期召开制宪会议"
 LYY_Event.2021.b:"延期，先整肃内部"
 LYY_Event.2022.t:"选票与刀剑"
 LYY_Event.2022.d:"选票与刀剑同时到场。刻晴选择了选票，至少此刻是的。\n军队在城外列阵，议会里却在投票。有军官私下抱怨这是软弱，刻晴听说后只说了一句：「记住今天，是我们第一次可以选择不流血。」这句第一次，既是骄傲，也是她自己心里的一根刺。"
 LYY_Event.2022.a:"捍卫选票，压制武力干预"
 LYY_Event.2022.b:"与军方妥协，换取秩序"
 LYY_Event.2023.t:"匠人宪章"
 LYY_Event.2023.d:"匠人宪章落笔。从此，锤子的主人，也有权决定铁的去向。\n黑岩厂的钟声敲了整整一小时。老工头把宪章抄了一份贴在车间门口，每天上工前都要念一遍。有年轻人笑他迷信，他只是摆摆手：「你不懂，我们等这一天，等了三代人。」"
 LYY_Event.2023.a:"全力推动匠人宪章"
 LYY_Event.2023.b:"搁置宪章，优先军工"
 LYY_Event.2024.t:"矿脉之争"
 LYY_Event.2024.d:"矿脉之争在井下拉开了序幕。旧矿主雇了打手，工会雇了更多的人。\n井下的世界没有太阳，只有矿灯和喘息。冲突持续了七天，最终以旧矿主退让告终。可刻晴知道，真正的仗还没打完，夺回矿脉只是开始，如何不再制造新的矿主，才是终局。"
 LYY_Event.2024.a:"支持工会接管矿脉"
 LYY_Event.2024.b:"调停矿主与工会"
 LYY_Event.2025.t:"人民军整编"
 LYY_Event.2025.d:"人民军开始整编。旧军官换上没有徽章的制服，向一面新的旗帜敬礼。\n有人敬礼时手抖得厉害，是长久以来的习惯被强行掰弯的疼。刻晴站在阅兵台上，没有讲任何豪言壮语，只说了一句：「今天你们属于这座城，不再属于任何人。包括我。」"
 LYY_Event.2025.a:"全面整编，革除旧弊"
 LYY_Event.2025.b:"暂留旧制，逐步过渡"
 LYY_Event.2026.t:"劳工契约"
 LYY_Event.2026.d:"劳工契约签订的那一刻，刻晴把笔递给了工人代表。\n会场里先是死一般的寂静，随后响起了低低的抽泣。一个中年女工握着笔，半天不敢落下，最后在纸上写下了自己一辈子的名字，那名字她只会写，不会读。"
 LYY_Event.2026.a:"把签字权交给工人"
 LYY_Event.2026.b:"亲自签署以显权威"
 LYY_Event.2027.t:"裁撤仙庭"
 LYY_Event.2027.d:"仙家法庭的牌匾被摘下。申鹤派人送来一封信，信纸是冷的。\n信上只有八个字：「你拆的是庙，断的是缘。」刻晴把信折好收进袖中，转身对助手说：「记下来。将来若有人问我后悔不后悔，就把这封信给他看。」"
 LYY_Event.2027.a:"坚决裁撤仙家法庭"
 LYY_Event.2027.b:"暂缓裁撤，缓和仙家"
 LYY_Event.2028.t:"后浪军官"
 LYY_Event.2028.d:"后浪军官团成立。他们比刻晴更激进，也比刻晴更危险。\n这些年轻人没有经历过帝君的时代，因此也没有对旧秩序的敬畏。他们崇拜刻晴，却比刻晴更急于证明自己。刻晴在任命书上签下自己的名字时，袖中的手，微微顿了顿。"
 LYY_Event.2028.a:"擢升后浪，委以重任"
 LYY_Event.2028.b:"压制后浪，防其坐大"
 LYY_Event.2029.t:"玉衡宣言"
 LYY_Event.2029.d:"玉衡宣言响彻全城。契不再属于神，也不属于星，而属于每一个签下它的人。\n万人空巷，码头上的汽笛一齐鸣响。刻晴站在台上，被欢呼声淹没。可就在最高处的那一瞬，她忽然想起一个问题：当所有人都听我的时候，我还怎么听见他们？"
 LYY_Event.2029.a:"向全城宣读玉衡宣言"
 LYY_Event.2029.b:"小范围颁行即可"
 LYY_Event.2030.t:"平等之港"
 LYY_Event.2030.d:"平等之港开港。所有船，无论挂谁的旗，都可在璃月港卸货。\n旧商人破口大骂，新商人却连夜雇船赶来。开港第一天，码头就堵了三里长。刻晴站在灯塔下看着这一切，说了一句谁也没听懂的话：「开放是因为我怕了封闭太久会烂掉。」"
 LYY_Event.2030.a:"平等之港，全面开放"
 LYY_Event.2030.b:"只开放部分口岸"
 LYY_Event.2031.t:"暂停议会"
 LYY_Event.2031.d:"刻晴暂停了议会。「非常时期，需要非常手段。」她说这话时，声音很轻。\n议事厅的门合上时发出一声闷响，像一记关门声，也像一记叹息。门外的记者写下标题：《共和国的第一次闭门》。刻晴看到了那份报纸，什么也没说，只是把它压在了文件的最底层。"
 LYY_Event.2031.a:"暂停议会，效率优先"
 LYY_Event.2031.b:"维持议会，纵其争论"
 LYY_Event.2032.t:"效率至上"
 LYY_Event.2032.d:"效率成为了最高律法。文件的处理速度第一次超过了争吵的速度。\n公文在城中穿梭如织，印章盖得飞快。可人们渐渐发现，跑得越快的东西，越没有人看清它写的是什么。一个老文吏看着案头堆积如山、却无人细读的文件，喃喃道：「我们是不是把耐心也一起改革掉了。」"
 LYY_Event.2032.a:"奉行效率至上"
 LYY_Event.2032.b:"为民意留出冗余"
 LYY_Event.2033.t:"技术官僚登场"
 LYY_Event.2033.d:"技术官僚登上讲台。他们不谈理想，只谈指标。\n第一份报告用了三十七张图表，结尾却只有一句冷冰冰的结论：「本季度，人民满意度无法量化。」刻晴在报告上圈出这句话，批注：「那就去找一个能理解满意度的办法。」"
 LYY_Event.2033.a:"启用技术官僚内阁"
 LYY_Event.2033.b:"坚持政治协商，不设技术内阁"
 LYY_Event.2034.t:"征召心智"
 LYY_Event.2034.d:"征召心智的法令落在了书院的门口。孩子们被要求先学会服从，再学会思考。\n老院长把法令读了三遍，最后对学生们说：「记住，命令教你们怎么活，学问教你们为什么活。两样都要，但别把顺序搞反了。」他当晚就病倒了，没人知道是因为年纪，还是因为别的。"
 LYY_Event.2034.a:"推行征召心智"
 LYY_Event.2034.b:"保留书院的独立"
 LYY_Event.2035.t:"铁腕行署"
 LYY_Event.2035.d:"铁腕行署成立。此后，异议只能在纸上，不能在街上。\n街道安静了，安静得能听见巡逻队靴子的回音。有人松了口气，说终于不用怕了；也有人关上窗，把要说的话写进日记。刻晴巡视全城那天，街上没有一声欢呼，她这才想起，安宁和死寂，声音竟然如此相像。"
 LYY_Event.2035.a:"成立铁腕行署"
 LYY_Event.2035.b:"拒绝铁腕，坚持宽和"
 LYY_Event.2036.t:"全面征矿"
 LYY_Event.2036.d:"全面征矿令下达。矿工们发现，新主人和旧主人，用的是同一根鞭子。\n一个老矿工当着干部的面把矿灯摔在地上，吼了一句：「我推翻帝君，不是为了换个老板！」这句话很快被记进档案，却始终没有人敢上报。它像一根刺，扎在这个新政权的心里。"
 LYY_Event.2036.a:"全面征矿，压榨产能"
 LYY_Event.2036.b:"体恤矿工，放缓征矿"
 LYY_Event.2037.t:"沉默的七星"
 LYY_Event.2037.d:"七星不再议事。他们只是坐在空椅上，替一个不允许反对的政府盖章。\n旧日争吵不休的大厅，如今只剩下翻纸的沙沙声。刻晴有一次路过，听见里面静得可怕，忽然在门口站了很久。助手轻声提醒她会议要开始了。她回过神来，快步走开，仿佛怕听见什么。"
 LYY_Event.2037.a:"让七星彻底噤声"
 LYY_Event.2037.b:"给七星保留咨议之权"
 LYY_Event.2038.t:"雷霆整肃"
 LYY_Event.2038.d:"雷霆整肃。一夜之间，军官团少了三分之一的名字。\n被带走的名单里，有几个曾在她的帐下按过佩刀、一起啃过冷馒头的人。行刑的士兵手在抖，命令却签得一丝不苟。次日清晨，刻晴照常上朝，没有人看出她昨夜是否合过眼。"
 LYY_Event.2038.a:"发动雷霆整肃"
 LYY_Event.2038.b:"停止整肃，收拢人心"
 LYY_Event.2039.t:"国营工兵"
 LYY_Event.2039.d:"国营工兵团上工。他们用铁轨把八省缝在一起，也用铁轨把自己锁在了工地上。\n铁轨修得又快又直，直得像一句不容反驳的命令。刻晴来视察时，站在新铺设的路基上说了句辛苦了，回程的车上却一路沉默。窗外，铁轨笔直地刺向地平线，看不到尽头。"
 LYY_Event.2039.a:"组建国营工兵团"
 LYY_Event.2039.b:"放缓建团，减轻负担"
 LYY_Event.2040.t:"无解之问"
 LYY_Event.2040.d:"无解之问：一个不允许提出反对的共和国，还算是共和国吗？刻晴没有回答。\n提问的是书院里最后一位老教员。他问完这句话，第二天就递交了辞呈，没有人知道他去哪儿了。刻晴把这个问题原封不动地抄进了自己的日记，从此它成了她每晚入睡前，不得不面对的最后一道墙。"
 LYY_Event.2040.a:"直面问题，寻求答案"
 LYY_Event.2040.b:"回避问题，埋头建设"
 LYY_Event.2041.t:"永久监护"
 LYY_Event.2041.d:"永久监护颁行。刻晴承诺「等璃月成熟的那一天」，可没有人知道那一天还有多远。\n她在措辞上斟酌了很久，最终选了监护而非统治。她在内心一遍遍告诉自己这两个词不一样，可每当夜深人静，她总会想起当年自己是如何痛骂无限期这三个字的。"
 LYY_Event.2041.a:"颁行永久监护"
 LYY_Event.2041.b:"立下还政之期"
 LYY_Event.2042.t:"焚沙堡"
 LYY_Event.2042.d:"焚沙堡。刻晴亲手推倒了案上那只沙堡。她说：既然潮水会来，不如我们自己先把它推平。\n在场的人都不敢接话。只有她自己明白，这句话她既是在说璃月，也是在说那个曾经相信一切都能被重新垒起来的自己。沙粒从指缝滑落，堆在案角，像一小撮等不到明天的希望。"
 LYY_Event.2042.a:"亲手推倒沙堡"
 LYY_Event.2042.b:"重建沙堡，从头再来"
 LYY_Event.2043.t:"三线烽火"
 LYY_Event.2043.d:"三线烽火同时燃起。北面是山，东面是海，中间是再也无法弥合的裂痕。\n参谋们围在地图前争论先救哪一线。刻晴一直没说话，直到所有人安静下来，她才开口：「先救最不重要的那一线，因为重要的几线，早就轮不到我救了。」地图上的三处火光，映得她的脸忽明忽暗。"
 LYY_Event.2043.a:"三线同时迎战"
 LYY_Event.2043.b:"收缩战线，保存实力"
 LYY_Event.2044.t:"北国低语"
 LYY_Event.2044.d:"北国低语：至冬的使者带来了一份合约，和一个无法拒绝的价格。\n他们许诺重建港口，条件只是「借」一个不冻港。刻晴把合约读了两遍，然后问使者：你们的雪，化了之后是什么颜色？使者愣住了。刻晴笑了笑，说：「我猜，是别人的血的颜色。」"
 LYY_Event.2044.a:"拒绝至冬的合约"
 LYY_Event.2044.b:"接受合约，换取重建"
 LYY_Event.2045.t:"奥赛尔夜啸"
 LYY_Event.2045.d:"奥赛尔在深海中翻了个身。整座港口的水位，为一瞬之间涨了三寸。\n古老的恐惧从每一户人家的窗缝里钻进来。老人跪下来祈祷，年轻人握紧了枪。刻晴站在城头，望着漆黑的海面，忽然意识到：在内战之外，还有更古老的战争，从未真正结束。"
 LYY_Event.2045.a:"全力镇压奥赛尔"
 LYY_Event.2045.b:"疏散港口，避其锋芒"
 LYY_Event.2046.t:"层岩裂响"
 LYY_Event.2046.d:"层岩巨渊传来裂响。深渊的气息，比内战更古老，也更饥饿。\n地动持续了整整一分钟，井下的工人被紧急撤出。回来的勘测员脸色惨白，只反复说一句话：「下面……有东西在动。」刻晴当即下令封矿，并把最忠诚的一支部队永远留在了这道无人知晓的防线上。"
 LYY_Event.2046.a:"封矿并常驻戍卫"
 LYY_Event.2046.b:"不顾警告，继续开采"
 LYY_Event.2047.t:"海疆封锁"
 LYY_Event.2047.d:"海疆封锁。公子的船队堵住了璃月港的咽喉。\n至冬的旗帜第一次出现在璃月的水平线上，像一片不化的雪。港口的商人慌了，水手们却在悄悄打听：那个叫达达利亚的年轻人，想要什么？刻晴没有下令开火，只说：「先看看，这头北方的狼，是来咬我们，还是来咬别人。」"
 LYY_Event.2047.a:"陈兵海疆，以对封锁"
 LYY_Event.2047.b:"派人谈判，试探公子"
 LYY_Event.2048.t:"千岩军哗变"
 LYY_Event.2048.d:"千岩军哗变。他们终于发现，自己效忠的是这座城。\n导火索是一道强征命令，点燃它的是三年积攒的怨气。士兵们没有反叛，只是摘下徽章，静静地站在城门口。刻晴独自走上前去，没有带卫兵。她对他们说：「你们是对的。错的，是我忘了先问你们愿不愿意。」"
 LYY_Event.2048.a:"亲赴军营，回应哗变"
 LYY_Event.2048.b:"派兵弹压，肃正军纪"
 LYY_Event.2049.t:"旧友成敌"
 LYY_Event.2049.d:"旧友成敌。曾经并肩的人，如今隔着战壕相望。\n对方阵营里，有她少年时的同窗，有一起读书、一起发誓要改变璃月的故人。炮火间隙，对方派人送来一壶酒和一封信。信上只有一句：「敬我们各自相信的东西。」刻晴把酒倒了半壶在地上，一半敬他们，一半敬回不去的从前。"
 LYY_Event.2049.a:"回信故人，各守其志"
 LYY_Event.2049.b:"断绝往来，战场相见"
 LYY_Event.2050.t:"光复的代价"
 LYY_Event.2050.d:"光复的代价：城墙修好了，代价是城里的名字少了一半。\n刻晴站在城头，很久没有说话。旗帜在头顶猎猎作响，风从海上吹来，带着熟悉的咸味。她终于明白，光复，从来是带着满身的伤，继续往前走。她转过身，对着身后的人群，说出了这个新时代的第一句话：「回家吧。」"
 LYY_Event.2050.a:"带着伤，继续往前走"
 LYY_Event.2050.b:"停下脚步，清算过往"
 LYY_Event.2051.t:"月海亭的回信"
 LYY_Event.2051.d:"甘雨的回信写得工工整整，像一份账目：她同意开放八省的粮道，条件是刻晴需要保证，粮车在路上不会被任何一方劫走。\n信末，她附了一句题外话：「我做了三千年的文书，第一次为一份不属于神明的契约盖章。希望你值得。」刻晴把这句话抄在了桌案前的木板上，就在她每天抬头就能看见的地方。"
 LYY_Event.2051.a:"接受甘雨的粮道条件"
 LYY_Event.2051.b:"要求八省全境无条件开放"
 LYY_Event.2052.t:"天权的回信"
 LYY_Event.2052.d:"凝光的回信只有一页，却密密麻麻写满了数字：每一座矿、每一条商路、每一个港口的税。她在末尾写道：「你要革命，我不拦你。但革命之后的账，总得有人会算。」\n刻晴把信看了三遍，笑了。她比谁都清楚：如果新世界连账都算不清，那它撑不过一代人。"
 LYY_Event.2052.a:"与凝光共算革命的账"
 LYY_Event.2052.b:"拒绝与旧财阀合作"
 LYY_Event.2053.t:"绝云间的回信"
 LYY_Event.2053.d:"绝云间的来客带走了一句话，也留下了一句话。留下的是：「仙凡殊途，本无对错。」带走的是刻晴托付的一小盒种子，她说，种在绝云间的花，也许比种在港口更干净。\n申鹤没有回音，但那年冬天，绝云间的雪地边缘，第一次开出了不属于仙家的花。"
 LYY_Event.2053.a:"尊重仙家，各守其界"
 LYY_Event.2053.b:"强令仙家交出洞天"
 LYY_Event.2054.t:"北方来的船"
 LYY_Event.2054.d:"达达利亚在甲板上摆了一桌酒，谈的是秩序。他说：这个世界从来就不公平，你们革命，是想让它公平，还是想换一批人来收账？\n刻晴举杯，没有回答。回港的船上，她对随行的参谋说了一句话：记住这个人。他不是我们的敌人，他是我们的镜子。"
 LYY_Event.2054.a:"虚与委蛇，换取喘息"
 LYY_Event.2054.b:"断然拒绝至冬的提议"
 LYY_Event.2055.t:"沉玉谷的秤"
 LYY_Event.2055.d:"沉玉谷的回复来得最迟，也最奇怪：一杆用藤条编的旧秤，没有刻度。附言说：「你们的契，量不出水土的重量。」\n刻晴端详着那杆秤，忽然明白了蓝砚的意思，她不是拒绝合作，她是在提醒刻晴：一个只讲契约的国度，也许会用公平，掩盖另一种偏心。"
 LYY_Event.2055.a:"虚心请教沉玉谷"
 LYY_Event.2055.b:"以革命之名斥其消极"
 LYY_Event.2056.t:"十二道回声"
 LYY_Event.2056.d:"十二份回执，十二种态度，十二个曾经不可能坐在同一张桌前的名字。刻晴把它们并排铺在长桌上，像铺开一张璃月的地图。\n最勇敢的回信只有两个字：「来吧。」最冷淡的只有一枚空白的印章。可刻晴看着这十二张纸，第一次觉得，自己也许真的在做一件了不起的事，是因为她终于敢让所有人说话。"
 LYY_Event.2056.a:"邀请十二方共立新约"
 LYY_Event.2056.b:"只与忠于革命者结盟"

 KQP_Spirit_Yuheng_Banner:"玉衡星的檄文"
 KQP_Spirit_Yuheng_Banner_desc:"一面没有徽号的旗，比任何神像都更让人不安。它代表的不只是刻晴一个人，是一种从今往后、再也不肯下跪的姿态。"
 KQP_Spirit_Reformed_Millelith:"新制千岩"
 KQP_Spirit_Reformed_Millelith_desc:"新的千岩军不敬星、不敬神，只敬一个抽象而沉重的词：璃月。脱下旧徽的军官们，学会了一件更难的事，服从于共识。"
 KQP_Spirit_The_Reform_Engine:"变革引擎"
 KQP_Spirit_The_Reform_Engine_desc:"当整个国家变成一台开足马力的机器，效率既是它的燃料，也是它的磨损。改革推着所有人向前跑，跑着跑着，有些人开始怀念那个从前慢而安静的世界。"
 KQP_Spirit_Inertia_Burden:"旧制之负"
 KQP_Spirit_Inertia_Burden_desc:"三千年的秩序不会一夜消失。它藏在每一个习惯、每一句向来如此里，像一件看不见的湿棉袄，裹住每一个想要快跑的人。"
 KQP_Spirit_Peoples_Contract:"人民契约"
 KQP_Spirit_Peoples_Contract_desc:"契约第一次是两个人彼此按下的手印。它并不保证公平，却保证了，至少这一次，签字的人里，有你自己。"
 KQP_Spirit_Secular_Republic:"世俗共和"
 KQP_Spirit_Secular_Republic_desc:"神明退到供桌上，人第一次站到了自己的中央。世俗是把信仰从法度里请出去，让它回到该在的地方，一个人的心里。"
 KQP_Spirit_Engineer_Cabinet:"工程师内阁"
 KQP_Spirit_Engineer_Cabinet_desc:"一个由工程师治理的国家，测量一切，唯独很少测量人心。它把国家修得越来越整齐，也越来越像一只精美的笼子。"
 KQP_Spirit_Perpetual_Tutelage:"永久监护"
 KQP_Spirit_Perpetual_Tutelage_desc:"「等你们成熟了，我就还政」，这句话如此温柔，以至于没有人追问：由谁来定义成熟？监护者越是仁慈，被监护者就越是永远长不大。"
 KQP_Spirit_Neon_Terror:"雷霆恐怖"
 KQP_Spirit_Neon_Terror_desc:"秩序恢复了，街道安静了，反对的声音也一起消失了。刻晴知道，用恐惧换来的稳定，地基是冰做的，它撑得住此刻，撑不住人心融化的那一天。"
 KQP_Spirit_Thousand_Year_Promise:"千年之诺"
 KQP_Spirit_Thousand_Year_Promise_desc:"这是一份注定无法被此刻验证的承诺。它把希望寄托在遥远的未来，也让每一个当下的人，都需要为那个还看不见的千年，先付出自己这一代。"
 KQP_Spirit_Five_Envoys:"五方通使"
 KQP_Spirit_Five_Envoys_desc:"五面旗帜，五次试探，五条通往不同未来的路。刻晴不一定能说服他们，但至少，她让所有人都知道，璃月的大门，没有对谁关上。"
 KQP_Spirit_Twelve_Echoes:"十二回声"
 KQP_Spirit_Twelve_Echoes_desc:"当十二个曾经互为仇敌的名字，第一次愿意出现在同一纸邀请上，璃月才真正开始像一个国家。它是所有不肯闭嘴的人的胜利。"

 KQP_Reform_Tier_1:"变革度等级"
 KQP_Reform_Tier_1_desc:"变革度极低，一切照旧。旧秩序仍在缓慢运转，稳如古钟，也钝如古钟。"
 KQP_Reform_Tier_2:"变革度等级"
 KQP_Reform_Tier_2_desc:"变革初启，新律在旧制上试笔，人们开始低声议论，但尚无人大声表态。"
 KQP_Reform_Tier_3:"变革度等级"
 KQP_Reform_Tier_3_desc:"变革中程，新旧势力胶着，进步的渴望与守旧的惯性彼此拉扯，谁也压不倒谁。"
 KQP_Reform_Tier_4:"变革度等级"
 KQP_Reform_Tier_4_desc:"变革深入，机器开足马力，效率压过了争吵，代价开始被人悄悄察觉。"
 KQP_Reform_Tier_5:"变革度等级"
 KQP_Reform_Tier_5_desc:"变革过载，剧变之下，旧制动摇、人心浮动；跑得太快的列车，最先被甩下车的往往是乘客。"
 KQP_Inertia_Tier_1:"体制惯性等级"
 KQP_Inertia_Tier_1_desc:"惯性极弱，旧制几近被挤出历史舞台，新秩序终于有了呼吸的空间。"
 KQP_Inertia_Tier_2:"体制惯性等级"
 KQP_Inertia_Tier_2_desc:"惯性偏低，守旧的力量退守庙堂与乡里，暂时无力回天。"
 KQP_Inertia_Tier_3:"体制惯性等级"
 KQP_Inertia_Tier_3_desc:"惯性中位，旧制尚在，与新律分庭抗礼，改革每前进一步都要付出代价。"
 KQP_Inertia_Tier_4:"体制惯性等级"
 KQP_Inertia_Tier_4_desc:"惯性偏高，三千年沉淀化作巨石，压在每一次进步的车轮下。"
 KQP_Inertia_Tier_5:"体制惯性等级"
 KQP_Inertia_Tier_5_desc:"惯性沉重，旧制未死，新律难立，整个国家在将变未变之间，凝固成一块琥珀。"
 KQP_Combo_Twin_High:"双向撕扯"
 KQP_Combo_Twin_High_desc:"新律与旧制同时绷紧，改革的车轮碾在还没拆掉的旧轨上，向前一步都要付两份代价。"
 KQP_Combo_Twin_Low:"失据"
 KQP_Combo_Twin_Low_desc:"旧的散了，新的还没立住。人们一时不知道该守什么、跟谁走，街道安静得让人心里发空。"
 KQP_Combo_A_High:"疾进"
 KQP_Combo_A_High_desc:"旧制动摇，新律得以全速铺开。机器轰鸣，把所有人推向同一个方向，快得没人来得及问要去哪。"
 KQP_Combo_B_High:"凝滞"
 KQP_Combo_B_High_desc:"旧制重新合拢，改革停在半途。一切照旧得几乎听不见回声。"

 #################### 刻晴 · 七星革命委员会（KQP） · 战后 ####################
 KQP_PW_Dawn_Republic:"共和国之晨"
 KQP_PW_Dawn_Republic_desc:"内战结束的第二天，刻晴在港口的废墟上站了很久。她没有让人清扫，只让所有人先看清楚这些东西是怎么塌的。她说：共和是从今天起，每一块砖都要有人认领。她抬头看了一眼重新升起的天光，把这句话记进了当天的第一份公文。"
 KQP_PW_Clear_the_Rubble:"清墟安民"
 KQP_PW_Clear_the_Rubble_desc:"清墟的活计没人愿干，刻晴第一个拿起铁锹。她把断墙搬开，让出一条能让板车通过的路，然后让人把这条路的走向记下来。她说：以后修城，照这条路修，别绕开我们踩过的这些坑。"
 KQP_PW_Rebuild_the_Wards:"里坊重立"
 KQP_PW_Rebuild_the_Wards_desc:"里坊是按姓氏与旧邻重划的，不许有钱人多占半寸。有人托关系来求情，被刻晴当场驳回：你们从前的宅子，是买来的；今天的地，是分出来的。这两笔账，不能混在一起算。"
 KQP_PW_Reopen_the_Markets:"复市"
 KQP_PW_Reopen_the_Markets_desc:"复市那天，刻晴亲自去了早市，买了一碗最便宜的面。她端着碗站在路中间吃完，对摊主说：价钱你定，谁来查你都别怕，查出问题，我顶着。摊主愣了半天，转身把压了一整个内战的招牌重新挂了上去。"
 KQP_PW_Return_the_Fields:"还田于民"
 KQP_PW_Return_the_Fields_desc:"还田的告示贴遍了城外的村落，写得极笨：谁种的地归谁，从前的地契一律作废，有异议到衙门去说。有老农不信，抱着旧契在田埂上坐了一天。第二天天亮，他看见公人把界桩重新打了一遍，才把契纸撕了。"
 KQP_PW_The_Granary_Compact:"义仓之约"
 KQP_PW_The_Granary_Compact_desc:"义仓的钥匙分给了十个人，缺一个人到场就打不开门。有人劝刻晴把钥匙收回来，她说：仓里的粮是大家凑的，锁就该大家来开。一个人开得开的仓，早晚会变成一个饿得死人的仓。"
 KQP_PW_A_Ledger_of_Every_Soul:"生民清册"
 KQP_PW_A_Ledger_of_Every_Soul_desc:"生民清册从头到尾只用一种格式，不以贫富、不以亲疏。有官吏抱怨查得太细，刻晴把册子举起来给他看：这上面每一个人，从前都只是一个数字；从今天起，他们至少各自占着一行。"
 KQP_PW_Schools_of_the_People:"公民学堂"
 KQP_PW_Schools_of_the_People_desc:"学堂的门口没有石狮，只有一块写了开课钟点的木板。第一批学生里有挑夫、船工、卖鱼的孩子。刻晴亲自上过一堂课，讲的是“怎么看清一份契约里的陷阱“。她说：读得懂字的人多了，骗人的话就少了。"
 KQP_PW_The_Peoples_Bank:"人民银行"
 KQP_PW_The_Peoples_Bank_desc:"人民银行的第一笔放贷，给了一家快塌的铁匠铺。掌柜不敢接，说怕还不上。办事的人只说：利息从你出第一炉好铁那天算起。三个月后，那把新打的刀在集市上卖了个好价钱，铁匠铺的炉子，再没熄过。"
 KQP_PW_Rails_to_the_Chasm:"层岩铁道"
 KQP_PW_Rails_to_the_Chasm_desc:"铁轨从港口一直铺进层岩的矿口，第一条枕木是刻晴亲手放的。她说：从前运一车矿要死两个人，今天开始，死的是石头，不是人。有人笑她痴，直到第一列满载的矿车轰隆隆地驶出山口。"
 KQP_PW_Workshop_Councils:"工坊自治"
 KQP_PW_Workshop_Councils_desc:"工坊自治，让最懂机器的人管机器。刻晴撤掉了大半监工的位子，只留下记账的人。有老人担忧无人约束，她答：把炉温交给掌炉的，把账本交给全坊的，剩下的事，他们自己会商量。"
 KQP_PW_The_New_Tea_Road:"新茶马道"
 KQP_PW_The_New_Tea_Road_desc:"新茶马道绕开了几处旧日的关卡，直通内陆的商埠。修路的骡马队里，一半是从前的驿卒。刻晴对他们说：路修好了，你们的饭碗也还在，只是从今往后，管路的是路过的人自己。"
 KQP_PW_Engineers_of_Liyue:"璃月工匠"
 KQP_PW_Engineers_of_Liyue_desc:"璃月第一所工学堂开学，讲的是机关、水文、冶金，也讲怎么算一笔工程该不该做。刻晴在开学那天说：我们从前靠一位神明凿山引水，如今得自己学会看图纸。这是把别人的手，换成了自己的。"
 KQP_PW_Envoys_of_the_Dawn:"破冰使节"
 KQP_PW_Envoys_of_the_Dawn_desc:"内战期间璃月几乎从提瓦特地图上消失。刻晴派出的第一批使节，带的是一叠账册和一句口信：璃月可以重新做买卖，但规矩得先说清楚。有人笑这姿态太硬，她却说：先亮账本的人，才谈得上信用。"
 KQP_PW_The_Wind_and_the_Free:"风与自由之约"
 KQP_PW_The_Wind_and_the_Free_desc:"蒙德的使节带来了风车与酒。刻晴对这位自由之邦的客人说：你们不用神明管，我们刚学会也不用。两边都笑了，随后签下的第一份文件，是一张税率互认的清单。"
 KQP_PW_The_Island_of_Thunder:"雷锁之国"
 KQP_PW_The_Island_of_Thunder_desc:"稻妻的封锁让航路断过许多年，使者到来时海上还留着旧怨。刻晴没有绕开这段往事，只说：锁国锁住的从来是锁门的人自己。雷雨之下，两国的商船第一次被允许并肩停靠。"
 KQP_PW_The_Land_of_Wisdom:"识海之邦"
 KQP_PW_The_Land_of_Wisdom_desc:"须弥的学者带来了成箱的图纸与典籍。刻晴让人腾出半座学堂安置这些书，却在扉页上统一盖了印：知识归众人。有为学者不悦，她答：你们教给璃月的，不该只教给璃月的官。"
 KQP_PW_The_City_of_Judgment:"律水之都"
 KQP_PW_The_City_of_Judgment_desc:"枫丹的使者在谈判桌上摆出了一整部法典。刻晴读了一夜，第二天带着自家人写的章程赴会，逐条比对。她说：法不嫌多，只怕只许一个人念。两国最终交换了判词范本，谁也没吃亏。"
 KQP_PW_The_Winter_Court:"北国寒约"
 KQP_PW_The_Winter_Court_desc:"北国来的合约写得漂亮，条款却处处留着后手。刻晴读过三遍，只批了一句：合作可以，抵押不行。使者脸色一沉，追问代价，她答：我算过，比你们算得清楚。散会后，她把合约锁进了最厚的那个柜子。"
 KQP_PW_The_Teyvat_Convention:"提瓦特通行公约"
 KQP_PW_The_Teyvat_Convention_desc:"提瓦特通行公约谈成那天，与会各方各让一步。刻晴在末尾添了一句：此约之内，众生平等，不分神眷。有人不服，却也没人敢当众划掉。这张纸后来被拓下来，挂在了许多港口的会馆里。"
 KQP_PW_The_Empty_Seat:"空座之问"
 KQP_PW_The_Empty_Seat_desc:"帝君的神位空了，商会的座位也空了，连天空岛都不发一言。刻晴把三张空椅子并排摆着，对议会的众人说：从前我们做每件事，都要先看别人的脸色；今天这几把椅子空着，正好让我们看清楚，自己坐得正不正。"
 KQP_PW_Question_the_Sky:"问天"
 KQP_PW_Question_the_Sky_desc:"刻晴让人把历年来所有的神谕、天象、谶纬整理成册，逐条标注真假。整理的官吏越查越心惊，她却在册尾写道：我们是在给后人留一本能自己判断的书。"
 KQP_PW_Seal_the_Abyss:"封渊"
 KQP_PW_Seal_the_Abyss_desc:"巨渊的裂缝又被封了一遍，这一次用的是新铸的合金与新的加固法。刻晴亲自下到井口，看着最后一段闸门落下。她说：深渊是一笔按月要还的债。今天多还一分，明天的人就少赌一次命。"
 KQP_PW_The_Mortals_Choice:"凡人自决"
 KQP_PW_The_Mortals_Choice_desc:"关于神之眼、仙人、天命的争论在议会里吵了数月。刻晴最后只说了一句话：璃月往后由谁说了算，不再由谁的位子高，而由谁的道理站得住。这句话被刻上了议事厅的门楣，字不算好看，却没有一个人提议换掉。"
 KQP_PW_Godless_Republic:"无神之邦"
 KQP_PW_Godless_Republic_desc:"无神之邦的国号正式写下时，有人落泪，有人默然。刻晴没有解释这是勇气还是狂妄，只把一份写得极细的公粮账单发到每一户。她说：神明给过的安稳，往后我们自己给；给不起的时候，就明明白白告诉大家给不起。"
 KQP_PW_Envoys_to_Celestia:"云上之使"
 KQP_PW_Envoys_to_Celestia_desc:"通往天空岛的路始终无人应答。刻晴还是派出了使节，带去的是一封问话：若天理仍在，请现身谈一谈；若不在，请容许我们自己走路。使节归来时两手空空，她却在回执上批了两个字：已知。"
 KQP_PW_The_Abyss_Debt:"深渊旧债"
 KQP_PW_The_Abyss_Debt_desc:"层岩的井下牺牲者名录又添了一页。刻晴下令为每一个名字立碑，无论他生前属于哪一方。她说：我们和深渊的账，不能只算赢的那一半；被埋在里面的人，也该有人替他们记账。"
 KQP_PW_The_Peoples_Army:"人民军"
 KQP_PW_The_Peoples_Army_desc:"新军改叫人民军，军饷照旧，军旗换了。刻晴在检阅时说：这支队伍从前的规矩是“不退“，如今的规矩是“知道自己在护着谁“。队伍里安静了很久，随后响起的口号，与从前不太一样。"
 KQP_PW_Fortify_the_Passes:"关隘重修"
 KQP_PW_Fortify_the_Passes_desc:"山口的关隘一处处重修，图纸上多了一道从前没有的要求：关墙上需要留出能通过逃难百姓的门。有将领不解，刻晴答：关隘挡的是兵，别把人也一起关在外面。"
 KQP_PW_The_Southern_Watch:"南疆戍卫"
 KQP_PW_The_Southern_Watch_desc:"南疆的戍卫队招了当地的山民与猎户。刻晴给他们的第一条命令是认路：哪一条道能走骡马，哪一处崖能藏人。她说：守土的人，先得是懂这片土的人。"
 KQP_PW_Militia_Reform:"民兵改制"
 KQP_PW_Militia_Reform_desc:"民兵不再只是被征召来的人数，是各家各坊登记在册的护院。训练的课目里加了一条：先学会怎么不误伤自己人。刻晴说：上过战场的人才知道，最难的是枪口抬高一寸。"
 KQP_PW_The_Chasm_Garrison:"巨渊戍卒"
 KQP_PW_The_Chasm_Garrison_desc:"巨渊的戍卒轮换期缩短了一半，待遇却抬高了。刻晴的理由很简单：在井下熬人的人，不能让他在黑暗里待太久。她要的是一支还记得天光长什么样的军队。"
 KQP_PW_Arsenal_of_Liyue:"璃月兵工"
 KQP_PW_Arsenal_of_Liyue_desc:"兵工厂从港口迁进了山坳，产量翻了一倍，附近的村子也跟着富了些。刻晴亲自定下一条规矩：厂里造的每一件东西，都要标上工匠的名字。她说：有人认领的兵器，才不会随便杀人。"
 KQP_PW_The_Great_Debate:"共和国的大辩论"
 KQP_PW_The_Great_Debate_desc:"共和已经立住，接下来往哪走，却没人说得清。刻晴把议事厅的门敞开三日，谁都能进来讲。三日之后，纸张堆了半人高，争论也没停。她看着这堆纸说：吵不完最好，吵完了，才是真没人敢说话了。"
 KQP_PW_Federal_Congress:"人民大会"
 KQP_PW_Federal_Congress_desc:"人民大会的方案是把权力层层分下去，让每个里坊、每个行业都有人替自己说话。反对者说这太散，刻晴答：散一点，总比断在一根绳上强。她按下第一个手印，纸角上留了一道浅浅的褶。"
 KQP_PW_Free_Assembly:"自由议席"
 KQP_PW_Free_Assembly_desc:"自由议席不设门槛，只要有人推举，谁都能坐进来。第一场会上，一个卖菜的妇人当众质问了一位旧日的大吏，满堂鸦雀无声。刻晴坐在最后一排，没有出声，散会后却把那天的记录抄了一份留底。"
 KQP_PW_A_Thousand_Schools:"百家争鸣"
 KQP_PW_A_Thousand_Schools_desc:"诸子重新立起门户，学堂、书院、讲坛遍地开花。刻晴不设官学正统，只在每所讲坛的门上钉了一块相同的木牌：说得对，就听；说不通，就散。她说：一个怕争论的政权，早就没什么可争的了。"
 KQP_PW_The_Labor_Charter:"劳工宪章"
 KQP_PW_The_Labor_Charter_desc:"劳工宪章把工时、工价、伤病、学徒写成了明文。有老商号联名反对，刻晴只请他们去码头看了一个下午。回来的人没再说话。她把宪章连同那份联名反对书，一起挂进了议事厅。"
 KQP_PW_Export_the_Dawn:"输出黎明"
 KQP_PW_Export_the_Dawn_desc:"璃月的船队开始驶向更远的海港，带去的不只是货物，还有一整套办事的章程。刻晴说：我们不做主，只做示范。有人担心树敌，她答：怕树敌的，从来不是我们这种人。"
 KQP_PW_Union_of_Teyvat:"提瓦特联合"
 KQP_PW_Union_of_Teyvat_desc:"提瓦特联合的构想被摆上了台面，反对与赞同各占一半。刻晴没有强推，只把各国使节请到同一张长桌前，让他们自己谈。散会时，桌边多了一圈不知是谁画的圈，套住了所有椅子。"
 KQP_PW_Banners_of_the_Free:"自由之帜"
 KQP_PW_Banners_of_the_Free_desc:"自由之帜第一次挂上了璃月的船桅。有人在旗下欢呼，也有人沉默。刻晴对后者说：你们可以不喜欢这面旗，但只要喜欢这个能让你们不喜欢的人，就不会被为难，它就没白挂。"
 KQP_PW_The_Eternal_Republic:"万世共和"
 KQP_PW_The_Eternal_Republic_desc:"万世共和四个字刻上城门那天，刻晴在门前站了很久。她没有讲应许，只对身边人说：我这一生也许只做了一件事，就是让往后的人，不必再靠一个人才能活下去。说完，她转身走进了那个没有神位的大厅。"
 KQP_PW_The_Vanguard:"先锋委员会"
 KQP_PW_The_Vanguard_desc:"先锋委员会把决断的权利收拢到少数人手里，理由是战时不能散。刻晴提笔签下时，笔尖顿了一下。她对身边人说：我知道这有多危险；我只希望，我们收得回来。"
 KQP_PW_Steel_Discipline:"钢铁纪律"
 KQP_PW_Steel_Discipline_desc:"钢铁纪律之下，赏罚分明到近乎无情。有人求情，有人喊冤，刻晴一概不听。她说：我怕的是有一天没人再敢对我说真话。这句话，她记在了随身的手册第一页。"
 KQP_PW_Silence_the_Doubters:"止疑"
 KQP_PW_Silence_the_Doubters_desc:"止疑令颁下，原本喧闹的议会安静了许多。刻晴走过长廊时，听见有人压低声音议论，却没有一个人抬头。她忽然想起自己年少时读过的那些书，书里说，最安静的城，往往最危险。"
 KQP_PW_Sword_of_the_Republic:"共和之剑"
 KQP_PW_Sword_of_the_Republic_desc:"共和之剑挂在了议事厅的墙上，无人佩戴。刻晴每隔几日便会擦拭一次。她说：这把剑最好永远不出鞘；可它若真的锈了，那才是我们最该怕的事。"
 KQP_PW_March_North:"北上"
 KQP_PW_March_North_desc:"北上的军令下达时，刻晴看着地图上那条通往至冬的线，沉默了一夜。第二天，她只在令尾添了四个字：勿伤百姓。送出军令的手，比送出任何一份文件时都要慢。"
 KQP_PW_The_Iron_Commune:"铁血公社"
 KQP_PW_The_Iron_Commune_desc:"铁血公社把整座城市变成了一台机器，每个人都是齿轮。产量上去了，笑声少了。刻晴站在厂区的高台上，看着下面蚂蚁般的人群，第一次分不清，自己是在建一个国家，还是在造一件兵器。"
 KQP_PW_Torch_and_Blade:"炬与刃"
 KQP_PW_Torch_and_Blade_desc:"炬与刃成了共和国的徽记，一明一暗，一进一守。刻晴亲手设计了这枚徽章，却在最后一笔上停了很久。她对画工说：把炬画矮一点，刃画长一点，我总觉得，我们握着的东西，比举着的东西更沉。"
 KQP_PW_The_Red_Citadel:"赤色城塞"
 KQP_PW_The_Red_Citadel_desc:"赤色城塞落成那天，全城戒严。刻晴独自登上城头，看着脚下这座用纪律与恐惧垒起来的城。风从海上吹来，她想起了内战开始的那个夜晚，想起了自己说要让每个人都能站起来的那句话，忽然很想哭，却没有哭。"
 KQP_PW_The_Last_Veterans:"老兵之碑"
 KQP_PW_The_Last_Veterans_desc:"内战的老兵被请到港口，每人发了一枚刻着名字的铁牌。刻晴没有致辞，只挨个与他们握手。有一个断了手的老人问她：我们打的这场仗，到底值不值？她想了很久，答：我不知道。但我知道，这句话你问得出口，就是值了。"
 KQP_PW_The_Name_of_Keqing:"刻晴之名"
 KQP_PW_The_Name_of_Keqing_desc:"有人提议把港口改名作玉衡港，被刻晴否了。她说：人民记不记得我，不该由一块牌子上写着什么决定。后来那块牌子还是立了起来，只是上面刻的是一句她自己写的：此地属众人。"
 KQP_PW_Liyue_Reborn:"璃月新生"
 KQP_PW_Liyue_Reborn_desc:"璃月新生。当最后一片废墟被清理干净，刻晴一个人走遍了全城。她走到码头，走到学堂，走到那座没有神位的大厅，把一路看见的都记了下来。她在册子末端写：这就是我们换来的东西，谈不上好，也谈不上坏，只是终于由我们自己负责了。"
 KQP_PW_The_Long_Morning:"长明"
 KQP_PW_The_Long_Morning_desc:"长明灯在议事厅的门前亮了一整夜，也亮过许多个夜。刻晴渐渐老去，共和国的门却始终开着。有人问她怕不怕身后无人，她只是笑：我担心的从来是接的人忘了为什么要点这盏灯。"

 KQP_postwar_category:"共和新章"
 KQP_postwar_category_desc:"刻晴战后的复建与建政决议组。内战落定之后，委员会要把战时的手腕收起来，转而经营民生、整饬政务与重建秩序。这里的事务看似琐碎，却决定新政权能否真正立得住、走得远，也决定战时所许诺的一切能否兑现。民生一稳，新政权才算真正落了地。"
 KQP_decision_pw_public_granary:"开义仓，平米价"
 KQP_decision_pw_public_granary_desc:"粮价一涨，人心就晃。开仓平粜最亏本，却是唯一能让穷家在米价疯长的夜里睡得着的开销。共和国的第一笔支出，用在米上，没人反对。"
 KQP_decision_pw_public_works:"兴修公共工程"
 KQP_decision_pw_public_works_desc:"修路、挖渠、筑堤，能让闲下来的手有活干，也能让一座刚打完仗的城不至于闲出乱子。刻晴批钱从不问赚不赚，只问能雇多少人。"
 KQP_decision_pw_literacy_drive:"扫盲识字班"
 KQP_decision_pw_literacy_drive_desc:"读得懂字的人多了，被骗的人就少了。识字班设在最不起眼的弄堂里，教的是最实用的东西：怎么看清一份借据，怎么读懂一张告示。"
 KQP_decision_pw_peoples_court:"人民评理庭"
 KQP_decision_pw_peoples_court_desc:"让街坊自己选出人来评理，案子不大的就在弄堂里了结。刻晴说：真正的公道，不在衙门的高墙里，在两个卖菜的邻居都点头的时候。"
 KQP_decision_pw_veterans_relief:"退伍抚恤"
 KQP_decision_pw_veterans_relief_desc:"内战留下的伤，不能只记在功劳簿上。抚恤不问出身，只问还缺什么：一口锅、一副拐、一块能安身的薄地。"
 KQP_decision_pw_grain_reserve:"储粮备荒"
 KQP_decision_pw_grain_reserve_desc:"丰年存粮，荒年开仓。共和国立国之初就定下这条规矩，哪怕眼下正是紧日子。刻晴说：挨过饿的人，才懂空仓的可怕。"
 KQP_decision_pw_envoy_mondstadt:"遣使蒙德"
 KQP_decision_pw_envoy_mondstadt_desc:"蒙德的自由与璃月的共和，听上去像远亲。使者带回一份互市清单和一句客气话，刻晴却把清单看了三遍，她想知道，别人是怎么管束一座不必向神明交账的城的。"
 KQP_decision_pw_envoy_inazuma:"遣使稻妻"
 KQP_decision_pw_envoy_inazuma_desc:"稻妻的锁国旧事与璃月的封港何其相似。使者在雷雨中泊岸，谈的是两座城各自从封锁里学到的教训。"
 KQP_decision_pw_chasm_patrol:"巨渊巡边"
 KQP_decision_pw_chasm_patrol_desc:"巨渊是一笔按月要还的债。巡边的队伍带着新铸的工具下沉，升降梯的绳索，一根根都换成了双股。"
 KQP_decision_pw_universal_school:"设全民学堂"
 KQP_decision_pw_universal_school_desc:"学堂的学费按户产分等，最穷的免费，最富的多交。有人说这是劫富济贫，刻晴答：一个识字的人多了的城，谁都占便宜。"
 KQP_decision_pw_newspaper:"开办《黎明报》"
 KQP_decision_pw_newspaper_desc:"共和国的第一份报纸不登号令，只登账目与议会的发言记录。刻晴说：让百姓看惯文字上的争论，日后才不会被两三句口号哄走。"
 KQP_decision_pw_proclaim_republic:"颁行共和宪章"
 KQP_decision_pw_proclaim_republic_desc:"宪章写得极长，第一条只有七个字：权出于民，还于民。刻晴没有宣读全文，只让人抄了许多份，发到每个里坊，让愿意的人自己念。"

 LYY_Event.8001.t:"共和国之晨"
 LYY_Event.8001.d:"内战结束的第二天，刻晴站在港口的废墟上。她没有下令清扫，只让所有人先看清楚这些东西是怎么塌的。\n她说：共和是从今天起，每一块砖都要有人认领。这句话成了新政府的第一份公文，也成了往后许多年，人们反复引用的一句话。"
 LYY_Event.8001.a:"从今天起，每一块砖都有人认领"
 LYY_Event.8001.b:"先把废墟立成碑，记住代价"
 LYY_Event.8002.t:"清墟第一锹"
 LYY_Event.8002.d:"清墟的活计没人愿干，刻晴第一个拿起铁锹。她把断墙搬开，让出一条能让板车通过的路，然后让人把这条路的走向记下来。\n她说：以后修城，照这条路修，别绕开我们踩过的这些坑。跟着拾瓦砾的老兵越来越多，谁也没说话，可铁锹碰石头的声音，比什么口号都齐。"
 LYY_Event.8002.a:"铺路照众人踩出的走向"
 LYY_Event.8002.b:"全城推倒重来，另起新图"
 LYY_Event.8003.t:"里坊之争"
 LYY_Event.8003.d:"里坊重划，旧邻分在一处，不许有钱人多占半寸。有人托关系来求情，被当场驳回。\n来求情的人悻悻地问：那我们从前置下的宅子算什么？刻晴答：你们从前的宅子是买来的；今天的地，是分出来的。这两笔账，不能混在一起算。"
 LYY_Event.8003.a:"地按人头分，旧契作废"
 LYY_Event.8003.b:"承认旧契，只调整超额"
 LYY_Event.8004.t:"早市那碗面"
 LYY_Event.8004.d:"复市那天，刻晴去了早市，买了一碗最便宜的面，端着站在路中间吃完。\n她对摊主说：价钱你定，谁来查你都别怕，查出问题我顶着。摊主愣了半晌，转身把压了一整个内战的招牌重新挂了上去。那天开张的摊子，比预想的多了一倍。"
 LYY_Event.8004.a:"市价由摊主自定"
 LYY_Event.8004.b:"限价稳市，先保民生"
 LYY_Event.8005.t:"还田令下"
 LYY_Event.8005.d:"还田的告示写得很笨：谁种的地归谁，旧契一律作废，有异议到衙门去说。\n有老农不信，抱着旧契在田埂上坐了一天。第二天天亮，他看见公人把界桩重新打了一遍，才把契纸撕了。碎纸落进土里的时候，他弯下腰，把第一捧新土攥在了手心。"
 LYY_Event.8005.a:"还田于耕者，重打界桩"
 LYY_Event.8005.b:"田归公仓，按劳分配"
 LYY_Event.8006.t:"义仓的钥匙"
 LYY_Event.8006.d:"义仓的钥匙分给了十个人，缺一个到不了场就打不开门。有人劝刻晴把钥匙收回来。\n她说：仓里的粮是大家凑的，锁就该大家来开。一个人开得开的仓，早晚会变成一个饿得死人的仓。十把钥匙里有一把，后来被锁进了镇上最老的那间私塾。"
 LYY_Event.8006.a:"钥匙分十户共管"
 LYY_Event.8006.b:"收回钥匙，由官总揽"
 LYY_Event.8007.t:"清册上的名字"
 LYY_Event.8007.d:"生民清册从头到尾只用一种格式，不以贫富，不以亲疏。有官吏抱怨查得太细。\n刻晴把册子举起来给他看：这上面每一个人，从前都只是一个数字；从今天起，他们至少各自占着一行。官吏低着头接回册子，那天的字，写得比往日工整了许多。"
 LYY_Event.8007.a:"一人一行，务求详尽"
 LYY_Event.8007.b:"只登丁口，不问家产"
 LYY_Event.8008.t:"学堂开门"
 LYY_Event.8008.d:"学堂门口没有石狮，只有一块写着开课钟点的木板。第一批学生里有挑夫、船工和卖鱼的孩子。\n刻晴亲自讲过一堂课，讲的是怎么看清一份契约里的陷阱。她说：读得懂字的人多了，骗人的话就少了。散课时，有个孩子把这句话抄在了自己的手背上。"
 LYY_Event.8008.a:"学堂广开，不问出身"
 LYY_Event.8008.b:"只收聪敏者，免耗钱粮"
 LYY_Event.8009.t:"第一笔放贷"
 LYY_Event.8009.d:"人民银行的第一笔放贷，给了一家快塌的铁匠铺。掌柜不敢接，说怕还不上。\n办事的人只说：利息从你出第一炉好铁那天算起。三个月后，那把新打的刀在集市上卖了个好价钱。铁匠提着一壶酒去还利息，被告知日子还没到，他就在门口坐了一下午。"
 LYY_Event.8009.a:"低利放贷，先扶小户"
 LYY_Event.8009.b:"只贷大户，稳保回收"
 LYY_Event.8010.t:"矿车出山"
 LYY_Event.8010.d:"铁轨从港口一直铺进层岩的矿口，第一条枕木是刻晴亲手放的。\n她说：从前运一车矿要死两个人，今天开始，死的是石头，不是人。有人笑她痴，直到第一列满载的矿车轰隆隆地驶出山口。车轮碾过铁轨的声音，惊起了满山的飞鸟。"
 LYY_Event.8010.a:"铁轨直铺巨渊"
 LYY_Event.8010.b:"暂缓工事，先固边防"
 LYY_Event.8011.t:"工坊的新规矩"
 LYY_Event.8011.d:"工坊自治，让最懂机器的人管机器。刻晴撤掉了大半监工的位子，只留下记账的人。\n有老人担忧无人约束，她答：把炉温交给掌炉的，把账本交给全坊的，剩下的事他们自己会商量。头一个月，产量降了；第二个月，废品少了一半。"
 LYY_Event.8011.a:"工坊自治，掌炉者管事"
 LYY_Event.8011.b:"设监工总领，严加督察"
 LYY_Event.8012.t:"茶马道"
 LYY_Event.8012.d:"新茶马道绕开了几处旧日的关卡，直通内陆的商埠。修路的骡马队里，一半是从前的驿卒。\n刻晴对他们说：路修好了，你们的饭碗也还在，只是从今往后，管路的是路过的人自己。通车那天，没有一个官员到场剪彩，路上却挤满了来看热闹的人。"
 LYY_Event.8012.a:"卡由行路之人自管"
 LYY_Event.8012.b:"关卡仍归官府征课"
 LYY_Event.8013.t:"图纸与神迹"
 LYY_Event.8013.d:"璃月第一所工学堂开学，讲机关、水文、冶金，也讲怎么算一笔工程该不该做。\n刻晴在开学那天说：我们从前靠一位神明凿山引水，如今得自己学会看图纸。这是把别人的手，换成了自己的。台下有位老先生默默站起来，朝着讲台行了一礼。"
 LYY_Event.8013.a:"设工学堂，自绘图纸"
 LYY_Event.8013.b:"重金礼聘外邦匠师"
 LYY_Event.8014.t:"破冰的使节"
 LYY_Event.8014.d:"内战期间璃月几乎从提瓦特地图上消失。刻晴派出的第一批使节，带的是一叠账册和一句口信。\n她说：璃月可以重新做买卖，但规矩得先说清楚。有人笑这姿态太硬，她却说：先亮账本的人，才谈得上信用。使节出海那天，码头上没有送行的人群，只有一盏亮着的灯塔。"
 LYY_Event.8014.a:"先亮账本，再谈买卖"
 LYY_Event.8014.b:"厚礼开道，先结善缘"
 LYY_Event.8015.t:"风车与酒"
 LYY_Event.8015.d:"蒙德的使节带来了风车与酒。刻晴对这位自由之邦的客人说：你们不用神明管，我们刚学会也不用。\n两边都笑了，随后签下的第一份文件，是一张税率互认的清单。临别时，蒙德的客人留下一句话：不靠神明的人，也要学会不靠别人。"
 LYY_Event.8015.a:"签互市清单，平等往来"
 LYY_Event.8015.b:"缔结攻守，共御外敌"
 LYY_Event.8016.t:"雷雨中的泊位"
 LYY_Event.8016.d:"稻妻的封锁让航路断过许多年，使者到来时海上还留着旧怨。\n刻晴没有绕开这段往事，只说：锁国锁住的，从来是锁门的人自己。雷雨之下，两国的商船第一次被允许并肩停靠。有老水手趴在船舷上看了很久，说这是他有生之年见过最好看的一场雨。"
 LYY_Event.8016.a:"并肩停靠，共守航路"
 LYY_Event.8016.b:"划界而治，各不相扰"
 LYY_Event.8017.t:"成箱的书"
 LYY_Event.8017.d:"须弥的学者带来了成箱的图纸与典籍。刻晴让人腾出半座学堂安置这些书，却在扉页上统一盖了印：知识归众人。\n有学者不悦，她答：你们教给璃月的，不该只教给璃月的官。那位学者沉默良久，最后自己也在扉页上，补盖了同样的一枚印。"
 LYY_Event.8017.a:"典籍归众人，公开誊抄"
 LYY_Event.8017.b:"典籍入官库，择人传授"
 LYY_Event.8018.t:"法典之夜"
 LYY_Event.8018.d:"枫丹的使者在谈判桌上摆出了一整部法典。刻晴读了一夜，第二天带着自家人写的章程赴会，逐条比对。\n她说：法不嫌多，只怕只许一个人念。两国最终交换了判词范本，谁也没吃亏。散会时，枫丹的使者评价说：璃月人算账，比我们想象的更硬。"
 LYY_Event.8018.a:"互换判词，互鉴其法"
 LYY_Event.8018.b:"自定家法，不采外例"
 LYY_Event.8019.t:"寒冬的合约"
 LYY_Event.8019.d:"北国来的合约写得漂亮，条款却处处留着后手。刻晴读过三遍，只批了一句：合作可以，抵押不行。\n使者脸色一沉，追问代价，她答：我算过，比你们算得清楚。散会后，她命人把合约锁进了最厚的那个柜子。柜门上，后来又贴了一张纸条：勿轻启。"
 LYY_Event.8019.a:"合作可以，抵押不行"
 LYY_Event.8019.b:"签下合约，换取重建"
 LYY_Event.8020.t:"通行公约"
 LYY_Event.8020.d:"提瓦特通行公约谈成那天，与会各方各让一步。刻晴在末尾添了一句：此约之内，众生平等，不分神眷。\n有人不服，却也没人敢当众划掉。这张纸后来被拓下来，挂在了许多港口的会馆里。有孩子指着那行小字问大人是什么意思，大人想了想，说：就是不看出身。"
 LYY_Event.8020.a:"加入公约，众生平等"
 LYY_Event.8020.b:"暂不署名，静观其变"
 LYY_Event.8021.t:"并排的三张空椅"
 LYY_Event.8021.d:"帝君的神位空了，商会的座位也空了，连天空岛都不发一言。刻晴把三张空椅子并排摆着。\n她对议会的众人说：从前我们做每件事，都要先看别人的脸色；今天这几把椅子空着，正好让我们看清楚，自己坐得正不正。此后每逢大事，议事厅里都留着这三把椅子，谁也不去坐。"
 LYY_Event.8021.a:"三椅空置，自省其位"
 LYY_Event.8021.b:"请人入座，另立共主"
 LYY_Event.8022.t:"问天册"
 LYY_Event.8022.d:"刻晴让人把历年来所有的神谕、天象、谶纬整理成册，逐条标注真假。\n整理的官吏越查越心惊，她却在册尾写道：我们是在给后人留一本能自己判断的书。这本册子后来被放在了学堂最显眼的书架上，翻得比任何典籍都旧。"
 LYY_Event.8022.a:"整理神谕，留册后人"
 LYY_Event.8022.b:"焚毁旧典，重立新说"
 LYY_Event.8023.t:"封渊之人"
 LYY_Event.8023.d:"巨渊的裂缝又被封了一遍，这一次用的是新铸的合金与新的加固法。刻晴亲自下到井口，看着最后一段闸门落下。\n她说：深渊是一笔按月要还的债。今天多还一分，明天的人就少赌一次命。井口的工人听见这句话，一起直起腰，朝着落下的闸门，站了很久。"
 LYY_Event.8023.a:"铸新闸，亲下井口"
 LYY_Event.8023.b:"循旧法，勉力维持"
 LYY_Event.8024.t:"门楣上的字"
 LYY_Event.8024.d:"关于神之眼、仙人、天命的争论在议会里吵了数月。刻晴最后只说了一句话。\n她说：璃月往后由谁说了算，不再由谁的位子高，而由谁的道理站得住。这句话被刻上了议事厅的门楣，字不算好看，却没有一个人提议换掉。有老人每天进门都要抬头看一遍，像在看一块新立的碑。"
 LYY_Event.8024.a:"刻字门楣，道理为先"
 LYY_Event.8024.b:"不刻一字，行胜于言"
 LYY_Event.8025.t:"无神之邦的账"
 LYY_Event.8025.d:"无神之邦的国号正式写下时，有人落泪，有人默然。刻晴没有解释这是勇气还是狂妄。\n她只把一份写得极细的公粮账单发到每一户百姓手里。她说：神明给过的安稳，往后我们自己给；给不起的时候，就明明白白告诉大家给不起。这份账单，后来成了一项常例。"
 LYY_Event.8025.a:"自给自足，明发公账"
 LYY_Event.8025.b:"暂借神力，徐图自立"
 LYY_Event.8026.t:"云上的回执"
 LYY_Event.8026.d:"通往天空岛的路始终无人应答。刻晴还是派出了使节，带去的是一封问话。\n信上写着：若天理仍在，请现身谈一谈；若不在，请容许我们自己走路。使节归来时两手空空，她却在回执上批了两个字：已知。然后她把那卷空白的回函，收进了共和国的档案库第一格。"
 LYY_Event.8026.a:"遣使问天，如实回报"
 LYY_Event.8026.b:"不问不答，各行其是"
 LYY_Event.8027.t:"碑上的名字"
 LYY_Event.8027.d:"层岩的井下牺牲者名录又添了一页。刻晴下令为每一个名字立碑，无论他生前属于哪一方。\n她说：我们和深渊的账，不能只算赢的那一半；被埋在里面的人，也该有人替他们记账。碑立起来那天，来了许多人，有赢的，有输的，也有谁都不认的。他们站在碑前，谁也没有先走。"
 LYY_Event.8027.a:"为亡者立碑，不问敌我"
 LYY_Event.8027.b:"只记己方牺牲，简明从之"
 LYY_Event.8028.t:"换了旗的军队"
 LYY_Event.8028.d:"新军改叫人民军，军饷照旧，军旗换了。刻晴在检阅时说：这支队伍从前的规矩是不退，如今的规矩是知道自己在护着谁。\n队伍里安静了很久，随后响起的口号，与从前不太一样。有个年轻的士兵喊完，偷偷抹了一下眼睛，被身边的战友用肘子轻轻撞了一下。"
 LYY_Event.8028.a:"改旗易号，叫人民军"
 LYY_Event.8028.b:"军制照旧，只换将校"
 LYY_Event.8029.t:"关墙上留的门"
 LYY_Event.8029.d:"山口的关隘一处处重修，图纸上多了一道从前没有的要求：关墙上需要留出能通过逃难百姓的门。\n有将领不解，刻晴答：关隘挡的是兵，别把人也一起关在外面。那道门后来被叫作小民门，每逢战事，总是最先打开的那一道。"
 LYY_Event.8029.a:"关墙留门，通民有路"
 LYY_Event.8029.b:"关墙求固，不留隙口"
 LYY_Event.8030.t:"懂山的戍卒"
 LYY_Event.8030.d:"南疆的戍卫队招了当地的山民与猎户。刻晴给他们的第一条命令是认路：哪一条道能走骡马，哪一处崖能藏人。\n她说：守土的人，先得是懂这片土的人。半年之后，这支队伍自己绘出了一张比官图还细的山川图，连哪条溪在旱季会断都有标注。"
 LYY_Event.8030.a:"就地募人，先用懂山的"
 LYY_Event.8030.b:"调他处精锐，从严整训"
 LYY_Event.8031.t:"抬高一寸"
 LYY_Event.8031.d:"民兵的训练课目里加了一条：先学会怎么不误伤自己人。有新兵不解，老兵就把他的枪口轻轻抬起来一点。\n刻晴说：上过战场的人才知道，最难的是枪口抬高一寸。这句话后来被写进了操典的第一页，字迹底下，是被人摩挲出来的浅浅痕迹。"
 LYY_Event.8031.a:"操典首条，慎伤己人"
 LYY_Event.8031.b:"以杀敌为先，不拘细目"
 LYY_Event.8032.t:"黑暗里的天光"
 LYY_Event.8032.d:"巨渊的戍卒轮换期缩短了一半，待遇却抬高了。有账房说这笔开销不值。\n刻晴的理由很简单：在井下熬人的人，不能让他在黑暗里待太久。她要的是一支还记得天光长什么样的军队。后来轮换的名单贴在井下，总有人反复看，然后默默把下一班的名字记下来。"
 LYY_Event.8032.a:"缩短轮换，厚待戍卒"
 LYY_Event.8032.b:"延长戍期，节省粮饷"
 LYY_Event.8033.t:"认领的兵器"
 LYY_Event.8033.d:"兵工厂迁进了山坳，产量翻了一倍，附近的村子也跟着富了些。刻晴定下一条规矩：厂里造的每一件东西，都要标上工匠的名字。\n她说：有人认领的兵器，才不会随便杀人。第一条被标上名字的枪，挂在厂门口展示了很久，那个工匠每天路过，都要停下来看一眼。"
 LYY_Event.8033.a:"兵器皆刻工匠之名"
 LYY_Event.8033.b:"兵器只标官厂之号"
 LYY_Event.8034.t:"开三日的大门"
 LYY_Event.8034.d:"共和已经立住，接下来往哪走，却没人说得清。刻晴把议事厅的门敞开三日，谁都能进来讲。\n三日之后，纸张堆了半人高，争论也没停。她看着这堆纸说：吵不完最好，吵完了，才是真没人敢说话了。那三天，议事厅的灯一直亮到天明。"
 LYY_Event.8034.a:"开三日门，尽听其言"
 LYY_Event.8034.b:"择人而听，速定大计"
 LYY_Event.8035.t:"第一个手印"
 LYY_Event.8035.d:"人民大会的方案是把权力层层分下去，让每个里坊、每个行业都有人替自己说话。\n反对者说这太散，刻晴答：散一点，总比断在一根绳上强。她按下第一个手印，纸角上留了一道浅浅的褶。那道褶子后来被妥善地压平收藏，成了共和国档案里的第一件实物。"
 LYY_Event.8035.a:"立人民大会，分权于下"
 LYY_Event.8035.b:"总揽权柄，另设枢要"
 LYY_Event.8036.t:"卖菜妇人的发问"
 LYY_Event.8036.d:"自由议席不设门槛，只要有人推举，谁都能坐进来。第一场会上，一个卖菜的妇人当众质问了一位旧日的大吏。\n满堂鸦雀无声。刻晴坐在最后一排，没有出声，散会后却把那天的记录抄了一份留底。有幕僚问她为何不表态，她说：我今天要是开了口，往后他们说话，就都要先看看我在不在。"
 LYY_Event.8036.a:"议席无门槛，人人可入"
 LYY_Event.8036.b:"限定资格，取有识者"
 LYY_Event.8037.t:"门上的木牌"
 LYY_Event.8037.d:"诸子重新立起门户，学堂、书院、讲坛遍地开花。刻晴不设官学正统。\n她只在每所讲坛的门上钉了一块相同的木牌：说得对，就听；说不通，就散。她说：一个怕争论的政权，早就没什么可争的了。有讲坛的先生把这块木牌拓下来，收进了自己的书箱。"
 LYY_Event.8037.a:"诸子立门，不禁异说"
 LYY_Event.8037.b:"定于一尊，罢黜杂议"
 LYY_Event.8038.t:"议事厅的墙上"
 LYY_Event.8038.d:"劳工宪章把工时、工价、伤病、学徒写成了明文。有老商号联名反对，刻晴只请他们去码头看了一个下午。\n回来的人没再说话。她把宪章连同那份联名反对书，一起挂进了议事厅。有人问她为何不烧掉反对书，她说：留着，好让后来的人知道，今天这点便宜，是费了多大力气才争来的。"
 LYY_Event.8038.a:"颁劳工宪章，昭告全城"
 LYY_Event.8038.b:"压其诉求，安抚商号"
 LYY_Event.8039.t:"远航的章程"
 LYY_Event.8039.d:"璃月的船队开始驶向更远的海港，带去的不只是货物，还有一整套办事的章程。\n刻晴说：我们不做主，只做示范。有人担心树敌，她答：怕树敌的，从来不是我们这种人。船队离港那天，没有军乐，只有一片升帆的声音，像有人在把一整面墙慢慢拉开。"
 LYY_Event.8039.a:"以章程示范，不据人之上"
 LYY_Event.8039.b:"船队随行护卫，宣威于外"
 LYY_Event.8040.t:"桌边的圈"
 LYY_Event.8040.d:"提瓦特联合的构想被摆上了台面，反对与赞同各占一半。刻晴没有强推。\n她只把各国使节请到同一张长桌前，让他们自己谈。散会时，桌边多了一圈不知是谁画的圈，套住了所有椅子。清洁的人要把它擦掉，被制止了；那个圈，就在桌面上留了很多年。"
 LYY_Event.8040.a:"邀众同席，共议联合"
 LYY_Event.8040.b:"独力经营，不结外援"
 LYY_Event.8041.t:"不喜欢的自由"
 LYY_Event.8041.d:"自由之帜第一次挂上了璃月的船桅。有人在旗下欢呼，也有人沉默。\n刻晴对沉默的人说：你们可以不喜欢这面旗，但只要喜欢这个能让你们不喜欢的人，就不会被为难，它就没白挂。有个老兵听完，把帽檐压低了些，没有欢呼，也没有走开。"
 LYY_Event.8041.a:"小民门常开，先放百姓"
 LYY_Event.8041.b:"军令第一，迟则误机"
 LYY_Event.8042.t:"万世二字"
 LYY_Event.8042.d:"万世共和四个字刻上城门那天，刻晴在门前站了很久。\n她没有讲应许，只对身边人说：我这一生也许只做了一件事，就是让往后的人，不必再靠一个人才能活下去。说完，她转身走进了那个没有神位的大厅。门在身后合上，声音很轻。"
 LYY_Event.8042.a:"万世共和，功归众人"
 LYY_Event.8042.b:"永铭一人，以镇四方"
 LYY_Event.8043.t:"先锋的笔"
 LYY_Event.8043.d:"先锋委员会把决断的权利收拢到少数人手里，理由是战时不能散。刻晴提笔签下时，笔尖顿了一下。\n她对身边人说：我知道这有多危险；我只希望，我们收得回来。那份签署的文件收进档案时，管档案的人发现，纸上有两处极淡的墨点，像是有人犹豫过两次。"
 LYY_Event.8043.a:"签字并留退路"
 LYY_Event.8043.b:"尽收权柄，不留余地"
 LYY_Event.8044.t:"手册第一页"
 LYY_Event.8044.d:"钢铁纪律之下，赏罚分明到近乎无情。有人求情，有人喊冤，刻晴一概不听。\n她说：我怕的是有一天没人再敢对我说真话。这句话，她记在了随身的手册第一页。多年以后有人翻阅这本手册，发现第一页的纸角，比别处磨得更旧。"
 LYY_Event.8044.a:"厚待老兵，为其立碑"
 LYY_Event.8044.b:"封赏其功，编入新军"
 LYY_Event.8045.t:"最安静的城"
 LYY_Event.8045.d:"止疑令颁下，原本喧闹的议会安静了许多。刻晴走过长廊时，听见有人压低声音议论，却没有一个人抬头。\n她忽然想起自己年少时读过的那些书，书里说，最安静的城，往往最危险。她在那条长廊上站了很久，直到最后一点说话的声音，也消失在门后。"
 LYY_Event.8045.a:"令行禁止，缄口自守"
 LYY_Event.8045.b:"广开言路，容其异声"
 LYY_Event.8046.t:"墙上的剑"
 LYY_Event.8046.d:"共和之剑挂在了议事厅的墙上，无人佩戴。刻晴每隔几日便会擦拭一次。\n她说：这把剑最好永远不出鞘；可它若真的锈了，那才是我们最该怕的事。有年轻的书吏曾私下问，为什么不干脆取下来收进库里；老书吏摇了摇头，只说，挂着，大家心里就有数。"
 LYY_Event.8046.a:"剑悬不落，以之为威慑"
 LYY_Event.8046.b:"取下入库，藏锋不用"
 LYY_Event.8047.t:"北上的军令"
 LYY_Event.8047.d:"北上的军令下达时，刻晴看着地图上那条通往至冬的线，沉默了一夜。\n第二天，她只在令尾添了四个字：勿伤百姓。送出军令的手，比送出任何一份文件时都要慢。那四个字后来被传抄开来，成了军中一条不成文的老规矩。"
 LYY_Event.8047.a:"勿伤百姓，抚民为先"
 LYY_Event.8047.b:"速战速决，勿恤小节"
 LYY_Event.8048.t:"铁与齿轮"
 LYY_Event.8048.d:"铁血公社把整座城市变成了一台机器，每个人都是齿轮。产量上去了，笑声少了。\n刻晴站在厂区的高台上，看着下面蚂蚁般的人群，第一次分不清，自己是在建一个国家，还是在造一件兵器。风把高台的旗吹得猎猎作响，她伸手按住旗杆，却没有再松开。"
 LYY_Event.8048.a:"上产量，先顾效率"
 LYY_Event.8048.b:"恤工匠，缓其劳作"
 LYY_Event.8049.t:"徽记的最后一笔"
 LYY_Event.8049.d:"炬与刃成了共和国的徽记，一明一暗，一进一守。刻晴亲手设计了这枚徽章。\n她在最后一笔上停了很久，对画工说：把炬画矮一点，刃画长一点，我总觉得，我们握着的东西，比举着的东西更沉。这枚徽记后来印在了每一份公文上，也印在了很多人的记忆里。"
 LYY_Event.8049.a:"徽记不改，从此为国号"
 LYY_Event.8049.b:"重绘一枚，另立新意"
 LYY_Event.8050.t:"赤色城塞"
 LYY_Event.8050.d:"赤色城塞落成那天，全城戒严。刻晴独自登上城头，看着脚下这座用纪律与恐惧垒起来的城。\n风从海上吹来，她想起了内战开始的那个夜晚，想起了自己说过的要让每个人都能站起来的那句话，忽然很想哭，却没有哭。她只是把手按在冰冷的城墙上，站了很久很久。"
 LYY_Event.8050.a:"政令先于万物"
 LYY_Event.8050.b:"让城中人先说话"
 LYY_Event.8051.t:"刻着名字的铁牌"
 LYY_Event.8051.d:"内战的老兵被请到港口，每人发了一枚刻着名字的铁牌。刻晴没有致辞，只挨个与他们握手。\n有一个断了手的老人问她：我们打的这场仗，到底值不值？她想了很久，答：我不知道。但我知道，这句话你问得出口，就是值了。老人握了握那块小铁牌，把它揣进了胸口的衣袋里。"
 LYY_Event.8051.a:"立铁牌，长记此役"
 LYY_Event.8051.b:"厚赏将士，以功代名"
 LYY_Event.8052.t:"此地属众人"
 LYY_Event.8052.d:"有人提议把港口改名作玉衡港，被刻晴否了。\n她说：人民记不记得我，不该由一块牌子上写着什么决定。后来那块牌子还是立了起来，只是上面刻的是一句她自己写的：此地属众人。立碑那天没有仪式，只有几个孩子在碑前的空地上，用石子画了个跳房子的格子。"
 LYY_Event.8052.a:"此地属众人"
 LYY_Event.8052.b:"名以御衡，彰其功"
 LYY_Event.8053.t:"璃月新生"
 LYY_Event.8053.d:"璃月新生。当最后一片废墟被清理干净，刻晴一个人走遍了全城。\n她走到码头，走到学堂，走到那座没有神位的大厅，把一路看见的都记了下来。她在册子末端写：这就是我们换来的东西，谈不上好，也谈不上坏，只是终于由我们自己负责了。写完这些字，天已经黑了，城里的灯却一盏盏亮了起来。"
 LYY_Event.8053.a:"就此向前，记下这一切"
 LYY_Event.8053.b:"停下脚步，清算所有"
 LYY_Event.8054.t:"长明的灯"
 LYY_Event.8054.d:"长明灯在议事厅的门前亮了一整夜，也亮过许多个夜。刻晴渐渐老去，共和国的门却始终开着。\n有人问她怕不怕身后无人，她只是笑：我担心的从来是接的人忘了为什么要点这盏灯。后来这盏灯成了一项不成文的制度，换人看守，却不许熄。"
 LYY_Event.8054.a:"门不必关，灯不许熄"
 LYY_Event.8054.b:"严立门户，重设禁卫"
 LYY_Event.8055.t:"最后一片废墟"
 LYY_Event.8055.d:"璃月新生的旗升上了所有城头，也升上了那些曾经属于别的旗的地方。\n刻晴在内战结束的旧址上立了一块无字碑。有人问她为何不刻功绩，她说：刻满了，后人就没地方写了。碑立在那里许多年，风吹日晒，始终空着，却也始终有人前来，站一会儿再走。"
 LYY_Event.8055.a:"刻无字碑，留给后人"
 LYY_Event.8055.b:"勒石记功，昭示千秋"
 LYY_Event.8056.t:"宪章颁布"
 LYY_Event.8056.d:"共和宪章颁行那天，刻晴把全文念到了最后一句。底下的议员里有老人，有年轻人，也有一些从内战里活下来、至今还带着伤的。\n她念完后停了停，说：从今天起，我也是一个可以被换下来的人。台下先是一静，随即响起的掌声里，有一种很陌生的东西，那是一种终于可以放心了的松弛。"
 LYY_Event.8056.a:"权出于民，还于民"
 LYY_Event.8056.b:"权柄暂握，待时还政"

 KQP_Spirit_First_Republic:"共和国之晨"
 KQP_Spirit_First_Republic_desc:"共和国的第一个清晨没有钟声，只有扫帚扫过碎石的声音。一个不再向神交账的政权，头一件事是学会向自己的百姓交代每一笔开销。"
 KQP_Spirit_Open_Markets:"开市之信"
 KQP_Spirit_Open_Markets_desc:"把定价的权利交回给买卖的人，市场会自己长出规矩，也会自己长出骗子。共和国赌的是前者，押上的是自己的信誉。"
 KQP_Spirit_Chasm_Rail:"层岩铁脉"
 KQP_Spirit_Chasm_Rail_desc:"铁轨铺进巨渊，运出来的是矿，运进去的是粮。一条铁脉，把曾经只会埋人的地方，变成了养活人的地方。"
 KQP_Spirit_Engineer_State:"工匠之国"
 KQP_Spirit_Engineer_State_desc:"图纸比神谕更可靠，因为图纸错了，会塌，会有人负责。璃月开始学着把命运画在纸上，再一条线一条线地造出来。"
 KQP_Spirit_Teyvat_Convention:"通行公约"
 KQP_Spirit_Teyvat_Convention_desc:"一张让众生平等的公约，写满了琐碎的字句。它管不了神，却至少能让挂不同旗的船，在同一片海上守同一条规矩。"
 KQP_Spirit_Abyss_Ward:"封渊之约"
 KQP_Spirit_Abyss_Ward_desc:"深渊是一笔按月要还的旧债。共和国每年从账上划走的那一笔，买的是井下人活到明天的机会。"
 KQP_Spirit_Mortal_Rule:"凡人自决"
 KQP_Spirit_Mortal_Rule_desc:"不再由谁的位子高说了算，而由谁的道理站得住。这七个字刻在门楣上，比任何神谕都更让旧贵人心惊。"
 KQP_Spirit_People_Army:"人民军"
 KQP_Spirit_People_Army_desc:"这支队伍从前的规矩是不退，如今的规矩是知道自己在护着谁。一句口号的改动，用去了一整代人的代价。"
 KQP_Spirit_Liyue_Arsenal:"璃月兵工"
 KQP_Spirit_Liyue_Arsenal_desc:"每一件出厂的兵器都刻着工匠的名字。有人认领的东西，才不会随便杀人；有人署名的手艺，也才不会随便马虎。"
 KQP_Spirit_Labor_Charter:"劳工宪章"
 KQP_Spirit_Labor_Charter_desc:"工时、工价、伤病、学徒，一款一条写进明文。它是一个国家终于承认：造东西的手，和管账的手，一样金贵。"
 KQP_Spirit_Iron_Commune:"铁血公社"
 KQP_Spirit_Iron_Commune_desc:"整座城变成一台机器，产量上去了，笑声少了。效率的账面上，从来没有一栏叫人心。"
 KQP_Spirit_Eternal_Republic_Charter:"共和宪章"
 KQP_Spirit_Eternal_Republic_Charter_desc:"第一条只有七个字：权出于民，还于民。写下它的人知道，自己也在这七个字管着的范围之内。"

 KQP_Renew_Tier_1:"共和之基等级"
 KQP_Renew_Tier_1_desc:"根基未稳，屋漏偏逢连夜雨，人心还没从战火里回过神。新政的每一句话，都要重复好几遍，才有人肯信。"
 KQP_Renew_Tier_2:"共和之基等级"
 KQP_Renew_Tier_2_desc:"初有起色，市面渐渐有了声响，缺的仍旧是粮与人。共和国像一个刚学会走路的孩子，摇摇晃晃，却不肯坐下。"
 KQP_Renew_Tier_3:"共和之基等级"
 KQP_Renew_Tier_3_desc:"渐入正轨，田里有稻，城里有灯，账面上头一回出现了像样的盈余。人们开始把新的规矩当成理所当然。"
 KQP_Renew_Tier_4:"共和之基等级"
 KQP_Renew_Tier_4_desc:"百废俱兴，工坊彻夜轰鸣，船队进出不绝。繁荣像潮水一样涌来，也在悄悄冲刷着共和国最初的边界。"
 KQP_Renew_Tier_5:"共和之基等级"
 KQP_Renew_Tier_5_desc:"四海咸服，仓廪实，人心齐，旧日的仇家也来递帖子。刻晴却在最热闹的时候提醒众人：粮满则思变，屋固则忘危。"
 KQP_World_Tier_1:"寰宇之望等级"
 KQP_World_Tier_1_desc:"孤悬海外，诸国观望，商路断绝，邮袋里除了自家的公文，再没有别的东西。"
 KQP_World_Tier_2:"寰宇之望等级"
 KQP_World_Tier_2_desc:"初通音问，有几家使节上了门，谈的多半还是试探。互相递茶，谁也不肯先交底。"
 KQP_World_Tier_3:"寰宇之望等级"
 KQP_World_Tier_3_desc:"商路重开，挂璃月旗的船又出现在了远方的港口。别人开始记得，这片海上还有这么一座城。"
 KQP_World_Tier_4:"寰宇之望等级"
 KQP_World_Tier_4_desc:"执其一端，璃月成了这一带绕不开的一方。合约要它签，争端要它裁，风头之下，也藏着看不见的算计。"
 KQP_World_Tier_5:"寰宇之望等级"
 KQP_World_Tier_5_desc:"重执牛耳，璃月重新站回了提瓦特的牌桌中央。刻晴却在最风光时提醒使团：站得越高，风越冷，越要记得把账算清楚。"
 KQP_PWCombo_Both_High:"星火燎原"
 KQP_PWCombo_Both_High_desc:"仓廪实，四方服。璃月的旗第一次被人主动迎进别国的港口，而刻晴比谁都清楚，被人靠着，比被人怕着更容易散架。"
 KQP_PWCombo_Both_Low:"两头落空"
 KQP_PWCombo_Both_Low_desc:"田里还没长出粮，海上也没人应声。议会天天开会，开到最后只剩翻纸的声音。"
 KQP_PWCombo_A_High:"闭门立国"
 KQP_PWCombo_A_High_desc:"内政理得顺，关起门来谁都不欠。粮食够吃，外交邮袋却空得能听见风。"
 KQP_PWCombo_B_High:"借势而起"
 KQP_PWCombo_B_High_desc:"海外的合约一份接一份，城里的路却还没修完。名声走得比粮食快，早晚要回头补票。"

 #################### 凝光 · 天权临时政府（LYY） ####################
 LYY_CivilWar_Tianquan:"天权临政"
 LYY_CivilWar_Tianquan_desc:"帝君驾崩后的第七日，群玉阁重新升空。凝光站在浮空的回廊上，俯瞰着这座刚刚失去神明的城市。她没有宣布自己是摄政，也没有宣布自己是女王，她只是把那张写着临时政府的告示，端端正正地钉在了议事厅的门楣上。她说：璃月需要的是一本记得清、查得到、赖不掉的账。"
 LYY_Seal_the_Harbor:"封港立市"
 LYY_Seal_the_Harbor_desc:"港口是第一道防线，也是第一笔买卖。凝光下令以商船结阵封住内港，是要先把定价的权力，从混乱里夺回来。谁能在封港期拿到通行令，谁就欠了天权一个人情，这笔人情，将来要连本带利地还。"
 LYY_Call_the_Guilds:"召集百工"
 LYY_Call_the_Guilds_desc:"百工的印章在长桌上摆了整整三排：铁、木、船、染、盐、茶、丝、瓷。凝光对满堂掌事只说了一句话：从前你们向神纳税，如今该有人向你们要账了，那这个人，最好是我们自己选的。商会们面面相觑，然后一个个把印按了下去。"
 LYY_The_Provisional_Council:"临时议事厅"
 LYY_The_Provisional_Council_desc:"临时议事厅设在群玉阁的下层，桌椅俱是新打的，连油漆味都没散。凝光坚持让每个区、每个行业各占一席，哪怕他们只会吵架。她说：一个连吵架的地方都没有的政权，最后只会在别的地方动手。"
 LYY_Reclaim_the_Customs:"收还税关"
 LYY_Reclaim_the_Customs_desc:"税关的钥匙换了一串新的。凝光没有追究旧吏，只给每本税簿套上一根红绳，标明年月，从此每一笔进出都有人认账。她说：革命不必从砸烂开始，账目清楚了，很多事自然就换了主人。"
 LYY_The_Golden_Ledger:"重铸金册"
 LYY_The_Golden_Ledger_desc:"金册重铸的那一夜，群玉阁灯火通明。凝光亲手在第一页写下天权二字，又亲手把上一本旧册的结尾抄进新册。她说：一个国家的信用，不在它借了多少钱，而在它有没有胆子把欠的账一页不落地传下去。"
 LYY_Contract_Law_Restored:"契约复立"
 LYY_Contract_Law_Restored_desc:"契约法复立的第一案，是一场两家船行争码头的纠纷。凝光没有御笔亲裁，是把判词交给了三名素不相识的行首共同签署。她说：法之所以是法，是因为签字的人里，没有一个能只手遮天。"
 LYY_Currency_of_Trust:"信用通货"
 LYY_Currency_of_Trust_desc:"纸币第一次不再凭神明背书，是凭一箱箱摆在税关里的真金。有人连夜挤兑，凝光就命人当场开箱，一枚一枚地兑。挤兑的人排到黄昏，最后自己散了，他们终于相信，这张纸后面的东西，比神明更沉。"
 LYY_Merchant_Militia:"商团护港"
 LYY_Merchant_Militia_desc:"商团护卫队的旗帜上绣的是一杆秤。凝光说：钱是死的，护钱的人是活的，一个连自己的码头都不敢守的商人，不配谈自由通商。护卫队沿港列阵，商船的炮口第一次朝向了海外的方向。"
 LYY_Open_the_Markets:"开市通商"
 LYY_Open_the_Markets_desc:"市集重开的清晨，码头上的铜锣敲了三下。凝光废除了旧日名目繁多的关卡税，只留一道明面上的货税。商贩们起初不敢相信，直到第一个挑夫挑着货大大方方走出关卡、没有再被拦住，整条街的吆喝声，忽然就热了起来。"
 LYY_Census_of_Wards:"八区清册"
 LYY_Census_of_Wards_desc:"八区清册，量的是人，也是税基。吏员挨家挨户地登记，连灶台边打盹的猫都被记了一笔。有人抱怨这是管得宽，凝光却说：连有多少人、几口锅都数不清的政府，凭什么谈公平？这本册子，往后要替沉默的人说话。"
 LYY_Debt_Redemption:"旧债清偿"
 LYY_Debt_Redemption_desc:"旧债堆积如山，债主里既有士绅，也有走投无路的穷人。凝光定下一条规矩：凡利滚利超过本金三倍的，一律作废重议。她为此得罪了半个港口，却在当铺门口听见一个老妇念叨：总算有人替我们算了算，什么才是真的还不起。"
 LYY_The_Northern_Trade:"北国商路"
 LYY_The_Northern_Trade_desc:"至冬的商队自陆路入境，驮着毛皮、矿石与烈酒。凝光的账房连夜核对，怕的是这些货里夹着的别的东西。她在给商队的回函里写道：买卖我欢迎，但璃月的码头，只卸货物，不卸别国的规矩。"
 LYY_Guild_Charters:"商会特许"
 LYY_Guild_Charters_desc:"特许状一纸难求，掌事们挤破了天权商会的门槛。凝光把最高的价钱留给最古老的行业，把最新的口子留给最新的匠人，她要的从来是让每个想赚大钱的人，都得先学会守一点规矩。"
 LYY_The_Right_Question:"玉京之问"
 LYY_The_Right_Question_desc:"凝光在议事厅的正中央挂了一副对子，上联是取利于民，下联是还法于民，横批空着，谁都不知道该填什么。她看着满堂为此争论不休的议员，轻声说：这道横批，不该由我一个人来写。"
 LYY_Charter_of_Freedoms:"自由宪章"
 LYY_Charter_of_Freedoms_desc:"自由宪章的长文里，最难写的是义务。凝光删了又改，最后在第一条写上：「凡在本港经营者，无论贵贱贫富，皆同守一法。」有老士绅当场摔了茶盏，也有人默默抄了副本带走，此后每逢争论，总有人把它拿出来念。"
 LYY_An_Independent_Judiciary:"独立法司"
 LYY_An_Independent_Judiciary_desc:"法司迁出了议事厅，搬进了临街的一栋小楼。凝光亲自把民可问官四字刻上石阶，撤掉了门口象征官威的石狮。她说：法院若设在衙门里，就永远是衙门的家法；只有搬到街上，它才可能成为百姓的靠山。"
 LYY_The_Assembly_of_Wards:"八区议会"
 LYY_The_Assembly_of_Wards_desc:"八区议会第一次开会，八个区的代表用八种口音吵了整整一天。凝光坐在台下，一句话都没插。散会时有人问她为什么不主持，她笑道：我一开口，他们就会先看我的脸色。这样的议会，不开也罢。"
 LYY_Free_Port_Act:"自由港法案"
 LYY_Free_Port_Act_desc:"自由港法案通过的那天，港口的灯塔彻夜不熄。从此无论挂谁的旗，只要能守港规，都能来卸货、来补给、来换钱。有人骂凝光把璃月卖了，她只在法案末尾添了一句：一扇关上的门，最后锁住的是屋子里的人。"
 LYY_Abolish_Guild_Monopoly:"废商会垄断"
 LYY_Abolish_Guild_Monopoly_desc:"废垄断令一下，几十年的行会壁垒轰然倒塌。老掌事们聚集在商会门口抗议，举着的牌子上写着传统二字。凝光从窗前看着他们，没有生气，她只是想起，当年正是这些传统，把多少新匠人的手艺活活攥死在门内。"
 LYY_The_Tax_of_Consent:"同意之税"
 LYY_The_Tax_of_Consent_desc:"「税须经民同议」，这五个字，比任何战旗都更让旧贵人心惊。从此每一笔加税，都要在八区议会里过堂。第一个尝到这滋味的，是一位提议加征茶税的老议员；他被人当面驳得体无完肤，散会后却对凝光深深一揖，说：这才是议事厅该有的样子。"
 LYY_Schools_of_Law:"律学馆"
 LYY_Schools_of_Law_desc:"律学馆开在旧日讼师的隔壁，两扇门，一行之隔。凝光请来退役的判官、账房的先生，甚至几个服过役的讼棍来讲课。她说：让百姓懂法，是为了让他们知道，法是攥在手里能用的东西。"
 LYY_The_Citizen_Merchant:"公民商人"
 LYY_The_Citizen_Merchant_desc:"从此，一个商人的身份，不再只写在族谱和商号里，是写在一本薄薄的公民册上。他可以罢市，可以投票，也可以在议会状告官府。有位老掌事摸着那本册子喃喃道：我做了五十年生意，头一回觉得，自己不只是件会赚钱的家什。"
 LYY_Banking_Charter:"钱庄宪章"
 LYY_Banking_Charter_desc:"钱庄宪章规定了准备金、放贷与清算之法，把从前靠交情和面子撑着的生意，改成了一行行看得见的数目。老掌柜们抱怨太死板，凝光却在大户挤兑的那个夜里，靠这套章程把整座港口的银根稳了下来。她只是淡淡说了一句：规矩越硬，人心才越软得下来。"
 LYY_Treaty_of_the_Harbor:"港口公约"
 LYY_Treaty_of_the_Harbor_desc:"港口公约签下的是一份所有人都在上面签了名的通行规则：遇险互救、泊位公平、货税统一、争端共裁。有人问凝光凭什么相信别人会守约，她指着公约末尾密密麻麻的签名说：因为这一回，赖账的人，会被所有人记住。"
 LYY_The_Open_Ledger:"公账公开"
 LYY_The_Open_Ledger_desc:"公账公开的那天，码头边架起了一块巨大的告示板，一笔一笔地写清每一枚摩拉的来去。有人专门带了算盘来核，核到深夜也没找出漏洞，悻悻而去。凝光说：我敢把账摊开，是因为我怕的不是有人查，我怕的是有一天没人再愿意查。"
 LYY_Protection_of_Craft:"匠作保护"
 LYY_Protection_of_Craft_desc:"匠作保护的条文写得很琐碎：工时、学徒、工价、伤病的抚恤，一条一条，像在缝一件贴身的旧衣。凝光说，自由通商不是让强者通吃，若连最会做手艺的人都被挤压成穷光蛋，那这港口就只剩下一群倒买倒卖的贩子。"
 LYY_The_Provincial_Compacts:"诸省盟约"
 LYY_The_Provincial_Compacts_desc:"诸省盟约谈崩了三回，最后在一张揉皱的纸上谈成。八省各让一步，谁也没占全便宜。凝光在盟约上按了印，说：完美的盟约都是死人写的，活人签的，总要缺一角，缺的那一角，就留给将来去补吧。"
 LYY_Constitution_of_Jade:"玉律宪法"
 LYY_Constitution_of_Jade_desc:"玉律宪法颁下的那一刻，群玉阁的天空飘起了细雨。凝光没有宣读全文，只念了开篇第一句：「璃月之治，源于契约，归于契约。」台下寂静了很久，随后响起雷鸣般的掌声。她却在这掌声里，第一次觉得肩上的份量重得有些陌生。"
 LYY_The_Everlasting_Compact:"永续之约"
 LYY_The_Everlasting_Compact_desc:"永续之约把一年的承诺，写成了百年的约定。有人笑凝光妄想，说商人只做眼前的买卖。她却在契约末尾写了一行小字：我今日定下的规矩，未必比我活得久；但我希望，它能活得比下一个贪心的人更久。"
 LYY_Merchant_Privy:"商会枢密"
 LYY_Merchant_Privy_desc:"商会枢密，无衙无印，只在一间茶室里议事。十几个掌事围坐，一句尾音、一个眼神，就能决定半座港口的命运。凝光坐在主位，看着这些比官府更像官府的人，忽然明白：她不是打败了旧秩序，她只是把旧秩序，换上了一件更考究的外衣。"
 LYY_Closed_Ledger:"密账不宣"
 LYY_Closed_Ledger_desc:"密账不宣。从此天权商会里要紧的几笔数目，只写在两三本不对外的册子中。凝光对自己说这是非常时期的权宜，可那几本册子越积越厚，翻越翻不动，她比谁都清楚，一本不肯给人看的账，本身就是一本供状。"
 LYY_Company_Militia:"商团私兵"
 LYY_Company_Militia_desc:"商团私兵成军，旗号是各家的，号令却出自同一间茶室。士兵们拿双份饷，认两个主，忠诚被明码标价，明码到连他们自己都觉得别扭。凝光看着这支军队，想起自己曾笑刻晴的民兵是乌合之众，如今她才懂得，用钱买来的兵，比用信仰拢来的更听话，也更善变。"
 LYY_Tariff_Walls:"关税壁垒"
 LYY_Tariff_Walls_desc:"关税壁垒一道接一道地立起来，把外来的货挡在港外。港口的库房堆满了卖不出去的东西，商人们却拍手称快，因为挡在外面的，大多是别人的货。凝光没有阻拦，只在深夜独自登楼看海，望着远处被壁垒隔开的海面，久久没有说话。"
 LYY_The_Guild_Supreme:"商会至上"
 LYY_The_Guild_Supreme_desc:"商会至上的条文，把天权商会从议事的厅堂，变成了发号施令的衙门。从此律法要问商会的意思，官员要经商会的遴选。凝光在这条路上走得很稳，很从容，稳到有一天她照镜子时，忽然认不出镜中那个下令的人，是自己，还是她曾经憎恨过的那些影子。"
 LYY_Bonds_of_Power:"权债"
 LYY_Bonds_of_Power_desc:"权债，是一份以忠诚作抵押的契约。谁借了这笔钱，谁就在下一次表决时欠凝光一票。她把权力做成了账，可账最怕的从来是有一天利滚利到了谁也还不起的地步，那时，收账的和欠账的，都得跟着这座城一起沉下去。"
 LYY_The_Silver_Fist:"白银铁拳"
 LYY_The_Silver_Fist_desc:"白银铁拳落下时，是没有声音的。罢工的行首忽然发现货款被冻结，闹事的商户发现自己成了不合法的。凝光从不动刀，她只是让不听劝的人，在账面上悄悄消失。她说：青铜的拳头会留下印子，白银的拳头只会留下欠条。"
 LYY_Purchase_the_Qixing:"赎买七星"
 LYY_Purchase_the_Qixing_desc:"赎买七星，是一场几乎称得上温柔的收编。凝光用股份、用红利、用一纸终身奉养，请旧日的同僚体面地退场。有人接了，有人拒了，也有人含泪在转让书上按了印，没人流血，可七星那把椅子，从此再没坐过第二个人。"
 LYY_Monopoly_of_Jade:"玉税专营"
 LYY_Monopoly_of_Jade_desc:"玉税专营，把矿脉、铸币与盐茶一并攥进一只手里。凝光说这是为国家聚财，反对者却问：财聚到谁那里去了？她当然知道答案，可她已经离不开这套机器了，就像巨鲸离不开自己吞下的海水，哪怕海水正一寸寸把它压向海底。"
 LYY_The_Quiet_Council:"静默议会"
 LYY_The_Quiet_Council_desc:"静默议会里，议员们依然按时到场、按序发言，只是没有一票能改变结果。凝光保留了全部的形式：议程、记录、表决、鸣钟。她太懂这些形式的价值了，它们让一件不存在的事，看起来煞有介事。她亲手保住了象征，也亲手掏空了象征。"
 LYY_Gold_and_Steel:"金与钢"
 LYY_Gold_and_Steel_desc:"金与钢浇在一起，铸成天权最锋利的两样东西：钱和枪。商会出钱，私兵出枪，两者合流之后，再没有谁能在这里同时欠缺二者而存活。凝光检阅新军那天，旗帜上第一次并绣了铜钱与利刃，她站在旗下，忽然分不清，是谁在替谁效力。"
 LYY_The_Inevitable_Contract:"必然之约"
 LYY_The_Inevitable_Contract_desc:"必然之约的最后一条写着：「为免秩序崩坏，天权得于非常之时，便宜行事。」非常之时四个字，没有定义，也永远不必定义，因为定义它的人，正是那个想让它无限延长的人。凝光签下自己的名字，笔尖在纸上顿了很久很久。"
 LYY_Tianquan_Eternal:"天权永续"
 LYY_Tianquan_Eternal_desc:"天权永续。凝光终于把临时二字，从政府的名字里彻底抹去。加冕那天，群玉阁装饰得极尽华美，全城张灯。她端坐在最高处，看着脚下万家灯火，却在最喧闹的一刻，想起了多年前那个刚接手商会、还相信账目能衡量一切的小姑娘。"
 LYY_The_Final_Balance:"终局之秤"
 LYY_The_Final_Balance_desc:"终局之秤，是天权给自己算的最后一笔账。左边是黄金，右边是律法，指针摇摆在两者之间，迟迟不肯停下。凝光守着这杆秤坐了整夜，天亮时才对身边人说：把它记下来，是记下天平从来就没有真正平过。"
 LYY_Question_the_Contract:"问契"
 LYY_Question_the_Contract_desc:"凝光把自己关进空旷的契约库里一整夜。她抽出一份旧契，上面是三百年前帝君亲手写下的第一款；又抽出一份新契，是她昨夜刚签的。两份纸隔着三百年相对，字迹竟出奇地像。她第一次问自己：我推翻旧契约的方式，是不是正在书写新的旧契约？"
 LYY_The_Chasm_Ledger:"层岩账"
 LYY_The_Chasm_Ledger_desc:"层岩的账，记的是命。每一锹矿、每一根铁轨，背后都有名字。凝光把最精明的账房派进巨渊，回来的人脸色都不好看。她在账本封皮上批了四个字：此账宜轻，可谁都知道，最难轻轻的，恰恰是这种账。"
 LYY_Sea_Lanes_Guard:"航道护卫"
 LYY_Sea_Lanes_Guard_desc:"航道是璃月的血脉，谁掐住它，谁就掐住了这座城的咽喉。凝光重建海防，不为称霸，只为让每一艘挂璃月旗的船，都能平安回家。有人笑她多此一举，她却在望远镜里看着远方的桅影，说：能把货卖到天涯的人，也该有本事把家守到天涯。"
 LYY_Whispers_from_the_North:"雪原之约"
 LYY_Whispers_from_the_North_desc:"北国的密使来得比商队更勤。他们不谈货物，只谈「更深的合作」，谈一份能把璃月港整个租借出去的合约。凝光把合约读了三遍，在末尾批了一句：生意可以做，港口不做抵押。密使冷冷地问她是否想清楚了代价，她答：我算过，算得比你清楚。"
 LYY_War_of_Ledgers:"账与剑"
 LYY_War_of_Ledgers_desc:"账与剑，终究要在同一张桌上相见。凝光把三年来所有的契约、公债、地契铺满整间议事厅，然后对满堂议员说：战争的每一发炮弹，都在这本账里；想清楚要打，就得先想清楚拿什么去赔。没有人鼓掌，可散会时，所有人的脚步都比往常更沉。"
 LYY_Reunify_Liyue:"光复璃月"
 LYY_Reunify_Liyue_desc:"内战结束那一天，凝光把临时政府的告示从门楣上取下，换上了新的。她站在群玉阁顶，俯瞰着重新连成一片的璃月，手里攥着那本记了数年的旧账。她很久没有说话，最后只轻轻把它合上，对自己说：账清了，人也该往前看了，尽管这一页之后，还写着无数张待填的空纸。"

 LYY_civilwar_category:"天权之秤"
 LYY_civilwar_category_desc:"凝光 · 天权星政府的内战决议组。以两轴机制衡量政务与商路的进退，每一次决议都会改变当前等级。凝光讲究的是把璃月港的秩序与利益稳稳握在手里，快与慢之间自有她的分寸，绝不轻易押上全部筹码。她的每一步都算得极准，只看值不值得下注。"
 LYY_decision_audit_ledger:"核账度支"
 LYY_decision_audit_ledger_desc:"一本账，翻过去的每一页都写着谁在吃什么。核对度支是为了在下一笔钱花出去之前，先让所有人看清，这座城的家底还剩多少。"
 LYY_decision_charter_company:"立商会特许"
 LYY_decision_charter_company_desc:"特许状是一把钥匙，给谁，就等于把哪扇门交出去。立契易，收契难，每一次授权，都在天平的律令那一端，悄悄减去一点重量。"
 LYY_decision_open_market:"开市易货"
 LYY_decision_open_market_desc:"把码头敞开，让货物流通起来。市声喧闹之处，钱来得快，是非也来得快；可一座不肯做买卖的港口，很快就会变成一座死港。"
 LYY_decision_harbor_patrol:"巡防海道"
 LYY_decision_harbor_patrol_desc:"船出海，总要有人替它记着回家的路。巡防不为争雄，只为让海盗与散兵知道：这条航道上，货是有人桩的。"
 LYY_decision_buy_loyalty:"金帛结好"
 LYY_decision_buy_loyalty_desc:"用金银买来的交情，最真诚，也最短命。每一次馈赠都是一笔投资，投资的是别人此刻的点头，抵押的却是这座城往后的信誉。"
 LYY_decision_public_ledger:"公示公账"
 LYY_decision_public_ledger_desc:"把账挂在所有人都看得见的地方，是勇气，也是自缚。可一个不敢被人查账的政府，与一个不敢摊开的商号，本就没有分别。"
 LYY_decision_press_guilds:"劝课商工"
 LYY_decision_press_guilds_desc:"官府不下田，只把种田的人聚起来，教他们怎么多种一点、多卖一点。劝课二字听着温和，落在账房先生笔下，却是扎扎实实的进项。"
 LYY_decision_subsidize_grain:"平粜粮价"
 LYY_decision_subsidize_grain_desc:"粮价一涨，人心就晃。开仓平粜是最亏本的买卖，也是唯一能在米价疯长的夜里，让百姓安心睡下的一笔支出。"
 LYY_decision_recruit_clerk:"招录书吏"
 LYY_decision_recruit_clerk_desc:"新政需要会写字的手，也需要能守住秘密的嘴。招录书吏既是补人手，也是在天权身边，慢慢织起一张只认得章程、认不得旧情的网。"
 LYY_decision_issue_bonds:"发行公债"
 LYY_decision_issue_bonds_desc:"公债是把明天的钱借到今天来花。借的时候千金散尽，还的时候才知道，真正被抵押出去的，是往后每一代璃月人对这座城的信任。"
 LYY_decision_envoy_to_keqing:"使者赴玉衡"
 LYY_decision_envoy_to_keqing_desc:"使者带去的是账册。凝光附言：政见可以不同，账本总要有人会看。她比谁都清楚，真正能坐下来算账的对手，比满口空谈的朋友更有用处。"
 LYY_decision_envoy_to_ganyu:"使者赴月海亭"
 LYY_decision_envoy_to_ganyu_desc:"月海亭的檐角挂着未化的霜。使者带回的是一份细到石米的粮账，还有甘雨的一句题外话：账目清楚的人，才配谈天下。凝光把这句话抄进了自己的手札。"
 LYY_decision_envoy_to_shenhe:"使者赴绝云间"
 LYY_decision_envoy_to_shenhe_desc:"绝云间不问世事，使者却偏偏被留了三日。回程时他带回一片不化的雪，和一句冷冰冰的评语：「你们的律，量不出雪山的重量。」凝光端详着那片雪，很久没有说话。"
 LYY_decision_envoy_to_childe:"使者赴云来海"
 LYY_decision_envoy_to_childe_desc:"公子的船队泊在港外，甲板上却摆着一桌酒。使者回来说，那位至冬的执行官不谈打仗，只谈秩序，谈得比谁都像个商人。凝光听完，只说：会做生意的敌人，比只会打仗的敌人，更难对付。"
 LYY_decision_envoy_to_lanyan:"使者赴沉玉谷"
 LYY_decision_envoy_to_lanyan_desc:"使者带着一箱账册上山，只为向蓝砚证明，璃月港也能算清水土的账。蓝砚没接账册，只回赠了一杆不合规矩的旧秤，说：你们的秤量货，我的秤量山。"
 LYY_decision_proclaim_the_compact:"诸方共立新约"
 LYY_decision_proclaim_the_compact_desc:"凝光把曾经敌对、中立、观望的十二方，请到了同一张长桌前。她说：一个只由赢家签字的合约，撑不过下一次翻脸。这一纸新约，是她给天权出的最后一道，也是最难的一道考题。"

 LYY_Event.3001.t:"天权临政"
 LYY_Event.3001.d:"帝君驾崩后的第七日，群玉阁重新升空。凝光把临时政府钉上门楣，拒绝称王，也拒绝称臣。\n她站在浮空的回廊上，俯视着这座刚失去神明的城，对身边的账房先生说：从前我们向神纳税，如今，该学着向自己交账了。这一句话，成了璃月另一场风暴的开场白。"
 LYY_Event.3001.a:"以临时政府，重理天下"
 LYY_Event.3001.b:"以天权之名，独断一时"
 LYY_Event.3002.t:"封港令"
 LYY_Event.3002.d:"封港令下达的那个清晨，商船结阵，横陈内港。有人骂凝光是要掐断所有人的活路，她却在灯塔下冷笑：活路从来都在，只是从今天起，得按璃月的规矩走。\n第一张通行令发出时，领令的船主忽然发现，自己欠下的不只是钱，还有一个人情，而人情，是这世上利息最高的债。"
 LYY_Event.3002.a:"封港只为立规，照章放行"
 LYY_Event.3002.b:"封港到底，非亲信不得通行"
 LYY_Event.3003.t:"百工来朝"
 LYY_Event.3003.d:"百工的印章在长桌上摆了整整三排。凝光没有问他们忠于谁，只问他们一年能出多少货、交多少税。\n一位老掌事忍不住问：那我们是为谁做工？凝光指着满堂的印章答道：为你们自己，从今天起，没有人能再替你们做主，除非你们自己点头。"
 LYY_Event.3003.a:"与百工共议，同定税则"
 LYY_Event.3003.b:"压令各家，从速缴纳"
 LYY_Event.3004.t:"议事初鸣"
 LYY_Event.3004.d:"临时议事厅第一次鸣钟，桌椅还带着新漆味。各区、各行的代表坐得歪歪扭扭，谁都不服谁。\n凝光全程几乎没有开口，只让书记把每个人的话都记下来。散会后有人问她为何不主持，她说：我一开口，他们看的就是我的脸色了。"
 LYY_Event.3004.a:"让各区各行各占一席"
 LYY_Event.3004.b:"只邀亲信掌事入厅"
 LYY_Event.3005.t:"税关易主"
 LYY_Event.3005.d:"税关的钥匙换了一串新的，旧吏大多留任，只是每本税簿都套上了一根红绳。\n一个老税吏摸着那根红绳问：这是要把我们都当成贼吗？凝光摇头：不，这是要让你们以后，再不必替谁背黑锅。老人怔了很久，第一次把账记得工工整整。"
 LYY_Event.3005.a:"换钥留吏，账目公开"
 LYY_Event.3005.b:"尽罢旧吏，另用新人"
 LYY_Event.3006.t:"金册重铸"
 LYY_Event.3006.d:"金册重铸之夜，群玉阁灯火通明。凝光亲手写下天权二字，又亲手把旧册的结尾逐字抄进新册。\n有人不解：旧账早该付之一炬。凝光把笔搁下，说：烧掉旧账的人，迟早也会烧掉新账。一个敢把欠的账传下去的国家，才配谈信用二字。"
 LYY_Event.3006.a:"新册承接旧账，一页不落"
 LYY_Event.3006.b:"焚毁旧册，另起新元"
 LYY_Event.3007.t:"契约复立"
 LYY_Event.3007.d:"契约法复立的第一案，是两家船行争一处码头。凝光没有亲裁，只把判词交给三位素不相识的行首共署。\n其中一位行首签完字，手心全是汗。他对凝光说：大人，我从没判过案。凝光答：正因为你没判过，这一判才值钱。"
 LYY_Event.3007.a:"判词交行首共署"
 LYY_Event.3007.b:"亲裁立威，速结此案"
 LYY_Event.3008.t:"挤兑之夜"
 LYY_Event.3008.d:"挤兑之夜，码头边围满了举着火把的人，要求把纸钞换成真金。凝光没有派兵，只命人当众开箱。\n金锭一枚一枚地兑出去，队伍从夜排到天明，最后自己散了。走的时候，有人回头看了那口空箱一眼，箱底还压着几锭没兑完的金子，却再没人上前。"
 LYY_Event.3008.a:"当众开箱，如数兑付"
 LYY_Event.3008.b:"暂停兑付，先稳住银根"
 LYY_Event.3009.t:"商团出海"
 LYY_Event.3009.d:"商团护卫队出海，旗上绣着一杆秤。水手们起初都笑这旗子不像战旗，倒像店铺的幌子。\n凝光在码头送行时只说了一句：海上不讲道理，只讲谁的货能平安回港。一个连自家商船都不敢护的商会，谈什么自由通商。话音落下，炮口齐齐转向了外海。"
 LYY_Event.3009.a:"重建护卫，护航出海"
 LYY_Event.3009.b:"船只出海，自负吉凶"
 LYY_Event.3010.t:"开市之锣"
 LYY_Event.3010.d:"市集重开的清晨，码头铜锣连敲三下。凝光废去层层关卡税，只留一道明面货税。\n第一个挑夫挑着货大摇大摆走出关卡，没被拦下，愣了好一会儿，忽然撒腿就跑，是跑去报信。半个时辰后，整条街的吆喝声都活了。"
 LYY_Event.3010.a:"尽废关卡，只留货税"
 LYY_Event.3010.b:"暂缓开市，先固税收"
 LYY_Event.3011.t:"清册入户"
 LYY_Event.3011.d:"八区清册，挨家挨户地登记，连灶台边打盹的猫都被记了一笔。有妇人拦着吏员不让他进院。\n吏员便蹲在门口，一边问一边记，记到她家几口锅、几石米、几个孩子。末了妇人问：记这些做什么？吏员答：总得有人知道，您家有多难。"
 LYY_Event.3011.a:"逐户登记，务求详尽"
 LYY_Event.3011.b:"只登商籍，不问民户"
 LYY_Event.3012.t:"当铺门前"
 LYY_Event.3012.d:"当铺门口排着长队，债主与债户各占一列。凝光定下新规：利过本金三倍者，一律重议。\n消息传开，引得半个港口哗然。一位老妇攥着当票挤到前头，问：那我这十年利滚利的账，真能不认了？凝光看着她，说：是替您算了算，什么才叫真的还不起。"
 LYY_Event.3012.a:"利过三倍者，一律重议"
 LYY_Event.3012.b:"典债照旧，契约如山"
 LYY_Event.3013.t:"北国商队"
 LYY_Event.3013.d:"至冬商队自陆路入境，驮着毛皮、矿石与烈酒。凝光的账房连夜核对，铜秤称了三遍。\n商队领队临走时压低声音问：要不要再进一批别的货？凝光把茶盏重重一顿：璃月的码头，只卸货物，不卸别国的规矩。领队讪讪退下，背影在灯下拉得很长。"
 LYY_Event.3013.a:"接其商货，拒其规矩"
 LYY_Event.3013.b:"断绝北国，闭门自守"
 LYY_Event.3014.t:"特许之价"
 LYY_Event.3014.d:"特许状一纸难求，商会的门槛几乎被踩断。凝光把最高的价码留给最古老的行业，把最新的口子留给最新的匠人。\n一位新起的年轻匠人捧着特许状，手抖得厉害，问：我这样的人，也能拿这个？凝光看着他，说：正因为你这样的人一向拿不到，我才要给你。"
 LYY_Event.3014.a:"向新匠开放特许"
 LYY_Event.3014.b:"特许只授老行会"
 LYY_Event.3015.t:"玉京之问"
 LYY_Event.3015.d:"凝光在议事厅正中挂了一副对子：上联取利于民，下联还法于民，横批空悬，无人敢填。\n满堂为横批争得面红耳赤，凝光却始终不表态。直到有人不耐烦地问她想写什么，她才淡淡说：这道横批，从来不该由我一个人来写。"
 LYY_Event.3015.a:"把选择权交给议事厅"
 LYY_Event.3015.b:"自己拍板，写下横批"
 LYY_Event.3016.t:"自由宪章"
 LYY_Event.3016.d:"自由宪章的长文里，最难落笔的是义务。凝光删改再三，最终在第一条写下：「凡在本港经营者，无论贵贱，皆同守一法。」\n一位老士绅当场摔了茶盏，扬长而去；也有人默默抄下副本。此后每逢争论，这份宪章总被人拿出来当尺子使。"
 LYY_Event.3016.a:"颁行自由宪章"
 LYY_Event.3016.b:"缓议宪章，先安士绅"
 LYY_Event.3017.t:"法司迁街"
 LYY_Event.3017.d:"法司搬出衙门，迁进临街一栋小楼。凝光亲自下令撤掉石狮，把民可问官四字刻上台阶。\n开张首日，一个穿了旧鞋的农人犹豫着不敢进。门吏没有拦他，只为他引了座。他坐下后才敢相信，原来这座楼，真是为像他这样的人开的。"
 LYY_Event.3017.a:"迁法司于闹市，民可问官"
 LYY_Event.3017.b:"法司仍设衙门，维持官威"
 LYY_Event.3018.t:"八区初议"
 LYY_Event.3018.d:"八区议会首次开会，八种口音吵作一团，从日头升吵到日头落。凝光坐在台下，一言不发。\n散会时有人挤过来问她为何不主持公道，她笑答：我一开口，他们看的就是我。这样的议会，不开也罢。众人一时无言。"
 LYY_Event.3018.a:"让八区议会对决"
 LYY_Event.3018.b:"统一号令，免其争吵"
 LYY_Event.3019.t:"自由港灯"
 LYY_Event.3019.d:"自由港法案通过那夜，灯塔彻夜不熄。从此无论挂谁的旗，只要能守港规，都能来卸货、补给、换钱。\n有人痛骂凝光把璃月卖了，她却在法案末尾添了一行小字：一扇关上的门，最后锁住的，往往是屋子里的人。这行字后来被人拓了下来，挂在许多商号里。"
 LYY_Event.3019.a:"自由港全面开放"
 LYY_Event.3019.b:"只开放部分口岸"
 LYY_Event.3020.t:"砸碎的牌匾"
 LYY_Event.3020.d:"废垄断令一下，几十年垒起的行会壁垒轰然倒塌。老掌事们举着写有传统二字的牌子在商会门前抗议。\n凝光从窗前看着他们，没有生气，只想起当年有多少新匠人的手艺，就是这样被传统两个字，活活攥死在门内的。她什么也没说，转身继续批卷。"
 LYY_Event.3020.a:"坚决废除行会垄断"
 LYY_Event.3020.b:"暂留垄断，安抚旧商"
 LYY_Event.3021.t:"同意之税"
 LYY_Event.3021.d:"「税须经民同议」五个字，比任何战旗都更让旧贵人心惊。第一笔尝到这滋味的，是一位提议加征茶税的老议员。\n他被人当面驳得体无完肤，散会后却追到阶前，对凝光深深一揖：大人，我今日才头一回觉得，这会开得不像在演戏。凝光回礼，什么也没说。"
 LYY_Event.3021.a:"税须经民同议"
 LYY_Event.3021.b:"加税之权，尽归政府"
 LYY_Event.3022.t:"律学开馆"
 LYY_Event.3022.d:"律学馆开在旧日讼师的隔壁，一墙之隔，两扇门。凝光请来退职判官、账房先生，甚至几个名声不佳的讼棍来授课。\n有人质疑讼棍也配登堂。凝光答：让百姓懂法，是让他们知道，法是攥在手里能用的。"
 LYY_Event.3022.a:"广设律学，教民知法"
 LYY_Event.3022.b:"律不外传，君权自持"
 LYY_Event.3023.t:"公民之册"
 LYY_Event.3023.d:"公民之册发下的那天，一位老掌事摸着那本薄薄的册子，反复翻看，像在确认自己没看错。\n他做了五十年生意，头一回有了一个与族谱、商号都无关的身份。他问凝光：这本册子，能管什么用？凝光答：能让你在官府面前，不再只是一个会赚钱的家什。"
 LYY_Event.3023.a:"授予商人公民之册"
 LYY_Event.3023.b:"商人仍居于四民之末"
 LYY_Event.3024.t:"钱庄章程"
 LYY_Event.3024.d:"钱庄宪章颁行，准备金、放贷、清算，条条写死。老掌柜抱怨太不近人情，凝光却在大户挤兑的夜里，靠这套章程把整座港口的银根稳了下来。\n事后有人问她为何如此笃定，她只说：规矩越硬，人心才越软得下来。软不下来的人，才总想着靠关系过日子。"
 LYY_Event.3024.a:"颁钱庄宪章，立准备金"
 LYY_Event.3024.b:"钱庄自治，官府不问"
 LYY_Event.3025.t:"港口公约"
 LYY_Event.3025.d:"港口公约签下的是一份所有人都在上面按了印的通行规则：遇险互救、泊位公平、货税统一、争端共裁。\n有人问凝光凭什么信别人肯守约。她指着末尾密密麻麻的指印，说：赖账的人会被所有人记住，对一个想长久做买卖的人，这就是最重的惩罚。"
 LYY_Event.3025.a:"广签港口公约"
 LYY_Event.3025.b:"只与盟好签此约"
 LYY_Event.3026.t:"摊开的账"
 LYY_Event.3026.d:"公账公开那天，码头边立起一块巨板，一笔一笔写清每一枚摩拉的来去。有较真的人带了算盘来核，核到深夜也没找出破绽，悻悻而去。\n凝光远远看着，没有说话。她心里清楚，自己真正怕的从来是有一天，再没有人愿意来查。"
 LYY_Event.3026.a:"公账全部公开"
 LYY_Event.3026.b:"只公开无关紧要之账"
 LYY_Event.3027.t:"贴身的旧衣"
 LYY_Event.3027.d:"匠作保护的条文琐碎得像在缝衣：工时、学徒、工价、伤病抚恤，一条一条，密密缝进。\n有人笑凝光连这种事都要管。她却说：自由通商不是让强者通吃；若连最会做手艺的人都被榨成穷光蛋，这港口剩的就只有一群倒买倒卖的货郎了。"
 LYY_Event.3027.a:"护匠作，定工时工价"
 LYY_Event.3027.b:"放任竞逐，优胜劣汰"
 LYY_Event.3028.t:"揉皱的盟约"
 LYY_Event.3028.d:"诸省盟约谈了整整三日，崩了三回，最后在一张揉皱的纸上谈成。八省各让一步，谁也没占到全便宜。\n凝光在盟约上按了印，说：天衣无缝的盟约都是死人写的，活人签的，总要缺一角，缺的这角，就留给将来的人去补吧。"
 LYY_Event.3028.a:"与各省互让，缔结盟约"
 LYY_Event.3028.b:"强令各省服从港府"
 LYY_Event.3029.t:"玉律颁行"
 LYY_Event.3029.d:"玉律宪法颁下时，群玉阁的天空飘起细雨。凝光没有宣读全文，只念了开篇第一句：「璃月之治，源于契约，归于契约。」\n台下静了很久，随后爆发出雷鸣般的掌声。她却在这掌声里，第一次感到肩上的份量，重得有些陌生，原来被人拥戴，也是一种沉甸甸的孤独。"
 LYY_Event.3029.a:"颁布玉律宪法"
 LYY_Event.3029.b:"暂缓立宪，集中事权"
 LYY_Event.3030.t:"永续之约"
 LYY_Event.3030.d:"永续之约把一年的承诺，写成了百年的约定。有人笑凝光痴人说梦，说商人只做眼前的买卖。\n凝光却在契约末尾写了一行小字：我今日定下的规矩，未必比我活得更久；但我希望，它能活得比我身后下一个贪心的人，更久一些。写完，她搁下笔，独自登楼看了很久的海。"
 LYY_Event.3030.a:"签下永续之约"
 LYY_Event.3030.b:"只续前约，不敢永诺"
 LYY_Event.3031.t:"茶室议事"
 LYY_Event.3031.d:"商会枢密无衙无印，只在一间茶室里议事。十几个掌事围坐，一句语气、一个眼神，就能定下半座港口的命运。\n凝光坐在主位，看着这些比官府更像官府的人，忽然意识到：她并不是推翻了旧秩序，她只是替旧秩序，换上了一件更考究、更体面的外衣。"
 LYY_Event.3031.a:"以商会枢密总揽国政"
 LYY_Event.3031.b:"维持议事厅，纵其议政"
 LYY_Event.3032.t:"不见光的册子"
 LYY_Event.3032.d:"密账不宣。天权商会要紧的几笔数目，从此只写在两三本不对外的册子里。凝光告诉自己这是权宜之计。\n可那几本册子越积越厚，翻也翻不动了。她比谁都清楚：一本不肯给人看的账，本身就是一份供状，只是这世上，很少有人肯亲手写下自己的罪。"
 LYY_Event.3032.a:"密账不宣，事权独揽"
 LYY_Event.3032.b:"账目照旧公开"
 LYY_Event.3033.t:"双份军饷"
 LYY_Event.3033.d:"商团私兵成军，旗号各归各家，号令却出自同一间茶室。士兵拿双份饷，认两个主，忠诚被明码标价。\n凝光检阅这支军队时，忽然想起刻晴的民兵。她曾嘲笑那是乌合之众，如今才明白：用钱买来的兵，比用信仰拢来的更听话，也更善变。钱一停，枪口就会转过弯来。"
 LYY_Event.3033.a:"组建商团私兵"
 LYY_Event.3033.b:"军权尽归政府"
 LYY_Event.3034.t:"墙后的海"
 LYY_Event.3034.d:"关税壁垒一道接一道立起，把外货挡在港外。库房堆满卖不出去的东西，商人们反倒拍手称快。\n凝光没有阻拦，只在深夜独自登楼看海。远处被壁垒隔开的海面在黑夜里泛着微光，安静得有些刺眼。她站了很久，直到海风把衣角吹得发冷，才转身下楼。"
 LYY_Event.3034.a:"高筑关税壁垒"
 LYY_Event.3034.b:"维持自由关税"
 LYY_Event.3035.t:"商会衙门"
 LYY_Event.3035.d:"商会至上的条文落下，天权商会从议事的厅堂，变成了发号施令的衙门。律法要看商会的脸色，官员要经商会遴选。\n凝光在这条路上走得极稳。稳到某天清晨，她对着镜子梳妆，忽然怔住，镜中那个眉眼锋利、下令的人，她竟一时认不出，是自己，还是她曾经憎恨的那些影子。"
 LYY_Event.3035.a:"立商会至上之律"
 LYY_Event.3035.b:"律法高于商会"
 LYY_Event.3036.t:"忠诚作抵"
 LYY_Event.3036.d:"权债，是一份以忠诚作抵押的契约。谁借了这笔钱，谁就在下次表决时，欠凝光一票。\n她把权力做成了账，做得漂亮。可账最怕的从是有一天利滚利到谁也还不起，到那时，收账的和欠账的，都得跟着这座城，一起沉下去。"
 LYY_Event.3036.a:"以权债结盟诸家"
 LYY_Event.3036.b:"拒用权债，只凭法度"
 LYY_Event.3037.t:"白银无声"
 LYY_Event.3037.d:"白银铁拳落下时，是没有声音的。罢工的行首忽然发现货款被冻结，闹事的商户忽然发现自己不合法了。\n凝光从不动刀，她只是让不听劝的人，在账面上悄然消失。她说：青桐的拳头会留下印子，白银的拳头只会留下欠条，而欠条，是最体面的伤。"
 LYY_Event.3037.a:"白银铁拳，无声镇压"
 LYY_Event.3037.b:"收拳示仁，缓其怨气"
 LYY_Event.3038.t:"赎买之宴"
 LYY_Event.3038.d:"赎买七星，是一场近乎温柔的收编。凝光用股份、红利、终身奉养，请旧日的同僚体面退场。\n有人接了，有人拒了，也有人含着泪在转让书上按下手印，没有一滴血，可七星那把椅子，从此再没有坐过第二个人。凝光收起文书，为它轻轻拂去一点灰。"
 LYY_Event.3038.a:"赎买七星，体面易主"
 LYY_Event.3038.b:"清算七星，明正典刑"
 LYY_Event.3039.t:"巨鲸之海"
 LYY_Event.3039.d:"玉税专营，把矿脉、铸币与盐茶一并攥进一只手里。凝光说这是为国家聚财，反对者却问：财聚到了谁那里？\n她当然知道答案。可她已经离不开这套机器了，就像巨鲸离不开自己吞下的海水，哪怕那海水，正一寸一寸地把它压向海底。"
 LYY_Event.3039.a:"玉税专营，独揽利权"
 LYY_Event.3039.b:"开矿放权，与商共利"
 LYY_Event.3040.t:"静默的钟"
 LYY_Event.3040.d:"静默议会里，议员依旧按时到场、按序发言，只是没有一票能改变结果。凝光保留了全部的形式：议程、记录、表决、鸣钟。\n她太懂这些形式的价值了，它们能让一件并不存在的事，看起来煞有介事。她亲手保住了象征，也亲手，掏空了象征。"
 LYY_Event.3040.a:"保留议会形式，掏空"
 LYY_Event.3040.b:"恢复议会实权"
 LYY_Event.3041.t:"铜钱与利刃"
 LYY_Event.3041.d:"金与钢浇在一起，铸成天权最锋利的两样东西：钱和枪。商会出钱，私兵出枪，二者合流，再无人能同时缺少两者而活着。\n凝光检阅新军那天，旗帜上第一次并绣了铜钱与利刃。她站在旗下，望着迎风招展的旗，忽然分不清，是谁在替谁效力。"
 LYY_Event.3041.a:"商会出钱，私兵出枪"
 LYY_Event.3041.b:"钱枪分离，各司其职"
 LYY_Event.3042.t:"必然之约"
 LYY_Event.3042.d:"必然之约的最后一条写着：「为免秩序崩坏，天权得于非常之时，便宜行事。」\n非常之时四个字，没有定义，也永远不必定义，因为定义它的人，正是那个最想让这「很」，无限延长下去的人。凝光签下自己的名字，笔尖在纸上顿了很久，落了很重的一笔。"
 LYY_Event.3042.a:"签下必然之约"
 LYY_Event.3042.b:"定下还政之期"
 LYY_Event.3043.t:"永续加冕"
 LYY_Event.3043.d:"天权永续。凝光终于把临时二字，从政府的名字里彻底抹去。加冕那日，群玉阁装饰得极尽华美，全城张灯。\n她端坐最高处，看着脚下万家灯火，却在最喧闹的一刻，想起了许多年前那个刚接手商会、还相信账目能衡量一切的小姑娘。那人也曾坐在这样的灯下，只是那时，她眼里有光。"
 LYY_Event.3043.a:"天权永续，加冕正名"
 LYY_Event.3043.b:"改回临时，定期还政"
 LYY_Event.3044.t:"终局之秤"
 LYY_Event.3044.d:"终局之秤，是天权给自己算的最后一笔账。左边黄金，右边律法，指针在两者之间摇摆，迟迟不肯停。\n凝光守着这杆秤坐了整夜，天亮后才对身边人说：把它记下来，是记下，这架天平，从来就没有真正平过。说完，她起身，把秤轻轻罩上了一块布。"
 LYY_Event.3044.a:"直面终局之秤"
 LYY_Event.3044.b:"掩盖秤上之差"
 LYY_Event.3045.t:"三百年的两纸"
 LYY_Event.3045.d:"凝光把自己关进空旷的契约库一整夜。她抽出帝君三百年前手书的第一款旧契，又摸出自己昨夜刚签的新契。\n两张纸隔着三百年相对，字迹竟出奇地相似。她第一次问自己：我推翻旧契约的方式，会不会，正在写下一份新的旧契约？窗外天光渐亮，她始终没有找到答案。"
 LYY_Event.3045.a:"承认困惑，续写新契"
 LYY_Event.3045.b:"压下疑问，只谈眼前"
 LYY_Event.3046.t:"巨渊的账"
 LYY_Event.3046.d:"层岩的账，记的是命。每一锹矿、每一根铁轨，背后都站着有名字的人。\n凝光把最精明的账房派进巨渊，回来的人脸色都不好看。她在账本封皮上批了四个字：此账宜轻，可谁都知道，世上最难轻轻的，恰恰就是这种账。"
 LYY_Event.3046.a:"慎待层岩之账"
 LYY_Event.3046.b:"催矿不辍，务求产出"
 LYY_Event.3047.t:"航道的灯"
 LYY_Event.3047.d:"航道是璃月的血脉，谁掐住它，谁就掐住了这座城的咽喉。凝光重建海防，不为称霸，只为让每一艘挂璃月旗的船，都能平安回家。\n有人在岸边笑她多此一举。她端着望远镜，望着远方的桅影，说：能把货卖到天涯的人，也该有本事，把家守到天涯。"
 LYY_Event.3047.a:"扩编航道护卫"
 LYY_Event.3047.b:"省下军费，任船自去"
 LYY_Event.3048.t:"雪原密使"
 LYY_Event.3048.d:"北国的密使来得比商队更勤。他们不谈货，只谈「更深的合作」，谈一份能把璃月港整个租借出去的合约。\n凝光读了三遍，在末尾批道：生意可做，港口不做抵押。密使冷冷问她可想过代价，她答：算过了，比你算得清楚。那夜她独自坐了很久，直到烛火烧到了尽头。"
 LYY_Event.3048.a:"拒租港口，虚与委蛇"
 LYY_Event.3048.b:"签下合约，换取重建"
 LYY_Event.3049.t:"账与剑"
 LYY_Event.3049.d:"账与剑，终究要在同一张桌前相见。凝光把三年来所有的契约、公债、地契铺满整间议事厅。\n满堂默然。她对众人说：战争的每一发炮弹，都写在这本账里；想清楚要打，就得先想清楚，拿什么去赔。没有人鼓掌，可散会时，所有人的脚步，都比往常更沉了些。"
 LYY_Event.3049.a:"倾全港之力，一战而定"
 LYY_Event.3049.b:"权衡账簿，暂避锋芒"
 LYY_Event.3050.t:"光复的账"
 LYY_Event.3050.d:"内战结束那天，凝光亲手取下门楣上临时政府的告示。她站在群玉阁顶，俯瞰着重新连成一片的璃月，手里攥着那本记了数年的旧账。\n她久久没有开口，最后只轻轻把账合上，对自己说：账清了，人也该往前看了。只是这一页翻过去之后，后面还写着一沓，崭新的、待填的空纸。"
 LYY_Event.3050.a:"带着这一本账，向前走"
 LYY_Event.3050.b:"停下脚步，清算所有"
 LYY_Event.3051.t:"玉衡的回信"
 LYY_Event.3051.d:"玉衡的回信写得很短，只一句话：账我可以信你，人却不能。但她随信附来一份八省的人口清册，字迹工整，显然是亲手所录。\n凝光把清册翻了一遍又一遍，末了笑着对谋士说：你瞧，肯骂我的人，才真把我当回事。骂都不肯骂的，才是早就打算不理我了。"
 LYY_Event.3051.a:"回信玉衡，坦诚相商"
 LYY_Event.3051.b:"就事论事，不予深交"
 LYY_Event.3052.t:"月海亭的粮账"
 LYY_Event.3052.d:"甘雨的粮账寄到，细得连一石米的去路都有批注。她在文末写着：你算得清金钱，我算得清米粮，加在一起，才勉强算得清一个璃月。\n凝光盯着这句勉强二字，久久不语。她忽然意识到，自己引以为傲的账簿，在真正庞大而琐碎的民生面前，薄得可怜。"
 LYY_Event.3052.a:"回信月海亭，共理粮政"
 LYY_Event.3052.b:"拒其插手，独掌财粮"
 LYY_Event.3053.t:"绝云间的雪"
 LYY_Event.3053.d:"绝云间的回信来得迟，也冷。使者带回一片不化的雪，附言只有八字：「你们的律，量不出雪山的重量。」\n凝光把那片雪搁在案头，看它整夜不化。她想起自己一生都在衡量、定价、核算，却从没有为这样一片没有用处、也标不出价钱的雪，留过位置。"
 LYY_Event.3053.a:"尊重绝云间，另设一尺"
 LYY_Event.3053.b:"以律法强令仙家归附"
 LYY_Event.3054.t:"北方来的酒"
 LYY_Event.3054.d:"达达利亚在甲板上摆了一桌酒，谈的是秩序。他说：这世界从来不公平，你们革命，是想让它公平，还是想换一批人来收账？\n凝光举杯，未答。回港的船上，她对谋士说：那是个比谁都像商人的敌人，这样的人最难缠，因为他和你算的，是同一本账。"
 LYY_Event.3054.a:"以商人之道应公子"
 LYY_Event.3054.b:"以刀兵之法拒至冬"
 LYY_Event.3055.t:"沉玉谷的秤"
 LYY_Event.3055.d:"沉玉谷的回复最迟，也最怪：一杆藤编的旧秤，没有刻度。附言说：你们的契，量不出水土的重量。\n凝光把秤端详了很久，忽然明白蓝砚的意思，她是在提醒：一个只讲契约与货值的国度，也许会用公平，掩盖另一种偏心。那杆无刻度的秤，此后一直摆在她的案头。"
 LYY_Event.3055.a:"虚心请教沉玉谷"
 LYY_Event.3055.b:"斥其阻碍开发"
 LYY_Event.3056.t:"十二方新约"
 LYY_Event.3056.d:"十二份回执，十二种态度，十二个曾不可能坐在同一张桌前的名字。凝光把它们并排铺成长长一列，像铺开一地残缺的拼图。\n最热忱的回信写了整整三页，最冷淡的只盖了一枚空白印。凝光看着这十二张纸，忽然觉得，自己也许当真做成了什么，是因为她终于，敢让所有人开口。"
 LYY_Event.3056.a:"邀请十二方共立新约"
 LYY_Event.3056.b:"只与盟友续订旧契"

 LYY_Spirit_Tianquan_Regency:"天权摄政"
 LYY_Spirit_Tianquan_Regency_desc:"摄政的名义比王座更轻，权力却比王座更重。凝光以一本账、一枚印、一座浮空的阁楼，撑起了一个失去了神明的国家。"
 LYY_Spirit_Golden_Ledger:"金册之国"
 LYY_Spirit_Golden_Ledger_desc:"金册上记着每一笔来，也记着每一笔去。一个把账目看得比誓言更重的国度，既令人安心，也令人不敢大声喧哗。"
 LYY_Spirit_Independent_Judiciary:"独立法司"
 LYY_Spirit_Independent_Judiciary_desc:"法司搬出了衙门，也搬出了官威。它站在街头，既像一座靠山，也像一面镜子，照见每一个想越过它的人。"
 LYY_Spirit_Artisan_Compact:"匠作之盟"
 LYY_Spirit_Artisan_Compact_desc:"工价、工时、学徒、伤病，一条一款地写进契里。这是一个国家终于承认：造东西的手，和管账的手，一样金贵。"
 LYY_Spirit_Everlasting_Compact:"永续之约"
 LYY_Spirit_Everlasting_Compact_desc:"把一年的诺言写成百年的约定。写的人未必等得到兑现，却愿意先替还看不见的后人，把这一纸苦约签下。"
 LYY_Spirit_Guild_Supreme:"商会至上"
 LYY_Spirit_Guild_Supreme_desc:"当商会成了衙门，律法便成了行规。它高效、干净、井井有条，只是再也不问，那些被挡在门外的声音，去了哪里。"
 LYY_Spirit_Tianquan_Eternal:"天权永续"
 LYY_Spirit_Tianquan_Eternal_desc:"临时二字被抹去的那一刻，一座城的希望与一座城的枷锁，同时落在了同一个人肩上。"
 LYY_Spirit_Creditors_Fear:"债主之惧"
 LYY_Spirit_Creditors_Fear_desc:"当全世界都欠着你的钱，你便不必再讲道理。这份力量来得太容易，也腐得太快，它把敌人变成客户，也把自己变成债。"
 LYY_Spirit_Open_City:"不夜之港"
 LYY_Spirit_Open_City_desc:"灯塔彻夜不熄，无论挂谁的旗，都能来卸货。开放是一座城最奢侈的慷慨，也是它最容易受伤的地方。"
 LYY_Spirit_Mercantile_Spirit:"商贾精神"
 LYY_Spirit_Mercantile_Spirit_desc:"一城之人，十有七八靠买卖吃饭。他们把天下当作一盘长长的生意，既学会了周旋，也学会了在周旋里，不轻易低头。"
 LYY_Spirit_Five_Envoys:"五方通使"
 LYY_Spirit_Five_Envoys_desc:"五面旗，五次试探，五条通向不同未来的路。凝光未必能说服谁，但她至少让所有人都知道，这座城的门，没对谁关死。"
 LYY_Spirit_Twelve_Compass:"十二星盘"
 LYY_Spirit_Twelve_Compass_desc:"十二个曾互为仇敌的名字，头一次落在同一张纸上，各自按了印。这是所有不肯闭嘴的人，共同的胜利。"

 LYY_Wealth_Tier_1:"财货等级"
 LYY_Wealth_Tier_1_desc:"财货匮乏，国库见底，商路萧条。账房先生算盘打了一夜，只剩几声空响。"
 LYY_Wealth_Tier_2:"财货等级"
 LYY_Wealth_Tier_2_desc:"财货温饱，收支勉强相抵，市面不冷不热。日子过得下去，却没人敢置办什么大件。"
 LYY_Wealth_Tier_3:"财货等级"
 LYY_Wealth_Tier_3_desc:"财货殷实，商路畅通，库有余粮。天权的账本第一次出现了像样的盈余。"
 LYY_Wealth_Tier_4:"财货等级"
 LYY_Wealth_Tier_4_desc:"财货豪富，金玉满仓，港口彻夜通明。财富像潮水一样涌来，也在悄悄地冲刷着律法的堤岸。"
 LYY_Wealth_Tier_5:"财货等级"
 LYY_Wealth_Tier_5_desc:"财货敌国，富可敌国，债主之惧令四方低头。可金山越高，站在山下的人就越觉得，自己不曾分到过一分光。"
 LYY_Law_Tier_1:"律令等级"
 LYY_Law_Tier_1_desc:"律令废弛，旧契已毁，新法未立。事事凭人情决断，人一走，约定也就散了。"
 LYY_Law_Tier_2:"律令等级"
 LYY_Law_Tier_2_desc:"律令初成，官府开始按章程办事，可执行起来，仍要看谁的面子大一些。"
 LYY_Law_Tier_3:"律令等级"
 LYY_Law_Tier_3_desc:"律令成文，白纸黑字，庄重而迟缓。它保护了弱者的权利，也拖慢了一切想走捷径的脚步。"
 LYY_Law_Tier_4:"律令等级"
 LYY_Law_Tier_4_desc:"律令森严，法如山石，不偏不倚。作奸犯科者无所遁形，而敢于绕行的聪明人，也渐渐没了活路。"
 LYY_Law_Tier_5:"律令等级"
 LYY_Law_Tier_5_desc:"律令如磐，铁律之下，人人平等到没有一丝余地。它守住了公义，也可能在不经意间，锁住了这座城伸向未来的手。"
 LYY_Combo_Twin_High:"金玉其外"
 LYY_Combo_Twin_High_desc:"钱多而法严，商人束手，资本悄悄流向外港。港口灯火通明，账面上却越来越像一座精致的空壳。"
 LYY_Combo_Twin_Low:"两头落空"
 LYY_Combo_Twin_Low_desc:"国库见底，律法也立不起来。谁都在等一个能拍板的人，可谁也不肯先开口。"
 LYY_Combo_A_High:"豪富无律"
 LYY_Combo_A_High_desc:"金山压过了律文。投机客在码头彻夜狂欢，规矩退到角落，看着自己一点点被无视。"
 LYY_Combo_B_High:"律严财枯"
 LYY_Combo_B_High_desc:"法条压死了生意。秩序是有了，可街上的人越来越少，账房里的数字越来越冷。"

 #################### 凝光 · 天权临时政府（LYY） · 战后 ####################
 LYY_PW_Tianquan_New_Scale:"天权新秤"
 LYY_PW_Tianquan_New_Scale_desc:"内战收场那日，凝光把群玉阁的旧秤抬到港口正中，当众砸了。她说：从前这杆秤称货也称人，两头都不准。新铸的秤只称货，称人的那一半，往后交给律法与账本。围观的人里，有老掌事当场红了眼，也有人弯腰把碎铜拾起来，揣进了袖子。"
 LYY_PW_Clear_the_Quays:"清港安民"
 LYY_PW_Clear_the_Quays_desc:"断桅与沉船堵在泊位上，凝光雇了三百个内战里失了业的船工来清港，工钱按日结，米按时发。一个老船工收工后问她，港清完了还雇不雇人。她答：港清完了还有码头，码头修完了还有城。活计不会断，只要你肯来。老人第二天来得比谁都早。"
 LYY_PW_Rebuild_the_Quay_Wards:"港坊重立"
 LYY_PW_Rebuild_the_Quay_Wards_desc:"港坊按手艺与人头重划，染坊、铁坊、船坊各归一处，谁也不许多占一尺。有人托旧日商会的门路来讨地，被账房先生挡在门外。凝光只吩咐一句：从前的地是买来的，今天的地是分出来的，这两笔账不许并到一处算。"
 LYY_PW_Reopen_the_Markets:"重开市集"
 LYY_PW_Reopen_the_Markets_desc:"开市头一日，凝光遣人敲了三下码头的旧锣，又撤了三道关卡税。她自己在早市买了一斤最便宜的盐，付过钱才走。摊主愣着不敢收，她把铜钱按在案上，说：你收的是市价，我付的是市价，谁也不欠谁的人情。"
 LYY_PW_Return_the_Terraces:"还田于耕"
 LYY_PW_Return_the_Terraces_desc:"梯田的旧契在战火里烧了大半，凝光索性下了一道笨告示：谁种的归谁，旧契作废，有异议到衙门口来议。告示贴出三日无人上门。第四日，一个老农抱着残契来了，账房先生当着他的面把界桩重打了一遍，他才把契纸收进怀里。"
 LYY_PW_The_Common_Granary:"义仓之约"
 LYY_PW_The_Common_Granary_desc:"义仓的钥匙铸了五把，交到五户人家手里，缺一户便开不了门。有幕僚劝凝光收回钥匙，说这样调粮不便。她摇头：仓里的粮是五户凑的，锁就该五户来开。今日为图省事把钥匙收回来，明日仓空了，也不会有人替它心疼。"
 LYY_PW_A_Ledger_of_Every_House:"户户清册"
 LYY_PW_A_Ledger_of_Every_House_desc:"清册挨家挨户地登，只登人头、田亩、手艺，不登家资。有吏员抱怨条目太细，凝光把册子递过去给他看：这上头每一个人，从前在官府的账里都只是个数目；从今天起，他至少各占一行。吏员低头舔了舔笔尖，那日写得比往常工整。"
 LYY_PW_Schools_of_Accounts:"账学馆"
 LYY_PW_Schools_of_Accounts_desc:"账学馆开学头一课，讲的是怎么看出一份借契里的花头。听课的有船工、货郎、替人看铺的伙计。凝光亲自来坐了一下午，末了说：会算账的人多了，敢骗人的就少了。有个伙计把这句话抄在袖口上，回家路上念了一路。"
 LYY_PW_The_Standard_Mint:"天权铸币厂"
 LYY_PW_The_Standard_Mint_desc:"铸币厂的炉子砌在旧钱庄的废址上。凝光定下成色与重量，铸一枚验一枚，验不过的当场回炉。有老掌事送来旧摩拉想掺着用，被她当众退了回去。她说：钱这东西，自己重一分，别人才肯信你一分；自己轻一分，往后就得拿命去补。"
 LYY_PW_Rails_to_the_Chasm:"层岩铁道"
 LYY_PW_Rails_to_the_Chasm_desc:"铁轨从港口一直铺到层岩的矿口，第一根枕木是凝光亲手放下的。她对监工说：从前运一车矿，路上要折损两条人命；往后要折损的，只能是石头。有人笑她算得过细，直到第一列满载的矿车轰隆隆出了山口，看热闹的人把帽子都挤掉了。"
 LYY_PW_The_Craft_Guilds:"百工行会"
 LYY_PW_The_Craft_Guilds_desc:"行会重立，凝光只提一个条件：掌事由匠人自己推。老掌事想按资历排座次，被她驳回。她说：行会护的是手艺，不是谁家祖上开过几间铺子。有个打铜的年轻人头一回坐上首座，手一直按在膝盖上，整场都没敢松开。"
 LYY_PW_The_Southbound_Caravan:"南行商队"
 LYY_PW_The_Southbound_Caravan_desc:"南行的商队驮着盐、铁器与瓷器出城，回程带回香料与药材。凝光在给领队的信里写：货可以贱卖，路不能不认。有人问她为何在意一条商道的名分，她答：路是别人踩出来的，认不认，得看走过的人肯不肯替你多说一句。"
 LYY_PW_Engineers_of_Liyue:"璃月工匠"
 LYY_PW_Engineers_of_Liyue_desc:"头一所工学堂开学，讲机关、水文、冶金，也讲怎么算一项工程该不该上马。凝光在开学那天说：从前凿山引水，靠的是一位神明抬手；如今得自己学会看图纸。台下有位老先生起身行了一礼，礼行得很慢，谁也没催他。"
 LYY_PW_Envoys_of_the_Quay:"通商使节"
 LYY_PW_Envoys_of_the_Quay_desc:"战后头一批使节出海，带的是账册和税则，不是厚礼。凝光对领使说：先让人看清我们怎么算账，再谈怎么做买卖。有人嫌这姿态硬。她说：先亮账本的人，才配谈信用。使船离港那天码头空荡，只有灯塔亮着。"
 LYY_PW_The_Wind_Accord:"风与自由之约"
 LYY_PW_The_Wind_Accord_desc:"蒙德的使节带来风车图样和两桶酒。凝光与他谈了一夜，签下的头一份文书是一张税率互认的清单。她把酒杯推到一边，说：你们不靠神明管，我们刚学会也不靠；剩下的，就该拿数目说话了。"
 LYY_PW_The_Thunder_Route:"雷鸣航路"
 LYY_PW_The_Thunder_Route_desc:"稻妻的使船在雷雨里泊进港。凝光没有绕开当年封港的旧怨，只说：锁国锁住的，从来是锁门那家人自己。两边商船头一回被准许并排停靠。有个老水手趴在船舷上看了很久，说这是他这辈子见过最耐看的一场雨。"
 LYY_PW_The_Sands_of_Wisdom:"识海之邦"
 LYY_PW_The_Sands_of_Wisdom_desc:"须弥的学者带来成箱的图纸与典籍。凝光腾出半座账学馆安顿这些书，却在扉页上统一盖了印：书归众人。有学者不快，她答：你们教给璃月的，不该只教给璃月的官。那位学者沉默半晌，末了自己也补盖了一枚。"
 LYY_PW_The_Banks_of_Judgment:"律水之岸"
 LYY_PW_The_Banks_of_Judgment_desc:"枫丹的使者在桌上摊开一整部法典。凝光读了一夜，第二日带着自家章程赴会，逐条比对。她说：法不嫌多，只怕只许一个人念。两国末了互换了判词范本，谁也没吃亏。散会时枫丹的使者评价：璃月人算账，比我们想的更硬。"
 LYY_PW_The_Worlds_Fair:"万国商展"
 LYY_PW_The_Worlds_Fair_desc:"万国商展设在旧税关的空场上，各国货栈排成三行。凝光没有剪彩，只让各国掌事自己抽签定摊位。有人问她为何不把最旺的位子留给璃月商号，她答：展场是给人看的，不是给自己人捧场的；今年让出一寸，明年别人才肯让出一尺。"
 LYY_PW_The_Empty_Altar:"空坛之问"
 LYY_PW_The_Empty_Altar_desc:"帝君的神位空着，凝光没有撤去香案。她只在坛前摆了一只空托盘，对议会众人说：从前做每件事，都要先问一句神的脸色；如今这托盘空着，正好让我们看清，自己的账算得正不正。此后每逢大事，香案上都留着那只空盘。"
 LYY_PW_Contract_over_Oracle:"以契代谕"
 LYY_PW_Contract_over_Oracle_desc:"凝光命人把历年神谕、天象与谶纬整理成册，逐条注明出处与真伪。整理的官吏越查越心惊，她却在卷尾写道：我们是给后人留一本能自己判断的书。这册子后来摆在账学馆最显眼的那格书架上，翻得比任何典籍都旧。"
 LYY_PW_The_Chasm_Debt:"巨渊旧债"
 LYY_PW_The_Chasm_Debt_desc:"层岩的裂缝又封了一遍，这次用的是新铸的合金与双股绳。凝光亲自下到井口，看着最后一段闸门落定。她说：巨渊是一笔按月要还的旧债。今天多还一分，往后的人就少赌一次命。井口的工人齐刷刷直起腰，朝着闸门站了很久。"
 LYY_PW_The_Quiet_Sky:"天空的沉默"
 LYY_PW_The_Quiet_Sky_desc:"凝光差人把历次祈天、观星、卜筮的记录并在一处，逐条比对，发现天空岛的回音一次比一次轻。她没有焚香，只在册子上批了一行：它不说话，我们便当它不在。这句后被抄进议会备忘，成了往后诸事的定例。"
 LYY_PW_Envoys_to_Celestia:"云上之使"
 LYY_PW_Envoys_to_Celestia_desc:"通往天空岛的路一直无人应答。凝光还是遣了使节，带去的是一封问话：若天理仍在，请现身谈一谈；若不在，请容我们自己走路。使节两手空空回来，她在回执上批了两个字：已知。那卷空白回函收进了档案库头一格。"
 LYY_PW_The_Mortals_Balance:"凡人自有其秤"
 LYY_PW_The_Mortals_Balance_desc:"关于神之眼、仙人与天授的争论在议会里吵了几个月。凝光末了只说一句：璃月往后由谁说了算，不再看谁的位子高，只看谁的道理站得住。这话被刻上了议事厅的门楣，字不算好看，却没人提议换掉。有个老石匠天天进门都要抬头看一眼。"
 LYY_PW_The_Harbor_Guard:"港防新军"
 LYY_PW_The_Harbor_Guard_desc:"新军改叫港防营，军饷照旧，旗换了。凝光在检阅时说：这支队伍从前的规矩是不退，如今的规矩是知道自己在护着谁。队伍里静了很久，随后响起的口号与从前不太一样。有个年轻兵喊完，偷偷抹了下眼睛，被旁边的老兵用肘子轻轻撞了一下。"
 LYY_PW_The_Sea_Watch:"海上巡防"
 LYY_PW_The_Sea_Watch_desc:"巡防船队沿着商路来回，不为争雄，只为让每一艘挂璃月旗的船能平安回家。凝光在给船队的训令里加了一条：遇商船遇险，先救人，再论货。有人笑她多此一举。她说：能把货卖到天涯的人，也该有本事把家守到天涯。"
 LYY_PW_The_Southern_Wardens:"南疆戍卫"
 LYY_PW_The_Southern_Wardens_desc:"南疆的戍卫队招的是本地山民与猎户。凝光给他们的头一条命令是认路：哪条道能走骡马，哪处崖能藏人。她说：守土的人，先得是懂这片土的人。半年后这支队伍自己画出一张比官图还细的山川图，连哪条溪旱季会断都有标注。"
 LYY_PW_The_Militia_Charter:"团练章程"
 LYY_PW_The_Militia_Charter_desc:"团练不再只是被征来凑数的人头，是各坊各号登记在册的护丁。操练课目里加了一条：先学会怎么不误伤自己人。凝光说：上过战场的人才知道，最难的是枪口抬高一寸。这句话后来被抄进了操典头一页，纸角磨得极旧。"
 LYY_PW_The_Maritime_Court:"海事法庭"
 LYY_PW_The_Maritime_Court_desc:"海事法庭设在码头边的小楼里，门前不摆石狮，只挂一块写开审时辰的木牌。头一案是两家船行争一处泊位。凝光没有亲裁，把判词交给三位素不相识的行首共署。一位行首签完手心全是汗，说：我从没判过案。她答：正因为没判过，这一判才值钱。"
 LYY_PW_Arsenal_of_Liyue:"璃月兵工"
 LYY_PW_Arsenal_of_Liyue_desc:"兵工厂从港口迁进山坳，产量翻了一倍，附近村子也跟着富了些。凝光定下一条规矩：厂里出的每一件兵器都要刻上工匠的名字。她说：有人认领的东西，才不会随便杀人。头一件刻了名的枪挂在厂门口示众，那位工匠每天路过都要停一下。"
 LYY_PW_Envoy_to_Yuheng:"玉衡的和解"
 LYY_PW_Envoy_to_Yuheng_desc:"玉衡的回信很短：账我可以信你，人却不能。信后却附来一份八省人口清册，字迹工整，显然是亲手所录。凝光把清册翻了一遍又一遍，末了对幕僚说：你瞧，肯骂我的人，才真把我当回事。骂都不肯骂的，是早就打算不理我了。"
 LYY_PW_Envoy_to_Yuehai:"月海亭的账"
 LYY_PW_Envoy_to_Yuehai_desc:"月海亭的粮账寄到，细得连一石米的去路都有批注。文末写着：你算得清金钱，我算得清米粮，两样加在一起，才勉强算得清一个璃月。凝光盯着勉强二字看了很久，忽然意识到自己引以为傲的那本账簿，在真正的民生面前薄得可怜。"
 LYY_PW_The_Jueyun_Question:"绝云间之问"
 LYY_PW_The_Jueyun_Question_desc:"绝云间的回信来得迟，也冷。使者带回一片不化的雪，附言只有八个字：你们的律，量不出雪山的重量。凝光把那片雪搁在案头，看它整夜不化。她一生都在衡量、定价、核算，却从没为这样一片没有用处、也标不出价钱的雪留过位置。"
 LYY_PW_The_Table_at_Mist_Harbor:"云来海的一桌酒"
 LYY_PW_The_Table_at_Mist_Harbor_desc:"公子的船队泊在港外，甲板上摆了一桌酒。使者回来禀报，那位执行官不谈打仗，只谈秩序，谈得比谁都像个商人。凝光听完，把茶盏放下，说：会做生意的敌人，比只会打仗的敌人更难对付。她随即吩咐备一份最厚的账册送去。"
 LYY_PW_The_Scale_of_Chenyu:"沉玉谷的秤"
 LYY_PW_The_Scale_of_Chenyu_desc:"使者带着一箱账册上沉玉谷，只为说明璃月港也能算清山水的账。蓝砚没接账册，只回赠一杆藤编的旧秤，秤上没有刻度。附言说：你们的契，量不出水土的重量。凝光把秤端详了很久，此后一直摆在案头，谁也不许动。"
 LYY_PW_The_South_Cross_Route:"重开南十字航路"
 LYY_PW_The_South_Cross_Route_desc:"南十字的老航道关了多年，礁图早已过时。凝光遣人重测水线，又请了几位走过旧路的老舵手同行。有幕僚说这条线绕远，赚不了几个钱。她把旧礁图展开，说：有些路留着，是为了让人知道这座城还敢往外看。"
 LYY_PW_The_Name_of_Ningguang:"凝光之名"
 LYY_PW_The_Name_of_Ningguang_desc:"有人提议把港口改名作天权港，被凝光否了。她说：后世记不记得我，不该由一块牌子上写着什么决定。后来牌子还是立了起来，上面刻的是一句她亲手写的话：此港属众人。立碑那日没有仪式，只有几个孩子在碑前用石子画了跳房子的格子。"
 LYY_PW_The_Balance_Question:"铸衡之辩"
 LYY_PW_The_Balance_Question_desc:"新秤立住之后，往哪头加码成了难题。凝光把议事厅的门开了三日，谁都能进来讲。三日之后纸堆了半人高，争论没停。她看着这堆纸说：吵不完最好。吵完了，才是真没人敢开口了。那三日，厅里的灯一直亮到天明。"
 LYY_PW_Free_Port_Charter:"自由通商"
 LYY_PW_Free_Port_Charter_desc:"自由通商的长文里最难写的是义务。凝光删改再三，在头一条写下：凡在本港经营者，无论贵贱贫富，皆同守一法。有老士绅当场摔了茶盏，也有人默默抄了副本带走。此后每逢争执，总有人把这份宪章掏出来当尺子使。"
 LYY_PW_Independent_Courts:"独立法司"
 LYY_PW_Independent_Courts_desc:"法司迁出了议事厅，搬进临街一栋小楼。凝光亲自把民可问官四个字刻上石阶，又撤了门口的石狮。她说：法院若设在衙门里，就永远是衙门里的家法；只有搬到街上，它才可能成为百姓的靠山。头一日，一个穿旧鞋的农人犹豫着不敢进，门吏替他引了座。"
 LYY_PW_The_Assembly_of_Quays:"商埠议会"
 LYY_PW_The_Assembly_of_Quays_desc:"商埠议会头一次开会，八个区用八种口音吵了整日。凝光坐在末排，一句没插。散会时有人来问她为何不主持，她笑：我一开口，他们看的就是我的脸色，不是对面那个人的道理。这样的会，开了也是白开。那人怔了怔，转身走了。"
 LYY_PW_The_Open_Ledgers:"公账公开"
 LYY_PW_The_Open_Ledgers_desc:"公账公开那日，码头边架起一块巨板，一笔一笔写清每枚摩拉的来去。有个较真的账房带了算盘来核，核到深夜也没找出漏洞，悻悻而去。凝光远远看着，心里清楚，她真正怕的从来是有一天再没人愿意来查。"
 LYY_PW_Abolish_the_Guild_Monopoly:"废行会专营"
 LYY_PW_Abolish_the_Guild_Monopoly_desc:"废专营令一下，几十年的行会壁垒塌了。老掌事们举着写有传统的牌子在商会门前站了一天。凝光从窗前看着，没有动气，只想起当年有多少新匠人的手艺，就是这样被传统两个字活活攥死在门里。她什么也没说，转身继续批卷。"
 LYY_PW_Schools_of_Law:"律学馆"
 LYY_PW_Schools_of_Law_desc:"律学馆开在旧日讼师的隔壁，两扇门只隔一墙。凝光请来退职的判官、账房先生，也请了几个名声不佳的讼棍来讲课。有人质疑讼棍也配登堂，她答：让百姓懂法，是让他们知道，法是攥在手里能用的。"
 LYY_PW_The_Constitutional_Quay:"宪政港约"
 LYY_PW_The_Constitutional_Quay_desc:"宪政港约把港、市、坊、田的权责写成明文，最后一条是还政之期。有议员劝她留个活口，凝光摇头，提笔把日子写得清清楚楚。她说：给自己留后路的人，配不上一座城的信任。按印那日群玉阁落了一场细雨，台下静了很久。"
 LYY_PW_The_Open_Quay:"万国商埠"
 LYY_PW_The_Open_Quay_desc:"万国商埠的名号挂上港门时，凝光让人把门楣上的临时二字一并凿去。她站在门下对身边人说：我这一生也许只做成了一件事，就是让这座城的门，由门里的人自己说了算该对谁开。风从海上吹来，把新漆的气味吹得很远。"
 LYY_PW_Merchant_Privy:"商会枢密"
 LYY_PW_Merchant_Privy_desc:"商会枢密无衙无印，只在一间茶室里议事。十几个掌事围坐，一句尾音、一个眼神就能定下半座港口的命运。凝光坐在主位，看着这些比官府还像官府的人，忽然明白：她并没有推翻旧秩序，只是替旧秩序换了一身更体面的衣裳。"
 LYY_PW_The_Closed_Ledger:"密账不宣"
 LYY_PW_The_Closed_Ledger_desc:"密账不宣。天权要紧的几笔数目从此只写在两三本不对外的册子里。凝光告诉自己这是权宜之计，可那几本册子越积越厚，翻也翻不动。她比谁都清楚，一本不肯给人看的账，本身就是一份供状，只是少有人肯亲手写下自己的罪。"
 LYY_PW_Company_Spears:"商团私兵"
 LYY_PW_Company_Spears_desc:"商团私兵成军，旗号各归各家，号令却出自同一间茶室。士兵拿双份饷，认两个主。凝光检阅时想起刻晴那些被自己笑话过的民兵，如今才明白：用钱买来的兵比用信仰拢来的更听话，也更善变。钱一停，枪口就会转过弯来。"
 LYY_PW_The_Tariff_Walls:"关税壁垒"
 LYY_PW_The_Tariff_Walls_desc:"关税壁垒一道接一道立起来，把外货挡在港外。库里堆满卖不出去的东西，商人们反倒拍手称快，因为挡在外面的多是别人的货。凝光没有阻拦，只在深夜独自登楼看海。远处被壁垒切开的海面泛着微光，她站到衣角发冷才转身下楼。"
 LYY_PW_The_Guild_Supreme:"商会至上"
 LYY_PW_The_Guild_Supreme_desc:"商会至上的律条落下，天权商会从议事的厅堂变成了发号施令的衙门。律法要看商会的脸色，官吏要经商会遴选。凝光在这条路上走得极稳，稳到有天清晨对镜梳妆，忽然认不出镜中那个下令的人，是自己，还是当年她憎恨过的影子。"
 LYY_PW_Bonds_of_Loyalty:"权债"
 LYY_PW_Bonds_of_Loyalty_desc:"权债是一纸以忠诚作抵押的契约，谁借了这笔钱，谁就在下次表决时欠凝光一票。她把权力做成了账，做得很漂亮。可账最怕的从来是有一天利滚利到谁也还不起，到那时，收账的和欠账的都要跟着这座城一起沉下去。"
 LYY_PW_The_Northern_Mortgage:"至冬的抵押"
 LYY_PW_The_Northern_Mortgage_desc:"北国的密使来得比商队还勤，不谈货，只谈一份能把整个港口租借出去的合约。凝光读了三遍，在末尾批道：生意可做，港口不做抵押。密使冷冷问她可想过代价，她答：算过了，比你算得清楚。那夜她独自坐了很久，直到烛火烧到尽头。"
 LYY_PW_Tianquan_Eternal:"天权永固"
 LYY_PW_Tianquan_Eternal_desc:"天权永固四字刻上府门那日，全城张灯。凝光端坐在最高处，看着脚下万家灯火，却在最喧闹的一刻想起多年前那个刚接手商会、还相信账目能衡量一切的小姑娘。她没有致辞，只在心里把临时二字又默念了一遍，念得很慢。"
 LYY_PW_Liyue_One_Scale:"璃月一秤"
 LYY_PW_Liyue_One_Scale_desc:"璃月重归一秤那日，凝光把两本账并在一处：一本记商港的进出，一本记天授的去留。她翻到末页，在空白处写了一行：秤上的两砣，今日终于能放在同一张桌上称了。写完她合上账，窗外码头的灯一盏盏亮起来，像有人把整条海岸线重新描了一遍。"
 LYY_PW_The_Long_Ledger:"长账"
 LYY_PW_The_Long_Ledger_desc:"长账的扉页只写了一句话：此账不封。凝光把群玉阁的钥匙交出去那日，没有留副本，只留了一句交代：往后谁当家，谁就把这本账接着往下写，写不下去的时候，也要写。她走出府门时天刚亮，码头上已经有了吆喝声。"
 LYY_PW_The_Open_Horizon:"海上无主之地"
 LYY_PW_The_Open_Horizon_desc:"商船渐远，海图上的空白也一格格被填上。凝光在给远洋船队的训令里写：凡到一处，先问当地怎么算账，再问当地怎么守约。有人问她图什么，她望着桅杆外的海说：图这条海上，往后不再只有一种旗，也不再只有一种规矩。"

 LYY_postwar_category:"天权新秤"
 LYY_postwar_category_desc:"凝光战后的施政决议组。乱局既定，天权星要把商港的繁荣重新撑起来，整顿税关、安抚商民与重建信誉皆在此列。港口的灯火亮起来，璃月的元气才算真正回来，商路与人心也才会慢慢聚拢。港口的生意起来了，别的事情也就有了着落。"
 LYY_decision_pw_grain_subsidy:"平粜粮价"
 LYY_decision_pw_grain_subsidy_desc:"米价一涨，人心就晃。开仓平粜是最亏本的一笔开销，也是唯一能让穷家在米价疯长的夜里睡得着的一笔。天权的账房算过，这笔钱花出去，收不回来，还得接着花。"
 LYY_decision_pw_harbor_works:"兴修港工"
 LYY_decision_pw_harbor_works_desc:"修栈桥、挖航道、补堤岸，能让闲下来的手有活干，也能让一座刚打完仗的港不至于闲出乱子。凝光批钱从不问赚不赚，只问能雇多少人。"
 LYY_decision_pw_ledger_drill:"核账度支"
 LYY_decision_pw_ledger_drill_desc:"把过去一年的进出一页页翻过去，看哪一笔写着谁在吃什么。核账不为追责，只为在下一笔钱花出去之前，让所有人先看清这座城的家底还剩多少。"
 LYY_decision_pw_market_fair:"开市招商"
 LYY_decision_pw_market_fair_desc:"把码头敞开，让货物流起来。市声喧闹处，钱来得快，是非也来得快；可一座不肯做买卖的港口，很快就会变成一座死港。"
 LYY_decision_pw_harbor_patrol:"巡防航路"
 LYY_decision_pw_harbor_patrol_desc:"船出海，总要有人替它记着回家的路。巡防不为争雄，只为让海盗与散兵知道，这条航道上跑的货，是有人桩的。"
 LYY_decision_pw_buy_loyalty:"金帛结好"
 LYY_decision_pw_buy_loyalty_desc:"用金银买来的交情最真诚，也最短命。每一次馈赠都是一笔投资，投的是别人此刻的点头，抵押的却是这座城往后的信誉。"
 LYY_decision_pw_public_ledger:"公示公账"
 LYY_decision_pw_public_ledger_desc:"把账挂在所有人都看得见的地方，是勇气，也是自缚。可一个不敢被人查账的政府，与一个不敢摊开的商号，本就没有分别。"
 LYY_decision_pw_recruit_clerk:"招录书吏"
 LYY_decision_pw_recruit_clerk_desc:"新政需要会写字的手，也需要守得住秘密的嘴。招录书吏既是补人手，也是在凝光身边，慢慢织起一张只认得章程、认不得旧情的网。"
 LYY_decision_pw_issue_bonds:"发行公债"
 LYY_decision_pw_issue_bonds_desc:"公债是把明天的钱借到今天来花。借的时候千金散尽，还的时候才知道，真正抵押出去的，是往后每一代璃月人对这座城的信任。"
 LYY_decision_pw_envoy_to_yuheng:"使者赴玉衡"
 LYY_decision_pw_envoy_to_yuheng_desc:"使者带去的是账册，不是盟书。凝光附言：政见可以不同，账本总要有人会看。她清楚，一个能坐下来和你算账的对手，比满口空谈的朋友更有用处。"
 LYY_decision_pw_envoy_to_yuehai:"使者赴月海亭"
 LYY_decision_pw_envoy_to_yuehai_desc:"月海亭的檐角挂着未化的霜。使者带回一份细到石米的粮账，还有甘雨的一句题外话：账目清楚的人，才配谈天下。凝光把这句话抄进了自己的手札。"
 LYY_decision_pw_envoy_to_jueyun:"使者赴绝云间"
 LYY_decision_pw_envoy_to_jueyun_desc:"绝云间不问世事，使者却被留了三日。回程时他带回一片不化的雪，和一句冷评：你们的律，量不出雪山的重量。凝光端详着那片雪，很久没有说话。"
 LYY_decision_pw_envoy_to_mist_harbor:"使者赴云来海"
 LYY_decision_pw_envoy_to_mist_harbor_desc:"公子的船队泊在港外，甲板上摆着一桌酒。使者回来说，那位执行官不谈打仗，只谈秩序，谈得比谁都像个商人。凝光听完只说：会做生意的敌人，更难对付。"
 LYY_decision_pw_envoy_to_chenyu:"使者赴沉玉谷"
 LYY_decision_pw_envoy_to_chenyu_desc:"使者带一箱账册上山，只为向蓝砚证明璃月港也能量清山水的账。蓝砚没接，只回赠一杆没有刻度的旧秤，说：你们的秤量货，我的秤量山。"
 LYY_decision_pw_maritime_court_seat:"设海事法庭"
 LYY_decision_pw_maritime_court_seat_desc:"码头边腾出一栋小楼，挂上开审时辰的木牌。争码头、抢泊位、扣货物，往后都到这张案前来说理。凝光不坐堂，只吩咐把判词逐案留档。"
 LYY_decision_pw_proclaim_the_compact:"颁行天权新约"
 LYY_decision_pw_proclaim_the_compact_desc:"凝光把曾经敌对、中立、观望的各方请到同一张长桌前。她说：一个只由赢家签字的合约，撑不过下一次翻脸。这一纸新约，是她给天权出的最后一道题。"

 LYY_Event.9001.t:"天权新秤"
 LYY_Event.9001.d:"内战收场那日，凝光把群玉阁的旧秤抬到港口正中，当众砸了。她说：从前这杆秤称货也称人，两头都不准。新铸的秤只称货，称人的那一半，往后交给律法与账本。\n围观的人里有老掌事当场红了眼。散场后铸秤的匠人问要不要把碎铜收回去熔了。她答：不必。让它在港口多躺几日，让多看几眼，才知道今天砸的是什么。"
 LYY_Event.9001.a:"新秤只管称货，不称人"
 LYY_Event.9001.b:"旧秤留着，废立并行"
 LYY_Event.9002.t:"清港的三百人"
 LYY_Event.9002.d:"断桅与沉船堵在泊位上，凝光雇了三百个内战里失了业的船工来清港，工钱按日结，米按时发。\n一个老船工收工后问她：港清完了，还雇不雇人？凝光答：港清完了还有码头，码头修完了还有城。活计不会断，只要你肯来。老人把铁钩往肩上一搁，没再说话，第二天来得比谁都早。"
 LYY_Event.9002.a:"按日结钱，雇本城船工"
 LYY_Event.9002.b:"征用民夫，从速清港"
 LYY_Event.9003.t:"港坊重划"
 LYY_Event.9003.d:"港坊按手艺与人头重划，染坊、铁坊、船坊各归一处，谁也不许多占一尺。有人托旧日商会的门路来讨地，被账房先生挡在门外。\n来求情的人悻悻地问：那我们从前置下的铺面，算不算数？凝光答：从前的铺面是买来的，今天的地是分出来的。这两笔账，不能并到一处算。"
 LYY_Event.9003.a:"地按人头手艺分，旧契作废"
 LYY_Event.9003.b:"承认旧铺面，只调超额"
 LYY_Event.9004.t:"早市那斤盐"
 LYY_Event.9004.d:"开市头一日，凝光遣人敲了三下码头的旧锣，又撤了三道关卡税。她自己去早市买了一斤最便宜的盐，付过钱才走。\n摊主愣着不敢收，她把铜钱按在案上，说：你收的是市价，我付的是市价，谁也不欠谁的人情。那日开张的摊子比预想的多了一倍，收摊时还有人舍不得把幌子摘下来。"
 LYY_Event.9004.a:"市价由摊主自定"
 LYY_Event.9004.b:"限价稳市，先保民生"
 LYY_Event.9005.t:"界桩重打"
 LYY_Event.9005.d:"梯田的旧契在战火里烧了大半，凝光索性下了一道笨告示：谁种的归谁，旧契作废，有异议到衙门口来议。告示贴出三日，无人上门。\n第四日，一个老农抱着残契来了。账房先生当着他的面把界桩重打了一遍，他才把契纸收进怀里。走出衙门时他把契纸撕了，碎纸落进土里，他弯腰攥住第一捧新土。"
 LYY_Event.9005.a:"还田于耕者，重打界桩"
 LYY_Event.9005.b:"田归公仓，按劳分配"
 LYY_Event.9006.t:"五把钥匙"
 LYY_Event.9006.d:"义仓的钥匙铸了五把，交到五户人家手里，缺一户便开不了门。有幕僚劝凝光收回钥匙，说调粮不便。\n她摇头：仓里的粮是五户凑的，锁就该五户来开。今日为图省事把钥匙收回来，明日仓空了，也不会有人替它心疼。五把钥匙里有一把，后来被锁进了镇上最老的那间私塾。"
 LYY_Event.9006.a:"钥匙分五户共管"
 LYY_Event.9006.b:"收回钥匙，由官总揽"
 LYY_Event.9007.t:"一人一行"
 LYY_Event.9007.d:"清册挨家挨户地登，只登人头、田亩、手艺，不登家资。有吏员抱怨条目太细。\n凝光把册子递过去给他看：这上头每一个人，从前在官府的账里都只是个数目；从今天起，他至少各占一行。吏员低头舔了舔笔尖，那日写得比往常工整。收册那晚，他把自己父亲的名字又核了一遍，怕写错了。"
 LYY_Event.9007.a:"一人一行，务求详尽"
 LYY_Event.9007.b:"只登商籍，不问民户"
 LYY_Event.9008.t:"账学馆头一课"
 LYY_Event.9008.d:"账学馆开学头一课，讲的是怎么看出一份借契里的花头。听课的有船工、货郎、替人看铺的伙计。\n凝光亲自来坐了一下午，末了说：会算账的人多了，敢骗人的就少了。散课时，有个伙计把这句话抄在袖口上，回家路上念了一路。第二天他娘问他袖子上写的什么，他一个字一个字念给她听。"
 LYY_Event.9008.a:"账学馆广开，不问出身"
 LYY_Event.9008.b:"只收聪敏者，免耗钱粮"
 LYY_Event.9009.t:"铸币厂的炉火"
 LYY_Event.9009.d:"铸币厂的炉子砌在旧钱庄的废址上。凝光定下成色与重量，铸一枚验一枚，验不过的当场回炉。\n有老掌事送来旧摩拉想掺着用，被她当众退了回去。她说：钱这东西，自己重一分，别人才肯信你一分；自己轻一分，往后就得拿命去补。头一批新钱发到码头那天，验钱的人排了两条街。"
 LYY_Event.9009.a:"铸新钱，定成色重量"
 LYY_Event.9009.b:"沿用旧钱，暂缓改铸"
 LYY_Event.9010.t:"矿车出山"
 LYY_Event.9010.d:"铁轨从港口一直铺到层岩的矿口，第一根枕木是凝光亲手放下的。她对监工说：从前运一车矿，路上要折损两条人命；往后要折损的，只能是石头。\n有人笑她算得过细，直到第一列满载的矿车轰隆隆出了山口，看热闹的人把帽子都挤掉了。有个老矿工站在路边，伸手摸了摸铁轨，摸得很轻。"
 LYY_Event.9010.a:"铁轨直铺巨渊"
 LYY_Event.9010.b:"暂缓工事，先固边防"
 LYY_Event.9011.t:"首座上的年轻人"
 LYY_Event.9011.d:"行会重立，凝光只提一个条件：掌事由匠人自己推。老掌事想按资历排座次，被她驳回。\n她说：行会护的是手艺，不是谁家祖上开过几间铺子。有个打铜的年轻人头一回坐上首座，手一直按在膝盖上，整场都没敢松开。散会后他偷偷问人：下回还让我坐这里吗？回答说：你手艺在，就还在。"
 LYY_Event.9011.a:"掌事由匠人自推"
 LYY_Event.9011.b:"掌事由官府指派"
 LYY_Event.9012.t:"南行的商队"
 LYY_Event.9012.d:"南行的商队驮着盐、铁器与瓷器出城，回程带回香料与药材。凝光在给领队的信里写：货可以贱卖，路不能不认。\n有人问她为何在意一条商道的名分，她答：路是别人踩出来的，认不认，得看走过的人肯不肯替你多说一句。商队回城那日，领队把沿途各处收的路引一张张摊开，铺了半张桌子。"
 LYY_Event.9012.a:"商道认路不认官"
 LYY_Event.9012.b:"商道仍由官府设卡"
 LYY_Event.9013.t:"图纸与神迹"
 LYY_Event.9013.d:"头一所工学堂开学，讲机关、水文、冶金，也讲怎么算一项工程该不该上马。\n凝光在开学那天说：从前凿山引水，靠的是一位神明抬手；如今得自己学会看图纸。台下有位老先生起身行了一礼，礼行得很慢，谁也没催他。他坐下时，把随身那本旧的水利手记推到了同桌面前。"
 LYY_Event.9013.a:"设工学堂，自绘图纸"
 LYY_Event.9013.b:"重金礼聘外邦匠师"
 LYY_Event.9014.t:"先亮账本"
 LYY_Event.9014.d:"战后头一批使节出海，带的是账册和税则，不是厚礼。凝光对领使说：先让人看清我们怎么算账，再谈怎么做买卖。\n有人嫌这姿态硬。她说：先亮账本的人，才配谈信用。使船离港那天码头空荡，只有灯塔亮着。领使在舱里把税则翻到卷角，一路没合过眼。"
 LYY_Event.9014.a:"先亮账本，再谈买卖"
 LYY_Event.9014.b:"厚礼开道，先结善缘"
 LYY_Event.9015.t:"风车与酒"
 LYY_Event.9015.d:"蒙德的使节带来风车图样和两桶酒。凝光与他谈了一夜，签下的头一份文书是一张税率互认的清单。\n她把酒杯推到一边，说：你们不靠神明管，我们刚学会也不靠；剩下的，就该拿数目说话了。临别时蒙德的客人留下一句：不靠神明的人，也得学着不靠别人活着。"
 LYY_Event.9015.a:"签互市清单，平等往来"
 LYY_Event.9015.b:"缔结攻守，共御外敌"
 LYY_Event.9016.t:"雷雨里的泊位"
 LYY_Event.9016.d:"稻妻的使船在雷雨里泊进港。凝光没有绕开当年封港的旧怨，只说：锁国锁住的，从来是锁门那家人自己。\n两边商船头一回被准许并排停靠。有个老水手趴在船舷上看了很久，说这是他这辈子见过最耐看的一场雨。雨停时他拍了拍缆桩，像在拍一个多年不见的老熟人。"
 LYY_Event.9016.a:"并肩停靠，共守航路"
 LYY_Event.9016.b:"划界而治，各不相扰"
 LYY_Event.9017.t:"扉页上的印"
 LYY_Event.9017.d:"须弥的学者带来成箱的图纸与典籍。凝光腾出半座账学馆安顿这些书，却在扉页上统一盖了印：书归众人。\n有学者不快，她答：你们教给璃月的，不该只教给璃月的官。那位学者沉默半晌，末了自己也补盖了一枚。他盖完把印举起来看了看，说：这枚印我认得，是我的。"
 LYY_Event.9017.a:"典籍归众人，公开誊抄"
 LYY_Event.9017.b:"典籍入官库，择人传授"
 LYY_Event.9018.t:"法典之夜"
 LYY_Event.9018.d:"枫丹的使者在桌上摊开一整部法典。凝光读了一夜，第二日带着自家章程赴会，逐条比对。\n她说：法不嫌多，只怕只许一个人念。两国末了互换了判词范本，谁也没吃亏。散会时枫丹的使者评价：璃月人算账，比我们想的更硬。她说：算得硬，才谈得久。"
 LYY_Event.9018.a:"互换判词，互鉴其法"
 LYY_Event.9018.b:"自定家法，不采外例"
 LYY_Event.9019.t:"抽签定的摊位"
 LYY_Event.9019.d:"万国商展设在旧税关的空场上，各国货栈排成三行。凝光没有剪彩，只让各国掌事自己抽签定摊位。\n有人问她为何不把最旺的位子留给璃月商号，她答：展场是给人看的，不是给自己人捧场的；今年让出一寸，明年别人才肯让出一尺。抽签那日，有位外国掌事抽到末位，反倒笑了。"
 LYY_Event.9019.a:"抽签定摊位，各国同席"
 LYY_Event.9019.b:"优位留给本国商号"
 LYY_Event.9020.t:"旧礁图"
 LYY_Event.9020.d:"南十字的老航道关了多年，礁图早已过时。凝光遣人重测水线，又请了几位走过旧路的老舵手同行。\n有幕僚说这条线绕远，赚不了几个钱。她把旧礁图展开，说：有些路留着，是为了让人知道这座城还敢往外看。老舵手们围在案前，一笔一笔把记忆里的暗礁补了上去。"
 LYY_Event.9020.a:"重测水线，重开航道"
 LYY_Event.9020.b:"封存旧图，不再远航"
 LYY_Event.9021.t:"坛前的空盘"
 LYY_Event.9021.d:"帝君的神位空着，凝光没有撤去香案。她只在坛前摆了一只空托盘，对议会众人说：从前做每件事，都要先问一句神的脸色；如今这托盘空着，正好让我们看清，自己的账算得正不正。\n此后每逢大事，香案上都留着那只空盘。有次一个小吏顺手往里放了枚铜钱，被老掌事拦下，把铜钱还了回去。"
 LYY_Event.9021.a:"空盘置于坛前，自省其位"
 LYY_Event.9021.b:"请人入座，另立共主"
 LYY_Event.9022.t:"问天册"
 LYY_Event.9022.d:"凝光命人把历年神谕、天象与谶纬整理成册，逐条注明出处与真伪。整理的官吏越查越心惊。\n她却在卷尾写道：我们是给后人留一本能自己判断的书。这册子后来摆在账学馆最显眼的那格书架上，翻得比任何典籍都旧。书脊上有人用炭笔写了两个字：凭据。"
 LYY_Event.9022.a:"整理神谕，留册后人"
 LYY_Event.9022.b:"焚毁旧典，重立新说"
 LYY_Event.9023.t:"落下的闸门"
 LYY_Event.9023.d:"层岩的裂缝又封了一遍，这次用的是新铸的合金与双股绳。凝光亲自下到井口，看着最后一段闸门落定。\n她说：巨渊是一笔按月要还的旧债。今天多还一分，往后的人就少赌一次命。井口的工人齐刷刷直起腰，朝着闸门站了很久。上升降梯时，谁也没先说话。"
 LYY_Event.9023.a:"铸新闸，亲下井口"
 LYY_Event.9023.b:"循旧法，勉力维持"
 LYY_Event.9024.t:"不回音的册子"
 LYY_Event.9024.d:"凝光差人把历次祈天、观星、卜筮的记录并在一处，逐条比对，发现天空岛的回音一次比一次轻。\n她没有焚香，只在册子上批了一行：它不说话，我们便当它不在。这句后被抄进议会备忘，成了往后诸事的定例。有个年轻书吏私底下问，这样写妥不妥；老书吏说，妥不妥，写着写着就知道了。"
 LYY_Event.9024.a:"记下沉默，当作不在"
 LYY_Event.9024.b:"再遣祈天，以问吉凶"
 LYY_Event.9025.t:"云上的回执"
 LYY_Event.9025.d:"通往天空岛的路一直无人应答。凝光还是遣了使节，带去的是一封问话：若天理仍在，请现身谈一谈；若不在，请容我们自己走路。\n使节两手空空回来，她在回执上批了两个字：已知。那卷空白回函收进了档案库头一格。放档的吏员问要不要另做记号，她说：不必，空白本身就是记号。"
 LYY_Event.9025.a:"遣使问天，如实回报"
 LYY_Event.9025.b:"不问不答，各行其是"
 LYY_Event.9026.t:"门楣上的字"
 LYY_Event.9026.d:"关于神之眼、仙人与天授的争论在议会里吵了几个月。凝光末了只说一句：璃月往后由谁说了算，不再看谁的位子高，只看谁的道理站得住。\n这话被刻上了议事厅的门楣，字不算好看，却没人提议换掉。有个老石匠天天进门都要抬头看一眼，像在看一块新立的碑。他刻完那日，把凿子擦干净才收进箱里。"
 LYY_Event.9026.a:"刻字门楣，道理为先"
 LYY_Event.9026.b:"不刻一字，行胜于言"
 LYY_Event.9027.t:"换了旗的港防营"
 LYY_Event.9027.d:"新军改叫港防营，军饷照旧，旗换了。凝光在检阅时说：这支队伍从前的规矩是不退，如今的规矩是知道自己在护着谁。\n队伍里静了很久，随后响起的口号与从前不太一样。有个年轻兵喊完，偷偷抹了下眼睛，被旁边的老兵用肘子轻轻撞了一下。老兵什么也没说，把自己的水囊递了过去。"
 LYY_Event.9027.a:"改旗易号，叫港防营"
 LYY_Event.9027.b:"军制照旧，只换将校"
 LYY_Event.9028.t:"先救人，再论货"
 LYY_Event.9028.d:"巡防船队沿着商路来回，不为争雄，只为让每一艘挂璃月旗的船能平安回家。凝光在给船队的训令里加了一条：遇商船遇险，先救人，再论货。\n有人笑她多此一举。她说：能把货卖到天涯的人，也该有本事把家守到天涯。头一回救起别国的船，是场夜里的大风；被救的人上岸后，把船头的旗叠好送了过来。"
 LYY_Event.9028.a:"先救人，再论货"
 LYY_Event.9028.b:"护货为先，从速返航"
 LYY_Event.9029.t:"懂山的戍卒"
 LYY_Event.9029.d:"南疆的戍卫队招的是本地山民与猎户。凝光给他们的头一条命令是认路：哪条道能走骡马，哪处崖能藏人。\n她说：守土的人，先得是懂这片土的人。半年后这支队伍自己画出一张比官图还细的山川图，连哪条溪旱季会断都有标注。图呈上来那天，凝光让账房照抄了三份，分给户部、工部和船队。"
 LYY_Event.9029.a:"就地募人，先用懂山的"
 LYY_Event.9029.b:"调他处精锐，从严整训"
 LYY_Event.9030.t:"抬高一寸"
 LYY_Event.9030.d:"团练不再只是被征来凑数的人头，是各坊各号登记在册的护丁。操练课目里加了一条：先学会怎么不误伤自己人。\n有新兵不解，老兵就把他的枪口轻轻抬起来一点。凝光说：上过战场的人才知道，最难的是枪口抬高一寸。这句话后来被抄进了操典头一页，纸角磨得极旧，像是被人反复翻过。"
 LYY_Event.9030.a:"操典首条，慎伤己人"
 LYY_Event.9030.b:"以杀敌为先，不拘细目"
 LYY_Event.9031.t:"码头边的木牌"
 LYY_Event.9031.d:"海事法庭设在码头边的小楼里，门前不摆石狮，只挂一块写开审时辰的木牌。头一案是两家船行争一处泊位。\n凝光没有亲裁，把判词交给三位素不相识的行首共署。一位行首签完手心全是汗，说：我从没判过案。她答：正因为没判过，这一判才值钱。那案审了三日，输了的一方走时，还朝堂上拱了拱手。"
 LYY_Event.9031.a:"判词由行首共署"
 LYY_Event.9031.b:"庭上亲裁，速结此案"
 LYY_Event.9032.t:"刻了名的枪"
 LYY_Event.9032.d:"兵工厂从港口迁进山坳，产量翻了一倍，附近村子也跟着富了些。凝光定下一条规矩：厂里出的每一件兵器都要刻上工匠的名字。\n她说：有人认领的东西，才不会随便杀人。头一件刻了名的枪挂在厂门口示众，那位工匠每天路过都要停一下。有人问他在看什么，他说：看我自己的名字刻得正不正。"
 LYY_Event.9032.a:"兵器皆刻工匠之名"
 LYY_Event.9032.b:"兵器只标官厂之号"
 LYY_Event.9033.t:"开三日的大门"
 LYY_Event.9033.d:"新秤立住之后，往哪头加码成了难题。凝光把议事厅的门开了三日，谁都能进来讲。\n三日之后纸堆了半人高，争论没停。她看着这堆纸说：吵不完最好。吵完了，才是真没人敢开口了。那三日厅里的灯一直亮到天明，扫地的老仆每天早上都能扫出小半筐纸屑。"
 LYY_Event.9033.a:"开三日门，尽听其言"
 LYY_Event.9033.b:"择人而听，速定大计"
 LYY_Event.9034.t:"摔碎的茶盏"
 LYY_Event.9034.d:"自由通商的长文里最难写的是义务。凝光删改再三，在头一条写下：凡在本港经营者，无论贵贱贫富，皆同守一法。\n有老士绅当场摔了茶盏，也有人默默抄了副本带走。此后每逢争执，总有人把这份宪章掏出来当尺子使。那摔碎的茶盏碎片，被一个年轻书吏悄悄拾走了一角，说是留着提醒自己。"
 LYY_Event.9034.a:"颁自由通商之章"
 LYY_Event.9034.b:"缓议通商，先安士绅"
 LYY_Event.9035.t:"临街的小楼"
 LYY_Event.9035.d:"法司迁出了议事厅，搬进临街一栋小楼。凝光亲自把民可问官四个字刻上石阶，又撤了门口的石狮。\n她说：法院若设在衙门里，就永远是衙门里的家法；只有搬到街上，它才可能成为百姓的靠山。头一日，一个穿旧鞋的农人犹豫着不敢进，门吏替他引了座。他坐下后才敢相信，这楼真是为他这样的人开的。"
 LYY_Event.9035.a:"法司迁街，民可问官"
 LYY_Event.9035.b:"法司仍设衙门，维持官威"
 LYY_Event.9036.t:"八种口音"
 LYY_Event.9036.d:"商埠议会头一次开会，八个区用八种口音吵了整日。凝光坐在末排，一句没插。\n散会时有人来问她为何不主持，她笑：我一开口，他们看的就是我的脸色，不是对面那个人的道理。这样的会，开了也是白开。那人怔了怔，转身走了。第二日，他坐在了自己的位置上，一开口就有人反驳他。"
 LYY_Event.9036.a:"商埠议会分区对决"
 LYY_Event.9036.b:"统一号令，免其争吵"
 LYY_Event.9037.t:"带了算盘的人"
 LYY_Event.9037.d:"公账公开那日，码头边架起一块巨板，一笔一笔写清每枚摩拉的来去。有个较真的账房带了算盘来核，核到深夜也没找出漏洞，悻悻而去。\n凝光远远看着，心里清楚，她真正怕的从来是有一天再没人愿意来查。散场时她把那块板上的最后一笔又看了一遍，是一笔修堤的支出。"
 LYY_Event.9037.a:"公账全部公开"
 LYY_Event.9037.b:"只公开无关紧要之账"
 LYY_Event.9038.t:"写着传统的牌子"
 LYY_Event.9038.d:"废专营令一下，几十年的行会壁垒塌了。老掌事们举着写有传统的牌子在商会门前站了一天。\n凝光从窗前看着，没有动气，只想起当年有多少新匠人的手艺，就是这样被传统两个字活活攥死在门里。她什么也没说，转身继续批卷。傍晚时牌子收了，人散了，第二天铺子里多了几个新招牌。"
 LYY_Event.9038.a:"坚决废除行会专营"
 LYY_Event.9038.b:"暂留专营，安抚旧商"
 LYY_Event.9039.t:"隔壁的讼棍"
 LYY_Event.9039.d:"律学馆开在旧日讼师的隔壁，两扇门只隔一墙。凝光请来退职的判官、账房先生，也请了几个名声不佳的讼棍来讲课。\n有人质疑讼棍也配登堂，她答：让百姓懂法，是让他们知道，法是攥在手里能用的。那位讼棍讲完头一课，把讲稿留在了馆里，说是留给下一届抄。"
 LYY_Event.9039.a:"广设律学，教民知法"
 LYY_Event.9039.b:"律不外传，官权自持"
 LYY_Event.9040.t:"还政之期"
 LYY_Event.9040.d:"宪政港约把港、市、坊、田的权责写成明文，最后一条是还政之期。有议员劝她留个活口，凝光摇头，提笔把日子写得清清楚楚。\n她说：给自己留后路的人，配不上一座城的信任。按印那日群玉阁落了一场细雨，台下静了很久。散场时有人看见她把印举起又放下，放了两次才按实。"
 LYY_Event.9040.a:"写入还政之期"
 LYY_Event.9040.b:"只定权责，不定限期"
 LYY_Event.9041.t:"凿去的两个字"
 LYY_Event.9041.d:"万国商埠的名号挂上港门时，凝光让人把门楣上的临时二字一并凿去。\n她站在门下对身边人说：我这一生也许只做成了一件事，就是让这座城的门，由门里的人自己说了算该对谁开。风从海上吹来，把新漆的气味吹得很远。凿下来的两个字，被人收进库房，登记在册。"
 LYY_Event.9041.a:"凿去临时二字，开万国商埠"
 LYY_Event.9041.b:"保留临时的名分"
 LYY_Event.9042.t:"茶室里的座次"
 LYY_Event.9042.d:"商会枢密无衙无印，只在一间茶室里议事。十几个掌事围坐，一句尾音、一个眼神就能定下半座港口的命运。\n凝光坐在主位，看着这些比官府还像官府的人，忽然明白：她并没有推翻旧秩序，只是替旧秩序换了一身更体面的衣裳。散会后她独自留下，把那张茶桌擦了一遍。"
 LYY_Event.9042.a:"以商会枢密总揽港政"
 LYY_Event.9042.b:"维持议事厅，纵其议政"
 LYY_Event.9043.t:"不见光的册子"
 LYY_Event.9043.d:"密账不宣。天权要紧的几笔数目从此只写在两三本不对外的册子里。凝光告诉自己这是权宜之计。\n可那几本册子越积越厚，翻也翻不动。她比谁都清楚，一本不肯给人看的账，本身就是一份供状，只是少有人肯亲手写下自己的罪。有天夜里她把册子抽出来又放回去，放回柜底时，落了一层灰。"
 LYY_Event.9043.a:"密账不宣，事权独揽"
 LYY_Event.9043.b:"账目照旧公开"
 LYY_Event.9044.t:"双份军饷"
 LYY_Event.9044.d:"商团私兵成军，旗号各归各家，号令却出自同一间茶室。士兵拿双份饷，认两个主，忠诚被明码标价。\n凝光检阅时想起刻晴那些被自己笑话过的民兵，如今才明白：用钱买来的兵比用信仰拢来的更听话，也更善变。钱一停，枪口就会转过弯来。检阅结束她又把点名册翻了一遍，把几个名字记在了心里。"
 LYY_Event.9044.a:"组建商团私兵"
 LYY_Event.9044.b:"兵权尽归港府"
 LYY_Event.9045.t:"墙后的海"
 LYY_Event.9045.d:"关税壁垒一道接一道立起来，把外货挡在港外。库里堆满卖不出去的东西，商人们反倒拍手称快，因为挡在外面的多是别人的货。\n凝光没有阻拦，只在深夜独自登楼看海。远处被壁垒切开的海面泛着微光，她站到衣角发冷才转身下楼。第二天她照旧批了新的壁垒，字签得很快，看不出犹豫。"
 LYY_Event.9045.a:"高筑关税壁垒"
 LYY_Event.9045.b:"维持自由关税"
 LYY_Event.9046.t:"镜中的人"
 LYY_Event.9046.d:"商会至上的律条落下，天权商会从议事的厅堂变成了发号施令的衙门。律法要看商会的脸色，官吏要经商会遴选。\n凝光在这条路上走得极稳，稳到有天清晨对镜梳妆，忽然认不出镜中那个下令的人，是自己，还是当年她憎恨过的影子。她盯着镜子看了很久，最后什么也没说，把妆补完才出门。"
 LYY_Event.9046.a:"立商会至上之律"
 LYY_Event.9046.b:"律法高于商会"
 LYY_Event.9047.t:"忠诚作抵"
 LYY_Event.9047.d:"权债是一纸以忠诚作抵押的契约，谁借了这笔钱，谁就在下次表决时欠凝光一票。她把权力做成了账，做得很漂亮。\n可账最怕的从来是有一天利滚利到谁也还不起，到那时，收账的和欠账的都要跟着这座城一起沉下去。头一批权债到期那日，她没有去收，只在账上画了个圈。"
 LYY_Event.9047.a:"以权债结盟诸家"
 LYY_Event.9047.b:"拒用权债，只凭法度"
 LYY_Event.9048.t:"不做抵押的港口"
 LYY_Event.9048.d:"北国的密使来得比商队还勤，不谈货，只谈一份能把整个港口租借出去的合约。凝光读了三遍，在末尾批道：生意可做，港口不做抵押。\n密使冷冷问她可想过代价，她答：算过了，比你算得清楚。那夜她独自坐了很久，直到烛火烧到尽头。第二天那份合约被锁进了最厚的柜子，柜门上贴了一张纸条：勿轻启。"
 LYY_Event.9048.a:"拒租港口，虚与委蛇"
 LYY_Event.9048.b:"签下合约，换取重建"
 LYY_Event.9049.t:"天权永固"
 LYY_Event.9049.d:"天权永固四字刻上府门那日，全城张灯。凝光端坐在最高处，看着脚下万家灯火，却在最喧闹的一刻想起多年前那个刚接手商会、还相信账目能衡量一切的小姑娘。\n她没有致辞，只在心里把临时二字又默念了一遍，念得很慢。散场后她命人把府门的灯笼留一盏不熄，说是给夜里回来的人照路。"
 LYY_Event.9049.a:"天权永固，抹去临时"
 LYY_Event.9049.b:"改回临时，定期还政"
 LYY_Event.9050.t:"玉衡的回信"
 LYY_Event.9050.d:"玉衡的回信很短：账我可以信你，人却不能。信后却附来一份八省人口清册，字迹工整，显然是亲手所录。\n凝光把清册翻了一遍又一遍，末了对幕僚说：你瞧，肯骂我的人，才真把我当回事。骂都不肯骂的，是早就打算不理我了。她把清册收进手边的第一个抽屉，那个抽屉从此没锁过。"
 LYY_Event.9050.a:"回信玉衡，坦诚相商"
 LYY_Event.9050.b:"就事论事，不予深交"
 LYY_Event.9051.t:"月海亭的粮账"
 LYY_Event.9051.d:"月海亭的粮账寄到，细得连一石米的去路都有批注。文末写着：你算得清金钱，我算得清米粮，两样加在一起，才勉强算得清一个璃月。\n凝光盯着勉强二字看了很久，忽然意识到自己引以为傲的那本账簿，在真正的民生面前薄得可怜。她让人把粮账誊了一份，钉在自己的账本前面，往后翻账，先翻那一份。"
 LYY_Event.9051.a:"回信月海亭，共理粮政"
 LYY_Event.9051.b:"拒其插手，独掌财粮"
 LYY_Event.9052.t:"绝云间的雪"
 LYY_Event.9052.d:"绝云间的回信来得迟，也冷。使者带回一片不化的雪，附言只有八个字：你们的律，量不出雪山的重量。\n凝光把那片雪搁在案头，看它整夜不化。她一生都在衡量、定价、核算，却从没为这样一片没有用处、也标不出价钱的雪留过位置。天亮时她把雪挪到了窗边，让天光先照到它。"
 LYY_Event.9052.a:"尊重绝云间，另备一尺"
 LYY_Event.9052.b:"以律法强令仙家归附"
 LYY_Event.9053.t:"云来海的一桌酒"
 LYY_Event.9053.d:"公子的船队泊在港外，甲板上摆了一桌酒。使者回来禀报，那位执行官不谈打仗，只谈秩序，谈得比谁都像个商人。\n凝光听完，把茶盏放下，说：会做生意的敌人，比只会打仗的敌人更难对付。她随即吩咐备一份最厚的账册送去。账册送出前，她亲手在扉页添了一行字：先算账，再论敌友。"
 LYY_Event.9053.a:"以商人之道应公子"
 LYY_Event.9053.b:"以刀兵之法拒至冬"
 LYY_Event.9054.t:"沉玉谷的秤"
 LYY_Event.9054.d:"使者带着一箱账册上沉玉谷，只为说明璃月港也能算清山水的账。蓝砚没接账册，只回赠一杆藤编的旧秤，秤上没有刻度。\n附言说：你们的契，量不出水土的重量。凝光把秤端详了很久，此后一直摆在案头，谁也不许动。有回有人不小心碰落了，她亲自拾起来挂回原处，挂得很正。"
 LYY_Event.9054.a:"虚心受秤，另立水土之账"
 LYY_Event.9054.b:"斥其阻碍开发"
 LYY_Event.9055.t:"两本账并作一处"
 LYY_Event.9055.d:"璃月重归一秤那日，凝光把两本账并在一处：一本记商港的进出，一本记天授的去留。\n她翻到末页，在空白处写了一行：秤上的两砣，今日终于能放在同一张桌上称了。写完她合上账，窗外码头的灯一盏盏亮起来，像有人把整条海岸线重新描了一遍。她看了很久，没有起身。"
 LYY_Event.9055.a:"两账并称，就此向前"
 LYY_Event.9055.b:"停下脚步，清算所有"
 LYY_Event.9056.t:"颁行新约"
 LYY_Event.9056.d:"天权新约颁行那日，长桌边坐满了名字。有当日对头，有多年主顾，也有谁都不认的散号。凝光把全文读完，只添了一句：此约之内，账目各清，互不相赖。\n台下先是一静，随后响起的掌声里有一种很陌生的东西，是终于可以把话说开的松快。散场时有人来收桌上的笔墨，发现每份约书上，都多了一个空着的签名格。"
 LYY_Event.9056.a:"邀众同席，共立新约"
 LYY_Event.9056.b:"只与盟好续订旧契"

 LYY_Spirit_New_Scale:"天权新秤"
 LYY_Spirit_New_Scale_desc:"旧秤称货也称人，两头都不准。新铸的这杆只称货，称人的那一半交给律法与账本。一个国家肯不肯把自己量清楚，全看它敢不敢换这杆秤。"
 LYY_Spirit_Open_Quay:"通商之信"
 LYY_Spirit_Open_Quay_desc:"把定价的权利交回给买卖的人，市场会自己长出规矩，也会自己长出骗子。璃月赌的是前者，押上的是这座城攒了千年的名头。"
 LYY_Spirit_Chasm_Rail:"层岩铁脉"
 LYY_Spirit_Chasm_Rail_desc:"铁轨铺进巨渊，运出来的是矿，运进去的是粮。一条铁脉，把从前只会埋人的地方，改成了养活人的地方。"
 LYY_Spirit_Craft_Guild:"百工之约"
 LYY_Spirit_Craft_Guild_desc:"掌事由匠人自推，行会护的是手艺，不是谁家祖上开过几间铺子。把规矩交回给做东西的那双手，东西才做得长久。"
 LYY_Spirit_Teyvat_Commerce:"万国商约"
 LYY_Spirit_Teyvat_Commerce_desc:"一张写满琐碎字句的商约。它管不了神，却至少能让挂不同旗的船，在同一片海上守同一条规矩。"
 LYY_Spirit_Chasm_Debt:"巨渊旧债"
 LYY_Spirit_Chasm_Debt_desc:"巨渊是一笔按月要还的旧债。港上每年从账里划走的那一笔，买的是井下人活到明天的机会。"
 LYY_Spirit_Contract_Over_Oracle:"以契代谕"
 LYY_Spirit_Contract_Over_Oracle_desc:"不再问神谕，改问契约。契约比神谕薄，也比神谕重，因为它错了要有人认账。这句写在卷首的话，替璃月定下了办事的次序。"
 LYY_Spirit_Harbor_Guard:"港防新军"
 LYY_Spirit_Harbor_Guard_desc:"这支队伍从前的规矩是不退，如今的规矩是知道自己在护着谁。一句口号的改动，用去了整整一场内战的代价。"
 LYY_Spirit_Maritime_Court:"海事法庭"
 LYY_Spirit_Maritime_Court_desc:"码头边的小楼，不摆石狮，只挂牌子写开审时辰。判词交行首共署，谁签了字，谁就要为这一判担往后多年的名声。"
 LYY_Spirit_Liyue_Arsenal:"璃月兵工"
 LYY_Spirit_Liyue_Arsenal_desc:"每一件出厂的兵器都刻着工匠的名字。有人认领的东西，才不会随便杀人；有人署名的手艺，也才不会随便马虎。"
 LYY_Spirit_Free_Port_Charter:"自由港宪章"
 LYY_Spirit_Free_Port_Charter_desc:"头一条写着：凡在本港经营者，无论贵贱贫富，皆同守一法。写下它的人知道，自己也在这条规矩管着的范围之内。"
 LYY_Spirit_Guild_Eternal:"金权永固"
 LYY_Spirit_Guild_Eternal_desc:"商会成了衙门，律法成了行规。它高效、干净、井井有条，只是再也不问，那些被挡在门外的声音去了哪里。"
 LYY_PW_Spirit_Tianquan_Eternal:"天权永固"
 LYY_PW_Spirit_Tianquan_Eternal_desc:"临时二字被抹去的那一刻，一座城的希望与一座城的枷锁，同时落在了同一个人肩上。"
 LYY_Spirit_New_Scale_Charter:"天权新约"
 LYY_Spirit_New_Scale_Charter_desc:"此约之内，账目各清，互不相赖。一份只由赢家签字的合约撑不过下一次翻脸，一份人人都签了字的合约，至少能撑到下一回讲理。"
 LYY_Spirit_Long_Ledger:"长账"
 LYY_Spirit_Long_Ledger_desc:"扉页只写了一句话：此账不封。往后谁当家，谁就接着往下写，写不下去的时候，也要写。"

 LYY_Port_Tier_1:"商港等级"
 LYY_Port_Tier_1_desc:"港埠冷落，泊位空荡。账房先生守着空册子算了一夜，算盘上落了一层灰。"
 LYY_Port_Tier_2:"商港等级"
 LYY_Port_Tier_2_desc:"舟楫初集，往来的多是本乡船。码头上有了吆喝声，却还听不见别处的口音。"
 LYY_Port_Tier_3:"商港等级"
 LYY_Port_Tier_3_desc:"商路重开。挂璃月旗的船又出现在远方的港口，别人开始记得，这片海上还有这么一座城。"
 LYY_Port_Tier_4:"商港等级"
 LYY_Port_Tier_4_desc:"万商云集。栈桥彻夜不歇，租金一日三涨。热闹底下，有人开始算，这份热闹能撑几年。"
 LYY_Port_Tier_5:"商港等级"
 LYY_Port_Tier_5_desc:"提瓦特第一大商埠。税关的铁箱要三个人抬，码头上的旗色看不过来。凝光却在最忙的时候提醒账房：船来得越多，越要记得谁欠谁的。"
 LYY_Mandate_Tier_1:"天授等级"
 LYY_Mandate_Tier_1_desc:"天授尽失。旧契已毁，新规未立，事事凭人情决断，人一走，约定也就散了。"
 LYY_Mandate_Tier_2:"天授等级"
 LYY_Mandate_Tier_2_desc:"名分初立。官府开始照章程办事，办起来仍要看谁的面子大一些。"
 LYY_Mandate_Tier_3:"天授等级"
 LYY_Mandate_Tier_3_desc:"秤已立稳。白纸黑字，庄重而迟缓，护住了弱者，也拖慢了一切想走捷径的脚步。"
 LYY_Mandate_Tier_4:"天授等级"
 LYY_Mandate_Tier_4_desc:"秤悬如律。作奸犯科者无所遁形，敢绕行的聪明人也渐渐没了活路。"
 LYY_Mandate_Tier_5:"天授等级"
 LYY_Mandate_Tier_5_desc:"天授如磐。人人平等到没有一丝余地。它守住了公义，也可能在不经意间，锁住了这座城伸向未来的手。"
 LYY_PWCombo_Both_High:"万国来朝"
 LYY_PWCombo_Both_High_desc:"舟楫塞港，律令也压得住场。别人排队来签你的约，你才有余力去想：这份热闹里，有多少是真肯留下来的。"
 LYY_PWCombo_Both_Low:"舟尽秤空"
 LYY_PWCombo_Both_Low_desc:"船不来，秤也立不起来。账房先生对着空册子算了一夜，算盘上落了一层灰。"
 LYY_PWCombo_A_High:"豪商无秤"
 LYY_PWCombo_A_High_desc:"金山压过了律文。投机客在码头彻夜作乐，规矩退到墙角，看着自己一寸寸被无视。"
 LYY_PWCombo_B_High:"秤重舟轻"
 LYY_PWCombo_B_High_desc:"法条刻得端正，码头却越来越冷清。秩序有了，人走了，账上的数字也跟着凉下来。"

 #################### 甘雨 · 月海亭（GYP） ####################
 GYP_CivilWar_Moonlit:"月海秉政"
 GYP_CivilWar_Moonlit_desc:"帝君驾崩的讣告送到月海亭时，甘雨正在誊抄当日的文书。她的笔尖停了很久，一滴墨落在纸上，晕成一个小小的、无法修补的圆。次日清晨，她照旧第一个到了月海亭，照旧把案头的文牍按次序摆好，只是这一次，没有人再在文末替她批上那个熟悉的印。她说：神明走了，账还是要记，路还是要修。区别只在于，从今往后，签字的人，得是我们自己。"
 GYP_Assume_the_Secretariat:"续掌月海亭"
 GYP_Assume_the_Secretariat_desc:"三千年来，月海亭的灯从未彻底熄过。甘雨重新坐回那张椅子时，案头的文书已经堆到了齐眉。有人劝她先立威、先掌兵，她只是摇摇头，把第一份文牍抽出来，一行一行地读。她说：璃月的骨头不在刀上，在这堆纸里，谁读得懂它，谁就撑得起这座城。"
 GYP_Summon_the_Scholars:"召集文官"
 GYP_Summon_the_Scholars_desc:"文官们的名字被一个一个地点出来，有的是旧官府里留下的老吏，有的是隐居山野的寒士，也有人早已把笔换成了锄头。甘雨说：帝君在时，你们替神办事；如今神不在了，你们得替人办事。前后只差一个字，做起来却难上千倍。"
 GYP_The_Empty_Throne:"虚君之位"
 GYP_The_Empty_Throne_desc:"甘雨把帝君的空位原样保留了下来：案、椅、印、灯，一样不缺，一样不用。有人说这是对大逆不道的怯懦，也有人说这是对新秩序的怀柔。她只是每月初一，亲自去那间空殿里添一次灯油，是提醒自己，那个位置可以空着，却不可以再有人坐进去。"
 GYP_Reopen_the_Granaries:"开仓平粜"
 GYP_Reopen_the_Granaries_desc:"开仓的第一日，粮车从月海亭一直排到海边。甘雨没有站在高处，是挤在队伍里，亲手把一斗米递到一位老妪怀里。老妪认出了她，哽咽着问：帝君真的不在了吗？她替老人把米袋扎紧，轻声说：不在了。但从今往后，饿肚子这件事，有人管了。"
 GYP_The_Book_of_Rites:"重订礼典"
 GYP_The_Book_of_Rites_desc:"礼典重修，是最闷、最繁、最不讨好的活。甘雨把自己关在月海亭里，逐字逐条地校对，连一句拜跪该不该立，都要翻遍三千年的旧档。她说：礼是用来安人的。若一条礼数让人更苦，那它就该被删掉，哪怕它流传了三千年。"
 GYP_The_Attendance_Ledger:"点卯之簿"
 GYP_The_Attendance_Ledger_desc:"点卯之簿，记的是谁来了、谁没来、谁迟了。看似琐碎，甘雨却看得极重。她说：一个连官老爷几点上衙都管不住的国家，怎么管得住千里山河？簿子挂上衙门的当日，迟到的老吏面红耳赤，此后没人再敢踩着巳时的鼓点进门。"
 GYP_Adepti_In_Residence:"仙家居廊"
 GYP_Adepti_In_Residence_desc:"几位散仙被请进城中，住进了月海亭别院。甘雨没有向他们索要仙力，只请他们做一件更寻常的事：为人间的疑难指一条路。她说：仙凡之间，不必是主仆，也不必是陌路。若你们愿意，我愿腾出一间屋子，让这三千年来头一次，仙与人坐在同一张桌边喝一碗热茶。"
 GYP_Benevolent_Tax:"宽税之政"
 GYP_Benevolent_Tax_desc:"宽税令下，乡间的负担轻了三分。有人说这是善政，也有人偷偷担心这善政撑不过明年。甘雨把历年税册摆出来一条条地算，说：宽是账算清了之后的从容。若连这点从容都拿不出来，那我们和苛税的王侯，也没什么两样。"
 GYP_The_Civil_Exams:"开科取士"
 GYP_The_Civil_Exams_desc:"开科取士，考场里第一次坐满了寒门子弟。甘雨亲自拟了第一道题：问天下何以太平。有考生洋洋洒洒引经据典，也有考生只写了八个字：「使民有食，有衣，无畏。」阅到这一份时，甘雨停了很久，最后把它取为一等。"
 GYP_The_Grand_Secretariat:"文华内阁"
 GYP_The_Grand_Secretariat_desc:"文华内阁无甚威风，只在月海亭的东厢多摆了几张桌椅。甘雨说：内阁是一处让不同的主意能坐下来吵架的地方。吵完了出去，大家还得并肩把事办了，这才是文官治国的本事，也是它最累人的地方。"
 GYP_The_Village_Elders:"乡老议政"
 GYP_The_Village_Elders_desc:"乡老议政，把最粗粝、也最真实的民声带进了朝堂。有乡老第一次进城，连台阶都不敢上高，一开口却是满堂的实情：哪条渠坏了、哪处堤裂了、哪一户的孤儿没人管。甘雨把每一条都记下，说：这些事，比千篇奏章都重要。"
 GYP_Herdsmen_and_Farmers:"耕牧并举"
 GYP_Herdsmen_and_Farmers_desc:"田与牧，本是两桩互相看不上的营生。甘雨却把它们并到一处：农人以余粮换牧人的皮货，牧人以牲畜换农人的粟米。她说：璃月的土地上，能长出粮食，也能跑起牛羊；一个只肯认一种生计的国家，迟早会把自己饿瘦。"
 GYP_The_Snow_Pact:"绝云之盟"
 GYP_The_Snow_Pact_desc:"绝云间的雪，从不落在人间。甘雨独自上山，在仙家门前站了一整天，才换来一份不清不楚的盟约。下山时她对随行的人说：这份盟约未必靠得住，可只要山上的人肯开门，人间就有了一条通往云端的路，哪怕它细得像一根丝。"
 GYP_The_Question_of_Heaven:"天问"
 GYP_The_Question_of_Heaven_desc:"甘雨在月海亭前的广场上设了一座高台，只问在场所有人一个问题：帝君既已归天，我们靠什么而活？台下有人答契约，有人答礼数，有人答不必靠什么，甘雨没有评判任何答案，只是说：这一问，我答了三千年也没答明白。今日，交给你们。"
 GYP_Charter_of_Service:"任官宪章"
 GYP_Charter_of_Service_desc:"任官宪章的第一条，写得近乎朴素：「为官者，先问百姓，后问上官。」有老吏看了直摇头，说这是要乱套的。甘雨却把它抄给每一个新任的官员，说：是要你们记住，你们的官帽，是从谁的口粮里省出来的。"
 GYP_The_Merit_Examination:"考成之法"
 GYP_The_Merit_Examination_desc:"考成之法，考的是实事：修了多少堤、赈了多少饥、清了多少钱粮。第一次考绩，三位自诩干练的老吏落了等，一个沉默寡言的县丞却评了上上，因为他一个人，把那县里十九条废渠，全给通了。"
 GYP_An_Open_Court:"明堂听政"
 GYP_An_Open_Court_desc:"明堂听政，百姓可以站在堂下，听官老爷如何议事。最初无人敢来，来的也多是看热闹的。日子久了，堂下渐渐蹲满了人，有时一句寻常农夫的问话，竟把满堂文官问得哑口无言。甘雨说：让百姓听见我们怎么说话，我们才会学着，说人话。"
 GYP_The_Public_Kitchen:"义仓膳堂"
 GYP_The_Public_Kitchen_desc:"义仓膳堂立在各区，灶火终日不熄。甘雨没有把它办成施舍的粥棚，是请来最会做饭的厨娘掌勺，让最穷的人，也能吃上一口体面的热饭。她说：饿肚子的人，最怕的是别人递来的那一眼怜悯。"
 GYP_Fair_Measures:"度量归一"
 GYP_Fair_Measures_desc:"度量归一，是件得罪人的事。各家商号自有尺寸，官仓的斗、民间的斗，差得能装下一整年的人心。甘雨铸了一批新的衡器，逐户校准，谁用旧器就罚谁。她说：一盘不公平的秤，比一枚刀还伤人，刀伤一处，秤伤一城。"
 GYP_The_Peoples_Advocate:"谏议之官"
 GYP_The_Peoples_Advocate_desc:"谏议之官，专替说不出话的人说话。甘雨把衙门前那面从没人敢敲的鸣冤鼓，搬到了最热闹的街口，说：想告状，谁来敲都行，我拦不住，别人也拦不住。鼓面很快被敲得斑斑驳驳，可敲鼓的人，脸上的神情，比从前亮堂了许多。"
 GYP_Schools_of_the_Classics:"经学馆"
 GYP_Schools_of_the_Classics_desc:"经学馆里，讲的是「这世上什么才是公道的」。先生们既讲帝君的旧训，也讲刻晴的新论，甚至请来商会的账房讲怎么算一本清白的账。甘雨说：学问若只供殿上人揣摩，那就是摆设。"
 GYP_The_Returning_Scholars:"归野之贤"
 GYP_The_Returning_Scholars_desc:"那些战乱中遁入山林的读书人，被一封一封地请了回来。有人心怀戒备，有人已白发苍苍。甘雨亲自去城门外接他们，说：璃月的账，缺了你们这一笔。有人当场落了泪，不为荣宠，只为还有人惦记着，他们这半生的学问。"
 GYP_Land_for_the_Tillers:"授田之制"
 GYP_Land_for_the_Tillers_desc:"授田之制，把荒废的田亩重新分到耕者手里。书吏丈量时，甘雨常常蹲在田埂上，看老农捏起一把土、放在舌尖上尝。她说：这土咸不咸，比什么地籍册都实在。问到手的田够不够种，老农只是憨笑，一遍遍地，把那把土攥了又攥。"
 GYP_The_Seal_of_the_Regent:"摄政之印"
 GYP_The_Seal_of_the_Regent_desc:"摄政之印铸成那日，甘雨没有立即启用。她把它在案上放了三日，直到确认每一项需要用印的政令，都合规合矩，才落了第一笔朱砂。她说：印是死的，握印的手是活的。这枚印要紧，是因为它提醒我，权力是要被看住的。"
 GYP_The_Adepti_Compact:"人仙共治之约"
 GYP_The_Adepti_Compact_desc:"人仙共治之约，写得像一份家规：仙掌地利，人掌民事，遇争则请德高者裁，德高者亦不得专断。甘雨深知这份约定并不完美，仙家终究与人不同，可她愿意用一个可以商量的模糊，来代替一个斩钉截铁的一统。"
 GYP_Peaceful_Coexistence:"仙凡各安"
 GYP_Peaceful_Coexistence_desc:"仙凡各安，说来轻巧，做来却处处是坎。有仙家嫌人间尘嚣，有人间忌仙家清高。甘雨不急于调和，只做一件事：让两者都能在同一座城里，找到一根可以坐下的长凳。她说：不必相爱，只需不互相伤害，这已经是人间难得的太平。"
 GYP_The_Grand_Academy:"太学"
 GYP_The_Grand_Academy_desc:"太学落成那天，甘雨题了四字门额：为不为名。有士子不解其意，她答：读书不是为了当官，也是为了有一天，你面对一桩不公的事，有本事说得出、也扛得住。太学里最热闹的，从来是那间通宵亮灯的辩论堂。"
 GYP_The_Rites_of_State:"国之大典"
 GYP_The_Rites_of_State_desc:"国之大典，重订了登基、拜相、春耕、秋收的种种礼数。有人说这是虚文，甘雨却坚持要为一场丰收也立一次典。她说：礼的本意，是让寻常的日子有分量，让耕田的手、织布的手，也能在某一天，被整个国家郑重地谢过。"
 GYP_The_Moonlit_Reign:"月海之治"
 GYP_The_Moonlit_Reign_desc:"月海之治的诏书，是甘雨亲手誊抄的。她写了三遍，废了三遍，最后选了最早的那一稿，那一稿上，没有华丽的辞藻，只有一句朴素的话：愿此后璃月，饥者有食，寒者有衣，屈者有理可诉。颁诏那日，满城的灯，一直亮到了月落。"
 GYP_The_Everlasting_Rain:"千秋之雨"
 GYP_The_Everlasting_Rain_desc:"千秋之雨，不为一人而降。甘雨在契约末尾写下：此法今日立，未必今日尽美；愿后人以宽容待之，以公心正之。她太清楚，一项善政活不过一代，一种善念，却可以传过十代。她把这份契约，名之曰「雨」，因为它要慢慢下，下过千年的山河。"
 GYP_Restore_the_Six_Rites:"六礼复兴"
 GYP_Restore_the_Six_Rites_desc:"六礼复兴，是旧制最坚硬的一块骨。冠、婚、丧、祭、乡、相见，一礼一规，重新被人郑重地拾起。有人说这是倒退，甘雨却在六礼之中，读出了一种别样的安慰：在这兵荒马乱的年头，还有人在认真地办一场婚礼、一场葬礼，这便是人间尚未崩坏的证明。"
 GYP_The_Sacred_Contract:"契约神圣"
 GYP_The_Sacred_Contract_desc:"契约重新被奉为神圣。甘雨说：帝君留下的，从来是一份契约。神像会朽，契约不会，只要还有人肯在上面按手印。她把这份契约供进了月海亭最深处，却把它的抄本，发到了每一个市集、每一处村口。"
 GYP_The_Liturgy_Court:"礼制之司"
 GYP_The_Liturgy_Court_desc:"礼制之司，管的是分寸：何时该跪、何时该立、何人当先、何事当后。有人说这是把活人塞进死规矩里，甘雨却答：分寸是让一群陌生人，也能彼此体面地相处。礼崩之后最可怕的，是人人都不再在乎别人的体面。"
 GYP_The_Sealed_Register:"籍册封存"
 GYP_The_Sealed_Register_desc:"籍册封存，从此查人、查户、查田，都要凭官府一纸批文。甘雨告诉自己这是为防奸宄，可当那一道道批文批复得越来越顺手时，她也会在深夜，想起自己年轻时读过的、关于暴秦的那些史书。她合上案卷，对自己说：只是暂时的。"
 GYP_Sanctify_the_Regency:"摄政奉天"
 GYP_Sanctify_the_Regency_desc:"摄政奉天，把甘雨的权柄，抬到了一个连她自己都不安的位置。诏书上写：「代天理物。」她盯着这四个字看了很久，最后提笔在旁批注：天无言，人声即天声。批完，她把诏书压在了所有文牍的最底下，既不肯撤，也不愿让它轻易见人。"
 GYP_The_Clerisy_State:"礼教之国"
 GYP_The_Clerisy_State_desc:"礼教之国，以礼为法，以教代刑。乡里的纷争，多由德高望重者调解，官府反而退到了幕后。这制度安静、有序、人情味十足，直到有人发现，那些被「礼」判为不端的人，无论对错，都再也无法在这乡里抬起头。"
 GYP_Curbs_on_Commerce:"抑商重农"
 GYP_Curbs_on_Commerce_desc:"抑商重农，把商人的地位压到了农人之下。市集冷清了，田里的炊烟却旺了。甘雨不是不懂商贾的价值，她只是固执地相信：一个把根扎在土地上的人，比一个把钱驮在牲口上的人，更不容易在乱世里走失。多年后她会不会后悔，连她自己也不敢断定。"
 GYP_The_Faithful_Bureau:"忠信之局"
 GYP_The_Faithful_Bureau_desc:"忠信之局，网罗了一批最忠于礼制的人。他们不贪不占，办事也干净利落，只是眼睛越来越尖，尖到能在一场寻常的家宴上，看出谁坐错了席、谁作错了揖。甘雨提拔了他们，又隐隐害怕他们：因为没有人，能比一个真正相信自己在替天行道的人，走得更远。"
 GYP_Custodians_of_the_Old_Law:"旧法守护"
 GYP_Custodians_of_the_Old_Law_desc:"旧法守护者，成了新朝廷里最固执的一群人。他们抱着帝君的老法典不肯放，一条一条地比对，一处一处地争辩。甘雨起初嫌他们迂，后来却渐渐敬重起来，因为在这个人人都想改点什么的时代，肯为一句话的出处较真到底的人，反倒最接近公道二字。"
 GYP_The_Silent_Censorate:"沉默台谏"
 GYP_The_Silent_Censorate_desc:"台谏沉默了。那些从前专门挑皇帝错处的言官，如今只挑些无伤大雅的小毛病，奏章写得越来越客气。甘雨看在眼里，什么都没有说，她自己心里清楚，让台谏闭嘴的，是这个太平得让人不敢出声的世道。"
 GYP_Unity_of_Heaven_and_Earth:"天地一统"
 GYP_Unity_of_Heaven_and_Earth_desc:"天地一统，礼制的尽头，是人间的秩序与天道的秩序，被彻底缝成了一张网。这张网整齐、庄严、无懈可击，只是网眼太小，容不下任何一只想往别处飞的鸟。甘雨站在网中央，忽然明白：她织的这张网，第一只网住的，可能是她自己。"
 GYP_The_Unbroken_Chain:"不绝之链"
 GYP_The_Unbroken_Chain_desc:"不绝之链，把摄政之位，织成了一条没有尽头的锁链。甘雨许诺：只要璃月一日未复旧观，她一日不退。可复旧观三个字，谁能说清是什么样子？她为自己找了一个永远说得通的理由，也为自己，画了一个永远走不出的圈。"
 GYP_The_Regent_Eternal:"摄政永续"
 GYP_The_Regent_Eternal_desc:"摄政永续。甘雨改了诏书的措辞，把暂摄改成了永摄。改完她独自坐到天明，反复摩挲着那枚用了半生的印章。她想起三千年前，自己第一次摸到这个印时，帝君曾笑着说：「等你哪天不想摸了，就该还回来了。」如今，印还在，笑已经不在了。"
 GYP_The_Old_Contract_Restored:"旧约重立"
 GYP_The_Old_Contract_Restored_desc:"旧约重立，把帝君当年那份契约，一个字不休地复原，重新颁行天下。人们对着石碑焚香，仿佛神明真的回来了一样。只有甘雨知道，碑上那个名字的主人，早已不在了，从今往后，守着这份契约的，是无数个平凡得几乎记不住名字的、活着的凡人。"
 GYP_The_Three_Thousand_Years:"三千年之录"
 GYP_The_Three_Thousand_Years_desc:"三千年的账，甘雨一个人默默地记着。哪年大旱、哪年丰稔、哪家添了丁、哪户绝了后，她都记得。夜深人静时她偶尔会想：这一本本流水账，是为了谁而记？帝君在时，是替神记账；帝君去后，是替自己记账；可记到后来，她渐渐分不清，是她记着璃月，还是璃月在记着她。"
 GYP_The_Chasm_Seal:"层岩封印"
 GYP_The_Chasm_Seal_desc:"层岩之下，有比契约更古老的裂痕。甘雨亲自带人去加封那道裂口，一路上没说什么话。回程时她对随行的人低语：这世上最让神明头疼的，从来是深渊。它会在你最得意的时候，提醒你，无论人间立起多高的大厦，底下都还有一层，是连神也照不到的。"
 GYP_Refuge_of_the_Mountain:"山中庇民"
 GYP_Refuge_of_the_Mountain_desc:"乱世里，最先被牺牲的是那些最不会喊的百姓。甘雨下令开放山中的洞天与谷地，让流民得以栖身。有人担心这是养虎为患，她却说：一个国家的慈悲，恰恰体现在它如何对待那些，对自己毫无用处的人。山中的炊烟，渐渐比城中还要密了几分。"
 GYP_A_Letter_from_the_North:"北国来书"
 GYP_A_Letter_from_the_North_desc:"至冬的来书，用词很客气，条件却很强硬：只要璃月肯开一个口子，至冬便包揽它三年的粮运。甘雨把信读了又读，最后在回函里写：璃月可以借粮，但绝不借路。写完她又添了一句：我不怀疑你们的诚意，我怀疑的是，雪化了之后，留下来的那摊水。"
 GYP_The_Burden_of_Office:"任重"
 GYP_The_Burden_of_Office_desc:"任重，道远。甘雨在给同僚的信中写道：我这一生，做过的最重的活，是每天清晨，把今天要做的事，一件一件地想清楚、排好、再一件一件地做掉。她说：撑起一个国家的，从来是无数个寻常的清晨，你得在每一个清晨，都还愿意坐回那张椅子上。"
 GYP_Reunify_Liyue:"光复璃月"
 GYP_Reunify_Liyue_desc:"内战结束那天，甘雨把虚君之位那盏长明灯，亲手吹灭了。大殿里暗了一瞬，随即被透过来的天光照亮。她走出月海亭，看见街上的百姓往来如常，卖豆腐的在吆喝，学童在背书，码头上的船照旧进进出出。她站了很久，轻声说：总算，可以不用再替神操心了，从今往后，操心的，是我们自己。"

 GYP_civilwar_category:"月海之衡"
 GYP_civilwar_category_desc:"甘雨 · 麒麟一系的内战决议组。以两轴机制衡量守成与变通之间的分寸，每一项决议都会推动轴值变化并切换等级。甘雨所求的，是让璃月在动荡之中尽量少受损伤，宁可慢一些，也不愿见百姓流离失所。宁可慢一些，也不愿见生灵涂炭。"
 GYP_decision_draft_officials:"铨选文官"
 GYP_decision_draft_officials_desc:"选官是治国的根。看文章，更看实绩；看口才，更看他在乡里替百姓做过什么事。一次铨选，就是一整座衙门风气的起点。"
 GYP_decision_public_granary:"常平义仓"
 GYP_decision_public_granary_desc:"丰年收粮、荒年放粮，仓里的每一石米，都是替明天的饥荒提前存下的一句话：放心，有我在。"
 GYP_decision_teach_rites:"宣讲礼典"
 GYP_decision_teach_rites_desc:"礼典写出来只是纸，讲出去才是活。宣讲队走遍乡野，把那些最繁琐的条文，译成最寻常的道理：见了长辈要有礼，受了恩惠要记得。"
 GYP_decision_repair_dikes:"修堤治水"
 GYP_decision_repair_dikes_desc:"水患是这个古老国度最诚实的考官。堤修得牢不牢，一场暴雨就能揭晓；官吏用不用心，一条决口就能作证。"
 GYP_decision_scholar_bounty:"举贤赏能"
 GYP_decision_scholar_bounty_desc:"凡举荐的贤才确有实绩者，举主连同受赏。这样一来，荐才就不只是人情，而成了一桩需要认真掂量的正事。"
 GYP_decision_land_survey:"清丈田亩"
 GYP_decision_land_survey_desc:"田籍一乱，税就乱，人心更乱。清丈费时费力，可得罪的是豪强，得到的是万千自耕农的安稳。"
 GYP_decision_relief_famine:"赈济饥荒"
 GYP_decision_relief_famine_desc:"灾年最缺的是米，最怕的是消息传得比粮车慢。赈灾讲究一个「快」字：先让人吃饱，再谈章程。"
 GYP_decision_adepti_mediation:"请仙调停"
 GYP_decision_adepti_mediation_desc:"仙家出面调停，人情与天理一并拿来用，办起事来快得出奇，只是每一次相请，人间就欠云端一份薄薄的人情债。"
 GYP_decision_pacify_folk:"安抚流民"
 GYP_decision_pacify_folk_desc:"流民是乱世最容易点燃的干柴。安置他们，是把一座城未来的隐患，提前一寸寸地收拢。"
 GYP_decision_envoy_to_keqing:"使者赴玉衡"
 GYP_decision_envoy_to_keqing_desc:"使者带去的是月海亭的粮道，和一句极客气的问候。甘雨附言：政见之争可以慢慢谈，先把这一季的稻子收了再说。她相信，能让百姓吃上饭的人，才有资格争天下。"
 GYP_decision_envoy_to_ningguang:"使者赴天权"
 GYP_decision_envoy_to_ningguang_desc:"天权的回话总是先谈钱，后谈情。甘雨却更珍惜这样的对手：至少她从不假装慷慨，也从不欠一句实话。使者带回来的，是一份精确到厘的贸易清单。"
 GYP_decision_envoy_to_shenhe:"使者赴绝云间"
 GYP_decision_envoy_to_shenhe_desc:"绝云间是甘雨的归处，也是她最不敢轻易惊动的地方。使者带回一句极冷的话和一片不化的雪，甘雨把雪供在了月海亭最深处的案上。"
 GYP_decision_envoy_to_childe:"使者赴云来海"
 GYP_decision_envoy_to_childe_desc:"公子的船队停泊在港外，甲板上却摆好了茶。使者回来说，那位执行官谈起民生来滔滔不绝，倒像个老练的账房先生。甘雨听完只是摇头：越是把民生挂在嘴边的人，越要多留一份心。"
 GYP_decision_envoy_to_lanyan:"使者赴沉玉谷"
 GYP_decision_envoy_to_lanyan_desc:"沉玉谷的山路上，使者被蓝砚拦了下来。她说：你们月海亭的文书，写得比山路还绕。使者却把那份写得极长的水土章程一字不改地留下了，因为甘雨的交待是：一个字都别省。"
 GYP_decision_proclaim_the_old_contract:"重颁帝君旧约"
 GYP_decision_proclaim_the_old_contract_desc:"把那纸早已泛黄的契约，一字不漏地重抄、重刻、重颁。这不是复辟，甘雨说：是让所有人重新记起来，这个国家的第一件事，从来就是约定。"

 LYY_Event.4001.t:"墨落纸间"
 LYY_Event.4001.d:"讣告送到月海亭时，甘雨正在誊抄文书。笔尖停了很久，一滴墨落在纸上，晕成一个小小的圆。\n她没有哭，只是把那页纸轻轻抽出来，重新誊了一遍。次日清晨，她照旧第一个到岗，照旧把文牍按次序摆好。只是这一次，再没有人替她在文末批上那个熟悉的印，从今往后，落笔的，得是她自己。"
 LYY_Event.4001.a:"续掌月海，代摄国政"
 LYY_Event.4001.b:"退居山中，不再问事"
 LYY_Event.4002.t:"月海亭的灯"
 LYY_Event.4002.d:"月海亭的灯三千年未熄。甘雨坐回那张椅子时，案头的文牍已堆到齐眉。\n有人劝她先立威、先掌兵，她只是摇头，抽出第一份文牍，一行一行慢慢地读。她说：璃月的骨头不写在刀上，写在这堆纸里，谁读得懂它，谁才撑得起这座城。"
 LYY_Event.4002.a:"以文书治国，先理案牍"
 LYY_Event.4002.b:"先掌兵权，以定局势"
 LYY_Event.4003.t:"召贤之榜"
 LYY_Event.4003.d:"召贤榜贴出三日，月海亭门前便排起了长队：有旧吏，有隐士，也有人把笔换成了锄头的读书人。\n甘雨亲自逐一问话。轮到一位衣衫褴褛的老者时，众人皆窃笑，她却起身相迎。因为她看见，那老者衣袖磨破的地方，露出的是密密麻麻、写满字的草纸。"
 LYY_Event.4003.a:"广纳贤才，不问出身"
 LYY_Event.4003.b:"只取旧吏，稳妥为要"
 LYY_Event.4004.t:"空殿添灯"
 LYY_Event.4004.d:"甘雨把帝君的空位原样保留：案、椅、印、灯，一样不缺，一样不用。\n每逢初一，她亲自去那间空殿添一次灯油。有人问这是祭奠还是示威，她摇头：都不是。我只是想提醒自己，那个位置可以一直空着，却再也不该有人坐进去。"
 LYY_Event.4004.a:"保留虚君之位，敬而不近"
 LYY_Event.4004.b:"尽撤旧殿，另立新堂"
 LYY_Event.4005.t:"开仓之日"
 LYY_Event.4005.d:"开仓那日，粮车从月海亭排到海边。甘雨没有立于高处，是挤进队伍，把一斗米递进一位老妪怀里。\n老妪认出她，哽咽着问：帝君真不在了吗？甘雨替她把米袋扎紧，轻声答：不在了。但从今往后，饿肚子这件事，有人管了。老人怔怔地点头，抱着米，一步一步走远。"
 LYY_Event.4005.a:"开仓放粮，先安饥民"
 LYY_Event.4005.b:"封仓待价，先保军需"
 LYY_Event.4006.t:"礼典重修"
 LYY_Event.4006.d:"礼典重修是最闷、最繁、最不讨好的活。甘雨把自己关在月海亭里，逐条校对，连一句拜跪该不该立，都翻遍了三千年旧档。\n有人劝她何必如此较真。她说：礼是安人的。若一条礼数让人更苦，那它就该被删，哪怕它流传了三千年。"
 LYY_Event.4006.a:"重修礼典，删繁就简"
 LYY_Event.4006.b:"全盘照抄旧礼，一毫不改"
 LYY_Event.4007.t:"点卯簿"
 LYY_Event.4007.d:"点卯之簿挂上衙门，记的是谁来了、谁没来、谁迟了。有人笑这东西琐碎。甘雨却说：一个连官老爷几点上衙都管不住的国家，怎么管得住千里山河？\n当日，三四个迟到的老吏面红耳赤。此后巳时的鼓声一响，衙门里便已坐得整整齐齐。"
 LYY_Event.4007.a:"严行点卯，考勤有度"
 LYY_Event.4007.b:"宽待旧吏，维持人情"
 LYY_Event.4008.t:"仙家居廊"
 LYY_Event.4008.d:"几位散仙被请进城中，住进了月海亭别院。甘雨不索仙力，只请他们替人间的疑难指一条路。\n一位老仙问：你就不怕我们插手太多，把人间搅乱？甘雨答：我怕的是另一件事，怕仙与人，从此连一张能坐下的桌子都没有。老仙默然良久，终究把茶碗端了起来。"
 LYY_Event.4008.a:"请仙入城，共商疑难"
 LYY_Event.4008.b:"疏远仙家，各守其界"
 LYY_Event.4009.t:"宽税之令"
 LYY_Event.4009.d:"宽税令下，乡间负担轻了三分。有老农攥着新发的田契，反复摩挲，不敢相信自己的眼睛。\n也有人悄悄担心，这善政撑不过明年。甘雨把历年税册摊开，一条条算给他们看，说：宽是账算清之后的从容。若连这点从容都拿不出，我们与苛政的王侯，又有何分别。"
 LYY_Event.4009.a:"推行宽税，与民休息"
 LYY_Event.4009.b:"照旧征税，以充国库"
 LYY_Event.4010.t:"开科取士"
 LYY_Event.4010.d:"开科取士，考场里第一次坐满了寒门子弟。甘雨亲拟第一题：问天下何以太平。\n有人洋洋洒洒引经据典，有人只写八个字：使民有食、有衣、无畏。甘雨在这份卷子前停了很久，最后把它取为一等。旁人问为何，她答：因为这八个字，一句也没提自己。"
 LYY_Event.4010.a:"开科取士，广纳寒门"
 LYY_Event.4010.b:"循旧荐举，只用故旧"
 LYY_Event.4011.t:"东厢内阁"
 LYY_Event.4011.d:"文华内阁无甚威风，只在月海亭东厢多摆了几张桌椅。\n第一次议事，两位老臣当场吵翻，拍案而起。甘雨却不制止，只让书记照记。散会后她说：内阁是一处让不同主意坐下来吵架的地方。吵完出去，还得并肩把事办了，这才是文官治国的本事，也是最累人的地方。"
 LYY_Event.4011.a:"设文华内阁，共议国政"
 LYY_Event.4011.b:"事权独揽，以免纷争"
 LYY_Event.4012.t:"乡老入城"
 LYY_Event.4012.d:"乡老议政，把最粗粝、最真实的民声带进了朝堂。一位乡老第一次进城，连石阶都不敢踩高。\n可他一开口，却是满堂的实情：哪条渠坏了、哪处堤裂了、哪户孤儿的粮断了。甘雨逐条记下，末了对他说：这些事，比千篇奏章都要紧。乡老愣愣地点头，眼里却亮起了光。"
 LYY_Event.4012.a:"听乡老之议，采其民情"
 LYY_Event.4012.b:"拒于阶下，免乱章法"
 LYY_Event.4013.t:"耕牧并举"
 LYY_Event.4013.d:"田与牧，本是两桩互相看不上的营生。甘雨却把它们并到一处。\n农人以余粮换皮货，牧人以牲畜换粟米。第一次集市，一个牧人牵来的羊，换走了一挑子新米，他背着米走远，走了几步忽然回头，冲卖米的农人喊了一声：明年还来。农人笑着摆手：来嘛，来嘛。"
 LYY_Event.4013.a:"耕牧并举，互通有无"
 LYY_Event.4013.b:"专重农桑，罢止牧业"
 LYY_Event.4014.t:"绝云之盟"
 LYY_Event.4014.d:"绝云间的雪，从不落在人间。甘雨独自上山，在仙家门前站了整日，才换来一份轮廓模糊的盟约。\n下山时她对随行者说：这份盟约未必靠得住。可只要山上的人肯开门，人间就多了一条通往云端的路，哪怕这条路细得像一根丝线。"
 LYY_Event.4014.a:"亲赴绝云，缔结盟约"
 LYY_Event.4014.b:"绝云难信，不必结盟"
 LYY_Event.4015.t:"高台天问"
 LYY_Event.4015.d:"甘雨在月海亭前设了一座高台，只问在场所有人一个问题：帝君既已归天，我们靠什么而活？\n台下有人答契约，有人答礼数，有人答什么也不必靠。甘雨没有评判任何一个答案。她只说：这一问，我自己答了三千年，也没答明白。今日，交给你们去答。"
 LYY_Event.4015.a:"坦然发问，任人作答"
 LYY_Event.4015.b:"自拟答案，颁告天下"
 LYY_Event.4016.t:"任官宪章"
 LYY_Event.4016.d:"任官宪章第一条，朴素得近乎迂腐：「为官者，先问百姓，后问上官。」\n有老吏看了直摇头，说这是要乱套。甘雨却把这句话抄给每一个新任官员，说：是叫你们记住，你们的官帽，是从谁的口粮里省出来的。"
 LYY_Event.4016.a:"颁任官宪章，先民后官"
 LYY_Event.4016.b:"维持旧制，以官为先"
 LYY_Event.4017.t:"考成初试"
 LYY_Event.4017.d:"考成之法，考的是实事：修了几条堤、赈了几次饥、清了多少钱粮。\n第一次考绩，三位自诩干练的老吏落了等，一个沉默寡言的县丞却评了上上，只因他一个人，把那县里十九条废渠，全给通了。榜贴出来，满城哗然，可无人不服。"
 LYY_Event.4017.a:"开考成之法，实绩论官"
 LYY_Event.4017.b:"循资历升迁，以免纷争"
 LYY_Event.4018.t:"堂下有人"
 LYY_Event.4018.d:"明堂听政，百姓可立于堂下，听官老爷议事。起初无人敢来，来的也多半是看热闹的。\n日子久了，堂下渐渐蹲满了人。一次，一个寻常农人问出一句话，竟把满堂文官问得哑口无言。甘雨在下首听着，暗暗点头：让百姓听见我们怎么说话，我们才会学着，说人话。"
 LYY_Event.4018.a:"开明堂听政，许民列席"
 LYY_Event.4018.b:"闭门议事，以保威严"
 LYY_Event.4019.t:"义仓灶火"
 LYY_Event.4019.d:"义仓膳堂立在各区，灶火终日不熄。甘雨不让它办成施舍的粥棚，是请来最会做饭的厨娘掌勺。\n第一锅饭端出来时，一个饥饿多日的孩子端起碗，却先抬头看了厨娘一眼。厨娘弯腰摸了摸他的头，说：吃吧，没人笑话你。孩子这才低下头，一口一口地吃了起来。"
 LYY_Event.4019.a:"立义仓膳堂，体面济贫"
 LYY_Event.4019.b:"只设粥棚，聊以果腹"
 LYY_Event.4020.t:"度量归一"
 LYY_Event.4020.d:"度量归一，最得罪人。各家商号自有尺寸，官斗民斗相差悬殊，装得下一整年的人心。\n甘雨铸了一批新衡器，逐户校准，用旧器的罚。有掌柜当众摔了旧斗，骂骂咧咧，可第二天，他还是老老实实换上了新的。因为新斗的生意，做得比谁都稳。"
 LYY_Event.4020.a:"铸衡归一，分毫不让"
 LYY_Event.4020.b:"随俗从众，不计尺寸"
 LYY_Event.4021.t:"街口的鼓"
 LYY_Event.4021.d:"甘雨把衙门前那面从没人敢敲的鸣冤鼓，搬到了最热闹的街口。\n她说：想告状，谁来敲都行，我拦不住，别人也拦不住。鼓面很快被敲得斑斑驳驳。可敲鼓的人，脸上的神情，却比从前亮堂了许多，他们终于知道，这面鼓是敲给活人听的，不是供着的。"
 LYY_Event.4021.a:"鸣冤鼓移于街头，许民直诉"
 LYY_Event.4021.b:"鼓归衙门，非重案不敲"
 LYY_Event.4022.t:"经学之争"
 LYY_Event.4022.d:"经学馆里，先生既讲帝君旧训，也讲刻晴新论，甚至请商会的账房来教怎么算一本清白的账。\n保守的士子愤而离席，甘雨并不挽留。她说：学问若只供殿上人揣摩，那就是摆设。真正的学问，得能回答市集上的问题，也能回答田埂上的问题。"
 LYY_Event.4022.a:"经学馆内，兼采众说"
 LYY_Event.4022.b:"只授旧训，禁议新政"
 LYY_Event.4023.t:"归野之贤"
 LYY_Event.4023.d:"战乱中遁入山林的读书人，被一封一封地请了回来。有人心怀戒备，有人已鹤发苍苍。\n甘雨亲自到城门外迎接。她只说了一句：璃月的账，缺了你们这一笔。一位老学士当场落泪，不为荣宠，只为还有人记得，他们这半生荒废的学问。"
 LYY_Event.4023.a:"遣使迎贤，礼聘归朝"
 LYY_Event.4023.b:"任其隐逸，不劳相请"
 LYY_Event.4024.t:"田埂尝土"
 LYY_Event.4024.d:"授田之制，把荒田重新分到耕者手中。书吏丈量时，甘雨常蹲在田埂上，看老农捏起一把土放到舌尖上尝。\n她问：这土咸不咸，够不够种？老农只是憨笑，一遍遍把那把土攥了又攥。末了他说：够了，够了，能有这么一把土握在自己手里，就够了。"
 LYY_Event.4024.a:"授田与耕者，丈量均分"
 LYY_Event.4024.b:"田归原主，维持旧契"
 LYY_Event.4025.t:"摄政之印"
 LYY_Event.4025.d:"摄政之印铸成，甘雨没有立刻启用。她在案上放了三日，直到确认每一项需要用印的政令都合规合矩，才落下第一笔朱砂。\n有近臣不解。她说：印是死的，握印的手是活的。这枚印要紧，不在它是权力的凭证，而在它时刻提醒我，权力，是要被看住的。"
 LYY_Event.4025.a:"启用摄政之印，依章行权"
 LYY_Event.4025.b:"暂缓用印，再观其变"
 LYY_Event.4026.t:"人仙之约"
 LYY_Event.4026.d:"人仙共治之约，写得像一份家规：仙掌地利，人掌民事，遇争执则请德高者裁，德高者亦不得专断。\n散仙们读罢，有人嗤笑这份约太软，太模糊。甘雨却答：我正是不想立一个斩钉截铁的独断。模糊一点，才有商量的余地；余地，才是乱世里最金贵的东西。"
 LYY_Event.4026.a:"缔人仙共治之约"
 LYY_Event.4026.b:"划清仙凡，各不相犯"
 LYY_Event.4027.t:"一张长凳"
 LYY_Event.4027.d:"仙凡各安，说来轻巧，做时处处是坎。有仙家嫌人间尘嚣，有人间忌仙家清高。\n甘雨不急于调和。她只做一件事：让两者都能在同一座城里，寻到一根可以坐下的长凳。她说：不必相爱，只需不互相伤害，这已经是人间难得的太平。"
 LYY_Event.4027.a:"为仙凡留一张长凳"
 LYY_Event.4027.b:"分立两城，各安其居"
 LYY_Event.4028.t:"太学门额"
 LYY_Event.4028.d:"太学落成那日，甘雨题了四字门额：为不为名。\n有士子不解，她答道：读书不是为当官，也是为了有一天，你面对一桩不公的事，有本事说得出，也扛得住。太学里最热闹的从来是那间通宵亮着灯的辩论堂。"
 LYY_Event.4028.a:"太学立门额，为不为名"
 LYY_Event.4028.b:"太学只育官，专攻举业"
 LYY_Event.4029.t:"月下颁诏"
 LYY_Event.4029.d:"月海之治的诏书，甘雨密密麻麻写了三遍，废了三遍，最后选了最早的那一稿。\n那一稿没有华丽辞藻，只有一句朴素的话：愿此后璃月，饥者有食，寒者有衣，屈者有理可诉。颁诏那夜，满城的灯，一直亮到了月落。有老人站在灯下，对着北方的天空，轻轻鞠了一躬。"
 LYY_Event.4029.a:"颁月海之治诏"
 LYY_Event.4029.b:"暂缓颁诏，先观人心"
 LYY_Event.4030.t:"千秋之雨"
 LYY_Event.4030.d:"千秋之雨，不为一人而降。甘雨在契约末尾写道：此法今日立，未必今日尽美；愿后人以宽容待之，以公心正之。\n她太清楚，一项善政活不过一代，一种善念却能传过十代。她把这份契约名为「雨」，因为它注定要慢慢地下，下过千年的山河。"
 LYY_Event.4030.a:"立千秋之约，托付后人"
 LYY_Event.4030.b:"只定一年之法，随势而变"
 LYY_Event.4031.t:"六礼复兴"
 LYY_Event.4031.d:"六礼复兴，是旧制里最硬的一块骨。冠、婚、丧、祭、乡、相见，一礼一规，重新被郑重拾起。\n有人讥为倒退。甘雨却在六礼中读出一种别样的安慰：在这兵荒马乱的年月，竟还有人认真地办一场婚礼、一场葬礼。她想，这便是人间尚未崩坏的证据。"
 LYY_Event.4031.a:"复兴六礼，重铸人心"
 LYY_Event.4031.b:"废除旧礼，一切从简"
 LYY_Event.4032.t:"神圣契约"
 LYY_Event.4032.d:"契约重新被奉为神圣。甘雨说：帝君留下的，从来是一份契约。\n神像会朽，契约不会，只要还有人肯在上面按手印。她把契约供进月海亭最深处，却把抄本发到了每一个市集、每一处村口，让它在人间的烟火里，替神明继续活着。"
 LYY_Event.4032.a:"奉契约如神，遍颁抄本"
 LYY_Event.4032.b:"契约存库，不必宣扬"
 LYY_Event.4033.t:"分寸之司"
 LYY_Event.4033.d:"礼制之司，管的是分寸：何时该跪、何时该立、何人当先、何事当后。\n有人斥其把活人塞进死规矩。甘雨却答：分寸是让一群陌生人，也能彼此体面地相处。礼崩之后最可怕的是人人都不再在乎别人的体面。"
 LYY_Event.4033.a:"立礼制之司，严定分寸"
 LYY_Event.4033.b:"礼法废弛，任人自处"
 LYY_Event.4034.t:"封存之籍"
 LYY_Event.4034.d:"籍册封存，从此查人、查户、查田，都要凭官府一纸批文。\n甘雨告诉自己这是为防奸宄。可当批文批复得越来越顺手时，她也会在深夜想起年轻时读过的、关于暴秦的史书。她合上案卷，低声道：只是暂时的，这句话，她说给了自己听。"
 LYY_Event.4034.a:"封存籍册，凭文查籍"
 LYY_Event.4034.b:"籍册公开，任人查录"
 LYY_Event.4035.t:"摄政奉天"
 LYY_Event.4035.d:"摄政奉天，把甘雨的权柄抬到了一个连她自己都不安的位置。诏书上写着：「代天理物。」\n她盯着这四个字看了很久，提笔在旁批注：天无言，人声即天声。批完，她把诏书压在所有文牍的最底下，既不肯撤，也不肯让它轻易见人。"
 LYY_Event.4035.a:"摄政奉天，代天理物"
 LYY_Event.4035.b:"只称摄政，不加天命"
 LYY_Event.4036.t:"礼教之乡"
 LYY_Event.4036.d:"礼教之乡，以礼为法，以教代刑。乡里纷争多由德高望重者调解，官府退居幕后。\n这制度安静、有序、有人情味，直到人们发现，那些被「礼」判为不端的人，无论对错，都再难在这乡里抬起头。礼教最温柔的一刀，恰恰砍在最不合群的人身上。"
 LYY_Event.4036.a:"以礼教代刑罚"
 LYY_Event.4036.b:"律法为先，礼教为辅"
 LYY_Event.4037.t:"抑商重农"
 LYY_Event.4037.d:"抑商重农，把商人的地位压到农人之下。市集冷清了，田里的炊烟却旺了。\n甘雨并非不懂商贾之利，她只是固执地相信：把根扎在土地上的人，比把钱驮在牲口上的人，更不容易在乱世里走失。多年之后她会不会后悔，连她自己也不敢断定。"
 LYY_Event.4037.a:"抑商重农，固本培元"
 LYY_Event.4037.b:"农商并重，各从其利"
 LYY_Event.4038.t:"忠信之局"
 LYY_Event.4038.d:"忠信之局网罗了一批最忠于礼制的人。他们不贪不占，办事干净利落，眼睛却越来越尖。\n尖到能在一场寻常家宴上，看出谁坐错了席、谁作错了揖。甘雨提拔了他们，又隐隐怕他们：因为没有人，能比一个真正相信自己在替天行道的人，走得更远。"
 LYY_Event.4038.a:"设忠信之局，察吏治民"
 LYY_Event.4038.b:"裁撤密探，还政于明"
 LYY_Event.4039.t:"旧法的信徒"
 LYY_Event.4039.d:"旧法的守护者，成了新朝廷里最固执的一群人。他们抱着帝君留下的老法典不肯撒手，逐条比对，逐处争辩。\n甘雨起初嫌他们迂阔，后来却渐生敬重：在这个人人都想改点什么的时代，肯为一句话的出处较真到底的人，反倒最接近公道二字。"
 LYY_Event.4039.a:"尊旧法守护者，共议律例"
 LYY_Event.4039.b:"另立新法，不必拘泥"
 LYY_Event.4040.t:"沉默的台谏"
 LYY_Event.4040.d:"台谏沉默了。那些从前专挑皇帝错处的言官，如今只挑些无伤大雅的小毛病，奏章越写越客气。\n甘雨看在眼里，一言不发。她心里清楚，让台谏闭嘴的，是这个太平得让人不敢出声的世道，最深的沉寂，往往不是被迫的。"
 LYY_Event.4040.a:"任台谏缄默，求一时之安"
 LYY_Event.4040.b:"重开言路，纵其争谏"
 LYY_Event.4041.t:"天地一网"
 LYY_Event.4041.d:"天地一统，礼制的尽头，是人间的秩序与天道的秩序，终于缝成了一张严丝合缝的网。\n这网整齐、庄严、无懈可击，只是网眼太小，容不下任何一只想往别处飞的鸟。甘雨立于网中，忽然明白：她织的这张网，最先网住的，也许正是她自己。"
 LYY_Event.4041.a:"缝天人之网，一统礼法"
 LYY_Event.4041.b:"留网眼予异见"
 LYY_Event.4042.t:"不绝之链"
 LYY_Event.4042.d:"不绝之链，把摄政之位织成一条没有尽头的锁链。甘雨许诺：只要璃月一日未复旧观，她一日不退。\n可复旧观三字，谁说得清是何模样？她为自己寻了一个永远说得通的理由，也为自己，画了一个永远走不出的圈。链子越缠越紧，钥匙却始终握在她自己手里。"
 LYY_Event.4042.a:"以不绝之链，续摄政之权"
 LYY_Event.4042.b:"定下还政之期"
 LYY_Event.4043.t:"永摄之诏"
 LYY_Event.4043.d:"摄政永续。甘雨改了诏书措辞，把暂摄改为永摄。改完，她独自坐到天明，反复摩挲那枚用了半生的印章。\n她想起三千年前第一次摸到这印时，帝君曾笑着说：等你哪天不想摸了，就该还回来了。如今印还在，那句笑，却再也听不见了。"
 LYY_Event.4043.a:"改诏为永摄，权柄不移"
 LYY_Event.4043.b:"坚守暂摄，定期归政"
 LYY_Event.4044.t:"旧约重立"
 LYY_Event.4044.d:"旧约重立，把帝君当年那份契约一字不差地复原，重新颁行天下。百姓对着石碑焚香，仿佛神明真的归来。\n唯有甘雨知道，碑上那个名字的主人，早已不在了。从今往后，守这份契约的，是无数个平凡到几乎记不住名字的、活着的凡人。"
 LYY_Event.4044.a:"重立帝君旧约，昭告天下"
 LYY_Event.4044.b:"另立新约，不必循旧"
 LYY_Event.4045.t:"三千年的账"
 LYY_Event.4045.d:"三千年的账，甘雨一个人默默记着。哪年大旱，哪年丰稔，哪家添丁，哪户绝后，她全都记得。\n夜深人静时她偶尔会想：这一本本流水账，是为谁而记？帝君在时替神记，帝君去后替自己记。记到后来，她渐渐分不清，是她在记着璃月，还是璃月，一直在记着她。"
 LYY_Event.4045.a:"承认旧账，续记新篇"
 LYY_Event.4045.b:"掩去旧账，只记将来"
 LYY_Event.4046.t:"层岩封印"
 LYY_Event.4046.d:"层岩之下，有比契约更古老的裂痕。甘雨亲自带队去加封那道裂口，一路无言。\n回程时她对随行者低语：最让神明头疼的，从来是深渊。它总在你最得意的时候提醒你，无论人间立起多高的大厦，底下都还压着一层，是连神也照不到的地方。"
 LYY_Event.4046.a:"亲赴层岩，加封裂口"
 LYY_Event.4046.b:"委派他人，按例行封"
 LYY_Event.4047.t:"山中炊烟"
 LYY_Event.4047.d:"乱世里，最先被牺牲的，是最不会呼喊的百姓。甘雨下令开放山中洞天与谷地，让流民栖身。\n有人担忧这是养虎为患。她却说：一个国家的慈悲，恰恰体现在它如何对待那些，对自己毫无用处的人。山中的炊烟，渐渐比城中还要密了几分。"
 LYY_Event.4047.a:"开放山中，庇纳流民"
 LYY_Event.4047.b:"封锁山口，固守险要"
 LYY_Event.4048.t:"北国来书"
 LYY_Event.4048.d:"至冬的来书用词很客气，条件却很强硬：只要璃月肯开一个口子，至冬便包揽它三年的粮运。\n甘雨把信读了又读，在回函里写道：璃月可以借粮，绝不借路。写完又添一句：我不怀疑你们的诚意，我怀疑的是，雪化了之后，留下的那摊水。"
 LYY_Event.4048.a:"拒借路，只借粮"
 LYY_Event.4048.b:"接受北援，共理粮运"
 LYY_Event.4049.t:"任重"
 LYY_Event.4049.d:"任重，道远。甘雨在给同僚的信中写道：我这一生做过的最重的活，是每天清晨，把今天要做的事，一件一件地想清、排好、再一件一件做掉。\n她说：撑起一个国家的，从来是无数个寻常的清晨，你得在每一个清晨，都还愿意坐回那张椅子上。"
 LYY_Event.4049.a:"以任重自任，坦承其难"
 LYY_Event.4049.b:"轻描淡写，鼓舞士气"
 LYY_Event.4050.t:"不复操心的清晨"
 LYY_Event.4050.d:"内战结束那天，甘雨把虚君之位那盏长明灯，亲手吹灭。大殿暗了一瞬，随即被天光照亮。\n她走出月海亭，见街上百姓往来如常：卖豆腐的在吆喝，学童在背书，码头的船照旧进出。她站了很久，轻声说：总算，可以不必再替神操心了，从今往后，操心的，是我们自己。"
 LYY_Event.4050.a:"熄灭长灯，转向人间"
 LYY_Event.4050.b:"保留长灯，不改其志"
 LYY_Event.4051.t:"玉衡的回信"
 LYY_Event.4051.d:"玉衡的回信来得很短，态度却让甘雨意外地温和。刻晴写道：粮可以共守，理可以各执，我信得过你手底下的账。\n甘雨把信读了两遍，对谋士说：这世上最难对付的，从来是互相看不起的人。能互相看不惯、却仍肯一起把稻子收完的，反倒最有指望。"
 LYY_Event.4051.a:"与玉衡共守粮道"
 LYY_Event.4051.b:"拒其插手，独掌粮政"
 LYY_Event.4052.t:"天权的回信"
 LYY_Event.4052.d:"天权的回信写得密不透风，全是数字：粮价、运费、损耗，一笔一笔，像在交一份功课。\n甘雨逐行看完，提笔在末尾批道：账算得极精，可惜少了一样，吃饭的人，不是数字。她犹豫再三，还是把这句话留在了信里。她想，凝光看得懂的。"
 LYY_Event.4052.a:"与天权共理财政"
 LYY_Event.4052.b:"拒之门外，不假财阀"
 LYY_Event.4053.t:"绝云间的雪"
 LYY_Event.4053.d:"绝云间的雪，是甘雨最熟悉、也最不敢亲近的东西。使者带回一片不化的雪，和一句极冷的话。\n甘雨把雪供在月海亭最深处，整夜没有合眼。她想起自己本是麒麟，却选择留在了人间，这个选择，三千年来，她从未对谁提起过。此刻，她忽然很想找个人说说话，却发现身边，只剩一片不化的雪。"
 LYY_Event.4053.a:"认下这片雪，独自珍重"
 LYY_Event.4053.b:"弃雪于地，专心国事"
 LYY_Event.4054.t:"云来海的茶"
 LYY_Event.4054.d:"公子的回信写得很随意，末尾还画了一艘歪歪扭扭的船。他说：打仗最费钱，做买卖最省钱，你们中原人，总是把这两件事搞反。\n甘雨看完竟笑了。她对使者说：这个人可怕的地方，不在他的刀，而在他把刀和钱，看得一样清。此后她每逢北事，总要多留三分神。"
 LYY_Event.4054.a:"以文治应公子之商谈"
 LYY_Event.4054.b:"以刀兵拒至冬之好意"
 LYY_Event.4055.t:"沉玉谷的水"
 LYY_Event.4055.d:"沉玉谷的回话只有一行：你们的水章程写得比山路还绕，可它没写错一个字。\n甘雨把那行字看了很久，忽然觉得心里松了一块。她对使者说：这个世上，最难得的是有人肯认真读你写的每字每句，哪怕她并不打算配合你。"
 LYY_Event.4055.a:"虚心纳沉玉之谏"
 LYY_Event.4055.b:"斥其阻碍大计"
 LYY_Event.4056.t:"十二贤共立"
 LYY_Event.4056.d:"十二位贤者，第一次被请进同一间厅堂。他们中间，有主张共和的，有主张复旧的，也有干脆主张什么都别改的。\n甘雨没有试图让任何人改变主意。她只说：今日不必说服彼此，只需记住，我们都还愿意来。散会时，十二个人鱼贯而出，有人行色匆匆，有人回头多看了这座厅堂一眼。"
 LYY_Event.4056.a:"邀十二贤共立新约"
 LYY_Event.4056.b:"只与同道续订旧契"

 GYP_Spirit_Moonlit_Secretariat:"月海秉政"
 GYP_Spirit_Moonlit_Secretariat_desc:"月海亭的灯，三千年未熄。它照过神明批阅的奏章，也照过凡人掌印的诏书，灯下的人换了一茬又一茬，那一点不肯灭的亮，才是这座城真正的骨头。"
 GYP_Spirit_Restored_Rites:"礼典重光"
 GYP_Spirit_Restored_Rites_desc:"礼是让一群陌生人也能彼此体面相处的东西。删去苛繁，留下温厚，一个懂得如何安放人心的国家，才走得长远。"
 GYP_Spirit_Grand_Secretariat:"文华内阁"
 GYP_Spirit_Grand_Secretariat_desc:"一个让不同主意坐下来吵架的地方。吵完出去，还得并肩把事办了，这既是文官治国的本事，也是它最磨人的地方。"
 GYP_Spirit_Adepti_Compact:"仙凡之约"
 GYP_Spirit_Adepti_Compact_desc:"与人共治，本就是一件含糊的事。可人间最金贵的东西，恰恰是这份还能商量的余地，它比任何斩钉截铁的独断，都更接近智慧。"
 GYP_Spirit_Sacred_Contract:"契约神圣"
 GYP_Spirit_Sacred_Contract_desc:"神像会朽，契约不会。把一个国家的根本，从一尊会腐朽的偶像，换成一份可以被无数平凡人按上指印的约定，这才是最深的敬畏。"
 GYP_Spirit_Clerisy_State:"礼教之国"
 GYP_Spirit_Clerisy_State_desc:"以礼为法，以教代刑。它安静、有序、人情味十足，直到你发现，那些被「礼」判为不端的人，无论对错，都再难抬起头。"
 GYP_Spirit_Unbroken_Chain:"不绝之链"
 GYP_Spirit_Unbroken_Chain_desc:"「只要璃月一日未复旧观，她一日不退」，这句话说得如此动人，以至于没有人追问：由谁，来定义旧观二字。"
 GYP_Spirit_Benevolent_Rule:"仁政润物"
 GYP_Spirit_Benevolent_Rule_desc:"开仓、宽税、授田、义仓，桩桩件件都赔本，桩桩件件都换不来即刻的回报。可一个国家的德行，本就该由这些不划算的账来记账。"
 GYP_Spirit_Civil_Service:"科举之盛"
 GYP_Spirit_Civil_Service_desc:"不问出身，只问文章与实绩。一个肯让寒门子弟走进朝堂的国家，便是在替自己打开一扇又一扇，本会永远关着的门。"
 GYP_Spirit_Three_Thousand_Years:"三千年之录"
 GYP_Spirit_Three_Thousand_Years_desc:"一个人替一座城记了三千年的账。她见过太多王朝起落，因此比谁都懂：真正长久的，从来是那些无人喝彩的、寻常的清晨。"
 GYP_Spirit_Everlasting_Rain:"千秋之雨"
 GYP_Spirit_Everlasting_Rain_desc:"一项善政活不过一代，一种善念却能传过十代。这份契约定要慢慢地下，像一场润物无声的雨，下过千年的山河，不为一人而降，却让所有人都淋到了它的清凉。"
 GYP_Spirit_Five_Envoys:"五方通使"
 GYP_Spirit_Five_Envoys_desc:"五面旗，五次试探，五条通向不同未来的路。甘雨未必能说服谁，但她至少让所有人都知道，人间这座亭子，还开着门。"
 GYP_Spirit_Twelve_Scholars:"十二贤共立"
 GYP_Spirit_Twelve_Scholars_desc:"十二个各执一词的人，头一次被请进同一间厅堂。没有人被说服，可也没有人离席，这，就是礼制能给人间最好的礼物：让不同的人，也能坐在一起。"

 GYP_Rite_Tier_1:"礼制等级"
 GYP_Rite_Tier_1_desc:"礼制崩坏，旧礼尽废，新规未立。人各凭心，事各凭意，热闹倒热闹，只是没了章法。"
 GYP_Rite_Tier_2:"礼制等级"
 GYP_Rite_Tier_2_desc:"礼制草创，新礼粗具轮廓，众人勉强按谱行事，行得生涩，却也渐成习惯。"
 GYP_Rite_Tier_3:"礼制等级"
 GYP_Rite_Tier_3_desc:"礼制得宜，上下有序，进退有度。人与人之间，多了一层郑重的分寸，少了几分兵荒马乱的粗粝。"
 GYP_Rite_Tier_4:"礼制等级"
 GYP_Rite_Tier_4_desc:"礼制森严，典章完备，规行矩步。举国上下像一部上了弦的机关，精确，庄重，也透着一丝不容通融的冷。"
 GYP_Rite_Tier_5:"礼制等级"
 GYP_Rite_Tier_5_desc:"礼制过盛，规矩织成了一张看不见的网。网中人举止得体，却再无人敢越雷池半步；活人到这一步，便活成了一件礼器。"
 GYP_Benevolence_Tier_1:"民生等级"
 GYP_Benevolence_Tier_1_desc:"民生凋敝，仓廪空虚，巷陌萧条。政令再庄重，也填不饱一只空碗。"
 GYP_Benevolence_Tier_2:"民生等级"
 GYP_Benevolence_Tier_2_desc:"民生初安，百姓勉强温饱，市面冷而不散。日子过得下去，但没人敢多添一件衣裳。"
 GYP_Benevolence_Tier_3:"民生等级"
 GYP_Benevolence_Tier_3_desc:"民生殷实，仓有陈粮，户有余钱。炊烟比从前更密，市集比从前更早。"
 GYP_Benevolence_Tier_4:"民生等级"
 GYP_Benevolence_Tier_4_desc:"民生富足，仓满廪实，闾阎安堵。善政之报，不在庙堂的颂声，而在每一处灶台多出的一缕热气。"
 GYP_Benevolence_Tier_5:"民生等级"
 GYP_Benevolence_Tier_5_desc:"民生极盛，四海升平，百业向荣。仓廪实而知礼节，一个能让人吃上饱饭的国度，连沉默的百姓，走路都挺得直些。"
 GYP_Combo_Twin_High:"礼繁民困"
 GYP_Combo_Twin_High_desc:"上下进退皆有讲究，日子却越过越紧。规矩织成一张密网，网里的人举止得体，也动弹不得。"
 GYP_Combo_Twin_Low:"礼崩民散"
 GYP_Combo_Twin_Low_desc:"旧礼废了，仓廪也空了。人心没了落处，一座城开始各自为活。"
 GYP_Combo_A_High:"盛礼虚仓"
 GYP_Combo_A_High_desc:"典章重光，百姓却吃不饱。朝堂上热闹非凡，城门外有人在啃树皮。"
 GYP_Combo_B_High:"宽政失序"
 GYP_Combo_B_High_desc:"仁政润物，奈何没了章法。人人得利，人人也都不服谁。"

 #################### 甘雨 · 月海亭（GYP） · 战后 ####################
 GYP_PW_Moonlit_New_Order:"月海新章"
 GYP_PW_Moonlit_New_Order_desc:"内战落定，璃月的旗换了颜色，月海亭的灯却还亮着。甘雨在案前坐了一夜，把帝君旧制一册册翻出来批注。她对围坐的文官说：神明不在了，这城还得有人管账、有人修路、有人替打翻的碗赔钱。从今天起，这份差事归我们，办得好坏都由我们认。"
 GYP_PW_Count_the_Ruins:"清点残册"
 GYP_PW_Count_the_Ruins_desc:"清点残册的活没人肯接，账目乱得像一堆碎瓷。甘雨亲自坐进库房，把每一页浸了水的文书摊在太阳底下晾干，再一张张压平。她说：塌掉的东西不值钱，记着它怎么塌的字才值钱。往后谁要修城，先来读一遍这堆纸。"
 GYP_PW_Restore_the_Wards:"复整坊巷"
 GYP_PW_Restore_the_Wards_desc:"坊巷重划，按旧邻与人口，不按谁出的钱多。有人抬着礼单来求情，甘雨把礼单折好退回去，说：你那份地，从前是买来的；今天分的这一份，是让出来的。两笔账分开立，谁也不吃亏，谁也不占先。"
 GYP_PW_Return_the_Fields:"还田复耕"
 GYP_PW_Return_the_Fields_desc:"还田的告示写得直白：谁耕的地归谁，战前的旧契暂且靠后。有老农不信，抱着契纸在田埂上坐了半天。甘雨没有派兵去赶，只让书吏当着他的面把界桩重打一遍。桩子落土的声音一响，老人自己把契纸叠好，收进了怀里。"
 GYP_PW_Open_the_Granaries:"开仓平粜"
 GYP_PW_Open_the_Granaries_desc:"开仓的头一日，粮车从月海亭排到码头。甘雨没有站高处，挤在领粮的队伍里，亲手把一斗米递到一位老妪手中。老妪认出她，问帝君是不是真的不在了。她替老人把米袋扎紧，答：不在了。可饿肚子这件事，往后有人管。"
 GYP_PW_The_Rites_of_Mourning:"国丧定礼"
 GYP_PW_The_Rites_of_Mourning_desc:"国丧的礼数定得极简，不设大醮，不用童男童女，只留三日素服、一炷清香。有老臣嫌寒酸，甘雨把旧档翻出来给他看：当年立这条礼的人，也是怕活人为了死人，先把活人饿死。礼是给活着的人定的，这一点，三千年前就写清楚了。"
 GYP_PW_The_Registry_of_Souls:"编户清册"
 GYP_PW_The_Registry_of_Souls_desc:"编户清册不区分贵贱，一家一行，一人一名。有吏员嫌查得琐碎，甘雨把册子翻到某页，指着一行问：这一家五口，你知道户主叫什么吗。吏员答不上来。她说：从前他们是一串数字，从今天起，至少各自占着一行。"
 GYP_PW_Reopen_the_Schools:"重开书院"
 GYP_PW_Reopen_the_Schools_desc:"书院的门重开那天，没有锣鼓，只有一块写着开讲时辰的木牌。头一批来听讲的有船工、有挑夫，也有卖鱼的妇人。甘雨亲自讲了一课，讲的是怎么看清一张借据里藏的话。她说：认得字的人多一个，骗人的话就少一张。"
 GYP_PW_The_Examination_Halls:"贡院重立"
 GYP_PW_The_Examination_Halls_desc:"贡院重修，号舍按旧制一间隔一间，题目从库里出。有旧家托人打听题目，被甘雨挡了回去：题目我锁着，钥匙三个人各拿一把。她要的是让寒门子弟走进来的时候，心里明白这一场比的是字，不是门户。"
 GYP_PW_The_History_Bureau:"设馆修史"
 GYP_PW_The_History_Bureau_desc:"史馆设在月海亭西厢，三间屋子，四五个老史官。甘雨给他们定了一条规矩：写败仗要写全，写胜仗也要写清代价。有史官下笔犹豫，她答：史书若只记好听的话，后人拿它当什么用。修史这事慢，可它比修城墙经得住年月。"
 GYP_PW_The_Grand_Secretariat:"重立中枢"
 GYP_PW_The_Grand_Secretariat_desc:"中枢重立，不叫内阁，不称军机，只叫月海亭议事。甘雨说：名字越朴素越好，省得有人听着威风，就忘了这里是替谁办事的。第一次议事，两位旧臣当场争起来，她没拦，只让书记照记。散会后，端茶的小吏看见满桌都是改过的字。"
 GYP_PW_The_Calendar_and_Music:"订历复乐"
 GYP_PW_The_Calendar_and_Music_desc:"历书重订，乐律也一并复起。有年轻人问，算节气和编钟磬有什么相干。甘雨答：一年的日子要有准头，人心里才有底；乐音要摆得正，人在堂上才知道怎么开口。这两样都不产粮，可少了它们，一个国就像一间没摆桌椅的空屋子。"
 GYP_PW_The_Standard_Measures:"度衡归一"
 GYP_PW_The_Standard_Measures_desc:"度衡归一，是顶得罪人的差事。各家商号的尺斗称，差得能吞下一年的人心。甘雨铸了新器，逐户校准，谁用旧的就罚谁的款。有掌柜当众摔了旧斗，骂了几句粗话，转天还是换上了新器。新斗的生意，做得比谁都稳。"
 GYP_PW_Envoy_to_the_Qixing:"致书玉衡"
 GYP_PW_Envoy_to_the_Qixing_desc:"给玉衡的信写得客气，话却实在：粮道可以共守，政见可以各执。甘雨对使者说：刻晴那边，账算得清，人也直。跟直人打交道省事，只是别指望她让半步。信发出前，她把称呼改了三遍，最后只用了两个字：刻晴。"
 GYP_PW_Envoy_to_the_Chamber:"通使天权"
 GYP_PW_Envoy_to_the_Chamber_desc:"天权的回函密密麻麻，全是数字，粮价运费损耗，一项不落。甘雨逐行看完，提笔在末尾批了一句：账算得极细，可惜漏了一样，吃饭的人不是数字。写完她犹豫了一阵，还是把这句话留在了信里。她知道凝光读得懂分寸。"
 GYP_PW_Envoy_to_the_Snow:"问雪绝云"
 GYP_PW_Envoy_to_the_Snow_desc:"绝云间的雪，是甘雨最熟悉也最不敢多碰的东西。使者上山的公文，她只写了一行：山上的旧约还在，可愿下来坐坐。申鹤托人带回一句话和一片不化的雪。甘雨把雪供在案上，说：她肯给这句话，就已经比我预想的，多走了一步。"
 GYP_PW_Envoy_to_the_North:"北国来使"
 GYP_PW_Envoy_to_the_North_desc:"北国来的使者带着一份厚礼和一封厚信，条件写得漂亮。甘雨把信读了三遍，最后在回函里写：璃月可以借粮，路不借。使者脸色一沉，她只是把账推过去：我算过你们的算盘，也算了我们自己的。散会后，那份厚礼原样退了回去。"
 GYP_PW_Envoy_to_the_Valley:"沉玉谷约"
 GYP_PW_Envoy_to_the_Valley_desc:"沉玉谷的山路上，使者被兰砚拦了下来，听到第一句就是：你们的文书，写得比山路还绕。使者没有争辩，把那卷水土章程一字不改地留下。兰砚翻了半宿，第二天回了一行字：绕是绕，可它没写错一个字。甘雨看到这行字，笑了一下。"
 GYP_PW_The_Five_Concords:"五方和议"
 GYP_PW_The_Five_Concords_desc:"五方和议在月海亭摆了三天，刻晴派了执笔的，凝光派了管账的，绝云间来了一位不愿留名的，北国带来一船货，沉玉谷送来一捆水文图。甘雨没有做东，只做了个管添茶的人。散会时，五张椅子都被坐热了，桌上留着一圈谁也没擦的茶渍。"
 GYP_PW_The_Empty_Shrine:"空殿依旧"
 GYP_PW_The_Empty_Shrine_desc:"帝君的神位空着，案、椅、印、灯一样不动，一样不用。有人提议撤了旧殿改作衙门，甘雨没答应。她说：那盏灯我每月初一亲自去添一次油，是让自己每月看清楚一回，那个位子可以空，却不该再有人坐上去。"
 GYP_PW_Revere_But_Not_Ask:"敬而不用"
 GYP_PW_Revere_But_Not_Ask_desc:"祭仪照办，问卜停了。甘雨把这条规矩写进典章，措辞留着余地：敬天如故，求签问卦，不载于国事。有老臣强烈反对，她答：我们照旧对天存一份敬意，只不再拿它当决策的凭据。谁家的事，谁家自己定，这样往后出了错，才找得到人。"
 GYP_PW_The_Annals_of_Omens:"谶纬存录"
 GYP_PW_The_Annals_of_Omens_desc:"历年的谶纬、天象、旧签文，被史官一条条抄录归档，后面附上后来应验与否。有经手的老吏越查越心惊，甘雨却在卷末写了一行：我们是给后人留一本能自己辨的书。这卷书后来放在书院最显眼的那格，翻得比什么经都旧。"
 GYP_PW_The_Chasm_Seal:"层岩加封"
 GYP_PW_The_Chasm_Seal_desc:"层岩的裂口又加固了一遍，用的是新铸的合金与新灌浆法。甘雨亲自下到井口，看最后一道闸门落下。她说：底下这东西不讲道理，你得意的时候它就来提醒你，楼盖得再高，下面还压着一层照不到的地方。今天多封一分，明天的人就少赌一次命。"
 GYP_PW_The_Ledger_of_Old_Debts:"旧债成卷"
 GYP_PW_The_Ledger_of_Old_Debts_desc:"层岩历年欠下的账，被编成一册卷宗：哪一年塌方，填了多少人，赔了多少家，用了多少工。甘雨要的是让每一笔旧债都有个着落。她说：欠着不记，它就永远是一笔糊涂账；记明白了，后人接手时才知道自己扛的是多重的东西。"
 GYP_PW_Rites_Against_the_Abyss:"以礼镇渊"
 GYP_PW_Rites_Against_the_Abyss_desc:"镇渊的办法，甘雨选了最笨的一种：一部专讲深渊沿革与祭法的典。她把祭仪写进去，也把历次封堵的得失写进去。有人笑这不顶用，她说：刀剑镇得住一时的裂缝，镇不住人心里的怕。让百姓知道这底下是什么、该怎么躲，比多派一队人下去更值。"
 GYP_PW_The_Millelith_Reformed:"千岩整顿"
 GYP_PW_The_Millelith_Reformed_desc:"千岩军重新编营，饷照旧，名号换了。甘雨在点校那日说：这支队伍从前守的是城，从今往后，还要记得守住城里的那些人。队伍里安静了一阵，随后起的一声应答，和从前不太一样。有老兵摸了摸新发的臂章，没说话，把它抚平了。"
 GYP_PW_The_Pass_Garrisons:"关隘戍守"
 GYP_PW_The_Pass_Garrisons_desc:"山口的关隘一处处重修，新图样上多了一条旧图没有的要求：关墙要留一道能过板车的门。有校尉不解，甘雨答：关隘挡的是兵，别把逃难的百姓也一并关在外头。这道门后来被守卒叫作小民门，逢战事总是头一个开，也总是最后一个关。"
 GYP_PW_The_Mountain_Watch:"山道巡防"
 GYP_PW_The_Mountain_Watch_desc:"巡山的哨队招了本地猎户和药农，甘雨给的第一条命令是认路：哪条道能走骡马，哪处崖能藏人。她说：守这片山的人，先得是懂这片山的人。半年后，队里自己绘出的山川图比官图还细，连哪条溪在旱季会断，都标得清清楚楚。"
 GYP_PW_The_Arsenal_of_Moonlit:"月海兵造"
 GYP_PW_The_Arsenal_of_Moonlit_desc:"兵造从港口近郊挪进了山坳，产量翻了一倍，附近的村子也跟着添了人气。甘雨定下一条规矩：所造之物，皆刻工匠之名。她说：有人署名的兵器，才不会随便杀人，也有人署名的活计，才不会随便糊弄。头一件刻名的兵器，在门口摆了半月才入库。"
 GYP_PW_The_Militia_Registers:"乡兵在册"
 GYP_PW_The_Militia_Registers_desc:"乡兵不再临时拉夫，按里坊登记在册，各家出丁，训练课目里添了一条：先学怎么不误伤自己人。甘雨说：上过阵的人都知道，难的是枪口抬高一寸。这话后来写进了操典的头一页，纸角被翻得起了毛边。"
 GYP_PW_The_War_College:"武备学堂"
 GYP_PW_The_War_College_desc:"武备学堂开在城南，讲的是行军、布防、粮道，也讲怎么算一场仗值不值得打。甘雨去听过一堂课，末了对学生说：会舞刀的人多的是，会用刀之前先想一想的人，才难得。学堂里挂的第一幅图是一张标着水井和村落的行军路。"
 GYP_PW_The_Question_of_the_Realm:"治道之问"
 GYP_PW_The_Question_of_the_Realm_desc:"纲常立住了，往后往哪走，议事厅里吵了整整三旬。甘雨把大门敞开，谁都能进来讲。吵到最后，卷宗堆了半人高，也没吵出个头绪。她看着这堆纸说：吵不完最好，真吵完了，才是没人敢开口了。往哪条路走，交给愿意担的人来担。"
 GYP_PW_Charter_of_Office:"任官宪章"
 GYP_PW_Charter_of_Office_desc:"任官宪章的头一条写在头一行：为官者，先问百姓，后问上官。有老吏看了直摇头，说这要乱套。甘雨把这句话抄给每位新任官员，说：是让你们记住，你们的俸禄，是从谁的口袋里省出来的。这一条，后来被刻在了衙前的石上。"
 GYP_PW_Merit_Ledger:"考成则例"
 GYP_PW_Merit_Ledger_desc:"考成则例考的是实事：修了几条堤、赈了几回饥、清了几笔钱粮。头一年考绩，三个自诩老练的官落了等，一个闷声不响的县丞评了上上，只因他一个人把那县里十九条塌了的渠全给通了。榜贴出来那日，满城议论，却没人喊冤。"
 GYP_PW_Remonstrance_Office:"谏议之司"
 GYP_PW_Remonstrance_Office_desc:"谏议之司专替说不出话的人说话。甘雨把衙前那面没人敢敲的鸣冤鼓，挪到了最热闹的街口，说：想告状谁来敲都行，我拦不住，别人也拦不住。鼓面很快敲得斑斑驳驳。值守的吏员起初嫌烦，后来发现，敲鼓的人里头，说的话往往最靠得住。"
 GYP_PW_Code_of_State:"典章为纲"
 GYP_PW_Code_of_State_desc:"典章成书，几十卷，甘雨逐条校过。她把最琐碎的一条留了下来，写的是乡里分水该怎么先后用。有人说这太小，她答：大典管的是国，小条管的是日子，一个国能不能立住，常常就断在这类没人愿写的细处。书成那天，她只在卷尾签了名。"
 GYP_PW_Prefectures_and_Counties:"郡县复原"
 GYP_PW_Prefectures_and_Counties_desc:"郡县两级重新划清，谁管内政谁掌兵，条文写得明白。甘雨对赴任的官员只说一句：到了地方，先看两样东西，田里的水和衙门里的账。有老臣担心权分得太散，她答：散一点，出了事才知道该问谁；全攥在一只手里，烂了也只能烂在里面。"
 GYP_PW_Great_Academy:"太学之立"
 GYP_PW_Great_Academy_desc:"太学落成，门额上四个字是甘雨题的：为不为名。有士子不解，她答：读书不是为做官，也是为了有一天你撞上一桩不公的事，有本事说得出，也扛得住。太学里最热闹的从来是那间通宵亮着灯的辩论堂。"
 GYP_PW_Gentle_Administration:"宽政之实"
 GYP_PW_Gentle_Administration_desc:"宽政是把该收的收明白，把不该收的退回去。甘雨让人把各乡的税册摊在衙门口，谁家的账谁自己核。有豪强不服，她只回一句：你嫌查得紧，可以来跟我一条条对；对完了，多收的一分不少退。头一年，退回去的粮，装了满满三十车。"
 GYP_PW_Moonlit_Reign:"月海之治"
 GYP_PW_Moonlit_Reign_desc:"月海之治的诏书，甘雨写了三稿，废了三稿，最后用的是最早那一稿，通篇没有一句漂亮话，只说愿此后璃月，饥者有食，寒者有衣，受了委屈有地方说理去。颁诏那夜，满城的灯亮到了月落。有老人站在灯下，朝着北边的天，慢慢躬了一躬。"
 GYP_PW_Summon_the_Adepti:"请仙入朝"
 GYP_PW_Summon_the_Adepti_desc:"请仙入朝的信，甘雨是亲自送上山的。她没有带仪仗，只带了一壶茶和一本账。她对山上的散仙说：不请你们管事，只请你们来坐，听一听人间如今的难处。有仙人问她图什么，她答：图这三千年来头一回，人和仙能坐在一张桌边，喝同一壶茶。"
 GYP_PW_The_Seat_of_the_Immortals:"仙班设席"
 GYP_PW_The_Seat_of_the_Immortals_desc:"月海亭东厅添了几张席，不设名位，谁来谁坐。有文官不惯，甘雨说：座上的人换得勤一点，底下的话才听得真一点。仙家议事不多言，可每逢有人把数字报得太顺，总有人轻轻点一句，问那个数字是怎么算出来的。这一问，比什么章程都管用。"
 GYP_PW_The_Compact_of_Jueyun:"绝云立约"
 GYP_PW_The_Compact_of_Jueyun_desc:"绝云之约写得像一份家规：仙掌地利，人掌民事，起了争执请德望高者裁，裁者亦须让三分。有仙人笑这约太软，甘雨答：我就是要留一处能商量的余地。把话说死了，往后谁都不好退；留着余地，才有人肯坐下。立约那日，山上山下各按了手印。"
 GYP_PW_Heaven_and_Earth_Together:"天人同序"
 GYP_PW_Heaven_and_Earth_Together_desc:"天人同序，把祭天、祭地、祭山河的礼重新排了一遍，排在头一位的是春耕。甘雨说：先敬这一年要下地的犁，再敬别的。有老臣觉得次序不对，她答：天给人间的好处，是靠一场好雨、一季好收成落到实处的，那就从田里敬起。"
 GYP_PW_The_Elixir_Fields:"丹田同养"
 GYP_PW_The_Elixir_Fields_desc:"丹田同养，说的是仙家炼丹的那套道理，也用到养民上：不图一时之效，图个长远。甘雨请仙家把调理的法子写下来，改一改，用在灾后重新下地的人身上。见效慢，可头一年染病的人少了两成。她说：慢的东西能站住，快的东西常常留不住。"
 GYP_PW_The_Mountain_Capital:"山中陪都"
 GYP_PW_The_Mountain_Capital_desc:"山中陪都照着旧日的洞天修，修的却多是粮仓与药庐。甘雨说：山上是让遭了灾的人有个能喘口气的地方。陪都落成后，第一拨上山的是南边遭了水患的三百户人家。他们下山时，把山门前那一排新栽的松树，一棵一棵都浇了水。"
 GYP_PW_Clouds_and_Mortals:"云泥同途"
 GYP_PW_Clouds_and_Mortals_desc:"云与泥，到底还是两样人。甘雨没有强要把他们捏成一处，只做一件事：让山上和山下的人，都能在同一座城里找到一根能坐下的长凳。她说：不必相亲，只要不互相防备，就已经是很难得的太平。城里那几条长凳，后来被磨得发亮。"
 GYP_PW_Immortal_Regency:"仙辅之政"
 GYP_PW_Immortal_Regency_desc:"仙辅之政，把几位仙人请进了议事厅的常席，辅政而不主政。甘雨在席约上写得明白：事由人决，仙只参议，参议的话要记进档。有人问她怕不怕仙势坐大，她说：怕。所以我把它写成了字，字比人情牢靠。有仙人看完这条，点了点头，先按了印。"
 GYP_PW_The_Three_Thousand_Years:"三千年之录"
 GYP_PW_The_Three_Thousand_Years_desc:"三千年的旧账，甘雨一个人记着。哪年大旱，哪年丰收，哪家添丁，哪户断了香火，她心里都有一本。夜深时她偶尔会想：这本流水账到底替谁记的。帝君在时替神记，帝君走了替自己记。记到后来，她分不清是她在记着璃月，还是璃月在记着她。"
 GYP_PW_The_Names_on_the_Stele:"碑上刻名"
 GYP_PW_The_Names_on_the_Stele_desc:"井下牺牲者名录又添了一页。甘雨下令为每个名字立碑，不分生前属于哪一方。她说：我们跟深渊的账，不能只记赢的那一半，埋在底下的人也该留个名。碑立那天，来了许多人，有胜的，有败的，也有谁都不认的。他们站在碑前，谁也没先走。"
 GYP_PW_Reunified_Liyue:"天下定鼎"
 GYP_PW_Reunified_Liyue_desc:"天下定鼎那日，甘雨亲手吹灭了虚君之位的长明灯。大殿暗了一瞬，随即被透进来的天光照亮。她走出月海亭，街市如常，卖豆腐的在吆喝，学童在背书，船照旧进出。她站了很久，轻声说：总算不用再替神操心了。往后操心的，是我们自己。"
 GYP_PW_The_Everlasting_Moon:"月海长明"
 GYP_PW_The_Everlasting_Moon_desc:"月海长明，不为一人而亮。甘雨把这条写进最后一道诏令，又在末尾添了一句：此法今日立，未必今日尽美，愿后人以宽容待之，以公心正之。她太清楚，一项善政活不过一代，一种善念却能传过十代。这盏灯换人看管，却始终没有熄过。"
 GYP_PW_An_Eternal_Ledger:"万世之籍"
 GYP_PW_An_Eternal_Ledger_desc:"万世之籍，收的是三千年来所有的账：典章、赋税、水利、封渊、抚恤，一册册码进库里。甘雨老了，最后一册是她自己落笔的。她写道：此册不载功过，只载事情。后人要评谁，翻账便是，不必再来问我。写完，她把笔搁下，走出了库房。"

 GYP_postwar_category:"月海新章"
 GYP_postwar_category_desc:"甘雨战后的抚民决议组。战事平息之后，麒麟一系把心力放在赈济、劝农与调和各家矛盾上，务求让璃月休养生息。日子过得安稳，比什么功业都紧要，人心定了，别的事情才有得谈。等百姓重拾旧业，璃月便又活了过来。人心慢慢聚拢，日子也就有了起色。"
 GYP_decision_pw_relief_famine:"赈济饥荒"
 GYP_decision_pw_relief_famine_desc:"灾年最缺的是米，最怕的是消息比粮车走得慢。赈灾要先让人吃饱，再论章程；一笔账记清了，下一回才敢再开仓。"
 GYP_decision_pw_dike_works:"修堤治水"
 GYP_decision_pw_dike_works_desc:"水患是这个古老国度最诚实的考官。堤修得牢不牢，一场暴雨就能揭晓；官吏用不用心，一条决口就能作证。"
 GYP_decision_pw_rite_lectures:"宣讲礼典"
 GYP_decision_pw_rite_lectures_desc:"礼典写出来只是纸，讲出去才是活的。宣讲队走遍乡野，把最繁琐的条文，译成最寻常的道理：见了长辈要有礼，受了恩惠要记得。"
 GYP_decision_pw_scholar_bounty:"举荐贤良"
 GYP_decision_pw_scholar_bounty_desc:"凡荐才确有实绩者，荐主一并受赏。荐才就不只是人情，而成了一桩要掂量的正事。荐错了人，脸上也挂不住。"
 GYP_decision_pw_land_survey:"清丈田亩"
 GYP_decision_pw_land_survey_desc:"田籍一乱，税就乱，人心更乱。清丈费时费力，得罪的是豪强，换来的是万千自耕农的安稳。"
 GYP_decision_pw_scholarly_archive:"修书存典"
 GYP_decision_pw_scholarly_archive_desc:"书修得慢，也最容易半途而废。甘雨定下的规矩是：宁可少修几卷，也要一卷一卷地校完。纸上的东西，含糊不得。"
 GYP_decision_pw_envoy_keqing:"遣使玉衡"
 GYP_decision_pw_envoy_keqing_desc:"使者赴玉衡，带去的是月海亭的粮道和一句平实的问候。甘雨附言：政见之争可以慢慢谈，先把这一季的稻子收了。能让人吃上饭的人，才有资格谈天下。"
 GYP_decision_pw_envoy_ningguang:"遣使天权"
 GYP_decision_pw_envoy_ningguang_desc:"天权的回话总是先谈钱，后谈情。甘雨偏偏看重这样的对手：她从不假装慷慨，也从不欠一句实话。这样的账，反倒算得下去。"
 GYP_decision_pw_envoy_shenhe:"遣使绝云"
 GYP_decision_pw_envoy_shenhe_desc:"绝云间是甘雨的归处，也是她最不敢轻易惊动的地方。使者带回一句极冷的话和一片不化的雪，她把雪供在月海亭最深处的案上。"
 GYP_decision_pw_envoy_childe:"遣使云来海"
 GYP_decision_pw_envoy_childe_desc:"公子的船队停在港外，甲板上却摆好了茶。使者回说，那位执行官谈起民生来滔滔不绝，倒像个老练的账房。甘雨听完摇头：越把民生挂在嘴上的人，越要多留一分心。"
 GYP_decision_pw_envoy_lanyan:"遣使沉玉谷"
 GYP_decision_pw_envoy_lanyan_desc:"沉玉谷的回话只有一行：你们的水章程写得比山路还绕，可它没写错一个字。甘雨把那行字看了很久，心里松了一块。"
 GYP_decision_pw_promulgate_codes:"颁行典章"
 GYP_decision_pw_promulgate_codes_desc:"把那几十卷新修的典章，一卷一卷抄发到各处衙门和书院。这是让每一个办事的人，手里都有一本对得住的书。"

 LYY_Event.10001.t:"月海新章"
 LYY_Event.10001.d:"内战落定，璃月的旗换了颜色，月海亭的灯却还亮着。甘雨在案前坐了一夜，把帝君旧制一册一册翻出来，又一份一份地批注。\n她对围坐的文官说：神明不在了，这城还得有人管账、有人修路、有人替打翻的碗赔钱。从今天起，这份差事归我们，办得好办不好，都由我们认。说完，她抽出了案头的第一本文牍。"
 LYY_Event.10001.a:"续掌月海，重建旧制"
 LYY_Event.10001.b:"退居山中，不再问事"
 LYY_Event.10002.t:"残册清点"
 LYY_Event.10002.d:"清点残册的活没人肯接，账目乱得像一堆碎瓷。甘雨亲自坐进库房，把每一页浸了水的文书摊在太阳底下晾干，再一张张压平。\n有个小吏问她：这些废纸还有什么用？她说：塌掉的东西不值钱，记着它怎么塌的字才值钱。往后谁要修城，先来读一遍这堆纸。小吏默默把手里那页，摆得比谁都整齐。"
 LYY_Event.10002.a:"先清册籍，再论修城"
 LYY_Event.10002.b:"即刻动工，先复市面"
 LYY_Event.10003.t:"坊巷重立"
 LYY_Event.10003.d:"坊巷重划，按旧邻与人口，不按谁出的钱多。有人抬着礼单来求情，甘雨把礼单折好退回去。\n她说：你那份地，从前是买来的；今天分的这一份，是让出来的。两笔账分开立，谁也不吃亏，谁也不占先。来求情的人抱着礼单出门，走到巷口又回头看了一眼新插的界牌。"
 LYY_Event.10003.a:"按旧邻人口分坊"
 LYY_Event.10003.b:"按出资多寡定宅"
 LYY_Event.10004.t:"田埂上的界桩"
 LYY_Event.10004.d:"还田的告示写得直白：谁耕的地归谁，战前的旧契暂且靠后。有老农不信，抱着契纸在田埂上坐了半天。\n甘雨没有派兵去赶，只让书吏当着他的面把界桩重打一遍。桩子落土的声音一响，老人自己把契纸叠好，收进怀里。他弯腰抓了一把新土，放在手心里搓了搓，才慢慢站起来。"
 LYY_Event.10004.a:"还田于耕者，重打界桩"
 LYY_Event.10004.b:"田归公仓，按劳分给"
 LYY_Event.10005.t:"国丧定礼"
 LYY_Event.10005.d:"国丧的礼数定得极简，不设大醮，不用童男童女，只留三日素服、一炷清香。有老臣嫌寒酸。\n甘雨把旧档翻出来给他看：当年立这条礼的人，也是怕活人为了死人，先把活人饿死。礼是给活着的人定的，这一点，三千年前就写清楚了。老臣看了半晌，把折子收了回去。"
 LYY_Event.10005.a:"国丧从简，礼为活人"
 LYY_Event.10005.b:"大办醮仪，以慰人心"
 LYY_Event.10006.t:"空殿添灯"
 LYY_Event.10006.d:"帝君的神位空着，案、椅、印、灯一样不动，一样不用。有人提议撤了旧殿改作衙门，甘雨没有答应。\n她说：那盏灯我每月初一亲自去添一次油，是让自己每月看清楚一回，那个位子可以空，却不该再有人坐上去。后来添灯成了她一个人守着的旧例，风雨不误。"
 LYY_Event.10006.a:"保留空殿，敬而不近"
 LYY_Event.10006.b:"改殿为衙，另立新堂"
 LYY_Event.10007.t:"编户清册"
 LYY_Event.10007.d:"编户清册不区分贵贱，一家一行，一人一名。有吏员嫌查得琐碎。\n甘雨把册子翻到某页，指着一行问他：这一家五口，你知道户主叫什么吗。吏员答不上来。她说：从前他们是一串数字，从今天起，至少各自占着一行。吏员低下头，那天的字，写得比往日工整许多。"
 LYY_Event.10007.a:"编户不辨贵贱，一人一行"
 LYY_Event.10007.b:"只登丁口，不问家产"
 LYY_Event.10008.t:"书院重开"
 LYY_Event.10008.d:"书院的门重开那天，没有锣鼓，只有一块写着开讲时辰的木牌。头一批来听讲的有船工、有挑夫，也有卖鱼的妇人。\n甘雨亲自讲了一课，讲的是怎么看清一张借据里藏的话。她说：认得字的人多一个，骗人的话就少一张。散课时，一个挑夫把这句话，用炭条记在了扁担上。"
 LYY_Event.10008.a:"书院广开，先教实用"
 LYY_Event.10008.b:"只收聪敏者，免耗钱粮"
 LYY_Event.10009.t:"贡院开门"
 LYY_Event.10009.d:"贡院重修，号舍按旧制一间隔一间，题目从库里出。有旧家托人打听题目，被甘雨挡了回去。\n她说：题目我锁着，钥匙三个人各拿一把。我要的是让寒门子弟走进来的时候，心里明白这一场比的是字，不是门户。寻门路的人空手走了，号舍外的台阶，被考生踩得锃亮。"
 LYY_Event.10009.a:"锁题三钥，只看文章"
 LYY_Event.10009.b:"宽其门路，许人荐举"
 LYY_Event.10010.t:"第一榜"
 LYY_Event.10010.d:"第一榜贴出来那天，围了里三层外三层。榜首是个往年无人识得的乡里子弟，榜尾却有几个熟面孔。\n有人议论名次不公，甘雨让人把前十名的卷子一并张挂出来，谁的判词都写在上面。看的人起初挑刺，看到后头，议论声渐渐低了下去。有个落榜的书生站到最后，把前十卷各抄了一遍才走。"
 LYY_Event.10010.a:"张挂前十卷，附以判词"
 LYY_Event.10010.b:"只出榜次，不示卷面"
 LYY_Event.10011.t:"史馆修书"
 LYY_Event.10011.d:"史馆设在月海亭西厢，三间屋子，四五个老史官。甘雨给他们定了一条规矩：写败仗要写全，写胜仗也要写清代价。\n有史官下笔犹豫，她答：史书若只记好听的话，后人拿它当什么用。修史这事慢，可它比修城墙经得住年月。几个老史官听了，把那支悬着的笔，重新蘸满了墨。"
 LYY_Event.10011.a:"直笔修史，成败并载"
 LYY_Event.10011.b:"只录功业，略去败绩"
 LYY_Event.10012.t:"中枢重立"
 LYY_Event.10012.d:"中枢重立，不叫内阁，不称军机，只叫月海亭议事。甘雨说：名字越朴素越好，省得有人听着威风，就忘了这里是替谁办事的。\n第一次议事，两位旧臣当场争起来，她没拦，只让书记照记。散会后，端茶的小吏看见满桌都是改过的字，墨迹洇开，像一片没打扫干净的雪。"
 LYY_Event.10012.a:"中枢议事，兼听异说"
 LYY_Event.10012.b:"事权独揽，以免纷争"
 LYY_Event.10013.t:"订历复乐"
 LYY_Event.10013.d:"历书重订，乐律也一并复起。有年轻人问，算节气和编钟磬有什么相干。\n甘雨答：一年的日子要有准头，人心里才有底；乐音要摆得正，人在堂上才知道怎么开口。这两样都不产粮，可少了它们，一个国就像一间没摆桌椅的空屋子。年轻人若有所思，回去把新历仔细抄了一份。"
 LYY_Event.10013.a:"重订历乐，立人间准绳"
 LYY_Event.10013.b:"沿用旧历，不必更张"
 LYY_Event.10014.t:"度衡归一"
 LYY_Event.10014.d:"度衡归一，是顶得罪人的差事。各家商号的尺斗称，差得能吞下一年的人心。\n甘雨铸了新器，逐户校准，谁用旧的就罚谁的款。有掌柜当众摔了旧斗，骂了几句粗话，转天还是换上了新器。因为新斗的生意，做得比谁都稳，街坊也肯往他家多走几步。"
 LYY_Event.10014.a:"铸衡归一，分毫不让"
 LYY_Event.10014.b:"随俗从众，不计尺寸"
 LYY_Event.10015.t:"致书玉衡"
 LYY_Event.10015.d:"给玉衡的信写得客气，话却实在：粮道可以共守，政见可以各执。\n甘雨对使者说：刻晴那边，账算得清，人也直。跟直人打交道省事，只是别指望她让半步。信发出前，她把称呼改了三遍，最后只用了两个字：刻晴。使者走后，她把底稿也收进了档。"
 LYY_Event.10015.a:"致书玉衡，共守粮道"
 LYY_Event.10015.b:"拒其插手，独掌粮政"
 LYY_Event.10016.t:"玉衡的回音"
 LYY_Event.10016.d:"玉衡的回信来得很短，态度却让甘雨意外。刻晴写道：粮可以共守，理可以各执，我信得过你手底下的账。\n甘雨把信读了两遍，对谋士说：这世上最难办的，从来是互相看不起的人。能互相看不惯、却仍肯一起把稻子收完的，反倒最有指望。她把信折好，压在了案头最常用的那叠公文里。"
 LYY_Event.10016.a:"回书订约，各执其理"
 LYY_Event.10016.b:"搁置其议，再观其变"
 LYY_Event.10017.t:"通使天权"
 LYY_Event.10017.d:"天权的回函写得密不透风，全是数字：粮价、运费、损耗，一笔一笔，像在交一份功课。\n甘雨逐行看完，提笔在末尾批了一句：账算得极细，可惜漏了一样，吃饭的人不是数字。写完她犹豫了一阵，还是把这句话留在了信里。她想，凝光读得懂分寸，也受得住实话。"
 LYY_Event.10017.a:"通使天权，共理财政"
 LYY_Event.10017.b:"拒之门外，不假财阀"
 LYY_Event.10018.t:"天权的账簿"
 LYY_Event.10018.d:"天权第二次来函，账目后面多附了一页，写的是几处歉收的乡镇和该减的课额。\n甘雨看完笑了笑，对身边的人说：你看，她把那句批注听进去了。这一页账，比前头几十页数字都值钱。她让人把这几处乡镇的名单，转给了管赈济的衙门，先备下粮。"
 LYY_Event.10018.a:"纳其减课之议"
 LYY_Event.10018.b:"只取其财，不入其言"
 LYY_Event.10019.t:"问雪绝云"
 LYY_Event.10019.d:"绝云间的雪，是甘雨最熟悉也最不敢多碰的东西。使者上山的公文，她只写了一行：山上的旧约还在，可愿下来坐坐。\n申鹤托人带回一句话和一片不化的雪。甘雨把雪供在案上，整夜没睡。她说：她肯给这句话，就已经比我预想的，多走了一步。天快亮时，她把那片雪，移到了窗边有光的地方。"
 LYY_Event.10019.a:"亲赴绝云，续其旧约"
 LYY_Event.10019.b:"绝云难信，不必相请"
 LYY_Event.10020.t:"绝云片雪"
 LYY_Event.10020.d:"绝云片雪送到月海亭那日，甘雨独自坐了很久。她本是麒麟，却选了留在人间，这个念头她三千年没对人提过。\n使者说，申鹤只留了四个字：各安其分。甘雨把那片雪放在案头，轻轻答：各安其分，也很好。至少她肯答话，肯答话的人，就还有商量的余地。"
 LYY_Event.10020.a:"认下这片雪，各自珍重"
 LYY_Event.10020.b:"弃雪于地，专心国事"
 LYY_Event.10021.t:"北国来使"
 LYY_Event.10021.d:"北国来的使者带着一份厚礼和一封厚信，条件写得漂亮。甘雨把信读了三遍，最后在回函里写：璃月可以借粮，路不借。\n使者脸色一沉，追问缘故。她只是把账推过去：我算过你们的算盘，也算了我们自己的。散会后，那份厚礼原样退了回去。送走客人后，她让人把港口的粮仓又清点了一回。"
 LYY_Event.10021.a:"借粮不借路"
 LYY_Event.10021.b:"受其厚礼，共理粮运"
 LYY_Event.10022.t:"云来海的茶"
 LYY_Event.10022.d:"公子的信写得随意，末尾还画了一艘歪歪扭扭的船。他说：打仗最费钱，做买卖最省钱，你们中原人，总是把这两件事搞反。\n甘雨看完竟笑了。她对使者说：这个人可虑的地方，不在他的刀，而在他把刀和钱，看得一样清。此后每逢北边的事，她总要多留三分神，也多备一份账。"
 LYY_Event.10022.a:"以文治应北国之商谈"
 LYY_Event.10022.b:"以刀兵拒至冬之好意"
 LYY_Event.10023.t:"沉玉谷约"
 LYY_Event.10023.d:"沉玉谷的山路上，使者被兰砚拦了下来，头一句就是：你们的文书，写得比山路还绕。\n使者没有争辩，把那卷水土章程一字不改地留下。兰砚翻了半宿，第二天回了一行字：绕是绕，可它没写错一个字。甘雨看到这行字，笑了一下，随即把章程的抄本，又给沉玉谷送了一份。"
 LYY_Event.10023.a:"纳沉玉之约，勘水立界"
 LYY_Event.10023.b:"斥其多事，独定章程"
 LYY_Event.10024.t:"山路上的长文"
 LYY_Event.10024.d:"山路上的长文，兰砚逐页批了注，边角写得密密麻麻。她指出三处水位算错，又添了两条当地的老经验。\n甘雨收到后，先让人核那三处，果然算错。她对身边人说：这个世上最难得的，是有人肯认真读你写的每个字，哪怕她并不打算听你的。三处随即改了，落款处也添了沉玉谷的名字。"
 LYY_Event.10024.a:"纳其三处更正，添其名"
 LYY_Event.10024.b:"自执己见，不改一字"
 LYY_Event.10025.t:"五方和议"
 LYY_Event.10025.d:"五方和议在月海亭摆了三天，刻晴派了执笔的，凝光派了管账的，绝云间来了一位不愿留名的，北国带来一船货，沉玉谷送来一捆水文图。\n甘雨没有做东，只做了个管添茶的人。散会时，五张椅子都被坐热了，桌上留着一圈谁也没擦的茶渍。有随从要去擦，被她拦下：留着。"
 LYY_Event.10025.a:"五方同席，共立和议"
 LYY_Event.10025.b:"只与同道结盟"
 LYY_Event.10026.t:"五面旗"
 LYY_Event.10026.d:"五面旗头一回挂在同一间厅堂里。有人提议按位次排座，甘雨摆摆手，说：谁先来谁坐前头，谈事而已。\n那三天里，有人争得面红耳赤，也有人一言不发只记笔记。散会时，谁也没占到便宜，谁也没空手回去。甘雨望着那五面旗，想起三千年前，它们中间有两面还是死敌。"
 LYY_Event.10026.a:"留旗同挂，不论位次"
 LYY_Event.10026.b:"定其高下，序其先后"
 LYY_Event.10027.t:"空殿依旧"
 LYY_Event.10027.d:"帝君的神位空了三年，香案上的灰也没人敢多擦。甘雨每月初一亲自去添一次灯油，从不停。\n有年轻人问她，那盏灯为谁而点。她答：不为什么人，为我自己。让我每月都记得一回，这殿里空着的那一位，是从前替这座城做过事的人。灯可以一直亮着，位子不能一直占着。"
 LYY_Event.10027.a:"空殿添灯，历久不改"
 LYY_Event.10027.b:"扫殿改衙，断其旧迹"
 LYY_Event.10028.t:"敬而不用"
 LYY_Event.10028.d:"祭仪照办，问卜停了。甘雨把这条规矩写进典章，措辞留着余地：敬天如故，求签问卦，不载于国事。\n有老臣强烈反对，说这是要断了人和天的路。她答：我们照旧对天存一份敬意，只不再拿它当决策的凭据。谁家的事，谁家自己定，往后再出了错，才找得到该负责的人。"
 LYY_Event.10028.a:"敬而不用，载之典章"
 LYY_Event.10028.b:"废其祭仪，一切从简"
 LYY_Event.10029.t:"谶纬存录"
 LYY_Event.10029.d:"历年的谶纬、天象、旧签文，被史官一条条抄录归档，后面附上后来应验与否。\n有经手的老吏越查越心惊，甘雨却在卷末写了一行：我们是给后人留一本能自己辨的书。这卷书后来放在书院最显眼的那格，翻得比什么经都旧，批注也最多。"
 LYY_Event.10029.a:"存录谶纬，附以应验"
 LYY_Event.10029.b:"焚其旧文，另立新说"
 LYY_Event.10030.t:"天问册"
 LYY_Event.10030.d:"天问册成书那日，甘雨只题了三个字作序：问过了。\n有学生翻开来看，里面问的尽是些没答案的事：天理还在不在，仙人算不算人，契约写在谁心里。甘雨对学生说：这些问题我想了三千年，也没想明白。想不明白不要紧，要紧的是还敢问。学生把这几句，抄在了自己的册子头一页。"
 LYY_Event.10030.a:"编成天问册，任人来问"
 LYY_Event.10030.b:"只出官定答案"
 LYY_Event.10031.t:"层岩加封"
 LYY_Event.10031.d:"层岩的裂口又加固了一遍，用的是新铸的合金和新的灌浆法。甘雨亲自下到井口，看最后一道闸门落下。\n她说：底下这东西不讲道理，你得意的时候它就来提醒你，人间的楼盖得再高，下面还压着一层照不到的地方。今天多封一分，明天的人就少赌一次命。井口的工人听了，一齐朝落下的闸门，站了很久。"
 LYY_Event.10031.a:"铸新闸，亲下井口"
 LYY_Event.10031.b:"循旧法，勉力维持"
 LYY_Event.10032.t:"井下的名字"
 LYY_Event.10032.d:"井下牺牲者名录又添了一页。甘雨下令为每个名字立碑，不分生前属于哪一方。\n她说：我们跟深渊的账，不能只记赢的那一半，埋在底下的人也该留个名。碑立那天，来了许多人，有胜的，有败的，也有谁都不认的。他们站在碑前，谁也没先走。"
 LYY_Event.10032.a:"为亡者立碑，不问敌我"
 LYY_Event.10032.b:"只记己方牺牲"
 LYY_Event.10033.t:"旧债成卷"
 LYY_Event.10033.d:"层岩历年欠下的账，被编成一册卷宗：哪一年塌方，填了多少人，赔了多少家，用了多少工。\n甘雨要的是让每一笔旧债都有个着落。她说：欠着不记，它就永远是一笔糊涂账；记明白了，后人接手时才知道自己扛的是多重的东西。卷宗编号后，与另几册并排收进了库房。"
 LYY_Event.10033.a:"旧债成卷，逐笔立档"
 LYY_Event.10033.b:"旧账一笔勾销"
 LYY_Event.10034.t:"卷宗入库"
 LYY_Event.10034.d:"卷宗入库那日，甘雨亲自圈了架位。她让人在最显眼的一层，留出空位给还没发生的事。\n管库的小吏问为何要留空。她答：库房满了，说明我们以为事情到头了；留着空，是提醒往后的人，这架子还会满。小吏照办，此后每一册新入库的卷，都按她圈的位置排列，从未错乱过。"
 LYY_Event.10034.a:"留下空架，以待来日"
 LYY_Event.10034.b:"库满为足，不再留位"
 LYY_Event.10035.t:"以礼镇渊"
 LYY_Event.10035.d:"镇渊的办法，甘雨选了最笨的一种：一部专讲深渊沿革与祭法的典。她把祭仪写进去，也把历次封堵的得失写进去。\n有人笑这不顶用，她说：刀剑镇得住一时的裂缝，镇不住人心里的怕。让百姓知道这底下是什么、该怎么躲，比多派一队人下去更值。这部典后来发到了层岩周边每一处村子。"
 LYY_Event.10035.a:"修镇渊之典，遍发村落"
 LYY_Event.10035.b:"严密封锁，秘不外传"
 LYY_Event.10036.t:"千岩整顿"
 LYY_Event.10036.d:"千岩军重新编营，饷照旧，名号换了。甘雨在点校那日说：这支队伍从前守的是城，从今往后，还要记得守住城里的那些人。\n队伍里安静了一阵，随后起的一声应答，和从前不太一样。有老兵摸了摸新发的臂章，没说话，把它抚平了。收队时，他把旧号旗卷好，收进了背囊最里层。"
 LYY_Event.10036.a:"改营易名，护城亦护民"
 LYY_Event.10036.b:"军制照旧，只换将校"
 LYY_Event.10037.t:"关隘戍守"
 LYY_Event.10037.d:"山口的关隘一处处重修，新图样上多了一条旧图没有的要求：关墙要留一道能过板车的门。\n有校尉不解，甘雨答：关隘挡的是兵，别把逃难的百姓也一并关在外头。这道门后来被守卒叫作小民门，逢战事总是头一个开，也总是最后一个关。守门的兵，渐渐都学会了看人，不只看旗。"
 LYY_Event.10037.a:"关墙留门，通民有路"
 LYY_Event.10037.b:"关墙求固，不留隙口"
 LYY_Event.10038.t:"山道巡防"
 LYY_Event.10038.d:"巡山的哨队招了本地猎户和药农，甘雨给的第一条命令是认路：哪条道能走骡马，哪处崖能藏人。\n她说：守这片山的人，先得是懂这片山的人。半年后，队里自己绘出的山川图比官图还细，连哪条溪在旱季会断，都标得清清楚楚。管图的老吏看了，把自己那份旧图悄悄收了起来。"
 LYY_Event.10038.a:"就地募人，先用懂山的"
 LYY_Event.10038.b:"调他处精锐，从严整训"
 LYY_Event.10039.t:"月海兵造"
 LYY_Event.10039.d:"兵造从港口近郊挪进了山坳，产量翻了近一倍，附近的村子也跟着添了人气。甘雨定下一条规矩：所造之物，皆刻工匠之名。\n她说：有人署名的兵器，才不会随便杀人；有人署名的活计，才不会随便糊弄。头一件刻名的兵器，在门口摆了半月才入库，厂里的工匠路过，总要停下来看一眼自己那三个字。"
 LYY_Event.10039.a:"兵器皆刻工匠之名"
 LYY_Event.10039.b:"兵器只标官厂之号"
 LYY_Event.10040.t:"乡兵在册"
 LYY_Event.10040.d:"乡兵不再临时拉夫，按里坊登记在册，各家出丁，训练课目里添了一条：先学怎么不误伤自己人。\n甘雨说：上过阵的人都知道，难的是枪口抬高一寸。这话后来写进了操典的头一页，纸角被翻得起了毛边。有新兵不解，老兵就把他的枪口，轻轻往上抬了一点。"
 LYY_Event.10040.a:"乡兵在册，先教不误伤"
 LYY_Event.10040.b:"临时签丁，以充员额"
 LYY_Event.10041.t:"武备学堂"
 LYY_Event.10041.d:"武备学堂开在城南，讲的是行军、布防、粮道，也讲怎么算一场仗值不值得打。\n甘雨去听过一堂课，末了对学生说：会舞刀的人多的是，会用刀之前先想一想的人，才难得。学堂里挂的第一幅图是一张标着水井和村落的行军路。有学生把这张图，临摹了一份贴在自己的床头。"
 LYY_Event.10041.a:"设武备学堂，先算后战"
 LYY_Event.10041.b:"只练刀马，不问得失"
 LYY_Event.10042.t:"治道之问"
 LYY_Event.10042.d:"纲常立住了，往后往哪走，议事厅里吵了整整三旬。甘雨把大门敞开，谁都能进来讲。\n吵到最后，卷宗堆了半人高，也没吵出个头绪。她看着这堆纸说：吵不完最好，真吵完了，才是没人敢开口了。往哪条路走，交给愿意担的人来担。说完，她让人把那三日所有的条陈，都编了号收进档。"
 LYY_Event.10042.a:"开三日门，尽听其言"
 LYY_Event.10042.b:"择人而听，速定大计"
 LYY_Event.10043.t:"天下定鼎"
 LYY_Event.10043.d:"天下定鼎那日，甘雨亲手吹灭了虚君之位的长明灯。大殿暗了一瞬，随即被透进来的天光照亮。\n她走出月海亭，街市如常，卖豆腐的在吆喝，学童在背书，船照旧进出。她站了很久，轻声说：总算不用再替神操心了。往后操心的，是我们自己。"
 LYY_Event.10043.a:"熄灯转向人间"
 LYY_Event.10043.b:"保留长灯，不改其志"
 LYY_Event.10044.t:"任官宪章"
 LYY_Event.10044.d:"任官宪章的头一条写在最醒目的位置：为官者，先问百姓，后问上官。有老吏看了直摇头，说这要乱套。\n甘雨把这句话抄给每一个新任的官员，说：是让你们记住，你们的俸禄，是从谁的口袋里省出来的。这一条后来被刻在了衙前的石上，进出的官，都要从它底下走过。"
 LYY_Event.10044.a:"颁任官宪章，先民后官"
 LYY_Event.10044.b:"维持旧制，以官为先"
 LYY_Event.10045.t:"考成则例"
 LYY_Event.10045.d:"考成则例考的是实事：修了几条堤、赈了几回饥、清了几笔钱粮。\n头一年考绩，三个自诩老练的官落了等，一个闷声不响的县丞评了上上，只因他一个人把那县里十九条塌了的渠全给通了。榜贴出来那日，满城议论，却没人喊冤。落等的三个，第二天一早就去了各自的辖地。"
 LYY_Event.10045.a:"开考成则例，实绩论官"
 LYY_Event.10045.b:"循资历升迁，以免纷争"
 LYY_Event.10046.t:"谏议之司"
 LYY_Event.10046.d:"谏议之司专替说不出话的人说话。甘雨把衙前那面没人敢敲的鸣冤鼓，挪到了最热闹的街口。\n她说：想告状谁来敲都行，我拦不住，别人也拦不住。鼓面很快敲得斑斑驳驳。值守的吏员起初嫌烦，后来发现，敲鼓的人里头，说的话往往最靠得住，比大堂上递上来的折子，也更近实情。"
 LYY_Event.10046.a:"设谏议之司，许民直诉"
 LYY_Event.10046.b:"闭其言路，以保威严"
 LYY_Event.10047.t:"典章为纲"
 LYY_Event.10047.d:"典章成书，几十卷，甘雨逐条校过。她把最琐碎的一条留了下来，写的是乡里分水该怎么先后用。\n有人说这太小，她答：大典管的是国，小条管的是日子，一个国能不能立住，常常就断在这类没人愿写的细处。书成那天，她只在卷尾签了名。刻版的人说，那几十卷字，写得比寻常的稳。"
 LYY_Event.10047.a:"典章为纲，连细条一并颁行"
 LYY_Event.10047.b:"只颁大典，小节从简"
 LYY_Event.10048.t:"郡县复原"
 LYY_Event.10048.d:"郡县两级重新划清，谁管内政谁掌兵，条文写得明白。\n甘雨对赴任的官员只说一句：到了地方，先看两样东西，田里的水和衙门里的账。有老臣担心权分得太散，她答：散一点，出了事才知道该问谁；全攥在一只手里，烂了也只能烂在里面。赴任的车马，随后一队队出了城门。"
 LYY_Event.10048.a:"郡县复原，权责两分"
 LYY_Event.10048.b:"事权归一，集中号令"
 LYY_Event.10049.t:"太学之立"
 LYY_Event.10049.d:"太学落成，门额上四个字是甘雨题的：为不为名。有士子不解。\n她答：读书不是为做官，也是为了有一天你撞上一桩不公的事，有本事说得出，也扛得住。太学里最热闹的从来是那间通宵亮着灯的辩论堂。堂里的灯油，每月都要多领几回。"
 LYY_Event.10049.a:"立太学，为不为名"
 LYY_Event.10049.b:"只育官吏，专攻举业"
 LYY_Event.10050.t:"宽政之实"
 LYY_Event.10050.d:"宽政是把该收的收明白，把不该收的退回去。甘雨让人把各乡的税册摊在衙门口，谁家的账谁自己核。\n有豪强不服，她只回一句：你嫌查得紧，可以来跟我一条条对；对完了，多收的一分不少退。头一年，退回去的粮，装了满满三十车。领粮的人排到街尾，没一个吵嚷的。"
 LYY_Event.10050.a:"宽政之实，退其多收"
 LYY_Event.10050.b:"照旧征收，以充国库"
 LYY_Event.10051.t:"月海之治"
 LYY_Event.10051.d:"月海之治的诏书，甘雨写了三稿，废了三稿，最后用的是最早那一稿，通篇没有一句漂亮话。\n只说愿此后璃月，饥者有食，寒者有衣，受了委屈有地方说理去。颁诏那夜，满城的灯亮到了月落。有老人站在灯下，朝着北边的天，慢慢躬了一躬。守夜的人看见，没有去打扰他。"
 LYY_Event.10051.a:"颁月海之治诏"
 LYY_Event.10051.b:"暂缓颁诏，先观人心"
 LYY_Event.10052.t:"请仙入朝"
 LYY_Event.10052.d:"请仙入朝的信，甘雨是亲自送上山的。她没有带仪仗，只带了一壶茶和一本账。\n她对山上的散仙说：不请你们管事，只请你们来坐，听一听人间如今的难处。有仙人问她图什么，她答：图这三千年来头一回，人和仙能坐在一张桌边，喝同一壶茶。茶凉了，她重新沏了一壶，又坐了一炷香的工夫。"
 LYY_Event.10052.a:"请仙入朝，共商疑难"
 LYY_Event.10052.b:"疏远仙家，各守其界"
 LYY_Event.10053.t:"仙班设席"
 LYY_Event.10053.d:"月海亭东厅添了几张席，不设名位，谁来谁坐。有文官不惯，甘雨说：座上的人换得勤一点，底下的话才听得真一点。\n仙家议事不多言，可每逢有人把数字报得太顺，总有人轻轻点一句，问那个数字是怎么算出来的。这一问，比什么章程都管用。后来报账的人，进门之前，都要先把算草核一遍。"
 LYY_Event.10053.a:"设仙班之席，参议不主政"
 LYY_Event.10053.b:"只备顾问，不入议事"
 LYY_Event.10054.t:"绝云立约"
 LYY_Event.10054.d:"绝云之约写得像一份家规：仙掌地利，人掌民事，起了争执请德望高者裁，裁者亦须让三分。\n有仙人笑这约太软，甘雨答：我就是要留一处能商量的余地。把话说死了，往后谁都不好退；留着余地，才有人肯坐下。立约那日，山上山下各按了手印。纸上的两个印，一个深，一个浅。"
 LYY_Event.10054.a:"缔绝云之约，留商量余地"
 LYY_Event.10054.b:"划清仙凡，各不相犯"
 LYY_Event.10055.t:"天人同序"
 LYY_Event.10055.d:"天人同序，把祭天、祭地、祭山河的礼重新排了一遍，排在头一位的是春耕。\n甘雨说：先敬这一年要下地的犁，再敬别的。有老臣觉得次序不对，她答：天给人间的好处，是靠一场好雨、一季好收成落到实处的，那就从田里敬起。典礼那天，头一炷香，是由一个老农点的。"
 LYY_Event.10055.a:"春耕居首，田里敬起"
 LYY_Event.10055.b:"神灵居首，循其旧序"
 LYY_Event.10056.t:"仙辅之政"
 LYY_Event.10056.d:"仙辅之政，把几位仙人请进了议事厅的常席，辅政而不主政。\n甘雨在席约上写得明白：事由人决，仙只参议，参议的话要记进档。有人问她怕不怕仙势坐大，她说：怕。所以我把它写成了字，字比人情牢靠。有仙人看完这条，点了点头，先按了印。其余几位，也跟着按了。"
 LYY_Event.10056.a:"仙辅之政，事由人决"
 LYY_Event.10056.b:"仙主其政，人从其言"

 GYP_PW_Spirit_Moonlit_Secretariat:"月海新枢"
 GYP_PW_Spirit_Moonlit_Secretariat_desc:"月海亭的灯，三千年没有真正熄过。它照过神明批的奏章，也照过凡人掌的印。灯下的人换了一茬又一茬，那一点不肯灭的亮，才是这座城真正的骨头。"
 GYP_Spirit_Central_Chancery:"中枢重立"
 GYP_Spirit_Central_Chancery_desc:"不叫内阁，不称军机，只叫议事。一个让不同主意坐下来吵架的地方。吵完出去，还得并肩把事办了，这才是文官治国的本事，也是它最磨人的地方。"
 GYP_Spirit_Code_of_Rites:"典章为纲"
 GYP_Spirit_Code_of_Rites_desc:"大典管的是国，小条管的是日子。一个国能不能立住，常常就断在那些没人愿意写的细处。把该说明白的都写进纸里，办事的人才有据可依。"
 GYP_Spirit_Civil_Service_Exams:"科举取士"
 GYP_Spirit_Civil_Service_Exams_desc:"不问出身，只问文章与实绩。一个肯让寒门子弟走进朝堂的国家，便是在替自己打开一扇又一扇，本会永远关着的门。"
 GYP_Spirit_History_Bureau:"史馆修书"
 GYP_Spirit_History_Bureau_desc:"写败仗要写全，写胜仗也要写清代价。史书若只记好听的话，后人拿它当什么用。修史这活慢，可它比修城墙经得住年月。"
 GYP_Spirit_Court_of_Rites:"礼乐之司"
 GYP_Spirit_Court_of_Rites_desc:"礼是让一群陌生人也能彼此体面相处的东西。删去苛繁，留下温厚，一个懂得如何安放人心的国，才走得长远。"
 GYP_Spirit_Adepti_Concord:"仙凡同朝"
 GYP_Spirit_Adepti_Concord_desc:"与人共治，本就是一件含糊的事。可人间最金贵的，恰恰是这份还能商量的余地。它比任何斩钉截铁的独断，都更接近智慧。"
 GYP_Spirit_Revere_Not_Ask:"敬而不用"
 GYP_Spirit_Revere_Not_Ask_desc:"祭仪照办，问卜停了。照旧对天存一份敬意，只不再拿它当决策的凭据。谁家的事谁家自己定，往后再出了错，才找得到该负责的人。"
 GYP_Spirit_Chasm_Ledger:"层岩卷宗"
 GYP_Spirit_Chasm_Ledger_desc:"欠着不记，它就永远是一笔糊涂账。把历年的塌方、伤亡、赔补逐笔立了档，后人接手时，才知道自己扛的是多重的东西。"
 GYP_Spirit_Grain_Abundance:"仓廪之实"
 GYP_Spirit_Grain_Abundance_desc:"开仓、平粜、授田、建义仓，桩桩件件都赔本，桩桩件件都换不来即刻的回报。一个国的德行，本就该由这些不划算的账来记。"
 GYP_Spirit_Open_Academies:"书院重开"
 GYP_Spirit_Open_Academies_desc:"门额上写着开讲的时辰，来听的人里，有船工，有挑夫，也有卖鱼的妇人。认得字的人多一个，骗人的话就少一张。"
 GYP_Spirit_Five_Concords:"五方和议"
 GYP_Spirit_Five_Concords_desc:"五面旗头一回挂在同一间厅堂里。谁也没占到便宜，谁也没空手回去。人间这座亭子，总算还开着门。"
 GYP_Spirit_Rule_by_Civil_Service:"文官立国"
 GYP_Spirit_Rule_by_Civil_Service_desc:"第一章写着：为官者，先问百姓，后问上官。是叫人记住，那顶官帽，是从谁的口袋里省出来的。"
 GYP_Spirit_Immortal_Regency:"以仙辅政"
 GYP_Spirit_Immortal_Regency_desc:"事由人决，仙只参议，参议的话要记进档。把最不牢靠的人情，最牢靠地写成了字。仙家看完这一条，点了点头，先按了印。"
 GYP_Spirit_Everlasting_Moon:"月海长明"
 GYP_Spirit_Everlasting_Moon_desc:"一项善政活不过一代，一种善念却能传过十代。这盏灯换人看管，却始终没有熄。它照的不只是月海亭，是这座城愿意接着走下去的那点心思。"

 GYP_PWRite_Tier_1:"礼统等级"
 GYP_PWRite_Tier_1_desc:"旧礼尽废，新规未立。人各凭心，事各凭意，热闹倒热闹，只是没了章法，谁也不知道明天该听谁的。"
 GYP_PWRite_Tier_2:"礼统等级"
 GYP_PWRite_Tier_2_desc:"新礼粗具轮廓，众人勉强按谱行事，行得生涩，却也渐成习惯。衙门里的文书多了，争执反倒少了些。"
 GYP_PWRite_Tier_3:"礼统等级"
 GYP_PWRite_Tier_3_desc:"上下有序，进退有度。人与人之间，多了一层郑重的分寸，少了几分兵荒马乱留下的粗粝。"
 GYP_PWRite_Tier_4:"礼统等级"
 GYP_PWRite_Tier_4_desc:"典章完备，规行矩步。举国上下像一部上了弦的机关，精确，庄重，也透着一丝不容通融的冷。"
 GYP_PWRite_Tier_5:"礼统等级"
 GYP_PWRite_Tier_5_desc:"规矩织成了一张看不见的网。网中人举止得体，却再没人敢越雷池半步；活人活到这一步，便活成了一件礼器。"
 GYP_Bond_Tier_1:"仙凡等级"
 GYP_Bond_Tier_1_desc:"山上山下互不相干，人间办事只信自己。仙家不肯下山，人间也不敢上山，两处之间，连一条像样的路都没有。"
 GYP_Bond_Tier_2:"仙凡等级"
 GYP_Bond_Tier_2_desc:"仙凡初通，有几句话递了回来，谈的多半还是试探。彼此留着客气，也留着距离，谁也不肯先交底。"
 GYP_Bond_Tier_3:"仙凡等级"
 GYP_Bond_Tier_3_desc:"仙凡相安，山上肯下山坐坐，人间也愿意把难处摊开来讲。一张长凳，两样人，各坐一头，也说得上话。"
 GYP_Bond_Tier_4:"仙凡等级"
 GYP_Bond_Tier_4_desc:"仙凡相亲，议事厅里多了几张不言不语的席。每逢有人把账报得太顺，总有人轻轻追问一句，这一问比什么章程都管用。"
 GYP_Bond_Tier_5:"仙凡等级"
 GYP_Bond_Tier_5_desc:"仙凡一体，事由人决，仙佐其议，分寸写进了纸里。人间的路走得稳，云上的手也放得下；只是凡事多绕一道，快不起来。"
 GYP_PWCombo_Both_High:"月海同光"
 GYP_PWCombo_Both_High_desc:"典章立得住，仙凡也肯同桌。文官按册办事，山上的人按时下山。甘雨在月海亭的门槛上站了许久，觉得这城终于又像从前那样，有人气，也有分寸。"
 GYP_PWCombo_Both_Low:"两头皆空"
 GYP_PWCombo_Both_Low_desc:"纲常没修成，仙缘也断了。衙门的文书越写越客气，山上的人越来越不肯来。甘雨抱着两摞没人签的卷宗，第一次觉得月海亭这盏灯，照不亮整座城。"
 GYP_PWCombo_A_High:"独尊文治"
 GYP_PWCombo_A_High_desc:"典章条条清楚，礼数处处周正。可山里的人不来了，祭仪的钟也只有人来敲，没人来听。甘雨把这份整齐看了很久，忽然念起从前殿上那盏总有仙人陪着添的灯。"
 GYP_PWCombo_B_High:"仙缘独厚"
 GYP_PWCombo_B_High_desc:"绝云间的人来得勤，疑难也解得快。只是人间的规矩总在往后拖，衙门的文书越积越厚。甘雨算过这笔账，仙力能救急，替不了长治，欠下的人情早晚要还。"

 #################### 申鹤 · 绝云间（SHP） ####################
 SHP_CivilWar_Lone_Crane:"孤鹤出云"
 SHP_CivilWar_Lone_Crane_desc:"帝君驾崩的消息传到绝云间时，申鹤正在峰顶练剑。她收剑入鞘，只说了一句话：凡间的伞，终于破了。她从不属于哪一方，可她冷眼看透了一件事，一座失了神明的城，若不及时寻一根新的脊梁，迟早会在混乱里散成一地尘土。而绝云间的雪，比谁都更硬、更冷、也更长久。她决定下山，是为了替这个散乱的世间，重新立一根梁骨。"
 SHP_Claim_the_Peaks:"绝云立帜"
 SHP_Claim_the_Peaks_desc:"绝云间的旌旗，第一次插遍了连绵的九座峰。申鹤没有宣示领土，只是让每一个上山的人，都先看清山门上的那行字：此地非人间。她说：我不与谁争地，我只是要让所有人记起来，云端之上，自有一重不受人间管辖的秩序。"
 SHP_The_Ascetic_Order:"清修之令"
 SHP_The_Ascetic_Order_desc:"清修之令颁下，绝云间成了整个璃月最安静的角落。晨钟暮鼓，一衣一食皆有定数，连呼吸都要合上节拍。申鹤说：能守住清修的人，才守得住山河。这份安静之下，浮着一层薄薄的、令人心悸的东西，所有人都在规规矩矩地活着，却没有一个人，敢大声说一句心里话。"
 SHP_Summon_the_Adepti:"召集仙众"
 SHP_Summon_the_Adepti_desc:"散居四方的仙人被一一请回绝云间。申鹤不谈情谊，只摆出棋盘与戒尺：要么共守此山，要么从此不必再踏足。有人愤然离去，更多人留了下来。留下的人里，有些是真心服她，有些只是怕她，申鹤并不在意，她要的从来是秩序。"
 SHP_Purge_the_Heretics:"清剿旁门"
 SHP_Purge_the_Heretics_desc:"旁门左道肃清之夜，绝云间的雪被染成了暗红。执法者按名单行事，名单写得很长，长到有些人自己都忘了，曾经在何时说过一句不合规矩的话。申鹤没有亲临刑场，只在中庭立了一炷香。香尽时她说：山路太平了，羊才能专心修行。"
 SHP_The_Mortal_Yoke:"凡俗之轭"
 SHP_The_Mortal_Yoke_desc:"凡俗之轭，让山下的村庄替绝云间输粮、输役、输人。申鹤的手段近乎诚实：她从不许诺感激，只给出一个冷冰冰的选择，交粮，或者离开山谷。有人骂她与旧日豪强无异，她却答：我从不自称仁慈。我只是比他们更清楚，慈悲，从来救不了一座将倾的山。"
 SHP_The_Frost_Edict:"寒霜敕令"
 SHP_The_Frost_Edict_desc:"寒霜敕令是绝云间的第一道大法。敕令不讲情面，只讲分寸：何时动、何时止、何事可为、何事万不可为，逐条写死。申鹤说：人的心是最靠不住的东西，今日向善，明日就可能作恶。所以我不靠心，我靠敕令，敕令不会因为一时的心软，把好不容易立起来的秩序，推倒重来。"
 SHP_The_Lone_Blade:"孤锋"
 SHP_The_Lone_Blade_desc:"申鹤的剑，独悬于绝云间的门楣之上。她不授剑术，只让每一个执剑的人仰望它一会儿。她说：我教你们的是怎么在一剑都还没出的时候，先把心定住。杀手最怕的从来是自己握剑时那一下慌乱的呼吸。"
 SHP_The_Silent_Monastery:"寂静道场"
 SHP_The_Silent_Monastery_desc:"道场里没有讲经，没有辩论，只有长久的沉默。新入门的弟子要在这里坐上整整一年，不与人语。有人说这是摧折人心，申鹤却道：话太多的人，心是散的；让他们学会先听自己心里那口钟的声音，往后外面再怎么吵，他们也不会乱。"
 SHP_Tithe_of_the_Peaks:"绝云征调"
 SHP_Tithe_of_the_Peaks_desc:"绝云征调，是仙家第一次向山下明确地伸手。粮、铁、布、丁，一项项摊派得清清楚楚。申鹤不觉得这有什么可耻，她直言：云端的清净，从来不是凭空来的。想借一座山挡住乱世的风雨，就得先为这座山，供上足够的火与粮。"
 SHP_Frost_Discipline:"霜律"
 SHP_Frost_Discipline_desc:"霜律之下，赏罚分明到近乎无情。犯错者罚，立功者赏，不问出身、不问苦衷、不问缘由。有老部下替一个失职的少年求情，被申鹤当众驳回。她说：规矩一旦为情所动，就会像雪化一样，从最轻的那一处裂缝开始，一点点垮掉整座山。"
 SHP_The_Mountain_Pass:"云关"
 SHP_The_Mountain_Pass_desc:"云关扼住了进出绝云间的咽喉。申鹤亲自督造，一砖一石都不许含糊。她说：平时这道关挡的是风雪，乱时它挡的就是千军万马。把门修得牢，山里的人才敢安心地修行、种药、教徒弟。一个守不住门的地方，再高，也只是一座敞着口的空城。"
 SHP_Cull_the_Weak:"汰弱令"
 SHP_Cull_the_Weak_desc:"汰弱令听来严峻，执行时更严峻。体力不支的、心志不坚的、拖累同门的，都被一一清出绝云间。申鹤说：这是山在替所有人做一次最诚实的选择。一群自以为仁慈的人聚在一起，往往最先饿死的，正是那些他们最放不下心的人。"
 SHP_The_Hunt_of_Demons:"猎魔"
 SHP_The_Hunt_of_Demons_desc:"猎魔，是绝云间唯一被默许的杀伐。山精、水怪、被深渊侵蚀的野兽，都被列为猎物。申鹤派出最精锐的执剑者，循着魔气一路追猎。她说：持剑之人，若不能替人间挡下夜里那些东西，那他修的道，和山门外那些只会念经的，又有什么分别。"
 SHP_The_Grand_Vigil:"大道之誓"
 SHP_The_Grand_Vigil_desc:"大道之誓立在高台之上，没有人念誓词，所有人只是静静地站着，站到天明。申鹤说：誓言说出口就会变轻，只有用一整夜不动的脊背去记，它才会真正落进骨头里。有人站着站着就晕了过去，醒来时发现，自己竟记不清昨夜想了些什么，却牢牢记住了那一刻彻骨的冷。"
 SHP_Only_the_Adepti:"唯仙独尊"
 SHP_Only_the_Adepti_desc:"唯仙独尊，是把绝云间与人间之间那道模糊的界线，彻底划清。申鹤说：仙凡本不同途，硬要挤在一起，只会两败俱伤。既然山路是我守的、风雨是我挡的，那这座山上的规矩，自然也该由我来定，这不叫霸道，这叫名分。"
 SHP_The_Mortal_Prohibition:"禁凡令"
 SHP_The_Mortal_Prohibition_desc:"禁凡令颁下，凡人不得擅入绝云间半步。有人在关外长跪三日，只为求见申鹤一面，替家乡求一线生机。申鹤站在关墙上望了很久，最终命人送去一车粮，却没有开门。她说：我可以救他们，但不能让他们学会，遇事就跪在别人的关前。"
 SHP_The_Sealed_Peaks:"封山"
 SHP_The_Sealed_Peaks_desc:"九峰封锁，绝云间自成一国。外人只见云雾缭绕，再看不见山里的灯火。申鹤说：封闭是把最后一方干净的地方，严严实实地护起来。她当然知道，一个与世隔绝的地方，久了难免变得迟钝，可比起被尘世搅得面目全非，她宁愿选择迟钝的纯粹。"
 SHP_Cultivation_Supremacy:"修真至上"
 SHP_Cultivation_Supremacy_desc:"修真之上，百业皆下。绝云间倾全山之力钻研岐黄、丹鼎、剑阵，连最不起眼的杂役，也要会背几段丹方。申鹤说：人们总觉得仙家该慈悲，可我偏要让他们先强大。一个连自己都护不住的道，讲什么普度众生，不过是自欺欺人。"
 SHP_The_Cold_Peace:"寒寂之治"
 SHP_The_Cold_Peace_desc:"寒寂之治，是绝云间给自己下的安眠药。山中无争斗、无妄言、无越轨，秩序井然得几乎不像人间。申鹤巡视这一片死寂时，忽然想起一句旧话，最完美的秩序，往往和最深的恐惧长着同一张脸。她没有说话，只是把披风又裹紧了一些。"
 SHP_Purge_the_Half_Bloods:"涤除半仙"
 SHP_Purge_the_Half_Bloods_desc:"半仙之名，曾经是荣耀，如今成了罪证。涤除令下，凡人与仙家血脉相杂者，要么证明自己的纯粹，要么被清出山门。有个半仙少年跪在雪里问申鹤：我生下来就是这样，错在哪里？申鹤沉默片刻，只答：你没有错。错的是这世上，容不下一件说不清楚的事。"
 SHP_The_Ladder_of_Ascension:"登仙之阶"
 SHP_The_Ladder_of_Ascension_desc:"登仙之阶，是一道严格的梯子，也是一场漫长的熬煮。资质、心性、功业，层层设卡，能走到底的人寥寥无几。申鹤说：我给他们一条看得见的路，是为了让他们别再去想那些看不见的捷径。人一旦相信有条正道可走，就很少再去走歪路了。"
 SHP_Ascend_the_Chosen:"拔擢入道"
 SHP_Ascend_the_Chosen_desc:"拔擢入道，是绝云间对世俗青眼的唯一一次馈赠。被选中的人，抛家别业，从此只认山不认人。申鹤亲手为他们系上道袍的带子，说：从今往后，你不再是谁的儿子、谁的父亲，你是一把剑，一炉丹，一块替这座山挡风的石头。"
 SHP_The_Eternal_Snow:"万载之雪"
 SHP_The_Eternal_Snow_desc:"万载之雪，覆盖了绝云间的每一寸山脊。雪落无声，也从不化去，仿佛连时间都冻在了这里。申鹤说：我不怕这世上没有变化，我怕的是变化来得太快，把好不容易积起来的这一切，一夜之间又冲得干干净净。"
 SHP_The_Frost_Court:"玄霜之廷"
 SHP_The_Frost_Court_desc:"玄霜之廷，是绝云间第一次有了朝廷的样子。修士着玄衣按品阶而立，律条刻在冰壁上，谁都不许呵气暖手。申鹤高居上座，看着这座冷得连回声都清脆的殿堂，忽然明白：她终究还是造了一个人间的东西，只是把它冻上了霜。"
 SHP_Thirty_Three_Heavens:"三十三重天"
 SHP_Thirty_Three_Heavens_desc:"三十三重天，是一套几乎无人能完全记全的品级体系。越往上，人越少，寒气越重。申鹤说：我要的是要让每一个登山的人，抬头时都能看见一个更高的地方，只有这样，他们才不会在半山腰就停下脚步。"
 SHP_The_Crane_Returns:"归鹤"
 SHP_The_Crane_Returns_desc:"归鹤，是申鹤难得的一次回望。她独自回到当年习剑的那处崖顶，看云海在脚下翻涌，一如多年前那个无人过问的黄昏。有人问她是否念旧，她摇头：我不是念旧，我是来确认一件事，现在的我，和当年的我，像不像。"
 SHP_Blade_of_the_Peak:"峰间之刃"
 SHP_Blade_of_the_Peak_desc:"峰间之刃，是绝云间最锋利的两个字。申鹤挑选执剑者，不看家世，只看两样东西：出剑前的静，与收剑后的扫尾。她说过一句让所有人都记了很久的话：杀人不见血的，是杀手；杀了人还记得擦干净桌子的，才是绝云间的人。"
 SHP_Silence_of_the_World:"举世皆寂"
 SHP_Silence_of_the_World_desc:"举世皆寂。绝云间的律法推行到极处，连风似乎都比别处轻柔。申鹤独自立于最高处，听着这彻底的安静，忽然觉得心里空得发慌。她想起帝君还在时，人间是有声音的，有叫卖、有争吵、有哭有笑。而她守住的这座山，安静得，像一口已经合上的棺。"
 SHP_The_Lone_Ascension:"孤高之证"
 SHP_The_Lone_Ascension_desc:"孤高之证，是申鹤给这条路线亲手盖上的印章。从此绝云间不再伪装成仙境，它只是一座山，一座由凡人血骨与仙人意志共同堆起来的、不容置疑的山。申鹤说：我不要谁的祝福，也不要谁的谅解。我要的只是，当我站在这里时，没有人能让我挪动一步。"
 SHP_The_Snow_That_Never_Melts:"不化的雪"
 SHP_The_Snow_That_Never_Melts_desc:"不化的雪，是申鹤为自己的道路起的最后一个名字。她把剑插入峰顶的积雪中，说：雪会化，人会散，唯有立在这里的规矩，我要它像这山巅一样，一千年也不化。可她转身时，没有人看见她眼底那一闪而过的、极冷极远的东西。"
 SHP_The_Holy_War:"清魔圣战"
 SHP_The_Holy_War_desc:"清魔圣战，是绝云间第一次把目光投向山外的黑暗。魔气自层岩、自深渊、自一切被遗忘的裂隙里渗出来，啃噬着人间的边缘。申鹤说：我可以不问你们的政局，不问你们的旗帜，甚至可以不管你们谁坐上那把椅子，但魔物，一个都不能留。"
 SHP_The_Rift_Wardens:"裂境守望"
 SHP_The_Rift_Wardens_desc:"裂境守望，是在那些游魂般的地方，立起的哨岗与火堆。守夜人轮换着，一代接一代，从没有人见过尽头。申鹤立在最险的那一处，对来换防的年轻人说：你看这条裂缝，它不会因为你怕它就变小，可它会因为你守着它，暂时睡一会儿。"
 SHP_Conquer_the_Fissures:"征讨裂隙"
 SHP_Conquer_the_Fissures_desc:"征讨裂隙，是绝云间少有的主动出击。修士组成的队伍深入幽暗，把魔物的巢穴一处处捣毁。他们带回来的是一份份地图：哪里还烧着，哪里已经冷了，哪里又长出了新的魔气。申鹤看着地图上的红斑，说：这是一场不会赢、也不能停的仗。"
 SHP_The_Wandering_Purge:"巡狩"
 SHP_The_Wandering_Purge_desc:"巡狩，是绝云间最孤独的功业。巡山者常年不归，背着剑和干粮，在无人烟的地方一走就是几个月。有人劝申鹤不必如此严苛，她答：正是因为要严苛，才轮得到你们在这里议论我。那些真正在雪里走的人，连议论的力气都没有。"
 SHP_The_Red_Frost:"赤霜"
 SHP_The_Red_Frost_desc:"赤霜，是被血浸透的雪。清剿越深入，代价越大，绝云间第一次出现了阵亡这两个字。申鹤在英烈碑前站了很久，然后对站在雪地里的执剑者们说：我不许你们为死去的人流泪，但我要你们记住，记住每一个名字，比流泪更沉。"
 SHP_Bind_the_Mountains:"缚山"
 SHP_Bind_the_Mountains_desc:"缚山，是把绝云间与四方的要道，用修士与阵法牢牢扣在一起。山与山之间的距离被缩短了，援兵可以在一天之内赶到。申鹤说：仙家的本事，不该只用来修仙；把它变成一条路、一座桥，才能真的护住山下那些不会飞的人。"
 SHP_The_Sword_of_the_North:"北地之剑"
 SHP_The_Sword_of_the_North_desc:"北地之剑，是至冬递来的一纸邀约，也是一柄递到申鹤手边的刀。至冬的执行官说：你有剑，我有钱与铁，何不联手，把这乱世替天理一遍？申鹤把那份盟书在雪地里烧了，只留了一句话：我的剑不替任何人挥，除了这座山要它挥的方向。"
 SHP_The_Mortal_Auxiliaries:"凡人辅军"
 SHP_The_Mortal_Auxiliaries_desc:"凡人辅军，是绝云间第一次把非仙的人，编进了自己的队伍。他们不修大道、不懂咒法，只被教一件事：怎么在最险的地方，替身后的人多撑一刻。申鹤检阅这支队伍时说：你们不是仙，也不必成仙。你们是人，而人，有时候比仙更硬。"
 SHP_The_Demon_Chronicle:"魔录"
 SHP_The_Demon_Chronicle_desc:"魔录，是绝云间记下的一场漫长战争。哪一处裂隙何时开、哪一种魔物怕什么、用什么咒能压制几分，都被一笔一笔写进册子。申鹤说：杀一只魔物，是勇气；把这本册子写到能救下十年后的一个人，是功业。"
 SHP_The_Thousand_Peak_March:"千峰行"
 SHP_The_Thousand_Peak_March_desc:"千峰行，是一次几乎要与天地争高下的远征。大军沿着一道道山脊行进，走得极慢，却无人能绕开。申鹤说：我们不比谁快，我们比谁走得稳。从绝云间走到璃月港，这条路要走上整整一个秋天，但走上去了，就是永远过去了。"
 SHP_The_Burning_Snow:"燃雪"
 SHP_The_Burning_Snow_desc:"燃雪，是这场远征最惨烈的一段。为了赶在魔潮之前，他们烧掉整片封冻的树林，用火把黑暗逼退。烟与雪一起落下来，冷与热砸在同一张脸上。申鹤看着那片燃烧的雪原，说：我一生最恨弄脏雪的人，可今天我亲手烧了它。世事，总有一回教你低头。"
 SHP_All_Under_Heaven:"普天之下"
 SHP_All_Under_Heaven_desc:"普天之下，是把绝云间的目光，从一座山，推到整个璃月，再推到所有被魔物侵扰的角落。申鹤说：从前我以为，守住这座山就够了。可我下山之后才发现，山下的每一处人间，都是这座山的延伸，他们灭了，我这山，也就没有了意义。"
 SHP_The_Immortal_Throne:"仙座"
 SHP_The_Immortal_Throne_desc:"仙座，是绝云间在人间立下的第一张、也是唯一一张椅子。坐上去的人不称王，只称执律者。申鹤亲手把律条刻在椅背上，说：这张椅子是给所有抬不起头的人看的，让他们知道，这世上还有一样东西，比他们的苦难更高。"
 SHP_The_Grand_Crusade:"万仙来朝"
 SHP_The_Grand_Crusade_desc:"万仙来朝，是绝云间最盛大的时刻，也是最令人不安的时刻。四方修士、山下义军、乃至几个心怀鬼胎的旧日对手，都举着旗来了。申鹤站在高台上，看着这乌泱泱的人海，轻声说：人聚得越多，就越像一场潮水。我要的是堤坝。"
 SHP_The_Half_Blood_Burden:"半仙之负"
 SHP_The_Half_Blood_Burden_desc:"半仙之负，是申鹤从不轻易提起的那件事。她自己就流淌着凡人与仙家两重血。夜里独坐时，她会想起涤除令下那些被清出山门的面孔，也会问自己：我判他们的时候，是不是也在判某一刻的我自己？这个问题，她始终没有答案。"
 SHP_The_Chasm_Abyss:"层岩深渊"
 SHP_The_Chasm_Abyss_desc:"层岩巨渊的深处，藏着一道比魔物更古老的黑暗。申鹤派最精锐的人下去探查，回来的人眼里都带着一种说不清的灰。她亲自去看了一趟，站在崖边望了很久，说了两个字：守着。从此再无人下过那口渊，只留下源源不断的守夜人。"
 SHP_The_Vigil_of_Xiao:"夜叉之誓"
 SHP_The_Vigil_of_Xiao_desc:"夜叉之誓，是一份几乎没有人敢接的差事。降魔大圣的旧誓还在，只是承接它的人，一个个都成了碑。申鹤在碑前默立，对愿接此任的年轻人说：我知道劝不住你们，我只想问一句，你们想清楚了，这条路的尽头，写的是你们自己的名字吗？"
 SHP_A_Blade_from_the_North:"北国赠刃"
 SHP_A_Blade_from_the_North_desc:"北国赠刃，是那柄至冬之剑的最终归宿。申鹤把剑接了过来，却没有拔。她说：一把递来的剑，从来是试金石。她把剑悬在山门的另一侧，与自己的剑遥遥相对，让它日日提醒每一个进出的人，这世上还有另一条路，安静地等着被选。"
 SHP_The_Iron_Snow:"铁雪"
 SHP_The_Iron_Snow_desc:"铁雪，是绝云间最后的模样：冷、硬、几乎不留情面。所有的柔软都被收进了最内层的衣襟，留给外人的，只有一片无懈可击的白。申鹤走在这样的雪里，脚步很稳。她忽然想，若帝君还在，看见她把一座山变成这个样子，会是赞许，还是叹息。"
 SHP_Reunify_Liyue:"光复璃月"
 SHP_Reunify_Liyue_desc:"光复璃月那一天，没有多少人落泪。绝云间的人不惯流泪，他们把所有的情绪，都压进了握剑的手里，压成了一片沉默。申鹤站在璃月港最旧的城墙上，俯瞰着重新连成一体的山河，看了很久。最后她只说了一句：路修好了，雪，也该化了。下山吧。"

 SHP_civilwar_category:"绝云之律"
 SHP_civilwar_category_desc:"申鹤 · 孤辰势力的内战决议组。以两轴机制衡量强硬与克制之间的取舍，每一次决议都会改变当前等级。孤辰一脉行事不循常理，出手往往只为断除后患，不留余地，也不屑于与人虚与委蛇。该断则断，从不拖泥带水。他从不屑于与人多做周旋。"
 SHP_decision_mountain_patrol:"巡山"
 SHP_decision_mountain_patrol_desc:"巡山是把每一道可能渗进魔气的山隙，都用脚步量一遍。雪落下来会盖住痕迹，也会盖住危险，所以巡山的人，一辈子都在跟雪抢时间。"
 SHP_decision_frost_ration:"分派寒粮"
 SHP_decision_frost_ration_desc:"绝云间自己不留多少余粮，粮车一车车地往山下推。申鹤的道理很直：山要人守，就得先让人活着。给出去的是一道无形的账，日后总要从别处收回来。"
 SHP_decision_purge_list:"清厘名册"
 SHP_decision_purge_list_desc:"名册上的名字，有些是真心犯了忌，有些只是恰好在那一年，说错了半句话。清厘名册的人，往往比被清厘的人更不安，因为他们最清楚，这把尺子，早晚也会量到自己身上。"
 SHP_decision_adeptus_summon:"召集仙众"
 SHP_decision_adeptus_summon_desc:"一封封请帖送上各山的洞府，措辞客气，底线分明：来，则同守此山；不来，则此后山门之事，与君无涉。做仙人做久了，最难的是学会听别人的规矩。"
 SHP_decision_bind_demon:"缚魔"
 SHP_decision_bind_demon_desc:"缚魔是一门极耗心神的功课：不杀，只封。因为有些东西，杀了会散，散了更麻烦。绝云间的封魔阵，一代不如一代，是能安心坐满那个阵的人，越来越少了。"
 SHP_decision_disciple_trial:"考功试炼"
 SHP_decision_disciple_trial_desc:"考功试炼不问出身，只问心性。有人在最后一关崩溃，有人却在那道关口上，第一次想清楚了自己是谁。申鹤说：我考的是他们输了之后，还站不站得起来。"
 SHP_decision_forge_frost:"铸霜"
 SHP_decision_forge_frost_desc:"霜铁难得，寒炉难守。铸霜的匠人，往往是绝云间最沉默的一群人，他们一辈子守着一炉不肯熄灭的冷火，做出来的东西，却要让别人拿去暖身、拿去活命。"
 SHP_decision_herb_garden:"辟圃种药"
 SHP_decision_herb_garden_desc:"绝云间的药圃，种的是凡人也用得上的寻常药材。申鹤说：仙家若一味只炼丹求己身，那和山上那些只顾自己的石头，又有什么两样。药种下去要几年才成材，可总得有人先种。"
 SHP_decision_north_deal:"北使入山"
 SHP_decision_north_deal_desc:"至冬的使者带着精美的礼物进山，谈的却是共同秩序。申鹤把礼物收下，把盟书烧了。她说：礼可以收，因为那是他的诚意；盟不能签，因为那会变成我的枷锁。"
 SHP_decision_chant_rite:"夜诵律条"
 SHP_decision_chant_rite_desc:"夜深时，绝云间会响起低低的诵声，是在诵律。一条一条，从最古老的念到最新添的。申鹤说：律条不念就会忘，忘了的律条，和没有一样。"
 SHP_decision_envoy_keqing:"使者赴玉衡"
 SHP_decision_envoy_keqing_desc:"使者回来时只说了一句话：玉衡的灯，比想象中亮。申鹤沉默良久，答：亮灯的地方，影子也最清楚。她让人备了一份薄礼，回赠刻晴，是不肯让绝云间在礼数上，输给一个后辈。"
 SHP_decision_envoy_ningguang:"使者赴群玉阁"
 SHP_decision_envoy_ningguang_desc:"群玉阁的回信比使者到得还快，字里行间都是算盘的味道。申鹤看完一笑：她把天下当成一盘账，我却要把天下一座一座地量。也好，一个量钱，一个量山，各算各的。"
 SHP_decision_envoy_ganyu:"使者赴月海亭"
 SHP_decision_envoy_ganyu_desc:"月海亭那位半仙，是绝云间唯一肯多留使者半日的人。她问的是山上的雪今年厚不厚、仙鹤还回不回来。使者带回了这些话，申鹤听着听着，忽然很久没有说话。"
 SHP_decision_envoy_childe:"使者赴云来海"
 SHP_decision_envoy_childe_desc:"云来海的约最直白：只要你肯让开一条路，至冬的铁就永远不缺。申鹤把盟约折了又折，最后只留下一行批注：路可以让，但让路的人，得是我，不能是别人来推我。"
 SHP_decision_envoy_lanyan:"使者赴沉玉谷"
 SHP_decision_envoy_lanyan_desc:"沉玉谷的回复最不像官样文章：一捧带着泥的谷种，和一句没头没尾的话，山上的雪化了，会流到这里来。申鹤把谷种收下，命人种在药圃一角，那一年，它真的活了。"
 SHP_decision_grand_edict:"立绝云律"
 SHP_decision_grand_edict_desc:"把三年来的敕令、判例、军规汇成一部律书，是所有执律者最重的一次差事。申鹤亲笔写下第一篇，只有一句：绝云之律，护生，不护人。写完后她搁笔很久，说：最难的是从今往后，连我自己，也得服从它。"

 LYY_Event.5001.t:"孤鹤出云"
 LYY_Event.5001.d:"帝君驾崩的消息传到绝云间时，申鹤正在峰顶练剑。她收剑入鞘，只说了一句：凡间的伞，破了。\n随她下山的长辈劝她：此事与你何干？申鹤望着远方的璃月港，答：与我无关，可这世间的事，什么时候轮到与我无关四个字来决定，该不该管？"
 LYY_Event.5001.a:"下山立秩序，护绝云亦护人间"
 LYY_Event.5001.b:"只守绝云间，不问山外事"
 LYY_Event.5002.t:"九峰立帜"
 LYY_Event.5002.d:"绝云间的旌旗插遍九峰。申鹤没宣示领土，只在山门上刻了一行字：此地非人间。\n一个过路的樵夫问守关的修士：这山，以后还让人上吗？修士答：上，只要你守山里的规矩。樵夫愣了愣，说：我活了四十年，头一回听人讲，规矩是修来给人守的。"
 LYY_Event.5002.a:"以山门立规矩，来者皆守"
 LYY_Event.5002.b:"只迎同道，拒凡俗于外"
 LYY_Event.5003.t:"清修之令"
 LYY_Event.5003.d:"清修之令颁下，绝云间安静得能听见雪落的声音。晨钟暮鼓，一衣一食皆有定数。\n有年轻的弟子受不了这份安静，夜里偷偷翻墙想跑，被巡山的人撞见。执事没有罚他，只问：你要去哪儿？弟子答不上来，愣了半天，自己又翻回去了。"
 LYY_Event.5003.a:"谕令全山，一体清修"
 LYY_Event.5003.b:"放任各洞府自守其道"
 LYY_Event.5004.t:"仙众来朝"
 LYY_Event.5004.d:"散居四方的仙人被一一请回。申鹤不谈情谊，只摆出棋盘与戒尺。\n一位白发的老仙人不肯受约束，拂袖而去，走到半山又停住，回头问：你这样做，真的守得住这座山吗？申鹤答：守不住，我也得先试着守。老仙人叹了口气，终究没有走。"
 LYY_Event.5004.a:"请仙众共守此山"
 LYY_Event.5004.b:"以威令强召诸仙"
 LYY_Event.5005.t:"清剿之夜"
 LYY_Event.5005.d:"清剿之夜，雪被染成了暗红。执法者按着名册行事，名册长得让人不忍细看。\n有人临刑前问：我错在哪里？执事翻遍册子，最后答：错在那一年，你说了一句不合时宜的话。那人笑了笑说：原来是这样，我一直想不起来，倒要谢谢你替我记着。"
 LYY_Event.5005.a:"按册清剿，绝旁门左道"
 LYY_Event.5005.b:"只诛首恶，宽宥胁从"
 LYY_Event.5006.t:"凡俗之轭"
 LYY_Event.5006.d:"凡俗之轭，让山下的村庄替绝云间输粮输役。申鹤给的是一个冷冰冰的选择。\n一个村长跪在雪地里求减摊派，申鹤问：你家今年收成如何？答：勉强够吃。申鹤说：那就交一半，我说过，不救跪着的人，但你替全村来跪，这一半，我替你减了。"
 LYY_Event.5006.a:"向山下征调粮役"
 LYY_Event.5006.b:"以山中之物易之于市"
 LYY_Event.5007.t:"寒霜敕令"
 LYY_Event.5007.d:"寒霜敕令逐条写死，不讲情面。申鹤说：人的心靠不住，只能靠敕令。\n有执事问：万一敕令本身定错了呢？申鹤沉默许久，答：那也得先认它。一个连自己定的法都不敢认的人，凭什么要别人认。这是她第一次在别人面前，露出一点犹疑的神色。"
 LYY_Event.5007.a:"颁寒霜敕令，立山法"
 LYY_Event.5007.b:"暂缓立法，因人而断"
 LYY_Event.5008.t:"门楣悬剑"
 LYY_Event.5008.d:"申鹤的剑，独悬于门楣之上。她不授剑术，只让人仰望。\n一个新入门的弟子在剑下站了整整一夜，第二天说自己想明白了。执事问他想明白什么，他说：剑那么静，我却站得浑身发抖，原来我修炼的，从来是我这颗心。"
 LYY_Event.5008.a:"悬剑门楣，以静制动"
 LYY_Event.5008.b:"聚众演武，扬威于外"
 LYY_Event.5009.t:"寂静的钟"
 LYY_Event.5009.d:"道场里没有讲经，只有长久的沉默。新弟子要坐上整整一年，不许与人语。\n一年后，第一个开口的弟子说了句：我从前总想赢过别人，坐了一年才明白，我最想赢的，是那个坐不住的自己。申鹤在廊下听见了，什么也没说，转身走了。"
 LYY_Event.5009.a:"设寂静道场，炼心"
 LYY_Event.5009.b:"广开讲席，聚众论道"
 LYY_Event.5010.t:"云端的灶"
 LYY_Event.5010.d:"绝云征调，是仙家第一次向山下伸手。粮、铁、布、丁，项项摊派清楚。\n有山民抱怨：神仙也要吃米？收粮的修士答：神仙不吃，可替神仙挡风的人吃。山民还想说什么，低头看见那修士的草鞋都磨穿了，忽然把话咽了回去。"
 LYY_Event.5010.a:"绝云征调，量入为出"
 LYY_Event.5010.b:"免其摊派，自减用度"
 LYY_Event.5011.t:"霜律"
 LYY_Event.5011.d:"霜律之下，赏罚分明到近乎无情。申鹤当众驳回了一名为少年求情的老部下。\n事后老部下独自喝闷酒，申鹤走过来，在他对面坐下，给自己也倒了一杯。两人一言不发，喝到半夜。临走时申鹤说：今天驳了你的情，是怕你的情，开了这道口子。"
 LYY_Event.5011.a:"霜律之下，赏罚不问情"
 LYY_Event.5011.b:"量情宽宥，以德服人"
 LYY_Event.5012.t:"云关"
 LYY_Event.5012.d:"云关扼住进出绝云间的咽喉，一砖一石都由申鹤亲自督造。\n工匠们私下嘀咕，说这关修得太牢，像是要把整座山封起来。申鹤听见了，答：修得牢，是怕有一天，我想护的人还留在外面，而我出不去。"
 LYY_Event.5012.a:"亲督云关，固守要害"
 LYY_Event.5012.b:"只设哨卡，不筑坚关"
 LYY_Event.5013.t:"汰弱"
 LYY_Event.5013.d:"汰弱令执行的那天，被清出山门的人排成一条长队，没人哭闹。\n最后一个被清出去的，是个瘸腿的老兵。申鹤亲自送他到关外，递给他一包药。老兵接过药，忽然说：夫人，我不恨你。我只是想知道，我这样的人，是不是从一开始，就不该上山。申鹤没有回答。"
 LYY_Event.5013.a:"行汰弱令，精简山门"
 LYY_Event.5013.b:"广纳弟子，多多益善"
 LYY_Event.5014.t:"猎魔"
 LYY_Event.5014.d:"猎魔是绝云间唯一被默许的杀伐。山精、水怪、被侵蚀的野兽，皆列为猎物。\n归来的猎手带回一只幼魔的残骸，说它临死前一直在发抖。申鹤看着那只小小的骨架，沉默了很久，最后说：记下来。连它发抖的样子，也记下来，别让我们杀着杀着，忘了自己在杀什么。"
 LYY_Event.5014.a:"循魔气而猎，斩草除根"
 LYY_Event.5014.b:"只驱不杀，防护生灵"
 LYY_Event.5015.t:"大道之誓"
 LYY_Event.5015.d:"大道之誓立在高台上，无人念词，众人只是站到天明。\n天光破晓时，有人发现最边上一个瘦小的弟子，站得姿势僵直，早已晕了过去，却始终没有倒。申鹤走过去，亲手把他抱了下来，动作很轻。她说：记着这个人的名字，他不是最强的，但他是最像绝云间的。"
 LYY_Event.5015.a:"立大道之誓，凝心"
 LYY_Event.5015.b:"各修各道，不必相强"
 LYY_Event.5016.t:"唯仙独尊"
 LYY_Event.5016.d:"唯仙独尊，是把仙凡之间那道模糊的界线，彻底划清。\n有位上了年纪的凡人老妇，在山门外卖了一辈子的茶，忽然被告知不能再进关。她默默收拾摊子，走时回头望了一眼山门。申鹤恰在城墙上，两人对望了一瞬，谁都没有说话。那一瞬之后，申鹤转身，脚步比平时快了些。"
 LYY_Event.5016.a:"唯仙独尊，划清仙凡"
 LYY_Event.5016.b:"仙凡并处，各安其位"
 LYY_Event.5017.t:"禁凡令"
 LYY_Event.5017.d:"禁凡令颁下，凡人不得擅入半步。有人在关外跪了整整三日。\n第三日黄昏，申鹤命人送去一车粮，却始终没有开门。送粮的执事回来复命，说那人不肯收。申鹤问：他还在跪吗？执事答：不，他走了，带着粮走的。申鹤点了点头：那就好。能带走粮的人，才不会一辈子跪着。"
 LYY_Event.5017.a:"禁凡人擅入山门"
 LYY_Event.5017.b:"设驿待客，示以宽仁"
 LYY_Event.5018.t:"封山"
 LYY_Event.5018.d:"九峰封锁，绝云间自成一国。外人所见，只有缭绕的云雾。\n封山那夜，一个老修士独自坐在山门口，对着空荡荡的山路发呆。有人问他在看什么，他说：我在看这条路上，从前有多少人来过。现在它空了，我倒有些不习惯，原来守着一条没人走的路，比守着一条热闹的路，更寂寞。"
 LYY_Event.5018.a:"封山自守，绝尘于世"
 LYY_Event.5018.b:"开关通商，以物养山"
 LYY_Event.5019.t:"修真"
 LYY_Event.5019.d:"修真之上，百业皆下。绝云间倾力钻研岐黄丹鼎，连杂役也要背丹方。\n有个负责烧火的老仆，背不出丹方，急得直掉眼泪。一个年轻修士不忍，悄悄替他写了小抄。被申鹤撞见。她看了看那张小抄，什么也没说，转身就走，转身时，嘴角似乎动了一下。"
 LYY_Event.5019.a:"修真至上，倾力传道"
 LYY_Event.5019.b:"百业并重，不独尊道"
 LYY_Event.5020.t:"寒寂之治"
 LYY_Event.5020.d:"寒寂之治下，山中无争斗、无妄言、无越轨，秩序井然。\n申鹤巡视时，忽然在一处空谷前停下。她问身边的执事：你听，这里是不是太静了？执事侧耳听了听，答：回夫人，向来如此。申鹤望着空谷，很久没有说话，她想起帝君还在时，人间是有声音的。"
 LYY_Event.5020.a:"寒寂之治，务求其静"
 LYY_Event.5020.b:"留三分生气，勿使太冷"
 LYY_Event.5021.t:"涤除半仙"
 LYY_Event.5021.d:"涤除令下，凡仙血脉相杂者，须自证纯粹，否则清出山门。\n一个半仙少年跪在雪地里问：我生下来就是这样，错在哪里？申鹤沉默片刻，答：你没有错。错的是这世上容不下一件说不清的事。她转过身，没让少年看见自己的脸色。"
 LYY_Event.5021.a:"涤除半仙，务求纯粹"
 LYY_Event.5021.b:"废涤除令，一体相容"
 LYY_Event.5022.t:"登仙之阶"
 LYY_Event.5022.d:"登仙之阶层层设卡，能走到底的人寥寥无几。\n有人走到第七阶便再上不去，坐在阶上哭。守阶的老修士递给他一壶酒，说：别哭。上不去的人，我见了一辈子，他们最后大多都去哪了你知道吗？都下山了，然后活得好好的。大道走不了，小路也还是路。"
 LYY_Event.5022.a:"设登仙之阶，明其路"
 LYY_Event.5022.b:"不设阶次，任其自修"
 LYY_Event.5023.t:"拔擢"
 LYY_Event.5023.d:"拔擢入道，是被选中者此生唯一一次的青云直上。申鹤亲手为他们系上道袍的带子。\n一个刚被拔擢的年轻人跪地叩谢，说愿以命相报。申鹤扶他起身，答：我不要你的命。你的命是山上借给你的，哪一天山不用了，你得好端端地还回去。"
 LYY_Event.5023.a:"拔擢入道，为国储才"
 LYY_Event.5023.b:"谨守山门，不纳外徒"
 LYY_Event.5024.t:"万载之雪"
 LYY_Event.5024.d:"万载之雪覆盖了每一寸山脊，雪落无声，也从不化去。\n申鹤立在雪原中央，忽然伸手接了片雪花。雪花落在掌心，竟也没有化。她看着那一点白，轻声说了句只有自己听得见的话：连雪都学会不动了，那我呢，我是在守山，还是把自己，也一并封进了这座山里。"
 LYY_Event.5024.a:"万载之雪，坚其守"
 LYY_Event.5024.b:"扫雪开路，以通四时"
 LYY_Event.5025.t:"玄霜之廷"
 LYY_Event.5025.d:"玄霜之廷落成，修士着玄衣按品阶而立，律条刻在冰壁上。\n第一次开廷那天，殿堂里冷得连回声都清脆。申鹤高居上座，环视这座近乎完美的殿堂，忽然想起多年前自己刚上山时，师父说过的一句话：最像仙境的地方，往往最不像人间。她不动声色地把这句话，压进了心底。"
 LYY_Event.5025.a:"立玄霜之廷，正名分"
 LYY_Event.5025.b:"维持旧制，不设虚廷"
 LYY_Event.5026.t:"三十三重天"
 LYY_Event.5026.d:"三十三重天，把人分出了三十三层高低。\n有个从最底层爬上来的年轻人问申鹤：夫人，爬到顶层，是不是就不冷了？申鹤看着他冻得发紫的手，答：越往上越冷。你现在觉得暖和，是因为你还在往上爬的过程中，等哪天你不爬了，才会真正觉得冷。"
 LYY_Event.5026.a:"定三十三重天品级"
 LYY_Event.5026.b:"不分高下，一视同仁"
 LYY_Event.5027.t:"归鹤"
 LYY_Event.5027.d:"归鹤。申鹤独自回到当年习剑的崖顶，看云海翻涌。\n护法远远守着，不敢上前。许久，申鹤忽然开口，像是自语：我小时候在这儿练剑，总想着有一天要站到所有人都看得见的地方。现在站到了，倒觉得，还是这里最好。她说完，转身下山，脚步比来时轻。"
 LYY_Event.5027.a:"归鹤崖顶，静思己身"
 LYY_Event.5027.b:"不回望，只向前"
 LYY_Event.5028.t:"峰间之刃"
 LYY_Event.5028.d:"峰间之刃，是绝云间最锋利的两个字。申鹤择人，只看两样：出剑前的静，收剑后的扫尾。\n有个落选的年轻人不服，问自己差在哪里。申鹤答：你出剑足够快，可惜收剑时满身杀气不肯散。杀人是本事，收得住杀气，才是绝云间要的人。年轻人若有所思，拜了两拜，走了。"
 LYY_Event.5028.a:"择峰间之刃，授绝杀"
 LYY_Event.5028.b:"广传剑术，壮我声势"
 LYY_Event.5029.t:"举世皆寂"
 LYY_Event.5029.d:"举世皆寂。绝云间的律法推行到极处，连风都比别处轻。\n申鹤独自立于最高处，听着这彻底的安静。她忽然对空无一人的山巅说了一句话：帝君，我把这座山，守成了一口井。井里没有风浪，也没有活水，可是井里干净。她说完，自己也不知道，这是在向谁交代。"
 LYY_Event.5029.a:"举世皆寂，守此一山"
 LYY_Event.5029.b:"重开山门，听人间声"
 LYY_Event.5030.t:"孤高之证"
 LYY_Event.5030.d:"孤高之证，是申鹤亲手盖下的印章。绝云间从此不再自称仙境，只是一座不容置疑的山。\n盖章那夜，老执事捧着印问：夫人，这一步走出去，就回不了头了。申鹤答：我从来没想过回头。老执事欲言又止，最后只把印收了。他晚年写下的回忆录里说，那一天，申鹤的背影，是他在绝云间见过最直、也最孤独的一次。"
 LYY_Event.5030.a:"盖孤高之证，定此路"
 LYY_Event.5030.b:"留一分退路，以备转圜"
 LYY_Event.5031.t:"不化的雪"
 LYY_Event.5031.d:"不化的雪，是申鹤为自己这条道路起的最后一个名字。她把剑插入峰顶积雪，说：我要这规矩，像山巅一样，一千年也不化。\n多年以后，有人上山寻访，只见峰顶剑痕犹在，积雪如新，只是那位立誓的人，早已无人记得她长什么样。寻访者立在剑痕前很久，最后说了句：雪真的没化，可那又证明了什么呢。"
 LYY_Event.5031.a:"立誓于峰，雪不化则道不改"
 LYY_Event.5031.b:"收回誓言，另择去从"
 LYY_Event.5032.t:"清魔圣战"
 LYY_Event.5032.d:"清魔圣战，是绝云间第一次把目光投向山外的黑暗。魔气自层岩、自深渊、自被遗忘的裂隙中渗出。\n申鹤立于阵前，对列队的修士说：我可以不问你们谁坐那把椅子，可以不管你们挂谁的旗，但魔物，一个都不能留。这不是立场，这是底线。说完她拔剑，剑光映得满山皆白。"
 LYY_Event.5032.a:"举清魔圣战，出山讨魔"
 LYY_Event.5032.b:"固守绝云，不问外魔"
 LYY_Event.5033.t:"裂境守望"
 LYY_Event.5033.d:"裂境守望，是在那些游魂般的地方立起哨岗与火堆。守夜人代代轮换，无人见过尽头。\n申鹤立在最险的裂隙边，对来换防的年轻人说：你看这条缝，它不会因为你怕它就变小；可它会因为你守着它，暂时睡一会儿。年轻人问：那要守多久？申鹤答：不知道，守到有人替你为止。"
 LYY_Event.5033.a:"设裂境守望，代代相传"
 LYY_Event.5033.b:"封塞裂隙，任其自熄"
 LYY_Event.5034.t:"征讨裂隙"
 LYY_Event.5034.d:"征讨裂隙，是绝云间少有的主动出击。修士深入幽暗，捣毁魔物的巢穴。\n一支队伍归来时，只剩半数。领队的手里却紧紧攥着一张地图。申鹤接过地图，看见上面标着密密麻麻的红点。她没有问伤亡，只问：还烧着的，还剩几处？领队答：三处。申鹤说：那就再去三次。"
 LYY_Event.5034.a:"深入裂隙，捣其巢穴"
 LYY_Event.5034.b:"虚张声势，以逼其退"
 LYY_Event.5035.t:"巡狩"
 LYY_Event.5035.d:"巡狩，是绝云间最孤独的功业。巡山者常年不归，一走就是几个月。\n有人劝申鹤不必如此严苛。她答：正因为我严苛，才轮得到你们在这里劝我。那些真正在雪里走的人，连劝我的力气都没有。劝的人沉默了，第二天，主动报名去巡山。"
 LYY_Event.5035.a:"行巡狩之法，长守险地"
 LYY_Event.5035.b:"轮戍边区，以省耗损"
 LYY_Event.5036.t:"赤霜"
 LYY_Event.5036.d:"赤霜，是被血浸透的雪。清剿越深，代价越大，绝云间第一次出现了阵亡二字。\n英烈碑前，申鹤对执剑者们说：我不许你们为死者流泪，但要你们记住每一个名字。一个年轻修士红着眼问：记住有什么用？申鹤答：记住，就是为了让没用这两个字，不那么容易说出口。"
 LYY_Event.5036.a:"以血换土，虽赤不悔"
 LYY_Event.5036.b:"收兵止战，护我精锐"
 LYY_Event.5037.t:"缚山"
 LYY_Event.5037.d:"缚山，是把绝云间与四方要道，用修士阵法定在一处。山与山之间的距离，被生生缩短。\n阵成那日，一个老阵师累得吐血。申鹤扶住他，问他还想做什么。老阵师喘着气答：想在有生之年，看一次援兵一天之内赶到山下，那样，我这一辈子画的阵，就没白画。"
 LYY_Event.5037.a:"缚山连脉，缩短援路"
 LYY_Event.5037.b:"各守其山，不相往来"
 LYY_Event.5038.t:"北地之剑"
 LYY_Event.5038.d:"北地之剑，是至冬递来的邀约，也是递到申鹤手边的一柄刀。\n至冬的执行官说：你有剑，我有铁与钱，何不联手，把这乱世替天理一遍。申鹤把盟书在雪地里烧了，只留一句：我的剑不替任何人挥，除了这座山要它挥的方向。执行官看着那堆灰烬，忽然笑了：你是我见过，最难谈的对手。"
 LYY_Event.5038.a:"烧盟书，拒北来之剑"
 LYY_Event.5038.b:"接受盟约，结好至冬"
 LYY_Event.5039.t:"凡人辅军"
 LYY_Event.5039.d:"凡人辅军，是绝云间第一次把非仙者编入队伍。他们只学一件事：在最险处替身后的人多撑一刻。\n检阅那天，一个老兵出列，说想提个请求。申鹤准了。老兵说：将来若有人记得我们，请记得我们是「人」，不是「辅」，辅字听着，像谁挑剩的。申鹤沉默了一下，答：准。从此这支队伍，改名叫守山人。"
 LYY_Event.5039.a:"编凡人辅军，共守山门"
 LYY_Event.5039.b:"仙家独立，不杂凡人"
 LYY_Event.5040.t:"魔录"
 LYY_Event.5040.d:"魔录，记下的是漫长战争里每一处细节：裂隙何时开、魔物怕什么、什么咒压得住几分。\n编写魔录的老修士，一辈子没下过山。有人惋惜他错过了大战场，他却说：杀一只魔，是勇气；把册子写到能救下十年后的一个人，是功业。我这一生，就干这一件事，够了。"
 LYY_Event.5040.a:"编魔录，以传后世"
 LYY_Event.5040.b:"战况自记，不必成书"
 LYY_Event.5041.t:"千峰行"
 LYY_Event.5041.d:"千峰行，是一次几乎与天地争高下的远征。大军沿山脊行进，走得极慢，却无人能绕。\n行军途中，一个士兵问申鹤：夫人，为什么我们非走山脊？申鹤指着脚下的深谷：谷里快，可谷里也有埋伏、有瘴气、有看不见的深渊。我们慢，是因为我们输不起。士兵点点头，把这句话，传给了身后的人。"
 LYY_Event.5041.a:"千峰行，稳扎稳打"
 LYY_Event.5041.b:"取道深谷，求其速进"
 LYY_Event.5042.t:"燃雪"
 LYY_Event.5042.d:"燃雪。为赶在魔潮之前，他们烧掉了整片封冻的树林，用火逼退黑暗。\n烟与雪一同落下，冷热砸在同一张脸上。申鹤看着燃烧的雪原，说：我一生最恨弄脏雪的人，可今天我亲手烧了它。她顿了顿，又说：记住这一天，是记住我为什么烧。"
 LYY_Event.5042.a:"燃雪开路，虽悔不避"
 LYY_Event.5042.b:"绕行远途，保全雪林"
 LYY_Event.5043.t:"普天之下"
 LYY_Event.5043.d:"普天之下，是把绝云间的目光，从一座山推到整个璃月，再推到所有被魔物侵扰的角落。\n有旧人劝申鹤：守好绝云间就够了，何必趟人间的浑水。申鹤答：我下山之后才发现，山下的每一处人间，都是这座山的延伸，他们灭了，我这山，守着还有什么意义。"
 LYY_Event.5043.a:"普天之下，皆我守土"
 LYY_Event.5043.b:"收缩防线，只保绝云"
 LYY_Event.5044.t:"仙座"
 LYY_Event.5044.d:"万仙来朝，是绝云间最盛大的时刻，也最令人不安。四方修士、山下义军，乃至几个心怀鬼胎的旧敌，都举旗而来。\n申鹤站在高台上，望着这片人海，对身边人说：人聚得越多，就越像一场潮水。潮水能载舟，也能覆舟。我要的从来是堤坝。"
 LYY_Event.5044.a:"立仙座，总领四方"
 LYY_Event.5044.b:"不设共主，各归其山"
 LYY_Event.5045.t:"半仙之负"
 LYY_Event.5045.d:"半仙之负。夜深人静时，申鹤偶尔会想起涤除令下，那些被清出山门的面孔。\n她独自在崖边坐到天明，问了自己一个问题：我判他们的时候，是不是也在判某一刻的我自己？这个问题，她始终没有答案。天亮时她起身，山风把她的衣角吹起，露出手腕上一道极旧的伤疤，那是她年少时，为了证明自己够纯粹，亲手划下的。"
 LYY_Event.5045.a:"直面半仙之负，寻解"
 LYY_Event.5045.b:"压下疑问，只论功业"
 LYY_Event.5046.t:"层岩深渊"
 LYY_Event.5046.d:"层岩巨渊的深处，藏着一道比魔物更古老的黑暗。申鹤遣精锐下探，归来者眼中皆带着一抹说不清的灰。\n她亲至崖边看了一趟，望了很久，只说了两个字：守着。从此无人再下那口渊，只留下源源不断的守夜人。有守夜人问：我们在守什么？执事答：守着一个连你自己都不该知道的东西，这，就是你还能活着守在这里的原因。"
 LYY_Event.5046.a:"守层岩深渊，世代不辍"
 LYY_Event.5046.b:"封锁消息，任其沉睡"
 LYY_Event.5047.t:"夜叉之誓"
 LYY_Event.5047.d:"夜叉之誓，是一份几乎无人敢接的差事。降魔大圣的旧誓犹在，承接它的人，却一个个都成了碑。\n申鹤立于碑前，对愿接此任的年轻人说：我知道劝不住你们。我只问一句，你们想清楚了，这条路的尽头，写的是你们自己的名字吗？年轻人沉默良久，答：写不出名字，也总得有人走。申鹤没有再拦，只递过一壶温水。"
 LYY_Event.5047.a:"承夜叉之誓，接此重担"
 LYY_Event.5047.b:"另择其人，不使独苦"
 LYY_Event.5048.t:"北国赠刃"
 LYY_Event.5048.d:"北国赠刃，是那柄至冬之剑的最终归宿。申鹤收下，却从不拔它。\n她把剑悬在山门的另一侧，与自己的剑遥遥相对。有人不解，问她为何留一把敌国的剑。申鹤答：留着它，是为了让每一个进出山门的人，日日都记着一件事，这世上，还有另一条路，安静地等着被选。"
 LYY_Event.5048.a:"悬北国之刃于山门"
 LYY_Event.5048.b:"毁其剑，绝其念"
 LYY_Event.5049.t:"铁雪"
 LYY_Event.5049.d:"铁雪，是绝云间最后的模样：冷、硬、几乎不留情面。\n所有的柔软都被收进了最内层的衣襟，留给外人的，只有一片无懈可击的白。申鹤走在这雪里，脚步极稳。她忽然想：若帝君还在，看见她把一座山变成这样，会是赞许，还是叹息。想完，她自嘲地笑了一下，这个问题，同样不会有人回答她。"
 LYY_Event.5049.a:"以铁雪之姿，示于天下"
 LYY_Event.5049.b:"稍解严苛，存几分暖意"
 LYY_Event.5050.t:"光复璃月"
 LYY_Event.5050.d:"光复璃月那天，没有多少人落泪。绝云间的人不惯流泪，他们把情绪压进握剑的手里，压成一片沉默。\n申鹤站在璃月港最旧的城墙上，俯瞰着重新连成一体的山河，看了很久。最后她只说了一句：路修好了，雪，也该化了。下山吧。话音落下，身后整整齐齐的执剑者，第一次齐声应了一个字，是。"
 LYY_Event.5050.a:"带着这一山的规矩，下山"
 LYY_Event.5050.b:"封山自守，不再南下"
 LYY_Event.5051.t:"北使入山"
 LYY_Event.5051.d:"北使进山，带着精美礼物，谈的却是共同秩序。\n使者历数盟约之利，言辞恳切。申鹤听完，把礼物收下，却把盟书投入了炭盆。她说：礼我收，那是你的诚意；盟不签，因为那会变成我的枷锁。使者脸色变了又变，最后拱手：夫人果然如传闻中一样，难缠。申鹤答：多谢。请用茶。"
 LYY_Event.5051.a:"收礼而不签约"
 LYY_Event.5051.b:"签约结盟，共理秩序"
 LYY_Event.5052.t:"玉衡的灯"
 LYY_Event.5052.d:"使者赴玉衡，回来说：玉衡的灯火，比想象中亮。\n申鹤沉默良久，才答：亮灯的地方，影子也最清楚。她命人备一份薄礼回赠刻晴，不为交好，只为不肯让绝云间，在礼数上输给一个后辈。使者临走时多问了一句：夫人当真敬重那位刻晴？申鹤笑而不答，只挥了挥手。"
 LYY_Event.5052.a:"回赠薄礼，两不相欠"
 LYY_Event.5052.b:"通使交好，共御外敌"
 LYY_Event.5053.t:"群玉阁的算盘"
 LYY_Event.5053.d:"群玉阁的回信比使者到得还快，字里行间全是算盘的味道。\n申鹤看完，忽然笑出声：她把天下当一盘账，我却要把天下，一座一座地量。也好，一个量钱，一个量山，各算各的。旁边执事从没见过她这样笑，一时竟看呆了。"
 LYY_Event.5053.a:"各量各的天下，互不相扰"
 LYY_Event.5053.b:"以山中之理，非其算盘"
 LYY_Event.5054.t:"月海亭的问"
 LYY_Event.5054.d:"月海亭是绝云间唯一肯多留使者半日的地方。那位半仙问的是：山上的雪今年厚不厚？仙鹤还回来吗？\n使者回到绝云间，把这些话原样转述。申鹤听着听着，忽然很久没有说话。执事小心地问她怎么了，她答：没什么，只是想起，很久没有人用这样的问题问过我了。"
 LYY_Event.5054.a:"回信月海亭，叙山中之景"
 LYY_Event.5054.b:"以政务相复，不言私谊"
 LYY_Event.5055.t:"云来海的约"
 LYY_Event.5055.d:"云来海的约最直白：只要你肯让开一条路，至冬的铁，就永远不缺。\n申鹤把盟约折了又折，最后只留下一行批注：路可以让，但让路的人，得是我，不能是别人来推我。她将批注誊给使者时，又说了一遍：记清楚，是「让」，不是「退」。"
 LYY_Event.5055.a:"划路而不退让"
 LYY_Event.5055.b:"断然拒绝，闭境自守"
 LYY_Event.5056.t:"沉玉谷的谷种"
 LYY_Event.5056.d:"沉玉谷的回复最不像官样文章：一捧带着泥的谷种，和一句没头没尾的话，山上的雪化了，会流到这里来。\n申鹤把谷种收下，命人种在药圃一角。那一年，它真的活了，长出一片细密的新苗。申鹤蹲在苗前看了很久，谁也不知道她在想什么。只有照顾药圃的老仆记得，那天她起身时，轻轻拍了拍手上的泥，这个动作，绝云间的人从没见她对任何东西做过。"
 LYY_Event.5056.a:"收下谷种，种于药圃"
 LYY_Event.5056.b:"谢而不受，各安其土"

 SHP_Spirit_Lone_Crane:"孤鹤出云"
 SHP_Spirit_Lone_Crane_desc:"一只离群的鹤，从云端降下，要在人间立一根不弯的梁骨。它不属于任何旗帜，却比任何旗帜都更难撼动。"
 SHP_Spirit_Frost_Edict:"寒霜敕令"
 SHP_Spirit_Frost_Edict_desc:"敕令不讲情面，只讲分寸。它把一个善变的人心，冻成了可以刻在冰壁上的条文。"
 SHP_Spirit_Cold_Peace:"寒寂之治"
 SHP_Spirit_Cold_Peace_desc:"山中无争斗、无妄言，秩序井然得近乎不像人间。最完美的秩序，往往与最深的恐惧，长着同一张脸。"
 SHP_Spirit_Frost_Court:"玄霜之廷"
 SHP_Spirit_Frost_Court_desc:"修士着玄衣按阶而立，律条刻在冰壁上。这是一座冷得连回声都清脆的殿堂，仙家的朝廷。"
 SHP_Spirit_Never_Melting_Snow:"不化的雪"
 SHP_Spirit_Never_Melting_Snow_desc:"雪会化，人会散，唯有立在山巅的规矩，要它一千年也不化。这份执念，既是绝云间的脊梁，也是它的棺椁。"
 SHP_Spirit_Dao_War:"万仙来朝"
 SHP_Spirit_Dao_War_desc:"四面旗帜汇成一片人海，修士、义军、旧敌都来了。潮水能载舟，也能覆舟，她想要的，从来是堤坝，不是潮水。"
 SHP_Spirit_Ascetic_Severance:"断俗"
 SHP_Spirit_Ascetic_Severance_desc:"入山者抛家别业，从此只认山不认人。一把剑、一炉丹、一块替这座山挡风的石头，这就是他余生的全部。"
 SHP_Spirit_Mountain_Law:"山法"
 SHP_Spirit_Mountain_Law_desc:"山有山的规矩，不问尘世的律令。在这座山面前，谁来都得先学会一件最难受的事，低头。"
 SHP_Spirit_Half_Blood:"半仙之血"
 SHP_Spirit_Half_Blood_desc:"凡人与仙家的血脉相杂，是荣光，也是罪证。她判别人的时候，也在判某一刻的自己。"
 SHP_Spirit_Vigil_of_Xiao:"夜叉之誓"
 SHP_Spirit_Vigil_of_Xiao_desc:"降魔大圣的旧誓犹在，承接它的人，一个个都成了碑。这条路没有终点，只有一代又一代，不肯回头的背影。"
 SHP_Spirit_Guardians:"守山人"
 SHP_Spirit_Guardians_desc:"他们不修大道、不懂咒法，只被教一件事：怎么在最险的地方，替身后的人多撑一刻。守山人不是仙，人，有时候比仙更硬。"
 SHP_Spirit_Five_Envoys:"五方通使"
 SHP_Spirit_Five_Envoys_desc:"五面旗，五次试探，五条通向不同未来的路。绝云间未必肯低头，却终于肯先开口，这已经是它最大的一次让步。"

 SHP_Might_Tier_1:"仙威等级"
 SHP_Might_Tier_1_desc:"仙威不振，山门蒙尘，仙众离心。路过的风都敢在绝云间的檐角下打旋，没谁再把这座山当一回事。"
 SHP_Might_Tier_2:"仙威等级"
 SHP_Might_Tier_2_desc:"仙威初立，山中有戒，山外无惧。守得住自家门庭，却还压不住四方的杂音。"
 SHP_Might_Tier_3:"仙威等级"
 SHP_Might_Tier_3_desc:"仙威渐盛，九峰有令，四方侧目。绝云间说话，山下的人开始认真听了。"
 SHP_Might_Tier_4:"仙威等级"
 SHP_Might_Tier_4_desc:"仙威凛冽，剑锋所指，寸草不生。力量来得快，也硬，硬得让握剑的手，都有些发麻。"
 SHP_Might_Tier_5:"仙威等级"
 SHP_Might_Tier_5_desc:"仙威滔天，举山之力，可撼一国。可当一座山变成一头兽，最先感到寒意的，往往正是山中的人。"
 SHP_Discipline_Tier_1:"戒律等级"
 SHP_Discipline_Tier_1_desc:"戒律废弛，令出不行，法纪松散。山里的人各自为政，谁也不肯替谁多走一步。"
 SHP_Discipline_Tier_2:"戒律等级"
 SHP_Discipline_Tier_2_desc:"戒律初明，赏罚有据，上下有序。规矩立起来了，只是执行时，还留着几分人情。"
 SHP_Discipline_Tier_3:"戒律等级"
 SHP_Discipline_Tier_3_desc:"戒律严整，令行禁止，山门如铁。修士们行动如一人，冰冷，却可靠。"
 SHP_Discipline_Tier_4:"戒律等级"
 SHP_Discipline_Tier_4_desc:"戒律森严，律条如刀，不问情由。犯忌者无所遁形，而敢于通融的人，也一个个消失了。"
 SHP_Discipline_Tier_5:"戒律等级"
 SHP_Discipline_Tier_5_desc:"戒律如渊，行止坐卧，皆有定数。极端的秩序守住了绝云间的纯粹，也可能在不经意间，锁住了它伸向人间的最后一只手。"
 SHP_Combo_Twin_High:"冰火同炉"
 SHP_Combo_Twin_High_desc:"仙威尽出，戒律也压到极限。山上一面在征伐，一面在清剿自己人。"
 SHP_Combo_Twin_Low:"云散山空"
 SHP_Combo_Twin_Low_desc:"锋芒钝了，戒律也松了。山门大开，回响空落，连雪都落得没精打采。"
 SHP_Combo_A_High:"锋芒无律"
 SHP_Combo_A_High_desc:"剑出鞘了，却没人记得清该砍向谁。威势铺天盖地，队伍也开始失控。"
 SHP_Combo_B_High:"律霜无锋"
 SHP_Combo_B_High_desc:"条文刻满冰壁，队伍却打不出去。这座山安静得像一座巨大的冰窖。"

 #################### 申鹤 · 绝云间（SHP） · 战后 ####################
 SHP_PW_Lone_Crane_Order:"孤鹤临朝"
 SHP_PW_Lone_Crane_Order_desc:"璃月重新连成一体的第二天，申鹤从绝云间下山，在港口的旧城墙上站了一个时辰。她没有宣布登位，只让执律者把第一道敕令贴满街巷：从今日起，璃月的规矩由绝云间来定。街上有人跪，有人骂，更多人只是不说话。申鹤看着这些沉默的人，说：你们不必信我，先看我怎么做事。"
 SHP_PW_Clear_the_Slush:"扫雪清墟"
 SHP_PW_Clear_the_Slush_desc:"内战后的港城积着一层薄雪，底下是烧焦的梁木和没人认领的尸骨。申鹤不让人先立旗，先让人清墟。她站在瓦砾堆上，对一个正搬石头的少年说：把这里清干净，往后你走过的每一步，脚下才不会是别人的名字。"
 SHP_PW_Ration_the_Valleys:"绝云放粮"
 SHP_PW_Ration_the_Valleys_desc:"绝云间的粮不算多，申鹤还是把三成拨去了山下。执事劝她留一手，她答：山里的人饿一顿还能修一天的道，山下的人饿一顿，就有一户要散。粮车出山那天，她站在队尾，一直数到最后一辆车转过山口。"
 SHP_PW_Registry_of_the_Living:"生民新册"
 SHP_PW_Registry_of_the_Living_desc:"生民新册不论仙凡，只论活人。凡在册者，冬有炭，病有药，死于兵祸者入碑。有执律者问半仙算不算在内。她答：他还在喘气，就该占一行。册子厚得惊人，字却写得极齐整，一笔都不许潦草。"
 SHP_PW_Rebuild_the_Cloud_Gates:"重立云关"
 SHP_PW_Rebuild_the_Cloud_Gates_desc:"云关断了多年，申鹤下令重修，只加了一条旧图上没有的规矩：关墙须留一道小门，专通百姓。有匠人不解，她说：关挡的是刀，不是人。这道小门日后要开在要紧的时候。匠人听罢，把那道门画得比正门还仔细。"
 SHP_PW_The_Ascetic_Reform:"清修改制"
 SHP_PW_The_Ascetic_Reform_desc:"清修改制把山中的戒律推及整座璃月：食有节，役有期，赏罚不问出身。有人嫌太苛，申鹤只回一句：我从不强求谁去信仙，只强求谁守约。头一个冬天，城里的灯火比往年暗了三分，路上的秩序却比任何时候都齐。"
 SHP_PW_A_Ledger_of_Snow:"雪账"
 SHP_PW_A_Ledger_of_Snow_desc:"雪账记的是战后每一笔开支，从一车炭到一口棺，全都入册。申鹤每月亲自过一遍，批注只写两个字：该否。有官吏嫌她管得太细，她把册子推过去说：花的是百姓拿命换来的钱，细一点，是应该的。"
 SHP_PW_Frost_Workshops:"霜炉工坊"
 SHP_PW_Frost_Workshops_desc:"霜炉是绝云间的第一座官办工坊，烧的是冷火，出的是铁器与丹械。申鹤让山中的匠人带徒，头一批学徒里有山下的孤儿。她说：手艺留在山上，只会生苔；传下去，才会长青。头一年炉子只熄过两次。"
 SHP_PW_Cloud_Rail:"云间车道"
 SHP_PW_Cloud_Rail_desc:"车道从山脚一直修到云关，第一条枕木是申鹤亲手放的。修路的民夫里有一半是内战里投降的旧军。她对他们说：路修好了，你们的力气就长在这条路上，谁也抹不掉。通车那天，第一辆车的轮子是她亲手推过去的。"
 SHP_PW_Herb_Terraces:"药圃扩垦"
 SHP_PW_Herb_Terraces_desc:"药圃沿着向阳的坡地层层铺开，种的是凡人也能用的寻常药材。申鹤定规：药先供山下，再供山中。有修士不服，她答：山外的人病倒了，山里的丹炼给谁看。管圃的老仆记得，那年秋天的药苗长得比谁都旺。"
 SHP_PW_Frost_Coinage:"铸霜钱"
 SHP_PW_Frost_Coinage_desc:"霜钱是新铸的通货，一面是鹤，一面是一道律条。申鹤要的是钱上有字，让人花出去的时候也看得见规矩。有商人嫌沉，她答：钱轻了，规矩就轻了。第一批霜钱铸成那天，她在炉边站到天亮，一枚一枚地看过去。"
 SHP_PW_Adepti_Academy:"仙学馆"
 SHP_PW_Adepti_Academy_desc:"仙学馆收的是仙凡同席的学生，讲丹鼎、阵法，也讲算学与水利。开学那天申鹤说：你们可以不信仙，却不能不懂账。台下有个山下少年站起来问她半仙算不算仙，她答：算不算不打紧，先把账算清楚。"
 SHP_PW_Peak_Arsenal:"峰间兵工"
 SHP_PW_Peak_Arsenal_desc:"兵工从港口迁进山坳，产量翻了一倍。申鹤立下一条规矩：每件出厂的兵器都要刻上工匠的名字。有人说这是留下寻仇的把柄，她答：有人认领的刀，才不会随便出鞘。第一条标名的枪，在厂门口挂了整整一年。"
 SHP_PW_Envoys_Below_the_Clouds:"遣使下界"
 SHP_PW_Envoys_Below_the_Clouds_desc:"内战期间璃月几乎从提瓦特的地图上消失。申鹤派出的第一批使节带的是账册和一句口信：绝云间的门开了，规矩得先说清楚。有人笑她姿态太硬，她说：肯先亮账本的人，才配谈信义。"
 SHP_PW_The_Yuheng_Accord:"玉衡之约"
 SHP_PW_The_Yuheng_Accord_desc:"刻晴的使者带来了共和的章程，申鹤读了一夜。次日她只问一句：你们的宪章，管不管仙？使者答：管。她笑了笑，说：那就好谈。两人始终没有真正结盟，却在同一张纸上，各自划下了一条不愿越过的线。"
 SHP_PW_The_Jade_Chamber_Account:"群玉阁之账"
 SHP_PW_The_Jade_Chamber_Account_desc:"凝光的回信处处是算盘声。申鹤看完，没有回信，只送去一车霜铁，附言四个字：账后再说。有人问这是什么意思，她答：她要算天下，我要量山。算得清的归她，量得准的归我，这样才谈得长久。"
 SHP_PW_Moonlit_Pavilion_Question:"月海亭问雪"
 SHP_PW_Moonlit_Pavilion_Question_desc:"甘雨是绝云间唯一肯多留使者半日的人。她问的全是私话：山上的雪今年厚不厚，仙鹤还回不回来。使者把这些话原样带回，申鹤听着听着，很久没有说话，末了才说：已经很多年，没人这样问过我了。"
 SHP_PW_The_Cloud_Sea_Pact:"云来海之约"
 SHP_PW_The_Cloud_Sea_Pact_desc:"云来海的约定最直白：让一条路，至冬的铁就不缺。申鹤把盟约折了又折，只批一行字：路可以让，但得我自己让，不能是别人来推。使者临走时问缘由，她答：被推着让的路，迟早要被推着收回去。"
 SHP_PW_The_Sunken_Jade_Seed:"沉玉谷之种"
 SHP_PW_The_Sunken_Jade_Seed_desc:"沉玉谷的回信不像公文，只有一捧带泥的谷种和一句话：雪化了，会流到这里来。申鹤把谷种收下，命人种在药圃一角。那一年它真的活了。她蹲在苗前看了很久，起身时，随手拍掉了手上的泥。"
 SHP_PW_The_Empty_Seat:"空座之问"
 SHP_PW_The_Empty_Seat_desc:"帝君的神位空了，天空岛也不发一言。申鹤把三张空椅摆在殿中，对众人说：从前璃月做每件事，都要先看别人的脸色；如今这几把椅子空着，正好让我们看清，自己坐得正不正。此后每逢大事，那三张椅子都没人敢坐。"
 SHP_PW_Question_the_Heavens:"质问天理"
 SHP_PW_Question_the_Heavens_desc:"申鹤命人把历年的神谕、天象、谶纬汇成一册，逐条标注真假。负责整理的执律者越查越心惊。申鹤却在册尾写道：留下这本册子，是给后人一个能自己判断的依据，不必再等谁来替他们说话。"
 SHP_PW_Ward_the_Chasm:"镇渊"
 SHP_PW_Ward_the_Chasm_desc:"巨渊的裂缝又被封了一遍，用的是新铸的合金与新的加固法。申鹤亲自下到井口，看着最后一段闸门落下，说：深渊是一笔按月要还的债。今天多还一分，明天的人就少赌一次命。井口的工人听了，一起直起了腰。"
 SHP_PW_The_Fissure_Crusade:"讨裂境"
 SHP_PW_The_Fissure_Crusade_desc:"讨裂境是绝云间少有的主动出击，修士深入幽暗，把魔物的巢穴一处处捣毁。归来的人带不回战利品，只带回地图：哪儿还烧着，哪儿已经冷了，哪儿又长出了新的魔气。申鹤看着地图上的红点说：这是一场赢不了、也停不下的仗。"
 SHP_PW_Supplant_the_Sky:"替天"
 SHP_PW_Supplant_the_Sky_desc:"申鹤第一次在众人面前说出那两个字：替天。她说：天理若在，就请它出来说话；若它一直不吭声，那张椅子空着，总得有人坐上去把秩序立住。话说完，殿中无人接声。殿外的雪，落得很静，一夜之间盖满了石阶。"
 SHP_PW_The_Adepti_Throne:"仙座"
 SHP_PW_The_Adepti_Throne_desc:"仙座是一张不称王的椅子，坐上去的人只称执律者。申鹤把律条刻在椅背上，说：这张椅子是给所有抬不起头的人看的，让他们知道，这世上还有一样东西，比他们自己的苦难更高。"
 SHP_PW_The_Frost_Host:"霜军"
 SHP_PW_The_Frost_Host_desc:"霜军不用旗号，只用一道袖口的白线认人。申鹤检阅时说：这支队伍的规矩只有两条，出剑之前先把心定住，收剑之后把地上扫干净。队伍很静，静得连呼吸都合着同一个拍子，风过时只有衣角在响。"
 SHP_PW_Cull_the_Frail:"汰弱新令"
 SHP_PW_Cull_the_Frail_desc:"汰弱令听来严峻，执行起来更冷。体弱、心浮、累及同伍的，一一清出行伍。申鹤说：一群自以为仁慈的人聚在一起，最先饿死的，恰恰是他们最舍不得丢下的那几个。被清出的人没有闹，只默默走下了山。"
 SHP_PW_Demon_Hunters:"猎魔队"
 SHP_PW_Demon_Hunters_desc:"猎魔队是绝云间唯一被默许的杀伐。山精、水怪、被侵蚀的野兽，全都列进了猎单。一次归来的猎手带回一只幼魔的残骸，说它临死前一直在抖。申鹤看着那具小骨架，沉默许久，说：连它发抖的样子，也一并记下来。"
 SHP_PW_Cloud_Passes_Rebuilt:"云关重筑"
 SHP_PW_Cloud_Passes_Rebuilt_desc:"云关重筑，图纸上多了一条新要求：关内要留水井与存粮。有将领不解，申鹤答：一座挡风的关，得先让守关的人能活过一个冬天。她把这件事写进令里，字写得极平，却再没有人敢删掉它。"
 SHP_PW_Half_Immortal_Auxilia:"半仙辅军"
 SHP_PW_Half_Immortal_Auxilia_desc:"半仙辅军是绝云间第一次把非纯血者编进队伍。他们不修大道，只学一件事：在最险的地方替身后的人多撑一刻。检阅时一个老兵出列说：将来若有人记得我们，请记得我们是人，不是谁挑剩下的。"
 SHP_PW_Snow_Legion:"雪原军团"
 SHP_PW_Snow_Legion_desc:"雪原军团常年屯在最高的几处隘口，轮换期极短，饷却给得足。申鹤的理由很直：在雪里熬人的人，不能让他熬太久。她要的是一支还记得天光长什么样的军队，不是一支习惯黑暗的军队。"
 SHP_PW_The_Snow_Synod:"雪台大议"
 SHP_PW_The_Snow_Synod_desc:"璃月已经立住，往后往哪走，却没有一个人说得清。申鹤把雪台的门敞开三日，谁都能上来讲。三日之后，纸堆了半人高，争论也没停。她看着这堆纸说：吵不完最好。吵完了，才是真没人敢开口了。"
 SHP_PW_Nation_of_Adepti:"万仙之国"
 SHP_PW_Nation_of_Adepti_desc:"万仙之国的方案是把修真立为国本，仙权高于一切尘世律令。反对的人说这样会寒了凡人的心，申鹤答：寒了心还能再暖，散了骨就再也拼不回来。她按下第一个印，纸角上留了一道浅浅的褶。"
 SHP_PW_The_Ascetic_State:"举国修真"
 SHP_PW_The_Ascetic_State_desc:"举国修真之下，学塾也讲丹方，衙门也设道席。申鹤不设官学正统，只在每处讲坛钉一块同样的木牌：说得通就听，说不通就散。她说：一个怕人议论的朝廷，早就没什么可议论的了。"
 SHP_PW_Purge_the_Mortal_Ties:"断尘"
 SHP_PW_Purge_the_Mortal_Ties_desc:"断尘令颁下，入道者须与家世一刀两断。有人在关外跪了三日，只为见一个刚入道的儿子。申鹤立在关墙上看了很久，最后命人送去一车粮，却没有开门。她说：我可以救他，却不能让他学会跪在别人的关前。"
 SHP_PW_The_Ladder:"登仙之阶"
 SHP_PW_The_Ladder_desc:"登仙之阶层层设卡，能走到底的人寥寥。有个少年走到中途便再上不去，坐在阶上哭。守阶的老修士递给他一壶酒，说：上不去的人我见了一辈子，他们后来大多下了山，也都活得好好的。路断了，斜着走也还是路。"
 SHP_PW_The_Frost_Court_PW:"玄霜新廷"
 SHP_PW_The_Frost_Court_PW_desc:"玄霜新廷是绝云间第一次有了朝廷的样子，修士按品阶而立，律条刻在冰壁上。第一次开廷，殿堂冷得连回声都清脆。申鹤高居上座，看着这座近乎完美的殿堂，把一句话压进了心底：最像仙境的地方，往往最不像人间。"
 SHP_PW_Silence_Below:"举世寂然"
 SHP_PW_Silence_Below_desc:"举世寂然。律令推到极处，连山下的城都比别处安静。申鹤独自立在最高处，听这彻底的静，忽然对着空无一人的山巅说了一句：帝君，我把这座山守成了一口井，井里没有风浪，也没有活水，可是井里干净。"
 SHP_PW_The_Immortal_Capital:"仙都"
 SHP_PW_The_Immortal_Capital_desc:"仙都落成那天，全城不设庆典，只把律条拓印分发给每一户。申鹤对来贺的各山修士说：这里不叫京城，叫仙都，因为住在这里的人，头一件事是守律，第二件事才是吃饭。众人肃立，谁也没有先动。"
 SHP_PW_The_Eternal_Snow_PW:"万载不化"
 SHP_PW_The_Eternal_Snow_PW_desc:"万载不化，是申鹤给这条道路亲手盖下的印。她把剑插入峰顶的积雪，说：雪会化，人会散，只有立在这里的规矩，我要它一千年也不化。多年以后有人上山寻访，只见剑痕犹新，积雪如故，立誓的人却早已无人记得。"
 SHP_PW_Rule_of_the_Half_Immortals:"半仙之治"
 SHP_PW_Rule_of_the_Half_Immortals_desc:"半仙之治把半仙与人族抬到肱骨的位置。申鹤说：纯仙太少，凡人太弱，能从两头都懂一点的，才是撑得住这座山的骨头。有人问她不怕半仙离心吗，她答：怕。可我更需要他们站着。"
 SHP_PW_The_Mortal_Council:"人族议政"
 SHP_PW_The_Mortal_Council_desc:"人族议政让凡人第一次坐进了绝云间的议事之地。第一场会上，一个铁匠当众质问一位老仙，满堂无声。申鹤坐在最后排，没有出声，散会后却把那天的记录抄了一份留底，锁进了最厚的那个柜子。"
 SHP_PW_The_Half_Blood_Host:"半仙为骨"
 SHP_PW_The_Half_Blood_Host_desc:"半仙为骨，是把半仙编成军中最硬的几支。他们识得咒法，也懂得巷陌。申鹤检阅时对领队说：你们比仙更懂人，比人更懂仙，这份夹在两头的苦，往后就是你们的本事。领队行了个礼，没有说话。"
 SHP_PW_The_Empire_of_Snow:"雪原帝业"
 SHP_PW_The_Empire_of_Snow_desc:"雪原帝业把绝云间的目光从一座山推到整个璃月，再推到所有被魔物侵扰的角落。有旧人劝她守好绝云间就够了，她答：我下山之后才明白，山下的每一处人间都是这座山的延伸，他们灭了，我这山也就没了意义。"
 SHP_PW_March_on_the_Coast:"临海用兵"
 SHP_PW_March_on_the_Coast_desc:"临海用兵的命令下达那夜，申鹤在地图前站到天亮。第二天她只在令尾添了四个字：勿伤百姓。送出军令的手，比送出任何一份文书时都要慢。那四个字后来成了军中一条不成文的老规矩。"
 SHP_PW_The_Blood_Tithe:"血税"
 SHP_PW_The_Blood_Tithe_desc:"血税是把凡人的丁口与半仙的血脉一并计入国用。申鹤不觉得这有什么可耻，她直言：云端的清净从不是凭空来的，想借一座山挡住乱世的风雨，就得先为这座山供上足够的血与粮。账房听了，默默添了一页新册。"
 SHP_PW_The_Imperial_Peak:"帝峰"
 SHP_PW_The_Imperial_Peak_desc:"帝峰之名第一次挂上绝云间最高的那道山脊时，没有人欢呼。申鹤站在峰顶，看着脚下这片用雪与血换来的土地，忽然想起自己刚下山时说过的那句话。她没有回头，只把披风裹紧了一些，站到风停。"
 SHP_PW_The_Half_Immortal_Emperor:"半仙天帝"
 SHP_PW_The_Half_Immortal_Emperor_desc:"半仙天帝四个字刻上仙都城头那天，申鹤在城门前站了很久。她没有讲应许，只对身旁人说：我这一生大概只做成了一件事，让这座山不必再看任何人的脸色。说完，她转身走进了那座没有神位的殿，门在身后合上，声音很轻。"
 SHP_PW_The_Half_Blood_Burden_PW:"半仙之负"
 SHP_PW_The_Half_Blood_Burden_PW_desc:"夜深人静时，申鹤偶尔会想起断尘令下那些被清出山门的面孔，也会想起自己身上流着两重血。她独自坐到天明，问自己一个始终没有答案的问题：我判他们的那一天，是不是也在判某一刻的我自己。"
 SHP_PW_The_North_Blade_PW:"北国赠刃"
 SHP_PW_The_North_Blade_PW_desc:"至冬送来一柄好剑，申鹤收下了，却从不拔。她把它悬在山门的另一侧，与本命剑遥遥相对。有人不解为何留一把敌国的剑，她答：留着它，是让每一个进出山门的人日日记着，这世上还有另一条路，安静地等着被选。"
 SHP_PW_Liyue_Under_Snow:"雪覆璃月"
 SHP_PW_Liyue_Under_Snow_desc:"雪覆璃月。当最后一片战后的废墟被清理干净，申鹤一个人走遍了全城。她走到码头，走到学塾，走到那座没有神位的殿，把一路看见的都记了下来。她在册末写道：这就是我们换来的东西，好不好，都由我们自己担着。"
 SHP_PW_The_New_Law_Code:"绝云新律"
 SHP_PW_The_New_Law_Code_desc:"绝云新律把三年来的敕令、判例、军规汇成一部律书。申鹤亲笔写下第一篇，只有一句：绝云之律，护生，不护人。写完后她搁笔很久，说：最难的是往后连我自己，也得先低下头来认它。"
 SHP_PW_The_Empty_Chair:"空椅"
 SHP_PW_The_Empty_Chair_desc:"仙殿的最深处，始终留着三张空椅。有人劝申鹤把它们收起来，她没有应。她说：留着它们，是为了让每一个坐上这把椅子的人，进门时都得先看一眼，自己是不是坐得太稳了。此后几乎没有人敢直视那三张椅子。"

 SHP_postwar_category:"绝云新律"
 SHP_postwar_category_desc:"申鹤战后的整肃决议组。秩序重整之后，孤辰势力着手清理残余、安抚山野与安顿仙家旧部，务求让璃月回稳。旧账算清，新的局面才好开头，否则积怨不清，迟早还要再生波澜。旧账不清，新局难开，这是孤辰一脉的行事准则。"
 SHP_decision_pw_mountain_patrol:"巡山"
 SHP_decision_pw_mountain_patrol_desc:"巡山是把每一道可能渗进魔气的山隙都用脚步量一遍。雪落下来会盖住痕迹，也会盖住危险，所以巡山的人一辈子都在跟雪抢时间。"
 SHP_decision_pw_frost_ration:"寒粮下拨"
 SHP_decision_pw_frost_ration_desc:"绝云间自己不留多少余粮，粮车一车车地往山下推。申鹤的道理很直：山要人守，就得先让人活着。给出去的是一笔无形的账，日后总要从别处收回来。"
 SHP_decision_pw_purge_roll:"清厘名册"
 SHP_decision_pw_purge_roll_desc:"名册上的名字，有些是真犯了忌，有些只是恰好在那一年说错了半句话。清厘名册的人，往往比被清厘的人更不安，因为他们最清楚，这把尺子早晚也会量到自己身上。"
 SHP_decision_pw_summon_adepti:"召集仙众"
 SHP_decision_pw_summon_adepti_desc:"一封封请帖送上各山的洞府，措辞客气，底线分明：来，则同守此山；不来，则此后山门之事与君无涉。做仙人做久了，最难的是学会听别人的规矩。"
 SHP_decision_pw_bind_demon:"缚魔"
 SHP_decision_pw_bind_demon_desc:"缚魔是一门极耗心神的功课，不杀，只封。因为有些东西杀了会散，散了更麻烦。绝云间的封魔阵一代不如一代，是能安心坐满那个阵的人越来越少了。"
 SHP_decision_pw_disciple_trial:"考功试炼"
 SHP_decision_pw_disciple_trial_desc:"考功试炼不问出身，只问心性。有人在最后一关崩溃，有人却在那道关口上第一次想清楚了自己是谁。申鹤说：我考的是他们输了之后还站不站得起来。"
 SHP_decision_pw_forge_frost:"铸霜"
 SHP_decision_pw_forge_frost_desc:"霜铁难得，寒炉难守。铸霜的匠人往往是绝云间最沉默的一群人，他们守着一炉不肯熄灭的冷火，做出来的东西却要给别人拿去暖身、拿去活命。"
 SHP_decision_pw_herb_garden:"辟圃种药"
 SHP_decision_pw_herb_garden_desc:"绝云间的药圃种的是凡人也用得上的寻常药材。申鹤说：仙家若只顾炼丹求己身，那和山上那些只顾自己的石头有什么两样。药种下去要几年才成材，可总得有人先种。"
 SHP_decision_pw_envoy_keqing:"使者赴玉衡"
 SHP_decision_pw_envoy_keqing_desc:"使者回来时只说了一句话：玉衡的灯，比想象中亮。申鹤沉默良久，答：亮灯的地方，影子也最清楚。她让人备了一份薄礼回赠刻晴，不为交好，只为不肯在礼数上输给一个后辈。"
 SHP_decision_pw_envoy_ningguang:"使者赴群玉阁"
 SHP_decision_pw_envoy_ningguang_desc:"群玉阁的回信比使者到得还快，字里行间都是算盘的味道。申鹤看完一笑：她把天下当成一盘账，我却要把天下一座一座地量。也好，一个量钱，一个量山，各算各的。"
 SHP_decision_pw_chasm_watch:"层岩守望"
 SHP_decision_pw_chasm_watch_desc:"层岩的裂缝不会因为人怕它就变小，却会因为有人守着它而暂时睡一会儿。守夜人一代轮过一代，从没有人见过尽头，也没有人问过尽头在哪儿。"
 SHP_decision_pw_grand_edict:"立绝云新律"
 SHP_decision_pw_grand_edict_desc:"把三年来的敕令、判例、军规汇成一部律书，是所有执律者最重的一次差事。申鹤亲笔写下第一篇，只有一句：绝云之律，护生，不护人。写完后她搁笔很久，说：最难的是，从今往后连我自己也得服从它。"

 LYY_Event.11001.t:"孤鹤临朝"
 LYY_Event.11001.d:"璃月重新连成一体的第二天，申鹤从绝云间下山，在港口的旧城墙上站了一个时辰。她没有宣布登位，只让执律者把第一道敕令贴满街巷：从今日起，璃月的规矩由绝云间来定。\n街上有人跪，有人骂，更多人只是不说话。申鹤看着这些沉默的人说：你们不必信我，先看我怎么做事。这句话成了新政的第一份公文。"
 LYY_Event.11001.a:"下山立秩序，护绝云亦护人间"
 LYY_Event.11001.b:"只守绝云间，不问山外事"
 LYY_Event.11002.t:"扫雪清墟"
 LYY_Event.11002.d:"内战后的港城积着一层薄雪，底下是烧焦的梁木和没人认领的尸骨。申鹤不让人先立旗，先让人清墟。\n她站在瓦砾堆上，对一个正搬石头的少年说：把这里清干净，往后你走过的每一步，脚下才不会是别人的名字。跟着拾瓦砾的人越来越多，谁也没说话，铁锹碰石头的声音却比什么口号都齐。"
 LYY_Event.11002.a:"清墟安民，先净城郭"
 LYY_Event.11002.b:"先立旗宣威，后清废墟"
 LYY_Event.11003.t:"绝云放粮"
 LYY_Event.11003.d:"绝云间的粮不算多，申鹤还是把三成拨去了山下。执事劝她留一手。\n她答：山里的人饿一顿还能修一天的道，山下的人饿一顿，就有一户要散。粮车出山那天，她站在队尾，一直数到最后一辆车转过山口。有个村妇捧着半袋米，朝着山的方向磕了个头。"
 LYY_Event.11003.a:"放粮山下，先救人"
 LYY_Event.11003.b:"囤粮山中，先固本"
 LYY_Event.11004.t:"生民新册"
 LYY_Event.11004.d:"生民新册不论仙凡，只论活人。凡在册者，冬有炭，病有药，死于兵祸者入碑。\n有执律者问半仙算不算在内。申鹤答：他还在喘气，就该占一行。册子厚得惊人，字却写得极齐整。负责登记的书吏写到深夜，灯下把每一个名字都念了一遍才收笔。"
 LYY_Event.11004.a:"仙凡同册，一人一行"
 LYY_Event.11004.b:"只登仙籍，不问凡人"
 LYY_Event.11005.t:"重立云关"
 LYY_Event.11005.d:"云关断了多年，申鹤下令重修，只加了一条旧图上没有的规矩：关墙须留一道小门，专通百姓。\n有匠人不解，她说：关挡的是刀，不是人。这道小门日后要开在要紧的时候。匠人听罢，把那道门画得比正门还仔细。后来这道门被百姓叫作小民门。"
 LYY_Event.11005.a:"云关留门，通民以路"
 LYY_Event.11005.b:"关墙求固，不留隙口"
 LYY_Event.11006.t:"雪账"
 LYY_Event.11006.d:"雪账记的是战后每一笔开支，从一车炭到一口棺，全都入册。申鹤每月亲自过一遍，批注只写两个字：该否。\n有官吏嫌她管得太细，她把册子推过去说：花的是百姓拿命换来的钱，细一点，是应该的。此后各衙门的账册，字迹都比从前工整了许多。"
 LYY_Event.11006.a:"月核雪账，细究其数"
 LYY_Event.11006.b:"委之执事，不必亲阅"
 LYY_Event.11007.t:"霜炉工坊"
 LYY_Event.11007.d:"霜炉是绝云间的第一座官办工坊，烧的是冷火，出的是铁器与丹械。申鹤让山中的匠人带徒，头一批学徒里就有山下的孤儿。\n她说：手艺留在山上，只会生苔；传下去，才会长青。头一年炉子只熄过两次，第二次熄火时，几个学徒连夜轮班守着，天亮前把它重新点了起来。"
 LYY_Event.11007.a:"霜炉传艺，广收学徒"
 LYY_Event.11007.b:"闭炉自守，秘不外传"
 LYY_Event.11008.t:"云间车道"
 LYY_Event.11008.d:"车道从山脚一直修到云关，第一条枕木是申鹤亲手放的。修路的民夫里有一半是内战里投降的旧军。\n她对他们说：路修好了，你们的力气就长在这条路上，谁也抹不掉。通车那天，第一辆车的轮子是她亲手推过去的。车轮碾过铁轨的声音，惊起了满山的飞鸟。"
 LYY_Event.11008.a:"车道通山，役及其众"
 LYY_Event.11008.b:"缓修工事，先固边防"
 LYY_Event.11009.t:"药圃扩垦"
 LYY_Event.11009.d:"药圃沿着向阳的坡地层层铺开，种的是凡人也能用的寻常药材。申鹤定规：药先供山下，再供山中。\n有修士不服，她答：山外的人病倒了，山里的丹炼给谁看。管圃的老仆记得，那年秋天的药苗长得比谁都旺，申鹤来看过一回，蹲了很久才起身。"
 LYY_Event.11009.a:"药先供山下，不拘仙凡"
 LYY_Event.11009.b:"药入山中，先炼己身"
 LYY_Event.11010.t:"铸霜之钱"
 LYY_Event.11010.d:"霜钱是新铸的通货，一面是鹤，一面是一道律条。申鹤要的是钱上有字，让人花出去的时候也看得见规矩。\n有商人嫌沉，她答：钱轻了，规矩就轻了。第一批霜钱铸成那天，她在炉边站到天亮，一枚一枚地看过去。铸钱的老匠人后来对人说，那一夜她没笑过，也没皱过眉。"
 LYY_Event.11010.a:"铸霜钱，钱上有律"
 LYY_Event.11010.b:"仍用旧钱，不必更张"
 LYY_Event.11011.t:"仙学馆"
 LYY_Event.11011.d:"仙学馆收的是仙凡同席的学生，讲丹鼎、阵法，也讲算学与水利。开学那天申鹤说：你们可以不信仙，却不能不懂账。\n台下有个山下少年站起来问她半仙算不算仙，她答：算不算不打紧，先把账算清楚。少年愣了一下，坐下后把这句话抄在了自己的手背上。"
 LYY_Event.11011.a:"仙学同席，不问出身"
 LYY_Event.11011.b:"只收聪敏，免耗钱粮"
 LYY_Event.11012.t:"遣使下界"
 LYY_Event.11012.d:"内战期间璃月几乎从提瓦特的地图上消失。申鹤派出的第一批使节带的是账册和一句口信：绝云间的门开了，规矩得先说清楚。\n有人笑她姿态太硬，她说：肯先亮账本的人，才配谈信义。使节出海那天，码头上没有送行的人群，只有一盏亮着的灯塔。"
 LYY_Event.11012.a:"先亮账本，再谈往来"
 LYY_Event.11012.b:"厚礼开道，先结善缘"
 LYY_Event.11013.t:"玉衡之约"
 LYY_Event.11013.d:"刻晴的使者带来了共和的章程，申鹤读了一夜。次日她只问一句：你们的宪章，管不管仙？\n使者答：管。她笑了笑，说：那就好谈。两人始终没有真正结盟，却在同一张纸上，各自划下了一条不愿越过的线。散会时，刻晴的使者评价说：这位山主，比传闻中好打交道。"
 LYY_Event.11013.a:"与玉衡对章，各划其界"
 LYY_Event.11013.b:"拒其章程，各行其是"
 LYY_Event.11014.t:"群玉阁之账"
 LYY_Event.11014.d:"凝光的回信处处是算盘声。申鹤看完，没有回信，只送去一车霜铁，附言四个字：账后再说。\n有人问这是什么意思，她答：她要算天下，我要量山。算得清的归她，量得准的归我，这样才谈得长久。使者带着霜铁回程时，一路都在琢磨那四个字的意思。"
 LYY_Event.11014.a:"以霜铁换账，各算各的"
 LYY_Event.11014.b:"结好群玉阁，以利相交"
 LYY_Event.11015.t:"月海亭问雪"
 LYY_Event.11015.d:"甘雨是绝云间唯一肯多留使者半日的人。她问的全是私话：山上的雪今年厚不厚，仙鹤还回不回来。\n使者把这些话原样带回，申鹤听着听着，很久没有说话，末了才说：已经很多年，没人这样问过我了。那天她破例多留了使者一顿饭，席间谁也没有谈政务。"
 LYY_Event.11015.a:"回书月海亭，叙山中之雪"
 LYY_Event.11015.b:"以政务相复，不言私谊"
 LYY_Event.11016.t:"云来海之约"
 LYY_Event.11016.d:"云来海的约定最直白：让一条路，至冬的铁就不缺。申鹤把盟约折了又折，只批一行字：路可以让，但得我自己让，不能是别人来推。\n使者临走时问缘由，她答：被推着让的路，迟早要被推着收回去。使者把这句话记下带回了云来海，据说那位执行官听完，沉默了很久。"
 LYY_Event.11016.a:"划路而不退让"
 LYY_Event.11016.b:"断然拒绝，闭境自守"
 LYY_Event.11017.t:"沉玉谷之种"
 LYY_Event.11017.d:"沉玉谷的回信不像公文，只有一捧带泥的谷种和一句话：雪化了，会流到这里来。\n申鹤把谷种收下，命人种在药圃一角。那一年它真的活了，长出一片细密的新苗。申鹤蹲在苗前看了很久，起身时随手拍掉了手上的泥。照圃的老仆说，这个动作，绝云间的人从没见她对别的东西做过。"
 LYY_Event.11017.a:"收下谷种，种于药圃"
 LYY_Event.11017.b:"谢而不受，各安其土"
 LYY_Event.11018.t:"空座之问"
 LYY_Event.11018.d:"帝君的神位空了，天空岛也不发一言。申鹤把三张空椅摆在殿中。\n她对众人说：从前璃月做每件事，都要先看别人的脸色；如今这几把椅子空着，正好让我们看清，自己坐得正不正。此后每逢大事，那三张椅子都没人敢坐，也没人敢搬走。"
 LYY_Event.11018.a:"三椅空置，自省其位"
 LYY_Event.11018.b:"请人入座，另立共主"
 LYY_Event.11019.t:"质问天理"
 LYY_Event.11019.d:"申鹤命人把历年的神谕、天象、谶纬汇成一册，逐条标注真假。负责整理的执律者越查越心惊。\n申鹤却在册尾写道：留下这本册子，是给后人一个能自己判断的依据，不必再等谁来替他们说话。这本册子后来被放在学馆最显眼的书架上，翻得比任何典籍都旧。"
 LYY_Event.11019.a:"整理典籍，留册后人"
 LYY_Event.11019.b:"焚毁旧典，重立新说"
 LYY_Event.11020.t:"半仙辅军"
 LYY_Event.11020.d:"半仙辅军是绝云间第一次把非纯血者编进队伍。他们不修大道，只学一件事：在最险的地方替身后的人多撑一刻。\n检阅时一个老兵出列，说想提个请求。申鹤准了。老兵说：将来若有人记得我们，请记得我们是人，不是谁挑剩下的。申鹤沉默了一下，答：准。从此这支队伍改了名，叫守山人。"
 LYY_Event.11020.a:"编半仙辅军，共守山门"
 LYY_Event.11020.b:"仙家独立，不杂凡血"
 LYY_Event.11021.t:"镇渊"
 LYY_Event.11021.d:"巨渊的裂缝又被封了一遍，用的是新铸的合金与新的加固法。申鹤亲自下到井口，看着最后一段闸门落下。\n她说：深渊是一笔按月要还的债。今天多还一分，明天的人就少赌一次命。井口的工人听见这句话，一起直起腰，朝着落下的闸门站了很久。"
 LYY_Event.11021.a:"铸新闸，亲下井口"
 LYY_Event.11021.b:"循旧法，勉力维持"
 LYY_Event.11022.t:"讨裂境"
 LYY_Event.11022.d:"讨裂境是绝云间少有的主动出击，修士深入幽暗，把魔物的巢穴一处处捣毁。归来的人带不回战利品，只带回地图。\n一支队伍归来时只剩半数，领队手里却紧紧攥着那张地图。申鹤接过地图，没有问伤亡，只问：还烧着的，还剩几处？领队答：三处。申鹤说：那就再去三次。"
 LYY_Event.11022.a:"深入裂隙，捣其巢穴"
 LYY_Event.11022.b:"虚张声势，以逼其退"
 LYY_Event.11023.t:"替天"
 LYY_Event.11023.d:"申鹤第一次在众人面前说出那两个字：替天。\n她说：天理若在，就请它出来说话；若它一直不吭声，那张椅子空着，总得有人坐上去把秩序立住。话说完，殿中无人接声。殿外的雪落得很静，一夜之间盖满了石阶。有执律者事后回忆，那一夜他第一次觉得，这座山比想象中更高，也更冷。"
 LYY_Event.11023.a:"言明替天之意，坐那张空椅"
 LYY_Event.11023.b:"藏其锋芒，徐图后计"
 LYY_Event.11024.t:"汰弱新令"
 LYY_Event.11024.d:"汰弱令听来严峻，执行起来更冷。体弱、心浮、累及同伍的，一一清出行伍。\n申鹤说：一群自以为仁慈的人聚在一起，最先饿死的，恰恰是他们最舍不得丢下的那几个。被清出的人没有闹，只默默走下了山。最后一个离开的是个瘸腿老兵，他接过申鹤递来的一包药，什么也没问。"
 LYY_Event.11024.a:"行汰弱令，精简行伍"
 LYY_Event.11024.b:"广纳丁壮，多多益善"
 LYY_Event.11025.t:"猎魔队"
 LYY_Event.11025.d:"猎魔队是绝云间唯一被默许的杀伐。山精、水怪、被侵蚀的野兽，全都列进了猎单。\n一次归来的猎手带回一只幼魔的残骸，说它临死前一直在抖。申鹤看着那具小骨架，沉默许久，说：连它发抖的样子，也一并记下来。别让我们杀着杀着，忘了自己在杀什么。"
 LYY_Event.11025.a:"循魔气而猎，斩草除根"
 LYY_Event.11025.b:"只驱不杀，防护生灵"
 LYY_Event.11026.t:"云关重筑"
 LYY_Event.11026.d:"云关重筑，图纸上多了一条新要求：关内要留水井与存粮。有将领不解，申鹤答：一座挡风的关，得先让守关的人能活过一个冬天。\n她把这件事写进令里，字写得极平，却再没有人敢删掉它。后来这两条被写进了所有边关的营造式样里，一用就是许多年。"
 LYY_Event.11026.a:"关内储水存粮，务求可守"
 LYY_Event.11026.b:"只筑高墙，不问守卒"
 LYY_Event.11027.t:"雪原军团"
 LYY_Event.11027.d:"雪原军团常年屯在最高的几处隘口，轮换期极短，饷却给得足。申鹤的理由很直：在雪里熬人的人，不能让他熬太久。\n她要的是一支还记得天光长什么样的军队，不是一支习惯黑暗的军队。轮到换防的守卒下山时，总有人回头朝隘口望一眼，也有人从此再没上去过。"
 LYY_Event.11027.a:"缩短轮换，厚待守卒"
 LYY_Event.11027.b:"延长戍期，节省粮饷"
 LYY_Event.11028.t:"峰间兵工"
 LYY_Event.11028.d:"兵工从港口迁进山坳，产量翻了一倍。申鹤立下一条规矩：每件出厂的兵器都要刻上工匠的名字。\n有人说这是留下寻仇的把柄，她答：有人认领的刀，才不会随便出鞘。第一条标名的枪在厂门口挂了整整一年，那个工匠每天路过都要停下来看一眼，再接着去干活。"
 LYY_Event.11028.a:"兵器皆刻工匠之名"
 LYY_Event.11028.b:"兵器只标官厂之号"
 LYY_Event.11029.t:"五方通使"
 LYY_Event.11029.d:"五方使者第一次同席而坐，桌上摆着五份来路不同的文书。申鹤没有主持，只让人把茶续满，自己坐在一旁听。\n散会时，有一份文书被她留了下来，在末尾添了一行小字：五面旗，五条路，走不走得通，看往后这一年。那行字后来被她划掉了，没有人知道为什么。"
 LYY_Event.11029.a:"五方同席，各留一路"
 LYY_Event.11029.b:"择强而盟，速定大计"
 LYY_Event.11030.t:"雪台大议"
 LYY_Event.11030.d:"璃月已经立住，往后往哪走，却没有一个人说得清。申鹤把雪台的门敞开三日，谁都能上来讲。\n三日之后，纸堆了半人高，争论也没停。她看着这堆纸说：吵不完最好。吵完了，才是真没人敢开口了。那三天雪台上的灯一直亮到天明，最后一夜连巡山的人都上来听了半宿。"
 LYY_Event.11030.a:"开三日门，尽听其言"
 LYY_Event.11030.b:"择人而听，速定国是"
 LYY_Event.11031.t:"万仙之国"
 LYY_Event.11031.d:"万仙之国的方案是把修真立为国本，仙权高于一切尘世律令。反对的人说这样会寒了凡人的心。\n申鹤答：寒了心还能再暖，散了骨就再也拼不回来。她按下第一个印，纸角上留了一道浅浅的褶。那道褶子后来被压平收藏，成了绝云间档案里的第一件实物。"
 LYY_Event.11031.a:"立万仙之国，仙权至上"
 LYY_Event.11031.b:"仙凡并处，各安其位"
 LYY_Event.11032.t:"断尘"
 LYY_Event.11032.d:"断尘令颁下，入道者须与家世一刀两断。有人在关外跪了三日，只为见一个刚入道的儿子。\n申鹤立在关墙上看了很久，最后命人送去一车粮，却没有开门。她说：我可以救他，却不能让他学会跪在别人的关前。送粮的执事回来说，那人不肯收粮，只是把那包干粮放在了关门口，转身走了。"
 LYY_Event.11032.a:"行断尘令，绝其家世"
 LYY_Event.11032.b:"废断尘令，一体相容"
 LYY_Event.11033.t:"举国修真"
 LYY_Event.11033.d:"举国修真之下，学塾也讲丹方，衙门也设道席。申鹤不设官学正统，只在每处讲坛钉一块同样的木牌：说得通就听，说不通就散。\n她说：一个怕人议论的朝廷，早就没什么可议论的了。有先生把这块木牌拓下来收进书箱，多年后他的学生又照着拓了一份。"
 LYY_Event.11033.a:"举国修真，不禁异说"
 LYY_Event.11033.b:"定于一尊，罢黜杂议"
 LYY_Event.11034.t:"登仙之阶"
 LYY_Event.11034.d:"登仙之阶层层设卡，能走到底的人寥寥。有个少年走到中途便再上不去，坐在阶上哭。\n守阶的老修士递给他一壶酒，说：上不去的人我见了一辈子，他们后来大多下了山，也都活得好好的。路断了，斜着走也还是路。少年喝完酒，抹了把脸，转身下了阶，脚步比来时稳。"
 LYY_Event.11034.a:"设登仙之阶，明其路"
 LYY_Event.11034.b:"不设阶次，任其自修"
 LYY_Event.11035.t:"玄霜新廷"
 LYY_Event.11035.d:"玄霜新廷是绝云间第一次有了朝廷的样子，修士按品阶而立，律条刻在冰壁上。第一次开廷，殿堂冷得连回声都清脆。\n申鹤高居上座，看着这座近乎完美的殿堂，把一句话压进了心底：最像仙境的地方，往往最不像人间。她没有说出来，只把这句话记在了当日的廷议记录之外。"
 LYY_Event.11035.a:"立玄霜新廷，正名分"
 LYY_Event.11035.b:"维持旧制，不设虚廷"
 LYY_Event.11036.t:"举世寂然"
 LYY_Event.11036.d:"举世寂然。律令推到极处，连山下的城都比别处安静。\n申鹤独自立在最高处，听这彻底的静，忽然对着空无一人的山巅说了一句：帝君，我把这座山守成了一口井，井里没有风浪，也没有活水，可是井里干净。说完她自己也不知道，这是在对谁交代。"
 LYY_Event.11036.a:"举世寂然，守此一山"
 LYY_Event.11036.b:"重开山门，听人间声"
 LYY_Event.11037.t:"仙都"
 LYY_Event.11037.d:"仙都落成那天，全城不设庆典，只把律条拓印分发给每一户。申鹤对来贺的各山修士说：这里不叫京城，叫仙都，因为住在这里的人，头一件事是守律，第二件事才是吃饭。\n众人肃立，谁也没有先动。有个年纪最小的修士悄悄把拓片贴在了自己床头，一贴就是许多年。"
 LYY_Event.11037.a:"都曰仙都，律在食先"
 LYY_Event.11037.b:"仍称旧名，缓议其事"
 LYY_Event.11038.t:"半仙之治"
 LYY_Event.11038.d:"半仙之治把半仙与人族抬到肱骨的位置。申鹤说：纯仙太少，凡人太弱，能从两头都懂一点的，才是撑得住这座山的骨头。\n有人问她不怕半仙离心吗，她答：怕。可我更需要他们站着。这句话后来被半仙们私下传抄，抄本传到山下时，纸边已经磨得发毛。"
 LYY_Event.11038.a:"以半仙为骨，人族为辅"
 LYY_Event.11038.b:"独尊纯仙，不假外族"
 LYY_Event.11039.t:"人族议政"
 LYY_Event.11039.d:"人族议政让凡人第一次坐进了绝云间的议事之地。第一场会上，一个铁匠当众质问一位老仙，满堂无声。\n申鹤坐在最后排，没有出声，散会后却把那天的记录抄了一份留底，锁进了最厚的那个柜子。有幕僚问她为什么不表态，她说：我今天要是开了口，往后他们说话，就都要先看看我在不在。"
 LYY_Event.11039.a:"人族议政，人人可言"
 LYY_Event.11039.b:"限定资格，取有识者"
 LYY_Event.11040.t:"临海用兵"
 LYY_Event.11040.d:"临海用兵的命令下达那夜，申鹤在地图前站到天亮。第二天她只在令尾添了四个字：勿伤百姓。\n送出军令的手，比送出任何一份文书时都要慢。那四个字后来成了军中一条不成文的老规矩，每逢开战之前，总有老兵会先念一遍。"
 LYY_Event.11040.a:"临海用兵，勿伤百姓"
 LYY_Event.11040.b:"固守山界，不出一步"
 LYY_Event.11041.t:"半仙为骨"
 LYY_Event.11041.d:"半仙为骨，是把半仙编成军中最硬的几支。他们识得咒法，也懂得巷陌。\n申鹤检阅时对领队说：你们比仙更懂人，比人更懂仙，这份夹在两头的苦，往后就是你们的本事。领队行了个礼，没有说话。后来这支队伍伤亡最重，也极少有人退。"
 LYY_Event.11041.a:"编半仙为骨，委以重任"
 LYY_Event.11041.b:"另择纯仙，不使杂血"
 LYY_Event.11042.t:"雪原帝业"
 LYY_Event.11042.d:"雪原帝业把绝云间的目光从一座山推到整个璃月，再推到所有被魔物侵扰的角落。\n有旧人劝她守好绝云间就够了，她答：我下山之后才明白，山下的每一处人间都是这座山的延伸，他们灭了，我这山也就没了意义。说这话时她正站在山脊上，风把她的衣袖吹得笔直。"
 LYY_Event.11042.a:"雪原帝业，普天之下"
 LYY_Event.11042.b:"收缩防线，只保绝云"
 LYY_Event.11043.t:"血税"
 LYY_Event.11043.d:"血税是把凡人的丁口与半仙的血脉一并计入国用。申鹤不觉得这有什么可耻。\n她直言：云端的清净从不是凭空来的，想借一座山挡住乱世的风雨，就得先为这座山供上足够的血与粮。账房听了，默默添了一页新册。那一页上的数字，比哪一页都密。"
 LYY_Event.11043.a:"行血税，计入国用"
 LYY_Event.11043.b:"缓其征调，以宽民力"
 LYY_Event.11044.t:"帝峰"
 LYY_Event.11044.d:"帝峰之名第一次挂上绝云间最高的那道山脊时，没有人欢呼。\n申鹤站在峰顶，看着脚下这片用雪与血换来的土地，忽然想起自己刚下山时说过的那句话。她没有回头，只把披风裹紧了一些，站到风停。下山时天已经黑了，随行的人看清她的脸，却什么也没问。"
 LYY_Event.11044.a:"立帝峰之名，昭示四方"
 LYY_Event.11044.b:"不言名号，行胜于言"
 LYY_Event.11045.t:"半仙天帝"
 LYY_Event.11045.d:"半仙天帝四个字刻上仙都城头那天，申鹤在城门前站了很久。她没有讲应许，只对身旁人说：我这一生大概只做成了一件事，让这座山不必再看任何人的脸色。\n说完，她转身走进了那座没有神位的殿，门在身后合上，声音很轻。城里没有鼓乐，只有一阵风卷着雪，从城头吹到城尾。"
 LYY_Event.11045.a:"即半仙天帝之位"
 LYY_Event.11045.b:"留一分退路，以备转圜"
 LYY_Event.11046.t:"雪覆璃月"
 LYY_Event.11046.d:"雪覆璃月。当最后一片战后的废墟被清理干净，申鹤一个人走遍了全城。\n她走到码头，走到学塾，走到那座没有神位的殿，把一路看见的都记了下来。她在册末写道：这就是我们换来的东西，好不好，都由我们自己担着。写完这些字，天已经黑了，城里的灯却一盏盏亮了起来。"
 LYY_Event.11046.a:"就此向前，记下这一切"
 LYY_Event.11046.b:"停下脚步，清算所有"
 LYY_Event.11047.t:"绝云新律"
 LYY_Event.11047.d:"绝云新律把三年来的敕令、判例、军规汇成一部律书。申鹤亲笔写下第一篇，只有一句：绝云之律，护生，不护人。\n写完后她搁笔很久，说：最难的是往后连我自己，也得先低下头来认它。这部律书后来被拓了无数份，发到每一个里坊，也发到每一个守山的营帐。"
 LYY_Event.11047.a:"颁新律，连我亦受其制"
 LYY_Event.11047.b:"暂缓立法，因人而断"
 LYY_Event.11048.t:"空椅"
 LYY_Event.11048.d:"仙殿的最深处，始终留着三张空椅。有人劝申鹤把它们收起来，她没有应。\n她说：留着它们，是为了让每一个坐上这把椅子的人，进门时都得先看一眼，自己是不是坐得太稳了。此后几乎没有人敢直视那三张椅子，连打扫的人进门，脚步都会放轻。"
 LYY_Event.11048.a:"留三张空椅，以自省"
 LYY_Event.11048.b:"收起空椅，另立共主"
 LYY_Event.11049.t:"仙座"
 LYY_Event.11049.d:"仙座是一张不称王的椅子，坐上去的人只称执律者。申鹤把律条刻在椅背上。\n她说：这张椅子是给所有抬不起头的人看的，让他们知道，这世上还有一样东西，比他们自己的苦难更高。此后每逢决断大事，她都要先在这张空椅前站上一会儿，再落座。"
 LYY_Event.11049.a:"设仙座，刻律于椅背"
 LYY_Event.11049.b:"不设虚座，各归其山"
 LYY_Event.11050.t:"璃月归一"
 LYY_Event.11050.d:"璃月归一的旗升上了所有城头，也升上了那些曾经属于别的旗的地方。\n申鹤在内战结束的旧址上立了一块无字碑。有人问她为何不刻功绩，她说：刻满了，后人就没地方写了。碑立在那里许多年，风吹日晒，始终空着，却也始终有人前来，站一会儿再走。"
 LYY_Event.11050.a:"刻无字碑，留给后人"
 LYY_Event.11050.b:"勒石记功，昭示千秋"
 LYY_Event.11051.t:"北国赠刃"
 LYY_Event.11051.d:"至冬送来一柄好剑，申鹤收下了，却从不拔。她把它悬在山门的另一侧，与本命剑遥遥相对。\n有人不解为何留一把敌国的剑，她答：留着它，是让每一个进出山门的人日日记着，这世上还有另一条路，安静地等着被选。那把剑在门上挂了很多年，剑鞘上落了雪，也没人替它擦。"
 LYY_Event.11051.a:"悬北国之刃于山门"
 LYY_Event.11051.b:"毁其剑，绝其念"
 LYY_Event.11052.t:"层岩守望"
 LYY_Event.11052.d:"层岩的裂缝不会因为人怕它就变小，却会因为有人守着它而暂时睡一会儿。守夜人一代轮过一代，从没有人见过尽头。\n有个新来的守夜人问执事：我们在守什么？执事答：守着一个连你自己都不该知道的东西。这，就是你还能活着守在这里的原因。新来的没有再问，只是把火堆拨旺了一些。"
 LYY_Event.11052.a:"守层岩深渊，世代不辍"
 LYY_Event.11052.b:"封锁消息，任其沉睡"
 LYY_Event.11053.t:"半仙之负"
 LYY_Event.11053.d:"夜深人静时，申鹤偶尔会想起断尘令下那些被清出山门的面孔，也会想起自己身上流着两重血。\n她独自坐到天明，问自己一个始终没有答案的问题：我判他们的那一天，是不是也在判某一刻的我自己。天亮时她起身，山风把她的衣袖吹起，露出手腕上一道极旧的伤疤，那是她年少时亲手划下的。"
 LYY_Event.11053.a:"直面半仙之负，寻其解"
 LYY_Event.11053.b:"压下疑问，只论功业"
 LYY_Event.11054.t:"北地之剑"
 LYY_Event.11054.d:"至冬的执行官说：你有剑，我有铁与钱，何不联手，把这乱世替天理一遍。\n申鹤把盟书在雪地里烧了，只留一句：我的剑不替任何人挥，除了这座山要它挥的方向。执行官看着那堆灰烬，忽然笑了：你是我见过，最难谈的对手。申鹤答：多谢。请用茶。"
 LYY_Event.11054.a:"烧盟书，拒北来之剑"
 LYY_Event.11054.b:"接受盟约，结好至冬"
 LYY_Event.11055.t:"万仙来朝"
 LYY_Event.11055.d:"万仙来朝，是绝云间最盛大的时刻，也最令人不安。四方修士、山下义军，乃至几个心怀鬼胎的旧敌，都举旗而来。\n申鹤站在高台上，望着这片人海，对身边人说：人聚得越多，就越像一场潮水。潮水能载舟，也能覆舟。我要的从来是堤坝。说完她转身下台，身后的欢呼声，她一句也没接。"
 LYY_Event.11055.a:"以万仙为朝，早筑堤坝"
 LYY_Event.11055.b:"听其自然，各归其山"
 LYY_Event.11056.t:"新律颁行"
 LYY_Event.11056.d:"新律颁行那天，申鹤把全文念到了最后一句。台下有各山修士，有半仙，也有从内战里活下来、至今还带着伤的人。\n念完她停了停，说：从今天起，我也是一个可以被律条换下来的人。台下先是一静，随即响起的掌声里，有一种很陌生的东西，那是一种终于可以放心了的松弛。"
 LYY_Event.11056.a:"律在食先，我亦受制"
 LYY_Event.11056.b:"权柄暂握，待时还政"

 SHP_Spirit_Ascendant_Order:"仙朝新律"
 SHP_Spirit_Ascendant_Order_desc:"一只离群的鹤从云端降下，要在人间立一根不弯的梁骨。它不举任何一方的旗，却比任何一方的旗都更难撼动。"
 SHP_Spirit_Ascetic_Reform:"清修改制"
 SHP_Spirit_Ascetic_Reform_desc:"食有节，役有期，赏罚不问出身。这套戒律原本只在山里通行，如今被推到了整座璃月，连衙门的钟点都要按它来敲。"
 SHP_Spirit_Frost_Coin:"铸霜之钱"
 SHP_Spirit_Frost_Coin_desc:"钱的一面是鹤，一面是律。钱上有字，花出去的时候，也就看得见规矩。有人嫌它沉，绝云间要的正是这份沉。"
 SHP_Spirit_Peak_Arsenal:"峰间兵工"
 SHP_Spirit_Peak_Arsenal_desc:"每一件出厂的兵器都刻着工匠的名字。有人认领的刀，才不会随便出鞘；有人署名的手艺，也才不会随便马虎。"
 SHP_Spirit_Five_Banners:"五方通使"
 SHP_Spirit_Five_Banners_desc:"五面旗，五次试探，五条通向不同未来的路。绝云间未必肯低头，却终于肯先开口，这已经是它最大的一次让步。"
 SHP_Spirit_Abyss_Ward:"镇渊之约"
 SHP_Spirit_Abyss_Ward_desc:"深渊是一笔按月要还的旧债。绝云间每年从账上划走的那一笔，买的是井下人活到明天的机会。"
 SHP_Spirit_Adepti_Throne:"仙座"
 SHP_Spirit_Adepti_Throne_desc:"一张不称王的椅子，坐上去的人只称执律者。椅背上刻着律条，是给所有抬不起头的人看的，让他们知道世上还有更高的东西。"
 SHP_Spirit_Frost_Host:"霜军"
 SHP_Spirit_Frost_Host_desc:"这支队伍不用旗号，只用一道袖口的白线认人。规矩只有两条：出剑之前先把心定住，收剑之后把地上扫干净。"
 SHP_Spirit_Snow_Legion:"雪原军团"
 SHP_Spirit_Snow_Legion_desc:"常年屯在最高的隘口，轮换期短，饷给得足。她要的是一支还记得天光长什么样的军队，不是一支习惯黑暗的军队。"
 SHP_Spirit_Frost_Court_PW:"玄霜新廷"
 SHP_Spirit_Frost_Court_PW_desc:"修士按品阶而立，律条刻在冰壁上。这是一座冷得连回声都清脆的殿堂，也是绝云间第一次有了朝廷的样子。"
 SHP_Spirit_Never_Melting_PW:"万载不化"
 SHP_Spirit_Never_Melting_PW_desc:"雪会化，人会散，只有立在山巅的规矩，要它一千年也不化。这份执念既是绝云间的脊梁，也是它的棺椁。"
 SHP_Spirit_Imperial_Peak:"帝峰"
 SHP_Spirit_Imperial_Peak_desc:"帝峰的名号挂上最高的山脊时，没有人欢呼。山下的每一处人间都是这座山的延伸，他们灭了，这山也就没了意义。"
 SHP_Spirit_Half_Immortal_Emperor:"半仙天帝"
 SHP_Spirit_Half_Immortal_Emperor_desc:"半仙与人族被抬到肱骨的位置。她能镇住尘缘，也能驯服雪山，只是这两样东西，哪一个都不肯真正低头。"
 SHP_Spirit_New_Law:"绝云新律"
 SHP_Spirit_New_Law_desc:"律书的第一篇只有一句：绝云之律，护生，不护人。写下它的人清楚，从今往后连她自己，也得先低头认它。"

 SHP_Cultivation_Tier_1:"清修等级"
 SHP_Cultivation_Tier_1_desc:"戒律废弛，山门蒙尘，仙众离心。路过的风都敢在绝云间的檐角下打旋，没谁再把这座山当一回事。"
 SHP_Cultivation_Tier_2:"清修等级"
 SHP_Cultivation_Tier_2_desc:"清修初立，赏罚有据，上下有序。规矩立起来了，只是执行的时候，还留着几分人情。"
 SHP_Cultivation_Tier_3:"清修等级"
 SHP_Cultivation_Tier_3_desc:"清修有成，令行禁止，山门如铁。修士们行动如一人，冰冷，却可靠，山下的人也开始照着学。"
 SHP_Cultivation_Tier_4:"清修等级"
 SHP_Cultivation_Tier_4_desc:"清修严整，律条如刀，不问情由。犯忌者无所遁形，而敢于通融的人，也一个接一个地不见了。"
 SHP_Cultivation_Tier_5:"清修等级"
 SHP_Cultivation_Tier_5_desc:"清修如冰，行止坐卧，皆有定数。极端的秩序守住了绝云间的纯粹，也可能在不经意间，锁住了它伸向人间的最后一只手。"
 SHP_Mortal_Tier_1:"尘缘等级"
 SHP_Mortal_Tier_1_desc:"尘缘断绝，山外无人应声，邮袋里除了自家的公文，再没有别的东西。断得干净，也冷得彻底。"
 SHP_Mortal_Tier_2:"尘缘等级"
 SHP_Mortal_Tier_2_desc:"尘缘初通，有几家使节上了门，谈的多半还是试探。互相递茶，谁也不肯先交底。"
 SHP_Mortal_Tier_3:"尘缘等级"
 SHP_Mortal_Tier_3_desc:"尘缘渐广，挂绝云间印记的车队又出现在了远方的关市。别人开始记得，这座山上还有人会讲道理。"
 SHP_Mortal_Tier_4:"尘缘等级"
 SHP_Mortal_Tier_4_desc:"尘缘鼎盛，绝云间成了这一带绕不开的一方。合约要它签，争端要它裁，风头之下，也藏着看不见的算计。"
 SHP_Mortal_Tier_5:"尘缘等级"
 SHP_Mortal_Tier_5_desc:"尘缘滔滔，山上的人开始用别处的规矩算自家的账。名声走得比粮食快，早晚要回头补票。"
 SHP_PWCombo_Both_High:"仙凡同光"
 SHP_PWCombo_Both_High_desc:"山里有律，山外有理，绝云间头一回把雪与尘摆在了一张桌上。秩序立住了，可立秩序的这只手，也被人看见了。"
 SHP_PWCombo_Both_Low:"雪散人空"
 SHP_PWCombo_Both_Low_desc:"戒律守不住，人心也留不住。山上的钟照旧在敲，敲完之后，山下没有一个人抬头。"
 SHP_PWCombo_A_High:"闭山自守"
 SHP_PWCombo_A_High_desc:"山里冷得干净，谁也进不来。清修守到极处，连风都学会了绕道走，只是山下的信使，一年比一年少。"
 SHP_PWCombo_B_High:"入世为帝"
 SHP_PWCombo_B_High_desc:"绝云间的手伸得很远，铁与粮都管够了。山上的戒律却松了，守山的执律者开始在酒席上谈生意。"

 #################### 公子 · 至冬干涉军（YLH） ####################
 YLH_CivilWar_Childe:"公子临海"
 YLH_CivilWar_Childe_desc:"璃月内战的消息传到云来海时，达达利亚正在甲板上练枪。他收枪，望着南方那片被战火烧红的天空，忽然笑了。他说：这才是好戏。对一个天生的斗士而言，乱世是舞台，可对一个恰好在至冬任职的斗士而言，乱世还是一次无可推拒的机会。他给女皇写了一封信，只有一行字：请给我一支舰队，我还你一座会下金蛋的港口。"
 YLH_The_Frozen_Order:"雪原军令"
 YLH_The_Frozen_Order_desc:"雪原军令一下，云来海的气氛就变了。操练的锣声从清晨响到黄昏，甲板上的水手走路都带上了节奏。达达利亚说：我不指望每一个人都热爱战争，我只要求一件事，当命令下达时，没有人需要先想一想，再动。战场上慢半拍，就是替对手收尸。"
 YLH_Muster_the_Mercenaries:"募佣成军"
 YLH_Muster_the_Mercenaries_desc:"募兵旗在四座码头同时挂起，赏格高得让路过的渔民都动了心。达达利亚亲自坐镇选兵，不看家世，只看两样：敢不敢在黑夜里独自上桅，肯不肯把昨天的赏钱，押在今天的豪赌上。他说：雇佣兵不是最好的兵，但是最诚实的兵，他们的忠诚明码标价，省得我去猜。"
 YLH_The_Northern_Arsenal:"北国军械"
 YLH_The_Northern_Arsenal_desc:"至冬的军械船一艘接一艘地靠港，卸下的木箱在码头堆成了一座小山。箱子上印着北国的霜纹，也印着一行小字：货到付款。达达利亚抚着新出鞘的枪尖说：世上最可靠的盟友，是欠了你钱的盟友，你既舍不得他倒下，也不担心他突然反手。"
 YLH_Blood_and_Snow:"血与雪"
 YLH_Blood_and_Snow_desc:"血与雪，是至冬军人的两样本能。达达利亚把新招募的兵拉去雪线之上操演，冻得他们牙齿打颤，却在最后操演结束的那一夜，亲手给每一个人倒了一碗烈酒。他说：我先让你们恨我，再让你们信我。一支恨，也信的军队，才是真的军队。"
 YLH_The_Grey_Captains:"灰袍船长"
 YLH_The_Grey_Captains_desc:"灰袍船长们聚在云来海最深的一间舱室里，只有一盏灯。他们是至冬在璃月沿海经营了十几年的旧人，走私、护航、收债，什么营生都沾过手。达达利亚给他们斟酒，说：你们比我懂这片海，所以，从今往后，这片海怎么走，我先听你们的。"
 YLH_Lease_the_Harbor:"租借港口"
 YLH_Lease_the_Harbor_desc:"租借港口是一份写得极美的合约：期限九十九年，租金一次性付清，条款客气得像一桩婚约。达达利亚在中秋的灯笼下签完字，对身边的副官说：你说璃月人是聪明人吗？当然聪明。可再聪明的人，也挡不住一件事，饿。我给它饭，它就得把自己的码头，一格一格地租给我。"
 YLH_Wage_Contract_War:"契约战争"
 YLH_Wage_Contract_War_desc:"契约战争，是把战争做成一门清清楚楚的生意。雇佣、赏格、抚恤、违约，条款一条不少，全写在黑字上。达达利亚说：有人说我冷血，可我倒觉得，这世上最热的血，恰恰是那些从不谈钱、只谈情怀的将军身上流出来的，他们的兵，最后往往连一副薄棺都没有。"
 YLH_The_Iron_Quota:"铁额"
 YLH_The_Iron_Quota_desc:"铁额是一条冷冰冰的规矩：交够铁，就放过你的村子；交不够，就不必再谈。达达利亚不觉得这有什么可耻。他说：慈悲是要钱的，而我不是来做慈善的。我能给的公平，只有一种，同样的价钱，同样的命。谁出得起，谁就活得下去。"
 YLH_Blockade_the_Port:"封锁璃月港"
 YLH_Blockade_the_Port_desc:"封锁璃月港的命令下达时，海面上正起着大雾。六十艘船无声地横陈在航道上，像一圈合拢的铁环。达达利亚立在旗舰船头，望着雾里那座模糊的城市，说：我不攻它，我只是让它的钱，出不去，也进不来。一座被饿着的城，比一座被烧着的城，更容易学会听话。"
 YLH_The_Salt_Ledger:"盐账"
 YLH_The_Salt_Ledger_desc:"盐账上记着这门生意要紧的一笔：谁在什么时候，需要多少盐。掌握了盐，就掌握了这座港口的心跳。达达利亚翻着账本说：人们总以为军队靠刀剑征服城市，真正征服一座城的，是让它发现，自己连煮饭的东西，都得来求你。"
 YLH_Officers_of_the_North:"北国军官"
 YLH_Officers_of_the_North_desc:"北国军官团抵达云来海那天，达达利亚亲自到码头迎接。这些人大多出身至冬的军校，规矩严明，不苟言笑。他敬过酒，说：我知道你们看不起雇佣兵，也看不起我这种半路出家的执行官。没关系，仗打完那天，谁活着，谁就配得上这份看不起。"
 YLH_The_Winter_Drill:"雪原操演"
 YLH_The_Winter_Drill_desc:"雪原操演，是把人硬生生磨成一件兵器。冻伤、旧伤、沉默，是操演结束时的三样标配。达达利亚立在雪里看完全程，最后说了一句：你们恨我，我懂；但等你们真正上了战场，会感谢我，因为战场上最不值钱的，就是眼泪；最值钱的，是活着。"
 YLH_Caravan_Tolls:"商道抽成"
 YLH_Caravan_Tolls_desc:"商道抽成，是至冬最温柔的一把刀。它不砍人，只砍利润；不封路，只是让每走一步，都要先算一算会不会亏本。达达利亚说：我不怕商人讨厌我，我怕的是他们不再做生意，一个不肯做买卖的港口，才是我真正的敌人。"
 YLH_The_Queens_Word:"女皇敕令"
 YLH_The_Queens_Word_desc:"女皇的敕令终于来了，短短几行字，把云来海的事务，尽数交托。达达利亚捧着那封信，在甲板上站了很久。他当然知道，这封敕令里既有信任，也有试探，女皇要看的是，这个爱笑的执行官，是替至冬开疆，还是替自己圆梦。他收起信，对副官说：准备开战。"
 YLH_The_Proxy_Pact:"代理之约"
 YLH_The_Proxy_Pact_desc:"代理之约的精髓，在代理二字。至冬不出面统治，只扶一个听话的衙门，替它收税、替它镇民、替它背骂名。达达利亚说：直接统治太贵了，也太显眼了。让璃月人管璃月人，我在后面数钱，这才叫体面的胜利。"
 YLH_A_Puppet_Council:"立傀儡厅"
 YLH_A_Puppet_Council_desc:"傀儡议事厅的第一次会议开得很体面：礼乐齐备，流程周全，连反对派都请了几个来坐。达达利亚坐在旁听席上，全程一言不发。散会后他说：最像样子的议会，往往是最不管用的议会，因为它把吵架当成了政治，而我只要结果。"
 YLH_The_Invisible_Hand:"看不见的手"
 YLH_The_Invisible_Hand_desc:"看不见的手，从不直接下令。它只是让某几笔货款迟了三天、某几条航路贵了半成，然后等各方自己想明白该站哪边。达达利亚说：最高明的统治，是让对方以为自己做了选择，他从头到尾，都只在你铺好的路里走路。"
 YLH_Trade_Not_Conquest:"以商代战"
 YLH_Trade_Not_Conquest_desc:"以商代战，是至冬兵法里最省的一条。达达利亚放弃了正面攻城，转而把整座港口喂成一个离不开他的胖子。他说：用刀征服一座城，你得守它一辈子；用钱征服一座城，它会自己替你守。这是女皇教我的，她比谁都懂，什么叫不流血的胜利。"
 YLH_Friendly_Regiments:"至冬友军"
 YLH_Friendly_Regiments_desc:"友军听起来很暖和，编制上却分得清清楚楚：至冬出枪出饷，璃月出人出命。达达利亚检阅这支队伍时，对一个璃月籍的连长说：你替谁打仗，我不在乎。我在乎的只有一件事，等你哪天想通了自己是在替谁流血，别恨我就行。"
 YLH_Quiet_Coercion:"静默胁迫"
 YLH_Quiet_Coercion_desc:"静默胁迫，是没有硝烟的围城。达达利亚从不威胁谁，只是让不肯合作的人，在不知不觉中失去货源、失去航线、失去靠山。他说：最干净的镇压，是让对方到死都想不通，是谁动的手，因为他确实找不出一个具体的敌人。"
 YLH_The_Commissions_Gaze:"委员会的目光"
 YLH_The_Commissions_Gaze_desc:"愚人众委员会的目光，从来不曾真正离开过云来海。达达利亚心里清楚，自己在这座港口攫取的每一分利益，都有人在北国那边，一笔一笔地记着。他并不反感这种注视，相反，他感谢它：正是这份注视，让他在乱世里，始终不敢彻底放纵。"
 YLH_The_Silk_and_the_Chain:"丝与链"
 YLH_The_Silk_and_the_Chain_desc:"丝与链，是同一件东西的两面。璃月港的丝绸越卖越远，也就越离不开至冬的航路；而每一条航路，都是一根看不见的链。达达利亚说：你瞧，我从没想过要捆住谁，我只是让所有人都发现，日子过着过着，就把自己，过进了我的绳里。"
 YLH_A_Governor_in_Name:"名义总督"
 YLH_A_Governor_in_Name_desc:"名义总督坐在原本属于七星的位置上，印章是真的，权力是真的，主人却不是。达达利亚偶尔会来看他议事，看这个提线木偶认真地扮演一位统治者，然后转身离开，什么也不说。他知道，真正让他不安的，从来是那个躲在幕后、开始觉得自己也是主人的傀儡自己。"
 YLH_The_Golden_Tributary:"黄金贡道"
 YLH_The_Golden_Tributary_desc:"黄金贡道，是云来海一年里最忙碌的一季。货船排成长龙，从璃月港一直排到看不见的海平线，桨声与号子声日夜不绝。达达利亚立在灯塔上看着这条金色的河，忽然想：这些船上没有一面旗是他的，可它们驶向的每一个方向，都有他的名字。"
 YLH_The_Clean_Hands:"干净的手"
 YLH_The_Clean_Hands_desc:"干净的手，是达达利亚最引以为傲的东西。他从不亲手杀人，从不写下具体的恶，所有的脏活都经过一层又一层的转手。他说：我这一生，最擅长的是让别人替我战斗，然后我自己，还能在灯火通明的宴会厅里，笑着敬所有人一杯。"
 YLH_A_Smile_and_a_Dagger:"笑与刃"
 YLH_A_Smile_and_a_Dagger_desc:"笑与刃，从来是同一套动作的两半步。达达利亚可以在觥筹交错间与人称兄道弟，也可以在同一个夜里，签字调走那人的全部家产。有人问他会不会良心不安，他答：会。但我不让那点不安，妨碍我做完该做的事，这是一个成年人对自己，最后的诚实。"
 YLH_The_Order_of_Profit:"利润之序"
 YLH_The_Order_of_Profit_desc:"利润之序，是至冬给这片土地设计的蓝图：不讲血统，不讲乡愁，只讲一笔买卖能不能算得过账。达达利亚说：我知道你们嫌它冷，可冷有冷的好处，它不认人，也不认仇，你只要出得起价，它就给得起位。这世上有比这更公平的东西吗？"
 YLH_The_Last_Envelope:"最后一封密函"
 YLH_The_Last_Envelope_desc:"最后一封密函，装的是至冬给璃月的最终条件：不必称臣，不必易帜，只需把港口、航路与盐铁，写进一纸长期的租约。达达利亚在信末亲手添了一行：我给你们的是一条能活下去的路，尽管它确实通向我。写完，他把信封口，交给了那个连夜赶来的使者。"
 YLH_Peace_With_Profit:"有利之和平"
 YLH_Peace_With_Profit_desc:"有利之和平，是达达利亚给自己这条路起的名字。他不占领、不称王，只让云来海成为一座至冬永远不会输的赌桌。有人问他这算不算背叛女皇的野心，他笑答：野心从来不必写在旗上。真正赢到最后的，往往是那个坐在牌桌边、从头到尾只收抽成的庄家。"
 YLH_Claim_the_Sovereignty:"索求主权"
 YLH_Claim_the_Sovereignty_desc:"索求主权，是把一切伪装都撕下来的那一刻。达达利亚站上港口最高的旗杆，亲手把至冬的鹰旗升起。他说：我玩够了代理的游戏。代理想来想去，总要问一问自己替谁做事，我不喜欢这个问题，我更喜欢的答案是：替我自己。"
 YLH_The_Annexation_Decree:"并吞敕令"
 YLH_The_Annexation_Decree_desc:"并吞敕令颁下的那天，云来海的海水，颜色比往常更深。达达利亚没有宣布胜利，只下了一道命令：所有璃月商号的旗帜，一律降下。他说：我知道这会让很多人恨我。没关系，恨是暂时的，等到他们的孩子长大，会习惯这片海上的新旗帜，就像习惯潮汐。"
 YLH_Total_Blockade:"彻底封锁"
 YLH_Total_Blockade_desc:"彻底封锁，是把最后一点余地也抹去。航道、渔场、港口，全部封闭，连一只飞鸟也别想越过。达达利亚说：仁慈是一种奢侈，而一支部队到了这一步，奢侈不起。要么现在狠到底，要么将来，被那些你今天放走的人，狠回来。"
 YLH_The_Army_of_the_Dream:"梦想之军"
 YLH_The_Army_of_the_Dream_desc:"梦想之军，是至冬在璃月最精锐的一支力量，装备精良，士气高昂，每人都领着一份足够全家安稳度日的军饷。达达利亚检阅时却说了一句让所有人意外的话：你们为钱而来，这很好。但我要你们记住，钱买不来勇气，钱只买来一个不必为别的借口送死的理由。"
 YLH_Burn_the_Ledgers:"焚册"
 YLH_Burn_the_Ledgers_desc:"焚册，是占领者最熟练也最残忍的一课。璃月子民记了两百年的地契、税簿、户籍，一夜之间化为灰烬。达达利亚看着火光，说：一张纸烧起来，只值几文钱；可烧掉的这些纸，值一座城。人们最深的恐惧，从来是失去能证明财产存在过的东西。"
 YLH_First_Blood_on_the_Water:"血溅于水"
 YLH_First_Blood_on_the_Water_desc:"血溅于水，是这场占领真正越过了那条线的时刻。港口外的海面上，第一次浮起了一层淡淡的红。达达利亚立在舰桥上，望着那片水面，沉默了很久。他没有像往常一样说笑，只对副官说了一句：把今天死的人的名字都记下来。以后，会有人来问的。"
 YLH_The_Cold_Governor:"冷面总督"
 YLH_The_Cold_Governor_desc:"冷面总督是一种姿态：不亲民、不解释、只下命令。达达利亚发现，璃月人似乎更服从一张没有表情的脸。他说：人有时候很奇怪，你对他们好，他们会讨价还价；你对他们冷，他们反倒把规矩记得清清楚楚。"
 YLH_The_Garrisons:"驻军"
 YLH_The_Garrisons_desc:"驻军是把统治钉死在地上的钉子。要塞、哨所、巡逻队，一层一层铺满全境。达达利亚说：我从不指望靠一支军队统治一个国家；但我可以靠一支军队，让任何一个想反抗的人，在动手之前，先算清楚自己有几条命。"
 YLH_The_Sea_of_Fire:"火海"
 YLH_The_Sea_of_Fire_desc:"火海，是占领者最不计后果的一次出手。为了肃清抵抗，他们烧掉了整片港湾的渔船与仓房，火光照亮了半个夜空。达达利亚站在拒马后面看着这一切，忽然问身边的副官：你说，烧掉的东西越多，剩下的东西，是不是就越值钱？副官愣住了，他没敢回答，也不知道该怎么回答。"
 YLH_The_Sovereign_Harbor:"主权港"
 YLH_The_Sovereign_Harbor_desc:"主权港，是至冬在璃月的统治真正落地成形的样子：码头插满北国旗帜，税关换上了至冬的纹章，连告示牌上的字，都先写至冬文，再写璃月文。达达利亚走过这一切时，脚步很稳。他想：这就是胜利的样子，安静、整齐、有条不紊，没有一丝想象中该有的光。"
 YLH_The_Northern_Fist:"北国之拳"
 YLH_The_Northern_Fist_desc:"北国之拳，是至冬留在这片土地上的最终常备武力。它不再需要战斗，只需要存在，它的存在本身就是威慑。达达利亚检阅这支部队时说：我这一生打过许多仗，可我渐渐明白，最成功的军队，是那种从来没有机会展示武力的军队。"
 YLH_The_Throne_of_Ice:"冰之座"
 YLH_The_Throne_of_Ice_desc:"冰之座，是达达利亚在璃月为自己立的终点。他高居其上，脚下是一座已经彻底臣服的港口。加冕那天，他穿着至冬的礼服，坐在冰雕的座椅上，接受四方朝拜，可当乐声停下的那一刻，他忽然感到一阵熟悉的、战斗开始前的空。原来站在这里，并不比站在甲板上更让人踏实。"
 YLH_The_Winter_Sovereign:"冬之主权"
 YLH_The_Winter_Sovereign_desc:"冬之主权，是这条路走到最后的模样：璃月不再被称作璃月，它只是至冬版图上一块带着暖意的南方领地。达达利亚掌着这片土地，却发现自己越来越常梦见北方，梦见冰、梦见雪、梦见当年那个在雪原里，第一次握起枪的少年。他醒来时，总要在黑暗中坐很久。"
 YLH_The_Kids_Game:"孩童的游戏"
 YLH_The_Kids_Game_desc:"孩童的游戏，是达达利亚难得允许自己放松的时刻。他在港口临时拼出一片空地，让难民的孩子滚铁环、跳格子，自己在旁边看得津津有味。有个孩子怯生生地问他：你是坏人吗？他笑着答：我也不太清楚。不如等你长大了，自己来判断，至少那时候，你还得活着，才能判断。"
 YLH_The_Chasm_Smugglers:"巨渊走私"
 YLH_The_Chasm_Smugglers_desc:"巨渊走私，是一条连至冬公文里都不敢明写的黑色航线。矿料、旧物、甚至人口，被一批批地从层岩深处运出。达达利亚睁一只眼闭一只眼，只收了一道固定的抽成。他说：打仗讲究纪律，可管制一个国家，得给那些胆大的人，留一条活路，不然他们会去找别的活路，而那往往更麻烦。"
 YLH_The_Mast_of_the_Fleet:"舰队桅顶"
 YLH_The_Mast_of_the_Fleet_desc:"舰队桅顶，是云来海最高的地方。达达利亚常独自攀到那里，一坐就是半日。从这里望去，整座港口像一盘摊开的棋，海面平静得能照出云的影子。他想：站在这么高的地方，本该看得更远，可为什么，我看到的，反而只有这些船、这些货、这些永远收不完的账。"
 YLH_The_Letter_from_Home:"家书"
 YLH_The_Letter_from_Home_desc:"家书是从遥远的北国辗转来的，写信的是他年幼的弟弟妹妹。信里画着歪歪扭扭的房子，写着「哥哥什么时候回家」。达达利亚把信读了一遍又一遍，最后折好，收进贴身的衣袋里。他对副官说：你先出去，我想一个人待一会儿。那天，他在舱里坐到了天亮。"
 YLH_The_Blood_Price:"血酬"
 YLH_The_Blood_Price_desc:"血酬，是云来海三年战事最终摊开的一本总账：死了多少人、花了多少钱、换来了多少土地与航道。达达利亚逐行看完，没有说话。良久，他对账房说：把那些数字，单独抄一份给我。我想看看，我们用多少条命，买下了这一片海。"
 YLH_Reunify_Liyue:"接管璃月"
 YLH_Reunify_Liyue_desc:"接管璃月那天，至冬的旗帜升上了璃月港最高的一根旗杆。达达利亚站在旗下，俯瞰着这座他花了数年征服的城市，忽然没有了想象中的得意。他想起了刚来时的那个黄昏，想起了那个跪在关外求他一车粮的老人，想起了自己说过的那句话，我只是比你们更清楚，慈悲救不了一座将倾的山。他闭上眼，很久。再睁开时，海风依旧，旗帜依旧，只是他忽然很想回北方了。"
 YLH_The_Sea_Wolves:"海狼"
 YLH_The_Sea_Wolves_desc:"海狼是云来海最不受管束的一群人：他们不列编制，不穿制服，只在夜里出没，专挑最难缠的航线下手。达达利亚从不承认自己和海狼有任何关系，可每逢要紧的关口，那几艘幽灵般的快船，总会恰到好处地出现。他说：正规军是用来打明仗的，海狼是用来告诉所有人，这片海，白天归我，夜里，也归我。"
 YLH_The_Shadow_Exports:"影子出口"
 YLH_The_Shadow_Exports_desc:"影子出口是一条不写在任何公文上的航线：璃月的丝绸、盐铁、旧物，从这条线上悄悄流向北国，换回的是更北边的东西。达达利亚对这条线上的每一笔买卖都了如指掌，却从不在任何文书上留下自己的名字。他说：明面上的贸易是给女皇看的，这条线上的，才是给这座港口留的，一个连影子都没有的地方，才装得下不肯见光的东西。"
 YLH_The_Second_Fleet:"第二舰队"
 YLH_The_Second_Fleet_desc:"第二舰队从来不在任何人的名单上。它由剩下的船、剩下的兵、剩下的野心拼凑而成，停泊在所有人都以为早已废弃的荒港里。达达利亚亲自去看过一次，回来时只说了一句话：没有名字的舰队，才是真正能派上用场的舰队，因为它不欠任何人一个交代，也就不必，等任何人的命令。"

 YLH_civilwar_category:"云来海运"
 YLH_civilwar_category_desc:"公子 · 北国线的内战决议组。以两轴机制衡量对外借力与自保之间的权衡，每一次决议都会改变当前等级。公子游走于各方之间，图的从来都是实利，从不做亏本的买卖，也从不把话说死。哪边给得起价码，他便往哪边多走两步。"
 YLH_decision_naval_drill:"海上操演"
 YLH_decision_naval_drill_desc:"海上操演从不讲情面：掉进水里没人捞，跟不上队就留在岸上。达达利亚说：我不是在教他们游泳，我是在教他们一件事，在海上，指望别人来救你，就是找死。"
 YLH_decision_hire_hands:"雇人买命"
 YLH_decision_hire_hands_desc:"赏格挂出去，来的人什么样的都有：逃兵、渔民、走投无路的读书人。达达利亚挨个看过去，只问一句：你家里还有几口人要养？然后按人数定价，他知道，一个为温饱而来的兵，比一个为理想而来的兵，耐用得多。"
 YLH_decision_port_tariff:"抽厘金"
 YLH_decision_port_tariff_desc:"抽厘金不收现银，只收路引，想要通行，就得先买一份通行。达达利亚说：直接抢钱太粗鲁了，我要的是让他们心甘情愿地，一步步走进我的规矩里。"
 YLH_decision_intelligence:"暗桩"
 YLH_decision_intelligence_desc:"暗桩是那些已经投靠至冬、却还留在旧衙门里的人。他们做的事很简单：把不该传出去的消息，压住一晚。而往往就是这一晚，决定了一座城的命运。"
 YLH_decision_bribe_guild:"赎买百工"
 YLH_decision_bribe_guild_desc:"赎买的价码开得很高，高到让许多掌事，第一次开始怀疑自己坚守半生的东西，值不值这个数。达达利亚从不强求，他只是把价钱摆在桌上，然后耐心地等，人心这东西，最经不起等。"
 YLH_decision_freeze_accounts:"冻结账目"
 YLH_decision_freeze_accounts_desc:"冻结账目不出刀不见血，却能让一个显赫的家族，在一夜之间变成罪人。达达利亚说：我不用杀反对我的人，我只需要让他们发现，自己突然没有钱了，剩下的，时间会替我做完。"
 YLH_decision_northern_loan:"北国放贷"
 YLH_decision_northern_loan_desc:"借出去的钱，从来是钩子。达达利亚深谙此道：一个借了至冬钱的商会，比一个签了盟约的商会，更可靠，因为盟约可以撕，债务逃不掉。"
 YLH_decision_patrol_lanes:"巡弋航道"
 YLH_decision_patrol_lanes_desc:"巡弋航道，表面上是维护治安，实际上是把每一条航线的走向，都记进至冬的海图。达达利亚说：我今天替你们赶跑海盗，明天这份海图，就成了你们离不开我的理由。"
 YLH_decision_war_exercise:"实弹演武"
 YLH_decision_war_exercise_desc:"实弹演武，是给外人看的一场戏：炮声越响，谈判桌上就越省事。达达利亚说：我很少真的想打仗。我只是发现，一个随时准备开炮的人，往往比一个真的开了炮的人，更能得到他想要的东西。"
 YLH_decision_ratify_lease:"续订租约"
 YLH_decision_ratify_lease_desc:"续订租约的谈判，永远是耐力赛：至冬不急，因为它知道璃月更急。达达利亚坐在对面，慢悠悠地喝茶，一坐就是一下午。他说：谈判不比打仗省力，只是，用的是耐心。"
 YLH_decision_envoy_keqing:"使者赴玉衡"
 YLH_decision_envoy_keqing_desc:"使者回来时说，刻晴压根没见他。达达利亚听完哈哈大笑：好，好得很。我最喜欢的对手，就是那种连见都不肯见我，却能在背后把我的打算猜个八九分的人。他当即命人，给玉衡送去一船军械，是替她省点力气。"
 YLH_decision_envoy_ningguang:"使者赴群玉阁"
 YLH_decision_envoy_ningguang_desc:"群玉阁的使者谈了三个时辰，全在讲利。达达利亚回到船上，对副官感叹：凝光是我在这世上，见过最像同类的敌人，她和我一样，都相信这世上一切东西，都可以定价。可惜，同一门手艺的两个人，注定做不成朋友。"
 YLH_decision_envoy_ganyu:"使者赴月海亭"
 YLH_decision_envoy_ganyu_desc:"月海亭的回复，是所有势力里唯一带着人情味的。甘雨说：海水可以让，港口可以谈，但月海亭的人，一个也不能少。达达利亚捏着信，忽然笑了：这样的人才难对付，她争的是人。"
 YLH_decision_envoy_shenhe:"使者赴绝云间"
 YLH_decision_envoy_shenhe_desc:"绝云间的回信只有八个字，写在雪白的绢上：路可以让，人不低头。达达利亚把绢读了很久，把玩着手中那柄枪，喃喃自语：这世上，我最敬重的敌人，就是这种连价钱都不肯开口报的人，因为我知道，她给的答案，比金子还贵。"
 YLH_decision_envoy_lanyan:"使者赴沉玉谷"
 YLH_decision_envoy_lanyan_desc:"沉玉谷的使者最不像使者：一身泥，一脸倔，谈的是水、土、谷种。达达利亚听完汇报，第一次停下了手里的枪，说：有点意思。这世上大多数人想从我这里要钱，她却只想要我别去动那片谷地。"
 YLH_decision_final_accord:"云来之约"
 YLH_decision_final_accord_desc:"把三年来所有的租约、债券、航图、军约，一并摊开，写成一部至冬在璃月的总章程。达达利亚亲自审每一页，改到深夜。末了他在扉页写下：此约由强者签订，但须由弱者长久遵守。写完他自己也怔了一下，然后把那一页，悄悄撕了下来。"

 LYY_Event.6001.t:"公子临海"
 LYY_Event.6001.d:"璃月内战的消息传到云来海时，达达利亚正在甲板上练枪。他收枪，望着南方烧红的天空，笑了。\n副官小心地问他打算怎么办。他答：怎么办？这么好看的戏，当然要买张最好的位置。他提笔给女皇写信，只有一行：给我一支舰队，我还你一座会下金蛋的港口。写完他自己也笑：你看，连情书都写得像个生意人。"
 LYY_Event.6001.a:"以商之名，行干涉之实"
 LYY_Event.6001.b:"只作旁观，静待时机"
 LYY_Event.6002.t:"雪原军令"
 LYY_Event.6002.d:"雪原军令一下，云来海的气氛就变了：操练的锣声从清晨响到黄昏。\n一个老兵私下抱怨训练太苦。达达利亚听见了，没有罚他，反倒递过去一壶酒，说：你是对的，确实苦。可你想过没有，等真的上了战场，苦和苦是不一样的：一种是练出来的苦，一种是躺下去就再起不来的苦。老兵接过酒，没再说话。"
 LYY_Event.6002.a:"以雪原军令，立军威"
 LYY_Event.6002.b:"宽严相济，徐图训练"
 LYY_Event.6003.t:"募兵之旗"
 LYY_Event.6003.d:"募兵旗在四座码头同时挂起，赏格高得连路过的渔民都动了心。\n一个穿着旧袍的读书人也来报名。达达利亚问他会不会用刀，答不会。又问他识字吗，答会。达达利亚当场留下了他，做记录员。他说：打仗的兵不缺，肯替死人记名字的人，我一个人都嫌少。"
 LYY_Event.6003.a:"广募亡命，不问出身"
 LYY_Event.6003.b:"精挑细选，宁缺毋滥"
 LYY_Event.6004.t:"北国军械"
 LYY_Event.6004.d:"至冬军械船一艘接一艘靠港，码头上的木箱堆成小山。箱上印着霜纹，也印着一行小字：货到付款。\n副官问达达利亚，为什么要留这四个字。他答：让她们看看，我们连军火都是赊来的，这样她们才会相信，我们是真的把自己，押在了这场仗上。"
 LYY_Event.6004.a:"购北国军械，武装全军"
 LYY_Event.6004.b:"就地取材，减轻外援"
 LYY_Event.6005.t:"血与雪"
 LYY_Event.6005.d:"血与雪，是至冬军人的两样本能。操演结束那夜，达达利亚亲手给每个新兵倒酒。\n一个新兵喝得满脸通红，问他：长官，你把我们当什么？达达利亚想了想，答：当活人。他顿了顿，又说：这话听着不像夸，可在这行里，被当活人看，已经是最高的评价了。"
 LYY_Event.6005.a:"以血与雪，砺我锐士"
 LYY_Event.6005.b:"惜其体肤，养其士气"
 LYY_Event.6006.t:"灰袍船长"
 LYY_Event.6006.d:"灰袍船长们聚在云来海最深的一间舱室，只有一盏灯。这些人走私、护航、收债，什么都干过。\n达达利亚给最年长的那位斟酒，说：听说你在这片海上，走了四十年？老人答：四十二年。达达利亚点头：那从今天起，这片海怎么走，我先听你的。老人愣了愣，接过酒，一饮而尽。"
 LYY_Event.6006.a:"倚重灰袍船长，用其旧路"
 LYY_Event.6006.b:"另派亲信，重立班底"
 LYY_Event.6007.t:"租港之约"
 LYY_Event.6007.d:"租港合约写得极美：期限九十九年，租金一次付清，条款客气得像一桩婚约。\n签完字时，璃月那边一位老吏忍不住问：你们这样做，就不怕后人骂吗？达达利亚一边盖上印章，一边笑：怕。所以我才把条款写得这么漂亮，让骂我的人，也得承认，我至少守了字面上所有的约定。"
 LYY_Event.6007.a:"租借港口，坐收其利"
 LYY_Event.6007.b:"以武力强占，速取之"
 LYY_Event.6008.t:"契约战争"
 LYY_Event.6008.d:"契约战争，是把打仗做成一门清清楚楚的生意：雇佣、赏格、抚恤、违约，条条写死。\n有人骂达达利亚冷血，说不该把战争当买卖。他答：真正冷血的是你们，嘴上谈着情怀，粮饷却要拖着发。到最后，替这情怀送命的，都是那些连一张回家的船票都买不起的兵。"
 LYY_Event.6008.a:"以契约立战争之规"
 LYY_Event.6008.b:"以军令督之，不立契"
 LYY_Event.6009.t:"铁额"
 LYY_Event.6009.d:"铁额是条冷冰冰的规矩：交够铁，放过你的村子；交不够，不必再谈。\n一个村的里正跪着求宽限三日。达达利亚看都没看他，只对管事说：宽限可以，三日之后，利息翻倍。里正含泪走了。达达利亚望着他的背影对副官说：我这是在给他留一条活路。真的，我只是不想让他觉得，只要跪下，事情就能解决。"
 LYY_Event.6009.a:"严行铁额，分毫不让"
 LYY_Event.6009.b:"稍宽其额，以安民心"
 LYY_Event.6010.t:"封港"
 LYY_Event.6010.d:"封锁璃月港那夜，海面起着大雾。六十艘船无声横陈，像一圈合拢的铁环。\n达达利亚立在旗舰船头，望着雾里那座模糊的城，说：我不攻它。我只是让它的钱出不去，也进不来。一座被饿着的城，比一座被烧着的城，更容易学会听话。说完他自己却沉默了，因为这句话，他曾在别的地方，也说过一次。"
 LYY_Event.6010.a:"封锁璃月港，断其血脉"
 LYY_Event.6010.b:"解封示好，换取谈判"
 LYY_Event.6011.t:"盐账"
 LYY_Event.6011.d:"盐账上记着要紧的一笔：谁在什么时候，需要多少盐。\n账房先生捧着账本问，为何非要用盐做杠杆。达达利亚答：米太沉，铁太硬，只有盐这东西，家家都得用，却又不像米那样，能自己去种。他弹了弹账本：掌握了盐，就掌握了这座港口的心跳。"
 LYY_Event.6011.a:"经营盐账，扼其咽喉"
 LYY_Event.6011.b:"开放盐路，以稳物价"
 LYY_Event.6012.t:"北国军官"
 LYY_Event.6012.d:"北国军官团抵达那天，达达利亚亲自到码头迎接。这些人大多出身军校，不苟言笑。\n敬酒时，一个年轻军官当面问他：听说你爱笑，也不守规矩，凭什么带兵？达达利亚笑着答：凭我这一身伤，你数数，看有几道，是你见过的将军身上有的。军官数到一半，闭了嘴，仰头把酒喝了。"
 LYY_Event.6012.a:"委北国军官，整肃军纪"
 LYY_Event.6012.b:"自领其军，不用北人"
 LYY_Event.6013.t:"雪原操演"
 LYY_Event.6013.d:"雪原操演把一批批的人磨成兵器：冻伤、旧伤、沉默，是结束时的三样标配。\n一个兵冻掉了两根脚趾，仍坚持走完全程。达达利亚把自己的狐裘披到他肩上，说了一句让所有人都意外的话：记着今天这个冷。是为了往后，你替别人挡风的时候，手别抖。"
 LYY_Event.6013.a:"行雪原操演，尽磨其锋"
 LYY_Event.6013.b:"减操省耗，留其体力"
 LYY_Event.6014.t:"商道抽成"
 LYY_Event.6014.d:"商道抽成，是至冬最温柔的一把刀：不砍人，只砍利润。\n一个老商人拍着桌子骂这是敲骨吸髓。达达利亚不恼，只给他算了一笔账，最后说：你不肯交这一成，路我还是要封的。到那时候，你连这一成都省下的机会都没有。老商人愣了半天，签了字。达达利亚送他出门时，还笑着替他掀了帘子。"
 LYY_Event.6014.a:"抽成商道，广开财源"
 LYY_Event.6014.b:"轻抽商道，以养商力"
 LYY_Event.6015.t:"女皇敕令"
 LYY_Event.6015.d:"女皇的敕令到了，短短几行，把云来海的事务尽数付托。\n达达利亚捧着信在甲板上站了很久。副官试探着问他，女皇这是信任还是试探。他答：都是。所以从今天起，我要做的每一笔账，都得清清楚楚，让北国那边看着，也让这港口的人看着，我这个爱笑的人，挑起担子来，也是认真的。"
 LYY_Event.6015.a:"奉女皇敕令，尽付云来海"
 LYY_Event.6015.b:"虚奉敕令，自专其事"
 LYY_Event.6016.t:"代理之约"
 LYY_Event.6016.d:"代理之约的精髓，在代理二字：至冬不出面，只扶一个听话的衙门。\n签约时，璃月方面的代表红着脸问：这和亡国有什么分别？达达利亚放下笔，认真地看着他：有分别。亡国是你连问这句话的机会都没有。他停了停，又补一句：我不是在安慰你，我这个人，从不浪费安慰。"
 LYY_Event.6016.a:"订代理之约，间接治之"
 LYY_Event.6016.b:"直接并吞，明正其名"
 LYY_Event.6017.t:"傀儡议事厅"
 LYY_Event.6017.d:"傀儡议事厅第一次开会，礼乐齐备，连反对派都请了几位来坐。\n散会后，达达利亚对身边的幕僚说：你瞧那些议员，吵得多认真。幕僚不解，他解释：最像样子的议会，往往是最不管用的议会，因为它把吵架当成了政治。而我只要结果，不要热闹。"
 LYY_Event.6017.a:"立傀儡厅，妆点门面"
 LYY_Event.6017.b:"罢其空谈，专任能吏"
 LYY_Event.6018.t:"看不见的手"
 LYY_Event.6018.d:"看不见的手从不直接下令，只让货款迟三天、航路贵半成，然后等各方自己想明白。\n一个被卡了货的商会会长，跑到至冬衙门讨说法，却怎么也找不到一个能负责的人。他气急败坏地走了。达达利亚从帘后出来，对管事说：你看，他连恨谁都不知道。这就是这份手艺，最干净的地方。"
 LYY_Event.6018.a:"以看不见的手，暗中操盘"
 LYY_Event.6018.b:"光明正大，明令而行"
 LYY_Event.6019.t:"以商代战"
 LYY_Event.6019.d:"以商代战，是至冬兵法里最省的一条：不动刀，只喂饱。\n有下属不解，问这样真能赢吗。达达利亚答：用刀征服一座城，你得守它一辈子；用钱征服一座城，它会自己替你守。这是女皇教我的，她比谁都懂，什么叫不流血的胜利。他说这话时，语气里带着一种罕见的、近乎敬意的平静。"
 LYY_Event.6019.a:"以商代战，喂饱这座城市"
 LYY_Event.6019.b:"以兵临之，速战速决"
 LYY_Event.6020.t:"友军"
 LYY_Event.6020.d:"友军编制分得清清楚楚：至冬出枪出饷，璃月出人出命。\n检阅那天，一个璃月籍的连长出列，问：我们替谁打仗？达达利亚看着他，答：你替你的饷打仗。这答案不好听，可我不骗你。等你哪天想通了自己真正在替谁流血，别恨我就行，恨我，也改变不了什么。"
 LYY_Event.6020.a:"编友军，使其自守"
 LYY_Event.6020.b:"裁撤友军，纯用北兵"
 LYY_Event.6021.t:"静默胁迫"
 LYY_Event.6021.d:"静默胁迫，是没有硝烟的围城。达达利亚从不威胁谁，只让不肯合作的人，慢慢失去一切。\n一个被逼到绝境的商户，最后投了河。消息传来时，达达利亚正在吃饭。他放下筷子，沉默了一会儿，对副官说：把他家人的抚恤送到。副官愣住。他说：不是赎罪。是不想让别人以为，跟着我不合作的人，都没有后路，那样太丑了。"
 LYY_Event.6021.a:"静默胁迫，令其自溃"
 LYY_Event.6021.b:"明正典刑，杀一儆百"
 LYY_Event.6022.t:"委员会的目光"
 LYY_Event.6022.d:"愚人众委员会的目光，从未真正离开云来海。达达利亚清楚，自己攫取的每一分利，都有人在北国记着。\n他并不反感这份注视。相反，某个深夜他对着烛火自语：感谢这些眼睛。正因为有它们在，我才始终不敢彻底放纵，一个人在没人看的地方，最容易变得不像自己。"
 LYY_Event.6022.a:"谨奉委员会之目，敛其行止"
 LYY_Event.6022.b:"我行我素，何惧人言"
 LYY_Event.6023.t:"丝与链"
 LYY_Event.6023.d:"丝与链是同一件东西的两面：璃月的丝绸越卖越远，就越离不开至冬的航路。\n达达利亚在灯下翻着贸易报表，忽然笑出声。副官问怎么了，他说：我在想，我这一生从没亲手捆过谁，可等日子再久一点，就所有人都发现，他们忙着忙着，就把自己，忙进了我的绳里。"
 LYY_Event.6023.a:"以丝为链，徐缚其商"
 LYY_Event.6023.b:"断其航路，迫其就范"
 LYY_Event.6024.t:"名义总督"
 LYY_Event.6024.d:"名义总督坐上了原本属于七星的位置，印章是真的，权力是真的，主人却不是。\n达达利亚偶尔来看他议事，看这个提线木偶认真地扮演一位统治者。有一次，总督不解地问他为何总来。他答：我来看看，一个已经替别人活了一辈子的人，会不会有一天，突然真想替自己活一回。总督笑了，说这不可能。达达利亚也笑了，转身离开。"
 LYY_Event.6024.a:"立名义总督，借手治民"
 LYY_Event.6024.b:"废傀儡之名，自任其职"
 LYY_Event.6025.t:"黄金贡道"
 LYY_Event.6025.d:"黄金贡道是一年中最忙的一季，货船排成长龙，一直排到看不见的海平线。\n达达利亚立于灯塔之上，看着这条金色的河，忽然对副官感慨：这些船上，没有一面旗是我的，可它们驶向的每一个方向，都有我的名字。副官沉默着，觉得这句话说得很美，也很冷。"
 LYY_Event.6025.a:"经营黄金贡道，聚四海之利"
 LYY_Event.6025.b:"闭关自守，保境安民"
 LYY_Event.6026.t:"干净的手"
 LYY_Event.6026.d:"干净的手，是达达利亚最引以为傲的东西：他从不亲手杀人，从不写下具体的恶。\n一次宴会上，一位老绅士当面夸他：阁下真是难得，手上竟一点惨烈都没有。达达利亚举杯致意，笑容标准：多谢。他把酒一饮而尽，心里却想起那许多连名字都没人记得的死者，然后他继续笑着，去敬下一桌。"
 LYY_Event.6026.a:"保此干净之手"
 LYY_Event.6026.b:"亲手了结，以绝后患"
 LYY_Event.6027.t:"笑与刃"
 LYY_Event.6027.d:"笑与刃，从来是同一套动作的两半步。达达利亚可以在酒桌上称兄道弟，也能在同一个夜里签走那人的全部家产。\n有人当面问他良心安不安。他答：安。那人愣住。他补了一句：开玩笑的，不安。但我不让那点不安，妨碍我做完该做的事。这是个成年人，对自己最后的诚实。说完他又笑，笑得那人不寒而栗。"
 LYY_Event.6027.a:"笑里藏刃，从容周旋"
 LYY_Event.6027.b:"直言相向，不假辞色"
 LYY_Event.6028.t:"利润之序"
 LYY_Event.6028.d:"利润之序，是至冬给这片土地设计的蓝图：不讲血统，不讲乡愁，只讲一笔买卖算不算得过来。\n达达利亚对着一屋子面露难色的璃月官员说：我知道你们嫌它冷。可冷有冷的好处，它不认人，也不认仇。你只要出得起价，它就给得起位。这世上，还有比这更公平的东西吗？满堂沉默，没有人能立刻反驳他。"
 LYY_Event.6028.a:"定利润之序，以商理民"
 LYY_Event.6028.b:"守旧日规矩，勿扰其常"
 LYY_Event.6029.t:"最后一封密函"
 LYY_Event.6029.d:"最后一封密函，装的是至冬的最终条件：不必称臣，不必易帜，只需长期租让港口、航路与盐铁。\n达达利亚在信末亲手添了一行：我给你们的是一条能活下去的路，尽管它确实通向我。写完，他封好信，交给连夜赶来的使者，忽然觉得这句话，也是写给他自己的。"
 LYY_Event.6029.a:"递最后一封密函，示以底线"
 LYY_Event.6029.b:"不再通信，直接动兵"
 LYY_Event.6030.t:"有利之和平"
 LYY_Event.6030.d:"有利之和平，是达达利亚为这条路起的名字：不占领、不称王，只做庄家。\n有旧部问他，这算不算背叛了女皇的野心。他答：野心从不写在旗上。真正赢到最后的，往往是那个坐在牌桌边、从头到尾只收抽成的人。说完他望了望窗外，海面平静，他却在想，女皇会不会也早就想通了这一点。"
 LYY_Event.6030.a:"成有利之和平，久居此地"
 LYY_Event.6030.b:"放弃代理，另谋他图"
 LYY_Event.6031.t:"索求主权"
 LYY_Event.6031.d:"索求主权，是把一切伪装撕下来的那一刻。达达利亚亲手把至冬的鹰旗，升上港口最高的旗杆。\n旗升到一半，风忽然停了，旗子垂落，像一面被雨打湿的床单。码头上一片寂静。达达利亚站在杆下，仰头看了很久，然后说了句只有自己听得见的话：起来啊。风像是听懂了他的话，猛地吹起，鹰旗猎猎作响。"
 LYY_Event.6031.a:"索求主权，明张北国之威"
 LYY_Event.6031.b:"保留伪饰，徐图后计"
 LYY_Event.6032.t:"并吞敕令"
 LYY_Event.6032.d:"并吞敕令颁下的那天，云来海的海水，颜色比往常更深。\n达达利亚没宣布胜利，只下了一道令：所有璃月商号的旗，一律降下。一个老船主抱着自己的船旗不肯松手，被兵士强行夺走。他跪在码头哭喊。达达利亚远远看着，没有过去安慰，只对副官说：记着他的名字，将来总有一天，会有人问起，这一天，发生过什么。"
 LYY_Event.6032.a:"颁并吞敕令，废其旧旗"
 LYY_Event.6032.b:"仍存其号，羁縻其民"
 LYY_Event.6033.t:"彻底封锁"
 LYY_Event.6033.d:"彻底封锁，是把最后一点余地也抹去：航道、渔场、港口全封，连飞鸟都难以越过。\n一个渔妇跪在封锁线外，哭着求放过她病重的孩子。达达利亚在舰桥上看了很久，最后命人送去一船药，却没有解除封锁。他说：我可以救一个孩子，但不能让这道线，因为一次眼泪就破口。破了一次的堤，就再也立不住了。"
 LYY_Event.6033.a:"彻底封锁，不留余地"
 LYY_Event.6033.b:"网开一面，以示宽大"
 LYY_Event.6034.t:"梦想之军"
 LYY_Event.6034.d:"梦想之军，是至冬在璃月最精锐的一支力量，每人领一份足够全家安稳的军饷。\n检阅时，一个年轻士兵高声说自己是为主公的梦想而战。达达利亚走近他，压低声音：孩子，你是为军饷而战。这没什么可耻，相反，我敬佩你。因为肯为钱去死的人，至少比那些嘴上说为理想、怕死的人，诚实得多。"
 LYY_Event.6034.a:"练梦想之军，厚饷养之"
 LYY_Event.6034.b:"薄饷练兵，务求省用"
 LYY_Event.6035.t:"焚册"
 LYY_Event.6035.d:"焚册，是占领者最熟练也最残忍的一课：两百年的地契、税簿、户籍，一夜化为灰烬。\n火光里，一个老人拼命往火堆里冲，被人拦住，嘶喊着那是他祖上传下来的地契。达达利亚看着那场火，很久以后才说：人最深的恐惧，从来是失去能证明财产曾经存在过的东西。说完，他转身走了，脚步比来时快。"
 LYY_Event.6035.a:"焚其旧册，断其念想"
 LYY_Event.6035.b:"保其文牍，以收人心"
 LYY_Event.6036.t:"血溅于水"
 LYY_Event.6036.d:"血溅于水，是这场占领真正越过了那条线的时刻。港外的海面上，第一次浮起一层淡淡的红。\n达达利亚立在舰桥上，罕见地没有说笑。他对副官说：把今天死的人的名字，都记下来。副官问：记下来做什么？他答：以后，会有人来问的。副官不明白这句话，只是照办了。"
 LYY_Event.6036.a:"以血立威，虽过不悔"
 LYY_Event.6036.b:"收手止杀，徐图安民"
 LYY_Event.6037.t:"冷面总督"
 LYY_Event.6037.d:"冷面总督是一种姿态：不亲民、不解释、只下命令。\n达达利亚发现，璃月人竟更服从一张没有表情的脸。他在府中对着镜子，试着摆出几种神情，最后停在一张完全空白的脸上。他看了一会儿，忽然觉得那面具之下的自己，有点陌生，随即移开了视线。"
 LYY_Event.6037.a:"任冷面总督，只施号令"
 LYY_Event.6037.b:"亲民示好，笼络人心"
 LYY_Event.6038.t:"驻军"
 LYY_Event.6038.d:"驻军是把统治钉死在地上的钉子：要塞、哨所、巡逻队，一层层铺满全境。\n达达利亚巡视一处新建的哨所时，看见守军正在墙上刷标语。他问写的什么，答是安定繁荣。他盯着那四个字看了很久，然后说：好。写大一点，让路过的每一个人都看见，哪怕他们心里,一个字都不信。"
 LYY_Event.6038.a:"广设驻军，钉死全境"
 LYY_Event.6038.b:"仅守要地，节省兵力"
 LYY_Event.6039.t:"火海"
 LYY_Event.6039.d:"火海，是占领者最不计后果的一次出手：为了肃清抵抗，他们烧掉了整片港湾的渔船与仓房，火光照亮半个夜空。\n达达利亚望着这片火，忽然问一边的副官：你说，烧掉的东西越多，剩下的东西，是不是就越值钱？副官张了张嘴，没敢回答。达达利亚自己也没再追问，他知道，这个问题，不需要答案。"
 LYY_Event.6039.a:"纵火焚港，绝其抵抗"
 LYY_Event.6039.b:"禁其焚掠，收其民心"
 LYY_Event.6040.t:"主权港"
 LYY_Event.6040.d:"主权港落成那天，码头插满北国旗帜，税关换上至冬纹章。\n一个璃月的孩子仰着头，问母亲：那些旗子上的鸟，是什么？母亲低声说：是鹰。孩子又问：那我们的旗呢？母亲没有回答，只是把他抱得更紧了些。达达利亚恰在附近听见了这段对话，脚步顿了顿，随即若无其事地走开。"
 LYY_Event.6040.a:"立主权港，昭示天下"
 LYY_Event.6040.b:"维持现状，待时而动"
 LYY_Event.6041.t:"北国之拳"
 LYY_Event.6041.d:"北国之拳，是至冬留在这片土地上的最终常备武力。它不再需要战斗，只需存在。\n一个年轻军官向达达利亚抱怨：终日操练，却从无仗打，实在无趣。达达利亚拍着他的肩：你活得越无趣，就说明这支军队越成功，因为最成功的军队，是那种从来没有机会展示武力的军队。军官若有所思地走了。"
 LYY_Event.6041.a:"练北国之拳，常备不懈"
 LYY_Event.6041.b:"裁撤冗兵，以省军费"
 LYY_Event.6042.t:"冰之座"
 LYY_Event.6042.d:"冰之座是达达利亚在璃月为自己立的终点。加冕那日，他高居其上，脚下是一座彻底臣服的港口。\n乐声停下的那一刻，他忽然感到一阵熟悉的、战斗开始前的空。他环顾四周的欢呼与彩带，忽然明白了一件事：站在这里，并不比站在甲板上更让人踏实。他面上不动声色，只是把手，在冰凉的扶手上，又按紧了些。"
 LYY_Event.6042.a:"登冰之座，就此定鼎"
 LYY_Event.6042.b:"急流勇退，另择归途"
 LYY_Event.6043.t:"冬之主权"
 LYY_Event.6043.d:"冬之主权，是这条路最后的模样：璃月不再被称作璃月，只是至冬版图上一块带着暖意的南方领地。\n达达利亚掌着这片土地，却越来越常梦见北方，冰、雪，和当年那个在雪原里第一次握枪的少年。他醒来时总要在黑暗中坐很久。有天夜里，他忽然对身边人说：替我备一壶北国带来的酒。那人问：今夜是什么日子？他答：没什么日子。就是想家了。"
 LYY_Event.6043.a:"以冬之主权，终此一役"
 LYY_Event.6043.b:"留下一线，日后好相见"
 LYY_Event.6044.t:"孩童的游戏"
 LYY_Event.6044.d:"孩童的游戏，是达达利亚难得允许自己放松的时刻。他在港口临时拼出一片空地，让难民的孩子滚铁环、跳格子。\n一个孩子怯生生地问他：你是坏人吗？他笑着答：我也不太清楚。不如等你长大，自己来判断，至少那时候，你还得活着，才能判断。孩子似懂非懂地跑开了。达达利亚望着他跑远的背影，站了很久。"
 LYY_Event.6044.a:"纵孩童嬉戏，自宽其心"
 LYY_Event.6044.b:"严束部下，不得懈怠"
 LYY_Event.6045.t:"巨渊走私"
 LYY_Event.6045.d:"巨渊走私，是一条连至冬公文都不敢明写的黑线：矿料、旧物，甚至人口，被一批批运出层岩。\n达达利亚对它睁一只眼闭一只眼，只收一道固定的抽成。有部下质疑这是纵容。他答：管制一个国家，得给那些胆大的人留一条活路，不然他们会去找别的活路，而那往往更麻烦。他顿了顿，又补一句：何况，那条路上的货，有不少，是运回北国的。"
 LYY_Event.6045.a:"默许走私，抽成分利"
 LYY_Event.6045.b:"严禁私运，整肃港口"
 LYY_Event.6046.t:"舰队桅顶"
 LYY_Event.6046.d:"舰队桅顶，是云来海最高的地方。达达利亚常独自攀上去，一坐就是半日。\n从这里望下去，整座港口像一盘摊开的棋，海面平静得能照出云的影子。他想：站在这么高的地方，本该看得更远，可为什么，我看到的，反而只有这些船、这些货、这些永远收不完的账。海风吹过，他没有下来。"
 LYY_Event.6046.a:"独上桅顶，俯瞰此城"
 LYY_Event.6046.b:"身入局中，亲理庶务"
 LYY_Event.6047.t:"家书"
 LYY_Event.6047.d:"家书是从遥远的北国辗转来的，写信的是他年幼的弟弟妹妹，信里画着歪歪扭扭的房子。\n达达利亚把信读了一遍又一遍，最后折好，收进贴身的衣袋。他对副官说：你先出去，我想一个人待会儿。那天，他在舱里坐到了天亮。第二天走出舱门时，脸上又挂上了那副谁都很熟悉的笑。"
 LYY_Event.6047.a:"珍藏家书，独自思乡"
 LYY_Event.6047.b:"毁弃家书，绝其牵挂"
 LYY_Event.6048.t:"血酬"
 LYY_Event.6048.d:"血酬，是云来海三年战事摊开的一本总账：死了多少人、花了多少钱、换来了多少土地与航道。\n达达利亚逐行看完，久久没有说话。良久，他对账房说：把那些数字，单独抄一份给我。我想看看，我们用多少条命，买下了这一片海。账房抄好呈上，他收进怀里，和那封家书，放在一起。"
 LYY_Event.6048.a:"收下血酬之账，独自细看"
 LYY_Event.6048.b:"封存此账，不再提起"
 LYY_Event.6049.t:"接管璃月"
 LYY_Event.6049.d:"接管璃月那天，至冬的旗帜升上璃月港最高的旗杆。\n达达利亚站在旗下，俯瞰着这座他花了数年征服的城市，却没有想象中的得意。他想起刚来时的黄昏，想起那个跪在关外求他一车粮的老人，想起自己说过的话，慈悲救不了一座将倾的山。他闭上眼，很久。再睁开时，海风依旧，旗帜依旧，只是他忽然很想回北方了。"
 LYY_Event.6049.a:"升起旗帜，接管璃月"
 LYY_Event.6049.b:"择日撤军，还政其人"
 LYY_Event.6050.t:"云来之约"
 LYY_Event.6050.d:"云来之约，是一部至冬在璃月的总章程：租约、债券、航图、军约，全部收进同一册。\n达达利亚审到深夜，在扉页写下：此约由强者签订，但须由弱者长久遵守。写完他自己怔了一下，把那一页悄悄撕了下来，没有入册。他把那张纸折好，和家书、血酬的抄本，放在一起，那是他在这里，唯一不肯交给别人的东西。"
 LYY_Event.6050.a:"立云来之约，以定此事"
 LYY_Event.6050.b:"放弃立约，只凭刀兵"
 LYY_Event.6051.t:"玉衡的闭门"
 LYY_Event.6051.d:"使者赴玉衡，回来时只说，刻晴压根没见他。\n达达利亚听完，竟哈哈大笑：好，好得很。我最喜欢的对手，就是那种连见都不肯见、却能在背后把我打算猜个八九分的人。他当即命人送一船军械去玉衡。副官不解：这不是资敌？达达利亚笑：一个算得过账的对手，比一个只会喊口号的对手，更值得我给你送枪，因为前者，还讲规矩。"
 LYY_Event.6051.a:"赠与军械，偿其所怀"
 LYY_Event.6051.b:"断绝往来，不助敌手"
 LYY_Event.6052.t:"群玉阁的算盘"
 LYY_Event.6052.d:"群玉阁的使者谈了三个时辰，全在讲利。\n达达利亚回到船上，对副官感叹：凝光是我在这世上见过最像同类的敌人，她和我一样，都相信一切东西都可以定价。可惜，同一门手艺的两个人，注定做不成朋友。他望着海面出神，末了笑着补一句：也幸好做不成，不然这戏，就不好看了。"
 LYY_Event.6052.a:"敬其为同类，两不相欺"
 LYY_Event.6052.b:"以诈对诈，小心提防"
 LYY_Event.6053.t:"月海亭的人"
 LYY_Event.6053.d:"月海亭的回复，是所有势力里唯一带着人情味的。甘雨说：海水可以让，港口可以谈，但月海亭的人，一个也不能少。\n达达利亚捏着那封信，忽然笑了：这种人最难对付，她争的是人。一个肯为治下百姓较真的人，比一个只会算钱的对手，危险得多。他把信收好，罕见地，认真了几分。"
 LYY_Event.6053.a:"敬其为人，另议其民"
 LYY_Event.6053.b:"以利相诱，不必当真"
 LYY_Event.6054.t:"绝云间的绢"
 LYY_Event.6054.d:"绝云间的回信只有八个字，写在雪白的绢上：路可以让，人不低头。\n达达利亚把绢读了很久，把玩着手中的枪，喃喃自语：这世上我最敬重的敌人，就是这种连价钱都不肯报的人，因为我知道，她给的答案，比金子还贵。他把那片绢收进贴身衣袋，和家书放在一起。这一举动连他自己都有些意外。"
 LYY_Event.6054.a:"珍藏那片白绢"
 LYY_Event.6054.b:"弃之如鄙，不以为意"
 LYY_Event.6055.t:"沉玉谷的谷种"
 LYY_Event.6055.d:"沉玉谷的使者最不像使者：一身泥、一脸倔，谈的是水、土、谷种。\n达达利亚听完汇报，第一次停下手里的枪，说：有点意思。这世上大多数人找我要钱，她却只想让我别去动那片谷地。他沉默了一下，吩咐下去：沉玉谷的事，先搁着，别动。属下问他为何，他只说：我想看看，她能守住多久。"
 LYY_Event.6055.a:"暂不动沉玉谷，静观其变"
 LYY_Event.6055.b:"即刻开发谷地，勿失良机"
 LYY_Event.6056.t:"一纸总章程"
 LYY_Event.6056.d:"一纸总章程摊在长桌上，达达利亚逐页审阅，改到深夜。\n末了他在扉页写下：此约由强者签订，但须由弱者长久遵守。写完他自己怔了一下，随即把那一页撕下，没有入册。他把它折好，收进怀里，像是收进一个不愿被人看见的念头。窗外天色将明，海面上的旗帜，在风里猎猎作响。"
 LYY_Event.6056.a:"立章程，治其地"
 LYY_Event.6056.b:"废章程，仍以军法治之"

 YLH_Spirit_Fatui_Enforcer:"愚人众执行官"
 YLH_Spirit_Fatui_Enforcer_desc:"一柄笑起来很好看的刀。他从不亲自沾血，却让整片海域，都记得他的名字。"
 YLH_Spirit_Commissions_Gaze:"委员会的目光"
 YLH_Spirit_Commissions_Gaze_desc:"北国的注视从不停歇。它既是镣铐，也是护身符，一个被人盯着的人，反而不敢彻底放纵。"
 YLH_Spirit_Peace_With_Profit:"有利之和平"
 YLH_Spirit_Peace_With_Profit_desc:"不占领、不称王，只做庄家。真正赢到最后的，往往是那个坐在牌桌边、从头到尾只收抽成的人。"
 YLH_Spirit_Cold_Governor:"冷面总督"
 YLH_Spirit_Cold_Governor_desc:"一张没有表情的脸，比一张亲切的笑脸更能让人服从。可面具戴久了，谁还记得面具底下，原本是一张什么样的脸。"
 YLH_Spirit_Throne_of_Ice:"冰之座"
 YLH_Spirit_Throne_of_Ice_desc:"他高居其上，脚下是彻底臣服的港口。乐声停下的那一刻，他忽然感到一阵熟悉的、战斗开始前的空。"
 YLH_Spirit_Cloud_Sea_Accord:"云来之约"
 YLH_Spirit_Cloud_Sea_Accord_desc:"此约由强者签订，但须由弱者长久遵守。写下这句话的人，最终把它撕了下来，那是他在这片土地上，唯一不肯交给别人的东西。"
 YLH_Spirit_Mercenary_Honesty:"雇佣的诚实"
 YLH_Spirit_Mercenary_Honesty_desc:"他们的忠诚明码标价，省得将军去猜。为钱去死的人，至少比嘴上说为理想、怕死的人，诚实得多。"
 YLH_Spirit_Northern_Arsenal:"北国军械"
 YLH_Spirit_Northern_Arsenal_desc:"箱子上印着霜纹，也印着货到付款。世上最可靠的盟友，是欠了你钱的盟友。"
 YLH_Spirit_Grey_Captains:"灰袍船长"
 YLH_Spirit_Grey_Captains_desc:"他们走私、护航、收债，什么营生都沾过手。他们比谁都懂这片海，所以，怎么走，先听他们的。"
 YLH_Spirit_Sea_Lanes:"航道在手"
 YLH_Spirit_Sea_Lanes_desc:"我今天替你们赶跑海盗，明天这份海图，就成了你们离不开我的理由。"
 YLH_Spirit_Dream_Army:"梦想之军"
 YLH_Spirit_Dream_Army_desc:"装备精良，士气高昂。钱买不来勇气，钱只买来一个不必为别的借口送死的理由。"
 YLH_Spirit_Five_Envoys:"五方通使"
 YLH_Spirit_Five_Envoys_desc:"五面旗，五次试探。他甚至给不肯见他的对手，送去了一船军械，是不肯浪费一个好对手。"

 YLH_War_Tier_1:"战备等级"
 YLH_War_Tier_1_desc:"战备废弛，军械生锈，军心涣散。连码头边的野狗，都敢在军械箱上撒野。"
 YLH_War_Tier_2:"战备等级"
 YLH_War_Tier_2_desc:"战备初具，操练照常，枪能响。只是响得有点勉强，像是在替谁交代差事。"
 YLH_War_Tier_3:"战备等级"
 YLH_War_Tier_3_desc:"战备可战，令下即动，进退有据。云来海的兵，开始有了军队的样子。"
 YLH_War_Tier_4:"战备等级"
 YLH_War_Tier_4_desc:"战备如锋，刀出鞘，血立见。力量来得又快又硬，硬得让握刀的人，也开始怕自己。"
 YLH_War_Tier_5:"战备等级"
 YLH_War_Tier_5_desc:"战备滔天，举云来海之力，可撼一国。可当一支部队强到无所畏惧，它第一个失去的，往往是分寸。"
 YLH_Blockade_Tier_1:"封锁等级"
 YLH_Blockade_Tier_1_desc:"封锁虚设，航线照旧，货船往来。封锁，不过是几艘停在港湾里晒太阳的船。"
 YLH_Blockade_Tier_2:"封锁等级"
 YLH_Blockade_Tier_2_desc:"封锁初张，关卡立起，稽查加严。商船开始绕远路，抱怨声也跟着起来了。"
 YLH_Blockade_Tier_3:"封锁等级"
 YLH_Blockade_Tier_3_desc:"封锁成形，航道收窄，货价腾贵。这座港口的每一次心跳，都开始合上至冬的节拍。"
 YLH_Blockade_Tier_4:"封锁等级"
 YLH_Blockade_Tier_4_desc:"封锁如环，铁环合拢，寸板难入。被饿着的城，比被烧着的城，更容易学会听话。"
 YLH_Blockade_Tier_5:"封锁等级"
 YLH_Blockade_Tier_5_desc:"封锁如渊，水泄不通，生机尽绝。极端的封锁榨干了这片海最后一滴利润，也埋下了再也收不回的怨恨。"
 YLH_Combo_Twin_High:"战封并举"
 YLH_Combo_Twin_High_desc:"炮口对着港口，账本压在岸上。赚得快，恨得也快。"
 YLH_Combo_Twin_Low:"师老财尽"
 YLH_Combo_Twin_Low_desc:"兵不愿打，商不肯来。船停在港里生锈，账房关了灯。"
 YLH_Combo_A_High:"穷兵黩武"
 YLH_Combo_A_High_desc:"刀磨得锃亮，封锁却形同虚设。打得越凶，油水越薄。"
 YLH_Combo_B_High:"锁而不战"
 YLH_Combo_B_High_desc:"海路卡得死死，炮口却一直没响。他们在等对方先饿，也在等自己的耐心先耗尽。"

 #################### 公子 · 至冬干涉军（YLH） · 战后 ####################
 YLH_PW_The_Eagle_at_Anchor:"云来换旗"
 YLH_PW_The_Eagle_at_Anchor_desc:"内战停火的那个清晨，云来海的雾还没散。达达利亚让人把至冬的鹰旗升上最高一根桅杆，旗子在湿风里半卷着，码头上一片安静。他站在旗舰船头看了很久，才对副官说：从今天起，这港口的进出归我管，账要重记，人别乱动。"
 YLH_PW_Clear_the_Ashes:"清墟十日"
 YLH_PW_Clear_the_Ashes_desc:"清墟的活达达利亚亲自派人去干：拆墙、收尸、记名。他在断墙边看了一上午，忽然问身边的老吏，这一片原来住着多少户。老吏答不上来。他点点头：那就从今天开始数，数清楚了再动手修。"
 YLH_PW_Grain_for_the_Starving:"赈粮"
 YLH_PW_Grain_for_the_Starving_desc:"赈粮的棚子搭在码头边，一天两顿稀粥。有人问达达利亚，饿着的人这么多，粮从哪来。他答：先从北国赊，赊来的粮也是粮。长队里有个抱孩子的妇人，他把自己碗里的粥分了一半给她，没有多说。"
 YLH_PW_Revive_the_Market:"复市之秤"
 YLH_PW_Revive_the_Market_desc:"复市那杆秤是新打的，秤砣上刻着一行小字：缺一两，赔十两。达达利亚让人把秤挂在市口最显眼的地方。头一天就有摊主短了半两，当场被罚。看热闹的人以为要闹起来，第二天来摆摊的，反倒多了一倍。"
 YLH_PW_Register_of_the_Conquered:"抚册"
 YLH_PW_Register_of_the_Conquered_desc:"抚册要把云来海每一户的名字、口粮、欠账都写清楚。达达利亚翻着册子对幕僚说：我要知道谁还活着，谁还能干活，谁在等着看我倒台。写细一点，将来出事，第一个被问的是你，不是他们。"
 YLH_PW_Shelter_the_Refugees:"安置流民"
 YLH_PW_Shelter_the_Refugees_desc:"流民安置在旧兵营里，按户分铺，先给铺再给粮。有个士卒嫌他们脏，被达达利亚当众抽了一鞭。他说：这些人往后要替我搬货、划船、交税，今天你嫌他们，明天谁替你干活。士卒低头去搬铺板了。"
 YLH_PW_Lights_on_the_Water:"水上灯火"
 YLH_PW_Lights_on_the_Water_desc:"港口的水上灯一盏盏点起来，照得航道发白。达达利亚夜里独自坐船巡了一圈，看着灯说：灯亮着，船才敢进港；船进港，账才转得动。这灯不能灭，灭了，这座城就跟着黑。"
 YLH_PW_Repair_the_Wharves:"修坞"
 YLH_PW_Repair_the_Wharves_desc:"修坞先修最旧的第三号。木料是随北国军械船运来的，钉子却是本地打的。工匠问要不要等图纸，达达利亚说：先按老样子修，能停船就行。第一艘船靠上修好的坞那天，他站在岸上看完了全程。"
 YLH_PW_Northern_Machines:"北械到港"
 YLH_PW_Northern_Machines_desc:"至冬的机器一箱箱卸下来，装箱单上写着型号，也写着价钱。达达利亚亲手开了一箱，摸了摸里面的新齿轮，对管事说：机器比人可靠，坏了能修。人也得学着像机器一样，坏了先转起来，别急着喊疼。"
 YLH_PW_The_Salt_Office:"盐政衙门"
 YLH_PW_The_Salt_Office_desc:"盐政衙门挂牌那天，门口排了长长一队。达达利亚定下规矩：盐引先发给小船户，大户押后。有盐商托人来问缘由，他答：大户等得起，小船户等不起。这话传出去，港里的船户都记下了他的名字。"
 YLH_PW_The_Dockyard_Quota:"船坞之额"
 YLH_PW_The_Dockyard_Quota_desc:"船坞的额写在木牌上，一旬一换。达达利亚不派人催，只把牌子挂在坞口，让领班的自己去看。他说：额是死的，人是活的，把额看清楚，比听我讲十句话都管用。有领班偷领了料，下一旬牌子上就少了他一栏。"
 YLH_PW_Warehouse_of_the_Sea:"海仓"
 YLH_PW_Warehouse_of_the_Sea_desc:"海仓的货堆到房梁，盐、铁、粮、布分开码放，账目一栏不漏。管仓的老头从前是七星的人，达达利亚留了他，只在仓门口加了一句：账没错，人就不换。老头从此记账更细，连鼠咬的一角都记得清清楚楚。"
 YLH_PW_Smelters_by_the_Tide:"海滨的炉子"
 YLH_PW_Smelters_by_the_Tide_desc:"海滨的炉子日夜不熄，火光映在浪上。达达利亚去看过一回，问炉工一天能出多少铁。炉工答了个数，他摇头：再省一成炭，就够多养一个班。回头他让人给炉工加了饷，只留一句：炉子烧的是铁，也是这座城的命。"
 YLH_PW_The_Five_Banners:"五面旗"
 YLH_PW_The_Five_Banners_desc:"刻晴、凝光、甘雨、申鹤、蓝砚的名字各写一张，钉在舆图旁。达达利亚看着这五张纸说：打下来的地靠刀守不住，得靠人情和账目。他让人分头送礼，礼单不同，措辞也不同，送出之前自己把每一封都过了一遍。"
 YLH_PW_Envoy_to_Yuheng:"玉衡闭门"
 YLH_PW_Envoy_to_Yuheng_desc:"使者去了玉衡，吃了闭门羹，回来时脸色难看。达达利亚听完反倒笑了：她连见都不肯见，说明她还当我是对手。他命人送去一船军械，附一句话：你的兵缺枪，我的账缺个讲规矩的对手。"
 YLH_PW_Envoy_to_the_Jade_Chamber:"群玉阁的算盘"
 YLH_PW_Envoy_to_the_Jade_Chamber_desc:"群玉阁的应对客气而滴水不漏，句句都在算利。达达利亚听完回报，敲着桌面说：凝光懂价钱，我也懂。两个都算得清的人，谈不拢，也翻不了脸。他让人备了一份厚礼，礼单头一项写的是航路抽成。"
 YLH_PW_Envoy_to_Yuehai_Pavilion:"月海亭的人"
 YLH_PW_Envoy_to_Yuehai_Pavilion_desc:"月海亭的回复只有一句：港口可以让，人不能少。达达利亚读完，把信在灯上照了照，对副官说：她争的是人，不是钱，这种人最难对付。当天他破例免了月海亭一带三个月的捐，理由只写了两个字。"
 YLH_PW_Envoy_to_Jueyun_Karst:"绝云间的绢"
 YLH_PW_Envoy_to_Jueyun_Karst_desc:"绝云间的回信写在雪白的绢上，只有八个字：路可以让，人不低头。达达利亚把那片绢读了很久，收进贴身的衣袋。他对部下说：这世上我最敬重的，就是这种连价钱都不报的人。她给的答案，比金子贵。"
 YLH_PW_Envoy_to_Chenyu_Vale:"沉玉谷的谷种"
 YLH_PW_Envoy_to_Chenyu_Vale_desc:"沉玉谷的使者一身泥，谈的不是港也不是城，只求别动那片谷地。达达利亚听完，停了停手里的枪，说了一句有点意思，就吩咐下去：沉玉谷的事先搁着。属下问为什么，他说：我想看看，她能守住多久。"
 YLH_PW_Concordat_of_the_Five:"五方通约"
 YLH_PW_Concordat_of_the_Five_desc:"五方通约写成一册，各留一份，条款里没有一字称臣。达达利亚在末尾添了一句：约在，人就还有得谈。交给五方使者那天，他破天荒没有笑，只说：往后的路，走一步算一步。五个人各自收了册子，谁也没有先走。"
 YLH_PW_The_Seat_at_Celestia:"天上的座位"
 YLH_PW_The_Seat_at_Celestia_desc:"天空岛始终没有回音。达达利亚把一封写给天理的信搁在案头，反复改了三遍。他对幕僚说：女皇要天上的东西，璃月人恨天上的东西，我倒只想弄清楚，它到底还在不在。信终究没有寄出去，被他压在了海图底下。"
 YLH_PW_The_Queens_Enemy:"女皇的敌人"
 YLH_PW_The_Queens_Enemy_desc:"至冬要反天理，璃月也恨天理，两家的敌人是同一个。达达利亚心里清楚，这件事上他和女皇站在一边，可等天理真的倒了呢。他望着北边的天，低声说：到那天，谁先动刀，就难说了。说完他自己顿了顿。"
 YLH_PW_Traders_of_the_Deep:"深渊的买卖"
 YLH_PW_Traders_of_the_Deep_desc:"深渊的使者来谈买卖，出的价码高得让人心里发毛。达达利亚听完条件，没有急着答应，只问了一句：你们要的东西，会不会有一天反过来要我的命。使者笑着不答，他也笑，把那份合约搁到了一边。"
 YLH_PW_The_Abyss_Ledger:"渊债"
 YLH_PW_The_Abyss_Ledger_desc:"渊债记的是层岩深处那些换命的名目：矿工、封井人、失踪的勘队。达达利亚翻着账，对账房说：这些名字收进总账，按月划一笔钱。账房问这算不算亏本。他答：算。可有些账，本来就不该拿赚没赚来算。"
 YLH_PW_The_Sealed_Well:"封井"
 YLH_PW_The_Sealed_Well_desc:"封井用的是至冬的合金和新法，闸门一层层落下。达达利亚亲自到井口看最后一闸。井下的风又冷又硬，他在井口站了很久。出来时他说：底下埋的，是一件谁去动谁就得赔命的旧东西。安全绳他自己收好了。"
 YLH_PW_The_Price_of_Heaven:"天理的价钱"
 YLH_PW_The_Price_of_Heaven_desc:"关于神谕、仙人和天命的卷宗堆了半间库房，达达利亚让人逐条核过。他对幕僚说：女皇也在算这笔账，只是她算的是怎么打，我算的是怎么活。这两本账，早晚有一天，要摊在桌面上对一对。"
 YLH_PW_The_Grey_Regiments:"灰旅"
 YLH_PW_The_Grey_Regiments_desc:"灰旅的旗子是旧的，兵也是旧的，半数是雇来的亡命。达达利亚检阅时不讲忠义，只说一桩：饷按月发，伤了给治，死了抚恤送到家。他说：你们替我打仗，我替你们把话说明白，这就够了。队伍里有人先鼓了掌。"
 YLH_PW_Drills_on_the_Salt:"盐滩操演"
 YLH_PW_Drills_on_the_Salt_desc:"盐滩上操演，日头毒得能把枪管晒烫。新兵倒了一片，达达利亚立在看台上，没有叫停。操演结束，他亲自给每个晕倒的兵倒水，说：今天在滩上倒，是站得起来的倒；在战场上倒，就再站不起来了。"
 YLH_PW_The_Gun_Brokers:"售枪人"
 YLH_PW_The_Gun_Brokers_desc:"售枪人是从各处来的掮客，箱子里什么货都有。达达利亚见他们，只谈两件事：价和验货。他说：我不怕你们的枪有脾气，就怕你们的账不清楚。第一批货验完，他当场扣下两成，字据上只写了五个字：价高了一分。"
 YLH_PW_The_Admirals:"提督们"
 YLH_PW_The_Admirals_desc:"提督们围着海图坐成一圈，为一条航线的抽成争到半夜。达达利亚听了半宿，最后拍板：谁护航，谁分润。散会时，一个老提督拍着他的肩说，你这人讲理。他笑：我不讲理，我讲账。老提督也笑，说这两样你都有。"
 YLH_PW_The_Fortress_Harbor:"要塞港"
 YLH_PW_The_Fortress_Harbor_desc:"要塞港不修城墙，只修炮台和船闸。达达利亚的主意很直接：敌人来的是船，不是马。炮位图上他亲手添了三处，说：这三处不打仗，只让人看见。看见了，就不用打了。动土那天他没有到场，只送去一坛酒。"
 YLH_PW_The_Raven_Standard:"渡鸦旗"
 YLH_PW_The_Raven_Standard_desc:"渡鸦旗升上主桅那天，全港的船一齐鸣笛。达达利亚没有致辞，只望着满港的旗，忽然对副将说：这面旗底下，一半是至冬的兵，一半是璃月的人。将来这面旗要倒，多半也是倒在自己人手里。"
 YLH_PW_The_Fork:"岔口"
 YLH_PW_The_Fork_desc:"云来海到了要选路的时候：一头是继续靠着北国，一头是借着北国的力，自己站成一方。达达利亚把两份草稿并排摆在桌上，一夜没睡。天亮时他说：这一笔签下去，就没有回头路了。他先签了左边那份。"
 YLH_PW_A_Northern_Patron:"北国恩主"
 YLH_PW_A_Northern_Patron_desc:"北国的恩主给得爽快：钱、粮、枪、船，一样不缺，条件写在合约最末一页，字很小。达达利亚盯着那一页看了很久，还是签了。他说：先活下来，别的以后再说。副官想劝，被他抬手拦住了。"
 YLH_PW_A_Court_of_Advisors:"顾问之廷"
 YLH_PW_A_Court_of_Advisors_desc:"顾问之廷设在旧商会里，说话的是北国来的人。本地官吏事事要问过顾问，日子一久，连口音都学了三分。达达利亚看在眼里，只在一次会上淡淡说了一句：你们问得越勤，主事的人就越不像主事的人。满堂无人应声。"
 YLH_PW_A_The_Tribute_Road:"岁贡之道"
 YLH_PW_A_The_Tribute_Road_desc:"岁贡的车队一季一趟，押的是盐、铁和云来的丝。达达利亚命人在贡道旁立碑，碑上不写贡字，只写通商。老吏问他为何，他说：写贡是给北国看的，写通商是给自己人看的。两块牌子，是同一件事。"
 YLH_PW_A_The_Eagle_Garrison:"鹰旗下的驻军"
 YLH_PW_A_The_Eagle_Garrison_desc:"鹰旗下的驻军编成两营，一营守港，一营驻城。饷由北国出，号令也由北国下。达达利亚检阅那天，看着满场整齐的兵，忽然对副官说：这些人我调不动，将来出了事，第一个站出来替北国收场的，是我。"
 YLH_PW_A_The_Customs_Seized:"关榷北属"
 YLH_PW_A_The_Customs_Seized_desc:"关榷交出去那天，税吏换了新印。本地商人排队过关，队伍比从前长了一倍，没有人说话。达达利亚站在关楼上看了一上午，只说了一句：从今天起，这港口挣的钱，先过一遍北国的手。说完他下了楼。"
 YLH_PW_A_The_Viceroy_Banner:"总督之旗"
 YLH_PW_A_The_Viceroy_Banner_desc:"总督之旗挂在府衙正门。达达利亚偶尔进去坐坐，看那位名义总督理事。有一回总督问他，自己算不算主人。他答：算。只是你主的事，北国先点了头。总督没有再问，两人都笑了，笑得都不太好看。"
 YLH_PW_A_Northern_Schools:"北学"
 YLH_PW_A_Northern_Schools_desc:"北学开了三门课：算学、军制、北语。第一批学生里有不少旧吏的子弟。达达利亚去看过一堂北语课，回来后对幕僚说：教他们北语，是让他们看得懂北国写的文书。看不看得懂是他们的事，写不写得清楚是北国的事。"
 YLH_PW_A_The_Frozen_Allegiance:"冰誓"
 YLH_PW_A_The_Frozen_Allegiance_desc:"冰誓那天，云来海落了雪。达达利亚换上一身北国礼服，当众宣誓，誓词很长，他一个字没改。礼成之后，他独自回到船上，把礼服脱下来叠好，压进箱底。箱盖落了灰，此后他再没有打开过那只箱子。"
 YLH_PW_B_Stand_on_the_Sea:"立海"
 YLH_PW_B_Stand_on_the_Sea_desc:"立海的第一步是换旗。达达利亚让人把船队的旗重画了一遍：仍是那面渡鸦，只是爪下不再是冰纹，改成了一条浪。画工问他这样算不算背弃北国。他说：旗是拿来认路的，不是拿来认主的。画工把浪画得更长了些。"
 YLH_PW_B_The_Convoy_Charter:"护航宪章"
 YLH_PW_B_The_Convoy_Charter_desc:"护航宪章写得比军令还细：几船一队，走哪条线，出事谁负责，写得清清楚楚。达达利亚把它贴在船户常去的茶馆里，说：字写明白，海上的事就少一半麻烦。头一个月，过路的船户都要停下来看上一眼。"
 YLH_PW_B_The_Far_Caravans:"远洋商队"
 YLH_PW_B_The_Far_Caravans_desc:"远洋商队头一回出海，二十七条船，去的是没人挂过旗的地方。达达利亚在码头送了半程。有船长问他怕不怕亏，他答：怕。可停在港里的船，一辈子也挣不回一条新航线。船队转过灯塔时，他在岸上站了很久。"
 YLH_PW_B_Crux_Fleet:"南十字合流"
 YLH_PW_B_Crux_Fleet_desc:"南十字的船队合流那天，海面上旗色杂乱，看着像一整个集市。有人劝达达利亚收编他们。他说：收编了就成了我的兵，到时候他死一个人，我就得赔。不如合着走，各算各的账，反而走得远。那夜两家船长喝到很晚。"
 YLH_PW_B_Overseas_Stations:"海外补给点"
 YLH_PW_B_Overseas_Stations_desc:"海外补给点一处一处地修，先修淡水，再修煤，最后才修炮。达达利亚说：补给点是给船用的，不是给仗用的。第一个点落成时，他只让人在门口立了块木牌，写着此处可停三日。后来那块木牌被人描了又描。"
 YLH_PW_B_Repudiate_the_Quota:"拒额"
 YLH_PW_B_Repudiate_the_Quota_desc:"北国的催额又到了，比去年多三成。达达利亚把文书搁了三天，回了一封极短的信：今年的额，只按原数交。信送出去那天，港里的风声都紧了。他照旧在甲板上练枪，练完对副官说：他们再来问，你们别开口。"
 YLH_PW_B_Salt_and_Iron_Ours:"盐铁自主"
 YLH_PW_B_Salt_and_Iron_Ours_desc:"盐和铁从前大半要过北国的手，如今一条条收回来。盐引换成了本地印，铁器只销本港。有老商问这样会不会惹恼北国。达达利亚答：惹恼是迟早的事，早晚不如早。他让账房重新起了一本册子，封面什么都没写。"
 YLH_PW_B_The_Sovereign_Sea:"自主海权"
 YLH_PW_B_The_Sovereign_Sea_desc:"自主海权落在纸上的那天，云来海挂出了自己的旗。达达利亚站在旗舰船头，望着浪上那片旗影，对身边人说：从今天起，这片海上的规矩，我们自己定。定得好不好，往后才知道。他让人把旧航图也留下，一张都没烧。"
 YLH_PW_Children_of_the_Port:"港口的孩子"
 YLH_PW_Children_of_the_Port_desc:"码头边有一群没爹没娘的孩子，白天帮人扛货，夜里睡在船底。达达利亚撞见他们在滚铁环，站住看了一会儿。一个孩子问他是不是坏人。他答：说不清，等你们长大些，自己看。他吩咐管事给这群孩子单记一档，管两顿饭。"
 YLH_PW_The_Chasm_Barges:"巨渊驳船"
 YLH_PW_The_Chasm_Barges_desc:"巨渊下来的驳船一条接一条，装的矿料和旧物不下册。达达利亚对这条线睁一只眼闭一只眼，只收一道固定的抽成。有部下问这是不是纵容。他答：管一座城，得给胆大的人留条活路，不然他们去找别的活路，那更麻烦。"
 YLH_PW_Cloud_Sea_Settled:"云来落定"
 YLH_PW_Cloud_Sea_Settled_desc:"两条路走到尽头，都回到同一个码头。达达利亚把两年来所有的租约、航图和军约摊开，重写成一册。他在扉页上写：云来海是至冬的，也是自己的。写完看了很久，没有撕掉这一页。管卷宗的人接过册子时，看见纸角是湿的。"
 YLH_PW_The_Long_Freeze:"长冻"
 YLH_PW_The_Long_Freeze_desc:"长冻是一段没有大事的日子：船照开，税照收，北国的账照催，海上的旗照升。达达利亚渐渐不再天天上甲板，只在夜里听一会儿浪。他对来探望的旧部下说：没事，就是有点太安静。旧部下点点头，也没找出别的话。"
 YLH_PW_The_Tide_Returns:"潮回"
 YLH_PW_The_Tide_Returns_desc:"多年以后，云来海的潮汐依旧准点。达达利亚老了，港口却比他在时更热闹。有个年轻人问他，当年那些旗子谁赢了。他想了想，答：旗子从来不赢，赢的是还留在这条船上的人。年轻人没听懂，他也没有再解释。"

 YLH_postwar_category:"云来新局"
 YLH_postwar_category_desc:"达达利亚的双轴战后决议组。北援量的是他从至冬讨回来的兵、钱与枪，海权量的是云来海在提瓦特还剩多少自己能做主的航道。两样都想攥在手里，就得两头掂量：讨好北国，海上的旗就悬着；只顾海上，北国的账就催上门。"
 YLH_decision_pw_convoy_patrol:"护航巡弋"
 YLH_decision_pw_convoy_patrol_desc:"护航的船队一旬一趟，把主航道从头走到尾。遇上不长眼的，先鸣笛，再开炮。达达利亚说：这条线走顺了，挂我们旗的船，就没人敢随便拦。"
 YLH_decision_pw_salt_issue:"发盐引"
 YLH_decision_pw_salt_issue_desc:"盐引先给小船户，大户押后。一张引子换一担盐，账上记得清清楚楚。有人嫌麻烦，达达利亚只答一句：麻烦是给不出盐的人准备的。"
 YLH_decision_pw_north_loan:"北国借款"
 YLH_decision_pw_north_loan_desc:"借来的钱是热的，抵押的东西是冷的。达达利亚签字时总要盯着抵押那一栏看很久，看完还要问一句：这一条，将来能不能改。"
 YLH_decision_pw_grain_relief:"放赈"
 YLH_decision_pw_grain_relief_desc:"放赈的棚子一天两顿，谁来都给。有人劝达达利亚查一查有没有冒领的。他说：查得再细，也堵不住一个饿字。先把锅烧上。"
 YLH_decision_pw_winter_drill:"雪原操演"
 YLH_decision_pw_winter_drill_desc:"雪原操演练的是忍耐：冻伤、旧伤、沉默，三样齐全。达达利亚看完只说一句：今天恨我，往后会谢我。说完他给每个兵倒了一碗酒。"
 YLH_decision_pw_customs_sweep:"清关"
 YLH_decision_pw_customs_sweep_desc:"清关先清账，后清人。查出来的货照扣，查出来的人照放。达达利亚说：我要的是账目干净，不是人头落地。账干净了，港才立得住。"
 YLH_decision_pw_envoy_keqing:"遣使玉衡"
 YLH_decision_pw_envoy_keqing_desc:"使者赴玉衡，多半吃闭门羹。达达利亚从不恼，还派人送枪过去。他说：一个算得过账的对手，比只会喊口号的对手，更值得我送一船军械。"
 YLH_decision_pw_envoy_ningguang:"遣使群玉阁"
 YLH_decision_pw_envoy_ningguang_desc:"群玉阁只谈利，达达利亚也只谈利。两方把算盘摆在桌上，你来我往，谈到天黑也没签。他说：谈不拢没关系，别翻脸就行。"
 YLH_decision_pw_envoy_ganyu:"遣使月海亭"
 YLH_decision_pw_envoy_ganyu_desc:"月海亭要的人，达达利亚给；月海亭不要的港，达达利亚也不强要。他说：跟争人的人打交道，得先把自己的账本收起来，不然谈不下去。"
 YLH_decision_pw_envoy_shenhe:"遣使绝云间"
 YLH_decision_pw_envoy_shenhe_desc:"绝云间回信只有八个字，达达利亚却把那片绢收进了贴身衣袋。他对副官说：她连价都不报，我这个人，反倒不好开口了。"
 YLH_decision_pw_envoy_lanyan:"遣使沉玉谷"
 YLH_decision_pw_envoy_lanyan_desc:"沉玉谷的使者只谈水、土和谷种。达达利亚听完，停了手里的枪，说：头一回有人来找我，不要钱，只要我别动手。他让人把谷地的事先记下。"
 YLH_decision_pw_proclaim_settlement:"颁行云来章程"
 YLH_decision_pw_proclaim_settlement_desc:"把租约、通约、税则并成一册，念给全港听。达达利亚念到最后一条时停了一下，说：从今天起，这港口的事，一半按老规矩，一半按新规矩。"

 LYY_Event.12001.t:"云来换旗"
 LYY_Event.12001.d:"停火的那个清晨，云来海的雾还没散。达达利亚让人把至冬的鹰旗升上最高一根桅杆，旗子在湿风里半卷着，码头上一片安静。\n他站在旗舰船头看了很久，才对副官说：从今天起，这港口的进出归我管，账要重记，人别乱动。"
 LYY_Event.12001.a:"以商之名，接管云来"
 LYY_Event.12001.b:"暂守现状，静观其变"
 LYY_Event.12002.t:"清墟第一日"
 LYY_Event.12002.d:"清墟是从拆第一堵断墙开始的。达达利亚在边上看了半日，忽然问身边的老吏，这一片从前住着多少户。\n老吏答不上来。他点点头：那就从头数，数清楚了再动手修。当天下午，港口的工匠名册就多出一栏，专记谁的家在哪儿。"
 LYY_Event.12002.a:"从头数起，清了再修"
 LYY_Event.12002.b:"先搭棚安置，边住边修"
 LYY_Event.12003.t:"一碗粥"
 LYY_Event.12003.d:"赈粮的棚子搭在码头边，一天两顿稀粥。有人问达达利亚，饿着的人这么多，粮从哪来。\n他答：先从北国赊，赊来的粮也是粮。队伍里有个抱孩子的妇人，他把自己碗里的粥分了一半过去，没有多说，转身去看下一口锅。"
 LYY_Event.12003.a:"先赊粮救急，不问来路"
 LYY_Event.12003.b:"只赈在册的丁口"
 LYY_Event.12004.t:"复市那杆秤"
 LYY_Event.12004.d:"复市那杆秤是新打的，秤砣上刻着一行小字：缺一两，赔十两。达达利亚让人把它挂在市口最显眼的地方。\n头一天，有个摊主短了半两，当场被罚。看热闹的人以为要闹起来，第二天来摆摊的，反倒比头一天多了一倍。"
 LYY_Event.12004.a:"挂秤市口，缺一赔十"
 LYY_Event.12004.b:"由行会自定秤规"
 LYY_Event.12005.t:"抚册上的名字"
 LYY_Event.12005.d:"抚册要把云来海每一户的名字、口粮、欠账都写清楚。达达利亚翻着册子对幕僚说：我要知道谁还活着，谁还能干活。\n有官吏嫌查得太细，他就把人叫到跟前，指着册子说：写细一点，将来出事，第一个被问的是你，不是他们。"
 LYY_Event.12005.a:"一户一行，务求详尽"
 LYY_Event.12005.b:"只登丁口，不问家产"
 LYY_Event.12006.t:"港口的孩子"
 LYY_Event.12006.d:"码头边上有一群没爹没娘的孩子，白天帮人扛货，夜里睡在船底。达达利亚撞见他们滚铁环，站住看了一会儿。\n一个孩子问他是不是坏人。他答：说不清，等你们长大些，自己看。他吩咐管事给这群孩子单记一档，管两顿饭。"
 LYY_Event.12006.a:"单记一档，管孩子两顿饭"
 LYY_Event.12006.b:"驱散闲人，整肃码头"
 LYY_Event.12007.t:"修坞"
 LYY_Event.12007.d:"修坞先修最旧的第三号。木料是随北国军械船运来的，钉子却是本地打的。\n工匠问要不要等图纸。达达利亚说：先按老样子修，能停船就行。第一艘船靠上修好的坞那天，他站在岸上，从头看到了尾。"
 LYY_Event.12007.a:"按老样子修，能停便成"
 LYY_Event.12007.b:"等图纸齐备，再行动工"
 LYY_Event.12008.t:"北械到港"
 LYY_Event.12008.d:"至冬的机器一箱箱卸下来，装箱单上写着型号，也写着价钱。达达利亚亲手开了一箱，摸了摸里面的新齿轮。\n他对管事说：机器比人可靠，坏了能修。人也得学着像机器一样，坏了先转起来，别急着喊疼。管事听懂了，当天就加了一班。"
 LYY_Event.12008.a:"购北械，先转起来"
 LYY_Event.12008.b:"就地仿造，不求外援"
 LYY_Event.12009.t:"盐引"
 LYY_Event.12009.d:"盐政衙门挂牌那天，门口排了长队。达达利亚定下一条：盐引先发给小船户，大户押后。\n有盐商托人来问缘由。他答：大户等得起，小船户等不起。这话传到码头，船户们记住了他的名字，也记住了这条规矩。"
 LYY_Event.12009.a:"盐引先给小船户"
 LYY_Event.12009.b:"盐引尽付大户包销"
 LYY_Event.12010.t:"船坞之额"
 LYY_Event.12010.d:"船坞的额写在木牌上，一旬一换。达达利亚不派人催，只把牌子挂在坞口，让领班的自己去看。\n有个领班偷着多领了一份料，下一旬牌子上就少了他一栏。他去理论，达达利亚只说：额是死的，人是活的，你看清楚，比听我说十句都管用。"
 LYY_Event.12010.a:"额挂坞口，自行对照"
 LYY_Event.12010.b:"派员督查，按旬核账"
 LYY_Event.12011.t:"海仓"
 LYY_Event.12011.d:"海仓的货堆到房梁，盐、铁、粮、布分开码放，账目一栏不漏。管仓的老头从前是七星的人。\n达达利亚留下他，只在仓门口加了一句：账没错，人就不换。老头从此记账更细，连鼠咬的一角都记得清清楚楚。"
 LYY_Event.12011.a:"账不错，人不换"
 LYY_Event.12011.b:"改用亲信，重立仓规"
 LYY_Event.12012.t:"海滨的炉子"
 LYY_Event.12012.d:"海滨的炉子日夜不熄，火光映在浪上。达达利亚去看过一回，问炉工一天能出多少铁。\n炉工答了个数。他摇头：再省一成炭，就够多养一个班。回头他让人给炉工加了饷，只留一句：炉子烧的是铁，也是这座城的命。"
 LYY_Event.12012.a:"加饷留炉工"
 LYY_Event.12012.b:"减耗增额，不问工食"
 LYY_Event.12013.t:"巨渊驳船"
 LYY_Event.12013.d:"巨渊下来的驳船一条接一条，装的矿料和旧物不下册。达达利亚对这条线睁一只眼闭一只眼，只收一道固定的抽成。\n有部下问这是不是纵容。他答：管一座城，得给胆大的人留条活路，不然他们会去找别的活路，那更麻烦。"
 LYY_Event.12013.a:"默许驳船，抽成分利"
 LYY_Event.12013.b:"严禁私运，整肃水道"
 LYY_Event.12014.t:"北使上岸"
 LYY_Event.12014.d:"北国的使节踩着跳板上岸，随行的箱子里一半是礼，一半是条款。达达利亚亲自到码头迎。\n寒暄过后，使节递上清单。他扫了一眼，笑着说：礼我收，条款放一放。使节也笑，说这笔账早晚要算。他说：那就算晚一点。"
 LYY_Event.12014.a:"收礼不签条款"
 LYY_Event.12014.b:"照单全收，早定名分"
 LYY_Event.12015.t:"寒贷"
 LYY_Event.12015.d:"北国的贷款条件写得不坏：利息低，期限长，抵押物那一栏却留了很久的空白。达达利亚盯着那一栏看了半天。\n最后他填上：云来关税。签完他对账房说：借来的钱是热的，抵押的东西是冷的。热的用完，冷的还在别人手里。"
 LYY_Event.12015.a:"以关税作抵，先借再说"
 LYY_Event.12015.b:"拒其贷款，另筹别款"
 LYY_Event.12016.t:"跨海的顾问"
 LYY_Event.12016.d:"顾问们跨海而来，说话有礼，动手很快。港里的办事章程一页页换成新的，署名底下是至冬的字。\n有旧吏抱怨插不上话。达达利亚听见了，只说：他们教你们办事，你们教他们认路。谁学得快，将来谁说了算，这话不用我挑明。"
 LYY_Event.12016.a:"学得快的人说了算"
 LYY_Event.12016.b:"只用本地旧吏，拒北人"
 LYY_Event.12017.t:"五面旗"
 LYY_Event.12017.d:"刻晴、凝光、甘雨、申鹤、蓝砚的名字各写一张，钉在舆图旁。达达利亚看着这五张纸说：打下来的地靠刀守不住，得靠人情和账目。\n他让人分头送礼，礼单不同，措辞也不同。送出去之前，他把每一封都过了一遍。"
 LYY_Event.12017.a:"五方分头送礼"
 LYY_Event.12017.b:"集中一路，先稳住一方"
 LYY_Event.12018.t:"玉衡闭门"
 LYY_Event.12018.d:"使者去了玉衡，吃了闭门羹，回来时脸色难看。达达利亚听完，反倒笑了：她连见都不肯见，说明她还当我是对手。\n他命人送去一船军械，附一句：你的兵缺枪，我的账缺个讲规矩的对手。使者不敢送，他就自己签了令。"
 LYY_Event.12018.a:"送军械，认这个对手"
 LYY_Event.12018.b:"断绝往来，不必再送"
 LYY_Event.12019.t:"群玉阁的算盘"
 LYY_Event.12019.d:"群玉阁的应对客气而滴水不漏，句句都在算利。达达利亚听完回报，敲着桌面说：凝光懂价钱，我也懂。\n他让人备了一份厚礼，礼单头一项写的是航路抽成。副官问这算不算吃亏，他答：两个都算得清的人，谈不拢，也翻不了脸。"
 LYY_Event.12019.a:"备厚礼，谈航路抽成"
 LYY_Event.12019.b:"不与之谈，各行其是"
 LYY_Event.12020.t:"月海亭的人"
 LYY_Event.12020.d:"月海亭的回复只有一句：港口可以让，人不能少。达达利亚读完，把信在灯上照了照。\n他对副官说：她争的是人，不是钱，这种人最难对付。当天他破例免了月海亭一带三个月的捐，理由只写了两个字：敬重。"
 LYY_Event.12020.a:"免其三月之捐"
 LYY_Event.12020.b:"照章征收，不徇私情"
 LYY_Event.12021.t:"绝云间的绢"
 LYY_Event.12021.d:"绝云间的回信写在雪白的绢上，只有八个字：路可以让，人不低头。达达利亚把那片绢读了很久。\n他把绢收进贴身的衣袋，对部下说：这世上我最敬重的，就是这种连价钱都不报的人。她给的答案，比金子贵。"
 LYY_Event.12021.a:"珍藏那片白绢"
 LYY_Event.12021.b:"弃之不理，视为虚文"
 LYY_Event.12022.t:"沉玉谷的谷种"
 LYY_Event.12022.d:"沉玉谷的使者一身泥，谈的不是港也不是城，只求别动那片谷地。达达利亚听完，停了停手里的枪。\n他说了一句有点意思，就吩咐下去：沉玉谷的事先搁着。属下问为什么，他说：我想看看，她能守住多久。"
 LYY_Event.12022.a:"暂不动沉玉谷"
 LYY_Event.12022.b:"即刻开发谷地"
 LYY_Event.12023.t:"五方通约"
 LYY_Event.12023.d:"五方通约写成一册，各留一份，条款里没有一字称臣。达达利亚在末尾添了一句：约在，人就还有得谈。\n交给五方使者那天，他破天荒没有笑，只说：往后的路，走一步算一步。五个人各自收了册子，谁也没有先走。"
 LYY_Event.12023.a:"立五方通约"
 LYY_Event.12023.b:"罢约，只凭刀兵"
 LYY_Event.12024.t:"天上的座位"
 LYY_Event.12024.d:"天空岛始终没有回音。达达利亚把一封写给天理的信搁在案头，反复改了三遍。\n他对幕僚说：女皇要天上的东西，璃月人恨天上的东西，我倒只想弄清楚，它到底还在不在。信终究没有寄出去，他把它压在了海图底下。"
 LYY_Event.12024.a:"写信问天，搁置不发"
 LYY_Event.12024.b:"焚去信稿，不再问天"
 LYY_Event.12025.t:"女皇的敌人"
 LYY_Event.12025.d:"至冬要反天理，璃月也恨天理，两家的敌人是同一个。达达利亚心里清楚，这件事上他和女皇站在一边。\n可等天理真的倒了呢。他望着北边的天，低声说：到那天，谁先动刀，就难说了。说完他自己顿了顿，像是被这句话吓了一跳。"
 LYY_Event.12025.a:"与女皇同仇，先反天理"
 LYY_Event.12025.b:"留一手，看风向再动"
 LYY_Event.12026.t:"深渊的买卖"
 LYY_Event.12026.d:"深渊的使者来谈买卖，出的价码高得让人心里发毛。达达利亚听完条件，没有急着答应。\n他只问了一句：你们要的东西，会不会有一天反过来要我的命。使者笑着不答，他也笑，把合约搁到一边。那份合约后来一直搁在那里。"
 LYY_Event.12026.a:"收下合约，徐徐图之"
 LYY_Event.12026.b:"当场回绝，不留后患"
 LYY_Event.12027.t:"渊债"
 LYY_Event.12027.d:"渊债记的是层岩深处那些换命的名目：矿工、封井人、失踪的勘队。达达利亚翻着账，对账房说：这些名字收进总账，按月划一笔钱。\n账房问这算不算亏本。他答：算。可有些账，本来就不该拿赚没赚来算。"
 LYY_Event.12027.a:"收名入账，按月划钱"
 LYY_Event.12027.b:"只记己方死者"
 LYY_Event.12028.t:"封井"
 LYY_Event.12028.d:"封井用的是至冬的合金和新法，闸门一层层落下。达达利亚亲自到井口看最后一闸。\n井下的风又冷又硬，他在井口站了很久。出来时他说：底下埋的，是一件谁去动谁就得赔命的旧东西。说完他把安全绳解下来，亲手收好。"
 LYY_Event.12028.a:"铸新闸，亲下井口"
 LYY_Event.12028.b:"循旧法，勉力维持"
 LYY_Event.12029.t:"天理的价钱"
 LYY_Event.12029.d:"关于神谕、仙人和天命的卷宗堆了半间库房，达达利亚让人逐条核过。\n他对幕僚说：女皇也在算这笔账，只是她算的是怎么打，我算的是怎么活。这两本账，早晚有一天，要摊在桌面上对一对。"
 LYY_Event.12029.a:"两本账都记着"
 LYY_Event.12029.b:"只算能活的这本"
 LYY_Event.12030.t:"灰旅"
 LYY_Event.12030.d:"灰旅的旗子是旧的，兵也是旧的，半数是雇来的亡命。达达利亚检阅时不讲忠义，只说一桩。\n他说：饷按月发，伤了给治，死了抚恤送到家。你们替我打仗，我替你们把话说明白，这就够了。队伍里安静了一阵，然后有人先鼓了掌。"
 LYY_Event.12030.a:"饷足恤厚，话说明白"
 LYY_Event.12030.b:"以忠义相绳，薄饷练兵"
 LYY_Event.12031.t:"盐滩操演"
 LYY_Event.12031.d:"盐滩上操演，日头毒得能把枪管晒烫。新兵倒了一片，达达利亚立在看台上，没有叫停。\n操演结束，他亲自给每个晕倒的兵倒水，说：今天在滩上倒，是站得起来的倒；在战场上倒，就再站不起来了。第二天，没有人再随便倒下。"
 LYY_Event.12031.a:"盐滩苦练，不倒不停"
 LYY_Event.12031.b:"避暑减操，恤其体力"
 LYY_Event.12032.t:"售枪人"
 LYY_Event.12032.d:"售枪人是从各处来的掮客，箱子里什么货都有。达达利亚见他们，只谈两件事：价和验货。\n他说：我不怕你们的枪有脾气，就怕你们的账不清楚。第一批货验完，他当场扣下两成，理由写在字据上，只有五个字：价高了一分。"
 LYY_Event.12032.a:"验货扣价，分毫不让"
 LYY_Event.12032.b:"照价全收，以示诚意"
 LYY_Event.12033.t:"提督们"
 LYY_Event.12033.d:"提督们围着海图坐成一圈，为一条航线的抽成争到半夜。达达利亚听了半宿，最后拍板：谁护航，谁分润。\n散会时，一个老提督拍着他的肩说，你这人讲理。他笑：我不讲理，我讲账。老提督也笑，说这两样你都有，难办。"
 LYY_Event.12033.a:"谁护航，谁分润"
 LYY_Event.12033.b:"抽成统归公库"
 LYY_Event.12034.t:"要塞港"
 LYY_Event.12034.d:"要塞港不修城墙，只修炮台和船闸。达达利亚的主意很直接：敌人来的是船，不是马。\n炮位图上他亲手添了三处，说：这三处不打仗，只让人看见。看见了，就不用打了。工程动土那天，他没有到场，只让人送了一坛酒。"
 LYY_Event.12034.a:"只修炮台与船闸"
 LYY_Event.12034.b:"广筑城墙，全面设防"
 LYY_Event.12035.t:"渡鸦旗"
 LYY_Event.12035.d:"渡鸦旗升上主桅那天，全港的船一齐鸣笛。达达利亚没有致辞。\n他望着满港的旗，忽然对副将说：这面旗底下，一半是至冬的兵，一半是璃月的人。将来这面旗要倒，多半也是倒在自己人手里。副将没有接话。"
 LYY_Event.12035.a:"两面旗并挂"
 LYY_Event.12035.b:"只升北国一旗"
 LYY_Event.12036.t:"岔口"
 LYY_Event.12036.d:"云来海到了要选路的时候：一头是继续靠着北国，一头是借着北国的力，自己站成一方。\n达达利亚把两份草稿并排摆在桌上，一夜没睡。天亮时他说：这一笔签下去，就没有回头路了。他先签了左边那份，又把它推到一边。"
 LYY_Event.12036.a:"借北国之力，自立一方"
 LYY_Event.12036.b:"继续依附北国，不另立旗"
 LYY_Event.12037.t:"北国恩主"
 LYY_Event.12037.d:"北国的恩主给得爽快：钱、粮、枪、船，一样不缺，条件写在合约最后一页，字很小。\n达达利亚盯着那一页看了很久，还是签了。他说：先活下来，别的以后再说。副官想说什么，被他抬手拦住了。"
 LYY_Event.12037.a:"受其钱粮，暂寄人下"
 LYY_Event.12037.b:"谢其厚意，自筹军资"
 LYY_Event.12038.t:"顾问之廷"
 LYY_Event.12038.d:"顾问之廷设在旧商会里，说话的是北国来的人。本地官吏事事要问过顾问，日子一久，连口音都学了三分。\n达达利亚看在眼里，只在一次会上淡淡说了一句：你们问得越勤，主事的人就越不像主事的人。满堂无人应声。"
 LYY_Event.12038.a:"渐撤顾问，收回权柄"
 LYY_Event.12038.b:"优礼顾问，尽听其言"
 LYY_Event.12039.t:"岁贡之道"
 LYY_Event.12039.d:"岁贡的车队一季一趟，押的是盐、铁和云来的丝。达达利亚命人在贡道旁立碑，碑上不写贡字，只写通商。\n老吏问他为何。他说：写贡是给北国看的，写通商是给自己人看的。两块牌子，是同一件事。老吏听完，低头去抄碑文。"
 LYY_Event.12039.a:"碑上只写通商"
 LYY_Event.12039.b:"直书岁贡，不避其名"
 LYY_Event.12040.t:"鹰旗下的驻军"
 LYY_Event.12040.d:"鹰旗下的驻军编成两营，一营守港，一营驻城。饷由北国出，号令也由北国下。\n达达利亚检阅那天，看着满场整齐的兵，忽然对副官说：这些人我调不动，将来出了事，第一个站出来替北国收场的，是我。"
 LYY_Event.12040.a:"北军驻港，饷由北出"
 LYY_Event.12040.b:"自练亲军，不用北人"
 LYY_Event.12041.t:"关榷北属"
 LYY_Event.12041.d:"关榷交出去那天，税吏换了新印。本地商人排队过关，队伍比从前长了一倍，没有人说话。\n达达利亚站在关楼上看了一上午，只说了一句：从今天起，这港口挣的钱，先过一遍北国的手。说完他下了楼，再没有回头。"
 LYY_Event.12041.a:"关榷北属，暂忍一时"
 LYY_Event.12041.b:"力争关税，寸步不让"
 LYY_Event.12042.t:"总督之旗"
 LYY_Event.12042.d:"总督之旗挂在府衙正门。达达利亚偶尔进去坐坐，看那位名义总督理事。\n有一回总督问他，自己算不算主人。他答：算。只是你主的事，北国先点了头。总督没有再问，两人都笑了，笑得都不太好看。"
 LYY_Event.12042.a:"立总督，行其名"
 LYY_Event.12042.b:"废总督，另派能吏"
 LYY_Event.12043.t:"北学"
 LYY_Event.12043.d:"北学开了三门课：算学、军制、北语。第一批学生里有不少旧吏的子弟。\n达达利亚去看过一堂北语课，回来后对幕僚说：教他们北语，是让他们看得懂北国写的文书。看不看得懂是他们的事，写不写得清楚是北国的事。"
 LYY_Event.12043.a:"设北学，通其文字"
 LYY_Event.12043.b:"守本地学，不习北语"
 LYY_Event.12044.t:"冰誓"
 LYY_Event.12044.d:"冰誓那天，云来海落了雪。达达利亚换上一身北国礼服，当众宣誓，誓词很长，他一个字没改。\n礼成之后，他独自回到船上，把礼服脱下来叠好，压进箱底。箱盖上落了灰，此后他再没有打开过那只箱子。"
 LYY_Event.12044.a:"行冰誓，就此定分"
 LYY_Event.12044.b:"缓宣誓词，留有余地"
 LYY_Event.12045.t:"立海"
 LYY_Event.12045.d:"立海的第一步是换旗。达达利亚让人把船队的旗重画了一遍：仍是那面渡鸦，只是爪下不再是冰纹，改成了一条浪。\n画工问他这样算不算背弃北国。他说：旗是拿来认路的，不是拿来认主的。画工没有再问，把浪画得比原来那点冰纹更长。"
 LYY_Event.12045.a:"改旗作浪，另立海号"
 LYY_Event.12045.b:"仍循北制，不敢易帜"
 LYY_Event.12046.t:"护航宪章"
 LYY_Event.12046.d:"护航宪章写得比军令还细：几船一队，走哪条线，出事谁负责，写得清清楚楚。达达利亚把它贴在船户常去的茶馆里。\n他说：字写明白，海上的事就少一半麻烦。头一个月，船户们路过都要看一眼，看熟了，就自己按上面的规矩走了。"
 LYY_Event.12046.a:"颁护航宪章，昭告船户"
 LYY_Event.12046.b:"以军令督航，不立明章"
 LYY_Event.12047.t:"远洋商队"
 LYY_Event.12047.d:"远洋商队头一回出海，二十七条船，去的是没人挂过旗的地方。达达利亚在码头送了半程。\n有船长问他怕不怕亏。他答：怕。可停在港里的船，一辈子也挣不回一条新航线。船队转过灯塔的时候，他在岸上站了很久。"
 LYY_Event.12047.a:"遣远洋商队，博其利"
 LYY_Event.12047.b:"守近海航线，稳中求进"
 LYY_Event.12048.t:"南十字合流"
 LYY_Event.12048.d:"南十字的船队合流那天，海面上旗色杂乱，看着像一整个集市。有人劝达达利亚收编他们。\n他说：收编了就成了我的兵，到时候他死一个人我就得赔。不如合着走，各算各的账，反而走得远。那天晚上，两家的船长在一张桌上喝到很晚。"
 LYY_Event.12048.a:"与南十字合流，各算各账"
 LYY_Event.12048.b:"收编其众，尽归我有"
 LYY_Event.12049.t:"海外补给点"
 LYY_Event.12049.d:"海外补给点一处一处地修，先修淡水，再修煤，最后才修炮。达达利亚说：补给点是给船用的，不是给仗用的。\n第一个补给点落成时，他只是让人在门口立了块木牌，写着此处可停三日。后来那块木牌被人描了又描，字都粗了一圈。"
 LYY_Event.12049.a:"广设海外补给点"
 LYY_Event.12049.b:"只守本港，不出远洋"
 LYY_Event.12050.t:"拒额"
 LYY_Event.12050.d:"北国的催额又到了，比去年多三成。达达利亚把文书搁了三天，回了一封极短的信：今年的额，只按原数交。\n信送出去那天，港里的风声都紧了。他照旧在甲板上练枪，练完对副官说：他们会再来问的，到时候你们什么都别说，让我来说。"
 LYY_Event.12050.a:"只按原数交额"
 LYY_Event.12050.b:"照额多交，以免生隙"
 LYY_Event.12051.t:"盐铁自主"
 LYY_Event.12051.d:"盐和铁从前大半要过北国的手，如今一条条收回来。盐引换成了本地印，铁器只销本港。\n有老商问这样会不会惹恼北国。达达利亚答：惹恼是迟早的事，早晚不如早。他让账房重新起了一本册子，封面什么都没写。"
 LYY_Event.12051.a:"盐铁收归自印"
 LYY_Event.12051.b:"仍由北国代销"
 LYY_Event.12052.t:"自主海权"
 LYY_Event.12052.d:"自主海权落在纸上的那天，云来海挂出了自己的旗。达达利亚站在旗舰船头，望着浪上那片旗影。\n他对身边人说：从今天起，这片海上的规矩，我们自己定。定得好不好，往后才知道。说完他让人把旧的航图也留下，一张都没烧。"
 LYY_Event.12052.a:"定自主海权，自订海规"
 LYY_Event.12052.b:"仍奉北国海令"
 LYY_Event.12053.t:"云来落定"
 LYY_Event.12053.d:"两条路走到尽头，都回到同一个码头。达达利亚把两年来所有的租约、航图和军约摊开，重写成一册。\n他在扉页上写：云来海是至冬的，也是自己的。写完看了很久，没有撕掉这一页。管卷宗的人接过册子时，看见纸角是湿的。"
 LYY_Event.12053.a:"立云来总册，一体遵行"
 LYY_Event.12053.b:"各约分治，互不相统"
 LYY_Event.12054.t:"长冻"
 LYY_Event.12054.d:"长冻是一段没有大事的日子：船照开，税照收，北国的账照催，海上的旗照升。\n达达利亚渐渐不再天天上甲板，只在夜里听一会儿浪。他对来探望的旧部下说：没事，就是有点太安静。旧部下点点头，也没找出别的话。"
 LYY_Event.12054.a:"照旧开港，静待时变"
 LYY_Event.12054.b:"整军备战，防其反目"
 LYY_Event.12055.t:"潮回"
 LYY_Event.12055.d:"多年以后，云来海的潮汐依旧准点。达达利亚老了，港口却比他在时更热闹。\n有个年轻人问他，当年那些旗子谁赢了。他想了想，答：旗子从来不赢，赢的是还留在这条船上的人。年轻人没听懂，他也没有再解释。"
 LYY_Event.12055.a:"就此交卸，任后人评"
 LYY_Event.12055.b:"长掌云来，不肯放手"
 LYY_Event.12056.t:"云来新局"
 LYY_Event.12056.d:"云来章程颁行那天，海面平静得能照出人影。达达利亚把北国的租约、五方的通约和本港的税则并在一册。\n他念到最后一条时停了一下，说：从今天起，这港口的事，一半按老规矩，一半按新规矩。念完他把册子合上，交给了管卷宗的人，自己转身去看海。"
 LYY_Event.12056.a:"颁行云来章程"
 LYY_Event.12056.b:"废章程，仍以军法临之"

 YLH_Spirit_Childes_Abacus:"公子的算盘"
 YLH_Spirit_Childes_Abacus_desc:"一只手拨账，一只手握枪。云来海的每一笔出入，他都要先在心里过一遍：这笔买卖，值不值得我亲自签。"
 YLH_Spirit_Northern_Patronage:"北国恩主"
 YLH_Spirit_Northern_Patronage_desc:"钱、粮、枪、船，北国给得爽快，条件是合约最后一页上那一行小字。恩主的账从来不白送，只在往后某一天，连本带利地要回去。"
 YLH_Spirit_Sea_Power:"海权在手"
 YLH_Spirit_Sea_Power_desc:"渡鸦的爪下换成了一条浪。这片海上的规矩由自己来定，定得好不好，要等到风向变的那天才知道。"
 YLH_Spirit_Convoy_Charter:"护航宪章"
 YLH_Spirit_Convoy_Charter_desc:"几船一队，走哪条线，出事谁负责，白纸黑字贴在茶馆里。字写明白了，海上的麻烦就少一半。"
 YLH_Spirit_Salt_and_Iron:"盐铁自主"
 YLH_Spirit_Salt_and_Iron_desc:"盐引换成本地印，铁器只销本港。惹恼北国是迟早的事，早晚不如早。账房重新起了一本册子，封面什么都没写。"
 YLH_Spirit_Grey_Captains_Office:"灰袍船长署"
 YLH_Spirit_Grey_Captains_Office_desc:"他们走私、护航、收债，什么营生都沾过手。云来海的深浅，他们比谁都清楚，所以航路怎么走，先听他们的。"
 YLH_Spirit_Abyss_Concordat:"渊底之约"
 YLH_Spirit_Abyss_Concordat_desc:"深渊的价码高得让人心里发毛。合约搁在案上一直没动，达达利亚说：可以谈，但得先弄清楚，他们要的东西会不会反过来要我的命。"
 YLH_Spirit_Question_the_Sky:"问天之人"
 YLH_Spirit_Question_the_Sky_desc:"写给天理的信改了又改，终究没有寄出，压在了海图底下。女皇算的是怎么打，他算的是怎么活，两本账早晚要对一对。"
 YLH_Spirit_Winter_Garrison:"冬驻"
 YLH_Spirit_Winter_Garrison_desc:"鹰旗下的两营兵，饷由北国出，号令也由北国下。驻得越久，这座城就越像别人的一块飞地。"
 YLH_PW_Spirit_Five_Envoys:"五方通使"
 YLH_PW_Spirit_Five_Envoys_desc:"刻晴、凝光、甘雨、申鹤、蓝砚，五张纸钉在舆图旁。刀守住的地不长久，人情和账目才长久。"
 YLH_Spirit_Harbor_Charter:"港章"
 YLH_Spirit_Harbor_Charter_desc:"租约、通约、税则并成一册，念给全港听。一半按老规矩，一半按新规矩，念完就照着办。"
 YLH_Spirit_Cloud_Sea_Treasury:"云来金库"
 YLH_Spirit_Cloud_Sea_Treasury_desc:"盐、铁、丝、粮，进出都要过一道账。金库满的时候，人人有话说；金库空的时候，连旗都挂不直。"

 YLH_North_Tier_1:"北援等级"
 YLH_North_Tier_1_desc:"北援断绝，钱粮两空。码头上冷冷清清，账房翻来覆去地算，越算越薄。"
 YLH_North_Tier_2:"北援等级"
 YLH_North_Tier_2_desc:"北援零星，聊胜于无。军械箱上的霜纹还没化，账上已经记下了第一笔利息。"
 YLH_North_Tier_3:"北援等级"
 YLH_North_Tier_3_desc:"北援平稳，货船按月靠港。日子过得下去，港里的人也渐渐习惯，先看北国的脸色再说话。"
 YLH_North_Tier_4:"北援等级"
 YLH_North_Tier_4_desc:"北援厚重，军械成批。城里的兵穿的是北国的装，吃的是北国的粮，说话也带上了冰的样子。"
 YLH_North_Tier_5:"北援等级"
 YLH_North_Tier_5_desc:"北援满溢，已无退路。云来海的一切都先过一遍北国的手。达达利亚站在甲板上，第一次分不清自己是主人，还是管事。"
 YLH_Sea_Tier_1:"海权等级"
 YLH_Sea_Tier_1_desc:"海权尽失，航路旁落。挂着本港旗的船出了口，就没几人认得，货价也被别人说了算。"
 YLH_Sea_Tier_2:"海权等级"
 YLH_Sea_Tier_2_desc:"港灯初亮，护航初成。船户开始记得，这条线上有人替他们说话。"
 YLH_Sea_Tier_3:"海权等级"
 YLH_Sea_Tier_3_desc:"航路在手，商队渐远。云来海的名字重新出现在远方的港口，虽不响亮，却有人问了。"
 YLH_Sea_Tier_4:"海权等级"
 YLH_Sea_Tier_4_desc:"远洋执旗，海规自定。这条海上的抽成、护航、补给，都要先问过云来海一遍。"
 YLH_Sea_Tier_5:"海权等级"
 YLH_Sea_Tier_5_desc:"自成一方，海上无二。云来海的旗插到了北国管不着的地方，达达利亚却比谁都清楚，走得越远，风浪越大。"
 YLH_PWCombo_Both_High:"两头都攥住"
 YLH_PWCombo_Both_High_desc:"北国的钱照拿，海上的旗照升。云来海一边数着至冬送来的军械，一边把自己的航图铺满整张桌子，日子过得热气腾腾。只是达达利亚清楚，这两样东西早晚要在同一张纸上打架。"
 YLH_PWCombo_Both_Low:"两头都空"
 YLH_PWCombo_Both_Low_desc:"北国的粮船迟迟不到，海上的航路也没人应声。码头上安静得只剩潮声，账房翻来覆去地算，越算越薄。"
 YLH_PWCombo_A_High:"借来的手"
 YLH_PWCombo_A_High_desc:"钱是北国的，枪是北国的，连顾问说话都带着北国的口音。城里的日子过得下去，只是每次抬头，先看见的都是别人的旗。"
 YLH_PWCombo_B_High:"自己的海"
 YLH_PWCombo_B_High_desc:"航路一条条收了回来，远洋的船队越走越远，北国的催额却越来越难答复。达达利亚说，船停在港里最安全，可也就一辈子挣不回一条新航线。"

 #################### 蓝砚 · 沉玉谷（CYG） ####################
 CYG_CivilWar_Valley:"沉玉自立"
 CYG_CivilWar_Valley_desc:"帝君驾崩的消息，是顺着山风飘进沉玉谷的。蓝砚当时正蹲在一片枯黄的梯田边，手里攥着一把抓得起的沙。她听完，只把沙慢慢撒回田里，说了一句：城里的神死了，可这山里的土，早就死了好些年了。她直起腰，望向谷口，那里挂着璃月港的牌册，写着征收赋税、开采矿产的旧令。她说：从前我们为了活命，把山挖空；如今连挖山的人都不必再来了，他们只要把谷里最后一点水，也划进自己的账。我不答应。"
 CYG_Reclaim_the_Terraces:"复耕梯田"
 CYG_Reclaim_the_Terraces_desc:"复耕梯田，是从第一锹土开始的重活。谷中壮丁多已流亡，留下的尽是老人、妇人与孩子。蓝砚带着他们，一阶一阶地把塌了的田埂重新垒起。有人累得直不起腰，问她这还有意义吗。她答：有。你看这土，你把它翻松一点，它就还你一点绿。这世上，再没有比土地更讲信用的东西了。"
 CYG_The_Village_Council:"村社大会"
 CYG_The_Village_Council_desc:"村社大会没有主位，没有印信，所有人围坐在谷中最大的一棵老树之下。蓝砚只是站着，把想说的话说完，就让所有人各自去议。有人嫌乱，说该有个说了算的人。蓝砚答：谷里从前有过说了算的人，是那位把山卖掉的谷主。你们怀念他，还是怀念那块地？满座沉默，随后是此起彼伏的点头。"
 CYG_Forbid_the_Axes:"禁斧令"
 CYG_Forbid_the_Axes_desc:"禁斧令是蓝砚立的第一道谷规：凡为垦荒、燃料而砍伐成材之树者，罚；砍的是十年以上的老树，逐出谷去。有人骂她不近人情，说冬天冷得死人。蓝砚指着谷中一片被砍得光秃的山坡，说：你们上山去站一站，站在那里，风是灌进骨头里的。树都砍光了，我们靠什么挡风？靠咒骂别人吗？"
 CYG_Guard_the_Springs:"护泉"
 CYG_Guard_the_Springs_desc:"护泉，是把谷中仅剩的几眼活泉，当成命来守。蓝砚命人以石砌渠，以草覆土，不许人在泉眼附近牧畜、洗染。她说：水是会记路的。你若待它好，它年年回来；你若把它的路断了，它这一走，就是永远。她说这话时，语气很轻，像在说一个早就离家的亲人。"
 CYG_The_Refusal:"拒港府之命"
 CYG_The_Refusal_desc:"拒港府之命，是蓝砚第一次把话挑明。她把璃月港来的文书铺在众人面前，一条一条念完，开矿、修路、征丁、纳税，样样都有「为谷中百姓谋福」的好名目。念完她问：福在哪里？没有人回答。她把文书当场烧了，说：从今天起，沉玉谷的事，我们自己做主。做不好，也是我们自己的账。"
 CYG_Terraces_of_Green:"青田"
 CYG_Terraces_of_Green_desc:"青田，是复耕第二年才叫得出口的名字。那时节，最先复耕的一片梯田里，苗已经长到了膝高，风一过，绿得晃眼。蓝砚立在田埂上，看着一个孩子在田里打滚，忽然觉得眼眶发热。她别过头，对身边人说：别笑我。我只是想，我爹娘活着的时候，这片田就是这个样子，他们临死前，还在念叨这件事。"
 CYG_The_Shared_Granary:"共仓"
 CYG_The_Shared_Granary_desc:"共仓的第一步，是把谷里最后几户还存着余粮的人家，一一请到仓前。蓝砚没有强迫任何人，只让每户自己报出多少，自己决定交多少。有人交了，有人没交，她都记下，却不追究。她说：我不逼你们。我只想让你们看看，交了的人家，冬天是怎么一起熬过来的，信任这东西，得先有人肯先交出去，才长得出来。"
 CYG_The_Mountain_Path_Watch:"山径守望"
 CYG_The_Mountain_Path_Watch_desc:"山径守望，是把谷中每一条能走人的路，都记住了。守望的人是牧童、采药人、砍柴的妇人，他们白天该干什么还干什么，只在路过时多看两眼。蓝砚说：最好的斥候，是那些本来就要走这条路的人。他们不用教，因为这条路的每一块石头，他们都踩了半辈子。"
 CYG_Herb_and_Root:"草根药"
 CYG_Herb_and_Root_desc:"草根药，是谷中唯一的医。没有名医，没有好药，只有老人传下来的几张方子，和满山的草。蓝砚把认得草的几位老人请到一起，让他们把方子说出来，一一记下。有位老人不解，说这些方子传出去，就不值钱了。蓝砚答：方子不值钱，值钱的是，明年那个生病的孩子，能不能还认得草。"
 CYG_The_Levy_Refused:"抗征"
 CYG_The_Levy_Refused_desc:"抗征，是沉玉谷第一次真正動手。港府派来的税吏带着兵，堵在谷口，说交不出粮，就封谷断水。蓝砚没有出面，只让山径上的守望者，在税吏必经的一处隘口，把路挖断了三丈。税吏狼狈退回，扬言来日算账。谷中一片欢呼，蓝砚却独自坐在田边，很久没有说话，她比谁都清楚，这条路一旦走上了，就再没有回头的余地。"
 CYG_Community_Kitchens:"共炊"
 CYG_Community_Kitchens_desc:"共炊，是把每家的柴、米、盐凑在一起，煮一大锅饭，所有人排成一列去盛。有人嫌这像乞丐，蓝砚把碗递到那人手里，说：乞丐是等着别人给，我们是自己煮给自己吃。你端着这碗饭，先想清楚这件事，你既不欠谁的，也就不必谢谁。"
 CYG_Seed_Banks:"谷种之库"
 CYG_Seed_Banks_desc:"谷种之库，是沉玉谷押上未来的一次豪赌。蓝砚带人翻遍谷中的每一户人家，把各家留的种子集中起来，一粒一粒筛选、登记、分装。有老人不肯交种，说那是祖上传下来的最后一斗。蓝砚把自己的半袋口粮塞给他，说：换。你的种交给我，我的粮给你。等明年开春，种子还是你的，粮不用还，只要这谷里，还有人种田。"
 CYG_Militia_of_the_Terrace:"护田队"
 CYG_Militia_of_the_Terrace_desc:"护田队，是谷中第一批拿起武器的人。他们没有铠甲，没有军饷，手里握的不过是农具、猎弓与削尖的竹竿。蓝砚为他们递上第一支竹矛时，郑重地说：这不是让你们去杀人。这是让你们站在自家田边，让那些想动手的人，先掂量掂量，这片土，是有人在守的。"
 CYG_The_Valley_Charter:"山约"
 CYG_The_Valley_Charter_desc:"山约，是沉玉谷第一次有了一部自己的规矩。蓝砚没有写成一个字的「令」，通篇都是「我们既不……也不……」，既不纳不属于谷中的赋税，也不受不受谷中认同的号令。写完后有人问她，这算什么章程。她答：这是一句话：这座谷，从今往后，自己认自己。"
 CYG_No_Master_No_Lord:"无主无君"
 CYG_No_Master_No_Lord_desc:"无主无君，是把沉玉谷的态度说到底。蓝砚说：我们不要神，也不要王。神高高在上，听不见谷里的哭声；王远在港口，算不清谷里的水土。她顿了顿，又说：我们只要一样东西，让我们自己，守着这片只要肯善待、就肯活下去的谷。"
 CYG_The_Free_Communes:"自由村社"
 CYG_The_Free_Communes_desc:"自由村社，是蓝砚对这片土地的构想：没有统属，只有结盟；没有上下，只有相连。谷中十几个村社各自为政，遇到大事才聚在一处相商。有人担心这样的散沙打不过外人。蓝砚答：外人打进来时，你要的是一支能打仗的队伍，还是一片谁都不肯让出去的土地？她选后者。"
 CYG_Common_Lands:"公田"
 CYG_Common_Lands_desc:"公田，是村社制度落地的第一步：把谷主当年强占的土地，全部收归村社共有，按户分种，收成按劳分配。有人趁机多占，被人当面揭发。蓝砚没有偏袒，只让村社大会当众议定：多占者退还，并替被占之家耕作一季。她说：公田是让有私心的人，也得先学会一件事，叫遮掩不住。"
 CYG_No_Taxes_No_Chains:"罢税去枷"
 CYG_No_Taxes_No_Chains_desc:"罢税去枷，是沉玉谷对外的宣告：凡行至谷中，不得以任何名目征敛；凡谷中之人，不得被以任何名目拘束。这条规矩写在谷口的木牌上，来往的行人、流民、甚至迷路的商队，都看得见。有人说这是自找麻烦，蓝砚说：麻烦本来就找上门了。与其被人家绑着问要不要钱，不如我先自己说清楚，我不给。"
 CYG_The_Rotating_Watch:"轮值巡山"
 CYG_The_Rotating_Watch_desc:"轮值巡山，是谷中所有人的义务，不分男女老幼，只看力气大小。老人看守谷口的火堆，孩子瞭望山口，青壮巡更走夜路。蓝砚说：我不指望谁替谁白干一辈子。我只希望，每一个守过山的人，都记得自己守的是自家的院墙，这样，就没有人会偷懒。"
 CYG_The_Assembly_of_Peaks:"诸峰之会"
 CYG_The_Assembly_of_Peaks_desc:"诸峰之会，是沉玉谷周边几个山村第一次齐聚。来的村社，有些从前还是世仇，见面就红眼。蓝砚不管旧怨，只让每个村社把自己的难处说一遍。说着说着，众人竟发现，大家怕的、缺的、恨的，原来是同一件事。散会时，一个从前的仇家主动过来，与对方握了手。蓝砚远远看着，只说了一句：这就对了。"
 CYG_The_Wind_And_The_Grass:"风与草"
 CYG_The_Wind_And_The_Grass_desc:"风与草，是谷中最安静的一场改革：把封禁的山坡重新撒上草籽，让风携着种子，去往每一道裸露的土坡。蓝砚说：人治不了山，山得自己治自己。我们只管把种子还给风，剩下的，交给时间。几年之后，最先绿起来的那道坡，成了谷中人常去看的地方，没有碑，没有名，只有一片绿。"
 CYG_Teach_the_Children:"教谷中子民"
 CYG_Teach_the_Children_desc:"教谷中子民，是蓝砚最看重的事。她办的第一所学堂，没有书，没有牌匾，就设在老树底下。教的内容也简单：认草、认土、认天气、认方向。有人问她为何不教读书识礼。蓝砚答：等他们先认清了脚下这片地，再谈认字，一个连自己脚下的土都不认识的人，读了书，也是替别人读的。"
 CYG_The_Herb_Doctors:"草医授徒"
 CYG_The_Herb_Doctors_desc:"草医授徒，是蓝砚把谷里最后几位老药婆的手艺救下来的方式。她们大多不识字，只会说、会认、会治。蓝砚就让人把她们的话一句句记下，编成歌诀，教给年轻的孩子。一位药婆临终前握着蓝砚的手说：我这辈子,治过的人，比认得我的字多。你替我把这些字补上，我就放心了。"
 CYG_The_Singing_Paths:"歌径"
 CYG_The_Singing_Paths_desc:"歌径，是谷中最不像政令的东西。蓝砚让每一个村社，把自家的故事编成歌，走山路时唱，插秧时唱，守夜时唱。她说：一个地方的歌，就是它的记忆。唱得越久，人就越舍不得走，再苦的地方，只要有歌，就有人愿意留下。"
 CYG_The_Silent_Valley:"谷中无号令"
 CYG_The_Silent_Valley_desc:"谷中无号令，是蓝砚理想中的样子：没有谁发号施令，也没有谁需要服从。事情摊开来说，谁愿意做谁做，做不了的就不做。有人说这种地方撑不久。蓝砚答：也许撑不久。可我想让活着的人，先过几年不必看别人脸色的日子，哪怕短一点，也算是真的活过。"
 CYG_The_Open_Granary:"开仓纳流民"
 CYG_The_Open_Granary_desc:"开仓纳流民，是沉玉谷最冒险的一次决定。谷中本就缺粮，蓝砚却主张，把有限的余粮分给逃进谷中的外人。村社大会上吵成一团。蓝砚只说了一句话：今天来的人，是逃的；明天逃的，可能就是我们。你们想让自己将来站在别处谷口时，听到的是谷中无粮，还是进来吧？"
 CYG_The_Green_Pact:"青约"
 CYG_The_Green_Pact_desc:"青约，是沉玉谷用最朴素的方式，签下的一份盟约：不树旗，不立国，只与所有愿意守这片水土的人结为一体。签约那天没有仪式，只有所有人把手按在同一片土地上。蓝砚说：这座谷不是谁的，也不是我们的，它只是恰好，是我们愿意用命去守的地方。"
 CYG_The_Valley_Endures:"谷寿无疆"
 CYG_The_Valley_Endures_desc:"谷寿无疆，是决心。蓝砚立在谷口那块写着山约的木牌前，说：我们争的从来不是一场仗的输赢。我们争的，是这片水土，能不能在我们走后，还养得起我们的孩子。若它能，就算我们今天全都死在这里，也值了。她说完，把手里那把沙，撒在了木牌的脚下。"
 CYG_Carry_the_Seed_Out:"携种出山"
 CYG_Carry_the_Seed_Out_desc:"携种出山，是蓝砚第一次把目光投向谷外。她派人带着谷中的种子，走过璃月的每一处荒田、每一口枯井，把土还能救这件事，讲给每一个绝望的人听。她说：我们不能只守着自己那一亩三分地。水土的账，从来不认地界，它在哪里的伤口，最终都会流到我们这里来。"
 CYG_The_Song_of_the_River:"江河之诉"
 CYG_The_Song_of_the_River_desc:"江河之诉，是把沉玉谷的声音，写进一条条流向大海的河里。蓝砚让人沿江而下，每到一处，就把谷中的故事讲一遍：讲枯了的泉，讲流失的土，讲那些被矿渣填平的溪。她说：我不指望全璃月都懂我们。我只希望，当有一天河水流到大港时，那里的人，至少知道它从哪里来。"
 CYG_The_Desert_Prophecy:"荒芜之谶"
 CYG_The_Desert_Prophecy_desc:"荒芜之谶，是蓝砚说给整个璃月的警世之言。她说：照今天这样开山、修路、挖矿，不出二十年，璃月就会从海边开始，一块一块地变成荒地。有人斥她危言耸听，她答：我宁愿做那个被你们骂的乌鸦。等你们真看见到处都是秃山的时候，我哪怕已经死了，也算对得起说过这句话。"
 CYG_Shelter_the_Runaways:"收留亡命"
 CYG_Shelter_the_Runaways_desc:"收留亡命，是沉玉谷最招祸的事。谷中收留的，有被港府通缉的流民，有逃兵，有无家的孤儿，甚至有从至冬占领区逃来的难民。有人劝蓝砚，收留这些人会引来大祸。她答：大祸早就来了。区别只在于，是它找上我们，还是我们迎上去。我宁愿迎上去。"
 CYG_The_Poisoned_Wells:"毒井"
 CYG_The_Poisoned_Wells_desc:"毒井，是沉玉谷出山之后，亲眼所见的最严峻的一幕。因为上游开矿，几座村庄的井水变成了浑浊的黄汤，喝了的人一个个倒下。蓝砚蹲在井边，捧起一捧水，看了很久，然后站起身，对身边的人说：回去。告诉谷里的人，这就是我们为什么要出山。"
 CYG_The_Green_Columns:"绿旗成行"
 CYG_The_Green_Columns_desc:"绿旗成行，是出山之后的沉玉谷第一次有了阵势。队伍排成一列列，旗上绣的是一片叶子。有人笑这不威武。蓝砚答：我们不是来吓人的。我们是来告诉他们，有这么一群人，愿意为一片叶子站着，站到他们不敢再往下挖为止。"
 CYG_Burn_the_Furnaces:"焚炉"
 CYG_Burn_the_Furnaces_desc:"焚炉，是这条路最激烈也最心碎的一幕。为了阻止污染水源的矿炉继续开工，谷中的队伍亲手烧掉了那几座炉子。火光映在河面上，像一场倒流的晚霞。蓝砚站在岸边，看着那几座轰然倒塌的炉子，忽然想起，那炉子里头，有几个烧炉的人，就是谷中逃出去的旧邻。"
 CYG_The_School_of_the_Field:"田垄学堂"
 CYG_The_School_of_the_Field_desc:"田垄学堂，是把课堂搬到田里的尝试。蓝砚让每个出山的孩子，都在一片陌生的荒地上，亲手试着种出一茬东西来。她说：书里写的，都不如你自己刨一锹土来得实在。等他们的手心里，真正长出过一颗粮食，他们才会明白，我们在为什么拼命。"
 CYG_The_Spreading_Root:"蔓根"
 CYG_The_Spreading_Root_desc:"蔓根，是沉玉谷出山之后最让当权者头疼的东西：它不像军队，没有阵地，却像野草一样，从一个村庄蔓延到另一个村庄。蓝砚说：我们从没想过要打一座城。我们只想让每一个种田的人，都学会问一句，这块地，本来该是谁的？"
 CYG_The_Marsh_Law:"泽法"
 CYG_The_Marsh_Law_desc:"泽法，是出山之后立的新规矩：凡有水处，不得截流、不得排污、不得私占。它管的是水，水往哪儿流，由天定，不由人定。有人说这管得太宽，蓝砚答：我这一生，别的都可以让，唯独水，一寸都不让。因为水让出去，就是命让出去。"
 CYG_The_Grey_Water:"灰水"
 CYG_The_Grey_Water_desc:"灰水，是这场起事最沉重的一个名字。为了逼迫港府让步，谷中的队伍切断了一处坝上的闸，让下游矿区的污水倒灌回上游。这手段很脏，脏到连队里最坚定的追随者都犹豫了。蓝砚却签了那道令，签完独自在河边坐到天亮。她说：我知道这样做不对。可有些地方，讲道理讲不通，那就只剩这一条，我也不干净的路了。"
 CYG_The_Grand_March_of_Peasants:"田夫行"
 CYG_The_Grand_March_of_Peasants_desc:"田夫行，是沉玉谷出山声浪的最高潮。数不清的农民、药婆、猎人、流民，沿着田埂与江堤，举着绿叶与锄头，一路向璃月港走去。他们走得极慢，也极齐。蓝砚走在队伍中间，不说话，只是走。她说：我不需要他们为我造一座碑。我只需要他们，走完这一遭，然后回家种田去。"
 CYG_The_Last_Green_Hill:"最后的青山"
 CYG_The_Last_Green_Hill_desc:"最后的青山，是蓝砚给这条道路起的名字。她站在一处刚刚恢复生机的山坡上，望着脚下这一片来之不易的绿，说：我不求这天下都变成青山。我只求，当我们守不住所有地方的时候，至少还能守住这一座，只要这一座还在，就说明这件事，还有希望。"
 CYG_The_Valley_And_The_World:"谷与天下"
 CYG_The_Valley_And_The_World_desc:"谷与天下，是沉玉谷最终想明白的一件事：守住一座谷，就是守住了整个世界的一个角落；而守住整个世界的一个角落，也就等于守住了这座谷的未来。蓝砚说：我从前想的是把谷守好，如今我明白了，谷和天下，本来就是一回事。山上的水流到山下的田，山下的烟飘回山上的云，谁也算不清，哪一部分是你的，哪一部分是我的。"
 CYG_The_Singer_of_the_Valley:"谷中歌者"
 CYG_The_Singer_of_the_Valley_desc:"谷中歌者，是一位自小在沉玉谷长大的说书人。他把谷里的故事编成曲，每逢集日就在谷口唱给来往的人听。他唱的从来是那些没有名字的人：一个守了四十年泉的老人，一群在雪天里分饼的孩子。蓝砚常去听，听完就走，从不说话。有人问她为何不赞一句，她说：他在唱我们，我若开口，就成了替自己鼓掌了。"
 CYG_Old_Mine_People:"旧矿之人"
 CYG_Old_Mine_People_desc:"旧矿之人，是沉玉谷里最不愿被人提起的一群人：他们曾经亲手挖空过这片山。如今石尘进了肺，他们咳血，佝偻，却仍每天上山，把当年挖出的大坑，一锹一锹地填回去。有个老人对蓝砚说：我不指望谁原谅我。我只是想在死前，把这块地还给它原来的样子。蓝砚没有说原谅，只说：那就一起填。"
 CYG_Warm_Tea_for_the_Weak:"弱者的热茶"
 CYG_Warm_Tea_for_the_Weak_desc:"弱者的热茶，是沉玉谷的一项不成文的规矩：每一个走进谷中的弱者，病着的人、伤着的人、走投无路的人，都该先被递上一碗热茶，喝完再谈别的。蓝砚说：这条规矩是这座谷里所有人，用他们自己最难的那些日子，一点一点熬出来的。"
 CYG_The_Path_Up_Aozang:"上奥藏之路"
 CYG_The_Path_Up_Aozang_desc:"上奥藏之路，是一条几乎废掉的老山路。蓝砚带人一寸一寸把它修通，不是为了运货，也是为了让谷里的人，能在春天的时候，上山去看一眼那片只开七天的花。她说：人活着，不能光是熬。总得有个地方，是专门用来，让人看一眼就知道，这日子还值得过的。"
 CYG_The_Whole_Valley_Rises:"举谷而动"
 CYG_The_Whole_Valley_Rises_desc:"举谷而动，是沉玉谷把所有力气都押上去的时刻。老人留在家里看门，孩子跟着妇人，青壮全部扛起了农具与猎弓。没有鼓，没有令旗，只有一声声传遍山谷的呼喊。蓝砚站在最前面，回头望了一眼谷口那棵老树，那是她小时候，她父亲指着教她认草的地方。她转回头，迈出了第一步。"
 CYG_Refuse_Liyue_Harbor:"拒斥璃月港"
 CYG_Refuse_Liyue_Harbor_desc:"拒斥璃月港，是一个选择。港府递来的一纸招抚文书上，写着官位、钱粮、名分，条件优厚得让人心动。蓝砚当着使者的面，把文书折好，还了回去，说：你们给的这些，我一样都不要。我要的只有一件事：你们从此，别再打沉玉谷水与土的主意。使者脸色难看，蓝砚却神色平静，仿佛只是在谈一桩田垄间的寻常小事。"
 CYG_Reunify_Liyue:"谷连天下"
 CYG_Reunify_Liyue_desc:"谷连天下那一天，沉玉谷的绿旗，插到了璃月港最高的城墙上。蓝砚是被众人抬着至此的，她早已累得走不动路。她靠在城墙边，望着脚下这片被战火与开垦搅得满目疮痍的土地，忽然没有想象中的激动。她只说了一句：这城，比我想的要大。也比我想的，更荒。随行的人都静了下来。良久，她又补了一句：那就……从头再种吧。"

 CYG_civilwar_category:"水土之秤"
 CYG_civilwar_category_desc:"蓝砚 · 港商一系的内战决议组。以两轴机制衡量营商与安民之间的平衡，每一次决议都会改变当前等级。蓝砚看得最重的，是货源不断、人心不散，账面上要过得去，街市上也要过得下去。只要买卖还在做，日子就总有盼头。只要账目平顺，别的事都好商量。"
 CYG_decision_sow_green:"撒青"
 CYG_decision_sow_green_desc:"撒青是最亏本的买卖：种子撒下去，头三年见不到收成，还可能被旱死、被虫吃光。可谷里所有人都懂，不种，这片地就永远是黄的。蓝砚说：我们这一辈人，可能吃不上自己种的粮；但只要种下去，我们的孩子，就能吃得上。"
 CYG_decision_clear_spring:"淘泉"
 CYG_decision_clear_spring_desc:"淘泉是体力活，也是良心活：要把淤塞的泉眼一寸寸掏开，把烂掉的旧渠重砌。做这活的人，往往手上全是伤口。蓝砚说：水是活的，你对它好，它才肯回来。这个道理，比任何律法都灵。"
 CYG_decision_ban_the_axe:"禁斧巡山"
 CYG_decision_ban_the_axe_desc:"巡山的人认得出每一棵老树，也认得出每一个不该砍树的人。抓到了，不罚钱，只罚种，砍一棵，种十棵，秋后回来点数。蓝砚说：罚钱他不心疼，罚他亲手把树种回去，他才会记得。"
 CYG_decision_communal_meal:"共炊"
 CYG_decision_communal_meal_desc:"共炊的一大锅饭，是谷中最实在的东西：柴是各家凑的，米是各家出的，煮好了所有人排队去盛，不论出力多少，都有一碗。有人说这不公平，蓝砚答：这世上哪有什么公平，能让明天还站着的人都吃到饭，这就是我们能想到的最公平。"
 CYG_decision_shelter_weak:"纳弱"
 CYG_decision_shelter_weak_desc:"谷里有一条不成文的规矩：先递一碗热茶，再谈别的。这条规矩养活的，不止是流民，还有沉玉谷自己，因为每一个被救过一次的人，后来大多都成了最不肯离开这片谷的人。"
 CYG_decision_herb_lesson:"传草方"
 CYG_decision_herb_lesson_desc:"把祖传的草方教给外人，在谷中老人听来，是败家的做法。蓝砚却坚持要教，说：方子藏在你手里，救一个人；教出去，救一片人。你这一辈子的本事，难道就只值一个人的命？"
 CYG_decision_patrol_paths:"巡径"
 CYG_decision_patrol_paths_desc:"巡径的人不是兵，他们只是些本来就要走这条路的牧童、采药人。他们不拿饷，也不列名册，只在路过时多看两眼。蓝砚说：这条路，我们比谁都熟，熟到它哪天掉了一块石头，我们都会知道。"
 CYG_decision_dig_well:"凿井"
 CYG_decision_dig_well_desc:"凿井靠的是运气和耐心。有时凿到最后还是干的，就得换个地方，从头再来。蓝砚说：我们这一生，可能凿十口井，九口是干的。可只要有一口出了水，这谷里所有人，就都活得下去了。"
 CYG_decision_refuse_levy:"拒纳"
 CYG_decision_refuse_levy_desc:"拒纳是最简单的反抗：不交，就是不给。简单，却要担得起后果。蓝砚说：拒是把自己想清楚，这一份不交，可能要拿命去换，值不值，你自己掂量。"
 CYG_decision_envoy_keqing:"使者赴玉衡"
 CYG_decision_envoy_keqing_desc:"玉衡的回信来得出乎意料地快，字里行间，通篇都在谈「土地如何分配」。蓝砚读了三遍，忽然觉得有点想笑：原来真有人，愿意认认真真地，把沉玉谷那点水土的账，当成一件正事来谈。"
 CYG_decision_envoy_ningguang:"使者赴群玉阁"
 CYG_decision_envoy_ningguang_desc:"群玉阁的回复最像一桩买卖：她们问的，全是沉玉谷一年能产多少粮、值多少钱。蓝砚让人回了一句：我们量的是土，不是钱。使者带回这话时，凝光沉默了很久，末了只淡淡说了一句：有意思。"
 CYG_decision_envoy_ganyu:"使者赴月海亭"
 CYG_decision_envoy_ganyu_desc:"月海亭是唯一一个，认真读了沉玉谷那份水土账的地方。甘雨甚至附来一份自己整理的粮政纪要。蓝砚把那份纪要反复翻看，最后说了一句：看来这世上，还是有人，肯蹲下来看一株草的。"
 CYG_decision_envoy_shenhe:"使者赴绝云间"
 CYG_decision_envoy_shenhe_desc:"绝云间的回复最冷：山有山的规矩，谷有谷的活法，互不相干。蓝砚看完却笑了：这样最好。我最怕的，是那种嘴上说要「帮」我们的人，帮来帮去，谷就成了他的了。"
 CYG_decision_envoy_childe:"使者赴云来海"
 CYG_decision_envoy_childe_desc:"云来海的使者一开口，谈的就是港口、航路、租约。蓝砚没等他说完，就把人请了出去。事后她说：他们要岭,要港，要一切能变成钱的东西。我只怕一样，他们哪一天，会想要这谷里的水。到那天，我连一捧土都不会给他。"
 CYG_decision_green_pact_rite:"立青约"
 CYG_decision_green_pact_rite_desc:"立青约，是沉玉谷把所有村社、所有流民、所有愿意守这片水土的人，一并写进同一份盟誓。没有仪式，没有印信，所有人只是把手，按在同一片土地上。蓝砚说：这座谷不是谁的，它只是恰好，是我们愿意用命去守的地方。"

 LYY_Event.7001.t:"沉玉自立"
 LYY_Event.7001.d:"帝君驾崩的消息，是顺着山风飘进沉玉谷的。蓝砚当时正蹲在一片枯黄的梯田边，手里攥着一把抓得起的沙。\n听完，她只是把沙慢慢撒回田里，说：城里的神死了，可这山里的土，早就死了好些年了。她直起腰，望向谷口那块写着征收赋税的旧木牌，对围拢来的谷民说：从今天起，这座谷的事，我们自己说了算。"
 LYY_Event.7001.a:"沉玉谷自立，不受港府节制"
 LYY_Event.7001.b:"虚与委蛇，暂保谷中安宁"
 LYY_Event.7002.t:"第一锹土"
 LYY_Event.7002.d:"复耕的第一锹土，是蓝砚亲手翻的。那把锄头很旧，柄上还有她父亲当年磨出的包浆。\n她翻了几锹，把土捧起来给大家看：你们看，底下还是湿的，还有蚯蚓。这片地，还没死透。围观的人里，一位老妇人忽然蹲下来，抓了一把土，捂在脸上哭了。蓝砚没有去劝，只低声说：哭吧。哭完了，就把锄头拿起来。"
 LYY_Event.7002.a:"亲自下田，问土于野"
 LYY_Event.7002.b:"先定赋税，再议农事"
 LYY_Event.7003.t:"老树之下"
 LYY_Event.7003.d:"村社大会选在谷里最大的那棵老树之下。没有主位，没有印信，所有人围坐成一圈。\n蓝砚站着把话说完，就退到人群外，任众人各议各的。有人嫌乱，说该有个说了算的。蓝砚答：谷里从前有过说了算的人，是那位把山卖掉的谷主。你们是怀念他，还是怀念那块地？满座沉默，随后，是此起彼伏的点头。"
 LYY_Event.7003.a:"设村社大会，众议决之"
 LYY_Event.7003.b:"选贤任能，令出一人"
 LYY_Event.7004.t:"禁斧令"
 LYY_Event.7004.d:"禁斧令立下那天，蓝砚亲自带人上山，把几个还在偷砍老树的人围住。\n那几人跪地求饶。蓝砚没有罚钱，只命人抬来一捆树苗，说：砍一棵，种十棵。从今天起，你们就住在这山上，把这些苗养活了再走。其中一人哭着说自己不会种。蓝砚答：我教。你们既然敢砍，就得学会怎么让它再长出来。"
 LYY_Event.7004.a:"立禁斧令，违者重罚"
 LYY_Event.7004.b:"缓行禁伐，先安民生"
 LYY_Event.7005.t:"护泉"
 LYY_Event.7005.d:"护泉那天，蓝砚以石砌渠、以草覆土，把谷中仅剩的几眼活泉一一圈护起来。\n一个想把泉眼旁改作牧场的富户不服，嚷着要告到港府去。蓝砚指着那眼泉，说：你告吧。可我先告诉你，这泉，是你家的祖上，也是靠它才活下来的。你要告倒我，得先告倒你自己的祖宗。富户张了张嘴，终究没有再去。"
 LYY_Event.7005.a:"砌渠护泉，寸土不让"
 LYY_Event.7005.b:"让泉于人，另择水源"
 LYY_Event.7006.t:"拒港府之命"
 LYY_Event.7006.d:"拒港府之命，是蓝砚第一次把话挑明。她把送来的文书逐条念完，一条不落地念给所有人听。\n念完她问：这些「福」，你们谁看见了？没有人应声。她把文书当场投进火盆，看着它烧成灰，才说：从今天起，沉玉谷的账，我们自己记。记错了，也是我们自己认，总好过，让别人替我们记一笔，永远算不清的糊涂账。"
 LYY_Event.7006.a:"拒港府之命，烧其文书"
 LYY_Event.7006.b:"受命暂安，徐图后计"
 LYY_Event.7007.t:"青田"
 LYY_Event.7007.d:"复耕的第二年，最先恢复的那片梯田里，苗长到了膝高。风一过，绿得晃眼。\n蓝砚立在田埂上，看着一个孩子在田里打滚，忽然眼眶发热。她别过头，对身边人说：别笑我。我只是想起我爹娘活着的时候，这片田是这个样子，他们临死前，还在念叨这件事，念叨了一辈子。"
 LYY_Event.7007.a:"广垦梯田，复其旧耕"
 LYY_Event.7007.b:"弃田迁徙，别寻生地"
 LYY_Event.7008.t:"共仓"
 LYY_Event.7008.d:"共仓的第一步，是把谷里最后几户还有余粮的人家，一一请到仓前。蓝砚不强迫，只让每户自己报、自己交。\n有人交了，有人没交，她都记下，却不追究。她说：我不逼你们。我只想让你们看看，交了的人家，冬天是怎么一起熬过来的。信任这东西，得先有人肯先交出去，才长得出来。"
 LYY_Event.7008.a:"立共仓，人人自报其粮"
 LYY_Event.7008.b:"各户自守，不相通济"
 LYY_Event.7009.t:"山径守望"
 LYY_Event.7009.d:"山径守望，是把谷中每一条能走人的路，都记进心里。守望者是牧童、采药人、砍柴的妇人。\n一个采药的孩子在隘口发现了一队生人，飞跑回来报信，谷中得以从容准备。事后众人夸他机灵，那孩子却说：是我天天走那条路，多出几个脚印，我都认得出来。"
 LYY_Event.7009.a:"设山径守望，人自为眼"
 LYY_Event.7009.b:"另募哨探，专司其事"
 LYY_Event.7010.t:"草根药"
 LYY_Event.7010.d:"谷中没有名医，只有老人传下来的几张方子，和满山的草。\n蓝砚把认草的几位老人请到一处，让他们把方子说出来，一一记下。有位老人不解，说这些方子传出去就不值钱了。蓝砚答：方子不值钱，值钱的是，明年那个发烧的孩子，能不能还认得草。老人怔了许久，第一个开了口。"
 LYY_Event.7010.a:"传草方于谷中"
 LYY_Event.7010.b:"藏方自守，不轻易传"
 LYY_Event.7011.t:"抗征"
 LYY_Event.7011.d:"抗征，是沉玉谷第一次真正动了手。港府派来的税吏带着兵堵在谷口，扬言交不出粮就断水封谷。\n蓝砚没有出面，只让守望者挖断了税吏必经的隘口。税吏狼狈退回，扬言算账。谷中一片欢呼，蓝砚却独自坐在田边，很久没有说话，她比谁都清楚，这条路一旦走上去，就再无回头。"
 LYY_Event.7011.a:"抗征不纳，断其道路"
 LYY_Event.7011.b:"屈从一时，再作打算"
 LYY_Event.7012.t:"共炊"
 LYY_Event.7012.d:"共炊那天，谷中架起了三口大锅，柴是各家凑的，米是各家出的。\n有人端着碗嫌这饭像乞丐讨来的。蓝砚把碗递到他手里，说：乞丐是等别人给；我们是自己煮给自己吃。你端着这碗饭，先想清楚，你既不欠谁的，也就不必谢谁。那人端着碗站了很久，最后蹲下来，一口一口吃完了。"
 LYY_Event.7012.a:"共炊大锅，人人一碗"
 LYY_Event.7012.b:"各家分炊，各安其分"
 LYY_Event.7013.t:"谷种之库"
 LYY_Event.7013.d:"谷种之库，是把各家留的最后一斗种，集中起来筛选、登记、分装。\n一位老人死活不肯交种，说那是祖上传下来的。蓝砚没有强求，只把自己的半袋口粮塞过去，说：换。你的种交给我，我的粮给你。明年开春，种子还是你的，粮不用还，只要这谷里，还有人愿意种田。老人捧着粮，手一颤，终究把种交了出来。"
 LYY_Event.7013.a:"设谷种之库，统收统发"
 LYY_Event.7013.b:"任各户自留，不加重扰"
 LYY_Event.7014.t:"护田队"
 LYY_Event.7014.d:"护田队成军那天，谷中第一批拿起武器的人站成一排。他们没有铠甲，手里握的是农具、猎弓和削尖的竹竿。\n蓝砚为每个人递上第一支竹矛。递到最后一个人时，她停下来，郑重地说：这不是让你们去杀人。这是让你们站在自家田边，让那些想动手的人，先掂量掂量，这片土，是有人在守的。"
 LYY_Event.7014.a:"编护田队，守我田垄"
 LYY_Event.7014.b:"不设武装，以免招祸"
 LYY_Event.7015.t:"山约"
 LYY_Event.7015.d:"山约写成那天，蓝砚通篇没有写一个「令」字。\n全是「我们既不纳不属于谷中的赋税，也不受不被谷中认同的号令」。有人问她这算什么章程。她答：这是一句话，这座谷，从今往后，自己认自己。说完，她第一个把手按在了纸上，墨迹在掌心晕开。"
 LYY_Event.7015.a:"立山约，谷自认谷"
 LYY_Event.7015.b:"不立约法，一切从简"
 LYY_Event.7016.t:"无主无君"
 LYY_Event.7016.d:"无主无君，是蓝砚把态度说到底的一句话：我们不要神，也不要王。\n有人问她，那你们信什么。她答：信土，信水，信明年还愿意留在这里的人。神会远走高飞，王会移驾别处，只有这片地，这些邻居，它们不会走，除非我们先不要它们。"
 LYY_Event.7016.a:"无主无君，自守其土"
 LYY_Event.7016.b:"另立首领，以图长久"
 LYY_Event.7017.t:"自由村社"
 LYY_Event.7017.d:"自由村社的构想，是十几个村子各自为政，遇到大事才聚在一处相商。\n有人担心这样的散沙打不过外人。蓝砚答：外人打进来时，你要的是一支能打仗的队伍，还是一片谁都不肯让出去的土地？她顿了顿：我选后者。一支队伍会散，一片土地，不会，只要种它的人还在。"
 LYY_Event.7017.a:"结自由村社，各治其事"
 LYY_Event.7017.b:"统合诸村，立一共主"
 LYY_Event.7018.t:"公田"
 LYY_Event.7018.d:"公田，是把谷主当年强占的土地，收归村社共有，按户分种，按劳分配。\n有人趁机多占，被人当面揭发。蓝砚没有偏袒，只让村社大会当众议定：多占者退还，并替被占之家耕作一季。她说：公田是让有私心的人，也得先学会一件事，叫遮掩不住。"
 LYY_Event.7018.a:"收田为公，按劳分配"
 LYY_Event.7018.b:"仍存私田，不予变更"
 LYY_Event.7019.t:"罢税去枷"
 LYY_Event.7019.d:"罢税去枷，是沉玉谷对外的宣告：谷中不得以任何名目征敛，谷中之人不得被以任何名目拘束。\n这条规矩刻在谷口的木牌上，来往的行人与流民都看得见。有人说这是自找麻烦。蓝砚说：麻烦本来就找上门了。与其被人绑着问要不要钱，不如我先说清楚，我不给。"
 LYY_Event.7019.a:"罢税去枷，昭告谷外"
 LYY_Event.7019.b:"暂缓废除，徐图后议"
 LYY_Event.7020.t:"轮值巡山"
 LYY_Event.7020.d:"轮值巡山，是谷中所有人的义务，不分男女老幼，只看力气大小。\n老人看守谷口的火堆，孩子瞭望山口，青壮巡更走夜路。蓝砚说：我不指望谁替谁白干一辈子。我只希望，每一个守过山的人，都记得自己守的是自家的院墙，这样，就没有人会偷懒。"
 LYY_Event.7020.a:"轮值巡山，人人有责"
 LYY_Event.7020.b:"雇人专职，以免民扰"
 LYY_Event.7021.t:"诸峰之会"
 LYY_Event.7021.d:"诸峰之会，是沉玉谷周边几个山村第一次齐聚。来的村社里，有些从前还是世仇。\n蓝砚不管旧怨，只让每个村社把自家的难处说一遍。说着说着，众人竟发现：他们怕的、缺的、恨的，原来是同一件事。散会时，一个从前的仇家主动过来，与对方握了手。蓝砚远远看着，只说了一句：这就对了。"
 LYY_Event.7021.a:"聚诸峰之会，共商其事"
 LYY_Event.7021.b:"各守其谷，不相往来"
 LYY_Event.7022.t:"风与草"
 LYY_Event.7022.d:"风与草，是谷中最安静的一场改革：把草籽撒在裸露的土坡上，让风携着种子，去往每一道伤口。\n有人说这太慢，等草长起来，人早饿死了。蓝砚答：人治不了山，山得自己治自己。我们只管把种子还给风，剩下的，交给时间。几年之后，最先绿起来的那道坡，成了谷中人常去看的地方，没有碑，没有名，只有一片绿。"
 LYY_Event.7022.a:"撒籽于坡，任风携之"
 LYY_Event.7022.b:"聚众造渠，以人力改之"
 LYY_Event.7023.t:"老树学堂"
 LYY_Event.7023.d:"老树学堂办起来那天，来的孩子不到十个，最小的还流着鼻涕。\n蓝砚教他们认草、认土、认天气、认方向。有人问她为何不教读书识礼。她答：等他们先认清了脚下这片地，再谈认字，一个连自己脚下的土都不认识的人，读了书，也是替别人读的。"
 LYY_Event.7023.a:"办老树学堂，教以农事"
 LYY_Event.7023.b:"缓办学堂，先顾生计"
 LYY_Event.7024.t:"草医授徒"
 LYY_Event.7024.d:"草医授徒，是把谷里最后几位老药婆的手艺，一句句记下来，编成歌诀，教给年轻的孩子。\n一位药婆临终前握着蓝砚的手，说：我这辈子治过的人，比认得我的字多。你替我把这些字补上，我就放心了。蓝砚答应了，并且真的做到了，多年以后，谷中人人会背那几段歌诀，只是再没人记得，那位婆婆叫什么名字。"
 LYY_Event.7024.a:"授草医于徒，广传其方"
 LYY_Event.7024.b:"严守医术，秘而不宣"
 LYY_Event.7025.t:"歌径"
 LYY_Event.7025.d:"歌径，是谷中最不像政令的东西：让每个村社把自家的故事编成歌，走山路时唱，插秧时唱，守夜时唱。\n蓝砚说：一个地方的歌，就是它的记忆。唱得越久，人就越舍不得走，再苦的地方，只要有歌，就有人愿意留下。那年冬天，谷里第一次没有出现全家外逃的村子，只有零零散散几个人走了，走时还回头唱了半句。"
 LYY_Event.7025.a:"编歌成径，存其记忆"
 LYY_Event.7025.b:"不置歌乐，务求肃静"
 LYY_Event.7026.t:"谷中无号令"
 LYY_Event.7026.d:"谷中无号令，是蓝砚理想中的样子：没有谁发号施令，也没有谁需要服从。\n有人说这种地方撑不久。蓝砚答：也许撑不久。可我想让活着的人，先过几年不必看别人脸色的日子，哪怕短一点，也算是真的活过。她把这话说给一个刚从港府治下逃来的流民听，那人听完，什么也没说，只是默默地留下了。"
 LYY_Event.7026.a:"任由众议，谷中无号令"
 LYY_Event.7026.b:"立规矩以治之，勿使太散"
 LYY_Event.7027.t:"开仓纳流民"
 LYY_Event.7027.d:"开仓纳流民，是沉玉谷最冒险的一次决定：谷中本就缺粮，蓝砚却主张把余粮分给逃进谷里的外人。\n村社大会上吵成一团。蓝砚只说了一句话：今天来的人是逃的，明天逃的，可能就是我们。你们想让自己将来站在别处的谷口时，听到的是谷中无粮，还是进来吧？满座寂静，随后有人站起来，第一个把自己的粮食搬去了仓前。"
 LYY_Event.7027.a:"开仓纳流民，共此艰难"
 LYY_Event.7027.b:"闭谷拒外，免生祸端"
 LYY_Event.7028.t:"青约"
 LYY_Event.7028.d:"青约签下那天没有仪式，只有所有人把手按在同一片土地上。\n蓝砚说：这座谷不是谁的，也不是我们的，它只是恰好，是我们愿意用命去守的地方。按完手印，有人问要不要立个碑。蓝砚摇头：不立碑。碑会倒，字会磨掉。要立，就把它立在每个种过这片田的人心里。"
 LYY_Event.7028.a:"立青约，与守土者共盟"
 LYY_Event.7028.b:"拒不立约，各行其是"
 LYY_Event.7029.t:"谷寿无疆"
 LYY_Event.7029.d:"谷寿无疆，是决心。蓝砚立在谷口那块木牌前，把手里一把沙，撒在牌子的脚下。\n她说：我们争的，从来不是一场仗的输赢。我们争的，是这片水土，能不能在我们走后，还养得起我们的孩子。若它能，就算今天我们全死在这里，也值了。说完，她转身往回走，脚步很稳。"
 LYY_Event.7029.a:"谷寿无疆，誓守此土"
 LYY_Event.7029.b:"另择他路，以求保全"
 LYY_Event.7030.t:"携种出山"
 LYY_Event.7030.d:"携种出山，是蓝砚第一次把目光投向谷外。她派人带着谷中的种子，走过璃月每一处荒田、每一口枯井。\n一个归来的人说，他在外头被人当成疯子，没人信土还能救。蓝砚听完，只说：那就再多走几个村子。这世上的事就是这样，你说一百遍没人信，可只要有一遍，碰上一个正绝望的人，就够了。"
 LYY_Event.7030.a:"携种出山，传于四方"
 LYY_Event.7030.b:"守谷不出，潜身自保"
 LYY_Event.7031.t:"江河之诉"
 LYY_Event.7031.d:"江河之诉，是把沉玉谷的声音，写进一条条流向大海的河里。\n蓝砚让人沿江而下，每到一处就讲一遍谷中的故事：枯了的泉、流失的土、被矿渣填平的溪。她说：我不指望全璃月都懂我们。我只希望，当有一天河水流到大港，那里的人至少知道，它从哪里来，知道一件东西的来处，就不那么容易，随手把它弄脏了。"
 LYY_Event.7031.a:"以江河为诉，言于天下"
 LYY_Event.7031.b:"默然守谷，不闻外事"
 LYY_Event.7032.t:"荒芜之谶"
 LYY_Event.7032.d:"荒芜之谶，是蓝砚说给整个璃月的警世之言。\n她说：照这样开山、修路、挖矿，不出二十年，璃月就会从海边开始，一块一块变成荒地。有人斥她危言耸听，她答：我宁愿做那只被你们骂的乌鸦。等你们真看见到处都是秃山的时候，我哪怕已经死了，也算对得起说过这句话。多年以后，有人在她墓前立了一块小石，上面只刻着两个字：说对了。"
 LYY_Event.7032.a:"作荒芜之谶，警醒世人"
 LYY_Event.7032.b:"藏其言，免招是非"
 LYY_Event.7033.t:"收留亡命"
 LYY_Event.7033.d:"收留亡命，是沉玉谷最招祸的事：谷中收下的，有被通缉的流民、逃兵、孤儿，甚至有从至冬占领区逃来的难民。\n有人劝蓝砚会引来大祸。她答：大祸早就来了。区别只在于，是它找上我们，还是我们迎上去。我宁愿迎上去。那年冬天，谷中多了一百多张嘴，也多了一百多双肯干活的手，和一百多个，再没打算离开的人。"
 LYY_Event.7033.a:"收留亡命，来者不拒"
 LYY_Event.7033.b:"慎纳外人，以防奸细"
 LYY_Event.7034.t:"毒井"
 LYY_Event.7034.d:"毒井，是沉玉谷出山之后，亲眼所见最严峻的一幕。因为上游开矿，几座村庄的井水变成了浑浊的黄汤。\n蓝砚蹲在井边，捧起一捧水，看了很久。她身后，一个母亲抱着病倒的孩子，一遍遍地问她能不能救。蓝砚站起身，对身边的人说：回去。告诉谷里的人，这就是我们为什么要出山。她说这话时，声音很平，眼睛却红着。"
 LYY_Event.7034.a:"亲赴毒井，勘其水势"
 LYY_Event.7034.b:"绕道而行，不问其事"
 LYY_Event.7035.t:"绿旗成行"
 LYY_Event.7035.d:"绿旗成行，是出山之后的沉玉谷第一次有了阵势。队伍排成一列列，旗上绣的是一片叶子。\n有人笑这不威武。蓝砚答：我们不是来吓人的。我们是来告诉他们，有这么一群人，愿意为一片叶子站着，站到他们不敢再往下挖为止。那面绣着叶子的旗，后来被人挂在了许多村口，成了一种不说话的默契。"
 LYY_Event.7035.a:"树绿叶之旗，结阵而行"
 LYY_Event.7035.b:"散走民间，不张旗帜"
 LYY_Event.7036.t:"焚炉"
 LYY_Event.7036.d:"焚炉，是这条路最激烈也最心碎的一幕。为阻止污染水源的矿炉继续开工，谷中队伍亲手烧掉了那几座炉子。\n火光映在河面上，像一场倒流的晚霞。蓝砚站在岸边，看着炉子轰然倒塌，忽然想起，那炉子里头，有几个烧炉的人，就是当年从谷中逃出去的旧邻。她闭上眼，很久才睁开，什么也没说。"
 LYY_Event.7036.a:"焚其污炉，绝其源头"
 LYY_Event.7036.b:"议而不行，另谋他法"
 LYY_Event.7037.t:"田垄学堂"
 LYY_Event.7037.d:"田垄学堂，是把课堂搬到田里：让每个出山的孩子，都在一片陌生的荒地上，亲手种出一茬东西。\n一个孩子种活了第一颗萝卜，捧着它跑来找蓝砚，满脸是泥。蓝砚蹲下来，认真地把那颗萝卜端详了很久，然后说：好。你现在知道，我们为什么要流血了。孩子似懂非懂，却把那颗萝卜，一路抱回了营里。"
 LYY_Event.7037.a:"设田垄学堂，教以耕种"
 LYY_Event.7037.b:"专注农事，不遑教化"
 LYY_Event.7038.t:"蔓根"
 LYY_Event.7038.d:"蔓根，是出山之后最让当权者头疼的东西：它不像军队，没有阵地，却像野草一样，从一个村庄蔓延到另一个村庄。\n有官员震怒，问这是什么组织。蓝砚被人问到这个，笑答：没有组织。你要抓，抓谁去？我们不过是让每一个种田的人，都学会问一句话，这块地，本来该是谁的？问的人多了，自然就成了一件事。"
 LYY_Event.7038.a:"蔓根四散，遍地而起"
 LYY_Event.7038.b:"集于一地，免遭围剿"
 LYY_Event.7039.t:"泽法"
 LYY_Event.7039.d:"泽法，是出山之后立的新规矩：凡有水处，不得截流、不得排污、不得私占。\n它管的是水，水往哪儿流，由天定，不由人定。有人说这管得太宽。蓝砚答：我这一生，别的都可以让，唯独水，一寸都不让。因为水让出去，就是命让出去。这话传开后，沿江几处村社，竟自发地把泽法抄写下来，贴在了自家的水口。"
 LYY_Event.7039.a:"立泽法，护水如命"
 LYY_Event.7039.b:"权宜行之，不必立规"
 LYY_Event.7040.t:"灰水"
 LYY_Event.7040.d:"灰水，是这场起事最沉重的一个名字。为了逼迫港府让步，谷中队伍切断了一处坝上的闸，让下游矿区的污水倒灌回上游。\n这手段很脏，脏到连追随者都犹豫。蓝砚却签了那道令，签完独自在河边坐到天亮。天亮时她说：我知道这样做不对。可有些地方，讲道理讲不通，那就只剩这一条，连我自己，也不干净的路了。"
 LYY_Event.7040.a:"决坝倒灌，以毒攻毒"
 LYY_Event.7040.b:"另择他策，不为此举"
 LYY_Event.7041.t:"田夫行"
 LYY_Event.7041.d:"田夫行，是出山声浪的最高潮。数不清的农民、药婆、猎人、流民，沿着田埂与江堤，举着绿叶与锄头，一路向璃月港走去。\n他们走得极慢，也极齐。蓝砚走在队伍中间，不说话，只是走。有人劝她骑马，她摇头。她说：我不需要他们为我造一座碑。我只需要他们，走完这一遭，然后回家，好好种田去。"
 LYY_Event.7041.a:"行田夫之行，直趋璃月港"
 LYY_Event.7041.b:"止于中途，勿涉险地"
 LYY_Event.7042.t:"最后的青山"
 LYY_Event.7042.d:"最后的青山，是蓝砚给这条路起的名字。她站在一处刚刚恢复生机的山坡上，望着脚下这片来之不易的绿。\n她说：我不求这天下都变成青山。我只求，当我们守不住所有地方的时候，至少还能守住这一座，只要这一座还在，就说明这件事，还有希望。她说完，蹲下身，亲手拔掉了脚边一株刚冒头的杂草，那是别人眼里的杂草，在她眼里，却是这片坡活过来的证据。"
 LYY_Event.7042.a:"守最后的青山，勿使再失"
 LYY_Event.7042.b:"全面出击，不留退路"
 LYY_Event.7043.t:"谷与天下"
 LYY_Event.7043.d:"谷与天下，是沉玉谷最终想明白的一件事：守住一座谷，就是守住整个世界的一个角落；而守住一个角落，也就等于守住了这座谷的未来。\n蓝砚说：山上的水流到山下的田，山下的烟飘回山上的云，谁也算不清，哪一部分是你的，哪一部分是我的。她望着远方的山影，忽然轻声补了一句：算不清，才好。算得清的东西，都是要被卖掉的。"
 LYY_Event.7043.a:"谷与天下，本为一事"
 LYY_Event.7043.b:"只守此谷，不闻外事"
 LYY_Event.7044.t:"谷中歌者"
 LYY_Event.7044.d:"谷中歌者是一位自小在沉玉谷长大的说书人，他把谷里的故事编成曲，每逢集日就在谷口唱给来往的人听。\n他唱的从来是那些没有名字的人：守了四十年泉的老人，雪天里分饼的孩子。蓝砚常去听，听完就走，从不说话。有人问她为何不赞一句。她说：他在唱我们。我若开口，就成了替自己鼓掌了。"
 LYY_Event.7044.a:"任歌者传唱，不赞一言"
 LYY_Event.7044.b:"禁其传唱，恐生事端"
 LYY_Event.7045.t:"旧矿之人"
 LYY_Event.7045.d:"旧矿之人，是沉玉谷里最不愿被提起的一群人：他们曾亲手挖空过这片山。如今石尘进了肺，他们咳血、佝偻，却仍每天上山，把当年挖出的大坑，一锹一锹地填回去。\n一个老人对蓝砚说：我不指望谁原谅我。我只是想在死前，把这块地还给它原来的样子。蓝砚没有说原谅，只说了一句：那就一起填。"
 LYY_Event.7045.a:"与旧矿之人，共填其坑"
 LYY_Event.7045.b:"清算旧恶，以正人心"
 LYY_Event.7046.t:"弱者的热茶"
 LYY_Event.7046.d:"弱者的热茶，是谷中一条不成文的规矩：每一个走进谷中的弱者，都该先被递上一碗热茶，喝完再谈别的。\n有一年冬天，一个冻僵的陌生人在谷口被救下。他醒来后的第一件事，是问自己欠了谷里多少。递茶的老妇答：不欠。这碗茶，是这座谷里所有人，用他们自己最难的那些日子，一点一点熬出来的。"
 LYY_Event.7046.a:"以热茶待弱者，谷中之规"
 LYY_Event.7046.b:"量力而行，不必强求"
 LYY_Event.7047.t:"上奥藏之路"
 LYY_Event.7047.d:"上奥藏之路，是一条几乎废掉的老山路。蓝砚带人一寸寸把它修通，不为运货，也不为打仗。\n有人不解，问她费这么大劲，图什么。她说：为了春天的时候，谷里的人能上山，看一眼那片只开七天的花。人活着，不能光是熬。总得有个地方，是专门用来，让人看一眼就知道，这日子还值得过的。"
 LYY_Event.7047.a:"修上奥藏之路，以观山花"
 LYY_Event.7047.b:"移作他用，以省人力"
 LYY_Event.7048.t:"举谷而动"
 LYY_Event.7048.d:"举谷而动，是沉玉谷把所有力气都押上去的时刻：老人留下看门，孩子跟着妇人，青壮全部扛起了农具与猎弓。\n没有鼓，没有令旗，只有一声声传遍山谷的呼喊。蓝砚站在最前面，回头望了一眼谷口那棵老树，那是她小时候，她父亲指着教她认草的地方。她转回头，迈出了第一步，没有再回头。"
 LYY_Event.7048.a:"举谷而动，倾尽所有"
 LYY_Event.7048.b:"按兵不动，留有余力"
 LYY_Event.7049.t:"拒斥璃月港"
 LYY_Event.7049.d:"拒斥璃月港，是一个选择。港府递来的招抚文书上，写着官位、钱粮、名分，条件优厚得让人心动。\n蓝砚当着使者的面，把文书折好，还了回去：你们给的这些，我一样都不要。我要的只有一件事，你们从此，别再打沉玉谷水与土的主意。使者脸色难看地走了。蓝砚却神色平静，仿佛只是在谈一桩田垄间的寻常小事。"
 LYY_Event.7049.a:"拒斥璃月港之招抚"
 LYY_Event.7049.b:"受其招抚，换谷中安宁"
 LYY_Event.7050.t:"谷连天下"
 LYY_Event.7050.d:"谷连天下那一天，沉玉谷的绿旗，插到了璃月港最高的城墙上。蓝砚是被众人抬着到那里的，她早已累得走不动路。\n她靠在城墙边，望着脚下这片被战火与开垦搅得满目疮痍的土地，忽然没有想象中的激动。她只说了一句：这城，比我想的要大，也比我想的，更荒。随行的人都静了下来。良久，她又补了一句：那就……从头再种吧。"
 LYY_Event.7050.a:"以谷连天下，自此一统"
 LYY_Event.7050.b:"功成身退，还政于民"
 LYY_Event.7051.t:"玉衡的回信"
 LYY_Event.7051.d:"玉衡的回信来得出乎意料地快，通篇都在谈土地如何分配、佃户如何自耕。\n蓝砚读了三遍，忽然觉得有点想笑。她对使者说：我原以为，玉衡那位，满脑子都是革命、口号和主义。没想到她肯认认真真，和我说一整页的田垄田埂。使者回来复命时才发现，蓝砚把那封信，小心地收进了装谷种的木箱里。"
 LYY_Event.7051.a:"回信玉衡，共议田政"
 LYY_Event.7051.b:"婉拒其意，各行其是"
 LYY_Event.7052.t:"群玉阁的问"
 LYY_Event.7052.d:"群玉阁的回复最像一桩买卖，问的全是沉玉谷一年能产多少粮、值多少钱。\n蓝砚让人回了一句：我们量的是土，不是钱。使者带回这话，凝光沉默了很久，末了只淡淡说了一句：有意思。后来，群玉阁的一份密札里，出现了这样一行批注，「沉玉谷之患，不在其兵，在其不可定价」。"
 LYY_Event.7052.a:"答群玉阁：我们量的是土"
 LYY_Event.7052.b:"投其所好，与商周旋"
 LYY_Event.7053.t:"月海亭的纪要"
 LYY_Event.7053.d:"月海亭是唯一一个认真读了沉玉谷那份水土账的地方，甘雨甚至附来一份自己整理的粮政纪要。\n蓝砚把那份纪要反复翻看，最后说：看来这世上，还是有人肯蹲下来，看一株草的。她当即让人回赠一袋谷中新收的种子，附言只有一句：你若真来，我们这谷里，留一碗热茶给你。"
 LYY_Event.7053.a:"回赠谷种，留一碗热茶"
 LYY_Event.7053.b:"拒其亲近，不苟言笑"
 LYY_Event.7054.t:"绝云间的冷"
 LYY_Event.7054.d:"绝云间的回复最冷：山有山的规矩，谷有谷的活法，互不相干。\n蓝砚看完，反倒笑了：这样最好。我最怕那种嘴上说要「帮」我们的人，帮来帮去，谷就成了他的了。她把那片薄薄的绢信随手夹进一本旧账里，转身又去忙谷中的农事，仿佛那只是山谷之外，一件无关紧要的闲事。"
 LYY_Event.7054.a:"敬其不相扰，各守其土"
 LYY_Event.7054.b:"通使结好，共御外敌"
 LYY_Event.7055.t:"云来海的算盘"
 LYY_Event.7055.d:"云来海的使者一开口，谈的就是港口、航路、租约。蓝砚没等他说完，就把人请了出去。\n事后她说：他们要岭，要港，要一切能变成钱的东西。我只怕一样，他们哪一天，会想要这谷里的水。到那天，我连一捧土都不会给他。使者回到船上，把这话原样转述。达达利亚听完，破天荒地沉默了很久，才笑着说了一句：有意思的人。"
 LYY_Event.7055.a:"拒云来海之约，寸土不让"
 LYY_Event.7055.b:"虚与委蛇，以图苟安"
 LYY_Event.7056.t:"青约之立"
 LYY_Event.7056.d:"青约立下的那一刻，没有仪式，没有印信，所有人只是把手按在同一片土地上。\n蓝砚说：这座谷不是谁的，它只是恰好，是我们愿意用命去守的地方。有人提议立碑，她摇头：碑会倒，字会磨掉。要立，就把它立在每个种过这片田的人心里。散场时，天色已晚，谷中人三三两两往回走，谁也没有说话，可每个人的脚步，都像是踩在更实的地上。"
 LYY_Event.7056.a:"立青约，与众共守此土"
 LYY_Event.7056.b:"立青约而不设盟主"

 CYG_Spirit_Valley_Vigil:"沉玉守望"
 CYG_Spirit_Valley_Vigil_desc:"一个蹲在枯黄田边、攥着一把沙的年轻人。她放下沙的那一刻，也放下了这座谷，往后所有的顺从。"
 CYG_Spirit_School_of_Grass:"草木之学"
 CYG_Spirit_School_of_Grass_desc:"认草、认土、认天气、认方向。老树底下的学堂不教经史，只教孩子们认清脚下这片地，一个连土都不认得的人，读了书，也是替别人读的。"
 CYG_Spirit_Valley_Endures:"谷寿无疆"
 CYG_Spirit_Valley_Endures_desc:"是决心：这片水土，能不能在我们走后，还养得起我们的孩子。若能，就算今天全死在这里，也值了。"
 CYG_Spirit_The_Last_Green_Hill:"最后的青山"
 CYG_Spirit_The_Last_Green_Hill_desc:"不求这天下都变成青山，只求守住这一座。只要它还在，就说明这件事还有希望，哪怕希望，只剩这一座山的重量。"
 CYG_Spirit_Green_Alliance:"青约之盟"
 CYG_Spirit_Green_Alliance_desc:"不树旗，不立国，只与所有愿意守这片水土的人结为一体。这座谷不是谁的，它只是恰好，是我们愿意用命去守的地方。"
 CYG_Spirit_Common_Granary:"共仓"
 CYG_Spirit_Common_Granary_desc:"信任这东西，得先有人肯先交出去，才长得出来。共仓里存的从来是一谷人愿意把后背交给彼此的凭据。"
 CYG_Spirit_Terrace_Militia:"护田队"
 CYG_Spirit_Terrace_Militia_desc:"没有铠甲，没有军饷，手里握的不过是农具与竹矛。他们要守的也不是城池，只是自家田边，那一道不愿被踩过去的田埂。"
 CYG_Spirit_Herb_Doctors:"草医之传"
 CYG_Spirit_Herb_Doctors_desc:"祖传的方子教出去，救的就是一片人。谷中人人会背那几段歌诀，只是再没人记得，那位写下歌诀的婆婆，叫什么名字。"
 CYG_Spirit_Spreading_Root:"蔓根"
 CYG_Spirit_Spreading_Root_desc:"它不像军队，没有阵地，却像野草一样从一个村庄蔓延到另一个。你要抓，抓谁去？不过是让每个种田的人，都学会问一句：这块地，本来该是谁的？"
 CYG_Spirit_Song_of_the_River:"江河之诉"
 CYG_Spirit_Song_of_the_River_desc:"山上的水流到山下的田，山下的烟飘回山上的云。谁也算不清，哪一部分是你的，哪一部分是我的，算得清的东西，都是要被卖掉的。"
 CYG_Spirit_Five_Envoys:"五方通使"
 CYG_Spirit_Five_Envoys_desc:"五个方向，五种回应：有人在信里算了一整页的田垄，有人只回了一句「我们量的是土」。蓝砚未必说服过谁，但她让所有人都知道，这片谷，不是没有脾气的。"
 CYG_Spirit_Silent_Valley:"谷中无号令"
 CYG_Spirit_Silent_Valley_desc:"没有谁发号施令，也没有谁需要服从。也许撑不久，可活着的人，总算先过了几年，不必看别人脸色的日子。"

 CYG_Soil_Tier_1:"水土等级"
 CYG_Soil_Tier_1_desc:"水土崩坏，泉眼枯竭，田垄沙化。谷中抓一把土，大半是握不住的沙，风一过就散了。"
 CYG_Soil_Tier_2:"水土等级"
 CYG_Soil_Tier_2_desc:"水土将复，泉眼回潮，坡上见草。这片地还虚着，可它已经在往好的方向，一寸一寸地挪。"
 CYG_Soil_Tier_3:"水土等级"
 CYG_Soil_Tier_3_desc:"水土渐养，梯田成片，草木成荫。谷里的孩子，第一次见过成片开花的山坡。"
 CYG_Soil_Tier_4:"水土等级"
 CYG_Soil_Tier_4_desc:"水土归元，旧伤初愈，地力渐厚。多少年的透支，终于在这一茬新苗里，被一点点还回来。"
 CYG_Soil_Tier_5:"水土等级"
 CYG_Soil_Tier_5_desc:"水土大盛，风过草伏，满目青山。极盛的生机之下，蓝砚反而更警惕：福气来得越厚，越经不起有人动一次歪念。"
 CYG_Will_Tier_1:"山心等级"
 CYG_Will_Tier_1_desc:"山心涣散，人心浮动，各奔东西。谷中谁都不想多留一天，只盼着天一亮就出谷去。"
 CYG_Will_Tier_2:"山心等级"
 CYG_Will_Tier_2_desc:"山心初聚，有人愿留，有人肯干。谷中总算有了几户，把根重新扎下的打算。"
 CYG_Will_Tier_3:"山心等级"
 CYG_Will_Tier_3_desc:"山心相连，村社相通，守望相助。谁家断粮，都不必再一个人扛着。"
 CYG_Will_Tier_4:"山心等级"
 CYG_Will_Tier_4_desc:"山心如铁，人人守土，寸步不让。谷中没有一个局外人，连孩子都记得自家的田在哪儿。"
 CYG_Will_Tier_5:"山心等级"
 CYG_Will_Tier_5_desc:"山心成岳，众志如山，不可撼动。这份凝聚守住了整座谷，也可能在某一刻，让谷中的人，再也听不见谷外的哭声。"
 CYG_Combo_Twin_High:"水土两旺"
 CYG_Combo_Twin_High_desc:"田里有水，谷中有人。这是沉玉谷最像故乡的一段日子，也是最短暂的一段。"
 CYG_Combo_Twin_Low:"山穷水尽"
 CYG_Combo_Twin_Low_desc:"地枯了，人心也散了。留守的人越来越少，藤篱后面，是一院没人收拾的枯叶。"
 CYG_Combo_A_High:"丰土移心"
 CYG_Combo_A_High_desc:"水草丰足，守谷的心却淡了。吃饱之后，人开始想山外的热闹。"
 CYG_Combo_B_High:"人心守土"
 CYG_Combo_B_High_desc:"地力将尽，人心却未散。大家把最后一点粮分着吃，也把最后一口气留着守田埂。"

 #################### 蓝砚 · 沉玉谷（CYG） · 战后 ####################
 CYG_PW_Dawn_of_Soil:"水土之晨"
 CYG_PW_Dawn_of_Soil_desc:"谷连天下之后的第一个早晨，蓝砚没有进城受贺。她带一把谷中的土，蹲在废弃码头边，把土倒进海水里，看它散开。随行的人都沉默。她说：先别说我们赢了。这城里的地，比我们想的更硬更咸，要种活它，得先知道它坏在哪里。说完，她把空袋子折好，收进了怀里。"
 CYG_PW_Clear_the_Silt:"淘淤疏渠"
 CYG_PW_Clear_the_Silt_desc:"淘淤最脏，也最急。谷中的渠被矿渣和乱石填死多年，蓝砚第一个下到渠里，一寸一寸把淤掏出来。有人嫌臭，捂着鼻子站在岸上。她抬头看了一眼，说：你嫌臭，是还站在岸上。等你哪天渴了，就别站在岸上。那人默不作声，跳了下来。"
 CYG_PW_Rebuild_the_Terraces:"复梯田"
 CYG_PW_Rebuild_the_Terraces_desc:"复梯田先得垒埂。谷中老人记得每一道田埂的走向，年轻人有把子力气。蓝砚让他们一对一带，一个说，一个垒。有个年轻人垒歪了，老人骂他。蓝砚拦住：他没听清你说的是哪一垄。换过来，一个垒，一个说。第二遍，田埂就直了。"
 CYG_PW_Plant_the_Bare_Slopes:"封山育林"
 CYG_PW_Plant_the_Bare_Slopes_desc:"封山令立下那天，蓝砚把谷中还提着斧子的人，全带到一片光秃的坡上。坡上只剩树桩，风一过，砂子打在脸上生疼。她说：你们站一站，看这里的风是怎么进骨头的。砍树的账不用还钱，把这些苗养活，就算还清了。众人站着没动，衣角被吹得直响。"
 CYG_PW_Green_the_Watershed:"青源"
 CYG_PW_Green_the_Watershed_desc:"青源是蓝砚给上游那道分水岭起的名字。她立下一条规矩：凡在岭上动土的，先得让下游三个村社点头。港里来的官说不合章程。蓝砚答：章程是人写的，水是自己流的。你要挖，先让下游的人来跟你说，不必我去说。那官想了半晌，说要回去商议。"
 CYG_PW_The_Valley_Granary:"共仓"
 CYG_PW_The_Valley_Granary_desc:"共仓开仓那天，蓝砚摆了一张长桌，让每户自己报数，交多交少都不问。有个寡妇只交了半斗米，低着头不敢看人。蓝砚把册子推过去，说：你自己写。她不会写，蓝砚就握着她的手，一笔一笔写下来。写完，寡妇蹲在桌边，捂住了脸。"
 CYG_PW_The_Register_of_Fields:"田册"
 CYG_PW_The_Register_of_Fields_desc:"田册从头到尾只记两样：谁种，种什么。有人劝蓝砚记得细些，好收税。她摇头：这册子是拿来认人的。有个老农翻着自己那一行看了很久，说他一辈子没在册上占过这么清楚的一行。蓝砚答：占清楚了就好，往后谁动你的田，你拿它去说。"
 CYG_PW_The_Grass_Schools:"草木学堂"
 CYG_PW_The_Grass_Schools_desc:"学堂设在老树底下，没有书，第一课教认草。蓝砚让每个孩子从坡上拔三株不同的草回来，摆成一排，一株一株讲。一个孩子把药草当成野草拔了。蓝砚没有责他，只说：今天你认错一株，明天可能就救错一个人。孩子红着脸，把那株草重新埋回土里，埋得很深。"
 CYG_PW_The_Herb_Lectern:"草医讲堂"
 CYG_PW_The_Herb_Lectern_desc:"草医讲堂的第一批学生，有几个原本是矿上的伤工。蓝砚把几位老药婆请到堂上，让她们说方子，学生一句句记。一位婆婆说到一半忘了，急得直拍腿。有个学生说：婆婆你手上那道疤，是不是当年治什么留下的？婆婆愣住，忽然全想起来了。蓝砚在门外听着，没有进去。"
 CYG_PW_Clean_Stoves:"净炉"
 CYG_PW_Clean_Stoves_desc:"净炉是谷中炉子先做出来的样子：炉膛加高，烟道绕两道弯，灰沉在底，烟就淡了。谷中的匠人做出来，给港里的炉主看。炉主笑他们费事。蓝砚只说：你们多烧的那点煤，够我们一村人过冬。你们嫌费事，是烟没落在自家院里。她说这话时，正站在炉主家那口浮着黑水的井边。"
 CYG_PW_The_Slow_Road:"缓路"
 CYG_PW_The_Slow_Road_desc:"缓路修得慢，也修得弯，绕开几处老林与泉眼。有人嫌耽误生意。蓝砚带那人走了三天新路，路上见了三处野鹿饮水的洼地。她说：你省下两天，是把这些洼地填了；你多走两天，是给它们留着。你算算，哪头划算。那人一路没再说话。"
 CYG_PW_Seed_Bank:"谷种之库"
 CYG_PW_Seed_Bank_desc:"谷种之库把各家最后一斗种收拢，按品种分装，登记在册。有个老人抱着种子迟迟不交，那是祖上传下的。蓝砚没有催，只把自己的半袋口粮放到他脚边，说：换。种先存进库，开春还你，粮不用还。老人看看粮，又看看怀里的种，最后递了过去，手一直在抖。"
 CYG_PW_The_Water_Mills:"水碓"
 CYG_PW_The_Water_Mills_desc:"水碓是谷中第一件不必烧煤的机器。蓝砚让人在山溪上架了十几架，借水流舂米、捣药、纺线。有人提议搬到港边，好做大。蓝砚问：搬过去，水从哪来？那人说烧煤抽水。她笑了：那就不叫水碓了，那叫又一座炉子。她让人在溪边又添了两架。"
 CYG_PW_Envoys_of_the_Soil:"遣使四方"
 CYG_PW_Envoys_of_the_Soil_desc:"内战刚停，蓝砚派使节出门，带的是谷中一袋新收的种子，和一封写得极短的信。信上只有一句：水土的账，不认地界。有人劝她多带厚礼。她说：带厚礼是求人，带种子是问一句愿不愿意一起种。愿不愿意，问不出来，得看他们回什么。半月后，回信陆续到了，长短不一。"
 CYG_PW_With_Keqing:"与玉衡"
 CYG_PW_With_Keqing_desc:"玉衡的回信来得快，通篇谈佃户如何自耕、田亩如何分。蓝砚读了三遍，把信收进装谷种的木箱里。使者不解，问为何不放在公案上。蓝砚说：这信里说的，是我认得的字。人家肯坐下来跟我算田垄，我就把它搁在离田最近的地方。说完，她又让人回赠一斗新谷。"
 CYG_PW_With_Ningguang:"与群玉阁"
 CYG_PW_With_Ningguang_desc:"群玉阁的问法最像买卖：沉玉谷一年能出多少粮，值多少银。蓝砚让人回了一句：我们量的是土，不是钱。使者带回这话，凝光沉默了很久，末了只说了一句有意思。后来群玉阁的一份密札里多了一行批注：沉玉谷之患，不在其兵，在其不可定价。蓝砚听说后，只笑了笑。"
 CYG_PW_With_Ganyu:"与月海亭"
 CYG_PW_With_Ganyu_desc:"月海亭是唯一认真读了那份水土账的地方。甘雨甚至附来一份自己整理的粮政纪要。蓝砚翻来覆去地看，末了说：看来这世上，还是有人肯蹲下来，看一株草的。她当即让人回赠一袋谷种，附言只有一句：你若来，谷里留一碗热茶。信送出后，她在仓门口站了很久。"
 CYG_PW_With_Shenhe:"与绝云间"
 CYG_PW_With_Shenhe_desc:"绝云间的回复最冷：山有山的规矩，谷有谷的活法，互不相干。蓝砚看完，反倒笑了。她说：这样最好。我最怕那种嘴上说要帮我们的人。帮来帮去，谷就成了他的。她把那片薄绢随手夹进一本旧账里，转身去忙农事，仿佛那只是谷外一件无关紧要的闲事。"
 CYG_PW_With_Childe:"与云来海"
 CYG_PW_With_Childe_desc:"云来海的使者一开口，谈的就是港口、航路、租约。蓝砚没等他说完，就把人请了出去。事后她说：他们要岭，要港，要一切能变成钱的东西。我只怕一样，他们哪天会想要这谷里的水。到那天，我连一捧土都不会给他。使者把这话原样转述，达达利亚沉默了很久。"
 CYG_PW_The_Green_Convention:"青之共约"
 CYG_PW_The_Green_Convention_desc:"青之共约谈成那天，须弥的雨林学者、枫丹的水利官、蒙德的自然主义者，各带自家的卷子来。蓝砚没有摆席，只把四张桌子拼成一张，让人把谷中那份最丑的水土账摊在正中。她说：我们的账最丑，先摊我们的。谁看见不对就指出来。散场时，四张桌上的纸已经摞得老高。"
 CYG_PW_The_Empty_Altar:"空神位"
 CYG_PW_The_Empty_Altar_desc:"帝君的神位空了，蓝砚进港时在那座殿前站了一会儿。殿里没有香火，只有几个孩子趴在门槛上玩石子。随行的人问要不要上炷香。蓝砚摇头：香是烧给活人看的。她又说：我们不求神来认，只求这殿里的风，别把外头新栽的苗吹折了。说完，她绕过神位，去看殿后那块荒地。"
 CYG_PW_The_Order_of_Heaven_and_Earth:"天地之序"
 CYG_PW_The_Order_of_Heaven_and_Earth_desc:"蓝砚让人把谷中历年记下的物候抄成一册：哪一天溪水涨，哪一天山花落，哪一天雪到谷口。抄完，她添了一行小字：天地自有其序，不需神来认证。有人劝她别写，怕招祸。她说：我写的是溪水涨落的日期，又不是骂谁。真有人来问，我就把这一册拿给他看。"
 CYG_PW_No_God_Need_Certify:"不须神证"
 CYG_PW_No_God_Need_Certify_desc:"有人问蓝砚，不敬神明，这天下怎么站得住。她带那人去看山坡上自生的草。草没人种，也没人拜，年年自己长。她说：它们不长给谁看，只长给自己。人也一样。你要有人来认证，才敢活下去，那你这辈子，都在给别人的眼睛活着。那人站在坡上，看了很久。"
 CYG_PW_The_Wound_of_the_Earth:"大地之伤"
 CYG_PW_The_Wound_of_the_Earth_desc:"层岩的裂口蓝砚去看过一回。她蹲在边上没说话，拿手量了量裂口的宽，又量了量深，记进随身的本子。随行的匠人问她在算什么。她说：算这片土受了多重的伤。匠人说这伤治不好。她答：治不好也得治，不能只糊一层水泥，糊完它还在底下烂。回去后，她把谷中的草医也调了来。"
 CYG_PW_Heal_Not_Plug:"治而非堵"
 CYG_PW_Heal_Not_Plug_desc:"谷中老辈人懂这个理：伤口要露着，结痂才结实；捂着不散，反倒烂在里头。蓝砚把这句原封不动讲给那些只懂封堵的匠人听。她说：裂口是大地受的伤。你年年堵，它年年裂。得让它自己长一层新土出来，那才叫治。匠人面面相觑，一个老匠人先点了头。"
 CYG_PW_The_Abyss_Springs:"渊泉"
 CYG_PW_The_Abyss_Springs_desc:"渊泉是治裂之后，谷中人在裂口边上养出来的第一眼活水。水清，浅，不多，却常年不干。有人要围着它筑墙，怕被人看见。蓝砚拦住：筑了墙，水就死了。让它敞着，谁来打水都行。她在泉边立了一块木牌，只写着：此处可打水，不可洗染。后来牌子换了三次，字始终是这几个。"
 CYG_PW_A_Sky_Without_A_Seal:"无印之天"
 CYG_PW_A_Sky_Without_A_Seal_desc:"蓝砚派人往天空岛的方向走了一趟，送去一封问话。信上只有两句：若天理仍在，请现身谈一谈；若不在，请容许我们自己走路。使节两手空空地回来，说一路无人应答。蓝砚在回执上批了两个字：已知。她把那卷空白的回函收进档案，位置就在水土账的旁边。"
 CYG_PW_The_Terrace_Watch:"护田队"
 CYG_PW_The_Terrace_Watch_desc:"护田队成军那天，谷中第一批人握的是农具、猎弓和削尖的竹竿，没有铠甲，也没有军饷。蓝砚为每人递上一支竹矛。递到最后一个人时，她停下来，说：这不是让你们去杀人。这是让你们站在自家田边，让想动手的人先掂量掂量，这片土是有人在守的。"
 CYG_PW_The_Spreading_Watch:"蔓哨"
 CYG_PW_The_Spreading_Watch_desc:"蔓哨没有名册，也不列营。牧童、采药人、砍柴的妇人，本就是天天要走山路的人，只比旁人多了句嘱咐：多看一眼。有个采药的孩子在隘口见了一队生人，跑回来报信，谷中得以从容。事后众人夸他机灵，他却说：是我天天走那条路，多出几个脚印，我都认得。"
 CYG_PW_The_Poison_Patrol:"防污巡队"
 CYG_PW_The_Poison_Patrol_desc:"防污巡队守的是一条水线。上游哪处矿口夜里偷排，哪条渠的颜色不对，他们都记下来。有一回，巡队在半夜截住几辆往下游倒渣的车。车上的人出了高价。带队的年轻人只是摇头，说：你们给的钱，买不了我娘喝的那口井。第二天，那几辆车的号牌被抄在了谷口的布告上。"
 CYG_PW_No_Standing_Army:"不设常备"
 CYG_PW_No_Standing_Army_desc:"蓝砚不主张养一支常备的兵。她的理由是：常备的兵，久了就只认发饷的人，不认田。谷里要真有能打仗的，还得是种田的人。她让各村的护田队轮流受训，农忙时解散，农闲时操练。有人担心这样打不了硬仗。她说：未必。真到要紧时候，一支知道自己身后是哪块田的队伍，比什么都顶用。"
 CYG_PW_Bamboo_Spears_and_Notices:"竹矛与布告"
 CYG_PW_Bamboo_Spears_and_Notices_desc:"蓝砚订了一条规矩：谷口立布告，竹矛只对外，不对内。凡谷中人有争执，一律到村社大会上说，谁也不许动家伙。有两个人因争水打了架，被各罚替对方挑水一月。蓝砚把那两支竹矛挂在谷口树上，挂了整整一季。有人问挂它做什么。她说：挂着，让每个人路过都想一想。"
 CYG_PW_The_Great_Debate_of_the_Valley:"谷中的大辩论"
 CYG_PW_The_Great_Debate_of_the_Valley_desc:"统一之后，谷里分成两拨：一拨说该把水土的规矩推到整个璃月，一拨说该守好山谷，别管城里的闲事。蓝砚把两拨人请到同一棵老树下，让他们自己吵。吵了三天，嗓子都哑了，也没吵出结果。散场时，蓝砚只说：吵不完也好。真吵完了，才是没人敢开口了。"
 CYG_PW_A_Soil_Pact_to_the_Whole_Land:"水土之约推向全境"
 CYG_PW_A_Soil_Pact_to_the_Whole_Land_desc:"水土之约推向全境的头一步，是把谷中的禁伐、护泉、公仓几条，原样抄成告示，贴到璃月各处。有人问这管不管用。蓝砚说：先贴出去再说。至少让每个还在砍树的人知道，有这么一件事，是有人不同意的。头一批告示贴出后，有个城里的老人专程来谷里多要了几张。"
 CYG_PW_A_Slow_the_Whole_Harbor:"让璃月港慢下来"
 CYG_PW_A_Slow_the_Whole_Harbor_desc:"让璃月港慢下来，蓝砚要的是它把步子放匀。她提的第一件事很简单：开工前先问一句，这地方的土和水能不能受得住。这条规矩一上来就得罪了不少人。有个大商号当面讥她。蓝砚没有回嘴，只请他去看港边那片被填平的老滩。那人看见滩底埋着的旧船板，半晌没说话。"
 CYG_PW_A_Water_and_Rainforest:"雨林与水利并肩"
 CYG_PW_A_Water_and_Rainforest_desc:"须弥的学者带来成箱的雨林图志，枫丹的水利官带来整套测水法门。蓝砚把两拨人请到一处，摆出谷中那份最丑的水土账。她说：我们的账最丑，先摊我们的。学者指着图志说，这里和你们谷中的坡向是一路的。水利官接着算了一夜。天亮时，几页纸拼在了一处。"
 CYG_PW_A_The_Wetland_Academy:"泽畔学舍"
 CYG_PW_A_The_Wetland_Academy_desc:"泽畔学舍开在谷外的第一处湿地上。蓝砚请须弥的学者来教雨林里的活法，请枫丹的水利官来教测水，也让谷中的老农来讲怎么认土。第一堂课上，三方各说各的，谁也听不懂谁。蓝砚让人把三张图并排挂在墙上，说：先看，不用急着懂。三个月后，有学生自己画出了第四张。"
 CYG_PW_A_The_Shared_Fields:"共治之田"
 CYG_PW_A_The_Shared_Fields_desc:"共治之田是把谷中的公田之法，试着挪到城郊的几处荒地上。荒地归村社共有，按户分种，收成按劳分。第一年就出了争执：一户多占了半垄，被人当面揭发。蓝砚没有偏袒，只让村社大会当众议定，多占者退还，并替被占之家耕作一季。她说：有私心不要紧，别遮得住就行。"
 CYG_PW_A_Advise_the_Halls:"山心入庙堂"
 CYG_PW_A_Advise_the_Halls_desc:"山心入庙堂，是让谷中的村社推几个人，进璃月的议事厅坐着。他们不会说漂亮话，多数时候只是听着。有一回，众人正争一笔开销，一个谷中来的老农开口说：这笔钱，够我们那一带打二十口井。满堂静了一静。那笔开销后来被砍去一半，挪去凿井。散会后，老农在门口站了很久。"
 CYG_PW_A_The_Price_of_Slowness:"慢的代价"
 CYG_PW_A_The_Price_of_Slowness_desc:"慢是有代价的。头一年，璃月的新港比邻邦晚了两个月开埠，边上几条商路也被别家抢了先。有人在议事厅里当面责难。蓝砚没有辩解，只把两本账并排放着：一本是省下的工期，一本是保住的水源与林子。她说：你们看哪本厚。众人传看了一阵，没有人再开口。"
 CYG_PW_A_The_Land_and_the_Soil_Law:"山河共治"
 CYG_PW_A_The_Land_and_the_Soil_Law_desc:"山河共治写成的那天，蓝砚把水土之约和璃月原本的几部旧律，摊在同一张长桌上，逐条比对。哪条合得上就留着，哪条相冲就当面说清楚。她说到最后一条时停了停：这一条是这片地自己定的。谁要改，先来问我这片地上种田的人。说完，她把两卷文书用麻绳捆好。"
 CYG_PW_B_Back_to_the_Valley:"退回山谷"
 CYG_PW_B_Back_to_the_Valley_desc:"退回山谷的主张，是想把璃月港那一摊子事，重新交还给原来管的人，谷里只守自己的水土。蓝砚起初不同意，说这是甩手。提出主张的人反问她：我们进了城，城里的人就肯听我们的了吗？她说不上来。散会那天，她一个人在城墙上站到天黑。后来她说：那就试试。试坏了，也是我们自己认。"
 CYG_PW_B_The_Village_League:"村社联合"
 CYG_PW_B_The_Village_League_desc:"村社联合是把谷中十几个村社，连同迁进来的流民聚落，一并写进同一份盟约。谁家遭灾，别家出人出力；谁家开渠，上下游一起议。有位老人不肯按手印，说祖上从没入过什么盟。蓝砚没有逼他，只把盟约念给他听。念到遭灾相助那一条，老人问：去年我家缺粮，是不是你们凑的？"
 CYG_PW_B_Refuse_the_Machine:"拒绝大机器"
 CYG_PW_B_Refuse_the_Machine_desc:"拒绝大机器，蓝砚要拒的是那种非把人聚到一处、非把水引到一处不可的大家伙。谷中的水碓、水碾，她一向当作好东西。有个港里的匠人劝她引进新的矿井机械，一日能顶谷中一月。蓝砚带他去看被矿渣填平的旧溪，说：它一日顶我一月，也一日填我一溪。匠人没有回答。"
 CYG_PW_B_No_Banner_No_Lord:"不奉王令"
 CYG_PW_B_No_Banner_No_Lord_desc:"不奉王令，是把话说得更直白些：谷中不受任何一方的号令，只受自己立下的规矩。有人劝蓝砚留些余地，免得招祸。她说：余地我们早就留够了。从帝君驾崩到今天，我们让过多少回，你们心里有数。让到最后，谷里连一口泉都保不住。她把这话写进村约第一行，字比别处大。"
 CYG_PW_B_The_Selfsufficient_Valley:"自足之谷"
 CYG_PW_B_The_Selfsufficient_Valley_desc:"自足之谷，是让谷中尽量少依赖外头的粮、外头的器。谷里的人种粮、织布、斫木、打铁，够用就好，不求有余。有人嫌这样太穷。蓝砚说：有余，就要拿去换钱；换钱，就要有人来收；有人来收，就得看人脸色。看脸色看惯了，田就保不住了。说完，她把一株倒伏的稻苗扶正。"
 CYG_PW_B_The_Valley_Border:"谷界"
 CYG_PW_B_The_Valley_Border_desc:"谷界立起来时，没有砌墙。蓝砚让人先写了一份名单：哪些坡归谷中管，哪些道共同走，哪些水上下游共守。她让两边的老人一起走了一遍边界。走到一处争议多年的山坳，双方各执一词。蓝砚让人挖开一层土，露出底下石层，说：水是从这层石头上流下去的，就照水走。两边都点了头。"
 CYG_PW_B_Bread_and_Songs:"面包与歌"
 CYG_PW_B_Bread_and_Songs_desc:"面包与歌，是谷中最实在的两样东西。蓝砚说：肚子空的，听不进歌；只会唱歌的，也填不饱肚子。谷中因此有条不成文的规矩：逢集日，先支起大锅煮饭，谁都能来吃一碗；吃完，歌者才开唱。起初吃的人多，听的人少。过了两年，吃饭的人少了，围着歌者的人反倒多了起来。"
 CYG_PW_B_The_Free_Communes:"归田自治"
 CYG_PW_B_The_Free_Communes_desc:"归田自治立起来那天，谷中十几个村社，各自把那面绣着叶子的旗收了下来。蓝砚说：旗不用挂了，地却在。她把最后一件事交接完，就回谷里去了。有人问，今后谷里的事找谁。她答：找你们自己议。若哪家遭了难，先看看邻家锅里有没有粮。她走时，谷口那棵老树刚抽了新芽。"
 CYG_PW_The_Singer_of_the_Valley:"谷中歌者"
 CYG_PW_The_Singer_of_the_Valley_desc:"谷中歌者把谷里的故事编成曲，每逢集日就在谷口唱。他唱的从不是英雄，只是些没有名字的人：守了四十年泉的老人，雪天里分饼的孩子。蓝砚常去听，听完就走，从不说话。有人问她为何不赞一句。她说：他在唱我们。我若开口，就成了替自己鼓掌。那歌者后来也进了城。"
 CYG_PW_The_Old_Mine_People:"旧矿之人"
 CYG_PW_The_Old_Mine_People_desc:"旧矿之人是谷里最不愿被提起的一群：他们曾亲手挖空过这片山。如今石尘进了肺，他们咳血、佝偻，却仍每天上山，把当年挖出的大坑一锹一锹填回去。一个老人对蓝砚说：我不指望谁原谅我，我只想在死前把这块地还成原来的样子。蓝砚没有说原谅，只说：那就一起填。"
 CYG_PW_Liyue_New_Soil:"璃月新土"
 CYG_PW_Liyue_New_Soil_desc:"璃月新土是两条路走到一处之后，蓝砚才说出口的四个字。那天她让人把两条路上攒下的文书一并搬进仓里。翻着翻着，她停在一张很旧的纸前，那是谷中最早贴出去的一张告示，边角已被虫蛀。她把它挑出来放在最上面，说：留着这张。以后的账，都得跟它比。"
 CYG_PW_The_Soil_Remembers:"土记得"
 CYG_PW_The_Soil_Remembers_desc:"土记得，是谷中一句老话。蓝砚晚年常去那片最早的梯田边坐，一坐就是半个下午，也不做什么。有人问她看什么。她说：看土。你把它翻松过，它就记得；你把它伤过，它也记得。人走了，它还在替你记着。说完，她把手插进田埂的土里，抓起一把，又慢慢松开。"
 CYG_PW_A_Hundred_Years_of_Green:"百年之绿"
 CYG_PW_A_Hundred_Years_of_Green_desc:"百年之绿，是蓝砚对后人的交代。她说：我们这一辈人，未必看得见那片林子长大。可只要种下去，百年之后，总会有人站在树底下乘凉。有人问，那会儿谁还记得是谁种的。她答：不用记得，树记得就行。她把最后一批树苗交给谷中的孩子，一人一株，谁也不许帮忙。"

 CYG_postwar_category:"沉玉新生"
 CYG_postwar_category_desc:"蓝砚战后的经营决议组。硝烟散去，港商一系忙着重开码头、平抑物价与招徕客商，让榷场与市集重新热闹起来。生意回到正轨，日子才算恢复正常，璃月港也才重新有了往日的气象。市面一热，各家各户的心也就定了。各家各户也重新有了奔头。"
 CYG_decision_pw_clear_spring:"淘泉护源"
 CYG_decision_pw_clear_spring_desc:"淘泉是体力活，也是良心活：把淤塞的泉眼一寸寸掏开，把烂掉的旧渠重砌。做这活的人，手上全是伤口。蓝砚说：水是活的，你对它好，它才肯回来。这个理，比任何律条都灵。"
 CYG_decision_pw_sow_green:"撒青"
 CYG_decision_pw_sow_green_desc:"撒青最亏本：种子撒下去，头三年见不到收成，还可能被旱死、被虫吃光。谷里人都懂，不种，这片地就永远是黄的。蓝砚说：我们这一辈，可能吃不上自己种的粮；但只要种下去，孩子就吃得上。"
 CYG_decision_pw_ban_the_axe:"禁斧巡山"
 CYG_decision_pw_ban_the_axe_desc:"巡山的人认得出每一棵老树，也认得出每一个不该砍树的人。抓到了不罚钱，只罚种：砍一棵，种十棵，秋后回来点数。蓝砚说：罚钱他不心疼，罚他亲手把树种回去，他才会记得。"
 CYG_decision_pw_communal_meal:"共炊"
 CYG_decision_pw_communal_meal_desc:"共炊的一大锅饭，柴是各家凑的，米是各家出的，煮好了所有人排队去盛，不论出力多少，都有一碗。有人说这不公平。蓝砚答：能让明天还站着的人都吃到饭，这就是我们能想到的最公平。"
 CYG_decision_pw_herb_lesson:"传草方"
 CYG_decision_pw_herb_lesson_desc:"把祖传的草方教给外人，在谷中老人听来是败家。蓝砚却坚持要教：方子藏在你手里，救一个人；教出去，救一片人。你这一辈子的本事，难道就只值一个人的命？"
 CYG_decision_pw_shelter_the_weak:"纳弱"
 CYG_decision_pw_shelter_the_weak_desc:"谷里有一条不成文的规矩：先递一碗热茶，再谈别的。这条规矩养活的，不止是流民，还有沉玉谷自己。因为每一个被救过一次的人，后来大多都成了最不肯离开这片谷的人。"
 CYG_decision_pw_patrol_paths:"巡径"
 CYG_decision_pw_patrol_paths_desc:"巡径的人不是兵，只是些本来就要走这条路的牧童、采药人。他们不拿饷，也不列名册，只在路过时多看两眼。蓝砚说：这条路我们比谁都熟，熟到它哪天掉了一块石头，我们都会知道。"
 CYG_decision_pw_dig_well:"凿井"
 CYG_decision_pw_dig_well_desc:"凿井靠的是运气和耐心。有时凿到最后还是干的，就得换个地方从头再来。蓝砚说：我们这一生，可能凿十口井，九口是干的。可只要有一口出了水，这谷里所有人，就都活得下去了。"
 CYG_decision_pw_envoy_keqing:"遣使玉衡"
 CYG_decision_pw_envoy_keqing_desc:"玉衡的回信来得快，通篇谈的是土地如何分配。蓝砚读了三遍，忽然觉得有点想笑：原来真有人，肯认认真真，把沉玉谷那点水土的账，当成一件正事来谈。"
 CYG_decision_pw_envoy_ningguang:"遣使群玉阁"
 CYG_decision_pw_envoy_ningguang_desc:"群玉阁的回复最像一桩买卖：问的全是沉玉谷一年能产多少粮、值多少钱。蓝砚让人回了一句：我们量的是土，不是钱。使者带回这话时，凝光沉默了很久，末了只淡淡说了一句：有意思。"
 CYG_decision_pw_gift_seed:"赠种四方"
 CYG_decision_pw_gift_seed_desc:"赠种四方，是把谷中筛出来的好种，分送沿江几处遭过矿害的村庄。有人说这是拿自家的命去接济外人。蓝砚说：种有的是。地若都死了，留着种有什么用。"
 CYG_decision_pw_green_pact_rite:"立村约"
 CYG_decision_pw_green_pact_rite_desc:"立村约是谷中最后一件大事。各村社推人，把历年来立过的规矩一条条念出来，能留的留，该改的改，念了整整两天。蓝砚说：这是一句话，这座谷，从今往后自己认自己。"

 LYY_Event.13001.t:"水土之晨"
 LYY_Event.13001.d:"谷连天下之后的第一个早晨，蓝砚没有进城受贺。她带着一把谷中的土，蹲在废弃的码头边，把土倒进海水里，看它散开。\n随行的人都沉默。她说：先别急着说我们赢了。这城里的地，比我们想的更硬、更咸，要种活它，得先知道它坏在哪里。说完，她把空袋子折好，收进怀里。"
 LYY_Event.13001.a:"把这城从头再种一遍"
 LYY_Event.13001.b:"先稳住港口，再议田土"
 LYY_Event.13002.t:"淘淤疏渠"
 LYY_Event.13002.d:"淘淤的活计最脏，也最急。谷中的渠被多年的矿渣与乱石填死，蓝砚带头下到渠里，一寸一寸把淤掏出来。\n有人嫌臭，捂着鼻子站在岸上。她抬头看了那人一眼，说：你嫌臭，是因为你还在岸上。等你哪天渴了，就别站在岸上。那人默不作声，跳了下来。"
 LYY_Event.13002.a:"下渠淘淤，先通水路"
 LYY_Event.13002.b:"先修官道，水路稍缓"
 LYY_Event.13003.t:"复梯田"
 LYY_Event.13003.d:"复梯田要先垒田埂。谷中的老人记得每一道田埂的走向，年轻人有力气。蓝砚让他们一对一带，一个说，一个垒。\n有个年轻人垒歪了，老人骂他。蓝砚拦住老人，说：他没听清你说的是哪一垄。让他们换过来，一个垒，一个说。第二遍，田埂就直了。"
 LYY_Event.13003.a:"依老农口述垒埂"
 LYY_Event.13003.b:"照图纸另画新田"
 LYY_Event.13004.t:"封山育林"
 LYY_Event.13004.d:"封山令立下那天，蓝砚把谷中所有还提着斧子的人，带到一片光秃的坡上。坡上只剩树桩，风一过，砂子打在脸上生疼。\n她说：你们站一站，看这里的风，是怎么进骨头的。砍树的账，不用你们还钱，把树桩边上这些苗养活，就算还清了。众人站着没动，风把他们的衣角吹得直响。"
 LYY_Event.13004.a:"封山十年，斧头入库"
 LYY_Event.13004.b:"缓行三年，留些柴火"
 LYY_Event.13005.t:"青源"
 LYY_Event.13005.d:"青源是蓝砚给上游那道分水岭起的名字。她要立一条规矩：凡在岭上挖动的，先得让下游三个村社点头。\n港里来的官不愿意，说这规矩不合章程。蓝砚答：章程是人写的，水是自己流的。你们若执意要挖，就先让下游的人来跟你们说。那官思索半晌，改口说要回去商议。"
 LYY_Event.13005.a:"设青源之约，下游共议"
 LYY_Event.13005.b:"岭上归港府，谷中不干预"
 LYY_Event.13006.t:"共仓"
 LYY_Event.13006.d:"共仓开仓那天，蓝砚让每户自己报数，交多交少都不问。仓前摆着一张长桌，桌上摊着记数的册子和一支笔。\n有个寡妇只交了半斗米，低着头不敢看人。蓝砚把册子推过去，说：你自己写。她不会写字，蓝砚就握着她的手，一笔一笔写下来。写完，寡妇蹲在桌边，捂住了脸。"
 LYY_Event.13006.a:"各自报数，交多交少不论"
 LYY_Event.13006.b:"按户摊派，一概平均"
 LYY_Event.13007.t:"田册"
 LYY_Event.13007.d:"田册从头到尾只记两样：谁种，种什么。谷中有人劝蓝砚把田亩登记得细些，好收税。她摇头：这册子是拿来认人的。\n一个老农翻着自己的那一行，看了很久，说他一辈子没在册上占过这么清楚的一行字。蓝砚答：占清楚了就好。以后谁动你的田，你拿着这册子去说。"
 LYY_Event.13007.a:"只登耕者与所种"
 LYY_Event.13007.b:"兼登田亩与家产"
 LYY_Event.13008.t:"草木学堂"
 LYY_Event.13008.d:"学堂设在老树底下，没有书，第一课教的是认草。蓝砚让每个孩子从坡上拔三株不同的草回来，摆成一排，一株一株讲。\n一个孩子拔错了，把药草当成野草。蓝砚没有责他，只说：今天你认错一株，明天可能就救错一个人。孩子红着脸把那株草重新埋回土里，埋得很深。"
 LYY_Event.13008.a:"先教认草辨土"
 LYY_Event.13008.b:"先教识字读经"
 LYY_Event.13009.t:"草医讲堂"
 LYY_Event.13009.d:"草医讲堂的第一批学生，有几个原本是矿上的伤工。蓝砚把几位老药婆请到堂上，让她们说方子，学生一句句记。\n一位婆婆说到一半忘了，急得直拍腿。有个学生说：婆婆你别急，你手上那道疤，是不是当年治什么留下的？婆婆愣住，忽然全想起来了。蓝砚在门外听着，没有进去。"
 LYY_Event.13009.a:"录成歌诀，传于后辈"
 LYY_Event.13009.b:"方子秘藏，不教外人"
 LYY_Event.13010.t:"净炉"
 LYY_Event.13010.d:"净炉是谷中的炉子先做出来的样子：炉膛加高，烟道绕两道弯，灰沉在底，烟就淡了。谷中的匠人做出来，给港里的炉主看。\n炉主笑他们费事。蓝砚只说：你们多烧的那点煤，够我们一村人过冬。你们嫌费事，是因为烟没落在你们自己院里。她说这话时，正站在炉主家的院子里，院里那口井，水面浮着一层黑。"
 LYY_Event.13010.a:"以谷中炉式推及全境"
 LYY_Event.13010.b:"各炉自便，不加干涉"
 LYY_Event.13011.t:"缓路"
 LYY_Event.13011.d:"缓路修得慢一些，弯一些，绕开几处老林与泉眼。有人嫌慢，说路修成这样耽误生意。\n蓝砚带那人走了三天新路，路上见了三处野鹿饮水的洼地。她说：你省下两天，是把这些洼地填了。你多走两天，是给它们留着。你算算，哪头划算。那人一路没再说话。"
 LYY_Event.13011.a:"路绕泉林，宁可多走两日"
 LYY_Event.13011.b:"直取捷径，先求通达"
 LYY_Event.13012.t:"谷种之库"
 LYY_Event.13012.d:"谷种之库是把各家最后一斗种收拢起来，按品种分装，登记在册。有个老人抱着种子迟迟不肯交，那是他家祖上传下的。\n蓝砚没有催他，只把自己的半袋口粮放到他脚边，说：换。你的种先存进库，开春还你，粮不用还。老人看了看那袋粮，又看了看怀里那斗种，最后把种递了过去，手一直在抖。"
 LYY_Event.13012.a:"集中留种，开春归还各家"
 LYY_Event.13012.b:"各家自留，库中不聚"
 LYY_Event.13013.t:"水碓"
 LYY_Event.13013.d:"水碓是谷中第一件不必烧煤的机器。蓝砚让人在山溪上架了十几架，借水流舂米、捣药、纺线。\n有人提议把碓搬到港边，好做大。蓝砚问：搬过去，水从哪来？那人说可以烧煤抽水。蓝砚笑了：那就不叫水碓了，那叫又一座炉子。她让人把溪边的碓再添两架，就在原地。"
 LYY_Event.13013.a:"就地添碓，借水不烧煤"
 LYY_Event.13013.b:"迁往港边，规模经营"
 LYY_Event.13014.t:"遣使四方"
 LYY_Event.13014.d:"内战刚停，蓝砚派使节出门，带的是谷中一袋新收的种子，和一封写得很短的信。信上只有一句话：水土的账，不认地界。\n有人劝她多带些厚礼。她说：带厚礼，是求人；带种子，是问一句愿不愿意一起种。愿不愿意，是问不出来的，得看他们回什么。半个月后，回信陆续到了，长短不一。"
 LYY_Event.13014.a:"携种出使，以水土为言"
 LYY_Event.13014.b:"备厚礼，先结善缘"
 LYY_Event.13015.t:"与玉衡"
 LYY_Event.13015.d:"玉衡的回信来得快，通篇谈的是佃户如何自耕、田亩如何分。蓝砚读了三遍，把信收进装谷种的木箱里。\n使者不解，问为何不放在公案上。蓝砚说：这信里说的，是我认得的字。人家肯坐下来跟我算田垄，我就要把它放在离田最近的地方。她说完，又想了想，让人回赠了一斗新谷。"
 LYY_Event.13015.a:"与玉衡共商田制"
 LYY_Event.13015.b:"各守其土，互不相问"
 LYY_Event.13016.t:"与群玉阁"
 LYY_Event.13016.d:"群玉阁的问法最像买卖：沉玉谷一年能出多少粮，值多少银。蓝砚让人回了一句：我们量的是土，不是钱。\n使者带回这话，凝光沉默了很久，末了只说了一句有意思。后来群玉阁的一份密札里，多了一行批注：沉玉谷之患，不在其兵，在其不可定价。蓝砚听说后，只笑了笑，没有回应。"
 LYY_Event.13016.a:"以土相答，不谈价钱"
 LYY_Event.13016.b:"折价售粮，以图周转"
 LYY_Event.13017.t:"与月海亭"
 LYY_Event.13017.d:"月海亭是唯一认真读了那份水土账的地方。甘雨甚至附来一份自己整理的粮政纪要。\n蓝砚把纪要翻来覆去地看，末了说：看来这世上，还是有人肯蹲下来，看一株草的。她当即让人回赠一袋谷种，附言只有一句：你若来，谷里留一碗热茶。信送出后，她在仓门口站了很久。"
 LYY_Event.13017.a:"与月海亭共修粮政"
 LYY_Event.13017.b:"不来不往，各安其位"
 LYY_Event.13018.t:"与绝云间"
 LYY_Event.13018.d:"绝云间的回复最冷：山有山的规矩，谷有谷的活法，互不相干。蓝砚看完，反倒笑了。\n她说：这样最好。我最怕那种嘴上说要帮我们的人。帮来帮去，谷就成了他的。她把那片薄绢随手夹进一本旧账里，转身去忙农事，仿佛那只是谷外一件无关紧要的闲事。"
 LYY_Event.13018.a:"各守其界，互不相扰"
 LYY_Event.13018.b:"再遣使者，力求通好"
 LYY_Event.13019.t:"与云来海"
 LYY_Event.13019.d:"云来海的使者一开口，谈的就是港口、航路、租约。蓝砚没等他说完，就把人请了出去。\n事后她说：他们要岭，要港，要一切能变成钱的东西。我只怕一样，他们哪天会想要这谷里的水。到那天，我连一捧土都不会给他。使者回到船上，把这话原样转述。达达利亚听完，破天荒地沉默了很久，才笑着说了句：有意思的人。"
 LYY_Event.13019.a:"拒其租约，水不外借"
 LYY_Event.13019.b:"许其通商，暂稳边衅"
 LYY_Event.13020.t:"青之共约"
 LYY_Event.13020.d:"青之共约谈成那天，须弥的雨林学者、枫丹的水利官、蒙德的自然主义者，各自带了自家的卷子来。蓝砚没有摆席，只把四张桌子拼成一张。\n她让人把谷中的水土账摊在正中，说：我们的账最丑，先摊我们的。谁也别客气，看见不对的就指出来。那一天，四张桌子上纸摞得老高，散场时，谁也没先走。"
 LYY_Event.13020.a:"立青之共约，四方同守"
 LYY_Event.13020.b:"各家自顾，不与他邦结约"
 LYY_Event.13021.t:"空神位"
 LYY_Event.13021.d:"帝君的神位空了，蓝砚进港时在那座殿前站了一会儿。殿里没有香火，只有几个孩子趴在门槛上玩石子。\n随行的人问要不要上炷香。蓝砚摇头：香是烧给活人看的。她又说：我们不求神来认，只求这殿里的风，别把外头那些新栽的苗吹折了。说完，她绕过神位，去看殿后那块荒地。"
 LYY_Event.13021.a:"不拜神位，先看荒地"
 LYY_Event.13021.b:"谨守旧礼，暂安人心"
 LYY_Event.13022.t:"天地之序"
 LYY_Event.13022.d:"蓝砚让人把谷中历年记下的物候抄成一册：哪一天溪水涨，哪一天山花落，哪一天雪到谷口。抄完她写了一行小字。\n那行字是：天地自有其序，不需神来认证。有人劝她别写，怕招祸。她说：我写的是溪水涨落的日期，又不是骂谁。真要有人来问，我就把这一册拿给他看。"
 LYY_Event.13022.a:"记物候成册，自证其序"
 LYY_Event.13022.b:"废册不记，静观其变"
 LYY_Event.13023.t:"不须神证"
 LYY_Event.13023.d:"有人问蓝砚，不敬神明，这天下怎么站得住。她带那人去看山坡上自生的草。草没人种，也没人拜，年年自己长。\n她说：它们不长给谁看，只长给自己。人也一样。你要有人来给你认证，才敢活下去，那你这辈子，都在给别人的眼睛活着。那人站在坡上，看了很久。"
 LYY_Event.13023.a:"自在自证，不求神许"
 LYY_Event.13023.b:"稍循旧礼，聊以自安"
 LYY_Event.13024.t:"大地之伤"
 LYY_Event.13024.d:"层岩的裂口蓝砚去看过一回。她蹲在边上，没说话，拿手量了量裂口的宽度，又量了量深度，记进随身的本子里。\n随行的匠人问她在算什么。她说：算这片土受了多重的伤。匠人说这伤治不好。她答：治不好也得治，不能只拿水泥糊一层，糊完它还在底下烂。回去之后，她把谷中的草医也调了来。"
 LYY_Event.13024.a:"量伤问土，图个长久的治法"
 LYY_Event.13024.b:"循旧法，勉力封堵"
 LYY_Event.13025.t:"治而非堵"
 LYY_Event.13025.d:"谷中老辈人懂这个理：伤口要露着，结痂才结实；捂着不散，反倒烂在里头。蓝砚把这话原封不动讲给了那些只懂封堵的匠人听。\n她说：裂口是大地受的伤。你年年堵，它年年裂。你得让它自己长一层新土出来，那才是治。匠人面面相觑，一个老匠人先点了头。"
 LYY_Event.13025.a:"开缝泄气，培土固根"
 LYY_Event.13025.b:"一概封死，求一时平安"
 LYY_Event.13026.t:"渊泉"
 LYY_Event.13026.d:"渊泉是治裂之后，谷中人在裂口边上养出来的第一眼活水。水清，浅，不多，却常年不干。\n有人要围着它筑墙，怕被人看见。蓝砚拦住：筑了墙，水就死了。让它敞着，谁来打水都行。她在泉边立了一块木牌，上面只写着：此处可打水，不可洗染。后来那木牌换了三次，字始终是这几个。"
 LYY_Event.13026.a:"敞泉与众，禁其污洗"
 LYY_Event.13026.b:"筑墙护泉，独守其源"
 LYY_Event.13027.t:"无印之天"
 LYY_Event.13027.d:"蓝砚派人往天空岛的方向走了一趟，送去一封问话。信上只有两句：若天理仍在，请现身谈一谈；若不在，请容许我们自己走路。\n使节两手空空地回来，说一路无人应答。蓝砚在回执上批了两个字：已知。她把那卷空白的回函收进档案，位置就在水土账的旁边，两样东西挨着搁在一起。"
 LYY_Event.13027.a:"空函入档，各行其是"
 LYY_Event.13027.b:"再遣使者，穷究其踪"
 LYY_Event.13028.t:"护田队"
 LYY_Event.13028.d:"护田队成军那天，谷中的第一批人握的是农具、猎弓和削尖的竹竿，没有铠甲，也没有军饷。\n蓝砚为每人递上一支竹矛。递到最后一个人时，她停下来，说：这不是让你们去杀人。这是让你们站在自家田边，让想动手的人先掂量掂量，这片土是有人在守的。那人握着竹矛，站得笔直。"
 LYY_Event.13028.a:"授以竹矛，守土护田"
 LYY_Event.13028.b:"拨发军械，编入劲旅"
 LYY_Event.13029.t:"蔓哨"
 LYY_Event.13029.d:"蔓哨没有名册，也不列营。牧童、采药人、砍柴的妇人，本就是天天要走山路的人，只比旁人多了句嘱咐：多看一眼。\n一个采药的孩子在隘口见了一队生人，跑回来报信，谷中得以从容。事后众人夸他机灵，他却说：是我天天走那条路，多出几个脚印，我都认得。"
 LYY_Event.13029.a:"不设营哨，行人即哨"
 LYY_Event.13029.b:"另编哨队，专职瞭望"
 LYY_Event.13030.t:"防污巡队"
 LYY_Event.13030.d:"防污巡队守的是一条水线。上游哪处矿口在夜里偷排，哪条渠的颜色不对，他们都记下来。\n有一回，巡队在半夜截住了几辆往下游倒渣的车。车上的人出了高价。带队的年轻人只是摇头，说：你们给的钱，买不了我娘喝的那口井。第二天，那几辆车的号牌，被抄在了谷口的布告上。"
 LYY_Event.13030.a:"沿水设巡，见污即报"
 LYY_Event.13030.b:"任其自便，不来不往"
 LYY_Event.13031.t:"不设常备"
 LYY_Event.13031.d:"蓝砚不主张养一支常备的兵。她的理由是：常备的兵，久了就只认发饷的人，不认田。谷里要真有能打仗的，还得是种田的人。\n她让各村的护田队轮流受训，农忙时解散，农闲时操练。有人担心这样打不了硬仗。她说：未必。真到要紧时候，一支知道自己身后是哪块田的队伍，比什么都顶用。"
 LYY_Event.13031.a:"不养常备，寓兵于农"
 LYY_Event.13031.b:"设常备营，专事征战"
 LYY_Event.13032.t:"竹矛与布告"
 LYY_Event.13032.d:"蓝砚订了一条规矩：谷口立布告，竹矛只对外，不对内。凡谷中人有争执，一律到村社大会上说，谁也不许动家伙。\n有两个人因争水打了架，被各罚替对方挑水一月。蓝砚把那两支竹矛挂在谷口的树上，挂了整整一季。有人问挂它干什么。她说：挂着，让每个人路过都想一想，这东西是拿来对外的。"
 LYY_Event.13032.a:"竹矛只对外，纷争归公议"
 LYY_Event.13032.b:"严立军法，以刑束众"
 LYY_Event.13033.t:"谷中的大辩论"
 LYY_Event.13033.d:"统一之后，谷里的人分成了两拨：一拨说该把水土的规矩推到整个璃月，一拨说该守好山谷，别去管城里的闲事。蓝砚把两拨人请到同一棵老树下，让他们自己吵。\n吵了三天，嗓子都哑了，也没吵出结果。散场时，蓝砚只说了句：吵不完也好。真吵完了，才是没人敢开口了。她说完就走，留下两拨人对着那棵树发愣。"
 LYY_Event.13033.a:"两说并听，再定行止"
 LYY_Event.13033.b:"择一而从，速定大计"
 LYY_Event.13034.t:"水土之约"
 LYY_Event.13034.d:"水土之约推向全境的头一步，是把谷中的禁伐、护泉、公仓几条，原样抄成告示，贴到璃月各处。有人问这管不管用。\n蓝砚说：管不管用，先贴出去再说。贴出去，至少让每个还在砍树的人知道，有这么一件事，是有人不同意的。头一批告示贴出后，有个城里的老人专门来谷里问，能不能多要几张。"
 LYY_Event.13034.a:"以谷中之约推及全境"
 LYY_Event.13034.b:"步步为营，先守谷中"
 LYY_Event.13035.t:"入港之路"
 LYY_Event.13035.d:"入港的路上，蓝砚一直没说话。走到半途，她忽然停下，蹲下来看路边的一处水沟。沟里的水是黑的，浮着一层油光。\n她用指头蘸了一点，捻开，闻了闻，然后把那点污水抹在自己的袖口上。随行的人不解。她说：带着它进城。等他们跟我说繁荣的时候，我就给他看这个。说完，她站起身，继续往前走。"
 LYY_Event.13035.a:"带污水入城，以示其害"
 LYY_Event.13035.b:"掩其瑕疵，先结人心"
 LYY_Event.13036.t:"让璃月港慢下来"
 LYY_Event.13036.d:"让璃月港慢下来，蓝砚要的是它把步子放匀。她提出的第一件事很简单：开工前先问一句，这地方的土和水，能不能受得住。\n这条规矩一上来就得罪了不少人。有个大商号当面讥她。蓝砚没有回嘴，只请他去看港边那片被填平的老滩。那人站在滩上，看见底下埋着的旧船板，半晌没说出话来。"
 LYY_Event.13036.a:"行缓工之制，先问水土"
 LYY_Event.13036.b:"照旧兴工，不废其时"
 LYY_Event.13037.t:"雨林与水利"
 LYY_Event.13037.d:"须弥的学者带来了成箱的雨林图志，枫丹的水利官带来了整套测水法门。蓝砚把两拨人请到一起，摆出谷中那份最丑的水土账。\n她说：我们的账最丑，先摊我们的。学者指着图志上的几处说，这里和你们谷中的坡向是一路的。水利官接着算了一夜。天亮时，三个人把那几张纸拼在一处，谁也没提谁帮了谁。"
 LYY_Event.13037.a:"三家合参，共修水土之书"
 LYY_Event.13037.b:"各自为政，不与他邦合参"
 LYY_Event.13038.t:"共治之田"
 LYY_Event.13038.d:"共治之田是把谷中的公田之法，试着挪到城郊的几处荒地上。荒地归村社共有，按户分种，收成按劳分。\n第一年就出了争执：有一户多占了半垄，被人当面揭发。蓝砚没有偏袒，只让村社大会当众议定，多占者退还，并替被占之家耕作一季。她说：公田是让有私心的人，也得遮掩不住。"
 LYY_Event.13038.a:"荒地归社，按劳分种"
 LYY_Event.13038.b:"荒地归官，招佃承种"
 LYY_Event.13039.t:"山心入庙堂"
 LYY_Event.13039.d:"山心入庙堂，是让谷中的村社推几个人，进璃月的议事厅坐着。他们不会说漂亮话，多数时候只是听着。\n有一回，众人正争一笔开销，一个谷中来的老农开口说：这笔钱，够我们那一带打二十口井。满堂静了一静。后来那笔开销被砍去了一半，挪去凿井。散会后，老农在门口站了很久，说他这辈子没进过这样的屋子。"
 LYY_Event.13039.a:"村社推人，入厅共议"
 LYY_Event.13039.b:"谷中自治，不入庙堂"
 LYY_Event.13040.t:"慢的代价"
 LYY_Event.13040.d:"慢是有代价的。头一年，璃月的新港比邻邦晚了两个月开埠，边上几条商路也被别家抢了先。\n有人在议事厅里当面责难。蓝砚没有辩解，只把两本账并排放着：一本是省下的工期，一本是保住的水源与林子。她说：你们看哪本厚。众人传看了一阵，没有人再开口。会后，她一个人把两本账都收进了柜子。"
 LYY_Event.13040.a:"认下慢的代价，守住水土"
 LYY_Event.13040.b:"弃缓行之制，争其先机"
 LYY_Event.13041.t:"山河共治"
 LYY_Event.13041.d:"山河共治写成的那天，蓝砚把水土之约和璃月原本的几部旧律，摊在同一张长桌上，逐条比对。哪一条合得上，就留着；哪一条相冲，就当面说清楚。\n她说到最后一条时停了停，说：这一条是这片地自己定的。谁要改，先来问我这片地上种田的人。她说完，把两卷文书并在一起，用一根麻绳捆好。"
 LYY_Event.13041.a:"山河共治，水土为纲"
 LYY_Event.13041.b:"各守旧律，不相统属"
 LYY_Event.13042.t:"退回山谷"
 LYY_Event.13042.d:"退回山谷的主张，是想把璃月港那一摊子事，重新交还给原来管的人，谷里只守自己的水土。\n蓝砚起初不同意，说这是甩手。提出这主张的人反问她：我们进了城，城里的人就肯听我们的了吗？她说不上来。散会那天，她一个人在城墙上站到天黑。后来她说：那就试试。试坏了，也是我们自己认。"
 LYY_Event.13042.a:"退守山谷，自管水土"
 LYY_Event.13042.b:"留在港中，力争其权"
 LYY_Event.13043.t:"谷口的争执"
 LYY_Event.13043.d:"谷口那场争执，是因为一队外地的行商要过境，有人主张收钱，有人主张放行。两边在谷口的木牌前吵了起来。\n蓝砚赶到时，双方已经推搡起来。她没说话，先把两拨人分开，然后让人把木牌上的规矩念了一遍。念到罢税去枷那条，双方都安静下来。她这才开口：牌子在这儿立了多少年，今天就还按它办。"
 LYY_Event.13043.a:"照旧例行事，不因人改规"
 LYY_Event.13043.b:"从权收税，以备谷用"
 LYY_Event.13044.t:"村社联合"
 LYY_Event.13044.d:"村社联合是把谷中十几个村社，连同迁进来的流民聚落，一并写进同一份盟约。谁家遭灾，别家出人出力；谁家开渠，上下游一起议。\n有位老人不肯按手印，说祖上从没入过什么盟。蓝砚没有逼他，只把盟约念给他听。念到遭灾相助那一条，老人忽然问：去年我家缺粮，是不是你们凑的？蓝砚答是。老人沉默半晌，把手按了上去。"
 LYY_Event.13044.a:"立村社联合，守望相助"
 LYY_Event.13044.b:"各村自守，不结盟约"
 LYY_Event.13045.t:"拒绝大机器"
 LYY_Event.13045.d:"拒绝大机器，蓝砚要拒的是那种非把人聚到一处、非把水引到一处不可的大家伙。谷中的水碓、水碾，她一向当作好东西。\n有个港里的匠人劝她引进新的矿井机械，一日能顶谷中一月。蓝砚带他去看被矿渣填平的旧溪，说：它一日顶我一月，也一日填我一溪。你算算，是你的快值钱，还是我的溪值钱。匠人没有回答。"
 LYY_Event.13045.a:"用水碓水碾，不用大矿机"
 LYY_Event.13045.b:"引进机器，以图迅捷"
 LYY_Event.13046.t:"自足之谷"
 LYY_Event.13046.d:"自足之谷，是让谷中尽量少依赖外头的粮、外头的器。谷里的人种粮、织布、斫木、打铁，够用就好，不求有余。\n有人嫌这样太穷。蓝砚说：有余，就要拿去换钱；换钱，就要有人来收；有人来收，就得看人脸色。看脸色看惯了，田就保不住了。她说完，蹲下来把一株倒伏的稻苗扶正，扶得很慢。"
 LYY_Event.13046.a:"量入为出，求其自足"
 LYY_Event.13046.b:"广开商路，博其利源"
 LYY_Event.13047.t:"不奉王令"
 LYY_Event.13047.d:"不奉王令，是把话说得更直白些：谷中不受任何一方的号令，只受自己立下的规矩。有人劝蓝砚留些余地，免得招祸。\n她说：余地我们早就留够了。从帝君驾崩到今天，我们让过多少回，你们心里有数。让到最后，谷里连一口泉都保不住。她把这话写进村约的第一行，字比别处大些，也不好看。"
 LYY_Event.13047.a:"谷中自治，不受他令"
 LYY_Event.13047.b:"暂行敷衍，以避其锋"
 LYY_Event.13048.t:"谷界"
 LYY_Event.13048.d:"谷界立起来时，没有砌墙。蓝砚让人先写了一份名单：哪些坡归谷中管，哪些道共同走，哪些水上下游共守。她让两边的老人一起走了一遍边界。\n走到一处争议多年的山坳时，两边各执一词，谁也说不服谁。蓝砚让人在山坳里挖开一层土，露出底下的石层，说：水是从这层石头上流下去的，就照水走。两边看了很久，都点了头。"
 LYY_Event.13048.a:"依山水立界，共守其约"
 LYY_Event.13048.b:"立墙设卡，明定疆界"
 LYY_Event.13049.t:"归田自治"
 LYY_Event.13049.d:"归田自治立起来那天，谷中的十几个村社，各自把那面绣着叶子的旗收了下来。蓝砚说：旗不用挂了，地却在。\n她把最后一件事交接完，就回谷里去了。有人问她，今后谷里的事找谁。她答：找你们自己议。若哪家遭了难，先看看邻家锅里有没有粮。她走的时候，谷口那棵老树刚抽了新芽，谁也没去送行。"
 LYY_Event.13049.a:"归田自治，谷事谷议"
 LYY_Event.13049.b:"仍领璃月之事，兼管其政"
 LYY_Event.13050.t:"谷中歌者"
 LYY_Event.13050.d:"谷中歌者把谷里的故事编成曲，每逢集日就在谷口唱。他唱的从不是英雄，只是些没有名字的人：守了四十年泉的老人，雪天里分饼的孩子。\n蓝砚常去听，听完就走，从不说话。有人问她为何不赞一句。她说：他在唱我们。我若开口，就成了替自己鼓掌。那歌者后来也进了城，唱的还是这些，只是听的人里，多了几个不种田的。"
 LYY_Event.13050.a:"容其自唱，不加褒贬"
 LYY_Event.13050.b:"请其改唱功业，以励众心"
 LYY_Event.13051.t:"旧矿之人"
 LYY_Event.13051.d:"旧矿之人是谷里最不愿被提起的一群：他们曾亲手挖空过这片山。如今石尘进了肺，他们咳血、佝偻，却仍每天上山，把当年挖出的大坑一锹一锹填回去。\n一个老人对蓝砚说：我不指望谁原谅我。我只是想在死前，把这块地还成原来的样子。蓝砚没有说原谅，只说了一句：那就一起填。第二天，她真的去了，也拿了一把锹。"
 LYY_Event.13051.a:"不问旧罪，一起填坑"
 LYY_Event.13051.b:"追其旧责，以儆后来"
 LYY_Event.13052.t:"璃月新土"
 LYY_Event.13052.d:"璃月新土是两条路走到一处之后，蓝砚才说出口的四个字。那天她让人把两条路上攒下的文书，一并搬到仓里。\n她翻着翻着，忽然停在一张很旧的纸前。那是谷中最早贴出去的一张告示，边角已经被虫蛀了。她把它挑出来，放在最上面，说：留着这张。以后的账，都得跟它比。说完，她合上了木箱。"
 LYY_Event.13052.a:"两路归一，水土为记"
 LYY_Event.13052.b:"各记其功，分途而行"
 LYY_Event.13053.t:"土记得"
 LYY_Event.13053.d:"土记得，是谷中一句老话。蓝砚晚年常去那片最早的梯田边坐，一坐就是半个下午，也不做什么。\n有人问她看什么。她说：看土。你把它翻松过，它就记得；你把它伤过，它也记得。人走了，它还在替你记着。她说完，把手插进田埂的土里，抓起一把，又慢慢松开，土粒从指缝里漏下去。"
 LYY_Event.13053.a:"以土为记，功过自明"
 LYY_Event.13053.b:"勒石记功，昭示后世"
 LYY_Event.13054.t:"百年之绿"
 LYY_Event.13054.d:"百年之绿，是蓝砚对后人的交代。她说：我们这一辈人，未必看得见那片林子长大。可只要种下去，百年之后，总会有人站在树底下乘凉。\n有人问她，那会儿谁还记得是谁种的。她答：不用记得。树记得就行。她把最后一批树苗交给谷中的孩子，一人一株，让他们自己选地方，自己挖坑，自己埋，谁也不许帮忙。"
 LYY_Event.13054.a:"百年之计，交于后人"
 LYY_Event.13054.b:"急取近利，以固其位"
 LYY_Event.13055.t:"立村约"
 LYY_Event.13055.d:"立村约是谷中最后一件大事。各村社推人，把历年来立过的规矩一条条念出来，能留的留，该改的改。念了整整两天。\n念到最后一条，一个从流民里选出来的代表站起来，说他不是谷中生的，不知该不该按手印。蓝砚答：你在这谷里种过三年田，就按。那代表按下去时，手很稳。"
 LYY_Event.13055.a:"立约成册，人人按印"
 LYY_Event.13055.b:"择要存录，不必人人"
 LYY_Event.13056.t:"最后的青山"
 LYY_Event.13056.d:"最后的青山，是蓝砚给这条路起的名字。她站在一处刚恢复生机的山坡上，脚下那一层绿，来得极慢，也极稳。\n她说：我不求这天下都变成青山。我只求，当我们守不住所有地方的时候，至少还能守住这一座。只要它还在，就说明这件事还有希望。她说完，蹲身拔掉脚边一株杂草，那是旁人眼里的杂草，在她眼里，是这片坡活过来的凭据。"
 LYY_Event.13056.a:"留此一山，以证其事"
 LYY_Event.13056.b:"倾力拓之，遍及全境"

 CYG_Spirit_Soil_and_Heart:"水土山心"
 CYG_Spirit_Soil_and_Heart_desc:"治水的人先学会了看土，护山的人先学会了听水。水土与山心，本是同一件事的两面：一片地撑不撑得住人，看的是这两样，不看谁的旗子大。"
 CYG_Spirit_Watershed_Green:"青源之约"
 CYG_Spirit_Watershed_Green_desc:"分水岭上的一纸约定：凡在岭上动土的，先让下游的人点头。水往哪儿走由天定，谁在它上游动手，就得先问过在下游喝水的人。"
 CYG_Spirit_The_Slow_Road:"缓路"
 CYG_Spirit_The_Slow_Road_desc:"路修得慢些，弯些，绕开老林与泉眼。有人算的是省下的工期，谷里算的是留住的洼地。两本账并排放着，看哪本厚。"
 CYG_Spirit_Green_Convention:"青之共约"
 CYG_Spirit_Green_Convention_desc:"一张把水土写进条款的约书。须弥、枫丹、蒙德各有各的度量法，却在同一张桌上把纸拼成了一幅。它管不了天，管得住几条河。"
 CYG_Spirit_No_God_Need_Certify:"不须神证"
 CYG_Spirit_No_God_Need_Certify_desc:"草没人种，也没人拜，年年自己长。人不该为了给谁看才活。天地的次序写在溪水的涨落里，不必谁来盖一枚印。"
 CYG_Spirit_Heal_Not_Plug:"治而非堵"
 CYG_Spirit_Heal_Not_Plug_desc:"裂口是大地受的伤。年年糊一层，它就年年裂。得让它自己长出一层新土，那才叫治。包扎得越好，烂得越深。"
 CYG_Spirit_Terrace_Watch:"护田队"
 CYG_Spirit_Terrace_Watch_desc:"没有铠甲，没有军饷，手里握的是农具与竹矛。他们守的不是城池，只是自家田边那一道不愿被人踩过去的田埂。"
 CYG_Spirit_Shared_Fields:"共治之田"
 CYG_Spirit_Shared_Fields_desc:"荒地归村社共有，按户分种，收成按劳分。有私心不要紧，遮掩不住就行。田里的账，摊在村社大会的桌面上，谁都能看。"
 CYG_Spirit_Land_and_Soil:"山河共治"
 CYG_Spirit_Land_and_Soil_desc:"水土之约与旧律摊在同一张桌上，逐条比对。合得上的留着，相冲的当面说清。最后一条是这片地自己定的。"
 CYG_Spirit_Selfsufficient_Valley:"自足之谷"
 CYG_Spirit_Selfsufficient_Valley_desc:"够用就好，不求有余。有余就要换钱，换钱就要看人脸色，脸色看惯了，田就保不住。这是谷中算过许多年的一笔账。"
 CYG_Spirit_Free_Communes:"归田自治"
 CYG_Spirit_Free_Communes_desc:"旗收了下来，地还在。谷中十几个村社各自立约，遇大事才聚一处相商。散一点，总比断在一根绳上强。"
 CYG_Spirit_Soil_Remembers:"土记得"
 CYG_Spirit_Soil_Remembers_desc:"你把它翻松过，它就记得；你把它伤过，它也记得。人走了，土还替你记着。功过不必刻在碑上，刻在土里更久。"
 CYG_Spirit_Green_Pact:"青约"
 CYG_Spirit_Green_Pact_desc:"不树旗，不立国，只与愿意守这片水土的人结为一体。这座谷不是谁的，它只是恰好，是我们愿意用命去守的地方。"

 CYG_PW_Soil_Tier_1:"水土等级"
 CYG_PW_Soil_Tier_1_desc:"水土崩坏。泉眼枯竭，田垄沙化。谷中抓一把土，大半是握不住的沙，风一过就散了。"
 CYG_PW_Soil_Tier_2:"水土等级"
 CYG_PW_Soil_Tier_2_desc:"水土将复。泉眼回潮，坡上见草。这片地还虚着，可它已经在往好的方向，一寸一寸地挪。"
 CYG_PW_Soil_Tier_3:"水土等级"
 CYG_PW_Soil_Tier_3_desc:"水土渐养。梯田成片，草木成荫。谷里的孩子，头一回见着成片开花的山坡。"
 CYG_PW_Soil_Tier_4:"水土等级"
 CYG_PW_Soil_Tier_4_desc:"水土归元。旧伤初愈，地力渐厚。多少年的透支，终于在这一茬新苗里，被一点点还了回来。"
 CYG_PW_Soil_Tier_5:"水土等级"
 CYG_PW_Soil_Tier_5_desc:"水土大盛。风过草伏，满目青山。生机越厚，蓝砚反倒越警惕：福气来得越厚，越经不起有人动一次歪念。"
 CYG_PW_Spirit_Tier_1:"山心等级"
 CYG_PW_Spirit_Tier_1_desc:"山心涣散。人心浮动，各奔东西，谷中谁都不想多留一天，天一亮就想着出谷去。"
 CYG_PW_Spirit_Tier_2:"山心等级"
 CYG_PW_Spirit_Tier_2_desc:"山心初聚。有人愿留，有人肯干，谷中总算有了几户，打定主意把根重新扎下。"
 CYG_PW_Spirit_Tier_3:"山心等级"
 CYG_PW_Spirit_Tier_3_desc:"山心相连。村社相通，守望相助，谁家断了粮，都不必再一个人硬扛。"
 CYG_PW_Spirit_Tier_4:"山心等级"
 CYG_PW_Spirit_Tier_4_desc:"山心如铁。人人守土，寸步不让，谷中没有一个局外人，连孩子都记得自家的田在哪儿。"
 CYG_PW_Spirit_Tier_5:"山心等级"
 CYG_PW_Spirit_Tier_5_desc:"山心成岳。众志如山，不可撼动。这份凝聚守住了整座谷，也可能在某一刻，让谷中的人再也听不见谷外的哭声。"
 CYG_PWCombo_Both_High:"水土相济"
 CYG_PWCombo_Both_High_desc:"水养山，山护水。谷里那套慢功夫，总算让璃月港也跟着缓了下来。蓝砚却清楚，被人跟着学，比被人挡着更难收场。"
 CYG_PWCombo_Both_Low:"两不相济"
 CYG_PWCombo_Both_Low_desc:"水没治住，山也没守住。谷里唱的还是那几支歌，唱到最后，连唱歌的人都少了。"
 CYG_PWCombo_A_High:"闭谷自守"
 CYG_PWCombo_A_High_desc:"水土养回来了，山心也齐，只是谷口的门，再没往外开过。粮够吃，谷外的事，一概不知。"
 CYG_PWCombo_B_High:"心向四方"
 CYG_PWCombo_B_High_desc:"山心齐，门也开着，只是谷中的水，还没养回来。名声走得比苗快，早晚要回头补一趟土。"

