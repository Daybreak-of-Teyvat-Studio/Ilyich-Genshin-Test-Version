 Teyvat.2.d:0 "Согласно легендам, после войны богов цивилизация возродилась под защитой богов, и боги основали Небесный Остров. Там обитает божество — Небесный Принцип, верховный правитель Тейвата. 500 лет назад он остановил близнецов, запечатал их и привёл армии семи архонтов, чтобы уничтожить королевство Кхенри'ах. Теперь он вновь трубит в военный рог. Вы можете стать врагом или союзником Небесного Принципа. Выбирайте!"
