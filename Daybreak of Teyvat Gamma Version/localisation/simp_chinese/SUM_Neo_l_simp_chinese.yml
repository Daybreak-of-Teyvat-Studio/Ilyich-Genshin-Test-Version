 SUM_Neo_SGS_T5_View_desc:"稳定度 +15%、月度人口 +40000、政治点数获取 +10%"
 SUM_Neo_SGS_U1_View:"重门深扃"
 SUM_Neo_SGS_U1_View_desc:"研究速度 -15%、工厂产出 -5%"
