ANR_support_Diona_desc:0"§RВлияние Дионы увеличится на 1§W"
ANR_oppose_Bennett:0"Выступить против Беннета"
ANR_oppose_Bennett_desc:0"§RВлияние Беннета уменьшится на 1§W"
ANR_oppose_Fischl:0"Выступить против Фишль"
ANR_oppose_Fischl_desc:0"§RВлияние Фишль уменьшится на 1§W"
ANR_oppose_Diona:0"Выступить против Дионы"
ANR_oppose_Diona_desc:0"§RВлияние Дионы уменьшится на 1§W"
ANR_unite:0"Объединение Мондштадта"
ANR_unite_desc:0"§GЕсли в Мондштадте всё ещё есть силы, не являющиеся вашими вассалами, или если нет единого цвета и названия, или если вы хотите видеть единый Мондштадт, используйте это решение.§W"
ANR_uniformize_subject:0"Перераспределение власти"
ANR_uniformize_subject_desc:0"Мы освободим все силы Мондштадта, кроме Ордена Рыцарей и Спрингвейла, как марионеточные государства, унифицируем их цвета и названия для быстрого развития."
ANR_reunite:0"Централизация Мондштадта"
ANR_reunite_desc:0"Мы объединим всех вассалов Мондштадта и получим ядро всего Мондштадта."
ANR_support_Bennett_1:0 "Беннет: Организация производства беженцев"
ANR_support_Bennett_2:0 "Беннет: Помощь в строительстве производственных мощностей"
ANR_support_Bennett_3:0 "Беннет: Раздача продовольственных пайков населению"
