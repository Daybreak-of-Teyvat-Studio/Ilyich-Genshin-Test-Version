 #海军会议
 ABY_News.5.t:"云来海军事演习"
 ABY_News.5.d:"近日，由提瓦特尘世七国率领的精锐舰队在云来海进行了一次规模庞大的军事演习，演习旨在加强整个提瓦特的安全，增进各国军队间的交流。据悉，此次演习涉及海空军队共计数万人，包括各国最先进的武器装备和军事技术。演习的内容包括了海上航行、空中支援、岛屿登陆、打击丘丘人据点等多个方面，全面展示了各国军队的实力和水平。此次演习的举行进一步彰显了尘世七国在海洋安全领域的紧密合作与协调，也向外界传递出尘世七国维护地区和平与安全的坚定决心。"
 ABY_News.5.a:"所以我们什么时候发起进攻？"

 #胎海水
 ABY_News.6.t:"胎海水冲击"
 ABY_News.6.d:"枫丹蒸汽鸟报简讯：提瓦特大陆西部近日发生重大环境灾害。据多方证实，约一个月前，纳塔西部沿海与邻国挪德卡莱东部边境地带突遭来源异常的“胎海水”大规模冲击，导致两国近三成国土被染着猩红色调的咸涩海水淹没，昔日山川林地尽成泽国。截至目前，两国已紧急疏散逾十万民众，经济损失难以估量。值得关注的是，枫丹“胎海水危机处理专家”沃特林博士在受访时指出：“水体特性与枫丹此前面对的‘原始胎海水’存在不同，对提瓦特生物基质不具有溶解性威胁。”"
 ABY_News.6.a:"有没有可能是枫丹人干的！"

