 ITA_regia_marina_dynamic_modifier:0 "王国海軍"
 ITA_regia_marina_dynamic_modifier_desc:0 "イタリアの岸を守るためには地中海の制海権を確保するしかない。だが、それを実現するには、海軍の近代化に多額の投資が必要となる。"
