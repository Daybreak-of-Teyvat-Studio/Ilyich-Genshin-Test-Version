 NAT_Nightwind_Graffiti_Wards_Idea:"烟纹自守"
 NAT_Nightwind_Graffiti_Wards_Idea_desc:"烟谜主将族界记号画于墙上，是一团谁亦难懂之灵谜涂鸦。一外来商队行至墙前，对那团涂鸦指指点点，拿不准该往何走。队中有人曰：「问一问？」另一摆手：「问甚么，墙上画着呢。」他们以为那记号是路引，照涂鸦笔势拐入一岔道，越走越偏，终走入一片灰雾，辨不清方向。族中一守墙人远观，亦不喊住，只蹲墙根，以炭条将涂鸦复描一遍，添一笔。商队雾中兜半日，方狼狈退回原地。守墙人方起身，拍拍手上炭灰，将那面画满记号之墙复看一眼，转身顺只有本族认得之暗道去矣。"
