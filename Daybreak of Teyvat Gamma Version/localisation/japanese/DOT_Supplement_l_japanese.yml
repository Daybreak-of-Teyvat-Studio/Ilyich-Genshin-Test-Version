 ITA_grande_rivolta_rurale_terrain_bonus_tt:0 "§Y山岳戦の教義§!を有効にする。この国民精神が有効である間、§Y$militia$§!の§Y$hills$§!および§Y$mountain$§!での地形ボーナス: 攻撃: §G+5%§!、移動: §G+10%§!"
 ITA_hardened_irregular_bands:0 "強化された非正規部隊"
