 LYY_Mora_Monorail_system:"£mora 摩拉单轨制"
 LYY_Mora_Monorail_system_desc:"£mora 摩拉者，通行提瓦特之货币，万国通用之贵金属也。璃月执£mora 摩拉惟一产地【黄金屋】，遂执全大陆经济之命脉。黄金屋炉火昼夜不熄，铸模之声达于外港。天下交易，皆以£mora 摩拉为惟一结算之币，是为【£mora 摩拉本位制】。币权所在，即利权所在；利权所在，即国权所在。"

#####################
# 震撼提瓦特的十天与其他新闻
#####################
 LYY_News.1.t:"索拉雅日记：璃月临时政府"
LYY_News.1.d:"九月，石门前线溃，一时间璃月陷于混乱。重云将军宣言将进军玉京台，欲自为璃月之军事独裁者。对此，天权凝光欲组一新政府，括飞云商会、黑岩厂、南十字船队诸势，以缓其危。重云之威既迫，璃月港工兵代表委员会与轻策庄农民协会择妥协。终焉，璃月港立一临时之五人执政内阁，由四名原任七星与一名璃月港人民代表组成，以天权凝光为首，暂行政权，以待事定。石门前线溃卒退至明蕴镇，镇中闭门，不与之纳。轻策庄农民协会开会于社仓，议至夜半，卒从妥协。内阁印新铸，文曰临时执政，用毕即封。南十字船队诺以舟三艘听调。工兵代表会散，代表出，无一人语。玉京台前临时设栅，兵守之，凡入者验印。重云营中鼓角夜鸣，港中闻之皆闭户。"
 LYY_News.1.a:"令人震惊"
 LYY_News.2.t:"索拉雅日记：软弱的临时政府"
LYY_News.2.d:"软弱之临时政府与造反之人民，已见如此之期：政府当局每一行，必触民之怒；而每一不行动，又招民之蔑。临时政府欲弃碧水原之策，激起民如飓风之猛反；而当天权凝光公然否认政府曾有此类意时，又遭民一阵轻蔑之哄笑。《璃月人民之声报》大声疾呼曰：「被革命之压逼得无路可逃，临时政府为求脱身，乃撒弥天之谎，保其从未思离璃月港，且言不愿弃碧水原。」报出之日，读于街头者数百，读至弥天之谎一句，众皆哗然。报馆门前聚人至夜，巡警立远处，不敢近。有卖报童沿街呼此句，一日售尽三千份。次日，碧水原道上车马不绝，皆云往观其变。政府发示一道，语甚长，读者不解所指。碧水原乡民闻政府欲弃之，聚于祠堂，掷签决去留。"
 LYY_News.2.a:"令人震惊"
 LYY_News.3.t:"索拉雅日记：临时政府完蛋了"
LYY_News.3.d:"十一月七日，星期三，其人起甚迟。行至吃虎岩大街，远闻孤云阁要塞正鸣午炮。是日阴寒，冷风刺骨。国家银行大门紧闭，门前立千岩军卫兵数人，手持半旧白缨枪。问曰：「君等属何方？属临时政府乎？」其一卫兵微笑而对曰：「临时政府完矣，谢天谢地。」此外更无所问。行人照常行于吃虎岩大街，商店照常营业，街上人似不如昨日之不安。一夜之间，墙上又贴满无数新出之反对起义布告与传单，皆向农民、前线士兵、璃月港工人而呼吁者。街角有童子拾传单一纸，读之不解，问于老者，老者摇首不答。银行侧门开一缝，有人递入纸一叠，旋闭。午炮既毕，街上寂然而散。有老兵拄杖立墙下，读新贴之布告，读毕以杖击地三下。"
 LYY_News.3.a:"令人震惊" 
 LYY_News.4.t:"索拉雅日记：璃月七星革命委员会"
LYY_News.4.d:"全璃月工兵代表大会开幕。依绝大多数工人、士兵与农民之意，赖璃月港工人与卫戍部队所举之义，代表大会已将政权握于己手。大会宣布成立璃月七星革命委员会，临时政府已被推翻。革委会之政将即向各国人民提民主之和约，致力和平，保以地主之土无偿交农民委员会，使军伍彻底民主，立工人监督生产之制。代表大会决定：各地全部政权一律转归地区革委会，各地革委会应保真正之革命秩序。新政府将取一切之措，定局势，致和平，立民主。同时，天权凝光、仙麟甘雨、重云将军与仙人爪牙申鹤图调兵至璃月港，欲推翻新生之革命政权。士兵、工人、职员，共起反抗三眼五显仙人与残暴之资本商人！宜加警惕！革命之运与民主和平之运，尽在君等之手！革命万岁！会散，众起而歌，声出屋外。"
 LYY_News.4.a:"令人震惊"
 LYY_News.5.t:"凝光的战前演说"
LYY_News.5.d:"碧水原之地，历代大战五十余次，是非曲直难以论说。然史家无不注意：即在此古战场，定多少代王朝之盛衰兴亡、此兴彼落，故古来有问鼎璃月之说。当年岩王帝君令千岩军分三路会合碧水原，兴师北上。光复碧水原之次日，魔神桃都见大势已去，宣告退位。岩王历六千零十六年四月，亦正在荻花洲，吾有幸亲率三十万将士设伏于石门，御风魔龙之袭，大获全胜！吾不明白，何以众人皆谈若陀龙王被困琥牢山，仿佛此碧水原古战场于我注定凶多吉少。二十年前，吾自望舒客栈踏上征途，始七星巡幸之典，四方国泰民安。天权卫军所至，民皆竭诚欢迎，真可谓占尽天时。那种勃勃生机、万物竞发之境界，犹在眼前。石门关城壁犹存箭痕。"
 LYY_News.5.a:"天权高见"
 LYY_News.6.t:"香菱遗书"
LYY_News.6.d:"苍山如海，残阳如血。吾十万健儿已牺牲殆尽，枪膛尚温，战旗犹立。敌军炮火未歇，前途难卜。今立此绝笔：若苍天见怜，守得寸土，自当负创谒见主席；若阵地失守，吾即死于疆场，身膏野革，以残魂筑我万民之长城。待他日山河重整，云将军为中兴元帅，舰舷过云来海时，痛饮庆功之酒，唱起《春色换人间》，见得波涛如山，裂空而起，那必是末将与十万英灵，化东海怒潮，护我璃月永昌！璃月革命军第115师师长香菱，绝笔于黄金屋。书毕，取印钤之，印为木刻，边角已损。是夜帐中灯火不灭，卫士立于外，无一人言。书中不及其家事，惟云勿以吾为念。黄金屋阶下有血痕一道，自门至阶。是日云来海无风，浪平如席。"
 LYY_News.6.a:"万民堂今不复矣！"
 LYY_News.7.t:"对等关税"
LYY_News.7.d:"据[GetDateText]最新之报，纳塔部落联盟商贸委员会于今日凌晨忽宣：即日起，对璃月港出口之冶金制品、浮生石工艺品及丝绸制品加征百分之一百零四之特别关税，以报璃月对纳塔出口产品所征百分之三十四之税。此决被外界视为对「沫芒宫自由贸易协定」框架之实质突破。官方声明称，此举旨在保纳塔本土锻造业，免于「璃月低价倾销政策」之冲，且特指璃月群玉阁商贸集团借元素共鸣之术压其成本，致近三年纳塔火铸工坊倒闭率升百分之二十七。七星秘书甘雨于紧急记者会应之曰：璃月出口之货尽合《沫芒宫贸易准则》，且斥纳塔此举违两国去年所签「赤璋城联合宣言」，璃月将坚决反制。港中商会闻之，连夜聚议，至晓未散。南码头有三舟改期，货主云待议定再装。"
 LYY_News.7.a:"建议严查往生堂！"

 LYY_News.8.t:"成立新璃月"
LYY_News.8.d:"岩间琉璃云间月。帝君仙游三载有余，璃月港初历震荡，商贾惶惶，千岩军士昼夜巡防。今庚辰月朔，群玉阁重悬明灯，七星空辉复映孤云阁湾。璃月万民共立《新璃月盟约》：今承帝君遗泽，弃人神契缚，集凡智以治港。设四方议事厅，聚商贾、工匠、方士、民众共议国章。昔日动荡如云烟散尽，玉京台琉璃百合竟绽并蒂之奇，坊间皆传此为新瑞之兆。盟约既立，四方议事厅首次开议，座次不以齿爵，以所司为序：商贾居左，工匠居右，方士居中，民众环坐于外。会毕众出，无一言及旧约。是日港中罢市半日，肆门皆悬灯，灯色皆素。四方议事厅门额无字，云待众议定名。阶下列坐者百人，无一人执笏。暮时群玉阁钟三鸣，声达北码头。"
 LYY_News.8.a:" 哈哈，是时候该享受享受了！"

#####################
# 璃月笑话与璃月机制事件
#####################
 LYY.3.t:"旅行者带着派蒙去万民堂吃饭"
LYY.3.d:"旅行者携派蒙至万民堂就食，座中适有记者采访。派蒙兴起，立于一堆食品之侧，令记者为照一相。及报纸将刊，编辑为照片之题大难之：「『派蒙与食品同在一处』，不佳。」「『食品与派蒙同在一处』，亦不佳。」\n报纸既出，照片之下注曰：「左起第三位是派蒙。」"
 LYY.3.a:"左起第三位是派蒙"
 LYY.4.t:"天权星一行乘坐火车去往层岩巨渊考察"
LYY.4.d:"天权星凝光、玉衡星刻晴与秘书甘雨乘火车往层岩巨渊考察。行未久，车忽止。凝光探首窗外，厉声曰：「斩火车司机！」车仍不动。刻晴曰：「为火车司机复其名誉！」车仍不动。甘雨曰：「二位七星阁下，不如垂帘，安坐座上，自摇其身，作车犹进之状。」"
 LYY.4.a:"列车还在前进"
 LYY.5.t:"岩王帝君是永生的"
LYY.5.d:"岩王帝君既去，凝光为临时政府之领袖。于玉京台送仙楼，人颇喜排队往观岩王帝君墓前千岩军卫兵换岗。一童子问曰：「爹爹，彼等何以总须守此陵？」爹爹答曰：「彼等非一直言乎？岩王帝君是永生。若彼看不下去，决意出来，当如何？」"
 LYY.5.a:"如果他看不下去了"
 LYY.6.t:"我们有天权凝光"
LYY.6.d:"一蒙德男孩与一璃月男孩对语：\n「吾等有甜甜花酿鸡。」\n「吾等有天权凝光。」\n「吾等亦可有天权凝光。」\n「然若如此，君等便无甜甜花酿鸡矣。」\n"
 LYY.6.a:"甜甜花酿鸡"
 LYY.7.t:"玉京台清吏司"
LYY.7.d:"飞云商会之二少爷行秋、万民堂大厨之女香菱、璃月码头工人之女辛焱约相见。香菱过约时方至，曰：「恕罪，我方备考玉京台清吏司。」辛焱之子问曰：「何谓玉京台清吏司？」行秋问曰：「何谓考试？」"
 LYY.7.a:"什么是考试？"
 LYY.8.t:"民以食为天"
LYY.8.d:"商路重启之后，璃月港中一路高歌猛进之粮价终见低落，而粮价飙升之果，竟至今方显。不食则政府不能运转，人口不能增（一般只得退），即军伍亦失战力（前提为彼等不兵变）。请看璃月港中此一片乱象！若不速解饥荒，则吾辈将为民众所解矣！北码头仓门新启，粜米者列队三里，每人限买二斗，买毕以炭书其名于壁。有妇抱子候半日不得，坐于阶下哭。米价一日三改，牌上旧字未拭，新字又书。商会闭门议价，门外聚人千数，无一人先动。仓中米袋堆及梁，有吏以刀剖袋验之，云掺沙者斩。街上有小儿拾落地米粒，一粒一粒纳于囊。总务司出告示，许以工代赈，修南码头石阶。饥者日领粥二次，粥稀可鉴。粥棚前有老者持碗久候，碗已缺其一角。"
 LYY.9.a:"福无双至，祸不单行。"
 LYY.10.t:"自我谴责"
LYY.10.d:"一名千岩军自尽于营房，不卜庐白术先生断其死时约在上午十时，正值平日操练之时，姑置教官之失职不论。案上留遗书一通，其文曰：「自我入千岩军之首日，即坚护卫璃月山河、万家灯火之信念。然此一切信仰皆崩矣。吾辈踹开璃月港内商会之门，取轻策庄中老弱病残之粮。彼等何以得活？彼等皆将饿死！不应如此，一切皆不应如此！吾辈为千岩军，非盗宝团！即盗宝团亦做不出此事！对抢来之军费，食夺来之军饷，吾思之再三，恐不能再问心无愧而活矣。」遗书末不署名，惟画一矛。营房梁上一绳，绳端系于钉，钉入木三分。同营者言：其人前夜犹擦甲，甲上无尘。教官被召问，云当日点名少一人，初以为病。军中议者纷纷，或云当恤，或云当罚其怯。"
 LYY.10.a:"我们才是应该自尽的人。"
 LYY.12.t:"迟来的执行"
LYY.12.d:"锦隆立于前来搜查之千岩军知恩之前，身如筛糠，两腿直颤。知恩先开口：「锦隆是罢？」此一句于锦隆心中如一声炸雷，直震得其立不住，扑通一声跪了下去：「军爷饶命！军爷饶命！我知错了！我再不敢如此！我我我去开仓放粮！我以我家所有之粮尽发出去！饶我一命罢军爷！」知恩厌恶地看其一眼，持一清单贴于其面：「此为你于大饥荒时坐地起价所得之非法之入，共六千八百万零四千二十£mora 摩拉，你看账目对否？尚有何言？」锦隆仍跪：「没！没错！我我我！」未待其言毕，知恩挥手令人带下，拖一路水痕，其已被吓溺。次日，于一声接一声之鬼叫与喝彩中，锦隆与其他三十八名囤积居奇之奸商皆施绞刑，高挂璃月城门。"
 LYY.12.a:"早就该死！"
 LYY.13.t:"岩与契约的海港"
LYY.13.d:"此为璃月。在岩王帝君千年庇佑之下长足发展，为全提瓦特最繁之港，有极成熟之海上商路，全大陆之£mora 摩拉源源不断涌向此处。作为岩神之领地，此地矿产丰富。璃月山势蜿蜒起伏，多有可筑良关之地。自孤云阁望之，海天相接，帆樯如林；自天衡北行，山道盘曲，一里三折。归离原土厚而宜麦，轻策庄水足而宜稻，明蕴镇石坚而宜凿。商路凡三：一自南码头出云来海，一自石门关通北境，一自遗珑埠溯江而上。三路交汇之处，即在璃月港。港中昼夜不息，三更犹闻卸货之声。凡外来之舟，先泊锚地，验而后入。北码头有铁桩十二，皆系重缆，缆粗如儿臂。层岩巨渊诸矿，凿者千人，日夜轮作，石屑积如丘。天衡山有旧关，关墙厚二丈，门以铁裹。"
 LYY.13.a:"千岩牢固，重嶂不移！"
 LYY.14.t:"奇怪的违和感"
LYY.14.d:"刻晴已不知第几次被凝光唤去。虽于凝光作风颇有成见，然无丝毫不满，盖所议者乃请仙典仪之筹备，万容不得一毫懈怠。入群玉阁，先见一群秘书焦头烂额，刻晴不之理，直趋立于满墙文书前之凝光：「凝光？又唤我何事？」凝光转身，一指旁侧太师椅：「嗯，你来了，坐。」「客套不必，又有何差遣？」「果然玉衡星刻晴，直言如此。关于『请仙典仪』之安保，」「此大可不必再虑，已备得十分妥当。」「嗯，我总觉得哪里不妥。呵，也罢。」凝光凝视窗外，更无一语。阁中案上摊图一幅，四角压以石镇，茶已冷，无人添。窗外玉京台石阶上，执事者正以白垩画界，画一线，退三步视之，复画。阁外廊下有吏抱牍疾走，牍高过肩。刻晴出阁时，天已暮，港中灯火次第而明。"
 LYY.14.a:"暴风雨前的平静？"
 LYY.15.t:"岩神陨落"
LYY.15.d:"自契约之城所出种种消息观之，恐最古之岩神真已陨落。千岩军已封锁璃月出境之每一道，且禁全部之贸易，无人可随意出入璃月。毋庸置疑，提瓦特之经济将由此大受影响，此一切恐须待璃月内部于岩神遇刺一案查出结果方止。石门前线增戍三倍，凡出境者皆验符传，无符者留之。南码头泊舟不得发，桅上旗尽落。有至冬商贾欲以重金求一纸通行，关吏不受，云：此非钱之事。翘英庄茶不能出谷，茶户积货于仓，仓租日增。城中粮价三日一涨，商会闭门不敢出价。有商人以舟载货欲夜出，为哨船所截，货没于官。总务司设关于三处，凡行旅皆验，行李尽开。外国使节困于驿馆，不得归，日以书抵其国。港中工人多失业，聚于码头，无所事。"
 LYY.15.a:"什么时候轮到巴巴托斯？"
 LYY.16.t:"灾难"
LYY.16.d:"刻晴眉峰紧皱，行色匆匆。无人敢前问其故，而众皆知岩王帝君死于前日天权星凝光所办之请仙典仪，能使玉衡如此者，惟此一事。「凝光！」刻晴冲入群玉阁，见他六人早候于此，竟自帝君遇刺之后，一步未离。众人面色皆憔悴，数日来焦头烂额，即凝光亦失平日之从容，目中微露疲色。「刻晴，你来了，千岩军那边可有新报？」「并无进展。」「须另寻一法。」「如此下去，璃月必溃。」闻刻晴所报，座中终有不能忍者，哗然而起。凝光摇首，默思良久，乃曰：阁中烛已残三，案上茶冷未撤，窗外雨至，檐溜有声。七人相顾无言，惟闻檐溜愈急，灯焰随风而摇。廊下待命之吏，无一人敢入。刻晴立于案侧，指节扣案，扣三两声而止。"
 LYY.16.a:"对仙人封锁消息，千岩军将全权负责调查!"
 LYY.21.t:"璃月戡乱靖边昭告天下文"
 LYY.21.d:"棠棣之华，鄂不韡韡。凡今之人，莫如兄弟。死丧之威，兄弟孔怀。原隰裒矣，兄弟求矣。脊令在原，兄弟急难。每有良朋，况有永叹。兄弟阋于墙，外御其侮。每有良朋，烝也无戎。丧乱既平，既安且宁。《璃月风雅·棠棣》\n维璃月内衅方炽，外侮频仍，我等璃月诸方，深忧国祚，共鉴时艰。兹以璃月主权蒙尘，疆土受侵，不得不昭告宇内，共誓同仇。盖闻，和合则两利，阋墙则俱伤。我璃月之子，夙夜忧思，岂忍阋墙之祸延及邦国？今者，外敌虎视，国之存亡，匹夫有责。故我等痛定思痛，捐弃前嫌，共图大计。一、我璃月诸方，咸知国难当头，当共济时艰，同仇敌忾，以卫璃月之疆域，保我子民之安宁。二、凡侵我璃月者，虽强必拒。我等誓以血肉之躯，筑成不破之长城，捍卫璃月之主权，无惧强敌，誓死守疆。三、我璃月全体子民，无论之前立场所异，皆当以国事为重，共赴国难，协力同舟，保我璃月，光复河山。我璃月之民，不畏强暴，不惧艰难，必以我等之智勇，御敌于外。璃月内战多方会谈。"
 LYY.21.a:"所以，我们是捅了马蜂窝了？"
