 DOT_chinese_unity_1:0 "Chinese Unity"
 DOT_chinese_unity_1_desc:0 "The Warlords have declared their support for us, allowing our government to focus on resisting any foreign invader."
 DOT_civil_war_deserters:0 "Civil War Deserters"
 DOT_communist_uprisings:0 "Communist Uprisings"
 DOT_communist_uprisings_desc:0 "The tensions between communists and nationalists are present in all corners of the country. If communist support in the country goes too high, the communists will take control of a state."
