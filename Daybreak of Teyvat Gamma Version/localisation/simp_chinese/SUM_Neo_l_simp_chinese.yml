 SUM_Neo.246.t:"判罚之钉"
 SUM_Neo.246.d:"判罚之钉被拔出一枚，天钉落下的地方裂开。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。教令院的门槛这几天被踩得很低，进去的人比出来的人多。"
