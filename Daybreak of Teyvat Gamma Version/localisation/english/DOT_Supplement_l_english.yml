 ITA_stockpiling_fuel:0 "Stockpiling Fuel"
 ITA_stockpiling_fuel_desc:0 "Having a large reserve of fuel will keep our military running for longer."
 ITA_strengthened_heavy_industry:0 "Strengthened Heavy Industry"
 ITA_strengthened_heavy_industry_desc:0 "Expanding our industrial capacity will enhance our industrial productivity."
 ITA_strengthened_the_airforce:0 "Strengthened the Air Force"
 ITA_strengthened_the_airforce_desc:0 "The Italian air force is once again one of the grandest air fleets in the world. The newly trained pilots are eager to showcase just how grand an air force we now have."
 ITA_strengthened_the_army:0 "Strengthened the Army"
 ITA_strengthened_the_army_desc:0 "Expanding the army has taught us a great many things about mobilizing troops and organizing them into a coherent fighting force."
