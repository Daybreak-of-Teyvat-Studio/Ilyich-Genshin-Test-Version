################其他子意识形态
 
 conservatism:0 "保守主义"
 conservatism_desc:0 "保守主义：鉴于快速变革对社会所带来的潜在伤害，保守主义倾向于维护传统或是展开较为温和的改革，有些时候甚至提倡复古的价值观。"
 liberalism:0 "自由主义"
 liberalism_desc:0 "自由主义：在尊重个人自由的悠久哲学传统下，自由主义将捍卫这些权利视为国家的首要职能。"
 socialism:0 "博爱主义"
 socialism_desc:0 "博爱主义：博爱主义力图依靠改革来建立一个政治与经济平等的国家，其目标是为民众夺回应有的权力。"
 marxism:0 "提瓦特主义"
 marxism_desc:0 "提瓦特主义：提瓦特主义涵盖从经济学到历史观的辽阔领域，其根本上力图将荧先生的理论付诸政治实践。主张阶级斗争以及过渡至生产资料公有制社会是这种意识形态的主要特征。"
 leninism:0 "刻晴主义"
 leninism_desc:0 "刻晴主义：刻晴主义是一种基于提瓦特主义的意识形态流派，其旨在以党领导革命颠覆资本主义社会的方式建立社会主义国家。而在取得政权后，这种意识形态下的政党会通过内部讨论决策的方式执政。"
 stalinism:0 "坎瑞亚主义"
 stalinism_desc:1 "坎瑞亚主义：作为对提瓦特主义在政治上的继承和发展，坎瑞亚主义重视快速工业化与集体化，并认为只有强而有力的社会主义政府才能彻底肃清反革命分子。"
 anti_revisionism:0 "反修正主义"
 anti_revisionism_desc:0 "反修正主义：反修正主义是一种为反击众多自诩马克思主义继承人的意识形态而产生的流派，提倡保持原始革命理论的核心要素。其主要反对将资本主义经济元素引入社会主义国家，这种意识形态很大程度上通过“什么不是什么”而非“什么是什么”来定义。"
 anarchist_communism:0 "无政府启明主义"
 anarchist_communism_desc:0 "无政府启明主义：无政府启明主义是一种将启明主义理想视为无国家社会的意识形态，其主张直接建立互帮互助的社会。"
 blanquism:0 "乌托邦社会主义"
 blanquism_desc:0 "乌托邦社会主义是一种冒进的社会主义，强调社会革命是实现从资本主义生产方式到社会主义生产方式转变的必要前提。其认为，在革命之初，人民不能够自我治理，在社会状态已经坏死的情况下，需要采取英勇的补救措施来过渡到健康状态，人民在未来的一段时间内需要革命性的力量，也就是由高度组织化的精英革命者来领导。在夺取政权后，精英革命者应当利用国家的力量来推行社会主义。"
 futurism:0 "未来主义"
 futurism_desc:0 "未来主义是一种憎恶陈旧思想的思潮，推崇速度和科技等元素，主张加快技术革命的速度。任务是重新改造现在的经济基础，用社会主义引导技术发展的方向。在文化上分为前进派和超越派两个集体，前进派主张“建立属于人民自己的宗教”“解放神学”而超越派主张“神无异于人”“斩断囚神的枷锁”。"
 futurism2:0 "未来主义"
 futurism2_desc:0 "未来主义是一种憎恶陈旧思想的思潮，推崇速度和科技等元素，主张加快技术革命的速度。任务是重新改造现在的经济基础，用社会主义引导技术发展的方向。在文化上分为前进派和超越派两个集体，前进派主张“建立属于人民自己的宗教”“解放神学”而超越派主张“神无异于人”“斩断囚神的枷锁”。"
 Hegemonism:0 "霸权主义"
 Hegemonism_desc:0 "霸权主义通常会凭借军事和经济实力，超越国际法、世界政治格局现状，一味扩张自身势力范围，操纵国际事务，干涉他国内政，甚至进行武装侵略和占领，实施称霸世界、主宰世界的强权政治、强权政策。"
 democratic_socialism:0 "民主社会主义"
 democratic_socialism_desc:0 "民主社会主义是这样一种意识形态，它坚持社会主义的理想，努力推动社会公平和社会进步，但不同于激进的革命派系试图以高度严密、专业化的党实现暴力革命，它选择恪守民主原则，在民主制度的框架下进行活动，宣传社会主义理念，期冀通过民主手段捍卫公民和人民的权利。"
 nazism:0 "国家社会主义"
 nazism_desc:0 "国家社会主义：国家社会主义植根于极端民族主义，并且受到了种族至上理念的推动。其积极推行侵略性扩张政策并主张建立极权国家，在此基础上，人民都将被团结在拥有绝对权力的领袖——元首的领导下。"
 fascism_ideology:0 "刑鼎主义"
 fascism_ideology_desc:0 "刑鼎主义：刑鼎主义涵盖了许多极端民族主义的要素，总的来说，其核心理念崇尚对国家的奉献，以及将人民团结在一位强大领袖的领导下。"
 falangism:0 "劳伦斯主义"
 falangism_desc:0 "劳伦斯主义：劳伦斯主义是一种兼具刑鼎主义和保守主义特征的威权主义意识形态，其非常重视民族和教派的身份认同。"
 rexism:0 "深渊主义"
 rexism_desc:0 "深渊主义：深渊主义是一种强烈反对自由主义及启明主义，同时提倡社团主义经济的坚定的保守民族主义意识形态。鉴于其越来越多地使用民粹主义和威权主义的言辞，他们的理念正与其他刑鼎运动相接近。"
 progressive_liberalism:0 "进步自由主义"
 progressive_liberalism_desc:0 "进步自由主义：进步自由主义总体上继承了自由主义的政治哲学，但带有更多进步主义的要素，希望通过政府和社会的积极行动维护个人的自由，同时实现社会进步。"
 despotism:0 "专制政治"
 despotism_desc:0 "专制政治是一种个人拥有绝对权力的政府形式。"
 oligarchism:0 "寡头政治"
 oligarchism_desc:0 "寡头政治是一种小部分人拥有绝对权力的政府形式。"
 moderatism:1 "温和主义"
 moderatism_desc:1 "温和主义是一种在施政上采取温和姿态或手段来避免极左或极右的政府形式。"
 centrism:1 "中间路线"
 centrism_desc:1 "中间路线是一种试图通过符合常识的治理方式解决问题的政府形态，其施政力求在考虑风险和承载力的情况下，妥善解决当前和未来的需求，从而获取公众信任，进而维护共同利益。"
 constitutional_monarchy:0 "有限君主制"
 constitutional_monarchy_desc:0 "有限君主制起源于枫丹，是芙宁娜的狂热追随者为了适应大洪水后水神神位不再的现实提出的政治构想，在这一制度下，芙宁娜不再是以神，而是以君主的身份进行统治。当然，出于维护民主制的需求，芙宁娜的权力将会被议会、宪法和人民的意志约束。"
 powerful_president:0 "强势领袖制"
 powerful_president_desc:0 "强势领袖制起源于枫丹，是芙宁娜的狂热追随者为了适应大洪水后水神神位不再的现实提出的政治构想，在这一制度下，芙宁娜不再是以神，而是以民选领袖的身份进行统治。为了贯彻她的命令，这种哲学要求赋予芙宁娜足够的权力。"
 Deshretism:0 "赤王复兴主义"
 Deshretism_desc:0 "赤王复兴主义：赤王复兴主义是赤王死后，沙漠中的赤王子民里比较极端的民族主义和扩张主义，他们主张重振赤王时期的辉煌，反对须弥的草神以及教令院的统治秩序，并不断尝试推翻现有政权。"
 Dottorism:0 "多托雷主义"
 Dottorism_desc:0 "多托雷主义：多托雷主义受到教令院第七学派那伽朱那学派思想，深渊坎瑞亚主义，蜂巢思维等影响，主张发掘人的”另类价值“，主张建立极权以及高度飞升化的国家，极端反人性，他们的主张为教令院所排斥。"
 anti_democratic_junta:0 "反民主军政府"
 anti_democratic_junta_desc:0 "反民主军政府并不是严格的意识形态，而近乎于纯粹的宣传。他强调对民主的怀疑和反动，积极支持当权的军事领袖掌握权力，其理由往往是维持稳定一类。"

 frostmoonlism:0 "霜月之子"
 frostmoonlism_desc:0 "古亥珀波瑞亚遗民，信仰霜月女神，奉行自然之道"

 SNE_Governing:0 "苍星王庭"
 SNE_Governing_desc:0 "苍星王庭是由白沙皇建立的以妖精贵族为主要统治阶级的贵族皇室，在冰之女皇的改革下人类也开始进入了政治阶层，但不少妖精并不认可这一行为"
