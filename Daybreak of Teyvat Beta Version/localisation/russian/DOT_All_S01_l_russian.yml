#丽莎建设决议
DRA_Lisa_Refugees_Settlement:0"Расселение беженцев и развитие"
DRA_Lisa_Refugees_Settlement_desc:0"Мы не можем изменить войну, но можем сделать жизнь в Драконьем хребте мирной и счастливой.\n\nРабочая сила для расселения: §Y[?DRA_Refugee_Manpower]§!\nЧем меньше, тем лучше.\n\n§BБонус к качеству жизни§!：§Y[?DRA_Bonus_Entertainment]§!\n§RЗатраты на качество жизни§!：§Y[?DRA_Used_Entertainment]§!\n§5Общее качество жизни§!：§Y[?DRA_All_Entertainment]§!\nКачество жизни = §Yгражданские заводы + бонус - затраты§!. Высокое качество привлекает беженцев.\n\nВозможно, Драконий хребет станет оазисом в войне."
DRA_Receive_Refugees:0"Приём беженцев"
DRA_Receive_Refugees_desc:0"Мы будем регистрировать, обучать и размещать беженцев.\n§YКачество жизни, незанятая рабочая сила и напряжённость в мире влияют на количество беженцев.§!"
DRA_Call_Refugees:0"Привлечение беженцев"
DRA_Call_Refugees_desc:0""
DRA_Great_Call_Refugees:0"Массовое привлечение"
DRA_Great_Call_Refugees_desc:0""
DRA_Expand_Agri_District:0"Обучение сельскому хозяйству"
DRA_Expand_Agri_District_desc:0"Мы создадим сельскохозяйственные районы и обучим рабочих."
DRA_Military_Train_Refugees:0"Военная подготовка"
DRA_Military_Train_Refugees_desc:0""
