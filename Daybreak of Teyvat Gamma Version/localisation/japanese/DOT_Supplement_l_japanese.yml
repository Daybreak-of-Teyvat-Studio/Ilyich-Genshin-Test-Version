 GRE_political_instability_communist_desc:0 "§W£faction_gre_monarchist §Y君主主義者§!は[Root.GetMonarchistLoyaltyLevel]である。§![ROOT.GetMonarchistLoyaltyEffects]\n\n§W£faction_gre_venezelist §Y共和主義者§!は[Root.GetRepublicanLoyaltyLevel]である。§![ROOT.GetRepublicanLoyaltyEffects]\n\n§W£faction_gre_communist §Y共産主義者§!は[Root.GetCommunistLoyaltyLevel]である。§![ROOT.GetCommunistLoyaltyEffects]\n\n§W£faction_gre_fascist §Yファシスト§!は[Root.GetFascistLoyaltyLevel]である。§![ROOT.GetFascistLoyaltyEffects]\n\n1924～35年にかけて、我が国では23回の政権交代、13回のクーデター、そして独裁政権が起こった！ギリシャは長い歴史において初めて民衆を第一とする運動が国家を担った。しかしこの運動はまだ新しく、民衆が我々の統治に本当の信頼を置く前に、我々は多くのことを証明せねばならない。"
 GRE_political_instability_desc:0 "§W£faction_gre_monarchist §Y君主主義者§!は[Root.GetMonarchistLoyaltyLevel]である。§! [ROOT.GetMonarchistLoyaltyEffects]\n\n§W£faction_gre_venezelist §Y共和主義者§!は[Root.GetRepublicanLoyaltyLevel]である。§![ROOT.GetRepublicanLoyaltyEffects]\n\n§W£faction_gre_communist §Y共産主義者§!は[Root.GetCommunistLoyaltyLevel]である。§![ROOT.GetCommunistLoyaltyEffects]\n\n§W£faction_gre_fascist §Yファシスト§!は[Root.GetFascistLoyaltyLevel]である。§![ROOT.GetFascistLoyaltyEffects]\n\n1924～35年にかけて、我が国では23回の政権交代、13回のクーデター、そして独裁政権が起こった！民衆は既に嫌気が差しており政府の安定を心待ちにしているが、政府が長く存続可能かについては慎重かつ懐疑的なままである。我々は彼らが間違っていることを証明し、政治的な敵を服従させることによってこの絶え間ない内紛に終止符を打たねばならない。"
 GRE_political_instability_dummy_desc:0 "1924年から1935年にかけて、我が国では23回の政権交代、13回のクーデター、そして独裁政権が起こった！民衆はすでに嫌気が差しており政府の安定を心待ちにしているが、政府が長く存続できるかについては慎重かつ懐疑的なままである。我々は彼らが間違っていることを証明し、政治的な敵を服従させることによってこの絶え間ない内紛に終止符を打たねばならない。"
 GRE_political_instability_fascism:0 "政情不安"
 GRE_political_instability_fascism_desc:0 "§W£faction_gre_monarchist §Y君主主義者§!は[Root.GetMonarchistLoyaltyLevel]である。§![ROOT.GetMonarchistLoyaltyEffects]\n\n§W£faction_gre_venezelist §Y共和主義者§!は[Root.GetRepublicanLoyaltyLevel]である。§![ROOT.GetRepublicanLoyaltyEffects]\n\n§W£faction_gre_communist §Y共産主義者§!は[Root.GetCommunistLoyaltyLevel]である。§![ROOT.GetCommunistLoyaltyEffects]\n\n§W£faction_gre_fascist §Yファシスト§!は[Root.GetFascistLoyaltyLevel]である。§![ROOT.GetFascistLoyaltyEffects]\n\n1924～35年にかけて、我が国では23回の政権交代、13回のクーデター、そして独裁政権が起こった！ファシズムは他の何よりも団結を支持する……我々が効果的にギリシャ国民を動員できず、ギリシャの苦境に対する明確な答えこそファシズムであると示すことを助長できなかった場合、我々は支配するに値しないだろう。"
 GRE_political_instability_metaxas:0 "政情不安"
 GRE_political_instability_metaxas_desc:0 "§W£faction_gre_monarchist §Y君主主義者§!は[Root.GetMonarchistLoyaltyLevel]である。§![ROOT.GetMonarchistLoyaltyEffects]\n\n§W£faction_gre_venezelist §Y共和主義者§!は[Root.GetRepublicanLoyaltyLevel]である。§![ROOT.GetRepublicanLoyaltyEffects]\n\n§W£faction_gre_communist §Y共産主義者§!は[Root.GetCommunistLoyaltyLevel]である。§![ROOT.GetCommunistLoyaltyEffects]\n\n§W£faction_gre_fascist §Yファシスト§!は[Root.GetFascistLoyaltyLevel]である。§![ROOT.GetFascistLoyaltyEffects]\n\n1924～35年にかけて、我が国では23回の政権交代、13回のクーデター、そして独裁政権が起こった！我々はメタクサスの指導の下で敵を全て粉砕する強さによって団結を達成しなければならない！ギリシャ国民は無秩序な国家に秩序を確立する意思を持ったこの政府がどのような結果をもたらすか知るべきだろう。"
 GRE_political_instability_republican:0 "政情不安"
 GRE_political_instability_republican_2:0 "政情不安"
 GRE_political_instability_republican_2_desc:0 "§W£faction_gre_monarchist §Y君主主義者§!は[Root.GetMonarchistLoyaltyLevel]である。§![ROOT.GetMonarchistLoyaltyEffects]\n\n§W£faction_gre_venezelist §Y共和主義者§!は[Root.GetRepublicanLoyaltyLevel]である。§![ROOT.GetRepublicanLoyaltyEffects]\n\n§W£faction_gre_communist §Y共産主義者§!は[Root.GetCommunistLoyaltyLevel]である。§![ROOT.GetCommunistLoyaltyEffects]\n\n§W£faction_gre_fascist §Yファシスト§!は[Root.GetFascistLoyaltyLevel]である。§![ROOT.GetFascistLoyaltyEffects]\n\n1924～35年にかけて、我が国では23回の政権交代、13回のクーデター、そして独裁政権が起こった！我々ヴェニゼロス派はその中において少しでも協力する必要があったかもしれない事は否定できない……少なくとも民衆は我々を悪魔として認知している！我々の遺産を実現し、1919年にギリシャが始めたコンスタンティノープルを奪還する旅を終わらせるのは我々にかかっている……"
 GRE_political_instability_republican_desc:0 "§W£faction_gre_monarchist §Y君主主義者§!は[Root.GetMonarchistLoyaltyLevel]である。§![ROOT.GetMonarchistLoyaltyEffects]\n\n§W£faction_gre_venezelist §Y共和主義者§!は[Root.GetRepublicanLoyaltyLevel]である。§![ROOT.GetRepublicanLoyaltyEffects]\n\n§W£faction_gre_communist §Y共産主義者§!は[Root.GetCommunistLoyaltyLevel]である。§![ROOT.GetCommunistLoyaltyEffects]\n\n§W£faction_gre_fascist §Yファシスト§!は[Root.GetFascistLoyaltyLevel]である。§![ROOT.GetFascistLoyaltyEffects]\n\n1924～35年にかけて、我が国では23回の政権交代、13回のクーデター、そして独裁政権が起こった！我々ヴェニゼロス派はその中において少しでも協力する必要があったかもしれない事は否定できない……少なくとも民衆は我々を悪魔として認知している！不幸にも、アナトリアの大惨事の記憶はギリシャ国民の中に鮮明に残っておりその中で我々が果たしたことも忘れてはいない。"
 GRE_protectors_of_the_mediterranean_spirit:0 "[Root.GetProtectorsMediterraneanSpiritName]"
 GRE_protectors_of_the_mediterranean_spirit_desc:0 "地中海は他の誰よりも長い期間、我々の「家」であった。我々はこの地域と住民に対して負うべき責任がある。そして、この神聖な義務を放棄するつもりはない。"
 GRE_pyrkal:0 "ピルカル"
 GRE_red_militias_2:0 "赤軍"
 GRE_red_militias_2_desc:0 "真の共産主義国には、労働者の意志を無事に執行できる人民軍が必要だ。"
 GRE_red_militias_3:0 "赤軍執行者"
 GRE_red_militias_3_desc:0 "党に対して陰謀を企てる破壊工作員はどこにでもいるが、才能ある者たちによる小さな集団を少し仕込むだけで、奴らを見つけ根絶できる……"
 GRE_red_militias_spirit:0 "赤軍民兵"
 GRE_red_militias_spirit_desc:0 "ギリシャ社会の近代化に向けた我らの努力を阻止しようとする者は多数いるが、革命の護持に身を捧ぐ民兵組織により、奴らは我々を止めることがより困難になったと知るだろう。"
 GRE_republicans_friendly_or_loyal:0 "£faction_gre_venezelist §Y共和主義者§!が友好的または忠実である。"
 GRE_reviving_the_double_headed_eagle_2:0 "双頭の鷲の精神の復活"
 GRE_reviving_the_double_headed_eagle_2_desc:0 "ヴェニゼロス派はギリシャの失われた栄光……ビザンツの栄光を取り戻すことを拒否した臆病者だ！帝国の失われた領土を全て取り戻すことができるのになぜトルコの沿岸で止まってしまうのだ？ギリシャの栄光ある新時代が始まった！"
 GRE_reviving_the_double_headed_eagle_spirit:0 "双頭の鷲の精神の復活"
 GRE_reviving_the_double_headed_eagle_spirit_desc:0 "ヴェニゼロス派はギリシャの失われた栄光……ビザンツの栄光を取り戻すことを拒否した臆病者だ！帝国の失われた領土を全て取り戻すことができるのになぜトルコの沿岸で止まってしまうのだ？ギリシャの栄光ある新時代が始まった！"
 GRE_rheinmetall:0 "ラインメタル"
 GRE_royal_hellenic_naval_shipyard:0 "王立ギリシャ海軍造船所"
 GRE_rsaf_enfield:0 "エンフィールド造兵廠"
 GRE_rural_exodus:0 "農民離村"
 GRE_rural_exodus_Desc:0 "産業化の推進で、人々は大都市に押し寄せ国内の農村部の家々を離れていった。"
 GRE_schachtplan:0 "シャハト案"
 GRE_schachtplan_desc:0 "ドイツの経済学者ヒャルマル・シャハトの発案したシャハト案は、ギリシャからドイツへ輸入される資源を増加させる代わりに、ギリシャのドイツ市場に対する参入を保証するものである。ドイツ人は我々が破産しないよう支えてくれているが、彼らの寛大さに依存することで罠に掛かってしまっているのかもしれない。"
 GRE_schachtplan_fascistised:0 "ゴツァマニス＝シャハト案"
 GRE_schachtplan_fascistised_desc:0 "ヒャルマル・シャハトのシャハト案に基づき、ドイツとギリシャの偉大なる経済家たちは共同で国家社会主義の理念に基づいた新たな経済協定を締結するために、最新の注意を払って新たなシャハト案をまとめ上げた。この経済協定は長期的にみれば役に立たないかもしれないが、近年の争いの中では十分に役立つものだろう。"
 GRE_schachtplan_modified:0 "シャハト案"
 GRE_schachtplan_modified_desc:0 "才能あるヒャルマル・シャハトの発案したシャハト案は、ドイツがギリシャの資源市場へ優先的に参入する代わりに、ギリシャのドイツ市場に対する参入を保証するものである。ドイツ人は従来より我々が破産しないよう支えてくれており、そして我々は共に特別な経済関係を築いてきた。"
 GRE_security_batallions:0 "警備大隊"
 GRE_security_batallions_desc:0 "占領地と自国の平和の維持のために、我々は最も熱烈なファシストに警備大隊の組織の依頼をすることを余儀なくされた。"
 GRE_siemens:0 "シーメンス"
 GRE_small_investment:0 "[GRE.GetNameDef]への小規模投資"
 GRE_small_investment_desc:0 "[GRE.GetNameDef]の経済にささやかな投資を行った。"
 GRE_socialist_economy_2:0 "ギリシャ社会主義"
 GRE_socialist_economy_2_desc:0 "ギリシャの人々は戦争屋のヴェニゼロス派と偽りの王の独裁的な支配のもとであまりにも長い間血を流してきた。ついに国民を第一に考える政府のもとで国民が繁栄する時が来た。"
 GRE_socialist_economy_3:0 "ギリシャ・スターリン主義"
 GRE_socialist_economy_3_desc:0 "党は何よりも優先される。党に忠実でない者、それは破壊分子にして裏切り者であり、我が国全体の脅威だ。"
 GRE_socialist_economy_4:0 "ギリシャ共産主義"
 GRE_socialist_economy_4_desc:0 "労働者は何よりも優先される。労働者が権力を握り労働者で構成された我らの政府が、労働者の最善の利益を代表することが出来ないのならば、誰が出来るのだろうか？"
 GRE_socialist_economy_spirit:0 "ギリシャ社会主義"
 GRE_socialist_economy_spirit_desc:0 "我々は利益よりも人を重視する経済を実施してきた。我々には外国からの搾取的な資本家と[ROOT.GetAdjective]の労働者の公正な賃金を騙し取ろうとする地元の害虫どもという明確な敵が存在している。"
 GRE_sophistry_and_science_idea:0 "詭弁と科学"
 GRE_sophistry_and_science_idea_desc:0 "政治家と研究者との共依存関係を促進することで、我々は近代化に一歩近づくことができるだろう。"
 GRE_sophoklis_venizelos:0 "ソフォクリス・ヴェニゼロス"
 GRE_spyridon_avgeris:0 "スピリドン・アヴイェリス"
