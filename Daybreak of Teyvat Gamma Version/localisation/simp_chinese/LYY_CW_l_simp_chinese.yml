l_simp_chinese:

 #################### 刻晴 · 七星革命委员会 ####################
 KQP_CivilWar_Dawn:"玉京台夜张檄文"
 KQP_CivilWar_Dawn_desc:"请仙典仪既毕三日，刻晴登玉京台。不聚众，不设誓，但取素纸一幅，书数语于城壁：璃月之契，当另择人署之。诘朝，纸传遍港口，抄者塞途。或谓之檄，或谓之遗书。刻晴闻之曰：「二者皆是。」事闻于七星，坐者默然，无敢先对。"
 KQP_The_Yuheng_Banner:"掷印信独树一帜"
 KQP_The_Yuheng_Banner_desc:"玉衡星于七星中最少，亦最不肯俯首者。议事之日，以印信掷还案上，声不甚大，而满座失次。或问其故，答曰：「印者，代神行令之物，吾不受代。」乃出厅，自树一帜，帜上无徽，亦无字。市人环观，莫晓其属。有老吏叹曰：「旧璃月自此失一臣，新璃月自此得一民。」帜立于玉京台阶前，竿为整木，高四丈，风至则展。"
 KQP_Requisition_the_Millelith:"千岩军解刀听令"
 KQP_Requisition_the_Millelith_desc:"千岩军少壮列队于庭，次第解佩刀置案上。问其故，曰：「不为饷，不为阶，特不愿复向不觌面之神屈膝耳。」及末一人置刀，刻晴但闻金铁相触，不闻人语。乃下令曰：「自今而后，千岩之众，惟城是守，惟民是听。」旧徽尽落，刀鞘成列，军容反肃于前日，刀列于玉京台庭中。"
 KQP_Open_the_Archives:"启石室尽发旧契"
 KQP_Open_the_Archives_desc:"石室之门封三百年，锁已朽，以铁锤三击而开。架上千余卷，尘积如絮，取一卷拂之，纸屑落满案。司书者指其墨迹曰：「此帝君之约也。」再揭其下，则有小字累累，皆立约人之名，村名、役名、亡者名。刻晴立良久，语左右曰：「向者只记一人之印，今乃见千人之手。」由是发令，凡旧契皆许人自阅，抄者不给值。石室在玉京台之西，门以铁包，锁朽而锤三击乃开。"
 KQP_Enlist_the_Guilds:"匠户列名入盟书"
 KQP_Enlist_the_Guilds_desc:"铁匠、船工、染匠、矿工百余人立于阶下，衣上各有其色。议事厅旧例，匠户不得入，至是撤其槛。刻晴语之曰：「璃月非一人所造，乃尔曹一锤一凿所成。」众未应，亦未鼓掌，但依次上前，以工会之印按于名册。印泥新调，按之有声。一老染匠按毕，顾其徒曰：「此印比吾家谱上那方印重。」百余人立于玉京台阶下，阶九级，级面磨滑。"
 KQP_Purge_the_Old_Qixing:"罢黜令晓抵七府"
 KQP_Purge_the_Old_Qixing_desc:"罢黜之令，拂晓分送七府。有跪于阶下而哭者，有夜半卷资出城者，亦有着旧冠端坐堂上、待人来收印者。其一受令毕，但曰：「早该如此。」刻晴闻之，不辩一言。左右问何以不辩，曰：「吾亦曾坐此席，受此印，食此俸。今日逐之，犹逐昔日之我。」言毕，取案上旧名录，先以一笔勾去己名。七府散于璃月港城西，府门旧匾卸下，抬之入库。"
 KQP_Draft_the_Peoples_Contract:"民约初草笔难下"
 KQP_Draft_the_Peoples_Contract_desc:"起草之笔，置于案上三日，无人敢下。馒头师、船工、守夜人凡九人，环坐一室，纸上空白。一船工问：「此约何以开头。」众议半日，或曰当先奉神，或曰当先立君。刻晴在门外听之，不入。至夜，九人自负手来，纸上只一行：「人不得高于人。」刻晴读竟，以指按其字曰：「此一句足矣，余者可缓缓商量。」九人环坐于玉京台西厅，案上一纸，砚中墨浅。"
 KQP_The_Engineers_Corps:"匠作团按图治城"
 KQP_The_Engineers_Corps_desc:"刻晴所召者，匠人也。至则不问主义，但铺图纸于地，以炭条指之：此桥中断，此巷塌其半，此闸三年未修，水涨则淹田千亩。众俯身就图，争在某处加桩，某处减石，争至日昃，无一人言及革命二字。刻晴立于图侧，谓左右曰：「革命者何，不过使断者复续，塌者复立耳。」翼日，第一支匠队出城，携锯三十、钉两担。匠队出璃月港南门，携锯三十、钉两担，行三日方至。"
 KQP_Seize_the_Arsenals:"矿工撬开旧武库"
 KQP_Seize_the_Arsenals_desc:"武库之门，为矿工以撬棍启之。门轴锈涩，作长鸣。库中火器排列如林，油布未揭，皆新。兵士入而清点，一名一册，擦拭、上油、装药，无人言语。有少年兵抚炮身，忽曰：「此物本为守璃月而铸。」刻晴立于门限，答曰：「自今而后，此炮只受一令，璃月之令。」令自何人出，须先问守炮者。武库在璃月港北，库门以铁包，撬棍入处木已裂。"
 KQP_Militia_Ordinance:"每巷各置赤卫队"
 KQP_Militia_Ordinance_desc:"条例颁下：每街、每巷、每船，各置赤卫一队，人给旧枪一枝，月聚两次。士绅闻之，皆曰：「枪入匹夫之手，祸不可测。」刻晴答曰：「枪在诸公手中三百年，璃月之祸可曾少过一日。」众不能对。自是街巷之间多一新声，乃生手摩枪机之轻响。有老妇夜坐门槛，见其孙擦枪，不叱，但曰：「莫指人。」赤卫集于南码头空地，地以石铺，石缝生草。"
 KQP_Price_of_Bread:"开仓定粮平市价"
 KQP_Price_of_Bread_desc:"是岁面粉腾贵三倍，市中馒头如金。刻晴先开官仓，次定粮价，次遣兵护粮车。有商人囤积闭粜，待价而沽，刻晴命籍其仓，尽出之，半价售于市，仍许其本钱。或劝以重法，曰：「杀一儆百。」刻晴曰：「吾不欲以血平粮价。」价落之日，码头有挑夫停担而拍手，此新政府所得第一声也。官仓在璃月港城东，门既启，米气出街，三日不散。"
 KQP_Land_Reform_Pilot:"丈量坡地授新契"
 KQP_Land_Reform_Pilot_desc:"第一批丈量者，皆城西最瘠之坡地。丈者持绳，书者持册，一日得田三百亩。领契之日，田夫洗其手，久而后按印；印成，举契对日而观，泪落纸上。有一老农问：「此后可卖乎。」吏曰：「可卖，惟须邻里皆知。」老农点头曰：「如此便好。」刻晴立远处见之，顾谓从事曰：「迟矣。」从事问何迟。曰：「此辈等此纸，已等三代。」丈量自璃月港城西瘠坡起，绳以麻绞成，桩以青石入土。"
 KQP_The_Great_Debate:"玉京台前辩两途"
 KQP_The_Great_Debate_desc:"玉京台前，广场塞途。左道通议会之台，右道通讲台之灯，两道皆书人民二字，而行者各不相顾。议者登台，甲曰当先立法，乙曰当先分田，丙拍案曰：「先分田者，法自田中生。」争至夜半，烛三易而声不衰。刻晴居中而坐，听竟，一言未发。散时人问所决，曰：「未决。」再问何以不决，曰：「此路不当由一人决之，今始信其难。」"
 KQP_Suppress_the_Gods_Edict:"敕令一言禁神判"
 KQP_Suppress_the_Gods_Edict_desc:"敕令只一句：「神可受祭，不可断狱。」颁之，庙祝无辞，神像无言。所动者不在庙，而在人心。盖凡人数世以来，遇难则曰：「自有神明主张。」一旦神明退听，则仓皇不知所归。刻晴署名时，笔不颤。左右问曰：「不畏天谴乎。」刻晴曰：「吾所废者非神，乃待人代决之心。此心不去，虽有共和，亦为人役。」敕令张于天后宫门侧，纸以浆粘，庙祝读毕无言。"
 KQP_Secular_Temple:"神殿改作童子塾"
 KQP_Secular_Temple_desc:"旧神殿改作学堂，神像移置廊下，其座削平，为童子课桌。开学第一日，先生问：「天下何物最公。」童子齐声曰：「秤。」先生问：「何以秤为最公。」一童起曰：「为其不问买者是谁。」满堂皆笑，先生不笑，取笔记之。刻晴立于门外，听至此处，以袖掩面，良久乃去。归途语人曰：「吾今日方知，旧香火未绝，只换其烧法。」旧神殿在玉京台西，神像移置廊下，其座削平为案。"
 KQP_Constitutional_Assembly:"布衣初草国约"
 KQP_Constitutional_Assembly_desc:"璃月立国以来，凡人自草国宪，此为首次。无神谕，无星象，无卜筮，惟争、让、再争。有议者拂袖欲去，为同席拽其袖而止。刻晴坐末座，以首座让于年最长之老匠。或问其故，曰：「立约之事，宜由将老者与将少者共议。」众问其解，曰：「老者知旧约之弊，少者受新约之缚，吾在其间，不过执笔。」议事设于玉京台正厅，长案三张，以两案并成。"
 KQP_Universal_Suffrage:"选票散入矿工手"
 KQP_Universal_Suffrage_desc:"选票初颁，送至矿工、船夫、卖唱者之手。有士人笑于茶肆曰：「此辈并其名不能书，安知国事。」刻晴闻之，取一票亲授老矿工，曰：「此人识一矿脉：脉在何处，几时竭，何处可凿，胜识百字。」老矿工接票，不以手，先以衣拭手，乃受之，捏至日暮未放。或问：「欲投何人。」曰：「投那肯下井者。」选票发至南码头、黑岩厂、翘英庄，一户一纸。"
 KQP_The_Artisans_Charter:"锤柄各归其手"
 KQP_The_Artisans_Charter_desc:"宪章之要只一条：物为谁造，其去留即由谁定。铁匠闻之，初不信，问吏曰：「吾所打之刀，吾可言不卖乎。」吏曰：「可。」铁匠良久不语，回铺取一旧锤，摩其柄曰：「此锤随吾二十年，今日始知是吾物。」黑岩厂老工头阅条文毕，一无所言，唯自是在炉前哼一小调，调为旧日所禁。"
 KQP_Nationalize_the_Mines:"封矿而立官籍"
 KQP_Nationalize_the_Mines_desc:"矿脉入籍归国之日，井下灯火反明。盖旧主在时，为省油，灯只许点半。矿工以手摩井壁，如摩故人脊背。无人欢呼，以众皆知其难：夺矿于旧主易，还矿于凿者难。有老矿工语其徒曰：「自今日起，此脉属众。」徒问：「众者谁也。」老者不能答，久之曰：「问汝自己之手。」矿井在黑岩厂后山，井口设卡，出矿皆须过秤。"
 KQP_The_Peoples_Army:"旧徽尽落新旗迟"
 KQP_The_Peoples_Army_desc:"旧徽尽落，新旗未颁。军校百余人易服立于校场，服上无识，惟领口一线白。令下，皆向一空旗举刀为礼。礼毕，刻晴登台曰：「诸君不必急求新徽，先自问所效者一人乎，抑此城乎。此问须夜夜自问，问至不必问之日。」台下寂然。有校尉按刀而出，行数步，复回列中。校场在玉京台东，场地平，四周以木栅，栅已旧。"
 KQP_Contract_With_Labor:"刻晴让笔与工头"
 KQP_Contract_With_Labor_desc:"签约之日，刻晴以笔授工人代表，自退立于柱侧。众请其署，曰：「此约若由官署，即不作数。」代表接笔，手微颤，落墨却重，纸几为穿。署毕，还笔于刻晴，曰：「明公勿悔。」刻晴笑曰：「吾所惧者非悔，乃他日尔曹不复来寻我署。」满座先静，而后笑声起，笑声中有老者以袖拭目。签约在玉京台西厅，笔为乌木杆，杆上旧刻痕数道。"
 KQP_Abolish_the_Adepti_Court:"仙家法庭摘牌日"
 KQP_Abolish_the_Adepti_Court_desc:"仙家法庭之匾，以长梯取下。梯凡三移，街下观者渐集，无一人语。匾落地，声闷。是日午后，申鹤遣人送书一封，纸素而冷，字亦如其纸。刻晴读竟，折为四，纳诸袖。左右问书中何言。曰：「无一字及怒，故可畏。」又问：「既如此，犹裁之乎。」曰：「法庭可裁，人心不可裁，此役方始。」绝云间山门之匾以长梯取下，梯三移，观者渐集。"
 KQP_The_Latter_People:"新进少年嫌我迟"
 KQP_The_Latter_People_desc:"新进少年百余人补入各署，皆少于刻晴，亦急于刻晴。议事时不肯待文毕，辄起而陈；见旧例则曰：「此宜尽废。」刻晴观之，喜；退而独坐，则忧。或问何忧。曰：「此辈乃吾所养，他日必嫌吾迟，嫌吾软，嫌吾不彻底。」问者曰：「然则何如。」刻晴曰：「正欲其如此。」言已，取案上文书，改其缓者三处。玉京台各署新进少年百余人，坐下即取笔，笔皆新。"
 KQP_Manifesto_of_Yuheng:"满城争诵一纸"
 KQP_Manifesto_of_Yuheng_desc:"宣言颁于市中，吏登高台读之，一句一顿，台下万头攒动。读至契约不属神、不属星而属署约之人，满城静极，惟闻海风。少顷，呼声大作，屋瓦皆震。刻晴立台上，面色不动。左右以为喜，视之，其手按栏，指节皆白。事后语一近侍曰：「自此而后，无人可为我作保矣。」高台设在璃月港市中，台下万头攒动，屋瓦皆震。"
 KQP_Harbor_Of_Equals:"万国商船许卸货"
 KQP_Harbor_Of_Equals_desc:"平等之港开。凡船至，不问所挂何旗，皆许卸货，税一例。旧商大哗，谓是自毁门户，联名上书。刻晴批其书尾曰：「门户者，所以通人，非所以拒人。未几，外邦商船毕集，码头栈房不敷，脚夫增三百人，夜亦举火卸货。」旧商中有人亦遣子入此行，为人所笑，其子不辩，但数钱。南码头栈房不敷，货堆于岸，以苇席覆之，夜亦举火卸货。"
 KQP_Federate_The_Eight_Wards:"八区各抱一印"
 KQP_Federate_The_Eight_Wards_desc:"八区各操其方言，各守其账簿，旧不相通。至是共坐一席，争七日七夜。争论最烈者非赋税，乃谁可代谁署名。卒定一约：凡涉一区之事，他区不得代署。刻晴于约末亲书一行：「宁不齐，毋复齐而属于一人。」书毕，八人各以指蘸印泥按于纸，印有大小，色有深浅，而约成。八区共坐于玉京台一席，争七日七夜，约乃成。"
 KQP_The_Forge_Republic:"熔炉昼夜不曾熄"
 KQP_The_Forge_Republic_desc:"熔炉昼夜不熄，火光映于云来海上，渔人夜归，望之以为城在烧。共和国以废铁铸新钢，以散沙铸器，月出刀三千、钉十万、轨二百丈。工人夜班毕，坐炉边取暖，曰：「此火比神殿之灯暖。」刻晴闻之，不喜，反顾从事曰：「以国为炉者，最易并异议而投之。其记之，勿使人以炉喻国。」"
 KQP_A_Thousand_Year_Promise:"城头许下千年诺"
 KQP_A_Thousand_Year_Promise_desc:"刻晴立于城头，对港口万众，许一诺：愿千年之后，璃月仍由凡人主张。其文刻于石，不署我字，只署璃月二字。或问：「何以不署己名。」曰：「署吾名者，一人之诺；署璃月者，代代相受之诺。」问者曰：「千年之后，谁复记此。」刻晴指港中樯橹曰：「记此者，当是彼时立于此处之人。」诺文刻于城头石上，石在璃月港南门，字为阴刻。"
 KQP_Watchful_Engineers:"工程师掌印视事"
 KQP_Watchful_Engineers_desc:"另一途之初履，无声。工程师入署，不谈志，不谈民，只陈表册：「某月成桥几，某旬输矿几，某事可省工若干。」议事厅中无人争，亦无人问。刻晴夜坐署中，烛下自语曰：「或者璃月未足自政，或者当先有人为之造一器，器成而不误。」语毕自惊，取笔欲记，复止。此语后为一切之端。工程师入玉京台署中，所陈者表册，不谈志，不谈民。"
 KQP_Suspend_the_Assembly:"议会闭门无人守"
 KQP_Suspend_the_Assembly_desc:"议会闭门之日，刻晴立于阶上，声甚低，曰：「非常之时，宜有非常之举。」语罢，众皆不语，有议者张口欲言，终无一言。门合，铜闩落下，声彻庭院。是夜无人守门，亦无人来问。刻晴归署，对灯坐至天明。侍者进茶，闻其自语曰：「暂者二字，最为可惧。」侍者不敢应。议事厅门合，铜闩落下，声彻玉京台庭院。"
 KQP_The_Efficiency_Decree:"令文书三日必达"
 KQP_The_Efficiency_Decree_desc:"令下：凡公文三日不决者，罪在署。于是文书昼夜行于城中，驿马不足，则以步卒递之。初时百事皆速，民颇便之。居数月，有老吏抱牍至阶下，问曰：「此牍所决之事，无人曾读，亦当行乎。」刻晴取牍视之，半晌不能答。自是文书愈疾，而读者愈少。步卒递文书，自璃月港南门至北门，日三往返，靴底皆破。"
 KQP_Technocratic_Cabinet:"算筹满丹墀"
 KQP_Technocratic_Cabinet_desc:"新内阁十人，无一人出身议席，皆工程师、会计、测绘之流。议事不设虚文，各出册子，指其数而争其法。首次会议，刻晴问曰：「此诸数之后，各有其人，谁为之任。」满座默然，笔皆停。良久，一年少会计举手，举至半而复放下。刻晴见之，不点名，只曰：「今日散，明日再问。」新内阁十人入玉京台，各出册子，指其数而争其法。"
 KQP_Conscription_Of_Minds:"书院子弟先服役"
 KQP_Conscription_Of_Minds_desc:"法令张于书院门左：凡生徒卒业，须先服役三年，所学、所往，皆由官定。榜下童子环读，有喜者，以为得官；有默然者，收书而归。刻晴亲阅名册，至一名字，指停不去。左右视之，乃其恩师之孙。刻晴问：「此子何如。」吏曰：「善算。」刻晴曰：「遣之北境。」语毕，以朱笔圈之，圈重而破纸。书院在玉京台东，法令张于门左，榜下童子环读，有喜者，有默然者。"
 KQP_The_Iron_Prefectorate:"街市无声靴声重"
 KQP_The_Iron_Prefectorate_desc:"行署既立，凡异议许书于纸，不许出于口。街市之上，惟闻巡队靴声，踏石有回响。茶肆旧有议政之席，至是并桌亦撤。刻晴出巡，市人见之皆俯首，无一人仰视。归署后语从事曰：「吾得秩序矣。」从事称贺。刻晴曰：「然吾不敢问，此秩序之中，尚存几分吾初意。」从事不能对。行署设于璃月港城西，街市之上惟闻巡队靴声。"
 KQP_Requisition_All_Ores:"矿灯委地怨新令"
 KQP_Requisition_All_Ores_desc:"征矿之令下，井口设卡，凡出矿者皆须过秤，私藏者论罪。有老矿工当众掷其灯于地，灯碎火灭，指干部曰：「吾逐帝君，非为换一东家。」语毕，四顾无人应，亦无人举其名。是夜有吏以其语录呈上，途中遇同僚，二人相视，遂藏其纸于袖，终不上闻。矿灯之碎片，次日犹在井口。井口之卡设于黑岩厂，矿灯之碎片次日犹在地上。"
 KQP_The_Silent_Qixing:"七星列坐但用印"
 KQP_The_Silent_Qixing_desc:"七星犹在，议事厅犹开，惟不复议。每日辰时入座，酉时散，所事者用印而已。文书自门外递入，一人读其目，余人颔首，印落如雨，声密而轻。有年少书吏问一老星：公等不议乎。老星曰：「议者已在他处。」刻晴偶过厅外，闻印声，驻步少顷，遽行，如避一物。七星入玉京台议事厅，文书自门外递入，印落如雨。"
 KQP_Neon_Purge:"一夜削去三分将"
 KQP_Neon_Purge_desc:"整肃之夜，军官名册少三分之一。被收者之中，有数人昔在刻晴帐下解刀为誓。捕者至其家，不喧，叩门三下，门外立待。有校尉自解佩刀授之，曰：「此刀曾为城出鞘，今还于城。」刑者手颤，令状却书得极整。天明，刻晴如常视事，批文如常。无人能自其色辨其昨夜是否合眼。夜半之玉京台无人提灯，阶上足迹至晓犹存。"
 KQP_National_Works_Corps:"铁轨缝合八区地"
 KQP_National_Works_Corps_desc:"工兵团以铁轨缝八区为一，亦以铁轨自缚于工地。帐幕连营，炊烟不绝，人自卯至戌，惟闻锤声。所筑之路最长、最速、最直，直如一句不容辩驳之令。刻晴往视，循轨行三里，谓团长曰：「诸君劳矣。」团长立正而对，言甚长，刻晴未听完，止之。归车之上，一路无一语，惟轨声续续。工兵帐幕连营于璃月港南，炊烟不绝，锤声彻夜。"
 KQP_The_Unanswerable_Question:"老教员门前一问"
 KQP_The_Unanswerable_Question_desc:"书院停办，门加封条。一老教员立于门前提问：「不许人持异议之共和国，尚可谓之共和国乎。」问毕，无人应。适刻晴至，闻言驻步。教员候之，刻晴张口者再，终无一字，遂去。是夜日记中只书此问，不书己答，纸末有一墨点，浓而滞，如笔久悬不下。封条贴于玉京台书院门侧，老教员立门前提问，无人应。"
 KQP_Perpetual_Tutelage:"托言待尔长成日"
 KQP_Perpetual_Tutelage_desc:"监护之制颁行，其文曰：「待璃月至成熟之日，当归其政。」成熟之日者，无人能指其实。刻晴于文书措辞，斟酌良久，初欲书还政，继改归政，终定监护。或问三词之异。曰：「还者，物归其主；归者，主尚未立；监护者，主在吾手而名曰未立。」问者默然。刻晴不复言，取稿自阅，凡三改其字。监护之制颁于玉京台，其文曰待璃月至成熟之日。"
 KQP_The_Benevolent_Iron_Fist:"绒布裹拳仍是拳"
 KQP_The_Benevolent_Iron_Fist_desc:"铁拳之外，裹以绒布。绒布者，减税一、抚恤二、赈济三。市人初受之，以为德政；受之既久，乃觉其手仍在。有老妇于赈所领米一斗，问吏曰：「此米出何处。」吏曰：「官仓。」老妇曰：「官仓之米，亦吾辈所种。」吏不能对，多予一升。老妇不受，取斗而去。刻晴闻之，命勿追。赈所在璃月港城南，领米者列队，队尾至巷口。"
 KQP_Burning_the_Sand_Castle:"亲手推倒案上沙"
 KQP_Burning_the_Sand_Castle_desc:"案上置沙堡一，为幼童所作，有门有楼，以小旗插其顶。刻晴视之良久，伸手自其侧推之，沙散于案。左右皆惊，无一人敢问。刻晴以指拂案上残沙，曰：「潮水早晚必至，不如先自平之。」言毕，又曰：「吾所言者璃月，亦言吾身。」曾有信万事可重垒之日，今不复信。遂命取帚，自扫其案。沙堡置于玉京台案上，推之而散，残沙留于案面。"
 KQP_Last_Statute:"终章律三易其字"
 KQP_Last_Statute_desc:"终章律成于深夜，署中惟余一灯。刻晴草其末条，一改而删，再改而添，三改乃定。左右请其速，曰：「此纸将与人共见，不可有一字含糊。」既毕，掷笔于案，曰：「吾留此一卷，欲后世知吾辈亦曾用力。」侍者问：「此为罪证乎，为赦书乎。」刻晴视灯良久，曰：「或皆为。」灯花爆一声，二人皆不语。终章律成于玉京台深夜，署中惟余一灯，灯花爆一声。"
 KQP_Question_the_Gods:"独入空殿问一夜"
 KQP_Question_the_Gods_desc:"神殿空，香炉冷，神位前烛已尽。刻晴独入，就帝君之位坐于阶。先问：「昔年君视吾辈，亦如此乎。」又问：「君早知有今日乎。」问至数十，殿中惟回声。夜半风入，幡动，影摇于壁，若将答者，终无答。天将明，刻晴起，整衣，向神位再拜，为一礼，非祷也。出门时语守者曰：「此殿可改他用。」神殿在玉京台西，香炉冷，神位前烛已尽，阶上苔厚。"
 KQP_Broken_Contract:"拾得残契藏怀中"
 KQP_Broken_Contract_desc:"帝君既殁，所裂者非止一契，亦裂众人心中秩序二字。署中旧契尽出，纸多断烂，风过则飞。刻晴于阶隅拾得一片，上存四字：「永不变更。」字为旧体，墨已淡。视之良久，忽笑，笑甚短。乃以帕裹之，纳于怀。或问：「留此何为。」曰：「他日若有人言契约可永，吾以此示之。」旧契尽出于玉京台署中，纸多断烂，风过则飞。"
 KQP_The_Chasm_Garrison:"遣一军入渊不出"
 KQP_The_Chasm_Garrison_desc:"层岩巨渊之下，有物呼吸，其声比内战尤古。刻晴择军中最为亲信者一旅，遣之下井，令只一句：「地上无论打成何样，尔曹不许出。」旅帅受令，问几时可出。刻晴不答。旅帅再问。曰：「待吾死，或待此渊闭。」军遂下。其后名不入册，粮不列簿，惟每月有车一乘，载油与盐，入山而不返。"
 KQP_Oceanic_Vigil:"海防灯火彻夜明"
 KQP_Oceanic_Vigil_desc:"漩涡魔神之旧说，犹压老渔人之梦。每岁风起，必有老舟不归。刻晴命重立海防，塔十二，烽燧相连，昼夜举火。有言费重者，刻晴曰：「璃月之海，不当由他人代守。」塔成之日，一老渔人携孙登塔，指远海曰：「昔有灯灭处，吾兄死于彼。其孙问：今灯不灭乎。」老者曰：「今有人守。」海防塔十二座列于云来海岸，烽燧相连，昼夜举火。"
 KQP_War_On_Three_Fronts:"三线烽火同时起"
 KQP_War_On_Three_Fronts_desc:"北面山，东面海，中间为裂而不可复合之隙。三处烽火同日而举，报者接踵入署，一纸未毕，一纸又至。刻晴立沙盘前，手按盘沿，久不移步。参谋问先救何线。曰：「先救最不要紧之一线。」参谋愕然。刻晴曰：「要紧者早已不由我救，救其不要紧者，犹可少死数百人。」沙盘置于玉京台中军厅，手按盘沿，久不移步。"
 KQP_Whispers_From_Snezhnaya:"至冬使者索一港"
 KQP_Whispers_From_Snezhnaya_desc:"至冬使者至，出合约一函，价目一款：但得一港，可使璃月复明。其言温，其纸厚，其条款留后手数处。刻晴读两遍，置案上，问曰：「贵国之雪，化后作何色。」使者不解，曰：「雪化则水，水无色。」刻晴曰：「吾所闻者不然。」使者默然。合约终未署，留于案上，次日取去。至冬合约留于玉京台案上，次日取去，案面余一痕。"
 KQP_Reunify_Liyue:"城复旗新名半失"
 KQP_Reunify_Liyue_desc:"内战既毕，刻晴登城头。墙已修，旗已易，而城中名册少其半。风自海上来，挟咸气，吹旗作响。刻晴倚堞而立，久无一言。从事请其下，不应。至日昃，乃曰：「光复非旧观之还，乃带伤而行。」语毕下楼，过市，市人识之者渐多，有呼其名者，亦有闭户者。刻晴皆应，皆不辩。刻晴倚堞立于璃月港城头，风自海上来，吹旗作响。"

 KQP_civilwar_category:"变革之尺"
 KQP_civilwar_category_desc:"玉衡之府，内战诸决尽聚于此。变革之尺两轴并行，一主革新，一主秩序，每决一事，轴必移，级亦随改。战事未定之日，取舍之间，只在快一步与稳一分；而新政权将以何面目立于人前，亦在此一笔一笔写定。"
 KQP_decision_reform_ruler:"尺量人胆"
 KQP_decision_reform_ruler_desc:"一尺在手，所量者，决心也。每推进一事，便近那新璃月一步。然旧制不肯无声而退，其重如铅，尽压于向前迈步者之肩。刻晴执尺，量人之胆，亦量己之忍，量至尺端发烫，仍不肯缩手。量尺藏于玉京台书案抽屉，铜制，边角已磨圆。"
 KQP_decision_draft_militia:"街巷授兵"
 KQP_decision_draft_militia_desc:"每一街皆须有人守。所募者，邻人也，船工也，卖豆腐者之子也。或谓：「令常人执兵，危事也。」刻晴曰：「令常人永待他人来护，方为真危。」兵器发下之日，街坊相顾，无一人先取。末乃一妇人出，伸手取刀，却不看刀，只看众人。众遂各取一械，默默而散。兵器发下于南码头仓前空地，地以石铺，石缝生草。"
 KQP_decision_seize_granary:"封仓问粮"
 KQP_decision_seize_granary_desc:"仓之钥，从来不在最饿者之手。查封士绅囤粮，一举两伤：一面以粮归民，一面推士绅尽入对面。新米之香里，杂有背主之气。刻晴曰：「仓开之日，吾不惧人恨，只惧人饿。」囤粮之仓在璃月港城东，屋三间，门以铁包，锁凡五具。"
 KQP_decision_scholar_registry:"造册录士"
 KQP_decision_scholar_registry_desc:"新政须用人，而旧文人未必肯为他人执笔。吏请造册。刻晴曰：「册上一名，可成一纸告密，亦可成一纸檄文。」吏问：「然则先问其旧主乎。」刻晴曰：「不必。只问其肯不肯动笔。」册成，应者三十七人，其二十七人自书「愿试」二字。余十人观望，刻晴亦不催。名册以厚纸，一行记一人，藏于玉京台东廊架上。"
 KQP_decision_propagate_reform:"遍说新约"
 KQP_decision_propagate_reform_desc:"口号不能填腹，却能入心。宣讲之队遍行八区，以「契约属民」一语，反复说于码头、茶肆、田头。听者或信，或只听，然一人传一人，种便入土。刻晴曰：「不必人人信，只须人人说得出口。」宣讲之队自南码头起，沿街至绯云坡，一日行八里。"
 KQP_decision_crackdown_riot:"三呼后枪"
 KQP_decision_crackdown_riot_desc:"上街者之中，有敌，亦有饿者。镇压者，最速之法，亦最钝之法：街市静，怨却沉得更深。刻晴下令：先呼三遍解散，乃许放枪。又命枪口抬高一寸，非不得已，不向人。巡卒列于璃月港南市口，枪口朝天，不向人。"
 KQP_decision_national_service:"一营同釜"
 KQP_decision_national_service_desc:"国乏人，亦乏一种同气之实。征召服役者，既补行伍，亦使不同出身、不同立场之少年同处一营，同食一釜，渐改「我」而称吾辈。营中先教同食，后教同战。新兵营设于璃月港北，营外即田，田边有屋，屋中有妇子。"
 KQP_decision_enlist_adepti:"邀仙出山"
 KQP_decision_enlist_adepti_desc:"仙家未必皆忠旧制。散仙久厌人间之争，只欲寻清静处修行。刻晴所递者，非索其效忠，只愿其不立于对面。有接者，有冷笑者。凡接者，许其不入朝，不拜，唯战时出一手。散仙所居在绝云间，云来则隐，云去则见其檐一角。"
 KQP_decision_chasm_survey:"入渊绘图"
 KQP_decision_chasm_survey_desc:"层岩之每一寸，皆刻有比王朝更古之文字。测绘者携归者，非独图也，尚有一警：深渊之气，比内战更古，亦更饥。有墙为敌而筑，亦为己而筑。测者留言曰：「图可补，墙不可悔。」"
 KQP_decision_proclaim_republic:"礼毕开仓"
 KQP_decision_proclaim_republic_desc:"共和二字，写之只两笔，立之须一代人。宣告之日，礼毕，刻晴令撤乐，却先开仓。左右问：「今日大典，何先及仓。」刻晴曰：「民闻钟鼓而不知仓中有米，则今日之典，明日即忘。」仓门既启，米气出街，众乃欢呼，声比钟鼓更大。仓在璃月港城东，门既启，米气出街，市人闻之皆回头。"
 KQP_decision_envoy_to_ganyu:"使者赴月海亭"
 KQP_decision_envoy_to_ganyu_desc:"月海亭檐角犹挂未化之霜。使者携两物而去：一为许八省自治之文书，一为一小包璃月新米。附言曰：「政见可异，饭总须同食。」甘雨受米，不受文书，曰：「米留下，书再看。」"
 KQP_decision_envoy_to_ningguang:"使者赴天权"
 KQP_decision_envoy_to_ningguang_desc:"凝光之浮空金库仍悬于港上，如一头不语之巨兽。使者归，携一纸清单，细至每一摩拉。刻晴视之久，曰：「她问吾，革命可算得出账否。」左右不敢应。刻晴却笑曰：「此非讥也，乃试也。答得出，则吾辈可与共立此城；答不出，则吾辈不过又一伙分金之人。」使者自群玉阁归，阶九级，级面磨滑，雨则缓步。"
 KQP_decision_envoy_to_shenhe:"使者赴绝云间"
 KQP_decision_envoy_to_shenhe_desc:"绝云间之雪从不落地。使者在山门立三日，方得一句回话：仙凡殊途，各安其位。刻晴诵两遍，取笔于回执只书一字：好。左右问可须再遣。曰：「不必，此一字已足。」"
 KQP_decision_envoy_to_childe:"使者赴云来海"
 KQP_decision_envoy_to_childe_desc:"公子之船队泊于港外，炮口正对璃月之天。使者登船，甲板上却设一席酒。达达利亚笑曰：「吾非来战，乃来为商，唯吾之商，不用钱。」使者归报，刻晴曰：「此人可惧，亦可谈。」其船泊于云来海外三里，潮落可见船底附螺，螺壳色青。"
 KQP_decision_envoy_to_lanyan:"使者赴沉玉谷"
 KQP_decision_envoy_to_lanyan_desc:"沉玉谷藤编之师蓝砚，久不见官府之人。使者携茶种一包上山，为所拒于篱外，宿于石上。次日视之，其种已栽院角，旁置清水一盂。使者归报。刻晴笑曰：「既种之，便是回了。此人可以理说，不可以令驱。」"
 KQP_decision_proclaim_the_twelve:"十二方共召"
 KQP_decision_proclaim_the_twelve_desc:"向十二方同发一纸，旧敌、旧友、观望者皆在其中。谋士谏曰：「敌未服而先邀之，是示弱也。」刻晴曰：「容不下反对者之共和国，尚不配称共和国。」书发，应者九，不至者三。刻晴不怒，却命人于席上为不至者留三位，位上空设杯箸，终席不撤。十二席设于玉京台正厅，空设三席，杯箸不撤，终席如故。"

 LYY_Event.2001.t:"刻晴夜登玉京台"
 LYY_Event.2001.d:"请仙典仪既毕三日，玉京台钟声未歇，刻晴已登城楼。初无宣言，亦无甲士，惟于壁上大书曰：「璃月之命，当自书之。」钟止而纸出，未及日中，已传于码头、茶肆、田塍之间。少年争抄，纸为之贵；老者读竟，掩卷而叹。亦有阴持一纸归家，藏诸箱底者，人问之，则曰留作他日之证。市井小民不识其义，但闻此纸可换一命，遂藏之如契。亦有黠者摹其笔迹，印售于市，三日之间得钱数千。\n是夜城分两色，畏明日者闭户，盼明日者燃灯。千岩军巡于街，见灯不诘，见户不问。有老兵立巷口，语其徒曰：「此非乱也，乃换世。」徒问：「换世者谁为之主。」老兵指台上灯影，久而不答。\n后三日，七府文书始下，语多含混，无一字斥其非，亦无一字许其是。观者遂知其势已不可回。玉京台石阶九级，是夜无人添灯，影子自短而长。"
 LYY_Event.2001.a:"传檄于全城"
 LYY_Event.2001.b:"压之，先定局面"
 LYY_Event.2002.t:"千岩将校投名状"
 LYY_Event.2002.d:"千岩军少壮将校联名投状，愿受新制。状中所陈，不为饷，不为阶，但言不愿复向不觌面之神行叩首之礼。老将军受状，默然良久，亲解佩刀置于案上，语众曰：「吾辈守璃月三千年，所守者城也，非神也。今日谁为城言，吾辈即为之戍。」\n言未毕，堂下皆起，刀鞘相击，声如连雨。有少年校尉趋前问曰：「将军既如此，若他日新主亦不恤城，当如何。」老将军曰：「则吾辈再解此刀。」众皆默然，而后有笑者，有泣者。一老卒抚刀而哭曰：「此刀随吾三十年，今夕始觉其重。」旁有文吏执笔为记，书至第三行，腕亦微颤，乃搁笔少憩，而后续书。\n翼日，新旧两营并立于校场，旧徽已去，旗号未定。日暮收操，两营各归其垒，营门相望，灯火相照，竟无一人喧哗。校场倚天衡北麓，墙石取诸本山，雨后作青。"
 LYY_Event.2002.a:"全数接纳投诚军官"
 LYY_Event.2002.b:"只留精锐，余者遣散"
 LYY_Event.2003.t:"士绅闭户锁账簿"
 LYY_Event.2003.d:"檄文出三日，城中富室十一家同日下闩。不聚谈，不通书，惟各于门内落锁，锁声相闻。有好事者叩其门，问何以闭户，门内应曰：「账簿未清，不敢出门。」问者笑曰：「账簿与人何干。」内不应。\n刻晴命吏往观，还报曰：「某家昨夜运箱三具出后门，箱重，四人方举。」刻晴曰：「箱中所载，非银即契。」吏问追否。玉衡曰：「不追。彼匿其契，正欲自守，守之愈密，则与我愈远。」\n月余，米价腾贵，闭户者先开其一。开者持契至官署，请以田易粮。署吏受契，验之，契上之年号犹是旧历。吏以笔圈其年号，语之曰：「此纸今日只作废纸看。」其人默然，立于阶下良久，乃抱契而退，行数步，复回身问曰：「然则田归谁。」吏曰：「归耕者。」其人曰：「此契在我手三十年。」吏曰：「今以三十年之契，换三日之粮，君自择。」其人低头视契，以指抚其上朱印，久乃去。行至街口，忽以契投入沟中。路人视之，无一人俯拾。此街在玉京台下，铺门一闭，街声顿空，惟闻远处潮音。"
 LYY_Event.2003.a:"强征士绅粮仓"
 LYY_Event.2003.b:"与士绅谈判，换取支持"
 LYY_Event.2004.t:"黑岩厂炉前待价"
 LYY_Event.2004.d:"黑岩厂不举旗，亦不闭炉。工头立于炉前，语两使曰：「谁能保此火不熄，吾辈即听谁。」二使各出所许：一许煤，一许粮，一许订单。\n工头不答，但使少年往观炉口，视火色。火色青，则煤足；火色黄，则煤将尽。是夜两使皆宿厂外，席地而坐。厂中锤声彻夜不绝。有老工人过而语其徒曰：「你看那两位，皆言为我辈而来，而无人问一句炉子几时该修。」\n天明，工头取一纸，书三事于上：煤、粮、修炉之期。置诸案，曰：「三事俱足者，吾与之言。」两使相顾，皆不能尽应。由是厂中不附一方，而两方皆不敢慢厂。\n越五日，厂中出铁一炉，工头命铸犁三十具，送于城郊农人，不取直。两使闻之，皆遣人来问其故。工头曰：「炉火不熄者，非为铸兵。」使者还报，两方皆默然。自是厂门之前，使者不复排队，而改送煤粮于门侧，书其数于木牌，任厂中自取。炉后即层岩来路，运矿之车昼夜不绝，车辙深三寸。"
 LYY_Event.2004.a:"承诺保住炉火与订单"
 LYY_Event.2004.b:"强令黑岩厂为革命赶工"
 LYY_Event.2005.t:"仙人遣使问玉京"
 LYY_Event.2005.d:"仙人遣使至玉京台，衣白，不带兵。入见，不拜，亦不坐。问曰：「帝君骨未寒，君欲尽拆其所立之规矩乎。」刻晴不起，行至窗前，指远处琉璃曰：「此光昔年满城可见，今已不照人矣。」\n使者曰：「光之明暗，岂在琉璃。」刻晴曰：「然。」在受光者。使者默然。有顷，使者又问：「君所恃者何。」玉衡曰：「所恃者，此城之人尚肯开口。」使者曰：「开口者未必能任事。」刻晴曰：「不开口者，必不能任事。」\n使者取袖中一简，置案上，曰：「此绝云间诸仙之名，君若欲绝之，尽可一笔勾尽。」刻晴视简良久，不启，亦不还，但使吏收入库中，题曰未决。使者出门，行数步，回望台上灯火，语从者曰：「此人不可逼，逼之则城与我绝。」\n其简在库，凡三月无人启。一日掌库者拂尘，见简上封泥完好，语其徒曰：「此物未启，则事未了。」徒问：「几时启之。」掌库者曰：「待台上人死，或待台上人悔。」使者归时取道庆云顶，云在脚下，一路未回首。"
 LYY_Event.2005.a:"耐心解释，不强求"
 LYY_Event.2005.b:"当即驳仙家之问"
 LYY_Event.2006.t:"七星残党夜出城"
 LYY_Event.2006.d:"七星残党夜出南门。车三乘，箱半车，私兵一队，约百人。门吏验其符，符是真符，遂不能阻。哨卒按枪不语，目送其过。\n有少年卒问队长曰：「何以不击。」队长曰：「击之，则城中今夜必乱。」少年曰：「乱而后定，不亦可乎。」队长曰：「定者谁。」少年不能对。\n队长复曰：「汝有父母在城乎。」少年曰：「有。」队长曰：「我亦有。」\n车过桥时，一箱倾，契纸散于道。私兵俯拾，拾之不尽。有早起卖浆者拾得一纸，视之，乃某乡之田契，契上有名，名下有手指印。卖浆者不识其字，持归，以纸裹酱瓶。天明，刻晴闻之，不问逃者，但取散契收之，凡得四十七纸。命吏录其名，曰：「此四十七家之田，自今勿问其旧主。」吏问：「其人若归。」刻晴曰：「归则还之，不归则耕者有其田。」后数年，有逃者归，无契，署吏验其名于册，与之田三十亩。其人跪于阶，问：「何以知我。」吏曰：「册上有君之名，名下有一指印。」南门官道接荻花洲，道旁荻花正白，车过则伏。"
 LYY_Event.2006.a:"追击残党，杜绝后患"
 LYY_Event.2006.b:"纵之使去，以免激变"
 LYY_Event.2007.t:"档案库夜半火起"
 LYY_Event.2007.d:"档案库火起于子时。火自西廊始，西廊所积，皆旧契与讼牒。守库老吏先觉，呼救不及，独抱一柜出，柜中皆名册。\n救火者至，火已及梁。众人所抢者非金银，乃一摞摞契书。有吏抱契而出，衣角已焦，犹以袖护其面。有少年欲入取印，为老吏所止，老吏曰：「印可再铸，名不可再生。」\n火至天明方熄，库存其半。刻晴立于灰中，取一纸，纸边已卷，上有一名，名旁注曰：「欠租三年，以女抵。」刻晴视之良久，以手拂灰，语左右曰：「录之。凡纸上有名者，尽录。」吏问：「录之何为。」玉衡曰：「此城之籍也。」前朝以籍治人，今日以籍还人。\n老吏抱柜立于阶下，衣焦，须亦焦。刻晴问：「柜中何物。」老吏曰：「名册。」刻晴曰：「何册最要。」老吏曰：「逃户册。」玉衡曰：「逃者何以要。」老吏曰：「逃者尚在，册在则人可寻。」刻晴乃命以车三乘载柜入署，老吏随之，行至半途，回望火场，忽跪而拜，拜毕不起。库在玉京台西偏，檐下旧有石缸四口，水皆冻。"
 LYY_Event.2007.a:"彻查纵火案"
 LYY_Event.2007.b:"尽封旧档"
 LYY_Event.2008.t:"荻花洲米价三倍"
 LYY_Event.2008.d:"面粉三倍于旧价。天未明，队已自街角绕至码头。队中无声，惟闻鞋底擦石。\n有馒头师当门而立，一妇问曰：「何以贵至此。」师曰：「麦在仓，仓在城外，城外在打。」妇曰：「几时能平。」师曰：「不知。」妇抱子退，子啼，妇以手掩其口，低声曰：「勿啼，再等等。」\n队末有一老兵，负担而立，自辰至午，未曾前移一步。旁人不平，欲让其先，老兵摇手曰：「吾不买。」问其何为，曰：「吾来看这队人还肯不肯排。」\n刻晴微服至，立队外，久之，无一言。还署，命开常平仓三处，限每户一斗，以市价之半售之。吏曰：「仓粮不足三月。」刻晴曰：「三月之后再议三月。」是夜，仓前灯火通宵，无人争，亦无人哗。至暮，有妇以半块馒头置于仓阶，不知与谁，亦不留名。米自荻花洲来，舟至望舒而泊，泊处水浅，须人负米过滩。"
 LYY_Event.2008.a:"低价放粮，稳住民心"
 LYY_Event.2008.b:"价照常，先顾库"
 LYY_Event.2009.t:"矿工持灯叩厅门"
 LYY_Event.2009.d:"矿工数百，持矿灯列于议事厅外，自午至暮，不呼不哗。灯次第而燃，暮色中如一条长火。\n为首老匠捧一碗水，直至阶前，双手举之，语署吏曰：「请以此水呈上。」吏曰：「此何意。」老匠曰：「吾辈不识几个字，只知掘井及泉，井井同源。」\n吏捧水入。刻晴受之，置于案，未饮。堂上诸人相顾，亦无一饮者。水在案上，历一夜，面上一层薄尘。\n翼日，刻晴出，立阶上，语众曰：「矿脉归城，不归私家。」工时以八时为限，违者罚其主。众不欢呼，老匠但以手按其灯，灯焰一矮。有少年工在后问曰：「今日之后，吾辈算何人。」玉衡曰：「算此城之主。」少年曰：「主人何以仍要下井。」刻晴不能答。堂下寂然，惟灯花爆了一声。\n老匠退至阶下，以空碗还吏，曰：「此碗请留。」吏曰：「一碗何用。」老匠曰：「他日议矿脉者，见此碗，当记今日有人捧水而来。」灯油自层岩矿上分得，一盏可燃一夜，矿工皆习其味。"
 LYY_Event.2009.a:"接受请愿，改善矿工待遇"
 LYY_Event.2009.b:"驱散之，先保炉火"
 LYY_Event.2010.t:"军官团秉烛密议"
 LYY_Event.2010.d:"军官十余人，秉烛密议于偏厅，至夜分不散。一人按案曰：「与其待议会终日争吵，不如使枪先言。」众有应者，有默者。\n烛花爆，火一晃，满壁人影皆动。年少者面赤，老者闭目。有一校尉起而曰：「诸君所言，皆为城。然枪一举，则此后凡不合者，皆可以枪去之。今日去人，明日人去我。」言毕，座中无人接。有顷，一人低声曰：「然则坐待乎。」校尉曰：「坐待亦一法，只是慢。」\n刻晴闻之，取名单阅。名单三十七人，前列数名，皆曾从她守过城门者。刻晴援笔，批四字于纸末：再思三日。封而还之，不召一人来见。三日后，无人再提此事，然名单上有一人自请外调，行前留书一纸，书曰：「非怨，恐不能自持。」玉衡得书，不遣人追，惟取其名，注于册末，曰：「此人可再用。」是夜，有一人立于刻晴门外，至三更，终不叩门。偏厅窗临天衡，夜深可闻山涧，水声细而长。"
 LYY_Event.2010.a:"安抚军官，暂缓军议"
 LYY_Event.2010.b:"默许军官主张，加速行动"
 LYY_Event.2011.t:"凝光书至玉京台"
 LYY_Event.2011.d:"凝光书至，纸厚而滑，封以蜡，蜡上有群玉阁印记。启之，只一行：「君欲焚旧屋，勿忘己亦居其中。」\n刻晴读三遍。取笔欲答，墨已蘸，笔悬于纸上，久不下。侍者换烛二次，纸上仍空白。乃语侍者曰：「取旧日同席之名簿来。」簿至，翻至第七页，有凝光之名，旁注二字：「能算。」刻晴指之，笑曰：「此二字，当年吾所批。」侍者问：「娘子何故不即答。」玉衡曰：「她所言，我早已想过。答之则成争执，不答则她自知我已知。」\n遂作书，只四字：「知之谢君。」封讫，复拆，于纸尾添一行：「屋焚之后，尚需一人算账。」封而遣之。使者出城，回望玉京台，语同行曰：「台上灯未熄，而窗已闭。」二人相交十年，至此始有隔。书发三日，群玉阁遣人送账册一卷，无书，惟于册面书二字：「先算。」群玉阁所用蜡掺石珀屑，故色黄而坚，指按不留痕。"
 LYY_Event.2011.a:"回信与凝光坦诚相商"
 LYY_Event.2011.b:"置之不答，专治内政"
 LYY_Event.2012.t:"甘雨寄来八省账"
 LYY_Event.2012.d:"甘雨寄账一册，牛皮为皮，线装四孔。扉页一行小楷：八省之粮，仅足支至下次大潮。\n其后页页皆是数。某仓出米若干，某船载若干，某吏领若干，旁注日期，日期之后复注天气。刻晴翻至末页，见夹枯叶一片，叶薄如纸，色已转褐。刻晴问送账之人：此叶何来。答曰：「甘雨大人少时初学记账，以此叶为签，用毕即夹于册中，至今未弃。」吏在侧问：「账上之数，可尽信乎。」玉衡曰：「此人记数，从不算零。」吏曰：「何以故。」刻晴曰：「零者可隐，故不记。」吏曰：「既算零，则数不全。」刻晴曰：「数不全者，正可问。」\n玉衡执叶良久，复夹之，语左右曰：「此册勿抄，勿改，原册存库。又命人取新册一本，自书扉页：璃月民食志，第一卷。」左右问：「此后谁记。」刻晴曰：「我记。」日一行，不虚。是夜，刻晴取枯叶置于灯下，于叶背书一行：「某年某月，得甘雨账。」书毕，复夹于册中，合册而寝。册角有月海亭骑缝印，印文半缺，盖用久磨损。"
 LYY_Event.2012.a:"回信甘雨，共商粮政"
 LYY_Event.2012.b:"以账论账，不为情屈"
 LYY_Event.2013.t:"台前两造大对辩"
 LYY_Event.2013.d:"台前设两席，一席在阶上，一席在阶下。阶上者主缓，阶下者主急。自辰至申，辩者六人，听者塞途。\n主急者曰：「今日不废仙权，则明日无人信此会。」主缓者曰：「今日废之，则明日无人能治。」主急者曰：「治者可在废之后。」主缓者曰：「废者不可在治之前。」两造往复，声渐高，而不出一恶语。阶下有听者以炭记言于壁，记至半，炭断，遂以指蘸灰续书，灰尽而字犹存。\n刻晴坐末席，自始至终不与辩，但录其言。录至中段，笔忽停。旁有吏问：「何以停。」刻晴曰：「二人所言，皆吾昔所言者。」\n日暮风起，纸为风卷，满场追纸。及纸复聚，人已散半。玉衡合册，抚其面，语左右曰：「此册所载，非是非，乃两难。」左右问：「然则将何从。」刻晴曰：「从少数能自持者。」玉京台下听者自石阶排至街口，卖浆者就阶而坐，一日得钱三倍。"
 LYY_Event.2013.a:"以择付之众人"
 LYY_Event.2013.b:"由自己拍板定夺"
 LYY_Event.2014.t:"案头沙堡喻危局"
 LYY_Event.2014.d:"刻晴取沙一捧，以水和之，于案上筑小堡。有门，有墙，有塔，塔高三指。筑毕，语座中曰：「此即璃月港之旧日。」\n座中皆不解，有问者曰：「此何意。」刻晴不答，但开窗。海风入，堡之西角先塌，沙粒落案，簌簌有声。玉衡曰：「潮不问堡。」众默然。\n有老者起曰：「既知潮至，何不迁堡于高处。」刻晴曰：「高处亦有潮。」老者曰：「然则筑之何为。」刻晴曰：「筑之者，人也。」潮至而堡毁，人犹在。众复默。\n玉衡以指推其余沙，尽归于案角，曰：「今日所议，非保此堡，乃保筑堡之人。」言毕，取巾拭手，指缝间沙未净。是夜值事者入收拾，见案角沙堆尚在，不敢扫，以纸覆之，压以镇纸。有吏私记之，记曰：「堡塌于风，非塌于潮。」刻晴闻其所记，曰：「此记未错，只是未完。」沙取港外滩头，色白而粗，干则散，不能久持。"
 LYY_Event.2014.a:"坦然接受沙堡之喻"
 LYY_Event.2014.b:"斥责悲观，鼓舞士气"
 LYY_Event.2015.t:"激进者围议事厅"
 LYY_Event.2015.d:"激进者数百，围议事厅，火把百支，窗纸尽赤。为首者叩门，声急，曰：「仙家法权，今日不废，更待何时。」\n门开，刻晴出，立阶上，不携兵。众稍静。刻晴曰：「诸君急，我怕。」众哗。玉衡举手止之，曰：「诸君急者，恐来不及。我惧者，惧吾辈急至自变为所反对之人。」为首者曰：「何以知之。」刻晴曰：「看诸君今夜之火把。此火可照路，亦可焚屋。」持之者谁，焚者即谁。\n言毕，众无应。有顷，一支火把落地，踏灭之。俄而第二支，第三支。火尽而月出，阶下人影长长。阶上灯一盏，始终未动。\n刻晴乃曰：「三日后开议，诸君各举二人入席。」为首者问：「若议而不决。」玉衡曰：「再议。」众散，无一出声，惟闻履声远去，渐与潮声相混。是夜厅中议事至四更，无一火把再举。火把所用松脂出绝云间山脚，烟浓而黑，久聚不散。"
 LYY_Event.2015.a:"安抚激进派，引其归正"
 LYY_Event.2015.b:"强硬取缔激进组织"
 LYY_Event.2016.t:"旧军官联名上书"
 LYY_Event.2016.d:"旧军官四十余人联名上书，请缓一切新政，先保军不散。书末附一句，字迹与签名不同，似另有人代书：「乞缓数月。」\n刻晴受书，不即答。置诸案头，夜不成寐。三更起，取书复读，读至乞缓二字，指停于纸上，久之，移灯近纸，视其墨色，曰：「此句非武人所书。」\n诘朝，召为首三人入。刻晴曰：「诸君所求，数月之缓乎，数年之缓乎。」三人相顾，一人对曰：「求缓至军心可安。」玉衡曰：「军心安于何。」对曰：「安于饷不缺，令不更。」刻晴曰：「饷可给，令不可不更。然更令必先告，不先告而更，吾之过也。」\n三人出，面色稍舒。刻晴命吏：凡易军令，先下军中文书，三日而后行。又于书末自批一行：「此辈非梗，惧也。」惧者不当以力压，当以信结。书还，三人中一人跪谢，玉衡不受，曰：「谢则成恩，我非施恩者。」校场在玉京台北，书用军营旧纸，纸角有火印，印色已褪。"
 LYY_Event.2016.a:"接纳保守意见，稳步推进"
 LYY_Event.2016.b:"压下上书，全速改革"
 LYY_Event.2017.t:"空厅独坐夜三更"
 LYY_Event.2017.d:"夜分，议事厅空。刻晴独坐，案上灯一盏，公文三叠。窗外钟鸣，自一至十二，声落而无人应。\n刻晴自语曰：「吾所为者，是释其缚，抑代其决。」语毕，四壁寂然。起而取镜，镜中面有倦色，鬓边有一丝白，不知何时生。复坐，援笔书于纸：代决者，虽善亦僭。书毕又涂去，涂至纸破。\n乃吹灯。灯灭而月色入，案上纸白如霜。玉衡立良久，复燃灯，取他纸，书三事：一，凡涉民食者，必问于市；二，凡涉军令者，必告于军；三，凡涉废立者，必议于会。书毕，压于砚下。\n翼日吏入，见砚下有纸，呈上。刻晴视之，曰：「此非令，是我自缚之绳。」留之。是日复书一行于纸末：无解者，非无答，乃答在其后。书毕，以灯照之，读一遍，吹灯。窗外钟已三鸣，东方有白意。厅外即玉京台，台上风大，灯焰偏而复正。"
 LYY_Event.2017.a:"承认困惑，与本心和解"
 LYY_Event.2017.b:"扪心自问，仍向前行"
 LYY_Event.2018.t:"两途并出不复交"
 LYY_Event.2018.d:"两道既分，各立旗帜。一道在阶上，一道在阶下。所书皆曰人民，而两旗不并立。\n初分之日，市中犹有往来。越五日，同席者不复同坐。有二人昔共一壶酒，今于街相遇，一人左顾，一人右顾，擦肩而过，各行数步，皆未回头。\n刻晴在高处见之，问左右曰：「此二人昔何如。」左右曰：「同窗，同舍，同守一城。」刻晴曰：「今何如。」左右曰：「各为其道。」玉衡默然。有顷，曰：「道有二，人亦二乎。」左右不能对。\n是夜，刻晴遣人各送一函，函中无字，惟旧日同席之名录一纸，二人之名并在其上。翼日，一人至署，立于阶下，久之不入。刻晴出，与之对揖，皆不言。风过，阶上落叶相逐，终未合一。玉衡回室，取酒一壶，斟二碗，一碗置于对面，至晓未动。两旗各树街之两端，一在玉京台下，一在码头，中间一街冷清。"
 LYY_Event.2018.a:"二途并驰，听其自胜"
 LYY_Event.2018.b:"立即统一路线，避免分裂"
 LYY_Event.2019.t:"抑神敕令下城门"
 LYY_Event.2019.d:"敕令下，城门四处置告。纸用黄，字用朱，押以玉衡之印。观者塞途。\n有拍手者，有垂泪者。一老妇跪于告下，合掌诵经，自午至夜，不去。巡卒欲驱，刻晴止之，曰：「任其诵。」夜半，老妇声渐低。刻晴使人送粥一碗，置于其侧，不言语。\n老妇视粥，不食，诵至天明，乃起，以袖拭面，语送粥者曰：「老身非抗令，只送他一程。」玉衡在楼上闻之，良久不言。\n乃命吏：凡寺庙之旧祀，不禁，不助。吏问：「何以不禁。」刻晴曰：「禁之则成烈士，任之则为旧俗。」旧俗自衰，不必以刀。是月，城中焚香者渐少，而诵经之声仍于每夜自某巷出，至三更而止。有老庙祝欲撤其香案，刻晴止之曰：「留一炉。」庙祝问：「留与谁。」玉衡曰：「留与不肯忘者。」庙祝遂留一炉，香火不盛，而三十年未绝。城门石取天衡，色青，朱字贴其上，雨过犹显。"
 LYY_Event.2019.a:"严颁抑神敕令"
 LYY_Event.2019.b:"给信仰留一线余地"
 LYY_Event.2020.t:"神殿改作童子塾"
 LYY_Event.2020.d:"神殿既归官，改作童子塾。神像未移，工人以布覆之，布上积尘。童子坐于像座之阶，膝上置书。\n日自高窗入，照壁上旧彩，彩已褪，色如败锦。一童子举手问曰：「先生，神见吾辈读书，其怒乎。」先生曰：「神若真神，见汝识字，当喜。」童子又问：「若不喜。」先生曰：「则不神。」座中皆笑，笑声撞壁而回。\n有一老庙祝在门外听之，俯身拾阶上落叶，拾了半晌，终未入门。刻晴后至，不登堂，立于窗外，见童子指书相问，问者三，答者一。\n刻晴语从者曰：「此堂昔日不许人仰视，今日童子在其上打闹。」从者曰：「是否太慢。」玉衡曰：「殿可一日而改，人须一世而改。」是日散学，童子出门，有以手抚神像之足者，抚毕即走，不回顾。老庙祝终入门，取帚扫阶，扫至像前，停帚，以手按其基座，如抚旧人。神殿在玉京台侧，殿前阶石为童子磨滑，中有一道凹，深可容指。"
 LYY_Event.2020.a:"推广世俗学堂"
 LYY_Event.2020.b:"尊重僧侣，暂缓改庙"
 LYY_Event.2021.t:"制宪会议初开席"
 LYY_Event.2021.d:"制宪会议开于月海亭。席上坐者，有匠，有船户，有教习，有旧署之吏。凡九十一人，无一人曾与议国事。\n初开，无人知仪。有争坐次者，有不知如何举手者。第一日议至夜半，仅定一条：凡议，须待言者尽言。\n第二日争船税。船户曰：「我辈出一船之力，税当减。」旧吏曰：「减税则港务无以为继。」争至日昃，有匠起曰：「吾不识税，只知船不修则沉。」众笑，笑已复争。\n第三日议至末条，一人忽起曰：「诸君，吾等所议者，是此后百年之事。」堂中骤静。有老者掩面。刻晴坐末席，自始至终未发一言。散时，有匠问曰：「玉衡何故不言。」刻晴曰：「今日若我言，则明日诸君皆等我言。」会毕，众不起，相顾而笑，如释重负。会散后，有匠取所议之稿，抄一份带归，曰：「使家中妇人亦识之。」亭外一树，叶落满阶，无人扫，踏之有声。"
 LYY_Event.2021.a:"如期开制宪之会"
 LYY_Event.2021.b:"缓之，先清内部"
 LYY_Event.2022.t:"选票刀剑一时至"
 LYY_Event.2022.d:"军中列阵于城外，甲胄相击，声闻于城。城中方设票箱，箱前置案，案上笔十余支。\n有军官在阵前低声曰：「此谓何。其佐曰：此谓让。」军官曰：「让者谁。」佐不能对。投票至日暮，箱封，众目送之入库。阵中有卒闻之，以手按其刀柄，久之乃松。\n是夜，刻晴至军中，不登台，行于队列之间。有卒问曰：「今日不流血，可乎。」刻晴曰：「今日可。」卒曰：「明日。」玉衡曰：「明日再争。」军官前曰：「军中有言，此为软弱。」刻晴曰：「软者不断，我今日断了。」军官默然。\n回署，刻晴取纸书一行：「某年某月，以票代刀，事成。」书毕，审视良久，于纸角又添四字：「仅此一次。」添讫，以蜡封之，不示于人。封纸既讫，置诸箱底，与旧日报同处。其后军中每岁投匦，皆不用刀，然刀亦未去。城外列阵之处在荻花洲北，地平无蔽，风过芦苇皆伏。"
 LYY_Event.2022.a:"捍卫选票，压制武力干预"
 LYY_Event.2022.b:"与军方妥协，换取秩序"
 LYY_Event.2023.t:"匠人宪章初落笔"
 LYY_Event.2023.d:"宪章成，凡十二条。第一条曰：「锤之主人，有权问铁之去向。」\n落笔之日，黑岩厂鸣钟一记，继而连鸣，凡六十响。工停锤，炉不闭火。老工头取宪章抄本一纸，贴于车间门侧，浆糊未干，纸角先卷。\n有少年工笑曰：「贴此何为，识者几人。」老工头曰：「识者不识者，皆须见此纸在此。」少年曰：「贴在门上，风一吹就破。」老工头曰：「破了再贴。」\n自是每晨上工，众立门前，由识字者读一条，读毕乃入。初读时，众多不听，交头接耳。越十日，读至第七条，众忽静。第七条曰：「主不得无端减工价。」老工头后语人曰：「此一条，我父等了三代。」言时以手抚门侧之纸，纸已换过四张。是日厂中出铁，尽铸为器，无一为兵。少年工闻之，亦取一纸，抄其第七条，置于枕下。厂中钟为旧铸，钟身有裂纹一道，鸣时声散而不聚。"
 LYY_Event.2023.a:"全力推动匠人宪章"
 LYY_Event.2023.b:"暂置宪章，先急军工"
 LYY_Event.2024.t:"井下七日争矿脉"
 LYY_Event.2024.d:"争起于井下第三层。旧矿主雇打手百人，工会聚工倍之。井下无日，惟矿灯与喘息。\n第一日，两造各据一巷，以矿车为垒。第三日，有人在暗处断索，矿车坠，伤三人。第五日，工会使人自旧巷绕出，夺其风门。风门一失，彼处灯火尽灭，打手不能支。\n至第七日，旧矿主遣人出井议和。所许者三：矿脉归工会，械交出，伤者给养。议既定，两造立于井口，日光照面，皆眯目不言。\n刻晴后至，不入井，坐于井口之石上，取水一壶，分饮伤人。有工伤者问曰：「此后矿归我辈乎。」刻晴曰：「归城。」伤者曰：「城是谁。」玉衡曰：「城者，诸君也。」伤者不语。刻晴复曰：「然则今日之后，最要者一事：勿使吾辈中复出一矿主。」伤者视其手，手黑，指节皆裂，久乃曰：「难。」刻晴曰：「难者，才要做。」第三层在层岩之下，井道倾仄，灯油须以绳吊下。"
 LYY_Event.2024.a:"许工会自领矿脉"
 LYY_Event.2024.b:"居间调矿主与工"
 LYY_Event.2025.t:"人民军解旧徽章"
 LYY_Event.2025.d:"整编之日，校场列队。令下：解旧徽，换新服。新服无徽，惟有臂上一道青线。\n第一人出，解徽，手抖，徽落于地，俯拾三次方得。第二人亦然。至第十余人，有一老卒解至半，忽停，以手掩其面。\n刻晴在台上见之，下台，行至其前，不言语，自解其袖上旧徽，置其掌中，曰：「此物随我十年，今日亦解。」老卒受之，手不抖。\n午后，众皆解毕。旧徽堆于案，如一小丘。有吏问：「此物如何处置。」刻晴曰：「勿熔，勿弃，入库，题曰故物。」吏曰：「留之何用。」玉衡曰：「使后人知，吾辈曾佩此物，非因爱之，乃因不得不佩。」\n日暮收队，队行过街，市人停步。有童子指其臂问母曰：「此线何意。」母曰：「不知。」童子遂不问。队过后，街石上留一行靴印，尘未起。天衡北麓校场尘厚，靴印留三日不散，风过则平。"
 LYY_Event.2025.a:"全面整编，革除旧弊"
 LYY_Event.2025.b:"暂留旧制，逐步过渡"
 LYY_Event.2026.t:"女工执笔署契约"
 LYY_Event.2026.d:"契约成，凡十四条。署名之笔置于案，刻晴取之，不署，转递于工人席。\n工人席前列者十余人，皆推让。有中年女工被众推出，行至案前，执笔，手悬，久不下。堂中寂然，闻窗外风。女工低声曰：「此笔重。」刻晴曰：「重者非笔。」女工乃落笔，写其名，三字，笔画歪斜，末笔用力过重，纸微破。\n写毕，众不起，亦不言。有顷，一少年工先拍手，众乃应，声不齐。女工退归席，坐而不语。\n旁有吏问曰：「识字乎。」女工曰：「不识。」吏曰：「既不识，何以为凭。」女工曰：「我认得我那一笔。」吏默然，取印，于其名下加印一记。\n是夜，契约入库。库吏见纸上有破处，欲裱之，玉衡止之曰：「勿裱。」留此破处。库吏问：「破处何足留。」刻晴曰：「他日展卷，人先见此破。」契纸用荻花洲韧皮所造，历水不烂，故敢存久。"
 LYY_Event.2026.a:"以笔付之工头"
 LYY_Event.2026.b:"亲自签署以显权威"
 LYY_Event.2027.t:"仙家法庭摘牌匾"
 LYY_Event.2027.d:"仙家法庭之匾，悬于门楣三十七年。摘之日，无人喝彩。\n匠人架梯，以绳缚匾，四人执绳。绳一松，匾斜，木屑落。有老吏在阶下仰视，忽曰：「且慢。」众停。老吏曰：「此匾上有刻痕，是某年所刻，刻者已殁。」刻晴曰：「刻痕留否。」老吏曰：「留则匾不可去。」\n刻晴视匾良久，曰：「取锯来。」命匠人锯其半，上书之字去，下刻之痕留。众不解。玉衡曰：「去者法也，留者事也。」\n翼日，申鹤遣人送书，纸冷如冰。拆之，八字：「君拆其庙，断其缘。」刻晴折书，纳于袖。左右请覆，刻晴曰：「不必。」命吏取一函，以空纸封之，遣还。使者问：「空函何意。」玉衡曰：「缘已断，无可言。」\n使者去后，刻晴取袖中书，展而再读，读毕复折，置于案上，未收。至夜分，书仍在案，灯火照之，纸色如霜。仙家法庭之匾悬于玉京台西街，旧楠木，重百斤，落地一震，檐灰簌簌而落。"
 LYY_Event.2027.a:"坚决裁撤仙家法庭"
 LYY_Event.2027.b:"暂缓裁撤，缓和仙家"
 LYY_Event.2028.t:"后浪军官初授职"
 LYY_Event.2028.d:"后浪军官团立，凡二十一人，最长者二十六。授职之日，刻晴亲临，逐一付印。\n第一人受印，语刻晴曰：「将军，吾辈不似将军之慎。」玉衡曰：「何谓。」对曰：「将军每事先思其败，吾辈只思其成。」刻晴曰：「成亦须思其何以成。」少年不能对，退。\n第二人受印，刻晴问：「汝何以从军。」对曰：「不愿再仰视人。」玉衡曰：「仰视与俯视，皆非平视。」少年曰：「然则如何。」刻晴曰：「先学平视同列。」\n授至末人，刻晴执印久不落。左右问：「何故。」玉衡曰：「此印一落，则此后有二十一柄刀，各持己意。」言毕，终落印。\n众退，刻晴独留。袖中之手，微颤，良久乃止。是夜命人取此二十一人之旧卷，一览至晓，无一卷记其过失，亦无一卷记其功。刻晴合卷，语侍者曰：「皆清白，故皆可畏。」授职之所即玉京台下旧厅，壁上有旧年战图，图角已卷。"
 LYY_Event.2028.a:"擢升后浪，委以重任"
 LYY_Event.2028.b:"压制后浪，防其坐大"
 LYY_Event.2029.t:"玉衡宣言动全城"
 LYY_Event.2029.d:"宣言出，全城动。港口汽笛齐鸣，声压过钟。万人塞街，自玉京台至码头，人头如潮。\n刻晴立台上，众呼其名。呼声一起一落，如浪拍岸。刻晴举手，众稍静。玉衡欲言，声为呼所掩。如此者三。及众终静，刻晴忽不能言。立有顷，乃曰：「今日之誓，非誓于我，誓于纸上。」众复呼。\n刻晴视台下，见一老妪在人丛中，不呼，亦不笑，但仰面视之。玉衡于台上与她对视，一瞬，老妪低头，以手理其鬓。\n夜分，众散。刻晴独坐台上，足下纸屑满阶。侍者问：「今日何如。」刻晴曰：「今日万人听我，我一人不能听万人。」侍者曰：「何谓。」玉衡曰：「我立此高处，已听不见下面。」\n侍者拾阶上纸屑，拾之不尽，问：「此纸可弃乎。」刻晴曰：「弃。」言毕，又曰：「留一张。」侍者问：「留何张。」刻晴曰：「随便一张，上有字者。」台下人潮所立之处，次日扫得鞋底泥数十担。"
 LYY_Event.2029.a:"向全城宣读玉衡宣言"
 LYY_Event.2029.b:"小范围颁行即可"
 LYY_Event.2030.t:"平等之港始通商"
 LYY_Event.2030.d:"平等之港开。凡船，不问旗号，皆可入港卸货。\n开港首日，码头船塞，自埠头至外港，樯如林。旧商骂于岸，新商雇船于夜。有一旧商指新来者曰：「此辈昔日不得入，今日与我争埠。」新来者闻之，拱手曰：「昔日不得入，非我之罪。」旧商语塞。\n刻晴至码头，不登台，行于栈桥之间。有脚夫担货过，几撞之，刻晴侧身让。脚夫不识，回身曰：「娘子当心。」玉衡曰：「诺。」\n是日卸货，凡六百余担。暮时，刻晴立灯塔下，语左右曰：「开港者，非为广交，为惧。」左右问：「惧何。」刻晴曰：「惧闭之太久，屋必朽。」朽自内起，非自外来。左右曰：「然则开门之后，虫亦入。」玉衡曰：「入则驱之，不可复闭。」\n是夜港中灯火不熄，有新到之船不知港规，误泊于军港，巡卒往问，不与争，引之至埠，指其界，船人拱手谢。巡卒还，语其伍曰：「此辈亦人也。」云来海外港水深处可泊大船，惟入口有暗礁，须引水者登舟。"
 LYY_Event.2030.a:"平等之港，全面开放"
 LYY_Event.2030.b:"只开放部分口岸"
 LYY_Event.2031.t:"闭门三日议未决"
 LYY_Event.2031.d:"议事厅闭。令曰：「非常之时，用非常之法。」令出，无辩，无议。\n门合时，声闷。阶下记者十余人，皆执笔，无一人问。有顷，一记者低声曰：「记之。」众乃书。是日，报纸出，题曰共和第一闭门。刻晴见此报，不怒，亦不辩。取其一份，压于案上文书之最下。吏问：「何以压之。」刻晴曰：「使他日翻案，先见此纸。」\n闭门三日，厅中仍有灯火。值夜者见玉衡独坐其中，对空席而言，如与人辩。夜半，声止。值夜者入视，案上空无一人，惟椅上留一披风。\n第四日，门复开。众入，见案上有一纸，只一行：「此门闭过三日，后人当记此三日。」有议者读毕，欲取之，为书记所止，曰：「此纸不入档。」议者问：「不入档，置于何。」书记曰：「钉于门内。」\n自后每开议，众人入门，皆见此纸。有年少者问其故，老者但曰：「抬头看门。」议事厅门在玉京台下，旧楠木包铁，合时声闷，门外阶石有凹。"
 LYY_Event.2031.a:"停议，先求速决"
 LYY_Event.2031.b:"存议会，纵其争"
 LYY_Event.2032.t:"文书如织印如飞"
 LYY_Event.2032.d:"文书之速，倍于往昔。晨上之牍，暮已批还。印在案，吏执之，一按即起，油未匀亦不暇顾。\n初，众以为能。月余，有吏于库中翻检，见一批文，批曰速行，而所行之事实未具。检者问原吏，原吏曰：「我亦未细看，上头催得急。」\n又一日，有令下于乡，乡吏奉行，行三日，始知令中所指之乡名有二，同名而异处。两乡皆行，一乡空扰，老农数十人荷锄立于田头，候一日而无人至。\n老文吏夜坐，取案上积牍，欲读其一，读至半，目涩，弃之。仰面曰：「吾辈所改者，岂止章程。」旁有少年问：「尚有何物。」老吏曰：「耐性。」\n刻晴后闻之，命凡牍必经三吏之手，不得越。吏曰：「如此则慢。」刻晴曰：「慢者，读得完也。」令既下，文书之速减半，而误者亦减半。有吏私语曰：「原来慢亦是一法。」玉京台诸署用印，印泥以朱砂调油，冬日易凝，吏揣于怀，温而后用。"
 LYY_Event.2032.a:"奉行效率至上"
 LYY_Event.2032.b:"为民意留出冗余"
 LYY_Event.2033.t:"群吏登台各运筹"
 LYY_Event.2033.d:"群吏登台，皆年少，衣整，挟册。所言者，数也。\n第一人开册，图表三十七幅，自人口至盐引，自雨量至车轴，无所不包。讲至末页，结论一行：「本季民之满意，无可计量。」堂中静。有老者问：「既不可计，何以为政。」讲者对曰：「当立可计之法。」老者曰：「民之喜怒，可以寸尺量乎。」讲者不能对，退。\n第二人上台，所讲者亦数。刻晴坐末席，至中段忽止之，问曰：「此数自何来。」对曰：「自乡报。」刻晴曰：「乡报自何来。」对曰：「自里正之册。」玉衡曰：「里正之册，汝验过否。」对曰：「未。」\n刻晴乃取册，翻一页，指一行曰：「此乡去岁报丁口三百，今岁报三百，而其间有灾。」对者面赤。刻晴曰：「数无过，过在信数而不问人。」\n散后，有年少吏随玉衡出，问曰：「然则数可废乎。」刻晴曰：「不可废。」数者，骨也。无骨则不能立，有骨而无肉，亦不成人。图表所据多自八区清册与月海亭粮账，二处之数常不合。"
 LYY_Event.2033.a:"启用技术官僚内阁"
 LYY_Event.2033.b:"坚持政治协商，不设技术内阁"
 LYY_Event.2034.t:"书院门前下新令"
 LYY_Event.2034.d:"新令下于书院门。令曰：「童子先习循令，后习问难。」\n院长受令，读三遍。读毕，召诸生立于庭，语之曰：「吾有一言，汝辈记之。令教汝如何活，学教汝为何活。」二者皆须，惟不可倒其次序。一生问曰：「若二者相违。」院长曰：「则先问，后行。」生曰：「问而不得，奈何。」院长曰：「不得则再问。」\n是夜，院长病。医至，曰：「积劳。」三日不食，只饮汤。诸生侍于侧，院长忽张目，指案上书，语弟子曰：「第七页，有一句，汝读。」弟子读之，乃前朝某人语：「法可束身，不可束心。」\n院长闻之，闭目，复曰：「此句须记。」言毕不语。窗外风动，庭中槐叶落于阶，声甚轻。\n翼日，诸生以令呈于院长榻前。院长不能起，以手指令末一行，令其添注。弟子视之，所添者八字：「此令可遵，此令可议。」书院设于天衡南麓，门前一槐，荫可覆半街，夏日讲书皆在树下。"
 LYY_Event.2034.a:"推行征召心智"
 LYY_Event.2034.b:"存书院自立"
 LYY_Event.2035.t:"铁腕行署闭街衢"
 LYY_Event.2035.d:"行署立，号铁腕。令：凡议政者，投书于匦，不得聚于街。\n初行之日，街静。静得可闻巡卒靴声。有老妇于门内听之，语其子曰：「此声昔日无有。其子曰：静些不好么。」老妇曰：「好，只是不像城，像仓。」\n市中茶肆，初有低语，后无。茶博士抹桌，抹至客前，客摇头，博士即退，不多问。有少年于壁上题一句，未及半，为巡卒所见，少年走，字留三日，无人拭，亦无人看。\n刻晴巡城，自南至北，街无一声呼。还署，坐良久，语左右曰：「今日无一人骂我。」左右曰：「是好事。」刻晴曰：「安宁与死寂，其声相似。」左右不解。\n夜分，玉衡取日记，书一行：「今日城中甚静，静得我不敢开窗。」书毕，推窗，街上无人，惟巡卒二人，持灯过，灯影斜长，掠墙而没。玉京台西街口茶摊先撤，摊主不肯弃其炉，以板车载去，轮声轧轧。"
 LYY_Event.2035.a:"成立铁腕行署"
 LYY_Event.2035.b:"拒绝铁腕，坚持宽和"
 LYY_Event.2036.t:"征矿令下老工怒"
 LYY_Event.2036.d:"征矿令下，诸矿归官。吏持令至井口，令众署名。\n众不署。吏曰：「不署者，停饷。」众仍不署。有老矿工出，取矿灯，高举，猛掷于地。灯碎，油溅，火起一瞬而灭。老矿工曰：「我辈推翻帝君，非为换一东家。」声在井口回荡，众皆默。\n吏色变，欲执之。旁有工头止吏曰：「此人井下三十年，救过七人。」吏乃止，取册记其名，记毕，合册，曰：「此言我录之。」\n是夜，册至署。主事者阅之，见老矿工名下有言一段，欲删。笔已下，复止，终不删，以朱圈其言，注曰：「存。」\n后此册入档，凡三年，无人敢以此言上闻。而井口之灯，自此更换新式，铁壳，不易碎。老矿工不知此事，仍用其旧灯，灯上有一凹，是那夜掷地所留。其徒问：「既发新灯，何不换。」老矿工曰：「留着，好记得那一声。」井口在层岩北，牌上旧刻矿脉名，字为矿工自凿，深浅不一。"
 LYY_Event.2036.a:"尽征矿脉，竭其力"
 LYY_Event.2036.b:"体恤矿工，放缓征矿"
 LYY_Event.2037.t:"七星列坐无一言"
 LYY_Event.2037.d:"七星议事，席仍设七。至者五人，二人称病。\n议案陈于案，无人先阅。有顷，一人取之，翻两页，合上。又一人取之，亦翻两页，合上。如是者五，案上文书轮一周，复归原处。\n所议者，皆已成之事。所问者，皆已定之案。书记读毕，问：「有异议否。」堂中无声。书记曰：「既无异议，通过。」乃取印，逐一请署。五人皆署，无一迟疑，印泥微干，第一人按之，色淡，亦不重按。\n刻晴偶过廊下，闻堂中静，止步。侍者曰：「会议将毕。」刻晴不应，立良久。堂中翻纸声起，一页，两页，复静。玉衡乃行，行数步，回顾，见门缝中透出一线灯光，灯光不动。\n是夜，刻晴于日记中书：「七星今犹在，而七星已亡。」亡者非人，乃议。书毕，取前年议事旧录一册，翻数页，页上有争字，有涂字，有旁批之小字，皆手迹。合册，压于枕下。七星议事之席在玉京台上，席上茶凉未换，侍者立门侧，久之亦不敢添。"
 LYY_Event.2037.a:"令七星尽噤"
 LYY_Event.2037.b:"给七星保留咨议之权"
 LYY_Event.2038.t:"一夜军中少三分"
 LYY_Event.2038.d:"整肃令下，一夜之间，军中名册少三分之一。\n所去者，多有旧功。有校尉曾于某役负刻晴出围，名亦在册。执令者犹豫，持册至刻晴前，问：「此名是否误。」玉衡视之，久，曰：「不误。」执令者曰：「此人曾救将军。」刻晴曰：「我记得。」\n行刑在城外，未鸣枪，以绳。有卒手抖，绳结三次不成。监者不催，待其成。天将明，事毕。地上雪薄，血至则化，无色。\n翼日，刻晴上朝，仪容如常。有僚问：「昨夜安否。」玉衡曰：「安。」僚曰：「将军面有倦色。」刻晴曰：「昨夜阅册至晓。」\n散朝，刻晴独至校场，立于点名之处。值日者点名，点至已除之名，声一顿，跳过。玉衡曰：「照点。」值日者乃点其名。点毕，无人应。刻晴曰：「记之，缺席。」值日者执笔，手停于册上，问：「此名留否。」刻晴曰：「留。」留至册满。营在荻花洲北，点名于空地，地冻如石，名册摊于案，纸硬不能翻。"
 LYY_Event.2038.a:"发动雷霆整肃"
 LYY_Event.2038.b:"停止整肃，收拢人心"
 LYY_Event.2039.t:"工兵铺轨向天际"
 LYY_Event.2039.d:"工兵团上工，凡三万人。所修者，铁轨，自城西至层岩，自城北至沉玉谷。\n轨铺极速，日可十里。路基以碎石垫，石以手碎，碎者手皆裂。有工以布缠手，布上血痕如线。刻晴来视，行于新轨之上，轨下有隙，足踏之有声。问工头：此轨可支几年。工头曰：「十年。」刻晴曰：「十年之后。」工头曰：「再修。」\n玉衡不语。有工在侧曰：「将军，此轨通往何处。」刻晴曰：「通往矿，通往粮，通往远处。」工曰：「远处有何。」刻晴曰：「有更多人，待此轨至。」\n回程车上，玉衡一路不语。窗外新轨笔直，直入地平，不见其尽。左右以为倦，进茶，刻晴不接。至城，下车，忽语左右曰：「此轨好，只是太直。」左右问：「直何不好。」刻晴曰：「直者，不容人绕路。」\n是夜工兵营中计功，按丈给钱，有一队所铺最少，其队长自陈：此段地质松，夯实三遍方铺。主事者欲罚，玉衡批曰：「赏。」主事问：「何赏。」刻晴曰：「赏其肯慢。」轨过渌华池西，须架木桥三座，桥下水浅，可涉。"
 LYY_Event.2039.a:"组建国营工兵团"
 LYY_Event.2039.b:"放缓建团，减轻负担"
 LYY_Event.2040.t:"老教员临去一问"
 LYY_Event.2040.d:"老教员入署，请见。须白，衣旧，袖口磨薄。\n入，不坐，立而问曰：「容一问。」刻晴曰：「请。」老教员曰：「不许人非议之共和国，尚可谓共和国乎。」堂中无人出声。刻晴执笔，笔尖在纸上，久不动。老教员不问第二句，拱而立。\n有顷，玉衡曰：「先生此问，我不能答。」老教员曰：「不答亦是一答。」遂辞去。刻晴送至阶，老教员回身曰：「我教了四十年书，所教者惟一句：「问当问之事。」」言毕，下阶，足微跛。\n翼日，老教员递辞呈。署中欲留，刻晴曰：「任其去。」命人送米一石，书一函，函中空。老教员受米，还书，书亦空。\n是夜，玉衡取日记，将此问原句录入，一字不改。此后每夜睡前，必读此一行。读至某夜，忽于句下添四字：「我不及他。」添毕，合册，灯未吹，坐至天明。城北旧巷近天后宫，巷窄，两人相过须侧身。"
 LYY_Event.2040.a:"直面此问，求其一答"
 LYY_Event.2040.b:"避而不答，专事营造"
 LYY_Event.2041.t:"监护之诏无归期"
 LYY_Event.2041.d:"监护之诏，三易其稿。初稿曰统治，刻晴涂之。再稿曰摄政，复涂。三稿曰监护，乃定。\n涂稿之时，左右在侧。有吏问：「三者何别。」刻晴曰：「统治以力，摄政以名，监护以时。」吏曰：「何时而止。」玉衡曰：「待其长成。」吏曰：「何以知长成。」刻晴不答。\n诏下之日，无庆典。城门贴诏，观者不多。有老者读毕，语旁人曰：「此诏与昔年何异。」旁人曰：「昔年无期，今日有期。」老者曰：「期在何年。」旁人不能对。老者复读一遍，以指按其末句，摇头而去。\n刻晴于署中独坐，取旧日报一纸，上有她昔年斥无限期三字之语，字大如指。视之良久，折而藏于箱底，与监护诏之副本并置。\n夜半，起而开箱，取二纸并观。观毕，复藏。如是者再。第三夜，取报出，以剪去其斥语一节，剪毕又悔，以浆补之，补痕在纸上，如一道白疤。监护之诏藏于玉京台石室，纸用厚绵，朱印压其上，印边有缺，乃旧印。"
 LYY_Event.2041.a:"颁行永久监护"
 LYY_Event.2041.b:"立还政之期"
 LYY_Event.2042.t:"刻晴亲手推沙堡"
 LYY_Event.2042.d:"案上沙堡，仍置于原处。自上次筑之，未曾移动，沙已干，色转白。\n刻晴入，不语，行至案前，以掌推之。堡塌，沙散于案。众在侧，无一人言。刻晴曰：「潮至而堡毁，不如自毁。」有老者问：「自毁之后，何以复筑。」玉衡曰：「不筑沙，筑石。」老者曰：「石亦有尽。」刻晴曰：「石尽则人犹在。」\n言毕，取巾拭手。指缝间沙未尽，落于案面，簌簌。有一吏欲以帚扫，刻晴止之曰：「留之。」吏曰：「留此何为。」玉衡曰：「使后来者知，此案上曾有一堡。」\n是夜风大，窗未闭，案上沙为风所动，吹至案角，成一小小堆，如新筑之堡。值夜者见之，不敢扫，以纸覆之，压以砚。\n翼日刻晴入，见纸下有隆然者，揭纸视之，沙堆尚在，形已非旧。刻晴以指拨之，拨成一圈，圈中空无一物。语侍者曰：「此圈勿动。」侍者问：「圈中置何物。」玉衡曰：「不置。」空着。玉京台厅中案上沙散，细者留，粗者落地，侍者扫之，扫得极轻。"
 LYY_Event.2042.a:"亲手推倒沙堡"
 LYY_Event.2042.b:"推沙重筑，自起一垒"
 LYY_Event.2043.t:"三线烽火同时起"
 LYY_Event.2043.d:"烽火三处同举：北面山，东面海，中道断。\n参谋环地图而立，争论先救何线。一人指北，曰：「山道一失，则腹背受敌。」一人指东，曰：「海口一失，则粮不至。」争至夜分，无人服。\n刻晴至，众静。刻晴不视地图，先问：「三处各余几日。」对曰：「北五日，东七日，中三日。」玉衡曰：「中道最急，何故不争。」对曰：「中道最小。」刻晴曰：「最小者最急，以其无人争。」乃命：先赴中道。有参谋曰：「中道既小，弃之无损。」刻晴曰：「弃之则三处皆断。」众乃行令。\n夜半，玉衡独对地图。三处火光，映面明暗。侍者进茶，刻晴不接，指地图上一小点，语侍者曰：「此处无人画圈，故无人救。」侍者视之，乃一村，名不见于图例。\n诘朝，中道之报至：村存，桥断，粮车陷于泥。刻晴批曰：「先修桥，后报功。」有人问：「村不足百户，何急如此。」玉衡曰：「百户亦是一城。」北面山即天衡，东面海即云来，中路则荻花洲一道，三处相距各百余里。"
 LYY_Event.2043.a:"三线同时迎战"
 LYY_Event.2043.b:"收缩战线，保存实力"
 LYY_Event.2044.t:"北使持约借冻港"
 LYY_Event.2044.d:"至冬使者至，携约一册，皮面金角。所言者：助修港口，岁给煤铁，惟借不冻之港一处，以三十年为期。\n刻晴受约，读两遍。读毕，不议条款，问曰：「贵国北地多雪，雪化之后，其色如何。」使者愕然，曰：「雪化则为水，水无色。」刻晴曰：「我闻贵国雪化，色如朱。」使者不语。\n玉衡乃曰：「约中不言驻兵，亦不言旗。」使者曰：「既不驻兵，何疑。」刻晴曰：「不驻兵者，兵在船上。不竖旗者，旗在货中。」使者笑曰：「玉衡过虑。」刻晴曰：「我辈新立，虑不得不密。」\n遂取笔，于约末添一款：凡入港之船，兵械登记；凡登岸之人，名册送署。使者视之，久不署。玉衡曰：「不署则约不成。」使者曰：「容归国议。」刻晴曰：「请。」使者去，约留于案。\n使者行至门，回身曰：「玉衡不惧得罪大国乎。」刻晴曰：「惧。然惧者是我一人，港是三千年之港。」使者默然而出，行数步，顾其从者曰：「此国之难，不在其人强，在其人肯算细账。」至冬之使居南码头东馆，窗外即泊位，夜里可闻缆索相磨。"
 LYY_Event.2044.a:"却至冬之约"
 LYY_Event.2044.b:"接受合约，换取重建"
 LYY_Event.2045.t:"奥赛尔深海翻身"
 LYY_Event.2045.d:"夜半，海动。水先退三尺，复涨三尺。港中船缆皆紧，木相击，声如鼓。\n人自梦中起，披衣出户。有老者跪于岸，向海而拜，口中念念。有少年执枪立于堤，枪口向海，手不能止。水退时，露出滩上旧石，石上有纹，纹为旧时刻。有渔人识之，曰：「此石没于水中，四十年未见。」众皆变色。\n刻晴至堤上，不语。望海良久，问左右曰：「城中储粮几日。」对曰：「二十七日。」刻晴曰：「若海再动，粮道断，几日。」对曰：「九日。」玉衡乃命：自今夜起，凡沿海之仓，移于高处。左右曰：「迁仓之费巨。」刻晴曰：「巨于城破乎。」\n天明，海平。有渔人欲出海，刻晴止之，曰：「三日不出。」渔人曰：「三日不渔，家无食。」玉衡曰：「官给三日之粮。」渔人受粮，回望海面，海平如镜。\n至第三日，有胆大者私自驾舟出，行至半程，忽返，面色白。人问所见，不答，惟以手指海。自后半月，港中无一人言海。海动之夜，水漫南码头石阶三级，退后留一层细沙，沙上有小螺。"
 LYY_Event.2045.a:"全力镇压奥赛尔"
 LYY_Event.2045.b:"疏散港口，避其锋芒"
 LYY_Event.2046.t:"层岩巨渊地大震"
 LYY_Event.2046.d:"层岩巨渊地动，自子时起，历一刻不止。城中器物皆响，悬灯自摆。\n井下工人三百余，急撤。撤至井口者二百八十，余者至天明方出，面皆白。有一人出井即伏地，不能起，问之，但摇手。\n勘测者下井，半日乃还。还时面无血色，饮水三碗，方语曰：「下面有物在动。」问何物，曰：「不知。」问其形，曰：「如呼吸。」问其声，曰：「如远处有人数钱。」\n刻晴召诸将议。有言封矿者，有言探之者。刻晴曰：「封。」命塞其井口，以石，以铁，以土，三层。又命一营留驻，凡三百人，屯于渊侧，不与他营轮换。有将问：「留此何为。」玉衡曰：「此线无人知，故无人守。今日起，有人守。」将曰：「守至何时。」刻晴曰：「守至不须守。」\n是夜，渊侧灯火一点，自城头望之，如星。值夜者问刻晴：此灯可熄否。玉衡曰：「不熄。」使井下之物知，上有人。城中悬灯皆摆，玉京台檐角风铃自响，响至夜半方止。"
 LYY_Event.2046.a:"封矿并常驻戍卫"
 LYY_Event.2046.b:"置其警不顾，仍凿"
 LYY_Event.2047.t:"公子舟师扼海口"
 LYY_Event.2047.d:"至冬舟师至，泊于口外，凡十七艘。旗不举，桅上惟素帛一条。\n港中商人聚于埠头，望之无语。有老商曰：「此旗我识，昔年亦见此旗。」旁人问：「昔年如何。」老商曰：「昔年来者客，今来者主。」\n水手间私语，问达达利亚欲何。有自北归来者曰：「其人好战，而不好杀。」问者曰：「二者何别。」曰：「好战者争胜，不好杀者不屠。」\n刻晴登灯塔，望舟师竟日。有将请战，刻晴曰：「不。」将曰：「彼扼我口，我不动，示弱也。」玉衡曰：「今动，示急也。」乃遣一小舟，载酒十坛，米十石，往犒其军。使者还报：「彼受酒，不受米，留言一句：「米留与城中人。」」刻晴闻之，良久，曰：「此人不俗。」\n夜分，刻晴于图上圈其泊处，注曰：「狼在北，先看其向。」注毕，取尺量其距港里数，量至再三，乃搁尺。侍者问：「此数何用。」玉衡曰：「知其所处，则不惊。」口外即孤云阁诸峰，峰如戟立，船不敢近，惟于峰隙下锚。"
 LYY_Event.2047.a:"陈兵海疆，以对封锁"
 LYY_Event.2047.b:"派人谈判，试探公子"
 LYY_Event.2048.t:"千岩军解甲立门"
 LYY_Event.2048.d:"哗变起于强征之令。令下于晨，兵变于午。\n兵不刃，不呼，惟解其徽，置于阶，退立门外。自午至暮，门前列者千余，无人入，亦无人去。有百姓自门内出，见之，皆绕行，不敢仰视。\n刻晴闻报，不带卫，独往。将至，有校尉迎，请止，曰：「众怒未息。」刻晴曰：「正为此来。」遂行。至门前，众不拜，亦不让。玉衡立，视阶上之徽，堆积如小丘。乃曰：「诸君所怒者，是令，非我。令出自我，故我当受。」\n众中有声曰：「将军可知此令征谁家之子。」刻晴曰：「不知。」其人曰：「征者，皆吾辈之子。」刻晴曰：「此我之过。」言毕，玉衡解其佩刀，置徽堆之侧，曰：「今日我与诸君同。」\n众皆动容。有老卒出，拾徽，还之，曰：「将军收之。」刻晴受，曰：「此徽此后不再解。」是夜，令撤。撤令之纸贴于阶侧，与徽堆相对，风吹其角，拍拍有声。议事厅阶在玉京台下，徽章堆作一堆，日下反光，过者皆侧目。"
 LYY_Event.2048.a:"亲赴军营，回应哗变"
 LYY_Event.2048.b:"派兵弹压，肃正军纪"
 LYY_Event.2049.t:"故人隔壕送一壶"
 LYY_Event.2049.d:"两军对垒，壕相去三百步。夜静时，可闻彼军咳嗽。\n一夜，彼军遣人来，不带兵，捧一壶，一函。函上无款，拆之，一句：「敬吾辈各自所信。」刻晴受酒，不饮。取碗，倾半壶于地，曰：「此半，敬旧日。」余半，置于案，未饮，亦未弃。\n送酒者未去，立帐外。刻晴问：「彼在军中何职。」对曰：「参谋。」玉衡曰：「其人少时，好于书眉批字。」对曰：「今亦如此。」刻晴曰：「批何字。」对曰：「批曰不然。」刻晴笑，笑已，面无色。乃取纸，书二字：「亦然。」封而还之。\n送酒者去。玉衡独坐，取案上余酒，视之，终不饮。至天明，酒面浮尘一层。侍者欲倒，刻晴曰：「留之。此酒是他年之证。」\n月余，战事稍缓，有俘虏送至。刻晴亲往视，见一人衣破，面有血痕，乃昔年同窗。二人对视，皆不言。玉衡命解其缚，予以食。其人食毕，曰：「酒可还否。」刻晴曰：「已倾半壶。」其人曰：「余半尚在否。」刻晴曰：「在。」其人曰：「留着。」壕在荻花洲外，土湿，掘二尺即见水，士卒皆苦之。"
 LYY_Event.2049.a:"回信故人，各守其志"
 LYY_Event.2049.b:"断绝往来，战场相见"
 LYY_Event.2050.t:"城复而名减其半"
 LYY_Event.2050.d:"城复之日，旗上城头。街上无欢呼，惟有人自门内出，立而望旗。\n刻晴登城，不视旗，视街。街有断墙，墙下有物，覆以席。问左右：此何。对曰：「名册。」刻晴曰：「何人之名。」对曰：「守城者。」玉衡下城，行至席前，蹲而启之。册湿，字有晕。刻晴以指循其行，读至某名，止。问：「此人在否。」对曰：「在册。」刻晴曰：「在册者几人。」对曰：「四百一十七。」玉衡曰：「归者几人。」对曰：「二百零三。」\n刻晴合册，起，久立。风自海来，旗在头上猎猎。刻晴忽语左右曰：「此城修得如何。」对曰：「三月可复旧观。」玉衡曰：「旧观者，墙也。」人不可复。\n是夜，命于城头立石，刻四百一十七名。石未成，先以木牌代之。有老妇来寻其子之名，寻至日落，指其一，以手摩之，摩至字迹发亮。刻晴在侧，不言语，取墨与笔，谓老妇曰：「可拓一份归。」老妇曰：「不识字，拓归何用。」刻晴曰：「挂在屋内，客人来，见之。」断墙之砖多自天衡运来，砖侧有窑印，印文尚可辨。"
 LYY_Event.2050.a:"负伤前行"
 LYY_Event.2050.b:"停下脚步，清算过往"
 LYY_Event.2051.t:"月海亭回书八省"
 LYY_Event.2051.d:"甘雨回书，楷法端正，如账簿。所言者：八省粮道可开，惟须一诺：粮车在道，两造皆不得劫。\n书末附一行，字稍小：我为文书三千年，今日初次为不属神明之契用印。愿君不负此印。刻晴读至此处，取书至窗前，就光再读。读毕，取案上木板一方，以刀刻其末句，刻至愿字，刀一顿，木纹裂，遂改刻于新板。\n吏问：「何以刻木。」刻晴曰：「纸可焚，木难。」木板悬于座前，日见之。有客问：「此何人所书。」玉衡曰：「一记账之人。」客曰：「记账者亦能为此言。」刻晴曰：「正因记账，故知其重。」\n月余，粮车首至，凡一百二十乘。车上有旗二，一书璃月，一书月海亭。刻晴出城视之，见车夫皆带干粮，不入城取食。问其故，曰：「甘雨大人有令，车粮自备，不扰城中一粒。」玉衡闻言，立于道旁，看车过尽，乃还。\n是夜，于木板侧又添一钉，钉上悬一小牌，牌上无字。侍者问：「此牌何用。」刻晴曰：「待我负此印时，书其上。」书用八行笺，行间极宽，似留与人批注。"
 LYY_Event.2051.a:"受甘雨粮道之约"
 LYY_Event.2051.b:"索八省尽开，不得设限"
 LYY_Event.2052.t:"天权答书满纸数"
 LYY_Event.2052.d:"凝光回书一页，无套语。通篇皆数：某矿岁出若干，某路岁税若干，某港岁入若干。末一行曰：「君革命，我不阻。惟革命之后之账，须有人会算。」\n刻晴读三遍。第一遍皱眉，第二遍取笔圈数，第三遍乃笑。笑已，语左右曰：「此人数目，比我之宣言有用。」左右曰：「何以。」刻晴曰：「宣言动人一时，数目养人一世。」\n乃作复书，只问一事：若国库只余三月之粮，当先减何项。凝光复书，答曰：「先减官署之灯油，后减军中之肉，最后减学塾之纸。」玉衡视此答，指最后一项曰：「此项不可减。」乃于书眉批：纸可减，学不可减。命人送去。\n使者还报：「凝光见批，笑曰：此人终是书生。」刻晴闻之，亦笑，曰：「书生二字，我受之。」\n后数日，官署灯油减半，诸吏夜坐，灯焰如豆。有吏私语曰：「玉衡与天权，一个减灯，一个减肉，皆是拿别人开刀。」刻晴闻之，命人多给灯油一勺，曰：「骂我可以，暗不可。」天权回书自群玉阁来，书中数目皆以商会自用之码记，外人读之，如读天书。"
 LYY_Event.2052.a:"与凝光共算革命之账"
 LYY_Event.2052.b:"拒绝与旧财阀合作"
 LYY_Event.2053.t:"绝云间来客留语"
 LYY_Event.2053.d:"绝云间来客一人，衣素，履不染尘。入城，不赴宴，不见官，惟至署中，立阶下。\n刻晴出迎。客曰：「我代山中诸人致一语：「仙凡殊途，本无对错。」」刻晴曰：「既无对错，何以来。」客曰：「来告一言，非来辩。」\n玉衡乃取一小盒，启之，中贮花种，以纸分包，包上书其名。曰：「此数种，请携归，种于山中。」客曰：「山中苦寒，恐不生。」刻晴曰：「不生亦种。」客受盒，视之，问：「何以种于山中。」刻晴曰：「港口尘多，山中雪净。」客默然，久乃曰：「此语我带回。」\n客去，不回望。玉衡立于阶，见其行至街口，为一童子所阻。童子问：「仙人不食人间烟火乎。」客曰：「食。」童子问：「食何。」客曰：「食雪。」童子不信，客亦不辩，以手拂其顶，遂行。\n是冬，绝云间雪线之下，初见花数丛，色白，无香。守山者不识其名，亦不拔，惟以石围之。山下人闻之，携酒往观，至则花已枯，枯而结子，子落于雪。客所立之阶在署前，石为青石，缝中生草一茎。"
 LYY_Event.2053.a:"尊重仙家，各守其界"
 LYY_Event.2053.b:"强令仙家交出洞天"
 LYY_Event.2054.t:"楼船甲板设一席"
 LYY_Event.2054.d:"达达利亚设席于甲板，惟一案，二座，酒一壶，无侍者。\n席间所谈者，非港口，非粮道，乃秩序。彼曰：「此世本不平。君辈革命，欲使其平，抑欲换一批人收账。」刻晴举杯，不答。彼复曰：「我在北地见多矣。」举事者初皆言平，成事者皆言序。刻晴曰：「序者，非我所求。彼曰：君求何。」玉衡曰：「求人可问。」\n彼大笑，笑已，忽正色曰：「君之难，不在敌人，在君之友。」刻晴曰：「何谓。彼曰：敌人可识，友不可识。」\n酒至半，风起，船微侧。刻晴起，辞。彼送至舷，曰：「君归，勿忘今日。」玉衡曰：「不忘。彼又曰：他日若败，可来北地。」刻晴曰：「不来。彼曰：何故。」刻晴曰：「败则死于港，不入他国之雪。」\n回舟，玉衡语参谋曰：「记此人。」参谋问：「记其何。」刻晴曰：「非记其敌，记其言。此人是一面镜，照我辈所未照。」楼船泊于孤云阁外三里，潮落时可见船底附螺。"
 LYY_Event.2054.a:"虚与委蛇，换取喘息"
 LYY_Event.2054.b:"断然却至冬之议"
 LYY_Event.2055.t:"沉玉谷寄无星秤"
 LYY_Event.2055.d:"沉玉谷之复，来得最迟。使者至，捧一物，以布裹。启之，乃一秤，藤条所编，无星无刻。\n附书一纸，曰：「君之契，量不出水土之重。」刻晴取秤，执其纽，秤杆空悬，两端皆无物，而杆自平。刻晴曰：「无星之秤，何以为量。」使者曰：「谷中人不用秤称物，用秤称心。」玉衡曰：「心可称乎。」使者曰：「不可称，故秤无星。」\n刻晴默然，取秤置案。有吏在侧，笑曰：「此物无用。」刻晴曰：「无用者，最易忘。」命人悬此秤于堂中。\n自是每议一事，玉衡必先视此秤。有僚问：「视此何为。」刻晴曰：「视其无星。」僚曰：「无星则不能量。」刻晴曰：「故须记住，有些事量不出，而量不出者，常为至重。」僚曰：「既不能量，何以决之。」玉衡曰：「以问。」问而后决，决而后悔，悔而后改。\n是年秋，使者再至，取秤还谷。刻晴问：「何以还。」使者曰：「秤在君处一年，谷中人言，其星已生。」刻晴视秤，藤上有细痕数道，如新刻。藤出灵濛山阴，经雨不腐，谷中人用以缚梁。"
 LYY_Event.2055.a:"虚心请教沉玉谷"
 LYY_Event.2055.b:"以革命之名斥其消极"
 LYY_Event.2056.t:"十二纸并铺长案"
 LYY_Event.2056.d:"十二处回书至，先后不同。刻晴命人并铺于长案，自左至右，按其地之远近。\n第一纸，字大而粗，只二字：「来吧。」最后一纸，无字，惟空白之印一枚。中间有长书三页者，有只书一行者，有一纸污了半幅，似曾落水。刻晴行于案侧，逐一视之。视至空白之印，止。取印视其背，背有刻痕，刻曰某司。玉衡曰：「此人不肯言，而留印。」是不拒，亦不许。\n众问：「十二处之中，几处可用。」刻晴曰：「十一处可用，一处待之。」有吏问：「何以待之。」刻晴曰：「逼之则绝。今其印在，门未闭。」\n是夜，玉衡命人取纸一幅，画十二点于上，各注其地。画毕，视之良久，语左右曰：「此图不似疆域，似人心。」左右问：「人心如何画。」刻晴曰：「画其远近，不画其向。」\n翼日，将十二书归档，刻晴止之曰：「先抄一份。」抄者问：「抄与谁。」玉衡曰：「抄与后来之人。」使知此十二家，曾于一日之间同答一书。抄毕，正本入库，抄本置于议事厅门侧，任人取阅。纸色各异，有黄有白，一纸带茶渍，乃翘英庄所出。"
 LYY_Event.2056.a:"邀请十二方共立新约"
 LYY_Event.2056.b:"只与忠于革命者结盟"

 KQP_Spirit_Yuheng_Banner:"玉衡星一檄"
 KQP_Spirit_Yuheng_Banner_desc:"一旗无徽，悬于台端。市人仰观，不知其属何司，亦不知其主何人。然自是一旗出，旧日之礼遂废。盖其所树者，非一人之名，乃众庶不复屈膝之志。故见者不言而肃，行者过而改容。玉衡星者，七星之末，而其帜先立，亦足见人心之向背矣。旗杆为黑岩厂所铸，杆底刻一行小字：不为人屈。"
 KQP_Spirit_Reformed_Millelith:"千岩换旧徽"
 KQP_Spirit_Reformed_Millelith_desc:"新军既成，旧徽尽落。校场之上，不设神位，不陈香案，惟树一旗，书璃月二字。有老卒问曰：「既无神可拜，吾辈所拜者何。」将校曰：「拜此二字足矣。」众初以为易，行之乃难。向者听命于一人，今则听命于众议。一人可以欺，众议不可欺，故其令稍缓，而其守反坚。玉京台校场石阶九级，刀痕入石三分，历年所踏，无人磨平。"
 KQP_Spirit_The_Reform_Engine:"举国若转轮"
 KQP_Spirit_The_Reform_Engine_desc:"改革既行，举国若转轮。晨钟未鸣而工已集，夜漏三下而灯未熄。匠作日精，舟车日速，港口之货三倍于旧。然街巷之间，笑语渐稀。有老妇语其邻曰：「昔者日长，今者日短，不知谁窃之去也。」邻不能答。盖轮转愈急，附之者愈不得下，此非一人之力所能止也。南码头石阶潮至则没二级，担夫候潮而行，一日两潮。"
 KQP_Spirit_Inertia_Burden:"旧制如赘疣"
 KQP_Spirit_Inertia_Burden_desc:"三千年之制，非一日可去。其在新者，不显于朝堂，而藏于里巷。吏执旧牍，匠守旧规，民闻吏言，皆曰向来如此；此四字相传，重于铁券。少年欲疾行者，如着湿袄，举步皆滞。有司欲革一例，文书往返三月，及至施行，主事者已迁去。故事未毕而人已换，此其所以难也。玉京台旧档库门轴涩，开一次须二人，声传半院。"
 KQP_Spirit_Peoples_Contract:"万手同钤印"
 KQP_Spirit_Peoples_Contract_desc:"古之契，一人书，一人署，余者但观。今之契异是：堂中设长案，案上铺纸，纸末留白，凡与议者皆前按一指。指印累累，如雨点落纸。有老吏从未按者，举指良久不下，问曰：「此印一落，吾即在其内乎。」主事者曰：「然。」老吏乃按，按毕以袖拭目。盖其所保者非必公平，所保者，署者之中有己也。长案列于玉京台阶前，案面指印层层，洗之不去。"
 KQP_Spirit_Secular_Republic:"神明离香案"
 KQP_Spirit_Secular_Republic_desc:"新制既立，神像不毁，但移之于偏殿。朝会之时，主位虚设，无人敢坐，亦无人再拜。老者入殿，见香案蒙尘，抚之而叹，谓三千年乃见此案无烟。或问无神则何以立国。答以人。问者复疑人可恃乎。答以人不可恃，故须有法；法亦不可恃，故须有议。信仰还之于心，不入于牍。偏殿之外即玉京台，台上有旧祭坛，坛面磨平，已无纹。"
 KQP_Spirit_Engineer_Cabinet:"斧斤入朝堂"
 KQP_Spirit_Engineer_Cabinet_desc:"内阁九人，六人出于匠作。议事不引经，不称古，惟出尺、规、算筹三物。凡言必先问可量否。可量者立决，不可量者暂置。于是堤渠、桥梁、仓廪，三年而备；而狱讼之冤、乡里之怨，亦三年而未问。老臣叹谓国中万事皆合尺寸，独人心无处安放。其言闻于内阁，众皆默然，乃置一簿于门侧，名曰民言，月余而簿未满。黑岩厂量尺三副，铜铸，刻度磨浅，须以指腹辨之。"
 KQP_Spirit_Perpetual_Tutelage:"托孤不还政"
 KQP_Spirit_Perpetual_Tutelage_desc:"当国者尝语于人，谓待尔曹长成，吾当归政。其言温然，闻者皆悦，而无一人问：孰判其长成。监护者愈仁，被监护者愈不得长。岁月既久，政在其手，名在其口，而国中遂无成人。此政之最隐者，不夺人产，而夺人自视之力也。及其终也，举国皆望一人，而无人望己。月海亭廊下石碑一座，碑上无字，苔自碑脚上生。"
 KQP_Spirit_Neon_Terror:"雷落街无声"
 KQP_Spirit_Neon_Terror_desc:"乱既定，街鼓不复夜鸣。市门早开，行人屏息，遇巡卒则侧立。昔日聚谈之茶肆，今惟闻碗箸之声。刻晴尝微服过之，坐良久，无一人议政。归而语左右，谓此非治也，此止也。左右问其故。乃言水静者或深或冻，今街无声，不知其为深为冻。言毕，命撤巡卒三之一，以观其变。绯云坡茶肆十七家，炉火终日不熄，客来只饮不谈。"
 KQP_Spirit_Thousand_Year_Promise:"千年之约谁验"
 KQP_Spirit_Thousand_Year_Promise_desc:"新约既定，期以千年。署名者百二十人，无一人及见其成。少年问于座，谓千年之后吾辈皆骨，此约谁验。主事者答以无人验之。少年又问然则何以取信。答以正因无人可验，故不可毁；可验者，人必改之。少年默然，退而自书其名于末。是夜其父闻之，掷杯于地，终亦无语。翼日，父亦往署。约书藏于群玉阁顶阁，匣以铁包，钥匙分三人执之。"
 KQP_Spirit_Five_Envoys:"五使各持节"
 KQP_Spirit_Five_Envoys_desc:"五使既遣，各持一节，分赴五方。其一至稻妻，候于馆三月，主者不见，使不去。其一至至冬，雪深及膝，使者立门外，雪及其肩，终不移足。或问刻晴，彼既不见，何苦留之。刻晴答以所求非一面之诺，乃使天下知璃月之门未尝阖。及岁暮，五使归者四，其一留而不返，亦不报。五使发舟于南十字港，桅上各挂一节，风大则绳响。"
 KQP_Spirit_Twelve_Echoes:"众名落一纸"
 KQP_Spirit_Twelve_Echoes_desc:"十二家者，昔相攻杀，血未干也。刻晴各遣一使，持一纸，纸上无他语，惟书时会与地。有受而裂之者，有掷诸地者，有闭门不见使者而夜半自至者。及期，堂中设十二席，席各置一盏。先至者三人，相顾不识，各据一隅。日昃，席满，无人先言。良久，一人起曰：「今日不问旧怨，只问来日。」众乃次第开口。十二席设于月海亭西厅，席各一盏，灯油同一瓮所出。"

 KQP_Reform_Tier_1:"变革之阶"
 KQP_Reform_Tier_1_desc:"变革度极低，一切照旧。旧秩序仍在缓慢运转，稳如古钟，也钝如古钟。新律既下，衙门照旧用旧格，匠人照旧守旧尺。吏奉命改一例，改三月，改毕，与原例只差二字。主事者视之，良久无语，命再改。"
 KQP_Reform_Tier_2:"变革之阶"
 KQP_Reform_Tier_2_desc:"变革初启，新律在旧制上试笔，人始低声议论，尚无一人大声表态。茶肆之中，言及新令者必先环视四座；衙门之内，呈文改称新式而内里仍循旧例。老吏笑曰：「此如换衣未换人。」"
 KQP_Reform_Tier_3:"变革之阶"
 KQP_Reform_Tier_3_desc:"变革中程，新旧相持。求进者与守旧者彼此拉扯，谁也压不倒谁。朝堂议事，一议三休；同一案卷，甲批可行，乙批再议。僚属私计，谓此三年所定之事，不及前年一月之多，而其争论之字，可堆满一室。"
 KQP_Reform_Tier_4:"变革之阶"
 KQP_Reform_Tier_4_desc:"变革深入，机器开足马力，效率压过争吵，代价始为人所察觉。工坊昼夜不歇，匠人轮班而卧；账上数目日增，而医馆之中，咳血者亦日增。主事者阅医册，久而不语，命于工坊增设一炉，专烧热水。"
 KQP_Reform_Tier_5:"变革之阶"
 KQP_Reform_Tier_5_desc:"变革过载，旧制动摇，人心浮动。车行太急，先坠者客；政行太骤，先散者民。街市之上，昨日所定之价，今日已改；衙门所发之文，月余即废。老吏将历年文书捆作一束，题曰：「此五年，吾所焚者。」"
 KQP_Inertia_Tier_1:"惯性之阶"
 KQP_Inertia_Tier_1_desc:"惯性极弱，旧制几被挤出局外。新秩序至此，方有喘息之地。旧日执牍者多已迁去，新入者不闻向来如此之语。老吏归省旧署，见案上文书皆新式，抚之良久，不置一辞，退而自去。"
 KQP_Inertia_Tier_2:"惯性之阶"
 KQP_Inertia_Tier_2_desc:"惯性偏低。守旧者退守庙堂与乡里，一时无力回天。庙堂之上，其言渐稀；乡里之间，其势犹存。新令至乡，先经族老一过，合意者行，不合者搁。县令叹曰：「令出城门易，出村口难。」"
 KQP_Inertia_Tier_3:"惯性之阶"
 KQP_Inertia_Tier_3_desc:"惯性中位，旧制尚在，与新律分庭抗礼，改革每进一步皆须付出代价。凡改一例，必先寻一旧例为据；凡立一新司，必先安一旧司之人。主事者尝语左右，谓此非改革，乃与三千年讨价还价。"
 KQP_Inertia_Tier_4:"惯性之阶"
 KQP_Inertia_Tier_4_desc:"惯性偏高。三千年沉淀，凝作巨石，压在车轮之下。车轮每转一寸，皆须先碎此石。碎石者非一人，乃一代。少年吏初入署，见旧例如山，问老吏何以不并废之。老吏答曰：「废之者，须先有人担其责。」"
 KQP_Inertia_Tier_5:"惯性之阶"
 KQP_Inertia_Tier_5_desc:"惯性沉重，旧制未死，新律难立，举国在将变未变之间，凝成一块琥珀。文书依旧例而写，人依文书而行，明知其无用，而无一人先改。客自外邦来，观其衙署三日，归而记曰：「此国非不动，乃动在其内。」"
 KQP_Combo_Twin_High:"两端各执其柄"
 KQP_Combo_Twin_High_desc:"新律与旧制同时绷紧。车轮碾在未拆之旧轨上，行一步，付两价。凡兴一事，既须呈新式之图，亦须补旧式之牍；既须候新司之批，亦须候旧司之印。主事者尝数一堤之成，经手者十七，署印者九，而筑堤者不过三十人。堤在荻花洲北，成之日计之，经手者十七，署印者九。"
 KQP_Combo_Twin_Low:"进退失据"
 KQP_Combo_Twin_Low_desc:"旧者已散，新者未立。市井之人一时不知所守，不知所从，街衢静得令人心空。晨起无钟可闻，暮归无灯可认。有老人立巷口，问其邻曰：「今日谁家主张。」邻人摇首。二人对立良久，各自归户，闭门不出。璃月港巷口石阶三日无人扫，落叶积于阶角，风过则聚。"
 KQP_Combo_A_High:"疾进难收"
 KQP_Combo_A_High_desc:"旧制动摇，新律得以全速铺开。机器轰鸣，把所有人推向同一个方向，快得无人来得及问要去何处。工坊新设十一处，学徒未满即上机；衙门新司三立，司名人尚未尽识。老匠立于厂门，视出入之人，谓其徒曰：「此非行路，此乃随流。」工坊新设于璃月港城西，烟自屋顶出，屋瓦皆黑。"
 KQP_Combo_B_High:"凝滞不进"
 KQP_Combo_B_High_desc:"旧制重新合拢，改革停在半途。一切照旧得几乎听不见回声。新设之司未撤，而文书复由旧司过手；已改之例未废，而执行者仍问旧例。有吏取新旧两册并置案上，翻至同一事，两册所书不同，乃取旧册为准，置新册于架底。玉京台案上两册相并，吏翻至同事，取旧册为准，新册压架底。"

 #################### 刻晴 · 七星革命委员会 · 战后 ####################
 KQP_PW_Dawn_Republic:"废港之上认砖石"
 KQP_PW_Dawn_Republic_desc:"港埠既平之次日，刻晴立于墟中，久不去。左右请命扫除，刻晴曰：「且慢。」命集市民于废墟之前，指断墙曰：「诸君先看清此物如何塌。」众皆仰视，有掩面者。少顷，刻晴曰：「共和自今日始，每一砖须有人认领。」语毕，俯拾一砖，书其名于侧。是日认砖者三百余人，砖不足，有人抱碎瓦而书。刻晴立于璃月港墟中，俯拾一砖，书其名于侧，墨犹湿。"
 KQP_PW_Clear_the_Rubble:"执锹先开一条路"
 KQP_PW_Clear_the_Rubble_desc:"清墟之役，无人愿往，以为贱。刻晴先取锹，入场掘之。众见之，无敢立视，各取器而从。所清者先一路，广容板车，曲折以避未塌之墙。路成，刻晴命吏记其走向，曰：「后日修城，照此路修，勿绕开我等所陷之坑。」吏书于册，书至坑字，笔顿，问坑有几。刻晴曰：「问掘者。」所清之路自璃月港南门起，广容板车，曲折以避断墙。"
 KQP_PW_Rebuild_the_Wards:"重划里坊不问情"
 KQP_PW_Rebuild_the_Wards_desc:"里坊重划，以姓氏、以旧邻为次，不以钱之多寡。有富户托吏求宽半寸，刻晴当堂驳之，曰：「公等旧宅，买而得之；今日之地，分而得之，二账不可合算。」富户面赤而退。有老妪无子，分得屋一间，向吏再拜，吏避不受，曰：「此非吾赐。」老妪曰：「吾知，吾谢者非君，乃此规矩。」璃月港巷口立木牌，上书坊名与户数，字以墨，外涂桐油。"
 KQP_PW_Reopen_the_Markets:"早市一瓯面最廉"
 KQP_PW_Reopen_the_Markets_desc:"复市之晨，刻晴不使人从，独至早市。就一摊，取最贱之面一碗，立路中食之。摊主初不识，既识，惶然欲拜，刻晴止之。食毕付钱，曰：「价由你定，有来查者勿惧，查出弊端，我当之。」摊主执碗良久，忽转身入内，取一旧招牌，抹去积尘，重挂于门。早市在南码头东，摊以旧船板搭成，腥气积于板缝。"
 KQP_PW_Return_the_Fields:"界桩重打契乃撕"
 KQP_PW_Return_the_Fields_desc:"还田之告示遍贴村落，文极拙：谁种之地归谁，旧契尽废，有异议赴衙。村人不信。有老农抱旧契坐于田埂，自晨至暮，不食不去，夜露沾衣。诘朝，见公人持桩至，自东而西，一桩一桩重打。打至其田，公人指桩曰：「此自今日始属尔。」老农视桩良久，乃取旧契撕之，碎片入水而去。公人自璃月港城东打桩至城西，锤痕新白，桩旁土松。"
 KQP_PW_The_Granary_Compact:"十钥开仓缺一人"
 KQP_PW_The_Granary_Compact_desc:"义仓之钥，析为十，分授十人。缺一人至，门不开。有吏劝曰：「十钥易失，不如归官。」刻晴曰：「仓中之粟，众所共凑，则锁当众共开。」一人可开之仓，久之必成一饿死人之仓。吏不复言。是冬大雪，仓开三次，每次十人毕集，无一缺席。市中遂有一语：「十钥齐，米出仓。」义仓在归离原东，屋五间，门以铁包，锁凡十具。"
 KQP_PW_A_Ledger_of_Every_Soul:"一册同行无贫富"
 KQP_PW_A_Ledger_of_Every_Soul_desc:"生民清册，通篇一体，不别贫富，不问亲疏，一户一行，行首书姓名，行末书丁口。有吏言查之太细，废时甚多。刻晴取册示之，曰：「此上一人，昔只为一数；自今日始，各占一行。」吏视册，见其祖名亦在其中，行末注丁口三，遂不复言，退而校其误字。生民清册藏于玉京台档库，架编号至十七，后架犹空。"
 KQP_PW_Schools_of_the_People:"学堂门无石狮子"
 KQP_PW_Schools_of_the_People_desc:"学堂门无石狮，惟悬木板一，书开课之时刻。第一批生徒，有挑夫、船工、卖鱼之子，衣上有腥气，坐次第不安。刻晴亲授一课，讲如何读契约中之陷阱，指一行曰：「此语看似许尔，实为缚尔。」众哗然。有挑夫问：「先生，我等学此何用。」刻晴曰：「识字者多，则诳人者少。」玉京台学堂无石狮，惟悬木板一，上书开课时刻，字为墨书。"
 KQP_PW_The_Peoples_Bank:"铁铺垂塌得首贷"
 KQP_PW_The_Peoples_Bank_desc:"人民银行首贷，与一濒塌之铁铺。铺主不敢受，曰：「恐不能偿。」办事者曰：「息自君出第一炉好铁之日始。」铺主犹疑，以指摩契约边角，久乃按印。三月后，其新打之刀鬻于市，得价善。铺主先偿息，后买炭，炉火自此不复熄。邻铺问其术，曰：「有人肯等我一炉。」铁铺在璃月港城南近南市，屋三间，炉在里间，风箱声哑。"
 KQP_PW_Rails_to_the_Chasm:"凿轨直通层岩口"
 KQP_PW_Rails_to_the_Chasm_desc:"铁轨自港口铺起，直入层岩矿口。第一根枕木，刻晴手自置之，锤三下，木入土半寸。众请退，弗听。既成，刻晴立轨旁曰：「昔运一车矿，须死二人；自今而后，死者石也，非人也。」闻者或笑其痴。至第一列矿车自山口出，声如雷，笑者立道旁，摘帽而立，不复笑。"
 KQP_PW_Workshop_Councils:"撤监工留掌炉人"
 KQP_PW_Workshop_Councils_desc:"工坊自治，凡炉温、料配、工时，皆由掌炉者议定。刻晴撤监工大半，只留记事之人。有老者忧曰：「无人督察，惰者奈何。」刻晴曰：「以炉温付掌炉者，以账本付全坊者，余事彼自议之。」行之三月，惰者仍有，然同坊之人先觉，先责，不必待官。老者复见刻晴，曰：「吾老矣，未见此等约束。」工坊在璃月港城西近码头，炉十七座，监工撤其十二。"
 KQP_PW_The_New_Tea_Road:"茶马新道绕旧关"
 KQP_PW_The_New_Tea_Road_desc:"新茶马道成，绕旧关三处，直通内陆商埠。筑路之骡马队，半为旧日驿卒，改隶于道。刻晴往视，谓众曰：「路成，尔曹之饭碗亦在，惟自今而后，管路者乃行路之人。」一驿卒问：「行路之人如何管路。」刻晴曰：「每季一集，凡行此道者皆可至，议其坏处。」驿卒曰：「如此，则吾可骂石太松乎。」众皆笑。新道自璃月港城南穿谷而过，谷中多石，路面以碎石铺。"
 KQP_PW_Engineers_of_Liyue:"工学堂自看图纸"
 KQP_PW_Engineers_of_Liyue_desc:"璃月工学堂开学，所授者机关、水文、冶金，亦授一课，曰：「此工当为否。」教习出图一幅，问诸生：此桥若成，两岸田淹几何。诸生算至夜。刻晴于开学日曰：「昔吾辈凿山引水，恃一神之力；今后须自识图纸。此非弃神，乃以己手代人之手。」语毕诸生鼓掌，教习止之，曰：「此处宜静，图纸须静看。」工学堂在玉京台东，教习出图一幅，摊于长案，四角以铜压。"
 KQP_PW_Envoys_of_the_Dawn:"使节携账册出港"
 KQP_PW_Envoys_of_the_Dawn_desc:"内战数年，璃月几自提瓦特图上抹去。刻晴初遣使节，所携者账册一箧，口信一句：「璃月可复通商，惟规矩须先言明。」或笑其太硬，曰：「求人而先立规，谁复与尔通。」刻晴曰：「肯先出账者，方谈得上信。」使节出港之日风雨，归时携约三纸，皆以互认关税为始。使节出南十字港之日风雨，归时携约三纸，桅上无旗。"
 KQP_PW_The_Wind_and_the_Free:"蒙德客携风车至"
 KQP_PW_The_Wind_and_the_Free_desc:"蒙德使至，携风车一具、酒三桶。风车置于阶前，风过叶转，满院皆响。使者曰：「此物无用，惟可观。」刻晴曰：「无用之物能存，亦见其国之宽。」使者大笑。谈及治道，使者曰：「吾国不劳神明。」刻晴曰：「吾国方学不劳神明。」二人相视而笑。所署第一纸，为税率互认之单，薄薄一页。风车置于玉京台阶前，风过叶转，满院皆响。"
 KQP_PW_The_Island_of_Thunder:"雷雨中两船并泊"
 KQP_PW_The_Island_of_Thunder_desc:"稻妻锁国多年，航路久断，使者至时，海上旧怨未消。谈判之初，座中无人先言旧事。刻晴不绕，直曰：「锁国所锁者，向来是锁门之人。」稻妻使者色变，久之乃曰：「此语吾当录归。」是日雷雨，两国商船第一次并泊于港，桅樯相望，水手各立舷边，无一人语，亦无一人去。稻妻商船第一次并泊于南码头，桅樯相望，水手各立舷边。"
 KQP_PW_The_Land_of_Wisdom:"须弥书至皆盖印"
 KQP_PW_The_Land_of_Wisdom_desc:"须弥学者至，载书二十箱，图纸百余幅。刻晴命腾半座学堂以置书，许人入观。惟于各书扉页，统一加印四字：「知归众人。」有学者不悦，谓书为私授。刻晴曰：「诸君所授于璃月者，不当只授璃月之官。」学者默然，后于讲席上自举此事，曰：「彼言有理，吾当时不乐。」须弥书二十箱入玉京台学堂，箱以杉木，箱上墨书国名。"
 KQP_PW_The_City_of_Judgment:"法典对读一夜灯"
 KQP_PW_The_City_of_Judgment_desc:"枫丹使者陈法典一部于案，厚几盈尺。刻晴读之一夜，灯三易。诘朝，携璃月自订章程赴会，逐条比对，凡有异同，皆请使者释其义。使者初以为诘难，既而改容，曰：「君读得细。」刻晴曰：「法不患多，患只许一人诵之。」终乃互易判词范本，两不亏。枫丹法典陈于玉京台长案，皮面装，厚几盈尺。"
 KQP_PW_The_Winter_Court:"北国合约留后手"
 KQP_PW_The_Winter_Court_desc:"北国合约，文辞甚美，条款处处留门。刻晴读三遍，批其末一行：「可合作，不可抵押。」使者面色一沉，问何以拒之速。曰：「吾算过，算得比君等清。」使者曰：「愿闻其数。」刻晴不答，以合约还之，曰：「君自算。」散后命以最厚之柜藏此约，钥别置一所。至冬合约藏于璃月港府衙最厚之柜，钥别置一所。"
 KQP_PW_The_Teyvat_Convention:"末添一句众生平"
 KQP_PW_The_Teyvat_Convention_desc:"提瓦特通行公约议成之日，与会者各让一步，文字屡易。至末页，刻晴取笔添一句：「此约之内，众生平等，不问神眷。」座中一时无声。有使者欲言，视左右无人附和，遂止。其纸后为好事者拓之，悬于诸港会馆。拓者多不识其字，惟知末行最重。公约拓本悬于南十字港会馆壁上，纸以浆粘，边角转黄。"
 KQP_PW_The_Empty_Seat:"三张空椅并排设"
 KQP_PW_The_Empty_Seat_desc:"帝君之神位空，商会之首座空，天空岛则并一言亦无。刻晴命取三椅，并排设于议事厅前，不加座签。众不解。刻晴曰：「昔者吾辈行事，先视人色；今三椅皆空，正好自视坐得正否。」有议者问此椅何时可撤。曰：「待吾辈议事不必再看空椅之日。」是日议事，无一人坐于三椅之侧。三椅并排设于玉京台议事厅前，不加座签，无人坐其侧。"
 KQP_PW_Question_the_Sky:"神谕天象逐条勘"
 KQP_PW_Question_the_Sky_desc:"刻晴命集历朝神谕、天象、谶纬为一编，逐条标注真伪，凡不可考者，书曰存疑。司其事者愈查愈惊，至一谶，验之三事皆合，持卷请刻晴定夺。刻晴视之，曰：「合者书合，不合者书不合，不问其为神为伪。」遂于编末亲书一行：「此编非为定论，乃为后人留一可自判之书。」神谕之编藏于玉京台石室，编末亲书一行，字稍小。"
 KQP_PW_Seal_the_Abyss:"合金新法再封渊"
 KQP_PW_Seal_the_Abyss_desc:"巨渊之裂，再封一次。所用者新铸之合金，所施者新定之加固法，皆前次所未有。刻晴亲下井口，立于升降架上，看末段闸门一寸一寸落。石屑自顶坠，击其肩，不为动。闸合，声沉。刻晴谓守者曰：「深渊乃按月必偿之债，今日多偿一分，后人少赌一命。」守者问：「几时偿尽。」曰：「不在吾辈。」闸门在层岩渊口，一寸一寸落，石屑自顶坠，击人之肩。"
 KQP_PW_The_Mortals_Choice:"门楣刻上自决语"
 KQP_PW_The_Mortals_Choice_desc:"神之眼、仙人、天命之辨，议会争数月。有主尽废者，有主存其祀者，有言不可犯天者。刻晴听毕，只曰：「璃月此后由谁主张，不在其位之高下，而在其理之可否。」众议遂定。命刻其语于议事厅门楣，匠人三易其稿，字不甚工。有议者请易以善书者，众皆不许，曰：「此字是当日所说，非今日所写。」其语刻于玉京台议事厅门楣，匠人三易其稿，字不甚工。"
 KQP_PW_Godless_Republic:"去神而立国"
 KQP_PW_Godless_Republic_desc:"国号定曰无神之邦，书之于册。书时，有老吏落泪，有少年拊掌，亦有默然者。刻晴不辩此为勇为妄，只命以极细之公粮账，户给一纸。曰：「神明所予之安，此后吾辈自予；不能予时，则明告以不能。」有民问：「若神明复至，何以处之。」刻晴曰：「至则同坐，议而后行，无他。」国号书之于册，册藏玉京台，公粮账户给一纸。"
 KQP_PW_Envoys_to_Celestia:"使还空手批已知"
 KQP_PW_Envoys_to_Celestia_desc:"往天空岛之路，始终无人应。刻晴仍遣使节，所携者一书，书曰：「若天理尚在，请现身一谈；若不在，请许吾辈自走。」使节去三月，归时两手空空，惟言至其下，云不开，呼之无应。刻晴受其报，于回执末批二字：「已知。」使者问：「既知，复遣乎。」曰：「遣。不为答，为使后世知吾曾问。」使节归，言至玉京台所遣之路尽处，云不开，呼之无应。"
 KQP_PW_The_Abyss_Debt:"井下死者各立碑"
 KQP_PW_The_Abyss_Debt_desc:"层岩井下死者之名录，又增一页。刻晴命为每一名立碑，不问其生前属何营。有吏难之，曰：「敌我未分，碑文何以书。」刻晴曰：「书其名，书其年，书其死所，余皆不书。」碑成，列于井口之侧，长短不齐。有妇人携子寻碑，抚一名而哭，哭毕，以手拭碑上灰，携子而去。"
 KQP_PW_The_Peoples_Army:"军旗换过口号新"
 KQP_PW_The_Peoples_Army_desc:"新军改名人民军，饷如旧，旗则新制。检阅之日，刻晴立台上，谓众曰：「此军旧规为一不退，今规为一知所护者为谁。」台下寂然，久无人应。少顷，一老卒出列，举手曰：「护者，吾家在市东。」众皆随呼，声不甚齐，与旧日口号大异。台上诸将相顾，刻晴不语，惟按刀而立，目视其旗。检阅在玉京台校场，场地平，四周以木栅，栅已旧。"
 KQP_PW_Fortify_the_Passes:"关墙留门放难民"
 KQP_PW_Fortify_the_Passes_desc:"山口关隘，次第重修。图纸上多一旧日所无之式：关墙须留一门，广容板车，以备难民。有将领不解，曰：「留门则守难。」刻晴曰：「关所以挡兵，非挡人。若兵至而民先在墙下，此门即活人数千。」将领犹疑，请减其广。刻晴不许，取笔于图上添注：「此门不许塞，塞者论罪。」关隘在明冠峡，图上添一门，广容板车，以备难民。"
 KQP_PW_The_Southern_Watch:"南疆募猎户为戍"
 KQP_PW_The_Southern_Watch_desc:"南疆戍卫之队，募山民猎户充之。刻晴所下第一令，不在练阵，而在认路：某道可走骡马，某崖可藏十人，某涧春涨而秋涸。众初以为琐，及一队循其所记之道夜行百里，不折一人，乃服。刻晴曰：「守土者，先须识此土。」识土者，非识其图，乃识其石与草。南疆诸山在天衡之南，山路错杂，外人入则迷。"
 KQP_PW_Militia_Reform:"民兵按坊造名册"
 KQP_PW_Militia_Reform_desc:"民兵之制改，自人数而自户籍。每坊置一册，书户主、丁口、所业、所用之械。训练课目增一条：先学不误伤同伍。有教头问：「此岂非废枪。」刻晴曰：「上过阵者方知，最难者枪口抬高一寸。」册成，坊坊相核，有冒名者三人，自缚至阶下请罪。坊册藏于璃月港里正之家，一书户主，二书丁口，三书所业。"
 KQP_PW_The_Chasm_Garrison:"巨渊戍期减半"
 KQP_PW_The_Chasm_Garrison_desc:"巨渊戍卒，旧例一戍半载，至是减其半，饷倍之。或问费从何出。刻晴曰：「井下熬人，不可使之久居无光之处。吾所要者，非敢死之卒，乃尚记天光作何状之卒。」令下之日，戍者出井，仰面而立，有以手遮目者，有久不言语者，伍长不催，任其立至日落。戍卒出层岩渊口，仰面而立，有以手遮目者。"
 KQP_PW_Arsenal_of_Liyue:"兵工入山刻匠名"
 KQP_PW_Arsenal_of_Liyue_desc:"兵工之厂自港口移入山坳，避人耳目，亦避海风之蚀。产量倍于旧，近村以运炭、送饭、补履之役渐富。刻晴定一规：凡出厂之物，必刻匠名于阴处。匠人不解，谓兵者凶器，留名何为。刻晴曰：「有名可寻，则不敢滥造；有主可问，则不敢轻杀。」兵工之厂自南码头移入黑岩厂山坳，烟自崖顶出。"
 KQP_PW_The_Great_Debate:"议事厅开门三日"
 KQP_PW_The_Great_Debate_desc:"共和既立，途向未定。刻晴命撤议事厅之槛，门开三日，不问出身，皆可登阶陈言。三日之内，堂上无虚席，阶下坐者塞至街口。至第四日启门，纸堆几及人腰，争犹未止。有吏请止之。刻晴视纸山曰：「吵而不完，最好；若有一日无人再吵，方是真无一人敢言。」玉京台议事厅撤槛，门开三日，阶下坐者塞至街口。"
 KQP_PW_Federal_Congress:"散权入里巷"
 KQP_PW_Federal_Congress_desc:"人民大会之议，主分权：里坊各举一人，行业各举一人，层层而上，不相统属。反对者曰：「如此则散，散则无以集事。」刻晴曰：「散者犹可复聚；断者断在一根绳上，绳一绝则尽绝。」言毕，亲按首印。印泥未干，纸角压出一褶，久不消。人民大会册首按手印于玉京台，印泥为朱，边有晕。"
 KQP_PW_Free_Assembly:"卖菜妇登堂问吏"
 KQP_PW_Free_Assembly_desc:"自由议席不设门限，有人举之即可入座。首会之日，一卖菜妇人起而问旧日大吏某：去岁涨税之令，公所署乎。满堂寂然，笔皆停。大吏起坐三次，终不能答。刻晴坐末排，未出一言。散后独留，取是日记录抄一份，纳于袖，归而藏之。首会于玉京台，一卖菜妇人起而问旧日大吏涨税之令，满堂寂然。"
 KQP_PW_A_Thousand_Schools:"讲坛各悬木牌"
 KQP_PW_A_Thousand_Schools_desc:"百家之说复起，学堂、书院、讲坛遍于城内外。刻晴不立官学，不定正统，惟命于每所讲坛门上钉一木牌，刻八字：「说得是则听，说不通则散。」有老儒以为亵。刻晴曰：「怕争之政，早已无可争之物。」是年秋，城中共开讲坛四十七处，夜夜有灯。讲坛遍于璃月港城内外，四十七处，夜夜有灯。"
 KQP_PW_The_Labor_Charter:"工时工价著为令"
 KQP_PW_The_Labor_Charter_desc:"劳工宪章成，凡工时、工价、伤病、学徒皆有明文。老商号十余家联名上书，言此乱市。刻晴不辩，只请诸掌事往码头看一个下午。归时无人再言。越三日，宪章悬于议事厅东壁，其旁并悬联名之书，不加一字批注。过者驻足，先读宪章，后读其书。宪章悬于玉京台议事厅东壁，其旁并悬联名之书。"
 KQP_PW_Export_the_Dawn:"商船载章程出海"
 KQP_PW_Export_the_Dawn_desc:"璃月船队始驶远港，所载者不惟货，亦有章程一函：税如何定，讼如何断，合约如何署。或问：「此非以璃月之法强人乎。」刻晴曰：「吾辈不为人主，只为人示。」示而不从，亦不强。有船长问：「若彼邦拒之。」曰：「拒者拒一纸，不拒其利；利在，纸自有人来取。」璃月船队自南十字港驶远，所载者货，亦有章程一函。"
 KQP_PW_Union_of_Teyvat:"诸国使节共一席"
 KQP_PW_Union_of_Teyvat_desc:"提瓦特联合之议既出，赞与弹者各半。刻晴不强其成，惟移长桌一张于厅中，请诸国使节列坐，自谈其约。是日谈至夜分，无人先退。散后撤席，桌边留一圈痕，不知何人信手所画，圈之，适套众椅。侍者欲拭之，刻晴止之，曰：「留此。」长桌一张移于玉京台厅中，诸国使节列坐，谈至夜分。"
 KQP_PW_Banners_of_the_Free:"新帜初悬船桅"
 KQP_PW_Banners_of_the_Free_desc:"自由之帜初悬于船桅，风至而展。码头之上，有欢呼者，亦有拊手而立、终不一言者。刻晴就默者而语曰：「君等可不喜此帜。然君等所以能明言不喜，正由此帜。」能容不喜之帜，方配悬于桅上。默者中一人良久曰：「既如此，吾且看它一年。」刻晴曰：「一年之后，君自决之。」自由之帜悬于璃月港船桅，风至而展，垂则如褶。"
 KQP_PW_The_Eternal_Republic:"四字刻上城门日"
 KQP_PW_The_Eternal_Republic_desc:"万世共和四字刻于城门之日，石屑未扫，刻晴立其下，自晨至午不去。左右请其言，刻晴不设誓，不称天命，惟曰：「吾此生或只成一事，使后人不必倚一人而活。」言已，转身入那座无神位之厅。门合，阶上石屑为风所卷，贴于字脚，形如积尘。刻晴立璃月港城门下，自晨至午不去，石屑为风所卷，贴于字脚。"
 KQP_PW_The_Vanguard:"凡事付算筹"
 KQP_PW_The_Vanguard_desc:"先锋委员会立，凡决断尽归数人，其辞曰：「战时不可散。」署状之日，刻晴执笔久不下，墨聚欲坠。左右不敢催。既署，语近侍曰：「吾知此物之险，甚于刀。所望者，他日收得回来。」近侍问：「若收不回。」刻晴不答，以纸覆案，命藏其状于最上格。署状既成，藏于玉京台最上格，以纸覆案，墨聚欲坠。"
 KQP_PW_Steel_Discipline:"赏自刀口出"
 KQP_PW_Steel_Discipline_desc:"钢铁纪律行，赏不逾时，罚不待旦。有以旧功求者，有跪阶呼冤者，刻晴皆不见，惟命吏以律对。一日夜坐，取随身手册，于首叶书一行：「吾所惧者非冤，乃他日无人敢以实告。」书毕，以指按其字，墨未干，指上留痕，久乃拭去。随身手册藏于玉京台书案，首叶书一行，墨未干留痕。"
 KQP_PW_Silence_the_Doubters:"止疑令下议堂静"
 KQP_PW_Silence_the_Doubters_desc:"止疑之令既颁，议事厅顿静。旧日争声彻于廊庑，至是惟闻翻纸。刻晴行于长廊，闻壁后有人低语，语未毕而止，无一人抬头。她忽忆少时所读之书，书中有言：「城之最静者，往往最危。」是夜归署，取此书重读，读至此处，以指甲划其行，划痕深可辨。玉京台议事厅顿静，长廊壁后有人低语，语未毕而止。"
 KQP_PW_Sword_of_the_Republic:"壁上悬剑无人佩"
 KQP_PW_Sword_of_the_Republic_desc:"共和之剑悬于议事厅西壁，无剑鞘之饰，亦无佩者。刻晴每数日一至，以素布拭之，自锋至锷，不遗一隙。或问：「既不佩，何拭之勤。」曰：「此剑最好终身不出鞘。然若有一日它自生锈，那才是吾辈当惧之事。」问者视剑，复视其手，见指上有薄茧，乃不言。剑悬玉京台西壁，无鞘饰，无佩者，每数日一拭，自锋至锷。"
 KQP_PW_March_North:"北上令添四字"
 KQP_PW_March_North_desc:"北上之令下，刻晴独对地图一夜。图中自璃月至至冬，一道如线，穿山、渡水、越雪原。诘朝，取令视之，于末添四字：「勿伤百姓。」付驿使时，手迟于常。驿使接令，觉其纸微湿。行至门外，回视，见刻晴犹立图前，以指按那道线之起处。地图摊于玉京台案上，自璃月至至冬，一道如线。"
 KQP_PW_The_Iron_Commune:"一城共转一磨"
 KQP_PW_The_Iron_Commune_desc:"铁血公社行，举城如机，人如齿。钟声定起卧，号筒定饮食，产量月增而笑声月减。刻晴登厂中高台，下视人群，往来如蚁，首尾相衔，不见其面。立良久，谓左右曰：「吾今日不能自辨，所造者是一国，抑一器。」左右不敢对。台下锤声不绝，如应其问。刻晴登黑岩厂高台，下视人群，往来如蚁，不见其面。"
 KQP_PW_Torch_and_Blade:"炬短刃长亲定稿"
 KQP_PW_Torch_and_Blade_desc:"炬与刃为共和国徽，一明一暗，一进一守。刻晴亲绘其稿，至末笔忽止，笔悬于纸上者半晌。谓画工曰：「炬画矮些，刃画长些。」画工问其故。曰：「吾常觉，吾辈手中所握者，比手中所举者更沉。」稿成，徽悬于厅，炬光偏下，人初见之，皆以为画者失手。徽悬于玉京台议事厅，炬光偏下，人初见皆以为画者失手。"
 KQP_PW_The_Red_Citadel:"城塞落成独登楼"
 KQP_PW_The_Red_Citadel_desc:"赤色城塞落成之日，全城戒严，市门尽闭。刻晴独登城头，不使人从。脚下之城，以纪律为砖，以畏惧为灰，垒之数月而成。海风自东来，挟咸气，吹其衣。她忽忆内战初起之夜，忆及曾言使人人皆得立起之语。喉间微动，终未成声。守卒远处见之，以为将有所言，久而不闻。璃月港戒严之日，市门尽闭，刻晴独登城头，不使人从。"
 KQP_PW_The_Last_Veterans:"铁牌刻名授老兵"
 KQP_PW_The_Last_Veterans_desc:"内战老兵集于港口，人授铁牌一枚，上刻其名。刻晴不至台，不致辞，自队首至队尾，一一与握手。有一断臂老卒，受牌后不去，问曰：「此战到底值不值。」刻晴立良久，曰：「吾不知。然君能当面以此问吾，便已值了。」老卒视其手，又视其牌，纳入怀中，转身入列，不复言。老兵集于南码头，人授铁牌一枚，上刻其名与营次。"
 KQP_PW_The_Name_of_Keqing:"拒改港名另刻石"
 KQP_PW_The_Name_of_Keqing_desc:"有议者请改港口为玉衡港，以纪其功。刻晴不许，曰：「民之记吾与否，不当系于一块牌上之字。」议者退，而牌终立。既立，刻晴亲书六字付匠：此地属众人。匠问：「何以不书君名。」曰：「名在一时，此六字在久。」牌成之日，无人鸣炮，惟有过者驻足，以手摩其字。牌立于璃月港市中，上刻六字，过者驻足，以手摩之。"
 KQP_PW_Liyue_Reborn:"独行全城记一册"
 KQP_PW_Liyue_Reborn_desc:"最后一片废墟既清，刻晴独自遍行全城。先至码头，次至学堂，次入那座无神位之厅。所见者，皆以炭笔记于小册：「某处新砌，某处犹缺，某处有童子嬉于阶。」至末页，书曰：「此吾辈所换得者，说不上好，也说不上坏，只是从此由吾辈自任其责。」书毕，合册，天已向暮。先至南码头，次至学堂，次入无神之厅，至末页书毕，天已向暮。"
 KQP_PW_The_Long_Morning:"门前长明灯"
 KQP_PW_The_Long_Morning_desc:"议事厅门前有灯一盏，夜夜不熄，风雨如晦亦然。刻晴渐老，发半白，而厅门常开。或问：「明公不畏身后无人乎。」刻晴笑曰：「吾所忧者，非无人接，乃接者不知此灯何为而点。」问者曰：「然则何以教之。」刻晴指灯曰：「不必教，但使之夜夜看见。」灯在则问在，问在则灯不虚燃。玉京台议事厅门前有灯一盏，夜夜不熄，风雨如晦亦然。"

 KQP_postwar_category:"共和新章"
 KQP_postwar_category_desc:"战事既毕，复建与建政诸务尽归此府。委员会收战时之手，转而治民生、整政务、复秩序。此间事最琐碎，却定新政权能立不能立，能久不能久，亦定战时之诺可践不可践。民生一稳，新政权方算落地。"
 KQP_decision_pw_public_granary:"开仓平粜"
 KQP_decision_pw_public_granary_desc:"粮价一涨，人心即晃。开仓平粜，最亏本。户部请缓。刻晴曰：「亏在账上，赚在夜里。穷人能睡一夜安稳觉，此钱便不冤。」遂开仓。仓吏私留一石，刻晴命还其半，曰：「彼家亦饿。」米价三日而平。开仓之日，粜米之摊列于璃月港南市街口，担夫排队至巷尾。"
 KQP_decision_pw_public_works:"修路凿渠"
 KQP_decision_pw_public_works_desc:"修路、挖渠、筑堤，皆不急之务。或问：「战事方息，何不省此钱。」刻晴曰：「闲手无活，则生乱。」批钱之时，从不问赚不赚，只问能雇几人。吏答能雇三千。刻晴曰：「太少，再算。」所修之路自璃月港南门起，穿谷而过，路面以碎石铺。"
 KQP_decision_pw_literacy_drive:"设塾教字"
 KQP_decision_pw_literacy_drive_desc:"识字班设于最陋之弄堂，桌为旧门板，笔为炭条。所教者，非经史，乃借据一张、告示一张。教者曰：「识此二纸，则无人能骗汝。」一老妇学半月，归取旧契自读，读至中段，忽拍案大骂其亡夫之兄。众人问故。老妇曰：「此契写卖，非借也。吾夫押了一世，吾今方知。」识字班设于绯云坡弄堂，桌为旧门板，凳为石墩。"
 KQP_decision_pw_peoples_court:"里巷评理"
 KQP_decision_pw_peoples_court_desc:"评理不设于衙门，设于弄堂。街坊自推三人，一老、一妇、一少年，坐矮凳上，听两造对质。案小者，当场了断，不必上呈。或问：「市井之人，安能断狱。」刻晴曰：「衙门高墙之内所断者，多非公道，乃体面。两邻点头，方是公道。」矮凳三张置于绯云坡弄堂口，旁有石阶，听者坐于阶上。"
 KQP_decision_pw_veterans_relief:"恤残归伍"
 KQP_decision_pw_veterans_relief_desc:"内战既毕，断臂折足者满街。有司请以功簿为序，功高者先给。刻晴曰：「不问功，只问缺。」遂遣吏一户一户叩门，问其所缺：一口锅，一副拐，一块可安身之薄地。吏问：「无功者亦给乎。」刻晴曰：「彼亦为国断一足。」吏叩门自璃月港城西起，一户一户，日行三十家。"
 KQP_decision_pw_grain_reserve:"丰年积仓"
 KQP_decision_pw_grain_reserve_desc:"丰年积仓，荒年开仓，此共和国立国第一约。户部谏曰：「眼下紧日子，何不留此钱。」刻晴曰：「挨过饿者，方知空仓之可畏。」遂减他费三成，尽以入仓。仓成之日，刻晴亲启其门，抓米一把，放手心看良久，曰：「有此，吾夜可睡。」义仓在归离原东，屋五间，梁上题年号，字已褪。"
 KQP_decision_pw_envoy_mondstadt:"遣使蒙德"
 KQP_decision_pw_envoy_mondstadt_desc:"蒙德之自由，与璃月之共和，望之似远亲。使者归，携互市清单一份、客气话一句。刻晴取清单，看三遍，忽问：「彼城不向神明交账，以何管之。」使者不能对。刻晴曰：「再往。不问货价，只问其城规为谁所立，违者如何。」使者归自蒙德，舟泊南十字港，桅上犹挂彼邦之旗。"
 KQP_decision_pw_envoy_inazuma:"遣使稻妻"
 KQP_decision_pw_envoy_inazuma_desc:"稻妻锁国旧事，与璃月封港何其相似。使者泊岸之日，雷雨大作，衣尽湿。对坐者亦一使臣，两人不谈货，只谈各城自封锁中学得何物。其人曰：「锁得住者只是船，锁不住人心。」使者归述此语。刻晴闻之，良久曰：「此语可书于壁上。」使者自稻妻还，舟泊云来海岸，衣未干而先报事。"
 KQP_decision_pw_chasm_patrol:"沉渊巡边"
 KQP_decision_pw_chasm_patrol_desc:"巨渊之债，按月要还。巡边之队携新铸之械下沉，升降之索，一根一根换成双股。有老矿工抚索曰：「此索若断，下面之人便回不来。」队长曰：「故换双股。」老矿工曰：「双股亦会断。」队长曰：「那便再加一股。」升降之索系于层岩渊口，索粗如臂，双股相绞。"
 KQP_decision_pw_universal_school:"立学遍城"
 KQP_decision_pw_universal_school_desc:"学堂之费，按户产分三等：最贫者免，中者半，最富者倍。有富室讼于议会，谓是劫富济贫。刻晴曰：「一城识字者多，则契可不诈，税可不逃，讼可不繁。此利归谁。」讼者不能答。刻晴曰：「汝家亦居此城。」学堂设于玉京台东，号舍百二十间，间广三尺。"
 KQP_decision_pw_newspaper:"刊行黎明"
 KQP_decision_pw_newspaper_desc:"共和国第一份报，不登号令，只登账目与议会之言。有僚属谏曰：「争论形于纸上，恐乱人心。」刻晴曰：「人心之乱，不在见争，在不见争而忽受其断。」报出三日，卖尽。五日，有市人以报上账目质于税吏，税吏无辞以对。报印于璃月港城西印坊，墨气终日不散，纸色微黄。"
 KQP_decision_pw_proclaim_republic:"颁章七字"
 KQP_decision_pw_proclaim_republic_desc:"宪章极长，首条只七字：「权出于民，还于民。」刻晴不宣读全文，命人抄百份，分送各里坊，愿读者自取。有老吏问：「不宣读，民安知之。」刻晴曰：「宣读者，听之即忘；自念者，一遍入心。」旬日之后，坊间小儿亦能诵此七字。宪章抄百份，分送璃月港各里坊，坊口木牌下置一几，任人自取。"

 LYY_Event.8001.t:"废墟上众手认砖"
 LYY_Event.8001.d:"内战既毕，次日。港口半毁，栈桥断为三段，仓房存其四。\n刻晴立于废墟之上，不发清扫之令。众怪之。刻晴曰：「先看清此物如何塌。」乃命人分类：砖归砖，木归木，铁归铁。初，众人不知何用，惟依令搬。搬至第三日，有老匠指一墙曰：「此墙非炸塌，是自内塌。」众视之，见墙心之砖，皆碎。玉衡至，问：「何故。」老匠曰：「砌时灰少。」刻晴曰：「谁砌。」老匠曰：「不知。」刻晴曰：「查。」\n查三日，得其人名，其人已死。玉衡乃命：凡此后砌墙，灰不足者，匠与监者同罚。又命：每砖刻一记号，记其窑。有吏问：「刻记号何为。」刻晴曰：「使此城每一块砖，皆有人认领。」吏曰：「砖多，刻不胜刻。」刻晴曰：「刻一块，算一块。」\n令下，匠人不悦。有老匠曰：「此非疑吾辈乎。」玉衡曰：「非疑，是记。他日墙塌，可寻其人；其人不在，可寻其窑。」老匠默然，取砖一块，亲刻其名于侧。\n月余，城西一段新墙成。有人夜过，以手摩砖上字，字浅，指下可辨。天后宫西新墙之砖，多取旧墙之整者，砖侧窑印犹存。"
 LYY_Event.8001.a:"自此每砖皆有主"
 LYY_Event.8001.b:"以墟为碑，记此代价"
 LYY_Event.8002.t:"刻晴先举第一锹"
 LYY_Event.8002.d:"清墟之役，无人愿先下手。众立墟前，相顾。\n刻晴至，不言语，取铁锹一柄，径入墟中。第一锹下于断墙之根，土硬，锹入三寸。第二锹，撬出一砖。第三锹，墙动。众视之。有老兵先出，取锹，继之。俄而十人，俄而百人。铁锹碰石之声，渐成一片。\n刻晴搬砖于道侧，搬至午，让出一条路，宽可过板车。乃命人取绳尺，量其路，记其向。有吏问：「此路何以记。」玉衡曰：「此后修城，照此路修。」吏曰：「此路乃随手让出者。」刻晴曰：「随手让出者，人所行之路也。」勿绕开。\n是日收工，众手上皆血泡。有少年坐于砖上，语同伴曰：「今日无一人口号。」同伴曰：「何须口号。」刻晴在侧闻之，不语，以袖拭面。\n翼日再至，见昨日让出之路已被人踏平，路侧有小儿以炭画方格，跳而过之。玉衡立视良久，语左右曰：「此路已有人用。」左右曰：「用者小儿。」刻晴曰：「小儿亦是人。」墟在港口北，瓦砾堆高及檐，中有断梁，梁已炭化。"
 LYY_Event.8002.a:"依众足所向铺路"
 LYY_Event.8002.b:"全城推倒重来，另起新图"
 LYY_Event.8003.t:"里坊重划分比邻"
 LYY_Event.8003.d:"里坊重划之令既下，匠人持绳墨入巷，逐户而量。旧邻仍归一坊，富室欲多占半寸者，不许。有司于巷口立木牌，书曰：「尺有所归，寸有所属。」\n未几，一绸商托人求见，具礼于庭。其人曰：「某家旧宅三进，愿以十倍之值，易一坊之地。」刻晴不视其礼，惟取图铺案，指其一角曰：「此处已画与他人。」来人曰：「然则吾家旧宅，当作何算。」刻晴曰：「旧宅者，尔以钱买之；今之地者，吾以尺分之。」两笔账，不可并作一笔算。其人曰：「量地之绳，亦认钱乎。」刻晴曰：「绳不认钱，持绳者亦不认。」\n其人默然，取礼而去。及出巷口，见一老妇抱孙坐于新界石上，指牌上名字教之识字。绸商驻足良久，老妇仰首问曰：「客官亦搬来么。」绸商曰：「搬来。」老妇曰：「好，此处晒得着太阳。」绸商乃命从者以车送其家具，自归新坊。是夜坊中灯火次第而明，无一户争界者。里坊木牌立于璃月港巷口，牌上书坊名与户数，字以墨，外涂桐油。"
 LYY_Event.8003.a:"地按人头分，旧契作废"
 LYY_Event.8003.b:"承认旧契，只调整超额"
 LYY_Event.8004.t:"早市立食一瓯面"
 LYY_Event.8004.d:"复市之日，天未明，刻晴微服至早市。市中炉火方起，烟气塞巷，人声与水声相杂。行至一摊，取钱买面一碗，最贱者，立于路中食之。面上无肉，惟葱二茎，汤清可见碗底。汤尽，碗置于案。\n摊主惶恐，搓手曰：「此摊鄙陋，恐污贵人之口。」刻晴曰：「价几何。」曰：「不敢言价。」刻晴曰：「自今日起，价由尔定。有司来查，尔不必惧；查出弊端，吾任之。」摊主愕然，半晌不能对，忽转身入内，取木牌一面出，上积内战三年之尘，以袖拭之，复悬于檐下。\n是日市中开张者，倍于所期。有老吏私问于从者曰：「此一饭之劳，何益于政。」从者曰：「君不见招牌上尘乎。凡积尘三年者，皆今日始拭。」老吏默然，归而书之于簿，书至半，搁笔曰：「此条不入考功册。」从者问：「入何册。」老吏曰：「入我私记。」南市在璃月港城南，摊以板为案，灶以砖砌，烟自檐下出，弥漫半街。"
 LYY_Event.8004.a:"市价由肆主自定"
 LYY_Event.8004.b:"限价定市，先保民生"
 LYY_Event.8005.t:"一纸还田换界桩"
 LYY_Event.8005.d:"还田之令既颁，告示写于糙纸，字大如拳，辞甚拙：凡所种之地，即归种者；旧契一概作废；有异议者，赴衙门陈之。观者围三重，有识字者为众诵之，诵至旧契作废一句，众皆哗然。一老者举契曰：「吾契上尚有官印。」旁人曰：「官印二字，今亦作废纸看。」老者张口，竟无一语。\n有老农张姓者，抱旧契一卷，坐于田埂，自晨至暮。人劝之归，不应。夜露下，以契裹身而卧。翼日天未明，闻田间有钉木之声，起视之，见公人五六，持桩与绳，逐段重打界石。每下一桩，必呼其名，问此段属谁。呼至张姓，老农应声，声已哑。\n老农乃出怀中契纸，就田水润之，撕为四片，掷于新土。碎纸落处，随风吹散。他俯身捧新翻之土一掬，攥于掌中，久而不释。旁有少者欲语，为其父以目止之。是日打桩至日昃，界石成行，直如绳墨。张姓归家，取碗盛土，置诸灶头，其后岁岁易之。界石取天衡溪中圆石，石上有旧刻，刻者不知何人。"
 LYY_Event.8005.a:"还田于耕者，重打界桩"
 LYY_Event.8005.b:"田归公仓，按劳分配"
 LYY_Event.8006.t:"义仓十钥分众手"
 LYY_Event.8006.d:"义仓既成，锁凡十具，串于一环。刻晴命以钥十枚分授十人：坊正一，船行一，铁作一，织户一，米商一，药铺一，学塾一，渡口一，井户一，仓丁一。十钥齐，门乃开；缺其一，门不开。\n有僚属谏曰：「十人持钥，事必迟误；且人心难保，万一有私。」刻晴曰：「仓中之粟，众人所凑；锁仓之钥，即当众人所持。」一人可开之仓，久必成饿死人之仓。谏者曰：「若遇急变，待十人毕集，米已尽矣。」刻晴曰：「急变之时，正须十人毕集。」\n有仓丁闻之，私语同列曰：「吾持一钥十年，不能独开，亦无一人能独开。」同列曰：「此非苦事。」仓丁曰：「初以为苦，今以为安。」众不复言。后三年岁歉，邻邑仓廪多为守吏所盗，璃月诸仓独无耗。十钥中有一枚，其后入于镇上一私塾，垫于书箱之下。塾师谓弟子曰：「此钥不开仓久矣，然使汝曹知仓为何物。」义仓在城东天后宫侧，屋五间，门以铁包，锁为铜，钥为铁。"
 LYY_Event.8006.a:"钥匙分十户共管"
 LYY_Event.8006.b:"收回钥匙，由官总揽"
 LYY_Event.8007.t:"生民清册各一行"
 LYY_Event.8007.d:"生民清册重修，自城及乡，逐户而录。其式一：某里、某户、男几、女几、年几何、业何业。不以贫富异格，不以亲疏减笔。册成，堆于案上，高与人齐。\n有老吏抱牍而入，言曰：「如此查法，一里须三日，一城须三月，吏力不逮。」刻晴不语，取一册举手示之，曰：「此册之上，人各一行。」前此十年，彼辈不过数上之一画。今使其各占一行，虽慢，不可省。吏曰：「然则豪右之家，亦与编户同格乎。」刻晴曰：「同格。」\n老吏俯首，接册而退。是日所书，笔画异于常日，横平竖直，无一处涂抹。同舍吏问其故，老吏曰：「写得潦草，便对不住那一行。其后册之副本置于坊门，任人自阅，有妇人携子往观，指册上名字教之曰：此是尔父，此是尔兄。」册成三月，有逃户自归，请入册。吏问其名，其人曰：「此名久无人唤。」生民清册自玉京台发下，厚纸双面书，正面丁口，反面田宅。"
 LYY_Event.8007.a:"一人一行，务求详尽"
 LYY_Event.8007.b:"只登丁口，不问家产"
 LYY_Event.8008.t:"学堂开门纳挑夫"
 LYY_Event.8008.d:"学堂落成，门无石狮，亦无匾额，惟悬木板一方，上书开课钟点。辰时击木三声，门开，来者鱼贯。首批生徒四十余人，有挑夫，有船工，有卖鱼之童，衣上有腥气，亦有补丁。\n刻晴亲讲一课，不授经义，只取一纸契约悬于壁上，逐行指之：此行为押，此行为息，此字小而密者，是陷阱。讲至半，问曰：「若有人以此纸与尔画押，尔当如何。」一船工起曰：「不画。」众笑。刻晴亦笑，曰：「不画者上也；必欲画者，先知陷阱在何处。」\n散课，日已斜。诸生出门，有一童独留，取炭条于手背写字，写毕反复视之。塾师问：「写者何。」童曰：「先生今日之言。」师视其手背，字大而歪，笔画尽露。至暮，汗出，字尽漫开，惟余一读字可辨。是岁冬，此堂生徒增至百二十人，木板换为石板，钟点亦改。学堂在城东天后宫侧，屋三间，窗向北，光足而不晒。"
 LYY_Event.8008.a:"学堂广开，不问出身"
 LYY_Event.8008.b:"只收聪敏者，免耗钱粮"
 LYY_Event.8009.t:"银行首贷铁匠铺"
 LYY_Event.8009.d:"人民银行初立，案上空空，第一笔放贷，予城南一铁匠铺。铺屋三间，梁已下弯，风入则瓦响。掌柜姓石，接券而手颤，曰：「铺将塌矣，若还不上，奈何。」\n办事者曰：「此券之息，自尔出第一炉好铁之日起算。」铁未成，息不生。石匠曰：「若终不成。」办事者曰：「则吾辈共坐此铺中，看它如何塌。」石匠张目良久，取笔，画押，手印歪出于格。券成，各执其一。石匠归，以券贴于炉壁，日视之。\n三月之后，铺中出刀一口，钢色青，试之断钉，钉断而刃不缺。鬻于市，得钱三倍于旧价。石匠提酒一壶，趋银行还息，办事者检簿曰：「日子未到。」石匠不肯去，坐于阶上，自午后至日昃，酒壶置于膝，未曾开。暮时有人过，问坐者何人，旁人曰：「还债者。」问债几何，曰：「未到期。」铁匠铺在璃月港城南近南市，屋三间，炉在里间，风箱拉之声哑。"
 LYY_Event.8009.a:"轻息放贷，先扶小户"
 LYY_Event.8009.b:"只贷大户，稳保回收"
 LYY_Event.8010.t:"铁轨直铺层岩口"
 LYY_Event.8010.d:"铁轨自港口起，沿海岸，入山腹，凡二百余里，直抵层岩矿口。铺轨之日，刻晴亲下道床，取第一根枕木，二人舁之，置于碎石之上，以锤击钉，三击乃入。\n有老矿工在旁，蓄须如雪，见状曰：「妇人之见。」众皆侧目。刻晴不怒，问曰：「丈人运矿几年。」曰：「四十年。」问：「此四十年，矿车出山几车。」老矿工默然，屈指良久，曰：「不敢计。」刻晴曰：「吾计之。」一车之矿，旧法须二人异轝，山道险仄，坠者、压者、病者，岁不下数十。今以铁轨代人之肩，所死，石也，非人也。\n众无言。有人窃笑其痴，谓铁条何以代肩。至次年春，第一列矿车满载而出，轮碾铁轨，声如远雷，山谷应之，惊起飞鸟满山。老矿工立于道旁，摘帽，久而不语，忽回首语同伴曰：「此铁条，比我这两条腿稳。其后矿口立一木牌，书日运之数，日日更之。」轨过渌华池西，架木桥三，桥下水浅，桥柱入土四尺。"
 LYY_Event.8010.a:"铁轨直铺巨渊"
 LYY_Event.8010.b:"缓工事，先固边防"
 LYY_Event.8011.t:"工坊自治撤监工"
 LYY_Event.8011.d:"工坊旧例，监工十七人，持簿巡行，日计工，夜点名。刻晴下令撤其十二，只留掌簿者五人，专司出入之数。坊中哗然，谓无人督则工必惰。\n有老匠人年七十，扶杖入见，曰：「炉火无情，人无约束，必有事故。」刻晴曰：「炉温付之掌炉者，账目付之全坊，余事听其自议。」老者曰：「自议则争。」刻晴曰：「争而后定，胜于一人定而众不心服。」老者摇头而出，至门，回顾曰：「试之一月。」\n第一月，产量减三之一，废器倍于旧。旧监工皆曰：「果然。」第二月，掌炉者自定火候之则，书于炉壁；锻者自相约，次品自罚。废器减半，产量渐复。至第三月，坊中立一木榜，书各人所出之数，不待吏查，榜上无名者，自请代役。老匠人复至，观榜良久，拄杖而去，未言一字。次日，其徒见其自就一炉，自定火候，所出居榜第三。工坊在璃月港城西近码头，炉十七座，烟自屋顶出，屋瓦皆黑。"
 LYY_Event.8011.a:"工坊自治，掌炉者管事"
 LYY_Event.8011.b:"设监工总领，严加督察"
 LYY_Event.8012.t:"茶马新道绕关卡"
 LYY_Event.8012.d:"新茶马道自城南起，绕旧日三处关卡，穿谷而过，直抵内陆商埠。计程较旧道近一百四十里。修路之役，骡马三百，人夫一千，其中旧驿卒居半。其人识途，知何处土松，何处水浅。\n驿卒首领姓何，尝典一关，关废而失业，至此执镐。刻晴至工地，坐于土堆，与之语。何曰：「路成之后，吾辈何处吃饭。」刻晴曰：「路既成，尔辈饭碗仍在，只是自今以往，管路者，乃走路之人自己。何曰：走路之人如何管路。」刻晴指道上车辙曰：「辙深处则补之，浅处则省之，此非走路者所知乎。」\n通车之日，不设彩，不延官，无一人登台致辞。而道上人塞，自城门至山口，观者如堵。有贩夫推车先试，行十里，回曰：「平。」众乃争行。\n何姓驿卒立道旁，视车马过尽，忽向刻晴一揖，未及言，刻晴已上马去。其后关吏旧人，改隶于道，不掌符，只掌扫。茶马新道自璃月港城南穿谷而过，谷中多石，路面以碎石铺。"
 LYY_Event.8012.a:"卡由行路之人自管"
 LYY_Event.8012.b:"关卡仍归官府征课"
 LYY_Event.8013.t:"工学堂开讲图纸"
 LYY_Event.8013.d:"工学堂开于城北，其址旧为祠庙，殿宇改作讲堂，廊下尚存旧碑半截，字已磨灭。首批生徒六十，教者九人，授机关、水文、冶金三科，别设一课曰工算，讲一笔工程该不该做，费几许，成几年。\n开学之日，刻晴登堂，未言吉语，惟指窗外远山，曰：「此山之上，旧有渠，是先代神明凿石所引。吾辈饮其水三千年，无一人生疑。今神明不在，渠淤则谁疏。」堂下无人应。刻晴曰：「故须学看图纸。此非弃前人之功，是将别人之手，换作自己之手。」\n言毕，堂下寂然。有老先生年近八旬，白发扶杖，自末座起，整衣，向讲台行一礼，礼毕复坐，不发一语。刻晴避席还礼。是日散学，诸生过廊下，多有以手摩旧碑者，摩至字灭处，指下无所触，乃去。其后工算一科为诸科之首，报考者倍于他科。工学堂在城北近天后宫，旧祠改作，殿柱犹存，旧漆剥落。"
 LYY_Event.8013.a:"设工学堂，自绘图纸"
 LYY_Event.8013.b:"重金礼聘外邦匠师"
 LYY_Event.8014.t:"使节携账出海门"
 LYY_Event.8014.d:"内战三年，璃月港封，商船尽泊，提瓦特诸国之图，渐不著其名。及共和初立，刻晴遣使七人，舟一，所携者：账册十二函，旧约副本三卷，口信一句。\n幕僚问：「何以不具金帛。」刻晴曰：「金帛者，乞也。今日璃月可以复通商，然规矩须先说定。」有人笑曰：「如此姿态，恐无人肯见。」刻晴曰：「肯先亮账本者，方谈得上信用；不肯亮者，纵以金帛叩门，所得不过一场虚礼。」议者语塞。\n发舟之日，天色阴，码头无送者，无鼓乐，惟灯塔一盏未熄，光在海面拖成长带。使者登舟，回望城廓，见城头新旗未干，旗角为风所卷。舟出港口，灯犹在。其后三月，第一封回书至，封口漆印完好，内中只问一句：「账册可借观否。」刻晴批于纸背：可，限三日。使者持批而笑，曰：「限三日者何意。」刻晴曰：「看他舍不舍得三日。」舟为三桅，载重千石，舱中置箱，箱以铁皮包角。"
 LYY_Event.8014.a:"先出账本，后议买卖"
 LYY_Event.8014.b:"厚礼先行，结其善缘"
 LYY_Event.8015.t:"蒙德客携风车来"
 LYY_Event.8015.d:"蒙德使节至，舟中载风车一架，拆为七件，又有酒十桶，桶上墨书年份。入城之日，风车装于馆前，风起而轮转，市人聚观，小儿绕之而走，有以手触其叶者，为守者所叱。\n使者举酒，谓刻晴曰：「蒙德无神治，惟有人议。」刻晴受盏，曰：「璃月之神，去今三年，吾辈方学不用。」使者大笑，曰：「方学，则已学矣。」有老兵在侧，拊轮而问曰：「此物凭何而转。」使者曰：「凭风。」老兵曰：「风无常。」使者曰：「故须众木共承一轮。」老兵不语，视轮良久。\n二人对饮，盏尽而语及税。使者出清单一张，列诸货税则。刻晴取笔，逐条核之，改其三处，还之曰：「此三处，彼此皆同，可互认。」使者视之，曰：「可。」临别，使者立于风车之下，曰：「不靠神明之人，亦须学会不靠他人。」刻晴不答，惟命人以璃月之绸二匹赠之。风车轮转，影落于阶。其后蒙德商船岁至，税单互认之纸悬于关署，吏不得增一字。风车装于馆前，馆在城东天后宫侧，阶上石面为轮影所覆。"
 LYY_Event.8015.a:"签互市清单，平等往来"
 LYY_Event.8015.b:"缔结攻守，共御外敌"
 LYY_Event.8016.t:"雷雨并肩两船泊"
 LYY_Event.8016.d:"稻妻使者至，舟泊港外三日，不入。盖两国旧怨未解，锁国令行二十年，海上商路断，渔者失业，死者以百数。幕僚请刻晴先遣人谢过，以软其意。\n刻晴曰：「不谢。」遂登舟往见。雨将至，海色如墨。使者据案而坐，面色冷。刻晴入，未及坐，先曰：「锁国二十载，锁住者，从来是锁门之人。」使者变色，曰：「此语太直。」刻晴曰：「直语说于雷雨之前，胜于曲语说于宴席之上。」使者曰：「二十年死者，谁偿之。」刻晴曰：「偿者无已，不如自今勿添。」使者默然，久乃曰：「然则今日如何。」刻晴曰：「两舟并肩，各泊一位，各守其律。」\n言未毕，雷发，雨倾如注。二舟遂并泊，缆交于桩，水手隔舷相呼，声为雨所掩。有老水手年七十，伏于舷上，观之不去，人问其故，曰：「吾行船五十年，未见两国之舟同泊。此雨，吾生平所见最好看者。」雨止，二使立约，不书盟，只书泊位之数。约成，海面犹有雷声自远而至。泊位在孤云阁内港东，水深处可容大船，惟入口窄，须侧行。"
 LYY_Event.8016.a:"并肩停靠，共守航路"
 LYY_Event.8016.b:"划界而治，各不相扰"
 LYY_Event.8017.t:"成箱典籍尽盖印"
 LYY_Event.8017.d:"须弥学者五人至，携书三十箱，中有图纸、算书、药典、机括之图，多有手批。刻晴命启学堂西廊，腾屋五间，以书架百具纳之，日夜有人守。\n安置既毕，出一印，命吏逐册钤于扉页。印文四字：「知归众人。」学者中有长髯者不悦，曰：「此吾辈毕生所学，何得人人取之。」刻晴曰：「所教于璃月者，不当只教璃月之官。若惟官得观，则此书终成一署之物，非一国之物。」学者曰：「若人人取之，谁复尊师。」刻晴曰：「尊者，其说也，非其书也。」\n长髯者默然良久，乃自袖中取印一具，曰：「此吾私印，请自钤一册。」遂取书一册，翻至扉页，钤于官印之侧。其余四学者相顾，亦各取书钤之。是日钤印至夜半，烛尽三支。后此五间书屋，晨开暮闭，来读者无须引荐，只登记名姓。有挑夫不识字，请人代书，写毕以指按纸上，纸角留一灰印。守书者不拭，曰：「这也是名。」三十箱入璃月港学堂西廊，箱以杉木制，箱上墨书国名，字为学者手书。"
 LYY_Event.8017.a:"典籍归众人，公开誊抄"
 LYY_Event.8017.b:"典籍入官库，择人传授"
 LYY_Event.8018.t:"一夜读尽枫丹律"
 LYY_Event.8018.d:"枫丹使者设案于使馆，陈法典一部，凡十二卷，厚逾三寸。使者曰：「此我国之律，自通商至海讼，皆有明文，请贵国观之。」刻晴命人舁归，是夜独坐灯下，自首卷读至末卷，天明，烛已三易。\n翼日赴会，不带随员，只携本国章程一册，纸粗字拙，为内战中所草。使者请以法条相较，刻晴曰：「可。」遂逐条对读，凡有不合者，各记于旁。至第五卷讼费一条，使者曰：「此条最善，可照行。」刻晴曰：「此条于璃月不可行。」使者问故。曰：「枫丹有律师千人，璃月无一人。」法条可借，执法之人不可借。\n使者怔然，随即大笑，曰：「善。」两国遂互换判词范本各十篇，不立盟，不割利。散会时，使者送之门外，语其副曰：「璃月人算账，较吾辈所料更硬。」副者问：「硬在何处。」曰：「彼读一夜，却一条亦不多要。」副者曰：「若彼多要呢。」使者曰：「多要者，吾可拒；一条不多要者，吾无从拒。」枫丹法典陈于璃月港使馆长案，皮面装，厚逾三寸，页边镀金已磨。"
 LYY_Event.8018.a:"互换判词，互鉴其法"
 LYY_Event.8018.b:"自定家法，不采外例"
 LYY_Event.8019.t:"北国合约三读过"
 LYY_Event.8019.d:"至冬使者至，携合约一函，纸白如雪，字画工整，条款三十七。其言甚甘，曰共利，曰互市，曰守望。刻晴受之，不即答，命置于案。\n是夜读之，凡三遍。第一遍见其甘，第二遍见其缝，第三遍见缝中之钩：凡借贷，以矿口为质；凡违约，以关税代偿。遂取笔，于纸尾批六字：「合作可，抵押不可。」翼日还之。使者视批，色变，曰：「如此，则吾国所得几何。」刻晴曰：「所得者，一邻也。」使者曰：「邻亦须有价。」刻晴曰：「吾已算过，比尔辈算得清楚。」使者曰：「若他国肯以矿口为质，贵国何以处之。」刻晴曰：「则吾亦不与之约。」\n使者不能对，收函而去。刻晴命人以函入柜，柜为库中最厚者，铁叶三重。锁讫，又取纸条一方，书二字，贴于柜门：勿启。后有新吏问此柜所藏何物，老吏曰：「藏一副好算盘。」问者不解。老吏曰：「算盘者，算得清，便不必打。」至冬合约三十七条陈于璃月港使馆，纸白如雪，字画工整，边留宽白。"
 LYY_Event.8019.a:"合作可以，抵押不行"
 LYY_Event.8019.b:"签下合约，换取重建"
 LYY_Event.8020.t:"公约末添一行字"
 LYY_Event.8020.d:"提瓦特通行公约议于中立之港，凡七国，议十有八日。初议税则，次议泊位，终议讼权。诸使各持一说，争至拍案者再。至第十八日，各让一步：税减三之一，泊位均分，讼则各用其本国之律。\n将签，刻晴取笔，于约末添一行，字小于诸条：此约之内，众生平等，不分神眷。堂中一静。有使者起曰：「此语何所指。」刻晴曰：「指签约之日，在座者心中所不敢言者。」使者曰：「若此语入约，吾国须回禀。」刻晴曰：「请回禀。」其人视纸良久，终未提笔划之。\n签约既毕，此纸拓本传于诸港，会馆多悬之，或在梁间，或在壁侧，历经海风，字迹渐淡。有童子指末行问其父曰：「此小字何意。其父思之半晌，曰：即不看出身。」童子复问：「何为出身。」父不能答，携之去看海。海上有舟，舟上无旗。议于中立之港，港在云来海西，小而无城，惟码头。"
 LYY_Event.8020.a:"加入公约，众生平等"
 LYY_Event.8020.b:"暂不署名，静观其变"
 LYY_Event.8021.t:"三椅并置待三人"
 LYY_Event.8021.d:"议事厅上首，旧有三座：中为帝君神位，左为商会首席，右为使节之席。共和既立，三座皆空。或请撤之，或请改设，议数月不决。\n刻晴命匠人取三椅，式样相同，不雕不漆，并置于厅之中央，正对议席。众愕然。刻晴曰：「向者吾辈议事，先看神位，次看商会，终看使节；一言未发，目中已有人之脸色。今三椅皆空，正可自视坐得正不正。」有议员曰：「置此空椅，议事何以自安。」刻晴曰：「不安者，善事也。」议员曰：「若有人坐之。」刻晴曰：「坐者，众目自见。」\n众无对。自是每逢大事，三椅仍在，无人移之，亦无人坐之。新入议席者初不知其故，问于旧人，旧人只曰：「坐者自知。」有年少议员一日倦极，误倚其一，觉而遽起，面赤至颈，满堂无一人笑。此后入门者，多绕三椅而过，虽地窄，不省此一步。玉京台议事厅三椅旧制，中者高，左右稍低，椅背雕纹已磨平。"
 LYY_Event.8021.a:"三椅空置，自省其位"
 LYY_Event.8021.b:"请人入座，另立共主"
 LYY_Event.8022.t:"神谕谶纬逐条勘"
 LYY_Event.8022.d:"令下之日，取历年官册，凡神谕、天象、谶纬、卜辞，共千一百二十条，命五吏分曹整理。每条之下，须注三事：出于何时，见于何书，验于何事。\n吏查至第三百条，汗出如浆。盖先代所称神谕，多有验者，亦有不验者；有验而其时应者，实由人力；有不验而史官削其文者。一吏捧册入见，手颤，曰：「此册若成，恐前代之政，尽为虚设。」刻晴曰：「虚者，虚之也，非吾辈虚之。」吏曰：「若后人据此册，谓先代皆欺人。」刻晴曰：「册上只注验与不验，不注欺与不欺。」\n册成，凡八卷。刻晴取笔，于卷尾书一行：「此书非为断前人之罪，为留一册与后人，使其自能判断。」书毕，命置于学堂入门第一架，不加锁，不禁取。数年后，此册纸角尽卷，书脊断裂，翻之者多于任何经籍。有塾师语弟子曰：「此册最破，亦最可信。」弟子问：「破者何故。」师曰：「人人翻得，故破。」神谕千余条分五曹，曹各一室，室在玉京台西廊，架以竹为格。"
 LYY_Event.8022.a:"整理神谕，留册后人"
 LYY_Event.8022.b:"焚毁旧典，重立新说"
 LYY_Event.8023.t:"新合金再封巨渊"
 LYY_Event.8023.d:"层岩巨渊之裂缝，三年一涌，旧法以巨石填之，石隙渗黑气，工人立其侧，面即溃烂。此次改用新铸合金为骨，外傅以灰浆，法出于工学堂，凡三试而后定。\n闸门凡九段，最后一段最重，重三千斤，以绞车下之。刻晴亲下井口，立于铁梁之上，尘满面，衣为汗所渍。有老工谏曰：「此非贵人宜立之处。」刻晴不应，但视闸门。门落，声闷而不响，尘自隙中喷出，众皆退一步，刻晴不动。\n门既合，刻晴语左右曰：「深渊者，按月索债者也。今日多还一分，明日之人，可少赌一次性命。」井口工人闻之，一时皆直腰，向闸门而立，无一人语。有年少者欲拊掌，为老工按住其手。久之，众乃散，各归其班。老工行数步，回视闸门，以手按其缝，缝中无气出，乃点头去。既封，以漆书年月于门，凡三层，层各一色。合金以铁与晶砂合铸，色青，敲之声清而长。"
 LYY_Event.8023.a:"铸新闸，亲下井口"
 LYY_Event.8023.b:"循旧法，勉力维持"
 LYY_Event.8024.t:"门楣一言刻到今"
 LYY_Event.8024.d:"议会之争，起于神之眼，及于仙人，终于天命。主神眷者曰：「无神之眼者，何以知天意。」主共和者曰：「有眼者，亦未必知。」争三月，案上文书堆至梁下，终无定论。\n末次会议，众请刻晴裁之。刻晴不登台，立于阶下，只言一句：「璃月此后由谁主张，不在位之高下，在理之曲直。」满堂寂然，无一人驳，亦无一人赞。有议员问曰：「理之曲直，谁判。」刻晴曰：「众人判。」问曰：「众人亦错。」刻晴曰：「故须留一次再判之地。」\n遂命匠人刻于议事厅门楣，字为楷，不甚工，横画略斜。有幕僚请改刻，刻晴曰：「此字出吾手，歪亦当歪。其后数月，无一人议换。」有老者每日入厅，必仰视一遍，如视新碑。有少年问其故，老者曰：「看熟，日后有人要凿它，我好记得原样。」少年亦仰视，视良久，曰：「原来歪在此处。」门楣为天衡青石，字为阴刻，刻者留一斜笔，未曾改。"
 LYY_Event.8024.a:"门楣刻字，理在其先"
 LYY_Event.8024.b:"不刻一字，行胜于言"
 LYY_Event.8025.t:"无神之邦第一账"
 LYY_Event.8025.d:"国号书于册，凡四字。书毕，堂中有一老吏伏案而泣，亦有数人默然不语。刻晴不释其义，不论其为勇为狂，只命户曹出账。\n账极细：某里几户，户几口，岁收几石，应纳几斗，余几斗；军食几分，吏禄几分，仓贮几分，余者归赈。一纸不足，续以二纸，粘为一幅，长可及地。有人曰：「如此细账，民未必读。」刻晴曰：「读不读在其人，出不出在我。」其人曰：「若人皆不读，此纸徒费。」刻晴曰：「费纸者小，藏账者大。」\n榜发之日，坊门之下，观者以千计。有不识数者，请人代读，读至应纳之数，或点头，或骂。一老农曰：「往年神在中，吾不知纳了几斗；今年无神，吾倒知了。」刻晴闻之，不加赏，亦不辩。是后岁岁出账，遂为常例，榜纸由粗易细，字由吏书易为木板，风大则加钉。榜贴于玉京台侧，纸以浆粘，风大则加钉。"
 LYY_Event.8025.a:"自给自足，明发公账"
 LYY_Event.8025.b:"暂借神力，徐图自立"
 LYY_Event.8026.t:"空函封入第一格"
 LYY_Event.8026.d:"通往天空岛之路，废已久。旧籍所载，惟云海、浮岛、无名之阶。刻晴命造舟一，备粮百日，遣使三人，赍书一封。\n书不称臣，不称藩，只三问：「天理若在，请现身一谈；若不欲谈，请明示其意；若不在，请许璃月自行其路。」使节登山，凡四十七日，至云下而返。归时衣破粮尽，两手空空，无一字之答。有使者跪而泣曰：「某登至云脚，前无阶，呼之，声不返。」\n使节跪于阶下，请罪。刻晴不问其罪，取原书副本视之，提笔于末批二字：「已知。」众不解，问曰：「既无人答，何以为知。」刻晴曰：「无声，亦答也。」遂命以空白回函一卷，裹以素帛，收入档案库第一格，格上题曰：「天未答。」后有来者启视，见其中空空，久立不去。守库者问：「看甚么。」其人曰：「看空白。自此第一格不通他物，有请移者，守者不许。」空格在玉京台档房西壁，凡十二，格门以木为扉。"
 LYY_Event.8026.a:"遣使问天，如实回报"
 LYY_Event.8026.b:"不问不答，各行其是"
 LYY_Event.8027.t:"井底亡名皆立碑"
 LYY_Event.8027.d:"层岩井下牺牲者名录，岁增一页。此页所载，凡八十七人：千岩军三十一，矿工四十二，余者不知所属，只记某年某月入井，不曾出。\n有司循旧例，只录官军，余者附于册末，不立碑。刻晴取册阅之，指其附者曰：「此四十二人，亦在地下。」命尽去其别，依卒之年月为次，一人一石，略记姓名、年岁、所役。有将校谏曰：「敌我同碑，恐乱军心。」刻晴曰：「碑非论功，乃记账。」与深渊之账，不当只记赢者之一半。将校曰：「若死者家属见仇者之名在侧。」刻晴曰：「他亦在侧。」\n碑成之日，来者塞道。有千岩军老兵，有矿户妇人携幼子，亦有昔日与之相攻者，衣不同色，立于同列。日暮，无人先退。有妇以手摩石上名字，摩至字迹深处，忽然曰：「此字刻得浅，风大些便看不见了。」旁一石匠应曰：「明日来加深。」妇曰：「我来看着。」石匠曰：「那便一同看。」碑在层岩井口之侧，石未磨光，名以凿刻，深浅不一，风过则鸣。"
 LYY_Event.8027.a:"为亡者立碑，不问敌我"
 LYY_Event.8027.b:"只记己方牺牲，简明从之"
 LYY_Event.8028.t:"新军改旗换旧号"
 LYY_Event.8028.d:"军既改称人民军，饷额如旧，服色如旧，惟旗易。旧旗青底金纹，新旗赤底，中一书字，远望不甚分明。检阅之日，列于校场，凡九营，枪刺如林。\n刻晴登台，不读训词，只言二句：「此军昔日之规，曰不退；今日之规，曰知所护者为谁。」台下寂然，久无人应。风动旗角，猎猎有声。有老校立于队首，闻言垂目，手按刀柄，柄上缠布已磨破。\n良久，一营先呼，声短而促，与他营向者所呼不同，其辞亦新。呼声既起，诸营继之，声如潮至。有年少卒呼毕，以手背拭目，动作极快。旁卒以肘轻撞之，不言。少年低头，复挺立。散操后，九营各归其垒，营门相望。有老卒抚新旗之杆，曰：「此杆与旧杆，一样粗。」问者曰：「旗不同耳。」老卒曰：「杆不换，旗才挂得住。」是夜营中有低唱者，和者数十，其声不入军歌之谱。校场在玉京台下，旗杆为旧杆，杆底铁箍刻旧年号，未磨去。"
 LYY_Event.8028.a:"改旗易号，叫人民军"
 LYY_Event.8028.b:"军制照旧，只换将校"
 LYY_Event.8029.t:"关墙新开小民门"
 LYY_Event.8029.d:"山口诸隘次第重修，凡七处。图样既成，送阅，刻晴取笔于图上添一门，高五尺，阔三尺，附注四字：「容民出入。」\n有将领不解，曰：「关者，所以拒敌。」门多则守难。刻晴曰：「关墙所当者，兵也。」兵至则闭，民至则开。若并民而拒之，是与敌共驱其民。将曰：「战时不暇辨兵民。」刻晴曰：「故预为之门，使辨在一门之间，不在千人之目。」将曰：「万一奸细由门入。」刻晴曰：「奸细由正门入者，亦有之。」\n诸将不能对，遂依图增门。门不设闸，只设横木一，昼撤夜置，守卒掌之。其后战事再起，这道门最先开，逃者由此入，追者至门而止。市人呼之曰小民门。有守卒私记于壁：此门开过十九次，最长一次开了四日。后来换防，新卒循例读壁上字，读到末一行，取炭条续书曰：「今日又开一次。」小民门在云关关墙之下，高五尺，阔三尺，门扉以木。"
 LYY_Event.8029.a:"关墙留门，通民有路"
 LYY_Event.8029.b:"关墙求固，不留隙口"
 LYY_Event.8030.t:"南疆募山民戍守"
 LYY_Event.8030.d:"南疆戍卫队新募三百人，不取城市子弟，专取山民、猎户、采药者。募时只试一事：令其于图上指路，指得出者留，指不出者去。\n入伍第一令，非操练，非列阵，曰认路。凡辖内山径、崖洞、溪涧、隘口，人各绘图一册，月终汇之。刻晴至营，语众曰：「守土者，先须是懂此土之人。」有猎户起曰：「懂土者，猎也；守土者，兵也，二者不同。」刻晴曰：「今日同之。」猎户曰：「同之则兵亦猎乎。」刻晴曰：「兵亦当知兽道，然后知人从何来。」\n半年，图成。较之官图，多山径一百二十七条，多崖洞九十四处，注有崖可藏几人，溪旱则断，冬则冻。官图所无者，此图皆有。携图入见，幕僚展视良久，曰：「此图若落敌手，危矣。」刻晴曰：「故此图只存营中，不入官库。」绘者皆在营，图在则人在。南疆诸山在天衡之南，山路错杂，外人入则迷，猎户则闭目可走。"
 LYY_Event.8030.a:"就地募人，先取识山者"
 LYY_Event.8030.b:"调他处精锐，从严整训"
 LYY_Event.8031.t:"操典首页添一行"
 LYY_Event.8031.d:"民兵课目旧有六：装填、瞄准、跃进、掩护、筑垒、撤收。此次增一，列于首：毋误伤同列。\n有新兵不解，曰：「枪口向外，何至于伤己人。」教习不答，取枪授之，令其伏于壕。新兵伏定，教习自后以手轻抬其枪口一寸。新兵回顾。教习曰：「此一寸，山脊也，墙头也，自家人之肩也。」战阵之上，眼只见前，手不知高低，一寸之差，生死之别。新兵曰：「如何知其一寸。」教习曰：「练到不必想。」\n是日操毕，刻晴至场，闻之，曰：「上过阵者，方知最难者，抬高一寸。」命书于操典第一页，字大如钱。其后岁久，此页纸角起毛，字迹下有摩挲之痕，浅而不灭。有新兵问老兵：此痕何来。老兵曰：「翻得多。」问：「为何翻得多。」老兵曰：「因每回都要看一眼，才敢装弹。」新兵亦以指按其处，按毕，默然归列。玉京台北营民兵操典以厚纸印，页角以线装，线为麻。"
 LYY_Event.8031.a:"操典首条，慎伤己人"
 LYY_Event.8031.b:"先杀敌，不拘细目"
 LYY_Event.8032.t:"井下轮换减其半"
 LYY_Event.8032.d:"巨渊戍卒旧例，一戍六月，期满乃代。新令改为三月，饷增三之一，另给日粮、灯油、药饵。度支之吏持簿入见，曰：「此项岁增钱四万，值否。」\n刻晴曰：「井下之人，日不见天。」六个月者，出井之时，眼不能视日光，须以布蒙目，三日乃复。熬之久者，性情渐变，或独语，或怔坐。此非兵之罪。度支曰：「值在何处。」刻晴曰：「吾要一支尚记得天光何种模样之军。」兵不识天光，则不知其所守为何。度支曰：「若省此四万，可增炮十门。」刻晴曰：「炮十门，不及人一双识天之眼。」\n度支默然，退而书之。令下，轮换名籍悬于井口板壁，墨书班上。每有新榜，必有人立其下反复视，视毕，取炭条于小纸记下一班之名，藏于怀中。\n有老卒问其故，答曰：「记住名字，下去之后，好有个数。」老卒曰：「数他做甚么。」曰：「若有一日他不出来，我好说得出他叫甚么。」层岩井下气温不变，四时皆寒，戍卒须披厚衣。"
 LYY_Event.8032.a:"缩短轮换，厚待戍卒"
 LYY_Event.8032.b:"延长戍期，节省粮饷"
 LYY_Event.8033.t:"兵器各标匠人名"
 LYY_Event.8033.d:"兵工厂迁于山坳，依崖而筑，烟囱凿石为道，烟自崖顶出，远望如云。产量倍于旧厂。附近村中，男丁入厂，妇人鬻饭，小童拾铁屑，岁入亦增。\n刻晴至厂，定一规：凡出厂之器，皆刻匠名于柄，字不必工，务使可辨。厂吏曰：「器有编号足矣。」刻晴曰：「编号者，便于稽；姓名者，使人自稽。」有认领之兵器，方不随意杀人。厂吏曰：「若器败，罪归匠人乎。」刻晴曰：「器败则问其故，不问其罪。」\n第一支刻名之枪，悬于厂门内侧，下系木牌，书匠人名。那名匠人每日入厂，过门必停，视枪一眼，然后入。同侪戏之曰：「视尔子乎。」匠人曰：「视吾名。」后有他厂仿之，刻名之制，遂遍诸厂。有吏查器，见名则呼其人，人至则对，不敢推诿。或问匠人：刻名于柄，手不抖乎。匠人曰：「抖。然抖过之后，刀口便正。」兵工厂在黑岩厂外山坳，依崖而筑，烟道凿石为孔。"
 LYY_Event.8033.a:"兵器皆刻工匠之名"
 LYY_Event.8033.b:"兵器只标官厂之号"
 LYY_Event.8034.t:"门开三日听人争"
 LYY_Event.8034.d:"共和既立，诸事粗定，而此后何往，无人能言。刻晴下令：议事厅门三日不闭，凡有言者，皆可入，不问出身，不限时刻，惟不得持械。\n第一日来者百余人，多市井之辈。有船工言泊位，有织妇言布价，有塾师言课本，有老卒言抚恤。第二日人益众，廊下亦满，坐者以砖为席。第三日，争论起于庭中，两造相持，声达于外。守门者欲止之，刻晴自内出，曰：「听其尽言。」守门者曰：「有詈人者。」刻晴曰：「詈毕自止，止不住者，众人自止之。」\n三日毕，门闭。案上纸堆高及人腰，缚之得十七束，争论未止。幕僚请择要施行。刻晴视纸堆久，曰：「吵不完，最好。」吵完了，才是真无人敢言。幕僚曰：「然则此十七束。」刻晴曰：「择其可行者三，余者存。」存者，后日之据也。是三日，厅中灯彻夜不熄，值夜小吏凡三易，最后一夜，烛尽而天明。议事厅门在玉京台下，旧楠木包铁，门槛磨凹，凹处积尘。"
 LYY_Event.8034.a:"开三日门，尽听其言"
 LYY_Event.8034.b:"择人而听，速定大计"
 LYY_Event.8035.t:"大会第一枚手印"
 LYY_Event.8035.d:"人民大会之议既定：里坊各举一人，行业各举一人，镇各举二人，层递而上，凡四级。权自上而下者，改为自下而上。\n反对者曰：「如此则散，散则无以决事。」刻晴取绳一束置案上，曰：「此绳一股，力聚而易断；此绳百股，力分而难绝。」散一点，胜于断在一根绳上。反对者曰：「百股亦有一处结。」刻晴曰：「故结处当在众目之下。」反对者曰：「众目之下，争必多。」刻晴曰：「争多而决迟，犹胜于不争而决速。」\n议毕，取方案一纸，铺于长案。刻晴先以指蘸朱，按于纸末。按既，纸角起一道浅褶。旁有书记欲抚之平，刻晴曰：「留着。此褶后以重物压平，与方案同入档，为共和国档案第一件实物。」后有观者问：「此褶何以不修。」管档者曰：「修了，便看不出有人按得那样重。」问者以指试按，按毕，视其指。人民大会册首按手印于玉京台，印泥为朱，指节用力，边有晕。"
 LYY_Event.8035.a:"立大会，分权于下"
 LYY_Event.8035.b:"总揽权柄，别设枢要"
 LYY_Event.8036.t:"卖菜妇当堂一问"
 LYY_Event.8036.d:"自由议席之设，不设门第，不限男女，凡得十人推举者，皆可入。首会之日，堂中坐者，有旧日大吏，有市井之人，衣冠相杂。\n一妇人起，年四十余，手上犹有菜汁，自末座行至阶前，向一旧吏问曰：「去岁冬，吾里赈米三石，帐上记十石，余七石何在。」堂中寂然，无一人咳。旧吏起，面赤，曰：「此旧事，待查。」妇人曰：「吾已查过，里正言已报，府中言未收。今日先生在座，请为一言。」旧吏不能对，坐下，手按案角，指节尽白。\n刻晴坐最后一排，始终未出声。散会，命书记取是日记录，自抄一份，藏于袖。幕僚问曰：「夫人何不置一词。」刻晴曰：「今日吾若开口，往后彼等出语，先要看吾在与不在。」幕僚曰：「然则此案。」刻晴曰：「案归有司，吾不归有司。」后七日，那七石米追出四石，余三石，里正以家产抵。妇人复至会，仍坐末座，未再发一言。玉京台自由议席以签定座，签为竹制，抽得末签者坐门侧。"
 LYY_Event.8036.a:"议席无门槛，人人可入"
 LYY_Event.8036.b:"限定资格，取有识者"
 LYY_Event.8037.t:"讲坛门上一木牌"
 LYY_Event.8037.d:"共和既立，旧日官学之禁尽弛。诸子各立门户，学堂、书院、讲坛，四境之内凡六十余所。所讲者，或经义，或算学，或医方，或农事，或辩名实，或论鬼神。\n有司请立官学为正统，定课目，颁教材。刻晴不许，命匠人制木牌，同一式，同一文，凡六十余面，分钉诸讲坛之门。牌上九字：「说得通，则听；说不通，则散。」\n有老先生抚牌而叹，曰：「如此，则师道不尊。」刻晴曰：「师道之尊，在其说之能立，不在门上有牌。」先生曰：「若妄人登坛，胡说满堂，奈何。」刻晴曰：「说得不通，听者自散，散者自去别家。」一政权若怕争论，则早已无可争者。先生默然，退而取纸，将此九字拓下，藏于书箱。其后南北讲坛，多有仿刻者，亦有改刻一字者，刻晴闻之不问，只命人记其改于册。璃月港城南讲坛木牌悬于门侧，上书讲题与时辰，字为讲者手书。"
 LYY_Event.8037.a:"诸子立门，不禁异说"
 LYY_Event.8037.b:"定于一尊，罢黜杂议"
 LYY_Event.8038.t:"宪章与反对书并悬"
 LYY_Event.8038.d:"劳工宪章成，凡四章二十九条：工时以八时为限，工价按月先给，伤病给药与养，学徒不得过三人。颁下之日，老商号二十一家联名上书，言其窒碍。\n刻晴不批其书，只请联名者二十一人，赴码头看一个下午。是日雨，卸货者赤膊立于舱口，一人递一人接。至暮，有一老商号主人问一卸工曰：「日得几何。」曰：「三十。」问：「若病。」曰：「病则无。」其人不再问，退立檐下，视雨。\n归而无一言。刻晴命取宪章一纸，又取联名书一纸，并悬于议事厅东壁。有吏请焚其书，曰：「留之，使人见笑。」刻晴曰：「留着。」使后之人知今日这一点便宜，是费了多大力气才争来。后东壁纸色渐黄，两纸并垂，观者先读宪章，次读其书，多有立久不去者。有一少年读毕，问守吏曰：「此书之上，何以无一人再署第二回。」守吏曰：「署过一回，便知不必再署。」玉京台议事厅二纸并悬，左为宪章，右为反对书，纸色一新一旧。"
 LYY_Event.8038.a:"颁劳工宪章，昭告全城"
 LYY_Event.8038.b:"压其诉求，安抚商号"
 LYY_Event.8039.t:"船队远航带章程"
 LYY_Event.8039.d:"船队凡九艘，载货之外，别载一事：章程。自报关、验货、纳税、讼理，各有定式，印为小册，每船百本，遇港则赠。\n有幕僚问曰：「诸国各有其法，我以己法赠人，得无见疑。」刻晴曰：「吾辈不做主，只做示范。」肯用者用之，不肯用者，货照旧易，不必强。其人曰：「如此，恐招怨。」刻晴曰：「怕招怨者，从来不是吾辈这种人。」其人曰：「若无人肯用。」刻晴曰：「则册子还在船上，不费一粒米。」\n发舟之日，无军乐，无彩，惟桅上帆升。九帆次第而起，声连一片，如有人自岸上徐徐展开一整面墙。岸上观者不哗，有小童问其父：此何声。父曰：「开墙。」船出港，帆影渐小，而声犹在耳。后有商船归，言某港关吏已用小册之式，刻晴闻之，不喜，只曰：「记下。」吏问：「记于何册。」刻晴曰：「记于诸港之后，看他能行几年。」璃月港商会远航章程印为小册，册以线装，封面印一秤，秤无星。"
 LYY_Event.8039.a:"以章程示范，不据人之上"
 LYY_Event.8039.b:"船队随行护卫，宣威于外"
 LYY_Event.8040.t:"长桌一圈束诸席"
 LYY_Event.8040.d:"提瓦特联合之议既出，应者半，拒者半。有国言其名不正，有国言其权不均。幕僚请刻晴力推，刻晴曰：「此非一战之功。」\n遂不发议，只命匠人造长桌一，长四丈，环置坐席十四。请诸国使节同坐，不设主席，不列次序，只置茶一壶，纸一叠。刻晴坐于末位，听之而已。首日争于名，次日争于权，三日争于会期。争至第三日暮，有一使愤起，以指蘸茶，于桌沿画一圈，曰：「诸公皆在此圈之内，何争内外。」\n满座忽静。刻晴视圈良久，未置一词。散会，执事者欲拭之，为刻晴所止。其后此桌仍用于会，圈在桌沿，日久而色深。诸使入座，多有目视其圈者。数年后有人问圈之所自，旧执事曰：「茶渍耳。」问者不信，执事亦不辩，只以指沿圈画一过，曰：「君试画之，看画得圆不圆。」问者画之，不圆。桌为长圆，中空，空处置花一盆，花为琉璃百合。"
 LYY_Event.8040.a:"邀众同席，共议联合"
 LYY_Event.8040.b:"独力经营，不结外援"
 LYY_Event.8041.t:"新帜初悬桅上时"
 LYY_Event.8041.d:"自由之帜，赤白二色，中绘一纹，升于主桅。是日风顺，旗展极满，港中舟楫皆鸣号。岸上观者数千，欢呼者过半。\n亦有默然者。有一片，约数十人，立于码头石阶，不呼不散，亦不去。刻晴下船，行至其前，问曰：「何不喜。」中有一人，年五十许，答曰：「此旗，吾不识。」刻晴曰：「不识者，可不喜欢。」其人愕然。刻晴曰：「此旗所护者，即尔不必喜欢它，而不因此受责。」其人曰：「若人人皆不喜欢，此旗尚可挂乎。」刻晴曰：「可挂。」旗之可挂，在人不因不喜而获罪，不在人喜。\n众默然。一刻，有人低声曰：「若如此，则此旗尚可看。」刻晴不答，转身去。人群中有老兵，鬓已斑，闻此言，以手压帽檐，使低覆其目，既未拊掌，亦未离去，久之，乃随众散。行数步，复回望桅上旗一眼。璃月港主桅之旗为赤白二色，布厚，风展则满，垂则如褶。"
 LYY_Event.8041.a:"小民之门常开，先放百姓"
 LYY_Event.8041.b:"军令第一，迟则误机"
 LYY_Event.8042.t:"城门刻四字既毕"
 LYY_Event.8042.d:"城门重修，门上留石一片，横可五尺。匠人问刻何字，有司以四字对：万世共和。刻之三日乃成，字深一寸，填以朱。\n刻成之日，观者塞门。刻晴立于门下，仰视良久，自晨至午，未移一步。左右不敢言。有老吏捧茶进，刻晴不受。至日昃，乃语身边人曰：「吾此生或只成一事，使后之人，不必再靠一人而活。」语毕，无他言，亦无训辞。身边人问：「四字何以得万世。」刻晴曰：「不能得。」问：「既不能得，何故刻之。」刻晴曰：「刻之，使后人知有人这样想过。」\n遂转身入内。门内大厅，旧有神位，今空。门槛高，她以手扶之而过。门在身后合，声极轻。门外众人犹立，无一先散。有小儿指石上字问其母，母曰：「此四字，你长大自识。」小儿以指摹石上笔画，摹至万字，指已红。石取天衡，色青，字深一寸，填以朱，朱遇雨则淡。"
 LYY_Event.8042.a:"万世共和，功归众人"
 LYY_Event.8042.b:"永铭一人，以镇四方"
 LYY_Event.8043.t:"笔下两顿签一令"
 LYY_Event.8043.d:"战事方急，议而不能决者屡矣。先锋委员会之设，收决断之权于七人，凡军兴、粮调、关禁，皆得以便宜行事，不必先议。\n签署之日，堂中寂然。文吏展纸，置于案，进笔。刻晴执笔，笔尖将下，顿然一住，墨聚成点，落于纸边；既书数字，又一住。幕僚在侧，皆见之，无一人敢言。有委员曰：「若不决，恐误军期。」刻晴不答，复书。书毕，掷笔于案，声脆。\n刻晴语近侍曰：「吾知其危。但愿吾辈收得回来。」近侍曰：「若收不回。」刻晴曰：「则后人取此书观之，当知今日有人犹豫过。」是纸入档，管档者检视，见两处淡墨，圆而不散，如两点雨痕。其后数年，此纸为人取观者众，两点渐为指腹所摩，几不可辨。管档者欲以纸覆之，刻晴闻之，曰：「不必覆。」摩尽，也算一种记得。玉京台先锋委员会令纸为厚绵，签署处以朱笔，笔锋两顿。"
 LYY_Event.8043.a:"签字并留退路"
 LYY_Event.8043.b:"尽收权柄，不留余地"
 LYY_Event.8044.t:"手册首页一句真"
 LYY_Event.8044.d:"纪律之令既行，赏不逾时，罚不待旦。有军校失期半日，斩；有吏受馈一饼，黜。求情者踵门，喊冤者塞道，刻晴一概不听，只曰：「法在，吾不在。」\n一夜，独坐灯下，取随身手册，翻至首页，书一行：「吾所惧者，他日无人敢以实告我。」书毕，视之良久，以指按其字。老侍者进茶，见之，退立门侧，不敢近。侍者后语人曰：「那一夜灯点到三更，纸上只多一行字。」\n后数年，刻晴老，手册入于档库。有后学启视，见首页纸角磨损独甚，问于守者曰：「何以首页先破。」守者曰：「非翻阅之故。」问：「则何故。」守者以手示之：如此按者，日必数次。问者试按其处，按久之，乃合册，出而语人曰：「原来首页非读破。」问者问：「那如何破。」曰：「按破。其后有吏仿之，各置一册，首页皆留白，久久不着一字。」铁腕行署手册在璃月港以薄纸印，页数不多，首页留白，久无人书。"
 LYY_Event.8044.a:"厚待老兵，为其立碑"
 LYY_Event.8044.b:"封赏其功，编入新军"
 LYY_Event.8045.t:"长廊无声过一人"
 LYY_Event.8045.d:"止疑之令既颁，凡议涉军情、粮道、关禁者，须先报，后议。议会之上，向来喧争之声，一时尽敛。\n刻晴过长廊，闻廊侧小室中有人低语，语急而促，见其影过，语即止。无人出，无人迎，亦无一人抬头。廊中惟闻靴声，与窗外风动竹叶之声。有一小吏捧牍迎面来，见之，遽止步，退避于柱侧，牍举过额，直至其过乃行。她行至廊末，忽止步。少时曾读一书，中有数语，曰：「城中无声，非治也，乃惧也。」最静之城，往往最危。\n她立良久，手按廊柱，柱上新漆未干，指下微黏。既而末室之门轻合，最后一点语声亦绝。她抬手视指，漆痕一道，横于指腹，久未拭去。归署之后，命人取是令全文，自首至末读一遍，读毕，置之案角，不批一字。至暮，她乃行，鞋底于砖上留一浅印，过数日方消。议事厅西长廊铺玉京台旧砖，砖缝以灰填，灰已裂。"
 LYY_Event.8045.a:"令行禁止，缄口自守"
 LYY_Event.8045.b:"广开言路，容其异声"
 LYY_Event.8046.t:"壁上一剑无人佩"
 LYY_Event.8046.d:"共和之剑，剑身三尺，无纹，鞘以素木为胎，蒙以鲨皮。悬于议事厅西壁，距地五尺，须仰视乃见。悬之三年，无人佩戴。\n刻晴每三五日，必自取软布拭之。拭鞘不拭刃，曰：「刃在鞘中，无庸拭。」有年少书吏问曰：「既不用，何不收入库中，免致锈损。」刻晴曰：「此剑最好永不启鞘。」书吏曰：「若锈。」刻晴曰：「若真锈损，才是吾辈最当惧者。」书吏曰：「剑锈则无用，何惧。」刻晴曰：「惧者非其无用，是无人再觉其当拭。」\n书吏不解，退问老书吏。老书吏摇首，只曰：「挂着，众人心里有数。」书吏复问：「有数者何。」老书吏指壁上剑影，曰：「你每日过此，抬头看不看。」曰：「看。」曰：「那就够。」书吏视壁上剑影，日为窗光所移，午正而正，日昃而斜，三年之间，未曾一日不在。其后书吏迁官他去，行前过壁下，仰视良久，乃去。共和之剑悬玉京台议事厅西壁，距地五尺，鞘为素木，蒙鲨皮。"
 LYY_Event.8046.a:"剑悬不落，以之为威慑"
 LYY_Event.8046.b:"取下入库，藏锋不用"
 LYY_Event.8047.t:"令尾添四字北上"
 LYY_Event.8047.d:"北上之令既具，凡五道：调兵、备粮、修道、置驿、定行军之次。文书已封，待发。\n是夜，刻晴独坐图前。图上自璃月北境至至冬边，一线曲折，过山三，渡水二。烛烧至半，她未动；烛尽，易一。天明，取令启封，于五道之末，添四字：「勿伤百姓。」幕僚在侧，见之，曰：「此四字不入军令之体。」刻晴曰：「正以不入体，故人记得。」幕僚曰：「若军中不遵。」刻晴曰：「不遵者，吾亲问之。」\n添毕，复封。授使者时，手迟于常，封泥按两次方固。使者捧令出，行数步，回顾，见其犹立阶上，衣为露所湿。此四字后为人传抄，军中不著于典，而人人相戒。有新校问老卒：此四字何以在令末不在令首。老卒曰：「在首者，是话；在末者，是债。」新校曰：「债谁偿。」老卒曰：「谁接此令，谁偿。」新校捧令视良久，乃行。北上图自璃月港至北境，凡十二驿，驿各有水与草料。"
 LYY_Event.8047.a:"勿伤百姓，抚民为急"
 LYY_Event.8047.b:"速战速决，勿恤小节"
 LYY_Event.8048.t:"高台一望尽齿轮"
 LYY_Event.8048.d:"铁血公社之制行，全城分十二区，区各有厂，厂各有班，班各有额。钟声为号，一声起，二声食，三声息。街巷之间，惟闻钟与履声。\n产量三倍于旧，废品减半。粮足，衣足，屋足。而市中笑声渐稀，酒肆多闭，有戏台改为仓库。有老妇于钟下哭，人问其故，曰：「吾家三口，三班不同时，一月未同桌食。」问者默然，视钟。钟面赤，无字，惟三刻。\n刻晴登厂区高台，凭栏下视。万家灯火如棋，人行如蚁，各赴其位，无一人仰视。风骤起，台上旗猎猎作响。她伸手按住旗杆，手不释。幕僚在侧，待其言，久不闻声。至暮，只问一句：「此城是国，是器。」幕僚不能对。风再起，旗自其掌下扯出，翻卷有声，她复按住，仍未释。台下钟鸣，三声毕，万巷归一静。是夜钟误鸣一声，万家皆起，起而无声，复卧。璃月港分十二区，区各有厂，厂各有钟，一鸣则全城应。"
 LYY_Event.8048.a:"先增其产，专顾效率"
 LYY_Event.8048.b:"恤工匠，缓其劳作"
 LYY_Event.8049.t:"徽记末笔改炬刃"
 LYY_Event.8049.d:"共和国徽记之议，凡十余稿。或取山，或取海，或取星。末定炬与刃：炬明而向上，刃暗而向内。\n定稿之日，刻晴亲至画室。图已就，墨未干。她执笔，于炬焰之末停笔，良久不下。画工侍立，汗出于额。乃曰：「炬画矮些，刃画长些。」画工曰：「如此，则明者不显。」刻晴曰：「吾总觉所握之物，重于所举之物。」画工曰：「若炬矮，民见之不解。」刻晴曰：「不解者，问而后知。」\n画工改之，凡三易乃成。徽成，印于公文之首。其后遍于关牒、军旗、学堂壁上。有人问徽中刃何以向内，画工曰：「此非吾意。」问者为谁之意，画工曰：「画者不言。」数十年后，有老人见徽于旧纸，指其刃曰：「此一笔，当日改了三次。」旁有少年问：「为何向内。」老人曰：「向内者，防己也。」少年视之久，乃收纸去。玉京台长案上国徽稿十余纸，最末一纸墨色最浓，改处最多。"
 LYY_Event.8049.a:"徽记不改，从此为国号"
 LYY_Event.8049.b:"重绘一枚，另立新意"
 LYY_Event.8050.t:"城塞落成独登楼"
 LYY_Event.8050.d:"城塞成，周五里，墙高三丈，赤土涂之，远望如火。落成之日，四门戒严，市肆皆闭，行人须持符。\n刻晴不乘车，自步登城。至垛口，凭而望。城中街巷如织，屋瓦相接，烟自千灶起，散于暮色。风自海上来，带咸气，吹其衣角。守卒见之，欲跪，止之，令其立原位。卒不敢仰视，惟视其靴。\n忽忆内战初起之夜，玉京台下灯影，千岩军巡街，老兵语徒曰此是换世。又忆己之所言：「使人人皆能立。」念至此，喉间忽紧，目微热，终未落泪。惟以手按城墙，墙赤土粗粝，刺掌。城下更鼓三通，她犹立。及四通，乃下。下至半阶，回顾城头，见旗为风所卷，卷而复舒，如有所语，遂不复顾。至城门，守门者请验符，她探袖良久，无符，守者不敢阻，侧身让之。出城时，卒跪而送，她以杖止之，曰：「守尔门。」城塞周五里，墙高三丈，赤土涂之，远望如火。"
 LYY_Event.8050.a:"政令先行，万物次之"
 LYY_Event.8050.b:"先听城中人语"
 LYY_Event.8051.t:"港口授老兵铁牌"
 LYY_Event.8051.d:"内战既息三年，老兵集于港口，凡四百二十七人，各授铁牌一枚，牌阔二寸，上刻其名与所属营次，下刻年月。\n刻晴不设台，不致辞，自队首行至队末，一人一握。有老者手颤，握不能紧；有少年手冷，握之如冰。至一独臂老者前，老者以左手受牌，视之，忽曰：「此仗，值否。」\n刻晴不即答。风动，港中桅索作声。良久，曰：「我不知。」老者曰：「既不知，何以教人。」刻晴曰：「我知者一事：此问，尔今日问得出。」问得出，便是值。老者曰：「若问不出呢。」刻晴曰：「问不出者，吾辈替他问。」老者不语，以指摩牌上己名，摩之再三，乃纳入胸襟内袋，以手按之，如按一处旧伤。旁人见之，亦有探手入怀者，一时队中无声，惟闻铁牌相触。其后此牌多随人入棺，亦有传于子孙者，牌上字磨去一半，犹不肯易。璃月港铁牌阔二寸，上刻名与营次，下刻年月，字为阴刻。"
 LYY_Event.8051.a:"立铁牌，长记此役"
 LYY_Event.8051.b:"厚赏将士，以功代名"
 LYY_Event.8052.t:"碑上四字属众人"
 LYY_Event.8052.d:"港口重修既毕，有司请更其名，曰玉衡港，以志其功。议上，刻晴批二字：「不可。」\n有司复请曰：「此非一人之私，乃众议。」刻晴曰：「民之记我与否，不当由一块石上刻何字而定。若刻吾名，则他日有人欲去之，须凿石；石可凿，人心不可凿。」有司曰：「然则碑终不立乎。」刻晴曰：「碑可立，字另议。」有司曰：「字者何。」刻晴曰：「四字。」问：「何四字。」曰：「此地属众人。」\n越半月，碑立于港口，高三尺，无饰，上刻四字，为其手书。立之日，不设仪，不鸣炮，无致辞者。有数小儿先至，于碑前空地以石画格，格作跳房之戏，呼喝相竞。行人过者，多驻足看碑，亦有看小儿者。\n有老者读碑四字，读毕，顾谓其孙曰：「记住，地属众人。」孙曰：「碑归谁。」老者笑曰：「碑者，石也。」港口正中石碑为旧碑改刻，背面旧字未磨尽。"
 LYY_Event.8052.a:"此地属众人"
 LYY_Event.8052.b:"名以御衡，彰其功"
 LYY_Event.8053.t:"独行全城记一册"
 LYY_Event.8053.d:"最后一片废墟，在城西。瓦砾既除，地平整如掌，惟余焦土之色。是日无雨，风起则尘扬。\n刻晴不使人从，独行。过码头，观卸货者以新法计数，一人唱名，一人书板；过学堂，闻读声自窗出，中有算题，亦有讼例；过大厅，门开，内有空座三，无人；过市，见一摊卖面，即前日所食者，招牌新漆。摊主识之，欲取碗，刻晴摇手，径过。\n归署，取册书之，末云：此即吾辈所换得者。说不上好，亦说不上坏，只是终于由吾辈自负其责。书毕，天已暝，纸上看不清字。抬头，城中灯火次第而起，自近及远，如有人沿街点去。有小吏入，请掌灯，刻晴曰：「不必，我看得见。」小吏退，立于门外，见其犹坐暗中，以手指按册上末行，久不动。少顷，有风入窗，册页自翻，她以手压之，仍不掌灯。天后宫西废墟既除，地平如掌，土色焦黑，草不生。"
 LYY_Event.8053.a:"就此向前，尽记之"
 LYY_Event.8053.b:"停下脚步，清算所有"
 LYY_Event.8054.t:"门前一灯夜不熄"
 LYY_Event.8054.d:"议事厅门前，置灯一具，铜座玻璃罩，油以鲸脂，一夜须添两次。初为议事至夜者照路，后遂不撤。\n刻晴渐老，行步须杖。每夜巡至门前，必视灯一次。守灯者三班轮值，交班时以指蘸油，试其灯芯。有少年守灯者问曰：「此灯何用。」刻晴曰：「无用。」问：「既无用，何不熄。」曰：「熄则无人问此一句。」少年曰：「那我不问。」刻晴笑曰：「你已问过。」少年面赤，低头添油，油溢于座，以袖拭之。\n或问：「夫人不畏身后无人乎。」刻晴笑曰：「吾所畏者，非无人，乃接灯者不知灯为何点。其后此灯著于令，为常例：换人不换灯，灯不许熄。」守灯者名籍，亦岁上于档。有名籍者死，其子继之，仍守此灯。有子问父：守一盏灯，何以为业。父曰：「非守灯，守那一句问话。子初不解，守数年，一夜忽自语曰：原来此灯，乃为人而问。」玉京台议事厅门前之灯，铜座玻璃罩，油用鲸脂，一夜添两次。"
 LYY_Event.8054.a:"门不必关，灯不许熄"
 LYY_Event.8054.b:"严立门户，重设禁卫"
 LYY_Event.8055.t:"旧址立一无字碑"
 LYY_Event.8055.d:"内战既终，新旗遍于城头，旧日诸色之旗，皆已降下。唯旧址一处，屋尽毁，墙仅存半，为炮火所穿，孔大如斗。\n有司请于此处建纪功碑，拟文三千言，列历年战事、死伤之数、克复之日。刻晴阅其稿，曰：「皆实，然不必刻。」有司愕然。刻晴曰：「刻满，后人便无处可写。」有司曰：「若不刻，后人何以知此战。」刻晴曰：「此战之知，不在石上。」\n碑成，立于旧址。风吹日晒，石面渐粗，生苔于阴处。而往来者不绝，有老兵，有妇人，有不知其事之少年。至者多立片刻，或抚石，或绕行一周，然后去。守碑者言：「此碑无字，然日日有人来看，看毕皆不语。」有一少年以炭条欲书其上，为守者所止，少年问：「既不刻字，何以不许人写。」守者曰：「写了，便不是无字碑。」碑下常有野花数束，不知谁置，守者亦不扫。无字碑立于玉京台旧署旧址，石取旧墙之整者，碑面磨平。"
 LYY_Event.8055.a:"刻无字碑，留给后人"
 LYY_Event.8055.b:"勒石记功，昭示千秋"
 LYY_Event.8056.t:"宪章读罢满堂声"
 LYY_Event.8056.d:"共和宪章成，凡七章六十条。颁行之日，议事厅满座，有白发之旧吏，有少年之议员，亦有自内战余生者，臂上裹布，布下创未合。\n刻晴立于案前，自首章读至末条末句，声不高，一字不苟。读至半，有伤者以手按臂，额上见汗，仍坐不动。读毕，她停一停。乃曰：「自今日起，吾亦一可换之人。」\n堂中先静，静得可闻窗纸之声。既而掌声起，声不烈，而绵长，中有一物，众皆觉之而不能名。有老议员拊掌而泪落，急以袖掩。散会时，众人出门，步履比来时缓，语声比来时轻。有少年议员行至阶下，回顾厅门，见门楣刻字，乃驻足，仰视良久，然后去。守门老卒问曰：「今日议何大事。」少年曰：「无大事，只是念完一篇文章。」老卒曰：「念完也值得这样。」少年曰：「值得。」是日无人设宴，惟厅前长明灯，比往日添油早一时辰。宪章凡七章六十条，玉京台读毕，日已西斜，厅中灯未及点。"
 LYY_Event.8056.a:"权出于民，还于民"
 LYY_Event.8056.b:"权柄暂握，待时还政"

 KQP_Spirit_First_Republic:"共和第一晨"
 KQP_Spirit_First_Republic_desc:"共和首日，不鸣钟，不张乐。天未明，惟闻扫帚拂石，声自街东至街西。有起早者推窗视之，见执帚者皆皂衣小吏，无甲士。日中，户部张榜于市，列去岁出入若干条，细至灯油纸张。榜下聚观，有市人指点而算，算毕曰：「尚有三十贯不知所之。」旁有吏即取笔注其下曰：「此数在修桥项内，明日另榜。」观者乃散。榜张于南码头栅门，纸以浆粘，风揭一角，吏以手按之。"
 KQP_Spirit_Open_Markets:"开市不问价"
 KQP_Spirit_Open_Markets_desc:"市禁既弛，价不复由官定。诘朝，鱼市先乱，一夕之间，价三易。有黠者囤盐，旬日而利倍；亦有奸商以陈米充新，为人所殴于市。官初不问，惟设一亭于市心，亭中县一板，凡受欺者书其事于板。月余，板不能容。而市中亦自生约：秤必双验，米必开袋。有老商语人曰：「官不管，吾辈自管；自管者虽慢，然较可信。」鱼市在南码头东，摊以旧船板搭成，腥气积于板缝。"
 KQP_Spirit_Chasm_Rail:"铁轨入巨渊"
 KQP_Spirit_Chasm_Rail_desc:"铁轨既成，自港口直抵巨渊之口。初铺之日，矿工夹道而观，有老矿工以手抚轨，久而不语，问之，曰：「此物能载人乎。」监工曰：「能。」老矿工乃笑，笑已而泣。向者下井，负矿而上，日不过三往返；今以车运，一车当百人之负。轨旁设小站，站有粥棚，棚下悬一牌，书井下亡者之名，凡三百七十有二。轨成之日，老矿工以手抚轨，谓此铁出于层岩，今又归层岩。"
 KQP_Spirit_Engineer_State:"图纸代神谕"
 KQP_Spirit_Engineer_State_desc:"凡兴大役，先画图，图成而后议，议定而后动。图有署名，署者三人：一画，一算，一督。堤溃则问画者，算谬则问算者，工偷则问督者。老匠初不肯署，谓向来卜日兴工，吉则行，何须署名。主事者答以卜者不任其败，故可妄言；署者任其败，故不敢妄言。老匠默然，取笔署于图角，笔重，墨透纸背。图纸藏于黑岩厂图房，架分三层，按年编号。"
 KQP_Spirit_Teyvat_Convention:"万船守一规"
 KQP_Spirit_Teyvat_Convention_desc:"公约既成，凡三十七条，皆琐细。若遇风谁先让，若撞船谁任赔，若疫起则几日不得入港，一一具载。有讥之者曰：「此市井之约，何足称国。」主事者曰：「正惟市井，故须约。」神明一举手则山海易位，何须约；凡人一举手不过移一箱，故斤斤计较。是约也，不能约神，能约船。未几，稻妻之船与须弥之船相触于港外，各持一纸，争至日暮，卒无一矢相加。约成之日，诸使自孤云阁外海入港，桅上各挂本国之旗。"
 KQP_Spirit_Abyss_Ward:"井底灯不灭"
 KQP_Spirit_Abyss_Ward_desc:"巨渊之下，有物不可名。守渊者谓之偿，不谓之战。月取其额，如纳租然。岁计之，几当一军之饷。或请罢之，谓岁岁输此，何时而已。老守渊者答以此非输，乃买。问买何物。答以买井底三百人明日尚在。问者不能对。是夜渊口灯次第而明，守者更番，无一灯先灭。层岩渊口列灯三十盏，夜则次第而明，守者更番。"
 KQP_Spirit_Mortal_Rule:"论理不论座"
 KQP_Spirit_Mortal_Rule_desc:"新法之要，惟七字：「以理不以位。」刻于议事厅门楣，字大如斗，行人仰见。初有旧贵入议，坐首席，发言未毕，末座一小吏起而驳之，举三证，条条可核。贵人气结，指其座，斥其何人敢尔。小吏答以不问何人，问所据。满堂寂然。主事者取笔，书小吏之言于册，书毕，令此后议事，先据后位。七字刻于玉京台门楣，字大如斗，金漆已剥，石骨尚青。"
 KQP_Spirit_People_Army:"知为谁而守"
 KQP_Spirit_People_Army_desc:"军中之令，旧惟一语：不退。新令易之曰知所护。初易之日，老卒多不解，问护谁。校尉指营外之田，指田边之屋，指屋中之妇子，一一告之。老卒笑谓此亦须令乎。校尉答以须。向者不知护谁，故死不悔；今知之，故死不敢轻。老卒默然，退而抚其刀，刀鞘已裂，以绳缠之。营在璃月港北，营外即田，田边有屋，屋中有妇子。"
 KQP_Spirit_Liyue_Arsenal:"兵器刻匠名"
 KQP_Spirit_Liyue_Arsenal_desc:"兵工作坊，凡器成，必刻匠名于柄末，小如豆。匠问刻名何为，器既出，与己何与。监工答以器杀人，则问此刻。匠又谓人杀之，非器杀之。监工乃言：器不刻名，则人以为器自杀人；器刻名，则人知有人造之。匠不能答。自是坊中打磨之声较旧为细，废器亦少。老匠夜归，取废刀再磨，妻问其故，答曰：「此刀上有吾名。」坊中所用之铁，半出层岩，半出黑岩厂旧炉。"
 KQP_Spirit_Labor_Charter:"工时著为令"
 KQP_Spirit_Labor_Charter_desc:"宪章凡十四条。一曰工时，日不得过六；二曰工价，月必先给，不得拖；三曰伤病，折指者给半年之饷；四曰学徒，师不得以私役徒。有坊主读至第三条，掷纸曰：「此何异于养闲人。」旁一老工曰：「吾指折时，无人给吾一钱，吾犹自养二十年。」坊主默然。榜出之日，工者聚观，有识字者朗声读之，读至折指一条，众皆无声，有一人背身而去。榜悬于黑岩厂炉房门外，纸色转黄，边角为人所揭。"
 KQP_Spirit_Iron_Commune:"城中无笑声"
 KQP_Spirit_Iron_Commune_desc:"公社既立，全城编为工团。晨钟一鸣，众赴其位；暮钟一鸣，众归其舍。炉火昼夜不熄，产量倍于旧岁。墙上张巨榜，列各团之数，日易其数，数高者悬红旗。初，众争红旗；久，众但视数，不复言笑。有妇人抱儿过榜下，儿指红旗而笑，妇掩其口曰：「勿笑，看数。」主事者巡工，见一炉前无人，问之，曰：「其人昨夜倒，抬去。」主事者取笔于榜上添数，不添人。黑岩厂炉十七座，钟一鸣则烟齐上，望之如云覆崖。"
 KQP_Spirit_Eternal_Republic_Charter:"首条七字书"
 KQP_Spirit_Eternal_Republic_Charter_desc:"宪章开卷，第一条七字：「权出于民，还于民。」书者为一老儒，书毕搁笔，问此七字亦管书者乎。众答以管。老儒又问然则此书亦当受人之议。众答以当。老儒乃取稿，自删三款，谓此三款乃其私意，不宜入宪。删毕，退居末座。少年问其故。老儒曰：「吾书此七字，若自以为在其外，则此七字自成虚文矣。」宪章原稿存于群玉阁，凡三易，改字处皆留墨团。"

 KQP_Renew_Tier_1:"共和之阶"
 KQP_Renew_Tier_1_desc:"根基未稳，屋漏更逢连夜雨。人心未自战火回魂，新政一句，须说三五遍，方有人肯信。城中瓦砾未清，街名尚用旧称；归者寻其家，寻至旧址，只见新土。吏与之对册，册上名在，屋不在，乃于册旁注二字：待建。"
 KQP_Renew_Tier_2:"共和之阶"
 KQP_Renew_Tier_2_desc:"初有起色，市面渐有声。所缺者仍粮与人。如小儿学步，摇摇欲倒，却不肯坐。码头复开一段，泊船七艘；米铺开张五家，皆小。匠人自外乡归，携其徒三人，租屋于城南，白日修械，夜则教字。"
 KQP_Renew_Tier_3:"共和之阶"
 KQP_Renew_Tier_3_desc:"渐入正轨。田有稻，城有灯，账上头一回见盈余。人始以新规为固然。新规初行时，人皆怨其繁；三年之后，有吏偶循旧例，反为市人所诘，诘者持新规一纸至堂上。老吏闻之，谓其徒曰：「此即成了。」"
 KQP_Renew_Tier_4:"共和之阶"
 KQP_Renew_Tier_4_desc:"百废俱兴，工坊彻夜，船队不绝。繁荣如潮涌来，亦暗冲共和国最初之界。工坊增十七处，学徒不足，乃募童工，虽禁不止。议员提案限其工时，厂主联名抗之，谓限则工价涨，涨则船不来。"
 KQP_Renew_Tier_5:"共和之阶"
 KQP_Renew_Tier_5_desc:"四海咸服，仓廪实，人心齐，旧日仇家亦来递帖。刻晴却于最热闹时语众曰：「粮满则思变，屋固则忘危。」言毕，命开旧库，取历年灾册置于堂中，令诸司各读一册。读毕，无人言贺。是夜玉京台灯火通明，至晓未息。"
 KQP_World_Tier_1:"寰宇之阶"
 KQP_World_Tier_1_desc:"孤悬海外，诸国观望，商路断绝。邮袋之中，除自家公文，再无别物。使节遣出，多止于中途；外邦来书，封皮积尘。有司计之，谓一年所收他国文书凡七件，其中三件为贺岁，余四件求借粮。"
 KQP_World_Tier_2:"寰宇之阶"
 KQP_World_Tier_2_desc:"初通音问。有几家使节上门，所谈多半仍是试探。互相递茶，无人肯先交底。一使坐至茶冷，终不言其国之所求，起身告辞。送者归报主事者，主事者笑曰：「肯来坐一日，胜过十封国书。」"
 KQP_World_Tier_3:"寰宇之阶"
 KQP_World_Tier_3_desc:"商路重开，挂璃月旗之船复见于远方港口。外人始记得，此海上尚有此一城。港中牙人复操旧业，先议价，后叙旧。老舟人自远方归，言其地之人问及璃月，多先问一句：其秤尚准否。"
 KQP_World_Tier_4:"寰宇之阶"
 KQP_World_Tier_4_desc:"执其一端，璃月成此一带绕不开之一方。约须其签，争须其裁。风头之下，暗算亦生。使馆之外，常有不知名之车马夜过；码头之上，亦常有不知载何物之箱。有司增设巡夜一队，而不张其名。"
 KQP_World_Tier_5:"寰宇之阶"
 KQP_World_Tier_5_desc:"重执牛耳，璃月复立于提瓦特之中央。四方来聘，馆舍不敷，乃借民宅以居使节。刻晴却于最风光时语使团曰：「站得高则风冷，愈冷愈须把账算清。」是夜她独登玉京台，视满城灯火，久不移步。"
 KQP_PWCombo_Both_High:"星火燎原"
 KQP_PWCombo_Both_High_desc:"仓廪实，四方服。璃月之旗头一回为人迎入他国港口。刻晴独语左右曰：「为人所倚，比为人所畏，更易散架。」左右问其故。她指港口所悬诸旗，谓畏者尚知自守，倚者一散则无人相扶。诸旗悬于璃月港桅上，畏者自守，倚者一散则无人相扶。"
 KQP_PWCombo_Both_Low:"两头皆空"
 KQP_PWCombo_Both_Low_desc:"田里未生粮，海上无人应。议会日日开会，开至末了，只剩翻纸之声。案上议案积至三摞，最上一摞已蒙尘。有议员提议减议期，众皆默然，无一人附议，亦无一人反对，遂作罢。散会之后，议场灯先熄。玉京台议案积至三摞，最上一摞蒙尘，散会后议场灯先熄。"
 KQP_PWCombo_A_High:"闭门自守"
 KQP_PWCombo_A_High_desc:"内政理得顺，关起门来谁都不欠。粮食够吃，外交邮袋却空得能听见风。仓廪有余，乃置新仓三座；而码头之上，他国之船一年少似一年。老吏谓主事者，谓富而不通，如蓄水于瓮，久则生苔。新仓三座立于归离原，而南码头他国之船一年少似一年。"
 KQP_PWCombo_B_High:"借势而起"
 KQP_PWCombo_B_High_desc:"海外之约一份接一份，城中之路却未修完。名声走得比粮快，早晚回头补票。使馆新开四所，而城中主街之石三年未换；外邦使节入城，车过处颠簸作响。主事者闻之，命先修此街一段，曰：「人先看路，后看约。」璃月港主街之石三年未换，使节车过颠簸作响，乃命先修一段。"

 #################### 凝光 · 天权临时政府 ####################
 LYY_CivilWar_Tianquan:"群玉阁复升临政"
 LYY_CivilWar_Tianquan_desc:"帝君崩后七日，群玉阁复升。凝光立于浮廊之上，俯瞰此城，城中去神已七日矣。她不言摄政，不言称制，惟取告示一纸，书临时政府四字，以小锤三击，钉于议事厅门楣。钉毕，退三步视之，曰：「璃月所要者，非一明主，乃一本记得清、查得到、赖不掉之账。」"
 LYY_Seal_the_Harbor:"商船结阵封内港"
 LYY_Seal_the_Harbor_desc:"港者，第一道防线，亦第一笔买卖。凝光命以商船结阵，横塞内港，樯橹相衔如城。封港之期，惟持通行令者得出入。有掌事问此令何价。凝光曰：「不取钱，取人情。今日得令者，他日当以倍偿之。」掌事沉吟而去，归途语其伙曰：「此位天权，所卖非货，乃将来。」通行令以玉京台官纸印制，凡一令一验，验讫之印用朱泥。"
 LYY_Call_the_Guilds:"百工列印长桌前"
 LYY_Call_the_Guilds_desc:"百工之印，列于长桌，凡三排：铁、木、船、染、盐、茶、丝、瓷。满堂掌事屏息，凝光只出一语：「往者尔曹纳税于神，今当有人向尔曹索账，此人最好是尔曹自择。」语毕，堂中无应，惟闻衣声。少顷，盐商先起，按其印，余家次第从之。印泥新调，按之有声，堂外可闻。按印之堂即群玉阁正厅，厅中长案九张，案上印盒皆新。"
 LYY_The_Provisional_Council:"廊下新设议事厅"
 LYY_The_Provisional_Council_desc:"临时议事厅设于群玉阁之下层，桌椅新制，油漆之气未散。凝光定席次：每区一席，每业一席，虽知其必争，不削。有幕僚曰：「此辈聚则唯吵耳。」凝光曰：「一政而无吵架之处，终必于别处动手。」幕僚不复言。开厅首日，八区之人果争至日昃，凝光坐而听之，未断一事。"
 LYY_Reclaim_the_Customs:"税关换钥系红绳"
 LYY_Reclaim_the_Customs_desc:"税关之钥，尽换新串。凝光不究旧吏，惟命于每本税簿穿红绳一根，标其年月，钤以小印。有吏问：「旧账多缺，奈何。」凝光曰：「缺者书缺，不必补；补则后人不知何处曾缺。」自是每笔出入皆有人认。月余，旧吏有自请留任者，凝光许之，惟令其先署一纸，自陈旧账所缺之处。海关旧署在南码头，署前旗杆换新，旗书验讫二字。"
 LYY_The_Golden_Ledger:"金册重铸第一页"
 LYY_The_Golden_Ledger_desc:"金册重铸之夜，群玉阁上下灯火通明，无一室暗。凝光亲书天权二字于首页，又亲取旧册末页，一字不易，抄入新册。左右问：「旧债何必尽录。」曰：「一国之信，不在借得多少，而在敢不敢将欠账一页不落地传下去。」抄至夜半，笔锋稍滞，自取茶一盏，饮尽，续抄，天明乃毕。"
 LYY_Contract_Law_Restored:"三印同落一纸"
 LYY_Contract_Law_Restored_desc:"契约法复立，首案为两家船行争一码头，讼牒盈尺。凝光不亲裁，取判词付三行首，皆素不相识者，令共署。三人初有难色，凝光曰：「法之所以为法，正因署者之中，无一人能只手遮天。」三人乃闭户三日，出而署之。判下，两造皆服。旁有老吏记之曰：「此案无胜者，亦无败者，惟法胜。」判牍之副本藏于月海亭，亭吏抄录三份，一份悬于渡口。"
 LYY_Currency_of_Trust:"开箱兑钞至黄昏"
 LYY_Currency_of_Trust_desc:"纸币初行，不复以神明为质，而以税关所贮之金为质。有富户连夜挤兑，市中哗然。凝光命开库，陈金于庭，来者一人，兑一人，一枚一枚数之，不催不拒。兑者自晨至暮，队尾渐短，至灯上，无人复来。一老妇兑得铜钱数串，临去，回视庭中金箱，曰：「原来这纸背后，压着如此重之物。」兑所设于绯云坡街口，柜面钉铁皮，兑讫之戳一日一洗。"
 LYY_Merchant_Militia:"秤字旗下列港岸"
 LYY_Merchant_Militia_desc:"商团护卫之旗，绣一杆秤，不绣刀。凝光语众曰：「钱，死物也；护钱者，活人。」连自家码头亦不敢守之商贾，不足与言通商。护卫队遂沿港列阵，商船炮口尽朝海外。有老掌事见之，抚旗而叹曰：「做四十年买卖，头一回将秤悬于旗上，而不挂于门首。」旗风猎猎，秤星微晃，港口一时无一人喧哗。商船列于南码头外，凡四十艘，桅顶各悬秤旗一面。"
 LYY_Open_the_Markets:"三通锣后撤关卡"
 LYY_Open_the_Markets_desc:"市集重开之晨，码头铜锣三响。凝光尽废旧日杂税，只留货税一道，明榜于关前。商贩初不信，聚而观榜，无人先动。至日中，一挑夫挑担径出，守关者视其货，验其票，拱手放行，不复索钱。挑夫行数步，回顾，忽扬声长呼。一呼既起，满街应之，市声骤热，如冰解。旧关之卡于次日尽撤，南码头卡房改为茶棚，行旅至此可歇一盏。"
 LYY_Census_of_Wards:"八区挨户点丁口"
 LYY_Census_of_Wards_desc:"八区清册，量人，亦量税基。吏员挨户而入，书户主、丁口、所业、屋几间、灶几口，连灶边打盹之猫亦记一笔。有民怨其烦。凝光闻之，曰：「连人有多少、锅有几口都数不清之政府，凭甚么言公平。」册成，凡三易稿，末卷附一表，列无田、无屋、无丁者若干户，凝光命置于案头，不时取阅。造册之吏凡六十人，分查璃月港九坊，坊界以街石之色为别。"
 LYY_Debt_Redemption:"三倍之息即废"
 LYY_Debt_Redemption_desc:"旧债堆积如山，债主之中，有士绅，亦有走投无路之贫户。凝光定令：凡利滚利逾本三倍者，一概作废重议。令下，港口几半之人詈之。是日暮，她微服过当铺，闻一老妇对门而坐，喃喃曰：「总算有人替吾辈算过，甚么才是真还不起。」凝光立檐下听毕，不现身，归署即命增一条：老弱之债，另册别议。当铺之册另立一柜，柜在北码头分号，册皮以青布包之。"
 LYY_The_Northern_Trade:"至冬驮队叩税关"
 LYY_The_Northern_Trade_desc:"至冬商队自陆路入境，驮毛皮、矿石、烈酒，驼铃响于城外。凝光命账房连夜核其货单，恐货中夹他物。核至天明，无所得。乃作回函一纸，语甚恭而意甚坚：买卖吾欢迎；惟璃月之码头，只卸货物，不卸他国之规矩。使者读竟，笑而收之，曰：「天权之言，比雪还冷，比雪还清。」北货卸于石门关外新仓，仓凡六楹，北商验货不出关。"
 LYY_Guild_Charters:"特许一纸难求"
 LYY_Guild_Charters_desc:"特许状一纸难求，掌事们挤破天权商会之门，自晨至暮，阶下不绝。凝光定价：最古之业，取其最重之价；最新之匠，留其最宽之口。有铁坊少年得状，捧之而出，手抖几坠。或问其法。凝光曰：「吾要者无他，凡想赚大钱之人，先学守一点规矩。」闻者以为苛，然三年之间，新匠之铺倍于旧。行状张于群玉阁下层，凡百二十纸，观者旬日不绝。"
 LYY_The_Right_Question:"横批空悬待人书"
 LYY_The_Right_Question_desc:"凝光于议事厅正中悬对一副，上联取利于民，下联还法于民，横批处空白一纸，久悬不书。议员聚而议之，或主书共和，或主书契约，争数日不决。凝光立于阶下听毕，轻声曰：「此三字不该由吾一人书。」众皆默然。是夕，有少年议员取笔登梯，于纸角书一墨点，复下，曰：「先留一痕，待后人续。」议事之厅在玉京台西，厅高两重，登梯之痕至今在纸。"
 LYY_Charter_of_Freedoms:"第一条同守一法"
 LYY_Charter_of_Freedoms_desc:"自由宪章草成，最难着笔者，义务一款。凝光删而复改，凡七易稿，终定首条曰：「凡在本港经营者，无论贵贱贫富，皆同守一法。」宣读之日，有老士绅当场摔茶盏，瓷碎于阶。亦有人默取副本，纳袖而去。此后每有争，辄有人出此本诵之，诵至首条，堂中必静。碎瓷之片，当日无人扫，次日犹在阶隅。副本之纸以群玉阁特制笺印，一页一印，伪者无从仿。"
 LYY_An_Independent_Judiciary:"法司别立一门"
 LYY_An_Independent_Judiciary_desc:"法司迁出议事厅，移于临街小楼，门窄而窗多，行人可自窗下过。凝光亲督匠人，刻民可问官四字于石阶，命撤门前石狮二。有吏曰：「无狮则不成衙门。」凝光曰：「法院若在衙门之内，永是衙门之家法；惟在街上，方或可为百姓之靠。」石狮移去之日，童子数人踞其座为戏，无人驱之。法院新址在绯云坡下，门前石阶七级，阶上无狮，惟石座二。"
 LYY_The_Assembly_of_Wards:"八区八音争一日"
 LYY_The_Assembly_of_Wards_desc:"八区议会初开，八区之代表以八种口音争一日，自晨至暮，未成一事。凝光坐于台下，未插一语，惟以笔记其争之次序。散时或问：「明公何不主持。」凝光笑曰：「吾一开口，彼先看吾面色，则此会与不开同。」问者曰：「然则何时可成。」曰：「待彼等吵至不必看吾面色之日。」此后三月，会中渐有互让，凝光犹坐台下。议事厅设于玉京台东偏厅，席位凡六十，无主位，环案而列。"
 LYY_Free_Port_Act:"灯塔彻夜照万旗"
 LYY_Free_Port_Act_desc:"自由港法案既过，港口灯塔彻夜不熄，光及数里。自此不问所挂何旗，但守港规者，皆可卸货、补给、易钱。市中有詈凝光卖璃月者，聚于关前，声闻于内。凝光不使人驱，惟于法案末添一句：「门若关上，锁在屋里者，终是屋中人。」詈者读之，声渐低，至暮乃散。灯塔之光，照其背影而去。灯塔在南码头尽处，塔灯彻夜，法案之榜嵌于塔基石中。"
 LYY_Abolish_Guild_Monopoly:"旧行壁垒一朝倾"
 LYY_Abolish_Guild_Monopoly_desc:"废垄断之令下，数十年行会壁垒，一朝而倾。老掌事数十人聚于商会门前，举木牌，上书传统二字，自旦至暮不去。凝光凭窗视之，不怒，亦不使人驱。她所见者非此数十人，乃当年被门规攥死之新匠：有善锻者不得入行，有巧织者不得挂牌，终身为人作嫁。良久，命人送茶出，附一语：「牌举久了手酸，喝了再举。」旧门规之牌尽缴于天后宫前，牌凡三十七面，当场劈之作薪。"
 LYY_The_Tax_of_Consent:"加税先问八区"
 LYY_The_Tax_of_Consent_desc:"税须经民同议，六字既悬，旧贵之心皆惊。自此凡加一税，必先过八区议会。首试其法者，是一位老议员，请加茶税以充军资。登堂未半，为卖茶之妇、运茶之夫、种茶之农相继驳之，语至刻薄，老议员面赤而不能答。议罢，税不果行。散后，老议员独留，向凝光深深一揖，曰：「此方是议事厅应有之状。」凝光还揖，不发一言。议税之会在月海亭，亭中茶三巡，议题一，三巡毕而议定。"
 LYY_Schools_of_Law:"律学馆开讼师侧"
 LYY_Schools_of_Law_desc:"律学馆开于旧日讼师之隔壁，两门相邻，隔一墙，墙薄可闻声。凝光请退役判官、老账房、曾为人写状之讼棍登堂授课，不避其出身。有士人非之。凝光曰：「使民知法，非为使民好讼，乃使之知法是一物，可执于手，可用于身。」开学之日，来者三十七人，有挑夫、有船妇、有染坊学徒，坐满一堂。法堂初设于吃虎岩旧仓，课桌以码头栈板改制，尚带钩痕。"
 LYY_The_Citizen_Merchant:"公民册薄于族谱"
 LYY_The_Citizen_Merchant_desc:"自此商人之身分，不尽书于族谱与商号，另书于一册薄薄之公民册。册在手者，可罢市，可投票，可于议会状告官府。有老掌事捧册久视，以指摩其封面，喃喃曰：「吾做五十年生意，头一回自认非一件只会赚钱之家什。」语毕，自取笔墨，于册上补书其母之姓。旁人问之，曰：「从前只写商号，今日想写个人。」其册后陈于群玉阁货籍之列，商号之外，人名另立一栏。"
 LYY_Banking_Charter:"备本入钱庄簿"
 LYY_Banking_Charter_desc:"钱庄宪章定准备金、放贷、清算之法，凡三章二十九条，将从前靠交情与面子撑着之生意，改作一行行可核之数目。老掌柜皆以为太死。是冬，大户挤兑，银根几断，凝光命按章开库、按章兑付、按章停贷，三日而定。事毕，老掌柜来谢。凝光曰：「规矩越硬，人心才越软得下来。」掌柜唯唯，退而取章程一部，置于柜上，与算盘并列。章程刻版印行，凡三百部，一部悬于绯云坡钱庄壁上。"
 LYY_Treaty_of_the_Harbor:"遇险互救共署名"
 LYY_Treaty_of_the_Harbor_desc:"港口公约所载四事：遇险互救、泊位公平、货税画一、争端共裁。签约之日，诸国商号之印列于纸上，密如蚁行。有客问凝光：君凭甚么信他人守约。凝光不答，引之至纸末，指其印曰：「凭此。此番赖账之人，非赖一家之账，乃赖满纸之账，日后无一处可泊。」客视印良久，曰：「此约不似约，倒似一张网。」凝光曰：「网者，捞鱼亦护鱼。」其印为群玉阁监造，印文十二字，字字可对原约。"
 LYY_The_Open_Ledger:"码头立板书公账"
 LYY_The_Open_Ledger_desc:"公账公开之日，码头边立一巨板，高逾人，逐笔书其出入：某日收若干，某日支若干，某笔为何人所领。有好事者携算盘至，自午核至深夜，灯下拨珠，终不得一隙，悻悻而去。次晨复来，又核一日。凝光闻之，命为核者设一案一灯。或问其故。曰：「吾敢摊此账，非因不怕人查，乃怕有一日无人肯查。」查账者案设于群玉阁账房南窗，灯为官烛，烛尽则续，不问其数。"
 LYY_Protection_of_Craft:"匠作条文细如缝"
 LYY_Protection_of_Craft_desc:"匠作保护之条，写来琐碎：工时几何，学徒几年，工价几档，伤者抚几成，老者退养几许，一条一条，如缝一件贴身旧衣。有议员以为烦。凝光曰：「通商非使强者通吃。若连最会做手艺之人，也被挤成穷光蛋，此港所余者，不过一群倒买倒卖之贩子。」条文既颁，匠户门前各贴一纸，纸角以米糊粘之，风过不落。贴纸之风自北码头起，旬月之间，匠户门前纸色新旧相错。"
 LYY_The_Provincial_Compacts:"盟约三裂而后成"
 LYY_The_Provincial_Compacts_desc:"诸省盟约，谈而裂者三。第一回争关税，第二回争驻兵，第三回争谁先署。至第四回，诸使皆疲，取一揉皱之纸，就案而书，八省各让一步，无一人占尽便宜。凝光按印毕，曰：「完美之盟约，皆死人所作；活人所签者，总要缺一角。」缺处不必讳，留与后人补之。诸使视纸上那一角空白，皆笑，笑中有倦色。盟成，纸不复誊清，即以其皱者存档。盟约存于群玉阁档房，皱纸以平木夹之，缺角一页独置一函。"
 LYY_Constitution_of_Jade:"玉律颁时天微雨"
 LYY_Constitution_of_Jade_desc:"玉律宪法颁下之时，群玉阁上忽起细雨，檐溜成线。凝光不读全文，只念开篇一句：「璃月之治，源于契约，归于契约。」念毕，台下寂然，久无人动，而后掌声如雷，屋瓦皆震。凝光立于雨中，衣半湿，反觉肩上之重量生疏。事后语近侍曰：「此物既出，吾亦在其内，不复在其上。」近侍不解，凝光亦不再言。"
 LYY_The_Everlasting_Compact:"百年之约末一行"
 LYY_The_Everlasting_Compact_desc:"永续之约，以一年之诺，写为百年之期。有笑之者，曰：「商人只做眼前买卖，百年之事，谁复记之。」凝光不辩，惟于约末书一行小字：「吾今日所定之规，未必比吾活得久；然吾望其比下一个贪心之人活得久。」书毕，命以双份抄之，一存商会，一存议事厅。笑者后亦署名，署时手指微顿，凝光视之，不言。双抄之纸一存群玉阁，一存玉京台，匣皆加锁，钥各执其一。"
 LYY_Merchant_Privy:"茶室一席决半港"
 LYY_Merchant_Privy_desc:"商会枢密，无衙、无印、无吏，只借一间茶室议事。十余人围坐，茶过三巡，一句尾音、一个眼色，便可决半座港口之运。凝光坐于主位，视此辈，忽觉其比官府更像官府。归途轿中，自语曰：「吾非破旧序，乃为旧序换一件更体面之衣。」轿外市声喧然，她以手按额，良久不语。次日，命人于茶室门外立一木牌，书议事时辰，许人观听。茶室之牌立于绯云坡口，牌书三辰，过辰者听而不言。"
 LYY_Closed_Ledger:"密账积厚难翻"
 LYY_Closed_Ledger_desc:"密账不宣。自此天权商会要紧之数，只书于两三本不示人之册。凝光初谓此乃非常时之权宜，每一笔皆自解曰：「待事定即公之。然册页日增，一册未毕，一册又起，积至盈尺。」某夜取最厚者翻之，翻至中途，手止。她比谁都清楚：一本不肯与人看之账，本身即是一纸供状。是夜灯尽，她未添油，坐至天明。积账之柜在群玉阁下层，凡九格，最厚一册，封皮已裂。"
 LYY_Company_Militia:"双饷之兵认二主"
 LYY_Company_Militia_desc:"商团私兵成军，旗号各家自绣，号令则出于同一茶室。兵给双饷，一饷出于本号，一饷出于商会，故认二主。忠信既有明价，士卒自亦明白，操练时口号喊得极齐，齐得有些刺耳。凝光阅其阵，忽忆昔日曾笑刻晴之民兵为乌合。至是方知：以钱买来之兵，比以信聚来者更听令，亦更易变。归署后，命于名册首叶书四字：「饷可倍，心不可倍。」名册以群玉阁黄纸印行，凡四千名，首叶四字以朱圈之。"
 LYY_Tariff_Walls:"关税壁垒次第立"
 LYY_Tariff_Walls_desc:"关税壁垒一道复一道，立如城垣。外货阻于港外，本港库房反堆满滞销之物。商人们却拊手称快，以所挡者多是他家之货。凝光不阻，亦不禁，惟于深夜独登群玉阁，望海。远处海面被壁垒隔作内外，桅灯稀疏，风送潮声，如有人在墙外叩门。立至夜深，始下一语：「墙筑得愈高，门便愈少；门少，则叩者必众。」左右记之，然无人敢请撤墙。"
 LYY_The_Guild_Supreme:"律未立先问商"
 LYY_The_Guild_Supreme_desc:"商会至上之条既行，天权商会自议事之厅堂，变为发号之衙门。自此律法须问商会之意，官吏须经商会之遴选。凝光行此路甚稳，稳至一日晨起对镜，忽不能辨镜中下令之人，是自身，抑或她曾深恶之那些影子。她以手拭镜，镜面愈明，影愈清晰。是日议事，她一言未发，散后独留，取旧日商会初创之名册阅之，阅至末页，合而不语。旧名册藏于绯云坡会馆阁楼，纸黄而字清，末页按印者十一。"
 LYY_Bonds_of_Power:"一票之债押忠诚"
 LYY_Bonds_of_Power_desc:"权债者，以忠诚为质之契也。借之者，于下一次表决，便欠凝光一票。她将权力做成一本账，逐笔登记，笔笔有著。账房先生曾问：「此账何以为偿。」凝光曰：「以票偿。」先生曰：「票可再借乎。」凝光不答。她自知其险：账最怕利滚利，滚至无人能偿之日，收账者与欠账者，便同随此城而下沉。所发之票以北码头仓单为质，票面书仓号，验之可对。"
 LYY_The_Silver_Fist:"白银拳落无声息"
 LYY_The_Silver_Fist_desc:"白银铁拳落下时，不闻其声。罢工之行首忽觉货款冻结，闹事之商户忽觉己身已为不合法之人。凝光从不动刀，只令不听劝者于账面上悄然消失：户头注销，保单作废，契书失效，皆依例而行，无一条可指为枉法。尝语近侍曰：「青铜之拳，留下印子；白银之拳，留下欠条。」近侍问：「欠条何人偿。」曰：「总有人偿。」作废之契焚于天后宫前，灰扬于海风，观者散后拾得残角一。"
 LYY_Purchase_the_Qixing:"股份红利买一席"
 LYY_Purchase_the_Qixing_desc:"赎买七星，几可称温柔之收编。凝光以股份、以红利、以一纸终身奉养，请旧日同僚体面退场。有人受之，有人拒之，亦有人含泪于转让书上按印，印成而手不去。是役也，不闻兵戈，不见血。然七星那把椅子，自此再未坐过第二人。有老星退居城外，临行谓送者曰：「吾非卖位，乃卖一个再不必与人争之清净。」送者归报，凝光听毕，令加其奉养一等。奉养之加自南码头仓廪支给，米月一车，车户世代承其役。"
 LYY_Monopoly_of_Jade:"山铜尽入一炉"
 LYY_Monopoly_of_Jade_desc:"玉税专营，举矿脉、铸币、盐茶诸利，尽攥于一手。凝光言此为国立财，反对者问：「财聚于谁。」她固知答案，故不答。然至此时，她已离不得这一套：铸币之炉一日不熄，军饷、赈米、修港之费皆无所出。犹巨鲸吞海，海在腹中，欲吐不能，而海水正一寸一寸，将它压向深处。某夜她独坐库中，闻铜钱相击之声，久不能寐。铸币之炉在群玉阁地底，炉声彻夜，闻者不知其处。"
 LYY_The_Quiet_Council:"议如旧票如废"
 LYY_The_Quiet_Council_desc:"静默议会之中，议员仍按时而至，按序而言，惟无一票可改其议。凝光尽留其形式：议程、记录、表决、鸣钟，一毫不减。她太懂形式之价：形式能使一件并不存在之事，显得煞有介事。故她亲手护住象征，亦亲手掏空象征。有老议员退席时，向空座一揖，曰：「吾所揖者非人，乃此厅昔日之声。」凝光适在门内，闻之，未出。空座在玉京台正厅第三席，座面无尘，岁拭之如新。"
 LYY_Gold_and_Steel:"铜钱利刃并绣旗"
 LYY_Gold_and_Steel_desc:"金与钢浇于一处，铸成天权最利之二物：钱与枪。商会出钱，私兵出枪，二者合流之后，此城之中，再无人能兼缺二者而存活。检阅新军之日，旗上第一次并绣铜钱与利刃，钱在下，刃在上。凝光立于旗下，仰视良久，忽不能辨：钱使枪乎，枪使钱乎；彼为吾效力乎，抑吾为彼效力乎。风动旗角，钱纹翻覆，刃光一闪而隐。其旗凡三面，一大二小，大者悬于南码头辕门，风起则展。"
 LYY_The_Inevitable_Contract:"非常之时四字诀"
 LYY_The_Inevitable_Contract_desc:"必然之约末条曰：「为免秩序崩坏，天权得于非常之时便宜行事。非常之时四字，无定义，亦不必有定义，因定义之者，即欲使其无限延长之人。」拟稿者曾请加一注，凝光止之，曰：「加了注，反倒显出心虚。」署状之日，笔尖在纸上顿之良久，墨洇作一小团。她终未重写，只将此页折角为记。折痕至今犹在。状纸之存本在月海亭档柜，折角一页独占一函，函面无字。"
 LYY_Tianquan_Eternal:"临时二字自名除"
 LYY_Tianquan_Eternal_desc:"天权永续。凝光终将临时二字，自政府之名中彻底抹去。加冕之日，群玉阁饰以锦缎，缀灯千盏，全城张灯，海面亦映作一片金。她端坐最高处，俯视万家灯火，鼓乐喧天。正在最喧闹之一刻，她忽忆多年前彼初接商会、尚信账目可以衡量一切之少女。那时她算得清每一笔，却算不出今日。乐声未歇，她以袖掩手，指节微白。"
 LYY_The_Final_Balance:"左金右律秤不落"
 LYY_The_Final_Balance_desc:"终局之秤，乃天权为自己算之最后一笔账。左盘黄金，右盘律法，指针在二者之间摇摆，自暮至晓，不肯停下。凝光守此秤坐一整夜，未曾合眼，亦未曾伸手去按。天明时，方对近侍曰：「记下来。」近侍问：「记甚么。」曰：「记此秤，自来未真正平过。」近侍落笔，笔尖微颤。凝光视秤，复曰：「也记它一夜未停。停与不停，俱在它，不在我。」此语后入档，档房在群玉阁七层，窗向北，终日无直光。"
 LYY_Question_the_Contract:"三百年两契相对"
 LYY_Question_the_Contract_desc:"凝光自锁于空旷之契约库中，一夜不出。先取旧契一卷，纸色如秋叶，是三百年前帝君亲书之第一款；再取新契一卷，墨犹未干，是她昨夜所署。两纸相隔三百年，并陈于案，字迹竟出奇相像：起笔皆稳，收笔皆藏锋。她以指循其行，忽而自问：「吾推翻旧契之法，是否正写成又一纸旧契。」库中无灯，惟窗隙月光，照此两卷。"
 LYY_The_Chasm_Ledger:"层岩一册记名"
 LYY_The_Chasm_Ledger_desc:"层岩之账，所记是命。每一锹矿、每一根轨，背后皆有一个名字，名字之后又有家口。凝光遣最精明之账房入巨渊核之，去者五人，归时面色皆不好看，无一人先开口。良久，一人呈册，曰：「此账不可细算。」凝光披至夜半，于封皮批四字：「此账宜轻。」批毕，又取笔添一行小字：「凡有名者，不得以数目代之。」是册后藏于密格，不轻示人。"
 LYY_Sea_Lanes_Guard:"重立海防护归舟"
 LYY_Sea_Lanes_Guard_desc:"航道者，璃月之血脉，扼之则扼此城之咽喉。凝光重建海防，不为称霸，只为使每一艘挂璃月旗之船，皆能平安归港。有笑其多事者。是日她立于望楼，以远镜视海上桅影，曰：「能载货至天涯之人，也该有本事守家至天涯。」言毕，命塔上添灯三盏，凡归舟夜至，先见灯，后见岸。自是新塔十二座，火相接，夜不绝。塔灯之油由南码头仓拨给，岁凡四百斤，风大之月倍之。"
 LYY_Whispers_from_the_North:"北使求租一整港"
 LYY_Whispers_from_the_North_desc:"北国密使来，比商队更勤。所言者非货，乃更深之合作，乃一纸可将璃月港全港租出之约。凝光读三遍，于末尾批一句：「生意可做，港口不作抵押。」密使色冷，问：「君想清楚代价了么。」凝光曰：「算过，算得比君清楚。」密使曰：「愿闻其数。」凝光不答，以合约还之，曰：「君自算，算完再来。」密使携约而去，行至阶下，回视阁上灯火，久立乃行。"
 LYY_War_of_Ledgers:"满厅铺尽三年账"
 LYY_War_of_Ledgers_desc:"账与剑，终究要相见。凝光取三年来之契约、公债、地契，尽铺于议事厅，自门至阶，几无隙地。满堂议员立于纸上，不敢移足。凝光曰：「战争之每一发炮弹，皆在此账之中；诸君欲战，先想清楚拿甚么去赔。」堂中无人鼓掌。散会时，众人脚步皆比往常更沉，纸被踏出浅浅之痕。侍者次日收纸，见痕最多之处，乃七星旧席之前。散会之厅在玉京台，纸痕之深者，次日命人换纸重铺。"
 LYY_Reunify_Liyue:"换榜合旧账"
 LYY_Reunify_Liyue_desc:"内战结束之日，凝光自门楣取下临时政府之告示，换上新榜。登群玉阁顶，俯瞰重新连成一片之璃月，手执那本记了数年之旧账。风大，纸角翻动，她以掌按之。立良久，未发一言。最后轻轻合上，对自己曰：「账清了，人也该往前看。」言毕，视此册良久，又曰：「只是此页之后，还有无数空纸待填。」她将旧账交与掌库者，命入档，不入秘阁。"

 LYY_civilwar_category:"天权之秤"
 LYY_civilwar_category_desc:"天权当国，内战诸决尽归此秤。两轴并悬，一量政务，一量商路，每举一事，轴移级改。凝光所求，只在把港口之序与一城之利稳握掌中；缓急之间自有分寸，绝不轻押全局。彼每行一步，先算后落，只问此注值不值。"
 LYY_decision_audit_ledger:"核账度支"
 LYY_decision_audit_ledger_desc:"旧账尽搬出，堆满一廊，尘起三日不散。吏执筹，逐页勾稽。有老吏问：「翻旧账，徒招人怨。」凝光曰：「不翻，则不知谁在吃；不知谁在吃，则下一笔还会被吃。」勾至第七日，勾出空名十四条，众吏皆骇。凝光只令照名追补，不捕一人。旧账搬出，堆满玉京台东廊，尘起三日不散。"
 LYY_decision_charter_company:"给契立商"
 LYY_decision_charter_company_desc:"特许状者，一纸钥匙。给谁，即把一扇门交于谁手。幕僚问：「立契易，收契难，何不少给。」凝光曰：「门总要开。与其待人自凿，不如吾授其钥，且记其名。」遂给三纸，各注年限，限满即收，不作情面。特许状用厚纸，钤璃月港商会印，印文端方，边有缺口。"
 LYY_decision_open_market:"开埠通商"
 LYY_decision_open_market_desc:"码头敞开，四方差船皆可入。市声一起，钱来得快，是非也来得快。有司请设关禁。凝光曰：「港不买卖，即成死港；死港不生盗，亦不生人。」遂尽撤旧禁，只留一簿，凡入港者书名、书货、书所往。港门尽撤旧禁，只留一簿，簿置于南码头栅门侧。"
 LYY_decision_harbor_patrol:"护舟记路"
 LYY_decision_harbor_patrol_desc:"船出海，须有人替其记归路。巡防不为争雄。有问：「不争雄，养此兵何为。」凝光曰：「使盗知此道上有主。」遂发舟六，不张旗，不鸣鼓，昼夜循道而行。三月，劫案绝，商船自至。巡舟六艘发於南十字港，不张旗，不鸣鼓，昼夜循道。"
 LYY_decision_buy_loyalty:"以金买诺"
 LYY_decision_buy_loyalty_desc:"以金买交情，最速，亦最短。幕僚谏曰：「此辈今日受金，明日即受他人之金。」凝光曰：「吾不买其心，只买其一月之不动。」遂按月给之，不一次给；给时必使其知此金出于何处，断则自何处断。金按月给，发於群玉阁账房，给时必使其知所出。"
 LYY_decision_public_ledger:"悬账于市"
 LYY_decision_public_ledger_desc:"账挂于众目之下。有僚属谏曰：「一城之账，摊于市井，恐为人所算。」凝光曰：「不敢使人查账之官府，与不敢开匣之商号，何异。」账出三日，市人聚观，指其数而议。一老贩曰：「此数比吾家账还细。」账张于璃月港南市口，纸以浆粘，观者自榜下排至巷尾。"
 LYY_decision_press_guilds:"劝课商工"
 LYY_decision_press_guilds_desc:"官府不下田，只聚种田之人于树下。教者不读经，以指画地：此处可再一垄，此处可早三日下种，此处卖与谁价高。劝课二字听之温，落到账上，皆是实进。一岁之后，谷增二成，而教者之名，无一在册。教者聚农人于翘英庄树下，以指画地，画一垄又一垄。"
 LYY_decision_subsidize_grain:"平粜粮价"
 LYY_decision_subsidize_grain_desc:"粮价一涨，人心即晃。开仓平粜，最亏本。有司请罢。凝光曰：「此买卖不赚，然可使米价疯长之夜，街无哭声。」遂行。米价三日而平，账面亏八百金。凝光批一字于册尾：「值。」平粜之摊列于璃月港南市街口，三日而价平，账亏八百金。"
 LYY_decision_recruit_clerk:"募笔与口"
 LYY_decision_recruit_clerk_desc:"新政须会写字之手，亦须守得住口之人。招录之日，不考诗赋，只试三事：一纸契，算其息；一份牒，摘其要；一问旧主，观其色。取者四十人。凝光语之曰：「汝等只认章程，不认旧情。认得旧情者，今日便可去。」招录设于玉京台西廊，案上置契一、牒一、砚一。"
 LYY_decision_issue_bonds:"借明日钱"
 LYY_decision_issue_bonds_desc:"公债者，借明日之钱，花于今日。借时千金散尽，还时方知：所押出去者，非金，乃往后每一代璃月人对这座城之信。信一破，债虽清而国已虚。故借债之先，当问还债之人肯不肯。债券用厚纸，编号以朱，藏于群玉阁石室。"
 LYY_decision_envoy_to_keqing:"使者赴玉衡"
 LYY_decision_envoy_to_keqing_desc:"使者所携，唯账册一部。凝光附书一纸，曰：「政见可不同，账总要有人会看。」使者归，述刻晴接册，不答书，先翻至末页，看其结数，看毕乃曰：「此人可与共算。」凝光闻之，笑曰：「吾所待者，即此语也。」使者携账册一部，自玉京台出，行三日方至。"
 LYY_decision_envoy_to_ganyu:"使者赴月海亭"
 LYY_decision_envoy_to_ganyu_desc:"月海亭檐角挂霜，未化。使者归，携粮账一部，细至石米。附甘雨一语：「账目清者，方配谈天下。」凝光取其语，抄入手札，抄毕又看一遍，曰：「此语非赞吾，乃试吾。」"
 LYY_decision_envoy_to_shenhe:"使者赴绝云间"
 LYY_decision_envoy_to_shenhe_desc:"绝云间不问世事，使者却为留三日。归时携回一片不化之雪，并一语：「汝等之律，量不出雪山之重。」凝光取雪置案上，看其不化，久不语。幕僚问此语何意。凝光曰：「意为吾辈之尺，尚短。」"
 LYY_decision_envoy_to_childe:"使者赴云来海"
 LYY_decision_envoy_to_childe_desc:"公子之船队泊于港外，甲板上却设一桌酒。使者归，言其不谈战，只谈秩序，谈得比商人更像商人。凝光听毕，曰：「会做买卖之敌，比只会打仗之敌，更难对付。」语毕，命人查其船所载，查得尽是粮与铁。舟泊云来海，所载惟粮与铁，箱以杉木，箱角包铁，铁已生锈。"
 LYY_decision_envoy_to_lanyan:"使者赴沉玉谷"
 LYY_decision_envoy_to_lanyan_desc:"使者携账册一箱上山，欲示璃月港亦能算清水土之账。蓝砚不接册，只回赠旧秤一杆，秤星已磨，曰：「汝等之秤量货，吾之秤量山。」使者携秤归。凝光执秤，称米一斗，秤不举，曰：「此秤不肯称米。」"
 LYY_decision_proclaim_the_compact:"十二方共约"
 LYY_decision_proclaim_the_compact_desc:"十二方，旧敌、中立、观望者，尽请至一张长桌前。幕僚谏曰：「与败者同席，是自贬。」凝光曰：「只由赢家签字之约，撑不过下一次翻脸。」遂列席，各予一纸。至夜分，签者九，掷笔者三。凝光不追，只命人收其空位之杯。长桌设于玉京台正厅，十二席，空设三席，杯箸不撤。"

 LYY_Event.3001.t:"群玉阁第七日升"
 LYY_Event.3001.d:"帝君崩后七日，群玉阁复起。绞盘三十六具，纤夫四百人，自卯至午，阁离地三丈，悬于港口之上，影覆半城。\n凝光立于回廊，俯视城郭。市中白衣未除，纸钱犹在檐下。有司请定名号，或请称王，或请称监国。凝光皆不许，命取木牌一方，书六字，钉于阁门之上：璃月临时政府。有司曰：「既不称王，亦不称臣，此为何物。」凝光曰：「此为一纸之约，约满则换。」\n账房先生侍侧，捧簿而问：「此后税入，归于何处。」凝光曰：「归于璃月。」先生曰：「昔者十分之一入神库，余者入七星之府。」凝光曰：「自今，十分之十入国库，另一本账，与民共观。」先生笔顿。凝光指阁下城中灯火，曰：「向者吾辈向神交账，今当学向自己交账。」先生书毕，墨未干，纸上为一风所掀，凝光以指按之，指上留墨一点，久未拭。绞盘三十六具，纤夫四百，绳皆南十字旧缆，断则再接。"
 LYY_Event.3001.a:"以临时政府，重理天下"
 LYY_Event.3001.b:"以天权之名，独断一时"
 LYY_Event.3002.t:"封港一日舟横陈"
 LYY_Event.3002.d:"封港之令，夜半下，天明行。诸船不得出入，已在港者不得卸货。至辰时，商船三十七艘结阵横陈内港，桅樯相望，帆皆不落。\n有船主聚于灯塔之下，詈声不绝，谓凝光欲断众人活路。凝光自阁上下来，立于塔影中，闻言不怒，但曰：「活路向来都在，只是自今日起，须按璃月规矩行。」\n众稍静。有老船主问曰：「何谓规矩。」凝光曰：「一船一令，令上书名，货与令符，违者不入。」老船主曰：「如此，则吾辈性命尽在令上。」凝光曰：「然。」老船主曰：「令在谁手。」凝光曰：「在发令者手，亦在领令者手，两存其一，方能开船。」第一令出，老船主领之，视其令，忽觉所欠者不止一纸之费，尚有一人之情。归舟语其子曰：「人情之息，重于钱息。其子曰：那便不领。」老船主曰：「不领，船便烂在港里，人便烂在船上。其子视其父手，掌上尽是老茧，乃不复言。」璃月港内港在港口西，水浅，船多则拥，樯相触，声如伐木。"
 LYY_Event.3002.a:"封港只为立规，照章放行"
 LYY_Event.3002.b:"封港到底，非亲信不得通行"
 LYY_Event.3003.t:"长桌三排百工印"
 LYY_Event.3003.d:"百工之会，设于群玉阁下层。长桌一张，广四尺，长三丈，上列印章，凡一百二十七枚，分三排：上排矿作、铁作、织作；中排船行、盐行、茶行；下排杂作三十六。\n凝光自案首行至案末，遍视诸印，不按印，不问其忠于何人，惟问三事：一岁出货几何，纳税几何，役几人。掌事者一一对，有讹者，旁人为之正。有掌事对不上数，汗出，凝光不斥，只令其归而算清，明日再对。\n一老掌事，须白而手粗，起曰：「敢问，吾辈为谁做工。」满堂寂然。凝光不答，行至案前，以手指三排之印，曰：「为汝辈自身。」自今日起，无人能代汝辈作主，除非汝辈自点头。老掌事视其指，视良久，乃坐，眼中有水光，以一掌覆之。是日会散，诸印各归其主，无一枚留于阁上。诸掌事出阁，于阶下互视，有一人笑，笑声短，如不敢放。印材各异，有铜有木有石，木者多裂，以铁丝箍之。"
 LYY_Event.3003.a:"与百工共议，同定税则"
 LYY_Event.3003.b:"压令各家，从速缴纳"
 LYY_Event.3004.t:"议事堂初鸣一钟"
 LYY_Event.3004.d:"临时议事厅设在旧商会堂，桌椅新制，漆未干透，坐久则衣上留印。午正鸣钟一声，凡四十一人入座，各区、各行、各港，衣色不一。\n坐次无定，有争上座者，有背向而坐者，有立而不坐者。发言亦无次，一人未毕，一人已起。钟再鸣，不能止。有一港之代表与一矿之代表争至拍案，案上茶盏倾，纸湿。\n凝光坐于东隅，自始至终未出一言，只命书记逐人记之，谁言，言何，几时。散会，书记手腕已僵，得纸十九页。\n有幕僚问曰：「公何以不主之。」凝光曰：「我一开口，众人所见者，吾之脸色也。」幕僚曰：「然则今日所议，何以定。」凝光曰：「今日不定，明日再议。」钟者，非为定议而鸣。幕僚曰：「若议而不决，何以为政。」凝光指窗外曰：「汝看那市，日日争价，何曾有一日定。」旧商会堂在玉京台西街，堂中悬钟一具，梁上积尘，鸣时尘落如雪。"
 LYY_Event.3004.a:"各区各行，各占一席"
 LYY_Event.3004.b:"只邀亲信掌事入厅"
 LYY_Event.3005.t:"税关换钥系红绳"
 LYY_Event.3005.d:"税关易主之日，新钥一串悬于门侧，铜色尚新，相击有声，细而清。旧吏多留任，案上旧砚未动，惟每本税簿皆系红绳一条，结在书脊，垂于案外，风过则动。\n老税吏周姓，执簿三十年，以指腹摩其绳，问曰：「此绳何意，是将吾辈尽作贼看耶。」凝光曰：「非也，此绳为记。」自今一簿一人署，一绳一姓名，谁记谁署，谁署谁当。他日账有误，绳在，名亦在，不必再替上头者顶罪。\n周吏怔立良久，袖中手微颤，退归本位，取笔蘸墨，一笔一画书下第一行，字比往日端正。旁有少年吏低声问其故，周吏不答，只把红绳拉直，压在纸角。是日税关不闭，门外候者自辰至午，无一人喧哗。至暮收簿入柜，周吏回身向台上深深一揖，未发一言。有吏抱簿出，遇旧识于门，旧识问：「改朝乎。」吏曰：「只改其绳。」璃月港税关楼临内港，潮至则石阶没二级，吏皆候潮而办公。"
 LYY_Event.3005.a:"换钥留吏，账目公开"
 LYY_Event.3005.b:"尽罢旧吏，另用新人"
 LYY_Event.3006.t:"金册新铸存旧欠"
 LYY_Event.3006.d:"金册重铸在夜，群玉阁上下通明，炉火映窗，翻纸之声如蚕食叶。凝光亲执笔，书天权二字于首页，墨未干，以指按之，使入纸纹。阁外守者换班两回，无人入催。\n有司请焚旧册，曰：「旧账积弊，留之徒乱人目。」凝光不答，取旧册就灯，自末页始，逐字抄入新册。抄至夜半，腕僵，搁笔少憩，憩已复抄。抄毕，语众曰：「焚旧账者，他日必亦焚新账。敢把所欠之账传于后人者，方可言信用二字。」\n座中一人不服，问曰：「旧债非我辈所欠，何必自缚。」凝光指新册首页曰：「此页为我所书，故我认之；后之来者，亦当如此页。」言毕封册加印，烛花爆响一声，满堂皆默。\n有老吏退至廊下，对月而立，久而不去，袖中露出半截旧簿，纸角已磨圆。翌晨，那半截旧簿已置于新册之侧，绳解，纸平，页角相对。册页用玉京台所存旧纸，纸厚而韧，墨不洇。"
 LYY_Event.3006.a:"新册承接旧账，一页不落"
 LYY_Event.3006.b:"焚毁旧册，另起新元"
 LYY_Event.3007.t:"三行首共署一判"
 LYY_Event.3007.d:"契约法复立，首案为两家船行争一处码头。一执旧券，一执新图，讼于庭，各引证人数十，阶下听者塞途，至有登墙而观者。庭中设三席，判者坐西，讼者坐东，中置一炉，炭火不旺，烟斜出。\n凝光不亲裁，取判词一纸，付三位素不相识之行首共署，曰：「此三人，一贩盐，一贩布，一贩瓷器，皆未尝入官。」众哗，以为儿戏。凝光曰：「正为此故。」\n一老行首署毕，手心尽汗，捧纸至案前，曰：「大人，小人一生只识秤星，未曾判过一案。」凝光曰：「正因你未曾判过，此一判才值钱。若判者惯判，则不须问是非，只须问旧例。」老行首退下，行至阶半，又回身一揖。三日后判词张于码头，两家皆服，无人上诉，惟有一家焚其旧券于阶前，火小，烟直上。有书吏抄其副本，抄至判者三人之名，问曰：「此三人何官。」答曰：「无官。」书吏乃照抄，不加衔。所争者在璃月港内港西，石阶七级，潮退则露，潮满则没。"
 LYY_Event.3007.a:"判词交行首共署"
 LYY_Event.3007.b:"亲裁立威，速结此案"
 LYY_Event.3008.t:"开箱兑金至天明"
 LYY_Event.3008.d:"挤兑之夜，码头边火把如林，人持纸钞，呼兑真金，声震屋瓦。铺门半闭，伙计以肩抵之，门缝中递出票子，又递回。有老妇抱陶罐立于阶下，罐中贮钞，以布塞口，抱之如抱婴。\n凝光不遣兵，只命当众开箱。箱盖启，金锭映火，光如水。兑者一人一锭，唱名而付，自戌至寅，队列不散，亦不乱。有抱子之妇，有扶杖之翁，皆依次而前，无一争先。箱旁置一案，案上列簿三册，每付一锭，即于簿上画一押，画至天明，簿已尽。\n天将明，队首忽有人把金锭放回案上，曰：「吾家只此一锭，原不为换金，只为一试。」言毕退出。余人相顾，渐次散去。有女子行至街口，回首看那空箱一眼，箱底尚压数锭未兑之金，而无人再上前。日出处，伙计蹲在箱旁，以手抚箱底木纹，抚至再。有人以指叩箱帮，闻其声，乃笑曰：「果空。」钱庄开箱于南码头，箱为铁力木所制，四角包铜，锁已坏，以绳缚之。"
 LYY_Event.3008.a:"当众开箱，如数兑付"
 LYY_Event.3008.b:"暂停兑付，先稳银根"
 LYY_Event.3009.t:"秤旗出海护航道"
 LYY_Event.3009.d:"商团护卫队出海之日，风正急，桅上旗张，绣一杆秤，星斗分明。水手聚于舷侧仰观，皆笑，曰：「此非战旗，乃店铺幌子也。」老舵工不笑，抚旗上秤星曰：「秤者，量人也，亦量己。」\n凝光在码头送行，不为誓，不设酒，只语数句：「海上不讲道理，只讲谁家货能平安回港。」商会若连自家商船都不敢护，则不必言自由通商。言未毕，船上炮口齐齐转向外海，水手笑声顿止。有少年水手复问：「若遇大盗，秤亦能退之乎。」凝光曰：「不能。」秤只教人知轻重，退盗者，炮也。\n船去三日，归时少一桅，多两船外货。领队登岸，捧一册交于账房，曰：「秤旗所至，无人问吾辈为哪一家。」凝光收册，未阅，先问：「人齐否。」答曰：「齐。」凝光命开船之前先祭亡者，酒三巡，无辞。既毕，乃阅册，阅至末页，取笔添一行：「亡者一名，葬于归途，其家加倍给恤。」航道自港口出，绕孤云阁南，水色由碧而黑。"
 LYY_Event.3009.a:"重建护卫，护航出海"
 LYY_Event.3009.b:"船只出海，自负吉凶"
 LYY_Event.3010.t:"码头三通开市锣"
 LYY_Event.3010.d:"市集重开于清晨，码头铜锣连敲三下，声过水面，惊起白鹭一片。凝光废去层层关卡之税，只留一道明面货税，榜于栅门。旧有税吏九人，只留其二，余七人改掌秤。秤置门侧，货过则称，称毕即放。\n第一个挑夫挑担出栅，无人拦阻。行数步，忽停，回顾门吏。门吏不视，只低头抄册。挑夫再行数步，又停，乃撒腿狂奔。非逃，去报信也。一路喊，喊至街尾，声已嘶。\n半个时辰，整条街吆喝声都活转：卖鱼者泼水，卖布者支棚，卖粥者揭锅，白气腾起，遮了半条巷。有老妇倚门而笑，曰：「这般热闹，犹是十年前光景。」至暮收市，地上皆菜叶与鱼鳞。扫者骂了一声，又笑起来。有孩童拾鱼鳞贴于额上，当作银片。有少年问其父：今日何以如此。父曰：「今日无人拦，故人人敢走。」璃月港码头上栅门悬锣一面，门旧，铜环已磨薄，声仍清。"
 LYY_Event.3010.a:"尽废关卡，只留货税"
 LYY_Event.3010.b:"缓开市，先固税源"
 LYY_Event.3011.t:"清册及门记锅米"
 LYY_Event.3011.d:"八区清册，挨户而登。吏员持册敲门，问丁口，问田亩，问畜产，连灶边打盹之猫亦记一笔，注曰猫一，色黄。册分八色，一区一色，吏员各佩一牌，牌上书名，入巷则先自报。\n有妇人拦门，不肯放吏入，曰：「我家穷，怕记穷。」吏员不争，蹲于门槛之外，一边问，一边书，记其家几口锅、几石米、几个孩子、几双鞋。又记屋漏几处，问：「漏在何处。」妇人指西墙。\n妇人问：「记此何为。」吏员举册示之，曰：「总得有人知，你家有多难。不然上面看下来，只见一片太平。」妇人默然，侧身让开半扇门。吏员仍不入，只在门外凳上坐定，抄完一页方起身。行至巷口，背后有人塞来一碗凉水，他仰头饮尽，把碗放在石阶上，遂去。是夜吏员归，灯下誊清册，誊至第十户，忽停笔，曰：「此户只一老妪。」八区清册存于玉京台档房，同式纸，纸角印坊名，便于归架。"
 LYY_Event.3011.a:"逐户登记，务求详尽"
 LYY_Event.3011.b:"只登商籍，不问民户"
 LYY_Event.3012.t:"当票十年重与议"
 LYY_Event.3012.d:"当铺门前排两列长队，左为债主，右为债户，各执契票，彼此不视。凝光立新规于阶上：利过本金三倍者，一律重议；押物已没而债未清者，退物。\n语出，半个港口哗然。债主曰：「此例一开，此后谁敢放贷。」债户曰：「此例一开，此后谁肯还钱。」两列皆哄，几至相殴，为巡丁所隔。\n一老妇攥当票挤至前头，票角已烂，以线缝之，问曰：「我这十年利滚利之账，真能不认。」凝光取其票，看良久，曰：「不认汝账，是替汝算一算，何者才叫真还不起。」老妇不解。凝光乃以指蘸水，于案上画三圈，曰：「此为母，此为子，此为孙。」孙不当偿母，此非恩，是理。老妇看着水痕干去，忽然跪下。扶起时，票仍在手，攥得更紧。\n是日重议之契，凡一百三十七纸，退物者十九家。日暮关铺，掌柜以手抚其招牌，抚了很久。当铺在玉京台下西街，门面窄，柜台高与人肩齐。"
 LYY_Event.3012.a:"利过三倍者，一律重议"
 LYY_Event.3012.b:"典债照旧，契约如山"
 LYY_Event.3013.t:"北商夜问别样货"
 LYY_Event.3013.d:"至冬商队自陆路入境，驮毛皮、矿石、烈酒，驼铃自山口响至城门。领队披重裘，虽在秋日，汗自额下。\n凝光遣账房连夜核其货，铜秤称三遍：皮毛分等，矿石验色，酒则启封尝之，尝者三人，各记其味，记毕互易其盏再尝。酒过三盏，账房面色微红，笔下数字始有误，凝光命其退，自核至天明。\n事毕，领队将行，忽近前，低声曰：「要不要再进一批别货。」凝光手中茶盏重重一顿，盏底磕案，声脆，曰：「璃月之码头，只卸货物，不卸他国之规矩。」领队面色不变，笑而退，行至门槛又回身一揖，曰：「夫人性急。」凝光曰：「非性急，是记性好。」\n领队退去，背影在灯下拖得很长，出门即被夜风卷没，门外骆驼低鸣一声，似应之。次日商队出关，货单与原报一字不差，关吏验之，无所获，乃放行，心中反觉不安。商队自明冠峡入境，峡中风窄，驼铃一响，声不出峡。"
 LYY_Event.3013.a:"接其商货，拒其规矩"
 LYY_Event.3013.b:"断绝北国，闭门自守"
 LYY_Event.3014.t:"特许一纸与新匠"
 LYY_Event.3014.d:"特许状一纸难求，商会门槛数日之间被踩得发亮，木纹皆平。求者列于廊下，有携礼者，有托情者，有跪而不起者。\n凝光定价不依人，只依年岁：最古之业取其厚，最新之匠取其薄。染坊、铁坊、船坊之老号，输金多而得状迟；新起匠作，输金少而得状速。众议纷然，以为不公。凝光曰：「厚者已厚，薄者未薄。」有老号掌事愤而掷状于地，曰：「五十年字号，不如一少年。」凝光拾其状，还之，曰：「字号不失，只是不再独占。」\n一少年匠人捧状而出，手抖，状纸沙沙作响，复入问曰：「我这般人，也拿得此。」凝光正在批卷，头不抬，曰：「正因你这般人一向拿不到，我才给你。」少年立良久，忽以袖拭面，退至阶下，将状纸折了三折，贴在胸口，走了。廊下诸人相顾，一时无人言语，惟闻其脚步远去。商会廊在玉京台西街，廊下铺石，石面为跪者磨出浅凹，凹处积尘。"
 LYY_Event.3014.a:"向新匠开放特许"
 LYY_Event.3014.b:"特许惟授老行"
 LYY_Event.3015.t:"横批空悬无人敢填"
 LYY_Event.3015.d:"议事厅正中悬一联，上联取利于民，下联还法于民，横批空悬，纸白如雪，四角以铜钉按之。\n满堂争之，自辰至午，声渐高。一人曰当书共和，一人曰当书契约，一人曰当书天权。争至面红，有拍案者，有拂袖者，有闭目不语者。案上茶换四回，最后一回无人饮。凝光坐于侧，始终不置一词，只以指摩案上木纹，摩出一道浅痕。堂下诸人衣冠齐整，而无一冠不带汗。\n有人不耐，起而问曰：「大人心中究欲书何字。」凝光乃起，行至联下，仰视良久，曰：「这道横批，从来不该由我一个人来写。」言毕取笔，置于案上，退归本位。堂中忽静，静得能闻檐外水声。有老者欲言，喉动而止。那笔搁三日，墨干成壳，仍无人下笔。第四日，有人在横批上写了两个字，字很小，所写乃众人。此二字无人署名，亦无人问其为谁所书。议事厅横批用纸为旧年剩者，边上略有黄斑，铜钉四枚，皆新。"
 LYY_Event.3015.a:"以择付之议事厅"
 LYY_Event.3015.b:"自己拍板，写下横批"
 LYY_Event.3016.t:"宪章首条同守法"
 LYY_Event.3016.d:"自由宪章属草，最难落笔者，非权，非利，乃义务一端。凝光删改再三，稿纸堆案盈尺，涂去之字多于存留。有吏侍侧，见其删一行，辄以指甲刮去，刮至纸破。末乃于第一条书曰：「凡在本港经营者，无论贵贱，皆同守一法。」\n稿出，众议鼎沸。有老士绅读至此句，掷茶盏于地，瓷碎四溅，拂衣而去，至门犹回顾曰：「我等世代经商，何曾与人同列。」凝光不送，只命人扫去碎瓷，扫者手抖，一片一片拾。\n亦有默然者。散后，一中年商人潜返，借灯抄一副本，抄至半夜，指上沾墨，吹之使干。此后每逢争论，此纸辄被人取出，摊于案上，曰：「宪章第一条如何说。」争者往往语塞。数年之后，此书边角尽卷，而第一条字迹最淡，盖为人之指所摩也。有少年问：「此纸何以值钱。」答曰：「值钱者，非纸，是众目。」玉京台稿纸堆案，最上一层压以石珀镇纸，色如凝蜜。"
 LYY_Event.3016.a:"颁行自由宪章"
 LYY_Event.3016.b:"缓议宪章，先安士绅"
 LYY_Event.3017.t:"法司撤狮临街开"
 LYY_Event.3017.d:"法司自旧衙迁出，入临街一小楼。楼上下共七间，窗临市声，卖鱼者呼，孩童逐，皆入耳。凝光亲下令：门前石狮撤去，阶上刻四字，曰民可问官。旧衙门前石阶三级，新楼只一级，低与街平。\n匠人凿石，凿至第三字，问曰：「此四字面街，往来皆见，恐失官体。」凝光曰：「正要人见。」狮既移去，阶前空出一片，市人往来，初不敢踏，后渐有孩童坐其上食饼，饼屑落于石缝。\n开张首日，一农人著旧鞋，鞋底开裂，立于阶下，欲进又止，三返其三。门吏不拦，只引其入，为之设座，奉一碗温水。农人坐定，手置膝上，不敢稍动，坐良久，方信此楼真为如他之人而开。出时天已暮，他在阶上立一刻，把鞋上泥在石棱刮净，才走下街去。门吏姓何，其父尝为衙役，尝语之曰：「衙门高，人自怯。今阶低，吏亦坐得下。」法司小楼临南码头鱼市，晨起腥气入窗，吏皆习之，不觉。"
 LYY_Event.3017.a:"迁法司于闹市，民可问官"
 LYY_Event.3017.b:"法司仍设衙门，维持官威"
 LYY_Event.3018.t:"八区初议听终朝"
 LYY_Event.3018.d:"八区议会首次开会，八种口音，吵作一团。或拍案，或以指画地，或立而不坐，或连呼三声而无人应。自日头升吵至日头落，所决者惟一条：下次会议仍在此处。案上置鼓一面，鼓面裂，击之无声。\n凝光坐于台下末席，一言不发，只以笔录诸人之名，记其言者几人，默者几人。至午后，纸上已密如蚁阵。一议员回首见之，语声顿低，俄而复高。\n散会，有议员挤至阶前，问曰：「大人何不主持公道。」凝光收笔，笑曰：「吾一开口，彼等所看者，吾也，非彼此也。」这般议会，不开也罢。其人愕然，复问曰：「然则今日所争，皆无用耶。」凝光曰：「无用之争，胜于无争。」言毕先行，众人让路。街灯初上，八人自门内出，各自散去，无人同行，亦无人回顾。是夜议会记录成册，厚十七页，无一决议。八区之人散处天衡南北，近海者语快，山间者语缓，缓者常为快者所掩。"
 LYY_Event.3018.a:"令八区两造对决"
 LYY_Event.3018.b:"号令归一，息其纷争"
 LYY_Event.3019.t:"自由港灯塔彻夜明"
 LYY_Event.3019.d:"自由港法案通过之夜，灯塔彻夜不熄，光柱扫过海面，来船远远即见。自此无论挂谁之旗，但能守港规，皆可入港卸货、补给、换钱。塔中以鲸油燃灯，守塔者三人，轮值一夜，添油四次。\n港中议论如潮。有老者当街骂曰：「此是把璃月卖了。」有少年应之曰：「卖与不卖，先看米价。」两人几乎相殴，为巡丁所解。巡丁不执人，只取其火把，掷于水中，火灭，二人亦散。骂者语塞，拂袖而去，行数步，回头问曰：「米价真能降么。」少年曰：「不知。」骂者曰：「不知，汝喊甚么。」少年曰：「我先喊，汝后看。」\n凝光于法案末尾添小字一行，曰：「一扇关上之门，最后锁在里头者，往往是屋中人。此语初无人省，后有商号拓之，悬于堂中，渐渐传遍诸埠。」有船主过港，指此字问译者。译者解毕，船主默然，取酒一杯，向灯塔一举，饮尽，转舵入港。灯塔在璃月港东嘴，石砌，高七丈，灯用鲸脂，一夜耗二斤。"
 LYY_Event.3019.a:"自由港全面开放"
 LYY_Event.3019.b:"只开放部分口岸"
 LYY_Event.3020.t:"牌匾上书传统字"
 LYY_Event.3020.d:"废垄断令下，几十年垒起之行会壁垒，一日之间倒塌。老掌事数十人，举牌立于商会门前，牌上大书传统二字，墨浓欲滴。\n凝光自窗前望之，不怒，亦不遣人驱。她看那两字，忽忆少年时事：有新匠挟一技至港，欲入行，为行首所阻，曰：「此非传统。」其人守门三日，雨中不去，末乃折其工具，卖于市，改贩鱼。其人临去，以破工具一柄赠守门者，曰：「此物留汝，日后有人问传统，汝给他看。」\n窗前有人问：「要不要唤人。」凝光曰：「由彼等举。」举牌者亦是人之子、人之父。言毕转身，就案批卷，笔不停。\n至暮，门外声渐低，有举牌者手酸，换手再举；有老掌事坐于阶上，牌倚在肩，竟睡去。夜里起风，牌倒两块，无人扶，晨起沾露，墨迹流下如泪。次日门前只余两枚脚印，深寸许，盖立久所致。传统之牌立于璃月港商会门前，杉木所制，墨浓而不匀，写者年七十，手已不稳。"
 LYY_Event.3020.a:"断废行会专营"
 LYY_Event.3020.b:"暂留垄断，安抚旧商"
 LYY_Event.3021.t:"茶税一议遭众驳"
 LYY_Event.3021.d:"税须经民同议，五字入法，比任何战旗都更令旧贵心惊。初行之日，第一个撞上者，乃提议加征茶税之老议员。台下听者二百余，茶商四十，皆袖手。\n其人登台，陈说茶利。言至半，阶下有人起而问曰：「加税之后，茶价几何。」议员不能答。又问：「茶价既高，种茶者所得几何。」仍不能答。再问：「此税入于何库，用于何事，何人稽查。」议员额上见汗，取帕拭之，帕湿。\n众论纷然，驳至体无完肤，议案遂废。散会后，其人独追至阶前，向凝光深深一揖，曰：「大人，我今日方知，这会开得不像演戏。」凝光回礼，曰：「往日像演戏么。」其人张了张口，终不言，再揖而去。阶上风起，吹动他袍角，也吹动廊下未收之议程纸。是夜有人见其独坐阶上，取议案稿逐一细读，读至废字处，以指抹之。茶自翘英庄来，岁出有限，加税则价腾，市人先觉。"
 LYY_Event.3021.a:"税须经民同议"
 LYY_Event.3021.b:"加税之权，尽归政府"
 LYY_Event.3022.t:"律学开馆延讼师"
 LYY_Event.3022.d:"律学馆开在旧日讼师宅旁，一墙之隔，两扇门，一新一旧。凝光请退职判官讲律条，请账房先生讲算，又请数名名声不佳之讼棍讲辩。\n人皆哗然。有士人上书，曰：「讼棍登堂，乃教民以争。」凝光批其书末，曰：「民不知律，则律在官手；民既知律，则律在民手。此书传于外，争者稍息。」\n开馆首日，听者三十余人，有贩夫，有匠人，有妇人抱子而来。讼棍登台，先不讲律，只讲一事：某年某户，因一字之差，输半亩田。堂下寂然。讲毕，一少年举手问：「若官断不公，当如何。」讼棍曰：「问得好，此为下一课。」众人皆笑，笑声出窗，越过一墙，落入隔壁旧宅。老讼师在院中听见，抬头视天，又低下头去。散馆时，讼棍收拾讲稿，见老讼师立于墙下，隔墙相望，二人皆不言语，一揖而别。律学馆在璃月港旧讼师宅西，两门之间一墙，墙头探出石榴一枝。"
 LYY_Event.3022.a:"广设律学，教民知法"
 LYY_Event.3022.b:"律不外传，君权自持"
 LYY_Event.3023.t:"公民册与族谱别"
 LYY_Event.3023.d:"公民之册发下之日，人各一册，薄如指厚，封面无纹，只印编号。领册者列于庭，签押而后取，取者皆以双手。册以厚纸为之，不施金饰，印处用朱，朱色偏暗。\n一老掌事执册在手，反复翻看，自第一页翻至末页，又自末页翻回，如在验其真伪。此人行商五十年，族谱上有名，商号上有名，官府簿上有名，然此三处之名，皆系于族、系于号、系于税。今此一册，独系于其身。\n他问凝光曰：「此册能管何用。」凝光曰：「能让你在官府面前，不再只是一个只会赚钱之家什。」老掌事默然，以袖拭册面，收入怀中，行至门口，又取出看了一过，方塞进去。是夜灯下，他把册子放在族谱之上，两本相压，压了一夜，晨起仍如此。其后有商号仿其式，自印家册，为巡丁所禁，曰：「此册非官印不成。」公民之册自玉京台发下，厚纸为皮，色青，编号以朱，号至万而止。"
 LYY_Event.3023.a:"授予商人公民之册"
 LYY_Event.3023.b:"商人仍居于四民之末"
 LYY_Event.3024.t:"钱庄章程定银根"
 LYY_Event.3024.d:"钱庄宪章颁行，准备金若干，放贷若干，清算几日一结，条条写死，违者闭门。章程张于各庄门侧，纸用黄，字用黑。有庄主读至违者闭门四字，以指弹纸，曰：「此四字最狠。」\n老掌柜当众抱怨，曰：「如此苛细，不近人情。」商者以信相与，何须纸上寸寸计较。凝光不辩，只曰：「信亦须有凭。」\n未几，大户挤兑，一夜之间，银票如雪片入柜。诸庄皆摇，惟依章程留足准备金者，门虽挤而不闭，兑至第三日，人心渐定。老掌柜清晨开柜，见门前无人，反觉不惯。事后有人问凝光何以笃定，凝光曰：「规矩越硬，人心才越软得下来。」软不下来者，才总思倚关系度日。其人退而记之，写在章程副本之末。老掌柜后来自抄一章，悬于柜上，客问其故，曰：「年轻时以为信在人心，老来方知人心要有个靠处。」钱庄章程张于璃月港各庄门侧，门侧旧有石础，础上刻庄名。"
 LYY_Event.3024.a:"颁钱庄之章，立备本"
 LYY_Event.3024.b:"钱庄自治，官府不问"
 LYY_Event.3025.t:"满纸指印共守一约"
 LYY_Event.3025.d:"港口公约签于码头之上，不设案，不设香，只以长桌一张置于风中，桌角压以石。所约四事：遇险互救，泊位公平，货税统一，争端共裁。\n诸家依次按印。印泥用尽三盒，纸上指印密如鱼鳞，大小不一，有粗指，有细指，有带墨污者。有人按毕，自袖中取布拭指，拭了又看，似悔似喜。有老妇代其夫来按，不识字，只问：「按在此处，是否便算数。」执笔者曰：「算。」老妇乃按，按得极重，纸背见痕。\n一少年船主问曰：「大人凭甚么信他人肯守。」凝光不答，指纸上末尾，曰：「汝看这些印。」赖账之人，会为所有人记住。对一个欲长久做买卖者，此即最重之罚。少年俯身看那些印，看了很久，忽指一处曰：「此印是我。」凝光曰：「那便从汝始。」\n公约张于码头三日，风雨不坏。后移入商会，装以木框，框上无名。长桌置于码头风口，桌角压石，石出天衡，重三十斤。"
 LYY_Event.3025.a:"广签港口公约"
 LYY_Event.3025.b:"只与盟好签此约"
 LYY_Event.3026.t:"巨板列账任人核"
 LYY_Event.3026.d:"公账公开之日，码头边立一巨板，高与人齐，长三丈，墨书细字，每一枚摩拉之来去，皆有条目，注明时日、经手、用途。板下设梯一具，任人上下。板旁置一木匣，内贮副本，任取。\n有较真者携算盘而至，自午后核至深夜，算珠响如急雨，核至第三遍，指节生疼，终未找出破绽，乃收算盘，悻悻而去，行数步，回顾板上，骂了一声，又回头再看了一眼，取炭于板角书四字：「已核无弊。」字迹潦草。\n凝光立于远处檐下，未近前，亦未言语。左右问：「既已无弊，何不使人宣之。」凝光曰：「不必。此板立于市，则人自核之。所惧者，从来不是有人来核，是有一天再无人愿来核。」言毕转身入内。是夜板前尚有二人，一执灯，一执笔，抄其条目，抄至天明，抄毕相视一笑，各归。后有孩童以炭在板脚画一鸭，巡丁见之，不拭。公账巨板立于南码头，整木长三丈，须八人抬，抬时街石皆震。"
 LYY_Event.3026.a:"公账全部公开"
 LYY_Event.3026.b:"惟公无关紧要之账"
 LYY_Event.3027.t:"匠作条文密如缝"
 LYY_Event.3027.d:"匠作保护之条，琐碎如缝衣：工时以刻计，学徒以年计，工价以器计，伤病有抚，老病有养，逐条缝入，密密无隙。条文写毕，凡十九页。条文之外，另附工价表一纸，按器按工，逐行开列。\n有人笑之，曰：「此等细事，何劳大人亲定。」凝光曰：「细事不成，大事皆虚。」\n条文既行，匠作坊中初有怨者，谓束缚太密。月余，一老铁匠断指，依条得抚，其家赖以不散。老铁匠愈后复工，语同伴曰：「此条，我拿一根指头换来。汝等莫嫌其琐碎。」同伴皆默。是日坊中停工半日，匠人聚看，有识字者读之，众人听，无人言语，惟闻炉中炭响。\n凝光后语人曰：「自由通商，非令强者通吃。若连最会做手艺之人，都被榨成穷光蛋，此港所余，不过一群倒买倒卖之货郎。」闻者记之，写在坊门口木牌上，字迹歪斜，盖匠人所书。匠作条文刻于木牌，悬于黑岩厂坊门，牌下置凳一，供人坐读。"
 LYY_Event.3027.a:"护匠作，定工时工价"
 LYY_Event.3027.b:"放任竞逐，优胜劣汰"
 LYY_Event.3028.t:"盟约三崩终按印"
 LYY_Event.3028.d:"诸省盟约，谈三日，崩三回。第一回争税额，第二回争界桩，第三回争一句话之次序，先后之争，几至掀桌。有代表拂袖出室，立于廊下吸烟，烟尽复入。\n至第四日，人皆倦，有伏案者，有倚壁者，茶冷无人换。一书吏取废纸一张，纸上已有揉痕，就而书之，改三处，涂两处，众人围看，一句一句过，竟成。书吏写毕，手皆墨，以袖揩之，袖亦墨。八省各让一步，无一省占尽便宜。\n凝光按印于末，印落，纸皱处不平，印文缺一角。有人请换纸重抄。凝光曰：「不必。」天衣无缝之盟，皆死人所作；活人所签，总要缺一角。所缺者，留与后来之人补。言毕卷纸付吏，曰：「此纸勿熨，皱处留着。」诸人相视，有笑者，有摇头者。散时天已昏，八人各出，门外车马相候，无人先上。车马既去，阶前留马蹄印数枚，深浅不一。诸省代表馆舍在城东天后宫侧，车马往来，馆前石板磨得发亮。"
 LYY_Event.3028.a:"与各省相让，共结盟约"
 LYY_Event.3028.b:"强令各省服从港府"
 LYY_Event.3029.t:"玉律颁时雨落台"
 LYY_Event.3029.d:"玉律颁下时，群玉阁上空忽起细雨，雨丝斜落，湿旗，湿阶，亦湿台上未及收之稿纸。执仪者欲张盖，凝光止之。台下立者千人，有议员，有匠人，有自八区来者，衣冠不齐，皆不避雨。\n凝光不宣读全文，只念开篇一句：「璃月之治，源于契约，归于契约。」念毕，收卷，退半步。有老者闭目听之，听毕以手抚胸。\n台下静良久。静到有人以为仪式已毕，欲转身，掌声忽起，如雨过屋檐，一片连成一片，久久不止。凝光立在其中，微微俯首，手按台上石栏，指节发白。雨湿其肩，色深一片，无人拂之。\n事后有近侍问：「今日何故按栏。」凝光曰：「怕站不稳。」近侍以为戏言，不敢复问。是夜雨止，台上积水，映灯如碎金。值守者欲扫，凝光止之，曰：「留一夜。」次日水干，石上留下一圈浅痕，形如水渍，久而不去。群玉阁台面铺石，石缝嵌铜，雨过则铜色转绿。"
 LYY_Event.3029.a:"颁布玉律宪法"
 LYY_Event.3029.b:"暂缓立宪，集中事权"
 LYY_Event.3030.t:"百年之约落一笔"
 LYY_Event.3030.d:"永续之约，以一年之诺，订百年之期。文中列十二款，款款皆言后事，无一款及于署名之人。纸用厚绵，封面无题，只以银线缝其脊。\n有商人笑之，曰：「商者只做眼前买卖，百年之后，谁复记此纸。」凝光不答。\n至夜，独坐灯下，取笔于契约之末添一行小字，曰：「吾今日所定之规，未必比吾活得更久；然吾愿其活得比吾身后下一个贪心者更久一些。」写完搁笔，墨未干，以纸角轻按，按三次。灯将尽，拨其芯，光复明。\n既毕，出阁登楼。海在楼下，黑而无声，远处有灯三两，皆他乡之船。凭栏立至夜半，风起，衣角翻动，侍者进曰：「夜寒。」凝光曰：「再看一刻。此一刻，至天明。」\n天明时海上有雾，塔灯未灭，光在雾中散成一团，似一盏搁浅之月。侍者立于阶下，不敢上，亦不敢去。百年之约藏于玉京台石室，封面用素绢，绢色微黄，题签处空着。"
 LYY_Event.3030.a:"签下永续之约"
 LYY_Event.3030.b:"只续前约，不敢永诺"
 LYY_Event.3031.t:"茶室一席决半港"
 LYY_Event.3031.d:"商会枢密无衙署，无印信，只在一间茶室议事。室小而雅，四壁无字，一案八椅，窗外即市声。楼下卖糖粥，粥香时上。壁上悬一联，字已旧，不可辨。\n十几个掌事围坐，茶过三巡，一句语气，一个眼神，半座港口运价便定。无人记录，无人署名，事毕即散，各自下楼，混入市人之中。\n凝光坐于主位，看这些人。彼等比官府更像官府，比议员更像议员，而身上无一丝官气，只有茶香与算盘声。她忽然明白：自己并未推翻旧秩序，只是替它换了一件更考究、更体面之外衣。茶凉，无人唤添。\n散后，一老掌事留坐，问曰：「大人今日何故少言。」凝光曰：「听诸位说。」老掌事笑曰：「我等所言，皆生意。」凝光曰：「天下事，几件不是生意。」老掌事敛笑，起身一揖，退下楼梯，脚步甚轻。楼下粥担已收，街上只余犬吠。商会枢密之室在玉京台西街二楼，梯窄而陡，掌事者皆年高，上楼须扶栏。"
 LYY_Event.3031.a:"以商会枢密总国政"
 LYY_Event.3031.b:"维持议事厅，纵其议政"
 LYY_Event.3032.t:"密账不宣日渐厚"
 LYY_Event.3032.d:"密账不宣。天权商会最要紧那几笔数目，自此只写在两三本不示人之册子里，藏于内室，钥在凝光袖中。\n初时她告自己，此乃权宜之计：事急则从权，事定则归公。然事未尝定。册子一页一页加厚，由指厚而至掌厚，由一册而三册。翻动之时，纸页相粘，须以指分开。每添一页，必在灯下看两遍，看毕即以指抹平页角。\n一夜，她取册欲核旧数，翻至中间，忽不能续。灯下看了很久，乃合册，以手按其封皮。她比谁都清楚：一本不肯示人之账，本身即是一纸供状。所难者，非人不知，是自己不肯亲手写下那一笔。灯焰低伏，照其半面。\n窗外更鼓三响。她将册推回匣中，锁上，钥匙搁于案上，未收。次日晨，钥仍在案，压在昨夜茶渍上，渍已成圈。是夜她未再开匣。窗外有巡夜者过，脚步声由远而近，又由近而远。密账之匣藏于内室，铁力木所制，锁为铜，钥藏于袖，夜则置枕下。"
 LYY_Event.3032.a:"密账不宣，事权独揽"
 LYY_Event.3032.b:"账目照旧公开"
 LYY_Event.3033.t:"双饷之兵认二主"
 LYY_Event.3033.d:"商团私兵成军，旗号各归各家，号令却同出一间茶室。兵士月领双饷，一饷出于商号，一饷出于商会，皆以封袋给之，袋上印字号。封袋以牛皮为之，口以火漆封，漆上再印字号，防其混。\n凝光检阅此军，甲胄鲜明，行列齐整，过阶之时，靴声如一。她行至队前，问一少年兵曰：「你为谁守。」兵曰：「为饷。」又问：「饷出于谁。」兵迟疑，曰：「出于两位东家。」凝光不复问。少年兵答时目不视她，只视其靴。\n是夜归，忽忆刻晴之民兵。彼时她尝笑之，谓其乌合，器械不齐，口令不一。今乃知：以钱买来之兵，比以信拢来者更听令，亦更善变。钱一停，枪口即转，转向之速，快于转身。\n思至此，她把手炉搁下，炉中炭已半灰。侍者欲添炭，她止之，曰：「不必，坐一刻自暖。」侍者退，其影在墙上一寸一寸伸长。商团私兵之饷自璃月港商会发，两袋不同色，一青一白，兵士皆分置两囊。"
 LYY_Event.3033.a:"组建商团私兵"
 LYY_Event.3033.b:"军权尽归政府"
 LYY_Event.3034.t:"关税成墙夜看海"
 LYY_Event.3034.d:"关税壁垒一道接一道立起，外货不得入港。榜文贴满栅门，字大如斗，末署天权商会之印。关吏增三倍，日夜轮值，验货以铁钩，钩破麻袋者不计。\n库房渐满，堆毛皮、堆香料、堆成捆铁条，皆有主而无买主。商人反倒拍手称快，谓此后港中之货，皆我辈之货，价可自定。有掌事在茶室中举杯曰：「此墙筑得佳。」众人应声而饮。有商人夜宴，席上皆言此墙可保十年。\n凝光不阻，亦不贺。至夜，独登楼看海。壁垒之外，海面在夜里泛着微光，静得有些刺眼。浪拍木桩，声闷而不散。她立很久，海风吹得衣角发冷，手亦冷。\n侍者取裘来，她不披，曰：「吹一吹好。」直至更漏将尽，方转身下楼。楼下灯犹亮，账房候着，捧一叠未批之文书。她接过，看两行，又放下，问：「库中毛皮，还能存几日。」账房曰：「三月。」凝光曰：「三月后再说。」关库在税关后，砖墙厚二尺，门上悬一秤，秤已不用。"
 LYY_Event.3034.a:"高筑关税壁垒"
 LYY_Event.3034.b:"维持自由关税"
 LYY_Event.3035.t:"商会自厅堂入衙"
 LYY_Event.3035.d:"商会至上之条既落，天权商会自议事之厅堂，变作发号施令之衙门。门前设鼓，廊下设吏。来者递状，候于阶下，候至日暮者常有。鼓一面悬于门左，击者三，吏乃出。\n律法要看商会脸色，官员要经商会遴选。凡新任者，先至茶室一坐，饮茶一盏，然后受印。茶凉则事不谐，此语在吏员中私传，无人敢书于纸。有老吏谓新吏曰：「此间无刑名，只有字号。」\n凝光行此路极稳，稳得无一步虚。某日清晨，对镜梳妆，簪至半途，手忽停住。镜中人眉眼锋利，唇线紧，目下微青，正张着口吩咐甚么。她看很久，竟一时认不出：此是己身，抑从前她所憎那些影子。\n侍儿在侧，问曰：「大人，簪歪了。」凝光曰：「扶正。」侍儿扶正，退下。她仍坐镜前，将簪取下，又簪上，如此三次，方起身出门。门外候者已列两行，见她出，齐齐俯首。商会门前鼓为旧物，牛皮已松，击之音闷。"
 LYY_Event.3035.a:"立商会居上之律"
 LYY_Event.3035.b:"律法居商会之上"
 LYY_Event.3036.t:"权债以忠诚作抵"
 LYY_Event.3036.d:"权债者，以忠诚为抵押之契也。谁借此钱，谁便在下一次表决时，欠凝光一票。契分三等：上者一票，中者半票，下者一声。\n契不书于纸，只书于茶室之口。借者有商号，有行会，有议员，有报馆主笔。借款之时，皆言感激，感激之词亦各不同：有称恩者，有称知己者，有只拱手不言者。表决之时，皆知其价。凝光把权作成账，做得极漂亮：有借有还，有息有期，账面清清。\n然账之最可惧者，非坏账，乃利滚利至无人能偿之日。至彼时，收账者与欠账者，皆系于此城，城沉则同沉，无人可先登岸。\n一夜核账至半，她忽停笔，问账房曰：「此册所记，是应收之数，抑已收之数。」账房曰：「皆记。」凝光曰：「那便还有一栏未记。」账房问何栏。凝光不答，合册而卧，灯未吹，燃至天明，油尽自灭。册上最后一页空白，久无人填。权债之契用三联，一存璃月港商会，一予借者，一存私箧。"
 LYY_Event.3036.a:"以权债结盟诸家"
 LYY_Event.3036.b:"拒用权债，只凭法度"
 LYY_Event.3037.t:"白银落拳不留痕"
 LYY_Event.3037.d:"白银之拳落下时，不闻其声。其声不在市井，而在账房。\n罢工之行首晨起，忽见货款冻结，往来皆断，账上只余小字一行：「待议。」闹事之商户忽接一纸，谓其字号不合新规，须停业候查。无捕役上门，无枷锁加身，人却已不能动。\n凝光从不动刀。她只令不听劝者，于账面上悄然消失：先无名，后无号，终无迹。有人问其何以不用兵，她曰：「青桐之拳，留下印子；白银之拳，只留下欠条。」而欠条，是最体面之伤。刀入鞘亦有声，银入账则无。\n言者称善，记于笔记。被冻者之家，冬夜无炭。其妻典簪，簪为婚物。典铺掌柜看了，给价甚低。她伸手接钱，指上有裂，裂中渗血，未擦。归途遇邻人问：「卖了多少。」答曰：「够烧一冬。」邻人曰：「一冬足矣。其妻归，以余钱买炭三筐。」炭劣，烟大，夜里咳至三更。账房在璃月港商会楼上，窗糊纸，日光不入，终日点灯。"
 LYY_Event.3037.a:"白银铁拳，无声镇压"
 LYY_Event.3037.b:"收拳示仁，缓其怨气"
 LYY_Event.3038.t:"红利一纸换旧席"
 LYY_Event.3038.d:"赎买七星，乃一场近乎温柔之收编。凝光以股份、红利、终身奉养，请旧日同僚体面退场。\n所议者不于公堂，而于私室。室中设一案，一壶，两盏。条款逐条读，读毕问：「可有异。」案上另置算盘一具，条款读毕，即以算珠核其数，珠声轻而密。有接者，取笔即署，署毕举盏，饮尽，曰：「此生足矣。」有拒者，推盏而起，曰：「我宁守空衙。」凝光不劝，起身送之，送至阶下，立至其车马去远，方回。\n亦有含泪按印者，指压纸上，久不提，印泥被压成一圈红晕，终乃提起，纸上留纹。无一滴血。然七星那把椅子，自此再未坐过第二人。其后此椅积尘，侍者每旬拭之，拭毕仍空。\n事后，凝光收文书入匣，以袖为之拂去一点浮灰，拂至再。侍者问：「此椅留否。」凝光曰：「留。」空着。侍者又问：「可要罩布。」凝光曰：「不罩。」空着，才看得见空。赎买之席设于玉京台内厅，旧七星各占一位，位上有名签，签已旧。"
 LYY_Event.3038.a:"赎买七星，体面易主"
 LYY_Event.3038.b:"清算七星，明正典刑"
 LYY_Event.3039.t:"矿脉盐茶归一掌"
 LYY_Event.3039.d:"玉税专营，把矿脉、铸币、盐、茶，一并攥入一只手。凡出山之物，必经官栈；凡入口之盐，必贴官引。引票以朱印为凭，无引者以私论。引票分四季，色各不同，春青、夏赤、秋白、冬玄。\n凝光曰：「此为国之聚财，非为私。」反对者问曰：「财既聚矣，聚到谁那里。」堂上一时无人应声。凝光亦不应。\n她固知答案。可她已离不开这套器用：税吏、栈房、引票、押运之兵，环环相扣，一动则百动。如巨鲸之于海水，吞之则重，舍之则死，虽觉其压，亦只能一寸一寸随之沉下。\n散会后，她独自检视盐引一批，取一张就灯照之。纸上水印宛然，边角齐整。她看了很久，忽问左右曰：「此纸所值几何。」左右不敢答。凝光乃自答曰：「所值者，一城之口。」言毕，把引票放回，压上一枚铜镇。铜镇为旧物，纹已磨平。玉税官栈设于璃月港城西，栈前空地可容车三十乘。"
 LYY_Event.3039.a:"玉税专营，独揽利权"
 LYY_Event.3039.b:"开矿放权，与商共利"
 LYY_Event.3040.t:"议程如旧钟自鸣"
 LYY_Event.3040.d:"静默议会之中，议员仍按时到场，仍按序发言，仍举手，仍记录，仍鸣钟。钟声一响，众人起立，如仪。\n所异者，无一票能改其议。议案早定于会前，表决如行礼。有议员陈词至半，忽止，环视左右，似欲有所言，终乃低头，翻过一页。有议员举手表决，手举至半，见左右未举，乃缓缓放下。\n凝光保留全部形式：议程、记录、表决、鸣钟，一物不缺，一人不裁。她太懂这些物事之价：它们能令一件并不存在之事，看起来煞有介事。她亲手保住象征，也亲手掏空它。\n散会之后，钟犹自鸣了一声，余音在梁间转，许久方绝。执钟者立于钟下，不敢先走。凝光自廊下过，驻足听之，曰：「此钟声甚佳。」执钟者问：「好在何处。」凝光曰：「好在它不问。」言毕而去，钟绳犹在轻轻摇。钟绳旧而滑，执之者手心皆汗。静默议会之钟绳垂于玉京台门侧，绳端打结，结为历年所握，色黑。"
 LYY_Event.3040.a:"存议会之形，空其里"
 LYY_Event.3040.b:"复议会之实权"
 LYY_Event.3041.t:"旗绣铜钱与利刃"
 LYY_Event.3041.d:"金与钢浇于一处，铸成天权最利之二物：钱与枪。商会出钱，私兵出枪，二者合流，自此无人能舍其一而独活。\n新军成日，旗上第一次并绣铜钱与利刃，钱在左，刃在右，绣工精细，钱孔亦绣出，可透光。旗以厚缎为底，风张则两面皆见其纹。铸旗之日，匠人问：「钱与刃相压，孰在上。」绣者不答，只绣钱先。\n凝光立于旗下检阅，风急，旗张满，钱与刃一时交叠，一时分开。仰观良久，忽分不清：钱替刃做主乎，刃替钱开路乎；谁在替谁效力乎。\n检阅毕，有军官趋前请示旗制，问钱与刃孰先。凝光曰：「并绣，不分先后。」军官曰：「军中必有先后，否则号令不一。」凝光默然，移时曰：「那便以刃先。」军官应声退下，执笔记之。凝光仍立旗下，风止，旗垂，钱与刃皆贴于布上，看不出先后。旗既收，折为方，藏于木匣。天权之旗为双面绣，绣工出城西织户，线用金与铁色二种。"
 LYY_Event.3041.a:"商会出钱，私兵出枪"
 LYY_Event.3041.b:"钱枪分离，各司其职"
 LYY_Event.3042.t:"非常之时无定名"
 LYY_Event.3042.d:"必然之约凡九条，前八条皆言权责、赋税、军旅，字字有界。末一条独异，书曰：「为免秩序崩坏，天权得于非常之时，便宜行事。」九条之稿，凡三易，易者皆在末条。\n非常之时四字，无定义，亦不必定义。定义之者，恰是最愿此四字绵延不绝之人。\n属草之日，有法吏请加注，曰：「不加注，恐启后世之弊。」凝光曰：「注之则有限，有限则可越。」法吏不敢复言，退而下泪，泪落于稿，晕开一字。出遇同僚于阶，同僚问：「如何。」法吏摇首。\n签署之时，凝光执笔，笔尖在纸上顿很久，墨聚成一点，渐大，几欲坠。众皆屏息。她终乃落笔，一竖极重，透纸背，背面见痕。署毕，她以指按那一点墨。墨未干，指上皆黑。侍者奉巾，她不取，只将黑指在袖内擦了。是夜她洗三次手，指上墨仍未净。次日见客，袖口内黑。约书藏于玉京台石室，室门以石珀为闩，重不可启。"
 LYY_Event.3042.a:"签下必然之约"
 LYY_Event.3042.b:"定还政之期"
 LYY_Event.3043.t:"临时二字自此除"
 LYY_Event.3043.d:"天权永续。凝光终将临时二字，自政府之名中彻底抹去。抹去之法，不用刮削，只以新印压旧印，旧字在朱下，影影可见。\n加冕之日，群玉阁饰以素锦，不加金彩，全城张灯，灯自港口排至山腰，夜望如一条倒悬之河。市中酒肆彻夜不闭，饮者举杯向北，不知敬谁。\n她端坐最高处，脚下万家灯火，人在灯中行走，小如豆。鼓乐至喧，呼声至再，她一一受之，面色不改。至最喧之一刻，忽忆多年以前：彼刚接商会、尚信账目能量尽天下事之小姑娘，也曾坐在这样灯下，只是那时，她眼里有光。\n乐止，众拜。她起身还礼，动作合规，无一分差。礼毕坐回，手置膝上，良久不动。近侍低问：「大人乏否。」凝光曰：「不乏。」只是这灯太亮。近侍乃命人撤去近前四盏，堂中顿时暗了一角。既暗，鼓乐亦止，众乃徐徐退。旧印压于朱下，侧光斜照，犹可辨其笔画。"
 LYY_Event.3043.a:"天权永续，加冕正名"
 LYY_Event.3043.b:"改回临时，定期还政"
 LYY_Event.3044.t:"一秤黄金一秤律法"
 LYY_Event.3044.d:"终局之秤，乃天权为己所算之最后一笔账。秤置于殿中，左盘黄金，右盘律法，盘中各置一册，册厚相若。秤架以铜铸，横梁上刻一线，为其准。秤置三日，无人敢移，亦无人敢近。\n指针在两盘之间摇摆，左倾，右倾，复左倾，迟迟不肯定。司秤者以手扶之，凝光止之曰：「让它自停。」司秤者退三步，垂手而立。\n她守此秤，坐一整夜。夜半风入，灯焰侧伏，秤影在墙上随之而动。天亮时，指针略偏于右，指宽一线，细看亦未必真。\n凝光乃语左右曰：「记下。」记此天平，从来未曾真正平过。左右执笔，不知如何落墨。凝光曰：「照吾原话写。」写毕，起身，取布一幅，覆于秤上，四角掖平。出门时天光大亮，港口已有人声，她立一息，方下阶。阶上有露，足下一滑。以手扶栏，栏冷如铁。终局之秤置于玉京台殿中，架以铜铸，高五尺，正对门。"
 LYY_Event.3044.a:"直面终局之秤"
 LYY_Event.3044.b:"掩盖秤上之差"
 LYY_Event.3045.t:"两纸相隔三百年"
 LYY_Event.3045.d:"凝光自关入契约库，一夜不出。库中无火，惟窗隙透月，尘埃浮于光中，行过则乱，乱而复定。库门自外锁，锁为旧制，钥长半尺。\n她自最上格取一函，启之，乃帝君三百年前手书之第一款旧契，纸色如秋叶，字迹瘦劲。函上有封泥，泥已裂，裂处积尘。又自袖中出一纸，乃昨夜所签新契，墨犹未干透。\n两纸并置案上，中间隔三百年。她以指轻按其笔锋，如抚旧伤。掌灯细看，一字一字比过去，看到第三行，手忽停。字迹竟出奇相似：一样起笔，一样收锋，连避讳处省笔之法，亦如出一手。\n她第一次问自己：我推翻旧契之法，会不会正写下另一份新契，而它终亦成旧。窗外天光渐白，鸟声起于檐。她坐整夜，终未得答，乃将两纸叠齐，同收入一函，函上不题字。黎明时送函归原格，格上编号已模糊。库在玉京台之下，无窗，惟门隙透光，尘浮其中。"
 LYY_Event.3045.a:"承认困惑，续写新契"
 LYY_Event.3045.b:"压下疑问，只谈眼前"
 LYY_Event.3046.t:"巨渊账上皆有名"
 LYY_Event.3046.d:"层岩之账，所记者，命也。每一锹矿，每一根铁轨，背后皆立着一个有名有姓之人。账房入井，皆携灯二、绳一、册一。\n凝光遣最精明之账房入巨渊，去者五人，归者四人。归者面色皆不好看，有一人手指发抖，握不住笔。问其故，只曰：「井下暗，灯不足。」\n账册既上，厚三寸，逐页皆人名，名下注工时、伤病、所付之钱。凝光阅至中卷，忽合册，以手按其封皮，久不言语。灯下册页微卷，边角有指印，非她所留。册中所记，最幼者十四，最老者六十有三。\n乃取笔，于封皮批四字，曰：「此账宜轻。」批毕，自视良久，又觉此四字甚虚。乃召账房，问曰：「若令此账真轻，当作何事。」账房条陈七事：增灯、减时、设医、给抚、立碑、录名、许诉。凝光逐条批可。批至末条，笔停了一停，仍批可。既毕，另取一纸，写七事之期，写至立碑，搁笔。账房入井所携之灯为铜制，灯罩有孔，可挂于壁。"
 LYY_Event.3046.a:"慎待层岩之账"
 LYY_Event.3046.b:"催矿不辍，务求产出"
 LYY_Event.3047.t:"海防重建护归舟"
 LYY_Event.3047.d:"航道者，璃月之血脉也。谁掐其喉，谁即掐此城。海图旧而残，补以新纸，纸色不一。\n凝光重建海防，增哨船十二，立灯塔五，凡商路所经，皆设水寨，寨中储淡水、储炭、储药。哨船之卒，皆自渔户选，识水性者居半。哨船昼巡夜泊，遇船必问旗，问旗必录。有人问此举是否为称霸，凝光曰：「非也，为使每一艘挂璃月旗之船，皆能平安归家。」\n岸边有闲人笑之，曰：「商者不言兵，言兵则商败。」凝光正持望远镜望海，闻言不回头，曰：「能货卖天涯者，亦当有本事守家至天涯。」其人语塞。\n是日暮，哨船归，报曰：「外海有盗船三，已逐去，商船无损。」凝光放下镜，问：「商船几艘。」答曰：「十一。」又问：「人几口。」答曰：「一百三十七。」凝光曰：「记下来。」记人，不必记货。报毕，哨长退，凝光取海图铺案，以指循线，循至一处，停住。海图藏于孤云阁海防哨所，旧年所绘，纸已脆，补处用新纸，色白而异。"
 LYY_Event.3047.a:"扩编航道护卫"
 LYY_Event.3047.b:"省下军费，任船自去"
 LYY_Event.3048.t:"港不为押退密使"
 LYY_Event.3048.d:"北国密使来，比商队更勤。不谈货，只谈更深之合作，谈一份可把璃月港整个租借出去之约。使者乘车，车帘厚，至门不下。\n使者在座，言辞甚恭，出约三纸，条款详尽，租金之数亦厚。凝光读之，一遍，二遍，三遍，读至第三遍，取笔于末批八字：「生意可做，港口不作抵押。」\n使者视之，色不变，问曰：「夫人可曾想过代价。」凝光曰：「算过，比汝算得清楚。」使者曰：「夫人所算者，是钱。」凝光曰：「我还有一栏，汝无。」使者问何栏。凝光曰：「此城百姓。」言至此，使者一笑，笑不及目。使者默然，收约而起，至门回顾曰：「他日后悔，可再谈。」凝光曰：「不必。」\n使者去后，她独坐很久。烛烧至根，光小如豆，爆响一声，随灭。她不唤人，就暗中坐着，直至窗白。案上那三纸约，仍摊着，无人收。天明时侍者入，见其犹坐，约纸一角已被烛燎焦。密使所乘车帘厚，车过石街，声闷如击絮。"
 LYY_Event.3048.a:"拒租港口，虚与委蛇"
 LYY_Event.3048.b:"签下合约，换取重建"
 LYY_Event.3049.t:"三年契券铺满堂"
 LYY_Event.3049.d:"账与剑，终须在同一张桌前相见。\n凝光命人取三年来所有契约、公债、地契、税单、抚恤名册，尽铺于议事厅地上。铺毕，自门至座，无一步可下足，来者皆须绕行，靴底不敢着纸。有吏捧册而行，足下无隙，乃脱靴，跣足而入。\n满堂默然。有武将俯身拾其一纸，看之，不识其数，放回原处，退半步。有文吏蹲下，以指循行，读到某处，忽以手掩口。\n凝光立于纸中，曰：「战争之每一发炮弹，皆写在这本账里。」欲战，先算以何物偿之。赔不起，则莫开第一炮。\n无人鼓掌。散会时，众人鱼贯而出，脚步皆比往常为沉，踏在纸上，纸无声。有一老将行至门，忽回身，向那满地纸一揖。凝光在座中看见，未起，只略一点首。侍者收拾至夜半，纸按类归函，函上标年。是夜厅中烛尽三枝。三年契券铺于玉京台议事厅地，纸按年分堆，最旧一堆色深，边角为鼠所啮。"
 LYY_Event.3049.a:"倾全港之力，一战而定"
 LYY_Event.3049.b:"权衡账簿，暂避锋芒"
 LYY_Event.3050.t:"门楣告示亲取下"
 LYY_Event.3050.d:"内战结束之日，凝光亲取门楣上临时政府之告示。是日无风，旗垂不举，港口静得异样。\n告示贴已数年，纸脆，边角卷起，钉孔锈成两点黄斑。她不用刀，以指甲沿边剔之，剔半刻，纸始离木。取下来时，纸已裂为二，她合而卷之，交与侍者。侍者问：「焚否。」凝光曰：「收之。」\n既毕，登群玉阁顶。风大，俯瞰璃月，八区相接，烟火复连，港口帆樯如林。檐角铁马，久不鸣，今日忽响一声，众皆仰首。她手中另有一册，是记数年之旧账，封皮磨得发亮。\n她久久未开口。侍者不敢催。良久，她把账轻轻合上，对自己曰：「账清矣，人亦该往前看。」言毕，翻过一页。那一页之后，尚有一沓空纸，纸白无字，风一吹，掀起一角，又落下。她以指按那空纸，按一息，纸上有指纹。下楼时遇一老吏，老吏俯首，她也俯首，二人未交一语。告示背面有旧年门神残迹，朱色已褪，惟余一线。"
 LYY_Event.3050.a:"携此一册，向前"
 LYY_Event.3050.b:"停下脚步，清算所有"
 LYY_Event.3051.t:"回信一句附清册"
 LYY_Event.3051.d:"玉衡回信甚短，只一句：「账我可以信汝，人却不能。」信纸一角有水痕，不知为雨为泪。\n信封内另附一册，乃八省人口清册。字迹工整，行距如一，页边有批注，墨色深浅不同，显然非一日所录，乃亲手抄成。册角以麻线装订，线头尚长，未剪。册末另附一页，记逃户、绝户、流民三项。\n凝光将清册翻一遍，又翻一遍，翻至第三遍，指在某页停住。那里记着一户五口，旁注四字：「孤儿二人。」她以指摩那四字，摩了许久。又数其丁，数了两遍，皆五。\n末乃笑，语谋士曰：「汝瞧，肯骂我之人，才真把我当回事。骂都不肯骂者，乃早已打算不理我。」谋士曰：「然则玉衡所信者，仍是账。」凝光曰：「已足。」她将清册置于案头最上层，压以铜镇，镇为石，压之不移。是夜灯下，她又翻两页，方才熄灯。玉衡回信至玉京台，纸为八行，行间有水痕一道，自右上至左下。"
 LYY_Event.3051.a:"回信玉衡，坦诚相商"
 LYY_Event.3051.b:"以事论事，不予深交"
 LYY_Event.3052.t:"粮账细到一石米"
 LYY_Event.3052.d:"甘雨之粮账寄到，厚一册，细得连一石米之去路皆有批注：「某日入某仓，某日发某营，某日耗于某役，余若干。」页边小字密如蚁行。册中夹一纸，为各仓存粮之图，以朱点标之。\n文末有一行，字小于前：你算得清金钱，我算得清米粮，加在一起，才勉强算得清一个璃月。凝光盯着勉强二字，久久不语。灯花爆响一声，她亦不动。\n她忽然明白：自己引以为傲之账簿，在真正庞大而琐碎之民生面前，薄得可怜。一册账可载千金，载不得一城之饥；可记一税，记不得一户之炊。窗外有吏送新册至，立于阶下候。\n乃取笔，于册末批曰：「此后凡粮账，皆附人口一栏。」写毕，觉其不足，又添一句：「不附者，不作准。」次日命人抄此批，分送各房。有吏读之，问：「人口亦要计入账乎。」凝光曰：「人非账，账须有人。」粮账自月海亭来，册中所记仓名多已改易，惟旧名仍注于旁。"
 LYY_Event.3052.a:"回信月海亭，共理粮政"
 LYY_Event.3052.b:"拒其插手，独掌财粮"
 LYY_Event.3053.t:"绝云间寄不化雪"
 LYY_Event.3053.d:"绝云间回信来得迟，也冷。使者上山，去时七日，归时九日。归来时眉上有霜，靴底带泥。途中遇雪，马滑，折一蹄。\n使者取一物呈上：雪一片，置于小铜匣中，雪不化，白中带蓝。匣为铜制，内衬以絮，絮已湿。附言八字：「汝等之律，量不出雪山之重。」\n凝光以指触之，寒自指尖入，直上腕。她将那片雪搁于案头，看它整夜不化。灯下看，如在看一枚无字之印。\n她想起自己一生皆在衡量：定价、核算、折算、抵偿。凡物皆有价，凡价皆可议。唯独这一片雪，无用处，标不出价钱，亦无人来买。她从未为它留过位置。思至此，忽觉此念甚冷，冷于指上之寒。\n天亮时，雪仍在。她将铜匣合上，置于书架最高一层，与旧契同格。此后每逢议及山民之事，她偶会抬头看一眼那格子。久之，铜匣生绿，绿斑点点。铜匣置于案侧格中，格小匣大，故斜放。"
 LYY_Event.3053.a:"尊重绝云间，另设一尺"
 LYY_Event.3053.b:"以律法强令仙家归附"
 LYY_Event.3054.t:"甲板一席论秩序"
 LYY_Event.3054.d:"达达利亚于甲板设酒一桌，菜不多，酒甚烈，风将桌布吹得翻起一角，以铜镇压之。桌旁无侍者，只二人，一坐一立。海上无月，惟星，星低如可摘。\n彼执杯，谈秩序，曰：「这世界从来不公平。」汝等革命，欲其公平，抑或欲换一批人来收账。彼以刀切肉，刀钝，切之有声。\n凝光举杯，未答。杯至唇边，停了一息，仍饮尽。达达利亚笑曰：「夫人不答，便算答了。」凝光曰：「你问得太好，我不便答坏。」达达利亚大笑，笑声落水，惊起飞鸟一群。\n回港舟中，谋士问其人如何。凝光曰：「那敌人，比谁都像商人。」谋士曰：「像商人者，可与之谈利。」凝光曰：「不然。此等人最难缠，因他与你所算，同一本账。」谋士默然。江面起雾，船灯照不出三丈。谋士问：「然则如何处之。」凝光曰：「与他算同一本账，但比他先合上。」甲板之席设于璃月港船楼外，桌布为北地所织，厚而粗，须以铜镇压。"
 LYY_Event.3054.a:"以商人之道应公子"
 LYY_Event.3054.b:"以刀兵之法拒至冬"
 LYY_Event.3055.t:"藤秤无星寄沉玉"
 LYY_Event.3055.d:"沉玉谷之复最迟，亦最怪：藤编旧秤一杆，无星无刻，秤杆细而弯，提绳已磨断，另以麻线续之。使者以布裹之，布已磨破，秤杆露其一端。附言曰：「汝等之契，量不出水土之重。」\n凝光将秤端详很久。她以指循杆，自头至尾，找不到一处刻痕。秤盘为藤编，久用而滑，色如旧铜。她试着提之，秤盘空而微晃，无物可称，亦无可读之数。\n忽而明白蓝砚之意：只讲契约与货值之国，也许会以公平掩盖另一种偏心。凡可称者，皆已称过；凡不可称者，皆略去不书；而略去者，往往即最重之物。\n她将那杆秤搁于案头，与账册并列。此后凡遇难决之事，她偶会看它一眼。有一回报馆主笔来问政，见之，问此何物。凝光曰：「一杆秤。」主笔曰：「何以为秤。」凝光曰：「因它不称。」主笔愕然，援笔记之，记毕自视，觉不可解。藤色由青转褐，经年而坚，谷中人用以缚犁。"
 LYY_Event.3055.a:"虚心请教沉玉谷"
 LYY_Event.3055.b:"斥其阻碍开发"
 LYY_Event.3056.t:"十二回执列一席"
 LYY_Event.3056.d:"十二份回执，十二种态度，十二个昔日断难同席之名。案上无主位，无茶，只十二纸。\n凝光命人清出长案一张，把十二纸并排铺开，自左至右，铺成一列，纸与纸之间留缝，缝宽如一指。以铜尺量之，缝各不同，最宽者二指。远看如一幅残缺之图。\n最热忱者写满三页，末页犹有添注，字挤至边；最冷淡者只盖一枚空白印，印文模糊，不可辨为何司。有折角者，有沾酒渍者，有一纸被雨打过，字迹晕开。\n凝光自左行至右，一行一看，看到末纸，停住。她忽觉自己也许当真做成甚么。所成者非盟，非约，乃众口得开。从前诸方不与之言，非无可言，乃无人许其言。\n有侍者在侧，见其久立，进曰：「可要坐。」凝光曰：「再站一刻。」她退回案首，把第一纸扶正，使与案边齐。侍者问：「可要装裱。」凝光曰：「不裱。」就这么铺着。十二回执列于玉京台长案，纸色不一，有素笺，有粗纸，一纸带油渍。"
 LYY_Event.3056.a:"邀请十二方共立新约"
 LYY_Event.3056.b:"只与盟友续订旧契"

 LYY_Spirit_Tianquan_Regency:"一印独支一国"
 LYY_Spirit_Tianquan_Regency_desc:"王座既虚，凝光不居。惟设一案于群玉阁顶层，案上一印、一册、一灯。凡下议，必先呈册；凡用印，必先对册。有请其正位者，凝光曰：「位者，人所争；册者，人所核。吾宁执册。」三年之间，阁上火不夜熄，使者上下如织。有老吏夜半登阁，见凝光犹伏案，灯花爆了一声，凝光不抬头，曰：「此一款，尚差三贯。」案角置一石珀镇纸，色如凝蜜，为归离原旧物。"
 LYY_Spirit_Golden_Ledger:"账重于盟誓"
 LYY_Spirit_Golden_Ledger_desc:"金册者，铜为皮，凡十二函，藏于库。出入皆登，登必二人：一执笔，一执算。岁终合校，差一钱者，重录全册。贵家欲以一语省一笔，主者许之，惟令书于册末，曰某年月日某以私请免若干。贵人变色而去。市人闻之，谓其邻，此国可居，然不可大声。邻问何故。答以大声者，册上亦有记。库在玉京台之下，库门三重，钥分三人。"
 LYY_Spirit_Independent_Judiciary:"法司出衙门"
 LYY_Spirit_Independent_Judiciary_desc:"法司自府署徙于市，门临大街，不设石狮，不列仪仗。晨启门，民可直入，无通禀之烦。有豪家仆与卖浆者争，仆恃主势，坐而不起。判者不问其主，惟问其证。证不足，仆输。仆怒曰：「汝一小吏，敢判吾家。」判者曰：「吾非判汝家，吾判此一争。」是日观者塞途，判毕，有老者出门，回视其匾，揖而去。衙前旧有石狮一对，移去之后，座上苔痕犹作兽形。法司门临璃月港大街，阶前无狮，民至则直入。"
 LYY_Spirit_Artisan_Compact:"匠手自定规"
 LYY_Spirit_Artisan_Compact_desc:"匠作之盟，非官所立，乃匠自相约。凡入盟者，各出其技：木、石、铁、漆。盟中设三老，皆推自众手，不由官命。凡工价，三老议之；凡争，三老断之；凡徒，师必授其全技，不得藏一手。有老匠临死，召其徒，指一柜曰：「此中皆吾秘，向不传人，今入盟，当尽出。」徒开柜，见纸数百，皆图也。匠盟设于黑岩厂西，屋三间，梁上悬锤、尺、刨各一。"
 LYY_Spirit_Everlasting_Compact:"一纸签百年"
 LYY_Spirit_Everlasting_Compact_desc:"约期百年。署者皆谓己不及见。主事者正以不及见，故署之。少年问既不及见，何利之有。答以无利。少年又问无利而署，不亦愚乎。主事者曰：「愚。然吾辈今日所食，皆前人不及见而署者也。」少年不能对。是夜少年独至案前，取其约读之，读至末页，见一列名，皆墨色已淡，乃前朝人。少年取其笔，署于其下。约置铁匣，藏群玉阁石室，启匣须三钥并发。"
 LYY_Spirit_Guild_Supreme:"商会坐衙门"
 LYY_Spirit_Guild_Supreme_desc:"商会既总百业，凡争讼，先入商会；商会不能决，乃入官。初，事速而费省，市人称便。久之，不入商会者，不得开铺；不附行规者，不得雇工。有外乡人来，欲设一小肆，商会谓之曰：「须先纳保金。」其人无金，坐于街三日，去。去之日，市人皆见，无一人问。后有孩童问其父：彼何往。父曰：「此处无其位。」商会楼在璃月港市中心，楼下即市，楼上不闻市声。"
 LYY_Spirit_Tianquan_Eternal:"权摄字已除"
 LYY_Spirit_Tianquan_Eternal_desc:"临时二字，本在黑字之末，小如蚁。一日，主事者取笔，圈而去之。堂上无人言，惟闻笔过纸声。既毕，众目皆视凝光。凝光不起，亦不言，但取印，久而后落。印落，堂下有三四人跪，有五六人拂袖去。凝光视其去者，不怒，亦不留。是夜群玉阁灯至天明，守门者见阁上人影独立，终夜未移。此二字原刻于门楣左侧，去之之后，石上留一浅凹，雨至则积水。"
 LYY_Spirit_Creditors_Fear:"四海皆吾债"
 LYY_Spirit_Creditors_Fear_desc:"债既广布，诸国岁输其息。使者至，色甚恭，言必称谢。坐未定，已请缓期。主事者不允，亦不斥，但命取册，翻至某页，指一行，谓此数去年今日亦在此页。使者面赤，不能对。及使者去，左右贺以今日又胜一国。主事者不笑，谓所持者人之急也，急者有时，吾亦有时。左右不解其意，后三年乃验。债册藏于南十字港库，架以铁力木，防潮以炭。"
 LYY_Spirit_Open_City:"灯塔彻夜明"
 LYY_Spirit_Open_City_desc:"港口之灯，自暮至旦不熄。凡船至，不问所自，不问所载，惟验一纸，即许卸货。至冬商船桅上旗色诡，巡港者请禁之。主事者不许，谓灯既明，不可择人。是夜少年问于灯塔下，既知其为谍，何不禁。守灯者言禁之则灯暗一分，灯暗一分，则天下皆知此港有不可入之处。少年仰视灯，良久，谓此灯易碎。守灯者曰：「易碎，故须彻夜有人守。」港外孤云阁诸峰如戟，灯照不及，船皆绕行。"
 LYY_Spirit_Mercantile_Spirit:"十室九贾"
 LYY_Spirit_Mercantile_Spirit_desc:"港城之民，十有七八业商。自幼闻价，长而识货，老而不肯轻诺。客问老商，与人争价斤斤计较，不亦陋乎。老商答以所争者一分，一分者，一家三日之食。客又问既已富矣，何争为。老商答以富者亦争，不争则贫。言已，取秤，指其星，曰：「此星准，则吾心准。」客视之，秤杆已磨得发亮，星痕深陷。南码头秤亭一座，秤杆以铁力木，星痕深陷，摸之可辨。"
 LYY_Spirit_Five_Envoys:"五旗试五路"
 LYY_Spirit_Five_Envoys_desc:"五使分驰，各持一书。书中所言，非求盟也，惟告以门开。其一至蒙德，与酒肆主人共饮三日，终未得见其执政，归报谓其门未闭，其心未开。凝光答以足矣。其二至稻妻，为风所阻，泊于孤岛七日，以所携之茶易米而食，归报谓彼邦方自治其乱，无意外顾。凝光亦答以足矣。及五使尽归，门闼之开闭，天下皆已知之。五舟发时，岸上无人相送，惟南十字灯塔三明三灭。"
 LYY_Spirit_Twelve_Compass:"星盘十二格"
 LYY_Spirit_Twelve_Compass_desc:"十二家既集，各占一席。席上置纸一方、印一具。主事者曰：「愿署者署，不愿者去。」有三人取印即署，有五人迟疑，视他人之色。有一人起而欲去，至门，复返。最后一人，坐至灯将尽，乃取印，按之，按毕曰：「吾非服汝，吾服此纸。」主事者曰：「可。」卷既成，十二印参差，无一正者，而纸为之重。十二印并陈于群玉阁长案，印泥同一盒，色略异。"

 LYY_Wealth_Tier_1:"财货之阶"
 LYY_Wealth_Tier_1_desc:"财货匮乏，国库见底，商路萧条。账房算盘打一夜，只剩几声空响。库中存铜钱三箱，开箱视之，索贯者半；存盐两囤，皆已结块。吏请发官俸，主事者取册视之，久乃批曰：「先发匠人，官吏后之。」"
 LYY_Wealth_Tier_2:"财货之阶"
 LYY_Wealth_Tier_2_desc:"财货温饱，收支勉强相抵，市面不冷不热。日子过得下去，却无人敢置办大件。匠人接单，先问可否分三期付；嫁娶之家，聘礼改以布帛折。老商谓此如春初之河，冰已开而未畅，舟可行而不敢满载。"
 LYY_Wealth_Tier_3:"财货之阶"
 LYY_Wealth_Tier_3_desc:"财货殷实，商路畅通，库有余粮。天权之账，头一回见像样盈余。主事者不喜，反命取历年亏空之册并置案上，令诸司各陈其所欠。有司问既已盈余，何复追旧欠。主事者答曰：「盈者一时，欠者尚在。」"
 LYY_Wealth_Tier_4:"财货之阶"
 LYY_Wealth_Tier_4_desc:"财货豪富，金玉满仓，港口彻夜通明。财富如潮涌来，亦暗冲律法之堤。私铸之钱渐见于市，成色稍逊而人不觉；越关之货改由小路，税吏明知而不追。老吏上书，主事者阅毕，命先查私铸，余者暂置。"
 LYY_Wealth_Tier_5:"财货之阶"
 LYY_Wealth_Tier_5_desc:"财货敌国，债主之惧令四方低头。然金山愈高，山下之人愈觉，自己不曾分得一分光。港中脚夫一日之资，三十年未变；而栈桥租金，三十年涨十七倍。老脚夫问账房，此港既富，何吾辈仍旧。账房不能答。"
 LYY_Law_Tier_1:"律令之阶"
 LYY_Law_Tier_1_desc:"律令废弛，旧契已毁，新法未立。事事凭人情决断，人一走，约定亦散。码头上两船相撞，各执一词，闹至天黑，无一人提及往何处告状。老吏立在一旁，看罢只摇首，曰：「无律之城，其争亦无终。」"
 LYY_Law_Tier_2:"律令之阶"
 LYY_Law_Tier_2_desc:"律令初成，官府始按章程办事。然执行之际，仍要看谁面子大些。同一案，甲递则三日批，乙递则三月无音。讼者改托他人代呈，果速。判者私下语人，谓非不知其弊，乃尚无人愿先开此例。"
 LYY_Law_Tier_3:"律令之阶"
 LYY_Law_Tier_3_desc:"律令成文，白纸黑字，庄重而迟。护弱者之权，亦拖慢一切欲走捷径之脚。凡立一契，须三证；凡过一关，须三验。商人怨其缓，而讼者谢其缓。老吏谓此如秤：秤愈准，愈重，提之者手愈酸。"
 LYY_Law_Tier_4:"律令之阶"
 LYY_Law_Tier_4_desc:"律令森严，法如山石，不偏不倚。作奸者无所遁形，敢绕行者亦渐无路。市井之中，昔日赖以通融之人情，今无所用；旧日专办此事之牙人，改行卖米。富家子触法，其父携重金至，门者不纳，只递出一纸，上书所犯之条。"
 LYY_Law_Tier_5:"律令之阶"
 LYY_Law_Tier_5_desc:"律令如磐，铁律之下，人人平等，无一丝余地。守住了公义，亦可能锁住此城伸向明日之手。新法初行，有善政因无旧例可循而不得行；有良工因一纸旧禁而不得开坊。主事者阅其呈，久而不语，终批曰：「照律。」"
 LYY_Combo_Twin_High:"金玉其外"
 LYY_Combo_Twin_High_desc:"钱多而法严，商人束手，资本暗流外港。港口灯火通明，账面上却渐成一座精巧空壳。明面上之号，皆有实账；暗处之银，早经三手转至他港。老牙人夜数港中桅灯，数至半而止，谓其徒曰：「灯愈多者，未必船愈多。」老牙人所数之灯，自绯云坡楼上望之最全，其徒携灯前夜往。"
 LYY_Combo_Twin_Low:"两头皆空"
 LYY_Combo_Twin_Low_desc:"国库见底，律法亦立不起来。众人皆等一个能拍板之人，却无一人肯先开口。堂上设座九，议事三次，三次皆无人先言。至第三次散会，老臣留于座上，取笔于案，书四字：「谁肯先担。」书毕亦去，纸留案上。九座之设仿玉京台旧制，惟去其正座，九椅环案如围炉。"
 LYY_Combo_A_High:"豪富无律"
 LYY_Combo_A_High_desc:"金山压过了律文。投机客在码头彻夜狂欢，规矩退到角落，看着自己一寸寸被无视。判官判一案，判词未下，已有重金送至其门；税吏核一账，核至中途，忽奉调他任。老吏将律书置于案上，三日不翻，第四日自请致仕。致仕之呈自绯云坡递入，三日批下，批语一行：律书未翻，心已翻。"
 LYY_Combo_B_High:"律严财枯"
 LYY_Combo_B_High_desc:"法条压死了生意。秩序有了，街上人却愈少，账房数字愈冷。新法凡七十三条，条条无隙；商贾算过一遍，谓依此经营，十事有九不可行。老铺闭门，门上贴一纸，只书四字：「守法而止。」观者立良久，无一人笑。老铺在北码头巷内，观者中有人诵其四字，声低而字清。"

 #################### 凝光 · 天权临时政府 · 战后 ####################
 LYY_PW_Tianquan_New_Scale:"旧秤碎于众目下"
 LYY_PW_Tianquan_New_Scale_desc:"内战收场之日，凝光命人将群玉阁旧秤抬至港口正中，当众砸之。铜星四溅，秤杆断为两截。凝光曰：「此秤从前称货，亦称人，两头皆不准。」新铸之秤，只称货；称人之那一半，往后交给律法与账本。围观者中，有老掌事当场眼赤，亦有人弯腰拾碎铜，纳于袖中。凝光见之，不使人索。是夜港口换秤，新秤悬于棚下，星点锃亮，无人敢先试。"
 LYY_PW_Clear_the_Quays:"三百人清断桅"
 LYY_PW_Clear_the_Quays_desc:"断桅沉船，横塞泊位，港务几废。凝光雇内战失业之船工三百人清港，工钱按日结，米按时发，不赊不欠。一老船工收工后问她：港清完了，还雇人否。凝光曰：「港清完有码头，码头修完有城。」活计不会断，只要君肯来。老人视其手，见指上有绳痕，乃不复言。次日天未明，他已立于队首，手中自携一柄旧斧。所清之淤自南码头东栈起，淤泥以竹筐运，筐凡三百。"
 LYY_PW_Rebuild_the_Quay_Wards:"港坊以手艺重划"
 LYY_PW_Rebuild_the_Quay_Wards_desc:"港坊按手艺与人头重划，染坊、铁坊、船坊各归一处，界以石桩，不许占逾一尺。有富户托旧日商会门路来讨地，为账房先生挡于门外。其人怒曰：「吾昔年曾捐金修港。」先生曰：「捐者已谢，地者另算。」凝光闻之，只吩咐一句：「从前之地，买来者；今日之地，分出者。」两笔账不许并作一处算。石桩既定，无一人再移。次年春，三坊各立一碑，碑上不书名，只书匠。三碑立于北码头三坊之界，碑高四尺，匠名居中，字为阴刻。"
 LYY_PW_Reopen_the_Markets:"早市买盐按价付"
 LYY_PW_Reopen_the_Markets_desc:"开市头一日，凝光遣人敲码头旧锣三下，又撤关卡之税三道。她自往早市，不带从人，至一摊前，取最贱之盐一斤，付钱乃去。摊主初不识，既识，惶然不敢收。凝光以铜钱按于案上，曰：「君收者市价，吾付者市价，谁也不欠谁之人情。」摊主执钱良久，忽转身入内，取旧秤一杆，抹去积尘，重新挂于檐下。是日市声至夜不歇。旧秤挂于吃虎岩市檐，秤星补以铜，称煤称米皆其原主。"
 LYY_PW_Return_the_Terraces:"田埂重打旧界桩"
 LYY_PW_Return_the_Terraces_desc:"梯田旧契，战火中焚去大半。凝光不查旧籍，但下一告示：谁种者归谁，旧契尽废，有异议者至衙前议之。告示贴三日，无人上门。第四日，一老农抱残契来，立于阶下不语。账房先生取桩而出，当众自东而西重打一遍，打至其田，指桩曰：「此自今日属尔。」老农视桩良久，乃收残契于怀，不谢而去。重打之桩自归离原东畦起，桩木浸桐油，入土三尺。"
 LYY_PW_The_Common_Granary:"五家共掌义仓钥"
 LYY_PW_The_Common_Granary_desc:"义仓之钥，铸为五，分授五户，缺一户则门不开。幕僚以为不便，劝凝光收钥归官，曰：「调粮之时，何暇遍召五人。」凝光摇首曰：「仓中之粟，五户所凑，则锁当五户共开。今日为省一事而收之，他日仓空，亦无人为之心痛。」幕僚不能对。是冬开仓，五户毕集，钥入锁者五，声次第而合。仓在轻策庄祠前，锁五钥，钥悬五户之腰，形制各一。"
 LYY_PW_A_Ledger_of_Every_House:"一户一行一册"
 LYY_PW_A_Ledger_of_Every_House_desc:"清册挨户而登，所登者人丁、田亩、手艺，不登家资。一吏抱册诉曰：「条目太细，日仅得十户。」凝光取册示之曰：「此册上一人，昔在官账中只为一数；自今日始，各占一行。」吏俯首视册，见其祖名亦在其中，行末注丁口三，遂不复言，退而舔笔，是日所书，比往常工整。其册之祖本藏于玉京台，凡九百行，行末注丁口，墨色如新。"
 LYY_PW_Schools_of_Accounts:"账学馆首讲借契"
 LYY_PW_Schools_of_Accounts_desc:"账学馆开学，第一课不讲经义，讲如何看出一纸借契中之花头。听者船工、货郎、代人看铺之伙计，坐满一室。教习指契上一行曰：「此语看似许汝，实为缚汝。」众哗然。凝光亲至，坐至日昃，末乃曰：「会算账者多，则敢骗人者少。」一伙计以此语书于袖口，归途念之，念至家门犹未止。账学馆初设于吃虎岩旧栈，晨课核市秤，午后习判牍。"
 LYY_PW_The_Standard_Mint:"铸一枚验一枚"
 LYY_PW_The_Standard_Mint_desc:"铸币之炉，砌于旧钱庄废址之上。凝光定其成色与轻重，铸一枚则验一枚，验不过者，当场回炉，不以私情贷。老掌事捧旧摩拉一囊至，请搀用之，凝光当众却之，曰：「钱自重一分，人乃信我一分；自轻一分，他日须以命补之。」老掌事抱囊而退，面色如土。自是新钱行于市，市人受之不疑，亦不复辨其文。新钱由群玉阁监铸，凡一炉一印，炉号錾于钱缘，可溯。"
 LYY_PW_Rails_to_the_Chasm:"手置枕木第一根"
 LYY_PW_Rails_to_the_Chasm_desc:"铁轨自港口铺起，直入层岩矿口。第一根枕木，凝光手自置之于土，锤三下，木入半寸。监工请退，弗听。既立，语监工曰：「昔运一车矿，途中折二人命；自今而后，所折者石也，非人也。」闻者或笑其算得太细。至第一列矿车自山口出，声如雷，笑者立道旁，摘帽而观，帽为众所挤落，亦不觉。"
 LYY_PW_The_Craft_Guilds:"匠人自推掌事"
 LYY_PW_The_Craft_Guilds_desc:"行会重立，凝光只提一事：掌事由匠人自推，官不与闻。老掌事欲依旧例按资排座，凝光驳之曰：「行会所护者手艺，非谁家祖上开过几间铺子。」老掌事面赤，不复争。推举既毕，一打铜少年居首座，年最少，衣上有炉灰。自晨至暮，其手按于膝上，未曾一松。散时人问其故，曰：「怕一松手，此座便不属我等。」推举之会设于绯云坡会馆，席位以技艺为序，不问年资。"
 LYY_PW_The_Southbound_Caravan:"商队南行认旧路"
 LYY_PW_The_Southbound_Caravan_desc:"南行商队出城，驮盐、铁器、瓷器；归时易香料、药材，囊橐皆满。凝光作书与领队曰：「货可贱卖，路不可不认。」或问：「一条商道，何名分之足惜。」凝光曰：「路者，他人之足所踩而出也。认与不认，只看走过之人肯不肯为尔多说一句。」问者默然。是岁商队三出，每出必携旧路图一纸，图角皆磨破。商队发于遗珑埠，南道经碧水原，图角磨破处皆补以桑皮。"
 LYY_PW_Engineers_of_Liyue:"工学堂首授图纸"
 LYY_PW_Engineers_of_Liyue_desc:"工学堂开学，所授者机关、水文、冶金，亦授一课，曰：「此工当行否。」教习展图一幅于案，问诸生：此桥若成，两岸田淹几何。诸生算至日暮，无一人先答。凝光临席，谓众曰：「昔者凿山引水，恃一神抬手；今日须自识图纸。」言未毕，座中一老者起立，向之行礼，礼甚缓，满堂无一人催。算学之课设于玉京台东庑，庑中石板为桌，演算以炭条。"
 LYY_PW_Envoys_of_the_Quay:"先亮账本后通商"
 LYY_PW_Envoys_of_the_Quay_desc:"战后首批使节出海，所携者账册一箧、税则一卷，不赍厚礼。凝光语领使曰：「先使人看清我辈如何算账，而后可言如何做买卖。」或讥其太硬，曰：「求人而先立规，谁复与尔通。」凝光曰：「肯先出账者，方配谈信用。」使船离港之日，码头空荡，送者数人而已，惟灯塔一盏，自昏至明不灭。使船自南码头发，舱中惟账册两箱，无礼箱，旗上书算字。"
 LYY_PW_The_Wind_Accord:"阶前风车叶自转"
 LYY_PW_The_Wind_Accord_desc:"蒙德使至，携风车一具、酒二桶。风车置于阶前，风过叶转，满院皆响。使者曰：「此物无用，惟可观耳。」凝光曰：「无用之物能存，亦见其国之宽。」二人谈至夜分，所署第一纸，为税率互认之单，薄薄一页。凝光推酒杯于案侧，曰：「君国不劳神明，吾国方学不劳神明；余者，当以数目相语。」使者大笑，举杯而不饮。互认之单存两份，一存群玉阁，一存彼国驿馆，各钤骑缝。"
 LYY_PW_The_Thunder_Route:"使船雷雨夜入港"
 LYY_PW_The_Thunder_Route_desc:"稻妻使船，以雷雨夜入港。旧日封港之怨未消，舟人皆按刀而立。凝光不绕其事，直曰：「锁国所锁者，向来是锁门那一家自己。」稻妻使者色变，久之乃曰：「此语吾当录归。」是日许两国商船并泊，桅樯相望，水手各立舷边，无一人语，亦无一人去。一老水手伏舷观雨，竟夜不去，曰：「此生所见之雨，以此为最耐看。」并泊之湾在北码头外，湾深两寻，冬避风，夏避雷。"
 LYY_PW_The_Sands_of_Wisdom:"书归众人印扉页"
 LYY_PW_The_Sands_of_Wisdom_desc:"须弥学者至，载书二十箱、图纸百余幅。凝光命腾账学馆之半以置书，许人入观。惟于各书扉页，皆加一印，文曰书归众人。一学者不悦，谓书为私授，不宜示众。凝光曰：「诸君所授于璃月者，不当只授璃月之官。」学者默然半晌，退而自取印，于己书首册补盖一枚，盖毕，以袖拂其朱。书归众人之后，副本分藏月海亭与群玉阁，各三层函。"
 LYY_PW_The_Banks_of_Judgment:"灯下对读两国法"
 LYY_PW_The_Banks_of_Judgment_desc:"枫丹使者陈法典一部于案，厚几盈尺。凝光读之一夜，灯三易。诘朝，携璃月自订章程赴会，逐条比对，凡有异同，皆请使者释其义。使者初以为诘难，既而改容曰：「君读得细。」凝光曰：「法不患多，患只许一人诵之。」终乃互易判词范本，两不亏。散时使者语人曰：「璃月人算账，比吾辈所想者更硬。」判词范本互易之日，两纸对展于玉京台长案，朱批各半。"
 LYY_PW_The_Worlds_Fair:"诸国掣签分席次"
 LYY_PW_The_Worlds_Fair_desc:"万国商展设于旧税关空场，诸国货栈排为三行。凝光不剪彩，不致辞，只命诸国掌事自抽签定摊位，璃月商号亦在其中，无所偏。或问：「最旺之位，何不留给本国。」凝光曰：「展场者，所以示人，非所以捧己。今年让一寸，明年他人乃肯让一尺。」签既抽毕，有远国掌事得末位，反大笑，曰：「此位临街，人必过。」展场抽签于天后宫前，签筒以铜，筒口以红绳封之。"
 LYY_PW_The_Empty_Altar:"香案上空盘一只"
 LYY_PW_The_Empty_Altar_desc:"帝君之神位空，凝光不撤香案。惟于坛前置空盘一，无物可献。集议会诸人于坛下，指盘曰：「昔者举事，先视神之颜色；今日此盘空着，正好自视所算之账正与不正。」众皆默然。自是每逢大事，香案之上必留此盘，尘积则拂之，不为盛物，亦不为人取去。空坛设于玉京台阶前，坛石旧，盘置其中，晨暮各拂一次。"
 LYY_PW_Contract_over_Oracle:"神谕逐条注真伪"
 LYY_PW_Contract_over_Oracle_desc:"凝光命集历朝神谕、天象、谶纬为一编，逐条注其出处，辨其真伪；不可考者，书曰存疑。司其事者愈查愈惊，至一谶，验之三事皆合，持卷请定夺。凝光视之曰：「合者书合，不合者书不合，不问其为神为伪。」遂于卷尾亲书一行：「此编非为定论，乃为后人留一可自判之书。」其后此册置账学馆最显之格，翻之最旧。其册藏于月海亭，蓝面函，函签书可自判三字。"
 LYY_PW_The_Chasm_Debt:"看闸门一寸寸落"
 LYY_PW_The_Chasm_Debt_desc:"层岩之裂，再封一次。所用者新铸之合金、双股之绳，皆前次所未有。凝光亲下井口，立升降架上，看末段闸门一寸一寸落。石屑自顶坠，击其肩，不为动。闸合，声沉。凝光谓守者曰：「巨渊者，按月必偿之债也。今日多偿一分，后人乃少赌一命。」井口工人闻之，齐直其腰，向闸门立久，无一语。"
 LYY_PW_The_Quiet_Sky:"祈天录中回音绝"
 LYY_PW_The_Quiet_Sky_desc:"凝光命取历次祈天、观星、卜筮之录，并置一处，逐条相校。校者初不觉，既而惊曰：「天空岛之回音，一次轻于一次，至于今岁，遂无一字。」凝光不焚香，不斋戒，只于册上批一行曰：「彼不言，则吾辈姑以为不在。此语后录入议会备忘，凡涉天事，皆以此为断。」册页边上，朱笔已淡。备忘之册存玉京台，凡三卷，天事之页以朱线界之。"
 LYY_PW_Envoys_to_Celestia:"回执只批已知字"
 LYY_PW_Envoys_to_Celestia_desc:"往天空岛之路，久无人应。凝光仍遣使，所赍者一书，书曰：「若天理尚在，请现身一谈；若不在，请许吾辈自走。」使节去三月，归时两手空空，惟言至其下，云不开，呼之无应。凝光受其报，于回执末批二字，曰已知。使者问：「既已知，复遣乎。」曰：「遣。不为求答，为使后世知吾辈曾问。」使节自南码头出海，凡三遣，回执皆存群玉阁顶函。"
 LYY_PW_The_Mortals_Balance:"刻一言于门楣上"
 LYY_PW_The_Mortals_Balance_desc:"神之眼、仙人、天授之辨，议会争数月不决。有主尽废者，有主存其祀者，有言天不可犯者。凝光听毕，只曰：「璃月此后由谁主张，不在其位之高下，而在其理之可否。」众议遂定。命刻其语于议事厅门楣，匠人三易稿，字不甚工。有议者请易善书者重刻，众皆不许，曰：「此字是当日所说，非今日所写。」一老石匠日入此门，必抬头一视。门楣之刻在绯云坡议事厅，字深三分，仰视须退至阶下。"
 LYY_PW_The_Harbor_Guard:"新军只问护着谁"
 LYY_PW_The_Harbor_Guard_desc:"新军改名港防营，饷如旧，旗则新制。检阅之日，凝光立台上，谓众曰：「此军旧规曰不退，今规曰知所护者为谁。」台下寂然，久之无人应。少顷，一老卒出列，举手曰：「护者，吾家在城东。」众皆随呼，声不甚齐，与旧日口号大异。一少年兵呼毕，以袖拭目，旁一老兵以肘轻撞之，少年遂挺胸而立。护港之军屯于南码头旧仓，仓凡九楹，枪架皆贴名条。"
 LYY_PW_The_Sea_Watch:"货可弃人不可弃"
 LYY_PW_The_Sea_Watch_desc:"巡防船队沿商路往还，不为争雄，惟欲使每一艘挂璃月旗之船得归。凝光于训令末添一条：遇商船遇险，先救人，后论货。或笑其多事，曰：「船已沉，货已失，尚论货乎。」凝光曰：「能售货于天涯者，亦当有本事守家于天涯。」是岁风信恶，巡船救商船三，所活百余人，货多弃于海，无一人讼之。巡船三艘，泊于吃虎岩外，风信之旗一日一易，色五等。"
 LYY_PW_The_Southern_Wardens:"山民猎户各认路"
 LYY_PW_The_Southern_Wardens_desc:"南疆戍卫，募本地山民与猎户，不取行伍旧人。凝光所下第一令，不为布阵，乃令认路：某道可走骡马，某崖可藏人，某水旱季则涸。众初不解，既而巡山三月，归而自绘一图，比官图更细，溪涧断处皆有注。凝光观图，指其一处曰：「此非图上所有。」一老猎户曰：「此吾逐鹿时所知。」凝光曰：「守土者，先须识此土。」所绘之图后为玉京台所收，与官图并悬，观者皆先看私图。"
 LYY_PW_The_Militia_Charter:"枪口抬高一寸难"
 LYY_PW_The_Militia_Charter_desc:"团练之制改，不复以征来充数者为人头，各坊各号皆登其护丁于册，名系其人，不系其户。操练课目添一条：先学不误伤自己人。有老校问其故，凝光曰：「曾上阵者方知，最难之事，是枪口抬高那一寸。此语后抄于操典第一页，纸角磨破，字犹可辨。」一队操毕，队长令众人各验枪机三遍，乃收队。操典以麻纸印行于南码头书坊，凡二百册，首页之语以朱双钩。"
 LYY_PW_The_Maritime_Court:"三家行首同署判"
 LYY_PW_The_Maritime_Court_desc:"海事法庭设于码头边小楼，门前不置石狮，惟悬木牌一，书开审之时。头一案，两家船行争一泊位，讼于庭下。凝光不亲裁，取判词付三位素不相识之行首共署。一人署毕，手心皆汗，曰：「吾生平未曾判案。」凝光曰：「正为未判过，此一判乃值钱。」判出，两家皆服，无一上诉。木牌至今犹在，字为吏人手书，不甚端正。共署之木牌悬于月海亭外，凡十一署，名下皆无官衔。"
 LYY_PW_Arsenal_of_Liyue:"刀背刻匠名"
 LYY_PW_Arsenal_of_Liyue_desc:"兵工之厂自港口迁入山坳，产量倍于旧时，附近村落亦稍富。凝光定一规：厂中所出兵器，皆刻工匠之名于柄。或问其故，曰：「有人认领之物，乃不妄杀人。」头一件刻名之枪，悬于厂门，示于众。其匠日过其下，必停一步，视其名，然后入。一日雨，枪柄尽湿，匠以袖拭之，拭毕乃去。刻名之枪凡出于黑岩厂，厂门内侧悬枪一，其侧设雨棚。"
 LYY_PW_Envoy_to_Yuheng:"信我账不信我人"
 LYY_PW_Envoy_to_Yuheng_desc:"玉衡回书甚短，曰：「账可信君，人则不能。」书后附八省人口清册一卷，字迹工整，无一处涂乙，显然手自录之。凝光展册，翻而复翻，灯下阅至夜半，顾谓幕僚曰：「尔视之，肯骂我者，乃真以我为事；骂亦不肯者，早作不理我之算矣。」幕僚问：「既不相服，何以遣使。」曰：「正为不服，故须遣。」使节往还于玉京台与刻晴署之间，一岁凡七，皆乘夜车。"
 LYY_PW_Envoy_to_Yuehai:"一石米亦有批注"
 LYY_PW_Envoy_to_Yuehai_desc:"月海亭粮账至，细甚，一石米之去路亦有批注，某日某仓某户，皆可寻。文末有语曰：「君算得清金钱，我算得清米粮，二者相合，乃勉强算得清一个璃月。」凝光视勉强二字良久，忽觉己所自矜之账簿，在民生之前薄得可怜。乃取笔欲批，笔悬而不下，终只书二字于册尾，曰受教。"
 LYY_PW_The_Jueyun_Question:"雪不化置于案头"
 LYY_PW_The_Jueyun_Question_desc:"绝云间回书迟且冷。使者归，携不化之雪一片，附言八字，曰：「君等之律，量不出雪山之重。」凝光取雪置案头，自昏至明，视其不化。其平生所事，衡量、定价、核算，无物不入其数；至是乃觉，生平未为此无用无价之雪留一席地。诘朝，以素纸裹之，纳于匣，不题一字。"
 LYY_PW_The_Table_at_Mist_Harbor:"甲板上置酒一桌"
 LYY_PW_The_Table_at_Mist_Harbor_desc:"公子之船队泊于港外，甲板设酒一席，邀使者登舟。使者归报：「彼执行官不谈战，不谈兵，只谈秩序，谈得比商人更像商人。」凝光闻之，置茶盏于案，曰：「会做买卖之敌，比只会打仗之敌更难支。」语毕，命取最厚之账册一箧，遣人送之舟中，不附书。左右问：「此何为。」曰：「使彼知我亦有账。」账册送至雾海之滨敌舟，其收册之日，回赠盐一船泊北码头，不附书。"
 LYY_PW_The_Scale_of_Chenyu:"藤秤无度置于案"
 LYY_PW_The_Scale_of_Chenyu_desc:"使者负账册一箱登沉玉谷，欲示璃月港亦能算清山水之账。蓝砚不接账册，但取藤编旧秤一杆为赠，秤上无刻度，惟余磨痕。附言曰：「君等之契，量不出水土之重。」使者归，凝光取秤端详良久，以指循其藤纹，终无一语。此后此秤常置案头，吏有移动者，必复归原位。"
 LYY_PW_The_South_Cross_Route:"重测水线开旧道"
 LYY_PW_The_South_Cross_Route_desc:"南十字旧航道封闭多年，礁图过时，纸上所记之礁，或已陷于沙，或新出于浪。凝光遣人重测水线，又请老舵手数人同行，皆曾走此路者。幕僚言：「此线绕远，所得无几。」凝光展旧礁图于案，指其折处曰：「有些路留着，非为省钱，为使此城之人知我辈尚敢外望。」图既展，众皆俯身，以炭条标其险处。"
 LYY_PW_The_Name_of_Ningguang:"碑上不刻己之名"
 LYY_PW_The_Name_of_Ningguang_desc:"有议者请以天权名港，凝光不许，曰：「后世记不记我，不当由一块牌上之字定。」议者再请，乃许立碑，碑上刻其手书五字，曰此港属众人。立碑之日无仪无乐，惟石工数人，与观者十数。日暮，数童子至碑前，以石画地为格，跳跃为戏，笑声在石间，碑上朱犹未干。碑立于南码头东，碑石整，五字为凝光手书，笔锋存。"
 LYY_PW_The_Balance_Question:"开厅门听三日争"
 LYY_PW_The_Balance_Question_desc:"新秤既立，加码于何端，遂成难题。凝光命开议事厅之门三日，凡有言者皆入，不问其位。三日之间，纸积半人高，争犹未止，有拍案者，有拂袖者，有坐而不言者。左右请止之，凝光视纸堆曰：「吵不尽者最好。」吵尽之日，乃真无人敢开口之日。是三日，厅中灯至天明不灭，灯油耗尽者三。"
 LYY_PW_Free_Port_Charter:"长文难在义务"
 LYY_PW_Free_Port_Charter_desc:"自由通商之约，长文数百言，最难下笔者，义务一节。凝光删改再三，乃于第一条书曰：「凡在本港经营者，无论贵贱贫富，皆同守一法。」宣毕，一老士绅掷茶盏于地，盏碎，众皆失色；亦有默默取副本，纳袖而去者。自是每有争执，辄有人出此纸于怀，展之以为尺，指其一条曰：「此即尔所署。」"
 LYY_PW_Independent_Courts:"律台移出议堂"
 LYY_PW_Independent_Courts_desc:"法司迁出议事厅，移于临街小楼。凝光亲刻四字于石阶，曰民可问官，又命撤门前石狮，以旧石铺阶。语左右曰：「法司若在衙中，永为衙中之家法；惟在街上，乃可为百姓之靠。」头一日开衙，一农人著旧鞋，立于阶下良久，欲入而止，门吏引之入座，为斟水一碗。农人捧碗，手犹颤。"
 LYY_PW_The_Assembly_of_Quays:"末座听八区之争"
 LYY_PW_The_Assembly_of_Quays_desc:"商埠议会初开，八区之人以八种口音争一日，几至相殴。凝光坐末排，自晨至暮，未插一语。散时有人问：「君何不主持。」凝光笑曰：「我一开口，众目皆视我色，不复视对面之理。」如此之会，开亦如不开。问者怔然，转身而去，行数步，复回视之，凝光已低头理纸。"
 LYY_PW_The_Open_Ledgers:"巨板写尽钱来去"
 LYY_PW_The_Open_Ledgers_desc:"公账公开之日，码头边立巨板一，自晨至暮，一笔一笔书其来去，某船入若干，某货出若干，观者塞途。一老账房携算盘至，自午核至夜半，指冻而数不止，终无所获，悻悻收算盘而去。凝光远立檐下视之，谓左右曰：「吾所惧者，非算错，乃他日无人肯来算。」左右不解，凝光亦不复言。"
 LYY_PW_Abolish_the_Guild_Monopoly:"专营令废壁垒塌"
 LYY_PW_Abolish_the_Guild_Monopoly_desc:"废专营之令既下，数十年行会壁垒，一朝而塌。老掌事十余人，各举木牌，上书传统二字，立于商会门前，自晨至昏，不发一语。凝光自窗内视之，不动气。少顷，顾谓侍者曰：「昔年多少新匠之手艺，皆为此二字攥死于门内。」语毕，不复视，转身批其卷。"
 LYY_PW_Schools_of_Law:"讼棍亦许登讲席"
 LYY_PW_Schools_of_Law_desc:"律学馆设于旧日讼师之侧，两门相隔一墙，墙不甚厚，声可相闻。凝光聘退职判官、账房先生为教习，亦聘讼棍数人，皆素有恶名者。或问：「此辈亦配登堂。」凝光曰：「使百姓知法，是使知法在手中可用，非使知法在纸上可畏。」问者语塞。开馆首日，来听者百人，阶下亦立满。"
 LYY_PW_The_Constitutional_Quay:"还政之期书于末"
 LYY_PW_The_Constitutional_Quay_desc:"宪政港约成，港、市、坊、田之权责，皆著为明文，末条则还政之期。有议员劝留活口，曰：「日子太死，他日难转。」凝光摇首，提笔书之，年月日皆具。曰：「为己留后路者，不配受一城之信。」按印之日，群玉阁落细雨，阶下立者数百，无一人语，惟雨声可闻。印既落，凝光收手，视其朱良久。"
 LYY_PW_The_Open_Quay:"凿去门楣临时字"
 LYY_PW_The_Open_Quay_desc:"万国商埠之名号挂上港门，凝光命人并凿门楣上临时二字。凿时石屑落于阶，老石工手颤，凿三下乃去其一。凝光立于门下，语左右曰：「吾此生或只成一事，即使此城之门，由门内之人自定其对谁而开。」语毕，海风至，新漆之气随风远送，过港者皆闻之。"
 LYY_PW_Merchant_Privy:"茶室围坐定港事"
 LYY_PW_Merchant_Privy_desc:"商会枢密无衙、无印、无吏，议事只在一间茶室。掌事十余人环坐，茶三巡而事定，一句尾音之轻重、一个眼神之向背，即可决半座港口之运。凝光居主位，视座中人，忽觉此辈比官府更像官府。乃默念曰：「吾未推倒旧序，特为旧序换一身较体面之衣耳。」茶冷，无人唤添。"
 LYY_PW_The_Closed_Ledger:"两三册密账不宣"
 LYY_PW_The_Closed_Ledger_desc:"密账不宣。天权紧要之数，自此只书于两三册不示外人之簿。凝光自谓此权宜之计耳，然册日益厚，翻之亦难。一夕灯下取册，指循其字，忽自惊曰：「不肯示人之账，本身即一供状。」遂欲书其罪于册首，笔至纸而止，终未落墨。册仍锁于柜，钥在其怀。"
 LYY_PW_Company_Spears:"双饷之兵认二主"
 LYY_PW_Company_Spears_desc:"商团私兵成军，旗号各归其家，号令则出于一茶室。兵受双饷，认二主，衣上无同色，刀上无同铭。凝光检阅于校场，见其行伍齐整，忽忆刻晴所练之民兵，昔尝笑之。至是乃悟：以钱买之兵，比以信结之兵更听令，亦更易变。语左右曰：「钱一停，枪口自转。」左右皆默。"
 LYY_PW_The_Tariff_Walls:"壁垒重重挡外货"
 LYY_PW_The_Tariff_Walls_desc:"关税壁垒，一道既立，一道复起，外货尽挡于港外。库中积货如山，鬻之不出，而商人反拊掌，盖所挡者多他人之货也。凝光不阻，亦不赞。一夕独登楼看海，远处海面为壁垒所截，断续有光，如碎镜。风自海上至，衣角渐冷，立至三更乃下楼。侍者候于阶，问：「可观乎。」曰：「可观，不甚好看。」"
 LYY_PW_The_Guild_Supreme:"镜中人不识镜"
 LYY_PW_The_Guild_Supreme_desc:"商会至上之律既下，天权商会自议事之厅，变为发令之衙。律须视商会之颜色，吏必经商会之遴选。凝光行此路极稳，稳至一日晨起对镜，执梳而止。镜中之人，面犹昔日，而目已不同。凝视良久，自语曰：「此为我乎，抑为昔年我所憎之影。」侍者进簪，弗应，梳落于地。"
 LYY_PW_Bonds_of_Loyalty:"以忠为质贷一票"
 LYY_PW_Bonds_of_Loyalty_desc:"权债者，一纸之契，以忠诚为质。借之者，于下次表决时负凝光一票，不必书券，亦无从推。凝光以权为账，算得极精，人称其能。然账之可畏者，在利滚利而至无人能偿之日；至彼时，收账者与欠账者，俱随此城而沉。夜深核其数，一页未竟，乃合册，闭目良久。"
 LYY_PW_The_Northern_Mortgage:"生意可做港不押"
 LYY_PW_The_Northern_Mortgage_desc:"北国密使来，比商队更勤。不谈货，不谈价，只出一纸合约，欲租借全港。凝光读三遍，批其末曰：「生意可做，港口不作抵押。」密使冷然问：「君曾思其代价乎。」曰：「算过，比君算得清。」密使无言，收约而去。是夜凝光独坐，烛三易而人不动，至烛尽火灭，乃觉天已将明。"
 LYY_PW_Tianquan_Eternal:"府门四字刻成日"
 LYY_PW_Tianquan_Eternal_desc:"天权永固四字刻上府门之日，全城张灯，鼓乐达旦。凝光端坐最高处，视脚下万家灯火，而于最喧闹之一刻，忽忆多年前初掌商会、尚信账目可量天下事之一少女。众请致辞，凝光摇首。惟于心中默诵临时二字，诵之甚缓，诵至第三遍，鼓声忽止。"
 LYY_PW_Liyue_One_Scale:"两本账并作一秤"
 LYY_PW_Liyue_One_Scale_desc:"璃月重归一秤之日，凝光取两本账并置于案：一本记商港之出入，一本记天授之去留。翻至末页，于空白处书一行曰：「秤上二砣，今日乃得同置一桌称之。」书毕合账，推窗，码头之灯次第而明，自近及远，如有人以笔重描一带海岸。凝光倚窗立，久乃曰：「此笔须长。」"
 LYY_PW_The_Long_Ledger:"此账不封待后人"
 LYY_PW_The_Long_Ledger_desc:"长账之扉页，只书四字，曰此账不封。凝光交出群玉阁之钥，不留副本，亦不封其柜，惟留一交代：此后谁当家，谁即续书此账；至于无可书之时，亦须书。语毕出门，天方明，码头已有吆喝之声。门吏追送，问：「尚有何嘱。」凝光回首曰：「嘱已书在册上。」"
 LYY_PW_The_Open_Horizon:"先问其如何算账"
 LYY_PW_The_Open_Horizon_desc:"商船渐远，海图上空白之格，一格格填入。凝光作训令与远洋船队曰：「凡至一处，先问其人如何算账，再问其人如何守约。勿以我法绳之。」或问：「所图者何。」凝光望桅外之海，曰：「图此后此海之上，不止一色之旗，亦不止一家之规。」语毕，海鸟掠桅而过，落一声于帆上。"

 LYY_postwar_category:"天权新秤"
 LYY_postwar_category_desc:"乱局既定，天权战后施政尽在此府。重撑商港之盛，整税关、抚商民、复信誉，皆列于此。港灯再亮，璃月元气方算回来；商路与人情，亦自此时慢慢聚拢。港上生意一起，旁事便皆有归处。"
 LYY_decision_pw_grain_subsidy:"平粜粮价"
 LYY_decision_pw_grain_subsidy_desc:"米价一涨，人心即晃。开仓平粜，最亏本。天权之账房算过：此钱花出去，收不回，还得接着花。凝光曰：「收不回者，钱也；收得回者，夜里无人砸仓。」遂行，岁以为常。天权账房在群玉阁西廊，屋小无窗，终日点灯。"
 LYY_decision_pw_harbor_works:"修桥浚港"
 LYY_decision_pw_harbor_works_desc:"修栈桥、挖航道、补堤岸，皆不急之务。或问：「战事方息，何不省此钱。」凝光曰：「闲手无活，则生乱。」批钱之时，从不问赚不赚，只问能雇几人。吏答能雇二千。凝光曰：「再算。」栈桥自璃月港南码头起，木桩入水二丈，桩上缠麻。"
 LYY_decision_pw_ledger_drill:"核账度支"
 LYY_decision_pw_ledger_drill_desc:"旧账一页页翻过。核账不为追责。僚属问：「事既过去，何以重翻。」凝光曰：「下一笔钱未出之先，须使众人皆见此城家底尚余几何。」翻三日，余数出，一吏失色。凝光不视其人，只看其数。旧账在玉京台档库，架编号至十七，后架犹空。"
 LYY_decision_pw_market_fair:"开埠招商"
 LYY_decision_pw_market_fair_desc:"码头敞开，货物得流。市声喧处，钱来得快，是非亦来得快。有司请复旧禁。凝光曰：「不肯做买卖之港，不久即成死港；死港不生盗，亦不生人。」遂尽撤旧禁，只留一簿。港门尽撤旧禁，只留一簿，簿置于南码头栅门侧。"
 LYY_decision_pw_harbor_patrol:"巡防航路"
 LYY_decision_pw_harbor_patrol_desc:"船出海，须有人替其记归路。巡防不为争雄。有问：「不争雄，养此舟何为。」凝光曰：「使盗知此道有主。」遂发舟六，不张旗，不鸣鼓，昼夜循道而行。三月，劫案绝，商船自至。巡舟六艘发於南十字港，桅上无旗，惟绳索有声。"
 LYY_decision_pw_buy_loyalty:"以金买诺"
 LYY_decision_pw_buy_loyalty_desc:"以金买交情，最速，亦最短。每赠一笔，即是一注：所买者，他人今日之点头；所押者，此城往后之信。幕僚问：「既知短，何仍买。」凝光曰：「今日尚须其点头，明日之说，明日再议。」金发於群玉阁账房，以布囊盛之，囊上不书姓名。"
 LYY_decision_pw_public_ledger:"悬账于市"
 LYY_decision_pw_public_ledger_desc:"账挂于众目之下。有僚属谏曰：「一城之账摊于市井，恐为人所算。」凝光曰：「不敢使人查账之官府，与不敢开匣之商号，何异。」账出三日，市人聚观，指其数而议。账张于璃月港南市口，纸以浆粘，风揭其角。"
 LYY_decision_pw_recruit_clerk:"募笔与口"
 LYY_decision_pw_recruit_clerk_desc:"新政须会写字之手，亦须守得住口之人。招录书吏，既以补人，亦以在凝光左右置耳目，只认章程，不认旧情。取者四十人。凝光语之曰：「认得旧情者，今日便可去。」无一人去。取者四十人，列于玉京台阶下，各授笔一、册一。"
 LYY_decision_pw_issue_bonds:"借明日钱"
 LYY_decision_pw_issue_bonds_desc:"公债者，借明日之钱，花于今日。借时千金散尽，还时方知：真正抵押出去者，乃往后每一代璃月人对这座城之信。借钱者一身之债，借债者一城之债。故借债之先，当问还债之人肯不肯。债券用厚纸，编号以朱，藏于群玉阁石室，启匣须三钥并发。"
 LYY_decision_pw_envoy_to_yuheng:"使者赴玉衡"
 LYY_decision_pw_envoy_to_yuheng_desc:"使者所携，非盟书，账册一部。凝光附书一纸，曰：「政见可不同，账总要有人会看。」使者归，述刻晴接册，不答书，先翻末页看结数，看毕乃曰：「此人可与共算。」凝光闻之曰：「吾所待者，即此语也。」使者携账册自群玉阁出，行三日方至玉京台，阶九级。"
 LYY_decision_pw_envoy_to_yuehai:"使者赴月海亭"
 LYY_decision_pw_envoy_to_yuehai_desc:"月海亭檐角挂霜，未化。使者归，携粮账一部，细至石米。附甘雨一语：「账目清者，方配谈天下。」凝光取其语，抄入手札，抄毕又看一遍，曰：「此语非赞吾，乃试吾。」"
 LYY_decision_pw_envoy_to_jueyun:"使者赴绝云间"
 LYY_decision_pw_envoy_to_jueyun_desc:"绝云间不问世事，使者却为留三日。归时携回一片不化之雪，并一语：「汝等之律，量不出雪山之重。」凝光取雪置案上，看其不化，久不语。幕僚问此语何意。凝光曰：「意为吾辈之尺，尚短。」"
 LYY_decision_pw_envoy_to_mist_harbor:"使者赴云来海"
 LYY_decision_pw_envoy_to_mist_harbor_desc:"公子之船队泊于港外，甲板上却设一桌酒。使者归，言其不谈战，只谈秩序，谈得比商人更像商人。凝光听毕曰：「会做买卖之敌，比只会打仗之敌，更难对付。」语毕，命人查其船所载，查得尽是粮与铁。其船泊于云来海外三里，所载惟粮与铁，箱角包铁已锈。"
 LYY_decision_pw_envoy_to_chenyu:"使者赴沉玉谷"
 LYY_decision_pw_envoy_to_chenyu_desc:"使者携账册一箱上山，欲示璃月港亦能算清水土之账。蓝砚不接册，只回赠旧秤一杆，秤星已磨，曰：「汝等之秤量货，吾之秤量山。」使者携秤归。凝光执秤，称米一斗，秤不举，曰：「此秤不肯称米。」"
 LYY_decision_pw_maritime_court_seat:"码头设案"
 LYY_decision_pw_maritime_court_seat_desc:"码头边腾小楼一栋，挂木牌，书开审之时。争码头、抢泊位、扣货物者，皆至案前说理。凝光不坐堂，只命人将判词逐案留档。有问：「不坐堂，何以服众。」凝光曰：「判词在，众自服。」小楼腾于南码头边，上下七间，窗临市声，卖鱼者呼。"
 LYY_decision_pw_proclaim_the_compact:"重刻新约"
 LYY_decision_pw_proclaim_the_compact_desc:"十二方，旧敌、中立、观望者，尽请至一张长桌前。幕僚谏曰：「与败者同席，是自贬。」凝光曰：「只由赢家签字之约，撑不过下一次翻脸。」遂列席，各予一纸。至夜分，签者九，掷笔者三。凝光不追，只命人收其空位之杯。长桌设于玉京台正厅，十二席，空设三席，杯箸终席不撤。"

 LYY_Event.9001.t:"旧秤当众碎于港"
 LYY_Event.9001.d:"内战收场之日，凝光命人将群玉阁旧秤抬至港口正中。秤为铜铸，三人方举，杠粗如臂，星斗斑驳，秤钩上犹系一截旧绳。\n围观者数百，环立如堵。有自八区来者，有自码头来者，皆不言语。凝光立于秤侧，曰：「从前这杆秤，称货也称人，两头都不准。今铸新秤，只称货；称人那一半，往后交给律法与账本。」言毕举锤，一击而断，再击而碎，铜片飞出，落地有声。\n人群中有老掌事当场红了眼，以袖掩面，退入人后。有孩童上前拾铜片，为其母拽回，拽得急，几乎跌倒。\n散场后，铸秤匠人问：「碎铜可收去熔了。」凝光曰：「不必。」让它在港口多躺几日，让人多看几眼，才知今日所砸者何物。是夜铜片仍在原处，行人绕之而行，无人拾取，亦无人践踏。有巡丁欲扫，巡长止之，曰：「再放一夜。」秤碎之处在码头正中，铜片散落，日光下如鱼鳞。"
 LYY_Event.9001.a:"新秤只管称货，不称人"
 LYY_Event.9001.b:"旧秤姑存，废立并行"
 LYY_Event.9002.t:"三百船工清旧港"
 LYY_Event.9002.d:"断桅与沉船堵在泊位，水黑而滞，浮油映日成彩。凝光雇三百船工清港，皆内战里失了业者。工钱按日结，米按时发，不拖欠一日。\n工分三队：一队断桅，一队起锚，一队捞尸。捞尸者另给酒钱，不问姓名，只记数目。数目书于板上，板挂于棚。工棚以旧帆为顶，雨至则漏，漏处置桶，桶满即倾。\n一老船工收工后，坐于缆桩上，问曰：「港清之后，还雇人否。」凝光曰：「港清之后还有码头，码头修毕还有城。活计不会断，只要汝肯来。」老人低头看自己之手，手上全是铁锈与油污，搓几下，搓不掉。\n他将铁钩往肩上一搁，隐入暮色。次日天未明，他已立于码头，比谁都早。管工问他何以如此早，他曰：「睡不惯软床。」管工笑，递过一碗热粥。他接了，蹲在桩上吃，吃得极慢。断桅沉船堵于璃月港泊位，水黑而滞，浮油映日成彩。"
 LYY_Event.9002.a:"按日结钱，雇本城船工"
 LYY_Event.9002.b:"征用民夫，从速清港"
 LYY_Event.9003.t:"港坊按艺重划界"
 LYY_Event.9003.d:"港坊重划，以手艺与人头为准：染坊、铁坊、船坊各归一处，一尺不得多占。\n有托旧日商会门路来讨地者，为账房先生挡于门外。\n来求情者悻悻而问：「我等从前置下之铺面，算不算数。」\n凝光答曰：「从前之铺面，以钱买之；今日之地，以人头分之。」两笔账不可并作一处算。\n其人曰：「如此，我等吃亏矣。」凝光曰：「汝等吃了，旁人便没吃。此语我不改。」\n重划之后，港中染坊先开工。开工之日，坊门挂新牌一块，牌上无字。或问何故不题名。管事曰：「待做出第一匹布，再题未晚。」\n重划之册后悬于港署墙上，谁家之地、几尺几寸，书之甚明。有人夜往偷看，只看自己一栏。看毕，立而不去。守夜者问其所寻。其人曰：「寻我父从前之铺子在何处。」璃月港染坊在下，铁坊在上，上下之间以石阶相接，阶凡四十。"
 LYY_Event.9003.a:"地按人头手艺分，旧契作废"
 LYY_Event.9003.b:"承认旧铺面，只调超额"
 LYY_Event.9004.t:"买盐一斤自付钱"
 LYY_Event.9004.d:"开市头一日，凝光遣人敲码头旧锣三下，又撤三道关卡之税。锣声过水，市人自巷中探头，初不敢出。\n巳时，她自往早市，不携仪从，只一侍者相随。至一盐摊前，指最贱之盐，曰：「一斤。」摊主秤之，包以旧纸，递上；手却缩回，不敢接钱。有鱼贩远远望见，手中刀停在半空，忘了落下。\n凝光将铜钱按于案上，曰：「汝收者市价，我付者市价，谁也不欠谁人情。」摊主曰：「小人不敢。」凝光曰：「不敢收钱，便是不敢做买卖。」摊主乃收，数之，多出一枚，追出两步欲还。凝光不回头，只举手摇了一摇。\n是日开张之摊，比预想多一倍。至暮收摊，有老妇舍不得摘幌子，立于凳上，将幌子抚平，抚三遍，方卷起抱回家去。其后数日，市价自平，无人再提免租之事。盐铺在璃月港码头西，铺面窄，柜台以旧船板改制。"
 LYY_Event.9004.a:"市价由肆主自定"
 LYY_Event.9004.b:"限价稳市，先保民生"
 LYY_Event.9005.t:"界桩重打旧契废"
 LYY_Event.9005.d:"梯田旧契，大半焚于战火。争界者日有数起，有持残纸者，有但凭口说者，有以祖坟为证者。讼至衙前，一日之内，几至相殴。\n凝光索性下一道笨告示：谁种者归谁，旧契作废，有异议至衙门口来议。告示贴出三日，无人上门。\n第四日，一老农抱残契而来。契已焦半，字不全，以布裹之，布亦焦。账房先生当众重打界桩，自地头至地尾，三十七桩，一桩一桩砸下，砸一桩，报一数，老农跟在后，逐一记于心上。桩入土三寸，砸至第七桩，遇石，锤跳，账房虎口震裂，裹布再砸。打毕，老农把契纸收入怀中，未言一字，出衙而去。\n行至街口，忽取出契纸，撕之，撕为数片，撒于地。碎纸落地，风卷起两片，他弯下腰，攥住第一捧新土，土从指缝漏下，漏尽，仍攥着。归离原界桩以石为桩，入地二尺，桩上刻户名与亩数。"
 LYY_Event.9005.a:"还田于耕者，重打界桩"
 LYY_Event.9005.b:"田归公仓，按劳分配"
 LYY_Event.9006.t:"义仓五钥分五家"
 LYY_Event.9006.d:"义仓之钥，铸五把，分交五户，缺一户则门不开。五户者，一农，一匠，一船户，一医，一塾师。\n有幕僚谏曰：「五钥分持，调粮不便，遇急则误。」凝光摇首，曰：「仓中之粮，五户凑者，锁就该五户来开。今日为图省事将钥匙收回，明日仓空了，也不会有人替它心疼。」幕僚退，记其语于简。\n钥以红布裹之，各系木牌，牌上书户名。授钥之日，五家皆至，立于一排，无人先接。久之，农人上前，双手受之，余四人乃依次受。医者受钥时问：「若有一户迁走，钥当归谁。」凝光曰：「归其所继者，不归官府。」\n后有一把，锁进镇上最老那间私塾书匣里，与《千字文》同格。塾师曰：「此钥在此，童子日日见之，长大便知仓属谁。」五钥既分，仓门日日开而不空。米入米出，板上记数，五日一核，核者即五户轮值。仓在璃月港城东，屋三间，门以铁包，锁为铜，凡五具。"
 LYY_Event.9006.a:"钥匙分五户共管"
 LYY_Event.9006.b:"收回钥匙，由官总揽"
 LYY_Event.9007.t:"清册上各占一行"
 LYY_Event.9007.d:"清册既下，吏员分行而录。所录者三：一曰人头，二曰田亩，三曰手艺。家资不问，贫富不入册。有吏执笔终日，腕酸而怨曰：「条目细至此，一乡之册，三年不能毕。」同曹者皆笑，笔下亦渐慢。\n凝光取册示之，指其行曰：「此一行，昔在官府账中，不过一数目耳；自今日始，各占一行。」吏员默然，俯首舐笔，是日所书，较常日工整。\n有寡妇持户帖至，问三子皆幼，可须尽书。吏曰：「书之。」妇人曰：「书之何用。」吏指册曰：「他日征夫，不征此三行。」妇人乃以指蘸唾，逐行抚过，如抚其子之面，抚毕乃去。收册之夕，灯下独坐，取己父之名反覆校之，凡三遍，恐一笔有误。校毕，以指按其名，久而不去。窗外更鼓三下，始掩册而卧。书吏之名不入册，惟记其字，一笔一画皆须端正。或问其故，曰：「此册异日要摊在众人面前，字歪者，人不信。」玉京台之册以厚纸，一行记一户，行间以朱线隔之。"
 LYY_Event.9007.a:"一人一行，务求详尽"
 LYY_Event.9007.b:"只登商籍，不问民户"
 LYY_Event.9008.t:"账学馆首日开讲"
 LYY_Event.9008.d:"账学馆开学，头一课不讲经义，讲借契。教者取一纸旧契悬于壁，指其小字曰：「此处藏息，此处折算，此处一字之差，可抵三年工钱。」听者皆船工、货郎、代人看铺之伙计，一时无人出声，惟闻笔下沙沙。\n教者又取水一杯置于案，问：「此水几分满。」或曰半，或曰三分，争不能定。教者曰：「契上之数，亦如是。」凝光亲来坐至日昃，居末排，不发言。散课时众请其训，乃曰：「会算账者多一人，敢骗人者便少一人。」语毕即去，不留饭，不设座。\n有一伙计以此语书于袖口，归途念之不已。翼日其母问袖上何字，乃一字一字念与母听。母不识字，听完曰：「原来我也会算。」散后教者独留，取案上那杯水饮尽，视堂中空座三十余，自语曰：「下一课讲田契。」田契最难，一亩之数，能困人一世。馆在璃月港城西，屋五间，壁上悬旧契，契角以钉按之。"
 LYY_Event.9008.a:"账学馆广开，不问出身"
 LYY_Event.9008.b:"只收聪敏者，免耗钱粮"
 LYY_Event.9009.t:"铸币厂新炉初燃"
 LYY_Event.9009.d:"铸币厂立于旧钱庄废址，炉砖皆取旧墙之石，火一燃，墙缝间犹有旧年银气。凝光定成色，定重量，铸一枚验一枚，验不过者当众回炉，不留一枚于库。\n有老掌事携旧摩拉一囊来，愿掺新钱中行用，谓可省工三成。凝光当众却之，置囊于案侧，曰：「钱自重一分，人乃信我一分；自轻一分，他日须以命补之。」老掌事面赤，捧囊而退，囊坠于阶，钱散满地，无一人为之拾。\n头一批新钱发至码头，验钱者排两行，自晨至暮不散。有钱铺伙计持钱就耳畔摇之，听其声，听毕点头，方肯收下。一老妇以布裹钱三枚而归，途中数回解布视之，至家门乃系于襟内。监工夜记炉数于壁，画正字，画至第七个，手一抖，粉落满地，乃以袖拭之，重画。炉火三日夜不熄，掌炉者轮班，交班时以手指炉门，示意火色，不发一言。厂立于璃月港旧钱庄废址，炉砖取旧墙之石，石上有旧凿痕。"
 LYY_Event.9009.a:"铸新钱，定成色重量"
 LYY_Event.9009.b:"沿用旧钱，暂缓改铸"
 LYY_Event.9010.t:"第一列矿车出山"
 LYY_Event.9010.d:"铁轨自港口铺至层岩矿口，凡若干里。第一根枕木，凝光亲手置之，监工欲代，不许。语监工曰：「昔运一车矿，道上折两条人命；自今以往，所折者惟石头耳。」监工应之，而面色未解。\n铺轨之工，日行二十里，锤声相接。有工徒问：「轨成之后，矿工可减几人。」老匠曰：「不减人，减棺。」有幕僚笑其算得太细，谓铁轨之费，十年不能偿。凝光不辩，惟令工徒逐段试车，空车先行，重车继之。\n及第一列满载矿车轰然出山口，声震山谷，观者塞道，有童子为众所挤，帽落于轨侧，人不敢取。一老矿工立于道旁，伸手抚轨，抚之甚轻，如抚故人之臂。良久，语其孙曰：「此物不识人，却认路。」轨侧立石一方，刻铺设之年月与工徒名，石不高，过者多不视。有工徒每日收工，必以袖拂其面，拂毕乃去。矿车以铁铸，轮小，轨窄，一车可载矿千斤。"
 LYY_Event.9010.a:"铁轨直铺巨渊"
 LYY_Event.9010.b:"暂缓工事，先固边防"
 LYY_Event.9011.t:"首座让与打铜人"
 LYY_Event.9011.d:"行会重立，凝光只提一条件：掌事由匠人自推，不由官府点。老掌事欲依旧例按资排座，谓某家三代开铺，某家曾供御器。凝光驳之，曰：「行会所护者手艺，非谁家祖上开过几间铺子。」\n众议半日，推一打铜少年。少年登首座，手按膝上，指节发白，自始至终未敢松。堂下老匠有不服者，出而问其法，少年答三语，皆中鹄，问者乃退。\n散会后，少年私问执事：下回还容我坐此否。执事曰：「尔手艺在，座便在。」少年归家，是夜未眠，取锤击铜一片，击至天明，声不乱。越三日，老掌事携一铜壶至其铺，置于案，曰：「此壶我打四十年，底有裂纹，你补。」少年视之，取锤三下，裂合。老掌事抚壶，不语而去。自此行会推掌事，皆以试工定之：一炉火，一块料，一件器。器成而众无异议者，乃登座。行会堂中悬旧图一轴，图绘黑岩厂初凿之状。"
 LYY_Event.9011.a:"掌事由匠人自推"
 LYY_Event.9011.b:"掌事由官府指派"
 LYY_Event.9012.t:"商队南行认旧路"
 LYY_Event.9012.d:"南行商队驮盐、铁器、瓷器出城，回程载香料与药材。行前凝光作书与领队，书中惟一句：「货可贱卖，路不可不认。」领队读竟，藏书于怀。或问：「一条商道之名分，何足挂心。」凝光曰：「路乃人踏成。认与不认，只看行者肯不肯替汝多说一句。」问者不能对。\n商队归日，领队于阶前解囊，取沿途路引一张张摊开，铺满半案，有雨水渍者，有火燎其角者。掌书记者逐一录之，录至第七张，笔忽滞，乃一处关吏私索之记。\n凝光取视良久，命另录一册，曰：「此亦路之一段。」翌月，关吏以赃免，路引另给。商队再行，携此册以往，沿途无人复索。是年商队再出，携路引之外，另带空册一本。领队语众曰：「沿途凡有人助我者，书其名。」归时册已半满，名多不识，字多歪斜，而一笔不删。南行之路出城，过荻花洲，渡一水，水浅可涉。"
 LYY_Event.9012.a:"商道认路不认官"
 LYY_Event.9012.b:"商道仍由官府设卡"
 LYY_Event.9013.t:"工学堂开讲图纸"
 LYY_Event.9013.d:"工学堂始立，讲机关，讲水文，讲冶金，亦讲一项工程该不该上马。教者先问众：凿山引水，何以知其可成。堂下寂然。\n凝光至，立于阶前曰：「昔者凿山，待神明抬手；今者凿山，须自己看图纸。」语未毕，有老先生自末座起，整衣行礼，礼甚缓，一堂无人催之。礼毕复坐，取随身旧水利手记一册，推至同桌少年前，曰：「此吾三十年所记，多错，尔等改之。」\n少年不敢受，老者以手按册，不收回。日暮散学，堂中灯未熄，十余人围一图，争一水口之高低，争至二更，乃以炭笔画三线而定。老者独坐末座，视众人争，面带笑意。有少年回头问其故，曰：「我少时亦争此，无人可争。」是冬，学堂所绘之水车图，用于城外一渠，水至田头，较旧法省工半。村民不知绘图者谁，但于渠边立一石，刻曰：「此水自来。」堂在璃月港城西，窗临街，讲时街上人亦驻足听。"
 LYY_Event.9013.a:"设工学堂，自绘图纸"
 LYY_Event.9013.b:"重金礼聘外邦匠师"
 LYY_Event.9014.t:"使船出海先亮账"
 LYY_Event.9014.d:"战后头一批使节出海，舟中不载厚礼，惟载账册与税则，箱重而人轻。凝光送于码头，谓领使曰：「先使人看清我如何算账，再与之言买卖。」有幕僚以为此态太硬，恐失远人之欢。凝光曰：「先亮账本者，方配言信。」幕僚默然。\n使船离港之日，码头空荡，惟灯塔一盏尚明。领使在舱中翻阅税则，翻至卷角起毛，一夜未合眼。舟人夜起汲水，见舱中灯影摇动，归语其伴曰：「此人不是在读册，是在背册。」\n比至彼国，彼国主事者索礼，领使曰：「礼在册中。」取册示之，一页一页讲，讲至第三日，彼乃具酒。酒间彼问：「此册可留否。」领使曰：「可留，惟须回执一纸。」回执至日，凝光取视，见其上只画一印，无字。乃笑曰：「此国亦懂留白。」命以此纸附于税则之后，同藏一匣，匣上题曰：「无字之信。」账册以皮为函，函上印璃月港商会印，印文端方，边有缺口。"
 LYY_Event.9014.a:"先亮账本，再谈买卖"
 LYY_Event.9014.b:"厚礼开道，先结善缘"
 LYY_Event.9015.t:"风车图样换税则"
 LYY_Event.9015.d:"蒙德使节至，携风车图样一轴，酒两桶。初见不谈兵，不谈界，但以图样铺案，指其轮曰：「此轮一转，可代十人之力。」\n凝光与之对坐一夜，烛三易。所签头一份文书，非盟约，乃税率互认之清单。既签，凝光推酒杯于案侧，曰：「汝辈不靠神明而立，我辈亦方学不靠，余者当以数目相语。」\n使者举杯问：「若数目不合，当如何。」凝光曰：「则再算。」使者曰：「若再不合。」凝光曰：「则改数，不改约。」使者大笑，饮而不劝。临别留一语：「不靠神明者，亦当学不靠他人而活。」凝光送至阶下，未答，归而语左右曰：「此语当记。」翼日命人取风车图样一副，悬于工学堂壁间，题曰：「他山之轮。」税则既行，蒙德酒入港，价减三成，市人争买。有酒肆主人以璃月瓷换其桶，两相称量，皆以为平。图样以厚纸卷，卷以布裹，解时须缓，防其裂，存璃月港商会。"
 LYY_Event.9015.a:"签互市清单，平等往来"
 LYY_Event.9015.b:"缔结攻守，共御外敌"
 LYY_Event.9016.t:"雷雨夜稻妻船到"
 LYY_Event.9016.d:"稻妻使船于雷雨中泊港，樯折其半，帆裂如絮。港吏踌躇，以旧年封港之怨为辞，请拒之门外。凝光曰：「锁国者，所锁从来只锁门那一家。」命开泊位。\n两国之船头一回并排系缆。雨打篷背，声如万豆，水手皆伏于舱。有一老水手伏舷而望，望之甚久，语其徒曰：「此雨耐看。」徒问何故。老水手曰：「两船并列，才看得见。」\n舟中一少年水手，以绳系两舷之间，结法甚巧。稻妻舟人隔水观之，亦以绳结相答，两结相同，众人皆笑。雨止，天开一线。老水手拍缆桩三下，如拍故人肩背。稻妻船上有人以生硬官话问：「此处可久泊否。」港吏回头看凝光，凝光不答，但以手指海。自是稻妻船岁至，港中添一泊位，名曰雷泊。守泊老卒每值雨夜，必出而视缆，视毕乃归。雷泊之名，后书于港图，字与他泊同大。船泊于璃月港东，樯折其半，帆裂，以绳缚之。"
 LYY_Event.9016.a:"并肩停靠，共守航路"
 LYY_Event.9016.b:"划界而治，各不相扰"
 LYY_Event.9017.t:"书归众人同钤印"
 LYY_Event.9017.d:"须弥学者载书数十箱，图样盈车，入城而求馆舍。凝光腾账学馆之半以居之，设榻，给灯油，不索其书。\n书既入馆，乃命于每册扉页同钤一印，文曰书归众人。学者见之不悦，曰：「此吾半生所聚。」凝光答：「汝所教于璃月者，不当只教璃月之官。」学者默然半晌，末乃自取印补钤一枚，钤毕举印视之，曰：「此印吾认得，乃吾物。」\n馆吏请编目，学者自任其事，日录十册，录至夜深，指上沾朱，灯下看去，如带血痕。月余目成，借阅者无须具保，惟书名于簿。头一个借书者，乃一磨刀匠，借去一册讲矿石。还书时书角微卷，内夹纸条一张，上书：「此页所言之石，我见过。」学者取纸条视之，夹回原页，不弃。其后须弥又来书，求借璃月农书数种，凝光许之，惟嘱：「抄者留名，勿署官衔。」书箱三十自须弥来，至璃月港启封，箱以杉木，上墨书国名。"
 LYY_Event.9017.a:"典籍归众人，公开誊抄"
 LYY_Event.9017.b:"典籍入官库，择人传授"
 LYY_Event.9018.t:"枫丹法典对章程"
 LYY_Event.9018.d:"枫丹使者摊法典一部于长案，厚可盈尺。凝光读之一夜，烛尽二支。翼日携自家章程赴会，与使者逐条比对，凡有异同，各注于侧。使者问：「贵邦之章程，何以简略至此。」凝光曰：「法不嫌多，只怕只许一人念。」使者不能答，俯首复读。\n议至三日，两国互换判词范本，各持一份而归，无一人吃亏。散会时使者叹曰：「璃月人算账，比我所料更硬。」凝光曰：「算得硬，方谈得久。」\n使者登舟，于舱中取范本读之，读至末页，忽命舟人回棹，再登岸，索一份璃月章程副本，曰：「此物当置我案头。」吏问其故，曰：「我要看简略者如何不漏。」范本既行，璃月判词渐有定式：先列事实，次引条，末书判者之名。有吏嫌其烦，凝光曰：「名在上头，人才肯细看下文。」使者去后，璃月亦取枫丹判词数篇，译而悬之。观者不解其字，而聚观不散。枫丹法典十二卷陈于璃月港使馆，皮面镀金，金磨去大半，边角起毛。"
 LYY_Event.9018.a:"互换判词，互鉴其法"
 LYY_Event.9018.b:"自定家法，不采外例"
 LYY_Event.9019.t:"万国商展凭抽签"
 LYY_Event.9019.d:"万国商展张于旧税关空场，各国货栈排作三行，旗帜相望。开幕之日，凝光不至，不剪彩，不致辞，惟遣一吏持签筒入场，令各国掌事自抽摊位。\n或问曰：「最旺之位，何不留给璃月商号。」凝光曰：「展场者，示人者也，非为自家人捧场。今年让出一寸，明年别人才肯让一尺。」抽签之时，众目睽睽。一外国掌事抽得末位，视签而笑。或问其何笑，曰：「吾抽得末位，而无人替吾换。」\n是日场中交易至夜不散。掌灯者添油三次，末一次添毕，见璃月商号之摊已空，摊主皆往他国栈中看货。一老商归而语其子曰：「此会不赚，然明年之会，人皆愿与吾同场。」\n次年展会，他国掌事自请增位，曰：「璃月让位而不争，吾辈亦当让。」凝光闻之，命人记于簿，不使人知。展场既毕，签筒存于商会，筒上以刀刻一行：「此筒无主。」展场在璃月港旧税关空场，场以石铺，石缝生草，草高寸许。"
 LYY_Event.9019.a:"掣签分席，列国同筵"
 LYY_Event.9019.b:"优位留给本国商号"
 LYY_Event.9020.t:"旧礁图上补暗礁"
 LYY_Event.9020.d:"南十字旧航道封多年，礁图过时，暗礁移位，舟人但凭口传。凝光遣人重测水线，又请老舵手数人同往，皆白发，行步需人扶。\n有幕僚言：「此线绕远，一年所得，不足偿测费。」凝光展旧礁图于案，曰：「有些路须留之，正为教人知，这座城还敢往外看。」幕僚不复言。\n老舵手围案而坐，各出记忆，一笔一笔补其暗礁，有争者，争至面红，乃取酒以定。图成，凡补礁百余处，墨色深浅不一，如老树之年轮。一舵手抚图曰：「此图成，我辈可死矣。」凝光闻之，命人另摹一份，题其名曰：「老眼图。」图藏于船会，凡出此道者，先观此图，观毕须于册上画押，画押者已数百。新图既用，舟行此道者，一年未闻触礁。有老舵手死，葬于海口，墓前无碑，惟插一木，刻其名与所补礁数。礁图旧而残，补以新纸，纸色白，旧纸色黄。"
 LYY_Event.9020.a:"重测水线，重开航道"
 LYY_Event.9020.b:"封存旧图，不复远航"
 LYY_Event.9021.t:"香案前留一空盘"
 LYY_Event.9021.d:"帝君神位空悬，凝光不撤香案。案上香炉犹在，烛台犹在，惟于案前置空托盘一只，铜色微暗。议会众议其事，有言当撤者，有言当祀者。凝光曰：「昔者举事，必先问一句神之颜色；今盘空在此，正好教人看清，自家账算得正不正。」语毕，堂中无声。\n自是每遇大事，香案之前必留此盘。有次一小吏随手置铜钱一枚于盘中，老掌事见之，取钱还之，曰：「此盘不纳钱。」小吏问：「纳何物。」老掌事曰：「纳事。」\n岁久，盘底生一层薄绿，拭之不去，人亦不复拭。新入议会者初见之，多问此盘何用，老者但曰：「坐。」问者坐下，视盘，不复问。有外邦客问此盘之制，译者不能答，凝光自曰：「此盘无制，惟有主。」客问主为谁，曰：「坐此堂者。」客视盘良久，曰：「此盘空而得体。」后有新吏欲易新盘，老掌事不许，曰：「旧盘有主，新盘无。」璃月港商会之盘为铜制，径尺许，盘底有旧刻一圈，刻痕浅。"
 LYY_Event.9021.a:"空盘置于坛前，自省其位"
 LYY_Event.9021.b:"请人入座，另立共主"
 LYY_Event.9022.t:"神谕编册注真伪"
 LYY_Event.9022.d:"凝光命人取历年神谕、天象、谶纬之属，尽数编次成册，逐条注明出处，并注真伪。所遣者皆老吏，初以为寻常文牍。\n既查，愈查愈惊。有一条神谕，见于三处记载，而三处年月各异；有一谶语，原出市井歌谣，后乃录入官册。吏执卷请曰：「此条若注伪，恐干众怒。」凝光曰：「注之。」是册既成，卷尾有凝光手书一行：「吾辈所留者，非一部神书，乃一部后人能自判断之书。」\n册置账学馆最显之架，翻阅者众，书脊先坏。不知何人以炭笔于脊上写二字：「凭据。」字迹歪斜，无人擦去。有老吏每过其架，必以手按册脊，按之即行。册成之后，议会凡引神谕者，须先诵其注。有老臣诵至伪字，声渐低，终乃不言，众亦不问。此后议场之上，神谕二字渐少，而人事二字渐多。书吏抄册，凡遇伪字，笔下必重一分，似恐其字复生。册以皮为函，函上题神谕二字，字为老吏手书，藏玉京台。"
 LYY_Event.9022.a:"整理神谕，留册后人"
 LYY_Event.9022.b:"焚毁旧典，重立新说"
 LYY_Event.9023.t:"层岩闸门落到底"
 LYY_Event.9023.d:"层岩裂缝又封一遍，此次用新铸合金，兼以双股绳，绳粗如臂。凝光亲下井口，随行者数人，皆执灯。井道愈下愈暗，水气浸衣。及至底，监工请其退，不许。最后一段闸门落定，声闷而长，石屑自顶撒落，落于众人肩上，无一人动。\n凝光抚闸面曰：「巨渊乃一笔按月须还之旧债。今日多还一分，后人便少赌一次命。」井口工人闻之，齐直其腰，向闸而立，立之甚久。\n上升降梯时，谁亦不言。将至井口，一少年工忽曰：「方才我听见闸门底下有回声。」监工问：「何声。」少年曰：「像水。」众皆默。既出井，各解绳，绳上皆沾黑泥，掷于筐中，声沉。闸门之上铸一行小字，记合金之数、绳之长、匠之名。工人每过必读，读至匠名，多停一步。有匠自外乡来，见己名在焉，抚之而泣。闸以合金铸，重数千斤，落下时声闷，井口震动。"
 LYY_Event.9023.a:"铸新闸，亲下井口"
 LYY_Event.9023.b:"循旧法，勉力维持"
 LYY_Event.9024.t:"天空岛久不回音"
 LYY_Event.9024.d:"凝光差人取历次祈天、观星、卜筮之录，并置一室，逐条比对。凡有所祈，皆记其日；凡无所应，亦记其日。比对既久，乃见一理：回音一次轻于一次，先如钟，继如鼓，末如叩壁。最后一录，空无一字，惟书年月。\n众请焚香再祈，凝光不许，取笔批于册上曰：「彼不言，我辈便当彼不在。」批毕，笔搁案上，墨未干，风入窗，纸微动。\n此语后抄入议会备忘，为往后诸事之例。有少吏私问老吏：此语妥否。老吏曰：「妥否，写着写着便知。」少吏乃不复问，自取一册，抄而藏之。藏册之匣无锁，然终无人启。此后祈天之事遂稀。礼官请定仪注，凝光曰：「仪注可存，香火可减。」礼官退，取旧仪注置之高阁，阁中尘厚，无人拂，惟每年一开，晒书一日，仍旧合上。阁中旧仪注，后为虫蛀，角缺数页，亦无人补。阁在群玉阁上层，窗向北，可望云海，云海终年不散。"
 LYY_Event.9024.a:"记下沉默，当作不在"
 LYY_Event.9024.b:"复遣祈天，以问吉凶"
 LYY_Event.9025.t:"问天路空手而还"
 LYY_Event.9025.d:"通天空岛之路，久无人应。凝光仍遣使，赍书一封。书中所问只二事：若天理犹在，请现身一谈；若不在，请容我辈自走。使节去三月，归时两手空空。问其故，曰：「至其所，门在，无守者，亦无闭者。」呼之无应，候之无至，遂置书于阶而返。\n同行者一人病于道，使节留三日，待其能行，故归迟一月。凝光闻之，不问书，先问病者。使节愕然，答曰：「已愈。」凝光取其回执，批二字：「已知。」命以空函入档，置于头一格。放档之吏问：「此函空白，可另作记号否。」凝光曰：「不必。」空白即是记号。\n吏退，行至门口，回顾那一格，见众函皆满，惟此一格轻。使节后迁他职，临行请曰：「此书可存否。」凝光曰：「存。」使节曰：「既无回音，存之何用。」凝光曰：「正为无回音，故存。」空函之匣，岁久生霉，掌档者欲易新匣，凝光曰：「匣亦旧物，留之。」云来海之路在云海之上，旧籍所载惟浮岛与无名之阶。"
 LYY_Event.9025.a:"遣使问天，如实回报"
 LYY_Event.9025.b:"不问不答，各行其是"
 LYY_Event.9026.t:"门楣新刻一行字"
 LYY_Event.9026.d:"神之眼、仙人、天授之论，议会争数月不决，堂上拍案者屡有。凝光末后一言而止众：璃月往后谁执其柄，不看位之高下，只看理之曲直。众请著为令。凝光曰：「不必著令，刻在门楣上。」\n石匠受命，凿三日。字不甚工，横平而竖略斜。有言当另择善书者重刻，众议良久，无人肯任其事，遂不复改。\n一老石匠每日入厅，必抬头一视，如视新碑。刻成之日，取凿拭净，收于箱底，语其徒曰：「此箱中物，往后不必再取。」徒问何故。曰：「字已在门上，凿可休矣。」后有小儿过门，仰问其母：此上何字。其母一字一字读之，读毕，小儿复读一遍，乃去。后十余年，门楣之上添刻一行小字，记刻字之年与石匠之名。字更小，须近前乃见。石匠之徒后亦刻碑于野，必先问一句：「此字可任人读否。」问毕乃凿。璃月港石匠刻字先以墨书，书毕请人读，读通方凿。"
 LYY_Event.9026.a:"门楣刻字，理在其先"
 LYY_Event.9026.b:"不刻一字，行胜于言"
 LYY_Event.9027.t:"港防营换旗不改饷"
 LYY_Event.9027.d:"新军改号港防营，饷照旧例，惟旗别换。检阅之日，凝光登台，不披甲，不带剑，身后无仪仗。旗下千人列阵，鸦雀无声。凝光曰：「此军旧日之规，是不退；今日之规，是知自己护着谁。」语毕，台下静良久，风吹旗角，拍拍作响。\n继而口号起，与旧日不同，声先散而后合。有一年少兵喊毕，以袖拭目，动作极快，为旁列老兵以肘轻撞。老兵不言，解腰间水囊递之。少年不受，老兵以囊按其手，转身归列。\n收操后，台上旗未收。掌旗者请收，凝光曰：「留一夜。」是夜巡营者过旗下，见旗影投地，长及数丈，立而视之，视毕乃行。翼日营中操练，口令换作三句：「护港，护民，护己。」教者每喊一句，众应一声，声不齐而甚响。有老卒私下曰：「第三句昔所无。」新旗之上无纹，惟一片素色，远望如云。璃月港新旗无纹，惟一片素色，布厚，风展则平。"
 LYY_Event.9027.a:"改旗易号，叫港防营"
 LYY_Event.9027.b:"军制照旧，只换将校"
 LYY_Event.9028.t:"遇险先救人后论货"
 LYY_Event.9028.d:"巡防船队沿商路往复，不为争雄，惟使挂璃月旗者得归。凝光于训令之后添一条：遇商船遇险，先救人，再论货。有僚属笑为多事，曰：「救人之费，谁偿。」凝光曰：「能将货卖到天涯者，亦当有本事将家守到天涯。」僚属不能对。\n头一回救起别国之船，是一夜大风。彼船触礁，桅断，人抱木板浮于浪间。巡防船侧舷而近，抛绳七次，方得一绳系牢，救上者十余人，冻不能言。\n被救之人登岸后，取船头之旗叠好，双手送还，曰：「此旗我不敢再挂。」船长受之，另以一囊淡水、一包干粮赠之，曰：「路远。」其人捧物，行三步一回顾，末乃跪于码头。船长扶之不起，遂亦跪，两人对跪于石上，众皆无言。此后各国商船遇风，多愿傍璃月船而行。船长每归，必于册上记救者之数，册名海活。商路自港口出，绕孤云阁，至云来海深处，风大浪急。"
 LYY_Event.9028.a:"先救其人，后论其货"
 LYY_Event.9028.b:"护货为急，速返其航"
 LYY_Event.9029.t:"南疆戍卒自画山"
 LYY_Event.9029.d:"南疆戍卫队募本地山民与猎户，不试弓马，先试认路。凝光所下头一条令曰：「哪条道可走骡马，哪处崖可藏人，皆须记之，不须背兵书。」有军校不以为然，谓不习阵法，何以御敌。凝光曰：「守土之人，先须懂这片土。」军校退。\n半年之后，此队自画山川图一幅，较官图更细：某溪旱季即断，某壑雨后成潭，某石下有泉，某树可系舟。图呈上时，凝光展视良久，命账房照抄三份，一给户部，一给工部，一给船队。\n抄至第三份，抄者问：「图中标注太多，抄不完。」凝光曰：「抄不完，便慢慢抄。此图往后还要添。」图既行，船队一人按图寻泉，果得水，归而语众曰：「此图上之字，乃以脚写成。此图岁一修。凡有戍卒死，其名附于所守之处，图上朱点渐多，官图无之。」官图与戍图并悬，吏指其异处，主事者曰：「此异处，即我辈之短。」孤云阁戍图以厚纸绘，山以墨，路以朱，崖以短横线。"
 LYY_Event.9029.a:"就地募人，先取识山者"
 LYY_Event.9029.b:"调他处精锐，从严整训"
 LYY_Event.9030.t:"枪口抬高只一寸"
 LYY_Event.9030.d:"团练不复为征来凑数之人，乃各坊各号登记在册之护丁，有名，有籍，有操。操练课目中添一条：先学如何不误伤自己人。有新兵不解，问：「枪向敌，何须学此。」老兵不言，但以其枪口轻轻抬起一寸，令其视之。新兵视之良久，忽悟，面赤而退。\n凝光临场观操，语众曰：「上过阵者方知，最难者，枪口抬高一寸。」众皆记之。此语后抄入操典头一页，纸角磨得极旧，似被人反复翻过。有掌书者欲换新页，为老教头所止，曰：「旧页上有手汗，换之则无。」\n教场之后立一木靶，靶上弹孔皆在其肩、其股，无一处中心。新兵问故，老教头曰：「此靶所拟者，邻家之子。其后团练出城剿盗，枪伤三人，无一人误中同行。」归时队长取操典示众，指第一页，众皆点头。操典之末附一图，画三人持枪，枪口皆高一线，图无名。玉京台操典附图画三人，持枪并列，枪口各高一线，图无名。"
 LYY_Event.9030.a:"操典首条，慎伤己人"
 LYY_Event.9030.b:"先杀敌，不拘细目"
 LYY_Event.9031.t:"小楼挂出审事牌"
 LYY_Event.9031.d:"海事法庭设于码头边小楼，门前不置石狮，不悬匾额，只挂一木牌，书开审时辰。牌为旧船板所改，上有钉孔三。头一案，两家船行争一泊位。凝光不亲裁，命以判词之权，交三位素不相识之行首共署。\n一行首执笔，久不能下，曰：「我从未判过案。」凝光曰：「正因未判过，此一判才值钱。」行首乃书，书毕，手心尽汗，以袖拭之。案审三日。判下之日，失位者当堂拱手，曰：「输得明白。」旁听者挤至门外，有一老妇卖茶于阶下，三日之间，茶价未涨。\n越月，木牌之下添一小木匣，上书：「有冤者投书。」匣初空，半月而满，掌匣者每日以秤称之，记其轻重。是年此庭审案百余，判词皆悬于门外三日。有讼者读判词而自止，不复告。掌庭者曰：「此数胜于判十案。」木牌日晒雨淋，字渐淡。掌庭者不重书，曰：「淡亦认得。」小楼在璃月港码头边，楼上下七间，窗临市声，卖鱼者呼。"
 LYY_Event.9031.a:"判词由行首共署"
 LYY_Event.9031.b:"庭上亲裁，速结此案"
 LYY_Event.9032.t:"兵器刻名挂厂门"
 LYY_Event.9032.d:"兵工厂自港口迁入山坳，炉大而道近，产量倍于旧日。附近村落亦渐富，卖饭者、补鞋者、贩炭者，皆聚于厂外。凝光定一规：厂中所出兵器，每一件皆刻工匠之名。有匠以为辱，曰：「器有瑕，则名随器传。」凝光曰：「正为此。」有人认领之物，方不敢随便杀人。\n头一件刻名之枪，悬于厂门示众。匠人日过其下，必停一步。或问其视何物。曰：「视我名刻得正不正。」月余，枪下积土一层。有少年学徒以指拭其刻痕，拭毕，回炉取铁，另打一件。旁人问其何故。曰：「我那件刻得歪。」\n督工者闻之，取此语记于册，岁终呈览，册上此条旁有朱笔一圈。岁终核器，凡有刻名者，损折之数少于无名者三成。凝光取此数示厂中，不置评。众自视其名，亦自视其数。后有一枪流于市，买者视其刻名，问匠为谁，卖者不能答，遂不买。厂在黑岩厂山坳，炉大而道近，烟自崖顶出，远望如云。"
 LYY_Event.9032.a:"兵器皆刻工匠之名"
 LYY_Event.9032.b:"兵器只标官厂之号"
 LYY_Event.9033.t:"重开门听三日争"
 LYY_Event.9033.d:"新秤既立，向哪头加码，遂成难题。凝光命开议事厅之门，凡愿言者皆入，不问出身。三日之间，堂上人或百数，或三五人，来者不拒，去者不追。有渔妇抱儿入，言鱼税之苦；有书吏持册入，言公文之繁；亦有醉汉入，言三句而卧于阶。\n三日之后，案上纸堆半人高，争论未止。执事请裁，凝光视纸堆曰：「吵不尽最好。」吵尽者，才是真无人敢开口。厅中灯三日未熄。扫厅老仆每日清晨扫出纸屑小半筐，倾于后院，积成一堆。有人取一纸展看，乃是无名者所书一行：「我也有话。」\n老仆见此纸，不敢扫，以石压之，置于廊下。翼日纸不见，石犹在。其所议者，后定为数条，多半琐细：市集散时、灯油之价、粪夫之界。而市中怨声遂减。或问其故，曰：「有话可说处，人便不必闹。」璃月港议堂门不闭，门槛磨凹，三日之间，入者以千计。"
 LYY_Event.9033.a:"开三日门，尽听其言"
 LYY_Event.9033.b:"择人而听，速定大计"
 LYY_Event.9034.t:"老绅掷盏碎阶前"
 LYY_Event.9034.d:"自由通商之文，最难写处不在利，在义务。凝光删改再三，于头一条书曰：「凡在本港经营者，无论贵贱贫富，皆同守一法。」会读之日，有老士绅闻之，掷茶盏于地，盏碎，茶溅于邻座衣上。满堂寂然。老士绅曰：「此非约，此是夺。」凝光不怒，俟其言毕，方曰：「夺者，夺旧日之免。」\n无人应声。有数人默然取副本，卷而藏于袖。老士绅拂衣而出，至门口，足为一碎盏所碍，乃以杖拨之，杖亦坠地。\n此后每逢争执，辄有人取此章出，摊于案上，如取尺量布。那碎盏之片，为一少吏所拾，藏其一角于笔筒中，曰：「留以自警。」越数年，少吏迁官，笔筒犹在案上。宪章既行，港中牙行先改：凡抽佣，须书于契；不书者，讼则败。月余，牙行之数减其半。老士绅后亦取副本一纸，置于案，未读。家人问其故，曰：「留着，看他能行几年。」玉京台茶盏为旧瓷，色青，碎时声脆，碎片扫入簸箕。"
 LYY_Event.9034.a:"颁自由通商之章"
 LYY_Event.9034.b:"缓议通商，先安士绅"
 LYY_Event.9035.t:"律台移出议堂"
 LYY_Event.9035.d:"法司迁出议事厅，移至临街小楼。楼旧，梯窄，墙有雨痕。凝光亲取四字刻于石阶：民可问官。刻毕，命撤门前石狮，置长凳二条，为候审者坐。有老吏言：「法院设于衙中，则终为衙中之家法；今移于街，或可为百姓之靠。」凝光曰：「正为此。」\n头一日，一农人著旧鞋，立于阶下，行而复止者三。门吏见状，不催不问，但引其入，指座令坐。农人坐定，手犹握斗笠不释。问其来意，曰：「为邻家占我一垄田。」判毕，农人出门，立于街上，仰视门楣，久乃去。\n翼日复来，携新麦一斗，置于阶。门吏不受，农人曰：「此非谢官，谢此阶。」遂置而去。门吏追之不及，乃以麦供于堂侧。此后凡新官至，必先立阶下读四字一遍，而后入门。有不读者，门吏请其再读。小楼之灯，自此夜夜不熄，街市之人指之曰：「那盏乃衙门之灯。」璃月港小楼临街，梯窄，墙有雨痕，痕自檐下至地。"
 LYY_Event.9035.a:"法司迁街，民可问官"
 LYY_Event.9035.b:"法司仍设衙门，维持官威"
 LYY_Event.9036.t:"八区八音议一港"
 LYY_Event.9036.d:"商埠议会头一次开会，八区之人以八种口音争一日。语急者拍案，语缓者冷笑。凝光坐末排，自始至终一句未插。\n散会时或问曰：「何不主持。」凝光笑曰：「吾一开口，众人所看者，便是吾之面色，而非对面那人道理。」如此之会，开亦如未开。问者怔然，转身而去。翼日复会，其人坐于自己位上，一开口，即有三人反驳。其人愕然，乃俯首取笔，记录驳者之言。\n是日议至暮，定下泊位税一条，字句粗糙，而八区皆无异议。掌书记者誊清时，于末页留白半行，曰：「此下或有后议。」越三月，此会自定规约十二条，无一条请凝光裁可。凝光闻之，命人取副本一份，置案头，不批一字。\n其后议会定例：主事者不入辩，辩毕乃决。凝光闻之，命人去其座前茶案，曰：「此案挡人。」璃月港八区之人各带乡音，议事时须有人转述，转述者三人轮换。"
 LYY_Event.9036.a:"商埠议会，分区对决"
 LYY_Event.9036.b:"号令归一，息其纷争"
 LYY_Event.9037.t:"账房携算盘入仓"
 LYY_Event.9037.d:"公账公开之日，码头边架巨板一面，长二丈，逐笔书每枚摩拉之来去，字大如钱，远立可读。一账房携算盘至，自辰至夜，逐行核之。算珠之声，与潮声相间。核至深夜，未得漏洞，乃收算盘，悻悻而去。行数步，复回，取灯照板角一行小字，照毕方去。\n凝光立远处观之，不近，亦不言。左右问：「可要遣人问其所得。」凝光曰：「不必。我所惧者，从来非有人查出，乃有一日无人肯查。」散场时，板犹未撤。凝光独行至板前，视最末一笔，是一笔修堤之费。视毕，以手抚其字，如抚石。\n翼日板前无人。第三日又来二人，各携算盘，相视一笑，各据一端，核至日中。此后巨板月易一次，所书之数渐多，字渐小。观者不复如初之众，而核账者岁有其人。有小儿随父观板，问：「此上何字。」父曰：「数。」小儿曰：「数有何用。」父曰：「教人不敢乱。」璃月港巨板以整木为之，长二丈，墨书细字，字大如钱。"
 LYY_Event.9037.a:"公账全部公开"
 LYY_Event.9037.b:"惟公无关紧要之账"
 LYY_Event.9038.t:"老掌事举牌不语"
 LYY_Event.9038.d:"废专营之令既下，数十年行会壁垒，一朝而塌。老掌事十余人，举木牌立于商会门前，牌上大书传统二字，自晨至暮，不移一步。凝光在楼上窗前视之，不动声色。左右请遣人驱散，不许。\n她但忆当年：有多少新匠之手艺，便是被这两个字攥死于门内。有巧匠能以三分料成一器，而无籍不得入行，终老于巷口修锅。思至此，取卷批之，笔不停。\n至暮，牌收，人散，阶下惟余数片纸屑。翼日，铺中多新招牌十数面，漆气未干。有老掌事过而视之，视久之，曰：「写得倒好。其后一月，市中器价略降，而器质不损。」主妇买锅，以指叩之，声清者取去。老掌事之铺亦换新牌，字为其孙所书。老掌事之孙后为行首，主一坊之市。尝语人曰：「祖以牌守门，我以门迎人。」牌既收，有人拾其一，劈为柴。烧时火甚旺，主人曰：「倒是好木。」牌为杉木，墨书传统二字，墨浓，边有流痕，悬璃月港商会门。"
 LYY_Event.9038.a:"断废行会专营"
 LYY_Event.9038.b:"暂留专营，安抚旧商"
 LYY_Event.9039.t:"律学馆请讼棍讲"
 LYY_Event.9039.d:"律学馆开于旧日讼师宅之侧，两门只隔一墙。墙薄，彼宅咳嗽之声可闻。凝光所请讲者，有退职判官，有老账房，亦有数人名不甚佳之讼棍。有士人上书争之，谓讼棍不当登堂。凝光答曰：「使百姓知法，是使其知法可执于手而用，非供于案而拜。」\n讼棍登堂之日，堂下窃语。其人著旧袍，袖口磨白，开口先讲一事：某年我替人写一契，一字之差，害其破家。讲毕，堂中无声。课罢，其人以讲稿留馆，曰：「留与下一届抄。」馆吏视稿，见其上朱笔改处甚多，末页有一行：「此条我亦未做对。」\n翌日，隔墙旧宅有人叩门，乃一老妇，持旧契一纸，请其看。其人看毕，曰：「此契可翻。」妇人问：「要钱几许。」曰：「今不受钱。此后馆中授课，座无虚席。」听者多市井，有卖鱼者、有纤夫、有替人守夜者，皆携纸笔。馆在璃月港旧讼师宅侧，两门隔一墙，墙薄，咳声可闻。"
 LYY_Event.9039.a:"广设律学，教民知法"
 LYY_Event.9039.b:"律不外传，官权自持"
 LYY_Event.9040.t:"约末写明还政期"
 LYY_Event.9040.d:"宪政港约成，以港、市、坊、田之权责，一一著为明文。议至末条，乃还政之期。有议员进言：「此条可留活口，书某年之后，某时之宜。」凝光摇首，提笔径书某年某月，字大而直，无回旋之地。\n议员复言：「万一事有不济。」凝光曰：「为自己留后路者，不配一城之信。」语毕，堂中无语，惟闻笔搁于案之声。\n按印之日，群玉阁落细雨。台下立者数百，无一人言。凝光取印，举而复下者再，第三次乃按实。印成，雨忽密，侍者欲张伞，不许。散场后，有人在阶上拾得湿纸一角，上无一字。掌约者请藏正本，凝光曰：「藏于公库，副本悬于议事厅门内，任人观之。」约既悬门，观者日众。有老吏每日抄一行，抄毕校之，凡三月而毕，乃装成一册，藏于家。副本悬门，风雨损其角，掌约者请易，凝光曰：「损处亦须留着，使人见其年。」约悬于港门内侧，纸以浆粘，风雨损其角。"
 LYY_Event.9040.a:"书还政之期"
 LYY_Event.9040.b:"只定权责，不定限期"
 LYY_Event.9041.t:"门楣凿去临时字"
 LYY_Event.9041.d:"万国商埠之名挂上港门之日，凝光命石匠凿去门楣上临时二字。石匠受命，凿之甚轻，恐伤其旁字。凿毕，二字落于地，一完整，一断为二。有吏请弃之，凝光命收之入库，登记在册，曰：「此亦一物。」\n乃立门下，语左右曰：「我这一生，或只做成一件，使此城之门，由门内之人自定其对谁而开。」风自海上来，新漆之气吹之甚远，市中皆闻。有老匠在旁，闻之不语，取凿在手，以指试其刃，试毕收入箱中。或问：「此凿尚可用否。」曰：「可用，然不必再用。」\n是日过门者众，有挑夫驻足仰视，不识其字，问于旁人。旁人读之，挑夫点头，曰：「原来此处不叫临时。」入库之册，注其物曰：「旧门楣字二，一全一断。」掌库者问：「断者亦存。」曰：「存。」断者亦曾挂于门上。库中旧物渐多，掌库者请立目，凝光许之。目成，厚一寸。凿下之石屑以布包，收于玉京台库，库中旧物渐多。"
 LYY_Event.9041.a:"凿去临时二字，开万国商埠"
 LYY_Event.9041.b:"暂存临时之名分"
 LYY_Event.9042.t:"茶室一席定半港"
 LYY_Event.9042.d:"商会枢密无衙，无印，无仪仗，只在一间茶室议事。室中一桌，十余掌事围坐，茶三盏而换。一句尾音，一个眼色，便可定半座港口之命。某家船期之迟早，某埠货价之高低，皆于举盏之间定之。\n凝光坐主位，视此辈，忽觉其举止比官府更似官府：入座有次，发言有序，末位者不敢先言。由是乃悟：我未曾推翻旧序，只替旧序换一身更体面之衣裳。散后众去，她独留，取布拭桌，自一端至另一端，拭之甚缓。桌上余茶一圈，拭之不去，乃以指甲刮之。\n掌茶老仆入，见其犹在，欲收盏。凝光曰：「留一盏。」老仆退。盏中茶冷，浮叶沉底，她视之，未饮。其后商会定议事之规，凡涉一港之事，须有他埠之人在座。凝光曰：「无外人在，则此室自成一小国。此后凡有新入商会者，先于此室饮茶三盏，谓之识座。」有不识者，坐错一次，众不与言。室在璃月港商会二楼，窗对街市，楼下卖糖粥，粥香时上。"
 LYY_Event.9042.a:"以商会枢密总港政"
 LYY_Event.9042.b:"维持议事厅，纵其议政"
 LYY_Event.9043.t:"密账不宣积满柜"
 LYY_Event.9043.d:"密账不宣。天权要紧之数，自此只书于两三本不示人之册。凝光自谓此乃权宜之计，非定制。然册日积日厚，翻之亦难。初时一册可挟于腋，后乃须双手捧之。她比谁都清楚：一本不肯示人之账，本身即一份供状，只是少有人肯亲手写下己罪。\n有天夜里，取册出柜，置于案上，视之良久，烛花微爆。乃复放回柜底。放时手稍重，柜上落灰一层，扑起于灯前，如细雪。\n翼日有吏入室打扫，见柜面有指痕一道，拭之不去。吏问：「此柜可须开视。」凝光曰：「不必。」吏退至门，闻其在内言：「灰不必扫。」声低，吏几不闻。柜前之灰，终年不扫。\n有客问此柜所藏，凝光曰：「旧账。」客曰：「可借观否。」曰：「此账已了。」客不复问，归而语人曰：「彼云已了，而锁之。」柜底之册，后又添二本，共五本。五本之外，无人知其数。柜为铁力木，高三尺，柜门以铜扣，扣上有锁。"
 LYY_Event.9043.a:"密账不宣，事权独揽"
 LYY_Event.9043.b:"账目照旧公开"
 LYY_Event.9044.t:"双饷之兵认二主"
 LYY_Event.9044.d:"商团私兵成军，旗号各归其家，而号令出于同一茶室。兵领双饷，认二主，忠诚标价，明码而无讳。检阅之日，队伍齐整，甲械精于官军。凝光登台视之，忽忆刻晴所练之民兵，昔尝笑其褴褛。至是乃悟：以钱聚之兵，较以信聚之兵更听命，亦更易变。钱一停，枪口便转。\n检阅毕，命取点名册来，就灯下重翻一遍，翻至某页，以指甲轻划二名，默记于心。合册时，语左右曰：「此二人，异日或有用。」左右不解，亦不敢问。\n册中还夹一纸，乃领饷之收条，按满指印。凝光取纸视之，指印有大小，亦有斜者，如众人之手皆在其上。是年冬，一商团减饷，兵散者半。散兵入他团，携械而去，无人追。凝光闻之，独坐良久，乃命人核各团之饷册。点名册后藏于柜，柜上无锁。有吏打扫，见册在，不敢动，惟拭其尘。检阅之地在璃月港校场，场地平，四周以木栅，栅已旧。"
 LYY_Event.9044.a:"组建商团私兵"
 LYY_Event.9044.b:"兵权尽归港府"
 LYY_Event.9045.t:"关税壁垒立如墙"
 LYY_Event.9045.d:"关税壁垒一道复一道，立如城垣，外货皆阻于港外。库中积货山高，售之不出，而商人反拍手称快，盖所阻者多他人之货。凝光不阻，亦不禁，听其自为。\n惟于深夜独登楼看海。远处海面为壁垒所切，光灯数点，明暗不齐。风急，衣角翻卷，立至觉冷，乃转身下楼。梯级有声，一步一声。翼日清晨，复批新壁垒之请，字签得极快，无一笔迟滞。批毕取茶，茶已冷，仍饮之。左右视其色，不见喜怒。\n是月市上盐价涨三成，有小贩改售私盐，为关吏所获，枷于市口三日。凝光闻之，命释之，不加罪，亦不弛壁垒。壁垒之内，匠作渐盛，器亦渐粗。有老匠语其徒曰：「无人来比，手艺自退。」徒不信，三年乃信。信时，其铺已闭，改贩私货。壁垒既多，海面渐窄。有渔者言：「昔年一网可及远，今须绕三道。」凝光闻之，不答。榜文贴满璃月港栅门，栅门以铁条为格，格间可伸手。"
 LYY_Event.9045.a:"高筑关税壁垒"
 LYY_Event.9045.b:"维持自由关税"
 LYY_Event.9046.t:"晨妆对镜不识人"
 LYY_Event.9046.d:"商会至上之律既下，天权商会自议事之堂，变为发号之衙。律法须看商会颜色，官吏须经商会遴选，文书出入，皆先过其门。凝光行此路极稳，稳得无人能议。\n一日清晨对镜理妆，忽不识镜中之人：此下令者，是己耶，抑当年所憎之影耶。执梳停于鬓边，久之不动。窗外市声渐起，镜中人与之相视。良久，她不言，补妆至毕，乃出门。门开时，候于阶下者十余人齐低其首。她自其间行过，步履不乱。\n是夜归，命人取旧日一方青布衣裳来，置于案，视之，终未著。衣裳叠好，收于箱，箱上加锁。自此她每晨对镜，必先视片刻，然后理妆。侍者不敢问，惟多备一灯，置于镜侧。镜前灯常明，灯油耗于他室者倍。岁余，灯油不复添，灯尽则暗，她亦不问。暗中有声，乃梳落于台。妆台在室西，台上有梳一、匣一，匣中旧簪数支。"
 LYY_Event.9046.a:"立商会居上之律"
 LYY_Event.9046.b:"律法居商会之上"
 LYY_Event.9047.t:"权债以忠诚作抵"
 LYY_Event.9047.d:"权债者，一纸以忠诚为抵押之契。谁借此钱，谁便于下次表决时欠凝光一票。她以权力为账，做得极漂亮：借者有据，还者有期，息有定例，一笔一笔，皆可稽。然账之最可惧者，从来是有一日利滚利，至无人能还。至那时，收账者与欠账者，皆随此城俱沉。\n头一批权债到期之日，她未往收。独坐室中，取债册展于案，视其名一行一行，末乃以朱笔于册上画一圈，圈毕合册，不复言。掌库者问：「此圈何意。」曰：「记之而已。」\n是夜债册置于案，无人收之。次日掌库者入，见册在案，圈之墨已干，圈中一名，乃近日新进之议员。至期不还者三人，皆自来，请展期。凝光许之，不索息，惟令于册上自书一诺。三人书毕，皆有惭色。其一出门，立于阶上，久乃去。画圈之册，后藏于私箧，箧上无锁，亦无人开。契分三等，纸上以朱点别之，一点、二点、三点，存璃月港商会。"
 LYY_Event.9047.a:"以权债结盟诸家"
 LYY_Event.9047.b:"拒用权债，只凭法度"
 LYY_Event.9048.t:"港口不作抵押物"
 LYY_Event.9048.d:"北国密使往来，比商队更勤。不谈货，不谈价，只谈一纸可将全港租借出去之约。约中所许甚厚：金、械、煤、铁，皆可立至。凝光读之三遍，于末尾批曰：「生意可做，港口不作抵押。」\n密使冷然问：「可曾思其代价。」凝光曰：「已算，比你算得清。」密使不语，收约而起，行至门，回顾一视，乃去。是夜她独坐至烛尽，烛泪堆于台，如小丘。翼日命取此约，锁于最厚之柜，柜门贴纸条一张，书四字：「勿轻启。」\n此后三年，柜未再开。三年之后，柜吏易人，新吏问此柜何属，老吏曰：「不必问，锁着便是。」新吏以手推柜，不动，乃止。北国使者后岁岁来，岁岁携约，岁岁不得。末一年，使者不携约，惟赠一物：北地之铁一块，重三斤。凝光受之，置于柜上。北地铁一块，后置于铸币厂，与矿石同列，无人识其为礼。至冬密使携约至璃月港，以厚纸书，封以火漆，漆上压鹰纹。"
 LYY_Event.9048.a:"拒租港口，虚与委蛇"
 LYY_Event.9048.b:"签下合约，换取重建"
 LYY_Event.9049.t:"天权永固刻府门"
 LYY_Event.9049.d:"天权永固四字刻上府门之日，全城张灯。灯自港口排至山脚，孩童提灯而走，市人聚饮于街。凝光端坐最高处，视脚下万家灯火。鼓乐喧甚，人声如潮。\n而当最喧之一刻，她忽忆多年前彼初接商会账目、尚信数目可量一切之人。彼时灯不若此多，案上算盘亦不若此旧。众请致辞，她不起，惟举杯一示，众乃欢呼。散后命人于府门留一灯不熄，曰：「为夜归者照路。」掌灯者问：「留几时。」曰：「留到无人夜归之日。」\n是夜她下楼，不使人扶。行至府门，立灯下片刻，仰视四字，视毕，以手抚门，如抚旧案。灯留三年，掌灯者易二人。第三年灯油尽于夜半，火自灭。巡夜者见之，欲燃，止于阶前，终不入。天明报之，凝光曰：「不必燃。自此不复设灯。」府门四字，后又以金描一遍。描者老匠，描毕曰：「字重。」府门石额为青石，字以金描，描者老匠，手稳而缓。"
 LYY_Event.9049.a:"天权永固，抹去临时"
 LYY_Event.9049.b:"改回临时，定期还政"
 LYY_Event.9050.t:"玉衡回信附清册"
 LYY_Event.9050.d:"玉衡回信甚短：账我可以信你，人却不能。信后附八省人口清册一份，字迹工整，无一处涂改，显然亲手所录。凝光取册翻阅，一遍复一遍。至第七遍，指停于一处村落之名，其旁有小字注曰：「此村去年少七口。」\n乃语幕僚曰：「你瞧，肯骂我者，方真以我为事。骂亦不肯者，是早打算不理我矣。」幕僚欲言，见其神色，乃止。册收入手边第一抽屉。此抽屉自是不复上锁。有吏打扫，见屉半开，不敢合，问之。曰：「开着好。」\n月余，册角微卷，有人以纸条夹于其间，书一行：「此村今岁多三口。」凝光见之，未问谁书，只以指抚其字，抚毕仍夹原处。是年冬，八省清册复至，附一小札：前村今岁多三口，已书于册。凝光取旧册对之，见三名字皆在，乃圈之，注曰：「此三人，我未识。」清册以八行笺写，行间宽，无一字涂改，乃亲手所录。"
 LYY_Event.9050.a:"回信玉衡，坦诚相商"
 LYY_Event.9050.b:"以事论事，不予深交"
 LYY_Event.9051.t:"粮账细到一石米"
 LYY_Event.9051.d:"月海亭粮账至，细得连一石米之去路皆有批注：「某仓出，某船运，某坊领，某日散。」文末有一行：「你算得清金钱，我算得清米粮，两样加在一处，才勉强算得清一个璃月。」凝光视勉强二字甚久，指按其上，不移。忽觉平生所自负之账簿，在真正民生之前，薄得可怜。\n乃命人取粮账誊一份，钉于己账之前。此后翻账，先翻此份。有僚属问：「何以置于前。」曰：「先看人所食，再看人所税。」僚属退而记之，记于己册首页。\n是夜她自取算盘，以粮账所列重算一遍。算至午夜，数合，乃搁笔，曰：「数合，而理未合。自此月海亭之粮账，岁至四次。」凝光每至，必先读之，读毕乃读己账。有吏问：「此非越职。」曰：「不读人之食，何以定人之税。」吏不能对，退而抄其语。钉账之钉，后生锈，染纸一圈。她不换钉，曰：「此圈亦是账。」账以线装，钉以铁，钉生锈，染纸一圈。"
 LYY_Event.9051.a:"回信月海亭，共理粮政"
 LYY_Event.9051.b:"拒其插手，独掌财粮"
 LYY_Event.9052.t:"绝云间寄一片雪"
 LYY_Event.9052.d:"绝云间回信来得迟，亦冷。使者归，携一片雪，置匣中，行千里不化。附言只八字：「汝等之律，量不出雪山之重。」凝光取雪置于案头，视之一夜。烛移三次，雪未消。\n她一生衡量、定价、核算，凡物皆有其值：一斤铁，一石米，一条命。而此一片雪，无用处，无价钱，她竟从未为它留过位置。天亮时，她移雪至窗边，令天光先照之。雪在光中，微微发青。有吏入室请示，见案上一片雪，不敢言事，退立门侧，候其回首。\n既回首，问：「何事。」吏呈文书。她批毕，忽曰：「此雪若化，莫扫。」吏应之。雪终未化，留至夏初，乃不见。夏初雪不见，案上空留一湿痕，形状不圆。她命人以小碟覆之，碟上无字。此后案头常有此碟，客问，曰：「量不出者。」客不敢再问。碟中之痕，久则生微尘，她以指画之，画成一道，如水流。雪置匣中，行千里不化，匣为漆制，内衬以绢。"
 LYY_Event.9052.a:"尊重绝云间，另备一尺"
 LYY_Event.9052.b:"以律法强令仙家归附"
 LYY_Event.9053.t:"港外甲板设一席"
 LYY_Event.9053.d:"公子之船队泊于港外，甲板设一席。使者归报：「彼执行官不谈战，只谈秩序，谈得比商人更像商人。」凝光听毕，置茶盏于案，久之乃曰：「会做生意之敌，较只会打仗之敌更难与处。」左右问：「当如何。」曰：「备一份最厚之账册送去。」\n册送出前，她亲于扉页添一行：「先算账，再论敌友。」笔锋收处，墨稍积，乃以指抹平，指上留黑。使者行时问：「若彼收册而不复，如何。」凝光曰：「他必复。彼既好谈秩序，便不会受物而不答。」\n旬日，回函至，独一页，列数条诘问，皆指册中折耗。凝光读毕而笑，取笔逐条批之，批至末条，曰：「此人可用。此后彼常有书至，皆论市易，无一语及兵。」凝光亦答之，答必附账。两人未见面，而港中之事，多先定于纸上。左右问：「此为敌耶，为友耶。」曰：「为邻。」船泊璃月港外三里，潮落可见船底附螺，螺壳色青。"
 LYY_Event.9053.a:"以商人之道应公子"
 LYY_Event.9053.b:"以刀兵之法拒至冬"
 LYY_Event.9054.t:"沉玉谷回赠旧秤"
 LYY_Event.9054.d:"使者携账册一箱，上沉玉谷，欲以册证璃月港亦能算清山水之账。山路险，箱至半途，为雨所湿，一角霉起。蓝砚不接账册，只回赠藤编旧秤一杆。秤无刻度，提之则晃，悬物则倾。附言曰：「汝等之契，量不出水土之重。」\n凝光取秤端详良久，以指循其藤，循至一断处，乃知曾经修补。遂置案头，命左右：此物不许动。有回一小吏拂尘，误触而落，秤坠于地，藤散一节。凝光闻声而至，亲拾之，取绳重系，挂回原处，挂之甚正。系毕视之，曰：「歪。」乃复挂。\n自是每逢议及山水之事，她必先视此秤，视毕乃言。左右渐习，见其视秤，便不复催。秤既悬于案侧，凡有客至，见之必问。凝光答语不同，而意一：此物量不出，故不可不算。客多不解而去。秤悬案侧，藤色渐深。有人请以漆固之，不许，曰：「漆住则不见其断。」秤为藤编，无星无刻，提绳已磨断，以麻线续之。"
 LYY_Event.9054.a:"虚心受秤，另立水土之账"
 LYY_Event.9054.b:"斥其阻碍开发"
 LYY_Event.9055.t:"两本账并作一处"
 LYY_Event.9055.d:"璃月重归一秤之日，凝光取两本账并置案上：一本记商港之进出，一本记天授之去留。两册厚薄相若，封皮色异。自晨至暮，逐页合看。至一处，商港所记之数，恰与天授所记之数相抵；再翻一页，又相抵。乃掩卷而笑，笑罢复翻。\n末页空白处，书一行：「秤上两砣，今日方得同案而称。」写完合账，以手抚其封皮，如抚旧衣。窗外码头之灯一盏一盏亮起，自近及远，如有人重新描过整条海岸。她视之甚久，未起身。掌灯者入，见其犹坐，乃退。\n夜深，她取一秤置于两册之间，秤上空无一物，横梁自平。视之良久，曰：「空亦平。」是夜灯下，她取旧年第一本账，与今日之账并看。旧账字密而小，新账字疏而大。乃曰：「字大而事繁。」遂命人另取一册，从头录之，字须小。璃月港两册厚薄相若，一以皮为函，一以布为函，色各异。"
 LYY_Event.9055.a:"两账并陈，就此向前"
 LYY_Event.9055.b:"停下脚步，清算所有"
 LYY_Event.9056.t:"天权新约颁行日"
 LYY_Event.9056.d:"新约颁行之日，长案之侧坐满名字：「有当日之对头，有多年之主顾，亦有谁也不认之散号。」案上笔墨凡二十余副，皆新。凝光取全文读之，声不高，一字不遗。读毕，添一句：「此约之内，账目各清，互不相赖。」\n台下先静。有老者以杖拄地，点三点。继而掌声起，其中有甚生之物，乃终于可将心事摊开之松快。散场后，收笔墨之吏忽见每份约书之末，皆多一空格，备签而未曾签。问之。凝光曰：「留与人。」吏曰：「人已签矣。」凝光曰：「后来者。」\n是夜约书入库，掌库者数之，较人数多一份。问其故，凝光曰：「此一份留空，不签。」掌库者乃另置一格，格上题曰：「待。」约既行，港中牙契、船契、雇契，皆依其式。有老商取新契读之，读至互不相赖一句，曰：「此句可保十年。」空格之数，后成定例：凡约必留一空，谓之待来者。玉京台笔墨二十余副，列于案，案长三丈，以两案并成。"
 LYY_Event.9056.a:"邀众同席，共立新约"
 LYY_Event.9056.b:"只与盟好续订旧契"

 LYY_Spirit_New_Scale:"新秤惟称货"
 LYY_Spirit_New_Scale_desc:"旧秤一杆，官库所用，称货亦称人。称货者，取其重；称人者，取其分。有老人言：「昔者入官，先过此秤，秤低者退。」新秤既铸，惟有一盘，只容货物。铸成之日，舁旧秤至市心，当众折之。有老吏抚旧秤而泣，曰：「此秤随吾三十年。」主事者曰：「正为此故，今日折之。」折毕，以两段付炉，熔为砝码。是月，市中争讼少三之一，而吏部案牍反增，以其事皆归律法与账册也。旧秤之铜后铸为砝码，砝码之侧刻一行小字：归离原三年造。"
 LYY_Spirit_Open_Quay:"议价由两造"
 LYY_Spirit_Open_Quay_desc:"定价之权，官既还之于市，港上耳目为之一变。初月米价腾贵，民有怨言。二月他港之米闻风而至，价复平。老牙人语众，谓价高则米来，此理甚浅，然须有人肯信。或问若无人来如何。答以则吾辈输此千年之名。问者默然。是岁终，港课反增于旧，而牙行之数亦增。主事者取册视之，指新添诸行，曰：「此即所谓规矩。」牙行列于璃月港沿岸，门各挂牌，牌上刻行名与货类。"
 LYY_Spirit_Chasm_Rail:"车行巨渊底"
 LYY_Spirit_Chasm_Rail_desc:"轨既通，矿自渊出，粮自港入。向者渊口惟见担夫，今见车马。渊口立一碑，书开凿之年与死者之数，过者多不视，亦有驻足者。矿工携其子至碑前，指其上一名，谓此汝叔。子问叔何以死。父答以为运此矿。子又问今矿以车运，叔可无死乎。父良久不答，抚其子，曰：「可。」遂去。碑下有新土一撮，盖有人常来扫者。轨旁碎石中犹有琉璃晶砂，日下作五色，孩童拾之以为戏。"
 LYY_Spirit_Craft_Guild:"各守其艺不外传"
 LYY_Spirit_Craft_Guild_desc:"行会之掌事，不由官派，由匠自推。推之法：人各投一竹签于瓮，签上无名，惟画其技。唱名之日，瓮倾签出，众目共见。旧家子欲以其祖之名列首，众不许，谓签上无姓。其人怒而去，去而其徒留。掌事既立，第一令曰：「凡器，须经三人验；验者署名。」第二令曰：「凡技，须授徒，不得私藏。」二令既下，坊中灯较旧为多。行会堂中悬一旧图，绘黑岩厂初凿之状，图角题云氏之名。"
 LYY_Spirit_Teyvat_Commerce:"诸旗共一约"
 LYY_Spirit_Teyvat_Commerce_desc:"商约既立，凡二十余款，皆细碎：斗斛之大小，银钱之成色，货损之摊派，一一列之。有笑之者，谓此等小事亦须万国共议乎。主事者言小事不共议，则大事必相攻。未几，外邦商船以银成色不足见拒于市，其人持约至，指一款，谓此款许其以九成银易货。市吏验约，无以难之，乃受。其人归，语其国人，谓璃月之约细而可恃。约纸用荻花洲所出之韧皮，历水不烂，诸国皆识其纹。"
 LYY_Spirit_Chasm_Debt:"岁岁还渊债"
 LYY_Spirit_Chasm_Debt_desc:"港上岁计，必先列一项，名曰渊费。此项不在军饷，不在官俸，而在最末。主事者曰：「最末者，最不可省。」有新任度支欲削之，削三分之一，月余，渊下病者增，守者请增人。度支乃复其旧，且加一成。自是人不敢言削。有书吏问曰：「此费何时可已。」老度支曰：「渊不尽，费不已。」书吏乃记于册，记毕，墨未干而手已颤。渊费一项列于册末，墨色较淡，似后来添者，旁注层岩二字。"
 LYY_Spirit_Contract_Over_Oracle:"问契不问神"
 LYY_Spirit_Contract_Over_Oracle_desc:"凡大事，旧必先卜。卜者焚香，取龟，观其纹，纹吉则行。今则不然：主事者出纸一方，令诸君署名。老臣疑不卜而决，可乎。答以可。问何以知其吉。答以不知。老臣谓不知而行，危矣。主事者乃言：卜者亦不知，而其败无人任之；今署名者任其败，故其行必慎。老臣视纸良久，取笔署之，署毕，曰：「此纸比龟甲重。」旧卜之龟甲存于天后宫偏殿，裂纹纵横，无人再读。"
 LYY_Spirit_Harbor_Guard:"易退字为护"
 LYY_Spirit_Harbor_Guard_desc:"港防既立，其众半出于降卒。初入营，旧校多轻之。一日演武，令曰：「退者斩。」一卒进言，若退而可护百姓，亦斩乎。校不能答。主事者闻之，改令曰护民而退者不罪。令下，营中哗然，老校掷刀，谓如此则无军法矣。主事者问法者为谁而设。老校不能对。翼日，老校自请守最远之哨，曰：「吾试此新令。」港防营列于云来海岸，哨楼七座，相距各五里。"
 LYY_Spirit_Maritime_Court:"小楼挂牌审"
 LYY_Spirit_Maritime_Court_desc:"法庭设于码头之侧，一小楼，二层，楼梯甚窄。门上挂牌，书开审时辰，每易则以粉涂旧字，粉痕层叠。判者三人：一官，一行首，一老船主。判词成，三人共署；有不肯署者，则判不立，另审。有行首生平未署过一次，至第七案，乃署，署毕语人曰：「吾名在纸上，此后十年，人皆可指而问之。」自是，其议价较旧为平。庭外即南十字船队泊处，判词下时，桅上旗声可闻。"
 LYY_Spirit_Liyue_Arsenal:"一刀一署名"
 LYY_Spirit_Liyue_Arsenal_desc:"坊中旧规，器成不入名。新规既下，凡器必刻三字：匠之名。有匠不识字，请书吏代刻。书吏问刻何字。匠答以己名。书吏问其何用。匠谓不知，然监工云，无此三字，器不收。刻既毕，匠以指摩之，摩久，指腹生热。是夜其妻问今日何喜。匠答以己名在刀上。妻又问刀卖去，名亦去乎。匠曰：「名不去。」坊中老匠言，此制始自黑岩厂云氏，彼时器成亦刻名于柄。"
 LYY_Spirit_Free_Port_Charter:"贵贱同一法"
 LYY_Spirit_Free_Port_Charter_desc:"宪章第一条：凡在本港经营者，无论贵贱，皆同守一法。书者为一商，家资巨万。书至此条，搁笔问此条亦管己乎。众答以管。商谓港中铺十有七，若同守一法，己损必多。众答以然。商默然，复取笔，书完，乃自署其名于首。署毕，自谓先署非为众，为子孙。众问其故。商曰：「无法之家，三世必败。」宪章首卷藏于玉京台石室，室门无锁，惟以石珀为闩。"
 LYY_Spirit_Guild_Eternal:"万贾趋于利"
 LYY_Spirit_Guild_Eternal_desc:"商会既兼衙门之事，凡讼先入商会。堂上悬一联，曰：「事有定章，人无闲话。」判者皆商，判词皆短，三两语而决，无一人上诉。外乡木匠至，欲入行，行首索保，木匠无保；索铺，木匠无铺。木匠自谓有手。行首答以手不载于册。木匠乃去，去时过其门，门上新漆未干，映出人影。其人视之，亦不回顾。璃月港商会之门新漆未干，映出行人影，门内悬一联，墨新纸白。"
 LYY_PW_Spirit_Tianquan_Eternal:"一肩任一城"
 LYY_PW_Spirit_Tianquan_Eternal_desc:"永续之议既上，堂中先问者非可否，乃名分。有谓既云永续，则须正名；有谓名不正则言不顺。凝光皆不答，惟命取历年之册，置于案上，凡三十七函，令诸君欲正名者先阅此。众阅三日，至第四日，无人再言正名。老臣私语，谓彼不辩，而使吾辈自辩；此后临时期满之议，遂无人再提。三十七函陈于群玉阁东廊，函以布裹，函角各系一签。"
 LYY_Spirit_New_Scale_Charter:"众署共署方成约"
 LYY_Spirit_New_Scale_Charter_desc:"新约之要，惟八字：「账目各清，互不相赖。」初，胜者欲独署，谓败者何与。老吏言此约若独署，则他日败者复起，必先焚此纸。胜者问然则如何。老吏答以使败者亦署。胜者问彼肯乎。老吏曰：「彼不肯，则约不成；约不成，则战复起。」胜者沉吟良久，乃遣使至败者之门。使三往，乃见。见之日，两人各据一案，中间置约，无人先取笔。约成于璃月港议事堂，两案相对，中置一几，几上惟约。"
 LYY_Spirit_Long_Ledger:"账册终不阖"
 LYY_Spirit_Long_Ledger_desc:"册之扉页，惟书四字：「此账不封。」下有一行小字：后来者续。书吏初接手，见其册厚，问此中何所有。老吏答以皆未了之事。书吏又问既未了，何不弃之。老吏答以弃之则此册成空，而事仍在。书吏乃坐，自晨至暮，录十七事，录至末，笔忽断，乃以指蘸墨续书。老吏在旁视之，不言，为其添灯。册存于玉京台档库，架编号至十七，后架犹空。"

 LYY_Port_Tier_1:"商港之阶"
 LYY_Port_Tier_1_desc:"港埠冷落，泊位空荡。账房守空册子算了一夜，算盘上落一层灰。栈桥木桩生苔，巡港者一日只走一遭。老舟人自远方归，见港中无船，立于岸上良久，问旁人此港何年如此。旁人答以三年，而三年之前，渠尚在外。"
 LYY_Port_Tier_2:"商港之阶"
 LYY_Port_Tier_2_desc:"舟楫初集，往来多本乡之船。码头始有吆喝，却仍听不见别处口音。牙人复立棚于岸，先议近海之货；账房添新册三本，所记皆熟客之名。少年挑夫初来，问何处可觅外邦之货，众皆笑，指港外曰：「且待三年。」"
 LYY_Port_Tier_3:"商港之阶"
 LYY_Port_Tier_3_desc:"商路重开。挂璃月旗之船复见于远方港口。外人始记得，此海上尚有此一城。外邦商船渐至，泊位不敷，乃于港西新辟一段。通译之人由二增至十一，而犹不足。老吏翻旧册，见三十年前之税则，与今所议者大同，掷册而叹。"
 LYY_Port_Tier_4:"商港之阶"
 LYY_Port_Tier_4_desc:"万商云集。栈桥彻夜不歇，租金一日三涨。热闹底下，有人开始算，这份热闹能撑几年。仓廪不敷，乃租民宅以贮货；脚夫不足，乃募山民入城。老牙人夜坐灯下，取三十年之账比对，见每次极盛之后，皆有一年骤落。"
 LYY_Port_Tier_5:"商港之阶"
 LYY_Port_Tier_5_desc:"提瓦特第一大商埠。税关铁箱，须三人方抬得动；码头旗色，看不过来。凝光却于最忙时语账房曰：「船来愈多，愈要记得谁欠谁。」账房问其故。她指港中桅樯，谓此中三成为他人之船，借我之港，用我之名，而欠我之账。"
 LYY_Mandate_Tier_1:"天授之阶"
 LYY_Mandate_Tier_1_desc:"天授尽失。旧契已毁，新规未立，事事凭人情决断，人一走，约定亦散。港中老者言，昔者一诺重于纸上，今则纸上重于诺。商贾与人约，先问其家世，次问其铺在何处，末乃问其愿不愿立契。"
 LYY_Mandate_Tier_2:"天授之阶"
 LYY_Mandate_Tier_2_desc:"名分初立。官府始照章程办事，办起来仍要看谁面子大些。同为一事，有门路者三日得批，无门路者三月无音。寒家子自外乡来，投文七次不得见，乃于门外坐三日，第四日有人出，问其何求，事乃办。"
 LYY_Mandate_Tier_3:"天授之阶"
 LYY_Mandate_Tier_3_desc:"秤已立稳。白纸黑字，庄重而迟，护住弱者，亦拖慢一切欲走捷径之脚。港中议价，先看秤星，后看人情；讼于堂上，先呈契纸，后陈委屈。老牙人谓此三十年来头一回，买卖不必先饮酒。"
 LYY_Mandate_Tier_4:"天授之阶"
 LYY_Mandate_Tier_4_desc:"秤悬如律。作奸者无所遁形，敢绕行之聪明人，亦渐无活路。旧日专走偏门者，或改业，或远去；其留下者，多闭门不敢出声。黠商改以旧法易新秤，未及一月即为人所举，举者乃其同行。"
 LYY_Mandate_Tier_5:"天授之阶"
 LYY_Mandate_Tier_5_desc:"天授如磐。人人平等，无一丝余地。守住了公义，亦可能锁住此城伸向明日之手。凡新事，先问有无旧例；凡新法，先问可否行于百年之前。少年献一新器，工部驳之，曰：「此器无例。」少年携器归，三年后他国用之。"
 LYY_PWCombo_Both_High:"万国来朝"
 LYY_PWCombo_Both_High_desc:"舟楫塞港，律令亦压得住场。四方排队来签此约。凝光独问左右曰：「此热闹之中，几人真肯留下。」左右不能答。她乃命人另立一册，专记签约者置产与否，三年后取视之，签约者百二十家，置产者十九家。"
 LYY_PWCombo_Both_Low:"舟尽秤空"
 LYY_PWCombo_Both_Low_desc:"船不来，秤也立不起来。账房对空册子算一夜，算盘上落一层灰。战后所许之约，多成空文；所立之司，多成空署。吏请裁并，主事者不许，谓署可空，名不可无。吏退而记之，谓此语可入史。"
 LYY_PWCombo_A_High:"豪商无秤"
 LYY_PWCombo_A_High_desc:"金山压过了律文。投机客在码头彻夜作乐，规矩退到墙角，看着自己一寸寸被无视。战后新开之号，十之六七无实本，惟借他人之名挂一招牌。有司欲查，查至第三家而止，以其招牌之后，署一贵人之名。"
 LYY_PWCombo_B_High:"秤重舟轻"
 LYY_PWCombo_B_High_desc:"法条刻得端正，码头却愈冷清。秩序有了，人走了，账上数字亦随之凉下。战后归港之船，多改泊他处；旧日之牙行，剩者不足三成。老吏巡港一周，见栈桥空阔，归而于册上记一行：「今日无争。」"

 #################### 甘雨 · 月海亭 ####################
 GYP_CivilWar_Moonlit:"文末无人署印"
 GYP_CivilWar_Moonlit_desc:"帝君驾崩之讣至月海亭，甘雨方誊抄当日文书。笔尖停而不动，一滴墨落于纸，晕成小圆，不可复补。次日清晨，仍先众而至，仍以文牍按次序置于案。惟至文末，无复有那方熟悉之印。甘雨抚其空处，久之，曰：「神已去，账仍须记，路仍须修。所异者，此后署名之人，当为我辈自己。」语毕取笔，墨已干，乃重研。"
 GYP_Assume_the_Secretariat:"先读文牍后立威"
 GYP_Assume_the_Secretariat_desc:"月海亭之灯，三千年未尝尽熄。甘雨复坐其座，案上文书已积至齐眉，束以旧绳，绳皆磨断。或劝曰：「宜先立威，宜先掌兵。」甘雨摇首，抽第一牍，一行一行读之，读至日昃。曰：「璃月之骨，不在刀上，在此堆纸中。」能读此纸者，乃能撑此城。劝者退，甘雨犹读，灯花落于纸上，以指拂去。"
 GYP_Summon_the_Scholars:"一字之差神人隔"
 GYP_Summon_the_Scholars_desc:"文官之名，一一点出。有旧府老吏，有山野寒士，亦有早已弃笔执锄者。点到一名，则应声者或老或壮，衣或鲜或敝。甘雨语之曰：「帝君在时，尔曹替神办事；今神不在，尔曹须替人办事。」前后只差一字，行之则难千倍。众皆默然。一老吏出列曰：「替人办事，可否先问人愿不愿意。」甘雨曰：「正须先问。」"
 GYP_The_Empty_Throne:"空殿初一添灯油"
 GYP_The_Empty_Throne_desc:"帝君之位，甘雨存之如故：案、椅、印、灯，一物不缺，亦一物不用。或谓之怯，或谓之怀柔。甘雨不辩，惟每月朔日，亲至空殿，添灯油一盏。添毕，立阶下少顷。左右问其故，曰：「使此位常空，人乃知其可空；若一日有人坐之，则前功尽弃。」灯焰小，风入则摇，以手护之，待其定乃出。"
 GYP_Reopen_the_Granaries:"粮车自亭排至海"
 GYP_Reopen_the_Granaries_desc:"开仓第一日，粮车自月海亭排至海边，车辙相衔，无有断处。甘雨不登高台，杂于队中，亲以斗量米，递于一老媪怀中。媪视之久，忽曰：「尔非月海亭那位乎。」甘雨曰：「是。」媪哽咽问：「帝君果不在矣。」甘雨为扎其袋口，低声曰：「不在矣。然自今而后，饿腹之事，有人管。」媪抱米而去，行数步，回首再拜，甘雨避于车后。"
 GYP_The_Book_of_Rites:"旧档犹存拜跪条"
 GYP_The_Book_of_Rites_desc:"礼典重修，最闷、最繁、最不讨好。甘雨闭户于月海亭，逐字逐条校之；至一句拜跪当立与否，翻三千年旧档，得数十条，皆相牴牾。左右请决，甘雨曰：「礼者，所以安人也。若一礼使人更苦，则当删，虽传三千年亦删。」言毕，取笔勾其一，勾处墨重，纸背皆透。"
 GYP_The_Attendance_Ledger:"点卯簿悬于衙前"
 GYP_The_Attendance_Ledger_desc:"点卯之簿，记谁至、谁不至、谁迟几刻，事极琐细，甘雨视之甚重。或以为末务，甘雨曰：「一国不能管其官吏何时上衙，安能管千里山河。」簿悬衙前之日，一老吏迟到半刻，名在末行，面赤至颈，退而立檐下。自是众皆早至，鼓未鸣而堂已满，击鼓者反最后至。"
 GYP_Adepti_In_Residence:"仙凡同坐一张桌"
 GYP_Adepti_In_Residence_desc:"散仙数人应请入城，居于月海亭别院。甘雨不索仙力，不祈符箓，惟请其一事：人间疑难，为指一路。或问：「仙亦问人间事乎。」甘雨曰：「仙凡之间，不必为主仆，亦不必为陌路。若诸君肯，我当扫一间屋，使三千年来，仙与人同坐一桌，共饮一碗热茶。」言至此，一散仙举袖掩面，曰：「此茶吾当饮。」"
 GYP_Benevolent_Tax:"宽者先算后宽"
 GYP_Benevolent_Tax_desc:"宽税之令下，乡间负担轻三分。或颂为善政，或有私忧者曰：「此善政恐不支明年。」甘雨取历年税册，摊于长案，一条一条核之，自晨至夜，算毕乃曰：「宽者，非施舍也，乃账算清后之余裕。若并此余裕亦无，则我与苛税之王侯何异。」言已，取乡中所上民状一叠，命吏分条抄入新册。"
 GYP_The_Civil_Exams:"八字之卷取第一"
 GYP_The_Civil_Exams_desc:"开科取士，场中初满寒门子弟，衣多旧，笔多秃。甘雨亲拟首题，曰：「问天下何以太平。」有考生引经据典，洋洋数千言；有考生只书八字，曰：「使民有食，有衣，无畏。」阅至此卷，甘雨执之良久，置诸案上，又取他卷相较，终取为一等。榜出，众问其故，曰：「他卷答天下，此卷答人。」"
 GYP_The_Grand_Secretariat:"东厢多置几张案"
 GYP_The_Grand_Secretariat_desc:"文华内阁无甚威风，惟于月海亭东厢增置桌案数张，窗下置茶一壶，无人执壶。甘雨曰：「内阁者，使不同之意得坐而相争之处也。」争毕出门，仍须并肩办事，此乃文官治国之能，亦其最累人处。首日议事，两人争至面赤，退而同赴河工，共立泥中，至暮乃归，途中不复言争。"
 GYP_The_Village_Elders:"乡老登阶言三事"
 GYP_The_Village_Elders_desc:"乡老议政，所带者最粗粝、亦最真实之民声。一乡老初次入城，登阶不敢尽上，立于半阶而言：「某渠坏，某堤裂，某户孤儿无人管。」语不甚成章，而满堂寂然。甘雨亲执笔记之，一条一条，书至第三条，笔顿，问：「此孤儿几岁。」乡老曰：「七岁，能担水。」甘雨复书，书毕曰：「此数条，比千篇奏章重。」"
 GYP_Herdsmen_and_Farmers:"余粮换得皮货归"
 GYP_Herdsmen_and_Farmers_desc:"田与牧，本为两不相下之业，农人贱牧，牧人贱农。甘雨并而合之：农以余粮易牧人之皮货，牧以牲畜易农人之粟米，两不折价，官为立契。曰：「璃月之土，能生五谷，亦能走牛羊；一国只认一种生计，终必自饿而瘦。」初易之日，一牧人牵羊至场，一农人负粟至场，两相顾而笑，皆不肯先言价。"
 GYP_The_Snow_Pact:"山门外立尽一日"
 GYP_The_Snow_Pact_desc:"绝云间之雪，从不落于人间。甘雨独上，不携伞，不携从，立于仙家门外一日，雪积于肩，积而复化。至暮，门启一线，得一盟约，语多含混，不可尽解。下山时语从者曰：「此盟未必可恃，然山上之人既肯开门，人间便有一路通云，虽细如丝。」从者问：「丝可度人乎。」曰：「先有丝，后有桥。」"
 GYP_The_Question_of_Heaven:"既无帝君何以生"
 GYP_The_Question_of_Heaven_desc:"甘雨设高台于月海亭前，不设香案，不悬幡，只问一句：「帝君既已归天，我辈靠何而活。」台下有答契约者，有答礼数者，有答不必靠何者，亦有答不出而垂首者。甘雨不评一语，待众声渐息，乃曰：「此问我答三千年，未答明白。今日付与诸君。」言毕下台，阶下无人让路，亦无人先语。"
 GYP_Charter_of_Service:"官帽自谁口粮出"
 GYP_Charter_of_Service_desc:"任官宪章第一条，语极朴素，曰：「为官者，先问百姓，后问上官。」一老吏读之，摇首曰：「如此则上下倒置，事必乱。」甘雨不辩，命抄数十本，人授一册于新官受任之日。曰：「欲尔曹记之，头上之冠，自谁口中之粮省出。」一新人受册，退而于册首自书其父之名，书毕，以指按其字。"
 GYP_The_Merit_Examination:"十九条废渠尽通"
 GYP_The_Merit_Examination_desc:"考成之法，所考者实事：修堤几处，赈饥几户，清钱粮几何，皆须有籍可查。首次考绩，三位自许干练之老吏皆落等，一县丞素寡言，评为上上。或问其故，则曰：「此人数月之间，以一身通该县废渠十九条，渠通而田复耕者千余亩。」榜出，老吏中有一人径至县丞前，拱手曰：「服。」"
 GYP_An_Open_Court:"一问满堂哑"
 GYP_An_Open_Court_desc:"明堂听政，许百姓立于堂下，听官议事。初时无人敢入，入者多市井好事之徒，倚柱而观。日子既久，堂下渐蹲满人，有负薪者，有抱子者。一日一农夫问曰：「诸公所议之堤，何以在吾村之外绕三里。」满堂文官相顾，无一人能对。甘雨在侧，曰：「使民闻我辈如何言，我辈乃学如何言人话。」"
 GYP_The_Public_Kitchen:"灶火终日不熄"
 GYP_The_Public_Kitchen_desc:"义仓膳堂分设诸区，灶火终日不熄。甘雨不使之为施粥之棚，乃请最能炊者掌勺，米必淘三过，菜必热而后上，使最贫者亦得食一餐体面之热饭。或问：「既为赈，何必如此费。」曰：「饿腹之人，最畏者非饥，乃他人递来那一眼怜悯。」言毕，自取一碗，坐于众中食之，食竟乃去。"
 GYP_Fair_Measures:"刀伤一处秤伤城"
 GYP_Fair_Measures_desc:"度量归一，最为得罪人。诸商号各用其尺，官仓之斗与民间之斗，相差可容一年之人心。甘雨铸新衡器，命吏逐户校之，有仍用旧器者罚，不贷。或以为苛，甘雨曰：「一秤不公，比一刀更伤人；刀伤一处，秤伤一城。」市有一翁，抱旧斗至，请易新者，曰：「此斗吾用四十年，今日方知是私器。」"
 GYP_The_Peoples_Advocate:"鸣冤鼓移于街口"
 GYP_The_Peoples_Advocate_desc:"谏议之官，专为不能言者言。甘雨命取衙前鸣冤之鼓，移至最闹街口，去其栏，撤其吏。曰：「欲诉者，谁敲皆可；我不拦，人亦不得拦。」鼓悬三日，面已斑驳，击痕累累，有以拳击者，有以杖击者。守鼓老吏初以为扰，既而见击鼓者去时颜色比来时亮，乃不复言，日以布拭其面。"
 GYP_Schools_of_the_Classics:"旧训新论同一席"
 GYP_Schools_of_the_Classics_desc:"经学馆中所讲者一事：此世上何者为公道。先生既讲帝君旧训，亦讲刻晴新论，又请商会账房登席，讲如何算一本清白之账。诸说相攻，学生各执其一，争至日暮不休。甘雨临馆，闻之，曰：「学问若只供殿上人揣摩，则摆设耳。」学生问：「然则如何。」曰：「先争，争而后能自择。」"
 GYP_The_Returning_Scholars:"此账中缺君一笔"
 GYP_The_Returning_Scholars_desc:"战乱中遁入山林之读书人，以一函一函请之而归。有怀戒备者，至城门犹按囊中旧稿；有已白发者，行须人扶。甘雨亲迎于城门外，不设仪，不张盖，曰：「璃月之账，缺君等一笔。」一老者闻之，泪落于襟，曰：「吾不为荣宠泣，为尚有人记吾半生所学耳。」甘雨执其手，引之入城，行甚缓。"
 GYP_Land_for_the_Tillers:"田埂撮土尝咸淡"
 GYP_Land_for_the_Tillers_desc:"授田之制，以荒废之田重新分与耕者。书吏丈量之日，甘雨常蹲于田埂，看老农撮土一撮，置舌尖尝之。问其故，老农曰：「咸者瘠，淡者肥。」甘雨曰：「此土咸淡，比地籍册更实。」问：「到手之田，够种否。」老农不答，只憨笑，以手攥土，攥而复攥，土自指缝落，落于其鞋。"
 GYP_The_Seal_of_the_Regent:"印置于案上三日"
 GYP_The_Seal_of_the_Regent_desc:"摄政之印铸成之日，甘雨不即用。置之于案，凡三日，每日取所需用印之政令，逐条审其合规与否，审毕复置。至第三日暮，乃落第一笔朱砂，朱浓而不溢。语左右曰：「印者死物，握印者活人。此印之要，不在其重，在它日日提醒我，权须有人看着。」言毕，以布覆印，置于案角。"
 GYP_The_Adepti_Compact:"仙守山人理民"
 GYP_The_Adepti_Compact_desc:"甘雨草此约于绝云石案之上，凡三易稿。其文曰：「仙掌地利，人掌民事，遇争则请德高者裁，裁者亦不得专断。」有仙人指其一字问曰：「此字何解。」甘雨曰：「留一处可商量之地耳。」仙人笑其不决，甘雨曰：「决则无人复来。」约成，山上山下各按手印，印有大小，而纸只一张。"
 GYP_Peaceful_Coexistence:"仙凡同坐一条凳"
 GYP_Peaceful_Coexistence_desc:"仙凡杂处，最难者非争，乃相避。有仙家嫌市声之喧，徙居山半；有人间忌仙家清高，见之则绕道。甘雨不与之辩，只命匠人于城中要路置长凳数条，可坐三人。或问其故，曰：「不必相爱，但求不互伤，已是难得之太平。」日久凳面磨得发亮，坐者不问仙凡。"
 GYP_The_Grand_Academy:"门额题作不为名"
 GYP_The_Grand_Academy_desc:"太学落成之日，甘雨亲题门额四字，曰：「为不为名。」有士子立于阶下，问曰：「此四字当作何解。」甘雨曰：「读书非为作官，亦为异日遇一桩不平事，说得出，扛得住。」堂中最热闹者，是通夜不熄灯之辩论堂，夜深犹闻拍案之声。守门老吏语人曰：「此堂之灯，比神殿香火经久。」"
 GYP_The_Rites_of_State:"秋收亦立一典"
 GYP_The_Rites_of_State_desc:"国之大典重订，登基、拜相、春耕、秋收，各有其数。有老臣讥为虚文，谓乱世当先治兵。甘雨不听，偏为一场秋收另立一典，命礼官读祝，命农人受谢。是日，耕者立于阶前，手足无措，有老农以袖拭面。甘雨谓左右曰：「礼者，使寻常日子有分量耳。」耕田织布之手，亦当有一日被举国谢过。"
 GYP_The_Moonlit_Reign:"三易诏稿用初本"
 GYP_The_Moonlit_Reign_desc:"月海之诏，甘雨手书，三写而三废。初稿素朴，再稿雕饰，三稿愈工而愈远。至夜半，取初稿视之，曰：「仍是这一纸。其文无华辞，惟言愿此后璃月，饥者有食，寒者有衣，屈者有处可诉。」颁诏之日，满城张灯，灯自黄昏燃至月落。有老妇立于灯下，向北徐拜，拜毕不语而归。"
 GYP_The_Everlasting_Rain:"名契曰雨下千年"
 GYP_The_Everlasting_Rain_desc:"甘雨于契末亲书数语：「此法今日立，未必今日尽美，愿后人以宽容待之，以公心正之。」书毕，题其名曰雨。左右问何取于雨。曰：「善政不过一代，善念可传十代；雨不骤至，渗入土中，千年而后，山河皆湿。」是夜小雨，檐溜有声。甘雨推窗听之，良久，乃合窗就寝。"
 GYP_Restore_the_Six_Rites:"冠婚丧祭次第举"
 GYP_Restore_the_Six_Rites_desc:"六礼复兴，冠、婚、丧、祭、乡、相见，一礼一规，次第重拾。有少年讥为倒退，谓乱世何暇及此。甘雨不辩。是月，城西有一户行婚礼，鼓乐甚简，观者塞巷；城东有一户举丧，幡白如雪，邻里皆至。甘雨闻之，谓左右曰：「兵荒之年，尚有人肯认真办一场婚、一场丧，此即人间未坏之证。」"
 GYP_The_Sacred_Contract:"神像可朽契不朽"
 GYP_The_Sacred_Contract_desc:"契约复奉为神圣。甘雨取其正本，藏于月海亭最深一室，户外加锁，锁钥自佩。或请闭而不宣，曰：「神物不当轻示。」甘雨不许，命抄手百人，日夜誊写，分送诸市集、诸村口，人得一张。曰：「神像会朽，纸不会；只要尚有人肯于其上按一指，此约即未绝。」市中抄本，未及一月，边角皆卷。"
 GYP_The_Liturgy_Court:"礼司所管惟分寸"
 GYP_The_Liturgy_Court_desc:"礼制之司所司者，分寸而已。何时当跪，何时当立，何人居先，何事居后，皆有条目。有少年吏员掷笔曰：「此是活人入死规矩。」甘雨拾其笔还之，曰：「分寸者，使一城陌生人亦能彼此体面。」礼崩之后，最可惧者非无礼，乃人人不复顾他人体面。少年不能对，受笔，退而录其条。"
 GYP_The_Sealed_Register:"查人须凭一纸批"
 GYP_The_Sealed_Register_desc:"籍册既封，凡查人、查户、查田，皆须一纸批文，无批文者不得启。甘雨初以为防奸宄之良法。未几，批文批得愈顺，吏员候于阶下者愈多，一日可批数十。是夜独坐，灯下忽忆少时所读暴秦诸事，遂合卷，自语曰：「暂者耳。」语毕，取笔于卷首添一小注，注未竟而止。"
 GYP_Sanctify_the_Regency:"诏书批注天无言"
 GYP_Sanctify_the_Regency_desc:"摄政之诏，有代天理物四字。甘雨视之良久，援笔于侧批曰：「天无言，人声即天声。」批毕，取诏压于满案文牍之下，既不肯撤，亦不愿使之易见。有近侍问：「此诏当颁否。」甘雨曰：「颁。」近侍又问：「既颁，何以压之。」甘雨不答，惟以手按案上纸堆，久不移。"
 GYP_The_Clerisy_State:"乡争不入官门"
 GYP_The_Clerisy_State_desc:"礼教之国，以礼为法，以教代刑。乡里之争，多就德望高者断之，官府退居其后，案牍遂简。其制安静有序，人亦称便。行之数年，乃有人觉其一节：凡被礼判为不端者，无论曲直，自此在乡里抬不起头。有妇人携子徙居他县，行前语邻人曰：「非不能居，是不能抬头。」邻人无言。"
 GYP_Curbs_on_Commerce:"抑商重农炊烟旺"
 GYP_Curbs_on_Commerce_desc:"抑商之令下，商贾之位次在农人之下，市集渐冷，田家炊烟反旺。甘雨非不知商贾之利，特信一理：根扎于土者，乱世不易走失；钱驮于牲口者，风一起便不知去向。有老商叩门求见，问其故，曰：「市冷则百物不至。」甘雨曰：「吾知之。」问：「既知之，何不改。」甘雨良久不答。其后数年，此举是否当行，她亦不敢自断。"
 GYP_The_Faithful_Bureau:"忠信之辈眼渐尖"
 GYP_The_Faithful_Bureau_desc:"忠信之局，聚一时之廉干。其人不贪，不占，文书到手即办，案无留牍。惟目渐尖，尖至能于寻常家宴上看出谁坐错一席、谁作错一揖，退而记之。甘雨拔之于众，用之亦重，而心常惴惴。尝语一近臣曰：「替天行道之人，走得最远，亦最难劝回。」近臣问所指。甘雨曰：「指其自信。」"
 GYP_Custodians_of_the_Old_Law:"抱旧律而不释卷"
 GYP_Custodians_of_the_Old_Law_desc:"旧法守护者，新朝中最固执之辈。抱帝君旧典不肯释手，一条一条比对，一处一处争辩，常至夜分不散。甘雨初嫌其迂，尝谓之曰：「天下已易，何苦守此故纸。」一老吏对曰：「故纸之中有字，字后有人。」甘雨默然。久之乃渐生敬，谓左右曰：「人人欲改，独此辈肯为一字之出处较真，此最近乎公道。」"
 GYP_The_Silent_Censorate:"台谏奏章渐客气"
 GYP_The_Silent_Censorate_desc:"台谏渐无声。旧日专摘人主之失者，今惟摘些无关痛痒之小节，奏章愈写愈客气，起首必称惶恐，末尾必称死罪。甘雨一一阅过，不发一言。一日偶问一老谏官：近日所纠者何。对曰：「纠其衣冠。」甘雨不复问。是夜独坐，乃知使台谏闭口者，非威也，乃一个太平得令人不敢出声之世道。"
 GYP_Unity_of_Heaven_and_Earth:"天地缝作一张网"
 GYP_Unity_of_Heaven_and_Earth_desc:"天地一统，礼制之极也。人间之序与天道之序，缝合为一，经纬相衔，无一处漏。其网整齐，庄严，无可指摘。惟网眼甚密，不容一鸟思向他处。甘雨立网中央，四顾皆线。有少年吏自外来，问：「网中可呼吸否。」甘雨不应，良久乃曰：「可。」少年去后，她以指拨其一结，结不动，遂垂手。"
 GYP_The_Unbroken_Chain:"复旧观三字无期"
 GYP_The_Unbroken_Chain_desc:"不绝之链，以摄政之位为环，环环相扣，无首无尾。甘雨立誓曰：「璃月一日未复旧观，吾一日不退。」闻者皆以为忠。独一老臣于阶下低声曰：「复旧观者，何状。」左右无一人能答。甘雨亦不答，退而于纸上画一圈，圈成，又于圈中加一笔，笔尽而墨涸。是夜她未再提此事。"
 GYP_The_Regent_Eternal:"改一暂字为永字"
 GYP_The_Regent_Eternal_desc:"诏书措辞，甘雨亲改，易暂摄为永摄，只改一字。改毕，独坐至天明，以指反复摩挲那枚随身半生之印。忽忆三千年前初受此印，帝君尝笑曰：「待尔哪日不愿再摸，便当还来。今印犹在手，而笑者已不在。」天明，侍者入，见其仍坐，案上灯已尽，印在掌中。"
 GYP_The_Old_Contract_Restored:"复颁旧约字不易"
 GYP_The_Old_Contract_Restored_desc:"旧约重立，取帝君当年之契，一字不易，重勒于石，颁行天下。民争赴碑前焚香，香烟蔽日，有跪而泣者，以为神明复归。甘雨立于碑侧，久无一言。归途语一近侍曰：「碑上那名之主，已不在了。」近侍问：「然则今谁守此约。」甘雨指街上往来之人曰：「守此约者，是此辈无名为谁之人。」"
 GYP_The_Three_Thousand_Years:"一笔流水三千载"
 GYP_The_Three_Thousand_Years_desc:"三千年之账，甘雨一人默记。某年大旱，某年丰稔，某家添丁，某户断后，皆在其心，不待翻阅。夜深人静，偶自问曰：「此一本流水账，为谁而记。」帝君在时，为神记之；帝君去后，为己记之。记至近年，忽觉难分：是她在记璃月，抑或璃月借她之笔记她。问毕，仍取笔，添一行。"
 GYP_The_Chasm_Seal:"层岩裂口加新封"
 GYP_The_Chasm_Seal_desc:"层岩之下，有裂痕一道，比诸契约尤为古老。甘雨亲率工役往封，行于山道，终日少言。及至井口，俯视良久，命以新石旧法层层加压。回程坐于车上，忽语随行者曰：「深渊最可畏处，不在其深，在它总择人得意之时提醒一句。」随行者问何语。曰：「楼上再高，底下总有一层，日光照不到。」"
 GYP_Refuge_of_the_Mountain:"开山洞天纳流民"
 GYP_Refuge_of_the_Mountain_desc:"乱世之中，最先被弃者，是那些不会喊之人。甘雨命开山中洞天与谷地，凡流民至者，皆许栖止，给以薄粥、粗席。有属吏谏曰：「此辈无业无名，久必生乱，是养虎也。」甘雨曰：「一国之慈悲，正在其如何待无用之人。」居数月，山中炊烟渐密，望之竟比城中更盛。"
 GYP_A_Letter_from_the_North:"北书借粮不借路"
 GYP_A_Letter_from_the_North_desc:"至冬来书，词甚恭，条件则硬：但得璃月开一口，彼即包揽三年粮运。甘雨读之再三，援笔作复，只两句：「粮可借，路不借。」写毕，又添一行：「吾不疑君之诚，所疑者，雪化之后，地上那一摊水。」使者持书去，面色不豫。甘雨送之门外，立于阶上，看其车马出城，乃还。"
 GYP_The_Burden_of_Office:"晨起犹愿坐此椅"
 GYP_The_Burden_of_Office_desc:"任重，道远。甘雨与同僚书曰：「吾平生所作最重之役，非战，非议，乃每日清晨将今日当行之事，一件一件想明，排定，再一件一件做了。」又曰：「撑一国者，从来是无数寻常之清晨；难处只在每一个清晨，尚肯坐回那张椅子。」书至此，笔下微顿，复书一行：「今日我又坐了。」"
 GYP_Reunify_Liyue:"吹灭虚君长明灯"
 GYP_Reunify_Liyue_desc:"内战既毕，甘雨入殿，亲手吹灭虚君位前长明之灯。殿中一暗，随即有天光自窗隙入，照见梁上积尘。出月海亭，街上如常：卖豆腐者吆喝，学童背书，码头船进船出。甘雨立墙阴，看良久，语左右曰：「总算不必再替神操心。」左右问：「此后操心者谁。」曰：「吾辈。」"

 GYP_civilwar_category:"月海之衡"
 GYP_civilwar_category_desc:"麒麟一系，内战诸决尽归此衡。两轴并运，量守成与变通之分寸，每决一事，轴移级易。甘雨所愿，只求璃月于动荡之中少受损伤。宁缓三分，不愿见百姓流离；宁退一步，不愿见生灵涂炭。"
 GYP_decision_draft_officials:"选官问绩"
 GYP_decision_draft_officials_desc:"选官者，治国之根。甘雨立法三事：一考文章，二考实绩，三问乡里。有问：「文章可考，实绩可查，乡里之言，安知其不私。」甘雨曰：「私亦听之。一人私，十人未必私；十人皆言其好，则必有其好。」考选设于玉京台东，号舍百二十间，间广三尺。"
 GYP_decision_public_granary:"常平义仓"
 GYP_decision_public_granary_desc:"丰年收粮，荒年放粮。仓中每一石，皆替明日之饥先存一语。有老农问：「存此何用。」甘雨曰：「无用。惟愿一世不用。」老农曰：「若一世不用，仓便空朽。」甘雨曰：「仓朽可补，人饥不可补。」义仓在归离原东，屋五间，梁上题年号，字已褪。"
 GYP_decision_teach_rites:"讲礼于乡"
 GYP_decision_teach_rites_desc:"礼典写出，只成纸；讲出口，乃成活。宣讲之队遍行乡野，不诵条文，只以俗事为譬：见长者当如何，受人之惠当如何。一童子问：「礼者，畏人乎。」讲者曰：「礼者，不使人难堪。」童子点头，归而以是语其祖。宣讲之队自归离原起，沿村而行，日行二十里。"
 GYP_decision_repair_dikes:"筑堤束水"
 GYP_decision_repair_dikes_desc:"水患，此古国最诚之考官。堤牢不牢，一场暴雨即揭；吏用不用心，一条决口即证。甘雨每岁亲行堤上，以杖叩石，听其声。有吏问：「听声可知工之善否。」甘雨曰：「实者声钝，虚者声空。」堤在荻花洲北，以石垒，石缝以泥，泥中有草。"
 GYP_decision_scholar_bounty:"荐才连坐"
 GYP_decision_scholar_bounty_desc:"凡举荐之贤才有实绩者，举主同赏。僚属问：「同赏，则滥举者亦得赏乎。」甘雨曰：「故须并罚。举得其人，赏；举非其人，罚如其罪。」法出一年，举者三十七，而滥者二，二人皆自请去。举荐之册藏于月海亭东廊，册以布裹，函角各系一签。"
 GYP_decision_land_survey:"清丈田亩"
 GYP_decision_land_survey_desc:"田籍一乱，税即乱，人心更乱。清丈费时，且得罪豪强。有谏者曰：「何苦为此。」甘雨曰：「所得罪者数十家，所得者万千自耕之农。此账吾算得清，且算与汝听：一家豪强之怨，抵不得一村之安。」清丈之绳自归离原起，逐亩而量，桩以石为桩。"
 GYP_decision_relief_famine:"先炊后章"
 GYP_decision_relief_famine_desc:"灾年最缺者米，最怕者消息比粮车慢。赈灾讲一「快」字。甘雨下令：先使人饱，再议章程。有司请先造册。甘雨曰：「册成之日，人已死。先散粮，册后补。」散粮于归离原社仓前，仓门既启，米气出街。"
 GYP_decision_adepti_mediation:"请仙调停"
 GYP_decision_adepti_mediation_desc:"仙家出而调停，人情与天理并用，事办得快。然每请一次，人间即欠云端一注薄债。甘雨记之，不用纸，用筹。筹满一匣，则亲上山一次，还一债。有问：「仙亦计债乎。」甘雨曰：「仙不计，吾计。」自月海亭上山，山路积雪，行者三人，一持书，一负茶具。"
 GYP_decision_pacify_folk:"收流入户"
 GYP_decision_pacify_folk_desc:"流民者，乱世最易点燃之干柴。安置之，即把一城来日之隐患，提前一寸一寸收拢。有吏问：「何不驱之出境。」甘雨曰：「驱出境，则乱在境外；留在境，则乱在掌中。」流民安置于沉玉谷口，蓬屋百间，屋以竹为骨，覆以苇席，风入则响。"
 GYP_decision_envoy_to_keqing:"使者赴玉衡"
 GYP_decision_envoy_to_keqing_desc:"使者所携，月海亭粮道一册，并问候一句。甘雨附言：「政见之争可缓，先收此季之稻。」使者归述。刻晴闻之，命开仓先济月海亭之民，而后议其余，曰：「能使人食饭者，方配争天下。」"
 GYP_decision_envoy_to_ningguang:"使者赴天权"
 GYP_decision_envoy_to_ningguang_desc:"天权回话，先谈钱，后谈情。甘雨却重此对手。使者问：「彼不谈情，何重之。」甘雨曰：「彼不假慷慨，亦不欠一句实话。」使者归，携回清单一份，精至一厘。甘雨看毕，取笔于末添一行：「此数准。」使者归自群玉阁，携清单一份，精至一厘。"
 GYP_decision_envoy_to_shenhe:"使者赴绝云间"
 GYP_decision_envoy_to_shenhe_desc:"绝云间者，甘雨归处，亦其最不敢轻动之地。使者归，携冷语一句、不化之雪一片。甘雨取雪，供于月海亭最深处案上，供毕退三步，再拜，不发一言。左右问：「此雪何贵。」甘雨曰：「此非雪，是山上递下之一问。」"
 GYP_decision_envoy_to_childe:"使者赴云来海"
 GYP_decision_envoy_to_childe_desc:"公子之船队泊于港外，甲板上却设了茶。使者归，言其谈民生滔滔不绝，宛如一老账房。甘雨听毕，只摇头，曰：「愈把民生挂在口上者，愈须多留一分心。」遂命使再往，只问一事：其港中米价，今年几何。其船泊于云来海外三里，潮落可见船底附螺，螺壳色青。"
 GYP_decision_envoy_to_lanyan:"使者赴沉玉谷"
 GYP_decision_envoy_to_lanyan_desc:"沉玉谷山路上，使者为蓝砚所拦。蓝砚曰：「汝月海亭之文书，写得比山路还绕。」使者不与辩，只将那份极长之水土章程一字不改留下。甘雨所嘱者一句：「一字皆不可省。」三日后再过，蓝砚已以炭条在章程边上密密批注。"
 GYP_decision_proclaim_the_old_contract:"重刻旧契"
 GYP_decision_proclaim_the_old_contract_desc:"取那纸早已泛黄之契，一字不漏，重抄、重刻、重颁。此非复辟。甘雨曰：「此举为使众人复记一事：此国立国第一事，从来便是约。约在，则民知所守；约亡，则虽有城郭，亦墟耳。」旧契重刻于石，立于月海亭阶侧，字为阴刻，深可容指。"

 LYY_Event.4001.t:"墨落纸上晕成圆"
 LYY_Event.4001.d:"讣告至月海亭时，甘雨方誊抄文书。笔尖停于纸上，久不下，一滴墨坠，晕成小圆，如一枚无声之印。她不哭，惟将那一页轻轻抽出，另取新纸，重誊一遍。誊至原处，笔下稍缓，而后如常。\n翼日清晨，她照旧第一个至，照旧以次序列文牍：先急后缓，先外后内，与三千年来无异。惟至文末，无人再为之一批。她执笔候于纸尾，候之良久，乃自书数字，字稍小于旧批。搁笔时，手在袖中握之。\n是日午后，有吏送新印至，请其试用。她取印，就朱泥按之，印文清晰，乃于纸角试盖一枚，盖毕视之，久乃收印入匣。此后凡有文书至，她必先看文末有无旧批。无则自批，有则依之。有吏问：「何以如此。」曰：「我怕忘其笔法。」吏退，回视其案，见案角一旧印匣，久未开。月海亭阶下有积水一洼，映檐角，风过则碎。"
 LYY_Event.4001.a:"续掌月海，代摄国政"
 LYY_Event.4001.b:"退居山中，不复问事"
 LYY_Event.4002.t:"月海亭灯三千年"
 LYY_Event.4002.d:"月海亭之灯，三千年未熄。甘雨坐回那张椅子，案上文书已堆至齐眉。有僚属劝其先立威，先掌兵，先收人心。甘雨摇首，抽出第一份，一行一行读之，读之甚慢。读毕一份，批数字；复取一份。自辰至午，批者三十余。有一件为南疆请饷，批曰：「减半，另查其仓。」\n既罢，语左右曰：「璃月之骨，不写在刀上，写在这堆纸里。」谁读得懂它，谁才撑得起这座城。语毕，以手按纸堆，按下寸许，乃知其中实。\n有老吏在侧，闻之垂首。甘雨问其故，老吏曰：「此语先帝君亦尝言之，惟不言而后行。」甘雨曰：「我言而后行，亦未必能行。」是夜月海亭灯至四更。巡夜者过窗外，见灯下人影不动，以为倦寝。近视之，乃在数册页之数，一页一页，指随目下。巡夜者不敢惊，退。四更之后，批毕最后一册，她以手抚案，案上木纹已磨平。灯在案左，铜座，灯罩有裂纹一道，以铜丝缠之。"
 LYY_Event.4002.a:"以文书治国，先理案牍"
 LYY_Event.4002.b:"先执兵权，以定局势"
 LYY_Event.4003.t:"召贤榜下排长队"
 LYY_Event.4003.d:"召贤榜贴出三日，月海亭门前排成长队，自阶下至街口，曲而不断。队中多旧吏，亦有隐士，更有弃笔执锄之读书人，衣上有泥。甘雨亲自逐一问话，不设案，不设座，立而与之言。一日见数十人，足不移。\n至一老者，衣敝履穿，众人皆窃笑。甘雨却起身相迎，请其近前。众不解。盖她见老者袖破之处，露出层层草纸，纸上有字，密如蚁行。问之，曰：「山中三十年，所记皆水利。」甘雨曰：「请入。」\n老者入时，众人让道，无人再笑。是日录者十七人，独老者之名书于首。掌榜者问：「此人无荐书。」甘雨曰：「其袖即荐书。」老者所记，后成月海亭水利新册。册中一条曰：「某渠废于百年前，其址犹可寻。」遣人往视，果得旧渠，石堤尚在。役夫百人，浚之三月，水复至田。后世选吏，多循此例：先看其所记，后看其所荐。榜纸用黄，字用墨，末署月海亭印，印文端方。"
 LYY_Event.4003.a:"广纳贤才，不问出身"
 LYY_Event.4003.b:"惟取旧吏，以稳为要"
 LYY_Event.4004.t:"空殿初一添灯油"
 LYY_Event.4004.d:"甘雨将帝君之位原样留之：案、椅、印、灯，四者皆在，皆不用。案上无尘，椅上有垫，印在匣中，灯则常明。每逢初一，她亲往空殿，添灯油一次。提壶而上，倾油入盏，以纸捻挑其芯，火苗拔高寸许，乃退。\n有人问：「此祭耶，示威耶。」甘雨摇首曰：「皆非。吾只欲自警：彼位置可以一直空着，却再不该有人坐进去。」问者默然。翼月初一，其人亦至殿前，立于门外，不入门，见甘雨提壶而来，乃侧身让之。甘雨入，其人随之，立于案侧，未言。\n添油毕，甘雨以布拭盏沿，拭毕，将布叠好，置于案角。此后案角常有叠布一方，人皆不问。殿中之灯，油尽则添，灯芯则剪。有少年吏请代其役，甘雨不许，曰：「此非役也。」少年问：「然则何物。」曰：「记性。」月海亭空殿地砖为旧年所铺，砖缝生苔，扫者以竹签剔之。"
 LYY_Event.4004.a:"保留虚君之位，敬而不近"
 LYY_Event.4004.b:"尽撤旧殿，另立新堂"
 LYY_Event.4005.t:"开仓日米递老妪"
 LYY_Event.4005.d:"开仓之日，粮车自月海亭排至海边，车辙相叠，米屑撒于道。甘雨不立高处，不入棚，径挤入队伍，取斗量米。至一老妪，发白如雪，篮破以绳系，甘雨以斗倾米入篮，米溢于外，乃以手捧回。\n老妪认之，哽咽问曰：「帝君真不在耶。」甘雨替其扎紧袋口，系两道，低声曰：「不在。」自今而后，饿肚子这件事，有人管。老妪怔怔点头，抱米而去，行数步一回顾。甘雨目送之，至其转入巷口，乃复取斗，量下一家。\n是日量米至暮，腕不能举。掌仓者请其歇，不许，曰：「队未尽。」队尽时天已黑，仓中米去其半，簿上画押者千余。自此月海亭设常平之仓三，岁出陈易新。有老吏请立碑纪其事，甘雨不许，曰：「饿过者，不必再看碑。」老吏乃止，退而以簿记之，簿名米数。粮车自月海亭出，过玉京台石阶，须以绳曳之。"
 LYY_Event.4005.a:"开仓放粮，先安饥民"
 LYY_Event.4005.b:"封仓待价，先保军需"
 LYY_Event.4006.t:"礼典重修逐条校"
 LYY_Event.4006.d:"礼典重修，是最闷、最繁、最不讨好之役。甘雨自闭于月海亭，取三千年旧档，逐条校对。案上左手为旧典，右手为新稿，中间一盏灯。凡一句拜跪之当立与否，皆翻旧档，翻至纸碎。有一礼，旧档三处所记互异，她较之五日，末乃删之。\n或劝其何必如此。甘雨曰：「礼者，安人之物也。若一条礼数使人更苦，则当删，虽传三千年亦删。」劝者退。是夜灯至三更，有吏送粥，粥冷于案，未动。天明，新稿成，厚不及旧典之半。\n稿成之日，有老礼官求见，取其稿读之，读毕，指其中一条曰：「此条删得痛快。」甘雨曰：「此条我删之三日。」新礼既行，旧礼官有哭于家者，亦有着新服入朝者。甘雨两不问，惟于册上记其去留。册末一行：「礼从人，不从祖。」字稍小，似后来添者。旧档在库，架高及梁，取者须梯，梯脚裹布，以防其滑。"
 LYY_Event.4006.a:"重修礼典，删繁就简"
 LYY_Event.4006.b:"全盘照抄旧礼，一毫不改"
 LYY_Event.4007.t:"点卯簿挂衙门口"
 LYY_Event.4007.d:"点卯之簿挂上衙门，所记三事：谁至，谁不至，谁迟。簿悬于门内侧，过者皆见。有吏笑其琐碎，曰：「此亦当劳官府耶。」甘雨曰：「一国连官老爷几点上衙都管不住，何以管千里山河。」笑者不能对。\n当日，迟到者三四人，名在簿上，面红至耳，立而不敢坐。此后巳时鼓响，衙中已坐齐，无一人立。掌簿者初时尚须呼名，月余乃不必，惟候鼓声，鼓毕即合簿。有老吏私语曰：「此簿比刑杖有用。」闻者皆笑，笑毕各归其位。\n后有人于簿末添一行小字：「今日无迟者。」掌簿者不敢涂，呈于甘雨。甘雨视之，曰：「留着。此后每月之末，皆有一行。此簿岁终装订，存于库。」有吏检旧簿，见十年前迟到之名，多有今已迁官者，乃掩卷而笑，曰：「此中亦有我。」有外官来观，见簿而笑，归而仿之。三年之后，其衙亦置一簿，所记亦三事。点卯簿悬于月海亭门内侧，绳一断则坠，坠过三次，吏以铁丝续之。"
 LYY_Event.4007.a:"严行点卯，考勤有度"
 LYY_Event.4007.b:"宽待旧吏，维持人情"
 LYY_Event.4008.t:"仙家居廊问人间"
 LYY_Event.4008.d:"数位散仙被请入城中，居于月海亭别院。别院有廊，廊下有石桌一，茶碗数只，皆粗瓷。甘雨不索仙力，不求符箓，惟请其为人间疑难指一条路。\n一老仙问：「你不怕我辈插手太多，反将人间搅乱。」甘雨曰：「我所怕者另一事。」怕仙与人，自此连一张可同坐之桌也无。老仙默然良久，终举茶碗，饮之。\n此后廊下常有对坐者：一仙一人，各执一瓷碗，言至日暮。有少年吏过廊，见老仙以指画水于案，画山川形，少年立观，不敢咳。老仙画毕，以袖拂去，曰：「看明也未。」少年曰：「明白一半。」老仙笑，复画一遍，画至中途，停指，令少年续之。老仙居别院三月，临去留一物于石桌：一枚石子，纹如山水。甘雨取之，置于案，其后凡决疑难，先视此石。石上之纹，后为人磨去，石仍在案。甘雨不问谁磨，惟每日拭之。别院在月海亭西，院中一井，井水甘，仙凡共汲。"
 LYY_Event.4008.a:"请仙入城，共商疑难"
 LYY_Event.4008.b:"疏远仙家，各守其界"
 LYY_Event.4009.t:"税册初临垄上时"
 LYY_Event.4009.d:"宽税之令既下，乡间岁输减其三。榜张于县门，观者不信。有老农以指摩其字，摩至纸破，问县吏曰：「此纸可作准否。」吏曰：「可。」老农曰：「往岁亦有纸。」吏不能对。\n甘雨闻之，携税册下乡，坐于田埂，册摊膝上。乡人环立，无一人近前。甘雨乃指册上某行曰：「此户田三亩，往岁输粟九斗，今输六斗，所减三斗在此。又指一行曰：此户无田，只有桑百株，往岁亦输，今免。」众人始渐近，以指随其指而移。有妇人问曰：「明岁如何。」甘雨曰：「明岁之册，亦当摊在此处，任人看。」\n老农终取田契出，反复摩挲，不以示人，只以袖拭其面。日暮众散，甘雨犹坐埂上，册页为风翻动。有吏请收，甘雨曰：「再留一刻。此册一年只此一摊，摊过便入柜矣。」是夜县门之榜未揭，榜下多一行炭字，不知谁书：「明岁还在此处看。」县门在天衡南乡道侧，门前有石碾一，农闲时人坐其上。"
 LYY_Event.4009.a:"推行宽税，与民休息"
 LYY_Event.4009.b:"照旧征税，以充国库"
 LYY_Event.4010.t:"问天下何以太平"
 LYY_Event.4010.d:"贡院重开，号舍新葺，寒门子弟入者过半。是日雨，阶上泥深，考生多徒步而来，履袜皆湿，无一人以为苦。有卖饼者设摊于门外，价减其半，语人曰：「今日乃读书人之日。」\n甘雨亲拟第一题，只七字：「问天下何以太平。」卷进凡三百七十，糊名誊录，三试乃定。初取多引经据典之文，及覆试，有一卷只书八字：「使民有食，有衣，无畏。」\n甘雨于此卷前立良久，取笔判曰：「第一。」左右问其故。甘雨曰：「三千言者，皆言天下；此八字者，只言民。」言天下易，言民难。又问：「此子何人。」答曰：「桑农之子，年十九，未尝从师。」甘雨曰：「可使之从师矣。」榜张之日，其人不在。或问之，其邻曰：「归家收麦去矣。」甘雨闻之曰：「既知收麦，此卷不虚取。」贡院在玉京台北，号舍以竹为壁，雨则湿，考生以油布覆之。"
 LYY_Event.4010.a:"开科取士，广纳寒门"
 LYY_Event.4010.b:"循旧荐举，只用故旧"
 LYY_Event.4011.t:"东厢新设议事席"
 LYY_Event.4011.d:"文华内阁初立，无仪仗，无印绶，惟于月海亭东厢增置桌案数张，茶一壶，笔数管。第一次议事，至者九人，坐次不书官阶，只以齿序。\n议事未半，两老臣争论盐引，声渐高，一人拍案而起，茶盏倾，湿其袖，不顾。又一拍，案上纸散。书记执笔，目视甘雨，问记否。甘雨曰：「记。凡拍案几次，亦记之。」两老臣争至日昃，终无一字相让，亦无一字相诟。\n散时已暮，九人鱼贯出，两老臣一前一后，互不交一言，至阶下，其一忽止，候其二至，同下三级。甘雨立门内见之，语左右曰：「此可为内阁。」或问内阁者何物。甘雨曰：「一处使异见者得坐而论之地耳。」争于堂上，事于堂下，此文官之所以为文官。最费人者在此，最不可省者亦在此。东厢窗纸新糊，光入而柔，案上茶壶一把，杯九只。"
 LYY_Event.4011.a:"设文华内阁，共议国政"
 LYY_Event.4011.b:"事权独揽，以免纷争"
 LYY_Event.4012.t:"乡老初踏玉京台"
 LYY_Event.4012.d:"乡老议政之令下，选乡中年高有行者十二人入城。有乡老至玉京台，阶高九级，其人脱履，捧之而登，至第三级止，不敢上。左右欲扶，其人摇手，曰：「我脚上有泥。」\n甘雨自台上下来，引其手曰：「此阶为尔设，非尔为阶设。」其人乃上，足犹轻。及入席，众以其不识字，欲代书。乡老摇手，自怀中出纸条一条，上以炭画符记之，一符为一事。乃逐一指曰：「此渠坏，在村西三里；此堤裂，宽可容拳；此户孤儿，粮断两月，其名阿禾。」言至阿禾，声微颤，遂不再言。\n甘雨取笔，逐条书之，书毕，以册示之曰：「十二条，一条不落。」乡老起，欲拜，甘雨止之曰：「此十二条，比千篇奏章要紧。」乡老复坐，目中有光，手犹攥其纸条不放。散后，其纸条为书记取去，黏于册首，曰：「此乡老之奏章也。」阶侧有老吏执册，录乡老之名，名下有乡名，字皆端正。"
 LYY_Event.4012.a:"听乡老之议，采其民情"
 LYY_Event.4012.b:"拒于阶下，免乱章法"
 LYY_Event.4013.t:"牧人牵羊换新米"
 LYY_Event.4013.d:"田与牧，本两不相下。农人谓牧者逐水草而居，无恒心；牧者谓农人守一亩之土，所见者天小。两地之人，隔一岭而居，三十年不通婚，亦不通市。甘雨乃并二事为一市，以粮易皮，以畜易粟，官为主之，不取其息。\n初市之日，牧人牵羊三头至，立市东；农人挑新米一担至，立市西。两不相呼，日中无一人交易。甘雨使人置一案于市中，自坐案后，书一牌曰：「羊一头，米三斗，官定。」书毕即退。\n有顷，一牧人牵羊过案，以羊易米，负米而去。行数步，忽回身，向卖米者呼曰：「明岁还来。」农人举手应曰：「来。」众皆笑，市遂开。至暮，羊尽米尽。甘雨收牌，语左右曰：「定其价者，非我也，一呼一应也。此后市中每岁春秋二市，岭上岭下，遂有通婚者。」城北之岭接归离原，岭南种稻，岭北牧羊，中间山道，雨则滑。"
 LYY_Event.4013.a:"耕牧并举，互通有无"
 LYY_Event.4013.b:"专重农桑，罢止牧业"
 LYY_Event.4014.t:"云间立雪求一盟"
 LYY_Event.4014.d:"绝云间之雪，终岁不落人间。甘雨独自上山，不携从者，至仙家门前，立而不叩。守门者问：「来何事。」曰：「求一盟。」问：「盟者何物。」曰：「仙掌地利，人掌民事，各守其分。」守门者曰：「待。」\n待至日昃，门不开。雪落其肩，积而不化。甘雨不移足，亦不拂雪。夜半，门微开一寸，有物自内出，纸一卷，其上字迹模糊，若写若抹。门内有人语曰：「此纸不必当真。」甘雨对曰：「我亦不以它为凭，只以它为一句话。」\n甘雨受之，下山。随行者迎问：「盟成否。」曰：「成亦未成。」曰：「既模糊，何用。」甘雨指山下灯火曰：「山上肯开一寸之门，人间便多一条通天之路，虽细如丝，亦是一线。」是夜雪止。有人见甘雨归，衣上雪未化，行至灯下，雪乃化尽。随行者私记之曰：「雪落其身不化，至城而化，此非雪之异，乃灯之异也。」绝云间山门以石垒，门无扉，风雪直入，守者裹毡而坐。"
 LYY_Event.4014.a:"亲赴绝云，缔结盟约"
 LYY_Event.4014.b:"绝云难信，不必结盟"
 LYY_Event.4015.t:"高台一问无人答"
 LYY_Event.4015.d:"甘雨于月海亭前筑一台，高不过丈，无栏，无阶，四旁可上。台成，榜曰：「今日台上有问，愿答者上。」至者数百，市人、吏人、匠人、舟人皆有。\n甘雨登台，只问一句：「帝君既已归天，吾辈靠何而活。」台下先静。有顷，一人曰：「靠契约。又一人曰：靠礼数。又一人曰：甚么都不必靠。」三人言毕，众视台上，待其可否。台下有争者，争至面赤，而台上无一语。\n甘雨不判，曰：「此问，我问三千年，亦未问明白。今日交与诸君。」言毕下台，自人丛中出，无一语。众犹立台下，久之乃散。有少年独留，仰视空台，忽自语曰：「靠人。」旁无应者。是夜台未拆，灯一盏置于台心，风来不灭，守台者三易其油。有吏取纸视之，不敢留，亦不敢弃，乃夹于册中。台在月海亭前，四面可上，台面无栏，风大则人不敢立。"
 LYY_Event.4015.a:"坦然发问，任人作答"
 LYY_Event.4015.b:"自拟答案，颁告天下"
 LYY_Event.4016.t:"先问百姓后问官"
 LYY_Event.4016.d:"任官宪章成，第一条不过十二字：「为官者，先问百姓，后问上官。」书于册首，字大于他条。颁下之日，诸司传观，有笑者，有摇首者。\n有老吏读竟，摇首曰：「此乱套之始也。」上官不问，则令不行；百姓皆问，则事不决。甘雨闻之，不与之辩，但取宪章抄本数十，分授新任者，人一份，令其置于案右，曰：「不必读，只须日日见之。」\n越月，有新县令至，初见甘雨。甘雨问：「治下几乡。」答曰：「七乡。」又问：「七乡之中，最穷者何乡。」其人不能答，面赤。甘雨曰：「非责君也。君此去，先走一乡，回来再答。」其人果行，归而书于册，详记某乡井涸、某乡税重。甘雨览之曰：「此册比宪章有用。」宪章告之以向，此册示之以路。其册后为诸县传抄，抄者各增其乡名，三年而一县一册。宪章颁下，诸司各抄一份，抄本悬于月海亭东廊，印在末页，朱色未干。"
 LYY_Event.4016.a:"颁任官之章，先民后官"
 LYY_Event.4016.b:"仍守旧制，以官为先"
 LYY_Event.4017.t:"考成榜出满城哗"
 LYY_Event.4017.d:"考成之法，不考声名，只考实事：修堤几条，赈饥几次，清钱粮几何。榜出之日，满城哗然，观者自榜下排至街口。\n三位自号干练之老吏，皆落次等；一县丞姓陆，素寡言，评上上。或问其故，则曰：「陆某在任四年，通废渠十九条，未尝上奏，亦未尝请功。」验之，渠果通，田果熟，县中无一饥户。\n落等者不服，诣台自理，言其劳在案牍，且历陈其上司之褒语。甘雨取三册示之曰：「此君之册，字极工，批语满纸；此渠之册，无一字。」众视之，落等者默然退。有吏私问：「如此考法，恐伤老成。」甘雨曰：「老成者，使之为师，不使之临民。」榜下观者渐散，有一县吏独立案前，以指摹陆某之名，摹至再，乃去。是年冬，陆某迁，县民送之，携土一囊。榜贴于玉京台侧墙，墙旧，纸以浆粘，雨至则落。"
 LYY_Event.4017.a:"开考成之法，实绩论官"
 LYY_Event.4017.b:"循资历升迁，以免纷争"
 LYY_Event.4018.t:"堂下一问满堂哑"
 LYY_Event.4018.d:"明堂听政，许百姓立于堂下。初令下，无人敢来。来者亦多闲人，抱臂看热闹，听至半，辄去。有吏欲驱之，甘雨不许，曰：「来看者，亦是好意。」\n行之三月，堂下渐满，有坐地者，有携幼者，有卖饼者担其担立于阶侧。一日议河渠，一农人自堂下起，问曰：「渠成之后，水谁管。」满堂文官相顾，无一应。少顷，一主簿曰：「官管。」农人曰：「去岁亦官管，渠成三月而淤。」主簿不能对。\n甘雨在下首，徐曰：「此问当记。」乃命书记书之册首，曰：「渠成之后，水谁管。」散后语诸官曰：「诸君日读万言，答不得一句田间话。此非诸君之耻，乃吾立法之疏。」自是不设问禁，堂下问者渐多，问亦渐细，细至一斗一升。有老吏叹曰：「从前堂下无人，我辈自以为清明；今堂下满人，方知所漏者多。」明堂在月海亭署中，阶低，堂下可立百人，梁上有旧年彩绘。"
 LYY_Event.4018.a:"开明堂听政，许民列席"
 LYY_Event.4018.b:"闭门议事，以保威严"
 LYY_Event.4019.t:"义仓灶前一碗饭"
 LYY_Event.4019.d:"义仓膳堂立于诸区，灶火终日不熄。甘雨不令其为粥棚，曰：「粥棚者，施也；膳堂者，食也。」乃访城中善炊者，得厨娘三人，厚其俸，令掌勺，又令其与食者同坐而食。\n第一锅饭出，饥者列于阶下，无一人先入。有小儿年七八，捧碗在手，举箸复止，先抬头视厨娘。厨娘乃蹲其身，与小儿平，以手按其顶曰：「吃。此间无人笑尔。」小儿始低头，一口一口，食至碗空，以指抹碗沿，抹至再，乃止。厨娘转身，以袖拭目，伪为拭汗。\n日暮收灶，甘雨至，问今日几碗。厨娘曰：「一百四十七碗。」甘雨曰：「明日多备十碗。」厨娘问：「何以知多十人。」甘雨曰：「今日有立在阶下不肯入者十余人。」言毕，视灶中余火，久而不去。厨娘问：「公亦饥否。」甘雨曰：「我在此看火，比食饭好。」义仓膳堂在璃月港城南，灶为土垒，锅大如轮，柴取山中所伐枯枝。"
 LYY_Event.4019.a:"立义仓膳堂，体面济贫"
 LYY_Event.4019.b:"只设粥棚，聊以果腹"
 LYY_Event.4020.t:"新斗既颁旧斗藏"
 LYY_Event.4020.d:"度量归一，最犯众怒。诸商旧各有斗，官斗民斗相去悬绝，一斗之亏，积年成山。甘雨铸新衡器若干，颁于诸坊，令逐户校准，用旧器者罚。\n榜出三日，无一人至。第四日，有掌柜抬旧斗至市中，当众掷之于地，斗裂，木片四散，且掷且骂曰：「三百年之斗，今日死于此。」观者塞途，无一人应。甘雨在楼上见之，不发一言，亦不使人捕，只令书记记其名。\n一月之后，市中交易皆用新斗。或问掷斗者：君何以改。其人曰：「不改则无人与我易。」又曰：「新斗之量，比旧斗多二升，客乃肯来。」言至此，其人自笑，笑已，俯身拾地上木片一片，纳于袖，曰：「留个记认。」甘雨闻之曰：「法之行，不在罚，在算。」罚者使之畏，算者使之服。罚者使之畏，算者使之服，畏者一时，服者十年。新斗自月海亭颁下，以铁箍木，斗口平，斗底厚，量以水校之。"
 LYY_Event.4020.a:"铸衡归一，分毫不让"
 LYY_Event.4020.b:"随俗从众，不计尺寸"
 LYY_Event.4021.t:"鸣冤鼓移置街口"
 LYY_Event.4021.d:"衙门前旧有鸣冤鼓一面，悬三十年，鼓面蒙尘，无人敢击。甘雨命移之，置于南市最喧处，去衙门三里。移鼓之日，观者如堵，无一人言。\n鼓既置，甘雨使人书一牌于侧：欲告状者击之，不问何人，不问何事。书毕，市人相顾，久无击者。至第三日午后，有一妇人抱状纸至，手颤，击之三，声不响，盖力弱也。旁有少年代其击，一击而鼓鸣，市人皆回首。妇人遂跪，跪未及地，为旁人所扶。\n自此鼓声不绝。月余，鼓面斑驳，破处以布补之，补至再。有老吏叹曰：「此鼓昔在衙前，为陈设；今在街口，为民用。」甘雨闻之曰：「鼓非变也，击之者变也。」击鼓之人面上有光，非惧色也。\n守鼓者每日拭之，拭毕以掌按鼓面，听其声，日久亦能辨击者之缓急。鸣冤鼓移于璃月港南市街口，鼓面用牛皮，钉头露出，摸之刺手。"
 LYY_Event.4021.a:"鸣冤鼓移于街头，许民直诉"
 LYY_Event.4021.b:"鼓归衙门，非重案不敲"
 LYY_Event.4022.t:"士子拂衣出经馆"
 LYY_Event.4022.d:"经学馆重开，甘雨定讲席三：一讲帝君旧训，一讲刻晴新论，一请商会账房教人算一本清白之账。三席同日，不偏其一。\n第一日，旧训讲毕，新论继之。座中士子渐有变色者。及账房登席，执算筹言出入之法，一老士子忽推案而起，拂衣竟出。至门，回身曰：「圣人之堂，可与商贾同席乎。」甘雨在末座，不起，亦不答。其人遂去，从者三人。\n次日，其人不来，座中空一位。甘雨命设此位于堂中，不撤，曰：「留与他日。」或问：「学问当以何者为正。」甘雨曰：「学问若能答市集之问，能答田埂之问，即为正。若只供殿上人揣摩，则是一幅字，挂在墙上好看，风来即卷。」问者曰：「既如此，何以仍讲旧训。」甘雨曰：「旧训亦答过问，只是它答者，三百年前之问。」经馆在玉京台东，讲堂三间，窗对一株老柏，柏已半枯。"
 LYY_Event.4022.a:"经学馆内，兼采众说"
 LYY_Event.4022.b:"只授旧训，禁议新政"
 LYY_Event.4023.t:"璃月账缺你一笔"
 LYY_Event.4023.d:"战乱之中，读书人多遁入山林，或卖卜，或教书，或躬耕自给。甘雨命使者持书四出，一请不至则再请，再请不至则亲往。\n先至者三人，皆鹤发。甘雨出城门迎之，不设仪仗，立于道左。一老学士下车，见之，趋而避曰：「岂敢。」甘雨曰：「非为礼也，为账也。璃月之账，缺汝等这一笔。」其人闻言，立而不动，久之，以袖掩面，泪下。\n是夜设席，不议政，只问山中几年、所读何书、门下几人。老学士言及旧日同侪，有死于乱者，有降于敌者，言至半，停箸不食。甘雨亦不食，待其言毕，乃曰：「死者不可追，降者不必追，来者当追。」次日，又有七人至。其后数月，凡归者四十余人，皆列名于册，册首题四字：「荒废之学。」其后此册常置甘雨案侧，来者问政，必先令阅一页。使者所持书用素纸，封以蜡，蜡上有月海亭小印。"
 LYY_Event.4023.a:"遣使迎贤，礼聘归朝"
 LYY_Event.4023.b:"任其隐逸，不劳相请"
 LYY_Event.4024.t:"一抔新土掌中温"
 LYY_Event.4024.d:"授田之制下，荒田重分于耕者。书吏丈量，以绳定界，绳所至，即为其田。甘雨常至田间，不乘舆，徒步至埂上，蹲而观之。\n有老农方受田，书吏去，独留埂上，俯身捏土一撮，置舌尖尝之，闭目良久，又捏一撮，攥于掌，攥至再。甘雨问曰：「此土咸不咸，够不够种。」老农不答，只憨笑，又攥一把。\n甘雨复问。老农乃曰：「够了。」能有这么一把土握在自己手里，就够了。言毕，以掌覆土，若护一物。甘雨起，视四野，新插界桩如列。语书吏曰：「此后丈量，遇老农尝土者，勿催。」书吏唯唯。是日归途，甘雨袖中亦带土一撮，至月海亭，置于案头，与图籍并列。有吏问此何物，甘雨曰：「此一县之底也。」吏问：「底者何解。」甘雨曰：「无此一撮，则图上之田，皆纸上之田。」所分荒田多在城西坡上，土薄，下有石，耕者须先拾石。"
 LYY_Event.4024.a:"授田与耕者，丈量均分"
 LYY_Event.4024.b:"田归原主，维持旧契"
 LYY_Event.4025.t:"摄政印压案三日"
 LYY_Event.4025.d:"摄政之印铸成，铜质，钮作麒麟。甘雨受之，不即启用，置于案上三日。三日之间，凡须用印之政令，皆先取来，逐条核其合规合矩。合者置左，不合者置右。\n至第三日暮，左右请曰：「印可落否。」甘雨曰：「可。」乃取第一纸，濡朱，落印于其末，朱色极正。落印之时，堂中无一人语，惟闻印石触纸之声，笃然一声。\n有近臣不解，问曰：「印者，权之凭也，何待三日。」甘雨曰：「印，死物；握印之手，活人。此印要紧处，不在其为权之凭，在其日日提醒执印者：权，须有人看着。」言毕，取不合者一叠，尽焚于庭，火光映面。左右无一人言。\n灰烬扫尽，甘雨乃以布覆印，曰：「明日再用。此后每用印，必先覆核其左之纸，已成旧例。不合者虽至亲不可，合者虽仇亦不滞。」摄政之印藏于月海亭，铜铸，钮作麒麟，一角铸时未及修，略歪。"
 LYY_Event.4025.a:"启用摄政之印，依章行权"
 LYY_Event.4025.b:"暂缓用印，以观其变"
 LYY_Event.4026.t:"人仙之约如家规"
 LYY_Event.4026.d:"人仙共治之约成，其文不过数十行，写得似一份家规：仙掌地利，人掌民事；遇有争执，请乡中德高者裁之；德高者亦不得专断，须集众再议。\n散仙读罢，有嗤笑者曰：「此约太软，软如绵，不足以缚人。」又一人曰：「模糊若是，他日谁解之。」甘雨在座，答曰：「吾正不欲立一个斩钉截铁之断。」断得太利，则一断之后无可再议；模糊一点，乃有商量余地。\n问者曰：「余地何用。」甘雨曰：「乱世之中，余地最贵。」人有余地，则不至于一言之失而终身不齿；国有余地，则不至于一策之误而举族相仇。言毕，取约一卷，授问者曰：「君既嫌其软，可试以力断之，看断得几时。」其人受约，不答而去。三月之后，其人复至，还约一卷，纸角已破，曰：「此约吾断过三次，未能断。」约文写于绢，绢长三尺，卷而藏于月海亭架上。"
 LYY_Event.4026.a:"缔人仙共治之约"
 LYY_Event.4026.b:"划清仙凡，各不相犯"
 LYY_Event.4027.t:"一城容得一张凳"
 LYY_Event.4027.d:"仙凡各安，说来轻巧，行之则处处皆坎。有仙家嫌人间尘嚣，昼不出户；有人间忌仙家清高，见之则避。一城之中，同行而不相视。\n甘雨不急于调和，亦不下令强合。其所为者，只一事：于城中诸坊，各置长凳数张，不设座次，不分仙凡，来者皆可坐。凳置于巷口、树下、井旁，皆人常过之处。\n初时无人同坐。一仙一凡各据一端，中间空出三尺，久而不语。越旬，有老者携棋至，置于凳中，自坐一端，对面无人，乃自弈。一少年过，立观片时，遂坐其对面。是日棋至三局，二人未通姓名。甘雨闻之曰：「不必相爱，只须不相害，已为人间难得之太平。」后凳朽者三，皆有司即换，不待请。巷中童子亦渐知，凳上一端，常留与后至者。一城之凳置于天衡南巷树荫下，木为旧梁改制，一端有榫孔。"
 LYY_Event.4027.a:"为仙凡留一张长凳"
 LYY_Event.4027.b:"分立两城，各安其居"
 LYY_Event.4028.t:"太学门额四字题"
 LYY_Event.4028.d:"太学落成之日，不张乐，不宴宾。甘雨自书门额四字，悬于门楣，字不甚工，笔画有斜。匠人请易以善书者，甘雨曰：「不必。此四字乃吾手书，写得不好，学生看得见。」\n士子环立，有不解者问曰：「此四字当作何解。」甘雨曰：「读书非为作官，亦非为避名。所求者，一日面对一桩不公之事，说得出，亦扛得住。」问者曰：「说得出易，扛得住难。」甘雨曰：「故先学说得出。」\n太学之中，最热闹者非讲堂，乃末一间辩论堂。其堂无讲席，只有长桌一张，灯数盏，通宵不熄。夜深人静，隔墙犹闻争声。守门老卒尝语人曰：「此堂之灯，比吾睡得晚。」\n甘雨每月一至，至则不坐主席，只择末位坐下听，听至天明，默然而归。有人问其所听，曰：「听彼等何处说错。」璃月港太学门额为素木，未漆，字以墨书，墨入木纹，久而不褪。"
 LYY_Event.4028.a:"太学立门额，为不为名"
 LYY_Event.4028.b:"太学只育官，专攻举业"
 LYY_Event.4029.t:"满城灯亮到月落"
 LYY_Event.4029.d:"月海之治诏书，甘雨三写三废。第一遍辞藻太盛，自览而弃；第二遍条陈太密，付吏而弃；第三遍改至夜半，笔忽停，乃取最初一稿，展于案上。\n那一稿只有一句：「愿此后璃月，饥者有食，寒者有衣，屈者有理可诉。」甘雨视之良久，曰：「此三事，吾做三千年，只成一半。」乃落印。落印之后，又取笔于纸角添四字：「做不到者，罚我。」\n颁诏之夜，檄至诸坊，满城之灯次第而起，亮至月落。无锣鼓，无欢呼，人但立灯下读之，读毕或默或叹。\n有老人立于十字街口，读至屈者有理可诉一句，忽向北再拜，拜毕自袖中出一旧契，就灯焚之。旁人问焚者何物。老人曰：「旧年状纸，今日不必留。」甘雨在楼上见火光一点，问左右：此何火。曰：「旧状纸。」甘雨曰：「此火好。」月海之治诏书三稿皆存于月海亭档，第一稿纸最好，第三稿纸最破。"
 LYY_Event.4029.a:"颁月海之治诏"
 LYY_Event.4029.b:"暂缓颁诏，以观人心"
 LYY_Event.4030.t:"契约末行名曰雨"
 LYY_Event.4030.d:"千秋之雨，非为一人而降。甘雨于契约之末，亲书数行：「此法今日立，未必今日尽美；愿后人以宽容待之，以公心正之。」书毕，又添一行：「凡我子孙，得改此约，不得废此约。」\n有属吏问曰：「既知其未尽美，何不待其尽美而后立。」甘雨曰：「待其尽美，则永无立之日。」天下之法，皆是有缺之法，能用者胜。又曰：「此约名为雨。」问：「何取于雨。」曰：「雨不择地，不择时，不择人，落下来便落下来。」\n是夜雨果至，檐溜有声。甘雨启窗，以手承之，视掌中水，语左右曰：「一场善政，未必活得过一代；一种善念，可传十代。此约若废，我不怨；若改，我不怒。惟愿改之者，比我更肯算账。」言毕，闭窗，掌中之水已尽，惟指缝间尚有一点，久而不落。室在玉京台西，无窗，炭盆一，湿气尽收于炭。"
 LYY_Event.4030.a:"立千秋之约，托付后人"
 LYY_Event.4030.b:"只定一年之法，随势而变"
 LYY_Event.4031.t:"一场婚礼一场丧"
 LYY_Event.4031.d:"六礼复兴，乃旧制中最硬之骨。冠、婚、丧、祭、乡、相见，一礼一规，重新郑重拾起。礼官考旧档，参以时宜，删其太繁者三十余条，存其不可废者。\n有讥之者曰：「此倒退也。」兵火未息，而修婚丧之仪，何异于堂焚而理琴。甘雨不辩，但请其人同往观一礼。是日城南有婚，无鼓乐，无彩帛，新郎步行至女家，三揖，女家三让，然后迎归。观者夹道，有妇人拭目。\n归途又过一户，门前挂素，是丧。一老妇执礼官之袖问曰：「我儿死于乱，无棺，今可补一礼否。」礼官曰：「可。」老妇乃跪于阶，三拜，拜毕不起。甘雨立于街角，久之，语从者曰：「人间尚未崩坏，证据在此。」从者问：「此礼何益于国。」甘雨曰：「无益于国，有益于人。」是年冬，礼官上言：「六礼之行，乡中争斗减三之一。」礼官考旧档于库，库在月海亭后，架间仅容一人。"
 LYY_Event.4031.a:"复兴六礼，重铸人心"
 LYY_Event.4031.b:"废除旧礼，一切从简"
 LYY_Event.4032.t:"神像会朽约不朽"
 LYY_Event.4032.d:"契约重新奉为神圣。甘雨集诸司于月海亭，取帝君旧约真本，置于案中，率众三揖。揖毕，语众曰：「帝君所留者，从来是一份契约，非一尊神像。」\n有司请曰：「真本当归何处。」甘雨曰：「供于亭之最深处，非大祭不启。」又曰：「抄本几何。」曰：「请发遍诸坊。」众皆愕然。甘雨曰：「神像会朽，石会裂，金会熔，惟纸上之字，只要有人肯按手印，便一日不死。」\n于是抄本数十，分送诸市集、诸村口、诸渡头，任人取阅，不取一钱。有村叟得之，不识其字，请塾师读，读至输粟减三一句，村叟曰：「此约我认得。」乃以拇指沾墨，按于纸末。墨迹歪斜，而其上无官印。甘雨后闻之，曰：「无印者，人之约也。此约方活。其后村中凡有约，皆不用印，只按指。」真本以绢为底，绢色微黄，字口清晰，惟末行稍淡。"
 LYY_Event.4032.a:"奉契约如神，遍颁抄本"
 LYY_Event.4032.b:"契约存库，不必宣扬"
 LYY_Event.4033.t:"何时当跪何时立"
 LYY_Event.4033.d:"礼制之司立，所管者分寸：何时当跪，何时当立，何人当先，何事当后。其目数百条，书成三册，颁于诸司。\n有少年吏读之，愤然曰：「此以活人塞死规矩也。」甘雨闻之，召其人至，问曰：「君昨日入衙，遇长者于门，谁先入。」少年曰：「长者先。」问：「何以知之。」曰：「习惯耳。」甘雨曰：「习惯者，即未写成之礼也。今不过写出来，何怒之深。」\n少年不能对。甘雨又曰：「分寸二字，为使一群素不相识之人，亦能彼此体察。」礼崩之后，最可怕者非争，乃人人不再顾他人之体面。言毕，取一册授之曰：「君既嫌其繁，可自删之，删至无可删，再来告我。」少年捧册而出，越月复至，册上朱笔满纸，所删者不过九条。甘雨视之，曰：「君所存者，比我原册要紧。」礼制三册藏于月海亭礼司，青布为函，函上题字，字为礼官手书。"
 LYY_Event.4033.a:"立礼制之司，严定分寸"
 LYY_Event.4033.b:"礼法废弛，任人自处"
 LYY_Event.4034.t:"一纸批文开一册"
 LYY_Event.4034.d:"籍册封存，自此查人、查户、查田，皆须官府一纸批文。批文三色，白者常查，黄者要查，朱者密查，非三司会签不得用。\n初行之时，批文极难，一纸之出，必经两日。甘雨自督之，曰：「难些好，难则不敢轻用。」行之半年，属吏渐熟，批文之出，一日可办，且不必三司会签，只须一押。有吏请增其便，甘雨许之。\n是夜，甘雨独坐，案上批文一叠，朱者三。她取其一，视所查之名，忽忆少年时所读史书，书中有暴秦一节，言其户籍之密，密至邻人相察。乃合卷，低声曰：「特暂耳。此语无人闻，唯烛花爆响一声。」次日批文之制仍如故，惟朱者之数，她另立一册记之，月终自省一次。所记凡二十七纸，每纸之下，皆书同日四字：「不得已。」籍册库在月海亭署后，门三重，钥分三人，三人不同至则不开。"
 LYY_Event.4034.a:"封存籍册，凭文查籍"
 LYY_Event.4034.b:"籍册公开，任人查录"
 LYY_Event.4035.t:"代天理物四字诏"
 LYY_Event.4035.d:"摄政奉天，把甘雨权柄抬至一个连她自己亦不安之位。诏书成，中有四字：「代天理物。」书于绢，朱文，悬于殿中。\n甘雨立其下，视之久。左右以为喜，贺曰：「此天所命也。」甘雨不答。良久，取笔，就诏侧批八字：「天无言，人声即天声。」批毕，指其字示左右曰：「此八字，比那四字要紧。」左右请曰：「既批之，当颁行否。」甘雨曰：「不颁。」\n乃取诏卷起，压于所有文牍之最下，其上堆册至尺余。既不肯撤，亦不肯使之轻易见人。有近臣问其故。甘雨曰：「代天者，最易忘其为代。压在此处，吾日日见此堆，则日日记得底下有甚么。」\n言毕，以手按堆顶之册，按至再，乃去。此后每月朔，必抽此诏一看，看毕复压。压时有声，极轻，若纸自相触。代天理物之诏悬于月海亭殿中西壁，绢色明黄，边以木轴卷之。"
 LYY_Event.4035.a:"摄政奉天，代天理物"
 LYY_Event.4035.b:"只称摄政，不加天命"
 LYY_Event.4036.t:"礼判不端难抬头"
 LYY_Event.4036.d:"礼教之乡，以礼为法，以教代刑。乡里纷争，多由德高者调之，官府退居幕后，但备其案而已。行之三年，讼狱大减，夜不闭户者十余村。\n其安静，其有序，其有人情，皆可爱。直至有一事：乡中一妇，夫死改嫁，礼评为不端。乡老集众议之，不笞，不罚，只令其不得入祠，不得与祭，不得与乡饮。妇人亦无怨言，携子徙于村外三里。\n三年之后，其子长成，乡中无人与之婚。甘雨偶闻此事，问乡老曰：「此妇何罪。」乡老曰：「无罪，但不端耳。」甘雨默然，归而语左右曰：「礼教最温柔之一刀，所砍者，恰是最不合群之人。吾不惧其严，惧其无声。」\n左右问曰：「既知之，何不废。」甘雨曰：「废之，则连那些真肯管邻人死活者，亦一并废之。」左右问：「然则奈何。」甘雨曰：「使之有声而已。」归离原诸村德高者多居老屋，屋前有石阶，阶上常坐人。"
 LYY_Event.4036.a:"以礼教代刑罚"
 LYY_Event.4036.b:"律法居先，礼教为辅"
 LYY_Event.4037.t:"市集冷而炊烟旺"
 LYY_Event.4037.d:"抑商重农，令下：商籍不得入仕，不得衣帛，不得乘车；田亩之税再减其二。令行三月，市集冷落，铺户闭者数十；而四乡炊烟，比往年密几分。\n甘雨尝微行至市，见一布铺半闭，掌柜坐门限上补袜。问曰：「生意如何。」掌柜曰：「官家不喜吾辈，客亦少矣。」问：「可改营他业。」曰：「改则为农，吾不谙犁。」甘雨无言而退。\n归途见田中有新垦者，土色尚黄，一老农方扶犁，牛瘦，犁却直。甘雨立于埂上，问曰：「今岁可望熟否。」老农曰：「望。」问：「何望。」曰：「田属吾。」\n甘雨闻之，顾左右曰：「吾非不知商贾之利。」只是固执地信一句话，根扎于土者，比钱驮于牲口者，不轻易于乱世中走失。言至此，复顾市中，帘半垂，久无人入。甘雨回视其帘，忽命人取布一匹赠之，不署官名。璃月港南市铺户数十，闭者过半，门板上犹有旧年招贴。"
 LYY_Event.4037.a:"抑商重农，固本培元"
 LYY_Event.4037.b:"农商并重，各从其利"
 LYY_Event.4038.t:"家宴上看谁错席"
 LYY_Event.4038.d:"忠信之局立，所录者皆忠于礼制之人。其人不贪，不占，案无留牍，办事利落。惟其目渐尖。\n尖至何等地步。一乡绅设家宴，宾客三十，局中一员在座。席间忽起，至末席，谓一少年曰：「君坐此，非君之位。」少年惶然。其人曰：「君父在，君当在君父之下。」满座寂然，主人再三谢，乃止。宴罢，少年之父归而责子，子不服，遂成父子之隙。\n甘雨闻之，召局中诸人，问曰：「汝等所纠者，席也，礼也，抑人也。」一老员对曰：「礼不正，则人不安。」甘雨曰：「礼正而人相怨，此礼何用。」众不答。是夜甘雨批局中名录，笔至一二人名，停而不下，久之乃批曰：「留。」既提拔之，又隐隐畏之，尝语人曰：「无人比一个真信己在替天行道者，走得更远。」家宴设于玉京台内堂，席次以尊卑列，错一位则举座皆觉。"
 LYY_Event.4038.a:"设忠信之局，察吏治民"
 LYY_Event.4038.b:"裁撤密探，还政于明"
 LYY_Event.4039.t:"抱旧典者争一字"
 LYY_Event.4039.d:"旧法之守护者，遂为新朝里最固执之一群。彼等抱帝君所遗老法典，不肯撒手，凡新政之出，必逐条比对，逐处争辩。\n有司苦之，请甘雨禁其言。甘雨曰：「不禁。」一日议事，一老吏持卷争一事，言某条出自某年，某字当作某解，与今议不合。争至日昃，众皆倦，其人神色不变。甘雨忽问曰：「君争此一字，争几日。」曰：「七日。」问：「得之何益。」曰：「不得，则我夜不能寐。」\n甘雨乃谓众曰：「诸君听之。此一字之差，在座无人肯为之力争七日。」众惭。自是议事，必先请其言。甘雨尝语人曰：「人皆欲改，独彼欲守。」肯为一句话之出处较真到底者，最接近公道二字。其后老吏病，不能至，犹令人持卷至榻前，口授其辩。甘雨闻之，亲至其榻，坐至夜分。帝君旧典藏于月海亭库，绢本十二卷，卷端有旧印，印色已暗。"
 LYY_Event.4039.a:"尊旧法守护者，共议律例"
 LYY_Event.4039.b:"另立新法，不必拘泥"
 LYY_Event.4040.t:"台谏缄口奏章软"
 LYY_Event.4040.d:"台谏遂默。昔年专摘君上错处之言官，今则只摘些无伤大雅之小疵：某处仪注稍疏，某人文牍误一字，某事调度迟一日。奏章越写越客气，尾必缀以伏惟圣裁。\n甘雨日览数十章，无一字及于国之大者。一日，召一台谏入，问曰：「近日所纠，何者最重。」其人思良久，曰：「某县祭器不洁。」甘雨曰：「祭器不洁，比边饷不足如何。」其人俯首曰：「不足者，非臣所敢言。」问：「何不敢。」曰：「言之则近于谤。」\n甘雨不言，命退。是夜独坐，取近年奏章与往年者并列。前者厚而软，后者薄而硬。视至三更，以手覆之，语侍者曰：「使台谏闭口者，非我也，是此太平得叫人不敢出声之世道。」最深沉寂，往往不是被迫。侍者不解，甘雨亦不再言，只取往年一疏，就灯重读，读毕折好，置于案右。奏章自台谏司送入月海亭，白纸小字，边留宽白，以备朱批。"
 LYY_Event.4040.a:"任台谏缄默，求一时之安"
 LYY_Event.4040.b:"重开言路，纵其争谏"
 LYY_Event.4041.t:"天地一网先自网"
 LYY_Event.4041.d:"天地一统，礼制之尽头，是人间秩序与天道秩序，终于缝成一张网。网目相衔，无缝可寻。\n网成之日，无人称庆。诸司上表，文极工，字极正，辞极顺，读之无一处可驳。甘雨受表，一一阅之。阅至末，忽觉手冷。乃起，行至庭中，仰视天，天无云；俯视地，地有砖，砖缝极齐。\n有少年吏侍侧，问曰：「公何视。」甘雨曰：「视网。」少年不解，四顾曰：「网安在。」甘雨曰：「在尔我言语中，在诸司文书中，在今日此庭砖缝间。」少年悚然。甘雨又曰：「此网整齐，庄严，无懈可击。惟网眼太小，容不下一只想往别处飞之鸟。」言至此，顿住，良久乃曰：「我织此网，最先网住者，恐怕是我自己。」言毕，俯身拾庭中一叶，叶上有虫蛀一孔，视之良久，乃放之。月海亭庭中一叶落于阶，叶背有虫蛀，蛀孔透光。"
 LYY_Event.4041.a:"缝天人之网，一统礼法"
 LYY_Event.4041.b:"留网眼予异见"
 LYY_Event.4042.t:"链无尽头匙在手"
 LYY_Event.4042.d:"不绝之链，把摄政之位织成一条不见其端之锁链。誓词中有言：「只要璃月一日未复旧观，吾一日不退。」\n誓毕，有老臣问曰：「旧观者，何模样。」甘雨曰：「如帝君在时。」老臣曰：「帝君在时，亦有乱，亦有饥，亦有讼不平者。」甘雨默然。老臣又曰：「若彼时亦如此，则旧观已复，公当退；若彼时亦不如此，则公所求者，非旧观也。」\n甘雨不答，起身入内。是夜，她取链样一具，铜制，环环相扣，置于案上，自锁其端，又自解之，凡三。锁时链声细，解时链声亦细。天明，链仍置于案，未收。左右入见，不敢问。甘雨指之曰：「此链之钥，在吾手里。此语一出，堂中无一人应。」良久，一老吏低声曰：「匙在公手，则链不在人身。」甘雨闻之，不怒，亦不答。不绝之链誓词刻于铜牌，牌悬月海亭殿左，字为阴刻，摸之可辨。"
 LYY_Event.4042.a:"以不绝之链，续摄政之权"
 LYY_Event.4042.b:"定还政之期"
 LYY_Event.4043.t:"改暂摄作永摄诏"
 LYY_Event.4043.d:"摄政永续。甘雨亲改诏书措辞，凡暂摄二字，尽改为永摄。改至末行，笔锋一顿，墨聚成点，点下如豆。\n改毕，她不召人，不颁行，独坐至天明。案上置印一枚，用半生，钮上麒麟之角已磨平。她以指摩之，摩至再，忽忆三千年前初受此印时，帝君在侧，笑曰：「等你哪天不想摸了，就该还回来了。」\n那时她亦笑，未答。如今印在案上，其笑不闻。窗外天色渐白，雀声起。她取诏卷起，以绳系之，置于架上最高处。侍者入，请曰：「诏何时下。」甘雨曰：「今日。」侍者退。她复取印，濡朱，落于诏末，朱色比往日淡，盖手久不动，血不赴指。落印既毕，以指按朱处，按至干，乃起。是日诏下，读者多不及察其一字之改。老臣中有觉者，亦不敢言。月海亭改诏，墨点为笔锋所聚，干后凸起，指按有涩感。"
 LYY_Event.4043.a:"改诏为永摄，权柄不移"
 LYY_Event.4043.b:"坚守暂摄，定期归政"
 LYY_Event.4044.t:"碑前焚香人已非"
 LYY_Event.4044.d:"旧约重立，取帝君当年之契，一字不差，重刻于石，颁行天下。石高九尺，立于玉京台下，字口深，可容指。\n立碑之日，百姓争赴，以香插于碑前，香灰积寸，扫地者不敢倾，以器盛之，埋于树侧。有老妇携孙至，令孙以手摩碑上之名，曰：「此名，汝当记得。」孙问：「此何人。」老妇曰：「神也。」孙曰：「神安在。」老妇指天，不能答。\n甘雨立远处观之，不近碑，亦不焚香。左右问曰：「公何不拜。」甘雨曰：「碑上那名字之主，早已不在。」左右不敢复言。\n良久，甘雨曰：「自今而后，守此约者，非碑上之人，乃无数平凡到记不住名字之活人。」言毕，转身，身后香烟如线，直上不散。有风过，香烟不乱。守碑者夜以帚扫灰，灰不弃，盛于囊，岁终埋之。石取天衡，高九尺，须以四十人曳之，曳三日方至。"
 LYY_Event.4044.a:"重立帝君旧约，昭告天下"
 LYY_Event.4044.b:"另立新约，不必循旧"
 LYY_Event.4045.t:"三千年账一人记"
 LYY_Event.4045.d:"三千年之账，甘雨一人默记。哪年大旱，哪年丰稔，哪家添丁，哪户绝后，皆在其册。册不藏于库，置于案侧，随手可翻。\n有年少属吏偶启一册，见其上字迹密如蚁，一页之内，记十余户。问曰：「此何用。」甘雨曰：「无用。」问：「既无用，何记之。」曰：「记之者，我不敢忘耳。」属吏复问：「三千年来，皆公一人记之。」曰：「然。」问：「不倦乎。」甘雨不答，取册翻至某页，指一行曰：「此户三世单传，今岁得子。又翻一页，指一行曰：此户今岁绝。」\n夜深，属吏退。甘雨独坐，忽自语曰：「这一本本流水账，为谁而记。」帝君在时，替神记；帝君去后，替自己记。记到后来，竟分不清：是我记着璃月，抑璃月一直记着我。言毕，取笔添今日一行，字极小，写毕以指掩之，若怕人看见。甘雨之账置月海亭案侧，线装麻线，断则重缝，缝处打结。"
 LYY_Event.4045.a:"承认旧账，续记新篇"
 LYY_Event.4045.b:"掩去旧账，只记将来"
 LYY_Event.4046.t:"层岩之下加一封"
 LYY_Event.4046.d:"层岩之下，有比契约更古老之裂痕。其深不可测，其声夜出，如有人在底下推石。甘雨亲率工匠往封之，一路无言。\n至裂口，风自下出，冷如冰。工匠列石，以铁锢之，凡三层。甘雨立其侧，视石缝，忽问曰：「此缝，封过几次。」一老匠曰：「我祖父封一次，我父封一次，我封一次。」甘雨曰：「汝祖父所封，今安在。」老匠指最下之石曰：「此即其物。」缝已在其外。\n封毕，甘雨以手按石，按至掌冷。回程不语。将至城，忽语随行者曰：「最令神明头疼者，从来在深渊。」它总在人最得意时提醒一句：「无论人间立起多高大厦，底下都压着一层，是连神亦照不见之处。」随行者问：「既如此，封之何益。」甘雨曰：「封一日，便安一日。」言毕，回头看山，山已为云所没。封处以铁水灌缝，凝而成青，敲之音清，久而不散。"
 LYY_Event.4046.a:"亲赴层岩，加封裂口"
 LYY_Event.4046.b:"委派他人，按例行封"
 LYY_Event.4047.t:"山中炊烟比城稠"
 LYY_Event.4047.d:"乱世之中，最先被牺牲者，是最不会呼喊之百姓。甘雨下令开放山中洞天与谷地：凡流民，不问来处，皆许栖身，给种一季，不取租。\n有司争曰：「此养虎也。」聚数千无籍之人于山谷，他日一呼，何以制之。甘雨曰：「制之者兵，养之者粟。今粟在山，兵亦在山，何忧。」有司曰：「然则耗粟。」甘雨曰：「耗粟者，今日之粟；得人者，他年之力。」\n令下三月，山中炊烟渐起，初数十缕，继而百余，入秋乃比城中稠。甘雨尝一至，不入村，立山口望之。有童子自坡上下来，抱薪一束，见甘雨，不避，问曰：「汝是官么。」甘雨曰：「然。」童子曰：「官来了，饭还有么。」甘雨曰：「有。」童子乃去，行数步，又回身曰：「我阿娘说，今年不必走了。」甘雨顾左右曰：「一国之力，看它如何待那些于己无用之人。」洞天在庆云顶下，洞口有石，石上刻旧年避乱者之名。"
 LYY_Event.4047.a:"开放山中，庇纳流民"
 LYY_Event.4047.b:"封锁山口，固守险要"
 LYY_Event.4048.t:"借粮可也借路不可"
 LYY_Event.4048.d:"至冬来书，用词极客气，条件却硬：只要璃月肯开一口岸，至冬即包揽其三年粮运，运费减半，损失自认。使者候于馆，言笑温然，坐不安席。\n甘雨读其信，读之再三。侍者请曰：「如何答。」甘雨曰：「借粮可也，借路不可。」侍者曰：「彼所求者，即路也。」甘雨曰：「故当先许其粮。」乃取笔回函，书曰：「璃月可借粮，不借路。」写完，又添一句：「我不疑君之诚意，我疑者，是雪化之后，留下那一摊水。」\n使者得书，颜色微变，问曰：「此言何解。」甘雨曰：「雪在时，路白；雪化时，路泥。」泥路上走过之人，脚印留得比谁都深。使者默然，收书而去。甘雨送至阶下，忽曰：「粮不必减半，照价便可。此语一出，使者反而回顾一眼。」那一瞬，笑已不在脸上。至冬使者候于南码头东馆，窗外即泊位，日夜有缆声。"
 LYY_Event.4048.a:"拒借路，只借粮"
 LYY_Event.4048.b:"接受北援，共理粮运"
 LYY_Event.4049.t:"寻常清晨最是重"
 LYY_Event.4049.d:"任重，道远。此四字，甘雨书于与同僚之信中。\n书曰：「我此生所任最重之役，乃每日清晨，将今日当为之事，一件一件想明、排定，再一件一件做毕。」\n又曰：「撑一国者，从来只在无数寻常之清晨。汝须于每一清晨，皆仍愿坐回那张椅子上。」\n书成于夜半。写毕搁笔，以信压于一叠公文之下。\n次日天未亮，已坐案前。案上之灯，犹为昨夜那盏，灯芯剪短一截。\n此后数十年，灯位未尝移。或劝换一盏明者。曰：「不必。」亮了自己，照不见案上之字。\n其信后为同僚所收，藏于一木匣。匣中另有三十余封，皆其任内所书。一岁木匣为虫所蛀，虫自折缝而入，啮去数行。收信者未尝补。\n那木匣后传至继任者手中。继任者开匣看过一回，只看那封讲清晨之信，字字读到，合上，仍压回公文之下。月海亭与同僚书言清晨事，多指卯时，卯时天未明，灯犹在案。"
 LYY_Event.4049.a:"以任重自任，坦承其难"
 LYY_Event.4049.b:"轻描淡写，鼓舞士气"
 LYY_Event.4050.t:"长明灯灭天光入"
 LYY_Event.4050.d:"内战结束之日，甘雨入殿，至虚君之位前。案上一灯，长明三千年，灯油由专人递，一日不辍。她伸手，以两指捻灯芯，轻轻一吹。\n灯灭。殿中暗一瞬，众皆屏息，无一人动。随即天光自高窗入，照于空座，尘埃浮于光中，历历可数。有老臣伏地而泣，不知为谁而泣。\n甘雨出月海亭，不乘车，行于街。街市如常：卖豆腐者吆喝，学童背书，码头之船照旧进出，一妇于门前晒被，被上有补丁。无人识之，亦无人拜之。\n她立于街角，久之，轻声曰：「总算可以不必再替神操心。自今往后，操心者，吾辈自己。」言毕，有一童子自巷中奔出，撞其衣，仰面曰：「对不住。」甘雨俯身，为整其襟，曰：「无妨。」童子乃去，跑至街口，忽又回头看她一眼。灯座为铜，高三尺，座下有油渍一圈，年久成黑。"
 LYY_Event.4050.a:"熄灭长灯，转向人间"
 LYY_Event.4050.b:"保留长灯，不改其志"
 LYY_Event.4051.t:"粮可共守理各执"
 LYY_Event.4051.d:"玉衡回信来得很短，态度却比预想温和。刻晴写道：粮可共守，理可各执。我信得过你帐下之账。\n信只此三句，无款，无印，末有小字一行：「此信不必示人。」甘雨读之两遍，又读第三遍，乃以指抚其字，语谋士曰：「此人笔下无一虚字。」谋士曰：「既无虚字，何以不加印。」甘雨曰：「加印者，对外之言；不加印者，对内之言。」\n谋士问曰：「然则可共事否。」甘雨曰：「可共粮，不必共理。此世上最难对付者，从来在互相看不起之人；能互相看不惯，却仍肯一同将稻子收完者，反倒最有指望。」言毕，取信折好，不锁于匣，夹于账簿之中，与粟价诸条同处。谋士问：「何不与密件同收。」甘雨曰：「此非密件，此乃账中之一页。」\n越旬，玉衡遣人来，只送粟种三石，无一字。玉衡所赠粟种以布袋盛，袋口以麻绳扎，绳结为双套，不易开。"
 LYY_Event.4051.a:"与玉衡共守粮道"
 LYY_Event.4051.b:"拒其插手，独掌粮政"
 LYY_Event.4052.t:"食粟之人非数目"
 LYY_Event.4052.d:"天权回信写得密不透风，全是数目：粮价几何，运费几何，损耗几何，一县一县列下，末附三表，表中小字如蚁，一笔一笔，似在交一份功课。\n甘雨逐行看完，凡两刻。看完不语，取笔于末批曰：「账算得极精，可惜少一件。」吃饭之人，非数目也。写完，视之良久，欲抹去，墨已入纸，抹则不净，遂留。\n侍者问曰：「此语可发否。」甘雨曰：「发。」又曰：「她看得懂。」侍者曰：「若其不悦。」甘雨曰：「不悦亦好。不悦则必复书，复书则必再算一遍。」乃封函，于封口加印。三日之后回音不至。第五日，来一简，只一行：「受教。」粮价表已重造，增人户一栏。\n甘雨视此一行，笑曰：「此人果然看得懂。」乃取原表与新表并置案头，凡有客至，必示之。有客问其故。甘雨曰：「使算账之人，亦看见人。」天权回信附表三，表中小字以朱笔圈出者皆人名，圈旁有注。"
 LYY_Event.4052.a:"与天权共理财政"
 LYY_Event.4052.b:"拒之门外，不假财阀"
 LYY_Event.4053.t:"一片雪供月海亭"
 LYY_Event.4053.d:"绝云间之雪，甘雨最熟，亦最不敢亲近。使者自山上归，带回一片雪，置于漆盒，行三日不化，雪上有指痕一枚。\n同来者一句极冷之话：山上不问人间事。甘雨受盒，不即开，先问使者：山上有人送汝下山否。使者曰：「送至山门，未出。」甘雨曰：「既送至山门，便非不问。」乃开盒，视雪，以指按其痕，指下微凉。\n是夜，她将雪供于月海亭最深处，一灯相对，整夜未合眼。她想起自己本为麒麟，本可长住云间，却择人间。此择三千年，未对谁提起。此刻忽欲寻一人共语，举目四顾，亭中只有一案、一灯、一盒雪。天明雪犹未化。她以绢覆盒，语侍者曰：「此物不必收，让它自己化。」侍者后记之：此雪至第七日方尽，尽处留一痕，恰如指印。漆盒为旧物，盒盖有裂纹，以漆补之，补色较深。"
 LYY_Event.4053.a:"认下这片雪，独自珍重"
 LYY_Event.4053.b:"弃雪于地，专心国事"
 LYY_Event.4054.t:"刀与钱两般皆清"
 LYY_Event.4054.d:"云来海那头回信写得极随意，字歪，墨淡，末尾又画一船，桅斜，帆破，旁注小字：「此船可载三百石。」\n信中言：「打仗最费钱，做买卖最省钱。」汝等中原人，总把这两件事弄反。又言：「若肯开市，我保汝三年之内，米价比今岁低二成；若不肯，则三年之内，汝之米须从更远处来，价高四成。」二者皆非虚言，请自择。\n甘雨看完，竟笑。侍者从未见其笑，一时不敢言。甘雨指信末之船曰：「此人可怕处，不在其刀，而在其将刀与钱看得一般清。凡将此两样看得一样清者，出手之前，账已算毕。自此每逢北事，她必多留三分神，且命人另立一册，专记云来海米价，一月一报。」册既立，三年之间，米价果如其言。至第三年，始有人问：「那艘破船，究竟载过多少石。」信中画船之墨已淡，桅斜，帆破，旁注小字一行。"
 LYY_Event.4054.a:"以文治应公子之商谈"
 LYY_Event.4054.b:"以刀兵拒至冬之好意"
 LYY_Event.4055.t:"章程绕而无一错"
 LYY_Event.4055.d:"沉玉谷回话只一行，写在粗纸上，墨色甚淡：汝等所定水章程，写得比山路还绕，可一字未错。\n甘雨视那行字，久而不移目。纸角为风掀起，以镇纸压之，又看。侍者请曰：「此语褒乎贬乎。」甘雨曰：「先贬后褒。」侍者曰：「既贬我，何以不怒。」甘雨曰：「绕者，谷中人所苦也。」章程若只求简，则山这边与山那边，必有一边不服。绕些，为两边各留一路。\n言至此，忽觉心中松了一块，乃取章程一册，就灯重阅，遇其绕处，以朱笔圈之，圈凡十一。语侍者曰：「此十一处，明日再改，改得比今日少绕一圈。」侍者问：「何必。」甘雨曰：「有人读它，便不得不改。世上最难得者，有人肯一字一句读汝所写之字，纵使她并不打算听汝。」灯花爆了一声，她以笔管拨之，火复明。粗纸为翘英庄所造，纸面有草茎，笔过则涩。"
 LYY_Event.4055.a:"虚心纳沉玉之谏"
 LYY_Event.4055.b:"斥其阻碍大计"
 LYY_Event.4056.t:"十二贤者共一堂"
 LYY_Event.4056.d:"十二位贤者，第一次被请进同一间厅堂。座次不分先后，作一环。其中有主共和者，有主复旧者，有主张甚么都不必改者，亦有自始至终不出一言者。\n甘雨不设主席，立而言曰：「今日不必说服彼此，只须记住，吾辈都还愿意来。」言毕即退，坐于环外。自辰至午，争者六起。主复旧者言祖宗之法不可易，主共和者言祖宗之法已随祖宗去。争至烈处，一人拍案，环中诸人皆动，惟那不言者不动，只以手按杯。甘雨视之，命人添茶。\n茶至，争声渐歇，众乃各饮一盏。散时，十二人鱼贯而出，有人行色匆匆，有人至门回首，多看这座厅堂一眼。甘雨立于阶下，一一送之，不问他议成何事。侍者问曰：「今日有成乎。」甘雨曰：「有成。」曰：「何成。」曰：「十二人皆至，且皆肯再来。」月海亭十二贤者座作一环，环中置火盆一，盆中炭已白。"
 LYY_Event.4056.a:"邀十二贤共立新约"
 LYY_Event.4056.b:"只与同道续订旧契"

 GYP_Spirit_Moonlit_Secretariat:"灯照三千年"
 GYP_Spirit_Moonlit_Secretariat_desc:"月海亭之灯，三千年不熄。神在时，灯下批奏章；神去后，灯下掌印。执灯者易数十辈，灯盏亦换，惟火不移。少年初入亭，问灯何以不灭。老吏答以有人守；问无人守则如何，答以则灭；更问守者谁，老吏指亭中诸人，谓皆守者。少年视之，见诸人各执一卷，无一人闲语，灯影在背上，摇而不散。亭阶之下种琉璃百合数丛，花开时灯下作蓝，三千年未绝。"
 GYP_Spirit_Restored_Rites:"删苛存温厚"
 GYP_Spirit_Restored_Rites_desc:"礼典重修，删旧条一百三十，存者不及半。所删者皆细苛：坐次之差，拜数之等，器用之别。所存者惟三：相见有揖，饮食有让，丧葬有哀。老礼官力争，谓此皆古制，不可去。主事者答以古制为古人设，今人为今人设。老礼官又谓去之则无别。主事者谓无别则众人乃敢相近。老礼官退，取旧稿藏于箧，题曰：「存此，以俟后世好古者。」所存三礼之中，相见之揖最早复行，行于月海亭阶前。"
 GYP_Spirit_Grand_Secretariat:"议罢犹并肩"
 GYP_Spirit_Grand_Secretariat_desc:"内阁之议，不禁争。凡入座者，各持一说，争至面赤，声达于廊。武臣入见，闻之争，退而语人，谓此何异于市。及见其出，则数人并肩而行，共议明日之事，无一人记昨日之怒。武臣怪而问之。一学士答：争者事也，行者人也；争毕则事定，事定则同行；若记怒，则无人可与共事。武臣又问其不亦苦乎。学士曰：「苦。然较之不争而暗斗，犹胜。」议事之厅在月海亭东，廊长三十步，争声可闻于阶下。"
 GYP_Spirit_Adepti_Compact:"留一线可商"
 GYP_Spirit_Adepti_Compact_desc:"仙凡共治，本无定法。凡议，仙人坐末座，先听而后言。少年问仙者寿千岁，见事多于人，何以反居末座。一仙答以正因寿长，故不敢先。少年问其何谓。仙言所见者千岁之变，人所见者一岁之艰；以千岁之见断一岁之事，则事必不成。少年又问仙者何用。仙曰：「为诸君留一余地耳。」余地者，商量之所也。议事之堂悬一石锁，为归终旧物，无人能开，亦无人试。"
 GYP_Spirit_Sacred_Contract:"神像朽约存"
 GYP_Spirit_Sacred_Contract_desc:"殿中旧有像，金身，高丈六。岁久金剥，露出木胎。有司议修，主事者不许，众愕然。主事者乃言，欲使众人见此木胎，遂不去剥落之金，亦不补。殿前设长案，凡入者可按一指于册。初人不敢按；月余按者渐多；半岁册尽三函。一老妇按毕，仰视木胎，曰：「原来亦是木。」主事者闻之，语左右，谓此一语胜修金身十年。殿在玉京台西，金身剥落处露木胎，木色已黑。"
 GYP_Spirit_Clerisy_State:"以礼断其不端"
 GYP_Spirit_Clerisy_State_desc:"国中以礼为法，乡设礼正，里有礼约。争者不赴官，先赴礼正。礼正不引律，惟引故事，曰：「某年某人如此，众以为非。」判毕，无笞，无罚，惟记其名于乡册。被记者，婚嫁无人问，市易无人保。有少年以一言忤其叔，入册。三年后，少年欲他适，行至渡口，舟子视册，曰：「汝在此册。」舟不载。少年立于渡口，日暮，水声不绝。乡册藏于归离原社仓，册以布裹，取阅须里正与礼正同在。"
 GYP_Spirit_Unbroken_Chain:"谁定旧观字"
 GYP_Spirit_Unbroken_Chain_desc:"其言曰：「璃月一日未复旧观，吾一日不退。」闻者皆动容。少年问于座，问旧观何状。座中无人能答。一老臣谓神在时之状。少年又问神在时亦有饥岁，亦有冤狱，此亦旧观乎。老臣不能对。少年更言：若复旧观而饥岁仍在，则复之何益。满座寂然。主事者终不答，惟命人收起此语，不再悬于堂。而是语已传于市，市人日日诵之。此语初悬于月海亭壁，后撤去，壁上钉痕犹存四枚。"
 GYP_Spirit_Benevolent_Rule:"折阅亦登簿"
 GYP_Spirit_Benevolent_Rule_desc:"开仓、宽税、授田、立义仓，四事并举。度支上书，言四事岁费若干，请择其二。主事者不允，批曰：「四事皆行。」度支出争，谓府库将空。主事者召之入，取一册示之，问其可知册中所记。度支视之，乃去岁饿死者之数，不能言。主事者曰：「府库空，可复；人死，不可复。」度支退，自作一表，列四事之费与其所活之数，悬于署中，谓此账虽亏，然可对人。义仓之谷，多自荻花洲来，舟至则仓吏先验其湿。"
 GYP_Spirit_Civil_Service:"取士不问门第"
 GYP_Spirit_Civil_Service_desc:"取士之法既改，不问阀阅，惟试三场：一策，二判，三算。有寒家子，父为担夫，自负书箧入城，宿于廊下。试毕，榜出，其名在第七。报至其家，其母方浣衣，闻之，手停于水，久而不语。邻人贺之，母乃曰：「吾家无钱为贺。」邻人曰：「不须贺，此子自此食官禄矣。」母复浣衣，水已冷。其子后为县令，首事即免乡之杂役。榜贴于玉京台之侧，观者自台下排至街口。"
 GYP_Spirit_Three_Thousand_Years:"三千年一册"
 GYP_Spirit_Three_Thousand_Years_desc:"自神治以来，凡三年一录，录山川、户口、灾异、物价。三千年来，册积满一室。执笔之人，一也。少年入室助录，见架上册，问此皆有用乎。答以无用。少年又问无用而录，何苦。答以他日有变，后人欲知今日，舍此无由。少年谓后人未必读。答以未必读，亦须有。少年乃坐，录一卷，卷末书其名。执笔者视之，曰：「不必书名。」少年问其故。曰：「此册不为人名而设。」册库在庆云顶下，取册须乘浮岛之索，索动则册箱亦摇。"
 GYP_Spirit_Everlasting_Rain:"雨落千年山"
 GYP_Spirit_Everlasting_Rain_desc:"善政之效，不过一世；善念之传，可及十世。故其为约也，不期速效。凡立一法，必先自问：此可传乎；不可传者，虽美不立。属吏请立新税，岁可增钱十万。主事者问百年之后此税尚可废乎。属吏答以恐难。主事者遂不许立。属吏谓十万之利失矣。主事者曰：「失十万之利，存百年之可废，此亦利也。」是日雨，檐水入渠，声细而长。是日雨后，阶前琉璃百合尽开，花瓣薄如纸，一触即落。"
 GYP_Spirit_Five_Envoys:"亭门尚未闭"
 GYP_Spirit_Five_Envoys_desc:"五使既发，甘雨自送至渡口。风急，使者请归。甘雨曰：「吾在此，待汝辈还。」一使至须弥，说以林中之利；一使至枫丹，说以水道之便；一使至纳塔，为火山所阻，止于中途；一使至至冬，其主不见，留书而去；一使至蒙德，与骑士共猎三日，得其一句：「可谈。」岁暮，四使还，一使殁于道。甘雨立于渡口，见四舟，不语，久而后曰：「门既开，则不必尽入。」渡口在荻花洲北，水浅滩长，舟至须候潮，候者坐于石上。"
 GYP_Spirit_Twelve_Scholars:"无人先离席"
 GYP_Spirit_Twelve_Scholars_desc:"十二人者，学不同，见亦不同。初入厅，各据一案，案上各置一砚。主事者令今日不谈同异，惟各书所信。众乃书，书毕，以纸互易而读。读至某纸，有人拍案，斥其说误国。书者问误在何处。其人指之，书者答之，往复十余，终不能相服。日暮众将散，主事者曰：「诸君今日虽未相服，然皆未去。」众视座中，十二席，十二人，无一空者。十二案设于月海亭讲堂，案各一砚，砚池浅而阔。"

 GYP_Rite_Tier_1:"礼制之阶"
 GYP_Rite_Tier_1_desc:"礼制崩坏，旧礼尽废，新规未立。人各凭心，事各凭意，热闹倒热闹，只是没了章法。市集之中，先来者占其位，后来者夺之，夺者不以为耻，让者反以为愚。老者立于市口，看至日暮，曰：「此非乱也，此乃无人可问。」"
 GYP_Rite_Tier_2:"礼制之阶"
 GYP_Rite_Tier_2_desc:"礼制草创，新礼粗具轮廓，众人勉强按谱行事，行得生涩，却也渐成习惯。相见之揖，初则手不知举高或举低，行之三月，渐有定式。少年问老吏，此揖须几寸。老吏答曰：「不必问寸，问心。」少年不解，而行之愈恭。"
 GYP_Rite_Tier_3:"礼制之阶"
 GYP_Rite_Tier_3_desc:"礼制得宜，上下有序，进退有度。人与人之间，多一层郑重之分寸，少几分兵荒之粗粝。市人买卖，先揖后言，既成则互让一步。外乡客笑其繁，市人答以：「繁者慢，慢者少争。」客观三日，见市无詈声，乃不复笑。"
 GYP_Rite_Tier_4:"礼制之阶"
 GYP_Rite_Tier_4_desc:"礼制森严，典章完备，规行矩步。举国如一部上弦之机，精确，庄重，亦透一丝不容通融之冷。凡宴，坐次以齿、以官、以事，三者相权，一错则满席不安。老臣误坐一位，立而起，遍揖满座，退至末席，终席不复言。"
 GYP_Rite_Tier_5:"礼制之阶"
 GYP_Rite_Tier_5_desc:"礼制过盛，规矩织成一张不见之网。网中人举止得体，却无人敢越雷池半步。活人至此，便活成一件礼器。有嫁女者，依礼当哭三日，哭至第二日，声已哑，仍须按节而哭。邻人闻之，不以为哀，只论其节合否。"
 GYP_Benevolence_Tier_1:"民生之阶"
 GYP_Benevolence_Tier_1_desc:"民生凋敝，仓廪空虚，巷陌萧条。政令再庄重，也填不饱一只空碗。城中粥棚三处，日给千碗，碗薄如纸，一搅即破。老妇携孙候于棚下，候至日昃，粥尽，乃以碗底刮锅，刮得半勺，先喂其孙。"
 GYP_Benevolence_Tier_2:"民生之阶"
 GYP_Benevolence_Tier_2_desc:"民生初安，百姓勉强温饱，市面冷而不散。日子过得下去，但没人敢多添一件衣裳。布铺之中，问价者多，剪布者少；有妇以旧衣改制，改制三次，仍不肯弃。岁暮，市上始见新衣，皆童衣，无成人衣。"
 GYP_Benevolence_Tier_3:"民生之阶"
 GYP_Benevolence_Tier_3_desc:"民生殷实，仓有陈粮，户有余钱。炊烟比从前更密，市集比从前更早。五更未明，卖炭者已出，卖菜者继之，卖饼者最后。老吏晨起巡街，见炊烟三十七道，归而记于册，题目：今岁烟数。"
 GYP_Benevolence_Tier_4:"民生之阶"
 GYP_Benevolence_Tier_4_desc:"民生富足，仓满廪实，闾阎安堵。善政之报，不在庙堂之颂声，而在每一处灶台多出之一缕热气。有司欲立碑纪其政，主事者不许，命以碑石改作义仓门槛，取其常为人所踏。碑文未刻，而门槛三年即磨深一寸。"
 GYP_Benevolence_Tier_5:"民生之阶"
 GYP_Benevolence_Tier_5_desc:"民生极盛，四海升平，百业向荣。仓廪实而知礼节。一个能使人吃饱之国度，连沉默之百姓，走路亦挺得直些。市中小儿斗草，输者以糖为罚，不复以拳；巷口老妪晒豆，豆落于地，路人拾而还之，不问其谁。此二者，老吏谓可入志。"
 GYP_Combo_Twin_High:"礼繁民困"
 GYP_Combo_Twin_High_desc:"上下进退皆有讲究，日子却越过越紧。规矩织成一张密网，网中人举止得体，亦动弹不得。凡兴一工，须过七司，司各有式，式各不同；图改九次，工未动而费已三倍。主事者阅其册，良久，命照旧式再改一次。"
 GYP_Combo_Twin_Low:"礼崩民散"
 GYP_Combo_Twin_Low_desc:"旧礼既废，仓廪亦空。人心无所依，一座城各自为活。邻里不复通问，遇于巷则侧身而过；有丧者无人助，独舁其棺出城，途中断绳，棺落于地，四望无人可唤，惟坐于道旁待天明。"
 GYP_Combo_A_High:"盛礼虚仓"
 GYP_Combo_A_High_desc:"典章重光，百姓却吃不饱。朝堂上热闹非凡，城门外有人在啃树皮。礼官校书至夜，灯下朱笔如飞；而同夜城南粥棚闭门，候者散去，雪上留碗痕数十。次日朝会，无人言及此事，惟礼官报校书已成三卷。"
 GYP_Combo_B_High:"宽政失序"
 GYP_Combo_B_High_desc:"仁政润物，奈何没了章法。人人得利，人人也都不服谁。赈粮发放无序，先至者三领，后至者一领亦无；受者不服，施者亦不服。老妇持空袋立于仓前，问其名，答以已录；问其录在何处，答以在册。"

 #################### 甘雨 · 月海亭 · 战后 ####################
 GYP_PW_Moonlit_New_Order:"月海灯下批旧制"
 GYP_PW_Moonlit_New_Order_desc:"内战落定，城头旗色已易，月海亭之灯仍旧。甘雨坐案前一夜，将帝君旧制一册册翻出，逐条批注。天明，文官环坐。甘雨合册曰：「神明不在了，此城仍须有人管账，有人修路，有人替打翻之碗赔钱。此差事自今日归吾辈，办得好坏，亦由吾辈自认。众皆应，无一人问何以归我。」"
 GYP_PW_Count_the_Ruins:"残页曝日旧库前"
 GYP_PW_Count_the_Ruins_desc:"清点残册，无人肯接，账目乱如一堆碎瓷。甘雨自入库房，取浸水文书摊于日下，一页一页晾干，再以石压平。吏员立于门侧，欲代而不前。甘雨曰：「已塌之物不值钱，记其如何塌之字，才值钱。」后有人请修城，甘雨先令其读此一堆纸。请者读三日，出而改其图样数处。"
 GYP_PW_Restore_the_Wards:"坊巷按邻不按钱"
 GYP_PW_Restore_the_Wards_desc:"坊巷重划，以旧邻为次，以丁口为则，不以钱之多寡。有富室舁礼单来求，甘雨取其单，折为四，还之曰：「君旧日之地，出钱买得；今日所分之地，是众人让出。」两笔账分开立，各不相抵。富室面赤，捧单而去。分地之日，有老妪得屋一间，向吏再拜，吏避不受，曰：「此非吾赐，是此规矩赐。」"
 GYP_PW_Return_the_Fields:"老农田埂守旧契"
 GYP_PW_Return_the_Fields_desc:"还田之告示写得极直：谁耕之地归谁，战前旧契暂且靠后。有老农不信，抱契坐于田埂，自晨至暮不起。甘雨不遣兵，只令书吏携桩至其田，当面重打。桩入土，声闷而实。打至第三桩，老农自起，以手摩桩头，乃取怀中旧契叠好，仍纳于怀，负手而去。吏问其契何以不毁。曰：「留着教孙子。」"
 GYP_PW_Open_the_Granaries:"米车自亭排至港"
 GYP_PW_Open_the_Granaries_desc:"开仓首日，粮车自月海亭连至码头，首尾不相见。甘雨不登高处，杂于领粮队中，亲以斗量米，授一老妪。老妪仰视，忽识之，问曰：「帝君果不在耶。」甘雨为之扎紧米袋，曰：「不在了。」老妪垂首。甘雨又曰：「饿肚子这一件事，往后有人管。」老妪不语，抱袋而去，行数步，回顾一次。"
 GYP_PW_The_Rites_of_Mourning:"国丧只留三日素"
 GYP_PW_The_Rites_of_Mourning_desc:"国丧之礼定得极简：不设大醮，不用童男女，惟三日素服、一炷清香。有老臣以为寒酸，面陈其事。甘雨取旧档一册，翻至一页示之曰：「当年定此条者，亦惧生者为死者所累，先饿死生者。」老臣视档，字迹已淡。甘雨曰：「礼为生者设，此意三千年前已书明白。」老臣捧档而退，至门，回身一揖。"
 GYP_PW_The_Registry_of_Souls:"一家一行一名"
 GYP_PW_The_Registry_of_Souls_desc:"编户清册，不分贵贱，一家一行，一人一名，行首书名，行末书丁口。有吏员以为琐碎，笔屡搁。甘雨取册翻至一页，指一行问曰：「此家五口，户主何名。」吏员视之良久，不能对。甘雨曰：「向者此辈只是一串数目；自今日始，至少各占一行，各有其名。」吏员受册，退而补书，漏者凡二十余家。"
 GYP_PW_Reopen_the_Schools:"书院门开无锣鼓"
 GYP_PW_Reopen_the_Schools_desc:"书院重开之日，不设锣鼓，惟悬木板一，书开讲时刻。初至者，有船工，有挑夫，亦有卖鱼妇人，衣上犹带腥气，坐次不安。甘雨亲授一课，所讲者，如何看一张借据里藏着之话，指其一字曰：「此字看似许尔，实为缚尔。」众哗然。有船工问：「识字何用。」曰：「识字者多一人，诳人之话便少一张。」"
 GYP_PW_The_Examination_Halls:"题目三钥共锁之"
 GYP_PW_The_Examination_Halls_desc:"贡院重修，号舍依旧制，一间隔一间，题自库出。有旧家遣人探题，至门下，为甘雨所拒。其人曰：「不过一问。」甘雨曰：「题目锁于库，钥析为三，三人各持其一，吾亦不能独开。」其人惭而去。入场之日，寒素子弟与旧家子并肩立于门下。甘雨视之，谓考官曰：「此一场，所比者字，非门户。」"
 GYP_PW_The_History_Bureau:"修史须书败仗"
 GYP_PW_The_History_Bureau_desc:"史馆设于月海亭西厢，屋三间，老史官四五人，笔砚之外无长物。甘雨与约曰：「书败仗须书全，书胜仗亦须书其代价。」一史官下笔迟回，问曰：「如此，则国体何存。」甘雨曰：「史书若只存好听之言，后人取之何用。」史官默然，落笔。是馆修书最慢，十年未成一代，而所存之稿，无一处涂改。"
 GYP_PW_The_Grand_Secretariat:"只名月海亭议事"
 GYP_PW_The_Grand_Secretariat_desc:"中枢重立，不名内阁，不称军机，惟曰月海亭议事。或问何以名之太朴。甘雨曰：「名愈朴，则听者愈不忘此堂为谁而立。」首次议事，两旧臣当席相争，声色俱厉。甘雨不拦，惟命书记照记，一字不遗。散后，端茶小吏入，见满案纸上皆涂改之字，墨迹相压，几不可辨。"
 GYP_PW_The_Calendar_and_Music:"历有准头乐有节"
 GYP_PW_The_Calendar_and_Music_desc:"历书重订，乐律亦复。有少年问曰：「算节气与铸钟磬，何涉于民生。」甘雨曰：「一年之日有准头，人心乃有底；乐音摆得正，人立于堂上乃知如何开口。」二者皆不产粮，然少之，则国如一间未摆桌椅之空屋，四壁虽立，无处置客。少年退而取历，始学推节气。"
 GYP_PW_The_Standard_Measures:"铸新斗逐户校准"
 GYP_PW_The_Standard_Measures_desc:"度衡归一，最得罪人。诸商号尺斗秤，差之毫厘，积岁则能吞一家人心。甘雨铸新器，逐户校定，用旧者罚。有掌柜当街摔其旧斗，斗碎而骂。甘雨不怒，命人取新斗一具置其柜上，曰：「此斗不收钱。」翌日，此柜易新斗，其生意反比邻家稳，月余，邻家亦易。"
 GYP_PW_Envoy_to_the_Qixing:"与直人交莫让"
 GYP_PW_Envoy_to_the_Qixing_desc:"致玉衡之书，词甚恭，语则实：粮道可共守，政见可各执。甘雨谓使者曰：「彼处账算得清，其人性直。」与直人交，省事；惟勿望其让半步。使者问：「若彼不让，奈何。」曰：「吾亦不让，让则负吾民。」书将发，甘雨改其上款者三，自玉衡星改至阁下，终只书二字：「刻晴。」"
 GYP_PW_Envoy_to_the_Chamber:"账上漏了吃饭人"
 GYP_PW_Envoy_to_the_Chamber_desc:"天权回函，密如蚁阵，粮价、运费、损耗，逐项开列，不遗一事。甘雨逐行读毕，取笔于末批曰：「账算得极细，惜漏一样。」旁注四字：「食者非数。」批毕，执笔良久，欲削去而复止。封发之时，语近侍曰：「彼读得懂分寸，故留之。」回函至天权，凝光阅竟，不怒，命重算其粮价三次。"
 GYP_PW_Envoy_to_the_Snow:"一片不化雪供案"
 GYP_PW_Envoy_to_the_Snow_desc:"绝云之雪，甘雨最熟，亦最不敢多触。遣使上山，公文只一行：「山上旧约犹在，可愿下山一坐。」使者去半月，归，携一语及一片不化之雪。甘雨取雪，置于案头小碟，久视不言。语使者曰：「她肯还此一句，已比我预想多走一步。」是夜雪在碟中不融，案上灯影覆之，如覆一小山。"
 GYP_PW_Envoy_to_the_North:"厚礼原样退回车"
 GYP_PW_Envoy_to_the_North_desc:"北国使者至，携厚礼一车，厚信一函，条件写得漂亮。甘雨读三遍，于回函只书两句：「粮可借，路不借。」使者色变，曰：「如此，则所议皆废。」甘雨取账册推至其前，曰：「君之算盘，我算过；我之算盘，亦算过。」两盘相较，可知谁先饿。使者不能答。散后，礼车原样出城，封条未启。"
 GYP_PW_Envoy_to_the_Valley:"绕是绕未错一字"
 GYP_PW_Envoy_to_the_Valley_desc:"沉玉谷山道险仄，使者行至半途，为兰砚所拦。兰砚开口第一句曰：「尔等文书，写得比此山路还绕。」使者不与辩，取水土章程一安置于石上，一揖而去。兰砚携归，挑灯阅半宿。诘朝，遣人回书一行：「绕则绕矣，未见错一字。」甘雨得书，读至末字，忽笑。左右问所笑何事。曰：「得此一句，比得千诺。」"
 GYP_PW_The_Five_Concords:"五椅坐热茶渍存"
 GYP_PW_The_Five_Concords_desc:"五方和议，设于月海亭，凡三日。玉衡遣执笔之人，天权遣管账之人，绝云间来一不愿留名者，北国载货一船，沉玉谷送水文图一捆。甘雨不为东道，只居末座，执壶添茶。议事时争者争，默者默，茶凉则换，换而复凉。至第三日暮，五椅皆温，案上留茶渍一圈，无人拭去。"
 GYP_PW_The_Empty_Shrine:"每月初一亲添油"
 GYP_PW_The_Empty_Shrine_desc:"帝君神位空悬，案、椅、印、灯皆如旧，皆不用。有属官请撤旧殿，改作衙署，以省土木。甘雨不许，曰：「此殿不动。」每月朔日，必亲往添灯油一次，不使人代。或问：「既空其位，何勤于此。」曰：「非为神也。吾每月须亲看一回，使自知此位可以空，而不可复有人坐其上。」添毕，覆灯罩，退。"
 GYP_PW_Revere_But_Not_Ask:"敬天如故不问卜"
 GYP_PW_Revere_But_Not_Ask_desc:"祭仪照行，问卜遂停。甘雨书之于典，措辞留余：敬天如故，求签问卦，不载国事。老臣数人联名力争，以为废卜即慢天。甘雨曰：「吾辈仍旧敬天，只不复以签辞断国事。」诸公之事，诸公自定；异日有失，方知当问何人。老臣中一人叹曰：「此后无人可推。」甘雨曰：「此即吾意。」"
 GYP_PW_The_Annals_of_Omens:"谶纬后附验与否"
 GYP_PW_The_Annals_of_Omens_desc:"历朝谶纬、天象、旧签文，命史官逐条抄录，各为一档，档后附其后来验否。有老吏查至一卷，手微颤，捧卷请曰：「此条验之三事皆合，当如何书。」甘雨曰：「验则书验，不验则书不验。」乃于卷末题一行：「吾辈所留，是一本后人可自辨之书。」此卷后置书院显处，翻之者众，纸角先敝。"
 GYP_PW_The_Chasm_Seal:"闸门一寸一寸落"
 GYP_PW_The_Chasm_Seal_desc:"层岩裂口再加固一次，用新铸之合金，施新定之灌浆法，皆前次所无。甘雨亲下井口，立于升降之架，看末道闸门一寸一寸落。石屑自顶坠，击其肩，不为动。闸合，声沉如远雷。甘雨谓守者曰：「此物不讲道理，人得意时它便来提醒。今日多封一分，后人少赌一命。」守者问：「几时可了。」曰：「不在吾辈。」"
 GYP_PW_The_Ledger_of_Old_Debts:"旧债一笔有着落"
 GYP_PW_The_Ledger_of_Old_Debts_desc:"层岩历年之欠，编为一册：「某年塌方，填几人，赔几家，用工若干，皆列其数。」主其事者以为繁琐，甘雨曰：「欠而不记，终是一笔糊涂账；记而明白，后人接手乃知所扛者几何。」册成，厚三寸，置架之最下层，取阅须俯身。后任者初至，先取此册读之，读毕，坐良久乃起。"
 GYP_PW_Rites_Against_the_Abyss:"撰典教民避深渊"
 GYP_PW_Rites_Against_the_Abyss_desc:"镇渊之法，甘雨择其最拙者：修一部专书，载深渊沿革与历次祭法。祭仪录入，封堵之得失亦录入，成功者书，败者亦书。有将校笑曰：「此纸能退深渊乎。」甘雨曰：「刀剑镇得住一时之裂，镇不住人心之惧。」使民知底下何物，知如何避，胜于多遣一队人下井。书成，颁至沿山诸村，村塾亦置一册。"
 GYP_PW_The_Millelith_Reformed:"臂章新发抚之平"
 GYP_PW_The_Millelith_Reformed_desc:"千岩军重编营伍，饷额如旧，名号则易。点校之日，甘雨立于台上，谓众曰：「此军旧日所守者城，自今而后，尚须记得城中之人。」言毕，场中寂然，久之，应声一作，其声与旧日之呼不甚相同。有老兵以手摩新发之臂章，不发一言，惟以指反复抚之，使其平贴。台上诸将相顾，无人先语。"
 GYP_PW_The_Pass_Garrisons:"守卒呼作小民门"
 GYP_PW_The_Pass_Garrisons_desc:"山口关隘次第重修。新图之上，多一旧图所无之式：关墙须留一门，广容板车。有校尉不解，请削之。甘雨曰：「关以挡兵，非以挡人。若兵至而民先在墙下，此一门即活人数千。」校尉受命，门成。守卒私名之曰小民门。其后每有战事，此门先开，亦最后闭。闭门者常回望一眼，乃下闩。"
 GYP_PW_The_Mountain_Watch:"猎户药农先认路"
 GYP_PW_The_Mountain_Watch_desc:"巡山之哨，募本地猎户、药农充之。甘雨所下第一令，不令其操演，令其认路：某道可行骡马，某崖可藏人，某溪旱则断流。众问何先于此。曰：「守此山者，先须是懂此山之人。」半年后，队中自绘山川图一轴，较官图尤细，连溪之断流月份亦注于侧。官图遂废，而用此轴。"
 GYP_PW_The_Arsenal_of_Moonlit:"所造之物刻匠名"
 GYP_PW_The_Arsenal_of_Moonlit_desc:"兵造自港口近郊迁入山坳，产量倍于旧日，近村亦因之增其烟火。甘雨立一规：凡所造之物，皆刻匠者之名。或问：「兵器何必刻名。」曰：「有名有姓之器，不肯妄杀人；有名有姓之活计，不肯妄糊弄。」第一件刻名之兵器，成于秋末，置门侧半月，匠者日往视之，抚其名，乃送入库。"
 GYP_PW_The_Militia_Registers:"枪口抬高一寸难"
 GYP_PW_The_Militia_Registers_desc:"乡兵不复临时拉夫，按里坊登册，各家出丁，岁课有定。操演之目，添一条于首：先学如何不误伤同伍。有里正问：「此非末节乎。」甘雨曰：「曾上阵者皆知，难处只在枪口抬高一寸。此语后书于操典首页。」操典行之数年，首页纸角先敝，翻之者多，而别页尚新。"
 GYP_PW_The_War_College:"先想而后用刀者"
 GYP_PW_The_War_College_desc:"武备学堂开于城南，所讲者行军、布防、粮道，亦讲一事：此仗值不值得打。甘雨往听一课，坐于末席，毕，语诸生曰：「善舞刀者比比皆是，未用刀而先思者，乃难得。」堂中所悬第一图，非阵图，乃一纸行军路，路侧标水井与村落，村落旁注丁口。诸生每日入堂，先对此图一揖。"
 GYP_PW_The_Question_of_the_Realm:"议声不绝方是福"
 GYP_PW_The_Question_of_the_Realm_desc:"纲常既定，此后何往，议事厅争三旬不决。甘雨尽开其门，凡愿言者皆入，不问其身。争至末，卷宗堆案，高及人腰，而头绪愈乱。有属官请断之。甘雨视纸堆良久，曰：「吵不完，最好。」真个吵完，才是无人敢开口之日。属官问：「然则路在何处。」曰：「在肯担者肩上，不在纸堆里。」"
 GYP_PW_Charter_of_Office:"先问百姓后问官"
 GYP_PW_Charter_of_Office_desc:"任官之章，首条第一行曰：「为官者，先问百姓，后问上官。」老吏见之，摇首曰：「如此，则上下失序。」甘雨不辩，命抄手录此条，人授一纸，新任者受牒之日并受此纸。曰：「使尔记住，俸禄自谁袋中省出。此条后刻于衙前之石，石不甚大，而字深三分，行人之过者，多有驻足。」"
 GYP_PW_Merit_Ledger:"通十九条塌渠者"
 GYP_PW_Merit_Ledger_desc:"考成之例，所考者实事：修堤几条，赈饥几回，清钱粮几笔。首岁考绩，三员自许老练者皆落等；一县丞沉默寡言，评上上。问其功，则一人通其县中十九条塌渠，无一处请工于上司。榜出之日，满城议论，指画其名，而无一人称冤。县丞自视榜，默立少顷，乃归，归即赴渠。"
 GYP_PW_Remonstrance_Office:"鸣冤鼓挪到街口"
 GYP_PW_Remonstrance_Office_desc:"谏议之司，为不能言者言。衙前旧有一鼓，名曰鸣冤，久无人敢击。甘雨命移之于最闹之街口，曰：「欲诉者，谁来击皆可；吾不能拦，他人亦不能拦。」鼓移三日，面已有痕，月余则斑驳如旧墙。值守吏员初以为烦，渐觉击鼓者所言，往往最实。有老吏私记其所诉，别为一册，其册后为断狱者所重。"
 GYP_PW_Code_of_State:"典章里最小一条"
 GYP_PW_Code_of_State_desc:"典章成书，凡数十卷，甘雨逐条校过，朱笔所点，纸皆起毛。至末，独留一条最琐者，书乡里分水之序：先下流，后上流，先秧田，后菜畦。有属官曰：「此太小，不足入典。」甘雨曰：「大典管国，小条管日子。」国能不能立，常断在此类无人肯写之处。书成，于卷尾自署一名，不复加一字。"
 GYP_PW_Prefectures_and_Counties:"到任先看水与账"
 GYP_PW_Prefectures_and_Counties_desc:"郡县两级，界画分明，谁管内政，谁掌兵符，条文悉具。赴任者辞行，甘雨只嘱一句：「至其地，先看两物，田中水，衙中账。」有老臣忧权分太散，曰：「缓急之际，谁任其责。」甘雨曰：「分则出事知问何人；合于一手，烂则烂在里头，外人不得闻。」老臣思之，不复言。其后郡县互纠者三，皆得其实。"
 GYP_PW_Great_Academy:"读书非为作官耳"
 GYP_PW_Great_Academy_desc:"太学之立，为诸生设讲席十二，不立师承，不循门户，凡有所得，皆许登堂陈之。落成日，甘雨循廊一周，至辩论堂，见地有炭痕数道，问之，则前夜诸生画图所留。甘雨曰：「此痕勿扫，留与他日来者看。」有人问治学之要。曰：「能容人驳，方能自立。」言毕而去，诸生送至门，返而争如故。"
 GYP_PW_Gentle_Administration:"退回之粮三十车"
 GYP_PW_Gentle_Administration_desc:"宽政非不取，取之明白而已。甘雨命以各乡税册摊于衙前长案，凡有疑者，自取阅之，自核其数。有豪家不肯，遣人陈情，谓查之太密。甘雨答曰：「嫌密者，可来与吾一条一条对；对毕，多取者一分必退。」其人无言而退。首岁所退之粮，装车三十，自衙前发还诸乡，车辙深陷于道。"
 GYP_PW_Moonlit_Reign:"满城灯亮至月落"
 GYP_PW_Moonlit_Reign_desc:"诏既颁，夜不禁市。满城张灯，灯影入水，港口如浮万点。有老者扶杖立于灯下，向北天徐徐躬身，起而拭目，问其故，曰：「吾少时听老人言，此城有灯三千年，今见其换人点火，而灯不灭。」市中酒肆通夜不闭，有醉者拍案歌旧调，歌竟，满座无声，亦无人去。灯至月落乃减。"
 GYP_PW_Summon_the_Adepti:"携茶与账上山去"
 GYP_PW_Summon_the_Adepti_desc:"请仙之书，甘雨亲送上山，不携仪仗，惟茶一壶、账一册。至绝云，席地而坐，为诸仙斟茶，曰：「不敢请君管事，只请君来坐，听人间今日之难。」有仙人问：「尔所图者何。」曰：「图三千年来第一回，人与仙同坐一桌，共饮此壶。」仙人视壶良久，取一盏饮尽，曰：「此茶有烟火气。」甘雨曰：「然。」"
 GYP_PW_The_Seat_of_the_Immortals:"东厅添席不设名"
 GYP_PW_The_Seat_of_the_Immortals_desc:"月海亭东厅添席数张，不设名位，先至者坐。文官初不惯，每入辄让。甘雨曰：「座上人换得勤，底下话乃听得真。」仙家议事，终日不多言，惟每逢有人报数太顺，必有一人轻叩其案，问此数如何算得。一问既出，报者往往改口。甘雨私谓左右曰：「此一问，胜于百条章程。」"
 GYP_PW_The_Compact_of_Jueyun:"绝云山上按手印"
 GYP_PW_The_Compact_of_Jueyun_desc:"绝云之约，其文如家规：仙掌地利，人掌民事，有争则请德望高者裁之，裁者亦须自让三分。有仙人笑其太软。甘雨曰：「吾正要留一处可商量之地。」说尽则日后谁都不好退；留一线，乃有人肯坐。立约之日，山上山下各按手印，印泥新调，按之有声。有年少仙者按毕，视其指上红痕，久而不拭。"
 GYP_PW_Heaven_and_Earth_Together:"祭山河先祭春耕"
 GYP_PW_Heaven_and_Earth_Together_desc:"天人同序，祭天、祭地、祭山河之礼重排，而列于首者，春耕也。老臣以为次序倒置，争之。甘雨曰：「天之所以予人者，落于一场好雨、一季好收。」既落于田，则自田始敬。礼官迟疑，问祝文如何措辞。甘雨曰：「先谢犁，后谢天。」礼官录之，笔停者再。是年春祭，犁置于坛前，农夫八人执之而立。"
 GYP_PW_The_Elixir_Fields:"仙家丹法养田人"
 GYP_PW_The_Elixir_Fields_desc:"丹田同养，取仙家炼丹之理，移用于养民：不图旦夕之效，而图岁月之长。甘雨请仙家录其调理之法，删其玄者，留其可行者，施于灾后重下田之人。其效甚缓，一年而后，染病者减其二成。有属吏以为太少。甘雨曰：「慢者能立，快者多不存。」是法后行于诸乡，二十年不废，亦无人复称其效。"
 GYP_PW_The_Mountain_Capital:"粮仓药庐满山洞"
 GYP_PW_The_Mountain_Capital_desc:"山中陪都，依旧日洞天之制而筑，所筑者多粮仓与药庐，殿堂居其末。甘雨曰：「山上所为，使遭灾者有一处可喘息耳。」陪都既成，首至者，南边水患之民三百户。居三月，水退，乃下山。行前，各取桶汲涧水，将山门前新栽之松，一棵一棵浇过。守门卒问其故。一老妇曰：「住过之处，行时当浇一回水。」"
 GYP_PW_Clouds_and_Mortals:"云泥同行不相犯"
 GYP_PW_Clouds_and_Mortals_desc:"云与泥，终是两样人。甘雨不强合之，惟行一事：使山上山下之人，于同一城中，各得一凳可坐。或问：「既不亲，何以为治。」曰：「不必相亲，但求不相防，已是难得之太平。」城中置凳十余条，初无人坐，久乃渐满。数年后，凳面磨得发亮，有一老仙与一挑夫并坐，各不相视，而共看江上过船。"
 GYP_PW_Immortal_Regency:"人决之仙参之"
 GYP_PW_Immortal_Regency_desc:"仙辅之政，延数仙入议事厅常席，辅政而不主政。席约书明：事由人决，仙惟参议，参议之言，必录于档。有属官问：「君不畏仙势日大乎。」甘雨曰：「畏。故书之为字。」人情可变，字不变。约成，示诸仙。一仙读至末行，点头曰：「写得硬。」乃先按印，余者随之。甘雨取其约，另抄一通，藏于库。"
 GYP_PW_The_Three_Thousand_Years:"旧账不知替谁记"
 GYP_PW_The_Three_Thousand_Years_desc:"三千年旧账，甘雨一人任之。某年大旱，某年丰稔，某家添丁，某户断香火，皆不待查册。夜深灯下，偶自问：「此账为谁而记。」帝君在时，为神记；帝君去后，为己记。记至近年，忽不能分：是她在记璃月，抑或璃月借她之笔自记。问已，仍取笔添一行，所添者，今夜灯油几钱。"
 GYP_PW_The_Names_on_the_Stele:"碑上惟书名与年"
 GYP_PW_The_Names_on_the_Stele_desc:"井下死者之名录，又增一页。甘雨命为每一名立碑，不问其生前属何营。有吏难之，曰：「敌我未分，碑文何以措辞。」甘雨曰：「书其名，书其年，书其死所，余皆不书。」碑成，列于井口，长短不齐。立碑之日，至者甚众，有胜者，有败者，亦有不为任何一方所认者。众立碑前，日暮风起，无一人先走。"
 GYP_PW_Reunified_Liyue:"定鼎之日市如常"
 GYP_PW_Reunified_Liyue_desc:"天下定鼎之日，甘雨自殿中出，立于阶上。街市如常：卖豆腐者吆喝，学童散学，码头船进船出，无一事为新。她视之良久，语左右曰：「总算不必再替神操心。」左右问：「此后操心者谁。」曰：「吾辈。」是日无宴，无赦，无贺表。至夜，月海亭诸吏各归其家，桌上文书未收，墨犹未干。"
 GYP_PW_The_Everlasting_Moon:"灯换人看未曾熄"
 GYP_PW_The_Everlasting_Moon_desc:"月海长明，不为一人而明。甘雨书此语于末诏，又于其后添数句：「此法今日立，未必今日尽美，愿后人以宽容待之，以公心正之。」写毕，视灯良久。盖善政不过一代，善念可传十代，此理她知之最明。诏下，掌灯者易其人，灯则未尝一夕熄。后来掌灯者不知初意，惟每夜添油，视火不旺则拨其芯。"
 GYP_PW_An_Eternal_Ledger:"此册不载功过"
 GYP_PW_An_Eternal_Ledger_desc:"万世之籍，收三千年之账：典章、赋税、水利、封渊、抚恤，一册一册，层累而上。甘雨既老，最后一册亲笔书之。其文曰：「此册不载功过，只载事。后人欲评谁某，翻账可也，不必更来问我。」书毕，搁笔于案，起身出库。库门阖，锁声落，廊下无人，惟闻远处更鼓一响。"

 GYP_postwar_category:"月海新章"
 GYP_postwar_category_desc:"战事既息，麒麟一系专以抚民为务。赈济、劝农、调和各家，皆求璃月得以休养。日子安稳，比任何功业都紧要；人心一定，旁事才谈得下去。百姓重拾旧业之日，璃月便又活转回来。"
 GYP_decision_pw_relief_famine:"先炊后章"
 GYP_decision_pw_relief_famine_desc:"灾年最缺者米，最怕者消息比粮车走得慢。赈灾须先使人饱，再论章程；一笔账记清，下一回方敢再开仓。有司请先造册。甘雨曰：「册成之日，人已死。」遂先散粮。粮车自归离原起，行官道，道旁荻花正白，车过则伏。"
 GYP_decision_pw_dike_works:"筑堤束水"
 GYP_decision_pw_dike_works_desc:"水患，此古国最诚之考官。堤牢不牢，一场暴雨即揭；吏用不用心，一条决口即证。甘雨每岁亲行堤上，以杖叩石，听其声。有吏问：「听声可知工之善否。」甘雨曰：「实者声钝，虚者声空。」堤在荻花洲北，堤上草长及膝，无人刈之。"
 GYP_decision_pw_rite_lectures:"讲礼于乡"
 GYP_decision_pw_rite_lectures_desc:"礼典写出，只成纸；讲出口，乃成活。宣讲之队遍行乡野，不诵条文，只以俗事为譬：见长者当如何，受人之惠当如何。一童子问：「礼者，畏人乎。」讲者曰：「礼者，不使人难堪。」讲礼之所设于归离原树下，座以石为凳，凳面磨得发亮。"
 GYP_decision_pw_scholar_bounty:"荐才连坐"
 GYP_decision_pw_scholar_bounty_desc:"凡荐才确有实绩者，荐主同赏。僚属问：「同赏，则滥荐者亦得赏乎。」甘雨曰：「故须并罚。荐得其人，赏；荐非其人，罚如其罪。」法出一年，荐者三十七，滥者二，二人皆自请去。荐册藏于月海亭档库，架编号至九，后架犹空。"
 GYP_decision_pw_land_survey:"清丈田亩"
 GYP_decision_pw_land_survey_desc:"田籍一乱，税即乱，人心更乱。清丈费时，且得罪豪强。有谏者曰：「何苦为此。」甘雨曰：「所得罪者数十家，所得者万千自耕之农。此账吾算得清，且算与汝听：一家豪强之怨，抵不得一村之安。」清丈之桩立于归离原，以石为之，入地二尺，刻户名与亩数。"
 GYP_decision_pw_scholarly_archive:"一卷一校"
 GYP_decision_pw_scholarly_archive_desc:"书修得慢，最易半途而废。甘雨立规：宁少修数卷，亦须一卷一卷校毕。有吏请速成。甘雨曰：「纸上之物，含糊不得。今日省一日，他日误一事。」校毕一卷，甘雨自钤一印；印在，此卷方可示人。书成藏于月海亭书库，凡三十卷，卷各一函，函以布裹。"
 GYP_decision_pw_envoy_keqing:"遣使玉衡"
 GYP_decision_pw_envoy_keqing_desc:"使者赴玉衡，所携者月海亭粮道一册，并问候一句。甘雨附言：「政见之争可缓，先收此季之稻。」使者归述。刻晴闻之，命开仓先济月海亭之民，而后议其余，曰：「能使人食饭者，方配争天下。」"
 GYP_decision_pw_envoy_ningguang:"遣使天权"
 GYP_decision_pw_envoy_ningguang_desc:"天权回话，先谈钱，后谈情。甘雨偏重此对手。使者问：「彼不谈情，何重之。」甘雨曰：「彼不假慷慨，亦不欠一句实话。此等账，反算得下去。」使者归，携回清单一份，精至一厘。甘雨看毕，于末添一行：「此数准。」使者自群玉阁归，清单精至一厘，纸角以铜镇压之。"
 GYP_decision_pw_envoy_shenhe:"遣使绝云"
 GYP_decision_pw_envoy_shenhe_desc:"绝云间者，甘雨归处，亦其最不敢轻动之地。使者归，携冷语一句、不化之雪一片。甘雨取雪，供于月海亭最深处案上，供毕退三步，再拜，不发一言。左右问：「此雪何贵。」甘雨曰：「此非雪，是山上递下之一问。」"
 GYP_decision_pw_envoy_childe:"遣使云来海"
 GYP_decision_pw_envoy_childe_desc:"公子之船队泊于港外，甲板上却设了茶。使者归，言其谈民生滔滔不绝，宛如一老账房。甘雨听毕，只摇头，曰：「愈把民生挂在口上者，愈须多留一分心。」遂命使再往，只问其港中米价今年几何。其船泊于云来海外，桅上霜色未退，绳结如北地所系。"
 GYP_decision_pw_envoy_lanyan:"遣使沉玉谷"
 GYP_decision_pw_envoy_lanyan_desc:"沉玉谷回话只一行：「汝等水章程写得比山路还绕，然未错一字。」甘雨看此一行，久不移目，乃曰：「绕者，慎也；不错者，敬也。」遂以此语书于月海亭之壁。"
 GYP_decision_pw_promulgate_codes:"抄章发署"
 GYP_decision_pw_promulgate_codes_desc:"新修典章数十卷，须一卷一卷抄发各处衙门、书院。有吏请择要抄之。甘雨曰：「择要者，便于己，不便于民。凡办事者，手中须有一本对得住之书。」抄发之日，各衙门前排一队，吏抱卷而入，如抱重物。典章抄发至月海亭，衙门前列一队，吏抱卷而入，如抱重物。"

 LYY_Event.10001.t:"月海亭灯犹未息"
 LYY_Event.10001.d:"内战落定，城头之旗改色，月海亭之灯未熄。诸司皆罢，独此亭中一盏，自夜达旦。有吏经其下，见窗上有影，影不动，久之乃知是人，非物。\n甘雨坐案前一夜，取帝君旧制，一册一册翻出。凡有可存者，批一存字；凡有当改者，批一改字；凡有不可解者，批一问字。至晓，三色之批满纸，案角朱砚已干。\n乃召诸文官环坐，曰：「神明已去，此城仍须有人管账，有人修路，有人替打翻之碗赔钱。此差事自今日归吾辈，办得好坏，亦由吾辈自认。」言毕，抽案头第一本文牍，置于众前，曰：「今日之事，从此册始。」\n众人视之，册皮已破，题签犹是旧年。无一人先取，亦无一人退。良久，一老吏趋前，取第一本，抱之怀中，曰：「此册吾熟。」众乃次第取之，案上空。亭中案上文书堆至齐眉，最上一层以铜镇压之。"
 LYY_Event.10001.a:"续掌月海，重建旧制"
 LYY_Event.10001.b:"退居山中，不复问事"
 LYY_Event.10002.t:"记塌之字最值钱"
 LYY_Event.10002.d:"清点残册之役，无人肯接。库中案卷为水所浸，黏结成块，揭之即碎，账目乱如一堆碎瓷。有吏请焚之，曰：「留此徒占屋。」\n甘雨不许，自坐库房，取浸水之卷，一页一页摊于日中，晾至半干，以石压平，压三日乃可揭。揭时以竹片自边入，入一分，停一刻，再入。一库之卷，凡两月乃毕。\n有小吏问曰：「此皆废纸，何用。」甘雨曰：「塌掉之物不值钱，记其所以塌之由，才值钱。」往后谁要修城，先来读一遍这堆纸，便少塌一次。小吏默然，退而视其手中一页，摆得比谁都整齐。是年冬，修南堤者果来，取册三卷去，归而改其基，堤成不坏。堤成之日，众请题名于石，甘雨曰：「题在册上，不必题在石上。其后每岁修城，先取此册，取者以手按册，若按故人之肩。」归离原残册为水所浸，页黏成块，揭之以竹片，揭一页须半日。"
 LYY_Event.10002.a:"先清册籍，后论修城"
 LYY_Event.10002.b:"即日动工，先复市面"
 LYY_Event.10003.t:"礼单折还界牌立"
 LYY_Event.10003.d:"坊巷重划，法有二：一按旧邻，一按人口，不按谁出钱多。图成，悬于市三日，任人指其误。指得实者改，指得虚者不问。\n有富室抬礼单至，厚朴重重，求易一巷之地。甘雨受单，不启，就案折之，折至四叠，还其人，曰：「君那份地，从前是买来者；今日分之这一份，是让出来者。」两笔账分开立，谁也不吃亏，谁也不占先。\n其人抱单而出，行至巷口，忽回头，看新插界牌一眼，牌上墨迹犹湿。旁人问其所见。其人曰：「我看此巷三十年，今日才知巷有几户。」是夜书吏请曰：「界牌须几时一换。」甘雨曰：「不必换，使人认得它便好。其后三年，坊中无一人移牌，亦无一人争界。」有司请增其法，甘雨曰：「法已足，所不足者人心。凡讼界者，先使观牌，观毕多不言而退。」界牌以木为之，立于璃月港巷口，牌上书界至，字以墨。"
 LYY_Event.10003.a:"按旧邻人口分坊"
 LYY_Event.10003.b:"按出资多寡定宅"
 LYY_Event.10004.t:"界桩一响老人收契"
 LYY_Event.10004.d:"田归本主之告示写得直白：谁耕之地归谁，战前旧契暂且靠后。示出，观者不信。有老农抱契纸至田埂，坐而不起，自辰至午，不发一语。\n甘雨闻之，不遣兵，不遣吏，只令书吏持锤至其田，当老人之面，重打界桩。桩入土，一桩一响，极实。至第三桩，老人忽起，取契纸叠好，收入怀中。\n书吏问曰：「翁不争了。」老人曰：「契，向人买者；界，向吾打者。吾争此物作甚。」乃俯身掬新土一握，以掌搓之，搓至碎，然后站起，顾四野曰：「此块地，吾认得。」甘雨在远处见之，语左右曰：「一桩之声，胜一纸之令。」左右问：「何以。」曰：「纸，听来者；声，看见者。」\n其人既去，犹回视界桩三次，桩上锤痕新白。是年此田大熟。老人以新米一斗，置于界桩之侧，不送官。归离原界桩以石为桩，锤痕新白，桩旁土松，脚印杂沓。"
 LYY_Event.10004.a:"还田于耕者，重打界桩"
 LYY_Event.10004.b:"田归公仓，按劳分给"
 LYY_Event.10005.t:"素服三日一炷香"
 LYY_Event.10005.d:"国丧之礼定得极简：不设大醮，不用童男童女，不烧纸人马，只留素服三日，清香一炷。礼官列其目，凡十一行，较旧制减其三之二。\n有老臣嫌其寒酸，持旧档入见，曰：「先帝之丧，动天下之力，今若是，恐失体统。」甘雨不辩，取旧档翻至一页，指其上曰：「当年立此条者，亦怕生人为死人，先把生人饿死。」礼者，为生人而定也。此一句，三千年前已写清。\n老臣视之，半晌不语，乃收折子，退至门，回身曰：「臣非惜其厚，惜其薄者无以表人心。」甘雨曰：「人心不在纸人马上。」老臣默然而去。\n丧毕，市中无一人鬻产，亦无一人典衣。礼官私记曰：「薄而人不怨，此可为法。」或问其故，礼官曰：「礼薄则人易行，易行则不废。故曰：礼之善者，不在其重，在其可久。」礼目十一行，书于素纸，纸以浆粘于玉京台门侧。"
 LYY_Event.10005.a:"国丧从简，礼为活人"
 LYY_Event.10005.b:"大办醮仪，以慰人心"
 LYY_Event.10006.t:"月朔亲添一盏灯"
 LYY_Event.10006.d:"帝君之神位空着，案、椅、印、灯，一样不动，一样不用。殿中每日洒扫，扫者不入其内，只扫至门槛而止，槛外砖上有痕一道，为三十年履迹所磨，深可容指。\n有人提议撤旧殿，改作衙门。甘雨不许，曰：「此殿不必供人，只须空着。」问者曰：「空殿何为。」甘雨曰：「使人知有位可空。」\n此后每月朔，甘雨亲至，取油一小壶，添于灯中。添时必先以袖拭盏口，添毕再拭，然后退。风雨不误，病亦不废。有吏请代其役，甘雨曰：「此非役也，此我一人之事。」或问：「既不用，何不灭之。」甘雨曰：「灭之则忘，添之则记。」问：「记何。」曰：「记彼位子可以空，却不该再有人坐上去。」言至此，火苗微动，满殿之影皆摇，而灯不灭。至晓，焰小如豆，殿中无一物动。玉京台殿中灯在案左，焰小如豆，殿中影随焰而摇。"
 LYY_Event.10006.a:"保留空殿，敬而不近"
 LYY_Event.10006.b:"改殿为衙，另立新堂"
 LYY_Event.10007.t:"户主何名无人识"
 LYY_Event.10007.d:"编户清册，不区贵贱，一家一行，一人一名。册用厚纸，双面书，正面书丁口，反面书田宅。凡三月，一县之册成，凡七千三百余行。\n有吏员嫌其琐碎，曰：「旧册只记丁数，今并名与年而记之，人力不给。」甘雨不答，取册翻至某页，指一行问曰：「此一家五口，户主何名。」\n吏员视之，答不上来。甘雨曰：「从前彼等是一串数字，从今日起，至少各自占着一行。」又问：「君家有几人。」曰：「六人。」曰：「君记得几名。」吏员曰：「六名。」曰：「此五口之家，亦当有六名之重。」吏员俯首，退而书，其字比往日工整许多。后此吏迁，衣袖中常带册页一纸，问之，曰：「此我手所书之第一行。其后他县仿之，册成，皆以一手书，不假吏胥。」有一县册凡九千行，书者三人，三人体不一，而字皆正。册成之后，以布为函，函上书县名，藏于璃月港档库。"
 LYY_Event.10007.a:"编户不辨贵贱，一人一行"
 LYY_Event.10007.b:"只登丁口，不问家产"
 LYY_Event.10008.t:"扁担上记一句话"
 LYY_Event.10008.d:"书院之门重开那日，无锣鼓，无贺客，只于门侧立一木牌，上书开讲时辰：每日巳时，风雨不改。头三日，来者九人。\n其九人者，船工二，挑夫三，卖鱼妇人一，织户一女，余二人不知其业。甘雨亲讲第一课，所讲者，如何看清一张借据里藏着之话：何者为利，何者为息，何者一写便还不清。\n讲毕，众不语。一挑夫忽自担上取炭条一段，就扁担之侧记之，字大而歪。甘雨问：「记此何为。」挑夫曰：「我担此担二十年，被人诳过三回。今记一句，回去讲与我儿听。」甘雨视其字，曰：「此一句，比我讲一堂要紧。此后书院不设门籍，来者书名于壁，不愿书者不书。」壁上字渐密，有以炭者，有以指蘸水者。数年之后，壁不能容，乃以木为屏，屏上题名曰问字墙。木牌立于璃月港书院门侧，上书开讲时辰，字为院长手书。"
 LYY_Event.10008.a:"书院广开，先教实用"
 LYY_Event.10008.b:"只收聪敏者，免耗钱粮"
 LYY_Event.10009.t:"三钥俱至题乃出"
 LYY_Event.10009.d:"贡院重修，号舍按旧制，一间隔一间，壁上旧题尽铲去。门前增设一槛，高三寸，考生入场，皆须跨之，谓之跨槛。\n题从库出，库有三钥，分掌于三人之手：一在礼司，一在学官，一在民间所选之老者。三钥俱至，门乃开。有旧家托人打听题目，以重币至。甘雨却之，曰：「题目我锁着。」其人曰：「锁在何处。」甘雨曰：「锁在三处。」其人曰：「三人之中，岂无一人可通。」甘雨曰：「可通者，非我所能禁。我只要一件：使寒门子弟走进来时，心里明白这一场所比，字也，非门户也。」寻门路者空手而去。\n榜前阶石，为考生踩得锃亮，一夏而凹。有考生入场，跨槛而踬，扶之者众，无一人笑。学官请去此槛。甘雨曰：「留着，使人记得门有多高。」去之，则门与街平矣。璃月港门槛高三寸，以木为之，木色深，中间磨得发亮。"
 LYY_Event.10009.a:"锁题三钥，只看文章"
 LYY_Event.10009.b:"宽其门路，许人荐举"
 LYY_Event.10010.t:"榜首乡里无名子"
 LYY_Event.10010.d:"第一榜贴出之日，围者里三层外三层。榜首姓周，乡里子弟，往年无人识其名；榜尾却有数人，皆城中熟面。\n观者议论，有名次不公之说。甘雨闻之，不辩，命人取前十名之卷，一并张挂于榜侧，判词尽书其上，一字不隐。\n看者初挑其刺，或指某句太朴，或指某字失韵。看到后头，议论渐低，有人以手指卷，指至再，然后默然。至暮，有一落榜书生独立卷前，取纸笔，将前十卷各抄一遍，抄毕乃去。守榜之吏问曰：「君已落，抄之何为。」书生曰：「抄之，知我差在何处。」吏归语于人，甘雨闻之，曰：「此子下科必中。」明年，此子果中第三。来谢，甘雨不见，只使人传一语：「谢榜，不必谢我。其后凡有落榜者抄卷，守榜之吏不驱，反为设一案于榜侧。」璃月港榜纸用黄，字用墨，榜首一行字较大，余者渐小。"
 LYY_Event.10010.a:"张挂前十卷，附以判词"
 LYY_Event.10010.b:"只出榜次，不示卷面"
 LYY_Event.10011.t:"史馆修书先书败"
 LYY_Event.10011.d:"史馆置于月海亭西厢，屋三间，案七张，执笔者皆老史官，年少者亦逾五十。甘雨初至，不设仪，不列班，取旧卷三册置于案上，卷角皆残，朱墨犹存，示众曰：「此后修书，败仗须书其全，胜仗须书其费。」\n一史官执笔良久不下，问曰：「胜而书费，后人读之，岂不谓我朝无一是处。」甘雨曰：「不书费，则后人以为胜可轻得，一岁再征，二岁三征，终有一岁征不动。」史者非为今人夸口，为后人留一杆秤耳。又问：「帝君之世，书否。」曰：「书。」帝君亦人也，功过并录，方见其为人之难。\n众皆默然，笔乃落。是日午后，西厢惟闻纸声、研墨声、咳声。有年少书吏自窗外过，见诸老伏案，笔尖皆正，无一纸斜置，归语同舍曰：「今日史馆之中，无一人抬头。」同舍曰：「所书何事。」书吏曰：「所书者，皆不好听之事。」馆在月海亭西厢，屋三间，案七张，案上灯七盏。"
 LYY_Event.10011.a:"直笔修史，成败并载"
 LYY_Event.10011.b:"只录功业，略去败绩"
 LYY_Event.10012.t:"月海亭新设议席"
 LYY_Event.10012.d:"中枢既复，不称内阁，不称军机，只题四字于门：月海亭议事。匾为素木，不加漆，字亦不描金。悬匾之日，有旧吏请加一衔，甘雨不许，曰：「名愈朴者，人愈知其所司；名愈峻者，坐其位者先自忘其为谁办事。」\n首会之日，两旧臣争盐课之数，声渐高，几至拍案。甘雨不拦，亦不判，但命书记逐句录之，一字不许删。争至日昃，两人皆倦，语乃缓，终以一句未定之数付下次再议。及散，堂中茶冷，纸上朱墨交叠，改处密如蚁行。\n执壶小吏收盏，低语曰：「这般吵法，何日能了。」甘雨适在其侧，答曰：「吵得住，便好；一日无人再吵，才真难办。」小吏曰：「无人再吵，岂不清静。」甘雨曰：「清静之堂，多是无人敢言之堂。」小吏捧盏退，行至阶下，回望满桌墨痕，竟似一片未扫之残雪。匾为素木，不加漆，字为甘雨手书，笔画略斜。"
 LYY_Event.10012.a:"中枢议事，兼听异说"
 LYY_Event.10012.b:"事权独揽，以免纷争"
 LYY_Event.10013.t:"重订历书复乐律"
 LYY_Event.10013.d:"历书重订，乐律亦复。司天者测影于台，乐工校律于庭，两处相去百步，晨昏钟鼓相闻。有少年问曰：「算节气与编钟磬，何干。」\n甘雨曰：「一岁之日有准，则耕者知何时下种，船家知何时避风，人心始有底；律音摆得正，则堂上之人开口，不至于先自怯。」二者皆不产一石之粟，然缺其一，国如空屋，桌椅未陈，客至无处可坐。\n少年未即答，归取新历一册，逐条手抄，抄至冬至一条，停笔问其师曰：「此日何以定在今日。」师指窗外檐影曰：「你看那影子，一年里最长之日，即是此日。」是日庭中试律，一老乐工拨弦三遍，弦忽断，众皆失色。老乐工换弦再拨，声乃和，曰：「弦旧则易断，律新则难和。」少年闻之，遂不复问，低头续抄。抄至末页，天已薄暮，庭中钟声一响，众乐工各收其器。司天者在玉京台测影，台以石砌，高丈许，四面无遮。"
 LYY_Event.10013.a:"重订历乐，立人间准绳"
 LYY_Event.10013.b:"沿用旧历，不必更张"
 LYY_Event.10014.t:"一斗一尺正市廛"
 LYY_Event.10014.d:"度衡归一，是件得罪人之差。诸商号旧尺旧斗，各随其意，一斗之米，自八升乃至一斗二升，积岁成例，无人肯先改。甘雨命铸新器，铜身铁底，皆刻月海亭款，逐户校之，用旧器者罚。\n有粮行掌柜当众摔其旧斗，斗破米撒，骂曰：「做三十年买卖，倒叫一个量器管住。」骂毕拂袖而去，市人环观，无一人出声。翼日清晨，其门先开，新斗已置于柜上。人问其故，掌柜不答，良久但曰：「新斗量得准，客人肯多走两步，此便足矣。」\n未及一月，市中斗尺皆同。有老妇持一升米归，途遇邻人，举袋示之曰：「今日此升，较往日为满。」邻人曰：「米则一也，只是从前那斗亏汝。」\n老妇默然，行数步，忽回头望月海亭檐角。檐角风铃响一声，市声如故。新尺以竹为材，刻度以刀刻，刻毕以漆填之。"
 LYY_Event.10014.a:"铸衡归一，分毫不让"
 LYY_Event.10014.b:"随俗从众，不计尺寸"
 LYY_Event.10015.t:"遣使致书玉衡星"
 LYY_Event.10015.d:"与玉衡通书，语甚恭，而意甚实。书曰：「粮道可共守，政见可各执。」使者临行，甘雨召至阶前，授书一卷，以竹筒盛之，封以素泥，嘱曰：「彼处账目清明，人亦直，与直人语，不须绕；然勿望其退半步，彼若退，必已账上算过。」\n使者问：「若彼不肯共守粮道，奈何。」甘雨曰：「彼亦要食粟。粮道一断，玉衡之境先乱，彼算得比吾辈清。」使者又问：「若彼愿共守，而欲分我之权。」甘雨曰：「权可分，账不可乱。」分权而账乱，则共守之约，一岁即废。\n书发之前，称呼改三遍：初称玉衡星，再称玉衡，末乃只用二字曰刻晴。左右问其故，曰：「称其衔则议事，称其名则议人。此事关人，不关衔。」使者既去，甘雨取底稿收于档，另抄一份，置于案头常用之叠，此后凡玉衡来书，皆附于此稿之后。书以竹筒封，筒上以蜡封口，蜡上压小印。"
 LYY_Event.10015.a:"致书玉衡，共守粮道"
 LYY_Event.10015.b:"拒其插手，独掌粮政"
 LYY_Event.10016.t:"玉衡回书止数行"
 LYY_Event.10016.d:"回书至，纸短，字硬，通篇不过数行。其略曰：「粮可共守，理可各执，尔手底之账，我信得过。」送书者立于阶下，不肯即去，曰：「吾主命我候回音。」\n甘雨读至第二遍，忽止，指末句示谋士曰：「此一句，重于千言。」谋士不解。甘雨曰：「世上最难共事者，非仇敌，乃相轻之人。」相轻则不肯用其长，亦不肯信其数。今彼看不惯我，我亦未必服彼，而肯同收一季之稻，此最可望。\n谋士曰：「既相轻，何不各治其境。」甘雨曰：「各治其境，稻熟之时，界上必起争。」共收一季，界上之人先认得彼此之面，往后才好相见。言毕，取书折好，压于案头最常取那叠公文之下，压得很正。乃语送书者曰：「回告尔主，账我照旧送，一分不减。」送书者再拜而去。行至门外，闻堂中有人低声曰：「此书不过数十言，何以看得这般久。」璃月港书坊之纸短而窄，边留白少，字硬，笔画如刻。"
 LYY_Event.10016.a:"回书订约，各执其理"
 LYY_Event.10016.b:"暂置其议，以观其变"
 LYY_Event.10017.t:"天权来函皆数目"
 LYY_Event.10017.d:"天权回函，密不透风，通篇皆数：某处粮价几何，某路运费几何，途耗几何，折色几何，一笔一笔，如呈课卷。函用硬黄纸，折处压得极平，无一字涂改。\n甘雨逐行阅毕，取笔批于卷末曰：「算得极细，惜漏一端，食粟之人，非数目也。」写毕搁笔，视之良久。左右曰：「此语恐触其忌。」甘雨曰：「触则触矣。彼掌一国之利，最不缺承顺之人，所缺者一句实话。」\n是夜，她把已批之卷又取回，反复看那行小字，终未涂去。窗外港中樯灯次第灭，案上一盏犹明。她以指按了按那行墨，似要按平纸痕，然后合卷，命人诘朝发出。\n左右问：「既知其必不悦，何不另写婉辞。」甘雨曰：「婉辞我写得来，只是写完，这一页账便白送。」卷发之后，她另取一纸，把那句批语抄下，夹入自用之册。函用硬纸，纸厚，折处有白痕，折三折而后封。"
 LYY_Event.10017.a:"通使天权，共理财政"
 LYY_Event.10017.b:"拒之门外，不假财阀"
 LYY_Event.10018.t:"天权账簿附一页"
 LYY_Event.10018.d:"再函至，账后别附一页，不列总数，只书数处歉收之乡，与所当减之课。纸色与前函不同，另纸别书，不加印，不署名，字迹与前函同，笔势却缓，末行有小注曰：「此数未经核实，姑备一说。」\n甘雨阅竟，笑曰：「此一页，胜前数十页。」遂召管赈者，指名单曰：「此数处，先备粮，勿待文书往返。」管赈者曰：「课额未定，粮从何出。」甘雨曰：「从明年之账里出。今年不备，明年连账亦无从算。」\n数日后，天权处亦遣人来问减课之数，两处所拟，相去不过一成。左右以为奇，甘雨曰：「非奇也。」同一片田，同一场雨，算得细者，算到底皆是一个数。所差者，只在肯不肯把它写下来。乃取那附页，命人另抄一份，附于本司税册之末，题曰：「某年歉收备考。」附页纸色与前函不同，另纸别书，不加印，不署名。"
 LYY_Event.10018.a:"纳其减课之议"
 LYY_Event.10018.b:"只取其财，不入其言"
 LYY_Event.10019.t:"一纸问雪上绝云"
 LYY_Event.10019.d:"绝云间之雪，是甘雨最熟亦最不敢多触之物。遣使上山，公文只一行：「山上旧约尚在，可肯下山一坐。」封讫，又拆开，添一句曰：「莫劝，莫求，只把话放下便回。」\n使者问：「若彼不答。」甘雨曰：「不答亦是一答，汝且去。」使者曰：「山上路险，雪深及膝，往返或须十日。」甘雨曰：「十日之内，我不催汝。」使者遂行，至山门，守关者拦之，验其公文，看了半晌，方侧身放行。\n使者归，携一言并一片不化之雪，盛以木匣，匣中无他物。言只四字：「各安其分。」甘雨取雪置于案，看了半夜，灯油添过两回。左右请她歇息，她曰：「她既肯答话，便比吾预想多走一步。」肯答话者，门尚未闭。\n天将明时，她起身，把那片雪移至窗下有光之处。雪不化，光却移，一室渐白。公文只一行，封讫又拆，拆处以浆补之，补痕白。"
 LYY_Event.10019.a:"亲赴绝云，续其旧约"
 LYY_Event.10019.b:"绝云难信，不必相请"
 LYY_Event.10020.t:"片雪送到月海亭"
 LYY_Event.10020.d:"片雪至月海亭，盛以素瓷小碟，径不过三指。甘雨独坐半日，未召一人，案上公文堆至半尺，一份未翻。她本是麒麟，却择留人间，此念藏三千年，未尝语人。今见此雪，忽觉彼山之上，亦有一人如此坐着，只是坐得更冷，连炭也不肯添。\n使者复命曰：「彼只留四字，各安其分，别无一语；问以下山之事，彼举目看雪，不答。」甘雨曰：「各安其分，亦好。」即以指轻推瓷碟，使雪正对窗。左右问：「既不肯下山，何苦再遣使。」甘雨曰：「遣使非为请她，乃使她知，山下尚有人记得她之名。」又曰：「她不肯添炭，盖怕暖了，便不肯再回山上去。」\n是日午后，有吏送公文入，见案上瓷碟，问此何物。甘雨曰：「一片雪。」吏曰：「雪何以不化。」甘雨不答，只把公文接过，翻开第一页。翻至第三页，忽又抬头看那雪一眼，然后续看。素瓷小碟径不过三指，碟底有窑印，印文模糊。"
 LYY_Event.10020.a:"认下这片雪，各自珍重"
 LYY_Event.10020.b:"弃雪于地，专心国事"
 LYY_Event.10021.t:"北国使者奉厚礼"
 LYY_Event.10021.d:"北国遣使，携厚礼一箱，厚书一卷，条件写得极漂亮：借道运粮，岁输其半，余者归我。箱中皮货、琉璃、金器，列于阶下，映日生光。使者衣裘，立于阶下，礼数极周。\n甘雨阅书三遍，取笔于回函末书曰：「粮可借，路不借。」使者色变，问其故。甘雨不辩，只把两本账推至案前，一为彼国之出入，一为我境之转运，曰：「尔之算盘，我算过；我之门户，我亦算过。借粮，我尚有余；借路，我即无门。」\n使者曰：「如此，恐伤两国之好。」甘雨曰：「伤好者，非今日之拒，乃他日之开门。」言毕，命人将礼箱原封舁回，一件不留。使者退至阶下，立雪中良久，终无一言，登车而去。甘雨即召港吏，命重清粮仓，另录一册，藏于别处。港吏问：「既已拒之，何必再清。」甘雨曰：「拒在今日，备在明日。」璃月港箱中皮货、琉璃、金器，列于案，案不足，续以几。"
 LYY_Event.10021.a:"借粮不借路"
 LYY_Event.10021.b:"受其厚礼，共理粮运"
 LYY_Event.10022.t:"云来海畔一盏茶"
 LYY_Event.10022.d:"公子来书，语甚随意，末幅画一小舟，樯斜帆歪，墨有溢出。书中曰：「战最费钱，贾最省钱，尔中原人，每每倒置。」\n甘雨阅竟而笑，左右罕见其笑，皆不敢问。良久，她指那画舟曰：「此人可虑处，不在其刀，在其把刀与钱看得一样清。」看轻钱者易与，看重刀者易防；两样皆看得清者，最难对付。乃取笔于画舟旁题二字曰：「可虑。」\n遂命使臣备茶一盏待之，自己不出。使臣归报曰：「彼饮尽，问此茶何名。」臣答曰：「云来海之茶。彼曰：海上有茶乎。」臣不能对。甘雨曰：「下次告之，海上有茶，亦有账。」自是北边有事，她必多留三分神，案上另备一册，专记彼处商旅往来之数。册首所粘，即那幅画舟，旁有她所题二字，别无注语。往来书札，她多不存，独存此一幅。书末画一小舟，樯斜帆歪，墨有溢出，溢出成一小点。"
 LYY_Event.10022.a:"以文治应北国之商谈"
 LYY_Event.10022.b:"以刀兵拒至冬之好意"
 LYY_Event.10023.t:"兰砚拦使沉玉谷"
 LYY_Event.10023.d:"沉玉谷之约，初只一卷水土章程。使者持书入谷，行至半山，为兰砚所拦。兰砚不接书，先问曰：「尔等文书，何以写得比山路还绕。」\n使者不辩，亦不还口，只把那卷章程置于石上，曰：「绕与不绕，请先看毕。」兰砚曰：「我不看。」使者曰：「看不看由你，书我留此。」遂退三步，坐于崖下，自午至暮，不动。山风起，卷页翻动，兰砚数次以石压之，终乃拾起。使者自崖下望之，见其就火光一页一页翻，翻至水图那一页，停得最久。\n是夜，谷中灯燃至四更。翼日，兰砚使人送还一卷，只批一行：「绕则绕矣，然未写错一字。」甘雨见之，笑曰：「此一行，抵我三月往返。」乃命人另抄一份，附以谷中旧例三条，再送沉玉谷，曰：「她既肯挑错，便肯管此事。」谷中雪，未见其止。使者行至半山，山道窄，两崖夹之，雪未消。"
 LYY_Event.10023.a:"纳沉玉之约，勘水立界"
 LYY_Event.10023.b:"斥其多事，独定章程"
 LYY_Event.10024.t:"逐页批注指三误"
 LYY_Event.10024.d:"长文送回，逐页批注，边角写得密密麻麻，字小如豆。兰砚指出三处水位算错，又添两条当地旧经验：一曰某年雪水骤至，二曰某段堤基是浮沙。\n甘雨收到，不先看批语，先命人核那三处。三日之后，核者回曰：「三处皆错，一在春汛，一在潮位，一在闸口之高。」甘雨默然良久，曰：「此三处若照原文发下，层岩之下又要多添几个名字。」乃取原卷，以朱笔于三误处各圈一痕，圈毕，手停其上，久未移开。\n乃召司水者，命尽改，改毕于落款处添沉玉谷之名，曰：「错是我错，改亦当书明谁改。」左右曰：「彼并未应我之约，何必处处标其名。」甘雨曰：「世上最难得者，有人肯认真读汝所写每一字，哪怕其并不打算听汝。」\n此后司水者改文，必先自核三遍，曰：「勿使沉玉谷再挑出错。」批注以朱笔，字小如豆，行间不足则引线于页边。"
 LYY_Event.10024.a:"纳其三处更正，添其名"
 LYY_Event.10024.b:"自执己见，不改一字"
 LYY_Event.10025.t:"五方和议开三日"
 LYY_Event.10025.d:"五方和议，设于月海亭，凡三日。刻晴遣执笔者，凝光遣管账者，绝云间来一人，布衣不名，北国载一船货至，沉玉谷送水文图一捆，以绳束之。五纸摊于案上，墨犹未干，次序未定，无一人肯先署。\n甘雨不为东，不设主席，只做添茶之人。每有争执，她不劝，只添茶一盏，置于争者之前；茶凉则换，换至第三盏，争者自止。北国使者问：「此会何人为首。」甘雨曰：「无首。」使者曰：「无首则无约。」甘雨指案上五纸曰：「约在纸上，不在人上。」至第三日，争端只剩一条：粮船到港，先卸谁家之货。\n散会之日，五椅皆温，案上留一圈茶渍，无人拭。有随从取布欲擦，甘雨止之曰：「留着。」随从问：「留此何为。」甘雨曰：「留此使后人看，五家曾在此坐过，且坐得下去。」议事于月海亭，凡三日，案上茶换九回，纸用三种。"
 LYY_Event.10025.a:"五方同席，共立和议"
 LYY_Event.10025.b:"只与同道结盟"
 LYY_Event.10026.t:"五旗同悬一厅中"
 LYY_Event.10026.d:"五面旗头一回同悬一厅。旗色各异，长宽不一，无一处相配，悬于梁下，风过则交拂有声。司仪者问旗次，甘雨曰：「以到之先后为次，不问新旧。」\n有人提议按位次排座，谁尊谁卑，先定其次。甘雨摆手曰：「谁先来谁坐前头，谈事而已。」其人曰：「如此，则强与弱无别。」甘雨曰：「今日之别，在谁肯让一步，不在谁坐上位。」其人无言而退，自居于末座。\n那三日，有人争至面红耳赤，有人一言不发，只记笔记。散时，无一人占尽便宜，亦无一人空手而归。甘雨独立厅中，仰视五旗，忽忆三千年前，其中有两面曾是死敌，兵相接于云来海，尸浮三日。左右问她在看甚么，她曰：「看风。」风从北来，五面旗往一处倒。绳既换，五旗复张，风势一顿，厅中忽静。旗色各异，长宽不一，悬于梁下，风过则交拂有声。"
 LYY_Event.10026.a:"留旗同挂，不论位次"
 LYY_Event.10026.b:"定其高下，序其先后"
 LYY_Event.10027.t:"空殿长明一盏灯"
 LYY_Event.10027.d:"帝君神位空已三年，香案积灰，无人敢多擦一分。殿门不闭，亦不设守卫，风自入门，帷幔微动。案前一盏长明灯，油将尽则焰低，焰低则满殿皆暗。\n甘雨每月朔日，亲往添灯油一次，从不停。添讫，立于案前，不拜，不祷，亦不语，约一炷香乃出。守殿老吏初不敢问。至第三年，乃问曰：「此灯为谁而点。」甘雨曰：「不为谁，为我自己。」老吏不解，退立门侧，视其添油，手极稳，一滴不落于案。\n老吏曰：「为己，则何必月月来。」甘雨曰：「使我每月记得一回：此殿中空着那一位，是从前替这座城做过事之人。」灯可长明，位不可长占。老吏闻之，退半步，取布将案上薄尘轻轻抹去，曰：「既如此，灰也该擦得。」甘雨曰：「擦，勿厚。」是夜，殿中灯焰极平，一点不摇。玉京台殿门不闭，帷幔微动，风自入门，灯焰偏而复正。"
 LYY_Event.10027.a:"空殿添灯，历久不改"
 LYY_Event.10027.b:"扫殿改衙，断其旧迹"
 LYY_Event.10028.t:"祭仪仍旧卜不问"
 LYY_Event.10028.d:"祭仪照办，问卜乃停。甘雨把此事写进典章，措辞留有余地：敬天如故，求签问卦，不载于国事。文下另注一行：「祭可循旧，议须凭实。」\n有老臣力争，免冠伏地曰：「此断人与天之路也。」甘雨扶之起，曰：「路未断，只不再以之为凭。」天有雨，人不能使天降雨，亦不能因求了雨便不问渠通不通。老臣曰：「若无凭据，则政出无据。」甘雨曰：「凭据在人，在账，在田中之水，不在签上。」老臣张口欲辩，甘雨已取案上水册一册，翻至某页，指其数曰：「此渠三年未修，旱时水至何处，册上皆有。」\n老臣犹不屈，退而谓人曰：「自此以往，人无所畏矣。」甘雨闻之，不怒，命人取旧年签文一册予之，曰：「此册中签，应者几何，不应者几何，公自数之。」老臣持册归，数至半月，不复言。玉京台典章措辞留有余地，末注一行，字稍小，似后来添者。"
 LYY_Event.10028.a:"敬而不用，载之典章"
 LYY_Event.10028.b:"废其祭仪，一切从简"
 LYY_Event.10029.t:"谶纬归档附应验"
 LYY_Event.10029.d:"历年谶纬、天象、旧签文，命史官一条条抄录，另纸归档，每条之后，附其后来应验与否。应者书应，不应者书不应，含混者书曰不可考。一册之中，朱笔与墨笔相间，墨者录原文，朱者录后事。\n有老吏越查越惊，一日执卷至阶下，曰：「某年之谶，竟与今日之事合，此岂非天意。」甘雨取卷视之，曰：「此条后注不可考，何以便谓之合。」老吏曰：「合则合矣，何必问其可考。」甘雨曰：「合者偶也，考者实也。以偶为实，则明日任举一事，皆可称天意。」老吏默然，抱卷而退，行数步，又回身曰：「然则应者何以如此之多。」甘雨曰：「应者多，因人所问者，本为其愿信之事。」\n卷成，甘雨于卷末题一行：「此为后人留一本能自辨之书。」此书置于书院最显之格，翻者最多，纸角先破，批注亦最密。有士子于卷首添一行曰：「读此册，如看人猜谜，谜底皆在其后。」璃月港每条之后附应验，应者书应，不应者书不应，不删不抹。"
 LYY_Event.10029.a:"存录谶纬，附以应验"
 LYY_Event.10029.b:"焚其旧文，另立新说"
 LYY_Event.10030.t:"天问一册无答语"
 LYY_Event.10030.d:"天问册成书之日，甘雨只题三字为序：问过了。不序，不跋，不署年月。书只一册，纸用旧纸，字用浓墨，厚不过一指。\n有学生翻开，见所问尽是无答案之事：天理尚在否，仙人算不算人，契约写在谁心里，帝君若在世，可肯签此约。学生读至末页，掩卷问曰：「皆无答，何以成书。」甘雨曰：「无答者，亦是答之一种。」学生曰：「然则先生所问，可有问对一半者。」甘雨曰：「有一二，写在页边，字较小。」\n学生曰：「既无答，读了何用。」甘雨曰：「使人知此世尚有问不得解之事，不敢以一言定天下。」又问：「先生想多少年。」甘雨曰：「三千年。」想不明白不要紧，要紧者，还敢问。学生退，取纸将此数句抄于己册首页，抄毕又添小字一行：「敢问者，先要不惧无答。」册只一册，纸用旧纸，字用浓墨，厚不过一指，藏璃月港。"
 LYY_Event.10030.a:"编成天问册，任人来问"
 LYY_Event.10030.b:"只出官定答案"
 LYY_Event.10031.t:"层岩裂口再加封"
 LYY_Event.10031.d:"层岩之裂，又加固一遍。所用者新铸之合金，所灌者新法之浆，昼夜不停，凡二十一日。工人三班倒，井口昼夜悬灯，灯下有人执册，记每一车石、每一桶浆。\n封门之日，甘雨亲下井口，立至最后一道闸落。石闸沉下时，声闷而长，井中之风忽止。工人皆跪，无一人语。甘雨不跪，只以手按闸上，掌心贴石，久不移。有老工头欲上前扶之，为同伴所止，曰：「让她按片刻。」\n良久，乃曰：「底下此物不讲道理。汝得意时，它便来提醒：人间之楼盖得再高，下面仍压着一层照不到之处。今日多封一分，明日之人便少赌一次命。」\n言毕，井口一工匠抬头曰：「那吾辈封到哪一日为止。」甘雨曰：「封到无人再问此句为止。」闸既落，井口复以巨石覆之，石上刻一行小字：「此处不可轻启。」工人三班倒，井口悬灯，灯油一日三换。"
 LYY_Event.10031.a:"铸新闸，亲下井口"
 LYY_Event.10031.b:"循旧法，勉力维持"
 LYY_Event.10032.t:"井下名录添一页"
 LYY_Event.10032.d:"井下牺牲者名录，又添一页。新页之上，字迹有老有少，有工整者，有歪斜者，末数行为旁人代书，旁注曰：「此人不能书。又有数行只一姓，无名，注曰：同伴呼之如此。」\n甘雨命为每名立碑，不分其生前属何一方。有司请曰：「敌方之死者，亦立碑乎。」甘雨曰：「亦立。」司曰：「恐人议。」甘雨曰：「议者立于碑前，自会止声。」司无言而退，命石工并刻，不别其行。\n碑成之日，来者甚众，有胜者，有败者，有两者皆不认者，有远来而不知碑上之人为何者。众人立于碑前，自辰至午，无一人先走。日昃，一老妇以手抚一名字，曰：「此吾儿也，行时云去领工钱。」左右闻之，皆不语。碑阴刻一行曰：「凡死于此井者，不问其旗。」后有不知谁何者，以炭于其下添四字：「亦不问罪。」璃月港页上字迹有老有少，有工整者，有歪斜者，旁注代书。"
 LYY_Event.10032.a:"为亡者立碑，不问敌我"
 LYY_Event.10032.b:"只记己方牺牲"
 LYY_Event.10033.t:"层岩旧债编成卷"
 LYY_Event.10033.d:"层岩历年所欠之账，编为一册：「某年塌方，填几人，赔几家，用几工，停工几月，一一具列。」有数处无籍可查，只书曰：「某年某月，死者不详。」册厚二指，封皮以粗布裹之，绳结三道。\n甘雨阅至不详二字，命人复访。访者曰：「事隔十余年，村中老者已尽，无从问。」甘雨曰：「则书访之不得，勿书不详。」访者曰：「书此何用。」甘雨曰：「不详者，吾懒也；访之不得者，吾已尽力也。此二者，后人看得出。」访者乃再出，行七乡，得三十七人姓名，虽不全，皆录之。\n卷成，编号入库，与另数册并排。甘雨曰：「欠而不记，则永为一笔糊涂账；记明白，后人接手，方知肩上所扛者几重。」执笔之吏问：「此册谁看。」甘雨曰：「今日无人看，十年后有人看，那便够了。」册中数处无籍可查，只书某年某月四字，字下留白。"
 LYY_Event.10033.a:"旧债成卷，逐笔立档"
 LYY_Event.10033.b:"旧账一笔勾销"
 LYY_Event.10034.t:"库中留空一层架"
 LYY_Event.10034.d:"卷宗入库之日，甘雨亲入库房，逐架圈定位置，命人以朱笔书名于架端，字不许斜。架用杉木，新刨者尚有木气，入库之日，满室皆香。\n至最显一层，她命留空，不置一卷。管库小吏问其故。甘雨曰：「库满，则人以为事已到头；留空，是告后人，此架还会满。」小吏曰：「若终不满。」甘雨曰：「那更该留。」空架在此，人便知尚有未做之事。小吏曰：「然则此架终须满。」甘雨曰：「满一层，再留一层。」\n小吏照办。此后每有新卷入库，皆按朱笔所圈排列，十年未错一卷。\n有新任书吏初入，见空架上一层薄尘，欲拭之，老吏止之曰：「勿拭。此尘乃故留者。」新吏不解，老吏指架上朱字曰：「汝看那字，写者待续。其后库吏迁转，交接之日，必指此空架曰：此非未及编排，乃故留者。」玉京台架用杉木，新刨者尚有木气，架端以朱笔书名。"
 LYY_Event.10034.a:"留下空架，以待来日"
 LYY_Event.10034.b:"库满为足，不复留位"
 LYY_Event.10035.t:"镇渊不用刀而用典"
 LYY_Event.10035.d:"镇渊之法，甘雨择其最笨者：修一部专讲深渊沿革与祭法之典。祭仪载之，历次封堵之得失亦载之，某年以何法封、历几年复裂、伤几人，一一具列，不加隐讳。书成之日，卷凡四册，封皮以青布，题签手书。\n有将校笑曰：「此物不顶用。」刀剑尚镇不住裂缝，纸墨何以镇之。甘雨曰：「刀剑镇一时之裂，镇不住人心之怕。」怕者不知底下是何物，夜闻风声便以为渊动，一村惊走，十村皆乱。使其知所避，则一纸胜一队。将校闻之，收其笑色，改问曰：「然则此典，当先与谁看。」甘雨曰：「先与住在井边之人看。」\n典成，先发层岩周边每一村，每村一册，置于祠堂。有老农不识字，命其孙读之，读至某年塌方一节，老农曰：「此我少时亲见。」孙曰：「书上亦有。」老农遂每夜令其孙读一页，读毕方睡。读至末页，老农忽问：「此册可借我一夜。其孙曰：爷爷不识字。」老农曰：「我抱着它坐一夜。」典载祭仪与历次封堵之得失，厚可盈尺，字为手抄。"
 LYY_Event.10035.a:"修镇渊之典，遍发村落"
 LYY_Event.10035.b:"严密封锁，秘不外传"
 LYY_Event.10036.t:"千岩改营换臂章"
 LYY_Event.10036.d:"千岩军重编营伍，饷照旧，名号则换。旧号旗尽收，新臂章以青布为底，绣一城形，无神徽。点校之地在校场，晨雾未散，队列未整，先点名。\n点校之日，甘雨立于将台，曰：「此军从前所守者城；自今以往，亦须记守城中之人。」台下静一时，随后起应声，与从前不同：前者齐而短，此者散而长，如众人各自答了一句。甘雨闻之，不复言，只令再应一次。第二次之声，较第一次又不同，末一字拖得极长。\n有老兵抚新臂章，不语，以掌将其抚平。收队时，取旧号旗卷好，塞入背囊最里层，绳扎两道。同行者问：「旧旗何以尚留。」老兵曰：「留之为记，非为再张。」同行者视其背囊，见旗角露出一线，色已褪尽。老兵既扎好，以手按背囊，按至再，乃随队出营门。门侧有新臂章坠于地，他弯腰拾起，置诸阶上。璃月港臂章以青布为底，绣一城形，无神徽，线为青白二色。"
 LYY_Event.10036.a:"改营易名，护城亦护民"
 LYY_Event.10036.b:"军制照旧，只换将校"
 LYY_Event.10037.t:"关墙另开一道门"
 LYY_Event.10037.d:"山口关隘，逐处重修。新图样上多一条旧图所无者：关墙之下，须留一门，阔可过板车。图样之下，另注一行：「门高三尺，不容甲士并出。」\n有校尉不解，指图曰：「门多则守难，敌自此人，何以御之。」甘雨曰：「关隘所挡者兵，勿并逃难之百姓一并关在外。」校尉曰：「若敌混于民中。」甘雨曰：「则设二门，外门验，内门缓；宁多设一队人，不使一村人死于门下。」校尉犹疑，终乃按图施工，边筑边骂，骂至门成，不作一声。\n门成，守卒私称之为小民门。逢战事，此门先开，亦最后闭。日久，守门之兵渐学会看人：看其手上之茧，看其鞋上之泥，看其抱子之姿势，不只看旗。有老卒告新卒曰：「旗可换，茧不会。」后有御史过此，问门名，守卒答曰小民门。御史驻马良久，取笔记之，记毕曰：「此名不雅，然不可改。」门在云关墙之下，阔可过板车，门高五尺，门扉以木。"
 LYY_Event.10037.a:"关墙留门，通民有路"
 LYY_Event.10037.b:"关墙求固，不留隙口"
 LYY_Event.10038.t:"猎户入队先认路"
 LYY_Event.10038.d:"巡山之哨队，招本地猎户、药农充之。甘雨所下第一条令，非操练，乃认路：哪条道可走骡马，哪处崖可藏人，哪条溪旱季断流。令下之日，众猎户相顾而笑，曰：「此我等自幼所学，何用以军令行之。」\n有军校不悦，曰：「兵者当练队列、练枪法，何以为此。」甘雨曰：「守此山之人，先须知此山。不识山而守山，如闭目守门，门在何处亦不知。」军校无言，退而立于一猎户之后，视其所指。是日午后，军校随猎户入山，行半日，迷于岔路者二次，皆由猎户引还。\n半年后，队中自绘山川图成，较官图更细：某溪几月断，某崖雪后不可行，某处有野蜂，皆注之。管图老吏取官图对看，良久，把自己那一份悄悄卷起，收入柜底，此后呈报皆用队中之图。队中老猎户曰：「官图看山，看图上山；我等看山，看雪上山。」雪先落何处，路便在何处。明冠峡山道错杂，雪落则路隐，猎户看雪先落何处，路便在何处。"
 LYY_Event.10038.a:"就地募人，先取识山者"
 LYY_Event.10038.b:"调他处精锐，从严整训"
 LYY_Event.10039.t:"兵器刻名始入库"
 LYY_Event.10039.d:"兵造自港口近郊移入山坳，炉迁七日，产量近倍。附近村落顿添人气，酒肆、铁铺、鞋店次第开张，夜里有歌。厂中炉火昼夜不熄，山下望之，如一小星。\n甘雨定一规：所造之物，皆刻工匠之名。有匠曰：「刻名则有过皆归我。」甘雨曰：「亦归功于汝。」匠曰：「功不功我不计，只怕一日兵器杀人，人持此物来问我。」甘雨曰：「问到汝，方是问对了人；不问到汝，才可怕。」匠无以为对，退而告其徒曰：「自今以后，手要稳，名要清。」\n头一件刻名之兵器，置于厂门半月方入库。匠人路过，总要停步，看自己那三个字。有年少学徒问其师：刻三个字，何以看得这般久。师曰：「汝看者非字，是自己之手。」学徒遂亦刻一小名于废铁上，日日摩之。其后厂中立一石，刻匠名于上，凡有过者亦刻，功过并列，石面渐满。黑岩厂中山石一方，刻匠名于上，功过并列，石面渐满。"
 LYY_Event.10039.a:"兵器皆刻工匠之名"
 LYY_Event.10039.b:"兵器只标官厂之号"
 LYY_Event.10040.t:"乡兵按坊登名册"
 LYY_Event.10040.d:"乡兵不复临时拉夫，按里坊登记在册：「各家出丁，丁有定数，役有定期，期满即归。」册成，一坊一册，存于里正之家，官不另藏，许人借看。\n训练课目之中，添一条：先学如何不误伤自己人。有新兵不解，曰：「枪当向外，何以及内。」老兵不答，只将其枪口轻轻抬高一分，曰：「高一寸，伤天；低一寸，伤前头那人。」新兵视枪口，久不语。新兵遂每晨举枪，先学抬高一寸，抬至手酸乃止，日日如此。\n甘雨曾语人曰：「上过阵者皆知，难者不在开枪，在枪口抬高一寸。此言后写入操典首页，纸角翻得起了毛边。」有里正抄一份贴于坊门，风雨剥蚀，字迹渐淡，无人肯换，但每逢阴雨，必有人以袖掩之。有老妇送子入册，临行嘱曰：「汝若开枪，先看清是谁。其子点头，行数步，又回头看他母亲一眼。」册成一坊一本，存于璃月港里正之家，册角以布包之。"
 LYY_Event.10040.a:"乡兵入册，先教不误伤"
 LYY_Event.10040.b:"临时签丁，以充员额"
 LYY_Event.10041.t:"城南武备开讲堂"
 LYY_Event.10041.d:"武备学堂开于城南，旧仓改造，梁上尚有谷壳。所讲者：行军、布防、粮道，亦讲如何算一场仗可打不可打。堂中设沙盘四具，皆以木为框，沙上插小旗，旗色不分敌我。\n甘雨往听一堂。讲者以沙盘推演，两军相对，问学生：此仗当不当打。学生多言当打，言胜算七成。甘雨乃问：「七成之外那三成，是谁性命。」堂中一时无声，讲者亦停手不推。有学生起而对曰：「三成之命，亦在算中。」甘雨曰：「既在算中，何不先说。」学生不能答，坐。\n课后，她语学生曰：「会舞刀者多，用刀之前先想一想者少。」学堂所悬第一幅图，是标出井泉村落之行军图，图上无一处标出敌营。\n有学生临摹一份，贴于床头，其父见之，问：「此图何以不画敌营。」学生曰：「先看人住在何处。其父视图良久，曰：此图我看不懂，然看得懂汝这一句话。」堂在璃月港城南旧仓，梁上尚有谷壳，风吹则落。"
 LYY_Event.10041.a:"设武备之堂，先算后战"
 LYY_Event.10041.b:"只练刀马，不问得失"
 LYY_Event.10042.t:"开厅三旬听众议"
 LYY_Event.10042.d:"纲常既定，往后向何处走，议事厅中争整整三旬。甘雨命大门敞开，不设门籍，凡来者皆可入，入者皆可言。开厅第一日，阶下立者百余人，阶上无一席。\n有贩夫立于阶下言盐价，有士子言田制，有老兵言关隘，有一老妇言其子戍边三年未归。言者或结巴，或重复，或前后相悖，书记皆录，录至卷宗堆半人高，案几为压得作响。甘雨自晨至暮，坐于侧席，不发言，只添水。添至第七壶，水已淡如清汤。\n争至末旬，仍无定论。左右请裁，甘雨曰：「吵不完最好。」真吵完，才是无人敢开口。往何处走，交与肯担者担之。乃命将三旬条陈尽编其号，收入档中，另题一签曰：「此三旬之言，后人可复按。」有吏问：「此签何用。」甘雨曰：「使后人知，今日之乱，乃有人逐条听过者。」玉京台厅门敞开，不设门籍，凡来者皆可入，入者皆可言。"
 LYY_Event.10042.a:"开三日门，尽听其言"
 LYY_Event.10042.b:"择人而听，速定大计"
 LYY_Event.10043.t:"天下定鼎灭长灯"
 LYY_Event.10043.d:"天下定鼎之日，甘雨亲至殿中，吹灭虚君位上那盏长明灯。灯芯既熄，一缕青烟直上，至梁而散。殿中旧设五席，其一空，余四席亦无人，惟尘埃厚处有鸟迹。\n殿中暗了一瞬。众人皆屏息，无一人动。俄而天光自门隙入，渐照阶前，阶上尘土浮于光中，如细雪。甘雨立而不动，久之乃举步，履声在空殿中甚响。她以手抚阶石，石上有旧刻，字已磨平，指过而不识，亦不问。\n出月海亭，街市如常：卖豆腐者吆喝，学童背书，船照旧进出港口。她立于街侧，看了很久，轻声道：总算不用再替神操心。往后操心者，是吾辈自己。旁有一小吏闻之，不知如何答，只将手中公文抱得更紧。小吏后语人曰：「那日我看她站着，才明白她也是一个人。」人站着，也会不知往何处去。殿中旧设五席，其一空置，席上无物，惟余一垫。"
 LYY_Event.10043.a:"熄灯转向人间"
 LYY_Event.10043.b:"保留长灯，不改其志"
 LYY_Event.10044.t:"宪章首条问百姓"
 LYY_Event.10044.d:"任官宪章，首条书于最显之处：为官者，先问百姓，后问上官。字大如拳，墨重，几透纸背。宪章凡十二条，首条独大，余条皆小字，附于其后。\n有老吏观之，摇首曰：「此语一出，上下倒置，必乱。」甘雨曰：「乱者，非此语，是自上而下问了三千年。」老吏曰：「上官不悦，则考成难。」甘雨曰：「考成之权，吾另设一司，不由上官独断。」老吏无以为对，退而抄此条于己册，抄毕自笑曰：「抄三十年公文，头一回抄得手抖。」\n乃命抄此条，遍给新任之官，每人一纸，嘱曰：「此非训词，是账目。尔之俸禄，自谁之口袋省出，宜时时记得。」\n后有石工刻此条于衙前石上，出入之官皆从石下过，多有人低头；亦有昂然而过者，石工见之，私记其名。石成之日，有官轿过，轿中人令绕行于侧，绕毕，帘后有人低声问：「石上所刻何字。」璃月港首条字大如拳，墨重几透纸背，余条字小，行间匀。"
 LYY_Event.10044.a:"颁任官之章，先民后官"
 LYY_Event.10044.b:"仍守旧制，以官为先"
 LYY_Event.10045.t:"考成榜下无人冤"
 LYY_Event.10045.d:"考成则例，所考皆实事：修几堤，赈几饥，清几笔钱粮。虚文不与，空言不录，纸上有数者，须有案可查。则例刻板颁下，各衙门皆悬一份于堂，字不甚工，然无一处模糊。\n头一年考绩，三自诩老练之官落等，一闷声不响之县丞评上上。问其故，则曰：「此人数月之间，将县中十九条塌渠尽通，渠通而田熟，田熟而课足。」左右翻其册，通渠之日记，一日不缺。县丞受榜，不喜亦不谢，只曰：「渠通，田自熟，非吾之功，乃水之功。」\n榜贴之日，满城聚观，议论纷纷，却无人喊冤。落等三人，翼日清晨各赴辖地，无一人上状。有旁观者曰：「此榜未见一字褒贬，观者却皆会意。」榜悬三日，纸角为人所揭，揭者非怨者，乃一学童，取其纸归包书。学童包书之纸，后为其师所见，师曰：「此榜你拿来包书，倒算包对。」榜贴于璃月港县门，纸以浆粘，观者自榜下排至街口。"
 LYY_Event.10045.a:"开考成则例，实绩论官"
 LYY_Event.10045.b:"循资历升迁，以免纷争"
 LYY_Event.10046.t:"鸣冤鼓移闹市口"
 LYY_Event.10046.d:"谏议之司，专为不能言者执言。甘雨命将衙前那面无人敢敲之鸣冤鼓，移至最热闹之街口，去其围栏，不设皂隶。鼓初移之日，市人环观，无一人上前，鼓槌悬于侧，随风微动。\n或问：「置于闹市，恐生喧乱。」甘雨曰：「想告状者，谁都可敲；我拦不住，他人亦拦不住。又命司中置一册，凡敲鼓者，不问其状之虚实，先录其言。」第一日敲鼓者，为一卖鱼妇人，言其夫为衙役所殴，言未毕而哭，鼓槌落于地，滚出三尺。\n鼓面不久便敲得斑驳，皮革起毛，声亦渐哑。值守吏员初以为烦，日久乃觉：鼓下之人所言，往往最实，较大堂上递来之折子更近实情。有一日无人敲鼓，吏反不安，出视者三，见街上人往人来，鼓静立如故。吏检其册，见所录百条，有三十余条言语不成句，皆照样录下，旁注曰：「原话如此。」鼓移于璃月港南市最喧处，去衙门三里，围栏尽撤。"
 LYY_Event.10046.a:"设谏议之司，许民直诉"
 LYY_Event.10046.b:"闭其言路，以保威严"
 LYY_Event.10047.t:"典章成书亲校字"
 LYY_Event.10047.d:"典章成书，凡数十卷。甘雨逐条校过，日阅三卷，阅毕必以朱笔于纸角记日，记至末卷，案前灯已换过四回。第一日校水利，第二日校刑名，第三日校漕运，日日如之。\n校至乡里分水一条，文只百余字，言旱时先后之序、争时谁断，最琐屑，亦最无人愿写。有属吏请删，曰：「此等细事，不入大典。」甘雨曰：「大典管国，小条管日子。」国能不能立住，常断在这类无人愿写之处。遂留之，且置于农事之首。属吏退，取删去之稿另存一册，题曰：「曾请删而不许者。」\n书成，她只在卷尾签名，不序不赞。刻版者言：「此数十卷字，写得比寻常稳，横平竖直，无一笔苟。」有老吏闻之曰：「非字稳，是心定。」刻版者问：「心何以定。」老吏曰：「一条条想明白才下笔，笔自然不抖。」老吏言毕，刻版者取一纸试印，印出首行，字口极清，墨不透背。玉京台校时以朱笔于纸角记日，日阅三卷，灯换四回。"
 LYY_Event.10047.a:"典章为纲，连细条一并颁行"
 LYY_Event.10047.b:"只颁大典，小节从简"
 LYY_Event.10048.t:"郡县各守其尺寸"
 LYY_Event.10048.d:"郡县两级重划，谁管内政、谁掌兵，条文写得明白：郡理刑名粮赋，县理田土户婚，兵则别隶，不得兼。条文之下，附列旧日兼摄之弊十二条，皆实事，不著人名。\n赴任之官辞行，甘雨只嘱一句：「到地方，先看两样，田里之水，衙门之账。」有官问：「二者若相悖。」甘雨曰：「以水为先。」账可明年再算，水误一季，田便荒一年。官皆记之于简，有记于掌者，出城数里犹视其掌。\n有老臣忧权分太散，曰：「散则事缓，缓则人玩。」甘雨曰：「散一点，出事才知该问谁；全攥于一手，烂亦只烂在里面，无人得见。」老臣曰：「若诸郡各自为政。」甘雨曰：「故设岁会，一年一聚，账目对看。」赴任车马，随后一队队出城门，尘头相接。老臣默然，退而取郡县新图细看，看到夜半，以朱笔圈其三处，圈毕置笔，叹了一声。璃月港新图以厚纸绘，郡界以朱，县界以墨，兵区以虚线。"
 LYY_Event.10048.a:"郡县复原，权责两分"
 LYY_Event.10048.b:"事权归一，集中号令"
 LYY_Event.10049.t:"太学门额四字题"
 LYY_Event.10049.d:"太学落成，门额四字，甘雨所题：「为不为名。」士子聚观，多有不解。有问者曰：「四字何解。」门额悬素木，未漆，四字亦未描金，日光照之，笔画有影。\n甘雨曰：「上为字，读去声，谓有所为；读平声，谓名。」合之则曰：「有所为，不为名。」士子又问：「读书不为官，则为何。」甘雨曰：「为有一日你撞上一桩不公之事，说得出，也扛得住。」说不出者，未读过也；扛不住者，只读过也。士子闻之，一时无对，有低头者，有目视门额者，有一人忽笑，笑毕自掩其口。\n太学中最热闹者，乃通宵亮灯之辩论堂。堂中灯油，每月多领数回，掌灯者屡请添额，皆准。有一夜灯油耗尽，诸生以烛续之，烛尽，则以书册遮窗，借月光续辩，至天明方散。此事后为掌灯者记于簿，末书一行曰：「某夜无油，诸生以月续读，天明乃散。」璃月港门额为素木未漆，悬时以铁钉四枚，钉帽外露，未及磨平。"
 LYY_Event.10049.a:"立太学，为不为名"
 LYY_Event.10049.b:"只育官吏，专攻举业"
 LYY_Event.10050.t:"退粮三十车还民"
 LYY_Event.10050.d:"宽政者，非减赋之名，乃将该收者收明白，不该收者退回去。甘雨命将各乡税册摊于衙门口，列长案十余张，谁家之账，谁自核。长案之首，另置一册，凡自核者皆签名于册，官亦签。\n有豪强不服，率仆从十余人至，曰：「查得这般紧，是做给谁看。」甘雨曰：「做给汝看。汝嫌紧，可来与我一条条对。」对完，多收者一分不少退，少收者亦一分不少补。豪强曰：「若我不对。」甘雨曰：「则我替汝算，算完张榜于市。」豪强闻之，色变者再，终乃命其账房抱册来对，对至夜分，烛换三支。\n头一年，退回去之粮装三十车，自衙前发至四乡。领粮者排至街尾，无一人吵嚷，亦无一人多取。有一老妇领粟二斗，退半步，曰：「我家只该这些。」发粮之吏视册，果然二斗，遂以笔记之：某乡某妇，多一粒不取。吏书毕，老妇已去。册上墨迹未干，风吹欲起，吏以镇纸压之。长案十余张，列于璃月港衙门口，案上摊税册，册以石压。"
 LYY_Event.10050.a:"宽政之实，退其多收"
 LYY_Event.10050.b:"照旧征收，以充国库"
 LYY_Event.10051.t:"诏书三稿用初稿"
 LYY_Event.10051.d:"月海之治诏书，甘雨写三稿，废三稿，末乃用最初一稿。初稿最短，通篇无一漂亮语。三稿并陈于案，字迹一稿比一稿密，末稿最长，而弃之最先。\n所书只数事：此后璃月，饥者有食，寒者有衣，受屈者有处说理。有文吏请增骈句，曰：「诏书无文，恐不足示后世。」甘雨曰：「后世要看者，是吾许何事，非吾写得多好。」文吏曰：「然则太朴。」甘雨曰：「朴者不欺人。」文吏无言，退而取废稿三纸欲焚，甘雨止之曰：「留着，使后人知吾曾想写得好听。」\n颁诏之夜，满城灯亮至月落。有老人立于灯下，朝北方之天慢慢躬一躬。守夜者见之，不往打扰，退立于墙影里。\n良久，老人直身，取袖拭面，转身入巷，巷中门开一线，有人接他进去。是夜守夜者三人，皆见老人鞠躬，三人相顾，无一人言，惟各将灯芯剪短，使其明。玉京台三稿并陈于案，一稿比一稿长，初稿最短，字最大。"
 LYY_Event.10051.a:"颁月海之治诏"
 LYY_Event.10051.b:"暂缓颁诏，以观人心"
 LYY_Event.10052.t:"一壶茶上绝云间"
 LYY_Event.10052.d:"请仙入朝之书，甘雨亲送上山。不携仪仗，不带甲士，只携一壶茶、一本账。山路积雪，行者三人，一持书，一负茶具，一抱账册，皆步行。\n至山上，语诸散仙曰：「不请诸君管事，只请诸君来坐，听一听人间今日之难。」有仙人问：「汝图甚么。」甘雨曰：「图三千年来头一回，人与仙能坐一张桌边，喝同一壶茶。」仙人闻之，有默然者，有相顾者，亦有一老仙以杖叩地者三，叩毕不言。\n有仙人冷笑曰：「人间之事，人间自了。」甘雨不辩，取账展开，指一处曰：「此乡去年饥，赈粮至此，路断三日，人食树皮。」仙人视账，久不语。茶凉，甘雨另沏一壶，又坐一炷香工夫。临行，一仙人送至山门，曰：「茶不好。」甘雨曰：「山上水硬。」仙人曰：「下次带软水来。」甘雨下山时，日已西斜，雪上三人之足迹，上山时深，下山时浅。奥藏山山路积雪，行者三人，一持书，一负茶具，一引路。"
 LYY_Event.10052.a:"请仙入朝，共商疑难"
 LYY_Event.10052.b:"疏远仙家，各守其界"
 LYY_Event.10053.t:"东厅添席不设名"
 LYY_Event.10053.d:"月海亭东厅添席数张，不设名位，不置签，谁来谁坐。席次无常，先至者居前。席用旧木，不加漆，坐久则吱然有声，每逢此声，堂中皆静一瞬。\n有文官不惯，曰：「坐次不明，则体统不存。」甘雨曰：「座上之人换得勤些，底下之言才听得真些。」文官曰：「仙家与吏员同席，成何体统。」甘雨曰：「彼等在山中坐了几千年，不争这一席；汝才坐三年，倒先争起来。」文官语塞，退就末席，次日亦早至，先坐于前。\n仙家议事不多言，惟每逢有人报数太顺，必有人轻声问一句：「此数如何算得。」此一问，较任何章程皆管用。\n日久，报账者入门之前，先自核算草，算草带在身上，问则出之，不敢空口。有一仙家问数毕，不待答，先自取笔，于纸上另算一过，算毕置笔，无一语。席用旧木，不加漆，坐久则吱然有声，声细而长。"
 LYY_Event.10053.a:"设仙班之席，参议不主政"
 LYY_Event.10053.b:"只备顾问，不入议事"
 LYY_Event.10054.t:"绝云立约各按印"
 LYY_Event.10054.d:"绝云之约，写得像一份家规：仙掌地利，人掌民事；有争执，请德望高者裁，裁者亦须让三分。约文不过三百字，分七条，第七条最短：凡约中未书者，皆可再议。\n有仙人笑曰：「此约太软，软则无人守。」甘雨曰：「我正要留一处能商量之余地。」话若说死，往后谁都不好退；留着余地，才有人肯坐下。仙人曰：「若人先违约。」甘雨曰：「约中已书，违约者先失其席，不失其命。」仙人曰：「既留余地，则人必试之。」甘雨曰：「试亦无妨，试一次，约便实一分。」\n立约之日，山上山下各按手印。纸上两印，一深一浅，深者朱浓，浅者指瘦。执约者请再按一次，甘雨曰：「不必。」浅者亦是指，何必求其一样。约成，分藏三处：一在月海亭，一在绝云间，一在沉玉谷。执约者将三份分卷，各以蜡封，封上无印，只书一字：约。约文不过三百字，分七条，末一条言争执时如何裁。"
 LYY_Event.10054.a:"缔绝云之约，留商量余地"
 LYY_Event.10054.b:"划清仙凡，各不相犯"
 LYY_Event.10055.t:"祭典头香老农点"
 LYY_Event.10055.d:"天人同序，将祭天、祭地、祭山河之礼重排一遍。所排首位者，非天，乃春耕。礼官持旧仪单请裁，甘雨取笔，将春耕一条勾出，移于卷首，余者不动。\n有老臣以为次序倒置，免冠争曰：「天在上，田在下，何得先田。」甘雨曰：「天予人间之好处，皆自一场好雨、一季好收成而落到实处。」既从田里来，便从田里敬起。老臣曰：「此乃媚农，非敬天。」甘雨曰：「农不需媚，农需渠通、种足、税轻。」\n老臣退至阶下，与同列语曰：「此论我辩不过，然心中终觉不安。」同列曰：「不安者何。」曰：「不知天怒否。」\n典礼之日，头一炷香由一老农点。老农手足无措，捧香不敢上前，礼官引之三次，乃前。点火时手抖，火苗三起三灭，第四次乃燃。众皆静立，无人笑。老农插香毕，退三步，忽向田跪下，跪者非坛，乃田。礼官欲扶之起，甘雨止之曰：「让他跪。」是日风大，香烟斜出三尺，直指田间。归离原香案设于田头，案以木板为之，板上铺以粗布。"
 LYY_Event.10055.a:"春耕居首，田里敬起"
 LYY_Event.10055.b:"神灵居首，循其旧序"
 LYY_Event.10056.t:"仙参其议不主政"
 LYY_Event.10056.d:"仙辅之政，请数位仙人入议事厅常席，辅政而不主政。席有座而无印，有言而无决。席设东厅之侧，与吏员之席隔一案，案上置茶，不置印匣。\n席约写得明白：事由人决，仙只参议；参议之言须记入档，可查可驳。或问甘雨：不怕仙势坐大。甘雨曰：「怕。故写成字。」字比人情牢，人情可转，字转一次要许多人看着。问者曰：「字可转乎。」甘雨曰：「可。」须三议三录，三录俱在，方可改一字。\n有仙人阅此约，指其中一条问曰：「仙若不言，亦须记否。」甘雨曰：「记。不言亦是一议。」仙人点头，先按印，余者随之。印既按毕，一老仙忽曰：「三千年以来，头一回有人言，吾辈之话要记进档。」言毕自笑，笑中并无喜色。老仙又曰：「此档存于何处。」甘雨曰：「存于库，与民籍同架。」老仙曰：「那吾辈之话，便与小民之话同架。」甘雨曰：「然。」玉京台席设东厅之侧，与吏员之席隔一案，案上置籍一册。"
 LYY_Event.10056.a:"仙辅之政，事由人决"
 LYY_Event.10056.b:"仙主其政，人从其言"

 GYP_PW_Spirit_Moonlit_Secretariat:"灯下印屡换"
 GYP_PW_Spirit_Moonlit_Secretariat_desc:"亭中之灯，三千年未曾真熄。其制甚奇：一盏既尽，即以次盏续之，火不落地。守灯者世其职，传火之法，父子相授。有新任者失手，火几灭，急以手护之，掌焦而不放。老守灯者见之，不责，曰：「此火不须汝护，汝须护者，护火之心。」新任者泣。后三十年，其人守灯，未曾一夜离亭，亭外人事几变，灯下印绶几易，其火如一。灯在月海亭正中，罩以铜，风入则焰偏而复正。"
 GYP_Spirit_Central_Chancery:"惟名议事厅"
 GYP_Spirit_Central_Chancery_desc:"新署既立，议其名。有请称内阁者，有请称军机者，有请称枢府者。主事者皆不许，只命叫议事。众问其故。主事者言名重则人争名，名轻则人争事。署成，门额只二字。凡议事，坐次不以官之高下，以事之先后。贵官至，见其座在末，不悦。主事者告以今日所议非君所司，故坐末。贵官又问他日议其所司，亦坐末乎。主事者曰：「然。」贵官默然，入座，坐半日，发言三次，皆见采。署在月海亭西偏，门额二字，未漆，木纹外露。"
 GYP_Spirit_Code_of_Rites:"细务皆成文"
 GYP_Spirit_Code_of_Rites_desc:"典章之作，先大典，后细条。大典三十卷，细条三百。属吏请先成细条，谓其切于日用。主事者不许，言细条易，大典难，世人多避难就易，故须先难。属吏谓日用之事久无所据。主事者乃命其先草细条之目，而后成之。属吏退，草目三日，得一百二十条，呈之。主事者指一条，令注明何人不在此条之内。属吏愕然，问此亦须注乎。主事者曰：「不注，则此条将管及不当管之人。」典章稿本存于月海亭书库，凡三十卷，卷各一函。"
 GYP_Spirit_Civil_Service_Exams:"文章与实绩"
 GYP_Spirit_Civil_Service_Exams_desc:"试院既开，贡院之前，士子云集。有富家子乘马而至，仆从五六；有寒士徒步，担一箱书。入场，皆解衣搜检，富家子以金赂守门者，守门者不受，指壁上字曰：「此有明文。」试毕，糊名易书，考官不知其谁。榜出，富家子落，寒士中。富家子之父怒，诣主事者。主事者取糊名之卷示之，曰：「君自读之，此卷亦佳，然不及彼卷。」其人读竟，无言而去。贡院设于玉京台东，号舍百二十间，间广三尺。"
 GYP_Spirit_History_Bureau:"败绩亦直书"
 GYP_Spirit_History_Bureau_desc:"史馆修书，凡战必两录：一录胜，一录费。录胜者书其功；录费者书其亡、其耗、其民之徙。武将入馆，见其败战详载，怒，请削。史官不许，谓削之则此书不成。武将谓此战非汝所亲见。史官谓所据者军牒。武将与军牒出，指之，史官不能辩，乃改三字。改毕，曰：「此三字，吾记之，他日别录。」武将去，史官复取原稿，藏于箧底。史馆在玉京台后院，架比屋梁，尘积于架顶，扫之不尽。"
 GYP_Spirit_Court_of_Rites:"陌路亦相揖"
 GYP_Spirit_Court_of_Rites_desc:"礼司所掌，非大典，乃日常。相见之揖，饮食之让，丧葬之哀，三者而已。属吏问礼者所以别尊卑，今皆同之，礼将安用。司礼者答以礼者使人相接而不相犯。别尊卑者，势也，非法也。属吏又问尊卑遂无别乎。答以别之于事，不别之于人。属吏未解，退而观市：见担夫与店主相揖，店主让担夫先入。属吏乃叹曰：「此谓相接。」司中旧存归终四诫拓本，末一句为：众志一心，亘古不移。"
 GYP_Spirit_Adepti_Concord:"仙坐末座议"
 GYP_Spirit_Adepti_Concord_desc:"仙与人同朝，坐次不别。一仙人久不发言，众问之。答以听。众又问听何。答以听诸君争；争者愈急，其理愈见。众问仙既有定见，何不早言。仙答以一己之言出口，则众不复争；众不复争，则一言即为定，而定者未必当。众问然则仙终不言乎。仙曰：「终有一言，在众争既毕之后。」是日议事至夜，仙终未言，惟于散时言今日所定，吾以为是。殿外九柱刻仙名，柱下各置一石，石上无字。玉京台九柱之侧植柏九株，柏长三丈，风过则声如潮。"
 GYP_Spirit_Revere_Not_Ask:"祭存而卜废"
 GYP_Spirit_Revere_Not_Ask_desc:"祭仪如旧，牺牲、乐章、拜跪，一无改。惟问卜之礼废。老祝史谏，谓不卜则神怒。主事者不纳，言神若因不卜而怒，则神亦小矣。老祝史问然则祭何为。主事者答曰：「祭者，敬也，非求也。」求者以神为市，敬者以神为祖。老祝史默然，退而治其祭，仪节较旧为肃。是岁大旱，众请卜，主事者不许，命开渠、发仓、减赋。三月而雨，众谓此不卜之功。主事者曰：「此渠与仓之功也。」祭坛在玉京台南，坛以青石三级，级面磨滑。"
 GYP_Spirit_Chasm_Ledger:"塌方皆有档"
 GYP_Spirit_Chasm_Ledger_desc:"层岩之事，历年有之，旧惟口传，不入官册。新令既下，凡塌方、伤亡、赔补，逐笔立档。老吏言此事年年有，记之则册不胜记。主事者不许，谓正因年年有，故必记。老吏乃记，记三月，成一函，呈之。主事者阅至末，指一处，问此三人何以无赔。老吏答以其家已绝。主事者曰：「家绝，档不可绝。」命添一行，书其名。添毕，函重一分，而老吏自觉其肩亦重。"
 GYP_Spirit_Grain_Abundance:"义仓与授田"
 GYP_Spirit_Grain_Abundance_desc:"仓廪之政，凡四：开仓以赈，平粜以抑价，授田以安流民，立义仓以备凶年。四者皆不获利。商贾笑之，谓官为赔本之事，何以久。仓吏问其曾见凶年乎。商贾言凶年米贵，彼亦得利。仓吏乃言：君得利而人相食，则君之米亦无所售。商贾默然。是岁秋，义仓初成，仓吏取新谷一捧置于案，曰：「此一捧，非谷也，此一年不惧也。」义仓在归离原东，屋五间，梁上题年号，字已褪。"
 GYP_Spirit_Open_Academies:"舟子亦执卷"
 GYP_Spirit_Open_Academies_desc:"书院重开，门额书开讲时辰，不书讲者之名。初开之日，来者十余人，多市井。船工坐末，足上犹带泥；挑夫倚门不敢入，讲者招之，乃入；卖鱼妇人携一篮置于足旁，鱼腥满室，无人掩鼻。讲至半，童子问字多则人易欺乎，字少则人易欺乎。讲者答以识字者不欺人，亦不为人所欺。童子点头，以指画地，画一横，曰：「此是一。」院中植霓裳花一株，花开时香气入讲堂，讲者不以为扰。"
 GYP_Spirit_Five_Concords:"五旗同挂堂"
 GYP_Spirit_Five_Concords_desc:"五旗同挂，色各不同，垂于厅之四壁，其一面悬于梁。使者仰视，谓此旗向不并立。主事者答以今日并立，非为和，为谈。谈三日，各有所求，各有所让。至第三日暮，一使起言所得不足偿所失。主事者答以其所失者纸上之利，所得者明年尚可谈。使者视其旗，良久，曰：「可。」众各取笔，署于议末。署毕，无人称贺，惟闻厅外风声，与旗动之声。五旗挂于月海亭厅壁，其一面悬于梁，风至则五旗不同向。"
 GYP_Spirit_Rule_by_Civil_Service:"官俸出民赋"
 GYP_Spirit_Rule_by_Civil_Service_desc:"官箴之首章曰：「为官者，先问百姓，后问上官。」新任知县读之不解，问于老吏。老吏言此语有二义：问百姓者，问其所苦；后问上官者，非不问，乃后问。知县问若二者相违如何。老吏答以此正此语之所以立。知县又问违时当如何。老吏曰：「违时，则问汝之俸出于何人之口。」知县默然，退而书四字于座右：俸出民口。官箴刻石立于月海亭阶侧，凡新任者至，先读一刻。"
 GYP_Spirit_Immortal_Regency:"仙议亦入档"
 GYP_Spirit_Immortal_Regency_desc:"新制：事由人决，仙得参议。参议之言，必录于档，不删，不改，不隐其非。仙人自谓言多谬，录之则为后世笑。主事者正欲后世笑。仙人愕然。主事者乃言：仙言而无人录，则仙言如风；仙言而录之，则仙言如证；他日有失，后世可指此档，谓昔者某人已言之而不用；此于仙于国，皆为益。仙人视档良久，取笔，自书其名于首。参议之档藏于玉京台石室，架以铁力木，编号以朱。"
 GYP_Spirit_Everlasting_Moon:"月海灯不熄"
 GYP_Spirit_Everlasting_Moon_desc:"月海亭中一盏灯，换人掌之，三百年不灭。掌灯者老死，复有少者受钥；少者老死，复有更少者受钥。或问此灯照何物。掌灯者答以照路。问者谓亭中人皆识路，何须照。答以所照非为今夜，乃为来者。灯油常竭，钥常有声，而灯未尝一夜不燃。治一城者，功不必在一身，惟不可使灯自吾手灭耳。"

 GYP_PWRite_Tier_1:"礼统之阶"
 GYP_PWRite_Tier_1_desc:"旧礼尽废，新规未立。人各凭心，事各凭意。热闹固热闹，然无章法，明日该听谁，无人知。战后城中分三区，区各有主，主各出令；一令行于东者，西不认。商运货过界，须换三纸，纸各不同，而所载之数亦不同。"
 GYP_PWRite_Tier_2:"礼统之阶"
 GYP_PWRite_Tier_2_desc:"新礼粗具轮廓，众人勉强按谱行事，行得生涩，渐成习惯。衙门文书日多，争执反少。文书之式既定，凡呈必三页：一陈其事，二列其据，三署其名。老吏嫌其繁，然三年之后，翻旧案者但看三页即明，乃不复言繁。"
 GYP_PWRite_Tier_3:"礼统之阶"
 GYP_PWRite_Tier_3_desc:"上下有序，进退有度。人与人之间，多一层郑重之分寸，少几分兵荒留下之粗粝。战后初年，市中詈声不绝；三年之后，詈者改以冷语，冷语又改以不交一言。老吏谓此非和，乃各知界限。"
 GYP_PWRite_Tier_4:"礼统之阶"
 GYP_PWRite_Tier_4_desc:"典章完备，规行矩步。举国如一部上弦之机，精确，庄重，亦透一丝不容通融之冷。凡讼，不问情，先问据；据不足者，虽冤不理。妇人失其夫，讼于堂，无据，判不受。妇人退，立于阶下，至暮乃去。"
 GYP_PWRite_Tier_5:"礼统之阶"
 GYP_PWRite_Tier_5_desc:"规矩织成一张不见之网。网中人举止得体，却无人敢越雷池半步。活人至此，便活成一件礼器。少年欲改一旧礼，父止之，曰：「改者须先受议。」少年问议在何处。父指满城，曰：「处处皆议。」少年乃止。"
 GYP_Bond_Tier_1:"仙凡之阶"
 GYP_Bond_Tier_1_desc:"山上山下互不相干。仙不肯下山，人不敢上山。两处之间，连一条像样之路亦无。山径为草所没，樵者不敢深入；山顶之灯夜夜明，山下人只当星辰。少年指而问其父，父曰：「莫指，指则有罪。」"
 GYP_Bond_Tier_2:"仙凡之阶"
 GYP_Bond_Tier_2_desc:"仙凡初通，有几句话递回来，多半仍是试探。彼此留客气，亦留距离，无人肯先交底。山上遣人送药一囊，山下回以茶一篓，两不相见，皆由路口石上取放。石上积雨，囊与篓各垫一叶，恐湿其物。"
 GYP_Bond_Tier_3:"仙凡之阶"
 GYP_Bond_Tier_3_desc:"仙凡相安，山上肯下山坐坐，人间也愿意把难处摊开来讲。一张长凳，两样人，各坐一头，也说得上话。长凳置于月海亭外，初时一头常空；三月之后，两头皆满，中间仍空一尺。吏欲移其凳，主事者不许，曰：「此一尺，须留。」"
 GYP_Bond_Tier_4:"仙凡之阶"
 GYP_Bond_Tier_4_desc:"仙凡相亲，议事厅中多几张不言不语之席。每逢有人报账报得太顺，总有人轻轻追问一句。此一问，比诸般章程都管用。追问者多不署名，只于册角画一记号；被问者复算三日，往往自改其数。久之，报账者先自算三遍，乃敢上呈。"
 GYP_Bond_Tier_5:"仙凡之阶"
 GYP_Bond_Tier_5_desc:"仙凡一体，事由人决，仙佐其议，分寸写进纸里。人间之路走得稳，云上之手亦放得下；惟凡事多绕一道，快不起来。凡大事，先议于人间，后咨于山上，咨毕复议。一堤之成，前后四月；而四十年不溃。主事者谓此四月，买四十年。"
 GYP_PWCombo_Both_High:"月海同光"
 GYP_PWCombo_Both_High_desc:"典章立得住，仙凡亦肯同桌。文官按册办事，山上之人按时下山。甘雨立于月海亭门槛，立许久，曰：「此城又有烟火气，又有分寸。」言毕，她取案上一册，翻至第一页，于开篇二字之外，另添一行小字：此册不自今日始。添毕合册，交与书吏。"
 GYP_PWCombo_Both_Low:"两头皆空"
 GYP_PWCombo_Both_Low_desc:"纲常未修，仙缘亦断。衙门文书愈写愈客气，山上之人愈不肯来。甘雨抱两摞无人签之卷宗，独坐灯下，久不语。既而曰：「此灯，照不亮整座城。」她将卷宗分作两摞，一摞自留，一摞命人送上山。送者问，若山上不收如何。甘雨答曰：「不收，便放在山门，任其积尘。」"
 GYP_PWCombo_A_High:"独尊文治"
 GYP_PWCombo_A_High_desc:"典章条条清楚，礼数处处周正。然山中之人不来，祭仪之钟亦只人敲，无人听。甘雨看此整齐良久，忽念起从前殿上那盏灯，总有仙人陪添。她取笔，欲于典册末添一款，笔至纸面而止，久之，仍书四字：「待仙来议。」书毕合册，置于架之最上层。"
 GYP_PWCombo_B_High:"仙缘独厚"
 GYP_PWCombo_B_High_desc:"绝云间之人来得勤，疑难解得快。惟人间之规矩总往后拖，衙门文书愈积愈厚。甘雨算过此账：仙力可救急，替不得长治；欠下之人情，早晚要还。她乃立一册，专记所欠：某年某月，求仙解某难，欠几分。册上已十七行，末一行留白，旁注二字：「待还。」"

 #################### 申鹤 · 绝云间 ####################
 SHP_CivilWar_Lone_Crane:"孤鹤收剑下山"
 SHP_CivilWar_Lone_Crane_desc:"帝君崩问至绝云间，申鹤方于峰顶试剑。雪落无声，剑光映雪，一峰皆白。使者陈其言，申鹤未听毕，即收剑入鞘，曰：「凡间之伞，今已破矣。」是人素不属一方，亦不预人间事。然其冷眼所见者一事：城失所奉，若无新骨承之，必散为尘。是夜雪大，九峰皆隐于云。诘朝，山门忽启，有人仰见一鹤自云中下。"
 SHP_Claim_the_Peaks:"绝云九峰立帜"
 SHP_Claim_the_Peaks_desc:"九峰之巅，各竖一旗，无徽无字，惟素帛一幅耳。申鹤不登台，不宣示，亦不使一人下山传语。但令匠人于山门刻石一行：「此地非人间。」有老樵夫上山，读之不解，问守门者。守门者曰：「山主不欲与谁争地，惟欲使人记起，云端之上自有一重秩序，不受人间管辖。」老樵夫拄杖立良久，曰：「如此，则吾辈自此不得上山砍柴矣。」守门者不答，侧身让之。"
 SHP_The_Ascetic_Order:"清修令下无声"
 SHP_The_Ascetic_Order_desc:"清修之令既下，绝云间为璃月最静之地。晨钟暮鼓，一衣一食皆有定数，行者遇人低头，不相问讯。有少年弟子夜半咳嗽，恐乱钟节，以袖掩口，伏于雪中，俟咳止乃起。申鹤巡山见之，不赏亦不斥，惟曰：「能守清修者，方能守山河。此言传于山中，众皆称是。然自是一山之内，无一人敢高声语，亦无一人敢言其所欲言。」"
 SHP_Summon_the_Adepti:"遣使遍召仙众"
 SHP_Summon_the_Adepti_desc:"使者四出，遍召散居之仙。至则不叙旧谊，不设酒，惟案上置棋盘一、戒尺一。仙人入，见之皆默。申鹤曰：「愿共守此山者坐，不愿者出门右行，此后不必再踏此阶。」有仙者拂袖而起，棋盘为之倾，黑白满地，遂去。余人俯身拾子，一枚一枚，置于盘中，拾毕方坐。是日坐者十七，去者三，无一人问山中几时开饭。"
 SHP_Purge_the_Heretics:"雪夜清剿旁门"
 SHP_Purge_the_Heretics_desc:"肃清之夜，雪色一变。执法者持册而行，册极长，卷之盈臂。册上一名，或为一句戏言，或为一次夜谈，书者已忘其详，被书者亦忘。叩门三下，门内先静，而后灯灭，而后门开。申鹤不临刑场，独坐中庭，案上立香一炷。香灰寸寸而断，风过不散。香尽，雪忽止，山中人皆闻其语曰：「山路既平，羊方能专心修行。」"
 SHP_The_Mortal_Yoke:"山下输粮纳役"
 SHP_The_Mortal_Yoke_desc:"辖令下山，凡近山之村，岁输粮三成、役丁两番、壮者一人。吏持簿至村，不坐，不饮，立庭中宣读。读毕问曰：「交乎，抑或徙乎。」村老跪而求减，吏不答，惟翻簿示之，其名已在册。有儒生骂于市曰：「此与旧日豪强何异。」语传至山，申鹤曰：「吾未尝自称仁慈。」众问其故。曰：「慈悲二字，救不得一座将倾之山。」"
 SHP_The_Frost_Edict:"寒霜敕令刻壁"
 SHP_The_Frost_Edict_desc:"敕令刻于石壁，凡三十六条。何时动，何时止，何事可为，何事虽可为而不可为，逐条书之，不留余地。刻者问曰：「此条太密，恐后人难记。」申鹤曰：「难记则可查，可查则不敢妄。又有人问：人心亦可律乎。」申鹤曰：「人心最不可恃，今日向善，明日即可为恶。吾不恃心，恃此壁。」刻毕，以帛覆之，三日方揭。"
 SHP_The_Lone_Blade:"门楣孤剑独悬"
 SHP_The_Lone_Blade_desc:"一柄剑悬于山门之楣，以铁索系之，风过则微鸣。弟子入门，先立剑下，仰视一炷香之久，不许言语。有少年问执事曰：「此剑何人所用。」执事曰：「山主之剑，未尝出鞘。」少年曰：「既未出鞘，何以教人。」申鹤适至，闻之，曰：「一剑未出而心先定，此即所教。」又曰：「执剑者所惧者非敌，乃己手之颤。」"
 SHP_The_Silent_Monastery:"道场一年不语"
 SHP_The_Silent_Monastery_desc:"道场无经声，无辩论，惟蒲团百具，次第而列。新入者坐满一年，不与人语，日进一粥一水，由执事置其侧，食与不食不问。有长者过而叹曰：「此非修道，乃摧人心。」申鹤在侧，闻之，曰：「话多者心散。」使其先听心中那口钟，往后山外虽万声齐作，彼亦不乱。长者曰：「一年之后，其人已不能言，奈何。」申鹤曰：「不能言者，未必不能守。」"
 SHP_Tithe_of_the_Peaks:"绝云岁贡粮与铁"
 SHP_Tithe_of_the_Peaks_desc:"征调之檄下山，列粮若干石、铁若干斤、布若干匹、丁若干名，皆有定数，书于木牌，悬于村口。吏不再催，惟每旬往视牌下，视其纳否，书于册而去。有执事问曰：「仙家伸手向人，得无愧乎。」申鹤曰：「云上清净，非自天降。」欲借一山挡乱世之风，先须为山供火与粮。执事曰：「人将怨之。」申鹤曰：「怨亦须供，此非德政，乃本分。」"
 SHP_Frost_Discipline:"霜律不问苦衷"
 SHP_Frost_Discipline_desc:"霜律颁行，赏罚皆有定程。犯者笞若干，功者赏若干，不看出身，不问苦衷，不录缘由。有老校尉为其徒求情，言其失职乃因母病。申鹤当众驳之，曰：「律若为情所动，则如雪之化，自最轻之一隙始，涓涓而下，终溃整山。」老校尉伏地不起，久之曰：「吾随山主二十年，今日始知山中无旧人。」申鹤曰：「山中本无旧人，只有守律之人。」"
 SHP_The_Mountain_Pass:"云关一砖不苟"
 SHP_The_Mountain_Pass_desc:"云关当九峰之口，扼上下之路。申鹤亲督其役，日至工地，以杖叩石，声浊者弃之，声清者留之。匠人苦其严，私语曰：「此关挡风雪耳，何须如此。」申鹤闻之，曰：「平时挡风雪，乱时挡千军。」关门不牢，则山中修者、种药者、教徒弟者，皆不敢安寝。关成之日，风雪自门缝入，仅一线耳。"
 SHP_Cull_the_Weak:"汰弱令清出山"
 SHP_Cull_the_Weak_desc:"汰弱之令下，执事持册，遍阅山中。体不支者，志不坚者，累及同门者，一一书名于册，遣之出山，各给三日之粮。有少年不肯去，抱柱而泣。执事曰：「山主之令。」少年曰：「吾非弱，惟病未愈。」申鹤自内出，视其面，曰：「病者留，弱者去，此非吾意，乃山之择。」众皆默然。是年冬，山中无一人冻馁，亦无一人敢言仁慈。"
 SHP_The_Hunt_of_Demons:"循魔气夜追猎"
 SHP_The_Hunt_of_Demons_desc:"猎魔之令，为山中唯一许杀之令。山精、水怪、为深渊所蚀之兽，皆入猎单。执剑者十人为一队，循魔气而行，夜出昼伏，归则刀上凝霜，靴底带泥。一队归，献兽首一，毛色斑驳，齿间尚有草屑。众观之，不知其何以害人。申鹤曰：「待其害人而后杀，晚矣。」众问：「若不害人亦杀乎。」申鹤曰：「持剑者不替人间守夜，则所修之道，与门外念经者何异。」"
 SHP_The_Grand_Vigil:"不诵誓词至明"
 SHP_The_Grand_Vigil_desc:"誓台立于峰顶，无香无烛，亦无誓词。众立其上，自暮至明，不许动，不许语。夜半风起，衣袖皆满。有少年僵立而倒，旁人扶之，不敢出声，惟以肩承其重。天明，众始散。有问其昨夜所思者，答曰：「不记。」问其所记，则曰：「冷。」申鹤闻之，曰：「誓出于口则轻，入于骨则重。」昨夜所立者非誓，乃骨。"
 SHP_Only_the_Adepti:"仙凡划界分途"
 SHP_Only_the_Adepti_desc:"界线之议，争于堂上。有仙者言：「山下人亦曾供我香火，何忍绝之。」申鹤曰：「香火者，敬也，敬不必同居。山路我守，风雨我挡，则山上之规矩，自当由我定之。」众问：「此非霸乎。」申鹤曰：「霸者夺人之有，吾所定者，吾所守之地也，此谓名分。」言毕，命人于山门外立石，石上刻线一道，线外凡人止步，线内仙者往还。"
 SHP_The_Mortal_Prohibition:"禁凡令闭关门"
 SHP_The_Mortal_Prohibition_desc:"禁凡之令下，关外三步即为止地。有村人自百里外来，跪于关门之外，三日不起，膝下雪化为泥。守关者以令白之，不动。第三日暮，申鹤登关墙，倚垛望之，望至星出。众以为将开门。申鹤乃命取粮一车，自小门推出，而关门终不启。跪者伏地而哭，问其故。申鹤在墙上曰：「粮可救汝一时，若汝辈学得遇事便跪，则此后无人可救汝。」"
 SHP_The_Sealed_Peaks:"九峰封云雾锁"
 SHP_The_Sealed_Peaks_desc:"九峰之口，尽以巨石塞之，惟留一线。云雾自谷底起，昼夜不散，外人至山口，但见白气如墙，不辨物。有商人携货至，呼之半晌，惟闻回声。山中灯火自此不复见于山下。有执事问曰：「久闭则耳目钝，可乎。」申鹤曰：「钝者犹可医，染者不可洗。」执事曰：「若有一日不得不开。」申鹤曰：「那时自有人来凿此石，吾不忧也。」"
 SHP_Cultivation_Supremacy:"修真压百业下"
 SHP_Cultivation_Supremacy_desc:"修真之令下，山中百业皆退居其次。岐黄、丹鼎、剑阵三科并立，各置讲席。杂役亦须背丹方三段，背不出者不得入厨。有老仆执爨三十年，一夜背至四更，背毕以手按胸，曰：「吾今乃知灶下亦有道。」有仙者谏曰：「仙家当以慈悲示人。」申鹤曰：「自护且不能，何谈度人。」先使之强，而后可言慈。"
 SHP_The_Cold_Peace:"山中无争无妄"
 SHP_The_Cold_Peace_desc:"山中无争，无妄言，无越轨。晨起同钟，食同器，行同列，夜同息。一日大雪，覆阶三尺，晨钟未响，而列队者已在庭中，无人缺席，亦无人先动。申鹤巡至，见之，忽止步。执事问：「山主何思。」申鹤曰：「吾忆一句旧语，最完之序，与最深之惧，常是一张面孔。」言毕不复言，惟以手紧其披风，领口处已结霜。"
 SHP_Purge_the_Half_Bloods:"涤除令少年跪雪"
 SHP_Purge_the_Half_Bloods_desc:"涤除之令下，凡仙凡相杂者，皆须自陈其血，或证其纯，或出山门。有少年跪于雪中，自晨至暮，膝下成一凹。执事问其所求，少年曰：「吾自幼居此，不记父母。」执事曰：「然则无以自证。」少年乃仰面问申鹤曰：「吾生而如此，错在何处。」申鹤默然良久，曰：「汝无错。」错者，此世容不下一件说不清之事。"
 SHP_The_Ladder_of_Ascension:"登仙阶层层卡"
 SHP_The_Ladder_of_Ascension_desc:"阶凡九层，层设一卡，验资质、验心性、验功业。过关者书名于石，不过者亦书名于石，惟以朱笔圈之。三年之间，登至第九层者四人，至第八层而止者三十余。有落第者问曰：「此阶何以为阶。」申鹤曰：「使之见路。」问者曰：「路窄如此，见之何益。」申鹤曰：「人信有一条正道可行，则少有人再去钻那看不见之缝。」众皆不语，各自散去。"
 SHP_Ascend_the_Chosen:"拔擢入道系带"
 SHP_Ascend_the_Chosen_desc:"拔擢之日，中选者九人，立于殿中。其家人送至山门，不得入。申鹤亲为系带，带白而长，绕腰两匝，结于左。系至第九人，其人忽跪曰：「家有老母。」申鹤手上不停，曰：「入此门者，不复为谁之子，亦不复为谁之父。」其人再言，申鹤曰：「汝今为一剑，一炉丹，一块替山挡风之石。」言毕，带结已成。"
 SHP_The_Eternal_Snow:"万载雪覆山脊"
 SHP_The_Eternal_Snow_desc:"雪自九峰而下，覆至山腰，终岁不化。雪上有迹，数日不移；雪下有骨，千年不腐。有弟子问曰：「此雪何故不化。」执事曰：「山高，风冷。」弟子曰：「若有一日雪化，则山中何如。」申鹤闻之，自崖上答曰：「吾所惧者，非世之不迁，乃迁之太骤，一夜而尽洗积年之功。」言毕，以杖拨雪，露出下面一层旧雪。"
 SHP_The_Frost_Court:"玄霜廷刻律冰壁"
 SHP_The_Frost_Court_desc:"玄霜之廷立，玄衣者按品而列，凡七阶，阶各有位，位各有尺。律条刻于冰壁，字口甚深，日光照之，字影落于地。廷中禁呵气暖手，一人呵之，同列皆侧目。申鹤高居上座，听各阶奏事，自晨至午，惟闻回声清脆，如击玉。散朝后，独坐良久，谓近侍曰：「此亦人间之制，吾不过为之上霜耳。」"
 SHP_Thirty_Three_Heavens:"三十三重天阶"
 SHP_Thirty_Three_Heavens_desc:"品阶凡三十三重，各有名号，各有服色，各有居所。能全记其序者，山中不过三人。初入者居下三，终日汲水扫雪。其上渐寒，至二十重以上，四时皆冰，居者以兽皮裹身。有少年登至十一重，仰视其上，问曰：「其上尚有人乎。」执事曰：「有，然不多。」少年曰：「既无人见，何以为上。」申鹤在侧，曰：「使汝抬头时有处可看，此即其用。」"
 SHP_The_Crane_Returns:"独上旧崖看云"
 SHP_The_Crane_Returns_desc:"旧崖无路，惟石棱可踏。申鹤独上，不带一人，衣上无徽。崖顶风急，云海在脚下翻涌，一如当年彼无人过问之黄昏。有牧者自下望见，归告村人曰：「山主独坐崖上，自午至暮。」翼日执事问曰：「山主念旧乎。」申鹤曰：「非念旧。」执事问：「然则何往。」曰：「来验一事。」问何事。曰：「今之我，与昔之我，尚相似否。」"
 SHP_Blade_of_the_Peak:"峰间择剑二事"
 SHP_Blade_of_the_Peak_desc:"择剑者不问家世，惟试二事。一试其静：使立市中，人声鼎沸，观其手是否动。二试其净：使处一室，事后视其案，有无血痕、有无遗物。有少年静而净，独不能杀。申鹤曰：「可教。」有少年能杀而不净，申鹤曰：「不可用。」执事问其别。申鹤曰：「杀而不见血者，谓之杀手；杀而犹记拭案者，谓山之刃。」"
 SHP_Silence_of_the_World:"举世寂如合棺"
 SHP_Silence_of_the_World_desc:"律行至尽处，山中无声。风过檐角，亦似有人先抚之使轻。鸟不鸣，犬不吠，童子相逐，亦只以手语。申鹤独立最高处，听此彻底之静，忽觉胸中空得发慌。她忆帝君在时，人间有声：叫卖声、争价声、哭与笑，皆在市中。而今所守之山，静如一口已合之棺。是夜未归寝，坐至天明，雪落满肩而不拂。"
 SHP_The_Lone_Ascension:"孤高证自盖印"
 SHP_The_Lone_Ascension_desc:"印为玉质，方二寸，文曰孤高。申鹤自取印，自按于牒，不用吏，不用印官。按毕，举牒示众曰：「自是而后，此山不复称仙境。」众问：「然则何称。」曰：「山耳。」又问：「山何所凭。」申鹤曰：「凡人之血骨，仙者之意志，共堆而成，不容置疑。」众请其立誓，申鹤曰：「吾不求人祝，亦不求人谅，惟求一事，吾立此处，无人能使我动一步。」"
 SHP_The_Snow_That_Never_Melts:"插剑雪中千年"
 SHP_The_Snow_That_Never_Melts_desc:"峰顶积雪三尺，申鹤以剑插之，深至护手。剑柄向南，风来则鸣，声细如丝。她按剑而立，曰：「雪有时而化，人有时而散，惟立于此地之规矩，吾欲其如巅上之冰，千年不消。」左右皆俯首称是。言毕转身，衣角扫雪而去。无人看见她目中一瞬之物，极冷，极远，如望一处早已知其结局之地。"
 SHP_The_Holy_War:"圣战不问朝政"
 SHP_The_Holy_War_desc:"圣战之檄下山，不言政局，不言旗号，只列魔物之名与所在。魔气自层岩出，自深渊出，自一切为人所忘之裂隙出，沿山脚而蔓，蚀田、蚀畜、蚀人。有山下使者问曰：「山主助谁。」申鹤曰：「吾不问汝辈之政局，不问汝辈之旗，亦不问谁坐那把椅子。」使者曰：「然则山主何求。」申鹤曰：「魔物，一个不留。」"
 SHP_The_Rift_Wardens:"裂境火堆轮守"
 SHP_The_Rift_Wardens_desc:"哨岗立于裂隙之侧，凡九处，各置火一堆，昼夜不熄。守者轮换，十人一队，旬日一易，名不入册，惟记其来与去。有少年初次换防，立火侧，足下即深渊，风声如人哭。申鹤适至，指裂缝曰：「此物不因汝惧而缩，却能因汝守而暂睡。」少年曰：「睡几时。」申鹤曰：「不知。」少年曰：「若吾去而它醒，奈何。」申鹤曰：「故须有人来换。」"
 SHP_Conquer_the_Fissures:"捣魔巢绘红图"
 SHP_Conquer_the_Fissures_desc:"征讨之队凡七，各携火具、绳索、空囊，入裂隙而深。所过之处，巢穴一处处捣之，火起则退，灰落乃入。归者不带首级，只带图一幅：某处犹燃，以朱点之；某处已冷，以墨点之；某处新有魔气，则加双圈。图挂于壁，日渐密。申鹤每夕视之，良久，曰：「此战无胜，亦不可停。」"
 SHP_The_Wandering_Purge:"巡山者数月不归"
 SHP_The_Wandering_Purge_desc:"巡山者出，负剑一、干粮一囊，行无人之地，动辄数月。归则须发皆白，靴底磨穿，所报惟一句：「无事。」有文吏谏曰：「山中事少，何苦如此。」申鹤曰：「正以如此，汝辈方有闲暇在此议我。」文吏面赤而退。有老巡者归，坐阶下不肯入室，问其故，曰：「屋太暖，脚痛。」众皆默然，取雪一盆置其侧。"
 SHP_The_Red_Frost:"赤霜覆英烈碑"
 SHP_The_Red_Frost_desc:"剿之愈深，死者愈多，山中始有阵亡二字。碑立于峰侧，石初无字，凿者日凿一行，行有长短。一夕雪降，色如常，而践之则赤，人谓赤霜。申鹤立碑前，自晨至午不移步。执剑者列于雪中，皆不敢仰视。良久，申鹤曰：「吾不许汝辈为死者流泪。」众愕然。又曰：「流泪易，记名难。」记其名，重于泪。"
 SHP_Bind_the_Mountains:"阵法缩山为路"
 SHP_Bind_the_Mountains_desc:"缚山之役，起于九峰之间。修士各守一处，以石为钉，以符为绳，山与山之间遂成径。旧日三日之路，今一日可至；援兵自东峰至西峰，日中而返。有老修士叹曰：「吾修此术三十年，初以为求长生。」申鹤曰：「长生者独存也，以此为路为桥，则所存者众。」老修士俯首，曰：「如此，则吾三十年未白费。」"
 SHP_The_Sword_of_the_North:"至冬盟书焚雪"
 SHP_The_Sword_of_the_North_desc:"至冬使者至，出盟书一函，纸厚而香，条款列钱若干、铁若干、兵若干。使者曰：「君有剑，吾有钱与铁，何不合手，为天下理此乱局。」申鹤受书，读至末行，不语。使者以为许，色稍缓。申鹤乃取书就火，火在雪上，纸卷而黑，灰落于雪，雪不化。曰：「吾之剑不为人挥，惟为此山所指之处。」使者默然，收炉而去。"
 SHP_The_Mortal_Auxiliaries:"编凡人入行伍"
 SHP_The_Mortal_Auxiliaries_desc:"辅军之编，凡三百人，皆山下壮者。不授咒法，不授丹术，惟教二事：结阵，与不退。日操三次，负重登崖，崖上风急，落者三人。申鹤亲阅，循列而行，至一独臂者前止步。问曰：「何以入选。」对曰：「吾虽一手，能负两人。」申鹤顾左右曰：「汝辈非仙，亦不必为仙。」人有时比仙更硬。言毕，独臂者昂首，行列皆直。"
 SHP_The_Demon_Chronicle:"册中一笔一魔"
 SHP_The_Demon_Chronicle_desc:"魔录之册，初止十页，三年而成二百页。每页记一物：何时出，出何地，畏何咒，中何刃则倒，中何刃则愈怒。书者皆前线归人，墨未干而血已渗纸。有少年执笔问：「此等琐事，亦须录乎。」申鹤曰：「杀一魔者，勇也。」使十年后人执此册而少死十人，功也。少年乃复伏案，书至夜深，烛三易。"
 SHP_The_Thousand_Peak_March:"沿山脊行一秋"
 SHP_The_Thousand_Peak_March_desc:"大军自绝云间启行，不由大道，专循山脊。脊窄处仅容二人并行，辎重以绳系于腰，失足则连坠。日行三十里，遇风雪则止，止则掘雪为垒。有将请改道，曰：「走谷中可速十日。」申鹤曰：「谷中有伏，脊上无。」又曰：「吾辈不比谁快，只比谁稳。」至璃月港，恰一秋，旗帜裂者三，而人未散。"
 SHP_The_Burning_Snow:"烧雪原退魔潮"
 SHP_The_Burning_Snow_desc:"魔潮将起，距隘口三日。前路雪林百里，马不能行。申鹤令举火。火起于林梢，烟与雪同落，冷热并击人面。烧至夜半，雪原如昼，远处魔潮为之却。有老卒跪雪而泣，曰：「此林吾少时曾猎。」申鹤立火侧，面为烟所熏，久乃曰：「吾生平最恨污雪之人，今日亲手焚之。」言毕，以袖掩面，不复言。"
 SHP_All_Under_Heaven:"目光自山推天下"
 SHP_All_Under_Heaven_desc:"檄下，命各队不必止于山界，凡有魔气处，皆可往。有执事难之，曰：「山外之事，与我何干。」申鹤曰：「吾昔亦作此想，以为守一山足矣。」及下山，见村落被蚀，田荒人绝，乃知山下每一处人间，皆此山之延。执事曰：「延者何谓。」申鹤曰：「彼灭，则吾所守者亦无所附，山虽在，已无意义。」"
 SHP_The_Immortal_Throne:"刻律椅背不称王"
 SHP_The_Immortal_Throne_desc:"椅以黑石为之，无饰，无垫，高仅及膝。申鹤亲执凿，刻律条于椅背，凡七行。刻毕，命置于殿中，不设座签，亦不设帷。众问：「此椅谁坐。」曰：「执律者坐。」问：「执律者称王乎。」曰：「不称。」众问其故。申鹤曰：「此椅非为坐者设，乃为仰视者设。」使抬不起头之人见此，知世间尚有一物，高于其苦。"
 SHP_The_Grand_Crusade:"四方举旗来朝"
 SHP_The_Grand_Crusade_desc:"是日山门大开，四方来者塞途：修士、义军、旧日之敌，各举其旗。旗色不一，行列不齐。申鹤立于高台，俯视人海，自晨至午，不出一语。执事请其宣令。申鹤乃轻声曰：「人聚愈多，愈似潮水。」执事问：「然则山主欲何。」曰：「堤坝。」执事不解。申鹤曰：「潮来则借其势，潮退则留其泥，吾所需者非潮，乃堤。」"
 SHP_The_Half_Blood_Burden:"夜坐自问血疑"
 SHP_The_Half_Blood_Burden_desc:"夜半无人，申鹤独坐灯下，案上摊涤除名册。册中一名，年十六，仙凡各半，遣出山门，后不知所往。她以指按其名，良久不动。灯花爆一声，影摇于壁。忽自语曰：「吾判彼时，亦判己乎。」语毕，无人可答。遂取笔，欲注于册侧，笔悬不下，终乃搁笔，合册而坐，灯至晓不吹。"
 SHP_The_Chasm_Abyss:"崖边望渊命守"
 SHP_The_Chasm_Abyss_desc:"渊在层岩之下，口窄而深，投石不闻其落。申鹤遣精锐二十人下，归者十一，皆不言所见，惟目中带灰，数日不散。申鹤乃亲往，立崖边，自午至暮，俯视黑气。执事问：「可下乎。」申鹤不答。问至三，乃曰：「守着。」自是无一人再下，而渊口火堆常明，守者轮换，名不入册。"
 SHP_The_Vigil_of_Xiao:"碑前无人敢接"
 SHP_The_Vigil_of_Xiao_desc:"碑在峰阴，凡三十六座，高者及肩，矮者及膝，皆无饰。降魔大圣之旧誓犹存，接者相继，成碑者亦相继。是日有少年三人愿接，立于碑前。申鹤默立良久，曰：「吾知劝汝不住。」三人不语。又曰：「吾只问一句，汝等可想清楚，此路尽头所书者，是谁之名。」一人答曰：「愿书己名。」申鹤曰：「可。」遂以剑授之。"
 SHP_A_Blade_from_the_North:"受剑不拔悬门"
 SHP_A_Blade_from_the_North_desc:"使节再至，捧剑一柄，鞘以银饰，纹如霜纹。申鹤受之，却不拔。使者请试其锋，曰：「此剑可断铁。」申鹤曰：「剑不在锋，在授者之意。」使者请留剑。申鹤曰：「可。」乃命悬于山门之东，与旧剑相对，其间七十步。自是弟子入门，皆见双剑相望。有问其义者，申鹤曰：「一为吾所自持，一为他人所递，汝日过其下，自择。」"
 SHP_The_Iron_Snow:"铁雪冷硬无情"
 SHP_The_Iron_Snow_desc:"雪落既久，践之有声，如碎铁，人谓铁雪。此雪不粘衣，不留迹，踏过即平，面上终是一无隙之白。山中人皆收其柔软于最内之衣，示人者惟此白。申鹤行于雪上，步甚稳，一步一响。至峰半，忽止。执事问：「山主何思。」申鹤曰：「吾忽思一事。」问何事。曰：「若帝君见此山今日之状，当是颔首，抑或长叹。」"
 SHP_Reunify_Liyue:"港城旧墙一语"
 SHP_Reunify_Liyue_desc:"光复之日，港中无乐，无宴，亦无泪。绝云间之人不惯哭，皆以手按剑柄，指节颜色渐白。申鹤登港口最旧之城墙，俯瞰山河重连，自午至日昃，不移步。城下万人仰首，无人敢呼。良久，申鹤乃曰：「路已修好，雪亦当化。」众未应。又曰：「下山罢。」言毕先行，衣角掠过垛口，积雪随落。"

 SHP_civilwar_category:"绝云之律"
 SHP_civilwar_category_desc:"孤辰一脉，内战诸决尽归此律。两轴并较，量强硬与克制之取舍，每决一事，级随轴改。此脉行事不循常理，出手只为断除后患，不留余地，亦不屑与人周旋。当断则断，从无拖泥带水之弊。"
 SHP_decision_mountain_patrol:"踏雪巡山"
 SHP_decision_mountain_patrol_desc:"巡山者，以脚步量遍每一道可渗魔气之山隙。雪落，盖住痕迹，亦盖住凶险。故巡山之人，一世皆在与雪抢时。有少年问：「抢得过乎。」老巡者曰：「抢不过。然今日多走一里，山下便少一夜哭声。」奥藏山巡路分三线，一线沿溪，一线沿脊，一线绕田。"
 SHP_decision_frost_ration:"推粮下山"
 SHP_decision_frost_ration_desc:"绝云间自留余粮无多，粮车一车一车往山下推。或问：「山亦要守，何不留之。」申鹤曰：「山要人守，先须使人活。」山中所与者，皆无形之账，日后自别处收还。"
 SHP_decision_purge_list:"清厘名册"
 SHP_decision_purge_list_desc:"名册上之名，有真心犯忌者，亦有恰在那一年说错半句者。清厘名册之人，往往比被清厘者更不安，因彼等最清楚：此尺早晚亦量及自身。故清厘之时，落笔最迟者，常是执笔之人。名册藏于奥藏山石室，册以布裹，取阅须执律者在场。"
 SHP_decision_adeptus_summon:"遍帖诸山"
 SHP_decision_adeptus_summon_desc:"请帖一封一封送上各山洞府，措辞客气，底线分明：来，则同守此山；不来，则此后山门之事，与君无涉。有仙接帖而笑曰：「此帖写得像军令。」申鹤曰：「本即军令，只多一层客气。」请帖自奥藏山门发出，门以木为扉，扉上无钉。"
 SHP_decision_bind_demon:"封而不杀"
 SHP_decision_bind_demon_desc:"缚魔极耗心神：不杀，只封。盖有些物事，杀之则散，散则更烦。绝云间之封魔阵，一代不如一代，非阵坏也，能安心坐满阵中之人在少数。有弟子问：「坐不满奈何。」申鹤曰：「那便空着。宁空一座，不乱一座。」"
 SHP_decision_disciple_trial:"考功试炼"
 SHP_decision_disciple_trial_desc:"考功不问出身，只问心性。有人于末关崩溃，有人却于那道关口上，头一回认得自己。申鹤曰：「吾考者，非其胜，乃其败后尚立不立得起来。」故所取者不必皆强，而皆须有可立之骨。考功设于绝云间石台，台以石砌，高丈许，四面无遮。"
 SHP_decision_forge_frost:"守炉铸霜"
 SHP_decision_forge_frost_desc:"霜铁难得，寒炉难守。铸霜之匠，往往为绝云间最沉默之辈。彼等一世守一炉不肯熄之冷火，所铸之物，却付与人拿去暖身、拿去活命。炉冷则霜铁绝，故无人敢离炉一步。绝云间之寒，一半由此炉挡去。"
 SHP_decision_herb_garden:"开圃种药"
 SHP_decision_herb_garden_desc:"绝云间药圃，种者皆凡人所用之寻常药材。或问：「仙家何须此。」申鹤曰：「仙若一味炼丹求己身，与山上只顾自己之石头，何异。」药种入土，数年方成，然总须有人先种。"
 SHP_decision_north_deal:"收礼焚书"
 SHP_decision_north_deal_desc:"至冬使者携精美之礼入山，所谈者，乃共同秩序。申鹤收其礼，焚其盟书。申鹤曰：「礼可收，因那是一片诚意；盟不可签，因那将成吾之枷锁。礼在人手，枷在吾颈。收礼之时，吾已知其价；焚书之时，吾已定其界。」盟书焚于云关山门外，火小，烟直，灰不飞，落于雪上成一线。"
 SHP_decision_chant_rite:"夜诵律条"
 SHP_decision_chant_rite_desc:"夜深，绝云间有低低诵声，是在诵律。一条一条，自最古念至最新添。申鹤曰：「律不念则忘。忘之律，与无律同。」故每夜诵之，不辍。有新入弟子诵至半途忘句，众皆停声待之，无一人催。"
 SHP_decision_envoy_keqing:"使者赴玉衡"
 SHP_decision_envoy_keqing_desc:"使者归，只说一句：玉衡之灯，比想象中亮。申鹤默然良久，曰：「灯亮之处，影子亦最清楚。」遂命备薄礼一份，回赠刻晴，不肯使绝云间在礼数上输一后辈。"
 SHP_decision_envoy_ningguang:"使者赴群玉阁"
 SHP_decision_envoy_ningguang_desc:"群玉阁回信比使者到得还快，字里行间皆是算盘之气。申鹤看毕一笑，曰：「彼以天下一盘账，吾以天下一座一座量之。亦好：一个量钱，一个量山。」使者归，携回清单一份，精至一厘。"
 SHP_decision_envoy_ganyu:"使者赴月海亭"
 SHP_decision_envoy_ganyu_desc:"月海亭那位半仙，是绝云间唯一肯多留使者半日之人。其所问者：山上之雪今年厚不厚，仙鹤还回不回来。使者述之，申鹤听至此处，忽久不语。既而曰：「此问非问我，是问山。」"
 SHP_decision_envoy_childe:"使者赴云来海"
 SHP_decision_envoy_childe_desc:"云来海之约最直白：但肯让一条路，至冬之铁永不缺。申鹤取盟约折之，折而又折，末只留批注一行：「路可让。然让路者须是吾，不能待人来推。」遂于批注之下再添四字：「不许代推。」"
 SHP_decision_envoy_lanyan:"使者赴沉玉谷"
 SHP_decision_envoy_lanyan_desc:"沉玉谷之复，最不类官样文章：一捧带泥谷种，一句无头无尾之语，曰「山上雪化，会流到这里来」。申鹤收种，命种于药圃一角。是年，种竟活。申鹤视之曰：「此谷之人，不与官言，只与土言。」"
 SHP_decision_grand_edict:"亲写首条"
 SHP_decision_grand_edict_desc:"三年之敕令、判例、军规，汇成一部律书，为执律者最重之差。申鹤亲书首篇，只一句：「绝云之律，护生，不护人。」书毕搁笔良久，曰：「最难者，自今而后，连吾亦须服之。」律书藏于奥藏山书库，架以铁力木，编号以朱。"

 LYY_Event.5001.t:"峰头收剑问人间"
 LYY_Event.5001.d:"帝君驾崩之信传至绝云间，申鹤方在峰顶练剑。雪深没胫，剑起则雪随之，剑止则雪落，落处无痕。使者自山道上来，喘息未定，言讫，惟见其收剑入鞘，一声极轻。使者在雪中行礼，礼未毕，已闻剑入鞘之声。\n她只说一句：「凡间之伞，破了。」随之下山长辈劝曰：「此事与汝何干。」申鹤望远方璃月港，港中灯火隔雪看去，只是一片黄。答曰：「与我无关。然世间之事，何时轮到与我无关四字来定该不该管。」言至此，她略一停顿，似在寻一个不伤人说法，终未寻得。\n长辈曰：「汝既知无关，何以下山。」申鹤曰：「伞破之时，撑伞者先受淋。我在山上，不受淋，可我看得见。」言毕，取剑负于背，踏雪而下。长辈立于峰头，见其行处雪不陷，一行足迹，浅得几乎不见。山下雪浅，行至半山，始见道旁有村，村中无一家举火。峰在绝云间北，峰顶有石如台，石面为雪所覆，剑痕不存。"
 LYY_Event.5001.a:"下山立秩序，护绝云亦护人间"
 LYY_Event.5001.b:"只守绝云间，不问山外事"
 LYY_Event.5002.t:"九峰插旗刻山门"
 LYY_Event.5002.d:"绝云间之旌旗，插遍九峰。旗无字，惟一片素白，风大时猎猎，风止则垂如冻。九峰之距，远者三十里。插旗者凡九队，一队三人，皆不带兵。\n申鹤不宣示疆土，只命于山门刻一行字：「此地非人间。」石工问刻几深，曰：「刻至看得见为止。」石工刻毕，以手抚之，曰：「此字冷。」申鹤曰：「山也冷。」石工再问：「刻与谁看。」申鹤曰：「与上山之人看，亦与下山之人看。」\n有樵夫过此，问守关修士曰：「此山以后尚许人上否。」修士曰：「上。」只须守山中规矩。樵夫愣了一愣，曰：「我活四十年，头一回听人说，规矩，修来给人守者。」修士曰：「从前规矩，乃修给山里人看者。」樵夫担柴而去，行数步，回头看一眼那行字。其后三年，樵夫每过山门，必于字前歇一歇，将柴担换一换肩。山门以青石垒，门额刻字，字口浅，以指摸之可辨。"
 LYY_Event.5002.a:"以山门立规矩，来者皆守"
 LYY_Event.5002.b:"只迎同道，拒凡俗于外"
 LYY_Event.5003.t:"清修令下夜翻墙"
 LYY_Event.5003.d:"清修之令颁下，绝云间静得能听见雪落。雪落于瓦、于石、于松针，各有其声。晨钟暮鼓，一衣一食皆有定数，过者罚，欠者亦罚。令初下之日，众弟子立于庭中，无人先动，钟声一响，乃各归其舍。\n有年少弟子受不得这份静，夜半翻墙欲走。墙高丈二，雪覆其上，攀至半而滑落，再攀，再落。巡山者执灯立于墙下，看了两回，终乃出声曰：「你要往何处去。」巡山者后语人曰：「我看了两回。」第一回想按令罚他，第二回只想看他要往何处去。\n弟子伏于雪中，答不上来。巡山者不罚，亦不扶，只把灯举高些，照其面。良久，弟子自起，拍去膝上之雪，循原路翻回。翼日晨课，巡山者见他仍在列中，未提一字。惟是日之课，弟子坐得最直。是夜雪又落，墙上滑痕二道，迹至开春方消。墙石为山中青石，久冻则裂，裂处生苔，苔色黑。"
 LYY_Event.5003.a:"谕令全山，一体清修"
 LYY_Event.5003.b:"放任各洞府自守其道"
 LYY_Event.5004.t:"白发老仙半山回"
 LYY_Event.5004.d:"散居四方之仙人，一一请回绝云间。申鹤不谈情谊，不叙旧事，只于殿中摆棋盘一具、戒尺一柄。殿中无火，棋盘上落一层薄雪，以指画之，可书数字。\n一白发老仙不肯受约束，拂袖而去，行至半山，忽停步，回身问曰：「你这样做，真守得住这座山。」申鹤曰：「守不住。」老仙曰：「既知守不住，何以强为。」申鹤曰：「守不住，我也得先试着守。」守过而失，与不守而失，不是一回事。老仙闻之，以杖击石者三，曰：「你这几句话，比山下那些文书都难答。」\n老仙立于雪中，杖头点地，良久，曰：「我走。」言毕转身，却向上行，复入殿中，坐于棋盘之侧，拈一子，不落。申鹤亦不语，取戒尺置于二人之间。殿外雪落无声，惟棋子相触一声。是日子时，殿中灯忽明，一老一少对坐，棋未终局，雪已掩其半。棋盘为石制，棋子以黑白二色石磨成，黑者较重。"
 LYY_Event.5004.a:"请仙众共守此山"
 LYY_Event.5004.b:"以威令强召诸仙"
 LYY_Event.5005.t:"雪夜按册点人名"
 LYY_Event.5005.d:"清剿之夜，雪被染作暗红。血色入雪即淡，淡成一片污黄。执法者按名册行事，名册长及数尺，卷而执之。一人唱名，二人执火。唱名者声不高，每唱一名，火把便移近一步，照其面，然后移开。\n有人临刑前问曰：「我错在何处。」执事翻遍册子，翻至其人一页，只见数行小字。末乃答曰：「错在那一年，你说了一句不合时宜之话。」其人笑曰：「原来如此。我一直想不起来，倒要谢你替我记着。其言时，仰面看雪，雪落于目，不眨。」\n执事不答，合册，退一步。其人又问：「那句话，谁记之。」执事曰：「我记之。」其人视之良久，曰：「那你记得比我清楚。」言毕闭目。风起，火把斜，雪落于其肩，转瞬即化。远处钟未响，山中本无钟。册既合，执事以炭于册末添一行：「是夜凡若干名。」数目未填，留一空格。绝云间名册以厚纸为页，卷之成筒，执者以两指按，防其散。"
 LYY_Event.5005.a:"按册清剿，绝旁门左道"
 LYY_Event.5005.b:"只诛首恶，宽宥胁从"
 LYY_Event.5006.t:"里正跪雪求减赋"
 LYY_Event.5006.d:"凡俗之轭，令山下村庄代绝云间输粮输役。所输皆有定数，石、斗、丁、车，书于木牌，悬于村口，一岁一换。村中丁壮皆立牌下看数，无一人出声，有老者以指逐字点之。\n一村长跪于雪中求减摊派。申鹤过而问曰：「汝家今年收成如何。」村长曰：「勉强够食。」申鹤曰：「既够食，则交一半。」村长曰：「一半则不够。」申鹤曰：「吾说过，不救跪者；然汝替全村来跪，这一半，吾替汝减之。」申鹤视其膝，膝下雪已陷二寸，曰：「起而言。」村长不起，曰：「跪而言，村中人听得见。」\n村长叩首，雪上留一额印。申鹤视之，命人取炭来，于木牌上改其数，曰：「改毕。」村长曰：「明年若再歉收。」申鹤曰：「再来跪。」村长曰：「跪亦有济乎。」申鹤曰：「无济。然汝若不来跪，连无济亦无。」\n是夜村中举火者少，米缸皆开，各家量米，量至半夜。木牌悬于村口，牌上数目以炭书，一岁一换，旧痕犹在。"
 LYY_Event.5006.a:"向山下征调粮役"
 LYY_Event.5006.b:"以山中之物易之于市"
 LYY_Event.5007.t:"敕令写死不写情"
 LYY_Event.5007.d:"寒霜敕令，逐条写死，不讲情面。何者当罚，何者当赏，赏几何，罚几何，皆有定数，不容增减。敕令以铁笔书于木牌，凡十二牌，悬于山门内外，风雪不能蚀其字。\n有执事问曰：「万一敕令本身定错，奈何。」申鹤沉默许久，殿外风声可闻。乃答曰：「那也得先认它。」执事曰：「认错之令，岂非自伤。」申鹤曰：「一个连自己定之法都不敢认之人，凭甚么要别人认。」执事曰：「若他日改之，则今日所罚者，岂非皆冤。」申鹤曰：「冤者我偿，不入公账。」\n言至此，她忽停，转面视窗外，久不复言。执事不敢退，亦不敢再问。此为其第一次于人前露出一点犹疑之色：执笔之手在案上移了半寸，又移回原处。良久，乃曰：「记下此问。」执事曰：「记问，亦入档乎。」申鹤曰：「入。」执事退而记之，记至犹疑二字，笔停，终乃改书曰：「主人移手半寸，又移回。」木牌立于绝云间山道两侧，牌下有石座，座面结冰，冰厚寸许。"
 LYY_Event.5007.a:"颁寒霜敕令，立山法"
 LYY_Event.5007.b:"暂缓立法，因人而断"
 LYY_Event.5008.t:"门楣一剑照弟子"
 LYY_Event.5008.d:"申鹤之剑，独悬于门楣之上。剑不佩，不拭，不授人，惟悬。入门者皆从剑下行，行时多低头，非畏剑，畏其静。剑鞘无饰，木胎漆黑，鞘口以铜束之，磨处已露黄。\n一新入门弟子，于剑下立整整一夜。雪落其肩，积至半寸，他不拂。晨课时众人出，见他仍在，眼中有血丝。执事问曰：「汝在此立一夜，做甚么。」弟子曰：「看剑。」执事不催，退立廊下，看雪一层一层落其肩，如与之俱静。\n执事曰：「看一夜，看出甚么。」弟子曰：「剑那样静，我却站得浑身发抖。」执事曰：「发抖者何。」弟子曰：「吾初以为畏剑。后乃知，吾所修者，从来只此一心。」执事视其久，曰：「进去罢，饭尚热。」\n弟子入，行至门槛，腿一软，跪下去。饭毕，弟子复出，至剑下又立一炷香，乃去，行时未再抬头。绝云间山门之剑鞘为素木，无纹，鞘口磨得发亮，乃历年所触。"
 LYY_Event.5008.a:"悬剑门楣，以静制动"
 LYY_Event.5008.b:"聚众演武，扬威于外"
 LYY_Event.5009.t:"道场一年不开言"
 LYY_Event.5009.d:"道场无经可讲，惟有一坐。新弟子入者，先坐一年，不许与人语。\n一年既满，第一人开口，曰：「吾从前只想赢过他人。坐一年方知，吾所最欲胜者，非他人，乃胸中那坐不住者。」\n申鹤立于廊下闻之，未出一语，转身而去。廊外落雪，行至山门，停一停，回望道场。场中无人动，惟香炉一缕烟直上，至檐而散。\n守门弟子问：「此一期如何。」申鹤曰：「有一个可者。」问是哪一个。不答，惟抖袖上之雪。\n那弟子出关之后，每日仍于原处坐两个时辰。或问坐何。曰：「坐那坐不住者。」此语传遍门中，新入者先听此一句，方许入坐。\n其后为道场执事，所管者新弟子之坐。立一规：满一年者，先问一句，愿留否。愿留者留，不愿者去。去者不少，留者亦未尝少。\n有老执事问其故。曰：「坐着不走者，未必肯守；肯说一句不愿者，反倒守得住。」老执事默然，此后不复问。\n那年冬尽，其于廊下等到最后一个愿留者说完，方起身。起身时腿已麻，扶柱立良久，乃行。道场在绝云间山坳，屋三间，无窗，惟门透光，光落于地一线。"
 LYY_Event.5009.a:"设寂静道场，炼心"
 LYY_Event.5009.b:"广开讲席，聚众论道"
 LYY_Event.5010.t:"草鞋磨穿犹收粮"
 LYY_Event.5010.d:"绝云征调，乃仙家第一次伸手向山下。粮、铁、布、丁，项项摊派明白，木牌列于山门，字大如掌。牌上数目皆按户等：上户几石，中户几斗，下户几升，丁则另计。\n有山民怨曰：「神仙亦须食米。」收粮修士答曰：「神仙不食，然为神仙御风者食。」山民尚欲有言，低头忽见修士草鞋已穿，脚趾冻紫，遂咽其语。修士草鞋后跟已断，以麻绳系之，行于雪上，一步一陷。\n修士亦俯视己足，曰：「此鞋，山下人所与。」山民曰：「既与汝鞋，复索汝粮。」修士曰：「鞋以与汝，粮以守山，二者非一事。」言毕，山民倾米半囊，修士以手止之，曰：「照牌上数目，一粒不多，一粒不少。」\n山民既去，修士蹲于雪中，以手拾散米，一粒一粒，拾毕，十指不能屈。云关外山民输粮入山，肩负袋，行雪道，一步一顿，袋上结霜。"
 LYY_Event.5010.a:"绝云征调，量入为出"
 LYY_Event.5010.b:"免其征派，自减用度"
 LYY_Event.5011.t:"霜律驳情对坐饮"
 LYY_Event.5011.d:"霜律之下，赏罚分明到近乎无情。有老部下为少年求情，众目之下，申鹤驳之，一字不改。求情者所犯，是私放一名应罚之少年出山；老部下言之三次，申鹤驳之三次。\n事后，老部下独饮于偏室，酒浊，盏粗。申鹤推门入，坐其对面，取盏自斟一杯，两人一言不发，饮至半夜。灯芯已短，无人剪，光渐小。酒至半酣，老部下欲言，申鹤举盏止之，曰：「今夜不谈公事。」两人遂止，惟闻风雪扑窗。\n临走，申鹤曰：「今日驳汝之情，是怕汝之情开此一道口子。」老部下曰：「吾知。」申鹤曰：「既知，何以还来求。」老部下曰：「求亦无用，然不求，心里过不去。」申鹤立于门口，半身在外，半身在内，曰：「那就过不去罢。」\n门闭，履声渐远。老部下独坐良久，取盏欲再饮，盏已空，乃以指抹案上酒痕，抹成一圈。绝云间之酒为山中自酿，色浊，味烈，饮者多以雪下之。"
 LYY_Event.5011.a:"霜律之下，赏罚不问情"
 LYY_Event.5011.b:"量情宽宥，以德服人"
 LYY_Event.5012.t:"云关一石亲自督"
 LYY_Event.5012.d:"云关扼绝云间出入之咽喉，一砖一石，申鹤皆亲自督之。石必取山中青石，不取河边卵石，曰：「卵石圆，圆则滑。」督工之日，申鹤立于脚手架上视砌，看至第三层，命拆去重砌，曰：「缝不直。」\n工匠私议曰：「此关修得太牢，似欲封整座山。」申鹤适至，闻之，不怒，只问曰：「牢则不好么。」工匠不敢答。申鹤曰：「修得牢，恐有一日，吾欲护者尚在外头，而我出不去。」工匠曰：「既为守山，何须留门。」申鹤曰：「无门之关，坟也，非关也。」\n众匠默然，锤声复起。关成之日，门厚八寸，闩重四十斤，须二人共举。申鹤亲试其门，一开一合，声沉而不散。试毕，命人于门内侧刻一行小字，刻者问刻何字，曰：「开时先看外头。」后有人问：「那行字与谁看。」守关者曰：「与开门之人看。」问者曰：「若开门者不识字。」守关者曰：「故刻得浅，摸得出。」关在绝云间南口，两崖夹峙，风自口入，终年不止。"
 LYY_Event.5012.a:"亲督云关，固守要害"
 LYY_Event.5012.b:"只设哨卡，不筑坚关"
 LYY_Event.5013.t:"老卒负药出山门"
 LYY_Event.5013.d:"汰弱令既下，山门之内，名在册而未及格者尽数清出。令下之日，无人哭，亦无人诉。被清者自廊下排至阶前，长可百步，各持一囊，囊中余粮不过数日。有少年行至中途忽止步，回望山门，为同列者推之乃行。\n其末一人，瘸足老兵也，行最缓。申鹤亲送至关外，取药一包授之，曰：「此药日进一剂，可止痛。」老兵受药不谢，忽仰面曰：「夫人，吾不恨汝。吾只欲问一句，如吾之辈，自上山之日，便不当来乎。」\n申鹤不答。风自谷口来，吹其衣带。老兵候良久，见无答，乃负囊徐行，行数十步，回顾一次，遂不复顾。关吏请闭门，申鹤曰：「再待一刻。」门于是不闭，至日昃方合。老者行至谷口，于石上坐，取药一包，捧而不启，坐至月出乃去。是夜值门者言，关门合时，内外皆无声。老卒自云关下山，行至半途坐于石上，以手搓膝，久乃再行。"
 LYY_Event.5013.a:"行汰弱令，精简山门"
 LYY_Event.5013.b:"广纳弟子，多多益善"
 LYY_Event.5014.t:"幼魔骸骨陈阶下"
 LYY_Event.5014.d:"绝云间所许之杀，惟猎魔一事。山精、水怪、为魔气所侵之兽，皆入猎物之册。册上朱笔勾去一名，则山中少一物。猎者三人成队，出则旬日，归则献首于阶下，以验真伪。\n一日一队归，所献非首级，乃一幼魔全骸，骨细如小儿之指。以布裹之，布上血已黑。领队者捧骸跪阶下，曰：「此物临死，浑身皆颤，颤至气绝乃止。」阶下众人闻之，皆不语。有执律者欲验其齿，手伸至半，忽止。\n申鹤下阶，视其骸良久，以指拨其颌骨，骨已冷透。乃曰：「记之。」执笔吏问：「记其形乎。」申鹤曰：「并其颤状记之。」吏愕然，笔悬不落。申鹤曰：「吾辈杀之，不可忘所杀者何物。若有一日，见其颤而不动于心，则吾辈所存者，惟杀而已。」吏乃落笔。是夜册成，其行末有一小注，字极细，曰：「颤者，非惧死，似惧生。」猎册以皮为面，页以绳系，勾名用朱，朱色极重。"
 LYY_Event.5014.a:"循魔气而猎，斩草除根"
 LYY_Event.5014.b:"只驱不杀，防护生灵"
 LYY_Event.5015.t:"高台立誓至天明"
 LYY_Event.5015.d:"大道之誓立于高台，不设香，不诵词，众但立至天明。初立时百余人，三更后风起，雪粒打面，有扶肩者，有相倚者，无一人言退。\n天光破晓，执事循行点视，见最边一瘦小弟子僵立如木，目已阖，气息微而不绝，竟始终未倒。问其名，则山门外新入之孤儿也，年十四。\n申鹤闻之，自台上下来，亲抱之以下，动作甚轻，如捧一器。既置诸榻，语左右曰：「记其名。」左右问：「此子剑术末等，何以记之。」申鹤曰：「非以其强，以其似绝云间。」言毕，取巾拭其面上雪，拭至眉心，手停一瞬。弟子既醒，问左右曰：「吾立几时。」左右曰：「一夜。」弟子曰：「吾以为一刻。」是日点视毕，凡立至天明者七十三人，执事请以名次先后榜于门。申鹤曰：「不榜。」执事问故。申鹤曰：「站过一夜者，自知其能立。」台在峰侧，石砌，四无遮拦，雪落其上，厚可没踝。"
 LYY_Event.5015.a:"立大道之誓，凝心"
 LYY_Event.5015.b:"各修各道，不必相强"
 LYY_Event.5016.t:"茶棚老妪收幌去"
 LYY_Event.5016.d:"唯仙独尊之令既行，仙凡之间那道模糊之界，遂彻底划清。关内关外，一墙之隔，判若两世。\n山门外有老妇，设茶摊者三十年。某日执律者至，告之曰：「自今而后，凡人不得入关。」老妇不语，俯身收其碗盏，一枚一枚擦净，重叠于担。既毕，挑担欲行，忽回首望山门一眼。\n申鹤时在城上，两人对望一瞬。老妇不拜，亦不呼，惟以袖拭额上汗。申鹤亦不言。一瞬既过，申鹤转身，步伐较常为疾，从者追之不及。执律者问：「夫人识此人乎。」申鹤曰：「不识。」行数步，又曰：「其茶甚苦。」执律者曰：「既苦，何以年年吃。」申鹤不答。是夜城门下有一担，担上碗三只，皆净，摆在石上，无人取。次日担不见，石上碗底之印犹存，雨后犹见。执律者欲洗之，申鹤曰：「勿洗。」茶摊在云关外道旁，石为灶，壶为粗陶，碗底有印。"
 LYY_Event.5016.a:"唯仙独尊，划清仙凡"
 LYY_Event.5016.b:"仙凡并处，各安其位"
 LYY_Event.5017.t:"关外长跪三日雪"
 LYY_Event.5017.d:"禁凡令颁下，凡人不得擅入半步。关外设桩为界，桩上悬牌，书曰止。\n有人自界外跪，凡三日。初跪时有人聚观，次日观者渐散，第三日惟余一人一影。风雨至，不避；日炙，不移。关吏三报，申鹤皆不答。\n至第三日黄昏，申鹤命送粮一车至界外，而关门终不开。执事往，归而复命曰：「其人不肯受。」申鹤问：「尚跪乎。」执事曰：「不，已去矣，携粮而去。」申鹤默然有顷，乃点首曰：「可。」能携粮而去者，必不至一世跪着。执事问：「既不受粮，何以携之。」申鹤曰：「不受，是留其面；携之，是留其命。」执事曰：「既知其可，何不使其入。」申鹤曰：「令未可改。」执事退。是夜关门照旧，界桩上牌为风翻覆，声如叩。守者见牌下立一人影，近之，非人也。禁凡令界桩在云关外，以木为之，入地三尺，桩上悬牌。"
 LYY_Event.5017.a:"禁凡人擅入山门"
 LYY_Event.5017.b:"设驿待客，示以宽仁"
 LYY_Event.5018.t:"九峰锁云自成国"
 LYY_Event.5018.d:"九峰既锁，绝云间自成一国。外人所见，惟缭绕之云雾；云外之人，望之如望海。\n封山那夜，一老修士独坐山门，对空山路而视。有巡者问：「翁看何物。」老修士曰：「吾看此路。」从前一日往来者数十，担者、负者、求药者、告状者，皆由此过。今其空矣。巡者曰：「空则清静。」老修士摇头曰：「清静者，吾求之四十年，及得之，乃知不惯。」\n言未毕，山风自下而上，卷落叶过阶。老修士以杖拨之，拨至第三次，忽曰：「守一条无人走之路，比守一条热闹之路，更寂寞。」言讫闭目，不复语。巡者立侍至晓，见其肩上积霜一层，欲为拂之，手甫近，老修士忽曰：「勿拂。此霜亦是来客。」巡者问：「翁不归乎。」老修士曰：「归。待有人自路上来，吾便归。」九峰之名刻于山门侧石，字大小不一，乃历年所补。"
 LYY_Event.5018.a:"封山自守，绝尘于世"
 LYY_Event.5018.b:"开关通商，以物养山"
 LYY_Event.5019.t:"烧火老仆背丹方"
 LYY_Event.5019.d:"修真之上，百业皆下。绝云间倾力于岐黄丹鼎，凡在山者，不问老少，皆须诵丹方。\n有老仆司炉火者三十年，目不识丁，背方三日，不能成句。执事责之，老仆跪于炉前，以手掩面，泪落于灰，灰上点点成斑。一少年修士过而见之，不忍，夜取纸笔，以小字书其方，塞于老仆袖中。\n越日背诵，老仆竟通。执事疑之，搜其身，得小抄，执以白申鹤。申鹤取纸视之，字细如蚁，行末尚有圈点。视毕不言，折纸还之，转身即行。行至阶半，少年伏地待罪，不敢仰视。执事追问世将何以处之，申鹤不应。既下数级，嘴角似动。是日炉火至夜不熄，老仆守炉，以手抚那张小抄，抚至纸软。少年退至门外，忽闻身后有语曰：「明日再背。」回视，阶上无人，惟炉火照壁。炉在山洞中，洞口以石垒，烟自石隙出，日久石色转黑。"
 LYY_Event.5019.a:"修真至上，倾力传道"
 LYY_Event.5019.b:"百业并重，不独尊道"
 LYY_Event.5020.t:"空谷寂寂无人声"
 LYY_Event.5020.d:"寒寂之治既行，山中无争斗，无妄言，无越轨。行者让路，言者低声，夜不闻犬，昼不闻呼。执律者巡山一周，册上无一事可记。\n申鹤巡视至一处空谷，忽止步。谷中无风，雪平如纸，不闻一物之声。乃问左右曰：「汝听，此处是否太静。」执事侧耳有顷，对曰：「回夫人，向来如此。」\n申鹤不语，望谷良久。雪光映面，眉目皆白。执事不敢催，退三步侍立。忽有一鸟自谷外掠入，振翅一声，旋即去，声在山壁间回者三。申鹤闻之，肩上微动，如释一负。乃曰：「留此谷，勿使人居。」执事问故。申鹤曰：「留一处有声之地。」言毕策杖先行，杖端凿雪，一路皆响。执事随行，闻杖声与往日不同，不敢言。执事请书之于册，申鹤曰：「不书。」执事问故。申鹤曰：「书则成令。」绝云间谷中雪深，行者踏之，声闷，回音不出十步。"
 LYY_Event.5020.a:"寒寂之治，务求其静"
 LYY_Event.5020.b:"留三分生气，勿使太冷"
 LYY_Event.5021.t:"雪地少年问何罪"
 LYY_Event.5021.d:"涤除令下，凡仙凡血脉相杂者，须自证纯粹，不能自证者，清出山门。令文四行，押以玄霜之印。\n一少年跪于雪地，衣薄，膝下雪已陷二寸。见申鹤至，叩首曰：「夫人，吾生而如此，错在何处。」申鹤止步，视其久，曰：「汝无错。」少年仰面。申鹤曰：「错者，是此世容不下一件说不清之事。」\n言毕转身。少年在后呼曰：「夫人既知此世有错，何以不改。」申鹤不回头，行数步，风起，袖翻。执律者欲驱少年，申鹤举手止之。至门，语执事曰：「与其一囊，囊中厚衣一件。」执事问：「此亦令所不许乎。」申鹤曰：「令不及此。」少年受囊，不谢，抱囊立于雪中，至执律者再催，乃行。是夜雪大作，门外足迹至晓乃隐。执事晨起视之，雪上新覆一层，唯膝痕二处，深犹未平。涤除令以四行书于白绢，绢悬绝云间山门，风起则卷。"
 LYY_Event.5021.a:"涤除半仙，务求纯粹"
 LYY_Event.5021.b:"废涤除令，一体相容"
 LYY_Event.5022.t:"七阶坐泣一壶酒"
 LYY_Event.5022.d:"登仙之阶凡三十三级，层层设卡。守卡者执册，过者记名，退者亦记名。能走至顶者，一岁不过三数人。\n有人行至第七阶，股栗不能进，遂坐于阶，抱膝而哭。哭声不高，断续如咳。上下无人停步，各趋其程。\n守阶老修士提壶至，坐其旁，斟一碗授之，曰：「勿哭。」饮此。少年受碗，手抖，酒溢于阶。老修士曰：「上不去者，吾见一世矣。汝知其后何如。」少年摇头。老修士曰：「多下山去，娶妻，生子，开一小铺，活至白头。」少年曰：「然则此生休矣。」\n老修士笑曰：「大道走不得，小路亦是路。」路者，人走而成，非人所选也。少年饮尽，以袖拭面，下阶而去，行数级，回身一揖。老修士举壶还之，曰：「壶赠汝。他日有坐此阶者，代吾斟一碗。」登仙之阶在绝云间，为青石，凡三十三级，级高尺许，雪后须凿冰方可行。"
 LYY_Event.5022.a:"设登仙之阶，明其路"
 LYY_Event.5022.b:"不设阶次，任其自修"
 LYY_Event.5023.t:"亲手系袍一条带"
 LYY_Event.5023.d:"拔擢入道，乃被选者此生唯一之青云。名出于册，袍加于身，自此不预凡籍。\n授袍之日，申鹤亲为之系带。受者跪，俯首至地。一人系毕，忽叩首曰：「愿以命相报。」申鹤手未离带，闻言乃止，徐曰：「吾不要汝之命。」\n其人愕然仰视。申鹤曰：「汝之命，是山上借与汝者。他日山不用汝，汝须好端端还之。」其人曰：「若山终不用。」申鹤曰：「则还于山下之人。」其人怔怔，复叩首。申鹤既去，其人犹跪，以手抚腰间带结，结甚紧，久不解。旁有旧弟子见之，语其徒曰：「此结，吾辈系之十年，未曾解开。」徒问：「何以不解。」旧弟子曰：「解之，便算己有。」前受袍者守山三十年，带结终未解。临终语其徒曰：「此结非系吾身，系吾一诺。」徒视之，结上已生毛。授袍之礼在绝云间殿中，袍为玄色，带以麻，结法为山中旧式。"
 LYY_Event.5023.a:"拔擢入道，为国储才"
 LYY_Event.5023.b:"谨守山门，不纳外徒"
 LYY_Event.5024.t:"掌中片雪久不化"
 LYY_Event.5024.d:"万载之雪覆每一寸山脊，雪落无声，亦从不化去。行者踏之，声闷如击絮。申鹤独立雪原之中，四望皆白，天与地无界。忽伸手，接一片雪于掌。雪落掌心，久之，竟亦不化。\n她视那一点白，久不移目。风过，衣带飘举，雪原上无他可倚之物。乃低声曰：「连雪亦学会不动矣。其声甚轻，出口即为风所夺。」少顷又曰：「吾守此山，抑或并吾自身，亦封入此山。」\n言毕，合掌。掌中之雪终成一滴水，自指缝坠下，落于雪面，瞬息不见。她视掌良久，乃还袖中，转身向山下行。雪上足迹一行，直如绳。行至半途，忽止，回望来处，雪已平，足迹尽掩。既归，入室，取铜盆盛雪，置于案。雪在盆中，至晓未化。侍者晨起见之，欲倾，见其目在盆上，乃止。绝云间殿中铜盆，径尺许，雪在其中，形如初落。"
 LYY_Event.5024.a:"万载之雪，坚其守"
 LYY_Event.5024.b:"扫雪开路，以通四时"
 LYY_Event.5025.t:"玄衣按品立冰阶"
 LYY_Event.5025.d:"玄霜之廷既成，修士着玄衣，按品阶而立于阶下。律条刻于冰壁，字口泛白，日光照之，如列霜刃。第一次开廷，殿中寒气透骨，人语一出，回声清脆，层层相撞。执事唱名，声至梁而返，众皆屏息。\n申鹤高居上座，俯视满殿玄衣，行列齐整，无一人动。忽忆多年前初上山时，师父尝语之曰：「最似仙境之处，往往最不似人间。」当时不解，今乃觉其言如针。\n她不动声色，以指叩座侧冰栏，一叩，再叩。殿中众人闻声，皆以为令，齐齐俯首。申鹤视之，乃止手，曰：「无事。」众复立。是日议事三件，皆决于片刻之间。散廷时，有一老修士独留，以袖拭壁上霜，拭出一小片，露出底色，如人间墙上旧漆。老修士拭毕，以指摩其底色，摩之再三，乃退。冰壁在绝云间山殿之侧，凿字其上，日光照之，字口泛白。"
 LYY_Event.5025.a:"立玄霜之廷，正名分"
 LYY_Event.5025.b:"维持旧制，不设虚廷"
 LYY_Event.5026.t:"阶前少年问冷暖"
 LYY_Event.5026.d:"三十三重天既立，人遂分三十三层高低。居上者一呼，下三层皆应；居下者仰面，惟见上层之影。有少年自最下层攀至中层，手足皆裂，竟得入见。见申鹤，问曰：「夫人，攀至顶层，是否即不冷矣。」\n申鹤视其手，十指冻紫，指甲翻起。乃曰：「愈上愈冷。」少年愕然。申鹤曰：「汝今觉暖，因汝尚在攀时，血行未止。他日不攀，坐于一处，那时方真觉冷。」少年曰：「然则攀之何为。」申鹤曰：「攀者，可择一处坐下。不攀者，无处可坐。」\n少年默然，退三步，复跪曰：「求夫人指一处。」申鹤举手，指殿外一处无人之阶，曰：「彼处。」少年视之，阶上积雪，与别处无异。乃再拜而去。是夜执事报：「中层有一少年，扫阶至三更。」少年扫至冬，阶石皆净。次年春，申鹤过之，见阶上有一小石，摆得极正。三十三层之阶自绝云间山脚至殿，每层有石刻名，名多磨灭。"
 LYY_Event.5026.a:"定三十三重天品级"
 LYY_Event.5026.b:"不分高下，一视同仁"
 LYY_Event.5027.t:"独上崖顶看云海"
 LYY_Event.5027.d:"崖顶风急，云海翻涌，如万马自下而上。此处乃申鹤少时习剑之地。归鹤之日，她独上崖顶，护法远远立，不敢近。申鹤立崖边，衣为其所吹，向背不定。云自足下过，时开时合，偶见山下人家数点如豆。\n良久，忽自言曰：「吾少时在此练剑，每一收势，辄望云外，以为云外必有可观。」那时常想，有一日当立至众人皆见之处。今既立矣，乃觉此处最好。\n言毕，俯身拾一石，石上有旧痕，似剑锋所划。以指抚之，抚至痕尽，乃掷石于云海。石落无声。转身下山，护法迎之，见其步较来时轻，面色亦不如往日之白。护法不敢问，惟随行。至半山，申鹤忽曰：「他日吾死，葬于此崖。」护法应诺，不敢再言。护法后语人曰：「此日夫人下山，未扶一木。」崖在绝云间西，崖顶一石，石上有剑痕数道，深寸许。"
 LYY_Event.5027.a:"归鹤崖顶，静思己身"
 LYY_Event.5027.b:"不回望，只向前"
 LYY_Event.5028.t:"择人只看两般事"
 LYY_Event.5028.d:"绝云间最锋利之语，惟峰间之刃四字。择人之权在申鹤，其所看者二事：出剑前之静，收剑后之扫。一少年落选，不服，趋前问曰：「吾出剑之速，一队无过吾者，何以见弃。」申鹤曰：「汝出剑诚快。」少年曰：「然则差在何处。」申鹤曰：「在收剑。汝收剑时，杀气满身不散，剑入鞘而人未归。」\n少年怔然。申鹤曰：「杀得人，本事也。」收得住杀气，方为绝云间所需者。吾辈所养者，非刀也，持刀者耳。少年默立有顷，忽退一步，端然拜两拜，不发一言而去。\n旁有执事问：「此子可教乎。」申鹤曰：「可。」执事曰：「既以为可，何不留之。」申鹤曰：「今日留之，其必以为杀气可恕。」使之去三年，自省而还，则吾得一人；不还，则吾免一患。执事乃记其名于别册，册面题曰待归。三年后册上此名，以朱笔勾去。待归之册以青布为函，函上无名，惟以朱点记之。"
 LYY_Event.5028.a:"择峰间之刃，授绝杀"
 LYY_Event.5028.b:"广传剑术，壮我声势"
 LYY_Event.5029.t:"山巅独语对无人"
 LYY_Event.5029.d:"律法推行至极，山中无争，无哗，无疾行。风过檐角，其声较他处为轻，如恐惊动何人。申鹤独登最高处，四望寂然。无鸟，无烟，无钟声。日已斜，影长而直。乃对空山曰：「帝君，吾以此山，守成一口井矣。」\n言至此，止。风吹其鬓，乃续曰：「井中无风浪，亦无活水。然井中干净。」言毕自问：「此语向谁言。」山中无应者。\n她立至日入，天边余一线赤，映雪如血。忽闻极远处有一声，似钟非钟，似石坠。侧耳听之，再无声。乃笑曰：「吾亦闻幻矣。」遂下，行至半途，忽命从者：明日取一钟，悬于此处。从者问：「悬钟何用。」申鹤曰：「无人撞，风撞亦可。」从者问：「若终无人来撞。」申鹤曰：「则悬着。」是夜风大，钟自鸣一声，山中人皆闻，无一人出视。殿角之钟悬于绝云间，钟身有铭，铭已磨去大半，末一字为霜。"
 LYY_Event.5029.a:"举世皆寂，守此一山"
 LYY_Event.5029.b:"重开山门，听人间声"
 LYY_Event.5030.t:"亲落一印不回头"
 LYY_Event.5030.d:"盖印在夜。烛止三支，印置于案，朱色已调。老执事捧印，手微颤，曰：「夫人，此一步出，便回不得头矣。」申鹤曰：「吾未尝思回头。」\n老执事欲再言，唇动而止，终以印授之。申鹤按印于纸，力沉，纸背皆透。印既落，堂中静极，惟闻烛花爆一声。老执事收印，以巾拭其面，拭至朱尽，犹拭之。退至门，忽回身曰：「夫人可悔乎。」申鹤已转身向内，曰：「悔者，须有退路。」\n自是一日，绝云间不复自称仙境，只称一座山，一座不容置疑之山。后人名此印曰孤高之证。老执事晚年著述，尝记此夜，曰：「是日夫人之背，直如削成，为吾在绝云间所见最直、亦最孤者。」书成，未敢示人，藏于箧底，箧上题四字曰不必示人。至其殁，家人启箧，方见之。印为玄霜之印，钮作鹤形，印文为朱，朱色极艳。"
 LYY_Event.5030.a:"盖孤高之证，定此路"
 LYY_Event.5030.b:"留一分退路，以备转圜"
 LYY_Event.5031.t:"插剑峰头立一誓"
 LYY_Event.5031.d:"申鹤为此道取末一名字，曰不化之雪。名既立，道亦尽。立名之日，她登峰顶，拔出随身之剑，双手握柄，直插雪中，深至剑格。剑入雪无声，惟见雪面起一圈细纹。乃曰：「吾要此规，如山巅之雪，一千年亦不化。」\n语毕下山，不留一卒守之。从者问：「剑在此，无人守，恐为风雪所埋。」申鹤曰：「埋者，正吾所要。」\n多年以后，有寻访者登山，攀至峰顶，见剑痕犹在，雪色如新，四周无碑无铭。访客立痕前甚久，伸手探雪，雪冷而不化。乃自语曰：「雪固未化，然此又证明何事。」山中无应。下山途中，遇一老樵，问之，老樵曰：「山上事，吾不知。吾只知此雪，吾父在时即如此。」访客遂不复问，取笔记之，归而焚其稿。归途遇雪，访客以袖掩面疾行，不复回望。剑插绝云间峰顶雪中尺余，剑柄朝北，远望如无。"
 LYY_Event.5031.a:"立誓于峰，雪不化则道不改"
 LYY_Event.5031.b:"收回誓言，另择去从"
 LYY_Event.5032.t:"剑光映得满山白"
 LYY_Event.5032.d:"魔气自层岩、自深渊、自久被遗忘之裂隙渗出。夜行之人往往见之而不觉，觉者亦不敢言。列队之日，修士千余，玄衣成行，自山门排至谷底。申鹤立于阵前，不登台，不执旗，惟按剑而言，语众曰：「吾可以不问汝辈谁坐那把椅子，可以不管汝辈挂谁之旗。惟魔物，一个亦不可留。」\n众皆静。有顷，前排一人问曰：「此立场乎。」申鹤曰：「非立场，乃底线。」立场可换，底线不可退。此役也，绝云间始举目于山外之暗，山中人谓之清魔圣战。\n言毕拔剑。剑光出鞘，映雪，满山皆白。众亦拔剑，千余道白光齐出，谷中鸟兽皆惊，飞走之声蔽天。是日行军四十里，未至而魔已退。执事问故。申鹤曰：「非退，是聚。」遂令止军，掘壕，以待明晨。是夜掘壕至半，壕成，深四尺。众卧壕中，无人解甲。掘壕之地在层岩外岭，土薄，下皆碎石，掘者手皆破。"
 LYY_Event.5032.a:"举清魔圣战，出山讨魔"
 LYY_Event.5032.b:"固守绝云，不问外魔"
 LYY_Event.5033.t:"裂隙边上立火堆"
 LYY_Event.5033.d:"哨不过三人，火不过一堆，守夜者代代轮换，无人见过尽头。所守者，皆游魂般之地，山中人谓之裂境守望。申鹤亲至最险之裂隙。此缝自山腹裂下，深不可测，夜有白气上腾，近之则寒。来换防者乃一少年，执火把，手抖，火光摇曳。申鹤指缝曰：「汝看此缝。其不会因汝惧之而小一分。」少年曰：「然则守之何益。」申鹤曰：「其会因汝守之，暂睡一刻。」\n少年默然，又问：「须守几时。」申鹤曰：「不知。守至有人代汝。」少年曰：「若终无人来。」申鹤曰：「则有汝。」\n言讫，取火把自手中接之，插于岩隙，退后三步，视火苗向背。火忽直，不复摇。乃曰：「可矣。此缝认火。」少年问：「认火，抑或认人。」申鹤曰：「认守。」遂下崖，衣角为风所卷，行数步，火在其后，长明。层岩裂隙外火堆以石围，石上积灰，灰厚寸许，风过则扬。"
 LYY_Event.5033.a:"设裂境守望，代代相传"
 LYY_Event.5033.b:"封塞裂隙，任其自熄"
 LYY_Event.5034.t:"半队归来献一图"
 LYY_Event.5034.d:"修士入幽暗，捣其巢，焚其积，不守而攻。此绝云间少有之主动出击，谓之征讨裂隙。一队出三十七人，归者十九。归时天未明，人自雾中来，行列不整，扶者、负者、跛者相杂。领队最后至，左手已废，右手却紧攥一物，乃地图一幅。\n申鹤下阶接之，展图于灯下。图上朱点密如蚁聚，间有墨圈数处。乃问：「还燃者几处。」领队曰：「三处。」申鹤曰：「伤亡如何。」领队不答。申鹤亦不再问，卷图，曰：「既知三处，则再去三次。」\n领队抬头，唇裂，血已干，曰：「三次之后，若尚有。」申鹤曰：「则再去。」言毕，解己之披风覆其肩，曰：「先去睡。」领队跪受，伏地不起。是夜申鹤独坐灯下，取图重描一遍，凡朱点尽改为黑，描至天明，墨尽三锭。图既描毕，悬之于壁，凡入室者皆见。图既描毕，悬之于壁，入室者必先看其朱点。"
 LYY_Event.5034.a:"深入裂隙，捣其巢穴"
 LYY_Event.5034.b:"虚张声势，以逼其退"
 LYY_Event.5035.t:"劝者次日自请行"
 LYY_Event.5035.d:"巡狩是绝云间最孤之功业。巡山者常年不归，一去数月，归时须眉皆白，人几不识。有人劝申鹤：山中既定，何须如此严苛，缓一分亦无损。申鹤方批文，闻言搁笔，曰：「正因吾严苛，方轮到汝在此劝吾。」\n劝者不解。申鹤曰：「那些真行于雪中者，连劝吾之力亦无。其归时只余一气，进门先问界桩可倒，不问饭食。」劝者默然，面赤，退。\n次日点卯，劝者自列于巡山之伍，执事讶而问之。劝者曰：「昨夜思之，吾劝人之言，说得太易。」执事白于申鹤，申鹤不抬头，惟曰：「编入第三队，路最远者。」执事应诺，退至门，闻申鹤在后曰：「给其一双厚靴，旧者亦可。」第三队者，路最远，往返三月。劝者行时，申鹤未送，惟令人置酒一壶于其囊。是日雪止，天青如洗。巡山之路多在峰脊，脊窄，两侧皆崖，雪覆则不见路。"
 LYY_Event.5035.a:"行巡狩之法，长守险地"
 LYY_Event.5035.b:"轮戍边区，以省耗损"
 LYY_Event.5036.t:"英烈碑前记名字"
 LYY_Event.5036.d:"赤霜者，为血所浸之雪。清剿愈深，代价愈重，绝云间自此始有阵亡二字。英烈碑立于山口，石未磨光，名字先满。碑前无香，无供，惟列剑数柄，剑尖入土。申鹤立碑前，语执剑者曰：「吾不许汝辈为死者流泪。」众皆抬头。申鹤曰：「但要汝辈记住每一个名字。」\n一少年修士红眼问曰：「记住有何用。」申鹤视之，久乃曰：「记住，为使无用二字，不那么容易出口。」少年咬牙，泪终落。申鹤见之，不责，亦不慰。\n是夜有执事见申鹤独至碑前，持灯，自首行读至末行，读一名字，以指按之。读毕，取小刀于碑阴刻一行，字甚小，刻至末字，刀锋一顿。翼日有人视之，其文曰：「此辈非死于战，死于吾决。」执事不敢言，以灰掩之。越日灰落，字复见。碑在山口，石未磨光，字以凿刻，笔画有毛边。"
 LYY_Event.5036.a:"以血换土，虽赤不悔"
 LYY_Event.5036.b:"收兵止战，护我精锐"
 LYY_Event.5037.t:"老阵师呕血成阵"
 LYY_Event.5037.d:"缚山者，以阵法将绝云间与四方要道定于一处也。山与山之间，本隔数十里，阵成则缩为半日之程。阵成之日，天色异，云聚不散。老阵师立阵心，以血书符，书至末一笔，忽喷血于地，人向后倒。左右扶之，申鹤亦至，亲手托其背。\n老阵师睁目，气促，犹笑曰：「阵成矣。」申鹤问：「尚欲何为。」老阵师喘曰：「欲于有生之年，看一回援兵一日之内至山下。若得见此，吾一世所画之阵，便非白画。」\n申鹤曰：「汝必见之。」老阵师摇头曰：「夫人勿许。许者，吾反不敢死。」言毕闭目。申鹤不语，取巾拭其口角血，拭毕，命人舁之归。是夜老阵师卒。三月后魔犯山南，援兵自北至，一日夜行二百里。是日报至，申鹤取酒一碗，置于阵图之前，不饮。阵图以绢绘，悬于殿中，图上有朱线圈处，圈已褪色。"
 LYY_Event.5037.a:"缚山连脉，缩短援路"
 LYY_Event.5037.b:"各守其山，不相往来"
 LYY_Event.5038.t:"雪地焚书拒北盟"
 LYY_Event.5038.d:"使者至山，礼极厚，言极婉。所携者，一纸盟书，一柄剑。剑曰北地之剑，递来之邀也，亦是递至申鹤手边之一柄刀。至冬执行官坐于客位，曰：「汝有剑，吾有铁与钱。何不联手，替天理一遍此乱世。」言毕，取盟书置于案，推至申鹤前，纸上字极工，押已备。\n申鹤取书，不读，起而出门。执行官随至庭中，见其行至雪地，蹲身，以火石燃书。火起，纸卷，字先黑而后白，灰落于雪，雪上一小片黑。\n申鹤立而视之，曰：「吾之剑，不替任何人挥。惟此山要其挥向何处，则挥向何处。」执行官视灰良久，忽笑曰：「汝乃吾所见最难谈之对手。」申鹤曰：「吾不谈。」执行官曰：「然则吾此来，所为何事。」申鹤曰：「为使汝知，此山不谈。」遂入。是夜使者宿于关外，帐中灯火至晓未熄。盟书焚于云关外空地，雪上有灰一堆，风过则散。"
 LYY_Event.5038.a:"烧盟书，拒北来之剑"
 LYY_Event.5038.b:"接受盟约，结好至冬"
 LYY_Event.5039.t:"老兵出列求一字"
 LYY_Event.5039.d:"绝云间第一次以非仙者入行伍，山中人谓之凡人辅军。其所学惟一事：于最险处，为身后之人多撑一刻。检阅之日，列于校场，衣甲不齐，器械不一，然行立甚正。申鹤循行一周，至队末，一老兵忽出列，抱拳曰：「小人有一请。」申鹤曰：「可。」\n老兵曰：「他日若有人记得吾辈，请记得吾辈是人，非辅。」辅字听着，似谁挑剩之物。言毕，头低，不敢视。场中寂然。\n申鹤立有顷，曰：「准。」老兵抬头。申鹤转身向众，扬声曰：「自今而后，此队不名辅军，名守山人。」众先是一静，而后有应者，声不齐，继而齐，继而如雷。是日改旗，旗上无仙鹤之纹，只一山字。老兵捧旗，手抖，旗为重。行至队前，插旗于地，退三步，拜。众随之拜，场中尘土为之一扬。校场在山门内，地冻，插旗须以铁锥先凿。"
 LYY_Event.5039.a:"编凡人辅军，共守山门"
 LYY_Event.5039.b:"仙家独立，不杂凡人"
 LYY_Event.5040.t:"一册写尽十年事"
 LYY_Event.5040.d:"一室四壁皆架，架上皆册，册角磨圆。所居者一老修士，自入山至白首，未下过山。其所编之册，曰魔录。魔录所记，漫长战事中每一处细故：某年某月某日，某处裂隙开几分；何种魔物畏火，畏至何度；何咒可压几分，历几日而衰。\n有自前线归者访之，见其伏案，笔不停，乃叹曰：「翁一生未临大阵，可惜。」老修士搁笔，笑曰：「杀一魔，勇也。」将此册写到能救十年后一人，功业也。\n客曰：「十年后之人，未必知翁之名。」老修士曰：「吾亦不求其知。」取一册示之，翻至末页，曰：「此处所记，十九年前一少年所问。其问：裂隙闭后，气尚有乎。吾当时不能答，记之。」至去年，方补一行。客视之，页末墨色新，字曰：「尚有，三日乃尽。」客默然，起而揖之，退。老修士复伏案，笔下沙沙，如蚕食叶。室在绝云间山殿后，四壁皆架，架以杉木，木色已深。"
 LYY_Event.5040.a:"编魔录，以传后世"
 LYY_Event.5040.b:"战况自记，不必成书"
 LYY_Event.5041.t:"沿脊而行不绕谷"
 LYY_Event.5041.d:"大军沿山脊而行，日不过二十里，而无人能绕。此行谓之千峰行，几与天地争高下。行至第三日，一卒问曰：「夫人，吾辈何以必走山脊。」谷中平坦，一日可行五十里。申鹤止步，以杖指足下深谷。谷中雾重，不见其底，偶有风自下上，带腥气。\n申鹤曰：「谷中快。然谷中有伏，有瘴，有看不见之渊。吾辈慢，因吾辈输不起。」一队覆于谷，则后队皆滞；一队覆于脊，后队犹可绕。卒默然，点头。\n是夜宿于脊上，风大，帐不能立。众皆卧于石背风处，以毡裹身。有卒传日间之语于邻，邻传于后，一夜之间，自队首至队尾，皆闻此语。诘朝起行，无人再问。至第九日，望见山下平野，众皆不语，惟闻行囊相击。申鹤立崖边，望平野良久，曰：「下脊之后，各队自择路。」众愕然。申鹤曰：「脊上须听吾，脊下须听己。」千峰行之路在绝云间脊上，风急，行者低首，前后以绳相连。"
 LYY_Event.5041.a:"千峰行，稳扎稳打"
 LYY_Event.5041.b:"取道深谷，求其速进"
 LYY_Event.5042.t:"火烧雪原退魔潮"
 LYY_Event.5042.d:"为赶在魔潮之前，绝云间烧掉整片封冻之林，以火逼退黑暗。令下之日，无人应声，执火者皆低头。火起于北坡，风助之，一夜连烧三十里。烟与雪一同落下，冷热并砸于一张脸上。有卒以湿布掩口，布上结冰，冰上又黑。\n申鹤立于坡下，视火至中夜。火光映面，眉目皆赤。忽语左右曰：「吾一生最恨弄污雪之人。」左右不敢应。申鹤曰：「今日吾亲手烧之。」\n言毕，取一束枯枝，自投入火。火得枝，腾起丈余。申鹤退两步，曰：「记住此日。」左右问：「记火乎。」申鹤曰：「记吾何以烧。」言至此处，声微不可闻。翼日魔潮至坡，见焦土无林，无所依，遂折而东。东面守者报：「魔来，其势已衰。」申鹤曰：「然则此火未白烧。」命人收烬，取其一撮，置诸囊中。北坡之林多为枯木，火一起，烟直上，数十里可见。"
 LYY_Event.5042.a:"燃雪开路，虽悔不避"
 LYY_Event.5042.b:"绕行远途，保全雪林"
 LYY_Event.5043.t:"山下人间即此山"
 LYY_Event.5043.d:"绝云间之目，自一座山推至整个璃月，再推至凡为魔物所侵之处，此之谓普天之下。有旧人谏曰：「守好绝云间足矣。」山下之事，浑水也，何必趟之。谏者老，须白，曾随申鹤十年。申鹤不即答，命人取图，展于案。\n图上山川相连，以墨线贯之。申鹤以指自绝云间划出，循线至港口，至层岩，至云来海，指停于图外，曰：「此线以外，吾未至。然此线以内，皆此山之延。」\n旧人曰：「山下之人，未必认此山为主。」申鹤曰：「吾不须其认主。吾只须其不死。」旧人怔然。申鹤卷图，曰：「山下人灭尽，吾守此山，尚有意义乎。」旧人不能对。是日发檄三道，一道至港口，一道至层岩，一道留山中。檄文只一句：「凡有魔处，吾剑及之。」檄出，山中无议，亦无贺。檄文贴于山门与城中诸处，纸用素白，字大如拳。"
 LYY_Event.5043.a:"普天之下，皆我守土"
 LYY_Event.5043.b:"收缩防线，只保绝云"
 LYY_Event.5044.t:"万仙来朝立高台"
 LYY_Event.5044.d:"四方修士、山下义军，乃至数个心怀异志之旧敌，皆举旗而来。此绝云间最盛之时刻，亦最令人不安，山中人谓之万仙来朝。山门之外，旗色十余种，帐连数里，炊烟蔽日。有旧敌之旗与吾旗并列，旗角相触，风过则纠缠，解之复缠。\n申鹤立于高台，望此一片人海，久不言。左右侍立，不敢先发。忽曰：「人聚愈多，愈似一场潮。」左右问：「潮如何。」申鹤曰：「潮能载舟，亦能覆舟。」\n左右曰：「然则何以御之。」申鹤曰：「吾要者，从来非舟，是堤。」言毕下台，不赴诸营之宴，径归书室。是夜帐中火起三处，皆为人所扑，无人查究。诘朝大集，旗色依旧，无一人言夜事。申鹤登台，只曰：「今日之后，凡来者，各守吾约。」众应曰：「诺。其声不齐，如潮初至。」台在峰前空地，以石垒成，高丈许，四面可上。"
 LYY_Event.5044.a:"立仙座，总领四方"
 LYY_Event.5044.b:"不设共主，各归其山"
 LYY_Event.5045.t:"崖边独坐至天明"
 LYY_Event.5045.d:"夜深人静，申鹤偶忆涤除令下那些被清出山门之面。其面不尽相同，然有一处相似：皆不辩，皆不问。她独坐崖边，自夜半至天明。风自谷上来，衣角翻覆，发为其所乱，亦不举手指之。忽问己曰：「吾判彼时，是否亦在判某一刻之吾。」\n无答。崖下有水声，细而不断，如有人在远处言语，听不真。天色渐白，山脊先明，雪面由灰转青，复转白。\n她乃起身，山风骤紧，吹其衣角，露出手腕一道旧疤。疤极深，色白，横于腕内，非刀伤所致，乃自割。少时在绝云间，为证己之纯粹，曾以刃自划，血流至肘，未呼一声。今视之，久乃以袖覆腕，曰：「此亦一证。何人所给，吾已不记。」衣上霜已厚一分。遂下山，步履如常。是日议事，无人觉其异。崖下水声至晓不歇。崖下水声终夜不绝，声自谷底上，细而长。"
 LYY_Event.5045.a:"直面半仙之负，寻解"
 LYY_Event.5045.b:"压下疑问，只论功业"
 LYY_Event.5046.t:"渊前只说两个字"
 LYY_Event.5046.d:"层岩巨渊之深处，藏一物，比魔物更古。申鹤遣精锐下探，归者不过半，其眼中皆带一抹灰，说不清，洗不去。问其所见，皆摇头，曰：「不知。」再问，则有掩面者，有呕吐者。一人独坐墙角，以指画地，画一圈，复画一圈，画至十数圈而止。\n申鹤闻之，亲至崖边。渊口风冷，其气如铁。她俯视良久，不发一问。执事侍侧，亦不敢言。忽曰：「守着。」\n只此二字。自此无人再下那口渊，惟留守夜者源源而至。渊口立石，不刻文字。有守夜人问执事曰：「吾辈所守者何。」执事曰：「守一物，此物汝不该知。」守夜人曰：「既不该知，何以守之。」执事曰：「正因不知，汝方能活着守于此。」其人去，执事独留，视渊口久，忽自袖中取一小册，于末页添一行，字极草。风翻其册，可见上有一行：「第三批，十人，存三。」渊在层岩最深处，井道倾仄，灯至半途即灭。"
 LYY_Event.5046.a:"守层岩深渊，世代不辍"
 LYY_Event.5046.b:"封锁消息，任其沉睡"
 LYY_Event.5047.t:"碑前递过一壶水"
 LYY_Event.5047.d:"降魔大圣之旧誓犹在石上，而承之者，一个个皆成碑。此差几无人敢接，山中人谓之夜叉之誓。碑列于崖，凡十九。最末一碑无字，人曰：「留与后来者。」申鹤立于碑前，对愿接此任之数少年曰：「吾知劝不住汝辈。」众低头。\n申鹤曰：「吾只问一句。此路之尽头，所书者，是汝自己之名乎。」众默。风过碑间，声如低语。良久，一人出列，年最少，面有稚气，对曰：「写不出名。然总得有人走。」\n申鹤视之甚久，不复劝，取腰间水壶授之。壶尚温。曰：「路上饮。」少年受壶，跪而叩首，起，转身即行，不回顾。余人随之。申鹤独立碑前，至其影入崖下，乃取石一块，置于无字碑前，以指划之，划一横，复一横，终不成字，遂止。是夜崖上火起，凡十九处。夜叉之碑列于绝云间崖侧，凡十九，石色各异，乃历年所立。"
 LYY_Event.5047.a:"承夜叉之誓，接此重担"
 LYY_Event.5047.b:"另择其人，不使独苦"
 LYY_Event.5048.t:"悬剑门侧不尝拔"
 LYY_Event.5048.d:"剑至之日，使者以为必有仪式，候于庭，候至日暮，无人召。剑被置诸山门之侧，以木架承之，与申鹤之剑遥遥相对。两剑之间隔一条石道，往来者必经其中。申鹤终其身不拔此剑，山中人谓之北国赠刃。\n有弟子不解，问曰：「既收之，何不藏之。」申鹤曰：「藏之则忘。」弟子曰：「然则何以不拔。」申鹤曰：「拔之则为吾剑。吾不愿其成吾剑。」\n弟子曰：「既不欲用，何不还之。」申鹤曰：「还之，则吾山门之前无此一物。」弟子怔然。申鹤指两剑之间，曰：「汝日日经此，见彼剑在，则知此世尚有另一条路，安静待人选。」知有他路，方能自守此路。弟子拜而退。自后凡新入山者，第一日即被告以两剑之事。历三十年，北剑之鞘生苔，苔色青，无人拂去。北剑之架置于绝云间山门，以木为之，架上有尘，尘厚而不扫。"
 LYY_Event.5048.a:"悬北国之刃于山门"
 LYY_Event.5048.b:"毁其剑，绝其念"
 LYY_Event.5049.t:"一片白里脚步稳"
 LYY_Event.5049.d:"一切柔软皆收于最内之衣襟，不与外人见。此绝云间末后之模样，冷、硬、几不留情面，山中人谓之铁雪。与人言，语不过三句；与人坐，目不旁移。外人至山，归而语人曰：「其地无笑。」\n申鹤行于雪中，步极稳，雪深至踝，其步不乱。行至半山，忽止。四望皆白，无一物可为标记，而她知此处是何处。\n忽想：若帝君尚在，见其以一座山为此状，当是赞许，抑或叹息。想至此，自嘲而笑，笑声甚短，出口即散。此问同样无人答。乃续行。至山门，执事迎，奉册请判。申鹤取笔，判三事，笔锋不滞。判毕还册，执事退。忽又呼之，曰：「今日之雪，厚几寸。」执事愕然，曰：「回夫人，约四寸。」申鹤点头，入内。执事立门外，久不能解其问。是夜雪又落，厚至六寸。山中道皆石砌，雪覆其上，行者以足试，步稳而缓。"
 LYY_Event.5049.a:"以铁雪之姿，示于天下"
 LYY_Event.5049.b:"稍解严苛，存几分暖意"
 LYY_Event.5050.t:"城头一语众齐应"
 LYY_Event.5050.d:"光复璃月之日，落泪者不多。绝云间之人不惯哭，其以情绪压入握剑之手，压成一片沉默。申鹤立于璃月港最旧之城墙上，俯瞰山河。城下有人呼，有人拜，有人仰面不语。街衢相连，自港口至玉京台，旗色一新。她看甚久，不发一言。\n左右侍立，日影渐移。忽有一老执事低声曰：「夫人，众候一言。」申鹤乃开口，声不高，而城下人皆闻：路修好矣，雪，亦当化矣。\n言至此，顿。城下寂然。乃续曰：「下山罢。」话音落，身后执剑者数百，齐声应一字曰：「是。其声如一，无一人先，无一人后。」申鹤不回头，只以手按城墙，按至砖上浮尘尽去。城上旗为风所卷，扑其面，她以手按之，旗止。是夜港中灯火通明，绝云间方向无人上山，亦无人下山，山路空着，雪自化。城墙为璃月港最旧一段，砖色深，砖缝生草。"
 LYY_Event.5050.a:"携此山规矩下山"
 LYY_Event.5050.b:"封山自守，不复南下"
 LYY_Event.5051.t:"礼收盟焚待客茶"
 LYY_Event.5051.d:"北使入山，携精美之礼，所谈者却是共同之秩序。礼陈于庭，锦匣十余，匣上金线，光可照人。使者历数盟约之利：铁可通，路可借，兵可援。言辞恳切，至末，取盟书奉上，曰：「此约若成，两家皆安。」\n申鹤听毕，不置可否。命人取礼入内，一一记其名，而后取盟书，行至炭盆，投入。纸卷，火起，烟直升。\n使者色变，再变，终于拱手曰：「夫人果然如传闻，难缠。」申鹤曰：「多谢。礼吾收，是汝之诚意。」盟不签，因盟成则为吾之枷。使者曰：「夫人不畏孤立乎。」申鹤曰：「孤立者，尚可自守。」受枷者，不能。使者默然，良久曰：「既如此，吾无话矣。」申鹤举手曰：「请用茶。」茶至，使者饮一杯，饮毕，忽问：「此茶何名。」申鹤曰：「无名。」山中茶，不作名。茶为绝云间自制，叶粗，汤色黄绿，饮之微苦。"
 LYY_Event.5051.a:"收礼而不签约"
 LYY_Event.5051.b:"签约结盟，共理秩序"
 LYY_Event.5052.t:"玉衡灯火比夜明"
 LYY_Event.5052.d:"使者赴玉衡，归而报曰：「玉衡之灯火，比想象中亮。」申鹤方阅文，闻之，笔止于纸，久不动。墨在笔尖聚成一珠，终坠，纸上一点黑。乃搁笔曰：「亮灯之处，影亦最清。」\n使者不解。申鹤命人备薄礼一份，回赠刻晴。礼不厚，一匣山中药，一册手抄之律。使者问：「此礼何意。」申鹤曰：「不为交好。」使者曰：「既不为交好，何以赠之。」申鹤曰：「不肯使绝云间，于礼数上输一后辈。」\n使者领命，行至门，忽回身多问一句：「夫人当真敬重那位刻晴乎。」申鹤笑而不答，惟挥手令去。使者出，门合，闻内有一声极轻之响，如指叩案。其礼至玉衡，刻晴展匣，取药一嗅，复看律册，翻至第七页，忽停，指一行，语左右曰：「此条，是彼替我落笔。」左右问：「何以知之。」刻晴曰：「此条太细，非我辈所能想。」使者归述所见，言玉京台上灯凡百盏，夜中如昼。"
 LYY_Event.5052.a:"回赠薄礼，两不相欠"
 LYY_Event.5052.b:"通使交好，共御外敌"
 LYY_Event.5053.t:"一笑而散各算各"
 LYY_Event.5053.d:"群玉阁之回信，比使者先至。信使昼夜兼程，马毙于途，易马再行。申鹤拆信，纸上字极秀，行间密布数目：几船，几税，几日之程，几分之利。读至半，忽笑出声。笑声在室中回荡，执事在门外闻之，以为异。\n申鹤以信示执事曰：「她以天下为一盘账。」执事不敢接。申鹤曰：「吾却要将天下，一座一座地量。」一量钱，一量山，各算各账。\n言毕取笔，于信背批四字：「各算各账。」批讫，折信，命人送回。执事问：「不再复一字乎。」申鹤曰：「不必。其要者，是吾认其算。」\n执事退，行数步，回望，见申鹤仍持信，未收，目在纸上，笑意未尽。是日午后，申鹤命人取山中田亩册，亲自核算。算至三更，忽搁笔，取群玉阁之信，复读一遍，读毕，仍笑。群玉阁之信使马毙于途，易马再行，至时靴上有泥。"
 LYY_Event.5053.a:"各量其天下，互不相扰"
 LYY_Event.5053.b:"以山中之理，非其算盘"
 LYY_Event.5054.t:"无人以此问过我"
 LYY_Event.5054.d:"月海亭是绝云间唯一肯多留使者半日之处。其地不设仪，不陈兵，入门惟见一院，院中一树，树下一几。彼处半仙所问，不涉国事。问曰：「山上之雪，今年厚乎。」又问：「仙鹤尚归乎。」使者一一答之，答至鹤时，其人忽笑，曰：「归则好。」\n使者归山，于阶下复命，将这些话原样转述。申鹤初闻，面无异色；闻至鹤，手指轻叩座侧，一叩即止。转述毕，室中静。\n良久，执事小心问曰：「夫人何如。」申鹤曰：「无事。」执事不敢再问。申鹤乃曰：「只是想起，很久无人以此类言语问过吾。」执事曰：「此类言语，何足道。」申鹤曰：「正因不足道。凡问国事者，皆有所求。」问雪问鹤者，无所求。是夜她独至山门，望月海亭方向，见远处灯火一点，微如豆。立有顷，还。次日命人于山门内植松一株，曰：「留与问鹤者看。」月海亭院中一树，树下一几，几上常年置茶一壶。"
 LYY_Event.5054.a:"回信月海亭，叙山中之景"
 LYY_Event.5054.b:"以政务相复，不言私谊"
 LYY_Event.5055.t:"批注一行让非退"
 LYY_Event.5055.d:"云来海之约最直白：只要肯让一条路，至冬之铁，永不断绝。约文不过一页，字大而疏。申鹤取约，折之，复折，折至八折，掌中一小方。展开，于末页批一行。批毕，誊一份，付使者。\n使者接而读之，读至末，抬头。申鹤曰：「记清楚。此让也，非退也。」使者曰：「让与退，何以别。」申鹤曰：「退者，为人所推。让者，吾自开门。」使者曰：「门开之后，人能入乎。」申鹤曰：「能入。然门在吾手，开闭由吾。」\n使者默然，收批文，拱手。行至庭中，忽回身曰：「夫人既知门可闭，何不永不闭。」申鹤曰：「永不闭之门，墙倒也。」使者不能对，遂去。申鹤立庭中，视其行远。风自云来海方向至，带咸气，庭中旗为其所举。申鹤忽命执事：凡此后与至冬往来文书，皆存一份，另置一箱，箱上题曰「他日观之」。约文一页，字大而疏，纸为北地所造，色白而厚。"
 LYY_Event.5055.a:"划路而守，寸土不让"
 LYY_Event.5055.b:"断然拒绝，闭境自守"
 LYY_Event.5056.t:"一捧带泥之谷种"
 LYY_Event.5056.d:"沉玉谷之回复，最不像官样文章：一捧带泥之谷种，与一句无头无尾之语，曰：「山上之雪化时，会流至此。」使者捧种至，泥犹湿，以粗布裹之。申鹤展布，取种一把，置于掌，视良久。谷粒小而实，间有数粒已裂，露白。乃曰：「种之。」\n执事问：「种于何处。」申鹤曰：「药圃之角，向阳处。」执事曰：「此非药。」申鹤曰：「亦种之。」\n是年谷雨，苗出，细密一片，风过则伏，风止复起。申鹤来看过一回，蹲于苗前，久不起。执事侍立，见其伸手，以指拨一株之叶，叶上有露，露落于土。老仆司药圃者后语人曰：「夫人在圃中蹲半日。」起时以手拍去掌上泥，拍两拍，复看一眼。此动作，吾在绝云间四十年，未见其于任何物上做过。是年秋收，得谷三斗，不入仓，尽以赐圃中杂役。谷种以粗布裹，泥未干，布上有草屑数点。"
 LYY_Event.5056.a:"收下谷种，种于药圃"
 LYY_Event.5056.b:"谢而不受，各安其土"

 SHP_Spirit_Lone_Crane:"孤鹤下云来"
 SHP_Spirit_Lone_Crane_desc:"绝云间有鹤，离群而下，立于人间。不树旗，不入朝，不受一方之饷。然其所至，强者改容，弱者抬头。有议者曰：「此鹤无兵，何以能尔。」识者曰：「正以无兵。」有兵者，人可与战；无兵而立于中者，战之则失众。鹤不鸣，众自息；鹤一举翼，满座皆起。故曰：「无所属者，最难撼也。」"
 SHP_Spirit_Frost_Edict:"霜敕刻冰壁"
 SHP_Spirit_Frost_Edict_desc:"绝云间之敕，不书于纸，刻于冰壁。一字一凿，深三分，风过不能磨。犯律者押至壁前，令其自读所犯之条，读毕，无辩者乃服。或问何以不用纸。执律者答以纸可焚，冰不可焚；纸可改，冰改则有痕；故其敕无情，惟论分寸。分寸之内者活，分寸之外者死，虽故交不免。"
 SHP_Spirit_Cold_Peace:"雪压山无言"
 SHP_Spirit_Cold_Peace_desc:"山中无争斗，亦无妄言。晨起扫雪，暮归闭户，犬不夜吠，鼓不夜鸣。初至者以为大治，居三月而心悸。客问其故。居者自言在此三年，未闻邻人笑语，亦未见邻人相争。客疑无争非美事乎。居者良久乃言：争者，人尚有求也；今无求，故无争。客视其面，色如雪。奥藏山屋舍相去各半里，雪后无足迹相通，炊烟各起各散。"
 SHP_Spirit_Frost_Court:"玄衣按阶立"
 SHP_Spirit_Frost_Court_desc:"玄霜之廷，修士着玄衣，按品而立，阶下无一人语。律条刻于冰壁，自左至右，凡九十九款。凡入廷者，先读壁，后见官。有老修士立于末阶三十年，未尝升一级，亦未尝告病。或问其何以能久。曰：「阶上有位，位上有人；吾所守者阶，非位也。」是廷也，冷极而声清，一咳可闻于殿角。廷在奥藏山阴，冰壁终年不化，字迹随冰长而略涨。"
 SHP_Spirit_Never_Melting_Snow:"山巅雪不化"
 SHP_Spirit_Never_Melting_Snow_desc:"雪化则成水，人散则成尘，惟山巅之规，历千年而不化。绝云间以为脊骨，亦以为棺椁。有少年登山，见雪中石碑，字为风蚀，仅存数字：「不可。」问守者：不可者何。守者曰：「吾亦不知，然吾师守之，吾师之师亦守之。」少年下山，回望雪岭，白如一线，横在天末。"
 SHP_Spirit_Dao_War:"万仙来赴会"
 SHP_Spirit_Dao_War_desc:"一檄既出，四面之旗并至。修士自云中来，义军自田中来，旧日之仇亦遣使来。坛下设席三百，坐不能容，有立于阶下者竟夕不去。执事者忧其众杂，请设兵以防。主者不许，谓今日所聚者人心，非兵也；若以兵防之，则人心先散。乃命撤兵，止留执壶者十人，往来斟之。终席无一刃出鞘。散时，主者退语近侍，谓此潮也，所求者堤，非潮。坛设于绝云间南麓，坛以石垒，三面当风，一面倚崖。"
 SHP_Spirit_Ascetic_Severance:"入山断俗缘"
 SHP_Spirit_Ascetic_Severance_desc:"入山者先弃其籍，次弃其姓，终乃弃其家书。有少年携母所缝之衣至山门，执事者令焚之。少年抱衣不释，久乃曰：「衣可焚，线不可焚。」取线一缕，缠于腕，余者投火。自是无家书至，无姓名呼，日惟负石、汲泉、守炉。十年后，腕上一缕已黑如铁，而人问其母，则曰：「忘矣。」山门在奥藏山半，门以木为扉，扉上无钉，惟横木一道。"
 SHP_Spirit_Mountain_Law:"山法不问尘"
 SHP_Spirit_Mountain_Law_desc:"山有山法，不问尘世之律。凡入山者，先解佩剑，次报名，终乃跪。有贵家子至，不肯跪，曰：「吾父在朝，位列三品。」守山者曰：「此山不论品。」贵家子怒而去，行至半岭，风雪大作，不得已而返。翼日复至，跪于阶下，雪及其膝。守山者不迎不拒，但曰：「可入。」自是山中皆传此语，以为法。守山者居奥藏山门侧小屋，屋中一榻一炉，壁上悬律条竹牌。"
 SHP_Spirit_Half_Blood:"仙凡血相杂"
 SHP_Spirit_Half_Blood_desc:"其母仙也，其父人也。故其目能见常人所不见，而其足不能履仙人所履。少时同辈呼之曰半，长而执律，亦以此半自刻。凡判人之罪，先自问此罪在血乎，在行乎。老者谓其执法太急。答以急者，恐人先以血论己。老者叹曰：「汝所判者众，所赦者独无己。」其人执律于绝云间，案上一尺一册，尺为木，刻度浅。"
 SHP_Spirit_Vigil_of_Xiao:"夜叉旧誓在"
 SHP_Spirit_Vigil_of_Xiao_desc:"降魔大圣之誓，旧刻于石，字迹半蚀。后来者读之，无不立誓；立誓者去，去者不返。山中有一壁，壁上刻名，凡承此誓者，名皆在焉。有少年刻名毕，问守壁者曰：「此上之名，几人得归。」守壁者取灯照之，自下而上，数至中段而止，曰：「至此以上，无人。」少年不语，取凿复刻其名，令深三分。壁在奥藏山后，石面粗，字以凿成，深处可容指。"
 SHP_Spirit_Guardians:"守山人非仙"
 SHP_Spirit_Guardians_desc:"守山人者，不修大道，不解咒法，所习者惟一艺：于最险之处，多撑一刻。撑一刻，则身后之人得过；过者不回头，亦不问撑者之名。有仙者过而问曰：「汝何不求长生。」守山人曰：「长生者众，守山者少。」仙者笑而去。越数年，山崩，守山人尽没。仙者复过，见断崖上新刻数名，乃驻足，以手抚石，久乃曰：「人有时较仙为硬。」言毕而去，不复笑。断崖在明冠峡口，崖面北向，雪积于字槽，春乃消。"
 SHP_Spirit_Five_Envoys:"五方各遣使"
 SHP_Spirit_Five_Envoys_desc:"五使分遣，一赴稻妻，一赴至冬，一赴须弥，一赴枫丹，一赴蒙德。各持一节，节上无文，惟刻璃月二字。或问使而无辞，何以为使。主者答以有辞者，人可驳；无辞者，人但观其来不来。及岁暮，归者四，其一留于雪国，书至而不归。书末惟数字：彼亦有人。五节发时，皆自奥藏山门下过，门侧石上刻一使字，已磨平。"

 SHP_Might_Tier_1:"仙威之阶"
 SHP_Might_Tier_1_desc:"仙威不振，山门蒙尘，仙众离心。路过之风亦敢在绝云间檐角下打旋，无人再以此山为一回事。山门之匾为雪压落半角，三年未修；山下樵者过之，不知此匾所书何字，只当旧庙，无人知其为山门。"
 SHP_Might_Tier_2:"仙威之阶"
 SHP_Might_Tier_2_desc:"仙威初立，山中有戒，山外无惧。守得住自家门庭，却压不住四方杂音。盗矿者夜入山界，为巡山者所逐，退至界外百步，立而骂。巡山者不追，按剑立界石之侧，待其骂毕自去，归而记于哨册。"
 SHP_Might_Tier_3:"仙威之阶"
 SHP_Might_Tier_3_desc:"仙威渐盛，九峰有令，四方侧目。绝云间一开口，山下之人始认真听。山下两村争水，讼于官，官不能决。使者自山上来，只立渠口看半日，指一处曰：「此处让三尺。」两村皆从，无人再争。"
 SHP_Might_Tier_4:"仙威之阶"
 SHP_Might_Tier_4_desc:"仙威凛冽，剑锋所指，寸草不生。力来得快，亦硬，硬得握剑之手皆发麻。一令既下，界外三百步内，人畜尽徙。徙者不敢回头；有老妇负其祖牌而行，行至界石，回望旧屋，屋已拆。"
 SHP_Might_Tier_5:"仙威之阶"
 SHP_Might_Tier_5_desc:"仙威滔天，举山之力，可撼一国。然一座山变成一头兽，最先觉出寒意者，往往即山中之人。九峰之下，诸村岁输其半，无人敢言。有村老于输粮之日，取一撮新谷藏于袖，归而供于灶前，不焚香，只一揖。"
 SHP_Discipline_Tier_1:"戒律之阶"
 SHP_Discipline_Tier_1_desc:"戒律废弛，令出不行，法纪松散。山中之人各自为政，无人肯替他人多走一步。雪夜有哨倒于途，天明方为人所见，所携之炭尚在其侧。守山之规本须二人同行，此行只一人，而无人问其何以一人。"
 SHP_Discipline_Tier_2:"戒律之阶"
 SHP_Discipline_Tier_2_desc:"戒律初明，赏罚有据，上下有序。规矩立起来了，只是执行时，还留着几分人情。赏格悬于殿角，罚条刻于冰壁。凡罚，先问其功，功足抵者减半；减半者仍书于册，册末附一句：此减，出执律者之意。"
 SHP_Discipline_Tier_3:"戒律之阶"
 SHP_Discipline_Tier_3_desc:"戒律严整，令行禁止，山门如铁。修士们行动如一人，冰冷，却可靠。夜半火起于西峰，钟三鸣，九峰之众齐至，各就其位，无一问火自何起。火熄，众散，自始至终，无人喧哗，亦无人后至。"
 SHP_Discipline_Tier_4:"戒律之阶"
 SHP_Discipline_Tier_4_desc:"戒律森严，律条如刀，不问情由。犯忌者无所遁形，敢通融者亦一个一个不见。有执律者私放一人下山，越三日自缚至殿前，请按其律。主者问其何故私放。答以不忍。主者命照律，行刑者手不颤。"
 SHP_Discipline_Tier_5:"戒律之阶"
 SHP_Discipline_Tier_5_desc:"戒律如渊，行止坐卧，皆有定数。极端之序守住了绝云间之纯粹，亦可能锁住它伸向人间最后一只手。九峰之众，食有定时，语有定声，行有定径。少年初入，夜半欲出观星，至门而止，立于门内看至天明，未越一步。"
 SHP_Combo_Twin_High:"冰火同炉"
 SHP_Combo_Twin_High_desc:"仙威尽出，戒律也压到极限。山上一面在征伐，一面在清剿自己人。前队出界之日，后队正在殿前受刑。有修士自界外归，见同门跪于雪中，欲言而不敢，惟解其氅覆之，自缚以待。"
 SHP_Combo_Twin_Low:"云散山空"
 SHP_Combo_Twin_Low_desc:"锋芒钝了，戒律也松了。山门大开，回响空落，连雪都落得没精打采。钟不鸣，哨不设，界石为雪所埋，无人去认。山下樵者入界伐木，见殿门半开，探头视之，殿中无人，案上灯已冷。"
 SHP_Combo_A_High:"锋芒无律"
 SHP_Combo_A_High_desc:"剑出鞘了，却没人记得清该砍向谁。威势铺天盖地，队伍也开始失控。号令一日三改，前队已发，后队未集；有营误入邻营之界，两营对峙半日，方知同为九峰之众。主者闻之，不怒，只命再发一令。"
 SHP_Combo_B_High:"律霜无锋"
 SHP_Combo_B_High_desc:"条文刻满冰壁，队伍却打不出去。此山静得像一座巨窖。冰壁之上，律条九十九款，款款分明；而界外之盗，已据三处隘口。守隘者请战，执律者翻律至末，曰：「律无此条。」乃不战。"

 #################### 申鹤 · 绝云间 · 战后 ####################
 SHP_PW_Lone_Crane_Order:"鹤立旧墙贴敕"
 SHP_PW_Lone_Crane_Order_desc:"翼日，申鹤自山而下，登港口旧墙，立一时辰，不设座，不张盖。执律者分头入巷，贴敕于壁，凡百余纸。市中观者渐集：跪者数十，骂者数人，余皆不语，或抱臂，或负手，或低头看地。申鹤自墙上俯视，待其阅毕，乃曰：「汝辈不必信我。」众抬头。又曰：「先看我如何做事。」"
 SHP_PW_Clear_the_Slush:"先清墟后立旗"
 SHP_PW_Clear_the_Slush_desc:"港城战后，雪覆一层，其下皆焦梁与无人认领之骨。执事请先立旗，申鹤曰：「旗不急。」命集人清墟，先收骨，次辨名，其无名者聚葬于城西。有小吏言太缓，申鹤不答。一日，她立瓦砾之上，见一少年搬石，指其石曰：「此石下有人。」少年跪而掘之，得一陶罐。申鹤曰：「清之既尽，此后汝所行者，脚下方非他人之名。」"
 SHP_PW_Ration_the_Valleys:"粮车出山数尽"
 SHP_PW_Ration_the_Valleys_desc:"山中之粮，本不足支一冬。申鹤仍拨三成下山。执事谏曰：「留一手，以备不测。」申鹤曰：「山中饿一顿，尚可修一日之道；山下饿一顿，则一户散矣。」执事无言。粮车出山之日，凡四十七乘，车辙压雪成渠。申鹤立队尾，不问事，惟数车。数至四十七，末车转过山口，不见，乃回。"
 SHP_PW_Registry_of_the_Living:"新册只论生死"
 SHP_PW_Registry_of_the_Living_desc:"新册之制，不论仙凡，只论活人。凡在册者，冬给炭，病给药，死于兵祸者入碑。有执律者问：「半仙算否。」申鹤曰：「尚在喘息，即占一行。」问者退。册成，厚几盈尺，字极齐整，无一笔潦草。有书吏写至夜半，手颤，请以草书。主者曰：「此册所载者皆活人，一笔潦草，即一笔不敬。」吏乃洗笔重书。"
 SHP_PW_Rebuild_the_Cloud_Gates:"云关须留小门"
 SHP_PW_Rebuild_the_Cloud_Gates_desc:"云关久断，命重修。图出，多一条旧图所无：关墙须留小门一道，广容板车。匠人问曰：「门多则守难。」申鹤曰：「关所挡者刀也，非人也。」又曰：「此门日后必开于要紧之时。」匠人默记，退而绘之，其笔较正门更细，门枢、门槛、泄水之沟，一一注之。图成，申鹤视之，指小门曰：「此处多费三日，值得。」"
 SHP_PW_The_Ascetic_Reform:"清修戒律推城"
 SHP_PW_The_Ascetic_Reform_desc:"清修之戒，自此推及全城：食有节，役有期，赏罚不问出身。市人初受之，颇以为苦。有老商入署请宽，曰：「如此则生意难做。」申鹤曰：「吾不强人信仙，只强人守约。」老商曰：「约太密。」申鹤曰：「密则可守，疏则易败。」是冬，城中灯火较往年暗三分，而街衢之间，行者让路，市无喧争，齐整过于旧时。"
 SHP_PW_A_Ledger_of_Snow:"一车炭一口棺"
 SHP_PW_A_Ledger_of_Snow_desc:"雪账者，战后开支之册也。一车炭、一口棺、一匹布、一斗盐，皆入。月终，申鹤亲阅，批注只二字：「该否。」有官吏嫌其细，曰：「此等小数，何劳山主。」申鹤推册至其前，曰：「所花者，百姓以命换来之钱。」吏视册，见其中一行：「棺十七口，无名者九。」遂不复言，取笔自校其误。"
 SHP_PW_Frost_Workshops:"霜炉冷火授徒"
 SHP_PW_Frost_Workshops_desc:"霜炉之火，色青而无声，触之不觉其热，而铁入即赤。炉初立，匠十二人，皆自山下召。申鹤令各带徒二，首批学徒十八，半为孤儿。有老匠惜其术，不肯尽授。申鹤曰：「艺留山中则生苔，传于人则长青。」老匠惭，乃尽出其所记之簿。是年炉熄者二：一为雪压其顶，一为匠人生子，众人饮酒，忘添炭。"
 SHP_PW_Cloud_Rail:"亲置枕木通车"
 SHP_PW_Cloud_Rail_desc:"车道自山脚达云关，凡三十里。第一根枕木，申鹤手自置之，以锤击三下，木入土半寸。役夫四百，半为降卒。初至，皆俯首不语，恐见疑。申鹤立其上，曰：「路成，则汝辈之力长于此路，无人能抹。」众始抬头。通车之日，首车满载铁器，申鹤推其轮一转，车动，众皆呼，呼声不甚齐，而久久不散。"
 SHP_PW_Herb_Terraces:"药先山下后山"
 SHP_PW_Herb_Terraces_desc:"药圃依向阳之坡，层层而上，凡九级。所种皆寻常药材，凡人可用。申鹤定规：药先供山下，有余乃供山中。有修士不服，曰：「此圃在山，当先给山。」申鹤曰：「山外之人若尽病倒，山中丹成，与谁看。」修士不能对。管圃老仆记之：是秋雨匀，苗长过膝，为近十年所未见，圃中无一人争水。"
 SHP_PW_Frost_Coinage:"霜钱一面刻律"
 SHP_PW_Frost_Coinage_desc:"霜钱新铸，一面为鹤，一面为律条四字。钱体厚重，较旧钱增三分。有商人嫌其沉，请减。申鹤曰：「钱轻则规矩轻。」商人曰：「钱轻则易携。」申鹤曰：「易携者亦易散。」首批铸成，凡三千枚，倾于案上，声如急雨。申鹤立炉边，自夜至晓，一枚一枚取视，见有字口模糊者，拣出百余，命复铸。"
 SHP_PW_Adepti_Academy:"仙凡同席算账"
 SHP_PW_Adepti_Academy_desc:"学馆初开，生徒六十，仙凡同席，不分座次。课凡四：丹鼎、阵法、算学、水利。开学之日，申鹤登讲席，曰：「汝辈可以不信仙，不可不懂账。」言未毕，一山下少年起，问曰：「半仙算仙否。」满堂寂然。申鹤视之，曰：「算与不算，皆不打紧。」少年曰：「然则何者为紧。」申鹤曰：「先将此账算清。」"
 SHP_PW_Peak_Arsenal:"峰上刀刻匠名"
 SHP_PW_Peak_Arsenal_desc:"兵工自港口迁入山坳，炉增六座，月出刀千、枪三百。申鹤立规：凡出厂之器，必刻匠名于柄。有吏谏曰：「此留寻仇之柄也。」申鹤曰：「有人认领之刀，方不轻出鞘。」吏曰：「若其器伤人。」申鹤曰：「则问其名。」首条刻名之枪悬于厂门，历一岁，木柄生霉，字迹犹存，无一人请去之。"
 SHP_PW_Envoys_Below_the_Clouds:"使节携账出山"
 SHP_PW_Envoys_Below_the_Clouds_desc:"使节出山，凡五人，所携者账册一箧、口信一句：「绝云之门已开，规矩须先说清。」有僚属笑曰：「求人通商而先立规，谁复与交。」申鹤曰：「肯先出账者，方可言信。」使节去三月，归携约三纸，首款皆以互认货税为始。僚属视之，不复笑。申鹤取约，只批一行：可。余不问。"
 SHP_PW_The_Yuheng_Accord:"读宪一夜问仙"
 SHP_PW_The_Yuheng_Accord_desc:"刻晴使者至，奉共和章程一册。申鹤受之，读一夜，灯三易。翼日，只问一句：「汝辈之宪，管仙乎。」使者曰：「管。」申鹤笑，曰：「如此则可谈。」使者曰：「山主欲何条。」申鹤曰：「不多，一条足矣，山中之人犯法，当依何律。」使者沉吟，曰：「依城律。」申鹤曰：「可。」二人终未结盟，各于纸上划一线，其后二十年，无人越之。"
 SHP_PW_The_Jade_Chamber_Account:"回信尽是算盘"
 SHP_PW_The_Jade_Chamber_Account_desc:"凝光回书至，厚十页，页页皆数：矿若干、税若干、道若干、耗若干。申鹤阅毕，掷于案，曰：「满纸算盘声。」遂不复书，惟命装霜铁一车送去，附素笺四字：「账后再说。」执事问其意。申鹤曰：「彼算天下，吾量山。算得清者归彼，量得准者归我，如此方可久谈。」"
 SHP_PW_Moonlit_Pavilion_Question:"月海亭问山雪"
 SHP_PW_Moonlit_Pavilion_Question_desc:"甘雨见使者，不谈条款，先留半日，煮茶二盏。所问者皆私语：「山上之雪今年厚否，鹤还归否，旧崖之路尚可上否。」使者一一记之，归而具陈。申鹤听至鹤归二字，忽止其言，问曰：「彼真问此乎。」使者曰：「问之再。」申鹤侧首看窗外，良久，曰：「多年无人以此问我矣。」"
 SHP_PW_The_Cloud_Sea_Pact:"让路自吾辈始"
 SHP_PW_The_Cloud_Sea_Pact_desc:"至冬请通云来海一道，许以铁与钱。申鹤取盟约，折之，再折之，凡四折，袖之。使者候于阶下。移时，申鹤出，批一行于约末：路可让。使者色喜。又批一行：「须我自让，不容人推。」使者问其故。申鹤曰：「被人推着让之路，迟早被人推着收。」使者默然，携约而去。"
 SHP_PW_The_Sunken_Jade_Seed:"谷种带泥入山"
 SHP_PW_The_Sunken_Jade_Seed_desc:"沉玉谷使者至，不奉文书，只捧布囊一，解开，是谷种半升，犹带湿泥。附语一句：「雪化，当流至此。」申鹤取一撮，捻于指间，曰：「尚温。」命种于药圃东角，不施肥，不覆草，惟日往视。是岁苗出，凡七株，至秋成穗。她蹲苗前，视之许久，起身时以手拍去指上泥，泥落于圃，未拂其衣。"
 SHP_PW_The_Empty_Seat:"三椅并排无签"
 SHP_PW_The_Empty_Seat_desc:"殿中设椅三，并排而列，不设座签，不覆布。一为帝君之旧位，一为商会之首座，一为天空岛之使席。众入殿，见之皆默。申鹤曰：「昔者吾辈行事，先视人色。今三椅皆空，正好自视坐得正否。」有执事问：「此椅何时可撤。」申鹤曰：「待吾辈议事不必再看空椅之日。自此每议大事，无一人近此三椅。」"
 SHP_PW_Question_the_Heavens:"神谕逐条标真"
 SHP_PW_Question_the_Heavens_desc:"神谕、天象、谶纬，汇为一编，逐条标注：「合者书合，不合者书不合，不可考者书存疑。」司其事者愈查愈惊，至一谶，验之三事皆合，持卷请裁。申鹤视之，曰：「合则书合，不问其为神为伪。」遂于册尾亲书一行：「此编非为定论，乃为后人留一可自判之书，不必再待人代其言。」"
 SHP_PW_Ward_the_Chasm:"闸门一寸寸落"
 SHP_PW_Ward_the_Chasm_desc:"巨渊之裂，再封。所用者新铸之合金，所施者新定之法。申鹤亲下井口，立升降之架，视末段闸门一寸一寸而落。石屑自顶坠，击其肩，不为动。闸合，声沉，井中一时无风。申鹤谓守者曰：「深渊者，按月必偿之债。今日多偿一分，后人少赌一命。」守者传其语于井口，众工闻之，一时皆直其腰。"
 SHP_PW_The_Fissure_Crusade:"再捣魔巢绘图"
 SHP_PW_The_Fissure_Crusade_desc:"再讨裂境，出队九，归队七。修士深入幽暗，凡巢穴一处处捣之，火起则退，灰落再入。归者不带一物，只带图：何处犹燃，何处已冷，何处又生魔气。图悬于殿，朱点日增。申鹤视之，以指按一新点，曰：「此战赢不得。」执事曰：「既赢不得，何苦再出。」申鹤曰：「亦停不得。」"
 SHP_PW_Supplant_the_Sky:"殿中说替天二字"
 SHP_PW_Supplant_the_Sky_desc:"殿中议事，至日暮，众议未决。申鹤忽曰：「替天。」二字出口，殿中骤静。执事以为误听，请复。申鹤曰：「替天。」又曰：「天理若在，请出而言；若终不出一声，则那张椅子空着，总须有人坐上去，把秩序立住。」言毕，无人接声。有老执律者欲起，起至半而复坐。殿外雪落极静，一夜而满石阶。"
 SHP_PW_The_Adepti_Throne:"仙座刻律与众看"
 SHP_PW_The_Adepti_Throne_desc:"座成于殿之西，黑石为体，不雕不漆。申鹤刻律于背，凡七行，末行最短，只四字：「律高于人。」刻毕，命移至阶前，使入殿者皆得见之。有执事请加帷帐，曰：「此座太素。」申鹤曰：「素则人敢近。」执事曰：「坐者不称王，何以服众。」申鹤曰：「不服者可不坐，吾不患无人坐，患无人敢看。」"
 SHP_PW_The_Frost_Host:"袖口白线认人"
 SHP_PW_The_Frost_Host_desc:"霜军无旗，惟袖口一线白，广半寸，洗之不去。检阅之日，列于雪原，凡千二百人。申鹤循行一周，不发一言，还立台上，曰：「此军之律二条。」众皆侧耳。曰：「出剑之前，先定其心；收剑之后，净其地上。」言毕下台。行列寂然，呼吸相合，风过时惟闻衣角之声，不闻甲响。"
 SHP_PW_Cull_the_Frail:"清伍不扰一人"
 SHP_PW_Cull_the_Frail_desc:"汰弱之令再下，行伍之中，体弱者、心浮者、累及同伍者，一一清出，各给三日之粮、一纸凭据，凭据上书其在伍之日。有被清者立营门外，久不去，守者问之，曰：「吾欲再看一次操。」守者许之，其人立雪中看毕，乃下山。申鹤闻之，曰：「此辈不闹，反可惧。」执事问故。曰：「闹者有声，可防；不闹者无声。」"
 SHP_PW_Demon_Hunters:"幼魔残骸发抖"
 SHP_PW_Demon_Hunters_desc:"猎队归，献一物于阶下：幼魔之骸，长不过二尺，肋骨十二，细如箸。猎者曰：「此物临死而抖，抖至骨节相击，有声。」众围视之，或言当焚，或言当弃。申鹤俯身，以指按其肋，良久，曰：「其抖之状，亦记之。」执笔者在侧，问：「记于何册。」申鹤曰：「记于魔录末页，另注一行，此物未害人。」"
 SHP_PW_Cloud_Passes_Rebuilt:"云关重筑先凿井"
 SHP_PW_Cloud_Passes_Rebuilt_desc:"云关重筑，图纸上多一行小字：「关内须凿井，须储粮。」有将领不解，问曰：「关者，所以挡兵，何必及此。」申鹤曰：「一座挡风之关，先须使守关者活过一冬。」语竟，取笔书之于令，字极平正，无一笔加粗。自此凡关隘兴造，井与仓皆列于图首，无人敢删。后有一吏欲省其工，为上所驳，驳语只四字：「此申鹤令。」"
 SHP_PW_Half_Immortal_Auxilia:"绝云初编半仙军"
 SHP_PW_Half_Immortal_Auxilia_desc:"绝云间始编非纯血者入军，号半仙辅军。此辈不修大道，日惟习一事：于最险处为身后之人多撑一刻。检阅之日，列于雪坡之下，风急，旗不能展。一老兵出列，语众曰：「他日若有人记得吾辈，请记得吾辈是人，非谁挑剩之人。」语终归列，无一人应，亦无一人笑。"
 SHP_PW_Snow_Legion:"戍卒轮戍不久留"
 SHP_PW_Snow_Legion_desc:"雪原之军屯于最高数处隘口，风雪终岁不歇。申鹤定轮换之期极短，饷则加倍，曰：「于雪中熬人者，不可使之久熬。」主粮者问其故。答曰：「吾所要者，是一支尚记得天光何等模样之军，非一支惯于黑暗之军。」令下之后，每月有车自隘口载兵而下。兵下车，先眯眼，良久方能视物。"
 SHP_PW_The_Snow_Synod:"雪台开门议三日"
 SHP_PW_The_Snow_Synod_desc:"璃月既定，往后何往，无一人能言其详。申鹤命开雪台之门三日，不问出身，皆可登台陈说。三日之内，台上争者相接，台下听者不散。至第三日暮，案上纸积半人高，争论犹未止。左右请其裁断，申鹤视纸堆良久，曰：「吵不完最好。」众问其故，曰：「吵完之日，即无人敢开口之日。」"
 SHP_PW_Nation_of_Adepti:"仙权压过尘世律"
 SHP_PW_Nation_of_Adepti_desc:"万仙之国之说，以修行为国本，仙权居尘世律令之上。议者多言不可，曰：「如此则寒凡人之心。」申鹤答曰：「心寒可再暖，骨散则不可复拼。」语罢，取印按之，纸角为指所压，留一浅褶。是日散议最晚，堂中灯尽三盏，无一人先起。后此褶犹在卷上，司书者不敢熨平。"
 SHP_PW_The_Ascetic_State:"举国修真设道席"
 SHP_PW_The_Ascetic_State_desc:"举国修真之令行，学塾兼授丹方，衙门亦设道席。申鹤不立官学正统，惟于每处讲坛钉一木牌，牌上刻八字：「说得通即听，说不通则散。」有老儒问曰：「如此则何者为正学。」答曰：「人肯来听者，即是正学。」老儒默然，退而自钉一牌于其门，字稍偏，日日抚之使正。"
 SHP_PW_Purge_the_Mortal_Ties:"断尘令下闭山门"
 SHP_PW_Purge_the_Mortal_Ties_desc:"断尘之令既下，入道者须与家世一刀两断。令出三日，有关外老父跪于雪中，求见其子一面。守关者不敢启，以闻。申鹤立关墙上望之良久，命人以车粮一乘送至关外，门则不开。左右问其故，曰：「吾可救其饥，不可使彼习于跪于他人关前。」老父受粮，再拜而去，雪上留两膝之印。"
 SHP_PW_The_Ladder:"登仙阶上少年哭"
 SHP_PW_The_Ladder_desc:"登仙之阶凡九层，层层设卡，能至其巅者寥寥。有一少年行至第五层，力尽不能再上，坐于石阶而哭，声不甚大。守阶老修士取酒一壶，坐其侧，曰：「上不去者，吾见之一世矣。此辈后多下山，亦皆活得好。」路断则斜行，斜行者亦路也。少年饮半壶，拭面而起，遂下。"
 SHP_PW_The_Frost_Court_PW:"玄霜立廷刻冰律"
 SHP_PW_The_Frost_Court_PW_desc:"玄霜新廷既立，绝云间始有朝廷之形。修士按品阶而立，律条刻于冰壁，字为寒气所固，经岁不消。第一次开廷，殿中冷极，回声亦清。申鹤高居上座，视此近于完满之殿，久无一言。散后语一近侍曰：「最像仙境之处，往往最不像人间。」近侍不敢应，惟闻殿外风声。"
 SHP_PW_Silence_Below:"万籁俱寂山巅语"
 SHP_PW_Silence_Below_desc:"律令既推至极处，山下之城亦比别处安静。街无叫卖，巷无犬吠，惟闻巡者靴声。申鹤独登绝云间最高处，四望无人，忽对空谷曰：「帝君，吾将此山守成一口井矣。」井中无风浪，亦无活水。言至此，止而不续。风过雪面，痕迹旋灭，山巅终无一答。"
 SHP_PW_The_Immortal_Capital:"仙都落成不设宴"
 SHP_PW_The_Immortal_Capital_desc:"仙都落成之日，全城不设庆典，不鸣钟鼓，惟以律条拓印分送各家，一户一纸。来贺之各山修士列于阶下，申鹤语之曰：「此处不名京城，名仙都。」居此者，第一事守律，第二事方是吃饭。语讫，众皆肃立，无一人先动。日暮风起，满城纸声，如落叶。"
 SHP_PW_The_Eternal_Snow_PW:"剑插峰顶誓不化"
 SHP_PW_The_Eternal_Snow_PW_desc:"万载不化四字，申鹤亲手落印。是日大雪，独上峰顶，拔本命之剑，插入积雪三尺，曰：「雪会化，人会散，惟立于此地之规矩，吾要其一千年不化。」言竟下山，不回一顾。多年之后有人寻访至此，见剑痕犹新，积雪如故，而当时立誓之人，已无人能举其名。"
 SHP_PW_Rule_of_the_Half_Immortals:"半仙为骨撑此山"
 SHP_PW_Rule_of_the_Half_Immortals_desc:"半仙之治，以半仙与人族共居肱骨之位。有问曰：「纯仙既少，凡人既弱，何取于半仙。」申鹤曰：「能自两头各懂一分者，方是撑得此山之骨。又有人问：不怕半仙离心乎。」申鹤曰：「怕。然吾更须其立着。」问者默然，退而书此语于册，末注一行：「此言不留余地。」"
 SHP_PW_The_Mortal_Council:"铁匠当堂问老仙"
 SHP_PW_The_Mortal_Council_desc:"人族议政之始，凡人得入绝云间议事之地。第一场会，一铁匠起而质问一老仙，声不高，而字字可闻。满堂寂然，老仙亦一时不能对，惟以指叩案。申鹤坐最后之列，始终未出一言。散后独留，取是日记录抄一份，纳于最厚一柜，锁之。司柜者问何以留此，曰：「留与后人看。」"
 SHP_PW_The_Half_Blood_Host:"夹在两头即本事"
 SHP_PW_The_Half_Blood_Host_desc:"半仙为骨之令，以半仙编为军中最劲之数支。此辈识得咒法，亦识得巷陌曲折。检阅之日，申鹤语领队曰：「尔曹比仙更懂人，比人更懂仙，此夹在两头之苦，往后即是尔曹之本事。」领队行一礼，未答。队伍过台，靴声齐整，行列中有一二人目微红，亦不出声。"
 SHP_PW_The_Empire_of_Snow:"雪原帝业出山门"
 SHP_PW_The_Empire_of_Snow_desc:"雪原帝业，将绝云间之目自一山推及全璃月，再推及凡有魔物之处。有旧人谏曰：「守好此山足矣。」申鹤曰：「吾下山之后方知，山下每一处人间，皆是此山之延伸。彼若尽灭，此山亦不足以为山。」谏者不能对。自此雪台文书所至，远过峰顶之雪线。"
 SHP_PW_March_on_the_Coast:"临海用兵先戒杀"
 SHP_PW_March_on_the_Coast_desc:"临海用兵之令，下于夜半。申鹤立地图之前，至天明未移一步。翼日，于令尾亲添四字：「勿伤百姓。」送令者接书，觉其手比送常文时为慢。四字既出，军中相沿，遂成一条不著于册之老规矩：凡入村镇，先收刀，后问路。有老兵语其徒曰：「此四字，比军法重。」"
 SHP_PW_The_Blood_Tithe:"血税一册记丁口"
 SHP_PW_The_Blood_Tithe_desc:"血税之制，以凡人丁口与半仙血脉并计入国用。申鹤不以为耻，直言于众曰：「云端之清净，非自天坠。」欲借一山以挡乱世风雨，则须先为此山供足血与粮。账房闻之，不辩，取新册一页，添于旧册之下，笔极工。是夜灯下核数，至三更，墨尽一锭。"
 SHP_PW_The_Imperial_Peak:"帝峰名挂最高脊"
 SHP_PW_The_Imperial_Peak_desc:"帝峰之名初挂于绝云间最高之脊，无鼓乐，无人欢呼。工匠以铁钉三枚钉其额，钉至第三枚，锤声在山谷间回两次。申鹤立于峰顶，视脚下此片以雪与血换来之地，忽忆初下山时所言。未回头，惟将披风裹紧一分，立于风止之处，至暮乃下。"
 SHP_PW_The_Half_Immortal_Emperor:"四字刻上仙都城"
 SHP_PW_The_Half_Immortal_Emperor_desc:"半仙天帝四字刻上仙都城头之日，申鹤立城门下良久。石屑落于肩，不为动。左右请其登城视之，不许。乃语身旁人曰：「吾此生大约只成一事，使此山不必再看他人脸色。」言已，转身入那座无神位之殿，门于身后合，声甚轻。守门者后语人：那日殿中，一夜无灯。"
 SHP_PW_The_Half_Blood_Burden_PW:"自问亦在判己身"
 SHP_PW_The_Half_Blood_Burden_PW_desc:"夜深人静，申鹤偶忆断尘令下被清出山门之诸面孔，亦忆己身所流两重之血。尝独坐至天明，问一终无答案之问：「吾判彼之日，是否亦在判某一刻之吾。」烛将尽，火苗低伏，以剪去其烬，火复明。窗外雪落无声，山门方向有灯一点，终夜未熄。"
 SHP_PW_The_North_Blade_PW:"北国赠剑悬山门"
 SHP_PW_The_North_Blade_PW_desc:"至冬遣使赠剑一柄，锋极利，鞘上霜纹如活。申鹤受之，然自是不拔。命悬于山门之另一侧，与本命之剑遥遥相对。有不解者问：「既为敌国所赠，何不熔之。」曰：「留此一柄，使出入山门者日日记得，世上尚有另一条路，安静等着人择。」问者视剑良久，不觉以手按己腰。"
 SHP_PW_Liyue_Under_Snow:"雪覆璃月一人行"
 SHP_PW_Liyue_Under_Snow_desc:"雪覆璃月。战后最后一片废墟清毕之日，申鹤独行全城，不使人从。至码头，见栈桥新木犹带树脂之气；至学塾，闻童子读书之声；终至那座无神位之殿，立于门槛外，不入。一路所见，皆记于册。册末书曰：「此即吾辈所换之物，好与不好，皆由吾辈自担。」"
 SHP_PW_The_New_Law_Code:"新律首书护生句"
 SHP_PW_The_New_Law_Code_desc:"绝云新律，合三年之敕令、判例、军规为一书。申鹤亲书其首篇，只一句：「绝云之律，护生，不护人。」书毕搁笔，久不能言。司律者问其故，曰：「难者在后。此后连吾自身，亦须先低头认之。」司律者退，将稿置于案首，未曾压以镇纸，任其边角自卷。"
 SHP_PW_The_Empty_Chair:"三张空椅留殿深"
 SHP_PW_The_Empty_Chair_desc:"仙殿最深处，常留空椅三张，不设座签，不使人坐。有谏者曰：「此殿既成，留空椅何用，宜收之。」申鹤不答，久之乃曰：「留着，为使每一坐此位者，进门先看一眼，自问坐得是否太稳。自此议事，众皆绕椅而行，无一人敢直视。」椅面落灰，亦无人拂。"

 SHP_postwar_category:"绝云新律"
 SHP_postwar_category_desc:"秩序重整之后，孤辰乃清残余、抚山野、安仙家旧部，务求璃月回稳。旧账算清，新局方好开头；积怨不清，风波迟早再起。故凡旧案，不问轻重，皆先立册；凡旧人，不问亲疏，皆先给一职。此孤辰一脉之准则。"
 SHP_decision_pw_mountain_patrol:"踏雪巡山"
 SHP_decision_pw_mountain_patrol_desc:"巡山者，以脚步量遍每一道可渗魔气之山隙。雪落，盖住痕迹，亦盖住凶险，故巡山之人一世在与雪抢时。有少年问：「抢得过乎。」老巡者曰：「抢不过。然今日多走一里，山下便少一夜哭声。」巡山者夜宿于明冠峡哨屋，屋无门，风雪入之，积于墙角。"
 SHP_decision_pw_frost_ration:"推粮下山"
 SHP_decision_pw_frost_ration_desc:"绝云间自留余粮无多，粮车一车一车往山下推。或问：「山亦要守，何不留之。」申鹤曰：「山要人守，先须使人活。」山中所与，皆无形之账，日后自别处收还。"
 SHP_decision_pw_purge_roll:"清厘名册"
 SHP_decision_pw_purge_roll_desc:"名册上之名，有真犯忌者，亦有恰在那一年说错半句者。清厘名册之人，往往比被清厘者更不安。盖彼等最清楚：此尺早晚亦量及自身。尺在手时，无人思其长短；及尺落己颈，方知昔年落笔太重。尺为木制，刻度浅，藏于奥藏山案上，旁置一册。"
 SHP_decision_pw_summon_adepti:"遍帖诸山"
 SHP_decision_pw_summon_adepti_desc:"请帖一封一封送上各山洞府，措辞客气，底线分明：来，则同守此山；不来，则此后山门之事与君无涉。有仙接帖而笑曰：「此帖写得像军令。」申鹤曰：「本即军令，只多一层客气。」山洞府散于奥藏山诸峰，云来则隐，云去则见其檐一角。"
 SHP_decision_pw_bind_demon:"封而不杀"
 SHP_decision_pw_bind_demon_desc:"缚魔极耗心神：不杀，只封。盖有些物事，杀之则散，散则更烦。封魔之阵一代不如一代，非阵坏也，能安心坐满阵中之人，在少数。有弟子问：「坐不满奈何。」申鹤曰：「那便空着。宁空一座，不乱一座。」封魔之阵刻于绝云间石上，阵纹深寸许，雪落则先填其槽。"
 SHP_decision_pw_disciple_trial:"考功试炼"
 SHP_decision_pw_disciple_trial_desc:"考功不问出身，只问心性。有人于末关崩溃，有人却于那道关口上，头一回认得自己。申鹤曰：「吾考者，非其胜，乃其败后尚立不立得起来。」故所取者不必皆强，而皆须有可立之骨。末关在奥藏山后石壁前，壁面粗，字以凿成。"
 SHP_decision_pw_forge_frost:"守炉铸霜"
 SHP_decision_pw_forge_frost_desc:"霜铁难得，寒炉难守。铸霜之匠，往往为绝云间最沉默之辈。彼等守一炉不肯熄之冷火，所铸之物，却付与人拿去暖身、拿去活命。铁在彼手，暖在人身。匠不问所铸何用，只问炉温可守。"
 SHP_decision_pw_herb_garden:"开圃种药"
 SHP_decision_pw_herb_garden_desc:"绝云间药圃，种者皆凡人所用之寻常药材。或问：「仙家何须此。」申鹤曰：「仙若只顾炼丹求己身，与山上只顾自己之石头何异。」药种入土，数年方成，然总须有人先种。"
 SHP_decision_pw_envoy_keqing:"使者赴玉衡"
 SHP_decision_pw_envoy_keqing_desc:"使者归，只说一句：玉衡之灯，比想象中亮。申鹤默然良久，曰：「灯亮之处，影子亦最清楚。」遂备薄礼回赠刻晴，不为交好，只为不肯在礼数上输一后辈。薄礼自奥藏山出，至玉京台，礼单不书名，惟钤一印。"
 SHP_decision_pw_envoy_ningguang:"使者赴群玉阁"
 SHP_decision_pw_envoy_ningguang_desc:"群玉阁回信比使者到得还快，字里行间皆是算盘之气。申鹤看毕一笑，曰：「彼以天下一盘账，吾以天下一座一座量之。亦好：一个量钱，一个量山。」使者归，携回清单一份，精至一厘。"
 SHP_decision_pw_chasm_watch:"守夜添油"
 SHP_decision_pw_chasm_watch_desc:"层岩之裂缝，不因人之惧而稍窄，却因有人守之而暂眠一时。守夜者一代轮过一代，从无人见过其尽头，亦无人问尽头何在。问者已去，守者犹在。守者不问尽头，只问今日之灯可曾添油。"
 SHP_decision_pw_grand_edict:"亲写首条"
 SHP_decision_pw_grand_edict_desc:"三年之敕令、判例、军规，汇成一部律书，为执律者最重之差。申鹤亲书首篇，只一句：「绝云之律，护生，不护人。」书毕搁笔良久，曰：「最难者，自今而后，连吾亦须服之。」律书首篇刻于奥藏山门侧石上，字为阴刻，深可容指。"

 LYY_Event.11001.t:"旧城墙上立一时"
 LYY_Event.11001.d:"璃月重连之次日，申鹤自绝云间下山。山路积雪，行至港口，靴已湿。她在最旧之城墙上立一个时辰。城下人来往，有仰面者，有急趋者，有指而语者。她不登台，不设仪，只命执律者将第一道敕令贴满街巷。令文甚短：自今日起，璃月之规矩，由绝云间定。\n街上有人跪，有人骂，更多人只是不言。骂者声高，跪者声低，不言语者最多，塞满街衢而不动。\n申鹤俯视此一片沉默，久乃扬声曰：「汝辈不必信吾。先看吾如何做事。」言毕下墙。执令吏问：「此语入档乎。」申鹤曰：「入。」即为新政第一份公文。是夜敕令之纸为雨所湿，守令者欲揭换，有老者止之曰：「勿换。」湿者亦是令。守者遂不换，纸贴至干，边角卷起，字迹漫漶，而无人撕。城头风大，墙上积雪薄，靴印一行，自垛口至墙根。"
 LYY_Event.11001.a:"下山立秩序，护绝云亦护人间"
 LYY_Event.11001.b:"只守绝云间，不问山外事"
 LYY_Event.11002.t:"先清瓦砾后立旗"
 LYY_Event.11002.d:"内战之后，港城积一层薄雪。雪下是烧焦之梁木，与无人认领之骨。申鹤至，不使人先立旗，先使人清墟。执事请曰：「城已定，宜先张新政，以安人心。」申鹤曰：「人心不在纸上。」指足下瓦砾，曰：「在此。」\n她立于瓦砾堆上，见一少年搬石，石大，抱之而行，行数步一歇。申鹤下堆，至其前，曰：「清此处。」少年抬头。申鹤曰：「清干净。往后汝所走之每一步，脚下才非他人之名。」\n少年不语，复抱石，行。是日随之拾瓦砾者渐多，初十余人，暮时百余人。无人呼号，无人击鼓，惟铁锹碰石之声，一声接一声，比任何口号皆齐。\n有旧吏立于街角观之，久乃语其徒曰：「此辈不立旗而先清墟，吾看不懂。」徒曰：「看得懂。」旧吏问：「何意。」徒曰：「旗者，为上而张；墟者，为己而清。」旧吏默然，俯身，亦拾一砖。归离原清墟之人以筐运瓦砾，筐破则补，补处以麻绳缠之。"
 LYY_Event.11002.a:"清墟安民，先净城郭"
 LYY_Event.11002.b:"先立旗宣威，后清废墟"
 LYY_Event.11003.t:"粮车出山数到尾"
 LYY_Event.11003.d:"绝云间之粮不算多。山中修士日食一餐，余者入仓。仓中之数，执事掌之，岁有所增，亦有所耗。申鹤命拨三成下山。执事谏曰：「山中亦须备荒，若拨三成，恐不支。」申鹤曰：「留一手，是常法。然山中之人饿一餐，尚能修一日之道。」山下之人饿一餐，便有一户要散。\n执事不能对。粮车出山之日，凡二十辆，以牛牵之。申鹤立于队尾，不设案，不点名，惟数车。数至末辆转过山口，乃还。\n有村妇捧半袋之米，朝山方向叩首。巡者见之，欲扶，妇不起，曰：「非拜山，拜送粮之人。」巡者还报，申鹤闻之，曰：「此米非吾送。」巡者问：「谁送。」申鹤曰：「种米之人送。」是日山中晚饭减为半餐，无人问故。是夜仓吏报：「仓中余粮，可支至明春。」申鹤曰：「明春之后再议。」粮车以木制，轮包铁，行山道则颠，须以绳缚。"
 LYY_Event.11003.a:"放粮山下，先救其人"
 LYY_Event.11003.b:"囤粮山中，先固其本"
 LYY_Event.11004.t:"喘气者即占一行"
 LYY_Event.11004.d:"生民新册不论仙凡，只论活人。凡在册者，冬有炭，病有药，死于兵祸者入碑。有执律者问：「半仙算在内乎。」申鹤方阅册，闻言抬头，曰：「其尚在喘气，便该占一行。」执律者退，笔尖在册上顿一顿，乃落。\n册厚得惊人，一册不能尽，分为七卷。字却写得极齐整，行距如一，无一笔苟且。\n司册之书吏写至深夜。灯油将尽，火小，字影放大，投于壁。写到末页，忽止笔，取册起，自首行读之，一名字一名字读下，声低而缓，读至三更，读毕，乃合册，以手按其面，久不移。翼日申鹤取册验之，翻至某页，指一名曰：「此人不当在。」书吏视之，面色变。申鹤曰：「其死于去年，非今年。」书吏跪曰：「小人失察。」申鹤曰：「改。」书吏改讫。申鹤又曰：「然汝昨夜所读，读至其名乎。」书吏曰：「读至。」申鹤点头，还册，不复言。奥藏山册不论仙凡，只论活人，页边以朱线隔之。"
 LYY_Event.11004.a:"仙凡同册，一人一行"
 LYY_Event.11004.b:"只登仙籍，不问凡人"
 LYY_Event.11005.t:"关墙留一小门通"
 LYY_Event.11005.d:"云关断多年，关墙颓者半，门枢朽，风过则摇。申鹤下令重修，图依旧制，惟加一条旧图所无者：关墙须留一小门，专通百姓。匠人受图，指小门问曰：「此门开于侧，窄不过三尺，不通车马，何用。」申鹤曰：「关所挡者，刀也，非人也。」匠人曰：「既挡刀，留门则刀亦入。」申鹤曰：「刀入，自有人挡。」人不得入，则此关为谁而守。\n匠人不解，然不敢再问，退而作图。画至小门，改三次，皆不称意。夜坐灯下，忽悟，乃以小门画得比正门更细：门钉几枚，门槛几寸，皆有注。\n关成之日，众请申鹤验。她至，不行正门，径至小门，以手推之。门开，无声。乃点头。旁有老民问：「此门何名。」申鹤曰：「无名。」老民曰：「无名则吾辈自名之。」后此门，百姓呼为小民门。凡兵乱，此门先开。小门在关墙之下，门枢新换，开时无声。"
 LYY_Event.11005.a:"云关留门，通民以路"
 LYY_Event.11005.b:"关墙求固，不留隙口"
 LYY_Event.11006.t:"每月亲批两个字"
 LYY_Event.11006.d:"雪账所记，战后每一笔开支。自一车之炭，至一口之棺，皆入册。册分栏，栏有注，注有押。申鹤每月亲过一遍。过时闭门，不使人侍，惟留灯一盏。批注只两字：「该否。」该者，朱点；否者，朱圈。\n有官吏嫌其太细，趁进呈之际谏曰：「夫人总揽大政，何必亲校一车之炭。」申鹤不抬头，以册推之，曰：「汝看此页。」官吏视之，一车炭，注曰：「送至城南，户三十七。」申鹤曰：「此三十七户，今冬不冻，系于此一车。」官吏语塞。申鹤曰：「所花者，百姓以命换来之钱。」细一分，本分也。官吏退，面赤。\n自此各衙门之账册，字迹皆比从前工整。有书吏私下语人曰：「非惧责。」乃不敢使夫人于灯下，看吾辈之潦草。是年冬，雪账凡九册，最后一册末页，有申鹤批一行，字小于常：此册所省，可多买炭二百车。绝云间账册分栏，栏有注，注有押，押以朱，字小如蚁。"
 LYY_Event.11006.a:"月核雪账，细究其数"
 LYY_Event.11006.b:"委之执事，不必亲阅"
 LYY_Event.11007.t:"冷火一炉出铁器"
 LYY_Event.11007.d:"霜炉者，绝云间第一座官办工坊。所烧为冷火，火色青，不炙手，而出铁器与丹械。炉既立，申鹤命山中匠人带徒。头一批学徒二十人，中有山下孤儿七人，皆瘦，衣不合体。有老匠谏曰：「手艺传于外人，恐泄。」申鹤曰：「手艺留于山上，只会生苔。」传下去，才会长青。\n老匠不语，退而授徒。授第一课，不教打铁，教辨火。七孤儿中最幼者，日日守炉，以手试火色，试至手背起泡，不告人。\n头一年，炉只熄过两次。头一次熄于雨夜，众手忙乱，天亮方复。第二次熄于腊月，风倒灌。几个学徒不待人唤，连夜轮班守之，以己之衣塞风口，天亮前重又点起。申鹤闻之，亲至炉前，视其手，皆焦黑。乃曰：「此炉以后归汝辈。」学徒不敢应。申鹤曰：「吾不要汝辈守吾之炉，要汝辈守此火。」言毕取一炭，自投入炉，火腾，映其面，一时如少年。炉在绝云间北坳，以石砌，火色青，不炙手。"
 LYY_Event.11007.a:"霜炉传艺，广收学徒"
 LYY_Event.11007.b:"闭炉自守，秘不外传"
 LYY_Event.11008.t:"亲手推过第一车"
 LYY_Event.11008.d:"车道自山脚修至云关，凡三十七里，桥九座，隧二。第一条枕木，申鹤亲手放之。修路之民夫，半为内战投降之旧军。初至，低头，不与语，食则蹲于远处。监工者疑之，白于申鹤。申鹤曰：「勿疑。」命人先给靴，次给饭，后给工钱。\n数日后，申鹤至工地，召众而言曰：「路既成，汝辈之力气便长在此路上。他日此路行车，车过之响，即汝辈之声。」谁也抹不去。众抬头。有老兵忽曰：「吾辈昔为旧军，亦可留力于此乎。」申鹤曰：「路不问出身。」\n通车之日，第一车之轮，她亲手推过。车轮碾铁轨，声闷而长，惊起满山之鸟。众仰面看鸟，无一人欢呼。有民夫蹲于轨旁，以手抚轨面，抚至发烫。申鹤见之，不唤，立其侧，亦蹲，亦以手抚轨。二人不言，抚良久。是日归，申鹤掌上一道黑印，至夜未洗。车道自山脚至云关，桥九座，隧二，隧道以石券。"
 LYY_Event.11008.a:"车道通山，役及其众"
 LYY_Event.11008.b:"缓修工事，先固边防"
 LYY_Event.11009.t:"药先山下后山中"
 LYY_Event.11009.d:"药圃沿向阳之坡层层而开，凡十一层，层间以石垒之，远望如梯。所种多是寻常药材，凡人亦可用。申鹤定规：药先供山下，再供山中。有修士不服，曰：「吾辈炼丹，所耗甚巨，何以先给山下。」申鹤曰：「山外之人病倒，山里之丹炼给谁看。」修士不能答，退。\n管圃之老仆记得，那年秋药苗长得比谁都旺。申鹤来看过一回，不使人随，独入园中，蹲于苗前，蹲甚久，起时膝上有泥。老仆欲上前拂之，申鹤举手止之，自以手拍去。\n是年冬疫起于港口。山下求药者日至，圃中之药尽出，山中丹房断料三月。有执事请减山下之数，申鹤曰：「不减。」执事曰：「丹房断料，修士有怨。」申鹤曰：「使其怨。」取册，于圃规之下添一行小字：「凡疫起，山下先用，山中断料不惜。」添讫，以指按墨，墨未干，指上一点黑。奥藏山南坡向阳，土层薄，种药须背土上山，一筐一筐，负者腰皆弯。"
 LYY_Event.11009.a:"药先供山下，不拘仙凡"
 LYY_Event.11009.b:"药入山中，先炼己身"
 LYY_Event.11010.t:"一钱两面鹤与律"
 LYY_Event.11010.d:"霜钱者，新铸之通货。一面为鹤，一面为律条，钱郭厚，字口深。申鹤所要者，是钱上有字，使人花出去时，亦看得见规矩。有司请定钱重，申鹤曰：「重。」司曰：「重则民不便携。」申鹤曰：「钱轻，规矩便轻。」\n有商人试以旧钱易新钱，秤之，嫌沉，求减。申鹤曰：「不可。」商人曰：「市面不用，奈何。」申鹤曰：「不用者，先用半年。」半年之后，自有人用。商人退。\n第一批铸成之日，申鹤至炉边，不坐，立至天亮。工匠以盘盛钱，递至前。她取一枚，看正面，反面，又看钱郭，看毕，置诸盘，取次一枚。如此看尽一盘，凡三百枚，无一枚略过。铸钱之老匠人后语人曰：「那一夜，夫人未笑，亦未皱眉。」匠人问：「然则何状。」老匠曰：「如校兵。」是日霜钱入库，申鹤命留一枚，不入库，置于案上，压公文。此后凡批钱事，先视此钱。绝云间所铸之钱，郭厚，字口深，一面鹤，一面律条，字小可辨。"
 LYY_Event.11010.a:"铸霜钱，钱上有律"
 LYY_Event.11010.b:"仍用旧钱，不必更张"
 LYY_Event.11011.t:"仙凡同席学丹算"
 LYY_Event.11011.d:"仙学馆所收，是仙凡同席之学生。讲丹鼎，讲阵法，亦讲算学与水利。堂中座次不分仙凡，惟以齿序。开学之日，申鹤亲至。不设案，立于阶前，语众曰：「汝辈可以不信仙。」众静。申鹤曰：「却不可不懂账。」\n堂下有山下少年起立，问曰：「先生，半仙算仙乎。」堂中哗然。申鹤举手，众止。申鹤曰：「算不算，不打紧。」先把账算清。少年怔然，坐，取笔，书此语于手背。\n课后有教习问：「此语可入讲义乎。」申鹤曰：「不必入讲义。」教习曰：「然则少年书于手背，洗之则忘。」申鹤曰：「洗之则忘者，非真记。」真记者，洗不去。是年冬考，算学一科，前三名皆山下子弟。榜出，有仙家子弟不服，请复试。申鹤批曰：「可。」复试之日，亲自监之，命题三道，皆关于粮数、堤工、税则。榜复如故。申鹤于榜末批一行：「此榜无仙凡，只有算对算错。」奥藏山堂中座次以齿序，不分仙凡，案上置算筹与丹方。"
 LYY_Event.11011.a:"仙学同席，不问出身"
 LYY_Event.11011.b:"只收聪敏，免耗钱粮"
 LYY_Event.11012.t:"使节携账出海去"
 LYY_Event.11012.d:"内战之时，璃月几自提瓦特之图上消失。港口闭，商路绝，外人不知其存亡。申鹤所遣第一批使节，携二物：一为账册，一为口信。账册所记，是内战前后之出入、户口、田亩、兵数，一笔不隐。口信只一句：「绝云间之门开矣，规矩须先说清。」\n有人笑其姿态太硬，曰：「遣使宜先示好，何乃先呈账。」申鹤曰：「肯先亮账本者，方配谈信义。」笑者不能对。\n使节出海之日，码头上无送行之人。内战方息，商船未复，埠头空阔，惟余断缆数条。申鹤未至，只命人于灯塔上留一灯，通夜不熄。使节登舟，回望岸上，见灯一点，高而孤。有使者问领队曰：「此灯为吾辈设乎。」领队曰：「非也。」为归者设。使者曰：「若不归。」领队曰：「亦有灯。」遂不复言。舟出港，灯塔之光在船尾，渐小，终隐于夜。舟出海，灯塔在后，光渐小，终隐于夜。"
 LYY_Event.11012.a:"先出账本，后议往来"
 LYY_Event.11012.b:"厚礼开道，先结善缘"
 LYY_Event.11013.t:"同纸各划一条线"
 LYY_Event.11013.d:"刻晴之使者，携共和章程至。章程一册，凡六章，纸新，墨香未散。申鹤读之一夜。灯三易，茶再温，读至末章，天已微明。次日见使者，不问兵，不问税，只问一句：「汝辈之宪章，管不管仙。」\n使者对曰：「管。」申鹤视之，有顷，忽笑，曰：「那就好谈。」使者亦笑，然笑中有疑。\n二人数坐，议至日昃。始终未结盟，却于同一纸之上，各划一条线，皆曰此线不越。申鹤所划者，在仙凡之别；刻晴所划者，在政由民出。二线相交于一处，成一小角。散时，使者收纸，忽曰：「夫人比传闻中好打交道。」申鹤曰：「传闻如何说。」使者曰：「说夫人如雪，近之则寒。」申鹤曰：「汝今近之，寒乎。」使者曰：「不寒。」申鹤曰：「然则传闻误矣。」使者曰：「恐未误。」申鹤不问，送之至门。使者去后，她取纸复看那相交之一角，以指按其上，久不移。章程一册，凡六章，纸新，墨香未散，边角齐整，藏于奥藏山。"
 LYY_Event.11013.a:"与玉衡对章，各划其界"
 LYY_Event.11013.b:"拒其章程，各行其是"
 LYY_Event.11014.t:"一车霜铁附四字"
 LYY_Event.11014.d:"凝光之回信，处处皆算盘声。纸用厚笺，字小而密，行间留白，留白处皆可添数。申鹤阅毕，不复信，命人送霜铁一车，附言四字：「账后再说。」\n有执事问：「此四字何意。」申鹤曰：「她要算天下，吾要量山。算得清者归她，量得准者归吾。」如此，才谈得长久。执事曰：「若她算得比夫人量得准。」申鹤曰：「则吾让她算。」执事曰：「夫人肯让。」申鹤曰：「让者，非输。」让一算盘，得一座山。\n使者携霜铁回程，一路琢磨此四字。至群玉阁，呈铁与言。凝光取铁，以指叩之，声清。乃笑曰：「此人以铁代书。」左右问：「四字何解。」凝光曰：「她在说，账目可对，山不归账。」左右曰：「然则此约成乎。」凝光曰：「成一半。」另一半，须看谁家算盘先停。遂命人将霜铁铸为镇纸，置于案，压其账册。霜铁色青，敲之声清，铸为镇纸，置于案以压账册。"
 LYY_Event.11014.a:"以霜铁换账，各算各账"
 LYY_Event.11014.b:"结好群玉阁，以利相交"
 LYY_Event.11015.t:"月海亭使者问雪"
 LYY_Event.11015.d:"月海亭遣使上绝云间，凡使至，例先陈政务，次及军需，末乃叙寒温，亦不过一二语。甘雨独留使者半日，所问皆私语：「山中雪今年厚不厚，仙鹤还归不归，旧年崖畔那株老梅可曾开花。」使者不能答，唯取牍记之，字写得极慢，恐有遗落。\n比至绝云间，使者以甘雨所问者一一具陈，不增一语，亦不省一字。申鹤听毕，良久不言，指案上茶盏曰：「此盏冷了，换一盏来。」侍者换茶，她仍不语，目视窗外一片雪。及茶再冷，乃曰：「已许多年，无人如此问过我。」\n是日破例留使者饭。席间唯谈山中草木、旧年雪事、鹤之来去，终席无一语及政务。使者辞行，申鹤送至阶下，忽问：「仙鹤今岁可归。」使者曰：「归。」申鹤颔首，不复言，还入殿中。使者下山半里，回望山门，见一人犹立阶上，衣已尽白。使至山中，先陈政务，次及军需，末乃叙寒温一二语。"
 LYY_Event.11015.a:"回书月海亭，叙山中之雪"
 LYY_Event.11015.b:"以政务相复，不言私谊"
 LYY_Event.11016.t:"云来海使者求路"
 LYY_Event.11016.d:"云来海遣使赍盟书至，其言甚直：借一路与至冬，则铁不缺，兵不缺，粮亦不缺。使者出书，书凡三纸，条陈利害，字字皆算，连沿途几处驿站草料之数亦载于末，可谓无一处不用心。\n申鹤受书，不即答。取书折而复折，折至四叠，乃取笔批一行于纸背：路可以让，须我自让，不得由人推。使者问其故，曰：「被人推而让之路，迟早亦被人推而收之。」使者默然，援笔记之，笔尖在纸上顿了一顿，墨聚成一点。\n使者辞去，申鹤送至山口。风急，雪扑面。使者行十余步回望，见其人立雪中不动，肩上已积一层。\n归至云来海，以批语呈上，那位执行官读竟，久不发声，末乃曰：「此人可与言。」遂罢推路之议，别遣人持新书再来。新书之上，官印之外，多押一枚私记。盟书三纸，条陈利害，字大而疏，末押私记一枚。"
 LYY_Event.11016.a:"划路而守，寸土不让"
 LYY_Event.11016.b:"断然拒绝，闭境自守"
 LYY_Event.11017.t:"沉玉谷远寄谷种"
 LYY_Event.11017.d:"沉玉谷回书至，其状不类公文，箧轻而空，摇之无声。启之，唯一捧谷种，泥尚未干，附素纸一行：「雪化时，水会流到这里来。」字颇拙，非吏笔。\n申鹤取种，以指捻之，泥落案上，簌簌有声。命人种于药圃一角，曰：「不必择地，就种在那里。」众以为雪未消，地气未动，种必不生。是年春，雪水自崖上来，过石沟，过篱根，苗竟生，细密如针，青得近黑。申鹤蹲于畦前，看之甚久，侍者数唤，皆不答。及起身，随手拍去掌上泥，动作极轻，如恐惊之。\n照圃老仆在篱外看见，退语其徒曰：「此人数年在山中，未曾对一物如此。」徒问何如。老仆曰：「不曾见其拍去手上泥。」言毕自去担水，不复言。\n是秋，苗结实，穗小而不盈把。申鹤命取其半为种，余者留于畦中，不令人割。或问何故，曰：「留与鸟雀。」箧轻而易，摇之无声，启之惟一捧谷种，泥尚未干。"
 LYY_Event.11017.a:"收下谷种，种于药圃"
 LYY_Event.11017.b:"谢而不受，各安其土"
 LYY_Event.11018.t:"帝君神位既已空"
 LYY_Event.11018.d:"帝君神位既空，祷之不应，问之亦不答。天空岛之上，无一字下。众议纷然，或言当别立新主，或言当闭殿以待，或言此事非人所能议，惟当缄口。议至三日，无一成说。\n申鹤命人取椅三张，置诸殿中，一在左，一在右，一在阶下。众问其故，曰：「昔者璃月举一事，先观人颜色，而后敢动，久之遂忘自家能坐。今此三椅空而无主，正好教我等看清，自家坐得正不正。」言毕自据下座，不登中席。\n自是每有大议，三椅皆空。无一人坐，亦无一人敢移。洒扫者至椅前，辄放轻脚步，扫帚绕椅三寸而过。有小吏私记于册：「某年某月，椅上有尘，无人拂。」又记：有客误倚其一，满堂皆顾，客惭，移座于门侧。后有人请于椅背刻帝君旧号，以存其名。申鹤不许，曰：「刻则有人拜，拜则有人代之言。」绝云间殿中无香火，龛上积尘，供案一角为鼠所啮。"
 LYY_Event.11018.a:"三椅空置，自省其位"
 LYY_Event.11018.b:"请人入座，另立共主"
 LYY_Event.11019.t:"历朝神谕汇一册"
 LYY_Event.11019.d:"申鹤命执律者取历年神谕、天象、谶纬之属，汇为一册，逐条注其真伪，可疑者别纸记之，另系于条下，不许删抹。\n执律者初以为易，及查至第三卷，手渐迟。有天象一条，昔年举国以为祥，今按其度数，乃寻常星次；有谶语一条，传之百年，实出市人歌谣，歌者早已无名。查者愈深，愈不敢下笔，尝中夜叩门请见，曰：「若尽书之，恐人心摇。」申鹤曰：「人心本已摇，吾所书者，摇之由也。」查者退，自此不复问。\n书成，申鹤亲题数语于册尾：留此一册，非为定论，为使后人自具眼目，不必更待他人代之言。册置学馆当门架上，不加封，不禁借。数年之后，其纸翻烂，较诸经籍尤旧，而借者不绝。馆吏于册前设一案，案上置笔，借者有所见，许注于纸边。奥藏山可疑者别纸记之，另系于条下，不许删抹，纸角外露。"
 LYY_Event.11019.a:"整理典籍，留册后人"
 LYY_Event.11019.b:"焚毁旧典，重立新说"
 LYY_Event.11020.t:"绝云间初编半仙军"
 LYY_Event.11020.d:"绝云间初编半仙为一军。此前非纯血者不入正籍，居山既久而无名，山中有事则役之，山中有功则略之，问其姓，多不自举。乃别立一营，不课大道，不试符箓，唯学一事：临最险之处，为身后之人多支一刻。\n检阅之日，雪未止。军列坡下，甲薄而整，无一人动。一老兵自队中出，行至阶前，曰：「愿有一请。」申鹤曰：「言。」老兵曰：「他日若有人记得吾辈，愿记得吾辈亦人，非他人挑剩者。」阶上无声，雪落可闻。申鹤略一停，曰：「准。」\n自此此军改名守山人。旗上不绘兽，不绘云，只绘一杖。营中人自谓：「杖者，撑也，撑至人过，便弃之。」山下有儒生见其旗，问此何物。一卒答曰：「我等之旗。」儒生欲再问，卒已入列，不复言。儒生退三步，向旗一揖，亦不问其名。半仙居山既久而无名，山中有事则役之，有功则略之。"
 LYY_Event.11020.a:"编半仙辅军，共守山门"
 LYY_Event.11020.b:"仙家独立，不杂凡血"
 LYY_Event.11021.t:"巨渊裂缝又封一重"
 LYY_Event.11021.d:"巨渊之裂，岁岁须封，封而复裂。是岁用新铸之合金，佐以新法，铁水灌入石缝，凝而成青，敲之有声，其音清而不散，匠人以为吉。\n封至末段，申鹤自井口缘索而下，从者止之，不听。井下无风，唯闻水声在深处，迟迟不绝，如有人在极远处推磨。闸门落下时，铁与石相击，声闷而长，尘从四壁落下，落于众人肩上，无人拂去。申鹤立于门侧，仰首看那门合至无缝，乃曰：「深渊者，按月索债者也。今日多还一分，明日之人，便少赌一次命。」\n井口工匠闻之，一时皆直腰，向那落定之门而立，久久不动。有人手中尚握锤，锤上铁屑已冷。是夜井口灯火不灭，无人下令，亦无人先归。守夜者名册上，多了二十七个自署之名，其字多歪斜，盖就膝上书者。天衡山铁水灌入石缝，青烟自缝出，工人以湿布掩面。"
 LYY_Event.11021.a:"铸新闸，亲下井口"
 LYY_Event.11021.b:"循旧法，勉力维持"
 LYY_Event.11022.t:"裂境巢穴次第焚"
 LYY_Event.11022.d:"绝云间用兵，多守而少攻。讨裂境之举，为数十年来仅有。修士结队而下，入幽暗之地，循水道，循骨径，一处处捣其巢，火起则退，火熄复入，如是者四十余日。\n归者不带战利，不带首级，唯带图。图以炭笔画于粗布，上标火口、断桥、可行之径，其墨多为汗所浸。一队归时，出者四十人，还者二十余。领队左手已断，以布缠之，右手犹紧攥其图，指节发白，人劝之释，不应。\n申鹤受图，不问伤亡，不问名姓，展图于案，指其未画处曰：「尚燃者几处。」领队曰：「三处。」申鹤卷图，曰：「则再去三次。」领队应诺而退，至门，以断腕抵额，行一礼，众皆从之。是夜炉火不熄，图上三处，以朱点之，朱色极重。次日点兵，缺额未补，营中空位，一如其数，无人愿补。循水道，循骨径，一处处捣其巢，焚其积，不守。"
 LYY_Event.11022.a:"深入裂隙，捣其巢穴"
 LYY_Event.11022.b:"虚张声势，以逼其退"
 LYY_Event.11023.t:"殿上初出替天字"
 LYY_Event.11023.d:"议毕，众将起，申鹤忽止之，曰：「尚有一言。」殿中复坐，灯焰不动，无人咳。\n申鹤立而言曰：「替天。」二字出口，声不甚高，而满殿皆闻。少顷，乃续曰：「天理若在，请其出而言；若终不出声，则那张椅子空着，总要有人坐上去，把序立住。不然者，山自守，城自守，终有一日各自散去。」\n语毕，殿中无一人接声。炉中炭爆一声，众皆侧目。殿外雪落极静，一夜之间，石阶尽白。晨起扫者扫至阶半即止，曰：「留此一段，好看。」有执律者后日与人言：「那一夜，我第一次觉此山高于我所想，亦冷于我所想。」言时犹举手向火，火已将尽，乃缩手入袖，不再言。\n众既退，一少年执律者追至廊下，问曰：「替天者，谁替之。」申鹤驻步，视其面良久，曰：「此问可留。」少年曰：「留之何用。」曰：「留之，则他日有人答。」少年退，归而书于册，册尾空半页不书，曰：「待答者。」绝云间殿中灯焰不动，无人咳，风自门隙入，帘微动。"
 LYY_Event.11023.a:"言明替天之意，坐那张空椅"
 LYY_Event.11023.b:"藏其锋芒，徐图后计"
 LYY_Event.11024.t:"汰弱令下清行伍"
 LYY_Event.11024.d:"汰弱之令下，其名尚宽，其行则冷。体不胜甲者，心易浮者，一试而累及同伍者，皆清出行伍，给三日粮，遣之下山，不留名于册。\n有将校以为太急，请宽之。申鹤曰：「一群自谓仁慈之人聚于一处，最先饿死者，偏是其中最不肯弃人之数人。」将校不能对。令行之日，无一人哗，无一人哭诉，清出者各束其装，默默下山，营门内外，唯闻履声，与甲叶相触之声。\n最后一人，瘸一足，旧伤在膝。行至阶前，申鹤自袖中取药一包与之。老兵受药，不问此药何名，亦不问何用，只以手按其膝，曰：「够走到山下。」遂去，不回顾。\n申鹤立阶上，看其行至坡转处，方回。是夜营中点名，少七人，呼者读到空处，声微一顿。同伍者应声替之，应毕，无人复言。奥藏山清出者给三日粮，遣之下山，下山之路惟一条，积雪未消。"
 LYY_Event.11024.a:"行汰弱令，精简行伍"
 LYY_Event.11024.b:"广纳丁壮，多多益善"
 LYY_Event.11025.t:"猎魔队初立猎单"
 LYY_Event.11025.d:"猎魔队者，绝云间唯一默许之杀伐也。山精、水怪、被侵蚀之兽，皆列于猎单，书其形、其处、其数，月计而消长，岁终汇为一册，呈于殿上。凡猎者归，先验其单，后验其获，单获不符者，问之。\n一猎手归，囊中无首级，唯幼魔残骸一具，骨白而脆，握之如枯枝。众问何故带此。猎手曰：「此物临死，一直在抖。」众问其状。曰：「手足皆抖，抖至不能合眼，眼中无水。」堂中无人笑，亦无人斥其迂。\n申鹤取骨，就灯下看之，以指摩其脊节，一节一节数过，良久不语。乃曰：「连其抖之状，也一并记下。记之非为怜之，为使吾辈杀至手熟之时，犹记所杀者何物。」执笔吏未即落笔，先以袖拭手，然后书。是夜猎单之下，多一行小字：「幼者，临死抖。」此条后不删，岁岁抄入新单，抄者不知其义，亦不敢省。猎单书其形、其处、其数，月计而消长，岁终合为一册。"
 LYY_Event.11025.a:"循魔气而猎，斩草除根"
 LYY_Event.11025.b:"只驱不杀，防护生灵"
 LYY_Event.11026.t:"云关重筑添二事"
 LYY_Event.11026.d:"云关重筑，匠人进图，凡三重：门、墙、墩，皆依旧式，尺寸不失。申鹤展图，指关内空地处曰：「此处添水井一，仓廪一。」匠人视图良久，不敢落笔。\n有将领不解，曰：「关所以拒敌，井与仓非战守之要，且占地，兵舍将无所置。」申鹤曰：「一座挡风之关，先要使守关之人活过一个冬天。」活不过冬，墙虽高，无人立其上。将领默然，退而改图，兵舍减其二，移于墩后。\n此二条入令，字写得极平，与他条无异。后有监工者欲省工料，削井之深，为巡关者所觉，罚俸半年，仍令重凿，凿至见泉乃止。数年之后，边关营造式样颁下，井与仓列于首二条。老匠人指图语其徒曰：「此二条，有人拿一冬之雪换来。」\n后来那口井，一直有水，冬天也不冻。水井在关内空地，掘三丈见水，水甘，冬不冻。"
 LYY_Event.11026.a:"关内储水存粮，务求可守"
 LYY_Event.11026.b:"只筑高墙，不问守卒"
 LYY_Event.11027.t:"雪原军团屯高隘"
 LYY_Event.11027.d:"雪原军团屯于最高数处隘口，去天近，去人远。其制与他军异者二：轮换期极短，饷给极足。名册上不书战功，唯书守隘几冬。\n或问其故。申鹤曰：「在雪里熬人者，不能使之熬太久。」又问：「饷何必如是之厚。」曰：「厚饷非买其命，是使其知命有价。其所欲得者，非习于黑暗之军，乃犹记天光作何状之军。故每至换防，下山者过隘门，多回顾；亦有回首之后，遂不复上者。」军中不问，亦不以为怯。\n一老卒守隘七冬，第八冬请再上，不许。老卒立于路口，望山半日，乃曰：「我认得那处风。」遂去。后有人于山下酒肆见之，问隘上事，皆答，不问则不言。酒至三巡，忽曰：「那处风，自左边来。」\n酒肆主人后来将那句话记在墙上，以炭书之。字迹粗，笔画错一处，亦无人更正。明冠峡隘口去天近，去人远，风自口入，终年不止。"
 LYY_Event.11027.a:"缩短轮换，厚待守卒"
 LYY_Event.11027.b:"延长戍期，节省粮饷"
 LYY_Event.11028.t:"兵器皆刻匠人名"
 LYY_Event.11028.d:"兵工自港口迁入山坳，去市远，去石近，炉火终年不熄。一岁之中，产量倍于旧时，而厂中人数不加。\n申鹤立一规：凡器出厂，必刻匠人之名于柄，不刻者不收。或言此为他日寻仇之柄，且器有损，责在匠人，恐无人肯作。申鹤曰：「有人认领之刀，才不随便出鞘。」众不能难。\n第一柄标名之枪，悬于厂门，经年不去，木柄渐黑泛光。其匠每日过门，必停一步，看之，然后入。有客问其看何物。匠曰：「看我名字。」客笑，匠不笑。后厂中自相较量，器有瑕疵者，其匠夜自取回重铸，不待官验。监工者欲禁之，申鹤不许，曰：「此即验也。」\n厂中至今留一规矩：器成之日，匠人须自喝一碗酒，不许人代。饮尽方许刻名。碗是粗碗，边有缺口，饮时须侧转。黑岩厂去市远，去石近，炉火终年不熄，烟自崖顶出。"
 LYY_Event.11028.a:"兵器皆刻工匠之名"
 LYY_Event.11028.b:"兵器只标官厂之号"
 LYY_Event.11029.t:"五方使者初同席"
 LYY_Event.11029.d:"五方使者初同席，坐次争执半日，终以齿序，不以强弱。案上置文书五份，纸色不一，印亦不一，有朱有墨，有一份仅以炭书，无印。\n申鹤不入主席，坐于末位，命人续茶，自听之。争论至日昃，有拍案者，有拂袖欲去者，申鹤皆不拦，亦不置一词。茶凡五续，水已淡薄，炉上壶鸣如细哨。\n散时，有一份文书为她所留。就灯下取笔，于末尾添小字一行：「五面旗，五条路，走得通否，看此一年。」写毕搁笔，看之良久，纳入袖中。后数月，此一行被她以墨涂去，涂之甚厚，纸几穿。执事问故，不答。此纸收于架底，与杂牍同置，无签。\n又有一次，那份文书被取出，摊于案上，涂墨处已干硬，无人再问。看一盏茶工夫，仍收起来，锁于架底。玉京台案上文书五份，纸色不一，印亦不一，有朱有墨。"
 LYY_Event.11029.a:"五方同席，各留一路"
 LYY_Event.11029.b:"择强而盟，速定大计"
 LYY_Event.11030.t:"雪台开门议三日"
 LYY_Event.11030.d:"璃月既定，四境粗安，而后当何往，无人能言其详。议者各执一说，争至声色俱厉，卒无成。或主守山，或主下山，或主闭户十年。\n申鹤命开雪台之门，三日不闭。凡登山者，不问其位，不问其籍，皆许登台言事；言者不限时刻，听者不许诘难，唯记其语。有樵者言毕，众问其何据，樵者曰：「无据，我只知柴价。」众大笑，而掌记者仍书之。\n三日之后，纸积几半人高，捆以麻绳，置于阶侧。争论未止，有两人自台上争至台下，立于雪中犹争。申鹤过而视之，曰：「吵不完，最好。」或问何谓。曰：「吵完，方是真无人敢开口。」那三夜，台上灯一直亮到天明。最后一夜，巡山者亦上来听，立于阶外，听至半宿，天明乃去，途中与人言：「听不懂，然愿再听。」\n捆纸麻绳，后为一小吏索去，拴在自家柴门上，用七年。明冠峡台在雪原高处以石垒，四面无遮，议事者裹毡而坐。"
 LYY_Event.11030.a:"开三日门，尽听其言"
 LYY_Event.11030.b:"择人而听，速定国是"
 LYY_Event.11031.t:"万仙之国定国本"
 LYY_Event.11031.d:"万仙之国者，以修身为国本，仙权居尘世律令之上。议者三日，凡十七变其稿，稿纸堆案，字行间多有涂改，改处朱墨交叠。\n反对者言：「如此则凡人寒心，寒心之众，不可用。」申鹤曰：「寒了心，犹可再暖；散了骨，便拼不回来。」众问何谓散骨。曰：「一国之人，各自求生，不问公事，此谓散骨。」问者默然，退而录其语，录至散骨二字，笔稍停。\n稿定，取印。印重，须两手。按下之时，纸角起一浅褶，众皆见之，无人言。此纸后藏于绝云间架中，褶处为人以石压平，压之三年，犹有痕。掌架者题其签曰：「第一件。」或问何以第一件。曰：「自此以后，纸上所言者，皆可行之事。」\n那纸后来被拓过两回，拓本分寄各山。第三回无人再拓，因人人都已记得那十七个字。稿纸堆案，涂改处朱墨相间，末稿只十七字。"
 LYY_Event.11031.a:"立万仙之国，仙权至上"
 LYY_Event.11031.b:"仙凡并处，各安其位"
 LYY_Event.11032.t:"断尘令下关不启"
 LYY_Event.11032.d:"断尘之令既颁，凡入道者，须与家世一刀两断，不得通问，不得归省，违者除籍。令下之日，山门内哭声数处，执事者皆佯不闻。\n未几，有关外跪者一人，膝下垫一破席，跪三日不去。问其所求，曰：「只求见吾儿一面，闻其一语，即归。」关吏以令示之，其人读竟，仍跪，唯以手抚席边。\n申鹤登关墙，倚垛口看之，自日中看至日昃，不发一言。暮时命人送粮一车至关下，门终不开。从者问故。曰：「我可以救他，不能教他学会跪在别人关前。此门一开，此后便有万人来跪。」送粮执事归报：「其人不肯受粮，只取干粮一包，置于关门口石上，转身去，行数步，回顾一次，不复顾。」次日石上粮在，人已不见。\n那块石头后来被人搬进关内，立在墙根下，无人题字。有兵卒夜里在石上坐，坐久了便起身走开。云关在山门，门以木为扉，扉上无钉，惟以横木闩之。"
 LYY_Event.11032.a:"行断尘令，绝其家世"
 LYY_Event.11032.b:"废断尘令，一体相容"
 LYY_Event.11033.t:"讲坛各钉一木牌"
 LYY_Event.11033.d:"举国修真，学塾亦讲丹方，衙门亦设道席。童子晨诵，先读律，次读经，末乃及其它。市上卖符者，亦挂牌于摊前。\n申鹤不立官学正统，亦不遣人巡讲坛，唯命匠人制木牌，广一尺，长二尺，钉于每处讲坛之侧，其文皆同：说得通，便听；说不通，便散。\n有老修士以为太纵，曰：「如此则异说并起，何以为一。」申鹤曰：「一个怕人议论之朝廷，早已无可议论之事。」老修士默然，退而视其牌，以手抚之，木未刨光，有刺。一塾师取纸拓其文，藏之书箱底，不示人。多年之后，其弟子又拓一份，悬于新塾梁上。拓时纸粗墨淡，字迹模糊，而人人识之。\n那木牌后来被人取下过一回，云欲刨光重刻，刨两下便停手，仍原样钉回去。钉处木色尚新，一道浅痕，如旧疤。绝云间牌钉于讲堂门侧，钉处木色尚新，一道浅痕如旧疤。"
 LYY_Event.11033.a:"举国修真，不禁异说"
 LYY_Event.11033.b:"定于一尊，罢黜杂议"
 LYY_Event.11034.t:"登仙阶上少年哭"
 LYY_Event.11034.d:"登仙之阶，凡九重，重设一卡，验其骨、其心、其志。能至顶者，一岁不过数人，守阶者记得其名。\n有少年行至第六重，坐于阶上，不起。守阶老修士问之，不答，惟以袖掩面，肩微动。老修士不劝，自腰间解壶，斟一盏与之，曰：「饮。」少年饮尽，呛而咳，咳毕又坐。\n老修士曰：「上不去者，吾见一世矣。其后来多下山，或耕，或贩，或为人师，皆活得安生。」阶凡九重，能至顶者一岁不过数人，余者亦须有处可去。路断于此，斜行亦是一路。少年问：「斜行，算不算败。」曰：「算。然败亦是一路。」少年复饮一盏，以手抹面，起身下阶。其步比来时稳。行数十级，忽回顾，向老修士一揖。老修士已闭目坐，壶在膝上，未收。\n那只壶后来留在阶上，第二日不见。守阶者没有去找。绝云间之阶凡九重，重设一卡，卡上有册，过者记名，退者亦记。"
 LYY_Event.11034.a:"设登仙之阶，明其路"
 LYY_Event.11034.b:"不设阶次，任其自修"
 LYY_Event.11035.t:"玄霜新廷初开殿"
 LYY_Event.11035.d:"玄霜新廷成，绝云间始有朝廷之状。修士按品阶而立，班次分明；律条刻于冰壁，字口如新，光可鉴人。阶前设磬一，击之，声传三里。\n开廷第一日，殿门启，寒气涌出，人未入而衣先动。殿中无火，无声，唯履声与玉磬。回声极清，一句出口，绕梁再返，字字不糊。有老修士立于末班，齿相击，犹不敢动。\n申鹤高居上座，俯视两班，久而不语。众以为将有训。她终不言，唯以指叩案三下，令议事。是日所议者，皆细务，无一语及山外。议毕，掌书记者呈廷议录，请署。申鹤署名于末，复取别纸，书一句，不附于录，自收之：最似仙境之处，往往最不似人间。纸折四叠，置袖中，归而焚之，灰埋于雪下。\n那灰，第二年春天化雪时，冲进了沟里。律条刻于冰壁，字口如新，光可鉴人，日下泛白。"
 LYY_Event.11035.a:"立玄霜新廷，正名分"
 LYY_Event.11035.b:"维持旧制，不设虚廷"
 LYY_Event.11036.t:"山巅独语无人听"
 LYY_Event.11036.d:"律令既密，行于山中，亦及山下之城。城门开闭有时，市集聚散有候，夜中不闻犬吠，亦不闻歌。有新至之吏，初闻此静，以为山中无居人。\n申鹤独上绝云间最高处。风息，雪住，四望皆白，无鸟，无灯，无一缕炊烟。立久，忽启口曰：「帝君。」少顷，续曰：「我把这座山守成一口井。」井里无风浪，亦无活水。可是井里干净。言毕自闻其声，散入雪中，无回应。\n她立至衣上积雪寸余，乃回。下山途中遇一守夜者，守夜者伏地行礼，她止之，问：「山中静否。」守夜者曰：「静。」她颔首，曰：「好。」行数步，又曰：「太静。」守夜者不解，执灯送至阶下，灯焰直上，不摇。\n守夜者回到哨上，把灯芯剪短了一些，坐下，听着风声，听了一夜。天亮时才睡。"
 LYY_Event.11036.a:"举世寂然，守此一山"
 LYY_Event.11036.b:"重开山门，听人间声"
 LYY_Event.11037.t:"仙都落成散律条"
 LYY_Event.11037.d:"仙都既成，城门新漆，街石未磨，行则有声。落成之日，不设宴，不作乐，不燃爆竹。\n所行者一事：取律条拓本，分送城中每一户，户一纸，不取钱。吏抱纸入巷，敲门，授之，受者不问何用，唯点头。有老妇不识字，请吏读之，吏读至第三行，妇曰：「够了，余者教吾孙读。」\n各山修士来贺，立阶下。申鹤出，谓众曰：「此处不名京城，名仙都。」居此者，先守律，次乃食饭。众肃立，无一人先动，风过旗而不响。有老修士归而语其徒曰：「新立之邦，不先示兵，先以一纸律条示人，可怪，亦可敬。」\n一少年修士年最少，退归舍中，取所领拓本，以饭粒贴于床头，贴之不正，复贴。同舍者笑之，他不答。此后迁舍三次，纸皆随行。那纸贴至第四次时已破一角，他以浆糊补之，补得不齐，亦算了。补丁横贴。璃月港城门新漆，街石未磨，行则有声，声在巷中回。"
 LYY_Event.11037.a:"众称仙都，律在食先"
 LYY_Event.11037.b:"仍称旧名，缓议其事"
 LYY_Event.11038.t:"半仙凡人并为骨"
 LYY_Event.11038.d:"半仙之治，举半仙与人族，置于肱骨之位。旧制以纯仙临下，凡人承命，半仙居其间而无位，至是皆易。山中之席，亦重排。旧日纯仙所据之三席，移其二与半仙，余一席虚之，以待后来者。\n或问曰：「纯仙不足以守山乎。」申鹤曰：「纯仙太少，凡人太弱。」能于两头皆懂一分者，方是撑得住此山之骨。又问：「不怕半仙离心。」曰：「怕。然我更需其站着。」\n此语出，半仙辈私相传抄。初抄于薄纸，字小而密；再抄则加注，注又加注，有注与正文相驳者，亦并存不删。抄本传至山下，纸边已磨毛，字有模糊处，读者以意补之，亦不甚争。有老半仙得一本，置枕下，寝时以手按其上。人问何故。曰：「怕人拿去。」\n那本抄本后来被翻烂了，他舍不得扔，用线重新缝过一遍。线色青，与纸色不配。奥藏山中之席亦易，半仙与凡人同列，坐次以齿序。"
 LYY_Event.11038.a:"以半仙为骨，人族为辅"
 LYY_Event.11038.b:"独尊纯仙，不假外族"
 LYY_Event.11039.t:"铁匠当堂诘老仙"
 LYY_Event.11039.d:"绝云间议事之地，自建山以来，未尝有凡人座位。人族议政之令既下，第一场会设于山门内旧殿。山风穿堂，烛火摇曳。仙家与匠户坐半日，各怀一腹之语，无一人肯先开口。\n忽有一人自末席立起，乃打铁匠户，手上犹带炉灰。其人抬眼直视上首一老仙，问曰：「敢问仙长，去岁层岩征丁三百，吾坊出二十七人，归者只九人。此十八人之名，可曾上过哪位仙长案头。」\n满堂寂然，无人应声。老仙握玉笏，指节发白，半晌只道：此事当查。\n申鹤坐于末排，自始至终未发一言。散会之后，却命人将当日记录誊一份，亲锁于最厚那口柜中。有幕僚不解，问其故。申鹤曰：「吾今日若开口，往后彼等出语，便皆要先看吾一眼。」此一眼，便将好不容易立起之物又看没了。旧殿在山门内，山风穿堂，烛火摇曳，影在壁上乱。"
 LYY_Event.11039.a:"人族议政，人人可言"
 LYY_Event.11039.b:"限定资格，取有识者"
 LYY_Event.11040.t:"临海夜半下军令"
 LYY_Event.11040.d:"临海既叛，军令当夜便发。中军帐内灯烛通明，舆图铺满一案。申鹤立于案前，自黄昏看到东方发白，未曾落座。帐外甲士换三班，无人敢言。\n主簿捧令待发，见她久不落笔，忍不住低声催一句。申鹤乃提笔，于令尾添四字：「勿伤百姓。」\n主簿愕然，曰：「兵者凶事，锋刃所向，岂能尽择。」申鹤曰：「择不得，亦要写。写在此处，彼等便知我所欲者何。」\n那一纸军令送出帐时，她递得比任何一份文书都慢。此后此四字竟成军中不成文之旧例，每逢开战，总有老兵于队前先念一遍。念者换了一代又一代，字一个亦未改。\n后有将校问：「四字既写，能约束几人。」申鹤曰：「约束不得几人，却能令动手者心里先顿一瞬。」一瞬，也许就少一具尸首，亦未可知。明冠峡中军帐内舆图铺满一案，图上以朱标隘口，墨标道路。"
 LYY_Event.11040.a:"临海用兵，勿伤百姓"
 LYY_Event.11040.b:"固守山界，不出一步"
 LYY_Event.11041.t:"编半仙为军中骨"
 LYY_Event.11041.d:"半仙为骨，乃申鹤手定之军制。凡山中有仙裔血脉而未列仙班者，尽编为军中锋锐，号为骨营。此辈上识咒法，下熟巷陌，走山路不喘，涉泥沼不陷，寻常甲士比之不及。\n点阅之日，风雪正紧。申鹤按剑自队前过，末了停于一领队之前，曰：「汝等比仙更懂人，比人更懂仙。这份夹于两头受气之苦，往后便为汝等本事。」\n领队抱拳行礼，未答一字。\n骨营后为诸军之最，死伤亦为诸军之最。三年之中，营中人马换七成，旗则始终未倒。军中私语：「骨营之旗，以骨撑之。」\n骨营之旗有符，符由领队亲绘。绘符之墨掺营中人之血，每添一人，便添一笔。此制不载军律，亦无人明言，惟历任领队交接之时，皆将那支画符之笔一并交过。\n那笔杆原有三道刻痕，三任领队各刻一道。天衡山骨营之人上识咒法，下熟巷战，营中不设旗，以哨为号。"
 LYY_Event.11041.a:"编半仙为骨，委以重任"
 LYY_Event.11041.b:"另择纯仙，不使杂血"
 LYY_Event.11042.t:"雪原帝业自此开"
 LYY_Event.11042.d:"雪原帝业四字，初只在一纸手书之中。其纸压于案头，本记绝云间一地之事。书至末页，笔锋忽转，将整个璃月尽写入内，连魔物盘踞、久无人问之荒村野戍，亦并算作山下疆土。\n有旧人劝曰：「守好绝云间一片雪原，已是天大功业，何必再向外伸手。」\n申鹤立于山脊，衣袖为风扯直，曰：「我下山之后方知，山下每一处人间，皆此山之延伸。彼若尽灭，我留此山，亦无意味。」\n其人默然而退。\n自此绝云间之目，自一山推及一国，又推及凡为魔物所侵之隅。凡炊烟断绝处，皆有山上令旗到过。\n是年冬，山下三村自请入籍。簿上只书村名，不书户口。申鹤曰：「先记着，往后再说。」\n那三村入籍之后，第一年未纳一粟。第二年山上来人丈地，村民方知此事已定。手书压于案头，纸已旧，边角起毛，字为申鹤亲笔。"
 LYY_Event.11042.a:"雪原帝业，普天之下"
 LYY_Event.11042.b:"收缩防线，只保绝云"
 LYY_Event.11043.t:"丁口血脉并入册"
 LYY_Event.11043.d:"血税之议一出，山中哗然。所谓血税，乃将凡人丁口与半仙血脉一并计入国用：凡户出丁，凡仙裔出脉，皆有定数，皆入官册。\n申鹤不以为耻，反以为常。有长老诘之曰：「仙凡之别，正在于此。今混而计之，与市井估牛马何异。」\n申鹤曰：「云端清净，从来非凭空落下。」要借一山挡住乱世风雨，便须先为这山供上足够血与粮。此语不中听，却是实情。\n长老无言，拂袖而去。\n账房奉命造册，添新纸一页。那一页数字比哪一页皆密，写者换过两回笔，墨亦研三遍。册成之日，无人设宴，无人称贺。此册锁于山库，非执律者不得启。\n后有人于册尾添小字一行：「此数非赋，乃债。」债终须还，只不知该还与谁。\n那册页角后被人翻得起了毛，凡启册者必翻至末页。绝云间册页边角为人翻得起了毛，凡启册者必翻至末页。"
 LYY_Event.11043.a:"行血税，计入国用"
 LYY_Event.11043.b:"缓其征调，以宽民力"
 LYY_Event.11044.t:"帝峰初挂山脊上"
 LYY_Event.11044.d:"帝峰之名，初挂上绝云间最高那道山脊之日，山下并无一声欢呼。石匠凿三日，将二字刻入崖壁，凿毕即收工具下山，未领赏钱。随行者问何不讨赏。石匠曰：「刻这等字，赏不起。」\n申鹤立于峰顶，脚下乃此片以雪与血换来之地。忽忆初下山时所言，其时尚未想过会走到这一步。\n风起，披风拍打有声。未回头，只将披风裹紧些，一直立到风停。\n下山时天色已黑。随行者借火光看清其面，却未问一字。此后凡有使节入山，皆须自峰下经过，行之至今，无一例外。\n峰下有一旧驿，自此改名帝峰驿。驿卒曰：「来往之人常在驿前下马，步行过峰。无人相约，却皆如此。」峰下石阶，至今无苔。\n崖壁二字后为风雨磨浅，守山者每岁遣人往看一回，浅则重凿。石匠凿三日，二字刻入崖壁，崖石色青，字口深寸许。"
 LYY_Event.11044.a:"立帝峰之名，昭示四方"
 LYY_Event.11044.b:"不言名号，行胜于言"
 LYY_Event.11045.t:"城头刻上半仙天帝"
 LYY_Event.11045.d:"半仙天帝四字刻上仙都城头之日，天未下雪，风却冷得割人。申鹤立于城门前良久，自辰时立至日中。来往之人自其侧过，无一人敢停步。\n有近臣请其讲几句应许之语，以安人心。申鹤摇首，只谓身侧人曰：「我此生所成，大约只一事。」使此山往后不必再看任何人之脸色。\n言毕，转身入那座无神位之殿。殿门于身后合上，声甚轻，如恐惊谁。\n城中无鼓乐，亦无贺表。惟有一阵风卷雪，自城头吹至城尾。后有人言，是日城头之字在日色中亮了一亮，随即又为云遮去。那云散得极慢，直至入夜方开。\n殿中无神像，只有空案一张。案上所供非香火，乃民籍一册。每逢朔望，有人来换新抄者，将旧册收入柜中。\n案角有墨一方，墨犹未干，研者不知何往。璃月港城门前立良久，往来之人自其侧过，无人抬头。"
 LYY_Event.11045.a:"即半仙天帝之位"
 LYY_Event.11045.b:"留一分退路，以备转圜"
 LYY_Event.11046.t:"雪覆璃月功成日"
 LYY_Event.11046.d:"雪覆璃月，乃战后第一冬。最后一片残垣清理净尽之日，申鹤独行全城，不携随从，亦不乘舆。\n先至码头，看人卸货；次至学塾，听童子读书；末至那座无神位之殿前，立半晌。一路所见，皆记于随身小册。\n归殿之后，于册末书曰：「此即吾辈换来之物。佳与不佳，皆由吾辈自担。」\n书罢，天已黑。城中灯火一盏一盏亮起，自东街亮至西街，又自城西水门一直亮到城外。\n乃合册，压于案角，未再看第二遍。案上另有一摞文书，乃明日所当批者。取最上一份，就灯而阅。\n批至一半，忽然停笔，问左右曰：「今年城中灯，较去年孰多。」左右答曰：「多。」颔首，不复问。灯下批文书，字迹极细，笔锋过纸有声。批毕，取册视之，仍置于案角，未再展开。先至璃月港码头，看人卸货，后至城西，看人砌墙。"
 LYY_Event.11046.a:"就此向前，尽记之"
 LYY_Event.11046.b:"停下脚步，清算所有"
 LYY_Event.11047.t:"绝云新律刊行日"
 LYY_Event.11047.d:"绝云新律，乃集三年敕令、判例、军规而成一部律书。书成之日，厚可盈尺，誊写者二十余人，凡四个月。\n申鹤亲书第一篇，只一句：「绝云之律，护生，不护人。」\n写罢搁笔，久无一言。左右问其故。申鹤曰：「所难者非书此一句。所难者，往后再有大事，我亦须先低下头，认这一条。」\n众皆默然。\n律书后拓无数份，发至每一里坊，亦发至每一守山营帐。有老卒不识字，请人念与听，闻护生不护人一句，怔半晌，曰：「此语，倒像为吾辈这班人所书。」念者亦未接话。\n有幕僚问：「律书既成，可须立碑。」申鹤曰：「不必。」碑会倒，书会传。又问：「书若烂。」曰：「烂于第几代，便由第几代重写一遍。」\n此书后存山库最内一格，格门无锁，只系麻绳一道。奥藏山书厚可盈尺，誊写者二十余人，凡四个月，纸用三种。"
 LYY_Event.11047.a:"颁新律，连我亦受其制"
 LYY_Event.11047.b:"暂缓立法，因人而断"
 LYY_Event.11048.t:"仙殿深处三空椅"
 LYY_Event.11048.d:"仙殿最深处，始终留空椅三张。椅皆旧制，无漆无饰，与殿中其余陈设全不相称。有人劝申鹤收之，腾地设案。她不应，亦不令人移。\n问其故。申鹤曰：「留此三椅，欲使每一个坐此位者，入门时先看一眼，看自己坐得是否太稳。」\n此后殿中议事，几乎无人敢直视三椅。连洒扫之人入门，脚步亦放轻，扫至椅前便绕过去，仿佛椅上有人。\n有一年新入殿执事不知旧规，径自坐其一，坐半刻。老吏见之，只低声说二个字：「起来。」执事起身之后，再未坐过。\n近椅之处，地砖磨损最深，乃人足久立所致。三椅之上无名。有人问当供谁。申鹤曰：「不供谁。」空而不名，比书其名更管用。此后殿中每逢大事，末了一条决议总要问一句：「可对得起那三张空椅。」玉京台三椅旧制，无漆无饰，与殿中陈设全不相称。"
 LYY_Event.11048.a:"留三张空椅，以自省"
 LYY_Event.11048.b:"收起空椅，另立共主"
 LYY_Event.11049.t:"仙座只称执律者"
 LYY_Event.11049.d:"仙座者，一张不称王之椅也。坐此位者称执律者，不称帝，不称君，亦不受百官朝拜。\n申鹤命匠人刻律条于椅背，所刻乃新律第一篇一句：「护生，不护人。」匠人刻至末笔，手抖，刻歪半寸。申鹤视之，曰：「不必改，歪着亦好。」\n又曰：「此椅非为坐者而设，乃为天下抬不起头者而设。」须使彼等知，世间尚有一物，高于其自身之苦。\n此后每决大事，必先于空椅前立片刻，方肯落座。或问立时想何事。不答。惟落座之后，语声总比平日低些。\n椅背刻字经年摩挲，边角已圆。一岁匠人请重刻，曰字迹浅矣。申鹤不许，曰：「浅着好。」磨得浅，可见坐者多；坐者多，可见此椅坐得住。\n匠人退下时回望一眼，见那歪处正对门口，凡入殿者抬头便见。玉京台椅背刻律条，刻工手颤，一字歪出格，歪处正对门口。"
 LYY_Event.11049.a:"设仙座，刻律于椅背"
 LYY_Event.11049.b:"不设虚座，各归其山"
 LYY_Event.11050.t:"璃月归一无字碑"
 LYY_Event.11050.d:"璃月归一之旗，升于所有城头，亦升于旧日曾挂别家旗之处。旗色新旧不一，风一吹，各响其声。\n申鹤不设凯宴，亦不受贺。惟于内战终处立无字碑一通。碑高一丈，正面打磨极平，一字未刻。\n或问：「功业既成，何以不刻。」\n申鹤曰：「刻满，后人便无处可写。」\n碑立彼处多年，风吹日晒，始终空着，却始终有人来，立片刻而去。有老妇于碑前烧纸，有兵卒于碑下埋断刀，亦有于碑背以炭书小字一行，隔夜为雨洗去。洗去便洗去，无人补书。\n碑成之后，申鹤再未往第二回。或问何不祭之。曰：「碑非为立者而设。」又问：「为谁。」答曰：「为往后尚想再打一仗者。」看毕，自拿主意。\n碑前石阶后被人踏出一道浅痕，居中，宽可容一足。\n有人于碑下拾得断刀半截，未敢取走，仍埋回原处。碑在璃月港正中，石面磨平，宽可容一足，无一字。"
 LYY_Event.11050.a:"刻无字碑，留给后人"
 LYY_Event.11050.b:"勒石记功，昭示千秋"
 LYY_Event.11051.t:"北国赠刃悬山门"
 LYY_Event.11051.d:"至冬送来好剑一柄。剑身狭长，锋口泛青，鞘上嵌北地寒玉。使者曰此剑名唤「霜信」，愿为两国通好之证。\n申鹤收之，却从未拔过。命人悬剑于山门另一侧，与本命剑遥遥相对，一南一北，中间隔一条上山石阶。\n有不解者问：「既为敌国所赠，留之何用。」\n申鹤曰：「留之，欲使每一进出山门者，日日记得，这世上尚有另一条路，安安静静等着被人选。」\n此剑于山门悬许多年。剑鞘落雪，雪化又冻，无人为它擦。守门老卒换过三任，交接时皆交代一句：「门上那把剑，别动。」莫问缘由。\n一岁至冬新使入山，见剑犹在，问老卒：此剑可曾出鞘。老卒曰：「不曾。」使者默然良久，曰：「那便是我等输了。」\n每岁雪化之时，剑鞘上即生薄霜一层，至午方消。藏于绝云间之剑，身狭长，锋口泛青，鞘上嵌寒玉，玉色如霜。"
 LYY_Event.11051.a:"悬北国之刃于山门"
 LYY_Event.11051.b:"毁其剑，绝其念"
 LYY_Event.11052.t:"层岩守望无尽头"
 LYY_Event.11052.d:"层岩之裂，不因人之畏而稍缩，却因有人守而暂安。守夜者一代轮过一代，无人见其尽头。\n一新至守夜人问执事：吾辈所守何事。\n执事曰：「守一物，并汝亦不当知。此即汝尚能生守此地之故。」\n新者不复问，只将火堆拨旺。\n守夜之制有定：一班八人。或问何须如此之多。管事曰：「一人居下听久，必以风声为脚步。」八人之中，常有一人醒。醒者出声，余者应声。\n名册后添一栏，记谁于哪一夜说过话。曾翻此册者言，栏中最多一名，凡十七次。\n其后名册封存，封条无印。执事曰：「守夜人之名，不必入官册。」封条贴三年，一岁漏水，湿其一角，字迹晕开。执事见之，不换封条，只将册子挪至高处。\n那名册至今仍置高处，无人再挪。一岁新执事欲看，老执事曰：「不必看。」看过者，夜里皆不能寐。守夜者一代轮过一代，名册上多自署之名，字多歪斜。"
 LYY_Event.11052.a:"守层岩深渊，世代不辍"
 LYY_Event.11052.b:"封锁消息，任其沉睡"
 LYY_Event.11053.t:"半仙身上两重血"
 LYY_Event.11053.d:"夜深人静，申鹤偶忆断尘令下被清出山门之面孔，亦忆己身流两重之血。\n独坐至天明，自问一桩终无解之事：我判彼等之日，是否亦在判某一刻之我。\n山中无回声。风过松梢，声如远潮。\n天亮时起身，山风扬其衣袖，露腕上一道极旧伤疤。乃少时亲手所划。疤已白，边缘磨平，抚之不像伤，倒像一道旧折痕。\n视半晌，放下衣袖，往后山练枪。\n此后每逢断尘令下，皆先独坐一夜。坐毕再判，判得比先前慢，亦比先前少。\n后山练枪处，青石上有一道浅痕，乃枪尖所点。年月既久，痕深半指。有新入门弟子问痕所自来。门中老人曰：「从前有一人，每日于此练一千下。」弟子问为谁。老人摇首不答。\n那名弟子后亦常至石上摩挲，摩挲毕即去练枪，不与人言。石在云关山门侧，石面为掌所摩，摩处色深，凹寸许。"
 LYY_Event.11053.a:"直面半仙之负，寻其解"
 LYY_Event.11053.b:"压下疑问，只论功业"
 LYY_Event.11054.t:"雪地里烧了盟书"
 LYY_Event.11054.d:"至冬执行官入山之日，带三十骑，皆着素甲，不入城，只驻马山门外。见申鹤，首语曰：「汝有剑，我有铁与钱。何不联手，将此乱世替天理一遍。」\n申鹤不答，命人取盟书，就雪地引火。火起甚慢，纸边一寸一寸焦黑，字迹先明后暗，末了只剩灰一堆，为风吹散于石阶。\n乃曰：「我之剑不替任何人挥。惟此山要它挥之处，方挥。」\n执行官视那堆灰，忽然笑曰：「汝乃我见过最难谈之敌。」\n申鹤曰：「多谢。请用茶。」\n那盏茶以山泉煮，苦甚。执行官饮尽，抱拳而去，再未提结盟之事。\n雪停之后，山门前灰被扫入石缝。次年开春，石缝中竟生细草数茎。老卒曰不必拔，留着。后凡有使节来，皆自那几茎草上踏过。\n那几茎草后为人踏平，来年又生。盟书焚于云关山门外，火小，烟直，灰不飞，落于雪上成一线。"
 LYY_Event.11054.a:"烧盟书，拒北来之剑"
 LYY_Event.11054.b:"接受盟约，结好至冬"
 LYY_Event.11055.t:"万仙来朝如潮水"
 LYY_Event.11055.d:"万仙来朝，乃绝云间最盛之时，亦最令人不安。四方修士举旗而来，山下义军成队而来，连几个心怀异志之旧敌，亦备贺礼，远远随于后。旗色杂沓，人声如沸，自山门一直排到半山。\n申鹤立于高台，望此一片人海，顾谓左右曰：「人聚愈众，愈似潮水。」潮水能载舟，亦能覆舟。我所欲者，自来非潮水，乃堤坝。\n言毕转身下台。身后欢呼一阵高过一阵，她一句亦未接。\n是夜山上设宴，她未赴，独在殿中阅民籍册子一摞，阅至末页，以朱笔于其中一页画一圈，书二字：「复查。」\n此一页册上，人名共十一。三月之后，十一人中黜四，赏三，余四留任。申鹤于留任四人名下各书一字：观。\n山中旧人后语人曰：「那一日台下万人欢呼，台上只一人低头看册。此即绝云间之主。」四方修士举旗而来，山下义军成队，旗色不一。"
 LYY_Event.11055.a:"以万仙为朝，早筑堤坝"
 LYY_Event.11055.b:"听其自然，各归其山"
 LYY_Event.11056.t:"新律颁行念到末句"
 LYY_Event.11056.d:"新律颁行之日，天晴无风。台下立各山修士，立半仙，亦立自内战中活下来、身上犹带伤者。有拄拐者，有袖中缠布者，无一人坐。\n申鹤登台，亲诵全文，自第一篇诵至末句。诵至执律者失律与庶民同罪一句，台下有人低声一咳，随即复静。\n诵毕，停一停，曰：「自今日起，我亦可为律条换下。」\n台下初极静，静到能闻山门之旗在风中翻。随即掌声起，初稀落，后连成一片。那掌声中有极陌生之物，非欢腾，乃终可放心之松弛。\n散场时，一老兵蹲于阶下，以手掩面，肩抖良久。\n后谓人曰：「我这条命，自今日起，有所归矣。」听者未应，只将头低下。\n台下有人以袖拭面，随即放下。此后无人言语，只依次退场。门开时，日已偏西。台下无人早退。奥藏山台下立各山修士、半仙与伤者，有拄拐者，有袖中缠布者。"
 LYY_Event.11056.a:"律在食先，我亦受之"
 LYY_Event.11056.b:"权柄暂握，待时还政"

 SHP_Spirit_Ascendant_Order:"仙朝初立律"
 SHP_Spirit_Ascendant_Order_desc:"仙朝既立，不设王号，惟设执律者。殿中旧有玉座，命匠人移之偏殿，空其正位。有老仙谏曰：「无座则无威。」主者曰：「威在律，不在座。」乃取律书置案上，凡议事，主者先立，众皆立，无一人坐。是日所议第一条：仙人犯律，与凡人同科。读毕，殿中寂然，久乃有应者。玉座移于奥藏山偏殿，殿中空出正位一方，砖色较新。"
 SHP_Spirit_Ascetic_Reform:"戒律出山门"
 SHP_Spirit_Ascetic_Reform_desc:"旧戒但行于山中，今推之全境。食有节，役有期，赏罚不问出身。初行之日，衙门钟点亦依之，卯时开，酉时闭，过时者不得入。有老吏惯于夜半批牍，至是掷笔曰：「牍不及期，奈何。」主者曰：「期在卯，不在夜。」老吏怒，三日不食。至第四日，晨钟未鸣，已立于门外。晨钟挂于奥藏山门楼，钟绳旧而滑，未及卯时已有人握之。"
 SHP_Spirit_Frost_Coin:"霜钱刻鹤律"
 SHP_Spirit_Frost_Coin_desc:"钱成，一面为鹤，一面为律。市人以钱买米，持之良久，谓此上有字而已不识。鬻米者指之，告以此条云短两者罚。市人乃言此后秤不敢轻。鬻米者笑谓钱既教汝，何须官教。是岁市中争秤者少，而钱之重者反为人所弃，以其不能磨也。执律者闻之，命勿改。钱范藏于绝云间铸房，范为铜，边有裂纹，以铁箍之。"
 SHP_Spirit_Peak_Arsenal:"一刃一匠名"
 SHP_Spirit_Peak_Arsenal_desc:"峰间兵器，成则刻匠名于柄末，小如豆。匠问器既出，与己何涉。监工答以器伤人，则问此刻。匠又谓伤人者手，非器。监工乃言：器不刻名，则人谓器自伤；器有名，则人知有造之者。匠默然，归而磨其器，磨至半夜。自是峰间废器渐少，而匠人之名，市上亦渐有人识。奥藏山峰间所出之器，柄末刻匠名如豆，磨平则令重刻。"
 SHP_Spirit_Five_Banners:"五使持节至"
 SHP_Spirit_Five_Banners_desc:"五方之使，各持一节，节以竹为之，长三尺，裹以青布。至绝云间，先立于门外，不问通否。守门者问：「来何事。」使曰：「持节而已。」守门者入报，久不出。使立雪中，自晨至暮，不移足。至第三日，门开，有一老修士出，取其一节，视之，曰：「竹也。」使曰：「然。」老修士曰：「竹亦可入。」"
 SHP_Spirit_Abyss_Ward:"岁输买渊静"
 SHP_Spirit_Abyss_Ward_desc:"巨渊之下有物，不可名。守者不谓之敌，谓之债。月输其额，如纳租然；岁计之，几当一军之饷。或请罢之，谓岁岁输此，何日而已。老守者答以此非输，乃买。问买何物。答以买井底三百人明日尚在。问者不能对。是夜渊口之灯次第而明，守者更番，无一灯先灭，亦无一人言。层岩渊口石阶九级，级面为足所磨，中有一道凹。"
 SHP_Spirit_Adepti_Throne:"不称王之座"
 SHP_Spirit_Adepti_Throne_desc:"殿中设一椅，不雕龙，不施金，椅背刻律十九条。坐之者不称王，称执律。属国使至，见其椅陋，问此亦王座乎。执律者答以此非王座，乃示众之器。使者问示众何事。答以示天下有高于坐者之物。使者视椅背之字，读至第七条，忽不语，退而再拜，拜毕乃言，此椅吾国亦当设一。椅在奥藏山正殿，椅背刻字十九，字深处可容指。"
 SHP_Spirit_Frost_Host:"霜军不用旗"
 SHP_Spirit_Frost_Host_desc:"霜军无旗，惟以袖口一道白线相认。行于市，人不知其为兵；战于野，敌不知其为主。其律二条：出剑之前，先定其心；收剑之后，先扫其地。有新人问：「既无旗，何以聚力。」老卒曰：「旗聚人于目，线聚人于心。」目所见者易散，心所记者在袖。新人视己袖，白线已磨去半，乃不复问。霜军行于奥藏山道，袖口白线为霜所褪，老兵以炭重描。"
 SHP_Spirit_Snow_Legion:"雪原屯隘口"
 SHP_Spirit_Snow_Legion_desc:"雪原之军，常屯于最高之隘。轮换期短，饷给甚厚，粮必先至而后兵至。将问此处最苦，何以不久屯。主者答以久屯者，目习于暗，足习于雪，归则不能视天光。将谓兵贵熟。主者曰：「熟于险者可，熟于暗者不可。」是岁换防三次，归者皆能辨星，无一人失道。雪原隘口在明冠峡北，隘上无屋，惟石垒一圈，可避风。"
 SHP_Spirit_Frost_Court_PW:"玄霜初有朝"
 SHP_Spirit_Frost_Court_PW_desc:"修士按品而立，自下而上，凡九阶。阶各有衣，衣各有色，远望如霜层。堂上不设香案，不悬神像，惟列律书十二函。朝会之时，执律者先读一函，读毕问曰：「有驳者否。」有则出班，无则退。初立之日，无人敢驳；三月之后，驳者渐多，而读律者不怒，反命录其言于册。十二函律书列于绝云间堂上，函以布裹，函角各系一签。"
 SHP_Spirit_Never_Melting_PW:"万载雪不消"
 SHP_Spirit_Never_Melting_PW_desc:"雪化，人散，惟山巅之规不消。或谓此规太严。主者答以严者可以久。谓者又言久而不化，则为患。主者不答，引之登岭，指雪下之石，谓此石在雪下千年，雪化则石见，石见则山崩。谓者视之，石上裂纹如网。主者曰：「规亦然，非不化，乃未至其时。」谓者默然而退。岭在奥藏山巅，雪终年不消，雪下之石裂纹如网。"
 SHP_Spirit_Imperial_Peak:"名挂最高脊"
 SHP_Spirit_Imperial_Peak_desc:"帝峰之名，挂于最高之脊，无鼓无乐，无人欢呼。山下有村，村人闻之，但曰：「又是一年。」老农指峰，谓此峰昔名某某，其祖呼之，其父呼之，今易矣。其孙问易则何损。老农答以无损。问何益。答以亦无益。孙又问然则易之何为。老农不能答，俯而锄地，锄至日暮。帝峰在奥藏山最高之脊，峰下村落十余户，屋以石垒。"
 SHP_Spirit_Half_Immortal_Emperor:"半仙不低头"
 SHP_Spirit_Half_Immortal_Emperor_desc:"半仙与人族，皆被抬至肱骨之地。其能镇尘缘，亦能驯雪山，然此二物，皆不肯真服。近侍问二者既从，何谓不服。主者答以从者畏也，服者信也。近侍问何以验之。主者曰：「试去其威，观其色。」是夜主者屏从独行于雪，行至半山，风止雪静，四望无人，而其手已按于剑上，不能自释。半山旧哨在奥藏山阴，哨屋无门，风雪入之，积于墙角。"
 SHP_Spirit_New_Law:"绝云律护生"
 SHP_Spirit_New_Law_desc:"律书开卷第一篇，止一句：「绝云之律，护生，不护人。」书者搁笔，问左右此句可受议乎。左右答以可。乃张于山门，令行者读之。老修士读毕，问护生不护人，则人何恃。书者答以人恃律。老修士又问律亦护人乎。书者良久乃言：律先护其自身，而后能护人。老修士乃拜。律书张于奥藏山门侧，纸以浆粘，风揭其角，守者以手按之。"

 SHP_Cultivation_Tier_1:"清修之阶"
 SHP_Cultivation_Tier_1_desc:"戒律废弛，山门蒙尘，仙众离心。路过之风亦敢在绝云间檐角下打旋，无人再以此山为一回事。庆云顶上浮岛之索三年未换，风大则摇；太山府阶前生草，求道者上山，见无一人迎，多回身去。"
 SHP_Cultivation_Tier_2:"清修之阶"
 SHP_Cultivation_Tier_2_desc:"清修初立，赏罚有据，上下有序。规矩立了起来，惟执行之际，仍留几分人情。晨钟一鸣，九峰之众各赴其位；暮钟一鸣，各归其舍。有犯律者当罚三月，执律者念其旧劳，改罚一月，仍记于册，不隐其减。"
 SHP_Cultivation_Tier_3:"清修之阶"
 SHP_Cultivation_Tier_3_desc:"清修有成，令行禁止，山门如铁。修士行动如一人，冷而可靠。山下之人，亦渐学之。令下则不闻问，惟闻履声。新人问老修士何以不问缘由。老修士答以缘由已书于令前，令后不问。山下村落亦效之，约出而行，不复争于树下。"
 SHP_Cultivation_Tier_4:"清修之阶"
 SHP_Cultivation_Tier_4_desc:"清修严整，律条如刀，不问情由。犯忌者无所遁形，敢通融者亦一个接一个不见。冰壁之上，每日新刻数名；刻名者退，退者不复见于九峰。老修士送其徒至山门，徒问师可有言。师答以无，惟将徒之旧剑收归库中，另立一格。"
 SHP_Cultivation_Tier_5:"清修之阶"
 SHP_Cultivation_Tier_5_desc:"清修如冰，行止坐卧，皆有定数。极端之序守住了绝云间之纯粹，亦可能锁住它伸向人间最后一只手。山门之外三里有一村，村人病，来求药。守门者按律验其牒，牒不合，不纳。药在库中，未动。村人候三日，去。"
 SHP_Mortal_Tier_1:"尘缘之阶"
 SHP_Mortal_Tier_1_desc:"尘缘断绝。山外无人应声，邮袋中除自家公文，再无别物。断得干净，亦冷得彻底。山下驿卒一年上山两次，皆空手而回；山门之侧设一信箱，锁已锈，启之，内惟旧年贺帖一张，封皮已裂。"
 SHP_Mortal_Tier_2:"尘缘之阶"
 SHP_Mortal_Tier_2_desc:"尘缘初通。有几家使节上门，所谈多半仍是试探。互相递茶，无人肯先交底。使者坐于偏殿，茶三易而话不入正题。至暮，主者遣人送之下山，赠干粮一囊，不言所议，使者亦不问。"
 SHP_Mortal_Tier_3:"尘缘之阶"
 SHP_Mortal_Tier_3_desc:"尘缘渐广。挂绝云间印记之车队复见于远方关市。外人始记得，此山上尚有人会讲道理。车队过关，关吏验其印，问所载何物。押车者答以药材与炭。关吏启一箱视之，果如所言，乃放行，且于册上另注一句：此队不欺。"
 SHP_Mortal_Tier_4:"尘缘之阶"
 SHP_Mortal_Tier_4_desc:"尘缘鼎盛。绝云间成此一带绕不开之一方，约须其签，争须其裁。风头之下，暗算亦生。借印记者日多，印值亦涨。有伪印见获，持者乃山下大族之仆。执律者不究其主，惟命将伪印悬于山门三日，示众。"
 SHP_Mortal_Tier_5:"尘缘之阶"
 SHP_Mortal_Tier_5_desc:"尘缘滔滔。山上之人始用他处之规矩算自家之账。名声走得比粮快，早晚要回头补票。他邦之尺、之秤、之律，渐入九峰；山中之约，则渐出山门。老修士见新律一册，翻毕置于案，谓其徒曰：「此册写得较九峰齐整。」"
 SHP_PWCombo_Both_High:"仙凡同光"
 SHP_PWCombo_Both_High_desc:"山里有律，山外有理。绝云间头一回把雪与尘摆在一张桌上。秩序立住了，然立秩序那只手，亦被人看见。山下之人初以为山上不食人间烟火，及同席，见其亦议米价、亦争炭钱，乃相视而笑。笑毕，村老曰：「原来也吃米。」"
 SHP_PWCombo_Both_Low:"雪散人空"
 SHP_PWCombo_Both_Low_desc:"戒律守不住，人心亦留不住。山上之钟照旧在敲，敲毕，山下无一人抬头。山下之村，旧有上山祈福之俗，今则改于村口自设一石。问其故，村老答以山上之钟听不见，不如听脚下这块石。"
 SHP_PWCombo_A_High:"闭山自守"
 SHP_PWCombo_A_High_desc:"山中冷得干净，无人进得来。清修守到极处，连风亦学绕道。惟山下信使，一年比一年少。山门之雪，积至檐下，无人扫，亦无人踏。守门者三年未见他面，见雪上有鸟迹，竟出而观之，立良久方回。"
 SHP_PWCombo_B_High:"入世为帝"
 SHP_PWCombo_B_High_desc:"绝云间之手伸得极远，铁与粮皆足。山上戒律却松了，执律者始在酒席上谈生意。印记既贵，求者持礼而至，礼单渐厚。有执律者初收一坛酒，三年后收一箱，五年后座上已有商贾之位。冰壁之律尚在，而无人再读。"

 #################### 公子 · 至冬干涉军 ####################
 YLH_CivilWar_Childe:"公子临海收枪笑"
 YLH_CivilWar_Childe_desc:"璃月内战之信传至云来海，达达利亚方于甲板练枪。闻报，收枪而立，望南方那片为战火映红之天，忽然笑曰：「此乃好戏。」于天生之斗士，乱世为台；于恰在至冬任职之斗士，乱世又为一不可推之机。是夜作书与女皇，只一行：「请与吾一舰队，吾还君一能下金蛋之港。」"
 YLH_The_Frozen_Order:"军令既下锣不歇"
 YLH_The_Frozen_Order_desc:"雪原军令既下，云来海之气为之一变。操练之锣自清晨鸣至黄昏，甲板上水手行路皆带节拍。达达利亚语众曰：「吾不望人人爱战，只求一事。」令下之时，无人须先思而后动。战场上慢半拍者，是替对手收尸。语未毕，锣复起，水手应声转步，无一人回顾。"
 YLH_Muster_the_Mercenaries:"四码头同竖募旗"
 YLH_Muster_the_Mercenaries_desc:"募兵之旗同竖于四座码头，赏格高至使过路渔人驻足。达达利亚亲坐选兵，不问家世，只观两事：敢否于黑夜独上桅顶，肯否以昨日之赏押今日之赌。有少年问：「何以不试刀法。」答曰：「刀法可教，此二者不可教。」选至日暮，得三百人，名册以炭书记于木牌之背。"
 YLH_The_Northern_Arsenal:"霜纹木箱堆成山"
 YLH_The_Northern_Arsenal_desc:"至冬军械之船一艘接一艘靠港，卸下木箱，于码头堆成小山。箱面印北国霜纹，又印小字一行：「货到付款。」达达利亚抚新出鞘之枪尖，语副官曰：「世上最可靠之盟友，是欠尔钱之盟友。」既不愿其倒，亦不必虑其反手。副官问：「若其终不能偿乎。」曰：「则吾更愿其欠。」"
 YLH_Blood_and_Snow:"先使恨而后使信"
 YLH_Blood_and_Snow_desc:"血与雪，是至冬军人之两样本能。新募之兵被拉至雪线之上操演，风割其面，齿相击有声。操演毕之夜，达达利亚亲为每一人斟烈酒一碗。曰：「吾先使尔曹恨我，再使尔曹信我。」既恨且信之军，方是真军。言毕自饮一碗，掷碗于雪，众亦掷之，碗碎声连成一片。"
 YLH_The_Grey_Captains:"灰袍旧人聚深舱"
 YLH_The_Grey_Captains_desc:"灰袍船长聚于云来海最深之一间舱室，室中只一盏灯。此辈乃至冬在璃月沿海经营十余年之旧人，走私、护航、收债，诸业皆沾过手。达达利亚为斟酒，遍及一巡，曰：「尔曹比吾懂此海。故自今而后，此海如何行，吾先听尔曹。」众持碗不语，灯焰摇，照壁上旧海图。"
 YLH_Lease_the_Harbor:"中秋灯下署租约"
 YLH_Lease_the_Harbor_desc:"租借港口之约，写得极美：期限九十九年，租金一次付清，条款客气如议婚之书。中秋之夕，灯笼满港，达达利亚于灯下署毕，语副官曰：「尔谓璃月人聪明乎。」自然聪明。然再聪明者，亦挡不住一事，饿。吾与以饭，彼即须将自家码头，一格一格租与吾。语竟，提灯照其印。"
 YLH_Wage_Contract_War:"战事写成黑字契"
 YLH_Wage_Contract_War_desc:"契约战争，是以战事为一门清清楚楚之生意。雇佣、赏格、抚恤、违约，条款一条不阙，尽书黑字。达达利亚曰：「有人谓吾冷血。吾却以为，此世最热之血，恰出诸从不谈钱只谈情怀之将军。其兵至末，往往连一薄棺亦不得。」言至此，以指叩契上抚恤一款，叩之有声。"
 YLH_The_Iron_Quota:"铁额一条村存亡"
 YLH_The_Iron_Quota_desc:"铁额之规极冷：交足铁，则舍尔村；不足，则不必再谈。达达利亚不以为耻，曰：「慈悲须钱，吾非为善而来。吾所能与之公平，只一种：同价，同命。」出得起者，自活得下去。言毕，吏以秤称铁，秤砣落，声沉。村中老农立而视之，不言，惟解腰上之钥，交与吏。"
 YLH_Blockade_the_Port:"六十船横断航道"
 YLH_Blockade_the_Port_desc:"封锁璃月港之令下时，海上正起大雾。六十艘船无声横陈航道，如一圈合拢之铁环。达达利亚立旗舰船头，望雾中那座模糊之城，曰：「吾不攻之。吾只使其钱出不去，亦进不来。」一座被饿之城，比一座被烧之城，更易学会听话。雾渐散，城郭之形一寸一寸显于水上。"
 YLH_The_Salt_Ledger:"握盐即握港心跳"
 YLH_The_Salt_Ledger_desc:"盐账所记，是此门生意最要紧之一笔：谁于何时，须盐几何。握盐则握此港之心跳。达达利亚翻账，指其行曰：「人皆以为军以刀剑取城。」取城者，实是使城自知，连煮饭之物亦须来求。言终合账，以指按其皮面，皮冷。窗外潮声一阵高过一阵，灯焰随之俯仰。"
 YLH_Officers_of_the_North:"北国军官抵云来"
 YLH_Officers_of_the_North_desc:"北国军官团抵云来海之日，达达利亚亲至码头迎之。此辈多出至冬军校，行止严整，不苟言笑，登岸列队，靴跟相击一声。达达利亚敬酒一巡，曰：「吾知尔曹看不起雇佣之兵，亦看不起吾此半路出家之执行官。无妨。」仗打完之日，谁活着，谁便配得上这份看不起。"
 YLH_The_Winter_Drill:"雪线操演磨成器"
 YLH_The_Winter_Drill_desc:"雪原操演，是以人力强磨为器。冻伤、旧伤、沉默，为操演毕时之三样常物。达达利亚立雪中看毕全程，末乃曰：「尔曹恨我，吾知。然他日真上战场，尔曹当谢我。」战场上最不值钱者眼泪，最值钱者活着。言毕转身而去，雪深及踝，一行足印，无人随后踏乱。"
 YLH_Caravan_Tolls:"抽成不伤一人"
 YLH_Caravan_Tolls_desc:"商道抽成，是至冬最柔之一把刀。不砍人，只砍利；不封路，只使每行一步，皆须先算一算是否亏本。达达利亚曰：「吾不怕商人恨我，怕其不再做生意。一不肯买卖之港，方是吾真正之敌。」令下之后，商道之上，货车仍行，惟车主过卡皆先驻足，掐指一算，而后行。"
 YLH_The_Queens_Word:"女皇一纸尽付托"
 YLH_The_Queens_Word_desc:"女皇敕令至，短短数行，以云来海之事尽数相付。达达利亚捧书立甲板之上，良久不动。彼自知名此敕既有信，亦有试：女皇所观者，是此爱笑之执行官，为至冬开疆，抑为己圆梦。风掀其纸角，以手按之。既而收书，语副官曰：「备开战。」副官应声而下，锣遂起。"
 YLH_The_Proxy_Pact:"借人之手数钱"
 YLH_The_Proxy_Pact_desc:"代理之约，精要在代理二字。至冬不出面而治，惟扶一听话之衙门，代其收税，代其镇民，代其背骂名。达达利亚曰：「直治太贵，亦太显。」使璃月人治璃月人，吾居其后数钱，此方谓体面之胜。语罢，取茶一盏，饮半而止，以其已冷。阶下候见之绅士尚五六人。"
 YLH_A_Puppet_Council:"礼乐齐备开假会"
 YLH_A_Puppet_Council_desc:"傀儡议事厅第一场会议开得极体面：礼乐齐备，仪节周全，连反对之辈亦请数人入座。达达利亚坐旁听之席，终场未发一言。散后语左右曰：「最像样之议会，往往最不管用。盖其以争为政，而吾只要结果。」左右问：「既不要争，何必设厅。」曰：「正为使其有处争。」"
 YLH_The_Invisible_Hand:"令不下而货自迟"
 YLH_The_Invisible_Hand_desc:"看不见之手，从不径下一令。惟使某几笔货款迟三日，某几条航路贵半成，而后待各方自思当立何边。达达利亚曰：「最高之治，是使对方自以为择，自始至终，只行于尔所铺之路。」是月港中商人聚于茶肆，争言货迟之故，争至夜，无一人指北。"
 YLH_Trade_Not_Conquest:"不攻其城喂其腹"
 YLH_Trade_Not_Conquest_desc:"以商代战，是至冬兵法中最省之一条。达达利亚舍正面攻城，转以货食喂此港，使其肥而不能自去。曰：「以刀取城，须守之一世；以钱取城，城自为尔守。此女皇所教。彼比谁都懂何谓不流血之胜。」言至此，码头一船正卸粮，米袋落地，声闷而连。"
 YLH_Friendly_Regiments:"北国出枪我出命"
 YLH_Friendly_Regiments_desc:"友军之名甚暖，编制上则分得极清：至冬出枪出饷，璃月出人出命。检阅之日，达达利亚行至队前，语一璃月籍连长曰：「尔为谁战，吾不问。吾所问只一事：他日尔想通自己在为谁流血，勿恨吾便好。」连长举目视之，久乃答曰：「若想不通乎。」曰：「那便更好。」"
 YLH_Quiet_Coercion:"货断则人自困"
 YLH_Quiet_Coercion_desc:"静默胁迫，无硝烟之围城也。达达利亚从不胁人，惟使不肯合作者于不觉之间失其货源，失其航路，失其靠山。曰：「最干净之镇压，乃使其至死亦想不通动手者谁。」盖彼实指不出一具体之敌。帐中语竟，命人以炭记某商号之名，记毕即抹，不留于册。"
 YLH_The_Commissions_Gaze:"北国有人逐笔记"
 YLH_The_Commissions_Gaze_desc:"愚人众委员会之目，未尝一日离云来海。达达利亚心知其于此港所取之每一分利，北国皆有人一笔一笔记着。然彼不厌此注视，反谢之。曰：「正为此目在背，吾于此乱世，终不敢彻底放纵。」言毕，帐外传更，四鼓。彼取笔自记今夜所支，字极细，如恐人见。"
 YLH_The_Silk_and_the_Chain:"丝卖愈远链愈紧"
 YLH_The_Silk_and_the_Chain_desc:"丝与链，是一物之两面。璃月港之丝卖得愈远，则愈离不开至冬之航路；而每一航路，皆一根无形之链。达达利亚曰：「尔看，吾从未想缚谁。吾只使众人自见，日子过着过着，便将自己过入吾之绳中。」语讫，以手作绕绳之势，绕一环，复绕一环，末乃握拳。"
 YLH_A_Governor_in_Name:"印真权真主非真"
 YLH_A_Governor_in_Name_desc:"名义总督坐于本属七星之位，印真，权真，而主非真。达达利亚偶至，观其议事，视此提线之偶认真扮演一统治者，观毕转身而去，一言不发。归舟语副官曰：「使吾不安者，从来非其人，乃此偶有一日自以为亦是主人。」副官问：「若真有此日。」曰：「则换一偶，或拆其线。」"
 YLH_The_Golden_Tributary:"货船排至海平线"
 YLH_The_Golden_Tributary_desc:"黄金贡道，是云来海一年中最忙之一季。货船排成长龙，自璃月港直排至望不见之海平线，桨声与号子声昼夜不绝。达达利亚立灯塔之上，视此条金色之河，忽念：此诸船无一面旗属吾，然其驶向之每一方，皆有吾之名。风大，灯焰斜而不断。"
 YLH_The_Clean_Hands:"手上不沾血"
 YLH_The_Clean_Hands_desc:"干净之手，是达达利亚最自许之物。彼从不亲手杀人，亦从不亲书具体之恶，诸般脏活皆过一层又一层之转手。曰：「吾此生最擅长者，是使人代吾战，而吾犹能于灯火通明之宴厅中，笑而敬众人一杯。」言竟举杯，满座皆起，杯声相碰，无人问此酒为何而饮。"
 YLH_A_Smile_and_a_Dagger:"举杯称兄夜夺产"
 YLH_A_Smile_and_a_Dagger_desc:"笑与刃，从来是同一套动作之两半步。达达利亚可于觥筹交错之间与人称兄道弟，亦可于同一夜签字调走其全部家产。有人问：「良心安乎。」答曰：「不安。然吾不许此一点不安，妨碍吾做完当作之事。此是成年之人对自己最后之诚实。」语毕，以刃削果，果皮不断而下。"
 YLH_The_Order_of_Profit:"不问血统只问账"
 YLH_The_Order_of_Profit_desc:"利润之序，是至冬为此地所画之图：不问血统，不问乡愁，只问一笔买卖算不算得过账。达达利亚曰：「吾知尔曹嫌其冷。然冷有冷之好处，不认人，亦不认仇。」出得起价，便给得起位。此世尚有比此更公之物乎。问毕，座中无人答，惟有一人低首，以指画案上水渍。"
 YLH_The_Last_Envelope:"末函只索一纸租"
 YLH_The_Last_Envelope_desc:"最后一封密函，所装乃至冬与璃月之终局条件：不必称臣，不必易帜，惟将港口、航路与盐铁，写入一纸长期之租。达达利亚于信末亲添一行：「吾与尔曹者，是一条能活之路，虽其确通向我。」写毕封口，授与连夜赶来之使者。使者接函，手微颤，彼视之，不语。"
 YLH_Peace_With_Profit:"不占不王只抽成"
 YLH_Peace_With_Profit_desc:"有利之和平，是达达利亚为此路自取之名。不占其地，不称其王，惟使云来海成为一张至冬永不输之赌桌。有人问：「此非背女皇之志乎。」笑答曰：「志从来不必书于旗上。」赢至末者，往往是坐于桌边、自始至终只收抽成之庄家。言毕，掷骰于案，声脆。"
 YLH_Claim_the_Sovereignty:"旗杆最高升鹰旗"
 YLH_Claim_the_Sovereignty_desc:"索求主权，是把一切伪装尽行撕下之时。达达利亚登港口最高之旗杆，亲手升将至冬鹰旗。旗至杆顶，风满其幅，一响如裂帛。彼曰：「代理之戏，吾玩足矣。」代理想来想去，终须自问一句为谁做事。吾不喜此问。吾所喜之答只有四字：「为我自己。」"
 YLH_The_Annexation_Decree:"尽降璃月商号旗"
 YLH_The_Annexation_Decree_desc:"并吞敕令既颁，云来海之水色比常日更深。达达利亚不宣其胜，只下一令：凡璃月商号之旗，一律降下。曰：「吾知此必使多人恨我。无妨。」恨是暂时之物。待其子长大，自会惯于此海上之新旗，如惯于潮汐。令下之日，码头旗影一一落，落尽时，日正当中。"
 YLH_Total_Blockade:"连飞鸟不许越海"
 YLH_Total_Blockade_desc:"彻底封锁，是将最后一点余地亦抹去。航道、渔场、港口尽闭，连一飞鸟亦不许越。达达利亚曰：「仁慈是奢侈之物。」一军至此，奢侈不起。要么此刻狠到底，要么将来为今日所放之人狠回来。语终，命人以红笔于图上画圈。圈成，笔尖顿，纸上留一点浓墨。"
 YLH_The_Army_of_the_Dream:"军饷足则家可安"
 YLH_The_Army_of_the_Dream_desc:"梦想之军，是至冬在璃月最精之数支，器械精良，士气甚高，每人所领军饷皆足使其家安稳度日。达达利亚检阅时却言一句使众意外者：尔曹为钱而来，甚好。然须记，钱买不来勇，钱只买来一个不必为别种借口送死之由。言毕，队中寂然，惟闻旗在风里连响。"
 YLH_Burn_the_Ledgers:"一夜烧尽二百年"
 YLH_Burn_the_Ledgers_desc:"焚册，是占领者最熟亦最狠之一课。璃月子民所记二百年之地契、税簿、户籍，一夜之间尽为灰烬。火起于仓，风助之，纸灰飞过半城，落于屋瓦如黑雪。达达利亚视火，曰：「一纸烧起，只值数文。然所烧之诸纸，值一城。」人最深之惧，从来是失其能证物曾属己之物。"
 YLH_First_Blood_on_the_Water:"水上初浮一层红"
 YLH_First_Blood_on_the_Water_desc:"血溅于水，是此场占领真越那条线之时。港口之外，海面第一次浮起淡红一层，随浪开而复合。达达利亚立舰桥之上，视彼片水面，久无一言。既而语副官曰：「今日死者之名，尽记下来。」副官问：「记之何用。」曰：「日后必有人来问。」语竟，转身入舱，舱门自掩。"
 YLH_The_Cold_Governor:"不亲民不置辩"
 YLH_The_Cold_Governor_desc:"冷面总督，是一种姿态：不亲民，不解释，只下命令。达达利亚渐觉，璃月人似更服一张无表情之面。曰：「人有时甚怪。尔与之善，彼则讨价还价；尔与之冷，彼反将规矩记得清清楚楚。」言已，命撤堂上茶具。凡来见者，立于阶下，言毕即退，不得留一盏茶之时。"
 YLH_The_Garrisons:"烽燧连于全境"
 YLH_The_Garrisons_desc:"驻军，是将统治钉死于地上之钉。要塞、哨所、巡逻之队，一层一层铺满全境，望之如网。达达利亚曰：「吾从不望以一军治一国。然吾可以一军，使任何欲反者，于动手之前先算清自家有几条命。」令下之后，山道之上，哨火相接，夜望如星落于地。"
 YLH_The_Sea_of_Fire:"焚尽一湾渔火红"
 YLH_The_Sea_of_Fire_desc:"火海，是占领者最不计后果之一手。为清抵抗，港湾渔船与仓房尽焚，火光映红半夜之天。渔人立于坡上，视其祖传之船化为火骨，无一人哭。达达利亚立拒马之后观之，忽问副官曰：「所烧愈多，所余者是否愈值钱。」副官愕然，不能答，亦不知当如何答。"
 YLH_The_Sovereign_Harbor:"告示先书至冬文"
 YLH_The_Sovereign_Harbor_desc:"主权港，是至冬在璃月之治真落于地之形：码头遍插北国之旗，税关尽换至冬之纹，连告示牌上之字，亦先书至冬文，后书璃月文。达达利亚行过此一切，步甚稳。心念：此即胜之形，安静、齐整、有条不紊，无一丝想象中应有之光。风自海来，旗影覆其面。"
 YLH_The_Northern_Fist:"不战而立自成威"
 YLH_The_Northern_Fist_desc:"北国之拳，是至冬留于此地之最终常备武力。不须战，只须在；其在，即为威。达达利亚检阅此军时曰：「吾此生征战多矣。然渐知，最成之军，是未尝得机展示武力之军。」言毕，行过队前，靴声与旗声相和。行至队末，忽驻足，为一兵正其领扣，而后去。"
 YLH_The_Throne_of_Ice:"冰座加冕乐停时"
 YLH_The_Throne_of_Ice_desc:"冰之座，是达达利亚在璃月为自所立之终点。加冕之日，着至冬礼服，坐冰雕之座，受四方朝拜，座下是一座已尽臣服之港。乐声既停，忽觉一阵熟悉之空，如战前。乃知立于此地，并不比立于甲板更使人踏实。殿外风声如潮，来时退时，无人敢近。"
 YLH_The_Winter_Sovereign:"璃月之名自图去"
 YLH_The_Winter_Sovereign_desc:"冬之主权，是此路行至末处之模样：璃月不复称璃月，徒为至冬版图上一块带暖意之南方领地。达达利亚掌此地，却渐常梦北方：梦冰，梦雪，梦当年在雪原里第一次握枪之少年。每醒，必于黑暗中坐良久，听潮声自远而近，又自近而远。"
 YLH_The_Kids_Game:"滚铁环于断墙下"
 YLH_The_Kids_Game_desc:"孩童之戏，是达达利亚难得许自放松之时。于港口临时平出一片空地，使难民之孩子滚铁环、跳格子，自在旁看得有味，时时以手击节。一孩怯怯问曰：「尔是恶人乎。」笑答曰：「吾亦不甚清楚。不如待尔长大，自判之。至少那时，尔须尚活着，方能判。」孩不解，复去滚环。"
 YLH_The_Chasm_Smugglers:"层岩黑船夜出渊"
 YLH_The_Chasm_Smugglers_desc:"巨渊走私，是一条至冬公文中亦不敢明写之黑线。矿料、旧物，乃至人口，一批一批自层岩深处运出。达达利亚睁一眼闭一眼，只收一道固定之抽成。曰：「战讲纪律，然治一国，须为胆大者留一条活路。」否则彼自去别寻活路，而那往往更麻烦。语竟，以炭于图上抹去一渡口。"
 YLH_The_Mast_of_the_Fleet:"独坐桅顶半日闲"
 YLH_The_Mast_of_the_Fleet_desc:"舰队桅顶，是云来海最高之处。达达利亚常独攀而登，一坐半日。自此望下，全港如一盘摊开之棋，海面平静得能照出云影。心念：立于此高，本应看得更远。何以所见者，反只此诸船、此诸货、此一笔永远收不完之账。风动其衣，亦不动其身。"
 YLH_The_Letter_from_Home:"北国家书藏衣袋"
 YLH_The_Letter_from_Home_desc:"家书自远北辗转而来，所书者是其年幼之弟妹。纸上画歪斜之屋，旁有小字问哥哥何时归家。达达利亚读之再三，末乃折好，纳入贴身衣袋。语副官曰：「尔先出，吾欲独坐一会。」是日于舱中坐至天明，案上灯尽，杯中水未动，窗外潮声一夜未歇。"
 YLH_The_Blood_Price:"几条性命买此海"
 YLH_The_Blood_Price_desc:"血酬，是云来海三年战事终摊开之一本总账：死几何人，费几何钱，换得几何地与人几何航路。达达利亚逐行看毕，未言。良久，语账房曰：「此诸数，另抄一份与吾。」账房问何用。曰：「吾欲看看，吾辈以多少条命，买下这一片海。」言毕，以手按其册，久不移。"
 YLH_Reunify_Liyue:"旗升旗杆无得意"
 YLH_Reunify_Liyue_desc:"接管璃月之日，至冬之旗升上璃月港最高一杆。达达利亚立旗下，俯瞰此座以数年之力征服之城，忽无想象中之得意。乃忆初来时之黄昏，忆关外跪求一车粮之老人，忆自家所言：「慈悲救不得将倾之山，此吾所以比尔曹早知。」思至此，闭目良久。"
 YLH_The_Sea_Wolves:"夜出海面无籍船"
 YLH_The_Sea_Wolves_desc:"海狼，是云来海最不受管束之一辈：不列编制，不着制服，只在夜间往来，专挑最难缠之航线下手。达达利亚从不认与海狼有任何干系。然每逢要紧关口，那几艘幽灵之快船，必恰于其时出现。曰：「正军以打明仗，海狼则以告众人：此海白日归吾，夜里亦归吾。」"
 YLH_The_Shadow_Exports:"不载公文只载货"
 YLH_The_Shadow_Exports_desc:"影子出口，一条不书于任何公文之航线：璃月之丝、盐铁、旧物，自此线悄然流向北国，所换回者，更北之物。达达利亚于此线每一笔买卖皆了然，却从不在任何文书上留自家之名。曰：「明面之贸易与女皇看，此线所载者，方与此港留。无影之处，方装得下不肯见光之物。」"
 YLH_The_Second_Fleet:"无名之舰泊荒港"
 YLH_The_Second_Fleet_desc:"第二舰队，从不在任何人之名单上。其以余船、余兵、余野心拼凑而成，泊于众人皆以为早废之荒港。达达利亚亲往视之一次，归时只说一句：「无名之舰队，才是真能派上用场之舰队。」盖其不欠任何人一交代，故亦不必等任何人之令。言毕，望荒港方向，久不转睛。"

 YLH_civilwar_category:"云来海运"
 YLH_civilwar_category_desc:"北国一线，内战诸决尽归此局。两轴并权，量借力与自保之轻重，每决一事，级随轴移。公子周旋诸方之间，所图从来只有实利：不做亏本之买卖，亦不将言讲绝。哪边出得起价，便往哪边多走两步。"
 YLH_decision_naval_drill:"海上操演"
 YLH_decision_naval_drill_desc:"海上操演，从不讲情面：落水者无人捞，跟不上队者留于岸上。达达利亚曰：「吾非教彼等泅水，乃教彼等一事：在海上，望他人来救，便是求死。海上无邻，惟自力可恃。至于泅水，汝辈自去学，学不会者，毋登吾船。」操演在云来海，水黑而深，落水者无人捞，惟自力可恃。"
 YLH_decision_hire_hands:"按口定价"
 YLH_decision_hire_hands_desc:"赏格挂出，来者形形色色：逃兵、渔户、走投无路之书生。达达利亚挨个看过，只问一句：「家中尚有几人待养。」问毕，按人数定价。副官问其故。曰：「为温饱而来之兵，比为理想而来之兵，耐用。」募兵之榜张于璃月港东码头，纸以浆粘，风揭其角。"
 YLH_decision_port_tariff:"路引抽厘"
 YLH_decision_port_tariff_desc:"厘金不收现银，只收路引。欲通行，先买一份通行。达达利亚曰：「直接抢钱太粗。吾所要者，使其心甘情愿，一步一步走进吾之规矩。」有商问：「不买路引，如何。」达达利亚曰：「那便绕。绕得远，货便烂在舱里。」路引用薄纸，钤至冬鹰印，印发于璃月港税关，色偏青。"
 YLH_decision_intelligence:"暗桩压信"
 YLH_decision_intelligence_desc:"暗桩者，已投至冬而犹居旧衙门之人也。其所为一事：不当下传出之消息，压住一宿。而往往此一宿，定一城之命。桩不必多，一桩在要处，胜甲士三千。故查验暗桩，不在其言，在其所压。暗桩所居在璃月港旧衙门，屋小无窗，终日点灯。"
 YLH_decision_bribe_guild:"陈金待血"
 YLH_decision_bribe_guild_desc:"赎买之价开得极高，高至使许多掌事，第一次疑其守了半生之物，究竟值不值此数。达达利亚从不强求，只将价钱摆于案上，然后耐心而待。人心一物，最经不起等。等至第三月，先来者非硬骨，乃最善算者。价目书于厚纸，摊于璃月港商会长案，四角以铜镇压。"
 YLH_decision_freeze_accounts:"一纸封门"
 YLH_decision_freeze_accounts_desc:"冻结账目，不用刀，不见血，而能使一门显赫之家，一夜之间化为罪人。封条一贴，门前车马自散，姻亲故旧避之如避疫，无一人来问其冤。达达利亚曰：「吾不必杀异议者，但使彼等自觉其钱忽空。余者，岁月自代吾为之。」封条贴于璃月港各庄门侧，纸以浆粘，朱笔书日月。"
 YLH_decision_northern_loan:"借钱为钩"
 YLH_decision_northern_loan_desc:"借出之钱，从来是钩。达达利亚深谙此道：借了至冬钱之商会，比签了盟约之商会更可靠。盟约可撕，债逃不掉。副官问：「若其还不上。」曰：「那时此商会已是吾之物，何须其还。」借约用厚纸，末页留白一行，藏于璃月港府衙，以待添字。"
 YLH_decision_patrol_lanes:"绘图于海"
 YLH_decision_patrol_lanes_desc:"巡弋航道，表面为治安，实则将每一条航线之走向，尽记入至冬海图。达达利亚曰：「今日替汝等赶走海盗，明日此图，便成汝等离不开我之由。」故其图年年增，商船年年熟。航图藏于南十字灯塔，礁以朱点，浅以墨，日改一处。"
 YLH_decision_war_exercise:"炮响省谈"
 YLH_decision_war_exercise_desc:"实弹演武，是给外人看之一场戏：炮声愈响，谈判桌上愈省事。达达利亚曰：「吾少真想打仗。吾只发现，一个随时准备开炮之人，往往比真开了炮之人，更能得其所欲。」演武场设于云来海岸，炮座以石砌，台基入地三尺。"
 YLH_decision_ratify_lease:"久坐慢茶"
 YLH_decision_ratify_lease_desc:"续订租约之谈，永远是耐力之争。至冬不急，因其知璃月更急。达达利亚坐对面，慢悠悠饮茶，一坐半日。曰：「谈判不比打仗省力，只是用耐心。」陪坐之副官换了三班，他不动。谈判之席设于璃月港船楼，茶换四回，陪坐者更三班。"
 YLH_decision_envoy_keqing:"使者赴玉衡"
 YLH_decision_envoy_keqing_desc:"使者归，言刻晴压根未见之。达达利亚听毕大笑曰：「好，好得很。吾最喜之对手，即那种连见亦不肯见，却能在背后把吾打算猜个八九分之人。」即命人送玉衡军械一船，曰：「替她省点力气。」军械一船卸于璃月港东码头，箱上霜纹为烙印，气味不散。"
 YLH_decision_envoy_ningguang:"使者赴群玉阁"
 YLH_decision_envoy_ningguang_desc:"群玉阁使者谈三个时辰，全在讲利。达达利亚归船，谓副官曰：「凝光者，吾在世上所见最像同类之敌。彼与吾皆信，世上一切物事皆可定价。」既而叹曰：「可惜，同一门手艺之两人，注定成不了朋友。」"
 YLH_decision_envoy_ganyu:"使者赴月海亭"
 YLH_decision_envoy_ganyu_desc:"月海亭之复，为诸势力中唯一带人情者。甘雨曰：海水可让，港口可谈，然月海亭之人，一个亦不能少。达达利亚捏信，忽笑曰：「此等人才难对付。她所争者，人也。」"
 YLH_decision_envoy_shenhe:"使者赴绝云间"
 YLH_decision_envoy_shenhe_desc:"绝云间回信只八字，写在雪白之绢上：「路可以让，人不低头。」达达利亚读绢良久，抚手中那柄枪，自语曰：「此世上，吾最敬之敌，便是此种连价钱亦不肯开口报之人。因其所给之答，比金子犹贵。」"
 YLH_decision_envoy_lanyan:"使者赴沉玉谷"
 YLH_decision_envoy_lanyan_desc:"沉玉谷使者最不类使者：一身泥，一脸倔，所谈者水、土、谷种。达达利亚听毕，头一回放下手中之枪，曰：「有点意思。世上多数人欲从吾处得钱，她却只欲吾莫去动那片谷地。」"
 YLH_decision_final_accord:"总约成册"
 YLH_decision_final_accord_desc:"三年之租约、债券、航图、军约，一并摊开，写成至冬在璃月之总章程。达达利亚亲审每一页，改至深夜。末于扉页书曰：「此约由强者签订，须由弱者长久遵守。」书毕自怔，遂将那一页悄悄撕下。总章程一册，凡九十一款，编号以朱，藏于璃月港库。"

 LYY_Event.6001.t:"公子临海看烽火"
 LYY_Event.6001.d:"璃月内战之信传至云来海时，达达利亚正于甲板练枪。枪为北国所携长柄，枪尖缠布，所练者刺与收。\n有快船自南来，报曰：「玉京台夜有火光，千岩军已动刀。」\n他收枪，立于船头南望。那一片天烧得发红，云皆压在其下。\n副官问：「如何处之。」\n他笑曰：「如何处之。」这般好戏，自然要买一张好位子。\n归舱，提笔与女皇作书。书只一行：「与我一支舰队，我还你一座会下金蛋之港。」\n写毕自笑，曰：「你看，连情书也写得像个生意人。」副官在旁，不敢笑。\n书当夜由快船送去，比探报回程还快半日。\n快船去后，他又在甲板上练了半个时辰。此回不缠布，枪尖挑起水面，水花落于鞘上，冻成一层薄冰。至天明，那片冰未化。\n水手来报早饭已备。他曰：「先置案上。又练一趟，方收枪入舱。」舱中书信底稿尚摊于案，墨迹未干。他看一眼，取镇纸压住，未收。云来海水色深，风起则白浪，浪击船腹，声如擂鼓。"
 LYY_Event.6001.a:"以商之名，行干涉之实"
 LYY_Event.6001.b:"只作旁观，静待时机"
 LYY_Event.6002.t:"雪原军令下云来"
 LYY_Event.6002.d:"雪原军令既下，云来海气氛遂变。操练之锣自清晨响至黄昏，一日三遍，遍遍不落。\n码头挑担者、补网者、卖鱼者，皆须学列队。列不齐则重来，重来三遍犹歪，则罚立至日落。\n有老兵私语：「此操太苦，苦得无道理。」\n达达利亚闻之，不罚，反递酒一壶。\n曰：「汝言是也，确实苦。」可曾想过，真到战场之上，苦与苦不同。一为练出来之苦，一为躺下便再起不来之苦。\n老兵接酒，仰头饮了半壶，不复言。次日锣响，他头一个立于队前，立得比谁都直。\n后有一夜真战，此老兵率十人守住一处滩头。归营，语人曰：「当初那壶酒，我记到如今。」言毕即睡。\n那一夜营中无人问他战况，他自己也不说。至第四日，才有人在滩头雪里拾到十一片刀鞘，摆成一排，像十一个人还站在那里。滩头多碎石，退潮则露，兵士操演皆在其上。"
 LYY_Event.6002.a:"以雪原军令，立军威"
 LYY_Event.6002.b:"宽严相济，徐图训练"
 LYY_Event.6003.t:"四座码头同竖旗"
 LYY_Event.6003.d:"募兵之旗于四座码头同时挂起，红底黑字，赏格高得连过路渔人亦动心。\n第一日来者三百余人，队列绕过仓房。有扛活者，有跑船者，有自北边逃荒来者，皆挽袖要试刀。\n一衣旧袍之读书人来报名，立于队尾，立两个时辰。\n达达利亚巡至队尾，见之，问：「会用刀否。」答：「不会。」又问：「识字否。」答：「识。」\n当场留之，命为记录员。左右不解，曰军中不缺能言之人。\n他曰：「打仗之兵不缺。肯替死人记名字者，我一个都嫌少。」\n那读书人后记名册三年，册上共三千一百四十七名，无一遗漏。\n册曾为水所浸，字淡。他摊册于日下晒干，一页一页抚平，抚三日方收起。\n册中有一名只书其姓，无名。他问其故，答曰：「那人来时不说名字，只说从北边来。」他便在姓下添一行小字：「北来，无名，死在某月。」此后再无追究。四码头分列云来海港之两端，东者水深，西者水浅，须候潮。"
 LYY_Event.6003.a:"广募亡命，不问出身"
 LYY_Event.6003.b:"精挑细选，宁缺毋滥"
 LYY_Event.6004.t:"军械船到先验款"
 LYY_Event.6004.d:"至冬军械船一艘接一艘靠港，码头木箱堆成小山。箱上印霜纹，旁有一行小字：「货到付款。」\n副官问：「何故留此四字。」\n达达利亚曰：「使彼等看看，吾连军火亦是赊来。唯其如此，彼等方肯信，吾辈真以自身押于此战。」\n又问：「若彼等不信呢。」\n曰：「不信亦无妨。」字在箱上，看得见。信不信在其人。\n那批箱中有一箱空无一物，空箱内放一纸契约拓片。拓片后为人取走，箱板却留，为港中一铺之柜台。柜台上至今摸得出霜纹之凹凸。\n或问铺主：此柜台何处得来。铺主曰：「买来。」再问，便不答。\n那铺子后开十七年。铺主易二人，柜台未换。第三个铺主接手时，欲将柜台刨平重漆。刨两下便止，曰：「留之罢。」此后柜上霜纹，又深一层。\n有醉客伏于柜上睡一夜，醒来指霜纹问是何物。铺主曰：「北边来。」醉客曰：「北边冷么。」铺主曰：「冷。」醉客遂不再问，付酒钱而去。军械箱卸于璃月港东码头，箱上霜纹为烙印，烙时木焦，气味经月不散。"
 LYY_Event.6004.a:"购北国军械，武装全军"
 LYY_Event.6004.b:"就地取材，少借外援"
 LYY_Event.6005.t:"血与雪皆为本能"
 LYY_Event.6005.d:"血与雪，乃至冬军人两样本能。血者敢流，雪者能耐。\n操演毕之夜，达达利亚亲手为新兵各斟一碗。酒则烈酒，倾于粗陶碗中，一人一碗，不许推让。\n一新兵饮得满面通红，壮胆问曰：「将军视吾辈为何物。」达达利亚思片刻，曰：「视汝辈为活人。」又曰：「此语听来不似褒。」然在此行中，被人当作活人，已是上评。\n新兵怔住，捧碗，半晌未动。是夜营中无一人醉倒。次日点卯，一个不少。旧卒曰：「此营之人，乃以一碗酒换住。」\n有一人未饮，惟捧碗不放。达达利亚问其何以不饮。其人曰：「留之，归以示吾父。」达达利亚曰：「碗可携归，酒须倾去。」其人曰：「酒亦留之。」达达利亚视之良久，曰：「然则明年此日再饮。」\n其人果于次年此日饮毕，大哭。同营者无一人笑之。后此营出军官七人，皆自那一夜酒碗之下走出。或问其当初何以肯留，数人答语相近：因有人以活人相待。雪原营扎于璃月港北，酒为北地所酿，色如琥珀，饮之如火自喉下。"
 LYY_Event.6005.a:"以血与雪，砺我锐士"
 LYY_Event.6005.b:"惜其体肤，养其士气"
 LYY_Event.6006.t:"灰袍船长聚一舱"
 LYY_Event.6006.d:"灰袍船长聚于云来海最深一间舱室，只一盏灯。此辈走私、护航、收债，无一不曾干过。\n达达利亚亲为最年长者斟酒，曰：「闻汝在此片海上行四十年。」老人曰：「四十二年。」达达利亚点头曰：「那自今日起，此片海如何走，吾先听汝。」\n老人愣了愣，接酒，一饮而尽。饮毕曰：「大人不问吾辈曾做何事。」达达利亚曰：「不问。」做过之事，海上皆记着。吾所要者在后。\n铁匣后沉于海底，钥匙分七枚出去。或谓此乃惧人告密，或谓此乃信人。达达利亚闻之，既不承认，亦不否认，只曰：「钥匙在吾这里亦留一枚。」\n那一夜，七个船长皆留钥匙。第八个没有。第八个后于雾中沉船，人亦未上来。达达利亚闻之，命人将那一枚空位长留，不补人。空位之椅后积灰。有人要收，达达利亚不许，曰：「留之。」座上无人，海上之人才晓得有个第八。舱在船尾，低而窄，灯一盏，光仅及案。"
 LYY_Event.6006.a:"倚重灰袍船长，用其旧路"
 LYY_Event.6006.b:"另派亲信，重立班底"
 LYY_Event.6007.t:"租港九十九年约"
 LYY_Event.6007.d:"租港之约写得极美：期九十九年，租一次付清，条款客气得像一桩婚约。\n签毕，璃月一老吏忍不住问：「汝等如此做，不怕后人骂么。」\n达达利亚一边盖印，一边笑曰：「怕。故我将条款写得这样漂亮。骂我者，也得先承认我守了字面上每一条。」\n老吏曰：「守字面而失本意，与不守何异。」\n他停一停，曰：「有异。不守之人，连字面都没有。」\n约成九条。第九条曰：「此约期满，双方各归其位。」期满之日，有人往问此语作不作数。答者曰：「纸上如此。」问者以炭记于船帮。船帮之字，后为浪打去。\n老吏退下时，于阶前立一立。语同僚曰：「此人可畏处，不在其坏，在其坏而犹讲字据。」同僚未答。\n是年冬，璃月盐引改三次，每一次皆依约而行。第三次改时，老吏亲手校过一遍，校完于册尾题四字：「字字如约。」题毕掷笔，曰：「我这一辈子，倒替一个外人证其字。」租港之约签于南码头东馆，厚笺为纸，边以金线描，描者手稳。"
 LYY_Event.6007.a:"租借港口，坐收其利"
 LYY_Event.6007.b:"以武力强占，速取之"
 LYY_Event.6008.t:"契约写定之战争"
 LYY_Event.6008.d:"契约战争者，将战事做成一件清清楚楚之生意：雇佣、赏格、抚恤、违约，条条写死，一字不可移。\n有人骂其冷血，曰不当以战事为买卖。达达利亚曰：「真正冷血者，汝辈也。」口中讲情怀，粮饷却拖欠不发。至末了为此情怀送命者，皆连一张回程船票亦买不起之兵。\n其人无言。达达利亚又曰：「吾营之兵，死有数，伤有例，归乡有票。汝所谓情怀，能予彼等哪一样。」其人曰：「情怀能令人不怕死。」达达利亚曰：「不怕死，好事。」然死之后，情怀不代其养家。\n此后数年，契约军逃兵为诸军中最少。\n其人后亦入契约军，为饷官。或问其何以肯来。曰：「吾曾骂之，彼犹记吾名。」此语传至达达利亚耳中，达达利亚笑曰：「吾所记非名，乃账。」\n那饷官后来说起一事：有一兵死，名下抚恤无人领。查半月，方知家中只剩一盲眼老母。饷官亲送上门。老母以手摩银钱，问曰：「此乃吾儿所挣么。」饷官曰：「然。」老母曰：「彼未欠人钱罢。」饷官曰：「未欠。」老母遂以钱收进枕下，不复问。璃月港东码头营发饷以银元，元上印北国纹，纹深，摸之可辨。"
 LYY_Event.6008.a:"以契约立战争之规"
 LYY_Event.6008.b:"以军令督之，不立契"
 LYY_Event.6009.t:"铁额一条冷规矩"
 LYY_Event.6009.d:"铁额者，一条冷规矩：交够铁，放过尔村。交不够，不必再谈。\n规矩刻于木牌，立于矿区路口，字黑，无一句多余之语。\n有一村里正跪于牌下求宽限三日，曰山路断，铁运不出。\n达达利亚看亦未看，只谓管事曰：「宽限可以。」三日之后，利息翻倍。\n里正含泪而去。\n达达利亚望其背影，谓副官曰：「吾此举，乃与之留一条活路。」真。吾只是不想使其以为，只须跪下，事便可了。\n副官曰：「若其终究交不上呢。」曰：「只照规矩办。」规矩若为跪者改一次，往后便全不作数。\n是年冬，交足铁之三村，各得一车炭。炭则暗给之，不入账，亦不许说出去。或问何不入账，管事曰：「入账便成恩典。不入账，方为规矩之外一点人心。」\n那三村中有一村，次年提前半月交铁。管事问其故。里正曰：「去年那车炭，吾辈烧一冬，无人言谁所给。今年早些交，也算未白烧。」木牌立于层岩矿区路口，牌下堆铁一块，铁上生锈，无人取。"
 LYY_Event.6009.a:"严行铁额，分毫不让"
 LYY_Event.6009.b:"稍宽其额，以安民心"
 LYY_Event.6010.t:"雾夜六十船封港"
 LYY_Event.6010.d:"封锁璃月港之夜，海面大雾。六十艘船无声横陈，如一围合拢之铁环。\n达达利亚立于旗舰船头，望雾中那座模糊之城，曰：「吾不攻它。吾只使其钱出不去，亦进不来。」饿城比火城，更易学会听话。\n语毕，其自默然。因这句话，其在别处亦说过一次。\n副官不敢问何处。良久，达达利亚曰：「那年吾十四岁。」说此言者，别人也。吾立于下头听。\n那道口子留三日。三日内出海之船，装者皆粮，无一艘被拦。第四日口子合上，港中剩下者，惟有人。\n雾散时，港口犹在。钟楼照旧敲，敲至第七下，忽然停。停一刻，又敲。那一日港中诸钟皆慢半刻。无人往查，亦无人往修。\n那日以后，港中人添一习惯：出语前先看一眼雾。雾一起，便不言语。有外客问何故。港人曰：「雾里有船，看不见。」雾自海上起，厚可掩桅，港中灯照之，光成一团。"
 LYY_Event.6010.a:"封锁璃月港，断其血脉"
 LYY_Event.6010.b:"解封示好，换取谈判"
 LYY_Event.6011.t:"一本盐账作杠杆"
 LYY_Event.6011.d:"盐账上记着要紧一笔：谁于何时，须盐多少。\n帐房捧帐问：「何以非用盐不可。」\n他曰：「米太沉，铁太硬，惟盐这一物，家家皆须用，又不能自家去种。」\n帐房曰：「然则盐价一动，民怨必起。」\n他弹帐本，曰：「故须动得慢。」一年动一分，十年方动一成。人恨骤变，不恨渐移。\n掌握盐，便掌握这座港口之脉。此语他未说出口，只在帐页边上画一道竖线。\n那本帐后为雨所浸，字淡。管帐者摊于日下晒干，一页一页抚平，抚三日方收起。\n帐房后来方知，那一道竖线所画非盐，是港口命脉。他老后教徒弟，首课所讲非记帐，是这一道线。徒弟问其故。曰：「帐能记，线不能画。」线须有人担之。\n徒弟问：「担不住呢。」他曰：「担不住，就别画。」画线之后，此城每一人吃几钱盐，都算在你身上。盐粒粗而白，出港南盐滩，港人呼为海霜，扫盐者赤足。"
 LYY_Event.6011.a:"经营盐账，扼其咽喉"
 LYY_Event.6011.b:"开放盐路，以稳物价"
 LYY_Event.6012.t:"北国军官到码头"
 LYY_Event.6012.d:"北国军官团抵港之日，达达利亚亲至码头迎。众人多出身军校，不苟言笑。\n敬酒时，一年少军官当面问：「闻汝好嬉笑，又不循规矩，何以能将兵。」\n他笑曰：「凭这一身伤。汝数数，看有几道，汝曾见某将军身上有之否。」\n军官数至一半，闭口，仰头将酒饮尽。饮毕，他又曰：「规矩为不打仗者所定。」打仗者所守，另一样。军官问：「哪一样。」曰：「谁先死。」谁后死。谁不死。\n那批军官后在港里住三月，每日跟着操演。临行时，年长者曰：「吾辈来时，欲观汝所恃者何。」走时，则不敢问矣。\n那年轻军官临走前，请人将自己旧军衣留在港里，曰：「我数过伤，没数完。」那件军衣后挂在码头一间小屋里。凡有新兵来，管屋者便指衣曰：「此衣之主，数伤数到一半不数。」新兵问为何。管屋者曰：「汝自己去问。」新兵多半不问，只在衣前站一会儿。璃月港东码头石阶为旧年所铺，阶面磨滑，雨则人皆缓步。"
 LYY_Event.6012.a:"委北国军官，整肃军纪"
 LYY_Event.6012.b:"自领其军，不用北人"
 LYY_Event.6013.t:"雪原操演磨成器"
 LYY_Event.6013.d:"雪原操演，是将一批一批人磨成兵器。冻伤、旧伤、沉默，乃结束时之三样。\n那年雪下得早，风自山口灌入，吹得人睁不开眼。全程四十里，走不完者不算兵。\n一兵冻掉两趾，仍走完全程。至终点时，靴中灌满雪，脸冻得发青，立着不肯倒。\n达达利亚脱下狐裘，披于其肩。\n乃说一句使众人皆意外之话：「记着今日之冷。往后汝替旁人挡风之日，手勿抖。」\n那兵未应声，只将狐裘裹紧。此后此队有不成文之规：操演最冷之日，谁也不许先归营。\n那兵后活至战后，脚上少两趾，走路一拐。有人在城里见过他，说他每年最冷那一日，皆要在门口立到天黑。\n或问曰：「所站者何。」其人曰：「站一站，脚便想起那年。」问者不解。其人亦不再解释，只将手往袖里缩一缩。操演归后，营在璃月港北雪原，地平无树，风自山口入，割面如刀。"
 LYY_Event.6013.a:"行雪原操演，尽磨其锋"
 LYY_Event.6013.b:"减操省耗，留其体力"
 LYY_Event.6014.t:"商道抽成暗藏锋"
 LYY_Event.6014.d:"商道抽成，乃至冬最柔一刀：不砍人，只砍利润。\n规矩是十成抽一，按月清，逾期加罚，罚则书于榜上，明白无遗。\n有一老商人拍案，骂此为敲骨吸髓，曰宁可不做这门生意。\n达达利亚不恼，只命人取来算盘，与他算一笔：走此路，一年走八趟；走旁路，绕山三月，一年走两趟。抽一成，所赚仍多于绕路。\n算毕，曰：「你不肯交这一成，路我仍要封。」到那时，你连省此一成之机会亦无。\n老商人愣半晌，签了字。\n送出门时，达达利亚还笑着替他掀帘。老商人回头看一眼，未出一语。\n那老商人后成这条道上最大之商户。有人问其何以肯签。曰：「肯摆算盘者，比肯摆刀者，好打交道。」\n那算盘后被他挂在铺子正中。有人问为何挂算盘不挂神像。他曰：「神像不替我算账。」商道自港北出，过明冠峡，峡中设卡，卡上有棚。"
 LYY_Event.6014.a:"抽成商道，广开财源"
 LYY_Event.6014.b:"轻抽商道，以养商力"
 LYY_Event.6015.t:"女皇敕令到云来"
 LYY_Event.6015.d:"女皇敕令至，短短数行，将云来海之事尽付达达利亚。\n他捧信立于甲板良久。海风翻起纸角，他按住。\n副官试问：「女皇此信，信也，抑试也。」曰：「皆然。故自今日起，凡我所记之账，皆须清清楚楚。」使北国见之，亦使此港之人见之。副官问：「见甚么。」曰：「见我这等人物，挑起担来，亦是认真。」\n敕令后贴于舱壁，贴三年。纸黄，边角卷起。他命人换衬纸，仍用原纸。\n有一年冬，他醉后指纸曰：「这几行字，比军械重。」言毕便睡。\n敕令背面有小字一行，女皇亲笔：勿使我失望。他读过许多遍，从未对人提起。\n有一年北国来人核账，查四十日，一无所获。来人临去曰：「账太干净。」他曰：「干净之账，才配脏手。」那纸他每月拂一次，拂完照旧贴回，位置不差分毫。敕令以厚纸书，封以火漆，漆上压纹，纹为鹰形。"
 LYY_Event.6015.a:"奉女皇敕令，尽付云来海"
 LYY_Event.6015.b:"虚奉敕令，自专其事"
 LYY_Event.6016.t:"代理二字压此港"
 LYY_Event.6016.d:"代理之约，精要在代理二字：「至冬不出面，只扶一顺命之衙门。」\n签约时，璃月代表红着脸问：「此与亡国有何分别。」\n达达利亚放笔，正色视之，曰：「有分别。」亡国之人，连问此一句之机会亦无。\n其停一停，又曰：「吾并非安慰汝。吾素不浪费安慰。」\n代表曰：「既如此，汝为何犹要答吾。」\n曰：「因汝问了。」肯问者，往后犹可谈。\n代表去后，其于案前坐良久。谓副官曰：「凡签此种约者，皆自以为能拖时日。拖得住者，乃吾。」副官不敢问其拖得住多久。\n那代表后坐至议事末座。有人骂其签下卖国之字。其人但曰：「那一日吾问一句，对方答了。」肯答者，比不答者易与。此语其说十年，说到自身亦信。那纸后存进档房。档房钥匙换过三任，每一任皆晓得有此一份。签约之所即玉京台旧商会堂，堂中桌椅未换，惟旗易色。"
 LYY_Event.6016.a:"订代理之约，间接治之"
 LYY_Event.6016.b:"直接并吞，明正其名"
 LYY_Event.6017.t:"傀儡堂上初开议"
 LYY_Event.6017.d:"议事厅初开之日，礼乐齐备，丹漆一新，阶下陈花数十盆。座上议员皆衣冠整齐，连反对者亦请数人列坐，位次不乱。自晨至午，议一税则，甲乙相攻，声高而辞繁，有起立者，有拍案者。书记执笔，录至三十余页，竟无一事得决。日昃，廊下送茶三次，茶冷而无人饮。\n散时，达达利亚立于阶上，语幕僚曰：「尔观诸人争论，何其认真。」幕僚不解。达达利亚曰：「最像议会之议会，往往最不管用。彼以争论为政，我以成败为政。彼要热闹，我要结果。」有一议员趋前欲陈，语至半，为他人所截，遂拱手而退。\n幕僚问：「既知其无用，何不废之。」达达利亚不答，但指堂中一盏未熄之灯，曰：「灯在，人便以为夜里有光。」言毕下阶，靴声渐远，堂上诸人犹在议，争声穿壁而出，如市井之喧。傀儡议事堂在玉京台，阶下花盆借自商家，会散即还，盆上有商号。"
 LYY_Event.6017.a:"立傀儡厅，妆点门面"
 LYY_Event.6017.b:"罢其空谈，专任能吏"
 LYY_Event.6018.t:"不见其手先见价"
 LYY_Event.6018.d:"此手从不直下其令，惟使货款迟三日，航路贵半成，文牒只书常例，不书主名。商贾问其故，吏对曰此是行情；再问行情谁定，吏曰行情自定，非人所为。问者默然，退而自算，算至夜分，终不知何处吃亏。\n商会会长货滞于码头，损失日以千计，赴至冬衙门讨之。门者引至东廊，东廊推至西曹，西曹曰此非我职，当问船政；船政曰此属关税；关税曰此候上裁。自晨至暮，历五司，受其状者无一人。会长大怒，掷状于阶，拂衣而去，靴跟叩石，声闻半街，无人出视。\n达达利亚自帘后出，语管事曰：「彼行矣，恨且无所寄。」管事问所以。曰：「使人怨一人者，其怨有涯；使人怨无处可寻者，其怨自消。此术最净处，正在此。」管事低头记之，笔尖一顿，墨落纸上，洇成一团。文牒自玉京台顾问之廷出，薄纸小字，纸色微黄，笔画圆熟。"
 LYY_Event.6018.a:"以无形之手，暗中操盘"
 LYY_Event.6018.b:"光明正大，明令而行"
 LYY_Event.6019.t:"以商代战不血刃"
 LYY_Event.6019.d:"至冬兵法有上者，不动刀，惟饱之。城未开，粮先至；兵未进，债先行。市价一低，人心自散；工钱一发，壮丁自留。故其取城也，不闻鼓声，但闻秤响；不入城门，先入账房。各关抽成既立，商旅自改其道；改道既久，旧道自废。城中之秤，较城墙为固。\n有下属不解，问曰：「如此真能取胜乎。」达达利亚曰：「以刀取一城，须守之一世；以钱取一城，城自为尔守。」刀所至者墙，钱所至者心。城中父老不问兵至何日，先问粮价几许。以刀来者，人闭门；以钱来者，人开门迎之。尔试观之，市上谁为主，市中即为谁之城。\n言时语调平缓，几近于敬。下属问此术何人所授。达达利亚曰：「女皇授我。彼知何为不流血之胜，知得比谁都早。」语毕取案上一枚钱，置于灯下，曰：「此物不杀人，而人为此死。」粮自北船运至云来海，卸于东码头，麻袋堆高及檐。"
 LYY_Event.6019.a:"以商代战，喂饱这座城市"
 LYY_Event.6019.b:"以兵临之，速战速决"
 LYY_Event.6020.t:"至冬出饷璃月出命"
 LYY_Event.6020.d:"编制既分，籍册两色。至冬出兵、出饷、出械；璃月出丁、出夫、出命。册上并列，墨色一样，血一色。粮由北船运，饷由北库发，死者由本地收。饷厚于旧日军中三倍，故应募者塞门，父老送子至码头，多以饷厚相劝。册成，两营同阅，北人立于左，璃人立于右，中画一道白线。\n检阅之日，校场尘起。一璃月籍连长出列，执枪不举，问曰：「吾辈为谁而战。」四下一静，风过旗角，猎猎有声。达达利亚视之良久，曰：「尔为尔之饷而战。此语不美，然我不诳尔。」\n连长不退，复问：「饷尽之后，又为谁战。」达达利亚曰：「待尔自知为谁流血，勿恨我。恨我亦无益于死者。」言毕令继续阅兵，鼓复起，连长归列，枪仍不举，直至日暮。暮收操，两营各归其垒，营门相望，灯火相照，无一人喧哗。璃月港防籍册分两色，一青一白，青者北军，白者本地，分架而存。"
 LYY_Event.6020.a:"编友军，使其自守"
 LYY_Event.6020.b:"裁撤友军，纯用北兵"
 LYY_Event.6021.t:"不施刃而绝其路"
 LYY_Event.6021.d:"围城而不见烟。其术不遣一使，不发一檄，惟使不肯附者渐失所有。船不与之载，仓不与之赁，钱庄不与通，关吏见其名而多验三日。一月而货滞，二月而债逼，三月而门可罗雀。邻里初犹往问，后亦避之，恐沾其晦。\n商户鬻宅鬻田，不足偿债。尝至旧友门下求贷，友隔户语曰：「非我不肯，实不敢。」遂去，行于雪中，靴破，足趾见血。一日晨，人于河口见其衣浮于水，手犹握一纸，乃债契残半。舁归，妻孥环哭，四邻闭户，无一人前。\n消息至时，达达利亚方食。置箸，默坐良久，语副官曰：「送其家抚恤，厚些。」副官愕然。达达利亚曰：「非赎罪也。不欲使人谓不从吾者皆无后路。」那样太丑。语毕复举箸，饭已冷。是夜河口风起，纸灰贴水而走，守堤者见之，不敢言。荻花洲河口设闸，闸以木制，闸板厚三寸，启闭须四人。"
 LYY_Event.6021.a:"静默胁迫，令其自溃"
 LYY_Event.6021.b:"明正典刑，杀一儆百"
 LYY_Event.6022.t:"北国目光未曾移"
 LYY_Event.6022.d:"委员会之目，未尝一日离云来海。北国有簿，簿上记云来海一年之税、一季之船、一月之货，细至某港某日进某船。达达利亚取一分利，北国记一分；让一分利，北国亦记一分。十年之簿，厚可及膝。北使至，不问兵事，先索此簿。\n彼不恶此目，反以为幸。或深夜独坐，对烛自语曰：「谢此诸眼。有其在，吾终不敢尽纵。」人于无人处，最易不似己；有一目在背，尚知自持。副官问：「既畏其目，何不掩之。彼不答。」烛花忽爆，影动于壁，遂不复言。窗外潮声，一涨一落。\n副官入，见案上摊北国来信，旁置朱笔。问可要回书。达达利亚曰：「不必。彼看我，我亦看彼，隔海相看，彼此都省事。」遂取信就烛，烧其角，火至半而止，余半封好，收入匣中。簿为皮面，页以红线格之，格中填数，数皆朱笔。"
 LYY_Event.6022.a:"谨奉委员会之目，敛其行止"
 LYY_Event.6022.b:"我行我素，何惧人言"
 LYY_Event.6023.t:"丝愈远则链愈紧"
 LYY_Event.6023.d:"璃月之丝，行愈远，则其船愈不得不由至冬之航路。丝愈贵，链愈紧；市愈广，路愈窄。北船至，则丝价平；北船迟，则丝价踊，踊则织户加蚕，加蚕则愈待北船。织户不知，但知今年丝卖得好，明年可多养蚕十匾；船主不知，但知北船先到，己船后到，后到者价贱。\n一夕，达达利亚于灯下翻贸易报表，翻至中途，忽笑出声。副官问故。曰：「吾生未尝亲手缚一人，然再过数年，人将自悟，彼忙来忙去，忙入吾绳中。」副官问：「绳在何处。」曰：「在彼手中。」\n副官曰：「若有人悟而挣脱，奈何。」达达利亚曰：「欲挣脱者，必先知绳在何处。此绳无结，无头，亦无色，故无人指得。」言毕合卷，以指叩案三下，灯焰随之三摇。副官退，彼复取卷，阅至天明。云来之丝出璃月港城西织户，成匹以纸裹，纸上印织户名。"
 LYY_Event.6023.a:"以丝为链，徐缚其商"
 LYY_Event.6023.b:"断其航路，迫之就范"
 LYY_Event.6024.t:"印真而主非其人"
 LYY_Event.6024.d:"总督受印于旧七星之座。印文如故，印泥新赤，权亦如故，惟主非其人。印匣之下有旧册，册上名字半为墨涂，涂者皆近年新贵。座后壁画旧七星像，总督每入，必先一揖，揖毕方坐。每议事，彼先视帘后，帘不动，乃敢落笔。堂上诸吏皆知，亦皆不言。\n达达利亚时至厅末，倚柱观之，看此提线之人如何认真扮一位统治者。彼坐帘外，坐姿端正，如候考之童。有一次，总督退堂后问曰：「公何以来之屡。」达达利亚曰：「吾来看一人替他人活过一世，可有一日忽欲为己活一回。」\n总督笑曰：「此事必无。」达达利亚亦笑，曰：「吾亦以为无。」遂转身出，至门，忽住步，曰：「然人于夜半，常不自知。」总督立于堂中，未答，手按印匣良久。帘后无人，风动帘影，彼犹自端坐。印匣藏于璃月港府衙，铁力木所制，盖上有铜扣，扣已松，合之有声。"
 LYY_Event.6024.a:"立名义总督，借手治民"
 LYY_Event.6024.b:"废傀儡之名，自任其职"
 LYY_Event.6025.t:"千帆无一旗属我"
 LYY_Event.6025.d:"贡道之季，为一年最忙。货船自码头排至海平，桅樯相属，望之不断。挑夫昼夜不息，麻绳磨断者日以十计。税关前验票者六人，皆北人，笔不停手。夜则灯连如带，舟人呼号，声达于岸。市上酒价先涨，米价次之。\n达达利亚立于灯塔之上，看此一条金色之河。风大，衣角尽举，彼不动。塔有旧铁梯，锈迹斑斑，彼每上，必以手抚之。良久，语副官曰：「此诸船上，无一旗属我；然其所向之每一方，皆有我名。」\n副官默然，觉此语甚美，亦甚寒。日沉，海色由金转紫，末船之灯始现于天际。达达利亚下塔，行数级，复止，曰：「记此一日。」副官问何故。曰：「日后无人信，曾有此一日。」言毕复上塔，坐于栏上，望至天黑，不饮不食，亦不回顾。贡道自璃月港出，季在秋，樯属不绝，挑夫昼夜不息。"
 LYY_Event.6025.a:"经营黄金贡道，聚四海之利"
 LYY_Event.6025.b:"闭关自守，保境安民"
 LYY_Event.6026.t:"双手未染一人血"
 LYY_Event.6026.d:"达达利亚以两手自许：未尝亲手杀人，未尝亲书一恶。杀人者别有人，书令者别有人，彼但署名于末，或并不署名。凡有死者，皆有司具报，报上但书病故、溺故、盗故，皆有名有姓。手不持刃，亦不近血，故其手洁净，指甲修整，冬日不裂。\n一宴之上，有老绅士举杯当面誉之曰：「阁下难得，手上竟无一点惨烈。」达达利亚举杯致意，笑容合度，曰：「多谢。」遂一饮而尽，杯底向客，众皆称善，或曰此真君子。续有数人起而奉酒，彼一一受之，未尝辞一杯。\n酒入喉时，彼心中忽起无数无名之死者，面目模糊，如雾中列队。彼不动声色，复笑，往敬下一席。灯下杯影交错，无人见其手在袖中握而复松。至夜半散，登车闭目，车过石街，颠簸如舷。璃月港甲板签约之笔为乌木杆，杆上旧刻痕数道，乃历年所留。"
 LYY_Event.6026.a:"保此干净之手"
 LYY_Event.6026.b:"手自了之，以绝后患"
 LYY_Event.6027.t:"笑与刃同出一手"
 LYY_Event.6027.d:"笑与刃，常为一套动作之两半。彼能于酒桌之上称兄道弟，亦能于同一夜签去此人之全部家产。酒未冷，契已成；人未醒，产已易主。同席者但见其笑，不见其袖中纸角。契上字小，签者多不看。人皆以为交情，实则账簿。事毕，彼犹送之至门，嘱其珍重，送至阶下。\n有人当面问曰：「良心安否。」达达利亚曰：「安。」其人愕然，不能更语。彼补曰：「戏言耳，不安。然吾不以此一点不安，碍吾行应当做之事。」其人复问：「既不安，何为为之。」曰：「不安一事，行又一事。此谓吾对自身最后之诚。」\n语毕又笑。其人视其笑，忽觉背寒，遂托醉辞去。达达利亚送至阶下，执其手曰：「改日再饮。」归座，取杯复饮，杯中之酒已温，彼饮之如常。宴设于云来海船楼，菜以北地法烹，味重，酒烈。"
 LYY_Event.6027.a:"笑里藏刃，从容周旋"
 LYY_Event.6027.b:"直言相向，不假辞色"
 LYY_Event.6028.t:"不论血统论价钱"
 LYY_Event.6028.d:"利润之序，是至冬为此地所画之图。图上无血统，无乡愁，无旧籍，只有一行：「此笔买卖算得过来否。」算得过来者，虽仇亦与坐；算不过来者，虽亲亦出门。此图张于堂上，凡入者先见之。\n达达利亚以此图示一屋璃月官吏。诸人面面相觑，有低头视案者，有抚须不语者。有一人小声曰：「如此则旧族尽废。彼不答，但以指叩图。」良久，曰：「我知诸公嫌其冷。然冷有冷之用，彼不认人，亦不认仇。」\n曰：「出得起价，便给得起位。」世间尚有比此更公者否。满堂默然，无一人能遽对。末座一老吏欲起，半起复坐。及散，老吏至廊下，语其徒曰：「此图若行，吾辈皆为账上一行。」言毕，诸吏鱼贯而出，无一人回视。窗外海风入，吹图纸之一角，猎猎作响。玉京台议事堂中利润之图以厚纸绘，摊于长案，四角以铜镇压。"
 LYY_Event.6028.a:"定利润之序，以商理民"
 LYY_Event.6028.b:"守旧日规矩，勿扰其常"
 LYY_Event.6029.t:"密函末行亲手书"
 LYY_Event.6029.d:"使者夜至，衣上有霜，怀中一函，封泥未干，泥上印纹尚清。函中所列，非割地，非称臣，亦不易帜，惟求长租三事：港口、航路、盐铁。三事之外，别无所索，故受者难拒。字句斟酌至再，锋利处皆藏于常例之下，读之如读一份寻常关约。\n达达利亚阅毕，取笔于信末自添一行：「吾与尔者，一条可活之路，然其路实通向我。」写至此，笔顿，墨积于纸，久乃续成，末字之尾拖得极长，几出纸外。旁立书吏偷目视之，不敢问。彼搁笔，以掌覆其字，掌下微热。\n封好，付使者，嘱曰：「路上勿开，夜宿择有灯之处。」使者去，踏霜而行，街灯随步而灭。达达利亚立阶上，忽觉此语亦为自书，遂不复入，坐至天明，霜落满肩，晨起时衣已硬。自北国来密函至璃月港，封泥为红，泥上印纹为鹰，爪下有冰纹。"
 LYY_Event.6029.a:"递最后一封密函，示以底线"
 LYY_Event.6029.b:"不复通书，径自动兵"
 LYY_Event.6030.t:"不占地亦不称王"
 LYY_Event.6030.d:"其路有名，曰有利之和平。不占地，不称王，不立碑，惟为庄家。兵不出境，而利入其手；旗不易色，而港归其管。市易如故，税则暗改，民不觉其变，而岁入已易主。市舶司之旧吏仍坐原案，惟案上多一册，册为北文。\n有旧部问曰：「此岂非背女皇之志。」达达利亚曰：「志不书于旗上。」赢至终局者，常是坐于牌桌之侧、自始至终只收抽成之人。旧部默然，退而自思，终不解。其人去后，达达利亚以指叩桌，叩至第七下乃止。\n言毕，彼望窗外。海面平如镜，一无风浪。心中却转一念：女皇或亦早悟此理，故遣我来此。念至此，忽觉此局之大，非一人之力可揽，遂取酒自斟，饮至杯空，不复续，任其空置于案。夜深，灯芯短，光小如豆。庄家之利算于璃月港北账房，屋小无窗，终日点灯。"
 LYY_Event.6030.a:"成有利之和平，久居此地"
 LYY_Event.6030.b:"放弃代理，另谋他图"
 LYY_Event.6031.t:"鹰旗升半风忽止"
 LYY_Event.6031.d:"索求主权，是撕尽伪装之一刻。达达利亚亲执旗绳，将北国之鹰旗升于港口最高之杆。观者塞岸，无人语，惟闻绳过滑轮，格格作响。有老妇以手掩目，有兵士仰首而笑，有小儿骑父肩，指旗而呼。旗绳新，粗如儿臂，握之硌掌。\n旗至半杆，风忽止。旗垂落，湿软如雨后之布，贴在杆上，鹰首向下，爪亦向内。码头一片寂静，兵士仰首，民亦仰首，无一人动。远处有犬吠一声，亦止。有一兵士不觉垂手，枪倚于肩。达达利亚立于杆下，仰视良久。\n乃低声曰：「起。」声细，惟自知。语未毕，海风忽至，旗幅尽张，猎猎有声，如有人自天上一扯。岸上众人不觉齐退半步。达达利亚不复言，惟以手按绳，纹丝不放，直至日暮，掌上磨出血痕。璃月港旗杆为整木，高七丈，杆底以铁箍三道，箍已锈。"
 LYY_Event.6031.a:"索求主权，明张北国之威"
 LYY_Event.6031.b:"保留伪饰，徐图后计"
 LYY_Event.6032.t:"敕下千旗一时落"
 LYY_Event.6032.d:"并吞敕令颁下之日，云来海之水色较常为深，风腥，鸥鸟不落桅，亦不鸣。达达利亚不称胜，不入城，惟下一令：凡璃月商号之旗，尽降。令下之时，无人问降后如何，众人只问降于何时。\n令至码头，一老船主抱其船旗不肯释手。旗已旧，边角补过三处，上有其父手绣之字。兵士三人上前夺之，老翁伏地，以指抠板缝，指甲尽裂。旗终被夺，掷于舱中，舱板裂一声。老翁跪于码头，仰面而哭，声达于舱。哭声不高，断续如咳，岸上无一人应，亦无一人去。\n达达利亚远立，未前慰，语副官曰：「记其名。」副官问何用。曰：「将来必有人问此日之事，须有人答得出。」语毕转身，靴下木板作响，其声脆而短。身后旗绳空摇，摇至夜半，声细如诉。旗绳空摇，声细，岸上人皆仰首，久无一语，惟闻鸥鸣。"
 LYY_Event.6032.a:"颁并吞敕令，废其旧旗"
 LYY_Event.6032.b:"仍存其号，羁縻其民"
 LYY_Event.6033.t:"封尽海道不留隙"
 LYY_Event.6033.d:"封锁之令下，航道、渔场、港汊尽闭。哨船二十四只，昼夜梭巡，灯火相衔如链。三日之后，海面无帆，惟见鸥影；五日之后，鸥亦不来。滩上鱼烂，气闻数里，民不敢拾。\n一渔妇跪于封锁线外，膝下泥湿，怀中抱一孩，面赤而喘。守卒不纳，亦不驱，惟立而不视。妇膝下渐陷于泥，泥至踝。妇呼曰：「但求一船药，勿问余人。」呼声至暮，渐嘶，终不能成句。有卒背过身去，以袖拭面，为其队长所见，叱之归列。\n达达利亚于舰桥望之，久不动。暮色四合，乃命人送药一船，封锁如故。副官问：「既送药，何不开线。」曰：「可救一孩，不可因一泪而破此线。」堤破一次，再立不起。语毕下桥，衣角为风所卷，药船则逆浪而去，舟小，行缓，至夜深始抵岸。云来海哨船二十四，分三队，队各八，昼夜轮值，灯不相离。"
 LYY_Event.6033.a:"彻底封锁，不留余地"
 LYY_Event.6033.b:"网开一面，以示宽大"
 LYY_Event.6034.t:"儿郎为饷不为梦"
 LYY_Event.6034.d:"梦想之军，为至冬在璃月最精之众。人给一饷，饷足赡其家；人给一靴，靴底加厚。营中饮食有肉，月给三日之假，故应之者如归，募兵之榜未贴满三日，额已足。余者候于门外，愿减饷以求入。\n检阅之日，行列齐整，枪刺如林。一少年兵忽高声曰：「吾为主公之梦而战。」声出队外，众皆侧目，队长以目止之，少年不觉，犹举枪自誓。场上一时无他声，惟旗角拍杆。\n达达利亚下阶，行至其前，低声曰：「孩子，尔为饷而战。」少年面赤，欲辩。彼曰：「此无可耻。吾反敬尔。」肯为钱死者，终比口称理想而畏死之人诚实。语毕以手按其肩，少年不敢动，眼中忽有泪，然未落。达达利亚退，命人给此兵加饷一等。营中传为异事，三日犹有人私议。营在璃月港外坡上，帐以厚布为之，冬加毡一层。"
 LYY_Event.6034.a:"练梦想之军，厚饷养之"
 LYY_Event.6034.b:"薄饷练兵，务求省用"
 LYY_Event.6035.t:"一夜焚尽二百年"
 LYY_Event.6035.d:"焚册之令，不宣而行。夜半，库门开，册自架上一捆捆取出，堆于广场，高与人齐。二百年之田契、税簿、户籍，皆在其中，纸色黄，绳已朽，扛者稍用力，绳即断，册散于地，风翻其页，哗哗如语。\n火起，先燃边角，次及中段，纸卷受热而舒，如花之开。光映半城，人立远处，面皆赤，影拖于地，长可丈余。有老妇伏地，以手扒灰，取未烬之半页藏于怀。火势既盛，近墙之瓦皆裂，剥落有声，落于人之肩。\n一老人自人群中冲出，直扑火堆，呼曰：「此吾祖上传下之契。」两卒拦之，抱其腰，老人以手抓地，十指尽黑，犹向前挣。达达利亚视火良久，曰：「人最惧者，非失产，乃失其曾有此产之证。」语毕转身去，步比来时急，随者几不能及。焚册之广场在璃月港税关库前，石铺，火烧三日，石面炸裂数处。"
 LYY_Event.6035.a:"焚其旧册，断其念想"
 LYY_Event.6035.b:"保其文牍，以收人心"
 LYY_Event.6036.t:"海上初浮一层红"
 LYY_Event.6036.d:"其日无战，亦无炮声。港外海面，晨起浮一层淡红，随浪舒卷，至午不散。渔舟避之，绕行三里；有不知者撒网，网出，鱼色亦异，遂弃网而归。午后潮退，红痕留于滩石，如旧漆。有鸬鹚立于桩上，久不去，亦不捕鱼，若有待。\n达达利亚立于舰桥，久不作笑。副官侍侧，数欲言而止。海风入窗，吹动案上图卷之一角，卷上墨线为风所折。桥下有人报数，报至一半，亦止，众人乃知其数不可尽。\n乃曰：「今日死者之名，尽录之。」副官问：「录之何用。彼曰：他日必有人来问。」副官不解，然不敢再问，取册书之，笔迹数处歪斜。书毕呈上，彼接而自查，见一名字写得模糊，以指抹平，令重书，重书者手亦抖。册成，凡九十七名，末页空三行。荻花洲渔舟避之，绕行三里，网出水面，网眼皆塞以絮。"
 LYY_Event.6036.a:"以血立威，虽过不悔"
 LYY_Event.6036.b:"收手止杀，徐图安民"
 LYY_Event.6037.t:"对镜试作无面人"
 LYY_Event.6037.d:"冷面总督，是一种姿态：不亲民，不解释，不赴宴，只下命令。初至时，民有冤者拦舆呼诉，彼不答，惟以目视之，诉者自退。三日之后，无人再拦；十日之后，路遇者先行避道，童子见之亦止啼。吏有送文书者，入门先整衣。\n彼察之，璃月之人，竟更服一张无表情之脸。喜怒不定者，人轻之；一无所动者，人畏之。畏生于不可测，不生于严。市中已有传言，谓其夜不寝，坐至天明，左右皆不敢近。左右进言，皆不答，但令添烛。\n一夜，彼于府中据案对镜，试作数种神情：一怒，一喜，一悲。皆不似。末乃止于一张全然空白之面，不动不言。视之良久，忽觉面具之下者甚生，遂移目他视，取巾覆镜，命人将镜移出卧房。是夜无梦，亦无醒。璃月港府衙卧房之镜为铜制，径二尺，镜面有瑕，照人则影稍偏。"
 LYY_Event.6037.a:"任冷面总督，只施号令"
 LYY_Event.6037.b:"亲民示好，笼络人心"
 LYY_Event.6038.t:"粉墙四字大如斗"
 LYY_Event.6038.d:"驻军者，钉也。要塞、哨所、巡逻之队，一层铺一层，自港口至山道，凡三十七处。每处一旗，每旗一鼓，鼓不轻鸣，而人皆知其所在。哨与哨相距不远，以目可视，以号可应，夜则以灯三闪为信。\n达达利亚巡一新哨。哨成三日，墙上犹有湿痕。守卒二人立于梯上，以石灰刷字，刷至第四字，手臂已酸，字尾遂略歪。梯下有人扶桶，桶重，倾侧，灰溅其衣。\n彼问：「所书何字。」卒对曰：「安定繁荣。彼仰首视此四字，视之甚久，灰水自笔画末端滴下，落于其靴。」乃曰：「好。」写大些。使过者人人见之。卒问：「若人不信，奈何。」曰：「不信亦须见。」见之既久，即成其地之景。言毕自取一刷，补其歪处，一划而已。灰干之后，字白如新骨，远望夺目。粉墙在璃月港码头正面，白灰新刷，字以朱，远望夺目。"
 LYY_Event.6038.a:"广设驻军，钉死全境"
 LYY_Event.6038.b:"惟守要地，以省兵力"
 LYY_Event.6039.t:"火照半城无人救"
 LYY_Event.6039.d:"肃清之令既下，火自西湾起。渔船四百余，仓房一百二十，连樯接栋，无一得脱。火乘风势，越港而过，烟柱直上，半城之天皆赤，落灰如雪，积于瓦上，触之即碎。气热逼人，数街之外，面亦如炙。\n民立岸上，有水桶在手而不举，有呼其船之名者，有跪而拜者。火中爆声不绝，如豆在釜。有舟人欲解缆入救，为其伴所持，二人相扭于滩上，滚入浅水，衣尽湿。火光照其面，泪痕可见。\n达达利亚立于阶上，面为火光所照。忽问副官曰：「焚之愈多，所余者愈贵，是否。」副官张口，未敢答。彼亦不问，自视火中一桅，桅断，倒入水中，声如叹息。良久，乃曰：「记此火之数。」副官问：「记之何用。」曰：「他日算账，须有本。」副官乃记。火至天明犹有烟。璃月港西湾泊渔船四百余，船皆木造，火起则连烧。"
 LYY_Event.6039.a:"纵火焚港，绝其抵抗"
 LYY_Event.6039.b:"禁其焚掠，收其民心"
 LYY_Event.6040.t:"孩童问旗母不答"
 LYY_Event.6040.d:"主权港落成之日，码头插满北旗，自栈桥至税关，一杆接一杆，风来则同向而摆。税关旧匾卸下，换以至冬纹章，钉眼未补，雨入其中，渍成一圈黑。旧匾横于墙下，往来者皆绕之。地上遗旧钉数枚，无人拾。\n一璃月孩童仰首，指旗问其母曰：「旗上之鸟，是何物。」母低声曰：「是鹰。」童又问：「吾辈之旗何在。」声不高，而四下忽静，近旁数人皆侧耳。母手按童首，不使其再问。\n母不答，惟抱之更紧，以袖掩其面，转身欲行。童犹回望，恋恋不去。达达利亚适在数步之外，闻之，足下一顿，随即如常而行。行至税关阶前，忽命人取旧匾来，置库中，曰：「勿毁。」从者问故。曰：「先收着。」库门闭，锁加二重。言毕入关，关内北语喧然，无一字可辨。璃月港税关旧匾卸下，楠木所制，二人抬之，抬入库。"
 LYY_Event.6040.a:"立主权港，昭示天下"
 LYY_Event.6040.b:"维持现状，待时而动"
 LYY_Event.6041.t:"拳不轻出方为拳"
 LYY_Event.6041.d:"北国之拳，为至冬留于此地之最终常备之众。营在城外，械在库中，马不卸鞍，炮不覆布，操演如常，而从无鼓角之令。其众不再须战，只须在。在则人不敢动，动则人不敢言。每岁秋阅，甲光连野，民登屋而观，观毕即散，无一人拍手。\n一少年军官谒见，言曰：「终日操练，从无一仗，士卒以枪刺草人，刺至草烂，实在无趣。吾辈所学之技，将委于尘土乎。」达达利亚不即答，先令其坐，又命人取水与之。军官不坐，立于案前，案上摊图一幅，图角压以小石。\n军官不解。达达利亚曰：「最成功之军，乃从未得机会示其武力之军。」示者必已失其用。军官若有所思，退至门，复问：「然则吾辈所学，终归于无用乎。」曰：「刀在鞘中，方是刀。」出鞘者，多不归。言毕低头，以布拭枪，拭至枪机发亮。拳营在璃月港外，墙以土夯，墙外即田，田中有牛，牛不惊。"
 LYY_Event.6041.a:"练北国之拳，常备不懈"
 LYY_Event.6041.b:"裁撤冗兵，以省军费"
 LYY_Event.6042.t:"冰之座上受加冕"
 LYY_Event.6042.d:"冰之座者，达达利亚在璃月自置之终途也。座取整块寒玉凿成，凿半载方就，坐之则寒气自股而上，直透骨髓。\n加冕之日，踞座受贺。礼官唱名，钟鼓三鸣。彩带自楼头垂至街心，风过则乱，乱而复垂。商贾夹道，甲士按刀，无一人仰视。\n乐将止，其心忽空。四顾欢呼，忽忆昔年立于船头，所见亦是此景，乃悟居玉座与居甲板，孰为安稳，未易言也。\n此念旋起旋灭。面上不动声色，惟以手按冷扶手，按之愈紧，指节皆白。\n礼成，众请其言。达达利亚曰：「今日以往，此港归我。」账重记，人勿擅动。三语既毕，起身离席，行比来时更疾。\n座成之日，匠人问：「可刻名号否。」曰：「不必。」又问：「然则刻何。」沉思半晌，曰：「一字亦不必。」\n后来冰座空置良久，日日有人拂拭，无人敢坐。寒玉不化，亦不添温。殿在玉京台，冰座取寒玉，出北地山中，凿时玉屑如霜，落满一室。"
 LYY_Event.6042.a:"登冰之座，就此定鼎"
 LYY_Event.6042.b:"急流勇退，另择归途"
 LYY_Event.6043.t:"冬之主权落南方"
 LYY_Event.6043.d:"冬之主权者，此路终局之状也：璃月不复称璃月，只作至冬版图上一块带暖意之南鄙。\n达达利亚掌此地既久，梦乃愈多向北。冰雪、荒原、当年雪中初握枪之少年，皆入梦来。醒则满室皆暗，不辨所处，必危坐良久方能起。\n一夜忽谓侍者曰：「为我取一壶北国带来之酒。」侍者问：「今夜是何日子。」曰：「无日子。」侍者不敢再问，取酒以进。酒色浊，倾入盏中，浮细霜一层。\n饮半盏，置盏。又曰：「此酒在北国，不值一钱。」侍者应声。徐曰：「及至此处，便成珍物。」人事多如此。\n是夜坐至天将明。窗外璃月暖风，风中有桂花气。嗅半晌，起身闭窗。\n其后每月家书至，皆纳于衣袋，一封未答。一岁梦闻雪落之声，醒问侍者：外间雪否。侍者曰：「无。」达达利亚哦一声，复卧。雪落于璃月港，薄而不积，晨起见瓦上一白，午则尽。"
 LYY_Event.6043.a:"以冬之主权，终此一役"
 LYY_Event.6043.b:"留下一线，日后好相见"
 LYY_Event.6044.t:"港口孩童之铁环"
 LYY_Event.6044.d:"孩童之戏，达达利亚于诸事中独许自己松一松处，亦仅此一处。\n乃于港中空地铺沙，令难民子弟滚铁环、跳格子，日暮则收，收时按人头发麦饼一块。\n一日有小儿近前，怯问曰：「汝为恶人否。」达达利亚笑曰：「我亦不甚自知。待汝长大，自去判之。」小儿问：「如何判。」曰：「汝须先活着，方能判。」\n小儿似解未解，抱饼而去。达达利亚望其背影，立良久。风起，吹动衣角，亦未动。\n此儿在港中长至十六，入铁匠行。一日炉边有人问：「当日那位大人作何形状。」思良久，曰：「记不得了。」只记得饼尚温。\n此语后传至月海亭。达达利亚闻之，笑而不语。是夜命人将港中麦饼加厚一成。\n那片沙地后铺石板。铺时老铁匠拦之，曰此处原是孩童戏处。管事以报。次日石板撤其半，留当中空地一块，四周砌矮墙。矮墙至今犹在。沙铺于空地，沙自滩头担来，中有细螺，孩童拾之，藏于衣袋。"
 LYY_Event.6044.a:"纵孩童嬉戏，自宽其心"
 LYY_Event.6044.b:"严束部下，不得懈怠"
 LYY_Event.6045.t:"巨渊黑线不载册"
 LYY_Event.6045.d:"巨渊走私者，一条连至冬公文亦不敢明写之黑线也：矿料、旧物、乃至人口，一批一批运出层岩。\n达达利亚于此睁一眼闭一眼，只取定额抽成，余者不问。有部下以为纵容，进言曰：「此辈不可长。」\n曰：「治国者，须与胆大之人留一条活路。不留，彼自寻别路，别路往往更难收拾。」言毕又曰：「何况那条路上之货，大半运回北国。」部下无语。\n此线后亦断过一回。断之年，港中铁价涨三倍，铁匠闭七家。次年命人重开，抽成加倍。或问何故。曰：「太贱之物，人不当一回事。」\n重开之后，港中铁价一年复旧。断线那年旧账，一直挂在北国名下，未尝销去。\n管此线者后换三任。三任皆在任上发财，亦皆在任上被查，查出之数一笔不差。或问何以查得这样准。查者曰：「账皆其自记。」记得太清，反倒自害。驳船自层岩下，行一夜至港，船底压水，行缓。"
 LYY_Event.6045.a:"默许走私，抽成分利"
 LYY_Event.6045.b:"严禁私运，整肃港口"
 LYY_Event.6046.t:"桅顶之上看全港"
 LYY_Event.6046.d:"舰队桅顶，云来海最高处也。达达利亚常独攀而上，一坐半日。\n自其上俯瞰，全港如棋局摊开。海面静得能照出云影，影动而水不动，风至而声不起。\n常想：立得这般高，本该看得更远。然所见者，仍只这些船、这些货、这些永远收不完之账。\n一念及此，便不下来。水手在下呼唤，应一声，仍不下。\n一岁于桅顶过夜，天明方为水手所见。水手问：「不畏坠乎。」曰：「畏。然上面清静。」\n后桅顶横木为人加宽一尺，加者乃副官，加毕未请示。达达利亚见之，不责，亦不谢。\n此后上桅顶之数多于一岁，坐时亦长。\n末次上桅顶，在离港前一日黄昏。只坐一刻便下。副官问何故。曰：「见者已尽见矣。」又问：「未见者何如。」曰：「须落地方能见。」\n那横木上加两道绳，副官所系，系得极紧，风吹不散。桅顶横木窄，容一足，上系二绳，绳结为双套。"
 LYY_Event.6046.a:"独上桅顶，俯瞰此城"
 LYY_Event.6046.b:"身入局中，亲理庶务"
 LYY_Event.6047.t:"一封北国寄来书"
 LYY_Event.6047.d:"家书自北国来，行三月始至，封皮上印七道，色深浅不一，盖逐驿所加。\n发书者，其幼弟弱妹也。书中画屋一区，墙柱歪斜，屋上画烟三道。字稚拙不成体，且误一字。\n达达利亚展书读之，一遍复一遍，读毕折而纳诸怀。顾谓副官曰：「汝且出，吾欲独坐。」\n副官退出，未远，立于舷侧。是夜舱中不燃灯。达达利亚危坐至晓，未尝移席。\n诘朝出舱，面上复有众人习见之笑容。一卒问曰：「夜来睡得安稳否。」达达利亚曰：「甚安。」语毕径往校场观操。\n其后此书展玩既久，纸角尽起毛。一岁海雾大作，于舱中燃灯，摊书于案，逐字观之，至天明乃止。书上误字，终未改易。\n弟妹笔迹后渐端整，盖月寄一书，往复相勖所致。\n又其旧衣磨破一角，自取针线缝之，线脚外露，缝不端正。副官见，请为重缝。达达利亚摇首曰：「不必。」衣破而后见行路之迹。自是不复更易此衣。书至璃月港，封皮七印，印色深浅不一，乃逐驿所加，最后一印最淡。"
 LYY_Event.6047.a:"珍藏家书，独自思乡"
 LYY_Event.6047.b:"毁弃家书，绝其牵挂"
 LYY_Event.6048.t:"血酬开卷账千行"
 LYY_Event.6048.d:"血酬者，云来海三年战事摊开之一本总账也：死几人、费几钱、易得几处土、几道航路，逐项列明，无一处含混。\n达达利亚自首行看至末行，未发一语。帐房侍立，汗出如浆。\n良久曰：「把这些数，另抄一份与我。」帐房应诺。又曰：「我要看看，用多少条命，买下这一片海。」\n抄本呈上，厚不盈寸。达达利亚接之，纳入怀中，与家书同放一处。\n末栏之后有个总数。看三遍，取朱笔于数旁画一圈，圈画得极圆。帐房问：「何故画圈。」曰：「此数我记着。」\n此后每岁岁末，皆取抄本看一遍，看到彼圈，往往要停一停。\n抄本后随其登船，又随其归北国。归国之日行装极简，只有两只箱子。一只装军械图，一只装此物。关吏问箱中何物。曰：「账。」关吏不敢开。箱为铁皮所包，箱角有凹，乃搬运所磕。"
 LYY_Event.6048.a:"收下血酬之账，独自细看"
 LYY_Event.6048.b:"封存此账，不复提起"
 LYY_Event.6049.t:"港头升起至冬旗"
 LYY_Event.6049.d:"接管璃月之日，至冬之旗升上港口最高之杆。绳新换，旗及顶时抖一抖，方展开。\n达达利亚立于旗下，俯视此城。此城乃其花数年打下之城，然而并无意想中之得意。\n忽忆初来黄昏，忆关外跪求一车粮之老人，忆自己说过那句话：慈悲救不了一座将倾之山。\n言犹在耳，山已易主。闭目立良久。\n再睁眼时，海风依旧，旗声依旧。街市照旧开着，卖鱼者照旧天未明便挑担出，见旗亦不抬头，只将担子往边上挪一挪。\n后闻人言此事，笑一笑，命人将那条街之税减半成。\n那一日最欲为者，却是回北国。此事未对任何人言。\n立城头至日落。日落之后港口点灯，一盏一盏，自码头点到半山。数至一百二十余盏便不数。顾谓副官曰：「这些灯，皆替旁人点。」副官问：「替谁。」曰：「替我不识之人。」璃月港旗绳为新换，麻质，绳端系于桩，桩上有旧绳痕。"
 LYY_Event.6049.a:"升起旗帜，接管璃月"
 LYY_Event.6049.b:"择日撤军，还政其人"
 LYY_Event.6050.t:"云来之约成一部"
 LYY_Event.6050.d:"云来之约者，至冬在璃月之总章程也：租约、债券、航图、军约，尽收一册，页页编号，不容抽换。\n达达利亚审至深夜，烛换三枝。至末，于扉页落笔：此约由强者签订，须由弱者长久遵守。\n写毕自怔一怔，随将那一页轻轻撕下，未入册。\n撕下之纸折三折，纳于怀中，与家书、血酬抄本同放。此乃其在海上唯一不肯交与旁人之物。\n窗外天色将明。宣读者后念至抚恤一条，嗓子哑，换一人续念。两侧坐者，无一起身。散时天已黑透，中堂之灯亮至四更。\n那一册后存入库中，编号在末。库吏曰：「此册最厚。」\n册后抄两份，一份存北国，一份存港中。存港中者第七页缺一角。缺角之处，原写抚恤一条。库吏请补抄。管库者曰：「缺着罢。」缺一处，人还记得那一处。册页编号以朱，页边加线，线为手绘，不齐，藏于璃月港库。"
 LYY_Event.6050.a:"立云来之约，以定此事"
 LYY_Event.6050.b:"放弃立约，只凭刀兵"
 LYY_Event.6051.t:"玉衡关门不见使"
 LYY_Event.6051.d:"使者赴玉衡，归时只报一句：「刻晴未之见。」\n达达利亚听罢大笑曰：「好，好。我所最好之敌，恰是此种连面亦不肯见、却能把我所算猜去八九分者。」\n言毕即命人送一船军械往玉衡。副官不解，曰：「此非资敌乎。」\n曰：「算得过账之敌，比只会喊口号之敌，更值我送枪。」副官问：「何也。」曰：「前者还讲规矩，后者只把规矩当怯懦。」\n那船军械行至半途，为玉衡原封退回，附书一纸，只有四字：「不必，谢了。」\n达达利亚看那纸，笑意更深，命人裱起，挂于舱中。此后每有来使，皆指那纸与人看。\n那纸裱毕之后，每岁换框一次，凡七易。末次换框时，其人已不在云来海。换框者照旧例办，办完将旧框弃之。旧框背面有一行小字：「不可轻此敌。」\n此后玉衡来使，皆先看那纸，再谈正事。一使问：「此纸何用。」答曰：「无用。」看看便知。玉京台门吏每日换班四次，换班时以簿相授。"
 LYY_Event.6051.a:"赠与军械，偿其所怀"
 LYY_Event.6051.b:"断绝往来，不助敌手"
 LYY_Event.6052.t:"群玉阁谈三个时辰"
 LYY_Event.6052.d:"群玉阁使者谈三时辰，所说皆利，无一语及义。\n达达利亚回船，谓副官叹曰：「凝光乃吾此生所见最似同类之敌。其与吾一般，皆信天下之物可定价。」\n副官问：「既为同类，何不相与。」\n曰：「同门手艺之人，注定成不了朋友。」副官不解。又曰：「二人皆精于算，一处买卖，只容一人执秤。」\n言至此，望海面出神。末乃笑曰：「幸而不成。若成，局面反不好看。」\n是日谈判案上摆两份礼单。她那份写绸缎、盐引、船位，他这份写军械、账册、一处坞。两份皆非祝福。散时她未送，他未留。各走各路，走得极干净。\n谈毕，群玉阁送茶叶一匣。达达利亚收下，未饮。茶在匣中放三年，霉，命人连匣埋之。埋时立旁片刻。埋毕便走，未留话。\n那匣茶后出土，匣已朽，茶已成泥。掘者不识，弃于沟中。茶过三泡而味尽，掌事者不换叶，只添水，客亦不问。"
 LYY_Event.6052.a:"敬其为同类，两不相欺"
 LYY_Event.6052.b:"以诈对诈，小心提防"
 LYY_Event.6053.t:"月海亭信里争人"
 LYY_Event.6053.d:"月海亭回书，乃诸家之中唯一带人情者。甘雨曰：「海水可让，港口可谈，月海亭之人，一个不能少。」\n达达利亚捏那封信，忽然笑曰：「此种人最难对付。」她所争者非钱，而在人。\n副官问：「争人者何以难。」\n曰：「肯为治下百姓较真之人，比只会算钱之对手危险得多。算钱者，价钱谈得拢便罢；争人者，汝出多少，她皆不卖。」\n语毕，将信收好。收得比平日仔细，折三折，压平方入袋。\n那封信后抄一份，与家书同放。抄写之时，亲校一遍错字。校完又看一遍，未改。\n甘雨后亦来一封，只问一桩：月海亭旧档可还在。答三字：「都在。」此后命人将那批旧档搬去干燥处，搬七日。搬毕往看一遍，一册一册点数，数至末册方走。\n那批旧档后编号入册，凡三百二十七卷。册首注一行：「此档曾有人问。」旧档自库中取出，纸已脆，翻时以竹片挑起。"
 LYY_Event.6053.a:"敬其为人，另议其民"
 LYY_Event.6053.b:"以利相诱，不必当真"
 LYY_Event.6054.t:"绝云八字不低头"
 LYY_Event.6054.d:"绝云间回信，只八字，写在雪白绢上：「路可让，人不低头。」\n达达利亚读绢良久，手中抚枪。枪在指间转半圈，又转回。\n低声曰：「此世上吾最敬之敌，乃此种连价钱亦不肯报者。吾知其答语，比金子贵。」\n副官在旁，问：「既如此，何必再问。」\n曰：「要问。不问，便不知其犹肯不肯开口。」肯开口者，总有得谈；不肯开口者，只能等。\n那片绢后夹在一本账册里。账册乃云来海盐账，翻到那一页，前后皆是数。翻者多半不解，只当书签。达达利亚不解释，亦无人敢问。\n绢边后添一小孔，乃虫蛀所成。见之，命人作薄匣，将绢平铺其中。匣盖不题字。或问匣中何物。曰：「一句话。」问者不敢再问。此后每有海上新规，必先问一句：「绝云间那边，肯不肯开口。」素绢为山中自制，经纬略疏，边角有折痕数道。"
 LYY_Event.6054.a:"珍藏那片白绢"
 LYY_Event.6054.b:"弃之如鄙，不以为意"
 LYY_Event.6055.t:"沉玉谷之泥腿使"
 LYY_Event.6055.d:"沉玉谷使者最不似使者：一身泥，一脸倔，所谈者水、土、谷种，半点不及金银。\n达达利亚听完回报，第一次停手中之枪，曰：「有点意思。」\n侍者问：「何处有意思。」\n曰：「这世上找我之人，多半要钱。」他只要我一件：莫动那片谷地。\n静片刻，吩咐下去：沉玉谷之事，先搁着，勿动。属下问何故。曰：「我要看看，她能守多久。」\n那片谷地终未动。使者后又来三回，每回带新米一袋。米装粗布袋，袋口以麻绳扎。达达利亚置袋于案，看两日方煮。煮时只放水，一点盐亦不加，曰：「米自身有味。」\n那袋米吃了一整年。吃完剩一空袋，叠好，压于箱底。有人见那袋子，问是何物。曰：「一袋米。」那人笑，说米袋何必留着。曰：「所留者非米袋。」\n使者末次来，带谷中童谣一首，写在粗纸上。达达利亚读毕，命人抄存。使者自翘英庄来，行三日，鞋底泥厚，入帐犹带草气。"
 LYY_Event.6055.a:"暂不动沉玉谷，静观其变"
 LYY_Event.6055.b:"即刻开发谷地，勿失良机"
 LYY_Event.6056.t:"总章程铺满长桌"
 LYY_Event.6056.d:"一纸总章程摊在长桌上，厚如砖。达达利亚逐页审，改至深夜，朱笔批注密于行间。\n至末，于扉页写下那句：「此约由强者签订，须由弱者长久遵守。」\n写毕怔一怔，随将那一页撕下，未入册。折好，纳于怀里，像是收进一个不愿被人看见之念头。\n窗外天色将明。海面旗帜在风中作响，声连成一片，听久反倒像静。\n后又改七处，每一处皆在数目上减，不在道理上减。帐房不解。曰：「数目既减，人才记得住道理。」\n撕下之纸后抄一遍，抄本寄回北国。寄时未写附言。北国回信只有三字：「知了。」达达利亚将信亦纳入怀中。此后云来海之事，北国不再细问。\n章程颁下之后，港中租约、债券、航图，皆按册归档。归档吏员后病，病中仍记着第七页有一处数目对不上。乃书于纸，交付继任者。继任者看了，未改，只于旁注两字：「存疑。」长桌以两案并成，接缝处垫以纸，纸上压铜镇。"
 LYY_Event.6056.a:"立章程，治其地"
 LYY_Event.6056.b:"废章程，仍以军法治之"

 YLH_Spirit_Fatui_Enforcer:"笑中一柄刀"
 YLH_Spirit_Fatui_Enforcer_desc:"其人笑则满座皆欢，而其刀未尝自沾血。凡欲去者，不必亲往；凡欲立者，不必自言。海上诸家，闻其名而先自量力。船长尝问其不杀己何也。答以杀汝须费一船，留汝可得十船。船长又问然则当自庆乎。答以不必庆，汝之十船已在吾账上。船长归，检其账，果有之。其人坐于璃月港北账房，屋小无窗，终日点灯。"
 YLH_Spirit_Commissions_Gaze:"北国眼不闭"
 YLH_Spirit_Commissions_Gaze_desc:"北国之视，昼夜不歇。使者居馆，门外有卖饼者，行有随者，坐有邻者。初至者怒，欲逐之。老者止之，谓逐之则更密。怒者问然则任其视乎。老者乃言：视者在彼，行者在吾；彼视吾所行，吾亦可视其所视；且人在侧，则行不敢纵。怒者又问此视亦护我乎。老者不答，惟指其袖。是夜使者取纸，书卖饼者之状，藏于枕下，谓此亦一簿。使馆在璃月港东，门外卖饼者三人，轮换而不相语。"
 YLH_Spirit_Peace_With_Profit:"取利不取土"
 YLH_Spirit_Peace_With_Profit_desc:"不占其地，不称其王，惟坐于牌桌之侧，凡出入者皆抽其一。初，诸家以为易与，争与之盟；久之，乃觉所输者不在战场，而在账上。有怒者拔刀，欲斩之。其人不动，但取账示之曰：「汝之粮、之械、之舟，皆自此出。斩我，则此三物明日皆绝。」怒者视账良久，收刀，坐，饮尽一爵而去。牌桌设于云来海船楼之上，桌布为北地所织，厚而粗。"
 YLH_Spirit_Cold_Governor:"冷面不生春"
 YLH_Spirit_Cold_Governor_desc:"一张无表情之面，较一张笑脸更能令人从命。属吏入见，先自检其衣，恐一言不合。老吏事之十年，未尝见其笑，亦未尝见其怒。或问此人无情乎。老吏答以非无情，乃藏之。问藏于何所。老吏指其面，谓在此下。问可复出乎。老吏良久乃言：戴之久者，恐已与肉合。言毕，自抚其面。府衙在璃月港城西，堂上不设屏风，坐者面门而背窗。"
 YLH_Spirit_Throne_of_Ice:"座上忽觉空"
 YLH_Spirit_Throne_of_Ice_desc:"其人高居座上，阶下为全港之臣。乐作，酒行，众皆举爵，呼声动屋。乐止，众俯，殿中忽静。当是时，其人忽觉胸中一空，如战前之顷，四顾无人可与语。乃问左右曰：「此港既服，此后何往。」左右对曰：「惟命。」曰：「惟命者，无人也。」遂罢宴，独留灯一盏，坐至天明。殿在玉京台，灯一盏置于案左，焰小如豆，至晓不灭。"
 YLH_Spirit_Cloud_Sea_Accord:"强者立弱者守"
 YLH_Spirit_Cloud_Sea_Accord_desc:"此约由强者书之，而责弱者守之。书成之日，强者饮于堂上，弱者立于阶下。少年问既不平，何不拒。弱者答以拒则先死。少年谓守之亦死。弱者曰：「守之，死于迟；拒之，死于今。」少年不语。后十年，强者势衰，弱者持约至其门，曰：「此约尚在，请守之。」强者视约，久不能言。约成于云来海舟中，两案相对，中置一几，几上惟约。"
 YLH_Spirit_Mercenary_Honesty:"忠信亦有价"
 YLH_Spirit_Mercenary_Honesty_desc:"其忠有价，其价有目，书于契上，不待将问，亦不待将猜。或讥之，谓为钱而死者，何忠可言。其首答以：为钱而死者，死时知己为何死；为名而死者，至死不知。讥者不能对。是军出战，先受半饷，归则受其全。战没者之饷送至其家，封上无字，惟印一记。家中人问此记何意，送者答以此君之值。饷册藏于璃月港东码头营，册以布裹，封上印一记。"
 YLH_Spirit_Northern_Arsenal:"霜纹兵先至"
 YLH_Spirit_Northern_Arsenal_desc:"北国之械，箱上印霜纹，纹下印四字：「货到付款。」初，受者以为戏，及开箱，械皆新，油未干。将问若款不至，械何如。使者答以械已至，款自当至。将又问若终不至。使者笑谓则下一次箱不至此港。将视其箱，霜纹已为雨所蚀，而其字犹可辨。是岁港中欠款者三，次年皆清。械箱卸于璃月港东码头，箱上霜纹为烙印，气味经月不散。"
 YLH_Spirit_Grey_Captains:"灰袍识海深"
 YLH_Spirit_Grey_Captains_desc:"灰袍之众，或私贩，或护航，或代人收债，诸业皆尝。港口之深浅、潮之早晚、礁之所在，皆记于心，不著于图。官问其何不献图。其首答以图在脑，不在纸；纸可夺，脑不可夺。官乃言国之舟须其引。答以可。官问何以酬。答以不酬，但许吾辈仍着灰袍。官许之。自是港口之舟，皆随灰袍之后。灰袍之众聚于南十字港，坐于石阶，阶面为足所磨。"
 YLH_Spirit_Sea_Lanes:"海图系人颈"
 YLH_Spirit_Sea_Lanes_desc:"今日为汝逐盗，明日此图在吾手，则汝之出入，皆须问吾。市舶使至，欲取其图，许以重金。其首答以金可尽，图不尽。使者问图何以为不尽。答以图在吾心，吾死则图亡，故吾在则图在。使者谓然则汝不死，此海不安。其首曰：「此海本不安，吾特使不安者有序耳。」使者归，以语其主。其主良久，曰：「此人不可杀，亦不可亲。」海图藏于南十字灯塔，图以厚纸绘，礁以朱点，浅以墨。"
 YLH_Spirit_Dream_Army:"饷足士不疑"
 YLH_Spirit_Dream_Army_desc:"其军械精，其饷厚，其士不疑。或问钱可买勇乎。其将答以钱不买勇，买一死之由。问何谓死之由。答以士不畏死，畏死而无名；饷足则家有所养，约明则死有所归；二者既具，士自不疑。是军临阵，无鼓而进，无金而退，退时阵不乱，伤者皆舁归，无一弃于野。营在璃月港北，营门相望，灯火相照，夜无一语。"
 YLH_Spirit_Five_Envoys:"五旗一试敌"
 YLH_Spirit_Five_Envoys_desc:"五旗各树一方，旗色不同，所遣之人亦不同。有不受者，则遣一舟军械至其港，不索价，亦不附书。或问既不受我，何馈之。答以此非馈也，乃试。问试何事。答以试其受不受：受者可与言，不受者亦可与言，然须换一法。是岁五方之中，受械者三，闭港者二，而二港之内，皆有人私至。五旗分树于云来海五处，旗色不同，风至则同向而摆。"

 YLH_War_Tier_1:"战备之阶"
 YLH_War_Tier_1_desc:"战备废弛，军械生锈，军心涣散。连码头边野狗，亦敢在军械箱上撒野。军械库三钥，其一已失；箱上封条为雨所蚀，启之，内有旧枪二十，皆不能击。校尉点卯，名册三十人，实到十一。"
 YLH_War_Tier_2:"战备之阶"
 YLH_War_Tier_2_desc:"战备初具，操练照常，枪能响。只是响得有点勉强，像是在替谁交代差事。靶场每日有人，而人各持一枪，枪各配五弹，弹必尽数报，不许多。老卒私留一弹以校枪膛，为巡者所劾，罚饷半月。"
 YLH_War_Tier_3:"战备之阶"
 YLH_War_Tier_3_desc:"战备可战，令下即动，进退有据。云来海之兵，始有军队模样。夜半试鼓，三通而三营齐集，集而后点名，无一缺。鼓止，各归其营，道中无一人交语。老卒谓此十年未见，乃于营门外立良久。"
 YLH_War_Tier_4:"战备之阶"
 YLH_War_Tier_4_desc:"战备如锋，刀出鞘，血立见。力来得又快又硬，硬得握刀之人亦开始怕自己。一令既下，三日之内破两隘，尸填沟渠，无人收。有卒归营，洗手至夜不净，坐于帐外，见人来则避。校尉问之，答以手上有味。"
 YLH_War_Tier_5:"战备之阶"
 YLH_War_Tier_5_desc:"战备滔天，举云来海之力，可撼一国。然一支部队强到无所畏惧，其先失者，往往便是分寸。兵过村而不入，非有令也，无所畏也。村人以酒犒之，不受；以水奉之，亦不受。村老立于道旁，谓其孙曰：「此兵可胜，不可亲。」"
 YLH_Blockade_Tier_1:"封锁之阶"
 YLH_Blockade_Tier_1_desc:"封锁虚设，航线照旧，货船往来。所谓封锁，不过几艘泊在湾里晒太阳之船。巡船日出海，午后即归；其为巡者，只在湾口绕一周。商船过其侧，互相呼声为礼。吏登船点验，所验者惟文书，不验货舱。"
 YLH_Blockade_Tier_2:"封锁之阶"
 YLH_Blockade_Tier_2_desc:"封锁初张，关卡立起，稽查加严。商船开始绕远路，抱怨声也跟着起来了。关前设棚，棚下列案，案上摊册。过船须报所自、所载、所往，三者相符乃放。船长算其绕路之费，谓一月多耗三日，货损一成，而无可告。"
 YLH_Blockade_Tier_3:"封锁之阶"
 YLH_Blockade_Tier_3_desc:"封锁成形，航道收窄，货价腾贵。此港每一次心跳，皆合上至冬节拍。盐价一月三涨，米价随之上；小铺先闭，大铺减半。妇人持旧票至盐号，号中人验票，谓此票价与今不同，须补。妇人立于柜前半日，终无所补。"
 YLH_Blockade_Tier_4:"封锁之阶"
 YLH_Blockade_Tier_4_desc:"封锁如环，铁环合拢，寸板难入。被饿之城，比被烧之城，更易学会听话。港中鱼市先空，次及菜市，次及炭市。有船夜出，遇巡船，弃货而返，自此无人再试。守关者日只一事：验印、放行，或摇头。"
 YLH_Blockade_Tier_5:"封锁之阶"
 YLH_Blockade_Tier_5_desc:"封锁如渊，水泄不通，生机尽绝。极端之封锁榨干此海最后一滴利，亦埋下再也收不回之怨。港中旧有渔户三百，存者四十；旧有船行十七，存者二。老渔人凿其舟，凿毕坐于船中，随潮而去，无人拦，亦无人救。"
 YLH_Combo_Twin_High:"战封并举"
 YLH_Combo_Twin_High_desc:"炮口对着港口，账本压在岸上。赚得快，恨得也快。港中一日之利，抵旧年一月；而港中一夜之案，亦抵旧年一月。更夫言，近来夜里死者多不着衣，衣皆为利故，吏不书其人，只书其数。"
 YLH_Combo_Twin_Low:"师老财尽"
 YLH_Combo_Twin_Low_desc:"兵不愿打，商不肯来。船停在港里生锈，账房关了灯。饷欠三月，兵鬻其械以食；税欠半载，吏鬻其册以归。老校登桅视之，见港中桅樯皆斜，谓其徒曰：「此港要睡了，睡醒须换一船人。」"
 YLH_Combo_A_High:"穷兵黩武"
 YLH_Combo_A_High_desc:"刀磨得锃亮，封锁却形同虚设。打得越凶，油水越薄。兵日增而关日松，商船自小路入，税吏不问。校尉请增巡，主者拨船三艘，而三艘皆旧，出港即须修。校尉立岸上，视其船，不言语。"
 YLH_Combo_B_High:"锁而不战"
 YLH_Combo_B_High_desc:"海路卡得死死，炮口却始终未响。彼等在等对方先饿，亦在等自家耐心先尽。关前船列三里，日以望远镜相望，无一船先动。守关者与被困者对坐三日，各不生火，惟闻潮声。至第四日，困者先炊，守者亦炊。"

 #################### 公子 · 至冬干涉军 · 战后 ####################
 YLH_PW_The_Eagle_at_Anchor:"鹰旗半卷湿风里"
 YLH_PW_The_Eagle_at_Anchor_desc:"内战停火之清晨，云来海之雾未散。达达利亚命人将至冬鹰旗升上最高一桅，旗于湿风里半卷，欲展不能。码头一片安静，惟闻缆索相摩。彼立旗舰船头看良久，乃语副官曰：「自今日起，此港之进出归吾管。」账须重记，人勿乱动。副官应诺，退三步，立于其影中。"
 YLH_PW_Clear_the_Ashes:"先数户口后拆墙"
 YLH_PW_Clear_the_Ashes_desc:"清墟之役，达达利亚亲遣人往：拆墙、收尸、记名，三事并行。彼于断墙之侧立一上午，忽问身旁老吏曰：「此一片原住几何户。」老吏张口而不能答。彼点头曰：「则自今日始数之。」数清而后动工。老吏取册，笔在手中转半晌，方落第一字。风过墟中，纸灰贴墙。"
 YLH_PW_Grain_for_the_Starving:"码头搭棚施粥"
 YLH_PW_Grain_for_the_Starving_desc:"赈棚设于码头之侧，草席为顶，一日两顿稀粥。粥薄，可照见碗底。有吏问粮从何来，达达利亚曰：「先向北国赊之，赊来之粮，亦是粮。」队中一妇人抱子而立，子啼不已，妇人以指蘸粥哺之。达达利亚自取其碗，分半与之，不出一语。妇人欲谢，其人已转身去。是日棚下三百人，无一争者。"
 YLH_PW_Revive_the_Market:"市口悬秤示信"
 YLH_PW_Revive_the_Market_desc:"复市之日，新秤一杆悬于市口，秤砣上刻小字一行：「缺一两，赔十两。」悬秤者言，凡市中所售，皆须过此秤。头一日，一摊主短人半两，当众罚之，围观者以为必起争端。翼日视之，来摆摊者反多一倍。有老市侩语其徒曰：「人不怕秤重，怕秤不准。」徒问其解，老者指秤曰：「此物在，买卖才敢做长。」"
 YLH_PW_Register_of_the_Conquered:"抚册细书户口"
 YLH_PW_Register_of_the_Conquered_desc:"抚册之设，凡云来海一户，皆书其名、其口粮、其所欠。册成，厚可盈尺。达达利亚翻数页，谓幕僚曰：「吾欲知谁尚活，谁尚能作，谁方待吾之败。」书之宜细，他日有变，先受诘者，君也，非彼辈。幕僚执笔，汗出于额。是夜署中灯火不熄，抄者三十人，三日而毕。"
 YLH_PW_Shelter_the_Refugees:"旧营分铺纳流"
 YLH_PW_Shelter_the_Refugees_desc:"流民至者日众，置之旧兵营，按户分铺，先授铺，后授粮。一卒掩鼻，语同伍曰：「此辈身上有泥。」达达利亚闻之，当众鞭之，血见于衣。乃曰：「此辈他日为我搬货、划船、纳课，今日尔嫌其泥，明日谁为尔作。」卒俯首，往搬铺板，不敢复言。营中炊烟起，一夜安堵。"
 YLH_PW_Lights_on_the_Water:"水灯照彻航道"
 YLH_PW_Lights_on_the_Water_desc:"水上之灯，一盏一盏次第而燃，照得航道发白，如铺素练。是夜达达利亚不使人从，独乘小舟巡之，自港口至外沙，凡一匝。谓舟子曰：「灯明则船入，船入则账转。此灯不可灭，灭则城随而黑。」舟子应之。归时天将明，灯犹未熄，其光浮于浪上，随波而动，如有人执之。"
 YLH_PW_Repair_the_Wharves:"三号坞先动工"
 YLH_PW_Repair_the_Wharves_desc:"修坞之役，先自最旧之第三号始。木料随北国军械船而至，钉则本地所打。匠人取钉试之，曰：「此钉胜于北国所铸。」匠问须待新图否，达达利亚曰：「照旧样修之，能停船足矣。」及第一舟靠上，缆绳收紧，坞木作声，他立于岸上，自始至终不移目。匠人相谓曰：「此人不似督工，倒似等一件久等之物。」"
 YLH_PW_Northern_Machines:"北械开箱验齿"
 YLH_PW_Northern_Machines_desc:"北械至，箱以百计，一箱一单，单上书型号，亦书价钱。达达利亚亲启其一，探手入内，摸新齿轮，齿锋犹有油。谓管事曰：「机比人可靠，坏则可修。」人亦当学之，坏了先转，勿急着喊疼。管事不敢答。是日卸至夜半，箱列于岸，如堵墙。潮气上来，铁上生一层薄露。"
 YLH_PW_The_Salt_Office:"盐署挂牌放引"
 YLH_PW_The_Salt_Office_desc:"盐政衙门挂牌之日，阶下候者成一长队。新规只一条：盐引先给小船户，大户在后。有盐商托人致问，达达利亚答曰：「大户等得起，小船户等不起。其语传出，港中船户皆记其名。」一老舟人取引在手，不即去，立门侧视良久，曰：「吾操舟三十年，初次自正门入。」"
 YLH_PW_The_Dockyard_Quota:"坞口挂额自勘"
 YLH_PW_The_Dockyard_Quota_desc:"船坞之额书于木牌，一旬一易。不遣人催，惟悬牌坞口，听领班自往观之。达达利亚曰：「额者死物，人则活物，看明此牌，胜听吾言十句。」有领班私领木料一车，自以为无人知。至次旬，牌上独少其一栏，墨迹新干。众皆视之，其人面赤而退。此后再无敢私领者。"
 YLH_PW_Warehouse_of_the_Sea:"留旧人掌海仓钥"
 YLH_PW_Warehouse_of_the_Sea_desc:"海仓之货，堆及房梁，盐铁粮布分为四区，账目一栏不遗。管仓老者乃七星旧人，众请去之，达达利亚不许，但于仓门书一语：「账不错，人即不换。」老者见之，归坐案前，自此记载愈细，虽鼠啮一角，亦书其时其处。有吏笑其琐，老者曰：「此一角亦在账上，则天下无不在账上者。」"
 YLH_PW_Smelters_by_the_Tide:"炉焰落于浪上"
 YLH_PW_Smelters_by_the_Tide_desc:"海滨之炉，昼夜不熄，火光落于浪上，渔舟夜归，遥望以为岸在燃。达达利亚往视，问炉工一昼夜出铁几何，工对以数。他摇首曰：「再省一成炭，可多养一班人。」言毕去，未几，炉工之饷加。只留一语于炉壁：此炉所烧者铁也，亦此城之命也。炉工以炭书其语于砖，火起则字隐，火息则复见。"
 YLH_PW_The_Five_Banners:"五纸分钉舆图"
 YLH_PW_The_Five_Banners_desc:"刻晴、凝光、甘雨、申鹤、蓝砚五人之名，各书一纸，钉于舆图之侧。达达利亚立图前，视之良久，曰：「以刀所取之地，刀不能守，须以人情与账目守之。」乃遣人分道送礼，礼单各异，措辞亦各异。发使之前，取五书自阅一过，改其三字，而后加封。副将问：「此五者，孰最难。」曰：「不言价者最难。」"
 YLH_PW_Envoy_to_Yuheng:"玉衡闭门不纳"
 YLH_PW_Envoy_to_Yuheng_desc:"使者至玉衡，候于门外三日，不得见，归时面色如灰。达达利亚听毕，反笑曰：「彼并一面亦不肯与，是犹以我为敌也。」乃命备军械一船送去，附书一句：「君之兵缺枪，吾之账缺一讲规矩之敌。」使者问：「既不见我，何以赠之。」曰：「肯收，则可再谈；不收，亦知其人。」"
 YLH_PW_Envoy_to_the_Jade_Chamber:"群玉阁但言利"
 YLH_PW_Envoy_to_the_Jade_Chamber_desc:"群玉阁应对甚恭，而滴水不漏，句句皆算其利。使者归报，达达利亚以指叩案，曰：「凝光知价，吾亦知价。」两人皆算得清者，谈不成，亦翻不得脸。乃命备厚礼，礼单首列一项：航路抽成。副将问：「礼单首列此物，岂非明言分利。」曰：「与其藏之，不如先摊在案上，省彼此猜。」"
 YLH_PW_Envoy_to_Yuehai_Pavilion:"月海亭一纸争人"
 YLH_PW_Envoy_to_Yuehai_Pavilion_desc:"月海亭之复，只一句：「港可让，人不可少。」达达利亚读竟，取信就灯照之，纸背无隐语。乃谓副官曰：「彼所争者人，非钱也。」争人者最难对付。是日破例免月海亭一带三月之捐，批文理由只书二字。副官问其故，不答。越三日，有信自月海亭来，封口未启，他已收之入匣。"
 YLH_PW_Envoy_to_Jueyun_Karst:"素绢八字不低头"
 YLH_PW_Envoy_to_Jueyun_Karst_desc:"绝云间之复，书于素绢，雪白无纹，只八字：「路可让，人不低头。」达达利亚持绢读之，读竟复读，久而不语，乃折叠纳于贴身衣袋。谓部下曰：「吾平生所敬者，惟此等连价亦不报之人。彼所与者，比金为重。」部下问：「既不肯低头，何以敬之。」曰：「低头者众，故不低头者贵。」"
 YLH_PW_Envoy_to_Chenyu_Vale:"谷使泥衣求地"
 YLH_PW_Envoy_to_Chenyu_Vale_desc:"沉玉谷使者至，衣上泥未干，立于阶下。其所谈者非港，非城，只求勿动谷中一片地。达达利亚方拭枪，闻之，手停，曰：「有点意思。」乃命左右：沉玉谷之事，且搁之。属将问故，曰：「吾欲观其能守几时。」将曰：「一谷之地，何足观。」曰：「地不足观，人足观。」"
 YLH_PW_Concordat_of_the_Five:"五方通约不称臣"
 YLH_PW_Concordat_of_the_Five_desc:"五方通约成一册，各留其一，条款之中，无一字称臣。达达利亚于末页添一行：「约在，则人尚有可谈。」授册之日，他不复笑，只曰：「往后之路，走一步算一步。」五使各受册，皆不先出。堂中烛短，影在壁上，五人相顾，终无一语。良久，一使先行，余四人乃随。"
 YLH_PW_The_Seat_at_Celestia:"天书三改未发"
 YLH_PW_The_Seat_at_Celestia_desc:"天空岛终无回音。达达利亚作书与天理，置案头，凡三易稿。谓幕僚曰：「女皇欲取天上之物，璃月人恨天上之物，吾则只欲一问，彼尚在否。」书成，终不遣使，压于海图之下。幕僚问：「既成之，何以不发。」曰：「发则须等回音，吾今无暇等。」言毕，以手按图上，图角起皱。"
 YLH_PW_The_Queens_Enemy:"同仇未必同心"
 YLH_PW_The_Queens_Enemy_desc:"至冬欲反天理，璃月亦恨天理，两家之敌，本是一人。达达利亚心知其与女皇同立一处，然天理若真倾覆，则又如何。是夜独立船头，望北天良久，低声曰：「至那一日，谁先动刀，便难说矣。」语毕自顿，似为失言。副将在后闻之，佯作不见，退三步，乃敢咳嗽。"
 YLH_PW_Traders_of_the_Deep:"来使索价太昂"
 YLH_PW_Traders_of_the_Deep_desc:"深渊遣使来议买卖，所出价码高得异乎寻常，闻者皆觉背冷。达达利亚听毕条款，不即许诺，只问一句：「君等所欲取者，他日会不会反来取吾之命。」使者笑而不答。他亦笑，取合约搁于案侧，不再视。既出门，副将问：「此约弃乎。」曰：「不弃，亦不署，搁着最好。」"
 YLH_PW_The_Abyss_Ledger:"渊下名册入总账"
 YLH_PW_The_Abyss_Ledger_desc:"渊债所记，皆层岩深处以命相易之名目：矿工、封井人、失踪之勘队。达达利亚翻阅数页，谓账房曰：「此诸名，收入总账，按月划付。」账房问：「此非亏本乎。」曰：「是。然有些账，本不该以赚与不赚计之。」账房执笔良久，乃书。书毕，低声曰：「此一页，写得比哪一页都重。」"
 YLH_PW_The_Sealed_Well:"封井亲候末闸"
 YLH_PW_The_Sealed_Well_desc:"封井之役，用至冬合金与新法，闸门一层一层落下，声闷而长。达达利亚亲至井口，候其末闸。井下之风冷硬如刀，吹得衣角作响，他立而不动。闸合既毕，乃曰：「底下所埋者，乃一件谁动谁赔命之旧物。」言毕，取安全绳自收之，不假他人手。守者视其绳上沾泥，知曾亲下。"
 YLH_PW_The_Price_of_Heaven:"两本账终须对"
 YLH_PW_The_Price_of_Heaven_desc:"神谕、仙人、天命之卷宗，堆满半间库房，尘气呛人。达达利亚命逐条核之，凡不可考者，别为一册。谓幕僚曰：「女皇亦算此账，惟彼所算者，如何打法；吾所算者，如何活得下去。此两本账，早晚须摊在案上对之。」幕僚问：「对时谁先开口。」曰：「算得清者先开口，故今日须先算。」"
 YLH_PW_The_Grey_Regiments:"灰旅不较忠义"
 YLH_PW_The_Grey_Regiments_desc:"灰旅之旗旧，兵亦旧，半为雇来之亡命。检阅之日，达达利亚不登高台，立队前，只言一桩：饷按月发，伤则给治，死则抚恤送至其家。曰：「尔为我战，我代尔将条件说明白，足矣。」言未毕，队中先有人鼓掌，掌起于末行，渐及全军，不齐而响。副将曰：「此军无义。」曰：「有饷，有信，便是义。」"
 YLH_PW_Drills_on_the_Salt:"盐滩曝日操兵"
 YLH_PW_Drills_on_the_Salt_desc:"盐滩操演，日头毒甚，枪管晒得烫手。新兵倒者一片，如割麦。达达利亚立看台上，不命止，亦不动色。及操毕，亲持水器，逐与晕者饮之，曰：「今日在滩上倒，是尚能起之倒；若在阵上倒，则再不能起。」有新兵饮毕，伏地而泣。他立视之，待其起，乃去。是日营中无一人怨之。"
 YLH_PW_The_Gun_Brokers:"验货当面扣价"
 YLH_PW_The_Gun_Brokers_desc:"售枪者自四方来，箱中杂陈，有旧有新，有权衡不齐者。达达利亚见之，只议二事：价与验货。曰：「吾不怕尔枪有脾气，只怕尔账不明白。」首批验毕，当场扣其二成，字据上只书五字：「价高了一分。」诸掮客相顾，无一争者。一老掮客收据而笑曰：「与明白人做买卖，少说十句话。」"
 YLH_PW_The_Admirals:"分润先论护航"
 YLH_PW_The_Admirals_desc:"提督围海图而坐，为一条航路之抽成争至夜半，烛已三易。达达利亚坐末席，听之半宿，不发一言。至众声稍歇，乃拍案曰：「谁护航，谁分润。」众皆无辞。散时一老提督拍其肩曰：「你这人讲理。」他笑曰：「吾不讲理，吾讲账。」老提督亦笑曰：「这两样，你都有。」二人相视，各自登舟。"
 YLH_PW_The_Fortress_Harbor:"不筑城垣筑炮台"
 YLH_PW_The_Fortress_Harbor_desc:"要塞港不筑城垣，只修炮台与船闸。达达利亚之意甚直：敌所来者船也，非马也。炮位图上，亲笔添三处，曰：「此三处不打仗，只教人看见。」看见了，即不必打。动土之日他不至，只遣人送酒一坛。工匠启封，酒香满场。有老匠曰：「此人不来，是信吾辈。」众人举碗，工地上初次有笑声。"
 YLH_PW_The_Raven_Standard:"渡鸦升桅鸣笛"
 YLH_PW_The_Raven_Standard_desc:"渡鸦之旗升于主桅，全港之船一齐鸣笛，声震屋瓦，海鸟尽起。达达利亚不致辞，只望满港之旗。良久，谓副将曰：「此旗之下，半是至冬之兵，半是璃月之人。他日此旗若倒，多半倒在自己人手里。」副将不敢应。日暮，旗影长过船身，投于水上，随浪而碎。"
 YLH_PW_The_Fork:"案上两稿择一"
 YLH_PW_The_Fork_desc:"云来海至择路之时：一则仍倚北国，一则借北国之力，自立为一方。达达利亚取两稿并置案上，坐对一夜，烛尽而天未明。诘朝，乃曰：「此笔一落，便无回路。」遂先署其左者。署毕，取右稿折叠，纳于匣，不加封。副将问：「既择其一，何留其二。」曰：「留着，好教后人知我未曾不想过。」"
 YLH_PW_A_Northern_Patron:"末页小字难违"
 YLH_PW_A_Northern_Patron_desc:"北国恩主所与甚厚：钱、粮、枪、船，一样不缺。其条件书于合约末页，字小如蚁。达达利亚视其页良久，指按纸上，终署之。曰：「先活下来，其余后议。」副官欲言，他举手止之。署毕，取合约交人收好，自出舱外，立于风里。副官从后视之，见其握拳，指节皆白，久之乃松。"
 YLH_PW_A_Court_of_Advisors:"顾问满座主事轻"
 YLH_PW_A_Court_of_Advisors_desc:"顾问之廷设于旧商会，坐而发议者，皆北国之人。本地官吏事事须问顾问，日久，连语音亦学其三成。一日会散，达达利亚不即起，徐曰：「尔等问得愈勤，主事之人便愈不像主事之人。」满堂无声，笔皆停。有少年吏欲起而辩，视左右，复坐。窗外日影移过案面，一寸一寸，无人动。"
 YLH_PW_A_The_Tribute_Road:"贡道立碑书商"
 YLH_PW_A_The_Tribute_Road_desc:"岁贡车队一季一行，所押者盐、铁与云来之丝，车辙深及寸许。达达利亚命立碑于道旁，碑上不书贡字，只书通商。老吏问其故，曰：「书贡者，示北国也；书通商者，示吾民也。」两牌所标，本是一事。老吏退而语人曰：「此人一字之间，尚要分两处看。」碑成，往来者多不识其上之字，惟知可歇脚。"
 YLH_PW_A_The_Eagle_Garrison:"鹰旗两营非我兵"
 YLH_PW_A_The_Eagle_Garrison_desc:"鹰旗之下驻军二营，一营守港，一营驻城。饷出北国，号令亦出北国。检阅之日，甲光耀日，行伍齐整。达达利亚立台上，忽谓副官曰：「此辈吾调不动。他日有变，先出而为北国收场者，乃吾也。」副官曰：「既如此，何不早图。」曰：「图之须兵，兵在此辈之手。」言毕，台下鼓声三通，他举手还礼。"
 YLH_PW_A_The_Customs_Seized:"关榷易印北属"
 YLH_PW_A_The_Customs_Seized_desc:"关榷交出之日，税吏尽易新印，印文非旧。商人列队过关，队比旧时长一倍，无人言语，惟闻算盘与盖章之声。达达利亚立于关楼，看一上午，只曰：「自今日起，此港所挣之钱，先经一遍北国之手。」言毕下楼，阶石有声。税吏长趋而送之，他不回顾。关楼下，一老商以杖点地，点数至百，乃转身去。"
 YLH_PW_A_The_Viceroy_Banner:"府门挂旗谁为主"
 YLH_PW_A_The_Viceroy_Banner_desc:"总督之旗悬于府衙正门。达达利亚间入而坐，观其理事。一日，总督问曰：「吾算主人否。」答曰：「算。惟君所主之事，北国先已点头。」总督不复问。二人相视而笑，笑皆不甚好。堂上香尽，无人添之，末一缕烟直上而散。总督低头批牍，笔尖在纸上顿了一顿。"
 YLH_PW_A_Northern_Schools:"北学新开三课"
 YLH_PW_A_Northern_Schools_desc:"北学开三门：算学、军制、北语。首批生徒之中，旧吏子弟为多。达达利亚往听一堂北语，归谓幕僚曰：「教之北语，使能读北国所书之文书。」读得懂与否，在彼；写得清与否，在北国。幕僚曰：「若彼读懂而后怨呢。」曰：「怨亦须先懂。不懂而怨，最易受人拨弄。」窗外书声琅琅，如潮拍岸。"
 YLH_PW_A_The_Frozen_Allegiance:"雪中礼服封箱"
 YLH_PW_A_The_Frozen_Allegiance_desc:"冰誓之日，云来海落雪。达达利亚易北国礼服，当众宣誓，誓词甚长，其一字未改。礼成，众皆贺，他不答，独归舟中，解礼服，折叠齐整，压于箱底。箱盖既合，落一层细灰。此后此箱再未开启。有近侍曾见其手按箱盖，久而不动，问之，曰：「此衣合身，故不常穿。」"
 YLH_PW_B_Stand_on_the_Sea:"渡鸦爪下改浪"
 YLH_PW_B_Stand_on_the_Sea_desc:"立海之第一步，在换旗。达达利亚命重画船队之旗：仍是渡鸦，惟爪下不复冰纹，改为一道浪。画工执笔问曰：「如此，算背北国乎。」曰：「旗者，用以认路，非用以认主。」画工不复言，退而落笔，遂将那一道浪画得比稿上更长，一直拖到旗角。旗成悬出，风一起，浪纹翻动，望之如真。"
 YLH_PW_B_The_Convoy_Charter:"宪章贴于茶肆"
 YLH_PW_B_The_Convoy_Charter_desc:"护航宪章之细，过于军令：几船为一队，行何路，遇风避于何处，出事谁任其责，皆书明白。达达利亚命贴于船户常聚之茶肆壁上，曰：「字写明白，海上之事便少一半麻烦。」首月之中，过路船户至者，多驻足读之。有识字者读与众听，众以指随其字。茶博士添水三次，人犹不散。"
 YLH_PW_B_The_Far_Caravans:"二十七船出远洋"
 YLH_PW_B_The_Far_Caravans_desc:"远洋商队初发，二十七舟，所往者无人挂旗之地。达达利亚送至码头之外半程，立于防波堤上。有船长问曰：「怕亏乎。」答曰：「怕。然停于港内之船，一世亦挣不回一条新航路。」船队转过灯塔，帆影渐小，他犹立不去，潮打堤石，衣袖尽湿。及暮归署，命人取海图，于空处加一墨点，旁书日月。"
 YLH_PW_B_Crux_Fleet:"南十字合而不并"
 YLH_PW_B_Crux_Fleet_desc:"南十字船队合流之日，海面旗色杂乱，望之如一集市。有劝收编之者，达达利亚曰：「收编则成吾之兵，他日死一人，吾须偿之。不如合而行，各算各账，反能行远。」众以为然。是夜两家船长聚饮，酒至三更，论及旧怨，一人拍案，一人大笑，终无一言及降附。天明各解缆，帆向不同，而约已定。"
 YLH_PW_B_Overseas_Stations:"先水次煤后炮"
 YLH_PW_B_Overseas_Stations_desc:"海外补给点次第而修，先淡水，次煤，最后乃炮。达达利亚曰：「补给点乃为船而设，非为战而设。」第一点落成之日，不张彩，不鸣炮，只命立木牌于门口，书六字：「此处可停三日。」后往来者益众，牌上字为风雨所蚀，人辄以炭描之，描者相接，字遂愈粗愈黑。守点者曰：「此牌比炮台有人气。」"
 YLH_PW_B_Repudiate_the_Quota:"只按原数交额"
 YLH_PW_B_Repudiate_the_Quota_desc:"北国之催额又至，比去年增三成。达达利亚置文书于案，三日不动，乃作复书，极短，只一句：「今年之额，仍按原数。」书发之日，港中风声顿紧，帆索作响，如人屏息。他照旧登甲板练枪，枪尖破风，声清而缓。练毕，谓副官曰：「彼若再来问，尔等皆勿开口。」副官问：「那谁说。」曰：「我说。」"
 YLH_PW_B_Salt_and_Iron_Ours:"盐铁渐收归己"
 YLH_PW_B_Salt_and_Iron_Ours_desc:"盐铁之利，旧时大半经北国之手，至是一条一条收回。盐引改本地之印，铁器只销本港。有老商问曰：「如此，宁不触北国之怒。」达达利亚曰：「触怒迟早有之，迟不如早。」乃命账房别起一册，封面空白，不书一字。账房问：「此册何名。」曰：「无名之册，记不必与人看之数。」"
 YLH_PW_B_The_Sovereign_Sea:"海上自定规矩"
 YLH_PW_B_The_Sovereign_Sea_desc:"自主海权落在纸上之日，云来海挂出自己之旗。达达利亚立于旗舰船头，望旗影落于浪上，为人影所割，碎而复合。谓左右曰：「自今日起，此海之规矩，吾辈自定。」定得好否，往后方知。乃命人收旧航图，一张不焚，尽纳于匣。左右问：「既立新规，何留旧图。」曰：「不记旧路者，新路亦走不远。」"
 YLH_PW_Children_of_the_Port:"船底孤儿两饭"
 YLH_PW_Children_of_the_Port_desc:"码头之侧，有孤儿一群，无父无母，昼为人扛货，夜宿船底。达达利亚行经其处，见诸童滚铁环为戏，环声乱响，遂驻足观之。一童仰面问曰：「你是坏人否。」答曰：「说不清。待尔长大些，自看。」言毕，命管事另立一档，日给两饭。管事问：「此档何以名之。」曰：「不必名，记其数便可。」诸童散，铁环倚墙，犹自转。"
 YLH_PW_The_Chasm_Barges:"巨渊驳船抽成"
 YLH_PW_The_Chasm_Barges_desc:"巨渊下来之驳船，一接一，所载矿料与旧物多不入册。达达利亚于此线不问其详，只收一道固定抽成。部将问曰：「此非纵容乎。」曰：「治一城者，须为胆大之人留一条活路。若并此路亦塞之，彼别寻他路，则更麻烦。」部将曰：「若彼所载非矿料，奈何。」他停一停，曰：「那便要看我抽成之数，够不够买他口中消息。」"
 YLH_PW_Cloud_Sea_Settled:"两路货皆归此埠"
 YLH_PW_Cloud_Sea_Settled_desc:"两条路行至尽头，皆归同一码头。达达利亚取两年以来之租约、航图、军约，尽摊于案，重写为一册。扉页书曰：「云来海者，至冬之云来海，亦己之云来海。」书毕视之良久，终不撕此页。掌卷者受册时，见纸角微湿，不敢问，以袖拭之。册入库，锁三道，其钥分置三处。"
 YLH_PW_The_Long_Freeze:"无事唯觉太静"
 YLH_PW_The_Long_Freeze_desc:"长冻者，一段无大事之日月：船照开，税照收，北国之账照催，海上之旗照升。达达利亚渐不日日登甲板，惟夜深独坐，听浪拍船腹，一息一息。旧部来谒，他曰：「无事，只是太静。」旧部点头，亦寻不出他语。二人对坐，茶冷而无人取。窗外灯影移过半舱，他忽曰：「静时最易忘事。」旧部问：「忘何。」曰：「忘当初为何出海。」"
 YLH_PW_The_Tide_Returns:"旗子从来不赢"
 YLH_PW_The_Tide_Returns_desc:"多年以后，云来海之潮汐依旧准点，不迟一分，不早一分。达达利亚老矣，而港口比其在时更热闹，帆樯如林。一少年问曰：「当年诸旗，谁赢了。」他思之良久，曰：「旗从来不赢。」赢者，乃尚留在此船上之人。少年不解，他亦不复解。惟指港中一舟，其桅上旧旗已褪，而舟仍出没于浪间。"

 YLH_postwar_category:"云来新局"
 YLH_postwar_category_desc:"达达利亚战后双轴。北援所量者，自至冬讨回之兵、钱与枪；海权所量者，云来海在提瓦特尚余几条自专之航道。两物皆欲攥于一手，便须两头掂量：曲意北国，则海上之旗悬而未定；只顾海上，则北国之账催上门来。"
 YLH_decision_pw_convoy_patrol:"护航巡弋"
 YLH_decision_pw_convoy_patrol_desc:"护航之船队一旬一趟，把主航道从头走到尾。遇不长眼者，先鸣笛，再开炮。达达利亚曰：「此线走顺，挂吾旗之船，便无人敢拦。」一旬一趟，风雨不改；改则商船自问，为何。护航之队自南十字港发，一旬一趟，风雨不改。"
 YLH_decision_pw_salt_issue:"一引一担"
 YLH_decision_pw_salt_issue_desc:"盐引先给小船户，大户押后。一引换一担盐，账上记得清楚。有嫌烦者，达达利亚只答一句：「麻烦者，为出不得盐之人备也。」大户不服，聚于衙前。达达利亚出，立于阶上，曰：「汝等若要引，先报船数。报得多，便给得多。」众遂散。盐引发于璃月港盐署，牌挂门侧，上书发引时辰。"
 YLH_decision_pw_north_loan:"抵押先问"
 YLH_decision_pw_north_loan_desc:"借来之钱是热，抵押之物是冷。达达利亚签字时，总要盯抵押那一栏看许久，看完还问一句：「此条，将来能不能改。」书吏答：「约既定，不可改。」达达利亚笑曰：「不可改者，才值得押。」抵押一栏空久，落笔之后字略偏，墨稍重，存于璃月港府衙。"
 YLH_decision_pw_grain_relief:"先烧锅"
 YLH_decision_pw_grain_relief_desc:"放赈之棚一日两顿，来者皆给。有人劝其查冒领。达达利亚曰：「查得再细，亦堵不住一个饿字。先把锅烧上。」粥熟，其亲执勺，舀第一碗，递与一老妇。老妇不敢接。曰：「接。此碗不记账。」粥棚搭于璃月港码头边，棚以竹为骨，覆以苇席，风入则响。"
 YLH_decision_pw_winter_drill:"雪中三日"
 YLH_decision_pw_winter_drill_desc:"雪原操演，所练者忍耐也：冻伤、旧伤、沉默，三样齐全。达达利亚看毕只说一句：「今日恨我，往后会谢我。」说毕，给每个兵倒一碗酒。有兵问：「谢从何来。」曰：「活着回家那一日，自会谢。」操演之地在明冠峡北雪原，地平无树，风自山口入。"
 YLH_decision_pw_customs_sweep:"清账放人"
 YLH_decision_pw_customs_sweep_desc:"清关先清账，后清人。查出之货照扣，查出之人照放。达达利亚曰：「吾要者账目干净，不是人头落地。账干净，港方立得住。」有吏问：「货既扣，人何放。」曰：「货可补，人不可补。杀一人，少一税户。」清关在璃月港税关，货列于场，场以石铺，石缝生草。"
 YLH_decision_pw_envoy_keqing:"遣使玉衡"
 YLH_decision_pw_envoy_keqing_desc:"使者赴玉衡，多半吃闭门羹。达达利亚从不恼，反遣人送枪过去，曰：「一个算得过账之对手，比只会喊口号之对手，更值一船军械。」副官问：「彼若以此枪向我。」曰：「那便是吾看错了人，认赔。」使者赴玉京台，多半吃闭门羹，阶上苔厚，踏之而滑。"
 YLH_decision_pw_envoy_ningguang:"遣使群玉阁"
 YLH_decision_pw_envoy_ningguang_desc:"群玉阁只谈利，达达利亚也只谈利。两方把算盘摆在桌上，你拨一档，我拨一档，谈到天黑亦未签。临散，他把算盘一推，笑谓谈不拢无妨，别翻脸即可。使者归报凝光，凝光听毕，只命再备一席。"
 YLH_decision_pw_envoy_ganyu:"遣使月海亭"
 YLH_decision_pw_envoy_ganyu_desc:"月海亭要之人，达达利亚给；月海亭不要之港，亦不强要。曰：「与争人之人打交道，先须把自家账本收起，不然谈不下去。」副官不解。曰：「她所算者非钱，乃人命。吾之算法，在她面前一文不值。」"
 YLH_decision_pw_envoy_shenhe:"遣使绝云间"
 YLH_decision_pw_envoy_shenhe_desc:"绝云间回信只八字：「山上不问，山下自理。」达达利亚却将那一片绢收进贴身衣袋，谓副官曰：「她连价亦不报，吾此人，反不好开口了。」夜半独坐，取绢再读一遍，乃以炭条于袋上补两字：「受教。」"
 YLH_decision_pw_envoy_lanyan:"遣使沉玉谷"
 YLH_decision_pw_envoy_lanyan_desc:"沉玉谷使者只谈水、土、谷种。达达利亚听毕，放下手中之枪，曰：「头一回有人来寻我，不要钱，只要我莫动手。」遂命人将谷地之事先行记下。使者去后，其独坐良久，曰：「此谷，我大约动不得。」"
 YLH_decision_pw_proclaim_settlement:"半旧半新"
 YLH_decision_pw_proclaim_settlement_desc:"租约、通约、税则并成一册，念与全港听。达达利亚念至末条，停了一停，曰：「自今日起，此港之事，一半按老规矩，一半按新规矩。」台下有商问：「两规相犯，听谁。」曰：「听账。账上写得清者，为准。」一册念于璃月港市中，自晨至午，三日乃止。"

 LYY_Event.12001.t:"云来海上换新旗"
 LYY_Event.12001.d:"停火之晨，云来海雾尚未散。远处炮声既止，惟余水声，一声一声拍于船舷。达达利亚命人将至冬鹰旗升上最高一桅。旗在湿风中半卷，展不开，像一块未晾干之布。\n码头上无人言语。搬货者立，补网者坐，无一人开口。\n他立于旗舰船头，望了很久，方回顾副官，曰：「自今日起，此港进出归我。」副官应诺。他又曰：「账重记，人勿擅动。」副官问：「擅动者如何。」他曰：「先记账。」记满三次再说。\n雾散日色出，旗终于展开，于桅顶拍了两下，声甚脆。\n旗升既毕，有人问当挂几日。他曰：「挂着。」又问：「旧那一面呢。」他曰：「收起来，勿烧。」往后未必无用。那人抱走旧旗时，手很轻。\n此后港中每逢起雾，皆有老兵抬头看那面旗。旗在，人便在。雾尚未散，炮声既止，惟余水声，一声一声拍于船舷。"
 LYY_Event.12001.a:"以商之名，接管云来"
 LYY_Event.12001.b:"暂守现状，静观其变"
 LYY_Event.12002.t:"清墟从断墙起手"
 LYY_Event.12002.d:"清墟自拆第一堵断墙始。墙倒时扬起一层白灰，落半条街。\n达达利亚在旁看半日，忽问身边老吏：此地从前住多少户。\n老吏答不上来，惶恐欲跪。他摆手曰：「起来。」答不上，便从头数。数清再动手修。\n当日午后，港中工匠名册添出一栏，专记某人之家在何处。填此栏，方许领料。\n数户那三个月，有一户报七口，查实只四口。老吏来请示。他曰：「照实写。」多那三口，问去了何处。问至末，一个也没回来。那一栏之后，他命人添三个小字：「已没。」\n名册后抄一份存仓。有一年发水，仓淹半尺，管仓者先把册子搬上梁，自己铺盖留在水里。\n那一栏叫归处，填得最慢。有人填半页便停笔，说填不下去。主事者曰：「填不下去者，写一个待字。」那一页后写四十三个待字。待至末，多半没有下文。\n拆墙工匠后在墙缝中寻出一副铜环，环上无字。他命人将环挂于册房门口，不题名。璃月港墙倒时白灰扬起，落半条街，灰积于阶，扫之三日。"
 LYY_Event.12002.a:"从头数之，清而后修"
 LYY_Event.12002.b:"先搭棚以居，居而修之"
 LYY_Event.12003.t:"津头一瓯粥味薄"
 LYY_Event.12003.d:"赈粮之棚搭于码头边，一日两顿稀粥。粥薄，能照见人影，却未曾断过一顿。\n有人问：「饿者如此之多，粮从何来。」他曰：「先自北国赊。」赊来之粮，也是粮。\n队中有一妇人抱子而立，子啼不止。他将自己碗里之粥分一半过去，未多言，转身去看下一口锅。\n粥棚架两月，后改为粥厂，一日三顿。有人算一账，说这两月赊之粮，够修半座坞。他视账，曰：「坞可晚半年修，人饿不到半年。」\n那笔账后一直挂在北国名下，还七年。第七年还清之日，账房报数。他闻之，只哦一声，命人将账本收进箱底，未再看。\n粥厂后添一处小棚，专给病人。棚中只两张草席，一张虚设，一张总有人。管棚老妇言，虚设那张，是留给夜里来者。此语他说不上对不对，亦未改。粥棚搭于璃月港码头边，棚以竹为骨，覆以苇席，风入则响。"
 LYY_Event.12003.a:"先赊粮救急，不问来路"
 LYY_Event.12003.b:"只赈在册丁口"
 LYY_Event.12004.t:"复市新秤刻小字"
 LYY_Event.12004.d:"复市之秤，新打而成，秤砣上刻一行小字：「缺一两，赔十两。」达达利亚命人挂于市口最显之处。\n头一日，有个摊主短半两，当场罚了。看热闹者以为要闹，孰料次日来摆摊者，反多一倍。\n那三个看秤老人，一为旧日管盐仓者，一为织网者，一为退役之兵。工钱一日两升米。有人问何故用老人。他曰：「老人脸皮薄，收不了黑钱。」\n秤挂三年，秤砣上那行字磨浅。有人提议重刻。他曰：「不必。」字在心里，不在铁上。\n此后港中交易，凡有争执，皆往市口秤下站一站。站过之人，少有再争。\n那三个老人轮值，一日一换。有人想塞钱，塞三回，三回皆被原样退回，退时一句不说。第四回那人便不塞。\n市口之秤后被人叫作官秤。官秤底下多一块青石，石上磨出一对脚印。秤挂于璃月港市口最显之处，秤砣上刻一行小字，字为阴刻。"
 LYY_Event.12004.a:"挂秤市口，缺一赔十"
 LYY_Event.12004.b:"秤规听行会自定"
 LYY_Event.12005.t:"抚册上写满姓名"
 LYY_Event.12005.d:"达达利亚命人编册，将云来海每一户之名、口粮、欠账，写得清清楚楚。其翻册，谓幕僚曰：「吾要知谁犹活着，谁犹能作活。」\n有吏嫌查得太细。达达利亚命人唤至跟前，指册曰：「写细些。将来出事，第一个被问者，乃汝，非彼等。」那吏退下时，手在抖。此后每日多查十户，查半年。\n册子后抄一份，存于仓中。有一年发水，仓淹半尺，管仓者先将那册子搬出，架于梁上，自身铺盖留在水里。\n翻开那一册，字迹密如蚁，页边有朱笔批注，所注多为两字之姓名。那些姓名，乃其亲添。那一册后添两个附栏：一栏记牲口，一栏记桑田。或谓何必记此。其曰：「人活着非只靠粮。」牲口死则须补，桑田荒则须种，补与种，皆须有人去做。此语写在册子扉页，字甚小。册以厚纸，一行记一户，行末记口粮与欠账，字小而密。"
 LYY_Event.12005.a:"一户一行，务求详尽"
 LYY_Event.12005.b:"只登丁口，不问家产"
 LYY_Event.12006.t:"船底诸童何所依"
 LYY_Event.12006.d:"码头边有一群无父无母之孩子，白日替人扛货，夜卧船底。船底潮，所铺者烂草一层。\n达达利亚撞见彼等滚铁环，立住看一晌。一孩子问其是否为坏人。达达利亚曰：「难以言。待汝等长大些，自看。」\n乃命管事别立一档，日给两饭。管事问：「此一档何名。」达达利亚思片刻，曰：「即名船底。」\n有一年冬，最小那孩子冻病。达达利亚命人请医。医看罢，言是饿，非病。达达利亚闻之，半晌未语，回身将那一档两饭改为三饭。此后军中口粮减一成。\n那一档名册，后另装成一册，封面无字。船底一档初只九人，年末增至十四。有一人后入护港营，入册时于姓名之后自添二字：「船底。」管事问其欲删否。曰：「留之。」此二字后一直留在名册上，未删。璃月港船底潮，所铺者烂草一层，草上有旧帆一片，权作盖覆。"
 LYY_Event.12006.a:"单记一档，管孩子两顿饭"
 LYY_Event.12006.b:"驱散闲人，整肃码头"
 LYY_Event.12007.t:"修坞先修第三号"
 LYY_Event.12007.d:"修坞先修第三号，坞中最旧者。达达利亚到坞那日，木料已随北国军械船运到。钉却为本地铁坊所打，长短不齐，堆在岸上，较木料更不成样。\n工匠问，要不要等南边送来图纸。\n达达利亚曰：「不必等。」先按老样子修，能停船就算成。\n众人领命动手。拆至第三日，旧梁里翻出一枚生锈之钱，乃当年造坞时匠人所埋压胜之物。工匠捧来问如何处置。他接过看半晌，曰：「埋回去。此坞非吾欲修，乃其自欲再撑几年。」\n第一艘船靠上新修之坞那日，他立在岸上，从头看到尾。船进坞时，水声很轻。\n那枚旧钱终为工匠悄悄留下，另寻一枚新钱埋进梁里。新钱上铸云来之纹，字却为北国之字。此事无人上报，达达利亚亦未问。坞成之后，有船家来问何时可用。他曰：「今便可。」船家不信，先遣一小舟入坞，停半日，方信。璃月港第三号坞最旧，坞门以木为板，板缝以麻填，麻已朽。"
 LYY_Event.12007.a:"依旧样修之，能止便休"
 LYY_Event.12007.b:"待图齐备，方始动工"
 LYY_Event.12008.t:"北械到港开箱日"
 LYY_Event.12008.d:"至冬之机器一箱一箱卸下，装箱单上书明型号，亦书价钱。价钱那一栏之字比型号还大。\n达达利亚亲手开一箱，摩挲里头新齿轮。齿轮上一层薄油，触之冷。\n他对管事曰：「机器比人可靠。」坏则能修，修好仍照旧用。\n管事问：「那人呢。」曰：「人亦当学。」坏亦先转起来，勿急喊疼。喊疼者渐多，此城就转不动。\n管事听罢，当日便加一班，将夜间之活挪一半到日间。\n那批机器后在坞里用十几年，坏过三回，回回都修得好。管事说，倒是人换得更勤些。\n管事后把此语刻在坞门内侧，字很小，不细看瞧不见。有新来匠人问谁所写，老匠人以手指坞里转动之机器，半晌没有答。\n那年入冬，有匠人问管事：机器坏，人亦坏，先修哪个。管事曰：「先修人。」机器等人，人不等人。璃月港装箱单书型号与价钱，价钱一栏字比型号还大。"
 LYY_Event.12008.a:"购北械，先使轮转"
 LYY_Event.12008.b:"就地仿造，不求外援"
 LYY_Event.12009.t:"盐引先发小船户"
 LYY_Event.12009.d:"盐政衙门挂牌之日，门前排长队。达达利亚定下一条：盐引先发小船户，大户押后。\n有盐商托人来问缘由。他曰：「大户等得起，小船户等不起。」\n此语传到码头，船户记住他姓名，亦记住此条规矩。\n头一月，有小船户拿不到引，跑到衙门前哭。他命人查出卡引之吏，打二十板，逐出衙门。此后三月，无一桩卡引之案。\n盐引发两年，港中船户多三成。\n有人问此条规矩可行几时。他曰：「行到我不理此港为止。」后来此语应验。\n小船户领引，须于三日内出海，不出海者引作废。有人问何以如此急。他曰：「引是凭据，非家产。」压在箱底之引，救不得船。此条规矩后为人私下唤作三日引，叫十年。此后衙门又添一条：发引之后，三日必回报一次，报者不问缘由。璃月港盐政衙门挂牌于门侧，牌上书发引时辰，字为墨书。"
 LYY_Event.12009.a:"盐引先授小船户"
 LYY_Event.12009.b:"盐引尽付大户包销"
 LYY_Event.12010.t:"船坞额牌挂坞口"
 LYY_Event.12010.d:"船坞之额写在木牌上，一旬一换。达达利亚不派人催，只将牌子挂在坞口，命领班自己去看。\n有个领班偷着多领一份料，次旬牌上便少他那一栏。他去理论。他曰：「额死，人活。你看清楚，比听我说十句都管用。」\n领班无言而退。其后三月，坞中料账一毫不差。\n那木牌后换七块。前六块皆朽，第七块被人刨光重漆，只漆正面，背面旧字尚存。有人翻过来看，背面写着：看牌不看人。\n此六字是达达利亚自刻，刻完未署名。\n那六字后被人摹下，贴在别坞坞口。摹者不知何人所刻，只当是旧例。有一年新来提举欲废此例，改派书吏逐坞催料。催两月，料账反倒乱。他只得把木牌重新挂回去。那块牌子一直挂到他离港那年。摘下来时，木已开裂，未修。璃月港牌为一旬一换，牌上以炭书名与额数，换时旧字擦去。"
 LYY_Event.12010.a:"额挂坞口，自行对照"
 LYY_Event.12010.b:"派员督查，按旬核账"
 LYY_Event.12011.t:"海仓簿账无一漏"
 LYY_Event.12011.d:"海仓之货堆至房梁，盐、铁、粮、布分开码放，账目一栏不漏。管仓老者，七星旧人也。\n部下来请换人。他曰：「不必。」遂留之，只在仓门加一句：「账不错，人就不换。」\n老者自那日起，记账更细，连鼠咬一角也记上。有人笑其迂。他曰：「我这条命，账换来者。」\n三年后老者病故。病中仍有一册在枕边。他去看一回，翻开，见末页写着：某月某日，仓中缺盐三斗，寻七日，原是漏雨化了。\n他合上那册，命人照原样封存。那册后被人叫作盐铁簿。簿上无一处删改，连误笔亦存，只在误笔旁画一小圈。翻者问何故不涂。管仓老者生前有言：「涂去便看不出是谁错。」存之，后人一看便知。封存那日，仓门加两道锁。一把钥匙交与接任者，一把他自己带走。璃月港仓中盐、铁、粮、布分开码放，垛间留道，道宽三尺。"
 LYY_Event.12011.a:"账不错，人不换"
 LYY_Event.12011.b:"改用亲信，重立仓规"
 LYY_Event.12012.t:"海滨炉火日夜不熄"
 LYY_Event.12012.d:"海滨之炉日夜不熄，火光映在浪上，随浪一起一伏。\n达达利亚去看过一回，问炉工一日能出多少铁。炉工答一个数。\n他摇头曰：「再省一成炭，就够多养一个班。」\n炉工曰：「省炭则铁脆。」他曰：「那就慢些炼。」铁脆不可用，人饿不可等。\n回头他命人给炉工加饷，只留一句：「炉里烧者铁，亦是此城之命。」\n那炉后连烧七年，未灭过一回。第八年修炉，拆下旧砖，砖缝里嵌着铁渣，结了一层壳。工匠说，这是烧出来之年头。\n炉工后多一条规矩：每出一炉铁，先在炉前敲三下。铁声清脆者入册，声闷者回炉。有人问此规矩何人所定。老师傅说，乃一爱笑之大人来看过一回之后所立。他没留下名字。那层壳后被敲下一块，收在匠人工具箱里，做了镇箱之物。炉在璃月港海滨，火光映浪，随浪起伏，远望如一点星。"
 LYY_Event.12012.a:"加饷留炉工"
 LYY_Event.12012.b:"减耗增额，不问工食"
 LYY_Event.12013.t:"巨渊驳船一线来"
 LYY_Event.12013.d:"巨渊下来之驳船一条接一条，所载矿料与旧物不入册。达达利亚于此睁一眼、闭一眼，只取一道定额抽成。\n有部下问：「此非纵容乎。」他曰：「管一座城，须与胆大之人留一条活路。不留，彼自寻别路，别路更难收拾。」\n部下曰：「若彼等得寸进尺。」他曰：「那时再收。」收得迟，才收得稳。\n此线后抽成加过一回。加那年，驳船少一半，次年又复。管线之吏问何故。他曰：「船家所算者长久账，不差一回两回。」\n那吏后把这句话记在册头，记二十年。\n此线上还走过旧物，青铜器、残碑、破钟，一箱一箱，皆不入册。有人问那些物事往何处去。管线之吏曰：「往北。往北作何用，我不敢问，也无人告我。」此后他再未提这一句。那份册子后被封存，封条上只写一个字：线。驳船一夜行，至璃月港则卸，卸处不列册，只记定额。"
 LYY_Event.12013.a:"默许驳船，抽成分利"
 LYY_Event.12013.b:"严禁私运，整肃水道"
 LYY_Event.12014.t:"北使上岸礼与条款"
 LYY_Event.12014.d:"北国使节踏跳板上岸，随行箱中一半礼，一半条款。达达利亚亲至码头迎。\n寒暄既毕，使节递上清单。他扫一眼，笑曰：「礼我收，条款放一放。」\n使节亦笑，曰：「这笔账早晚要算。」他曰：「那便算得晚些。」\n使节曰：「晚一日，利便多一分。」他曰：「利多，好事。然账算得太早，往往算不下去。」\n那批礼后分赠港中七行会，条款却搁整整一年。一年后再议，条款已改四处，皆在数目上。\n使节回北国时，语人曰：「此人收礼收得快，议事议得慢。」慢者不好办，快者亦不好办。\n使节去后，那箱礼中尚余一砚，无人认领。归之公库，亦无人取。他命人将砚置于议事厅案上，任人去用。三年下来，砚底磨穿一洞。有人欲换，他曰：「不必。」洞是磨出来者，换了便无。璃月港箱中一半礼，一半条款，礼在上，条款在下，压以绸。"
 LYY_Event.12014.a:"收礼不签条款"
 LYY_Event.12014.b:"照单全收，早定名分"
 LYY_Event.12015.t:"寒贷抵押云来关"
 LYY_Event.12015.d:"北国之贷，其条件不恶：息薄，期长。惟抵押一栏，空久未填。\n达达利亚视此栏半日。笔在指间转两转，乃落。所填者四字：「云来关税。」\n签毕，谓账房曰：「借来之钱热，抵押之物冷。」热者用尽，冷者仍在他人手中。\n账房问：「既知其然，何不另填。」他曰：「另填无用。」天下借钱与人者，所要者皆是同一件。填在明处，胜于填在暗处。\n那笔款还三成而止。北国遣人来问。他曰：「按约，可缓。」来人对一过，果有此条。临去，其人曰：「将军看约，看得比吾辈细。」他曰：「约自我签，我不细，谁细。」\n抵押一栏后添一行小字：「若违约，关税归债主代收。」此行为他所自添，添在栏外。账房问何故添在栏外。他曰：「栏内者，与人看也；栏外者，与己看也。」\n还清之日，他取笔将此行划去。划得极正，一笔到底。账房在旁观之，未敢言。璃月港约上抵押一栏空久未填，落笔之后，字略偏，墨稍重。"
 LYY_Event.12015.a:"以关税为质，先借后议"
 LYY_Event.12015.b:"拒其贷款，另筹别款"
 LYY_Event.12016.t:"跨海而来之客卿"
 LYY_Event.12016.d:"顾问跨海而来，言语有礼，动手极快。港中办事章程一页一页换成新者，署名之下，皆至冬之字。\n有旧吏怨其插不上话。达达利亚闻之，但曰：「彼等教汝辈办事，汝辈教彼等认路。谁学得快，他日谁主张。」此语不必吾挑明。\n旧吏听毕，归而将新章程抄三遍。抄至第三遍，能诵之。\n三年之后，港中主事者易为本地人。顾问仍在，惟出语分量渐轻。一顾问临归，语人曰：「吾辈来时，自以为在教人，末后方知在被教。所教者非章程，乃认路。」\n那本抄过三遍之章程，后为旧吏携归。病重时，命子侄抄第四遍。子侄问其故。旧吏曰：「抄得慢，记得牢。」抄完那年，旧吏卒。其第四稿至今犹在箱底。后港中公文，一半旧体，一半新体，历三十年方看惯。璃月港章程一页一页换成新者，署名之下皆北国文字，笔画方。"
 LYY_Event.12016.a:"学之速者主之"
 LYY_Event.12016.b:"只用本地旧吏，拒北人"
 LYY_Event.12017.t:"舆图旁钉五张纸"
 LYY_Event.12017.d:"刻晴、凝光、甘雨、申鹤、蓝砚五个名字各书一纸，钉于舆图之侧，纸角皆为风吹卷。\n达达利亚视那五纸曰：「打下来之地，以刀守不住。」刀能夺，不能守。欲守，须靠人情与账目。\n乃命人分头送礼，礼单各异，措辞亦各异：送玉衡者军械与药，送天权者账册与税则，送绝云者茶与旧书。\n送礼之前，将每一封皆过一遍，改数处措辞。\n幕僚问：「何必如此费心。」\n曰：「礼轻礼重尚在其次。措辞一错，人家便当汝是来讨债。」此五人，我一个也不打算作债主。\n那五纸后为雨打湿一回，字迹晕开。达达利亚命人重抄一遍，抄毕又曰：「不必钉回，收进箱子。」幕僚问故。曰：「该记者已记在心，钉着反生分。」\n那木箱后随其归北国，箱中五纸皆在，一张未少。五纸钉于舆图之侧，纸角为风吹卷，钉头露出。"
 LYY_Event.12017.a:"五方分头送礼"
 LYY_Event.12017.b:"聚于一路，先定一方"
 LYY_Event.12018.t:"玉衡闭门送军械"
 LYY_Event.12018.d:"使者往玉衡，闭门而返，面有愠色，曰连门房亦未曾通传。\n达达利亚闻之，反笑曰：「她连见亦不肯见，可见尚以我为对手。若肯见，客客气气饮一盏茶，那方算以我为过路之人。」\n乃命人备军械一船，附一语：「汝之兵缺枪，我之账缺一个讲规矩之敌。」\n使者不敢送，曰此非送礼，乃挑衅。\n达达利亚曰：「二者皆然。」她看得懂。\n亲签其令，亲押其印。\n船至玉衡，军械卸于关外，人未入城。三日后，关内送茶叶一箱，不附一字。达达利亚捧茶闻之，曰：「她收下了。」\n那箱茶后分与关上兵卒，一人一小撮。或问何不分与将校。分茶校尉曰：「上头发下之物，先给守墙之人。此语传至云来海，达达利亚闻之，只说一句：「此关守得住。」」\n印落纸上，墨未干，先吹一吹。使者闭门而返，门房未通传，门外石阶上有雪未扫。"
 LYY_Event.12018.a:"赠军械，认此对手"
 LYY_Event.12018.b:"断绝往来，无烦再遣"
 LYY_Event.12019.t:"群玉阁中还价一纸"
 LYY_Event.12019.d:"群玉阁回书至，辞气极恭，而字字皆落于利。某处让一成，某处索两成，通篇不言交情，亦不言刀兵。书末附单，列码头三处、仓廪两所，字旁以小朱点标其可让不可让。达达利亚读毕，以指节叩案者三，顾左右曰：「凝光知价，吾亦知价。」\n乃命人具厚礼一份，礼单首项书曰航路抽成。副官愕然，问曰：「此非自弃其利乎。」达达利亚曰：「两个皆算得清者，纵谈不拢，亦翻不得脸。」副官曰：「若彼收礼而不改其单，奈何。」他曰：「那便是我把价钱看低了，怨不得人。」\n礼发之日，群玉阁照单全收，回帖只添一行小字：「来而不往，非礼也。」随帖送来盐一匣，封条完好，启之，盐色如雪，是云来海头茬之盐。副官持帖入报，见他正以炭笔勾海图，勾至云来海口，笔尖略顿。阁中炉火将尽，无人添炭，他亦不语，惟将帖子压在砚下，把那匣盐置于案角，始终未开。书末附单，列码头泊位与货值，字小而密，边留宽白。"
 LYY_Event.12019.a:"备厚礼，谈航路抽成"
 LYY_Event.12019.b:"不与之谈，各行其是"
 LYY_Event.12020.t:"月海亭让港不让人"
 LYY_Event.12020.d:"月海亭复书只一句：「港可让，人不可少。」纸裁得极窄，只容一行，墨色偏淡，似写得极快。达达利亚读竟，取信就灯而照，纸背透出灯影，别无他语。\n谓副官曰：「彼所争者人也，非钱也。」争钱者可餍，争人者难与言。副官问：「既难与言，何不置之。」他曰：「置之则港空，港空则船不回。」副官曰：「彼既不肯让人，何以肯让港。」他曰：「港，死物；人，活物。」让死物者，必有所守于活物。\n是日他破例免月海亭一带三月之捐。文书写就，理由一栏只填二字：「敬重。」书吏以为误，请改。他摇首曰：「照此发。」吏退，廊下有人低语，谓从来只见北国催额，未见北国免捐，今日乃见。\n次日市上米价落一成，无人知其故。惟月海亭门前多了几担柴，担上无字，捆得极紧。那几担柴后为月海亭收进后院，劈了烧水，一冬不曾买柴，亦无人来问是谁所送。月海亭檐下有旧年燕巢，燕去巢存，无人拆之。"
 LYY_Event.12020.a:"免其三月之捐"
 LYY_Event.12020.b:"照章征收，不徇私情"
 LYY_Event.12021.t:"绝云间素绢八字"
 LYY_Event.12021.d:"绝云间之复，书于素绢之上，无封无印，惟八字：「路可让，人不低头。」绢色雪白，边角有折痕，似经人手数四。达达利亚展绢于案，读之良久，指循其字，一画一画，如数珠然。\n乃纳绢于贴身衣袋，语部下曰：「吾平生所敬者，惟此等不报价钱之人。彼所答者，非价也，骨也。」部下曰：「既不报价，何以处之。」他曰：「不必处。不报价者，汝出钱再多，皆为少。」部下曰：「然则此后如何相处。」\n部下问：「可须再遣使。」他曰：「不必。再遣则我求之，求之则彼轻。」言毕取笔欲批，笔尖悬于纸上，久而不下，终掷笔曰：「此绢存之，比批文有用。」是夜绢在他怀中，同宿于船。海上无风，帆垂如幕，他半夜起来一次，摸衣袋，又睡去。天明起锚，他把外衣扣得极紧，风自领口灌入，也不肯松手。舵工在船尾喊号，他应一声，声比平日低。绢色雪白，边角有折痕，似经人手数四，折处已薄。"
 LYY_Event.12021.a:"珍藏那片白绢"
 LYY_Event.12021.b:"弃之不理，视为虚文"
 LYY_Event.12022.t:"沉玉谷泥衣求田"
 LYY_Event.12022.d:"沉玉谷使者至，衣上泥未干，靴底粘草屑，入帐不拜，亦不献礼。所谈者非港，亦非城，惟求勿动谷中那片田。达达利亚听毕，止了手中拭枪之布，问曰：「一谷之田，值几许。」使者曰：「于将军不值几许，于谷中人，是命。」\n帐中寂然。达达利亚乃顾左右曰：「此语颇有意思。」遂命沉玉谷之事暂搁，诸务后议。使者不退，曰：「搁几日。」他曰：「不知。」使者曰：「那便等。」他曰：「等得住么。」使者曰：「谷里人别物皆无，惟日子多。」\n属下降问其故。他曰：「吾欲观之，彼能守几时。」言罢复拭其枪，擦至枪口，忽然停手，曰：「能守三载者，可与言；不能者，不必再言。」\n是夜他命人送使者干粮一袋。使者不受，只取一瓢水，饮其半，余半倒回桶中，曰：「路上带者，够用。」那瓢水倒回桶中时，溅了几点在靴上。他低头看一眼，未拭。使者衣上泥未干，靴底粘草屑，入帐不拜，亦不献礼。"
 LYY_Event.12022.a:"暂不动沉玉谷"
 LYY_Event.12022.b:"即刻开发谷地"
 LYY_Event.12023.t:"五方通约各留一册"
 LYY_Event.12023.d:"五方通约勒成一册，凡若干条，各留一本，印色犹新。通篇无一字称臣，亦无一字称贡，惟列航道、税额、互市、讼狱四事。达达利亚于末页添一句：「约在，人则犹有可谈。」\n付五方使者之日，他破例不笑，惟曰：「往后之路，走一步算一步。」五人各受册，无人先出帐，帐外风声穿隙，烛焰齐斜。一使者忽曰：「此约若三年后有一方悔之，如何。」他曰：「悔者先告，告则重议；不告而径自动手者，四方共击之。」\n五人相视，乃各以指蘸印泥，于册尾按下。按毕，无人拭手，指上红痕皆带出帐外。良久，一老使者抚册曰：「此册薄，压得住风浪否。」达达利亚曰：「压不住。」压得住风浪者，是诸君肯再来第二回。老者大笑，抱册而去。是夜他把底稿另抄一份，锁于铁匣，未与人言。铁匣入柜时，他试了两次锁，第二次才听见那一声脆响。云来海之约通篇无一字称臣，亦无一字称贡，惟列航道、税额与讼狱。"
 LYY_Event.12023.a:"立五方通约"
 LYY_Event.12023.b:"罢约，只凭刀兵"
 LYY_Event.12024.t:"天理不回书未寄"
 LYY_Event.12024.d:"天空岛终无回音。达达利亚作书一通，上于天理，置诸案头，三日之间改易三遍。初稿辞激，次稿辞缓，末稿只余一问：「君尚在否。」\n幕僚问：「此书可发乎。」他曰：「女皇欲取天上之物，璃月人恨天上之物，吾独欲知其尚在否。」发之无益，不发亦无益。幕僚曰：「既皆无益，何苦三日不睡。」他曰：「三日不睡，在我；寄与不寄，在它。」幕僚曰：「既不寄，何不焚之。」他曰：「焚则成我之意，留则仍归它。」\n书终不寄。取海图一册，将书压于图下，压处正对云来海口。此后每展此图，辄见纸角微露，他从不抽看，亦不使人收去。一日副官拂尘，欲并收之，他抬手止之曰：「放着。」副官退，图角仍露一寸白。\n入冬以后，纸角泛黄，他伸手抚过一回，指尖沾一点潮气，便不再碰。入春以后，纸角为虫所蚀，缺一小块。他取朱笔补三字，补罢自笑。书置案头，三日改易三遍，初稿辞激，末稿只余一问。"
 LYY_Event.12024.a:"修书问天，留中不发"
 LYY_Event.12024.b:"焚其信稿，不复问天"
 LYY_Event.12025.t:"两家同敌不同心"
 LYY_Event.12025.d:"至冬欲反天理，璃月亦恨天理，两家之敌，同此一人。达达利亚心中甚明：此事之上，他与女皇并立一处，无可疑者。\n然则天理果倒之后，又当如何。是夜他立船头，望北天良久。北天无星，惟云如墨。低声曰：「至彼时，谁先动刀，便难说矣。」他忽问左右：北边来之人，几时到。左右曰：「尚在三日之外。」他曰：「那便还有三日。」\n言毕自愕，似为此语所惊，回顾左右。左右皆远，无人闻之。乃自袖中出小刀一柄，削桅上旧漆，削至一处冰纹，忽止手曰：「漆底仍旧。」遂收刀入袖，令舵工转舵回港。舵工问：「不回北边么。」他曰：「今日不回。」一路未再开口。港灯在望时，方低声道：北边之风，吹久了会认路。\n次日升帐，诸将候令。他目不视北，只问港口水深几许。众皆愕然。一人出答，他点头，便令散帐。众退，帐中惟余海图一张，北面朝下。海图摊于玉京台之案，北面朝下，图角以铜镇压之。"
 LYY_Event.12025.a:"与女皇同仇，先反天理"
 LYY_Event.12025.b:"留一手，视风向而动"
 LYY_Event.12026.t:"深渊使者夜议价"
 LYY_Event.12026.d:"深渊使者来议买卖，所出价码高得令人心紧。其人所言，句句在理，理中皆藏钩。达达利亚听毕条件，不即允，亦不即拒，惟取合约反复展看。\n忽问曰：「汝所要之物，他日会不会反来取我命。」使者笑而不答。他亦笑，曰：「不答，即是答。」使者曰：「将军既知，何以仍看这纸。」他曰：「看纸者，看汝等写字之手稳不稳。」使者曰：「将军若不应，自有别人应。」他曰：「则别人受之。」\n遂将合约搁于案侧，不复言此事。使者去后，副官问：「此约弃乎。」他曰：「不弃，亦不用。」搁着。合约自此长搁案侧，积尘渐厚。有人欲收，他止之。\n一年之后，他偶过案前，以指抹尘，见封皮上字迹尚清，乃曰：「还搁在此处罢。」遂行。副官在后看见，那合约压住另一物，一角黑得发亮。副官近前欲看那合约，他伸手一按，曰：「不必看。」看多了，夜里会梦见它。合约摊于璃月港之案，纸色暗，字为朱，条款密，行间无白。"
 LYY_Event.12026.a:"收下合约，徐徐图之"
 LYY_Event.12026.b:"当场回绝，不留后患"
 LYY_Event.12027.t:"渊债一册尽书名"
 LYY_Event.12027.d:"渊债所记，皆层岩深处以命相易之名目：矿工、封井人、失踪之勘队。册页受潮，字多漫漶，翻之有声。达达利亚阅竟，语账房曰：「此诸名，尽入总账，按月各划一笔。」\n账房执笔不下，问曰：「此算亏本乎。」他曰：「算。然世间有些账，本不该以赚与不赚论。」账房曰：「既不计赚亏，何以入总账。」他曰：「入总账，是让后来查账之人看见这一笔，绕不过去。」账房曰：「此辈多已无亲族，钱寄与谁。」他曰：「寄与井口之碑，年年修。」\n账房乃书。书至矿工一页，笔忽滞，盖见一名与其乡人同姓。达达利亚立其侧，视之良久，曰：「照录，勿省。」\n是夜账房熄灯欲归，见他独坐灯下翻那册子，一页一页，翻得极慢，如怕惊动人。案上一碗面，早已糊了，他未动箸。他把册子合上，以手压平卷角，曰：「明日再翻。」灯未熄，人已伏在案侧，鼾声极轻。册页受潮，字多漫漶，翻之有声，声涩而短。"
 LYY_Event.12027.a:"收名入账，按月划钱"
 LYY_Event.12027.b:"只记己方死者"
 LYY_Event.12028.t:"封井落最后一闸"
 LYY_Event.12028.d:"封井用至冬合金与新法，闸门层层而下，每落一闸，井底风声便沉一分。达达利亚亲至井口，观其最后一闸。\n井气冷硬，扑面如刀。他在井口立良久，衣角为风所鼓，左右不敢催。及闸落定，铁声闷而远，如自地底传来。乃曰：「底下所埋者，乃一物，动之则赔命。」匠作问：「既如此，何不填之以石。」他曰：「填石为堵，堵则必有人来挖；落闸为封，封则须有钥匙。」匠作曰：「钥匙归谁。」他曰：「归我。」匠作曰：「若将军不在。」他曰：「那便无人开得。」\n言毕自解腰上安全绳，亲手卷之，一圈一圈，卷得极整，纳于袋中。匠人请曰：「此绳已无用，可弃。」他曰：「存之。」众人不知其意，亦不敢问。归途雪落，他未乘车，步行至港门。守门卒欲行礼，被他按住肩，二人同立片刻，卒见其靴上积雪已厚，不敢言。港门吏问：「井既封，尚须人守否。」他曰：「须。」守到无人记得这口井为止。盐滩井口石上有旧刻工名，字浅，覆以灰，抹之可辨。"
 LYY_Event.12028.a:"铸新闸，亲下井口"
 LYY_Event.12028.b:"循旧法，勉力维持"
 LYY_Event.12029.t:"天理一卷值几何"
 LYY_Event.12029.d:"神谕、仙人、天命，诸般卷宗堆置半间库房，尘气呛人。达达利亚命人逐条核对，凡有涉于天理者，另立一册。\n核对既毕，语幕僚曰：「女皇亦算此账，惟彼所算者，如何去打；吾所算者，如何得活。」两本账，早晚有一日要摊在桌面上对一对。幕僚曰：「此册若落他人手。」他曰：「落则落，册上无一句出自我口。」\n幕僚曰：「对账之时，若数目不合，奈何。」他曰：「不合则添，添不上则减。」减到不能再减，便剩一个数。幕僚问何数。他指窗外海上帆影曰：「人头。」幕僚默然。他乃取册自第一页翻起，翻至某页忽停，以指甲在页边划一道，曰：「此条存之。」言罢令封库，钥匙自佩，不复交人。钥匙挂在腰间，与刀同侧，行路相击有声，人闻其声便知其至。库门自此常闭，锁孔里塞一团棉以御潮。有人问库中尚有何事未竟，他曰：「有，然不在今日。」库在璃月港衙后，尘气呛人，架上卷宗堆至梁，以绳束之。"
 LYY_Event.12029.a:"两册并记"
 LYY_Event.12029.b:"只算可活之一册"
 LYY_Event.12030.t:"灰旅列阵只言饷"
 LYY_Event.12030.d:"灰旅之旗旧，兵亦旧，半数乃雇来亡命，行伍不整，甲械不一。达达利亚检阅，不登高台，不入将帐，径自立于队前。\n所讲者非忠义，只一桩。曰：「饷按月发，伤了给治，死了抚恤送到家。汝辈替我打仗，我替汝辈讲个明白，如此便够。」队中有人高声问：「若将军先死，奈何。」他曰：「则由接我者发。」账在册上，不认人。老兵又问：「若饷断，奈何。」他曰：「那便先卖我之船。」\n队中寂然，风卷旗角，有声而无言。良久，队尾有人先鼓掌，掌声零落，渐次连成一片。他不动声色，惟举手止之。是日散队，有老兵于营门磨刀，语同伴曰：「此人不说好话，说真话。」真话难听，然可以听一生。同伴曰：「然则汝留不留。」老兵曰：「留。」刀既磨好，总得有人用。\n散队之后，厨下开饭，锅里多添一勺油。伙夫曰：「将军所吩咐。」众人皆不作声，只将碗端得平些。盐滩上旗旧，兵亦旧，甲械不一，行伍不整。"
 LYY_Event.12030.a:"饷足恤厚，言无不明"
 LYY_Event.12030.b:"以忠义相绳，薄饷练兵"
 LYY_Event.12031.t:"盐滩操演不叫停"
 LYY_Event.12031.d:"盐滩操演，日头毒甚，枪管晒得烫手，触之即缩。新兵列阵未及半日，倒者相继，横陈滩上如割麦。达达利亚立在看台，自上而下视之，不叫停，亦不移目。\n操演既毕，他下台，亲自提壶，为每个晕倒之兵倒水。水入碗有声，兵皆惶恐，欲起而不能。乃曰：「今日在滩上倒，乃站得起来之倒；在阵上倒，便再站不起来。」少年曰：「倒矣，尚须站乎。」他曰：「站，站到日头落。」\n一少年饮毕，伏地曰：「将军何不早停。」他曰：「早停则今日之倒白倒。」少年曰：「若明日又倒。」他曰：「那便再倒一回。」翌日复操，日色更烈，滩上无一人先倒。收操时他绕阵一周，见昨日那少年尚立，袖中露出一包盐，盖备以自敷者。他伸手取出，视一眼，仍塞回去，曰：「懂得自备，便不会再倒。」是夜营中洗伤者排至帐外，他亲自掌灯，一一看过，看到末一人，灯油已尽。盐滩日头毒甚，枪管晒得烫手，触之即缩。"
 LYY_Event.12031.a:"盐滩苦练，不倒不停"
 LYY_Event.12031.b:"避暑减操，恤其体力"
 LYY_Event.12032.t:"售枪只论价与验"
 LYY_Event.12032.d:"售枪之人自四方来，皆掮客，箱箧杂陈，长短枪械并列，铁气与油烟相杂。达达利亚见之，只论两事：价与验货。余皆不问，寒暄亦省。\n尝谓众掮客曰：「吾不怕汝枪有脾气，只怕汝账不清楚。」语毕取一枪，拆机簧，验膛线，就灯照之，良久无语。一掮客汗出，问：「可有不合处。」他曰：「有。」枪口内壁有一道细痕，痕浅而直，乃出厂时所带。他曰：「痕在口内，非用久不出。」掮客曰：「将军好眼。」他曰：「非眼好，乃钱贵。」\n首批货验毕，当场扣下两成。掮客哗然，请书其故。他命取字据，亲书五字：「价高一分。」众视之，无一人再辩。有老掮客收据而去，至门反顾曰：「此人日后难做买卖。」旁人问何故。曰：「他把账算到一分，便无一处可欺。」旁人曰：「那汝还来。」老掮客曰：「正因无一处可欺，才敢来。」那掮客走到街口，又回望一眼，把字据折好，收进内袋。璃月港掮客自四方来，箱箧杂陈，铁气与油烟相杂，久不散。"
 LYY_Event.12032.a:"验货扣价，分毫不让"
 LYY_Event.12032.b:"照价全收，以示诚意"
 LYY_Event.12033.t:"提督环坐争航线"
 LYY_Event.12033.d:"提督们围海图而坐，为一条航线之抽成争至夜半。烛换三支，茶冷两回，图角为指所按，起毛。达达利亚侧坐听半宿，不发一言。\n及众声稍息，乃拍案定曰：「谁护航，谁分润。此六字出，满座无声，惟闻窗外潮响。」一提督起曰：「我等船少，如何分得。」他曰：「船少者护近，船多者护远。」近者利薄而稳，远者利厚而险，各择其一。又一提督曰：「若无人愿护远。」他曰：「那便由吾船去。」\n众乃无辞。散时，一老提督拍其肩曰：「汝这人讲理。」他笑曰：「吾不讲理，吾讲账。」老提督亦笑，曰：「两样汝皆有，难办。」二人并肩出帐，海风扑面。老提督忽又曰：「讲账者可以共事，讲理者可以共死。汝乃前者，故吾辈能同事至今日。」他停步，曰：「共死易，共事难。」他停步曰：「共死易，共事难。」老提督拱手而去，走出十余步，又回身拱一拱。海图摊于云来海哨所之案，图角为指所按，起毛，烛换三支。"
 LYY_Event.12033.a:"谁护航，谁分润"
 LYY_Event.12033.b:"抽成统归公库"
 LYY_Event.12034.t:"要塞港不筑城墙"
 LYY_Event.12034.d:"要塞港不修城墙，只修炮台与船闸。匠作请曰：「无墙则港无遮蔽。」达达利亚曰：「敌所来者船也，非马也。」筑墙以备马，是以旧仗打新敌。\n炮位图上，亲添三处，指之曰：「此三处不打仗，只教人看见。」看见，便不必打。匠作不解，亦不敢驳，惟照添之。\n及台成，炮口皆朝外海，惟此三处斜指港内水道，望之如守己。匠作曰：「不设墙，港中人心不安。」曰：「墙为不安之人所设，炮为来之人所设。」\n动土之日，他不到场，只遣人送酒一坛，坛上无字。匠作启封，酒气冲鼻，众乃分米而饮。\n一老匠饮毕，抚坛曰：「此人送酒不送话，乃怕吾辈听其话，将炮台修成其样子。」众问何意。老匠曰：「彼所要者，乃能打之炮台，非听话之炮台。」\n遂取锤，将一处炮座又夯三下。三下既毕，以锤立于座旁，说一句无人听见之话，便回去饮酒。璃月港炮台以石砌，台基入地三尺，台面铺以铁板。"
 LYY_Event.12034.a:"只修炮台与船闸"
 LYY_Event.12034.b:"广筑城墙，全面设防"
 LYY_Event.12035.t:"渡鸦旗升满港鸣笛"
 LYY_Event.12035.d:"渡鸦旗升上主桅之日，全港之船一齐鸣笛，声连数十里，海鸟惊起，绕桅不去。达达利亚立于码头，未致辞，亦未举手。\n仰视良久，忽谓副将曰：「此旗之下，一半至冬之兵，一半璃月之人。他日此旗若倒，多半倒在自己人手里。」副将不答。他又曰：「汝不信。」副将曰：「信。惟不愿说。」副将曰：「既知其重，何不减其半。」他曰：「减则非此旗。」\n风至，旗面尽展，其声猎猎。达达利亚复曰：「旗，好旗也，惟太重。」副将问：「重几许。」他曰：「重到须两边人一起举。」说罢转身入舱，取出一小截旧缆，系于旗绳之末，曰：「添此一结。」日后有人问起，便说第一日系者。副将视那一结，打得极拙，与船上诸结皆不同。\n那结后来磨得发亮，水手过旗绳时都要绕开它。有新人问其故，老水手曰：「乃将军亲手系者。」谁解了它，谁去回话。璃月港旗绳为将军亲手所系，绳端打结，结法无人识。"
 LYY_Event.12035.a:"两面旗并挂"
 LYY_Event.12035.b:"只升北国一旗"
 LYY_Event.12036.t:"云来海口两条路"
 LYY_Event.12036.d:"云来海至择路之时：一则仍倚北国，一则借北国之力，自立为一方。二者皆非坦途，一言可决，而两言难分。\n达达利亚取两份草稿并置案上，左者厚，右者薄。是夜不眠，烛尽两支，窗外潮退复涨。每取一稿，读数行即放下，如是者再三。副官曰：「两份皆签，可乎。」他曰：「签两份者，是心里已择定了。」\n天将明，乃曰：「此笔一落，便无回头之路。」遂先签左稿，墨未干，即以手推之案侧。推时用力稍重，纸滑落地，他也不拾，只看右稿。良久，俯身拾起左稿，拂去尘，仍并置原处。日上桅顶，舱中犹无人语。副官入送茶，见两稿并陈，左稿有押，右稿无字，不敢问，退时把门掩了半扇。日暮他再取两稿，左稿有押，右稿仍白。他把右稿折起，纳入怀中，左稿留在案上。次日议事，众人只见案上那稿，无人问怀中那一张。两稿皆存，一入怀中，一留案上，墨色相同。"
 LYY_Event.12036.a:"借北国之力，自立一方"
 LYY_Event.12036.b:"仍附北国，不别立旗"
 LYY_Event.12037.t:"北国恩主厚而约苛"
 LYY_Event.12037.d:"北国恩主之赐甚厚：钱、粮、枪、船，一样不缺，随索随与，无半月之迟。条件则书于合约末页，字极小，须就灯方辨。\n达达利亚视那一页良久，指按其行，逐字读过。副官在侧，欲有所言，他抬手止之。乃取笔签押。押成，曰：「先求活，余者以后再说。」副官曰：「既知是坑，何以还跳。」他曰：「坑里有钱，坑外有刀。」\n副官终忍不住曰：「末页所书，乃抽港口之骨。」他曰：「骨抽去尚能长，人死不能长。」言毕卷约入筒，以蜡封之。\n是夜他将火漆剩下一小块捏于指间，捏至变形，天明弃于海中。副官早起，见那蜡块浮于水上，为浪一推，撞了船帮，沉下去。蜡块沉处，后有人打捞贝壳，捞上一小块红物，不知何用，弃之。港中自此多一句闲话：签过字之纸，烧不掉，沉得下。璃月港条件书于合约末页，字极小，须就灯方辨。"
 LYY_Event.12037.a:"受其钱粮，暂寄人下"
 LYY_Event.12037.b:"谢其厚意，自筹军资"
 LYY_Event.12038.t:"顾问之廷事事问"
 LYY_Event.12038.d:"顾问之廷设于旧商会，坐而主议者，皆北国之人。本地官吏事事须问过顾问。问之既久，连口音也学了三分，答话先带一个拖长尾音。\n达达利亚看在眼里，不斥，不问，只于一次会上淡淡言曰：「汝辈问得愈勤，主事之人便愈不像主事之人。」满堂无人应声。一顾问抬头，笑曰：「将军此言，是嫌吾辈多事。」达达利亚曰：「不嫌。多事者尚在做事，所怕者，有一日汝等不问。」\n一老吏退后独行廊下，自语曰：「不问则事不成，问则人不立。」恰为达达利亚所闻。其停步曰：「此语可书于壁。」老吏惶然曰：「书之则得罪顾问。」达达利亚曰：「那就记在心里。」\n此后老吏奏事，先自拟一策，再问顾问。顾问见策，问：「此谁所拟。」老吏曰：「下官。」顾问默然，批了一个可。此后老吏每奏一事，必附一策。策不必佳，然顾问看策时，眼神已不同。廷设于璃月港旧商会，坐而主议者皆北国之人，语带北音。"
 LYY_Event.12038.a:"渐撤顾问，收回权柄"
 LYY_Event.12038.b:"优礼顾问，尽听其言"
 LYY_Event.12039.t:"贡道立碑书通商"
 LYY_Event.12039.d:"岁贡车队一季一趟，所押者盐、铁与云来之丝，车辙深陷，道旁草尽压平。达达利亚命立碑于贡道之侧，碑上不书贡字，只书通商。\n老吏问故。答曰：「书贡，以示北国；书通商，以示自己人。」两块牌子，原是同一件事。老吏曰：「北国使者见之，诘问奈何。」答曰：「诘问则请观碑阴。」老吏曰：「碑阴所刻，北国使者未必识。」答曰：「不识者，方去问识者。」\n老吏绕至碑后，见碑阴刻小字一行，书明年月与往返船数，一无隐讳。乃低头抄碑文，抄至通商二字，笔忽一顿，仰首曰：「同一件事，写两个名，日后若有人问哪一个真。」答曰：「问者多，真者自浮。」\n碑成之日，亲以袖拂石上粉屑，退三步观之，曰：「字略肥。」遂不复改。碑成之后，往来车队过此，御者皆勒马。有老车夫曰：「勒马非敬碑，敬那两个字耳。」碑立于璃月港贡道之侧，石为青石，字为阴刻，深可容指。"
 LYY_Event.12039.a:"碑上只写通商"
 LYY_Event.12039.b:"直书岁贡，不避其名"
 LYY_Event.12040.t:"鹰旗下两营驻港"
 LYY_Event.12040.d:"鹰旗下驻军编为两营，一营守港，一营驻城。饷由北国出，号令亦由北国下，符信一式两份，一份在营，一份在顾问之廷。\n达达利亚检阅之日，见满场甲械齐整，步伐如一，鼓声落处，无人差错。视之良久，忽谓副官曰：「此诸人，吾调不动。」副官曰：「此军既非我有，将军何必上心。」他曰：「饷从我港出，出事，账记我名下。」\n副官曰：「既调不动，何须亲阅。」他曰：「须阅。将来出事，第一个出来替北国收场者，是我。」言毕下台，自队前缓行而过，一兵目随其行，他亦视之，两人对视移时，那兵终垂目。检阅毕，他未留饭，径还。副官随后，见他立于廊下解手套，一只解半日，曰：「手不冷，只是解不开。」解到第二只，手套终于脱下，他把两只并齐，放在栏上，转身入内。栏上那双套子被风一吹，落地一只，无人拾。璃月港符信一式两份，一份在营，一份在顾问之所，纸色不同。"
 LYY_Event.12040.a:"北军驻港，饷由北出"
 LYY_Event.12040.b:"自练亲军，不用北人"
 LYY_Event.12041.t:"关榷换印队愈长"
 LYY_Event.12041.d:"关榷交出之日，税吏尽换新印，印色偏青，与旧印相并，判然两色。本地商人排队过关，队伍比从前长逾一倍，自关楼下蜿蜒至街口。无一人言语。\n达达利亚立关楼之上，凭栏俯视，自晨至午。日移影转，他亦移步就阴。至午，只说一句：「自今日起，此港所入之钱，先经北国手。」一吏在侧，问曰：「此印既换，旧印如何处置。」他曰：「熔之，铸成秤砣。」\n言毕下楼，再未回头。楼下有卖茶老妇不识其人，见他下阶，唤曰：「客官一盏茶否。」他停步，取钱置案，饮尽而去，未言一字。老妇收碗，见碗底压着一枚北国钱，与本地钱不同，遂藏之。\n数日后新吏查摊，老妇出钱示之，新吏视之良久，未收其税，只把那枚钱在指间转一圈，还她。老妇以钱穿孔，系于腰上，云是辟邪。有人笑她。她曰：「此非钱，此乃一个日子。」璃月港新印印色偏青，与旧印相并，判然两色，纸上可见。"
 LYY_Event.12041.a:"关榷北属，暂忍一时"
 LYY_Event.12041.b:"力争关税，寸步不让"
 LYY_Event.12042.t:"总督旗挂府衙前"
 LYY_Event.12042.d:"总督之旗挂于府衙正门，旗色新，杆亦新，风吹不展，须人牵之始动。达达利亚偶入府衙，坐于偏席，看那位名义总督理事。\n总督批牍，笔下有疑，必先顾顾问之色，色许则落笔，色未许则搁下。一日总督忽问曰：「吾算不算此港之主。」他答曰：「算。惟汝所主之事，北国先点头。」总督曰：「既算主人，何以凡事须问。」他曰：「问者不问心，只问印。」\n总督不复问，二人相视而笑，笑得皆不甚好看。笑毕，总督取印欲盖，印举半空，又放下，曰：「这一印，盖之亦白盖。」达达利亚曰：「不盖则连白盖也无。」总督乃盖。印落，声闷。窗外旗影斜入，覆于牍上。总督以手拂影，影不动，他乃起身，亲掩半扇窗。掩窗之后，堂中暗半截，牍上字迹看不清。总督搁笔，曰：「今日且到这里。」二人一前一后出门，阶下阳光刺眼，皆眯眼，谁亦未先走。璃月港府衙门前有旧鼓一对，鼓皮已破，无人补，亦无人移。"
 LYY_Event.12042.a:"立总督，行其名"
 LYY_Event.12042.b:"废总督，别遣能吏"
 LYY_Event.12043.t:"北学开三课授吏子"
 LYY_Event.12043.d:"北学开三门课：算学、军制、北语。第一批学生多旧吏子弟，衣冠犹循旧制，执笔之姿未改。堂课之上，先生读一句，众随一句，声齐而意未达。\n达达利亚尝往听一堂北语课，坐于末席，半堂而去。归语幕僚曰：「教彼北语，教彼看得懂北国所写之文书。」看得懂与否，彼之事；写得清与否，北国之事。幕僚曰：「学生多旧吏子弟，教之何用。」他曰：「正因旧吏子弟，才要教。」\n幕僚曰：「既如此，何不并教算学、军制。」他曰：「算学教人不受欺，军制教人不白死，北语教人知欺从何来。」三课缺一，皆废课。是年冬，学堂门前积雪，他命人先扫出一条路，自门至街，不扫旁处。有学生问：「何不只扫一门。」他曰：「路是给人走者，不是给人看者。」那条路扫到街口便止，两旁之雪一直堆到开春。学生每日踏雪而来，靴上皆湿，进堂先跺三下。璃月港堂课之上，先生读一句，学生随一句，声不齐。"
 LYY_Event.12043.a:"设北学，通其文字"
 LYY_Event.12043.b:"守本地学，不习北语"
 LYY_Event.12044.t:"冰誓之日云来落雪"
 LYY_Event.12044.d:"冰誓之日，云来海落雪。雪不大，落于甲板即化，留下一层水痕。达达利亚换北国礼服，立于阶前，当众宣誓。誓词甚长，凡数节，他一字未改，声亦不高。\n观者列于两侧，有北国使，有本港商户，亦有来看热闹之船户。礼成，众皆称贺，他一一受之，面无喜色。北国使曰：「将军今日之誓，至冬必记之。」他曰：「记着便好。」北国使又问：「誓词可须改一字。」他曰：「不必。」改则非誓。\n礼毕独还船上，解礼服，叠之，叠得方正如新自铺中取出。启箱，置衣于底，覆以旧帆一幅，合盖。此后箱上积尘，他再未开过。有仆请拂拭，他曰：「不必。」仆曰：「尘厚寸许矣。」他曰：「厚则无人疑其中有何物。」\n是夜雪止，甲板上水痕结薄冰，走上去有声。他在舱中听见那声音，坐半夜，未出舱门。伸手按箱盖，掌心沾灰，就衣上擦两下。雪落于甲板即化，留下一层水痕，痕上有靴印。"
 LYY_Event.12044.a:"行冰誓，就此定分"
 LYY_Event.12044.b:"缓宣誓词，留有余地"
 LYY_Event.12045.t:"立海先换一面旗"
 LYY_Event.12045.d:"立海之第一步，是换旗。达达利亚命重画船队之旗：仍是那面渡鸦，惟爪下不复为冰纹，改为一道浪。\n画工执笔迟回，问曰：「如此，算不算背弃北国。」他曰：「旗，拿来认路者，非拿来认主者。」画工曰：「若北国之人问起。」他曰：「就说浪亦水，冰亦水，本一物也，一个会动，一个不会动。」画工曰：「冰纹乃旧主所定，改之恐有人说闲话。」他曰：「闲话不值钱，航路值钱。」\n画工不复问，遂落笔，将浪画得比原冰纹更长，一笔拖至旗角。旗成悬出，港口船户聚观。有识旧纹者指曰：「爪下之物改了。」旁一人曰：「改得好。」冰不能行船，浪能。达达利亚立其后，闻之不觉一笑。\n是夜他独上望台，看新旗在风里摆，摆半夜，旗角那一道浪始终不曾翻卷。看罢下台，命人将旧旗收好，不焚不弃。旧旗卷起时，冰纹朝内，无人再看见。璃月港画工执笔迟疑，爪下冰纹改作一道浪，浪尾略上翘。"
 LYY_Event.12045.a:"改旗作浪，另立海号"
 LYY_Event.12045.b:"仍循北制，不敢易帜"
 LYY_Event.12046.t:"护航宪章贴茶馆"
 LYY_Event.12046.d:"护航宪章写得比军令还细：几船一队，走哪条线，遇风何处避，出事谁任其责，皆一一书明，不设虚文。达达利亚命人贴于船户常去之茶馆壁上。\n贴时浆糊未干，有船户围读，读至出事谁任其责一节，众皆指点，争论半晌。达达利亚在旁听之，不出一语。既而曰：「字写明白，海上之事便少一半麻烦。」众视之，方知言者是谁，一时敛声。一船户曰：「章程既出，若有人不守。」他曰：「不守者，下一趟不与他同队。」\n头一月，船户过者必看一眼，有识字者念与他人听。看熟之后，便自按其上规矩行走，不复相询。\n茶馆主人于壁旁置一几，几上放茶一碗，说是给看章程之人润喉，碗日日换，从未空过。有老船户饮毕，以指蘸茶，在桌上画航线，画完一抹，曰：「写在纸上，不如画在桌上记得牢。」几上那碗茶，后来改用大碗，盖看者渐多。宪章贴于璃月港茶馆壁上，纸以浆粘，茶烟熏之，边角转黄。"
 LYY_Event.12046.a:"颁护航宪章，昭告船户"
 LYY_Event.12046.b:"以军令督航，不立明章"
 LYY_Event.12047.t:"二十七船首出洋"
 LYY_Event.12047.d:"远洋商队头一回出海，二十七条船，帆色不一，所往之处无人挂过旗。清晨解缆，缆落水有声，岸上无鼓乐，惟船户家眷立埠头，各以手遮日。\n达达利亚送至半程，立于灯塔之下。有船长临行问曰：「怕不怕亏。」他曰：「怕。然停在港里之船，一辈子也挣不回一条新航线。」船长笑，解缆而去。随行曰：「若遇风。」他曰：「遇风则散，散则各自回港，不必等。」\n船队转灯塔时，帆影相叠，渐小如叶片，渐隐于海气。他在岸上立良久，潮打石阶，靴底尽湿。归时语随行曰：「二十七条，回来二十条便算赚。」随行不敢应。他又曰：「少一条，便记一条之名。」随行曰：「记在何处。」他曰：「记在旗上，回来一条，添一笔。」一个月后旗上添十九笔，尚余八笔未添。他把旗折起，收在舱内，不挂在外。有人问那八笔几时添。他曰：「等。」璃月港帆色不一，缆落水有声，岸上无鼓乐，惟船户家人。"
 LYY_Event.12047.a:"遣远洋商队，博其利"
 LYY_Event.12047.b:"守近海航线，稳中求进"
 LYY_Event.12048.t:"南十字船队合流"
 LYY_Event.12048.d:"南十字船队合流之日，海面旗色杂乱，赤者、青者、补丁者，望之如一集市。众船争道，呼喝相闻，锚链交缠，理了半日方解。\n有人劝达达利亚收编之。他曰：「收编则成吾之兵，彼死一人，吾须赔一人。不如合而行之，各算各账，反能行远。」劝者曰：「既不收编，号令不一，临阵奈何。」他曰：「临阵各保其船，号令之善，无过此者。」\n是夜两家船长共坐一桌，酒过三巡，言语渐通。南十字一老舵工举碗曰：「我等久在海上，只认两件事，一为风，二为言而有信之人。」达达利亚亦举碗曰：「风我不敢许，言而有信可以许。」二人对饮，碗底相击，声脆。\n席散时天将明，潮已转。老舵工临出门，回过身来，把一枚旧罗盘放在桌上，曰：「押在这里。」那枚罗盘针已不灵，转起来忽东忽西。达达利亚看了半晌，把它收进衣袋，曰：「不灵之物，押着最重。」南十字之旗为旧帆改制，帆上有补丁三处，线色不一。"
 LYY_Event.12048.a:"与南十字合流，各算各账"
 LYY_Event.12048.b:"收编其众，尽归我有"
 LYY_Event.12049.t:"补给点先水后煤"
 LYY_Event.12049.d:"海外补给点一处一处而修，先修淡水，次修煤，末乃修炮。匠作请先修炮，以备不虞。达达利亚曰：「补给点乃为船而设，非为仗而设。」船无水则人死，无煤则船停，无炮不过少打一仗。\n第一处落成之日，不鸣炮，不剪彩，只命人于门首立木牌一方，书曰此处可停三日。匠作曰：「既为船用，何不并修船坞。」他曰：「坞乃自家之物，点是给过路人者。」\n木牌初立，字迹尚淡。往来船户停此取水，有人以炭补其笔画，有人以刀刻深其痕。数年之后，牌上字粗了一圈，边角尽圆。守点老卒每日拂之，语人曰：「此牌非我所立，然我守它，比守炮台尽心。」人问其故。老卒曰：「炮台立十年未曾响过，此牌一日要应十几回。」\n他每晨以水洗牌面，洗罢，将牌扶正，退两步看正不正，方去做饭。有船户问其姓名，他不肯说，只说自己乃看牌者。璃月港淡水先修，次修煤，末乃修炮，匠作请先修炮，不许。"
 LYY_Event.12049.a:"广设海外补给点"
 LYY_Event.12049.b:"只守本港，不出远洋"
 LYY_Event.12050.t:"催额只交旧年数"
 LYY_Event.12050.d:"北国催额又至，比去年多三成，文书限期只十日。达达利亚受书，搁于案上三日不动，茶碗在旁换了几回，文书未展第二遍。\n三日之后，回书一封，极短，只一行：「今年之额，只按原数交。」封发之日，港中风声骤紧，船户交语，市上盐价先动。副官曰：「北国若加兵。」他曰：「加兵则不必回书。」回书者，给讲理之人看。\n他照旧于甲板练枪，一枪一枪，刺向悬空之草靶。练毕，汗透重衣，语副官曰：「彼等会再来问。来时汝辈一句话亦不必说，让吾来说。」副官曰：「若彼不问，径自动手，奈何。」他收枪，以布拭刃，曰：「那便非问额，乃问此港还姓不姓云来。」\n言毕，将布搭于肩上，去看草靶，靶心已穿作一团。乃将枪插于架上，坐下，接过副官递来之茶，饮一口，曰：「太淡。」副官曰：「去重沏。」他曰：「不必。」淡者好，淡者喝得久。璃月港文书搁于案上三日不动，茶碗在旁换过数回，茶已淡。"
 LYY_Event.12050.a:"只按原数交额"
 LYY_Event.12050.b:"照额多交，以免生隙"
 LYY_Event.12051.t:"盐引改印铁不外出"
 LYY_Event.12051.d:"盐与铁，从前大半须经北国之手，如今一条一条收回。盐引改本地印，印文新刻，边有毛刺；铁器只销本港，出港者须验票。\n有老商问曰：「如此，岂不惹恼北国。」达达利亚曰：「惹恼，迟早之事，早晚不如早。」老商曰：「早晚既皆不免，何不拖些时日。」他曰：「拖一日，乃拿他人之刀磨自己之颈。」老商曰：「盐铁既归本港，价由谁定。」他曰：「由市定。」老商曰：「市乱则价乱。」他曰：「价乱尚可治，命在人手不可治。」\n乃命账房另起一册，封面不书一字。账房问：「此册何名。」他曰：「无名。有名则有人来查，无名则只有我知。」账房捧册而退，行至门口，他又曰：「记住，头一笔，记日子，不记钱。」账房回车，见册首已有一行小字，墨迹未干，所书今日某时某刻，盐印落匣。账房看那一行，忽觉手冷，将册合上，又打开，终究不曾添字。璃月港盐印新刻，边有毛刺，印落纸上，朱色偏浓。"
 LYY_Event.12051.a:"盐铁收归自印"
 LYY_Event.12051.b:"仍由北国代销"
 LYY_Event.12052.t:"云来海自定海规"
 LYY_Event.12052.d:"自主海权落于纸上之日，云来海挂出自己之旗。旗不甚大，悬于旗舰船头，风来则展，风去则垂。\n达达利亚立于船头，望浪上旗影，随波起落，久而不语。既而谓左右曰：「自今日起，此海之上规矩，吾辈自定。」定得佳否，往后方知。左右曰：「若定坏，奈何。」他曰：「定坏再定，总胜于一生照他人所定。」\n左右问：「旧规矩如何处置。」他曰：「留着。」命人取旧航图来，一张一张检视，有北国印记者亦不焚，尽数收入木匣。匣满，以绳束之，置于舱底。有人请焚之，以绝后患。他曰：「烧图容易，烧不去照图走过之人耳。」\n那人曰：「留之，后人将以为吾辈仍听命于北国。」他曰：「后人若只看图便下断语，亦不足与言。」言罢命人抬匣下去，抬者踩空一级，匣撞舱壁，闷响一声。他未回头。港外浮标三枚，上刻潮候，潮至则没，潮退则出。"
 LYY_Event.12052.a:"定自主海权，自订海规"
 LYY_Event.12052.b:"仍奉北国海令"
 LYY_Event.12053.t:"两路归于一码头"
 LYY_Event.12053.d:"两条路走到尽头，皆归同一处码头。达达利亚取两年来所有租约、航图、军约，尽摊于长桌，一桌不足，续以一案。纸角相压，墨色深浅不一。\n乃重写为一册，删其重复，存其可行。书至扉页，援笔久悬，终落一句：「云来海，至冬之土，亦我之土。」写完视之良久，终未撕去此页。管卷宗者问：「删去之条，可须另录。」他曰：「录。」删者，比留者要紧。\n管卷宗者入内受册，接时见他手指按于扉页，久不抬起，遂不敢催。册交其手，纸角微湿。退至门侧回望，见他仍坐，案上散纸未收，窗外潮声正起。管卷宗者后语人曰：「那一页，他到底未撕。」人问：「为何不撕。」答曰：「撕之便干净，然干净之物，往往未见其真。」管卷宗者抱册出，行至廊下，遇风，将册护于怀中，走得更快。他回头看那门，门内灯还亮。租约、航图、军约尽摊于桌，一桌不足，续以一案。"
 LYY_Event.12053.a:"立云来总册，一体遵行"
 LYY_Event.12053.b:"各约分治，互不相统"
 LYY_Event.12054.t:"长冻无事亦有声"
 LYY_Event.12054.d:"长冻乃一段无大事之日月：船照开，税照收，北国之账照催，海上之旗照升。日复一日，几于无痕。\n达达利亚渐不日日登甲板，惟夜坐舱口，听片时浪声。浪声如一，听久则分不出远近。有时风止浪亦止，他便坐得更久。部下曰：「既无事可为，何不出而一行。」他曰：「行亦看他人之事耳。」\n旧部下来访，携酒一坛，二人对坐。部下问：「近来安否。」他曰：「无事。」部下曰：「无事则佳。」他曰：「佳则佳矣，只是太静。」部下点首，亦寻不出别语，惟举碗。碗空，二人皆看舱外一片黑。黑中有灯，灯在他船之上。\n部下辞去，他送至舷梯，曰：「再来时，携些岸上之事。」部下第二年复来，携新炒之茶一包，言岸上而今盛行此物。他拆开闻之，曰：「香。」收于柜中，终未煎，曰：「留着，待有事时再饮。」长冻之月，璃月港中冰薄，船不系缆，以绳连诸舷，一船动则众船动。"
 LYY_Event.12054.a:"照旧开港，静待时变"
 LYY_Event.12054.b:"整军备战，防其反目"
 LYY_Event.12055.t:"潮回港热闹人已老"
 LYY_Event.12055.d:"多年以后，云来海潮汐依旧准点，来去不差一刻。达达利亚已老，鬓白，行步须扶栏。港口却比他在时更热闹，帆樯如林，市声彻夜。\n有年轻人不识其人，坐于埠头，与他同看落潮，问曰：「闻此地当年旗号数易，究竟谁胜。」他沉吟片刻，答曰：「旗子从来不赢。」赢者，乃还留在此条船上之人。年轻人曰：「然则赢者尚在乎。」他曰：「在。」皆在船底。年轻人不解，他亦不再解释。\n年轻人张口欲再问，见他已闭目，遂止。潮退，露出滩上一截旧缆，半埋沙中。他睁眼见之，曰：「那缆，我所系。」年轻人问：「系于何处。」他曰：「系于沉船。」言毕起身，扶栏而去，未再回头。\n年轻人低头看那截缆，缆上一结，打得极拙，与港中诸结皆不同。年轻人伸手去拉，缆已朽，一拉便断，断口皆沙。他拾起断缆一截，揣于袖中而去。港口比他在时更热闹，帆樯如林，旗色亦多。"
 LYY_Event.12055.a:"就此交卸，任后人评"
 LYY_Event.12055.b:"久掌云来，未肯释权"
 LYY_Event.12056.t:"云来章程并三册"
 LYY_Event.12056.d:"云来章程颁行之日，海面平静得能照出人影。达达利亚取北国租约、五方通约与本港税则，并为一册，页数以朱笔编号，一号不缺。\n颁行不设高台，只在码头一张旧桌，四角压以石块，海风掀之不起。众人环立，他自执册宣读，声不高，读至中间数条，稍作停顿，饮一口水。有人问：「老规矩与新规矩相冲，谁先。」他曰：「先看哪一条能令人生。」\n念至末条，忽止，曰：「自今日起，此港之事，一半按老规矩，一半按新规矩。」念毕合册，交与管卷宗者，转身去看海。众人未散，有人低声问：「一半一半，若两半相冲奈何。无人答。」管卷宗者抱册于怀，见封皮上尚有余温，知是方才手按之处。他抬头，见达达利亚已走到栈桥尽头，一手扶桩，一手垂着，站了很久。站了很久，他把手从桩上移开，掌心有一道压痕，久久不退。璃月港三册并为一册，页数以朱笔编号，号至末页而止。"
 LYY_Event.12056.a:"颁行云来章程"
 LYY_Event.12056.b:"废章程，仍以军法临之"

 YLH_Spirit_Childes_Abacus:"拨账亦握枪"
 YLH_Spirit_Childes_Abacus_desc:"其人一手拨账，一手握枪。云来海之出入，必经其心：此一笔，值吾亲署否。客以巨利说之，听毕，取算筹布于案，拨之良久，谓此利在三年后。客谓三年非久。乃答以三年之内，须以兵守之，兵费几许，客未言。客谓可减。答以减则守不固。乃推筹而起，曰：「此笔不署。」客去，其账上仍记此客之名。"
 YLH_Spirit_Northern_Patronage:"受恩皆有偿"
 YLH_Spirit_Northern_Patronage_desc:"钱、粮、械、舟，北国给之甚速，惟求署其末页一行小字。受者初不细读，及读，乃知其重。受者问此一行何时当偿。使者答以不急。问何以为期。答以待汝不能偿之日。受者言若永能偿。使者笑曰：「则吾亦永不来取。」受者默然，取笔署之，署毕视其字，墨未干而手已汗。末页小字以细笔书，字小于常，就璃月港灯下方辨。"
 YLH_Spirit_Sea_Power:"渡鸦爪下浪"
 YLH_Spirit_Sea_Power_desc:"渡鸦之爪，旧攫金铁，今攫一浪。海上之规，自此由己而定：舟之大小，货之轻重，遇风谁让，皆出一口。老舟人问此规能行几时。其首答以行至风变。老舟人问风何时变。答以不知。老舟人谓不知而先定，可乎。其首曰：「不定则人先乱。」老舟人视海，良久，曰：「然则吾辈且看。」渡鸦之旗升于璃月港主桅，桅为整木，高七丈。"
 YLH_Spirit_Convoy_Charter:"护约榜于关"
 YLH_Spirit_Convoy_Charter_desc:"数舟为一队，行何道，遇险谁任，失货谁偿，皆书于纸，贴于茶肆之壁。有识字者立而读之，读至偿货一条，众皆点头；读至遇盗不救者罚，有舟人曰：「此条太苛，盗众我寡，奈何。」旁一人曰：「不救者，下次无人救汝。」舟人语塞。是月，港中结队者十七，独行者三，三舟之中，一为盗所掠。章程贴于璃月港茶肆之壁，纸以浆粘，茶烟熏之转黄。"
 YLH_Spirit_Salt_and_Iron:"盐引本地印"
 YLH_Spirit_Salt_and_Iron_desc:"盐引改由本地印，铁器只销本港。老商谓此与北国绝矣。主者答以绝者迟早之事，早绝则早备。老商问备者何物。答以舟、械、粮，及一册新账。账房奉命起册，封面不书一字。老商问何不书。账房答以此册所记，皆不可示人者。老商取册视之，第一页惟书四字：自今日始。乃合册，谓己老矣，此册归汝辈。盐引新印，边有毛刺，印落纸上朱色偏浓，存璃月港盐署。"
 YLH_Spirit_Grey_Captains_Office:"灰袍署理海"
 YLH_Spirit_Grey_Captains_Office_desc:"灰袍既众，乃设署。署不设堂，惟赁一楼，楼上悬一图，图以炭画，日日改之。凡舟欲行，先至楼下报舟几艘、货几何。署中人取炭添于图，告以明日此道有风，改行南线。舟人谓南线远三日。答以远三日，胜沉一舟。舟人从之。是岁港中失舟者二，皆未报而自行者。署赁璃月港一楼，楼上悬图，图以炭画，日日改之。"
 YLH_Spirit_Abyss_Concordat:"渊约悬案未决"
 YLH_Spirit_Abyss_Concordat_desc:"渊底之约，其价高得令人心悸。约成，搁于案上，三日未动。主者问何不署。其将答以可谈，然须先明一事：彼所要者，会不会转而要我之命。主者问此问谁答。答以无人能答，故不署。主者谓不署则失一援。其将曰：「失一援，犹可战；引一刃入怀，则无可战。」主者视案上之约，取之，投于炉。约搁于璃月港案上，三日未动，后取之投于炉。"
 YLH_Spirit_Question_the_Sky:"信改终不寄"
 YLH_Spirit_Question_the_Sky_desc:"上书天理之信，改而复改，凡七稿。第一稿言战，第二稿言和，第三稿言共存，其后四稿，惟删其字，不加其辞。及定稿，反覆视之，终不寄，压于海图之下。或问既书之，何不寄。答以寄则须待回音，不寄则此事尚在我手。问者谓然则此信终无用。答以有用，每观之，自知所争者何。七稿压于云来海图之下，纸角起毛，为手所翻。"
 YLH_Spirit_Winter_Garrison:"鹰旗驻两营"
 YLH_Spirit_Winter_Garrison_desc:"鹰旗之下两营，饷自北国出，号令亦自北国下。初驻之日，市人聚观，小儿随其鼓声而走。居半载，鼓声如故，观者渐稀。老妇语邻，谓此兵不扰人，亦不问人，然街口之摊已移入巷内。邻问何故。答以摊在街口，其目及之；在巷内，则不及。老妇谓彼未尝驱我。邻曰：「正以其未尝驱也。」璃月港北两营驻于鹰旗之下，营外即市，摊已移入巷内。"
 YLH_PW_Spirit_Five_Envoys:"五纸钉舆图"
 YLH_PW_Spirit_Five_Envoys_desc:"五人之名，各书一纸，钉于舆图之侧。刻晴、凝光、甘雨、申鹤、蓝砚，纸色不同，钉处亦不同。客问此何用。主者答以刀所守之地，易得亦易失；人情与账目所系之地，失之则难复。客谓此五人可恃乎。主者答以不可恃，故以纸钉之，使吾日日见其名，日日思其难。客视纸上钉痕，已深。五纸钉于玉京台舆图之侧，钉处木色新，痕深可辨。"
 YLH_Spirit_Harbor_Charter:"租税并一册"
 YLH_Spirit_Harbor_Charter_desc:"租约、通约、税则，合为一册，凡九十一款。成册之日，命人立于港市，朗声读之，自晨至午，读毕复读，三日乃止。听者问此册谁定。读者答以官与商共定。问商在其内乎。答以在其内。问既在其内，何以为公。读者曰：「正以其在内，故须读与众听。」听者点头，归而语其徒，徒亦来听。九十一款合为一册，立于璃月港市中，自晨至午，读三日乃止。"
 YLH_Spirit_Cloud_Sea_Treasury:"库盈则言多"
 YLH_Spirit_Cloud_Sea_Treasury_desc:"盐、铁、丝、粮，出入皆过一账。库满之时，人人有言，言多及分法；库空之时，无人言，惟见旗不能直。老库吏掌钥三十年，尝语其徒，令观旗。徒问旗何如。答以风大则直，风止则垂；库亦如是，满则人声如风，空则人声止。徒问然则何者为患。老吏曰：「空者尚可复，满而争者，不可复。」库在云来海岸，门以铁包，锁为铜，凡五具。"

 YLH_North_Tier_1:"北援之阶"
 YLH_North_Tier_1_desc:"北援断绝，钱粮两空。码头上冷冷清清，账房翻来覆去地算，越算越薄。北国之船三月不至，馆中使者先撤，次撤匠人。所遗之械，零件不配，坏一具则废一具。账房核至末页，见红字一行，乃去年所批之勉语。"
 YLH_North_Tier_2:"北援之阶"
 YLH_North_Tier_2_desc:"北援零星，聊胜于无。军械箱上霜纹未化，账上已记下第一笔息。援船一年三至，每次所载不足原额之半。押运者言其国亦有难处，请宽期。主事者不争，惟命账房照原额记息，一笔记一行，行末加圈。"
 YLH_North_Tier_3:"北援之阶"
 YLH_North_Tier_3_desc:"北援平稳，货船按月靠港。日子过得下去。港中之人亦渐习惯，先看北国脸色，再开口。港中议事，凡涉远洋者，先遣人问馆中使者之意，问毕乃议。老商人谓此如赁屋而居，屋主不问，而自知其分。"
 YLH_North_Tier_4:"北援之阶"
 YLH_North_Tier_4_desc:"北援厚重，军械成批。城中兵卒穿北国之装，食北国之粮，言语亦带冰气。新募之卒，三月而能操北式之械；半年而能诵北国之令，一字不差。老卒听其诵，谓其徒曰：「此调子，我听二十年，未改。」"
 YLH_North_Tier_5:"北援之阶"
 YLH_North_Tier_5_desc:"北援满溢，已无退路。云来海诸事皆先过一遍北国之手。达达利亚立于甲板，头一回分不清己是主人，抑是管事。港中盐引、航照、军械、粮册，四册皆有一副本在北馆。副本来取，先于正本。一日两册数目不合，港中改其正本以就副本。"
 YLH_Sea_Tier_1:"海权之阶"
 YLH_Sea_Tier_1_desc:"海权尽失，航路旁落。挂本港旗之船出口，识者无几，货价亦由他人说了算。船出港三十里，即须换他国之引水；至外港，泊位在末，卸货在夜。有船长以本港旗为耻，出港即降之，易以旧旗。"
 YLH_Sea_Tier_2:"海权之阶"
 YLH_Sea_Tier_2_desc:"港灯初亮，护航初成。船户开始记得，这条线上有人替彼等执言。护航之船三艘，皆旧，而船户愿随之行。盗舟见其旗而退，退者不知虚实，只见旗同一色。船户归港，先谢护航，次谢灯。"
 YLH_Sea_Tier_3:"海权之阶"
 YLH_Sea_Tier_3_desc:"航路在手，商队渐远。云来海之名复见于远方港口，虽不响亮，却已有人问。远港之牙人初见其旗，须翻册乃知；三年后再见，不待翻册，先问盐价。船长记此一节于日记，谓此即名之始。"
 YLH_Sea_Tier_4:"海权之阶"
 YLH_Sea_Tier_4_desc:"远洋执旗，海规自定。此海之抽成、护航、补给，皆须先问过云来海一遍。凡船过此海，先领一纸，纸上列其应缴之数；不领者，无泊位，无补给，无引水。他国船队试不领，泊三日，终领之。"
 YLH_Sea_Tier_5:"海权之阶"
 YLH_Sea_Tier_5_desc:"自成一方，海上无二。云来海之旗插到北国管不着之处。达达利亚却比谁都清楚：走得愈远，风浪愈大。新辟之航线凡七，其五不入他国海图。船长归报，皆言其地无人烟，惟礁与雾。达达利亚闻之，命各船添锚一具，余不问。"
 YLH_PWCombo_Both_High:"两端并在一掌"
 YLH_PWCombo_Both_High_desc:"北国之钱照拿，海上之旗照升。云来海一边数至冬送来之军械，一边把自家航图铺满整张桌子，日子热气腾腾。惟达达利亚清楚，此二物早晚要在同一张纸上相打。他命人另置一室，室中只一桌，桌上只一图。图左写北额，图右写新路，中间留一道空。客问此空何用。答曰：「留与日后相打之处。」"
 YLH_PWCombo_Both_Low:"两头皆空"
 YLH_PWCombo_Both_Low_desc:"北国粮船迟迟不到，海上航路亦无人应声。码头静得只剩潮声。账房翻来覆去算，愈算愈薄。港中旗半降，非为哀，为无风。老舟人坐于废桅之下，削一木片，削成小舟，置于水面，看其打旋，看至沉没，乃起而去。"
 YLH_PWCombo_A_High:"借人之手"
 YLH_PWCombo_A_High_desc:"钱出北国，枪出北国，连顾问言语亦带北国口音。城中日子过得下去，只是每次抬头，先看见者皆他人之旗。港中童子游戏，以木为旗，皆做北式。塾师欲改之，童子问何以改。塾师不能答，乃取其旗，另加一道云纹，曰：「加此一道。」"
 YLH_PWCombo_B_High:"自有一海"
 YLH_PWCombo_B_High_desc:"航路一条一条收回，远洋船队愈走愈远，北国催额却愈难答复。达达利亚曰：「船停港中最安全，可也就一辈子挣不回一条新航线。」船队归港之日，账上多一栏新路之费，而少一栏北额之数。账房不敢书，请示。达达利亚取笔，自书其数，书毕曰：「此栏吾担。」"

 #################### 蓝砚 · 沉玉谷 ####################
 CYG_CivilWar_Valley:"山风报丧谷自立"
 CYG_CivilWar_Valley_desc:"帝君驾崩之信，顺山风入沉玉谷。蓝砚方蹲于枯黄梯田之侧，手握沙一掬。闻之，徐徐撒沙归田，曰：「城中之神死矣，然此山之土，已死多年。」乃直腰望谷口，口悬璃月港牌册，上书征收赋税、开采矿产之旧令。曰：「昔者吾辈为活命而挖空此山，今则连挖山之人亦不必来，彼只要将谷中最后一点水，亦划入其账。吾不答应。」言毕，以足踏碎一土块。"
 CYG_Reclaim_the_Terraces:"垒埂先从第一锹"
 CYG_Reclaim_the_Terraces_desc:"复耕梯田，自第一锹土始。谷中壮丁多已流亡，所留者老人、妇人与孩子。蓝砚率之，一阶一阶，将塌者重垒。有妇人力尽，直不起腰，问曰：「此尚有用否。」蓝砚曰：「有。汝观此土，松其一寸，彼即还汝一寸之绿。」世间再无如土地之讲信用者。妇人拭汗，复俯身。日暮收工，众坐田埂，无人言语，惟闻山下泉声。泉下流三里，即翘英庄界，庄人夜闻此声，亦作息如约。"
 CYG_The_Village_Council:"老树之下无主位"
 CYG_The_Village_Council_desc:"村社大会，不设主位，不用印信，众人围坐于谷中最大一株老树之下。蓝砚但立而尽其言，言毕即退，听众人自议。有人嫌其乱，曰：「宜有一人说了算。」蓝砚曰：「谷中昔有说了算者，即那位卖山之谷主。」诸君所怀者，其人乎，抑那块地乎。满座默然，俄而点头者四起，如风过禾。一老者拊膝曰：「此话早三十年有人讲，山不至于此。」自兹每旬一聚，聚于翘英庄社树下，议毕各归，无一纸凭。"
 CYG_Forbid_the_Axes:"禁斧先禁老树"
 CYG_Forbid_the_Axes_desc:"禁斧令者，蓝砚所立第一道谷规：凡为垦荒、为薪炭而伐成材之树者，罚；伐十年以上老树者，逐出谷。有人詈其不近人情，曰：「冬日冷可杀人。」蓝砚引之至一片光秃山坡，指曰：「尔等上山立一立，风自隙入，直灌骨髓。」树尽伐矣，将何以挡风。以咒骂他人挡之乎。其人无辞，退。是冬薪炭不足，谷中分柴而烧，无一人复言伐树。斧禁榜悬于灵濛山口，榜为木，斧痕犹在，观者自计。"
 CYG_Guard_the_Springs:"石渠护泉禁牧"
 CYG_Guard_the_Springs_desc:"护泉者，守谷中仅存之数眼活泉，视之如命。蓝砚命人以石砌渠，以草覆土，禁人于泉眼左右牧畜洗染。曰：「水能记路。尔待之善，则岁岁复来；若断其路，一去即永远。」言时声甚轻，如道一久出未归之亲。有牧童驱羊近泉，为守望者所止，不服。蓝砚至，不责，只取一瓢泉水与之，曰：「饮此一口，便知此水值几头羊。」牧童饮，遂驱羊去。泉在琼玑野东麓，守望者两旬一易，易之日，旧者引新者周泉一匝。"
 CYG_The_Refusal:"当众焚港府文书"
 CYG_The_Refusal_desc:"拒港府之命，蓝砚始明其志。取璃月港文书铺于众前，一条一条读之：开矿、修路、征丁、纳税，皆冠以为谷中百姓谋福之名。读毕，问曰：「福在何处。无人答。」乃取文书就火焚之，火起而纸卷，灰落于案。曰：「自今日起，沉玉谷之事，吾辈自主。做不好，亦是我等自己之账。」火将熄，一老农以杖拨灰，曰：「谷主当年亦读文书。」蓝砚曰：「故焚之。」"
 CYG_Terraces_of_Green:"青苗及膝人先泪"
 CYG_Terraces_of_Green_desc:"青田之名，至复耕之第二年方叫得出口。其时最先复耕之一片梯田，苗已及膝，风过则绿光晃动，照人眼。蓝砚立于田埂，见一童在田中翻滚，忽觉眼眶发热，乃别过头去，谓左右曰：「勿笑我。吾只念，吾父母在时，此田即如此模样，彼临终之际，犹念此事。」左右无言。良久，一妇人曰：「我娘也是。」二人遂不复言，只看那童在绿里翻来覆去。此梯田在沉玉谷北，春分前后，绿自下田次第而上，凡九重。"
 CYG_The_Shared_Granary:"余粮自报不催"
 CYG_The_Shared_Granary_desc:"共仓之首事，乃将谷中尚有余粮之数户，一一请至仓前。蓝砚不强人所难，只令各户自报其数，自定所交。有交者，有不交者，皆记于册，而不加追究。曰：「吾不逼尔等。吾只欲尔等一看，交者之家，此冬如何相扶而过。」信之一物，须先有人肯先交出，方长得出来。是冬仓前分粥，交粮之家先得，不交者亦得，惟册上无其名。仓设于翘英庄社祠之内，梁悬旧秤一，凡出入必过之。"
 CYG_The_Mountain_Path_Watch:"牧童采药皆斥候"
 CYG_The_Mountain_Path_Watch_desc:"山径守望者，以谷中每一条可行之路为念。为守望者，乃牧童、采药人、砍柴之妇人，昼间各理其业，惟过路时多顾两眼。蓝砚曰：「最好之斥候，即本来须走此路之人。不须教之，此路每块石头，彼已踩了半世。」一日有生人自北径入，未及谷口，牧童已吹角。蓝砚问其何以知，牧童曰：「他避一块石头，那块石头本不必避。」山径通遗珑埠，径旁石上旧刻里程，霜天犹可辨。"
 CYG_Herb_and_Root:"草方尽录无藏"
 CYG_Herb_and_Root_desc:"草根药者，谷中唯一之医。无名医，无良药，惟有老人所传数方，与满山之草。蓝砚请识草之数老于一室，令各诵其方，一一笔录。一老不解，曰：「方子传出去，便不值钱矣。」蓝砚曰：「方子不值钱。」值钱者，明年那一个病童，尚认不认得草。老人默然，乃尽其所知，至夜未尽。灯下笔录者换了三人，纸积一寸。所录之方，后藏于翘英庄药铺，铺主守其柜，借阅不取值。"
 CYG_The_Levy_Refused:"断径三丈拒税吏"
 CYG_The_Levy_Refused_desc:"抗征者，沉玉谷初次真动干戈。港府税吏率兵堵于谷口，声言粮不出则封谷断水。蓝砚不出，只令守望者于税吏必经之隘口，掘断其路三丈，深及人腰。税吏狼狈而退，扬言来日算账。谷中欢呼，声动山谷。蓝砚独坐田边，久无一言。有妇人与之并坐，问曰：「赢了，何不喜。」曰：「路断三丈，可补；人既动手，便再难回头。」言毕，取土一块，捏之成粉。"
 CYG_Community_Kitchens:"一锅同炊无谢"
 CYG_Community_Kitchens_desc:"共炊者，各家出柴、出米、出盐，合煮一锅，众人列为一队，依次而盛。有人嫌其状如乞，蓝砚取碗一具，直递其手，曰：「乞者待人施与，吾辈自煮自食。尔捧此碗，且先想明此事：既不欠谁，便不必谢谁。」其人受碗，面微赤，退入队中。是日饭粗而热，锅底焦处，有童子争食之。公灶凡七处，散于琼玑野诸社，灶日开两餐，钟响即闭。"
 CYG_Seed_Banks:"以粮换种赌来春"
 CYG_Seed_Banks_desc:"谷种之库，乃沉玉谷押上将来之一赌。蓝砚率人遍搜谷中人家，收各家所留之种，一粒一粒拣之、记之、分装之。有老翁不肯交种，曰：「此乃祖上所传，最后一斗矣。」蓝砚取己口粮半袋，塞其怀中，曰：「换。尔之种交我，我之粮与尔。明春开冻，种仍是尔之种，粮不必还。」只须此谷之中，尚有人种田。老翁抱粮而立，忽跪，蓝砚急扶之。"
 CYG_Militia_of_the_Terrace:"竹矛立于自家田"
 CYG_Militia_of_the_Terrace_desc:"护田队者，谷中初执兵者。无甲，无饷，所持者农具、猎弓与削尖之竹。蓝砚授第一支竹矛时，正色曰：「此非使尔等去杀人。此使尔等立于自家田边，令欲动手者先自掂量：此一片土，有人守着。」受矛者为一少年，接矛在手，觉轻，问曰：「此物可杀人乎。」曰：「不必能杀，只须使人知其会伤人。」少年点头，握矛之处，次日已成深痕。农暇操练于沉玉谷西坡，矛列于田埂，练毕即扶犁。"
 CYG_The_Valley_Charter:"通篇无一令字"
 CYG_The_Valley_Charter_desc:"山约者，沉玉谷初有自己之规矩。蓝砚不书一令字，通篇皆曰吾辈既不如何，亦不如何：既不纳不属谷中之赋税，亦不受谷中不认之号令。写成，有人问曰：「此算何等章程。」曰：「此只一句话：此谷自今往后，自己认自己。」问者取卷读之，读至末行，忽曰：「通篇无一个准字，亦无一个禁字。」蓝砚曰：「有之，则又成一令矣。」"
 CYG_No_Master_No_Lord:"不奉神亦不奉王"
 CYG_No_Master_No_Lord_desc:"无主无君者，沉玉谷之态度尽于此。蓝砚曰：「吾辈不要神，亦不要王。」神在高处，听不见谷中之哭；王在港口，算不清谷中之水土。语至此，少顿，复曰：「吾辈只要一物，能使吾辈自守此谷。此谷，待之以善，则肯活下去。」有少年问曰：「既无主无君，若有事，谁担之。」曰：「谁做，谁担。」少年曰：「那便乱。」曰：「乱则乱些，然账是自己之账。」"
 CYG_The_Free_Communes:"散作十社聚一盟"
 CYG_The_Free_Communes_desc:"自由村社者，蓝砚于此土之规画：无统属，惟有结盟；无上下，惟有相连。谷中十余村社各治其村，遇大事乃聚而相商。或忧其如散沙，不能御外。蓝砚曰：「外人打进来时，尔所欲者，是一支能战之兵，抑或一片无人肯让出之地。」问者不能答。蓝砚曰：「兵可败，地不可让。」兵败则人散，地失则人无处可归。言毕，指谷中诸峰：此十余社，即十余处可归之地。诸社以琼玑野为腹地，社与社之间，惟以山路与歌相闻。"
 CYG_Common_Lands:"公田按户按劳分"
 CYG_Common_Lands_desc:"公田者，村社之制落地第一步：尽收谷主昔日强占之地，归村社共有，按户分种，收成按劳而分。有人乘间多占，为人当面摘发。蓝砚不偏一方，只令村社大会当众议之，卒定：多占者退还，并代被占之家耕作一季。曰：「公田者，使有私心之人，亦须先学一事，名曰遮掩不住。」多占者受议，无辞，翌日率妻子下田。众立埂上观之，无人嘲，亦无人助。公田在翘英庄溪北，界石为旧祠柱所改，柱上字犹可读。"
 CYG_No_Taxes_No_Chains:"谷口木牌书不征"
 CYG_No_Taxes_No_Chains_desc:"罢税去枷者，沉玉谷对外之宣告：「凡入谷中，不得以何名目征敛；凡谷中之人，不得以何名目拘束。此规书于谷口木牌，往来行人、流民乃至迷路商队，皆得见之。」或曰：「此乃自寻麻烦。」蓝砚曰：「麻烦本已上门。」与其被人缚而问要不要钱，不如吾先自说明白：不给。其人笑曰：「说得硬，做得硬否。」蓝砚曰：「做不硬时，此牌自会被人砸去，何劳君问。」"
 CYG_The_Rotating_Watch:"老守火堆幼瞭望"
 CYG_The_Rotating_Watch_desc:"轮值巡山，谷中人人有份，不分男女老幼，惟看力之大小。老者守谷口火堆，童子瞭望山口，青壮走夜路巡更。蓝砚曰：「吾不望谁替谁白干一世。吾只望每一个守过山者，皆记得所守者乃自家院墙。」如此，则无人肯偷懒。有老妇守火至三更，困而坐寐，为过路巡者所见。巡者不唤，自解衣覆之，代守一更。天明老妇醒，见衣在肩，四顾无人。守火之制，行于沉玉谷诸隘，冬则倍其班，春乃复旧。"
 CYG_The_Assembly_of_Peaks:"诸峰初会各诉难"
 CYG_The_Assembly_of_Peaks_desc:"诸峰之会，沉玉谷左右数山村初次齐聚。来者之中，有旧日世仇，相见则目赤。蓝砚不问旧怨，只令各社自陈其难，一家说毕，一家继之。说至日中，众人渐觉所惧、所缺、所恨，竟是一事。言者声低，听者点头。散会时，一旧仇主动趋前，与对方执手。蓝砚远立而观，只曰：「可矣。」归途有人问：「此会何所成。」曰：「甚么也不成，只是彼此认得脸面。」"
 CYG_The_Wind_And_The_Grass:"草籽还风山自绿"
 CYG_The_Wind_And_The_Grass_desc:"风与草者，谷中最静之一场更革：于封禁之坡重撒草籽，听风携之，往每一道裸露之土。蓝砚曰：「人治不得山，山须自治。吾辈只以种子还与风，余者付之岁月。」数年之后，最先绿起之一坡，成为谷中人常往之处。无碑，无名，只一片绿。有外客问此坡何名。谷人曰：「无名。」客曰：「既无名，何以常来。」谷人指其草曰：「它也不问我来做甚么。」此坡在灵濛山南，坡上草种有三，皆谷中旧种，非外求也。"
 CYG_Teach_the_Children:"老树底下第一课"
 CYG_Teach_the_Children_desc:"教谷中子民，蓝砚所最重者。所办第一学堂，无书，无匾，设于老树之下。所教亦简：认草、认土、认天气、认方向。有人问曰：「何不教之读书识礼。」蓝砚曰：「待其先认得脚下这一片土，再谈认字。」连脚下之土亦不识者，读书亦是替他人读。问者曰：「然则几时教字。」曰：「等彼等问起字来。」问者曰：「若终不问呢。」曰：「那便不必教。」课在翘英庄晒场，天晴则移于树下，雨则入祠，无定所。"
 CYG_The_Herb_Doctors:"药婆遗言编成歌"
 CYG_The_Herb_Doctors_desc:"草医授徒，蓝砚借此存谷中最后数位老药婆之艺。诸婆多不识字，惟能言、能认、能治。蓝砚令人逐句录其言，编为歌诀，授之童稚。一婆临终，握蓝砚之手曰：「吾一生所治之人，多于识吾字者。汝为我补上这些字，吾便放心。」言毕而逝。蓝砚执其手，久不放，手渐冷。歌诀成，凡三百二十句，童子行路时唱之，声在谷中，应于四山。歌诀所采之草，多出灵濛山阴，谷人采之，各还其处。"
 CYG_The_Singing_Paths:"一路有歌人不散"
 CYG_The_Singing_Paths_desc:"歌径者，谷中最不似政令之物。蓝砚令每一村社，将自家故事编为歌，行山路时唱之，插秧时唱之，守夜时亦唱之。曰：「一地之歌，即其记忆。」唱之愈久，人愈不肯去。再苦之地，有歌则有人愿留。初时惟童子唱，老者嫌其不成调。居半载，老者亦随声而和，调仍不齐，而声渐厚。夜行山径者，闻隔坡有歌，辄应之，一唱一和，不知其人为谁。歌起于琼玑野田头，沿山路而传，夜行者闻之，不迷所往。"
 CYG_The_Silent_Valley:"不看人颜色"
 CYG_The_Silent_Valley_desc:"谷中无号令者，蓝砚心中之象：无人发令，亦无人须从。事则摊于众前，愿者为之，不能者不为。有人曰：「此种地方撑不久。」蓝砚曰：「或撑不久。然吾欲使活着之人，先过数年不必看人脸色之日月。虽短，亦算真活过。」其人曰：「短则何益。」曰：「饿三日之饱，也是饱。」其人不能驳，笑而去。蓝砚独坐树下，拾叶一片，置于膝上，久而不弃。此谷僻处沉玉谷南，外路不通车，入者惟步行，三十里方至。"
 CYG_The_Open_Granary:"开仓先纳外来人"
 CYG_The_Open_Granary_desc:"开仓纳流民，沉玉谷最险之一决。谷中本已缺粮，蓝砚独主以有限之余粮，分与逃入谷中之外人。村社大会争如一锅沸水，声压屋瓦。蓝砚待众声稍歇，只曰：「今日来者，皆逃者也；明日逃者，或即吾辈。尔等愿他日立于别处谷口时，所闻者为谷中无粮，抑或进来罢。」满座寂然。少顷，一老妇先起，曰：「我家尚有一斗。」于是应者渐众。"
 CYG_The_Green_Pact:"众手按土立青约"
 CYG_The_Green_Pact_desc:"青约之立，无坛，无牲，无祝辞。谷中男女老幼环立坡前，各以手掌按土，掌印相属，如一行字。蓝砚立于末，最后按之，曰：「此谷非一人之谷，亦非吾辈之谷，特众人愿以命守之土耳。」有人问：「既不树旗，不立国，何以号令。」曰：「号令在土，不在旗。」是日无一人先散。盟约之纸藏于翘英庄社祠，封以蜡，启之须七社之印齐。"
 CYG_The_Valley_Endures:"木牌下撒沙立誓"
 CYG_The_Valley_Endures_desc:"谷口旧有一木牌，上书山约二字，为蓝砚少时所见。是日她立牌下，语众人曰：「吾辈所争，非一仗之胜负。所争者，此水土在吾辈去后，犹能养后人否。」言毕，俯身捧沙一掬，撒于牌足。众皆不语。有老农亦俯身捧沙，继之者十余人，沙积至牌腰。蓝砚曰：「此即谷寿。」所捧之沙，取于琼玑野旧河床，其下即三十年前之田。"
 CYG_Carry_the_Seed_Out:"携谷种遍走荒田"
 CYG_Carry_the_Seed_Out_desc:"出山之议既定，蓝砚先遣十余人，各负布袋一，袋中皆谷种。所至之处，不问官署，先寻荒田与枯井。至一村，村人曰：「此土已死。」使者取种撒之，曰：「死未死，待春雨。又言谷中旧事，言某年大水，某年绝收，某年复生。」听者初笑，既而默。月余，有村人自来谷中求种。所携之种，产自沉玉谷梯田，以布囊盛之，囊上无字。"
 CYG_The_Song_of_the_River:"沿江说谷中旧事"
 CYG_The_Song_of_the_River_desc:"蓝砚命人沿江而下，每至一埠，辄说谷中旧事：说枯泉，说流失之土，说为矿渣填平之溪。听者或问：「说此何益。」答曰：「不益，然须说。」又曰：「吾不望全璃月尽懂吾辈，惟望河水至大港之日，港中人知其所自来。」一老舟人听毕，指江曰：「此水过我门前三十年，今始知其上有山。」歌顺水而下，过遗珑埠，入云来海，港中渔人亦拾其调。"
 CYG_The_Desert_Prophecy:"谶言二十年后事"
 CYG_The_Desert_Prophecy_desc:"蓝砚尝于议事之席言：「照今日开山、修路、挖矿之法，不出二十年，璃月当自海边起，一块一块化为荒地。」座中有人斥曰：「危言耸听。」蓝砚不怒，曰：「吾宁为尔曹所骂之鸦。待尔曹真见遍山皆秃，吾纵已死，亦不负此言。」言毕，取案上一撮土，以指捻之，土尽为粉，落于席上，无人复言。此言后验于碧水原，林尽处黄沙入田，如所预言。"
 CYG_Shelter_the_Runaways:"谷中开门纳亡命"
 CYG_Shelter_the_Runaways_desc:"谷中所纳者，有港府通缉之流民，有逃卒，有无家之孤，亦有自至冬占区逃来者。有长者劝曰：「纳此辈，祸必至。」蓝砚曰：「祸早已至。所异者，在彼寻我，抑我迎彼耳。吾宁迎之。」遂开谷门，不验其籍，不问其罪，惟令先食一饭。是夜谷口火不熄，锅三易，而无一人争食。谷门在琼玑野西口，门为柴扉，夜不落闩，灯彻夜。"
 CYG_The_Poisoned_Wells:"掬浊水示谷中人"
 CYG_The_Poisoned_Wells_desc:"出山未久，谷中人至一村。村中数井水作黄汤，饮者辄倒。蓝砚蹲于井畔，掬水一捧，视之良久，水自指缝尽漏。乃起，语从者曰：「归。告谷中人，此即吾辈出山之故。」从者问：「此水可治否。」曰：「可治。」又问：「井主肯否。」蓝砚不答，取井绳一截，纳于袖中而行。其井在璃沙郊旧道旁，井栏刻有主名，绳新而水黑。"
 CYG_The_Green_Columns:"一叶之旗列成行"
 CYG_The_Green_Columns_desc:"出山之后，队伍始成列。旗上一叶，无字，无徽。市人聚观，有笑者曰：「此旗不威武。」蓝砚曰：「吾辈非来吓人。」特来告之，有如此一群人，肯为一叶而立，立至彼不敢再挖为止。言毕，风至，数十旗同时翻卷，叶影落于道上。笑者不复笑，退立道旁。旗以素葛为之，叶以墨画，凡数十面，自翘英庄一路插至埠头。"
 CYG_Burn_the_Furnaces:"举火焚炉于河岸"
 CYG_Burn_the_Furnaces_desc:"矿炉昼夜不息，烟入于河。谷中人议三日，卒决焚之。是夜举火，炉倒三座，火光映于水面，如晚霞倒流。蓝砚立于岸上，见炉壁裂处有人影奔出，忽忆炉工之中，有数人乃谷中旧邻。火既熄，岸上无人欢呼。良久，蓝砚曰：「此炉所烧者，非煤，乃邻也。」炉址后为沉玉谷人辟为秧田，春水入炉基，芦生其畔。"
 CYG_The_School_of_the_Field:"移课堂于田垄间"
 CYG_The_School_of_the_Field_desc:"学堂不设于屋，设于田。每出一山，蓝砚令诸童各于荒地上种一茬，不问成否。有童子问：「书不读乎。」曰：「书中所载，不如自刨一锹土。」又曰：「待尔手心真长出一粒粮，方知吾辈所争何事。」秋至，诸童田中惟三畦有收，蓝砚令尽收之，煮为一锅，众人分食，不许多取。其田在翘英庄溪南，凡三亩，秋后田埂即课童之所。"
 CYG_The_Spreading_Root:"如野草蔓过村界"
 CYG_The_Spreading_Root_desc:"蔓根者，非军，无阵地，亦无册。然自一村至一村，如野草过墙。港府欲捕其首，捕之不得，盖其首即各村之农。蓝砚曰：「吾辈从未欲攻一城。惟欲使每一耕者，皆能问一句：「此田本属何人。」」有吏闻之，谓同僚曰：「此辈无处可剿。」同僚问故。曰：「剿一村，则十村皆蔓。」其蔓自琼玑野起，逾年而至碧水原，官书谓之蔓草。"
 CYG_The_Marsh_Law:"立泽法三条"
 CYG_The_Marsh_Law_desc:"泽法三条：凡有水处，不得截流，不得排污，不得私占。文甚短，无注解。有人曰：「此管太宽。」蓝砚曰：「吾一生诸事可让，惟水一寸不让。」水让出去，命亦让出去。有港中吏持旧律来争，谓水有主。蓝砚引之至渠口，指水曰：「此水流过三家田，君试指其一主。」吏视水良久，不能指。此地渚在沉玉谷下流，芦深没人，秋则雁满其上。"
 CYG_The_Grey_Water:"开闸放浊水倒流"
 CYG_The_Grey_Water_desc:"事急，谷中人开一坝之闸，令下游矿水倒灌。此策至秽，队中素最坚者亦迟疑。蓝砚亲署其令，署毕，独坐河干至天明。有从者问：「此令可悔否。」曰：「可悔，然闸已开。」又问：「既知其非，何为署之。」蓝砚曰：「有些地界，道理说不通，则只余此一条路。此路亦不干净。」言毕，以河水濯手，濯之再三。所开之闸在璃沙郊，闸石旧而绳新，水出之声，三日不止。"
 CYG_The_Grand_March_of_Peasants:"田夫荷锄向港口"
 CYG_The_Grand_March_of_Peasants_desc:"行者不计其数，农、药婆、猎户、流民，沿田埂与江堤而行，手举绿叶与锄。行甚缓，而列甚齐。无鼓，无号，惟足声如潮。蓝砚行于队中，不语。有少年问：「此行至港，欲为何事。」曰：「不为何事，行至则止。」少年又问：「既至而止，何以为功。」蓝砚曰：「功在行，不在至。」其行自沉玉谷出发，道经翘英庄，庄人以瓜果置道旁，不受。"
 CYG_The_Last_Green_Hill:"守住最后一座山"
 CYG_The_Last_Green_Hill_desc:"蓝砚尝名此路曰最后之青山。是日立一坡上，坡新绿，草才及踝。她望之良久，曰：「吾不求天下皆青山。惟求守不住诸处之时，犹能守此一座。此座若在，则此事犹有可望。」随行者问：「若此座亦失，如何。」蓝砚不答，俯身拔一草，连根而起，视其根土，复种之。此山在灵濛山与琼玑野之间，孤峙，登顶可望两谷。"
 CYG_The_Valley_And_The_World:"谷与天下原一事"
 CYG_The_Valley_And_The_World_desc:"蓝砚晚年始明此理：守一谷，即守天下之一隅；守天下之一隅，亦即守此谷之将来。尝语人曰：「吾少时只想守谷，今乃知谷与天下本是一事。」山上水流至山下之田，山下之烟复归山上之云，孰为尔，孰为我，算不清。言至此，以杖指远处一渠，曰：「那一渠水，今岁灌三家，明岁或灌十家。」所指之渠在沉玉谷北口，渠首石上刻四字：源同流均。"
 CYG_The_Singer_of_the_Valley:"唱无名者于谷口"
 CYG_The_Singer_of_the_Valley_desc:"谷中有说书人，自幼长于谷，能编旧事为曲。每集日，坐谷口唱与人听。所唱者皆无名之人：守泉四十年之老叟，雪天分饼之童子。蓝砚常往听，听毕即行，不发一语。或问：「何不赞之。」曰：「彼所唱者吾辈。吾若开口，是自鼓掌耳。」后其人病，蓝砚遣医往视，医归言：「彼床前尚改一词。」所改之词后传至遗珑埠，茶肆中人易其末句，唱之如旧。"
 CYG_Old_Mine_People:"咳血填坑还旧债"
 CYG_Old_Mine_People_desc:"旧矿之人，谷中最不欲人提者。昔年亲手挖空此山，今石尘入肺，咳血，背偻，犹日上山，以锹填当年所凿之坑。一老人谓蓝砚曰：「吾不求人恕。惟愿死前，还此地本来之貌。」蓝砚不言恕，只曰：「那就同填。」次日，她亦持一锹至坑边。老人见之，退半步，让出一处土。旧矿在层岩巨渊北缘，坑填毕者植松，未填者插标。"
 CYG_Warm_Tea_for_the_Weak:"入谷先奉茶一瓯"
 CYG_Warm_Tea_for_the_Weak_desc:"谷中有一条不成文之规：凡弱者入谷，病者、伤者、无路可走者，先递热茶一碗，饮毕再言他事。此规无碑，无令，然无一家不守。蓝砚曰：「此规乃谷中众人以自家最难之日，一日一日熬出。」有客问：「茶尽而事未决，奈何。」曰：「茶尚可再煎，人只一条命。」茶以翘英庄粗叶煎之，煎于各家之灶，费不入账。"
 CYG_The_Path_Up_Aozang:"修通奥藏旧山路"
 CYG_The_Path_Up_Aozang_desc:"奥藏旧道，废已久，石级多塌。蓝砚率人一寸一寸修之，非为运货。或问：「既不运货，修之何用。」曰：「春时山上有花，开只七日。」谷中人当有一处可上，看一眼，知此日月犹可过。路成之日，先上者非壮丁，乃数老妇，各携一囊，至顶坐食，食毕不言，惟相视而笑。路起于奥藏山麓旧樵道，凡四千级，无栏，旁有歇石。"
 CYG_The_Whole_Valley_Rises:"举谷丁壮尽出山"
 CYG_The_Whole_Valley_Rises_desc:"举谷之日，老守门户，稚从妇人，丁壮尽执农具与猎弓。无鼓，无令旗，惟呼声自一谷传一谷。蓝砚立于队前，回望谷口一老树。少时其父尝指此树教之认草。她视树片刻，转身，迈第一步。其后无人回顾。行三里，有童子自后奔至，塞一饼于其手，复奔去。饼为轻策庄粗麦所制，尚温，其家惟此一枚。"
 CYG_Refuse_Liyue_Harbor:"折还招抚一纸书"
 CYG_Refuse_Liyue_Harbor_desc:"港府遣使，持招抚文书至，上书官位、钱粮、名分，条件甚厚。蓝砚当使者之面，取文书折好，还之，曰：「君所与者，吾一样不受。吾所求只一事：自今而后，勿复措意于沉玉谷之水与土。」使者色变，曰：「如此，则无话可说。」蓝砚曰：「本来无话。」言毕，命人进茶，茶至，使者不饮而去。"
 CYG_Reunify_Liyue:"绿旗立于港头墙"
 CYG_Reunify_Liyue_desc:"谷连天下之日，绿旗立于港头最高之墙。蓝砚为众人抬至，足已不能行。她倚墙而坐，望城下，见屋舍残破，田亩荒芜，殊无喜色。良久，曰：「此城比吾所想者大，亦比吾所想者荒。」从者皆静。又良久，她补一句：「那就自头再种。」语毕，命人取水一盂，先濯其手。所濯之水取自沉玉谷，谷人云：离土之水，濯手以志其源。"

 CYG_civilwar_category:"水土之秤"
 CYG_civilwar_category_desc:"港商一系，内战诸决尽归此秤。两轴并持，量营商与安民之平衡，每决一事，级随轴改。蓝砚所重者，货源不断，人心不散：账面上要过得去，街市上也要过得下去。买卖还做得，日子便有盼头；账目一顺，旁事都好商量。"
 CYG_decision_sow_green:"撒青于荒"
 CYG_decision_sow_green_desc:"撒青乃最亏本之买卖：种子撒下，头三年不见收成，或旱死，或虫食殆尽。然谷中人人皆晓，不种，此地永黄。蓝砚曰：「吾辈一世，或吃不上自种之粮；然种下去，吾辈之子便吃得上了。」种子撒于沉玉谷坡上，土薄，下有石，锄下须避石。"
 CYG_decision_clear_spring:"淘泉开淤"
 CYG_decision_clear_spring_desc:"淘泉，体力活，亦良心活：淤塞之泉眼，须一寸一寸掏开；烂掉之旧渠，须重砌。做此活者，手上尽是伤口。蓝砚曰：「水有命。汝善待之，它才肯回来。」此理比诸般律条皆灵。泉在灵濛山下，出石缝，水细而清，取水须蹲。"
 CYG_decision_ban_the_axe:"禁斧巡山"
 CYG_decision_ban_the_axe_desc:"巡山者认得每一棵老树，亦认得每一个不该砍树之人。捉得，不罚钱，只罚种：砍一棵，种十棵，秋后回来点数。蓝砚曰：「罚钱，其不心疼；罚其亲手种回，方记得。」老树在翘英庄后坡，干粗三人合抱，枝叶覆地半亩。"
 CYG_decision_communal_meal:"一锅共食"
 CYG_decision_communal_meal_desc:"共炊一大锅饭，乃谷中最实在之物：柴各家所凑，米各家所出，煮熟则众人列队而盛，不论出力多寡，皆有一碗。或谓此不公，蓝砚答曰：「世间何曾有公。使明日犹能立于此地之人皆得一饭，此即吾辈所谓公。」大锅架于翘英庄社仓前，生铁铸，口径三尺，柴各家所凑。"
 CYG_decision_shelter_weak:"先递热茶"
 CYG_decision_shelter_weak_desc:"谷中有一条不成文之规：先递一碗热茶，再谈别事。此规所活者，不止流民，亦有沉玉谷自身。盖每一个被救过一次之人，后来多成最不肯离此谷之人。后有新至者问：「何以先茶后事。」老妇曰：「茶热，人便肯说真话。」"
 CYG_decision_herb_lesson:"方出于谷"
 CYG_decision_herb_lesson_desc:"以祖传草方教外人，在谷中老人听来，是败家之举。蓝砚坚持教之，曰：「方藏汝手，救一人；教出去，救一片。汝一世之本事，难道只值一条命。」老人无言，末乃自取一册，抄之。抄毕以册授孙，曰：「此册不是汝家之物了。」草方抄于粗纸，纸角以布包，藏于遗珑埠木匣。"
 CYG_decision_patrol_paths:"牧童看路"
 CYG_decision_patrol_paths_desc:"巡径者非兵，乃本须行此路之牧童、采药人。不领军饷，不入名册，惟于路过时多看两眼。蓝砚曰：「此路，吾辈比旁人皆熟。熟至哪一日路心落一块石，哪一夜雨水冲出一道沟，吾辈先觉，不必待人报。」巡径之路自遗珑埠起，分三线，一线沿溪，一线沿脊。"
 CYG_decision_dig_well:"凿十求一"
 CYG_decision_dig_well_desc:"凿井所靠者，运气与耐心。有时凿至底而仍干，便须另择一地，从头再来。蓝砚曰：「吾辈一世，或凿十口井，九口皆干。图者不过一口出水。一口出水，一谷之人皆活。井成之日，无人记得凿过几口干井。」井凿于翘英庄村中，井栏以石砌，石上有绳痕，深寸许。"
 CYG_decision_refuse_levy:"拒纳"
 CYG_decision_refuse_levy_desc:"拒纳者，最简单之反抗也：不交，便不给。简单，却担得起后果。有吏来催三回，谷人只答一字：无。蓝砚曰：「拒者，先把自己想清楚。此一份不交，或须以命换之。值不值，汝自掂量。」催粮之吏至遗珑埠，谷人闭门，门上无锁，惟横木一道。"
 CYG_decision_envoy_keqing:"使者赴玉衡"
 CYG_decision_envoy_keqing_desc:"玉衡回信来得极快，通篇只谈「土地如何分」。蓝砚读三遍，忽觉欲笑，曰：「原来真有人，肯把沉玉谷那点水土之账，当作一件正事来谈。」遂取笔，于回信末添一行：「可分。然地不换主。」"
 CYG_decision_envoy_ningguang:"使者赴群玉阁"
 CYG_decision_envoy_ningguang_desc:"群玉阁之复最似一桩买卖：其所问者，全是沉玉谷一岁能产几粮、值几钱。蓝砚令人口答一句：「吾辈量土，不量钱。」使者带此语归时，凝光沉默良久，末乃淡淡言曰：「有意思。」"
 CYG_decision_envoy_ganyu:"使者赴月海亭"
 CYG_decision_envoy_ganyu_desc:"月海亭，是唯一认真读过沉玉谷水土账之处。甘雨且附来粮政纪要一份，其自整理者。蓝砚反复翻阅，末曰：「看来世上，尚有人肯蹲下来看一株草。」语毕，取纪要置于案头，与谷中账册并列。"
 CYG_decision_envoy_shenhe:"使者赴绝云间"
 CYG_decision_envoy_shenhe_desc:"绝云间之复最冷：山有山规，谷有谷法，互不相干。蓝砚看毕却笑曰：「如此最好。吾最怕者，是那种口称要帮我辈之人。帮来帮去，谷便成其物。」使者问：「不相干，则往来绝乎。」蓝砚曰：「不绝。只是各走各路。」"
 CYG_decision_envoy_childe:"使者赴云来海"
 CYG_decision_envoy_childe_desc:"云来海使者一开口，所谈者，港也，航路也，租约也。蓝砚未待其言毕，即命人送之出。事后语左右曰：「彼所要者，岭也，港也，凡可变钱之物，皆要之。吾所惧者惟一事：彼有一日，欲及谷中之水。至那一日，吾一捧土亦不予。」"
 CYG_decision_green_pact_rite:"按土为誓"
 CYG_decision_green_pact_rite_desc:"立青约者，沉玉谷以所有村社、所有流民、所有肯守此一片水土之人，一并书入同一份盟誓。无仪式，无印信，众人只以手按于同一片土。蓝砚曰：「此谷非谁家之物，只是恰好，为吾辈肯以命守之之地。」"

 LYY_Event.7001.t:"蓝砚撒沙告谷民"
 LYY_Event.7001.d:"帝君驾崩之信，顺山风飘入沉玉谷。信至，无人鸣钟，无人聚哭，惟风中多一点说不清之躁。\n谷口几个孩童正玩石子，忽停手，抬头看大人之脸。\n蓝砚蹲在一片枯黄梯田边，手握一把沙，握得极紧，沙自指缝漏下。听毕，不哭不骂，慢慢将沙撒回田里，曰：「城里之神已死，可这山里之土，死得更早。」\n有谷民问：「神既死，今后听谁。」她曰：「听谷里人。」\n乃直腰，望谷口那块书着征收赋税之旧木牌，对围拢来者曰：「自今日起，此谷之事，自今日起，由吾辈自己定。」\n语毕，有人应，有人不应。一老农蹲下捏土，捏碎，扬去，亦无一言。\n木牌在风里晃，钉子已松。蓝砚走过去，伸手一推，牌子歪去半边，字还看得见。她看半晌，未拔，只说：留着，令人看看从前所记何事。\n当夜谷中无灯。至三更，有一户先点，隔半个时辰，第二户点。天明时，谷里灯已全亮，无一人出门。谷口石上有旧年刻痕，刻者为谷中老人，字已模糊。"
 LYY_Event.7001.a:"沉玉谷自立，不受港府节制"
 LYY_Event.7001.b:"虚与委蛇，暂保谷中安宁"
 LYY_Event.7002.t:"复耕第一锹旧锄"
 LYY_Event.7002.d:"复耕第一锹土，出于蓝砚之手。那把锄头极旧，柄上一段深色包浆，乃其父当年握出。\n她先以掌摩柄，摩数下，方举锄。\n土翻开，色比面上深。她翻数锹，俯身捧土，举与众观，曰：「汝等看，底下犹湿，犹有蚯蚓。」这片地，尚未死透。\n众皆近前，有人伸手捻土，捻罢不作声。一少年曰：「此土能种何物。」她曰：「先种豆。」豆贱，活得成。\n围观者中，一老妇忽然蹲下，抓一把土捂在脸上，哭出声来。众人欲劝，蓝砚止之，低声曰：「哭罢。」哭完，再提锄头。\n老妇哭一阵，以袖拭面，真去接锄。锄重，其举之不起。蓝砚自后扶其臂，二人合力，翻出新土一垄。垄不直，弯如弓，众人视之皆笑。\n日暮收锄，她把锄头扛在肩上，柄上包浆为汗所浸，颜色更深。有人于田头唤其吃饭，她应一声，又回头看一眼那一垄。翘英庄外之田在坡上，土薄，下有石，行锹须斜入。"
 LYY_Event.7002.a:"亲自下田，问土于野"
 LYY_Event.7002.b:"先定赋税，后议农事"
 LYY_Event.7003.t:"老树之下无主位"
 LYY_Event.7003.d:"村社大会择于谷中最大那棵老树之下。不设主位，不设印信，亦不设几案。众人围坐成一圈，圈中只一堆火，火上架壶。老树根盘出地面，坐者各占一段。\n蓝砚立着说完，便退到圈外，倚树而立，任众人各议。\n议至日中，声渐杂，有争者，有笑者，有睡着者。议至日昃，有人提出分田之事，众声又起，争半个时辰。\n有人嫌乱，曰：「总该有一人主之。」\n蓝砚曰：「谷里从前有过主事之人，乃那位将山卖掉之谷主。汝等怀其人也，抑怀其地也。」\n满座沉默。火上之壶忽沸，白气直上。有人伸手提壶，被烫，缩手，众皆笑。笑声里，点头者渐多，次第而已。\n散会时无人宣告所议，各人以所议默记于心。火已熄，余烬犹红。一童子取树枝去拨，火星飞起，落在老树皮上，一明即灭。\n蓝砚最后一个走，提壶倾去剩水。翌日清早，树下扫得干干净净，余灰堆在一处，上压一石。老树在翘英庄社仓前，干粗三人合抱，枝叶覆地半亩。"
 LYY_Event.7003.a:"设村社大会，众议决之"
 LYY_Event.7003.b:"选贤任能，令出一人"
 LYY_Event.7004.t:"禁斧令砍一种十"
 LYY_Event.7004.d:"禁斧令立下之日，蓝砚亲率人上山，于老林深处围住几个尚在偷砍之人。斧犹在树，刃陷木中，白茬新露。那几人见人来，弃斧欲走，走数步，见四下皆是人，便停住。\n那几人跪地求饶，愿罚钱。蓝砚曰：「不罚钱，亦不打。」命人抬树苗一捆来，置于其前，曰：「砍一棵，种十棵。自今日起，汝等便住此山，将苗养活再走。」一人曰：「罚钱不甚快乎。」她曰：「钱罚了，树仍不会长回来。」\n一人哭曰：「我不会种。」蓝砚曰：「我教。汝既敢砍，便当学会如何令其再长。」乃取苗一株，亲掘坑，示以深浅，示以覆土，示以浇水。数人围看，看毕，各取苗去。\n日暮收工，她数坑，少两个，回头见那哭者尚在掘，手已破。那哭者姓甚，无人记得，只记得他后来种那片苗最齐。三年后蓝砚过山，见其在林下削枝，手上旧疤犹在。二人相对，皆未提当年之事。老林在灵濛山阴，树皆百年，砍者留桩，桩面白如骨。"
 LYY_Event.7004.a:"立禁斧令，违者重罚"
 LYY_Event.7004.b:"缓行禁伐，先安民生"
 LYY_Event.7005.t:"砌石护泉以草覆土"
 LYY_Event.7005.d:"护泉之日，蓝砚以石砌渠，以草覆土，将谷中仅剩几眼活泉一一圈护。石不用凿，取溪中圆石，垒而不灰，缝里塞以湿泥。\n一富户欲将泉旁改作牧场，不服，嚷欲告至港府。\n蓝砚指那眼泉曰：「汝去告。惟我先告汝一句：「此泉，汝家祖上亦靠它才活。」汝要告倒我，须先告倒自家祖宗。」\n富户曰：「一眼泉能养几亩田。」她曰：「所养非田，乃数户人。」\n富户张口，久不能言，袖手而去。\n是夜有人见其在泉边立，以手掬水，饮一口，又饮一口，然后将带来之界桩拔去，扛在肩上走。\n泉水照月，圈石之内，水面平如镜。一枚落叶打旋，久不下沉。\n次日渠边多一块平石，石上有刀痕，所划乃那富户家之姓。石上彼姓，后为雨水磨浅，只剩一道横。村社议事时有人提议铲平，蓝砚曰：「不必。」存之，令人知己亦曾改口。\n那块石后砌入渠沿，人来打水，脚即踏之。有人问踩着一个姓好不好。蓝砚曰：「踏之善。」踏久，便不记其为谁。泉在灵濛山脚，出石缝，水细而清，谷人取水须蹲。"
 LYY_Event.7005.a:"砌渠护泉，寸土不让"
 LYY_Event.7005.b:"让泉于人，别择水源"
 LYY_Event.7006.t:"文书投火一条不落"
 LYY_Event.7006.d:"拒港府之命，乃蓝砚第一次当众明言。文书送到，她不急于拆，先召谷民齐集，方启封，逐条念之，一条不落，连附注小字亦念。\n念至所谓惠民之条，众人面面相觑。念毕，问曰：「这些福，汝等谁看见了。无人应声。」风过火堆，灰起。有人问：「文书既焚，日后港府来问，如何答。」她曰：「答以不知。」\n乃将文书投入火盆，看其卷曲、变黑、成灰。火光照面，众皆不言。既而曰：「自今日起，沉玉谷之账，吾辈自己记。记错，亦吾辈自己认。」总胜于使他人代记一笔永远算不清之糊涂账。\n火盆中最后一点纸角塌下，有孩子伸手去拨灰，为其母拉住。孩子在灰里拨出一角未烧尽之纸，上有半个红印。其母夺过，掷回火中。蓝砚看见，未言，只将火盆往中间挪了挪，令风吹得匀些。灰烬冷后，她用木片刮拢，倒在树根之下。火盆为陶制，径二尺，盆底有裂纹，以铁丝箍之。"
 LYY_Event.7006.a:"拒港府之命，烧其文书"
 LYY_Event.7006.b:"受命暂安，徐图后计"
 LYY_Event.7007.t:"复耕二年苗及膝"
 LYY_Event.7007.d:"复耕第二年，先复之梯田中，苗长及膝。风过，绿得晃眼，叶背翻白，一层一层，如浪推至山脚。\n蓝砚立于田埂，见一童子于田中打滚，滚得满身泥，笑至直不起腰。蓝砚忽觉眼眶发热，急别过头去。\n旁人问曰：「今年可收几成。」蓝砚曰：「三成。」三成亦足。\n又曰：「勿笑吾。吾但忆父母在日，此田便是这般光景。」二人临终犹念此事，念至一世，未及一见。\n语至此，声断。旁人不劝，惟以手中一束野花递之。蓝砚接，不插鬓，置于田埂，以土块压住，曰：「彼等看得见。」\n那束野花搁至半日便蔫。蓝砚不收，任其搁着，曰：「蔫亦花。」\n童子又滚一回，滚至埂边，仰首问曰：「此田属谁。」蓝砚曰：「属汝。」童子思之，曰：「吾长大亦种。」蓝砚闻之，蹲而为之刮鞋上之泥。\n刮毕，童子跑去。蓝砚仍蹲，取刮下之泥于掌中揉，揉成一块，置于田埂。梯田在翘英庄后坡，凡十一层，层以石垒，石缝生草。"
 LYY_Event.7007.a:"广垦梯田，复其旧耕"
 LYY_Event.7007.b:"弃田迁徙，别寻生地"
 LYY_Event.7008.t:"共仓请余粮户自报"
 LYY_Event.7008.d:"共仓首事，乃将谷中最后数户尚有余粮者，一一请到仓前。仓门大开，内里半空，梁上悬一杆秤，秤钩生锈。\n蓝砚不强迫，只让每户自报、自交。有人交三斗，有人交一斗，有人一粒不交。她皆记之于册，不追问，不斥责，亦不记恨。\n一妇低声曰：「交了，万一彼等不交，吾辈非白交。」她曰：「白交也。」可冬天仍须过。\n既毕，语众曰：「我不逼汝等。我只教汝等看一件事，交粮者，冬天如何共熬。」\n信之一事，须先有人肯交，方长得出来。\n是年冬大雪，仓中粮按日而发，发到末月，尚余两石。不交者亦得食，无人拒之。\n开春后，那几户不交者，各推车至仓前。车上粮袋压得极实，袋口未系，怕人称时说不清。\n那几户推车来时，蓝砚未出门迎，只命人把仓门开着。称粮之秤仍那杆生锈者。称到最后一袋，秤钩断了，众皆笑，说这秤也算熬出头。仓在翘英庄东，屋梁为旧茶木，历年久而气尚香。"
 LYY_Event.7008.a:"立共仓，人人自报其粮"
 LYY_Event.7008.b:"各户自守，不相通济"
 LYY_Event.7009.t:"山径守望皆识脚印"
 LYY_Event.7009.d:"山径之守，非筑垒，非置戍，乃将谷中每一条可行之路，皆记于心中。守望者非兵非卒，牧童也，采药者也，砍柴之妇也。\n一采药少年于隘口遇生人一队，弃药篓，自小径奔回谷中报信。鞋失其一，足底划破，至时语不成句。谷中由是得从容布置。生人至谷口，见路已断，遂退。\n有长者问：「守望既散在各处，如何传信。」她曰：「靠脚，不靠鼓。」\n事后众人夸其机灵。少年曰：「非我机灵。是我日日记走那条路，多出几个脚印，我都认得。」\n众人闻之，一时无语。有老猎人抚其首曰：「此语比报信值钱。此后谷中议守望之法，不复先论人多寡，先论路熟与不熟。」\n少年后携三人，一条一条路走，走到冬尽。所教人认足迹，第一句曰：「脚重者挑担，脚轻者空手，脚偏者心里有事。」\n听者皆笑，他不笑，只脱一鞋，指鞋底曰：「此纹路，乃谷中之土所印。」谷中后以此语课新丁，谓之第一课。灵濛山径多碎石，雨后留印，印深者负物，浅者空行。"
 LYY_Event.7009.a:"设山径守望，人自为眼"
 LYY_Event.7009.b:"另募哨探，专司其事"
 LYY_Event.7010.t:"满山草即是药方"
 LYY_Event.7010.d:"谷中无名医，只有老人传下几张方子，与满山之草。方子不书于纸，多在口中，人死则方亡。\n蓝砚将识草之几位老人请到一处，请其口述方子，一一笔录。写至第三张，一老人不肯再说，曰：「这些方子传出去，便不值钱。」\n一妇问曰：「方子记下，若被人拿去卖钱。」蓝砚曰：「卖得出去，说明有人要；有人要，说明救得人。」\n又曰：「方子不值钱。」值钱者，乃明年那发烧之子，犹认不认得草。\n老人怔许久，手指在膝上画圈，画十几个，终乃开口。一开口便说得极快，怕自己反悔。\n所录成册，不署名，亦不署下家。册置谷中公所，任人翻阅。有外村人来抄，蓝砚亦不禁，只嘱一句：「抄去可以，须教会一人。」\n册子后为翻得卷角，有人以布包一层皮。包皮者不识字，只认得那册子放在第几格。\n有一年疫气行于邻谷，来借册者排到门外。蓝砚命人抄七份，一份一份送出。\n疫过，邻谷送两担米来。蓝砚未收，只留一句：「明年若再有疫，勿待吾来问。」药在灵濛山北坡，采者知其处，不告外人，亦不秘于谷。"
 LYY_Event.7010.a:"传草方于谷中"
 LYY_Event.7010.b:"藏方自守，不轻易传"
 LYY_Event.7011.t:"挖断隘口税吏退"
 LYY_Event.7011.d:"抗征，是沉玉谷第一次真正动手。港府税吏带兵堵于谷口，扬言交不出粮便断水封谷。兵不满百，然甲械齐整，立成一列，刀鞘在日下反光。\n蓝砚不出面，只令守望者挖断税吏必经之隘口。一夜之间，土石翻起，旧路断为两截，断处深可陷马。守望者问：「挖到几深。」她曰：「挖到马过不去。」\n税吏至，视之良久，绕行无处，狼狈退回，临行扬言日后算账。谷中一片欢呼，有人敲锅，有人抱头而泣。蓝砚独坐田边，久不言语。暮色下来，蛙声一片。有妇人为她端一碗水，她接之，未饮，曰：「今日这一锄，所挖断者，非止一路。」妇人问：「尚挖断何物。」她曰：「挖断退路。」说完把水饮尽，碗底朝下放在膝上。她坐半夜，田里虫叫极密。后半夜起风，她起身回去，路过断路口，蹲下视之，用手把一块松石按紧。隘口在谷南，两崖夹道，宽不容车，断之则人须绕行。"
 LYY_Event.7011.a:"抗征不纳，断其道路"
 LYY_Event.7011.b:"屈从一时，别作后图"
 LYY_Event.7012.t:"谷中三口大锅同炊"
 LYY_Event.7012.d:"共炊之日，谷中架大锅三口。石垒为灶，柴各家所凑，米各家所出。火起，烟直上，锅沿浮一层白沫。\n分饭时众人执碗列队，有先有后，无一人争先。\n一人端碗视之，嫌其饭似乞丐讨来，搁下不食。\n或问曰：「米不足，如何支三口锅。」蓝砚曰：「锅大些，水多些，饭稀些，人亦足。」\n蓝砚取碗，递回其手，曰：「乞丐是等人给；吾辈自煮自食。汝端此碗，先自想明：既不欠谁，便不必谢谁。」\n其人端碗立许久，众人皆食，惟他立着。良久，蹲下，一口一口吃完。食毕以指抹碗底，抹得极净，以碗授分饭之妇人，曰：「明日吾早来烧火。」\n翌日果早来，火为其所生。\n那一夜锅底刮得干净，刮锅者以锅巴分与童子。蓝砚最后盛，锅中只剩汤。蓝砚舀一碗，坐于石上饮尽，曰此汤比饭香。翘英庄社仓前之锅为生铁铸，口径三尺，柴各家所凑，凑者记于木牌。"
 LYY_Event.7012.a:"共炊一鼎，各分一勺"
 LYY_Event.7012.b:"各家分炊，各安其分"
 LYY_Event.7013.t:"以粮换种尽入仓"
 LYY_Event.7013.d:"谷种之库，乃聚各家所留最后一斗种于一处，筛选、登记、分装。筛下秕谷，另盛一筐，筐上不加盖，任人取去喂鸡。\n一老人死活不肯交种，抱袋坐于仓门，曰：「此乃祖上所传之种，换之则味非。」\n有人曰：「以粮换种，粮从何处来。」她曰：「自我口里省。」\n蓝砚不强求，回身取自己半袋口粮，塞过去，曰：「换。汝之种交我，我之粮归汝。明年开春，种子仍归汝，粮不必还。」只要此谷之中，还有人愿意种田。\n老人捧粮，手一颤，袋上绳结解两次方解开，终把种交出。交时低声曰：「这袋种，我爹埋过一回。」\n蓝砚曰：「那就再埋一回，明年埋在新田里。」\n仓中种袋一列排开，袋上各书村名，字有大小。蓝砚逐袋看过，看到老人那一袋，袋口绳结打得极繁，她伸手解一半，又系回去，仍旧原样。开春分种，先分那一袋。种入翘英庄仓，以布袋盛，袋上以炭书村名与人名。"
 LYY_Event.7013.a:"设谷种之库，统收统发"
 LYY_Event.7013.b:"任各户自留，不加重扰"
 LYY_Event.7014.t:"护田队成军授竹矛"
 LYY_Event.7014.d:"护田队成军之日，谷中第一批拿起武器者站成一排。无铠甲，无旗鼓，手中所握，农具、猎弓与削尖之竹竿。\n蓝砚自队首起，为每人递上第一支竹矛。递至末一人，忽停，退半步，正色曰：「此非教汝等去杀人，乃教汝等立在自家田边，使那些想动手之人，先掂量掂量，这片土，有人在守。」\n少年问：「若真有人来抢呢。」她曰：「那就让他先看见竹矛，再看见人。」\n言毕，众皆握矛不语。有少年握得太紧，指节发白。蓝砚视之，曰：「松些。」握一日便手酸，握一季方算守。\n少年松手，又握，这回稳了。\n当日散队，各归其家，竹矛皆倚于门后，与锄头并立。\n有老妇见之，抚矛尖，说太利，怕伤孩子，便用布缠三圈。缠布之老妇后又来一回，带一小罐油，云欲涂于矛尖，以防锈。\n蓝砚受之，命人将油分给各家，一家一勺。遗珑埠谷口所授之矛为毛竹削成，长丈二，尖以火烤硬，不施铁。"
 LYY_Event.7014.a:"编护田队，守我田垄"
 LYY_Event.7014.b:"不设武装，以免招祸"
 LYY_Event.7015.t:"山约通篇无一令字"
 LYY_Event.7015.d:"山约写成那天，蓝砚通篇未书一个令字。纸上所言，皆吾辈既不纳不属谷中之赋税，也不受不为谷中认同之号令。\n有人问此算甚么章程。她曰：「此只一句话：此谷自今往后，自己认自己。」\n有人曰：「不书令，日后谁听。」她曰：「先听而后写，不叫约，叫令。」\n乃取纸，第一个以手按之。墨迹在掌下晕开，成一团青。众人依次按之，有按得重者，有只以指尖一点。按毕，纸上一片手印，大小不一，最小一个乃孩童。\n纸晾于老树之下，风过，一角掀起，又落下。\n有人问：「此约付谁收。」她曰：「不付谁。」贴在谷口，任它吹雨。\n纸在树上贴七日，为雨打湿两回，字迹渐淡。有人问可要重写。她曰：「不必。」看得清者，早已看过；看不清者，重写亦无用。\n第八日她自己去看一回，见纸上多一个小手印，按在角落，是新按者。沉玉谷山约用粗纸，写者用炭，炭迹易淡，故藏于木匣。"
 LYY_Event.7015.a:"立山约，谷自认谷"
 LYY_Event.7015.b:"不立约法，一切从简"
 LYY_Event.7016.t:"不要神亦不要王"
 LYY_Event.7016.d:"无主无君，蓝砚一言尽之曰：「吾辈不要神，亦不要王。」\n或问曰：「然则汝辈所信者何。」蓝砚曰：「信土，信水，信明年犹肯留于此地之人。」又曰：「神有时而远去，王有时而移驾。惟此一片地，此数家邻，不去。除非吾辈先弃之。」\n问者无言。其语后刻于谷口木牌，刻甚浅，雨一冲便淡。或请重刻深些。蓝砚曰：「不必刻深。记得者，浅刻亦记得。」其牌后换三回，每回所刻，皆同此数语。\n谷中后议水渠改道，议三日，争两日，第三日议成。散时天已暮，或提灯，或摸黑而行，无一人出怨语。蓝砚立于门口，视众人散尽，未出一言。\n自是立一规：议事不设座次，先至者先坐。或问其故。蓝砚曰：「坐高者，出语便缓。语缓之会，终无了期。」沉玉谷老树之下为集会之处，座以石为凳，凳面磨得发亮。"
 LYY_Event.7016.a:"无主无君，自守其土"
 LYY_Event.7016.b:"另立首领，以图长久"
 LYY_Event.7017.t:"十余村各自为政"
 LYY_Event.7017.d:"自由村社之议，乃十数村各自为政，遇大事方聚于一处相商。议定之日，各村长者列坐，坐次不分大小，只按到谷先后。\n或忧其如散沙，不能御外。\n蓝砚曰：「外人打进来时，汝所要者，能战之兵乎，不肯让出之土乎。」\n一长者曰：「既各自为政，赋税如何。」蓝砚曰：「各留其有，遇大事各出其力。」\n问者迟疑。蓝砚顿一晌，曰：「吾择后者。」一支队伍会散，一片土地不会，只要种它之人犹在。\n座中一长者拍膝曰：「此语可破。然则有一事，村社既散，谁来过问争端。」蓝砚曰：「争端由邻人问。」邻人问不了，再由众村问。长者曰：「然则要等到何时。」蓝砚曰：「等到地里之麦熟一回。」\n散会时天已暮，十几个长者各往各路走。火把一星一星散开，散到山口便看不见。\n蓝砚立于树下数之，数至十四，尚差两个，便等。等到火把回来，方转身。十数村散于沉玉谷中，远者相距二十里，报事者一日不能遍。"
 LYY_Event.7017.a:"结自由村社，各治其事"
 LYY_Event.7017.b:"统合诸村，立一共主"
 LYY_Event.7018.t:"公田按户分种按劳"
 LYY_Event.7018.d:"公田者，收谷主当年所强占之地，归村社共有，按户分种，按劳分粮。\n有人趁机多占，为人当面揭发。蓝砚不偏袒，惟令村社大会当众议定：多占者退地归主，并替被占之家耕作一季。\n蓝砚曰：「公田者，亦使有私心之人先学一事，曰遮掩不住。」\n那多占者后退地，亦果替人耕一季。耕完之日，坐于地头良久。或问其故。其人曰：「这一季之米，非吾家之米。」\n次年其人未再占。第三年村社选其为记田之人。\n记田者行事极细，一年下来，田册上未错一亩。或笑其改之太速。其人曰：「吾占过一次，知占者所据何状。」\n此语说得不高，闻者亦不多。田册后抄两份，一份存村社，一份挂于祠里。挂那一份，任人翻看。翻得最多一页，乃最初分田那一页。页角为人摸得起了毛。公田在翘英庄前平处，土厚色黑，谷人谓之老土。"
 LYY_Event.7018.a:"收田为公，按劳分配"
 LYY_Event.7018.b:"仍存私田，不予变更"
 LYY_Event.7019.t:"谷口立木牌罢税"
 LYY_Event.7019.d:"罢税去枷，沉玉谷对外之宣告也：谷中不得以任何名目征敛，谷中之人不得以任何名目拘束。\n此条刻于谷口木牌，往来行人与流民皆看得见。\n或谓此乃自寻麻烦。蓝砚曰：「麻烦本来已寻上门。」与其被人缚而问要不要钱，不如吾先说明白：不给。\n其人曰：「若有人硬要呢。」蓝砚曰：「那便使彼先动手。」先动手者，理便短了。\n木牌立三年，谷中未收过一文税。有流民自外而来，见牌便留。留者首事，乃往田里做半日活。\n有一年县中来人，言依例当纳。谷人将木牌指与之看。其人看半日，曰：「此牌不作数。」谷人曰：「那吾辈只认此牌。」其人归后，再无人来。\n流民中有一家三口，留三年。第三年男主人做一事：将自家门口那段路修平。或问其何故。其人曰：「走过者不摔，吾亦少扶几回。」木牌立于谷口道旁，牌下以石压，石为溪中所取圆石。"
 LYY_Event.7019.a:"罢税去枷，昭告谷外"
 LYY_Event.7019.b:"暂缓废除，徐图后议"
 LYY_Event.7020.t:"轮值巡山不分老幼"
 LYY_Event.7020.d:"轮值巡山，谷中众人之义务，不分男女老幼，只看力气大小。力气大者走夜路，力气小者守火堆。\n老人看守谷口火堆，添柴、续火、听风；孩子瞭望山口，见烟则呼，见鸟群惊起亦呼；青壮巡更走夜路，一夜三班，班交接以击竹为号。\n有人问：「老弱守火，算不算守。」她曰：「火不灭，山就有人。」\n蓝砚曰：「我不指望谁替谁白干一辈子。我只望每一个守过山之人，都记得所守者，自家院墙。」如此，便无人偷懒。\n第一夜轮值，天寒，守火老者打一盹，火将熄。一个孩子自山口下来，默默添一把柴，火又起。\n老者醒，见火旺，问谁所添。孩子曰：「我。」老者曰：「多谢。」孩子曰：「明日吾家守，你也替我看着些。」\n天亮交班，老者在竹片上刻一道，云以记一夜。竹片上已有许多道，密得数不清。他将竹片挂于门边，孩子路过，伸手摸一摸，又缩回去。灵濛山巡路分三线，一线沿溪，一线沿脊，一线绕田。"
 LYY_Event.7020.a:"轮值巡山，人人有责"
 LYY_Event.7020.b:"雇人专职，以免民扰"
 LYY_Event.7021.t:"沉玉谷诸村初会"
 LYY_Event.7021.d:"沉玉谷诸村之会，自开谷以来未有。是日山径上人牵牛负粟而来。先至者立于坡下，不与后来者语。盖诸村世仇，或争一泉，或争一垄，父死子继，已数十年。\n蓝砚不叙旧怨，惟令各村各言其难。一村曰：「井水日浅。」一村曰：「山土日薄。又一村曰：矿上之人来了，占我等之路。」言者数人，听者渐近。言未毕，已有人点头，有人以袖拭面。\n日暮将散，一老者自人后出，径至旧仇之前，伸手曰：「昔者吾子死于争水。今日方知，杀吾子者非君也。」其人怔立良久，亦伸手握之。众皆默然，而后有笑者，有泣者。蓝砚立于坡上，望之曰：「这就对了。」散时天已昏，各以火把照路，火光相接，山路如一条赤带。有村童相携而歌，歌不成调，众皆听之，无人喝止。会于谷中平地，地铺草席，席上置粟与盐，各取一撮。"
 LYY_Event.7021.a:"聚诸峰之会，共商其事"
 LYY_Event.7021.b:"各守其谷，不相往来"
 LYY_Event.7022.t:"风携草籽过荒坡"
 LYY_Event.7022.d:"蓝砚令谷中人取草籽数斗，撒于坡上裸土。众问其法，曰：「无他，撒之而已。风自会替吾辈种。」\n有老农曰：「此太缓。」草长成须三年，人饿死只三日。蓝砚曰：「人治不得山。」山病久了，须山自医。吾辈所还者，种子也；剩下之事，交与风，交与年月。老农默然，退而取种。\n初撒之时，坡上仍黄。一春无雨，人皆以为妄。至第二年，石缝中先出细绿，零零星星，如疮口结痂。又一年，风过坡上，草伏而复起，有声如息。\n数年后，最先绿那道坡，成了谷中人常去之处。无碑，无名，惟一片绿。有小儿问其父：此地何名。父曰：「无名。」小儿曰：「无名亦可来乎。」父曰：「正以无名，故人人可来。」坡下有一碑，不知何年所立，字已磨尽。好事者欲重刻，蓝砚止之，曰：「留白便好。」字多，反倒记不住坡是从哪一年开始绿。坡在灵濛山北，土裸石露，草籽撒下，须待雨。"
 LYY_Event.7022.a:"撒籽于坡，任风携之"
 LYY_Event.7022.b:"聚众造渠，以人力改之"
 LYY_Event.7023.t:"谷口老树开学堂"
 LYY_Event.7023.d:"学堂设于谷口老树之下。是日来者不满十人，最小者尚垂涕，以袖拭之，袖上皆是泥。\n蓝砚不设案，不设书，惟令诸童各于坡上拔草三株，列于石上。一童拔错，以药草为野草。蓝砚不责，曰：「此草叶背有白毛，气味辛，能止血。汝今日认错一株，他日或救错一人。」童惭，取草归土，以手按之再三。\n有村妇问曰：「何不先教识字。」蓝砚曰：「先令其识得脚下之土。不识土而识字者，所读之书，皆为旁人而读。」村妇不语，退立树后。\n日昳课毕。诸童各携一草而归，路上相问草名，问答错杂，声满山径。蓝砚倚树望之，未言。老树影长，覆及半坡。是夜村中有人言：「此学堂不教诗书。其邻曰：今日那些孩子回来，认得出坡上七种草，也叫得出三种不可入口者。」言者遂不复语。翘英庄学堂设于老树下，无屋无案，以石为座，以沙为纸。"
 LYY_Event.7023.a:"办老树学堂，教以农事"
 LYY_Event.7023.b:"缓办学堂，先顾生计"
 LYY_Event.7024.t:"药婆临终授歌诀"
 LYY_Event.7024.d:"谷中老药婆存者不过四五，皆年逾六十，指节粗大，掌上药痕如纹。蓝砚恐其艺随人而尽，乃日携竹简入户，令其口授，己则录之，编为歌诀，使童子习唱。\n一婆病笃，气息断续。蓝砚就榻前执其手。婆曰：「吾一生所治者人也，所识之字不满一箩。坡上那些草，我认得它们，它们不识我。」汝替我补上这些字，我死亦安心。蓝砚曰：「诺。」婆复张目曰：「歌要好唱。」唱不得者，记不住。言讫，手渐冷。蓝砚如其言，以俚语入歌，句短而叶韵。春采何草，夏晒何根，何草加酒，何草忌铁，皆在其中。数年后，谷中人人能背三五段，行路时唱，捣药时亦唱。\n惟无人记得那位婆婆姓甚名谁。歌中有句曰：「白花婆婆教我采。」问白花婆婆为谁，老者但曰：「一个老婆子罢了。」歌至末句，声忽低，如与人耳语。习者不知其故。老者曰：「那一句是她咽气前说者，气不足，故低。」竹简为灵濛山所出，削青竹为片，以绳串之。"
 LYY_Event.7024.a:"授草医于徒，广传其方"
 LYY_Event.7024.b:"严守医术，秘而不宣"
 LYY_Event.7025.t:"各村编歌记旧事"
 LYY_Event.7025.d:"歌径之令下，谷中初不以为然。有村社老者曰：「歌者乐也，非政也。」蓝砚曰：「正因其为乐，才留得住。」\n乃令各村自编其歌：山如何开，泉如何枯，何年饿死过半，何年逃荒出门。不须雅，不须工，但须真。初编之时，人皆赧然，唱至半途而止。有老妇先开口，声沙而缓，唱其夫死于矿洞之事，一唱既毕，满座低头。其后山路之上，插秧之时，守夜之火旁，皆有歌起。此村之歌，彼村亦能接下半句。蓝砚曰：「一地之歌，即一地之记性。」记得久，人便不肯走。\n是年冬，谷中第一次不见举家外逃之村。惟零落数人背囊而去，行至坳口，回头唱半句，风大，后半句为风所散。留者立坡上，亦以半句应之。有客自上江来，闻歌驻马，听毕，问此何曲。村人曰：「无名。」客曰：「无名之曲，反听得久。」遂宿于村，翌日方去。歌以沉玉谷土语唱，调短，一句三顿，童子闻三遍即成诵。"
 LYY_Event.7025.a:"编歌成径，存其记忆"
 LYY_Event.7025.b:"不置歌乐，务求肃静"
 LYY_Event.7026.t:"谷中自此无号令"
 LYY_Event.7026.d:"谷中不设号令，亦不设座次。议事之时，人环坐于地，言者自起，言毕自坐，无唱名，无举手。\n港中来者见之，大骇，曰：「如此散漫，一旦有变，谁为主张。」蓝砚曰：「无主张，则人人自主张。」其人曰：「此必不久。」蓝砚曰：「或亦不久。然吾欲令今之活人，先过数年不看人颜色之日。虽短，亦算真活过一场。」时有一流民自港府治下逃来，衣不蔽体，立于阶下听此语。语毕众散，其人独不去，亦不问食宿。蓝砚使人予之粥，彼捧碗，久不举箸，忽以袖掩面。\n居数月，其人自请去淘渠，不言谢，亦不言留。有人问其故，曰：「此处无人令我，我自个儿想去。」越明年，港府遣吏入谷点视，见其无籍无令，以为散乱，归而报曰：「不足虑。」后三年，谷中户口倍之，吏复来，已不能入。议事在翘英庄社仓前空地，地以石铺，中有一石稍高，为言者所立。"
 LYY_Event.7026.a:"任由众议，谷中无号令"
 LYY_Event.7026.b:"立规矩以治之，勿使太散"
 LYY_Event.7027.t:"议开仓以纳流民"
 LYY_Event.7027.d:"谷中乏食，而逃者日至。蓝砚集诸村于社前，议开仓。语未毕，座中大哗。\n一村老拍案曰：「吾村去岁只收四成，今再分与外人，明春谁分与我。又一人曰：彼等既逃，自有逃处，何苦累及吾辈。」众声嘈杂，几不可止。蓝砚待其稍息，乃曰：「今日来者，逃者也。明日之逃者，安知非吾辈。」诸君试思，他年吾辈扶老携幼，立于别处谷口，愿闻仓中无粮，抑或愿闻一句进来。满座寂然，无一人应。\n良久，一少年自末座起，不语，径去其家，负粟一袋，置于仓前，复来坐。其父欲阻，手举而复落。俄而第二人起，第三人起，仓前粟袋渐积，至夜堆如小阜。无人唱名，亦无人记数。至晓，仓中粟已满。掌仓者欲记第一人之名，众曰：「不必记。」掌仓者乃止，笔搁于册上，墨干而笔粘，揭之有声。社仓在沉玉谷中，屋三间，梁上有旧年谷穗一束，久已干枯。"
 LYY_Event.7027.a:"开仓纳流民，共此艰难"
 LYY_Event.7027.b:"闭谷拒外，免生祸端"
 LYY_Event.7028.t:"众手按地立青约"
 LYY_Event.7028.d:"青约既成，无坛，无牲，无印信，亦无贺者。日未出，谷中之人陆续至坡上，各以掌按地，按毕即起，退立一旁。\n蓝砚立于众前，曰：「此谷非谁之谷，亦非吾辈之谷，不过恰好是吾辈愿以命守之地。」言者平平，听者默然。有少年问曰：「既非谁之，则谁为主。」蓝砚曰：「问得好。无人为主，故人人须在。」有老者曰：「如此大事，当立一碑，以诏后人。」蓝砚摇首曰：「碑会倒，字会磨。」风雨三十年，石上便无字。若真要立，就立在每个种过此田之人心里。\n按掌既毕，众手皆泥。无人去洗，各自负手而归。归途上，一妇对其夫曰：「方才按下去，土尚温。夫曰：我摸着亦然。」二人不复言，惟脚步较来时稳。日之后，凡谷中议事，人皆先按掌于地，然后发言。有外人问其故，村人曰：「按过了，话就轻些。」青约之坡在灵濛山下，土松，掌按则留痕，痕深者力重，浅者力轻。"
 LYY_Event.7028.a:"立青约，与守土者共盟"
 LYY_Event.7028.b:"拒不立约，各行其是"
 LYY_Event.7029.t:"谷口木牌前撒沙"
 LYY_Event.7029.d:"谷口立木牌一，上书四字：「谷寿无疆。」字非名笔，漆亦剥落，风雨再过一冬，当不可辨。\n蓝砚立牌前，手握沙一撮，徐徐撒于牌脚。众环立，无人先语。有风自谷中来，卷沙而去，落于牌后草间。蓝砚乃曰：「吾辈所争者，从来不在一仗之胜负。」城可下，亦可失；旗可竖，亦可倒。所争者，此一片水土，在吾辈去后，尚能养吾辈之子否。若能，则今日尽死于此，亦值。\n言毕转身便行，不复回顾，众皆随之。一少年落后，回望木牌，见沙已掩其半，仅余寿字下半。少年以足拨沙，欲使字复出，拨数下，忽止手，亦转身去。是日谷中如常下田。后来牌朽字尽，人犹于其处插柳一株。柳长成，风过而枝低，如有人俯身撒沙。往来者不知旧事，但见柳好，多在此歇脚。遗珑埠谷口木牌后植柳一株，柳为插枝所生，三年成荫。"
 LYY_Event.7029.a:"谷寿无疆，誓守此土"
 LYY_Event.7029.b:"另择他路，以求保全"
 LYY_Event.7030.t:"携谷种遍走荒田"
 LYY_Event.7030.d:"谷中事稍定，蓝砚始抬眼望谷外。乃择数十人，各负种子一囊，分道而出。凡璃月境内荒田、枯井、废渠，皆令至其处。\n一人归，面有风尘，曰：「某至三村，言土可复，人皆笑。有以杖逐我者，有以为我癫者。」一村之中，只一老妪肯接我种子，接了亦不信，随手掷于墙下。蓝砚听毕，曰：「那就再走几村。」其人曰：「走十村，九村不信。」蓝砚曰：「一村信，便够。」世间事大抵如此。一句真话，说百遍无人听；可只要一遍，落在一个正绝望之人耳中，他便记一世。\n其人遂复出。行前，蓝砚令人予之新囊一，曰：「墙下那包，明年汝去看看。若出苗，便是汝之话生根。」至秋，其人复至墙下，见三五苗出土，高不盈尺。老妪蹲于旁，以手护之，见其来，不言语，只指苗。其人亦不语，蹲于其侧。二人看半日。沉玉谷沿江诸村有荒田、枯井、废渠，田埂多崩，须先修埂。"
 LYY_Event.7030.a:"携种出山，传于四方"
 LYY_Event.7030.b:"守谷不出，潜身自保"
 LYY_Event.7031.t:"沿江而下诉谷事"
 LYY_Event.7031.d:"蓝砚遣人沿江而下，曰：「凡水所至，皆可语。」\n其人每到一处津渡，辄聚市人于岸上，言谷中旧事：某泉何以枯，某土何以走，某溪何以被矿渣填平，填平之后鱼不上，鸭不下，三年而井臭。听者初以为闲谈，渐有问者，问至深夜不散。\n有差吏欲驱之，曰：「此间不许聚众。」其人曰：「我不聚众，我说水土。」差吏无以为对，悻悻而去。蓝砚闻之，曰：「吾不望全璃月皆懂吾辈。」只望有一日，水至大港，港上之人能知此水从何处来。知一物来处，便不那么容易随手弄脏它。\n月余，其人所过之地，有村社自发立木于水口，上刻数字：「此水自上游来。」后有舟子言：「某年载客下江，客问此水何名，舟子答不上来，只记得岸上有木，木上有字，字所讲者，乃此水从何处来。」江自谷中出，经翘英庄，至遗珑埠入海，水路三百里。"
 LYY_Event.7031.a:"以江河为诉，言于天下"
 LYY_Event.7031.b:"默然守谷，不闻外事"
 LYY_Event.7032.t:"谶言荒芜二十年"
 LYY_Event.7032.d:"蓝砚尝集谷中父老于社前，出一图，图上自海而山，画作数块，块上皆涂以灰。众问此何物，曰：「二十年后之璃月。」\n众哗然。蓝砚指图曰：「照今日之法，开山、修路、挖矿，自海边起，一块一块，先秃，再荒，终成石滩。」水先浑，土次走，人最后走。言未毕，有士绅拂衣而起，斥曰：「危言耸听，以惑众心。」蓝砚不辩，俟其去，乃曰：「吾宁为那只被骂之乌鸦。」骂声不绝，则山还在。\n是夜有老妇私问曰：「真会如此。」蓝砚曰：「吾不知。吾只见矿洞一年深过一年，溪水一年浅过一年。若吾看错，是吾之福；若吾看对，今日说与汝等听，也算尽吾心。」\n多年之后，谷口墓前立小石一方，无官衔，无生卒，只刻三字：「说对了。」刻者不留名。人问，曰：「吾亦只是听人说过这一句。」说完便走，不与人辩。谶图以粗纸绘，涂灰处以炭，灰有深浅，浅者近灵濛山。"
 LYY_Event.7032.a:"作荒芜之谶，警醒世人"
 LYY_Event.7032.b:"藏其言，免招是非"
 LYY_Event.7033.t:"谷口纳四方亡命"
 LYY_Event.7033.d:"谷中所收，初犹只乡邻。其后渐杂：有被通缉之流民，有自军中逃出之兵，有父母皆亡之孤儿，亦有自至冬占领之地辗转南来之难民，语带异乡之音，衣不蔽膝。\n村老数人见蓝砚，曰：「此辈聚于谷中，如抱薪近火。」港府一旦问罪，谷中老小皆为鱼肉。\n蓝砚曰：「大祸早已来了。」诸位以为它未来，实则已在门外。所争者，它来寻吾辈乎，吾辈出而迎之乎。我宁愿迎上去。\n村老无言而退。\n是夜谷口添岗二处，非为防外，为防夜中冻死之人无人知。\n是年冬，谷中多一百三十张嘴，日耗粮倍于往岁。然挑土、担石、淘渠、编篱，亦多一百三十双手。\n开春点籍，名册上有百余人注曰：「无去意。」有司尝遣人入谷点视，见灶下皆生面孔，问之，皆曰：「种田人。」吏不能诘，遂去。归途遇雪，反为谷中人赠之以薪。遗珑埠谷口设一棚，棚下置水一缸，来者先饮，饮毕方问其名。"
 LYY_Event.7033.a:"收留亡命，来者不拒"
 LYY_Event.7033.b:"慎纳外人，以防奸细"
 LYY_Event.7034.t:"毒井之前无一语"
 LYY_Event.7034.d:"出谷未久，至一村。村中三井，水皆黄浊，如搅泥汤。汲而上者，置桶于地，泥脚沉底，面上浮薄沫一层。\n蓝砚蹲于井畔，以手捧水，就鼻而嗅，良久不语。水自指缝漏尽，掌上余黄泥一层。她以指搓之，泥细而滑，如磨石之粉。身后一妇抱儿，儿面赤而喘，唇干。妇跪于侧，问曰：「可能救。」问一遍，不应；再问，仍不应；三问，声已哑。蓝砚乃起，顾左右曰：「回去。」回去告谷里之人：这即吾辈何以要出山。\n其声甚平，如说一件农事。然言毕转身时，眼眶已红。同行者不敢看，各自低头视井。井中黄水无波，映一小片天，天色极好。是夜宿于村，村人以仅存清水煮粥。蓝砚不食，惟坐井边至三更。临行，妇以破布裹井泥一撮，塞于蓝砚手中，曰：「带去。教谷里之人也看看，吾辈喝者何物。」毒井在灵濛山下村中，井栏以石砌，石上有绳痕，深寸许。"
 LYY_Event.7034.a:"亲赴毒井，勘其水势"
 LYY_Event.7034.b:"绕道而行，不问其事"
 LYY_Event.7035.t:"绿旗成行向港去"
 LYY_Event.7035.d:"出山之后，队伍始成行列。前列执旗，旗不甚大，青底，上绣一叶，叶脉以白线绣成，风起则舒，风止则垂。\n道旁有人笑曰：「军旗不绣虎豹，不绣刀斧，绣一片叶子，成何体统。」执旗者面赤，欲辩。蓝砚自后至，曰：「不必辩。吾辈非来吓人。吾辈来令彼等看：有这些人，肯为一片叶子站定，站到彼等不敢再往下挖为止。」其人笑声渐止。\n队复行，路过一村。村中小儿先追着看旗，其后大人亦出，倚篱而立。有一老农问：「这叶子，甚么叶子。」执旗者曰：「不知。」谷里最先长出来那种。老农点头曰：「那我知。」\n其后数月，此旗之样传于各村，有以布绣者，有以炭画于门者。无人号令，无人颁发，惟见旗则知有同气之人。至港外十里，队伍止。蓝砚曰：「就到这里。」再往前，便非走路。众乃就地而坐，旗插于土，叶向海。绿旗以青布为底，绣一叶，叶脉以白线，线为沉玉谷妇人所纺。"
 LYY_Event.7035.a:"树绿叶之旗，结阵而行"
 LYY_Event.7035.b:"散走民间，不张旗帜"
 LYY_Event.7036.t:"举火焚炉于河上"
 LYY_Event.7036.d:"上游有炉数座，昼夜不熄，烟黑如墨，落于水面，结成一层薄壳。谷中屡请闭炉，炉主不应。是夜，蓝砚下令焚之。\n火起于子时。初只一线，俄而炉顶腾焰，映于河面，如晚霞倒流。炉身崩时，声闷而长，火星迸至对岸，落草即燃，众人以湿帚扑之。烟与雾相杂，十步之外不辨人面。蓝砚立于岸上，袖口被风掀起。\n火光中，她忽见炉门边有铁钩一具，柄上缠布，是矿工常用之物。她记起此钩之主，是当年自谷中逃出之旧邻，姓甚么已忘，只记得其母唤他阿石。\n火渐弱，炉骨架黑，立于河边，如巨兽之骨。有人来报：「炉中无人，皆已散去。」蓝砚不语，闭目良久，方睁。睁时眼中无水，只映着一点残火。天明，河面浮一层黑灰，缓缓东流。她蹲下以杖拨灰，拨出一尾小鱼，已死，鳞上沾灰。灵濛山下炉在上游岸侧，以砖砌，砖缝以泥，泥中有草。"
 LYY_Event.7036.a:"焚其污炉，绝其源头"
 LYY_Event.7036.b:"议而不行，另谋他法"
 LYY_Event.7037.t:"课堂移于田垄间"
 LYY_Event.7037.d:"田垄学堂不设屋，不设案。课在荒地上，每人分一方土，各予种数粒，令其自种、自浇、自守。\n一童所种萝卜先出苗。苗出三日，为虫所啮，童守之终夜，以手捉虫，指甲皆黑。又半月，叶复生，根渐粗。至拔之日，童以两手捧之，泥未去尽，缨叶尚青，一路跑来，面上泥痕纵横，惟两眼极亮。蓝砚蹲下受之，捧于掌中，翻覆细看，视良久。众童环立，不敢出声。良久，蓝砚曰：「好。此物汝所种。汝今知吾辈何以须流血矣。」\n童似解非解，点头。蓝砚还之。童抱萝卜，不置篮，不裹布，径自抱回营中。路上有人问：「此物可食乎。」童曰：「不食。」问：「既不可食，抱之何为。」童不应，抱得更紧。是夜营中多一萝卜，置于窗台，众皆绕行，无人敢动。田垄之课在沉玉谷荒地，地分方畦，畦边以石为记，石上刻名。"
 LYY_Event.7037.a:"设田垄学堂，教以耕种"
 LYY_Event.7037.b:"专注农事，不遑教化"
 LYY_Event.7038.t:"蔓根无主自蔓延"
 LYY_Event.7038.d:"出山之后，港府始觉有异。其事无形：无营垒，无旗号，无首领可擒。一村既动，邻村问之；邻村既动，隔水之村又问之。如草根伏于土下，不见其长，而一夜之间满坡皆绿。\n有官员按籍查之，怒曰：「此何组织。」左右不能对。乃遣人问蓝砚。\n蓝砚方在田间，闻言而笑，曰：「无组织。君欲捕，捕谁。」捕种田者乎，捕挑水者乎，捕彼在集上问了一句这地本来属谁之老农乎。\n使者曰：「既无组织，何以号令能达。」蓝砚曰：「不达。」从来未达。各村自作自受，各问各话。所问者，同一句也。\n使者归报，官员默然，批其牍曰：「无从下手。此四字后加一勾，勾甚重，纸背皆破。」\n有老吏在旁，低声曰：「此辈无首，捕之则散，散而复聚。」官员掷笔曰：「那就莫捕。」沉玉谷村与村之间以水相连，上游一动，下游即知。"
 LYY_Event.7038.a:"蔓根四散，遍地而起"
 LYY_Event.7038.b:"集于一地，免遭围剿"
 LYY_Event.7039.t:"泽法立而水有主"
 LYY_Event.7039.d:"泽法三条：凡有水处，不得截流，不得排污，不得私占。文不满百，刻于木，立于各水口。\n港中一吏见之，曰：「此管得太宽。」水在谁家地界，谁家自管，古来如此。蓝砚曰：「水不认地界。今日汝在上游筑一坝，明日下游便无水可饮。汝所管者，自家门口；吾所管者，整条水。」吏曰：「如此，则事事须问过谷中。」蓝砚曰：「不必问过谷中。」只须问一句：「此水下去，犹有人家否。」有，则不可截。吏无言。蓝砚复曰：「吾这一生，别者皆可让。」税可让，名可让，面子可让。惟水一寸不让。水让出去，即命让出去。\n是年秋，沿江数村自抄泽法，贴于水口。有村不识字，倩塾师写之，写毕，全村立于木前，令塾师读三遍，读毕乃散。自是凡新凿一井，必先告于邻村，书其日于石。石上不刻官衔，只刻村名与年月。泽法木牌立于沉玉谷各水口，牌上刻字，字以刀刻，深可容指。"
 LYY_Event.7039.a:"立泽法，护水如命"
 LYY_Event.7039.b:"权宜行之，不必立规"
 LYY_Event.7040.t:"决一闸而污倒流"
 LYY_Event.7040.d:"港府不让，谷中粮尽。蓝砚乃下一令：决上游一闸，使污水倒灌。\n令下，帐中无声。有追随十年者起而曰：「此与彼等所为，何异。」蓝砚曰：「无异。」其人曰：「既无异，何以行之。」蓝砚曰：「因彼等不怕讲理，只怕自己之井。」\n令既签，众皆退。蓝砚独留，携灯出帐，坐于河边。河水黑，灯影碎于水面，聚而复散。三更风起，露落衣上，她不拂。守夜之人远远看着，不敢近前。天将明，水色稍白。蓝砚乃起，顾守夜者曰：「我知此事不对。」可有些地方，道理讲不进去；讲不进去时，只剩这一条路。这条路脏，连我自己也不干净。\n言毕，将灯灭于水中，曰：「回去。今日还有渠要淘。」月余，港中井水亦浊。市人担水而骂，不知骂谁。蓝砚闻之，但曰：「记着这味道。」灵濛山下水闸以木为板，板厚三寸，启则水涌。"
 LYY_Event.7040.a:"决坝倒灌，以毒攻毒"
 LYY_Event.7040.b:"另择他策，不为此举"
 LYY_Event.7041.t:"万夫荷锄向港行"
 LYY_Event.7041.d:"是日天未明，田埂上已有人。初数十，俄而数百，俄而不可数。农人荷锄，药婆负篓，猎户挟弓，流民扶老携幼，各于襟前插一绿叶。无人击鼓，无人执令，惟一路向北。\n其行极缓，亦极齐。前队行三步，后队即止；前队止，后队亦止。无人争先，亦无人落后。路旁麦未熟，行者皆循田埂，不践一茎。有小儿欲折麦穗，其母按其手，曰：「今日不折。」蓝砚行于队中，衣与众人同，尘与众人同。有少年牵马至，请乘。蓝砚摇首曰：「我若骑马，便高汝等一头。今日此行，无高下。」少年曰：「然则此去何为。」蓝砚曰：「不为造碑。」只为走完这一遭，而后各自归家，各理其田。少年默然，牵马退于道旁，久之，亦插叶于襟，随队而行。\n至日中，队伍过长堤。堤下水缓，人影倒立水中，动摇不定。有老妇行且歌，歌不成调，前后皆和。傍岸有吏持牒而立，欲问其故，问至口边，终未出声，惟侧身让道。翘英庄队伍自谷口出，沿江而下，途经三村，村人皆出。"
 LYY_Event.7041.a:"行田夫之行，直趋璃月港"
 LYY_Event.7041.b:"止于中途，勿涉险地"
 LYY_Event.7042.t:"但守此一座青山"
 LYY_Event.7042.d:"蓝砚为此路取名，曰：「最后青山。」众问何解。她指脚下坡曰：「此坡三年前是石滩。今有草，有虫，有雀。」这就叫青山。\n坡上草不深，才及脚踝。风过时，草伏而复起，露出底下碎石。石缝之间有蚁行，有细花，色白，大如米粒。蓝砚蹲下，以指拨草，看许久，指尖沾露一点。乃曰：「吾不求天下之山皆青，求不得，亦无力。吾只求，当守不住所有地方时，还能守住这一座。此一座在，则此事尚有可望。」\n众皆不语，有老者以袖拭目。言毕，她伸手拔去脚边一株草。旁人惊曰：「此非草乎。」蓝砚曰：「此草名莸，根浅而蔓，夺他草之土。」留着，三年之后这一坡又是它。众人视其手中草，根须细白，土犹附之。蓝砚抖去泥土，随手掷于坡外。\n是日众人在坡上除草至暮。归时坡面净，草色反更深。有小儿拾其所弃之莸，问曰：「此物也有用乎。」蓝砚曰：「有。」晒干可以引火。小儿乃抱一大束而归。遗珑埠谷口之坡三年前为石滩，今有草，草高及膝。"
 LYY_Event.7042.a:"守最后青山，勿使再失"
 LYY_Event.7042.b:"全面出击，不留退路"
 LYY_Event.7043.t:"一谷亦是天下角"
 LYY_Event.7043.d:"谷中议事，有少年问曰：「吾辈所守者一谷耳。谷外之事，天下之事，与吾辈何干。」\n蓝砚不即答，令众出门，立于坡上。时方雨霁，山上有水下来，细流数道，入于田；田中有烟起，缓缓而上，散入云中。众人视水，视烟，皆不解其意。\n乃曰：「山上之水，流入山下之田；山下之烟，飘回山上之云。你且替我算一算，哪一部分属你，哪一部分属我。」众人相顾，无人能对。\n良久，蓝砚曰：「算不清。」算不清，才好。凡算得清之物，都要被人卖掉。田可丈量，故可卖；水不可丈量，故无人能买。今日守一谷，即守天下之一角；守此一角，即为他日留一处算不清之地。\n少年曰：「然则天下终不可守乎。」蓝砚曰：「不知。我只知今日之谷，明日之谷，皆须有人看着。」看者渐多，便成天下。\n言毕，指坡下水曰：「此水今夜入江，明日入海。」它不认谷口。坡下水入江，江水东流，至遗珑埠而入海。"
 LYY_Event.7043.a:"谷与天下，本为一事"
 LYY_Event.7043.b:"只守此谷，不闻外事"
 LYY_Event.7044.t:"谷口歌者唱无名"
 LYY_Event.7044.d:"谷中有歌者，少时牧牛，长而能唱。每逢集日，坐于谷口石上，以竹击节，唱谷中旧事。\n所唱者皆无名之人：守泉四十年之老人，雪天分饼之童子，以背负石砌渠之寡妇。唱至悲处，声不颤而听者颤；唱至喜处，声不高而听者笑。或问：「何不唱英雄。」歌者曰：「英雄自有他人唱。吾所唱者，无人唱者也。」蓝砚常往听，每至，坐于最末，听毕即起，不置一语。从者问曰：「何不赞一言。」蓝砚曰：「其在唱吾辈。吾一开口，便成替自身鼓掌。」\n是年冬，歌者病，不能出。集日无人至石上，市人往来，反觉空落。一小儿问其母：今日何以无歌。母曰：「唱歌之人病了。」小儿曰：「那吾辈去看他。」母子遂携粥一盂，往谷中去。\n至其门，歌者倚枕而坐，见人来，欲唱，气不足。小儿曰：「不必唱。」歌者笑，以竹节轻击床沿，一击，又一击。母子坐至暮方归。谷口歌者坐石上，以竹击节，竹为灵濛山所产，节密而坚。"
 LYY_Event.7044.a:"任歌者传唱，不赞一言"
 LYY_Event.7044.b:"禁其传唱，恐生事端"
 LYY_Event.7045.t:"旧矿人日填一坑"
 LYY_Event.7045.d:"谷中有老者数人，背驼，行数步即喘，咳则声如破瓮，痰中带黑。此辈少时皆矿工，亲手挖空此山。今山空而人病，石粉入肺，医不能去。\n蓝砚初至，众皆避。为首一老者迎于路口，曰：「我等乃挖山之人。此山之所以秃，我等之罪。」她不问罪，只问：「今欲何为。」老者曰：「填坑。」当年挖出之坑，一锹一锹填回去。挖了三十年，填或须四十年。我等活不到填完之日，填一寸，得一寸。蓝砚曰：「我陪汝等填一日。」老者摇首曰：「不必陪。汝陪一日，明日走了，吾辈照旧填。汝若真欲来，明日自来。」\n翌日，蓝砚自持一锹至。老者视之，不言语，以手指一处坑，曰：「从此处起。」是日填土三尺。归时众矿工手上血泡皆破，无人言痛。\n三月后，坑已浅半。老者病笃，不能上山，犹令其孙以筐盛土，捧至榻前，令其手抚之，曰：「此土，坡上者。」孙曰：「然。」老者曰：「此土尚温。」旧矿之坑在灵濛山后，深数丈，老者日负石数筐，喘则倚锹而立。"
 LYY_Event.7045.a:"与旧矿之人，共填其坑"
 LYY_Event.7045.b:"清算旧恶，以正人心"
 LYY_Event.7046.t:"一瓯热茗先奉弱者"
 LYY_Event.7046.d:"谷中有不成文之规：凡弱者入谷，先予热茶一碗，饮毕再言他事。茶不甚佳，粗叶老梗，然必滚，必满，必以双手递之。\n是年大雪，谷口救得一人，衣冻如甲，须上结冰。舁入灶房，以雪搓其手足，久之乃苏。其人睁眼，第一句问曰：「我欠谷中多少。」递茶老妇曰：「不欠。」其人曰：「岂有不欠之理。」老妇曰：「这碗茶，不出自谷中仓廪，乃出自谷中每一个人，从自己最难那几日里省下一点。此碗既饮，他日有更弱者来，汝再省一点出来，便算还清。」其人捧碗，手抖，茶溢于指。饮半碗，忽伏于案上，肩动而无声。老妇不劝，转身添火，柴在灶中爆出一声。\n开春，此人不言去，亦不言留，惟每日早起扫谷口之雪。人问其名，曰：「不必问。又一日，灶房多干柴一担，不知谁所置。」老妇视之，柴皆劈得极齐，长短如一。遗珑埠谷口之茶为粗叶老梗，煮于大壶，壶置灶上，终日不撤。"
 LYY_Event.7046.a:"以热茶待弱者，谷中之规"
 LYY_Event.7046.b:"量力而行，不必强求"
 LYY_Event.7047.t:"修奥藏七日花径"
 LYY_Event.7047.d:"上奥藏旧道，废已久。石断于中途，蔓塞于隘口，行者绝迹。蓝砚率人数十，持锄镐，一寸一寸修之。\n人问曰：「此道不通商，不通兵，修之何为。」蓝砚曰：「为春天。」众不解。乃曰：「奥藏之顶，有一种花，一年只开七日。」开时满坡皆白，风过如雪不落。谷中人欲看，须攀崖而上，年年有人跌死。曰：「修此道，不为运货，不为行军。」只为春时谷中老弱，亦能上去看一眼那七日之花。人活着，不能只是熬。总得有一处，是专为令人看一眼，便知此日子还过得。众闻言，无人再问。是日凿石，锤声应于山谷，一记，又一记。有少年凿石过猛，锤柄断，众笑。蓝砚解己之柄予之，曰：「慢些。此道不急，明年春天才用。」\n次年花期，果有老妇扶杖而上，行至坡顶，坐于石上，望花半日。下山时曰：「值矣。」问其花何如，曰：「白得看不见边。」又问：「可曾摘一枝。」曰：「摘它作甚。」看一眼便足矣。道在奥藏山南，石阶断处凡九，蔓塞处凡五。"
 LYY_Event.7047.a:"修上奥藏之路，以观山花"
 LYY_Event.7047.b:"移作他用，以省人力"
 LYY_Event.7048.t:"举谷丁壮出山谷"
 LYY_Event.7048.d:"是日出师之前，谷中先分人。老者留守，曰：「门在人在。」妇人携幼者随后队，负粮负水。丁壮尽出，农具为兵，猎弓为械，无甲者以厚布缠胸，无盔者以革裹首。\n无鼓，无旗，无誓师之坛。惟有人立于坡上，呼一声，众应一声。呼声自谷口传至谷底，又自谷底传回，久之，不辨其为几人。蓝砚立于队前，未语。回望谷口那株老树，树大数围，枝柯横出，荫覆半坡。少时其父尝指树下之草，教她辨其名，曰：「此可食，此可药，此不可入口。今树犹在，指树之人不在。」她看了一阵，转回头，迈出第一步。其后千步万步，无人回头。行至坳口，风大，众人衣角皆向北。有少年忍不住回顾，被其兄按住肩，曰：「走。」\n队伍出谷时，日正出山。谷中老者立于门内，以手按门框，未出门。门内小儿问：「彼等何时回。」老者曰：「打完就回。」小儿曰：「打完了还回么。」老者不语。自翘英庄出谷之路有二，一沿溪，一越岭，越岭者近而险。"
 LYY_Event.7048.a:"举谷而动，倾尽所有"
 LYY_Event.7048.b:"按兵不动，留有余力"
 LYY_Event.7049.t:"却港府一纸招抚"
 LYY_Event.7049.d:"港府遣使至，捧文书一轴，锦缎裹之，朱印未启。使者陈其词：若归附，则授以官，岁给钱粮，名列官府，谷中之人皆得入籍。\n帐中诸人皆视蓝砚。蓝砚受文书，展而读之，读甚缓，一字不遗。读毕，乃就案上折之，折得极齐，还于使者，曰：「所赐官、钱、名分，吾一样不要。」使者曰：「然则欲何求。」蓝砚曰：「只求一事。」自今以后，勿再打沉玉谷水土之主意。\n使者面色数变，曰：「此事非吾所能应。」蓝砚曰：「既不能应，则此文书亦不必留。」使者取文书，欲言又止，卒去。出谷时回望，见蓝砚已至田边，与农人语，语音平平，如方才未曾见过何人。\n使者谓从者曰：「此人不易对付。」从者曰：「何以见得。」使者曰：「其连官都不要。」行至谷口，使者忽停车，问从者曰：「方才其折书，折几折。」从者曰：「四折。」使者曰：「四折，是其早想定如何还吾。」文书以锦缎裹，缎色红，裹三层，解开须半刻。"
 LYY_Event.7049.a:"拒斥璃月港之招抚"
 LYY_Event.7049.b:"受其招抚，换谷中安宁"
 LYY_Event.7050.t:"绿旗插上港城墙"
 LYY_Event.7050.d:"旗插于璃月港最高之城墙时，日已西斜。执旗者三人，攀垛而上，以绳系旗杆于女墙。风自海上来，旗一展，满城皆见。城下人仰首，久之，有欢呼者，亦有默然者。\n蓝砚不在旗下。她被人抬至城下，早已不能行。双足肿，鞋不能着，以布裹之。众人扶她登城，每上一级，停一停。至城头，她倚垛而坐，望脚下之城。屋宇连绵，其间多有焦痕；街巷纵横，其间多有断墙。远处港口，桅杆如林，亦有倾覆者，横于水面。\n她看了很久，面上不见喜色。从者问曰：「既得此城，何故不乐。」蓝砚曰：「此城比吾设想者大。也比吾所想更荒。」众皆寂然。\n良久，她以手按垛上砖，砖上尘土沾手。乃曰：「那就从头再种吧。」言毕，众人相顾，而后有人笑，有人低头。是夜城头旗不落，城下火不熄。翌日清晨，有人见城头砖上有一掌印，印甚浅，风一吹便散。城墙为最旧一段，砖大而厚，垛口有炮痕，痕深可容拳。"
 LYY_Event.7050.a:"以谷连天下，自此一统"
 LYY_Event.7050.b:"功成身退，还政于民"
 LYY_Event.7051.t:"玉衡书至论田垄"
 LYY_Event.7051.d:"玉衡之书至，其速出人意料。使者晨发，翼日暮返。囊中帛书一卷，展之，长可三尺。\n蓝砚就灯读之，读一遍，复读一遍，又读一遍。书中不言人心，不言大势，所言者：田如何分，佃如何为自耕，旧契如何废，新册如何立，丰年如何收，歉年如何缓。字字皆田垄事。读毕，蓝砚忽觉可笑，遂笑。笑已，谓使者曰：「吾原以为玉衡那位，满纸皆是革命、口号、主义。不意其肯与吾认认真真说一整页田埂。」使者曰：「其人所言，可有可取。」蓝砚曰：「可取者多。不可取者，亦有。」使者曰：「何处不可取。」蓝砚曰：「其言田可分，却未言分完之后，谁去教人种。」田分而人不知种法，明年仍荒。使者默然，取笔欲记，蓝砚止之曰：「不必记。这话吾自会写回与她。」\n使者还报。后检点行装，见蓝砚以油纸裹此帛书，置于装谷种之木箱底，与最上等之种同贮。或问其故。蓝砚曰：「此亦种也。」玉衡帛书长三尺，卷以竹轴，轴上刻记号，记其次第。"
 LYY_Event.7051.a:"回信玉衡，共议田政"
 LYY_Event.7051.b:"婉拒其意，各行其是"
 LYY_Event.7052.t:"群玉阁问谷中粮"
 LYY_Event.7052.d:"群玉阁之使至，不叙寒温，启口即问：「谷中一年出粮几何。」又问：「值银几何。」又问：「若岁输若干，可换几何。」\n蓝砚不答，令人取斗量谷，以斗置于案，曰：「此一斗，使者且看。」使者视之，粟粒饱满，间有细土。蓝砚曰：「谷自土出。」土一年薄一寸，则来年粮少一成。吾辈量土，不量钱。使者曰：「不量钱，则何以计盈亏。」蓝砚曰：「谷种下去，长出十倍，是一笔账。」土薄一寸，三十年后无谷可种，又是一笔账。前一笔账汝等算得清，后一笔算不清。故我不与汝等算。使者携此言归。凝光闻之，执卷在手，久不置下。堂中无人敢言。良久，凝光乃曰：「有意思。」遂不复问。\n后群玉阁密札中有一行批注，墨色甚淡：沉玉谷之患，不在其兵，在其不可定价。旁有小字一行，已被人以指甲刮去，不可辨。是年冬，群玉阁市肆谷价微涨。有老商言：「涨不在粮少，在人心里多了一物，买不动。」群玉阁窗向北，可望见港中泊位，商船进出皆在目中。"
 LYY_Event.7052.a:"复群玉阁：吾辈量土"
 LYY_Event.7052.b:"投其所好，与商周旋"
 LYY_Event.7053.t:"月海亭细读水账"
 LYY_Event.7053.d:"回书之中，月海亭最厚。启之，中有二事：一为批注，逐条批于谷中水土账之侧，字小而工，无一字虚誉；一为粮政纪要，甘雨自辑，凡谷中丰歉、户口、渠堰，皆分类列之。\n末附一图，图上山川与谷中所绘不同，注曰：「此依官册，恐有旧误，望谷中正之。」\n蓝砚展图，以指循其山川，循至一处，忽止。曰：「此处她画错了。可我看着，倒像是她特地留给我。」\n众不解。蓝砚曰：「肯留错处与人改者，自己人也。」\n乃取谷中新收之种一袋，以粗布裹之，附书一行：「君若真来，谷中留一碗热茶。」不设席，不设仪，惟茶是滚。使人赍往。\n后半年，月海亭有一吏至谷，不乘车，不持节，步行至谷口，自云：来饮茶。\n蓝砚迎于道上，二人对坐树下。茶三碗，语不多，皆田事。至第三碗，其吏忽曰：「图上那错，我故意留之。」蓝砚曰：「我知。」二人相视而笑，不复言。批注以朱笔，字小如蚁，行间不足则引线于页边。"
 LYY_Event.7053.a:"回赠谷种，奉茶一瓯"
 LYY_Event.7053.b:"拒其亲近，不苟言笑"
 LYY_Event.7054.t:"绝云间一书最冷"
 LYY_Event.7054.d:"四方回书，绝云间最简，不过数行，书于薄绢，字瘦而硬。其词曰：「山有山规，谷有谷法，各安其处，不必相闻。」\n使者赧然，以为失礼。蓝砚读毕，反笑，曰：「这样最好。」\n使者问：「何以最好。」蓝砚曰：「世上最难防者，非恶人，是好人。」口口声声说要帮你那种人，帮来帮去，谷便归他。他还要你谢他。\n言毕，以两指夹绢，随手夹入案上一本旧账。账中所记，某年某月买锄几把，赊米几斗。绢入账中，便不复见。\n使者曰：「既不往来，则此后有事，可求乎。」蓝砚曰：「不必求。」山不下谷，谷不上山，各活其生，便好。若有一日山要下来，我再想法子。\n是夜谷中雨，屋漏。蓝砚起而移床，移三处，终坐于门内看雨至天明。\n次日使者辞行，问可有何言带回。蓝砚曰：「无。」只说谷中茶还滚着。薄绢为山中织，经纬粗，字以墨书，墨透绢背。"
 LYY_Event.7054.a:"敬其不相扰，各守其土"
 LYY_Event.7054.b:"通使结好，共御外敌"
 LYY_Event.7055.t:"云来海使谈租约"
 LYY_Event.7055.d:"云来海之使，衣饰华整，从者四人，皆佩短刃。入帐未坐，即出图一幅，铺于案，指其港口、航路、泊位，言租几年，息几分，岁入几何。\n言至一半，蓝砚已起，伸手作请。使者愕然，曰：「我言未竟。」蓝砚曰：「不必竟。君所言者，我已知其尾。」\n使者曰：「既知，何不听完。」蓝砚曰：「听完，我怕我记着。请。」\n使者出帐，立良久，收图而去。归舟，以原话白于达达利亚。\n达达利亚方执杯，闻言手停，杯在中途，久不放下。舱中寂静，惟水声。良久，笑曰：「有意思。」\n左右问：「何以有趣。」曰：「她所惧者非我。她惧我哪天想要她那点水。」我尚未开口，她已替我道尽，且替我拒尽。\n是夜达达利亚独坐船头，望上游山影，曰：「山里头，原来亦有这样人。」左右曰：「既如此，何不遣人再往。」摇首曰：「不必。再去，她连茶也不给我。」图以厚纸绘，港口以朱标，航路以墨线，线有粗细。"
 LYY_Event.7055.a:"拒云来海之约，寸土不让"
 LYY_Event.7055.b:"虚与委蛇，以图苟安"
 LYY_Event.7056.t:"青约既立无人散"
 LYY_Event.7056.d:"青约之立，无坛，无牲，无印。诸村之人各以掌按地，按于同一片土，掌痕相叠，久之土面尽满手印。\n蓝砚立于侧，不按。一妇问曰：「汝何以不按。」蓝砚曰：「吾若按之，便似此约为吾所立。此约非吾所立。」\n按毕，众犹不散。日已西，影长至坡下，炊烟起于各家屋上，烟细而直。\n或请立碑。蓝砚摇首曰：「碑有时而倒。」或请刻石于崖，曰：「石可久。」蓝砚曰：「崖有时而崩。」一老者曰：「然则何以示后人。」蓝砚曰：「何须示。后人自会立约。其所立者何约，乃后人之事。吾辈今日但使彼等一见：昔有一群人，各以掌按于同一片土，无一人先走。」\n言至此，众皆不语。暮色渐合，或席地而坐，或倚锄而立，无一人先归。及星出，方三三两两散去。是夜谷中犬不吠。翌晨视坡上，掌痕已为露水所润，深者犹可辨，浅者已平。青约之坡在灵濛山下，掌痕相叠，土面满印，深者犹辨，浅者为露所平。"
 LYY_Event.7056.a:"立青约，与众共守此土"
 LYY_Event.7056.b:"立青约而不设盟主"

 CYG_Spirit_Valley_Vigil:"枯田一握沙"
 CYG_Spirit_Valley_Vigil_desc:"有少年蹲于枯黄之田，手攥一握沙。沙自指缝漏，漏尽则复攥，凡三攥，掌中惟余数粒。老农告以此田已死。少年不答，起而扬手，沙散于风。是日，其尽捐家中之田券，随行者七人。或问其故。答以沙在手中，握之则漏；扬之则散于野，野不死，则沙不亡。问者视其掌，掌纹中犹嵌一粒。枯田在沉玉谷东，土白而松，风过则起尘，尘落于埂。"
 CYG_Spirit_School_of_Grass:"树下课草木"
 CYG_Spirit_School_of_Grass_desc:"老树之下设学堂，不授经史，惟教三事：认草、认土、认天时。晨起，童子各持一铲，随师出，掘土一掬，以指捻之，辨其色与湿。有童子问曰：「此何用。」师曰：「不识土者，读书亦为他人读。」童子不解。及秋，谷中旱，师令诸童各指一处掘井，所指皆中。众乃服。学堂设于翘英庄老树之下，无屋无案，以石为座。"
 CYG_Spirit_Valley_Endures:"谷须养后人"
 CYG_Spirit_Valley_Endures_desc:"其言曰：「此水土，能于吾辈去后，仍养吾辈之子乎。」能，则今日尽死于此，亦值。老者闻之，拄杖问尽死则谁养。答以尽死者言其志，非真尽死。老者谓志亦须有人承。答以故不死者当承此志。老者乃取杖画地，画一谷形，指其口，谓守此口者即承志者。众视其画，无一人退。谷口旧有投珑之台，台石尚存，逢节谷人犹以玉珏投潭。"
 CYG_Spirit_The_Last_Green_Hill:"守山一座青"
 CYG_Spirit_The_Last_Green_Hill_desc:"不求天下之山皆青，惟守此一座。此座在，则事尚有望；此座亡，则言此事者，亦无以为凭。客讥以一座之青，何救于世。守者答以不救世，救吾目中之一物。客问目中之物值几何。守者引之登山，至巅，四望皆黄，惟此山青。客视良久，曰：「吾今乃知，青者非山，乃人之不肯尽弃者。」此山在沉玉谷尽处，四望皆黄，惟此山青，草高及膝。"
 CYG_Spirit_Green_Alliance:"不树旗而盟"
 CYG_Spirit_Green_Alliance_desc:"不树旗，不立国，惟与愿守水土者相结。盟无首，无堂，无印，惟有一册，凡入者书名于册，书毕即去。或问无首则谁令。答以不令。问无令则散。答以散则复合，合不必在一处。问何以验其合。答以验之于事，不验之于名。是岁谷中议事三次，至者皆不待召。盟册藏于遗珑埠社仓，册以布裹，入者书名即去。"
 CYG_Spirit_Common_Granary:"仓廪恒有备"
 CYG_Spirit_Common_Granary_desc:"共仓之设，先有人肯出，而后有仓。初一村出粟三十石，置于祠堂，不锁，不派守，惟悬一牌，令取者自记。月余，粟少七石，牌上记名十一人。岁暮复量，反多二石，牌上多一行小字：某月某日补七石。村老视之，取笔于末添一语，谓此仓所存者非粟。仓在翘英庄东，屋梁为旧茶木，历年久而气尚香。"
 CYG_Spirit_Terrace_Militia:"耒耜卫田畴"
 CYG_Spirit_Terrace_Militia_desc:"无甲，无饷，手中所有者，锄与竹矛。操练在田，闻警则聚，聚不待鼓，散不待令。官军过，见其众而笑，问此亦兵乎。一人答以非兵。官军问既非兵，何聚。答以守埂。官军谓埂值几钱。其人指田中苗，谓此苗值一年之食。官军视苗，又视其手中之锄，不复笑，策马而去。操练在翘英庄田中，闻警则聚，聚不待鼓。"
 CYG_Spirit_Herb_Doctors:"医方传一谷"
 CYG_Spirit_Herb_Doctors_desc:"祖传之方，向不示人，今尽授于谷中。教者为一老妇，授时令诸徒环坐，口诵歌诀，诵一句，解一句，解毕令复诵，误一字则重。徒问此方传尽，师何所恃。老妇答以恃汝辈记得。徒问若记不得。老妇答以则此时所教皆为虚。是冬老妇殁，谷中染疾者百人，死者三。药君旧洞在灵濛山北，洞前茶树数株，叶可入药。"
 CYG_Spirit_Spreading_Root:"蔓草及邻村"
 CYG_Spirit_Spreading_Root_desc:"其势不如军，无垒，无阵，然如野草，自一村而及一村。捕者问首是谁。村人答以无首。问从谁之令。答以无人令。问然则何以同举。村人指田，反问此田本谁之田。捕者不能答。村人乃言：汝归问汝上，此田本谁之田。捕者归，果问，上者亦不能答，乃止其捕。其事自沉玉谷一村起，渐及邻村，村各有约，约不相袭。"
 CYG_Spirit_Song_of_the_River:"山水难筹算"
 CYG_Spirit_Song_of_the_River_desc:"山上之水，流至山下之田；山下之烟，飘回山上之云。算者执笔，欲分彼此，算至三日，不能成一数。老者过，视其算，谓可分者皆将卖之。算者谓不分则争。老者乃言：争者犹知共有；分者则各执一纸，纸尽而争起。算者搁笔，取其所算之纸，撕之，投入溪中，纸随水去。溪水自灵濛山来，至翘英庄而缓，庄人于此取水煮茶。"
 CYG_Spirit_Five_Envoys:"五使复书至"
 CYG_Spirit_Five_Envoys_desc:"五方各遣使，五方各回书。其一书极长，算田垄至一页尽；其一止一行，谓吾辈所量者土。其一不书，遣一老农随使归。其一书而附种一囊。其一闭门，使者候三日，门不开，第四日晨，门下有物，视之，乃一饼，尚温。主者阅五书，置于案，谓此五书皆不可轻。所遣五使，皆自遗珑埠登舟，埠上石阶七十二级。"
 CYG_Spirit_Silent_Valley:"谷中无号令"
 CYG_Spirit_Silent_Valley_desc:"谷中无号令，亦无受令之人。晨起各赴其田，暮归各闭其户，有事则聚于树下，言毕即散。外来者问此可久乎。谷人答以不知。问不知而为之。答以知之者必先立一令，立令者必先有一人。其人谓无人主之，事必乱。谷人曰：「乱亦吾辈自乱，不自他人乱。」其人不能对，留三日而去。沉玉谷老树之下为议事之处，言毕即散，不留一字。"

 CYG_Soil_Tier_1:"水土之阶"
 CYG_Soil_Tier_1_desc:"水土崩坏，泉眼枯竭，田垄沙化。谷中抓土一把，大半握不住，风过即散。老农蹲于垄头，以指捻土，捻至碎，良久曰：「此土不认人矣。」谷中人挑水三十里，一瓢一瓢浇下，苗不活，倒是泥沙先沉。"
 CYG_Soil_Tier_2:"水土之阶"
 CYG_Soil_Tier_2_desc:"水土将复，泉眼回潮，坡上见草。此地尚虚，然已一寸一寸往好处挪。蓝砚晨起看坡，不言语，只以靴尖拨开一丛新草，看底下土色。土色尚黄，黄中带黑。她点头，曰：「还得再养三年。」"
 CYG_Soil_Tier_3:"水土之阶"
 CYG_Soil_Tier_3_desc:"水土渐养，梯田成片，草木成荫。谷中孩子头一回见成片开花之坡。妇人把布单晾在坡口，风一过，满坡皆响。有老人坐于田埂，数渠水几道，数至第七道，忽然不数，只以杖指山下，曰：「明年这一片可种麦。」"
 CYG_Soil_Tier_4:"水土之阶"
 CYG_Soil_Tier_4_desc:"水土归元，旧伤初愈，地力渐厚。多少年透支，终在这一茬新苗里一点一点还回来。蓝砚令人在坡顶立一石，不刻字。有童子问其故，她曰：「石记日子，不记功劳。」此后凡有丰年，谷中皆来摸一摸这块石，摸完便去。"
 CYG_Soil_Tier_5:"水土之阶"
 CYG_Soil_Tier_5_desc:"水土大盛，风过草伏，满目青山。极盛之生机下，蓝砚反更警惕：福气来得愈厚，愈经不起有人动一次歪念。她遣人每月巡山，只查一事：谁家多砍一株。查至第三年，无一人多砍，她仍不撤。"
 CYG_Will_Tier_1:"山心之阶"
 CYG_Will_Tier_1_desc:"山心涣散，人心浮动，各奔生路。谷中谁都不想多留一天，只盼天一亮就出谷去。谷口那面木牌倒三日，无人肯扶。蓝砚扶起，次日又倒。第三日她不再扶，只把牌靠在树上，看有多少人绕过它走。"
 CYG_Will_Tier_2:"山心之阶"
 CYG_Will_Tier_2_desc:"山心初聚，有人愿留，有人肯干。谷中总算有几户肯把根重扎下去。夜则点灯，灯下所议非粮非水，是一口井该打在何处。争至半夜，定在东坡。第二日动土，来七人，比昨日多一个。"
 CYG_Will_Tier_3:"山心之阶"
 CYG_Will_Tier_3_desc:"山心相连，村社相通，守望相助。谁家断粮，都不必再一个人扛着。东村缺盐，西村挑一担送来，不要钱，只索一句回话：下回我家缺炭，你记得路。此言在谷中传三年，无人立契。"
 CYG_Will_Tier_4:"山心之阶"
 CYG_Will_Tier_4_desc:"山心如铁，人人守土，寸步不让。谷中无一局外人，连孩子亦记得自家田在何处。盗木者夜入林子，未及举斧，四山灯火齐起。来者非兵，乃各村农人，各执锄头，站成一圈，谁亦不先动手。"
 CYG_Will_Tier_5:"山心之阶"
 CYG_Will_Tier_5_desc:"山心成岳，众志如山，不可撼动。此凝聚守住了整座谷，亦可能在某一刻，使谷中人再听不见谷外之哭声。蓝砚尝于集日举一事问众：港中有人饿死，我等管不管。满场无声。她又问一遍，仍无声。乃记之于册，不评一字。"
 CYG_Combo_Twin_High:"水土两旺"
 CYG_Combo_Twin_High_desc:"田里有水，谷中有人。此为沉玉谷最像故乡之一段日子，亦是最短之一段。蓝砚自知其短，故每日多走一趟田埂，看水看苗，看得比从前细。有人问何故，她曰：「好日子须多看几眼。」"
 CYG_Combo_Twin_Low:"山穷水尽"
 CYG_Combo_Twin_Low_desc:"地枯，人心亦散。留守者愈少，藤篱之后，乃一院无人收拾之枯叶。某夜大雨，塌三间屋，无一人出门看。次日蓝砚独自去扒瓦砾，扒至日中，来帮手者只二人。她不曾抬头，只把瓦一片一片码齐。塌屋之处后为沉玉谷社田，瓦码于埂，高及膝，以为界。"
 CYG_Combo_A_High:"丰土移心"
 CYG_Combo_A_High_desc:"水草丰足，守谷之心却淡了。吃饱之后，人始想山外热闹。谷口那条路上，背行囊者一年比一年多，问其何往，皆曰去看看。蓝砚送之至路口，不进一言，只把一包干粮塞过去。她立于路口，看至人不见方回。路口在琼玑野西，立一木，往来者自刻一痕，岁末计之。"
 CYG_Combo_B_High:"人心守土"
 CYG_Combo_B_High_desc:"地力将尽，人心却未散。大家把最后一点粮分着吃，也把最后一口气留着守田埂。分粮那日，无人争多寡，只争谁少拿一升。蓝砚立在仓门口，看众人推让，久不语，末乃曰：「此谷尚可救。」翘英庄仓门内侧钉一木牌，书存粮之数，十日一更。"

 #################### 蓝砚 · 沉玉谷 · 战后 ####################
 CYG_PW_Dawn_of_Soil:"倒土入海试咸淡"
 CYG_PW_Dawn_of_Soil_desc:"入港之次日，蓝砚不受贺。携谷中土一囊，蹲于废码头，倾土入海，视其散。从者默然。良久，曰：「先勿言胜。此城之土，比吾所想者硬且咸。」欲种活之，须先知其坏在何处。言毕，取空囊折好，纳于怀。有舟人隔水望之，不识其人，但见一妇蹲于断桩之侧，久不去。断桩在沉玉谷旧埠，桩上缆痕三道，水痕及半。"
 CYG_PW_Clear_the_Silt:"下渠掏淤以身先"
 CYG_PW_Clear_the_Silt_desc:"渠为矿渣乱石所塞，已数年。淘淤之日，蓝砚先下，立污水中，一寸一寸掏之。岸上有人掩鼻。她仰视曰：「尔嫌臭，是犹立岸上。待尔渴时，勿立岸上。」其人默然，解衣下水。是日淘三丈，明日五丈。月余，渠通，水声复闻。有小儿立渠边听之，曰：「此声似何处曾闻。」所通之渠连沉玉谷旧堰，堰上石螭首，水出经其口。"
 CYG_PW_Rebuild_the_Terraces:"老者说埂少者垒"
 CYG_PW_Rebuild_the_Terraces_desc:"复梯田先垒埂。谷中老人记得每一道埂之走向，少者有气力。蓝砚令一对一：一老者说，一少者垒。有少者垒歪，老者骂之。蓝砚止之曰：「彼未听清尔所指何垄。」乃令易位：少者垒，老者说。第二遍，埂直。老者视之，曰：「早如此，何须骂。」重垒之埂在琼玑野北坡，埂石取自塌墙，石上字朝内。"
 CYG_PW_Plant_the_Bare_Slopes:"立封山令收斧斤"
 CYG_PW_Plant_the_Bare_Slopes_desc:"封山令下之日，蓝砚尽收谷中斧斤，携持斧者至一秃坡。坡上惟余树桩，风过，砂击人面。她令众人立定，曰：「尔且站一站，看此风如何入骨。」斫树之账，不必还钱。养活这些苗，便算还清。众人立而不动，衣角猎猎。有一人忽蹲下，以手拨桩边土，土干如灰。所植之苗育于翘英庄苗圃，一苗一囊，囊以旧布为之。"
 CYG_PW_Green_the_Watershed:"名其岭曰青源"
 CYG_PW_Green_the_Watershed_desc:"蓝砚名上游分水之岭曰青源，立一规：凡于岭上动土者，先须下游三村社首肯。港中官曰：「此不合章程。」蓝砚曰：「章程人所作，水自流。君欲挖，先令下游之人来与君言，不必吾言。」官默算半晌，曰：「容归议之。」归后月余无报。谷中人问：「彼不复来乎。」蓝砚曰：「不来，即已答。」下游之村在璃沙郊，村老持册来会，册上记水期三十年。"
 CYG_PW_The_Valley_Granary:"寡妇半斗自书名"
 CYG_PW_The_Valley_Granary_desc:"共仓开仓之日，蓝砚设长桌一张，令各户自报其数，多寡不问。一寡妇只交半斗米，低首不敢视人。蓝砚推册至其前，曰：「尔自书。」妇曰：「吾不识字。」蓝砚乃执其手，一笔一笔书之。书毕，寡妇蹲于桌侧，以袖掩面，久不起。其后每岁开仓，此妇必先至，所交仍半斗，而册上其名最端。谷仓在翘英庄社祠旁，其册以麻线装，十年一换，换者存旧。"
 CYG_PW_The_Register_of_Fields:"田册只记种者名"
 CYG_PW_The_Register_of_Fields_desc:"田册通篇只记二事：谁种，种何物。有吏劝曰：「宜记细些，他日可征税。」蓝砚摇首曰：「此册非为税，为认人。」一老农翻至己行，视之久，曰：「吾一生未曾在册上占得如此清楚一行。」蓝砚曰：「占清便好。自今而后，有人动尔田，尔持此册与之言。」田册每社一本，皮以厚纸，藏于遗珑埠公所，火烛之防甚严。"
 CYG_PW_The_Grass_Schools:"树底开课先认草"
 CYG_PW_The_Grass_Schools_desc:"学堂设于老树之下，无书。第一课认草。蓝砚令诸童各于坡上拔三株异草，摆成一列，逐一讲之。一童误拔药草，以为野草。蓝砚不责，只曰：「今日尔认错一株，他日或救错一人。」童子面赤，取草复埋土中，埋之甚深，以足踏实，复以手按之者再。草课设于灵濛山南诸坡，春认新芽，秋认籽实，冬则观根。"
 CYG_PW_The_Herb_Lectern:"药婆说方伤工记"
 CYG_PW_The_Herb_Lectern_desc:"讲堂初开，生徒中有数人本为矿上伤工。蓝砚请老药婆数人至堂上说方，生徒逐句录之。一婆说至半，忘其下文，急，以手拍膝。一生徒忽问：「婆婆腕上那道疤，可是当年治何症所留。」婆怔住，良久，曰：「是矣。」遂尽忆其方。蓝砚立门外听之，终不入。讲堂在翘英庄旧茶亭，亭中一案，案上药臼一具，先讲而后用。"
 CYG_PW_Clean_Stoves:"炉膛加高烟绕弯"
 CYG_PW_Clean_Stoves_desc:"净炉者，谷中先做之样：炉膛加高，烟道绕两道弯，灰沉于底，烟遂淡。匠人做成，舁至港中示炉主。炉主笑曰：「太费事。」蓝砚曰：「尔多烧之煤，够吾一村过冬。尔嫌费事，是烟未落尔院中。」言时，她正立炉主家井边，井水浮黑沫，风过，沫聚而复散。改炉之式后传至遗珑埠，埠中炉户十改其三，烟淡而火不衰。"
 CYG_PW_The_Slow_Road:"新路绕开三处泉"
 CYG_PW_The_Slow_Road_desc:"缓路修得慢，亦修得弯，绕开老林与泉眼数处。有人嫌其误生意。蓝砚携之走新路三日，途中见野鹿饮水之洼三处。她指之曰：「尔省两日，是填此三洼；尔多走两日，是为此三洼留地。尔自算，孰划算。」其人一路无言。至第三日暮，忽曰：「此路可再弯些。」新路绕琼玑野而行，多二里，路上三洼，洼水不涸，鹿迹岁岁新。"
 CYG_PW_Seed_Bank:"以粮换种入谷库"
 CYG_PW_Seed_Bank_desc:"谷种之库，收各家末一斗种，按品分装，登记于册。一老人抱种不肯交，曰：「此祖上所传。」蓝砚不催，取自家口粮半袋置其足边，曰：「换。种入库，开春还尔；此粮不必还。」老人视粮，复视怀中种，久乃递出，手颤不止。入库时，执事者问其种何名。老人曰：「无名，吾家叫它红脚。」种库凿于灵濛山阴岩腹，悬谷防潮，凡三百坛，各系一签。"
 CYG_PW_The_Water_Mills:"溪上架碓不烧煤"
 CYG_PW_The_Water_Mills_desc:"水碓者，谷中第一件不必烧煤之器。蓝砚令人架十余具于山溪，借水舂米、捣药、纺线。有人议曰：「宜移至港边，可做大。」蓝砚问：「移去，水自何来。」曰：「烧煤抽水。」蓝砚笑曰：「那就非水碓，是又一座炉。」遂令溪边更添二具。是冬水落，碓声不歇，谷中人夜闻之，以为雨。水碓列于沉玉谷溪上，凡五具，碓声相错，夜如更漏。"
 CYG_PW_Envoys_of_the_Soil:"使者持种与短信"
 CYG_PW_Envoys_of_the_Soil_desc:"内战甫停，蓝砚遣使出门，所携者谷中新收之种一袋，书一封。书只一句：「水土之账，不认地界。」或劝曰：「宜多备厚礼。」蓝砚曰：「厚礼是求人，种子是问一句愿同种否。愿否，问不出，须看其答。」半月后，回书陆续至，长者数纸，短者一行。蓝砚尽阅之，不以长短为意。所遣使者凡八，行碧水原诸村，携种不携礼，归则各述所闻。"
 CYG_PW_With_Keqing:"玉衡回信谈田垄"
 CYG_PW_With_Keqing_desc:"玉衡回书至，通篇所言者，佃户如何自耕，田亩如何分。蓝砚读三遍，纳书于盛种之木箱。使者不解，问：「何不置于公案。」蓝砚曰：「此书中语，是吾识得之字。人肯坐下与吾算田垄，吾便置之于近田处。」言毕，令回赠新谷一斗。使者出门时，见箱中种与书相杂，不能辨。刻晴遣使至翘英庄，与谷人共算田册，册成，两署其尾。"
 CYG_PW_With_Ningguang:"群玉问谷值几银"
 CYG_PW_With_Ningguang_desc:"群玉阁问法，最似买卖：沉玉谷一岁出粮几何，值银几何。蓝砚令还一句：「吾辈量土，不量钱。」使者持此语归。凝光闻之，默然良久，末乃曰：「有意思。」后群玉密札中多一行批注：「沉玉谷之患，不在其兵，在其不可定价。」蓝砚闻之，但笑，取案上算盘拨一子，复止。"
 CYG_PW_With_Ganyu:"月海附来粮政记"
 CYG_PW_With_Ganyu_desc:"月海亭是唯一细读水土账之处。甘雨且附自辑粮政纪要一册。蓝砚反复观之，末曰：「看来世间终有人肯蹲下，看一株草。」即令回赠谷种一袋，附言一句：「君若来，谷中留一碗热茶。」书送出后，她立于仓门良久。执事请其入，曰：「再候一刻。」候至日昃，乃入。"
 CYG_PW_With_Shenhe:"绝云答以不相干"
 CYG_PW_With_Shenhe_desc:"绝云间之答最冷：山有山规，谷有谷法，互不相干。蓝砚读毕，反笑。曰：「如此最好。吾最畏口称相助之人。」助来助去，谷遂为彼所有。乃取那片薄绢夹入旧账，转身治农事，若谷外一桩闲事。是夜有客问：「仙人不助，可惧否。」曰：「不助则可测，助则不可测。」"
 CYG_PW_With_Childe:"云来索港与航路"
 CYG_PW_With_Childe_desc:"云来海使者至，开口即谈港口、航路、租约。蓝砚未待其毕，命人引之出。事后语人曰：「彼要岭，要港，要一切可变钱之物。吾只怕一事：彼他日欲得谷中之水。至那一日，吾一捧土亦不予。」使者以此语归报，达达利亚闻之，默然久之，乃曰：「此妇不可与言利。」"
 CYG_PW_The_Green_Convention:"四国各携卷来会"
 CYG_PW_The_Green_Convention_desc:"青之共约议成之日，须弥雨林学者、枫丹水利之官、蒙德好自然者，各携卷至。蓝砚不设席，只拼四桌为一，令取谷中最丑之水土账摊于正中。曰：「吾账最丑，先摊吾账。」谁见其谬，即指之。众初有矜色，既而争指。散时，四桌上纸已高叠，无人先取其一。会设于遗珑埠船坞，四方来者三十余人，水账摊于舱板之上。"
 CYG_PW_The_Empty_Altar:"神位空处立良久"
 CYG_PW_The_Empty_Altar_desc:"帝君神位既空，蓝砚入港，于殿前立片刻。殿中无香火，惟数童子伏门槛弄石子。从者问：「可上一炷香否。」蓝砚摇首曰：「香为活人而焚，不为神。」又曰：「吾辈不求神来认，只求此殿之风，勿折外头新栽之苗。」言毕，绕神位而过，往殿后看那片荒地，以足试其土软硬。旧殿在灵濛山半，殿空而门不闭，阶前苗圃四畦，岁岁自青。"
 CYG_PW_The_Order_of_Heaven_and_Earth:"抄物候成一小册"
 CYG_PW_The_Order_of_Heaven_and_Earth_desc:"蓝砚令抄谷中历年所记物候为一册：「某日溪涨，某日花落，某日雪至谷口。」抄毕，她于册末添一行小字：「天地自有其序，不待神证。」有人劝勿书，恐招祸。曰：「吾所书者，溪水涨落之期，非骂谁人也。果有人来问，吾便以此册示之。」其册后为谷中童子传抄，误字累累，而物候不误。物候之册以翘英庄物产为据，凡三条：冰、芽、雁，各有其期。"
 CYG_PW_No_God_Need_Certify:"指坡上自生之草"
 CYG_PW_No_God_Need_Certify_desc:"有人问蓝砚：不敬神明，此天下何以立。蓝砚引之至坡上，指自生之草。草无人种，无人拜，岁岁自长。曰：「彼不长与谁看，只长与自己。」人亦当如此。若须人认证方敢活，则一生皆活与他人之眼。其人立坡上，视草良久，忽曰：「此草何名。」蓝砚曰：「无名。无名亦长。」其坡在琼玑野西，草深没胫，童子牧羊其间，不焚香，不立祠。"
 CYG_PW_The_Wound_of_the_Earth:"以手量裂口浅深"
 CYG_PW_The_Wound_of_the_Earth_desc:"层岩裂口，蓝砚曾往观之。蹲于其侧，不语，以手量其阔，复量其深，记于随身之册。匠人问：「算何事。」曰：「算此地受伤几许。」匠人曰：「此伤治不好。」蓝砚曰：「治不好亦须治。」只糊一层泥，糊毕其下仍烂。归后，即调谷中草医同往。"
 CYG_PW_Heal_Not_Plug:"创口露着痂才实"
 CYG_PW_Heal_Not_Plug_desc:"谷中老辈有言：「创口须露，痂乃结实；捂之太密，反烂于内。」蓝砚以此语告诸匠。曰：「裂口是大地之伤。尔岁岁堵之，彼岁岁裂之。」须令其自长一层新土，方谓之治。诸匠相顾，一老匠先点首，曰：「吾堵三十年，未见一岁不裂。」遂取锹，先去其糊泥。所治之裂在沉玉谷北坡，去泥之后，三岁而新土自合。"
 CYG_PW_The_Abyss_Springs:"裂口边养出活水"
 CYG_PW_The_Abyss_Springs_desc:"渊泉者，治裂之后，裂口旁所养之第一眼活水。水清而浅，不多，然终岁不涸。有人欲筑墙围之，恐为人所见。蓝砚止之曰：「筑墙则水死。」令其敞着，谁来打水皆可。乃立木牌一块于泉侧，书曰：「此处可打水，不可洗染。」牌后三易，字仍是此几个。泉出层岩巨渊余脉，水温而微涩，谷人取饮，惟禁涤衣。"
 CYG_PW_A_Sky_Without_A_Seal:"遣使上天一问之"
 CYG_PW_A_Sky_Without_A_Seal_desc:"蓝砚遣使往天空岛，携书一封。书只二句：「天理若在，请现身一谈；若不在，请许吾辈自走。」使去三月，归时两手空空，言至其下，云不开，呼之无应。蓝砚于回执末批二字：「已知。」左右问：「既知其无应，复遣乎。」曰：「遣。不为求答，为使后世知吾辈曾问。」回执之纸存于翘英庄社祠，凡九纸，皆无印，末有蓝砚亲批。"
 CYG_PW_The_Terrace_Watch:"竹矛一枝授田夫"
 CYG_PW_The_Terrace_Watch_desc:"护田队成军之日，谷中人所执者，农具、猎弓、削尖之竹。无甲，无饷。蓝砚逐人授竹矛一枝。授至末一人，止而不授，曰：「此非令尔杀人。此令尔立自家田边，使欲动手者先自掂量：此土有人在守。」其人受矛，以袖拭其柄，曰：「如此，吾守吾那一垄。」护田队哨位在琼玑野四角，各一棚，棚以茅覆，内有草荐。"
 CYG_PW_The_Spreading_Watch:"牧童报信于隘口"
 CYG_PW_The_Spreading_Watch_desc:"蔓哨无名册，不列营。牧童、采药者、樵妇，本日日行山路，只多一句嘱：「多看一眼。」一采药童子于隘口见生人一队，奔归报信，谷中遂得从容。事后众人夸其机警，童子曰：「吾日日走那条路，多出几个脚印，吾皆识得。」蓝砚闻之，令人记其名于册，童子不肯，曰：「名不必记，路记着。」传信之法沿沉玉谷三径，隘口举烟为号，一炷警，二炷集。"
 CYG_PW_The_Poison_Patrol:"夜截倒渣数辆车"
 CYG_PW_The_Poison_Patrol_desc:"防污巡队所守者，一条水线。上游何处矿口夜排，哪条渠水色不对，皆记之。一夜，巡队截得倒渣之车数辆。车上人出高价求放。少年队长只是摇首，曰：「尔所给之钱，买不得吾母所饮那口井。」次日，车号抄于谷口布告之上。是日观者塞途，有童子以指逐字认之。巡渠之队行璃沙郊水道，凡十二里，夜则秉炬，渣倾处皆插标。"
 CYG_PW_No_Standing_Army:"农忙散伍农闲操"
 CYG_PW_No_Standing_Army_desc:"蓝砚不主养常备之兵。其言曰：「常备之兵，久之只认发饷之人，不认田。」谷中真能战者，仍是种田人。乃令各村护田队轮训，农忙则散，农闲则操。有人忧曰：「如此恐不能打硬仗。」蓝砚曰：「未必。」真至要紧时，一队知身后是哪块田者，比甚么都顶用。轮训于沉玉谷坡场，冬操二旬，操毕犁未冻者三亩乃散。"
 CYG_PW_Bamboo_Spears_and_Notices:"悬矛树上示众"
 CYG_PW_Bamboo_Spears_and_Notices_desc:"蓝砚定一规：谷口立布告，竹矛只对外，不对内。谷中人有争，皆至村社大会言之，不许动家伙。有二人因争水相殴，各罚为对方挑水一月。蓝砚取其所用二矛，悬于谷口树上，悬一季。有人问：「悬之何为。」曰：「悬着，令过者皆想一想。」至冬，矛上生锈，无人取。布告悬于遗珑埠埠头，纸为葛皮所制，雨后复晒，字仍可读。"
 CYG_PW_The_Great_Debate_of_the_Valley:"老树下两班争"
 CYG_PW_The_Great_Debate_of_the_Valley_desc:"一统之后，谷中分二说：一说当以水土之规推于全璃月，一说当守山谷，勿问城中事。蓝砚令二说之人同坐一老树下，任其自争。争三日，声皆哑，而无定论。散时，蓝砚只曰：「争不完亦好。」真争完之日，才是无人敢开口之日。言毕，取壶为众人斟水，壶已空，仍斟之者再。争之所在大树下，即翘英庄社树，树围三抱，根出地面如板。"
 CYG_PW_A_Soil_Pact_to_the_Whole_Land:"抄谷约遍贴全境"
 CYG_PW_A_Soil_Pact_to_the_Whole_Land_desc:"推行之第一步，是抄谷中禁伐、护泉、公仓数条为告示，贴于璃月各处。有人问：「此管用否。」蓝砚曰：「先贴出再说。」至少令每一尚在斫树者知，有此事，有人不以为然。头批告示贴出后，城中有老者专程至谷，多索数张，曰：「吾那一巷，墙多而空。」告示之纸出自遗珑埠纸坊，墨中掺桐油，贴墙历雨不漫。"
 CYG_PW_A_Slow_the_Whole_Harbor:"开工先问水土"
 CYG_PW_A_Slow_the_Whole_Harbor_desc:"蓝砚所提第一事至简：凡开工，先问一句，此地之水土受得住否。此规一出，即得罪多人。有大商号当众讥之。蓝砚不与之辩，只请其往港边看一片已填之老滩。其人见滩底埋着旧船板，半晌无言。归途乃曰：「原来此处旧是海。」所填老滩在云来海北岸，滩上旧船板，潮退时露出，长可三丈。"
 CYG_PW_A_Water_and_Rainforest:"图志与测水并案"
 CYG_PW_A_Water_and_Rainforest_desc:"须弥学者携雨林图志数箱，枫丹水利之官携测水之法。蓝砚令二拨人共坐，出谷中最丑之水土账。曰：「吾账最丑，先摊吾账。」学者指图曰：「此处与尔谷坡向相同。」水利之官即算一夜。天明时，数纸拼于一处，缝处参差，而水脉相连。所拼之图后悬于遗珑埠学舍，图中水脉一红线，自谷直贯至港。"
 CYG_PW_A_The_Wetland_Academy:"湿地开舍三方讲"
 CYG_PW_A_The_Wetland_Academy_desc:"泽畔学舍开于谷外第一处湿地。蓝砚请须弥学者讲雨林活法，请枫丹水利官教测水，亦请谷中老农讲认土。第一课，三方各说其说，无人能懂他人。蓝砚令以三图并悬于壁，曰：「先看，不必急着懂。」三月后，有生徒自画第四图，悬于三图之侧。学舍设于渌华池畔，三方之师各居一斋，课期月一聚。"
 CYG_PW_A_The_Shared_Fields:"荒田归社按户分"
 CYG_PW_A_The_Shared_Fields_desc:"共治之田，以谷中公田之法，试于城郊数处荒地。田归村社共有，按户分种，收成按劳而分。第一年即有争：一户多占半垄，为人当面揭之。蓝砚不偏一方，只令村社大会公议：「多占者退还，并为被占之家耕作一季。」曰：「有私心无妨，勿遮得住便好。」其田在琼玑野北，凡二百亩，埂以石，石取自废渠。"
 CYG_PW_A_Advise_the_Halls:"老农入厅说凿井"
 CYG_PW_A_Advise_the_Halls_desc:"谷中村社推数人入议事厅，与议。彼等不工言辞，多时只坐而听。一日，众争一笔开销，一老农忽曰：「此钱，够吾那一带凿二十口井。」满堂为之一静。那笔开销后削其半，移去凿井。散会，老农立于门外良久。有人问：「何不早言。」曰：「吾在等有人问。」听政之席设于玉京台廊下，老农之位在末，茶一盏，无座牌。"
 CYG_PW_A_The_Price_of_Slowness:"两本账并置案上"
 CYG_PW_A_The_Price_of_Slowness_desc:"慢自有其价。头一年，璃月新港比邻邦晚开两月，边上数条商路亦为人先占。议事厅中有人当面责之。蓝砚不辩，只取两册并置：一册记所省之工期，一册记所保之水源与林。曰：「诸君看哪册厚。」众人传观一阵，无人再言。散后，有年少议者独留，取薄者再阅。所保之林在灵濛山北，工期之册薄，林册之册厚三倍。"
 CYG_PW_A_The_Land_and_the_Soil_Law:"旧律与谷约对读"
 CYG_PW_A_The_Land_and_the_Soil_Law_desc:"山河共治写成之日，蓝砚取水土之约与璃月旧律数部，摊于同一长桌，逐条比对。合者留，相冲者当面说清。说至末一条，她停一停，曰：「此条是此地自定。」谁欲改，先来问此地种田之人。言毕，取麻绳将两卷文书捆好，结三重，以指按之。比对之会长设遗珑埠，凡九日，桌上律卷相叠，朱笔勾其冲处。"
 CYG_PW_B_Back_to_the_Valley:"交还港务守己土"
 CYG_PW_B_Back_to_the_Valley_desc:"退回山谷之说，欲以港中诸事还诸旧人，谷中只守自家水土。蓝砚初不谓然，曰：「此是甩手。」发此议者问曰：「吾辈入城，城中人便肯听吾辈乎。」她答不上来。散会之日，她独上城墙，立至天黑。后乃曰：「那就试试。试而坏，亦是吾辈自认。」归谷之议起于翘英庄夜会，议毕各归其社，城中之职概辞。"
 CYG_PW_B_The_Village_League:"十余村社共一盟"
 CYG_PW_B_The_Village_League_desc:"村社联合，以谷中十余村社，合迁入之流民聚落，共书一盟。谁家遭灾，他家出人出力；谁家开渠，上下游同议。一老人不肯按印，曰：「吾祖上未曾入何盟。」蓝砚不逼，只将盟约念与之听。念至遭灾相助一条，老人问：「去年吾家缺粮，是尔等所凑乎。」蓝砚曰：「是。」老人乃按印。盟约之印凡二十三，印色皆朱，藏于琼玑野社祠梁上木匣。"
 CYG_PW_B_Refuse_the_Machine:"拒机器于谷门外"
 CYG_PW_B_Refuse_the_Machine_desc:"蓝砚所拒者，乃那种非聚人于一处、非引水于一处不可之大器。谷中水碓、水碾，她素以为善。有港中匠人劝她购新矿井机械，一日可顶谷中一月。蓝砚引之去看为矿渣填平之旧溪，曰：「彼一日顶吾一月，亦一日填吾一溪。」匠人不能答，俯视溪中残石。旧溪在层岩巨渊北麓，溪石皆煤渣所覆，三年犹不可耕。"
 CYG_PW_B_No_Banner_No_Lord:"村约首行字最大"
 CYG_PW_B_No_Banner_No_Lord_desc:"不奉王令，其言更直：谷中不受任何一方号令，惟受自定之规。有人劝蓝砚留些余地，以免招祸。曰：「余地吾辈早留够。自帝君崩至今日，让过多少回，尔心里有数。」让至尽头，谷中连一口泉亦保不住。乃以此语书于村约首行，字比别处大一圈，墨亦重。村约首行大字，后摹于沉玉谷口石壁，笔画深半寸。"
 CYG_PW_B_The_Selfsufficient_Valley:"种粮织布不求余"
 CYG_PW_B_The_Selfsufficient_Valley_desc:"自足之谷者，令谷中少赖外粮外器。种粮、织布、斫木、打铁，够用即止，不求有余。有人嫌其太穷。蓝砚曰：「有余则须易钱，易钱则须有人来收，有人来收则须看人颜色。」看颜色看惯，田便保不住。言毕，俯身扶正一株倒伏之稻，以土培其根，按之再四。谷中铁器出自层岩旧矿，凡农具四百件，件件有号，坏则回收。"
 CYG_PW_B_The_Valley_Border:"挖土见石依水定"
 CYG_PW_B_The_Valley_Border_desc:"谷界立时，不砌墙。蓝砚先令人书一单：何坡归谷中管，何道共行，何水上下游共守。乃请两边老人同走一遍。行至一争多年之山坳，双方各执一词。蓝砚令人挖开一层土，露出石层，曰：「水自这层石上流下，便依水定界。」两边老人俯视良久，皆点首。所定之界在灵濛山坳，界桩三，桩刻水眼之位，枯水时自见。"
 CYG_PW_B_Bread_and_Songs:"先支大锅后开唱"
 CYG_PW_B_Bread_and_Songs_desc:"馒头与歌，谷中最实之二物。蓝砚曰：「腹空者听不进歌，只会唱者亦填不饱腹。」谷中遂有一不成文之规：逢集日，先支大锅煮饭，任人来食一碗；食毕，歌者乃开唱。初时食者多，听者少。过二年，食者少，围歌者反多。歌者不解，问蓝砚。曰：「腹饱之人，才听得进。」大锅设于翘英庄集场，锅口三尺，米由各户轮日捐，一日一户。"
 CYG_PW_B_The_Free_Communes:"收旗还地各归村"
 CYG_PW_B_The_Free_Communes_desc:"归田自治立起之日，谷中十余村社，各收其绣叶之旗。蓝砚曰：「旗不必挂，地在便可。」她将末一事交代毕，即归谷中。有人问：「今后谷中事，寻谁。」曰：「寻尔等自议。若哪家遭难，先看邻家锅中有粮否。」她行时，谷口老树方抽新芽。绣叶之旗凡七面，分藏沉玉谷诸社，非大事不出，出则七旗齐悬。"
 CYG_PW_The_Singer_of_the_Valley:"歌者入城唱旧事"
 CYG_PW_The_Singer_of_the_Valley_desc:"歌者后亦入城。所唱仍是旧事：泉、饼、填坑之老人、挑水之罚。城人初听不解，问：「此等琐事，亦可入曲乎。」歌者曰：「尔所谓史，记谁为帝，谁为将。吾所唱者，记谁挑过水，谁分过饼。」问者不语。是夜座中有人掩面，歌者视之，不点名，只续唱。所唱新词传至遗珑埠，埠中船工和之，曲调仍依谷中旧腔。"
 CYG_PW_The_Old_Mine_People:"老人上山填旧坑"
 CYG_PW_The_Old_Mine_People_desc:"旧矿之人入城之后，仍每晨上山。所携者锹与布袋，袋中盛碎石。有人问一老人：尔填此坑，何年可满。老人曰：「吾死亦填不满。」又问：「既填不满，何为日日来。」老人曰：「吾不为此坑，为此手。」言毕，以掌摩锹柄，柄已磨得发亮。日暮下山，其影甚长，与坑沿相接。填坑之处后植松于层岩北坡，松成行时，填者已半凋零。"
 CYG_PW_Liyue_New_Soil:"取旧告示置卷首"
 CYG_PW_Liyue_New_Soil_desc:"璃月新土四字，是二路合为一处之后，蓝砚才说出口者。是日令将二路文书尽搬入仓。翻检之际，她停于一纸极旧者前，乃谷中最早贴出之告示，边角已为虫蛀。她拣出之，置诸最上，曰：「留此一张。以后之账，皆须与此比。」执事者问：「比甚么。」曰：「比口气。」文书之仓在翘英庄社祠东厢，凡十二架，旧告示居其顶。"
 CYG_PW_The_Soil_Remembers:"手插入田埂之土"
 CYG_PW_The_Soil_Remembers_desc:"土记得，谷中一句老话。蓝砚晚年常至最早那片梯田边坐，一坐半日，亦无所为。有人问：「看甚么。」曰：「看土。尔翻松过它，它记得；尔伤过它，它亦记得。人去，它尚替尔记着。」言毕，以手插入田埂之土，抓一掬，缓缓松开，土自指缝落，落尽乃起。所看之田在琼玑野北，埂上旧痕三层，最下一层已没于土。"
 CYG_PW_A_Hundred_Years_of_Green:"一人一株付童子"
 CYG_PW_A_Hundred_Years_of_Green_desc:"百年之绿，是蓝砚对后人之交代。曰：「吾辈未必得见那片林长成。然只要种下去，百年之后，终有人立于树下乘凉。」有人问：「那时谁还记得是谁所种。」曰：「不必记得，树记得便可。」乃以末批树苗付谷中童子，一人一株。有童子欲代其弟领取，蓝砚不许，曰：「令其自来。」所植之松在灵濛山阴，今岁苗高及膝，行距如军阵，望之甚齐。"

 CYG_postwar_category:"沉玉新生"
 CYG_postwar_category_desc:"硝烟既散，港商一系专以经营为务。重开码头、平抑物价、招徕客商，务使榷场市集复其喧闹。生意回到正轨，日子才算复常，璃月港亦才有往日气象。市面一热，各家各户之心便定。"
 CYG_decision_pw_clear_spring:"淘泉护源"
 CYG_decision_pw_clear_spring_desc:"淘泉，一手掏泥，一手摸良心。淤塞之眼要通，烂掉之渠要砌，做此活者，十指无一处完好。蓝砚曰：「水有命。汝待它好，它才肯回来。」此语，比刻在石上之律皆灵。泉眼在灵濛山裂口边，水清而浅，冬不冻，大旱不竭。"
 CYG_decision_pw_sow_green:"撒青于荒"
 CYG_decision_pw_sow_green_desc:"撒青最亏本：种子撒下，头三年不见收成，或旱死，或虫食殆尽。谷里人人皆晓，不种，此地永黄。蓝砚曰：「吾辈一世，或吃不上自种之粮。然种子入土，三年之后，吾辈之子便吃得上。以此易彼，不为亏。」坡在沉玉谷北，新复之地，绿薄色浅，如以淡墨一遍遍染成。"
 CYG_decision_pw_ban_the_axe:"禁斧巡山"
 CYG_decision_pw_ban_the_axe_desc:"巡山者识得每一棵老树，亦识得每一个不该持斧之人。捉得，不罚钱，只罚种：砍一棵，种十棵，秋后逐株点数。蓝砚曰：「罚钱，其不痛；罚其亲手种回，方记得手上有泥。」斧禁之牌立于沉玉谷口，牌上刻字，字以刀刻，深可容指。"
 CYG_decision_pw_communal_meal:"一锅共食"
 CYG_decision_pw_communal_meal_desc:"共炊一大锅饭，柴各家所凑，米各家所出，煮熟则众人列队而盛，不论出力多寡，皆有一碗。或谓此不公。蓝砚答曰：「使明日犹能立于此地之人皆得一饭，此即吾辈所谓公。出力多者不怨，出力少者不惭，则一锅之饭可久。」饭盛于粗碗，坐于翘英庄社仓前石上，碗边有缺口，须侧转。"
 CYG_decision_pw_herb_lesson:"方出于谷"
 CYG_decision_pw_herb_lesson_desc:"以祖传草方授外人，谷中老人闻之，皆谓败家。蓝砚偏要授，曰：「方藏汝手，只救一人；授出去，救一坡人。汝一世本事，难道只值一条命。」老人无言，末乃自取一册，抄之。抄毕以册授孙，曰：「此册不是汝家之物了。」老人无言，末乃自取一册，抄之。授方之课在翘英庄老树下，无屋无案，以石为座，以沙为纸。"
 CYG_decision_pw_shelter_the_weak:"先递热茶"
 CYG_decision_pw_shelter_the_weak_desc:"谷中有一条不成文之规：先递一碗热茶，再谈别事。此规所活者，不止流民。盖每一个被救过一次之人，后来多成最不肯离谷之人。蓝砚曰：「一碗茶不值钱，值钱者在先递。」热茶煮于遗珑埠谷口大壶，壶置灶上，终日不撤，来者先饮。"
 CYG_decision_pw_patrol_paths:"牧童看路"
 CYG_decision_pw_patrol_paths_desc:"巡径者非兵，乃本须行此路之牧童与采药人。不领军饷，不入名册，惟于路过时多看两眼。蓝砚曰：「此路吾辈比旁人皆熟。熟至哪一日路心陷一坑，哪一夜崖上坠一石，吾辈先觉，不待人报。」径在灵濛山，多碎石，雨后留印，印深者负物，浅者空行。"
 CYG_decision_pw_dig_well:"凿井求一"
 CYG_decision_pw_dig_well_desc:"凿井所靠者，运气与耐心。有时凿至底而仍干，便须另择一地，从头再来。蓝砚曰：「吾辈一世，或凿十口井，九口皆干。然只要一口出水，此谷之人便皆活得下去。井之一事，成则不言，不成则不言。」凿井之处在翘英庄东，土厚色黑，谷人谓之老土。"
 CYG_decision_pw_envoy_keqing:"遣使玉衡"
 CYG_decision_pw_envoy_keqing_desc:"玉衡回信来得快，通篇所谈，皆土地如何分。蓝砚读三遍，忽觉欲笑，曰：「原来真有人，肯认认真真，把沉玉谷那点水土之账，当作一件正事来谈。」遂于信末添一行：「可分。然地不换主。」"
 CYG_decision_pw_envoy_ningguang:"遣使群玉阁"
 CYG_decision_pw_envoy_ningguang_desc:"群玉阁之复，最像一桩买卖：所问者，皆沉玉谷一年产粮几何、值钱几何。蓝砚命人回一句：「吾辈量土，不量钱。」使者述之，凝光默然良久，末只淡淡曰：「有意思。」"
 CYG_decision_pw_gift_seed:"赠种四方"
 CYG_decision_pw_gift_seed_desc:"赠种四方：以谷中筛出之好种，分送沿江几处遭过矿害之村。或谓此以自家之命接济外人。蓝砚曰：「种尚有余。地若都死，留种何用。」遂尽发三仓，一村一袋，袋上书名。种以布袋盛，自沉玉谷三仓发出，袋上书村名，一村一袋。"
 CYG_decision_pw_green_pact_rite:"村约自认"
 CYG_decision_pw_green_pact_rite_desc:"立村约，是谷中末一件大事。各村社推人，将历年所立之规，一条一条念出，可留者留，当改者改，念了整整两日。蓝砚曰：「此一句话：此谷自今而后，自己认自己。」村约念于翘英庄社仓前，念两日方到末条，末条言改约之法。"

 LYY_Event.13001.t:"港头试土于海水"
 LYY_Event.13001.d:"城既下，众请蓝砚入城受贺。蓝砚不许。天未明，携一囊出，径至废码头。囊中非金非帛，是谷中之土，取自上坡，色黑而松。\n她蹲于码头断石之上，解囊，以手掬土，缓缓倾入海中。土入水，先结一团，俄而散开，如烟如雾，浮于水面，随波荡去。水色由清而黄，复由黄而清。随行者数人，皆立其后，无人出声。\n蓝砚望水中土尽，乃曰：「先莫急言胜。此城之地，比吾辈所想更硬，也更咸。」要种活它，须先知它坏在何处。言毕，以海水濯手，手背搓之，泥去而指间犹存细沙。她将空囊折起，折四折，纳于怀中，起身时膝响一声。\n是日城中设宴，候至日中，主位空。有人问蓝砚何在，从者曰：「在码头。」问：「作甚。」曰：「倒土。」问者以为戏言，往视之，果见其蹲于断石上，以手掏海水底之泥。囊中非金非帛，乃沉玉谷之土，取自上坡，色黑。"
 LYY_Event.13001.a:"将此城从头再种"
 LYY_Event.13001.b:"先稳港口，后议田土"
 LYY_Event.13002.t:"下渠淘淤第一人"
 LYY_Event.13002.d:"谷中旧渠，为矿渣乱石所塞，十年不通。蓝砚下令淘渠，自往督之。至渠口，臭气上蒸，行者皆掩鼻，退三步。\n蓝砚脱履，挽裤，先下。渠中淤黑如膏，深至膝。她以短锹掘之，掘一锹，置于筐，令岸上人拽上。一筐既满，又一筐。岸上有吏，以帕掩口鼻，立于远处，曰：「此等秽事，何必亲为。」蓝砚仰头，面上沾泥，曰：「你嫌臭，是因你尚在岸上。」待你哪日渴时，便不站在岸上。吏默然，帕自手中落下，入于水中。他看了一阵，解外衣，亦下渠，立在她身后三步。蓝砚不回顾，只递过一柄锹。\n是日淘三丈。归时二人并立渠边，以清水冲足，泥水顺阶而下，黑了一道。吏曰：「明日我还来。」蓝砚曰：「不必还来。明日我在此，你若来，自会看见。」吏果来。七日之后，渠底见石。渠在沉玉谷中，为矿渣乱石所塞，十年不通，臭气上蒸。"
 LYY_Event.13002.a:"下渠淘淤，先通水路"
 LYY_Event.13002.b:"先修官道，水路少缓"
 LYY_Event.13003.t:"老指垄而少垒埂"
 LYY_Event.13003.d:"复梯田，先垒埂。埂者，田之骨也，一线之差，水便不走。谷中老者记得每一道埂之旧向，何年崩，何年补，皆在腹中；少者有力，能负石上山。\n蓝砚令二人一组，一说，一垒。老人坐于石上，以杖指曰：「此处向左三步。」少者负石而至，依言垒之。一少年垒至半，埂歪。老人以杖击地，骂曰：「瞎了眼么。」少年面赤，掷石于地。蓝砚至，止之曰：「且慢。非他垒错，乃其未曾听明汝所指为哪一垄。」汝换过来，汝垒，他说。二人易位。老人执石，手虽颤，落处极准；少年立于旁，指曰：「再上些。」第二遍，埂直如水痕。老人坐地而笑，笑至咳，少年以手拍其背。\n日暮，一段埂成。蓝砚以脚试其土，土实，曰：「此埂可三十年。」少年曰：「三十年后谁垒。」蓝砚曰：「那时汝来说，旁人来垒。」少年曰：「吾说不准。」蓝砚曰：「说不准，亦比不说好。」翘英庄埂以土垒，垒毕以石压，石为溪中圆石，大小不一。"
 LYY_Event.13003.a:"依老农口述垒埂"
 LYY_Event.13003.b:"照图纸另画新田"
 LYY_Event.13004.t:"封山令下立秃坡"
 LYY_Event.13004.d:"封山令既下，谷中凡持斧者，尽召至一坡。坡上无一木，惟树桩数百，桩面平如切，年轮历历。风自坡顶下来，砂石随之，打在脸上，痛如针刺。\n众立不动。蓝砚曰：「汝等站一站。不必言语，只站。」看这风如何进骨头。立约一炷香。有年少者耐不住，以袖遮面，为蓝砚所止，曰：「遮不得。当年汝等砍它时，它也是这样站着，无从遮。」乃指桩边细苗曰：「账不必还钱，钱汝等无。桩边这些苗，汝等养活。」活一株，抵一斧。十年之后此坡有荫，账便清。有人问：「若苗尽死。」蓝砚曰：「那就再种。」种到活为止。\n是日众人各领苗十株，携锄上山。有老者蹲于己所砍之桩前，以手摩其年轮，摩了许久，乃起身掘土。风不止，众人衣角皆向北，如一片伏草。\n三年之后，此坡有苗及膝。又七年，风过坡上，声已不同。灵濛山老者已死。其孙来看，不识其祖所砍之桩。"
 LYY_Event.13004.a:"封山十年，斧头入库"
 LYY_Event.13004.b:"缓行三载，为留余薪"
 LYY_Event.13005.t:"青源岭上立新规"
 LYY_Event.13005.d:"上游有一岭，众水所出，蓝砚名之曰青源。岭上立木一方，书三事：凡欲动土者，先告下游三村；三村不允，不得动；动而污者，罚令复土。\n港中一官至，见木，曰：「此不合章程。」山川之利，官有定法，岂村社所得自拒。蓝砚曰：「章程人所写，水自己所流。」人能改章程，改不得水往低处走。官曰：「若我执意要开。」蓝砚曰：「则先与下游之人说。说通，我不拦；说不通，我亦拦不住彼。」\n官沉吟半晌，曰：「我归而议之。」蓝砚曰：「议时，请携此三村之名。」官问何必。蓝砚曰：「以其井深于君之章程。」\n官去之后，三村各遣一人上岭，轮流守木。守者日给米一升，谷中出。一夜有雨，守者不去，以蓑衣覆木，己则立雨中至晓。官归上书，书上不报。半年后，其议自寝。岭在沉玉谷上游，众水所出，岭上多石，石缝出水。"
 LYY_Event.13005.a:"设青源之约，下游共议"
 LYY_Event.13005.b:"岭上归港府，谷中不干预"
 LYY_Event.13006.t:"共仓开而人自书"
 LYY_Event.13006.d:"共仓开日，仓前置长桌一，桌上摊册一、笔一、砚一。蓝砚令各家自报其数，交多交少皆不问，亦不校。\n至午，一寡妇至，携半斗米，以裙角裹之，置于桌角。立于桌后，低头，久不动笔。掌册者欲代书，蓝砚止之，推册与笔至其前，曰：「你自己写。」妇人曰：「我不识字。」蓝砚曰：「不识字，写个数也可。」妇人握笔，手抖，笔尖在纸上点了一点，不成字。蓝砚乃绕至其侧，以手覆其手，一笔一笔引之，写毕，乃一歪斜之数。妇人视纸上数，忽蹲于桌边，以手掩面，肩动而无声。众人皆视他处，无人近前。良久，妇人起，将米倾入仓，曰：「明年我多交些。」\n蓝砚曰：「不必多交。」你把你那亩田种好，便是多交了。妇人点头而去。册上那一行歪字，后来一直留着，无人改。有新吏欲重抄，老掌册者止之曰：「那一行，抄不得。」长桌置于翘英庄仓前，桌上摊册一、笔一、砚一，砚中墨浅。"
 LYY_Event.13006.a:"各自报数，交多交少不论"
 LYY_Event.13006.b:"按户均输，贫富一科"
 LYY_Event.13007.t:"田册只记人与禾"
 LYY_Event.13007.d:"田册之制，只记二事：一曰谁种，二曰种何。亩数不记，等则不记，赋则不记。\n有吏进言曰：「不记亩数，异日何以收税。」蓝砚摇首曰：「此册非为收税而设，为认人而设。」吏曰：「认人何用。」蓝砚曰：「人有主，田便有主。」田有主，则无人敢一夜之间划而去之。\n册既成，召各户来认。一老农至，据册寻己名，寻半晌，指一行曰：「此是我。」执册者曰：「然。」老农以指摩其名，摩了又摩，曰：「我一生，未曾于册上占过如此清楚一行字。」蓝砚在旁曰：「占清楚便好。以后谁动汝田，汝持此册与之说。彼若不认，汝便将此行字指与彼看。」\n老农曰：「我不识字。」蓝砚曰：「不识字，亦认得自己之名。彼若不认，汝便将册子摔在其面前。」众人皆笑。老农亦笑，笑毕，将册角抚平，双手奉还。翘英庄社仓之册只记二事，一曰谁种，二曰种何，亩数与赋皆不记。"
 LYY_Event.13007.a:"只登耕者与所种"
 LYY_Event.13007.b:"兼登田亩与家产"
 LYY_Event.13008.t:"老树底下第一课"
 LYY_Event.13008.d:"学堂设于老树之下。无书，无案，第一课授认草。\n蓝砚令诸童各于坡上拔草三株，不拘何种，惟须不同。拔归，列于石上，一株一株讲：此叶圆者可食，此叶尖者有毒，此有白浆者沾唇即肿，此有辛气者揉碎可止血。一童拔归三株，中有一株为药。蓝砚指之曰：「此非野草。」童曰：「其形与草无异。」蓝砚曰：「草与药，本无异。所差者，只汝认不认得。」童面赤，取草欲弃。蓝砚曰：「不必弃。」你把它栽回去，栽深些。童乃以手掘土，栽之，按土再三，按至土面平。\n蓝砚曰：「今日你认错一株，他日或救错一人。」童点头而退。是日课毕，诸童皆不肯去，围石上之草，相问其名，问答错杂。老树之影渐长，覆过石，覆过草，覆至坡下。有妇来唤儿归，儿曰：「再等一时。」妇乃立于树下，亦听一课。灵濛山课授认草，诸童各拔三株，不拘何种，惟须不同。"
 LYY_Event.13008.a:"先教认草辨土"
 LYY_Event.13008.b:"先教识字读经"
 LYY_Event.13009.t:"讲堂上药婆忘方"
 LYY_Event.13009.d:"草医讲堂开于旧仓。第一批学生二十人，中有数人本为矿上伤工，手缺指，面有疤，坐于末排。\n蓝砚请老药婆数人上堂，令其口授方子，学生执笔记之，一句一句录下。一婆说至一半，忽忘之，张口半晌，下一味终说不出。急，以手拍腿，声甚响。堂中无声。末排一伤工起曰：「婆婆莫急。汝手上那道疤，当年替谁治何病，如何落下，且想一想。」\n婆低头视手，疤在虎口，色白而长。视之久，忽曰：「是了。此伤，烫伤也。那年冬有人抱孩子来，孩子烫了半边脸，吾以獾油和此味草敷之。」味名一时忘矣，方子却尽忆。\n遂一气说完，说毕自笑，笑中带泪。学生皆低头疾书。蓝砚立于门外，自始至终未入。及课散，或问何不进去。蓝砚曰：「吾在外头，彼等说得自在。吾一进去，彼等便要说与吾听，不说与字听。」堂在翘英庄旧仓，仓中犹有谷气，梁上有旧年钉痕。"
 LYY_Event.13009.a:"录成歌诀，传于后辈"
 LYY_Event.13009.b:"方子秘藏，不教外人"
 LYY_Event.13010.t:"造净炉以示炉主"
 LYY_Event.13010.d:"谷中匠人新造一炉，炉膛加高尺余，烟道绕两道弯，灰沉于底，出口之烟淡如炊烟。造既成，舁至港中，示一炉主。\n炉主绕炉三匝，笑曰：「费这许多工，多烧这许多砖，只为一缕烟淡些。吾辈烧炉，为出铁，非为看烟。」蓝砚在旁，曰：「汝等一日多烧之煤，够吾辈一村过一冬。」费工则费工，可此炉一年省下之煤，三年便抵回工钱。炉主不答。\n蓝砚乃行至其院中，立于井边，俯视井水。水面浮黑一层，以指一划，黑散而复合。曰：「汝等嫌费事，是因烟未落在自家院里。今烟落在井里。」炉主面色变，欲言。蓝砚已转身出院。\n至门，回曰：「炉样留下，用不用，由汝。」言毕而去。是年冬，此炉主家换炉，不声张，只将旧炉拆去，砖与邻家砌墙。邻家问何以拆，曰：「烧着费煤。」灵濛山炉膛加高尺余，烟道绕两道弯，灰沉于底，烟淡如炊。"
 LYY_Event.13010.a:"以谷中炉式推及全境"
 LYY_Event.13010.b:"各炉自便，不加干涉"
 LYY_Event.13011.t:"绕老林而修缓路"
 LYY_Event.13011.d:"新路不直，多弯，绕开三处老林、五处泉眼。里程多出四十里，工期多出两月。\n有商贾怨曰：「路者，求其速也。」如此绕行，耽误生意，一年少赚多少。蓝砚曰：「我带你走一趟。」遂同行三日。第一日至一处洼地，水浅草深，有鹿三头饮水，见人举首，不奔。第二日又见一处，蹄印错杂。第三日至一处，泉自石罅出，细如线，旁有苔。蓝砚指曰：「你省下两日，是把这些洼地填作路基。」你多走两日，是留着它们。你算算，哪头划算。商贾不语，行至第三日暮，忽曰：「此路虽长，走着不累。」蓝砚曰：「正为此。」路短而陡，人畜皆伤；路长而缓，老者亦能行。你运货，我运人。货可等，人不可等。\n商贾归后，出资于路旁立石二处，刻曰：「缓行。」字不甚工，而往来者见之，皆缓。后有车夫言：「此路多走两日，骡子少死三头。」出沉玉谷之路绕三处老林、五处泉眼，里程多出四十里。"
 LYY_Event.13011.a:"路绕泉林，宁可多走两日"
 LYY_Event.13011.b:"径取捷径，先求通达"
 LYY_Event.13012.t:"谷种入库换口粮"
 LYY_Event.13012.d:"谷种之库，收各家最后一斗种，按种分装，以木牌标其名：此某村之黍，此某坡之粟，此老妇所留之豆，三十年不换种。\n一老人至，抱小囊，囊以旧衣裹之，立于库门，不进。问之，曰：「此是我家祖上传下之种。我父传我时曰：此囊在，家便在。今交出，恐不能还。」蓝砚不催。入内，取己口粮半袋，出，置于老人脚边，曰：「换。汝之种先入库，开春还汝，一粒不少。」这袋粮，不用还。老人视粮，又视怀中囊，久不能决。风起，囊口松，露出数粒，色微黄。老人以手拢之，乃递囊，手抖不已。\n蓝砚双手接，当门开囊，取数粒置于掌心，令老人看，曰：「我记下了。此是黄粟，粒小而圆，汝家传了三十年。」老人点头，泪落于囊上。蓝砚以布拭之，曰：「开春我亲自送还。」老人曰：「不必送。汝记得，便好。」种按种分装，以木牌标其名，牌上刻沉玉谷村名与坡名。"
 LYY_Event.13012.a:"留种于仓，开春分还"
 LYY_Event.13012.b:"各家自留，库中不聚"
 LYY_Event.13013.t:"溪上架碓不烧煤"
 LYY_Event.13013.d:"谷中山溪，水急而清。蓝砚令匠人架碓十余座，借水舂米、捣药、纺线。碓杵一起一落，声应山谷，昼夜不歇。自此人不再以手舂，臂不酸，米亦白。\n有商人观之，曰：「此物甚佳，何不搬至港边，多架百座，为一方之利。」蓝砚问：「搬过去，水从何来。」商人曰：「可烧煤抽水。」蓝砚笑曰：「那便不叫水碓，叫又一座炉子。」商人亦笑。笑已，复曰：「然则不搬，可惜。」蓝砚曰：「不可惜。」碓在溪上，水自流，碓自转，无人看守也转。搬到港边，须人看守，须煤烧火。看守之人要吃饭，烧之煤要钱。到头来米仍是那些米，人倒多了一堆。商人默然。\n蓝砚令匠人于溪上再添两座，仍用旧法，不用一钉之铁，皆以木榫相合。曰：「木坏换木，水改随水。此物不与人争，只与水商量。」\n是夜溪水涨，碓声愈急。守碓之童卧于石上，闻声而笑，梦里亦在数杵。灵濛山碓杵一起一落，声应山谷，昼夜不歇，闻之如节。"
 LYY_Event.13013.a:"就地添碓，借水不烧煤"
 LYY_Event.13013.b:"迁往港边，规模经营"
 LYY_Event.13014.t:"遣使赍种问四方"
 LYY_Event.13014.d:"内战方息，蓝砚遣使四人，分往四方。所携者：谷中当年新收之种一袋，书一封。书不满十字，曰：「水土之账，不认地界。」\n有幕僚曰：「四方皆大户，礼太薄。」宜备金玉、绸缎、珍器，方见诚意。蓝砚曰：「带厚礼者，求人也。」带种子者，问人一句：「愿不愿一起种。」求人者，人可拒；问人者，人须答。答得不好，亦为一答。使者问曰：「若彼闭门不见，如何。」蓝砚曰：「种留下，人回来。」种到了，话便到了。又问：「若彼收种而不回书。」曰：「那亦一种答。」\n半月之后，回书渐至。有长数尺者，有仅一行者，有以官牍格式答者，有以私笺答者。蓝砚一一读过，分类置于三只木匣：一曰可谈，一曰可待，一曰不必再问。第三匣中最薄，止二封，皆无署名。所携者沉玉谷新收之种一袋，书一封，书不满十字。"
 LYY_Event.13014.a:"携种出使，以水土为言"
 LYY_Event.13014.b:"备厚礼，先结善缘"
 LYY_Event.13015.t:"以玉衡书贮种箱"
 LYY_Event.13015.d:"玉衡回书至，通篇言佃户如何自耕，田亩如何均分，旧契如何注销，新册如何编次。无一句及于人心，亦无一句及于胜负。\n蓝砚读三遍。第一遍快，第二遍慢，第三遍读至末行，忽拍案曰：「此人真下过田。」使者问：「何以知之。」曰：「不下田者，写不出田埂当宽几许。」乃取书，以油纸裹之，纳入装谷种之木箱。使者曰：「此乃公牍，宜居公案之上。」蓝砚曰：「公案上之物，三月便旧。此箱中之物，开春要取出来种。」\n使者曰：「书中所言，与吾辈所行，亦有不合处。」蓝砚曰：「自然不合。」合者，字也。使者不解。蓝砚曰：「她写这些字，我认得。所认之字，比合意之话要紧。」\n使者还，蓝砚令人回赠新谷一斗，附书曰：「书已收，谷亦新。」明年此时，再寄。及使者出门，蓝砚又唤住，曰：「告她，田埂宽三尺，乃我量过。」帛书展之，长可三尺，字小而密，行间留白。"
 LYY_Event.13015.a:"与玉衡共商田制"
 LYY_Event.13015.b:"各守其土，互不相问"
 LYY_Event.13016.t:"群玉阁批不可定值"
 LYY_Event.13016.d:"群玉阁之书，问三事：一岁出粮几何，一岁出息几何，若归其管辖，岁可输几何。字字皆算术，无一句问人。\n蓝砚令书记作复。书记援笔，问曰：「如何答。」蓝砚曰：「只答一句。」书记乃书：「吾辈量土，不量钱。」书成，不过九字。书记曰：「太简，恐失礼。」蓝砚曰：「其要者，数也。吾只答一句，教其算不出。」使者赍复而返。\n凝光展书，视九字，不置可否，置于案侧，凡三日。第三日夜，取笔于书末批四字：「话中有物。」又于另纸书一行，付密档：沉玉谷之患，不在其兵，在其不可定价。\n此纸后为群玉阁主所阅。阅毕，以指甲刮去末三字，刮至纸破。旁有侍者见之，不敢言。是年群玉阁于谷中购粮，价高于市三成，无人知其故。有言官问之，凝光曰：「多给三成，是要买其一句话。」言官问何话。曰：「彼等肯说价，方好办。」书问三事，字字皆算术，无一句问人，末附单。"
 LYY_Event.13016.a:"以土相答，不谈价钱"
 LYY_Event.13016.b:"折价售粮，以图周转"
 LYY_Event.13017.t:"月海亭批水土账"
 LYY_Event.13017.d:"四方回书中，惟月海亭读得最细。蓝砚所寄水土账凡三十七页，还时页页有批，字细如蚁，行间犹有小注，注不下者，别纸附之。\n甘雨自辑粮政纪要一册，附于书后。其册列谷中户口、垦亩、渠堰、丰歉。末页有图，图注曰：「此依官册，恐有旧误，请谷中正之。」蓝砚展图，以指循山，至一处止，曰：「此处错了。」众问：「既知其错，何以反喜。」蓝砚曰：「肯将错处留与汝改者，是把汝当人看。」那些一字不错之文书，皆给上头看者。\n乃命人取新谷一袋，粗布裹之，附书一行：「君若来，谷中留热茶一碗。」茶必滚，不设席。使未行，蓝砚又唤回，曰：「再加一句。」取笔书曰：「图已改，另纸附还。」众问：「改她图，不怕得罪。」蓝砚曰：「她既请我正之，我便正之。」账凡三十七页，还时页页有批，字细如蚁，注不下则引线。"
 LYY_Event.13017.a:"与月海亭共修粮政"
 LYY_Event.13017.b:"不来不往，各安其位"
 LYY_Event.13018.t:"绝云间答以数行"
 LYY_Event.13018.d:"绝云间之复，书于薄绢，字瘦而劲，凡三行：「山有山规，谷有谷法，各安其处，不必相闻。」\n使者读之，面有愠色，曰：「此非拒人于千里之外乎。」蓝砚接绢，就光看一遍，反笑，曰：「这样最好。」使者曰：「好在何处。」蓝砚曰：「世上最可虑者，非恶人，乃好人。口口声声说要帮汝之人，帮到后来，谷成了他之物，汝还要谢他。」他若明说要占，汝倒好防；最怕他真心要帮，帮得汝连推都不能推。言毕，以两指夹绢，纳入案上一本旧账。账中记某年买锄几把、赊米几斗、修桥一座。绢夹在其中，便不复见。\n使者曰：「既不往来，后有事可求乎。」蓝砚曰：「不必求。」山不下谷，谷不上山，各安其生。若有一日山要下来，那时再说。是夜有雨，屋漏，蓝砚移床三处，终坐于门内看雨至天明。雨止而天未明，檐水一滴一滴，落入阶下石窝。书于薄绢，字瘦而劲，凡三行，绢边有折痕。"
 LYY_Event.13018.a:"各守其界，互不相扰"
 LYY_Event.13018.b:"复遣使者，力求通好"
 LYY_Event.13019.t:"却云来海之租约"
 LYY_Event.13019.d:"云来海之使至谷，衣饰华整，从者佩刃。入帐不坐，出图铺案，指港口、指航路、指泊位，言租几年、息几分、岁入若干。\n言未及半，蓝砚已起，伸手向门。使者愕然，曰：「我言未竟。」蓝砚曰：「君所言者，我已知其尾。」使者曰：「既知，何不听完。」蓝砚曰：「听完，我怕我记住。请。」使者收图，行至门，回曰：「谷中既不租港，亦不借路，他日货不得出，奈何。」蓝砚曰：「货出不去，人还在。」人在，货迟早出得去。人若不在，货出去又如何。使者归舟，以原话白达达利亚。达达利亚方举杯，手停半空，久不放下。舱中寂静，惟水击船舷。良久，笑曰：「此人有趣。」左右问：「何趣。」曰：「我未开口要水，她已替我道尽，且替我一并拒尽。」\n是夜达达利亚令舟人收帆，泊于港外，不即归。问其故，曰：「再等等。等她一句吾尚未听够之语。」使入帐不坐，出图铺案，指港口、指航路、指泊位。"
 LYY_Event.13019.a:"拒其租约，水不外借"
 LYY_Event.13019.b:"许其通商，暂稳边衅"
 LYY_Event.13020.t:"四国盟账同陈案上"
 LYY_Event.13020.d:"青之共约谈成之日，须弥雨林之学者、枫丹水利之官、蒙德治草木之士，各携其国之卷至。卷有厚薄，字有异体，图有异法，摊于案上，彼此不能尽读。\n蓝砚不设席，不设乐，惟令撤去屏风，以四张长桌拼作一张。桌既合，缝在正中，以布覆之。乃取谷中水土账出，置于桌心，曰：「我这本账最丑，先摊我者。」哪一页不对，诸君只管指。谁也不必客气；客气了，账仍丑。言毕，众人各就坐。须弥学者先指一页，问其土色；枫丹之官取尺量图，量了又量；蒙德之人翻至末页，指一行小字，笑而不语。争至日昃，茶冷三遍，无人起身。\n散时，四张桌上纸摞高尺余。众皆收卷而不即去。蓝砚送客至门，回视桌上残纸，曰：「今日无人先走，此事可成。」沉玉谷卷有厚薄，字有异体，图有以朱者，有以墨者。"
 LYY_Event.13020.a:"立青之共约，四方同守"
 LYY_Event.13020.b:"各家自顾，不与他邦结约"
 LYY_Event.13021.t:"神位既空不焚香"
 LYY_Event.13021.d:"帝君神位既空，殿门不闭，亦无人守。蓝砚入港，路经其前，止步，立于阶下。\n殿中无香火，龛上积尘，供案一角已朽。数小儿伏于门槛，以石子为戏，争一粒圆石，声甚喧。见有人至，亦不惊，仰首一望，复低其头。\n从者问曰：「可上香乎。」蓝砚摇首曰：「香者，烧与活人看。」殿中若无人，香烧与谁看。又问曰：「既如此，何不拆此殿，改作仓廪。」蓝砚曰：「不必拆。」存之。有人心中尚有一位，即与之留一位。彼不来，是彼之事；我拆之，倒成我之事。乃顾小儿曰：「汝等自戏，莫将门槛坐塌。」\n一儿仰面问曰：「汝乃神乎。」蓝砚曰：「非也。」儿曰：「然则汝来争位者乎。」蓝砚笑曰：「我来视殿后荒地。」\n遂绕龛而过。殿后有荒田数亩，草高过膝。她立于草中，望了一回，曰：「此块地，比那龛实在。」遗珑埠殿门不闭，亦无人守，阶上苔厚，踏之而滑。"
 LYY_Event.13021.a:"不拜神位，先看荒地"
 LYY_Event.13021.b:"谨守旧礼，暂安人心"
 LYY_Event.13022.t:"抄物候一册自序"
 LYY_Event.13022.d:"蓝砚令书记取谷中历年所记物候，汇为一册。某年某月某日，溪水涨几寸；某日山花落尽；某日雪至谷口；某日虫始鸣；某日雁南去。凡三十余年，断续皆有。\n抄凡七日，册成，厚一指。蓝砚亲题其端，题毕，于末页书小字一行：「天地自有其序，不须神来认证。」书记见之，色变，曰：「此语恐招祸。」蓝砚曰：「何祸。」曰：「神之事，人不好多说。」蓝砚曰：「我所写非神。所写者，溪水何日涨，山花何日落。此事我看了三十年，记了三十年。若有神来问，我便以此册与看。」书记曰：「若来问者非神，乃官府，奈何。」蓝砚曰：「那更当与看。令彼知此地方之事，吾辈比彼清楚。」\n册既成，置二本：一存谷中，一送月海亭。送书之使临行，蓝砚嘱曰：「路上若雨，先护书，后护衣。」使者笑而去。后月海亭以此册校官历，改其误者七处。册记溪水涨几寸、山花落尽、雪至谷口、虫始鸣，皆系日。"
 LYY_Event.13022.a:"记物候成册，自证其序"
 LYY_Event.13022.b:"废册不记，静观其变"
 LYY_Event.13023.t:"蓝砚指草答客问"
 LYY_Event.13023.d:"有客自港中来，衣冠甚整，坐于谷中社仓之下，问蓝砚曰：「不敬神明，此天下何以自立。此问非一人之问，港中士人皆如此问，客特来取其说，怀中藏纸一叠，欲记其答。」\n蓝砚不答，携之出谷，行二里，至一坡上。坡无主，无人种，无人拜，唯草自生。蓝砚指草曰：「此草何人种之。」客曰：「无人。」又曰：「何人拜之。」客曰：「无人。」曰：「无人种，无人拜，年年自生，亦未尝求人一顾。此坡十年前为矿渣所覆，寸草不生，我辈去渣填土而封之，草自至，非我辈所种。」\n客曰：「草自草，人自人。」蓝砚乃曰：「人亦犹是。若须有人为之证，方敢生，则一生都为他人之目所役，目转则身随，目闭则身止。」客默然，风过坡上，草伏而复起。客以手抚之，断其一叶，断处有汁，色青。日既斜，客始去。归途过一井，客俯身视井中，见己影，忽曰：「我自幼读书，未曾看过一株草。」客坐翘英庄社仓之下，仓为谷中公仓，屋三间，门以铁包。"
 LYY_Event.13023.a:"自在自证，不求神许"
 LYY_Event.13023.b:"稍循旧礼，聊以自安"
 LYY_Event.13024.t:"层岩裂口深几许"
 LYY_Event.13024.d:"蓝砚往层岩，看裂口一回。至则蹲于崖畔，以手量其广，凡七拃；复取绳坠石，度其深。绳尽而石未至底，乃续一绳。裂口曲折如爪，两壁土层可数，一层黄，一层黑，一层白。风自裂中上冲，其气微温，挟土腥。\n随行匠人问其所算。曰：「算此土受伤几何。」匠人曰：「此伤不可治。」曰：「不可治亦须治。以泥糊其面，面平而其下仍烂，烂至极处，塌不在今日，在雨大之年。」匠人问：「雨大之年，何年。」曰：「不知。故今岁须算。」\n归途遇雨，泥水入裂，其色如败茶。从者以蓑衣覆之，她推去，曰：「我得看它如何喝水。」既归，取册画一道裂，旁注数字，又注某日雨，某处渗水，某处草枯。旁有匠人执笔记之，记至一半，墨冻，以口呵之，复书。此册后经数次增改，纸为墨磨破，裂形已不可辨，唯数字尚清。裂在层岩崖畔，口广七拃，深不可测，投石不闻响。"
 LYY_Event.13024.a:"量伤问土，图长久之治"
 LYY_Event.13024.b:"循旧法，勉力封堵"
 LYY_Event.13025.t:"谷中老辈论治伤"
 LYY_Event.13025.d:"谷中老辈言：「伤须露着，结痂乃坚；捂之，则烂在里头。此语本说人，蓝砚听之，以为说土。」谷中有一老医，行医五十年，闻此语而叹曰：「治人如此，治土亦然，捂者先烂。」蓝砚归而记之，书于册首。\n乃以此语告封堵之匠。匠不服，曰：「敞之，雨水灌入，崩且速。」曰：「雨水灌入，土自去其浮；堵之，水积不去，崩在根底。」根底之崩，一夜之间，人不及避。匠又问：「然则敞数年乎。」曰：「敞数年，胜于年年补。」匠张口，未有以对。\n众匠相顾，无一人先言。一老匠乃点头，出而取锹，掘开前年所筑之堤一段。水出，浊而臭，众皆掩鼻而退。老匠以锹指之曰：「此即捂在里头者。」越数日，水渐清，草生其上，色嫩。老匠立于堤上，以手背擦眼，曰：「我筑堤三十年，今始知堤亦可错。」众人闻之，无一人笑。是秋堤上草长及膝，无人刈之。沉玉谷有一老医，行医五十年，药臼一只，臼底磨穿。"
 LYY_Event.13025.a:"开缝泄气，培土固根"
 LYY_Event.13025.b:"一概封死，求一时平安"
 LYY_Event.13026.t:"泉边木牌换三次"
 LYY_Event.13026.d:"渊泉者，治裂之后，谷中人于裂口边养出之第一眼活水。初出时水浊，三月乃清。水清而浅，冬不冻，大旱不竭。泉成之日，谷中老妇以手掬之，先饮一口，曰：「不苦。」众皆笑。\n有人欲筑墙围之，恐为外人见。蓝砚止之曰：「墙成，水死。」泉在墙中，无人取，无人语，纵不涸，亦成死水。众问：「不筑墙，任人取之乎。」曰：「任人取之。」取水者愈众，护泉者亦愈众，此理不难知。\n乃于泉边立一木牌，上书：「此处可打水，不可洗染。」晨间妇人以木桶来，午后小儿以竹筒来，薄暮有老兵蹲于泉侧，以手掬饮，饮毕抹须。牌凡换三次：初为杉木，为虫所蛀；次为石，日晒而裂；终以旧船板为之，字为谷中少年所刻。刻至染字，刀滑，多出一划，众议欲改，蓝砚曰：「留着，改过反不如此真。其后泉边常置一木瓢，瓢柄缠绳，绳断三次，换三次。」泉在灵濛山裂口边，水清而浅，冬不冻，大旱不竭。"
 LYY_Event.13026.a:"敞泉与众，禁其污洗"
 LYY_Event.13026.b:"筑墙护泉，独守其源"
 LYY_Event.13027.t:"遣使问天无人应"
 LYY_Event.13027.d:"蓝砚遣使往天空岛之向，赍书一封，封以谷中旧蜡。书只二句：「若天理尚在，请现身一谈；若不在，请许我辈自走。」\n使节行二十余日而还，鞋底皆穿，两手空空。众问其状。曰：「沿途无一人应，及至云下，仰视半日，云上有光，色白而不动，无门可叩，无阶可上。」又问：「可曾呼之。」曰：「呼三声，第三声散了。」众皆默然。使节又出一物，乃途中拾之石，色青，曰：「此石在云下，我取之，以证曾至。」\n蓝砚于回执批二字：「已知。」卷其空函，收于档中，位置在土水账之侧，两物相并，一厚一薄。有吏问：「既空，何藏之。」曰：「空亦是答。」吏退，记于簿，书至空字，笔停良久。是夜风大，架上落一卷纸于地，无人拾。晨起视之，乃此函也，封口未开。月余，有好事者问：「天果无乎。」蓝砚曰：「我不知天，我知此谷之土。」书封以沉玉谷旧蜡，蜡色深，封口有指纹一枚。"
 LYY_Event.13027.a:"空函入档，各行其是"
 LYY_Event.13027.b:"复遣使者，穷究其踪"
 LYY_Event.13028.t:"竹矛一支递到手"
 LYY_Event.13028.d:"护田队成军之日，谷中初集者百余人，立于社仓之前。所持者农具、猎弓、削尖之竹。无甲，无饷，亦无旗。有老妇来送其子，至队前，不语，唯纳一饼于其怀，转身即去。\n蓝砚逐一递竹矛，不言，惟视其人之面。递至末一人，乃止，曰：「此非令尔杀人。此令尔立于自家田边，使欲动手者先自掂量，知此土有人在守。」言毕，以矛柄顿地三下，地有回声。\n其人握矛，立甚直，矛尖过高，几触檐角。旁有少年笑，他不动，亦不放手。队散之后，一妇人独留，将矛倚墙，取布拭之，自矛尖拭至手握之处，另裹一层旧布，缠三匝，结在背面。蓝砚在阶上看见，未言，回身入屋，门未闭。是夜社仓灯至三更犹明，窗外有人影往来，为其子补甲。夜半有叩门者，乃白日笑人之少年，持一削竹来，问曰：「此竹可为矛乎。」翘英庄社仓前空地以石铺，石缝生草，立者百余人。"
 LYY_Event.13028.a:"授以竹矛，守土护田"
 LYY_Event.13028.b:"拨发军械，编入劲旅"
 LYY_Event.13029.t:"蔓哨无名册无营"
 LYY_Event.13029.d:"蔓哨不列名册，不立营垒。牧童、采药之人、砍柴之妇，本日日行山路，唯多受一句嘱：「多看一眼。」谷口不设栅，不置鼓，不闻更漏，唯路旁每隔数里有一块为人坐光之石。\n一采药童子于隘口见生人一队，即绕道奔还，草深没膝，至村社时裤已尽湿。报于长老，言其数、其服、其行止，无一处含糊。谷中由是得从容：闭隘，藏粮，牵牛入林，鸡犬皆不闻声。隘闭三日，生人自去。\n事后众人夸其机灵。童子摇头曰：「非我机灵。此路我日行三遍，石上有几道裂纹，我皆识之。今日多出数枚脚印，泥新，非谷中人。」长老问：「七人之中，有跛者乎。」童子惊曰：「有。」长老遂不复问，取炭于墙画一图，画毕以手抹去。由是谷中不设哨簿，唯嘱行者多看。童子后亦不在名册，人问其名，众但呼曰：「隘口彼孩子。」遗珑埠谷口不设栅，亦不设哨，惟嘱行者多看一眼。"
 LYY_Event.13029.a:"不设营哨，行人即哨"
 LYY_Event.13029.b:"另编哨队，专职瞭望"
 LYY_Event.13030.t:"巡队守一条水线"
 LYY_Event.13030.d:"防污巡队所守者，一条水线。上游何处夜半偷排，何渠水色有异，皆记之，记之甚细：某日某时，水作灰白，浮沫三尺；某夜有车四辆，自西来，覆席，行甚缓。所记之册不藏于官署，悬于社仓梁下，任人取阅。\n一夜，巡队截车数辆，正往下游倒渣。车上人出高价，钱置于石上，一叠，皆新，压以小石。领队少年摇头曰：「尔所予之钱，买不得我母所饮那一口井。」车夫执鞭不语，鞭梢垂地。\n车主笑曰：「少年，识时务者。」少年不答，命人记其号牌，一字一字对光看过。翼日，号牌抄于谷口布告，字大如拳。有人夜来撕之，撕去半张。晨起又贴一张，且多书一行：「撕者可来村社一谈，茶水自备。」是日午后，果有人至，坐檐下，先饮三碗，方开言。其人饮毕，起而曰：「我亦饮那井水。」众不复责，令其自扫渠三日。沉玉谷水线上游有数处暗排，排口以石掩，夜半则开。"
 LYY_Event.13030.a:"沿水设巡，见污即报"
 LYY_Event.13030.b:"任其自便，不来不往"
 LYY_Event.13031.t:"常备之兵只认饷"
 LYY_Event.13031.d:"蓝砚不主常备之兵。曰：「兵久于营，则识饷者，不识田。」饷出于谁，则向谁。或问：「然则饷从何出。」曰：「出于田，不出于库。」\n乃令各村护田队轮番受训：农忙则散，农闲则操。操时不用鼓，用梆；不用令旗，用村中旧钟。钟乃祭时所铸，声哑而远，一击则十里皆闻。操毕不点名，唯以饭熟为号，钟一响，各自归家。\n有人忧其不能当硬仗，曰：「如此散漫，遇劲敌奈何。」蓝砚曰：「未必。」临阵之人，若知身后为何块田，其足自稳。乃一试之：一夜骤雨，演练传警。自谷口至最远一村，凡传十七户，时未及一刻，人皆集于社仓檐下，衣湿，发贴额，无一人后至。蓝砚亦在，立檐外，雨落其肩，不移半步。事后有少年问：「此算胜乎。」曰：「此算未散。此夜所用之梆，后悬于社仓，梆面裂，不补。」梆以木为腔，击之音沉，声传三里，沉玉谷中皆闻。"
 LYY_Event.13031.a:"不养常备，寓兵于农"
 LYY_Event.13031.b:"设常备营，专事征战"
 LYY_Event.13032.t:"两竿竹矛挂一季"
 LYY_Event.13032.d:"蓝砚立一规：谷口张布告，竹矛只对外，不对内。谷中凡有争，皆赴村社大会，不许动械。布告贴于木牌之侧，与水土之约并列，一高一低。\n有二人争水，斗于渠上，一人破额，血流至颈，滴于渠中，随水散。村社议之，罚二人互替挑水一月，各满三十担，担上刻名，倒入对方缸中。挑水一月毕，二人于渠上相遇，一人先让路。\n二人所持竹矛，蓝砚命挂于谷口树上，挂一季。有人问：「挂之何为。」曰：「使过者抬头一见。此物不为尔邻。」一季后取矛，矛身已为雨浸出黑斑，斑如痘。其中一人取矛时，以手抚斑，久立不去。另一人先走，行十余步，回望一眼，亦未言。自后谷中争水者，皆先至社仓，坐于阶下，等人齐而后言。树为老槐，挂矛之处，皮破，后生一瘤，年余犹在。有小儿问父：此何物。父曰：「两把不用之矛。」布告贴于遗珑埠木牌之侧，牌上另书水土之约数条。"
 LYY_Event.13032.a:"竹矛只对外，纷争归公议"
 LYY_Event.13032.b:"严立军法，以刑束众"
 LYY_Event.13033.t:"老树下两拨人争"
 LYY_Event.13033.d:"统一之后，谷中分二说：一曰当推水土之规于全璃月，一曰当守山谷，城中事非我所知。两说各有长者主之，各有人从之。两拨人皆非黠者，皆谷中耕田之人，所争者为日后之谷。\n蓝砚请两拨人同坐一老树下，令自争。自晨至午，自午至暮。争至三日，声皆哑。有人拍树，有人解衣，有人以杖画地作图，图成而足踏之。一老妇不争，唯递水，递至第三日，亦不再递。有人以杖画谷界，画三遍，三遍不同。蓝砚坐于树下石上，终日不置一词，唯于争论处点头。\n散时无果。蓝砚曰：「吵不完亦好。若真吵完，则无人敢言矣。」言毕即去，不留一语。两拨人对树而立，树上有一旧巢，风过，巢微动。少顷，一人先笑，余人亦笑，笑已，各归。其后两拨共立一社，仍争，争而不散。是年冬，两拨同修一渠，工毕，于渠首立石，石上不刻字。翘英庄两拨各有长者主之，争而不散，树下石凳皆坐满。"
 LYY_Event.13033.a:"两说并听，以定行止"
 LYY_Event.13033.b:"择一而从，速定大计"
 LYY_Event.13034.t:"水土之约贴全境"
 LYY_Event.13034.d:"水土之约行于全境，头一步，取谷中禁伐、护泉、公仓数条，一字不改，抄为告示，贴于璃月诸处。抄者十人，抄三日，用纸三百张。浆以米汤调之，刷于墙，未干时字易流，故刷一层，贴一张，以掌按之，按至角上，方去。\n帖初出，浆未干，已有人围观。识字者读，不识字者听。读至禁伐一条，有樵者冷笑，担斧而去，斧刃在日下闪光。有妇抱儿，听至护泉一条，问：「此泉在何处。」读告示者指东，妇即往看，行数步又回，问：「可饮否。」\n有人问蓝砚：此管用否。曰：「先贴出去。」使砍树之人知世间有此事，有人不以此事为是。头批告示出后，城中一老人专程至谷，问可多取数张。曰：「取归何为。」曰：「贴于我巷口。巷中三株老槐，我父手植。」蓝砚予之十张，另予一瓶浆，老人持归，贴至夜半。沉玉谷抄者十人，抄三日，凡若干纸，纸用粗纸，墨用炭。"
 LYY_Event.13034.a:"以谷中之约推及全境"
 LYY_Event.13034.b:"步步为营，先守谷中"
 LYY_Event.13035.t:"中道俯察黑水渠"
 LYY_Event.13035.d:"入港之路，蓝砚一路不言。同行者五人，有谷中老农，有港中接引之吏。吏数次欲言城中近事，见她目视路旁，遂止。路旁田埂新翻，土色深，翻处有蚯蚓，为鸟所啄。\n行至半途，忽止，蹲于路侧，视一水沟。沟水黑，浮油一层，日光落其上，作五色。沟畔有枯苇一丛，苇根皆黑，黑至泥中。以指蘸水，捻开，就鼻嗅之，然后抹于袖口。随行者不解。曰：「携之入城。待其言繁荣，我出此袖。」沟宽不过三尺，深亦三尺，而气味逼人，近之欲呕。\n从者曰：「此小事。」曰：「一沟之黑，非一沟之事。此沟入渠，渠入河，河入海，海通诸国。」言毕起身，拍去膝上土，前行。袖口那一块，行至城门未干，有蝇随之。守门卒视其袖，欲问，终不问，只以矛柄指路，放其入。吏在旁低声曰：「港中此类沟，不下四十条。」蓝砚曰：「那就四十条一条条看。」沟在沉玉谷道旁，水黑而滞，面上浮沫，沫色灰白。"
 LYY_Event.13035.a:"带污水入城，以示其害"
 LYY_Event.13035.b:"掩其瑕疵，先结人心"
 LYY_Event.13036.t:"开工先问土与水"
 LYY_Event.13036.d:"蓝砚所欲者，非使璃月港停，乃使匀。其所立首条甚简：凡兴工，先问此地之土与水，受得住否。答曰受得住者，须有人署名；答曰不知者，不许开工。此条书于木牌，立于港中诸门之侧，凡七处。\n此条一出，得罪者众。有巨商当面讥之，曰：「港中一日之利，可养谷中一年。尔以一沟水阻之，可谓不知轻重。」蓝砚不辩，只请其往港边一片新填之老滩。言者衣锦，指上有玉戒，言时以戒叩案。\n其人立于滩上，脚下松，行数步陷至踝。掘之，见旧船板，板上尚存钉孔，一枚断钉犹在。其人俯视良久，无一语。归途上，忽问：「此滩何人所填。」蓝砚曰：「不复记得，填得很快。此语说得甚轻。」其人回港后，自将名下两处工地停了半月。其人行前复下滩一次，以手量其陷处，记于小册。后其名下新仓，地基另择高处。所立首条甚简，凡兴工先问此地之土与水，受得住否。"
 LYY_Event.13036.a:"行缓工之制，先问水土"
 LYY_Event.13036.b:"照旧兴工，不废其时"
 LYY_Event.13037.t:"须弥图志枫丹尺"
 LYY_Event.13037.d:"须弥学者携雨林图志数箱至，枫丹水利官携测水之法一整套至。两造初不相识，坐于一处，各视其物，久无一言。箱上封条未启，尺匣上刻枫丹水院之记。蓝砚先令煮茶，茶未上，三人已各自摊开其物。\n蓝砚请二家同坐，先出谷中最丑之水土账。曰：「我账最丑，先摊我账。」学者展图，指数处曰：「此处坡向，与尔谷中一路。」水利官取尺与瓶，算一夜，烛换三支，指上沾墨。学者取图时，以袖先拂案上尘。水利官量水不以目，以瓶，瓶中置沙，沙沉则水浊重。\n天将明，三人以图、账、数纸拼于一案，凑不成整幅，尚缺一角。学者曰：「缺者，我处亦无。」水利官曰：「那就空着。」三人各署名于纸背。谁亦未言谢谁，谁亦未言谁之功。及出门，学者忽回身，取谷中一撮土，以纸包之，纳于箱底。沉玉谷老农在门外候至天明，见三人出，问：「算清了否。」曰：「算清一半。」"
 LYY_Event.13037.a:"三家合参，共修水土之书"
 LYY_Event.13037.b:"各自为政，不与他邦合参"
 LYY_Event.13038.t:"城郊荒田按户分"
 LYY_Event.13038.d:"共治之田，以谷中公田之法，试于城郊数处荒地。荒地为村社共有，按户分种，收成按劳而分，不按丁口，亦不按钱。分田之日，以绳量之，绳上打结，一结一垄。\n第一年即生争：一户多占半垄，为邻所揭。其人辩曰：「此垄荒久，无人耕，我耕之，即我田。」蓝砚不私断，令村社大会当众议之。议至午后，决：多占者退还，并代被占之家耕作一季。其人低头受之，面上有汗。揭发者为邻家老妇，言时手抖，说完即坐，不敢看人。\n蓝砚曰：「公田之设，非使人无私。」乃使有私者，亦掩不住。是年秋，其人代耕之田收成最丰。被占之家送去新米一斗，其人不受，置于门槛，去。米在门槛上放三日，日晒夜露，末一日为雨所湿，其家乃收。次年春，其人于地头立一木桩，刻己名与垄数，刻得极正。人问何故，曰：「怕再错。」沉玉谷荒地为村社共有，按户分种，收成按劳而分。"
 LYY_Event.13038.a:"荒地归社，按劳分种"
 LYY_Event.13038.b:"荒地归官，招佃承种"
 LYY_Event.13039.t:"老农一语裁开销"
 LYY_Event.13039.d:"山心入庙堂，乃使谷中村社推数人，入璃月议事之厅而坐。其人不善言辞，多数时唯听，听至日暮，膝上摊一小册，以炭记数。厅中诸人皆衣新，唯此数人衣旧，坐于末席。守门者不识其衣，拦之，验文书乃入。\n有一回，众争一笔开销，数目甚大，争至日昃。一老农起，衣上有泥点，曰：「此钱，够我那一带打二十口井。」满堂静。主事者问：「二十口，可足用。」曰：「不足。然可少走十里路挑水。」言至此，堂中有人低头看案，有人以指摩额。\n那笔开销后削其半，移以凿井。散后，老农于门口久立，仰视门楣。人问之。曰：「此生未入过此等屋。」言毕，以袖拭鞋，方下阶。阶上有槛，他抬脚甚高，几绊，扶柱乃过。归谷之后，人问厅中何等模样，他答：「桌子很长，坐两头者言语，听不清。」井成之后，其村妇孺不再于鸡鸣时起，水缸常满。其人坐于翘英庄厅末，膝上摊一小册，以炭记言，字歪而密。"
 LYY_Event.13039.a:"村社推人，入厅共议"
 LYY_Event.13039.b:"谷中自治，不入庙堂"
 LYY_Event.13040.t:"两册陈前相对勘"
 LYY_Event.13040.d:"慢有代价。头一年，新港比邻邦迟二月开埠，旁数条商路亦为人先，商队转往他处，码头闲了半月。商队主事者言：「货期一误，客即他去，此非人情所能强。」港中栈房空者三分之一，牙人坐于门口剔牙。\n议事厅中有人当面责之，言辞甚急，至拍案，案上茶盏跳起，泼湿一角。蓝砚不辩，取两本账并置案上：一本记省下之工期，一本记保住之水源与林。曰：「请看哪本厚。」众人传观，省工之账薄，十余页；水林之账厚，指按之，纸边起毛。拍案者出于港中旧族，其祖曾督此港。\n传至末一人，其人翻数页，合之，无一言，退坐。会散，蓝砚独留，将两本账皆收入柜，先厚者，后薄者，阖柜，锁之。守门老卒在帘外看见，退语其徒曰：「今日无一人胜，亦无一人败。」徒问何故。曰：「两本账放在一处，即答了。」越三月，邻邦新港淤塞，商队复来。来者不提旧事，只问泊位。遗珑埠新港比邻邦迟二月开埠，码头闲半月，商队转往他处。"
 LYY_Event.13040.a:"甘认其慢，以守水土"
 LYY_Event.13040.b:"弃缓行之制，争其先机"
 LYY_Event.13041.t:"旧律新约一绳捆"
 LYY_Event.13041.d:"山河共治写成之日，蓝砚取水土之约与璃月旧律数部，摊于一长桌，逐条比对。合者留，冲者当面言明，不留一字含糊。旧律凡九部，纸色黄，角上皆有官印，印色已淡。蓝砚令四人各执一册，逐条唱名，唱至午，声干。\n比至末条，停笔。曰：「此条为此地自定。有欲改者，先来问我地上种田之人。」座中有一老吏，执旧律三十年，闻言欲辩，终不发，唯以指摩纸角，摩得发亮。老吏指一条曰：「此条与谷约相冲。」曰：「冲者废之。」老吏手指颤，终收其册。\n言毕，两卷并拢，以麻绳捆之，结打在侧，不打在面。绳头剪齐。她以掌按之，卷中纸页犹有高低。老吏忽曰：「此二卷，孰先。」曰：「无先后。」曰：「若无先后，日后争者，何以断。」蓝砚曰：「那就看哪一卷上有泥。」老吏怔然，久乃笑，取笔于签上并书两名。老吏又取封皮，题曰：「山河共治，新旧并列。」沉玉谷合者留，冲者当面言明，不留一字含糊，末以绳束之。"
 LYY_Event.13041.a:"山河共治，水土为纲"
 LYY_Event.13041.b:"各守旧律，不相统属"
 LYY_Event.13042.t:"散会独上城头立"
 LYY_Event.13042.d:"退回山谷之说，欲以璃月港诸事还于旧主，谷中唯守自家水土。主此说者言：「我辈本自田间来，田间事我辈知之，港中事我辈不知。」主此说者，谷中一老农，曾以三百人守一隘三日。\n蓝砚初不许，曰：「此甩手也。」主此说者反问：「我辈入城，城中人即肯听我辈乎。」蓝砚不能答。是日议事至夜，众散，烛未尽，她独上城头，立至天黑。众人退时，有一人回望城头，见她不动，乃去。\n风自海上来，衣角翻卷，她不按。守城卒二次送灯，她受之，置垛口，灯为风灭，她不复点。后数日，她说：那就试。试坏，亦是我辈自认。说此话时，手中执一卷文书，卷得很紧，指节发白。是夜她写了半页纸，写完看过，又扯去，只留一句：「凡退者，须自认其退。」次日晨，她以冷水洗脸，取铜镜自照，久乃放下。那份扯去半页者，后仍收于档，残页在。城头风大，以冷水洗脸，取铜镜自照，久乃放下。"
 LYY_Event.13042.a:"退守山谷，自管水土"
 LYY_Event.13042.b:"留在港中，力争其权"
 LYY_Event.13043.t:"谷口木牌前争道"
 LYY_Event.13043.d:"谷口之争，起于一队外地行商欲过境，车七辆，载盐与铁器。一方主收钱，一方主放行，两造于木牌前争，争至推搡。行商为首者持一纸，纸上印邻县关防，纸边已卷。正午日烈，牌影斜过路中，两造立影两侧。\n蓝砚至时，衣已乱，一人握扁担，一人解腰绳。她不言语，先以手分两拨，令各退三步。然后命人念牌上之规，自首行念至末行，声在风里，念者数处含糊，又回头重念。念至罢税去枷一条，两造皆静。扁担为桑木，两头包铁，举之甚重。\n她乃曰：「此牌立几年。」众曰：「十一年。」曰：「十一年之规，今日仍照此行。」收钱者先退，放行者亦退。行商过境时，为首者向牌一揖。蓝砚立于牌侧，未还礼，亦未去。车过尽，有车夫回身，将一枚铜钱置于牌下石上。念牌者为谷中小学之师，念时以指逐字而下，一字不跳。车七辆，载盐与铁器，停于遗珑埠牌前，轮陷土中寸许。"
 LYY_Event.13043.a:"照旧例行事，不因人改规"
 LYY_Event.13043.b:"从权收税，以备谷用"
 LYY_Event.13044.t:"盟约念到遭灾条"
 LYY_Event.13044.d:"村社联合，以谷中十余村社，连迁入之流民聚落，共书一盟。谁家遭灾，余家出人出力；谁家开渠，上下游同议。盟约书于三层厚纸，共十七页，末页留白，以备续书。\n签之日，一老人不肯按印，曰：「我祖上未入过何盟。」蓝砚不逼，取盟约读之，自首条读起，声缓，遇生字则以俗语解之。读至遭灾相助一条，老人忽问：「去年我家缺粮，谁所凑。」老人年七十有二，手上老茧如石。签者先后上前，各以拇指按，印色红。\n蓝砚曰：「吾辈所凑。」老人不语，半晌，伸手，指上有泥。印按下去，略偏。他视之，欲重按，蓝砚曰：「不须，偏者亦算。」老人退至檐下坐，以掌覆膝，久不起。是夜他自家中取来一坛腌菜，置于社仓门口，坛上压一石，石下压纸，纸上画一手印，亦偏。翘英庄坛中腌菜色微黄，入口甚咸，众人分食，无一言。"
 LYY_Event.13044.a:"立村社联合，守望相助"
 LYY_Event.13044.b:"各村自守，不结盟约"
 LYY_Event.13045.t:"匠人劝设大矿井"
 LYY_Event.13045.d:"蓝砚所拒者，非一切机器，乃那种非聚人于一处、非引水于一处不可之大物。谷中水碓水碾，她素以为善，且亲为修过一次轴承。其人自港中来，衣上有煤屑，靴底带泥，入谷先脱靴，置于门外。\n有港中匠人来劝，设新式矿井之械，一日所出，抵谷中一月。其人陈其利，自辰至午，言不绝，指画于案，茶换三次。末乃曰：「此械一成，谷中壮丁可省数百，妇孺不必下田。」蓝砚听之，问一句：「此械所出之煤，运往何处。」曰：「往港，往诸国。」\n蓝砚不驳，携之去看一条旧溪。溪已为矿渣所平，面上生薄草，草下皆黑。曰：「此械一日抵我一月，亦一日填我一溪。尔算之：尔之快值钱，抑我之溪值钱。」匠人张口，未答。行数步，蹲下，以手抠草下黑泥，指尽黑。回港后，其人所上之书，改了三处，末一处改得最久。蓝砚回谷之后，命人将谷中水碓之册重抄一份。抄者不解，问：「旧册尚在。」曰：「旧册在，用册之人不在。」沉玉谷水碓水碾，她素以为善，且亲为修过二次。"
 LYY_Event.13045.a:"用水碓水碾，不用大矿机"
 LYY_Event.13045.b:"引进机器，以图迅捷"
 LYY_Event.13046.t:"扶正一株倒伏稻"
 LYY_Event.13046.d:"自足之谷，欲使谷中少赖外粮、外器。人种粮、织布、斫木、打铁，足用而止，不求有余。谷中布机十七张，铁炉三座，皆旧物，修而用之，不轻弃。\n有人嫌其穷，曰：「谷中所织之布，粗而厚，不及港中细帛远甚。」蓝砚曰：「有余则须易钱，易钱则须有人来收，有人来收则须看人颜色。」看颜色既惯，田即不保。言者不服，曰：「然则谷中永着粗布乎。」曰：「布粗而人不粗，可矣。」\n言毕，蹲身，扶一株倒伏之稻。稻已吐穗，穗重，故倒。她以土培其根，以叶垫其穗，手极缓，如恐折之。旁有少年问：「扶得活否。」曰：「不知。然不扶则必死。」少年亦蹲，扶第二株。是岁秋收，此二株所出，另置一囊，不与众谷相混，悬于仓梁。此语后传至港中，有人笑其迂。笑者数年后遭乱，以高价求谷中之布，谷中予之，不加价，亦不多给。沉玉谷布机十七张，铁炉三座，足用而止，不求有余。"
 LYY_Event.13046.a:"量入为出，求其自足"
 LYY_Event.13046.b:"广开商路，博其利源"
 LYY_Event.13047.t:"谷中不受人号令"
 LYY_Event.13047.d:"不奉王令，其言更直：谷中不受任何一方号令，唯受自定之规。村约悬于社仓，凡十四行，行者有长有短，最长一行即此。\n有人劝其留余地，免招祸，曰：「今既成一统，州县之令自上来，拒之者，名不顺言不达。」曰：「余地早留够。自帝君驾崩至今，我辈让过几回，尔心中自有数。」让至末处，谷中连一口泉亦保不住。又有人问：「若州县以兵来，奈何。」曰：「以兵来，则以理对；理既尽，则以锄对。」\n言者默然，取茶饮，茶已冷，仍饮尽。蓝砚以此语书于村约首行，字较他处为大，笔画粗，不甚好看。书成，悬于社仓。有小儿指其字问母：此字何以歪。母曰：「写得急。」小儿又问：「急甚么。」母不答，牵之去。是夜有人于仓外立久，看那一行字，看到灯灭。后有吏持州县之檄至，立于仓下读檄，读毕，无人应。吏自去，檄留于案，压以石。村约悬于翘英庄社仓，凡十四行，以木板为牌，牌上有钉三枚。"
 LYY_Event.13047.a:"谷中自治，不受他令"
 LYY_Event.13047.b:"暂行敷衍，以避其锋"
 LYY_Event.13048.t:"山坳挖土见石层"
 LYY_Event.13048.d:"谷界立时，不筑墙。蓝砚先令人书一名单：何坡归谷中，何道共行，何水上下游共守。然后请两边老人同走一遍界，行三日，日暮则宿于村，各睡一侧。名单写毕，誊两份，一份留谷，一份付城，两份字迹不同。\n至一争多年之山坳。两造各执一词，一曰祖坟在此，一曰水自此出。蓝砚令人掘开一层土，深二尺，露石。石上有水痕，色白，如线，自西而东。曰：「水自此石上流下，即照水所行。」老人先言，指坳中一石曰：「此石为记。」另一老人曰：「此石是后来者。」\n两造俯视良久，皆点头。掘开之土，命人仍填回，踏实，踏了十七下。填毕，一老人以杖于其上画一横，曰：「就这儿。」众无异议。归途上，那位言祖坟者忽曰：「我祖坟其实在下头三里。」众人皆停步，继而皆笑。归途上又有一事：两边老人同行，过一独木桥，一人先过，回身以杖递之。沉玉谷界以名册定之，何坡归谷，何道共行，何水共守。"
 LYY_Event.13048.a:"依山水立界，共守其约"
 LYY_Event.13048.b:"立墙设卡，明定疆界"
 LYY_Event.13049.t:"叶旗尽收地却在"
 LYY_Event.13049.d:"归田自治立之日，谷中十余村社各收其绣叶之旗。蓝砚曰：「旗不必挂，地在。」收旗之日，天色阴，无风，旗垂不动。各社之长立于旗下，先解绳，后卷旗，卷时自上而下。\n旗收于社仓，卷而束之，堆于梁下，尘未落。收旗者皆不言语，一社之长卷至末一面，以手抚叶纹，抚两遍，方束。梁下积旗十九束，每束以草绳三道，绳结在上。\n她将末一件公事交毕，即回谷中。有人问：「此后谷中之事，寻谁。」曰：「寻尔辈自议。若一家有难，先看邻家锅中有无粮。」问者不退，又问：「若议不定，奈何。」曰：「那就再议，议到能定为上。」\n她去时，谷口老树初抽新芽，芽色浅，未展。无人送行。行半里，她回望一眼，见树下有人正挂一束旗，挂得歪，未去扶。次年春，仓中旗生霉，众取出晒之，晒于石上，叶纹朝天。翘英庄有老妇取一束归家，拆开，以旗布缝作小儿襁褓。"
 LYY_Event.13049.a:"归田自治，谷事谷议"
 LYY_Event.13049.b:"仍领璃月之事，兼管其政"
 LYY_Event.13050.t:"集日谷口唱旧事"
 LYY_Event.13050.d:"谷中歌者以谷中旧事编为曲，集日即于谷口唱。所唱非英雄，皆无名者：守泉四十年之老人，雪天分饼之小儿，替人挑水一月之二人。其人本为矿工，肺有病，唱至高处则咳，咳止复唱。\n其词朴，调亦不工，唱至一半常忘，忘则停，停则听众有人补一句，补者往往即曲中人。有一次唱至分饼小儿一段，座中一老妇忽起，曰：「那小儿是我儿。」众皆看她，她复坐下。\n蓝砚常往听，听毕即去，从不置一词。有人问：「何以不赞一句。」曰：「彼所唱者，我辈也。我若开口，即成自赞。」\n歌者后亦入城，唱者仍旧，唯听者之中，多了几个不种田之人。有一人听至守泉老人一段，问旁座：此老人今在否。旁座摇头。其人乃以袖掩面，坐良久，末乃取钱置琴匣，钱数多于常。琴匣为木，裂一缝，以胶封之，年久色深。沉玉谷所唱非英雄，皆无名者，琴匣为木，裂一缝，以胶封之。"
 LYY_Event.13050.a:"容其自唱，不加褒贬"
 LYY_Event.13050.b:"请其改唱功业，以励众心"
 LYY_Event.13051.t:"一锹一锹填旧坑"
 LYY_Event.13051.d:"旧矿之人，谷中最不欲提者。其曾手挖此山，今石尘入肺，咳血，伛偻，而日上山，以锹填当年所掘之坑，一锹一锹。其人所居在谷西，屋低，门向东，晨起见日。\n一老人谓蓝砚曰：「我不望人恕我。唯愿死前，将此土还其旧形。」蓝砚不言恕，只曰：「那就同填。」言至此，老人以手按胸，咳，咳出血丝，以土掩之，不使人见。\n翼日，她果往，亦持一锹。锹柄短，不合其身，她以布缠而握之。填至日中，众歇，坐于坑沿。老人咳，咳止，自怀中出干饼，掰半予蓝砚。饼上有石粉。她接在手中，咬下一角，慢慢嚼。众人见她至，皆停锹。她曰：「不必停。」众复举锹，然皆放慢。\n坑凡七处，填者二十三人，填二年。末一处填毕，众于坑上立一石，不刻字，只以锹背敲石三下。老人未至，前一日殁。此后每岁清明，有人于石上置一锹，锹柄向南。坑在灵濛山后，深数丈，填之以石与土，日填一尺。"
 LYY_Event.13051.a:"不问旧罪，一起填坑"
 LYY_Event.13051.b:"追其旧责，以儆后来"
 LYY_Event.13052.t:"虫蛀旧纸置最上"
 LYY_Event.13052.d:"璃月新土四字，乃两条路归为一处之后，蓝砚方说出口。说此四字时，左右不过三人，皆未记，后问之，三人所记各异。\n是日，命人将两路上所积文书尽搬入库。箱凡二十余，抬者汗透衣，行至门槛，须二人侧箱而过。箱上各有旧签，签上字已褪，须侧光乃辨。\n她逐箱翻阅，翻至一箱，忽止。箱底一张极旧之纸，乃谷中最早贴出之告示，边角为虫所蛀，蛀处成小孔，透光。她拈出此纸，置于诸文书之上。曰：「留此一张。以后之账，皆与此比。此纸所书者，禁伐护泉公仓数条，字为谷中小学之师所写，笔误一处，未改。」\n言毕，阖箱。阖至半，复开，取纸，吹去浮尘，乃复置，再阖，锁之。守库老吏在旁问：「此纸已蛀，何不另抄一张。」曰：「抄者是我字，此纸是众人手。」言毕携钥去，钥在腰间，行则有声。锁为铜，钥匙一，系以红绳，绳旧而色未退。翘英庄钥匙一，系以红绳，绳旧而色未退，行则有声。"
 LYY_Event.13052.a:"两路归一，水土为记"
 LYY_Event.13052.b:"各记其功，分途而行"
 LYY_Event.13053.t:"垄头一掬土犹暖"
 LYY_Event.13053.d:"土记得，谷中老话。蓝砚晚年常至最早之梯田边坐，一坐半日，无所为。田中人或锄或歇，皆不惊之，惟过其前时放轻脚步。晚年她耳重，人语须近，然对田中之声，仍辨得清。\n有人问其所看。曰：「看土。汝翻松之，它记得；汝伤之，它亦记得。人去，它犹为汝记。」问者又问：「土既记得，人何必记。」曰：「人记，债也；土记，账也。」\n言毕，以手插入田埂之土，深及指节，抓一把起。土湿而松，有细根缠指。然后缓缓松开。土粒自指缝漏下，落回埂上，簌簌有声。漏尽，掌中唯余一粒小石。她拭手于襟上，襟色深，拭过之处留下浅痕。她看了看，弹去。旁有孙辈问：「阿婆手上所剩何物。」曰：「剩者，土里最硬者。此语后为村中小儿所传，不知其意，只觉好听。」她坐至日下，方起，起时以手撑膝，撑了两下乃起。梯田在灵濛山坡上，最早一层石垒已旧，石缝生草。"
 LYY_Event.13053.a:"以土为记，功过自明"
 LYY_Event.13053.b:"勒石记功，昭示后世"
 LYY_Event.13054.t:"一童一株自挖坑"
 LYY_Event.13054.d:"百年之绿，乃蓝砚所遗于后人者。曰：「我辈未必及见其林长成。然既种之，百年之后，必有人立其树下乘凉。」树苗为杉与樟，高低不齐，皆一年生，根上裹泥。\n有人问：「其时谁记种者。」曰：「不必记。」树记之足矣。问者曰：「既不记，何以教之。」曰：「教其种，不教其记。」\n她以末批树苗授谷中童子，一人一株。令各自择地，各自挖坑，各自埋之，不许相帮。一小儿坑挖得太浅，苗立而倒。众人欲扶，蓝砚止之。小儿自取水，灌之，以土培其根，培三次，苗乃立。有一童择地于石缝，众人皆言不生，她不禁。三年后，此树果生于石缝，根抱石。\n她看至日暮，方去。行数步，回顾，见那小儿犹蹲于苗前，以手护其干，如护一物甚贵者。三十年后，此坡成林，林中有树一株最粗，村人皆指曰：「此某年某儿所种。其儿已老，闻之笑，不辨真伪。」树苗以布裹根，根上带土，土色黑，乃沉玉谷老土。"
 LYY_Event.13054.a:"百年之计，交于后人"
 LYY_Event.13054.b:"急取近利，以固其位"
 LYY_Event.13055.t:"念约两日到末条"
 LYY_Event.13055.d:"立村约，谷中末一件大事。各村社推人，将历年所立之规一条条念出，可留者留，应改者改。念两日，念者三人轮换，茶水置于案侧，无人先饮。所念之规，有立百余年前者，念者不识其字，须旁人代读。\n念至末条，一自流民中选出之代表起，曰：「我非谷中生，不知当不当按。」代表衣旧，袖口有补，立于众前，先以手整襟。\n蓝砚曰：「尔于此谷种田三年，按之。」其人上前，观印良久，以拇指按之。按下去，手甚稳，指纹清晰，印色深于旁人。按毕退下，众中有人拍其肩，他不动，亦不言。\n有一老妇在旁，忽而拭面。人问何故。曰：「此印，我夫当年亦按过。夫已死七年。」众皆默然，堂上唯闻翻纸之声。约成，置于社仓最高一格，前置一灯，灯燃至晓。老妇拭面毕，自袖出一小块红布，裹印泥少许，纳于怀。翘英庄念者三人轮换，念两日方到末条，末条言改约之法。"
 LYY_Event.13055.a:"立约成册，人人按印"
 LYY_Event.13055.b:"择要存录，无事人人"
 LYY_Event.13056.t:"拔去一株旁人草"
 LYY_Event.13056.d:"最后之青山，蓝砚以此名此路。她立于一坡，坡新复，绿薄，色浅，然匀，如以淡墨一遍遍染成。坡下有一小路，为新土所断，行人不通，须绕行百步。\n曰：「我不求此天下尽为青山。唯求我辈守不住诸处之时，至少尚能守此一座。此座在，则此事尚有望。」言至此，她以手抚坡上薄绿，抚过之处，草伏而即起。\n言毕，蹲身拔去脚边一株草。旁人视之为草，她视之为坡活之凭。拔起，根上带土一小团，她以指抖之，土散，根白而脆。旁人不解：既是凭据，何以拔之。曰：「此草占他人之地。」留它，他草便长不出。\n言毕，以手将拔处按平，按了两遍。风过坡上，新草伏而未尽伏，一片浅绿之中，有一处略深，恰是方才按过之处。旁人又问：「此坡几年可成林。」曰：「我辈不可见。」问者不复言。坡新复，绿薄色浅，如以淡墨一遍遍染成，远望连灵濛山。"
 LYY_Event.13056.a:"留此一山，以证其事"
 LYY_Event.13056.b:"倾力拓之，遍及全境"

 CYG_Spirit_Soil_and_Heart:"治水先相土"
 CYG_Spirit_Soil_and_Heart_desc:"治水者先学看土，护山者先学听水。少年从师治水，师令其立岸上三日，不许动。至第三日，少年言水声有异。师问何异。答以午前声浮，午后声沉。师问沉者何兆。答以下有沙走。师大喜，谓可教矣，乃授以法。少年后主一渠，二十年不溃，尝语人，谓其师所授，止三日之立。渠在沉玉谷中，二十年不溃，渠底见石，石上有凿痕。"
 CYG_Spirit_Watershed_Green:"分水问下游"
 CYG_Spirit_Watershed_Green_desc:"分水岭上立一约：凡在岭上动土者，先须下游之人点头。豪家欲开石于岭，使者持约至下游，村人不许。使者谓此岭属其家。村人答以此水属众口。使者又谓岭上之土乃其家之土。村人引之至溪畔，取水一瓢，问此水中亦有汝家之土乎。使者视瓢，水浊，不能答，归而罢役。分水岭在沉玉谷上游，岭上立石一块，石面无字。"
 CYG_Spirit_The_Slow_Road:"路缓绕泉眼"
 CYG_Spirit_The_Slow_Road_desc:"路修得缓，修得弯，绕开老林与泉眼。工师画图，一图省工，一图保水。两图并陈于案，主者取保水者，谓省工者省一时，保水者保百年。工师言此路多费三月。主者答以费三月可。工师言人必怨缓。主者答以怨缓者，走此路时自忘。路成，行人不知其弯，惟见泉上有桥，桥下无水声。路自遗珑埠出，绕三处老林、五处泉眼，里程多出四十里。"
 CYG_Spirit_Green_Convention:"万国共一纸"
 CYG_Spirit_Green_Convention_desc:"须弥、枫丹、蒙德各有其度量之法，尺不同，斗不同，记时亦不同。初会于桌，各持一纸，争至日暮，不能合一。至第三日，一人曰：「不必合，但拼。」乃各裁其纸之半，以胶黏之，成一大幅。黏处参差，字亦大小不一。众人视之，良久，一人曰：「此图难看。」主者曰：「难看而可用，胜好看而不用。」大幅之图张于沉玉谷社仓壁上，黏处参差，字有大小。"
 CYG_Spirit_No_God_Need_Certify:"草自荣不祷"
 CYG_Spirit_No_God_Need_Certify_desc:"草无人种，亦无人拜，年年自长。僧过谷，见之，问此草谁主。谷人答以无主。僧谓无主则人争。答以争者未尝至此。僧问何故。谷人引之至田，指草谓此草不值钱，故无人争；然谷中之人，皆食其下之薯。僧乃言所贵者在下。谷人曰：「在下者，不必有人拜。」谷人不拜神，惟于投珑之日，取新茶一盏置于台前。"
 CYG_Spirit_Heal_Not_Plug:"罅隙待自合"
 CYG_Spirit_Heal_Not_Plug_desc:"地裂，年年糊之，年年复裂。老医过，视之，谓此非创也，乃伤；创可糊，伤须长。主者问何以使之长。老医答以先勿再扰。乃命停工一年，不填不压，惟禁人畜践踏。一年后，裂口内生新土，草自上之。主者视之，曰：「向者吾辈所糊者，皆阻其长者也。」裂口在灵濛山下，停工一年，草自上之，土色转深。"
 CYG_Spirit_Terrace_Watch:"垄亩各有界"
 CYG_Spirit_Terrace_Watch_desc:"甲不具，饷不给，所持者农具与竹矛。其守不在城，在一埂。马队过境，欲践田而过，村人列于埂上，不持兵，亦不退。骑将令其让路。村人答以此埂让，则田无界；田无界，则明年无食。骑将谓己有令。村人曰：「吾有口。」相持至日暮，骑将策马绕行。村人乃散，各归其田，无人言胜。埂在翘英庄田头，以土垒成，垒毕以石压，石为溪中圆石。"
 CYG_Spirit_Shared_Fields:"田账陈于庭"
 CYG_Spirit_Shared_Fields_desc:"荒地归村社，按户分种，收成按劳而分。有私心者不禁，惟不许掩。每岁秋，村社设长桌于树下，凡账皆摊于桌：某户种几亩，得几石，欠几斗，一一书之。富户欲以酒肉易其账，社老答以账在桌上，酒肉在桌下。富户谓桌下亦可谈。社老曰：「桌下所谈者，明日仍上桌。」富户乃止。长桌设于翘英庄树下，凡账皆摊于桌，一一书之。"
 CYG_Spirit_Land_and_Soil:"两律陈一案"
 CYG_Spirit_Land_and_Soil_desc:"水土之约与旧律，摊于同一桌，逐条比对。合者留，冲者当面说清。说至第七条，两造争执，一谓旧律先立，一谓新约后出。社老乃言：先立者未必当守，后出者未必当从。两造问然则以何为准。社老取二纸，并置一处，曰：「以不伤此谷为准。」两造视纸，良久，各删其三条。两纸并置于沉玉谷社仓案上，逐条比对，各删三条。"
 CYG_Spirit_Selfsufficient_Valley:"谷足不外求"
 CYG_Spirit_Selfsufficient_Valley_desc:"够用则止，不求有余。有余则须易钱，易钱则须看人色，看人色久，则田不能保。此账谷中核之多年，核至今日，犹是此数。少年自外归，言外间之富。谷老听毕，问富者之田，尚在其手乎。少年答以已易主三。谷老曰：「吾谷之田，三百年不易主。」少年不语，次日随众下田。沉玉谷之田三百年不易主，田埂以石垒，石缝生草。"
 CYG_Spirit_Free_Communes:"旗收而田存"
 CYG_Spirit_Free_Communes_desc:"旗收，地存。谷中十余村社，各立一约，遇大事乃聚，聚则推一人执笔，事毕笔还。外来者问无总领，何以御外。社老答以御外者不在一人，在十余人肯同时关门。问门闭则市绝。答以市绝可复，地失不可复。问者视其村，门户相望，炊烟相接，而无一处悬旗。沉玉谷中十余村社，门户相望，炊烟相接，无一处悬旗。"
 CYG_Spirit_Soil_Remembers:"壤不忘其功"
 CYG_Spirit_Soil_Remembers_desc:"土被翻松，则记之；被伤，则亦记之。人走，土犹代人记。老农将死，语其子，谓己一生所治者此三亩。子问有何可记。老农答以掘之深三尺，见黑土，则吾在。子后掘之，果见黑土，厚一尺，捧之，土中有草根，盘结如网。子乃取一掬，置于父棺之上，余者还田。翘英庄之土最厚，掘三尺见黑，庄人谓之老土，不肯轻卖。"
 CYG_Spirit_Green_Pact:"青约不立国"
 CYG_Spirit_Green_Pact_desc:"谷中不立国，不树旗，惟与愿守水土者相结。此谷非谁之谷，特吾辈愿以命守之之地。或问既不立国，则此地属谁。答以属守之者。问不守者何如。答以不守者亦居此，亦食此，然其言不足重。问何以为别。答以守者之名在册，不守者之名不在册。册不示人，惟藏于树下石中。约册藏于灵濛山下石中，石上有苔，非谷中人不能寻。"

 CYG_PW_Soil_Tier_1:"水土之阶"
 CYG_PW_Soil_Tier_1_desc:"水土崩坏。泉眼枯竭，田垄沙化。谷中抓土一把，大半握不住，风过即散。战后归来者立于垄上，认不出哪一垄为自家。有老妇蹲下抓土，抓半晌，只抓出一把碎瓦，在襟上拭净手，曰：「地亦会死。」"
 CYG_PW_Soil_Tier_2:"水土之阶"
 CYG_PW_Soil_Tier_2_desc:"水土将复。泉眼回潮，坡上见草。此地尚虚，然已一寸一寸往好处挪。战前走掉之人渐有回者，回来看一眼旧屋基，不哭，只把草一把一把拔净，拔完在地上坐一阵，方去看渠。渠口淤塞，他用半日掏净，掏出之泥堆在自家田头。"
 CYG_PW_Soil_Tier_3:"水土之阶"
 CYG_PW_Soil_Tier_3_desc:"水土渐养。梯田成片，草木成荫。谷中孩子头一回见成片开花之坡。战后第三年，谷中办一场席，桌上只有三样菜，来者挤满两层院墙。蓝砚坐末席，未举箸，只看众人吃。席散，她把剩菜分作四包，令各带回。"
 CYG_PW_Soil_Tier_4:"水土之阶"
 CYG_PW_Soil_Tier_4_desc:"水土归元。旧伤初愈，地力渐厚。多少年透支，终在这一茬新苗里一点一点还回来。战后立碑者多，蓝砚独不许立。有人问，她指坡上青苗，曰：「此即碑。它长一年，便替我记一年。」"
 CYG_PW_Soil_Tier_5:"水土之阶"
 CYG_PW_Soil_Tier_5_desc:"水土大盛。风过草伏，满目青山。生机越厚，蓝砚反倒越警惕：福气来得越厚，越经不起有人动一次歪念。她在谷口立一木牌，只写四字：留一分与后人。旁人嫌其太简，她不改，只教村童日日念此四字。"
 CYG_PW_Spirit_Tier_1:"山心之阶"
 CYG_PW_Spirit_Tier_1_desc:"山心涣散。人心浮动，各奔生路，谷中谁都不想多留一天，天一亮就想着出谷去。战后头一年，谷口每日有人走，走者不回头。蓝砚立于路口，不问去处，只递一碗水。有人接，有人不接；接者亦有走掉。她数过，一年走二百七十一人。谷口在遗珑埠，路惟一条，出则上山，山道多碎石。"
 CYG_PW_Spirit_Tier_2:"山心之阶"
 CYG_PW_Spirit_Tier_2_desc:"山心初聚。有人愿留，有人肯干，谷中总算有几户打定主意把根重新扎下。留下头一件事不是垦田，乃修祠堂。堂中不供神，只挂一块木板，板上刻留守者之名，刻到第七个名字时，刻字者手微抖，刀锋斜出一线。有人问其何故，他只摇头，把手拢进袖里。祠堂在翘英庄东，屋三间，梁上有旧年谷穗一束，久已干枯。"
 CYG_PW_Spirit_Tier_3:"山心之阶"
 CYG_PW_Spirit_Tier_3_desc:"山心相连。村社相通，守望相助，谁家断粮，都不必再一个人硬扛。四村合修一条水渠，渠过谁家田，谁家便出三日工。有村不肯出人，只出粮。众议其罚，蓝砚不许罚，谓粮亦是一力。于是无罚，次年此村出人最多，出粮亦最多。渠成之日，四村同饮一瓢水。水渠过四村之田，渠在沉玉谷中，渠底见石，十年不通。"
 CYG_PW_Spirit_Tier_4:"山心之阶"
 CYG_PW_Spirit_Tier_4_desc:"山心如铁。人人守土，寸步不让。谷中无一局外人，连孩子亦记得自家田在何处。战时来劫之匪再至谷口，见田间老幼各自执锄而立，不呼不奔，只站着看。匪首勒马良久，掉头去，此后十年不入此谷。谷中人亦不追，只把锄头扛回肩上。遗珑埠谷口石上有旧刻，字已磨平，惟余一道浅痕。"
 CYG_PW_Spirit_Tier_5:"山心之阶"
 CYG_PW_Spirit_Tier_5_desc:"山心成岳。众志如山，不可撼动。此凝聚守住了整座谷，亦可能在某一刻，使谷中人再听不见谷外之哭声。战后港中来人求粮，谷中议三日，终只允半数。蓝砚不驳众议，只在册尾添一行，记今日少与之数，自认于吾辈账上。此一行后为港中人所见，无人言谢。港中求粮之车停于遗珑埠牌前，轮陷土中寸许。"
 CYG_PWCombo_Both_High:"水土相济"
 CYG_PWCombo_Both_High_desc:"水养山，山护水。谷中那套慢功夫，总算使璃月港亦随之缓下来。蓝砚却清楚：被人跟着学，比被人挡着更难收场。她尝对来访诸吏言：「尔等效我之法，须先效我之不急。」众吏笑而应之，归后仍旧急。"
 CYG_PWCombo_Both_Low:"两不相济"
 CYG_PWCombo_Both_Low_desc:"水未治住，山亦未守住。谷中所唱，仍旧那几支歌；唱至末了，连唱歌者亦少。秋后清算，仓中只余三石陈米，蓝砚命留作谷种，不许动。有饿者夜撬仓门，她立门内，递出半袋，曰：「此为种，非为食。」翘英庄仓门之内钉旧木牌一，书三石之数，牌下压当年谷口之沙一撮。"
 CYG_PWCombo_A_High:"闭谷自守"
 CYG_PWCombo_A_High_desc:"水土养回，山心亦齐，惟谷口之门再未往外开过。粮够吃，谷外之事一概不知。有商人来贩盐，立于门外三日，无人应。第四日蓝砚遣人送出一袋米，附一纸，纸上只四字：「路远，勿来。」盐贩所立之处在沉玉谷西口，其旁石上有旧车辙，辙深而草没。"
 CYG_PWCombo_B_High:"心向四方"
 CYG_PWCombo_B_High_desc:"山心齐，门亦开着，惟谷中水尚未养回。名声走得比苗快，早晚要回头补一趟土。果然不出二年，外来求种者踏破谷口，谷中人日日应酬，田里草长过膝。蓝砚见状，闭门三日，不见一客，只下田。闭门三日之居在翘英庄溪南，第三日暮，其田草已拔半。"

