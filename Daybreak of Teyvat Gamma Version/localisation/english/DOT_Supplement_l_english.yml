# ===== 开局国家介绍 =====
 DOT_INTRO_NOW_ABY:0 "§YI. The Order of the Abyss§!\nThe Abyss Order is built around the survivors of Khaenri'ah, lurking, infiltrating and agitating across Teyvat. Its aim was never to hold land, but to tear the curtain open and let the Abyss back into this world.\n\n§YII. Power and Its Price§!\nAbyssal power can make a champion quickly, and just as quickly ruin a person. Inside the Order nobody minds: in their eyes the individual never mattered.\n\n§YIII. Present State§!\nThe Order backs proxies everywhere, working with the Fatui while guarding against them. Its real trump card is not on the battlefield, but in the hearts of those who still believe in it.\n\n§RConclusion: the Abyss is in no hurry to win. It only waits for the world to crack on its own.§!"
 DOT_INTRO_NOW_ANR:0 "§YI. The Forgotten Forest§!\nWolvendom has never had much to do with Mondstadt's industry, its expeditions or its court intrigues. There are no real cities here, only hunting grounds, forest roads and scattered villages. §8Chasing Game for Meat§!: people live off the mountain; §8Rangers of the Wood§!: order is kept by hunters of their own accord; §8Refugees Pour In§!: in troubled times, more and more people treat this place as their last way out.\n\n§YII. The Wolf King's Shadow§!\nAndrius still sleeps in this land, and the wolves and their kin never truly left. The people of Wolvendom seldom speak of him, but whenever Mondstadt stumbles, this land remembers what it holds.\n\n§YIII. The Deadlock§!\nRefugees bring people, and with them hunger and conflict. Wolvendom has no industry, no tax system and no seat at Mondstadt's table, unless it first proves it has strength.\n\n§RConclusion: this forest will either be swallowed by war, or grow its own nation out of it.§!"
 DOT_INTRO_NOW_CYG:0 "§YI. A Valley of Tea and Jade§!\nChenyu Vale lives on the tea of Qiaoying Village and the jade of its mountains, and for centuries has paid tax and tribute to Liyue Harbor. The valley does not lack for a living, it lacks a voice: the port sets the tax, the guilds hold the roads, and even a mountain path must wait on the Yuehai Pavilion's mood.\n\n§YII. A Chance in Chaos§!\nWith the Qixing at each other's throats, the adepti leaving their mountains and Keqing in revolt, Liyue Harbor has no attention to spare for the west. For the first time the valley realizes it need not pay that tax.\n\n§YIII. The Price§!\nStanding alone means cutting the trade road to the port. Tea cannot be sold, and jade cannot buy grain. The elders of the valley argue endlessly over it.\n\n§RConclusion: Chenyu Vale must decide whether to remain a rich county, or become a poor country.§!"
 DOT_INTRO_NOW_DRA:0 "§YI. A New Nation on the Peak§!\nAfter the second development plan, Dragonspine is now one of Mondstadt's most prosperous and most densely populated regions. Speaker Albedo governs like a scholar: inviting settlers, opening resources, organizing trade, and putting the facilities left by Sal Vindagnyr back to work.\n\n§YII. Loyalty and Self-Preservation§!\nDragonspine is loyal to Mondstadt and to freedom, but that loyalty rests on the Knights still being able to offer shelter. Once the Knights take a crippling blow, a region with industry, people and organization has no reason to keep obeying an empty shell.\n\n§YIII. The Dark Side Within§!\nAlbedo's research never stopped. Sucrose runs experiments in the laboratory that no one else understands; Lisa commands a second network; and the one who should not exist is somewhere gathering strength for his own scheme.\n\n§RConclusion: Dragonspine is Mondstadt's sharpest blade, and the one most likely to turn in the hand.§!"
 DOT_INTRO_NOW_DVA:0 "§YI. The Front Line of the Dragon Calamity§!\nWind Dragon March is the closest strip of land between Mondstadt and Dvalin. Outrider Amber holds it with a small company: evacuating villagers, clearing bandits, and watching where the dragon goes.\n\n§YII. A Thin Foundation§!\nThe march has no real industry. Its finances rest on stipends from the Knights and whatever the localities can raise. The population keeps draining away because of the calamity; those who stay are mostly the old who cannot leave and the stubborn who will not.\n\n§YIII. A Direction Not Yet Set§!\nThe questions here are messy and real: whether to build factories, whether to form communes, whether to set up an intelligence service, whether to ally with a neighbour. Every choice must be made without enough resources.\n\n§RConclusion: Wind Dragon March has no fixed shape yet. Its road is for the player to walk out.§!"
 DOT_INTRO_NOW_FAV:0 "§YI. The Second Verse of the Wind's Song§!\nA thousand years ago the Church of Favonius split in two: one wing drank with princes, the other went down to commoners and slaves, and swore to rise when the second verse of the song was sung. Today's church opposition raises that same banner again, claiming the Church has abandoned the Wind God's teaching and needs another reformation.\n\n§YII. Two Faces of One Order§!\n§8Internal Struggle§!: some see the movement as a tool to seize power in Mondstadt, others as a child that needs teaching. Rosaria wants a blade that can face what is coming; Barbara wants to pull the movement back to a moderate road.\n\n§YIII. The Situation§!\n§RHeterodox sect: hated by the public§!. To the orthodox Church they are heretics, to the nobles a source of unrest, to the Knights a problem to be dealt with. Their only asset is the support of the faithful at the bottom.\n\n§RConclusion: the church opposition will either become Mondstadt's new church, or one more heap of fuel burned in a civil war.§!"
 DOT_INTRO_NOW_FON:0 "§YI. The Nation of Judges§!\nAfter Egeria's death Furina took the throne, and the day to day work of government fell to Chief Justice Neuvillette. The institutions of the former Hydro Archon were reorganized root and branch, the old power of the noble council replaced by a judicial system. Fontaine is founded on law and judgment: every dispute must end in a statute and a verdict.\n\n§YII. Prosperity and Sluggishness§!\nFontaine's industry is the most advanced in Teyvat: guard mechanisms, war machines and cameras all come from here. Beneath §8the economic peak§! sit §8an inefficient government§! and §8a bureaucratized academy§!: the first slows every decision, the second lets institutional drag eat the technological lead. Reconstruction poured resources into civilian life, leaving armaments and public order aside; the Marechaussee Phantom keeps complaining of short staffing.\n\n§YIII. Undercurrents§!\nThe Order's avatar and the surging undercurrent exist at once. Advocates of a strong leader want someone who can decide; revivalists miss Remuria; revolutionary terrorists move between the factories and the Fleuve Cendre; the guild integration bloc wants the guilds to take over everything. Fontaine's stability rests on the premise that nobody is actually satisfied.\n\n§RConclusion: this country's script has only finished its opening scene.§!"
 DOT_INTRO_NOW_GUN:0 "§YI. The Family That Guards Mondstadt§!\nThree thousand years ago Gunnhildr laid down the ancestral charge to guard Mondstadt forever, and every generation since has produced clergy and knights. The family's roots are in the north, on the border with Snezhnaya, where it has held the frontier for centuries.\n\n§YII. A Thin Purse§!\n§8A rudimentary economy§!: the northern land is poor, industry and commerce are weak, and the family's finances have been tight for a long time. Jean's appointment as Acting Grand Master raised the family's standing to its peak, but neither troops nor grain grew with it.\n\n§YIII. The Dilemma§!\nThe family cannot agree on the situation: one side would back Albedo fully and treat Dragonspine's industry as Mondstadt's future; another would back Barbara and rally people through the Church; others propose marriages and alliances, drawing Diluc or Eula into the same camp.\n\n§RConclusion: Gunnhildr must decide which side it stands on before Mondstadt comes apart.§!"
 DOT_INTRO_NOW_GYP:0 "§YI. The Night Watch of the Old Order§!\nGanyu and the eight bureaus of the Yuehai Pavilion are the machinery that actually runs Liyue: paperwork, tax rolls, couriers, courts, all of it held up by the eight bureaus. After the Archon withdrew, this machinery became the only thing still holding Liyue together.\n\n§YII. The Difficulty§!\nThe bureaus command no troops and hold no independent purse; everything must be done with the Qixing's permission. Keqing wants revolution, Ningguang wants centralization, the adepti want rule by gods, and the bureaus can only shift between the three.\n\n§YIII. The Hidden Card§!\nWhat the bureaus really own is the everyday. Everyone knows that if the eight bureaus were removed, Liyue would stop working the next day. That irreplaceability is their only weapon.\n\n§RConclusion: the Yuehai Pavilion does not seek to win, only to keep Liyue standing until everyone else has finished fighting.§!"
 DOT_INTRO_NOW_HIL:0 "§YI. A People Treated as Monsters§!\nHilichurls live scattered among the wilds and ruins of Teyvat, and every nation hunts them as monsters. They have no script, no state, and no one has ever seriously asked where they came from or what they want.\n\n§YII. A Union of Tribes§!\nThe Hilichurl tribal league is one of the very few attempts to gather the scattered tribes together. Shamans, warriors and hunters each have a voice, and the league itself is loose and fragile.\n\n§YIII. The Situation§!\nEnemies on every side. However the seven nations fight among themselves, clearing out hilichurls is the one thing they can all agree on.\n\n§RConclusion: if this league is to survive, it must first prove it is not a monster.§!"
 DOT_INTRO_NOW_INA:0 "§YI. The Hollow Shell of Eternity§!\nThe Raiden Shogun has withdrawn into the Plane of Euthymia, handing all government to the three commissions. The Sakoku Decree cut off foreign contact, the Vision Hunt Decree seized Visions, and both were written under the name of Eternity while their day to day enforcement was left entirely to commission officials. Five hundred years of rot broke out all at once in this generation: §8the Tatarigami§! laid waste to wide stretches of land, §8the Vision Hunt Decree§! stirred public fury, §8the Sakoku Decree§! suffocated industry and trade.\n\n§YII. The Quality of the Three Commissions§!\nTenryou holds the troops, Kanjou the purse, Yashiro the rites and the shrines. The Kujou and Hiiragi houses profited from corruption; only the Kamisato house still strained to hold things up. Training was slack, weapons were old, and the shogunate was no longer the army that had fought so well five hundred years before.\n\n§YIII. The Banner of Watatsumi§!\nSangonomiya Kokomi rose in arms calling for the abolition of the Vision Hunt Decree, and the resistance swept forward. But after they entered Yashiori Island, some zealots broke the wards holding the Tatarigami, the power leaked out, all of Inazuma suffered, and the resistance's advance broke with it.\n\n§YIV. The Fatui's Wager§!\nSnezhnaya shipped Delusions to both sides under the name of aid. Users gained power and paid with their lifespan. The longer the war ran, the more Delusions sold, and the more Inazuma bled.\n\n§RConclusion: if the Mikage Furnace at Tatarasuna ever loses control, the contamination cannot be contained. Eternity can no longer hold.§!"
 DOT_INTRO_NOW_KQP:0 "§YI. The Resolution of the Yuheng§!\nKeqing has formed a revolutionary committee as Yuheng, openly calling for the abolition of the old Qixing system and the replacement of rule by gods with rule by people. She turned Qiming thought from talk in the docks and work sheds into the program of a government, something unseen in Liyue's three thousand years.\n\n§YII. What She Holds§!\nThe committee controls Liyue Harbor's industry and its workers' organizations, the Blackcliff Forge and part of the docks, and its capacity to mobilize far outstrips the old bureaucracy. But its finances depend on short term port revenue, it has almost no navy, and grain must be bought from outside.\n\n§YIII. Enemies on All Sides§!\nNingguang of the Tianquan sees it as rebellion, the Yuehai Pavilion coalition as a destroyer, the adepti as usurpers who broke the contract. If the committee cannot win a decisive victory early in the civil war, all three will crush it together.\n\n§RConclusion: the revolution has no way back, only forward, or annihilation.§!"
 DOT_INTRO_NOW_LAW:0 "§YI. The Noble House in the Dust§!\nThe Lawrence clan once ruled Mondstadt, and now lives in the shadow of the Knights. The etiquette remains, the fief is gone; the titles remain, the taxes are gone. The elders still style themselves the light of Mondstadt, while the young treat power as a badge to wear.\n\n§YII. The Chance§!\nThe Knights' main force is away on expedition and the city is empty; the autonomous marches each go their own way; the Church is split; the dragon calamity is unresolved. For a family that wants restoration, this is the best chance in a thousand years.\n\n§YIII. Outside Help§!\n§8Closer ties with Snezhnaya§!: the Fatui are glad to fund anyone who can throw Mondstadt into disorder. But those who borrow must eventually repay.\n\n§RConclusion: Lawrence will either take Mondstadt back, or be erased from history for good.§!"
 DOT_INTRO_NOW_LYY:0 "§YI. Gods and People, a New Order§!\nAfter the Archon withdrew, Liyue did not fall into chaos, but it also no longer had a voice that could settle matters with one word. The Qixing govern, the Yuehai Pavilion handles administration, the contract remains the foundation of the state, and every matter of interest is bound by statute. The problem is that a contract can bind a transaction, but not the human heart.\n\n§YII. Rich but Uneven§!\nLiyue Harbor's wealth is the greatest of the seven nations: merchant ships reach Inazuma in the south and Mondstadt in the north, and the Feiyun Commerce Guild and the Crux Fleet each hold their own ground. Beneath the prosperity are three ailments: §8a harbor where wealth pools§! concentrates capital in a few families; §8labor dispatch§! strips the workers of bargaining power; §8low quality industry§! lets factories compete on volume while technique stagnates. The three together are exactly the soil in which Qiming thought spread so fast among the docks and work sheds.\n\n§YIII. Four Powers in Contest§!\nKeqing of the Yuheng argues for thorough rule by people and thorough change, and has already become a faction within the Qixing; Ningguang of the Tianquan favours holding to what works, keeping the old order through law and trade routes; the Yuehai Pavilion coalition tries to balance the two with bureaucracy; the adepti see rule by people as a betrayal of the contract, and watch from among the clouds of Jueyun Karst.\n\n§YIV. Outside Pressure§!\nThe Fatui move about the country; the Northland Bank's loans and Snezhnaya's aid are both ropes. Beneath the coastal waters, Osial, the Vortex Archon the Lord of Geo once suppressed, no longer seems content with eternal imprisonment.\n\n§RConclusion: Liyue's next step will decide whether it remains a nation of contracts, or becomes something else.§!"
 DOT_INTRO_NOW_MOT:0 "§YI. A Central Government in Name Only§!\nThe Knights of Favonius nominally govern all of Mondstadt, but real power lies scattered among the autonomous marches: Gunnhildr holds the north, Ragnvindr holds Dawn Winery, Dragonspine stands on its own, Wolvendom sits outside the system, and Wind Dragon March faces the calamity directly. Grand Master Varka took four fifths of the main force on an expedition and has not returned; the city has only recruits and Acting Grand Master Jean Gunnhildr. The centre has no independent purse and no power to appoint or dispatch, and survives on the taxes the marches send in.\n\n§YII. Cracks Beneath the Prosperity§!\nFontaine technology has poured in from the west, factories line the shores of Cider Lake, the industrial workforce has grown fast, and Mondstadt's economy is at an unprecedented high. The gains are not shared: wages are pressed down, guilds and nobles hold the channels, and the new working class is beginning to take up Qiming thought from the south. The Church has seen no miracle for a long time and its orthodox clergy are corrupt; Rosaria has set up an opposition in the east, while Barbara tries to pull the movement back to a moderate road with a theology of liberation.\n\n§YIII. The Crisis at Hand§!\nDvalin's attacks grow more frequent, and trade routes and villages suffer one after another. The Lawrence clan is quietly contacting old nobles and foreign powers, and the likes of Schubert no longer hide their intent to restore the old order. If the dragon calamity and a civil war break out together, the Knights will have neither the troops to suppress the marches nor the prestige to summon them.\n\n§RConclusion: the question is not whether Mondstadt will fall into disorder, but when.§!"
 DOT_INTRO_NOW_NAT:0 "§YI. The Fire God's New Order§!\nMavuika took the seat of the Pyro Archon as the undefeated flame, and by sheer prowess and will drew the scattered tribes back together. §8The ancient name system§! binds each person's fate to their tribe and to the names of their ancestors; it is a mechanism of mobilization and of control at once.\n\n§YII. The Six Tribes§!\nThe Masters of the Night Wind, the Children of Echoes, the People of the Springs, the Flower Feather Clan, the Scions of the Canopy and the Collective of Plenty each carry their own heritage and interests, paying the Archon lip service while watching to see how things fall. Mavuika wants unity, the tribes want autonomy, and sooner or later the two must be laid on the table.\n\n§YIII. The Abyssal Breach§!\nThe rifts of the Ashfall Sea were never truly sealed, and §8the spreading Abyssal corrosion§! is a price Natlan pays every day. The war against the Abyss is not an option but the normal state of things; the only question is who commands, and by whose rules.\n\n§RConclusion: Natlan's unity is still new, new enough that it cannot survive one defeat.§!"
 DOT_INTRO_NOW_PRI:0 "§YI. The Sleeping Order§!\nThe Heavenly Principles hold the laws of Teyvat: the seven gods keep their own lands, the elements stay in their places, and mortal presumption is held in check. §8The sleeping Heavenly Principles§! does not mean the order has vanished, only that for now it no longer acts in person.\n\n§YII. Countdown to Dawn§!\n§8Dawn§!: the system of the Heavenly Principles is approaching a point of no return. The cracks left by the Khaenri'ah calamity have not healed, the Abyss is expanding, the seven nations rise and fall against each other, and the hand that holds it all together has not moved for a very long time.\n\n§YIII. The Situation§!\nThe Heavenly Principles rely on neither diplomacy, nor trade, nor popular will, but on the rules themselves. And once someone proves the rules can be broken, that power drains away fast.\n\n§RConclusion: the Heavenly Principles will either wake, or be replaced.§!"
 DOT_INTRO_NOW_RAG:0 "§YI. A Family Outside the System§!\nSince the days of the Dawn Knight, Ragnvindr has cast itself as the judge outside the system. Diluc does not acknowledge the Knights' authority and punishes and rewards by his own judgment. In peace that posture is integrity; in troubled times it is the pretext for a separate domain.\n\n§YII. The Family Fortune§!\nDawn Winery is one of Mondstadt's most profitable enterprises, and the wine trade, the trade roads and the connections are all in the family's hands. §8Industrial depression§! has cut into profits, border smuggling eats at legitimate trade, and the family is deeply split on whether to step in.\n\n§YIII. The Present Situation§!\n§8Mondstadt's politics are in disarray§!, the Knights are weak, and every region looks for its own way out. If Ragnvindr does nothing, it will watch Lawrence or the church opposition take the first move; if it acts, it tears Mondstadt open with its own hands.\n\n§RConclusion: Diluc must decide whether he is a night watchman or a nation builder.§!"
 DOT_INTRO_NOW_SAN:0 "§YI. The Lonely Isle of Watatsumi§!\nSangonomiya rules Watatsumi Island, a poor and crowded land that has lived for generations on fishing and salt. After the Vision Hunt Decree began, those holding Visions on the island were taken one after another, and the resentment finally turned into blades. §8Watatsumi's devotion§! makes the whole island willing to die for Kokomi, and §8a hundred stratagems§! let her turn that will into tactics.\n\n§YII. The Price of Delusions§!\nThe resistance has held out this long on Delusions supplied by the Fatui. §8The price of a Delusion§! is no abstraction: every user trades lifespan for power, and batch after batch of fighters die quietly after the victory.\n\n§YIII. The Mistake at Yashiori§!\nAfter entering Yashiori Island, some zealots broke the wards that held the Tatarigami. The power leaked, all of Inazuma suffered, the resistance's advance broke off, and the shogunate gained room to breathe and regroup.\n\n§RConclusion: Sangonomiya has won once already, but the way it won is destroying everything it meant to protect.§!"
 DOT_INTRO_NOW_SDH:0 "§YI. The Waste of a Thousand Ravines§!\nThe Desert of Hadramaveth is the poorest stretch of the sands: wind carved canyons, abandoned villages, dry riverbeds. The tribes here live by herding and raiding, few in number and hard in temper.\n\n§YII. The Forgotten People§!\nOn the Akademiya's maps this is close to blank space. No taxes, so no governance; no governance, so no one cares whether they live or die.\n\n§YIII. Gathering§!\nFor that very reason, runaways, the dispossessed and those driven out of the rainforest keep gathering here. The waste is turning into a powder keg no one can control.\n\n§RConclusion: Hadramaveth has nothing left to lose, and so it dares anything.§!"
 DOT_INTRO_NOW_SGD:0 "§YI. The Sands of the Gilded Brigade§!\nThe Gilded Sands are the richest stretch of the desert: trade roads run through, ruins lie everywhere, and brigades stand on every side. The people here recognize no Akademiya statute, only contracts, tribes and blades.\n\n§YII. The Memory of the Red King§!\nA thousand years have passed since the Red King died, and the desert's prosperity faded with him. But the cry of a Scarlet Sumeru never disappeared; each time the rainforest pressed harder, it was lit again.\n\n§YIII. The Situation§!\nThe brigades each go their own way, the tribes kill one another, the trade roads are plundered, the oases shrink. The desert has the will to resist, but no united strength.\n\n§RConclusion: what the desert lacks is not courage, but a name that can gather everyone under it.§!"
 DOT_INTRO_NOW_SGS:0 "§YI. The Belt of the Sand Sea§!\nThe Land of Upper Setekh sits at the edge of the desert, the transition between rainforest and sand sea. There are oases here, and ruins; settled farmers, and wandering brigades.\n\n§YII. Pressure from Both Sides§!\nThe rainforest sees this as a buffer, the desert as a passage. Whichever side moves first will begin by taking this belt.\n\n§YIII. What It Can Bargain With§!\nThe agriculture of the oases, the caravans that pass through, and the Red King era technique left in the ruins are the only chips this land has to bring to a negotiation.\n\n§RConclusion: a nation on a passage is either trodden over, or collects the toll.§!"
 DOT_INTRO_NOW_SHP:0 "§YI. The Adepti's Discontent§!\nThe three-eyed and five-manifest adepti have guarded Liyue since the Archon made the contract. To them the contract draws its force from the witness of gods and adepti, not from the majority of mortals. The Archon's withdrawal, the Qixing's rule, Keqing's call for rule by people, every step chips away at the sanctity of the contract.\n\n§YII. Leaving the Mountains§!\nShenhe leads the adepti down. Their power is still Liyue's sharpest weapon, but the adepti are poor at governing people, know nothing of commerce and nothing of diplomacy, and once they actually rule, the problems have only begun.\n\n§YIII. Friends and Enemies§!\nThe adepti see the revolutionary committee as usurpation, the Yuehai Pavilion as weakness, the Tianquan as a false claimant. Their one common trait: the three-eyed and five-manifest never explain themselves to mortals.\n\n§RConclusion: the adepti can hold Liyue, but they may not be able to govern it.§!"
 DOT_INTRO_NOW_SNE:0 "§YI. The Tsaritsa's Will§!\nEvery order in Snezhnaya ultimately comes from the Winter Palace. The Tsaritsa has bound the Harbingers under the imperial decree of the pale star and recalled the finest of them to the homeland, something unseen in the past century. The Fatui are no longer merely a tool of diplomacy and infiltration; they are being remade into an army that can be thrown into the field at any moment.\n\n§YII. Three Pillars§!\n§CThe Deep Winter Plan§!: the whole economy and industry folded into long term war preparation; §8the Fatui officers' corps§!: actual command of the armed forces concentrating into the officer corps; §Cthe mausoleum and the birch§!: a whole arrangement of death, memory and national identity that makes sacrifice bearable. The three reinforce one another and form the base of Snezhnaya's capacity to mobilize.\n\n§YIII. The Cost§!\nMobilization costs money. Factories run three shifts, the railways never stop, and the conscription age keeps dropping. Local mayors and the arms conglomerates skim from rationing and contracts, and famine in the far provinces is pressed into a single line on a report.\n\n§RConclusion: Snezhnaya is already a war machine. The only question is who it grinds up first.§!"
 DOT_INTRO_NOW_SUM:0 "§YI. A Divine Nation Without a God§!\nFive hundred years have passed since the death of Greater Lord Rukkhadevata. The Lesser Lord Kusanali the Akademiya brought back was installed in the Sanctuary of Surasthana, a god in name and a prisoner in fact; the sages of the six darshans rule arbitrarily in the name of the divine will, and the power of Grand Sage Azar can no longer be checked. §8The imprisoned god§!, §8the divine creation project§! and §8the influence of the Withering§! are the three pillars of Sumeru's present state.\n\n§YII. The City of Wisdom at a Standstill§!\nThe Akasha has seen no real advance in five hundred years, and basic theory and applied science have stalled alike. Scholarship has decayed, scholars fight over place, and academic resources are held by powerful houses. The Withering keeps spreading through the rainforest, Eleazar has no cure, and the Akademiya is neither able to deal with it nor willing to admit its own failure.\n\n§YIII. Rainforest and Desert§!\nThe desert tribes have long been handled roughly and have been drifting away for ages. The gilded brigades and the surviving tribes invoke the restoration of the Red King and openly question the rainforest's right to rule. The Akademiya's hold on the desert is visibly weakening.\n\n§YIV. A Foreign Hand§!\nSnezhnaya's Doctor has been invited into Sumeru to take part in the divine creation project. The Fatui's involvement is no kindness; it treats Sumeru as a testing ground.\n\n§RConclusion: Sumeru's problem is not that it has no god, but that a group of people rule in the name of a god, and neither revere the god nor love the people.§!"
 DOT_INTRO_NOW_VAN:0 "§YI. A Nation in a Dream§!\nVanarana grows in the songs of the Aranara, and the forest remembers everyone who has ever come. §8Mahavanaranapna§! holds this dreamlike land together, letting the Aranara survive in the cracks between human realms.\n\n§YII. Marana§!\n§8The calamity of Marana§!: the corrupted land keeps spreading, and the dream is no longer safe. All the Aranara can do is slow it, never cure it.\n\n§YIII. No Talent for Politics§!\n§8No talent for politics§! is no modest disclaimer. The Aranara do not understand human contracts, taxes or diplomacy, and on Sumeru's board they are almost certain to be sacrificed.\n\n§RConclusion: the forest will remember, but the forest will not fight anyone's war.§!"
 DOT_INTRO_NOW_YLH:0 "§YI. The Waterway That Holds the Harbor§!\nYunlai Sea is the gate of Liyue Harbor: merchant ships entering and leaving, warehouses running north and south, and smuggling that cannot bear the light all pass through these waters. Whoever holds the Yunlai Sea has Liyue's trade by the throat.\n\n§YII. The Local Powers' Reckoning§!\nLocal strongmen and the boat gangs have worked here for years, owing nothing to the Qixing and answering nothing to the Yuehai Pavilion. When the disorder began, they saw at once that it was better to raise their own flag than wait to be absorbed.\n\n§YIII. The Outside Lure§!\nSnezhnayan merchants and the Fatui both pay well for passage and berths in the Yunlai Sea. The money comes fast, and the rope follows fast.\n\n§RConclusion: whether the flag over the Yunlai Sea changes depends only on the price and the moment.§!"
 DOT_INTRO_WAY_ABY:0 "§YCurrent completeness§!\nThe Abyss Order has no focus tree of its own. In play it advances through events, generic focuses and special decisions, and the playable content is limited.\n\n§YI. Viable directions§!\nExpand influence through infiltration and proxies, stir up disorder in the nations through event chains, and wait for the right moment to appear openly.\n\n§YII. Relations with others§!\nWith the Fatui it is mutual use. With the Heavenly Principles it is a war to the death. With the nations it is purely a destroyer.\n\n§YHint:§! This faction is still in production and is not recommended for a first campaign."
 DOT_INTRO_WAY_ANR:0 "§YShared line§!\nFirst settle food and order: resettle refugees, organize hunters, open forest land, and link the scattered villages into a network that can be mobilized.\n\n§YI. Bennett: With the People§!\nTake the §Rred§! road, plant the new Qiming ideals in Wolvendom's soil, and build grassroots organization on mutual aid and mobilization.\n\n§YII. Fischl: Accelerate Toward the Future§!\nAccept the wildly imaginative situationist current and take the §Rred and black§! road, holding that human nature must be remade to accelerate the remaking of society. This leads to the most radical endgame.\n\n§YIII. Razor: Seek Common Ground§!\nTake the §Cblue§! road, weld the strengths of each faction together on the principle of consultation and mutual aid. It is the gentlest of the four.\n\n§YIV. Diona: One Step Back, Two Steps Forward§!\nTake the §Cblue§! road, work with merchants or gentry, and profit between free trade and social stability. It is the most practical and the readiest to abandon its ideals.\n\n§YHint:§! The four roads split over whether to keep the old order. Fischl's road can almost never coexist with the other three."
 DOT_INTRO_WAY_CYG:0 "§YI. Chenyu Stands Alone§!\nDeclare separation from Liyue and take the §Ymortalist§! road, making the valley its own country within its ridges and holding independence on tea, horses and mountain roads.\n\n§YII. A Nation Built on Trade§!\nDo not declare independence, but take the trade roads and tariffs into your own hands and trade economic leverage for de facto autonomy.\n\n§YIII. Choose a Master§!\nPick a side between the revolutionary committee and the Yuehai Pavilion, and trade political alignment for a place after the war.\n\n§YHint:§! Chenyu Vale is small. Any road must first solve food and armament."
 DOT_INTRO_WAY_DRA:0 "§YI. Albedo: Freedom, Peace and Stability§!\nTake the §Cblue§! road: take up the Knights' torch, settle Mondstadt's disorder quickly with a strong army and efficient administration, and bring peace and freedom back to this land.\n\n§YII. The Other Albedo: Through This Bitter Road to the Stars§!\nTake the §8black§! road: gather conspiratorial power, seize authority, and drive Mondstadt toward progress with an iron hand. The end of this road is not freedom but another kind of tyranny.\n\n§YIII. Sucrose: Innovation, Relief and Democracy§!\nTake the §Cblue and red§! road: support the people everywhere, end the civil war, infiltrate the warlords, and push social change through experiment and innovation.\n\n§YIV. Lisa: Three Years of Sharpening, One Startling Strike§!\nTake the §Cblue§! road: first build a peaceful, happy refuge amid the chaos, develop industry in quiet, and sweep Mondstadt once the wings are full.\n\n§YV. The Great Collective: Toward Ultimate Freedom§!\nTake the §8black§! road: born out of an experiment Lisa approved, it leads to an ultimate freedom free of the body's shackles, and is the least nameable of all the roads.\n\n§YHint:§! All five roads share the early focuses such as International Research Institute, Albedo's Grand Blueprint and Advancing Military Construction, and diverge in the middle."
 DOT_INTRO_WAY_DVA:0 "§YCurrent completeness§!\nWind Dragon March has a focus tree, but most branches are still in production, and some spirits and representative focuses are carried over from other factions. Judge by what you actually see in play.\n\n§YI. Domestic policy§!\nIndustrial Development Plan goes for industrialization; the First Commune Congress goes for grassroots autonomy and collectivization and is the march's most distinctive line; Establishing the Star Bureau builds intelligence and inspection organs; the Black Soil Method points to agriculture and land.\n\n§YII. Diplomacy§!\nFriend Not Foe is the alliance line; Befriend the Far, Strike the Near is the expansion line; Winter Has Come and White Waves Rise are emergency courses under outside pressure.\n\n§YIII. Miscellany§!\nAn Ordinary Day? and the Bathtub War are small story branches. They do not change the big picture but give extra events and rewards.\n\n§YHint:§! This faction is still incomplete. Try it after you know the main nation's script."
 DOT_INTRO_WAY_FAV:0 "§YI. Origins§!\nThe Story of the Church Opposition and It Began with the Cry of Mondstadt are the two openings. They decide whether the organization is born out of doctrinal argument or out of the suffering of daily life.\n\n§YII. Seizing Power and Unification§!\nFalling Star is the radical seizure line; Toward Mondstadt's Unification is the moderate expansion line. The first is fast and dangerous, the second slow and steady.\n\n§YIII. Six Teachings§!\nPractice, Prosperity, Resistance, Diligence, Freedom and Remonstrance are six teaching lines, standing for discipline, economy, struggle, production, liberty and criticism. They are the substance of the theological revolution.\n\n§YIV. Endgames§!\nThe three final focuses Born of Mondstadt's Sorrow, Seize It and Wipe All Tears lead to three entirely different endings: rebuilding, seizure, redemption.\n\n§YHint:§! The Rosaria line and the Barbara line part ways in the middle. The first leans §8hard§!, the second §Cmoderate§!."
 DOT_INTRO_WAY_FON:0 "§YCurrent completeness§!\nThe Fontaine tree currently has 22 focuses done. All three main trunks are open, but later branches are still in production.\n\n§YI. The Curtain Rises§!\nThe opening of the main line. Everything in Fontaine unfolds as a play: trials, festivals and plots are all staged on the same boards. This line decides how authority is divided between Furina and Neuvillette.\n\n§YII. The Order's Avatar§!\nBuilt around law and order, strengthening the judicial system and the Marechaussee Phantom, in an §8authoritarian§! direction that suppresses civic associations and radical currents.\n\n§YIII. The Surging Undercurrent§!\nBuilt around the underground, linking revolutionary terrorism, revivalism and the guild integration bloc, toward a §Rradical§! or §8extreme§! ending.\n\n§YHint:§! Fontaine's playable content is limited for now. Try Mondstadt, Liyue, Sumeru, Inazuma and Natlan first."
 DOT_INTRO_WAY_GUN:0 "§YI. The Family Council§!\nThe Gunnhildr Family Council is the master switch. Afterwards it splits three ways: invite Diluc and ally with Ragnvindr on a noble and gentry alliance; invite Eula and ally with the Lawrence remnant on a reconciliation road; or back Albedo or Barbara, the industry line or the church line.\n\n§YII. Backing Albedo§!\nBet on Dragonspine's industry and organization, taking the §Cblue§! road. Results come fast, but the family is placed in a subordinate position.\n\n§YIII. Backing Barbara§!\nStart from the Church and from hearts, taking the §Cblue§! road. Results come slowly but the moral foundation is firmer.\n\n§YIV. Unusual Roads§!\nThe Road Never Imagined and Chaos on the Continent of Teyvat are emergency branches: the first is a radical turn away from the ancestral charge, the second is self-preservation after Mondstadt falls into full civil war.\n\n§YHint:§! Every Gunnhildr road holds not betraying the ancestral charge as its floor, and the options that cross that line carry the heaviest consequences."
 DOT_INTRO_WAY_GYP:0 "§YI. The Pavilion Governs§!\nTake over administration with the eight bureaus at the centre and follow §Cblue§! gradual reform: straighten out taxation, officialdom and education first, and talk about the system afterwards.\n\n§YII. A New Chapter for the Pavilion§!\nRedefine Liyue's power structure through a constitution and deliberative procedure, taking the §Cblue§! constitutional road, which requires cooperation with the moderates among the Qixing.\n\n§YIII. Surviving in the Gap§!\nAmong the revolutionary committee, the Tianquan and the adepti, choose a side or play them off: whom to aid, whom to restrain, when to stay neutral. That decides whether the eight bureaus live to the end.\n\n§YHint:§! The eight bureaus have no military advantage. Any straight fight is the worst option."
 DOT_INTRO_WAY_HIL:0 "§YCurrent completeness§!\nThe Hilichurl tribal league has no focus tree of its own and advances mainly through events and generic focuses.\n\n§YI. Viable directions§!\nUnite the tribes, build a rudimentary military and ritual system, and look for allies or a suzerain in the gaps between the seven nations.\n\n§YII. External relations§!\nThe Abyss Order will try to draw the hilichurls in; the seven nations will mostly choose to clear them out. Any diplomatic breakthrough costs dearly.\n\n§YHint:§! This faction is still in production and is not recommended for a first campaign."
 DOT_INTRO_WAY_INA:0 "§YI. The Shogunate Repairs Itself§!\nReorganizing the Kanjou Commission and Reorganizing the Tenryou Commission start from finance and the military system to clear out accumulated rot. These are reforms inside the system: slow, but low risk.\n\n§YII. Where Authority Lies§!\nThe Inazuma Power Struggle decides who leads the shogunate: §Cthe Yae government§! with Miko in charge and relatively open, §8a military government§! with the army taking over and hard line, or a third compromise course. The three are mutually exclusive, and the tree runs differently once one is chosen.\n\n§YIII. The Fate of the Vision Hunt Decree§!\nThe Vision Hunt Ceremony and the Sangonomiya Question form the two domestic axes: either keep the decree and pacify Watatsumi by force, or abolish it, reconcile, and bring Sangonomiya into the system.\n\n§YIV. Development and War§!\nThe Inazuma Development Plan offers industrialization and infrastructure; War Propaganda paves the way for expansion and locks in conflict with Liyue and Snezhnaya.\n\n§YV. The Sangonomiya View§!\nStarting as Sangonomiya (SAN) leads from The Beginning of Resistance to Dawn of Unification, the other road of overthrowing the shogunate and uniting Inazuma."
 DOT_INTRO_WAY_KQP:0 "§YI. Morning of the Republic§!\nRebuild Liyue with the revolutionary committee at the core, abolish the Qixing, found a republic, and take the §Rred§! road. The core is the simultaneous remaking of land, factories and army.\n\n§YII. The Dawn Manifesto§!\nPut propaganda and mobilization first and spread the revolution across Liyue and to other nations of Teyvat, taking the §Rred§! road of outward export.\n\n§YIII. Whom to Fight First§!\nStrike the Tianquan first to take the port, the Yuehai Pavilion first to take the bureaucracy, or the adepti first to take legitimacy. The three orders mean three entirely different tempos of war.\n\n§YHint:§! The committee and the adepti line cannot be reconciled, while with the Yuehai Pavilion there is room to negotiate."
 DOT_INTRO_WAY_LAW:0 "§YI. Restoring the Old Line§!\nOpening the Ice and Snow Clan and Bringing It Back to the World is the restoration main line: raise the authority of the royal house again and restore the fiefs and privileges of the old nobility.\n\n§YII. Alliances and Contacts§!\nContact the Great Families, Contact the Liberals and Contact the Ambitious run in parallel, drawing in old nobles, in-system reformers and opportunists. Their support cannot all be had; whoever you choose defines the shape of the restored regime.\n\n§YIII. Outside Help§!\nCloser Ties with Snezhnaya buys money and weapons at the price of making Mondstadt a Snezhnayan client; the Visit to Guide is the course where outside powers intervene directly.\n\n§YIV. Military and Domestic§!\nMilitary Preparation, Handling the Interior and Analyzing the Lesson are the preparations before the strike: drill troops, purge the party, and review why the old nobles failed.\n\n§YV. Another Road§!\nRising Waves is a branch unrelated to restoration, pointing to a turn inside the Lawrence clan.\n\n§YHint:§! The great divide in every Lawrence road is whether to depend on Snezhnaya."
 DOT_INTRO_WAY_LYY:0 "§YI. Keqing: The Revolutionary Committee§!\nWith Morning of the Republic and The Dawn Manifesto as its program, abolish the old Qixing system and carry out Qiming thought, taking the §Rred§! road. It is the greatest change in Liyue and meets the greatest resistance.\n\n§YII. Ningguang: The Tianquan Governs§!\nIn two stages, The Tianquan Governs and The Tianquan's New Scales, rebuild central authority through law and finance, leaning §8authoritarian and oligarchic§!: stable but conservative.\n\n§YIII. Yuehai Pavilion: The Eight Bureau Coalition§!\nThe Pavilion Governs and A New Chapter for the Pavilion absorb all sides through the bureaucracy, taking the §Cblue§! road of gradual reform. It is the least drastic and the slowest to show results.\n\n§YIV. The Adepti: The Lone Crane in the Clouds§!\nThe Lone Crane Leaves the Clouds and The Lone Crane Takes the Court bring the three-eyed and five-manifest back to rule, taking the §Ymortalist§! road and pressing rule by people under rule by gods.\n\n§YV. Other Factions§!\nThe Young Master by the Sea is the course of Snezhnayan intervention; Changing Flags at Yunlai is the local turn in the Yunlai Sea; Chenyu Stands Alone is Chenyu Vale leaving Liyue. The Qixing revolutionary committee, the Yuehai Pavilion coalition and the adepti can each also start as separate factions (KQP, GYP, SHP).\n\n§YHint:§! Liyue's roads are mutually exclusive above all over whether to accept rule by people. Choosing a side sets the tone."
 DOT_INTRO_WAY_MOT:0 "§YI. Jean's Road: Reform and Freedom§!\nWith A Bright Future for Mondstadt as the general program, it splits into The Road Will Go On, which consolidates local forces, steadies the economy and advances reform, and Mondstadt's Darkest Day, an emergency branch once the situation deteriorates. If reform succeeds it leads to §CReason Triumphant§!, democracy with liberal ideals realized; if it compromises under pressure it turns to §8Back to Port§!, holding order with an iron hand and saving the ideals for next time.\n\n§YII. Noelle's Road: Called in the Crisis§!\nStarting from Acting Grand Master, it splits three ways: §CAdapting to the New Situation§!, promoting out of turn and settling unease, finally handing power back, the blue road; §8Crystal Night§!, iron rule under the name of purging betrayal, greed, decay and sloth, the black road; §RAdvancing with Song§!, winning a referendum for a second term, the red road.\n\n§YIII. Other Courses§!\nIf central authority collapses entirely, Chaos on the Continent of Teyvat sets each autonomous march on its own: Ragnvindr, Wolvendom, Dragonspine, Gunnhildr, the church opposition and the Lawrence remnant each become a player, and Mondstadt breaks into many holdings. There are also the arms line War, Production, Construction and unusual roads such as Beginning the Political Tutelage and Budding of the Black Rose.\n\n§YHint:§! The roads are mutually exclusive at key nodes, and once chosen it is hard to turn back."
 DOT_INTRO_WAY_NAT:0 "§YI. Deepening Unity§!\nConvene the Tribal Council, Spread Natlan's National Identity and Hold the War Council Against the Abyss advance in parallel, turning the tribal league step by step into a real state machine; All Fires Made One closes the unification line.\n\n§YII. The Six Tribes' Objection§!\nThe Masters of the Night Wind, the Children of Echoes, the People of the Springs, the Scions of the Canopy, the Flower Feather Clan and the Collective of Plenty each have a line of First Stirring of Objection. If central authority weakens, the six can turn to autonomy or open confrontation, and Natlan splits again.\n\n§YIII. The Gate of the Abyss§!\nThe Door That Will Not Rest points to the rift deep in the Ashfall Sea, the most dangerous and most tempting road in Natlan: fight the Abyss with the power of the Abyss.\n\n§YHint:§! Natlan's roads turn on the tug between centre and tribes, and any radical road sets off a chain reaction among the six."
 DOT_INTRO_WAY_NDK:0 "§YI. Moon and Frost§!\nDance of Snow Waves and Pale Woods is the main line of the Frostmoon Scions, recovering faith in the moon god and the way of nature; Three Phases of the Moon closes the faith line and points to the endgame of the moon god's return.\n\n§YII. Technique and Livelihood§!\nStudying the Design Manuscripts connects to the egg roll workshop and the road of machines and invention; Lunar Torque Energy develops local power and is the base of industrialization.\n\n§YIII. Choices of People§!\nTaking Prisoners decides how prisoners and displaced people are treated; Private Contact with the Consul goes by diplomacy and compromise; Integrating the Remnants settles the aftermath by force.\n\n§YIV. Red Flag§!\nThe Red Flag Flies is a road entirely unlike local tradition: remaking Nod-Krai's social structure by revolution, toward a §Rred§! ending.\n\n§YHint:§! Nod-Krai's divide is between keeping the old faith in the moon and founding a new law, and the red flag line is the most thoroughly exclusive of the others."
 DOT_INTRO_WAY_PRI:0 "§YI. Dust and Star, a Traveler's Dream§!\nThe self-perpetuation line of the Heavenly Principles: restore order among the seven nations by existing law, suppress the Abyss and presumption, and carry the §Ymortalist§! position to its absolute version.\n\n§YII. The Curtain Falls§!\nThe line where the Heavenly Principles end themselves: acknowledge that the old order has done its work and hand the world back to mortals. It is the strangest of all roads.\n\n§YIII. Relations with the Seven§!\nThe Heavenly Principles take no part in ordinary diplomacy; their action shows through chosen vessels, oracles and sanctions of the rules, so every step moves the whole board.\n\n§YHint:§! The playable content of the Heavenly Principles leans late game and endgame, and is not recommended for a first campaign."
 DOT_INTRO_WAY_RAG:0 "§YI. The Noble Heir§!\nRebuild order from the family as the base, in an §8authoritarian and aristocratic§! direction: strengthen the guard first, clear border smuggling, then turn the wine trade and trade roads into a financial and intelligence network.\n\n§YII. The Free Alliance§!\nUnite Dragonspine, Wolvendom, Gunnhildr and other autonomous marches under the common banner of freedom, taking the §Cblue§! road. The price is sharing leadership.\n\n§YIII. Make Mondstadt Great Again§!\nReshape Mondstadt around the family, taking the §8hard nationalist§! road. This line most easily clashes head on with the Knights, and most easily draws the schemes of Snezhnaya and Lawrence.\n\n§YIV. Lines in the Shadow§!\nThe Plot Against Kaeya and the Storm Gathering are two hidden lines. Once Kaeya's identity comes out, Mondstadt's intelligence system and diplomatic map both change.\n\n§YHint:§! Ragnvindr's three main lines are mutually exclusive, and the Free Alliance clashes most sharply with the other two."
 DOT_INTRO_WAY_SAN:0 "§YI. The Beginning of Resistance§!\nStarting from mobilizing the Watatsumi militia and establishing the Sangonomiya headquarters, turn the island's religious authority into a military and political organization. This is the base of every road.\n\n§YII. Dawn of Unification§!\nOverthrow the shogunate and unite all of Inazuma: that is Sangonomiya's final goal. This line must handle the remnant of the three commissions, the old shogunate officials and the Tatarigami contamination all at once.\n\n§YIII. Armistice and Treaty§!\nNegotiate with the shogunate on the abolition of the Vision Hunt Decree in exchange for de facto Watatsumi autonomy. This line preserves strength but loses some followers.\n\n§YIV. The Choice of Delusions§!\nContinuing to rely on Delusions restores combat power quickly, at the price of the whole army's lifespan; weaning off them means a long vacuum in fighting strength.\n\n§YHint:§! Every Sangonomiya road holds whether the people of Watatsumi can survive as its floor."
 DOT_INTRO_WAY_SDH:0 "§YI. The Long Road to Independence§!\nWear down any occupier with nomadic and mountain warfare, taking the long independence road. It shows results slowest but is hardest to destroy.\n\n§YII. The Red King's Banner§!\nMerge with the Gilded Sands and raise the Red King's old line together, trading for a chance at a united desert.\n\n§YIII. Tribal Council§!\nHold a loose league together by council among the tribes, avoiding absorption by any side.\n\n§YIV. The Reckoning of the Trade Roads§!\nTurn from raiding to protecting trade and trade road revenue for room to survive. It is the most practical road.\n\n§YHint:§! Hadramaveth is poor in resources, and any expansion must first solve supply."
 DOT_INTRO_WAY_SGD:0 "§YI. The Red King's Banner§!\nCall for the restoration of the Red King's old line, take the §8hard§! road, and bring every tribe and brigade under one banner.\n\n§YII. Brigade Council§!\nReplace royal power with council among the brigades and tribes, taking the republican road: loose, but hard to shatter.\n\n§YIII. The Matriarchs' Authority§!\nPut a council of elder women in power, on a road that joins tribal tradition with theocratic rule.\n\n§YIV. March on the Rainforest§!\nSettle the old account between rainforest and desert by war. It is the most direct and most dangerous expansion.\n\n§YV. Sand and Forest§!\nReconcile with the rainforest and acknowledge equality. It is the only road that needs no blood, but both sides must give up something.\n\n§YHint:§! The three desert regions' roads overlap heavily, and the relationship with the rainforest is the key to everything."
 DOT_INTRO_WAY_SGS:0 "§YI. Sand and Forest§!\nAct as mediator between rainforest and desert and trade reconciliation for neutral status. It is the steadiest return.\n\n§YII. The Reckoning of the Trade Roads§!\nTurn the passage into a business and found a state on tariffs and transit.\n\n§YIII. Shadow of a Vassal§!\nAttach to one side, rainforest or desert, for protection, at the price of sovereignty.\n\n§YIV. The Red King's Banner§!\nJoin the desert unification movement and give up independent status for a place after the war.\n\n§YHint:§! Upper Setekh is small, and an independent road demands exceptional skill."
 DOT_INTRO_WAY_SHP:0 "§YI. The Lone Crane Leaves the Clouds§!\nThe adepti enter the world and replace rule by people with rule by gods, taking the §Ymortalist§! road and rebuilding the old order around the contract.\n\n§YII. The Lone Crane Takes the Court§!\nThe adepti rule directly, turning Liyue into a nation governed by gods and adepti together, taking the hard version of the §Ymortalist§! road and breaking completely with mortal politics.\n\n§YIII. Between Adepti and Mortals§!\nKeep mortal officials and let the adepti oversee the state. It is a compromise: it steadies Liyue quickly, but satisfies neither side.\n\n§YHint:§! The adepti line and the revolutionary committee are mutually exclusive to the end, and once war starts there is no negotiating."
 DOT_INTRO_WAY_SNE:0 "§YI. Integrating the Fatui§!\nSummon the Fatui! opens the power line and decides the subordination between the Harbingers and the officers' corps; afterwards The Great Resistance legitimizes external conflict and prepares opinion for total war.\n\n§YII. Industry and Armament§!\nThe Mayor's Industrial Plan takes the local industrialization road: slow to show, solid at the base. Crystal Horn Bay Naval Port and Building the Air Force are two service-priority lines; navy and air force can only have one priority.\n\n§YIII. Society§!\nThe Literacy Campaign raises the literacy rate of the whole people. In the long run it is the best returning investment, though in the short term it takes capacity from arms production.\n\n§YIV. Two Hidden Lines§!\nSudden Snow and the Requiem for the Underworld point to deeper turmoil inside Snezhnaya: the first is a sudden upheaval, the second concerns the mausoleum and the faith of death and may lead to an ending different from the Tsaritsa's road.\n\n§YHint:§! Snezhnaya's roads turn on how far to mobilize, and over-mobilization collapses the rear."
 DOT_INTRO_WAY_SUM:0 "§YI. Three Roads for the Akademiya§!\n§CThe Sacred Tree Crowned§!: bring back the true Lesser Lord Kusanali and rebuild order on divine authority; §CThe Scholars' Republic§!: end the sages' arbitrary rule and govern by council of scholars; §8The Throne of God-Making§!: complete the divine creation project and replace the Dendro Archon with a manufactured god, the black road at a very high price.\n\n§YII. Rebalancing Rainforest and Desert§!\nSand and Forest is the reconciliation line, acknowledging the desert's equal standing; The Long Road to Independence, Shadow of a Vassal and The Reckoning of the Trade Roads are the desert's three ways out: independence, vassalage, and a state built on trade.\n\n§YIII. Banners of the Desert§!\nThe Red King's Banner restores the Red King's old line; March on the Rainforest settles it by war; Brigade Council takes the tribal republican road; The Matriarchs' Authority puts a council of elder women in power.\n\n§YIV. The Aranara§!\nStarting as Vanarana (VAN), set out from Aranara's Plea and the Gathering Storm and walk the Aranara's own road of survival, which pulls and is pulled by the rainforest's politics.\n\n§YHint:§! Sumeru's roads divide over the status of the god: restore, abolish or manufacture. The three cannot be had together."
 DOT_INTRO_WAY_VAN:0 "§YI. Aranara's Plea§!\nAccept the Aranara's request and step into the human affairs of Sumeru. This is the opening of every road.\n\n§YII. The Gathering Storm§!\nFacing pressure from the Akademiya, the desert and the Fatui at once, choose whether to hold the forest or reach outward for allies.\n\n§YIII. Development and Armament§!\nDeveloping Industry and Building the Army take the Aranara beyond a purely defensive stance, at the price of remaking the forest.\n\n§YIV. Aranara-ism§!\nAn extreme road built around racial identity and hostile to human interference, ideologically in the same family as §8the Cauldron school§!, and mutually exclusive with the moderate roads.\n\n§YHint:§! The Aranara's divide is whether to coexist with humans."
 DOT_INTRO_WAY_YLH:0 "§YI. Changing Flags at Yunlai§!\nReplace the Qixing's authority over the Yunlai Sea with a local power, taking the §8authoritarian§! road and standing on tariffs, fleets and the port.\n\n§YII. Inviting Outside Powers In§!\nCooperate with Snezhnaya or another outside power for warships and loans, at the price of the port's sovereignty.\n\n§YIII. Profiting from the Fence§!\nSell passage rights to the revolutionary committee, the Tianquan and the Yuehai Pavilion at once, helping whoever pays most, and pick a side only when things clear up.\n\n§YHint:§! The Yunlai Sea has no depth to trade for time, and once blockaded it must fight quickly."
 DOT_INTRO_TEXT_0:0 "In production"
 DOT_INTRO_TEXT_6:0 "I. §YThe Primordial One§! and the §CThree Moon Goddesses§!\n\nAt that time there was no boundary between life and death; will flowed through countless beings, and there was a primordial life that ruled the planet, which made the §Cthree moons§! rise free of the earth. Until the §RYear of the Funeral Pyre§!, when the voice of the primordial sounded once more in the mute §0darkness§!.\n\nThere was once an age when the silver wheels that drew the primordial sphere still numbered three.\n\nThen the §YPrimeval Dragon§! born of the sea of perfume soared into deep space and vanished into the mist between the stars.\n\nThe §0dusk-colored mist§! was so deep that not even the starlight could escape its pull. To find an answer before this planet too was devoured, the great dragon resolved to set out alone on a bitter journey. He raised the §Cthree bright moons§! from the earth, and the keeping of the tides bound this small world tightly. Moonlight would bathe the fertile land through the long night of the end, until the wandering dragon returned from the land of mist. But millennium after millennium passed, and the §Cthree sisters of the moon§! never met their old master. Until that day, when a winged §Odescender§! came treading on the morning star.\n\nThat was not the great enemy foretold to extinguish the stars, nor did it seem to intend to take the spring that keeps the world alive. Facing this uninvited guest, the §Cthree guardians§! who acted for the will of the planet did not know what to do and argued without end. But whether submission or rebellion, battle or death, the §OKing of All Armies§! would grind down whatever stood in its way.\n\nThere was once an age when the silver wheels that drew the primordial sphere still numbered three.\n\nThen the winged one who trod the morning star and sat above the moon became master of the eternal sky.\n\nThe §Oviolet sunlight§! swept the sky clean, but the new throne still kept a place in heaven for the §Cthree sisters of the moonlit night§!. Perhaps because in his design a world where even the flow of elements was orderly still needed tides. The singers of the thirty nights understood that they alone could not guard this lonely planet from the annihilation that must come. Before the final extinction arrived, whoever won the struggle of good and evil, it was better than an eternal kalpa of shared nothingness.\n\nAs they had hoped, the master of the high heavens loathed the §0destroyer in the black mist§!. After all, on the long road through the dark domain it had already seen countless stars fall. So they too chose order, or more precisely, they made room for it. That was the age when the §Cthree moons§! and the §Omorning star§! ruled together, the age when eternity was still eternity.\n\nThere was once an age when the silver wheels that drew the primordial sphere still numbered three.\n\nThen the law handed down from the high heavens was not yet compiled, and the border of human reason was not yet drawn.\n\nThe people of the god walked the newly made gardens and valleys, beyond counting. Messengers of the sky moved among the unenlightened crowds, sowing prosperity and wisdom. In the end the prosperity the god promised awakened understanding, and understanding gave rise to doubt. The god's messengers raged at mortal foolishness, and before their questions the censors kept silent. So the people turned their eyes to the sky and, in nights the sunlight could not reach, made offerings to the §Cthree bright moons§!.\n\nNight lowered its eyes upon the earth, as the silver stars had once lit the lamps of the dragon host's ships. They brought madness and inspiration back under the moon, answers that order could not give. When the morning star rose again, the chief priest returned from the mountain top bearing a small wheel-sign. This Wheel of the Moon was the new covenant the §Cthree moons§! made with the people.\n\nThere was once an age when the silver wheels that drew the primordial sphere still numbered three.\n\nThe sleepers of three worlds had not yet woken, and only the night sky knew their dreams and desires.\n\nCompared with the wrathful, merciless father in heaven, the soft light of the §Cthree moons§! always soothed every lost soul like a mother. So the nations of the earth poured out their warmest devotion to the mistresses of the moonlit night. They climbed to the peaks of Vindagnyr and offered wreaths of poetry to the bright moon; or entered the jade altars of Langgan and set finely carved jade against the face of the night; or in the sacred groves of Arcadia broke the golden bough from the oak. Before the sun rose, every love that overstepped the sky grew from here.\n\nBut among the masters of the eternal sky, moonlight was only one thread of holy love. Testing the sky was never permitted, for every search that crossed the rules pointed to destruction. At last, when the long sword at the world's edge cut across the sky, eternity met its end.\n\nThere was once an age when the silver wheels that drew the primordial sphere still numbered three, and two of the three moons had fallen.\n\nThe world no longer sheltered by eternity was moving toward its end, until the new moon came again and set the spinning wheel of fate in motion.\n\nWhen the §YConstant Moon§! fell, heaven and earth were overturned;\n\nWhen the §RRainbow Moon§! shattered, its red shadow hid in the §0abyssal sea§!;\n\nWhen the §CFrost Moon§! stopped turning, the nations sank;\n\nBut the primordial sea of perfume still ripples for the thousand moonquakes each year, and the long song woven on golden strings has never stopped for the silver stars gathering dust. Behind layer upon layer of heaven's curtain the people of the earth cannot bathe in true moonlight, yet the tide of the river of time still joins them, night or day.\n\nWe follow the track of the crowded stars, or step down the stairs of shallow sleep;\n\nWe wander between dawn and sunset, seeking the answer behind the curtain;\n\nThe heart no longer bound to eternity still throbs, faint but ceaseless;\n\nIn the dream of eternity and of an instant, we await the hour offered to the moon.\n\nII. The Golden City and the Fae\n\nIn those distant years no memory can now reach, the city-states of the far north stitched the barren ice like gold thread, and the furnaces of the deep corridors roared day and night. On the remains of great beasts, artisans forged countless fae from forbidden arts, and spun the fallen light of the frost moon into flawless flesh, set upon bodies once weak and frail. That was the power of creation the master of the high heavens had held, yet a rebellious messenger put it into mortal hands, dreaming that one day these small beings might make a perfect life at one with the world.\n\nIII. The Lamplighters\n\nLegend says the first lamplighter came from the winter capital in the far north, and the nightingale crest marked his glorious line. That family had served as agents in secret, but by the grace of the Winter Tsar it was granted the honour of..."
