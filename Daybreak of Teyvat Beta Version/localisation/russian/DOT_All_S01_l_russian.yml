DRA_Publicize_our_Justice:0"Пропаганда"
DRA_Publicize_our_Justice_desc:0"Мы объясним народу справедливость наших действий."
DRA_Compulsory_Recruit_Refugees:0"Принудительный призыв"
DRA_Compulsory_Recruit_Refugees_desc:0"Мы призовём беженцев, убеждая их словом и делом."
DRA_Refuse_Awaiting_our_Doom:0"Не ждать судьбы"
DRA_Refuse_Awaiting_our_Doom_desc:0"Мир не даётся даром — его нужно завоевать."
DRA_Call_for_Justice:0"Призыв к справедливости"
DRA_Call_for_Justice_desc:0"Мы призовём мир к справедливости."
DRA_Propaganda_our_Difficulty:0"Пропаганда"
DRA_Propaganda_our_Difficulty_desc:0"Мы будем пропагандировать наши трудности, чтобы получить помощь."
DRA_Financial_Alchemy:0"Финансовая алхимия"
DRA_Financial_Alchemy_desc:0"Альбедо использует свои знания для извлечения выгоды."
DRA_Uitilize_Foreign_Sympathy:0"Использование симпатии"
DRA_Uitilize_Foreign_Sympathy_desc:0"Мы привлечём международное внимание."
