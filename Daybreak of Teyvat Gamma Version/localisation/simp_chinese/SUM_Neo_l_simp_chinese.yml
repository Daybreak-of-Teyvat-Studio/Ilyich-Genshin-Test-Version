 SUM_Neo.48.d:"学者开始记录每个人的梦，作为研究的材料。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。高塔投下的影子越来越长，傍晚时就盖住了半条街。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。"
