 NAT_Canopy_Petition_Idea:"悬木人陈情"
 NAT_Canopy_Petition_Idea_desc:"悬木人将陈情写于树皮内侧，字反刻，外人视之只当虫咬之纹。族中老者曰：「树识自家之字，写在皮里，风吹雨打亦不烂。」一后生抱树皮攀上最高之崖，寻那株最古之树，将树皮贴树干按实。焱庭差官随后赶至，绕树三匝，亦辨不出一字，皱眉曰：「此算何等陈情？」老者蹲树根吸烟，徐徐吐出一句：「认得的自然认得，认不得的，写明白亦是白搭。」差官无奈，拿刀欲撬树皮，方一使劲，那树皮竟与树干长一处，纹丝不动。松刀，抬头看满崖之藤，末了只在树皮按一手印，转身下山复命去矣。"
