 SUM_Neo_SDH.184.t:"破阵"
 SUM_Neo_SDH.184.d:"最硬的风卫压正面，等对方阵一动，两翼游骑插进去。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
