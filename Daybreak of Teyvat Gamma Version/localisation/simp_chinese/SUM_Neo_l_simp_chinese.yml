 SUM_SGS_WAR_Village_Talk_desc:"雨林边的村社也在交重税，派去的人带着账本去谈。"
 SUM_Neo_SGS.174.t:"联络漠边村社"
 SUM_Neo_SGS.174.d:"雨林边的村社也在交重税，派去的人带着账本去谈。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
