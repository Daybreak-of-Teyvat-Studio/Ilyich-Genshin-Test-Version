DOT_nuke_modifier_desc:0"Светящийся шар возник в небе, раздуваясь и падая вниз, сопровождаемый оглушительным грохотом. Грибовидное облако вздыбилось среди ослепительной вспышки, и ураганный ветер разогнал дым и пепел, оставив после себя лишь сияние термоядерного взрыва. Всё было уничтожено."
DOT_nuke_modifier_02:0 "Выжженная земля"
DOT_nuke_modifier_02_desc:0"Светящийся шар возник в небе, раздуваясь и падая вниз, сопровождаемый оглушительным грохотом. Грибовидное облако вздыбилось среди ослепительной вспышки, и ураганный ветер разогнал дым и пепел, оставив после себя лишь сияние термоядерного взрыва. Всё было уничтожено."


