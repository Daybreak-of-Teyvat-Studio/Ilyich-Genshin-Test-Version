 NAT_Nightwind_Spirit_Riddle_Autonomy_Idea:"灵谜自主"
 NAT_Nightwind_Spirit_Riddle_Autonomy_Idea_desc:"烟谜主宣告，灵谜涂鸦之答案由本族独占，解释权亦归本族。焱庭官员携来一卷拓片，言欲请人解此谜。族中解谜人接过拓片，只看一眼，便道：「此谜面汝等看得见，谜底却不在汝等手里。」官员追问谜底是甚么，解谜人将拓片卷起，塞回其怀：「答案在吾此处，汝等所读，永远只是谜面。」官员不甘，复拿出数张，张张皆被挡回。末了，解谜人自怀摸出一片烧焦之炭，于官员手背画一歪扭记号，笑曰：「欲知答案，先解此。」官员看手背炭痕，哭笑不得，只得将拓片皆收。解谜人转身入灰雾，背影倏忽不见。"
