# 璃月大萧条 
#####################
 Great_Depression_of_Liyue:"璃月大萧条"
 genshin_noun:"尘世主义"
 LYY_Depression_News.1.t:"黑色逐月节"
LYY_Depression_News.1.d:"岩王帝君之逝，于璃月之财用冲击甚大。帝君为璃月财政所倚，其存也，则£mora 摩拉之值与信皆定；其亡也，则全提瓦特之人皆疑£mora 摩拉之值，遂成£mora 摩拉之慌。璃月人多恐£mora 摩拉将跌，争赴银行，易为他物，挤兑之风，遍于港中诸行。诸行门前皆排长队，或有现金不足而闭门者。此风既起，金融之体承压甚重，即璃月中央黄金屋之权威，亦难独支。璃月之政与商会方急议应对，欲复众人对£mora 摩拉之信，而效未甚著。璃月正面临一场财用危机。随钱荒而至者，为股市之瓦解。璃月股价于昨日逐月节一日落千丈，即垄断海外运输之南十字船队公司，其股亦腰斩。以故，有金融家名是日为黑色逐月节。枫丹廷蒸汽鸟报国际版"
 LYY_Depression_News.1.a:"灾难降临了！"
 LYY_Depression_News.1.b:"灾难降临了！"
 LYY_Depression_News.2.t:"危机加剧"
LYY_Depression_News.2.d:"玉衡拉响汽笛，天权敲起钟，群玉阁发信号，璃月往地狱里冲。因璃月经济不断恶化，可怕之连锁反应速生：疯狂挤兑、银行倒闭、股市蒸发、泡沫破裂、厂门关闭、工人失业，璃月不断坠于深渊。此诸事引民众之恐慌与怒，致社会之动与暴力之冲。璃月临时政府欲以紧缩之政与外交之力挽其局，而效甚微。一些反对之派与民间之团始组抗议与示威，求政府下台。而璃月之盟与敌皆在观望，待最佳之时以干预或利用此岌岌可危之国。许多人始逃离璃月，求他处之避。璃月之前途充满不定与危。商会闭户，牌上尽书歇业二字。有工人聚于南码头，无所得食。总务司门前聚人千数，榜文三重，无一人读毕。有吏自侧门出，为众所围。枫丹廷蒸汽鸟报国际版"
 LYY_Depression_News.2.a:"事情愈发糟糕"
 LYY_Depression_News.2.b:"事情愈发糟糕"
 LYY_Depression_News.3.t:"凝光村与水中椰奶"
LYY_Depression_News.3.d:"危机之间，失业者饱受饥寒，流浪于全国，或露宿于丛林、公园、街头、车站，或居木板、旧铁皮、油布乃至牛皮纸搭起之破屋，靠少得可怜之救济活命。昔日繁华之大街上出现以旧铁皮、纸板与粗麻布搭起之棚户之区，此与凝光委员长就任时所称之繁荣大相径庭，故人称之为凝光村。同时，以盈利为务之资本家为消过剩之供，提产品之价，始大量销毁过剩之产。飞云商会之行秋少爷便命其属将成千上万吨之椰奶倒入璃月港，使璃月港变为银港。此诸令人发指之行引人民之怒与不满。彼始组织，向政府与资本家提诉求与抗议。彼求政府多供就业之机与社保，资本家止其浪费与剥削。彼尚求凝光委员长下台，为其未履其诺，与资本家勾连，牺牲人民之利。彼高呼「凝光下台」，「飞云商会滚出璃月」，「人民要生存」，「人民要尊严」。璃月港工人日报报道"
 LYY_Depression_News.3.a:"尔等可曾听到人民的呼声"
 LYY_Depression_News.3.b:"尔等可曾听到人民的呼声"
 LYY_Depression_News.4.t:"提高关税法案"
LYY_Depression_News.4.d:"为护本国之经济与就业，璃月临时政府宣布大提关税！此措引内外广泛之争与反对。一些经济学者以为，提关税将损璃月之国际竞力，增消费者之负，起贸易之战与报复。另一些经济学者则以为，提关税乃应经济危机之必要之段，可护国内之产，增财政之入，促国内市场之发。璃月临时政府表示，提关税乃于合于世贸规则之限内而行，旨在维璃月之国家利与经济之安。同时，璃月临时政府亦表示愿与他国友好协商，共求应经济危机之解。关吏奉命改榜，凡进口之货，税加三成。港中洋货价一日三涨，商贾抢囤。有蒙德酒商弃货于仓，云税重则无利。北码头税关增卡六处，验讫之印用朱，一日一盒泥。有商转道轻策庄小路私运，为巡卒所获，货入官，人释。蒙德莱艮芬德酒业最新市场调查报告"
 LYY_Depression_News.4.a:"这是好事，还是坏事？"
 LYY_Depression_News.4.b:"这是好事，还是坏事？"
 LYY_Depression_News.5.t:"危机向全世界扩散"
LYY_Depression_News.5.d:"璃月为全提瓦特财富所出之地，忽发不知其因之经济之危，此风基本波及全大陆。蒙德为邻璃月且两方贸易频繁之国，其出口受创甚重。原本畅销之蒙德美酒于璃月市上无人问津，致蒙德酿酒之业陷于困。蒙德酒庄积满大量之蒲公英酒，风花歌颂等门店长期闭门不开，常有闹事之人群聚于教堂门口或骑士团大殿前。什么？晨曦酒庄破产矣！酒庄主人聚于城中，议减酿之量。有酒户卖其园，得钱不足以偿债。清泉镇道上，酒车空还者日十数。蒙德港中泊舟不卸，桅上旗半落。有人言：璃月一日不兴，蒙德一日不苏。城中歌者改其词，唱曰：风起之时，酒价何时落。闻者皆叹。教堂前有醉汉坐地，持空瓶示人，瓶中无酒，惟余香。骑士团出告示，禁囤酒居奇，犯者没其货。"
 LYY_Depression_News.5.a:"蒙德将何去何从呢？"
 LYY_Depression_News.5.b:"蒙德将何去何从呢？"
 LYY_Depression_News.6.t:"莱艮芬德伯爵领宣战清泉镇自由市"
LYY_Depression_News.6.d:"仰承天佑，保晨曦之光，践祚莱艮芬德伯爵迪卢克，昭示汝忠诚勇武之众。孤兹对清泉镇自由市宣战。孤之陆海将士宜勇敢奋战，孤之百官有司宜励精图治，孤之众庶宜各司其职。亿兆黎民上下一心，举国家之总力，达征战之志，必期万无遗漏。风神巴巴托斯在上，赖汝众庶咸忠诚勇武，而期恢弘祖宗遗业，速戡祸乱，以立蒙德之永和平，保家族之光，实有厚望焉！莱艮芬德伯爵迪卢克诏下之日，清泉镇闭其市门，断其通衢。镇中父老聚于礼拜堂，议三日，无定说。骑士团遣使持书往，书不启而还。迪卢克自率骑三百，驻于镇外葡萄园。园中葡萄尽熟，无人采，落于地。镇人登屋而望，见旗不见兵。有老者曰：此非战，此兄弟相争耳。对峙旬日，互不发一矢。"
 LYY_Depression_News.6.a:"战争终究是爆发了"
 LYY_Depression_News.6.b:"战争终究是爆发了"

