# ===== 開始時国家紹介 =====
 DOT_INTRO_NOW_ABY:0 "§Y一、深淵の教団§!\n深淵教団はカーンルイアの残党を中核とし、テイワット各地に潜伏し、浸透し、策動している。その目的は決して土地の占領ではなく、帷幕を引き裂き、深淵をこの世界に呼び戻すことにある。\n\n§Y二、力と代償§!\n深淵の力は素早く強者を生み、また素早く一人の人間を破壊する。教団はそれを気にしない。彼らにとって個人はもともと重要ではない。\n\n§Y三、現状§!\n教団は各地で代理人を育て、愚人衆とは協力しつつ互いに警戒している。本当の切り札は戦場ではなく、まだ教団を信じる者たちの心の中にある。\n\n§R結論：深淵は勝利を急がない。世界が自ら裂けるのを待っているだけだ。§!"
 DOT_INTRO_NOW_ANR:0 "§Y一、忘れられた森§!\n奔狼領はモンドの工業化や遠征、宮廷の争いとは縁が薄い。ここにまともな都市はなく、狩場と林道と散在する村落があるだけだ。§8獣を追いて肉を得る§!：生計は山に頼る。§8山林の游侠§!：秩序は狩人たちが自発的に保つ。§8難民の流入§!：乱世の中で、ここを最後の逃げ道とする者が増えている。\n\n§Y二、狼王の影§!\nアンドリアスの魂は今もこの地に眠り、狼とその眷属は決して去ってはいない。奔狼領の人々は彼の名をあまり口にしないが、モンドが揺れるたび、この地は自分が何を抱えているかを思い出す。\n\n§Y三、行き詰まり§!\n難民は人をもたらし、同時に飢えと争いをもたらす。奔狼領には工業も税制もなく、モンドの交渉の卓に着く資格もない。まず自らの力を見せつけねばならない。\n\n§R結論：この森は戦火に呑まれるか、戦火の中から自らの国を育てるかしかない。§!"
 DOT_INTRO_NOW_CYG:0 "§Y一、茶と玉の谷§!\n沈玉谷は翹英荘の茶と山の玉を業とし、数百年にわたり璃月港へ税と貢ぎ物を納めてきた。谷の者に生計の不安はない。ないのは発言の場だ。税は港が決め、道の権は商会が握り、山道を一本通すにも月海亭の顔色をうかがわねばならない。\n\n§Y二、乱世の好機§!\n七星が内輪もめし、仙人が山を下り、刻晴が革命を起こす。璃月港は西を顧みる暇がない。沈玉谷は初めて、あの税を納めなくてもよいのだと気づいた。\n\n§Y三、代償§!\n自立すれば港との商路は絶える。茶は売れず、玉も糧に変わらない。谷の長老たちはこの一点で延々と争っている。\n\n§R結論：沈玉谷は決めねばならない。豊かな一県に留まるか、貧しい一国になるか。§!"
 DOT_INTRO_NOW_DRA:0 "§Y一、雪山の新国家§!\n第二期開発計画を経て、ドラゴンスパイン領はモンドで最も経済が発達し、人口が密集する地域の一つとなった。アベド議長は学者の流儀で統治する。移民を招き、資源を開き、交易を組織し、サル・ヴィンダグニルが遺した施設を再び動かした。\n\n§Y二、忠誠と自衛§!\n雪山領はモンドに、自由に忠実だ。だがその忠誠は騎士団がまだ庇護を与えられるという前提の上にある。騎士団が致命的な打撃を受ければ、工業も人口も組織もある雪山領が、空殻の命令に従い続ける理由はない。\n\n§Y三、内なる闇§!\nアベドの研究は一度も止まっていない。スクロースは実験室で誰にも理解されない試みを続け、リサは別の班を率いている。そして存在するはずのないあの造物も、どこかで己の陰謀の力を蓄えている。\n\n§R結論：雪山領はモンドで最も鋭い刃であり、最も手を噛みやすい刃でもある。§!"
 DOT_INTRO_NOW_DVA:0 "§Y一、龍災の前線§!\n風龍領はモンドとトヴァリンとの間で最も近い土地だ。偵察騎士アンバーは少数の隊を率いてここを守り、村民の避難、盗賊の掃討、そして風魔龍の動向の監視を同時にこなしている。\n\n§Y二、薄い基盤§!\n風龍領にまともな工業はない。財政は騎士団の交付金と地方の自前の調達に頼る。龍災で人口は流出し続け、残るのは動けない老人と動こうとしない者ばかりだ。\n\n§Y三、定まらぬ方向§!\nこの土地の課題は雑然としていて、そして現実的だ。工場を建てるのか、公社を作るのか、情報機関を置くのか、隣国と結ぶのか。どの選択も資源不足のまま迫られる。\n\n§R結論：風龍領はまだ形を持たない。その道は玩家が歩いて作るものだ。§!"
 DOT_INTRO_NOW_FAV:0 "§Y一、松籟の後半節§!\n千年前、西風教会は二派に裂けた。一派は王侯と盃を交わし、一派は平民と奴隷の下へ降り、松籟の歌の後半節を歌う時に立ち上がると誓った。今日の教会反対派はその旗を掲げて再び現れた。現行の教会は風神の教えから外れた、もう一度改革が必要だと主張している。\n\n§Y二、組織の二つの顔§!\n§8内部闘争§!：組織をモンドの権力を奪う道具と見る者もいれば、教育すべき子供と見る者もいる。ロサリアが欲しいのは、来るべき危険に抗する一把の剣。バーバラが欲しいのは、この運動を穏やかな正道へ引き戻すことだ。\n\n§Y三、立場§!\n§R異端の教派：世間の敵意§!。正統教会には異端、貴族には動乱の源、騎士団には処理すべき問題と映る。唯一の資本は最下層の信者の支持だ。\n\n§R結論：教会反対派はモンドの新たな教会になるか、内戦でまた一山の焚き木になるかだ。§!"
 DOT_INTRO_NOW_FON:0 "§Y一、審判者の国§!\nエゲリアの死後、フリーナが位を継ぎ、実務は最高審判官ヌヴィレットが担った。前水神期の体制は根本から組み替えられ、貴族議会の旧権は司法体系に取って代わられた。フォンテーヌは法と審判によって国を成し、あらゆる争いは最終的に条文と判決に落ちる。\n\n§Y二、繁栄と低効率§!\nフォンテーヌの工業化はテイワット随一だ。警衛機関、戦争機械、留影機はいずれもここから出る。§8経済の高み§!の下には§8低効率な政府§!と§8官僚化した科学院§!がある。前者は意思決定を遅らせ、後者は技術的優位を制度が食い潰していく。復興期は資源をことごとく民生に投じ、軍備と治安は後回しにされた。逐影庭は人手不足を繰り返し訴えている。\n\n§Y三、暗流§!\n「秩序の化身」と「暗流の湧き」は同時に存在する。強い指導者制の支持者は決断できる者を求め、復生主義者はレムリアを懐かしみ、革命テロリストは工場と灰河の間を動き、商会統合体制は商会に全てを委ねようとする。フォンテーヌの安定は、誰も本当には満足していないという前提の上に成り立っている。\n\n§R結論：この国の脚本はまだ序幕を書き終えたばかりだ。§!"
 DOT_INTRO_NOW_GUN:0 "§Y一、モンドを永く護る家§!\nグンヒルド家は三千年前に「モンドを永く護る」という祖訓を定め、代々教士と騎士を輩出してきた。家の勢力は北境に根を張り、スネージナヤと接する辺境を長年にわたり守っている。\n\n§Y二、薄い家底§!\n§8初級経済§!：北境の土地は痩せ、工商業は弱く、家の財政は長く逼迫している。ジンが代理団長に就いて家の声望は頂点に達したが、兵力も金糧もそれに伴って増えてはいない。\n\n§Y三、板挟み§!\n家の中でも情勢の見立ては分かれる。アベドを全面的に支え、雪山領の工業力をモンドの未来と見る一派。バーバラを支え、教会から人心をまとめようとする一派。そして縁組と同盟でディルックやユウラを同じ陣営に引き込もうとする者たち。\n\n§R結論：グンヒルドはモンドが崩れる前に、どちらに立つかを決めねばならない。§!"
 DOT_INTRO_NOW_GYP:0 "§Y一、旧秩序の夜番§!\n甘雨と月海亭八省こそ、璃月を実際に動かしている機械だ。文書、税冊、駅伝、訴訟のすべてが八省によって保たれている。帝君が退隠した後、この機械は璃月を一つに束ねられる唯一のものとなった。\n\n§Y二、難しさ§!\n八省には兵権も独立の財源もなく、すべては七星の許しの下で行われる。刻晴は革命を、凝光は集権を、仙人は神治を求める。八省はその三者の間をすり抜けるしかない。\n\n§Y三、切り札§!\n八省が本当に握っているのは「日常」だ。八省を外せば璃月は翌日止まる、と誰もが知っている。この代替不能性が唯一の武器である。\n\n§R結論：月海亭は勝つことを求めない。皆が戦い終えるまで、璃月が立っていればいい。§!"
 DOT_INTRO_NOW_HIL:0 "§Y一、怪物とされた民§!\nヒルチャールはテイワットの荒野と遺跡の間に散らばって暮らし、各国から魔物として掃討されている。文字も国もなく、どこから来て何を望むのかを真剣に問うた者もいない。\n\n§Y二、部族の連合§!\nヒルチャール部族連盟は、散在する部族を一つにまとめようとする数少ない試みだ。シャーマン、戦士、狩人がそれぞれ発言権を持ち、連盟そのものは緩く脆い。\n\n§Y三、立場§!\n四面すべてが敵だ。七国がどう争おうと、ヒルチャールの掃討だけは唯一の共通見解である。\n\n§R結論：この連盟が生き延びるには、まず自分が怪物ではないと証明しなければならない。§!"
 DOT_INTRO_NOW_INA:0 "§Y一、永遠の空殻§!\n雷電将軍は一心浄土に閉じこもり、国政の全権を三奉行に委ねた。鎖国令は対外往来を断ち、眼狩令は神の目を没収した。二つの法令は「永遠」の名の下に書かれ、実際の執行はすべて奉行所の役人の手に委ねられた。五百年の積弊がこの一代に集中して噴出する。§8雷災の横行§!が広い土地を荒廃させ、§8眼狩令§!が民怨を煽り、§8鎖国令§!が工商業を窒息させた。\n\n§Y二、三奉行の質§!\n天領奉行は兵を、勘定奉行は財を、社奉行は礼儀と神事を掌る。九条家と柊家は腐敗の中で利を貪り、神里家だけがなお努めて支えている。軍の訓練は緩み、兵器は古び、幕府はもはや五百年前のあの強兵ではない。\n\n§Y三、海祇の旗§!\n珊瑚宮心海は眼狩令の廃止を掲げて兵を挙げ、抵抗軍は一時破竹の勢いだった。だが八醞島に入った後、一部の熱狂者が祟り神を鎮める鎮物を壊し、祟りの力が外へ漏れ、稲妻全土が被害を受け、抵抗軍の攻勢もそこで止まった。\n\n§Y四、愚人衆の賭け§!\nスネージナヤは「援助」の名の下に双方へ邪眼を送り込んだ。使い手は力を得て、寿命を代償に払う。戦が長引くほど邪眼は売れ、稲妻の血はより多く流れた。\n\n§R結論：踏鞴砂の御影炉心が一度暴走すれば、汚染は収拾がつかなくなる。永遠はもう保たない。§!"
 DOT_INTRO_NOW_KQP:0 "§Y一、玉衡星の決断§!\n刻晴は玉衡星として革命委員会を組織し、七星の旧制を廃し、神治に代えて人治をとることを公に主張した。彼女は啓明主義を波止場と作業小屋の議論から、一つの政権の主張へと変えた。璃月三千年でかつてないことだ。\n\n§Y二、手元にあるもの§!\n委員会は璃月港の工業と労働者組織を握り、黒岩廠と一部の波止場を支配している。動員力は旧官僚をはるかに上回る。だが財政は港の短期税収に頼り、海軍はほとんどなく、糧秣は外部から買い付けるしかない。\n\n§Y三、四面楚歌§!\n天権星凝光はこれを反乱と見なし、月海亭八省連盟は破壊者と見なし、三眼五顕の仙人は契約を背いた僭越者と見なす。委員会が内戦の初期に決定的な勝利を挙げられなければ、三者に合力で絞り潰される。\n\n§R結論：革命に退路はない。前進するか、消滅するかだ。§!"
 DOT_INTRO_NOW_LAW:0 "§Y一、塵の中の宗室§!\nローレンス家はかつてモンドを統べ、今は騎士団の影に身を寄せている。礼節は残り、封地は失せ、称号は残り、賦税はない。一族の長老は今も「モンドの光」を自称し、若い世代は権力を衣服の勲章としか見ていない。\n\n§Y二、好機§!\n騎士団の主力は遠征のまま戻らず、城内は空だ。各地の自治区はそれぞれ勝手に動き、教会は分裂し、龍災は収まっていない。復辟を望む家にとって、千年に一度の好機である。\n\n§Y三、外援§!\n§8スネージナヤとの結び付き強化§!：愚人衆はモンドを乱せる者なら誰にでも進んで金を出す。だが借りた者は、最後に必ず返さねばならない。\n\n§R結論：ローレンスはモンドを取り戻すか、歴史から完全に消されるかだ。§!"
 DOT_INTRO_NOW_LYY:0 "§Y一、人と神の更始§!\n帝君が退隠した後、璃月は混乱には陥らなかったが、一声で全てを決める声も失った。七星が政を執り、月海亭が庶務を総攬し、契約はなお立国の本であり、利害に関わることはすべて条文で縛られる。問題は、契約は取引を縛れても、人の心は縛れないということだ。\n\n§Y二、富の偏り§!\n璃月港の富は七国随一で、商船は南は稲妻に至り、北はモンドに通じ、飛雲商会と南十字船隊がそれぞれ一角を占める。だが繁栄の下には三つの病がある。§8富の集まる港§!は資本を少数の家に集め、§8労務派遣§!は労働者から交渉力を奪い、§8低品質の工業§!は工場を量産に走らせ技術を停滞させた。この三つが重なったところこそ、啓明主義が波止場と作業小屋で急速に広がった土壌である。\n\n§Y三、四つの力の角逐§!\n玉衡星刻晴は徹底した人治と変革を主張し、すでに七星の中で一派を成している。天権星凝光は守成を主とし、法と商路で旧秩序を保つ。月海亭八省連盟は官僚体系で両者の均衡を図る。三眼五顕の仙人は人治を契約への背反と見なし、絶雲の間から成り行きを眺めている。\n\n§Y四、外部からの圧力§!\n愚人衆が国内を動き回り、北国銀行の貸付とスネージナヤの「援助」はいずれも縄だ。沿海の下では、かつて帝君に鎮められた渦巻の魔神オセルが、永遠の囚禁に甘んじない様子を見せ始めている。\n\n§R結論：璃月の次の一歩は、契約の国に留まるか、別の何かになるかを決める。§!"
 DOT_INTRO_NOW_MOT:0 "§Y一、名ばかりの中央政府§!\n西風騎士団は名目上モンド全土を統べるが、実際の権力は各自治区に散っている。グンヒルドが北境を守り、ラグヴィンドが晨曦酒荘を押さえ、ドラゴンスパイン領は独自に動き、奔狼領は体制の外にあり、風龍領は龍災に直面している。団長ヴァルカは主力の五分の四を連れて遠征に出たまま戻らず、城内には新兵と代理団長ジン・グンヒルドしかいない。中央には独立の財源もなく、人事と派遣の強制力もなく、各領の納める税だけで成り立っている。\n\n§Y二、繁栄の下の亀裂§!\nフォンテーヌの技術が西から流れ込み、果酒湖の岸には工場が並び、産業労働者の数は急増し、モンド経済はかつてない高みにある。だが利益は均しく行き渡らない。賃金は押さえられ、ギルドと貴族が流通を握り、新たな労働者層は南方から伝わった啓明主義を受け入れ始めている。教会は長く奇跡を見ず、正統派の教士は腐敗し、ロサリアは東部で反対派を立ち上げ、バーバラは解放の神学でこの運動を穏やかな道へ引き戻そうとしている。\n\n§Y三、差し迫る危機§!\nトヴァリンの襲撃は日増しに頻繁になり、商路と村落が次々と損なわれている。ローレンス家は暗に旧貴族と国外勢力に接触し、シューベルトらの復辟の意図はもはや隠されていない。龍災と内戦が同時に起きれば、騎士団には地方を抑える兵力も、各領を招集する威信もない。\n\n§R結論：モンドは乱れるかどうかではなく、いつ乱れるかだ。§!"
 DOT_INTRO_NOW_NAT:0 "§Y一、火神の新秩序§!\nマヴィカは「不敗の陽炎」として火神の座に就き、その武勇と意志だけで砂のような部族を再び一つに束ねた。§8古名継承の体系§!は、各人の運命を部族と先祖の名に結びつける。この制度は動員の仕組みであり、同時に支配の仕組みでもある。\n\n§Y二、六部族§!\n沃陸の邦、響きの子ら、流泉の民、懸木の人、花羽会、煙謎主。六部族はそれぞれ継承と利害を持ち、表向きは火神を尊びながら、実際には成り行きを窺っている。マヴィカが求めるのは統一、部族が求めるのは自治であり、この二つはいずれ卓上に載せねばならない。\n\n§Y三、深淵の裂け目§!\n燼寂海の裂け目は一度も完全には閉じていない。§8深淵の侵蝕の拡大§!はナタが毎日払っている代償だ。深淵との戦いは選択肢ではなく常態であり、問題は誰が指揮し、誰の掟で戦うかだけである。\n\n§R結論：ナタの統一はまだ新しく、一度の敗北にも耐えられないほど新しい。§!"
 DOT_INTRO_NOW_PRI:0 "§Y一、眠れる秩序§!\n天理はテイワットの法則を保っている。七神はそれぞれの土地を守り、元素はそれぞれの位置に帰し、人の僭越は制される。§8眠れる天理§!は秩序が消えたことを意味しない。ただ、今は自ら手を下さないというだけだ。\n\n§Y二、黎明への秒読み§!\n§8黎明§!：天理の体系は不可逆の一点へ近づいている。カーンルイアの乱が残した亀裂は癒えず、深淵は広がり、七国の力はせめぎ合い、そしてこれを保つあの手は長く動いていない。\n\n§Y三、立場§!\n天理は外交にも交易にも民意にも頼らない。頼るのは規則そのものだ。だが誰かが規則は破り得ると証明した瞬間、この力は急速に失われる。\n\n§R結論：天理は目覚めるか、取って代わられるかだ。§!"
 DOT_INTRO_NOW_RAG:0 "§Y一、体制の外にある家§!\nラグヴィンド家は晨曦騎士の時代から「体制の外の審判者」を自任してきた。ディルックは騎士団の権威を認めず、自らの判断だけで悪を罰し善を報いる。太平の世ならそれは気骨だが、乱世では割拠の口実になる。\n\n§Y二、家底§!\n晨曦酒荘はモンドで最も利益を上げる産業の一つであり、酒造、商路、人脈はいずれもこの家の手中にある。§8産業の不振§!が利益を押し下げ、国境の密輸が正当な交易を蝕み、家の中では「動くか動かぬか」で意見が大きく割れている。\n\n§Y三、目下の情勢§!\n§8モンドの政情は混迷§!し、騎士団は弱く、各地がそれぞれ活路を探っている。ラグヴィンドが動かなければ、ローレンスか教会反対派に先手を取られるのを眺めるしかない。動けば、自らの手でモンドを引き裂くことになる。\n\n§R結論：ディルックは決めねばならない。夜番になるのか、建国者になるのか。§!"
 DOT_INTRO_NOW_SAN:0 "§Y一、海祇の孤島§!\n珊瑚宮は海祇島を治める。痩せた土地に人が密集し、代々漁と塩で暮らしてきた。眼狩令が進むと、島で神の目を持つ者が次々に奪われ、怨みはついに刃となった。§8海祇の敬虔§!は全島を心海のために死なせる。§8知略百出§!はその意志を戦術に変える。\n\n§Y二、邪眼の代償§!\n抵抗軍が今日まで持ちこたえられたのは、愚人衆が提供した邪眼によるものだ。§8邪眼の代償§!は抽象的な言葉ではない。使い手は誰もが寿命と引き換えに力を得て、勝利の後に静かに死んでいく隊が後を絶たない。\n\n§Y三、八醞島の誤り§!\n八醞島に入った後、一部の熱狂者が祟り神を鎮める鎮物を壊した。祟りの力が漏れ、稲妻全土が被害を受け、抵抗軍の攻勢も止まり、幕府は息をついて立て直す余裕を得た。\n\n§R結論：珊瑚宮はすでに一度勝った。だがその勝ち方は、守ろうとしたものを壊しつつある。§!"
 DOT_INTRO_NOW_SDH:0 "§Y一、千壑の荒原§!\n千壑沙地は砂漠で最も痩せた一角だ。風に削られた峡谷、捨てられた村落、干上がった河床。ここの部族は牧畜と略奪で暮らし、人口は少なく気性は荒い。\n\n§Y二、忘れられた者たち§!\n教令院の地図では、ここはほとんど空白である。税がなければ統治もなく、統治がなければ彼らの生死を気にする者もいない。\n\n§Y三、集まる§!\nだからこそ、逃亡者、土地を失った者、雨林から追われた者が次々とここへ集まってくる。荒原は誰にも手のつけられない火薬樽になりつつある。\n\n§R結論：千壑沙地には失うものが何もない。だから何でもやる。§!"
 DOT_INTRO_NOW_SGD:0 "§Y一、鍍金旅団の砂原§!\n飾金砂原は砂漠で最も豊かな一角だ。商路が走り、遺跡が点在し、旅団が林立する。ここの人々は教令院の法令を認めず、契約と部族と刃だけを認める。\n\n§Y二、赤王の記憶§!\n赤王が逝いて千年、砂漠の繁栄もそれとともに幕を下ろした。だが「赤王スメール」の掛け声は消えず、雨林の圧迫が強まるたびに何度も燃え直した。\n\n§Y三、立場§!\n旅団はそれぞれ勝手に動き、部族は互いに殺し合い、商路は襲われ、オアシスは縮んでいる。砂漠には抵抗の意志はあるが、統一の力はない。\n\n§R結論：砂漠に欠けているのは勇気ではなく、皆を一つに束ねるあの名だ。§!"
 DOT_INTRO_NOW_SGS:0 "§Y一、沙海の帯§!\n蒼漠囿土は砂漠の縁、雨林と沙海の移行帯にある。ここにはオアシスもあり、廃墟もある。定住する農家もいれば、流動する旅団もいる。\n\n§Y二、両側からの圧力§!\n雨林はここを緩衝地と見なし、砂漠はここを通路と見なす。どちらが動くにせよ、最初の一歩はこの地帯の掌握だ。\n\n§Y三、使える資本§!\nオアシスの農業、行き交う隊商、そして遺跡に残る赤王時代の技術。これが蒼漠囿土が交渉に持ち出せる唯一の切り札である。\n\n§R結論：通路にある国は、踏み越えられるか、通行料を取るかだ。§!"
 DOT_INTRO_NOW_SHP:0 "§Y一、仙人の不満§!\n三眼五顕の仙人たちは帝君が契約を結んで以来、璃月を守ってきた。彼らにとって契約の効力は神と仙の立ち会いにあり、凡人の多数決にあるのではない。帝君の退隠、七星の執政、刻晴の人治の主張、その一歩一歩が契約の神聖さを削いでいる。\n\n§Y二、山を下りる§!\n申鶴は仙人たちを率いて山を下りる。仙家の力は今なお璃月で最も鋭い兵器だが、仙人は民を治めることに長けず、商いも外交も分からない。実際に政を執れば、問題はそこから始まる。\n\n§Y三、敵と友§!\n仙人は革命委員会を僭越と見なし、月海亭を弱さと見なし、天権を僭称と見なす。唯一の共通点は、三眼五顕が凡人に自分たちを説明することは決してないということだ。\n\n§R結論：仙人は璃月を守れても、璃月を治められるとは限らない。§!"
 DOT_INTRO_NOW_SNE:0 "§Y一、女皇の勅旨§!\nスネージナヤの政令は最終的にすべて冬宮から出る。女皇は「蒼星の聖勅」で諸執行官を束ね、最も精鋭の者たちを本国へ呼び戻した。この百年でかつてないことだ。愚人衆はもはや外交と浸透の道具ではなく、いつでも戦場に投じられる軍勢へと作り替えられつつある。\n\n§Y二、三本の柱§!\n§C厳冬計画§!：国の経済と工業の全てを長期の戦争準備に組み込む。§8愚人衆の将校団§!：武力の実際の指揮権が将校団へ集中しつつある。§C陵墓と白樺§!：死と追悼と国民意識をめぐる一連の取り決めが、犠牲を耐え得るものにする。この三つが表裏を成し、スネージナヤの動員力の土台となる。\n\n§Y三、代償§!\n動員には金がかかる。工場は三交代で回り、鉄道は昼夜止まらず、徴兵年齢は何度も引き下げられた。地方の市長と軍需集団は配給と発注の間で利を貪り、辺境省の飢饉は報告書の一行の数字に押し込められている。\n\n§R結論：スネージナヤはすでに戦争機械だ。問題はそれが誰を先に碾くかだけである。§!"
 DOT_INTRO_NOW_SUM:0 "§Y一、神なき神国§!\n大慈樹王が逝いて五百年。教令院が迎え戻した小吉祥草王は浄善宮に据えられ、名は神、実は囚人であった。六大学派の賢者は「神意」の名の下に独断を行い、大賢者アザールの権勢を制する者はもういない。§8囚われの神§!、§8造神計画§!、§8死域の影響§!、この三つの国家精神がスメールの現状を支える三本の柱である。\n\n§Y二、停滞する知の都§!\n虚空端末は五百年のあいだ実質的な進歩がなく、基礎理論科学も実践科学も同じく停滞している。学風は堕落し、学者は権力争いに明け暮れ、学術資源は門閥が握る。死域は雨林で広がり続け、魔鱗病に薬はなく、教令院はこれを処理する力もなく、自らの失職を認めようともしない。\n\n§Y三、雨林と砂漠§!\n砂漠の諸部は長く乱暴に扱われ、離心は久しい。鍍金旅団と残存部族は赤王の復興を掲げ、雨林の統治の正当性を公然と疑っている。教令院の砂漠への統制力は目に見えて衰えている。\n\n§Y四、外からの手§!\nスネージナヤの「博士」はすでにスメールに招かれ、造神計画に加わっている。愚人衆の介入は善意ではなく、スメールを試験場として扱っているのだ。\n\n§R結論：スメールの問題は神がいないことではない。神の名を借りて統べながら、神を敬わず、人も愛さぬ者たちがいることだ。§!"
 DOT_INTRO_NOW_VAN:0 "§Y一、夢の中の国§!\n桓那蘭那はアランナラの歌の中で育ち、森は訪れた全ての者を覚えている。§8マハヴァナラナプラナ§!がこの夢のような地を保ち、アランナラは人の世の隙間で生き延びている。\n\n§Y二、マラーナ§!\n§8マラーナの災い§!：汚染された土地は広がり続け、夢も安全ではなくなった。アランナラにできるのは遅らせることだけで、根治はできない。\n\n§Y三、政を解さない§!\n§8政を解さない§!は謙遜ではない。アランナラは人の契約も税も外交も分からず、スメールの盤上では犠牲になる定めに近い。\n\n§R結論：森は覚えている。だが森は誰かのために戦いはしない。§!"
 DOT_INTRO_NOW_YLH:0 "§Y一、港を扼する水路§!\n雲来海は璃月港の門戸だ。出入りする商船、南北を行き交う荷蔵、日の目を見られない密輸、そのすべてがこの水域を通る。雲来海を制する者は、璃月の交易の咽喉を押さえる。\n\n§Y二、地方勢力の勘定§!\n地元の豪族と船幫は長年ここで商い、七星にも属さず月海亭にも従わない。乱世が始まると、彼らはすぐに気づいた。他人に編入されるのを待つより、自分で旗を掲げた方がよいと。\n\n§Y三、外からの誘い§!\nスネージナヤの商人も愚人衆も、雲来海の通行と停泊権に高値を払う用意がある。金は早く来るが、縄も早く回る。\n\n§R結論：雲来海の旗を替えるかどうかは、値段と時機だけの問題だ。§!"
 DOT_INTRO_WAY_ABY:0 "§Y現在の完成度§!\n深淵教団には独自の国策樹がない。ゲーム内では主にイベント、汎用国策、特殊決議で進行し、遊べる内容は限られている。\n\n§Y一、可能な方向§!\n浸透と代理人によって影響力を広げ、イベント連鎖で各国に動乱を起こし、時機が熟すのを待って公に姿を現す。\n\n§Y二、他勢力との関係§!\n愚人衆とは互いに利用し合う関係、天理とは死闘の関係、各国に対しては純粋な破壊者である。\n\n§Yヒント：§!この勢力はまだ制作中であり、初回プレイには向かない。"
 DOT_INTRO_WAY_ANR:0 "§Y共通線§!\nまず食と治安を解決する。難民を安置し、狩人を組織し、林地を開き、散在する村落を動員できる網へとつなぐ。\n\n§Y一、ベネット：人民と共に§!\n§R赤§!の路線を歩み、新たな啓明主義の理想を奔狼領の土に下ろし、互助と動員で基層組織を作る。\n\n§Y二、フィッシュル：加速し、未来へ§!\n奇想天外な状況主義の思潮を受け入れ、§R赤と黒§!の路線を歩む。人性を改造することで社会の改造を加速させ、最も急進的な終局へ向かう。\n\n§Y三、レザー：大同につく§!\n§C青§!の路線を歩み、各派の長所を合わせ、協議と互助を原則とする。四つの路線の中で最も穏やかなものだ。\n\n§Y四、ディオナ：一歩退き、二歩進む§!\n§C青§!の路線を歩み、商人や郷紳と組み、貿易の自由と社会の安定の間で利を取る。最も現実的で、理想を捨てやすい。\n\n§Yヒント：§!四つの路線は「旧秩序を残すか」で分裂する。フィッシュルの路線は他の三つとほぼ共存できない。"
 DOT_INTRO_WAY_CYG:0 "§Y一、沈玉自立§!\n璃月からの離脱を宣言し、§Y塵世主義§!の路線を歩む。谷を境に一国を成し、茶馬と山道で独立を保つ。\n\n§Y二、商をもって国を立てる§!\n独立は宣言しないが、商路と関税を自らの手に握り、経済手段で事実上の自治を得る。\n\n§Y三、主を選んで仕える§!\n革命委員会と月海亭のどちらかにつき、政治的な立場と引き換えに戦後の地位を得る。\n\n§Yヒント：§!沈玉谷は規模が小さく、どの路線でもまず食糧と軍備を解決せねばならない。"
 DOT_INTRO_WAY_DRA:0 "§Y一、アベド：自由、平和と安定§!\n§C青§!の路線を歩む。騎士団の松明を受け継ぎ、強大な軍隊と効率的な行政でモンドの混乱を速やかに鎮め、平和と自由をこの地に取り戻す。\n\n§Y二、もう一人のアベド：この苦旅を経て、やがて星に至る§!\n§8黒§!の路線を歩む。陰謀の力を蓄えて権力を奪い、鉄腕でモンドを「進歩」へと駆り立てる。この道の終点は自由ではなく、別の暴政である。\n\n§Y三、スクロース：革新、救護と民主§!\n§C青と赤§!の路線を歩む。各地の人民を支援し、内戦を鎮め、軍閥に浸透し、実験と革新で社会の改造を進める。\n\n§Y四、リサ：三年剣を磨き、一度鳴けば人を驚かす§!\n§C青§!の路線を歩む。混乱の中でまず平和で幸福な避難所を築き、工業の発展に没頭し、翼が満ちてからモンドを席巻する。\n\n§Y五、大集団：究極の自由へ§!\n§8黒§!の路線を歩む。リサが認めた実験の中で生まれ、肉体の枷を脱した「究極の自由」へ至る。全路線で最も名状し難い一本である。\n\n§Yヒント：§!五つの路線は「国際研究院」「アベドの壮大な青図」「軍事建設の推進」などの序盤国策を共有し、分岐は中期にある。"
 DOT_INTRO_WAY_DVA:0 "§Y現在の完成度§!\n風龍領の国策樹は存在するが、多くの分枝はまだ制作中であり、一部の精神と代表国策は他勢力からの流用である。実際のゲーム内容を基準にしてほしい。\n\n§Y一、内政§!\n「工業発展計画」は工業化へ。「第一回公社大会」は基層自治と集団化へ向かう、風龍領で最も特色ある一本。「群星局の増設」は情報と監察の機関を作る。「黒土の術」は農業と土地を指す。\n\n§Y二、外交§!\n「友であって敵ではない」は同盟線。「遠交近攻」は拡張線。「凛冬すでに至る」「白浪天を滔る」は外部圧力下の緊急対応である。\n\n§Y三、その他§!\n「平凡な一日？」「浴槽戦争」は物語寄りの小さな支線で、大局には影響しないが追加のイベントと報酬を与える。\n\n§Yヒント：§!この勢力の内容はまだ不完全であり、主要国の脚本に慣れてから挑むとよい。"
 DOT_INTRO_WAY_FAV:0 "§Y一、起源§!\n「教会反対派の物語……」「……モンドの悲鳴に始まる」が二つの起点であり、この組織が教義の論争から生まれたのか、暮らしの苦しみから生まれたのかを決める。\n\n§Y二、権力奪取と統一§!\n「星辰墜つ」は急進的な権力奪取線。「モンド統一へ」は穏やかな拡張線。前者は速く危うく、後者は遅く確実である。\n\n§Y三、六つの教え§!\n「篤行」「繁栄」「抗争」「勤労」「自由」「諫言」の六本の教えの線は、規律、経済、闘争、生産、自由、批判の六つの路線に対応する。神学革命の具体的内容だ。\n\n§Y四、終局§!\n「モンドの悲しみより生まれ」「奪い取れ」「全ての涙を拭え」の三つの終局国策は、再建、奪権、救済という三つの全く異なる結末に対応する。\n\n§Yヒント：§!ロサリア線とバーバラ線は中期に分かれる。前者は§8強硬§!寄り、後者は§C穏健§!寄りである。"
 DOT_INTRO_WAY_FON:0 "§Y現在の完成度§!\nフォンテーヌの国策樹は現在 22 の国策のみ完成している。三本の主幹はいずれも開放済みだが、以降の分枝はまだ制作中である。\n\n§Y一、芝居の開幕§!\n本線の起点。フォンテーヌの全ては「芝居」の形で展開する。裁判も祝祭も陰謀も同じ舞台で上演される。この線はフリーナとヌヴィレットの間の権限配分を決める。\n\n§Y二、秩序の化身§!\n司法と秩序を核とし、審判官の体系と執律庭を強化し、§8権威主義§!の方向へ進み、民間の結社と急進思潮を抑え込む。\n\n§Y三、暗流の湧き§!\n地下勢力を核とし、革命テロリズム、復生主義、商会統合体制をつなぎ、§R急進§!または§8極端§!の結末へ向かう。\n\n§Yヒント：§!現段階でフォンテーヌの遊べる内容は限られている。まずはモンド、璃月、スメール、稲妻、ナタの完全な脚本を体験してほしい。"
 DOT_INTRO_WAY_GUN:0 "§Y一、家族会議§!\n「グンヒルド家族会議」が総スイッチであり、会議の後は三つに分かれる。ディルックを招きラグヴィンドと組み貴族と豪族の同盟へ、ユウラを招きローレンス残党と組み和解の道へ、あるいはアベドを支えるかバーバラを支えるか、工業線か教会線かである。\n\n§Y二、アベドを支える§!\n雪山領の工業力と組織力に賭け、§C青§!の路線を歩む。効果は早いが、家を従属的な立場に置くことになる。\n\n§Y三、バーバラを支える§!\n教会と人心から入り、§C青§!の路線を歩む。効果は遅いが道義的な基盤はより堅い。\n\n§Y四、異例の路線§!\n「未だ想わざる道」「テイワット大陸の混乱」は緊急の支線である。前者は祖訓に背く急進的な転換、後者はモンドが全面内戦に陥った後の自衛である。\n\n§Yヒント：§!グンヒルドのどの路線も「祖訓を裏切らない」を最低線とし、この線を越える選択は最も重い結果を伴う。"
 DOT_INTRO_WAY_GYP:0 "§Y一、月海執政§!\n八省を核として政務を引き受け、§C青§!の漸進改革を歩む。まず税制、吏治、教育を整え、その後に体制を語る。\n\n§Y二、月海新章§!\n立憲と議事の手続きによって璃月の権力構造を定義し直し、§C青§!の立憲路線を歩む。七星の中の穏健派との協力が必要である。\n\n§Y三、狭間で生き残る§!\n革命委員会、天権、仙人の三者の中で側を選ぶか、渡り合うか。どちらを支援し、どちらを牽制し、いつ中立を保つかが、八省が最後まで生き残れるかを直接決める。\n\n§Yヒント：§!八省に軍事上の優位はない。正面からの戦いは最善手ではない。"
 DOT_INTRO_WAY_HIL:0 "§Y現在の完成度§!\nヒルチャール部族連盟には独自の国策樹がなく、ゲーム内では主にイベントと汎用国策で進行する。\n\n§Y一、可能な方向§!\n各部族を統一し、初歩的な軍事と祭祀の体系を作り、七国の狭間で盟友や従属先を探す。\n\n§Y二、外部関係§!\n深淵教団はヒルチャールを引き込もうとし、七国はおおむね掃討を選ぶ。いかなる外交的突破もきわめて高い代償を伴う。\n\n§Yヒント：§!この勢力はまだ制作中であり、初回プレイには向かない。"
 DOT_INTRO_WAY_INA:0 "§Y一、幕府の自己修復§!\n「勘定奉行の再編」「天領奉行の再編」の二線は、財政と軍制から積弊を片づける。体制内の改革であり、速度は遅いが危険は少ない。\n\n§Y二、権柄の帰属§!\n「稲妻の権力闘争」は幕府を誰が主導するかを決める。§C八重政府§!（神子が政を執り、比較的開明）、§8軍政府§!（軍が接収し強硬）、そして第三の折衷路線である。三者は相互排他で、選んだ後は国策樹の行き先が変わる。\n\n§Y三、眼狩令の去就§!\n「狩眼の儀」と「珊瑚宮問題」が対内の二本の主軸を成す。眼狩令を維持し武力で海祇を平定するか、令を廃して和解し珊瑚宮を体制に組み込むかである。\n\n§Y四、開発と戦争§!\n「稲妻開発計画」は工業化とインフラの方向を示す。「戦争の宣伝」は対外拡張の道を開き、璃月とスネージナヤとの衝突を確定させる。\n\n§Y五、珊瑚宮の視点§!\n珊瑚宮（SAN）で開始すれば、「反抗の始まり」から「統一の暁」へと進み、幕府を倒して稲妻を統一するもう一つの道を歩む。"
 DOT_INTRO_WAY_KQP:0 "§Y一、共和国の晨§!\n革命委員会を核として璃月を再建し、七星を廃し共和を立て、§R赤§!の路線を歩む。核心は土地、工場、軍隊の同時改造である。\n\n§Y二、黎明の檄文§!\n宣伝と動員を先行させ、革命を璃月全土、さらにはテイワットの他国へ広げ、§R赤§!の対外輸出路線を歩む。\n\n§Y三、誰と戦うか§!\n先に天権を討つか（港を奪う）、先に月海亭を討つか（官僚体系を奪う）、先に仙人を討つか（正統性を奪う）。三つの順序が三つの全く異なる戦争のリズムに対応する。\n\n§Yヒント：§!革命委員会と仙人線の衝突は不可調和であり、月海亭とは交渉の余地がある。"
 DOT_INTRO_WAY_LAW:0 "§Y一、旧統の復興§!\n「氷雪の族を開き、人の世に再現す」が復辟の本線である。宗室の権威を再び掲げ、旧貴族の封地と特権を回復する。\n\n§Y二、同盟と連絡§!\n「大家族に連絡」「自由派に連絡」「野心家に連絡」の三本が並行し、それぞれ旧貴族、体制内の改革者、投機者を引き込む。三者の支持は両立せず、誰を選ぶかが復辟後の政権の形を決める。\n\n§Y三、外援§!\n「スネージナヤとの結び付き強化」は資金と武器を得る代わりにモンドをスネージナヤの属国にする。「臨んで指導に赴く」は外部勢力が直接介入する方向である。\n\n§Y四、軍事と内政§!\n「軍事準備」「内部の処理」「教訓の分析」は動手前の準備である。兵を練り、党を粛清し、旧貴族が敗れた理由を検証する。\n\n§Y五、もう一つの道§!\n「浪花の湧き」は復辟とは無関係の支線で、ローレンス家の内側の転向を指す。\n\n§Yヒント：§!ローレンスの路線で最大の分岐点は「スネージナヤに依存するかどうか」である。"
 DOT_INTRO_WAY_LYY:0 "§Y一、刻晴：革命委員会§!\n「共和国の晨」「黎明の檄文」を綱とし、七星の旧制を廃し啓明主義を行う。§R赤§!の路線であり、璃月で最も変動が大きく、抵抗も最も大きい一本である。\n\n§Y二、凝光：天権臨政§!\n「天権臨政」「天権の新秤」の二段で、法と財政によって中央の権威を再建し、§8権威主義・寡頭制§!寄りである。安定するが保守的だ。\n\n§Y三、月海亭：八省連盟§!\n「月海執政」「月海新章」で、官僚体系によって各方を吸収し、§C青§!の漸進改革を歩む。最も激烈でなく、最も効果の出にくい路線である。\n\n§Y四、仙人：閑雲の天宮§!\n「孤鶴雲を出づ」「孤鶴朝に臨む」で、三眼五顕が治世に戻り、§Y塵世主義§!の路線を歩み、人治を神治で押さえる。\n\n§Y五、その他の勢力§!\n「公子海に臨む」はスネージナヤ介入の方向。「雲来の旗替え」は雲来海の地方勢力の易幟。「沈玉自立」は沈玉谷の璃月からの離脱。七星革命委員会、月海亭八省連盟、三眼五顕の仙人もそれぞれ独立勢力として開始できる（KQP / GYP / SHP）。\n\n§Yヒント：§!璃月の路線の相互排他点は「人治を認めるか」に集中する。側を選べば基調が決まる。"
 DOT_INTRO_WAY_MOT:0 "§Y一、ジンの路線：改革と自由§!\n「モンドの明るい未来」を総綱とし、下に「道は延び続ける」（地方勢力の統合、経済の安定、改革の推進）と「モンド最暗の日」（情勢悪化後の緊急支線）に分かれる。改革が成功すれば§C公理の勝利§!（民主、自由の理想の実現）へ。圧力の下で妥協すれば§8帰港§!へ転じ、鉄腕で秩序を保ち、理想は次の機会に託す。\n\n§Y二、ノエルの路線：危急の任§!\n「臨時の代理団長」で始まり三つに分かれる。§C新たな現状に適応§!（破格の登用、不安の解消、最終的には大政奉還、青）、§8結晶の夜§!（背信、貪欲、堕落、怠惰の粛清を名目とする鉄腕の治、黒）、§R高歌猛進§!（住民投票で再任、赤）である。\n\n§Y三、その他の方向§!\n中央の権威が完全に崩れれば、「テイワット大陸の混乱」が各自治区の独自行動を引き起こす。ラグヴィンド、奔狼領、ドラゴンスパイン、グンヒルド、教会反対派、ローレンス残党がそれぞれ局を成し、モンドは多方割拠に入る。ほかに「戦争、生産、建設」の軍備線や「訓政の開始」「黒薔薇の萌芽」などの異例の路線もある。\n\n§Yヒント：§!各路線は要所で相互排他であり、一度選ぶと後戻りは難しい。"
 DOT_INTRO_WAY_NAT:0 "§Y一、統一の深化§!\n「部族議会の招集」「ナタ民族意識の普及」「抗淵戦争会議の開催」の三本が並行して進み、部族連盟を徐々に本当の国家機構へと作り替える。「万火帰一」が統一線の収束である。\n\n§Y二、六部族の異議§!\n沃陸の邦、響きの子ら、流泉の民、懸木の人、花羽会、煙謎主にはそれぞれ「異議の初萌」の線がある。中央の権威が弱まれば、六族は各自の自主や対抗へ転じ、ナタは再び分裂する。\n\n§Y三、深淵の門§!\n「静まらぬ門」は燼寂海の奥の裂け目を指す。ナタで最も危険で最も誘惑的な道であり、深淵の力で深淵に抗う。\n\n§Yヒント：§!ナタの路線の核心は「中央と部族」の綱引きであり、どの急進路線も六族の連鎖反応を招く。"
 DOT_INTRO_WAY_NDK:0 "§Y一、月と霜§!\n「雪浪と蒼林の舞」は霜月の子らの本線であり、月神への信仰と自然の道を取り戻す。「三相月臨」は信仰線の収束で、月神再臨の終局を指す。\n\n§Y二、技術と生計§!\n「設計手稿の研究」は蛋巻工房につながり、機械と発明の道を歩む。「月矩力エネルギー」は在地のエネルギーを開発し、工業化の基礎となる。\n\n§Y三、人の選択§!\n「捕虜の受け入れ」は戦俘と流民の扱いを決める。「執政官との私的接触」は外交と妥協の道。「各地の残軍の統合」は武力で残局を収める。\n\n§Y四、赤旗§!\n「赤旗翻る」は在地の伝統とは全く異なる路線である。革命によってノドクラーイの社会構造を改造し、§R赤§!の結末へ向かう。\n\n§Yヒント：§!ノドクラーイの路線の分岐は「旧き月を信じ続けるか、別の新法を立てるか」にあり、赤旗線は他の路線と最も徹底的に排他である。"
 DOT_INTRO_WAY_PRI:0 "§Y一、塵星旅夢§!\n天理の体系の自己延続の線である。既存の法則で七国の秩序を立て直し、深淵と僭越を抑え、§Y塵世主義§!の絶対版を歩む。\n\n§Y二、謝幕§!\n天理の体系が自ら終わる路線である。旧秩序はすでに使命を果たしたと認め、世界を凡人に返す。全路線で最も特殊な一本だ。\n\n§Y三、七国との関係§!\n天理は通常の外交に関与しない。その行動は神選、神諭、規則による制裁として現れるため、一歩ごとに全図の情勢を動かす。\n\n§Yヒント：§!天理の遊べる内容は後期と終局に偏り、初回プレイには向かない。"
 DOT_INTRO_WAY_RAG:0 "§Y一、貴族の若旦那§!\n家を本位として秩序を再建し、§8権威主義・貴族制§!の方向へ進む。まず騎士を強化し、国境の密輸を片づけ、酒造と商路を財政と情報の網に変える。\n\n§Y二、自由連盟§!\nドラゴンスパイン、奔狼領、グンヒルドなどの自治区を「自由」の共通の旗の下に結び、§C青§!の路線を歩む。代償は主導権を他者に分けることだ。\n\n§Y三、モンドを再び偉大に§!\n家を中心にモンドを作り直し、§8強硬な民族主義§!の路線を歩む。この線は騎士団と最も正面衝突しやすく、スネージナヤとローレンスの企みを最も招きやすい。\n\n§Y四、影の中の線§!\n「ガイアに対する陰謀」「山雨来たらんと欲して風楼に満つ」は二本の暗線である。ガイアの正体が明かされれば、モンドの情報体系と外交の構図もそれに伴って変わる。\n\n§Yヒント：§!ラグヴィンドの三本の本線は相互排他であり、「自由連盟」と他の二本の衝突が最も鋭い。"
 DOT_INTRO_WAY_SAN:0 "§Y一、反抗の始まり§!\n海祇の民兵を動員し、珊瑚宮本部を築くことから始め、島の宗教的権威を軍政の組織へ変える。これが全路線の基礎である。\n\n§Y二、統一の暁§!\n幕府を倒し稲妻全土を統一することが珊瑚宮の最終目標である。この線は三奉行の残党、幕府の旧臣、祟りの汚染を同時に処理せねばならない。\n\n§Y三、停戦と和議§!\n眼狩令の廃止を条件に幕府と交渉し、海祇の事実上の自治を得る。この線は戦力を保つが、一部の追随者を失う。\n\n§Y四、邪眼の選択§!\n邪眼に頼り続ければ戦力を素早く補充できるが、代償は全軍の寿命である。邪眼を断てば長い戦力の空白を耐えねばならない。\n\n§Yヒント：§!珊瑚宮のどの路線も「海祇の人が生き延びられるか」を最低線とする。"
 DOT_INTRO_WAY_SDH:0 "§Y一、長き独立の道§!\n遊牧と山地戦でいかなる占領者も疲弊させ、長期独立の路線を歩む。効果は最も遅いが、最も滅ぼされにくい。\n\n§Y二、赤王の旗§!\n飾金砂原と合流し、赤王の旧統を共に掲げ、砂漠統一の可能性と引き換える。\n\n§Y三、部族公議§!\n各部族の公議で緩やかな連盟を保ち、どの勢力にも呑み込まれまいとする。\n\n§Y四、沙海商路の算盤§!\n略奪から護商へ転じ、商路の収入で生存の余地を得る。最も現実的な一本である。\n\n§Yヒント：§!千壑沙地は資源が痩せ、いかなる拡張もまず補給を解決せねばならない。"
 DOT_INTRO_WAY_SGD:0 "§Y一、赤王の旗§!\n赤王の旧統の復興を掲げ、§8強硬§!の路線を歩み、全ての部族と旅団を一つの旗の下に収める。\n\n§Y二、旅団公議§!\n旅団と部族の公議で王権を置き換え、共和の路線を歩む。緩いが崩れにくい。\n\n§Y三、主母の権柄§!\n女性長老の集団が権を執り、部族の伝統と神権を結びつけた路線を歩む。\n\n§Y四、兵、雨林に向かう§!\n戦争で雨林と砂漠の旧帳を清算する。対外拡張で最も直接的かつ最も危険な一本だ。\n\n§Y五、沙と林§!\n雨林と和解し、互いの平等を認める。血を流さずに済む唯一の路線だが、双方が利益を譲る必要がある。\n\n§Yヒント：§!砂漠三地の路線は高度に重なり、雨林勢力との関係が全局の鍵である。"
 DOT_INTRO_WAY_SGS:0 "§Y一、沙と林§!\n雨林と砂漠の調停者となり、和解と引き換えに中立の地位を得る。最も安定した収益の一本である。\n\n§Y二、沙海商路の算盤§!\n通路を商いに変え、関税と中継で国を立てる。\n\n§Y三、藩属の影§!\n雨林か砂漠の一方に依存し、保護と引き換えに主権を差し出す。\n\n§Y四、赤王の旗§!\n砂漠統一運動に加わり、独立の地位を捨てて戦後の位置を得る。\n\n§Yヒント：§!蒼漠囿土は規模が限られ、独立路線には極めて強い手腕が要る。"
 DOT_INTRO_WAY_SHP:0 "§Y一、孤鶴雲を出づ§!\n仙人が世に入り、人治に代えて神治をとり、§Y塵世主義§!の路線を歩み、契約を核とする旧秩序を再建する。\n\n§Y二、孤鶴朝に臨む§!\n仙人が直接朝に臨んで政を執り、璃月を神と仙の共治の国とする。§Y塵世主義§!の強硬版であり、凡人政治と完全に決裂する。\n\n§Y三、仙と凡の間§!\n凡人の官僚を残し、仙人が国を監る。折衷の路線であり、璃月を速やかに安定させるが、仙人も凡人も満足しない。\n\n§Yヒント：§!仙人線と革命委員会線は徹底的に排他であり、一度開戦すれば和談はない。"
 DOT_INTRO_WAY_SNE:0 "§Y一、愚人衆の統合§!\n「愚人衆を召集せよ！」が権力線の起点であり、執行官と将校団の従属関係を決める。その後「偉大なる抗争」が対外衝突を正当化し、全面戦争の世論を整える。\n\n§Y二、工業と軍備§!\n「市長の工業計画」は地方工業化の路線で、効果は遅いが基盤は堅い。「晶角湾軍港」と「空軍の建設」は二本の軍種傾斜線であり、海軍と空軍はどちらか一方しか優先できない。\n\n§Y三、社会§!\n「識字運動」は全民の識字率を高める。長期では最も収益の高い投資だが、短期では軍需生産を圧迫する。\n\n§Y四、二本の暗線§!\n「驟雪」と「冥府への安魂歌」はスネージナヤ内部のより深い動揺を指す。前者は突発的な変局、後者は陵墓と死の信仰に関わり、女皇の路線とは異なる結末に至る可能性がある。\n\n§Yヒント：§!スネージナヤの路線の核心は「どこまで動員するか」であり、限度を超えた動員は後方の崩壊を招く。"
 DOT_INTRO_WAY_SUM:0 "§Y一、教令院の三つの道§!\n§C聖樹の加冕§!：真の小吉祥草王を迎え、神権で秩序を再建する。§C学者の共和§!：賢者の独断を廃し、学者の共議を行う。§8造神の王座§!：造神計画を完成させ、人造の神で草神に代わる（黒、代償は極めて大きい）。\n\n§Y二、雨林と砂漠の再均衡§!\n「沙と林」は和解の線であり、砂漠の平等な地位を認める。「長き独立の道」「藩属の影」「沙海商路の算盤」は砂漠の視点からの三つの出口、すなわち独立、従属、商をもって国を立てることである。\n\n§Y三、砂漠の旗§!\n「赤王の旗」は赤王の旧統を復興する。「兵、雨林に向かう」は戦争で決着をつける。「旅団公議」は部族共和の路線を歩む。「主母の権柄」は女性長老の集団が権を執る。\n\n§Y四、アランナラ§!\n桓那蘭那（VAN）で開始し、「アランナラの訴え」「山雨来たらんとす」から出発して、アランナラ自身の存続の道を歩む。雨林の政局と互いに影響し合う。\n\n§Yヒント：§!スメールの路線の分岐点は「神の地位」にある。迎神、廃神、造神の三者は両立しない。"
 DOT_INTRO_WAY_VAN:0 "§Y一、アランナラの訴え§!\nアランナラの願いを受け入れ、スメールの人の世の事情に関わる。これが全路線の起点である。\n\n§Y二、山雨来たらんとす§!\n教令院、砂漠、愚人衆の三方の圧力に直面し、森に籠もるか、外へ同盟を求めるかを選ぶ。\n\n§Y三、発展と軍備§!\n「工業の発展」「軍隊の建設」の二線はアランナラを単なる守勢から脱させうるが、森が改造される代償を伴う。\n\n§Y四、アランナラ主義§!\n種族の同一性を核とし、人間の干渉を排する極端な路線である。イデオロギー上は§8刑鼎主義§!の類に属し、穏健路線とは排他である。\n\n§Yヒント：§!アランナラの路線の分岐は「人間と共存するか」にある。"
 DOT_INTRO_WAY_YLH:0 "§Y一、雲来の旗替え§!\n雲来海における七星の治権を地方勢力に置き換え、§8権威主義§!の路線を歩み、関税と船隊と港で立つ。\n\n§Y二、外力を招き入れる§!\nスネージナヤや他の外部勢力と協力し、軍艦と借款を得る。代償は港の主権である。\n\n§Y三、両天秤で利を取る§!\n革命委員会、天権、月海亭の三方に同時に通行権を売り、値の高い方に味方し、形勢が明らかになってから側を選ぶ。\n\n§Yヒント：§!雲来海には縦深がなく、封鎖されれば速戦で決めるしかない。"
 DOT_INTRO_TEXT_0:0 "制作中"
 DOT_INTRO_TEXT_6:0 "一、§Y原初の主§!と§C三月の女神§!\n\nその頃、世に生死の境はまだなく、意志は無数の存在の間を流れていた。かつてこの星を統べる原初の生命があり、§C三つの月§!を大地から解き放って昇らせた。§R葬火の年§!、原初の声は唖然とした§0漆黒§!の中で再び響いた。\n\nかつて一つの時代があった。原初の天球を牽く銀の輪は、その数なお三つであった。\n\nその時、香水海が育んだ§Y始源の竜§!は深空を翔け、星間の霧の中へ消えた。\n\n§0黯色の霧§!はかくも深く、満天の星の光すらその引力から逃れられなかった。この星も呑まれる前に答えを見つけようと、巨竜は一人苦旅に出ることを決めた。彼は地から§C三つの皓月§!を昇らせ、潮汐の維持がこの小さな世界を固く縛った。月光は終焉の長夜に豊かな大地を照らし続け、遊竜が霧の国から戻るまで続くはずだった。だが千年が過ぎ、また千年が過ぎても、§C月の三姉妹§!は旧き主を待ち続けた。あの日、翼をまとった§O降臨者§!が晨星を踏んでやって来るまでは。\n\nそれは予言にいう群星を消す大敵ではなく、世界の存続を支える泉を奪うつもりもないようだった。招かれざる訪客を前に、星の意志を代行する§C三人の守護者§!は為す術を知らず、延々と論争した。だが臣従か反逆か、戦か死か、§O万軍の王§!は己の行く手を阻むすべてを無情に碾き潰す。\n\nかつて一つの時代があった。原初の天球を牽く銀の輪は、その数なお三つであった。\n\nその時、晨星を踏み月の上に座す翼ある者は、永遠の天の主となった。\n\n§O烈しい日光§!が空を掃ったが、新しい王座はなお§C月夜の三姉妹§!のために天上の位置を空けておいた。おそらく彼の構想の中で、元素の奔流すら整然としたこの世界には依然として潮汐が必要だったのだ。三十夜の詠者は知っていた。彼女たちだけでは、必ず来る湮滅からこの孤独な行星を守れないと。最後の寂滅が来る前に、善悪の闘いで誰が勝とうと、虚無に帰す永劫よりはましだった。\n\n彼女たちの望みどおり、高天の主は§0黒き霧の中の破壊者§!を厭った。暗域を越える長い旅路で、それはすでに無数の星の陨滅を見てきたからだ。だから彼女たちも「秩序」を選び、より正確に言えば、それを容れた。それは§C三月§!と§O晨星§!が共に治めた時代、永遠がなお永遠であった時代だ。\n\nかつて一つの時代があった。原初の天球を牽く銀の輪は、その数なお三つであった。\n\nその時、高天の下す律法はまだ結集しておらず、人理の境界もまだ引かれていなかった。\n\n神の民は新しく造られた園と谷に散歩し、その数は数えきれなかった。空の使徒は蒙昧な群れの中を歩き、繁栄と知恵を蒔いた。やがて神の約した繁栄が智識を呼び覚まし、智識が疑いを生んだ。神の使徒は凡人の愚かさに震怒し、その問いの前で御史たちは黙した。そこで人々は空へ目を向け、日光の届かぬ夜に§C三つの皓月§!へ祭礼を捧げた。\n\n夜幕は大地に眼を垂れた。かつて銀星が竜衆の天船に航灯を灯したように。彼女たちは狂気と霊感を月の下へ持ち帰った。それは「秩序」が与えられぬ答えだった。晨星が再び昇ると、山頂から戻った主祭は小さな輪符を持ち帰った。この「月の輪」こそ、§C三月§!が民と結んだ新たな約である。\n\nかつて一つの時代があった。原初の天球を牽く銀の輪は、その数なお三つであった。\n\n三つの世界の酣睡者はまだ目覚めず、夜空だけが彼らの夢と渇望を知っていた。\n\n烈怒無情な天の父に比べ、§C三月§!の柔らかな光はいつも慈母のように迷える魂を慰めた。だから地上の諸邦も月夜の主母へ最も多くの熱意を捧げた。彼らはヴィンダグニルの山頂に登り、皓月に桂冠の詩篇を捧げ、あるいは琅玕の祭場に入り、精雕の美玉で夜の姿を映し、あるいはアルカディアの聖林で樫の林の金枝を折った。陽が昇る前に、空を越えようとする一切の愛欲はここから生まれた。\n\nだが永遠の天の主にとって、月光もまた聖愛の一縷にすぎない。空を試すことは決して許されず、規則を越える一切の探求は破滅を指す。ついに世界の果ての長剣が空を劃ったとき、「永遠」もその終末を迎えた。\n\nかつて一つの時代があった。原初の天球を牽く銀の輪は、三月のうち二つがすでに墜ちていた。\n\n「永遠」に庇護されぬ世界は終末へ向かっていた。「新月」が再臨し、運命の紡錘を動かすまでは。\n\n「§Y恒月§!」が墜ちたとき、天地は覆った。\n\n「§R虹月§!」が砕けたとき、赤き影は§0淵海§!に隠れた。\n\n「§C霜月§!」が止まったとき、列邦は沈んだ。\n\nだが原初の香水海は年に千度の月震に今も波紋を立て、金の弦が織り上げた長歌も銀星の曇りに歌を止めはしない。幾重の天幕を隔てて、大地の人々は真の月光を浴びられずとも、時の河の潮汐はなお互いを繋いでいる。夜も昼も。\n\n我らは繁星の軌跡を辿り、あるいは浅き眠りの階段を下りる。\n\n黎明と夕照の間を彷徨い、帷幕の向こうの答えを探す。\n\n永遠に縛られぬ心は、なお微かに、しかし絶え間なく悸動する。\n\n永遠と須臾の夢の中で、月に捧げる終時の訪れを待つ。\n\n二、黄金城と妖精\n\n今ではもう追憶すらできぬ遠い歳月、極北の城邦は金糸のように痩せた氷原を縫い、深廊の溶炉は日夜轟いていた。巨獣の遺骸の上で、工匠は禁忌の術で無数の妖霊を鍛え、さらに傾落した霜月の光を瑕なき血肉へと紡ぎ、もと脆く弱い躯の上に嵌めた。それは本来、高天の主が持つ創生の権能だったが、反逆の使徒が凡人の手に委ねた。いつかこれらの小さな生霊が世界と一体化した完全な生命を創り出さんことを夢見て。\n\n三、灯を鋳る者\n\n伝説によれば最初の鋳灯者は極北の冬都から来た。夜鶯の紋章が彼の栄光の家系を示す。もとは密偵として働く家だったが、冬のツァーリの恩賞により栄誉を..."
