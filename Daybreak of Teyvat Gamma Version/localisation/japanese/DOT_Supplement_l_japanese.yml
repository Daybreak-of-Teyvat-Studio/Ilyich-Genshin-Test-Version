 HOL_shell_shocked_spectator:0 "大戦を傍観した砲弾恐怖症患者"
 HOL_shell_shocked_spectator_desc:0 "先の大戦中に中立国であったオランダは、西部戦線から逃れる避難者のための最も近くにあった安全な避難所であった、しかしオランダ人は戦争の恐ろしさを、あまりにも近くで傍観者として目の当たりにしていた。その結果、強力な平和主義運動が国民の大部分に浸透するようになり、政府による軍事予算の増額に対して大きな困難をもたらすようになった。ただ海軍のみが、現在でも幾分かの威厳を保っているだけである。\n\n防衛戦争或いは、「平和主義に基づいた戦争」がこのような感傷をこの国から除去するために必要とされるだろう。"
