 SUM_SDH_WAR_Medic_desc:"医帐随军，能就地治的就地治，治不了往后送。"
 SUM_Neo_SDH.180.t:"战地医帐"
 SUM_Neo_SDH.180.d:"医帐随军，能就地治的就地治，治不了往后送。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
