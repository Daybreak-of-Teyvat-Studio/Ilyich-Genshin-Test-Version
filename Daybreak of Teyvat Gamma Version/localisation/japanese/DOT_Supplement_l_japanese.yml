 SOV_vyacheslav_molotov:0 "ヴャチェスラフ・モロトフ"
 SOV_workers_government_idea:0 "労働者政府"
 SOV_workers_government_idea_desc:0 "労働者政府万歳。支配階級は権力から一掃された。労働者が再びこの国を統治するのだ。"
 SOV_yakovlev_design_bureau_dissolved_flag:0 "$SOV_mig_design_bureau_dissolved_flag$"
 SOV_young_builders_of_communism:0 "共産主義の若き建設者"
 SOV_young_builders_of_communism_desc:0 "我々は今日の大人のためではなく、子供やまだ生まれていない世代のために社会主義を建設している。彼らが我々の始めた仕事を完遂できるよう、我らの成果をいかに改善し発展させていくかについて彼らに教える必要がある。"
