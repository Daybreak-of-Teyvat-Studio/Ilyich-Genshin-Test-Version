Alice:0"Госпожа Элис"
Alice_desc:0"Госпожа Элис: известный искатель приключений, старейшина Ковена Ведьм, автор путеводителей, мать Кли. Она написала «Путеводитель по Тейвату»."
Shiki_Taishou:0"Генерал Сики"
Shiki_Taishou_desc:0"Генерал Сики: бумажный сикигами, созданный Корэмаса Корэхито, хранитель «Кёкуроку Онмё-рё». После того как «Кёкуроку Онмё-рё» был открыт, он потерял часть памяти и отправился в путешествие. Похож на самурая в доспехах, может летать. Он управляет частью сооружений и использует сики-карты и онмё-дзюцу."
Uncle_Tian:0"Дядя Тянь"
Uncle_Tian_desc:0"Дядя Тянь: Тяньшу, одна из Семи Звёзд Ли Юэ. Редко занимается делами, чаще рыбачит на пристани."
Soraya:0"Сорайя"
