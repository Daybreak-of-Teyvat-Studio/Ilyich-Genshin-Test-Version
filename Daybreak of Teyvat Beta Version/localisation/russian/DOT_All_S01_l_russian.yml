DOT_ControlProvince.4.t:0"Храм тысячи ветров пал!"
DOT_ControlProvince.4.d.generic:0"Храм тысячи ветров, древний памятник и административный центр [FROM.FROM.GetAdjective], захвачен войсками [FROM.GetAdjective]. Войска [FROM.FROM.GetAdjective] отчаянно сопротивлялись, но были отброшены.\n\nВосстановленные руины снова разрушены. Есть сообщения, что ополченцы [FROM.FROM.GetAdjective] укрылись в подземельях."
DOT_ControlProvince.4.a:0"Мы ещё вернёмся."
DOT_ControlProvince.4.b:0"Древняя святыня ветра теперь наша!"
DOT_ControlProvince.4.c:0"Что там, кроме стражей руин?"
DOT_ControlProvince.4.e:0"Был такой храм в Мондштадте?"

#5 劳伦斯堡
DOT_ControlProvince.5.t:0"Замок Лоуренсов пал!"
DOT_ControlProvince.5.d.generic:0"Величественный замок Лоуренсов на юге Мондштадта захвачен войсками [FROM.GetAdjective]. Богатства, награбленные аристократами, сгорели дотла, замок рухнул.\n\nВойска [FROM.GetAdjective] устроили праздник на руинах. Означает ли это конец старых аристократов?"
DOT_ControlProvince.5.a:0"Этого не может быть!"
DOT_ControlProvince.5.b:0"Прощайте, старые аристократы."
DOT_ControlProvince.5.c:0"Лоуренсы получили по заслугам."
DOT_ControlProvince.5.e:0"В Мондштадте всё всегда так плохо."

