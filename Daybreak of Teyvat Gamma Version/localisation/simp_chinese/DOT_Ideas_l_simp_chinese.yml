 Thunder_Sword:0 "无想的一刀"
 Thunder_Sword_desc:0 "幼子睡前聆听故事，母亲为其讲述的是将军斩魔神降异族的传说。少年少女踏遍群岛，眼中所见是雷霆一刀劈斩而成的峡谷，与森然矗立的苍白蛇骨。士兵奔赴战线，口中高喊的是常道恢弘，鸣神永恒。百姓安居乐业，心中感怀的是将军及其麾下尽忠职守的三奉行。雷电将军的威名，早已超脱生命桎梏，化作了稻妻永世传承的信仰。"
 Great_Unity:0 "天下一统，民心所向"
 Great_Unity_desc:0 "滚滚长江东逝水，浪花淘尽英雄。是非成败转头空。青山依旧在，几度夕阳红。白发渔樵江渚上，惯看秋月春风。一壶浊酒喜相逢。古今多少事，都付笑谈中。"
 Daybreak_of_Teyvat:0 "黎明"
 Daybreak_of_Teyvat_desc:0 "暗夜终散，天光将至"
 Polar_Night:0 "极夜"
 Polar_Night_desc:0 "天幕沉沉，日月无光"
 Polar_Night_Meeting:0 "极夜会议"
 Polar_Night_Meeting_desc:0 "会议过后，提瓦特将陷入无边战乱，各路群雄竞相结盟，以逐鹿天下。"
 idea_Teyvat_People:0 "尘世之民"
 idea_Teyvat_People_desc:0 "遥远时空的故事里。巨人盘古的血液化作江河。普鲁沙的身体被切割滋养了宇宙众生。伊米尔的脑髓成为天空云海。原初之人开辟鸿蒙后，元素诸神将文明赐予人类，同时与人一起生活在提瓦特大陆。但人类因为自己的贪欲，擅自研究禁忌的技术，由此带来战争并使文明遭到毁灭。人类文明在神的庇护下慢慢复兴，神灵便建立了天空之岛。人们藉由对神灵的信仰，获赐了驱动元素的力量，得以在荒野中筑起家园。神灵在天空岛上观察人类，并选出杰出之人登上天空岛成为神，守护世界秩序。"

traveler:0 "旅行者"
traveler_desc:0 "旅行者"
Heroes_of_Night:0 "暗夜英雄"
Heroes_of_Night_desc:0 "四年后，已成青年的迪卢克回到了蒙德城，接下了家族的产业，成为了晨曦酒庄的新任庄主。四年间，伊洛克被证实为叛变者，遭到骑士团肃清。大团长法尔伽远征域外，由新任副团长琴出任代理团长一职。晨曦酒庄主人的归来本应撼动蒙德，却意外地没能引起什么波澜。因为当时蒙德人的注意力，都聚集在一位神秘的蒙德城守护者身上。已知特征，只有偶尔嗅到的烧焦气味，与黑夜中一闪而过的火红身影。困扰蒙德已久的魔物陈尸野外；久遭通缉的窃贼被倒吊在神像前；西风骑士们整队前往对抗一位作恶已久的深渊法师，却发现敌人早已败亡。凭借酒后闲话，这位守护者的事迹在蒙德城里飞速传开。最近，他被安上了一个具体的称呼——暗夜英雄。外人面前，迪卢克老爷似乎也对这位英雄不抱好感。每每听到这个名字，他都忍不住紧蹙眉头。酒业行会的埃泽是极少数知情者之一。他私下问迪卢克老爷：对暗夜英雄表现出厌恶莫非也是演技，是为了避免被骑士团查出身份？迪卢克老爷却依旧皱着眉头，硬邦邦地回答：这个称号品味太差了。"
Swirling_Dance_of_Foam:0 "浪沫的旋舞"
Swirling_Dance_of_Foam_desc:0 "作为西风骑士团游击小队的队长与声名显赫的浪花骑士，优菈长期率部在外巡逻，斩获过诸多功勋。驻扎在高山深涧中的骑士们时常成为魔物的突袭目标，优菈能用最为迅速的支援排除险情，化解危机，她也屡次率队主动进攻，捣毁深渊教团的据点，将阴谋扼杀于萌芽状态。可优菈的身世尤为特殊，诸多矛盾盘根错节——她是劳伦斯家族的末裔，被蒙德民众视为罪人之血的具象。这样的她却在多年前与家族决裂，加入了西风骑士团。碍于难以消除的偏见，优菈并未得到公正的对待。在蒙德民众眼里，她始终是外人，甚至——危险人物。多年来的经历促使优菈塑起无形之盾，保护自己免受无妄之灾。复仇一词，或许是这面盾牌最为外显的一角。唯有抛去流言蜚语，试着接受她待人处世的逻辑，才能认识到这位少女复杂外壳下的原貌吧。"
Shining_Idols:0 "闪耀偶像"
Shining_Idols_desc:0 "芭芭拉是西风教会的祈礼牧师，同时也是蒙德城的闪耀偶像。只要看到芭芭拉，心情就能变好。—一蒙德城里流传着这样的说法。实际上，不只是心情，伤口或者身体不适也能一起治愈。人们知道，芭芭拉可以通过水元素的神之眼，释放奇妙的魔法。但在芭芭拉心中，最神奇的魔法只有切实的努力而已。"
