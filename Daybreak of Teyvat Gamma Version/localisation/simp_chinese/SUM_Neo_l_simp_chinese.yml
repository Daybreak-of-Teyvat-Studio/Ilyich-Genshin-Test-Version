 SUM_Neo.273.t:"划界"
 SUM_Neo.273.d:"商道与绿洲的边界被重新画清。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。"
