 INA_reliablefirepower:0 "结构精简"
 INA_reliablefirepower_desc:0 "优化火炮结构，提升可靠度"
 INA_cannonsupport:0 "火炮支援"
 INA_cannonsupport_desc:0 "为了让部队得到更多的火力增援，我们必须调整我们的火炮架构，这种全新的火炮调整能够使得我们在同样的战场宽度下多部署一半的炮兵。"
 INA_cannonsupport_effect_tooltip:0 "密接炮兵阵地，使得战斗支援营：炮兵战场宽度-1."
 INA_artillerystandard:0 "标准整合"
 INA_artillerystandard_desc:0 "将我们对炮兵的一系列改革整合化。体系化"
