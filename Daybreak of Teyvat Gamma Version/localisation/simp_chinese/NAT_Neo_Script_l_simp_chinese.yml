 NAT_Springs_Rip_Crown_Idea:"逐浪冠冕"
 NAT_Springs_Rip_Crown_Idea_desc:"流泉之众于河口设逐浪之冠试炼。一后生踩上浪板，冲入激流，浪头一个接一个压来。岸上老舟工手搭凉棚看着，旁人问：「此冠真恁难戴？」老舟工冷笑一声：「浪打不落的，方配戴。」话音未落，那后生脚下一歪，翻入水中，浪板抛起老高。众人皆替他捏一把汗，他却自水下钻出，抹一把脸，复攀上浪板。老舟工方将手中那顶贝螺冠往怀中一收，候他再冲上来。后生第三次冲至浪尖，身子稳住，老舟工乃将冠抛出。"
