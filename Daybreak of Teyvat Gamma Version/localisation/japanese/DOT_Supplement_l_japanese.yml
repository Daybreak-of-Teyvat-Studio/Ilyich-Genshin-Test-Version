 ITA_self_propelled_guns_dynamic_modifier_tt:0 "§Y軽§!、§Y中§!および§Y重自走砲§!: $production_cost_tt$§G-5%§!\n§Y軽§!、§Y中§!および§Y重駆逐戦車§!: $production_cost_tt$§G-5%§!\n"
 ITA_serafino_mazzolini:0 "セラフィーノ・マッツォリーニ"
 ITA_servizio_informazione_militare_ns:0 "$ITA_servizio_informazione_militare$"
 ITA_servizio_informazione_militare_ns_desc:0 "我が国の諜報機関は外国からのスパイ攻撃を防止すると同時に、この国の世界を巻き込んだ野望をより強固なものとしてくれる存在だ。"
 ITA_setting_course_ns:0 "$ITA_setting_course$"
 ITA_setting_course_ns_desc:0 "$ITA_setting_course_desc$"
 ITA_shadow_of_mussolini:0 "ムッソリーニの影"
 ITA_shadow_of_mussolini_desc:0 "権力の座を追われてもなお、イタリアの政治において大きな位置を占めるムッソリーニの影から逃れるのは容易なことではない。"
 ITA_socialist_cooperation:0 "社会主義者達の連携"
 ITA_sold_obsolete_escort_ships_ns:0 "旧式の護衛艦を売却"
 ITA_sold_obsolete_escort_ships_ns_desc:0 "他国に戦艦を輸出したことで、我が国の産業力が向上した。"
 ITA_southern_designer_improved_tt:0 "§Yこの南部の設計社は、既に強化済みだ§!。"
 ITA_southern_designer_tt:0 "イタリア南部にある設計社だ。国家方針「§Y$ITA_modernize_the_mezzogiorno$§!」および「§Y$ITA_new_industrialization_program$§!」を完了すると、この設計社を強化できる。"
 ITA_specialization_dynamic_modifier_tt:0 "§Y全航空装備§!: $production_cost_tt$§R+5%§!\n"
 ITA_standardization_dynamic_modifier_tt:0 "§Y全航空装備§!: $production_cost_tt$§G-5%§!\n"
 ITA_stockpiling_fuel:0 "燃料の備蓄"
 ITA_stockpiling_fuel_desc:0 "大量の予備燃料を確保しておくことで、我が国の軍隊をより長期にわたって動かすことが可能となる。"
 ITA_strengthened_heavy_industry:0 "重工業の強化"
 ITA_strengthened_heavy_industry_desc:0 "産業力の拡大はそのまま生産力の向上にもつながる。"
 ITA_strengthened_the_airforce:0 "空軍を強化した"
 ITA_strengthened_the_airforce_desc:0 "イタリア空軍は、再び世界で最も偉大な航空部隊の一つに名を連ねることとなった。訓練を受け新たにパイロットとなった者達は、その偉大さを披露する時を今か今かと待ちわびている。"
 ITA_strengthened_the_army:0 "陸軍の強化"
 ITA_strengthened_the_army_desc:0 "軍隊の拡大を通じて我々は部隊の動員の仕方や、彼らを団結力のある戦闘集団にまとめ上げる方法について、非常に多くのことを学べた。"
 ITA_subject:0 "$OVERLORDADJ$ $ITA$"
