 SUM_Neo.266.t:"永恒的教令院"
 SUM_Neo.266.d:"教令院宣布，它的统治与须弥同在。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。"
 SUM_Neo.266.a:"加速造神的工序"
 SUM_Neo.266.b:"暂缓，先看住学院"
 SUM_Neo.267.t:"造神王座"
 SUM_Neo.267.d:"人偶之神坐上王座，教令院站在它身后。须弥有了一个可以被下令的神，和一个下令的学院。教令院的门槛这几天被踩得很低，进去的人比出来的人多。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。"
 SUM_Neo.267.a:"调集全部资源"
 SUM_Neo.267.b:"留一手，别赌上须弥"
 SUM_Neo.268.t:"教令院永恒摄政"
 SUM_Neo.268.d:"神造出来了，却谁也不肯让它掌权。教令院宣布以神之名摄政，一直摄政下去。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。"
 SUM_Neo.268.a:"让新神更快睁眼"
 SUM_Neo.268.b:"把风险压在柜子里"

