DRA_ID_Born:0"Код: Рождение"
DRA_ID_Born_desc:0"Есть три типа людей: полезные, бесполезные и вредные. Ради полезных мы проведём великий план. Он принесёт не только могущество, но и преобразит людей. Мы называем его «Рождение»."
DRA_By_Flesh:0"Алхимия плоти"
