l_simp_chinese:

 SAN_PW_Dawn_Of_Unification:"统一之晓"
 SAN_PW_Dawn_Of_Unification_desc:"御建鸣神的旗帜自天守阁落下。珊瑚宫心海以征服者的身份走进这座城，第一次不必仰望它。胜利带来了整片鸣神列岛，也带来了一个从未准备过的问题：接下来该怎么办。"
 SAN_PW_Ashes_Of_Tenshukaku:"天守阁的余烬"
 SAN_PW_Ashes_Of_Tenshukaku_desc:"雷电将军的下落众说纷纭。有人说她战死于一心净土，有人说她被封印在梦想一心的刀鞘里。海祇军在天守阁废墟中反复搜寻，只找到一把没有主人的太刀和一具仍在运转的人偶躯壳。"
 SAN_PW_Shogunate_Surrender_Edict:"幕府的降表"
 SAN_PW_Shogunate_Surrender_Edict_desc:"三奉行的残余联名递上降书。文书用旧式的敬语写成，通篇称珊瑚宫为僭主，却不得不承认眼狩令的失败。心海在降书上按下了现人神的印。"
 SAN_PW_Dissolve_Three_Commissions:"三奉行的解散"
 SAN_PW_Dissolve_Three_Commissions_desc:"天领、勘定、社奉行——维系稻妻数百年的三根柱子被逐一拆下。九条孝行在狱中拒绝进食，柊慎介供出了勘定奉行与愚人众的全部账目，神里家则交出全部地契换取家族存续。"
 SAN_PW_Vision_Amnesty:"神之眼大赦"
 SAN_PW_Vision_Amnesty_desc:"被收缴的神之眼堆满了天守阁的地下库房，成千上万枚玻璃珠般的愿力在黑暗中低鸣。心海下令悉数奉还，并宣布从今往后，谁也无权夺走他人的愿望。"
 SAN_PW_Narukami_Clergy_Reform:"鸣神神职改组"
 SAN_PW_Narukami_Clergy_Reform_desc:"鸣神大社的巫女们跪在珊瑚宫军前。心海没有拆毁神社，只是把神职名册重新誊写了一遍：留下的继续奉香，不肯署名的送去离岛。"
 SAN_PW_Military_Occupation:"鸣神旧地军管"
 SAN_PW_Military_Occupation_desc:"海祇军开进稻妻城、神里屋敷与九条阵屋。五郎颁布临时军管令：宵禁、通行证、粮食配给。秩序维持住了，怨言也在暗处滋长。"
 SAN_PW_Provisional_Government:"稻妻城临时政府"
 SAN_PW_Provisional_Government_desc:"一张由海祇旧臣、鸣神降吏与离岛商贾拼凑的临时政府名单摆在案上。没有人的名字让所有人都满意，但没有人敢拒绝。"
 SAN_PW_Fatui_Hunt:"愚人众清剿"
 SAN_PW_Fatui_Hunt_desc:"愚人众在稻妻经营多年的据点被逐一起获：邪眼工厂、北国银行分行、离岛的走私码头。第八席「女士」已死，第六席「散兵」携雷神之心不知所踪。"
 SAN_PW_Kamisato_Accord:"神里家的契约"
 SAN_PW_Kamisato_Accord_desc:"神里绫人前来谈判，姿态无可挑剔。他提出以神里家在海祇岛的全部产业换取家族的存续与社奉行的名号。心海签了字，绫人离开时，袖中折扇半开未开。"
 SAN_PW_Kujou_Militia_Absorb:"九条军整编"
 SAN_PW_Kujou_Militia_Absorb_desc:"九条裟罗带着残部前来归降。她要求保留九条家的军旗，心海没有答应，却给了她一面新的：海祇军的蓝白旗，旗下仍是那支百战的弓手。"
 SAN_PW_Economic_Reconstruction:"战后经济纲领"
 SAN_PW_Economic_Reconstruction_desc:"御影炉心停摆、踏鞴砂废弃、离岛封锁——稻妻的经济在眼狩令的岁月里已经烂透。心海摊开海祇岛的账本，发现连九十万年的赋税也不够填这个窟窿。"
 SAN_PW_Tatarasuna_Reclaim:"踏鞴砂接收"
 SAN_PW_Tatarasuna_Reclaim_desc:"踏鞴砂的炉火重新点燃。海祇的工程师带来了白夜国的冶炼法，与当地的「雷电五传」技艺相撞，火星四溅。泽维尔在废墟里翻找着愚人众的旧图纸。"
 SAN_PW_Ritou_Open_Port:"离岛开港"
 SAN_PW_Ritou_Open_Port_desc:"离岛封锁令解除。来自璃月、蒙德、须弥的商船重新靠岸，桅杆挤满了港口。勘定奉行留下的关税旧制被推翻，取而代之的是一纸薄薄的通商章程。"
 SAN_PW_Delusion_Seal:"邪眼工厂封存"
 SAN_PW_Delusion_Seal_desc:"邪眼工厂的熔炉被灌入海水。那批以寿命为代价的禁忌之物被锁进渊下宫的最深处——连同制造它们的图纸。心海在封印上亲手加了一道大御神的符。"
 SAN_PW_The_Crossroads:"前路的抉择"
 SAN_PW_The_Crossroads_desc:"稻妻城已静。心海独自坐在现人神的神座上，面前摊着三份截然不同的国策草案。她知道无论选哪一份，被写进这一页的都将是她自己，以及整个列岛此后千年的走向。"
 SAN_PW_A_Apotheosis:"心海的神格化"
 SAN_PW_A_Apotheosis_desc:"现人神巫女加冕为「御建大御神」，海祇的信仰第一次与稻妻的权柄合一。珊瑚宫心海摘下珍珠冠，换上了渊下神宫的金色面纱。从此她不再只是巫女——她是稻妻唯一的神。"
 SAN_PW_A_Orobashi_State_Church:"大御神国教"
 SAN_PW_A_Orobashi_State_Church_desc:"《御神敕令》颁布：大御神为稻妻唯一真神，鸣神信仰贬为旧俗。鸣神大社的神像被覆上黑布，取而代之的是蛇与珍珠的徽记。"
 SAN_PW_A_Inquisition_Office:"异端审判所"
 SAN_PW_A_Inquisition_Office_desc:"审判所设在天守阁的旧军械库。第一批被押进来的是替鸣神传道的巫女。判决书由神谕代笔，落款处只有一枚蛇形印。"
 SAN_PW_A_Confessors_Network:"忏悔网络"
 SAN_PW_A_Confessors_Network_desc:"每一个村落都设一名听罪的神职，每一句对神权的怨言都会顺着珍珠链传回珊瑚宫。稻妻开始学会在祈祷时压低声音。"
 SAN_PW_A_Purge_Narukami_Shrines:"鸣神神社清洗"
 SAN_PW_A_Purge_Narukami_Shrines_desc:"影向山上的鸣神大社被封，御建鸣神的御柱被推倒，石料拆去修筑海祇军港。八重宫司在封社前夜失踪，只留下一片樱花与一句「你会后悔的」。"
 SAN_PW_A_Divine_Cabinet:"神谕内阁"
 SAN_PW_A_Divine_Cabinet_desc:"内阁不再由凡人组成，而由七名「代神言者」执掌。他们自称能听见大御神的声音，却没有一个敢直视心海的眼睛。"
 SAN_PW_A_Priest_Officer_Corps:"神职军官团"
 SAN_PW_A_Priest_Officer_Corps_desc:"海祇军的军官同时受神职册封。他们作战时带着符咒与佩刀，战死后按神职规格入祀。军队成了教会，教会成了军队。"
 SAN_PW_A_Theocratic_Administration:"神权行政"
 SAN_PW_A_Theocratic_Administration_desc:"地方官吏由神社推举，考绩以「虔诚」为先。稻妻的行政体系脱离了世俗，开始沿着香火与教阶重新生长。"
 SAN_PW_A_Sun_Child_Doctrine:"太阳之子教义"
 SAN_PW_A_Sun_Child_Doctrine_desc:"渊下宫的古籍被重新译出：白夜国曾以「太阳之子」为神献祭。心海下令重立此典——只是这一次，献上的不是孩子，而是旧世界的秩序。"
 SAN_PW_A_Enkanomiya_Reverence:"渊下神宫崇拜"
 SAN_PW_A_Enkanomiya_Reverence_desc:"渊下宫的常夜被凿开一角，阳光第一次照进白夜国的废墟。神宫祭司们捧着大日御舆的火种北上，把深海的威严带进了鸣神旧地。"
 SAN_PW_A_Serpent_Throne:"大蛇之座"
 SAN_PW_A_Serpent_Throne_desc:"新的神殿在珊瑚宫岛的最高处落成，供奉着奥罗巴斯的巨骨。心海在神座上坐定，宣布大蛇的意志由她继承，也由她独断。"
 SAN_PW_A_Holy_War_Doctrine:"圣战教义"
 SAN_PW_A_Holy_War_Doctrine_desc:"国教颁下敕令：大御神的荣光当及于四海。稻妻的刀不再只为守护，也为传教——为了把海祇的珍珠埋进每一片异邦的沙滩。"
 SAN_PW_A_Sakoku_Reissue:"新锁国令"
 SAN_PW_A_Sakoku_Reissue_desc:"新的锁国令比幕府的更彻底：外商集中于离岛一地，传教者一律驱逐。稻妻的港口重新长出锈迹，神国的边界就此封死。"
 SAN_PW_A_Divine_Guard_Expansion:"御神亲卫"
 SAN_PW_A_Divine_Guard_Expansion_desc:"御神亲卫从海祇的孤儿中挑选，自幼受神职训练，只认现人神一人。他们是神国的刀锋，也是神座最忠诚的锁链。"
 SAN_PW_A_Miko_Mobilization:"巫女总动员"
 SAN_PW_A_Miko_Mobilization_desc:"全体巫女被编入神职序列，战时征召、平时传道。无数曾为鸣神奉香的少女换上蓝色祝装，为新的神唱起新的歌。"
 SAN_PW_A_Tithe_Economy:"神田经济"
 SAN_PW_A_Tithe_Economy_desc:"土地归神社所有，农人成为神田的佃户。收成的一成归心海，一成归教会，剩下的才留给自己。国库充盈，田地沉默。"
 SAN_PW_A_Blood_Pearl_Trade:"血珍珠贸易"
 SAN_PW_A_Blood_Pearl_Trade_desc:"海祇的珍珠产业被收归神宫专营，价格连翻数倍。远嫁的渔船带回成箱的摩拉，也带回海民们被榨干的骨血。"
 SAN_PW_A_Faith_Industry:"神社工业"
 SAN_PW_A_Faith_Industry_desc:"工厂由神社出资、神职监工，工人清晨上工前先向大御神祷祝。产能上去了，工人们却开始在机器的轰鸣里听见别的声音。"
 SAN_PW_A_Immortal_Mikado_Cult:"现人神不灭论"
 SAN_PW_A_Immortal_Mikado_Cult_desc:"神学会议得出结论：现人神乃永恒之身，死生不属凡人所能议论。心海的画像被挂进每一间官署，画像上的她不老不倦。"
 SAN_PW_A_Divine_Justice_Courts:"神断法院"
 SAN_PW_A_Divine_Justice_Courts_desc:"司法不再依律，而是依神谕。法官以掷珠卜问定罪，判决书上行文凛然，只字不提律条。稻妻的律法就此退化成神的脾气。"
 SAN_PW_A_Celestial_Tribute:"天理贡赋"
 SAN_PW_A_Celestial_Tribute_desc:"心海向天空岛献上第一份贡赋：珍珠、雷晶与一名自愿的白夜后裔。有神职问她为何要向天理低头，她只答：在能站直之前，先学会跪。"
 SAN_PW_A_Sea_Serpent_Navy:"海蛇舰队"
 SAN_PW_A_Sea_Serpent_Navy_desc:"以白夜科技重造的舰队在离岛列阵，船首雕着蛇首，甲板上是随军传道的神职。鸣神的海域，从此只有一个神的名字。"
 SAN_PW_A_Scourge_The_Unbelievers:"犁庭扫穴"
 SAN_PW_A_Scourge_The_Unbelievers_desc:"不肯改信的村落被逐一清查。神职带着军士挨家挨户撕下鸣神的符纸，换上大御神的珠串。有人照做，有人被吊在村口。"
 SAN_PW_A_Holy_Crusade_North:"北征圣战"
 SAN_PW_A_Holy_Crusade_North_desc:"国教的敕令指向了稻妻之外的列岛：至冬的使节被驱逐，璃月的商船被扣。神国的边界不再以海为限，而由信徒的足迹决定。"
 SAN_PW_A_Sand_Hidden_Conscription:"沙隐征兵"
 SAN_PW_A_Sand_Hidden_Conscription_desc:"神国以「献身」为名募兵，青壮年成批离开渔村。海祇的沙滩上晒着网，却再没有一张能被拉起的。"
 SAN_PW_A_Kagura_Perpetual_Rite:"神乐永祭"
 SAN_PW_A_Kagura_Perpetual_Rite_desc:"心海下令每年举行一次不下坛的神乐大祭，昼夜不歇，以现人神之身亲舞至天明。岛民跪伏在阶下，无人知道舞者的膝盖已经青紫。"
 SAN_PW_A_Ascend_To_Divinity:"登神之仪"
 SAN_PW_A_Ascend_To_Divinity_desc:"渊下宫的禁术被写进国典：现人神将褪去凡骨，成为真正的神明。心海在仪式前夜独自坐了很久，最终在诏书上落了印。"
 SAN_PW_A_Eternal_Shinkoku:"永恒神国"
 SAN_PW_A_Eternal_Shinkoku_desc:"神国宣告永续。稻妻全境只有一个声音，那声音来自珊瑚宫的神座。心海成为了她曾反抗过的那种存在——只是更年轻，更温柔，也因此更难以被推翻。"
 SAN_PW_B_Constitutional_Convention:"制宪会议"
 SAN_PW_B_Constitutional_Convention_desc:"珊瑚宫、鸣神、离岛、清籁、鹤观——各岛代表第一次不分贵贱地坐在同一间厅堂里。心海把象征现人神权威的珠冠放在桌心，说：这一顶，今天起归诸位议决。"
 SAN_PW_B_Island_Parliament:"诸岛议会"
 SAN_PW_B_Island_Parliament_desc:"议会按岛屿而非按门第分配席位。会上吵得最凶的往往是两个岛为了争一条航道的税收，而心海坐在议长席上，第一次只需听，不必断。"
 SAN_PW_B_Freedom_Of_Worship_Act:"信仰自由法"
 SAN_PW_B_Freedom_Of_Worship_Act_desc:"大御神与鸣神并祀于同一座神社，巫女与宫司共用一个洗手亭。有人觉得这是亵渎，更多人只是终于松了口气。"
 SAN_PW_B_Vision_Bearer_Citizenship:"神之眼公民权"
 SAN_PW_B_Vision_Bearer_Citizenship_desc:"法案规定：持有神之眼者与常人同权，不得因其愿力而受歧视或征用。一纸条文，结束了眼狩令留下的最后一点阴影。"
 SAN_PW_B_Republican_Guard:"共和卫队"
 SAN_PW_B_Republican_Guard_desc:"卫队宣誓效忠的是宪法，而非任何一位巫女或将军。五郎作为首任总长宣读誓词时，刻意把「现人神」三个字念得又快又轻。"
 SAN_PW_B_Sangonomiya_Charter:"珊瑚宫宪章"
 SAN_PW_B_Sangonomiya_Charter_desc:"全岛联盟的第一部宪章写在一张海图上：岛屿自治、议会至上、司法独立。珊瑚宫的名字只出现在落款处，像一位退居幕后的母亲。"
 SAN_PW_B_Free_Port_Ritou:"离岛自由港"
 SAN_PW_B_Free_Port_Ritou_desc:"离岛不再属于任何一家奉行，而是向七国开放的自由港。关税低得让勘定奉行的旧吏看了直摇头，商船却排到了三个月之后。"
 SAN_PW_B_Merchant_Republic:"商贾共和国"
 SAN_PW_B_Merchant_Republic_desc:"离岛的商会进了议会，珍珠、海盐与雷晶的贸易线铺向全提瓦特。有人说这已是商人治国，心海却在账本上看到了比神谕更实在的东西。"
 SAN_PW_B_Pan_Teyvat_Embassy:"七国使节"
 SAN_PW_B_Pan_Teyvat_Embassy_desc:"璃月的礼部、蒙德的骑士团、须弥的教令院——使节们陆续登陆离岛。稻妻几百年来第一次主动向外界伸出手，掌心朝上。"
 SAN_PW_B_Trade_League_Membership:"万国商会"
 SAN_PW_B_Trade_League_Membership_desc:"稻妻加入了跨国的商会与航运同盟，海祇的珍珠贴上了七国通行的印记。锁国的门被彻底卸下，海风灌满了整个内阁。"
 SAN_PW_B_Public_Schools:"公学普及"
 SAN_PW_B_Public_Schools_desc:"每个岛设一座公学，教读写、算学与诸岛的语言。老师多是从海祇军营退下来的老兵，黑板上的第一句是「人不因神而生」。"
 SAN_PW_B_University_Of_Byakuyako:"白夜国大学"
 SAN_PW_B_University_Of_Byakuyako_desc:"渊下宫的藏书被搬上一座新修的学府。学者们开始系统整理白夜国的文明史——把神明降格为课题，把凡人抬升为作者。"
 SAN_PW_B_Judicial_Reform:"司法改革"
 SAN_PW_B_Judicial_Reform_desc:"法官不再由神职任命，而是考选产生。法典用了海祇与鸣神两套旧例，删去其中所有以神意为名的条款。"
 SAN_PW_B_Press_Freedom:"报业自由"
 SAN_PW_B_Press_Freedom_desc:"离岛出现了第一份报纸，头条是「三奉行贪墨账目全录」。心海读完后只批了四个字：让他们写。"
 SAN_PW_B_Industrial_Civil_Program:"民用工业计划"
 SAN_PW_B_Industrial_Civil_Program_desc:"踏鞴砂的炉火转向民用，农具、渔具、布料从流水线上滚下来。军工厂的产能第一次让给了犁与网。"
 SAN_PW_B_Land_Reform:"土地改革"
 SAN_PW_B_Land_Reform_desc:"神田与奉行庄园被分给耕者，地契重新丈量。旧贵族在议会里激烈反对，投票的结果却毫无悬念。"
 SAN_PW_B_Welfare_Institutes:"济贫院"
 SAN_PW_B_Welfare_Institutes_desc:"战后残破的渔村设起济贫院与义仓。账目公开挂在门口，谁都可以去看——这在稻妻是头一遭。"
 SAN_PW_B_Universal_Conscription_Law:"普遍兵役法"
 SAN_PW_B_Universal_Conscription_Law_desc:"兵役不再由贵族垄断，也不再由神职垄断。每个岛每年按人口抽调，服役期满即归乡，军与民之间隔着的只剩一纸征书。"
 SAN_PW_B_Island_Militia:"诸岛民兵"
 SAN_PW_B_Island_Militia_desc:"每座岛都有自己的民兵，旗帜各不相同，宣誓对象都是议会而非某位神。稻妻的武力第一次真正散落在民间的灶台边。"
 SAN_PW_B_Coastal_Defense_League:"海防同盟"
 SAN_PW_B_Coastal_Defense_League_desc:"诸岛的民兵结成海防同盟，共享港口与灯塔。五郎把指挥权交给了一个议会委员会，自己只当军事顾问。"
 SAN_PW_B_Kamisato_Conciliation:"神里和解"
 SAN_PW_B_Kamisato_Conciliation_desc:"神里绫人在议会中取得了社奉行的重整名分，绫华出任礼宾使节。旧家在共和的秩序里找到了位置，代价是交出最后一点特权。"
 SAN_PW_B_Kujou_Amnesty:"九条特赦"
 SAN_PW_B_Kujou_Amnesty_desc:"议会通过特赦令，被俘的幕府军士除首恶外一律免罪。九条裟罗在议会前深鞠一躬，那一躬弯得比在将军面前更低。"
 SAN_PW_B_Hiiragi_Trial:"柊家公审"
 SAN_PW_B_Hiiragi_Trial_desc:"勘定奉行柊慎介的贪墨案公开审理，账册在报上连载了整整两个月。审判没有流血，却比任何一次行刑都更彻底地羞辱了旧贵。"
 SAN_PW_B_Reconciliation_With_The_Shogunate:"与幕府和解"
 SAN_PW_B_Reconciliation_With_The_Shogunate_desc:"议会追认雷电将军为稻妻史上的一位统治者，承认其功绩，也记录其过失。共和不否认过去，只是把它收进了档案馆。"
 SAN_PW_B_Vision_Declaration_Of_Rights:"权利宣言"
 SAN_PW_B_Vision_Declaration_Of_Rights_desc:"宣言开篇写道：凡生于稻妻者，其愿力、其信仰、其居所皆不可侵夺。海祇与鸣神的神像并立在宣言两侧，谁都没有高过谁。"
 SAN_PW_B_Multi_Island_Referendum:"诸岛公投"
 SAN_PW_B_Multi_Island_Referendum_desc:"诸岛就是否加入共和国举行公投。鹤观与清籁的票数接近得让所有人屏住了呼吸，最终以微弱多数通过。"
 SAN_PW_B_Teyvat_Concord:"提瓦特协约"
 SAN_PW_B_Teyvat_Concord_desc:"稻妻与七国缔结协约，互不侵犯、通商互助。心海在协约上签字时的头衔只写着「珊瑚宫心海」，没有神，也没有将军。"
 SAN_PW_B_Eternal_Republic:"永恒共和"
 SAN_PW_B_Eternal_Republic_desc:"共和国立宪十载，议会的钟声每天都在离岛响起。心海卸下了现人神的名分，只作一名普通的议长。稻妻第一次不属于神，而属于稻妻人自己。"
 SAN_PW_C_Inherit_The_Bakufu:"承继幕府"
 SAN_PW_C_Inherit_The_Bakufu_desc:"三奉行的旧吏抱着名册跪在珊瑚宫前，请求新的主人不要废掉这套两百年的规矩。心海翻着那本厚册子，忽然明白了一件事：推倒幕府容易，可稻妻还需要一个幕府。"
 SAN_PW_C_Narukami_Continuity_Act:"鸣神延续法"
 SAN_PW_C_Narukami_Continuity_Act_desc:"法案宣布：御建鸣神之名不改，神位照旧，只是坐在上面的人换了姓。神社的香火未断，御柱的漆重新刷过一遍，颜色与从前一模一样。"
 SAN_PW_C_Shogunal_Regency:"将军摄政"
 SAN_PW_C_Shogunal_Regency_desc:"心海自号「摄政」，不称将军、不称神。她坐在天守阁原属于将军的位置上，桌上摆着旧将军的印，却从不盖它。"
 SAN_PW_C_Bureaucratic_Restoration:"官僚复兴"
 SAN_PW_C_Bureaucratic_Restoration_desc:"被解散的三奉行以新的名目重建：天领改称兵部、勘定改称度支、社奉行改称礼曹。牌匾换了，掌事的人九成没换。"
 SAN_PW_C_Codex_Of_Order:"秩序法典"
 SAN_PW_C_Codex_Of_Order_desc:"新法典共一千二百条，句句以「秩序」为纲。它不问你信什么神，只管你听不听话。稻妻第一次有了一部比神谕更管用的东西。"
 SAN_PW_C_Secret_Police:"秘密警察"
 SAN_PW_C_Secret_Police_desc:"「御建缉查」成立，着黑衣，带黑册，行踪不留档案。他们的名单上不写罪名，只写「可疑」——而被写进去的人，往往再没出来过。"
 SAN_PW_C_Censorate:"监察司"
 SAN_PW_C_Censorate_desc:"监察司专查官吏贪墨与结党，权柄直通天听。第一个被带走的是重建度支的老吏——他的账目二十年没出过差错，只是当年签过一纸效忠鸣神的公文。"
 SAN_PW_C_Total_Registration:"户籍大编"
 SAN_PW_C_Total_Registration_desc:"全岛重新编户，每人一牌，牌上写籍贯、职业与神籍。从此稻妻没有一个无名之人，也没有一个能藏起来的人。"
 SAN_PW_C_Sakoku_Reinforced:"强化锁国"
 SAN_PW_C_Sakoku_Reinforced_desc:"锁国令比幕府时代更严：外商不得登岸，传教者格杀，出海的渔船需领照。稻妻的边界像一块重新淬火的铁。"
 SAN_PW_C_Coast_Blockade:"海岸封锁"
 SAN_PW_C_Coast_Blockade_desc:"巡防舰队沿岛链布防，任何未经许可的船只一律拦检。海祇的贸易传统被一纸禁令掐断，渔村的老人们想起了旧幕府的封海令。"
 SAN_PW_C_Military_Modernization:"军制近代化"
 SAN_PW_C_Military_Modernization_desc:"旧幕府军的编制被整体接收，再以白夜科技翻新：弓手换弩机，太刀配铳，军旗仍是那面御建鸣神。"
 SAN_PW_C_Samurai_Corps:"武士团"
 SAN_PW_C_Samurai_Corps_desc:"被收编的旧武士组成「御建武士团」，授田授俸，效忠摄政而非神社。他们恨海祇，却更恨没有主君的日子。"
 SAN_PW_C_Divine_Right_Of_Order:"秩序神授"
 SAN_PW_C_Divine_Right_Of_Order_desc:"国学家为摄政编出一套新说：大御神与鸣神本是同源，皆司秩序。神学上的缝合怪，政治上却严丝合缝。"
 SAN_PW_C_State_Shinto:"国家神道"
 SAN_PW_C_State_Shinto_desc:"大御神与鸣神合祀于新设的「御建神社」，全国神职统一编制、统一俸禄、统一口径。神从信仰变成了编制。"
 SAN_PW_C_Puppet_Clergy:"御用神职"
 SAN_PW_C_Puppet_Clergy_desc:"神职由官府任命，讲道词由礼曹审定。巫女们念的还是那几句祝词，只是祝词的落款换成了摄政的名字。"
 SAN_PW_C_Balanced_Economy:"经世经济"
 SAN_PW_C_Balanced_Economy_desc:"度支衙门推行经世之策：平准物价，官营盐铁，抑制豪商。稻妻的市场被拢在国家掌心，稳则稳矣，却也死了。"
 SAN_PW_C_Zaibatsu_Charter:"财阀特许"
 SAN_PW_C_Zaibatsu_Charter_desc:"几家与摄政关系密切的商号取得专营特许，垄断珍珠、雷晶与军械。国库的进项涨了，民间的怨气也涨了。"
 SAN_PW_C_Rice_Standard:"米本位"
 SAN_PW_C_Rice_Standard_desc:"度支衙门以米为锚发行纸币，压制战后飞涨的物价。米价的曲线终于平了，可离岛的商船也不再靠岸。"
 SAN_PW_C_Isolation_Doctrine:"孤立教义"
 SAN_PW_C_Isolation_Doctrine_desc:"摄政颁布外交总纲：稻妻不结盟、不干涉、不通婚。列岛之外的一切纷争与稻妻无关，稻妻之内的一切也不许外邦置喙。"
 SAN_PW_C_Non_Aligned_Bloc:"不结盟圈"
 SAN_PW_C_Non_Aligned_Bloc_desc:"稻妻联合周边小岛组成不结盟圈，既不投靠至冬，也不依附璃月。圈内的岛主们对摄政唯唯诺诺，只因别无选择。"
 SAN_PW_C_Fortress_Inazuma:"要塞稻妻"
 SAN_PW_C_Fortress_Inazuma_desc:"全岛链开始修筑炮台与瞭望塔，重要的海湾布下雷网。稻妻被改造成一座巨大的要塞，只是这座要塞里住着的人也开始觉得自己像守军。"
 SAN_PW_C_North_Defense_Line:"北境防线"
 SAN_PW_C_North_Defense_Line_desc:"针对北方的至冬与深渊，稻妻在离岛至鹤观一线布下防线。哨所的灯彻夜不熄，哨兵不知道自己在防备什么，只知道不准闭眼。"
 SAN_PW_C_Fatui_Accord:"至冬协定"
 SAN_PW_C_Fatui_Accord_desc:"与至冬的秘密协定在离岛签订：稻妻不追查愚人众旧账，至冬默认稻妻的势力范围。双方都没有把纸带回国。"
 SAN_PW_C_Abyss_Containment:"深渊遏制"
 SAN_PW_C_Abyss_Containment_desc:"渊下宫的常夜被重新封死，白夜国的遗迹列为禁区。摄政深知那片黑暗能给她力量，却更清楚那力量从不属于任何活人。"
 SAN_PW_C_Vigilance_State:"警戒国家"
 SAN_PW_C_Vigilance_State_desc:"缉查、监察、编户三司合流，稻妻成为一台昼夜运转的警戒机器。它没有敌人，却需要敌人才能运转。"
 SAN_PW_C_Eternal_Regency:"永恒摄政"
 SAN_PW_C_Eternal_Regency_desc:"摄政之位不再设任期。心海宣布，为了稻妻的秩序，她将继续掌权——直到秩序不再需要她，而这一天，显然永远不会来。"
 SAN_PW_C_Succession_Law:"继统法"
 SAN_PW_C_Succession_Law_desc:"继统法规定：摄政之位由珊瑚宫嫡系世袭，须经御建神社神谕认可。海祇的巫女，成了御建幕府的世袭将军。"
 SAN_PW_C_Neo_Bakufu:"新幕府"
 SAN_PW_C_Neo_Bakufu_desc:"新的幕府在旧幕府的废墟上落成，形制、仪轨、官阶一一照旧，只有旗色从紫改成了蓝。当年的反抗者成了幕府，而稻妻人发现，日子其实和从前没什么两样。"

 SAN_PW.20000.t:"统一之晓"
 SAN_PW.20000.desc:"御建鸣神的旗帜自天守阁落下。珊瑚宫心海以征服者的身份走进这座城，第一次不必仰望它。胜利带来了整片鸣神列岛，也带来了一个从未准备过的问题：接下来该怎么办。"
 SAN_PW.20000.a:"开始重建"
 SAN_PW.20000.b:"先稳住军心"
 SAN_PW.20001.t:"天守阁的余烬"
 SAN_PW.20001.desc:"雷电将军的下落众说纷纭。有人说她战死于一心净土，有人说她被封印在梦想一心的刀鞘里。海祇军在天守阁废墟中反复搜寻，只找到一把没有主人的太刀和一具仍在运转的人偶躯壳。"
 SAN_PW.20001.a:"公布将军死讯"
 SAN_PW.20001.b:"隐瞒真相"
 SAN_PW.20002.t:"幕府的降表"
 SAN_PW.20002.desc:"三奉行的残余联名递上降书。文书用旧式的敬语写成，通篇称珊瑚宫为僭主，却不得不承认眼狩令的失败。心海在降书上按下了现人神的印。"
 SAN_PW.20002.a:"接受投降"
 SAN_PW.20002.b:"追究到底"
 SAN_PW.20003.t:"三奉行的解散"
 SAN_PW.20003.desc:"天领、勘定、社奉行——维系稻妻数百年的三根柱子被逐一拆下。九条孝行在狱中拒绝进食，柊慎介供出了勘定奉行与愚人众的全部账目，神里家则交出全部地契换取家族存续。"
 SAN_PW.20003.a:"彻底废除"
 SAN_PW.20003.b:"保留名目"
 SAN_PW.20004.t:"神之眼大赦"
 SAN_PW.20004.desc:"被收缴的神之眼堆满了天守阁的地下库房，成千上万枚玻璃珠般的愿力在黑暗中低鸣。心海下令悉数奉还，并宣布从今往后，谁也无权夺走他人的愿望。"
 SAN_PW.20004.a:"立即奉还"
 SAN_PW.20004.b:"登记后发还"
 SAN_PW.20005.t:"鸣神神职改组"
 SAN_PW.20005.desc:"鸣神大社的巫女们跪在珊瑚宫军前。心海没有拆毁神社，只是把神职名册重新誊写了一遍：留下的继续奉香，不肯署名的送去离岛。"
 SAN_PW.20005.a:"宽待神职"
 SAN_PW.20005.b:"另立新社"
 SAN_PW.20006.t:"鸣神旧地军管"
 SAN_PW.20006.desc:"海祇军开进稻妻城、神里屋敷与九条阵屋。五郎颁布临时军管令：宵禁、通行证、粮食配给。秩序维持住了，怨言也在暗处滋长。"
 SAN_PW.20006.a:"严厉军管"
 SAN_PW.20006.b:"宽严相济"
 SAN_PW.20007.t:"稻妻城临时政府"
 SAN_PW.20007.desc:"一张由海祇旧臣、鸣神降吏与离岛商贾拼凑的临时政府名单摆在案上。没有人的名字让所有人都满意，但没有人敢拒绝。"
 SAN_PW.20007.a:"海祇主导"
 SAN_PW.20007.b:"多方共治"
 SAN_PW.20008.t:"愚人众清剿"
 SAN_PW.20008.desc:"愚人众在稻妻经营多年的据点被逐一起获：邪眼工厂、北国银行分行、离岛的走私码头。第八席「女士」已死，第六席「散兵」携雷神之心不知所踪。"
 SAN_PW.20008.a:"全面搜捕"
 SAN_PW.20008.b:"以此要挟至冬"
 SAN_PW.20009.t:"神里家的契约"
 SAN_PW.20009.desc:"神里绫人前来谈判，姿态无可挑剔。他提出以神里家在海祇岛的全部产业换取家族的存续与社奉行的名号。心海签了字，绫人离开时，袖中折扇半开未开。"
 SAN_PW.20009.a:"留其体面"
 SAN_PW.20009.b:"斩草除根"
 SAN_PW.20010.t:"九条军整编"
 SAN_PW.20010.desc:"九条裟罗带着残部前来归降。她要求保留九条家的军旗，心海没有答应，却给了她一面新的：海祇军的蓝白旗，旗下仍是那支百战的弓手。"
 SAN_PW.20010.a:"重用裟罗"
 SAN_PW.20010.b:"打散编制"
 SAN_PW.20011.t:"战后经济纲领"
 SAN_PW.20011.desc:"御影炉心停摆、踏鞴砂废弃、离岛封锁——稻妻的经济在眼狩令的岁月里已经烂透。心海摊开海祇岛的账本，发现连九十万年的赋税也不够填这个窟窿。"
 SAN_PW.20011.a:"开源优先"
 SAN_PW.20011.b:"节流优先"
 SAN_PW.20012.t:"踏鞴砂接收"
 SAN_PW.20012.desc:"踏鞴砂的炉火重新点燃。海祇的工程师带来了白夜国的冶炼法，与当地的「雷电五传」技艺相撞，火星四溅。泽维尔在废墟里翻找着愚人众的旧图纸。"
 SAN_PW.20012.a:"军用优先"
 SAN_PW.20012.b:"民用优先"
 SAN_PW.20013.t:"离岛开港"
 SAN_PW.20013.desc:"离岛封锁令解除。来自璃月、蒙德、须弥的商船重新靠岸，桅杆挤满了港口。勘定奉行留下的关税旧制被推翻，取而代之的是一纸薄薄的通商章程。"
 SAN_PW.20013.a:"全面开港"
 SAN_PW.20013.b:"有限通商"
 SAN_PW.20014.t:"邪眼工厂封存"
 SAN_PW.20014.desc:"邪眼工厂的熔炉被灌入海水。那批以寿命为代价的禁忌之物被锁进渊下宫的最深处——连同制造它们的图纸。心海在封印上亲手加了一道大御神的符。"
 SAN_PW.20014.a:"永久封存"
 SAN_PW.20014.b:"留作后用"
 SAN_PW.20015.t:"前路的抉择"
 SAN_PW.20015.desc:"稻妻城已静。心海独自坐在现人神的神座上，面前摊着三份截然不同的国策草案。她知道无论选哪一份，被写进这一页的都将是她自己，以及整个列岛此后千年的走向。"
 SAN_PW.20015.a:"迎向新世"
 SAN_PW.20015.b:"犹疑不决"
 SAN_PW.20016.t:"心海的神格化"
 SAN_PW.20016.desc:"现人神巫女加冕为「御建大御神」，海祇的信仰第一次与稻妻的权柄合一。珊瑚宫心海摘下珍珠冠，换上了渊下神宫的金色面纱。从此她不再只是巫女——她是稻妻唯一的神。"
 SAN_PW.20016.a:"登临神位"
 SAN_PW.20016.b:"保留人形"
 SAN_PW.20017.t:"大御神国教"
 SAN_PW.20017.desc:"《御神敕令》颁布：大御神为稻妻唯一真神，鸣神信仰贬为旧俗。鸣神大社的神像被覆上黑布，取而代之的是蛇与珍珠的徽记。"
 SAN_PW.20017.a:"定为国教"
 SAN_PW.20017.b:"容忍并祀"
 SAN_PW.20018.t:"异端审判所"
 SAN_PW.20018.desc:"审判所设在天守阁的旧军械库。第一批被押进来的是替鸣神传道的巫女。判决书由神谕代笔，落款处只有一枚蛇形印。"
 SAN_PW.20018.a:"铁腕审判"
 SAN_PW.20018.b:"以感化为主"
 SAN_PW.20019.t:"忏悔网络"
 SAN_PW.20019.desc:"每一个村落都设一名听罪的神职，每一句对神权的怨言都会顺着珍珠链传回珊瑚宫。稻妻开始学会在祈祷时压低声音。"
 SAN_PW.20019.a:"密织耳目"
 SAN_PW.20019.b:"适可而止"
 SAN_PW.20020.t:"鸣神神社清洗"
 SAN_PW.20020.desc:"影向山上的鸣神大社被封，御建鸣神的御柱被推倒，石料拆去修筑海祇军港。八重宫司在封社前夜失踪，只留下一片樱花与一句「你会后悔的」。"
 SAN_PW.20020.a:"夷平神社"
 SAN_PW.20020.b:"封存不动"
 SAN_PW.20021.t:"神谕内阁"
 SAN_PW.20021.desc:"内阁不再由凡人组成，而由七名「代神言者」执掌。他们自称能听见大御神的声音，却没有一个敢直视心海的眼睛。"
 SAN_PW.20021.a:"神谕独断"
 SAN_PW.20021.b:"设人臣制衡"
 SAN_PW.20022.t:"神职军官团"
 SAN_PW.20022.desc:"海祇军的军官同时受神职册封。他们作战时带着符咒与佩刀，战死后按神职规格入祀。军队成了教会，教会成了军队。"
 SAN_PW.20022.a:"军政合一"
 SAN_PW.20022.b:"保持军职独立"
 SAN_PW.20023.t:"神权行政"
 SAN_PW.20023.desc:"地方官吏由神社推举，考绩以「虔诚」为先。稻妻的行政体系脱离了世俗，开始沿着香火与教阶重新生长。"
 SAN_PW.20023.a:"教阶治民"
 SAN_PW.20023.b:"保留旧吏制"
 SAN_PW.20024.t:"太阳之子教义"
 SAN_PW.20024.desc:"渊下宫的古籍被重新译出：白夜国曾以「太阳之子」为神献祭。心海下令重立此典——只是这一次，献上的不是孩子，而是旧世界的秩序。"
 SAN_PW.20024.a:"复兴古祭"
 SAN_PW.20024.b:"删去献祭"
 SAN_PW.20025.t:"渊下神宫崇拜"
 SAN_PW.20025.desc:"渊下宫的常夜被凿开一角，阳光第一次照进白夜国的废墟。神宫祭司们捧着大日御舆的火种北上，把深海的威严带进了鸣神旧地。"
 SAN_PW.20025.a:"开宫迎神"
 SAN_PW.20025.b:"谨慎探索"
 SAN_PW.20026.t:"大蛇之座"
 SAN_PW.20026.desc:"新的神殿在珊瑚宫岛的最高处落成，供奉着奥罗巴斯的巨骨。心海在神座上坐定，宣布大蛇的意志由她继承，也由她独断。"
 SAN_PW.20026.a:"以大蛇立威"
 SAN_PW.20026.b:"避讳蛇名"
 SAN_PW.20027.t:"圣战教义"
 SAN_PW.20027.desc:"国教颁下敕令：大御神的荣光当及于四海。稻妻的刀不再只为守护，也为传教——为了把海祇的珍珠埋进每一片异邦的沙滩。"
 SAN_PW.20027.a:"宣扬圣战"
 SAN_PW.20027.b:"自制锋芒"
 SAN_PW.20028.t:"新锁国令"
 SAN_PW.20028.desc:"新的锁国令比幕府的更彻底：外商集中于离岛一地，传教者一律驱逐。稻妻的港口重新长出锈迹，神国的边界就此封死。"
 SAN_PW.20028.a:"重申锁国"
 SAN_PW.20028.b:"有限开港"
 SAN_PW.20029.t:"御神亲卫"
 SAN_PW.20029.desc:"御神亲卫从海祇的孤儿中挑选，自幼受神职训练，只认现人神一人。他们是神国的刀锋，也是神座最忠诚的锁链。"
 SAN_PW.20029.a:"扩编亲卫"
 SAN_PW.20029.b:"节制军额"
 SAN_PW.20030.t:"巫女总动员"
 SAN_PW.20030.desc:"全体巫女被编入神职序列，战时征召、平时传道。无数曾为鸣神奉香的少女换上蓝色祝装，为新的神唱起新的歌。"
 SAN_PW.20030.a:"全面动员"
 SAN_PW.20030.b:"自愿应召"
 SAN_PW.20031.t:"神田经济"
 SAN_PW.20031.desc:"土地归神社所有，农人成为神田的佃户。收成的一成归心海，一成归教会，剩下的才留给自己。国库充盈，田地沉默。"
 SAN_PW.20031.a:"推行神田"
 SAN_PW.20031.b:"暂缓征用"
 SAN_PW.20032.t:"血珍珠贸易"
 SAN_PW.20032.desc:"海祇的珍珠产业被收归神宫专营，价格连翻数倍。远嫁的渔船带回成箱的摩拉，也带回海民们被榨干的骨血。"
 SAN_PW.20032.a:"垄断珍珠"
 SAN_PW.20032.b:"限价惠民"
 SAN_PW.20033.t:"神社工业"
 SAN_PW.20033.desc:"工厂由神社出资、神职监工，工人清晨上工前先向大御神祷祝。产能上去了，工人们却开始在机器的轰鸣里听见别的声音。"
 SAN_PW.20033.a:"教产兴工"
 SAN_PW.20033.b:"民间办厂"
 SAN_PW.20034.t:"现人神不灭论"
 SAN_PW.20034.desc:"神学会议得出结论：现人神乃永恒之身，死生不属凡人所能议论。心海的画像被挂进每一间官署，画像上的她不老不倦。"
 SAN_PW.20034.a:"定为一尊"
 SAN_PW.20034.b:"避谈神寿"
 SAN_PW.20035.t:"神断法院"
 SAN_PW.20035.desc:"司法不再依律，而是依神谕。法官以掷珠卜问定罪，判决书上行文凛然，只字不提律条。稻妻的律法就此退化成神的脾气。"
 SAN_PW.20035.a:"神断决狱"
 SAN_PW.20035.b:"保留律条"
 SAN_PW.20036.t:"天理贡赋"
 SAN_PW.20036.desc:"心海向天空岛献上第一份贡赋：珍珠、雷晶与一名自愿的白夜后裔。有神职问她为何要向天理低头，她只答：在能站直之前，先学会跪。"
 SAN_PW.20036.a:"暂且臣服"
 SAN_PW.20036.b:"暗中积蓄"
 SAN_PW.20037.t:"海蛇舰队"
 SAN_PW.20037.desc:"以白夜科技重造的舰队在离岛列阵，船首雕着蛇首，甲板上是随军传道的神职。鸣神的海域，从此只有一个神的名字。"
 SAN_PW.20037.a:"扩建舰队"
 SAN_PW.20037.b:"量力而行"
 SAN_PW.20038.t:"犁庭扫穴"
 SAN_PW.20038.desc:"不肯改信的村落被逐一清查。神职带着军士挨家挨户撕下鸣神的符纸，换上大御神的珠串。有人照做，有人被吊在村口。"
 SAN_PW.20038.a:"严厉清查"
 SAN_PW.20038.b:"网开一面"
 SAN_PW.20039.t:"北征圣战"
 SAN_PW.20039.desc:"国教的敕令指向了稻妻之外的列岛：至冬的使节被驱逐，璃月的商船被扣。神国的边界不再以海为限，而由信徒的足迹决定。"
 SAN_PW.20039.a:"兴兵北征"
 SAN_PW.20039.b:"暂息兵戈"
 SAN_PW.20040.t:"沙隐征兵"
 SAN_PW.20040.desc:"神国以「献身」为名募兵，青壮年成批离开渔村。海祇的沙滩上晒着网，却再没有一张能被拉起的。"
 SAN_PW.20040.a:"竭泽征兵"
 SAN_PW.20040.b:"保留民力"
 SAN_PW.20041.t:"神乐永祭"
 SAN_PW.20041.desc:"心海下令每年举行一次不下坛的神乐大祭，昼夜不歇，以现人神之身亲舞至天明。岛民跪伏在阶下，无人知道舞者的膝盖已经青紫。"
 SAN_PW.20041.a:"永续大祭"
 SAN_PW.20041.b:"恤神惜力"
 SAN_PW.20042.t:"登神之仪"
 SAN_PW.20042.desc:"渊下宫的禁术被写进国典：现人神将褪去凡骨，成为真正的神明。心海在仪式前夜独自坐了很久，最终在诏书上落了印。"
 SAN_PW.20042.a:"举行登神"
 SAN_PW.20042.b:"留恋人世"
 SAN_PW.20043.t:"永恒神国"
 SAN_PW.20043.desc:"神国宣告永续。稻妻全境只有一个声音，那声音来自珊瑚宫的神座。心海成为了她曾反抗过的那种存在——只是更年轻，更温柔，也因此更难以被推翻。"
 SAN_PW.20043.a:"神国永续"
 SAN_PW.20043.b:"留下裂隙"
 SAN_PW.20044.t:"制宪会议"
 SAN_PW.20044.desc:"珊瑚宫、鸣神、离岛、清籁、鹤观——各岛代表第一次不分贵贱地坐在同一间厅堂里。心海把象征现人神权威的珠冠放在桌心，说：这一顶，今天起归诸位议决。"
 SAN_PW.20044.a:"交出神权"
 SAN_PW.20044.b:"保留圣职"
 SAN_PW.20045.t:"诸岛议会"
 SAN_PW.20045.desc:"议会按岛屿而非按门第分配席位。会上吵得最凶的往往是两个岛为了争一条航道的税收，而心海坐在议长席上，第一次只需听，不必断。"
 SAN_PW.20045.a:"议席按岛"
 SAN_PW.20045.b:"按人口分配"
 SAN_PW.20046.t:"信仰自由法"
 SAN_PW.20046.desc:"大御神与鸣神并祀于同一座神社，巫女与宫司共用一个洗手亭。有人觉得这是亵渎，更多人只是终于松了口气。"
 SAN_PW.20046.a:"并祀共容"
 SAN_PW.20046.b:"各祀其神"
 SAN_PW.20047.t:"神之眼公民权"
 SAN_PW.20047.desc:"法案规定：持有神之眼者与常人同权，不得因其愿力而受歧视或征用。一纸条文，结束了眼狩令留下的最后一点阴影。"
 SAN_PW.20047.a:"平等立法"
 SAN_PW.20047.b:"谨慎界定"
 SAN_PW.20048.t:"共和卫队"
 SAN_PW.20048.desc:"卫队宣誓效忠的是宪法，而非任何一位巫女或将军。五郎作为首任总长宣读誓词时，刻意把「现人神」三个字念得又快又轻。"
 SAN_PW.20048.a:"效忠宪法"
 SAN_PW.20048.b:"保留效忠神"
 SAN_PW.20049.t:"珊瑚宫宪章"
 SAN_PW.20049.desc:"全岛联盟的第一部宪章写在一张海图上：岛屿自治、议会至上、司法独立。珊瑚宫的名字只出现在落款处，像一位退居幕后的母亲。"
 SAN_PW.20049.a:"颁行宪章"
 SAN_PW.20049.b:"暂缓立宪"
 SAN_PW.20050.t:"离岛自由港"
 SAN_PW.20050.desc:"离岛不再属于任何一家奉行，而是向七国开放的自由港。关税低得让勘定奉行的旧吏看了直摇头，商船却排到了三个月之后。"
 SAN_PW.20050.a:"全面自由港"
 SAN_PW.20050.b:"保留编制"
 SAN_PW.20051.t:"商贾共和国"
 SAN_PW.20051.desc:"离岛的商会进了议会，珍珠、海盐与雷晶的贸易线铺向全提瓦特。有人说这已是商人治国，心海却在账本上看到了比神谕更实在的东西。"
 SAN_PW.20051.a:"重商立国"
 SAN_PW.20051.b:"抑制资本"
 SAN_PW.20052.t:"七国使节"
 SAN_PW.20052.desc:"璃月的礼部、蒙德的骑士团、须弥的教令院——使节们陆续登陆离岛。稻妻几百年来第一次主动向外界伸出手，掌心朝上。"
 SAN_PW.20052.a:"广遣使节"
 SAN_PW.20052.b:"有限通使"
 SAN_PW.20053.t:"万国商会"
 SAN_PW.20053.desc:"稻妻加入了跨国的商会与航运同盟，海祇的珍珠贴上了七国通行的印记。锁国的门被彻底卸下，海风灌满了整个内阁。"
 SAN_PW.20053.a:"加入同盟"
 SAN_PW.20053.b:"保持自主"
 SAN_PW.20054.t:"公学普及"
 SAN_PW.20054.desc:"每个岛设一座公学，教读写、算学与诸岛的语言。老师多是从海祇军营退下来的老兵，黑板上的第一句是「人不因神而生」。"
 SAN_PW.20054.a:"广设公学"
 SAN_PW.20054.b:"缓步推行"
 SAN_PW.20055.t:"白夜国大学"
 SAN_PW.20055.desc:"渊下宫的藏书被搬上一座新修的学府。学者们开始系统整理白夜国的文明史——把神明降格为课题，把凡人抬升为作者。"
 SAN_PW.20055.a:"公开研究"
 SAN_PW.20055.b:"限阅禁书"
 SAN_PW.20056.t:"司法改革"
 SAN_PW.20056.desc:"法官不再由神职任命，而是考选产生。法典用了海祇与鸣神两套旧例，删去其中所有以神意为名的条款。"
 SAN_PW.20056.a:"考选法官"
 SAN_PW.20056.b:"保留神职席"
 SAN_PW.20057.t:"报业自由"
 SAN_PW.20057.desc:"离岛出现了第一份报纸，头条是「三奉行贪墨账目全录」。心海读完后只批了四个字：让他们写。"
 SAN_PW.20057.a:"放任报业"
 SAN_PW.20057.b:"设立审查"
 SAN_PW.20058.t:"民用工业计划"
 SAN_PW.20058.desc:"踏鞴砂的炉火转向民用，农具、渔具、布料从流水线上滚下来。军工厂的产能第一次让给了犁与网。"
 SAN_PW.20058.a:"民用优先"
 SAN_PW.20058.b:"兼顾军工"
 SAN_PW.20059.t:"土地改革"
 SAN_PW.20059.desc:"神田与奉行庄园被分给耕者，地契重新丈量。旧贵族在议会里激烈反对，投票的结果却毫无悬念。"
 SAN_PW.20059.a:"均田于民"
 SAN_PW.20059.b:"有偿赎买"
 SAN_PW.20060.t:"济贫院"
 SAN_PW.20060.desc:"战后残破的渔村设起济贫院与义仓。账目公开挂在门口，谁都可以去看——这在稻妻是头一遭。"
 SAN_PW.20060.a:"广设义仓"
 SAN_PW.20060.b:"量入为出"
 SAN_PW.20061.t:"普遍兵役法"
 SAN_PW.20061.desc:"兵役不再由贵族垄断，也不再由神职垄断。每个岛每年按人口抽调，服役期满即归乡，军与民之间隔着的只剩一纸征书。"
 SAN_PW.20061.a:"推行征兵"
 SAN_PW.20061.b:"志愿从军"
 SAN_PW.20062.t:"诸岛民兵"
 SAN_PW.20062.desc:"每座岛都有自己的民兵，旗帜各不相同，宣誓对象都是议会而非某位神。稻妻的武力第一次真正散落在民间的灶台边。"
 SAN_PW.20062.a:"民兵遍岛"
 SAN_PW.20062.b:"集中指挥"
 SAN_PW.20063.t:"海防同盟"
 SAN_PW.20063.desc:"诸岛的民兵结成海防同盟，共享港口与灯塔。五郎把指挥权交给了一个议会委员会，自己只当军事顾问。"
 SAN_PW.20063.a:"同盟共防"
 SAN_PW.20063.b:"各自为战"
 SAN_PW.20064.t:"神里和解"
 SAN_PW.20064.desc:"神里绫人在议会中取得了社奉行的重整名分，绫华出任礼宾使节。旧家在共和的秩序里找到了位置，代价是交出最后一点特权。"
 SAN_PW.20064.a:"予以名分"
 SAN_PW.20064.b:"彻底清算"
 SAN_PW.20065.t:"九条特赦"
 SAN_PW.20065.desc:"议会通过特赦令，被俘的幕府军士除首恶外一律免罪。九条裟罗在议会前深鞠一躬，那一躬弯得比在将军面前更低。"
 SAN_PW.20065.a:"颁行特赦"
 SAN_PW.20065.b:"从严甄别"
 SAN_PW.20066.t:"柊家公审"
 SAN_PW.20066.desc:"勘定奉行柊慎介的贪墨案公开审理，账册在报上连载了整整两个月。审判没有流血，却比任何一次行刑都更彻底地羞辱了旧贵。"
 SAN_PW.20066.a:"公开审判"
 SAN_PW.20066.b:"暗中处置"
 SAN_PW.20067.t:"与幕府和解"
 SAN_PW.20067.desc:"议会追认雷电将军为稻妻史上的一位统治者，承认其功绩，也记录其过失。共和不否认过去，只是把它收进了档案馆。"
 SAN_PW.20067.a:"追认并记过"
 SAN_PW.20067.b:"全盘否定"
 SAN_PW.20068.t:"权利宣言"
 SAN_PW.20068.desc:"宣言开篇写道：凡生于稻妻者，其愿力、其信仰、其居所皆不可侵夺。海祇与鸣神的神像并立在宣言两侧，谁都没有高过谁。"
 SAN_PW.20068.a:"颁布宣言"
 SAN_PW.20068.b:"推迟表决"
 SAN_PW.20069.t:"诸岛公投"
 SAN_PW.20069.desc:"诸岛就是否加入共和国举行公投。鹤观与清籁的票数接近得让所有人屏住了呼吸，最终以微弱多数通过。"
 SAN_PW.20069.a:"举行公投"
 SAN_PW.20069.b:"暂缓表决"
 SAN_PW.20070.t:"提瓦特协约"
 SAN_PW.20070.desc:"稻妻与七国缔结协约，互不侵犯、通商互助。心海在协约上签字时的头衔只写着「珊瑚宫心海」，没有神，也没有将军。"
 SAN_PW.20070.a:"缔结协约"
 SAN_PW.20070.b:"谨慎签署"
 SAN_PW.20071.t:"永恒共和"
 SAN_PW.20071.desc:"共和国立宪十载，议会的钟声每天都在离岛响起。心海卸下了现人神的名分，只作一名普通的议长。稻妻第一次不属于神，而属于稻妻人自己。"
 SAN_PW.20071.a:"共和永续"
 SAN_PW.20071.b:"功成身退"
 SAN_PW.20072.t:"承继幕府"
 SAN_PW.20072.desc:"三奉行的旧吏抱着名册跪在珊瑚宫前，请求新的主人不要废掉这套两百年的规矩。心海翻着那本厚册子，忽然明白了一件事：推倒幕府容易，可稻妻还需要一个幕府。"
 SAN_PW.20072.a:"承继旧制"
 SAN_PW.20072.b:"另起炉灶"
 SAN_PW.20073.t:"鸣神延续法"
 SAN_PW.20073.desc:"法案宣布：御建鸣神之名不改，神位照旧，只是坐在上面的人换了姓。神社的香火未断，御柱的漆重新刷过一遍，颜色与从前一模一样。"
 SAN_PW.20073.a:"保留神位"
 SAN_PW.20073.b:"另立新神"
 SAN_PW.20074.t:"将军摄政"
 SAN_PW.20074.desc:"心海自号「摄政」，不称将军、不称神。她坐在天守阁原属于将军的位置上，桌上摆着旧将军的印，却从不盖它。"
 SAN_PW.20074.a:"自号摄政"
 SAN_PW.20074.b:"正位将军"
 SAN_PW.20075.t:"官僚复兴"
 SAN_PW.20075.desc:"被解散的三奉行以新的名目重建：天领改称兵部、勘定改称度支、社奉行改称礼曹。牌匾换了，掌事的人九成没换。"
 SAN_PW.20075.a:"复建官署"
 SAN_PW.20075.b:"启用新人"
 SAN_PW.20076.t:"秩序法典"
 SAN_PW.20076.desc:"新法典共一千二百条，句句以「秩序」为纲。它不问你信什么神，只管你听不听话。稻妻第一次有了一部比神谕更管用的东西。"
 SAN_PW.20076.a:"颁行法典"
 SAN_PW.20076.b:"因俗而治"
 SAN_PW.20077.t:"秘密警察"
 SAN_PW.20077.desc:"「御建缉查」成立，着黑衣，带黑册，行踪不留档案。他们的名单上不写罪名，只写「可疑」——而被写进去的人，往往再没出来过。"
 SAN_PW.20077.a:"设立缉查"
 SAN_PW.20077.b:"限权监督"
 SAN_PW.20078.t:"监察司"
 SAN_PW.20078.desc:"监察司专查官吏贪墨与结党，权柄直通天听。第一个被带走的是重建度支的老吏——他的账目二十年没出过差错，只是当年签过一纸效忠鸣神的公文。"
 SAN_PW.20078.a:"严查官吏"
 SAN_PW.20078.b:"稍弛其网"
 SAN_PW.20079.t:"户籍大编"
 SAN_PW.20079.desc:"全岛重新编户，每人一牌，牌上写籍贯、职业与神籍。从此稻妻没有一个无名之人，也没有一个能藏起来的人。"
 SAN_PW.20079.a:"全面编户"
 SAN_PW.20079.b:"只编旧地"
 SAN_PW.20080.t:"强化锁国"
 SAN_PW.20080.desc:"锁国令比幕府时代更严：外商不得登岸，传教者格杀，出海的渔船需领照。稻妻的边界像一块重新淬火的铁。"
 SAN_PW.20080.a:"铁腕锁国"
 SAN_PW.20080.b:"有限通商"
 SAN_PW.20081.t:"海岸封锁"
 SAN_PW.20081.desc:"巡防舰队沿岛链布防，任何未经许可的船只一律拦检。海祇的贸易传统被一纸禁令掐断，渔村的老人们想起了旧幕府的封海令。"
 SAN_PW.20081.a:"封锁海疆"
 SAN_PW.20081.b:"留出窗口"
 SAN_PW.20082.t:"军制近代化"
 SAN_PW.20082.desc:"旧幕府军的编制被整体接收，再以白夜科技翻新：弓手换弩机，太刀配铳，军旗仍是那面御建鸣神。"
 SAN_PW.20082.a:"全面近代化"
 SAN_PW.20082.b:"渐进改良"
 SAN_PW.20083.t:"武士团"
 SAN_PW.20083.desc:"被收编的旧武士组成「御建武士团」，授田授俸，效忠摄政而非神社。他们恨海祇，却更恨没有主君的日子。"
 SAN_PW.20083.a:"厚待武士"
 SAN_PW.20083.b:"削其权柄"
 SAN_PW.20084.t:"秩序神授"
 SAN_PW.20084.desc:"国学家为摄政编出一套新说：大御神与鸣神本是同源，皆司秩序。神学上的缝合怪，政治上却严丝合缝。"
 SAN_PW.20084.a:"推广国学说"
 SAN_PW.20084.b:"冷处理"
 SAN_PW.20085.t:"国家神道"
 SAN_PW.20085.desc:"大御神与鸣神合祀于新设的「御建神社」，全国神职统一编制、统一俸禄、统一口径。神从信仰变成了编制。"
 SAN_PW.20085.a:"合祀国神"
 SAN_PW.20085.b:"分而治之"
 SAN_PW.20086.t:"御用神职"
 SAN_PW.20086.desc:"神职由官府任命，讲道词由礼曹审定。巫女们念的还是那几句祝词，只是祝词的落款换成了摄政的名字。"
 SAN_PW.20086.a:"官定神职"
 SAN_PW.20086.b:"保留自治"
 SAN_PW.20087.t:"经世经济"
 SAN_PW.20087.desc:"度支衙门推行经世之策：平准物价，官营盐铁，抑制豪商。稻妻的市场被拢在国家掌心，稳则稳矣，却也死了。"
 SAN_PW.20087.a:"加强官营"
 SAN_PW.20087.b:"放任市场"
 SAN_PW.20088.t:"财阀特许"
 SAN_PW.20088.desc:"几家与摄政关系密切的商号取得专营特许，垄断珍珠、雷晶与军械。国库的进项涨了，民间的怨气也涨了。"
 SAN_PW.20088.a:"特许财阀"
 SAN_PW.20088.b:"扶持小商"
 SAN_PW.20089.t:"米本位"
 SAN_PW.20089.desc:"度支衙门以米为锚发行纸币，压制战后飞涨的物价。米价的曲线终于平了，可离岛的商船也不再靠岸。"
 SAN_PW.20089.a:"推行米本"
 SAN_PW.20089.b:"维持银本"
 SAN_PW.20090.t:"孤立教义"
 SAN_PW.20090.desc:"摄政颁布外交总纲：稻妻不结盟、不干涉、不通婚。列岛之外的一切纷争与稻妻无关，稻妻之内的一切也不许外邦置喙。"
 SAN_PW.20090.a:"严守孤立"
 SAN_PW.20090.b:"灵活外交"
 SAN_PW.20091.t:"不结盟圈"
 SAN_PW.20091.desc:"稻妻联合周边小岛组成不结盟圈，既不投靠至冬，也不依附璃月。圈内的岛主们对摄政唯唯诺诺，只因别无选择。"
 SAN_PW.20091.a:"经营不结盟"
 SAN_PW.20091.b:"封闭自守"
 SAN_PW.20092.t:"要塞稻妻"
 SAN_PW.20092.desc:"全岛链开始修筑炮台与瞭望塔，重要的海湾布下雷网。稻妻被改造成一座巨大的要塞，只是这座要塞里住着的人也开始觉得自己像守军。"
 SAN_PW.20092.a:"筑垒自守"
 SAN_PW.20092.b:"以攻代守"
 SAN_PW.20093.t:"北境防线"
 SAN_PW.20093.desc:"针对北方的至冬与深渊，稻妻在离岛至鹤观一线布下防线。哨所的灯彻夜不熄，哨兵不知道自己在防备什么，只知道不准闭眼。"
 SAN_PW.20093.a:"北线布防"
 SAN_PW.20093.b:"收缩防线"
 SAN_PW.20094.t:"至冬协定"
 SAN_PW.20094.desc:"与至冬的秘密协定在离岛签订：稻妻不追查愚人众旧账，至冬默认稻妻的势力范围。双方都没有把纸带回国。"
 SAN_PW.20094.a:"签订密约"
 SAN_PW.20094.b:"拒绝往来"
 SAN_PW.20095.t:"深渊遏制"
 SAN_PW.20095.desc:"渊下宫的常夜被重新封死，白夜国的遗迹列为禁区。摄政深知那片黑暗能给她力量，却更清楚那力量从不属于任何活人。"
 SAN_PW.20095.a:"封锁渊下"
 SAN_PW.20095.b:"谨慎开掘"
 SAN_PW.20096.t:"警戒国家"
 SAN_PW.20096.desc:"缉查、监察、编户三司合流，稻妻成为一台昼夜运转的警戒机器。它没有敌人，却需要敌人才能运转。"
 SAN_PW.20096.a:"强化警戒"
 SAN_PW.20096.b:"放宽管控"
 SAN_PW.20097.t:"永恒摄政"
 SAN_PW.20097.desc:"摄政之位不再设任期。心海宣布，为了稻妻的秩序，她将继续掌权——直到秩序不再需要她，而这一天，显然永远不会来。"
 SAN_PW.20097.a:"永续摄政"
 SAN_PW.20097.b:"还政于议"
 SAN_PW.20098.t:"继统法"
 SAN_PW.20098.desc:"继统法规定：摄政之位由珊瑚宫嫡系世袭，须经御建神社神谕认可。海祇的巫女，成了御建幕府的世袭将军。"
 SAN_PW.20098.a:"立世袭制"
 SAN_PW.20098.b:"保留推举"
 SAN_PW.20099.t:"新幕府"
 SAN_PW.20099.desc:"新的幕府在旧幕府的废墟上落成，形制、仪轨、官阶一一照旧，只有旗色从紫改成了蓝。当年的反抗者成了幕府，而稻妻人发现，日子其实和从前没什么两样。"
 SAN_PW.20099.a:"幕府永续"
 SAN_PW.20099.b:"留下退路"

 SAN_PW_News.1.t:"天守阁易主"
 SAN_PW_News.1.desc:"御建鸣神之旗自天守阁降下，海祇军的蓝白旗升上城头。珊瑚宫心海以现人神巫女之身入主稻妻城，统治稻妻数百年的幕府就此倾覆。这是稻妻自建国以来第一次由海祇岛执掌全境。"
 SAN_PW_News.1.a:"已阅"
 SAN_PW_News.2.t:"三奉行解散"
 SAN_PW_News.2.desc:"天领、勘定、社奉行三奉行奉还印信，幕府的行政中枢正式解散。九条孝行、柊慎介等旧吏被押入天守阁狱中，神里家以交出全部地契换得存续。稻妻的旧秩序在一夜之间松动了根基。"
 SAN_PW_News.2.a:"已阅"
 SAN_PW_News.3.t:"神之眼悉数奉还"
 SAN_PW_News.3.desc:"被收缴的神之眼从天守阁地下库房取出，逐一分还持有者。眼狩令正式废止，珊瑚宫宣布自今而后，任何人不得再夺走他人的愿望。海祇与鸣神两地的愿力持有者第一次同席而立。"
 SAN_PW_News.3.a:"已阅"
 SAN_PW_News.4.t:"离岛开港"
 SAN_PW_News.4.desc:"封锁数十年的离岛对外重开，璃月、蒙德与须弥的商船重新靠岸。勘定奉行的旧关税制被废止，一纸通商章程取代了旧例。稻妻的锁国之门，被海祇人从里面推开。"
 SAN_PW_News.4.a:"已阅"
 SAN_PW_News.5.t:"邪眼工厂封存"
 SAN_PW_News.5.desc:"位于八酝岛的邪眼工厂被灌入海水永久封存。那批以寿命换取武力的禁忌之物连同图纸一并锁进渊下宫最深处，由现人神亲加封印。愚人众在稻妻的经营宣告终结。"
 SAN_PW_News.5.a:"已阅"
 SAN_PW_News.6.t:"七国使节登陆"
 SAN_PW_News.6.desc:"七国使节陆续登陆离岛，向新的稻妻统治者递交国书。这是稻妻数百年来第一次主动面向提瓦特。珊瑚宫以「海祇大御神」之名接受国书，措辞谨慎而未定名分。"
 SAN_PW_News.6.a:"已阅"
 SAN_PW_News.7.t:"御影炉心重燃"
 SAN_PW_News.7.desc:"踏鞴砂的御影炉心经海祇工程师修复后重新点火，白夜国的冶炼法与稻妻的雷电五传技艺在同一座炉前交汇。沉寂多年的踏鞴砂重新升起白烟，稻妻的工业心脏开始跳动。"
 SAN_PW_News.7.a:"已阅"
 SAN_PW_News.8.t:"渊下宫重开"
 SAN_PW_News.8.desc:"被封印五百年的渊下宫入口被重新凿开，阳光第一次照进白夜国的废墟。常夜之地重见天日的同时，深海中某种沉睡的东西似乎也睁开了眼。珊瑚宫未对此发表任何声明。"
 SAN_PW_News.8.a:"已阅"
 SAN_PW_News.9.t:"雷电将军下落成谜"
 SAN_PW_News.9.desc:"雷电将军的最终去向至今没有官方定论。海祇军在天守阁废墟中寻得一把无主太刀与一具仍在运转的人偶躯壳，将军本人的生死被列为最高机密。鸣神旧臣对此讳莫如深。"
 SAN_PW_News.9.a:"已阅"
 SAN_PW_News.10.t:"稻妻的新秩序"
 SAN_PW_News.10.desc:"击败幕府半年之后，珊瑚宫治下的稻妻初现秩序。军管逐步撤除，驿道重新通行，渔场与盐场次第复工。然而海祇与鸣神的旧怨、愚人众的残余与深海的低语，仍在暗中考验着这位年轻的统治者。"
 SAN_PW_News.10.a:"已阅"

 SAN_PW_dec_rebuild_road:"复建岛路"
 SAN_PW_dec_rebuild_road_desc:"抢修连接各町的驿道，恢复战后最基本的通行。"
 SAN_PW_dec_relief_grain:"赈济海民"
 SAN_PW_dec_relief_grain_desc:"开仓放粮，安抚战后流离的渔户与岛民。"
 SAN_PW_dec_reopen_fishery:"重开渔场"
 SAN_PW_dec_reopen_fishery_desc:"解除海域管制，让渔船重新出海。"
 SAN_PW_dec_restore_forge:"修复踏鞴炉"
 SAN_PW_dec_restore_forge_desc:"重燃御影炉心，恢复踏鞴砂的冶炼产能。"
 SAN_PW_dec_clear_debris:"清理战场"
 SAN_PW_dec_clear_debris_desc:"清运天守阁与各战场留下的残骸。"
 SAN_PW_dec_salt_works:"官营盐场"
 SAN_PW_dec_salt_works_desc:"将海盐收归官营，填补战后空虚的国库。"
 SAN_PW_dec_pacify_district:"绥靖旧郡"
 SAN_PW_dec_pacify_district_desc:"对不肯归附的旧郡展开清剿与招抚。"
 SAN_PW_dec_amnesty_petition:"恩赦请愿"
 SAN_PW_dec_amnesty_petition_desc:"受理旧幕府吏民的赦免请愿，示以宽大。"
 SAN_PW_dec_vision_registry:"神眼登记"
 SAN_PW_dec_vision_registry_desc:"重新登记全稻妻的神之眼持有者，纳入管束。"
 SAN_PW_dec_shrine_audit:"神社查账"
 SAN_PW_dec_shrine_audit_desc:"清查鸣神大社及各分社的田产与香火账目。"
 SAN_PW_dec_fatui_trial:"愚人众公审"
 SAN_PW_dec_fatui_trial_desc:"公开审判在稻妻活动的愚人众成员，昭示天下。"
 SAN_PW_dec_garrison_rotate:"戍卒轮换"
 SAN_PW_dec_garrison_rotate_desc:"轮换占领区的驻军，避免军心涣散与扰民积怨。"
 SAN_PW_dec_loyalty_oath:"效忠宣誓"
 SAN_PW_dec_loyalty_oath_desc:"令旧幕府官吏集体宣誓效忠珊瑚宫。"
 SAN_PW_dec_close_narukami_shrine:"封禁鸣神社"
 SAN_PW_dec_close_narukami_shrine_desc:"封闭鸣神大社，压制旧信仰的公开活动。"
 SAN_PW_dec_open_ritou_market:"离岛互市"
 SAN_PW_dec_open_ritou_market_desc:"开放离岛互市，与七国商船打交道。"
 SAN_PW_dec_conscript_order:"征发令"
 SAN_PW_dec_conscript_order_desc:"向各岛征发壮丁，充实海祇军与占领军。"
 SAN_PW_dec_enkanomiya_survey:"渊下勘探"
 SAN_PW_dec_enkanomiya_survey_desc:"派遣勘探队深入渊下宫，测绘白夜国的废墟。"
 SAN_PW_dec_seal_abyss_gate:"封禁常夜门"
 SAN_PW_dec_seal_abyss_gate_desc:"以符咒与巨石封死渊下宫通往常世的裂口。"
 SAN_PW_dec_vishap_study:"龙蜥研究"
 SAN_PW_dec_vishap_study_desc:"研究深海龙蜥的血脉，用于技术与军备。"
 SAN_PW_dec_helios_reignite:"大日重燃"
 SAN_PW_dec_helios_reignite_desc:"重启大日御舆的赫利俄斯核心，为工业供能。"

 SAN_PW_Unified_Islands:"列岛一统"
 SAN_PW_Unified_Islands_desc:"列岛一统"
 SAN_PW_Occupied_Narukami:"鸣神旧地军管"
 SAN_PW_Occupied_Narukami_desc:"鸣神旧地军管"
 SAN_PW_Sunken_Treasury:"国库空虚"
 SAN_PW_Sunken_Treasury_desc:"国库空虚"
 SAN_PW_War_Exhaustion:"战争疲惫"
 SAN_PW_War_Exhaustion_desc:"战争疲惫"
 SAN_PW_Resistance_Remnants:"残党蜂起"
 SAN_PW_Resistance_Remnants_desc:"残党蜂起"
 SAN_PW_Divine_Mandate_Doctrine:"神权教义"
 SAN_PW_Divine_Mandate_Doctrine_desc:"神权教义"
 SAN_PW_Republican_Charter:"共和宪章"
 SAN_PW_Republican_Charter_desc:"共和宪章"
 SAN_PW_Bakufu_Restoration:"幕府复兴"
 SAN_PW_Bakufu_Restoration_desc:"幕府复兴"
 SAN_PW_Deep_Knowledge:"白夜禁知"
 SAN_PW_Deep_Knowledge_desc:"白夜禁知"
 SAN_PW_Kokomi_Regency:"心海摄政"
 SAN_PW_Kokomi_Regency_desc:"心海摄政"

