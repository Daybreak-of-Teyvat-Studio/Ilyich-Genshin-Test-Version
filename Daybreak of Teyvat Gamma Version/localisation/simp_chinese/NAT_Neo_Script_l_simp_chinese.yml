 NAT_Echoes_Petition_Idea:"回声之子陈情"
 NAT_Echoes_Petition_Idea_desc:"回声之子陈情书以六种语言写成。族中锻主将纸铺于铁砧，一笔一笔写，写完一页，念与身后匠人听。一后生数了数，皱眉曰：「六种语言，写六遍，不嫌麻烦？」锻主释笔，以锤背敲铁砧，发出一声悠长回响：「六种话，一个意思。不怕他们听不懂，就怕他们装不懂。」匠人们听了皆笑。陈情送出后，焱庭译官果拿六种文字来回比对，比三日，发现每页所云皆是同一事：炉火自起，兵刃自造。译官将六纸叠一处，对光照，六行字影重成一行。放下纸，长长出一口气。"
