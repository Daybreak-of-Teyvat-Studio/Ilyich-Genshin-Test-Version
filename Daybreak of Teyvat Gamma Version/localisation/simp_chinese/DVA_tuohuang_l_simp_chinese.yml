l_simp_chinese:
 DVA_tuohuang_cat:0 "拓荒战争"
 DVA_tuohuang_cat_desc:0 "风龙领的荒野仍被丘丘部落占据。以有限的战争，一步一步拓清 edges，直至收复全境。"
 DVA_start_tuohuang:0 "发动拓荒战役"
 DVA_start_tuohuang_desc:0 "对占据风龙领外围的丘丘部落发动一场有限战争：只夺作战区内的地块，不扩大事态。"
 DVA_th_mission:0 "拓荒战役进行中"
 DVA_th_mission_desc:0 "在战区内驱逐丘丘人，占领全部目标地块。"
 DVA_th_mission_timeout:0 "拓荒战役无功而返"
 is_not_engaged_in_a_limited_war:0 "当前没有进行中的拓荒战役"
 DVA_TUOHUANG_PEACE_TT:0 "向对方派出谈和使者"
 DVA_tuohuang_events.1.t:0 "拓荒战役告捷"
 DVA_tuohuang_events.1.desc:0 "我们的战士在风龙领外围的荒野上击溃了丘丘人的抵抗，目标地块已在控制之下。是见好就收，还是乘胜追击？"
 DVA_tuohuang_events.1.a:0 "派出使者，谈和"
 DVA_tuohuang_events.1.b:0 "继续进军！"
 DVA_tuohuang_events.2.t:0 "风龙领的谈和使者"
 DVA_tuohuang_events.2.desc:0 "风龙领派来使者，要求就双方的冲突举行谈判。在他们看来，这场拓荒不过是有限的边界摩擦。"
 DVA_tuohuang_events.2.a:0 "结束这场冲突吧"
 DVA_tuohuang_events.2.b:0 "丘丘人绝不退让！"
 DVA_tuohuang_events.4.t:0 "谈和被拒"
 DVA_tuohuang_events.4.desc:0 "对方拒绝了我们的谈和请求，战争仍将继续。"
 DVA_tuohuang_events.4.a:0 "那就打到底"
 DVA_tuohuang_events.6.t:0 "拓荒战役受挫"
 DVA_tuohuang_events.6.desc:0 "战事旷日持久，补给线吃紧，国内对这场远征的怨言四起。我们不得不停下脚步。"
 DVA_tuohuang_events.6.a:0 "从长计议"
 DVA_tuohuang_events.10.t:0 "女士南下"
 DVA_tuohuang_events.10.desc:0 "至冬的执行官「女士」罗莎琳·克鲁兹希卡·洛厄法特率军南下，兵不血刃地接管了丘丘人让出的先遣基地一线。至冬的霜色旗帜，插进了蒙德与璃月之间的荒野。\n风龙领的拓荒者们意识到：挡在他们面前的，已经不只是丘丘人了。"
 DVA_tuohuang_events.10.a:0 "至冬的手伸得太长了……"
 DVA_tuohuang_events.11.t:0 "拓荒完成"
 DVA_tuohuang_events.11.desc:0 "丘丘部落被逐出了风龙领外围的全境，荒野重新归于秩序。但南方领的至冬驻军近在咫尺——收复失地的战争，才刚刚拉开帷幕。"
 DVA_tuohuang_events.11.a:0 "真正的战争，还在后面"
