 DOT_the_long_march_2:0 "Recovery from the Long March"
 DOT_the_long_march_desc:0 "The long retreat into Shanxi has depleted our forces, and the Yan'an Base Area is not yet ready to support a major uprising. It will take time or outside help to recover."
