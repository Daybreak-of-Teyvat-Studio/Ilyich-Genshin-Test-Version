 SUM_Neo.207.t:"残响"
 SUM_Neo.207.d:"沙漠深处的残响被当成神谕。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。"
