 ITA_italian_hegemony_master_1:0 "Italian Hegemony"
 ITA_italian_hegemony_master_1_desc:0 "As the birthplace of Fascism, our purpose is clear; to become its protector and to spread it far and wide. We will instill a sense of duty and loyalty to the fascist system in every people who come under our hegemony."
