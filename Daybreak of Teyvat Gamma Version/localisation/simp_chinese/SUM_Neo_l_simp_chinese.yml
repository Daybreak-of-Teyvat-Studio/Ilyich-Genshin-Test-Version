 SUM_Neo.245.d:"沙漠深处的魔兽苏醒，商道断了。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。商道口立起了木栅。"
