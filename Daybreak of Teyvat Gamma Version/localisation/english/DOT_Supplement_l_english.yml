 GRE_eon:0 "The National Youth Organization"
 GRE_eon_desc:0 "There is something admirable in the way the Germans and Italians have organized their youths. We can adapt their model to ensure that our youth are not participating in asocial behavior or disrespecting our great leader [ROOT.GetLeader]."
