 Book_NAT:0 "§G【Рекомендуется к игре】§!Долгая раздробленность принесла на эту землю множество конфликтов, а такие исторические вехи, как убийство дракона Шибараку, тирания Очикана и катастрофа Кхенри'ах пятьсот лет назад, заложили семена вражды между племенами, даже разорвав древний союз людей и драконов, оставив расщелины в Пепельном море как постоянную угрозу. Но с приходом воли Пиро Архонта Мавуики, Натлан начинает новый путь!"
 Book_PRI:0 "§R【В разработке】§!В древние времена в Тейвате сначала буйствовали Семь Драконов, а затем сошёл Вечный Трон. Первый человек создал мир и даровал человечеству цивилизацию, которой правили Три Лунные Богини. В Год Погребального Огня начался великий хаос, восстали демоны, и постепенно появились Семь Архонтов, основав Мондштадт, Ли Юэ, Инадзуму и другие государства. Прошла тысяча лет, случилось восстание Кхенри'ах, и люди пострадали. Прошло ещё сто лет, и вот, вновь сгущаются тучи, грядёт великий переворот!"
 Book_FON:0 "§R【В разработке】§!В древние времена в Тейвате сначала буйствовали Семь Драконов, а затем сошёл Вечный Трон. Первый человек создал мир и даровал человечеству цивилизацию, которой правили Три Лунные Богини. В Год Погребального Огня начался великий хаос, восстали демоны, и постепенно появились Семь Архонтов, основав Мондштадт, Ли Юэ, Инадзуму и другие государства. Прошла тысяча лет, случилось восстание Кхенри'ах, и люди пострадали. Прошло ещё сто лет, и вот, вновь сгущаются тучи, грядёт великий переворот!"
 Book_SUM:0 "§R【В стадии реконструкции】§!Пятьсот лет назад, во время катастрофы Кхенри'ах, бог Сумеру, «Великая Древесная Владычица», исчезла. Академия привела нового Дендро Архонта в Сумеру и назвала его «Малой Богиней Древа». Однако вера народа и Академии осталась с «Великой Древесной Владычицей», и преемник не был полностью признан. Более того, «Малая Богиня Древа» была заточена в «Дворце Чистоты», её действия сильно ограничены, и многие жители Сумеру не придавали ей значения. Постепенно Мудрецы начали управлять Сумеру вместо божества."
 Book_SGD:0 "§R【В разработке】§!После смерти Короля Дешрета тысячу лет назад Великая Древесная Владычица стала победителем в войне богов. Джунгли унаследовали контроль над пустыней, став номинальными правителями. Расцвет пустыни закончился со смертью Дешрета. Племена Гура и других городов пришли в упадок. До сих пор многие племена исчезли под песками, а выжившие борются за существование. Легкая победа джунглей и их жестокое правление вызвали ненависть племён, которые обвиняют Владычицу в убийстве Короля и стремятся к независимости. Куда приведёт пустыня в этом хаосе?"
