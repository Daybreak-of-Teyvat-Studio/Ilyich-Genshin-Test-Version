 FON_genshin_party:0 "沫芒宫"
 FON_genshin_party_long:0 "§g沫芒宫，坐落于枫丹廷之中，是枫丹政府的所在地。\n自七神体系在枫丹建立以来，历代水神便在此处治理着水之国度。§!"
 FON_communism_party:0 "刺玫会（SdR）"
 FON_communism_party_long:0 "§g刺玫会（Spina di Rosula，SdR）最早由现任会长娜维娅的父亲卡雷斯创立，初衷是保护白淞镇的经济安全，协调经济生产和出口贸易，组织全镇与大公司的贸易谈判。可惜好景不长，随着卡雷斯杀人事件的发生，刺玫会也树倒猢狲散，许多成员流失。所幸，在最艰难的日子里，迈勒斯和西尔弗二人陪伴着稚嫩的大小姐艰难前行，始终没有放弃刺玫会,娜维娅本人也逐渐变得成熟坚毅。以白淞镇为起点，刺玫会重整旗鼓，不断吸收成员进入。\n目前，刺玫会的成员主要由普通城市工人、技术工人和工程师、持激进立场的知识分子和教师教授组成，其核心诉求是实现广泛的民主，包括政治、经济和管理层面的，以及保障和促进枫丹人民的权益。§!"
 FON_neutrality_party:0 "壁炉之家（HoH）"
 FON_neutrality_party_long:0 "§g严格来说，壁炉之家（House of the Hearth，HOH）算是“境外势力”——这是由至冬愚人众的执行官「仆人」所设立的孤儿院，其中的孤儿既受愚人众抚养，又要为愚人众干活。但多年来，壁炉之家在枫丹一直老实本分，没有造成过大的影响，乃至主动帮助过政府不少次，枫丹方面也就睁一只眼闭一只眼了。§!"
 FON_democratic_party:0 "报业联盟（UDJ）"
 FON_democratic_party_long:0 "§g报业联盟（Union des journaux，UDJ）。这是由蒸汽鸟报社牵头组建的枫丹新闻界协会，是新闻自由的重要推手之一，长期以来坚持通过结社尽可能保证独立性。§!"
 FON_fascism_party:0 "退伍军人及警察联合会（FDACEDLP）"
 FON_fascism_party_long:0 "§g退伍军人及警察联合会（Fédération des anciens combattants et de la police，FDACEDLP）。顾名思义，这是由枫丹的退伍军人和警察组建起来的协会，明面上致力于保护老兵和警察的利益，暗地里则被认为是军方和警方的白手套。§!"

 FON_PSF:0 "枫丹社会大众党（PSF）"
 FON_PSF_long:0 "§g枫丹社会大众党（Parti social Fontaine，PSF）由刺玫会和工人自由联合会合并改组而来，其成员主要为普通城市工人、技术工人和工程师、持激进立场的知识分子和教师教授。受党魁娜维娅的影响，社众党秉持被称之为“民主社会主义”的政治哲学，试图在民主制框架下，通过工会、党组织、沙龙等组织进行活动，宣传社会主义理念，用相对温和的方式向社会主义理想进发。§!"
 FON_PLCF:0 "枫丹立宪自由党（PLCF）"
 FON_PLCF_long:0 "§g枫丹立宪自由党（Parti libéral constitutionnel Fontaine，PLCF）。立宪自由党的创始人是前蒸汽鸟报社记者夏洛蒂，这位年轻的女记者声称，从事记者行业期间所见识到的种种阻碍和束缚，让她坚信自由和真相的价值，因而决意投身政治中，为更多人赢得自由。立宪自由党将看重社会自由和社会进步，这主要是指个人和公民的行事自由权利，包括言论、结社、新闻、出版、人身等各方面的自由。§!"
 FON_PAF:0 "枫丹联盟党（PAF）"
 FON_PAF_long:0 "§g枫丹联盟党（Parti Alliance Fontaine，PAF）。联盟党由林尼代表壁炉之家联合工商业主同盟改组而来，其成员大多具有较高的社会地位，是富豪、企业家、银行家的俱乐部。联盟党笃信经济自由主义，试图推动经济自由化改革。§!"
 FON_PDLCF:0 "枫丹立宪帝国党（PDLCF）"
 FON_PDLCF_long:0 "§g枫丹立宪帝国党（Parti de l'empire constitutionnel Fontaine,PDLCF）。帝国党唯一的诉求便是由芙宁娜本人来进行统治，除此之外并没有什么明确的纲领。§!"
 
