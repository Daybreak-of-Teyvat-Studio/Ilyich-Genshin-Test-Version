 SUM_Neo.31.b:"以律条为先"
 SUM_Neo.32.t:"净善宫僧团"
 SUM_Neo.32.d:"净善宫恢复旧例，僧人重新诵读古礼。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。高塔投下的影子越来越长，傍晚时就盖住了半条街。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。"
