 SUM_SDH_WAR_See_Towers_desc:"从雨林高处往下看，能望见须弥城的尖塔。走了这么远，为的就是那几座塔。"
 SUM_Neo_SDH.185.t:"望见尖塔"
 SUM_Neo_SDH.185.d:"从雨林高处往下看，能望见须弥城的尖塔。走了这么远，为的就是那几座塔。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SDH.185.a:"以动员令起兵"
 SUM_Neo_SDH.185.b:"以盟约召集部族"
 SUM_SDH_WAR_Terms:"提出条件"
 SUM_SDH_WAR_Terms_desc:"兵临城下才提条件：撤戍、减贡、还水、认独立。"
 SUM_Neo_SDH.186.t:"提出条件"
 SUM_Neo_SDH.186.d:"兵临城下才提条件：撤戍、减贡、还水、认独立。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.186.a:"直取雨林关隘"
 SUM_Neo_SDH.186.b:"先断其商路"
 SUM_SDH_WAR_Sumeru_Day:"须弥之日"
 SUM_SDH_WAR_Sumeru_Day_desc:"到这一步，这仗是打给雨林看的，也是打给沙漠自己看的。"
 SUM_Neo_SDH.187.t:"须弥之日"
 SUM_Neo_SDH.187.d:"到这一步，这仗是打给雨林看的，也是打给沙漠自己看的。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。收兵的号吹了很久。"
 SUM_Neo_SDH.187.a:"把话说给雨林人听"
 SUM_Neo_SDH.187.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Storm_On_Forest:"风卷雨林"
 SUM_SDH_WAR_Storm_On_Forest_desc:"哈德拉玛维特的旗插上了第一道雨林戍所。往东是河渠与平原，再往东是须弥城。教令院连夜遣使说可以谈，阵前的人只回一句：先撤戍，再谈别的。"
 SUM_Neo_SDH.188.t:"风卷雨林"
 SUM_Neo_SDH.188.d:"哈德拉玛维特的旗插上了第一道雨林戍所。往东是河渠与平原，再往东是须弥城。教令院连夜遣使说可以谈，阵前的人只回一句：先撤戍，再谈别的。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SDH.188.a:"倾全境之力"
 SUM_Neo_SDH.188.b:"留一支后手"

 #### 决议 ####
 SUM_SDH_Govern:"主母与部族"
 SUM_SDH_Govern_desc:"哈德拉玛维特的政务决议组，处理花都与雨林边地的内政事务。安抚部族、整理税制与兴修水利，都是稳固根基的功课。根基扎得深，风雨来了才不至于动摇，也才有余力去图谋更远的事情。根基扎稳，才谈得上向外的图谋。百姓安心耕织，根基才算真正稳固。"
 SUM_SDH_Faith:"花神与神龛"
 SUM_SDH_Faith_desc:"哈德拉玛维特的信仰决议组。围绕古树与花神的祭祀展开，调停新旧教团之间的分歧，维系民间的信念。信仰一旦散乱，人心也就难以聚拢，号令自然打了折扣，收税与征兵也会跟着吃力。信念一乱，再好的政令也难推行。信仰一散，许多事便无从谈起。"
 SUM_SDH_Trade:"盐路与商队"
 SUM_SDH_Trade_desc:"哈德拉玛维特的贸易决议组。依托雨林与商道，经营香料、木材与奇珍的买卖，是本邦富庶的根本。把货源与商路都攥在手里，府库自然充盈，遇到战事或灾荒时也拿得出东西来应付。把生意做活了，府库自然不再发愁。日子也才能越过越宽裕。"
 SUM_SDH_Army:"沙暴军团"
 SUM_SDH_Army_desc:"哈德拉玛维特的军事决议组。这支力量依托山地与密林，讲求伏击与坚守，训练、布防与征兵都归这里管辖。山林是他们最坚固的屏障，也是最熟悉的地利，善加利用便能以少敌多。守住山林，便守住了本邦的命脉。让来犯之人知难而退，本就是山林的用处。"
 SUM_SDH_Crisis:"风灾与饥馑"
 SUM_SDH_Crisis_desc:"哈德拉玛维特的危机决议组，处置内外的突发变故。山林之间消息迟滞，务必及时决断，以免坐失先机，让小事拖成难以收拾的大患，届时再想补救就要付出成倍的代价。早做打算，总好过事到临头才仓促应付。早做打算，也才护得住山林里的人家。"
 SUM_SDH_Dec_Gov_Council:"召开部族议事"
 SUM_SDH_Dec_Gov_Council_desc:"召集各部代表议事并立约。"
 SUM_SDH_Dec_Gov_Roll:"登记部众"
 SUM_SDH_Dec_Gov_Roll_desc:"把各部的人丁登记成册。"
 SUM_SDH_Dec_Gov_Elder:"公推长老"
 SUM_SDH_Dec_Gov_Elder_desc:"由住户公推本处长老。"
 SUM_SDH_Dec_Gov_Petition:"设陈情处"
 SUM_SDH_Dec_Gov_Petition_desc:"开一处受理冤屈的衙门。"
 SUM_SDH_Dec_Faith_Fete:"办花神诞祭"
 SUM_SDH_Dec_Faith_Fete_desc:"在沙地各处办花神诞祭。"
 SUM_SDH_Dec_Faith_Shrine:"立神龛"
 SUM_SDH_Dec_Faith_Shrine_desc:"在城门立一处花神的龛。"
 SUM_SDH_Dec_Faith_Alms:"开济贫所"
 SUM_SDH_Dec_Faith_Alms_desc:"由神庙经办济贫的场所。"
 SUM_SDH_Dec_Faith_Dig:"清理遗迹"
 SUM_SDH_Dec_Faith_Dig_desc:"组织人手清理一处遗迹。"
 SUM_SDH_Dec_Trade_Salt:"经营盐路"
 SUM_SDH_Dec_Trade_Salt_desc:"招抚盐路上的商户与驮队。"
 SUM_SDH_Dec_Trade_Toll:"设卡收税"
 SUM_SDH_Dec_Trade_Toll_desc:"在盐路要口设卡征税。"
 SUM_SDH_Dec_Trade_Caravan:"招徕商队"
 SUM_SDH_Dec_Trade_Caravan_desc:"以减税招徕远来的商队。"
 SUM_SDH_Dec_Trade_Well:"凿井"
 SUM_SDH_Dec_Trade_Well_desc:"在缺水处凿井安置流民。"
 SUM_SDH_Dec_Trade_Mint:"铸钱"
 SUM_SDH_Dec_Trade_Mint_desc:"开炉铸沙地通用的钱。"
 SUM_SDH_Dec_Army_Levy:"征发部众"
 SUM_SDH_Dec_Army_Levy_desc:"向各部征发一批部众。"
 SUM_SDH_Dec_Army_Storm:"操演风战"
 SUM_SDH_Dec_Army_Storm_desc:"按沙暴战术操演各部。"
 SUM_SDH_Dec_Army_Mech:"修补构装"
 SUM_SDH_Dec_Army_Mech_desc:"修补从遗迹取出的构装。"
 SUM_SDH_Dec_Army_Fort:"增筑戍所"
 SUM_SDH_Dec_Army_Fort_desc:"在要道增筑戍所与望楼。"
 SUM_SDH_Dec_Crisis_Storm:"赈济风灾"
 SUM_SDH_Dec_Crisis_Storm_desc:"开仓赈济被沙暴毁家的人。"
 SUM_SDH_Dec_Crisis_Water:"调停争水"
 SUM_SDH_Dec_Crisis_Water_desc:"调解两处绿洲的争水。"
