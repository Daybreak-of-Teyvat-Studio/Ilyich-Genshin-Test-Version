 Ilyich_Tech_Ruin_L_1940_desc:"耕地机·轻型 黑日型——动力与研磁炮同步强化，仍以穿插追击为要。"
 Ilyich_Tech_Ruin_L_1945:"深渊型"
 Ilyich_Tech_Ruin_L_1945_desc:"耕地机·轻型 深渊型——轻型线的终极形态，速度与火力兼备。"
 Ilyich_Tech_Ruin_H_1936:"赤月型"
 Ilyich_Tech_Ruin_H_1936_desc:"耕地机·重型 赤月型——厚重装甲与大口径研磁炮，缓慢但正面无可阻挡。"
 Ilyich_Tech_Ruin_H_1940:"黑日型"
 Ilyich_Tech_Ruin_H_1940_desc:"耕地机·重型 黑日型——装甲进一步加厚，突破能力大幅提升。"
 Ilyich_Tech_Ruin_H_1945:"深渊型"
 Ilyich_Tech_Ruin_H_1945_desc:"耕地机·重型 深渊型——重型线的终极形态，近乎移动的堡垒。"
 Ilyich_Tech_SZA_L_1940:"黑岩型"
 Ilyich_Tech_SZA_L_1940_desc:"死兆星号·轻型 黑岩型——黑岩铸骨，航速再进一步。"
 Ilyich_Tech_SZA_L_1945:"麒麟型"
 Ilyich_Tech_SZA_L_1945_desc:"死兆星号·轻型 麒麟型——麒麟踏浪，海天之间再无迟滞。"
 Ilyich_Tech_SZA_H_1936:"试做型"
 Ilyich_Tech_SZA_H_1936_desc:"死兆星号·重型 试做型——以厚甲重炮为骨的初代形态，正面交战极难被击沉。"
 Ilyich_Tech_SZA_H_1940:"黑岩型"
 Ilyich_Tech_SZA_H_1940_desc:"死兆星号·重型 黑岩型——黑岩覆甲，抗沉性大幅提升。"
 Ilyich_Tech_SZA_H_1945:"麒麟型"
 Ilyich_Tech_SZA_H_1945_desc:"死兆星号·重型 麒麟型——传说中的最终形态，一棹清风镇万渊。"

