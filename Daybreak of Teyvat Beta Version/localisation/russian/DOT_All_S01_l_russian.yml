Teyvat_News.20.t:0 "Письмо из гавани"
Teyvat_News.20.d:0 "«Дорогой Олег, я прибыл в Ли Юэ. По твоей милости я чуть не опоздал на четвёртый корабль, я запомню это...» Сергей постучал ручкой по голове. Как это называют в Ли Юэ? Кисть? Впервые он пожалел, что не взял с собой перо. «Слава Великой Императрице, здесь есть Северный банк, я быстро устроюсь, не как в других странах...» Он много раз зачёркивал написанное, и у него было желание сломать эту кисть. Он вздохнул и продолжил: «Здесь столько всего, чего нет в Шнежной. Маленькой Анфии понравились бы змеи, которых запускают в небо дети. Когда я обустроюсь, я приглашу тебя и Анфию погостить...» Ветер задул свечу на столе — он забыл закрыть окно. Лунный свет залил стол, и Сергей дописал письмо при луне."
Teyvat_News.20.a:0 "Любящий вас, Сергей"
 
#稻妻和平
 Teyvat_News.22.t:0 "Мир в Инадзуме"
 Teyvat_News.22.d:0 "На краю земли война стихла, и дым рассеялся. Гражданская война в Инадзуме закончилась."
 Teyvat_News.22.a:0 "Какое счастье"
#蒙德故事
 Teyvat_News.23.t:0 "Глория и Гудвин"
 Teyvat_News.23.d:0 "Я слепа от рождения и не знаю, как выглядит мой парень Гудвин. Он ушёл в экспедицию с Великим Магистром, но вернулся мёртвым. Его товарищи сказали, что он попросил Сахарозу пересадить ему мою роговицу.\nКогда я прозрела, то искала его фото, но нашла только письмо с пустой фотографией, на которой было написано: «Не думай, как я выгляжу. Тот, кого ты полюбишь, будет похож на меня»."
 Teyvat_News.23.a:0 "Вдруг увидела иву?"
 Teyvat_News.24.t:0 "Тёрнер и Гай"
 Teyvat_News.24.d:0 "Мой отец Тёрнер работал в «Винограднике Рассвет» и хвастался, что был рыцарем. Я его любил, но мать умерла рано, и мы жили вдвоём. Я спрашивал, почему он не женится. Он говорил, что любит только мать.\nПозже отец сказал, что женится на Джилианне из «Кошачьего хвоста». Я ударил её и назвал отца лжецом. Он больше не говорил о свадьбе.\nПосле его смерти я нашёл фото младенца, на обороте было написано: «Сын товарища — как мой сын!»"
 Teyvat_News.24.a:0 "Сын товарища — как мой сын!"
 
 Teyvat_News.25.t:0 "Картошка в Мондштадте"
 Teyvat_News.25.d:0 "В Мондштадте продовольственный кризис.\nБард Венти встретил фермера и спросил об урожае.\n«Картошка уродилась, скоро будет до Барбатоса».\nВенти сказал: «Друг, мы свободная страна, откуда ты знаешь, где Барбатос?»\n«Тогда у нас нет картошки»."
 Teyvat_News.25.a:0 "Где картошка?"
 
 Teyvat_News.26.t:0 "Порядок в Ли Юэ"
 Teyvat_News.26.d:0 "В Ли Юэ проблемы с безопасностью.\nХиличурлы окружили торговца: «Вы путешественник?»\n«Нет».\n«А ваша семья?»\n«Нет».\n«А друзья?»\n«Нет».\n«Тогда отдавайте товар, это ограбление»."
 Teyvat_News.26.a:0 "Мне нужно срочно найти путешественника"

 Teyvat_News.27.t:0 "Свобода в Мондштадте"
 Teyvat_News.27.d:0 "В Мондштадте экономические проблемы, вводятся карточки.\nПутешественник жалуется: «Нет мяты, нет курицы, нет ветчины... В Мондштадте нельзя жить!»\nЭмбер говорит: «Друг, если ты будешь так говорить о свободной стране, я сообщу в МВД!»\nПутешественник продолжает: «И свободы нет...»"
 Teyvat_News.27.a:0 "Некоторые свободнее других?"
 
 Teyvat_News.28.t:0 "Потратить миллион Моры"
 
 Teyvat_News.29.t:0 "Правление Сёгуна"
 Teyvat_News.29.d:0 "Народ недоволен правлением Сёгуна и хочет перемен.\nЯэ Мико советует: «Сделай так: 1. Введи указы. 2. Отмени их. 3. Скажи, что ты изменилась и вняла желаниям народа. Ничего не меняя, ты завоюешь народную любовь»."
 Teyvat_News.29.a:0 "Сёгун сам себе вырыл яму!"
 
 
 Teyvat_News.61.t:0 "Суд над Великим Мудрецом!"
 Teyvat_News.61.d:0 "Великий Мудрец Азар — тиран и коррупционер. Он попрал законы, узурпировал власть, угнетал народ. Небеса и земля не могут терпеть его злодеяний."
 Teyvat_News.61.a:0 "Казнить! Казнить! Казнить!"
 
 Teyvat_News.62.t:0 "Декларация независимости Хэйянь"
 Teyvat_News.62.d:0 "Провозглашается независимость Хэйянь. Владыка ушёл, и его воля более не властна."
 Teyvat_News.62.a:0 "Владыка ушёл, и воля его угасла. Увы!"
 
 Teyvat_News.63.t:0 "Декларация независимости пустыни"
 Teyvat_News.63.d:0 "Провозглашается независимость пустыни. Владычица ушла, и её воля более не властна."
 Teyvat_News.63.a:0 "Владычица ушла, и воля её угасла. Увы!"

#######稻妻内战故事#########
 Teyvat_News.17.t:0 "Пожар в Надзути"
 Teyvat_News.17.d:0 "Три месяца назад Кудзё Сара повела армию против Кораллового дворца. Кокоми приказала Кадзухе и Горо атаковать. Кадзуха с войсками встретил сёгунскую армию у Надзути. Битва была долгой, у обеих сторон кончились припасы. Кадзуха использовал хитрость и сжёг вражеские корабли."
 Teyvat_News.17.a:0 "Горы и реки вечны, закаты бесконечны."
 Teyvat_News.21.t:0 "Покушение на Кудзё Сару"
 Teyvat_News.21.d:0 "Кудзё Сара была ранена во время выступления в Ханамизаке. Нападавший — главарь банды. Сара выжила после долгой операции. Полиция расследует дело."
 Teyvat_News.21.a:0 "Как дико!"

