DOT_ControlProvince.10.e:0"В Мондштадте всё всегда так плохо."

#11 营地城
DOT_ControlProvince.11.t:0"Лагерный город пал!"
DOT_ControlProvince.11.d.generic:0"Лагерный город, самый крупный и густонаселённый город Драконьего хребта, захвачен войсками [FROM.GetAdjective]. Войска [FROM.FROM.GetAdjective] отчаянно сопротивлялись, но были отброшены.\n\nГород, выросший из альпинистского лагеря, пал не под снежной бурей, а под огнём пушек."
DOT_ControlProvince.11.a:0"Нужно вернуть Лагерный город!"
