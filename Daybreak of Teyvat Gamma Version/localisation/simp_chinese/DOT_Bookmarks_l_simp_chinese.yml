DOT_INTRO_NOW_MOT:0 "§Y一、名不副实的中央政府§!\n西风骑士团在名义上统辖蒙德全境，实际权力却散落在各自治领手中：古恩希尔德守北境、莱艮芬德据晨曦酒庄、龙脊雪山领自成一体、奔狼领游离于体制之外、风龙领直面龙灾。大团长法尔伽带走了五分之四的主力远征未归，城中只剩新兵与代理团长琴·古恩希尔德；中央既无独立财源，也无人事与调度的强制力，全靠各领上缴的税收维系。\n\n§Y二、繁荣之下的裂缝§!\n枫丹技术自西方涌入，果酒湖沿岸工厂林立，产业工人数量激增，蒙德经济正处于前所未有的高点。然而红利并未均沾：工价被压低，行会与贵族把持渠道，新生的工人群体开始接受南方传来的启明主义。教会久不见神迹，正统教士腐化，罗莎莉亚在东部另立反对派，芭芭拉则以解放神学试图把这场运动拉回温和的道路。\n\n§Y三、迫在眉睫的危机§!\n特瓦林的袭击日益频繁，商路与村庄接连受损。劳伦斯家族在暗处联络旧贵族与境外势力，舒伯特之流已不再掩饰复辟的意图。一旦龙灾与内战同时爆发，骑士团将既无兵力弹压地方，也无威信召集各领。\n\n§R结论：蒙德不是会不会乱，而是什么时候乱。§!"
DOT_INTRO_WAY_MOT:0 "§Y一、琴的路线：改革与自由§!\n以「蒙德的光明未来」为总纲，向下分为「道路将不断延伸」（整合地方力量、稳定经济状况、推进改革进程）与「蒙德至暗之日」（局势恶化后的应急支线）。改革成功则可走向§C公理战胜§!（民主，自由理想落地）；若在压力下妥协，则转为§8回船归港§!，以铁腕维持秩序，把理想留待下一次机会。\n\n§Y二、诺艾尔的路线：临危受命§!\n以「临时代理团长」开局，分三条：§C适应新现状§!（破格提拔、消弭不安，最终大政奉还，蓝色）；§8结晶之夜§!（以清洗背叛、贪婪、堕落、怠惰为名行铁腕之治，黑色）；§R高歌猛进§!（公投连任，红色）。\n\n§Y三、其他走向§!\n若中央权威彻底崩塌，「提瓦特大陆的混乱」将触发各自治领自行其是，莱艮芬德、奔狼领、龙脊雪山、古恩希尔德、教会反对派、劳伦斯残党各自成局，蒙德进入多方割据。另有「战争，生产，建设」军备线与「开始训政」「黑玫瑰之萌芽」等非常路线。\n\n§Y提示：§!各路线在关键节点互斥，选定后难以回头。"
DOT_INTRO_NOW_LYY:0 "§Y一、人神更始§!\n帝君退隐之后，璃月并未陷入混乱，却也不再有一个能一锤定音的声音。七星秉政、月海亭总揽庶务，契约仍是立国之本，凡涉利害皆以条文相绳。问题在于：契约可以约束交易，却约束不了人心。\n\n§Y二、富而不均§!\n璃月港的财富冠绝七国，商船南抵稻妻、北通蒙德，飞云商会与南十字船队各据一方。但繁荣之下是三重病灶：§8财富汇集之港§!使资本向少数家族集中；§8劳务派遣§!让工人失去议价能力；§8低质量工业§!使工厂以量取胜、技术停滞。三者叠加，正是启明主义在码头与工棚中迅速传播的土壤。\n\n§Y三、四股力量的角力§!\n玉衡星刻晴主张彻底的人治与变革，已在七星内部自成一派；天权星凝光主守成，以律法与商路维持旧秩序；月海亭八省联盟试图用官僚体系在两者之间求平衡；三眼五显仙人则视人治为对契约的背离，隐于绝云之间观望。\n\n§Y四、外部压力§!\n愚人众在境内四处活动，北国银行的贷款与至冬的“援助”都是绳索。近海之下，当年被帝君镇压的漩涡魔神奥赛尔，似乎已不甘于永恒的囚禁。\n\n§R结论：璃月的下一步，将决定它是继续做“契约之国”，还是成为别的什么。§!"
DOT_INTRO_WAY_LYY:0 "§Y一、刻晴：革命委员会§!\n以「共和国之晨」「黎明檄文」为纲，废七星旧制、行启明主义，走§R红色§!路线，是璃月变动最大、阻力也最大的一条。\n\n§Y二、凝光：天权临政§!\n「天权临政」「天权新秤」两段，以律法与财政重建中央权威，偏§8威权/寡头§!，稳定但保守。\n\n§Y三、月海亭：八省联盟§!\n「月海秉政」「月海新章」，以官僚体系吸纳各方，走§C蓝色§!的渐进改革，最不激烈，也最难见效。\n\n§Y四、仙人：闲云天宫§!\n「孤鹤出云」「孤鹤临朝」，三眼五显重归治世，走§Y尘世主义§!，以神治压人治。\n\n§Y五、其他势力§!\n「公子临海」为至冬介入的走向；「云来换旗」为云来海地方易帜；「沉玉自立」为沉玉谷脱离璃月；七星革命委员会、月海亭八省联盟、三眼五显仙人亦各自可作为独立势力开局（KQP / GYP / SHP）。\n\n§Y提示：§!璃月的路线互斥点集中在“是否承认人治”这一条上，选边即定调。"
DOT_INTRO_NOW_INA:0 "§Y一、永恒的空壳§!\n雷电将军闭居一心净土，将国政全权交给三奉行。锁国令断绝了对外往来，眼狩令收缴神之眼，两条法令都写进了“永恒”的名义之下，实际执行却全凭奉行所的官吏。五百年的积弊在这一代人身上集中爆发：§8雷祸横行§!使大片土地荒废，§8眼狩令§!激起民怨，§8锁国令§!让工商业窒息。\n\n§Y二、三奉行的成色§!\n天领奉行掌兵、勘定奉行掌财、社奉行掌礼仪与神事。九条与柊两家在腐败中牟利，唯独神里家还在勉力支撑。军队训练松弛，军械陈旧，幕府早已不是五百年前那支能征惯战的军队。\n\n§Y三、海祇的旗§!\n珊瑚宫心海以废除眼狩令为号召起兵，反抗军一度势如破竹。但攻入八酝岛后，部分狂热者破坏了镇压祟神的镇物，祟神之力外泄，稻妻全境受害，反抗军的攻势也为之中断。\n\n§Y四、愚人众的赌局§!\n至冬以“援助”之名向两边同时输送邪眼。使用者获得力量，也付出寿命为代价。战争越久，邪眼卖得越多，稻妻流干的血就越多。\n\n§R结论：踏鞴砂的御影炉心一旦失控，污染将不可收拾。永恒已经撑不住了。§!"
DOT_INTRO_WAY_INA:0 "§Y一、幕府的自我修补§!\n「重整勘定奉行」「重整天领奉行」两条线，从财政与军制入手清理积弊，属于体制内改革，速度慢但风险低。\n\n§Y二、权柄归属§!\n「稻妻权力斗争」决定幕府由谁主导：§C八重政府§!（神子秉政，较开明）、§8军政府§!（军方接管，强硬）、以及第三条折中路线（其余政府）。三者互斥，选定后国策树走向不同。\n\n§Y三、眼狩令的去留§!\n「狩眼仪式」与「珊瑚宫问题」构成对内的两条主轴：要么维持眼狩令、以武力平定海祇；要么废令和解、把珊瑚宫纳入体制。\n\n§Y四、开发与战争§!\n「稻妻开发计划」提供工业化与基建方向；「战争的宣传」则为对外扩张铺路，锁定与璃月、至冬的冲突。\n\n§Y五、珊瑚宫视角§!\n若以珊瑚宫（SAN）开局，则从「反抗的开端」到「统一之晓」，走的是推翻幕府、统一稻妻的另一条路。"
DOT_INTRO_NOW_SUM:0 "§Y一、没有神明的神国§!\n大慈树王逝去已五百年。教令院迎回的小吉祥草王被安置在净善宫，名为神明，实为囚徒；六大学派的贤者以“神意”之名行独断之实，大贤者阿扎尔的权柄已无人可制。§8被囚禁的神明§!、§8造神计划§!、§8死域的影响§!，三个国家精神就是须弥现状的三根支柱。\n\n§Y二、停滞的智慧之城§!\n虚空终端五百年未有实质进展，基础理论科学与实践科学同样停滞。学风败坏，学者争权夺利，学术资源被门阀把持。死域在雨林中不断扩张，魔麟病无药可医，教令院既无力处理，也不愿承认自身的失职。\n\n§Y三、雨林与沙漠§!\n沙漠诸部长期被粗暴对待，离心已久。镀金旅团与残存部族以复兴赤王为号，公开质疑雨林的统治合法性。教令院对沙漠的控制力正在肉眼可见地衰退。\n\n§Y四、外来的手§!\n至冬的“博士”已被请入须弥，参与造神计划。愚人众的介入不是善意，而是把须弥当成试验场。\n\n§R结论：须弥的问题不在于没有神，而在于有一群人假借神的名义统治，却既不敬神，也不爱人。§!"
DOT_INTRO_WAY_SUM:0 "§Y一、教令院三条路§!\n§C圣树加冕§!：迎回真正的小吉祥草王，以神权重建秩序；§C学者共和§!：废贤者独断，行学者共议；§8造神王座§!：完成造神计划，以人造神明取代草神（黑色，代价极大）。\n\n§Y二、雨林与沙漠的再平衡§!\n「沙与林」为和解线，承认沙漠的平等地位；「漫长的独立路」「藩属之影」「沙海商路的算盘」为沙漠视角的三种出路：独立、附庸、以商立国。\n\n§Y三、沙漠的旗§!\n「赤王的旗」复兴赤王旧统；「兵向雨林」以战争解决；「旅团公议」走部族共和；「主母的权柄」则由女性长老集团掌权。\n\n§Y四、兰那罗§!\n以桓那兰那（VAN）开局，从「兰拉娜的求助」「山雨欲来」出发，走兰那罗自身的存续之路，与雨林政局相互牵动。\n\n§Y提示：§!须弥的路线分歧点在于“神的地位”：迎神、废神、造神，三者不可兼得。"
DOT_INTRO_NOW_FON:0 "§Y一、审判者的国度§!\n厄歌莉娅身死之后，芙宁娜继位，实际政务由最高审判官那维莱特承担。前水神时期的体制被彻底改组，贵族议会的旧权力被司法体系取代，枫丹以律法与审判立国，一切争端最终都要落到条文与判决上。\n\n§Y二、繁荣与低效§!\n枫丹的工业化程度冠绝提瓦特：警卫机关、战争机器、留影机皆出于此。§8经济高峰§!之下，是§8低效率政府§!与§8官僚化的科学院§!：前者使决策迟缓，后者使技术优势正在被制度消耗。重建期把资源尽数投向民生，军备与治安则被搁置：逐影庭反复抱怨人手不足。\n\n§Y三、暗流§!\n“秩序化身”与“暗流涌动”同时存在。强势领袖制的拥护者希望一个能下决断的人；复生主义者怀念雷穆利亚；革命恐怖主义者在工厂与灰河之间活动；商会统合体制则试图让商会接管一切。枫丹的稳定，建立在没有人真的满意这一前提上。\n\n§R结论：这个国家的剧本才刚写完开场。§!"
DOT_INTRO_WAY_FON:0 "§Y当前完成度§!\n枫丹国策树目前只完成 22 个国策，三条主干均已开放，但后续分支仍在制作中。\n\n§Y一、好戏开场§!\n主线开端。枫丹的一切都以“戏”的形式展开：审判、庆典、阴谋都在同一座舞台上排演。此线决定芙宁娜与那维莱特之间的权柄分配。\n\n§Y二、秩序化身§!\n以司法与秩序为核心，强化审判官体系与执律庭，走§8威权§!方向，压制民间结社与激进思潮。\n\n§Y三、暗流涌动§!\n以地下势力为核心，连接革命恐怖主义、复生主义与商会统合体制，走向§R激进§!或§8极端§!的结局。\n\n§Y提示：§!现阶段枫丹可玩内容有限，建议先体验蒙德、璃月、须弥、稻妻、纳塔的完整剧本。"
DOT_INTRO_NOW_NAT:0 "§Y一、火神的新秩序§!\n玛薇卡以「不败阳焰」登上火神之位，凭一身武勇与意志把散沙般的部族重新拢到一起。§8古名传承体系§!把每个人的命运与部族、与先祖的名字绑定，这套制度既是动员机制，也是控制机制。\n\n§Y二、六部族§!\n沃陆之邦、回声之子、流泉之众、悬木人、花羽会、烟谜主，六部族各有传承与利益，表面上尊奉火神，实际上都在观望。玛薇卡要的是统一，部族要的是自治，这两件事迟早要摊开谈。\n\n§Y三、深渊的裂口§!\n烬寂海的裂隙从未真正封死，§8深渊侵蚀扩散§!是纳塔每天都在付出的代价。抗渊战争不是选项，而是常态；问题只在于谁来指挥、按谁的规矩打。\n\n§R结论：纳塔的统一还很新，新到经不起一次失败。§!"
DOT_INTRO_WAY_NAT:0 "§Y一、统一的深化§!\n「召集部族议会」「推广纳塔民族认同」「召开抗渊战争会议」，三条并行推进，把部族联盟逐步做成真正的国家机器；「万火归一」为统一线的收束。\n\n§Y二、六部族的异议§!\n沃陆之邦、回声之子、流泉之众、悬木人、花羽会、烟谜主各有一条「异议初萌」线。若中央权威削弱，六族可各自转向自主甚至对抗，纳塔重新分裂。\n\n§Y三、深渊之门§!\n「不静之门」指向烬寂海深处的裂隙，是纳塔最危险也最诱人的一条路：以深渊之力对抗深渊。\n\n§Y提示：§!纳塔的路线核心是“中央与部族”的拉扯，任何一条激进路线都会引发六族连锁反应。"
DOT_INTRO_WAY_NDK:0 "§Y一、月与霜§!\n「雪浪与苍林之舞」为霜月之子的主线，重拾对月神的信仰与自然之道；「三相月临」为信仰线的收束，指向月神重临的终局。\n\n§Y二、技术与生计§!\n「研究设计手稿」连接蛋卷工坊，走机械与发明之路；「月矩力能源」开发本地能源，是工业化的基础。\n\n§Y三、人的抉择§!\n「接收俘虏」决定如何对待战俘与流民；「私下接触执政官」走外交与妥协；「整合各地残军」以武力收拾残局。\n\n§Y四、红旗§!\n「红旗飘扬」是一条与本地传统完全不同的路线：以革命改造挪德卡莱的社会结构，走向§R红色§!结局。\n\n§Y提示：§!挪德卡莱的路线分歧在于“守旧信月”还是“另立新法”，红旗线与其他路线互斥最彻底。"
DOT_INTRO_NOW_SNE:0 "§Y一、女皇的旨意§!\n至冬的一切政令最终都出自冬宫。女皇以「苍星圣敕」统合诸执行官，将最精锐的一批人悉数召回本土，这在过去百年里从未有过。愚人众不再只是外交与渗透的工具，而正在被改造成一支随时可以投入战场的军势。\n\n§Y二、三根支柱§!\n§C严冬计划§!：把整个国家的经济与工业纳入长期战争准备；§8愚人众军官团§!：武装力量的实际指挥权正在向军官团集中；§C陵寝与白桦§!：关于死亡、纪念与国族认同的一整套安排，让牺牲变得可以承受。三者互为表里，构成至冬动员能力的底座。\n\n§Y三、代价§!\n动员是要花钱的。工厂三班倒，铁路昼夜不停，征兵年龄一再下调。地方市长与军工集团在配给与订单中上下其手，边远省份的饥荒被压成了报表上的一行数字。\n\n§R结论：至冬已经是一台战争机器，问题只在于它先碾向谁。§!"
DOT_INTRO_WAY_SNE:0 "§Y一、愚人众的整合§!\n「召集愚人众！」为权力线的开端，决定执行官与军官团之间的从属关系；此后「伟大抗争」把对外冲突正当化，为全面战争做舆论准备。\n\n§Y二、工业与军备§!\n「市长的工业计划」走地方工业化路线，见效慢但根基扎实；「晶角湾军港」与「建设空军」为两条军种倾斜线，海军与空军只能优先一边。\n\n§Y三、社会§!\n「扫盲运动」提高全民识字率，长期看是收益最高的投资，短期挤占军工产能。\n\n§Y四、两条暗线§!\n「骤雪」与「往冥府的安魂歌」指向至冬内部更深的动荡：前者是突发变局，后者与陵寝、死亡信仰相关，可能通向与女皇路线不同的结局。\n\n§Y提示：§!至冬的路线核心是“动员到什么程度”，超限动员会引发后方崩溃。"
DOT_INTRO_NOW_RAG:0 "§Y一、游离于体制之外的家族§!\n莱艮芬德自晨曦骑士起就以“体制外的审判者”自居。迪卢克不承认骑士团的权威，只按自己的判断惩恶扬善。这种姿态在太平时是风骨，在乱世就是割据的借口。\n\n§Y二、家底§!\n晨曦酒庄是蒙德最赚钱的产业之一，酒业、商路与人脉都在家族手中。§8产业萧条§!让利润下滑，边境走私又侵蚀着正当贸易；家族内部对“要不要下场”分歧极大。\n\n§Y三、眼下的局势§!\n§8蒙德政局混乱§!，骑士团虚弱，各地自谋出路。莱艮芬德若不出手，就会眼睁睁看着劳伦斯或教会反对派先占先机；若出手，就等于亲手撕开蒙德。\n\n§R结论：迪卢克必须决定，他是要做一个守夜人，还是做一个建国者。§!"
DOT_INTRO_WAY_RAG:0 "§Y一、贵族少爷§!\n以家族本位重建秩序，走§8威权/贵族§!方向：先强化骑士、清理边境走私，再把酒业与商路变成财政与情报网络。\n\n§Y二、自由联盟§!\n联合龙脊雪山、奔狼领、古恩希尔德等自治领，以“自由”为共同旗帜组建联盟，走§C蓝色§!路线。代价是要把主导权分给别人。\n\n§Y三、让蒙德再次伟大§!\n以家族为中心重塑蒙德，走§8强硬民族主义§!路线。此线最容易与骑士团正面冲突，也最容易招来至冬与劳伦斯的算计。\n\n§Y四、阴影中的线§!\n「针对凯亚的阴谋」「山雨欲来风满楼」为两条暗线，凯亚的身份一旦被揭开，蒙德的情报体系与外交格局都会随之改变。\n\n§Y提示：§!莱艮芬德的三条主线互斥，其中“自由联盟”与另外两条的冲突最尖锐。"
DOT_INTRO_NOW_ANR:0 "§Y一、被遗忘的森林§!\n奔狼领素来与蒙德的工业化、远征和朝堂纷争无关。这里没有像样的城市，只有猎场、林道与散居的村落。§8飞土逐肉§!：生计靠山吃山；§8山林游侠§!：秩序靠猎手自发维持；§8难民涌入§!：乱世里，越来越多人把这里当成最后的退路。\n\n§Y二、狼王的影子§!\n安德留斯的灵魂仍沉睡在这片土地上，狼群与其眷属从未真正离开。奔狼领的人不常提起他，但每当蒙德出事，这块土地就会想起自己握着什么。\n\n§Y三、困局§!\n难民带来人口，也带来饥饿与冲突。奔狼领既没有工业，也没有税收体系，更没有资格在蒙德的谈判桌上说话，除非它先证明自己有力量。\n\n§R结论：这片森林要么被战火吞没，要么从战火里长出自己的国家。§!"
DOT_INTRO_WAY_ANR:0 "§Y共通线§!\n先解决吃饭与治安：安置难民、组织猎手、开拓林地，把散居的村落连成可以动员的网络。\n\n§Y一、班尼特：与人民同在§!\n走§R红色§!路线，把新生的启明主义理想落到奔狼领的土地上，以互助与动员建立基层组织。\n\n§Y二、菲谢尔：加速，迈向未来§!\n接受异想天开的情境主义思潮，走§R红/黑§!路线，主张以改造人性来加速改造社会，走向最激进的终局。\n\n§Y三、雷泽：求同存异§!\n走§C蓝色§!路线，把各派所长捏合起来，以协商与互助为原则，是四条路线里最温和的一条。\n\n§Y四、迪奥娜：退一步，进两步§!\n走§C蓝色§!路线，与商人或乡绅合作，在贸易自由与社会稳定之间取利，最务实也最容易背弃理想。\n\n§Y提示：§!四条路线在“是否保留旧秩序”上分裂，菲谢尔线与其余三条几乎不可能共存。"
DOT_INTRO_NOW_DRA:0 "§Y一、雪山上的新国家§!\n经过二期开发计划，龙脊雪山领已是蒙德经济最发达、人口最密集的地区之一。阿贝多议长以学者方式治理：招引移民、开发资源、组织商贸，把沙尔·芬德尼尔遗留的设施重新启用。\n\n§Y二、忠诚与自保§!\n雪山领忠于蒙德、忠于自由，但这忠诚建立在骑士团还能提供庇护的前提下。一旦骑士团遭到毁灭性打击，一个有工业、有人口、有组织的雪山领，没有理由继续听命于一个空壳。\n\n§Y三、内部的暗面§!\n阿贝多的研究从未停手。砂糖在实验室里做着无人理解的尝试；丽莎掌着另一套班底；而“阿贝少”，那个不该存在的造物，也在某个角落积蓄着自己的阴谋力量。\n\n§R结论：雪山领是蒙德最锋利的刀，也是最容易反噬的那把。§!"
DOT_INTRO_WAY_DRA:0 "§Y一、阿贝多：自由、和平与稳定§!\n走§C蓝色§!路线：接过骑士团的火炬，以强大军队与高效行政迅速平息蒙德乱局，把和平与自由重新带回这片土地。\n\n§Y二、阿贝少：循此苦旅，终抵群星§!\n走§8黑色§!路线：积蓄阴谋力量夺取权力，以铁腕指引蒙德冲向“进步”。这条路的终点不是自由，而是另一种暴政。\n\n§Y三、砂糖：创新、救护与民主§!\n走§C蓝/红§!路线：支援各地人民、平息内战、渗透军阀，以试验与创新推动社会改造。\n\n§Y四、丽莎：磨剑三年，一鸣惊人§!\n走§C蓝色§!路线：在混乱中先建一个和平幸福的庇护所，埋头发展工业，等到羽翼丰满再横扫蒙德。\n\n§Y五、大集体：迈向终极自由§!\n走§8黑色§!路线：在丽莎批准的实验项目中诞生，通向摆脱肉身枷锁的“终极自由”，是全部路线中最不可名状的一条。\n\n§Y提示：§!五条路线共用「国际研究院」「阿贝多的宏伟蓝图」「推进军事建设」等前期国策，分歧点在中期。"
DOT_INTRO_NOW_GUN:0 "§Y一、永护蒙德的家族§!\n古恩希尔德自三千年前立下「永护蒙德」的祖训，历代出教士与骑士。家族势力扎根北境，与至冬接壤，长年镇守边关。\n\n§Y二、家底单薄§!\n§8初级经济§!：北境土地贫瘠，工商业薄弱，家族财政长期紧张。琴出任代理团长后，家族声望达到顶点，但兵力与钱粮都没有随之增长。\n\n§Y三、两难§!\n家族内部对局势判断不一：一派主张倾力支持阿贝多，把雪山领的工业能力当成蒙德的未来；一派主张支持芭芭拉，从教会入手凝聚人心；还有人主张联姻结盟，把迪卢克或优菈拉进同一阵营。\n\n§R结论：古恩希尔德必须在蒙德崩解之前，决定自己站在哪一边。§!"
DOT_INTRO_WAY_GUN:0 "§Y一、家族会议§!\n「古恩希尔德家族会议」为总开关，会后分为三条：邀请迪卢克（联合莱艮芬德，走贵族-豪族同盟）、邀请优菈（联合劳伦斯残部，走和解路线）、支持阿贝多或支持芭芭拉（工业线/教会线）。\n\n§Y二、支持阿贝多§!\n把宝押在雪山领的工业与组织能力上，走§C蓝色§!路线，见效快但等于把家族置于从属地位。\n\n§Y三、支持芭芭拉§!\n从教会与民心入手，走§C蓝色§!路线，见效慢但道义基础更牢。\n\n§Y四、非常路线§!\n「未曾设想的道路」「提瓦特大陆的混乱」为应急支线：前者是背离祖训的激进转向，后者是蒙德全面内战后的自保。\n\n§Y提示：§!古恩希尔德的所有路线都以“不背叛祖训”为底线，越过这条线的选项后果最重。"
DOT_INTRO_NOW_FAV:0 "§Y一、松籁的下半段§!\n千年前西风教会曾分裂为两派，一派与王侯共饮，一派深入平民与奴隶，约定唱响松籁之歌下半段时起事。今日的教会反对派正是举着这面旗帜重现：他们宣称现行教会已背离风神教诲，需要再一次变革。\n\n§Y二、组织的两副面孔§!\n§8内部斗争§!：有人把组织当成夺取蒙德权力的工具，有人把它当成需要教育的孩子。罗莎莉亚要的是一把能与未来危险对抗的利剑；芭芭拉要的是把这场运动拉回温和的正道。\n\n§Y三、处境§!\n§R异端教派：公众敌视§!。在正统教会眼中他们是异端，在贵族眼中他们是动乱之源，在骑士团眼中他们是必须处理的问题。他们唯一的资本是底层信众的支持。\n\n§R结论：教会反对派要么成为蒙德的新教会，要么成为内战里又一堆焚尽的柴薪。§!"
DOT_INTRO_WAY_FAV:0 "§Y一、起源§!\n「教会反对派的故事……」「……起源于蒙德的悲鸣」为两条开端，决定这个组织是从教义争论中诞生，还是从民生苦难中诞生。\n\n§Y二、夺权与统一§!\n「星辰坠落」是激进夺权线；「迈向蒙德统一」是温和扩张线。前者快而险，后者慢而稳。\n\n§Y三、六种教导§!\n「笃行」「繁荣」「抗争」「勤劳」「自由」「诤言」六条教导线，分别对应纪律、经济、斗争、生产、自由与批判六种组织路线，是神学革命的具体内容。\n\n§Y四、终局§!\n「Originate_From_Sorrow_of_Mot」（起于蒙德之悲）、「Get_It」（夺取）、「Wipe_all_Tear」（拭去一切泪水）三条终局国策，对应三种截然不同的结局：重建、夺权、救赎。\n\n§Y提示：§!罗莎莉亚线与芭芭拉线在中期分道，前者偏§8强硬§!，后者偏§C温和§!。"
DOT_INTRO_NOW_LAW:0 "§Y一、尘埃里的宗室§!\n劳伦斯家族曾是蒙德的统治者，如今寄居在骑士团的阴影之下。礼节仍在，封地已失；头衔仍在，赋税全无。族中长者仍以“蒙德之光”自居，年轻一辈则只把权力当作衣着的勋章。\n\n§Y二、机会§!\n骑士团主力远征未归，城中空虚；各地自治领各自为政；教会分裂；龙灾未平。对一个想复辟的家族来说，这是千年来最好的一次机会。\n\n§Y三、外援§!\n§8强化与至冬的联系§!：愚人众乐于资助任何能搅乱蒙德的人。但借钱的人，最后都要还。\n\n§R结论：劳伦斯要么夺回蒙德，要么彻底从历史上被抹掉。§!"
DOT_INTRO_WAY_LAW:0 "§Y一、复兴旧统§!\n「开拓冰雪之族，重现人间」为复辟主线：重树宗室权威，恢复旧贵族的封地与特权。\n\n§Y二、结盟与联络§!\n「联络大家族」「联络自由派」「联络野心家」三条并行，分别拉拢旧贵族、体制内改革者与投机者。三者的支持不可兼得，选择谁就等于选择了复辟后的政权形态。\n\n§Y三、外援§!\n「强化与至冬的联系」换取资金与武器，代价是把蒙德变成至冬的附庸；「莅临指导」为外部势力直接介入的走向。\n\n§Y四、军事与内政§!\n「军事准备」「处理内部」「分析教训」三条为动手前的准备：练兵、清党、复盘旧贵族失败的原因。\n\n§Y五、另一条路§!\n「浪花涌起」是一条与复辟无关的支线，指向劳伦斯家族内部的转向。\n\n§Y提示：§!劳伦斯的路线以“是否依赖至冬”为最大分歧点。"
DOT_INTRO_NOW_DVA:0 "§Y一、龙灾前线§!\n风龙领是蒙德与特瓦林之间最近的一块土地。侦察骑士安柏带着一支人数不多的队伍守着这里，既要疏散村民、清理盗匪，也要监视风魔龙的动向。\n\n§Y二、薄弱的底子§!\n风龙领没有像样的工业，财政靠骑士团拨款与地方自筹。人口因龙灾持续外流，留下的多是走不动的老人与不愿走的人。\n\n§Y三、未定的方向§!\n这片土地上的议题杂乱而真实：要不要建工厂、要不要办公社、要不要设情报机构、要不要与邻邦结盟。每一个选择都在没有足够资源的前提下做出。\n\n§R结论：风龙领尚未定型，它的路要由玩家替它走出来。§!"
DOT_INTRO_WAY_DVA:0 "§Y当前完成度§!\n风龙领的国策树虽已存在，但多数分支仍在制作中，部分精神与代表国策沿用自其它势力，请以实际游戏内容为准。\n\n§Y一、内政§!\n「工业发展计划」走工业化；「第一届公社大会」走基层自治与集体化，是风龙领最具特色的一条；「增设群星局」建立情报与监察机构；「“黑土之术”」指向农业与土地。\n\n§Y二、外交§!\n「是友非敌」为结盟线；「远交近攻」为扩张线；「凛冬已至」「白浪滔天」为外部压力下的应急走向。\n\n§Y三、杂项§!\n「平凡的一天？」「澡盆战争」为剧情向的小型支线，不影响大局，但会提供额外的事件与奖励。\n\n§Y提示：§!该势力内容尚不完整，建议在熟悉主国剧本后再行尝试。"
DOT_INTRO_NOW_KQP:0 "§Y一、玉衡星的决断§!\n刻晴以玉衡星之身组建革命委员会，公开主张废除七星旧制、以人治取代神治。她把启明主义从码头与工棚里的议论，变成了一个政权的主张，这是璃月三千年来从未有过的事。\n\n§Y二、手中有什么§!\n委员会掌握着璃月港的工业与工人组织，控制着黑岩厂与部分码头，动员能力远胜旧官僚。但财政依赖港口的短期税收，海军几乎为零，粮秣要向外地采买。\n\n§Y三、四面皆敌§!\n天权星凝光视其为叛乱，月海亭八省联盟视其为破坏者，三眼五显仙人视其为背弃契约的僭越者。委员会若不能在内战初期打出决定性的胜利，就会被三方合力绞杀。\n\n§R结论：革命没有退路，只有前进或者被消灭。§!"
DOT_INTRO_WAY_KQP:0 "§Y一、共和国之晨§!\n以革命委员会为核心重建璃月，废七星、立共和，走§R红色§!路线。核心是土地、工厂与军队的同步改造。\n\n§Y二、黎明檄文§!\n以宣传与动员先行，把革命扩散到璃月全境乃至提瓦特其它国家，走§R红色§!的对外输出路线。\n\n§Y三、与谁开战§!\n先打天权（夺港）、先打月海亭（夺官僚体系）、还是先打仙人（夺正统性），三种顺序对应三种完全不同的战争节奏。\n\n§Y提示：§!革命委员会与仙人线的冲突不可调和，与月海亭则存在谈判空间。"
DOT_INTRO_NOW_GYP:0 "§Y一、旧秩序的守夜人§!\n甘雨与月海亭八省，是璃月真正在运转的那套机器：文书、税册、驿传、讼狱，全靠八省维持。帝君退隐之后，这套机器成了唯一还能把璃月拢在一起的东西。\n\n§Y二、难处§!\n八省既无兵权，也无独立财源，一切都要在七星的许可下行事。刻晴要革命，凝光要集权，仙人要神治，八省只能在三者之间腾挪。\n\n§Y三、底牌§!\n八省真正掌握的是“日常”：谁都知道换掉八省，璃月第二天就会停摆。这份不可替代性，是它唯一的武器。\n\n§R结论：月海亭不求赢，只求在所有人打完之前，璃月还站着。§!"
DOT_INTRO_WAY_GYP:0 "§Y一、月海秉政§!\n以八省为核心接管政务，走§C蓝色§!的渐进改革：先把税制、吏治、教育理顺，再谈体制。\n\n§Y二、月海新章§!\n以立宪与议事程序重新定义璃月的权力结构，走§C蓝色§!的宪政路线，需要与七星中的温和派合作。\n\n§Y三、夹缝求存§!\n在革命委员会、天权与仙人三方之间选边或周旋：援助哪一方、牵制哪一方、何时保持中立，直接决定八省能否活到最后。\n\n§Y提示：§!八省没有军事优势，任何正面战都是下策。"
DOT_INTRO_NOW_SHP:0 "§Y一、仙人的不满§!\n三眼五显自帝君立契以来便守护璃月。在他们看来，契约的效力来自神与仙的见证，而不是凡人的多数决。帝君退隐、七星秉政、刻晴倡人治，每一步都在削去契约的神圣性。\n\n§Y二、出山§!\n申鹤领众仙出山。仙家之力依旧是璃月最锋利的兵器，但仙人不擅治民、不谙商贾、不通外交，一旦真的执政，问题才刚开始。\n\n§Y三、敌友§!\n仙人视革命委员会为僭越，视月海亭为软弱，视天权为僭称。唯一的共同点是：三眼五显从不对凡人解释自己。\n\n§R结论：仙人可以守住璃月，却未必能治理璃月。§!"
DOT_INTRO_WAY_SHP:0 "§Y一、孤鹤出云§!\n仙人入世，以神治取代人治，走§Y尘世主义§!路线，重建以契约为核心的旧秩序。\n\n§Y二、孤鹤临朝§!\n仙人直接临朝秉政，把璃月变成神与仙共治之国，走§Y尘世主义§!的强硬版本，与凡人政治彻底决裂。\n\n§Y三、仙凡之间§!\n保留凡人官僚、以仙人监国，是一条折中路线。它能让璃月迅速稳定，但会让仙人与凡人都不满意。\n\n§Y提示：§!仙人线与革命委员会线互斥到底，一旦开战无法和谈。"
DOT_INTRO_NOW_CYG:0 "§Y一、茶与玉的谷地§!\n沉玉谷以翘英庄的茶与山间的玉为业，数百年来向璃月港输税纳贡。谷中人不缺生计，缺的是说话的位置：税则由港口定，路权由商会掌，连修一条山道都要看月海亭的脸色。\n\n§Y二、乱世的机会§!\n七星内斗、仙人出山、刻晴革命，璃月港已无暇西顾。沉玉谷第一次发现自己可以不交那份税。\n\n§Y三、代价§!\n自立意味着断绝与港口的商路。茶叶卖不出去，玉也换不来粮。谷中长老对此争论不休。\n\n§R结论：沉玉谷要决定，是继续做一个富庶的县，还是做一个贫穷的国。§!"
DOT_INTRO_WAY_CYG:0 "§Y一、沉玉自立§!\n宣布脱离璃月，走§Y尘世主义§!路线，以山谷为界自成一国，靠茶马与山路维持独立。\n\n§Y二、以商立国§!\n不宣独立，但把商路与关税抓在自己手里，用经济手段换取事实上的自治。\n\n§Y三、择主而事§!\n在革命委员会与月海亭之间选边，用政治站队换取战后的地位。\n\n§Y提示：§!沉玉谷体量小，任何一条路线都要先解决粮食与军备。"
DOT_INTRO_NOW_YLH:0 "§Y一、扼住港口的水道§!\n云来海是璃月港的门户：进出港的商船、南来北往的货栈、见不得光的走私，都要经过这片水域。谁控制云来海，谁就掐着璃月贸易的咽喉。\n\n§Y二、地方势力的算盘§!\n本地豪强与船帮在这里经营多年，既不属七星，也不服月海亭。乱世一起，他们立刻意识到：与其等着被别人收编，不如自己挂旗。\n\n§Y三、外来的诱惑§!\n至冬的商人与愚人众都愿意出高价，换取云来海的通行与泊位。钱来得快，绳子也套得快。\n\n§R结论：云来海的旗子换不换，只看价钱和时机。§!"
DOT_INTRO_WAY_YLH:0 "§Y一、云来换旗§!\n以地方势力取代七星在云来海的治权，走§8威权§!路线，靠关税、船队与港口立足。\n\n§Y二、引外力入局§!\n与至冬或其它外部势力合作，换取军舰与贷款，代价是港口主权。\n\n§Y三、骑墙取利§!\n同时向革命委员会、天权与月海亭出售通行权，谁的价钱高就帮谁，直到局势明朗再选边。\n\n§Y提示：§!云来海无纵深，一旦被封锁就必须速战速决。"
DOT_INTRO_NOW_SAN:0 "§Y一、海祇的孤岛§!\n珊瑚宫领海祇岛，土地贫瘠、人口稠密，世代靠渔与盐为生。眼狩令推行后，岛上持有神之眼者接连被夺，怨气终于化为刀兵。§8海祇虔诚§!让全岛愿意为心海赴死，§8智计百出§!让她能把这份意志变成战术。\n\n§Y二、邪眼的代价§!\n反抗军能撑到今天，靠的是愚人众提供的邪眼。§8邪眼的代价§!不是抽象的名词：每一个使用者都在用寿命换取力量，一批批战士在胜利之后悄无声息地死去。\n\n§Y三、八酝岛的错§!\n攻入八酝岛后，部分狂热者破坏了镇压祟神的镇物。祟神之力外泄，稻妻全境受害，反抗军的攻势也为之中断，幕府得以喘息重整。\n\n§R结论：珊瑚宫已经赢过一次，但赢的方式正在毁掉它想保护的一切。§!"
DOT_INTRO_WAY_SAN:0 "§Y一、反抗的开端§!\n从动员海祇民兵、建立珊瑚宫本部开始，把岛屿的宗教权威转化为军政组织，是全部路线的基础。\n\n§Y二、统一之晓§!\n推翻幕府、统一稻妻全境，是珊瑚宫的最终目标。此线要同时处理三奉行残余、幕府旧臣与祟神污染。\n\n§Y三、停战与和议§!\n以废除眼狩令为条件与幕府谈判，换取海祇的事实自治。此线保存实力，但会失去部分追随者。\n\n§Y四、邪眼的选择§!\n继续依赖邪眼可以快速补充战力，但代价是全军寿命；戒断邪眼则要承受漫长的战力真空期。\n\n§Y提示：§!珊瑚宫的一切路线都以“海祇人能否活下去”为底线。"
DOT_INTRO_NOW_VAN:0 "§Y一、梦中的国度§!\n桓那兰那在兰那罗的歌声里生长，森林记得每一个来过的人。§8玛哈桓那兰那薜那§!维系着这片梦境般的地界，让兰那罗得以在人类的夹缝中存续。\n\n§Y二、无留陀§!\n§8无留陀的灾难§!：被污染的土地不断扩张，梦也不再安全。兰那罗能做的只有延缓，无法根治。\n\n§Y三、不善政治§!\n§8不善政治§!不是谦辞。兰那罗不懂人类的契约、税赋与外交，在须弥的棋局里，它们几乎注定被牺牲。\n\n§R结论：森林会记得，但森林不会替谁打仗。§!"
DOT_INTRO_WAY_VAN:0 "§Y一、兰拉娜的求助§!\n接受兰那罗的请求，介入须弥的人间事务，是全部路线的开端。\n\n§Y二、山雨欲来§!\n面对教令院、沙漠与愚人众的三方压力，选择固守森林、还是向外结盟。\n\n§Y三、发展与军备§!\n「发展工业」「军队建设」两条线让兰那罗摆脱单纯的守势，但要付出森林被改造的代价。\n\n§Y四、兰那罗主义§!\n一条以种族认同为核心、排斥人类干涉的极端路线，在意识形态上属于§8刑鼎主义§!一类，与温和路线互斥。\n\n§Y提示：§!兰那罗的路线分歧在于“是否与人类共存”。"
DOT_INTRO_NOW_SGD:0 "§Y一、镀金旅团的砂原§!\n饰金砂原是沙漠中最富庶的一块：商路穿行、遗迹遍布、旅团林立。这里的人不认教令院的法令，只认契约、部族与刀。\n\n§Y二、赤王的记忆§!\n赤王逝去千年，沙漠的繁华也随之落幕。但“赤王须弥”的口号从未消失，反而在雨林压迫加深时一次次被重新点燃。\n\n§Y三、处境§!\n旅团各自为政，部族彼此仇杀，商路被劫，绿洲萎缩。沙漠有反抗的意志，却没有统一的力量。\n\n§R结论：沙漠缺的不是勇气，是能把所有人拢到一起的那个名字。§!"
DOT_INTRO_WAY_SGD:0 "§Y一、赤王的旗§!\n以复兴赤王旧统为号召，走§8强硬§!路线，把所有部落与旅团纳入同一面旗。\n\n§Y二、旅团公议§!\n以旅团与部族的公议取代王权，走共和路线，松散但不易崩解。\n\n§Y三、主母的权柄§!\n由女性长老集团掌权，走部族传统与神权结合的路线。\n\n§Y四、兵向雨林§!\n以战争解决雨林与沙漠的旧账，是对外扩张最直接也最危险的一条。\n\n§Y五、沙与林§!\n与雨林和解，承认彼此平等，是唯一不需要流血的路线，但需要双方都让出利益。\n\n§Y提示：§!沙漠三地的路线高度重叠，与雨林势力的关系是全局关键。"
DOT_INTRO_NOW_SDH:0 "§Y一、千壑的荒原§!\n千壑沙地是沙漠中最贫瘠的一块：风蚀的峡谷、废弃的村落、干涸的河床。这里的部落以畜牧与劫掠为生，人口稀少而性情强悍。\n\n§Y二、被遗忘的人§!\n教令院的地图上，这里几乎是一片空白。没有赋税，也就没有治理；没有治理，也就没有人管他们的死活。\n\n§Y三、聚集§!\n正因如此，逃亡者、失地者、被雨林驱逐的人不断汇聚到这里。荒原正在变成一个谁也管不了的火药桶。\n\n§R结论：千壑沙地没有可失去的东西，所以它什么都敢做。§!"
DOT_INTRO_WAY_SDH:0 "§Y一、漫长的独立路§!\n以游牧与山地作战拖垮任何占领者，走长期独立路线，见效最慢但最难被消灭。\n\n§Y二、赤王的旗§!\n与饰金砂原合流，共举赤王旧统，换取统一沙漠的可能。\n\n§Y三、部族公议§!\n以各部落公议维持松散联盟，避免被任何一方吞并。\n\n§Y四、沙海商路的算盘§!\n以劫掠转向护商，用商路收入换取生存空间，是最务实的一条。\n\n§Y提示：§!千壑沙地资源贫瘠，任何扩张都必须先解决补给。"
DOT_INTRO_NOW_SGS:0 "§Y一、沙海之带§!\n苍漠囿土位于沙漠的边缘地带，是雨林与沙海之间的过渡。这里有绿洲，也有废墟；有定居的农户，也有流动的旅团。\n\n§Y二、两边的压力§!\n雨林视这里为缓冲，沙漠视这里为通道。无论哪一方要动手，第一步都是先控制这片地带。\n\n§Y三、可用的本钱§!\n绿洲的农业、往来的商队、以及遗迹中残存的赤王时代技术，是苍漠囿土唯一能拿去谈判的筹码。\n\n§R结论：处在通道上的国家，要么被踩过去，要么收过路费。§!"
DOT_INTRO_WAY_SGS:0 "§Y一、沙与林§!\n充当雨林与沙漠的调停者，以和解换取中立地位，是收益最稳的一条。\n\n§Y二、沙海商路的算盘§!\n把通道变成生意，以关税与转运立国。\n\n§Y三、藩属之影§!\n依附雨林或沙漠中的一方，换取保护，代价是主权。\n\n§Y四、赤王的旗§!\n加入沙漠统一运动，放弃独立地位换取战后的位置。\n\n§Y提示：§!苍漠囿土体量有限，独立路线需要极强的手腕。"
DOT_INTRO_NOW_ABY:0 "§Y一、深渊的教团§!\n深渊教团以坎瑞亚遗民为核心，在提瓦特各地潜伏、渗透、策动。它的目标从来不是占领土地，而是撕开帷幕，让深渊重新回到这个世界。\n\n§Y二、力量与代价§!\n深渊之力可以迅速造就强者，也可以迅速毁掉一个人。教团内部对此毫不在意，在他们看来，个体本来就不重要。\n\n§Y三、当前状态§!\n教团在各地扶植代理人，与愚人众既合作又互相提防。它真正的底牌不在战场上，而在那些还愿意相信它的人心里。\n\n§R结论：深渊不急于取胜，它只等世界自己裂开。§!"
DOT_INTRO_WAY_ABY:0 "§Y当前完成度§!\n深渊教团目前没有独立的国策树，游戏内主要通过事件、通用国策与特殊决议推进，可玩内容有限。\n\n§Y一、可行方向§!\n依靠渗透与代理人扩张影响力，通过事件链在各国制造动乱，等待时机成熟再公开现身。\n\n§Y二、与其他势力的关系§!\n与愚人众是互相利用的关系，与天理是不死不休的关系，与各国则是纯粹的破坏者。\n\n§Y提示：§!该势力尚在制作中，暂不建议作为首局体验。"
DOT_INTRO_NOW_PRI:0 "§Y一、沉睡的秩序§!\n天理维系着提瓦特的法则：七神各守其土，元素各归其位，凡人的僭越受到制约。§8沉睡的天理§!并不意味着秩序消失，只意味着它暂时不再亲自出手。\n\n§Y二、黎明的倒计时§!\n§8黎明§!：天理体系正在走向一个不可逆的节点。坎瑞亚之乱留下的裂痕没有愈合，深渊在扩张，七国的力量此消彼长，而维系这一切的那只手已经很久没有动过。\n\n§Y三、处境§!\n天理不靠外交、不靠贸易、不靠民意，它靠的是规则本身。可一旦有人证明规则可以被打破，这份力量就会迅速流失。\n\n§R结论：天理要么醒来，要么被取代。§!"
DOT_INTRO_WAY_PRI:0 "§Y一、尘星旅梦§!\n天理体系的自我延续线：以既有法则重整七国秩序，压制深渊与僭越，走§Y尘世主义§!的绝对版本。\n\n§Y二、谢幕§!\n天理体系主动终结的路线：承认旧秩序已经完成使命，把世界交还给凡人，是全部路线中最特殊的一条。\n\n§Y三、与七国的关系§!\n天理不参与常规外交，其行动通过神选、神谕与规则制裁体现，因此每一步都会牵动全图局势。\n\n§Y提示：§!天理的可玩内容偏向后期与终局，不建议作为首局体验。"
DOT_INTRO_NOW_HIL:0 "§Y一、被当作怪物的族群§!\n丘丘人散居在提瓦特的荒野与遗迹之间，被各国当作魔物清剿。他们没有文字，没有国家，也从未有人认真问过他们从哪来、想要什么。\n\n§Y二、部落的联合§!\n丘丘部落联盟是极少数尝试把散居部落拢到一起的努力。萨满、战士、猎手各有话语权，联盟本身松散而脆弱。\n\n§Y三、处境§!\n四面皆敌。无论七国之间怎么打，清剿丘丘人都是他们唯一能达成共识的事。\n\n§R结论：这个联盟要活下去，就得先证明自己不是怪物。§!"
DOT_INTRO_WAY_HIL:0 "§Y当前完成度§!\n丘丘部落联盟目前没有独立的国策树，游戏内主要依靠事件与通用国策推进。\n\n§Y一、可行方向§!\n统一各部落、建立初步的军事与祭祀体系、在七国的夹缝间寻找盟友或附庸对象。\n\n§Y二、外部关系§!\n深渊教团会试图拉拢丘丘人；七国则多半选择清剿。任何外交突破都要付出极高代价。\n\n§Y提示：§!该势力尚在制作中，暂不建议作为首局体验。"

