 #### 民族精神 ####
 SUM_SGS_I_Pari_Vigil:"花灵的守望"
 SUM_SGS_I_Pari_Vigil_desc:"花灵守着沙丘腰带，已不知几百年的光阴。她们看护的，是新生与死亡的交界：孩子在沙里落地，老人归于黄沙，都有她们在旁。端的把生死两头，守得稳稳当当。"
 SUM_SGS_I_Suzerain_Edict:"敕令在驿"
 SUM_SGS_I_Suzerain_Edict_desc:"雨林的敕令，一卷卷送到沙丘的水驿上。纸上写的，无非赋税如何征，商路如何管，条条都要沙丘照办。端的把别人的规矩，硬往自家头上套，端的叫人不服。"
 SUM_SGS_I_Jinn_Scripture:"矫论团的经卷"
 SUM_SGS_I_Jinn_Scripture_desc:"矫论团守着经书，也守着商道与水驿。经义讲起来并不深奥，可真要照着去做，却处处犯难。知易行难，端的应了那句：说得容易，做时难。"
 SUM_SGS_I_Hall_of_Mystery:"圣显厅"
 SUM_SGS_I_Hall_of_Mystery_desc:"沙下埋着一座圣显厅，厅里藏着法度与图样。那些图样勾着人心，引着一批又一批人往沙里钻。有人为求学问，有人为寻宝贝，端的把这座旧厅，变成了沙海的谜。"
 SUM_SGS_I_Dune_Route:"沙丘商道"
 SUM_SGS_I_Dune_Route_desc:"商道沿着沙丘的脊背蜿蜒而行。白日里日头毒，商队便歇着；一到夜里，方才赶路。这昼伏夜行的法子，端的养活了半条商道，也养活了沿途多少人。"
 SUM_SGS_I_Scarce_Water:"水驿之限"
 SUM_SGS_I_Scarce_Water_desc:"水驿里的水，一概由矫论团掌管。谁来取水，都要在册上记一笔，取了多少，几时取的，写得明白。在这沙海之中，水端的比盐还金贵。有水便有命，端的谁也不敢糟蹋。"
 SUM_SGS_I_Sacred_Beasts:"沙海圣骸"
 SUM_SGS_I_Sacred_Beasts_desc:"沙里偶尔掘出圣骸兽的遗骨，一截白骨埋在沙中。捡到的人多半不肯留，转手卖与行商，换几袋摩拉。端的把前朝的旧物，换成了活人的营生。端的巧妙。"
 SUM_SGS_I_Merchant_Word:"商户的话"
 SUM_SGS_I_Merchant_Word_desc:"沙丘地带，有几家大商户说话极有分量。他们点头的事，办起来便快；他们皱眉的事，多半要黄。端的因着这几张嘴，沙丘的买卖才转得动。连那官府办事，也要先问他们一声。"
 SUM_SGS_I_Jinn_Alliance:"灵人之盟"
 SUM_SGS_I_Jinn_Alliance_desc:"花灵与矫论团结成盟约，端的立下一条：凡人的事，由凡人自己定。花灵只在旁看着，不再替人拿主意。这一盟一立，沙丘腰带的众人，从此挺直了腰杆。有分教：凡人自立，花灵只在旁看着。"
 SUM_SGS_I_Independent_Flag:"独立的灵光旗"
 SUM_SGS_I_Independent_Flag_desc:"灵光纹样的旗，立在了各处水驿的旗杆上。风一吹，猎猎作响，远远望去便知是沙丘的地界。这旗一端起来，端的表明沙丘从此自己说了算。端的连远来的商队，也认得这面旗。"
 SUM_SGS_I_Light_Commonwealth:"灵光之邦"
 SUM_SGS_I_Light_Commonwealth_desc:"沙丘腰带的规矩，端的简明：事由人定，花灵只在旁陪着；愿由人许，代价也由人自己担。各安其位，不越边界，端的把凡人与花灵的名分，分得清清楚楚。"
 SUM_SGS_I_Pari_Teacher:"花灵为师"
 SUM_SGS_I_Pari_Teacher_desc:"花灵教凡人本事，只教三样：看星，看水，看沙。她们从不把答案直接说出，只教人怎么去看，怎么去问。学会了这三样，遇事便能自己去寻答案。"
 SUM_SGS_I_Light_Guard:"灵光守军"
 SUM_SGS_I_Light_Guard_desc:"沙丘军团的旗上，绣着一圈圈灵光纹样。这队伍端的古怪，别家怕风沙，他们偏在风沙天里站得最稳。风越大，阵越整，端的把灵光旗守得纹丝不动。"
 SUM_SGS_I_Scholar_Republic:"学者共和"
 SUM_SGS_I_Scholar_Republic_desc:"沙丘的城邦，立下了宪章。执事不是上面派的，是众人公推的；律例不是一人定的，是大家共议的。端的把规矩，交到了众人自己手里。端的把一城的事，交还了一城的人。"
 SUM_SGS_I_Open_Scripture:"经卷公开"
 SUM_SGS_I_Open_Scripture_desc:"矫论团把经卷抄了好多份，一份份分发到各处水驿。识字的读了，再念给不识字的听。端的把一部经书，撒到了每条商道上。端的连不识字的，也能听上几段，把道理记在心里。"
 SUM_SGS_I_Dune_Commune:"沙丘公产"
 SUM_SGS_I_Dune_Commune_desc:"沙丘的水驿与井，一概归了公。田地合在一处耕种，收成按各人出的工分。多劳多得，少劳少得，端的公道，没人再有怨言。端的谁出多少力，众人眼里都看着，偷懒不得。"
 SUM_SGS_I_Sand_Throne:"沙王再临"
 SUM_SGS_I_Sand_Throne_desc:"沙丘的法度，承的是赤王留下的旧制。这一来，规矩便有了出处，名分便有了源头，不是凭空捏造。端的叫人心服：咱们的规矩，古已有之。端的不是空口自称，件件都有来历。"
 SUM_SGS_I_Mech_Corps:"厅中构装"
 SUM_SGS_I_Mech_Corps_desc:"圣显厅里挖出的构装，修好之后竟能走能动。沙丘的人给它装上兵器，一列排开，便成了一支队伍。端的把古人的旧物，变成了今日的奇兵。端的连雨林那边，听了也觉稀罕。"
 SUM_SGS_I_State_Rite:"国祀"
 SUM_SGS_I_State_Rite_desc:"灵光之礼，如今升做了国祀。年年到了时候，众人便聚在圣显厅外，点烛行礼，端的郑重其事。这一礼既立，沙丘便有了自家的祭祀。端的年年如此，从不间断。"
 SUM_SGS_I_Old_Dune:"旧制照行"
 SUM_SGS_I_Old_Dune_desc:"沙丘立规矩，旧例能留的都留了下来，只在外头多加一层公议的过场。凡事众人再商量一遍，方才定夺。端的既不丢了老传统，又添了新规矩。端的巧妙。"
 SUM_SGS_I_Foreign_Hand:"外邦的手"
 SUM_SGS_I_Foreign_Hand_desc:"北国派来使团，说愿意出钱替沙丘修水驿。可他们附带的条件，是要在商道上设一处自家驿站。端的黄鼠狼给鸡拜年，沙丘的人心里雪亮，当面敷衍，背后早有了主意。"

 #### 等级 / 共振 ####
 SUM_Neo_SGS_T1:"一档：灵光将熄"
 SUM_Neo_SGS_T1_desc:"一档灵光将熄。花灵闭口不言，问也不答，圣显厅外头空落落的，只有风卷着沙打门。看守的老者每日照旧去拂一遍石阶，拂完坐在阶上发怔，等到天黑才回。"
 SUM_Neo_SGS_T2:"二档：灵光零星"
 SUM_Neo_SGS_T2_desc:"二档灵光零星。几处水驿还留着灯，灯下备着水与草料，过往的人却少。偶尔有个把旅人推门进来，问一句花灵还应不应，掌柜的只摆手。夜里的灯，多半是白点的。"
 SUM_Neo_SGS_T3:"三档：灵光渐明"
 SUM_Neo_SGS_T3_desc:"三档上，灵光渐明。花灵开口了，说话慢，一句一句地教人认路、认草、认水。它只与人同行，不替人走，脚步还是得自己迈。听的人起初将信将疑，走过两回便不吭声了。"
 SUM_Neo_SGS_T4:"四档：灵光同契"
 SUM_Neo_SGS_T4_desc:"四档灵光同契。人跟花灵立了约，白纸黑字，写得明白：人出力，灵出光，谁也不能赖。遇事一同商议，出了差池各担其责。立约那日，圣显厅外站满了人。"
 SUM_Neo_SGS_T5:"五档：灵光共明"
 SUM_Neo_SGS_T5_desc:"五档灵光共明。沙丘腰带的规矩不再刻在石上，改由人与花灵一处商议，愿许了才算数。谁不肯许，也没人硬逼，只是众人的路他走不进去。灵光遍照，人心也就齐了。"
 SUM_Neo_SGS_U1:"一档：厅门深锁"
 SUM_Neo_SGS_U1_desc:"一档厅门深锁。圣显厅里的法度与图样，堆在架上落灰，没人读得懂。几件构装散在廊下，缺胳膊少腿，也没人会修。钥匙挂在老看守腰上，他每日去锁前站一站，只锁不启。"
 SUM_Neo_SGS_U2:"二档：零星释读"
 SUM_Neo_SGS_U2_desc:"二档零星释读。有几个老书生认得古文字，凑在一处逐字地抠，抠出来的多是陈年旧规。念给旁人听，听的人打哈欠。可就是这几个人，日后成了沙丘的宝贝。"
 SUM_Neo_SGS_U3:"三档：厅门半开"
 SUM_Neo_SGS_U3_desc:"三档一到，厅门半开。三块石板拼到一处，纹路对上了，旧法便能读通大半。读书的人点着灯熬了几夜，读到要紧处拍案叫好，又不敢大声。看守的钥匙也松了手。"
 SUM_Neo_SGS_U4:"四档：旧法成册"
 SUM_Neo_SGS_U4_desc:"四档旧法成册。圣显厅里的条文一条条抄下来，订成一册，放在案头。遇着争水、争地、争牲口，翻开一查，竟与今日的事对得上。老书生们说，祖宗的法子没过时。"
 SUM_Neo_SGS_U5:"五档：厅门全开"
 SUM_Neo_SGS_U5_desc:"五档厅门全开。圣显厅的构装尽数修好，站在廊下听人使唤，法度也一条条用在今日的沙丘上。修构装的匠人、读旧法的书生，都在厅里有了一席。这厅门一开，沙丘的底气便不同了。"
 SUM_Neo_SGS_Combo_HH:"灵法并明"
 SUM_Neo_SGS_Combo_HH_desc:"灵光与人同行，旧法为今用。沙丘腰带这一回两样都齐了：人肯出力，灵肯照路，厅里的旧法抄成册压在案头。有了共识，也有了法度，遇事先讲，讲不通再翻册子。"
 SUM_Neo_SGS_Combo_LL:"灵光暗、厅门锁"
 SUM_Neo_SGS_Combo_LL_desc:"花灵闭口，旧法不读。沙丘腰带又退回各城自守的老路，城与城之间不通报，井水各吃各的。厅门重新上了锁，钥匙压在箱底。有人问起从前那点灵光，年长的只摆手，说莫提了。"
 SUM_Neo_SGS_Combo_AH:"灵光独明"
 SUM_Neo_SGS_Combo_AH_desc:"这一档，灵光压过了旧法。遇事不再翻册子，先问花灵，问明白了众人点头，便算定规。旧法还挂在厅里，落着灰，没人去动。老书生心里不痛快，可也说不出什么来。"
 SUM_Neo_SGS_Combo_BH:"旧法当行"
 SUM_Neo_SGS_Combo_BH_desc:"圣显厅的旧法压过灵光。沙丘的事，一桩桩照旧典的条目来办，翻到第几条便办第几条，谁也不许多嘴。花灵的光还亮着，只是没人去问。法度太密，人心便疏。"

 #### 新闻 ####
 SUM_Neo_SGS_News.1.t:"水驿的敕令"
 SUM_Neo_SGS_News.1.d:"教令院的敕令送到水驿那一日，日头正毒。信使一路风尘，衣摆上全是沙，捧着卷轴在驿门口报了名号。矫论团的人出来接了，也不请他进去坐，就站在檐下把卷轴打开。那敕令写得客气，字是极工整的，一行一行，无非叫沙丘安分守己，莫生事端，末尾还许了几样好处，说是体恤边民。看的人从头看到尾，又倒回去看了一眼落款，随即把卷轴卷起来，原样递回信使手里，说了声有劳。信使站着不走，说上头还有一句口信。接的人道，口信就不必了，纸上写的，我们都看见了。檐下的风把纸角吹得直响。信使把卷轴抱紧，退了两步，才转身下阶。一卷文书最怕的不是被撕了，是被原封不动退回来。"
 SUM_Neo_SGS_News.1.a:"阅"
 SUM_Neo_SGS_News.2.t:"灵光节"
 SUM_Neo_SGS_News.2.d:"灵光节那一夜，圣显厅外摆开了长长一片烛火。来的人各带一支蜡烛，有拿在手里的，有插在沙堆上的，也有用破碗罩着挡风的。圣显厅的台阶上积着沙，人一级一级往上坐，坐到半夜，台阶上坐满了，后来的便站在沙里。风从沙丘那边刮过来，一阵紧似一阵，烛火弯下腰去，眼看要灭，又直起来。有个孩子伸手去护，被烫了一下，缩回手，又去护。有个老太太把蜡烛递给身旁的年轻人，说你替我举着，我眼花了，看不清火。守夜的人来回走动，见哪支火弱了，便把自己手里的凑过去点一点。火光连成一片，照得厅前的石柱一明一暗。烛油滴在台阶上，凝成一小片一小片的白。一支烛不算什么，一片烛就成了气候。"
 SUM_Neo_SGS_News.2.a:"阅"
 SUM_Neo_SGS_News.3.t:"沙下的厅"
 SUM_Neo_SGS_News.3.d:"圣显厅的入口，被沙埋了不知多少年。沙丘腰带张了告示，招募人手去清沙。来的人不带工钱，自带筐与铲，天不亮就动手。沙子是活的，白天挖开，夜里风一吹又填回去半截，众人便想出法子，用草席在两边立起挡墙，一层一层往里掘。掘到第三日，铲子碰着硬东西，扒开一看，是石阶。石阶一级一级往下，每一级都比人还高，台阶上刻着细密的花纹，被沙磨得只余轮廓。有人摸着那花纹，半天不言语，末了把手在衣襟上擦了又擦。管事的人叫众人在阶梯上坐了半日，谁也没说开工。有人提议把石阶刷洗干净，管事的摇头，说沙留着，让人知道这地方是怎么回来的。把埋了的东西挖出来，人心里那点旧事也跟着出来了。"
 SUM_Neo_SGS_News.3.a:"阅"
 SUM_Neo_SGS_News.4.t:"商道改道"
 SUM_Neo_SGS_News.4.d:"商道旁又添了一处税卡。新卡立在一处窄口上，木杆横着，杆后头坐两个收钱的，见驮队来便伸手。第一日还算有些进项，第二日便少了，第三日连人影也不见。原来驮队早有旧路，绕过一道沙梁，多走半日，脚程虽远，钱却省下来了。有不信邪的偏走新卡，交了钱，回来一算，比绕路还亏，第二趟便也改了道。有个老驮夫蹲在井边啃饼，说这卡立得蹊跷，怕不是收钱的，是看人的。众人问看什么人。老驮夫不答，只把缰绳一抖，牵着骆驼走了。收钱的人坐了三日，晒得脸黑，末了自己也笑了，说这卡立在这里，是给沙子看的。新卡后来撤了，木杆扔在沙里，被孩子们抬去当马骑。路是人走出来的，卡也是人绕过去的。那条新路上，从此只余两道空车辙。"
 SUM_Neo_SGS_News.4.a:"阅"
 SUM_Neo_SGS_News.5.t:"还回的敕令"
 SUM_Neo_SGS_News.5.d:"那敕令当众退回去之后，信使还捧着卷轴站在水驿门口。日头从头顶挪到西边，影子从脚下拉长，他还站着。驿里的人进出，都从他身边过，谁也不看他一眼。守驿的老卒出来扫沙，扫到他脚边，停了一停，也没说话，又往别处扫去。有个挑水的后生看不下去，端了一碗水出来，放在他脚边，没说话便走了。信使看了看那碗水，没喝，仍旧捧着卷轴。日头落尽，驿门口的灯一盏一盏亮起来，他才慢慢转过身，一步一步往东去，走几步回头看一眼，看那灯是不是还亮着。夜里风大，他把卷轴抱在怀里，怕沙打湿了封泥。他到东边交差，只说了一句：他们没收。捧着一卷没人接的文书，那份难堪比挨打还重。"
 SUM_Neo_SGS_News.5.a:"阅"
 SUM_Neo_SGS_News.6.t:"灵光旗"
 SUM_Neo_SGS_News.6.d:"水驿那一日升旗，来的人比往常多。旗是新缝的，灵光纹样用白线绣在赭色布上，绳子一拉，旗便升上去，升到杆顶，风把它撑开，纹样清清楚楚。众人都往台上看，看花灵来了没有。等了半晌，台上空着，有人开始交头接耳。正疑惑间，一只风鸟从沙丘那头飞来，绕着旗杆转了两圈，落下一片羽毛，羽毛是极淡的青白色，落在旗杆脚下的沙上。有个老者弯腰拾起，捧在掌心给众人看。有个年轻人问，花灵是不是恼了。老者摇头，说它把话都放在这片羽毛上了。众人便不再言语，只把帽子摘下。那羽毛后来收在一只木匣里，摆在驿中的案上。旗在杆上响了一夜。来与不来，有时候一片羽毛便够了。"
 SUM_Neo_SGS_News.6.a:"阅"
 SUM_Neo_SGS_News.7.t:"沙丘守军"
 SUM_Neo_SGS_News.7.d:"沙丘腰带把三路人编作一支。一路是护商道的，常年跟着驮队走，识得每一处水窝；一路是守泉的，几代人守着一口井，井边的事比自家的事还清楚；一路是各乡的乡兵，农闲操练，农忙归田，刀是自己打的。三路人凑到一处，先在场上比了一回，护路的跑得快，守泉的耐得住，乡兵出手狠，谁也不服谁。管事的不劝，只把名册摊在长案上，一栏一栏填，填到旗号时，众人议了半日，末了定了灵光纹样，请人绣在旗上。名册抄成两本，一本留在水驿，一本随军带着，抄的书吏写到半夜，灯油添了三回。有个守泉的老兵摸着旗角说，我这辈子守着那口井，如今守的是一条线。散着的时候各顾各，编到一处便成了一支军。"
 SUM_Neo_SGS_News.7.a:"阅"
 SUM_Neo_SGS_News.8.t:"花灵开口"
 SUM_Neo_SGS_News.8.d:"花灵开口那一日，没有鼓乐，也没有仪仗。它立在水驿外的沙丘上，身形淡得像一层雾，众人不敢近前，只远远围了半圈。半晌，它开口了，声音不高，风一过便散，可站在最外头的人也听得清清楚楚。它说的是：你们的事，你们自己定。说完便不再言语。围着的众人你望我，我望你，谁也没先开口。有个年轻后生忽然跪下去，磕了个头，起来时眼睛是红的。旁边一个老者伸手扶他，自己的手却在抖。有个妇人壮着胆子问，那我们从前听来的那些话，还作数么。花灵没有答，风把它的影子吹淡了。众人散去时，脚步都很轻。那日水驿的钟，从头到尾没有人去敲。一句放手的话，比十句指教还难接。此后水驿议事，主位空着，谁也没去坐。"
 SUM_Neo_SGS_News.8.a:"阅"
 SUM_Neo_SGS_News.9.t:"哨所易手"
 SUM_Neo_SGS_News.9.d:"雨林伸进沙丘的第一座哨所，这一日易了手。交接的时候没有动刀，两边的人在墙下列成两行，各报各的名号。哨所里原来的兵收拾了行囊，从东门出去，走的时候回头看了几眼。沙丘的人从南门进来，头一件事是上房换旗。旗换下来了，墙却一寸没拆，只把墙上的旧纹样用泥抹平。有个老兵摸着墙上的箭痕，说这些坑是去年打的。旁边的年轻人问，那要不要填了。老兵摆手，说留着罢，让人看看这墙挨过什么。墙根下有一口井，井栏是新砌的，雨林的人走时没有填，沙丘的人打了水，先给留下的守兵喝了一碗。墙头原挂着灯的钩子还在，没有人取下来。换了旗不拆墙，是给后来的人留个话头。"
 SUM_Neo_SGS_News.9.a:"阅"
 SUM_Neo_SGS_News.10.t:"沙丘东望"
 SUM_Neo_SGS_News.10.d:"沙丘腰带的军队出水驿那天，天刚亮，商道上的露水还没干。队伍一列一列往东开，驼铃响成一片，走在最前的是护路的，最后的是运水的车。驿门口站了些送的人，有老妇提着篮子，往兵士手里塞煮鸡蛋；有孩子跟着跑了一段，被大人拽回来。有个兵回头喊，等我回来，给你带须弥城的糖。他娘在门口应了一声，没抬头。队伍太长，走了半日才走完，扬起的沙把日头都遮了一层。队伍里有个随军的书吏，边走边跟旁人说，沿这条道走十天，就能望见须弥城的尖塔。旁人问，那你怕不怕。书吏想了想，说怕，可还是得走。商道两旁的沙丘上站着几个牧人，一直看到队伍没了影。路远不远，走起来才知道。"
 SUM_Neo_SGS_News.10.a:"阅"

