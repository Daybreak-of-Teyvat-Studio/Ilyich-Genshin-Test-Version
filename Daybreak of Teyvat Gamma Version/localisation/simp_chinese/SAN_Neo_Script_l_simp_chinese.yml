# 信息公示决议组（Item 4）
 SAN_PW_Info_Board:"珊瑚宫战后重要信息公示"
 SAN_PW_Info_Board_desc:"\n珊瑚宫战后重要信息公示\n\n此处汇总珊瑚宫此刻的核心机制数值，以及各轴当前等级所生效的国家修正。数值随国策、决议与事件即时变动，无需手动刷新，也不占用任何决议位，任何时刻都可以打开这里确认当下所处的等级。\n\n§Y御神威权：§![?SAN-Mandate-Index]\n§W[ SAN_PW_Mandate_Tier_tier_name]§!\n§G[ SAN_PW_Mandate_Tier_tier_mods]§!\n\n§Y白夜秘仪：§![?SAN-Deep-Index]\n§W[ SAN_PW_Deep_Tier_tier_name]§!\n§G[ SAN_PW_Deep_Tier_tier_mods]§!\n\n§Y共振：§!§W[ SAN_PW_Combo_combo_name]§!\n§G[ SAN_PW_Combo_combo_mods]§!\n\n两条轴各自决定一项国家修正，等级越高，修正越强。两条轴同时走高，还会额外触发一层共振修正，请注意同步推进。\n"
 SAN_sangonomiya_hq_spirit:"珊瑚宫大本营"
 SAN_sangonomiya_hq_spirit_desc:"大本营的旗子插在最中间那间屋子里，屋外是摊开的地图与排队等候的人。队伍从门口一直排到台阶下面，没人插队，也没人抱怨，因为谁都清楚，到这里来，为的是把事情办成。案头的文书来了又去，办成一件，门口的队伍便短一截；办不成的，也给人一个明明白白的回话。"

