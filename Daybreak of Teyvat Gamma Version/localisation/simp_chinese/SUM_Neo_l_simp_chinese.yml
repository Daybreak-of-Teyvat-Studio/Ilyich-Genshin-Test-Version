 SUM_Neo.278.t:"须弥全境"
 SUM_Neo.278.d:"须弥全境归于一纸图册。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。教令院的门槛这几天被踩得很低，进去的人比出来的人多。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
 SUM_Neo.278.a:"以武力压服"
 SUM_Neo.278.b:"以德政感召"
 SUM_Neo.279.t:"镀金契约"
 SUM_Neo.279.d:"教令院与镀金旅团重订契约，条款写得比从前更细。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。教令院的门槛这几天被踩得很低，进去的人比出来的人多。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。"
 SUM_Neo.279.a:"先立威"
 SUM_Neo.279.b:"先立信"
 SUM_Neo.280.t:"旅团国有化"
 SUM_Neo.280.d:"镀金旅团被编入须弥的序列。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。教令院的门槛这几天被踩得很低，进去的人比出来的人多。"
