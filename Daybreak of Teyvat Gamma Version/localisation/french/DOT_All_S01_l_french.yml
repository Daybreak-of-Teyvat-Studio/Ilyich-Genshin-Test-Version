  fishery_association:0 "Association de pêche du Lac des Cidres"
  mond_peoples_ship_maunufacturer:0 "Groupe naval du Peuple de Mondstadt"
  andrius_ship_trust:0 "Trust de l'industrie navale"
  andrius_aircraft_trust:0 "Trust de l'aéronautique"
  mond_peoples_aircraft_maunufacturer:0 "Groupe aéronautique du Peuple de Mondstadt"
  andrius_blacksmith_shop:0 "Nouvelle forge Wagner"
  mond_peoples_infantry_weapon_maunufacturer:0 "Groupe d'armement de l'Infanterie du Peuple de Mondstadt"
  andrius_infantry_weapon_trust:0 "Trust de l'armement"
  construction_union_of_wolfendom:0 "Syndicat des travaux de Wolvendom"
  mond_peoples_cons_and_reas_maunufacturer:0 "Groupe des travaux et recherches du Peuple de Mondstadt"
  ANR_cons_and_reas_konzern:0 "Konzern des travaux et recherches"

  simple_bicycle_workshop_desc:0 "Les fondateurs de l'atelier de vélos de Cécilia étaient des artisans ayant perçu le besoin de déplacements des habitants de Wolvendom après avoir mangé à leur faim. Après avoir inventé le vélo, leur produit a conquis tout Wolvendom, et même nos armées en achètent pour circuler sur des terrains accidentés. Aujourd'hui, on voit partout à Wolvendom des habitants chevauchant des vélos marqués de la fleur de Cécilia pour se divertir."
  andrius_truck_desc:0 "L'usine de camions Andrius est née du besoin de coopération entre les villages de Wolvendom. Ses camions brûlent de la résine pour relier toute notre chaîne de production, acheminer fruits, poissons et marchandises vers chaque village. En temps de guerre, ils transporteront vivres et munitions aux fronts ; certains seront modifiés en véhicules motorisés pour infiltrer les lignes ennemies."
  mond_peoples_truck_maunufacturer_desc:0 "Le Groupe de production de tracteurs du Peuple de Mondstadt est issu d'un atelier de réparation fondé par le gouvernement de Wolvendom. Au cours des guerres d'unification, il a appris à produire des tracteurs sans aide extérieure, allégeant le travail des paysans et accélérant les chantiers. Après l'unification de Mondstadt, l'État lui a offert des récompenses et des financements pour concevoir une arme redoutable qui intimidera les ennemis."
  andrius_tank_trust_desc:0 "Après une série de manœuvres obscures, plusieurs fabricants de tracteurs et d'armements se sont unis pour former un trust qui monopolise les matières premières, les techniques et les outils blindés. Ils ont réduit les coûts à un minimum par des économies douteuses, écrasé leurs concurrents et accumulé des profits énormes."
  fishery_association_desc:0 "La population de Wolvendom grandissant, la cueillette ne suffit plus à nourrir tout le monde. D'anciens pêcheurs ont créé l'Association de pêche du Lac des Cidres pour approvisionner les nouveaux arrivants en poissons frais. On raconte qu'un jeune novice en pêche y excelle. Depuis sa création, des habitants vivant loin des rivières consomment dix fois plus de poissons qu'avant leur arrivée à Wolvendom."
  mond_peoples_ship_maunufacturer_desc:0 "Le Groupe naval du Peuple de Mondstadt était autrefois le chantier naval du Lac des Cidres, qui ne produisait que des barques de pêche. Pendant les guerres d'unification, les pêcheurs subissaient des attaques maritimes, alors le chantier a commencé à concevoir des navires de combat lacustres. Après l'unification de Mondstadt, il a été agrandi et financé pour concevoir des navires océaniques, qui fendront les flots pour le peuple de Mondstadt."
  andrius_ship_trust_desc:0 "Ce groupe était à l'origine un petit chantier naval public de Wolvendom. Au moment des libéralisations, son dirigeant a fait baisser artificiellement ses rendements pour que l'État le classe comme actif déficitaire et le racheter à bas prix. Il a réprimé les ouvriers opposés et absorbé d'autres chantiers un par un par tous les moyens légaux ou cachés, formant un trust monopolistique après l'unification. Aujourd'hui, il construit des flottes à bas coût pour nos besoins."
  mond_peoples_aircraft_maunufacturer_desc:0 "Le Groupe aéronautique du Peuple de Mondstadt est une entreprise publique fondée après l'unification de Mondstadt. Ses cadres sont des chercheurs ayant étudié des avions capturés pendant les guerres. Il accueille des élus venus d'autres nations, étudie des manuscrits de Mondstadt et des machines de Khaenri'ah comme les Mécaniques de Terres, et conçoit une variété d'avions. Tous les aéroports de Mondstadt utilisent ses appareils, et il est notre principal fournisseur aérien."
  andrius_aircraft_trust_desc:0 ""
  andrius_blacksmith_shop_desc:0 "Maître Wagner a fui la cité de Mondstadt à cause des combats et s'est installé à Wolvendom. Ne supportant pas l'inactivité, il a décidé de transmettre son savoir, donnant naissance à la nouvelle forge Wagner. Les habitants utilisent ses créatures pour chasser les bêtes sauvages et protéger leurs récoltes. On dit dans les montagnes de Wolvendom : « Aucune faute dans l'ouvrage de Wagner ! »"
  mond_peoples_infantry_weapon_maunufacturer_desc:0 "Le Groupe d'armement de l'Infanterie du Peuple de Mondstadt est né d'un regroupement de petits ateliers. Pendant les guerres de défense de Wolvendom, l'État achetait massivement leurs productions. Ces entreprises étaient collectives, autonomes et sans contrôle étroit, avec des salaires similaires pour cadres, techniciens et ouvriers. Pendant les guerres d'unification, elles ont décidé de se placer sous la tutelle de l'État pour livrer des armes au front plus vite. Aujourd'hui, elles protègent toujours la paix de Mondstadt."
  andrius_infantry_weapon_trust_desc:0 "Trust de l'armement"
  construction_union_of_wolfendom_desc:0 "Le Syndicat des travaux de Wolvendom est issu du besoin de loger les réfugiés en masse. On raconte que Bennett a travaillé là-bas comme simple ouvrier. Aujourd'hui, l'équipe grandit chaque jour, et on la voit partout à Wolvendom."
  mond_peoples_cons_and_reas_maunufacturer_desc:0 "Le Groupe des travaux et recherches du Peuple de Mondstadt regroupait autrefois le Syndicat des travaux de Wolvendom et l'Institut de Recherche de Wolvendom. Après l'unification de Mondstadt, les deux entités ont fusionné pour transmettre les résultats de la recherche directement aux chaînes de production."
  ANR_cons_and_reas_konzern_desc:0 "Après la libéralisation économique, un vaste Konzern multi-secteurs est apparu et ne cesse de grandir. Il dispose de ses propres écoles pour former du personnel, des instituts de recherche les plus vastes de Mondstadt, et d'immenses chaînes de production avec des équipes de chantier, des négociateurs et des juristes. Mais la taille de ce géant favorise la corruption, et ses revenus stables lui ôtent toute volonté d'innover."
  ANR_Bonus_From_War:0 "§C Le chaos de Mondstadt nous apporte davantage de réfugiés §!"
  # l_simp_chinois
  # Politique nationale
  lonely_island:0 "Territoire isolé"
  lonely_island_desc:0 "Mondstadt sombre dans le chaos, mais cela ne concerne pas Razor ni Wolvendom. La région est peu peuplée, les factions en guerre ne s'y intéressent pas, protégée en outre par Andrius... Mais cette paix durera-t-elle vraiment ?"
  The_red_star_won:0 "L'étoile rouge triomphe"
  The_red_star_won_desc:0 "Parfois, le flot de l'histoire emporte les gens vers des destinations inattendues. Bennett était autrefois un aventurier malchanceux, aujourd'hui il est acclamé par tous comme chef. Sa ténacité et sa gentillesse ont conquis les habitants de Wolvendom, qui lui font confiance, et cette confiance lui donne confiance en lui-même. Il est déterminé à mener le peuple vers un avenir meilleur, et ces nouvelles idées qu'il a découvertes au fil des années, appelées §R socialisme §W, lui montreront la voie."
  Immernachtreich:0 "Royaume de la Nuit Éternelle"
  Immernachtreich_desc:0 "La Princesse de la Condamnation a vu d'innombrables mondes grâce à son Œil de Vérité, et a trouvé une voie vers la paix pour son peuple perdu. Elle est consciente qu'une seule de ses incarnations ne suffira pas à réaliser son rêve. Mais son fidèle serviteur Oz lui a offert une idée."
  partial_autonomy:0 "Autonomie partielle"
  partial_autonomy_desc:0 "Diona a lancé ses réformes pragmatiques. Si un organisme perd du pouvoir, un autre le récupérera. Diona a déjà choisi qui sera ce nouveau détenteur de pouvoir."
  the_same_goal_we_have:0 "Un même objectif"
  the_same_goal_we_have_desc:0 "Même si Bennett, Fischl et Diona semblent opposés, Razor perçoit un point commun entre eux : offrir une vie heureuse au peuple. Il est possible de suivre une partie des projets de chacun tout en préservant notre unité."
  Union_of_Socialist_Republics_in_Mondstadt:0 "Union des Républiques Socialistes de Mondstadt"
  Union_of_Socialist_Republics_in_Mondstadt_desc:0 "Sur proposition du Secrétaire Général Bennett, nous fondons l'§R Union des Républiques Socialistes de Mondstadt (URSM) §W, une fédération regroupant plusieurs républiques socialistes. Nous avons encore beaucoup de travail, mais un avenir radieux est à portée de main."
  bring_liberation_back_to_our_hometown:0 "Ramener la liberté dans nos patries !"
  bring_liberation_back_to_our_hometown_desc:0 "Après des batailles acharnées, nous venons d'apporter la paix et la liberté à tout Mondstadt. Nos combats deviendront des chants que les bardes chanteront pour des siècles, et les générations futures se souviendront de nos exploits."
  establishment_of_the_pioneer_nation:0 "Fonder la Nation des Pionniers"
  establishment_of_the_pioneer_nation_desc:0 "La république et la fédération ne suffisent pas à décrire ce royaume fondé par la Princesse de la Condamnation. Sur proposition de nombreux artistes, Fischl décide de le nommer « Nation des Pionniers », un nouveau nom pour une nouvelle ère. Gloire à l'§R Royaume de la Nuit Éternelle §W !"
  establishment_of_the_holy_republic_of_Mondstadt:0 "Fonder la Sainte République de Mondstadt"
  establishment_of_the_holy_republic_of_Mondstadt_desc:0 "Diona imagine une confédération unifiée sous la protection de Barbatos, appelée §B Sainte République de Mondstadt §W. Toutes les entités de la confédération s'entraideront en temps de paix et de guerre."
  establishment_of_the_free_federal_of_Mondstadt:0 "Fonder la Fédération Libre de Mondstadt"
  establishment_of_the_free_federal_of_Mondstadt_desc:0 "Sur proposition de Razor, nous créons une fédération plus centralisée mais attachée aux libertés individuelles : la §B Fédération Libre de Mondstadt (FLM) §W. Beaucoup doutent de sa stabilité, nous leur prouverons le contraire."
  In_the_Wolfendom:0 "À Wolvendom..."
  In_the_Wolfendom_desc:0 "Des mouvements étranges agitent les montagnes et les forêts de Wolvendom, les bêtes sauvages sont affolées. Razor part avec sa meute pour enquêter."
  Some_Strange_guys_wandering:0 "Des gens étranges errent..."
  Some_Strange_guys_wandering_desc:0 "Razor voit des milliers d'hommes en haillons errer dans les montagnes, épuisés par des jours de jeûne. Qu'est-il arrivé ?"
  connect_with_refugee:0 "Entrer en contact avec les réfugiés"
  connect_with_refugee_desc:0 "Après réflexion, Razor décide d'aller à leur rencontre. Deux représentants du groupe viennent lui parler : Bennett et Fischl, qui dirigent les réfugiés."
  expel_mankind:0 "Expulser les humains"
  expel_mankind_desc:0 "Nous ne pouvons pas accueillir ces hommes, ils attireront les seigneurs de guerre sur nos terres et nous attirerons des ennuis inutiles."
  receive_mankind:0 "Accueillir les humains"
  receive_mankind_desc:0 "Razor a grandi parmi les loups, mais son cœur est plus humain que beaucoup d'hommes. Il ne peut pas supporter de les voir errer sans abri, qu'ils restent donc à Wolvendom."
  deal_with_refugees_problem:0 "Résoudre la crise des réfugiés"
  deal_with_refugees_problem_desc:0 "Après Bennett et Fischl, d'autres groupes de réfugiés arrivent peu à peu. Razor, Bennett et Fischl négocient des accords avec eux. Nous identifions trois grands fléaux : manque de vivres, manque de logements, absence d'administration. Nous devons essayer de trouver des solutions."
  build_housing:0 "Construire des logements"
  build_housing_desc:0 "Wolvendom n'a pas de vraies demeures, pas même des tentes en quantité suffisante. Les réfugiés souffrent du froid et des attaques de bêtes. La seule solution est de mobiliser tout le monde pour bâtir des abris, mais Bennett et Fischl ont des plans différents."
  Bennett_simple_designation:0 "Bennett : conceptions simples"
  Bennett_simple_designation_desc:0 "Bennett a lu un magazine présentant un modèle de logement peu coûant et rapide à bâtir, qui nous permettra de résoudre la crise du logement au plus vite."
  Fischl_revolutionary_ideas:0 "Fischl : conceptions novatrices"
  Fischl_revolutionary_ideas_desc:0 "Fischl propose un agencement révolutionnaire des logements plutôt qu'une conception individuelle : des habitats regroupés. « Dans ce monde où l'entropie et le destin fluctuent, seuls ceux qui se soutiennent peuvent survivre » (Oz : « Nous resterons longtemps ici, ces constructions faciliteront notre coopération »)."
  primary_organization:0 "Organisation primaire"
  primary_organization_desc:0 "Wolvendom est sans gouvernement. Les réfugiés se divisent en clans et se disputent l'eau ou des biens. Nous devons fonder une administration basée sur la concertation pour protéger les faibles et résoudre nos problèmes ensemble. Mais quelle forme prendra ce gouvernement ?"
  Fischl_thoughts_of_organization:0 "Fischl : projet d'organisation"
  Fischl_thoughts_of_organization_desc:0 "Fischl veut sélectionner des personnes modestes et douées dans chaque camp pour former nos représentants et nos administrateurs, afin de négocier au quotidien."
  attract_external_ideologue:0 "Attirer des penseurs extérieurs"
  attract_external_ideologue_desc:0 "La situation de Wolvendom est unique, Fischl utilise sa renommée littéraire pour attirer des intellectuels du monde entier. Nous leur offrons l'occasion de mettre en pratique leurs idées en échange de leur aide pour compléter notre administration."
  centralize_our_command:0 "Centraliser le commandement"
  centralize_our_command_desc:0 "Les bêtes ne sont pas notre seul danger, les seigneurs de guerre peuvent nous attaquer. Nous devons créer une milice contrôlée directement par le gouvernement, qui protégera chaque camp des monstres et gagnera la confiance de la population."
  develop_our_production:0 "Développer la production"
  develop_our_production_desc:0 "L'homme doit manger pour vivre. La chasse et la cueillette nous nourriront à court terme, mais nous devons apprendre à produire des outils et cultiver la terre. Comment nous y prendre ?"
  Bennett_support_ourselves:0 "Bennett : se suffire à soi-même"
  Bennett_support_ourselves_desc:0 "Bennett participe à la fabrication collective d'outils. Nous produisons des instruments uniformes et formons les novices à la production, pour ne dépendre de personne. Mais cette activité absorbe toute notre énergie."
  organize_collective_production:0 "Organiser la production collective"
  organize_collective_production_desc:0 "La chasse et la cueillette ne dureront pas éternellement, la faune et les fruits vont s'épuiser. Nous avons besoin de vêtements, de papier et de vin. Il nous faut cultiver la terre en regroupant nos champs pour optimiser l'irrigation et les engrais, puis répartir les récoltes selon le travail de chacun. Mais comment évaluer la contribution de chaque personne ?"
  Fischl_call_for_foreign_aid:0 "Fischl : demander l'aide extérieure"
  Fischl_call_for_foreign_aid_desc:0 "Produire des outils nous fait perdre du temps pour cultiver nos vivres. Nous devons faire de la propagande pour recevoir des vivres et des outils du dehors, même si cela demande des mises en scène."
  introduction_of_advanced_tools:0 "Importer des outils perfectionnés"
  introduction_of_advanced_tools_desc:0 "Nous devons progressivement abandonner la chasse pour l'agriculture, tout en conservant nos sources de nourriture immédiates. Nous importerons des modèles d'outils modernes pour gagner du temps."
  full_up_and_warm:0 "Manger à sa faim, se vêtir chaudement"
  full_up_and_warm_desc:0 "Nous avons résolu le problème de la faim, même si nos plats manquent de variété. Plus personne ne s'effondre de faiblesse, les habitants sourient à nouveau, preuve de notre succès."
  centralize_our_government:0 "Structure administrative verticale"
  centralize_our_government_desc:0 "Nous créons des équipes de producteurs regroupées en unités supérieures. Chaque personne répond à son supérieur direct, pour les usines comme pour les villages. Sur cette base, nous mettons en place une démocratie représentative, afin de transmettre les volontés populaires et appliquer nos plans de développement."
  peoples_commune:0 "Communes populaires"
  peoples_commune_desc:0 "Les paysans n'ont rien à faire une fois les récoltes finies. Nous créons des communes populaires dans les villages volontaires, qui utiliseront le temps libre pour bâtir des écoles et des canaux, tout en renforçant notre contrôle territorial. Nous devrons avancer pas à pas et créer des systèmes de suivi des contributions."
  large_scale_intensive_production:0 "Production intensive à grande échelle"
  large_scale_intensive_production_desc:0 "Nous créons des fermes d'État dans les plaines vastes, directement gérées par le pouvoir central. Plus besoin de craindre le coût des tracteurs, nous produisons à grande échelle avec des ouvriers agricoles au lieu de petits paysans."
  unified_goverment_benefits:0 "Protection sociale publique"
  unified_goverment_benefits_desc:0 "Nos finances s'améliorent, nous pouvons offrir des pensions, une assurance maladie et un revenu minimal à tous. Ce n'est pas aussi parfait que dans les puissances, mais c'est un début, nous pourrons améliorer le système par la suite."
  first_MNPC:0 "Premier Congrès du Peuple de Mondstadt"
  first_MNPC_desc:0 "Près d'un millier de représentants du peuple se réunissent, venus de chaque recoin de Mondstadt : villes, forêts et montagnes. Ce congrès se tiendra régulièrement sans perturber la production, il sera la base légitime de notre pouvoir et décidera du destin de Mondstadt."
  sprinkle_roses_all_over_the_world:0 "Épandre des roses sur toute la terre"
  sprinkle_roses_all_over_the_world_desc:0 "On nous a critiqués pour nos expériences sociales, mais nous avons surmonté chaque obstacle grâce à notre volonté et notre adaptabilité. Nous étendrons ce modèle à tout Mondstadt, de nouveaux défis nous attendent, mais l'union nous permettra de triompher."
  establishment_of_the_liberated_zone_of_Mondstadt:0 "Fonder la Zone Libérée de Mondstadt"
  establishment_of_the_liberated_zone_of_Mondstadt_desc:0 "Ce n'est plus un royaume au sens traditionnel, mais une grande communauté. Si l'on doit nous nommer, ce sera la §R Zone Libérée de Mondstadt §W."
  flat_management:0 "Gestion horizontale"
  flat_management_desc:0 "Certains pensent que la structure verticale crée des distorsions dans la transmission des volontés populaires. Nous optons pour une organisation horizontale, qui réduit les fonctionnaires inutiles et s'adapte rapidement aux crises."
  all_Mondstadt_federation_of_labor_union:0 "Fédération des syndicats de tout Mondstadt"
  all_Mondstadt_federation_of_labor_union_desc:0 "Nous bâtissons une économie planifiée ascendante : non seulement les hauts fonctionnaires proposent des plans, mais les ouvriers et consommateurs proposent des ajustements, des innovations et des recrutements. Moins efficace, mais plus conforme aux besoins de tous."
  voluntary_collectivization:0 "Éduquer le peuple"
  voluntary_collectivization_desc:0 "L'éducation crée des écarts sociaux. Sans éducation égale, les inégalités renaîtront. Nous bâtissons des écoles publiques et des cours du soir pour adultes, pour former des travailleurs qualifiés adaptés à notre industrie."
  Subsidies_within_local_communes:0 "Aides aux communes locales"
  Subsidies_within_local_communes_desc:0 "La protection sociale ne sera pas distribuée directement par le pouvoir central. Chaque commune définira ses propres aides avec nos subventions, sous notre supervision pour préserver la démocratie."
  long_live_the_commune_of_wolfendom:0 "Vive la Commune de Wolvendom !"
  long_live_the_commune_of_wolfendom_desc:0 "Les réformes de Bennett portent leurs fruits, même si des problèmes subsistent. Des miracles sans précédent ont eu lieu à Wolvendom, les habitants regorgent de courage pour affronter tout obstacle. Quels soucis pourraient nous vaincre ? Que ce territoire soit désormais nommé Commune de Wolvendom, longue vie à elle !"
  establishment_of_the_socialist_commonwealth_of_Mondstadt:0 "Fonder le Commonwealth Socialiste de Mondstadt"
  establishment_of_the_socialist_commonwealth_of_Mondstadt_desc:0 "Après tant de luttes, nous y voici. Nous proclamons aujourd'hui la fondation du §R Commonwealth Socialiste de Mondstadt §W. Le drapeau rouge flotte haut sur nos terres !"
  stop_all_the_sins:0 "Condamner le mal"
  stop_all_the_sins_desc:0 "La Princesse de la Condamnation augmente le nombre de ses gardes et corbeaux messagers, affirmant qu'elle doit imposer sa volonté pour apporter la lumière à Wolvendom. Malgré les doutes, le peuple lui fait confiance et soutient son projet."
  directed_creation:0 "Production industrielle artistique"
  directed_creation_desc:0 "Le situationnisme vise la quantité plutôt que la qualité. Nous analysons les réactions du public pour créer des romans, tableaux et farces en masse à partir des thèmes populaires. Les artistes indépendants peuvent continuer leurs créations, mais ils devront faire face à la concurrence de nos productions massives."
  judgment_to_judgment:0 "Condamnation après condamnation"
  judgment_to_judgment_desc: "Notre propagande commence à porter ses fruits, l'opinion publique évolue et nous pouvons transformer la société à notre guise."
  save_them_all:0 "Tous pris en charge"
  save_them_all_desc:0 "On nous moque de notre « gouvernement de bonnes mères », car nous gérons la culture, l'opinion et les idées en détail. Nous ne sommes pas de simples mères, mais une mère pour le peuple, qui lui offre épanouissement et confort."
  peoples_princess:0 "Princesse du Peuple"
  peoples_princess_desc:0 "Fischl affirme que « la voie vers le situationnisme est la voie de l'éternel renouveau. Pour atteindre le Royaume de la Nuit Éternelle, chaque sujet doit éveiller la lumière de son âme » (Oz : « Mademoiselle Fischl utilise le situationnisme pour mener le peuple vers un avenir meilleur, et nous avons tous à nous impliquer »)."
  bloom_together:0 "Épanouissement commun"
  bloom_together_desc:0 "Le situationnisme ne vise pas à créer un rêve illusoire. Il brise la perception ordinaire du quotidien par la création abondante, même si nous surveillons les contenus diffusés."
  Contextualism_to_Contextualism:0 "Situationnisme sur situationnisme"
  Contextualism_to_Contextualism_desc:0 "Toutes les croyances sont façonnées par leur contexte matériel. Nous révélons cette vérité et incitons le peuple à créer de nouveaux contextes, d'où naîtra une société plus égalitaire que toute ce qui a précédé. Fischl nous guide sur cette voie."
  material_base:0 "Base matérielle"
  material_base_desc:0 "On nous accuse de rêver, mais nos réformes portent leurs fruits, nous avons assez de ressources pour protéger le peuple et investir dans la production. Les médiocres bâtissent d'abord des infrastructures et attendent le progrès spirituel, nous avançons sur les deux fronts à la fois."
  progress_of_the_artistic_zone_without_dawn:0 "Avancée de la Zone Artistique de la Nuit Éternelle"
  progress_of_the_artistic_zone_without_dawn_desc:0 "Nos réformes ont abouti, Wolvendom est plus avancé et raffiné ! On trouve des œuvres partout, le territoire lui-même devient un paysage situationniste appelé §R Zone Artistique de la Nuit Éternelle §W."
  promote_and_appoint_squires:0 "Nommer des notables"
  promote_and_appoint_squires_desc:0 "Nos villages ont vu émerger des personnes talentueuses et fortunées grâce à nos travaux. Nous leur déléguons une partie du pouvoir pour alléger l'administration centrale."
  Restrain_land_annexation:0 "Accélérer la concentration foncière"
  Restrain_land_annexation_desc:0 "Les paysans ont cultivé leurs propres parcelles. Les nouveaux notables rachètent leurs terres pour créer de grandes fermes, avec l'accord de tous. Nous optimisons l'agriculture grâce à des investissements massifs."
  encourage_the_charitiess:0 "Encourager la charité"
  encourage_the_charitiess_desc:0 "Notre administration est trop petite pour financer toutes les aides sociales. Nous incitons les riches à la charité, nous faisons de la publicité pour gagner la sympathie du peuple, même si ces associations prennent d'autres rôles."
  smaller_the_government_better_the_governing:0 "Moins d'État, mieux gouverner"
  smaller_the_government_better_the_governing_desc:0 "Qui peut nier nos succès ? Nos frais administratifs ont diminué, davantage de ressources vont à la production, notre économie prospère ! Continuons sur cette voie."
  encourage_spirit_of_enterpreneur:0 "Encourager l'esprit d'entreprise"
  encourage_spirit_of_enterpreneur_desc:0 "Diona libéralise l'économie, transfère le pouvoir au marché libre. Un conseiller lui dit que le marché résoudra le chômage, le retard technique et les gaspillages si nous supprimons les réglementations."
  end_the_interventionism:0 "Mettre fin à l'intervention étatique"
  end_the_interventionism_desc:0 "La régulation est un frein au marché libre. La main invisible répartira chaque chose à sa place. On nous parle de crises économiques régulées, mais n'est-ce pas la régulation elle-même qui les crée ?"
  more_free_the_market_happier_the_people:0 "Plus de marché libre, plus de bonheur pour le peuple"
  more_free_the_market_happier_the_people_desc:0 "Les systèmes rigides ne peuvent pas rivaliser avec la liberté de marché, qui stimule l'innovation et le bonheur de tous. §B Plus de marché libre, plus de liberté pour le peuple. Le marché le plus libre offre la plus grande liberté §W."
  the_free_zone_of_the_spring_lives_forever:0 "La Zone Libre du Village de l'Eau est éternelle"
  the_free_zone_of_the_spring_lives_forever_desc:0 "Nous avons atteint le sommet de la liberté. Certains nous accusent d'aller trop loin, mais nous garantissons la liberté d'expression, pour les vérités comme les absurdités. Ce territoire sera nommé §B Zone Libre du Village de l'Eau §W."
  Bennetts_grass_root_organizations:0 "Organisations populaires de Bennett"
  Bennetts_grass_root_organizations_desc:0 "Nous mettons en œuvre le projet d'organisation locale de Bennett, pour réduire les frais de l'État et gagner en efficacité."
  Grass_roots_democratic_autonomy:0 "Autonomie démocratique locale"
  Grass_roots_democratic_autonomy_desc:0 "La décentralisation allège notre administration et satisfait le peuple, nous surveillons néanmoins pour éviter les clans et les pots-de-vin."
  fischl_framework_of_the_government:0 "Structure administrative de Fischl"
  fischl_framework_of_the_government_desc:0 "Nous mettons en place l'organisation rigoureuse imaginée par Fischl, pour accélérer notre développement."
  publicity_of_Contextualism:0 "Propagande du situationnisme"
  publicity_of_Contextualism_desc:0 "Nous intégrons le situationnisme dans nos campagnes de communication pour faciliter nos projets."
  diona_interventionism:0 "Interventionnisme de Diona"
  diona_interventionism_desc:0 "Nous mettons en place les politiques économiques de Diona : une intervention mesurée stimule l'activité marchande."
  Collective_enterprises_participate_in_competition:0 "Entreprises collectives en concurrence"
  Collective_enterprises_participate_in_competition_desc:0 "Bennett a fondé de nombreuses entreprises collectives où les revenus sont partagés. Mais la sécurité des revenus réduit la motivation des ouvriers. Nous les mettons en concurrence pour gagner en productivité."
  unbreakable_union:0 "Union indéfectible"
  unbreakable_union_desc:0 "Notre système de conciliation fonctionne mieux que prévu, le peuple a choisi Razor pour nous diriger. Même si certains disent que nous nous sommes glissés par la fenêtre, chacun peut voir nos institutions à l'œuvre."
  peoples_order:0 "L'ordre du Peuple a été donné…"
  peoples_order_desc:0 "Il y a quelques années, nous n'étions que des réfugiés sans abri ; aujourd'hui nous avons des foyers et une armée puissante. À l'origine, nous ne voulions que survivre, mais les guerres de Mondstadt nous poussent à rétablir la paix sur tout le territoire, par la force si nécessaire !"
  the_fate_of_the_church:0 "Le sort de l'Église de Vents"
  the_fate_of_the_church_desc:0 "Pourquoi l'Église de Vents, une simple organisation religieuse, rassemble-t-elle des armées au milieu des guerres de Mondstadt ? Elle est dépassée par le temps, nous serons le dernier coup qui l'abattra."
  the_fate_of_ragnvindr:0 "Le sort du clan Ragnvindr"
  the_fate_of_ragnvindr_desc:0 "Beaucoup d'entre nous ont des liens avec le clan Ragnvindr, mais pour le bien de Mondstadt, ce pouvoir doit disparaître, nous reprendrons ses territoires."
  the_fate_of_the_springvale:0 "Le sort du Village de l'Eau"
  the_fate_of_the_springvale_desc:0 "Le Village de l'Eau est notre voisin le plus faible, ce sera notre première proie."
  train_advanced_commanders:0 "Former des officiers supérieurs"
  train_advanced_commanders_desc:0 "Nos tactiques sont renouvelées, nous devons former nos commandants à ces nouvelles méthodes pour créer une armée victorieuse qui protégera Wolvendom."
  seek_the_secret_of_atoms:0 "Explorer le secret des atomes"
  seek_the_secret_of_atoms_desc:0 "Nos alchimistes ont une théorie : stimuler les atomes, composants de toute matière, créer une arme dévastatrice. Cela vaut la peine d'essayer."
  develop_the_food_industry:0 "Développer l'industrie alimentaire"
  develop_the_food_industry_desc:0 "La cueillette ne suffit pas, nous devons créer des plantations et des conserveries pour conserver les fruits, nourrir le peuple et augmenter nos impôts."
  Bennett_theory_of_reciprocity:0 "Théorie de la réciprocité de Bennett"
  Bennett_theory_of_reciprocity_desc:0 "Notre État repose sur la concertation. Wolvendom est petit, nous pouvons instaurer une démocratie directe, tout en conservant une autorité rapide pour prendre des décisions urgentes."
  plans_of_large_scale_camps:0 "Plan des grands camps"
  plans_of_large_scale_camps_desc:0 "Après négociations et aides, les réfugiés regroupent leurs habitats pour faciliter la répartition des ressources et la main-d'œuvre."
  ANR_dispersive_communes:0 "Communes dispersées"
  ANR_dispersive_communes_desc:0 "Notre population est faible, nous n'avons pas besoin d'une administration verticale complexe. Chaque village dispose de son propre organisme sous notre autorité, les dispersions limitent les conflits et facilitent la chasse et la cueillette."
  peoples_milltia:0 "Milices villageoises"
  peoples_milltia_desc:0 "Nos finances ne permettent pas d'entretenir une armée permanente. Chaque village forme une milice qui travaille et s'entraîne en temps de paix, et se mobilise en cas de danger."
  Integrated_building:0 "Bâtiments intégrés"
  Integrated_building_desc:0 "Les plans de Fischl sont construits, on entend des rires dans ces grands logements regroupés. Les conflits sont rares, nos administrations ont d'autres chantiers à mener."
  all_live:0 "Tous logés"
  all_live_desc:0 "Nos logements ne valent pas ceux d'avant-guerre, mais chacun a un toit, les réfugiés se réunissent le soir pour parler de l'avenir."
  basic_framework_of_administration:0 "Cadre administratif de base"
  basic_framework_of_administration_desc:0 "Nous avons gagné la confiance des réfugiés et créé une administration pour régler les conflits, organiser la production et accueillir les nouveaux arrivants. Si les réfugiés affluent, nous devrons recruter davantage de fonctionnaires."
  receive_more_refugee:0 "Accueillir davantage de réfugiés"
  receive_more_refugee_desc:0 "Pendant que nous réglons nos affaires, de nouveaux réfugiés arrivent en masse."
  external_changes:0 "Changements extérieurs"
  external_changes_desc:0 "La guerre approche. Les seigneurs de guerre convoitent nos cristaux et notre main-d'œuvre, nous devons nous préparer à nous défendre."
  prepare_for_protecting_our_border:0 "Préparer la défense des frontières"
  prepare_for_protecting_our_border_desc:0 "Les ouvrages défensifs réduisent nos pertes, mais où les bâtir ? Trois propositions : un mur tout autour de Wolvendom, des forts sur les points stratégiques, ou une défense élastique à l'intérieur du territoire."
  organize_defensive_armies:0 "Organiser une armée de défense"
  organize_defensive_armies_desc:0 "Nous avons besoin de soldats pour nous défendre, mais quelle tactique adopter ? Des doctrines contradictoires nous attendent."
  trade_with_g:0 "Commerce avec le clan Gunnhildr"
  trade_with_g_desc:0 "Wolvendom ne peut pas produire tout ce dont nous avons besoin, nous échangeons nos surplus contre leurs marchandises."
  hunt_in_ruin:0 "Chasser dans les ruines de la Tempête"
  hunt_in_ruin_desc:0 "Nos réserves de vivres ne seront jamais trop pleines, les ruines de la Tempête regorgent de gibier."
  dangerous_springvale:0 "Le Village de l'Eau en péril"
  dangerous_springvale_desc:0 "Le Village de l'Eau est coincé entre l'Ordre des Chevaliers et le clan Ragnvindr. Nous signons un pacte de défense mutuelle pour réduire les risques."
  Bennett_Asymmetric_warfare:0 "Bennett : guerre asymétrique"
  Bennett_Asymmetric_warfare_desc:0 "Wolvendom ne peut pas affronter les puissances frontales, nous utilisons nos montagnes et nos forêts pour lutter par des tactiques irrégulières."
  invite_diona:0 "Inviter Diona"
  invite_diona_desc:0 "Nos liens avec le Village de l'Eau se renforcent, nous devons unir nos administrations, nous invitons Diona à rejoindre notre gouvernement."
  integrate_springvale:0 "Intégrer le Village de l'Eau"
  integrate_springvale_desc:0 "Tous les préliminaires sont terminés, nous unissons nos deux territoires pour la paix commune."
  firepower_deterrence:0 "Diona : dissuasion par feu"
  firepower_deterrence_desc:0 "La simple défense passive ne suffit pas, nous infligeons de lourdes pertes à l'ennemi pour dissuader toute agression."
  Fischl_soldier_initiative:0 "Fischl : initiative des soldats"
  Fischl_soldier_initiative_desc:0 "La guerre se fait par les hommes. Nous galvanisons nos troupes par la propagande, ils combattront avec conviction."
  Bennett_large_scale_fortressization:0 "Bennett : fortifications à grande échelle"
  Bennett_large_scale_fortressization_desc:0 "Les villages sont répartis sur toute la frontière, nous devons défendre chaque recoin pour protéger nos populations."
  Fischl_elastic_defense:0 "Fischl : défense élastique"
  Fischl_elastic_defense_desc:0 "L'ennemi avancera inévitablement, nous reculons pour l'épuiser, puis nous contre-attaquons quand ses approvisionnements manquent."
  diona_defend_important_areas:0 "Diona : défendre les zones clés"
  diona_defend_important_areas_desc:0 "Nos frontières sont longues et fragiles, nous préparons des ouvrages à l'intérieur du territoire pour ne pas nous faire anéantir sur la ligne de front."
  conscription_from_refugees:0 "Conscription des réfugiés"
  conscription_from_refugees_desc:0 "Si la guerre éclate, les réfugiés n'ont nulle part où fuir, nous appelons les jeunes hommes à défendre notre foyer."
  moblize_the_whole_state:0 "Mobilisation générale"
  moblize_the_whole_state_desc:0 "Si la guerre éclate, tout le monde doit produire des armes et des vivres pour nos défenseurs."
  give_up_fantasy_and_prepare_for_struggle:0 "Abandonner les illusions, se préparer au combat"
  give_up_fantasy_and_prepare_for_struggle_desc:0 "Certains croient que la guerre nous épargnera, mais ce n'est plus possible. La prière à Barbatos ne sauvera pas nos terres. Fuir est honteux et inutile, nous devons nous préparer à nous battre."
  large_influx_of_refugees:0 "Afflux massif de réfugiés"
  large_influx_of_refugees_desc:0 "Nos préparatifs de défense rassurent les populations, davantage de réfugiés viennent à nous, notre administration est saturée."
  for_homeland_behind:0 "Pour notre foyer derrière nous"
  for_homeland_behind_desc:0 "Wolvendom est le seul endroit paisible de Mondstadt. Si nous perdons ce territoire, nous perdons tout, nous nous unissons pour nous défendre."
  for_relatives_behind:0 "Pour nos proches derrière nous"
  for_relatives_behind_desc:0 "Des familles entières se sont réfugiées à"