  ABY_supremacy_of_technology_desc:0 "La science porte ses fruits."
  ABY_long_term_economic_planning:0 "Planification industrielle à long terme"
  ABY_long_term_economic_planning_desc:0 "Viser loin, ne pas se limiter au court terme."
  ABY_civil_works:0 "Plan des infrastructures de base"
  ABY_civil_works_desc:0 "Les infrastructures de base sont primordiales."
  ABY_public_works:0 "Travaux publics populaires"
  ABY_public_works_desc:0 "Chacun bénéficie des bienfaits."
  ABY_labor_reform:0 "Réforme du travail"
  ABY_labor_reform_desc:0 "Réorganiser les modalités d'utilisation de la main-d'œuvre."
  ABY_global_integration:0 "Intégration des ressources"
  ABY_global_integration_desc:0 "Unifier l'ensemble de nos systèmes de ressources dispersés."
  ABY_military_factory:0 "Construction d'usines militaires"
  ABY_military_factory_desc:0 "L'armée est indispensable à la vengeance."
  ABY_steel_works:0 "Exploitation sidérurgique"
  AABY_steel_works_desc:0 "Sans acier, rien n'est possible."
  ABY_the_tag_economic_miracle:0 "Miracle industriel"
  ABY_the_tag_economic_miracle_desc:0 "Un véritable miracle."
