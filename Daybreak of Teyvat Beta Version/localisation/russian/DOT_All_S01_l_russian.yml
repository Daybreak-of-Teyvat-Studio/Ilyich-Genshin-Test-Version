 Book_ABY:0 "§R【Ещё не завершено】§!В древние времена в Тейвате сначала буйствовали Семь Драконов, а затем сошёл Вечный Трон. Первый человек создал мир и даровал человечеству цивилизацию, которой правили Три Лунные Богини. В Год Погребального Огня начался великий хаос, восстали демоны, и постепенно появились Семь Архонтов, основав Мондштадт, Ли Юэ, Инадзуму и другие государства. Прошла тысяча лет, случилось восстание Кхенри'ах, и люди пострадали. Прошло ещё сто лет, и вот, вновь сгущаются тучи, грядёт великий переворот!"
 Book_RAG:0 "§G【Рекомендуется к игре】§!\nМондштадт зовёт нас к освобождению,\nВетер поднимается с шагами войск.\nПрощай, земля отцов, помни о нас;\nПрощай, дорогие взгляды, мы не отступим.\nВ отличие от Гуннхильдр, Имонлокай и Лоуренсов, род Рагнвиндр берёт начало от героя, свергнувшего старую аристократию. Он был стражем, но под влиянием танцоров с мечами из Странствующего Оркестра встал на путь борьбы с аристократией.\nЭта традиция передаётся в роду Рагнвиндр. Они всегда сомневались в существующем порядке, действуя по своему усмотрению. Если Гуннхильдр не докажет свою способность быть лидером Мондштадта в грядущем кризисе, Рагнвиндры не постесняются занять её место."
 Book_DRA:0 "§G【Рекомендуется к игре】§!\nСвободный бог ветра зовёт нас,\nОтомстить военачальникам!\nМы жаждем драгоценной свободы,\nИ готовы за неё сражаться!\nПосле второго этапа освоения Драконий хребет возродился — он стал процветающим регионом с большим населением. Под руководством председателя Альбедо экономика и жизнь населения процветают. Однако наступает буря.\nВ грядущем хаосе Драконий хребет будет вынужден плыть по течению, но не будет всегда таким. Те, кто пренебрегут им из-за его временной слабости, заплатят за это.\nВ крови и огне лидеры хребта осуществят своё понимание свободы и мира.\n\nИнтересные механики: построить мирное и счастливое убежище в охваченном хаосом Мондштадте, вырасти в тени.\nПоддерживать народ, гасить пламя гражданской войны, проникать в военачальников, экспериментировать с безумными идеями.\nПринять факел свободы от Ордена Рыцарей Запада и быстро создать армию, чтобы вернуть мир и свободу в Мондштадт."
 #\n\n有趣的内容：\n阿贝多 自由、和平与稳定（蓝）\n从西风骑士团手中接过自由的火炬，迅速组织强大的军队，将和平与自由带回蒙德。\n阿贝少 循此苦旅，终抵群星（黑）\n积蓄【阴谋力量】夺取权力，以铁腕指引蒙德冲向进步。\n砂糖 创新、救护与民主（蓝/红）\n支援各地人民，平息内战烈火，渗透全国军阀，试验奇思妙想，与蒙德一同走向进步的未来。\n丽莎 磨剑三年，一鸣惊人（蓝）\n在混乱的蒙德中建立起一个和平而幸福的庇护所，在无人注视的角落中崛起，发展出无人能敌的工业，而后横扫蒙德。\n大集体 迈向终极自由（黑）\n在丽莎批准的实验项目中诞生，通向摆脱肉身枷锁的终极自由……
 Book_FAV:0 "§G【Рекомендуется к игре】§!\nЯ пишу это не для того, чтобы устыдить вас,\nНо чтобы предупредить.\nВы должны стремиться к большей благодати,\nЯ укажу вам более высокий путь.\nТысячу лет назад, во времена аристократии, Церковь Запада раскололась: одна фракция присоединилась к аристократам, другая, без священнического сана, ушла в народ и заключила с ним договор: когда прозвучит вторая часть Песни Сосен, они поднимут восстание.\nИменно эта фракция, возглавляемая Безымянным Пастырем, мобилизовала верующих для победы над аристократией.\nТеперь, перед лицом новых угроз, группа священников вновь поднимает знамя Сосен, заявляя, что Церковь изменила заветам Барбатоса и нуждается в реформах.\nВ этой группе одни видят инструмент захвата власти, другие — ребёнка, которого нужно воспитывать. Возможно, они приведут Мондштадт к лучшему будущему, а возможно, станут ещё одним факелом в огне войны."
 Book_LAW:0 "§G【Рекомендуется к игре】§!\nПеро аристократии, некогда украшавшее шляпы знати, всё ещё стоит, не замечая времени. Теперь всё обратилось в прах. Некогда славный род Лоуренсов теперь живёт в тени Ордена, но высокие манеры напоминают им, как они не могут прозябать вместе с простолюдинами. Теперь, когда основные силы Ордена покинули Мондштадт, настало время для рода проявить себя. Однако нынешние потомки забыли о долге, видя во власти лишь украшения, а в обмане — искусство общения. Куда же приведёт этот лёд, когда-то называемый гордостью Мондштадта?"
 Book_GUN:0 "§G【Рекомендуется к игре】§!Род Гуннхильдр — один из старейших рыцарских родов Мондштадта, ведущий начало от жрицы Гуннхильдр, сражавшейся с Барбатосом против Короля Башен. Род всегда следовал завету «Вечно защищать Мондштадт». Во время борьбы с аристократией они были на стороне народа, поэтому избежали изгнания. Сегодня род даёт Мондштадту великих священников и рыцарей. Можно надеяться, что они и впредь будут верны заветам предков и Барбатоса, защищая землю и народ Мондштадта. Надеюсь..."
 Book_SPI:0 "§R【В разработке】§!Свобода, которую народ Мондштадта постоянно ищет, проявилась в войнах против Короля Башен и аристократов. Сегодня Мондштадт под властью Ордена Рыцарей Запада, и все купаются в своей свободе — если бы не Ураган, развращённый Орденом Бездны. В условиях кризиса Фатуи активизируются, а Лоуренсы плетут заговоры. Сможет ли Орден защитить свободу Мондштадта?"
 Book_ANR:0 "§G【Рекомендуется к игре】§!\nЗемля Мондштадта рождает героев,\nИх клинки устремлены к тиранам.\nКогда же взовьётся знамя свободы?\nСмотри, как флаг полощется на ветру!\nС древних времён Вольфендом был одним из самых мирных мест, где единственными конфликтами были схватки хищников. Даже войны не трогали это безлюдное место. Но сможет ли Вольфендом сохранить покой в грядущих переменах?\nВозможно, Вольфендом ждёт великая перемена. Люди, познавшие трагедию, соберутся здесь, поддержат друг друга и заставят тех, кто обрёк их на такую судьбу, заплатить сполна."
 #\n\n有趣的内容：\n共通线：庇护难民，挣扎求存\n班尼特 与人民同在（红）\n实践新生的启明主义理想，将蒙德带向美丽而繁荣的未来。\n菲谢尔 加速，迈向未来（红/黑）\n接受异想天开的情境主义思潮，通过改造人性加速改造社会，最终将蒙德带向理想的社会、终极的自由。\n雷泽 求同存异，民主协商（蓝）\n结合各领袖所长，为蒙德指出民主互助的道路。\n迪奥娜 退一步，进两步（蓝）\n与商人或乡绅合作，走向贸易自由或社会稳定。
 Book_VAN:0 "§R【В разработке】§!Ланнара — таинственный народ Сумеру, слуги Дендро Архонта.\n\nНесколько сотен лет назад катастрофа разрушила их дом. Нынешняя Марана до сих пор угрожает Варанаре.\n\nВ это смутное время, когда конфликты между учёными и богом, джунглями и пустыней обостряются, что выберут Ланнара?"
 Book_NDK:0 "§R【В разработке】§!В те времена, когда семь светил неба ещё не сияли над землёй, король, чьё имя ныне забыто, взошёл на Луну и правил миром. Останки, не ставшие луной, покоятся в море и стали домом для изгнанников севера. Ни чёрный прилив, ни чужеземные жрецы не сломили эту землю, но теперь, когда взошла новая луна, беда вновь пытается поглотить её..."


