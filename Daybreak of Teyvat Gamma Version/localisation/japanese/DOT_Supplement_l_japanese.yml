 DOT_chinese_unity_1:0 "中国の団結"
 DOT_chinese_unity_1_desc:0 "軍閥らは我々の支持を表明しており、政府は外国の侵略者への抵抗に集中することができる。"
 DOT_civil_war_deserters:0 "内戦からの逃亡者"
 DOT_communist_uprisings:0 "共産主義者の台頭"
 DOT_communist_uprisings_desc:0 "共産党と国民党の間の緊張は国内のあらゆる部分で表面化している。もし共産党への支持が高まりすぎれば、共産主義者達が国を動かすことになるだろう。"
