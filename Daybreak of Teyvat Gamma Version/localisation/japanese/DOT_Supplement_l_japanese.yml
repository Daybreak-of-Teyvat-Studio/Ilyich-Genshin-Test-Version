 SPR_military_disloyalty:0 "軍部の不忠"
 SPR_military_disloyalty_desc:0 "1932年に起きた「サンフルハダ」の軍事クーデター失敗は、今もスペイン軍に暗い影を落としている。クーデターの首謀者であるホセ・サンフルホを筆頭に不忠であった軍将校達はその後ポルトガルへと亡命し、今も何らかの策謀を行っている。\n\nしかし、スペイン内部には未だ王政への回帰や、または強力なファシストの指導力を見たいといったような熱望が存在していたので、この失敗の後でも不忠な将校たちは落胆することはなかった。軍政による政府の強すぎる干渉は、前回よりも遥かに暴力的かつ血みどろとなる更なる内戦を引き起こす可能性がある。"
 SPR_military_disloyalty_tt:0 "§R部隊の訓練・解隊、師団編制の編集ができない。§!\n"
 SPR_national_strikes:0 "全国ストライキ"
 SPR_national_strikes_desc:0 "この国は、逃れられないであろう労働者革命のはじまりのステージに位置しているようだ。労働者が少ない仕事で多くの賃金を得られるよう要求しているため、ストライキに次ぐストライキは産業や日常生活を麻痺させていき、貧しい小作農は政府が見て見ぬふりをしている間に徐々に土地の着服を進めている。"
