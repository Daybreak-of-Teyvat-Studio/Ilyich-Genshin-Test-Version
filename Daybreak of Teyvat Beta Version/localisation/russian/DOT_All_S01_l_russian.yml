 Book_script_MOT:0 "\nПосле убийства «Короля Башен», демона урагана Декарабиана, и войны с аристократией, народ Мондштадта наконец обрёл свободу.\nПод властью Ордена Рыцарей Запада Мондштадт идёт в ногу с мировыми переменами, каждый купается в своей свободе, и страна, сбросив оковы, свободно движется к прогрессу и процветанию — каждый мондштадтец и даже иностранцы видят, что Мондштадт на подъёме, и ничто не может остановить его.\nОднако яркий свет свободы, который несёт Орден Рыцарей Запада, слишком ослепителен, и люди не замечают теней под этим светом.\n\nЭпоха славы: Орден Рыцарей Запада, Вольфендом, Владения Рагнвиндр, Владения Драконьего хребта."
 Book_script_LYY:0 "\nНа юго-восточном побережье Тейвата гавань Ли Юэ под защитой Владыки рассекала волны тысячи лет. Для жителей Ли Юэ Владыка и Ли Юэ связаны нерушимым контрактом, и защита Ли Юэ — это само собой разумеющаяся обязанность, долг, длящийся тысячелетия. Но у всего есть конец. С активностью Фатуи в Ли Юэ, предстоящая Церемония Приглашения Бога кажется полной опасностей. А у побережья Ли Юэ, демон Осеайр, заточённый когда-то Владыкой, кажется, устал от своего положения...\n\nЭпоха славы: Гавань Ли Юэ."
 Book_script_INA:0 "\nС падением Кхенри'ах пятьсот лет назад Сёгун Инадзумы замкнулась в себе, заперев и всю Инадзуму, передоверив государственные дела Трём Комиссиям. Однако со временем вечность оказалась иллюзией. Комиссии развратились, вера в Сёгуна угасла. После указа об охоте на Глаза Бога, введённого Комиссией Тэнрё, конфликты в Инадзуме достигли пика. Острова Цуруми и Сэйрай были оставлены сёгунатом. Младшие офицеры, жаждущие реформ, зашевелились. За пределами сёгуната Коралловый дворец, давно ожидавший своего часа, начал привлекать недовольных, поднимая знамя сопротивления. Однако быстрое расширение повстанцев привело к проблемам. После захвата острова Ясиори фанатики разрушили святыни, вызвав бедствие, что задержало наступление и позволило сёгунату перегруппироваться. Но несомненно, Инадзума вступила в эпоху перемен.\n\nЭпоха славы: Коралловый дворец, Храм Сэйрай, Ассоциация Цуруми."
 Book_script_SUM:0 "\nЧерез 500 лет после катастрофы Кхенри'ах и смерти Великой Древесной Владычицы, Сумеру фактически управляется Великим Мудрецом и Академией. Проблемы Мёртвых зон и болезни Мараны не решены, а Малая Богиня Древа заточена в Дворце Чистоты. Учёные, ослеплённые глупостью и алчностью, вступили в сговор с Фатуи, пытаясь создать нового бога. Деспотизм и коррупция Академии привели к хаосу. Малая Богиня Древа пытается изменить ситуацию, намекая своим последователям на борьбу с Академией, а за пределами города Сумеру всё больше людей сомневаются в её правлении. Нестабильность ослабляет контроль над пустыней, и её жители мечтают о возрождении Короля Дешрета и независимости. Тем временем внешние угрозы становятся всё более реальными…"
 Book_INA:0 "§R【В разработке】§!В условиях действующих указов об охоте на Глаза Бога и изоляции, коррупция и война распространяются по островам Инадзумы. Хотя Комиссия Дзя пытается спасти положение, Комиссия Кандзё и Тэнрё безучастны — или, скорее, коррупция исходит от них. Повстанцы Кораллового дворца расширяются, Фатуи наживаются на хаосе, а Комиссия Тэнрё открыто сотрудничает с Фатуи. Если сёгунат не изменится, Тенсюкаку может перестать принадлежать Сёгуну."
 Book_SAN:0 "§G【Рекомендуется к игре】§!Прилив обнимает кораллы, кости змея хранят древнюю вражду, пустой дворец ждёт войны. Луна купается в бездне, чешуя защищает народ, поднимая знамя против грома. Прилив зовёт в бой, жрица ведёт народ, не давая собрать Глаза. Жемчуг сияет на платье, в сердце — тысячи стратегий, защищая пустынный берег. Мороз покрывает Фудзито, каждый коралл — как клинок, народ идёт в бой. Прилив открывает серную дорогу, бог разрушает кораллы, создавая мир, клинок устремлён к горе Ёго. Текущее влияние Жрицы Народа: §R-999§!"
 Book_ASA:0 "§R【В разработке】§!В условиях действующих указов об охоте на Глаза Бога и изоляции, коррупция и война распространяются по островам Инадзумы. Хотя Комиссия Дзя пытается спасти положение, Комиссия Кандзё и Тэнрё безучастны — или, скорее, коррупция исходит от них. Повстанцы Кораллового дворца расширяются, Фатуи наживаются на хаосе, а Комиссия Тэнрё открыто сотрудничает с Фатуи. Если сёгунат не изменится, Тенсюкаку может перестать принадлежать Сёгуну."
 Book_TSU:0 "§R【В разработке】§!В условиях действующих указов об охоте на Глаза Бога и изоляции, коррупция и война распространяются по островам Инадзумы. Хотя Комиссия Дзя пытается спасти положение, Комиссия Кандзё и Тэнрё безучастны — или, скорее, коррупция исходит от них. Повстанцы Кораллового дворца расширяются, Фатуи наживаются на хаосе, а Комиссия Тэнрё открыто сотрудничает с Фатуи. Если сёгунат не изменится, Тенсюкаку может перестать принадлежать Сёгуну."
 Book_MOT:0 "§G【Рекомендуется к игре】§!\nКогда люди проходят здесь,\nВсе говорят: какой красивый цветок;\nЭтот цветок принадлежит свободным воинам —\nОн отдал свою жизнь за свободу Мондштадта.\nМондштадт идёт под руководством Ордена Рыцарей Запада уже более тысячи лет. Когда руководство перешло к Джин Гуннхильдр, она привела Мондштадт к небывалым высотам. Здесь находят воплощение радикальные демократические идеи, применяются передовые технологии из Бездны, Фонтейна и Шнежной, всё процветает. Некоторое время Джин казалось, что её мечты сбываются.\nНо приближается буря.\nВ грандиозном обрушении Джин Гуннхильдр столкнётся с последним препятствием на пути к своим идеалам — препятствием, которое страшнее всего, что она преодолевала раньше. Она должна любой ценой пройти через это испытание и не отдать будущее Мондштадта в руки недобросовестных военачальников. Иначе нынешний свет Мондштадта, возможно, никогда не вернётся на эту землю, оставшись лишь в истории."
 #\n\n有趣的内容：\n内战前 争分夺秒，平衡取舍，抱薪救火\n内战中 与贵族军的限时冲突，维持下降的稳定和战争支持，转向战时经济，通过一场又一场胜利扶大厦于将倾。\n内战后 建设蒙德，实践对自由的理解。\n可能的路线：\n琴 公理战胜，实现自由理想（蓝）\n在内战中突出重围，用胜利高举民主自由理想的火炬。\n琴 回船归港，永护蒙德\n作出必要的妥协，为下一次实践理想做好准备。在此之前，用铁腕守护蒙德。\n诺艾尔 临危受命，挽救危局，大政奉还\n诺艾尔 希望破灭，结晶之夜，黑玫瑰盛开\n诺艾尔 高歌猛进，公投连任，红玫瑰绽放
 Book_LYY:0 "§G【Рекомендуется к игре】§!На юго-восточном побережье Тейвата гавань Ли Юэ под защитой Владыки рассекала волны тысячи лет. Для жителей Ли Юэ Владыка и Ли Юэ связаны нерушимым контрактом, и защита Ли Юэ — это само собой разумеющаяся обязанность, долг, длящийся тысячелетия. Но у всего есть конец. С активностью Фатуи в Ли Юэ, предстоящая Церемония Приглашения Бога кажется полной опасностей. А у побережья Ли Юэ, демон Осеайр, заточённый когда-то Владыкой, кажется, устал от своего положения..."
