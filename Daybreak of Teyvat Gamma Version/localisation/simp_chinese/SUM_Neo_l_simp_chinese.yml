 SUM_Neo.225.b:"留一手，别赌上须弥"
 SUM_Neo.226.t:"掌握禁忌"
 SUM_Neo.226.d:"教令院自认已经掌握了禁忌，把它锁进柜子。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。"
