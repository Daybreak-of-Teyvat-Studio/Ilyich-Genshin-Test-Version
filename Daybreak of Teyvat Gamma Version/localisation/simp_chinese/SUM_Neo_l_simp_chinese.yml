 SUM_Neo_SGD_Combo_AH_View_desc:"稳定度 +15%、战争支持度 +10%"
 SUM_Neo_SGD_Combo_BH_View:"兵柄归旅"
 SUM_Neo_SGD_Combo_BH_View_desc:"政治点数获取 +20%、陆军攻击 +10%"

 #### 民族精神 ####
 SUM_SGD_I_Suzerain_Shadow:"藩服阴霾"
 SUM_SGD_I_Suzerain_Shadow_desc:"镀金沙漠在名分上仍是雨林的下属。政令要经教令院过目，才算数。一道道文书送往雨林，盖了印再送回来。这层名分虽薄，却像一道匾额，压得沙漠人抬不起头。"
 SUM_SGD_I_Eremite_Host:"客兵驻境"
 SUM_SGD_I_Eremite_Host_desc:"镀金旅团在沙漠里自有营寨与账房。替谁打仗，只看契约。钱给得足，刀便朝哪边。营寨里佣兵们擦刀磨枪，全无定主。草原上的狼养不熟，钱尽便散去。有分教：有钱便是主，有奶便是娘。"
 SUM_SGD_I_Desert_Grievance:"沙海宿衅"
 SUM_SGD_I_Desert_Grievance_desc:"雨林与沙漠之间的赋税与地界，几百年没有算清。这笔糊涂账越积越厚。两边的老人各执一词，都说自己有理。这账一日不算清，争端便一日不了，两边的血也就一日白流。"
 SUM_SGD_I_Scarce_Water:"水重于金"
 SUM_SGD_I_Scarce_Water_desc:"沙漠的水攥在少数人手里。谁分水，谁便说了算。水主坐在泉边，一句话便定了谁家浇地。一瓢水比一斗金还贵重，泉边的水主比国王还威风。有分教：水在人手，人在水下。"
 SUM_SGD_I_Caravan_Wealth:"贸涂之赢"
 SUM_SGD_I_Caravan_Wealth_desc:"旧道上的商队带来税，也带来消息，还带来外邦的耳目。金银与情报一并进了城。商队在市集卸货，四下张望的陌生人不少。这其中的利与害，一言难尽。"
 SUM_SGD_I_Red_King_Legacy:"赤王遗风"
 SUM_SGD_I_Red_King_Legacy_desc:"赤王留下的遗迹与传说，是沙漠人心里未熄的一团火。那火埋在沙下，风吹不灭。路人路过遗迹的石柱，都要摸一把。只等一阵风来，便要烧遍整个沙漠。有分教：赤王虽逝，火种犹存。"
 SUM_SGD_I_Tax_Heavy:"籍帐盈案"
 SUM_SGD_I_Tax_Heavy_desc:"税目一年比一年多。城民把账都记在心里，嘴上却不多说。税吏又添了新名目，百姓听了只是苦笑。可那账谁也不敢糊涂，一笔一画都刻在心里，只等有朝一日清算。"
 SUM_SGD_I_Tribal_Levy:"诸部之卒"
 SUM_SGD_I_Tribal_Levy_desc:"部族民兵自备兵器与口粮，听调不听编。叫你来便来，编入军籍却不肯。部族的人扛着自己的刀，成群而来。他们认的是自家首领，不是官署的印。有分教：自备刀粮，只听调遣。"
 SUM_SGD_I_Sand_League:"碛中连盟"
 SUM_SGD_I_Sand_League_desc:"诸城与诸部结成同盟，共抗雨林的敕令。大家拧成一股绳，便不怕那一纸文书。盟誓的旗一面面立起来。这一盟立起来，让雨林寝食难安，一纸敕令再没人肯买账。"
 SUM_SGD_I_Independent_Flag:"树不臣帜"
 SUM_SGD_I_Independent_Flag_desc:"红底飞鸟旗，立在各城城头。这旗一立，便是沙漠自己说了算。旗在风中猎猎作响，路人抬头便望见。那飞鸟像要在风里飞起来一般，路人望见，心里也跟着热了起来。有分教：旗插城头，自立门户。"
 SUM_SGD_I_Oasis_Republic:"洲中共政"
 SUM_SGD_I_Oasis_Republic_desc:"各城的执事共议国事，水与税都写在明处。事关众人，便由众人商量。议事厅里，执事们围坐一圈，争得不亦乐乎。众人的事众人商量，才做得长久。"
 SUM_SGD_I_Open_Market:"开市通商"
 SUM_SGD_I_Open_Market_desc:"集市不分内外，商队云集，税则公开。远来的近来的，一律照章办事。市集上各国旗号混在一处，吆喝声此起彼伏。那税则写得明明白白，贴在最显眼处。有分教：市开大门，货通天下。"
 SUM_SGD_I_Law_of_Sand:"沙碛立条"
 SUM_SGD_I_Law_of_Sand_desc:"一部合诸城诸部之规的律例立了起来。法官巡城而判，不论出身，一律按律。法官骑马巡城，升堂断案，围观者众。律例当前，王子庶民一律同罪，谁也休想仗着出身胡作非为。"
 SUM_SGD_I_Citizen_Militia:"立乡兵条"
 SUM_SGD_I_Citizen_Militia_desc:"各城出丁，平时务农，战时集合，粮从公出。放下锄头是百姓，拿起刀枪是兵。田间的汉子闻鼓声便扛刀而来。这般兵平时不费公粮，战时才聚，省粮又肯卖命。有分教：亦农亦兵，公粮养兵。"
 SUM_SGD_I_Desert_Commune:"碛中会议"
 SUM_SGD_I_Desert_Commune_desc:"水与地归公，契约与兵由两部共管。不分彼此，大家都有份。两部的人坐在一处，商议水怎么分、兵怎么调。两部互相牵制，谁也吞不了谁，水与兵便都落不到一人手里。"
 SUM_SGD_I_Twin_Oath:"两盟立国"
 SUM_SGD_I_Twin_Oath_desc:"赤王的旧誓与花神的旧盟，同刻一石，立在绿洲泉边。两块旧誓并作一处，谁也不得忘记。石碑上古字斑驳，泉水流过碑脚，两块旧誓并成了一条心。有分教：双誓立泉边，永世不相忘。"
 SUM_SGD_I_Public_Ledger:"立公籍法"
 SUM_SGD_I_Public_Ledger_desc:"团里的账目与税则一律公开，谁都能查。账摆在明处，便没人能中饱私囊。账册挂在墙上，识字的人围着看，指指点点。这一公开，堵住了许多人的嘴。"
 SUM_SGD_I_Scarlet_Crown:"赤沙加冕"
 SUM_SGD_I_Scarlet_Crown_desc:"重立的王统，以赤王为号。军、政、祀三样大权集于一身。王座之上，人身披红袍，台下众人俯首。那红袍用的是赤王旧日的颜色，袖口绣一排沙丘纹。有分教：赤王旧号，今人重称。"
 SUM_SGD_I_Militant_Desert:"沙海尚武"
 SUM_SGD_I_Militant_Desert_desc:"诸城诸部之兵编为一军，号令与粮饷统一，从此不再各吹各的号。校场之上，各路人马列队，听一人号令。从此如同一支军，再不是乌合之众。号令一出，各部无有不从。"
 SUM_SGD_I_Ruin_Works:"兴复故构"
 SUM_SGD_I_Ruin_Works_desc:"重开遗迹，拆旧石以筑新宫与军械。古人的柱子，今人的墙。工匠把雕花石柱砌进新城墙，花纹还朝外。古人的雕琢做了今人的墙，叫人看了称奇。有分教：拆古筑今，石亦有情。"
 SUM_SGD_I_Quiet_Land:"安于守成"
 SUM_SGD_I_Quiet_Land_desc:"不折腾，不扩张，把眼下的日子过稳。这个国策讲究的是一个稳字。城里百姓安业，四境无事。这道理朴素，却少有人肯依，能守住这份平淡的才是真本事。"

 #### 等级 / 共振 ####
 SUM_Neo_SGD_T1:"赤王遗烈"
 SUM_Neo_SGD_T1_desc:"头一档，赤王之名只剩传说。沙漠里的遗迹荒草丛生，祭礼停了几十年，无人问津，年轻的沙民只当是老人编的闲话。王者被忘，最是凄凉。石碑上的字，被风磨平了。"
 SUM_Neo_SGD_T2:"往事复举"
 SUM_Neo_SGD_T2_desc:"第二档，旧事重提。有人开始翻找沙下的石板与旧道，想从埋没的旧物里寻回赤王的痕迹。有人拿铲子敲开沙壳，果然露出半截石阶。这是要唤醒沉睡的历史。"
 SUM_Neo_SGD_T3:"故墟复启"
 SUM_Neo_SGD_T3_desc:"第三档，遗迹重开。赤王的旧名重新被人举起，成了一面可用的旗帜，沙漠里渐渐有了响应。各城纷纷竖起旧旗，遥相呼应。借古人之名，聚今人之心。断墙下，又有人摆起香案。"
 SUM_Neo_SGD_T4:"王统日隆"
 SUM_Neo_SGD_T4_desc:"第四档，王统渐立。沙漠各城以赤王为号，渐渐整合到一处，听同一声号令。从前各自为政的城主，如今同坐一张席。这便是要立新王，连远处的城也来送礼。"
 SUM_Neo_SGD_T5:"赤漠称尊"
 SUM_Neo_SGD_T5_desc:"第五档，赤沙之主。沙漠凭赤王的威名号令四方，谁敢不服。远处的城邦送来贡礼，近处的酋长亲自牵马执鞭，跪在沙地上听令。赤王虽古，余威犹在，四方诸侯望尘而拜。"
 SUM_Neo_SGD_U1:"部曲星散"
 SUM_Neo_SGD_U1_desc:"头一档，旅团离散。各支佣兵各投其主，四散而去，沙漠手里竟无兵可用，有钱也雇不到肯拼命的人了。佣兵认的是摩拉，沙地上连营盘都塌了半边。"
 SUM_Neo_SGD_U2:"券契纷如"
 SUM_Neo_SGD_U2_desc:"第二档，契约零散。镀金旅团只接些短约，今天来明天走，翻脸不认人，钱一到手便不见了人影，临阵还要先讲价钱。这般兵最难使唤，今日收钱，明日翻脸。"
 SUM_Neo_SGD_U3:"旅团宿卫"
 SUM_Neo_SGD_U3_desc:"第三档，旅团在侧。总算有一支可用的佣兵常驻沙漠，召之即来。他们扎下营盘，日日操练，夜里还有人巡哨，倒也像支正经兵马。手里有兵，心中不慌。"
 SUM_Neo_SGD_U4:"旅团向化"
 SUM_Neo_SGD_U4_desc:"第四档，旅团归心。佣兵与部族的兵编在一处，同听号令，不分彼此。起先还争个高下，后来并肩作战，便再分不出谁是谁的兵。拧成一股便是力量，一碗水两个人分着喝。"
 SUM_Neo_SGD_U5:"沙海砺锋"
 SUM_Neo_SGD_U5_desc:"第五档，沙海强军。沙漠的兵自己成了军，兵甲粮草不假外求。坑洞里藏着兵器，绿洲边建着粮仓，号旗一展，万骑齐发。能自立者方为真强，这支队锐不可当。"
 SUM_Neo_SGD_Combo_HH:"二王同兴"
 SUM_Neo_SGD_Combo_HH_desc:"赤王的旧名与旅团的刀锋合在一处，沙漠既有旗号又有拳头，如虎添翼。沙漠的子弟也肯读书识字了。名与实俱备，何事不成，连骆驼都披上了甲。"
 SUM_Neo_SGD_Combo_LL:"散碛无统"
 SUM_Neo_SGD_Combo_LL_desc:"旧名既弃，兵旅又散，沙漠退回一座座城池各自守着，再无远志。城与城之间连条像样的路都没有，遇事各顾各的，谁也不肯先出头。无旗无兵，只能守成。"
 SUM_Neo_SGD_Combo_AH:"王绪独隆"
 SUM_Neo_SGD_Combo_AH_desc:"沙海之上，赤王的旧名一抬出来，旅团的旗便矮了半截。佣兵收了刀，俯身去听王座上的号令。众人都道，枪杆子再硬，也硬不过一个死人的名头。"
 SUM_Neo_SGD_Combo_BH:"兵柄归旅"
 SUM_Neo_SGD_Combo_BH_desc:"旅团的人马从街口开过，赤王的牌位还挂在墙上，却没人抬头看。这一回开口的不是祭司，是账房，一纸契约压过十个旧名头。沙漠上认钱不认神，便自此日始。"

 #### 新闻 ####
 SUM_Neo_SGD_News.1.t:"沙赋有籍"
 SUM_Neo_SGD_News.1.d:"城门口围了一圈人，都伸着脖子看墙上新贴的榜，看罢谁也不吭声，只互相递个眼色，默默散了。这沉默比吵嚷还叫人心里发毛。教令院新造了一本税册，遣人送到镀金沙漠来，众人一瞧，税目比去年竟多出一栏。去年已是苛捐杂税多如牛毛，今年又添新名，分明是要从沙漠再刮一层油。有明白人背地里嘀咕：这多出来的一栏究竟是什么名堂，怎么念着比去年的还拗口？众人虽不懂，那股怨气却一天比一天重。有个识字的把新增那栏念出声来，众人听罢脸色都变了，原来这税目刁钻古怪，从前听都没听过。人群里不知谁先哼了一声，霎时怨声四起，像一锅冷水终于烧开。"
 SUM_Neo_SGD_News.1.a:"阅"
 SUM_Neo_SGD_News.2.t:"镀金旅团索直"
 SUM_Neo_SGD_News.2.d:"镀金旅团甩出新价目，白纸黑字摆桌上：明码标价，也明码卖命，一分摩拉一分货，半点不含糊。这伙人的规矩天下皆知，谁钱多刀就替谁使。沙漠商队一得风声，谁还敢照旧路走？连夜收拾驼驮改道，宁可多绕几天冤枉路，也不愿往刀口上撞。那一夜驼铃响到天亮，全是奔新道去的。手脚慢的第二天还在岔路口打转，就被前头的人催得满头是汗。说白了，这旅团本是沙漠的雇佣兵，认钱不认人；如今陡然改价，摆明是趁沙漠跟雨林闹腾，要趁乱发横财。商队都是明眼人，知道惹不起，唯有早早绕开。驼铃声渐行渐远，空道上只剩几串蹄印。"
 SUM_Neo_SGD_News.2.a:"阅"
 SUM_Neo_SGD_News.3.t:"沙底露碑"
 SUM_Neo_SGD_News.3.d:"自打那石板进了库房，就跟掉了进海里似的，再没露过面。事是这么起的：一支商队从古遗迹里挖出块石板，上头刻着谁也不认得的怪字，瞧年份久远，是件老物件。哪知官署得了信，当即派人拦住商队，硬说石板是贼赃，要充公。商队喊冤，说这是咱们一锹一锹挖出来的，怎么就成贼赃了？官署根本不听，一纸文书就把石板收走。外头传说纷纭：有说被上头官儿私下留着赏玩的，有说早熔了改做别的东西，到底怎样没人拿得出实据。也有人讲这是赤王年间的古迹，记着沙漠失落的秘密，官署怕落到外人手里才编了个赃物的名头。库房那把铜锁锈得发绿，几年没人开过了。"
 SUM_Neo_SGD_News.3.a:"阅"
 SUM_Neo_SGD_News.4.t:"渠通绿野"
 SUM_Neo_SGD_News.4.d:"渠水哗哗淌进城的那一刻，两岸黑压压站满了人，谁也不肯先走。沙漠几座城邦这回真拧成了一股绳，出人出钱，合力在沙地上掘出一条长渠，把远处的水一路引到城根底下。沙漠里水就是命，渠一通，几城的人全涌来看：清亮亮的水映着日头，哗哗地流。男女老少挤成一团，你挨我我挤你，从日中站到日暮还舍不得挪窝。有位老人蹲在渠边，伸手撩起一捧水，眼看着它从指缝里漏光，眼眶就红了。沙漠诸城向来各顾各的，为争一处水源动不动就吵，甚至动拳头；如今肯合力开渠，真是天大的造化。有见过旧渠的老人说，这渠一通，往后就不用再为水红脸了。"
 SUM_Neo_SGD_News.4.a:"阅"
 SUM_Neo_SGD_News.5.t:"帜植城闉"
 SUM_Neo_SGD_News.5.d:"红底金纹的新旗在城头升起来，旗面上绣一只展翅的飞鸟，日头一晒猎猎作响，好不威风。这旗一立，沙漠人就算有了自己的名号，不必再看谁的脸。偏过头瞧那旧日收税的官署，大门关得死死的，封条还好好贴着，早断了人进人出。门口几位白胡子长老捧一卷盟约，摇头晃脑念给过路人听，念的是各族旧誓，讲的是沙漠独立。行人有停下听两句的，也有低头匆匆走的，可那面飞鸟旗，谁都瞧进眼里了。原来各部为这旗式商量了许久，取飞鸟就是要那自由的意思。旗升起来的一刻，城头兵卒齐齐朝它行礼，人群里有人悄悄抹了眼角。几个孩子仰着头数金线，被大人一把拉走。"
 SUM_Neo_SGD_News.5.a:"阅"
 SUM_Neo_SGD_News.6.t:"驼群东迈"
 SUM_Neo_SGD_News.6.d:"十个关卡空了五个，守关兵丁背靠土墙打鼾，日头晒到脸上也不醒。往年这时候，雨林那边的关口早就车马挤得水泄不通了。如今为何这般冷清？只因沙漠人改了路数。先前驼队总驮着贡品往雨林送，如今两边翻了脸，谁还肯把好东西白填进去进贡。贡品一律改走海路：赶到港口，装船下海，换回白花花的摩拉。原先那些货要过雨林层层关卡，一路剥皮抽筋，到了教令院手里十成去了大半；改走海路少了这些雁过拔毛的关节，卖价反倒更俏，沙漠人自然乐意。有那闲得发慌的兵卒，望着空荡荡的官道，忍不住长长打个哈欠。港口的货栈却忙得脚不沾地，摩拉一箱箱堆得满满当当。"
 SUM_Neo_SGD_News.6.a:"阅"
 SUM_Neo_SGD_News.7.t:"王座复辉"
 SUM_Neo_SGD_News.7.d:"废墟上，沙漠人搬来石块一层层垒，砌成一座方方正正的高台，比不得古迹气派，却也稳当。台子落成，沙漠便在上头立了自己的王。沙漠多少年没王了？这一立，是天大的事。新王披甲执剑立在台顶，往下望着；台下军伍早按令排齐，一队挨一队刀枪如林，静得连喘气声都轻。号角一响，三军齐吼，声浪在残垣间来回撞，惊起一群歇着的鸟。这位新王原是沙漠里极有威望的长老，众人推他坐上这位子。他一登台，底下欢声像潮水，都说沙漠总算有了主心骨。飞鸟旗在台边立着，被风一吹，正对新王的脸。"
 SUM_Neo_SGD_News.7.a:"阅"
 SUM_Neo_SGD_News.8.t:"耆宿发籍"
 SUM_Neo_SGD_News.8.d:"念到一半，忽然来了一阵风，把抄好的纸页吹得哗哗响，其中一张打着旋飞上半空，转眼飘得没影了。长老愣了一愣，众人仰头望着，有人笑有人叹，都说这是天意。原来沙漠的长老把各族旧誓抄在了一处，当着各城的人一篇篇念下去。这些旧誓是各城邦、部族祖辈传下来的，写着沙漠人的根，说着沙漠人的魂；念的是古老誓言，讲的是往日荣光。听的人越聚越多，把念誓的长老围在中间。沙漠各部离散多年、彼此猜忌，如今重念旧誓，正是要大家记起同根同源，重新拧成一股绳。那长老念得分外郑重，众人也听得肃然，半晌没人出声。"
 SUM_Neo_SGD_News.8.a:"阅"
 SUM_Neo_SGD_News.9.t:"隘口易主"
 SUM_Neo_SGD_News.9.d:"墙一砖一石没动，守墙的人却换了。雨林插进沙漠的第一道关到底易了主：高墙依旧，砖石完好，改的只是旗和人。先前关头飘的是雨林旗，站的是雨林兵；如今换成沙漠的红底飞鸟旗，守关的也成了沙漠将士。城门还是那座城门，里外的主人却换了姓。走惯这条道的行商到了关前一下愣住，险些认不出还是不是从前那道关。守关的沙漠兵把枪一横，喝令过往行人登记。这关一到手，兵卒便在墙上架起新磨的滚木礌石，把关门加固得跟铁桶似的。商旅们一眼就明白这条大道换了东家，走起来都格外留神。关前老槐树下，几个货郎放下担子探头打量那面新旗。"
 SUM_Neo_SGD_News.9.a:"阅"
 SUM_Neo_SGD_News.10.t:"移师伐林"
 SUM_Neo_SGD_News.10.d:"向导骑着骆驼，一边认路一边跟身旁士卒念叨：再走十天，那须弥城的尖塔就该望见了。那塔是教令院所在，是大贤者阿扎尔的治所，也是这趟的终点。士卒听了精神一抖，脚下也紧了。他们里头不少是绿洲长大，连雨林是啥样都没见过，更别提须弥城的塔了。大军离开熟门熟路的绿洲一路东行，越走林子越密、潮气越重，跟沙漠两回事。这十天不算长也不算短，走惯黄沙的兵马头回踏进湿热的雨林，人畜都觉着不得劲，可没有一个掉头。一脚踩进湿泥，有个年轻兵卒滑了一跤，惹得周围低低笑了几声。"
 SUM_Neo_SGD_News.10.a:"阅"
 #################### 哈德拉玛维特 ####################
 #### 序章 · 主母的权柄 ####
 SUM_SDH_PRO_The_Matriarchs_Hold:"主母秉钧"
 SUM_SDH_PRO_The_Matriarchs_Hold_desc:"哈德拉玛维特的规矩，由主母定。谁能进哪座城、谁能拜哪座龛、商队的货分几成，都听主母一句话。雨林的敕令贴在城门上，主母不点头，风就把纸刮走了，无人敢多议。"
 SUM_Neo_SDH.1.t:"主母秉钧"
 SUM_Neo_SDH.1.d:"城门上贴着一张雨林来的敕令，明晃晃的，要沙漠这边如何如何。可主母连瞧都懒得瞧，既不点头也不吭声。一阵风过来，把那纸吹得猎猎响，纸角翻卷，转眼刮得没了影，城门口的人看着，谁也不敢上手去捡。原来哈德拉玛维特这地方，从上到下都听主母的：谁能进城、谁能拜龛、商队货分几成，大小事全凭她一句话，金口一开再无更改。此地偏远，天高皇帝远，雨林的敕令就算贴到城门上也不过一张废纸，还抵不上主母一个眼色。主母的规矩却深得很，从城头到村尾，人人遵守，没人打半点折扣。"
 SUM_Neo_SDH.1.a:"循教令院发下的旧例"
 SUM_Neo_SDH.1.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Matriarch_Word:"主母发语"
 SUM_SDH_PRO_Matriarch_Word_desc:"主母端坐厅上，平日话不多，可每开一句口，底下便有人提笔抄下。抄的不是家常话，是一条条要人照办的规矩。众人抄了又抄，谁也不敢添半个字，句句算数。"
 SUM_Neo_SDH.2.t:"主母发语"
 SUM_Neo_SDH.2.d:"主母开口，底下人便提笔。她话说得短，一句是一句，可每句落地都成了章程，半点含糊不得。在这地方，主母的言语不是寻常闲话，是人人得照办的规矩，所以书记、长老都支棱着耳朵，她说一句记一句，生怕漏掉半个字。记下的是章程，不是什么商量着办的意见。有个才来的后生不懂规矩，想跟着凑两句嘴，被旁边老者一把攥住袖口，悄悄摆手不叫他造次。主母端坐上首，眼光慢慢扫过堂下一圈，众人便齐齐把头低下。当天记下的规矩就交快马分送各城，贴到路口要道，好让来往行人都能瞧见。主母平日深居简出，可她吐出的话，传得比风还快。"
 SUM_Neo_SDH.2.a:"把账目封存"
 SUM_Neo_SDH.2.b:"把账目摊开"
 SUM_SDH_PRO_Babel_Line:"芭别尔之胤"
 SUM_SDH_PRO_Babel_Line_desc:"现任主母的名字，是从母亲那里传下来的，母亲的名字又来自上一任。这条线一年年拉得极长，长得叫人不敢深问，只怕一路问上去，连自己是谁都辨不清。族里的谱系簿卷在毡子里，谁也不许翻。"
 SUM_Neo_SDH.3.t:"芭别尔之胤"
 SUM_Neo_SDH.3.d:"这名字打哪儿来的？有个后生仗着酒意，壮着胆子想问个明白：最早那任主母究竟是谁？话刚出口，旁边人一个眼色就把他噎了回去，再不敢往下讲。现任主母的名字是从母亲那儿传下来的，母亲的名字又从上一任传来，一代代往上数，这条线长得叫人不敢深究。名字里藏着哈德拉玛维特的传承，是主母一脉相承的名分，来路却有些说不清道不明，越往上追越缥缈，追到最后便钻进那些不敢深究的传说里去了。原来此地人相信，名字里头住着先人的魂；叫着这名字，先人就像还活着，还在替大伙儿做主。"
 SUM_Neo_SDH.3.a:"按官署的判断行事"
 SUM_Neo_SDH.3.b:"按自己的判断行事"
 SUM_SDH_PRO_Tribe_Council:"部族序位"
 SUM_SDH_PRO_Tribe_Council_desc:"各支部族议事，座次离主母越近的，分到的水便越多。这座次年年重排，排一回便吵一回。争的不是脸面，是那几口井的活水，座位就是水，谁也不肯让。"
 SUM_Neo_SDH.4.t:"部族序位"
 SUM_Neo_SDH.4.d:"离主母越近，分的水越多，就为这一条，各部族的座次年年都要吵翻天。沙漠地面水就是命，多分一瓢就多养活一口人，所以这座位谁都盯着。座次不是定死不改的，每隔一年重排一回，每回一排，各部族便争作一团：你说该坐前头，他说该居后面，吵得脸红耳赤不肯松口。有一年重排，几个族的首领在厅上从早上吵到晌午，嗓子都干了，还是主母冷冷撂下一句，众人才悻悻闭嘴，按新排的位子坐下。分水的多寡关系到一族的死活，所以这座位之争从来不是赌气；各族都把历年出的力、立的功掰着指头数了又数，恨不得把凳子搬到主母脚跟前去。"
 SUM_Neo_SDH.4.a:"先看住脚下的城"
 SUM_Neo_SDH.4.b:"先看住远方的人"
 SUM_SDH_PRO_Silent_Law:"俗约无文"
 SUM_SDH_PRO_Silent_Law_desc:"主母立的规矩，大多不落成文字，全靠人一个传一个。传的人多了这句、少了那句，规矩就变了模样。传到后来，连立的本人也认不出自家的规矩了。"
 SUM_Neo_SDH.5.t:"俗约无文"
 SUM_Neo_SDH.5.d:"同一句话，老辈人这么说，少辈人那么讲，各人有各人的版本，这是哈德拉玛维特最头疼的事。主母立的规矩多半不落纸笔：不刻碑，不写册，全凭人一代代嘴传。嘴传就难免走样，你多记一句他少记一句，添枝加叶，以讹传讹，传着传着就变了味。同一条章程，张三听到的跟李四听到的对不上号，人人都说自己听的才是主母原话。为这事儿闹过一回：两拨人为一处水塘归谁用，各搬出一条祖传的规矩来，吵得脸红脖子粗，谁也压不服谁，末了只好去请主母亲口断案。主母没法，当着重把规矩说了一遍，才算把事平下去。其实主母早知道有这等偏差，却也不急着纠正，任由它去。厅上议事时，长老们各执一词，谁都拿不出个准稿。"
 SUM_Neo_SDH.5.a:"循教令院发下的旧例"
 SUM_Neo_SDH.5.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Oath_Mistress:"向主母盟"
 SUM_SDH_PRO_Oath_Mistress_desc:"入部的人都要在主母面前立誓，誓词照着花神的名头发。立誓当日，人人屏息，无敢出声。立了誓的日后若是翻脸，便是渎神，连鬼神都请来做了见证。"
 SUM_Neo_SDH.6.t:"向主母盟"
 SUM_Neo_SDH.6.d:"想踏进部族，先得在主母面前立一个誓，誓是冲着花神名头起的。沙漠地界，花神是众人心里最重的神，拿她名头发誓，等于把身家性命一并压上。誓一立，便是部里人，有福同享，有祸同当；可这誓也是根绳：日后若是反水，就不是寻常的失信，而是渎神的大罪，天地不容，众人共弃。所以那场面庄严得很：立誓的人跪在地下，跟着长老一字一句念，念到花神名头时，个个面色凝重，不敢有半点轻忽。这规矩是从花神诞祭传下来的，祭日立的誓格外郑重，就算平日再顽的汉子，到了这天也收敛几分。香炉里青烟袅袅，跪着的人额头都贴到了冰凉的地上。"
 SUM_Neo_SDH.6.a:"把账目封存"
 SUM_Neo_SDH.6.b:"把账目摊开"
 SUM_SDH_PRO_Edict_Wall:"榜于城门"
 SUM_SDH_PRO_Edict_Wall_desc:"教令院的敕令贴在城门上，管的是赋税与驻军两桩大事。看的人倒多，围了一层又一层，可照着办的没几个。众人看过便散，公文一张管不住人心，墙还在，令已成空文。"
 SUM_Neo_SDH.7.t:"榜于城门"
 SUM_Neo_SDH.7.d:"雨林那张新敕令贴出来没几天，纸边就让风卷了角，墨字也叫毒日头晒得发淡。这回说的是纳贡和驻兵两桩事，写得清清楚楚，要沙漠照着办。围看的人里三层外三层，指指点点议论不休，可真肯照办的没几个：有的瞄一眼撇撇嘴扭头就走，有的凑上去装模作样看两眼，其实一个字没进脑子。雨林打发的官儿守在旁边，左等右等不见回音，急得团团转也没处说理。其实这敕令贴了撕、撕了贴，雨林自己心里也明白是白费劲，可照旧按期送来，好像贴上去就算尽了责。城门口的百姓早看惯了这张纸，连眼皮都懒得抬一下。"
 SUM_Neo_SDH.7.a:"按官署的判断行事"
 SUM_Neo_SDH.7.b:"按自己的判断行事"
 SUM_SDH_PRO_Tax_Officer:"教令院征胥"
 SUM_SDH_PRO_Tax_Officer_desc:"税吏挟着账本来收账，那账本摞起来比人还高。主母见了也不翻账，只请他喝一盏茶。一盏茶未喝完，账目便短了一大截。会喝茶也会办事，谁也不问短在何处。"
 SUM_Neo_SDH.8.t:"教令院征胥"
 SUM_Neo_SDH.8.d:"雨林那个税官踏进沙地时，怀里抱着一摞账簿，高得遮住了脸，压得他气都喘不匀，心道这趟稳了，沙漠历年欠下的税今日定要收个干净。主母将他迎进帐中，开口不提账，先吩咐上茶。那茶是沙里头顶好的，一盏接一盏地端，香气在帐子里打转。税官连饮数盏，头脑渐渐发沉，低头再翻账簿，咦，怎么数目少了一大截？他哪里知晓，就在他举杯的工夫，主母手下人早把那几页翻来覆去，该勾的勾，该划的划，一笔笔抹得干净。待他醒过神，账早已对不上，脸涨得紫红。欲待发作，几盏茶下来，话头尽被主母东扯西拉岔开，再提账目自己先矮了三分。没奈何，抱着那本缺了页的账簿，耷拉着脑袋回雨林复命去了。"
 SUM_Neo_SDH.8.a:"先看住脚下的城"
 SUM_Neo_SDH.8.b:"先看住远方的人"
 SUM_SDH_PRO_Forest_Guard:"林薮戍兵"
 SUM_SDH_PRO_Forest_Guard_desc:"雨林在几处要道设了戍所，戍卒都是外乡人，认不得沙地的路。出门办事少不得要雇个本地人引路。这引路的一开口，价钱便由不得你了。强龙难压地头蛇，价高也得认。"
 SUM_Neo_SDH.9.t:"林薮戍兵"
 SUM_Neo_SDH.9.d:"沙海里头，有一桩笑谈。雨林在要道上筑了几处戍所，驻的却都是水乡来的兵，一双眼睛认得稻田港汊，哪里识得沙丘？出了营门，但见黄沙连天，这座沙丘和那座生得一模一样，走上没多远便晕头转向，连营门都摸不回去。没法子，凡出门巡粮办差，先得雇个本地人引路。那向导骑头骆驼在前头慢慢晃，雨林兵卒牵着马在后头紧撵，眼睛一眨也不敢眨，生怕跟丢了人。有个自作聪明的不信邪，偏不肯雇向导，独自出去，在沙里兜了两日两夜，水囊早空，险些渴死，末了还是被寻了回来。那班向导也乐得赚这份钱，骆驼骑得优哉游哉，碰上难走的沙窝便勒住缰绳，指东划西，把兵卒支使得晕头转向，自己却在驼背上乘凉。"
 SUM_Neo_SDH.9.a:"循教令院发下的旧例"
 SUM_Neo_SDH.9.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Survey_Team:"遣人量地"
 SUM_SDH_PRO_Survey_Team_desc:"测绘队画了三年地图，几处水源的位置竟标错了。主母拿到图，看也不改，只淡淡收在一边。错了的图正好叫外人照着走岔了路。将错就错，也是一计。"
 SUM_Neo_SDH.10.t:"水图误注"
 SUM_Neo_SDH.10.d:"雨林的兵马在沙海里连着迷了几回路，险些把一支人马整个丢在里头，根源却在一张图上。原来雨林测绘队在沙地苦了三年，风餐露宿画成一张地图，偏偏把好几处水源都标错了地方。沙漠里，水就是命，标错一处便是要人的命。这错处主母心里雪亮，却压着不改。她打的算盘明白得很：图留着错，雨林的军队照着走，到了沙里自然寻不见水，吃尽苦头。主母只冷眼瞧着，装作不知。她手底下那班老人，哪处井深哪处井浅、哪口井旱季会干，肚里都有一本清账，只是从不落笔，怕落了把柄在人手里。"
 SUM_Neo_SDH.10.a:"把账目封存"
 SUM_Neo_SDH.10.b:"把账目摊开"
 SUM_SDH_PRO_Hidden_Accounts:"别发旧籍"
 SUM_SDH_PRO_Hidden_Accounts_desc:"主母另有一本账，记的是替各部悄悄藏下的粮与钱。这本账从不给人看，锁在贴身的匣里，匣子上裹一层毡。藏的是粮，也是各部的把柄，人人离不开。连总管也不知那匣子夜里放在何处。"
 SUM_Neo_SDH.11.t:"别发旧籍"
 SUM_Neo_SDH.11.d:"主母的柜子里，藏着一本谁也摸不着的账。这账记的，不是金银往来，是她替沙漠各部悄悄攒下的家底。沙地里部族兴衰无定，今日风光，明日就可能落难，主母便替他们把一部分粮钱收着，替他们留一条后路。哪个部族遭了灾，她便从这账上支取，照数接济。可这本账守得极严，除她自己，谁也不许翻。有个胆大的凑上去想瞧一眼，主母把账本往怀里一拢，淡淡一句：「这本账，你看不得。」那人伸出的手便缩了回去，众人再不敢多问。托付来的粮钱，主母分文不动，到了灾年，一文不少照数发还。就为这，各部都信她，便是倾家荡产托给她，也没有半分迟疑。"
 SUM_Neo_SDH.11.a:"按官署的判断行事"
 SUM_Neo_SDH.11.b:"按自己的判断行事"
 SUM_SDH_PRO_Daughter_Floral:"花神遗胤"
 SUM_SDH_PRO_Daughter_Floral_desc:"历代主母都自称花神的女儿，信众也跟着这般叫。这名分比刀还好使，一刀只能压一人，名分却叫人人心里先软了三分。名字一出口，众人的头便低了。"
 SUM_Neo_SDH.12.t:"花神遗胤"
 SUM_Neo_SDH.12.d:"在沙地，刀能按住人的身子，却按不住人的心，主母手里有一样比刀更好使的东西，那便是花神女儿的名头。历代主母，代代都自称花神亲生，一任传一任，从没断过；信众见了她，也尊一声花神的女儿。花神是这一方人的信仰，主母既是神的女儿，便是替神在人间办事，说出的话自带几分天意，由不得人不服。所以每逢大事，主母总把花神抬出来，众人便再没二话。这名分还有一桩便宜：各部有了争执，都乐意请主母断，只因她顶着神女的名头，断起事来天生带着三分公道，谁也不好意思再闹。"
 SUM_Neo_SDH.12.a:"先看住脚下的城"
 SUM_Neo_SDH.12.b:"先看住远方的人"
 SUM_SDH_PRO_Floral_Fete:"花神诞祭启幕"
 SUM_SDH_PRO_Floral_Fete_desc:"花神诞祭在几处绿洲同时开锣，香火缭绕，歌乐连着响了七夜。卖花的耍把戏的沿街摆开。来的人比往年多了许多，把绿洲挤得水泄不通。沙地一年里就盼这一回热闹。"
 SUM_Neo_SDH.13.t:"花神诞祭启幕"
 SUM_Neo_SDH.13.d:"天亮时摸一把祭坛上的香灰，竟还是温的，那热气是从千百颗诚心里烧出来的。这年花神诞祭，好几处绿洲一齐办，一连热闹七夜。各家各户亲手点香，一炷香，一桩心愿，七夜下来，香灰积了寸把厚。朝拜的人比往年多得多，老的少的，从四面八方涌来，把绿洲挤得水泄不通。白日里，鲜花供品摆满祭坛，人们载歌载舞；一入夜，篝火点起，歌声鼓声欢笑声搅在一处，直闹到天光。香火日夜不断，烟绕着塔顶飘，把人的脸都熏得朦胧。那灰底下的热，是信众一夜一夜守出来的。"
 SUM_Neo_SDH.13.a:"循教令院发下的旧例"
 SUM_Neo_SDH.13.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Shrine_Village:"村口置龛"
 SUM_SDH_PRO_Shrine_Village_desc:"各村在村头立一处小小的神龛，龛前不设官，只留一个照看的老人。不过添油扫地，可村里的大小事倒都先来问他一声。官虽小，众人却都得给面子。"
 SUM_Neo_SDH.14.t:"村口置龛"
 SUM_Neo_SDH.14.d:"看龛的是个无儿无女的老头，把村头那座小神龛当成了自家的营生，每日晨昏两趟，添花、换水、扫地，风雨无阻。那龛不过丈许见方，供着花神神位，摆着鲜花清水，村里人敬它，却不设官也不设吏。谁来上香许愿，老头既不问长问短，也不登记名姓，只笑眯眯蹲在一旁。有外乡人路过，见这龛朴素，心里倒生敬意，上前一拜。老头不多话，只淡淡丢一句：「心诚则灵。」村里人也敬这老头，逢年过节总送些吃食过去。那神龛被他照看得了尘不染，花香水清，成了村头一景。"
 SUM_Neo_SDH.14.a:"把账目封存"
 SUM_Neo_SDH.14.b:"把账目摊开"
 SUM_SDH_PRO_Pilgrim_Path:"谒庙微径"
 SUM_SDH_PRO_Pilgrim_Path_desc:"去绿洲朝圣的小路，有人常年打理，路面平，沿途也设有歇脚处。路上遇了人便结伴同行，遇了风便躲进沟里，香客络绎不绝。这小路走的人多了，也就成了大路。"
 SUM_Neo_SDH.15.t:"谒庙微径"
 SUM_Neo_SDH.15.d:"朝圣的人只觉着路好走，却不知是谁在暗中铺这条路。通往各处绿洲的小道，本穿沙过丘，难走得很，偏有人常年拾掇：坑洼填平，碎石拣净，岔口插上路标，便一天天平坦起来。这路是走的人多了，一脚一脚踩出来的。修路的人从不肯在人前露脸，专拣夜深时来补路，等天亮，道儿已经平了。香客走在道上，遇上别的一队，便结伴同行，说说笑笑，驼铃叮当，倒也不寂寞。半道若起了大风，飞沙走石，众人便寻条沙沟躲进去，等风头过再赶路。那一队队人朝着绿洲走，谁也不知道脚下这条路，是有人夜里替他们修的。"
 SUM_Neo_SDH.15.a:"按官署的判断行事"
 SUM_Neo_SDH.15.b:"按自己的判断行事"
 SUM_SDH_PRO_Floral_Way:"花神遗径"
 SUM_SDH_PRO_Floral_Way_desc:"信众把花神的旧诗编成歌，在田间唱，在驼背上唱，在火堆边也唱。唱的是老故事，可唱着唱着，人人心里便都认下了同一个花神。歌声一响，远近都应和。"
 SUM_Neo_SDH.16.t:"花神遗径"
 SUM_Neo_SDH.16.d:"有个老歌手，能从日头偏西唱到月亮上来，一口气唱几十段，听的人围了一圈又一圈，都听呆了。他唱的，是花神留下的旧诗谱成的曲。那些诗原是花神有感而发，字字珠玑，配上调子，便成了动人歌儿，到处传唱。田间地头，农人一边薅草一边哼；驼背上头，行商和着驼铃低低地吟；篝火边上，众人围坐放开嗓子唱。唱的人越来越多，传得越来越远，把花神的故事、沙海的传说都唱进人心里。连最偏僻的绿洲，夜里有火的地方也有人在唱。花神的故事，就靠这一支支曲子，越过沙海，一代一代传了下来。"
 SUM_Neo_SDH.16.a:"先看住脚下的城"
 SUM_Neo_SDH.16.b:"先看住远方的人"
 SUM_SDH_PRO_Storm_Season:"沙期又至"
 SUM_SDH_PRO_Storm_Season_desc:"一年里有三个月刮风，风一起黄沙蔽日，商队只得停摆。城与城之间断了往来，连送信的人也困在道上。人人闭户，个个愁风，这三个月比打仗还叫人难受。"
 SUM_Neo_SDH.17.t:"三春沙作"
 SUM_Neo_SDH.17.d:"一阵旋风卷过来，驼铃霎时乱成一团，人畜都睁不开眼，商队只好就地卧倒，拿毡布把货裹了又裹，连驼峰也蒙上。这是哈德拉玛维特常有的景。这里一年里有三个月刮风，风一起，飞沙遮得满天昏黄，大白日也像傍晚，日头成了一团模糊的黄。城中城外的驼道，登时断了往来。原来这三个月天时注定，风年年如期而至，谁也拗不过。行商没法，只得寻背风的沟壑歇下，一歇便是十天半月，干粮吃尽就挖沙里的草根填肚。有那性急的偏要赶路，结果辨不清方向，在沙里转来转去又转回原地，险些渴死半道。细沙打在脸上生疼，众人裹紧头巾，一步一步往前挨。"
 SUM_Neo_SDH.17.a:"循教令院发下的旧例"
 SUM_Neo_SDH.17.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Caravan_Toll:"行商分赢"
 SUM_SDH_PRO_Caravan_Toll_desc:"过境的商队要留一成货给主母，买的是一路平安。货卸在关上，驼铃尚未停，验货的人已经在数口袋。有舍不得的吃过一次亏，第二回便乖乖留货，一成比买命还值。"
 SUM_Neo_SDH.18.t:"行商分赢"
 SUM_Neo_SDH.18.d:"有两座沙丘之间，一队骆驼困了半天，前进不得后退不得，人和货都蔫了，最后还是主母的人挑了水来，才解了围。行商走过哈德拉玛维特，都得守一条规矩，货十成留一成给主母。这一成看着扎心，却没谁不肯留，因为这一成不是白送，是买一路平安。收了货，主母便放话：沿路的水井、驼道、歇脚营地都归她照管，若有不开眼的强人来打劫，她的刀就出鞘，管叫那人有来无回。商队宁可少赚一成，也图个一路清静。你把货卸下，过秤、记账、交割清楚，主母的人便在驼队前头插面小旗，一路护到地界尽头，遇上缺水的还替你寻井打水。花钱免灾，自古皆然。"
 SUM_Neo_SDH.18.a:"把账目封存"
 SUM_Neo_SDH.18.b:"把账目摊开"
 SUM_SDH_PRO_Guide_Storm:"辨风之士"
 SUM_SDH_PRO_Guide_Storm_desc:"沙漠里有人能看云识风，比看星还准。这样的人出行，主母便请他在前头带路，众人见了都争着请他看一眼天。能人不在多，有一个在身边胜过金子一车，众人离了他寸步难行。"
 SUM_Neo_SDH.19.t:"辨风之士"
 SUM_Neo_SDH.19.d:"那老儿捋着白胡子，朝天上望了半晌，吐出四个字：今日且住。众人将信将疑，果然半日之后狂风大作，那些不信邪硬走的，尽数困在了沙里。主母帐下就养着这么个活神仙，须发雪白，两眼昏花，走起路来一步一颤，可只要抬头看云，便赛过神仙。沙漠里有种本事叫看云识风：瞧天上那云往哪边飘、卷成什么形状、是厚是薄是白是灰，便知明天刮不刮风、风从哪方来，比夜里看星星还准。每回商队要动身，先来问他，他说可走便走，说且住便住，从没错过。因此各部头人争着请他，便是送金子也不肯放。众人自此服了他，凡有远行，必先看云。"
 SUM_Neo_SDH.19.a:"按官署的判断行事"
 SUM_Neo_SDH.19.b:"按自己的判断行事"
 SUM_SDH_PRO_Salt_Road:"盐道如昔"
 SUM_SDH_PRO_Salt_Road_desc:"盐从北边盐场运来，一路要过三道卡子。每过一卡便添一层税，等到了地头，盐价已翻了三倍。盐商叫苦，百姓皱眉，吃苦的还是买盐的人。这盐价一涨，苦了挑担的人。"
 SUM_Neo_SDH.20.t:"盐道如昔"
 SUM_Neo_SDH.20.d:"城外五里那道关最狠。主母的人把一杆大秤横在路心，盐袋袋上秤，缺一斤也别想过。这盐从北边盐场一峰一峰驮来，一路要闯三道关卡：北边入口那道，点验驼队人数；沟壑口那道，盘查货担多少；最难过的是城外五里这第三道。每过一关便纳一回钱，三关走下来，盐价足足涨了三倍。玄机全在那杆秤上：秤星往上抬一线，商队就得多掏一成；秤手手腕那么一抖，亏你就吃定了。可盐是命根子，百姓顿顿离不得，再贵也得买。于是运盐的驼队年年不断，主母库房里的盐钱堆成了小山。掌秤的是主母的老人，年年守在这儿，商队叫什么名字他都记在心里，想在他手底下捣鬼，休想。"
 SUM_Neo_SDH.20.a:"先看住脚下的城"
 SUM_Neo_SDH.20.b:"先看住远方的人"
 SUM_SDH_PRO_Merc_Contract:"募彼游勇"
 SUM_SDH_PRO_Merc_Contract_desc:"主母不养常备军，遇了事才临时雇兵。雇来的兵认的是钱，不认花神，也不认主母。钱一到手便卖命，钱若不到转身就走。所以主母宁可多养几条盐路，这兵靠不住。"
 SUM_Neo_SDH.21.t:"募彼游勇"
 SUM_Neo_SDH.21.d:"却说敌兵都压到境上了，那伙雇来的兵却按兵不动，躲在帐里喝酒，直到主母的银子送到，才呐喊着冲上去。原来主母治下从不养常备兵。养兵要粮要饷，日日烧钱，她舍不得，所以一遇商路被截、哪部闹事，就临时去雇。雇来的多是四方游荡的悍客，谁的价高便投谁，今天还在这部，明天就跑到那部。主母银钱发下，他们便提刀跨驼，替她去拼命；银钱一停，立时作鸟兽散，招呼都不打。这等人认的是钱，什么花神、什么主母颜面，一概不认。部将看不过，劝她索性养一支自家的兵，主母只摇头，说养兵太费钱，到底不如雇的划算。"
 SUM_Neo_SDH.21.a:"循教令院发下的旧例"
 SUM_Neo_SDH.21.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Thousand_Ravine:"千壑之乡"
 SUM_SDH_PRO_Thousand_Ravine_desc:"沙地深处沟壑纵横，岔路极多，外人进去多半转不出来。不是贪险，是为了躲人。追兵尽走大道，谁也想不到你钻兽径，等你从另一头出来早没影了。"
 SUM_Neo_SDH.22.t:"千壑之乡"
 SUM_Neo_SDH.22.d:"哈德拉玛维特的沙地底下，藏着一座天生的迷宫：沟壑一道套一道，窄得只容一人侧身，两壁像被刀劈过，头顶漏下一线天，脚下深不见底。外人管这叫绝地，提起便脑门冒汗，宁可绕远也不沾边。误进去的人，转上三天也找不着口子，喊到嗓子哑了没人搭理，渴死饿死的不少。可本地人偏往里钻，他们不是迷路，是躲人。谁家结了仇、犯了族规，便一头扎进沟里，找个石窟猫着。外人找不着，自家人却能摸到，夜里偷偷送进饭去，一藏就是半年，风头过了才敢露脸。一条沟，本是困人的牢，到头来倒成了犯事人的护身符，宁可在里头吃半年苦，也不肯出来伏法。"
 SUM_Neo_SDH.22.a:"把账目封存"
 SUM_Neo_SDH.22.b:"把账目摊开"
 SUM_SDH_PRO_Hidden_Well:"凿一伏井"
 SUM_SDH_PRO_Hidden_Well_desc:"沙地里藏着几口井，从不标在图上，是各部留给自己人的后路。寻常人等寻不见，便是寻见也未必肯说。藏的是水，也是命，人人守口如瓶，荒年就靠它活命，谁也不敢往外说半个字。"
 SUM_Neo_SDH.23.t:"沙底蕴泉"
 SUM_Neo_SDH.23.d:"部族被人追赶，眼看大难临头，便奔那几口秘井而来，搬开乱石掀起盖板，伏下去痛饮一气，又把皮囊灌足，这才不慌不忙上路。这样的古井，沙地里藏着几口，从来不标明在地图上。井口压一块石板，再拿枯草乱石掩盖，人若不到跟前，根本看不出这里藏着井。有了这几口井，部族便留了一条后路，遇事不至于束手待毙。主母也派人寻过，可藏井的人守口如瓶，任你严刑拷打，就是一个字不吐，宁可挨皮鞭。为这几口井，有几部争过几回，几乎动了刀子，后来立下规矩：谁先寻着，谁先用，这才作罢。明路上走的是众人，暗井里留的是自家。"
 SUM_Neo_SDH.23.a:"按官署的判断行事"
 SUM_Neo_SDH.23.b:"按自己的判断行事"
 SUM_SDH_PRO_Storm_Camp:"风前立垒"
 SUM_SDH_PRO_Storm_Camp_desc:"营地在沟壑背风的一面扎下，风再大也掀不翻。这样的营地有几十处，一处挨着一处。兵马歇在其中睡得格外安稳，风沙近不了身。这背风的沟里扎营最是稳妥。"
 SUM_Neo_SDH.24.t:"风前立垒"
 SUM_Neo_SDH.24.d:"行商远远望见那道背风的土梁，便知到了营地，翻身下驼，把货往帐里一扔，先要碗热茶润喉。各部扎营自有讲究：从不拣当风的高处，专挑沟壑背风的那一面安营。风再大，也被土梁挡住，吹进营里只剩一丝，连火塘都吹不灭。帐子压得低低的，四角拿石头坠住，绳子绷得紧紧的，狂风再凶也掀它不动。这样的营，哈德拉玛维特地面有几十处，星星点点散在各条沟里，各有各的名号。哪部遇上大风，便奔最近的营地躲进去，人畜安顿妥帖，还能生火煮茶。主母巡行各部，也借这些营地歇脚，从不另搭帐房。会扎营的，连风都算在前头。"
 SUM_Neo_SDH.24.a:"先看住脚下的城"
 SUM_Neo_SDH.24.b:"先看住远方的人"
 SUM_SDH_PRO_Beast_Cave:"林藏兽蹊"
 SUM_SDH_PRO_Beast_Cave_desc:"沟底的兽径又窄又险，没人愿意走。可真到了急头上，走兽径反倒最近。追兵尽走大道，谁也想不到你钻兽径，等你从另一头出来早没影了。路不在宽窄。"
 SUM_Neo_SDH.25.t:"绝壁兽蹊"
 SUM_Neo_SDH.25.d:"信使得了赏，在酒桌上却说，那条兽径，走一趟便不想再走第二趟，那是拿命换的路。沟壑底下有一条条兽径，那是野兽踩了几十年踩出来的，窄得像条线，一边是刀削的峭壁，一边是望不见底的深沟，人得贴着石壁侧身挪过去，脚下一滑，命就交代在沟里了。平日里谁也不愿走，宁可绕远走大道，多费些脚力。偏有一回，部里信使揣着封急信，事关全族生死，绕大道得多走两日，他把心一横钻进兽径，手脚并用攀着石壁，半道脚下一空险些坠下深沟，全靠死死攥住一丛灌木才爬过来，两只手掌磨得血肉模糊，硬生生半日就把信递到了。平常嫌它险，急时却靠它快。"
 SUM_Neo_SDH.25.a:"循教令院发下的旧例"
 SUM_Neo_SDH.25.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Old_Fort:"沙埋故垒"
 SUM_SDH_PRO_Old_Fort_desc:"旧堡是几十年前留下的，墙还立着，人早没了。没人记得，连碑上的字也被风沙磨平。有胆大的进去看，出来便说再不来了。空城一座，只剩断砖残瓦。"
 SUM_Neo_SDH.26.t:"沙埋故垒"
 SUM_Neo_SDH.26.d:"如今这堡子里，荒草长得比人膝盖还高，螺蛳壳和碎陶片满地都是，只剩墙头几只鸮鸟偶尔叫两声。谁也说不清它的来历，部里的老人只听上辈含糊提过一两句，年代太久，早没人记得了。只知道几十年前，这里曾住着百来口人，一场大风沙把堡子埋去半截，人便陆陆续续走光了。如今夯土墙给风啃出一道道深沟，皱得像张老脸，齐整的垛口还依稀认得出来。主母下过话，这是前人留下的遗产，谁也不许动，更不许拆。有部族路过进来避风，捡几块完整陶片揣进怀里，好做个念想。堡里没人了，墙还在，风年年照旧吹。"
 SUM_Neo_SDH.26.a:"把账目封存"
 SUM_Neo_SDH.26.b:"把账目摊开"
 SUM_SDH_PRO_Expedition:"探幽著籍"
 SUM_SDH_PRO_Expedition_desc:"有一支探险队出过沙漠，回来的人比去时少了好几个。名单上划掉的名字，从此再没人提起。问及同行的人，活下来的都低头不语。这沙漠深处，埋了多少故事。"
 SUM_Neo_SDH.27.t:"探幽著籍"
 SUM_Neo_SDH.27.d:"问那些随行回来的老人，这几个名字是怎么没的，他们只低着头不吭声，把话往别处岔，有的干脆捂住耳朵不肯听。早年间，有一支探险队出了沙漠，去闯那片没人到过的地面。出发时人马齐整，点名一个不缺，驼铃响得欢，人人脸上堆着笑。回来时却七零八落，折了好几个，驼背上空了好几峰。花名册上，那几个名字被朱笔一道道划去，那朱痕艳得刺目，像新淌的血。怪就怪在，打这以后谁也不提这几个名字，仿佛一出口便要招来什么。名字像是从世上抹掉了，亲人不敢问，祭礼上不念，连牌位都撤了，好像这几个人从来没来过。去时是活生生的人，回来只剩册上几道朱痕，到底出了什么事，竟没人肯讲。"
 SUM_Neo_SDH.27.a:"按官署的判断行事"
 SUM_Neo_SDH.27.b:"按自己的判断行事"
 SUM_SDH_PRO_Samir_Line:"萨梅尔式"
 SUM_SDH_PRO_Samir_Line_desc:"萨梅尔留过几张图纸，画的是某处遗迹的入口。这几张图纸后来被主母收了去，锁进贴身的箱子里。有人求看一眼，主母只当不曾听见，钥匙也不知交到了谁手。"
 SUM_Neo_SDH.28.t:"萨梅尔式"
 SUM_Neo_SDH.28.d:"那铁箱的锁换过三回，钥匙却始终只在一人手里，旁人连箱盖长什么样都没见过。这人便是主母，钥匙她贴身收着，连睡下也不离身。箱里卷着几张图纸，画图的是个懂古物的萨梅尔，一辈子心血都扑在那处遗迹上。他生前留下这几张图，密密麻麻标着遗迹入口：沙丘怎么走、石门朝哪开，还有几行谁也认不全的古字，旁边缀着小字注解。萨梅尔一死，图就落到主母手中。主母也不声张，寻来铁箱把图卷好锁进去，有人问起，只说是萨梅尔的遗物，替他收着罢了。可她隔三差五便取出来看，一看就是半晌。图是死物，门在何方，这里头藏着一段没人说破的因由。"
 SUM_Neo_SDH.28.a:"先看住脚下的城"
 SUM_Neo_SDH.28.b:"先看住远方的人"
 SUM_SDH_PRO_Key_Stone:"得石为钥"
 SUM_SDH_PRO_Key_Stone_desc:"探险队从遗迹里带回一块钥石，据说能开某一扇门，没人知道真假。有人拿它试遍了沙地的石门，都不合。这块石头空有一身本事，找不到要开的那扇门。"
 SUM_Neo_SDH.29.t:"钥启何扉"
 SUM_Neo_SDH.29.d:"钥匙有了，门却无踪，世上的事，往往如此。有那大胆的，揣着石头把附近石门挨个试遍，竟没一扇合得上，只好怏怏而回。这石头是当年探险队从遗迹里带回的钥石，巴掌大小，青幽幽的，摸着冰凉，上面刻的花纹谁也认不得。据说它能开某一扇门，可门到底在哪儿，问遍队里的人，个个摇头。有钥匙却寻不着门，急煞人也。队里为它争过几回，险些动刀，都说是自己先瞧见的。消息传到主母耳里，她便把石头要去，和几张图纸锁在一处，压在箱底，又添一把锁，一丝缝也不露。"
 SUM_Neo_SDH.29.a:"循教令院发下的旧例"
 SUM_Neo_SDH.29.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Tribal_Wreck:"逋亡余众"
 SUM_SDH_PRO_Tribal_Wreck_desc:"有一支小部族，从大族里出走，在沙地深处自立门户。主母提起他们时只说两个字，有人猜是反贼，有人猜是别的。那两个字听的人各自心里明白，谁也猜不透主母的心思。"
 SUM_Neo_SDH.30.t:"逋亡余众"
 SUM_Neo_SDH.30.d:"道不同便分手，从此两不相认。主母提起那支部族，脸上便不大好看，牙缝里只挤出两个字：「叛徒。」旁的再不多说，可那股恨意，连帐下刀手都替她不平。各部之中有一支小部族，不知何故从大族里出走，卷起帐子赶着骆驼，连夜走了，一头扎进沙地深处，寻处隐秘沟壑，自立门户，从此不跟大族来往。这事本不算大，偏主母记着。那小部也硬气，你骂你的，我过我的，逢年过节也不来拜，不肯低头。有那劝和的，两头跑了几趟，嘴皮都磨薄了，两边谁也不肯先松口。"
 SUM_Neo_SDH.30.a:"把账目封存"
 SUM_Neo_SDH.30.b:"把账目摊开"
 SUM_SDH_PRO_Dig_Ghost:"发冢潜踪"
 SUM_SDH_PRO_Dig_Ghost_desc:"夜里有人打着火把去掘墓，天亮前又把土填回原样。有人远远望见，也不敢上前细看，只记下那火把的去向。掘出了什么只有他们自己知道，事见不得天日，问的人也被挡了回去。"
 SUM_Neo_SDH.31.t:"发冢潜踪"
 SUM_Neo_SDH.31.d:"主母把那物件交给匠人，关在屋里琢磨了好几日，不许旁人靠近，谁也不知道琢磨出了什么。东西是头天夜里从荒坟里挖出来的。沙漠的夜色里，常有一伙人举着火把去掘墓，专拣月黑风高，铁锹裹着布不发声响，彼此说话全靠手势。坟一挖开，土便一筐筐往外搬，天快亮时又一筐筐填回去，连荒草都照原样栽好，不留痕迹。问他们夜里做了什么，个个缄口，只推说没挖着东西，还赌咒发誓。偏偏第二日，有人远远瞧见他们怀里鼓鼓囊囊，拿布裹得严实，匆匆闪进主母的院子。夜里掘，天明填，坟头的土掩得住，人心里的秘密却掩不住。"
 SUM_Neo_SDH.31.a:"按官署的判断行事"
 SUM_Neo_SDH.31.b:"按自己的判断行事"

 #### 独立之路 ####
 SUM_SDH_IND_Breaking_the_Edict:"遏其诏命"
 SUM_SDH_IND_Breaking_the_Edict_desc:"哈德拉玛维特要独立，先得料理一桩内里的事。主母的权柄一头来自花神，一头来自雨林的默许。撕一纸敕令容易，要把主母的根基从雨林那边拔出来，才是真难处。"
 SUM_Neo_SDH.32.t:"裂其诏版"
 SUM_Neo_SDH.32.d:"主母夜夜不眠，在帐里踱来踱去，捻断了好几串念珠。她私下遣人去探雨林的虚实，带回来的却尽是些含糊话，倒添了满腹疑团。哈德拉玛维特要争独立，先得解决一桩内里的事。她的权柄有两头：一头是花神，那是信众心里供着的；另一头是雨林的默许。教令院下一道敕令，她顶不顶得住，全看雨林点不点头。那敕令，说撕便撕，一张纸罢了，有何难处？难的是把根基从雨林那里一点一点抠出来。雨林经营多年，各部都有它的眼线、旧账、人情，盘根错节，牵一发动全身。撕纸容易拔根难，独立二字，说来轻巧。"
 SUM_Neo_SDH.32.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.32.b:"把盟约收进箱底"
 SUM_SDH_IND_Envoy_Tribes:"遍谒诸部"
 SUM_SDH_IND_Envoy_Tribes_desc:"主母派亲信走遍各部，带的不是礼物，是雨林欠各部的账。亲信到了一处便把账念给一处的人听，念完众人皆怒。这一本账翻出来，旧账比金银还好用。"
 SUM_Neo_SDH.33.t:"遍谒诸部"
 SUM_Neo_SDH.33.d:"一部帐子旁，亲信把账本摊在火堆边，就着光亮一项项念。账上记得明明白白：这些年雨林从各部拿走的水、盐、骆驼，各有数目，连年月都注着，一笔也赖不掉。众人越听脸越沉，怒气一阵阵往上涌，方知自己吃了这许多暗亏，个个坐不住了。这正是主母要的。她要拔雨林的根，没动一刀一枪，先派亲信走遍各部，带的不是刀也不是钱，偏是这么一摞账本。念完还不够，又抄成告示四处张贴，不识字的人也请人念给他听。各部头人读了账，脸涨得猪肝也似，当场就有性急的，跳起来要砸教令院的牌子。旧账一揭，人心便向着主母这边了。"
 SUM_Neo_SDH.33.a:"召集部族共商"
 SUM_Neo_SDH.33.b:"等官署先松口"
 SUM_SDH_IND_Council_Tent:"幄中运筹"
 SUM_SDH_IND_Council_Tent_desc:"几十顶帐子围成一圈，议事当日谁也不肯先进中间那顶。你推我让，半日也进不了帐，末了一齐进去。先进去的像是认了头一份，这份小心人人都藏在肚里。"
 SUM_Neo_SDH.34.t:"幄中运筹"
 SUM_Neo_SDH.34.d:"主母在帐中咳了一声，才有那胆大的头一个迈步，众人这才鱼贯而入，依次坐定。此前众人你推我让，站了半晌，谁也不肯先进中间那顶帐。各部议事，排场自有一番讲究：几十顶帐子团团围成一圈，像一朵撒开的莲花；正中间那顶是主母的，帐里铺着地毯，设着座位。头一个进去的，便显得急切、低人一等；落后进去的，倒占了体面，所以各家头人你看看我，我看看你，倒像那帐里藏着吃人的猛兽，谁都怕先迈这一步。主母瞧着，也不催促，只端坐捻着念珠等候，由他们推让。礼数就是脸面，谁也不肯先低头。"
 SUM_Neo_SDH.34.a:"备好兵与粮"
 SUM_Neo_SDH.34.b:"多派几趟使节"
 SUM_SDH_IND_Blood_Bond:"刑牲结盟"
 SUM_SDH_IND_Blood_Bond_desc:"立盟要当着花神的面放血，立誓当日人人割破手掌，疼得钻心也不吭一声，血滴进酒里各人分饮。放了血的部族从此便算一家人。这一碗血酒，比金兰契还重。"
 SUM_Neo_SDH.35.t:"庙前啮血"
 SUM_Neo_SDH.35.d:"饮过这碗血酒的，从此便是一家人，有福同享，有祸同当；谁若背盟，便受血咒，不得好死。立盟在哈德拉玛维特极重，不放别的，要当着花神的面放血。那日祭坛前摆着花神神龛，香烟缭绕，各部头人依次上前，用刀在掌心划开一道，血一滴一滴滴进同一只铜碗，红了半碗。主母端起碗先饮一口，再往下递，人人都要饮，一口不许剩。那铜碗传过一圈，回到主母手里只剩浅浅一层，她一仰脖饮得干净。仪式毕了，众人掌心都缠着布，彼此相视，竟真有几分骨肉情分。血滴一处，命便连在一处。"
 SUM_Neo_SDH.35.a:"把旗立起来"
 SUM_Neo_SDH.35.b:"把旗先卷起来"
 SUM_SDH_IND_Exiles_Back:"收召散部"
 SUM_SDH_IND_Exiles_Back_desc:"当年出走的小部如今被召回，条件是过去的账一笔勾销。主母赐下的田宅，他们收得客气，却不敢真当自家人。回是回来了，人心却还在察，面上笑，肚里各自打算。"
 SUM_Neo_SDH.36.t:"收召散部"
 SUM_Neo_SDH.36.d:"那小部地界的水井，至今还有人远远盯着。主母嘴上说要慢慢焐热，暗地里这一手却从没松过。当年那支从大族分出去的小部，是主母召回来的，条件明明白白：旧账一笔勾销，从前的事一概不究。他们掂量来掂量去，到底拖家带口，风尘仆仆地回了来，帐子还扎在原处。可人虽归来，那颗心却没跟着回来。各部的人照面时客客气气，转过身就拿眼角瞟他们，话里藏着刺，笑他们外头走一趟，倒学会了洋气。那小部的人自己也觉出味儿来，走路低着脑袋，开口先赔个笑脸，到了夜里凑在一堆，一个个叹气，懊悔这趟回来。主母瞧着，心里明白，这人心急不得，得慢慢焐。人回来了，心还隔着一层。"
 SUM_Neo_SDH.36.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.36.b:"把盟约收进箱底"
 SUM_SDH_IND_Desert_Pact:"沙碛要盟"
 SUM_SDH_IND_Desert_Pact_desc:"盟约写得明白：共守沙地，共分水源，共抗敕令。签字当日各部的头人按了手印，谁也不许多说一句。三条之外谁也不管谁的闲事，这约简单，反倒人人肯守。"
 SUM_Neo_SDH.37.t:"沙碛要盟"
 SUM_Neo_SDH.37.d:"盟约抄了三份，各部各执一份，主母也执一份，用蜡封了，供在神龛前头。白纸黑字写得最要紧的，却是末尾那一句：三条之外，谁也不管谁。原来各部首领都怕被人管得太紧，特意留下这一条，你走你的阳关道，我过我的独木桥，谁也别碍着谁。主母也依了，当众画了押。前面三条，一曰共守沙地，哪部地界受侵犯，各部齐出兵相助；二曰共分水源，几口井几道泉按份均分，谁也不许独占；三曰共抗敕令，雨林再下什么敕令，大家同心顶回去。约法三章，先小人后君子，反倒长久。"
 SUM_Neo_SDH.37.a:"召集部族共商"
 SUM_Neo_SDH.37.b:"等官署先松口"
 SUM_SDH_IND_Route_Grip:"扼守盐路"
 SUM_SDH_IND_Route_Grip_desc:"盐路是哈德拉玛维特的命脉，谁把住盐路谁就说得上话。卡子一设，盐价便由你定。从前是商队求人，如今是人求商队，颠倒了个儿。捏住这条线，满城都得听你的。"
 SUM_Neo_SDH.38.t:"扼守盐路"
 SUM_Neo_SDH.38.d:"北边盐场一闹乱子，盐路便断了，各部登时慌了神，粮价一日三涨，人心惶惶，有的部甚至动了抢的念头。还是主母亲自出面，另寻了一条入沙的小道，才算把盐运进来。众人这才服了，都说这盐路，果然是命根子。哈德拉玛维特不产粮，许多吃用都要拿盐去换，盐路便是命脉。谁把住了盐路，谁手里便攥着大家的咽喉，说起话来自然硬气三分，连主母也要让他几分。主母深知此理，所以那三道关卡，道道都派自己人把守，连那秤手都是她的心腹。只是自此各部都想把盐路攥在自己手里，明争暗斗，把主母急得嘴里起了泡。卡住盐路，便卡住了命。"
 SUM_Neo_SDH.38.a:"备好兵与粮"
 SUM_Neo_SDH.38.b:"多派几趟使节"
 SUM_SDH_IND_Caravan_Pact:"行商啮血"
 SUM_SDH_IND_Caravan_Pact_desc:"过境的商队与主母立约：保一路平安，换一份分成。商队交了分成便得一面旗，插在驼背上，一路无人敢扰。约立得明白，路上便太平。把话说在前头，省了许多口舌。"
 SUM_Neo_SDH.39.t:"行商啮血"
 SUM_Neo_SDH.39.d:"两边各按了手印，约书用羊皮写成，主母收一份，商队首领收一份，谁也赖不得。起初，过境的商队不肯白白留那一成货。后来立下约来，白纸黑字写得明白：主母保一路平安，人畜货物但有闪失，她照价赔偿；商队这边，抽货一成作为酬谢。两边都吃了定心丸，主母得了货，护送格外尽力；商队花了钱，走夜路也睡得安稳。自此驼道上果然太平，争执少了，驼铃响得悠扬。偶有不懂规矩的新商，主母的人把约书取出念一遍，新商便服了，乖乖留货。把话说在前头，路上反倒少事。"
 SUM_Neo_SDH.39.a:"把旗立起来"
 SUM_Neo_SDH.39.b:"把旗先卷起来"
 SUM_SDH_IND_Toll_Chain:"置榷征商"
 SUM_SDH_IND_Toll_Chain_desc:"要道上设卡收税，收来的税却不进官署的账。官署想查，账册上寻不见半个字，只得作罢。这一笔笔银钱都进了主母的私库，名目是税，实则是自家的进项。"
 SUM_Neo_SDH.40.t:"置榷征商"
 SUM_Neo_SDH.40.d:"有人劝她把账做明些，她只笑笑：「这沙漠里的规矩，就是没有规矩。」主母在要道上设了几处卡子，凡过往车辆驼队都要纳税，却不是进了教令院官署的账。原来她另有一本账，那税款一厘一毫，都进了自己的库房。收税的名目也多：过桥要钱，喝水要钱，连歇脚的棚子也要钱，名目稀奇。商们敢怒而不敢言，因为不纳这税便过不去，只得忍痛掏钱。主母拿这钱，一半养那护路的刀手，一半添自己的家底，日子过得越发滋润。商队里也有硬气的，宁可绕远走小路，也不肯纳这钱，结果在沙里迷了路，吃了大亏。税进了自家门，旁人休想查。"
 SUM_Neo_SDH.40.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.40.b:"把盟约收进箱底"
 SUM_SDH_IND_Mint_Sand:"开炉于沙"
 SUM_SDH_IND_Mint_Sand_desc:"把商路上流通的钱都换成本地所铸的新钱，成色写死在钱边。钱一面世，轻重便由不得外人说嘴。外邦的钱渐渐没人肯收，买卖都得照它的规矩来。"
 SUM_Neo_SDH.41.t:"开炉于沙"
 SUM_Neo_SDH.41.d:"钱边上刻成色，是把算盘打到骨头里了。主母铸的钱，跟外来的银钱不同：外来的银钱成色高高低低，全凭一句话，往往掺假；她的钱把成色写死在钱边上，多一分少一分都刻得明白，谁也赖不得。她又行了一着，要把商路上流通的钱尽数换成本地所铸。各处关卡摆下兑换摊子，外来的钱按成色折成本地钱，换过才准通行。这么一换，钱财真假可查，商队不敢掺假，只得照实兑换。主母还定下规矩，纳税只收本地钱，你便是揣着金银来，也得先换了。这么一改，市面上果然清静，掺假的没了空子，百姓也放心。"
 SUM_Neo_SDH.41.a:"召集部族共商"
 SUM_Neo_SDH.41.b:"等官署先松口"
 SUM_SDH_IND_Stockpile:"峙粮积卤"
 SUM_SDH_IND_Stockpile_desc:"盐与粮悄悄囤进沙地深处的暗仓，一堆堆盖得严实。仓门一开，粮垛高得顶着梁，看的人无不咋舌。囤的是粮，也是底气，荒年来了别人慌，主母这里却不慌。"
 SUM_Neo_SDH.42.t:"峙粮积卤"
 SUM_Neo_SDH.42.d:"运粮的人，是蒙着眼睛走的。主母瞒着众人，暗地里把盐和粮一车一车，悄悄运进沙地深处的暗仓。那仓挖在地底，入口掩在乱石后头，仓里干燥阴凉，粮放上几年也不坏，不怕风蚀鼠咬。这事做得极密，除了心腹谁也不知道。囤的哪里是粮，囤的是底气。你想，一旦雨林翻了脸，断了盐路，封了水道，各部没了吃用便要乱，便要来求主母；可主母手里有这许多存粮存盐，便能稳住阵脚，人心也就不慌。她每隔三月，便亲自去那暗仓看一回，摸摸粮袋，才放心回帐，宝贝得紧。仓里有粮，心中不慌，养兵千日，用在一时。"
 SUM_Neo_SDH.42.a:"备好兵与粮"
 SUM_Neo_SDH.42.b:"多派几趟使节"
 SUM_SDH_IND_Shrine_Arms:"龛前置戍"
 SUM_SDH_IND_Shrine_Arms_desc:"把守护神龛的人编成一队，名义上是护法，手里拿的却是刀。他们平日扫地添油，真有事时刀比谁都快。拜神是假，护院是真，借神的名义办的是主的差事。"
 SUM_Neo_SDH.43.t:"龛前置戍"
 SUM_Neo_SDH.43.d:"白日里，一个护法蹲在神龛前，慢条斯理数着香客投的铜钱，一副老实相。谁能想到，这些人腰间都掖着刀，个个精壮彪悍，攥起拳头能打死牛。原来各部本就有守神龛的人，平日上香添油、打扫龛前，看着都是老实巴交的信众。主母却把这几路人马统统编成一队，起了个好听的名目叫护法，说是护卫花神的神龛，谁也挑不出错。真要用时，一声令下，他们放下香炉提起刀，立时就是一支能打的兵。平日里散在各处神龛，混在香客堆里谁也认不出；一到夜里，便聚到主母帐前听令，一旦有事，聚起来便是主力。名为护法，实是藏兵，香火底下藏着刀光。"
 SUM_Neo_SDH.43.a:"把旗立起来"
 SUM_Neo_SDH.43.b:"把旗先卷起来"
 SUM_SDH_IND_Storm_Militia:"风沙训卒"
 SUM_SDH_IND_Storm_Militia_desc:"各部的民兵按沟壑划片，风一起各守各的口子。风沙里看不清人，只认得自家沟口的那盏灯。这片归你，那片归我，谁也不许越界。守土的事，人人都不敢含糊。"
 SUM_Neo_SDH.44.t:"风沙训卒"
 SUM_Neo_SDH.44.d:"口子上不许生火，也不许高声，只许睁着眼盯着，违令的罚去挑水。每年那三个月大风一起，各部民兵便各自守住自己的口子，一来防强人趁风打劫，二来防别部越界闹事。风沙里，那路口影影绰绰站着人，长矛拄在手里，眼睛瞪得溜圆，沙子抽在脸上也不眨。这些民兵，平日里种田牧驼，一有风声，长矛短刀就抄在手里。主母把他们照着沟壑分成了若干片：某片归某人管、某口归某人守，明明白白刻在木牌上。分到哪处，就钉在哪处，半步不许挪，违了令按军法处置。分片包干，各守一门，风沙再大也乱不了阵脚。"
 SUM_Neo_SDH.44.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.44.b:"把盟约收进箱底"
 SUM_SDH_IND_Hire_Riders:"募此骁骑"
 SUM_SDH_IND_Hire_Riders_desc:"雇来的骑手是拿来打快仗的，打完就走，不管守土。钱一散，人便散得比来时还快，营里空了一半。他们来去如风只认钱，仗打得漂亮，却留不住一寸地方。"
 SUM_Neo_SDH.45.t:"募彼健骑"
 SUM_Neo_SDH.45.d:"主母也知道这伙人靠不住，所以从不让他们守要害，只用来做突击的勾当。她手里养着一批雇来的骑手，骑术精熟，来去如风，马背上能翻筋斗。用他们，只为一桩：打快仗。趁人不备，冲过去突袭一阵，抢了东西就跑，绝不恋战，后面如何一概不管。打完这一仗，收了钱，翻上驼背，呼啸而去；那地方日后守不守得住，与他们毫不相干，守土自有按沟壑划片的民兵去管。有回他们突袭雨林一处哨所，得手便走，等雨林援兵赶到，早没了人影，只落得一地狼藉。快仗图的是一击即走，守土二字，不在他们账上。"
 SUM_Neo_SDH.45.a:"召集部族共商"
 SUM_Neo_SDH.45.b:"等官署先松口"
 SUM_SDH_IND_Storm_Drill:"因风演阵"
 SUM_SDH_IND_Storm_Drill_desc:"操演专挑风天，练的是辨向与结阵。风沙迷了眼，他们凭脚步声也排得整整齐齐。风越大队伍反倒越稳，平日里在风里泡惯了，真打起仗来别人慌他们不慌。"
 SUM_Neo_SDH.46.t:"因风演阵"
 SUM_Neo_SDH.46.d:"主母练兵，练的是两样本事：一样叫辨向，任你风沙遮天，也能认出东南西北，不至于迷路；一样叫结阵，风刮得越凶，队伍靠得越拢，肩并着肩一步不乱。这两样本事，专挑大风天操演。别人操演，都拣风和日丽的日子，她偏反着来，越飞沙走石越欢喜。为什么？沙漠里厮杀，多在风起时分，你若没在风沙里睁过眼，上了阵连敌人都瞧不见，那就要吃大亏。所以她的兵，风越大越精神，索性在狂风里唱起歌来，倒把风沙当成自家兄弟。练到后来，队伍越发稳当，风越大，阵越齐整，那风倒成了他们的帮手。把难事练成常事，上了阵便如走平地。"
 SUM_Neo_SDH.46.a:"备好兵与粮"
 SUM_Neo_SDH.46.b:"多派几趟使节"
 SUM_SDH_IND_Silent_Arm:"阴有援手"
 SUM_SDH_IND_Silent_Arm_desc:"有几支小队从不挂旗，专管办事，事后不留半句言语。事办完了人也就散了，仿佛从没来过。主母讲这样的一只手得常备着，用的时节，连声音都听不见。"
 SUM_Neo_SDH.47.t:"阴有援手"
 SUM_Neo_SDH.47.d:"明刀明枪是兵，暗里办事是手，手比刀更叫人怕。主母麾下有几支古怪小队，从不挂旗，也不打号，连马蹄都裹了布，来去悄无声息。他们专管那些摆不上台面的勾当：刺探消息，或是夜里办的事，得手就走，姓名痕迹一点不留。主母说，这样的手，得备着，少不得。果然遇上棘手事、明面上去不得的，便交给他们，办得干净利落；可事后你问起，人人摇头，仿佛他们根本没来过。这几支人连个名号都没有，只按头人的名字叫，事办完了，连那头人都说自己没见过。旁的部将都不爱跟他们打交道，总觉得背后发凉。"
 SUM_Neo_SDH.47.a:"把旗立起来"
 SUM_Neo_SDH.47.b:"把旗先卷起来"
 SUM_SDH_IND_Proclaim_Edict:"沙中悬令"
 SUM_SDH_IND_Proclaim_Edict_desc:"认得字的人站在告示前高声念，不认得的便围拢来听，听完你一言我一语地议论，差官上前拦也拦不住。告示是用本地文字写的，一张张贴在各城门外，就这几张纸，把整座城搅得沸沸扬扬。"
 SUM_Neo_SDH.48.t:"沙中悬令"
 SUM_Neo_SDH.48.d:"告示刚贴上土墙，浆糊还湿着，就有闲汉凑上去拿袖子抹了抹，看那字认不认得。主母这张告示，不用教令院的官话，偏用本地文字写，一张张贴在城门外土墙上。识字的站住念，不识字的凑着听，念到一半，人群就炸了锅，有叫好的，有骂娘的，几个火爆性子争得面红耳赤。风一吹，告示呼啦啦直响，没多久就撕掉一角，缺了半边字。偏那缺的地方，众人早记在心里，照样争个不休，看都不用再看。后来告示让风卷得没影了，可底下的话头还在城里传了十天半月。纸是死的，嘴是活的，风能撕走纸，撕不走话。"
 SUM_Neo_SDH.48.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.48.b:"把盟约收进箱底"
 SUM_SDH_IND_Raise_Banner:"高举旗号"
 SUM_SDH_IND_Raise_Banner_desc:"哈德拉玛维特立起自己的旗，旗上是花神与沙丘的纹样。城头的人见了都伸长了脖子看。这旗一升，风里猎猎作响，是花与沙并立，从此再不看别人的脸色。"
 SUM_Neo_SDH.49.t:"自张一帜"
 SUM_Neo_SDH.49.d:"进出城门的人，如今都要抬眼望一望城楼，望久了也就惯了。那旗底色黄得像沙丘，上面绣着两样纹样：一样是花神的花，瓣瓣分明；一样是连绵的沙丘，起伏有致。这是哈德拉玛维特自己立起的旗，做成那天，主母亲手在城楼升起，底下的人仰着脖子看。风一吹，旗猎猎作响，花纹在风里摆动，像活的一般。各部的人远远望见，有的热血沸腾当场欢呼，有的默不作声心里打鼓。守旧的人暗地里叹气，说这旗一立，往日的规矩便算彻底翻了篇。一面旗，便是自立的心，插上城楼，便再难取下。"
 SUM_Neo_SDH.49.a:"召集部族共商"
 SUM_Neo_SDH.49.b:"等官署先松口"
 SUM_SDH_IND_Reject_Suzerain:"返其诏书"
 SUM_SDH_IND_Reject_Suzerain_desc:"使节还在帐中絮叨，主母当面把敕令烧了。烧得正巧，一阵大风卷进来，纸灰扑了使节一身。使节抖了抖衣裳，一句话也说不出，灰溜溜走了。烧了文书，也烧了情面。"
 SUM_Neo_SDH.50.t:"碎其敕书"
 SUM_Neo_SDH.50.d:"使节的袍角沾满黑灰，脸上一阵红一阵白，半晌回不过神。那天风刮得凶，他捧着教令院的敕令来见主母，才展开要宣读，主母伸手就夺过去，眼皮都没抬，就近在火盆上点了火。纸一卷，火苗顺着边往上舔，转眼烧去大半，卷成一团黑蝶。偏偏一阵风卷进帐来，纸灰漫天飞舞，扑了使节满身。他霍地站起来要发作，却见主母神色不动，只轻飘飘来一句：「这里有风，烧得利索。」两旁侍立的人齐齐低了头，肩膀一抖一抖地偷笑。使节的随从抢上前来理论，被主母的人横刀一拦，只好愤愤退开，瞪着眼干着急。烧的是纸，拂的是面子，一阵风，把两下的脸都吹变了。"
 SUM_Neo_SDH.50.a:"备好兵与粮"
 SUM_Neo_SDH.50.b:"多派几趟使节"
 SUM_SDH_IND_Redraw_Border:"改画疆理"
 SUM_SDH_IND_Redraw_Border_desc:"地界照着水源与牧道重新划过，雨林设的界碑一一挪开。挪碑当日，两拨人隔着新线对望，谁也不肯先开口。碑挪一寸，地便宽一分。这界不是画在纸上，是挪在地上。"
 SUM_Neo_SDH.51.t:"改画疆理"
 SUM_Neo_SDH.51.d:"雨林早先立下的界碑，被一块块拔起来，拖到远处埋进沙里，连碑影都不留。主母办完大事，接着重新划界，这回不照旧章程，单看水与牧道：有水的地、走得驼的道，划给哪一部便归哪一部管，谁也挑不出理。那些碑上刻着教令院的字，原先立在泉边、岔路口，是雨林圈地的记号，瞧着叫人胸口发堵。识字的看一眼就明白，这是把雨林的旧账也一道埋了。岁月一久，连碑埋在哪儿都没人记得，只剩几个老人还能比划个大致方位。碑挪一寸，地便换一主，划的其实是权。"
 SUM_Neo_SDH.51.a:"把旗立起来"
 SUM_Neo_SDH.51.b:"把旗先卷起来"
 SUM_SDH_IND_Final_Word:"主母终语"
 SUM_SDH_IND_Final_Word_desc:"主母当着各部代表的面把话说得明白：「从今往后，哈德拉玛维特的规矩，由哈德拉玛维特人自己定。」此言一出，满帐寂静，众人心里的那口气到这时总算顺了。"
 SUM_Neo_SDH.52.t:"主母终语"
 SUM_Neo_SDH.52.d:"主母抬手压了压，满堂的喧哗便歇了，她又补上一句：「得出口，也要守得住。」这一句落地，方才那股热血顿时沉下去，众人你觑我我觑你，暗暗掂量起分量。那一日各部代表聚在一处，主母端坐上头，环视一周，缓缓开口：往后哈德拉玛维特的规矩，自己人来定，再不由雨林指手画脚。话音刚落，先是静了一静，接着叫好的、拍案的四起，更有性急的跳将起来，把帽子都掀翻了，一个个眼里发热，拳头攥得咯咯响。规矩自己定，得响，还要肩头扛得住。"
 SUM_Neo_SDH.52.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.52.b:"把盟约收进箱底"
 SUM_SDH_IND_Envoy_Port:"远客抵埠"
 SUM_SDH_IND_Envoy_Port_desc:"港口的客商带来船与价，开口便问：「沙地的盐，走不走海路？」主母端起茶，只顾看那客商的船。走海路利大，可也把命脉交到别人手上。这问题，主母没有立刻答。"
 SUM_Neo_SDH.53.t:"远客抵埠"
 SUM_Neo_SDH.53.d:"主母只捋着须，反反复复追问海路深浅、船的吃水，问得客商额上冒汗。那客商把买卖说得天花乱坠，什么船大、什么价高、什么一路顺风，听得人心里发痒，已有几个跃跃欲试。海边港口来了客商，带着船也带着价，开口便问主母：沙地的盐，肯不肯走海路？原来这盐走驼道，要翻三道卡，费时费力还处处受盘剥；若走海路，装船顺着海就能运到远处，价钱还能翻上几番。客商只当她是贪心，哪知她心里另打着算盘。送上门的买卖，先问个明白，贪字头上，是把刀。"
 SUM_Neo_SDH.53.a:"召集部族共商"
 SUM_Neo_SDH.53.b:"等官署先松口"
 SUM_SDH_IND_Envoy_North:"朔使入境"
 SUM_SDH_IND_Envoy_North_desc:"北国的使团最舍得花钱，金银一箱箱抬进来，却最不肯说明白钱要换什么。主母收了礼，却把话往回推。这般含糊反倒叫人心里发毛，白拿的好处都要拿别的东西来抵。"
 SUM_Neo_SDH.54.t:"朔使入境"
 SUM_Neo_SDH.54.d:"主母交代手下：使团走到哪儿，酒肉只管往上端，可他们嘴里说的话，半个字也别往心里去。北国来的这帮人，透着古怪，花钱如流水，金银大把大把地撒，你问他们图什么，他们便东拉西扯，半句实话也掏不出来。今天设宴请各部首领，明天又登门给主母送礼，钱撒得越多，人躲得越深，叫人越发看不透。有人猜是不是盯上了盐路，有人赌是冲遗迹来的，众说纷纭。等问到本人，只赔笑：「不过交个朋友，何必问这么细。」主母心里透亮，这银子不会白花，暗中叫人盯死了，寸步不离。钱来得蹊跷，话藏得深，天下没有白花的银子。"
 SUM_Neo_SDH.54.a:"备好兵与粮"
 SUM_Neo_SDH.54.b:"多派几趟使节"
 SUM_SDH_IND_Envoy_Rain:"林门洞辟"
 SUM_SDH_IND_Envoy_Rain_desc:"对雨林，主母还留着一扇门，派去的人带着盐约也带着账。来使进门时低头，出门时却把话捎回了雨林。门留着路便不断，这账一日不算清，这门便一日不关。"
 SUM_Neo_SDH.55.t:"林门洞辟"
 SUM_Neo_SDH.55.d:"那一线门缝，靠三趟往返才撑住。使者来回跑，把话捎过去又捎回来，到底没让它合上。主母虽和雨林翻了脸，话却没往绝里说，始终留着这一手。她挑了人过去，那人肩上挑着两副担子：一副是盐约，好做谈买卖的由头；一副是旧账，好清这些年的债。主母交代得明白：能谈就谈，谈不拢也别摔门，好聚好散。她心里雪亮，雨林根基太深，教令院不是好惹的，万一撕破脸，日后连转身的余地都没有。这门留给对方，也是留给自家，进退回旋全指着它。留得一线，进退皆有余地。"
 SUM_Neo_SDH.55.a:"把旗立起来"
 SUM_Neo_SDH.55.b:"把旗先卷起来"
 SUM_SDH_IND_Buy_Iron:"市取军器"
 SUM_SDH_IND_Buy_Iron_desc:"向外邦买铁与火，价钱却不用钱付，拿沙地的盐与驼来抵。外邦人对着驼群直点头，交易便成了。盐与驼是沙地有的，拿自己有的换自己没有的，这买卖做得精。"
 SUM_Neo_SDH.56.t:"市取军器"
 SUM_Neo_SDH.56.d:"那些外邦人把算盘打得精，非得亲眼见着盐才肯交货，驼队来回跑了好几趟，才把交易谈拢。沙漠里不出铁，可主母一心要强兵，刀矛弓弩样样都得向外邦置办，每一针每一线都要花摩拉。买铁费钱，买火药更费钱，她手头现钱不多，便拿沙地的盐加上骆驼去抵账。盐走到哪里都硬气，骆驼更是沙海的脚力，外邦缺这两样，自然乐得交换。驼队驮着盐、赶着驼，一路浩浩荡荡出了地界，翻过重重山岭，换回一车又一车的铁与火药。铁打成刀矛，火药装进枪膛，后来都用在了刀刃上。以我所有，换我所需，盐骆驼换刀与火，这算盘打得精。"
 SUM_Neo_SDH.56.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.56.b:"把盟约收进箱底"
 SUM_SDH_IND_Spy_Forest:"阴遣谍人"
 SUM_SDH_IND_Spy_Forest_desc:"往雨林派了几个人，学的是一样东西：教令院在沙地还有多少只脚。派去的人回来先画一张图，哪条街站着谁都标在上头。脚藏在暗处，要一五一十数清楚。"
 SUM_Neo_SDH.57.t:"阴遣谍人"
 SUM_Neo_SDH.57.d:"带回来的是满满一册名单，主母翻开一看大喜。派去的那几个人，在雨林里周旋了半年，回来时鞋底早磨穿了。她送他们过去，只为探一件事：教令院在沙地究竟埋了多少暗桩。这些年教令院明面上退了，暗地里却往各部塞眼线、钉子，仿佛沙里藏着脚，不知伸向哪里，也不知哪日冒头。要拔根，先得把这些暗脚数清。去的人有的装作卖货的，有的装作进香的，混进雨林四处打探：哪个部里还窝着教令院的人，哪口井被他们瞄着，一条条写下来带回。知己知彼，先把那暗处的脚数清楚，才好下刀。"
 SUM_Neo_SDH.57.a:"召集部族共商"
 SUM_Neo_SDH.57.b:"等官署先松口"
 SUM_SDH_IND_Declaration:"哈德拉玛自主"
 SUM_SDH_IND_Declaration_desc:"主母把敕令摊在火上，纸卷着烧，烧到底才断。各部代表围成一圈，看着那点火灭了，谁也没说一句话。城外雨林戍卒当夜便撤了两处，剩下的关上堡门，再不出来换水。"
 SUM_Neo_SDH.58.t:"哈德拉玛自主"
 SUM_Neo_SDH.58.d:"第二日，那两处堡子便空空荡荡，只剩几只野狗在里头转，寻剩下的水囊。原来就在当夜，城外雨林戍卒悄没声地撤了两处堡子，连水囊都没收拾；剩下的把堡门紧紧关上，再不出来与人换水，任你敲也不开。那几处堡子，本是雨林设着专管换水的，向来不肯少。而这一切的由头，是那一日主母把敕令摊在火上：纸遇火先卷成一筒，火苗顺着卷边往上爬，烧到根底才啪地断了，落下一片黑灰。各部代表围成一圈看着那点火渐渐灭掉，没一个人说话，连大气都不敢出，只听见火苗滋滋地响。一把火烧了纸，也烧断了水，那火看似灭了，余烬却烫手得很。"
 SUM_Neo_SDH.58.a:"备好兵与粮"
 SUM_Neo_SDH.58.b:"多派几趟使节"

 #### 甲线 · 花神圣战 ####
 SUM_SDH_RA_The_Floral_Crusade:"花神张帜"
 SUM_SDH_RA_The_Floral_Crusade_desc:"哈德拉玛维特的主母世代自称花神的女儿，信众遍布各部。有人主张把这份信仰从权柄里请出来，让它成为沙漠自己的一面旗。神归神，权归权，各归各处。"
 SUM_Neo_SDH.59.t:"花神张帜"
 SUM_Neo_SDH.59.d:"众人都说，那旗挂得对。那天明明没风，旗子却自己哗啦哗啦响，像花神在里头应声。哈德拉玛维特的主母，一辈辈都顶着花神女儿的名分，这份信仰传遍各部，连三岁孩童都会念叨，根深蒂固。如今有人提议：与其让信仰守着一家一姓，不如请出来，做整个沙漠共举的旗。话一出口，赞成点头的、摇头不依的吵成一片。主母掂量来掂量去，竟也应下了。花神旗就此上了城楼，迎着日头招展，年深日久，旗上的花纹晒褪了色，众人反倒更敬它。信仰本属众人，旗一挂出，没风也响。"
 SUM_Neo_SDH.59.a:"让商路连通四方"
 SUM_Neo_SDH.59.b:"把商路关起来自守"
 SUM_SDH_RA_Grand_Fete:"酺会三日"
 SUM_SDH_RA_Grand_Fete_desc:"花神诞祭办遍各城，香火缭绕，歌乐连着七夜。众人围着账本看，谁也没挑出半处错。办祭的钱由各家凑齐，账目当众公开，钱来去明白，办得热闹也办得干净。"
 SUM_Neo_SDH.60.t:"七宵赛会"
 SUM_Neo_SDH.60.d:"祭坛边上贴着一本账，一笔一笔清清楚楚，谁来都能看、都能查。这一年的花神诞祭，哈德拉玛维特的大小城池一处处都办了，香火从早烧到晚，歌乐足足闹了七夜，城里城外欢腾一片，连风里都裹着香气。钱没人单独出，是家家户户一文一文凑的，凑完还得把账摊开贴在坛边，这么办众人既尽心又踏实。七日里，有人上香，有人放歌，小娃娃绕着坛追跑，老人手里捻着念珠絮絮念叨，城门也索性大开。几个远道客商本在人群外瞧热闹，听着听着竟也跟着哼起来，引得旁人直笑。钱是大家的，账是明白的，祭便办得热闹。"
 SUM_Neo_SDH.60.a:"以契约立信"
 SUM_Neo_SDH.60.b:"以枪杆立威"
 SUM_SDH_RA_Shrine_All:"随地设龛"
 SUM_SDH_RA_Shrine_All_desc:"来往进城的人，走到城门口都要朝那小龛望上一眼。每座城的入口都设了一处花神龛，龛前不派官，只留一个人添油、扫地。那照看的从不催人，来去随人的便，反倒透着几分体面。"
 SUM_Neo_SDH.61.t:"随地设龛"
 SUM_Neo_SDH.61.d:"那照看神龛的老者，往往一守就是十几年，龛前的地砖被他扫得发亮。主母下令，在每座城入口都立一处花神神龛，用沙石砌成，龛里供着花神像，龛前摆着香炉。可怪的是，龛前不设官，既不派差役，也不收香火钱，只设一个照看的人，多是城里的老者，每日添油扫地，风雨无阻。过往行人愿意便上炷香，不愿也罢了，没人勉强，更没人来劝。原来主母要的，是让这信仰自在生长，沾了官气反倒不美，失了本心。神龛立在城门，官却不进，自在方见真心。"
 SUM_Neo_SDH.61.a:"把利润分给城邦"
 SUM_Neo_SDH.61.b:"把利润收归官库"
 SUM_SDH_RA_Pilgrim_Guild:"香众结团"
 SUM_SDH_RA_Pilgrim_Guild_desc:"香客自组行会，管起路上的食宿与安全。路上遇见风沙，行会的人便举火把在头里引路。这行会不收香火钱，只按人头摊些饭钱，把事办得妥帖，香客走得更安心。"
 SUM_Neo_SDH.62.t:"香众结团"
 SUM_Neo_SDH.62.d:"天一擦黑，领头的便敲响铜锣，点过值守的名姓，吆喝众人寻背风的沙沟歇下。这规矩，是四方香客自己立下的。进沙漠朝圣，路远风大，单人独骑说不定便喂了狼，于是众人凑在一处结伴，推举出领头的，定下章程：何处的沙井可以打水，哪道土梁背风好歇，夜里如何轮班守夜，一项项都安排妥当，违了的要受罚。奇就奇在这行会分文不取，不收香火钱，一切开销众人平摊，多退少补，账目摆在明处，谁都能查。他们认死理：朝圣是心意，沾了钱便失了本意。行会还有一条铁律，谁敢贪公家的钱，立刻逐出去，往后再不许与人结伴上路。驼铃一路叮当，队伍沿着绿洲的方向缓缓前行。路是大家走的，钱是大家摊的，行会只办事，不图利。"
 SUM_Neo_SDH.62.a:"借水草养人"
 SUM_Neo_SDH.62.b:"借商队养兵"
 SUM_SDH_RA_Floral_Choir:"花神众讴"
 SUM_SDH_RA_Floral_Choir_desc:"各村各城都有合唱的班，唱的是花神的旧诗。有一回两班人合唱，唱到末了竟都红了眼眶。唱的人不分部族，沙漠的雨林的坐在一处，歌声一起便不分彼此了。"
 SUM_Neo_SDH.63.t:"花神众讴"
 SUM_Neo_SDH.63.d:"祭日一到，沙丘脚下便黑压压站满了人，领唱的胳膊一扬，数百条嗓子齐声亮开，人身上没一个穿本部族的衣裳。这样的合唱班，各村各城都有，唱的是花神留下的旧诗。诗是祖辈口传下来的，词儿拗口得厉害，可一唱起来竟整齐得出奇，声势浩大，连沙丘都像跟着打拍子。最奇的是这班子里不问出身，你哪一族、我哪一族，一概不论，站进来就张口。往日有嫌隙的，唱着唱着那点芥蒂也散了，反倒亲近起来。班里几位老歌手，能一口气唱几十段，唱到动情时，连风都停了，沙也静了。主母听了满心欢喜，说这歌声胜过任何盟约。诗歌不分彼此，一开口，便是一家人。"
 SUM_Neo_SDH.63.a:"让商路连通四方"
 SUM_Neo_SDH.63.b:"把商路关起来自守"
 SUM_SDH_RA_Priest_Common:"众举祝史"
 SUM_SDH_RA_Priest_Common_desc:"祭司由信众公推，不由主母指派。公推当日众人各投一票，当众唱名，谁也做不得手脚。这一条一下便抽掉了主母的一半根基，神的事从此不归主母一个人说了算。"
 SUM_Neo_SDH.64.t:"众举祝史"
 SUM_Neo_SDH.64.d:"那些新推出来的祭司，果然不负众望，把祭礼办得比往日更加隆重，主母看了，也只能点头。主母又让了一步，这一让，让到了根上：往后祭司不再由她指派，改由信众公推。哪一处的神龛由谁主持祭礼，让信众自己商量着定，主母一概不干预，连名单也不看。这一条出来，明面上是尊重信众，可她心里雪亮，这一下便抽掉了自己一半的根基。原来从前祭司是她的人，信众听祭司的，便是听她的；如今祭司是大家推的，她的话便没那么灵，唤不动人了。可她还是签了，按了手印。权柄这东西，让出去一半，才换得众人真心，主母舍得。"
 SUM_Neo_SDH.64.a:"以契约立信"
 SUM_Neo_SDH.64.b:"以枪杆立威"
 SUM_SDH_RA_Temple_Land:"圭田入庙"
 SUM_SDH_RA_Temple_Land_desc:"拨给神庙一份田地，收成供祭礼，也拿来济贫。荒年开仓，先紧着没地的人家，一斗粮也不短少。这田是公的谁也不能卖，田在庙里，穷人的饭碗便也在庙里。"
 SUM_Neo_SDH.65.t:"圭田入庙"
 SUM_Neo_SDH.65.d:"过路的人走到田边，总要勒住骆驼，把碑上的字看上一遍，风吹雨打这么些年，那字反倒越刻越深。主母划给神庙的这份田，谁也不归，连她自己都不沾，只挂个公名。收成下来劈成两半，一半置办祭祀，香烛祭品都从这里出；一半拿去接济那些走投无路的人。主母立下铁规：田谁也不许卖，别说旁人，就是她眼前的亲信敢伸手，也按族法重重处置，半点不饶。她担心的正是年月一久，有人今天侵一寸、明天占一尺，慢慢把这公田吞了，所以先把话刻上石碑，立在田头，让人人都瞧见。田是公田，收成两用，一敬神，一济人，谁也休想私吞。"
 SUM_Neo_SDH.65.a:"把利润分给城邦"
 SUM_Neo_SDH.65.b:"把利润收归官库"
 SUM_SDH_RA_Alms_House:"置一赈舍"
 SUM_SDH_RA_Alms_House_desc:"神庙办济贫所，专收走投无路的人。每日两顿热粥，病了有人照看，外头风沙又大，谁舍得走。收进来的多，走出去的少，这地方养人也留人，叫人心甘情愿待着。"
 SUM_Neo_SDH.66.t:"庙设赈舍"
 SUM_Neo_SDH.66.d:"一个被赶出部的汉子蹲在门槛上，捧着热粥，半天不肯喝，只说不急，先暖暖手。这样的场景，在神庙后头的济贫所里天天有。所里收的，尽是些没了活路的人：丢光骆驼的商、被部里撵出来的穷汉、父母双亡的娃。进来便有口饭吃、有床铺睡，伏天冬天都有个遮身的地方。主母当初寻思，等风头一过、光景好转，这些人自会各回各家。哪承想，人越收越多，走的却没几个，十个里头也挑不出一个。外头世道太难过，这所反倒成了安稳窝，众人白日里各有活计，晚间有人搭话，日子久了，谁还提走的事。到后来，各部都离不得这地方，主母也常亲自过来，亲手舀几碗粥递过去。收的是穷苦，留的是人心，这济贫所，办到了好处。"
 SUM_Neo_SDH.66.a:"借水草养人"
 SUM_Neo_SDH.66.b:"借商队养兵"
 SUM_SDH_RA_Craft_Holy:"设神作局"
 SUM_SDH_RA_Craft_Holy_desc:"神庙的工坊既做器物也做兵器。匠人打一件香炉，顺手又打一把刀。做出来的东西一半供祭礼，一半给护法队。拜神的家伙和打仗的家伙，竟出自同一炉火。"
 SUM_Neo_SDH.67.t:"炉焰不夜"
 SUM_Neo_SDH.67.d:"小匠人盯着炉火半晌，忍不住问：「一样是炉里出来的铁，怎的分作两样？」老匠人把锤子往地上一顿，答道：「供神的要好看，杀人的要耐使，各秉其性，怎可一般看待？」众人听了，方才恍然大悟。神庙后院那座工坊，炉火从天亮烧到天黑，匠人们赤着膀子，抡锤的抡锤，拉风箱的拉风箱，汗珠甩到沙地上滋滋就干了，炉边堆着半人高的废铁，都是打坏了回炉重打的。一件器物出炉，一半送去做祭礼，一半交给护法队。祭礼上用的是花神的香炉、灯盏，铸得薄，纹路细，专人捧着供在龛前；护法队用的是刀矛、护心镜，锻得厚，淬得硬，一出手便见血。老匠人说罢，低头又抡起锤来，叮当之声不绝于耳。"
 SUM_Neo_SDH.67.a:"让商路连通四方"
 SUM_Neo_SDH.67.b:"把商路关起来自守"
 SUM_SDH_RA_Fair_Sacred:"神庑启市"
 SUM_SDH_RA_Fair_Sacred_desc:"祭期开圣市，三日之内不抽税。叫卖声连成一片，摊子从城门一直排到神龛跟前，热闹得脚都插不进去。市一开四方的人都赶来，这三天不收钱，图的是人气聚拢。"
 SUM_Neo_SDH.68.t:"赛会三日"
 SUM_Neo_SDH.68.d:"木牌上的墨还没干，写着三日内分文不取。祭期一到，哈德拉玛维特便办起集市，四面八方的人潮水似的涌来。南边牧人赶着羊群，北边商队驮着盐包，连雨林那边也有大胆的混进来看稀奇。摊贩顺着街边一溜排开，卖水的挑着担子沿路吆喝，卖馕的、卖花神像的挤成一团，把整条街堵得水泄不通。三天里没有一个收钱的差役，连背角落里都站满了人。一位老汉捋着胡子道：「不抽税，图的不是钱，图的是人心。」众人听了连连点头。有人从远处来迟了，急得直跺脚，追问啥时候再开；摊主们连着做了三天生意，个个笑得合不拢嘴。"
 SUM_Neo_SDH.68.a:"以契约立信"
 SUM_Neo_SDH.68.b:"以枪杆立威"
 SUM_SDH_RA_Granary_God:"实其神仓"
 SUM_SDH_RA_Granary_God_desc:"神庙设一座粮仓，丰年收粮，荒年放粮。仓门锁着两把，钥匙分给两个人，谁也别想独吞。放粮的规矩明明白白写在仓门上，谁来领照章便是，谁也不能徇私。"
 SUM_Neo_SDH.69.t:"发神廪赈"
 SUM_Neo_SDH.69.d:"荒年开仓那日，门外排起长队，男女老少拎着口袋静静等候，没一个人喧哗争抢，秩序倒比平日还整齐。神庙里那座大粮仓，高墙厚门，专人看守，规矩就一条：丰年收，荒年放。丰年里谷子堆得冒尖，管仓的一袋袋收进来登记在册；沙地颗粒无收时，便开仓放粮，一口人分一份。这规矩不藏在谁肚里，白纸黑字写在仓门上，谁都看得见念得出。有不懂事的想多拿一袋，管仓的指着门上的字道：「你自看看，上头可是写了多拿的？」那人羞答答退回去。门上的字风吹日晒淡了，便有人重新描过，一笔一画端端正正。"
 SUM_Neo_SDH.69.a:"把利润分给城邦"
 SUM_Neo_SDH.69.b:"把利润收归官库"
 SUM_SDH_RA_Tribe_Welcome:"收彼新附"
 SUM_SDH_RA_Tribe_Welcome_desc:"凡愿归附的部族，不问旧事，只问一句：「肯不肯守共同的规矩？」来归的人踏上沙地，先递上投名状，再饮一碗血酒。肯的点头便是一家人，过往恩怨一笔勾销。"
 SUM_Neo_SDH.70.t:"归附勿究"
 SUM_Neo_SDH.70.d:"来使把礼物往地上一撂，抬眼吐出一个字，就算入了伙。神庙的人只问一句：「你肯不肯守咱们共同的规矩？」远处那支来投奔的部族首领愣了愣，答道：「肯。」不问你以前干过什么，不问跟谁结过梁子，也不管你是哪支血脉，就问这一句。既然肯，旧账一笔勾销，从今往后你我就是一家人。当下宰羊温酒，喝了同盟酒便算同伙；有背着旧案的，也因这一问翻了篇，再没人提。那首领喝完感慨：「往后有了规矩，心里反倒踏实。」前后投奔来的有好几支，神庙都把名字记下刻在石碑上。后来有人问他为何不讲条件，他道：「规矩在前，我心里先服了，还谈什么条件。」"
 SUM_Neo_SDH.70.a:"借水草养人"
 SUM_Neo_SDH.70.b:"借商队养兵"
 SUM_SDH_RA_Elder_Vote:"耆宿开议"
 SUM_SDH_RA_Elder_Vote_desc:"各部长老定期公议，议的是水源与牧道。议事当日，长老们围坐一圈，为一条牧道争到日头偏西。议定了便共同担保，这水与路不是谁一人的，是大家按了手印的。"
 SUM_Neo_SDH.71.t:"耆宿开议"
 SUM_Neo_SDH.71.d:"道理是吵出来的：水少那一季，几个长老嗓门都哑了，谁也不肯让一寸，可茶一端上来，事情就定了。各部长老隔段时间便聚在一起议事，谈的尽是实打实的营生，这季的水走哪条渠、哪片牧道归谁放。围着圈坐定，你一句我一句，脸红脖子粗是常事。但凡议决，没人翻悔，众人当面立下约：水与路大家一同作保，谁敢私自破坏，便是跟所有人过不去。有想捣鬼的，见众人认了真，悄悄把手缩了回去。散会前一道喝茶，先前的火气也就散了。往后每逢议事，众人想起那纸约，态度都格外庄重。渠修到哪儿、牧道让到哪块，都有人盯着，生怕落个不守信用的名声。年深日久，各部倒真成了一家人。"
 SUM_Neo_SDH.71.a:"让商路连通四方"
 SUM_Neo_SDH.71.b:"把商路关起来自守"
 SUM_SDH_RA_Bride_Alliance:"缔姻固盟"
 SUM_SDH_RA_Bride_Alliance_desc:"族与族之间以联姻加固盟约，聘礼的账由神庙记下。送亲当日，驼队排得老长，两族的人一路唱着歌。这账记得细，嫁过去的女儿便是两族之间活生生的约。"
 SUM_Neo_SDH.72.t:"缔姻固盟"
 SUM_Neo_SDH.72.d:"两族从前还红过脸，自打结了这门亲，往来的勤快劲儿谁都比不上。要说把盟约焊牢，没有比结亲更稳的：这家的闺女嫁过去，那家的儿子迎过来，成了亲戚，情分自然比旁人厚。可结亲不是空口白话，聘礼是要记账的，哪家送了几峰骆驼、几匹好布、几袋盐，都一笔笔落在神庙的账本上，管账的祭司写得清清楚楚，日后谁想赖账也赖不掉。嫁女的那家临行千叮咛万嘱咐，闺女含泪拜别。那本账簿越摞越厚，足有半人高，祭司说这不为算计谁，只给子孙留个凭据，晓得先人结过这门亲。逢年过节，两家还互送礼物，来往从没断过。"
 SUM_Neo_SDH.72.a:"以契约立信"
 SUM_Neo_SDH.72.b:"以枪杆立威"
 SUM_SDH_RA_Orphan_Care:"收恤孤稚"
 SUM_SDH_RA_Orphan_Care_desc:"战乱留下的孤儿，由神庙与各部一同养大。有的孩子记不得爹娘，只认得神庙那口锅。长大之后愿意从军的便从军，这些孩子吃的是众人的饭，还的是众人的情。"
 SUM_Neo_SDH.73.t:"收恤孤稚"
 SUM_Neo_SDH.73.d:"那娃后来去放羊，认得草性，当上了牧官；一同长大的另一个从了军，刀法极为勇猛。人都说，这是当年那口百家饭换来的福报。战乱年间，不少娃娃没了爹娘，流落在沙地里，有一顿没一顿。神庙看着不忍，跟各部一商量：这些孩子大伙一起养。于是这家管饭，那家管衣，庙里也拨出一份口粮。孩子们慢慢长大，到了年岁自己挑：想从军的编入队伍，想放羊种地的也随他。吃百家饭长大的孩子最懂报恩，上了战场没有一个往后缩的。后来做了头领的，也忘不了当初那口饭，常把孤儿叫到跟前亲自劝勉。神庙见这法子好，便定成常例，年年照办。"
 SUM_Neo_SDH.73.a:"把利润分给城邦"
 SUM_Neo_SDH.73.b:"把利润收归官库"
 SUM_SDH_RA_Blood_End:"解其宿怨"
 SUM_SDH_RA_Blood_End_desc:"有仇的两族在花神龛前和解，血债一笔勾销。两族的头人当众握住手，从前的事从此谁也不再提。和解的场面办得热闹，酒肉摆了一地，冤家宜解不宜结。"
 SUM_Neo_SDH.74.t:"庙前释怨"
 SUM_Neo_SDH.74.d:"两个昔日的仇人，如今并肩站在花神龛前，一道添香，倒成了生死之交，正应了那句不打不相识。想当初两族结怨多年，动不动就拔刀相向，那日被请到龛前，祭司从中调停，劝道：血债一笔勾销，往后不许再提。起初谁也不看谁，脖子梗得笔直，直到祭司抬出花神的名号，众人心才软下来。当下宰羊摆酒，两边在席上痛饮，热闹得赛过办喜事。有个年长的握着对头的手，眼泪汪汪，从此真个和好了。龛前香烟缭绕，众人笑作一团，前嫌尽释。为防日后反悔，特地立了石碑，把和解的话刻在上头；祭司又命两家各出一人，天天来龛前添香。"
 SUM_Neo_SDH.74.a:"借水草养人"
 SUM_Neo_SDH.74.b:"借商队养兵"
 SUM_SDH_RA_Storm_Banner:"聚于风帜"
 SUM_SDH_RA_Storm_Banner_desc:"选一批专打风天的人组成军团，旗是灰的，风里看不清。敌军望过去只当是沙丘在动，等人到了跟前，刀已架在脖子上，才惊觉是人不是沙。这旗隐匿得比没有还干净。"
 SUM_Neo_SDH.75.t:"聚于风帜"
 SUM_Neo_SDH.75.d:"灰色旗子在黄沙里几乎看不出来，敌军只当那片沙丘空无一人，等旗从沙里现出来，人已经杀到跟前了。哈德拉玛维特要练一支专门在风天打仗的兵，挑人专拣沙里长大的：眼睛眯着也能看清风沙，脚板厚得走沙如平地。这支部队还有一桩怪处，旗是灰的。别家旗或红或花，唯独这面灰扑扑，风一起就和黄沙融成一片，远远望不见。原来旗色就是为了藏兵。领军的说：「这旗不图好看，只图活命。」后来灰旗军出战，果然占尽便宜，连胜几阵所向披靡，众人才服了挑旗色那人眼光独到。"
 SUM_Neo_SDH.75.a:"让商路连通四方"
 SUM_Neo_SDH.75.b:"把商路关起来自守"
 SUM_SDH_RA_Holy_Guard:"置护法军"
 SUM_SDH_RA_Holy_Guard_desc:"护法卫队守神庙，也随军出征。护时寸步不离，攻时第一个往前冲，从不迟疑。他们打仗有两样做法：一是护，一是攻，在神前拿香炉，阵前拿刀，样样都来得。"
 SUM_Neo_SDH.76.t:"置护法军"
 SUM_Neo_SDH.76.d:"盾墙忽然让开一条缝，长矛从缝里一齐捅出，对面阵脚立时乱了。护法卫队本是神庙的守家人，平日里看守殿宇，香火、经卷、器物都经他们的手，一有战事也得随军出征。他们的打法就两样：护和攻。护的时候，盾牌一面挨一面排成墙，把要护的人圈在里头，箭射过来也扎不透；攻的时候，长矛一摆，号令一下，就像猛虎扑羊直冲敌阵。这两样本领都得练熟。新来的只会护不会攻，老兵就笑他：「你这般，只配替人挡箭。」那新兵羞得满脸通红，从此昼夜苦练。两样轮番使出来，既护住了自己，又冲垮了敌人，着实厉害。"
 SUM_Neo_SDH.76.a:"以契约立信"
 SUM_Neo_SDH.76.b:"以枪杆立威"
 SUM_SDH_RA_Camel_Holy:"神驼列骑"
 SUM_SDH_RA_Camel_Holy_desc:"圣驼骑的驼鞍上绣着花神的纹样，骑手都是各部子弟。驼铃一响，各部的人便知道是自家的子弟来了。这些人从小在驼背上长大，鞍子一花纹，人便成了神的兵。"
 SUM_Neo_SDH.77.t:"勒间画花神"
 SUM_Neo_SDH.77.d:"沙海边上，一队骆驼贴着沙梁疾走，驼铃被风扯得断断续续。领头那人鞍上的花神纹样，在日头底下灼灼发亮。这圣驼骑是哈德拉玛维特军中的眼珠，探消息、袭敌营，事事离不得。选人极严：各部子弟里，骑射过得去又胆大的才选得进来。他们打小在驼背上过活，驼走人随，再颠也稳得像坐在自家门槛上。铃音一落，人马便隐入沙涛。有爹娘送儿子来的，伸手摸摸鞍上的花纹，嘱道：「花神保佑，你且安心去。」年轻人应一声，翻身上驼绝尘去了，身后黄沙滚滚。敌军只要望见风沙里那朵花一闪，便知精锐到了，往往先自怯了。"
 SUM_Neo_SDH.77.a:"把利润分给城邦"
 SUM_Neo_SDH.77.b:"把利润收归官库"
 SUM_SDH_RA_Scout_Storm:"风枢遣骑"
 SUM_SDH_RA_Scout_Storm_desc:"侦骑专走风眼，风眼里头最静，能看清对面在做什么。有一回摸到敌军营后，把马料都数了一遍才回来。别人被沙迷了眼，他们却借着风隐蔽，看得清，也摸得近。"
 SUM_Neo_SDH.78.t:"风枢遣骑"
 SUM_Neo_SDH.78.d:"外头风沙打得人睁不开眼，那洼地里却纹丝不动，连根草都不摇晃。侦骑专找这种风眼藏身：大风一刮，四面昏沉，独有此处风绕着走，待在里头能把敌人看得清清楚楚。他趴着不敢动，对面营里人喊马叫，埋锅的、放哨的、换班的，一桩桩都记在肚里，等天黑再摸回去报给中军。也有那毛躁的认不得风眼，一头扎进狂风，被沙子抽得什么也看不见，空手回来还挨了训。有一回，那侦骑在风眼里整整趴了一天，把对面换防的时辰记得分毫不差，夜里回报，中军照着定计，果然一举得手。这等好处别人瞧不出来，唯有风哨认得，是千金难换的本事。"
 SUM_Neo_SDH.78.a:"借水草养人"
 SUM_Neo_SDH.78.b:"借商队养兵"
 SUM_SDH_RA_Field_Shrine:"军行奉龛"
 SUM_SDH_RA_Field_Shrine_desc:"军中带着一座能拆装的神龛，扎营便立起来。拆的时候匠人把每块木板都编上号，再立时一根不差。龛一立人心便定，打个胜仗也要先拜一拜才敢睡去，人心一安，觉也睡得香。"
 SUM_Neo_SDH.79.t:"军行奉龛"
 SUM_Neo_SDH.79.d:"拆时先取顶、再卸柱，件件编号一丝不乱；立时先立柱、再覆顶，片刻便成。几名手快的兵士合力，转眼把一座龛立得端端正正，分毫不差，祭司看罢连连点头，说这班人办事牢靠。大军开拔，军中还带着这样一座神龛：行军时拆开装在驼背上，扎下营来又就地立起。这龛立起，可不单为拜神。兵士远征心里发虚，一见龛立稳了，像见了主心骨，人心登时安定。祭司在龛前点香，众人依次上前默默礼拜。有那新兵头回上阵怕得手抖，拜过之后胆气竟壮了几分。老兵说道：「龛在，神在，咱们的心便在。」众人听了俱各安然。"
 SUM_Neo_SDH.79.a:"让商路连通四方"
 SUM_Neo_SDH.79.b:"把商路关起来自守"
 SUM_SDH_RA_Sacred_Oasis:"圣地洲渚"
 SUM_SDH_RA_Sacred_Oasis_desc:"把几处绿洲立为圣所，许进不许占。进圣所的人先把刀卸在门外，才准走近水边。谁要是占了圣所便人人得而讨之，这几口水不属于哪一族，属于花神，这规矩无人敢犯。"
 SUM_Neo_SDH.80.t:"圣地洲渚"
 SUM_Neo_SDH.80.d:"夜里刮起大风，赶路人望见一点灯火，便知是圣所到了。门从来不锁，自己推门进去，寻个背风的角落蜷下，天亮再走；管事的从不多问，只在门边留下一壶水。哈德拉玛维特有几片绿洲被划成圣地，规矩八个字：许进不许占。哪族的人路过，都能进来讨口水、歇歇脚，可谁也不许圈起来据为己有。早先有个贪心的部族自恃人多，霸了一处圣地，把旁人撵走，这一下可惹了众怒，各部首领号令一下，四面八方的人一齐涌来，把那部族赶得狼奔豕突。自那以后，再没人敢打这主意，圣地一直敞着门。这份信任比高墙铁锁还牢靠，谁都不忍心坏了规矩。"
 SUM_Neo_SDH.80.a:"以契约立信"
 SUM_Neo_SDH.80.b:"以枪杆立威"
 SUM_SDH_RA_Water_Gift:"剖水要盟"
 SUM_SDH_RA_Water_Gift_desc:"圣所绿洲的水按人口分给周围的村与牧户，不分部族。分水当日，各村排队领牌，孩子捧着水罐跟在后头。村有村的分，户有户的分，这水认人不认族，童叟无欺。"
 SUM_Neo_SDH.81.t:"剖水要盟"
 SUM_Neo_SDH.81.d:"「不分部族，只分人口。」差役把木尺往渠沿上一搭，这般回那想多要水的部落头人。圣所那片绿洲分水，只按人头，不问你是哪族哪部：周围村寨牧户，家里几口人便领几份，多一口不加，少一口不减。差役拎着木桶挨家挨户量过去，谁也不许多占一寸宽。有部族仗势想多要，碰了这软钉子，只好退下。有妇人不识字，差役就把条文念给她听，一遍听不懂，再念一遍。村里人都说这分法不欺生、不怕硬，从此再不为争水红脸，相邻各村和和气气。"
 SUM_Neo_SDH.81.a:"把利润分给城邦"
 SUM_Neo_SDH.81.b:"把利润收归官库"
 SUM_SDH_RA_Garden_Holy:"神苑清閟"
 SUM_SDH_RA_Garden_Holy_desc:"在绿洲边开一座园子，种花，也种粮。花开时摘几朵供在龛前，粮熟了先送济贫所，剩下才自家留。管园的人由信众轮值，一茬换一茬，这园子是众人轮着伺候出来的。"
 SUM_Neo_SDH.82.t:"迭守圣圃"
 SUM_Neo_SDH.82.d:"花开时节，园子里红一片白一片，香气飘出好几里，路过的人都要停下来看两眼，孩子们更钻进花丛里追逐嬉戏。在一处绿洲边上，众人开了一座园子，种花也种粮。这园子有旁的讲究：管园的人由信众轮值，今日轮到这一家便由这家看园浇水，明日又换一家。信众都把这当成积功德的事，轮到自己早早便来，把花畦侍弄得齐齐整整，禾苗浇得绿油油。那花开得盛，引得蜂蝶乱飞；粮长得壮，秋后收成喜人。有偷懒不到的小子，众人便笑话他没福气，下次便不敢再懒。看园的信众也不恼，只叮嘱莫踩坏禾苗。这一座园子竟成了绿洲边上一处胜景。"
 SUM_Neo_SDH.82.a:"借水草养人"
 SUM_Neo_SDH.82.b:"借商队养兵"
 SUM_SDH_RA_Refuge_Sand:"沙中藏身"
 SUM_SDH_RA_Refuge_Sand_desc:"圣所兼作避难所，风灾战乱时便开门收人。老人孩子先安置，青壮便帮着挑水和泥，一院子人竟也安顿得下。收多少人便管多少饭，门一开，跑进来的人挤满了院子。"
 SUM_Neo_SDH.83.t:"沙中藏身"
 SUM_Neo_SDH.83.d:"碗端到手里，那人还抖得厉害，稀粥洒了半勺，管事的又给添满，温声安慰：「且安心住着，风过了再走。」圣所还兼着避难这一项：风灾战乱一来，大门便敞开，把逃难的人收进来。收多少人就管多少饭，先把人数报上，再按数下锅，一碗稀粥一张馕，不算丰盛，好歹能保命。众人挤在一处互相帮衬，硬是熬过了难关，风停时一个个都挺直了腰。所里还备着草药，受了伤的敷上一些；病倒的也腾个干燥角落让其歇着。这地方救的不只是命，更把人心安住了。风灾过后，被救的多半留下来帮着修墙补屋，报答恩情。"
 SUM_Neo_SDH.83.a:"让商路连通四方"
 SUM_Neo_SDH.83.b:"把商路关起来自守"
 SUM_SDH_RA_Oasis_Guard:"守所之吏"
 SUM_SDH_RA_Oasis_Guard_desc:"守圣所的人不穿军装，可手里有刀。有一伙人不知死活，夜里来偷水，天亮时全被捆在龛前。抢圣所的从来没有好下场，这刀不出鞘便罢，一出鞘就要见血。"
 SUM_Neo_SDH.84.t:"衲袖藏锋"
 SUM_Neo_SDH.84.d:"那伙贼寇哪里抵挡得住，被赶得抱头鼠窜，连滚带爬地逃了，从此再没人敢来打圣所的主意。曾有伙贼寇夜间摸到圣所，只想把水井占了，守圣所的人一声呼哨，布衣一撩，明晃晃的刀就亮了出来。守圣所的人看着与寻常百姓无二，不穿军装，身上一色布衣，可哪里空着，个个袖里藏着刀。原来这刀是为对付来抢圣所的强人。平日里他们也练刀，每日天刚蒙蒙亮便在沙地上比划，一刀一刀练得出神入化。有路过的商队见他们布衣芒鞋以为寻常，哪知个个都是好手。这叫真人不露相，刀藏袖中，不轻易示人罢了。"
 SUM_Neo_SDH.84.a:"以契约立信"
 SUM_Neo_SDH.84.b:"以枪杆立威"
 SUM_SDH_RA_Crusade_Word:"宣言属草"
 SUM_SDH_RA_Crusade_Word_desc:"对雨林的檄文用花神的名义写，说的却是赋税与水源的账。檄文一贴出来，各部的青壮便摩拳擦掌，只等一声令下。神的名字在前，账在后，这叫师出有名，名正言顺。"
 SUM_Neo_SDH.85.t:"宣言属草"
 SUM_Neo_SDH.85.d:"念到最后一行，满纸神仙话忽然落到赋税上，听的人先是一怔，继而都笑了。哈德拉玛维特要给雨林送一封檄文，这文章写得古怪：开篇抬出花神，满纸敬神的句子，可翻到后头，说的全是过日子的账，赋税多收了几成、水源怎么被截走，一条条算得明明白白。分明是顶着神的名义，诉眼下的委屈。祭司当众诵读，前半段众人还肃然，念到后半段，听得连连点头，句句都挠到痒处。有明白人笑道：「神归神，账归账，这叫两不耽误。」众人听了，都服这笔杆子的本事。檄文一传开，雨林那边果然着了慌：本以为沙漠人只会放羊抢劫，不想账目算得这么精细，有谋士看了连呼不可小视。文章也是兵器，这借神说账的手段，着实利害。"
 SUM_Neo_SDH.85.a:"把利润分给城邦"
 SUM_Neo_SDH.85.b:"把利润收归官库"
 SUM_SDH_RA_March_Storm:"乘风东趋"
 SUM_SDH_RA_March_Storm_desc:"大军候着换季的风东进，风把足迹吹平，也把守军遮住。人马借着风掩，一直摸到关下，守卒才惊觉不对。雨林的斥候什么也看不清，这风替大军打了头阵，神不知鬼不觉。"
 SUM_Neo_SDH.86.t:"乘风东趋"
 SUM_Neo_SDH.86.d:"关隘上的守军这几日只当是寻常风沙，照旧巡逻，懒洋洋踱着步。其实大军正按兵不动，单等那阵换季的东风，风一起便顺着进兵的路往东卷。这一等，等来了天时：黄沙被风卷起，把人马踩过的足迹扫得平平整整，对面探子来瞧，满眼茫茫白沙，半点痕迹也寻不出。更妙的是风沙遮天，守军被迷了眼，远处聚了多少人马一概看不清。大军就在这风幕底下悄悄压向关隘，马蹄裹了布，人衔着枚，连马嘶都叫风吞了。等守军回过神，刀已架上脖子，悔之晚矣。这一仗赢得巧，全在会用天时。"
 SUM_Neo_SDH.86.a:"借水草养人"
 SUM_Neo_SDH.86.b:"借商队养兵"
 SUM_SDH_RA_Holy_Volunteer:"信众皆伍"
 SUM_SDH_RA_Holy_Volunteer_desc:"檄文一传，各部的青壮自带口粮来投。营门一早便挤满了人，来晚的只能排在沙丘上等。来的人数比主母估的多了整整一倍，这花神的名义比银子还灵，人心齐，泰山移。"
 SUM_Neo_SDH.87.t:"信众皆伍"
 SUM_Neo_SDH.87.d:"告示贴出没几天，来投军的人就把营门挤歪了。原先算好的名额，实际来的多出一倍还不止，管事的握着笔，从早写到晚，连口饭都顾不上。来的人里，有兄弟仨一道来的，也有整村结伴来的，扛着各自的家伙，背着干粮袋。粮草一时接不上，众人齐声：「口粮自带，不费军中的心。」住处不够，他们便自己支帐幕、就地起灶；带家眷来的，也在营边找地方安顿。没几日，一座营盘竟扩成了村镇的模样。营里人人摩拳擦掌，只等令下。管事的看得直伸舌头，赶紧报与主母：人心思变，挡是挡不住了。"
 SUM_Neo_SDH.87.a:"让商路连通四方"
 SUM_Neo_SDH.87.b:"把商路关起来自守"
 SUM_SDH_RA_Shrine_Front:"阵前奉龛"
 SUM_SDH_RA_Shrine_Front_desc:"在雨林边上立起一道军前的神龛。有雨林的兵隔河望见那龛，竟犹豫起来，不知该不该放箭。敌军看了心乱，自己看了心定，同一尊神，叫两边各有各的想头。"
 SUM_Neo_SDH.88.t:"阵前奉龛"
 SUM_Neo_SDH.88.d:"龛刚在阵前立稳，对面阵里就乱了，自家阵里却齐声呐喊。这座龛立在雨林边上，敌军远远望见心里先怯了：这是摆出拼死的架势。自家兵士见了却安定下来，神龛都推到阵前了，这仗必胜。祭司在龛前焚香祷告，香烟直冲云霄，兵士望见，呐喊声震得林子里鸟都飞起，敌军吓得倒退。有那新兵说，看见龛就像看见自家门槛，心里就不慌了。龛旁还竖着一根旗杆，旗上绣着花神字样，风一吹猎猎作响，敌军望见更惊，只当对面有神明相助；自家兵却越看越有劲，腰杆挺得笔直。两军对垒，先争的是一口气，这龛立得正是时候。"
 SUM_Neo_SDH.88.a:"以契约立信"
 SUM_Neo_SDH.88.b:"以枪杆立威"
 SUM_SDH_RA_Terms_Holy:"终陈其款"
 SUM_SDH_RA_Terms_Holy_desc:"兵临关隘方才提出条件：撤戍、减贡、还水、认独立。关里的守将看完条件脸都白了，连忙修书回城请示。四条缺一不可，到了这一步，刀把子说话，轮不到别人还价。"
 SUM_Neo_SDH.89.t:"终陈其款"
 SUM_Neo_SDH.89.d:"守关的将官把那四条一看，脸唰地白了，连夜飞报主上。大军压到关下，这才慢悠悠亮出条件：撤走戍兵、减轻贡赋、归还水源、承认独立，四条一条都不能减，少一条这仗照打。有谋士出主意：「先应两条敷衍过去如何？」领兵的头摇得像拨浪鼓：「不成，缺一条便是后患。」于是按兵围关，只等回话，箭上了弦、刀出了鞘。那边回音还没影，关下人马已经填平壕沟、把云梯靠上墙头。守军白天提心吊胆，夜里连眼都不敢合，有个胆大的扒着垛口往下瞧，黑压压一片望不到头，腿肚子直打转。先礼后兵，话讲在前头，刀也摆在前头，任你有一千个不情愿，也得点头。"
 SUM_Neo_SDH.89.a:"把利润分给城邦"
 SUM_Neo_SDH.89.b:"把利润收归官库"
 SUM_SDH_RA_Floral_Kingdom:"花神肇邦"
 SUM_SDH_RA_Floral_Kingdom_desc:"花神的龛立遍哈德拉玛维特，祭司由信众公推，绿洲的水按口分。主母的旧座还摆在厅里，只是那座上的权威，如今挪到了每一处龛前。座还是那座，权已不是那权。"
 SUM_Neo_SDH.90.t:"花神肇邦"
 SUM_Neo_SDH.90.d:"厅堂里那把旧椅子还摆得周正，却再没人往上面坐，连拿它当回事的也没有。花神的龛早已立遍哈德拉玛维特，各处龛前的祭司没有哪个是上头派的，全是信众你推我举：谁心诚、谁办事公道，就选谁。绿洲的水也照人头分，和圣所一个章程，事事都隔着龛办，倒也公平。椅子还在，可椅子上的权威早搬到了一个个龛前，众人心里透亮，谁也不挑明，只当它是个摆设。新来的差役见椅子还在于是上去掸灰，被老差役喝住：「旧物罢了，擦它作甚？」如今在这片地界走到哪片绿洲，都能见着花神的龛，龛前有人添香、有人分水，人人都能说上话。权柄从不立在椅子上，它住在人心里。"
 SUM_Neo_SDH.90.a:"借水草养人"
 SUM_Neo_SDH.90.b:"借商队养兵"

 #### 乙线 · 沙暴军国 ####
 SUM_SDH_RB_The_Storm_Regiment:"风沙练旅"
 SUM_SDH_RB_The_Storm_Regiment_desc:"另有一条路，认定沙漠吃的亏全在一个散字：部落散，水源散，兵也散。要不再吃亏，就得把哈德拉玛维特拧成一支风里也不散的军。散沙难握，抱成团才有力量。"
 SUM_Neo_SDH.91.t:"风沙练旅"
 SUM_Neo_SDH.91.d:"那人攥着拳头的手在空中一顿，说道：「散一日，便受一日欺负。」会上众首领听得连连点头。他说的正是病根：沙漠吃亏，全坏在一个散字。部落各管各，水源各占各，兵马临时凑，这么散下去，只能一亏再亏。要想挺直腰杆，就得横下心，把整个哈德拉玛维特拧成一支军，风再大也不散，像一整块铁立在沙里。他把话讲得透：这支军不光要能打，还要能聚，风沙再狂队伍不散，人马再乏号令不违，才能脱了散漫的苦。有首领追问：「聚起来要多久？」他答：「三年就够，怕的是不肯聚。」众人听了都觉在理，当场便商量起整编的章程。"
 SUM_Neo_SDH.91.a:"把土地分给部族"
 SUM_Neo_SDH.91.b:"把土地归入官仓"
 SUM_SDH_RB_Standing_Army:"简练一旅"
 SUM_SDH_RB_Standing_Army_desc:"不再临时雇兵，改养常备。常备军的粮饷由盐路一并支出。每月点卯一次，名册上少了谁，军法便问到谁，一个也糊弄不过去。兵有了固定的饷，打仗才肯用心。"
 SUM_Neo_SDH.92.t:"盐息赡旅"
 SUM_Neo_SDH.92.d:"雇兵的老法子早废了：从前一有事就现招人，打完各回各窝，根本靠不住。如今改成常年养兵，天天操练，银子就出在盐路上。盐路卖盐日日进账，专拨一笔供着军队，吃喝不愁；有那精于算计的，把盐账算得一丝不漏，连一文钱都不肯糟蹋。兵士吃饱了饭，练起来格外有劲，个个精神头足，再不像从前那般散漫。常备军一立，营房、教场、号令样样齐全，月月关饷、日日操演，渐渐练出一股精气神。老兵说，从前扛枪是混饭吃，如今扛枪是正经营生，心里踏实。当年那些雇来的散人，见这队伍体面，也争着报名。盐路养兵，盐商赚了钱，兵士有了粮，两下都得利。"
 SUM_Neo_SDH.92.a:"推举公议的执事"
 SUM_Neo_SDH.92.b:"沿用旧日的长老"
 SUM_SDH_RB_War_School:"开演武场"
 SUM_SDH_RB_War_School_desc:"讲武堂教的是沙战与风战，也教识字。学堂里点着油灯，学员把口令抄了一遍又一遍，抄到半夜。军官里会写字的比不会的好用，命令写得下，才不会误了军机。"
 SUM_Neo_SDH.93.t:"习武课书"
 SUM_Neo_SDH.93.d:"白天舞枪弄棒，夜里点灯识字，有那手笨的，把字划在沙地上一遍遍描，描得满掌是沙。讲武堂教的远不止武艺：沙地怎么埋伏、狂风里怎么辨方向，这些都要学，后来又添了一门认字。原来带兵的若能识文断字、看得懂军令文书，比睁眼瞎好用太多。堂里还立下考条：武艺要考，字也要考，两样都过得去才配当军官；光有一身蛮力却不识字的，顶多做个伍长，别想重用。起先众人还不服，等带兵出去才明白，识字的那批人调度起来头头是道，不识字的伍长急得夜里偷偷找人教。到这时，大伙才叹服这规矩定得在理。"
 SUM_Neo_SDH.93.a:"让花神的誓约作证"
 SUM_Neo_SDH.93.b:"让官署的法度作证"
 SUM_SDH_RB_Rank_Strict:"峻定戎阶"
 SUM_SDH_RB_Rank_Strict_desc:"军阶从上到下排得清楚，谁是哪一级一眼便知。肩膀上的标记远近都认得，谁也冒充不得，连新兵也不敢越雷池一步。越级发令的军法处置，规矩立得严，队伍才不乱。"
 SUM_Neo_SDH.94.t:"峻定戎阶"
 SUM_Neo_SDH.94.d:"那个越级调兵的把总，到底被军法办了，临刑前他叹道：「我错不在勇，在不服管。」三军看了无不凛然。军里阶次从上到下排得一丝不苟：将、校、伍长、小兵，一级管一级，半点不含糊。最要紧的一条，是不许跳过顶头上司发号施令，小兵只听伍长的，伍长只听校尉的。有那自作聪明越级传令的，一经查出军法处置，决不宽贷。军阶既明，升赏也照台阶来，不凭谁一时高兴；立了功的一级级往上爬，众人无话。越级抢功的，非但不赏，反要治罪。军中最忌的就是乱了次序，这规矩一立，上下一条心，打起仗来像胳膊使手指一般顺。"
 SUM_Neo_SDH.94.a:"与雨林互通有无"
 SUM_Neo_SDH.94.b:"与雨林划清界限"
 SUM_SDH_RB_War_Levy:"兵起调发"
 SUM_SDH_RB_War_Levy_desc:"战时按户征发，轮值半年。点名当日，母亲们站在路边，望着儿子随队远去。征发令一下，集市上的年轻人立时少了一半，家家都有人在军中，谁也不能躲。"
 SUM_Neo_SDH.95.t:"兵起调发"
 SUM_Neo_SDH.95.d:"营门口，当娘的追着儿子抹眼泪，一遍遍叮嘱，年轻人回头笑笑，大步走了头也不回。这样的送别，每隔半年就得重演一回。战时按户征发，章程定得明白：一户人家轮值半年，期满就换下一户，周而复始，苦乐均摊，谁也怨不得谁。征发令一下，各处都动起来，集市上平日闲逛的年轻人一下子少了大半，都扛着家伙到军中报到。营盘里顿时人满为患，日日操练，只等号令，一个个憋着劲儿。半年期满轮换回来，年轻人晒黑了、瘦了，身子却结实了，家里人见了又心疼又欢喜。下一户接着上路，一户接一户，从不落空。这按户轮值最难得的就在一个匀字，摊到谁头上都认，没人嚼舌根。"
 SUM_Neo_SDH.95.a:"把土地分给部族"
 SUM_Neo_SDH.95.b:"把土地归入官仓"
 SUM_SDH_RB_Order_All:"一令独行"
 SUM_SDH_RB_Order_All_desc:"把各部的兵、神的兵、雇的兵全编进来，号令从一个地方出。改编当日，三拨人马立在沙地上，头一回听同一个号令。编不进的就地解散，兵归一处，才叫得动。"
 SUM_Neo_SDH.96.t:"一令独行"
 SUM_Neo_SDH.96.d:"中军令旗一落，千军万马齐刷刷动起来，像一个人。这是整编之后的光景。哈德拉玛维特这回下了狠心，把各部的兵、神庙的卫队、先前雇来的散人，全数并到一起，号令从此只认一处，谁也不许再自吹各的号。有那散漫成性、受不得拘束的，也不强留，当场解散回自家去；舍不得脱队赶紧学规矩的，倒争着留下。队伍一整，分营立伍各归其位，从前各打各旗、各吹各号那一套彻底没了。老兵抹着眼睛说，打了半辈子仗，到今日才见着一支像样的军。也有那被遣回去的，背着铺盖一步三回头。这般军容，三军看了无不叹服。"
 SUM_Neo_SDH.96.a:"推举公议的执事"
 SUM_Neo_SDH.96.b:"沿用旧日的长老"
 SUM_SDH_RB_Mechan_Ruin:"故墟藏械"
 SUM_SDH_RB_Mechan_Ruin_desc:"从遗迹里拆出的构装，能走能动，装上兵器便是一队不知疲倦的兵。有一具还会自己认路，走到哪儿都掉不了队。这兵不吃粮，不喊累，只听号令，只有夜里上油时才发出一点声响。"
 SUM_Neo_SDH.97.t:"故墟藏械"
 SUM_Neo_SDH.97.d:"有胆小的兵头回瞧见那东西，吓得倒退三步，只当是妖怪，老兵笑得直不起腰：「这是帮手，怕什么？」那物件是从遗迹里拆出来的构装，不用人赶，自己会走会动，关节缝里隐隐透光。给它挂上兵器，便是一队不喊累、不知怕的铁兵，白日里停在院中像泥塑，一声令下便咔咔开动，步伐齐整，刀枪齐举。后来又给它披甲，描上花神的纹样，远看跟活人没两样。敌军头一回撞见，只道是埋伏的精锐，慌忙后退，等看清是铁疙瘩，已经来不及了。这构装一上阵，替人省下的性命数也数不清，连老兵都对着它发走神。"
 SUM_Neo_SDH.97.a:"让花神的誓约作证"
 SUM_Neo_SDH.97.b:"让官署的法度作证"
 SUM_SDH_RB_Mechan_Works:"设构作局"
 SUM_SDH_RB_Mechan_Works_desc:"专设工坊修补构装，工匠从外邦雇来，图纸锁在柜里。柜子上锁两道，钥匙分两个人拿着，谁也开不了。这图纸轻易不给人看，手艺在人手里，命脉却在那几张纸上。"
 SUM_Neo_SDH.98.t:"设构作局"
 SUM_Neo_SDH.98.d:"那管柜的老吏，连吃饭都把钥匙攥在手心里。图纸锁在柜中，钥匙由专人掌着，每日交接从不离身，匠人照着拆开的样子修，却看不全那图。构装用久了会坏，坏了得修，于是专设一座工坊只管修补。本邦会修的没几个，便从外邦雇了匠人来，这些匠人手艺是有，身份终究是客。有好奇的想多瞧一眼，管柜的便拦住：「此乃机密，非你所能看。」匠人只得缩手。外邦匠人虽聘用也有章程：只许在坊中做工，不得随军移动，完工便请出境；想多留几日的，也被婉言谢绝。这般防备，为的是构装之秘不外泄，着实谨慎。"
 SUM_Neo_SDH.98.a:"与雨林互通有无"
 SUM_Neo_SDH.98.b:"与雨林划清界限"
 SUM_SDH_RB_Mechan_Parts:"零件何自"
 SUM_SDH_RB_Mechan_Parts_desc:"构装的部件只有遗迹里才有，掘一处便少一处。挖到后来，连一块完好的关节都寻不见，众人急得团团转。有人提议向雨林买，这东西卖一件少一件，价钱由不得你。"
 SUM_Neo_SDH.99.t:"零件何自"
 SUM_Neo_SDH.99.d:"管事的对着空账本发愁，整宿整宿睡不着。构装零件日渐稀罕，这东西只古遗迹里有，挖一处便绝一处，挖尽了便再无处寻。有人提议：「既自家挖不着，何不拿钱向雨林买？」众人登时炸了锅：有的说买得来自然省事，有的说雨林那帮人怎会把绝活轻易出手，万一借此掐住咱们咽喉，那时进也不是退也不是。吵来吵去没个结果，只好暂且搁置。管事的没辙，派人四处踏勘遗迹，把零落部件逐一登册，能修的修、能拼的拼，勉强撑着场面。可明眼人都清楚，这是坐吃山空。买的主意隔三差五又被人拾起来，却总也定不下，真真是巧妇难为无米之炊。"
 SUM_Neo_SDH.99.a:"把土地分给部族"
 SUM_Neo_SDH.99.b:"把土地归入官仓"
 SUM_SDH_RB_Doctor_Contract:"次席盟约"
 SUM_SDH_RB_Doctor_Contract_desc:"有位外邦的学者愿意提供构装的核心，代价是要在沙地设一处试验场。主母接过契约，先看了三遍，才问那试验场要多大。这买卖听着便宜，天下没有白给的好处。"
 SUM_Neo_SDH.100.t:"次席盟约"
 SUM_Neo_SDH.100.d:"那试验场围起高墙，连送饭的都不许跨进门槛，学者日日在里头拆了又装，谁也看不透他打的什么主意。这事起于一个外邦人主动上门，他手里攥着构装的核心秘诀，说愿意拿出来帮忙。可世上哪有白得的便宜，他要的回报是在沙地划一块地方，任他随意摆弄。众人一时拿不准：有的说这核心千载难逢，不妨答应；有的说让外人在腹地设场，分明是引狼入室。学者见众人迟疑，便道：「我只要一块沙地，旁的不要，也绝不惹事。」首领沉吟半晌，终究点头。派去盯梢的回来报，说这人的学问是真，心思却深。首领叮嘱底下看紧些，半点大意不得。"
 SUM_Neo_SDH.100.a:"推举公议的执事"
 SUM_Neo_SDH.100.b:"沿用旧日的长老"
 SUM_SDH_RB_Mechan_Army:"械聚成行"
 SUM_SDH_RB_Mechan_Army_desc:"第一支全由构装组成的队伍，在一次风夜里出动，回来时一个部件也没少。风夜黑得伸手不见五指，这队兵摸黑也走得齐整。从此军中都说，这队兵不饮不食，倒省心。"
 SUM_Neo_SDH.101.t:"械聚成行"
 SUM_Neo_SDH.101.d:"天亮点验，营门口一个个数过去，零件一个没少，连外头的漆都没蹭破。头一支全用构装凑成的队伍，出动那天正撞上大风夜，风沙呼啸天地昏黑，恰是铁家伙逞能的时辰。一队构装咔咔开拔，刀枪在风里泛冷光，没一个活人，却进退合度、行列笔直，越过沙丘、绕开乱石，径直扑向敌营。这一仗打得利落，人人称奇，军里士气跟着高涨。带队的老兵夜里说，这铁东西不知疼、不叫累，倒比活人还叫人安心。先前见了它就躲的兵，如今敢跟它并排走，胆大的还起了个诨名叫铁人。往后一遇硬仗，主帅先放构装在前头冲，无往不利，铁人名头从此响遍全军。"
 SUM_Neo_SDH.101.a:"让花神的誓约作证"
 SUM_Neo_SDH.101.b:"让官署的法度作证"
 SUM_SDH_RB_Storm_Core:"风卫就列"
 SUM_SDH_RB_Storm_Core_desc:"风卫一支专挑风天出战，平日驻在沙漠最深处的营里，轻易不下城。风一起，别人躲还来不及，他们却列队出营，就着漫天黄沙摸向敌阵。这等兵马罕见，风越大，他们的刀越快。"
 SUM_Neo_SDH.102.t:"深垒习风"
 SUM_Neo_SDH.102.d:"城里几次派人来请，都被挡了回去，非得等到大战临头，他们才倾巢而出，一出手便惊人。风卫这支部队专为风天而生，平时窝在最深的营地里，轻易不挪窝。风天作战讲的就是藏和忍，城里人头攒动，反倒碍事；那营地埋在沙丘怀里，大风一刮便与世隔绝，正好练本事。他们天天在狂风里穿行，练出一双能辨沙的眼、一副站得稳的脚板。队里有铁规矩：不见大风不出营，风一起便全员出动。身上还带着钩索，专在风沙里攀沙丘、绕到敌人背后。有那新兵问为何总猫着，老兵指着漫天黄沙：「风一来，路就开了。」藏得这样深，出手又这样狠，叫人防都防不住，那钩索着实厉害。"
 SUM_Neo_SDH.102.a:"与雨林互通有无"
 SUM_Neo_SDH.102.b:"与雨林划清界限"
 SUM_SDH_RB_Storm_Scout:"风鸣为号"
 SUM_SDH_RB_Storm_Scout_desc:"风哨这班人认风比认路还准，站在高处便知百里之外哪一片沙丘要起沙暴。有一回他报说东边有风，众人皆笑，半个时辰后果然天昏地暗。这双眼睛抵得上百张地图。"
 SUM_Neo_SDH.103.t:"候风知远"
 SUM_Neo_SDH.103.d:"有人不信邪，特地派人蹲到那片地上等，时辰一到，果然沙尘滚滚，分毫不差，众人才服气。风哨这一行，看风比看路还灵：旁人认道靠地标星斗，他们却拿眼睛读风。风里裹着什么味、往哪边偏、带不带沙，一嗅一望便知根底。本领最强的，隔百里就能断言哪片要起沙。有风哨在军中，等于多了一双千里眼。他们不光报起沙，哪片沙地踩下去会陷、哪处风向入夜要变，也都记得清清楚楚。有回行军，风哨说前头沙软，果然一队骆驼陷了蹄，众人才知他不是嘴上功夫。有他引路，大军少绕许多冤枉道。这双辨风的眼比图纸还准，行军得了这样一个人，如同添了翅膀。"
 SUM_Neo_SDH.103.a:"把土地分给部族"
 SUM_Neo_SDH.103.b:"把土地归入官仓"
 SUM_SDH_RB_Storm_Camel:"风驼就列"
 SUM_SDH_RB_Storm_Camel_desc:"风驼营里的骆驼一概不挂铃铛，行军时蹄子裹了软布，走得再快也听不见半点响动。夜里悄悄摸过敌营，守兵只当是风声。这无声的行军，比千军万马还叫人胆寒。"
 SUM_Neo_SDH.104.t:"解铃宵征"
 SUM_Neo_SDH.104.d:"敌营外的沙地上，天亮后多出一圈驼蹄印，守夜的兵竟没听见一丝动静，吓得脸都白了。风驼营的驼队，颈上光秃秃的，一颗铃也没有。别处驼队走起来叮当乱响，几十里外都能听见，偏这营反着来：铃摘净，蹄裹布，人踏沙上轻得像片叶子。有一次他们夜里贴着敌营外侧过去，守军抱着刀打盹，直到天亮看见沙上一串串蹄印，才惊得一屁股坐在地上。新来的兵不明就里，偷偷摸出铃要挂，被老兵一把攥住手腕：「你嫌敌人睡得太死么？」老兵又说，铃一响，暴露的不是驼，是全营的命。行军最忌声响，这摘铃的规矩看着不起眼，实则是保命的大学问。"
 SUM_Neo_SDH.104.a:"推举公议的执事"
 SUM_Neo_SDH.104.b:"沿用旧日的长老"
 SUM_SDH_RB_Storm_Siege:"选锋破关"
 SUM_SDH_RB_Storm_Siege_desc:"破关队专打雨林伸进沙漠的关隘，趁风起时借着漫天黄沙遮眼，一路摸到墙根底下。等守兵察觉，刀已架上脖子。有一回风一起他们便摸了进去，天亮时关隘已易了主。"
 SUM_Neo_SDH.105.t:"伏地循墙"
 SUM_Neo_SDH.105.d:"待摸到墙根，便悄悄竖起云梯，冷不丁翻上墙头，有那守军直到刀架在脖子上才惊觉不妙。破关队专攻雨林伸进沙漠的关隘，那些关隘依地形而修，墙高壕深，正面硬攻吃亏的是自家。于是他们练了一手绝活：从风里摸到墙根。每到大风天，便借风沙掩护贴着地面一寸寸往墙根爬，风沙迷了守军的眼，谁也瞧不见墙下有人。队里还备着短刀与闷棍，专为翻上墙头后近身搏杀。他们练了多年，脚步极轻，落地无声，连沙都不怎么响。这从风里摸墙的绝活最考耐性，也最考胆气，少一分都成不了事，着实难得。"
 SUM_Neo_SDH.105.a:"让花神的誓约作证"
 SUM_Neo_SDH.105.b:"让官署的法度作证"
 SUM_SDH_RB_Storm_Endure:"习忍渴法"
 SUM_SDH_RB_Storm_Endure_desc:"这支部队练兵头一条便是耐渴，三日无水照赶路，照操演，谁也不许叫一声苦。练出来的兵水囊带得少，补给便能省下三成。沙漠里打仗，省下水便是省下命。"
 SUM_Neo_SDH.106.t:"习忍渴法"
 SUM_Neo_SDH.106.d:"这三日无水的苦练，起初也有人受不住险些栽倒，熬过之后身子反倒结实。全军都要练一样本事，便是耐渴：沙漠行军最难找水，练兵时便有意不给水喝，三日无水照旧赶路操练。起初兵士叫苦不迭，嗓子冒烟嘴唇起皮，可练久了竟也熬过来。耐渴的本事练成，好处就显出来：军中带的水可大大减少，补给减去三成。从前走一趟得驮许多水囊，如今轻装上路快了许多，兵士也说这苦没白吃。军中还传下话来：能耐渴者方能走远路、打硬仗。这苦练出来的本事到了沙场能救人性命，值，这三日之苦没有白受。"
 SUM_Neo_SDH.106.a:"与雨林互通有无"
 SUM_Neo_SDH.106.b:"与雨林划清界限"
 SUM_SDH_RB_Land_Commons:"均田于部"
 SUM_SDH_RB_Land_Commons_desc:"土地一事如今重新分过。主母名下的、官署名下的田，一概分回各部，部里再按人头一户一户分到手里。有从前没地的，如今也得了两垄。地分到手，人心便定了。"
 SUM_Neo_SDH.107.t:"均田于部"
 SUM_Neo_SDH.107.d:"老人蹲在新分到的田埂上，手掌一遍遍抚着土，眼泪吧嗒吧嗒掉。田规这一改，把几代人的盼头都兑现了。早先主母和官署名下圈着大片的肥田，旁人连靠近都不许；如今这些地全数划回各部，部里再照人头一亩亩分下去。有那祖辈就在主母田里刨食的，这回也领到了自家的地，喜得说不出整话。分田那天，众人围着界石你量我量，吵归吵，脸上却都是笑。自家地一到手，耕作立马勤快起来，引水、施肥、深耕，样样不肯落后，从前荒着的主母田，转眼种满了庄稼。老人抚着田埂念叨：这是祖辈盼了多少代的东西。地落到手里，人心就稳了，胜过任何条文。"
 SUM_Neo_SDH.107.a:"把土地分给部族"
 SUM_Neo_SDH.107.b:"把土地归入官仓"
 SUM_SDH_RB_Water_Share:"水泽共汲"
 SUM_SDH_RB_Water_Share_desc:"水井与绿洲如今按人口分，人多得多，人少得少，明明白白写在册上。先前多占了地的人这回都得吐出来，一文不肯让。有不肯退的，众人一齐上前理论，也只得退了。"
 SUM_Neo_SDH.108.t:"水泽共汲"
 SUM_Neo_SDH.108.d:"井边立着块木牌，哪家分几多水都写在上面，谁经过都能瞄一眼。水井和绿洲也照人口分：一村多少人便配多少水，多占的统统退回。这事说起来简单，办起来却费了工夫。有那从前霸着大片绿洲的部族，如今要退出许多，磨磨蹭蹭不肯，管事的便把人口册摊开，一笔笔算给他看：你家几口人、该得几份水，明明白白多占不得。那人没话说，只得依了，众人看了都说公道。有个妇人对不上自家份额，管事的又拿算盘拨了一遍，分毫不差。有那分得少的，起初还嘟囔两句，抬头看看木牌，也就不响了。往后想再占便宜的，走到井边瞧瞧木牌，也就死了心。凡事就怕明白二字，账目一摆开，争端自然就歇了。"
 SUM_Neo_SDH.108.a:"推举公议的执事"
 SUM_Neo_SDH.108.b:"沿用旧日的长老"
 SUM_SDH_RB_Farm_Together:"耦耕共田"
 SUM_SDH_RB_Farm_Together_desc:"各部的田如今合在一处种，哪块歇，哪块种，轮着来，地力便养得住。收成按各人出的工分，谁多干谁多拿，算得清清楚楚。分得清，也就吵得少了。这轮作之法聪明。"
 SUM_Neo_SDH.109.t:"并田计力"
 SUM_Neo_SDH.109.d:"往年种上三年就薄的地，如今年年有收成，老农蹲在田埂上直说稀奇，那片坡地上的谷子长得齐刷刷的。各部的田如今合到一处轮作：这片种谷，那片歇耕养地，来年再倒过来，地力便不衰。只是各家田挨在一起，收成怎么算？按工分，谁出的工多谁多分，做了多少都记在册上，分得清就吵得少。从前为地界、为收成动不动红脸，如今账目摆明，谁也没话说。各家按工分粮，多劳多得，心服口服。合田这事，起初人人怕吃亏，如今见了好处反倒交口称赞。有那当初反对最力的，也点头说：「利不十，不变法，如今才算信了。」"
 SUM_Neo_SDH.109.a:"让花神的誓约作证"
 SUM_Neo_SDH.109.b:"让官署的法度作证"
 SUM_SDH_RB_Grain_Common:"共此囷廪"
 SUM_SDH_RB_Grain_Common_desc:"丰年时各部的粮合进一座大仓，荒年时再一齐开仓放粮。放粮按人口，一人一份，不问你出自哪一族。有一年大旱，全靠这仓粮救了急。这合仓之法救命。"
 SUM_Neo_SDH.110.t:"义廪计口"
 SUM_Neo_SDH.110.d:"放粮那天，众人围着仓门按册领，没一个争抢，轮到孤寡老人，管事的还多添一勺。公仓的规矩是丰年合、荒年共放：丰年各家把余粮一同交进来，堆得满满当当；荒年便开仓，按人口一口一份，不问哪一族哪一部。有那仗着部族势大想多领的，管仓的一口回绝：「这里只认人口，不认部族。」众人见了都道周正。公仓钥匙几人各执一把，跟军费库一般严紧。荒年里就靠这仓粮，一村一寨都熬过了难关，人人感念。荒年最见人心，这一仓粮，救了一方百姓，也养出一方和睦。"
 SUM_Neo_SDH.110.a:"与雨林互通有无"
 SUM_Neo_SDH.110.b:"与雨林划清界限"
 SUM_SDH_RB_Speak_Reed:"置公论堂"
 SUM_SDH_RB_Speak_Reed_desc:"主母厅对面另盖起一座公议庭。两座厅隔着一条街，谁都能进去说话，不管你是部长老还是平头百姓。有冤的诉冤，有计献计，没人拦着。这公议庭一立，主母的厅便不再是唯一的门。"
 SUM_Neo_SDH.111.t:"置公论堂"
 SUM_Neo_SDH.111.d:"从公议庭出来的人，长长呼出一口气，说压在胸口多年的话今日总算倒干净了。主母厅对面隔一条街，新立起一座公议庭，两下遥遥相对。主母厅是旧权威，门槛高，平常人迈不进去；公议庭却是新设的，门槛低，谁都能进。庭外还摆了张长凳，供等候的人歇脚，比主母厅门前亲切得多。不管是各部长老还是寻常牧人，只要占理，便可进去把话讲透。有那受了委屈、从前没处诉的，如今到庭上当着众人一一道来，听的人都能替他做主，有个老牧人进来时还攥着帽子，出去时腰杆都直了。庭里没什么繁文缛节，也不设高座，众人围坐一圈，谁有理谁说，说完大伙评议，说得在理的当场就定主意。这庭地方不大，却把压在主母厅里的闷气都散了，着实痛快。"
 SUM_Neo_SDH.111.a:"把土地分给部族"
 SUM_Neo_SDH.111.b:"把土地归入官仓"
 SUM_SDH_RB_Iron_Mine:"凿山出珍"
 SUM_SDH_RB_Iron_Mine_desc:"山里开了矿，取铁打器。矿工分作几班轮流下洞，歇人不歇镐。工钱按月结清，一文不拖。有欠债的矿工，拿了工钱先把债还了。这按月结钱，让人安心。"
 SUM_Neo_SDH.112.t:"凿山取矿"
 SUM_Neo_SDH.112.d:"矿工们一班下来，浑身乌黑，腰都直不起来，可每到月底管账的发钱，一文不短，揣上钱脸上就笑了。矿洞藏在深山里，又黑又潮，挖铁着实受罪，矿工按班轮值。新来的嫌苦想撂挑子，老矿工拍拍他肩膀：「苦是苦，可钱月月到手，养家糊口比放羊强。」那人听了便留下。有人算过账，一年下来比在沙地里放牧还强些，于是自愿进矿的人渐渐多了。这深山里挖出的铁，供的正是军械，辛苦归辛苦，却也紧要，铁料一出，军械就有了着落。"
 SUM_Neo_SDH.112.a:"推举公议的执事"
 SUM_Neo_SDH.112.b:"沿用旧日的长老"
 SUM_SDH_RB_Forge_War:"设兵作局"
 SUM_SDH_RB_Forge_War_desc:"军械坊专造刀枪与马掌。打出来的物件头一批先紧着风卫用，剩下的才发给别处。铁匠日夜轮班，炉火从没熄过。好钢用在刀刃上，不假。"
 SUM_Neo_SDH.113.t:"作院铸兵"
 SUM_Neo_SDH.113.d:"烧红的刀往水里一按，滋滋一阵白汽，如此几番，刀刃才锋利得能削铁。军械坊专造兵器，刀矛弓箭都打，连护马的马掌也做，杀敌的和护马的一样马虎不得。打造出来的东西先紧着谁？先紧着风卫。风卫是专打风天的精锐，装备自然要头等的，坊里匠人把最好的铁、最利的钢都留给他们，旁的队伍想要好兵器得往后排。匠人们日夜炉火不熄，一件件兵器出炉，反复打磨才锋利无比。有一回淬火失了手，一炉刀全崩了口，匠人疼得直跺脚。坊里最讲究的就是淬火这道工序，外行人看着稀奇，匠人却道：「这一手，没十年功夫学不来。」好兵器，原是费工夫的。"
 SUM_Neo_SDH.113.a:"让花神的誓约作证"
 SUM_Neo_SDH.113.b:"让官署的法度作证"
 SUM_SDH_RB_Salt_Money:"盐息赡兵"
 SUM_SDH_RB_Salt_Money_desc:"盐路赚的钱一吊也不进私囊，专款养军。账目一笔笔写在纸上，贴在营门口，谁都能看，谁都能算。有想贪的，看了看那张纸便缩了手。账目公开，少了好多手脚。"
 SUM_Neo_SDH.114.t:"盐息赡兵"
 SUM_Neo_SDH.114.d:"管账的每月把账重誊一张贴到营门口，风刮坏了就再贴一张，兵士们都说这明白账最让人放心。盐路的进账专款养军，日日贩盐银钱源源而来，一文也不挪作别用。难得的是账目公开，一笔笔都贴在营门，哪个兵士想看就凑上去：本月盐路进多少、军中用多少、剩多少，一目了然。有那新兵不识字，便拉住识字的念给他听。有疑心军官贪墨的，看了账也没了话说；兵士见钱粮有着落，练兵更有劲。军中大小开销都从这钱里支，米面、草料、军械样样不缺。兵马未动，粮草先行，这盐路就是大军的后路。"
 SUM_Neo_SDH.114.a:"与雨林互通有无"
 SUM_Neo_SDH.114.b:"与雨林划清界限"
 SUM_SDH_RB_Tent_Maker:"幕下置作"
 SUM_SDH_RB_Tent_Maker_desc:"帐幕作坊做的是行军帐与风袋。风天扎营，别人手忙脚乱，他们支帐快上一刻钟。别小看这一刻钟，风沙里少挨一刻便少折损一批人马。这等手艺也能救命。"
 SUM_Neo_SDH.115.t:"幕下置作"
 SUM_Neo_SDH.115.d:"风在外头鬼叫，帐里却暖得像自家的炕，新兵钻进去半天不肯出来。这帐幕作坊专做两样东西：行军帐和风袋。行军帐轻便结实，一撑就起；风袋鼓足气便能挡风。这两样看着不起眼，实则要命：风天扎营若慢一刻钟，队伍就多挨一刻钟风沙，多折一批人。作坊匠人手脚极快，一搭一撑转眼成帐，赶起工来叫人眼花缭乱，队伍见了都赞功劳不小。坊里还备着许多风袋，扎营时鼓起来就是一道挡风的墙。有个没见过这阵仗的新兵，站在帐里听着外头呼啸，惊叹得说不出话。行军打仗，住的也是大事，这一座作坊，替三军省下大力气。"
 SUM_Neo_SDH.115.a:"把土地分给部族"
 SUM_Neo_SDH.115.b:"把土地归入官仓"
 SUM_SDH_RB_War_Chest:"军帑充牣"
 SUM_SDH_RB_War_Chest_desc:"军费库单设一处，与别的钱分开。要用这钱须得三个人同时开口，少一个也开不得库门。有一回两人想动钱，第三人不在，只得作罢。这规矩严是严，却省了许多糊涂账。"
 SUM_Neo_SDH.116.t:"三钥共缄"
 SUM_Neo_SDH.116.d:"曾有人想抄近道，只找两人商量动军费，第三人不肯，这事就黄了，从此分毫不敢乱动。军费库是单设的一座，存着军中钱粮，规矩极严：动用须三人同时开口，缺一不成，为的是防一人独断把钱挪作私用。三个管库的各执一把钥匙，三把齐到才能开库，也都是众人公推的，彼此监督。每逢开库，三人当面点清，记下数目，签字画押，三张口对着账本，谁也别想糊弄过去。这般麻烦，为的就是堵住贪墨的念头。真个是三把钥匙三张口，谁也休想独吞钱。这规矩周全，人人称善。"
 SUM_Neo_SDH.116.a:"推举公议的执事"
 SUM_Neo_SDH.116.b:"沿用旧日的长老"
 SUM_SDH_RB_War_Economy:"兵兴理赋"
 SUM_SDH_RB_War_Economy_desc:"盐、粮、铁三样如今一律管制，归于战时。先供军中，再顾百姓，次序排得明明白白。有囤积居奇的，一经查出货便充了公。乱世之中先军后民，是没法子的法子。"
 SUM_Neo_SDH.117.t:"兵兴理赋"
 SUM_Neo_SDH.117.d:"盐场门口，一个兵丁捏着条子来支盐，掌秤的少舀了一勺，他瞅了瞅，没敢吭声，扎紧袋口就回营了。围看的百姓也没一个言语。这是哈德拉玛维特风沙起后的事：议事厅里灯火彻夜通明，当权者一拍案子定下三条，盐、粮、铁尽数划归战时管制。也难怪，盐能提兵丁的气力，粮能饱行军的肚子，铁能打刀枪，差一样这仗都没法打。差役分头去办，盐场的秤换了新的，粮仓的锁换了新的，连铁匠铺的炉子都派了兵守着。先紧着军中使用，剩下的才轮到百姓。市集上一夜之间改了规矩，卖盐的手不敢抖，买铁的嘴不敢张。一个老妇排到队前，捧着分到手的一小撮口粮，嘴里翻来覆去念先军后民四个字，听不出是夸还是怨。"
 SUM_Neo_SDH.117.a:"让花神的誓约作证"
 SUM_Neo_SDH.117.b:"让官署的法度作证"
 SUM_SDH_RB_Curfew:"申禁夜行"
 SUM_SDH_RB_Curfew_desc:"入夜之后一律宵禁。街上静悄悄的，只有巡逻的更夫来回走，脚步声在空巷里格外清脆。夜里安静了，白天说闲话的人也跟着少了。这宵禁一严，城里的许多人情也便淡了。"
 SUM_Neo_SDH.118.t:"鼓绝行人"
 SUM_Neo_SDH.118.d:"城西卖汤饼的老翁，往日吆喝到三更，如今二更刚过就收摊，有人问起，他压着嗓子道：「钱少赚些不打紧，莫惊动了巡夜的。」军令一下，入夜就宵禁。更鼓一敲，铺子纷纷上门，灯火一盏盏灭了，只剩巡逻兵丁提灯沿街走，影子在土墙上晃。宵禁本为防奸细，日子久了，连白日的话都少了：街坊碰面先往四下张望一遭，才敢低声说两句，说完各自散。先前茶摊上高谈阔论的如今都闭了嘴，怕隔墙有耳。卖水的老汉挑担走街，见人就摇头叹气却不敢出声。夜里的城静得怕人，连狗都不叫，偶尔有孩子要哭，也被大人一把捂住嘴，巡夜的从门前走过，老翁连忙把灯吹了。"
 SUM_Neo_SDH.118.a:"与雨林互通有无"
 SUM_Neo_SDH.118.b:"与雨林划清界限"
 SUM_SDH_RB_Propaganda:"颁宣谕旨"
 SUM_SDH_RB_Propaganda_desc:"雨林欠沙漠的账被人编成了歌。集市上有人唱，唱完众人跟着和，一城唱罢又传到下一城。唱到欠水、占地的句子，听的人便咬牙。这歌比檄文还厉害，是深入人心。"
 SUM_Neo_SDH.119.t:"弦歌载事"
 SUM_Neo_SDH.119.d:"雨林那边起先只当是支野调，听日子久了，才咂摸出调子里压着的分量。这事得从一个歌手说起。沙漠人记性好，尤其记仇，雨林占了多少水、多收了多少过路税，一笔笔都刻在心里。有个识字的歌手索性把旧账编成歌，一句欠水、两句占地、三句多税，调子悲凉，在集市支个摊就唱。听的人围成一圈，听到恼处齐齐跺脚，有的跟着抹泪。他唱完歇口气又从头来。第二天歌就传到邻城，有个货郎学了几句，挑着担子一路唱到别的镇上，邻城人依样编自己的词。没几个月几处绿洲都会唱，娃娃不懂账目，调子却记得最牢，成天在巷里哼，连瞎眼的老婆婆也能把欠水那句唱全。后来越传越远，连沙海尽头的商队歇脚也哼两句。"
 SUM_Neo_SDH.119.a:"把土地分给部族"
 SUM_Neo_SDH.119.b:"把土地归入官仓"
 SUM_SDH_RB_Tribunal:"置军正司"
 SUM_SDH_RB_Tribunal_desc:"军中设了军法处，专管临阵脱逃。犯了事的就地正法，决不宽贷。判完还要当众宣布，把罪名一条条念出来，教众人听了知所畏惧。军法如山，容不得半点私情。"
 SUM_Neo_SDH.120.t:"辕门斩罪"
 SUM_Neo_SDH.120.d:"监斩官在辕门外高声念那兵丁的罪状，一字一句清清楚楚，念完刀落，三军屏息。行刑那日辕门外站满了人，连篝火都忘了添柴。那兵丁交锋时腿软退了半步，就被军法处拿住绑了出来。行军最怕人心散，当权者特设军法处，明明白白立下规矩：临阵脱逃就地正法，绝不宽宥。判词还一定要当众宣布，叫三军都听见。为何当众？杀一人是儆百人，悄悄办了谁还知道怕。这事传开，三军再无敢回顾的，个个向前。将士看了这一幕，颈后都发凉，暗想军法处果然不是虚设，日后上阵谁还敢把性命当儿戏。打这以后，营里操练格外用心，号令一下动止齐心。"
 SUM_Neo_SDH.120.a:"推举公议的执事"
 SUM_Neo_SDH.120.b:"沿用旧日的长老"
 SUM_SDH_RB_Mobilize_All:"举境皆兵"
 SUM_SDH_RB_Mobilize_All_desc:"动员令一下，各部都动了。凡能拿得动兵器的，不论老少都上了名册。有不会使刀的，也领了一杆长枪，日日操练。到了这地步，沙漠端的是全民皆兵了。"
 SUM_Neo_SDH.121.t:"举境皆兵"
 SUM_Neo_SDH.121.d:"「我拉得动弓，就算能拿兵器。」一个胡子花白的老猎人也来报名，把书吏都逗笑了。动员令一下，像一阵疾风扫过哈德拉玛维特的每处绿洲，传令骑手昼夜换马，把文书送到各部落。册上要登的，凡拿得动兵器的，不分老幼都算数。各处空地都排起长龙：壮汉扛着自家的大刀，少年攥着长枪，手心全是汗。书吏伏在矮桌上，笔尖飞快，一个名字接一个往下写，墨汁溅到手背上也顾不上，手腕酸了就甩一甩、蘸蘸墨再写。不多时，几大本名册摞得老高，农夫、猎户、商贩，连闲汉也在上头，名字排得密密麻麻。掌事的把名册收拢，拿绳捆成三捆，这才长舒一口气。"
 SUM_Neo_SDH.121.a:"让花神的誓约作证"
 SUM_Neo_SDH.121.b:"让官署的法度作证"
 SUM_SDH_RB_Iron_Storm:"金戈沙碛"
 SUM_SDH_RB_Iron_Storm_desc:"哈德拉玛维特的兵不再散在各部，都按号驻进固定的营。风起了照操，风停了照练，再乱的风也吹不散队伍。沙漠头一回有了这样一支军，也有了这样一张密密的号册。"
 SUM_Neo_SDH.122.t:"金戈沙碛"
 SUM_Neo_SDH.122.d:"号手一吹号，各营依着次序开进点将台，整整齐齐，号声一停，几千只脚同时落地，沙地上咚的一声闷响。有个新兵头回站进队列，紧张得手心冒汗，却半步也没挪错，连平日里最散漫的老兵，站在队里也忍不住挺直了腰。老兵看了忍不住点头，说沙漠里头一回有了这样一支军。先前哈德拉玛维特的兵散在各部，像沙子撒在滩上，风一吹就各奔东西；如今按号头驻进固定营盘，哪一号住哪顶帐、站哪班岗都有定规。风起照旧操练，风停照旧演练，从不懈怠。沙漠练兵难就难在风，风沙迷眼队列最易乱，可这支兵偏在风里站稳了脚，号册排得密密麻麻，风再大也吹不散。每逢校场比武，各营号手一齐吹号，声音在沙丘间回荡。不知底细的外人看了还当是天兵下界，哪知这都是平日里在风沙中一遍遍操出来的功夫。"
 SUM_Neo_SDH.122.a:"与雨林互通有无"
 SUM_Neo_SDH.122.b:"与雨林划清界限"
 SUM_SDH_RB_Sand_Commune:"沙产入官"
 SUM_SDH_RB_Sand_Commune_desc:"哈德拉玛维特的地分回了各部，水按人口分，粮在荒年一齐放。主母厅对面又立起一座公议庭，两厅隔着一条街相对。来往的人先去哪一座，只看当天日头晒哪边。"
 SUM_Neo_SDH.123.t:"沙产入官"
 SUM_Neo_SDH.123.d:"两座厅办事的人也摸出了门道：遇急事先到公议庭议个章程，再到主母厅用印；寻常琐事便拣阴凉的那座进去说，日子一久倒也相安。有人笑说，这日头倒成了派差的章程。也有那偷懒的想躲进阴凉厅里混事，被办事的一把轰了出去。打完仗、定完规矩，哈德拉玛维特的地又分回各部：田还是那些田，分法却变了，水按人头一口一份，谁也多占不得；粮照荒年的例一同放出，不分彼此。更有一桩新鲜事，主母厅对面隔条街立起了公议庭，凡事不能都由主母一人说了算，得有个公议的地方。来往的人先往哪边去，全看当天日头：日头晒在公议庭这边，人们便躲进主母厅的阴凉；日头转过去，又都踱到公议庭来，你推我让倒也公平。"
 SUM_Neo_SDH.123.a:"把土地分给部族"
 SUM_Neo_SDH.123.b:"把土地归入官仓"

 #### 丙线 · 绿洲自治 ####
 SUM_SDH_RC_The_Oasis_Parliament:"洲中咨政"
 SUM_SDH_RC_The_Oasis_Parliament_desc:"第三条路不要神权，也不要军国。只求把哈德拉玛维特的几处绿洲，经营成能自己过日子的地方：议政、通商、立律、养民。各处的枣椰树下都置了一间议事棚，棚下设一排矮凳。对外只求一件事，别来管。"
 SUM_Neo_SDH.124.t:"洲中咨政"
 SUM_Neo_SDH.124.d:"西边绿洲的议事厅里，一盏灯亮到半夜，几个人围着沙盘比划了三天，才敲定方向。天下的走法不止两种，他们既不靠神明，也不穷兵黩武，偏挑了另一条：不仰仗祭司，也不逞刀枪，只求把几处水草地经营成能自给自足的家园。具体怎么办？议事、做生意、定法度、养百姓，四件事一齐抓，里头把光景过好，外头只求一件，谁也别来插手。这主意听着寻常，真做起来处处碰壁。祭司一派骂他们背离正道，刀兵一派嫌他们没骨气，两头都不待见。可绿洲的人打定主意，关起门埋头过自家的日子：地照耕、集照赶、法照行。有人犯疑，说既不结盟也不称霸，岂不任人揉搓？当权者把账本一合，指着上头连年的收成道：「能护住眼前这份太平，就是能耐。」众人听了恍然，连先前主张结盟的也不再言语。"
 SUM_Neo_SDH.124.a:"重立赤王的旧制"
 SUM_Neo_SDH.124.b:"重建城邦的议会"
 SUM_SDH_RC_Oasis_Charter:"镌绿洲典"
 SUM_SDH_RC_Oasis_Charter_desc:"每处绿洲各立一份宪章，写明公事由谁议、谁办、谁查，一样样分得清楚。谁也不许越过章程办事，出了事照章追究。章程抄在羊皮上，一份挂在井台边，任人去看。"
 SUM_Neo_SDH.125.t:"镌绿洲典"
 SUM_Neo_SDH.125.d:"谁要是越过章程自作主张，旁人便把那张纸往他跟前一摊，指着上头一条念给他听，念得他脸红到脖子根，再不敢吱声。第三条路定了，头一桩就是立规矩：哈德拉玛维特每处绿洲都立一份宪章，写明哪些算公事、由谁议谁办谁查，一条条分得清。吃过亏的人明白，凡事囫囵吞枣，日后定是你推我赖；如今白纸黑字写死，议的管议、办的管办、查的管查，各守一摊，谁也休想一手遮天。立宪章那天，广场上摆开长案，识字的当众念，不识字的竖耳听，念完一处众人便按手印。宪章一立，就成了办事的准绳。这一张纸的厉害，胜过千军万马。"
 SUM_Neo_SDH.125.a:"召集能战之众"
 SUM_Neo_SDH.125.b:"召集能谋之士"
 SUM_SDH_RC_Council_Oasis:"洲众会议"
 SUM_SDH_RC_Council_Oasis_desc:"各处绿洲各推代表，聚到一处议事。议期定的是一个月，议完便各回各家，不许逗留。有话没说完的，也只得记下来，下月再说。这议期一满就散，干脆。"
 SUM_Neo_SDH.126.t:"洲众会议"
 SUM_Neo_SDH.126.d:"代表们拍着桌子争得脸红脖子粗，待议出个公道结果，又都哈哈一笑前嫌尽释，第二日照旧一同下地。各处立了宪章，接着便议事：各处推举信得过的人物当代表，聚到一处。议期限一月，一月内把该议的都议完，议完各回各家不许多留。为何限一月？这事关农时，代表在家都有田有活，久拖误了耕作，百姓先不答应。有一处代表为半渠水争了半晌，最后各让一步，皆大欢喜。当下各处代表陆续到了，见面叙礼后落座，把带来的议题一条条摆上桌面，你一言我一语，争到激烈处面红耳赤，可到头来总能议出结果。议事那些天，厅堂里烟气缭绕，茶碗换了一道又一道，洒出的茶水把脚边的沙都洇湿了一片。"
 SUM_Neo_SDH.126.a:"以神权号令沙漠"
 SUM_Neo_SDH.126.b:"以律法约束诸城"
 SUM_SDH_RC_Elder_Elect:"众举耆宿"
 SUM_SDH_RC_Elder_Elect_desc:"长老一职如今不再世袭，由绿洲上的住户公推，谁得人心谁来做，任期三年，到时重推。推举当日就在井台边，众人排一行，把手里的小石子投进陶罐。有做得出色的，连任也不稀奇。"
 SUM_Neo_SDH.127.t:"众举耆宿"
 SUM_Neo_SDH.127.d:"旧时的长老，多是老子传儿子，一代代世袭下来，不管贤不贤，反正轮到谁就是谁。如今改了规矩，长老不再世袭，改由绿洲上的住户公推。谁办事公道，谁就得人心，谁就得票。任期也定下，三年一任，到期满时再推一回。原来世袭的长老，久坐那位子，便把自己当成了主子，百姓的死活全不放在心上。如今三年一换，做得好留你，做不好请你走，人人都得夹着尾巴办事。头一回公推当日，绿洲的场上聚了满满的人，候选的站在前面，众人你指指这个，我点点那个，最后敲定。新任的长老上任头一件事，便是把自家的账目摊在众人面前，从一粒盐数到一斗粮，明明白白。百姓看了，都说这回选对了人。"
 SUM_Neo_SDH.127.a:"把遗迹挖开"
 SUM_Neo_SDH.127.b:"把遗迹封回去"
 SUM_SDH_RC_Petition_Hall:"置一受辞"
 SUM_SDH_RC_Petition_Hall_desc:"设了一处陈情衙门，谁有冤屈递一张纸子进去，三日之内必有回话。有等不及的日日来问，衙门也不嫌烦。这衙门给百姓做主。"
 SUM_Neo_SDH.128.t:"限三日复"
 SUM_Neo_SDH.128.d:"陈情处门口挂着块木牌，四个字：有冤便说。起先有人怕得罪人，递了状子又后悔，后来看见真替人做主，胆子就大了，递状子的队伍慢慢排到了巷口。百姓有冤最怕告状无门，旧日主母的厅如今改作陈情处，专管这事：写张纸子递进去，三日之内必有回话。这三日之期了不得，先前告状如石沉大海，等一年半载也没音信；如今白纸黑字定死三日，办事的不敢懈怠，日日有人守着，收了纸子登记在册，到期必须回话，管事的案头状纸摞得一日比一日高。有一回卖菜的汉子被人赖账，递了纸子进去，果然第三日就有人来断，把赖账的训一顿，追回了钱。自此百姓都知道，这衙门是真办事的。"
 SUM_Neo_SDH.128.a:"重立赤王的旧制"
 SUM_Neo_SDH.128.b:"重建城邦的议会"
 SUM_SDH_RC_Office_Limit:"约章限权"
 SUM_SDH_RC_Office_Limit_desc:"当官的不许经商，也不许占水。这规矩定得极细，连亲戚沾光都写在前头。要想破比登天还难，有想钻空子的，一细想竟无处下嘴。规矩细到这份上，难得。"
 SUM_Neo_SDH.129.t:"约章限权"
 SUM_Neo_SDH.129.d:"城中大堂之上，一个官模样的被当众摘了乌纱，罪名念得清清楚楚，围看的百姓才晓得那两条规矩不是纸糊的。话说这规矩来得有由头：绿洲里头最金贵的，一头是买卖，一头是水。当官的若把这两样都搂进怀里，小民还剩什么？日子久了，岂不成了骑在百姓脖子上的太爷？当权者看透这一层，索性立下两条铁律：凡在任办事的，一不许经商，二不许占水。条文写得死死的，在任一日便一日不许沾，便是亲戚打出旗号顶名儿来，也一样治罪。榜文抄了许多张，四处衙门口都张贴着，识字的高声念给不识字的听。偏有那不信邪的，暗地里入股一家商号，只当神不知鬼不觉，谁知账册一翻便露了馅，当场革职，还当众把缘由说了个明白。又有个当官的学乖了，自己不出面，叫自家子弟顶着名头经商，到头来照样被查出来，一并问罪。自此满城的人心知肚明，这规矩是动了真格的。"
 SUM_Neo_SDH.129.a:"召集能战之众"
 SUM_Neo_SDH.129.b:"召集能谋之士"
 SUM_SDH_RC_Road_Fix:"治其贸涂"
 SUM_SDH_RC_Road_Fix_desc:"几处绿洲之间的旧道坑坑洼洼，如今一并补平。沿途又掘了井，盖了驿站，商队走累了有水喝有处歇。这路修得好，买卖便活了。"
 SUM_Neo_SDH.130.t:"修涂置井"
 SUM_Neo_SDH.130.d:"路面平得能照出人影，老驼工伸手摸了又摸，咧嘴笑道，说走了几十年沙路，今日才算见了真章。这条连通几处绿洲的旧道，先前被风沙啃得坑坑洼洼，车轮陷进去便拔不出来，客商怨声载道。这回痛下决心要翻修，还顺带在道旁掘井、起驿站。道理简单得很：茫茫沙海，人马最怕的无非是渴、是累。井打成，一瓢清水能救命；驿站立起，半日路程便有个安身之处。人夫征来，按段分包，洼地填土，断路接榫，井筒一节节往深处掘，驿舍一排排沿路盖。工成那日，驼队鱼贯而过，铃铛响成一片，再没有往日的苦楚。驿站中储着水囊与草料，行旅解下包袱，就着阴凉处坐地歇脚，凉水下肚，一身疲乏都散了。有个白发老商驻足观望，指着路面连夸了几声，说这功德要传给子孙。"
 SUM_Neo_SDH.130.a:"以神权号令沙漠"
 SUM_Neo_SDH.130.b:"以律法约束诸城"
 SUM_SDH_RC_Tax_Public:"榜列赋则"
 SUM_SDH_RC_Tax_Public_desc:"税则刻在石碑上，立在城门口。谁家该交多少，自己照碑一算便知，不许差役多要一文。有想多收的，看看那碑也只得罢了。税则公开，省心。"
 SUM_Neo_SDH.131.t:"榜列赋则"
 SUM_Neo_SDH.131.d:"城门洞下立着一方丈二石碑，碑文是城中头等石匠凿的，笔道深得能盛住日影，据说想磨改一个字都难。如今百姓缴完钱粮，还不肯就走，三三两两踱到碑前再核一遍，心里才踏实；有几家竟把碑文整段誊回家里，贴在堂屋墙上。这都是因为收税改了新章程。往日愁的就是糊涂账，税吏嘴一张，说三便是三，说五便是五，小民手里没凭据，只有认宰的份儿。如今税则一条条刻在石上，谁多谁少，站到碑前自算分明，税吏想上下其手也无从措手，每日只好立在碑下照本念一遍，再不敢信口讹人。立碑那天城门口人山人海，识字的念，不识字的听，念完都点头，说这回有了准绳，再不怕挨坑。有个精明商户挨个数到自家名下，一拍大腿叫起来，说分毫不差。自此市面上为税钱争吵的，竟渐渐绝了迹。"
 SUM_Neo_SDH.131.a:"把遗迹挖开"
 SUM_Neo_SDH.131.b:"把遗迹封回去"
 SUM_SDH_RC_Trade_House:"立一行肆"
 SUM_SDH_RC_Trade_House_desc:"几家大商户合成一处商行，专做外邦的买卖。香料、木材、奇珍一样样贩来贩去。账目挂在堂上，谁都能看。这生意做得明白，长久。"
 SUM_Neo_SDH.132.t:"合赀开肆"
 SUM_Neo_SDH.132.d:"商行账房里起了风波：新上任的总管贪心一动，想把一批货暗中吞下，却被同伙当场拿住，当众数落了一顿。众人见这关口还有人敢出头拦阻，反倒越发放心，纷纷把本钱续续投进来。原来这商行是几家大商户合股设立的，专营外邦贸易。那等买卖路远本钱重，一家一户的小摊子实在嚼不动，非得凑到一处不可。可合股最怕账目不清、各起疑心，于是立下规矩：账目一律摊在明处，每一笔进出都记得清清楚楚，哪个股东想查，随时翻账便是。议章程那天，几家掌柜围坐在乌木大案旁，各认股份，推举了一个精明老成的当总管。头一票生意做成，账目当众一算，分毫不爽，众人尽皆信服。自此买卖红火，外邦货物源源不断。为防一人专断，又添一条：大宗出货须两位掌柜一同签押，少一个也发不出去。"
 SUM_Neo_SDH.132.a:"重立赤王的旧制"
 SUM_Neo_SDH.132.b:"重建城邦的议会"
 SUM_SDH_RC_Salt_Public:"盐榷归官"
 SUM_SDH_RC_Salt_Public_desc:"盐场归公议经营，盐价也由公议来定。谁也不许囤积居奇，囤了便要罚。有想抬价的被众人一哄，只得照价卖。盐是命根子，不能由着人捏。"
 SUM_Neo_SDH.133.t:"盐榷归官"
 SUM_Neo_SDH.133.d:"公议庭上，一个粮商耷拉着脑袋挨训，只因趁荒年想抬盐价，被罚去了半月的利钱，出去之后市面上的盐价便再不敢乱动。盐这东西，一日也离不得，偏偏最招奸商惦记，今日囤一批，明日抬一档，害得小民连口咸菜都吃不上。哈德拉玛维特索性把盐场收归公家经营，盐价也由公议庭划定，明码写在牌上，谁也不准囤积居奇。这规矩来得正是时候：先前那些囤盐的，把盐一坛坛埋进地窖，专等涨价才出手，市上的盐价给抬得翻了几番。如今盐场归了公，产多少、卖多少都有定数，价码明明白白挂在盐场门口的木牌上，童叟无欺。那牌子一月一换，若要改动，也得公议庭点头才行。偏有个商户不信，想私下囤一批盐，被巡查的一举拿获，连盐带货尽数没收，围观百姓都拍手称快，说这是替天行道。"
 SUM_Neo_SDH.133.a:"召集能战之众"
 SUM_Neo_SDH.133.b:"召集能谋之士"
 SUM_SDH_RC_Mint_Oasis:"洲中开冶"
 SUM_SDH_RC_Mint_Oasis_desc:"开炉铸钱，成色足，分量准，还把成色重量刻在钱边上。周边各邦见了都乐意收。拿这钱去买货，童叟无欺。钱好不好使，在成色。"
 SUM_Neo_SDH.134.t:"洲中开冶"
 SUM_Neo_SDH.134.d:"炉火日夜不熄，哗啦啦一倒，模子里便磕出一堆雪亮的钱，叮叮当当响个不停。新钱一面錾着王号，一面刻了绿洲的纹样，边缘的齿纹细密，老熟人拿手一捻就知真假。这事要从头说起：先前哈德拉玛维特用的钱成色乱七八糟，分量也忽轻忽重，拿到外邦，人家拿眼一瞄便皱眉，压根不肯收。做生意讲的是个信字，钱的分量靠不住，谁还肯跟你周转？于是当权者索性开炉重铸，把成色与分量都在钱边刻得明明白白，一分一毫差不得。新钱出炉，先送周边各邦验看，人家拿精制秤一称，果然分毫不差，当即点头应下通用。自此这款钱在四邻八乡通行无阻，商队揣上它走遍各方，采买贩卖再不费力。起初那些将信将疑的外邦商人，收得多了，都说这钱成色足、分量准，比旧钱强出一大截。"
 SUM_Neo_SDH.134.a:"以神权号令沙漠"
 SUM_Neo_SDH.134.b:"以律法约束诸城"
 SUM_SDH_RC_Common_Law:"共立科条"
 SUM_SDH_RC_Common_Law_desc:"各部的旧规矩合成一部共律。合得拢的写进去，合不拢的先空着，留待日后再议。那空着的几页不写字，只压一枚石子在角上，怕风翻乱了。这共律留白，稳当。"
 SUM_Neo_SDH.135.t:"诸部共条"
 SUM_Neo_SDH.135.d:"为了一个字眼，两位白胡子老学究争得脸红脖子粗，谁也不肯让半分，末了干脆在纸上空出一行，旁边批一句「日后再议」，这事才算搁下。话说各部都有各部的老规矩，你一套我一套，往往对不上号，一赶上跨部的事便互相推诿。有人提议把各部的旧规合到一处，编成一部共律，谈何容易。这条和那条对得上的便留下，对不上的，你争我吵，谁也不服谁。当权者想出个法子：合得拢的先写进共律，合不拢的暂且空着，留待日后慢慢商议。这法子一使，共律很快有了眉目，那些空白处也明明白白留着位子，叫人一眼就瞧出哪条还没定。日子一久，空处便被一条条补齐。果然，先头那桩争执不下的条款，后来各处都点了头，那空缺才填了上去。"
 SUM_Neo_SDH.135.a:"把遗迹挖开"
 SUM_Neo_SDH.135.b:"把遗迹封回去"
 SUM_SDH_RC_Judge_Ride:"谳使出巡"
 SUM_SDH_RC_Judge_Ride_desc:"法官按季走遍各处绿洲，就地审案，判词当众念出来，教众人听着明白。行装只有一匹驮兽、一顶旧帐，帐一撑起便是公堂。有那远地方告状不便的，这回也得了方便。这巡审之法妥当。"
 SUM_Neo_SDH.136.t:"谳使出巡"
 SUM_Neo_SDH.136.d:"渠水哗哗地淌，法官蹲在渠埂上，拿尺子量了宽窄，又听了两边的话，当众把水性断了个明白，争水的两户人家都心悦诚服。哈德拉玛维特的律例立下之后，还得有人断案。这里定下一条特别的规矩：法官不必端坐衙门里等，而是随着节气，一处一处走遍绿洲，就地开审。到了地方，便在空场上摆开庭来，原告被告当面对质，证人上前陈词，法官听完两造的话当堂判决，判词还要当着众人高声念出。这般办，好处一目了然：小民打官司再不必翻山越岭跑进城，在家门口就能断个清楚；判词当众念出，法官便是想徇私，也架着众人的耳朵听着呢。曾有个法官断得含混，被在场的人当场诘问，只得重新斟酌，从此断案越发谨慎。法官出门还带着一杆秤、一卷尺，凭实物量地称粮，不单凭口供定案。"
 SUM_Neo_SDH.136.a:"重立赤王的旧制"
 SUM_Neo_SDH.136.b:"重建城邦的议会"
 SUM_SDH_RC_School_Oasis:"置一学舍"
 SUM_SDH_RC_School_Oasis_desc:"学馆里教的是算术、地理、律例，也教识字。来学的人不分部族，沙漠的、雨林的一齐坐着听。有年纪大了的也来凑个热闹。这学馆开阔。"
 SUM_Neo_SDH.137.t:"学舍无部"
 SUM_Neo_SDH.137.d:"天还黑着，几个穷苦孩子就背着书袋蹲在学馆门槛上，眼巴巴等着开门，那模样叫人心酸又欢喜。原来哈德拉玛维特要治理地方，少不了读书识字的人，便在各处开设学馆，算术、地理、律例，连识字也一并教。最特别的是，来学者不分部族。先前各部隔着心，你部的娃不踏我部的门，如今一概放开，只要肯学，哪一部都收。各族孩子同坐一条板凳，一同听课，一同研墨写字，日子久了，那点子隔阂也就淡了。先生讲算术，拿沙漠里的水渠打比方；讲地理，便指着墙上的图，一处处说绿洲。学馆还立着一条：学费一概免了，笔墨纸砚也由公家置办。这可叫穷人家欢天喜地。起初有位部族首领执意不肯送孩子来，后来见学馆里果然不分彼此，也就松了口，渐渐把自家的娃送来，与众人一同听课。"
 SUM_Neo_SDH.137.a:"召集能战之众"
 SUM_Neo_SDH.137.b:"召集能谋之士"
 SUM_SDH_RC_Contracts:"券契入藏"
 SUM_SDH_RC_Contracts_desc:"凡立下大契约的都要留一份底子在存档处，收进石龛，龛前摆一盏油灯。日后两家争执各说各的理，便把底子取出来一对，谁是谁非立时分明。这存档处省事，沙尘再大也进不了龛门。"
 SUM_Neo_SDH.138.t:"券契入藏"
 SUM_Neo_SDH.138.d:"两把铜锁并排挂在门上，那黑影探了探钥匙孔，进不去半分，只好缩回手，趁夜色溜走了。这存档处的门槛，想偷改契约的人是从来迈不过的。民间立契，空口无凭，最容易扯皮，为此哈德拉玛维特专门设了这处存档所，凡是像样的契约，都得留一份底稿在这里。往后两家若翻脸，把底稿取出一对，谁曲谁直立马见分晓，省下多少口舌。先前做买卖的闹纠纷，你一言我一语都说对方赖账，闹到后来连交情都断了；如今白纸黑字摊在眼前，想赖也赖不成。存档所里的契约一卷卷分门别类，登记造册，谁来调阅都得当面画押，用完立刻归还，不许夹带出门。有个老吏管着这摊子，把那些卷宗看得比自己命还重。门上的钥匙分成两半，一半老吏揣着，一半存在公议庭，非得两半凑齐才开得了锁。"
 SUM_Neo_SDH.138.a:"以神权号令沙漠"
 SUM_Neo_SDH.138.b:"以律法约束诸城"
 SUM_SDH_RC_Press:"录副开肆"
 SUM_SDH_RC_Press_desc:"抄书坊把共律与宪章抄了许多份，发到各处绿洲。一笔一画抄得工整，谁也不许偷懒。有识字的得了书便念给不识字的听。这书一多，规矩便传开了。"
 SUM_Neo_SDH.139.t:"写副流洲"
 SUM_Neo_SDH.139.d:"一个年轻抄手连着伏案数月，手腕酸得抬不起来，却仍一笔一画不肯马虎，说是这书要传给后人看的，错一字便是误人。共律与宪章立成之后，光锁在议事厅里可不成，得让各处的绿洲百姓都知晓，于是特开了一处抄书坊。坊里聘了不少抄手，日日伏案执笔，将共律、宪章誊了好多份。此地印书还不普及，全凭手抄，抄手一字一句地誊，抄完一份便对着原稿校一遍，生怕写了错字误导众人。纸用的是本地薄羊皮，墨是松烟掺胶调的，写在上面经得住风沙；抄好的册子装订成册，还拿油布裹上三层，怕的是路上潮气坏了字迹。这一批批册子发往各处绿洲，张贴的张贴，收藏的收藏。到了当地，当地人又照着样子再抄，不多时，连偏僻的小绿洲都有了抄本。"
 SUM_Neo_SDH.139.a:"把遗迹挖开"
 SUM_Neo_SDH.139.b:"把遗迹封回去"
 SUM_SDH_RC_Home_Guard:"募乡里丁"
 SUM_SDH_RC_Home_Guard_desc:"各处绿洲各出一班丁壮组成乡兵。平时扛锄头种地，战时提刀枪集合，召之即来。有农忙时误了地的也不用怕，众人都替他照看。这兵农合一，实惠。"
 SUM_Neo_SDH.140.t:"农具兼兵"
 SUM_Neo_SDH.140.d:"号角呜呜吹响，乡兵们从田垄里直起腰，扛着各人家伙往集合场赶。有握长枪的，有背弓的，衣裳鞋帽杂七杂八，可一个个腰杆挺直，精神头足得很。绿洲要自保，不能没兵，可养一支常备军花费太大，众人都负担不起，于是想出个两全法子：各处按丁出人，编成乡兵。这班人平时就是庄稼汉，荷着锄头下地；一有战事，号令一响，撂下农具聚到一处，操起兵器便成了兵。妙处就在两不耽误：农忙时人人泡在田里，农闲时才集中操演武艺。他们的兵器多是自家打造，长枪杆子取沙枣木削成，箭头淬过毒，弓弦用骆驼筋拧就。一到农闲，空地上便列开队伍，号手一吹，进退都有章法。有那手脚笨拙的，回家还对着月亮比划几下，不肯落在旁人后头。"
 SUM_Neo_SDH.140.a:"重立赤王的旧制"
 SUM_Neo_SDH.140.b:"重建城邦的议会"
 SUM_SDH_RC_Watch_Oasis:"筑台瞭望"
 SUM_SDH_RC_Watch_Oasis_desc:"绿洲外缘立起一座座望楼。白天举旗，夜里举火，一处传一处，消息比快马还快。有一回沙暴来袭，望楼一举旗，各处都早早备下了。这望楼救命。"
 SUM_Neo_SDH.141.t:"张帜举烽"
 SUM_Neo_SDH.141.d:"举火把的柴草早码在楼角，拿油布盖得严严实实，防潮防湿，擦根火折子便能点着。这些望楼一座座立在绿洲外围的高地上，四面空荡荡毫无遮拦，守楼的人不论酷暑寒冬都不敢挪窝：数九天冻得手足僵硬，三伏天晒得背上脱皮，眼睛却练得出奇的毒，远处飘起一缕尘烟，立刻能分出那是人马还是野兽。为什么要费这等工夫？大漠太宽，一处遭了警，别处怎会晓得？快马跑去报信，一来一回早就误了事。于是哈德拉玛维特沿绿洲外缘高筑望楼，白天挥旗，夜里点火，头一座一举，相邻望见跟着举，一传到十、十传到百，警讯跑得比骏马还快。曾有一队散骑摸来，头一座望楼的守卫瞥见远处尘头，立刻挥旗，接连几座相继响应，眨眼间各处乡兵集合完毕，那队人马见势不妙，拨转马头就逃。"
 SUM_Neo_SDH.141.a:"召集能战之众"
 SUM_Neo_SDH.141.b:"召集能谋之士"
 SUM_SDH_RC_Wall_Low:"立垣拒沙"
 SUM_SDH_RC_Wall_Low_desc:"沿绿洲垒起一道低墙，不很高却结实。挡得住流沙，也挡得住散骑。有那小股匪徒来犯，到了墙下便爬不上来。这墙虽矮，管用。"
 SUM_Neo_SDH.142.t:"短垣御沙"
 SUM_Neo_SDH.142.d:"墙头上的乡兵抱着滚石礌木，就等着来犯的靠近。这道矮墙绕着绿洲围了一圈，是众人一锹一筐垒起来的：烧砖和了沙砾，日晒风敲也不肯塌。当初为何要垒它？绿洲西边让流沙一口口吞，东边又有散骑时不时来抢掠，两头夹击，百姓不得安生。墙垒起来，流沙被挡在外头，积多了便一车车拉走；散骑的马撞上墙体，只能勒马干着急，翻不过来。墙里侧掘了一道壕，来犯时乡兵登墙据守，占着高处，滚石滚木一齐往下砸，来犯的抱头鼠窜。筑墙那些日子，绿洲的人全都上了工，运土的运土，递砖的递砖，抹灰的抹灰，号子喊得震天响，不出数月，一圈矮墙便弯弯绕绕把绿洲圈在里头。可墙能挡住散骑，却挡不住人心懒散，众人便排班轮流守望：日出握锄头种田，日落提长矛守墙，从不懈怠。那伙散骑吃过亏，日后远远望见墙影便催马改道。"
 SUM_Neo_SDH.142.a:"以神权号令沙漠"
 SUM_Neo_SDH.142.b:"以律法约束诸城"
 SUM_SDH_RC_Road_Patrol:"护彼行商"
 SUM_SDH_RC_Road_Patrol_desc:"商队见了这护航的人，胆气便壮，像吃了颗定心丸。护商队专在盐路上巡行，遇上劫匪便追，追上了就地处置，决不轻纵。这护商队，实在靠得住。"
 SUM_Neo_SDH.143.t:"轻骑护榷"
 SUM_Neo_SDH.143.d:"盐车队在沙路上远远望见那面旗，领头的便扬声吆喝一句道谢，一车人这才把提着的心放下。盐路可是哈德拉玛维特的命根子，盐要是运不出去，百姓连盐都吃不上，偏生这条道上强人出没，动不动就拦车劫掠。为保这条命脉，特地挑了精壮汉子组成护商队，骑快马、藏利刃，或前或后地护着盐车。护商队奉着一条硬令：撞上劫匪就追，追上便就地处治，不必解回城里。这令一出，强人的好日子就到头了。往日他们抢完便跑，以为没人追得及，如今护商队咬住不放，拿住当场发落，没几天，盐路上的匪患就平了。有回一伙强人拦抢盐车，护商队恰好赶到，一路追出十几里，一个没跑了，尽数捆回。还有一夜追匪徒追到天明，在沙丘背后堵个正着，绳子一串儿捆了押回。"
 SUM_Neo_SDH.143.a:"把遗迹挖开"
 SUM_Neo_SDH.143.b:"把遗迹封回去"
 SUM_SDH_RC_Peace_Order:"置诘盗署"
 SUM_SDH_RC_Peace_Order_desc:"治安署用的都是本处人，知根知底。管的是偷盗抢劫这类事，至于谁议论了什么一概不管。有爱说闲话的反倒自在。这治安署识趣。"
 SUM_Neo_SDH.144.t:"乡人自谳"
 SUM_Neo_SDH.144.d:"两个后生为一句闲话争得面红脖子粗，一路吵进治安署，差役问明原委，只劝了两句便摆手放人，连个正经罪名都没给他们安。这治安署是哈德拉玛维特为保地方安宁设的，差役统统从本处人中挑。为何专挑本地人？路熟嘛，谁家安分谁家刁钻，心里跟明镜似的，办差自然少出错。这衙门管事也极有分寸：偷盗抢劫这类事它管，至于谁在背后议论了什么、说了哪些话，它一概不闻不问。为何连闲话都不管？当权者心里有数，防民之口甚于防川，手脚管得住，人心却管不住。曾有几个后生在茶摊上高谈时政，嗓门震天，差役打那儿路过，只当没听见，眼睛只盯着有没有人摸人钱袋。百姓瞧久了才明白，这衙门是真心替地方办事的。"
 SUM_Neo_SDH.144.a:"重立赤王的旧制"
 SUM_Neo_SDH.144.b:"重建城邦的议会"
 SUM_SDH_RC_Karez_Oasis:"穿坎引泉"
 SUM_SDH_RC_Karez_Oasis_desc:"坡地上开了一道坎儿井，把地下水引出来浇田。有了水，田里便能多种一季，收成凭空多出许多。有人算了算，这一年多打的粮够吃到来年。这坎儿井巧妙。"
 SUM_Neo_SDH.145.t:"伏渠导泉"
 SUM_Neo_SDH.145.d:"清泉顺着地底的暗渠汩汩冒出来，流进干裂的田，土块滋滋地吸，不出几天，田埂上就冒出一层绿。这是坡地里的坎儿井。原先这片坡地缺水，一年只收一季，收成薄得叫人叹气。后来有人琢磨出这个法子：顺着地势往地下掏暗渠，把山里的泉水一路引到田里。妙就妙在水在暗处走，太阳晒不着，蒸发便少，真是沙漠里土生土长的巧思。干这活计可不容易，先要探准水源，再一口口打竖井、掏暗渠，工程量不小。绿洲的人一齐上手，硬是挖了整整一冬。工匠在井底下点着油灯，一锹一锹地往前掏，挖出的土顺着竖井一桶桶吊上来。渠通那天，老农蹲在田边，瞅着水漫过田面，笑得合不拢嘴。打这以后，坡地一年能种两季，收成翻了一番。"
 SUM_Neo_SDH.145.a:"召集能战之众"
 SUM_Neo_SDH.145.b:"召集能谋之士"
 SUM_SDH_RC_Terrace:"筑此层町"
 SUM_SDH_RC_Terrace_desc:"坡地开成一层层梯田，种的是耐旱的粮，不用多少水也能有收成。远远望去一级一级，像梯子搭到山上。山洪来时也不至于冲了田。这梯田会过日子。"
 SUM_Neo_SDH.146.t:"缘坡作町"
 SUM_Neo_SDH.146.d:"到了秋天，层层梯田金黄一片，沉甸甸的谷穗压弯了腰，先前那片荒坡，如今竟成了米粮川。坡地缺水还有一桩麻烦，便是留不住水土，一下雨，水顺着坡哗哗淌走，连泥土也一同冲跑。于是人们把坡地开成梯田，一层层顺着山势修上去，每层平平的如同台阶，水便一层层存住，不再白白流走。修这梯田极费工夫，先在坡上划出一道道横线，顺着线垒起石埂，再把高处的土刨下来填到低处，一层层找平，一亩亩拾掇停当。种上耐旱的粮，谷子、高粱之类，不挑地也省水。引水渠也从山顶一级级接下来，水顺着台阶缓缓地流，浇透一层，再溢到下一层。有个老农拄着锄头说，地原是好地，就看人肯不肯下功夫。"
 SUM_Neo_SDH.146.a:"以神权号令沙漠"
 SUM_Neo_SDH.146.b:"以律法约束诸城"
 SUM_SDH_RC_Date_Grove:"枣林蔚然"
 SUM_SDH_RC_Date_Grove_desc:"沿渠两岸遍植枣椰，三年光景便长成林，绿油油一片。结下的果子按户分，家家有份。孩子爬上树，挑最甜的一个往下扔。这枣椰树浑身是宝。"
 SUM_Neo_SDH.147.t:"夹渠树枣"
 SUM_Neo_SDH.147.d:"娃娃们蹲在树荫底下，够不着高枝，专捡那熟透落地的枣子，一把把往嘴里塞，甜得直咂舌头。这片枣椰林是沿水渠栽起来的。渠一修好，渠边那溜空地闲着白费，有人就出了个主意：种枣椰。这树天生耐旱，根往深处扎，顺着渠长得旺，还能替渠岸固住土。可栽活不难，成林却慢，头三年小苗弱得很，浇水、培土、挡风沙，一样都松不得，绿洲的人轮着班照看，跟疼自家孩子似的。熬过三年，枣椰渐渐连成片，绿荫顺着渠一路铺展开，荒沙里硬是添出一条绿廊。到了结果的时节，一串串枣子压弯枝条，甜得腻人，摘下来按户分，家家都有份。这林子还不光是结果：早年风一起，黄沙就往绿洲里扑，如今横着这道绿墙，沙势便缓了大半。"
 SUM_Neo_SDH.147.a:"把遗迹挖开"
 SUM_Neo_SDH.147.b:"把遗迹封回去"
 SUM_SDH_RC_Rotation:"就草而牧"
 SUM_SDH_RC_Rotation_desc:"草场分作几片轮着放牧，哪片放到几时写在木牌上，插在草场边，谁也不许乱来。草有歇的时候便养得肥。这轮牧懂养地。"
 SUM_Neo_SDH.148.t:"分场列牧"
 SUM_Neo_SDH.148.d:"管事的一句话没多说，只把那块木牌往高处一举，上头的字清清楚楚，两个争得眼红的牧人立时闭了嘴，各自赶羊去了。木牌上写的是轮牧的规矩。草场要是任羊群随便啃，今天东片明天西片，草根都给啃绝了，用不了几年便成了秃地。于是哈德拉玛维特把草场划成一片片，排班轮着放：这片本月放，那片下月放，让草喘口气。为免混乱，每片草场都竖了木牌，写明哪一天归哪伙人放，牧人抬眼一瞧，便知该往何处赶羊，再不用争抢。牌上还限着这片草能放几只羊，多一只也不许。这么养下来，草场一年比一年丰茂，牛羊吃得饱，膘肥体壮，挤出来的奶也格外足。"
 SUM_Neo_SDH.148.a:"重立赤王的旧制"
 SUM_Neo_SDH.148.b:"重建城邦的议会"
 SUM_SDH_RC_Public_Granary:"公廪充牣"
 SUM_SDH_RC_Public_Granary_desc:"丰年时把粮收进公仓，荒年时开仓平价粜出。仓是土坯砌的，底下垫一层干沙防潮，门口挂一把共管的锁。存的不只是粮，更是众人的底气。有一年大旱，全靠这仓粮稳住了人心。"
 SUM_Neo_SDH.149.t:"平价出粟"
 SUM_Neo_SDH.149.d:"领粮的队伍从仓门口一直排到巷子尽头，人人脸上都透着喜气。那一年大旱，地里颗粒无收，别处粮价涨上天，饿殍遍野，这里却开仓放粮，百姓安安稳稳熬了过去。这公仓是哈德拉玛维特早年定下的规矩：丰年粮食多得吃不完，烂在田里可惜；荒年粮食短缺，又没处借。于是把丰年余粮收进公仓存着，一遇荒年便开仓平粜，按平价卖给百姓，好把粮价稳住。仓里存的不只是粮，是百姓的活命根子，是人心。仓门钥匙由几处公推的人分头掌着，谁也休想私自开启。看仓的老头日日把粮食翻出来晒，生怕潮了霉变。仓里还立着册子，进出都有账，一笔一笔记着。管仓的人轮换值守，交接时当着众人当面盘查，一粒粮也短不得。"
 SUM_Neo_SDH.149.a:"召集能战之众"
 SUM_Neo_SDH.149.b:"召集能谋之士"
 SUM_SDH_RC_Neutral_Pact:"守中之盟"
 SUM_SDH_RC_Neutral_Pact_desc:"与四邻立下条约：绿洲不结盟，不驻外兵，也不供粮给打仗的人。三条约得明明白白，签在羊皮上各执一份。有来游说的，看了条约，喝过半盏茶也只得回去。这中立难得。"
 SUM_Neo_SDH.150.t:"守中之盟"
 SUM_Neo_SDH.150.d:"四面的战火烧了又熄，这里的人只顾低头伺候自家的田，图个清净。这份清净，是当年一纸盟约换来的。哈德拉玛维特夹在沙漠正中，四邻个个虎视眈眈，一不留神便被拖进战火，于是约上四邻立下文契，明明白白三条：头一条，不结盟，两边的是非一概不掺和；第二条，不驻外兵，别国的兵马不许踏进绿洲地界；第三条，不供粮于战，谁家打仗都不卖粮给谁。这三条便是立身的根本。不入盟，便谁也不得罪；不驻兵，自家门户便清净；不供粮，别人的厮杀便沾不上身。立约那天，四邻使节齐聚一堂，为这几条争了半日，最后挑不出毛病，才当众一条条念过，各方画押，约文抄了几份，各家收执。自打这约立了，哈德拉玛维特果然安稳多年，四邻你争我斗，却都绕着它走。后来邻邦之间真打了几仗，谁也没来借道，更没人上门征粮，远远望见别处烽烟，这里的人依旧低头侍弄庄稼。"
 SUM_Neo_SDH.150.a:"以神权号令沙漠"
 SUM_Neo_SDH.150.b:"以律法约束诸城"
 SUM_SDH_RC_Trade_Treaty:"互市之盟"
 SUM_SDH_RC_Trade_Treaty_desc:"与外邦通商先立下条约，约里写清税则，也写明如何保护侨民，连船货在哪个码头卸都记了。两下里签字画押各执一份。这约立得周全，少了扯皮，有违约的照约罚银。"
 SUM_Neo_SDH.151.t:"互市之盟"
 SUM_Neo_SDH.151.d:"关卡的吏员想再收一道钱，那商人也不争辩，从怀里抽出商约往案上一摊，指头点着上头的条文，吏员低头看了几行，脸涨得通红，再不提收钱二字，挥手放人。原来哈德拉玛维特与外邦通商，头一件事便是立商约，把丑话说在前头。约里写得明白：关税几何、货怎么过关，自家人在外头受了欺负该找谁，外邦客商上门又该怎么款待，事无巨细都写到了。为何非要护侨这一条？在外做生意的人，最怕的就是出了乱子没人撑腰、受了委屈没处申诉，约里白纸黑字写着，等于给在外的人吃了一颗定心丸。曾有个在外邦经商的哈德拉玛维特商人被人欺负，当地官府照着商约秉公断案，商人安然无恙，消息传回，众人都说这商约立得值。约里还写明，货物过境不许滞留，关税只收一道。"
 SUM_Neo_SDH.151.a:"把遗迹挖开"
 SUM_Neo_SDH.151.b:"把遗迹封回去"
 SUM_SDH_RC_Border_Talk:"对案定疆"
 SUM_SDH_RC_Border_Talk_desc:"边界一事与邻邦一里一里地谈。谈得拢的便定下来，谈不拢的先搁着，谁也不许动粗。有性急的也被按住。这慢慢谈，省了刀兵。"
 SUM_Neo_SDH.152.t:"对案定疆"
 SUM_Neo_SDH.152.d:"两张旧舆图在案上摊开，两家各指一处，一个说界碑在这，一个说界河在那，争到急处几乎拍案，可一想到动刀兵的代价，又都按住性子，慢慢再谈。这就是哈德拉玛维特跟邻邦谈边界的光景。边界的事最伤和气，两边都说地归自己，争着争着往往就见了血。哈德拉玛维特却有一招：不急不躁，一里一里地磨。这段谈得拢就定下，那段谈不拢就先搁着，不争那一时之气。这法子看着软，其实高明，急争争来的是战火，慢谈谈来的是安稳。谈定的地方立碑为界，两家都认；谈不拢的暂时空着，谁也不许越界生事，留待日后。有几处争议的地界，硬是搁了好几年，后来时机到了，再一谈便成。"
 SUM_Neo_SDH.152.a:"重立赤王的旧制"
 SUM_Neo_SDH.152.b:"重建城邦的议会"
 SUM_SDH_RC_Keep_Old:"悉依旧例"
 SUM_SDH_RC_Keep_Old_desc:"主母传下的旧例能留的都留着，只是上面再加一层公议。改得慢些倒不容易翻车。有急着全盘改的被长老拦住了。这慢改稳当。"
 SUM_Neo_SDH.153.t:"悉依旧例"
 SUM_Neo_SDH.153.d:"话说议事席上有人脑子一热，主张把旧规矩一股脑全废掉，几个老成的连连摆手，道：「改得慢些才不易翻车，一朝急了，翻了车连退路都没啦。」众人想想，都觉这话在理。改革这事，最怕的就是急。哈德拉玛维特的主母留下许多旧例，有的还合用，有的已过时，当权者却没一概废除，能留的都留下，只在旧例之外添一层公议的过场。老规矩用习惯了，百姓心里有数，若是全盘推翻，人心一慌，事情反倒办砸。如今缓着来，旧的照走，只多一道公议手续，让众人都能插上话。这法子看似慢，其实稳。这么一层层改下来，旧例去了大半，新规立了七七八八，百姓竟浑然不觉，只当日子照旧过。高明就高明在，不动声色间把天大的事办妥了。"
 SUM_Neo_SDH.153.a:"召集能战之众"
 SUM_Neo_SDH.153.b:"召集能谋之士"
 SUM_SDH_RC_Quiet_Grow:"聊以守成"
 SUM_SDH_RC_Quiet_Grow_desc:"不折腾，也不扩张，只把眼下的日子过稳。沙漠里风大浪大，最难得的就是一个稳字。有想冒险的也被劝住了。这守成也是本事，不贪大，不求快。"
 SUM_Neo_SDH.154.t:"静守为上"
 SUM_Neo_SDH.154.d:"邻邦的使节一趟又一趟地来，劝他们趁势开拓、占地称王，哈德拉玛维特的人只摇头，道：「地盘大不算本事，日子稳才是真章。」使节碰了钉子，临走还撂下一句机不可失，见对方只顾低头扫地，再不搭理，只好回去交差。这话是拿血泪换来的教训：早年间一味黩武，把家底折腾得干干净净；后来又逞强斗狠，几乎引火烧身。吃了这些苦头才回头，如今地照种、集照赶，不图轰轰烈烈，只愿百姓有口安稳饭吃。沙暴没个准，战乱又频繁，安稳二字千金难换。那年四邻打得翻天覆地，这里却岿然不动，城门照开，市集照散，连巷口的孩子都照旧追逐嬉闹，各家照旧下地赶集，旁的地方逃荒的人拖家带口涌了进来。"
 SUM_Neo_SDH.154.a:"以神权号令沙漠"
 SUM_Neo_SDH.154.b:"以律法约束诸城"
 SUM_SDH_RC_Oasis_Democracy:"洲部自守"
 SUM_SDH_RC_Oasis_Democracy_desc:"哈德拉玛维特的几处绿洲各立宪章，代表按月议事，法官按季巡判，盐与水的账都贴在碑上。主母的厅改成陈情处，谁有话说推门便进。这般章程，把权力摊在了明处。"
 SUM_Neo_SDH.155.t:"洲部自守"
 SUM_Neo_SDH.155.d:"一个外地来的旅人推开陈情处的门，愣在本地：里头有人递状子，有人端着茶碗闲坐，全没有往日衙门那股森严气，不由得啧啧称奇。这陈情处，是旧日主母的厅堂改的，如今谁有话，推门便进，不必通报，也不必等候。这一处处光景，是哈德拉玛维特几处绿洲如今的新气象：各处都立了宪章，白纸黑字明明白白；法官按季巡行各处，就地审案；盐与水的账目一笔笔贴在城门石碑上，谁都能看；代表按月聚到一处议事，议完各回各家。这些改动合到一处，便是第三条路的模样。想当年主母独断，一人说了算；如今凡事都要公议，陈情处里什么话都能说。这般光景是一步步熬出来的。老人们偶尔提起旧日，也不过摇摇头，接着低头喝自己的茶。"
 SUM_Neo_SDH.155.a:"把遗迹挖开"
 SUM_Neo_SDH.155.b:"把遗迹封回去"
 SUM_SDH_RC_Old_Order:"沙碛守局"
 SUM_SDH_RC_Old_Order_desc:"哈德拉玛维特与雨林重划了账：贡赋减了，戍兵撤了，地界却不动。主母的规矩照旧，只多一层公议的过场。日子比起前几年着实安稳了些。这等结果难得。"
 SUM_Neo_SDH.156.t:"沙碛守局"
 SUM_Neo_SDH.156.d:"雨林派来的使节到边界踏看，见那些戍兵果然撤得干干净净，回去据实一报，两边从此相安无事。这是哈德拉玛维特与雨林重划天平之后的光景：贡赋减了，戍兵撤了，地界却分毫未动。那一仗打下来，两边都累得够呛，与其接着厮杀，不如此各退一步。贡赋一减，沙漠肩上的担子轻了；戍兵一撤，边境上绷紧的弦松了；地界不动，双方面子都圆了。主母传下的老规矩照旧行着，只是另添一道公议的过场，凡事大伙儿商量着办，日子比前些年安稳不少。重划之后，界碑重新立过，碑石上刻着两家的印记，两边百姓来往自在，贩盐的赶着骆驼、放羊的挥着鞭子，各走各道，再不像先前那样剑拔弩张。"
 SUM_Neo_SDH.156.a:"重立赤王的旧制"
 SUM_Neo_SDH.156.b:"重建城邦的议会"

 #### 开战须弥 · 雨林的门 ####
 SUM_SDH_WAR_The_Storm_Rises:"东风初动"
 SUM_SDH_WAR_The_Storm_Rises_desc:"哈德拉玛维特的粮、盐与商路，多半还攥在雨林手里。撕了敕令不过是名义上的事，要真把雨林从账本上划掉还得动兵。纸上的账，到底要靠刀来清。"
 SUM_Neo_SDH.157.t:"东风初动"
 SUM_Neo_SDH.157.d:"议事厅里，一个明白人猛地一拍桌子，道：「这独立是假的！不打通商路、夺回盐粮，咱们终究是人家掌心里的一枚棋子。」话音落下，满厅默然，半晌没人吭声，大伙儿心里都凉了半截。账面上看，哈德拉玛维特似乎已经独立，可内情哪有这么简单。粮、盐、商路这些命脉，多半还攥在雨林手心里。所谓断了敕令，不过是纸面上划一道线，做个名义罢了。真要把雨林从沙漠的账本上勾掉，非得动刀兵不可。这些年，沙漠的盐要借雨林的地界外运，粮食靠雨林的商路输入，连铸钱的铜铁都得从雨林来。名义上独立了，实际上处处受制，换了一块招牌罢了，骨头还连在人家身上。有人私下叹气，这场恶战是躲不过了。"
 SUM_Neo_SDH.157.a:"以动员令起兵"
 SUM_Neo_SDH.157.b:"以盟约召集部族"
 SUM_SDH_WAR_Call_All:"纠合诸部"
 SUM_SDH_WAR_Call_All_desc:"召集令传遍各部，来的人比估的还多。带的兵器五花八门，有刀有枪，有弓有梭，可都听号令，叫东不往西。人心齐了，便是兵器杂些也不打紧。"
 SUM_Neo_SDH.158.t:"纠合诸部"
 SUM_Neo_SDH.158.d:"号手换到第三个人，腮帮子吹得发酸，号声一歇，队伍便钉在原地，只等下一声令下，自始至终听不见一句嘈杂。号令一下，各部的人马便从四面八方涌来。哈德拉玛维特决意动兵，召集令由快马骑手星夜送出，一处绿洲、一个部落都不落。原先估着一个数，哪知到的人比估的还多出一大截。各路人马扛着自家的家伙，长矛、弯刀、弓箭、狼牙棒，什么样都有，衣裳打扮五花八门，可有一点齐整：号令一响，便依令列队，进退有序，没人抢先，也没人掉队。领兵的看了喜不自胜，道：「人心齐，泰山移，有此军何愁不胜。」一个老兵拍着胸脯说，这回定要叫雨林尝尝沙漠的厉害。"
 SUM_Neo_SDH.158.a:"直取雨林关隘"
 SUM_Neo_SDH.158.b:"先断其商路"
 SUM_SDH_WAR_War_Fund:"敛取军需"
 SUM_SDH_WAR_War_Fund_desc:"军费盐路出一半，商户出一半，两下凑齐。出钱的人日日打听消息，只等着打赢。打赢了这钱才算没白花，打输了可就都打了水漂。"
 SUM_Neo_SDH.159.t:"两下输饷"
 SUM_Neo_SDH.159.d:"木箱封条贴得严严实实，上头写着银钱数目，管粮饷的官儿当面点数，两笔银子一堆儿封了进去。有个商户按手印时，手指头直打颤。这军费的来路，是当权者想出的主意：盐路担一半，商户担一半。盐路归公，担一半天经地义；商户获利最厚，担一半也合情理。两边既然都出了钱，便都巴望打赢这一仗，只要胜了，盐路畅通无阻，买卖红红火火，掏出去的银子连本带利都赚得回来。算盘噼啪响了一阵，钱粮一笔笔凑足，白花花的银钱堆成了小山。有个商户掏钱时心疼得直咧嘴，终究还是咬牙认了，道：「这钱花得不冤，只要打赢，日后有的是赚头。」旁人见他这般干脆，都说出得痛快，为的是往后不再受人欺负。"
 SUM_Neo_SDH.159.a:"把话说给雨林人听"
 SUM_Neo_SDH.159.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Ration:"计口授食"
 SUM_SDH_WAR_Ration_desc:"粮与盐按人口配给，先紧着军中，再顾百姓。配给的规矩贴在门外，谁多谁少一目了然，谁也不许多拿。这般分配，少了争执。"
 SUM_Neo_SDH.160.t:"先戎后民"
 SUM_Neo_SDH.160.d:"那妇人捧着自家的那一份，看看碗里，又抬头看看墙上的告示，末了叹口气，没言语。告示写得斗大，不识字的也能听人念明白：粮与盐按人口配给，先尽军中，再轮百姓。这是哈德拉玛维特在大军未动之前、粮草先行的规矩。为何把规矩写在告示上、贴在门外？战时物资紧张，分得不均，军民都要生怨；如今把规矩摊在明处，谁该得多少一眼便知，想闹也闹不起来。每日领粮的队伍排得老长，兵丁百姓各按各的份额依次领，管发的照册子唱名，一份份发出去，分毫不差。有那家口多的，领一份不够，站在队里直叹气，管发的照章办，多一粒也不给。众人心里叫苦，可规矩摆在那儿，也怨不得谁。"
 SUM_Neo_SDH.160.a:"倾全境之力"
 SUM_Neo_SDH.160.b:"留一支后手"
 SUM_SDH_WAR_War_Council:"分途三策"
 SUM_SDH_WAR_War_Council_desc:"军议定了三路进兵：一路沿盐路走，一路穿沙地过，还有一路绕着绿洲行。三路人马分头而去，约好日期会合。这分兵之法周全。"
 SUM_Neo_SDH.161.t:"幄中画三"
 SUM_Neo_SDH.161.d:"主帅令箭一举，三路人马各自领令而去，将领们个个磨拳擦掌，有个年轻偏将头回领兵，激动得一宿没合眼。这是军议三日三夜定下的方略。行军打仗，最讲究个方略，哈德拉玛维特的将军们聚在帐中，摊开地图反复推敲，终于定下三路进兵：一路沿盐路走，稳扎稳打，保住粮草补给；一路穿沙地直插，打他个出其不意；一路绕着绿洲走，看着绕远，其实是要断人后路。三路各有分工，又彼此呼应，布置得十分周密。三路人马分头张罗：沿盐路的修桥铺路、备足粮草；穿沙地的轻装疾行；绕绿洲的悄悄探路、摸清敌哨。各路人马都憋着一股劲，只等主帅令下。"
 SUM_Neo_SDH.161.a:"以动员令起兵"
 SUM_Neo_SDH.161.b:"以盟约召集部族"
 SUM_SDH_WAR_Proclaim:"草檄问罪"
 SUM_SDH_WAR_Proclaim_desc:"檄文写的尽是账：欠了多少水，占了哪块地，多收了几成税，一条一条列得清楚。念给众人听，听的人无不咬牙。有那听惯了官样文章的，这回倒真动了气。这檄文端的厉害。"
 SUM_Neo_SDH.162.t:"草檄问罪"
 SUM_Neo_SDH.162.d:"雨林那边收到檄文，只当是废纸一张，冷笑一声便扔在一边，说陈年旧账早算不清了，此刻翻出来，无非是想寻个开战的借口。可沙漠这边，人人捧着檄文念，字字句句都挠到了痒处，士气顿时大振。自古出兵都要有个名头，哈德拉玛维特起兵之前，先写了一篇檄文昭告天下。这檄文别的不写，专算一本账：雨林欠了沙漠多少水，占去多少土地，多收了多少税钱，一条一条列得明明白白。要动刀兵，总得有个说法，这说法便是账。欠债还钱，天经地义，账一摆出来，师出便有名，天下人看了也晓得谁曲谁直。檄文写成，抄了许多份，四处张贴，还专程派人送到雨林。有人说这檄文写得痛快淋漓，把多年的委屈一股脑儿倒了出来。檄文贴在城门上，过往行人停下脚步，听识字的高声念一遍，都点头说这仗打得有理。"
 SUM_Neo_SDH.162.a:"直取雨林关隘"
 SUM_Neo_SDH.162.b:"先断其商路"
 SUM_SDH_WAR_Night_Wind:"乘风宵济"
 SUM_SDH_WAR_Night_Wind_desc:"大军按兵不动，专等风起。风一起天地昏黄，人和影子都辨不清，正好掩人耳目。三军趁着风声悄悄向前推进。这等用兵，狡猾。"
 SUM_Neo_SDH.163.t:"乘风宵济"
 SUM_Neo_SDH.163.d:"狂风卷着黄沙，天昏地暗，沙墙足有几丈高，主帅号旗一挥，大军借着风势无声无息地往前压，风里连人影都辨不清，敌军果然毫无察觉，等风一停，我军已逼到阵前，一击即中。原来大军列阵已毕，迟迟不发，单等一样东西：风。沙漠里打仗，风是天然的屏障，风一起飞沙走石，敌军看不清我军虚实，我军却可借风掩护悄然逼近。主帅极沉得住气，日日登高望风，猛将们急得直搓手，他只按住不动，说时机未到。主帅还留下话：「风里作战，忌的是心浮气躁，谁先动谁先乱。」众将记牢了，按兵不动，任凭风沙扑面，眼睛眨也不眨，待风一起，全军如离弦之箭直扑敌阵。"
 SUM_Neo_SDH.163.a:"把话说给雨林人听"
 SUM_Neo_SDH.163.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Star_Guide:"占星审方"
 SUM_SDH_WAR_Star_Guide_desc:"夜行军靠天上的星斗定方向，星光一亮便走，星光一暗便停，停了就地卧倒，不许出声。有一回星光全暗，大军便在沙里趴了一夜，直到天明。这等纪律严明。"
 SUM_Neo_SDH.164.t:"占星审方"
 SUM_Neo_SDH.164.d:"有一夜，星光忽然让乌云吞了，队伍立刻停住，就地卧倒，果然探子来报，不远的地方有敌骑游弋，因我军伏着不动，竟没被察觉。大军夜行，白日里靠日头指路，夜里靠的就是星。哈德拉玛维特的兵走夜路，专看天上星斗辨方向，北斗在哪边，队伍便朝哪边开。这看星的能耐是老向导的看家本事，他们认得星辰，就像认得自家门牌。只是天说变就变，云一遮，星光便暗，于是立下死规矩：星光亮的便走，暗了便停。一停下，全军就地卧倒，连大气都不敢出。为何要伏着？夜里驻停最怕露了形迹，伏在地上，远处便望不见。还有一回星光实在太暗，向导索性趴在地上，就着那点微光辨认星辰，琢磨了半晌才敢下令前行。"
 SUM_Neo_SDH.164.a:"倾全境之力"
 SUM_Neo_SDH.164.b:"留一支后手"
 SUM_SDH_WAR_Camel_Load:"驼负军装"
 SUM_SDH_WAR_Camel_Load_desc:"辎重全靠骆驼驮。驼比车强，能多熬几天干渴，走到无水之地，车早趴窝，驼还稳稳地走。所以沙漠里运粮从不兴用车，那玩意在沙上走不动。"
 SUM_Neo_SDH.165.t:"驼载军资"
 SUM_Neo_SDH.165.d:"那回穿过一片无水的地方，连着几天寻不着水，马匹一匹匹渴趴下了，唯独骆驼昂着头，一步一步走得稳当，驮着辎重安然过去，众人这才领教了它的本事。大军远征，粮草辎重怎么运？哈德拉玛维特不使车，单靠骆驼。原来沙漠里行车，轮子陷进沙里便寸步难行，还得拿料喂马；骆驼就不同了，脚掌又宽又厚，踩在沙上不下陷，最妙的是耐渴，肚里能存水，比车马多熬好几天的干渴。一支驼队驮着粮草慢慢走，驼铃叮当，稳稳当当。管辎重的官儿每日清点骆驼，草料喂得饱饱的，蹄子磨破了就裹上布，还特意钉了铁掌，免得被尖石割破。每到一个绿洲，先让骆驼喝足了水才肯上路。"
 SUM_Neo_SDH.165.a:"以动员令起兵"
 SUM_Neo_SDH.165.b:"以盟约召集部族"
 SUM_SDH_WAR_Oasis_Leap:"循洲而前"
 SUM_SDH_WAR_Oasis_Leap_desc:"大军沿绿洲一座一座往前跳，跳一步补给便近一分，人马也养得更足。有绿洲远的地方，宁可绕路也不肯远离水。这跳法稳妥。"
 SUM_Neo_SDH.166.t:"循洲而前"
 SUM_Neo_SDH.166.d:"一处将领耐不住性子，嫌这走法太磨蹭，主帅却慢悠悠回他：宁可慢些，也断不得粮草，那是兵家大忌。众人一听，都点头称是。原来大军深入敌境，最挠头的就是补给。哈德拉玛维特想出的主意，是不贪多、不冒进，顺着绿洲一处一处地往前挪。攻下一处绿洲，便拿它做个窝，歇上一阵，补够粮草，再挪往下一处。沙漠里打仗，补给线拖得越长越凶险；顺着绿洲挪，挪一步，补给便近一步，粮草能就近接上，兵马也不至于累垮。每挪一处，还留下守军扎下根来经营。主帅管这叫步步为营。大军自西向东，先拣近处的绿洲下手，再慢慢图远的，稳扎稳打。"
 SUM_Neo_SDH.166.a:"直取雨林关隘"
 SUM_Neo_SDH.166.b:"先断其商路"
 SUM_SDH_WAR_Silent_Move:"衔枚疾走"
 SUM_SDH_WAR_Silent_Move_desc:"全军练无声行军，铃铛一概摘了，马蹄也用布包上，走得再快也听不见声响。有一回夜袭，守军直到刀架脖子才惊觉。这无声之法吓人。"
 SUM_Neo_SDH.167.t:"衔枚疾走"
 SUM_Neo_SDH.167.d:"那新兵头回随军夜行，坐骑不知受了什么惊，脖子一扬就要嘶叫，旁边的什长眼疾手快，一把攥紧缰绳，压着嗓子低喝一声，那新兵吓出一身白毛汗，再不敢吭气。原来主母传下军令，全军夜行，务必寂静。沙漠赶路向来靠驼铃引道，叮当一响，十里之外都听得见；主母偏反其道而行之，叫军士把驼颈上的铃铛一个个解下，塞进衣襟，外头又缠上几层软布，牲口的蹄子也拿厚棉布裹了个严实，踩在沙上只余细沙簌簌的轻响。这一夜月色昏沉，上万人马口中衔枚，摸黑疾走，队里不点一盏灯，也听不见一句闲话。一口气走出三十多里，竟没人说得清这支兵马是何时动的身，静得出奇，仿佛沙海自个儿长了腿。待到天色微明，人马在一处沙坳里歇脚，连咳嗽都拿手捂着，回头一望，来时的脚印被风沙盖得干干净净，半点痕迹也不剩。"
 SUM_Neo_SDH.167.a:"把话说给雨林人听"
 SUM_Neo_SDH.167.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Storm_Keep:"力拔戍垒"
 SUM_SDH_WAR_Storm_Keep_desc:"雨林伸进沙漠的戍所头一个要拔掉。拔掉一处，沙漠人的脸面便松一分，腰杆也挺一分。有一处戍所被拔，附近的百姓都来围观。这戍所扎眼。"
 SUM_Neo_SDH.168.t:"力拔戍垒"
 SUM_Neo_SDH.168.d:"先锋挑了精锐，趁黑摸到墙根，先掐断水道，再搭起云梯。墙上一声锣响，守卒顿时乱了套，有的丢了弓箭，有的翻墙就跑，不到半个时辰，旗子就换了。哈德拉玛维特性子最恨雨林伸进沙地的那一处处戍所，像钉子一样扎在沙漠肉里。主母升帐，对众将道：「先拔戍所，拔掉一处，沙漠的脸面便松开一分。」这戍所三面筑墙，一面临水，守卒都是雨林雇来的生兵。先锋怕有埋伏，举着火把四下照过，确认没人，才报了捷。有个守卒腿慢，被先登的兵一把揪住，按翻捆了。先锋又命人顺着墙根搜，怕暗处藏着弓手，把整座戍所翻了个遍才踏实。自此沙漠北进，一步一个脚印，势不可挡。"
 SUM_Neo_SDH.168.a:"倾全境之力"
 SUM_Neo_SDH.168.b:"留一支后手"
 SUM_SDH_WAR_Siege_Rig:"锻制攻械"
 SUM_SDH_WAR_Siege_Rig_desc:"攻城的器具照着遗迹里的图样造，样子笨重，推起来费劲。可戍所的墙厚，云梯不管用，还得靠这笨家伙。众人不解，匠人道：「墙厚，就得用笨办法。」"
 SUM_Neo_SDH.169.t:"匠斫攻械"
 SUM_Neo_SDH.169.d:"攻城那天，那笨重的木头车子撞上去，墙壁簌簌往下掉土，一撞便是一个大窟窿，先前笑得最响的几个兵，脸涨得通红，再不敢吭声。这物件名叫冲车，是匠作营照着几卷从古遗迹里拓下的图样打造的，通体裹着铁皮，推起来要二十号人合力。头一回试车，轮子陷进沙里动弹不得，老匠又添了两条宽木，才推得动。士卒起初都笑，说这般蠢物怎生上阵，哪知雨林戍所的墙是夯土垒的，才三尺厚，云梯一搭便塌，哪里经得住这铁头一撞。两个老匠蹲在车旁，一会儿敲敲楔子，一会儿给轴上油，嘴里念叨着慢工出细活。攻城那日，一撞一个准，众军方才服气。那老匠拍着车帮说，这东西看着粗笨，却是个稳当的，撞一回塌一回，从不含糊。"
 SUM_Neo_SDH.169.a:"以动员令起兵"
 SUM_Neo_SDH.169.b:"以盟约召集部族"
 SUM_SDH_WAR_Cut_Canal:"决土通渠"
 SUM_SDH_WAR_Cut_Canal_desc:"攻戍所先掘它上游的渠。渠一断，守军守着水却打不上来，渴得没法子，军心先乱了。有一处戍所就这么不攻自破。断水毒辣。"
 SUM_Neo_SDH.170.t:"绝渠困敌"
 SUM_Neo_SDH.170.d:"守城的将官立在干渠边，望着那道裂开缝的沟，半晌说不出一句话，心里明白这城守不下去了。事情是这样的：雨林的戍所挨着水建，上游那道渠就是它的命根子。主母派一支兵绕到渠首，趁着月黑风高，一锹一锹把渠掘断，浑黄的水渗进沙里，转眼没了影，渠底干出一道道裂缝。营里水井虽还在，水却再引不进来，守卒眼睁睁望着干渠，有水也打不上来。第二天刚亮，众人渴得嗓子冒烟，争着扒上墙头张望，军心先乱了一半。那将官急得团团转，派人拼死出城找水，才爬出壕沟，就被埋伏的弓手射了回来。到了午后，城里竟有人拎着水桶出来投降。断了水，比刀枪还厉害，主母使的就是这条毒计，不费一兵一卒，先叫对方自己乱了阵脚。"
 SUM_Neo_SDH.170.a:"直取雨林关隘"
 SUM_Neo_SDH.170.b:"先断其商路"
 SUM_SDH_WAR_Night_Wall:"乘夜仰登"
 SUM_SDH_WAR_Night_Wall_desc:"攀墙挑的是最灵便的人，攀上去的不到一半，摔下来的更不少，可墙上的灯却一盏盏灭了。底下的人托着，上面的人拽着，谁也不敢松手。这等苦差，端的拿命去换。"
 SUM_Neo_SDH.171.t:"五十登陴"
 SUM_Neo_SDH.171.d:"墙头上的灯，一盏接一盏地灭了。原来是先爬上去的那几个人摸到灯下，一刀割断灯绳，黑影里守卒立时乱了套。攻城这一夜，将军从军中挑了五十个手脚最利落的兵，专管攀墙，这些人都是爬惯了沙丘的，身手活像猿猴。那墙高数丈，砖石缝里刚能塞进指尖，众人腰里系着绳，一个接一个往上爬。爬到半道被守卒发觉，乱箭齐发，手一松便摔下去，五十个人爬上去的不到一半，剩下的死的死、伤的伤，倒在墙根下哼成一片。趁着灯灭这一乱，先上去的几个人站稳了脚，抽出短刀反守为攻，墙下随即架起云梯，活着的人顺着梯子往上冲，在墙头与守卒绞成一团，杀声和风声搅作一处。没多久，那面旗就被扯下来，换上了自家的。"
 SUM_Neo_SDH.171.a:"把话说给雨林人听"
 SUM_Neo_SDH.171.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Keep_Pass:"凭关死拒"
 SUM_SDH_WAR_Keep_Pass_desc:"关隘一易手，立刻改成自家的戍所。城墙加高，门楼重修，门朝哪边开如今由沙漠说了算。有一处关隘，昨日还挂着雨林的旗，今日便换了主人。"
 SUM_Neo_SDH.172.t:"扼险死拒"
 SUM_Neo_SDH.172.d:"一个降卒嘟囔了半句，被监工听见，当场吃二十军棍，打得皮开肉绽，从此再没人敢多嘴。原来关隘一易主，哈德拉玛维特并不急着追击，先就地改起戍所来。打下的关卡本是雨林的样式，门朝南开，如今归了沙漠，门自然得朝北。主母派匠人扯下旧旗号，换上花与沙丘的纹样，又把壕沟掘得更深，墙头砌得更厚，连城墙上旧箭孔都一一补平，外头另起一圈女墙。没几天，一座关隘便修得铁桶也似，又添了粮仓水窖，成了沙漠继续北上的根基。这关门朝哪边开，从此由沙漠说了算，再轮不到雨林置喙。完工那天，主母亲自登城巡察一遍，微微点头，赏了匠人们几坛好酒，众人谢恩退下，脸上都有光彩。"
 SUM_Neo_SDH.172.a:"倾全境之力"
 SUM_Neo_SDH.172.b:"留一支后手"
 SUM_SDH_WAR_Turn_Guard:"诱降戍卒"
 SUM_SDH_WAR_Turn_Guard_desc:"雨林的戍卒大半是雇来的佣兵。沙漠派去的人不带刀，只问一句：「你替谁当兵？」问得那戍卒哑口无言，有几个当场就扔了刀。这攻心之法厉害。"
 SUM_Neo_SDH.173.t:"诱降戍卒"
 SUM_Neo_SDH.173.d:"「你替谁当兵？」那人进城，不带一刀一枪，只撂下这一句问话。这一问最是厉害。雨林边上的戍卒，大半是花钱雇来的，不是本土子弟，本为几两银子卖命，谁肯真替雨林去死？被问的人先是一怔，随即低下头，有的当晚就开了城门。主母深谙这个理，每打下一处，并不急着杀人，只派一个能说会道的人进去。有一队守卒开头还嘴硬，待问到月饷已欠了三个月，人人脸上都现出怨色，不多时便有人缒城而下前来投诚。那问话的人趁热打铁，把雨林欠饷的旧账一桩桩抖出来，听得守卒心头火起。主母一概不问旧事，愿留的编入队伍，愿走的发给口粮。攻心为上，攻城为下。"
 SUM_Neo_SDH.173.a:"以动员令起兵"
 SUM_Neo_SDH.173.b:"以盟约召集部族"
 SUM_SDH_WAR_Village_Talk:"缔好沙砦"
 SUM_SDH_WAR_Village_Talk_desc:"雨林边的村社也交着重税。派去的人不带兵器，只带一本账，把两下的税一比，村人便都明白了，纷纷点头说这账算得明白。这账本胜刀枪。"
 SUM_Neo_SDH.174.t:"缔好沙砦"
 SUM_Neo_SDH.174.d:"村民们头一回见当官的这般讲道理，一个个眉开眼笑，争着往前挤，好把那账本看得更真切些。雨林边上的村社交不起重税，叫苦连天，主母听说之后没派一兵一卒，只打发一个账房先生模样的人前去，那人身上不带半件兵器，怀里单单夹着一本账。进了村，他不提打仗的话，只把账本摊在桌上，一条条念给众人听：某村今年缴粮多少，去年又加了几成，年年往上翻，逼得百姓卖儿卖女。村民听着，无不咬牙切齿，纷纷倒苦水。等声息稍歇，那人才缓缓开口：「若肯归附，减税三成，永不再加。」说着取出笔墨，当着众人的面在账上注了新数。这一席话说得满堂踊跃，村社从此归了心。那人又当众立下字据、画了押，写明来年若再加税，村社可持此据直诉主母。"
 SUM_Neo_SDH.174.a:"直取雨林关隘"
 SUM_Neo_SDH.174.b:"先断其商路"
 SUM_SDH_WAR_Amnesty:"下诏宥罪"
 SUM_SDH_WAR_Amnesty_desc:"凡归降的一概不问旧事。愿留下的分给田地，愿走的发给口粮送他上路。有一批戍卒归降，当日便安顿妥当。这般宽待，收人心。"
 SUM_Neo_SDH.175.t:"纳降勿究"
 SUM_Neo_SDH.175.d:"那名雨林旧将来时已把后事交代妥当，自忖必死，谁想主母不但不杀，反赐他一份田宅，那人叩头流血，从此死心塌地，后来攻城时竟立了大功。原来主母治军，最重收服人心，凡有归降的，一概不问旧日罪过。那些降卒最怕的就是清算旧账，没料到主母这般豁达，个个感激涕零。愿留下的，便在沙地分给一块田，叫他安心耕作、娶妻生子；愿走的也不为难，发给几袋口粮，遣他回乡。消息一传开，各处守卒争相归降。主母又命人在受降的地方立了一块木牌，写明归附者免罪分田的章程，让往来的人都能看见。这一招果然灵验，没过半月，远近的守卒便拖家带口，络绎来投。"
 SUM_Neo_SDH.175.a:"把话说给雨林人听"
 SUM_Neo_SDH.175.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Buy_Clerk:"赂结文吏"
 SUM_SDH_WAR_Buy_Clerk_desc:"关卡上的书吏专管记档。银子递过去，那份档案便换了一份，想要什么名目就有什么名目。这其中的手脚瞒不过明眼人，上头明明查得出，却偏偏装作不知。"
 SUM_Neo_SDH.176.t:"贿通书吏"
 SUM_Neo_SDH.176.d:"巡查官亲自到关卡查验，把档册翻了个遍，只见商队往来不绝，铁器食盐一应俱全，哪里看得出半点兵马调动的痕迹，只得点头放行。原来关卡上头，全靠书吏一笔一笔记录往来人马与货物，那档册本是雨林的耳目，谁进谁出记得清清楚楚。主母瞧出这里的门道，暗暗差人携了银两去打通书吏。银子一递过去，书吏便换一份档册，把沙漠的兵马写成商队，把兵器写成铁器，上头查验只见纸上一片太平。有个清正的书吏不肯收钱，主母也不勉强，另寻一个贪心的顶上。没半年，沿线的档册都改了模样，那一支支兵马便在这纸面上大摇大摆地过了关。主母据此，把兵马神不知鬼不觉地送了过去。"
 SUM_Neo_SDH.176.a:"倾全境之力"
 SUM_Neo_SDH.176.b:"留一支后手"
 SUM_SDH_WAR_False_News:"行反间计"
 SUM_SDH_WAR_False_News_desc:"假消息故意透给雨林的斥候。斥候得了消息欢欢喜喜回去，说给自己人听，全然不知是假。雨林那边信以为真，白白调了兵。这借人之口，巧妙。"
 SUM_Neo_SDH.177.t:"泄其假话"
 SUM_Neo_SDH.177.d:"那几个斥候直到让人擒住，还当自己立下了大功，被人卖了还帮着人数钱。主母使的这一招，是借敌人的嘴去骗敌人的兵。两军对峙，最要紧的便是耳目，她故意放出些半真半假的话，递到雨林斥候的耳朵里。斥候得了消息如获至宝，连夜赶回去一五一十地禀报：说沙漠的主攻摆在东边，其实兵马早悄悄挪去了西边；说粮草快要断了，其实满载的车队正沿盐路源源开来。雨林的将官信以为真，把重兵一股脑调到东边，西边登时空虚，等真打起来，那里守卒稀少，一触便溃。那斥候临走还领了赏钱，欢天喜地地去了，哪里晓得带回去的原是人家编好的套子。两下里一对照，雨林的败局早就注定了。"
 SUM_Neo_SDH.177.a:"以动员令起兵"
 SUM_Neo_SDH.177.b:"以盟约召集部族"
 SUM_SDH_WAR_Supply:"军装络绎"
 SUM_SDH_WAR_Supply_desc:"辎重沿盐路铺开，一站接一站，像一条长蛇。前线吃什么、穿什么全看这条线，线路一断前方便要饿肚子。这补给线端的要紧。"
 SUM_Neo_SDH.178.t:"仓廪相望"
 SUM_Neo_SDH.178.d:"话说有一回风沙埋了半段路，运粮队绕道走了三日，前线便断了顿，将士叫苦不迭。主母闻报，立刻调人清理沙障，重新打通，又添了几处备用的粮站，自此一路畅通，再无断粮之虞。大军远征，粮草最是要命，主母把辎重沿盐路一路铺开，一站接一站，仿佛串起一条长蛇。这盐路本是商贾贩盐的旧道，沿途有绿洲、有水井，恰好做了歇脚的所在。每一站都屯着粮草，堆积如山，前军吃完了，后军立刻补上，前线将士吃什么、穿什么，全看这条线。每一站都派专人看守，夜里点起火把，远远望去，盐路上像一条火龙蜿蜒。后方的粮车一辆接一辆，昼夜兼程，谁也不敢耽搁，生怕误了前线的饭食。"
 SUM_Neo_SDH.178.a:"直取雨林关隘"
 SUM_Neo_SDH.178.b:"先断其商路"
 SUM_SDH_WAR_Water_Team:"输水济众"
 SUM_SDH_WAR_Water_Team_desc:"运水队昼夜不停，车夫换了一班又一班，车子却不歇，夜里也借着星光赶路。这水比金子贵，耽误不得。车队走过的地方，地上都压出两道深辙。"
 SUM_Neo_SDH.179.t:"筒车昼夜"
 SUM_Neo_SDH.179.d:"有个赶车的硬汉，三天三夜没挪窝，两眼熬得血一般的红，可主母的章程不容他停。沙漠行军，水贵过金子，主母为此拉起一支运水队，昼夜赶路不停。水车造得又高又沉，一辆盛几十桶，全凭健壮的驼马拖着走。赶车的累得汗珠直滚，主母立下的规矩是：人可以轮班换，车子片刻停不得。这批人刚撂下鞭子，那批立刻接上手，人歇车不歇。半道上一辆车坏了轮子，随行匠人就地鼓捣一阵，转眼又上了路，一滴水也没洒。就这样，前线的水一天没断过，兵士喝上凉水，杀敌的力气便足了。绿洲边上另挖了蓄水池，运来的水先存进池子，再一桶桶分到各营。管水的官儿举着木牌按人头分派，谁也别想多占一滴。有渴极了想往前挤的，被众人齐声喝住，只好退到队尾去等。"
 SUM_Neo_SDH.179.a:"把话说给雨林人听"
 SUM_Neo_SDH.179.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Medic:"阵前置医"
 SUM_SDH_WAR_Medic_desc:"医帐随军而行。能就地治的当场敷药包扎，治不了的往后方的医馆送。有伤重的，全靠这医帐救回一命。这随军的医者难得。"
 SUM_Neo_SDH.180.t:"医庐随阵"
 SUM_Neo_SDH.180.d:"一名兵丁被流箭射穿了腿，血流不止，医官当下替他止血敷药，命人用担架抬着一路往后送，不到十日，那人竟又能提刀上阵。军中厮杀，难免伤损，主母特设医帐随军而行，挑了懂医理的人随侍左右。刀伤用金疮药敷上，骨折用木板夹住，能就地治的当场便治好了，伤得重的便往后送，一程程转回绿洲的大营。医帐里终日药气弥漫，镊子、布条摆了一桌，医官忙得饭也顾不上吃。帐外插着一面白旗，伤兵远远望见，心里便踏实了。有那轻伤的，包扎完毕又提刀回了阵前，众军看了无不感叹。众军见医帐如此周到，打仗时胆气便壮了几分，知道便是伤了也有个奔头。这医帐，稳住了军心。"
 SUM_Neo_SDH.180.a:"倾全境之力"
 SUM_Neo_SDH.180.b:"留一支后手"
 SUM_SDH_WAR_Forge_Move:"军携作匠"
 SUM_SDH_WAR_Forge_Move_desc:"铁作坊跟着大军走。刀卷了刃，枪折了杆，缺什么便现造什么，不用往回送。匠人白天赶路，夜里支炉，火光映红了半边沙丘。这随军的铁匠省心。"
 SUM_Neo_SDH.181.t:"军携作匠"
 SUM_Neo_SDH.181.d:"刀枪这东西，上阵最怕崩了卷了又没处修，主母索性把铁作坊也搬进军里，打新修旧样样都管。铁匠们背着风箱铁砧，队伍扎到哪里，炉火就在哪里升起。前军砍卷了刀刃，拿回来回炉重铸；折了枪杆，当场削根木头上上，缺什么打什么，方便得很。有一回攻城，云梯上几只铁钩崩断了，匠人点着灯连夜赶打，天一亮就送到阵前，半点没耽误。夜色里炉火映天，火星四下里飞溅，铁锤叮叮当当，倒成了一道景致。工匠手上烫得尽是水泡，也顾不上疼，只怕误了军中大事。炉子昼夜不熄，铁匠们轮班守着，困了往车辕上一靠打个盹，醒来又抡锤。众人见器物随手就有，心里都踏实。有人算过，这一路打出来的刀枪，够装备整整一个营。"
 SUM_Neo_SDH.181.a:"以动员令起兵"
 SUM_Neo_SDH.181.b:"以盟约召集部族"
 SUM_SDH_WAR_Rear_Tax:"转饷不绝"
 SUM_SDH_WAR_Rear_Tax_desc:"后方照旧收捐输，出钱的人心里盼着只要这一仗打赢，日后便能抵税。收捐输的桌子就摆在井台边，交过钱的在册上按个手印。这捐输收得人心甘，也收得人心焦。"
 SUM_Neo_SDH.182.t:"转饷不绝"
 SUM_Neo_SDH.182.d:"话说有一家大商户一口气捐了千担粮食，换得一张盖着朱红大印的凭据，捧在手里仿佛捧着聚宝盆，逢人便夸，夜里睡觉都揣在怀里，生怕丢了。大军在外厮杀，后方也没闲着，主母照旧征收捐输，凡是富户商贾都要按例输将。他们打的算盘是：如今捐了钱粮，待打了胜仗，便可拿这一点抵赋税，连本带利都捞回来。主母也乐得顺水推舟，明里许诺，暗地里把账记下，那凭据上写得明白，战后准抵三年赋税。就这么着，前线的粮饷源源不断，后方的富户也眼巴巴等着分红，各取所需，皆大欢喜。主母把人心拿捏得死死的，叫他们心甘情愿地掏钱。"
 SUM_Neo_SDH.182.a:"直取雨林关隘"
 SUM_Neo_SDH.182.b:"先断其商路"
 SUM_SDH_WAR_Last_Wind:"终风大起"
 SUM_SDH_WAR_Last_Wind_desc:"三军人马早早守在风口，只等风起霎时掩杀过去。总攻特意挑在换季的大风天：狂风一卷，黄沙遮天蔽日，敌军连眼睛都睁不开。这般千载难逢的时机，哪里是天天都有的。"
 SUM_Neo_SDH.183.t:"终风大起"
 SUM_Neo_SDH.183.d:"风停在傍晚，沙地上横七竖八倒了一大片，沙漠的人才收住刀。这一仗，主母偏挑在换季的大风天打。大风卷着黄沙，天地浑浑沌沌，东西南北都分不清，风声像千军万马在奔腾，沙粒打在脸上生疼，眼睛根本睁不开。沙漠的人从小在风沙里滚大，早习惯了，雨林的兵却从没见过这等阵仗，一开战就晕头转向。主母瞅准了这一点，才把决战定在这时候。沙漠的兵借着风势逆风掩杀过去，雨林的兵看不清来敌，弓箭射得东倒西歪，不少人自己人踩了自己人。众军高声呐喊，声音全被风吞了，只剩一片混战。沙漠的兵脸上蒙着布，只露一对眼，借风声遮住脚步，摸到跟前一刀劈下，雨林的兵还没看清人影就倒了。这一阵，杀得天昏地暗。"
 SUM_Neo_SDH.183.a:"把话说给雨林人听"
 SUM_Neo_SDH.183.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Break:"一谋溃敌"
 SUM_SDH_WAR_Break_desc:"最硬的风卫压住正面死战，等对方阵脚一动，两翼的游骑便插进去，如刀切豆腐。这正面牵制、两翼包抄这一手练了多少回，今日终于用上，端的老练。"
 SUM_Neo_SDH.184.t:"风卫当锋"
 SUM_Neo_SDH.184.d:"中军的旗一倒，四下里便溃散开去，游骑一路追杀，把溃兵赶到沙丘夹缝里，插翅也难逃。主母立在高处观阵，见两翼得手，方才放声大笑，说这一仗赢得痛快。总攻既起，主母布下阵势：最精锐的风卫压在正面，列成厚厚一堵墙稳步向前，那些风卫都是百战之余，披重甲、持长盾，弓箭射不透，长枪扎不进。雨林的兵见正面推不动，果然把预备队调上去，阵势一动，两翼便露出空隙。主母等的就是这一刻，号令一下，两翼的游骑如离弦之箭从沙丘后斜刺里插进去，直捣中军，雨林的阵登时被搅作一团，首尾不能相顾。风卫在前面压住，游骑在两翼包抄，配合得如同一个人。"
 SUM_Neo_SDH.184.a:"倾全境之力"
 SUM_Neo_SDH.184.b:"留一支后手"
 SUM_SDH_WAR_See_Towers:"远瞩浮图"
 SUM_SDH_WAR_See_Towers_desc:"从雨林高处往下望，隐隐能望见须弥城的尖塔。走了这么远的路，打了这么多的仗，为的就是那几座塔。这一路辛苦，都有了着落。"
 SUM_Neo_SDH.185.t:"远瞩浮图"
 SUM_Neo_SDH.185.d:"那一夜宿营，几个兵围着篝火，把刀锋磨得雪亮，谁也不提明日的事。队伍已经走到雨林的尽头，登上高处，有个胆大的兵攀上一块岩石，顺着他手指的方向，众人看见尘沙尽头立着几座尖塔，高高插入天际。有人低声说了两个字：须弥。走了这么远，穿过沙海，越过一道道关隘，多少人马埋在路上，多少血洒在沙里，为的就是看这几座塔一眼。一个跟主母多年的老兵眼眶发红，嘴里反复念叨，总算走到了。主母站在风里，望着那几座塔，久久没有言语。塔里住着教令院，住着大贤者，把沙漠的人挡在门外这么多年，如今兵临城下，只差最后一步。众军顺着她的目光望过去，胸口起伏，手里的刀握得更紧。有个年轻兵忍不住问，看见了塔，接下来又待怎样，老兵沉了半晌，才说往后就看主母的吧。众人便都住了口，只顾擦刀。"
 SUM_Neo_SDH.185.a:"以动员令起兵"
 SUM_Neo_SDH.185.b:"以盟约召集部族"
 SUM_SDH_WAR_Terms:"开口议约"
 SUM_SDH_WAR_Terms_desc:"兵临城下这才慢悠悠提出条件：撤走戍兵，减少贡赋，归还水源，承认独立。四条摆出来，一条也不肯少。这条件提得硬气，少一条也不肯收兵。"
 SUM_Neo_SDH.186.t:"列款数条"
 SUM_Neo_SDH.186.d:"使节还要争辩，主母却端起茶碗慢慢啜饮，再不搭理，那使节没了法子，只好灰溜溜回城。原来大军压到须弥城下，主母才亮出条件，一共四条：撤回沙地的戍所，减轻岁贡，归还抢占的水源，承认哈德拉玛维特自主。四条条条戳在要害上，她偏憋着不开口，非等兵临城下才抛出来。主母最会使势，先把刀架在人脖子上，再从容讲道理。城里的教令院慌作一团，六派首座你瞅瞅我、我瞅瞅你，谁也拿不准主意。使节把那四条一条条禀报上去，教令院里顿时炸了锅：有人咬牙要硬抗，有人盘算先应下再从长计议，吵了整整一夜，也没吵出个结果。"
 SUM_Neo_SDH.186.a:"直取雨林关隘"
 SUM_Neo_SDH.186.b:"先断其商路"
 SUM_SDH_WAR_Sumeru_Day:"须弥启旦"
 SUM_SDH_WAR_Sumeru_Day_desc:"到了这一步，这仗不只是打给雨林看的，也是打给沙漠自己看的。要让雨林知道厉害，也要让自家明白，沙漠不再是从前那盘散沙。这一仗，赢要赢得明白，输也要输得明白。"
 SUM_Neo_SDH.187.t:"择吉启祚"
 SUM_Neo_SDH.187.d:"号角吹了很久，呜呜咽咽在沙丘间回荡。兵士们收了刀，你看看我、我看看你，心里竟有些空落落的，打了这么久，忽然收兵，倒像丢了什么似的。走到这一步，这仗的意味已经变了，不只打给雨林看，更要打给沙漠自己看：让雨林晓得沙漠不好惹，也让沙漠各部晓得，跟着主母才有肉吃。主母明白这个理，所以每到一处，必要堂堂正正地列阵，把话明明白白说在前头，从不搞偷袭取巧那一套。目的既已达到，便吹号收兵，她自己却远远望着须弥城，神色平静。那些天，沙地上到处传扬主母的威名，说她用兵如神，说她待降卒宽厚，各部首领纷纷赶来拜见，抢着表示臣服，生怕慢一步分不着好处。"
 SUM_Neo_SDH.187.a:"把话说给雨林人听"
 SUM_Neo_SDH.187.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Storm_On_Forest:"飓风扫林"
 SUM_SDH_WAR_Storm_On_Forest_desc:"哈德拉玛维特的旗插上了第一道雨林戍所。往东是河渠平原，再往东便是须弥城。教令院连夜遣使，说可以谈。阵前的人只回一句：「先撤戍，再谈别的。」这话答得硬气。"
 SUM_Neo_SDH.188.t:"飓风扫林"
 SUM_Neo_SDH.188.d:"旗子插上墙头，在风里扑簌簌地响。那守戍的雨林兵，有的还在梦里就让堵在了被窝里，有的赤脚往外逃，被乱箭射倒，一顿饭不到，这座戍所就静了下来。哈德拉玛维特的第一面旗，就此稳稳立在了雨林戍所的墙头。往东望去，河渠平原一马平川，再远处，便是那座须弥城。这一面旗，等于把去往须弥的大门一脚踹开了。教令院哪敢怠慢，连夜派人出城，一路飞奔到阵前，嘴上说愿意谈，什么条件都好商量，把好听的话搬了个遍，说得口干舌燥。阵前那人只淡淡一句：「先撤戍，再谈别的。」使节碰了一鼻子灰，怏怏回城，连夜又写禀报。拳硬，才有说话的底气。"
 SUM_Neo_SDH.188.a:"倾全境之力"
 SUM_Neo_SDH.188.b:"留一支后手"

 #### 决议 ####
 SUM_SDH_Govern:"主母统诸部"
 SUM_SDH_Govern_desc:"哈德拉玛维特的政务组管的是花都与雨林边地的内政。安抚部族，整理税制，兴修水利，一样样都是稳固根基的功课。根基扎得深，风雨来了才不动摇，百姓安心耕织才算真稳。"
 SUM_SDH_Faith:"花神配祀"
 SUM_SDH_Faith_desc:"哈德拉玛维特的信仰组管的是古树与花神的祭祀。新旧教团有了分歧便由它调停，维系民间信念。信仰一散人心便难聚，收税征兵都要跟着吃力。这信念不能乱。"
 SUM_SDH_Trade:"盐道行贾"
 SUM_SDH_Trade_desc:"哈德拉玛维特的贸易组靠着雨林与商道，经营香料、木材、奇珍的买卖，这是本邦富庶的根本。货源商路都攥在手里，府库自然充盈，遇上战事灾荒也拿得出东西应付。"
 SUM_SDH_Army:"风沙练旅"
 SUM_SDH_Army_desc:"哈德拉玛维特的军事组管训练、布防与征兵。这支兵马依托山地密林，讲求伏击坚守。山林是最坚固的屏障，也是最熟的地利，善用便能以少敌多。守住山林便守住命脉。"
 SUM_SDH_Crisis:"灾后继馑"
 SUM_SDH_Crisis_desc:"哈德拉玛维特的危机组专管内外突发变故。山林之间消息迟滞，凡事务必早断，免得小事拖成大患，到时候补救要多费几倍气力。早做打算，才护得住山林人家。"
 SUM_SDH_Dec_Gov_Council:"集部众议"
 SUM_SDH_Dec_Gov_Council_desc:"要召集各部的代表聚到一处议事。帐子围成一圈，火塘居中，你一言我一语，议定了便立约为凭，各自签押。有分歧的也先记下慢慢再议。这代表一处，事情便好商量。"
 SUM_SDH_Dec_Gov_Roll:"著籍部众"
 SUM_SDH_Dec_Gov_Roll_desc:"各部的人丁逐一登记成册。谁家几口，年纪多大，能拿不能拿兵器，都写在册上。有隐瞒不报的一经查出便要罚。这册子关系重大。"
 SUM_SDH_Dec_Gov_Elder:"众举耆宿"
 SUM_SDH_Dec_Gov_Elder_desc:"长老一职改由住户公推。谁办事公道众人便推谁，不必再看出身。推的时候围在井台边，各人往陶罐里投一粒石子。有想靠家世上位的这回也只得作罢。这公推服人。"
 SUM_SDH_Dec_Gov_Petition:"置受辞所"
 SUM_SDH_Dec_Gov_Petition_desc:"有理讲不清的人，这下也寻着了说理的去处。城里新开了一处衙门，专管接理冤屈：谁受了委屈递上一张纸状，便有人接、有人问、有人断。这衙门，实是方便了百姓。"
 SUM_SDH_Dec_Faith_Fete:"花神诞祭大酺"
 SUM_SDH_Dec_Faith_Fete_desc:"沙地各处都要办起花神诞祭。搭起神棚，摆上鲜花，男女老少都来烧香。有远处的也赶着驼车来看热闹。这诞祭一办，人心便齐了。"
 SUM_SDH_Dec_Faith_Shrine:"筑此灵宇"
 SUM_SDH_Dec_Faith_Shrine_desc:"城门边上立起一处花神的龛，龛里供着鲜花，来往的人都要进去拜一拜。有赶路的也停下车马献上一束。日子久了，那龛前的地都踏得发亮。这龛端的暖人心。"
 SUM_SDH_Dec_Faith_Alms:"置赈贫舍"
 SUM_SDH_Dec_Faith_Alms_desc:"济贫之事交给神庙去办。庙里开设粥棚，收留无依的人，冬施衣，夏施水。有穷得没饭吃的便来庙里讨一口。庙门口常年排着队，倒也不乱。这善举积德。"
 SUM_SDH_Dec_Faith_Dig:"修治故墟"
 SUM_SDH_Dec_Faith_Dig_desc:"要清理一处旧遗迹便召集人手。众人带着铲子箩筐，把埋着的沙一层层扒开。挖出旧物便登记入库，不许私拿。这遗迹里的东西归公。"
 SUM_SDH_Dec_Trade_Salt:"治其盐道"
 SUM_SDH_Dec_Trade_Salt_desc:"盐路与驮道上，做买卖的人一批接一批。主母遣使去安抚众人，保证给他们安稳日子，愿意归附的都被妥善安置下来。见官府这般诚意，商户们便安心经营起来。盐路一畅通，沙地的生计也就跟着活了。"
 SUM_SDH_Dec_Trade_Toll:"置榷征商"
 SUM_SDH_Dec_Trade_Toll_desc:"盐路要口设下一道关卡。过往货驮照例抽税，一文不多，一文不少。守卡的兵士验过货单便挥手放行。商户虽出些钱，换来一路平安，也自甘愿。这税取之有道。"
 SUM_SDH_Dec_Trade_Caravan:"招来行贾"
 SUM_SDH_Dec_Trade_Caravan_desc:"远来的商队路远迢迢最怕税重，官府便减了税招徕他们。有犹疑的听说税轻便牵驼而来。这一减税，远方的货物便源源不断涌进沙地。招徕有方。"
 SUM_SDH_Dec_Trade_Well:"掘井得甘"
 SUM_SDH_Dec_Trade_Well_desc:"沙地缺水，流民无处安身，官府便在缺水之处凿井安置。井水一出，人们便围拢来，搭起帐幕，渐渐成了村落。一口井便是一处生机，流民有了着落，心上也就安了。"
 SUM_SDH_Dec_Trade_Mint:"炉冶更铸"
 SUM_SDH_Dec_Trade_Mint_desc:"沙地买卖苦无通用的钱，以物易物诸多不便，官府便开炉铸钱，沙地通用。钱铸出来商户拿着好使，人人称便。这钱一通行，买卖便活了。"
 SUM_SDH_Dec_Army_Levy:"调本部卒"
 SUM_SDH_Dec_Army_Levy_desc:"战事将起，官府便向各部征发一批部众。令一下，各部挑些精壮的，扛弓带刀到军中报到。这些部众本是牧人，如今拿起兵器倒也勇猛。到齐之后听用。"
 SUM_SDH_Dec_Army_Storm:"演风阵图"
 SUM_SDH_Dec_Army_Storm_desc:"操演兵马专挑沙暴天。风起沙飞正是练兵的好时节，兵士们在风里辨方向、结阵势，起初乱作一团，久了便稳如磐石。这沙暴战术练成，遇上真战便不怕风沙。"
 SUM_SDH_Dec_Army_Mech:"葺此机装"
 SUM_SDH_Dec_Army_Mech_desc:"从遗迹取出的构装用久了会损，官府便设下来专门修补。匠人把构装拆开，一件件擦拭上油，坏了的换，缺了的补。这构装修好又能上阵杀敌，省了许多人命。"
 SUM_SDH_Dec_Army_Fort:"增戍筑垒"
 SUM_SDH_Dec_Army_Fort_desc:"要道之上增筑戍所与望楼。戍所驻兵，望楼瞭远，一旦发现动静便放烟为号。这戍所望楼一立，商路便有了照应，盗贼也敛了迹，不敢近前。这般布置稳妥。"
 SUM_SDH_Dec_Crisis_Storm:"发廪赈风"
 SUM_SDH_Dec_Crisis_Storm_desc:"沙暴过后毁了房屋庄稼，灾民流离，官府便开仓赈济，按人口放粮。灾民领了粮搭起窝棚，渐渐安定。这仓中一粒粮能救人一命。"
 SUM_SDH_Dec_Crisis_Water:"平其水讼"
 SUM_SDH_Dec_Crisis_Water_desc:"两处绿洲为争水闹得不可开交，官府便出面调解，按人口分水，各立字据。两边起初还争，后来见分得公道也就服了。水匀开了，争端也就息了。"
 SUM_SDH_Dec_Crisis_Plague:"御疫有备"
 SUM_SDH_Dec_Crisis_Plague_desc:"医者日夜守着药炉煎药，药渣堆在墙外，苦味随风飘出半条街。疫病流行的地方，官府下令封了城，人进不得也出不得，一面又施药救治。染病的人都安置到远处的帐棚里。封锁虽严，却救了四方百姓的命。"
 SUM_SDH_Dec_Crisis_Riot:"戡定喧乱"
 SUM_SDH_Dec_Crisis_Riot_desc:"治安队巡行市井，遇有骚动便上前弹压。那闹事的起初还逞强，见治安队刀在手也就散了。这般出手干净利落。"
 SUM_Neo_SDH_Mechanism:"众械齐作"
 SUM_Neo_SDH_Mechanism_desc:"这面牌子不问事，只照实记账。花神、风暴两条轴走到哪一档，哈德拉玛维特什么等级、吃哪几条修正，列在上头。条目按不得，轴值一变牌子自己就换。抬眼一瞧便知该往哪条轴上使力。"
 SUM_Neo_SDH_T1_View:"祀典垂绝"
 SUM_Neo_SDH_T1_View_desc:"稳定度 -10%、月度人口 -20000"
