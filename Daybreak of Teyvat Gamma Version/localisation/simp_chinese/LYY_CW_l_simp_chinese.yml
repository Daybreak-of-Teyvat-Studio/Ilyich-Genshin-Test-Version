 #################### 璃月新闻 ####################
 LYY_News.9001.t:"天衡星陨，帝君归于尘土"
 LYY_News.9001.d:"璃月港的送仙典仪进行到一半，自称天权星使的旅者叩响了观海楼的门，随后是一声惊雷。往生堂的仪倌最先赶到，只说了一句：座上无人，唯余尘土。\n对璃月人而言，这是一整套用千年写成的规矩，忽然失去了执笔的人。此后千岩军按刀不语，七星闭门三日，港口的海风里，第一次飘起了没有答案的疑问。"
 LYY_News.9001.a:"阅"
 LYY_News.9002.t:"七星失序，璃月一夕三分"
 LYY_News.9002.d:"帝君遗诏语焉不详，七星谁属各执一词。玉衡、天权、月海亭三处灯火彻夜不熄，各自的告示贴上了同一面城墙。\n一场没有人宣战的战争，就这样开始了：千岩军一夜之间分作数部，各为其主；商路断在关口，渔船困在港内。璃月从没有过这样的日子，连街上的猫都学会了绕开穿甲胄的人。"
 LYY_News.9002.a:"阅"
 LYY_News.9003.t:"港口尽锁，万船不得出港"
 LYY_News.9003.d:"自岸线到灯塔，一夜间立起了层层闸门。通行令成了比黄金更抢手的东西，一个码头的泊位，抵得上半条街的铺面。\n海外的商队停在港外进退两难，本地渔户则把船拖上岸，坐在船帮上发呆。有老人说，他活了大半辈子，头一回见璃月把自己的门从里面插上。"
 LYY_News.9003.a:"阅"
 LYY_News.9004.t:"群玉阁重升，浮空之上升起新旗"
 LYY_News.9004.d:"沉默多日之后，群玉阁于夜色中重新升空，灯火照亮了半个璃月港。阁顶换上的旗帜，颜色与从前不同。\n这是一句说得极响的话：无论谁坐在那座浮空的楼里，都请全城抬头看清楚。此后数日，港内议论纷纭，有人拍手，有人收拾细软，也有人只是站在岸边，看那灯火看了一整夜。"
 LYY_News.9004.a:"阅"
 LYY_News.9005.t:"千岩军裂作数部，营中刀兵相向"
 LYY_News.9005.d:"最令人心寒的消息来自千岩军内部：同一面军旗下长大的旧部，如今分守城门的南北两端。有老兵把甲胄擦得锃亮，然后在营门外坐了一夜。\n这支曾以“不退“二字闻名的军队，第一次面对一个没有命令可以服从的清晨。有人说，璃月的内战，真正的开端不在城头，而在这一夜无声的营房。"
 LYY_News.9005.a:"阅"
 LYY_News.9006.t:"层岩巨渊外响起炮声，黑岩厂易主"
 LYY_News.9006.d:"巨渊的矿道深处传来闷响，黑岩厂的铁门在黄昏时分被撞开。矿工们缩在巷道里，听着上面的脚步换了一拨又一拨。\n这里是璃月国防的根基，也是无数人的坟场。谁握住巨渊，谁就握住了重新武装璃月的手。而对井下的人来说，这个道理他们要等到很久以后，才会有人愿意讲给他们听。"
 LYY_News.9006.a:"阅"
 LYY_News.9007.t:"北国舰队现身云来海，至冬的旗帜泊在港外"
 LYY_News.9007.d:"一支不属于璃月的舰队，在云来海下锚。桅杆上挂着灰白色的旗，甲板上站着穿厚重皮裘的人。\n他们口称“维持秩序“，实际带来的是一份等待签字的合约和一门门对准码头的舰炮。璃月的战火，从这一刻起不再只是自家的事。港口的老人摇摇头：借来的兵，请神容易送神难。"
 LYY_News.9007.a:"阅"
 LYY_News.9008.t:"绝云间闭山，云雾断绝来路"
 LYY_News.9008.d:"群峰之间升起一道看不见的墙。原本可通的山道，一日之内尽数封死，进山采药的人被客气地劝退，再往上，就只有风雪。\n云端上的仙人似乎无意插手人间纷争，却又在同时收拢了所有出入的路线。有人说是避世，有人说是蓄力。无论哪一种，璃月都少了一条可以回头的路。"
 LYY_News.9008.a:"阅"
 LYY_News.9009.t:"沉玉谷水土告急，藤篱之内粮尽"
 LYY_News.9009.d:"来自南方山谷的消息来得很迟：梯田干裂，溪流浑浊，守着山谷的人们把最后一季稻子分了又分，仍不够过冬。\n他们没有向任何一方求援，只是把谷口的藤篱扎得更紧。这片土地上的人相信，有些账不该算给外人听。可风声还是传了出来，连同他们拒绝进城的倔强，一起被记在了璃月的战报边上。"
 LYY_News.9009.a:"阅"
 LYY_News.9010.t:"难民潮涌向港口，城下立起千顶帐篷"
 LYY_News.9010.d:"内战进入第二个月，卢村、白驹、明蕴一带的百姓扶老携幼涌向港口。城墙下搭起了上千顶帐篷，炊烟比城里的还密。\n没有人愿意承认，但所有人都看得见：这场仗已经从军队的账本，翻到了百姓的饭桌上。谁先让这些人回到田里，谁就先摸到了璃月真正的分量。"
 LYY_News.9010.a:"阅"
 LYY_News.9011.t:"内战落幕，璃月重归一统"
 LYY_News.9011.d:"持续数月的战事在最后一个据点投降后结束。获胜方的旗帜从港口一直插到山道口，沿途百姓自发清扫街道，把散落的瓦砾拢成一堆。\n这不是一场可以庆祝的胜利。战场上留下的人，有敌有友；城里的空缺，也远不止一个座位。新的政府接手的第一件公事，是点清还有多少人活着，还有多少炉火没有熄灭。"
 LYY_News.9011.a:"阅"
 LYY_News.9012.t:"新政府定都，官署重开张"
 LYY_News.9012.d:"新政权的第一道告示很短：税照旧收，法照旧用，官署照常开门，天亮就办。\n这短短一句话，比任何誓词都让市井安静下来。停摆数月之后，人们最怕的是无政。一位老账房在门口站了很久，最后把自家的算盘搬回了柜台。"
 LYY_News.9012.a:"阅"
 LYY_News.9013.t:"提瓦特诸国陆续遣使，璃月重回牌桌"
 LYY_News.9013.d:"蒙德、稻妻、须弥、枫丹的使节先后抵达港口，递上措辞各异的国书。有人在信里试探，有人在信里示好，也有人只是安静地附上一份货物清单。\n璃月在内战期间几乎从提瓦特的地图上消失了数月。如今它重新回来，带着一身伤和一本清楚的账。诸国看的是它还剩多少力气，而它自己知道，真正要紧的是它打算怎么用这些力气。"
 LYY_News.9013.a:"阅"
 LYY_News.9014.t:"与至冬的合约谈成分歧：云来海撤防之争"
 LYY_News.9014.d:"关于云来海的去留，谈判桌上的气氛一天冷过一天。至冬希望保留一处常年补给口岸，新政府只肯给一张为期有限的通商许可。\n双方都清楚，这是谁在这片海上说话的次序问题。合约最终签下，但每一行字旁边，都留着一道谁都没打算填实的空。"
 LYY_News.9014.a:"阅"
 LYY_News.9015.t:"天空岛自始至终沉默，璃月抬头看不穿云层"
 LYY_News.9015.d:"数月以来，无论璃月如何改朝换代，那座悬于云端的浮空岛始终没有给出任何回应，连征兆都没有。\n璃月人早已习惯了向天理借神谕定国是。这一次，他们头一回要自己给“天命“下定义。有人因此不安，也有人因此松了口气：原来不被人看着，也是一种自由。神谕没有来，反而给了这座城一个自己开口的理由。"
 LYY_News.9015.a:"阅"
 LYY_News.9016.t:"层岩巨渊再度震颤，深渊裂隙被连夜加固"
 LYY_News.9016.d:"巨渊深处传来异响，矿道里的灯一盏盏熄灭。工人与守军连夜后撤，随后是封堵、浇铸、加固，一气呵成。\n在璃月的账本里，深渊从来是一笔要按月偿还的旧债。这场内战几乎让所有防务停摆，如今第一件补上的，就是这道谁也不敢赌的裂缝。有人在井口挂了一串风铃，说风一响，就知道下面还醒着。"
 LYY_News.9016.a:"阅"
 LYY_News.9017.t:"南十字船队启航，璃月的旗第一次驶出旧航线"
 LYY_News.9017.d:"由商船与护航舰组成的新船队离开港口，桅上的旗帜在晨光里展开。此行的目的地，是璃月商路图上从未标注过的海域。\n内战的封港把一整代人困在岸上，如今他们最想做的事，是往外走。船长说，这趟不为抢生意，只为让海上的人重新记住：璃月的船，回来了。"
 LYY_News.9017.a:"阅"
 LYY_News.9018.t:"百工重聚，旧技艺登上新告示牌"
 LYY_News.9018.d:"铁、木、船、染的手艺人陆续回到作坊。新政府没有大办庆典，只是把一张告示钉在码头：工价、工时、学徒、伤病，写在了明处。\n这不是施舍。一座城的骨头，从来长在会做东西的人身上。有人把落满灰的工具重新擦亮，说，先把该做的做出来，剩下的话，等有东西可看的时候再说。"
 LYY_News.9018.a:"阅"
 LYY_News.9019.t:"关于神之眼的议论再起，新政府给出谨慎答复"
 LYY_News.9019.d:"议会里有人提出，应对神之眼的持有者加以登记与限制；也有人反驳，说璃月的元气，一半就藏在这些人的手里。\n争论没有结果，政府最终给出的答复只有一句：既不禁，也不倚。如何与力量相处，璃月此前从未认真想过，如今它需要在没有神明的注视下，独自面对这个问题。"
 LYY_News.9019.a:"阅"
 LYY_News.9020.t:"璃月以完整之身重返提瓦特，签署新的通行公约"
 LYY_News.9020.d:"在最后一场谈判上，璃月与新结识的各方共同签署了一份通行公约，内容多而琐碎：遇险互救、船只通行、货物互认、争端共裁。\n签字那一刻没有仪仗，只有一屋子的算盘声。璃月没有留下什么豪言。它只是重新学会了另一件更难的事：在一张人人都在的长桌边坐下，用道理说话。"
 LYY_News.9020.a:"阅"

