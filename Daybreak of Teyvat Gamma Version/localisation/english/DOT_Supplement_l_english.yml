 ITA_regia_marina_dynamic_modifier:0 "Regia Marina"
 ITA_regia_marina_dynamic_modifier_desc:0 "Only by securing naval dominance in the Mediterranean can we secure the shores of Italy, but to do this we must invest heavily in modernizing the navy."
