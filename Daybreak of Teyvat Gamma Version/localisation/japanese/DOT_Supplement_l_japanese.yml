 ITA_papal_state:0 "教皇領"
 ITA_papal_state_catholic_dominion:0 "カトリック自治領"
 ITA_papal_state_catholic_dominion_desc:0 "教皇が即位し、世界列強の仲間入りを果たした今、神の御意思を実現するのが我々の役目となった。羊の群れを導く羊飼いのごとく、誠実なるキリスト教徒達を悪から守ってみせよう。"
 ITA_papal_state_catholic_dominion_puppet_discount_tt:0 "講和会議で§Y傀儡国家§!のアクションにかかる§Yコストが軽減§!される。"
 ITA_papal_state_desc:0 "新たな教皇がイタリアを統治するようになり、聖下の導きと加護を求めて大勢の人々が集まってきている。"
 ITA_papal_support:0 "教皇の支援"
 ITA_papal_support_desc:0 "教皇は今なおイタリア人に大きな影響を及ぼす人物であり、かの御方の承認と支持が得られれば、多くの人々の心や想いを我々の大義に傾かせることができるだろう。"
