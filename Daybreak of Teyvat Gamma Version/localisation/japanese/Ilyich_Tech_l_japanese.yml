 tank_designer_Ruin_Giant_equipment:"遺跡耕運機‑巨像"
 Ruin_Giant_desc:"遺跡耕運機‑巨像：「土地は農具で耕すものではない。鉄と血で奪い取るものだ。」――この理念のもと、「遺跡耕運機」は誕生した。"
 Ruin_Giant_equipment_desc:"遺跡耕運機‑巨像：「土地は農具で耕すものではない。鉄と血で奪い取るものだ。」――この理念のもと、「遺跡耕運機」は誕生した。"
 Ruin_Giant_equipment_1_desc:"遺跡耕運機‑巨像：「土地は農具で耕すものではない。鉄と血で奪い取るものだ。」――この理念のもと、「遺跡耕運機」は誕生した。"
