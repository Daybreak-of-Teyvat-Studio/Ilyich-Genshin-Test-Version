 MTG_naval_treaty_adherent_desc:0 "We have signed the London Naval Treaty and accordingly are restricted in the size of our capital ships."
 MTG_naval_treaty_adherent_reduced:0 "Escalator Clause Invoked"
 MTG_naval_treaty_adherent_reduced_desc:0 "After some signatories of the Washington Naval Treaty have abandoned the London Naval Treaty, we have invoked the Escalator Clause, reducing the restrictions for the size and armament of our capital ships."
