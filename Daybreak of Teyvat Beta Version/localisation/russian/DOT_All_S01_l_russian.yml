DOT_Emergency_Occupy:0"Временные правила"
DOT_Emergency_Occupy_desc:0"После раскола Мондштадта все ждут возвращения мира. Показав, что мы такие же мондштадтцы и обещая мир и порядок, мы можем избежать сопротивления."
DOT_Liberated_Humankind:0"Освобождение человечества"
DOT_Liberated_Humankind_desc:0"Мы освободим сознание людей, чтобы они осознали нашу общую человечность и стремились к мирному сосуществованию. На этом пути возникнут препятствия, и те, кто не поймёт наших идеалов, могут взяться за оружие."
DOT_Divide_Them:0"Разделяй и властвуй"
DOT_Divide_Them_desc:0"Наши отношения с оккупированными территориями не чисто враждебные. Среди них есть силы, готовые сотрудничать. Мы направим их на борьбу друг с другом, чтобы облегчить себе задачу."
DOT_Bloody_Suppression:0"Окончательное решение"
DOT_Bloody_Suppression_desc:0"Уговоры не заставят врага сложить оружие. Если они настаивают, мы исполним их желание."

