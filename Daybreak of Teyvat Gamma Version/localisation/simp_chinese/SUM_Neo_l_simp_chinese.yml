 SUM_SGS_WAR_Turn_Guard:"策反戍卒"
 SUM_SGS_WAR_Turn_Guard_desc:"雨林的戍卒大半是雇来的，派去的人只问一句：你替谁当兵。"
 SUM_Neo_SGS.173.t:"策反戍卒"
 SUM_Neo_SGS.173.d:"雨林的戍卒大半是雇来的，派去的人只问一句：你替谁当兵。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
