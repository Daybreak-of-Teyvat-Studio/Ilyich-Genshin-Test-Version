 SUM_Neo_SGS.107.b:"把土地归入官仓"
 SUM_SGS_RB_Agri_Together:"合耕"
 SUM_SGS_RB_Agri_Together_desc:"各城的田合在一处安排轮作，收成按工分。"
 SUM_Neo_SGS.108.t:"合耕"
 SUM_Neo_SGS.108.d:"各城的田合在一处安排轮作，收成按工分。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGS.108.a:"推举公议的执事"
 SUM_Neo_SGS.108.b:"沿用旧日的长老"
 SUM_SGS_RB_Public_Granary:"公仓"
 SUM_SGS_RB_Public_Granary_desc:"丰年收粮入公仓，荒年开仓平粜。存的不只是粮。"
 SUM_Neo_SGS.109.t:"公仓"
 SUM_Neo_SGS.109.d:"丰年收粮入公仓，荒年开仓平粜。存的不只是粮。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGS.109.a:"让花神的誓约作证"
 SUM_Neo_SGS.109.b:"让官署的法度作证"
 SUM_SGS_RB_Mutual_Aid:"共济"
 SUM_SGS_RB_Mutual_Aid_desc:"出事的商队与受灾的村子由城里出钱出粮接济。"
 SUM_Neo_SGS.110.t:"共济"
 SUM_Neo_SGS.110.d:"出事的商队与受灾的村子由城里出钱出粮接济。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGS.110.a:"与雨林互通有无"
 SUM_Neo_SGS.110.b:"与雨林划清界限"
 SUM_SGS_RB_Craft_Common:"匠户合工"
 SUM_SGS_RB_Craft_Common_desc:"铁匠与制盐的合在一处做工，工钱按件算，工具归公。"
 SUM_Neo_SGS.111.t:"匠户合工"
 SUM_Neo_SGS.111.d:"铁匠与制盐的合在一处做工，工钱按件算，工具归公。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SGS.111.a:"把土地分给部族"
 SUM_Neo_SGS.111.b:"把土地归入官仓"
 SUM_SGS_RB_Home_Guard:"乡兵"
 SUM_SGS_RB_Home_Guard_desc:"各城出丁组成乡兵，平时务农，战时集合。"
 SUM_Neo_SGS.112.t:"乡兵"
 SUM_Neo_SGS.112.d:"各城出丁组成乡兵，平时务农，战时集合。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGS.112.a:"推举公议的执事"
 SUM_Neo_SGS.112.b:"沿用旧日的长老"
 SUM_SGS_RB_Watch_Dune:"望楼"
 SUM_SGS_RB_Watch_Dune_desc:"商道旁设望楼，白天举旗夜里举火。"
 SUM_Neo_SGS.113.t:"望楼"
 SUM_Neo_SGS.113.d:"商道旁设望楼，白天举旗夜里举火。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGS.113.a:"让花神的誓约作证"
 SUM_Neo_SGS.113.b:"让官署的法度作证"
 SUM_SGS_RB_Route_Patrol:"护商队"
 SUM_SGS_RB_Route_Patrol_desc:"护商队专巡沙道，遇劫则追。"
 SUM_Neo_SGS.114.t:"护商队"
 SUM_Neo_SGS.114.d:"护商队专巡沙道，遇劫则追。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGS.114.a:"与雨林互通有无"
 SUM_Neo_SGS.114.b:"与雨林划清界限"
 SUM_SGS_RB_Peace_Hall:"治安署"
 SUM_SGS_RB_Peace_Hall_desc:"治安署由本处人充任，管的是偷抢。"
 SUM_Neo_SGS.115.t:"治安署"
 SUM_Neo_SGS.115.d:"治安署由本处人充任，管的是偷抢。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGS.115.a:"把土地分给部族"
 SUM_Neo_SGS.115.b:"把土地归入官仓"
 SUM_SGS_RB_Water_Militia:"守泉兵"
 SUM_SGS_RB_Water_Militia_desc:"水驿各设守泉的兵，守水也是守路。"
 SUM_Neo_SGS.116.t:"守泉兵"
 SUM_Neo_SGS.116.d:"水驿各设守泉的兵，守水也是守路。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGS.116.a:"推举公议的执事"
 SUM_Neo_SGS.116.b:"沿用旧日的长老"
 SUM_SGS_RB_Neutral_Pact:"中立之约"
 SUM_SGS_RB_Neutral_Pact_desc:"与四邻立约：沙丘不结盟、不驻外兵、不供粮于战。"
 SUM_Neo_SGS.117.t:"中立之约"
 SUM_Neo_SGS.117.d:"与四邻立约：沙丘不结盟、不驻外兵、不供粮于战。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGS.117.a:"让花神的誓约作证"
 SUM_Neo_SGS.117.b:"让官署的法度作证"
 SUM_SGS_RB_Trade_Treaty:"通商之约"
 SUM_SGS_RB_Trade_Treaty_desc:"与外邦通商而约，约中写清税则与护侨。"
 SUM_Neo_SGS.118.t:"通商之约"
 SUM_Neo_SGS.118.d:"与外邦通商而约，约中写清税则与护侨。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGS.118.a:"与雨林互通有无"
 SUM_Neo_SGS.118.b:"与雨林划清界限"
 SUM_SGS_RB_Border_Talk:"边界磋商"
 SUM_SGS_RB_Border_Talk_desc:"与雨林一里一里地谈地界，谈不拢就先搁着。"
 SUM_Neo_SGS.119.t:"边界磋商"
 SUM_Neo_SGS.119.d:"与雨林一里一里地谈地界，谈不拢就先搁着。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGS.119.a:"把土地分给部族"
 SUM_Neo_SGS.119.b:"把土地归入官仓"
 SUM_SGS_RB_Keep_Old:"旧例照行"
 SUM_SGS_RB_Keep_Old_desc:"矫论团的旧例能留的都留，只是多一层公议的过场。"
 SUM_Neo_SGS.120.t:"旧例照行"
 SUM_Neo_SGS.120.d:"矫论团的旧例能留的都留，只是多一层公议的过场。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGS.120.a:"推举公议的执事"
 SUM_Neo_SGS.120.b:"沿用旧日的长老"
 SUM_SGS_RB_Quiet_Grow:"守成"
 SUM_SGS_RB_Quiet_Grow_desc:"不折腾不扩张，把眼下的日子过稳。"
 SUM_Neo_SGS.121.t:"守成"
 SUM_Neo_SGS.121.d:"不折腾不扩张，把眼下的日子过稳。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGS.121.a:"让花神的誓约作证"
 SUM_Neo_SGS.121.b:"让官署的法度作证"
 SUM_SGS_RB_Scholar_Republic:"学者共和"
 SUM_SGS_RB_Scholar_Republic_desc:"沙丘腰带的城邦各自立了宪章，执事由公推，律例由共议，学馆里教的是算术与古文字。矫论团的经义落了地，成了能过日子的规矩。"
 SUM_Neo_SGS.122.t:"学者共和"
 SUM_Neo_SGS.122.d:"沙丘腰带的城邦各自立了宪章，执事由公推，律例由共议，学馆里教的是算术与古文字。矫论团的经义落了地，成了能过日子的规矩。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGS.122.a:"与雨林互通有无"
 SUM_Neo_SGS.122.b:"与雨林划清界限"
 SUM_SGS_RB_Dune_Commune:"沙丘公产"
 SUM_SGS_RB_Dune_Commune_desc:"水驿与井归了公，田合在一处轮作，收成按工分。匠户合在一处做工，工具归公。矫论团说，这正是经卷里写的那个样子。"
 SUM_Neo_SGS.123.t:"沙丘公产"
 SUM_Neo_SGS.123.d:"水驿与井归了公，田合在一处轮作，收成按工分。匠户合在一处做工，工具归公。矫论团说，这正是经卷里写的那个样子。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
