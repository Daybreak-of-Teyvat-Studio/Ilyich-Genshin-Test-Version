 SUM_Neo.33.t:"朝圣之路"
 SUM_Neo.33.d:"通往净善宫的山道上，朝圣者排成长队。教令院的门槛这几天被踩得很低，进去的人比出来的人多。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。高塔投下的影子越来越长，傍晚时就盖住了半条街。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。"
