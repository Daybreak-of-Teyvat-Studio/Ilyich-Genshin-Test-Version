 TUR_disorganised_armed_forces_1:0 "無秩序な軍隊"
 TUR_disorganised_armed_forces_10:0 "無秩序な軍隊"
 TUR_disorganised_armed_forces_10_desc:0 "トルコ軍はトルコそのもとと同じくまだ若い。我が軍が協商国とオスマン帝国への解放戦争の勝利とトルコの自由のために血の代償を払ったのだ。先の大戦で人口の4分の1を失った後では戦争への熱意は無いに等しいが、世界に再び戦争の脅威が迫っている。軍の近代化を速やかに達成するか、戦争が国境へ到達することを防ぐことしか選択肢はないだろう。"
