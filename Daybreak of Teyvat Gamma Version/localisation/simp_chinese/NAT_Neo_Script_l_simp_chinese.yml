 NAT_Springs_Petition_Idea:"流泉之众陈情"
 NAT_Springs_Petition_Idea_desc:"流泉之众陈情，乃于水声中递上。族中水轮昼夜不歇而转，陈情便卷在水轮旁竹筒内，随水声一下一下作响。焱庭使者来取陈情，立水轮边听半晌，只闻水声，不见人影。一修轮匠人自水中抬头，抹去脸上水，将竹筒递过：「在此，自取。」使者接过竹筒，展开那卷湿纸，字迹为水气洇开，却犹认得出。使者皱眉：「何故写在水边？」匠人复低头修其轮，头亦不抬：「吾等之言，与水轮同声，昼夜不歇。汝带回去，令它替吾等说。」使者将纸收入袖，转身欲走，匠人却已复潜入水，只余水轮犹吱呀而转。"
