 ITA_papal_state:0 "Papal State"
 ITA_papal_state_catholic_dominion:0 "Catholic Dominion"
 ITA_papal_state_catholic_dominion_desc:0 "With the ascension of the Papacy as a major world power, it is up to us to enact the will of God and like a shepherd that guides his flock, protect faithful Christians from evil."
 ITA_papal_state_catholic_dominion_puppet_discount_tt:0 "§YReduced cost§! for §YPuppet Country§! action in Peace Conferences."
 ITA_papal_state_desc:0 "With the Papacy reborn and in control over Italy, people are flocking to his Holiness for guidance and support."
 ITA_papal_support:0 "Papal Support"
 ITA_papal_support_desc:0 "The Pope still exerts much influence over the Italian people and with his approval and support we will be able to sway many hearts and feelings toward our cause."
