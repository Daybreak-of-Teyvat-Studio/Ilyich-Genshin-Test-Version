 NAT_Event.700.t:"§R沃陆之邦§! 宣告脱离纳塔"
 NAT_Event.700.d:"§Y提瓦特各国§! 驿报交驰，皆言火邦出一桩惊天动地之大事。丰饶之地谷场，一夜之间换了新旗。沃陆之邦老农将旗插于田埂，旗角扫过沉甸甸之果穗。税吏仍带账册来收颗粒果与火山酒，为数后生拦于埂口。老农扬手中果穗，道：「今年之果，不入焱庭之仓矣。」税吏急，拍账册于膝上，道：「此乃写入律中之旧例！」老农将果穗往怀里一拢，道：「旧例还须先问谷里祖宗。」当夜，寨中自设公堂，自募骑手，连谷场旧秤亦搬回自家寨里，秤砣搁在老农门槛下。\n\n六面新旗已竖于灰烬平原。§Y纳塔的焱庭§! 按兵不动，§R裂痕已撕开了§!，识者一见便知。老农蹲新旗下，埋一颗颗粒果于土中，以手压实，又抓把土盖上，起身望焱庭方向，解腰间旧秤绳，挂在自家门楣上。"
 NAT_Event.700.a:"兴兵复统"
 NAT_Dissent_NCE_Overture:"§Y回声之子§! · 提出自治诉求"
 NAT_Dissent_NCE_Self_Rule:"§Y回声之子§! · 撤戍自守"
 NAT_Dissent_NCE_Severance:"§Y回声之子§! · 宣告分宗"
 NAT_Event.701.t:"§R回声之子§! 宣告脱离纳塔"
 NAT_Event.701.d:"§Y提瓦特各国§! 邸报飞传，一处不漏，都说火邦生了变故。回声之子把炉子熄了三日，锤子倒扣在砧上。钟楼的执事照旧去敲那口钟，敲了三下，回声石半点回应也没有。锻主站在坡上，对着那块沉默的石头看了半晌，回顾弟子道：「替本族打刀，天经地义；替他人打，须先问此石肯不肯应。」弟子握着锤柄，不敢应，蹲下身把炉膛里的余烬铲进筐里，盖上灰。当夜，回声之子封竞技场看台，对外但言只为本族裁决决斗，不复认纳塔之荣光。\n\n灰烬平原上又多了六面旗。§Y纳塔的焱庭§! 久无一字，§R那道裂痕，撕开了§!，不待智者而知。来敲钟的人又站到坡上，攥着钟绳犹豫许久，终将手收回，转身时踢翻脚边一摞碎铁，叮当一声，在空谷荡了老远。"
 NAT_Event.701.a:"擂鼓一统"
 NAT_Dissent_NPS_Overture:"§Y流泉之众§! · 提出自治诉求"
 NAT_Dissent_NPS_Self_Rule:"§Y流泉之众§! · 撤戍自守"
 NAT_Dissent_NPS_Severance:"§Y流泉之众§! · 宣告分宗"
 NAT_Event.702.t:"§R流泉之众§! 宣告脱离纳塔"
 NAT_Event.702.d:"§Y提瓦特各国§! 商旅口口相传，不满三日，火邦改界之事传遍列国。被水冲开之界碑，一夜之间挪回旧址。流泉之众的航首站在船头，望那道新界，手攥号角，久久不吹。有族人问：「此水祖辈皆走，凭甚么说是别家？」航首将号角往腰间一别，道：「从今往后，激流之水只流经本族地界，旁人插手，先问这水轮答不答应。」当下于浅滩自筑水轮，又取贝螺与彩羽，自设一顶逐浪之冠，连出海号角亦换了调子。\n\n六面旗子已在灰烬平原插定。§Y纳塔的焱庭§! 犹自沉吟，§R裂痕撕开了§!，识时务者早看破。水轮吱呀转动，转的是自家之水，浇的亦是自家之田。航首终抬号角，对水面吹了一声，那调子陌生得紧，岸边听惯旧调之老人，皆怔在原地。"
 NAT_Event.702.a:"挥戈归统"
 NAT_Dissent_NSC_Overture:"§Y悬木人§! · 提出自治诉求"
 NAT_Dissent_NSC_Self_Rule:"§Y悬木人§! · 撤戍自守"
 NAT_Dissent_NSC_Severance:"§Y悬木人§! · 宣告分宗"
 NAT_Event.703.t:"§R悬木人§! 宣告脱离纳塔"
 NAT_Event.703.d:"§Y提瓦特各国§! 边关塘报叠至，皆道火邦林中出了新事。悬木人的树冠之上，升起了一面白旗。崖主坐在最高的枝桠上，手里攥着一段祖传的藤绳，往下望着林口。一名外来的祭司循旧例来传习古名，被两个后生拦在藤索外。祭司道：「古名乃六族共传，几时立过禁？」崖主把藤绳在腕上绕了一圈，俯身回道：「林冠之下，只由本族旧仪裁决。」当夜，悬木人收回了古名传习之柄，扬言外来祭司不得复入那片林子。\n\n灰烬平原那块空地上，如今立着六面旗。§Y纳塔的焱庭§! 未置一词，§R裂痕已然撕开§!，旁观者尽皆看破。林子里的人照旧传习着古名，只是再不许外人旁听。那面白旗在树冠上挂了许多天，风吹雨打也不去取，藤索落满败叶，亦无人来扫。"
 NAT_Event.703.a:"提兵定一"
 NAT_Dissent_NFF_Overture:"§Y花羽会§! · 提出自治诉求"
 NAT_Dissent_NFF_Self_Rule:"§Y花羽会§! · 撤戍自守"
 NAT_Dissent_NFF_Severance:"§Y花羽会§! · 宣告分宗"
 NAT_Event.704.t:"§R花羽会§! 宣告脱离纳塔"
 NAT_Event.704.d:"§Y提瓦特各国§! 飞骑传檄，列国皆知火邦的天，换了人管。高塔顶端，换上了一面白羽旗。花羽会划出自家之天，鹰主臂缠绒羽，肩上的青羽龙望着那面旗，发出一声长鸣。一名传令者举着火令上台，要调飞骑巡天，被鹰主抬手挡下。传令者曰：「此乃焱庭火令。」鹰主抚龙颈，淡淡道：「如今驯龙骑士只听本族羽冠，他人火令，调不动天上飞骑矣。」传令者张了张嘴，把那火令又卷了回去。\n\n六面新旗，风吹了数日，边角已有些磨旧。§Y纳塔的焱庭§! 尚无决断，§R裂痕早已撕开§!，有目者一眼便知。飞骑们经过旧时的火令台，再不停留，只从高空看一眼，便振翅过去。地面上的人仰头看着，谁也说不清那一眼里究竟有何物，唯那面白羽旗，在塔顶越挂越正。"
 NAT_Event.704.a:"整军复统"
 NAT_Dissent_NMN_Overture:"§Y烟谜主§! · 提出自治诉求"
 NAT_Dissent_NMN_Self_Rule:"§Y烟谜主§! · 撤戍自守"
 NAT_Dissent_NMN_Severance:"§Y烟谜主§! · 宣告分宗"
 NAT_Event.705.t:"§R烟谜主§! 宣告脱离纳塔"
 NAT_Event.705.d:"§Y提瓦特各国§! 雾里传出之消息，终亦传至列国耳中。夜风里，不复有归火圣夜之钟声。烟谜主封灵谜涂鸦之旧路，巫首以灰蓝长袍裹身，投一枚旧符纹入火盆，视其一点点卷成灰。有族人问：「往外传之老暗号，亦须一并改乎？」巫首盯火中之灰，道：「改。秘仪只在本族传承，不复外授，谁问亦莫认。」旁侧司记之学徒将那几个旧符一笔笔划去，重于布幔描新者。当夜，雾里暗号改了个遍，连焱庭最老练之探子亦无从捉摸。\n\n灰烬平原的六面旗，旗下无人看守，只插在那里。§Y纳塔的焱庭§! 隐忍不发，§R裂痕再也缝不上§!，有心人无不心照。雾仍是那片雾，只是自此，其中所藏之话，不必再讲与人听。偶传出半句，待外人回过味来，事早办完，只剩灰蓝袍角，在雾里一闪便没了。"
 NAT_Event.705.a:"勒马归统"
