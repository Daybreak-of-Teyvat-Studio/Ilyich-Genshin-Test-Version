 NAT_Canopy_Forest_Patrol_Idea:"林道自固"
 NAT_Canopy_Forest_Patrol_Idea_desc:"悬木人将守林道之差事揽于己手。二外来商人于林缘转半日，寻不着路，只得拦一采藤后生问路。后生指脚下几乎无痕之兽径，曰：「顺走，勿拐弯。」二人道谢，照行，未几又绕回原地。后生远观，亦不提醒，只低头续采其藤。后一巡林老猎户过来，将二人请出林子，边行边曰：「此林道走法，只本族认得，外人入内，绕至天黑亦出不去。」二人将信将疑。老猎户送他们至林口，指远处那条明路，自转身复钻回林中，脚步无一点声响。"
