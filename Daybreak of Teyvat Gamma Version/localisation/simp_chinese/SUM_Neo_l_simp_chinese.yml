 SUM_SDH_RC_Public_Granary_desc:"丰年收粮入公仓，荒年开仓平粜。存的不只是粮。"
 SUM_Neo_SDH.149.t:"公仓"
 SUM_Neo_SDH.149.d:"丰年收粮入公仓，荒年开仓平粜。存的不只是粮。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
