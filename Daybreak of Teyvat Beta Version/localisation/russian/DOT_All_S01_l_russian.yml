DOT_ControlProvince.7.d.generic:0"После долгой битвы в ущелье Дадаупа, Орден Рыцарей Запада захватил город Дадаупа. Ополченцы [FROM.FROM.GetAdjective] нанесли решающий удар.\n\nЖители устроили скромную встречу Ордену, полные надежды на возвращение мира."
DOT_ControlProvince.7.a:0"Это не означает поражения!"
DOT_ControlProvince.7.b:0"Земляки, хватит дарить подарки, телега не резиновая!"
DOT_ControlProvince.7.c:0"Великий поход?"
DOT_ControlProvince.7.e:0"Укрепились ли Лоуренсы в Мондштадте?"

