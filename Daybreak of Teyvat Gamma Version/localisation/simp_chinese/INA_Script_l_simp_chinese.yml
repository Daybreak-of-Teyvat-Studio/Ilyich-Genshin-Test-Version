 ################稻妻内战########

INA_Construction:0 "稻妻的建设"
INA_Construction_desc:0 "天守阁的翻新工作非常重要，离岛和影向山的重建也刻不容缓，但是只关注鸣神岛的建设是短视的行为。在沉静了数百年之后，御影炉心的工作状态又一次不稳定了起来，而这一次，我们必须亲自解决这些问题。"
INA_nuclear_fusion_status_change:0 "御影炉心状态变化"

  INA.1.t:0 "稻妻内战的宣传口径？"
  INA.1.d:0 "当初没有彻底清算掉珊瑚宫那些奥罗巴斯眷族或许是将军大人最错误的选择之一。将军大人曾经与他们的神明有过约定，将军大人仁慈的赐予了他们珊瑚宫的领土，但这些贪得无厌的家伙却不仅不感恩将军的恩德，反而染指其他的岛屿。这使得现在，“珊瑚宫反抗军”的名号在稻妻打响，好在虽然如今八酿岛已经沦陷，但反抗军的破坏使得八酿岛成为了一片废土，这或许是一个绝佳的机会。。。？"
  INA.1.1:0 "把他们的罪行宣传出去！。"
  INA.1.2:0 "我们应当强调将军大人的仁慈。"
  
  INA.2.t:0 "寻求支援"
  INA.2.d:0 "毫无疑问的一点，在幕府的统治之下，我们已经不可能独自解决掉这场叛乱了，幕府内也有许多人等着看我们的笑话。以幕府军目前虚弱的实力，我们无法与叛军抗衡。\n因此,我们不得不低下头去寻求其他的帮助。经过三奉行的深思熟虑,天领奉行认为应该向目前风头最旺的愚人众求援、勘定奉行提议寻求将军大人的智慧而社奉行则提议向鸣神大社的八重神子求援，这三者是最有可能给予我们帮助的，所以，应该向哪一方寻求帮助呢？"
  INA.2.1:0 "果然还是向将军大人请教更合适。"
  INA.2.2:0 "我们应该寻求愚人众的协助。"
  INA.2.3:0 "可能那个恶心的八重神子更好一点。"
  
  INA.3.t:0 "神社问题"
  INA.3.d:0 "毫无疑问的一点，弥漫在整个稻妻的雷霆灾难，是因为地脉之中淤积的大量雷祸迟迟没有得到化解，而这一切都是因为八重神社的八重神子玩忽职守！而现在内战已经结束，稻妻城的舆论管辖已经重归幕府，我们应该怎么做？"
  INA.3.1:0 "严惩八重神子，勒令她尽快驱散雷祸。"
  INA.3.2:0 "稍微惩罚一下社奉行，敲山震虎。"
  INA.3.3:0 "将军和神子的关系特殊，我们尽量掩盖这事。"
  
  INA.4.t:0 "奉行丑闻"
  INA.4.d:0 "近日，三奉行之间的相互攻讦已经到了无可挽回的程度，社奉行揭露了天领奉行，勘定奉行与愚人众勾结，出卖稻妻利益。天领奉行指控勘定奉行故意扰乱市场，敲诈商人致使后勤崩溃，物价飞涨，同时指控社奉行暗中训练私军勾结叛党，意图以下犯上。勘定奉行展示了查获的叛军书信，社奉行暗中勾结叛军，出卖情报给叛党，同时谴责天领奉行阻断其他奉行的上书途径，蒙蔽将军。"
  INA.4.1:0 "严惩三奉行，将三奉行抄家下狱！"
  INA.4.2:0 "天领，勘定奉行家主退位，并罚奉三年，社奉行罚奉三年！。"
  INA.4.3:0 "让三奉行向全稻妻民众致歉谢罪。"
    
  INA.5.t:0 "锁国令与眼狩令"
  INA.5.d:0 "眼狩令夺去了臣民的愿望，锁国令隔绝了世界的变迁。此身所求的「静止乐土」，终究让稻妻化作了无生机的枯庭。\n可若解除禁令——\n那些因神之眼失控引发的灾难会否重演？\n异邦的浪潮会否再次冲垮鸣神根基？\n而此身...会否再度失去珍视之物？\n"
  INA.5.1:0 "万般过错，在吾一身，废除锁国，眼狩令！"
  INA.5.2:0 "奉行必须严惩，废除眼狩令！。"
  INA.5.3:0 "锁国与永恒无益，废除锁国令。"
  INA.5.4:0 "万世不易，即便付出代价，我们也必须坚持眼狩与锁国令！"
  
  INA.6.t:0 "行政权力"
  INA.6.d:0 "现在我们处理完了内部的问题，但一个国家还得依靠官员们来治理，我们还是需要大量的官僚来完成稻妻的振兴。"
  INA.6.1:0 "让三奉行来吧，毕竟他们精通于此。"
  INA.6.2:0 "还是让山上的八重神子来辅助吧。"
  INA.6.3:0 "我们可以选拔民间那些聪明而又忠诚的人。"
  INA.6.4:0 "将军大人将亲自处理一切问题！"
  
  INA.7.t:0 "反抗军的覆灭"
  INA.7.d:0 "随着珊瑚宫的沦陷，反抗军领袖珊瑚宫心海的被俘，整个反抗军已经失去了斗志，集体向幕府投降。"
  INA.7.1:0 "这场叛乱终究被粉碎了"

  INA.8.t:0 "征服鹤观"
  INA.8.d:0 "在珊瑚宫的南方，被迷雾所笼罩的地方，那里是旧时被放弃的鹤观岛，然而如今，稻妻的土地上，人满为患，我们需要重新开辟鹤观岛。肃清上面盘踞的魔物！"
  INA.8.1:0 "花费太大了，算了吧"
  INA.8.2:0 "以剑开疆！"
  
  INA.9.t:0 "收复清濑"
  INA.9.d:0 "在鸣神岛的南方，被雷暴所笼罩的地方，那里是被清濑巫女的自私所毁灭的清籁岛。然而如今，稻妻的土地上，人满为患，我们需要重新开辟清籁岛。肃清上面盘踞的魔物！"
  INA.9.1:0 "那片废弃的土地不值得大动干戈"
  INA.9.2:0 "收复旧土，义不容辞"
  
  INA.10.t:0 "战争的结束"
  INA.10.d:0 "随着战争的结束，我们终于有时间，也有能力去肃清在战争之中暴露出的众多问题了，为了解决这些问题，九条大人，神里家主，还有佟家主，一并上书请御建鸣神主尊大御所大人出面，而出乎意料的是，影向山上的八重宫司大人，竟然也参与了进来。"
  INA.10.1:0 "和平万岁！！"
  
  INA.11.t:0 "顽石计划"
  INA.11.d:0 "现在，我们终于等来了向璃月复仇的时机，我们通过外交渠道，向璃月港递交了一份调查报告，以及从珊瑚宫中收集到的，璃月港七星之首凝光，如何通过北斗舰队挑动珊瑚宫乱党叛乱的证据，显然凝光并不打算束手就擒，所以，我们启动了计划许久的顽石计划，这将在一定时间内，让我们取得优势。"
  INA.11.1:0 "璃月的顽石终将在雷霆之下，化为尘土！"
  
  INA.12.t:0 "雪崩计划"
  INA.12.d:0 "向干涉我们内政的至冬愚人众复仇的时机已然到来，我们将向至冬的外交使者递交宣战书，而我们的盟友也将一并向至冬宣战。"
  INA.12.1:0 "至冬千年不化的冰雪，将在复仇的雷霆面前土崩瓦解！"
  
  INA.13.t:0 "肃清阻碍"
  INA.13.d:0 "深渊，若不是深渊，就不会有黑潮，若不是黑潮，双子中的另一位，那些值得依托的眷族，就不会死伤殆尽，而今，是时候，向深渊举起复仇之剑，肃清这盘踞了数百年的梦魇了！！！"
  INA.13.1:0 "现在，是清算一切的时候！"
  
  INA.14.t:0 "山崩地裂"
  INA.14.d:0 "与天理维系者的见面，为我们提供了许多的重要信息，其中就包括岩之国与至冬的地下交易，可惜了，即使是重璋磐岩也抵挡不了时岁的磨损，岩之神居然与冰之神勾结，意图反叛天理。这是绝对无法容忍的事实，既然他已经背叛，那就只能请他去天空岛喝茶了，反正他化名之后，天天喝茶，不过是换一个地方罢了。"
  INA.14.1:0 "唯有永恒，最近天理！"
  
  INA.15.t:0 "狂风止息"
  INA.15.d:0 "维系者给我们提供了一份特别的情报，蒙德，风的国度，暗藏着通往天空岛的登神长阶，而风之神无所事事，怠懒行政不居于神位已经多年，这是将天空岛的安危系于悬崖之上，虽说自由是蒙德的信念，但这自由，自由得太过头了！！为此，我们必须接手蒙德，维护天空岛的尊严与安全。"
  INA.15.1:0 "狂风！臣服于我！"
  
  INA.16.t:0 "天理折枝"
  INA.16.d:0 "在将岩之神请回天空岛喝茶之后，我们从时空执政那里得到一个令人愤怒的消息，如今的草之神并不是那个从上古时期传承至今的草之神，而仅仅是五百年前，前任草之神留下的备份，这个新生的草之神不但没有尽忠职守，做好世界树的看护工作，甚至滥用职权，放任了一个伪神去修改世界树，还试图染指关于天理的知识，身为知识的看护者，却对历史毫无尊重，正是因此天理下达了她们的命令，而我们将代行神旨，将渎职的草之神，抓捕归案，交由天空岛处理。"
  INA.16.1:0 "亵渎者！做好觉悟吧！"
  
  INA.17.t:0 "流水不腐"
  INA.17.d:0 "在将岩之神请回天空岛喝茶之后，我们从时空执政那里得到一个令人意外的消息，水之国的神明，是一个将正义与审判当做儿戏的神明，这样的渎职是天空岛所不能容忍的，为此，我们不得不向枫丹提交战书。"
  INA.17.1:0 "贯彻天理的意志！"
  
  INA.18.t:0 "薪火不灭"
  INA.18.d:0 "纳塔邦，火之国，天空岛的执政们给我们传递了一个令人悲伤而愤怒的消息，在火之国正发生着极其不尊重人权的灾难，为了阻止这些人间惨剧的继续，我们必须捍卫和平。"
  INA.18.1:0 "和平使者！"
  
  INA.19.t:0 "冰消雪融"
  INA.19.d:0 "当深渊覆灭时，我们没有出手，因为至冬原本就与深渊为敌。当风与岩的国度覆灭时，我们没有出手，因为他们虽然与我们合作，但却让愚人众吃尽了苦头。当草与水火的国度覆灭时，我们没有出手，因为他们没有与我们合作。现在天理与稻妻向我们奔来，而我们已经没有任何可以寻求帮助的盟友了。"
  INA.19.1:0 "这就是背叛天理的代价！"
  
  INA.20.t:0 "直到时空的尽头"
  INA.20.d:0 "现在，一切内外的可能叛乱因素都已经覆灭，任何胆敢反抗天理的敌人都将在提瓦特监视者的面前颤抖，而我们也赢得了我们应得的报酬，绝对的永恒不变，真正的万世不移，从此，稻妻将恪守永恒之理，直到时间与空间的尽头。"
  INA.20.1:0 "常道恢宏，鸣神永恒！"
  
  INA.21.t:0 "罪与罚"
  INA.21.d:0 "对于这些掌握了无数人的经济命脉，甚至是生杀大权的璃月高层，九条裟罗大人提出了一个充满了创意，而又符合实际的处罚方式，那就是搬光他们的全部财产。/n 于是一周后，被我们架起来的天权星凝光，眼睁睁的看着我们拆走了玉京台最后一块地砖，从房屋摆设，到房屋本身，甚至包括玉京台的地砖，我们一块瓦片都没有给她留下，她所有的产业，无论是工厂，还是饭店，甚至包括农田的土壤，我们也挂地三尺全部带走了，当然还有她那个飞翔在天空中的群玉阁，上面一切都已经被我们拆装好，作为一个巨大的运输船停靠在港口内，而她的爪牙北斗，则一并目睹了我们是如何夺走她整个舰队的，不仅如此，我们还搬光了北斗用于建设船只而阴干的木料，以及北斗所拥有的一切产业，士兵们都很守规矩，毕竟能抢璃月首富的话，谁会去抢小鱼小虾呢？这些木料和石料会在接下来的建筑作业中起到作用的，现在满载而归的舰队，要将这些财富放在哪里呢？"
  INA.21.1:0 "出发，目标，九条大营！"
  INA.22.1:0 "出发，目标，影向山！"
  
  INA.22.t:0 "傲慢的惩罚"
  INA.22.d:0 "现在，至冬宫在我们的手中了，对于这些傲慢无比的愚人众，九条裟罗大人提出了一个充满了创意，而又符合实际的处罚方式，那就是搬光他们的全部财产。/n 于是同样的，拆解工作进行了一周，我们拿走了至冬宫内一切能搬走的贵重物品，然后敞开了至冬宫的大门，让他们自己的民众进行狂欢三日，说来有趣，那些市民们甚至拆毁了至冬宫的木料用于取暖，而这一切，都是当着傲慢的冰之神，以及她的愚人众执行官的面进行的，我们彻底摧毁了他们的骄傲，现在是时候带着我们的战利品返乡了，把这些机器还有财富放置在哪比较好呢？"
  INA.22.1:0 "珊瑚宫的人出力不少，就放在珊瑚宫吧。"
  INA.22.1:0 "神里家族忠心耿耿，就放在神里家吧"
  
  
  INA.23.t:0 "重启社奉行"
  INA.23.d:0 "社奉行的神里家族因为在内战中与珊瑚宫叛党勾结而被废去了社奉行的主管权，神里兄妹也被软禁了起来，但他们与叛军方面的联系，其背后的指使者正是神子大人，既然神子大人永远不会背叛将军，那么听命于神子大人的神里兄妹，自然也不会背叛将军大人，因此神子大人动用了她的权力，为神里兄妹平反，重新启用神里绫人主管社奉行。"
  INA.23.1:0 "能再度为将军大人效力，是绫人的荣幸。"
  
  INA.24.t:0 "白鹭霜华"
  INA.24.d:0 "社奉行的神里家族因为在内战中与珊瑚宫叛党勾结而被废去了社奉行的主管权，神里兄妹也被软禁了起来，与她的兄长不同，绫华并没有被软禁于家中，而是被神子大人掳去神社，强行逼迫她穿巫女服，做女红。而随着绫人得到解放，神子大人也似乎玩腻了，绫华得以从八重大社重返木漏茶室。"
  INA.24.1:0 "我还挺想看看她穿巫女服的模样。"
    
  INA.25.t:0 "名侦探平藏"
  INA.25.d:0 "天领奉行的鹿野院平藏在内战中并没有与九条家族的龌龊事扯上关系，而在战争结束时，他在调查愚人众以及珊瑚宫乱党背后的势力时，出力甚多，九条裟罗大人极力推荐他作为我们新情报部门的反间谍主管。"
  INA.25.1:0 "无论谜团有多厚，事件的真相只有一个。"
  
  INA.26.t:0 "密探早柚"
  INA.26.d:0 "隶属于终末番部队的早柚，据神里绫人和八重宫司大人评价，是一个相当具有天赋的忍者，虽然她贪玩耍滑，还贪睡，但总是能顺利的完成任务，加上她的体型较小，可以轻易的潜入如通风管道之类的建筑管廊系统，看管她的神社巫女认为，早柚是一个值得信任的特工。"
  INA.26.1:0 "天下没有不透风的墙。"
  
  INA.27.t:0 "夏祭盛典"
  INA.27.d:0 "夏祭盛典一直是稻妻最为重要的夏日活动，但先前的战争严重影响了这一活动，而如今，我们重建了整个稻妻经济，而一场最为震撼最为美妙的夏日盛典，就此拉开帷幕，但即使是这样美艳的夏日盛典，我们去询问人们，什么是鸣神岛的夏日象征时，他们的回答也依然是那个名字。"
  INA.27.1:0 "盛夏日最美的象征。"
  
  INA.28.t:0 "薄荷屋迁居开业"
  INA.28.d:0 "随着整个稻妻的经济活力被重新释放，物流的需求水涨船高，而旧有的薄荷屋已经不能满足物流的需求了，在完成了乔迁与扩建之后，全新的薄荷屋重新开门营业。"
  INA.28.1:0 "请使用薄荷屋物流。"

  INA.29.t:0 "宫司大人即将参与新幕府"
  INA.29.d:0 "看看如今的稻妻——天领奉行那群武夫只会挥刀，勘定奉行拨算盘的手都生锈了。\n唯有八重宫司大人，兼具美貌与智慧，治世奇才，鸣神大社的香火钱能养活半个离岛，随手创建的八重堂更让国库流油\n她懂将军敌人的心思，通黎民百姓的苦乐，就连珊瑚宫的反贼都因八重大人而臣服。\n若问谁能带着稻妻走向新时代，只有我们「兼具智慧与美貌的八重宫司大人」！\n"
  INA.29.1:0 "八重神子大人聪明绝顶！八重神子大人沉鱼落雁！！八重神子大人举世无双！！！"

  INA.30.t:0 "祈神之舞"
  INA.30.d:0 "《八重堂特讯·号外》——「千年一遇！八重宫司大人祈神大祭圆满成功！」\n在万众瞩目下，八重宫司大人于今日主持了稻妻有史以来最盛大的祈神祭祀。而后随着八重大人祭祀之舞的舞动，困扰稻妻许久的雷祸竟然尽数消散，地脉之中淤积的腐朽之气也尽数散去。\n而退去雷祸的土地重新焕发新生。"
  INA.30.1:0 "神子大人英明神武！"

  INA.31.t:0 "将军大人？？！"
  INA.31.d:0 "《八重堂特讯·号外》——「八重宫司大人坐镇天守阁」\n在万众瞩目下，八重宫司大人于今日抵达了天守阁，并主持了新一任幕府的组建工作。随着八重大人，不，现在应该是八重将军，与其麾下的巫女进驻，稻妻幕府焕然一新。\n 天领奉行那帮莽夫终于学会用算盘了\n 离岛商人集体放烟花庆祝八重大人的新方案\n 连三奉行的文书都开始用八重堂最新款的粉色印花纸了——「工作效率提升300%！」\n至于将军大人？「在鸣神大社当巫女体验生活呢」——宫司大人亲口说的，还能有假？。"
  INA.31.1:0 "八重将军大人！"

  INA.32.t:0 "刹那亦是永恒"
  INA.32.d:0 "人们的牺牲曾让我无比痛苦，以至于忽略了他们燃尽一切绽放的光芒。\n曾以为唯有万世不易，许万千臣民永世不变之梦，方能守护此间万物。以至于，在这几百年间，我辜负了他们的意志。\n 以短暂的生命铸剑锻刀，以微末的身躯守护家国，斯人已逝，然薪火不灭，传承永存...此般执着，不也一种永恒。\n 「失去」依然可畏，但「传承」更值得珍视。\n这本是稻妻的雷电化身应行之事。\n 此身当以手中雷霆...\n 穷尽因果...\n 为诸位铺成所行永恒之路！"
  INA.32.1:0 "于片刻之中索取长生。"

  INA.33.t:0 "与过去自我之断绝"
  INA.33.d:0 "那过去的自我，用此世最为尊贵殊荣之身制成的另外半身\n 对于我此时此刻的想法，必然是无法认同的吧。\n 我那过去错误执念凝聚而成的半身，「永恒」的不可撼动之基石。\n 如今也变成了我不得不越过的高墙。\n 过去的我，是万世不易的法则，是「永恒」的守护者\n 而如今的我是许臣民一梦的「雷电影」！"
  INA.33.1:0 "用「现在」改写「过去」！"
  
  INA.34.t:0 "吵闹的白色鬼族"
  INA.34.d:0 "一个白色的高大鬼族叉腰站在征兵登记台前，鬼角差点戳穿棚顶\n 哈哈哈！天领奉行的小子们，你们给本大爷好好听着——本大爷是来应征的，以本大爷的实力你们居然敢不给本大爷封大将！？九条天狗你们知道吗？她只配我当副官！\n 他一把扯开衣襟，露出画满涂鸦的肌肉：瞧见没？这胸肌能弹开雷箭！这臂力能举起离岛！快把最厉害的军队交给本...哎哟，疼疼疼，轻点，轻点~\n 一个绿发的少女揪着鬼族的耳朵往后退：抱歉，他昨晚吃了毒蘑菇\n 阿忍？！等等...本大爷才没说胡...疼疼疼！轻点，轻点。\n 您继续登记。 绿发少女一边道歉，一边拽着鬼族的耳朵往后退，我们荒泷派先处理点内部叛乱。"
  INA.34.1:0 "要不然给久歧忍递根狼牙棒吧！"

  INA.35.t:0 "永恒之敌"
  INA.35.d:0 "那现在的自我，为逃避磨损而分离的我灵魂之半身。\n 在经历了如此之多的惨痛经历之后，终究还是磨损，走向了错误的道路。\n 我那因为磨损错误执念凝聚而成的半身，成为了「永恒」最为顽固的敌人。\n 如今也变成了我不得不击败的对手。\n 我，是万世不易的法则，是「永恒」的守护者\n 历经悲愤，化身「修罗」！"
  INA.35.1:0 "用「永恒」修正「磨损」！"

  ############
  SAN.1.t:0 "时代的落慕？"
  SAN.1.d:0 "毫无疑问，珊瑚宫并非一开始就是稻妻的土著居民。\n 自从奥罗巴斯大蛇被雷电将军斩下头颅，海祈岛居民已经向雷电将军臣服了数千年了，但反抗的心却从未沉寂过。\n 随着天领奉行推动眼狩令与锁国令，神鸣岛的政治局势越发动荡。这或许是一个绝佳的机会。。。？"
  SAN.1.1:0 "我们不能冒这个险。"
  SAN.1.2:0 "千载难逢的机会。"
  
   INA_war_publicity:0 "战争的宣传"
 INA_war_publicity_desc:0 "为了赢得这场战争，我们必须对内进行宣传鼓舞我们的民众，勇敢的与叛党作战。"
 INA_callforhelp:0 " 寻求援助"
 INA_callforhelp_desc:0 "为了赢下这场内战，仅仅依靠幕府现在的力量，恐怕是非常困难的，为此我们需要寻找其他援军。"
 INA_army_reform:0 "军事改革"
 INA_army_reform_desc:0 "我们的军队内部有太多腐败和不堪一用的废物了，虽然他们之中绝大多数都是酒囊饭袋，但只要仔细筛查，还是能找出可堪一用的人的"
 INA_main_support:0 "御前军事会"
 INA_main_support_desc:0 "一个不幸的问题是，在我们的严格筛查下，除去九条裟罗之外，居然找不到其他可以完美指挥一支军队的人才，九条裟罗建议我们重开御前军事会，以便重整乱局。"
 INA_military_theory:0 "前线经验总结"
 INA_military_theory_desc:0 "我们没有那么多时间去进行理论思考然后慢慢验证军事理论了，但只要我们多总结前线的失败经验和胜利经验，现实就是最好的导师。"
 INA_clear_pirate:0 "清剿海寇"
 INA_clear_pirate_desc:0 "内战导致了大量的渔民和商人摇身一变变成了海贼，他们肆无忌惮的侵害我们的沿海地区，甚至偷袭我们的后勤船队，这严重危害了我们的经济，更是我们胜利的阻碍，我们必须剿灭他们，杀一儆百。"
 INA_pirate_support:0 "诏安海寇"
 INA_pirate_support_desc:0 "内战导致了大量的渔民和商人摇身一变变成了海贼，他们肆无忌惮的侵害我们的沿海地区，甚至偷袭我们的后勤船队，但我们前线急缺兵力，我们可以诏安他们，然后用这些海贼去进攻叛军。"
 INA_theory_pirate:0 "海贼的经验"
 INA_theory_pirate_desc:0 "这些被诏安的海盗，效果比我们预想的更好，他们不但愿意为将军大人而战，而且还分享了许多海上作战的经验。"
 INA_pirate_license:0 "私掠许可"
 INA_pirate_license_desc:0 "为了赢下这场内战，我们可以合法化海盗们的私掠行为，给他们发放私掠许可证，鼓励他们去袭击叛军的商队和后勤。"
 INA_emergency_mobilization:0 "紧急动员"
 INA_emergency_mobilization_desc:0 "国家正处于危难之时，我们必须立刻开始动员。"
 INA_weapons:0 "武器征调"
 INA_weapons_desc:0 "为了获得胜利，一切武器都是必要的，我们必须尽快获得更多的装备。"
 INA_military_factory:0 "紧急军事工业"
 INA_military_factory_desc:0 "我们成功的邀请到了一些军火商，他们愿意在稻妻投资军工企业"
 INA_manpower:0 "征召士兵"
 INA_manpower_desc:0 "我们的常备部队完全不足，必须紧急动员更多的士兵。"
 INA_recall_veterans:0 "召回老兵"
 INA_recall_veterans_desc:0"我们的战事十分紧急，我们必须立刻召回那些曾经参加过战争的老兵"
 INA_teachporject:0 "稻妻科研所"
 INA_teachporject_desc:0 "显然，我们在漫长的锁国令中已经严重的落后于时代了，我们必须投入更多的资源用于研究。"
 INA_sangonomiyaproblem:0 "珊瑚宫问题"
 INA_sangonomiyaproblemt_desc:0 "珊瑚宫的叛乱已经被扑灭，现在是时候处理他们的首领了"
 INA_thekokomi:0"心海问题"
 INA_thegorou:0"五郎问题"
 INA_qinglai:0 "清籁问题"
 INA_qinglai_desc:0 "在幕府的南方，那是终年被雷暴封锁的清籁岛，那里曾经是一个人间仙境，因为清籁巫女的背叛，灾难席卷了清籁岛，那里现在充斥着魔物和海盗，我们或许可以重新将它开发。以增强我们的国力。"
 INA_heguanconquest:0 "征服鹤观"
 INA_heguanconquest_desc:0 "现在，鹤观岛已经完全服从于我们，是时候让它回归幕府的统治了" 
 INA_heguan:0 "鹤观问题"
 INA_heguan_desc:0 "在珊瑚宫的南方，那是一片终年被云雾环绕的鹤观岛，那里现在已经为魔物所盘踞，我们应该抢在珊瑚宫之前，将其夺下，以加大我们的优势。"
 INA_qinglaiconquest:0 "征服清濑"
 INA_qinglaiconquest_desc:0 "现在，清濑岛上的敌人已经被完全清扫，是时候重新建立统治了" 
  ##通用线
 INA_politcal:0"稻妻权力斗争"
 INA_politcal_desc:0 "雷电将军的永恒之下，三奉行漫长，而永无止境的斗争，这就是我们糟糕的幕府以及三奉行。"
 INA_principles_of_the_people:0 "神赋人权"
 INA_principles_of_the_people_desc:0 "将军大人垂赐的一切，皆是涤荡凡俗妄念的雷霆恩典。神之眼？那本就是祂暂借人类的荣光！\n 质疑者，当跪伏于「无想的一刀」之下，用血肉领受何为真正的「人权」"
 INA_executive_yuan:0 "御前训政院"
 INA_executive_yuan_desc:0 "唯有永恒的秩序，方能承载神明的伟业！为进一步让将军大人的威光普照稻妻，然凡人之手终究孱弱。\n 故增设「御前训政院」——此非僭越，而是代行神意！"
 INA_expand_the_academica_sinica:0 "扩展科学院。"
 INA_expand_the_academica_sinica_desc:0 "正是要借机关算尽的人力、锻千手百目的器械，方能将将军大人的「永恒」推演至完美之境。\n科研？那不过是凡人匍匐着触碰雷霆的谦卑尝试！\n待到御建鸣神主尊的威光浸透每一寸齿轮，尔等自会明白：所谓进步，不过是更虔诚的臣服。"
 INA_industrial_planning:0 "工业规划"
 INA_industrial_planning_desc:0 "凡人的微光不足将军大人的万分之一，将军大人亲自规划的千手百目工业体系，必将让稻妻的荣光如雷暴般席卷提瓦特" 
 INA_rural_reconstruction_movement:0 "合成树脂"
 INA_rural_reconstruction_movement_desc:0 "将军大人降下御旨：自凝聚树脂中萃取神机，实为稻妻永恒伟业之要务！天领奉行将设「白玉司」，专司此雷霆凝聚月色琼浆。"
 INA_invest_in_the_metropole:0 "地价税"
 INA_invest_in_the_metropole_desc:0 "幕府颁行《万町均税令》，革除旧弊，废「检地苛法」，以三十年丰歉均算税基，使农人不再因天灾流离"
 INA_war_end:0 "局势稳定"
 INA_war_end_desc:0 "内战烽烟已熄，然奉行蛀蚀永恒之罪，仍需清算。此身亲见稻妻根基，已被蝼蚁蚀空。\n 今以「雷电」为秤\n 凡贪墨者——殛为齑粉\n 凡欺民者——斩作飞灰\n 凡渎神者——永镇无间。"
 INA_war_win:0 "局势终结"
 INA_war_win_desc:0 "逆党叛旗已断，海祇愚梦当醒。\n逆臣伏诛，然稻妻的污浊仍未涤净——天领奉行借战敛财，勘定奉行通敌牟利，社奉行首鼠两端。尔等蛀蚀永恒之罪，较之叛逆更为可诛\n海祇的血浪既平，此刻...该轮到鸣神的雷霆清洗自己的殿堂了 "
 INA_war_time:0 "局势转变"
 INA_war_time_desc:0 "动乱之世已平，然三奉行蠹蚀永恒之罪，不可再纵。\n 凡战时渎职者——削其爵，没其产\n 凡贪墨军资者——缚于天守阁前，受万民唾弃\n 凡动摇国本者——永世不得踏入鸣神国土半步\n 战局既稳，此身便要以神罚之雷...\n 肃清永恒净土\n"
 INA_academy:0 "稻妻科学院"
 INA_academy_desc:0 "科研所在科技中证明了自己的重要性，为了保持我们的优势，我们应该投入更多资源用于科研。"
 INA_mikoproblem:0 "神社问题"
 INA_mikoproblem_desc:0 "在结束了漫长的内战之后，我们意识到了稻妻内雷祸的堆积量已经到了无法忍受的程度，而这都要拜玩忽职守的八重宫司所赐。"
 INA_fenxingproblem:0 "奉行丑闻"
 INA_fenxingproblem_desc:0 "在结束了漫长的内战之后，三奉行的腐败已从暗流演变成动摇「永恒」根基的危机。\n 天领奉行的军备贪腐、勘定奉行的走私网络、社奉行的情报操控\n ——这些丑闻正在天领奉行的朱印账册上留下无法忽视的污点。。"
 INA_historicalproblem:0 "眼狩锁国"
 INA_historicalproblem_desc:0 "随着内战的结束，锁国令与眼狩令的主要支持者与推动者天领奉行家主被将军大人撤换。\n随着天领奉行被调查，废除眼狩令和锁国令的机会已经出现了？\n（这是唯一解除眼狩令与锁国令的机会了）"
 INA_governpower:0 "行政权力"
 INA_governpower_desc:0 "我们已经处理了内部的问题，接下来，应该把行政的权力交给谁？"
 INA_militarygovernment_tt:0 "将军威严小于-2"
 INA_militarygovernment:0 "九条代行"
 INA_militarygovernment_desc:0 "幕府的权威尽丧，我们不得不依靠在军中有极高威望的九条裟罗大人。"
 INA_normagovernment:0 "刹那永恒"
 INA_normagovernment_tt:"不倾向于任一方"
 INA_normagovernment_desc:0 "曾以为唯有冻结时光，方能守护此间万物。而今方知——凡人虽如朝露，却以薪火相传。雷光不过刹那，却是最近永恒。"
 INA_extragovernment:0 "鸣神永恒"
 INA_extragovernment_tt:0 "将军威严大于2"
 INA_extragovernment_desc:0 "将军大人将以极高的威望和雷霆手段，肃清一切内外之敌。"


 ######八重线
 INA_yaegovernment:0 "宫司参政"
 INA_yaegovernment_tt:0 "以神子立场做出选择"
 INA_yaegovernment2_tt:0 "将军威严小于2"
 INA_yaegovernment_desc:0 "将军大人太过宠溺八重宫司大人了，怎么可以将幕府的统治权也交给了八重宫司大人呢？\n ————幕府小吏。"
 INA_danceforgod:0 "祈神之舞"
 INA_danceforgod_desc:0 "为了驱逐在稻妻肆虐的雷祸，八重宫司大人决定举行一场最为隆重的神樱大拔。"
 INA_yaegetgovern:0 "将军的位子"
 INA_yaegetgovern_desc:0 "我们从没料想到，将军大人对八重大人的宠爱竟然达到了这种地步，以至于在八重大人对将军大人进行了一些撒娇后，将军大人竟然真的把将军的位子也交给了八重神子大人。"
 INA_foxgovernment:0 "八重稻妻"
 INA_foxgovernment_desc:0 "八重大人对幕府内存的低效问题很不满意，所以决定对我们的旧政府进行一次大换血。"
 INA_enlargepublic:0 "扩建八重堂"
 INA_enlargepublic_desc:0 "八重堂原本就是稻妻最大的出版商，但现在对于八重大人来说，仅仅作为出版商的八重堂已经远远不够了，所以我们将扩建八重堂，扩大它的职责范围。"
 INA_reuseshefengxi:0 "重启社奉行"
 INA_reuseshefengxi_desc:0 "社奉行作为八重神子的直接下属机构，在过去因为奉神子的命令与反抗军接触。而在三奉行的整顿中，神里兄妹因此免职在家，现在是时候重新启用他们了"
 INA_enlardiplomacy:0 "神子的外交手腕"
 INA_enlardiplomacy_desc:0 "处理了内部问题之后，八重神子大人开始着手于提瓦特之上的外交。" 
 INA_diplomacyformot:0 "访问蒙德"
 INA_diplomacyformot_desc:0 "蒙德，风车与酒的国度，他们的粮食产量已经多到可以随意拿去酿酒了，而眼下我们确实是需要大量的粮食来修复我们的战争创伤。" 
 INA_agriculturalcooperation:0 "农业进口"
 INA_agriculturalcooperation_desc:0 "为了达成这一笔农业协议，我们提出了一个相当优渥的交易协议。" 
 INA_alliedmot:0 "风雷同盟"
 INA_alliedmot_desc:0 "与蒙德的外交进展喜人，加上我们对于至冬如今越发咄咄逼人的局势感到不安，一份针对至冬的同盟协议似乎是互利双赢的选择，它将让我们互相保证对方的独立。" 
 INA_alliedair:0 "天空同盟"
 INA_alliedair_desc:0 "与蒙德的深入交流让我们得以在空军装备研究上取得重大突破。狂风与怒雷的联合，翱翔天空，敌人将匍匐于我们的脚下。" 
 INA_diplomacyforlyy:0 "璃月外交"
 INA_diplomacyforlyy_desc:0 "毕竟是搬不走的邻居，尽管我们之前与璃月之间发生了不少冲突，但还是应该尝试与他们修复关系" 
 INA_memorandumforlyy:0 "璃月备忘录"
 INA_memorandumforlyy_desc:0 "神子大人在璃月的外交访问很顺利，双方现在开始互相清算过去的旧账，这也是关系正常化的前提。" 
 INA_reconciledwithlyy:0 "与璃月和解"
 INA_reconciledwithlyy_desc:0 "在充分的交谈之后，双方就补偿问题充分交换了意见，会谈是有益的，增进了双方的了解。" 
 INA_alliedmine:0 "煤钢同盟"
 INA_alliedmine_desc:0 "对于踏鞴砂的工业心脏来说，如果我们与璃月签订了一份外贸备忘录，以更低的关税进口璃月的矿石，对双方来说都是有益的" 
 INA_introducemine:0 "八重矿建公司"
 INA_introducemine_desc:0 "显然，虽然我们在宣传上解决了许多问题，但璃月港的投资终究是需要一个马甲的，由神子大人直辖的一家全新公司看起来就是一个不错的选择。" 
 INA_diplomacyforsnow:0 "至冬外交"
 INA_diplomacyforsnow_desc:0 "至冬的愚人众，他们在我们的内战之中，出力甚多，但愚人众毕竟是当今最为强大的势力，我们与他们之间依然可以通过外交来解决问题。" 
 INA_milcooperation:0 "军事合作"
 INA_milcooperation_desc:0 "愚人众在军事方面的技术发展水平远超其他国家，我们可以借此与他们展开一些合作，互相表示诚意。" 
 INA_reconciledwithsnow:0 "与至冬和解"
 INA_reconciledwithsnow_desc:0 "在充分的交谈之后，双方就补偿问题充分交换了意见，会谈是有益的，增进了双方的了解。" 
 INA_alliedarms:0 "装甲联盟"
 INA_alliedarms_desc:0 "与至冬的和解对我们的装甲研究是一个巨大的突破，而稻妻特有的锻造技术，对于愚人众的装甲升级也是一种巨大的提升，一个关于装甲军团研究联盟的提议也将成为可能。" 
 INA_diplomacyforsum:0 "须弥外交"
 INA_diplomacyforsum_desc:0 "须弥离稻妻并不遥远，只需要一段海路就足够链接稻妻与须弥，而双方不存在利益冲突这一点，本身就是一个巨大的外交合作机遇。" 
 INA_memorandumforsum:0 "须弥外交备忘录"
 INA_memorandumforsum_desc:0 "与须弥的外交进行得非常的顺利，我们发现了双方恰好能提供互补的资源，我们正为太多流浪武士而发愁，而他们恰好需要大量战争用的炮灰。" 
 INA_alliedsum:0 "草雷同盟"
 INA_alliedsum_desc:0 "与须弥的外交进展喜人，加上我们对于璃月如今越发咄咄逼人的局势感到不安，一份仅仅针对璃月港的同盟协议似乎是互利双赢的选择，它将让我们互相保证对方的独立。" 
 INA_allieresearch:0 "科研协议"
 INA_allieresearch_desc:0 "合作的科学研究总是有益的，区别只是赚多赚少的问题。" 
 INA_introduceviod:0 "引进虚空系统"
 INA_introduceviod_desc:0 "神子大人了解到，因为一些原因，须弥最为强大的科研辅助系统，虚空系统已经被封存了，然而虚空系统的强大即便远在海外也为我们所知，而须弥也乐于将旧的虚空系统终端处理给我们。" 
 INA_alluseviod:0 "全面使用虚空"
 INA_alluseviod_desc:0 "全面接入虚空系统，对我们现有的科研系统而言，可以极大的降低对科研人员的需求，使得我们得以研究更多的项目，但这样做不但工程庞大，也会存在过度依赖虚空装置的副作用。" 
 INA_partuseviod:0 "部分使用虚空"
 INA_partuseviod_desc:0 "仅仅允许我们的科研人员在研究时使用虚空系统辅助，这将极大的提高我们的科研效率，而且这样做的成本也低了许多。" 
 INA_yaereformation:0 "宗教改革"
 INA_yaereformation_desc:0 "原有的鸣神教义已经不足以满足我们当下的需求了，无论是在信仰上击败并改编珊瑚神社，还是在收集民众的信仰上，我们必须进行改革。" 
 INA_enhancbelife:0 "信仰强化"
 INA_enhancbelife_desc:0 "强化我们的队伍信仰。" 
 INA_yaeisgod:0 "神化神子"
 INA_yaeisgod_desc:0 "显然对于每一个都有自己神明的国度而言，我们不足以体现我们的特殊性，但如果我们声称，我们是受到两位神明共同眷恋的国度呢？" 
 INA_yaeearthlydeity:0 "常世的神明"
 INA_yaeearthlydeity_desc:0 "不同与其他的国度，我们的神明存在于常世之中，而这正是我们的信仰比其他国度更为正确的原因。" 
 INA_yaeblesscure:0 "治愈的神迹"
 INA_yaeblesscure_desc:0 "毫无疑问的一点是，神子大人仅仅只需要展示一些自己的治愈能力，就可以在八重堂的宣传下将这作为神迹宣传出去。进而建立我们的信仰优势。" 
 INA_yaediviegaze:0 "与你同在"
 INA_yaediviegaze_desc:0 "仅仅只证明我们的信仰优越性是远远不够的，我们还应该让我们的神明时常降临，与信徒们同在。" 
 INA_yaeblessgold:0 "财富大权"
 INA_yaeblessgold_desc:0 "财富与商业之神，这是岩国神明的称号之一，因此那些谋求利益的人往往都会去崇拜他，而如今它已经陨落了，我们为什么不为神子大人冠加这个称号？" 
 INA_yaeisgodofrich:0 "财富之神"
 INA_yaeisgodofrich_desc:0 "借由我们的政府调控，我们可以轻易的让那些配合并服从于我们的人发了大财，而伴随着他们的财富事迹被八重堂广泛传播，神子大人已经成为了名副其实的财富与商业之神。"  
 INA_yaeisgodofcure:0 "治愈之神"
 INA_yaeisgodofcure_desc:0 "借由我们的巫女队伍的广泛行动，我们治愈了越来越多的民众，而他们也自发的成为了免费的宣传，现在，他们对神子大人就是治愈之神这一点深信不疑。"  
 INA_anothergod:0 "双神眷恋的稻妻"
 INA_anothergod_desc:0 "在我们的宣传之下，不仅仅稻妻的民众对神子大人是神深信不疑，许多外国的信徒也开始相信这一点。" 
 
 ##影线
 INA_reuseayaka:0 "白露霜华"
 INA_reuseayaka_desc:0 "与曾经立下赫赫功劳的神里绫人相比，神里绫华犯下的错误更重，功劳却更小，但将军大人对她在奉神演武上的表现感到满意，因此决定解除她的禁令，允许她重新为幕府效率。"
 INA_godheart:0 "永恒之心"
 INA_godheart_desc:0 "在经历如此之多的事情之后，我们必须思考，永恒的意义，是否真如过去所想，是百世不易，万世不移之物，亦或者，刹那亦可永恒？"
 INA_beyondmyself:0 "斩断过去"
 INA_beyondmyself_desc:0 "永恒绝不止是万世不移，但我象征着过去的半身并不这么想，是时候做出了断，一了百了！"
 INA_remakefengxing:0 "重整三奉行"
 INA_remakefengxing_desc:0 "对于稻妻三奉行而言，在过去仅仅只是清算了他们的罪行，但现在我们需要选出新的三奉行，来治理这个国家"
 INA_newina:0 "直面未来"
 INA_newina_desc:0 "斩断过去，直面未来。不再为过去的失败而迷茫，不再为未来的缥缈而困惑，以最坚定的心灵，迈出改变的脚步。"
 INA_meimiko:0 "神子的提议"
 INA_meimiko_desc:0 "对于我们未来的道路，神子有一些建议" 
 INA_meiayaka:0 "社奉行的提案"
 INA_meiayaka_desc:0 "人口休养" 
 INA_islandexploitation:0 "群岛大开发"
 INA_islandexploitation_desc:0 "大量的荒地，充沛的粮食，我们将迎来一轮人口增长潮" 
 INA_meiremovedelusive:0 "金苹果群岛问题"
 INA_meiremovedelusive_desc:0 "如果我们要铲除深渊，就必须先剪其羽翼。" 
 INA_meijudgeday:0 "复仇之日"
 INA_meijudgeday_desc:0 "与深渊还有暗之外海的仇恨，今日就是清算之时。" 
 INA_meisara:0 "九条的提议"
 INA_meisara_desc:0 "对于我们未来的进攻方向，九条有一些军事方面的建议。" 
 INA_planofmountain:0 "山崩计划"
 INA_planofmountain_desc:0 "是时候对璃月开战了" 
 
 ######九条线
 INA_guanzhi:0 "军事管制"
 INA_guanzhi_desc:0 "我们目前的行政管理是在是太过低能而无用了，没有时间进行缓慢的调整，直接使用目前最为高效的军队替代掉政府的职能。"
 INA_reusewood:0 "利用雷击木"
 INA_reusewood_desc:0 "整个稻妻都处于混乱的雷祸灾难中，这严重的阻碍了工业生产，但我们注意到了一种被称为雷击木的树，会利用雷祸向外不断释放雷电，或许我们可以利用这一特点将其用于工业生产。"
 INA_saragetcontrol:0 "九条幕府"
 INA_saragetcontrol_desc:0 "我们的任务完成的不错，将军大人决定让九条裟罗大人接管整个天领奉行，统领整个幕府。"
 INA_saramobilize:0 "军事动员"
 INA_saramobilize_desc:0 "这个世界危机四伏，我们内部更是混乱不堪，休息的时间结束了，该动员一切力量备战了。"
 INA_warinspect:0 "内战调查"
 INA_warinspect_desc:0 "根据我们的一些情报，反抗军中的邪眼，以及那条太过明显的死兆星号，毫无疑问，珊瑚宫叛乱案，绝不仅仅只是珊瑚宫一方的谋划。"
 INA_equipmentupgrade:0 "武备升级"
 INA_equipmentupgrade_desc:0 "为了完成我们的复仇，对幕府现有装备的升级迫在眉睫。不追赶上他们的科技，我们永远别想复仇。"
 INA_planofstone:0 "顽石计划"
 INA_planofstone_desc:0 "根据我们的调查，北斗的死兆星舰队，在整个内战中扮演了极其不光彩的角色，但显然，北斗舰队绝不仅仅是一只普通的海上舰队，北斗背后的那个人，璃月的天权星凝光，以及纵容这一行为的其他璃月高层，才是我们真正的复仇对象。"
 INA_bloodforblood:0 "罪与罚"
 INA_bloodforblood_desc:0 "对于这些掌握了无数人的经济命脉，甚至是生杀大权的璃月高层，九条裟罗大人提出了一个充满了创意，而又符合实际的处罚方式。"
 INA_conntactmot:0 "蒙德外交"
 INA_conntactmot_desc:0 "（未实装）根据我们的调查，愚人众不仅仅在稻妻犯下了罪恶，而且，与至冬接壤的蒙德，亦深受其害，或许我们可以与蒙德达成一项合作协议，既能互通有无，又能一起发动对至冬愚人众的复仇。"
 INA_snowplan:0 "雪崩计划"
 INA_snowplan_desc:0 "一切都已经准备好了，在将军大人的祝福下，复仇舰队已经载好了等待着向愚人众复仇的军团，万事俱备。只欠那来自蒙德的狂风，一并吹散千年淤积的积雪。"
 INA_eyeforeye:0 "傲慢的代价"
 INA_eyeforeye_desc:0 "愚人众终究要为他们的傲慢，对生命的漠视付出代价，在我们占了了他们荣耀，至冬的心脏，至冬宫后，九条裟罗大人提出了一个充满了创意，而又符合实际的处罚方式。"
 INA_bestretinue:0 "最佳从属"
 INA_bestretinue_desc:0 "（未实装）在完成了对璃月与至冬的复仇，解决了国内的灾祸之后，九条大人再度得到了来自将军的召见。"
 INA_reuseheizou:0 "启用平藏"
 INA_reuseheizou_desc:0 "天领奉行府的鹿野院平藏，是一个优秀的侦探，而这正是我们所需要的专业人才，所以我们决定聘请他来组建我们的特种安全机构。"
 INA_heizouamry:0 "鹿野院情报部"
 INA_heizouamry_desc:0 "平藏的工作非常出色，他给我们提出了一个建议，组建一个专业的反间谍部门，对于这样的建议，我们当然是从善如流。"
  INA_controlsky:0 "支配天空"
 INA_controlsky_desc:0 "天狗是风的使者，或者说风暴的使者，以雷驭风，而敌人将匍匐在我们脚下。"
 INA_midfighter:0 "大型战斗机"
 INA_midfightery_desc:0 "我们的空军建设太过落后了，必须立刻组建大型战斗机编队。"
  INA_lightfighter:0 "小型战斗机"
 INA_lightfighter_desc:0 "不仅仅要大的，灵活小巧的战斗机也是必须的。"
 INA_sarakingofsky:0 "高天之王"
 INA_sarakingofsky_desc:0 "料敌于先，料敌于前，占尽先机，我们是高天的王，为了夺取天空，我们的设计师结合了天狗的特点制造了一款同时可以兼顾海陆作战的先进战斗机。"
 INA_the_skyking_tt:0 "创造一款基于先进型的舰载战斗机，天狗战机。"
 INA_saraaircraft:0 "海空之王"
 INA_saraaircraft_desc:0 "翱翔天空，降下鸣雷之罚。"
 INA_saraspecialization:0 "专业化"
 INA_saraspecialization_desc:0 "飞行器制造是专业的事情，自然要专业人员专业操作。"
 INA_sarastandardization:0 "标准化"
 INA_sarastandardization_desc:0 "标准化工作有利于大规模工业的展开。"
 INA_sarasupremacyinsky:0 "空军繁荣"
 INA_sarasupremacyinsky_desc:0 "我们将建设一支真正的空军。"
 
 ####将军线
 INA_apocalyse:0 "天罚"
 INA_apocalyse_desc:0 "是时候了，对于我们内部这些慵懒的废物，他们的怠懒导致了整个稻妻的灾难，对他们降下世间最为恐怖的雷霆天罚。"
 INA_elementenemy:0 "永恒之敌"
 INA_elementenemy_desc:0 "早在五百年前，我的另外一半，象征着意识与心灵的半身，雷电影，就意识到了意识可能会因时间而磨损，现在，作为意识的半身，她果真成为了最大的的永恒之敌，该纠正她的错误了。"
 INA_elementcontrol:0 "万世不易"
 INA_elementcontrol_desc:0 "终于，心灵与身体再度达成了一致，我即是雷电将军，雷电影，稻妻永恒的雷光，万世千年永恒的神明，最接近天理的永恒！"
 INA_connectoforder:0 "天理永存"
 INA_connectoforder_desc:0 "唯有永恒，最为接近天理，然而一国之永恒，终究难以抵挡来自外界的侵扰，现在，是时候重新联系天理的维系者，探讨整个世界的永恒与天理了。"
 INA_removedelusive:0 "荡涤污垢"
 INA_removedelusive_desc:0 "深渊，一个不祥而污秽的词语，若非是深渊，数百年前的灾祸绝不至于如此，而双生子中的另一位也绝不会这样早逝，更何况还有那一批批死于黑潮灾难中的眷族，我们与深渊的新仇旧恨，是时候彻底清算了。"
 INA_removedelusive_effect_tooltip:0 "这将提升雷电将军与雷电影的力量，但会导致我们与深渊教团开战。"
 INA_raidensecrects:0 "雷电将军的秘密科技"
 INA_raidensecrects_desc:0 "等待实装"
 INA_whatsmygoddness:0 "何谓神明"
 INA_whatsmygoddness_desc:0 "神明为何？何谓神明？这是一个思想上必须要解决的问题。面对神明的伟力，凡人究竟应该如何自处？"
 INA_goddnessbless:0 "神恩永赐"
 INA_goddnessbless_desc:0 "毫无疑问的是，凡人与神明之间的差距有如天堑，但我们的神慷慨的赐下了神力，这为我们赢得真正的优势"
 INA_eletarnalemperer:0 "永恒帝国"
 INA_eletarnalemperer_desc:0 "建立一个真正的帝国，而非假想之存在。"
 INA_removely:0 "山崩地裂"
 INA_removely_desc:0 "岩之神，摩拉克斯，七执政中最为古老的执政之一，但磐岩最终也会为雨水的冲刷所磨损，如今的他与至冬的逆神暗中勾结，意图反叛天理，是时候让磐岩归于尘土了。"
 INA_removely_effect_tooltip:0 "这将提升雷电将军的力量，但会导致我们与璃月开战。"
 INA_removemot:0 "狂风止息"
 INA_removemot_desc:0 "风之神，巴巴托斯，七执政中最为古老的执政之一，但狂风太容易被其他物质所污染，如今的他，若不是与至冬的逆神暗中勾结，怎么可能会轻易将神之心让出？这自由的风，自由得过头了！"
 INA_removemot_effect_tooltip:0 "这将提升雷电将军的力量，但会导致我们与蒙德开战。"
 INA_mowing:0 "天理折枝"
 INA_mowing_desc:0 "草之神，布耶尔，作为新生的神明与世界树的看护者，本不应该遭受如此惩罚，但她不但与至冬的逆党交易，放任伪神篡改世界树，还试图染指关于天理的知识，身为知识的看护者，却对历史毫无尊重，因此，我们将代行神旨。"
 INA_mowing_effect_tooltip:0 "这将提升雷电将军的力量，但会导致我们与须弥开战。"
 INA_waterfall:0 "流水不腐"
 INA_waterfall_desc:0 "水之神，芙卡洛斯，身为正义与审判之神，亵渎神职，以审判的闹剧为乐，却对自己国家正在发生的灾难不闻不问。是时候了，代行神旨，替天理解决这一问题。"
 INA_waterfall_effect_tooltip:0 "这将提升雷电将军的力量，但会导致我们与枫丹开战。"
 INA_eternalfire:0 "薪火不灭"
 INA_eternalfire_desc:0 "火之神，玛薇卡，暂时没编织好罪名帽子，所以讨贼檄文等以后再补。"
 INA_eternalfire_effect_tooltip:0 "这将提升雷电将军的力量，但会导致我们与纳塔开战。"
 INA_eternalsnow:0 "冰消雪融"
 INA_eternalsnow_desc:0 "冰之神，其名字已经随着其公开的叛行成为了禁忌，身为仁慈与宽爱之神，其行为就是对这两个词最大的亵渎，率领手下制造了无数惨案，并率众忤逆天理，对于这样的叛逆，无须多言，只有彻底的湮灭才是其唯一的结局。"
 INA_eternalsnow_effect_tooltip:0 "这将提升雷电将军的力量，但会导致我们与至冬开战。"
 INA_eternalforever:0 "直到时空的尽头"
 INA_eternalforever_desc:0 "现在，一切可能威胁到永恒与天理的因素都已经被彻底荡平，将军大人的永恒，将从此刻起，一直贯彻到时间与空间的尽头！！！"
 INA_reusesaya:0 "启用早柚"
 INA_reusesaya_desc:0 "早柚是一个优秀的终末番忍者，可惜她缺乏自信不过，在负责照顾她的巫女的推荐下，我们还是启用了她"
 INA_spyamry:0 "直属终末番"
 INA_spyamry_desc:0 "终末番是一只优秀的特种部队，不过仅仅凭神里绫人可没有资格在社奉行组建这样一支队伍，这只秘密部队到底还是隶属于八重神社的，现在已经没有必要再让绫人为此浪费他宝贵的精力了，让终末番成为八重幕府的直属机构。"
 
 ###工业线
INA_renewbuiding:0 "重整勘定奉行"
 INA_renewbuiding_desc:0 "勘定奉行主管外交以及对内的经济建设，但之前的勘定奉行中充斥了太多无能之辈，现在，是该重整他们了。"
 INA_rebuiding_mainisland:0 "扩建稻妻城"
 INA_rebuiding_mainisland_desc:0 "稻妻城以及天守阁是整个稻妻的核心地区，但这里的基建已经太过古旧了。五百年前的设施虽然有部分更新，但已经远远不能满足需求，对稻妻城的翻修扩建，就是新勘定奉行的第一个任务。"
 INA_rebuiding_temple:0 "开发影向山"
 INA_rebuiding_temple_desc:0 "既然将军大人已经将统治权交给了八重大人，那么自然为了方便处理各种事务，八重大人下令翻修影向山上那过于老旧的栈道以及山脚荒废的神社。这将是新勘定奉行的第一个任务。"
 INA_rebuiding_awayisland:0 "离岛开发"
 INA_rebuiding_awayisland_desc:0 "离岛是稻妻对外贸易最重要的港口，为了彰显我们的新变化，我们应该修整离岛的基础设施。"
 INA_unioncommerce:0 "邀请万国商会投资"
 INA_unioncommerce_desc:0 "万国商会是离岛最具影响力的商业集团，我们对他们发出官方的邀请，一定可以让其他的投资者放下顾虑。积极投入我们的工业建设。"
 INA_reorganizetheindustry:0 "重建工业系统"
 INA_reorganizetheindustry:0 "随着社会的各个力量积极投入我们的工业建设，我们的工业水平赶上了世界。"
 INA_rebuiding_mainindustry:0 "修复踏鞴砂"
 INA_rebuiding_mainindustry_desc:0 "踏鞴砂是整个稻妻最核心的工业区，御影炉心也安置在那里，但战乱和过于久远的设施使得御影炉心随时可能融毁，如果我们想要修复御影炉心就必须先修复踏鞴砂的基建"
 INA_rebuiding_reactor:0 "炉心维护计划"
 INA_rebuiding_reactor_desc:0 "借由我们的技术发展，我们寻找到了一种新的维护御影炉心的方法，这极大的降低了我们维修御影炉心的伤亡。"
 INA_new_reactor:0 "炉心重构"
 INA_new_reactor_desc:0 "在我们与丹枫的工匠合作之后，我们终于从尘封的档案库中找到了御影炉心的旧图纸存放表，这让我们得以重构整个御影炉心，而参与重构的丹枫工程师则更是拍着胸膛保证，新的御影炉心，在百年之内都绝不会出任何意外。"
 INA_summer_party:0 "夏祭盛典"
 INA_summer_party_desc:0 "夏夜祭，全稻妻最受欢迎的祭典，因为战乱，我们已经很久没有举行过一次像样的夏夜盛会了。现在，全新的稻妻城和离岛建设之后，我们该举行这样一场盛典来安抚我们民众饱经战乱的心灵了。"
 INA_transport:0 "薄荷屋开张"
 INA_transport_desc:0 "薄荷屋重开" 
 INA_goodjob:0 "经济良好"
 INA_goodjob_desc:0 "在完成一切之后，我们将拥有一个真正良好的经济。"
 INA_constructionsector:0 "稻妻军工部"
 INA_constructionsector_desc:0 "赶上时代并非易事，首先我们就得对勘定奉行进行改革，设立下属军工部，专辖军事工业。"
 INA_industrialsector:0 "稻妻工业部"
 INA_industrialsector_desc:0 "赶上时代并非易事，首先我们就得对勘定奉行进行改革，设立下属工业部，专辖民用工业。"
 INA_electronicssector:0 "勘定电子部"
 INA_electronicssector_desc:0 "为了统筹通讯类工作，一个下属的电子研发部门是非常有必要的。"
 INA_electronicsresceach:0 "电子技术革新"
 INA_electronicsresceach_desc:0 "为了解决通讯问题，我们将对通讯电子技术进行更多投入"
 INA_yaepublic:0 "八重堂分店"
 INA_yaepublic_desc:0 "随着新首都的建设完成，在影向山下建立一个八重堂的分部也被提上了日程"
 INA_yoimiyashop:0 "长野原烟花店"
 INA_yoimiyashop_desc:0 "新时代的战争需要更多的火药，但放眼整个稻妻唯一有火药制作能力的，竟然只有长野原烟花店一家，我们必须对长野原烟花店进行大规模投资以满足需求。"
 INA_eyessimith:0 "御用锻造屋"
 INA_eyessimith_desc:0 "新时代的战争中，旧时代的铁器依然需求极大，为了统合稻妻锻造业，有必要设立一家官方锻造屋了。"
 INA_lightironform:0 "经津流锻造"
 INA_lightironform_desc:0 "神里家族传承的经津流，在上一次雷电五传覆灭中受到了极大的损失，但他们也因祸得福，发展出了一种全新的经津流锻造术，这种锻造术极大的降低了锻造成本，但同时质量也有小幅度的下滑。"
 INA_heavyironform:0 "天目流锻造"
 INA_heavyironform_desc:0 "天目家族传承的天目流，是唯一完整流传至今的雷电五传，天目流的诀窍就是精益求精，讲究滴水穿石的耐心。或者说慢工出细活。这种锻造术极大的提升了武器的质量，但同时成本也有一定幅度的上涨"
 INA_foreign_experts:0 "外国专家"
 INA_foreign_experts_desc:0 "邀请外国专家" 
 INA_national_specialists:0 "本国专家"
 INA_national_specialists_desc:0 "重视本国专家" 
 INA_foregn_civil_factory:0 "邀请投资者"
 INA_foregn_civil_factory_desc:0 "邀请投资者，为我们的建设添砖加瓦。" 
 INA_build_rawsea:0 "荒海开发"
 INA_build_rawsea_desc:0 "荒海，稻妻北部的台地，只需要稍加开发，我们便可在此新建工业区。" 
 INA_build_eiislands:0 "群岛开发"
 INA_build_eiislands_desc:0 "鸣神岛附近的岛屿也可以通过砍伐无用的灌木，平整土地，得以开发利用。" 
 INA_build_gantian:0 "绀田拓荒"
 INA_build_gantian_desc:0 "绀田村是鸣神岛的主要粮食产出地区，但因为战乱与先前统治者的不作为，许多的土地已经被抛荒了，现在是时候拓荒开田了" 
 INA_develop_gantian:0 "投资柑金岛"
 INA_develop_gantian_desc:0 "柑金岛以及白狐之野，位于稻妻城与绀田村之间的巨大平地以及可开发港口，具有巨大的发展潜力。" 
 INA_rebuild_eimountain:0 "复兴影向山"
 INA_rebuild_eimountain_desc:0 "影向山，稻妻的最高峰兼宗教圣地，在之前的雷灾祸中，损毁严重，山脚的神社已被废弃，道路也破败不堪，是该复兴影向山了。" 
 INA_release_captail:0 "疏散非首都功能"
 INA_release_captail_desc:0 "稻妻城内已经拥堵不堪，太多的工业建筑等非首都建筑占用了太多的空间，我们现在必须将这些非首都建筑疏散到附近的岛屿上，缓解首都压力。" 


 INA_mikosecrects:0 "宫司密法"
 INA_mikosecrects_desc:0 "八重神子大人指定了一些秘密研究项目" 
 INA_meisecrects:0 "雷电密法"
 INA_meisecrects_desc:0 "将军大人指定了一下秘密科技研究" 
 INA_sarawarlord:0 "设立战帅职位"
 INA_sarawarlord_desc:0 "我们目前的体制中，缺乏真正能替将军大人排忧解难的位置，必须设置一个战帅，专职战争。" 
 INA_sarareformation:0 "动员口号"
 INA_sarareformation_desc:0 "战帅命令往下传，天狗旗一展，大军冲下山。" 
 INA_sarabersaglieri:0 "战鹰军团"
 INA_sarabersaglieri_desc:0 "配置了大量自行车的高速部队。" 

 INA_yaeminefactory:0 "鸣神矿业"
 INA_yaeminefactory_desc:0 "主要发展矿业" 
 INA_yaebuidingfactory:0 "天狐建筑司"
 INA_yaebuidingfactory_desc:0 "优先发展建筑业" 
 INA_yaeoilof_ships:0 "储备燃料"
 INA_yaeoilof_ships_desc:0 "虽然我们的树脂产量冠绝提瓦特，但我们应该居安思危。" 
 INA_yaerebuidships:0 "重建船坞"
 INA_yaerebuidships_desc:0 "我们的造船业荒废得太久太久了" 
 INA_yaecruisersubmarines:0 "巡洋潜艇"
 INA_yaecruisersubmarines_desc:0 "一种大型潜艇" 
 INA_yaeminsubmarines:0 "袖珍潜艇"
 INA_yaeminsubmarines_desc:0 "一种迷你潜艇，适合保卫近海" 
 INA_yaeupgrademinsubmarines:0 "雷魂驱动潜艇"
 INA_yaeupgrademinsubmarines_desc:0 "改良型迷你潜艇，它更强大，也更昂贵" 
 INA_yaedefenceoverseas:0 "海岸防卫"
 INA_yaedefenceoverseas_desc:0 "建筑海岸要塞" 
 INA_buildjiutiaozhenwu:0 "构筑阵地"
 INA_buildjiutiaozhenwu_desc:0 "九条阵屋的位置，极其重要的捍卫了鸣神岛的安全，我们要加强当地的建设。" 
 INA_buildjunzhen:0 "军镇建设"
 INA_buildjunzhen_desc:0 "我们不能仅仅依靠踏鞴砂作为军事工业基地，必须把鸡蛋放在不同的篮子里" 
 INA_buildfireandlighting:0 "淬炼雷火"
 INA_buildfireandlighting_desc:0 "天雷勾地火，无相火被我们镇压之后，有望成为全新的燃料炉核心" 
 INA_fixforinter:0 "修复前线"
 INA_fixforinter_desc:0 "" 

