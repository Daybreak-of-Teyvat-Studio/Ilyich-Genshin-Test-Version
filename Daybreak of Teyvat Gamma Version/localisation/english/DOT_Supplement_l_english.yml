 ITA_political_reforms_desc:0 "Reforming the political system will rejuvenate and stabilize our nation."
 ITA_prioritizing_the_military:0 "Prioritizing the Military"
 ITA_prioritizing_the_military_desc:0 "By diverting funds and resources from elsewhere we will be able to focus on our armed forces. While certain areas will suffer from this in the short time, we stand to gain more in the long term."
