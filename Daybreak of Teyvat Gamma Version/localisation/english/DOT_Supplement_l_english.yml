 DOT_hyper_inflation_1:0 "Low Inflation"
 DOT_hyper_inflation_1_desc:0 "Our economists have noticed a slight increase in inflation. We should keep an eye on that."
 DOT_hyper_inflation_2:0 "Moderate Inflation"
 DOT_hyper_inflation_2_desc:0 "Inflation has started to affect the economy significantly. We should consider counter-measures before things get out of hand."
 DOT_hyper_inflation_3:0 "Heavy Inflation"
 DOT_hyper_inflation_3_desc:0 "Government-issued money is worth less and less, purchasing power is dropping and some goods are only available to people with the right connections."
 DOT_hyper_inflation_4:0 "Hyper Inflation"
 DOT_hyper_inflation_4_desc:0 "The value of our currency is evaporating. Prices rise dramatically from day to day. We must very urgently take counter-measures before we suffer a complete collapse."
 DOT_hyper_inflation_5:0 "Economic Collapse"
 DOT_hyper_inflation_5_desc:0 "Our system of currency has completely collapsed. In large parts of the country, trade has reverted to a barter system. Poverty is widespread. Our employees use the paper money we pay them with to heat their homes. An aggressive program of financial and economic reform is needed to resolve the situation."
 DOT_hyper_inflation_none:0 "Stable Economy"
 DOT_hyper_inflation_none_desc:0 "The economy is showing no signs of trouble."
 DOT_incompetent_officers:0 "Incompetent Officers"
 DOT_incompetent_officers_desc:0 "Our officers are not yet up to the task of managing a modern war. Hard lessons will have to be learned before they are truly equal to their counterparts in other nations. Educating them will be part of a bigger program of army reform."
 DOT_ineffective_bureaucracy:0 "Ineffective Bureaucracy"
 DOT_ineffective_bureaucracy_desc:0 "The chaos of the civil war has disrupted the creation of an effective state apparatus. More than a third of available recruits are not drafted, simply because no one knows they exist. Reforming the examination process will ensure that we hire competent people."
 DOT_internationalism:0 "Internationalism"
 DOT_joint_tank_development:0 "Joint Tank Development"
 DOT_judiciary_reforms:0 "Judicial Reform"
 DOT_kang_sheng:0 "Kang Sheng"
 DOT_lin_sen:0 "Lin Sen"
 DOT_low_popular_support:0 "Low Popular Support"
 DOT_low_popular_support_desc:0 "The peasants have suffered hard in the civil war. If we want to become accepted as the legitimate government of China, we must win their support."
 DOT_nationalism:0 "Nationalism"
 DOT_nie_rongzhen:0 "Nie Rongzhen"
 DOT_nine_power_treaty:0 "Nine Power Treaty"
 DOT_nine_power_treaty_desc:0 "We still labor under the effects of the Unequal Treaties that formalize the 'Open Door Policy' towards China. The foreigners still have extraterritorial rights, and we are not in full control of our economy."
 DOT_otto_braun:0 "Otto Braun"
 DOT_power_struggle:0 "Power Struggles"
 DOT_power_struggles:0 "Power Struggles"
 DOT_power_struggles_desc:0 "The party is internally divided about the best way to proceed. Struggles between various factions have erupted and will continue until one of them reigns supreme."
 DOT_public_works:0 "Public Works"
 DOT_red_army_weakened:0 "Red Army Weakened"
 DOT_red_army_weakened_desc:0 "Exhausted from the Long March, our Red Army is not fit for combat just yet. We must form new units and form a new Army of Liberation."
