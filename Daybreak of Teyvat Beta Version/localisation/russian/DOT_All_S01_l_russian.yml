#events
dva.1.t:0"Выходной разведчика"
dva.1.d:0"Эмбер, единственный разведчик Мондштадта, всегда в небе. Она получила задание от Джин — отправиться в Логово Урагана. Но две недели назад над городом появился дракон. Теперь он кружит над Логовом.\n\n«Дракон! Это Ураган!» — крикнул Раймонд. Эмбер была готова. «Прячьтесь! Ведите записи!» — и она взлетела."
dva.1.a:0"Ветер поднялся..."

dva.2.t:0"Письмо из Логова"
dva.2.d:0"Из-за Урагана в Логове появились монстры и бандиты. Они просят помощи."
dva.2.a:0"Нужно помочь!"
dva.2.b:0"У самих нет ресурсов."

dva.3.t:0"Помощь прибыла"
dva.3.d:0"«Орден не поскупился», — улыбнулся Раймонд. «Теперь у нас есть оружие».\n\nЭмбер улыбнулась:"
dva.3.a:0"«Спасибо капитану Джин»."

dva.4.t:0"Герой"
dva.4.d:0"«Разведчик Эмбер, капитан Джин хвалит вас», — сказала Ликод. Эмбер стояла с медалью на груди."
dva.4.a:0"Верность!"

dva.5.t:0"Губернатор"
dva.5.d:0"Эмбер назначена губернатором Логова."
dva.5.a:0"Здоровья капитану Джин."

dva.6.t:0"Спаситель?"
dva.6.d:0"«Орден не спасёт Мондштадт», — сказала Вил.\n\n«Мы не можем ни на кого полагаться, только на себя»."
dva.6.a:0"Будущее Мондштадта в наших руках."

dva.7.t:0"Дипломатия"
dva.7.d:0"«Царевич предлагает свои услуги», — сказала Вил. «Он может помочь с Шнежной».\n\n«Попробуем»."
dva.7.a:0"«Давайте проверим»."

dva.9.t:0"Отчёт об охоте"
dva.9.d:0"Мы провели операцию по зачистке монстров. Джин была довольна."
dva.9.a:0"Жаль, что нельзя поехать."

dva.10.t:0"Предупреждение"
dva.10.d:0"Эмбер ошиблась. Джин подозревает её. Она просит прощения."
dva.10.a:0"«Это не повторится»."

dva.11.t:0"Беда"
dva.11.d:0"«Орден объявил нам войну!» — сказала Вил. «Я говорила, что не стоило ссориться!»\n\n«Найдите того, кто это исправит!»"
dva.11.a:0"Всё кончено..."

dva.12.t:0"Совещание по флоту"
dva.12.d:0"Раймонд провёл совещание. Три варианта: большие корабли, воздушные шары Эмбер или подводные лодки Мона. Что выбрать?"
dva.12.a:0"Большие корабли"
dva.12.b:0"Идея Эмбер"
dva.12.c:0"Подводные лодки"

dva.13:0"Совещание по ВВС"
dva.13.d:0"Эмбер провела совещание. Альбедо предлагает специализацию, Сахароза — многофункциональность."
dva.13.a:0"Специализация"
dva.13.b:0"Многофункциональность"

dva.20.t:0"Рыба или мясо"
dva.20.d:0"Два пути развития: постепенный или быстрый с помощью Ордена."
dva.20.a:0"Не торопиться"
dva.20.b:0"Время дорого"
dva.20.c:0"И то, и другое!"
#above all！

dva.ab.1.t:0"Тоска по небу"
dva.ab.1.d:0"Эмбер любит небо. После встречи с путешественником она задумалась о свободе полёта.\n\n«Однажды я позволю всем летать за пределы неба»."
dva.ab.1.a:0"Великая мечта."

dva.ab.101.t:0"Зимняя история"
dva.ab.101.d:0"Виктор, посол Фатуи, хотел домой. Внезапно началась война, и он оказался в Логове, где Эмбер дала ему убежище."
dva.ab.101.a:0"Невероятно."

dva.ab.2.t:0"Заметки о Логове"
dva.ab.2.d:0"«Северный барьер — хиличурлы», «Северо-восток — маг Бездны», «Юго-восток — страж руин... Уа!»"
dva.ab.2.a:0"Настоящий разведчик."

dva.ab.40.t:0"Срочное письмо"
dva.ab.40.d:0"«Джин, Шнежная вторглась!»\n\nДжин проснулась."
dva.ab.40.a:0"Выразить протест!"
dva.ab.40.b:0"Объявить независимость Логова!"
dva.ab.40.c:0"Дать отпор!"

dva.ab.3.t:0"Исчезновение барьера"
dva.ab.3.d:0"«Город построить можно, но барьер мешает».\n\nЭмбер увидела зелёное пятно. Барьер исчез."
dva.ab.3.a:0"Шокирующе, но это шанс."

dva.ab.4.t:0"Воспоминания"
dva.ab.4.d:0"3000 лет назад Декарабиан построил башню, чтобы защитить народ. Но люди восстали за свободу.\n\nТеперь Эмбер здесь, чтобы залечить раны."
dva.ab.4.a:0"Тысячелетняя вражда забыта."

dva.ab.5.t:0"Последний разведчик?"
dva.ab.5.d:0"Дедушка Эмбер исчез. Она хочет стать лучшим разведчиком."
dva.ab.5.a:0"Кто-то должен защищать."

dva.ab.102.t:0"Ангел-хранитель Анны"
dva.ab.102.d:0"Анна стала разведчиком. Её брат Энтони тоже."
dva.ab.102.a:0"Братская любовь."

dva.ab.6.t:0"Мир... и надежда"
dva.ab.6.d:0"[Root.GetDVAAB6DESC]"
DVA_AB6_DESC_FAKE:0"Ликод приехала. Эмбер стала губернатором. Мир наступил..."
DVA_AB6_DESC_REAL:0"Ликод приехала. Эмбер подтвердили губернатором. Мир наступил..."
dva.ab.6.a:0"А надежда?"

dva.ab.7.t:0"Огонь"
dva.ab.7.d:0"[Root.GetDVAAB7DESC]"
DVA_AB7_DESC:0"«Эмбер... друг...» — сказал Рэйзор. «Мы доверяем ей», — сказали Беннет и Фишль.\n\n«Эмбер — друг»."
DVA_AB7_DESC_NO_DIONA:0"«Эмбер — друг»."
dva.ab.7.a:0"Дружба не угасает."

dva.ab.8.t:0"Песнь льда и пламени"
dva.ab.8.d:0"Уважаемый Шуберт Лоуренс,\n\nЭола в плену. Прошу освободить её.\n\nГубернатор Эмбер"
dva.ab.8.a:0"Освободить."
dva.ab.8.b:0"Не позволю!"

dva.ab.9.t:0"Большое будущее"
dva.ab.9.d:0"«Учитель, письмо от Эмбер...» — сказала Сахароза.\n\nАльбедо прочитал и застыл.\n\n«Собирайся, едем!»"
dva.ab.9.a:0"«Немедленно»."
dva.ab.9.b:0"«Поезжай ты»."
dva.ab.9.c:0"«Нужно подумать»."

dva.ab.10.t:0"Вечная связь"
dva.ab.10.d:0"Коллеи была спасена Эмбер. Теперь она приехала помочь."
dva.ab.10.a:0"Друзьям — радость."

dva.ab.11.t:0"Восход на западе"
dva.ab.11.d:0"Мы спасли Кли. Что делать?"
dva.ab.11.a:0"Не подвергать Кли опасности!"
dva.ab.11.b:0"Кли — наша сила!"

dva.ab.103.t:0"Сбежавшее солнце"
dva.ab.103.d:0"##"
dva.ab.103.a:0"##"

dva.ab.12.t:0"Логово не свободно"
dva.ab.12.d:0"«Надоели эти проповедники», — ворчал Виктор."
dva.ab.12.a:0"Сколько ещё терпеть?"

dva.ab.13.t:0"Реформа Ордена"
dva.ab.13.d:0"Война окончена. Два варианта: федерация или аннексия."
dva.ab.13.a:0"Федерация"
dva.ab.13.b:0"Аннексия"

dva.ab.14.t:0"Смысл богов"
dva.ab.14.d:0"Эмбер задаётся вопросом: зачем богам люди?"
dva.ab.14.a:0"Нет спасителей."

dva.ab.15.t:0"Нерушимый союз"
dva.ab.15.d:0"##"
dva.ab.15.a:0"##"

dva.ab.16.t:0"Протесты"
dva.ab.16.d:0"«Освободите Джин!» — кричат люди."
dva.ab.16.a:0"Твёрдость."
dva.ab.16.b:0"Победа требует жертв."

dva.ab.17.t:0"Свобода, равенство, процветание"
dva.ab.17.d:0"Логово процветает."
dva.ab.17.a:0"Наше Логово процветает."

dva.ab.18.t:0"Новая жизнь"
dva.ab.18.d:0"После войны Мондштадт изменился. Жизнь улучшилась."
dva.ab.18.a:0"Мы идём за тем, кто даёт лучшую жизнь."

#dva.ab.19.t:0"Конференция"
#dva.ab.19.d:0"Эмбер избрана председателем."
#dva.ab.19.a:0"Надежда пришла!"

dva.ab.20.t:0"Возвращение ветра"
dva.ab.20.d:0"Барбара получила письмо от Эмбер."
dva.ab.20.a:0"«Дорогая Эмбер...»"
dva.ab.20.b:0"«Дорогая Эмбер...»"

dva.ab.21.t:0"Честная ведьма"
dva.ab.21.d:0"«Спасибо за заботу о Кли», — сказала Элис. «Я отвечу на один вопрос».\n\nЭмбер спросила о будущем.\n\nЧерез несколько дней она получила книгу «Волна»."
dva.ab.21.a:0"«Волна» будущего?"

dva.ab.22.t:0"«Журнал алхимии»"
dva.ab.22.d:0"Вышел журнал Мондштадтского алхимического общества."
dva.ab.22.a:0"Знание — сила."

dva.ab.23.t:0"Барон-Кролик, вперёд!"
dva.ab.23.d:0"Проект «Барон-Кролик» завершён."
dva.ab.23.a:0"Принять на вооружение."
DVA_Great_Baron_Bunny:0"Удар Барона-Кролика"
DVA_Orbital_Bombing:0"Удар Барона-Кролика"
DVA_drop_bunny:0"Удар Барона-Кролика готов."

dva.ab.24.t:0"День старта"
dva.ab.24.d:0"Запуск. Все в напряжении.\n\n«Барьер достигнут».\n\n«Остановимся?»"
dva.ab.24.a:0"Остановиться."
dva.ab.24.b:0"Продолжить."

dva.news.5.t:0"Вторжение Бездны"
dva.news.5.d:0"После запуска ракеты в небе открылась трещина. Появились монстры. Все объединились для защиты."
dva.news.5.a:0"Конец света?"

dva.ab.25.t:0"Ветряные крылья"
dva.ab.25.d:0"Проект «Ветряные крылья» завершён."
dva.ab.25.a:0"Продолжить внедрение."

dva.ab.26.t:0"Тайны алхимии"
dva.ab.26.d:0"«Алхимия — это понимание, разложение, перестройка. Боги — не более чем чистые элементали»."
dva.ab.26.a:0"Что нам делать?"

dva.ab.27.t:0"Тайны неба"
dva.ab.27.d:0""
dva.ab.27.a:0""

dva.ab.28.t:0"Понимание элементов"
dva.ab.28.d:0"«Элементы — это энергия линий земли. Мы можем дать их всем»."
dva.ab.28.a:0"Инвестировать."
dva.ab.28.b:0"Хорошо."

dva.ab.29.t:0"Звёзды"
dva.ab.29.d:0""
dva.ab.29.a:0""

dva.ab.30.t:0"Повиновение или смерть?"
dva.ab.30.d:0""
dva.ab.30.a:0""

dva.ab.31.t:0"Сила вне времени"
dva.ab.31.d:0""
dva.ab.31.a:0""

dva.ab.32.t:0"Новый хранитель?"
dva.ab.32.d:0""
dva.ab.32.a:0""

dva.ab.33.t:0"Разрыв цепей"
dva.ab.33.d:0"«Мы можем освободить богов, разрушив трон».\n\n«С помощью истинного языка»."
dva.ab.33.a:0"«Возможно»."

dva.ab.34.t:0"К звёздам"
dva.ab.34.d:0""
dva.ab.34.a:0""

dva.news.3.t:0"Красная звезда над Мондштадтом"
dva.news.3.d:0"Группа «бланкистов» объявила о создании «Коммуны» под руководством Эмбер."
dva.news.3.a:0"Восстание!"
dva.news.3.b:0"Эмбер сошла с ума?"
dva.news.3.c:0"Блан... что?"

dva.news.6.t:0"Триумф бланкизма!"
dva.news.6.d:0"Гражданская война окончена. Эмбер избрана председателем."
dva.news.6.a:0"Ответственность тяжела."
dva.news.6.b:0"Времена меняются."

dva.ab.35.t:0"Зов судьбы"
dva.ab.35.d:0"Мона увидела звёзды и отправилась в Логово."
dva.ab.35.a:0"«Нужно доставить весть»."

dva.ab.105.t:0"Посланник"
dva.ab.105.d:0"Нужно отправить посланника в Вольфендом. Вил или Мона?"
dva.ab.105.a:0"Вил"
dva.ab.105.b:0"Мона"

dva.ab.106.t:0"Огонь"
dva.ab.106.d:0"«Рэйзор... друг».\n\nОн отдал письмо Моне."
dva.ab.106.a:0"«Да не погаснет огонь»."

dva.ab.36.t:0"Огонь"
dva.ab.36.d:0"Эмбер получила письмо от Рэйзора: «Мы друзья»."
dva.ab.36.a:0"Мы не одиноки."
dva.ab.36.b:0"Огонь зажжён."

dva.ab.37.t:0"Финансовый отчёт"
dva.ab.37.d:0"Джин читает отчёт. Расходы высоки."
dva.ab.37.a:0"Одобрить."
dva.ab.37.b:0"Отказать."

dva.ab.38.t:0"Песнь льда и пламени"
dva.ab.38.d:0"«Эола!» — Эмбер обняла подругу."
dva.ab.38.a:0"Хороший конец."

dva.ab.39.t:0"Пламя страсти"
dva.ab.39.d:0"«Сахароза, привет!» — крикнула Эмбер."
dva.ab.39.a:0"«Привет, я с хорошими новостями»."

dva.ab.41.t:0"Огни"
dva.ab.41.d:0"##"
dva.ab.41.a:0"##"

dva.ab.42.t:0"Свобода вернулась"
dva.ab.42.d:0"[ROOT.GetDVAAB42DESC]"
DVA_AB42_DESC_NEU:0"Свобода вернулась в Мондштадт."
DVA_AB42_DESC_COM:0"«Конференция завершена!» — объявила Эмбер."
dva.ab.42.a:0"За Мондштадт!"

dva.ab.43.t:0"Продовольственный кризис"
dva.ab.43.d:0"[ROOT.GetDVAAB43DESC]"
DVA_AB43_DESC_PEACE:0"Беженцев много, еды мало. Хопкинс предлагает контрабанду."
DVA_AB43_DESC_WAR:0"Война со Шнежной истощает запасы. Хопкинс предлагает контрабанду."
dva.ab.43.a:0"Просить помощи у Ордена."
dva.ab.43.b:0"Довериться Хопкинсу."

dva.ab.44.t:0"Отчёт Лизы"
dva.ab.44.d:0"Хопкинс — коррупционер. Его нужно наказать."
dva.ab.44.a:0"В тюрьму!"
dva.ab.44.b:0"Народный суд!"

dva.ab.45.t:0"Отчёт Лизы"
dva.ab.45.d:0"Царевич — предатель. Его нужно наказать."
dva.ab.45.a:0"Поделом."
dva.ab.45.b:0"Поделом."

dva.ab.46.t:0"Коррупция"
dva.ab.46.d:0"Чиновники развратились."
dva.ab.46.a:0"Внешний блеск..."
#dva.ab.46.b:0"Пора навести порядок!"

dva.ab.47.t:0"Будущее"
dva.ab.47.d:0"Эмбер и Мона спорят о пути: боги или звёзды."
dva.ab.47.a:0"Сверх богов."
dva.ab.47.b:0"К звёздам."

dva.ab.48.t:0"Разрушение богов"
dva.ab.48.d:0"Боги — это существа, управляющие правилами."
dva.ab.48.a:0"Можно ли объединить богов?"

dva.ab.49.t:0"Бюро «Звёзды»"
dva.ab.49.d:0"Создано бюро для секретных проектов."
dva.ab.49.a:0"Мы идём против небес."
DVA_stellaris_build_tt:0"Разблокировано §YБюро «Звёзды»§!."

dva.ab.50.t:0"С богом"
dva.ab.50.d:0"«Венти, помогите нам».\n\n«Я помогу»."
dva.ab.50.a:0"По воле ветра."

dva.ab.51.t:0"Переход"
dva.ab.51.d:0"Молодые рыцари перешли к коммуне."
dva.ab.51.a:0"Мудрый выбор."

dva.ab.52.t:0"Огонь"
dva.ab.52.d:0"Эмбер собрала совет. «Что, если коммуна падёт?»\n\n«Нужен план»."
dva.ab.52.a:0"Неужели так плохо?"

dva.ab.53.t:0"Назначение"
dva.ab.53.d:0"«Тёрнер, нам нужна ваша помощь».\n\n«Я согласен»."
dva.ab.53.a:0"«С удовольствием»."

dva.ab.107.t:0"Назначение"
dva.ab.107.d:0"«Международная торговая ассоциация» в Инадзуме. Кого поддержать?"
dva.ab.107.a:0"Инвестировать."
dva.ab.107.b:0"Поддержать Вернера."
dva.ab.107.c:0"Отправить помощников."
INA_International_Trade_Association1:0"Международная ассоциация"
INA_International_Trade_Association1_desc:0"Ассоциация иностранных торговцев."
INA_International_Trade_Association2:0"Международная ассоциация"
INA_International_Trade_Association2_desc:0"Ассоциация иностранных торговцев."
INA_International_Trade_Association3:0"Международная ассоциация"
INA_International_Trade_Association3_desc:0"Ассоциация иностранных торговцев."


dva.news.1.t:0"Вторая гражданская война?"
dva.news.1.d:0"Эмбер объявила независимость и войну Ордену."
dva.news.1.a:0"Долой Орден!"
dva.news.1.b:0"Барбатос, спаси Мондштадт!"
dva.news.1.c:0"Хаос."

dva.news.2.t:0"Шнежная вторглась"
dva.news.2.d:0"[Root.GetDVANEWS2DESC]"
DVA_NEWS2_DESC:0"Шнежная вторглась в Логово."
DVA_NEWS2_DESC_BRAVE_MOT:0"Шнежная нарушила договор и вторглась."
dva.news.2.a:0"Ответить!"
dva.news.2.b:0"Это земля Мондштадта."
dva.news.2.c:0"Тревожно."
dva.news.2.d:0"Да здравствует Мондштадт!"

DRA_news.1126.t:0"«Аэродинамика»"
DRA_news.1126.d:0"Сахароза опубликовала статью об аэродинамике."
DRA_news.1126.a:0"Гений."
DRA_news.1126.b:0"Честь для Мондштадта."
DRA_news.1126.c:0"У Мондштадта есть гении."
DRA_news.1126.e:0"Летательные аппараты?"
DOT_aircraft_fly:0"§Y«Аэродинамика» не опубликована§!"
AIR_CATEGORY_MAR_AIRCRAFT:0"Аппарат Антона Роже ($VAL$)"
category_MAR_aircraft:0"Аппарат Антона Роже"

#dva_border_conflict.1.t:0"Преследование"
#dva_border_conflict.1.d:0"Фатуи разбиты. Пора добить их."
#dva_border_conflict.1.a:0"Вперёд!"

#dva_border_conflict.2.t:0"Горечь"
#dva_border_conflict.2.d:0"Фатуи сильнее. Поражение."
#dva_border_conflict.2.a:0"Время не ждёт."

#dva_border_conflict.3.t:0"Другой путь"
#dva_border_conflict.3.d:0"Война затягивается. Лучше сохранить статус-кво."
#dva_border_conflict.3.a:0"Сожаление."

