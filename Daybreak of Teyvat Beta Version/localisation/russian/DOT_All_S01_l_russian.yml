developevent.1.t:0"Возвещая рассвет"
developevent.1.d:0"С тех пор как Небесный Остров дал молчаливое согласие на войну богов 2600 лет назад, цивилизации Тейвата возникали и исчезали. Большинство из них погибло от внутреннего хаоса, а некоторые — от руки Небесного Принципа. Последний такой случай — падение безбожного королевства Кхенри'ах: его народ был несправедливо осуждён. Принцип не только уничтожил королевство, но и превратил выживших в чудовищ, не объяснив их вину. Под Морозными Гвоздями страны Тейвата трепещут, не зная, когда они тоже нарушат неизвестный запрет и столкнутся с неотвратимым концом.\n\nТеперь, после долгой борьбы и развития, мы достигли небывалых высот: процветающая промышленность, сельское хозяйство, невиданные технологии, единый народ, непобедимая армия — как в былые времена в Кхенри'ах. Каждый шаг вперёд открывает новые пути, полные возможностей, но страх перед наказанием останавливает нас.\n\nНо может ли прогресс человечества остановиться? Рано или поздно мы коснёмся запретов Кхенри'ах?\n\nЧтобы избежать судьбы Кхенри'ах, есть только один путь: поднять мятеж против Небесного Острова!\n\nЕсли мы уверены, что наша сила непобедима, мы должны пойти и обнажить клинок против небесного тирана. Кровь богов станет нашими чернилами для будущего, а их трупы — ступенями к нему!"
developevent.1.a:0"Фанес, твоё время прошло!"

developevent.2.t:0"Решительность"
developevent.2.d:0"В кузнице нашего городка хозяин купил автоматическую ковочную машину, из-за чего подмастерья лишились заработка. Машина таинственно исчезла, но нет доказательств, что это сделали они. Как поступить?"
developevent.2.a:0"Наказать работников за халатность"
developevent.2.b:0"Закрыть глаза, хотя бы сэкономив на обслуживании"
developevent.2.c:0"Выделить деньги на новую машину"
