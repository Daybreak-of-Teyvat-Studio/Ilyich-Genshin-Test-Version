 ITA_aiding_the_spanish_republic:0 "Aiding the Spanish Republic"
 ITA_all_within_the_state_ns:0 "$ITA_all_within_the_state$"
 ITA_all_within_the_state_ns_desc:0 "Bolstering our capabilities behind the front lines will secure the path forward to victory."
 ITA_alpine_defense:0 "Alpine Defense"
 ITA_alpine_defense_desc:0 "The brutal fighting up in the mountains during the Great War is still fresh in many people’s memories. We must secure our northern front from any potential attacks by having capable soldiers that can fight effectively in that terrain."
 ITA_anti_colonialism_sentiment:0 "Anti-Colonialism Sentiment"
 ITA_anti_fascist_agents:0 "Anti-Fascist Agents"
 ITA_anti_fascist_fervor:0 "Anti-Fascist Fervor"
 ITA_anti_partisan_measures_ns:0 "$ITA_anti_partisan_measures$"
 ITA_anti_partisan_measures_ns_desc:0 "Our specialized units are hindering the movements of the partisans, making it harder for them to strike behind the front lines."
 ITA_army_of_africa_disheartened_idea:0 "Army of Africa Disheartened"
 ITA_astaldi:0 "Astaldi"
 ITA_aviation_hero_tt:0 "  - $air_equipment_research$: §G+5%§!"
 ITA_aviazione_legionaria:0 "Aviazione Legionaria"
 ITA_aviazione_legionaria_desc:0 "Securing Air Superiority is vital for any army to gain the upper hand and push the enemy back."
 ITA_banda_carita_non_la_resistance:0 "Banda Carità"
 ITA_bandits_war:0 "Bandits War"
 ITA_bandits_war_desc:0 "Mobility and mechanization are the future of warfare. We must invest heavily in modernizing our army for it to be successful on today's battlefields."
 ITA_battaglia_del_grano:0 "Battaglia del Grano"
 ITA_battaglia_del_grano_desc:0 "To be truly independent, we cannot rely on foreign powers for our food supply but must become agriculturally self-sufficient. The Battle for Grains will see us become self-reliant and our might grow only even further."
 ITA_battaglia_per_la_nascite:0 "Battaglia per le Nascite"
 ITA_battaglia_per_la_nascite_desc:0 "In order for Italy to truly flourish we need more soldiers. In order to get more soldiers, we need a larger population. In order to get a larger population, we need mothers. What mothers need is for us to win the Battle for Births."
 ITA_battaglia_per_la_terra:0 "Battaglia per la Terra"
 ITA_battaglia_per_la_terra_desc:0 "Our Battle for Land will drain miles of marshes and create farmland. It will also provide new job opportunities and foreign governments have already been impressed by the unbreakable spirit of the Italian people."
 ITA_bolstered_military_high_command:0 "Bolstered Military High Command"
 ITA_bolstered_military_high_command_desc:0 "Having competent leadership is crucial for the military to function optimally and to be successful on the battlefields."
 ITA_bolstered_political_cabinet:0 "Bolstered Political Cabinet"
 ITA_bolstered_political_cabinet_desc:0 "Having the right people in the right places will bolster the fascist system and our rule over [ITA.GetNameDef]."
 ITA_brescia_arsenal:0 "Brescia Arsenal"
 ITA_caligulas_pride_dynamic_modifier_tt:0 "§Y$ship_hull_super_heavy_1$§!: $production_cost_tt$ §G-15.00%§! \n§Y$ship_hull_super_heavy_1$§!: Armor: §G+10%§! \n"
 ITA_camicie_nere:0 "Camicie Nere"
 ITA_camicie_nere_desc:0 "The Blackshirts have sworn a personal oath to [ITA.GetLeader], making them more reliable and loyal than the rest of the Army. Giving them more authority and responsibility will only strengthen our reign."
 ITA_camicie_nere_mp_tt:0 "§YMilitary Police§!: Suppression Bonus: §G+5.0%§!"
