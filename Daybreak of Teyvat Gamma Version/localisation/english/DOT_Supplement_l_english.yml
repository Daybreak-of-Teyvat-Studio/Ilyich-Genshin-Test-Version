 TUR_economic_collapse:0 "Economic Collapse"
 TUR_economic_collapse_desc:0 "We are ruined: Etatism saved us the pains of the Great Depression, but we could not evade economic catastrophe forever it seems. We have failed our country, our people, our ideology, and we have tainted the legacy of Atatürk himself forever..."
 TUR_elyesa_bazna:0 "Elyesa Bazna"
 TUR_emergency_deployment_of_defensive_bases:0 "Emergency Deployment of Defensive Bases"
 TUR_emergency_deployment_of_defensive_bases_desc:0 "Our nation's defensive bases are woefully out-of-date, and would be ultimately worthless in a modern war. We must undertake a great national effort in order to modernize our defenses and deter any would-be invaders."
 TUR_emergency_fortification_directive:0 "Emergency Fortification Directive"
 TUR_emergency_fortification_directive_desc:0 "Dire times call for dire measures, and we have been forced to quickly allocate resources towards building fortifications. Our very existence could be at stake."
 TUR_erkan_gataly:0 "Erkan Gataly"
 TUR_etatism:0 "Etatism"
 TUR_etatism_2:0 "Etatism"
 TUR_etatism_2_desc:0 "Our mixed economy is unlike any in the world: it has elements of British liberalism, Italian corporatism, and Soviet central planning. It is the ultimate synthesis of economic models and a crowning jewel of the Kemalist system, but we must be sure not to put too much pressure on it by trying to simultaneously sustain a war economy. \n\n§RIf we advance our economy law, then we should be prepared for additional friction to develop between our incompatible economic models.§!"
 TUR_etatism_3:0 "Etatism"
 TUR_etatism_3_desc:0 "Our mixed economy is unlike any in the world: it has elements of British liberalism, Italian corporatism, and Soviet central planning. It is the ultimate synthesis of economic models and was a crowning jewel of the Kemalist system, but we have strained it by attempting to concurrently sustain a war economy. We might need to reconsider our prospects and end the Etatist experiment. \n\n§RIf we advance our economy law, then we should be prepared for additional friction to develop between our incompatible economic models.§!"
 TUR_etatism_4:0 "Etatism"
 TUR_etatism_4_desc:0 "Our mixed economy was unlike any in the world: it subsisted of elements of British liberalism, Italian corporatism, and Soviet central planning. We have been reckless and greedy, and we risk destroying our country's economy by trying to keep our Etatist model while running a war economy. We risk everything for nothing: we must abolish Etatism before it becomes too late. \n\n§RIf we advance our economy law again without abolishing Etatism then we will trigger a depression!§!"
 TUR_etatism_desc:0 "Our mixed economy is unlike any in the world: it has elements of British liberalism, Italian corporatism, and Soviet central planning. It is the ultimate synthesis of economic models and a crowning jewel of the Kemalist system. \n\n§RIf we advance our economy law, then we should be prepared for friction to develop between our incompatible economic models.§!"
 TUR_etatism_stabilisation:0 "Etatist Stabilization"
 TUR_etatism_stabilisation_desc:0 "The beauty of a mixed economy is that we have the capacity and power to implement emergency measures when the need arises, and we have done just that. We have bought time before the next economic shift, but it will not last forever. We must use our time carefully."
 TUR_fahrettin_altay:0 "Fahrettin Altay"
 TUR_fakhri_pasha:0 "Fakhri Pasha"
 TUR_fascism:0 "Turkish Empire"
 TUR_fascism_ADJ:0 "Ottoman Turkey"
 TUR_fascism_DEF:0 "the Turkish Empire"
 TUR_fethi_okyar:0 "Fethi Okyar"
 TUR_fevzi_cakmak:0 "Fevzi Çakmak"
 TUR_fevzi_cakmak_command:0 "Fevzi Çakmak"
 TUR_financing_private_enterprise:0 "Financing Private Enterprise"
 TUR_financing_private_enterprise_desc:0 "It is the purpose of the state to provide incentive and reward for the most entrepreneurial of our people. By investing in those who would better our nation, we invest in the future of our country."
 TUR_fundamentalism:0 "Fundamentalism"
 TUR_fundamentalism_desc:0 "Oh glorious God, the sole wish of my pain-stricken heart is that no heathen's hand should ever touch the bosom of my sacred Temples."
 TUR_funkplan:0 "Funkplan"
 TUR_funkplan_desc:0 "Modelled on Hjalmar Schacht's Schachtplan, Walther Funk's Funkplan guarantees German access to [TUR.GetAdjective] mineral ores while also facilitating [TUR.GetAdjective] access to the market of German commercial products. Hidden clauses in the Funkplan also guarantee us the minimum amount of materials needed to help enlarge our heavy industry."
 TUR_generic_communist_revolutionary:0 "Pertev Naili Boratav"
 TUR_generic_democratic_reformer:0 "Abbas Cevat"
 TUR_generic_fascist_demagogue:0 "Nihal Atsiz"
 TUR_generic_head_of_intelligence:0 "Elyesa Bazna"
 TUR_german_advisors:0 "German Advisors"
 TUR_german_advisors_desc:0 "Officially acting as ambassadors and business consultants, we now host a sizeable group of German officers ready to assist us in modernizing our military and making it as effective a fighting force as it can be."
 TUR_golden_age_of_the_wolf:0 "Golden Age of the Wolf"
 TUR_golden_age_of_the_wolf_desc:0 "The German and [TUR.GetAdjective] wolves rule over Europe. Our enemies are rabbits, and though they can run and they can hide it is inevitable that they will get snapped up in one of our great and mighty jaws!"
 TUR_halide_edib_adivar:0 "Halide Edib Adıvar"
 TUR_halil_kut:0 "Halil Kut"
 TUR_has_a_prime_minister_tt:0 "§Y[TUR.GetNameDef]§! has a Prime Minister."
 TUR_hasan_saka:0 "Hasan Saka"
 TUR_hassan_saka:0 "Hassan Saka"
 TUR_hilmi_uran:0 "Hilmi Uran"
 TUR_inanc_vergisi_spirit:0 "İnanç Vergisi"
 TUR_inanc_vergisi_spirit_desc:0 "The 'Faith Tax' is the ultimate culmination of Kemalist secular doctrine; it is an aggressive push that many will consider as a big step towards state atheism. Unfortunately, it is a dream that cannot be - and we will have to consider repealing the tax in the future."
 TUR_infrastructure_privatised_idea:0 "Privatized Infrastructure"
 TUR_infrastructure_privatised_idea_desc:0 "Giving private interests some control over our state's infrastructure gives us some more resources to allocate elsewhere, but makes building additional infrastructure an irritatingly staggered affair for now."
 TUR_integrated_german_officers:0 "Integrated German Officers"
 TUR_integrated_german_officers_desc:0 "With there no longer being any need to disguise the role of the German military officials in our country, we have officially integrated them into our chain of command with the express consent of [GER.GetLeader]."
 TUR_investment_financing_spirit:0 "Financing Investment"
 TUR_investment_financing_spirit_desc:0 "The world revolves around the exchange of commodities for the fulfillment of needs. We certainly have need, but in order to have our back scratched we must first do a bit of back-scratching ourselves."
 TUR_ismet_inonu:0 "İsmet İnönü"
 TUR_italo_turkish_merchant_fleet:0 "Italo-[TUR.GetAdjective] Merchant Fleet"
 TUR_italo_turkish_merchant_fleet_desc:0 "The days of the [ENG.GetAdjective] dominating the seas of the Mediterranean are over. The Mediterranean belongs to the [ITA.GetAdjective] and the [GRE.GetAdjective]!"
 TUR_izzettin_calislar:0 "İzzettin Çalışlar"
 TUR_joint_fortification_budget:0 "Joint Fortification Budget"
 TUR_joint_fortification_budget_desc:0 "The Balkan Entente is like a stack of dominoes: when one of us falls, the rest will surely be quick to follow. We must all take responsibility for our defense and prepare our borders against any possible incursions."
 TUR_kamil_tolon:0 "Kamil Tolon"
 TUR_kazim_karabekir:0 "Kâzım Karabekir"
 TUR_kazim_orbay:0 "Kazim Orbay"
 TUR_kazim_ozalp:0 "Kazim Özalp"
 TUR_kazim_ozalp_bftb:0 "Kazim Özalp"
 TUR_kemalism_with_socialist_characteristics:0 "Kemalism with Socialist Characteristics"
 TUR_kemalism_with_socialist_characteristics_desc:0 "We have no interest in disposing of Kemalism, we would be doing the world a disservice getting rid of our homegrown and progressive ideology. Kemalism is dynamic enough that it can be altered to conform more with Marxist values without totally eroding its foundations."
 TUR_kemalist_army_officers_decreased_power_disloyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_decreased_power_disloyal_desc:0 "The Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism has faced some setbacks in winning over the support of the people, which the officers corps largely attributes to the policies and actions of the current administration."
 TUR_kemalist_army_officers_decreased_power_loyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_decreased_power_loyal_desc:0 "The Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism has faced some setbacks in winning over the support of the people, but the officer corps remain committed to supporting the current administration."
 TUR_kemalist_army_officers_decreased_power_neutral:0 "Kemalist Officers"
 TUR_kemalist_army_officers_decreased_power_neutral_desc:0 "The Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism has faced some setbacks in winning over the support of the people, and the officers are uneasily observing the mood of the nation."
 TUR_kemalist_army_officers_extended_power_disloyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_extended_power_disloyal_desc:0 "The elite Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism has steadily been winning hearts and minds across Turkey, and the officer corps are actively working against the current administration to guarantee the protection of Kemalist values."
 TUR_kemalist_army_officers_extended_power_loyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_extended_power_loyal_desc:0 "The elite Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism has steadily been winning hearts and minds across Turkey as Atatürk hoped it would, and the officer corps stands in solidarity with the current administration against all dangers to Turkish sovereignty."
 TUR_kemalist_army_officers_extended_power_neutral:0 "Kemalist Officers"
 TUR_kemalist_army_officers_extended_power_neutral_desc:0 "The elite Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism has steadily been winning hearts and minds across Turkey as Atatürk hoped it would, and the officer corps stand ready to ensure the values of Kemalism remain protected against those who would subvert them."
 TUR_kemalist_army_officers_limited_power_disloyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_limited_power_disloyal_desc:0 "The Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism remains challenged as an ideology, and the officer corps stand in firm opposition to the stance of the current administration on matters of ideology and governance."
 TUR_kemalist_army_officers_limited_power_loyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_limited_power_loyal_desc:0 "The Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism remains challenged as an ideology, but the officer corps stand ready to assist the government in all manners concerning the protection of the state."
 TUR_kemalist_army_officers_limited_power_neutral:0 "Kemalist Officers"
 TUR_kemalist_army_officers_limited_power_neutral_desc:0 "The Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism remains challenged as an ideology, and the officer corps are working diligently to safeguard Kemalist principles."
 TUR_kemalist_army_officers_minimal_power_disloyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_minimal_power_disloyal_desc:0 "The Turkish officer corps were some of the staunchest protectors of Kemalist values, but now the pitiably shrunken cabal of Kemalist loyalists can do little other than make passing condemnations of the current administration."
 TUR_kemalist_army_officers_minimal_power_loyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_minimal_power_loyal_desc:0 "The Turkish officer corps were some of the staunchest protectors of Kemalist values, but now the listless clique of Kemalist loyalists can do little other than make passing appraisals of the current administration."
 TUR_kemalist_army_officers_minimal_power_neutral:0 "Kemalist Officers"
 TUR_kemalist_army_officers_minimal_power_neutral_desc:0 "The Turkish officer corps were some of the staunchest protectors of Kemalist values, but now they have been reduced to a largely ceremonial role."
 TUR_kemalist_army_officers_powerful_disloyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_powerful_disloyal_desc:0 "The elite Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism has never before been so entrenched in Turkey as it is today, and the officer corps most assuredly loathe us for acting so contradictorily to Kemalist values at a time when Kemalism is respected by so many."
 TUR_kemalist_army_officers_powerful_loyal:0 "Kemalist Officers"
 TUR_kemalist_army_officers_powerful_loyal_desc:0 "The elite Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism has never before been so entrenched in Turkey as it is today, and our state has never been in safer hands than it is under the current administration."
 TUR_kemalist_army_officers_powerful_neutral:0 "Kemalist Officers"
 TUR_kemalist_army_officers_powerful_neutral_desc:0 "The elite Turkish officer corps are some of the staunchest protectors of Kemalist values. Kemalism has never before been so entrenched in Turkey as it is today."
 TUR_legacy_of_ataturk_defiled:0 "The Legacy of Atatürk"
 TUR_legacy_of_ataturk_defiled_desc:0 "We have failed him: how could the Father of the Turks look upon the current state of affairs in [ROOT.GetNameDef] with anything other than scornful disdain? We shall just have to trust that his ambitions for this nation were wrong, and that ours were right..."
 TUR_legacy_of_ataturk_fulfilled:0 "The Legacy of Atatürk"
 TUR_legacy_of_ataturk_fulfilled_desc:0 "We have championed and fulfilled Mustafa Kemal Atatürk's highest ambitions for the [ROOT.GetAdjective] state by transforming it into a legitimate multi-party liberal democratic state. We have championed Atatürk's lifelong dream, and because of that our reign has been made considerably more secure in the eyes of the people."
 TUR_legacy_of_ataturk_preserved:0 "The Legacy of Atatürk"
 TUR_legacy_of_ataturk_preserved_desc:0 "We have prolonged the status quo of old by maintaining an authoritarian regime that promotes Kemalist ideals. We have not shattered Mustafa Kemal Atatürk's aspirations for the [ROOT.GetAdjective] state, but we have also done little to further those goals. It will be up to future generations to use the foundations we lay down so that they may usurp the mantle of Kemalism..."
 TUR_liberalism:0 "Liberalism"
 TUR_liberalism_desc:0 "I have been free since the beginning and forever shall be so. What madman shall put me in chains! I defy the very idea! For freedom is the absolute right of my ever-free flag!"
 TUR_mehmet_ali_ulgen:0 "Mehmet Ali Ülgen"
 TUR_mehmet_emin_yurdakul:0 "Mehmet Emin Yurdakul"
 TUR_mehmet_fahri_engin:0 "Mehmet Fahri Engin"
 TUR_mehmet_fahri_engin_bftb:0 "Mehmet Fahri Engin"
 TUR_mehmet_gunaltay:0 "Mehmet Günaltay"
 TUR_mehmet_salih_omurtak:0 "Salih Omurtak"
 TUR_memduh_tagmac:0 "Memduh Tagmac"
 TUR_mumtaz_okmen:0 "Mümtaz Ökmen"
 TUR_mumtaz_okmen_bftb:0 "Mümtaz Ökmen"
 TUR_mustafa_kemal_ataturk_figurehead:0 "Mustafa Kemal Atatürk"
 TUR_mustafa_kemal_ataturk_figurehead_desc:0 "Even in retirement, our Ghazi cannot help but get involved in the politics of our nation. He may no longer formally be president, but Mustafa Kemal Atatürk's word remains law - even now."
 TUR_muzaffer_goksenin:0 "Muzaffer Göksenin"
 TUR_nationalism:0 "Nationalism"
 TUR_nationalism_desc:0 "Fear not; for the crimson banner that proudly ripples in this glorious dawn shall not fade before the last fiery hearth that is ablaze within my homeland is extinguished. For that is the star of my people, and it will forever shine; it is mine; and solely belongs to my valiant nation."
 TUR_nazim_hikmet:0 "Nâzım Hikmet"
 TUR_nejdet_sancar:0 "Nejdet Sançar"
 TUR_neutrality:0 "Ottoman Turkey"
 TUR_neutrality_ADJ:0 "Ottoman Turkey"
 TUR_neutrality_DEF:0 "Ottoman Turkey"
 TUR_nihal_atsiz:0 "Nihal Atsız"
 TUR_nuri_demirag:0 "Nuri Demirağ"
 TUR_nuri_demirag_prime_minister:0 "Nuri Demirağ"
 TUR_nuri_killigil:0 "Nuri Killigil"
 TUR_objectors_flocking_to_military_service:0 "Objectors Flocking to Military Service"
 TUR_objectors_flocking_to_military_service_desc:0 "All sorts of [TUR.GetAdjective] citizens who once dodged conscription are signing up to serve in our armed forces. People have taken well to the government's approach of Fatherland First, and many are starting to understand their place in our country's fabric where before they felt like outsiders."
 TUR_ottoman_officers_invited_back:0 "The §YOttoman Loyalists§! have been invited to return to active service."
 TUR_political_landscape_shifting:0 "Political Landscape Shifting"
 TUR_political_landscape_shifting_desc:0 "For so long, it has been the ultimate aim of Kemalism to establish a multi-party liberal democracy in [TUR.GetNameDef]... but times change. We live in exciting times with modern ideologies battling it out with each other for supremacy over the world order, and it seems that ideological battleground has found its footing here now too."
 TUR_populism:0 "Populism"
 TUR_populism_desc:0 "Who would not sacrifice their life for this paradise of a country? Martyrs would burst forth should one simply squeeze the soil! Martyrs!"
 TUR_rauf_orbay:0 "Rauf Orbay"
 TUR_rauf_orbay_bftb:0 "Rauf Orbay"
 TUR_reappropriated_exploitative_finance:0 "Reappropriated Exploitative Finance"
 TUR_reappropriated_exploitative_finance_desc:0 "We shall repurpose the wealth of foreign usurers and our own deplorable domestic capitalistic parasites in order to build a society that truly serves the working class of [TUR.GetNameDef]."
 TUR_rearmament_scheme:0 "Prepared Rearmament Scheme"
 TUR_rearmament_scheme_desc:0 "A comprehensive rearmament scheme has been in the pipeline for quite some time now, but there was little need to carry out the scheme - but the world now finds itself on the brink of another war, and Turkey will not be caught unprepared."
 TUR_rebuilding_our_home:0 "Rebuilding Our Home"
 TUR_rebuilding_our_home_desc:0 "Our nation has been materially, physically, and spiritually ravaged by the Kemalist dogs, but at long last their tyranny has been brought to an end. We stand on the brink of a new era for our people: one where we can finally right the wrongs of the past. We must build for the future so that we can resurrect the past."
 TUR_recep_peker:0 "Recep Peker"
 TUR_red_officers:0 "Red Officers"
 TUR_red_officers_desc:0 "Just as the Kemalist officers represent and safeguard their own ideology, our new officers shall serve as the guardians of Marxism in [TUR.GetNameDef]."
 TUR_refet_bele:0 "Refet Bele"
 TUR_refik_saydam:0 "Refik Saydam"
 TUR_reformism:0 "Reformism"
 TUR_reformism_desc:0 "The horizons of the West may be bound with walls of steel, but my borders are guarded by the mighty bosom of a believer. Let it bellow out, do not be afraid! And think: how can this fiery faith ever be extinguished, by that battered, single-fanged monster you call 'civilization'?"
 TUR_refugees_from_the_fascist_menace:0 "Refugees from the Fascist Menace"
 TUR_refugees_from_the_fascist_menace_desc:0 "The fascists practice politics of exclusivity and violate the inalienable rights of man at every turn. Their actions are monstrous, and safeguarding and protecting those fleeing fascist prejudice is the very least that we can do."
 TUR_republicanism:0 "Republicanism"
 TUR_republicanism_desc:0 "For independence is the absolute right of my God-worshipping nation!"
 TUR_revolutionary_brigades_from_abroad:0 "Revolutionary Brigades From Abroad"
 TUR_revolutionary_brigades_from_abroad_desc:0 "Marxism is a fundamentally internationalist creed and so it is merely natural that revolutionaries from all across the world would flock to our nation to fight in our shared global struggle."
 TUR_revolutionism:0 "Revolutionism"
 TUR_revolutionism_desc:0 "So ripple and wave like the bright dawning sky, oh thou glorious crescent, so that our every last drop of blood may finally be blessed and worthy! Neither you nor my kin shall ever be extinguished!"
 TUR_rising_islamist_dissidence:0 "Rising Islamist Dissidence"
 TUR_rising_islamist_dissidence_desc:0 "Every time the very notion of free elections has been raised in [TUR.GetNameDef] the religious fundamentalists have tried to hijack any platform for opposition to the CHP. It appears this time will be no different. Across the nation there is a rising fundamentalist consciousness as our ideological enemies rally to topple our rule over the country by profaning the ballot box we are providing them."
 TUR_riza_nur:0 "Rıza Nur"
 TUR_sabiha_gokcen:0 "Sabiha Gökçen"
 TUR_sadik_altincan:0 "Sadık Altıncan"
 TUR_said_i_nursi:0 "Said-i Nursî"
 TUR_salih_omurtak:0 "Salih Omurtak"
 TUR_second_five_year_plan_cakmak:0 "Çakmak's Five Year Plan"
 TUR_second_five_year_plan_cakmak_desc:0 "Based upon the German remilitarization model, Fevzi Çakmak has made it a priority to increase the amount of heavy industry in [ROOT.GetNameDef] and to modernize the infrastructure across the nation."
 TUR_second_five_year_plan_inonu:0 "İnönü's Five Year Plan"
 TUR_second_five_year_plan_inonu_desc:0 "Based upon the Soviet industrialization model, İsmet İnönü has made it a priority to increase the amount of light industry in [ROOT.GetNameDef] and to modernize the infrastructure across the nation."
 TUR_sectarian_woes:0 "Sectarian Woes"
 TUR_sectarian_woes_1:0 "Sectarian Woes"
 TUR_sectarian_woes_1_desc:0 "§W[TUR.GetNameDefCap]'s internal divisions are represented geographically through§! §YState Modifiers§!§W: the§! £faction_tur_kemalist §YKemalists§! §Wcan be found in the west and in the north, the religious§! £faction_tur_traditionalist §YTraditionalists§! §Wcan be found in the central hinterlands as well as in the south, while the§! £faction_tur_kurdish §YKurdish people§! §Wcan be found in the south-east of the nation.§! \n\n§WInteractions with the different§! §YFactions§! §Wcan be accessed through the§! §YDecisions Tab§!§W, as well as through some§! §YFocus Effects§! §Wand§! §YEvent Options§!§W.§! \n\nTurkey is beset by internal divisions that are drawn across ideological, religious, and ethnic lines. The Kemalists hope to turn Turkey into a secularized state, but there is a large percentage of the population who remain fundamentally opposed to the very concept of secularism. To mend the internal divisions of our country, we will either need to approach these issues with a gentle hand or an iron fist."
 TUR_sectarian_woes_2:0 "Sectarian Woes"
 TUR_sectarian_woes_desc:0 "§W[TUR.GetNameDefCap]'s internal divisions are represented geographically through§! §YState Modifiers§!§W: the§! £faction_tur_kemalist §YKemalists§! §Wcan be found in the west and in the north, the religious§! £faction_tur_traditionalist §YTraditionalists§! §Wcan be found in the central hinterlands as well as in the south, while the§! £faction_tur_kurdish §YKurdish people§! §Wcan be found in the south-east of the nation.§! \n\n§WInteractions with the different§! §YFactions§! §Wcan be accessed through the§! §YDecisions Tab§!§W, as well as through some§! §YFocus Effects§! §Wand§! §YEvent Options§!§W.§! \n\nTurkey is beset by internal divisions that are drawn across ideological, religious, and ethnic lines. The Kemalists hope to turn Turkey into a secularized state, but there is a large percentage of the population who are fundamentally opposed to the very concept of secularism. In the east, the Kurdish people have caused a great deal of trouble for the Turkish government and seem determined to go the way of rebellion over assimilation. To mend the internal divisions of our country, we will either need to approach these issues with a gentle hand or an iron fist."
 TUR_sectarian_woes_desc_2:0 "§W[TUR.GetNameDefCap]'s internal divisions are represented geographically through§! §YState Modifiers§!§W: the§! £faction_tur_kemalist §YKemalists§! §Wcan be found in the west and in the north, the religious§! £faction_tur_traditionalist §YTraditionalists§! §Wcan be found in the central hinterlands as well as in the south, while the§! £faction_tur_kurdish §YKurdish people§! §Wcan be found in the south-east of the nation.§! \n\n§WInteractions with the different§! §YFactions§! §Wcan be accessed through the§! §YDecisions Tab§!§W, as well as through some§! §YFocus Effects§! §Wand§! §YEvent Options§!§W.§! \n\nTurkey is beset by internal divisions that are drawn across ideological, religious, and ethnic lines. In the east, the Kurdish people have caused a great deal of trouble for the Turkish government and seem determined to go the way of rebellion over assimilation. To mend the internal divisions of our country, we will either need to approach these issues with a gentle hand or an iron fist."
 TUR_sefik_husnu:0 "Şefik Hüsnü"
 TUR_sevket_sureyya_aydemir:0 "Şevket Süreyya Aydemir"
 TUR_sheltered_foreign_outcasts:0 "Sheltered Foreign Outcasts"
 TUR_sheltered_foreign_outcasts_desc:0 "It is our moral imperative to help the persecuted peoples of the world when it is within our power, and thus far it most certainly has been in our power. We will naturalize them, protect them, and nurture them as though they were native sons and daughters of [TUR.GetNameDef]."
 TUR_socialism:0 "Socialism"
 TUR_socialism_desc:0 "My friend! Leave not my homeland to the hands of villainous men! Render your chest as armour and your body as bulwark! Halt this disgraceful assault!"
 TUR_sub_zero_survival_training:0 "Sub-Zero Survival Training"
 TUR_sub_zero_survival_training_desc:0 "It is no easy task emulating some of the bitter colds of Eurasia, but he have been forced to make do. We have elected to construct a facility on the summit of Mount Palandöken in Erzurum with an additional smaller facility based around Mount Ağrı so our troops can train in alpine and glacial-like conditions all year round."
 TUR_subject:0 "$OVERLORDADJ$ $TUR$"
 TUR_subject_DEF:0 "$OVERLORDADJ$ $TUR$"
 TUR_sukru_okan:0 "Şükrü Okan"
 TUR_sukru_saracoglu:0 "Şükrü Saracoğlu"
 TUR_sukru_saracoglu_prime_minister:0 "Şükrü Saracoğlu"
 TUR_the_antalya_naval_academy:0 "The Antalya Naval Academy"
 TUR_the_antalya_naval_academy_desc:0 "Working together with the [ITA.GetAdjective]s, we have established a school for budding admirals and naval officers that is unlike any other in the world."
 TUR_the_battle_for_our_nations_survival:0 "The Battle for Our Nation's Survival"
 TUR_the_battle_for_our_nations_survival_desc:0 "The unthinkable has happened: [SOV.GetNameDef] has invaded our nation, and now the future of the [TUR.GetAdjective] state is at stake. The [TUR.GetAdjective] people have rallied to the call of [TUR.GetLeader], but in the face of total war against an indisputably more powerful threat just how long can this zeal last?"
 TUR_the_coordinated_armed_forces_of_the_balkan_pact:0 "The Coordinated Armed Forces of the Balkan Entente"
 TUR_the_coordinated_armed_forces_of_the_balkan_pact_desc:0 "Our strength stems from our unity. We coordinate as one, we fight as one, we fall as one. When the dust settles and the cannons stop firing, the Balkan Entente will still be standing."
 TUR_the_redshirts:0 "The Redshirts"
 TUR_the_redshirts_desc:0 "The Redshirts are our very own paramilitary fascist militia that patrol the streets of our urban areas and ensure people are strictly abiding by the principles of Kemalism. They might be a little violent at times, with hearts of iron and heads filled with revolutionary idealism, but at least their cause is just!"
 TUR_the_revolutionary_officer_college_of_kars:0 "The Revolutionary Officer College of Kars"
 TUR_the_revolutionary_officer_college_of_kars_desc:0 "Kars is a city with a storied history, and its proximity to [SOV.GetNameDef] makes it the ideal location to establish a new politicized officer school. Our officers will be taught not just the fundamentals of warfare, but the intricacies of Marxist doctrine."
 TUR_three_year_plan_balkans:0 "The Shared Three Year Plan"
 TUR_three_year_plan_balkans_desc:0 "The Balkan Entente has undertaken one of the boldest industrialization projects in history by sponsoring a jointly-funded multinational centrally planned economic scheme to make sure our industrial bases are collectively powerful enough to withstand an assault from a great power."
 TUR_tpda:0 "TPDA"
 TUR_tpda_absorbed:0 "Turkish Public Debt Administration"
 TUR_tpda_absorbed_desc:0 "With only the stroke of a pen, the Turkish Public Debt Administration has turned from a private entity into a state-owned public entity. We administer our debt, we control our debt, and we can diminish our debt. We have risen high in the world."
 TUR_tpda_desc:0 "At last, we have wrestled the reins away from the imperialists and can organize and manage our own debts from our capital city. The Debt Council is no more, now the privileged sharks will have no choice but to come to us when they seek restitution or capitulation."
 TUR_turkic_volunteers_from_abroad:0 "Turkic Volunteers from Abroad"
 TUR_turkic_volunteers_from_abroad_desc:0 "Our Turkic brothers and sisters come from every corner of Eurasia to lend their support to our shared struggle. Together, we shall secure the Age of the Wolf."
 TUR_turkish_bolshevism:0 "Turkish Bolshevism"
 TUR_turkish_bolshevism_desc:0 "Kemalism served its purpose and now will be consigned to the history books... well, some illegal history books at any rate. [TUR.GetNameDef] is now modelled upon Vladimir Lenin's revolution rather than the revisionist reactionary Mustafa Kemal Atatürk and his quashed movement."
 TUR_turkish_interventionism:0 "Turkish Interventionism"
 TUR_turkish_interventionism_desc:0 "Peace at Home, Peace in the World - Atatürk decreed it, and we have now codified it as the very basis of our foreign policy. We can no longer sit by and allow the world to fall into turmoil while we stand on the sidelines and do nothing. The only way to secure our peace at home is to fight for peace in the world."
 TUR_turkish_workers_militia:0 "Turkish Workers' Militia"
 TUR_turkish_workers_militia_desc:0 "The people in the best position to protect the rights of workers are the workers themselves. Of course, a little direction from our government and the odd memo from Moscow only better their effectiveness as a workers' militia."
 TUR_tuz_golu_training_facility:0 "Tuz Gölü Training Facility"
 TUR_tuz_golu_training_facility_desc:0 "Our nation's Mediterranean climate is not a fit environment to train our soldiers so they can adequately operate in arid climates. We have elected to erect training facility close to the Tuz Gölü salt lake, so that our troops might be better prepared to fight in desiccated environments."
 TUR_ultranationalism:0 "Ultranationalism"
 TUR_ultranationalism_desc:0 "May God take my life, my loved ones, and all possessions from me if He will, but let Him not deprive me of my one true homeland in the world. These adhans and their testimonies are the foundations of my religion, and may their noble sound prevail thunderously across my eternal homeland."
 TUR_united_balkan_security_forces:0 "United Balkan Security Forces"
 TUR_united_balkan_security_forces_desc:0 "Shared security battalions is a natural escalation from frequently having our members of high command exchange battleplans and intel with each other. By alleviating some of the pressure on us for policing our internal borders, we lessen the loads on our national armies and become better prepared for war."
 TUR_varlik_vergisi_spirit:0 "Varlık Vergisi"
 TUR_varlik_vergisi_spirit_desc:0 "This 'Wealth Tax' is only a thinly veiled reimplementation of the Jizya tax, and we might need to consider repealing it before we lose even the illusion of administering a secular republic."
 TUR_vecihi_hurkus:0 "Vecihi Hürkuş"
 TUR_victory_at_all_costs:0 "Victory At All Costs"
 TUR_victory_at_all_costs_desc:0 "We did not fight tooth and nail as a nation during our War of Independence only to be annihilated a few decades later. No, [TUR.GetNameDef]'s story does not end here - we must not fall, we will not fall!"
 TUR_zeki_dogan:0 "Zeki Doğan"
 TUR_zeki_velidi_togan:0 "Zeki Velidi Togan"
