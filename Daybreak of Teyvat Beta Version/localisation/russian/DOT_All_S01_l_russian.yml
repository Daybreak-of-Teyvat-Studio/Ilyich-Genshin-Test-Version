simple_bicycle_workshop_desc:0 "Основатели велосипедной мастерской «Сесилия» были ремесленниками, заметившими потребность жителей Вольфендома в передвижении после того, как они насытились. После изобретения этого великого двухколёсного транспортного средства их продукция получила высокую оценку во всём Вольфендоме, и даже армия Вольфендома начала закупать этот транспорт для передвижения по пересечённой местности. Теперь на лугах Вольфендома повсюду можно увидеть людей, катающихся на велосипедах с эмблемой цветка Сесилии."
andrius_truck_desc:0 "Грузовой завод «Андриус» родился из потребности в сотрудничестве и обмене между деревнями и общинами Вольфендома. Грузовики с этого завода, сжигая смолу, соединяли звенья промышленной цепочки Вольфендома, доставляя свежие овощи, фрукты и морепродукты, а также изысканные потребительские товары во все уголки Вольфендома. В военное время у них появится новая обязанность: доставлять фронтовикам необходимое для жизни и боеприпасы, поддерживая тех, кто защищает свой дом. Возможно, также появятся моторизованные машины, переделанные из грузовиков «Андриус», которые будут мчаться в тыл врага."
mond_peoples_truck_maunufacturer_desc:0 "Мондштадтский народный тракторный производственный комбинат вырос из тракторной ремонтной мастерской, созданной правительством в период Вольфендома. К моменту объединительной войны он уже мог самостоятельно производить тракторы, позволяя труженикам полей меньше потеть и повышая эффективность на стройках. После объединения Мондштадта это предприятие получило похвалу от правительства и дополнительное финансирование, а также новую задачу: производить мощное оружие, наводящее ужас на врагов."
andrius_tank_trust_desc:0 "После серии головокружительных манёвров несколько производителей тракторов и вооружений объединились, монополизировав сырьё, технологии и оборудование для производства тракторов и бронетехники, и с помощью некоторой экономии на материалах снизили себестоимость производства до крайне низкого уровня, разгромив конкурентов и монополизировав рынок этих товаров, получая сверхприбыли."
fishery_association_desc:0 "С ростом населения Вольфендома собирательство перестало удовлетворять потребности в продовольствии. Многие, кто раньше занимался рыболовством, вернулись к своему ремеслу, основав Ассоциацию рыболовов озера Сидра, чтобы снабжать жителей Вольфендома свежей рыбой. Говорят, что один юноша, который раньше никогда не рыбачил, проявил себя в этой ассоциации. После её создания жители некоторых отдалённых от водоёмов районов заявили, что теперь потребляют рыбы в десять раз больше, чем до приезда в Вольфендом."
mond_peoples_ship_maunufacturer_desc:0 "Мондштадтский народный судостроительный комбинат раньше назывался Судостроительной верфью озера Сидра и был государственным предприятием по производству рыбацких судов для Вольфендома. Во время объединительной войны многие рыбаки пострадали от вражеских атак с моря, и верфь начала ограниченное производство судов для боёв на озере. После объединения Мондштадта верфь была расширена и получила инвестиции, начав строить корабли, способные плавать в открытом море, прокладывая путь народу Мондштадта."
andrius_ship_trust_desc:0 "Эта группа изначально была малоизвестной верфью, основанной в период Вольфендома и принадлежавшей государству. В период ослабления правительственного контроля руководитель предприятия намеренно задерживал производство, из-за чего верфь, показывавшая хорошие результаты, была признана неэффективным активом и приватизирована. Этот человек приобрёл её за бесценок и с помощью железной воли и использования чужих сил подавил сопротивление рабочих. Впоследствии он никогда не останавливался в своём расширении, поглотив бесчисленное множество подобных предприятий законными или нераскрытыми методами, и в итоге после объединительной войны полностью монополизировал эту отрасль, получив название треста. Теперь эта группа может служить нам, создавая пригодный флот с низкими затратами."
mond_peoples_aircraft_maunufacturer_desc:0 "Мондштадтский народный авиационный комбинат — это государственное предприятие, созданное после объединительной войны. Его костяк составляли исследователи, изучавшие трофейные вражеские самолёты во время войны. После объединения Мондштадта предприятие росло и училось, привлекая множество талантливых специалистов из-за рубежа, изучая древние мондштадтские рукописи и различные существующие летательные аппараты, такие как Нефритовый чертог в Ли Юэ и Колесницы Кхенри'ах. Количество типов самолётов, которые оно может производить, постоянно растёт. Теперь на всех аэродромах Мондштадта можно увидеть самолёты, произведённые этим комбинатом, и он стал основным поставщиком наших ВВС."
andrius_aircraft_trust_desc:0 ""
andrius_blacksmith_shop_desc:0 "Дядя Вагнер, покинувший Мондштадт из-за войны, пришёл в Вольфендом. Не желая сидеть без дела, он решил обучить своему ремеслу других, и так появилась Новая кузница Вагнера. Жители использовали оружие, сделанное им и его учениками, для отпугивания диких зверей и защиты урожая. По Вольфендому разнеслась фраза: «Рука Вагнера не знает брака!»"
mond_peoples_infantry_weapon_maunufacturer_desc:0 "Мондштадтский народный военно-снабженческий комбинат изначально был объединением мелких мастерских. В период войны за самооборону Вольфендома правительство начало массовые закупки военного снаряжения, что привело к появлению множества предприятий по его производству. Эти предприятия, впоследствии вошедшие в комбинат, в основном были коллективными, не управлялись государством, работали на самоокупаемости с внутренней производственной демократией, где зарплаты управленцев, техников и рабочих были примерно равны. К объединительной войне эти предприятия достигли определённых размеров. Столкнувшись с ожесточёнными боями и движимые стремлением к миру, члены этих предприятий после обсуждения решили передать военное производство под контроль правительства, чтобы продукция могла быстрее поступать на фронт и мир скорее вернулся в Мондштадт. После объединения Мондштадта группа по-прежнему хранит верность своим принципам, работая ради безопасности Мондштадта."
andrius_infantry_weapon_trust_desc:0 "Военно-снабженческий трест"
construction_union_of_wolfendom_desc:0 "Временная строительная бригада Вольфендома выросла из потребности в жилье для постоянно прибывающих беженцев. Говорят, что даже сам Беннет когда-то работал там простым рабочим. Теперь эта строительная бригада стала героем в глазах жителей Вольфендома, её численность растёт с каждым днём, и её можно увидеть в любом уголке Вольфендома, где есть люди."
mond_peoples_cons_and_reas_maunufacturer_desc:0 "Мондштадтский народный строительно-исследовательский комбинат когда-то имел два названия: «Временная строительная бригада Вольфендома» и «Научно-исследовательский институт Вольфендома». После объединения Мондштадта эти два учреждения были объединены для быстрого внедрения результатов исследований в производство."
ANR_cons_and_reas_konzern_desc:0 "После ослабления правительственного контроля родился огромный концерн, охватывающий несколько областей, и он постоянно растёт. Теперь у него есть собственные школы, поставляющие кадры; крупнейший исследовательский институт Мондштадта, обеспечивающий технологический прогресс; и производственные мощности впечатляющих масштабов, армии строительных бригад, переговорщиков и юристов, монополизировавших несколько отраслей. Но у концерна есть и свои заботы: с ростом его масштабов внутри него процветает коррупция; а стабильный доход от монополии заставляет его избегать рискованных новых технологий и улучшений продукции."

ANR_Bonus_From_War:0"§CХаос в Мондштадте принёс нам больше беженцев§!"
# l_simp_chinese: New file
#national focus
lonely_island:0"Изолированная земля"
lonely_island_desc:0"Мондштадт погружён в хаос... Но это не касается Рэйзора и Вольфендома. В Вольфендоме мало людей, и ни одна из сторон в гражданской войне не проявляет к нему интереса, тем более что его охраняет Волк Севера...\nНо неужели его покой никогда не будет нарушен?"
The_red_star_won:0"Красная звезда вверху"
The_red_star_won_desc:0"Иногда течение истории заносит людей в неожиданные места. Так случилось и с Беннетом. Несколько лет назад он был просто неудачливым искателем приключений, а сегодня он стоит в центре всеобщего внимания, избранный лидером Вольфендома. Его стойкость, обаяние и мужество покорили жителей Вольфендома, а их доверие позволило ему поверить в себя.\nОн твёрдо решил вести народ к лучшему будущему. А в каком направлении — ему подскажут новые идеи, называемые §R«социализмом»§W, с которыми он познакомился за эти годы."
Immernachtreich:0"Сумеречное царство" 
Immernachtreich_desc:0"Взор Принцессы осуждения, окинувший бесчисленные миры, нашёл для здешнего заблудшего народа путь в Сумеречное царство. Стоя на краю времени и пространства, она решила, что даже всей жизни не хватит, чтобы привести своих подданных к идеалу. И тогда её верный спутник, Озвальдо Хравнавинс, подал ей идею."
partial_autonomy:0"Частичная автономия"
partial_autonomy_desc:0"Диона уже приступила к своим практическим реформам. Если один институт теряет власть, кто-то другой неизбежно её получает. Кто же получит власть, от которой добровольно отказывается правительство Вольфендома? Диона уже приняла решение."
the_same_goal_we_have:0"Общая цель"
the_same_goal_we_have_desc:0"Хотя противоречия между Беннетом, Фишль и Дионой кажутся значительными, Рэйзор остро заметил, что у них есть общая цель: дать жителям Вольфендома счастливую жизнь. Он считает, что сохранение этой цели и частичная реализация программ каждого из них — это один из вариантов."
Union_of_Socialist_Republics_in_Mondstadt:0"Союз Социалистических Республик Мондштадта"
Union_of_Socialist_Republics_in_Mondstadt_desc:0"По инициативе Генерального секретаря Беннета мы решили построить Мондштадт как федерацию, состоящую из множества социалистических республик, объединённых в союз. Название этой федерации — §RСоюз Социалистических Республик Мондштадта (ССРМ)§W. Нам предстоит ещё многое сделать, но светлое будущее уже близко."
bring_liberation_back_to_our_hometown:0"Мы вернём свободу на родину!"
bring_liberation_back_to_our_hometown_desc:0"После упорной борьбы мы, люди со всего Мондштадта, наконец принесли всему Мондштадту мир и свободу, которую даёт мир.\nВсе наши подвиги превратятся в эпос, который будут передавать барды, и даже через тысячи лет люди будут вспоминать наши героические деяния."
establishment_of_the_pioneer_nation:0"Основание Пионерского государства Вечной Ночи"
establishment_of_the_pioneer_nation_desc:0"Государство, основанное Принцессой осуждения, уже опередило любой другой режим в этом мире. Республика, Федерация, Союз — ни одно из этих слов не может описать характер этого государства. Поэтому, по предложению нескольких художников, Принцесса осуждения решила назвать его Пионерским государством. Новое имя означает новое начало для народа.\nДа здравствует §RПионерское государство Вечной Ночи§W!"
establishment_of_the_holy_republic_of_Mondstadt:0"Основание Священной Республики Мондштадт"
establishment_of_the_holy_republic_of_Mondstadt_desc:0"Диона считает, что мы можем создать священную конфедерацию под покровительством великого Барбатоса, в которой все политические образования будут помогать друг другу в развитии и войне. Название этой конфедерации — §BСвященная Республика Мондштадт§W."
establishment_of_the_free_federal_of_Mondstadt:0"Основание Свободной Федерации Мондштадта"
establishment_of_the_free_federal_of_Mondstadt_desc:0"По предложению Рэйзора будет создана более централизованная, но по-прежнему ориентированная на защиту личных свобод граждан федерация под названием §BСвободная Федерация Мондштадта (СФМ)§W. Многие сомневаются, как долго это государство сможет сохранять стабильность, но мы докажем им это на деле."
In_the_Wolfendom:0"В Вольфендоме..."
In_the_Wolfendom_desc:0"В горах и лесах Вольфендома произошло нечто странное, многие животные были встревожены. Чтобы выяснить причину, Рэйзор с волчьей стаей начал расследование."
Some_Strange_guys_wandering:0"...бродят странные люди"
Some_Strange_guys_wandering_desc:0"В горах Вольфендома Рэйзор увидел тысячи оборванных людей, тащивших свои семьи. Они были мрачны, их тела опухли от недоедания. Что же произошло?"
connect_with_refugee:0"Связаться с беженцами"
connect_with_refugee_desc:0"После долгих размышлений Рэйзор решил сам связаться с этой группой, которая могла нарушить покой Вольфендома, чтобы узнать, что происходит. Со стороны людей были отправлены двое: Беннет и Фишль. Эти обладатели Глаза Бога пользовались авторитетом среди беженцев."
expel_mankind:0"Изгнать людей"
expel_mankind_desc:0"Мы не можем принять этих людей. Их присутствие может привлечь внимание военачальников, которые раньше не интересовались Вольфендомом. Это просто навлечь беду на свою голову."
receive_mankind:0"Принять людей"
receive_mankind_desc:0"Хотя Рэйзор вырос среди волков, его доброта превосходит человеческую. Он не мог выгнать этих беженцев, обрекая их на скитания по охваченному войной Мондштадту. Поэтому он решил оставить их."
deal_with_refugees_problem:0"Решение проблемы беженцев"
deal_with_refugees_problem_desc:0"Вслед за группой Беннета и Фишль в Вольфендом прибывали и другие группы беженцев. Рэйзор, Беннет и Фишль, как «хозяева» земли, общались с ними и заключали соглашения. В ходе общения и совместной жизни они определили основные проблемы беженцев: нехватка еды, жилья и управления. Они не знали, смогут ли решить их, но решили попытаться."
build_housing:0"Строительство жилья"
build_housing_desc:0"В Вольфендоме не было нормального жилья, не хватало даже палаток. В таких условиях беженцам приходилось не только терпеть ночной холод, но и подвергаться нападениям диких зверей. Единственным решением было мобилизовать беженцев на строительство жилья. Раз уж мы взяли на себя ответственность, нужно начинать действовать. Однако по поводу конкретных методов Беннет и Фишль предложили разные планы..."
Bennett_simple_designation:0"Беннет: Упрощённый дизайн"
Bennett_simple_designation_desc:0"Беннет предложил проект жилья с низкими затратами материалов, лёгкого в сборке и достаточно качественного, который он видел в одном журнале. Если использовать его, мы сможем быстрее решить проблему с жильём."
Fischl_revolutionary_ideas:0"Фишль: Революционная идея"
Fischl_revolutionary_ideas_desc:0"Фишль предложила особый дизайн, основанный на планировке зданий, а не на конструкции каждого дома, что также экономит время и материалы. Это «интегрированное жильё». Фишль считает, что беженцам «из-за энтропии этого мира и изменчивости судьбы, только объединившись друг с другом, можно выжить» (Оз: «Им придётся оставаться в Вольфендоме надолго, такая планировка поможет им в совместной работе в будущем»)."
primary_organization:0"Первичная организация"
primary_organization_desc:0"В Вольфендоме царила полная анархия, и её последствия уже проявились: беженцы начали делить свои поселения, несколько дней назад две группы даже воевали за воду, а внутри некоторых поселений начались грабежи. Нам нужно положить конец этому хаосу и создать базовое правительство на принципах сотрудничества, чтобы защищать слабых и направлять людей к совместному решению проблем. Но каким должно быть это правительство?"
Fischl_thoughts_of_organization:0"Фишль: Организационная концепция"
Fischl_thoughts_of_organization_desc:0"Фишль хотела «найти людей из низов, обладающих талантом, и сделать их подданными принцессы» (Оз: «Отбирать администраторов и представителей поселений из людей с низким происхождением, но достаточным образованием, чтобы они были ближе к народу и обладали необходимыми способностями»)."
attract_external_ideologue:0"Привлечение внешних мыслителей"
attract_external_ideologue_desc:0"Создание правительства из анархии — явление редкое в новейшей истории. Фишль решила использовать свою репутацию издательницы романов, чтобы привлечь знакомых мыслителей, «убив двух зайцев: они станут моими подданными, что есть высшая честь!» («В обмен на возможность частично реализовать свои идеи мы получим помощь и сможем восполнить нехватку административных кадров»)."
centralize_our_command:0"Централизация командования"
centralize_our_command_desc:0"Угрозу представляют не только дикие звери, но и возможные нападения военачальников. Поэтому мы должны создать элитные войска под прямым контролем правительства. Это не означает, что мы оставим поселения на произвол судьбы. После обучения эти войска будут направлены для защиты от зверей по всему Вольфендому, что не только повысит их боевой дух, но и укрепит популярность нашего временного правительства."
develop_our_production:0"Развитие производства"
develop_our_production_desc:0"Люди должны есть, и есть много. Всё общество строится на этой основе, и мы не исключение. Чтобы обеспечить беженцев достаточным количеством еды, нам нужно обучить их производственным навыкам и найти способы получения инструментов. Первым делом мы займёмся охотой и собирательством, так как эти виды деятельности дают быстрый результат и могут решить насущные проблемы. Что касается обучения и получения инструментов, у нас есть несколько вариантов..."
Bennett_support_ourselves:0"Беннет: Самообеспечение"
Bennett_support_ourselves_desc:0"Беннет уже участвует в массовом производстве инструментов в общинах. Мы сами изготовим инструменты, а затем выберем опытных людей для обучения неопытных, доказав, что мы можем прокормить себя. Однако если мы сосредоточим все усилия на этом, у нашего небольшого правительства не останется сил на другие дела."
organize_collective_production:0"Организация коллективного производства"
organize_collective_production_desc:0"Охота и собирательство дают нам достаточно еды, но мы не можем полагаться на них вечно, ведь дикие животные и ягоды рано или поздно закончатся, а конфликты за пределами Вольфендома могут продолжаться долго. Кроме того, нам нужны не только еда, но и одежда, бумага и даже алкоголь... Единственный способ решить эти проблемы — развивать земледелие.\nХотя наши жители живут разрозненно, сельскохозяйственное производство не должно быть таковым. Мы должны централизовать производство и распределять продовольствие в зависимости от вклада каждого поселения. Это повысит эффективность использования воды и удобрений, сократит расход ресурсов и сэкономит наши ограниченные средства. Однако централизация ставит новые вопросы: как измерить вклад в сельскохозяйственное производство? Существуют разные мнения, но эффективность покажет только практика."
Fischl_call_for_foreign_aid:0"Фишль: Призыв к внешней помощи"
Fischl_call_for_foreign_aid_desc:0"Конечно, производство инструментов необходимо, но каждая минута, потраченная на это, откладывает производство продовольствия и продлевает голод. Поэтому мы должны выделить ресурсы на пропаганду за пределами Вольфендома, используя истории, фотографии и... определённую долю театральности, чтобы собирать пожертвования и получать помощь в виде инструментов и продовольствия. Это тоже делается ради беженцев Вольфендома."
introduction_of_advanced_tools:0"Внедрение передовых производственных инструментов"
introduction_of_advanced_tools_desc:0"Ради долгосрочной выгоды и удовлетворения потребностей большего числа людей нам необходимо постепенно переходить от примитивной охоты и собирательства к земледелию, но сейчас мы не можем сокращать вложения в охоту и собирательство. Чтобы максимально сэкономить ресурсы, мы внедрим передовые конструкции производственных инструментов извне."
full_up_and_warm:0"Утоление голода и жажды"
full_up_and_warm_desc:0"После всестороннего обсуждения и совместной работы мы наконец-то решили проблему питания беженцев. Хотя выбор блюд не так богат, как до гражданской войны в Мондштадте, мы больше не видим людей, умирающих от голода на улицах. Угрюмые лица жителей начинают улыбаться — это свидетельство наших достижений."
centralize_our_government:0"Вертикальная организационная структура"
centralize_our_government_desc:0"Мы создадим в общинах бригады из нескольких производителей, которые будут объединяться в отряды, и так далее. Каждый будет подчиняться своему непосредственному начальнику. То же самое будет и на заводах. На этой основе мы создадим представительскую демократию, которая позволит учитывать мнение народа при сохранении высокой административной эффективности и обеспечит качественное выполнение планов производства и строительства."
peoples_commune:0"Народная коммуна"
peoples_commune_desc:0"Раньше крестьяне после завершения полевых работ часто оставались без дела. Теперь мы предложим некоторым деревням, желающим коллективизироваться, создать народные коммуны, чтобы использовать свободное время крестьян для строительства школ и каналов, что также повысит наш контроль на местах. Однако на начальном этапе люди могут не сразу привыкнуть к этой системе, поэтому мы будем двигаться постепенно, создавая эффективные механизмы контроля и оценки вклада, и обеспечивая достаточные запасы продовольствия для коммунальных столовых."
large_scale_intensive_production:0"Крупномасштабное интенсивное производство"
large_scale_intensive_production_desc:0"Мы создадим крупные государственные фермы на обширных равнинах, где не нужно будет беспокоиться о том, что затраты на топливо для тракторов и комбайнов превысят прибыль. Здесь будет легче внедрять передовые методы производства, а работники станут не крестьянами, а сельскохозяйственными рабочими. Если на начальном этапе создания правительства мы уже делали подобные попытки, это поможет повысить эффективность государственных ферм."
unified_goverment_benefits:0"Единые государственные льготы"
unified_goverment_benefits_desc:0"Теперь, когда наш бюджет позволяет, пришло время предоставить населению не только еду и жильё, но и другие гарантии. Мы введём пенсии, базовый доход и медицинское страхование. Пусть они уступают тем, что есть в сильных державах, но это вопрос принципа. К тому же, создав основу, мы сможем легко повышать уровень благосостояния в будущем, в нашей системе это почти неизбежно. Нам, пожалуй, стоит беспокоиться о будущем бюджете..."
first_MNPC:0"Первое Всеобщее собрание народных представителей Мондштадта"
first_MNPC_desc:0"Почти тысяча народных представителей со всего Мондштадта, от шумных городов до тихих лесов и суровых гор, собрались, чтобы отдать свои голоса за будущее Мондштадта. Такие собрания будут проводиться регулярно, не мешая производству. Они станут основой легитимности правительства Беннета и будут определять каждый ключевой поворот в судьбе Мондштадта. Теперь решим будущее Мондштадта!"
sprinkle_roses_all_over_the_world:0"Посыпать землю розами"
sprinkle_roses_all_over_the_world_desc:0"В прошлом, когда мы начинали экспериментировать с беспрецедентными системами, многие сомневались. Теперь, благодаря нашей непоколебимой воле, гибкости и способности учиться, мы преодолели все трудности, и критики замолчали. Теперь мы распространим эту успешную систему на весь Мондштадт. Нас ждут новые, невиданные ранее трудности, но если мы сохраним единство и будем неустанно искать и совершенствоваться, мы обязательно добьёмся успеха."
establishment_of_the_liberated_zone_of_Mondstadt:0"Создание Освобождённой зоны Мондштадта"
establishment_of_the_liberated_zone_of_Mondstadt_desc:0"То, что сейчас стоит на земле Мондштадта, уже не традиционное государство, а великое содружество. Если вы спросите, как назвать нынешний Мондштадт, то это — §R«Освобождённая зона Мондштадта»§W."
flat_management:0"Плоская организационная структура"
flat_management_desc:0"Некоторые считают, что вертикальная структура неизбежно приводит к ошибкам в планировании и искажению воли народа, поэтому мы сохраним плоскую структуру, даже если это может привести к другим проблемам. По сравнению с другими моделями, такая структура сокращает бюрократию и более гибка, позволяя быстро адаптироваться к изменениям."
all_Mondstadt_federation_of_labor_union:0"Все факелы в одних руках"
all_Mondstadt_federation_of_labor_union_desc:0"Мы построим экономику, основанную на планировании снизу вверх. В нашей системе не только высшее руководство может предлагать планы, но и рабочие, и потребители могут вносить предложения по изменению планов, влиять на кадровые назначения и внедрять новые технологии. Такая экономика может быть менее эффективной, но она точно будет больше соответствовать нуждам народа. Наше общее счастье создаётся нашими общими усилиями."
voluntary_collectivization:0"Просвещение народа"
voluntary_collectivization_desc:0"Все мы видим роль образования: оно создаёт огромный разрыв между людьми. Всякое неравенство порождает неравенство в образовании, и даже если сгладить другие неравенства, неравенство в образовании породит их вновь. Мы создадим государственные школы и вечерние школы для рабочих, чтобы дать знания тем, кто их лишён, и предоставить нашим детям больше возможностей. Это также удовлетворит потребности передовой промышленности."
Subsidies_within_local_communes:0"Местные коммунальные льготы"
Subsidies_within_local_communes_desc:0"Теперь, когда наше производство налажено, пришло время предоставить населению льготы и гарантии. Однако льготы будут не централизованными, а разработанными самими местными коммунами при финансовой поддержке центра. Мы будем осуществлять контроль, чтобы способствовать демократии."
long_live_the_commune_of_wolfendom:0"Да здравствует коммуна Вольфендома!"
long_live_the_commune_of_wolfendom_desc:0"Реформы Беннета показали первые успехи. Хотя проблем ещё много, они не больше тех, которые мы уже преодолели. В этом маленьком уголке мира произошло множество беспрецедентных чудес. Люди, живущие здесь, полны решимости и энтузиазма пробовать новое. Есть ли проблемы, которые не может решить сплочённый народ? Раз уже забрезжил свет успеха, давайте на мгновение отложим инструменты, вытрем пот и воскликнем: да здравствует новое имя этой земли — §RКоммуна Вольфендома§W!"
establishment_of_the_socialist_commonwealth_of_Mondstadt:0"Создание Социалистического Содружества Мондштадта"
establishment_of_the_socialist_commonwealth_of_Mondstadt_desc:0"Пройдя через множество реформ и преодолев бесчисленные трудности, мы наконец достигли этого. Сегодня мы провозглашаем создание §RСоциалистического Содружества Мондштадта§W.\n§RКрасное знамя развевается над землёй!"
stop_all_the_sins:0"Осуждение"
stop_all_the_sins_desc:0"Принцесса осуждения объявила о расширении «отрядов телохранителей подданных и ночных воронов» и заявила, что будет до конца проводить свою волю. Только так у Вольфендома будет светлое будущее. Хотя это заявление выглядит подозрительно, народ поддержал эти действия из-за доверия к Фишль."
directed_creation:0"Индустриальное производство искусства"
directed_creation_desc:0"Ситуационизм требует от произведений искусства не качества, а количества и охвата. Мы будем анализировать реакцию читателей на существующие произведения, выявлять популярные теги и создавать массу произведений — от романов до картин и анекдотов. Другие творцы могут создавать то, что хотят, но будьте готовы быть погребёнными под волной индустриального искусства."
judgment_to_judgment:0"Осуждение ведёт к осуждению"
judgment_to_judgment_desc:0"Наше руководство творчеством приносит первые плоды. Общественное мнение начинает формироваться, и, умело используя эту силу, мы сможем легко изменить облик общества."
save_them_all:0"Забота о всех"
save_them_all_desc:0"Насмешники называют наше правительство «правительством-нянькой», потому что помимо обычных функций мы ещё и мелочно управляем культурой, общественным мнением и идеями. Но мы не просто надоедливые няньки, мы — мать народа, которая не только воспитывает, но и даёт каждому лучшую жизнь."
peoples_princess:0"Народная принцесса"
peoples_princess_desc:0"Фишль заявляет: «Путь к ситуации — это путь вечного обновления. Чтобы достичь Сумеречного царства, каждый подданный должен раскрыть сияние своей души» (Оз: «Госпожа говорит, что она поведёт всех к лучшей жизни методом ситуационизма, и для этого нужны усилия всех»)."
bloom_together:0"Цветение вместе"
bloom_together_desc:0"Ситуационизм не создаёт иллюзию, он начинается с разрушения привычного восприятия повседневности, а для этого нужно творчество — массовое творчество. Для этого Фишль введёт политику поощрения творчества. Это не значит, что мы не будем контролировать его результаты."
Contextualism_to_Contextualism:0"Ситуация ведёт к ситуации"
Contextualism_to_Contextualism_desc:0"Всякое убеждение в мире порождается ситуацией, созданной материальной основой. Мы раскроем этот факт и вовлечём народ в создание новой, передовой ситуации. Из этого родится будущее, которое превзойдёт любую нынешнюю демократию и равенство.\nНа этом пути — пути ситуационизма — Фишль будет направлять создание новой ситуации своими популярными произведениями, ускоряя приход будущего общества."
material_base:0"Материальная основа"
material_base_desc:0"Некоторые называют ситуационизм утопией. Теперь мы опровергнем их слова конкретными мерами. После предыдущих реформ наше производство и теория заметно продвинулись, что позволяет нам одновременно улучшать благосостояние и увеличивать вложения в воспроизводство. Обычно люди сначала строят материальную базу, а затем ждут, пока духовный уровень медленно подтянется, не заботясь о тех, кто отстаёт. Мы же заставим их идти в ногу."
progress_of_the_artistic_zone_without_dawn:0"Вперёд, Художественная область Вечной Ночи!"
progress_of_the_artistic_zone_without_dawn_desc:0"Реформы увенчались успехом. Вольфендом стал более прогрессивным, передовым и совершенным! Где бы вы ни прошли, вы найдёте произведения, радующие глаз. Это доказывает, что наши слова не были пустыми. Теперь даже сама земля превратится в «спектакль», в «искусство», в инструмент ситуационизма, известный как §R«Художественная область Вечной Ночи»§W."
promote_and_appoint_squires:0"Выдвижение и назначение сквайров"
promote_and_appoint_squires_desc:0"В ходе нашего развития в каждой общине проявились талантливые и мудрые люди, которые различными способами накопили больше богатства, чем другие. Это явно доказывает их способности. Если мы передадим им часть административной власти, мы сможем сократить правительственный аппарат и эффективно управлять."
Restrain_land_annexation:0"Ускорение концентрации земель"
Restrain_land_annexation_desc:0"В ходе предыдущего развития сельского хозяйства некоторые крестьяне сами осваивали земли и обеспечивали себя. Теперь, когда сквайры получили полномочия, они начали скупать эти земли, превращая крестьян в арендаторов. В долгосрочной перспективе эта концентрация земель полезна: сквайры смогут вкладывать средства в улучшение технологий, покупать сельхозтехнику и строить ирригационные сооружения, становясь фермерами-землевладельцами. Мы добровольно и мирным путём создадим множество интенсивных ферм."
encourage_the_charitiess:0"Поощрение благотворительности"
encourage_the_charitiess_desc:0"Из-за сокращения правительственного аппарата у нас нет ресурсов для повышения благосостояния населения. Поэтому мы должны поощрять благотворительность среди тех, кто разбогател благодаря нашим предыдущим мерам. Пропаганда этого улучшит отношение населения как к нам, так и к богатым людям. Чтобы привлечь их к благотворительности, эти организации могут найти и другие способы применения, но это необходимая мера для повышения уровня жизни."
smaller_the_government_better_the_governing:0"Чем меньше правительство, тем лучше управление"
smaller_the_government_better_the_governing_desc:0"Кто может отрицать достижения нашего правительства? Сокращение бюрократического аппарата снизило административные расходы, и общество получило больше ресурсов для воспроизводства. Наша экономика процветает! Пусть это процветание продолжается!"
encourage_spirit_of_enterpreneur:0"Поощрение предпринимательского духа"
encourage_spirit_of_enterpreneur_desc:0"Диона решила повысить автономию предпринимателей, доверив процветание страны свободному рынку. Этот переход произойдёт в кратчайшие сроки. Решение было предложено советником с именем, похожим на музыкальный инструмент. По словам этого советника, при правильном и полном проведении реформ, когда всё будет отдано на откуп свободному рынку, проблемы безработицы, избытка персонала и отсталости технологий исчезнут сами собой — всемогущий рынок всё решит."
end_the_interventionism:0"Прекращение государственного регулирования рынка"
end_the_interventionism_desc:0"Регулирование рынка — это ненужное препятствие для свободного рынка. Хотя в краткосрочной перспективе оно может быть полезно для экономики, в долгосрочной — оно уступает результатам свободного рынка. Невидимая рука распределит всех и всё по своим местам. Некоторые могут сказать, что экономические кризисы, вызванные свободным рынком, уже не раз случались в истории. Но разве в каждом регионе, где происходил кризис, не было регулирующих органов? Возможно, кризисы по своей сути вызваны именно регулированием?"
private_welfare_enterprise:0"Частные социальные предприятия"
private_welfare_enterprise_desc:0"Разве частные пенсионные фонды, медицинская страховка и другие виды страхования не заслуживают большего доверия, чем государственные льготы, которые могут быть урезаны в любой момент? Нарушение предыдущих соглашений снижает прибыль компаний, поэтому в погоне за прибылью они вынуждены лучше управлять страховыми фондами. Это также сокращает расходы и размер правительства, а сэкономленные ресурсы поступают в распоряжение предприятий для инвестиций.\nЭффективность воспроизводства значительно повысилась!"
more_free_the_market_happier_the_people:0"Чем свободнее рынок, тем свободнее народ"
more_free_the_market_happier_the_people_desc:0"По сравнению с другими, закостенелыми и отсталыми системами, наша система, максимально стимулирующая экономическую активность, изобретательство и производительность, имеет очевидные преимущества. Все, кто против нас, должны ощутить это беспрецедентное процветание и сладкий, свежий воздух свободы.\n§BСвобода рынка — это свобода народа. Самый свободный рынок — самый свободный народ."
the_free_zone_of_the_spring_lives_forever:0"Свободная зона Родника, живи вечно!"
the_free_zone_of_the_spring_lives_forever_desc:0"Теперь мы достигли беспрецедентного уровня свободы. Хотя некоторые критикуют нас за «перегибы» или «откат назад», мы не обращаем на них внимания, поскольку в нашем новом обществе есть и свобода слова, будь то истина или чушь. Эта новая, освобождённая земля получит название §B«Свободная зона Родника»§W."
Bennetts_grass_root_organizations:0"Низовые организации Беннета"
Bennetts_grass_root_organizations_desc:0"Мы реализуем организационную концепцию Беннета на низовом уровне, что позволит сократить государственные расходы и повысить административную эффективность."
Grass_roots_democratic_autonomy:0"Низовая демократическая автономия"
Grass_roots_democratic_autonomy_desc:0"Децентрализация на низовом уровне разгрузит наш административный аппарат и повысит удовлетворённость населения. Конечно, чтобы избежать появления местных «князьков» и подкупа голосов, мы будем осуществлять необходимый контроль."
fischl_framework_of_the_government:0"Правительственная структура Фишль"
fischl_framework_of_the_government_desc:0"Мы реализуем концепцию Фишль по построению правительства. Более строгая организация ускорит наше развитие."
publicity_of_Contextualism:0"Пропаганда ситуационизма"
publicity_of_Contextualism_desc:0"Фишль предложила идеологию, называемую ситуационизмом. Мы попробуем интегрировать эту концепцию в нашу пропагандистскую работу, что, возможно, сделает её более эффективной."
diona_interventionism:0"Интервенционизм Дионы"
diona_interventionism_desc:0"Мы реализуем идеи Дионы в области рыночной экономики. Разумное вмешательство может ускорить работу рынка."
Collective_enterprises_participate_in_competition:0"Коллективные предприятия в конкурентной борьбе"
Collective_enterprises_participate_in_competition_desc:0"Ранее Беннет создал множество предприятий коллективной собственности, доход которых делился поровну между всеми работниками. Однако слишком комфортные условия, по-видимому, снизили их производственную активность, и многие из них стали жить за счёт государственных субсидий.\nМы сохраним коллективную собственность, но заставим эти предприятия участвовать в рыночной конкуренции для повышения эффективности."
unbreakable_union:0"Нерушимый союз"
unbreakable_union_desc:0"Наша §B«сшитая» система§W работает даже лучше, чем ожидал Рэйзор. Народ, выбравший Рэйзора своим лидером, явно не ошибся! Теперь весь Вольфендом под руководством усовершенствованного административного аппарата готов к новым вызовам. Некоторые называют нашу систему «пролезшей в щель», но каждый, кто живёт в реальности, а не на бумаге, видит её эффективность."
peoples_order:0"Народный приказ отдан..."
peoples_order_desc:0"Несколько лет назад мы были просто беспомощной толпой беженцев. Теперь же мы своими руками построили прекрасный дом и сильную армию. Сначала мы просто хотели выжить. Теперь, когда раздоры в Мондштадте не утихают, наша цель изменилась: вернуть Мондштадту мир и положить конец этой кровавой междоусобице. Это решение получило широкую поддержку.\nЕсли они не хотят мира, мы заставим их быть мирными!"
the_fate_of_the_church:0"Судьба Церкви Запада"
the_fate_of_the_church_desc:0"Церковь Запада — религиозная организация. Почему она смогла собрать такую армию в гражданской войне Мондштадта, когда Барбатос уже давно не является миру? Как бы то ни было, её время прошло. Пусть этот последний груз сломает спину верблюду."
the_fate_of_ragnvindr:0"Судьба владений Рагнвиндр"
the_fate_of_ragnvindr_desc:0"Безусловно, у многих из нас есть тёплые чувства к владениям Рагнвиндр, и несколько наших важных деятелей даже служили им. Но ради благополучия Мондштадта владения Рагнвиндр должны исчезнуть, а их земли перейти под нашу власть."
the_fate_of_the_springvale:0"Судьба Спрингвейла"
the_fate_of_the_springvale_desc:0"Теперь мы больше не нуждаемся в сотрудничестве с Спрингвейлом. Как самый слабый из наших соседей, он станет нашим первым лакомым куском..."
train_advanced_commanders:0"Обучение передовых командиров"
train_advanced_commanders_desc:0"Теперь, когда мы обновили нашу боевую доктрину, следующий шаг — внедрить её в наши войска, начиная с переподготовки командного состава. После этого у нас будет армия, способная побеждать, которая будет защищать народ Вольфендома от внешнего вторжения."
seek_the_secret_of_atoms:0"Познание тайн атома"
seek_the_secret_of_atoms_desc:0"Наши алхимики выдвинули новую теорию: если каким-то образом возбудить атомы — фундаментальные строительные блоки всей материи, можно создать оружие огромной мощности. Возможно, стоит попробовать."
develop_the_food_industry:0"Развитие консервной промышленности"
develop_the_food_industry_desc:0"Недостаточно просто собирать дикие фрукты и овощи. Нам нужно создать плантации и консервные заводы, чтобы продлить срок хранения фруктов, улучшить питание населения и увеличить налоговые поступления."
Bennett_theory_of_reciprocity:0"Беннет: Теория взаимопомощи"
Bennett_theory_of_reciprocity_desc:0"Беннет считает, что раз наше правительство построено на принципах сотрудничества, то и в процессе, и в результате мы должны придерживаться сотрудничества. Население Вольфендома достаточно мало, чтобы мы могли создать даже правительство прямой демократии. Конечно, в этом правительстве должны быть люди, обладающие решающим голосом, для повышения эффективности."
plans_of_large_scale_camps:0"План создания крупных лагерей"
plans_of_large_scale_camps_desc:0"Проведя необходимые переговоры и выплатив компенсации, многие поселения беженцев согласились объединиться в несколько крупных лагерей. Концентрация лагерей упрощает распределение ресурсов и использование рабочей силы, что, безусловно, повысит эффективность решения проблемы беженцев."
ANR_dispersive_communes:0"Децентрализованные коммуны"
ANR_dispersive_communes_desc:0"В наших не столь многочисленных землях не нужна громоздкая административная структура. Мы создадим органы управления в каждой коммуне, которые будут подчиняться непосредственно нам. Децентрализация также уменьшит конфликты и расширит зону охоты и собирательства."
peoples_milltia:0"Сельские ополченцы"
peoples_milltia_desc:0"В настоящее время у Вольфендома нет ресурсов для содержания профессиональной армии. Мы создадим отряды ополчения в каждом поселении для защиты от диких зверей. В свободное от производства время они будут проходить коллективную подготовку. В нужный момент — а он, возможно, уже близок — они будут мобилизованы для решения других проблем."
Integrated_building:0"Интегрированное строительство"
Integrated_building_desc:0"Проект Фишль начал воплощаться в жизнь. Теперь, проходя мимо этих больших зданий, можно услышать смех и радость многих семей... Конечно, иногда возникают и споры, но мы надеемся, что они решатся сами, так как наши административные ресурсы уходят на строительство новых домов."
all_live:0"Удовлетворение потребностей в жилье"
all_live_desc:0"Хотя жильё, вероятно, уступает тому, что было у беженцев до войны, теперь у нас достаточно домов, чтобы разместить напуганных людей. В тёплых комнатах они могут укрыться от холода и вместе мечтать о будущем."
basic_framework_of_administration:0"Базовые административные рамки"
basic_framework_of_administration_desc:0"После долгих усилий нам удалось преодолеть недоверие беженцев и создать базовый административный аппарат для решения проблем, примирения конфликтов, организации производства и распределения результатов, а также приёма новых беженцев. Если поток беженцев продолжится, нам, возможно, придётся расширять штат администраторов."
receive_more_refugee:0"Приём новых беженцев"
receive_more_refugee_desc:0"Пока мы решали внутренние проблемы Вольфендома, число беженцев снова резко возросло. Что случилось?"
external_changes:0"Изменения во внешнем мире"
external_changes_desc:0"Признаки войны становятся всё более очевидными... Именно поэтому сюда прибывает так много беженцев. Мы тоже вряд ли сможем остаться в стороне от войны — военачальники могут позариться на наши залежи кристаллов и накопленную рабочую силу. Если мы хотим сохранить этот последний уголок мира, нужно готовиться уже сейчас."
prepare_for_protecting_our_border:0"Подготовка к защите границ"
prepare_for_protecting_our_border_desc:0"Оборонительные сооружения значительно облегчат нам защиту. Вопрос лишь в том, где их строить. У нас есть три варианта: построить простые укрепления по всей границе; возвести прочные укрепления в нескольких ключевых точках; и ещё одна идея — построить оборонительные линии внутри Вольфендома для ведения гибкой обороны."
organize_defensive_armies:0"Организация сил самообороны"
organize_defensive_armies_desc:0"Без солдат не может быть и речи о защите Вольфендома. Это уже стало очевидным для всех, кто понимает ситуацию. Однако, даже имея достаточно солдат, какой доктриной мы будем руководствоваться? Если боевая доктрина будет запутанной, сражения могут обернуться катастрофой..."
trade_with_g:0"Торговля с владениями Гуннхильдр"
trade_with_g_desc:0"Очевидно, что Вольфендом не может производить всё необходимое самостоятельно. Мы наладим торговлю с владениями Гуннхильдр, обменивая наши излишки на то, что мы не можем произвести."
hunt_in_ruin:0"Охота в Руинах Урагана"
hunt_in_ruin_desc:0"Хотя у нас уже достаточно продовольствия, его запасы никогда не бывают лишними. В Руинах Урагана водится много диких животных; превратив их в стратегический запас, мы сможем значительно успокоить население."
dangerous_springvale:0"Спрингвейл — между молотом и наковальней"
dangerous_springvale_desc:0"Спрингвейл, как и мы, сталкивается с множеством угроз. Возможно, переговоры с ними и заключение договора о взаимной защите снизят риски."
Bennett_Asymmetric_warfare:0"Беннет: Асимметричная война"
Bennett_Asymmetric_warfare_desc:0"Беннет предложил концепцию асимметричной войны: Вольфендом не способен на равных противостоять другим силам, поэтому мы должны использовать все доступные ресурсы и сражаться в горах и лесах."
invite_diona:0"Приглашение Дионы"
invite_diona_desc:0"По мере углубления нашего сотрудничества с Спрингвейлом мы поняли, что простого взаимного обеспечения безопасности недостаточно. Нам нужно тесно координировать наши действия, а для этого — объединить административные органы, или, по крайней мере, создать тесную связь между ними. Первый шаг к объединению — пригласить Диону на должность в нашем правительстве."
integrate_springvale:0"Интеграция Спрингвейла"
integrate_springvale_desc:0"Вся подготовка завершена, мы готовы к объединению с Спрингвейлом. Всё ради нашей безопасности."
firepower_deterrence:0"Диона: Огневое сдерживание"
firepower_deterrence_desc:0"Диона считает, что одной пассивной обороной врага не остановить. Нужно нанести ему достаточно большие потери — как с помощью отвратительного вина заставить человека бросить пить, чтобы цена атаки превысила выгоду. Только тогда враг остановится."
Fischl_soldier_initiative:0"Фишль: Солдатская инициатива"
Fischl_soldier_initiative_desc:0"Фишль утверждает, что война хоть и ведётся оружием, но побеждают люди. Мы должны проводить агитацию и обучение, чтобы каждый солдат понимал, за что он сражается, развивать его волю и убеждения. Такие солдаты могут сыграть решающую роль."
Bennett_large_scale_fortressization:0"Беннет: Крупномасштабная фортификация"
Bennett_large_scale_fortressization_desc:0"Беннет считает, что поселения людей разбросаны по всему Вольфендому, и враг, куда бы он ни напал, нанесёт ущерб народу. Мы должны защищать всю границу, чтобы обезопасить людей за нашей спиной."
Fischl_elastic_defense:0"Фишль: План эластичной обороны"
Fischl_elastic_defense_desc:0"Фишль предложила стратегию: при мощном натиске противника наше отступление на начальном этапе неизбежно. Но, продвинувшись вперёд, враг истощится и растянет свои коммуникации. В этот момент мы сможем нанести ему большие потери и вернуть утраченные позиции. Она назвала эту тактику эластичной обороной."
diona_defend_important_areas:0"Диона: Защита ключевых районов"
diona_defend_important_areas_desc:0"Диона считает, что в ходе войны наши границы неизбежно сожмутся — ведь их трудно защищать. Она предлагает заранее подготовить оборону внутри Вольфендома, чтобы враг не уничтожил наши войска ещё на границе."
conscription_from_refugees:0"Призыв беженцев"
conscription_from_refugees_desc:0"Если начнётся война, беженцам, прибывшим к нам, будет некуда отступать. Чтобы предотвратить такой сценарий, все трудоспособные мужчины Вольфендома будут призваны для защиты своего нового дома."
moblize_the_whole_state:0"Мобилизация всей страны"
moblize_the_whole_state_desc:0"Если начнётся война, беженцам, прибывшим к нам, будет некуда отступать. Чтобы предотвратить такой сценарий, каждый житель Вольфендома должен усилить производство для приближающейся войны."
give_up_fantasy_and_prepare_for_struggle:0"Отказ от иллюзий, подготовка к борьбе"
give_up_fantasy_and_prepare_for_struggle_desc:0"Когда мы только начали готовиться к обороне, некоторые ещё надеялись, что война обойдёт Вольфендом стороной. Но теперь уже никто не сомневается в её неизбежности. Пора отказаться от иллюзий. Прятаться в углу и молиться Барбатосу бесполезно, война всё равно придёт. Трусость не только постыдна, но и бесполезна.\nБудьте готовы, отбросьте наивные надежды, готовьтесь защищать свой дом и близких!"
large_influx_of_refugees:0"Массовый приток беженцев"
large_influx_of_refugees_desc:0"Наша подготовка к самозащите привлекла ещё больше беженцев. Это дало нам дополнительную рабочую силу, но и создало дополнительную нагрузку на наш административный аппарат."
for_homeland_behind:0"За Родину!"
for_homeland_behind_desc:0"В охваченном хаосом Мондштадте Вольфендом остался последним местом, где люди могут жить в мире. Здесь, прислушавшись, можно услышать, как трудолюбивые жители радостно беседуют и работают. Если и этот уголок будет уничтожен войной, нам некуда будет идти, а всё, что мы построили, обратится в прах. Ради нашего нового дома — объединимся и дадим отпор врагу!"
for_relatives_behind:0"За наших близких!"
for_relatives_behind_desc:0"Во время раскола Мондштадта множество семей бежало в Вольфендом. Теперь, выглянув в окно, можно увидеть играющих детей. Если Вольфендом будет уничтожен, где наши близкие найдут покой? Ради них — объединимся и дадим отпор врагу!"
survive_in_struggle:0"Выжить в борьбе"
survive_in_struggle_desc:0"Мы отличаемся от врага: мы идём на войну не чтобы убивать, а чтобы защищать. Мы докажем врагу свою силу, покажем другим силам свою мощь — в этом наше выживание."
find_significance_in_struggle:0"Найти смысл в борьбе"
find_significance_in_struggle_desc:0"Если каждый солдат на передовой не будет понимать, за что он проливает кровь, то никакие пушки и укрепления не помогут.\nУ каждого из нас, пришедших на поле боя, была своя жизнь и свои идеалы. Но теперь всех нас объединяет общая цель: защитить наш мир, наше будущее и плоды нашего труда."
look_for_freedom_in_struggle:0"Обрести свободу в борьбе"
look_for_freedom_in_struggle_desc:0"В течение последнего года жители Вольфендома жили в обществе, кардинально отличающемся от прежнего. Это общество, основанное на сотрудничестве, а не на угнетении, было не только нашим личным опытом, но и тем, чего никогда не видел мир, — свободой более высокого порядка, чем в прошлом Мондштадте. Всё больше людей осознавали себя хозяевами этой земли. Теперь, ради защиты этой свободы, мы сделаем всё возможное и сразимся с врагом у подножия трона Барбатоса."
find_solidarity_in_defence:0"Обрести единство в обороне"
find_solidarity_in_defence_desc:0"В отличие от других сил, которые гонят солдат как скот, наши воины видят вокруг себя высокий боевой дух товарищей. Общая цель создаёт основу для единства. Теперь наши солдаты могут планировать боевые операции даже втроём. Их подвиги, не нуждаясь в пропаганде, уже известны всему Вольфендому. Это единство вдохновляет не только фронт, но и весь тыл.\nВооружайтесь, граждане!"
make_progress_in_defence:0"Сделать шаг вперёд в обороне"
make_progress_in_defence_desc:0"В ходе войны вскрылись многие проблемы нашей армии: устаревшее вооружение, плохая организация, отсталая тактика. Обнаружив свои недостатки, мы должны их исправить — ради победы и ради жизней тысяч солдат на фронте."
look_for_peace_in_struggle:0"Обрести мир в борьбе"
look_for_peace_in_struggle_desc:0"Мы должны всегда помнить: мы воюем не за территории и не за богатства, мы воюем за мир. Все наши действия должны быть направлены на спасение жизней людей и защиту Вольфендома."
we_have_only_two_kinds_of_future:0"У нас только два варианта будущего"
we_have_only_two_kinds_of_future_desc:0"Реальность сурова. Чтобы защитить всё созданное нами в прошлом, мы не должны отступать ни на шаг. После этой войны никто больше не посчитает Вольфендом пристанищем трусов. Они поймут: мы пришли сюда не из страха и не для бегства. Единственный способ доказать свою храбрость и волю, единственный путь к победе — это сражение!"
they_are_victory_or_death:0"Или победа, или смерть"
they_are_victory_or_death_desc:0"Кажется, мы приближаемся к смерти, но если присмотреться, то можно увидеть свет победы. Артиллеристы, к бою! Мы идём к победе!"
death_doesnt_belongs_to_free_people:0"Смерть не для свободных людей"
death_doesnt_belongs_to_free_people_desc:0"Путь к победе ясен! После упорной борьбы наша армия стала элитной, наше правительство окрепло, наша промышленность процветает. Враг склонил голову и заговорил о мире. Это слава Вольфендома, слава фронтовиков и тружеников тыла!\n§RКаждый из нас, жителей Вольфендома, — герой!"
very_large_scale_refugees:0"Огромный приток беженцев"
very_large_scale_refugees_desc:0"Пока народ праздновал победу, а правительство ликвидировало последствия войны, поток беженцев в Вольфендом резко возрос. Очевидно, люди поверили, что Вольфендом может обеспечить им безопасность. Для решения этой проблемы был созван очередной совет."
unavoidable_divergence:0"Неизбежные разногласия"
unavoidable_divergence_desc:0"Перед лицом этой ситуации лидеры выдвинули свои планы — все они, возможно, эффективны, но несовместимы друг с другом. Наша существующая система управления на основе консенсуса становится всё менее эффективной по мере роста Вольфендома. Возможно, пришло время избрать абсолютного лидера. Скоро начнутся всеобщие выборы."
fischl_become_leader:0"Лидерство Фишль"
fischl_become_leader_desc:0"За прошедшие годы Фишль проявила свой неординарный талант и способность мыслить на шаг вперёд. Её прошлые успешные инициативы принесли победу этой эксцентричной, но доброй художнице на выборах. Её программа заключалась в дальнейшей централизации административного аппарата — как в настоящем государстве. Но, помимо этого, у неё были и другие удивительные идеи, которые она называет §R«ситуационизм»§W и §g«акселерационизм»§W."
bennett_become_leader:0"Лидерство Беннета"
bennett_become_leader_desc:0"Как известный лидер низового уровня, Беннет продемонстрировал необычайную стойкость и мужество во время войны, сражаясь бок о бок с солдатами и успешно разрешая гражданские споры. Этот неудачливый, но стойкий бывший искатель приключений завоевал сердца людей. После победы на выборах он пообещал повести Вольфендом к §R«более справедливому обществу»§W."
diona_become_leader:0"Лидерство Дионы"
diona_become_leader_desc:0"Идеи Фишль и Беннета казались слишком радикальными, а Рэйзор, не полностью понимающий обычаи людей, мог ли стать лидером? Так думали те, кто выбрал Диону. Диона пообещала сократить правительственный аппарат, вернуть власть народу и дать людям §Bбольше свободы§W."
razor_become_leader:0"Рэйзор: Консолидация консенсуса"
razor_become_leader_desc:0"Рэйзор, храбрый воин, который раньше странствовал с волчьей стаей в горах, вырос и стал надёжным лидером. Он нашёл общие черты в идеях каждого и был избран теми, кто хотел сохранить §Bсистему переговоров§W, надеясь, что он сможет сохранить стабильность и гармонию."
the_concept_of_communes:0"Концепция коммун взаимопомощи"
the_concept_of_communes_desc:0"По замыслу Беннета, правительство преобразует Вольфендом, создав новую социальную структуру на основе существующей — структуру, основанную на взаимопомощи. До гражданской войны Мондштадта такие идеи могли бы показаться слишком радикальными, но теперь каждый готов их попробовать."
Contextualist_nation:0"Ситуационистское государство"
Contextualist_nation_desc:0"Фишль претворит в жизнь свою идею — создать «ситуационистское» государство. Нарисованное ею будущее кажется некоторым консерваторам ужасным, и некоторые из них могут прибегнуть к крайним мерам. Как бы то ни было, госпожа Фишль — выбор народа."
Partial_autonomy_of_villages:0"Частичная автономия общин"
Partial_autonomy_of_villages_desc:0"Политика децентрализации Дионы была хорошо встречена народом. Теперь она вступает в должность лидера и переименовывает должность лидера в «президент». Уже само её избрание вызвало экономический подъём. Начнём реформы!"
each_do_its_best:0"Каждый по способностям"
each_do_its_best_desc:0"Если у нас общая цель, у нас всегда есть возможность для сотрудничества. Народ хочет видеть единое, а не раздробленное правительство. Что касается того, как сотрудничать, нам нужно ещё много обсуждать. Постараемся понять друг друга."
the_fate_of_g:0"Судьба владений Гуннхильдр"
the_fate_of_g_desc:0"Долгое время мы находились в окружении владений Гуннхильдр. Пришло время прорвать блокаду."
the_fate_of_dragonspine:0"Судьба Драконьего хребта"
the_fate_of_dragonspine_desc:0"Научная экспедиция на Драконьем хребте сохраняла нейтралитет во время гражданской войны, но, похоже, у них тоже есть амбиции. Они постоянно ведут переговоры о сотрудничестве с другими странами, позволяя иностранному влиянию проникать в Мондштадт. Пора положить конец их безрассудству."
the_fate_of_lawrence:0"Судьба владений Лоуренс"
the_fate_of_lawrence_desc:0"Владения Лоуренс — именно они были зачинщиками гражданской войны. Это они, старые аристократы, предали страну и вступили в сговор с Фатуи, ввергнув Мондштадт в пучину войны. Даже сейчас, когда старые аристократы и Фатуи изгнаны, новый лидер владений Лоуренс, Эола, продолжает упорствовать в войне, день за днём создавая новых беженцев — таких, как мы. Пусть их смешное прошлое и смешные цели будут похоронены вместе с ними!"
the_fate_of_Stormterrors_Lair:0"Судьба Логова Урагана"
the_fate_of_Stormterrors_Lair_desc:0"Логово Урагана — это пустынная земля, где неожиданно появилась странная сила. На пути к объединению Мондштадта мы должны пройти и через неё."
the_fate_of_knights:0"Судьба Ордена Рыцарей"
the_fate_of_knights_desc:0"Орден Рыцарей когда-то был единственным законным правительством Мондштадта, но эта гражданская война показала, что они не способны защитить народ. Теперь скажите им, кто является единственным законным правительством Мондштадта!"
the_idea_of_fun_palace:0"Концепция Дворца веселья"
the_idea_of_fun_palace_desc:0"В ознаменование победы мы построим множество зданий, названных Фишль «Дворцами веселья». Это не дворцы и не просто достопримечательности, а открытые «ситуационные театры». Люди здесь не пассивные зрители, а активные участники ситуаций. Таким образом, мы сможем не только предоставить людям место для отдыха, но и разрушить их привычный уклад жизни, стимулируя их самостоятельность."
raise_the_flag_of_freedom:0"Поднять знамя свободы"
raise_the_flag_of_freedom_desc:0"Истинная свобода пришла из Свободной зоны Родника. Благодаря выдающейся стратегии наших командиров и щедрой поддержке тех, кто финансировал эту объединительную войну, мы одержали победу. Это доказывает превосходство нашей нынешней §B«свободной системы»§W. Давайте всегда поднимать знамя §Bлиберализма§W и двигаться к следующей цели!"
unbreakable_alliance:0"Неуничтожимый союз"
unbreakable_alliance_desc:0"В Вольфендоме наша политика строилась на переговорах между лагерями. Теперь, объединив Мондштадт, наша политика основана на переговорах между владениями. Если кто-то сомневается, что у нас нет опыта управления такой большой страной, мы не будем отрицать. Но наш прошлый опыт не был бесполезен; мы будем опираться на него и двигаться дальше. Дух §Bсотрудничества§W никогда не устареет."
Contextualist_Manifesto:0"Манифест ситуационизма"
Contextualist_Manifesto_desc:0"«Против спектакля, ситуационистская культура принесёт всеобщее участие...»\n«Против сохранившегося искусства, оно есть организация непосредственных моментов существования...»\n«На высшей стадии каждый станет §Rхудожником§W...»\n«...Мы создадим последнее искусство в истории.»"
establishment_of_the_Immernachtreich:0"Основание Сумеречного царства"
establishment_of_the_Immernachtreich_desc:0"§g...Тишина."
promote_the_wolfendomic_model:0"Продвижение вольфендомской модели"
promote_the_wolfendomic_model_desc:0"Дух сотрудничества и переговоров пронижет все уровни нашей административной организации и коснётся каждого жителя Мондштадта. Каждый человек сможет нести ответственность и пользоваться своими правами — это основа великого государства."
spread_the_sound_of_freedom:0"Распространение звуков свободы"
spread_the_sound_of_freedom_desc:0"Теперь становится ясно, что похвала нашей системе была даже слишком скромной. Наш §Bлиберализм§W — это вопрос не успеха или неудачи, а огромного или просто большого успеха. Теперь мы провозгласим свою победу всему миру, а заодно и победу нашей §Bлиберальной системы§W, и, если понадобится, объясним миру, что такое §Bсвобода§W."
establishment_of_Free_Enterprise_Consortium:0"Создание Консорциума свободных предприятий"
establishment_of_Free_Enterprise_Consortium_desc:0"С расширением торговли, ростом производства и увеличением масштабов предприятий всё больше социальных функций переходит в руки корпораций, и необходимость в правительстве отпадает. Теперь мы полностью упраздним этот институт, лишь растрачивающий ресурсы общества, и передадим всё в руки великого свободного рынка. Так рождается беспрецедентный союз — §BКонсорциум свободных предприятий§W.\nРеклама предоставлена виноградником «Рассвет», подробности по телефону..."
begin_to_plan_our_development:0"Начало планирования развития"
begin_to_plan_our_development_desc:0"В процессе решения проблем мы обрели способность контролировать ситуацию. Если до войны ещё есть время, мы можем использовать его для саморазвития."
literacy_campaign:0"Кампания по ликвидации неграмотности"
literacy_campaign_desc:0"Уровень образования прибывающих в Вольфендом людей различен. Мы используем ранее отобранные кадры для проведения массовой кампании по ликвидации неграмотности, необходимой для дальнейшего развития производства."
develop_our_industry:0"Развитие промышленного производства"
develop_our_industry_desc:0"Теперь у нас есть сельское хозяйство и горнодобывающая промышленность, но мы не можем вырастить железный котёл или выкопать из горы зубную щётку. Нам нужна промышленность для удовлетворения множества потребностей народа... а также нужд нашей армии."
spread_our_sounds:0"Распространение нашего голоса"
spread_our_sounds_desc:0"Если крикнуть в ущелье, услышишь эхо; если заниматься пропагандой, получишь отклик. Призывы о помощи могут принести нам значительную поддержку в краткосрочной перспективе. Также нам нужна пропаганда для реализации нашей политики приёма беженцев."
promote_the_reformation_of_our_armies:0"Содействие реформе армии"
promote_the_reformation_of_our_armies_desc:0"Наша армия, созданная на скорую руку, далека от профессиональной. Чтобы она могла противостоять регулярным войскам внешнего мира, нам нужно больше тренировок и передовое боевое мышление."
recruit_alchemist:0"Наём алхимиков"
recruit_alchemist_desc:0"Чтобы повысить эффективность производства, необходимо внедрять передовые технологии. Первым шагом к внедрению является обладание ими. Для получения более совершенных технологий мы наберём алхимиков — изнутри и извне. Они предоставят нам традиционные технологии Мондштадта."
recruit_engineers:0"Наём инженеров-механиков"
recruit_engineers_desc:0"Чтобы повысить эффективность производства, необходимо внедрять передовые технологии. Первым шагом к внедрению является обладание ими. Для получения более совершенных технологий мы наберём инженеров-механиков — изнутри и извне. Они предоставят нам технологии из других стран."
innovation_of_weapons:0"Инновации в вооружении"
innovation_of_weapons_desc:0"Более дешёвое и мощное оружие — залог победы, а прогресс науки даст нам такое оружие. Возможно, оно всё ещё уступает внешнему, но мы приближаемся."
innovation_of_industry:0"Инновации в промышленности"
innovation_of_industry_desc:0"Промышленное производство постоянно совершенствуется, и ключ к этому — станки и организация производства. Благодаря разработке и внедрению этих технологий наше производство станет более эффективным."
innovation_of_resources_production:0"Инновации в добыче ресурсов"
innovation_of_resources_production_desc:0"Промышленность опирается на добычу ресурсов. Инновации в добыче дадут нам больше продукции и больше удовлетворения."
innovation_of_construction:0"Инновации в строительстве"
innovation_of_construction_desc:0"Быстрое модульное строительство — это тренд, но наши архитекторы по-прежнему придерживаются старых методов, что приводит к ненужным потерям. В этом вопросе у Фишль, похоже, есть общий язык с инженерами-механиками."
long_range_magical_communication:0"Магическая связь на дальние расстояния"
long_range_magical_communication_desc:0"С помощью магии мы создали устройства для дальней связи. В них используется Электро, поэтому эта технология получила название электроники. Внедрение этих устройств сделает возможным более точное командование и разведку."
plan_of_tanks:0"План «Бак»"
plan_of_tanks_desc:0"В прошлом ополченцы с мечами были бессильны против тяжелобронированной кавалерии. Теперь кто-то выдвинул удивительную идею: ездить в большом железном ящике, прорывая вражеские порядки, с непробиваемой бронёй."
death_from_sky:0"Смерть с небес"
death_from_sky_desc:0"Все, кто видел наше новое изобретение, удивлялись чуду полёта без Глаза Бога. Теперь мы пытаемся наладить их массовое производство и использовать в войне за самооборону."
design_for_vessels_on_cider_lake:0"Проект судов для озера Сидра"
design_for_vessels_on_cider_lake_desc:0"Хотя у нас есть проекты военных кораблей, нам, честно говоря, не нужен флот, максимум — озерная флотилия. Однако эти проекты можно использовать для строительства транспортных судов, что облегчит логистику."
expand_the_researching_institution:0"Расширение исследовательских институтов"
expand_the_researching_institution_desc:0"После долгого расширения исследовательских институтов мы наконец обрели самостоятельную исследовательскую способность."
expand_the_production_of_marcasite:0"Расширение добычи марказита"
expand_the_production_of_marcasite_desc:0"Сталь — это тело современной индустрии, и её сырьё, марказит, есть и в Вольфендоме. Улучшение технологий добычи и увеличение числа рабочих повысит производство стали."
modernize_the_production_of_crystal_ore:0"Модернизация добычи кристальной руды"
modernize_the_production_of_crystal_ore_desc:0"Кристалл — особый материал, прочный и обладающий магическими свойствами. Для производства специальных сплавов мы увеличим добычу кристальной руды."
large_scale_slimes_digging:0"Крупномасштабная добыча слаймов"
large_scale_slimes_digging_desc:0"Если хиличурлы могут добывать слаймов из земли, почему мы не можем? Это гораздо быстрее, чем охота по горам. Мы проведём исследование, чтобы раскрыть секрет добычи слаймов и увеличить производство слизи."
expand_production_of_resin:0"Расширение синтеза смолы"
expand_production_of_resin_desc:0""
modernize_the_processing_of_agricultural_products:0"Модернизация переработки сельхозпродукции"
modernize_the_processing_of_agricultural_products_desc:0"Потребности народа в переработанной продукции меняются. Жители жалуются, что наши консервы имеют отвратительный запах. Мы построим новые заводы и улучшим рецептуру."
QQmanpower_power_plant:0"Электростанция на хиличурлах"
QQmanpower_power_plant_desc:0"Нам нужна энергия — много энергии, чтобы осветить наши ночи и разжечь наши очаги. У нас нет других источников, поэтому мы используем местный «специалитет» — хиличурлов."
build_railway:0"Строительство кольцевой железной дороги"
build_railway_desc:0"Произвести товары недостаточно, они не долетят до потребителей сами. Для эффективного использования продукции мы начнём строительство железной дороги. Это будет непросто, но оно того стоит."
normalize_weapon_factory:0"Стандартизация оружейных заводов"
normalize_weapon_factory_desc:0"Раньше мы производили оружие в небезопасных условиях. Теперь мы изменим это, введя стандарты и меры безопасности, что также повысит эффективность. Это касается не только военной, но и других отраслей."
attract_refugees_to_arm_factory:0"Привлечение беженцев на оружейные заводы"
attract_refugees_to_arm_factory_desc:0"Многие беженцы, прибывшие в Вольфендом, не находят работы и слоняются без дела, что создаёт социальную напряжённость. Вместо того чтобы бездельничать, пусть они пройдут обучение и работают на оружейных заводах, внося вклад в безопасность Вольфендома."
invest_in_arms_production:0"Крупные инвестиции в военную промышленность"
invest_in_arms_production_desc:0"Наши предыдущие инвестиции в другие отрасли принесли большую прибыль. Теперь мы вложим часть её в военную промышленность. Хотя она не даёт прямой прибыли, мы получим безопасность."
Positive_cycle_of_heavy_industry_development:0"Положительный цикл развития тяжёлой промышленности"
Positive_cycle_of_heavy_industry_development_desc:0"Готово! Цикл производства в тяжёлой промышленности замкнулся. Теперь, если спрос не упадёт, она будет расти сама собой."
boom_in_wolfendom:0"Вольфендомское процветание"
boom_in_wolfendom_desc:0"После упорной борьбы мы улучшили свои условия жизни и превратили эту пустынную землю в новый дом.\nМы доказываем: беженцы в Вольфендоме — не трусы, они великие строители и смелые исследователи. Вольфендом — это свободная страна, дом для смелых людей Мондштадта!"
attract_refugees:0"Успокоение беженцев"
attract_refugees_desc:0"Успокоение народа путём пропаганды — всегда часть обязанностей правительства. Правильная пропаганда успокоит людей, и они действительно обретут безопасность."
resettle_refugees:0"Расселение беженцев"
resettle_refugees_desc:0"Ситуация, когда беженцы селились в Вольфендоме хаотично, не должна повториться. Мы оптимизируем процедуру расселения, чтобы они сразу вливались в существующий порядок."
improve_management:0"Совершенствование управления"
improve_management_desc:0"Хорошая законность зависит от хорошего управления, а эффективное производство требует стабильной обстановки. У нас нет ни того, ни другого, что говорит о неэффективности правительства. Пора создавать судебную систему и систему удостоверений личности."
coordinate_our_management:0"Координация процессов"
coordinate_our_management_desc:0"Улучшать только одну часть административной системы недостаточно — это всё равно что пытаться бежать быстрее, тренируя только одну ногу. Мы проведём всестороннее улучшение административной системы и системы приёма беженцев, чтобы создать единую систему обслуживания."
call_for_the_whole_world:0"Призыв ко всему миру"
call_for_the_whole_world_desc:0"Наши трудности — это не только наши трудности, но и кризис общечеловеческой морали. Использование внешних каналов пропаганды может принести неожиданные плоды."
the_food_aid_from_knights:0"Продовольственная помощь от Ордена"
the_food_aid_from_knights_desc:0"Продовольственная помощь от Ордена Рыцарей прибыла! Из всех военачальников в гражданской войне Орден Рыцарей — самый заслуживающий доверия."
the_medical_aid_from_liyue:0"Медицинская помощь из Ли Юэ"
the_medical_aid_from_liyue_desc:0"Медицинская помощь из Ли Юэ прибыла! Врач, доставивший множество лекарств, уже разбивает лагерь и готовится к приёму пациентов."
voluntary_elites_from_sumeru:0"Добровольцы из Сумеру"
voluntary_elites_from_sumeru_desc:0"Добровольцы из Академии Сумеру прибыли, хотя они не совсем «добровольцы». В обмен на их помощь они используют условия Вольфендома для своих исследований. В конце концов, они просто бедные студенты, которым трудно найти новую тему для диссертации."
justice_of_the_whole_world:0"Справедливость всего мира"
justice_of_the_whole_world_desc:0"Крикни в ущелье — и услышишь ответ. Воззови к миру о справедливости — и справедливость придёт. Возможно, однажды и наш Вольфендом внесёт свой вклад в эту всеобщую справедливость."
mobile_war_craft:0"Маневренная война"
mobile_war_craft_desc:0"После распространения технологий Кхенри'ах и Шнежной наша тактика должна измениться. Мы сосредоточимся на перерезании путей снабжения врага и гибком маневрировании для окружения и уничтожения вражеских сил, что снизит наши потери и позволит уничтожать целые подразделения."
Fire_coverage:0"Огневое подавление"
Fire_coverage_desc:0"Вместо простого увеличения числа орудий, гибкая система управления артиллерийским огнём позволит эффективнее использовать огневую мощь, даже при ограниченной поддержке создавая у врага ощущение массированного обстрела, что подорвёт его боевой дух и организацию."
showdown_plan:0"План решающего сражения"
showdown_plan_desc:0"Медленное, но методичное продвижение может быть не самым захватывающим, но оно гарантирует наименьшие потери. Мы улучшим оборонительные сооружения пехоты, чтобы враг не мог прорвать наши линии; и разработаем детальные, но гибкие планы, нанося неожиданные удары один за другим."
military_tactics_of_the_human_sea:0"Пехота «человеческая волна»"
military_tactics_of_the_human_sea_desc:0"Война ведётся оружием, но побеждают люди. Мы максимально используем растущие людские ресурсы Вольфендома в сочетании с развитой медицинской системой, чтобы массированными пехотными атаками затруднить врагу даже отступление."
more_artillery:0"Массовое оснащение артиллерией"
more_artillery_desc:0"Основой эффективного огневого подавления является достаточное количество орудий. Стандартизация сборки ускорит производство артиллерии."
gun_aiming_training:0"Тренировка наводчиков"
gun_aiming_training_desc:0"Разница между опытным артиллеристом и новичком, который только умеет заряжать и стрелять, огромна. Чтобы превратить новичков в опытных бойцов, нужно начать с тренировок и обучения математике."
advanced_artillery_production:0"Производство передовой артиллерии"
advanced_artillery_production_desc:0"Лучшие прицелы, более износостойкие стволы, больший калибр... Пока технологии не стоят на месте, путь к усилению огневой мощи бесконечен! Так что, не прекращайте обстрелы!"
Mobility_of_motorized_infantry:0"Мобильность моторизованной пехоты"
Mobility_of_motorized_infantry_desc:0"Говорить о блицкриге в Вольфендоме было бы нереалистично, но моторизованную пехоту мы можем себе позволить, даже если её прорывная способность невелика."
breaching_of_tanks:0"Танковый прорыв"
breaching_of_tanks_desc:0"Хотя мы не можем производить много танков, мы уверены, что это будущее военной мысли. Нам нужно встать на этот путь — даже если сначала мы сможем пройти лишь немного."
more_infantry_weapons:0"Массовое производство пехотного оружия"
more_infantry_weapons_desc:0"Основа победы — обеспечение пехоты достаточным оружием и боеприпасами. Боевой дух войск держится на полных магазинах. Если мы не можем быстро расширить производство, давайте подумаем, как упростить его."
Infiltration_assault:0"Штурм с проникновением"
Infiltration_assault_desc:0"В современной войне трудно создать сплошную линию фронта, что оставляет пространство для манёвра. Развитые державы используют для этого бронетанковые войска, а мы будем использовать пехоту."
medical_preparation:0"Медицинская подготовка"
medical_preparation_desc:0"Мы не палачи, мы знаем, что наша тактика приведёт к потерям. Поэтому мы должны заранее подготовиться к лечению раненых, чтобы уменьшить их страдания."
expand_the_staff:0"Расширение штаба"
expand_the_staff_desc:0"Для более совершенного планирования, реализации и адаптации к изменениям на поле боя нам нужно больше штабных офицеров. Война — это искусство, в котором побеждает тот, кто лучше подготовлен."
Popularize_telecommunication:0"Ротационная связь"
Popularize_telecommunication_desc:0"Если наша связь с подразделениями по-прежнему будет занимать несколько часов, наши планы будут отставать от реальности. Для наилучшего планирования мы внедрим средства связи на низовом уровне."
more_trucks:0"Массовое производство грузовиков"
more_trucks_desc:0"Стандартизация деталей и модульная сборка ускорят производство грузовиков, что поддержит нашу тактику моторизации."
try_mechanized_infantry:0"Попытка механизированной пехоты"
try_mechanized_infantry_desc:0"Кто-то предложил оснастить пехоту бронетранспортёрами, создав мощную «механизированную пехоту». С развитием производства это, безусловно, станет трендом."
more_tanks:0"Конвейерная сборка танков"
more_tanks_desc:0"Именно из-за нехватки мощностей мы должны снизить себестоимость производства танков. Мы примем все возможные меры."
advanced_Trench:0"Передовые траншеи"
advanced_Trench_desc:0"Траншеи безграничны: изменение формы, оснащение огнемётами... Наши траншеи ещё далеки от идеала. Ради защиты солдат в жестокой войне, модернизируем эту технологию."
establishment_of_united_states_of_Mondstadts_people:0"Основание Соединённых Штатов Мондштадта"
establishment_of_united_states_of_Mondstadts_people_desc:0"§BСоединённые Штаты Мондштадта§W — это название нашего видения будущего Мондштадта, построенного на основе сотрудничества, то есть демократии всех владений. Нет лучшего слова, чем «Штаты», чтобы описать это государство."
build_our_homeland:0"Единодушно строить Мондштадт"
build_our_homeland_desc:0"После кровопролитной войны Мондштадт стонал от боли. Матери теряли детей, жёны — мужей, бесчисленные семьи были разрушены... Но эти несчастные люди не одиноки. Весь Мондштадт объединит усилия, чтобы залечить эти раны и открыть путь в будущее. Мы верим, что наша жизнь будет лучше, чем до войны."
centralized_plan_of_resources:0"Централизованное планирование ресурсов"
centralized_plan_of_resources_desc:0"В ходе восстановления каждое владение хорошо проявило себя, но иногда планы дублировались, и не хватало сотрудничества, что приводило к пустой трате ресурсов. Чтобы решить эту проблему, мы усилим центральную власть и централизуем ресурсы всех владений."
razors_Special_training:0"Специальная подготовка Рэйзора"
razors_Special_training_desc:0"Рэйзор — мастер ведения спецопераций. Обобщив его опыт и проведя интенсивную подготовку, мы получим подразделения спецназа, способные действовать в экстремальных условиях."
Bicycle_troops:0"Подразделения на велосипедах"
Bicycle_troops_desc:0"Есть транспортное средство, которое лучше лошади в сочетании с современным оружием и легче грузовика адаптируется к условиям Вольфендома — это велосипед. Мы создадим велосипедные подразделения, которые будут мчаться к победе на двух колёсах."
walk_towards_future:0"Рассвет Тейвата"
walk_towards_future_desc:0"Мы преодолели все трудности и привели Мондштадт к идеальному будущему. Теперь мы принесём это идеальное будущее всему Тейвату."
art_of_futurism:0"Искусство футуризма"
art_of_futurism_desc:0"Вместе с нашим развитием родилась новая форма искусства — футуризм. Его цель — на основе предыдущего развития и научных знаний прогнозировать будущее общества, чтобы контролировать и планировать процесс, лучше адаптируясь к будущему."
art_of_barbarism:0"Искусство брутализма"
art_of_barbarism_desc:0"Стиль архитектуры, который трудно назвать искусством, постепенно развивается — брутализм. Он связан с нашими реальными потребностями и представляет собой массовую, дешёвую и быструю индустриальную эстетику."
post_fordist_production:0"Постфордистское производство"
post_fordist_production_desc:0"В ходе нашей эволюции возникла производственная модель. Она основана на принципе потребительского суверенитета и представляет собой гибкую модель производства и трудовых отношений, ориентированную на удовлетворение индивидуальных потребностей, основанную на информационных и коммуникационных технологиях, отражающую развитие наших потребностей."
residents_committee:0"Жилищный комитет"
residents_committee_desc:0"Мы создадим жилищные комитеты в каждом поселении для самоуправления, самообразования и самообслуживания жителей."
Political_Consultative_Conference:0"Политическая консультативная конференция"
Political_Consultative_Conference_desc:0"Мы проведём конференцию для консультаций по важным вопросам Вольфендома до принятия решений и в ходе их реализации. Это повысит наше политическое единство."

ANR_Rise_of_United_Wolfendom:0"Объединённый Вольфендом, восстань!"
ANR_Rise_of_United_Wolfendom_desc:0"Благодаря переговорам и посредничеству Рэйзора наши противоречия были разрешены — не полностью, но по крайней мере подавлены, и мы создали более совершенную систему, способную разрешать подобные конфликты в будущем. Теперь новый, единый §BВольфендом§W готов к следующему вызову. Пока мы едины, мы преодолеем любые трудности!"



#events
andrius.1.t:0"Беженцы"
andrius.1.d:0"Тимми уже не хватало сил скучать по своим голубям.\nПосле ухода из Мондштадта он ни разу не ел дважды в день. Конечно, сейчас трудные времена, и даже такой ребёнок, как он, это понимает, поэтому он не жаловался. Взрослые вокруг терпели ещё больший голод, испытывали отчаяние и страх, которых он не знал, так что, по сравнению с ними, его трудности казались не такими уж большими.\nСестра Грейс сказала, что он повзрослел.\n«Тимми», сестра Грейс открыла полог палатки, «выйди, погрейся на солнышке, не сиди всё время внутри».\nВыйдя из палатки, Тимми увидел, как сильные мужчины возвращаются с едой — это был один из немногих источников пищи для их огромной колонны беженцев. Хотя хозяева Вольфендома ещё не разрешили им остаться, им позволили собирать фрукты и охотиться на опушке Вольфендома. Но как долго это продлится? Если хозяева Вольфендома в конце концов не разрешат им остаться, у них не останется ни крошки еды.\nЧто же им тогда делать?\n«Ничего», сестра Грейс взяла его за руку. Она всегда была спокойна, и её спокойствие часто передавалось Тимми, заставляя его не бояться. «Два обладателя Глаза Бога пошли договариваться с хозяином Вольфендома. Если это они, то обязательно принесут хорошие вести. Ты ведь их помнишь? Беннет когда-то угощал тебя капустой на мосту, а Фишль рассказывала тебе истории».\nАх, Тимми их припоминал. Но эти двое не были похожи на обладателей Глаза Бога из историй. В историях, которые рассказывали взрослые, обладатели Глаза Бога почти всегда были героями, обладающими необычайной храбростью и обаянием, ведущими людей через трудности с помощью сверхъестественных сил. Но Беннет и Фишль, казалось Тимми, были просто хорошими, обычными людьми, а не героями.\n— В это время.\n«— Это бомбардировка стихией!» — раздался отчаянный крик с наблюдательной вышки. «Всем лечь!»\nТимми почувствовал, как чья-то сила прижала его к земле — это сестра Грейс повалила его на землю.\nЗатем последовали ослепительная вспышка, оглушительный взрыв, крики, вопли и плач.\nКогда звуки стихли, Тимми, не успевший осознать произошедшее, услышал плач сестры Грейс."
andrius.1.a:0"«Так больше не может продолжаться...»"

andrius.2.t:0"Ягода заката"
andrius.2.d:0"«Два обладателя Глаза Бога вернулись!» — раздался голос издалека. «И с ними представитель самого Андриуса!»\nУслышав это, Тимми, который чинил палатку, опустил инструменты и выглянул наружу. Сначала он увидел не обладателей Глаза Бога, а тысячи людей, высунувших головы, как и он сам. На пересечении их взглядов он увидел крепкого беловолосого юношу. Он настороженно, как волк, оглядывался по сторонам, но, увидев плачевное состояние лагеря, его взгляд сменился сочувствием.\nРядом с ним шли двое его знакомых, Беннет и Фишль, которых беженцы неожиданно сделали своими лидерами. Они о чём-то оживлённо беседовали.\nПроходя мимо Тимми, беловолосый юноша повернулся к нему. Затем он вздохнул и протянул Тимми ягоду заката, сказав:\n«Ешь».\nТимми посмотрел на этого свирепого на вид юношу и почувствовал от него, несмотря на его косноязычие, удивительную доброту."
andrius.2.a:0"«Оставайтесь»."

andrius.3.t:0"Небо под головой"
andrius.3.d:0"Флора сидела на траве и гладила кота, сидевшего у неё на коленях. Это был чёрный кот по имени Маленький Принц, который раньше был сторожем в таверне «Кошачий хвост». После того как взрыв стихии разрушил таверну, никому не было дела до кота... И так он стал котом Флоры.\n«Ха-ха... Возможно, было бы лучше оставить тебя в Мондштадте», — сказала Флора, чувствуя слабость, и её улыбка уже не была такой беззаботной, как раньше. «В конце концов, ты кот, ты везде сможешь о себе позаботиться. В отличие от меня, я бросила свой магазин и теперь могу питаться только лесными ягодами... А по ночам даже страшно заходить в лес».\n«Мяу», — ответил Маленький Принц. Раньше, когда она ещё держала цветочный магазин в Мондштадте, Флора считала, что заявления «Кошачьего хвоста» о том, что они понимают язык кошек, — это просто уловка, чтобы заманить посетителей. Разве можно извлечь из одного мяуканья столько смысла? Но теперь она начинала верить, что это правда.\n«Интересно, как там сестра», — пробормотала Флора. Затем она почувствовала холод на руке, будто укололась иглой.\nФлора подняла голову и увидела густые тучи... Через несколько секунд подул ветер, подхватывая юбку Флоры; начался дождь, и он сразу намочил волосы Флоры.\nОна прижала кота к себе, встала и поискала укрытие от дождя — но его не было. Её палатку разрушил предыдущий взрыв, а в лесу прятались дикие звери...\nИ вот Флора стояла под дождём, держа чёрного кота.\n«...Ну и дела», — вздохнула она. «Я не могу защитить даже себя, не то что кота».\nИ она присела, крепче прижимая кота к себе."
andrius.3.a:0"«Совсем как ребёнок»."


andrius.4.t:0"Просто, но тепло"
andrius.4.d:0"«Дядя Вагнер, спасибо вам!»\n«Пустяки», — Вагнер, бывший кузнец Мондштадта, размял руки и, подбоченившись, посмотрел на стоявший перед ним дом. «Ну вот, последний дом нашего типа. Тебе ещё долго придётся жить в нём. Он, конечно, простой, но защитит от дождя и ветра».\n«Я и так рада, что есть где жить, хохо», — Флора, держа кота, улыбнулась. «Не нужно проводить финальную проверку?»\n«Не нужно. У меня, Вагнера, нет брака в работе...» — Вагнер махнул рукой. «Но, вообще-то, я кузнец, а не строитель. Лучше проверю ещё раз, по стандартам господина Беннета».\n...Когда Вагнер ушёл, Флора закрыла дверь, опустилась на деревянную кровать, отложила кота в сторону и внимательно осмотрела эту маленькую комнату. Она была простой, но пригодной для жилья и могла простоять долго. Флора смотрела, как кот мечется по комнате, и думала о том, как её обставить, хотя у неё пока не было никакой мебели. Здесь можно поставить книги, там — горшок с сесилией... Ах, цветы. Впервые за много дней, с тех пор как она покинула Мондштадт, она вспомнила о своих цветах.\nЦветы в её магазине «Язык цветов» в Мондштадте, должно быть, завяли от недостатка ухода?\nДаже потеряв свой цветочный магазин, она всё ещё любила цветы. Но только сейчас у неё появилась возможность подумать о будущем для себя и своих цветов. Она даже начала думать о возможном мирном времени. Когда война закончится, она снова откроет цветочный магазин, и в нём обязательно будет кот...\n«Мяу».\nФлора очнулась от своих мыслей и поняла, что сидит на кровати, уставившись в одну точку, а снаружи слышен шум дождя. Когда начался дождь? Она даже не заметила.\nУже поздно, все, наверное, уже легли спать? Она посмотрела в единственное окно и, к своему удивлению, увидела знакомую фигуру, бегущую с бревном. Она окликнула:"
andrius.4.a:0"«Господин Беннет, зайдите, отдохните!»"

andrius.5.t:0"Вот так это решается"
andrius.5.d:0"«Флора, у нас серьёзная проблема», — сказала мисс Эйлин, жившая в соседней комнате. «Как нам разжечь огонь в общей кухне?»\n«М-м...» — Флора задумалась на мгновение. «Трением?»\n«Я серьёзно!» — простонала Эйлин. «Это же невозможно!»\n«Нужно проявить настойчивость, мисс Эйлин», — подбодрила её Флора. «Помните, чему вы научились раньше? Преодолейте свои пределы, используйте элементальный навык и решите проблему!»\n«Мяу», — сказал чёрный кот, прохаживаясь по стойке.\n«Эх... Лучше я спрошу у мисс Маргариты, у неё больше жизненного опыта».\n«Это уже восьмой раз, когда ты идёшь к мисс Маргарите сегодня?»\n«Но мне нужно разжечь огонь, чтобы сварить кашу для отца», — вздохнула Эйлин. «Он вечно хвастается, что в прошлом был великим искателем приключений, а теперь он болен и не может встать с постели... Но в комнате тоже холодно, хорошо бы было место, где можно погреться...»\n«Тук-тук».\n«Войдите?» — сказала Флора, выходя из кухни и направляясь к входной двери этого большого общежития.\nПосетитель открыл дверь, и прежде чем его фигура показалась, раздался голос: «Ха-ха, я, Принцесса осуждения, чувствую, что кто-то страдает от холода...» Оз влетел в комнату через щель в двери и выпустил электрошарик, который ударил в дрова, и они мгновенно загорелись. «...И поэтому я здесь, чтобы силой Озвальдо избавить вас от бед». Затем вошла, как и ожидалось, фиолетовая Фишль.\n«Вот так это решается», — сказала Эйлин.\n«Мы будем приходить зажигать огонь в кухнях и очагах каждого такого дома примерно в 9 утра и 7 вечера, а вы поддерживайте огонь углём и дровами», — сказал Оз. Хотя он был птицей, его спокойный голос внушал доверие.\n«Может быть, погреешься немного перед уходом?» — заметила Флора, увидев промокшие волосы Фишль.\n«Нет, нужно ещё несколько десятков домов». Фишль развернулась. «Оз, пошли!»\n«Я летаю, мисс»."
andrius.5.a:0"«Принцесса шагнула в проливной дождь, в глубине которого таился зверь, пожирающий мир...»"

andrius.6.t:0"Голод"
andrius.6.d:0"«Эй вы, убирайтесь!» — Эйлин обнажила меч и закричала: «Вы, здоровенные парни, вместо того чтобы добывать себе еду трудом, отнимаете её у слабых, вам не стыдно?!»\nХотя она была женщиной и казалась слабее этих здоровяков, те явно не хотели привлекать внимание трёх обладателей Глаза Бога, поэтому, бросив пару угроз, они ретировались.\nЭйлин вздохнула с облегчением, убрала меч и повернулась: «Можешь перестать сидеть, сжавшись в комок... Слушай, ты ведь мужчина, где твоя гордость?»\n«Какая гордость?» — Ульфа, сидевший в тени, ответил с достоинством: «Я готов быть избитым до перелома рёбер, но не отдам еду мисс Флоры! Если нужно, забирайте мою!»\nОн выпрямился, и Эйлин увидела несколько фруктов, которые он прижимал к груди. Но разве эти несколько фруктов насытят?\n«Мисс Флора?» — удивилась Эйлин. «Владелица “Языка цветов”? Ого, лоликон...»\n«Вы не понимаете. Мисс Флора может стать моей матерью!» — гордо заявил Ульфа, вставая с травы. «Даже в такой обстановке она умеет меня утешать... Но, знаете, я, наверное, действительно трусоват. Кстати, мисс Эйлин, вы же хотели вступить в Орден Рыцарей? Почему бы не воспользоваться этим шансом?»\n«Я пошла. Но капитан Джин поручила мне защищать колонну беженцев — она доверила мне эту важную миссию!»\n«Она просто подумала, что ты недостаточно сильна, и нашла предлог, чтобы отправить тебя из города». — подумал про себя Ульфа и решил сменить тему: «Давай лучше поговорим о том, что случилось. Ты знаешь тех парней?»\n«Те парни... Они уже не раз так делали. Но мы достаточно близко к обладателям Глаза Бога, и если поднять шум, они могут прийти. Так что не бойся», — сказала Эйлин. «Но если бы дело дошло до драки, я бы вряд ли справилась. Последние несколько дней я недоедала».\nСказав это, они оба услышали урчание в животах.\n«Я тоже. Но я бы и потерпел, но мисс Флора...»"
andrius.6.a:0"Когда же это кончится?"

andrius.7.t:0"Укрощение природы"
andrius.7.d:0"Беннет протянул руку вверх, ухватился за скалу и подтянулся... Ещё один рывок вверх по скале.\n«Господин Беннет!» — крикнул кто-то снизу. «Если устали, сразу спускайтесь!»\n«Ничего! Если я смогу добраться туда...» — ответил Беннет. «Если я смогу закрепить там взрывчатку, а Фишль выстрелит издалека, чтобы поджечь её, канал будет прорыт? Это не так уж сложно. Кто-то должен это сделать». Говоря это, он уже добрался до нужного места, одной рукой держась за скалу, а другой снимая с пояса взрывчатку.\n«...М?» — Беннет заметил неладное. «Странно, эта взрывчатка... отсырела?»\nЕсли бы на его месте был обычный человек, ему пришлось бы спуститься за новой взрывчаткой. Но у них не было лишней взрывчатки.\nОднако он был обладателем Глаза Бога. У него была сверхъестественная сила, позволяющая делать невозможное.\nОн убрал взрывчатку и обнажил меч.\n«Беннет?» — послышался снизу голос Фишль. «Что ты собираешься делать?»\n«Просто... попробую!» — Беннет нашёл нужный угол. «Жар страсти — Перегрузка!»\nМощный поток Пиро вырвался из его меча, и, к изумлению всех, скала, которую он собирался взорвать, разлетелась на куски... И не только она.\n«О боже», — подумал Беннет, падая в воздухе, — «я знал, что так и будет».\nНо он не просто падал в пустоту. Если бы он просто смотрел на свою неудачу, он бы давно погиб в своих приключениях.\nВ момент падения он изогнулся, взмахнул мечом и со всей силы ударил по земле — рука пронзила боль, но удар смягчил падение, и он приземлился на спину, не разбившись.\n«Беннет!» «Господин Беннет!» — раздались крики издалека.\nЛежа среди камней, Беннет крикнул: «Я в порядке!» Затем он ловко вправил себе вывихнутое плечо. И улыбнулся.\nОн почувствовал, как вода омывает его тело — канал был прорыт, и он пропускал воды гораздо больше, чем ожидалось."
andrius.7.a:0"«Значит, моя неудача не всегда во вред?»"

andrius.8.t:0"Трактор и рыба"
andrius.8.d:0"«Ну-ка, смотрите!» — Фишль запрыгнула на трактор. «Эта машина работает вот так!»\nЧестно говоря, когда она только садилась в трактор, она не была уверена, что сможет завести его. Как только она приняла это решение, она пожалела: а вдруг она неправильно поняла инструкцию? А если практика расходится с теорией? Если она запрыгнула на трактор, а он не завёлся, было бы очень стыдно.\n...Однако всё пошло по самому лучшему и самому невероятному сценарию. Она просто включила несколько переключателей, потянула за рычаги, нажала на педаль газа, и трактор поехал.\n«Ого!» — раздались возгласы из толпы.\n«Кхм... Как я уже говорила, спорами истину не познать», — сказала Фишль, остановив трактор и выходя из машины с обычной самоуверенной улыбкой, хотя в душе вздохнула с облегчением. «Чтобы понять, как что-то работает, нужно просто попробовать...»\n«...По словам господина Оза, мисс Фишль сказала примерно это», — сказал Ульфа, ставя корзину с рыбой и обращаясь к Флоре. «Если бы не господин Оз, мы бы вообще не могли общаться с мисс Фишль. Хотя она говорит загадочно, у неё очень острый ум и глубокие знания...»\n«Вот как, оказывается, такое случилось, хо-хо», — терпеливо слушала Флора. «А где ты взял эту рыбу?»\n«Я наловил её в озере Сидра!» — гордо сказал Ульфа. «Мы недавно закупили много машин. Кроме трактора, мы также купили траулеры, и теперь я могу трудом добывать себе еду».\n«Ого... Здорово».\nФлора ожидала, что все лодки Ульфы утонут. Раньше Ульфа постоянно строил странные лодки на берегу озера, но когда его спрашивали, зачем он это делает, он отмалчивался...\n«После того как я поймал рыбу, мне досталось больше, потому что мой вклад был большим. Мы не можем съесть всё сами, поэтому я принёс немного тебе», — смущённо сказал Ульфа.\n«Отлично, я последние несколько дней питалась только фруктами, наконец-то смогу поесть мяса... Но, разве вы не собираетесь засолить лишнюю рыбу на зиму?»"
andrius.8.a:0"«Нет, мы верим, что у нас будет рыба каждый день»."

andrius.9.t:0"Наш курс"
andrius.9.d:0"После создания начальной администрации появился канал для обобщения и реализации предложений беженцев... Всего за один день ящики для предложений были забиты до отказа. Мы вдруг поняли, что нужно сделать ещё очень много — построить туалеты, перенести внешние лагеря вглубь Вольфендома, чтобы избежать бомбёжек, обучить травников...\nИз-за ограниченных ресурсов мы не можем сделать всё сразу, нужно установить приоритеты. Нам нужен общий курс действий, чтобы определить порядок и направление наших решений."
andrius.9.a:0"«Нам придётся остаться в Вольфендоме надолго, нужно думать о будущем»."
andrius.9.b:0"«Сначала решим насущные проблемы людей»."

andrius.10.t:0"Туалетный инцидент"
andrius.10.d:0"С началом управления мы начали проводить множество мер — от срочных, таких как закупка лекарств, до долгосрочных, таких как распашка полей. В процессе возникают разные споры... Например, недавний случай в лагере №17.\nПо нашей инициативе беженцы построили простой туалет, но его не хватало для удовлетворения насущных потребностей, и больше никто не хотел решать проблему на месте... После нескольких дней очередей кто-то предложил определить порядок посещения туалета.\nПервая группа предложила определять порядок по трудозатратам на строительство туалета: кто больше носил брёвен и забивал гвоздей, тот и идёт первым и может находиться там дольше; или, более того, использовать общий трудовой балл для определения порядка.\nВторая группа считала, что, поскольку в Вольфендоме естественным образом возродилась денежная система, Мора лучше отражает общий вклад человека. Поэтому они предложили систему абонементов: в зависимости от потребности в туалете, люди могут покупать абонементы разного уровня, дающие приоритет и более длительное время использования... Это также приносило бы доход нашему правительству.\nТретья группа предлагала создать систему оценки потребности в туалете, чтобы определять очередность по уровню необходимости, отдавая приоритет тем, кому это нужнее. Сторонники считали, что это лучше отвечает потребностям людей, минимизируя среднее время ожидания...\nКакой способ нам выбрать?"
andrius.10.a:0"Распределение по трудозатратам соответствует нашей идее взаимопомощи."
andrius.10.b:0"Мора, кажется, отражает социальный вклад... и нам нужна Мора."
andrius.10.c:0"Мы должны ориентироваться на эффективность и выбрать третий вариант."
andrius.10.e:0"Обеспечить изобилие мест, чтобы каждый мог получить всё необходимое! Вряд ли кто-то захочет монополизировать место в туалете?"
andrius.10.f:0"Зачем приплетать идеологию к такой ерунде? Пусть ходят по очереди!"

andrius.11.t:0"Туалетный инцидент"
andrius.11.d:0"С началом управления мы начали проводить множество мер — от срочных, таких как закупка лекарств, до долгосрочных, таких как распашка полей. В процессе возникают разные споры... Например, недавний случай в лагере №17.\nПо нашей инициативе беженцы построили простой туалет. В тот вечер несколько наших администраторов одновременно почувствовали нужду, и один из них, занимавший должность командира, решил, что его положение даёт ему приоритет, и потребовал, чтобы другие, пришедшие раньше, уступили ему место, что привело к ссоре. В результате этот «лидер» упал в выгребную яму и сейчас проходит лечение в клинике.\nУзнав об этом, прибывшие в Вольфендом мыслители выдвинули свои идеи о том, как избежать подобных конфликтов в будущем и уменьшить вероятность падения в выгребную яму.\nПервая группа мыслителей считала, что корень проблемы — отсутствие чёткой очереди. Они предложили установить порядок в зависимости от должности. Хотя это выглядит неравноправно, чёткая иерархия действительно уменьшила бы конфликты, а люди на более высоких должностях в среднем более компетентны и влиятельны, поэтому их приоритетный доступ к туалету принёс бы больше пользы обществу.\nВторая группа мыслителей считала, что конфликты — неотъемлемая часть человеческого общества. В таком конфликте тот, кто упал в яму, явно уступает в способностях, и его социальная смерть в выгребной яме — это способ избавиться от него на благо коллектива. Более того, сами конфликты полезны, так как отсеивают неспособных.\nТретья группа мыслителей считала, что администраторы — не хозяева народа, а его слуги. Чтобы каждый в Вольфендоме это понял, они предложили, чтобы люди на высоких должностях ходили в туалет последними — чем больше власть, тем больше ответственность. Не хочешь нести бремя — не бери на себя ответственность."
andrius.11.a:0"Первая группа права... Ах, мне нужно в туалет, а там кто-то есть! Выходи!"
andrius.11.b:0"В теории отбора что-то есть."
andrius.11.c:0"Возможно, стоит потренировать сфинктеры начальников."
andrius.11.e:0"Все эти предложения бредовые, лучше построим ещё несколько туалетов."
andrius.11.f:0"Можно не говорить об этом за едой? Пусть ходят по очереди!"

andrius.12.t:0"Минутные люди"
andrius.12.d:0"«Смирно!» — скомандовал Гай. Ополченцы мгновенно вытянулись.\nГай довольно кивнул, глядя на этот более-менее стройный строй. После того как он привёл отца в лагерь беженцев, Гай нашёл для себя более значимое занятие, чем охрана ворот, — тренировку ополченцев.\nРаньше в Мондштадте тоже было ополчение, но в мирное время оно было слабо обучено. Их называли «минутными людьми», потому что они якобы могли собраться за минуту, но в бою не выдерживали и минуты. Однако под руководством Гая он мог гарантировать, что это подразделение будет более боеспособным.\n«Итак, сегодня мы тренируем...»\n«Ааа!» — раздался крик издалека. «Слайм ворвался в лагерь!»\nГай прервал команду и увидел, что ополченцы полны энтузиазма. «В бой!»\n«Бойцы, время проверить наши навыки! Не забывайте строй!»"
andrius.12.a:0"«К оружию!»"

andrius.13.t:0"Пурпурная армия"
andrius.13.d:0"Вот оно! Гай сосредоточился.\nОн скользнул под летящего хиличурла и одним ударом распорол ему живот. Пока старый хиличурл кричал от боли, Гай нанёс удар — сила человека не сравнится с силой хиличурла, но в состоянии предельной концентрации Гай пробил кулаком грудь хиличурла!\nОттолкнув тело хиличурла, Гай немного полежал на земле, восстанавливая дыхание.\n«Я стал сильнее», — подумал он. «Это благодаря тренировкам мисс Фишль?»\n...\n«Папа, я вернулся!» — он принёс еду в дом, где жила его семья. «Мне дали немного мяса в награду, сегодня будем есть вкусно!»\n«О, это замечательно», — с облегчением сказал отец. «Что ты сделал, чтобы получить награду?»\n«Просто убил пару хиличурлов», — улыбнулся Гай."
andrius.13.a:0"«Я часто так делал раньше»."

andrius.14.t:0"Встреча родных"
andrius.14.d:0"В одной из мастерских Вольфендома... Флора учила девушку-новоприбывшую вязать одежду.\n«...Хо-хо, вот так», — Флора опустила иглу и развернула готовую одежду. «Так можно быстро связать одежду, не поранив руки».\n«Спасибо, мисс Флора!» — с благодарностью сказала девушка. «Когда я бежала из Мондштадта, я думала, что буду долго жить в голоде и страхе. А теперь я не только обрела дом, но и узнаю новое, встретила таких друзей, как вы...»\n«Хотя знания — это всегда хорошо, эти знания могут скоро устареть», — предупредила Флора. «Я слышала, что через несколько дней нам завезут швейные машины».\n«Ого, даже инструменты совершенствуются... Тогда мы снова будем учиться вместе, правда, мисс Флора?» — улыбнулась девушка.\n«...Флора...» — донёсся откуда-то знакомый зов. Наверное, показалось, подумала Флора.\n«Чувствуешь себя как в студенческие годы», — задумчиво сказала Флора. «Только работаешь и учишься, а еда и жильё решаются сами собой. Сложно представить, что мы находимся в военное время... Если бы...»\n...Если бы сестра тоже была здесь.\n«— Флора!»\nФлора резко встала и обернулась к выходу из мастерской.\n«Сестра!»\n...Ульфа, наблюдавший издалека за взволнованно обнимающимися сёстрами, тоже улыбнулся и сказал:"
andrius.14.a:0"«Эту улыбку я буду защищать!»"

andrius.15.t:0"Подземная война"
andrius.15.d:0"...Это то, что могло бы произойти много-много лет спустя.\n«Ребята, за мной!» — махала флажком учительница, а за ней, болтая и жуя, шла толпа школьников с рюкзаками. Они вошли в выставочный зал, и дети с любопытством рассматривали экспонаты по обе стороны — письма солдат, лопаты для рытья тоннелей, фотографии бойцов...\n«Этот музей посвящён специальной тактике, которую использовало нынешнее правительство, когда оно было всего лишь группой лагерей беженцев в Вольфендоме, для защиты от внешнего вторжения. Тактика называлась подземной войной».\n«Сначала это был просто способ помешать врагу пополнять запасы на месте, но позже тоннели стали выполнять всё больше функций, вплоть до нападений на врага. В те годы Беннет спускался в тоннели, чтобы в нужный момент вывести солдат и перерезать пути снабжения врага, приближая победу...»\n«...Есть и классический фильм на эту тему, где есть песня, которую все знают и поют», — учительница запела: «Подземная война, подземная война —»\nИ дети радостно, сбиваясь, подхватили:"
andrius.15.a:0"«— Скрывает тысячи бойцов!»"

andrius.16.t:0"Ответный удар"
andrius.16.d:0"...Это то, что могло бы произойти много-много лет спустя.\nНажав кнопку «Объявить войну», Тони улыбнулся. Он напечатал в чате: «Асу, готовься к моему блицкригу!»\nЗатем, не дожидаясь ответа, он быстро щёлкнул мышью, отдавая приказы, откинулся на спинку стула, взял бутылку «Победного ягодного вина» и стал ждать. По его расчётам, его бронетанковые войска должны были рассечь, окружить и уничтожить врага, после чего он сможет прорваться и победить.\n— Тони играл в популярную в последние годы игру «Элементная душа 5», созданную студией «Парадокс», и сейчас играл по сети с другим игроком. Однако они играли не в оригинал — ИИ был глупым, событий мало, а баланс нарушен, например, Фишль была слишком сильной.\nПоэтому они играли в OTL-мод, созданный творческим сообществом, с множеством путей развития и гипотетическими технологическими деревьями. В моде всё было хорошо, кроме слишком уж безумных веток развития...\n«Хм?» — Тони отставил вино. «Что-то не так, его войск на линии фронта слишком мало... Чёрт!»\nТони понял это и начал отводить войска, но было поздно. Его войска уже глубоко вклинились на вражескую территорию, а основные силы врага, вместо того чтобы быть на фронте, поджидали в тылу, пока атакующие истощатся, потеряют организацию, закончат план и не успеют окопаться...\n«Всё», — Тони убрал руки от клавиатуры. «Попали в большой котёл».\nЕго противник уже начал насмехаться в чате: «Я принял твой удар. Как тебе тактика, придуманная десятки лет назад?»\n«Я проиграл не тебе», — упрямо сказал Тони."
andrius.16.a:0"«Разве не Фишль придумала эту тактику?»"

andrius.17.t:0"Пушки в бою"
andrius.17.d:0"«Не слишком ли утрированно?» — спросил Тони, указывая на голографическое изображение Дионы. «Неужели историческая Диона была такой... свирепой?»\nНа экране маленькая кошкодевочка, которую можно было бы использовать как ядро для пушки, кричала: «Беннет, тащи мою фонтейнскую пушку!»\n«М-м... Это художественное преувеличение, возможно, создатели считают, что так и было», — сказала его жена, сидя рядом. «И такая маленькая Диона тоже милая. Говорят, она хорошо смешивает коктейли».\n«Ого, у такой важной персоны есть и такая сторона?»\nОни смотрели на экран, и постепенно начали клевать носом.\nЧастота моргания Тони замедлялась, и в конце концов он прислонился головой к плечу жены и заснул.\n«...Эх», — вздохнула жена.\nВ это время на экране Диона разрывала врага на части, стреляла из лука, взрывая голову вражескому командиру, и вела войска в атаку под прикрытием артиллерии."
andrius.17.a:0"Она размахивала знаменем, стоя на горе трупов, а перед ней вставало восходящее солнце."

andrius.18.t:0"Популярная песня"
andrius.18.d:0"Среди недавно прибывших в Вольфендом беженцев оказались несколько известных бардов, которые совместно создали песню «Защитим свободу». Она быстро стала популярной, противопоставляя жизнь до и после прибытия в Вольфендом и призывая людей к борьбе за защиту своей жизни."
andrius.18.a:0"«Кто бы ни пытался отнять её, мы будем биться до конца!»"

andrius.19.t:0"Перегрузка"
andrius.19.d:0"Когда весть о мире и переговорах дошла до фронта, только что начинался рассвет. Беннет вылез из окопа, весь в грязи, но с улыбкой на лице.\nНеподалёку от траншеи стояли войска врага, но они больше не наступали. Беннет увидел их разочарованные лица и улыбнулся ещё шире.\n— Больше не нужно воевать. — подумал он. — Больше не будет войны!\nЗатем он увидел, как из окопов один за другим выходят другие солдаты. Среди них были человек, собиравший монеты в фонтане для больной сестры, юноша, торговавший фруктами в Мондштадте, ленивый рыцарь, патрулировавший город... Все они имели одно общее прошлое — они были беженцами.\nРаньше все считали жителей Вольфендома трусами и слабаками, бежавшими с поля боя. Но теперь они доказали, что у них есть силы и воля сражаться, просто они не хотели этого делать.\nИменно эта война превратила Беннета из лидера толпы беженцев в настоящего героя, способного вести за собой страну.\nНа лицах каждого была улыбка. Затем, в какой-то момент, все одновременно опустили оружие и закричали: «Победа! Мы победили!»"
andrius.19.a:0"— Из «Жизни Беннета»"

andrius.20.t:0"Объятие благодати"
andrius.20.d:0"Война закончилась... Но Фишль не чувствовала этого.\nС начала войны она непрерывно работала, у неё почти не было времени на свои обычные длинные, загадочные речи. Как один из высших администраторов Вольфендома и могущественный обладатель Глаза Бога, она взяла на себя огромный объём административной работы: обеспечение тыла, планирование резервов, разработка военных планов, а иногда и участие в боях вместе с другими обладателями Глаза Бога для уничтожения вражеских крепостей...\nДаже за всё время работы искателем приключений она не испытывала такого стресса. В самые напряжённые дни она начинала тосковать по своему детству, когда она могла просто уйти в библиотеку, погрузиться в мир фантазий и жить беззаботно.\n...Однако за время работы с беженцами Фишль тоже выросла. Она не будет уклоняться от ответственности.\nДаже после окончания войны работа не прекратится. Демобилизация, выплаты семьям погибших, восстановление оккупированных территорий... Гора дел по-прежнему лежала на её столе, вызывая усталость. Для неё война только перешла в стадию «начала конца».\nВ этот момент солнечный свет залил её стол. На подоконник села белая птичка-колобок и зачирикала, а затем к ней присоединилась жёлтая.\nПривлечённая их пением, Фишль посмотрела в окно.\nСнаружи уже сняли праздничные баннеры, но кое-что осталось.\n— Улыбки. Люди больше не выглядели озабоченными, как во время войны, они улыбались, полные надежды на будущее.\nФишль только сейчас это заметила.\n«...Ха-а», — Фишль повернулась обратно к столу. «Что ж, работу нужно продолжать. Но и себя тоже нужно наградить...»"
andrius.20.a:0"«Оз, принеси мне третий том “Истории о том, как я стал хиличурлом и постоянно ел ягоды заката, чтобы стать сильнее”!»"

andrius.21.t:0"Предложение Вольфендома"
andrius.21.d:0"Вольфендом предлагает нам гарантировать независимость друг друга перед лицом общей угрозы. Стоит ли нам согласиться?"
andrius.21.a:0"Мы слабы, это может нас защитить."
andrius.21.b:0"Это может привлечь к нам дополнительную опасность, лучше отказаться."

andrius.22.t:0"Приглашение Вольфендома"
andrius.22.d:0"Вольфендом приглашает мисс Диону занять должность в их правительстве, чтобы укрепить сотрудничество. Стоит ли нам согласиться?"
andrius.22.a:0"Мы как одна семья с Вольфендомом."
andrius.22.b:0"После тщательного обдумывания Диона решила остаться."

andrius.23.t:0"Победное ягодное вино"
andrius.23.d:0"«За маленькую Диону!» — когда Диона проходила мимо таверны, все посетители подняли за неё тосты.\n«...Вы, пьяницы,» — с досадой сказала Диона. «Несколько дней назад в таверне было пусто, я уж думала, что вы решили бросить пить...»\n«В последние дни... ик... шла война,» — сказал один пьяница. «Все были заняты, не до выпивки. Но когда пришла весть о победе, ик... тяга вернулась!»\n«Маленькая Диона — героиня победы!» — сказал кто-то.\n«Хочу выпить за героиню!» — тут же предложил другой. Похоже, это был пьяница из Спрингвейла. «Давно не пил коктейлей от маленькой Дионы, очень скучаю!»\nВ таверне поднялся шум...\nДиона вздохнула... Но тут её осенила идея. Если она сейчас приготовит достаточно отвратительный коктейль, который вызовет у этих людей отвращение к алкоголю...\n«Ладно, я сделаю. Но мне нужны особые ингредиенты... Принесите-ка мне сироп от кашля!»\nЗатем она начала готовить свой адский напиток... Она добавила много сахара, ягодный сок, имбирь, мимозу, апельсиновые листья, кору корицы, соду... В итоге получилась чёрная шипучая жидкость.\n«Вкусно!» — сказал каждый пьяница. «Нет ничего лучше, чтобы отпраздновать победу!»\nЭтот напиток назвали «Победное ягодное вино». Он быстро распространился по Вольфендому, став его фирменным напитком. Каждый раз, выпивая его, люди вспоминали ту великую победу.\nА то, что он впоследствии распространился по всему Тейвату и стал символом Мондштадта, познакомив иностранцев с войной в Вольфендоме и вызвав эпидемию ожирения и диабета, — это уже совсем другая история."
andrius.23.a:0"Ик!"

andrius.24.t:0"Раскол"
andrius.24.d:0"Иногда общественное мнение меняется очень быстро. Но за такими резкими переменами всегда стоят глубокие причины.\nХотя Вольфендом одержал победу, травмы, полученные жителями во время войны, были реальны.\nНаплыв новых беженцев также создавал проблемы для старожилов.\nКроме того, существовали и накопившиеся проблемы в управлении, противоречия между разными лидерами, борьба между сформировавшимися в Вольфендоме группами интересов — всё это реальные противоречия. Раньше они не проявлялись, потому что Вольфендом был маленькой силой. Но теперь он стал полноценным региональным военачальником.\nПоскольку эти проблемы существовали, у них должны были быть причины. Для жителей Вольфендома было проще объяснять их «ошибками конкретных людей» или «неправильным исполнением планов», чем вникать в социальные процессы.\nРазные люди видели разные причины и пытались убедить в своей правоте других. Так, ещё до того, как сами «виновные» осознали это, вокруг них стихийно формировались группы поддержки, которые даже начинали конфликтовать друг с другом.\n«...Вот почему рабочие, ветераны, уличные торговцы и художники подрались?»\n«Да...»"
andrius.24.a:0"Всё это ужасно. Возможно, нужно действовать быстрее."

andrius.25.t:0"Странствие по миру"
andrius.25.d:0"«...Понятно».\nРэйзор думал, что семья погибшего солдата будет громко плакать или как-то бурно реагировать, но отец, услышав новости, лишь слегка опустил голову, его вопросительное выражение лица исчезло, сменившись маской бесстрастия...\nРаньше он мог бы этого не понять, но теперь Рэйзор чувствовал огромную скорбь, скрытую за этим окаменевшим телом.\nЕму предстояло сделать это ещё много раз, но сначала нужно было выполнить всё по закону.\nЗакончив, Рэйзор отдал честь и вышел с несколькими солдатами.\nСнаружи раздавались оглушительные крики: «Победа!»\nВ этот момент отец медленно поднял голову и очень тихо спросил: «Господин Рэйзор, я слышал, что именно вы решили оставить нас, беженцев, в Вольфендоме. Как вы считаете, каким стал Вольфендом сейчас?»\n«...Хорошим». — серьёзно ответил Рэйзор. Он сожалел, что ещё не освоил язык в совершенстве и не мог подобрать достаточно хороших слов. «Сейчас так хорошо».\n...\nКогда они уходили, отец всё ещё сидел в тени, не говоря ни слова.\nПроходя через толпу празднующих, Рэйзор сказал себе, что единственный способ оправдать жертву этого храбреца — это..."
andrius.25.a:0"Защитить нынешний Вольфендом и его жителей."

andrius.26.t:0"Избрание Беннета"
andrius.26.d:0"«Подсчёт голосов завершён... Победитель — господин Беннет!»\nВ условиях растущего раскола в Вольфендоме было решено провести всеобщие выборы, чтобы определить будущее силами народа... и, конечно же, с использованием финансовых и людских ресурсов. Если какая-то сила побеждает на выборах, значит, она имеет подавляющее преимущество, которое трудно оспорить даже с помощью насилия.\nБеннет, который с улыбкой наблюдал за происходящим, неожиданно для себя одержал победу.\nЭтот результат удивил многих, в том числе и самого Беннета, который не вёл активной предвыборной кампании и не агитировал за себя. Но его основная база поддержки — рабочие, крестьяне, солдаты и низовые администраторы — добровольно выдвинула его, обеспечив ему преимущество над другими кандидатами. Его противников было мало. Как бы они ни критиковали его за «анархизм», «бытовой взгляд» или «крестьянские замашки», разрыв в поддержке был настолько велик, что даже пересчёт голосов не изменил бы результат.\nТакое возможно только в молодых и небольших демократических государствах, подобных Вольфендому. В старых и крупных демократиях без пропаганды и финансирования победить на выборах было бы почти невозможно.\nОшеломлённый Беннет, стоя перед толпой, произнёс импровизированную речь: раз народ избрал его, он не подведёт их ожиданий. В течение следующего месяца он поведёт Вольфендом по «самому подходящему» пути — самому подходящему для нынешнего состояния, состоящего из множества естественных коммун.\nПосле речи толпа приветствовала описанное им будущее. Этот стойкий и неудачливый лидер спустился с трибуны и вступил на... историческую сцену."
andrius.26.a:0"Сейчас нужен Беннет!"

andrius.27.t:0"Избрание Фишль"
andrius.27.d:0"«Подсчёт голосов завершён... Победитель — мисс Фишль!»\nВ условиях растущего раскола в Вольфендоме было решено провести всеобщие выборы, чтобы определить будущее силами народа... и, конечно же, с использованием финансовых и людских ресурсов. Если какая-то сила побеждает на выборах, значит, она имеет подавляющее преимущество, которое трудно оспорить даже с помощью насилия.\nФишль, работавшая в административном здании, узнала о своей победе, вероятно, последней в Вольфендоме.\nМногие удивились этому результату... включая саму Фишль.\nНо за любым неожиданным результатом стоят давние причины. Ранее Фишль внедрила в Вольфендоме множество передовых политик и распространила множество необычных, еретических и даже противоречащих общепринятым идеям, и каждый раз она добивалась успеха. Люди, извлёкшие выгоду из её инновационных стратегий, стали её твёрдой опорой.\nВ то время поддержка «прогресса», «экспериментов» и «инноваций» стала политическим мейнстримом Вольфендома. Люди верили, что следующая реформа Фишль также будет успешной и принесёт беспрецедентную выгоду.\nИногда способности человека раскрываются под давлением, и талант проявляется в трудных ситуациях. Если бы не опыт Вольфендома, Фишль, возможно, никогда бы не узнала, что у неё есть талант к административной и военной работе. Возможно, такая жизнь была бы неплохой.\nПосле долгих размышлений Фишль решила принять результаты выборов и стать лидером Вольфендома. Она заявила, что будет внедрять в Вольфендоме идеи, которые внешнему миру кажутся слишком передовыми и даже безумными, и единственной целью этих экспериментов будет счастье народа.\nНа вопрос, как она поступит с теми, кто попытается помешать прогрессу, Фишль ответила, что она не заинтересована в политической борьбе, поэтому надеется на сотрудничество с оппозицией, иначе она будет вынуждена «принять меры».\nПосле речи толпа приветствовала описанное ею будущее. Этот милый и умный лидер спустилась с трибуны и вступила на... путь судьбы."
andrius.27.a:0"Вперёд вместе с Фишль!"

andrius.28.t:0"Избрание Дионы"
andrius.28.d:0"«Подсчёт голосов завершён... Победитель — мисс Диона!»\nВ условиях растущего раскола в Вольфендоме было решено провести всеобщие выборы, чтобы определить будущее силами народа... и, конечно же, с использованием финансовых и людских ресурсов. Если какая-то сила побеждает на выборах, значит, она имеет подавляющее преимущество, которое трудно оспорить даже с помощью насилия.\nПобеда Дионы, вероятно, была наименее неожиданной на этих выборах. Она приложила огромные усилия для победы. Её вклад в оборону был очевиден, а поддержка Спрингвейла ещё больше укрепила её позиции.\nСамое главное, что за прошедшие годы в Вольфендоме многие разбогатели различными способами — законными, незаконными и аморальными, но не наказуемыми. В отличие от других кандидатов, которые считали этих людей в той или иной степени угрозой, Диона, выросшая в деревне среди охотников, не считала их проблемой, поэтому получила от них наибольшую поддержку. Её идеи, как у бывшего обычного бармена, казались более умеренными по сравнению с другими кандидатами, слишком «прогрессивными».\nТаким образом, Диона одержала победу. Ничуть не удивлённая, она поднялась на трибуну и, встав на стул, произнесла речь. Она заявила, что ключ к решению проблем не в усилении правительства, а в повышении инициативы народа. Она будет децентрализовать власть, передавая её народным организациям... и частично тем, кто её финансировал.\nПосле речи толпа приветствовала описанное ею будущее. Этот маленький и гордый лидер спустилась с трибуны и вступила на... сцену судьбы."
andrius.28.a:0"Победа, а затем — руководство!"

andrius.29.t:0"Избрание Рэйзора"
andrius.29.d:0"«Подсчёт голосов завершён... Победитель — господин Рэйзор!»\nВ условиях растущего раскола в Вольфендоме было решено провести всеобщие выборы, чтобы определить будущее силами народа... и, конечно же, с использованием финансовых и людских ресурсов. Если какая-то сила побеждает на выборах, значит, она имеет подавляющее преимущество, которое трудно оспорить даже с помощью насилия.\nМногие считали Рэйзора посторонним на этих выборах — несколько лет назад он был полудиким ребёнком, едва говорившим, и даже будучи обладателем Глаза Бога, он вряд ли мог получить больше поддержки, чем другие кандидаты.\nНо Рэйзор победил. За это время он объехал весь Вольфендом, осознал и донёс до людей раскол в обществе, и, выступая за продолжение переговоров и сосуществование лидеров, завоевал поддержку тех, кто не хотел обострения конфликтов.\nНа трибуне он, запинаясь, но искренне, описал будущее, основанное на демократическом сотрудничестве. Его усилия, ранее неизвестные, стали достоянием общественности благодаря новым газетам.\nВозможно, его сторонников было не так много, но те, кто жаждал гармонии, составили его надёжный тыл.\nВ конце он, с неожиданной чёткостью и плавностью, произнёс лозунг выборов: «Равенство, братство, республика», заслужив аплодисменты.\nПод крики ликования этот открытый к знаниям и миролюбивый лидер спустился с трибуны и вступил на... историческую сцену."
andrius.29.a:0"Рэйзор — не только охотник!"

andrius.30.t:0"«Священная война»"
andrius.30.d:0"Общественное мнение начало меняться. Люди начали жаждать мира — не путём ожидания, а силой оружия.\nВ разговорах всплывали трагедии, которые они видели и пережили на пути в Вольфендом, и они связывали их с военачальниками, ведущими гражданскую войну, превращая их в список преступлений.\n«Почему палачи, развязавшие войну и убивающие мирных жителей, могут бороться за власть над Мондштадтом, а настоящие добрые люди вынуждены прятаться и бежать от снарядов?» — спрашивали они. И начала распространяться песня.\nСначала это было просто стихотворение в газете; один талантливый народный композитор, прочитав его, пошёл домой, напевая его, и в соавторстве с другими создал песню. Меньше чем за месяц она распространилась повсюду, и теперь, открыв окно, можно было услышать:\n«Пусть высший гнев, как волна, прокатится!»"
andrius.30.a:0"«Ведите народную войну, священную войну!»"

andrius.31.t:0"«Клинок сумерек»"
andrius.31.d:0"Недавно вышла заключительная часть популярного романа «Клинок сумерек», получившая положительный отклик.\nВ книге гражданин Мондштадта, обладающий боевыми навыками, попадает в мир без элементальных сил, где люди используют силу «кипячения воды». Проведя десятки тысяч лет в виде морозного гвоздя, он наконец обретает тело — тело основателя династии «Мин» в этом мире.\nВместе со своим наивным потомком Чжу Юцзянем, используя материализм, рационализм и дух прогресса, он развивает науку и технику, организует народ, побеждает вторжение мутантов, устанавливает диктатуру пролетариата и ведёт мир в будущее.\nКнига породила множество подражателей, пишущих в жанре «истории развития и завоеваний».\n«Клинок сумерек» был очень популярен, но некоторые консервативные критики раскритиковали его за развлекательность."
andrius.31.a:0"«Народ любит — и тебе нечего сказать»."

andrius.32.t:0"«Сокрушая землю»"
andrius.32.d:0"Недавно вышла заключительная часть популярного романа «Сокрушая землю», получившая положительный отклик.\nВ книге гражданин Мондштадта Ку Шуй попадает в мир «Паровая Земля», где нет элементов, а есть только развитая до предела «сила кипящей воды». Будучи вундеркиндом, он терпит неудачу и становится ничтожеством; на грани отчаяния он понимает, что корень его страданий — феодальный строй.\nОн создаёт технику «Красный Завет», доступную каждому, и вместе с народом идёт к свержению угнетателей.\nКнига полна приёмов, когда герой показывает слабость, чтобы затем нанести сокрушительный удар, и породила множество подражателей.\nАвтор хорошо владеет ритмом и эмоциями, но его персонажи немного плоские."
andrius.32.a:0"Хе-хе-хе, слишком много реакционеров..."

andrius.33.t:0"«Странная мать»"
andrius.33.d:0"Недавно вышла заключительная часть популярного романа «Странная мать», получившая широкий положительный отклик.\nИдея книги пришла из легенд о богах Инадзумы, с примесью знаний из Фонтейна.\nГероиня, Норманни, попадает в мир, похожий на Мондштадт времён старой аристократии, и обнаруживает, что её предшественница покончила с собой. Она находит вход в таинственный «Зал Конечности», где может общаться с людьми на расстоянии. Используя полуобман, она обеспечивает себе выживание, но постепенно находит настоящих друзей.\nВ финале, защищая их, она побеждает могущественного врага «Ла» и становится существом, превосходящим богов, но вынуждена заснуть.\nКнига отличается захватывающим сюжетом, яркими персонажами и вниманием к деталям, включая цены на хлеб. Единственный недостаток — это трилогия, и автор планирует написать вторую часть через два года, то есть «Странная мать 2» выйдет в марте следующего года."
andrius.33.a:0"Позвольте представить нашу единственную божественную мать, Владычицу туалетов..."

andrius.34.t:0"«Король цветов»"
andrius.34.d:0"Недавно вышла заключительная часть популярного романа «Король цветов», получившая положительный отклик у критиков.\nКнига рассказывает о событиях в Вольфендоме во время реконструкции природы. Колонисты, распахивая поля, срывают самый крупный цветок, несмотря на предупреждения старика, и природа мстит им. Старый крестьянин умирает, оставив письмо.\nКнига была высоко оценена землевладельцами, которые сочли, что она правильно отражает ошибки прошлой политики, а «Король цветов» символизирует нерушимые традиции Мондштадта."
andrius.34.a:0"Как трудно быть одиноким в эпоху всеобщей слепоты!"

andrius.35.t:0"«Кибер-эпоха»"
andrius.35.d:0"Недавно вышел фильм «Кибер-эпоха», получивший множество негативных отзывов критиков.\nВ фильме рабочий Дэвид Мартинес сходит с ума на заводе и становится подопытным для «машины для питья». Оставшись без работы, он решает попасть в тюрьму и по пути спасает девушку Люси. В итоге они влюбляются и выживают в эту «кибер-эпоху».\nКритики сочли, что фильм преувеличивает трудности рабочих и очерняет предпринимателей. Из-за намёков на политические проблемы главный актёр Чаплин был обвинён в том, что он «красный агент» из Ли Юэ, и вынужден бежать.\nГоворят, что изначально концовка была другой — Дэвид совершает самоубийство на вершине Вольфендома, чтобы сохранить свою субъектность, отказываясь подчиняться существующему порядку, что перекликается с фразой из фильма: «В Вольфендоме только мёртвые — настоящие легенды»."
andrius.35.a:0"Смешно. Неужели они не видят прогресса свободного рынка?"

andrius.36.t:0"«Двенадцать разгневанных девушек»"
andrius.36.d:0"Сегодня вышел фильм «Двенадцать разгневанных девушек», получивший широкое признание.\nВ фильме парня из трущоб обвиняют в убийстве отца. Судья считает, что это ложное обвинение, но вступает в силу новый закон о присяжных. Двенадцать девушек в совещательной комнате обсуждают дело. Одиннадцать хотят оправдать парня, но одна настаивает на обсуждении. В итоге выясняется, что он действительно виновен. Фильм показывает столкновение взглядов и ответственность присяжных.\nФильм отличается богатой атмосферой и актёрской игрой.\nПосле выхода фильма были выпущены товары с персонажами, особенно популярны были полноразмерные подушки с «главным злодеем» — беловолосой девушкой. Говорят, уже пишут фанфики о ней и главной героине."
andrius.36.a:0"Заставляет задуматься. А где купить фанфики?"

andrius.37.t:0"Революция и подземелья"
andrius.37.d:0"Недавно в Вольфендоме стала популярна настольная игра «Революция и подземелья». Игроки создают персонажей-«революционеров» и участвуют в приключениях, чтобы выполнить задания, обычно связанные со свержением «босса».\nСценарии, в основном, происходят в мире «Голубой Звезды», где нет элементов, а есть «электричество».\nИгра имеет высокую расширяемость и удовольствие от роли, но требует много времени и подготовки от ведущего.\nРуководитель нашего пропагандистского отдела считает, что популярность игры указывает на увеличение свободного времени у населения."
andrius.37.a:0"Ты, просто костюмированный персонаж, не занимаешься переговорами, а всё пытаешься подрабатывать благотворителем?"

andrius.38.t:0"Зов реакционера"
andrius.38.d:0"Недавно в Вольфендоме стала популярна настольная игра «Зов реакционера». Игроки создают персонажей-«партизан» и участвуют в расследованиях, чтобы выяснить истину и устранить аномалии.\nСценарии, в основном, происходят в мире «Голубой Звезды», где нет элементов, а есть только технологии.\nИгра имеет высокую расширяемость и удовольствие от роли, но требует много времени. Её популярность указывает на увеличение свободного времени у населения."
andrius.38.a:0"Проверка дисциплины успешна, снижаем коррупцию пионеров на 1d3."

andrius.39.t:0"Осуждение-убийство"
andrius.39.d:0"«Кстати,» — сказал Джим, сидя на стуле у окна, — «я давно не видел пропаганды из Вольфендома... Неужели благотворительные организации, призывавшие к пожертвованиям, исчезли?»\n«Как это не видел, мы сейчас играем в игру из Вольфендома», — раздражённо постучал по столу Хак. «Твоя речь такая? Тогда ход переходит к следующему».\n«Подожди, я ещё не всё сказал», — поднял руку Джим. «Я повторяю, я не “грешник”, я “спецпосланник”! Я проверял Хака прошлой ночью, он “золотая вода”!»\n«Что за чушь,» — возразил Хак, — «На самом деле “спецпосланник” — это я!»\n«Оба заявляют об этом...» — заметил кто-то.\n«Кстати, прошлой ночью никто не был “осквернён”,» — сказал другой, нарушая правила очерёдности. — «Может, “пионеры” защитили кого-то, или “социальный экспериментатор” спас его?»"
andrius.39.a:0"А может, “грешник” просто решил никого не убивать?"

andrius.40.t:0"«Сказки Фишль»"
andrius.40.d:0"«Хак, хватит темнить, выкладывай уже». Джим откинулся на спинку стула. «Я вижу по твоему лицу, ты снова раздобыл что-то из Вольфендома».\n«Это не так-то просто, Джим», — таинственно улыбнулся Хак. «Сейчас Вольфендом закрыт, и я с трудом достал эту книгу — “Сказки Фишль”!»\n«...Ты шутишь? Сказки?»\n«Не торопись, хоть это и звучит как сборник сказок, и там действительно есть сказки...» — Хак перелистнул несколько страниц. «Но в конце есть дополнение — короткая история “Легенда о принцессе осуждения”, то есть приквел к “Пространственному урагану”!»\n«Что, правда есть такое?»\n«Я знаю, что ты фанат “Хроник принцессы”, поэтому и принёс, благодари меня!»\n«Я не то чтобы фанат... Просто мне нравится необычный стиль книги, — сказал Джим. — Путешествие по мирам, распространение передовых идей и свержение существующего порядка — это редкость.\n«И персонажи живые, и язык отличный... и опечаток почти нет!»"
andrius.40.a:0"Хорошо бы купить новую часть «Хроник принцессы» в самом Вольфендоме."

andrius.41.t:0"Осуждение-убийство в небе"
andrius.41.d:0"Недавно среди населения стала популярна игра «Осуждение-убийство в небе».\nДействие происходит в будущем Мондштадта, где люди живут в парящих городах, но в них проникают шпионы старых аристократов.\nИгра заимствует механику из игры «Суд» из Фонтейна, но с улучшениями: она меньше зависит от языка, даёт больше информации и не ограничивается двумя фракциями. Эти нововведения делают её более интересной.\nИгра отражает рост социальной активности и надежды на будущее."
andrius.41.a:0"Уверен, он шпион, я видел, как он вылезал из трубы!"

andrius.42.t:0"Землевладелец"
andrius.42.d:0"Недавно среди населения Вольфендома стала популярна настольная игра «Землевладелец». Игроки получают стартовый капитал, бросают кубики и торгуются, покупая землю и строя дома, чтобы разорить соперников.\nИгра была изобретена интеллектуалом для моделирования экономики, но стала популярна в народе."
andrius.42.a:0"Кубик показал... 6,1,2,3,4,5,6, активируется..."

andrius.43.t:0"Меч 50K"
andrius.43.d:0"Недавно стала популярна настольная игра «Меч 50K». Действие происходит в далёком будущем, где человечество вышло за пределы неба. Лидеры людей — Консорциум свободных предприятий — сражаются с демонами порядка.\nИгроки покупают и раскрашивают миниатюры и используют карты местности. Правила уже в девятой редакции. Из-за дороговизны миниатюр и сложности правил игра популярна только среди богатых."
andrius.43.a:0"Свет серебряного унитаза ведёт нас!"

andrius.44.t:0"Король легенд"
andrius.44.d:0"Недавно стала популярна карточная игра «Король легенд». Игроки используют карты монстров, магии и ловушек. Карты иллюстрируют мифы и футуристические образы, с указанием атаки и защиты. Колоды состоят из 40-60 карт, 15 запасных и 15 дополнительных. Игра заканчивается, когда у одного из игроков заканчиваются очки жизни или карты.\nКарты продаются в бустерах. Главная интрига — никогда не знаешь, что внутри."
andrius.44.a:0"Моя жизнь угасла в бесконечных комбинациях... Вау, золотая карта!"

andrius.45.t:0"Давным-давно..."
andrius.45.d:0"«...Вот, давным-давно, история господина Беннета и народа Мондштадта».\nЗакончив читать, бабушка выключила электронную книгу. Ребёнок в кровати спросил:\n«Бабушка, правда раньше люди отнимали еду друг у друга, чтобы поесть самим?»\n«Конечно, правда, дитя», — ласково ответила бабушка, снимая очки. Лунный свет проникал сквозь шторы.\n«Тогда я хочу стать солдатом! — сказал ребёнок. — Чтобы защищать вкусную еду, которую делают люди!»\n«Ха-ха... Хорошо».\nБабушка знала, что детские мечты не всегда сбываются, но она хвалила само стремление.\n«Бабушка, — спросил ребёнок, — как выглядел дедушка Беннет?»\n«М-м...» — задумалась бабушка. — «В нашем городе есть единственный памятник Беннету. Если открыть окно, его должно быть видно».\nОна встала и раздвинула шторы.\nНо статуя была невысокой, и её не было видно.\nОна увидела лишь процветающий и гармоничный город, где люди свободно гуляли и разговаривали.\n...Свободно гуляли по земле Мондштадта, где больше не было цепей, сковывающих людей."
andrius.45.a:0"«Это последняя борьба, объединимся до завтра...»"
andrius.45.b:0"Конец истории... и новое начало."

andrius.46.t:0"Давным-давно..."
andrius.46.d:0"«...Вот, давным-давно, история господина Беннета и народа Мондштадта».\nЗакончив читать, бабушка выключила электронную книгу. Ребёнок в кровати спросил:\n«Бабушка, правда, если долго не есть, можно умереть?»\n«Конечно, правда, дитя», — ласково ответила бабушка, снимая очки. Лунный свет проникал сквозь шторы.\n«Тогда я хочу стать рабочим! — сказал ребёнок. — Чтобы все могли есть вкусную еду!»\n«Ха-ха... Хорошо».\nБабушка знала, что детские мечты не всегда сбываются, но она хвалила само стремление.\n«Бабушка, — спросил ребёнок, — как выглядел дедушка Беннет?»\n«М-м...» — задумалась бабушка. — «В нашем городе есть единственный памятник Беннету. Если открыть окно, его должно быть видно».\nОна встала и раздвинула шторы.\nНо статуя была невысокой, и её не было видно.\nОна увидела лишь процветающий и гармоничный город, где люди свободно гуляли и разговаривали.\n...Свободно гуляли по земле Мондштадта, где больше не было цепей, сковывающих людей."
andrius.46.a:0"«Создавая счастье человечества, мы полагаемся только на себя...»"
andrius.46.b:0"Конец истории... и новое начало."

andrius.47.t:0"Давным-давно..."
andrius.47.d:0"«...Вот, давным-давно, история господина Беннета и народа Мондштадта».\nЗакончив читать, бабушка выключила электронную книгу. Ребёнок в кровати спросил:\n«Бабушка, правда раньше люди запрещали петь, чтобы не быть неприятными?»\n«Конечно, правда, дитя», — ласково ответила бабушка, снимая очки. Лунный свет проникал сквозь шторы.\n«Тогда я хочу стать музыкантом! — сказал ребёнок. — Чтобы все всегда могли слушать хорошую музыку!»\n«Ха-ха... Хорошо».\nБабушка знала, что детские мечты не всегда сбываются, но она хвалила само стремление.\n«Бабушка, — спросил ребёнок, — как выглядел дедушка Беннет?»\n«М-м...» — задумалась бабушка. — «В нашем городе есть единственный памятник Беннету. Если открыть окно, его должно быть видно».\nОна встала и раздвинула шторы.\nНо статуя была невысокой, и её не было видно.\nОна увидела лишь процветающий и гармоничный город, где люди свободно гуляли и разговаривали.\n...Свободно гуляли по земле Мондштадта, где больше не было цепей, сковывающих людей."
andrius.47.a:0"«Не говорите, что мы нищие, мы будем хозяевами мира...»"
andrius.47.b:0"Мы называем это началом истории."

andrius.48.t:0"Давным-давно..."
andrius.48.d:0"«...Вот, давным-давно, история госпожи Фишль и народа Мондштадта».\nЗакончив читать, бабушка выключила электронную книгу. Ребёнок в кровати спросил:\n«Бабушка, а что такое ситуационизм?»\n«М-м... Бабушка тоже не знает, — ласково ответила она. — Я знаю только, что когда-то... госпожа Фишль вела им народ Мондштадта, и тогда ситуационизм называли «последним искусством в истории».\n«Если это так важно, почему же его забыли?»\nБабушка улыбнулась, погладила ребёнка по голове, и лунный свет залил комнату: «Дитя, госпожа Фишль говорила, что если люди забудут ситуационизм...»"
andrius.48.a:0"«...то это будет означать его окончательную победу»."
andrius.48.b:0"Последнее искусство не утеряно, оно находится в руках каждого.\nЭто и есть начало истории."

andrius.49.t:0"Тысяча рук и сто глаз"
andrius.49.d:0"«Итак, великий учёный из Фонтейна, — говорили алхимики в общежитии Вольфендома, — что у вас сегодня новенького?»\nФишль сидела в стороне, молча попивая чай... с изяществом.\n«Моя сегодняшняя идея... — сказал фонтейнец, всегда полный гениальных, но неосуществимых идей. — В Инадзуме была ситуация, когда сильная воля могла активировать чужой Глаз Бога...»\n«О? — спросил кто-то. — Значит, ваша идея — научить обычных людей использовать Глаза Бога?»\n«Нет-нет, мои идеи не так просты. — сказал учёный. — Я хочу понять принцип этого явления! Если мы его поймём, возможно, один человек сможет управлять тысячью Глаз Бога одновременно, превзойдя силу божества!»\n«Если бы это было так просто, это бы уже сделали!»\nВсе алхимики засмеялись... Даже фонтейнец смеялся, понимая, что идея неосуществима.\nТолько Фишль... с чашкой в руке, задумалась.\n...В далёком будущем эта странная идея, возможно, так и не воплотится. А возможно, кто-то и правда совершит это чудо."
andrius.49.a:0"Человек был изначально человеком, и стал богом."

andrius.50.t:0"Сон"
andrius.50.d:0"«...Сегодняшняя работа наконец закончена».\nФишль вздохнула и откинулась на спинку кресла: «Оз, принеси мне~»\n«Не просите невозможного, — сказал Оз, — у меня даже рук нет».\n«Эх...» — Фишль открыла ящик стола и достала роман. «Хм-м, “Клан Феникса 3”? Я уже читала это четыре раза. В последнее время нет возможности купить новые книги... Лучше посплю. Оз, покарауль у двери!»\n«Слушаюсь». Оз исчез.\nФишль закрыла ящик, поправила чёрное пальто и услышала, как её «коллекции» звякнули внутри. Она расслабленно откинулась на спинку кресла, закрыла глаза, но между бровей залегла складка.\n«Кажется, я что-то недоделала...» — пробормотала она. — «Церемония открытия новой фабрики... была... новый указ... подписан... внедрение новой технологии... тоже...»\nФишль перечисляла свои дела, как считала овец. Её голос становился всё тише.\n«...Всё сделано... Тогда посплю...»\nОна наконец расслабилась, слегка съёжившись. В этот момент она казалась более хрупкой, а её пальто — слишком большим, как одеяло.\nПеред сном в голове мелькнула картина: кто-то пришёл к ней за инвестициями в свою идею. Увидев Фишль, он удивился — он не ожидал, что лидер Мондштадта будет девушкой, и даже если женщиной, то высокой и суровой.\nЗатем Фишль провалилась в сон. Её «коллекции» внутри пальто слегка засветились.\n...По всему Мондштадту люди внезапно почувствовали сонливость. Она не мешала их действиям, но вызывала непреодолимое желание спать.\nИзвозчики завели лошадей в стойла, трактористы загнали тракторы в гаражи, уличные художники убрали баллончики с краской, обычные пары убрали посуду...\nСияющая ночь Мондштадта погасла, огни один за другим гаснут, пока весь город не погрузился в спокойную тьму.\nКаждый житель Мондштадта спал этой ночью спокойно и безмятежно."
andrius.50.a:0"Спокойной ночи, принцесса..."

andrius.51.t:0"Давным-давно..."
andrius.51.d:0"«...Вот, давным-давно, история господина Рэйзора и народа Мондштадта. Благодаря переговорам и сотрудничеству они преодолели бесчисленные трудности. Хотя на пути было много кризисов, корабль Мондштадта пережил все бури, которые считались способными его уничтожить, и плывёт до сих пор».\nЗакончив читать, бабушка выключила электронную книгу. Ребёнок в кровати спросил:\n«Бабушка, а какой у истории конец?»\n«У истории нет конца... Бабушка, вероятно, не увидит, чем она кончится, — ласково улыбнулась она. — Эту историю продолжают писать. И когда предыдущий автор сдаётся, находятся новые».\n«А я могу её писать, бабушка?»\n«Конечно, можешь, дитя, — погладила ребёнка по голове бабушка. — Хотя конец ещё не наступил, я могу представить, что будет дальше: перед объединённым народом Мондштадта будут вставать новые препятствия, но они будут преодолены и станут ступеньками к прогрессу...»"
andrius.51.a:0"Конец истории..."

andrius.52.t:0"Диона приняла приглашение"
andrius.52.d:0"Диона приняла приглашение и уже в пути в Вольфендом.\nОтныне мы будем тесно сотрудничать ради мира и счастья."
andrius.52.a:0"Отлично!"

andrius.53.t:0"Диона отклонила приглашение"
andrius.53.d:0"Мисс Диона в ответном письме подробно объяснила причины, по которым не может приехать в Вольфендом, и искренне предложила другие варианты сотрудничества."
andrius.53.a:0"Очень жаль."

andrius_news.1.t:0"Социализм авангарда объединил Мондштадт!"
andrius_news.1.d:0"Недавно завершилась затяжная гражданская война в Мондштадте, и победителем стала неожиданно возникшая Коммуна Вольфендома, ранее известная как Вольфендом.\nВ начале войны Вольфендом был лишь организацией взаимопомощи беженцев, но в ходе войны он привлёк всё больше сторонников и доказал свою силу в оборонительной войне. Затем он стал важной силой и, наконец, объединил Мондштадт.\nЛидер победителей, Беннет, объявил о создании «Союза Социалистических Республик Мондштадта» под руководством социализма авангарда. По замыслу, после создания союза все владения Мондштадта под центральным руководством создадут частично автономные социалистические республики, которые по статусу будут соответствовать провинциям. Ресурсы и власть в этом союзе будут сосредоточены в центре для координации и восстановления порядка.\nДальнейшие последствия ещё предстоит увидеть."
andrius_news.1.a:0"Победителями стали они?"
andrius_news.1.b:0"Это последняя борьба, объединимся до завтра!"
andrius_news.1.c:0"Интернационал обязательно восторжествует!"

andrius_news.2.t:0"Просвещённый социализм объединил Мондштадт!"
andrius_news.2.d:0"Недавно завершилась затяжная гражданская война в Мондштадте, и победителем стала неожиданно возникшая Коммуна Вольфендома, ранее известная как Вольфендом.\nВ начале войны Вольфендом был лишь организацией взаимопомощи беженцев, но в ходе войны он привлёк всё больше сторонников и доказал свою силу в оборонительной войне. Затем он стал важной силой и, наконец, объединил Мондштадт.\nЛидер победителей, Беннет, объявил о создании «Социалистической Федерации Мондштадта» под руководством просвещённого социализма. По замыслу, все владения Мондштадта создадут просвещённые социалистические местные правительства, а затем объединятся в федерацию. Ресурсы и власть будут в основном сосредоточены в центре, но штаты будут иметь определённую автономию.\nДальнейшие последствия ещё предстоит увидеть."
andrius_news.2.a:0"Победителями стали они?"
andrius_news.2.b:0"Создавая счастье человечества, мы полагаемся только на себя!"
andrius_news.2.c:0"Вставайте, не желающие быть рабами!"

andrius_news.3.t:0"Либертарный социализм объединил Мондштадт!"
andrius_news.3.d:0"Недавно завершилась затяжная гражданская война в Мондштадте, и победителем стала неожиданно возникшая Коммуна Вольфендома, ранее известная как Вольфендом.\nВ начале войны Вольфендом был лишь организацией взаимопомощи беженцев, но в ходе войны он привлёк всё больше сторонников и доказал свою силу в оборонительной войне. Затем он стал важной силой и, наконец, объединил Мондштадт.\nЛидер победителей, Беннет, объявил, что отныне Мондштадт будет называться «Освобождённая зона Мондштадта», и его жители будут строить производство под руководством либертарного социализма. Вопреки ожиданиям, правительство не будет полностью упразднено, а будут созданы демократически избираемые «комитеты» для выполнения обычных государственных функций, обеспечения порядка и обороны.\nДальнейшие последствия ещё предстоит увидеть."
andrius_news.3.a:0"Победителями стали они?"
andrius_news.3.b:0"Не говорите, что мы нищие, мы будем хозяевами мира!"
andrius_news.3.c:0"Мы потеряем только цепи, а обретём весь мир!"

andrius_news.4.t:0"Вольфендом взывает о помощи"
andrius_news.4.d:0"В охваченном войной Мондштадте разразился гуманитарный кризис. Беженцы покидают свои дома и стекаются в Вольфендом, следуя слухам.\nВ Вольфендоме уже создано автономное правительство беженцев. Оно испытывает нехватку ресурсов, кадров и технологий и обращается за помощью ко всем странам мира.\nНекоторые волонтёрские организации уже отправляются в Вольфендом, чтобы помочь с медициной и продовольствием."
andrius_news.4.a:0"Можно оказать умеренную помощь, но не тратьте слишком много Моры."
andrius_news.4.b:0"Кучка трусов, не обращайте внимания."
andrius_news.4.c:0"В Мондштадте всё всегда так плохо."
andrius_news.4.e:0"Справедливость всего мира будет поддержана справедливым миром."

andrius_news.5.t:0"Акселерационизм объединил Мондштадт!"
andrius_news.5.d:0"Недавно завершилась затяжная гражданская война в Мондштадте, и победителем стала неожиданно возникшая Художественная область Вечной Ночи, ранее известная как Вольфендом.\nВ начале войны Вольфендом был лишь организацией взаимопомощи беженцев, но в ходе войны он привлёк всё больше сторонников и доказал свою силу в оборонительной войне. Затем он стал важной силой и, наконец, объединил Мондштадт.\nПосле объявления о создании «Сумеречного царства» эта сила закрылась от внешнего мира. Вдоль границ Мондштадта поднялся странный туман, и, по данным наблюдений, он окутал весь Мондштадт. Все, кто пытался войти, исчезали без вести. Исследования в безопасных условиях продолжаются.\nПричины этого явления пока неизвестны, и последствия ещё предстоит увидеть."
andrius_news.5.a:0"Что случилось?"
andrius_news.5.b:0"Что такое «Сумеречное царство»?"
andrius_news.5.c:0"Да придет царствие её. Да будет воля её на земле, как на небе."

andrius_news.6.t:0"Ситуационизм объединил Мондштадт!"
andrius_news.6.d:0"Недавно завершилась затяжная гражданская война в Мондштадте, и победителем стала неожиданно возникшая Художественная область Вечной Ночи, ранее известная как Вольфендом.\nВ начале войны Вольфендом был лишь организацией взаимопомощи беженцев, но в ходе войны он привлёк всё больше сторонников и доказал свою силу в оборонительной войне. Затем он стал важной силой и, наконец, объединил Мондштадт.\nЛидер победителей, Фишль, объявила о создании «Пионерского государства Вечной Ночи» под руководством ситуационизма. Это государство будет стремиться разрушить привычный уклад жизни с помощью особых средств — от искусства до технологий — для создания «ситуаций», ускоряющих развитие идей и технологий, чтобы перейти к более равноправному обществу. Под руководством ситуационизма все владения Мондштадта создадут автономные правительства, направляемые центром, но они будут принципиально отличаться от обычных правительств.\nДальнейшие последствия ещё предстоит увидеть."
andrius_news.6.a:0"Похоже, это прогрессивная сила?"
andrius_news.6.b:0"Повторите, что такое ситуационизм?"
andrius_news.6.c:0"Чтобы освободить человечество, сначала нужно освободить разум!"

andrius_news.7.t:0"Реакционизм объединил Мондштадт!"
andrius_news.7.d:0"Недавно завершилась затяжная гражданская война в Мондштадте, и победителем стала неожиданно возникшая Свободная зона Родника, ранее известная как Вольфендом.\nВ начале войны Вольфендом был лишь организацией взаимопомощи беженцев, но в ходе войны он привлёк всё больше сторонников и доказал свою силу в оборонительной войне. Затем он стал важной силой и, наконец, объединил Мондштадт.\nНынешний лидер Вольфендома, Диона, ранее была лидером Спрингвейла. После объединения двух сил она завоевала лидерство в Вольфендоме благодаря своим способностям. Теперь она провозгласила создание «Священной Республики Мондштадт». Эта новая республика больше похожа не на федерацию, а на конфедерацию, состоящую из множества мелких административных единиц, объединённых под флагом Мондштадта.\nСвященная Республика Мондштадт называет себя ревизионистским государством, но проводит консервативную и традиционную политику, заимствуя у других стран стратегии для «поддержания стабильности». Её депутаты — в основном местные землевладельцы. Низовые организации Мондштадта теперь полностью контролируются этими землевладельцами, которые монополизировали все ресурсы, необходимые крестьянам.\nДальнейшие последствия ещё предстоит увидеть."
andrius_news.7.a:0"Сплошные реакционеры."
andrius_news.7.b:0"Справедливость восторжествовала!... Хотя, возможно, лучше держаться от них подальше."
andrius_news.7.c:0"Новым правителем Мондштадта стала карлица."
andrius_news.7.e:0"Да здравствует Священная Республика Мондштадт!"

andrius_news.8.t:0"Анархо-капитализм «объединил» Мондштадт!"
andrius_news.8.d:0"Недавно завершилась затяжная гражданская война в Мондштадте, и победителем стала неожиданно возникшая Свободная зона Родника, ранее известная как Вольфендом.\nВ начале войны Вольфендом был лишь организацией взаимопомощи беженцев, но в ходе войны он привлёк всё больше сторонников и доказал свою силу в оборонительной войне. Затем он стал важной силой и, наконец, объединил Мондштадт.\nЛидер, приведший Вольфендом к объединению, Диона, ранее была лидером Спрингвейла. После объединения двух сил она завоевала лидерство в Вольфендоме.\nТеперь мы получили сообщение: правительство Дионы «прекратило своё существование». Его административные функции были приватизированы и проданы крупным корпорациям. Консультативный орган новых предприятий Мондштадта объявил о создании «Консорциума свободных предприятий», а сама Диона стала его председателем. Этот консорциум, как крупнейший монополистический трест в Мондштадте, будет гарантировать абсолютно свободную рыночную экономику и выполнять государственные функции, такие как оборона, при условии получения прибыли.\nТеперь в Мондштадте нет традиционных местных правительств; власть в каждом регионе принадлежит различным корпорациям. Консорциум свободных предприятий Мондштадта, по-видимому, считает, что такая система максимально стимулирует творческий потенциал и является непревзойдённой истинной свободой.\nДальнейшие последствия ещё предстоит увидеть."
andrius_news.8.a:0"Посмотрим, как долго это просуществует."
andrius_news.8.b:0"Такая свобода слишком超前."
andrius_news.8.c:0"Что это за чудовище? Бред. Хотя кое-чему можно и позавидовать."
andrius_news.8.e:0"Да здравствует величайший laissez-faire! Пролетарии всех стран, объединяйтесь!"

andrius_news.9.t:0"Социал-ревизионизм объединил Мондштадт!"
andrius_news.9.d:0"Недавно завершилась затяжная гражданская война в Мондштадте, и победителем стал неожиданно возникший Вольфендом.\nВ начале войны Вольфендом был лишь организацией взаимопомощи беженцев, но в ходе войны он привлёк всё больше сторонников и доказал свою силу в оборонительной войне. Затем он стал важной силой и, наконец, объединил Мондштадт.\nЕстественный и избранный лидер Вольфендома, Рэйзор, объявил о создании «Свободной Федерации Мондштадта». По замыслу, штаты федерации будут иметь определённую автономию, но основные ресурсы будут сосредоточены в центральном правительстве. Свободная Федерация Мондштадта будет широко внедрять демократию по всей стране и использовать различные идеологические средства для сокращения классового неравенства, стремясь мирными средствами разрешать внутренние конфликты.\nСвободная Федерация Мондштадта заявляет, что не стремится к новой войне, и сейчас сосредоточена на восстановлении страны.\nДальнейшие последствия ещё предстоит увидеть."
andrius_news.9.a:0"По крайней мере, это прогрессивная сила."
andrius_news.9.b:0"Не слишком ли радикально?"
andrius_news.9.c:0"У них ничего не выйдет."
andrius_news.9.e:0"Да здравствует Свободная Федерация Мондштадта! Да здравствует народ Мондштадта!"

andrius_news.10.t:0"Социал-ревизионизм объединил Мондштадт!"
andrius_news.10.d:0"Недавно завершилась затяжная гражданская война в Мондштадте, и победителем стал неожиданно возникший Вольфендом.\nВ начале войны Вольфендом был лишь организацией взаимопомощи беженцев, но в ходе войны он привлёк всё больше сторонников и доказал свою силу в оборонительной войне. Затем он стал важной силой и, наконец, объединил Мондштадт.\nЕстественный и избранный лидер Вольфендома, Рэйзор, объявил о создании «Соединённых Штатов Мондштадта». По замыслу, штаты будут иметь значительную автономию, чтобы сдерживать центральное правительство, которое будет располагать основными ресурсами. Страна будет развиваться на основе переговоров и сдержек. Соединённые Штаты Мондштадта будут широко внедрять демократию и использовать прагматичные методы для сокращения классового неравенства, стремясь мирными средствами разрешать внутренние конфликты.\nСоединённые Штаты Мондштадта заявляют, что не стремятся к новой войне, и сейчас сосредоточены на восстановлении страны.\nДальнейшие последствия ещё предстоит увидеть."
andrius_news.10.a:0"По крайней мере, это прогрессивная сила."
andrius_news.10.b:0"Не слишком ли радикально?"
andrius_news.10.c:0"У них ничего не выйдет."
andrius_news.10.e:0"Да здравствуют Соединённые Штаты Мондштадта! Да здравствует народ Мондштадта!"

andrius_news.11.t:0"[Root.GetAndriusNews11Title]"
ANRRIUS_NEWS11_TITLE_PEACE:0"Вольфендом аннексировал Спрингвейл!"
ANRRIUS_NEWS11_TITLE_WAR:0"Вольфендом оккупировал Спрингвейл!"
andrius_news.11.d:0"[Root.GetAndriusNews11Desc]"
ANRRIUS_NEWS11_DESC_PEACE:0"С подписанием договора бывшим лидером Спрингвейла Дионой независимость этой свободной территории подошла к концу.\n\nБудучи самым слабым из семи регионов Мондштадта, Спрингвейл оказался между номинальным центральным правительством Мондштадта — Орденом Рыцарей Запада — и местной оппозицией — владениями Рагнвиндр. В разгар напряжённости Спрингвейл отказался от своей политики «строгого нейтралитета» и обратился к неожиданно возникшему Вольфендому. Договор об объединении был подписан с ошеломляющей скоростью, и эта богатая и желанная земля наконец обрела надёжного защитника."
ANRRIUS_NEWS11_DESC_WAR:0"С подписанием капитуляции бывшим лидером Спрингвейла Дионой независимость этой свободной территории подошла к концу.\n\nБудучи самым слабым из семи регионов Мондштадта, Спрингвейл оказался между номинальным центральным правительством Мондштадта — Орденом Рыцарей Запада — и местной оппозицией — владениями Рагнвиндр. В разгар напряжённости Спрингвейл сохранял политику «строгого нейтралитета». Однако его выгодное положение привлекло внимание неожиданно возникшего Вольфендома. Лидер Вольфендома явно имел далеко идущие планы, и Спрингвейл был лишь первой ступенью. Неожиданно для всех Вольфендом объявил войну Спрингвейлу и предпринял стремительную морскую атаку. Сопротивление длилось недолго, и флаг Вольфендома уже развевался над Спрингвейлом."
andrius_news.11.a:0"Великая победа"
andrius_news.11.b:0"Коварный ход"
andrius_news.11.c:0"Не станет ли это последней искрой, разжигающей пороховую бочку?"

ANR_integrate_springvale_flag:0"Вольфендом аннексировал Спрингвейл"

andrius.111.t:0"Разногласия"
andrius.111.d:0"Как уже говорилось, Вольфендом подошёл к решающей развилке. Перед нами как минимум четыре пути, и за каждым из них могут открыться новые разветвления... Прежде чем выбрать направление, давайте оглянемся на пройденный путь и посмотрим на возможные варианты.\nВо-первых, нынешнее состояние Вольфендома можно назвать естественно сложившимся «анархическим» обществом. Гражданская война в Мондштадте разрушила старые классовые перегородки. Прибывшие в Вольфендом люди (по нашей инициативе) стихийно создали организации взаимопомощи, демократическое правительство, законы, начали производство, а теперь ещё и дерутся на улицах за своих лидеров. К счастью, у нас есть законы, чтобы их усмирять... Большинство населения довольно такой «свободой», но некоторые считают, что её недостаточно, слишком много или она направлена не в ту сторону.\nЗа последние годы, когда у нас не было времени следить за этим, широко распространилась идеология «либертарного просвещённого социализма», особенно среди производителей. Сейчас это основная база поддержки Беннета. Они считают, что либертарный просвещённый социализм описывает наше прошлое и настоящее, и если мы продолжим этот путь, то будем переходить от одного успеха к другому.\nФишль, в свою очередь, развила либертарный социализм в «ситуационизм», предложив более быстрый путь к просвещённому обществу. Её сторонники ссылаются на её художественные произведения. Фишль проявила необычайные способности в строительстве и боях, и её поддерживают идеалистические администраторы, интеллигенция и многие, кто извлёк выгоду из её идей.\nНо для некоторых предыдущие два лидера не соответствуют их ожиданиям... и интересам. В условиях нашей прежней нерегулируемой экономики появились предприниматели и землевладельцы. Теперь они выдвигают Диону из Спрингвейла. Мисс Диона, похоже, считает, что может использовать этих людей для достижения целей «окольным путём», и говорит об этом искренне. Надеемся, её не обманут.\nГосподин Рэйзор хочет уладить новые противоречия. Это предложение выглядит неуместно, но находит отклик. К тому же, он был «представителем» Вольфендома и героем войны, поэтому у него тоже есть сторонники.\n...Вот возможные пути Вольфендома. Когда мы выберем один, обратной дороги уже не будет. Право выбора будет предоставлено народу — скоро начнутся всеобщие выборы!"
andrius.111.a:0"Истинная свобода основана на освобождении человечества!"
andrius.111.b:0"Свобода человека начинается со свободы разума!"
andrius.111.c:0"Шаг назад, два шага вперёд!"
andrius.111.e:0"Хватит спорить, давайте договоримся!"

