 Book_script_The_Traveler:0 "\nВ древние времена в Тейвате сначала буйствовали Семь Драконов, а затем сошёл Вечный Трон. Первый человек создал мир и даровал человечеству цивилизацию, которой правили Три Лунные Богини. В Год Погребального Огня начался великий хаос, восстали демоны, и постепенно появились Семь Архонтов, основав Мондштадт, Ли Юэ, Инадзуму и другие государства. Прошла тысяча лет, случилось восстание Кхенри'ах, и люди пострадали. Прошло ещё сто лет, и вот, вновь сгущаются тучи, грядёт великий переворот!"
DOT_Intro_UI_shuoming:0 "Рассвет Тейвата. Введение\n\n\nВ древние времена в Тейвате сначала буйствовали Семь Драконов, а затем сошёл Вечный Трон. Первый человек создал мир и даровал человечеству цивилизацию, которой правили Три Лунные Богини. В Год Погребального Огня начался великий хаос, восстали демоны, и постепенно появились Семь Архонтов, основав Мондштадт, Ли Юэ, Инадзуму и другие государства. Прошла тысяча лет, случилось восстание Кхенри'ах, и люди пострадали. Прошло ещё сто лет, и вот, вновь сгущаются тучи, грядёт великий переворот!\n\n"
