ANR_struggle_from_three_routes:0"Борьба за курс в Вольфендоме"
ANR_struggle_from_three_routes_desc:0"Борьба за курс в Вольфендоме будет вестись между Беннетом, Фишль и Дионой. Если ни один кандидат не победит с подавляющим влиянием, Рэйзор всё ещё может остаться лидером.\n§GКогда влияние кандидата достигнет 4, откроется национальный фокус для его прихода к власти. Вы также можете позволить Рэйзору продолжить свои реформы. Однако когда влияние одного кандидата достигнет 5, Рэйзор потеряет возможность остаться.§W\n§RВлияние Беннета: §W[?and_bennetts_influence]\n§YВлияние Фишль: §W[?and_fischls_influence]\n§BВлияние Дионы: §W[?and_dionas_influence]"
