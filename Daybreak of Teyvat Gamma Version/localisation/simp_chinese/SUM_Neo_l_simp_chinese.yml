 SUM_Neo.197.t:"降神仪式"
 SUM_Neo.197.d:"降神仪式在净善宫前举行，六大学派全部到场。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。教令院的门槛这几天被踩得很低，进去的人比出来的人多。"
