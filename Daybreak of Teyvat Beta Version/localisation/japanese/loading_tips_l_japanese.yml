 LOADING_TIP_164:0 "軍全体が心を一つにしなければ、完璧な計略も何の意味もない。諸雲騎に命を託されたからには、必ず期待に応えよう！\n――璃月の有名な読本『雲上五驍』"
 LOADING_TIP_165:0 "いかなる戦闘も、双方の物質的・精神的力量が流血と破壊を伴う形でぶつかり合うものである。最後にこの二つの力が多く残った側が勝者となる。\n――竜脊雪山領議会議長 アルベド、1938年"