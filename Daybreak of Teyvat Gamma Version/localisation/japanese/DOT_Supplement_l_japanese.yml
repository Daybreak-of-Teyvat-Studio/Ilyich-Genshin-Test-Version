 HOL_bernhard_air_example:0 "ベルンハルト王配が飛行士に模範を示す"
 HOL_bernhard_coltof:0 "ベルンハルト・コルトフ"
 HOL_bernhard_intelligence:0 "ベルンハルト王配が情報を収集"
 HOL_bernhard_organized_resistance:0 "ベルンハルト王配がレジスタンスを組織"
 HOL_bernhard_strategy_meddling:0 "ベルンハルト王配が戦略に干渉"
 HOL_caved_to_the_british_idea:0 "イギリスに屈服した"
 HOL_caved_to_the_british_idea_desc:0 "確実に経済的災厄を招くであろう、イギリスによる貿易路の完全封鎖の脅威に直面するよりは、オランダ政府はイギリスの通商協定の要求に同意することを選択した。反独感情及び、親英感情の高まりは国内でますます顕著となりつつあり、このイギリスの要求への同意は、オランダが中立政策から踏み出す最初の暫定的な一歩として受け止められている。"
 HOL_caved_to_the_germans_idea:0 "ドイツに屈服した"
 HOL_caved_to_the_germans_idea_desc:0 "侵略の脅威に直面するよりはむしろ、ドイツとの貿易交渉において彼らの要求を認めることを決定した。民主主義の自由は結果的に損なわれ始め、このことは中立から離れた最初の試験的な段階とみなされる可能性がある。"
 HOL_charles_douw_van_der_krap:0 "シャルル・ダウ・ファン・デル・クラップ"
 HOL_communism:0 "人民州連合"
 HOL_communism_ADJ:0 "オランダ"
 HOL_communism_DEF:0 "人民州連合"
 HOL_conrad_helfrich:0 "コンラート・ヘルフリフ"
 HOL_cornelis_van_geelkerken:0 "コルネリス・ファン・ヘールケルケン"
 HOL_de_crisisjaren:0 "危機の年"
 HOL_de_crisisjaren_desc:0 "世界経済の特殊性によって、世界恐慌の影響は他の国より大いに遅れてオランダに打撃を与えることとなった。他国が金本位制をいち早く放棄したのに対して、オランダ政府は金本位制を維持し続けるという決断を下したため、オランダにおける「危機の年（De Crisisjaren）」を更に悪化させることとなった。通貨ギルダーの切り下げを押しとどめるための資金は、脆弱なオランダ経済には残されておらず、言うまでも無いことだが、貧弱な状態の防衛力を改善するための資金も存在しない。\n\n公共事業への投資によって、この危機から抜け出せるだろう。そしてもし我々が降伏し、危機に瀕した本土の支配を失った時、その投資は大きく的外れなものになる恐れがある。"
 HOL_de_vaarplicht_idea:0 "義務"
 HOL_de_vaarplicht_idea_desc:0 "「勅令A5に従い、全てのオランダ国民とオランダの諸市民は、徴兵を受けていない、徴兵を受けている、または現在まだ役務に呼び出されていないの如何に問わず、商船隊において、またはそのために役を務める義務を有する」"
