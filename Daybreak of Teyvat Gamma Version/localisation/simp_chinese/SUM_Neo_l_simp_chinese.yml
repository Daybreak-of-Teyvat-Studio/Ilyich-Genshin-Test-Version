 SUM_SDH_RB_War_Economy_desc:"把盐、粮、铁都纳入战时管制，先军后民。"
 SUM_Neo_SDH.117.t:"战时经济"
 SUM_Neo_SDH.117.d:"把盐、粮、铁都纳入战时管制，先军后民。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
