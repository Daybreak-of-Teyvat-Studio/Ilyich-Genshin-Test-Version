 SUM_Neo_SGS_U5_View_desc:"研究速度 +15%、政治点数获取 +15%、陆军攻击 +10%"
 SUM_Neo_SGS_Combo_HH_View:"灵法双耀"
 SUM_Neo_SGS_Combo_HH_View_desc:"稳定度 +20%、研究速度 +10%"
 SUM_Neo_SGS_Combo_LL_View:"幽厅深扃"
 SUM_Neo_SGS_Combo_LL_View_desc:"稳定度 -20%、陆军防御 +20%"
