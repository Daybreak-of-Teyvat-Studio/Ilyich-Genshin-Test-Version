 SUM_Neo_SDH.183.d:"总攻选在换季的大风，风一起，天地分不清。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
