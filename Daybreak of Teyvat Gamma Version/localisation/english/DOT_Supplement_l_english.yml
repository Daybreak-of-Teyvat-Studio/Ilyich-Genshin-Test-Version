 ITA_italian_hegemony_subjects:0 "Italian Hegemony"
 ITA_italian_hegemony_subjects_desc:0 "Unite under [ITA.GetNameDef]’s hegemony we are the protectors of fascism, acting like a bastion of truth and enlightenment. No one and nothing shall stand in our way!"
