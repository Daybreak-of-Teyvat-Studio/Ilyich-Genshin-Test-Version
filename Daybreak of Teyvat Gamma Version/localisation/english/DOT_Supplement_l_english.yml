 GRE_political_instability_communist:0 "Political Instability"
 GRE_political_instability_communist_desc:0 "§WThe £faction_gre_monarchist §YMonarchists§! are [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§WThe £faction_gre_venezelist §YRepublicans§! are [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§WThe £faction_gre_communist §YCommunists§! are [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects] \n\n§WThe £faction_gre_fascist §YFascists§! are [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects] \n\nBetween 1924 and 1935 we have had twenty three changes of government, thirteen coups, and a dictatorship! For the first time in a very long time, Greece finally has a movement that puts the Greek people first in charge of the nation. But our movement is young, and we have much to prove before the people well and truly trust in our rule."
 GRE_political_instability_desc:0 "§WThe £faction_gre_monarchist §YMonarchists§! are [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§WThe £faction_gre_venezelist §YRepublicans§! are [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§WThe £faction_gre_communist §YCommunists§! are [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects] \n\n§WThe £faction_gre_fascist §YFascists§! are [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects] \n\nBetween 1924 and 1935 we have had twenty three changes of government, thirteen coups, and a dictatorship! The people have had enough and are ready for some stability in their government, but they also remain cautiously skeptical about the odds of any one government surviving very long. We must prove them wrong and bring an end to the constant infighting by bringing our political foes to heel."
 GRE_political_instability_dummy_desc:0 "Between 1924 and 1935 we have had twenty three changes of government, thirteen coups, and a dictatorship! The people have had enough and are ready for some stability in their government, but they also remain cautiously skeptical about the odds of any one government surviving very long. We must prove them wrong and bring an end to the constant infighting by bringing our political foes to heel."
 GRE_political_instability_fascism:0 "Political Instability"
 GRE_political_instability_fascism_desc:0 "§WThe £faction_gre_monarchist §YMonarchists§! are [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§WThe £faction_gre_venezelist §YRepublicans§! are [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§WThe £faction_gre_communist §YCommunists§! are [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects] \n\n§WThe £faction_gre_fascist §YFascists§! are [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects] \n\nBetween 1924 and 1935 we have had twenty three changes of government, thirteen coups, and a dictatorship! Fascism upholds unity above all else - if we cannot effectively mobilize the Greek people and help them see that fascism is the clear answer to Greece's woes, then we do not deserve to rule."
 GRE_political_instability_metaxas:0 "Political Instability"
 GRE_political_instability_metaxas_desc:0 "§WThe £faction_gre_monarchist §YMonarchists§! are [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§WThe £faction_gre_venezelist §YRepublicans§! are [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§WThe £faction_gre_communist §YCommunists§! are [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects] \n\n§WThe £faction_gre_fascist §YFascists§! are [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects] \n\nBetween 1924 and 1935 we have had twenty three changes of government, thirteen coups, and a dictatorship! Under Metaxas' leadership, we shall achieve unity through strength by crushing all of our foes! The Greek people shall come to learn how a government that has the will to establish order in this lawless country operates."
 GRE_political_instability_republican:0 "Political Instability"
 GRE_political_instability_republican_2:0 "Political Instability"
 GRE_political_instability_republican_2_desc:0 "§WThe £faction_gre_monarchist §YMonarchists§! are [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§WThe £faction_gre_venezelist §YRepublicans§! are [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§WThe £faction_gre_communist §YCommunists§! are [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects] \n\n§WThe £faction_gre_fascist §YFascists§! are [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects] \n\nBetween 1924 and 1935 we have had twenty three changes of government, thirteen coups, and a dictatorship! We, the Venezelists, cannot deny the... small part we may have had to play in that. At least the people are familiar with us as the Devil they know! It's now up to us to fulfill our legacy, and to finish the journey Greece started in 1919 when we tried to take back Constantinople..."
 GRE_political_instability_republican_desc:0 "§WThe £faction_gre_monarchist §YMonarchists§! are [Root.GetMonarchistLoyaltyLevel].§! [ROOT.GetMonarchistLoyaltyEffects] \n\n§WThe £faction_gre_venezelist §YRepublicans§! are [Root.GetRepublicanLoyaltyLevel].§! [ROOT.GetRepublicanLoyaltyEffects] \n\n§WThe £faction_gre_communist §YCommunists§! are [Root.GetCommunistLoyaltyLevel].§! [ROOT.GetCommunistLoyaltyEffects] \n\n§WThe £faction_gre_fascist §YFascists§! are [Root.GetFascistLoyaltyLevel].§! [ROOT.GetFascistLoyaltyEffects] \n\nBetween 1924 and 1935 we have had twenty three changes of government, thirteen coups, and a dictatorship! We, the Venezelists, cannot deny the... small part we may have had to play in that. At least the people are familiar with us as the Devil they know! Unfortunately, the memories of the Anatolian Catastrophe are still fresh in the minds of the Greek people and they have not forgotten the role we played in it either."
 GRE_protectors_of_the_mediterranean_spirit:0 "[Root.GetProtectorsMediterraneanSpiritName]"
 GRE_protectors_of_the_mediterranean_spirit_desc:0 "The Mediterranean has been our home far longer than it has been anybody else's home. We have a responsibility to this region, and to the people within - and we do not intend to forsake this sacred duty."
 GRE_pyrkal:0 "Pyrkal"
 GRE_red_militias_2:0 "Red Army"
 GRE_red_militias_2_desc:0 "A true communist state requires a people's army which can execute the will of the workers with impunity."
 GRE_red_militias_3:0 "Red Enforcers"
 GRE_red_militias_3_desc:0 "Subversive agents who conspire against the Party are everywhere, but you only need to train a small group of talented people to find and uproot them..."
 GRE_red_militias_spirit:0 "Red Militias"
 GRE_red_militias_spirit_desc:0 "There are many who would seek to thwart our efforts in modernizing Greek society, but with the organization of militias dedicated to preserving the Revolution they will find it all the more difficult to stop us."
 GRE_republicans_friendly_or_loyal:0 "The £faction_gre_venezelist §YRepublicans§! are friendly or loyal."
 GRE_reviving_the_double_headed_eagle_2:0 "Reviving the Spirit of the Double-Headed Eagle"
 GRE_reviving_the_double_headed_eagle_2_desc:0 "The Venizelists were cowards who refused to let Greece restore its true lost glory – the glory of Byzantium! Why stop with Turkey’s coasts when we can reclaim all the lost territories of the Empire? A new age of glory for Greece has begun!"
 GRE_reviving_the_double_headed_eagle_spirit:0 "Reviving the Spirit of the Double-Headed Eagle"
 GRE_reviving_the_double_headed_eagle_spirit_desc:0 "The Venizelists were cowards who refused to let Greece restore its true lost glory – the glory of Byzantium! Why stop with Turkey’s coasts when we can reclaim all the lost territories of the Empire? A new age of glory for Greece has begun!"
 GRE_rheinmetall:0 "Rheinmetall"
 GRE_royal_hellenic_naval_shipyard:0 "Royal Hellenic Naval Shipyard"
 GRE_rsaf_enfield:0 "RSAF Enfield"
 GRE_rural_exodus:0 "Rural Exodus"
 GRE_rural_exodus_Desc:0 "With our push towards industrialization, people have been leaving their homes in rural regions of the country to flock to the larger urban cities."
 GRE_schachtplan:0 "Schachtplan"
 GRE_schachtplan_desc:0 "The brainchild of German economist Hjalmar Schacht, the Schachtplan guarantees Greek access to German markets in exchange for increased imports of raw materials from Greece to Germany. The Germans have been generously keeping us afloat, and yet we may have fallen right into their trap by becoming so dependent on their generosity."
 GRE_schachtplan_fascistised:0 "The Gotzamanis-Schachtplan"
 GRE_schachtplan_fascistised_desc:0 "Based on Hjalmar Schacht's original Schachtplan, the new Schachtplan has been meticulously put together by Germany and Greece's greatest corporatist economists: forging a new economic pact based on the tenets of National Socialism. While this economic agreement may not be dependable in the long-term, it shall serve us well enough during these years of strife."
 GRE_schachtplan_modified:0 "Schachtplan"
 GRE_schachtplan_modified_desc:0 "The brainchild of the brilliant Hjalmar Schacht, the Schachtplan guarantees Greek access to German markets in exchange for prioritized market access to Greece's raw materials. The Germans have in the past been generously keeping us afloat, and together we have built a truly special economic relationship."
 GRE_security_batallions:0 "Security Batallions"
 GRE_security_batallions_desc:0 "In order to keep the peace in occupied territory and in our own country, we have been forced to form security battalions made up of the most ardent fascists our nation has to offer."
 GRE_siemens:0 "Siemens"
 GRE_small_investment:0 "Small Investment into [GRE.GetNameDef]"
 GRE_small_investment_desc:0 "We have made a modest investment into the economy of [GRE.GetNameDef]."
 GRE_socialist_economy_2:0 "Greek Socialism"
 GRE_socialist_economy_2_desc:0 "The Greek people have bled for too long under the autocratic rule of the false king and the warmongering Venizelists, it is time for the people to finally prosper under a government that puts them first!"
 GRE_socialist_economy_3:0 "Greek Stalinism"
 GRE_socialist_economy_3_desc:0 "The Party comes before everything; if one is not loyal to the Party, then they are a subversive traitor and a danger to our entire nation."
 GRE_socialist_economy_4:0 "Greek Communism"
 GRE_socialist_economy_4_desc:0 "The worker comes before everything else; if we as a government put in power by and made up of workers cannot represent the best interests of the workers, then who could?"
 GRE_socialist_economy_spirit:0 "Greek Socialism"
 GRE_socialist_economy_spirit_desc:0 "We have implemented an economy that puts people before profits. We have a clear enemy in exploitative capitalists from abroad and in local opportunistic vermin looking to cheat the [ROOT.GetAdjective] worker out of their fair dues."
 GRE_sophistry_and_science_idea:0 "Sophistry and Science"
 GRE_sophistry_and_science_idea_desc:0 "Through fostering a co-dependence between politicians and scientists, we shall bring ourselves one step closer to modernity."
 GRE_sophoklis_venizelos:0 "Sophoklis Venizelos"
