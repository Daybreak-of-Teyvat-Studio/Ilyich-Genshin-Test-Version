DRA_Completion_of_the_International_Research_Institute:0"Открытие Международного института"
DRA_Completion_of_the_International_Research_Institute_desc:0"Ледяной ветер Драконьего хребта сегодня стал мягче. Даже Альбедо улыбнулся."
DRA_mollis_favonius:0"Лёгкий ветерок"
DRA_mollis_favonius_desc:0"Сахароза работает на хребте, и её исследования близки к завершению. Её ценят учёные."
DRA_Cold_resistant_special_wheat:0"Морозостойкая пшеница 996"
DRA_Cold_resistant_special_wheat_desc:0"Сахароза создала морозостойкую пшеницу, дающую хороший урожай даже в снегах. Она назвала её «996»."
DRA_FOCUS_Homuncular_Nature:0"Мудрость человека в колбе"
DRA_FOCUS_Homuncular_Nature_desc:0"Альбедо назначен руководить развитием хребта благодаря своему уму. Хотя он не общителен, жители уважают его."
DRA_Achievements_of_Phase_II_development_plan:0"Итоги второго этапа"
DRA_Achievements_of_Phase_II_development_plan_desc:0"Второй этап завершён, новые поселенцы прибудут для добычи ресурсов."
DRA_FOCUS_witch_of_rose:0"Ведьма роз"
DRA_FOCUS_witch_of_rose_desc:0"Лиза, библиотекарь, временно помогает Альбедо. Учёные из Сумеру хотят, чтобы она осталась."
DRA_Rescue_plan_for_the_victims:0"План спасения"
DRA_Rescue_plan_for_the_victims_desc:0"На хребте часто пропадают люди. Лиза разработала план спасения."
DRA_division_of_mond:0"Кризис в Мондштадте"
DRA_division_of_mond_desc:0"Мондштадт на грани раскола. Снабжение хребта прервано, и нас ждут трудные времена."
DRA_internal_meeting:0"Внутреннее совещание"
DRA_internal_meeting_desc:0"Хаос нарастает. Мы должны восстановить порядок, чтобы выжить."
DRA_Albedo_remained:0"Альбедо остаётся"
DRA_Albedo_remained_desc:0"Альбедо избран лидером. Он будет управлять железной рукой."
DRA_Sucrose_unexpected_victory:0"Победа Сахарозы"
DRA_Sucrose_unexpected_victory_desc:0"Сахароза неожиданно победила. Народ доверяет ей больше, чем другим."
DRA_Lisa_accept_her_winning:0"Лиза соглашается"
DRA_Lisa_accept_her_winning_desc:0"Учёные из Сумеру поддерживают Лизу, и она становится лидером."
DRA_Dispatch_Elite_Medical_Staff:0"Отправка медиков"
DRA_Dispatch_Elite_Medical_Staff_desc:0"Сахароза отправляет медиков для помощи пострадавшим."
DRA_for_our_compatirots_lives:0"За жизни соотечественников"
DRA_for_our_compatirots_lives_desc:0"Мы поможем нашим соотечественникам, попавшим в беду."
DRA_join_in_the_civil_war:0"Конец «Чёрной земли»"
DRA_join_in_the_civil_war_desc:0"Альбедо называет это «чернением» — смертью и хаосом. Мы покажем путь к «белению»."
DRA_For_Peace_of_Mond:0"За мир в Мондштадте"
DRA_For_Peace_of_Mond_desc:0"Мы не будем сидеть сложа руки. Мы защитим себя и вернём мир Мондштадту!"
DRA_green_channel_for_refugees:0"Зелёный коридор"
DRA_green_channel_for_refugees_desc:0"Лиза создаёт коридор для беженцев."
DRA_For_the_Universal_Justice:0"За народный покой"
DRA_For_the_Universal_Justice_desc:0"Мы не можем остановить войну, но можем уменьшить её жертвы."


