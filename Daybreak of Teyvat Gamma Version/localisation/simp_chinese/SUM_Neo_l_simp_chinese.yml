 SUM_Neo.117.t:"学报自由"
 SUM_Neo.117.d:"学报可以自由刊行，错的东西也可以被印出来。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。"
