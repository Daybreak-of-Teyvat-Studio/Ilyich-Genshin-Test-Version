 SUM_Neo.64.d:"兰那罗与须弥立盟，守护雨林的根。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。"
 SUM_Neo.64.a:"以草神之名行事"
 SUM_Neo.64.b:"以律条为先"
 SUM_Neo.65.t:"兰那罗的祝福"
 SUM_Neo.65.d:"兰那罗的祝福落在须弥每一棵树上。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。教令院的门槛这几天被踩得很低，进去的人比出来的人多。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。树梢上还挂着露水。"
 SUM_Neo.65.a:"让梦回到须弥"
 SUM_Neo.65.b:"先看住封印"
 SUM_Neo.66.t:"绿荫之约"
 SUM_Neo.66.d:"绿荫之约立下：凡兰那罗所守之林，须弥不伐。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。教令院的门槛这几天被踩得很低，进去的人比出来的人多。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。"
 SUM_Neo.66.a:"让神谕通行"
 SUM_Neo.66.b:"收束信仰的边界"
 SUM_Neo.67.t:"世界树的根"
 SUM_Neo.67.d:"世界树的根系贯通须弥全境，草神说那是记忆的血管。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。"
 SUM_Neo.67.a:"以草神之名行事"
 SUM_Neo.67.b:"以律条为先"
 SUM_Neo.68.t:"世界树的梦"
 SUM_Neo.68.d:"世界树也有梦，梦里是大慈树王还在的日子。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。教令院的门槛这几天被踩得很低，进去的人比出来的人多。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。"
