 ITA_regio_esercito_dynamic_modifier:0 "Regio Esercito"
 ITA_regio_esercito_dynamic_modifier_desc:0 "The Italian army fought in the first World War and was on the victorious side, but has not been able to keep up with the military modernization. By adapting to modern times we will strengthen the army and be ever-victorious."
 ITA_ricostruzione_industriale_dynamic_modifier:0 "Ricostruzione Industriale"
 ITA_ricostruzione_industriale_dynamic_modifier_desc:0 "Our efforts to save our domestic industries after the Great Depression have proven to be successful. By investing in Italy's industrial capacity even further our productivity will soon rival those of the major powers."
