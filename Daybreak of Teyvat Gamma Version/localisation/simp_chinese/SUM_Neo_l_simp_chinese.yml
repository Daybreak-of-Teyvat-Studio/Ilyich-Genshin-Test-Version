 SUM_Neo.225.t:"至冬同盟"
 SUM_Neo.225.d:"须弥与至冬结盟，须弥的沙漠成了至冬的前哨。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。"
