 SOV_administrative_reforms_idea:0 "Administrative Reforms"
 SOV_administrative_reforms_idea_desc:0 "The old Soviet administration was hampered by inefficiency partly due to its size but mainly by a too rigorous control apparatus. By reducing it a little, much has been gained."
 SOV_agents_in_the_stalinist_command_poum:0 "Agents in the Stalinist Command"
 SOV_agents_in_the_stalinist_command_poum_desc:0 "The Soviet Right Opposition managed to infiltrate several agents among the latest batch of military advisers sent to the Spanish Republic by [SOU.GetLeader]. These agents have created a network of informants that allow us to learn about the enemy plans before they are carried out."
 SOV_ambassador_karim_khakimov:0 "Soviet Ambassador Karim Khakimov"
 SOV_ambassador_karim_khakimov_desc:0 "$NSB_soviet_foreign_politics_events.211.desc$"
 SOV_an_empire_in_the_pacific_idea:0 "Empire in the Pacific"
 SOV_anti_capitalist_campaign_generic:0 "Anti-Capitalist Campaign"
 SOV_anti_capitalist_campaign_generic_desc:0 "Capitalists cannot be trusted. When given the choice, the Bourgeoisie will always choose to oppress the proletariat. We must be prepared to take the fight to them."
 SOV_anti_fascist_campaign_generic:0 "Anti-Fascist Campaign"
 SOV_anti_fascist_campaign_generic_desc:0 "There can be no peaceful co-existence with the fascists. We must prepare for the inevitable confrontation."
 SOV_anti_soviet_military_thinking_banned_airforce:0 "Anti-Soviet Military Thinking Banned"
 SOV_anti_soviet_military_thinking_banned_airforce_desc:0 "The study and discussion of documents and ideas from disgraced and reactionary theorists is now forbidden for our Air Force officers in the Academy, and new graduates are scrupulously vetted to ensure that no enemy of the people accesses the ranks of the Soviet Air Force."
 SOV_anti_soviet_military_thinking_banned_army:0 "Anti-Soviet Military Thinking Banned"
 SOV_anti_soviet_military_thinking_banned_army_desc:0 "The study and discussion of documents and ideas from disgraced and reactionary theorists is now forbidden for our Army officers in the Academy, and new graduates are scrupulously vetted to ensure that no enemy of the people accesses the ranks of the Red Army."
 SOV_anti_soviet_military_thinking_banned_navy:0 "Anti-Soviet Military Thinking Banned"
 SOV_anti_soviet_military_thinking_banned_navy_desc:0 "The study and discussion of documents and ideas from disgraced and reactionary theorists is now forbidden for our Navy officers in the Academy, and new graduates are scrupulously vetted to ensure that no enemy of the people accesses the ranks of the Red Fleet."
