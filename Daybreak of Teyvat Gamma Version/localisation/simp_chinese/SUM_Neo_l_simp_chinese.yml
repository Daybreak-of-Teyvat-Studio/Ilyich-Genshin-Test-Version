 SUM_Neo.120.t:"学派议事会"
 SUM_Neo.120.d:"学派议事会成为须弥最高的学问机构。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。"
