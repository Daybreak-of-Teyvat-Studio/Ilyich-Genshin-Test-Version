 Ilyich_Tech_decisions_desc:"Южная звезда проливает свет на лазурные реки,\nОдинокий корабль под луной плывёт по небосводу.\nТысячелетняя звёздная душа бросает вызов бескрайнему морю,\nОдним взмахом весла под ветром усмиряет бездонные бездны."
 Ilyich_Tech_decisions_01_desc:"Южная звезда проливает свет на лазурные реки,\nОдинокий корабль под луной плывёт по небосводу.\nТысячелетняя звёздная душа бросает вызов бескрайнему морю,\nОдним взмахом весла под ветром усмиряет бездонные бездны."
 Ilyich_Tech_decisions_02_desc:"Южная звезда проливает свет на лазурные реки,\nОдинокий корабль под луной плывёт по небосводу.\nТысячелетняя звёздная душа бросает вызов бескрайнему морю,\nОдним взмахом весла под ветром усмиряет бездонные бездны."
 DOT_Tech.3.t:"Призыв героических духов"
 DOT_Tech.3.d:"Наполнись, наполнись, наполнись, наполнись, наполнись!\nМоё тело предаётся тебе, твой меч предаётся моей судьбе; откликнись на зов судьбы. Если ты готов подчиниться этой воле и этому закону — ответь мне. Клянусь здесь.\nЯ совершу все добрые деяния в этом мире;\nЯ истреблю все злодеяния в этом мире.\nПрорви колесо сдерживания, явись! Хранитель весов!"
 DOT_Tech.3.a:"Аааааааа"
