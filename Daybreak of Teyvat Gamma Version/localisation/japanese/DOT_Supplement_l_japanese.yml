 FIN_personal_agenda_aaltonen_tt:0 "§G反ファシスト十字軍§!: 全ての参加している戦争における戦争貢献度が§Y10%§!を上回り、ファシスト国家との戦時中の降伏進捗が§Y5%§!を下回ると、£GFX_power_balance_texticon §Y国民の信頼§!が増加します。\n - §R分裂したプロレタリアート§!: $communism$思想への支持が§Y80%§!を下回ると、£GFX_power_balance_texticon §Y国民の信頼§!が低下します。\n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_annala_tt:0 "§G強い国家§!: 戦時中に £GFX_manpower_texticon 戦場の$MANPOWER$が§Y300.000§!を上回り、降伏進捗が§Y5%§!を下回っていると、£GFX_power_balance_texticon §Y国民の信頼§!が高まります。\n - §R社会主義支持の懸念§!: $democratic$や$communism$思想の支持が§Y9%§!を上回ると、£GFX_power_balance_texticon §Y国民の信頼§!が低下します。\n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kallio_tt:0 "§G過激派の根絶§!: $fascism$と$communism$思想の支持が§Y1%§!を下回ると、£GFX_power_balance_texticon §Y国民の信頼§!が高まります。\n  - §R過激派支持の懸念§!:  $fascism$や$communism$思想の支持が§Y9%§!を上回ると、£GFX_power_balance_texticon §Y国民の信頼§!が低下します。\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_kuusinen_tt:0 "§G組織の太陽系§!: 全ての§Yスカンディナヴィア§!と§Yバルトの中核州§!がフィンランドまたは同盟国により支配されていると、£GFX_power_balance_texticon §Y国民の信頼§!が増加します。\n - §R忘れ去られたフィンランド・カレリア人§!: §Yカレリア§!、§Yコラ§!、§Yオネガ§!、§Yオロネツ§!州を支配していないと、£GFX_power_balance_texticon §Y国民の信頼§!が低下します。\n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_leino_tt:0 "§G淘汰されたヨーロッパのファシズム§!: ヨーロッパをファシスト政府から解放しつつ、$fascism$思想への支持が§Y1%§!を下回ると、£GFX_power_balance_texticon §Y国民の信頼§!が増加します。\n - §R分裂したプロレタリアート§!: $communism$思想への支持が§Y80%§!を下回ると、£GFX_power_balance_texticon §Y国民の信頼§!が低下します。\n - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_mannerheim_tt:0 "§G頼れる指導者§!: 戦争をすることで£GFX_power_balance_texticon §Y国民の信頼§!が高まります。\n  - §R選ばれし摂政§!: 平和な状態にあると£GFX_power_balance_texticon §Y国民の信頼§!が低下します。"
 FIN_personal_agenda_paasikivi_tt:0 "§G現実主義的保守§!: £GFX_stability_texticon $stability$が§Y95%§!を上回ると、£GFX_power_balance_texticon §Y国民の信頼§!が高まります。\n  - §R暫定代行§!: £GFX_stability_texticon $stability$が§Y60%§!を下回ると、£GFX_power_balance_texticon §Y国民の信頼§!が低下します。\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_ryti_tt:0 "§G大フィンランドの夢§!: 敵の支配下にあるフィンランドの中核州を占領すると、£GFX_power_balance_texticon §Y国民の信頼§!が高まります。\n  - §R社会主義支持の懸念§!:  $democratic$や$communism$思想の支持が§Y9%§!を上回ると、£GFX_power_balance_texticon §Y国民の信頼§!が低下します。\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_svinhufvud_tt:0 "§G社会主義の根絶§!: $democratic$と$communism$思想の支持が§Y1%§!を下回ると、£GFX_power_balance_texticon §Y国民の信頼§!が高まります。\n  - §R社会主義支持の懸念§!:  $democratic$や$communism$思想の支持が§Y9%§!を上回ると、£GFX_power_balance_texticon §Y国民の信頼§!が低下します。\n  - $losing_soverignty_threatened_tt$"
 FIN_personal_agenda_tanner_tt:0 "§G団結した国家§!: $democratic$思想への支持が§Y95%§!を上回っている状態で§Yカレリア§!と全ての支配下の州を支配すると、£GFX_power_balance_texticon §Y国民の信頼§!が高まります。\n - §R過激派支持の懸念§!: $fascism$や$communism$思想の支持が§Y9%§!を上回ると、£GFX_power_balance_texticon §Y国民の信頼§!が低下します。\n - $losing_soverignty_threatened_tt$"
