 NAT_Nightwind_Rite_Strife_Idea:"秘仪争锋"
 NAT_Nightwind_Rite_Strife_Idea_desc:"烟谜主发现同一支秘仪，焱庭抄去者为上卷，本族抄到者却为下卷。二祭司为一支秘仪归属争起。年少者曰上卷方为根本，年长者将手中那卷残破抄本往石桌一摊：「上卷在焱庭，然下卷在吾等手。少了下卷，他那上卷念不下去。」年少者不信，拿起下卷念一段，至关键处果卡住，上卷内并无续接之话。二人一时无言。老祭司将下卷仔细卷好，以灰布裹三层，塞入石缝藏起，对年轻祭司曰：「上卷他们拿去念，下卷吾等拿来做。谁离了谁，皆成不了事。」年轻祭司点头，亦将己那份卷好，压石底下。石缝口俄而为其风吹来之灰盖住。"
