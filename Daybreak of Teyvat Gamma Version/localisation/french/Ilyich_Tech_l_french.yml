 #############
 # Hilichurl
 #############
 Ilyich_Hilichurl:"Hilichurl"
 Ilyich_Hilichurl_equipment:"Hilichurl"
 Ilyich_Hilichurl:"Habitants primitifs errant dans les contrées sauvages de Teyvat. D'apparence humaine, ils sont dépourvus d'intelligence et d'âme. Les archives rapportent qu'ils parcourent ces terres depuis plus d'un millénaire sans laisser derrière eux aucune histoire ni civilisation. Depuis la sombre catastrophe survenue il y a cinq cents ans, ils se sont répandus sur l'ensemble du continent. Bien que faibles et désorganisés, ils peuvent parfois causer bien des ennuis aux voyageurs."
 Ilyich_Hilichurl_Support:"Compagnie de soutien Hilichurl"
 Ilyich_Hilichurl_Support_equipment:"Compagnie de soutien Hilichurl"
 Ilyich_Hilichurl_Support:"Habitants primitifs errant dans les contrées sauvages de Teyvat. D'apparence humaine, ils sont dépourvus d'intelligence et d'âme. Les archives rapportent qu'ils parcourent ces terres depuis plus d'un millénaire sans laisser derrière eux aucune histoire ni civilisation. Depuis la sombre catastrophe survenue il y a cinq cents ans, ils se sont répandus sur l'ensemble du continent. Bien que faibles et désorganisés, ils peuvent parfois causer bien des ennuis aux voyageurs."
