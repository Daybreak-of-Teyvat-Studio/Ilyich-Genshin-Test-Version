 SOV_planned_economy_dynamic_modifier:0 "Planned Economy"
 SOV_politicized_military:0 "Politicized Military"
 SOV_politicized_military_battle_priests:0 "Battle Priests in the Army"
 SOV_politicized_military_battle_priests_desc:0 "Taking on the role of Battle Priests within our military units, the clergy is now in charge of keeping morale high among the ranks, and making sure that the troops know that the Church, and God, are on our side."
 SOV_politicized_military_desc:0 "Military commissars often hold fervent ideological speeches and political discussions among the ranks, but in many cases they also engage in excessive administration, overzealous scrutiny of military officers, and even obstruction of the orders of unit commanders."
 SOV_politicized_military_swap:0 "Military Political Advisors"
 SOV_politicized_military_swap_desc:0 "While we shouldn't let political considerations dictate military decisions, we still have to ensure that these political considerations are accounted for when the decision is reached."
 SOV_popular_speeches_poum:0 "Popular Speeches"
 SOV_popular_speeches_poum_desc:0 "With the help of local organizations and influential members of the anti-Stalinist opposition abroad, we are conducting a large information and agitation campaign in our controlled territories to rekindle the flame of revolution among the masses."
 SOV_preparations_for_soviet_japanese_war:0 "Preparations for Soviet-Japanese War"
 SOV_preparations_for_soviet_japanese_war_desc:0 "$SOV_prepare_a_war_with_japan_desc$"
 SOV_puppet_international_of_soviet_republics_idea:0 "International Soviet Republics"
 SOV_puppet_international_of_soviet_republics_idea_desc:0 "Being part of a greater whole is of huge benefit to our country."
 SOV_purged_junior_army_officers_1:0 "Junior Army Officers Purged"
 SOV_purged_junior_army_officers_1_desc:0 "A significant number of junior Army officers have been arrested by the NKVD on charges of sedition, sabotage, and anti-soviet thinking. The loss of so many experienced officers and veterans from past wars has left the Red Army in dangerous disarray."
 SOV_purged_junior_army_officers_1_tt:0 "§YAll ground vehicles§!: Reliability bonus: §R-10%§!"
 SOV_purged_junior_army_officers_2_tt:0 "§YAll ground vehicles§!: Reliability bonus: §R-20%§!"
 SOV_purged_junior_army_officers_3_tt:0 "§YAll ground vehicles§!: Reliability bonus: §R-30%§!\n§Y$politically_connected$§! will be the only trait available for new Generals."
 SOV_purged_junior_navy_officers_1:0 "Junior Navy Officers Purged"
 SOV_purged_junior_navy_officers_1_desc:0 "A significant number of junior Navy officers have been arrested by the NKVD on charges of sedition, sabotage, and anti-soviet thinking. The loss of so many experienced officers and veterans from past wars has left the Red Fleet in dangerous disarray."
 SOV_purged_junior_navy_officers_3_tt:0 "§Y$politically_connected$§! will be the only trait available for new Admirals."
 SOV_rehabilitated_military_ns:0 "$SOV_rehabilitated_military$"
 SOV_rehabilitated_military_ns_desc:0 "It is time to rein in the political officers a bit and give the commanders more latitude on how to run things."
 SOV_restoration_and_development_idea:0 "Restoration and Development"
 SOV_restoration_and_development_idea_desc:0 "$SOV_restoration_and_development_desc$"
 SOV_revolutionary_spirit_idea:0 "The Revolutionary Spirit"
 SOV_revolutionary_spirit_idea_desc:0 "The revolutionary zeal has been reignited by the victory over Stalin. It is time to carry the revolutionary flame to the workers around the world."
 SOV_romanov_spirit_idea:0 "Romanov Spirit"
 SOV_rubin_design_bureau:0 "Rubin Design Bureau"
