 NAT_Dec_Joint_Council_Idea:"六部会盟"
 NAT_Dec_Joint_Council_Idea_desc:"焱庭火桌旁，六族使者分坐两侧，皆不肯先言。桌上火盆烧得噼啪作响。流泉使者先忍不住，将贝螺往桌上一搁，首言曰：「先议峡口之税。」沃陆农酋立即顶回：「田中之粮谁收？」一言来，一语去，声气愈吵愈急，火盆之炭为袖风掀起一角。主事者但居中添柴，俟众嗓皆哑，方徐徐启口：「七件事，各让半步，今日便散。」农酋冷笑一声，解腰间开山斧，横置膝上；锻主以铁锤顿地，亦不复嚷。使者收起贝螺，相继起身。火盆之炭犹赤，映着六张不服之脸，桌上再无人拍案。"
 NAT_Dec_Hold_Tribal_Joint_Council_tt:"部族联合会议决议\n持续 180 天。\n[political_power_gain_tt]\n[stability_factor_tt]\n[war_support_factor_tt]\n[industrial_capacity_factory_tt]\n[research_speed_factor_tt]"
 NAT_Dec_Border_Mediation_Idea:"边境调停"
 NAT_Dec_Border_Mediation_Idea_desc:"两族争一坡地，三载不决，锄头皆锄过界沟去了。这日调解官扛来一捆界碑，当两族之面往沟中栽。沃陆之人欲东挪三尺，回声之人偏要西挪三尺，吵得面红耳赤。官以界碑杵于正中，道：「谁复动一寸，便是动刀。」两边遂住手。碑既立稳，官取二旗，左插沃陆谷穗旗，右插回声铁锤旗。两旗隔碑迎风而抖，各不相下。有老者蹲于碑根，伸手摸碑上刻字，末乃拾一碎石，将碑脚之土复夯一层。"
 NAT_Dec_Mediate_Tribal_Border_Conflict_tt:"边境调解之约\n持续 180 天。\n[army_defence_factor_tt]\n[stability_factor_tt]\n[war_support_factor_tt]\n[supply_node_range_tt]\n[no_supply_grace_tt]"
 NAT_Dec_Ancient_Name_Idea:"古名授令"
 NAT_Dec_Ancient_Name_Idea_desc:"悬木人祭坛前，一老战士将世代相传的古名交出。跪于古树之下，双手捧那刻名黑曜石，久不肯释。祭司伸手来接，他忽抬头：「此名随我四十年，果真收不回？」祭司按其手背，徐徐道：「名一授出，便非你一人之物，虽欲收之，不可得也。」老战士阖了阖眼，遂释手。祭司将古名戴上一名年轻族人颈上，那后生垂手不敢抬头。老战士扶树而起，末视那石一眼，转身入林。古树藤条垂下，正扫过祭坛边沿，那后生颈间黑曜石为风所撞，轻磕于锁骨之上。"
 NAT_Dec_Award_Hero_Ancient_Name_tt:"古名授予令\n持续 365 天。\n[army_attack_factor_tt]\n[war_support_factor_tt]\n[command_power_gain_tt]\n[army_org_factor_tt]\n[recruitable_population_factor_tt]"
 NAT_Dec_Suppress_Rebellion_Idea:"平叛告捷"
 NAT_Dec_Suppress_Rebellion_Idea_desc:"乱兵既散，焱庭戍卒仍一队队守于巷口，甲叶相击，叮当作响。街上静得反常，铺子半掩其门，并吆喝声亦不闻。一妇人探头张望，为戍卒横目一瞥，亟缩回，插上门闩。有卖汤老汉挑担过街，脚步放得极轻，锅中热气腾腾，竟无人敢来买。他歇下担子，压低嗓音问旁人：「此谓平耶，抑未平耶？」其人但摇头，以手指巷口之刀。老汉叹了口气，复挑起担子。他一去，整街惟余戍卒换岗之声，一步一步，踏在青石板上，回声空空荡荡。"
 NAT_Dec_Suppress_Tribal_Separatist_Rebellion_tt:"离叛既平余波\n持续 180 天。\n[stability_factor_tt]\n[army_org_factor_tt]\n[attrition_tt]\n[war_support_factor_tt]\n[army_defence_factor_tt]"
 NAT_Dec_Redress_Idea:"下诏昭雪"
 NAT_Dec_Redress_Idea_desc:"焱庭案房中，主簿启积年旧册，将一桩桩冤案重批朱红。有白发老人立于案前，抖指那一行名字：「此一条，压我半生矣。」主簿提笔蘸墨，于那名字上重重一圈，道：「划了，便不算数。」老人手犹抖，忽问：「奈我兄弟，等不到今日何？」主簿笔顿于纸，墨洇开一团。默然半晌，合上册子，对老人道：「名还他清白，人却唤不回矣。」老人不复言，弯腰将主簿方才划过那页纸角，一点一点抚平。案上朱砂碟里，笔尖犹滴一点红，落于桌面，如一滴已干之血。"
 NAT_Dec_Redress_Historical_Injustice_tt:"平反诏书\n持续 365 天。\n[stability_factor_tt]\n[stability_weekly_factor_tt]\n[monthly_population_tt]\n[war_support_factor_tt]"
 NAT_Dec_Taxation_Idea:"赋役定制"
 NAT_Dec_Taxation_Idea_desc:"焱庭算房中，各州各族账册摞及半人高。曩者各族自算，一斗粮报三样数。今税官摊开新册，当各族之面一笔笔登。沃陆账房犹欲报虚数，被税官取旧册一翻，当场对上，涨红了脸。税官不苛责，但推新册过去：「往后照此写，一笔是一笔。」遂令人抬来新铸之秤，将收上钱粮过秤入册，数目始得对上人。算至日头偏西，末笔落定，税官搁笔，吹了吹未干之墨。满桌旧册被摞一旁，新册孤零摊于正中，秤砣犹压册角之上。"
 NAT_Dec_Standardize_Tribal_Taxation_System_tt:"统一税制\n持续 365 天。\n[industrial_capacity_factory_tt]\n[consumer_goods_factor_tt]\n[political_power_gain_tt]\n[stability_factor_tt]\n[line_change_production_efficiency_factor_tt]"
 NAT_Dec_Woo_Elders_Idea:"耆老议盟"
 NAT_Dec_Woo_Elders_Idea_desc:"沃陆晒谷场上，数长老本不肯来，抱手立于谷仓之侧。主事者搬来矮桌一张，摆上颗粒果与新酿，亦不相劝，但自坐剥果壳。剥了半晌，一老酋始踱至，丢下一句：「汝焱庭之官说话，我等听不懂。」主事者将果壳推过一边，道：「今日不说官话，只说谷子。」老酋乃坐。三人一言来，一语去，自墒情说到窖藏，日头偏西方起身。其后族中果服：长老在谷场一开口，比焱庭告示管用十倍。有一回新来少年吏不肯信，话犹未了，长老将手中一把颗粒果往桌上一撒，少年遂住口，低头看那满桌滚圆之果。"
 NAT_Dec_Woo_Tribal_Elder_Council_tt:"长老议盟\n持续 180 天。\n[political_power_gain_tt]\n[stability_factor_tt]\n[war_support_factor_tt]\n[command_power_gain_tt]"
 NAT_Dec_Clean_Cults_Idea:"清除余邪"
 NAT_Dec_Clean_Cults_Idea_desc:"烟谜主山谷中，祭司举火把，将一处邪教巢穴的符幡扯下，掷入火堆。火焰窜起，映得满谷通明。祭司念净秽之咒，以烟灰于洞口画三道符。奈火才熄，随行之兵即慌忙来报：「祭司，灰中又有物在动！」祭司近前一视，方才画符之灰面，竟鼓起一串细密水泡，破处渗出黑水。色一沉，伸手探之，指尖立被蚀出一白斑。随行巫者低声道：「焚其一处，便往灰中钻得更深。」祭司咬牙，将整碗燃素倾入洞里。洞中轰然一响，火光冲天，洞口岩石烧得通红，那股焦臭，隔半里犹呛得人睁不开眼。"
 NAT_Dec_Clean_Up_Internal_Abyss_Cults_tt:"清除邪教余波\n持续 180 天。\n[stability_factor_tt]\n[research_speed_factor_tt]\n[war_support_factor_tt]\n[political_power_gain_tt]"
 NAT_Dec_Duel_Festival_Idea:"演武遗风"
 NAT_Dec_Duel_Festival_Idea_desc:"圣火竞技场沙地犹未扫净，昨日决斗脚印层层叠叠。演武号角一鸣，二勇士袒臂登场，一使开山斧，一挺长枪，绕场心行三匝。看台上众皆起立，花羽会族人吹起口哨。斗至紧要处，使斧者一旋身，斧刃贴对手脖颈削过，枪尖却先一步点入沙中。裁判举木牌，锣声当当两响。满场静了一息，继而轰然叫好。使斧者收势，以斧顿沙，朝看台抱了抱拳。沙地留两道深痕，自场心一直划至边线，看台喝彩之声，震得檐角旗穗直抖。"
 NAT_Dec_Hold_National_Duel_Martial_Arts_tt:"决斗演武余韵\n持续 270 天。\n[army_org_factor_tt]\n[army_attack_factor_tt]\n[war_support_factor_tt]\n[command_power_gain_tt]\n[army_speed_factor_tt]"
 NAT_Dec_Militia_Restruct_Idea:"整训乡勇"
 NAT_Dec_Militia_Restruct_Idea_desc:"教场上，焱庭掌粮械者将散兵逐一唱名，编入队伍。曩者此辈各归其首领，令出多门，临阵互不相听。掌械者按新册分伍，发统一号衣，又将各伍之旗一一插定。有一老兵不服，嘟囔：「吾从的是自家酋长，凭甚么听汝之旗？」伍长闻之，亦不争辩，但将一面新旗塞入其手：「拿着，往后随之而行。」老兵掂了掂那旗，不复言语。号令一下，鼓声咚咚，各伍依旗色进退，头一回走得齐齐整整。掌械者立于高台，将花名册翻过一页，以朱笔于队末勾了一道。鼓声既歇，场上惟余一片脚步，踏得沙土扬起半人高。"
 NAT_Dec_Restruct_Tribal_Militia_tt:"民兵整编令\n持续 365 天。\n[army_org_factor_tt]\n[army_org_regain_tt]\n[recruitable_population_factor_tt]\n[weekly_manpower_tt]\n[attrition_tt]\n[command_power_gain_tt]"
 NAT_Dec_Defense_Passes_Idea:"扼隘设防"
 NAT_Dec_Defense_Passes_Idea_desc:"峡口隘道窄仅容一人，回声匠人领众于此砌墙。石块层层垒起，燃素灰调浆，将缝隙填得严丝合缝。有后生嫌墙矮，匠人以铁锤往墙顶一磕：「急甚么？高过汝头顶，敌便得仰脖挨箭。」墙砌及半，探子来报，言山那头大队人马方开过来。匠人不慌，令人将墙上箭垛补完，又搬数筐滚石堆于墙头。末一块石料嵌入，以锤背敲了敲，听那声响实了，方跳下墙。远处尘烟滚滚，墙后之人已张好弓。他抹了把脸上之灰，抄起靠墙根的长枪，往那道新墙后一站。"
 NAT_Dec_Build_Border_Defense_Passes_tt:"边境隘口工事\n持续 365 天。\n[army_defence_factor_tt]\n[supply_node_range_tt]\n[no_supply_grace_tt]\n[supply_combat_penalties_on_core_factor_tt]\n[out_of_supply_factor_tt]\n[attrition_tt]"
 NAT_Dec_Scout_Units_Idea:"精训探马"
 NAT_Dec_Scout_Units_Idea_desc:"焱庭斥候队自山而出，衣衫褴褛，足裹兽皮。领兵者皱眉：「路且不识，如何打仗？」为首斥候蹲身，以耳贴地听之，又捻起一撮土闻了闻，起道：「此林今早有鹿过，往东；再深入，鸟不复鸣，有人埋伏。」领兵者将信将疑，令大军依言而行。果然绕过那片静林，一路无阻，行军比往日快了三成。傍晚扎营，那斥候独蹲火堆之侧，以小刀削一截木棍，将白日所见兽蹄印一一刻上。火光映其满脸之灰，刻完末笔，把木棍插进营边土里，转身巡夜去矣。"
 NAT_Dec_Train_Tribal_Scout_Units_tt:"斥候操练之效\n持续 270 天。\n[army_speed_factor_tt]\n[army_org_factor_tt]\n[attrition_tt]\n[army_defence_factor_tt]\n[recon_factor_tt]"
 NAT_Dec_Crack_Smuggling_Idea:"严缉私贩"
 NAT_Dec_Crack_Smuggling_Idea_desc:"焱庭之兵于山道截获两处私运甲械之洞，以巨石堵死洞口。查抄刀枪堆了一地，锈者锈、钝者钝。掌械者率众清点，将这些器械逐件登记入库，摆得整整齐齐。有被拿住的走私贩子蹲于墙角，面色灰败，忽开口曰：「汝等断了这条路，城中那几家铺子便要跳脚矣。」掌械者抬眼一瞥，不接其话，但令按了手印。当夜，城中果有人上门，塞银子欲探口风，被守门之兵连人带银挡了回去。掌械者将新入甲械锁入库中，回身攥钥匙于掌心，库门上新换铁锁，在灯下泛着冷冷之光。"
 NAT_Dec_Crack_Down_Crossborder_Arms_Smuggling_tt:"缉私行动余波\n持续 180 天。\n[production_speed_arms_factory_factor_tt]\n[line_change_production_efficiency_factor_tt]\n[industrial_capacity_factory_tt]\n[stability_factor_tt]"
 NAT_Dec_Universal_Training_Idea:"全民习武"
 NAT_Dec_Universal_Training_Idea_desc:"村口空地上，焱庭教头将适龄青年逐一唱出，发下木枪，列成三排。一后生犹未睡醒，在队中直打哈欠，被教头一枪杆敲在肩上：「挺直了！」后生一激灵，亟端正。日日天未亮即集，扎马步、刺木枪、绕村跑，喊声震得鸡飞狗跳。村人初有怨言，谓耽误农时；然日久，街上扛枪行走之青年渐多，腰板皆挺得笔直。校阅之日，教头将木枪换作真兵刃，一排排放出去，动作竟整齐划一。那爱打哈欠的后生立于头排，端枪凝目前方，眼皮都不曾一眨。"
 NAT_Dec_Implement_Universal_Military_Training_tt:"全民训练成效\n持续 365 天。\n[army_org_factor_tt]\n[recruitable_population_factor_tt]\n[weekly_manpower_tt]\n[war_support_factor_tt]\n[army_attack_factor_tt]\n[attrition_tt]"
 NAT_Dec_Pacify_Warlords_Idea:"削平诸镇"
 NAT_Dec_Pacify_Warlords_Idea_desc:"分据之州城头，各家旗子插得密密麻麻。焱庭使者赍诏入城，令各路诸侯撤旗归令。数拥兵之将拍案不肯撤，使者不恼，但将诏令念了三遍，末乃言曰：「旗撤了，兵仍是汝等的，粮亦是汝等的。」众皆面面相觑。当夜，城头之旗一面面降下，卷好，摞于府库。次日，焱庭号令一路贴至最远之州，沿途再无人敢设卡。一老卒奉命摘末一面旗，爬至旗杆顶，解其绳，那旗软软垂下，落了他一头一脸。他将旗叠好，抱在怀中，自旗杆上徐徐滑下。"
 NAT_Dec_Pacify_Warlord_Separatist_Forces_tt:"拥兵诸酋既平之后\n持续 365 天。\n[stability_factor_tt]\n[stability_weekly_factor_tt]\n[political_power_gain_tt]\n[army_defence_factor_tt]\n[attrition_tt]"
 NAT_Dec_Upgrade_Equipment_Idea:"精工甲械"
 NAT_Dec_Upgrade_Equipment_Idea_desc:"回声之子锻炉昼夜不熄，匠人卸下旧模，换上新铸之范。有老匠不放心，取新范端详半日，以指节敲了敲，听那声响，皱眉道：「薄矣，做出来的兵刃不经磕。」年轻匠人不服，当面将一块烧红铁水浇入新范，待冷凝，拎锤便往那成型刀身上砸。三锤下去，刀身只留三个浅坑，纹丝不弯。老匠乃接过刀，翻来覆去阅两遍，以拇指刮过刃口，终点了点头。炉火映着二人之脸。旁一排新铸兵刃码于架上，刀背泛青光，比去年那一批，沉手得多。"
 NAT_Dec_Upgrade_Military_Equipment_Lines_tt:"军工产线升级\n持续 365 天。\n[production_speed_arms_factory_factor_tt]\n[line_change_production_efficiency_factor_tt]\n[industrial_capacity_factory_tt]\n[consumer_goods_factor_tt]"
 NAT_Dec_Develop_Minerals_Idea:"凿山冶矿"
 NAT_Dec_Develop_Minerals_Idea_desc:"沃陆火山坡上，各族合力开矿。悬木人架起运矿栈道，木板顺山势一路铺下；烟谜主祭司以灵谜涂鸦探脉，于岩壁画些旁人不懂的符号；回声匠人支起熔炉，将挖出矿石就地冶炼。有沃陆农夫头回入矿洞，为深邃坑道吓得后退，被队长一把揪住：「怕甚么，跟着灯走。」他攥矿灯，随前队往里挪，脚步战战兢兢。矿车顺栈道滑下山，装满了铁锭。及傍晚，首炉铁水出炉，金红铁水顺沟槽流入模里。那农夫立于炉边，被热浪烤得眯起眼，脸上却笑开了花。"
 NAT_Dec_Develop_Tribal_Traditional_Minerals_tt:"传统矿产开发\n持续 365 天。\n[local_resources_factor_tt]\n[industrial_capacity_factory_tt]\n[production_speed_industrial_complex_factor_tt]\n[production_speed_industrial_infrastructure_factor_tt]"
 NAT_Dec_Trade_Routes_Idea:"商路大通"
 NAT_Dec_Trade_Routes_Idea_desc:"为各族边境卡了多年的商路，这日始通。焱庭之人带工匠，将路中关卡一座座拆去，界沟上搭起木桥。首队商旅试探赶驮兽过桥，桥板吱呀作响，骡子不肯前，赶脚的扬鞭一抽，队伍方徐徐挪过。守关之兵收起长枪，目送其远去。一商人回头望了望拆剩的半截关卡，对同伴道：「往日过一趟，要扒三层皮。」同伴笑而不答，但催他快走，好趁天黑前进城。桥头上，后继商旅排成长龙，铃铛叮叮当当，一直排到暮色四合。桥下溪水照旧流着，水面映着那一长串晃动灯火。"
 NAT_Dec_Build_Inter_Tribal_Trade_Routes_tt:"商道贯通\n持续 365 天。\n[industrial_capacity_factory_tt]\n[consumer_goods_factor_tt]\n[supply_node_range_tt]\n[political_power_gain_tt]\n[production_speed_rail_way_factor_tt]"
 NAT_Dec_Crafts_Coop_Idea:"百工合营"
 NAT_Dec_Crafts_Coop_Idea_desc:"回声工坊中，各族工匠头回同坐一桌。曩者各做各的，料不同、价不同，一器物换一寨便涨一倍。今立合作社，众共推一老匠为首，统一料源与花样，亦定下价钱。有年轻匠人抱其攒了半载的图样不肯释手，谓手艺乃吃饭本钱。老匠引至炉边，指一炉正旺之铁：「汝一人能打几把？合起来，方供得阵前之刀。」年轻匠人怔了怔，终将图样摊于桌上。众围拢来，一张张图样铺满桌面。老匠提笔于价目册落下头一笔，炉里之铁恰烧透，映得满屋红亮。"
 NAT_Dec_Establish_Tribal_Crafts_Cooperatives_tt:"手工业合作社\n持续 365 天。\n[industrial_capacity_factory_tt]\n[consumer_goods_factor_tt]\n[line_change_production_efficiency_factor_tt]\n[political_power_gain_tt]"
 NAT_Dec_Land_Reform_Idea:"均田定制"
 NAT_Dec_Land_Reform_Idea_desc:"沃陆田垄间，丈量者拉绳尺一丘丘量过，重写地契。曩者地皆攥于少数人手，今按口分到户。一老地主见自家地划出一大半，心疼得直搓手，当众嚷曰：「这是换名目夺我之田！」分到地的佃户低着头，皆不敢接话。族中长老将新契一张张发下，念一户之名，应一声，按一手印。那老地主亦被唤去按印，瞋目而视，末了仍将拇指按入印泥。契发毕，日头已落山。新分之田里，有人当场弯腰抓起一把土，攥于掌心捏了捏，又徐徐松开，土从指缝间簌簌落下。"
 NAT_Dec_Reform_Tribal_Land_Allocation_tt:"田土之制改革\n持续 365 天。\n[monthly_population_tt]\n[stability_factor_tt]\n[war_support_factor_tt]\n[industrial_capacity_factory_tt]\n[consumer_goods_factor_tt]"
 NAT_Dec_Foreign_Investment_Idea:"招商兴业"
 NAT_Dec_Foreign_Investment_Idea_desc:"焱庭港口来外邦商船，卸下银钱与从未见之机器。未几月，岸边立起一排新工棚，烟囱冒黑烟。招工告示贴出，乡下人成群结队来看热闹。一老农盯那嗡嗡转的机器，终不肯伸手去碰，问带头工匠：「这铁疙瘩，吃的是水还是火？」工匠笑而不答，但将一匹布塞进机器，另一头便源源吐出布来。老农看得目瞪口呆。工棚立得快，麻烦亦来得快：工钱如何算，料从何处来，各邦工匠吵作一团。管事将账本摊于桌上，一边是堆得高高的订单，一边是扯不清的纠纷，笔悬半空，久之不落。"
 NAT_Dec_Attract_Foreign_Industrial_Investment_tt:"外来工业投资\n持续 365 天。\n[industrial_capacity_factory_tt]\n[research_speed_factor_tt]\n[production_speed_industrial_complex_factor_tt]\n[line_change_production_efficiency_factor_tt]"
 NAT_Dec_Commodity_Markets_Idea:"市易同轨"
 NAT_Dec_Commodity_Markets_Idea_desc:"焱庭集市上，向例一杆秤一个样，一斗米各家量法不同。这日官儿带新铸之官斗官秤，当众商贩之面校准。有卖粮者犹欲弄花样，袖中藏小砝码，被官儿一眼瞧见，当场收缴，罚其三日之摊。众再看那新斗，口沿齐整，容量划一，往米堆里一舀，不多不少。一老妇卖了半筐果，以新秤称过，数了数钱，反复数了两遍，脸上渐有笑意。日头偏西，集市渐散。官儿将那副没收的旧秤挂于柱上，秤杆歪扭，秤砣缺角，风一吹，在半空里晃晃悠悠打转。"
 NAT_Dec_Standardize_Tribal_Commodity_Markets_tt:"统一市易\n持续 365 天。\n[consumer_goods_factor_tt]\n[industrial_capacity_factory_tt]\n[political_power_gain_tt]\n[stability_factor_tt]"
 NAT_Dec_Irrigation_Idea:"沟洫贯通"
 NAT_Dec_Irrigation_Idea_desc:"沃陆高地上，泉眼常年淌水，却白白流入沟壑；低处之田每至旱季便裂开大口。焱庭之人领各族挖渠，一截一截将水往田里引。一老农扛锄跟在渠尾，看水头一寸寸往前爬，急得直跺脚：「慢些，慢些，休冲垮了苗！」年轻人笑他小题大做，老农不争，但蹲身用手将被水冲歪的禾苗一株株扶正。水终流入龟裂之田，干裂土块吸饱了水，颜色一点点变深。旱季再来时，别处之田皆黄，唯此一片，绿油油的。老农蹲于田埂，伸手撩一捧水，看它自指缝间漏下，脸上笑出了褶子。"
 NAT_Dec_Construct_Irrigation_Projects_tt:"水利灌溉工程\n持续 365 天。\n[monthly_population_tt]\n[industrial_capacity_factory_tt]\n[production_speed_industrial_infrastructure_factor_tt]\n[attrition_tt]\n[consumer_goods_factor_tt]"
 NAT_Dec_Unified_Currency_Idea:"铸币同制"
 NAT_Dec_Unified_Currency_Idea_desc:"焱庭钱局中，各族旧钱堆成小山，成色不同、分量各异，持别族之钱竟花不出去。局官奉命统一铸币，定下比价，将旧钱按折算收回。一商人抱一坛旧币来换，一听比价，当场叫屈：「吾这足色金子，凭甚么当碎铜算？」局官不动气，取戥子当面称了，又将成色一一验过，道：「成色果足，然规矩须按新章。汝换与新钱，走至何州皆认。」商人将信将疑换了，转身去市上买一袋盐，果真一路畅通。钱局门外，换钱者排成长队。新铸之钱哗啦啦流入匣里，热气犹未散尽，一枚枚摞得整整齐齐。"
 NAT_Dec_Issue_Unified_Tribal_Currency_tt:"统一流通货币\n持续 365 天。\n[consumer_goods_factor_tt]\n[industrial_capacity_factory_tt]\n[political_power_gain_tt]\n[stability_factor_tt]\n[line_change_production_efficiency_factor_tt]"
 NAT_Dec_Heroic_Epics_Idea:"英雄谱录"
 NAT_Dec_Heroic_Epics_Idea_desc:"焱庭史馆中，各族英雄写进同一册。执笔老史官将六族旧谱摊开，一笔一笔誊。写至中途，停笔，对一名发了半日呆，那是他少年时仰慕的勇士。旁助手小声问：「先生，这个还写不写？」老史官默然良久，道：「写。该写的，一个都不能漏；不该写的，一个也不添。」遂蘸墨落笔，将那名字工工整整写在册上，又于旁记下其出身与功业。助手凑近看，见那一行写得格外用力，墨皆透过纸背。册既合上，封皮落了灰。案头那方砚台里，残墨凝住，映着窗口透进来的一线天光。"
 NAT_Dec_Compile_Tribal_Heroic_Epics_tt:"英雄史诗集\n持续 365 天。\n[war_support_factor_tt]\n[stability_factor_tt]\n[recruitable_population_factor_tt]\n[army_org_factor_tt]\n[political_power_gain_tt]"
 NAT_Dec_Cultural_Festival_Idea:"文化会盟"
 NAT_Dec_Cultural_Festival_Idea_desc:"图兰圣城广场上，六族之人聚于一处，各摆歌舞与吃食。沃陆摆出颗粒果，回声当场锻起小刀，流泉架起水轮，花羽放出青羽龙绕场低飞，悬木人攀上高杆，烟谜主面具在火光里忽明忽暗。一花羽少年头回见沃陆丰收舞，看得目不转睛，不禁跟着扭起来，被同族笑话手脚笨。少年不恼，笑嘻嘻地学。夜里篝火烧得老高，各族之人围着同一堆火，歌声一茬接一茬。有老人本说看不惯别族之舞，这会儿却拍腿打起拍子。火星噼啪溅起，映着一张张陌生之脸，歌声直唱到东方发白。"
 NAT_Dec_Hold_Nata_Cultural_Exchange_Festival_tt:"文化交流节\n持续 270 天。\n[stability_factor_tt]\n[war_support_factor_tt]\n[political_power_gain_tt]\n[monthly_population_tt]\n[research_speed_factor_tt]"
 NAT_Dec_Border_Peace_Idea:"边境弭兵"
 NAT_Dec_Border_Peace_Idea_desc:"边界石桌旁，两邦使者对面坐下，为那条时断时续的硫晶界河争了整日。争至口干舌燥，老使者以指蘸茶水，于桌上画一道弯弯之线，道：「就照此河走，河改道，界亦改。」对方盯那水痕看了半晌，终乃点头。两边当场取来印信，于牛皮文书上按了手印，印泥乃火山朱砂所调，红泥印并排摁着。按毕，皆不肯先起身，隔桌相视片刻，方各自收印。老使者将文书卷起，塞入筒中，对随从道：「换来的不是地，是双方皆肯再等一等的耐性。」随从似懂非懂。出得门来，界河之水正哗哗而流，河面夕阳被波纹揉碎，一晃一晃。"
 NAT_Dec_Sign_Border_Peace_Agreement_With_Neighbors_tt:"边境和好之约\n持续 365 天。\n[stability_factor_tt]\n[war_support_factor_tt]\n[justify_war_goal_time_tt]\n[army_defence_factor_tt]"
 NAT_Dec_Language_Body_Idea:"正音立司"
 NAT_Dec_Language_Body_Idea_desc:"焱庭火桌旁摊着六卷皮纸，各族之字各占一卷。沃陆的谷记、回声的锤纹、流泉的水符、悬木的藤篆、花羽的羽书、烟谜的谜画，摆开彼此皆不识。老书记官蘸墨之手悬于半空，先写哪一行，六族使者便争起来。一者道：「谷记在最先。」一者嚷：「锤纹方该压头。」争至日头偏西，书记官将笔一搁，取来黑曜石一块，将六样字一并刻上，又于每字旁注了音。众围拢来看，各自认得自己那一半。书记官于石背落了三个字，把石一推，正压在六卷皮纸上。"
 NAT_Dec_Establish_Tribal_Language_Standardization_Body_tt:"正音之署\n持续 365 天。\n[political_power_gain_tt]\n[stability_factor_tt]\n[research_speed_factor_tt]\n[war_support_factor_tt]\n[monthly_population_tt]"
 NAT_Dec_Cultural_Missions_Idea:"遣使传文"
 NAT_Dec_Cultural_Missions_Idea_desc:"使团启程之日，绘纳塔火纹之鼓负于背上，六族舞步记在鞋底。领队乃一年轻书记，行一程便回顾，视鼓磕坏与否。及至邻邦，人家亦敲鼓与听，亦围火盆而跳自家的舞。书记看呆了，拿炭笔就地照画。主人问：「汝这鼓，敲的是哪一段？」书记拍拍背上之鼓，应曰：「火神的。」居半月，启程之日，邻邦回赠小鼓一面，又将一段舞步拆开相授。归途上，年轻人鞋底沾了两地之土，背上之鼓多了一道裂。他不令人补，道：「裂了方记得住。」入城时，先敲一串新调，随去之人已有数个跟着踩起陌生步子。"
 NAT_Dec_Dispatch_Cultural_Missions_To_Friendly_Nations_tt:"文化使团出访\n持续 270 天。\n[political_power_gain_tt]\n[stability_factor_tt]\n[research_speed_factor_tt]\n[war_support_factor_tt]"
 NAT_Dec_Duel_Ritual_Idea:"决斗入典"
 NAT_Dec_Duel_Ritual_Idea_desc:"曩者两人斗于田埂，围观者立成一圈，谁拳硬谁有理。今则不同。演武场之沙方筛过，画好了线。祭司于场边摆上火盆，先唱一遍祝词，方放二人入场。一人摘佩刀置案上，另一人解短斧，亦置其上。二人相对立定，一抱拳曰：「请。」另一还礼曰：「请。」司仪老者举杖一敲，二人方动手。三招既过，一人肩头中了一记，退至线外，自伸手抹去脸上之沙。看台上众不复喊，皆伸长脖子。末了胜者先过去扶败者，将刀斧自案上取回，各自系好腰带，并肩走出场门。"
 NAT_Dec_Establish_Nata_Traditional_Duel_As_National_Ritual_tt:"决斗国家化\n持续 365 天。\n[war_support_factor_tt]\n[army_org_factor_tt]\n[army_attack_factor_tt]\n[stability_factor_tt]\n[command_power_gain_tt]\n[army_speed_factor_tt]"
 MODIFIER_PRODUCTION_SPEED_RAIL_WAY_FACTOR:"铁路建造速度"
 production_speed_rail_way_factor_tt:" $MODIFIER_PRODUCTION_SPEED_RAIL_WAY_FACTOR$: $RIGHT|+=%1$"
 MODIFIER_RECON_FACTOR:"侦察效率"
