 SUM_Neo.199.t:"为新神命名"
 SUM_Neo.199.d:"贤者们为新神取名，名字里有赤王，也有教令院。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。教令院的门槛这几天被踩得很低，进去的人比出来的人多。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。"
