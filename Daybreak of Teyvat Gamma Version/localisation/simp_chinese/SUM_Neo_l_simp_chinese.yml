 SUM_Neo_SGS.1.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Pari_Wish:"花灵的许愿"
 SUM_SGS_PRO_Pari_Wish_desc:"花灵能替人圆一个愿，愿圆了就要付代价。来求的人不少，肯付代价的不多。"
 SUM_Neo_SGS.2.t:"花灵的许愿"
 SUM_Neo_SGS.2.d:"花灵能替人圆一个愿，愿圆了就要付代价。来求的人不少，肯付代价的不多。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SGS.2.a:"把账目封存"
 SUM_Neo_SGS.2.b:"把账目摊开"
 SUM_SGS_PRO_Pari_Zurvan:"祖尔宛"
 SUM_SGS_PRO_Pari_Zurvan_desc:"祖尔宛是最早的花灵，年纪比沙丘腰带这个名字还老。她说话很少，听人说话的时候却总是点头。"
 SUM_Neo_SGS.3.t:"祖尔宛"
 SUM_Neo_SGS.3.d:"祖尔宛是最早的花灵，年纪比沙丘腰带这个名字还老。她说话很少，听人说话的时候却总是点头。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGS.3.a:"按官署的判断行事"
 SUM_Neo_SGS.3.b:"按自己的判断行事"
 SUM_SGS_PRO_Pari_Sorush:"索鲁什的信"
 SUM_SGS_PRO_Pari_Sorush_desc:"索鲁什替花灵们传话，把沙上的事一件件带给祖尔宛。信里多是好消息，坏消息由她自己带回。"
 SUM_Neo_SGS.4.t:"索鲁什的信"
 SUM_Neo_SGS.4.d:"索鲁什替花灵们传话，把沙上的事一件件带给祖尔宛。信里多是好消息，坏消息由她自己带回。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
