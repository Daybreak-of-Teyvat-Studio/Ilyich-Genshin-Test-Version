################其他子意识形态
 
 conservatism:0 "保守主义"
 conservatism_desc:0 "保守主义：鉴于快速变革对社会所带来的潜在伤害，保守主义倾向于维护传统或是展开较为温和的改革，有些时候甚至提倡复古的价值观。"
 liberalism:0 "自由主义"
 liberalism_desc:0 "自由主义：在尊重个人自由的悠久哲学传统下，自由主义将捍卫这些权利视为国家的首要职能。"
 socialism:0 "社会主义"
 socialism_desc:0 "社会主义：民主社会主义力图依靠改革来建立一个平等的社会主义国家，其目标是废除或者削弱资本主义从民众手中摄取的权力。"
 marxism:0 "提瓦特主义"
 marxism_desc:0 "提瓦特主义：提瓦特主义涵盖从经济学到历史观的辽阔领域，其根本上力图将荧先生的理论付诸政治实践。主张阶级斗争以及过渡至生产资料公有制社会是这种意识形态的主要特征。"
 leninism:0 "刻晴主义"
 leninism_desc:0 "刻晴主义：刻晴主义是一种基于提瓦特主义的意识形态流派，其旨在以党领导革命颠覆资本主义社会的方式建立社会主义国家。而在取得政权后，这种意识形态下的政党会通过内部讨论决策的方式执政。"
 stalinism:0 "坎瑞亚主义"
 stalinism_desc:1 "坎瑞亚主义：作为对提瓦特主义在政治上的继承和发展，坎瑞亚主义重视快速工业化与集体化，并认为只有强而有力的社会主义政府才能彻底肃清反革命分子。"
 anti_revisionism:0 "反修正主义"
 anti_revisionism_desc:0 "反修正主义：反修正主义是一种为反击众多自诩马克思主义继承人的意识形态而产生的流派，提倡保持原始革命理论的核心要素。其主要反对将资本主义经济元素引入社会主义国家，这种意识形态很大程度上通过“什么不是什么”而非“什么是什么”来定义。"
 anarchist_communism:0 "无政府启明主义"
 anarchist_communism_desc:0 "无政府启明主义：无政府启明主义是一种将启明主义理想视为无国家社会的意识形态，其主张跳过具备过渡性质的社会主义国家，倾向于直接建立互帮互助的社会。"
 blanquism:0 "乌托邦社会主义"
 blanquism_desc:0 "乌托邦社会主义是一种冒进的社会主义，强调社会革命是实现从资本主义生产方式到社会主义生产方式转变的必要前提。其认为，在革命之初，人民不能够自我治理，在社会状态已经坏死的情况下，需要采取英勇的补救措施来过渡到健康状态，人民在未来的一段时间内需要革命性的力量，也就是由高度组织化的精英革命者来领导。在夺取政权后，精英革命者应当利用国家的力量来推行社会主义。"
 futurism:0 "未来主义"
 futurism_desc:0 "未来主义是一种憎恶陈旧思想的思潮，推崇速度和科技等元素，主张加快技术革命的速度。任务是重新改造现在的经济基础，用社会主义引导技术发展的方向。在文化上分为前进派和超越派两个集体，前进派主张“建立属于人民自己的宗教”“解放神学”而超越派主张“神无异于人”“斩断囚神的枷锁”。"
 futurism2:0 "未来主义"
 futurism2_desc:0 "未来主义是一种憎恶陈旧思想的思潮，推崇速度和科技等元素，主张加快技术革命的速度。任务是重新改造现在的经济基础，用社会主义引导技术发展的方向。在文化上分为前进派和超越派两个集体，前进派主张“建立属于人民自己的宗教”“解放神学”而超越派主张“神无异于人”“斩断囚神的枷锁”。"
 Hegemonism:0 "霸权主义"
 Hegemonism_desc:0 "霸权主义通常会凭借军事和经济实力，超越国际法、世界政治格局现状，一味扩张自身势力范围，操纵国际事务，干涉他国内政，甚至进行武装侵略和占领，实施称霸世界、主宰世界的强权政治、强权政策。"
 nazism:0 "国家社会主义"
 nazism_desc:0 "国家社会主义：国家社会主义植根于极端民族主义，并且受到了种族至上理念的推动。其积极推行侵略性扩张政策并主张建立极权国家，在此基础上，人民都将被团结在拥有绝对权力的领袖——元首的领导下。"
 fascism_ideology:0 "刑鼎主义"
 fascism_ideology_desc:0 "刑鼎主义：刑鼎主义涵盖了许多极端民族主义的要素，总的来说，其核心理念崇尚对国家的奉献，以及将人民团结在一位强大领袖的领导下。"
 falangism:0 "劳伦斯主义"
 falangism_desc:0 "劳伦斯主义：劳伦斯主义是一种兼具刑鼎主义和保守主义特征的威权主义意识形态，其非常重视民族和教派的身份认同。"
 rexism:0 "深渊主义"
 rexism_desc:0 "深渊主义：深渊主义是一种强烈反对自由主义及启明主义，同时提倡社团主义经济的坚定的保守民族主义意识形态。鉴于其越来越多地使用民粹主义和威权主义的言辞，他们的理念正与其他刑鼎运动相接近。"
 aranism:0 "兰那罗主义"
 aranism_desc:0 "兰那罗主义：兰那罗主义强调对种族地位的认同，反对人类对须弥乃至提瓦特的统治。"
 Deshretism:0 "赤王复兴主义"
 Deshretism_desc:0 "赤王复兴主义：赤王复兴主义是赤王死后，沙漠中的赤王子民里比较极端的民族主义和扩张主义，他们主张重振赤王时期的辉煌，反对须弥的草神以及教令院的统治秩序，并不断尝试推翻现有政权。"
 Dottorism:0 "多托雷主义"
 Dottorism_desc:0 "多托雷主义：多托雷主义受到教令院第七学派那伽朱那学派思想，深渊坎瑞亚主义，蜂巢思维等影响，主张发掘人的”另类价值“，主张建立极权以及高度飞升化的国家，极端反人性，他们的主张为教令院所排斥。"
 avant_gardism:0 "先锋主义"
 avant_gardism_desc:0 "枫丹廷，一个水神下场做法官、冷静睿智的最高审判官做辅助，甚至还有一个神级律法机器帮助处理判决的地方。按理来说应该绝对公正了，可芙宁娜和那维莱特都不得不承认，他们的裁决并不是绝对公平的。这里的法律不可靠，这里的罪不绝对。欧庇克莱歌剧院，表面上是象征着绝对公平的法院，但在实际上却是有票才能入场的三级会议，是贵族表演自身法权、维持公平正义幻象的歌剧院。\n\n先锋主义便诞生于枫丹司法与权力体系最尖锐的矛盾内部——即在“绝对公正”的表象下，系统性制造“罪人”以维持统治的残酷逻辑。它深刻地指出，旧枫丹的秩序建立在“法罪共生”的基础之上：欧庇克莱歌剧院的“纯洁”审判，必须依赖梅洛彼得堡作为容纳“污秽”的他者容器而存在；国家的团结，依赖于不断将一部分人排除并神圣化此排除过程。法律并非公正的天平，而是划分“谁不是枫丹人”、维持特权机器运转的排他性工具。\n\n因此，先锋主义者认为，只要这种“制造他者”的权力结构不被彻底粉碎与重组，任何表面的法律修订或福利让步都只是更新囚笼的装饰。其信奉者从梅洛彼得堡这一“法外之地”反而催生出相对公平经济模式的讽刺现实中获得启示：真正的正义，唯有通过高度组织化、纪律严明的“先锋队”，引领被旧体系用于运转政治机器的“燃料”，即梅洛彼得堡中的罪人们，进行果断而彻底的权力变革，才能终结这循环数百年的压迫仪式，建立一个真正平等的新共同体。。"
 aristocratic_conservatism:0 "贵族保守主义"
 aristocratic_conservatism_desc:0 "很少有社会政治思想流派能比贵族保守主义更微妙、更阴险。一个如此治理的国家名义上拥有宪法，并享有民主政体的所有结构制度。"
 resurrectionism:0 "复生主义"
 resurrectionism_desc:0 "复生主义，由恐惧、对雷穆利亚的怀念等等扭曲的观念捏合在一起的百足之虫，其唯一目标就是尽快让神王雷穆斯重返枫丹。为此，拥护者认定应调动一切资源净化这个国家，希望雷穆斯在枫丹人民证明自己配得上他之后归来。他们还支持有组织地消灭美露辛之类的枫丹少数种族，驱使贫苦的普罗大众，建造宏伟的帝国纪念碑。遍布各地的耳目与严苛残酷的刑罚参照了治下的纯净王国。\n然而，这场运动无人知晓能否继续维持。时间一分一秒地流逝，救世主仍未归来，枫丹贵族愈发绝望。不少观察家担忧，雷穆斯早已无法回到高海之上。"
 revolutionary_terrorism:0 "革命恐怖主义"
 revolutionary_terrorism_desc:0 "革命恐怖主义者在政治组织上致力于动员枫丹中下层平民，通过其自治组织直接掌握政权；在道德伦理上积极宣传反对传统；在实践手段上推崇激烈的斗争，主张采取恐怖专政打击枫丹的贵族、自由派以及境外势力，推行非制度化的治理模式。\n尽管在梅堡中的占比不多，且该派别领导者宣誓支持革命。但其投身革命的动机，以及投机主义本质，可能会将革命带入一条完全相反的道路。"
 managed_democracy:0 "管理式民主"
 managed_democracy_desc:0 "壁炉之家，我们的港湾！繁荣，自由，民主，我们的生存正道！\n再没有哪种制度比民主更伟大了。一次次选举经由计票箱展现公民对政府的问责权，帮助我们在思想大卖场里剔除掉那些略逊一筹的歪念头。但民主也是有很大问题的...\n“不！我甜美的选票！不！”\n呵呵，觉得眼熟？有时公民不知道他们想要什么，或者说，什么是对他们最好的。实际上人们很可能会被荒诞不经的承诺或是诋毁性质的口号所迷惑，把票投给那些不合格的政客。这样的场景，此时此刻正在全枫丹上演。下一个可能就是你！\n除非你能做出生命中最重要的决定。向所有人证明，你拥有追求自由的力量与勇气。加入...管理式民主！管理式民主弥补了以上缺陷，强大的国家宣传机器告诉人们什么是对他们最好的，把那些激进而危险的思想被拦在系统之外，同时确保本国所有派别一致支持国家的长期发展战路。自由而公平的选举仍会举行，但其结果绝不会与本国的首要目标相冲突，无论这个目标是什么。\n管理式民主自然也有一些反对声音，他们声称选举只是个骗局，这种体制代表的则是披着民主外衣的威权政治。说出这种话的人无疑是在试图破坏我们的国家！"
 fraternalism:0 "博爱主义"
 fraternalism_desc:0 "博爱主义并非源自某个国家或组织，它是人们对旧秩序中“神性威严”与“贵族特权”的一种精神反拨，其根源深植于对个体价值与尘世幸福的坚定信念。它源于一种愿景：社会的进步应通过文化的浸润、道德的唤醒与制度的温和改良来实现。博爱主义者深信，建成更公正、更繁荣国家的关键，在于提升整个社会的精神境界与共情能力，使人民能在共同的未来图景下达成和解与合作。\n因此，博爱主义者们致力于寻求或构建一种能被广泛接受的、充满人情味的新秩序。尽管这种通过演说、戏剧与教育来重塑社会的路径常被批评为缓慢甚至天真，但博爱主义者始终怀抱一种信念：通过不懈的努力，一个尊重每个灵魂、焕发人文光辉的国度终将建成，引领全体人民走向真正的、充满尊严的繁荣。"
 chamber_syndicalism:0 "商会统合体制"
 chamber_syndicalism_desc:0 "哪怕商会的触手早已蔓生至社会的各个领域，其庞大需求亦不可忽视，但它们的欲望与计谋最终还是受制于一位特定领导人的想法。"
 despotism:0 "专制政治"
 despotism_desc:0 "专制政治是一种个人拥有绝对权力的政府形式。"
 oligarchism:0 "寡头政治"
 oligarchism_desc:0 "寡头政治是一种小部分人拥有绝对权力的政府形式。"
 moderatism:1 "温和主义"
 moderatism_desc:1 "温和主义是一种在施政上采取温和姿态或手段来避免极左或极右的政府形式。"
 centrism:1 "中间路线"
 centrism_desc:1 "中间路线是一种试图通过符合常识的治理方式解决问题的政府形态，其施政力求在考虑风险和承载力的情况下，妥善解决当前和未来的需求，从而获取公众信任，进而维护共同利益。"
 
