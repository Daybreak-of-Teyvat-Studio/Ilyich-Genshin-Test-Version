# 璃月剧本：国策、伴生事件与民族精神
#####################
# 请仙典仪
 LYY_Rock_and_Covenant:"岩与契约的海港"
 LYY_Rock_and_Covenant_desc:"£mora 此即璃月，岩王帝君千年庇佑之下，全提瓦特最繁华之港。海上商路成熟，凡舟自四方来，£mora 摩拉如水，昼夜不息，涌于此地。南码头桅樯如林，卸货之声三更不绝，北码头盐仓连阡陌，称量之吏日不暇给。"
 LYY_Event.01.t:"岩与契约的海港"
LYY_Event.01.d:"璃月之民祀摩拉克斯，其事与璃月之兴并行。初，先人至岩间，垒石为灶，击石取火，火与灶皆出于石，众遂以为摩拉克斯所赐。其后营建璃月港，一砖一瓦皆手自筑之，山岩之上有草挺然，石缝间生而不枯，众亦以为神助。至今港中商贾出门贸易，必先拜祭，祈一岁之利；诸饭馆皆能言帝君曾于其店点某羹、赞某汤，言之凿凿，如亲见者。归离原上旧祠一区，梁柱已朽，而香火不绝，守祠者岁易其人。玉京台庭前有鼎三足，腹有铭文，字多漫漶，老吏云此初年所铸。凡此诸说，孰真孰妄，非问之帝君不能明。而璃月之人皆信终有一日得问之，盖其神永在，人与神并行之年，与其有生之年同长。时代虽易，凡民与仙众皆未尝设想无帝君之璃月。或亦以此，故至今无人往验其言。"
 LYY_Event.01.a:"是谁？"
 LYY_Event.0101.t:"岩与契约的海港"
LYY_Event.0101.d:"总之，欢迎来璃月港。此地即卖日落果亦可大赚，纵赚不得钱，也万勿背任何与璃月人之契约，其后果非君所愿闻。除此而外，惟余享七星治下无边繁华而已。千岩军教头加练半宿，兵不怨，只把甲胄擦得更亮。天衡山下旧矿口封闭，封条新而印旧。愚人众使者递名帖，帖在门房压三日方送入。七星议事群玉阁，至后夜未散，茶续七回。商会将今年行规重誊一遍，删者多于增者。南码头卸货至夜，脚夫唱号，声闻数里。吃虎岩夜市未收，摊灯连缀如星。不卜庐门前有队，皆候诊者，自晨至午不散。孤云阁诸岛哨船往返，一日两次，报风信于总务司。北码头仓中有旧缆，粗如臂，历年所换，堆之成丘。往生堂近日无客，门房扫地，扫至阶下乃止。"
 LYY_Event.0101.a:"所以，是谁？"

 LYY_Rite_of_Inviting:"七星请仙典仪" # 开启七星请仙典仪
 LYY_Rite_of_Inviting_desc:"七星请仙典仪：岁一度之璃月崇典，以迎岩王帝君之圣临，而祈神明示，导引璃月之地一年之兴衰。"
 LYY_Event.02.t:"七星请仙典仪"
LYY_Event.02.d:"璃月佳节之盛，莫过于「七星请仙典仪」。岩神岁临，传下谕旨，令凡民循其意而行，则事有规矩，不至逾越生乱。上古之世，璃月先民自农人中遴选代表，迎送岩神，献丰厚之祭、诵肃穆之祝，然后恭听神谕，宣于众人，以定一岁经营之向，凡民由是富庶，灾祸由是而解，岩神之土遂固而不移。典仪在玉京台，阶九级，石面为历年所踏，中低而两旁高。将至之日，绯云坡列肆皆悬灯，南码头舟子系缆于桩，不敢远行。执事者先期三日斋居月海亭，洗器、涤鼎、扫阶，一丝不遗。观礼之民自天衡以南来者，多在城外宿一夜，晨钟未动而阶前已满。翘英庄输新谷为粢盛，明蕴镇输石珀为镇物，皆先期而至，不入市肆。典仪之日，玉京台四隅置炉，焚香不绝，烟气与云相乱。"
 LYY_Event.02.a:"千岩牢固，重嶂不移！"
 LYY_Event_02_t:"七星请仙典仪"
 LYY_Event_02_t_desc:"璃月佳节之盛，莫过于「七星请仙典仪」。岩神岁临，传下谕旨，令凡民循其意而行，则事有规矩，不至逾越生乱。上古之世，璃月先民自农人中遴选代表，迎送岩神，献丰厚之祭、诵肃穆之祝，然后恭听神谕，宣于众人，以定一岁经营之向，凡民由是富庶，灾祸由是而解，岩神之土遂固而不移。典仪在玉京台，阶九级，石面为历年所踏，中低而两旁高。将至之日，绯云坡列肆皆悬灯，南码头舟子系缆于桩，不敢远行。执事者先期三日斋居月海亭，洗器、涤鼎、扫阶，一丝不遗。观礼之民自天衡以南来者，多在城外宿一夜，晨钟未动而阶前已满。翘英庄输新谷为粢盛，明蕴镇输石珀为镇物，皆先期而至，不入市肆。典仪之日，玉京台四隅置炉，焚香不绝，烟气与云相乱。"
 LYY_Rite_of_Inviting_01:"六合引之为骨"
 LYY_Rite_of_Inviting_01_desc:"六合引之为骨：典仪之仪，常由璃月七星中一君子莅临，咸集璃月之黎民，暨四海之商贾游人。其仪，主人将以焚香炉之举，歌咒文之诵，期灵验于岩王帝君之降臨。神谕既显，当导引璃月之一载运势，于邑之经济文教，实有深重之影响。"
 LYY_Event.03.t:"七星请仙典仪"
LYY_Event.03.d:"其后魔神战争既平，璃月港城渐兴，七星代表港中工商诸业，为凡民与岩神之媒介，直与岩神相通，复以简明之语传神谕于市民，颁一岁之方针。而主持「七星请仙典仪」者，顾名思义，只出于七星之内，此外无人得而问之。七星之位非世及也，以功、以望、以货殖之信，众推而居之。玉京台之侧有榜廊，榜出则市井传抄，纸贵一时。茶楼说书者取七星行事编为话本，听者满座，然于典仪一节，终不敢妄增一字。其权重如此，故港中商贾遇七星出行，皆避道而立，不敢当车。七星既出，凡港中讼事、水利、关卡诸务，皆取裁焉，故一岁之政，半成于榜廊之下。天后宫香火以典仪前后为最盛，渔户持牲而来，列于门外，次第以入。典仪之夕，玉京台燃灯三百，望之如列星。"
 LYY_Event.03.a:"所以，要怎么成为七星呢？"
 LYY_Event.0301.t:"来自观海的典仪建议"
LYY_Event.0301.d:"「哦！诸位亦欲观『七星请仙典仪』乎？远来之人，行动力果然可嘉。说来自居璃月数十年，似未曾往观一次。此即所谓『本地人不往之景』也。然愿君行旅愉快，璃月欢迎诸位。」派蒙：多谢！敢问何处可观此典仪？「路既远，纵为君言街巷曲折，远客亦记不清。只往玉京台去，往高处去。此港最高处也，宜与天神相通，君以为如何？」归离原麦熟，收麦者多于往年，而镰刀自外来。翘英庄新茶已上，茶价未定，市上皆观望。玉京台石阶晨露未干，扫者已扫三遍。南码头有舟待发，舟子候客，见远客辄招手。月海亭阶下植桂两株，秋深则香闻半街。群玉阁有执事持册，册上列典仪诸务，凡三十六条。往观者须早行，日中则阶前无隙地。"
 LYY_Event.0301.a:"对吧？"
 LYY_Rite_of_Inviting_02:"驱之长昭天理"
 LYY_Rite_of_Inviting_02_desc:"驱之长昭天理：因七星邀仙之仪行于兹地，璃月之贾商与黎庶咸将揣度未来市势及经济方略，从而定其举措。是以斯仪于璃月之经济兴衰，影响深远矣。"
 LYY_Event.04.t:"七星请仙典仪"
LYY_Event.04.d:"璃月港商人视岩神之谕重于黄金。每至帝君降临之日，虽身在千里之远，或亲行，或遣健足，星夜驰归故里，只求岩神一指，以保一岁生意兴旺。或有海舟方泊南十字而未卸货者，货主弃货登岸，先赴玉京台，货则留于舟中，待典仪既毕再议。商会先期议定行价，压去两成，供货之农户照旧输货，云此规矩不可废。以故典仪前后数日，港中百货价平而交易反多，市面不觉其扰。码头工人聚看货单，看毕无语。钟离在往生堂院中看石，自午至暮，看毕即入室。典仪既毕，商贾各录所闻之谕归肆，悬于堂中，朔望诵之，子弟能诵者，众以为贤。有以重金求先知谕中一字者，终不可得，遂有伪托之弊，商会立罚，罚倍其货值。南码头夜有舟发，桅灯三盏，行者云赴远洋，候谕而后行。"
 LYY_Event.04.a:"什么？"
 LYY_Event.0401.t:"来自博来的典仪建议"
LYY_Event.0401.d:"诸位亦欲瞻仰「七星请仙典仪」乎？吾亦欲之，众皆欲之。身为经商之人，焉能不察璃月商务之动静。去年神谕十七条，已使市面震荡不小。且今年风声不断，云天权星凝光阁下暗中有所措置，欲将神之眼使用者以元素力所造之岩石，于税目定义上剔出矿物之列。哈哈，时时留心神谕与市面者，亦此商港之趣也。岩王帝君，七神中最古之灵，其战略目光，吾辈素所信服。能先一时知今年神谕，或可快人一步，抢占发财之机。若问何处可观此典仪，只往玉京台去，往高处去。此港最高处也，宜与天神相通，君以为如何？商会榜前有老账房执笔立候，云神谕一出，即刻抄价。商会藏书楼中，历年神谕抄本凡三百卷，编次以年。老账房云：此卷不可借出，只可于楼中看。"
 LYY_Event.0401.a:"对吧？"
 LYY_Event.0402.t:"沉玉水土之患"
LYY_Event.0402.d:"沉玉谷在璃月之北，以地势之奇、物产之富著称。其地山水相连，气候温和，宜百草生长，而沉玉谷之茶尤名。然不知何故，谷中水土失调，茶之产与质俱损，由是累及当地生计。香菱以新菜进客，客食毕但云一句：调料过多。码头工人聚看货单，看毕无语。群玉阁新换栏杆，立其上者可望更远之海。总务司文书笼中卷宗堆至半人高，主事者云慢慢料理即可。翘英庄茶户挑茶出谷，行至石门关，为关卒所阻，云待验。谷中旧有堰三，其一已坏，水走旁道，田失其润。茶户云：往年一亩得茶三十斤，今不过十五。总务司遣吏往勘，勘毕具报，报中言堰事，而未言所以坏。香菱闻之，自璃月港携一囊新茶往，云试煮之，味尚可救。茶户受之，煎于釜中，香气稍复。"
 LYY_Event.0402.a:"我们需要解决它！"
 LYY_Rite_of_Inviting_03:"八荒韫玉而明"
 LYY_Rite_of_Inviting_03_desc:"八荒韫玉而明：七星请仙典仪，非独宗教之仪，实乃璃月社会之一要构成，显见其民之尊神重道，以及对未来之期盼。又兼之，此乃商贾黎庶交际之机，益于固结乡邻之情谊，增社区之胶合力。"
 LYY_Event.05.t:"七星请仙典仪"
LYY_Event.05.d:"雨林之国，狂言之智者弃世俗而求隐密之至高智慧，狂乱不知所止；磐岩之国，其民则惯于祈神明慷慨之引，用以固其繁荣之世俗。似乎某时，同行凡世之七神亦彼此背道而驰。城外驿道多一队人马，无旗号，行不甚急，宿则择野，不入驿舍。有舟自孤云阁外绕还，甲板空然，舱中所载无人问之。绝云间石阶落叶，扫叶者云今年落较早，扫之不尽。千岩军结营于野，火堆倍于平日，云有备则无患。轻策庄田水未退，农人夜守陂塘，火把连缀如带。明冠峡有客自北来，衣冠如璃月人，而语音不类，宿于逆旅，晨即去。石门关卒报，本月中过旅倍于常，皆云往观典仪。渌华池水色忽异，渔者不敢下网。凡此数事，散在四方，不相连属，而港中老者闻之，皆默然不答。"
 LYY_Event.05.a:"背道而驰？"
 LYY_Event.0501.t:"奇怪的违和感"
LYY_Event.0501.d:"刻晴已不知第几次被凝光唤去。虽于凝光作风颇有成见，然无丝毫不满，盖所议者乃请仙典仪之筹备，万容不得一毫懈怠。入群玉阁，先见一群秘书焦头烂额，刻晴不之理，直趋立于满墙文书前之凝光：「凝光？又唤我何事？」凝光转身，一指旁侧太师椅：「嗯，你来了，坐。」「客套不必，又有何差遣？」「果然玉衡星刻晴，直言如此。关于『请仙典仪』之安保，」「此大可不必再虑，已备得十分妥当。」「嗯，我总觉得哪里不妥。呵，也罢。」凝光凝视窗外，更无一语。阁中案上摊图一幅，四角压以石镇，茶已冷，无人添。窗外玉京台石阶上，执事者正以白垩画界，画一线，退三步视之，复画。阁外廊下有吏抱牍疾走，牍高过肩。刻晴出阁时，天已暮，港中灯火次第而明。"
 LYY_Event.0501.a:"暴风雨前的平静？"

 LYY_Rite_of_Inviting_04:"礼予天地四方" #进行请仙典仪
 LYY_Rite_of_Inviting_04_desc:"礼予天地四方：于璃月斯土，其地幽邃，岁之一度，七星邀仙之盛典今始行矣。是会也，融天文之察、神明之崇以逮民俗之艺，盛矣哉！\n§R「典仪进度达到80方可开启！」§!"
 LYY_Event.06.t:"七星请仙典仪"
LYY_Event.06.d:"典仪之日，璃月市民与远来游客骈集玉京台，共观此一岁之盛。平明，日自云隙出，光落台前，礼遂启。台上七星图腾高张，晨光映之，金彩流走，望者屏息。祭司服华服，持法器，自阶下缓步而上，行不疾不徐，一级一止。钟三鸣，启幕之礼乃成。阶下列肆皆闭户，市声一时俱寂，惟闻风动旗绳与远处潮声。有老妪自奥藏山来，携孙立于人后，云此生只见此礼三次，一次在少时，一次在嫁时，今为第三次。台中设案三，列鼎彝、陈币帛、置祝版，祝版之文，书于旧例，不敢增损。香自炉出，盘旋不散，直至日昃。四方观者持香而立，不敢喧哗，童子亦屏气。礼毕众散，玉京台石阶上遗履痕无数，守者以帚扫之，扫至日昃方净。执事者以所余牲牢分与贫者，旧例也。"
 LYY_Event.06.a:"启动！"
 LYY_Event.0601.t:"帝君遇刺"
LYY_Event.0601.d:"璃月城岁一盛会，曰七星请仙典仪。是岁之典，岩王帝君临之，而于仪至最盛之时，遇刺陨落。当是时，玉京台广场聚市民游客无数，仰首待帝君之降，冀此典所赐之福与安宁。仪渐进，云雾缭绕，帝君之形渐显。忽一声震响，破其祥和，帝君仙躯自空坠地，广场寂然如死。俄而大乱，人皆失措，或呼或哭，有欲趋前视之者，皆为驰至之千岩军所拦。天权星凝光登高台，容色肃然而不乱，即下命封锁，集人赴救，兼察其变。七星余众亦动，一面抚众心，一面守四周，以防不测。台上之气紧张而压抑，众人面上，皆写不可信与深悲。有老妇跪于阶下，以额触石，口不能言。风自云来海起，旗绳乱响。千岩军以矛为界，退百步，观者掩面而退。"
 LYY_Event.0601.a:"天哪！"
 LYY_Event_0601_t:"帝君遇刺"
 LYY_Event_0601_t_desc:"璃月城岁一盛会，曰七星请仙典仪。是岁之典，岩王帝君临之，而于仪至最盛之时，遇刺陨落。当是时，玉京台广场聚市民游客无数，仰首待帝君之降，冀此典所赐之福与安宁。仪渐进，云雾缭绕，帝君之形渐显。忽一声震响，破其祥和，帝君仙躯自空坠地，广场寂然如死。俄而大乱，人皆失措，或呼或哭，有欲趋前视之者，皆为驰至之千岩军所拦。天权星凝光登高台，容色肃然而不乱，即下命封锁，集人赴救，兼察其变。七星余众亦动，一面抚众心，一面守四周，以防不测。台上之气紧张而压抑，众人面上，皆写不可信与深悲。有老妇跪于阶下，以额触石，口不能言。风自云来海起，旗绳乱响。千岩军以矛为界，退百步，观者掩面而退。"
 LYY_Event.0602.t:"危机显现"
LYY_Event.0602.d:"刻晴眉峰紧皱，行色匆匆。无人敢前问其故，而众皆知岩王帝君死于前日天权星凝光所办之请仙典仪，能使玉衡如此者，惟此一事。「凝光！」刻晴冲入群玉阁，见他六人早候于此，竟自帝君遇刺之后，一步未离。众人面色皆憔悴，数日来焦头烂额，即凝光亦失平日之从容，目中微露疲色。「刻晴，你来了，千岩军那边可有新报？」「并无进展。」「须另寻一法。」「如此下去，璃月必溃。」闻刻晴所报，座中终有不能忍者，哗然而起。凝光摇首，默思良久，乃曰：阁中烛已残三，案上茶冷未撤，窗外雨至，檐溜有声。七人相顾无言，惟闻檐溜愈急，灯焰随风而摇。廊下待命之吏，无一人敢入。刻晴立于案侧，指节扣案，扣三两声而止。"
 LYY_Event.0602.a:"对仙人封锁消息，千岩军将全权负责调查!"
 LYY_Event.0603.t:"凝光临时执政"
LYY_Event.0603.d:"岩王帝君遇刺，璃月城陷于混乱不安。当此危机，七星凝光显出非凡之决断。帝君遇刺之讯既传，凝光即行，急召七星会议。会上，凝光陈其议，请自任临时执政，以保璃月城于无帝君之日仍守其常度。七星议定，众意如一，遂推凝光为临时执政，理帝君遇刺后诸急务。会未毕，门外已有总务司诸吏持牍候命，牍分三类：一曰市易，二曰关津，三曰讼狱。凝光取笔，先署市易，次关津，次讼狱。议既决，榜张于玉京台，读榜者立至暮。总务司旧档中，无临时执政一目，掌书记者另立一卷，题曰权摄。凝光署毕，合牍付吏，云一牍未毕，不得议他牍。群玉阁槛外雨不止，侍者三易烛。南码头舟子闻之，系缆不行，皆云待榜再定行止。"
 LYY_Event.0603.a:"您看这面相，可以当帝君吗？"
 LYY_Event_0603_t:"凝光临时执政"
 LYY_Event_0603_t_desc:"岩王帝君遇刺，璃月城陷于混乱不安。当此危机，七星凝光显出非凡之决断。帝君遇刺之讯既传，凝光即行，急召七星会议。会上，凝光陈其议，请自任临时执政，以保璃月城于无帝君之日仍守其常度。七星议定，众意如一，遂推凝光为临时执政，理帝君遇刺后诸急务。会未毕，门外已有总务司诸吏持牍候命，牍分三类：一曰市易，二曰关津，三曰讼狱。凝光取笔，先署市易，次关津，次讼狱。议既决，榜张于玉京台，读榜者立至暮。总务司旧档中，无临时执政一目，掌书记者另立一卷，题曰权摄。凝光署毕，合牍付吏，云一牍未毕，不得议他牍。群玉阁槛外雨不止，侍者三易烛。南码头舟子闻之，系缆不行，皆云待榜再定行止。"
 LYY_Event.0604.t:"璃月大萧条"
LYY_Event.0604.d:"岩王帝君之逝，于璃月之财用冲击甚大。帝君为璃月财政所倚，其存也，则£mora 摩拉之值与信皆定；其亡也，则全提瓦特之人皆疑£mora 摩拉之值，遂成£mora 摩拉之慌。璃月人多恐£mora 摩拉将跌，争赴银行，易为他物，挤兑之风，遍于港中诸行。诸行门前皆排长队，或有现金不足而闭门者。此风既起，金融之体承压甚重，即璃月中央黄金屋之权威，亦难独支。璃月之政与商会方急议应对，欲复众人对£mora 摩拉之信，而效未甚著。璃月正面临一场财用危机。随钱荒而至者，为股市之瓦解。璃月股价于昨日逐月节一日落千丈，即垄断海外运输之南十字船队公司，其股亦腰斩。以故，有金融家名是日为黑色逐月节。"
 LYY_Event.0604.a:"灾难降临了！"
 LYY_Event_0604_t:"璃月大萧条"
 LYY_Event_0604_t_desc:"岩王帝君之逝，于璃月之财用冲击甚大。帝君为璃月财政所倚，其存也，则£mora 摩拉之值与信皆定；其亡也，则全提瓦特之人皆疑£mora 摩拉之值，遂成£mora 摩拉之慌。璃月人多恐£mora 摩拉将跌，争赴银行，易为他物，挤兑之风，遍于港中诸行。诸行门前皆排长队，或有现金不足而闭门者。此风既起，金融之体承压甚重，即璃月中央黄金屋之权威，亦难独支。璃月之政与商会方急议应对，欲复众人对£mora 摩拉之信，而效未甚著。璃月正面临一场财用危机。随钱荒而至者，为股市之瓦解。璃月股价于昨日逐月节一日落千丈，即垄断海外运输之南十字船队公司，其股亦腰斩。以故，有金融家名是日为黑色逐月节。"
 LYY_Event.060401.t:"经济危机加剧"
LYY_Event.060401.d:"岩王帝君遇刺之阴下，璃月城之经济受创，一场大萧条卷此曾繁之城。此危非独累及商务，且及社会每一隅，民生由是深损。其源在帝君遇刺所起之信心之危。投资者于璃月之前途怀惧，纷纷撤资避险，市面之流遂竭。同时，帝君于璃月经济居核心之地，其逝也使诸倚帝君之庇者陷困，诸企不得不裁人，甚至闭户，失业由是骤增。失业为璃月民最重之负。厂闭，铺关，无数劳动者一夜之间失其生计。街头巷尾，皆见求职工，或焦然翻招贴，或于职业介绍所前排长队，冀得一业以养家。然市面低迷，机会寥寥，多人只得受低薪或临时之役，生计之质大降。总务司门前设木牌一，书招工之事，日日改写，改毕即有人围看。南十字船队减舟三艘，泊于港外不卸。"
 LYY_Event.060401.a:"璃月往地狱里冲！"
 LYY_Event.060402.t:"饥寒交迫的人民"
LYY_Event.060402.d:"璃月大萧条之阴下，百姓生计急坏，昔日繁华之街景，今为凄凉所替。此危如无形之暴雪，侵每一家，使人感生计之艰。饥饿之影笼于大街小巷。粮价飞涨，寻常之家难以支，案上昔之丰食，今变稀缺。孩童面上失其红润，老者之身日渐衰弱。为果腹，有人不得不于垃圾堆中觅残羹，或入长队待善堂施粥。食券与官赈为其唯一之望，然此援远不足以给众人之需。寒则如不速之客，潜入户庭。燃料与取暖之费既增，多家无力以付，尤于寒冬之夜，少保暖之物者惟蜷于薄衾，以体温相暖。孩童手足常冻而通红，老者则于风中战栗。窗上冰花，非独天之印，亦生计之苦之写照。北码头有老妇卖其釜，得钱三十，云釜已三月不用。不卜庐施姜汤于门外，日三百碗。"
 LYY_Event.060402.a:"璃月往地狱里冲！"
 LYY_Event.060403.t:"饥寒交迫的人民"
LYY_Event.060403.d:"玉衡拉响汽笛，天权敲起钟，群玉阁发信号，璃月往地狱里冲。璃月大萧条之下，社会不满随之而高，街头抗议频发，城中治安亦大受损。民于七星之才与政之行皆生疑，于前途之信愈摇。大萧条非独一场经济之危，实为对七星才具之严峻之试。当此之时，璃月所需者，智与勇，及全民之团结与支持。惟定切实可行之复苏之策，重建市面之信，促就业，改民生，璃月方能于风中立定，迎一新曙。抗议者聚于玉京台榜下，持纸灯，灯上各书所愿，夜半不散。千岩军列于阶前，不持兵，亦不退。商会会长引退，榜上无名，市人猜之，不敢明言。北码头有舟久泊不卸，货主不至，脚夫散去。总务司发文三道，皆言安民，读之者多不终篇。"
 LYY_Event.060403.a:"凝光是那个合适的人选吗？"
 LYY_Event.0605.t:"仙人问其罪"
LYY_Event.0605.d:"帝君遇刺之讯既出，璃月港复起一场风波。三眼五显仙人携怒与疑，降于此繁华之海港，其来如乌云压城，一场严峻之对峙将作。仙人以不容疑之姿现于港中，目光锐如刀，辞气严厉，直指七星未尽护帝君之责。忧惧之情，漫于人群。面对仙人诘问，七星凝光挺身而出，以沉稳之态迎之，且于众人前直言此事之重。凝光言：七星当任其责，尽力查真相，必使凶手伏法。凝光之语虽暂息仙人之怒，而两间紧张之气未尽散。仙人令七星于限期内给一满意之答，不然，将不得不思更为严厉之举。璃月港之天似亦因之而阴，众人皆观望，冀七星能解此危，使港中复归平静。群玉阁前石阶，仙人立其上，衣袂不动，而风自绕之。仙人凡七，其一持杖，杖头玉色，叩阶而鸣。"
 LYY_Event.0605.a:"祸不单行!"
 LYY_Event_0605_t:"仙人问其罪"
 LYY_Event_0605_t_desc:"帝君遇刺之讯既出，璃月港复起一场风波。三眼五显仙人携怒与疑，降于此繁华之海港，其来如乌云压城，一场严峻之对峙将作。仙人以不容疑之姿现于港中，目光锐如刀，辞气严厉，直指七星未尽护帝君之责。忧惧之情，漫于人群。面对仙人诘问，七星凝光挺身而出，以沉稳之态迎之，且于众人前直言此事之重。凝光言：七星当任其责，尽力查真相，必使凶手伏法。凝光之语虽暂息仙人之怒，而两间紧张之气未尽散。仙人令七星于限期内给一满意之答，不然，将不得不思更为严厉之举。璃月港之天似亦因之而阴，众人皆观望，冀七星能解此危，使港中复归平静。群玉阁前石阶，仙人立其上，衣袂不动，而风自绕之。仙人凡七，其一持杖，杖头玉色，叩阶而鸣。"
 LYY_Event.0606.t:"愚人众之乱"
LYY_Event.0606.d:"帝君遇刺之讯既出，璃月城陷于不安与混乱。至冬国之秘组织愚人众乘隙而入，因民之悲与未来之不定，煽起一场遍城之乱。愚人众以其特殊之身与目的，速动于城中。散谣言，挑离间，谓帝君之死实藏七星之阴谋，欲倾民于现政之信。在其鼓动之下，有不明真相之民入于抗议之列，街市之示渐成毁损公私财物之暴行。璃月城之序危如累卵，警卫之卒疲于奔命，欲平乱而复安宁。然愚人众之举似有预谋，巧用城中矛盾与不满，使局势愈杂。至冬国之介入，使此乱蒙国际之色，七星遂处内外交困之地。彼须速查明愚人众之真意，发其主使，兼抚民心，重建社会之序。北码头仓房火起三处，救之不及，灰烬中拾得铁牌一枚，上无字。"
 LYY_Event.0606.a:"趁火打劫之徒，该死!"
 LYY_Event_0606_t:"愚人众之乱"
 LYY_Event_0606_t_desc:"帝君遇刺之讯既出，璃月城陷于不安与混乱。至冬国之秘组织愚人众乘隙而入，因民之悲与未来之不定，煽起一场遍城之乱。愚人众以其特殊之身与目的，速动于城中。散谣言，挑离间，谓帝君之死实藏七星之阴谋，欲倾民于现政之信。在其鼓动之下，有不明真相之民入于抗议之列，街市之示渐成毁损公私财物之暴行。璃月城之序危如累卵，警卫之卒疲于奔命，欲平乱而复安宁。然愚人众之举似有预谋，巧用城中矛盾与不满，使局势愈杂。至冬国之介入，使此乱蒙国际之色，七星遂处内外交困之地。彼须速查明愚人众之真意，发其主使，兼抚民心，重建社会之序。北码头仓房火起三处，救之不及，灰烬中拾得铁牌一枚，上无字。"
 LYY_Event.0607.t:"黑岩厂之乱"
LYY_Event.0607.d:"帝君遇刺之讯遍于璃月城之际，又一惊人之报接至：璃月南之黑岩厂，叛焉。黑岩厂为璃月军工重地，素为国家安危所倚。然帝君遇刺后之乱局，似与某些势力以可乘之隙。据初报，厂中一部分乱者速占厂区，宣言独立，且提政治之请：一曰七星下台，二曰重选领导，三曰彻查帝君遇刺之事。其举速引城中关注与恐慌，恐此乱更弱国家之稳。七星即开急会，商对策，且力寻和平之解，以免不必要之流血。黑岩厂之乱，非独胁璃月之军力，亦撼全国经济与社会之序。今黑岩厂之情尚不明，城中居民忧之。有司方全力应此猝变，冀速复秩序，以保国家长治久安。黑岩厂旧井百余，井口皆铁盖，叛者以盖为垒，列于厂门。厂中工匠三百，多本地之人，闭户不出。"
 LYY_Event.0607.a:"我们希望岩王帝君回来！"
 LYY_Event_0607_t:"黑岩厂之乱"
 LYY_Event_0607_t_desc:"帝君遇刺之讯遍于璃月城之际，又一惊人之报接至：璃月南之黑岩厂，叛焉。黑岩厂为璃月军工重地，素为国家安危所倚。然帝君遇刺后之乱局，似与某些势力以可乘之隙。据初报，厂中一部分乱者速占厂区，宣言独立，且提政治之请：一曰七星下台，二曰重选领导，三曰彻查帝君遇刺之事。其举速引城中关注与恐慌，恐此乱更弱国家之稳。七星即开急会，商对策，且力寻和平之解，以免不必要之流血。黑岩厂之乱，非独胁璃月之军力，亦撼全国经济与社会之序。今黑岩厂之情尚不明，城中居民忧之。有司方全力应此猝变，冀速复秩序，以保国家长治久安。黑岩厂旧井百余，井口皆铁盖，叛者以盖为垒，列于厂门。厂中工匠三百，多本地之人，闭户不出。"

 LYY_Meeting_Liyue_Qixing:"七星八门十二厅" #成立凝光临时政府
 LYY_Meeting_Liyue_Qixing_desc:"璃月七星者，乃璃月常议会之要员七人也，司理璃月政务，总领各方贤达。"
 LYY_Event.07.t:"凝光临时政府"
LYY_Event.07.d:"岩王帝君遇刺之报一出，璃月震动，市井闭户，舟泊不卸。七星凝光当先而起，召七星、八门、十二厅大会于群玉阁，欲合众力以图其后。议至夜分，烛数易而人不散。凝光陈其议，谓此时璃月须有一总摄之处，号令出于一门，则事可济；若各持一说，恐变生仓卒。众初有难色，争辩良久，或虑权柄偏集，或虑缓不济急。凝光复言：临时之府非为久计，待刺案既明，还政如故。众乃应之。凝光临时政府遂立，其职在刺案未明之日，维持港中常度，护市易、理讼狱、谨关津。凝光于会末自誓，处事必公，必听市井之言，必守旧章。港中闻之，或喜其断，或疑其专，巷议不一。南码头有舟欲去者，闻讯系缆再宿；玉京台榜下聚人千数，读榜者一遍，众复请再读。"
 LYY_Event.07.a:"彼可取而代之！"

 LYY_Crisis_Liyue_Economy:"璇玑合璧镇昆仑" #璃月大萧条与凝光新政
 LYY_Crisis_Liyue_Economy_desc:"璇玑合璧镇昆仑：昔者，璃月之历史，摩拉克斯之陨落，乃一时代之终焉。摩拉克斯，璃月经济之守护神也，其陨落之日，璃月全城哀痛，且引发未有之经济浩劫。其影响深重，破坏惨烈，闻者心惊。"
 LYY_Event.08.t:"璇玑合璧镇昆仑"
LYY_Event.08.d:"璇玑合璧镇昆仑。总务司文书笼中卷宗堆至半人高，主事者云慢慢料理即可。七星议事于群玉阁，至后夜未散，茶水续七回。城外驿道多一队人马，无旗号，行不甚急。玉京台石阶为人数过，数至末，单双无人记清。海上雾起三日，灯塔校两次，进出港之舟皆挪班期。有游方术士设摊于街口，观者众，与钱者少。商会压行价两成，供货农户照旧输货，云此规矩不可废。天衡山下旧矿口封闭，封条新，而印旧。往生堂门前悬白，来者不入门，置香于阶而去。不卜庐药案上晒陈皮，学徒数之，至三百余乃止。吃虎岩小摊照旧支棚，摊主云帝君在时如此，今亦如此。北码头仓中存盐，封识未启，守者夜三起。南十字有舟自远海还，桅断其一，云遇风。"
 LYY_Event.08.a:"璇玑合璧镇昆仑"
 LYY_Crisis_Liyue_Economy_01:"玉京台宴语"
 LYY_Crisis_Liyue_Economy_01_desc:"鉴于璃月之经济大患，七星于玉京台召集亟谋会议，期致研议并措画应变方略。是会由天权星领首，其余六星咸集，共商维稳璃月财经，以保安黎庶福泽之事。"
 LYY_Event.0801.t:"玉京台清议"
LYY_Event.0801.d:"察民瘼、集实情，凝光暂政乃于玉京台行清议，以别于常制，官民共聚，欲得真言，以定策之缓急。是会非正式，官吏坐于庶民之间，凝光躬身其间，为倾听之态，怀平和诚挚，劝民开言，各陈其事、述其难。所议者，企业主之营生难，工人之就业忧，主妇之家计重，青年之职业惑，皆璃月社会之一斑，每一叹皆动其心。此番入民间之谈，政府得讯甚多，见经济之患于各阶层之实，为后政立据。凝光言：当以民声为重，救济之策更求精审。城民皆以为然，感政府之亲民。有老织户自绯云坡来，携布一匹，云此布三月未售，凝光取布视之，命人记其名。自晨至晡，陈事者三十七人，无一为颂辞。总务司吏执笔于侧，录其言，凡九纸。"
 LYY_Event.0801.a:"生我之父母，救我者凝光！"
 LYY_Event_0801_t:"玉京台清议"
 LYY_Event_0801_t_desc:"察民瘼、集实情，凝光暂政乃于玉京台行清议，以别于常制，官民共聚，欲得真言，以定策之缓急。是会非正式，官吏坐于庶民之间，凝光躬身其间，为倾听之态，怀平和诚挚，劝民开言，各陈其事、述其难。所议者，企业主之营生难，工人之就业忧，主妇之家计重，青年之职业惑，皆璃月社会之一斑，每一叹皆动其心。此番入民间之谈，政府得讯甚多，见经济之患于各阶层之实，为后政立据。凝光言：当以民声为重，救济之策更求精审。城民皆以为然，感政府之亲民。有老织户自绯云坡来，携布一匹，云此布三月未售，凝光取布视之，命人记其名。自晨至晡，陈事者三十七人，无一为颂辞。总务司吏执笔于侧，录其言，凡九纸。"
 LYY_Crisis_Liyue_Economy_02:"应急救荒策"
 LYY_Crisis_Liyue_Economy_02_desc:"《岩王·月令》：季春之月，岩王布德行惠，命有司发仓廪，赐贫穷，振乏绝，开府库，出币帛，勉诸侯，聘名士，礼贤者。"
 LYY_Event.0802.t:"应急救荒策"
LYY_Event.0802.d:"岩王帝君之变，阴霾笼于璃月，市井惶惶，商家困顿，黎民生计大受影响。为此，凝光临时执政亟行对策，颁《应急救荒策》，以期稳市安民。是策含多方救急之法：首设救荒基金，专助旅宿、餐饮、零售诸业，以直补、贷保、税赋宽免，防大范围之裁员。次倡消费激励，如给券符、延节庆之惠，以振商旅，促经济之循环。复增基建之投，以造就业，固长远之竞争力。更兼民生之需，调高最低薪资，增厚失业保险，且备临时居所之援，务使救济速达，百姓得实惠。此等措置，各界瞩目，咸以为然。南码头仓中旧粮启封，分给待赈之家。群玉阁榜出，市人聚观，抄者塞途。虽短期之困犹存，而《应急救荒策》之行，或可稍舒经济之急。"
 LYY_Event.0802.a:"天权之德，可达神明！"
 LYY_Crisis_Liyue_Economy_03:"工商复兴策"
 LYY_Crisis_Liyue_Economy_03_desc:"《岩王·百工》：世儒不察，以工商为末，妄议抑之。夫工固圣王之所欲来，商又使其愿出于途者，盖皆本也。"
 LYY_Event.0803.t:"工商复兴策"
LYY_Event.0803.d:"璃月城经乱世之秋，凝光临政，志坚而目远，以御经济之危。遂谋定而动，布《工商复兴策》，意在振璃月工业之基，激经济之生机，启创新之灵。法案之要旨，在施策以促工业之蜕变升级。政府将设专项金库，以资高新技术。又重扶中小企业，减税降费，简政放权，以金融助力，助其渡难，增其市竞之力。为引投资与才俊，法案含改善营商之条。政府允诺增基建之投，提公服之准，优化法令，为企业创稳明之经营境。凝光于发布会云：工业复兴非独经济之需，实为璃月城长盛不衰之关键。其誓：政府当联社会各方，共推法案之行，保每策皆落地生根，见其实效。黑岩厂工匠闻之，聚于厂门，候复工之令。业内专家赞《工商复兴策》为璃月城迈向高质发展之要步。"
 LYY_Event.0803.a:"凝光上台了，璃月就太平了！"
 LYY_Crisis_Liyue_Economy_04:"社群变法策"
 LYY_Crisis_Liyue_Economy_04_desc:"《岩王·变法》：终日乾乾，与时偕行。天下之治，有因有革，期于趋时适治而已。"
 LYY_Event.0804.t:"社群变法策"
LYY_Event.0804.d:"璃月之城，经事纷扰，经济困顿，时值艰险。凝光以坚毅之心与深谋远虑，发一经世之策，名曰《社群变法策》。斯法案者，应当前经济之危，而实为规划璃月社稷未来之宏图。其范围包罗教育、医疗、就业及社会保障诸要域，志在创建公义、高效、可持之社会体制。其中倡议革新教育，提教育之质，俾每一子一女皆得优学；增强公共卫生之构，峻医疗服务之准，以减民疾；行灵活就业之策，劝创新创业，予青年与失业者更多良机；并备安全之网，以恤弱势之群。凝光于宣示之际明言：社会变法为深沉之转型，关乎璃月万姓之福泽与来日。凝光号全民共襄盛举，支持此宏图。学术名家咸称《社群变法策》为璃月社会治理之新纪元，谓其行将舒社会之争，增民生之乐，为长远发展奠磐石之基。是故，此法之行，必将裨益于民，裨益于国。不卜庐医者闻之，云此法若行，门前候诊之队可短其半。"
 LYY_Event.0804.a:"释先王之成法，而法其所以为法。"

 LYY_Crisis_Mighty_Illuminated_Adepti:"仙之人兮列如麻" # 仙人问罪危机
 LYY_Crisis_Mighty_Illuminated_Adepti_desc:"《岩王·诗赋》：霓为衣兮风为马，云之君兮纷纷而来下。虎鼓瑟兮鸾回车，仙之人兮列如麻。"
 LYY_Event.09.t:"仙凡初会记略"
LYY_Event.09.d:"璃月古奥之境，岁运交于一时之要。近者，七星为斯土守治之主，首与传颂之三眼五显仙人会而议焉。所议者，帝君遇刺之事，欲究其故、正其责。初会之际，气象肃然。仙人以超尘之姿、难测之力，命于七星：帝君者，璃月魂魄所系、权柄所归，其遇刺，非独一身之害，实动全境之序。仙人明告：七星须尽力查办，索真凶，复公道；不然，仙人将平璃月港。七星无辞以避，具陈其事之重，谓自帝君遇刺以来，多方搜求，而案情繁纠，线索纷纭，至今未得确论。七星乃誓，增调人力，尽出可用之资，期于速揭其秘。会既散，仙人归山，七星留群玉阁，灯至天明。港中闻仙人下命，市肆早闭，父母戒其子勿夜行。当是时，群玉阁窗不闭，风入烛摇，无人起而掩之。"
 LYY_Event.09.a:"夷平璃月？"
 LYY_Crisis_Mighty_Illuminated_Adepti_01:"帝君疑案从何探"
 LYY_Crisis_Mighty_Illuminated_Adepti_01_desc:"《岩王·洗冤》：狱事莫重于大辟，大辟莫重于初情，初情莫重于检验。盖死生出入之权舆，幽枉屈伸之机括，于是乎决。法中所以通差令、佐、理、掾者，谨之至也。年来州县悉以委之初官，付之右选，更历未深，骤然尝试，重以仵作之欺伪，吏胥之奸巧，虚幻变化，茫不可诘。纵有敏者，一心两目，亦无所用其智；而况遥望而弗亲，掩鼻而不屑者哉。"
 LYY_Event.0901.t:"帝君遇害案调查组"
LYY_Event.0901.d:"璃月古邦，忽逢奇变，众所仰之帝君竟蒙暗袭，四海震惊，举邦恐慌。临时执政毅然应变，以应三眼五显仙人之严责，安民心，特设帝君遇害案调查之组。此举示政体对仙人问责之诚，亦显守国家安危、维法度之坚。此组聚国中一流验尸之士、老练捕快、析情报者及明法之贤，各尽其能，协力而进，务以精密考据，穷究毫末，解暗中谜团。自现场搜证始，纤毫不遗，凡可疑之迹，皆细察之。执政明示：全力助查，所需资源权限，皆予之，以保调查无外扰，行公正无私。又将与三眼五显仙人密通声气，定期通案情，期得仙人谅解，共保璃月安宁。查组设于总务司西厢，门上贴封条二，出入皆记名。夜中点灯至四更，案上摊图一幅，图角压石。"
 LYY_Event.0901.a:"一定是米老板干的！"
 LYY_Crisis_Mighty_Illuminated_Adepti_02:"进贡奉礼以结欢心"
 LYY_Crisis_Mighty_Illuminated_Adepti_02_desc:"《岩王·奉礼》：尔贡包茅不入，王祭不共，无以缩酒，寡人是征。"
 LYY_Event.0902.t:"进贡奉礼以结欢心"
LYY_Event.0902.d:"临于三眼五显仙人之怒与疑，璃月暂理之政为释其忿、重筑信交，决行古来有效之举，纳贡修礼，以表璃月民之诚与敬。纳贡修礼，自古邦国之间、民神之际，皆视为通意之要道。非独物之交易，实为文之传承、情之往来。璃月暂理之政慎选内蕴深厚、艺值独特之贡物，如琢磨精细之玉器、色泽鲜明之锦帛、香溢四方之茗茶，及稀世之药材，各物皆寓璃月民对仙人之敬，及和合共生之愿。纳贡之仪，璃月政使以最肃穆之态，敬献此诸贡于三眼五显仙人之前。其表璃月民于仙人久庇长导之感激，且郑重立誓，必竭力查究帝君遇刺之秘，严惩元凶，维璃月法度与秩序。此举非独为息仙人之怒，更欲深二者之关系，增彼此之理解与尊重。璃月暂理之政期借此行，开与仙人对话之新门，立坚固合作之基，共御将来之患难。贡物出库之日，南码头列箱三十，箱上皆题仙名。"
 LYY_Event.0902.a:"内残外忍，以量璃月之物力？"
 LYY_Crisis_Mighty_Illuminated_Adepti_03:"整军备战以待仙人"
 LYY_Crisis_Mighty_Illuminated_Adepti_03_desc:"《岩王·兵戈》：昔归终氏之君，修德废武，以灭其国。若陀氏之君，恃众好勇，以丧其社稷。明主鉴兹，必内修文德，外治武备。故当敌而不进，无逮于义矣；僵尸而哀之，无逮于仁矣。"
 LYY_Event.0903.t:"整军备战以待仙人"
LYY_Event.0903.d:"史之进展，常伴未明之险与试。面临三眼五显仙人潜伏之威胁，璃月权衡之际，决心坚毅，筹谋缜密。为保社稷安宁、黎庶福祉，政府两策并举。一者，外交交涉，图谋和平，以言辞消歧见，解纷争。然史所昭示：宁和非易致，强兵固邦乃国家安危之基。是以政府于言谈之间，密谋武备。朝廷密召国中名将贤谋，研拟防务方略；军旅急整，士卒严训，器械更革，边防壁垒固若金汤。是备战而非挑衅，将以和平之谈有更多折冲之资，万一变起，得守疆域之完整，保民性命财货之安。璃月此举，显其卫主权、尊民望之决断，亦见其应未定之世，筹备周详。千岩军于天衡山北增哨三处，哨卒夜不解甲。黑岩厂炉火三日不熄，所铸皆非农器。"
 LYY_Event.0903.a:"财狼来了有千岩长枪！"
 LYY_Crisis_Mighty_Illuminated_Adepti_04:"仙凡之困终须解"
 LYY_Crisis_Mighty_Illuminated_Adepti_04_desc:"《岩王·会谈》：邦交之谋，实乃国际之间不可或缺之枢纽，其为国与国之间疏通议政之首要，亦为弭患息争、维系和平之良策。是以交涉之道，利于防范兵戈之争，藉对话协商以求共利，促进建设和平之世。经由是途，各国得以洞悉彼方之主张、所求与界限，以消释疑窦，减除误会。"
 LYY_Event.0904.t:"第二次仙凡聚议暨帝君遭刺案答询录"
LYY_Event.0904.d:"三眼五显仙人以庄重之责临，璃月临时政务会显勇毅，特开第二次仙凡共议，详陈帝君遇刺之疑案。会中，政务会使者首致深歉与尊崇之意，次揭经严查所得之果：帝君因其久劳，生命之光渐黯，终告陨落。此论乃汇多源之证与博识之见而定，虽哀痛，实无可疑。政务会言：帝君为璃月之守，久负重任，其逝乃自然之数，非人为之陷。已设法存其精神遗泽，并亟谋新制，以保璃月繁盛安宁。面对政务会之答，三眼五显仙人显宽容与体谅，明察璃月百姓本无冒犯之心，惟于哀痛迷惘中求真实。仙人愿释怀，尽以权柄付璃月，以表其信人类自治。仙人临去，指阶下石曰：此石与璃月同寿，好自守之。言毕，云雾自群玉阁起，须臾不见。"
 LYY_Event.0904.a:"磨损？呜呼哀哉，岩王帝君！"
 LYY_Event.090401.t:"第二次仙凡聚议暨帝君遭刺案答询录"
LYY_Event.090401.d:"三眼五显仙人峻责而问难，璃月临时政府集二度仙凡之议，欲明帝君遇刺之事，求一确答。然事不如人愿，政府自陈：虽竭力搜寻，而真相未明。政府之使哀帝君之陨，深憾不能揭此底蕴，乃详述调查之困：要证有阙，证词纷歧，时日既久，线索难觅。其誓必续追，至水落石出乃止。然仙人闻之，于璃月之答大为不满，谓帝君之刺乃犯仙人之威，七星之无能实背仙人之托。忿怒之余，扬言将行极端，乃至玉石俱焚，以惩人类之不敬。是言惊动璃月，人心惶惶，于政府之信顿减。璃月遭此之危，亟须速寻息仙怒之道，否则祸患立至。会散之后，群玉阁檐角铜铃自鸣，守者云无风。仙人既去，阶前石上留足印一，深半寸，拭之不去。当夜群玉阁灯不熄。"
 LYY_Event.090401.a:"都说是米老板干的！"
 LYY_Event.090401.b:"仙家，This Way！"
 LYY_Event.090401.c:"仙凡之战"

 LYY_Crisis_Fatui_and_Osial:"愚者叩问海中魔" #愚人众与奥赛尔之乱
 LYY_Crisis_Fatui_and_Osial_desc:"此地之民，尝对高如山岳之怒涛，亦尝于卧榻之上、梦寐之间，为撼地之海啸所惊。岁月承平，此惧渐消，然此非可恃也。纵使长眠海中之古老魔神一旦醒转，亦不能阻新时代之来临。昔封印此魔神者，或所望者，不过数千年后之今日，能见如此之景象耳。孤云阁外礁石如兽，浪触之则声闻数里，老渔人皆能诵其时。"
 LYY_Event.10.t:"漩涡之魔神"
LYY_Event.10.d:"漩涡之魔神，名奥赛尔。魔神战争时败于岩之魔神摩拉克斯，摩拉克斯以岩枪镇之海底，枪峰犹出水面，孤云阁诸岛即其遗也。大冒险家艾莉丝著《提瓦特游览指南·璃月篇》，述孤云阁云：「此地地脉之动甚奇，视璃月他处皆活跃，节律尤乱，似海底藏一不屈之力，虚弱而搏。或即所镇之魔神，犹在深海中蠕动。」《冒险家罗尔德的日志·孤云阁》亦记云：「夜卧不安，梦皆黑暗潮湿。恍若身为岩神刺穿海底之魔怪，扑簌挣扎，抓挠岩枪，每一动作皆挟大痛与大恨。」港中渔者言，孤云阁一带下网，网常空，偶得鱼，鱼目皆赤。千岩军于岛上有哨，哨卒三年一易，云夜中海底有声，如牛鸣瓮中。凡此皆传闻，然港人讳言奥赛尔，言者必先唾地。"
 LYY_Event.10.a:"如果镇压奥赛尔的封印被解除怎么办？"
 LYY_Crisis_Fatui_and_Osial_01:"调查愚人众"
 LYY_Crisis_Fatui_and_Osial_01_desc:"愚人众者，至冬之国所立之部，奉居于至冬宫之冰之女皇。本为至冬外交之使团。众人大抵皆戴面具，列国咸置使者。愚人众假护佑之名陵压其余六国，实则窥觊七国之中七执政与诸魔神之力。其十一执行官，皆女皇亲授神通，于部中掌最高之权，今方图谋夺权。愚人众之战旅，大抵由诸执行官亲训。已知部众品秩，凡三等：寻常部卒、先遣之士、精锐之师。综迄今所露诸般讯息，愚人众终极之志尚不可知。"
 LYY_Event.1001.t:"愚者叩问海中魔"
LYY_Event.1001.d:"愚人众者，至冬国之组织也，效忠于端坐至冬宫之冰之女皇，实至冬之外交使团。其众多戴面具，几乎每国皆有使者驻扎。愚人众借保护之名，行欺压于余六国，实则觊觎七国中七执政与魔神之力。其中十一位执行官，由冰之女皇亲授之力，于组织内权最高，今方谋夺权柄。愚人众之战部，几乎尽由执行官亲训，其阶级分三等：一般人员、先遣队、精锐。据迄今所泄诸情报，其最终所图者，为世人所未知。璃月临时政府近得确凿之报，见愚人众正谋一险举，欲解漩涡之魔神奥赛尔之古封。奥赛尔者，璃月古传中之恐怖存在，其力足以致海啸、地震，乃至毁一城。数千年前，璃月先人以智与勇封之，璃月由是长治久安。今愚人众之谋若成，必为璃月灭顶之灾。"
 LYY_Event.1001.a:"都说了，不要乱插旗啊！"
 LYY_Crisis_Fatui_and_Osial_02:"相诏北国使者"
 LYY_Crisis_Fatui_and_Osial_02_desc:"《提瓦特·地理》：至冬国者，尘世七执政中冰神冰之女皇所统之国也。居提瓦特大陆北境，终年为冰雪所覆，寒甚。其麾下愚人众，分布于大陆各地。北境商队行至石门，皆言北风愈冷，则其货愈贵。"
 LYY_Event.1002.t:"相诏北国使者"
LYY_Event.1002.d:"近者，璃月政府接一可惊之事：传世之愚人众，密图一诡计，欲破古灵所封之涡魔神。此讯如晴空霹雳，震荡上下。为究其详，璃月之政亟召至冬使臣，会于庄重之交涉场。璃月代表面色凝重，语音果决，谓曰：「尊贵之至冬使臣，吾等不得不陈一严肃之问。据确凿情报，贵邦之中，愚人众正谋一毁灭之举，意欲解涡魔神之封。此非独璃月安危所系，实为提瓦特全土和平之挑衅。敢问至冬国政，于此可知？抑或有意无意涉此乎？」至冬使臣闻言，略显仓皇。少顷，以平和之语对曰：「敬重之璃月代表，吾愿明示：至冬国政恒守和平共处之道，断无危害邻邦之举。至于愚人众及其图谋，我等未有所闻。然请信之：至冬国政于此深恶痛绝，当即查究，且将与璃月通力，以防患于未然。」言毕，两使各退。阶下书记录其词，凡两纸，各钤印。"
 LYY_Event.1002.a:"愚人众是至冬实习生？"
 LYY_Crisis_Fatui_and_Osial_03:"礼后兵戈至"
 LYY_Crisis_Fatui_and_Osial_03_desc:"既定御敌国策，恪守先礼后兵之旨，以全邦交、慎征伐。先遣使持节照会至冬，历数愚人众越境构谋、祸乱璃月之罪，严词诘问，勒令其即刻收诡谋、撤私党、止乱举，速离璃月疆土，毋再滋衅生患。"
 LYY_Event.1003.t:"歼除愚人众之策"
LYY_Event.1003.d:"近者，夜兰所辖之情报机构得确凿秘讯，发愚人众酝酿一重大之谋。是党欲借诡谲之仪与计，开璃月海渊所囚之漩涡魔神。此魔神乃古传中威猛无匹者，一旦脱困，将危璃月，乃至提瓦特全土。闻此变，璃月朝廷应之甚速，立一综理诸部之应急指挥部。其成员括安邦之士、兵戈之师、术法研习之大家，旨在调度有方，于短时内谋定而后动，以息是患。已颁最高戒备之令，重兵守要害，遍查国中，缉疑似愚人众之党。又遣使与邻邦及四方盟约，求援互助。术法研究院竭力究其封印之奥，冀寻增固之道。而精锐之士受特训，以备不时。凡此行动，皆秘而不宣，以免人心浮动。对万民，只经官道以告，以防惊慌。总务司夜开侧门，投牒者不绝，牒皆不署名。"
 LYY_Event.1003.a:"小小愚人之众，可笑可笑！"
 LYY_Crisis_Fatui_and_Osial_04:"安如磐石不可摧"
 LYY_Crisis_Fatui_and_Osial_04_desc:"《岩王·符箓印法》：天地玄宗，万炁本根；广修万劫，证吾神通；三界内外，唯道独尊；体有金光，覆映吾身；视之不见，听之不闻；包罗天地，养育群生；诵持万遍，身有光明；三界侍卫，五帝司迎；万神朝礼，役使雷霆；鬼妖丧胆，精怪亡形；内有霹雳，雷神隐名；洞慧交彻，五炁腾腾；金光速现，覆护真人。急急如律令。"
 LYY_Event.1004.t:"愚者叩问海中魔"
LYY_Event.1004.d:"昔者涡旋之魔神，以平古战场之役被镇，今竟为愚人众所垂涎，欲图破封，释其灾厄。璃月之政闻此警讯，疾速应变，决意重审而固其对涡旋魔神之封，以保境安民。首集国中高明之咒师与史家，研习古封深义，会而议之，定一详密查核增强之策。此策括现存封印之全盘审度，兼设防备新法，以应万变。继而选精兵组一专责之队，内有通晓古术者，有擅新技者，更有历战之勇士。装备以新制探测器及强化之物，潜入封禁之核心，谨严从事加固。查行之间，见数处微弱之点，或即彼所觊觎。特队即施补强，以己之学识与技艺。更于封禁周遭布多层警戒，有异动则发警报，无有遗漏。队中还者，衣皆湿，云海下寒气如针，入骨三分。"
 LYY_Event.1004.a:"我们的防御无懈可击！"
 LYY_Event.100401.t:"愚人末日"
LYY_Event.100401.d:"愚人众者，潜匿暗陬之秘党，久蓄颠覆之图，侵及璃月朝廷容忍之界。朝廷以保民安邦为重，决计发全局之战，歼灭愚人众。战事既筹，鼓角齐鸣。朝廷集情报之士、谋略之家及特种劲旅，共组联军指挥部，详研诸报，明其要害据点与活动之区。令下，战役发轫。特种之兵如夜枭匿形，猝袭其巢。烽火四起，城乡山海僻岛，皆成战场。智勇相搏，每胜皆见公义之维。战役之中，朝廷军精锐勇猛，用先进之战法，重创敌力。于救援重建并举，民之疾苦速得复。经旬月连战，愚人众之势大挫，首脑或擒或毙，阴谋尽破。朝廷宣告一阶段之胜，然警戒不息，誓保璃月安宁。是故，抗奸邪之战未尝稍歇，朝廷将永怀戒惧，以护万民。孤云阁诸岛亦驻兵，哨船昼夜巡，云海中偶见浮木，捞之无字。"
 LYY_Event.100401.a:"所以，什么时候进攻至冬？"
 LYY_Event.100402.t:"漩涡再现"
LYY_Event.100402.d:"愚人众者，匿迹幽微之密团，终逞其狡谋，释奥赛尔封禁之咒。此举非独见璃月政权于情报与应变之乏力，实令国土濒于浩劫。初时，愚人众之动静未获足重，情报之构无从察其异状。及封印微露松弛之兆，政府应之迟缓，措手不及。既无防范之策，又无应对之术，故愚人众得潜行近其目标而不为人知。奥赛尔之封一旦开解，一股滔天之暗力瞬息席卷璃月。海沸云变，黎庶惊惶，昔传为神话之魔君，今竟真形现于世人眼前。奥赛尔复生，灾如潮至，海啸地震，风暴肆虐，生灵财货尽付东流。璃月政权于此危中之状，遭天下谴责。虽后急发救援，然已晚矣。高层首脑于公议与怒火之下，不得不出面，自承防备之重大失误。孤云阁哨船先见水色变黑，驰报，报未至而浪已及港。"
 LYY_Event.100402.a:"所以，阁下什么时候退位？"
 LYY_Event.100402.b:"啊哈"
# 送仙典仪
 LYY_Rite_of_Parting:"辞行久远之躯" # 送仙典仪，七星内战
 LYY_Rite_of_Parting_desc:"我们怀念岩王帝君"
 LYY_Event.11.t:"送仙典仪"
LYY_Event.11.d:"送仙之典，璃月古传也，以怀旧神，亦以赞生命之绵延。今璃月之政备此盛典，以别摩拉克斯。祭品有五：夜泊石，月华映之，昭帝君光晖不灭；永生香，馥郁盈庭，比帝君睿智长存于民心；风筝翩翩，寓民之望自由；琉璃百合，洁而素，显帝君之德；涤尘铃，声清越，兆新篇将启。典设于圣殿广庭，祭坛巍然，诸宝陈列，各放其彩。四围聚生民，自璃邑各地来者，目含敬仰，神情依依，不忍言别。夜降，仪乃徐展。先启者，七星执古法器，口诵深咒，咒若时光之回响，引众追思帝君庇佑之岁。继而舞者衣裳典雅，步履轻盈，翩然于庭中，舞姿婉约而雄浑，似与帝君灵犀相通。舞中寓山水河川，兼及往昔繁茂之景，观者凝眸，泪光闪烁。有老匠自黑岩厂来，捧石灯一盏，置于阶隅，云此灯乃帝君初年所赐样式。礼将毕，风起于庭，香灰尽散。"
 LYY_Event.11.a:"我们希望摩拉克斯老帝君回来！"
 LYY_Event.110101.t:"震撼提瓦特的十天" # 内战线
LYY_Event.110101.d:"九月，石门前线溃，一时间璃月陷于混乱。重云将军宣言将进军玉京台，欲自为璃月之军事独裁者。对此，天权凝光欲组一新政府，括飞云商会、黑岩厂、南十字船队诸势，以缓其危。重云之威既迫，璃月港工兵代表委员会与轻策庄农民协会择妥协。终焉，璃月港立一临时之五人执政内阁，由四名原任七星与一名璃月港人民代表组成，以天权凝光为首，暂行政权，以待事定。石门前线溃卒退至明蕴镇，镇中闭门，不与之纳。轻策庄农民协会开会于社仓，议至夜半，卒从妥协。内阁印新铸，文曰临时执政，用毕即封。南十字船队诺以舟三艘听调。工兵代表会散，代表出，无一人语。玉京台前临时设栅，兵守之，凡入者验印。重云营中鼓角夜鸣，港中闻之皆闭户。"
LYY_Event.110101.a:"吃重大帅之饭，为重大帅效力！"
 LYY_Event.110102.t:"震撼提瓦特的十天"
LYY_Event.110102.d:"软弱之临时政府与造反之人民，已见如此之期：政府当局每一行，必触民之怒；而每一不行动，又招民之蔑。临时政府欲弃碧水原之策，激起民如飓风之猛反；而当天权凝光公然否认政府曾有此类意时，又遭民一阵轻蔑之哄笑。《璃月人民之声报》大声疾呼曰：「被革命之压逼得无路可逃，临时政府为求脱身，乃撒弥天之谎，保其从未思离璃月港，且言不愿弃碧水原。」报出之日，读于街头者数百，读至弥天之谎一句，众皆哗然。报馆门前聚人至夜，巡警立远处，不敢近。有卖报童沿街呼此句，一日售尽三千份。次日，碧水原道上车马不绝，皆云往观其变。政府发示一道，语甚长，读者不解所指。碧水原乡民闻政府欲弃之，聚于祠堂，掷签决去留。"
 LYY_Event.110102.a:"准备好刺杀凝光斯基！"
 LYY_Event.110103.t:"震撼提瓦特的十天"
LYY_Event.110103.d:"十一月七日，星期三，其人起甚迟。行至吃虎岩大街，远闻孤云阁要塞正鸣午炮。是日阴寒，冷风刺骨。国家银行大门紧闭，门前立千岩军卫兵数人，手持半旧白缨枪。问曰：「君等属何方？属临时政府乎？」其一卫兵微笑而对曰：「临时政府完矣，谢天谢地。」此外更无所问。行人照常行于吃虎岩大街，商店照常营业，街上人似不如昨日之不安。一夜之间，墙上又贴满无数新出之反对起义布告与传单，皆向农民、前线士兵、璃月港工人而呼吁者。街角有童子拾传单一纸，读之不解，问于老者，老者摇首不答。银行侧门开一缝，有人递入纸一叠，旋闭。午炮既毕，街上寂然而散。有老兵拄杖立墙下，读新贴之布告，读毕以杖击地三下。"
 LYY_Event.110103.a:"临时政府完蛋了！" 
 LYY_Event.110104.t:"震撼提瓦特的十天"
LYY_Event.110104.d:"全璃月工兵代表大会开幕。依绝大多数工人、士兵与农民之意，赖璃月港工人与卫戍部队所举之义，代表大会已将政权握于己手。大会宣布成立璃月七星革命委员会，临时政府已被推翻。革委会之政将即向各国人民提民主之和约，致力和平，保以地主之土无偿交农民委员会，使军伍彻底民主，立工人监督生产之制。代表大会决定：各地全部政权一律转归地区革委会，各地革委会应保真正之革命秩序。新政府将取一切之措，定局势，致和平，立民主。同时，天权凝光、仙麟甘雨、重云将军与仙人爪牙申鹤图调兵至璃月港，欲推翻新生之革命政权。士兵、工人、职员，共起反抗三眼五显仙人与残暴之资本商人！宜加警惕！革命之运与民主和平之运，尽在君等之手！革命万岁！会散，众起而歌，声出屋外。"
 LYY_Event.110104.a:"革命万岁！"
 LYY_Event.110105.t:"震撼提瓦特的十天"
LYY_Event.110105.d:"璃月各派之冲，终至全面爆发之日。隐居绝云间之璃月仙家，于接纳自璃月叛逃之申鹤时，初则错愕，终则以璃月七星隐帝君之死而震怒；既纳一批被迫害之极端帝君信徒，仙人遂发对七星之审。随后，刻晴于璃月港夺权，组人类之部，备抗仙人之势；甘雨则率不愿与刻晴合之璃月商人、官员与千岩军北上，对南方虎视。海上雾起三日，灯塔校两次，进出港之舟皆挪班期。玉京台石阶为人数过，数至末，单双无人记清。绝云间道中见车马络绎，皆向北，载箱笼，覆以席。石门关外哨卒增倍，盘诘过往，凡北行者皆书其名。轻策庄农人夜登屋，望北方火光，云非野烧。总务司旧档尽迁于地窖，掌书者不告以所在。玉京台榜上旧文未去，新文又至，压之三层。"
 LYY_Event.110105.a:"兄弟阋墙！"
 LYY_Event.110201.t:"七星协力" # 和平线
LYY_Event.110201.d:"璃月斯土，有七星，素为万民所仰为导。然岁月更迭，外力侵逼，璃月际于政乱、财衰、兵危。值此紧要，七星共济，毅然以应此峻考。首者，于政务，七星识内团之力方能固邦御侮。频聚议，换谋略，务求共识；且互通消息，详审每策，兼采众议。又亲民听声，革故鼎新，整饬行政，得民心以增其势。次之，于经济，七星知富庶乃国基之本。共倡振兴之计，调优资源，劝创研，广贸途。商界之翘楚咸出其力，招外资，兴就业，以舒财困，璃月经济渐复元气。末及武备，七星明强军乃国家安危之盾。合众力，建联军，精诚协作，以保疆土。是故，七星并肩而战，内外兼修，以期渡此艰，重现辉煌。群玉阁连日灯彻夜，七人分坐一案，各持一牍，案上茶七盏，冷则易之。"
 LYY_Event.110201.a:"七星协力"

 LYY_Keqing_Revolutionary_Committee:"登楼调律天衡现" # 刻晴线 红色
 LYY_Keqing_Revolutionary_Committee_desc:"岩王帝君既崩，举市缟素，玉衡星刻晴独曰：此乃人治之机，失之不复。夫璃月之制，神在则人赖其扶，神去则制如朽柱，譬如跛者行于玉京台石阶，无杖则仆。凝光新政之败，已彰其验：百年旧制，非和平更革所能济，必以§t革命§!断之。刻晴乃出其蓝图：新制既立，则财货均输，人尽其才，昔者万政决于神明一谕，今者万政成于市井之议。其署在玉京台东，门无饰，惟悬木牌一，访者日数十，夜则灯不熄。市人闻之，或疑或惧，豪商闭户自守，仙人观望不语。刻晴曰：人不自救，孰能救之？于是七星光下，革命委员会立。总务司吏有投之者，携旧牍一箱，云新制之下，当以能授职，不以族。绯云坡茶肆中，日夜有人论其策，论久则争，争罢各散。§t高举启明之旗帜，追随玉衡星刻晴！§!"
 LYY_Event.12.t:"刻晴：就职演说"
LYY_Event.12.d:"诸位贤达，敬爱之百姓：今兹之日，吾以一介书生，怀启明之志，立于此处，陈就职之词，兼为讨贼之檄。启明者何？天下为公，人皆兄弟，物各得其宜，此千古圣贤所向往，亦吾辈所愿见。然世道无常，贼寇横行，欲毁吾邦基业，乱吾民心。故吾今日之言，非独就任之誓，实为讨奸之檄。吾誓引吾众，既追启明之梦，亦挥剑斩妖，以卫家国。吾等以铁石之心、雷霆之势，扫清祸国之徒。修明法度，整肃纲纪，使天下无不平之事，人间无冤屈之声。励精图治，兴利除弊，使百姓安居而共享太平。兴学育才，传道授业，使后生为栋梁，承启明之志。至于内外勾连、妄图颠覆社稷者，吾以法为剑，断其恶念，绝不宽贷。四方豪杰，共筑坚城，以御来犯。昔归离原上，先民刻石为约，言出而不反；今吾与诸君约，亦如彼石。玉京台之石，受万人之履而不损，吾愿吾法如之。诸君生于斯土，长于斯民，自当以身许国，鞠躬尽瘁。"
 LYY_Event.12.a:"刻晴万岁！"
 LYY_Keqing_Revolutionary_Committee_01:"民为邦本，政民所系"
 LYY_Keqing_Revolutionary_Committee_01_desc:"民主共和：推崇民为邦本，政为民所系，如春风化雨，润泽四方。民主选举，如同星辰之选，昭示民意；权力监督，犹如日月之鉴，洞察秋毫。 法治天下：法如山岳，稳固社稷；律如江河，涤荡尘埃。法治之光，照耀人心，确保公正无私，维护社会和谐。 "
 LYY_Event.1201.t:"平等新政，人民万岁"
LYY_Event.1201.d:"昔璃月之地，历久弥新，而封建之弊犹存。值此之际，璃月革命委员会之领袖刻晴秉持大道，振臂一呼，颁行新政，誓破陈规，倡平等正义。刻晴之令，如惊雷裂空，震撼朝野。其言曰：「凡我璃月子民，无论贵贱，皆享同等之权，受同等之尊。昔日封建之压，自今日始，尽数废止。」于是革委会诸贤同心协力，推翻旧制，重建新法。首重法制，废特权之律，立平等之纲。继行土地之改，使耕者有其田，劳者得其食。又设学堂以普教，启民智，消愚昧。至于劳动者之权益，亦得妥善之保，不复受欺凌。刻晴深谙：欲至平等之境，非独恃法度，必先革人心。故广布教化，劝百姓弃旧日之偏见，立新风，崇仁爱，倡和谐。遇有纷争，则以理服人，以德化人，不轻用武，以保社稷安宁。自令下，璃月风气焕然。昔日被压之民，今昂首挺胸，投身国事。玉京台榜下，有老匠抚榜而泣，云此生未见此语。"
 LYY_Event.1201.a:"天生万物以养人！"
 LYY_Keqing_Revolutionary_Committee_02:"公私兼顾，共享繁荣"
 LYY_Keqing_Revolutionary_Committee_02_desc:"经济政策 公私兼顾：公有制如泰山之稳，私有制如流水之活，二者相辅相成，共绘经济画卷。计划与市场，如同阴阳调和，相生相克，以达资源之最优配置。 均富共享：财富如泉涌，应遍洒人间，不分贵贱，共享繁荣。税收调节，犹如天平之衡，确保贫富均衡，社会稳定。"
 LYY_Event.1202.t:"经世济民，共建大同"
LYY_Event.1202.d:"璃月之地，物华天宝，人杰地灵。然经济之道，自古多舛，贫富悬殊，贵贱分明。值此变革之时，革委会之魁首刻晴洞察时弊，挥毫颁令，旨在革新经济，缔造大同。刻晴之令，如春风拂面，唤醒沉睡之土。其言曰：「吾辈当以公有为主，兼顾私利，构新型之经济。使财货之源，不为少数所独占，而为众人所共享。」于是诸贤协力，推行新政。首重产业之调，国有之资主关键之业，以保民生之基。同时劝民间之投，活市面之力，成公私互补之局。土地之改，使耕者有其田；工商之兴，使商者有其市。教育之普，启民智，育人才，为国之前途立基。刻晴深知经济之繁荣非一日可致，须循序而进，稳中求胜。故设监管之构，保市场之公平，防垄断之生。又行税赋之调，轻贫者之负，增富者之献，以达均衡。自令下，璃月经济气象更新。昔日贫富不均之象，渐次消散。南码头市集新立公秤三具，买卖者皆就之，无争。"
 LYY_Event.1202.a:"不是说先富带后富吗？"
 LYY_Event.120201.t:"璃月土地改革"
LYY_Event.120021.d:"璃月之境，繁华之后，地利不均，渐成疾患。刻晴，七星中之雷厉风行者也，决意兴革，欲行均田之制、土地国有之策，分田于农，期地利之公允，激农人之勤，固民生之本。然此议一出，璃月政坛波澜骤起。众官僚出身地主者，群起而攻，谓此举将撼其根基，损其既得。盖土地非独财源，亦系家族之荣耀与位望。彼等忧：一旦土地国有，非独经济之优不存，且恐失政坛之发言。刻晴面对异议，不为所动，益坚改革之心，任卯香菱为均田使。其深知公义之实，必直既得者之阻，勇进改革之步。乃广布均田之义，向璃月子民陈改革之要，言惟改革方能破地利之垄断，激农人之勤耕，以促璃月经济之繁。归离原农人闻之，持旧契至县署，一日投牒百余。地主之家则闭门聚议，灯至三更。"
 LYY_Event.120201.a:"官府与民争利啊！"
 LYY_Event.120202.t:"归离原副将马国成怒骂卯香菱"
LYY_Event.120022.d:"刻晴行均田之制，卯香菱为执行之先锋。彼深入田野，详察土地，力求改革之公与彻，遂引众多土地贵族之强不满。土地贵族久享地利之便，视土地为私有，不容他人染指。面对香菱铁腕之行，彼等心生怨怼，暗中串联，欲以百端阻之。一日，璃月国务会议之上，归离原副将马国成竟对卯香菱破口大骂曰：「卯香菱！尔本庖厨之贱，七星门下走狗，既已革职，何所凭而耀武？七品小吏，狗仗人势，不过攀玉衡之高枝耳。吾祖从帝君杀敌入关之日，已定子孙之富贵。尔欲均田乎？吾语尔：要田无有，要命亦无有！」座中皆失色。香菱不动声色，取案上田册一册，翻至归离原一页，指其数曰：「副将家田三千七百亩，册上止书二百。」马国成面色骤变，拂袖而去。"
 LYY_Event.120202.a:"太嚣张了！"
 LYY_Keqing_Revolutionary_Committee_03:"百花齐放，百家争鸣"
 LYY_Keqing_Revolutionary_Committee_03_desc:"百花齐放：文化如森林之茂，包容万象，各展风采。教育普及，犹如阳光普照，启迪智慧，培养人才。 传承创新：传统如古树之根，深深扎根；创新如新枝之芽，勃勃生机。二者并重，共促文化繁荣，引领时代潮流。"
 LYY_Event.1203.t:"育才兴邦，铸智启明"
LYY_Event.1203.d:"璃月之地，文风昌盛，然时势变迁，旧学不足以应新局。值此文化革新之际，革委会之英才刻晴高瞻远瞩，颁文化改革之令，旨在育才兴邦，铸智启明。刻晴之令，如春雷惊蛰，唤醒沉寂之土。其言曰：「教育为国之根基，科学为世之灯塔。吾辈当以教育为先，以科学为范，行三年之义务教育，启民智，育栋梁。」于是诸贤共谋，推行新政。首重教育之普，广设学府，不分贵贱，童叟皆可入学。课程之设，融古今，贯中西，以科学为核，弃迷信之说。师资之选，唯才是举，不拘一格。又劝学术之交流，奖创新之思，以科学之光，照璃月之前路。刻晴深知文化之兴在乎民心，故倡开放包容，兼收并蓄，取世界之先进，融本土之精华。又倡文艺之作，激民之自豪，富其精神。自令下，璃月文气一新。昔日蒙昧之民，今智慧渐开。学子勤学，匠人探理，文人挥毫。翘英庄私塾改为公学，门额新书四字：有教无类。"
 LYY_Event.1203.a:"如果老百姓有了知识文化，还怎么欺负他们！"
 LYY_Keqing_Revolutionary_Committee_04:"作风优良，能打胜仗"
 LYY_Keqing_Revolutionary_Committee_04_desc:"防御为本：军事如城墙之固，守卫家园，不主动挑衅。军民融合，如同江河入海，汇聚力量，提升国防实力。 和平利用：军工科技，和平转化，如火炼金，变废为宝，助力经济发展，造福民生。"
 LYY_Event.1204.t:"璃月人民军"
LYY_Event.1204.d:"璃月之地，虽久享和平，而时局动荡，野心家凝光等辈图谋不轨，欲挑内战之火。值此危难之际，革委会之英才刻晴洞察秋毫，颁军事改革之令，旨在铸人民军魂，御野心之敌。刻晴之令，如破晓之光，照于军心。其言曰：「军纪如铁，不可稍懈；工农为本，不可忘怀。吾辈当组璃月人民军，强军纪，固工农之认同，立士兵委员会，行驻军政治委员之制，以应内战之挑，保家国之安宁。」于是诸贤共谋，推行新政。首重军纪之整，严法纪，明赏罚，以正军风。士兵委员会之设，使基层官兵得预决策，凝聚之力与战之力皆增。政治委员之制既行，军心统一，行动一致，成为国家坚盾。刻晴深知军之强弱在乎人心，故倡爱国之教，激将士报国之情。又劝军事之训，提实战之能，以备不时。自令下，璃月军容一新。昔日散漫无纪之师，今纪律严明，士气高昂。天衡山营中晨操，鼓三通，千人一息，无一人出声。"
 LYY_Event.1204.a:"军队民兵，保家卫国"

 LYY_Ningguang_Provisional_Government:"星罗宿列天权临" # 凝光线 蓝色
 LYY_Ningguang_Provisional_Government_desc:"世出身寒微而至巨富者，璃月惟凝光一人耳。其起于采石之场，执秤于市，凡货殖之利，锱铢必较，不数年而富甲一方。旧族巨室把持港政百余年，凝光以新进之资，立新商，用新人，数载之间，旧族侧目。然彼不与旧族决裂，虚与委蛇，惟防民变与仙人之讥。彼常曰：官吏与自命不凡者，多感于情而昧于利，此璃月之弊也。故其视人皆以合同，凡恩怨亲疏，尽置于权衡之上，锱铢而量。群玉阁悬于云来海之上，阁中牍积如山，朱墨别其缓急。月海亭夜宴，宾客满座，凝光独居上座，听多而言少。或讥其无情，彼答曰：情不可量，利可量，可量者乃可信。璃月人循此道而行，方能穿雾破浪，直抵彼岸。"
 LYY_Event.13.t:"星罗宿列天权临"
LYY_Event.13.d:"诸位贤达，敬爱之同胞：今兹吉日，吾以商贾之身，立于此处，陈就职之词，兼为讨乱之檄。食货者，近世贤哲所倡之经济之学也。市自为主，贾自为竞，财货流通，此吾辈所愿见之繁荣。然世变难料，叛乱四起，欲毁吾民基业，乱吾民心。故吾今日之言，非独就任之誓，实为讨逆之檄。吾誓引吾众，既追财货之增，亦挥鞭策马，驱一切阻市易之乱。以诚信为本，以创新为魂，开商路之新，揭叛国乱政之恶。修明商法，保护产权，使天下无可疑之约，人间无可废之契。励精图治，劝其竞争，使百姓得分市易之利，共享繁荣。兴商育才，养企业之风，使为经济之驱，承食货之精。至于煽乱、妄图倾国者，吾以法为剑，断其逆念，绝不宽贷。四方商贾，共筑通商之城，以御犯境之敌。璃月港立市千年，秤有定式，斗有定容，藏于商会，岁一校之。南十字之舟，岁出岁还，未尝失期，此即信也。"
 LYY_Event.13.a:"谁人与我诛国贼！"
 LYY_Ningguang_Provisional_Government_01:"法如明镜，高悬于世"
 LYY_Ningguang_Provisional_Government_01_desc:"治术方略：首重个人之自由，崇奉民主制度与法制。国事分立政党，行代议之制，以保公民之政治权益，市井交易则允竞争之自由，以法治护持。"
 LYY_Event.1301.t:"资政新篇，国富民强"
LYY_Event.1301.d:"璃月临时政府之领袖凝光审时度势，颁政治改革之令，推行大商人、大工厂主治国，以期商工兴国。凝光之令，如春雷震震，唤醒沉睡之土。其言曰：「国之昌盛，赖于工商；民之富裕，源于实业。吾辈当尊大商人、大工厂主之智，用其能，推产业之升级，提国民之经济。」于是临时政府诸公共商国是，推行新政。首重产业之发，劝创新，优配置，提效率。又设专司，通工商界与政府，使政及各方。同时修法制，护知识产权，维公平之竞，以法保市面之序。凝光深知政之稳在乎民心，故倡开放包容，兼收并蓄，取世界之先进，融本土之特色。又倡公民之参，激社会之力，促民主之进。自令下，璃月气象一新。昔日闭塞保守之态，今开放进取。大商人、大工厂主与政府携手，共绘繁荣。黑岩厂新铸铁牌，书商工兴国四字，悬于厂门，匠人过者皆仰视。"
 LYY_Event.1301.a:"我的心境已经野兽化了！"
 LYY_Ningguang_Provisional_Government_02:"贸易为轴，货币为翼"
 LYY_Ningguang_Provisional_Government_02_desc:"经邦之策，崇尚自由之市场经济，视市场机制于资源分配中居决定之位。私人产权得保，奖励工商之士气与创新精神。"
 LYY_Event.1302.t:"贸易自由，财产神圣"
LYY_Event.1302.d:"璃月之地，素以商贸繁盛著称，然近年因种种规限，市井之气渐衰。值此之际，璃月临时政府之魁首凝光洞察时弊，决意革新，颁政改之令，震动朝野。凝光之令，首倡废一切贸易之束，纵昔日违禁之物，今亦得自由流通。此举意在破陈规，激市面之力，使商贾如鱼得水，货如潮涌。又令公有之企转私，以期提效增竞。更立私有财产之尊，不容侵犯，以安民心，促经济。或有疑者曰：「违禁之物流通，岂非助长不法？公转于私，岂非弱国家之控？」凝光答曰：「法无常法，时移世易。今日之禁，或为明日之宝。至于公私之辩，吾以为私营更能激人之潜能，使国财倍增。」又有赞者曰：「凝光此举，实大智大勇。废限如解枷锁，使经济得振。私有财产之护，乃安人心、促投资之本。」然改革之路非一帆风顺。凝光之策虽有远见，亦须慎思。违禁之开，须严密监管，以防滥竽。南码头关吏奉命撤榜，旧榜三十七张，卷而封之。"
 LYY_Event.1302.a:"风能进，雨能进，凝光不能进！"
 LYY_Ningguang_Provisional_Government_03:"多元融合，自由表达"
 LYY_Ningguang_Provisional_Government_03_desc:"文化方略，推行多元主义，尊崇个人言论之自由，且珍视知识财产权。媒体开明，务使信息流通，公论得以畅所欲言。"
 LYY_Event.1303.t:"媒体监督，言论自由"
LYY_Event.1303.d:"夫璃月之地，自古繁华，商贾云集，文风昌盛。然近日，临时政府之首凝光行事颇显独断。彼以国家安危为名，占璃月报社，欲以此控舆论之喉舌。此举一出，四方哗然，民心惶惶。凝光之令昭示天下曰：「今世风日下，人心不古，媒体之责，重于泰山。故特命加强媒体之督，以防奸邪之徒淆乱视听。」其言虽正，其行则疑。盖报社乃民间之所，言论之自由乃国之大典。凝光此举，无异以公权侵私域，以威势压民意。或曰：「凝光之心或出于公，然其术实属过激。若真欲清舆论，何不立法明章，而乃夺人之产、禁人之口？」又有人言：「媒体之督固不可少，然督之权亦须受制。不然，权无边际，必生腐败。」今璃月之民忧心忡忡，恐言论之自由不复。四方之士纷纷议论，或助凝光，以为国利至上；或非其行，以为侵公民之权。此情此景，实为璃月一大变局。报社工徒三十人，皆被逐出，立于街对面，无一去者。"
 LYY_Event.1303.a:"我说总座高见！"
 LYY_Ningguang_Provisional_Government_04:"联盟为重，平衡为要"
 LYY_Ningguang_Provisional_Government_04_desc:"军事方面，持防御态势，旨在维护国家之主权及国际和平秩序。联盟及多方机构，实为国家安全之合作途径。"
 LYY_Event.1304.t:"扩军备战，平定内乱"
LYY_Event.1304.d:"璃月之地，政局动荡，叛军四起。值此时机，临时政府之领袖凝光审时度势，颁军事改革之令，搜捕百姓，扩军伍，以图围剿叛军，复国家安宁。凝光之令，如雷霆万钧，震撼人心。其言曰：「国之存亡，在于兵戈；民之安危，在于平叛。吾辈当广纳壮士，壮军伍，以铁血之腕，镇叛乱，卫家国。」于是诸公共商国是，推行新政。首重征兵之制，搜青壮，编行伍，增国防之力。又设军事学院，自任校长，育将才，提军之质。同时固边防，严防叛军之渗，以保国家安全。凝光深知政之稳在乎民心，故倡严明法纪，赏罚分明，使军纪肃然而战力强。又倡爱国之教，激民之热，共御外侮。自令下，璃月气象一新。昔日内忧外患之态，今团结一心，共克时艰。军与民携手，共图和平。征兵之榜贴于各坊，赴者列队，自玉京台排至南码头。"
 LYY_Event.1304.a:"我要把精力主要放在军事上！"

 LYY_Yuehai_Pavilion_Alliance:"西狩获麟天华降" # 甘雨线 灰色
 LYY_Yuehai_Pavilion_Alliance_desc:"当此干戈将起之际，犹有人信璃月当以平稳之道行于未来，其人即半仙甘雨，月海亭之领袖，璃月政务之枢也。彼半人半仙，处两间而通两心：人之所欲，仙之所虑，皆了然于胸。又供职数百年，案牍之事，无不谙熟，深知调和乃璃月之福，相争则两伤。凡厌乱恶斗之士，无论官商，无论仙凡，皆集其麾下，以待其时。月海亭在璃月港高处，亭中案上牍分三色，朱者当日必毕。甘雨每议至夜，铃动则众散，惟其独留，秉烛披牍。仙凡之争方炽，两边皆有书致之，彼皆不答，惟批：容缓图之。§B为璃月众生之福祉，追随总秘书甘雨！§!"
 LYY_Event.14.t:"西狩获麟天华降"
LYY_Event.14.d:"诸位贤良，敬爱之臣民：今兹吉日，吾以守旧之身，抱帝君圣论之志，立于此处，陈就职之词，兼为讨乱之檄。帝君圣论者何？礼乐有序，尊卑有别，江山稳固，此古来圣王所循，亦吾辈所愿见。然世变多端，叛乱频生，欲破吾传统，乱吾纲常。故吾今日之言，非独就任之誓，实为讨异端之檄。吾誓引吾众，既守传统之根，亦挥戈返日，以镇挑战秩序者。以忠孝为本，以礼仪为纲，维护社会稳定，揭露离经叛道之恶。修明典章，巩固宗法，使天下有可循之规，人间有可效之范。励精图治，弘扬儒学，使百姓沐浴教化，共享安宁。兴文育才，传承经典，使人为国之栋梁，承圣论之精髓。至于煽动变革、妄图颠覆传统者，吾以刑为剑，断其乱念，绝不姑息。四方忠臣，共筑秩序之城，以御来犯之敌。月海亭旧牍三千卷，皆先代律令，吾已令抄其要，悬于廊下。轻策庄农人守其陂塘三世，未尝易法，此即守旧之实。"
 LYY_Event.14.a:"西狩获麟天华降"
 LYY_Yuehai_Pavilion_Alliance_01:"宗法为纲，礼乐为纪"
 LYY_Yuehai_Pavilion_Alliance_01_desc:"其政以分封为本，王侯将相，权柄独揽于数人之手。世分严阶，人之贵贱，生而有定，权利随其位而立。"
 LYY_Event.1401.t:"宗法礼制，治国安邦"
LYY_Event.1401.d:"月海亭联盟之领袖甘雨，洞察时局，深谙治国之道。值此风云变幻，甘雨颁政治改革之令，旨在强宗法、明礼制，以固国家之基，维社会之序。甘雨之令，如春雨润物，潜移默化。其言曰：「国之根本在于宗法，民之教化在于礼制。吾辈当弘传统，强宗族之纽，推礼仪之邦，以德治国，以礼安民。」于是联盟诸公共商国是，推行新政。首重宗法，明家族之伦，崇长幼有序、尊卑有别，以凝民心，固社会之基。又重礼制，定详尽之仪，自朝堂至民间，无不遵循，以彰文明，提国民之养。甘雨深知政之稳在乎民心，故倡仁爱宽厚，崇孝悌忠信，以激民内在之美，促社会之和。又倡节俭朴素，斥奢侈浪费，以养良风，惜物力。月海亭庭中旧碑三座，刻族规于上，字已半磨，甘雨命重摹之，立于原处。"
 LYY_Event.1401.a:"我们之间已经隔了一层可悲的厚障壁了！"
 LYY_Yuehai_Pavilion_Alliance_02:"农耕为主，工商为辅"
 LYY_Yuehai_Pavilion_Alliance_02_desc:"经济之策，倚赖田畴农业，封建地主与农夫之关系维系生产。土地面所属公，农夫或赁田耕作，或为奴仆于地主之家。"
 LYY_Event.1402.t:"废阡陌，建井田"
LYY_Event.1402.d:"月海亭联盟之首甘雨，近颁一令，倡复古井田之制。此令既出，如投石于静水，涟漪四起。夫井田者，古农耕之典范也，其法以九百亩之地为一井，八家共之，各得百亩，中央百亩为公田，八家共耕，所获归公。此制既见公平之意，又聚社群之力，实为治国安邦之良策。甘雨之倡，非独复古，实欲借此重塑社会之序，强集体之意。当今之世，物欲横流，人心浮躁，若归井田之制，或可缓贫富之悬，增邻里之和。然井田之复，非一日可成，须深思熟虑，审时度势。当广询民意，知民所愿所忧；须定详密之则，保新旧之平稳；须强宣教，使民解井田之精，自投身其中。甘雨此举虽有争议，而其勇于探试，可嘉也。轻策庄老农闻之，取旧契一纸示人，云其祖曾耕公田，契上犹有朱印。"
 LYY_Event.1402.a:"我觉得你有些太激进了！"
 LYY_Yuehai_Pavilion_Alliance_03:"诗书传家，礼乐之邦"
 LYY_Yuehai_Pavilion_Alliance_03_desc:"文化之术，官府推崇古训及宗教，以为镇抚人心、维系社会之工具。教化由上层操控，重在播扬忠顺与服从之义。"
 LYY_Event.1403.t:"书院制度，帝君思想"
LYY_Event.1403.d:"月海亭联盟之魁首甘雨，近发一谕，欲兴书院之制，以弘岩王帝君之教。谕下之日，士林竞传，以为数十年来未有之举。书院者，古之学府也，集贤纳士，传经授道，乃文脉所系。甘雨欲以此为基，弘帝君之思，使之入人心，为治国之本。岩王帝君之思，乃古帝王治国之道，重仁爱、礼义、智慧、勇敢，为安邦之精。甘雨此举，旨在借书院之建，育忠信之士，传优秀之文。书院之中，学子研经，讨论国事，修身齐家治国平天下，以铸一代有德之才。此举非独益于国民之德，亦增国家之凝聚与竞力。然书院之建非一日可成，须广纳贤才，精选教材，定严整之课。同时重实行与理论相济，使学子于学中悟帝君之思，化为行事之力。甘雨之令，实为国家长远之计。月海亭西偏旧屋十余间，已撤其壁，改为讲堂，梁上悬钟一，课始则鸣。"
 LYY_Event.1403.a:"这也太先进了！"
 LYY_Yuehai_Pavilion_Alliance_04:"兵马为重，边防为要"
 LYY_Yuehai_Pavilion_Alliance_04_desc:"军事之备，地方设民兵与骑士之师，以保封建统治，御外侵犯。"
 LYY_Event.1404.t:"八十万禁军"
LYY_Event.1404.d:"甘雨，月海亭之盟主也，智勇双全，深谋远虑。近日颁一令，欲建八十万禁军，以固中央之权。其意将各地精兵强将，尽纳于京师，以壮皇威。此举一出，四方震动，皆知甘雨之志不在小。甘雨又行新政，重文抑武，提文官之位。昔日武将飞扬跋扈，今则屈膝于文臣之下。文臣得势，朝堂议论纷纷，皆言甘雨此举乃欲以文治国，以求长治。更有甚者，甘雨遣心腹任监军之职，遍布各地。监军者，天子之耳目也，察诸将，防其叛。此策既出，武将无不战战兢兢，恐一言一行皆入监军之耳，传至甘雨之处。然此举亦非无弊。武将失势，心难免怨，或有暗流涌动，图谋不轨。文臣虽得宠，若无实才，亦难当大任。甘雨之政，一时得利，长远观之，或需更慎。甘雨之心，如渊不可测。其建禁军、重文臣、遣监军，皆为固己之位，防患未然。然天下之事变幻莫测，甘雨之计能否如愿，尚待时日。吾辈唯静观其变，以待天时。天衡山校场新立将台，台下石础八十，云按禁军之数。"
 LYY_Event.1404.a:"但愿没有白虎节堂！"

 LYY_Xianyun_Heavenly_Palace:"云之君兮纷来下" # 申鹤线 黑色
 LYY_Xianyun_Heavenly_Palace_desc:"帝君遇刺，凡人当政，政令频出而乱象愈滋，人治未尝予人自由，反添创痕。于是众仙会于绝云间，共议曰：岩王帝君之遗产，不可委于眼高手低之辈，任其败坏。议定，仙之追随者、帝君旧部、仙力所化之走兽、自动作战之金人，皆已部署完毕。申鹤白衣仗剑，立于仙家宫殿之前，誓曰：吾等起兵，非为夺位，乃为庇民。凡人当受庇护，免于世间之险，如婴儿之倚母。奥藏山云雾所锁，宫阙隐于其中，山径惟仙人可识。山下村镇有老者焚香北望，云仙家旌旗一日不倒，璃月一日不乱。§8复兴仙家盛世，追随仙使申鹤！§!"
 LYY_Event.15.t:"云之君兮纷来下"
LYY_Event.15.d:"诸位同仁，敬爱之国民：今兹吉日，吾以坚定之身，抱刑鼎之志，立于此处，陈就职之词，兼为讨奸之檄。刑鼎者何？国家至上，民族团结，秩序井然，此近世强权所倡，亦吾辈所愿见之强盛。然世路多艰，叛乱四起，欲毁吾国威，乱吾民心。故吾今日之言，非独就任之誓，实为讨内奸之檄。吾誓引吾众，既固国家之统一，亦挥剑斩棘，清一切破坏团结之乱。以忠诚为本，以纪律为魂，铸钢铁之志，揭分裂国家之恶。修明法令，强化集权，使天下无不可从之命，人间无不可行之令。励精图治，推行民族主义，使百姓凝聚而共享荣耀。兴武育才，锻造勇士，使为国家之盾矛，承刑鼎之精髓。至于煽乱、妄图倾国者，吾以铁腕为剑，断其逆念，绝不姑息。刑鼎既铸，置于璃月港市心，鼎腹刻令三十条，犯者书名于侧，刮之不去。"
 LYY_Event.15.a:"云之君兮纷来下"
 LYY_Xianyun_Heavenly_Palace_01:"独裁为尊，统制为纲"
 LYY_Xianyun_Heavenly_Palace_01_desc:"政略方略，偏于极端之民族主义与专制统治，常由雄强之领袖或党派执掌，禁抑异己政党，行警察之邦。"
 LYY_Event.1501.t:"二等人制"
LYY_Event.1501.d:"申鹤，三眼五显仙庭之尊也，权倾朝野，威震八方。近日申鹤下诏，立新制，倡仙人至上，凡人卑下，遂成二等之民。此令一出，天下哗然，仙凡之间，鸿沟顿生。申鹤之意，盖欲彰仙人之尊，以示天壤之别。仙人居高临下，凡人俯首称臣，等级森严。然此举激起凡间之怨，人心惶惶，皆惧仙人之威。更甚者，申鹤设秘警，名为维序，实则镇异议。秘警潜伏市井，耳目遍于四方，凡有异言者，即遭逮捕，严刑拷打，无所不用其极。民间风声鹤唳，人各自危，不敢妄议。申鹤之政，虽一时压民之口，然长此以往，必酿祸乱。凡人虽弱，众志成城，终有一日，积怨爆发，恐撼仙庭之基。申鹤若不审时度势，改弦更张，恐自食其果。吾辈观之，申鹤此举实为短视。仙凡本应和处，非对立相争。若能明察，废二等之制，散秘警，广开言路，方得民心，固仙庭之基业。否则风云一变，悔之晚矣。秘警之署设于旧盐仓，门无匾，出入者皆衣同色，市人见之辄避。"
LYY_Event.1501.a:"呜呼！国竟一至于此！"
 LYY_Xianyun_Heavenly_Palace_02:"军工优先，国家统筹"
 LYY_Xianyun_Heavenly_Palace_02_desc:"经制之策，国家干涉于经济，熔私有之业与公家之计于一体，藉战争之财，以兴工商业。"
 LYY_Event.1502.t:"闲云大酱"
LYY_Event.1502.d:"申鹤，三眼五显仙庭之尊，雄心勃勃，志在四方。近日申鹤下旨，擢闲云为将作大匠，专责军工与机关术，以图军之扩。闲云者，申鹤之师也，才智过人，深得信任。将作大匠之职，掌军械之造，任重。闲云领命，即召天下巧匠，共研新器与机关。彼等日夜操劳，铸铁炼钢，绘图设计，力求创新，以期成无敌之师。军工之事，申鹤尤重之。彼以为兵强马壮方能征四方，故不惜重金，以促军工之兴。机关术者，申鹤所好，以为此术可助军力倍增，故特命闲云深究，欲借此制胜千里。闲云不负所望，数月之间，便有成果。新器锋利，机关巧绝，皆为战场之利。申鹤闻讯大喜，扩张之志愈坚。黑岩厂昼夜不熄火，所出铁件皆运至将作监，途中以布覆之，不使人见。"
 LYY_Event.1502.a:"那个女人？"
 LYY_Xianyun_Heavenly_Palace_03:"民族为本，传统为范"
 LYY_Xianyun_Heavenly_Palace_03_desc:"教化之术，强固一元之国是，操纵教化生活，贬抑文化之多元，崇奉民族之统一与英雄之崇拜。"
 LYY_Event.1503.t:"璃月超人"
LYY_Event.1503.d:"三眼五显仙庭，领袖申鹤，洞察时局，深谙民气。值此国运方隆，申鹤颁文化改革之令，旨在宣仙人之美，倡仙人主义、璃月民族主义，逐异邦之人，以聚民心，振民族。申鹤之令，如秋风扫叶，肃清杂念。其言曰：「国之灵魂在于文化，民之归属在于民族。吾辈当崇仙人，弘仙人主义，推璃月民族主义，以逐外人，净国土。」于是仙庭诸公共商国是，推行新政。首重文宣，美仙人之形，推仙人之智，以激民之敬仰。又倡民族主义，明璃月民族之独特与优越，以增自豪。同时行排外之政，逐外国之人，以确保国土之纯。申鹤深知政之稳在乎民心，故倡忠诚爱国，崇团结一致，以激民之热，促民族之和。又倡自强不息，斥依赖外力，以养独立自主之气。璃月港外商行渐闭，招牌尽撤，有至冬商贾携货登舟而去，临行无一语。"
 LYY_Event.1503.a:"为什么要驱逐啊，肥皂厂就很缺人！"
 LYY_Xianyun_Heavenly_Palace_04:"征兵为重，备战为要"
 LYY_Xianyun_Heavenly_Palace_04_desc:"军事之道，崇尚武力，视战争之胜为邦国之荣光与存续之关键，务于领土扩张与势力增长。"
 LYY_Event.1504.t:"战胜则国强，战败则国弱"
LYY_Event.1504.d:"夫申鹤者，三眼五显仙庭之首也，其令下如雷霆，震慑四方。今兹申鹤颁军令，宣武道，以为战之胜乃国家荣耀所系，亦社稷长存之要枢。故其志在拓土开疆，增国威，使仙庭之势如日中天。申鹤之言曰：「兵者，国之大事，死生之地，存亡之道，不可不察也。」是以仙庭之内，无不以武备为重，士卒操练不懈，将领谋略无遗。申鹤又云：「战则国强，败则国弱，故必以胜为荣，以败为耻。」是以仙庭之民皆怀报国之心，愿效死力于沙场。校场之上，晨鼓三通，弓手百人齐发，矢落如雨。有老卒解甲归田十年，闻令复起，云刀未锈。军中新立赏格，斩一级者赐田十亩，众皆踊跃。将作监所铸新刀，试之断牛骨三截，刃无缺。仙庭榜下聚少年千数，争投名籍。"
 LYY_Event.1504.a:"八纮一宇，七生报国！"

 LYY_Nation_New_Liyue:"迫近的客星" # 统一后新璃月国策树 A New Star Approaches
 LYY_Nation_New_Liyue_desc:"夫客星者，天之异象也。昔有客星迫近，其事甚奇。时值夜半，万籁俱寂，余独坐斗室，秉烛夜读。忽闻窗外有异响，如风过竹林，又似水击礁石，心中颇觉惊异。遂起身推窗而望，但见繁星满天，月华如练，然有一星，光芒灼灼，迥异于众星，正自天际缓缓迫近。此星初现时，尚在天之极北，其光微弱，若隐若现，似羞涩少女，犹抱琵琶半遮面。然其势甚疾，不片刻，已至天心。其光渐盛，如烛火添油，又似明珠出匣，熠熠生辉，直欲与明月争辉。余观之，心中骇然，不知此星何来，又欲何往。俄而，客星迫近至极，几欲坠于屋檐。其光刺目，不可直视，余只得以手遮面。此时，但觉天地间似有异动，微风忽起，吹得窗纸沙沙作响，似有无形之力，自客星处汹涌而来。余心中愈惊，只恐此星坠落，祸及人间。然客星至近处，忽又止步。其光渐敛，复如初见时之微弱，缓缓向天际退去。余屏息凝神，目送其远，直至其消失于茫茫天际，方敢出声。是夜，余辗转反侧，不能成寐，思此客星之异，竟不知其为何物，亦不知其来去之因，惟觉此乃天之大奇，人间罕有之异象也。"
 LYY_Event.16.t:"帝君遇刺的真相"
LYY_Event.16.d:"帝君遇刺之案未决，往生堂客卿钟离检古籍《玑衡经》，得一说，名曰磨损。磨损者，言生物历岁既久，或经事变，其精神渐衰而变。其征有二：一曰记忆与情感渐失，二曰心智理性俱损，至与野兽无异。此非形体之坏，实精神情感之耗也。昔若陀龙王即坐此失其与帝君并肩征战之忆，亦失护璃月港之约，遂发狂作乱。世所知者，岩王帝君在世间已六千余岁，其与仙人共立璃月，亦三千七百年前事。漩涡不能碎之磐岩，亦为时光所磨。帝君惟日日自解，谓裂纹未至而已。然以最初七神、勤劳爱民之尘世执政，帝君已逼近磨损之临界，遂于此次请仙典仪上遭不测。然帝君为最古之魔神，必不无所备。钟离言毕，取案上石一片，以指摩之，石屑纷落，云：石犹如此，况血肉之躯。"
 LYY_Event.16.a:"念天地之悠悠，独怆然而涕下！"
 LYY_We_Will_Be_Reunited:"我们终将重逢"
 LYY_We_Will_Be_Reunited_desc:"吾与诸友，情谊甚笃。昔年同游蒙德，共御风魔龙；往昔并肩璃月，齐解七星谜。然世事无常，诸友皆散，各赴天涯。岁序更新，吾独行于稻妻，念及往昔，不胜唏嘘。忽闻故友音讯，心喜若狂。思及重逢之景，或于清籁岛畔，共赏海天一色；或于离岛之上，再续往日欢颜。虽前路多艰，电闪雷鸣，然念及重逢，吾心无畏。待至重逢之日，当与诸友，畅饮佳酿，共话桑麻。诉别后之思，忆往昔之乐。虽知重逢后，又将别离，然此情此谊，永铭心间。愿诸友安好，待他日再聚，历世间奇缘。"
 LYY_We_Will_Be_Reunited_II:"我们终将重逢"
 LYY_We_Will_Be_Reunited_II_desc:"吾与诸友，情谊甚笃。昔年同游蒙德，共御风魔龙；往昔并肩璃月，齐解七星谜。然世事无常，诸友皆散，各赴天涯。岁序更新，吾独行于稻妻，念及往昔，不胜唏嘘。忽闻故友音讯，心喜若狂。思及重逢之景，或于清籁岛畔，共赏海天一色；或于离岛之上，再续往日欢颜。虽前路多艰，电闪雷鸣，然念及重逢，吾心无畏。待至重逢之日，当与诸友，畅饮佳酿，共话桑麻。诉别后之思，忆往昔之乐。虽知重逢后，又将别离，然此情此谊，永铭心间。愿诸友安好，待他日再聚，历世间奇缘。"
 LYY_Event.17.t:"终归一统"
LYY_Event.17.d:"天下扰攘，群雄角逐，璃月之地亦不能独免。经烽火淬炼，始见曙光。新璃月国立，黎庶闻之，莫不额手称庆。新邦之立，类凤凰浴火，更生而辉煌。其言曰：「邦之盛衰，在乎统一；民之休戚，系于安宁。我辈宜捐弃前隙，共构宏图，以期国泰民安。」于是公卿聚议，实施新政。首崇法治，立宪典章，整肃邦治，以保公义。复重教化，普施知术，启民智慧，育成俊才。并开发工商，惠泽民生，增庶众生活之质。新璃月深知政局之固在乎人心，故倡宽容和睦，崇团结互助，以激国民共建家邦之志。又扬勤劳革新，斥怠惰守旧，以为进取之源、邦国迈进之驱。自新邦肇基，黎庶沐浴煦风，生计日臻美好。昔时烽烟四起，今朝安泰熙和，国富兵强。璃月港码头新立旗杆三，升旗之日，老渔户立于最前，云六十年未见此景。玉京台榜廊尽易新榜，旧榜卷而藏之，云留与后人看。"
 LYY_Event.17.a:"人间正道是沧桑！"

