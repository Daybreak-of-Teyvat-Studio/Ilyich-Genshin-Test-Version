 YUG_idea_croatian_opposition_desc:0 "クロアチアの政治代表は王国の連邦機構化を強く要求している。彼らの要求が満たされない限り、中央政府のあらゆる動きに対して反対を続けるだろう。また、時が来たと思えば、反乱を起こすかもしれない。"
