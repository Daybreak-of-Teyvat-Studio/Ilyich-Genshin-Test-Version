 SUM_Neo.211.t:"赤王军团"
 SUM_Neo.211.d:"赤王军团成军，队伍里多是沙漠里的佣兵。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。"
