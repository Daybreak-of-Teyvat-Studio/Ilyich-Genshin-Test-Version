 SUM_Neo.107.t:"学者共和"
 SUM_Neo.107.d:"大贤者的议事厅被推开。学者、商人、沙漠的守村人一同走进来，要求给须弥换一部律法。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。"
 SUM_Neo.107.a:"推进议会的议程"
 SUM_Neo.107.b:"把权柄交还民间"
 SUM_Neo.108.t:"生论派的请愿"
 SUM_Neo.108.d:"生论派递上请愿，要求把雨林的研究权还给巡林官。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。"
 SUM_Neo.108.a:"按学派议决行事"
 SUM_Neo.108.b:"听从乡野的呼声"
 SUM_Neo.109.t:"素论派的天文"
 SUM_Neo.109.d:"素论派把观星的账目摊开，账目比星图更难看。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。"
 SUM_Neo.109.a:"以律法为绳"
 SUM_Neo.109.b:"以人情为度"
 SUM_Neo.110.t:"知论派的实验室"
 SUM_Neo.110.d:"知论派的实验室对外开放，成果不再锁进密室。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。"
 SUM_Neo.110.a:"推进议会的议程"
 SUM_Neo.110.b:"把权柄交还民间"
 SUM_Neo.111.t:"明论派的典籍"
 SUM_Neo.111.d:"明论派整理典籍，把禁书令下的残卷重新编目。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。教令院的门槛这几天被踩得很低，进去的人比出来的人多。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。"
 SUM_Neo.111.a:"按学派议决行事"
 SUM_Neo.111.b:"听从乡野的呼声"
 SUM_Neo.112.t:"因论派的追问"
 SUM_Neo.112.d:"因论派开始追问大贤者的权限从何而来。高塔投下的影子越来越长，傍晚时就盖住了半条街。教令院的门槛这几天被踩得很低，进去的人比出来的人多。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。"
 SUM_Neo.112.a:"以律法为绳"
 SUM_Neo.112.b:"以人情为度"
 SUM_Neo.113.t:"妙论派的图纸"
 SUM_Neo.113.d:"妙论派拿出图纸，说须弥的房子该按人的身量来盖。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。"
