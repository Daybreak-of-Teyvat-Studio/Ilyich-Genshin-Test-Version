 #### 乙线 · 学者城邦 ####
 SUM_SGS_RB_The_Scholar_Cities:"学者城邦"
 SUM_SGS_RB_The_Scholar_Cities_desc:"矫论团守着经卷，也守着路与水。有人主张把沙丘腰带的城邦建成学者的城邦：议事、立律、办学、通商，让经义落地成能过日子的规矩。"
 SUM_Neo_SGS.91.t:"学者城邦"
 SUM_Neo_SGS.91.d:"矫论团守着经卷，也守着路与水。有人主张把沙丘腰带的城邦建成学者的城邦：议事、立律、办学、通商，让经义落地成能过日子的规矩。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGS.91.a:"把土地分给部族"
 SUM_Neo_SGS.91.b:"把土地归入官仓"
 SUM_SGS_RB_City_Charter:"城邦宪章"
 SUM_SGS_RB_City_Charter_desc:"每处城邦立一份宪章，写明公事由谁议、谁办、谁查。"
 SUM_Neo_SGS.92.t:"城邦宪章"
 SUM_Neo_SGS.92.d:"每处城邦立一份宪章，写明公事由谁议、谁办、谁查。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGS.92.a:"推举公议的执事"
 SUM_Neo_SGS.92.b:"沿用旧日的长老"
 SUM_SGS_RB_Council_Hall:"议事厅"
 SUM_SGS_RB_Council_Hall_desc:"议事厅的门朝集市开，谁都能进去旁听。旁听的人多了，说话就谨慎了。"
 SUM_Neo_SGS.93.t:"议事厅"
 SUM_Neo_SGS.93.d:"议事厅的门朝集市开，谁都能进去旁听。旁听的人多了，说话就谨慎了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGS.93.a:"让花神的誓约作证"
 SUM_Neo_SGS.93.b:"让官署的法度作证"
 SUM_SGS_RB_Citizen_Roll:"民籍"
 SUM_SGS_RB_Citizen_Roll_desc:"把各城的人逐个登记，谁本地谁外来一册可查。"
 SUM_Neo_SGS.94.t:"民籍"
 SUM_Neo_SGS.94.d:"把各城的人逐个登记，谁本地谁外来一册可查。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGS.94.a:"与雨林互通有无"
 SUM_Neo_SGS.94.b:"与雨林划清界限"
 SUM_SGS_RB_Elected_Steward:"公推执事"
 SUM_SGS_RB_Elected_Steward_desc:"执事由城里公推，任三年，任满不得连任。"
 SUM_Neo_SGS.95.t:"公推执事"
 SUM_Neo_SGS.95.d:"执事由城里公推，任三年，任满不得连任。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGS.95.a:"把土地分给部族"
 SUM_Neo_SGS.95.b:"把土地归入官仓"
 SUM_SGS_RB_Limits:"限权之法"
 SUM_SGS_RB_Limits_desc:"在任者不得经商、不得占水，规矩立得细，破得也难。"
 SUM_Neo_SGS.96.t:"限权之法"
 SUM_Neo_SGS.96.d:"在任者不得经商、不得占水，规矩立得细，破得也难。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SGS.96.a:"推举公议的执事"
 SUM_Neo_SGS.96.b:"沿用旧日的长老"
 SUM_SGS_RB_Academy_Dune:"沙丘学馆"
 SUM_SGS_RB_Academy_Dune_desc:"学馆教算术、地理、律例，也教古沙漠文。"
 SUM_Neo_SGS.97.t:"沙丘学馆"
 SUM_Neo_SGS.97.d:"学馆教算术、地理、律例，也教古沙漠文。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGS.97.a:"让花神的誓约作证"
 SUM_Neo_SGS.97.b:"让官署的法度作证"
 SUM_SGS_RB_Scripture_Open:"经卷公开"
 SUM_SGS_RB_Scripture_Open_desc:"矫论团把经卷抄了很多份，分发到各处水驿。"
 SUM_Neo_SGS.98.t:"经卷公开"
 SUM_Neo_SGS.98.d:"矫论团把经卷抄了很多份，分发到各处水驿。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGS.98.a:"与雨林互通有无"
 SUM_Neo_SGS.98.b:"与雨林划清界限"
 SUM_SGS_RB_Scribe_School:"书记之教"
 SUM_SGS_RB_Scribe_School_desc:"教人写字，是矫论团最看重的一门课。会写字的比会打仗的稀罕。"
 SUM_Neo_SGS.99.t:"书记之教"
 SUM_Neo_SGS.99.d:"教人写字，是矫论团最看重的一门课。会写字的比会打仗的稀罕。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGS.99.a:"把土地分给部族"
 SUM_Neo_SGS.99.b:"把土地归入官仓"
 SUM_SGS_RB_Press_Dune:"抄书坊"
 SUM_SGS_RB_Press_Dune_desc:"抄书坊把宪章与律例抄了很多份，贴在各处水驿。"
 SUM_Neo_SGS.100.t:"抄书坊"
 SUM_Neo_SGS.100.d:"抄书坊把宪章与律例抄了很多份，贴在各处水驿。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGS.100.a:"推举公议的执事"
 SUM_Neo_SGS.100.b:"沿用旧日的长老"
 SUM_SGS_RB_Script_Study:"释读古文字"
 SUM_SGS_RB_Script_Study_desc:"会古沙漠文的人凑在一处，把散在沙子里的字一块块认回来。"
 SUM_Neo_SGS.101.t:"释读古文字"
 SUM_Neo_SGS.101.d:"会古沙漠文的人凑在一处，把散在沙子里的字一块块认回来。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGS.101.a:"让花神的誓约作证"
 SUM_Neo_SGS.101.b:"让官署的法度作证"
 SUM_SGS_RB_Fair_Toll:"公开税则"
 SUM_SGS_RB_Fair_Toll_desc:"税则刻在碑上立在水驿门口，谁交多少自己算得出。"
 SUM_Neo_SGS.102.t:"公开税则"
 SUM_Neo_SGS.102.d:"税则刻在碑上立在水驿门口，谁交多少自己算得出。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SGS.102.a:"与雨林互通有无"
 SUM_Neo_SGS.102.b:"与雨林划清界限"
 SUM_SGS_RB_Open_Market:"开市通商"
 SUM_SGS_RB_Open_Market_desc:"集市不分内外，外邦商队来得比往年多。"
 SUM_Neo_SGS.103.t:"开市通商"
 SUM_Neo_SGS.103.d:"集市不分内外，外邦商队来得比往年多。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。账房一直亮着灯。"
 SUM_Neo_SGS.103.a:"把土地分给部族"
 SUM_Neo_SGS.103.b:"把土地归入官仓"
 SUM_SGS_RB_Trade_House:"商行合办"
 SUM_SGS_RB_Trade_House_desc:"几家大商户合设商行，专营外邦贸易，账目公开。"
 SUM_Neo_SGS.104.t:"商行合办"
 SUM_Neo_SGS.104.d:"几家大商户合设商行，专营外邦贸易，账目公开。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。"
 SUM_Neo_SGS.104.a:"推举公议的执事"
 SUM_Neo_SGS.104.b:"沿用旧日的长老"
 SUM_SGS_RB_Caravan_Insure:"商队互保"
 SUM_SGS_RB_Caravan_Insure_desc:"商队合出一笔保银，路上出事照赔。赔了几回，路反而太平。"
 SUM_Neo_SGS.105.t:"商队互保"
 SUM_Neo_SGS.105.d:"商队合出一笔保银，路上出事照赔。赔了几回，路反而太平。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
