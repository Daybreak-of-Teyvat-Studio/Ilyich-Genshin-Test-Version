 SOV_sevastopol_marine_plant:0 "セヴァストポリ海洋工場"
 SOV_shipyard_staff_purged:0 "造船所作業員の粛清"
 SOV_shipyard_staff_purged_desc:0 "海軍におけるサボタージュやその他の疑わしき活動の多数の疑惑に対する大規模な捜査の後、NKVDは大勢の逮捕を行って造船所や海軍基地のいくつかは深刻な人手不足となっている。"
 SOV_shocked_by_surprise_attack:0 "奇襲攻撃の衝撃"
 SOV_shocked_by_surprise_attack_cant_join_factions_tt:0 "ルールを設定: £trigger_no派閥への参加が可能になる。"
 SOV_shocked_by_surprise_attack_desc:0 "我が国に対する敵の軍事作戦、コードネーム 「カウンタナンス作戦」 は我が国の政府と軍を驚かせた。我が軍は圧倒され、通信は遮断され、説明を要求するために敵の外交官を呼び出すことは無駄であることは分かっている。この大混乱を解決しようとしている間、我が国の外交関係は事実上中立化されている。"
 SOV_siberian_lessons:0 "シベリアの訓練"
 SOV_soviet_advisors_spr:0 "ソビエト軍事顧問団"
 SOV_soviet_advisors_spr_desc:0 "ファシズムや反動的な反革命主義に対する我々の戦いを支援するため、[SOV.GetNameDef]から軍事顧問やその他熟練の軍人が到着した。"
