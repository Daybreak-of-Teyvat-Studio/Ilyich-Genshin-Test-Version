 SUM_Neo.46.t:"花神之舞"
 SUM_Neo.46.d:"花神之舞重新编排，舞者从雨林与沙漠一同选出。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。"
