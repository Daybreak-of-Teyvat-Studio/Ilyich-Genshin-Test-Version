 NAT_Dissent_Decisions:"六部析宗"
 NAT_Dissent_Decisions_desc:"火神恩情跌至谷底，六部遂不复听命于焱庭。每部分宗各有三阶，须先启异议国策树上该部首策，方得言自治之请；若果真分宗，列国风闻必至，其时议和耶，抑以兵戈复归一统耶？§R需要：火神的恩情低于 30§!"
 NAT_Dissent_Step1_tt:"§R火神的恩情 −5§! §Y本部族取得自治议价权§!"
 NAT_Dissent_Step2_tt:"§R火神的恩情 −5§! §Y本部族撤去驻防、只守自治境§!"
 NAT_Dissent_Step3_tt:"§R火神的恩情 −5§! §Y本部族解除附属，宣告分宗§!"
 NAT_Dissent_NCP_Overture:"§Y沃陆之邦§! · 提出自治诉求"
