 ITA_regio_esercito_alt_dynamic_modifier:0 "イタリア陸軍"
 ITA_regio_esercito_alt_dynamic_modifier_desc:0 "$ITA_regio_esercito_dynamic_modifier_desc$"
 ITA_regio_esercito_dynamic_modifier:0 "王国陸軍"
 ITA_regio_esercito_dynamic_modifier_desc:0 "イタリア軍は第一次世界大戦で戦い、勝者の側に立ったが、軍の近代化においてはこれまで遅れを取る形になっていた。近代に適合することで軍隊の強化を達成できれば、常に勝者であり続けられるだろう。"
 ITA_ricostruzione_industriale_dynamic_modifier:0 "産業改革"
 ITA_ricostruzione_industriale_dynamic_modifier_desc:0 "世界大恐慌以降、自国の産業を救おうと努めてきた我々の判断は正しかったことが証明された。国内の産業力にこれまで以上の投資をすることで、イタリアの生産力はすぐにでも各大国と肩を並べるものとなるだろう。"
