 #####################
 DOT_Palace:"执政厅"
 DOT_Palace_desc:"统摄邦国政务之中枢，厅阁威严而廊庑通达。政令法度自此而颁，如经纬纵横，维系一邦之纲纪。"
 LYY_Palace:"玉京台"
 LYY_Palace_desc:"璃月七星与仙众会盟议政之所，耸立于港城之巅，俯瞰万商云集。契约精神于此昭彰，岩王余韵犹存栋梁之间。"
 MOT_Palace:"西风堂"
 MOT_Palace_desc:"西风骑士团治所，风神眷顾之地。堂宇不设高墙，清风常伴琴声，象征蒙德自由无拘之精神。"
 INA_Palace:"天守阁"
 INA_Palace_desc:"稻妻雷电将军威权之象征，巍峨矗立于鸣神岛之央。雷霆笼罩，樱瓣飘零，永恒之威仪尽显于此。"
 SUM_Palace:"智慧宫"
 SUM_Palace_desc:"须弥教令院核心圣所，草木智慧汇聚之地。殿内藏书如林，虚空真理交织，乃提瓦特智慧结晶之所。"
 FON_Palace:"沫芒宫"
 FON_Palace_desc:"枫丹最高审判机构所在，水神司掌正义之殿堂。洁白建筑屹立瀑城之巅，律典与歌剧在此共鸣。"
 NAT_Palace:"圣火殿"
 NAT_Palace_desc:"纳塔战神信仰中心，熔岩与荣耀交织之所。殿内圣火永燃，战歌回荡，彰显火之国度不屈意志。"
 NDK_Palace:"霜月宫"
 NDK_Palace_desc:"挪德卡莱月神司夜之居所，静谧与月光交融之境。宫宇隐于永夜，星辰为饰，守护万物安眠。"
 SNE_Palace:"至冬堡"
 SNE_Palace_desc:"至冬国凛冬宫阙，冰神怜爱众生之象征。寒冰殿堂庄严雄伟，于风雪中庇护万千子民。"
