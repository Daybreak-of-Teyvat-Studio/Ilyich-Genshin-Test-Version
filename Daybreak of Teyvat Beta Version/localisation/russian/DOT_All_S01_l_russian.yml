DOT_Industry:0 "Уровень промышленного развития"          #工业
DOT_Government_Industry1:0"Зарождение индустрии"
DOT_Government_Industry1_desc:0"Уровень промышленности: [?Industry_development_var|=+0]\nМесячный прирост: [?Industry_development_monthly_effect|=+0]\nПромышленность практически отсутствует, производство кустарное, спрос превышает предложение."
DOT_Government_Industry2:0"Начальная индустриализация"
DOT_Government_Industry2_desc:0"Уровень промышленности: [?Industry_development_var|=+0]\nМесячный прирост: [?Industry_development_monthly_effect|=+0]\nС помощью технологий из Шнежной и Фонтейна построены первые заводы, но производство нестабильно из-за нехватки ресурсов и спроса."
DOT_Government_Industry3:0"Связанные цепочки"
DOT_Government_Industry3_desc:0"Уровень промышленности: [?Industry_development_var|=+0]\nМесячный прирост: [?Industry_development_monthly_effect|=+0]\nПромышленность процветает, цепочки замкнуты, экономика растёт."
DOT_Government_Industry4:0"Процветающие цепочки"
DOT_Government_Industry4_desc:0"Уровень промышленности: [?Industry_development_var|=+0]\nМесячный прирост: [?Industry_development_monthly_effect|=+0]\nПромышленность так развита, что товары доступны всем. Молодёжь не знает бедности и ностальгирует по «жизни без фабрик»."
DOT_Government_Industry5:0"Индустриальный рассвет"
DOT_Government_Industry5_desc:0"Уровень промышленности: [?Industry_development_var|=+0]\nМесячный прирост: [?Industry_development_monthly_effect|=+0]\n«Папа, почему иностранцы мёрзнут и разводят огонь?»\n§YЗдесь начинается рассвет Тейвата.§!\nЗдесь применяются передовые технологии, и товары текут рекой, питая даже соседние страны."
#农业
DOT_Agriculture:0 "Уровень сельского хозяйства" 
DOT_Government_Agri1:0"Охота и собирательство"   
DOT_Government_Agri1_desc:0"Уровень сельского хозяйства: [?agricultural_development_var|=+0]\nМесячный прирост: [?agricultural_development_monthly_effect|=+0]\n«Срубил бамбук, сделал лук, стреляй, беги за добычей».\nСельское хозяйство почти отсутствует, пропитание добывается охотой и собирательством."
DOT_Government_Agri2:0"Подсечно-огневое земледелие"
DOT_Government_Agri2_desc:0"Уровень сельского хозяйства: [?agricultural_development_var|=+0]\nМесячный прирост: [?agricultural_development_monthly_effect|=+0]\nТехнологии отсталые, используется примитивное земледелие, отнимающее много сил."
DOT_Government_Agri3:0"Сельская идиллия"
DOT_Government_Agri3_desc:0"Уровень сельского хозяйства: [?agricultural_development_var|=+0]\nМесячный прирост: [?agricultural_development_monthly_effect|=+0]\nКрестьянское хозяйство — основа жизни, но крестьяне консервативны и не используют передовые технологии."
DOT_Government_Agri4:0"Интенсивные фермы"
DOT_Government_Agri4_desc:0"Уровень сельского хозяйства: [?agricultural_development_var|=+0]\nМесячный прирост: [?agricultural_development_monthly_effect|=+0]\n«Папа, смотри, ветряное крыло!» «С дороги, он распыляет удобрения!»\nИспользование удобрений Дендро и тракторов повышает эффективность, высвобождая рабочую силу для промышленности."
DOT_Government_Agri5:0"Сельскохозяйственный рассвет"
DOT_Government_Agri5_desc:0"Уровень сельского хозяйства: [?agricultural_development_var|=+0]\nМесячный прирост: [?agricultural_development_monthly_effect|=+0]\n«Папа, у иностранцев нет еды, почему они не едят пирожные?»\n§YЗдесь начинается рассвет Тейвата.§!\nПередовые технологии и организация обеспечивают изобилие, жители не знают голода, а магазины рекламируют «натуральные» продукты."
#军事
DOT_Construction:0 "Уровень армии"
DOT_Government_Army1:0"Сброд"
DOT_Government_Army1_desc:0"Уровень армии: [?Army_development_var|=+0]\nМесячный прирост: [?Army_development_monthly_effect|=+0]\n"
DOT_Government_Army2:0"Едва сформированная армия"
DOT_Government_Army2_desc:0"Уровень армии: [?Army_development_var|=+0]\nМесячный прирост: [?Army_development_monthly_effect|=+0]\n"
DOT_Government_Army3:0"Организованная армия"
DOT_Government_Army3_desc:0"Уровень армии: [?Army_development_var|=+0]\nМесячный прирост: [?Army_development_monthly_effect|=+0]\n"
DOT_Government_Army4:0"Закалённая в боях армия"
DOT_Government_Army4_desc:0"Уровень армии: [?Army_development_var|=+0]\nМесячный прирост: [?Army_development_monthly_effect|=+0]\n"
DOT_Government_Army5:0"Стальная дисциплина"
DOT_Government_Army5_desc:0"Уровень армии: [?Army_development_var|=+0]\nМесячный прирост: [?Army_development_monthly_effect|=+0]\n§Y«Пусть высший гнев, как волна, прокатится!»§!\nЭта армия бесстрашна и дисциплинирована, каждый знает, за что воюет, и готов умереть. Даже обладатели Глаза Бога пасуют перед ней."
DOT_Government_Army6:0"Единство"
DOT_Government_Army6_desc:0"§Y«Вставайте, не желающие быть рабами!»§!\nВоенная демократия, единство, смелые солдаты и передовая тактика творят чудеса. Даже трое солдат способны планировать бой. Они — герои, а не пешки."
#科研
DOT_Research:0 "Уровень исследований"
DOT_Government_Research1:0"Отсутствие учёных"
DOT_Government_Research1_desc:0"Уровень исследований: [?Research_development_var|=+0]\nМесячный прирост: [?Research_development_monthly_effect|=+0]\nИз-за отсталого образования почти нет учёных, наука зависит от случайных озарений и заимствований."
DOT_Government_Research2:0"Отсутствие институтов"
DOT_Government_Research2_desc:0"Уровень исследований: [?Research_development_var|=+0]\nМесячный прирост: [?Research_development_monthly_effect|=+0]\nУчёные работают в одиночку, нет координации, многие открытия не находят применения."
DOT_Government_Research3:0"Сформированная система"
