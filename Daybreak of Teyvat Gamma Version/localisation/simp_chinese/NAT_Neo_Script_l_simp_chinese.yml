 NAT_Nightwind_Riddle_Oath_Idea:"谜誓立约"
 NAT_Nightwind_Riddle_Oath_Idea_desc:"烟谜主立誓，不用寻常话，须以谜语作答。誓堂上，老祭司出一谜：「何物越洗越黑？」一后生脱口答「水」，老祭司摇头，示意再想。旁一年长者答「灰」，老祭司点头。那后生涨红脸，犹欲再答，老祭司指门口：「答错者，自行离开，不许争。」后生不服，却亦只得悻悻退出。轮到末一个，乃沉默寡言之后生，不言，只于地上以炭画一圈，复在圈内点一点。老祭司视之半晌，忽笑，将手中表誓之谜签递他。众人散去后，老祭司犹看地上那圈，末了以脚抹去。"
