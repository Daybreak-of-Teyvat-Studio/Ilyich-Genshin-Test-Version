 # 65. 召开抗深渊战争会议  country_event = {  id = NAT_Event.65 }
 NAT-ABY-Index_GT_0:"§R深渊侵蚀度大于0§!"
 NAT-ABY-Index_LT_0:"§G深渊侵蚀度小于0§!"
 NAT_ABY_POWER:"深渊蔓延"
 NAT_NAT_POWER:"渊蚀尽散"
 NAT_ABY_POWER_desc:"漆黑深渊之力自地脉深处一股一股翻上，日夜啃着夜神之国的根。圣火之光一日一日，蚀得发暗。各部族地面上，接连裂开深渊界门，魔物在火山与峡谷间横行。纳塔地脉正一点一点染黑，大灵气力越来越弱，还魂诗也快护不住人。这片以火与角逐立约的盟地，正一寸一寸往那没有尽头的黑里坠。深渊侵蚀度：[?NAT-ABY-Index]。"
 NAT_NAT_POWER_desc:"作乱的深渊黑气终于散尽，被染污的地脉重又清亮，夜神之国身上裂口慢慢长好，圣火再度烧得通红。深渊界门一扇一扇闭上，魔物嚎叫也没了声息，各族土地重新有了活气，大灵之佑又罩回纳塔。火之国度的荣光，就在这片重新燃起的烈焰里再一次绽开。深渊侵蚀度：[?NAT-ABY-Index]。"
 NAT_decisions-01:"深渊日侵"
 NAT_decisions-01_desc:"深渊对纳塔的侵蚀，绵延千年。头一笔当从葬火之战算起：尼伯龙根引那股黑力而入，纳塔地脉自此伤了根，遂成提瓦特被蚀最深的一国。深渊不独污土地，还养出巴窟纳瓦这类能扭曲时序的魔物；甚而钻进夜神之国，翻动魂灵的记忆，造出一道道界门，令还魂诗失了效。火龙王修库特尔也曾被它逼疯；奥奇卡纳塔修水利时，劳工为幻觉所苦，死伤无数。如今纳塔地脉将尽黑，所余之期只一年；深渊本体古斯托特更化作火龙王模样，发下最重的一击。"
 NAT_decisions-03:"深渊进攻中"
 NAT_decisions-01_desc:"深渊对纳塔的侵蚀，绵延千年。头一笔当从葬火之战算起：尼伯龙根引那股黑力而入，纳塔地脉自此伤了根，遂成提瓦特被蚀最深的一国。深渊不独污土地，还养出巴窟纳瓦这类能扭曲时序的魔物；甚而钻进夜神之国，翻动魂灵的记忆，造出一道道界门，令还魂诗失了效。火龙王修库特尔也曾被它逼疯；奥奇卡纳塔修水利时，劳工为幻觉所苦，死伤无数。如今纳塔地脉将尽黑，所余之期只一年；深渊本体古斯托特更化作火龙王模样，发下最重的一击。"

