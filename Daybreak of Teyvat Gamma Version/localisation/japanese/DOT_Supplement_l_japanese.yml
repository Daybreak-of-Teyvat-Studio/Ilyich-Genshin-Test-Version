 DOT_INTRO_TEXT_Mora:0 "Mora はテイワットの共通通貨であり、その収支の比が国の運営が健全で効率的かどうかを映す。\n\n毎月一度決算が行われ、次の項目が収益の伸びに影響する。\n1.資源売却。資源の輸出は安定した収益をもたらす。\n2.工業税。民生に用いる民間工場（生活消費財係数）が工業税を生み、これが序盤の主な収入源となる。\n3.民生税。人口のある地域はそれぞれ消費税を提供する。\n4.安定度。注意すべきは、安定度が国の安定状態と管理の難しさを映すことだ。安定度が低すぎれば徴税が難しくなる。経済発展の第一要件として安定度を確保してほしい。\n5.固定収入。一部の国策と決議は固定収入を与える。\n\n次の項目が支出に影響する。\n1.資源輸入。他国から資源を輸入するには大量の Mora がかかる。\n2.工業補助。運営する民間工場、軍需工場、造船所のそれぞれに工業補助が必要となる。\n3.軍隊補助。軍隊の正常な運営にも大量の Mora がかかる。\n4.管理支出。所有する地域のそれぞれに管理のための Mora がかかる。\n5.発展係数。国の発展に伴い、これらの支出の係数も上がり続ける。\n6.固定支出。国策に紐づく一部の固定的な支出。\n\n国家債務：収入が支出を賄えないとき国債が累積し、累積した国債はますます重い負の効果をもたらす（国債は未実装。プレイ中の TAG の経済システムが非効率で発展や戦争に耐えないと感じたら、積極的に報告してほしい）。"
 DOT_INTRO_TEXT_NOW_6:0 "かつて原初の天球を牽き、一つの世界に愛と熱意をもたらした§C三月の女神§!はとうに逝った。だが潮汐を追う人々は歌と祈りを止めていない。新たな§C月神§!が再臨せんとしているからだ。\n\n今、月光の届かぬところで、§0旧日の影§!が星辰に向けて狩りの爪を剥いた。\n\n旧日の漆黒に抗するため、あらゆる力をつなぎ合わせよ。往事は水に未来を映し、嘘の帷幕はすでに緩んでいる。時を惜しめ。月が、墜ちてくる。\n\n「§C霜月の子ら§!」\n\n伝説における黄金国の遺胤であり、旧日の文明を捨てた後、山林の間の暮らしを選んだ。彼らが捨てなかった唯一のものは「§C月神§!」への信仰だけである。だが愚人衆の到来とともに、常であった静けさも最後の時を迎えたのかもしれない。\n\n遠き故土はとうに受造の主の王庭に沈んだ。しかし高慢な後嗣たちは今も漆黒の枯潮の中で最初の明灯を灯し、あの悠遠な祷歌を紡ぎ、新月の庇護を願っている。\n\n「§Y灯を執る者§!」\n\n長く深淵の絶え間ない侵入と狂獵に抗い、ノドクラーイの自由と平和を守ってきた古き組織は、過ぎた大戦で大きく力を削がれた。新たな脅威を前に、新世代の執灯士たちはまだ自らの使命を果たせるのか。\n\n「叮鈴哐啷蛋巻工房」\n\nもとは天才の少女が「最も美味しい蛋巻の機械」を研究する小さな作業場にすぎなかった。だが数々の精巧な発明が生まれるにつれ、ここは次第に名の知れた機械工房となった。ただしあの天才に頼み事をするときは態度に気をつけてほしい。そうでなければ受け取る部品に不味い蛋巻が付いてくるかもしれない。\n\n「ヴォニッチ商会」\n\n最低限の秩序を保つため、那夏鎮の商人たちが商会を作った。だが島々の無法者たちが規則に縛られるはずもない。彼らを恐れさせる者がいるとすれば、それはおそらく「秘聞館」の女将だけだろう。\n\n「愚人衆」\n\n最高指令「蒼星の聖勅」の輝く諭しの下、愚人衆の執行官たちはことごとくスネージナヤへ呼び戻され、ノドクラーイへと向かった。新設された月矩力実験設計局では、無数の伝動機関が日夜回転している。ここで人々は噂する。蒼星の旗を掲げるその軍勢は何のために来たのか、あるいは「誰」のために来たのかと。\n\n「§0狂獵§!」\n\n深淵の大軍は嵐のように野と峡谷を掠める。近づけば、その詭譎な囁きさえ聞こえる。深淵の気配が醸成されている。漆黒の枯潮は寒夜に囁き、日に薄れる帷幕を裂き、弱き魂を呑み尽くす機を待つ。「規則」の及ばぬ影の中では、「死」すら折磨と苦難の終わりではない。\n\n「西風騎士団」\n\nモンド遠征軍に属する精鋭騎士の一小隊で、団長に従ってスネージナヤ全土を越えノドクラーイへ来た。重要な任務のために来たと伝えられる。"
