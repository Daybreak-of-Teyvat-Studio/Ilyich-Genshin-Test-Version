 POR_unreliable_army_desc:0 "1910年に共和制が実施されて以来、反乱と鎮圧が頻繁に起きているため、将校は軍隊の規律を維持し訓練を促進することよりも政治に没頭しており、兵卒は士気が低く、装備も訓練も不十分だ。"
 POR_unstable_monarchy:0 "不安定な王制"
 POR_unstable_republic:0 "不安定な共和国"
 POR_unstable_republic_desc:0 "1910年に樹立された第一共和政時代は、「継続的な無政府状態・政府の腐敗・暴動と略奪と暗殺・恣意的投獄・宗教迫害」の一種と言われていた。9人の大統領就任、44回の内閣改造、21回の革命を目撃することとなった。1926年の軍事クーデターの後でも、いくつかの失敗した革命未遂があった。"
