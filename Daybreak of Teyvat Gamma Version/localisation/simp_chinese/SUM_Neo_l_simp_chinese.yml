 SUM_Neo.201.d:"造神完成。须弥有了一位可以被指挥的神。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。"
