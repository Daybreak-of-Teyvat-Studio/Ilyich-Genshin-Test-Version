DRA_Call_for_Reunion:0"Призыв к объединению"
DRA_Call_for_Reunion_desc:0"Мы призываем все силы к мирному объединению."
DRA_Annex_MOT:0"Конец Ордена"
DRA_Annex_MOT_desc:0"Мы атакуем Орден Рыцарей Запада."
DRA_Annex_SPI:0"Спрингвейл"
