#丽莎研究决议
DRA_Lisa_Research:0"«Особые исследования»"
DRA_Lisa_Research_desc:0"Лиза применит свои знания из Сумеру для развития хребта. Это займёт время, но принесёт плоды.\n\nЕжемесячный прирост очков исследований: §Y[?DRA_Reseach_Points_perMonth]§!\nОчки исследований: §Y[?DRA_Reseach_Points]§!\n\nКомитет по этике, который должен был координировать работу, теперь имеет и другие функции.\n\nСостояние комитета:\nВласть: [?DRA_Power_of_Committee]\nОппозиция: [?DRA_Disagreement_of_C]\n\nПоддерживайте хорошие отношения с комитетом для стабильного прогресса. Но некоторые хотят ослабить его и ускорить исследования. Выбор за Лизой."
DRA_Committee_Action:0"Исследовательский цикл"
DRA_Committee_Action_desc:0"Институт ежемесячно отчитывается перед правительством. Комитет по этике координирует процесс.\n\n§YЗавершение цикла даёт политические и исследовательские очки. Власть комитета увеличивает политические очки, но уменьшает исследовательские.§!"
DRA_Communication_with_Committee:0"Диалог с комитетом"
DRA_Communication_with_Committee_desc:0"Мы наладим диалог с комитетом.\n§gПодарки — часть дипломатии.§!"
DRA_Placify_Committee:0"Успокоение комитета"
DRA_Placify_Committee_desc:0"Мы потратим время и ресурсы, чтобы успокоить комитет.\n§gПовышение зарплаты — нормальный рост.§!"
DRA_Cover_Research:0"Сокрытие исследований"
DRA_Cover_Research_desc:0"Некоторые исследования спорны, но мы их проведём.\n§gПусть думают, что мы открыты.§!"
DRA_Weaken_Committee:0"Ослабление комитета"
DRA_Weaken_Committee_desc:0"Комитет перегружен. Мы сократим его полномочия.\n§gКоторые уже не восстановить.§!"
DRA_Beat_Committee:0"Давление на комитет"
DRA_Beat_Committee_desc:0"Мы получили жалобы на членов комитета. Проведём проверку.\n§gПочерк подозрительно красив.§!"
DRA_New_Law_of_Morality:0"Новый этический кодекс"
DRA_New_Law_of_Morality_desc:0"Время меняет мораль. Пора обновить кодекс.\n§gНазовём его «Искусственная мораль».§!"
DRA_No_Committee:0"Увольнение комитета"
DRA_No_Committee_desc:0"Старые члены комитета заслужили отдых. Молодые тоже.\n§gПрощайте, друзья!§!"
DRA_Copy_the_Void:0"I Симуляция Системы Пустоты"
DRA_Copy_the_Void_desc:0"Мы создадим аналог Системы Пустоты, не зависящий от Дендро Архонта. Это позволит свободно обмениваться знаниями."
DRA_Utilize_the_Tree:0"III Использование Древа Мороза"
DRA_Utilize_the_Tree_desc:0"Древо Мороза станет центром нашей сети."
DRA_Up_Our_Sense:0"II Временная загрузка сознания"
DRA_Up_Our_Sense_desc:0"§RПлоть слаба.§!\nМы позволим рабочим загружать сознание в сеть для управления «пустыми телами»."
DRA_Build_the_Space:0"II Создание общественного сознания"
DRA_Build_the_Space_desc:0"Мы создадим общественное пространство для взаимодействия сознаний."
DRA_Build_Army_Space:0"II Военное сознание"
DRA_Build_Army_Space_desc:0"Мы создадим военное пространство для координации и повышения боевого духа."
DRA_Better_Our_Space:0"II Развитие общественного сознания"
DRA_Better_Our_Space_desc:0"Мы продолжим развивать общественное сознание."
DRA_Use_Born_Theory:0"I Теория эмерджентности"
DRA_Use_Born_Theory_desc:0"Простые взаимодействия создают сложные системы. Мы применим это к нашему пространству.\n§RМы назовём это «Днём рождения».§!"
DRA_Relieve_Mess:0"III Снятие ограничений"
DRA_Relieve_Mess_desc:0"Мы снимем ограничения с «пустых тел»."
DRA_Strengthen_Colle_Ablity:0"III Усиление коллектива"
DRA_Strengthen_Colle_Ablity_desc:0"Мы передадим часть управления «пустыми телами» коллективному разуму."
DRA_Stay_Longer:0"III Увеличение времени пребывания"
DRA_Stay_Longer_desc:0"Мы увеличим время пребывания сознания в сети."
DRA_Ultilize_Brain:0"III Использование вычислительных мощностей"
DRA_Ultilize_Brain_desc:0"Мы используем вычислительные мощности «пустых тел»."
DRA_Stronger_Sense:0"IV Усиление коллективного разума"
DRA_Stronger_Sense_desc:0"Мы продолжим развивать коллективный разум."
DRA_Research_Soul:0"IV Исследование души"
DRA_Research_Soul_desc:0"Чтобы построить башню, нужен фундамент."
DRA_Catch_Leaving_Soul:0"V Эксперимент по захвату"
DRA_Catch_Leaving_Soul_desc:0"Мы обретём свободу от боли и смерти."
DRA_Catch_Without_Agreement:0"VI Принудительное включение"
DRA_Catch_Without_Agreement_desc:0"Те, кто не понимают нас, скоро поймут."
DRA_Stop_Focus_on_Flesh:0"VI Отказ от тела"
DRA_Stop_Focus_on_Flesh_desc:0"Мы — это сознание, а не тело."
DRA_Manufacture_more_ToolsTech:0"VI Производство инструментов"
DRA_Manufacture_more_ToolsTech_desc:0"Инструменты изнашиваются, их нужно пополнять."
DRA_Decentralize_Us:0"VI Децентрализация"
DRA_Decentralize_Us_desc:0"Мы должны отказаться от иерархии."
DRA_Utilize_Tools_Better:0"VI Эффективное использование"
DRA_Utilize_Tools_Better_desc:0""
DRA_Utilize_Brains_Better:0"VI Усиление вычислений"
DRA_Utilize_Brains_Better_desc:0""
DRA_One_Are_All_Are_One:0"VI Все — одно"
DRA_One_Are_All_Are_One_desc:0"Тогда наш город станет столицей мира, а слава наша будет вечной."
#砂糖研究决议
DRA_Level_up:0"Расширение региона"
DRA_Sucrose_Innovation:0"План Сахарозы"
DRA_Sucrose_Innovation_desc:0"Сахароза применит свои идеи для развития хребта.\n\n\nПринятие инноваций: §R[?DRA_Sur_Innovation_Acceptance]§!\nЧем выше, тем больше решений доступно.\n§RБольшинство решений повышает принятие на 5, пропаганда — на 10.§!\n\nСостояние Сахарозы:\nЗдоровье: §R[?DRA_Sucrose_HP]§!\nПсихика: §R[?DRA_Sucrose_MP]§!\nСахароза работает на пределе. Нужно балансировать её здоровье и производительность.\n§RЗдоровье восстанавливается в отпуске или через решения. Большинство решений тратит здоровье.§!"
DRA_SI_Innovation_of_Industry:0"Инновации в промышленности"
DRA_SI_Innovation_of_Industry_desc:0""
DRA_SI_Innovation_of_Weapon:0"Инновации в вооружении"
DRA_SI_Innovation_of_Weapon_desc:0""
DRA_SI_Innovation_of_Plane:0"Инновации в авиации"
DRA_SI_Innovation_of_Plane_desc:0""
DRA_SI_Innovation_of_Ship:0"Инновации в судостроении"
DRA_SI_Innovation_of_Ship_desc:0""
DRA_SI_Try_of_Industrial_Technique:0"Промышленные эксперименты"
DRA_SI_Try_of_Industrial_Technique_desc:0"Мы применим идеи Сахарозы в промышленности.\n§RСлаймы, прыгающие в еду!§!"
DRA_SI_Try_of_ArmsPro_Technique:0"Военные эксперименты"
DRA_SI_Try_of_ArmsPro_Technique_desc:0"Мы применим идеи Сахарозы в военной промышленности.\n§RДвигатели на обманчивых цветах!§!"
DRA_SI_Try_of_CityBuild_Technique:0"Градостроительные эксперименты"
DRA_SI_Try_of_CityBuild_Technique_desc:0"Мы применим идеи Сахарозы в строительстве.\n§RСлаймы для очистки канализации!§!"
DRA_SI_Try_of_Management_Technique:0"Эксперименты в управлении"
DRA_SI_Try_of_Management_Technique_desc:0""
DRA_SI_Try_of_Organization_Technique:0"Эксперименты в организации"
DRA_SI_Try_of_Organization_Technique_desc:0""
DRA_SI_Research_Faster:0"Ускорение исследований"
DRA_SI_Research_Faster_desc:0""
DRA_SI_Theory_Faster:0"Ускорение тактики"
DRA_SI_Theory_Faster_desc:0"Сахароза применит свои знания к военной тактике.\n§RТараканы!§!"
DRA_SI_Using_of_BioChemistry_on_Agri:0"Биоалхимия в сельском хозяйстве"
DRA_SI_Using_of_BioChemistry_on_Agri_desc:0"Сахароза создаст новые организмы для сельского хозяйства.\n§RЭто не опасно!§!"
DRA_SI_Using_of_BioChemistry_on_Mili:0"Биоалхимия в армии"
DRA_SI_Using_of_BioChemistry_on_Mili_desc:0"Мы используем идеи Сахарозы для повышения боевого духа.\n§RТараканы!§!"
DRA_SI_Improve_Popular_Confidence:0"Внутренняя пропаганда"
DRA_SI_Improve_Popular_Confidence_desc:0"Сахароза — отличный пропагандист.\n§RПросто почитай речь!§!"
DRA_SI_Improve_Performance:0"Внешняя пропаганда"
DRA_SI_Improve_Performance_desc:0"Сахароза будет улучшать имидж хребта.\n§RНе упирайся!§!"
DRA_SI_Heal_Hp1:0"Массаж для Сахарозы"
DRA_SI_Heal_Hp1_desc:0"Массаж для восстановления сил.\n§RЯ тоже хочу погладить её уши!§!"
DRA_SI_Heal_Hp2:0"Обед для Сахарозы"
DRA_SI_Heal_Hp2_desc:0"Вкусный обед для поднятия тонуса.\n§RПочему не ешь?§!"
DRA_SI_Heal_Mp1:0"Психолог для Сахарозы"
DRA_SI_Heal_Mp1_desc:0"Психологическая помощь.\n§RСлишком долго?§!"
DRA_SI_Heal_Mp2:0"Кошки для Сахарозы"
DRA_SI_Heal_Mp2_desc:0"Встреча с кошками для успокоения.\n§RЭто помогает и мне.§!"
DRA_Sucrose_Reheal:0"Выходной Сахарозы"
DRA_Sucrose_Reheal_desc:0"Раз в месяц Сахароза отдыхает."
#砂糖援助决议
DRA_Last_Action:0"§RОкончательный приказ§! для [From.GetNameDef]"
DRA_Last_Action_desc:0"Мы проведём подрывные операции и отзовём медиков. Это снизит доверие, но иногда необходимо.\n§RВойна близко.§!"
DRA_Sucrose_Support:0"Внешняя помощь"
DRA_Sucrose_Support_desc:0"Мы отправим медиков и лекарства в Мондштадт, чтобы уменьшить жертвы и распространить наши идеи.\n\n§YУровень помощи влияет на восстановление и снижает военную поддержку. Чем выше уровень, тем больше эффект.§!\n\n§YВлияние Драконьего хребта§!：[?DRA_Sucrose_Sum]\n§YПри достижении 26 влияния, дух «Мир» сменится на §R«Сияющую звезду мира»§Y！§!"
DRA_Medicine_Help:0"Медицинская помощь [From.GetNameDef]"
DRA_Medicine_Help_desc:0"Мы отправим больше медиков.\nПовысит уровень помощи."
DRA_Large_Medicine_Help:0"Крупная помощь"
DRA_Large_Medicine_Help_desc:0"Мы отправим крупную партию медиков."
DRA_Anti_War_Prop:0"Антивоенная пропаганда в [From.GetNameDef]"
DRA_Anti_War_Prop_desc:0"Мы проведём антивоенную пропаганду."
DRA_Get_Mora:0"Экономическая выгода"
DRA_Steal_Mora_desc:0"Получить финансовую выгоду."
DRA_Steal_Weapons:0"Кража оружия"
DRA_Steal_Weapons_desc:0"Мы украдём оружие."
DRA_Stop_Weapon_Pro:0"Срыв производства"
DRA_Stop_Weapon_Pro_desc:0"Мы нарушим производство."
DRA_Collaboration_Consultation:0"Контакт с оппозицией"
DRA_Collaboration_Consultation_desc:0"Мы свяжемся с оппозицией."
DRA_Get_Political_S:0"Политическая выгода"
DRA_Get_Political_S_desc:0"Получить политическую выгоду."

