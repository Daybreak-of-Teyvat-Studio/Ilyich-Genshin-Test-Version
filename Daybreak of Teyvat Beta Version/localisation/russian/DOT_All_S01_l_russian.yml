PRI_Vision_Anemo_desc:0 "Глаз Бога Анемо: когда люди сталкиваются с бессилием, но их желание достигает предела, взор бога падает на них. Это Глаз Бога — внешний орган, дающий силу стихий." 
PRI_Vision_Geo_desc:0 "Глаз Бога Гео: когда люди сталкиваются с бессилием, но их желание достигает предела, взор бога падает на них. Это Глаз Бога — внешний орган, дающий силу стихий."
