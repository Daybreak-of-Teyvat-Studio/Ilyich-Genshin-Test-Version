l_english:

# 阵营目标：通用提瓦特世界观（短 / 中 / 长期各三个）

 DOT_fg_compat:0 "Legacy Goal"
 DOT_fg_compat_desc:0 "This goal has been superseded by the new alliance covenant."
 DOT_fg_alliance_covenant:0 "Covenant of the Alliance"
 DOT_fg_alliance_covenant_desc:0 "Now that the nations of Teyvat are allied, let good faith come first: share the hardship, neither command nor abandon one another."
 DOT_fg_ley_line_survey:0 "Survey of the Ley Lines"
 DOT_fg_ley_line_survey_desc:0 "Elemental energy follows the ley lines; let the alliance first chart their courses and mark where they clog, against the day they are cleared."
 DOT_fg_abyss_watch:0 "Watch upon the Abyss"
 DOT_fg_abyss_watch_desc:0 "The abyss needs no army at the gate to be known; let the alliance set watch upon its borders and share the warning, that all nations may prepare in time."
 DOT_fg_shared_ley_lines:0 "Mending the Ley Lines Together"
 DOT_fg_shared_ley_lines_desc:0 "When ley lines clog, elemental energy stalls; may the alliance clear them together and hold back the abyss, so field and workshop breathe again."
 DOT_fg_elemental_workshop:0 "Workshops of the Elements"
 DOT_fg_elemental_workshop_desc:0 "Each nation masters one element; should they exchange artisans and tools, wind, flame, water and thunder may sustain one another, and neither plague nor dearth shall bind the alliance."
 DOT_fg_seven_nations_pact:0 "Pact of the Seven Nations"
 DOT_fg_seven_nations_pact_desc:0 "Seven nations govern differently yet share one care; let a pact settle their quarrels, that no war be waged without counsel, nor one nation's whim set the whole world alight."
 DOT_fg_dawn_of_teyvat:0 "Dawn of Teyvat"
 DOT_fg_dawn_of_teyvat_desc:0 "The long night has an end; may what the alliance greets be no new throne, but a dawn that belongs to mortals."
 DOT_fg_question_of_celestia:0 "The Question of Celestia"
 DOT_fg_question_of_celestia_desc:0 "Long has the heavenly principle hung above; let the alliance gather the wisdom of seven nations to ask whence that decree comes, that mortals be bound no more by divine will alone."
 DOT_fg_abyss_sealed:0 "The Abyss Sealed"
 DOT_fg_abyss_sealed_desc:0 "Should the abyss at last recede, may the nations turn their arms no more upon one another, but keep this land in peace, so that later ages hear of the dawn and not of war."
