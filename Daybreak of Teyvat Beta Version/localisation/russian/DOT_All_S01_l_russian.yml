DVA_MASS_OF_DVALIN_DESC:0"Ураган терроризирует Мондштадт, но Логово страдает больше всего. Монстры активизировались. Нам нужно навести порядок.\n\nНам нужна помощь Ордена, но это усилит их контроль. Другой путь — сделать всё самим. §RНизкое доверие приведёт к серьёзным последствиям!§!"
