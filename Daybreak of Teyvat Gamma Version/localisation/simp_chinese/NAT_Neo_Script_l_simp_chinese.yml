 NAT_Flower_Skybound_Proclamation_Idea:"翱翔宣告"
 NAT_Flower_Skybound_Proclamation_Idea_desc:"花羽会欲向整片大陆宣告不复听命于焱庭，选在最高云端宣告。一鹰主驾龙冲上云海，于最高处放声喊话，声借风传向四方。地面上，焱庭使臣仰头看，皱眉曰：「恁高，谁能听见？」旁一花羽会后生笑曰：「听不听得见，乃焱庭之事；喊不喊，乃吾等之事。」鹰主于云端盘旋三圈，每圈皆将那话喊一遍。使臣气得跺脚，却无可奈何。末了，鹰主将一面羽旗自云端抛下，旗打旋落来，正插使臣脚边。使臣盯那面旗，半晌未敢拔。鹰主天上打一旋，带满身云气，往远山飞去矣。"
