 DOT_INTRO_TEXT_7:0 "深渊教团无国而有众，无土而有徒。其据不在城郭，而在坎瑞亚既覆之后所遗之隙：层岩之下有深矿，沙海之下有旧祀，风龙废墟之下有倒悬之神像，蒙德之野有腐植之坛。凡为深渊所蚀之地，皆其邸第。教团于其间畜魔物、拾残械、收亡人；昼伏夜行，不树旗，不称王。其众有法师，有使徒，有咏者，有黑蛇之骑；名号虽殊，皆自同一场灾祸中来。教团之众，不问其出，不问其罪；其地无昼夜之辨，唯见火光；其行无远近之限，唯循裂隙。\n\n其源出于坎瑞亚。五百年前，坎瑞亚窥天之禁，天理讨之，国灭而民不赦：或化为魔物，或永受不死之诅。遗民散于提瓦特，面目日改，言语日失；其存者犹带旧国之音，而其形已不可辨于人。有克洛达尔·亚尔伯里奇者，纯血之遗民，承「罪人」维瑟弗尼尔之教，聚其族之犹有理智者立教团，号曰复国。其子卡利贝尔已为丘丘，克洛达尔欲以深渊之力改其命，遂铸「命运的织机」之谋。教团之初，本为一家之私愿；及其成众，遂为一族之公仇。其教无经，其礼无定，唯以复国为誓。\n\n织机之谋，非攻战也，乃篡忆。教团以腐植之仪诱特瓦林，使为兵器；又诱北风之狼，欲使为爪牙；以逆位神像倒悬于璃月之秘，索「耕地机之眼」，欲驱奥赛尔之躯为机械魔神；又据层岩之深，启净化之器，强解遗民之诅。凡此皆不成，而教团不悔，其所求者非一城一地，乃世之记忆与其法则。其后卡利贝尔投记忆于维摩庄，使村人共忆一人，而其人本不存，此织机初成之验也。教团据层岩，欲以净化之器尽解其诅，而哈夫丹止之。教团之谋虽屡折，而其众不散。\n\n今教团之柄，在「殿下」之手。殿下者，旅行者之血亲，五百年前与戴因斯雷布同行，后绝而之深渊。其志三：曰反天理，曰淹神座，曰复坎瑞亚。尝语人曰：吾欲以整个世界，易与天理平等对话之资格；又欲使新坎瑞亚为吾与彼可居之故乡。故其解遗民之诅也，明知十死而一生，犹曰：不尊严而死，不如不存。能舍一城以取一忆，能弃一胜以成一隙，能以一人之悲动一国之众。尝曰：我们终将重逢，但不用急，我有足够的时间来等你。此其所以能久也。教团之难，不在七国，而在无国可归。\n\n故教团之兵不聚于野，而其谋散于七国；不募死士，而收失意之人。凯亚之父弃其子于蒙德，曰「此汝之机，吾族最后之望」，此其所以用人心也。戴因斯雷布追之五百年而不得其尽，丝柯克、渊上之属又各行其道。七国以疆界相攻，教团以裂隙相入；七国以胜负相计，教团以岁月相待。其可畏者不在魔物之众，而在世人心中那一线「此世不公」之念。隙在人心，则教团无处不在；隙在人心，则坎瑞亚之亡，未可谓亡。教团之志，历五百年而不改，盖其所恨者未亡也，故其亡也不灭其名。"
 DOT_INTRO_TEXT_8:0 "丘丘者，散于提瓦特之荒野、废墟与废矿之间。戴木面，衣兽皮，守火堆，聚族而游。无文字，无城郭，无律令；以舞为礼，以鼓为令，以面具别其族与所祀之神。其族有酋，有萨满，有持斧之米塔丘丘，有负盾之卫士；弱者拾薪，强者猎兽。火必不灭，火灭则族散，故守火者之位亚于酋。其面具各象其神，其鼓各别其族；闻鼓知部，见面具知祭。其火以石围之，以骨饰之；火在则神在，火熄则举族迁。其营不设栅，其路不设标。其战无阵，其退无迹。七国之人过其营，不闻其语，唯闻其嚎，遂名之曰魔物，而不复问其所自。\n\n然其先非魔也。五百年前，坎瑞亚之民受天理之诅，形体日改，语言日失；去国界一步而形变者，史有其人，名曰赫雷贝里。其始也，犹记父母之名；其久也，并己之名而忘之。戴因斯雷布受其兄之戒，得免诅咒之蚀；而其民无戒，故五百年来，日渐忘其为人。黑蛇骑士既失其魂，犹守其民，视丘丘为待救之人；荒野之中，偶有黑甲之影，为丘丘拒魔物而不去。此其国已亡五百年，而其臣未去也。故丘丘之众，非生而为魔，乃被诅而为人所弃。其语渐失，其名渐忘，故其存者唯面具与鼓。\n\n丘丘之中，有萨满者，能吟漆黑之符文。盖坎瑞亚人本以言灵导元素之力，诅咒之后，唯萨满犹存其记忆；其国既亡，王庭禁书散于野，今之所诵，多其残句。其部落有锅，锅者古国禁卫之象，掌锅者谓之「分汤人」。国亡五百年，而分汤之俗犹在：分汤之礼，非飨于魔，乃飨于同族。此二者，其文明之遗烬也；世人见其舞与嚎，而不见其守此二物之难。故其术愈精，则去人愈远；七国见其术而骇，遂不复察其为遗民，此其所以终不可与言也。\n\n丘丘部落联盟者，散者之第一次相合。萨满主祭，战士主兵，猎手主山林，各不相下；无共主，无定制，唯以篝火之约相维。其约不书于竹帛，而刻于骨、结于绳；一盟既成，虽死不渝，一盟既破，虽亲必仇。其合也非有远图，实以七国清剿之急；其散也亦非有叛，实以无粟可共。其众不知历法，以火为岁；一火之熄，谓之一年。其盟主不称王，唯称「举火者」；举火者死，则众复散。故其众可聚而不可久，可战而不可守；其勇可用，其愚可欺。故其盟可一战而合，亦可一饱而散。\n\n七国相攻，唯清剿丘丘一事可以不约而同。深渊教团来，则以复国之说诱之，使为前驱；七国来，则以魔物之名剿之，不留其种。卡利贝尔尝以记忆之诗遍慰群丘，使躁者安、散者聚，此其可合之机也。故联盟之难，不在兵寡，而在无人以人待之；其存，不在勇，而在有识者为之名。欲存，须先证其非怪物；欲证，须先有人肯听其一言。故联盟之合，非其本心，实其势也；其势一缓，则复散为部落，此其所以终为七国所轻也。今之联盟，其势未定，其名未正。"
 DOT_INTRO_TEXT_9:0 "许诺之地者，丘丘遗民所求之一土也。其地当沙漠与山岭之间，商道贯其中，帝国履其上。丘丘之众自七国荒野而来，弃其面具，习人之礼，聚而居之，名其国曰许诺：谓此土既许之，则不复为魔物。名者，其立国之始，亦其受疑之始也。其始不过数十帐、数百口；今其城有市、有庙、有学，有通译之馆，以教丘丘之幼者人言。其立国之君本一译人，能以丘丘之音通七国之言，故众推之；今其庙堂之上，犹悬其画像。其国既立，四邻皆以魔物视之，其使节出，须以布蒙面而后入人之城。故其外交之难，不在利，而在名。\n\n其政在长老会。长老者，非以血贵，非以兵强，以年、以望、以能通人语者为之。堂上共议，堂下各行：祭在教团，粟在族老，刀在少年。国无独断之君，而有多门之政；一事之决，必经数家之诺。长老会之外，有教团之席，有商团之席，有武人之席；席各三人，议各持一说，故其决常在可否之间。国有大狱，狱不设于市，而设于庙之下；讯不以刑，而以断粮。长老之任非终身，三年而更；席有定而语无定，故一人可兼三家之辞。其堂无画像，唯悬其国之约。其议事也缓，其行事也杂，而其败也常败于相持不下。\n\n然实权不尽在堂上。家族各结派系，派系各养耳目；教团掌人心，商贾掌粮道，武人掌城门。长老会所议者，多是已决之事；未决之事，早在暗室议定。故其国号为共和，行则近于共谋：能拉拢者拉拢之，能平衡者平衡之，不能者去之。其党有籍，籍不书名而书其所好，故一人之好可以牵一家。其国之富不在田而在道，商队过境税其十一，故其与四邻之战，多为争一关、一井、一渡。其国无史祸而有史利：凡所议者必录其名，然录者不书其言，故其史可读而不可信。\n\n许诺之地兵不众，地不广，四邻皆强。其术有三：一曰种大树，先结强国之援；二曰拔牙，先去其国内之患；三曰引信，待他人相攻而燃之。外交于弱国，非交也，乃臣也：今日称臣于甲，明日纳款于乙，唯求其国不亡、其名不改。其遣使也，必先贿其近臣，然后通其君；其结盟也，必留一隙，以为他日转圜之地。其兵不出境而募亡人；亡人无籍，故死者不入冢，生者不入史。其国人善译，七国之使多雇之；一纸之译，可以易一城之信。其国之谋，多于茶肆而成，故其国无密事而有密约。\n\n其朝有刀架于颈，其堂有笑里藏刀；有祖法不可变之说，有公开处刑之令；有清洗党员之举，有纵横捭阖之谋。国之不亡，不以其强，而以其能忍；不以其信，而以其能疑。故其国多谋而少断，多疑而少信；谋可以存国，亦可以亡国。其史官书曰：吾国之所以存者三，曰忍，曰疑，曰不使人知吾之所欲；此三者亡，则国随之。故其国虽小，而七国之事多与之相关；其言虽轻，而七国之疑多自其起。"
 DOT_INTRO_TEXT_10:0 "纳塔在提瓦特之西南，火山、熔岩与荒原居其大半。西薄烬寂之海，东据熔岩之坂。赤壤千里，寸草难生；黑石嶙峋，触之灼手。其谷有温泉，其崖有硫穴；风挟灰而迷人目，雨落地而化为白烟。烬寂之海之火不灭，其声如吟；相传渡火之智者行于其中，能至时间之诸角。火山曰图兰，其火不熄；灰落百里，水可疗疾，亦可以毒。地无桑麻，唯出硫铁；市无钱帛，多以盐皮相易。其地多风，风中有火，故其屋以石为墙、以土为顶。其市无定时，日中而集，日入而散。然其地虽瘠，其民则劲；其土虽烈，其俗则雄。\n\n其民不统于一君，而分为六部：沃陆之邦耕于灰壤，回声之子守其旧闻，流泉之众逐水草而居，悬木之人缘崖而栖，花羽之会司羽饰与礼，烟谜之主掌卜祝与药。六者各奉其祖，各守其疆，各蓄其兵；有盟诅之信，无律令之文。岁时有祭，祭必陈其先人之名；部中有讼，讼则决于长老之口。酋非世及，以能战、能祭、能断者为众所推。其外有龙众之遗，有流亡之众，有无部之人；无祖可奉，故常为六部所轻。其祭也举火三日，其葬也焚而不埋，以为魂归于火。其俗尚勇，少年能持矛者，即谓之成人。故其政常在一盟一叛之间。\n\n玛薇卡以不败之阳焰，正火神之位。先是，她以意识与力存于圣火，越五百年而复苏，本欲待六英杰各承古名、得大灵之认，然后与深渊一战。古名者，名系于祖，祖系于部，部系于火；名存则人虽死犹在，名绝则族虽存已亡。其成也不由自许，必由大灵之认；故火神之柄不在刀兵，而在名籍，其威不在杀，而在使人乐为之死。纳塔之地脉，即夜神之国；大灵居焉，死者之魂归于其中。火神之谋本以六英杰为骨，英杰未集，则火神之令不出于圣火之殿；故其国无诏令，唯有火与名。\n\n深渊久入夜神之国，读其记忆，故其侵也，能择人、择地、择时；夜神之国几为所蚀，其灵魂外逸，地脉日衰。至是，纳塔之土将尽化深渊，去其亡也不足一年。内则六部离心，有欧洛伦者叛而归「队长」；外则渊物日至，古斯托特伺于隙中。其侵也非以兵，以忆：读其史，识其人，然后择其痛处而入。死者之魂不得归，或附于物，或化于野，纳塔之民谓之失名。至是其国，上有火神而无兵，下有六部而不听；火神之令，六部阳奉而阴违，其令不行于野，唯闻于殿。\n\n其后六英杰集，古斯托特以火龙王之形来攻，玛薇卡与六英杰借若娜瓦之力却之，天之虚假为之一裂。终战于夜神之国，众魂与地上之人并力，古斯托特乃亡。契约既偿，夜神得不死；「队长」代玛薇卡而坐源火之圣座，易夜神之国之法，使异乡之魂亦有所归。纳塔之火不熄者，非为守边，乃为守名；名不绝则国不绝。火神既胜而其国亦疲，六部之约复归于纸。火已举矣，其焚敌也，亦以自照。"
 DOT_INTRO_TEXT_11:0 "天理无国土，亦不必有。七神各守其土，元素各归其位，凡人之僭越有所止，此其疆也。其疆不以山川为界，而以规则为界；规则所及即其版图，规则之外皆谓之禁忌。地脉贯于地下，如网如经；世界树倒悬于须弥之下，凡提瓦特之知与忆，皆汇于其中。其法有四：曰生，曰死，曰时，曰空；四者不失，则天下无乱。故其国无城，其兵不陈，日月之序、生死之限即其守卒。天使者，天之使也，非神非人；其授人以知，不禁人之问，唯禁其一问：天之外，何所有。地脉既通，千里之遥可以一瞬；世界树既存，千载之事可以一阅。\n\n昔者法涅斯定第一文明之制：使众信仰天空岛，使天使行于地上以传高天之启，使地脉供其力，使百工各得其所。所禁者一事，曰禁忌之知识。初民道德自足，不待律令；饥则天降食，瘠则地出矿，郁则高天以声应之。其时诸文明同文、同祀、同用元素方碑与传送之锚；高塔接天，皆以为可通于上。人神之隔，唯在一线。人之有过，天不即罚；待其三犯，然后降之。故其刑也缓，而其威也深。其时无王无讼，人各安其业；其后人日众，乃有城、有军、有王。\n\n其时亦有三月女神：艾莉亚主恒月，桑娜妲主虹月，卡侬主霜月。夜则去珍珠之宫，行于沙漠，月莲开于其足下；死者之魂奔月，船工送之。及葬火之战，第二王座尼伯龙根携禁忌之知而至，江河倒转，恶疫横行。天乃降钉以补地，绝禁忌之知于地脉，统合之文明由是而亡；钉所在，今为地灵之龛，龛封而文明绝。天使为人类求情，亦失其形而为仙灵，退居荒野，唯以本能引人寻宝。天钉既降，其光如柱，贯地而入，所过之处地脉断而记忆绝，所过之处草木不生，人亦不居。自三月既默，灵魂不复奔月，死者之魂唯入地脉。\n\n五百年前，坎瑞亚窥其禁，天理亲讨之，国灭而无赦。自是之后，天理不复亲出，唯余维系者行于其间；其沉寂非亡也，乃守夜者暂息其手。七神各据其座，各守其民；神座既分，天理唯守其法。坎瑞亚既亡，其民受诅而散；七神各守其土而不敢救，唯冰之女皇以为不公，遂有今日之叛。其亡也，天不赦一人；其存也，天不问一国。故七神之立，非天所命，乃天所许。\n\n故天理之可畏不在其兵，而在其常：日月不失其序，元素不失其位，死者不返，僭者不赦。然常者可久而不可变；一旦有人证其可破，则所余者唯最后一层皮耳。其为政也，不患无人畏之，而患有人试之；不患七国相攻，而患七国相问。相攻者法内之争，相问者法外之疑。故其治也不立文字之律，而使人心自畏；不设刑官之属，而使七神自守。天之治，以不治为治；其法不书于人，而刻于石；石者天钉之遗也，读之者皆不得其解，故知之者不言。故七国之君，宁违其民，不敢违天；宁失其土，不敢失其序。"
 DOT_INTRO_TEXT_12:0 "至冬在提瓦特之最北，冰原、冻土与不冻之港举其国境。一岁唯二季：封与解。其粟恃南商，其工恃地矿，其行恃铁轨；自女皇兴列车之技，轨路四出，总站立于都中。其都曰至冬堡，其港曰贝洛沃迪；冰封之日，舰队泊于港内，火不熄，人不眠。其人以渔、以矿、以铁为业；其食多腌，其衣多毛。其冬也，雪没车辙，河冻三尺；其夏也，冰解而泥，道不可行。故其国无余粮，常以三年之蓄为常。地既寒，人亦俭；不为无益之费，不设无用之官。\n\n其先有黄金之城曰亥珀波瑞亚，历法七岁为一纪，其元年距今六千余年；月矩之技、影域之探，皆自此出。后有白沙皇莫诺马赫，一冻土全境，冬契之军听其令。白皇死于抗渊与兽潮，尸归白冕宫；自女皇临朝，白冕宫遂无人问，宫门之雪岁增一寸。白沙皇之世，冬契之军出于诸氏族，各守其土，各贡其兵；及女皇立，废冬契而用愚人众，土归于国，兵归于众，氏族之权由是而衰。诸氏族退居乡里，其名犹存，其实已去。其宫旧有钟，钟鸣则百官集；女皇不鸣钟，唯以令召。\n\n第七百九十九纪元年四月，安娜丝塔夏·费奥多罗夫娜·雪奈茨娜娅加冕为全至冬之女皇。其魔神名曰瓦沙嘉，权能曰慈爱；然女皇不认此权，亦不之用。坎瑞亚受罚于天理，女皇以为不公，遂有私仇：绝七神之好，斥诸神为短视，斥深渊为污秽，欲洗此世之歪曲，而向天理举叛旗。其性由是而变，不复爱民，亦不复为民所爱。其朝有议院，议而不决；决者，女皇一人而已。女皇藏记忆于誊录之棱晶，日易其一；或曰：非防人也，防己之忘。\n\n愚人众者，女皇之兵也。初，皮耶罗以坎瑞亚之痛说女皇，共立此众，自为统括官，为女皇招诸异能为执行官。执行官受权柄于冰之神，唯女皇是听；诸执行各领一席，或司财，或司兵，或司祭。其律曰：凡国家之险策，须在任执行官悉集而投之，全票乃行。其城曰格鲁波夫，译言愚人之城，居至冬堡之侧，为众之总部。其一席虚而存，曰「队长」，女皇留之，以志其死。其法典出于军械宫，凡涉存亡者，皆藏其副本。\n\n女皇以严冬为备：收诸执行归于本土，以愚人众之军渐握兵柄，以陵寝与白桦定死生之礼，以谧源之技通影域之途，以列车之轨连诸边之港；诸族之兵，皆听调于都。其所谋者非一时之胜，乃一长冬之存。至冬之志，在使此地不为坎瑞亚，不为亥珀波瑞亚；故其术也冷，其心也热，其罪也未定。其民耐寒而寡言，其兵习苦而轻死；其国无以为乐，唯以长冬为常，以胜为偶然，以败为常事。此其所以能久，亦其所以可畏。其民不知春，唯以冰消为岁首；其国无春，故其民亦不言春。其国之上，无王冠而有权柄；权柄所在，即其国之都。其军有冬装，其港有不冻之水；故虽长冬，而舰可出。女皇之诏，必以其印；印在棱晶之内，非其人不能启。"
