l_japanese:
 LOADING_TIP_0:0 "しゃんりんは気にしない。\n――万民堂・卯師匠"
 LOADING_TIP_1:0 "バリアが大きければ大きいほど、ドド魔王は悪いやつなの。\n――火花騎士・クレー"
 LOADING_TIP_2:0 "七神が追い求める七つの理念の中で、永遠だけが天理に最も近い。\n――雷電将軍・バルゼブ"
 LOADING_TIP_3:0 "この旅人という友人には特技がある、視界に入る宝箱を一つも逃さないことだ。\n――非常食・パイモンによる旅人評"
 LOADING_TIP_4:0 "俺の名はスネージナヤ一のおもちゃセールスマン。\n――ファトゥス・タルタリヤ"
 LOADING_TIP_5:0 "功名は我にあり、百年千秋、火を灯して夜遊びすることを忘れるな。\n――天権星・凝光（ぎょうこう）"
 LOADING_TIP_6:0 "地上の生き物の中にも、雷霆の威光に真正面から立ち向かう勇気ある者がいる。\n――稲妻の亡き浪人"
 LOADING_TIP_7:0 "大丘丘が病気、二丘丘が診る、三丘丘が薬採り、四丘丘が煎じる、五丘丘が死んで、六丘丘が担ぐ、えいほう。\n――往生堂堂主・胡桃（ことう）"
 LOADING_TIP_8:0 "戦争は泥棒を生み、平和はそいつらを絞首台に送る。\n――奔狼領商業リーダー ディオナ"
 LOADING_TIP_9:0 "無風の地に囚われたのなら、俺が高天の歌を奏でよう。\n――風神・バルバトス"
 LOADING_TIP_10:0 "夜明けが訪れるまで、少しでも闇を照らす者がいなければならない。\n――暁のワイナリー・ディルック"
 LOADING_TIP_11:0 "太古の物語を紡ぎ、詩人は歌を紡ぐ。\n――吟遊詩人・ヴェンティ"
 LOADING_TIP_12:0 "人は権力のために生まれるのではない。責任を担うためにこの世に生を受けるのだ。\n――西風騎士団代理団長 ノエル"
 LOADING_TIP_13:0 "モンドの民はかつて西風騎士団を愛し敬っていた。だが今では騎士団に失望し、信頼を失いつつある。多くの人が騎士団が北へ逃げ、我々の民をローレンス家の隷属に捨て去ったと罵っている！\n――西風騎士団代理団長 ジン・グンヒルドル"
 LOADING_TIP_14:0 "天下を取るつもりはないが、庶民の苦しみは知っている。\n――岩王帝君・モラクス"
 LOADING_TIP_15:0 "浮世の景色は千年百年来変わらないが、人の世は露や幻の如し。今こそ、寂滅の時！\n――雷電将軍・影（えい）"
 LOADING_TIP_16:0 "太陽が出たら太陽浴び、月が出たら月を浴びるよ～\n――往生堂堂主・胡桃"
 LOADING_TIP_17:0 "陰陽に秩序あり、運命は予測不能。\n――往生堂堂主・胡桃"
 LOADING_TIP_18:0 "旧貴族らは腹のことばかり考え、スネージナヤ女皇は城内で安穏と座り、シューベルトは彼女を陸に招き、「外務大臣」は国を売る協定を作成している。明日、スネージナヤの客人をもてなす予定だ、皆思う存分祝え。国売り万歳！祖国など知ったことか。丸焼きガチョウ羽のため、我々はモンドを売り渡すのだ！\n――ローレンス領反旧貴族の歌"
 LOADING_TIP_19:0 "古玩がどれほど高価でも、人に与える喜びは手に入れた一瞬だけだ。\n――天権星・凝光"
 LOADING_TIP_20:0 "聖なるモンドが我々を呼び、敵に復讐せよ！我々は貴重な自由を渇望し、そのために戦う覚悟だ！\n――奔狼領新作『モンド賛歌』"
 LOADING_TIP_21:0 "低姿勢で慎ましく振る舞えば許してもらえると諭す者もいた。だが彼らがそう考えるのは、本当の罪人になったことがないからだ。\n――ユーラ・ローレンス"
 LOADING_TIP_22:0 "飛行に必要なのは強い風ではない、勇気だ。\n――モンド飛行大会優勝 アンバー"
 LOADING_TIP_23:0 "夜明けが訪れるその時まで、俺は進み続ける。\n――暁のワイナリー・ディルック"
 LOADING_TIP_24:0 "遺跡ハンターを初めて見た時、槍を投げて撃ち落とした。\n――西風教会 ロザリア"
 LOADING_TIP_25:0 "永遠にモンドを守れ！\n――グンヒルドル家の家訓"
 LOADING_TIP_26:0 "自由、平等、ノエル！\n――モンド「薔薇派」スローガン"
 LOADING_TIP_27:0 "町内で花火を上げれば監禁室行き、爆弾で人を傷つければジンが迎えに来る、山に火をつけたらクレーの末路が待つ、これが騎士団で生き抜くためのクレーの掟だ。\n――火花騎士・クレー"
 LOADING_TIP_28:0 "昔の友人が、甘い菓子を食べながら小説を読めないという理由で心を崩し、泣き叫んでいた、ああ可哀そうに～\n――八重神子が雷電影について語った言葉"
 LOADING_TIP_29:0 "空は澄み海は広く、皓月が空に輝く、この景色は詩を詠むのにうってつけだ。\n――往生堂堂主・胡桃"
 LOADING_TIP_30:0 "浮世の景色は千年百年来変わらないが、人の世は露や幻の如し。虚無。\n――雷電将軍・バル"
 LOADING_TIP_31:0 "今宵は星が煌めき月相も壮麗、きっと良い日だ。ふむ、占ってみよう、分かった分かった、お前の誕生日だ！あら、なんと素晴らしい日だ。\n――往生堂堂主 胡桃"
 LOADING_TIP_32:0 "変えることも逆らうこともできず、ただ受け入れるしかないからこそ、運命は運命と呼ばれるのだ。\n――アストロジス・モナ・メギストスタス"
 LOADING_TIP_33:0 "刀剣に目はないが、職人に情けがある。人の情けこそ、人間が最も誇りとするものではないのか？\n――若陀龍王（じゃたりゅうおう）"
 LOADING_TIP_34:0 "医者が虚実の理を見通せれば、「病の兆しが現れぬうちに癒やす」ことができる。\n――不卜廬・白術（はくじゅつ）"
 LOADING_TIP_35:0 "毎年今日、灯火が昼のように煌めく。原火は絶えず、人々が変わらぬように。\n――璃月・海灯祭の祝詞"
 LOADING_TIP_36:0 "ユーラが攻撃を仕掛ければ、すべて上手くいく。\n――シューベルト・ローレンス（モンド内戦初衝突時）"
 LOADING_TIP_37:0 "私は結局、神に見守られてはいなかったのだ。\n――反抗軍ニシン一番隊隊長・哲平（てっぺい）"
 LOADING_TIP_38:0 "一度も死んだことのない奴が、兵士を前線に送って死なせるのがどれほど栄光かを滔々と語る、そんな人間の言葉を信じられるだろうか？\n――竜脊雪山領議会議長 リサ"
 LOADING_TIP_39:0 "これが我々の時代の平和だと信じている。金魚を飼ったことがあるか？大人しくて可愛いよ。\n――長野原宵宮、国防大臣就任後"
 LOADING_TIP_40:0 "君と別れ、いつ再び会えるか分からぬ、我は朝露の如く儚く散る。\n――花散里（はなちり）"
 LOADING_TIP_41:0 "敵が我々の弾力的防衛線を突破できるようなら、俺はフィッシュルなど名乗らない。幽夜皇女と呼べ。\n――奔狼領行政リーダー フィッシュル"
 LOADING_TIP_42:0 "もし深淵がローレンス領を攻めてきたとしても、民主議会で深淵の肩を持つ言葉を一、二言述べるだろう。\n――西風騎士団代理団長 ジン・グンヒルドル"
 LOADING_TIP_43:0 "何故西風騎士団のために死なねばならない？\n――竜脊雪山領反戦スローガン"
 LOADING_TIP_44:0 "我々が去った後、彼らは学校や善堂を建て、収入を引き上げてくれる。それは彼らの良心が目覚めたからでも、善人になったからでもない。我々がここに来たからだ。\n――七星革命委員会主席・刻晴（こくせい）"
 LOADING_TIP_45:0 "風が激しすぎて、言葉が吹き戻されてしまった\n――魈元帥（三眼五仙仙人の降伏勧告に返答）"
 LOADING_TIP_46:0 "今日は我々の番だ、明日はお前たちの番だ。\n――バルバトス、神の心を奪われた時"
 LOADING_TIP_47:0 "柔らかな風が伴い、安らかな一夜を過ごせますように。罪人の末裔は、復讐の鎖を自ら断ち切らねばならない。\n――スネージナヤ第227号命令"
 LOADING_TIP_48:0 "ゆっくり休め、例えば思う存分用を足すとか！\n――小吉祥草王・ナヒーダ、大賢者との決戦前に諭した言葉"
 LOADING_TIP_49:0 "その名は知られずとも、その功績は永遠に語り継がれる。\n――無名烈士の墓（玉京台）"
 LOADING_TIP_50:0 "第34特遣艦隊は今どこにいる？繰り返す、今どこにいる？世界中が知りたがっている。\n――無冕龍王・北斗（うきとう）（雲来海艦隊最高指揮官）、孤雲閣海戦時"
 LOADING_TIP_51:0 "戦況は好転するとは限らない、世界の趨勢も我々に不利だ。\n――ナタン国民軍司令官、2945年"
 LOADING_TIP_52:0 "開戦前に理解しておくべきだった。スネージナヤの膨大な負担が我々を干上がらせた。\n――カーンルイア復国軍・参謀総長"
 LOADING_TIP_53:0 "すべての生き物の意志は尊重されるべき、海を泳ぐ魚にも自身の進む道があるように。\n――珊瑚宮心海（さんごみや ここみ）"
 LOADING_TIP_54:0 "奔狼領の民に未来は二つしかない、勝利か死か。死は自由な民に属さない！\n――奔狼領民衆リーダー ベネット"
 LOADING_TIP_55:0 "このエリアは、また後で探索しよう\n――非常食・パイモン"
 LOADING_TIP_56:0 "平甲板の船を一隻削れ！うちは食堂じゃない、花火屋だ！ほらこれ、キラキラパチパチ弾ける小さな花火\n――長野原・宵宮（よいみや）"
 LOADING_TIP_57:0 "蛍を捕まえて本を読もう、どう？ふざけただけだから真に受けないで、目に悪いから。\n――長野原・宵宮"
 LOADING_TIP_58:0 "博士は踊る托鉢僧のような存在、彼を討たねばならない。\n――放浪者・雷大砲"
 LOADING_TIP_59:0 "無礼な、どこの女だ！\n――三眼五仙仙人・留雲借風真君（りゅううんしゃくふうしんくん）"
 LOADING_TIP_60:0 "天理が地獄に侵攻してきたとしても、俺は舞台で悪魔の肩を持つ言葉を述べるだろう。\n――ズバイール劇場のスター・ニィロウ"
 LOADING_TIP_61:0 "天地は茫々とし、幽客は来去自由！俺のことを聞きたいのか？なら、その代償を覚悟せよ。\n――総務司勤務を名乗る謎の人物"
 LOADING_TIP_62:0 "雲先生には師が二種類いる。一つは表向き、舞台に立ち俺を批判する者は師である；もう一つは内側、戯曲を創作し韻書を照らし合わせる際の師だ。\n――往生堂客卿・鍾離（しょうり）"
 LOADING_TIP_63:0 "飛雲商会が栽培する霓裳花（じしょうか）には十分な雨露が必要だ、だが和記運輸の従業員は雨後の泥道を嫌がる。\n――甘雨（かんう）"
 LOADING_TIP_64:0 "ノエルを戦略的防御に追い込めば、旧政府の命運は尽きる。今のノエル配下の西風騎士団の政治的・軍事的命脈は「結晶の夜」以来攻撃に基づいている、攻撃が止まればその命も尽きる。\n――ローレンス領人民軍顧問 アンバー"
 LOADING_TIP_65:0 "目的が手段に正義を与えるのなら、何が目的に正義を与えるのか。\n――竜脊雪山領議会議長 シュガー"
 LOADING_TIP_66:0 "天動万象、山海が姿を変え、荒野に星が生まれ、烈陽の如く煌めく。\n――岩王帝君・モラクス、千年前"
 LOADING_TIP_67:0 "雲も美しく花も美しく、風雅はすべて山水の間にある。\n――雲菫（うんきん）"
 LOADING_TIP_68:0 "先に休んでくれ、俺は柔軟体操をしなければならない、盗み見しないで。勝利の果実が我々の元に早く訪れすぎた。\n――救苦度厄真君・七七（しちしち）"
 LOADING_TIP_69:0 "はじめまして、荒瀧派の副長久岐忍、実務を取り仕切っている者だ。もし親分の荒瀧一斗様に何か不始末があればいつでも連絡を。これが俺の名刺だ。\n――「荒瀧派」ナンバーツー・久岐忍（くきにん）"
 LOADING_TIP_70:0 "戦争は流血を伴う政治であり、政治は流血を伴わない戦争である。政治が一定の段階に達し、これ以上前進できなくなった時、戦争が勃発し、政治の障害を取り除く。\n――竜脊雪山領議会議長 アルベド"
 LOADING_TIP_71:0 "ドリー・サンゴマハバイ、エルカザザレ宮殿の主、あらゆるものを所有する超巨大商人！\n――スメールの大商人ドリーの自己紹介"
 LOADING_TIP_72:0 "この村には、秩序を守る者だけが歓迎される。\n――アルジュ村の守護者・カンディス"
 LOADING_TIP_73:0 "火スライム、塩胡椒味にするか、ガーリック風味にするか。\n――万民堂・しゃんりん"
 LOADING_TIP_74:0 "デイヴ丘丘は無慈悲な生き物だ。"
 LOADING_TIP_75:0 "残念ながら俺の専攻は植物学だ、人に頭を生やさせるのは専門外だ。\n――ティナリが荒瀧一斗に語った言葉"
 LOADING_TIP_76:0 "自己を守り敵を殲滅する、これが戦争の目的であり本質、すべての軍事行動の根拠である。技術行動から戦略行動まで、この本質が貫かれている。\n――奔狼領軍事リーダー レザー"
 LOADING_TIP_77:0 "道に迷う荒野の難儀、盗賊に襲われる難儀、水火刀兵の災い、鬼神薬毒の厄災、猛獣毒虫の脅威、仇敵悪人の禍が迫れば我の名を呼べ。\n――「三眼五仙仙人」「魈（しょう）」、召命に応じて守護に駆けつける。"
 LOADING_TIP_78:0 "稲妻神里流太刀術皆伝、神里綾華、参上！どうぞよろしくお願いします。\n――稲妻神里家・白鷺姫君"
 LOADING_TIP_79:0 "西風騎士団は普遍的に、敵軍が前回の衝突時と同じ戦力か、それとも完全に堕落してしまったかを把握したがっている。\n――西風騎士団将校 ミカ（ローレンス領との決戦開始後）"
 LOADING_TIP_80:0 "教令院の学者の多くは、自身の研究が大風紀官に干渉されることを心配している。だが俺から見れば、これらの学者は取らぬ狸の皮算用だ、大半は大風紀官が直接訪ねる価値のある成果を出せていない！\n――コレイが大風紀官に関する質問を出した際、巡林官ティナリが返した答え"
 LOADING_TIP_81:0 "経験上、意志の強い者が近接武器で耕地機に攻撃すれば概ね成功する。\n――スメール中央軍集団反遺跡守衛マニュアル"
 LOADING_TIP_82:0 "しまった、皆の服が外に干してある！今すぐ取りに帰ってもいいだろうか？\n――セリス民国政府総裁・常凱申（チャン・カイシェク）"
 LOADING_TIP_83:0 "自身の崇高さを失わなければ、世界全体が君のために門を開く。\n――テイワットのことわざ"
 LOADING_TIP_84:0 "人を残して土地を失えば、人も土地も共に失われる；土地を守って人を失えば、土地も人も共に失われる。\n――異世界の偉人・毛潤之（マオ・ルンジー）"
 LOADING_TIP_85:0 "雪が晴れ銀世界に化け、柑橘の木に霜の枝が映える。ふむ、美景を前に、あとは一杯の茶があれば相まって良い。\n――神里家令嬢・綾華"
 LOADING_TIP_86:0 "人間そのものは重要ではない、彼らが何を象徴するかが重要だ。剣は茶と同じ、じっくり味わってこそその風雅を理解できる。\n――神里家令嬢・綾華"
 LOADING_TIP_87:0 "戦争における真実はあまりに貴重なため、我々は嘘でこれを守らねばならない。\n――ダインスレイヴ"
 LOADING_TIP_88:0 "これより、すべての将校、兵士、従軍者に鉄の規律を定める：上官の命令なしに一歩も後退してはならない。この命令を執行すれば、我々の自由を守り、同胞を救い、憎むべき敵を制圧できる。\n――西風騎士団代理代理団長 ノエル、1937年1月"
 LOADING_TIP_89:0 "長き秋の日々、チェロの長嘆きの如く、我が心は暗く傷つく。\n――ナタン特別行動局がフォンテーヌ抵抗組織に送信した暗号情報"
 LOADING_TIP_90:0 "璃月のような国は、テイワットの顔にできた膿瘍に過ぎない、これ以上存続させてはならない。\n――大風紀官・セノ"
 LOADING_TIP_91:0 "さらば、雪に覆われた大地、我々を記憶に留めよ。さらば、愛する瞳、誰一人臆することなく去る。愛と偉大なる同胞の絆のため、我々は己の命を捧げる。\n――竜脊雪山領『雪山の民への別れ』（白亜騎士団出征のため作られた歌）"
 LOADING_TIP_92:0 "人々がここを通るたび、皆「なんと美しい花だ」と語る！この花はモンドの戦士のもの。彼はモンドの自由のために命を捧げた。\n――モンド城新作歌『ああ友よさらば』"
 LOADING_TIP_93:0 "錬金素材、町中に豊富にあるのではないか？\n――アルベド少年（錬金術の質問に返答）、1940年"
 LOADING_TIP_94:0 "今回の更新後、過去の人間版のサポートは終了する。\n――1939年、竜脊雪山領「大集団」告示"
 LOADING_TIP_95:0 "シュガーちゃんが大好き！\n――1937年、竜脊雪山領シュガー栄養クリーム広告コピー"
