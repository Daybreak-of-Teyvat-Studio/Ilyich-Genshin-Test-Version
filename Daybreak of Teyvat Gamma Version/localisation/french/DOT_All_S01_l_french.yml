  ABY_disrupting_the_great_powers:0 "Puissance de destruction"
  ABY_disrupting_the_great_powers_desc:0 "Une frappe venue des profondeurs."
  ABY_the_torpedo:0 "Torpille mortelle"
  ABY_the_torpedo_desc:0 "Un coup fatal venu des eaux."
