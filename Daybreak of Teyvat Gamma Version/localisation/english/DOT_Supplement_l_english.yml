 SOV_workers_government_idea:0 "The Workers' Government"
 SOV_workers_government_idea_desc:0 "Long live the worker’s government. The Ruling Elite has been removed from power. The workers once more rule the country."
 SOV_yakovlev_design_bureau_dissolved_flag:0 "$SOV_mig_design_bureau_dissolved_flag$"
 SOV_young_builders_of_communism:0 "Young Builders of Communism"
 SOV_young_builders_of_communism_desc:0 "We are not building Socialism for the adults of today, we are building it for the children and the generations not yet born. They must be taught how to improve and build on the achievements we make, so that they can complete the work that we have started."
