 LOADING_TIP_104:0 "元素力、錬金薬、外国からの援助、これらは重要ではない。重要なのは前線の兵士が、自身の国を守っていると自覚することだ。\n――西風騎士団代理団長 ジン、1937年"
 LOADING_TIP_105:0 "獅子が率いる羊の群れは、羊が率いる獅子の群れより遥かに戦闘力が高い。\n――西風教会懲戒派リーダー ロザリア、1938年"
 LOADING_TIP_106:0 "流血を伴う虐殺が残酷で恐ろしいものだとすれば、それは我々が戦争をより真剣に受け止める理由になるだけで、人道のために剣を鈍らせ、最後に剣で腕を切り落とされるような事態になってはならない。\n――奔狼領行政リーダー フィッシュル、1938年"
