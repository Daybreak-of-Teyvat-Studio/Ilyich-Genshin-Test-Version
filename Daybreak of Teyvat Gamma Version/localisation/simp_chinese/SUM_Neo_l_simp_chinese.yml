 SUM_Neo.156.d:"须弥文字普及到每个村口。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。高塔投下的影子越来越长，傍晚时就盖住了半条街。"
 SUM_Neo.156.a:"按学派议决行事"
 SUM_Neo.156.b:"听从乡野的呼声"
 SUM_Neo.157.t:"真理不设限"
 SUM_Neo.157.d:"禁书令废除。真理被允许写在纸上。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。"
