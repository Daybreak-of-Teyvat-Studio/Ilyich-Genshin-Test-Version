#穴工提供的文本
 LYY_Intro.1.t:"岩的国土"
LYY_Intro.1.d:"璃月之民祀摩拉克斯，其事与璃月之兴并行。\n初，先人至岩间，垒石为灶，击石取火，火与灶皆出于石，众遂以为摩拉克斯所赐。\n其后营建璃月港，一砖一瓦皆手自筑之，山岩之上有草挺然，石缝间生而不枯，众亦以为神助。\n至今港中商贾出门贸易，必先拜祭，祈一岁之利；诸饭馆皆能言帝君曾于其店点某羹、赞某汤，言之凿凿，如亲见者。\n归离原上旧祠一区，梁柱已朽，而香火不绝，守祠者岁易其人。玉京台庭前有鼎三足，腹有铭文，字多漫漶，老吏云此初年所铸。\n凡此诸说，孰真孰妄，非问之帝君不能明。而璃月之人皆信终有一日得问之，盖其神永在，人与神并行之年，与其有生之年同长。时代虽易，凡民与仙众皆未尝设想无帝君之璃月。\n或亦以此，故至今无人往验其言。\n之所以言几乎者，盖§t有人§!不如此想。"
 LYY_Intro.1.a:"是谁？"
 LYY_Intro.2.t:"岩的国土"
 LYY_Intro.2.d:""
 LYY_Intro.2.a:"是谁？"
