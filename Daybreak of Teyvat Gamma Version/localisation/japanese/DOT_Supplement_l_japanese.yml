 ITA_devaluated_lira:0 "平価切下げとなったリラ"
 ITA_devaluated_lira_desc:0 "ここ最近の戦争に多額の費用を要していたため、我が国の経済は停滞していた。通貨の価値を下げたことで、この国の製品は国際市場での競争力を高め、切望されていた経済の加速が実現した。"
 ITA_dino_grandi:0 "ディーノ・グランディ"
 ITA_disgruntled_military:0 "不満を抱えた軍隊"
 ITA_disgruntled_military_desc:0 "我々が築いた新たな共和国を脅かす可能性のある、王政主義的な要素を軍隊から排除したことで、経験豊富な指導者を失う結果となってしまった。"
 ITA_disgruntlement_in_the_airforce:0 "空軍内の不満"
 ITA_disgruntlement_in_the_airforce_desc:0 "空軍には部隊を拡張するための新たな物資や資金を約束されていたが、手元にはいずれも届いておらず、隊内では不満が蔓延っている。"
 ITA_disgruntlement_in_the_army:0 "陸軍内の不満"
 ITA_disgruntlement_in_the_army_desc:0 "期待していた早さでの拡張が叶わなかった責任を負わされ、軍内に不満が蔓延るようになった。"
 ITA_divino_duce_1:0 "神に等しき首領"
 ITA_divino_duce_1_desc:0 "狂信者を引き寄せる強烈な個性を持つ[ITA.GetLeader]は、イタリア人の忠誠を欲しいままにし、彼らもまたドゥーチェを見限ったり裏切ったりすることは決してない。彼らはどんな苦難にも容易く耐え抜き、絶対に降伏することはないだろう。"
