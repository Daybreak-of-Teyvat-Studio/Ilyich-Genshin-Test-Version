# ===== スメール国家方針樹 =====
 SUM_PRO_Dawn_of_Sabzeruz:0 "花神誕祭の鐘"
 SUM_PRO_Dawn_of_Sabzeruz_desc:0 "花神誕祭の鐘がスメールシティに響く。教令院の塔の下、人々と学者は左右に分かれて立ち、誰もが知っている事実を口にしない。草神は今も浄善宮に閉じ込められたままだ。BY 荷花酥"
 SUM_PRO_Aka_Shadow:0 "大賢者の影"
 SUM_PRO_Aka_Shadow_desc:0 "大賢者アザールは議事堂で一人スメールの進路を決め、六大学派の長はただ列席しているだけだ。"
 SUM_PRO_For_Tighnari:0 "林巡官の報告"
 SUM_PRO_For_Tighnari_desc:0 "林巡官ティナリが報告を差し出す。死域はパルディスディアイの低地に沿って広がりつつある。"
 SUM_PRO_For_Collei:0 "忘れられた病"
 SUM_PRO_For_Collei_desc:0 "コレイの魔鱗病が再び口にされる。禁忌の知識と関係があると認めたがる者は誰もいない。"
 SUM_PRO_Des_Aaru:0 "アアル村の灯"
 SUM_PRO_Des_Aaru_desc:0 "アアル村の灯がキャンディスの槍を照らす。村を守る者たちは砂漠のために教令院の税吏を阻んでいる。"
 SUM_PRO_Ak_Knowledge:0 "知識の値段"
 SUM_PRO_Ak_Knowledge_desc:0 "知識には値札が付き、学者の年季は学問そのものより高く売れる。"
 SUM_PRO_Gen_Project:0 "造神計画"
 SUM_PRO_Gen_Project_desc:0 "教令院が造神計画を始める。人形の体で新しい神を作り、囚われた草神に代えようというのだ。"
 SUM_PRO_Gen_Puppet:0 "人形の体"
 SUM_PRO_Gen_Puppet_desc:0 "散兵の体が教令院の地下へ運ばれ、機械と神性が継ぎ合わされる。"
 SUM_PRO_Gen_Fatui:0 "実験室の来客"
 SUM_PRO_Gen_Fatui_desc:0 "ファデュイの使者が実験室を頻繁に出入りし、教令院は見なかったふりをする。"
 SUM_PRO_Fat_Dottore:0 "ドットーレの提案"
 SUM_PRO_Fat_Dottore_desc:0 "ドットーレはスメールの学者と資源で自分の実験を完成させようと提案する。"
 SUM_PRO_Fat_Factory:0 "砂漠の工場"
 SUM_PRO_Fat_Factory_desc:0 "砂漠の奥にファデュイの工場が現れ、煙突は昼夜止まらない。"
 SUM_PRO_Ere_Revolt:0 "蜂起の噂"
 SUM_PRO_Ere_Revolt_desc:0 "砂丘の間に蜂起の噂が流れ、金砂旅団が集まり始める。"
 SUM_PRO_Ara_Vana:0 "夢の世界"
 SUM_PRO_Ara_Vana_desc:0 "アランナラが夢の世界を林巡官の前に広げる。そこには大慈樹王の影がまだ残っている。"
 SUM_PRO_The_Choice:0 "進路の選択"
 SUM_PRO_The_Choice_desc:0 "スメールの前に三つの道が置かれる。神を迎え戻すか、権力を学者と砂漠の民に渡すか、造神計画をやり遂げるか。"
 SUM_ST_Crown_of_the_Sacred_Tree:0 "聖樹の戴冠"
 SUM_ST_Crown_of_the_Sacred_Tree_desc:0 "浄善宮の扉が押し開けられる。五百年囚われていた小吉祥草王が檻を出て、スメールの空が初めて彼女のために明るくなる。"
 SUM_ST_Sanctuary_Crown:0 "草神の冠"
 SUM_ST_Sanctuary_Crown_desc:0 "学者たちが草神に冠を戴かせる。もはや看守としてではない。"
 SUM_ST_Sanctuary_Pilgrim:0 "巡礼の道"
 SUM_ST_Sanctuary_Pilgrim_desc:0 "浄善宮へ続く山道に巡礼者の長い列ができる。"
 SUM_ST_Sanctuary_Temple:0 "神殿の再建"
 SUM_ST_Sanctuary_Temple_desc:0 "荒れた神殿が建て直され、工匠たちは昼夜を問わず働く。"
 SUM_ST_Sanctuary_Law:0 "神権法典"
 SUM_ST_Sanctuary_Law_desc:0 "神権法典が公布され、法は草神の名で行われる。"
 SUM_ST_Sanctuary_Throne:0 "神座の戴冠"
 SUM_ST_Sanctuary_Throne_desc:0 "小吉祥草王が浄善宮で戴冠する。スメールが初めて自らの神に礼をする。"
 SUM_ST_Dream_Night:0 "長い夜と夢"
 SUM_ST_Dream_Night_desc:0 "長い夜のなか、夢が再びすべての枕元へ戻る。"
 SUM_ST_Dream_Dance:0 "花神の舞"
 SUM_ST_Dream_Dance_desc:0 "花神の舞が新たに振り付けられ、踊り手は雨林と砂漠の双方から選ばれる。"
 SUM_ST_Dream_School:0 "夢の学派"
 SUM_ST_Dream_School_desc:0 "妙論派の画家と素論派の天象学者がともに夢の学問を開く。"
 SUM_ST_Dream_Truth:0 "夢の中の真実"
 SUM_ST_Dream_Truth_desc:0 "草神は夢のなかで、世界樹に塗り消された記憶を学者たちに見せる。"
 SUM_ST_Ara_Vana:0 "ヴィマラ村の夢"
 SUM_ST_Ara_Vana_desc:0 "ヴィマラ村の子供たちが再びアランナラの声を聞く。"
 SUM_ST_Ara_Flower:0 "ナラの花"
 SUM_ST_Ara_Flower_desc:0 "ナラの花が雨林の縁に咲き、アランナラはそれを約束の証と呼ぶ。"
 SUM_ST_Ara_World:0 "夢の世界"
 SUM_ST_Ara_World_desc:0 "草神とアランナラがともに夢の世界を守り、スメールの夢には境界ができる。"
 SUM_ST_Ara_Blessing:0 "アランナラの祝福"
 SUM_ST_Ara_Blessing_desc:0 "アランナラの祝福がスメールの一本一本の木に降りる。"
 SUM_ST_Tree_Rukkhadevata:0 "大慈樹王の遺産"
 SUM_ST_Tree_Rukkhadevata_desc:0 "大慈樹王が残したものは多くない。塗り消された印と、誰も覚えていない名前だけだ。"
 SUM_ST_Tree_Recall:0 "古い名を呼び戻す"
 SUM_ST_Tree_Recall_desc:0 "彼女は自分の名を世界樹に書き戻そうとし、筆は宙で止まる。"
 SUM_ST_Tree_Scroll:0 "樹下の典籍"
 SUM_ST_Tree_Scroll_desc:0 "世界樹の下に埋められた典籍が掘り出され、誰にも読めない文字で埋まっている。"
 SUM_ST_Tree_Truth:0 "樹の真実"
 SUM_ST_Tree_Truth_desc:0 "スメールの人々はついに知る。草神は初代の草神ではないと。"
 SUM_ST_Rain_Patrol:0 "雨林の巡回"
 SUM_ST_Rain_Patrol_desc:0 "林巡官が葉脈のような小道を巡回する。"
 SUM_ST_Rain_Poison:0 "死域の掃討"
 SUM_ST_Rain_Poison_desc:0 "死域が一区画ずつ消され、草木が再び戻ってくる。"
 SUM_ST_Rain_Mushroom:0 "菌類の研究"
 SUM_ST_Rain_Mushroom_desc:0 "生論派が菌類の研究をまっとうな学問にする。"
 SUM_ST_Rain_Forest:0 "雨林全土"
 SUM_ST_Rain_Forest_desc:0 "雨林の全土が林巡官の守備範囲に入る。"
 SUM_ST_Seal_Reject:0 "禁書の封存"
 SUM_ST_Seal_Reject_desc:0 "禁書が石室に封じられ、鍵は草神に預けられる。"
 SUM_ST_Seal_Purge:0 "邪術の掃討"
 SUM_ST_Seal_Purge_desc:0 "林巡隊と翠緑の衛隊が、禁術を私かに学ぶ者たちの巣を掃討する。"
 SUM_ST_Seal_Sand:0 "砂虫の封印"
 SUM_ST_Seal_Sand_desc:0 "砂漠で眠る砂虫が再び封印される。"
 SUM_ST_Seal_Eternal:0 "永久の封印"
 SUM_ST_Seal_Eternal_desc:0 "封印が完成し、スメールと禁忌の間には雨林ひとつが横たわる。"
 SUM_ST_The_Crowned_God:0 "蒼翠戴冠の世"
 SUM_ST_The_Crowned_God_desc:0 "小吉祥草王が浄善宮で戴冠する。雨林と砂漠が初めて同じ名に頭を下げ、スメールは蒼翠の世に入る。"
 SUM_RP_Republic_of_Scholars:0 "学者共和"
 SUM_RP_Republic_of_Scholars_desc:0 "大賢者の議事堂が押し開けられる。学者、商人、砂漠の村の守り手がともに入り、スメールに新しい法を求める。"
 SUM_RP_Dar_Spantamad:0 "知論派の実験室"
 SUM_RP_Dar_Spantamad_desc:0 "知論派の実験室が公開され、成果は密室に閉じ込められなくなる。"
 SUM_RP_Dar_Kshahrewar:0 "妙論派の図面"
 SUM_RP_Dar_Kshahrewar_desc:0 "妙論派が図面を持ち出し、スメールの家は人の背丈に合わせて建てるべきだと言う。"
 SUM_RP_Dar_Exam:0 "学者の考課"
 SUM_RP_Dar_Exam_desc:0 "学者の昇進は考課で決まり、生まれはものを言わなくなる。"
 SUM_RP_Dar_Academy:0 "六派共和"
 SUM_RP_Dar_Academy_desc:0 "六大学派が対等に立ち、スメールの学問は一派の専断ではなくなる。"
 SUM_RP_Par_Vote:0 "最初の表決"
 SUM_RP_Par_Vote_desc:0 "スメールが初めて表決で国政を決める。"
 SUM_RP_Par_Court:0 "独立した法廷"
 SUM_RP_Par_Court_desc:0 "法廷は教令院から独立し、賢者も裁かれる。"
 SUM_RP_Par_Budget:0 "予算の審議"
 SUM_RP_Par_Budget_desc:0 "国庫の支出はひとつ残らず議会を通る。"
 SUM_RP_Par_Constitution:0 "憲法の公布"
 SUM_RP_Par_Constitution_desc:0 "憲法が公布される。草神の名は証人として最後の条に書かれる。"
 SUM_RP_Com_Mint:0 "鋳貨権"
 SUM_RP_Com_Mint_desc:0 "鋳貨権が議会に戻り、市中の私銭は兌換される。"
 SUM_RP_Com_Trade:0 "七国通商"
 SUM_RP_Com_Trade_desc:0 "スメールが隣国と通商条項を結び、香辛料と珈琲に新たな出口ができる。"
 SUM_RP_Com_Plantation:0 "香辛料の農園"
 SUM_RP_Com_Plantation_desc:0 "香辛料の農園が広がり、砂漠の縁にも作物が植えられる。"
 SUM_RP_Com_Rail:0 "砂海鉄道"
 SUM_RP_Com_Rail_desc:0 "鉄道が砂漠へ伸び、隊商と旅団の関係は微妙になる。"
 SUM_RP_Kno_Archive:0 "万巻の書庫"
 SUM_RP_Kno_Archive_desc:0 "教令院の密室が開かれ、万巻の書庫が万人に開かれる。"
 SUM_RP_Kno_Women:0 "女学者の議席"
 SUM_RP_Kno_Women_desc:0 "女学者が議席を得て、学派の古い掟が緩む。"
 SUM_RP_Kno_Ruin:0 "遺跡考証"
 SUM_RP_Kno_Ruin_desc:0 "遺跡考証が顕学となり、赤王の時代の壁が一枚ずつ測られる。"
 SUM_RP_Kno_All:0 "知識は万人のもの"
 SUM_RP_Kno_All_desc:0 "スメールは知識が万人のものであると宣言する。"
 SUM_RP_Kno_Enlighten:0 "啓蒙の世"
 SUM_RP_Kno_Enlighten_desc:0 "学士たちが塔を出て、市とオアシスへ入っていく。"
 SUM_RP_Cit_Rights:0 "砂漠の民の公民権"
 SUM_RP_Cit_Rights_desc:0 "砂漠の民が公民権を得て、税吏は気ままにオアシスへ踏み込めなくなる。"
 SUM_RP_Cit_Oasis:0 "オアシス開墾"
 SUM_RP_Cit_Oasis_desc:0 "オアシス開墾計画が進み、砂漠の民は自分の土地を持つ。"
 SUM_RP_Cit_Gold:0 "金砂旅団の帰化"
 SUM_RP_Cit_Gold_desc:0 "金砂旅団は帰化を選べる。旗と編制はそのままに。"
 SUM_RP_Cit_Union:0 "スメール一体"
 SUM_RP_Cit_Union_desc:0 "血と林がひとつのスメールになる。"
 SUM_RP_Edu_Militia:0 "民兵制度"
 SUM_RP_Edu_Militia_desc:0 "民兵制度が広がり、雨林と砂漠がそれぞれの地を守る。"
 SUM_RP_Edu_Fort:0 "国境要塞"
 SUM_RP_Edu_Fort_desc:0 "要塞がスメールと隣国の国境に並ぶ。"
 SUM_RP_Edu_Tactic:0 "砂漠の戦法"
 SUM_RP_Edu_Tactic_desc:0 "将校たちが砂漠の遊撃戦を操典に書き込む。"
 SUM_RP_Edu_Army:0 "新式陸軍"
 SUM_RP_Edu_Army_desc:0 "スメールは新式陸軍を持つ。それは共和国最後の保険だ。"
 SUM_RP_The_Republic_Standing:0 "共和の成立"
 SUM_RP_The_Republic_Standing_desc:0 "憲法が効力を発した日、学者、商人、狩人、村の守り手が議事堂の前に並ぶ。スメールは共和国になった。"
 SUM_RP_The_Gilded_Commune:0 "金砂コミューン"
 SUM_RP_The_Gilded_Commune_desc:0 "金砂旅団と砂漠の民が教令院最後の塔を倒す。スメールの富が初めてスメール人の手に残る。"
 SUM_GT_Throne_of_Genesis:0 "造神の王座"
 SUM_GT_Throne_of_Genesis_desc:0 "教令院の地下で、人形の体に神の心が接続される。スメールは人の手で神を作り、自分たちを治めさせようとしている。"
 SUM_GT_Gen_Resume:0 "造神の再開"
 SUM_GT_Gen_Resume_desc:0 "大賢者が造神計画の再開を命じ、書類が密室から運び出される。"
 SUM_GT_Gen_Shell:0 "人形の外殻"
 SUM_GT_Gen_Shell_desc:0 "人形の体が組み直され、関節には赤王の時代の部品が使われる。"
 SUM_GT_Gen_Core:0 "神の心"
 SUM_GT_Gen_Core_desc:0 "神の心が人形の胸に据えられる。"
 SUM_GT_Gen_Test:0 "試験場"
 SUM_GT_Gen_Test_desc:0 "試験は砂丘の下で行われ、被験者の名簿は封印される。"
 SUM_GT_Gen_Divinity:0 "神性の注入"
 SUM_GT_Gen_Divinity_desc:0 "神性が少しずつ注ぎ込まれ、人形の指が動き始める。"
 SUM_GT_Gen_Knowledge:0 "知識の奔流"
 SUM_GT_Gen_Knowledge_desc:0 "虚空端末がすべての知識を人形に流し込み、それが最初に覚えた言葉はスメールだった。"
 SUM_GT_Gen_Mechanic:0 "機械の神"
 SUM_GT_Gen_Mechanic_desc:0 "人形が立ち上がる。それはどの賢者よりも神らしく見える。"
 SUM_GT_Gen_Perfect:0 "完全な人形"
 SUM_GT_Gen_Perfect_desc:0 "人形の体は完璧に調整され、教令院はそれが機械にすぎないと認めようとしない。"
 SUM_GT_Gen_Ritual:0 "降神の儀"
 SUM_GT_Gen_Ritual_desc:0 "降神の儀が浄善宮の前で行われ、六大学派がすべて参列する。"
 SUM_GT_Gen_Awaken:0 "新しき神の開眼"
 SUM_GT_Gen_Awaken_desc:0 "新しい神が目を開ける。最初に見たものは、跪く賢者たちだった。"
 SUM_GT_Gen_Name:0 "新しき神の命名"
 SUM_GT_Gen_Name_desc:0 "賢者たちが新しい神に名を与える。その名には赤王も教令院も含まれている。"
 SUM_GT_Gen_Enthrone:0 "迎神即位"
 SUM_GT_Gen_Enthrone_desc:0 "新しい神が即位し、浄善宮の旧き神は脇殿へ移される。"
 SUM_GT_Gen_Complete:0 "造神の完成"
 SUM_GT_Gen_Complete_desc:0 "造神が完成する。スメールは命令できる神を持つ。"
 SUM_GT_Des_Memory:0 "赤王の記憶"
 SUM_GT_Des_Memory_desc:0 "賢者たちが赤王の記憶を掘り起こし、それがスメールのより古い誇りだと言う。"
 SUM_GT_Des_Pillar:0 "列柱砂原"
 SUM_GT_Des_Pillar_desc:0 "列柱砂原の古い柱が再び立ち、新しく書かれた頌詞で埋められる。"
 SUM_GT_Des_City:0 "グーラバードの復興"
 SUM_GT_Des_City_desc:0 "グーラバードの廃墟に再び壁が起きる。"
 SUM_GT_Des_Cult:0 "赤王の信徒"
 SUM_GT_Des_Cult_desc:0 "赤王の信徒が編入され、新しい神の最初の祭司になる。"
 SUM_GT_Des_Gold:0 "黄金の夢"
 SUM_GT_Des_Gold_desc:0 "黄金時代の夢がスメールの人々に語り直される。"
 SUM_GT_Des_Remnant:0 "残響"
 SUM_GT_Des_Remnant_desc:0 "砂漠の奥の残響が神託として扱われる。"
 SUM_GT_Des_Echo:0 "砂漠のこだま"
 SUM_GT_Des_Echo_desc:0 "こだまが砂丘の間に広がり、赤王が戻ると告げる。"
 SUM_GT_Des_Oasis:0 "永遠のオアシス"
 SUM_GT_Des_Oasis_desc:0 "永遠のオアシスの幻が砂海の上に浮かぶ。"
 SUM_GT_Des_King:0 "砂中の王"
 SUM_GT_Des_King_desc:0 "新しい神は自らを砂中の王の後継者と称する。"
 SUM_GT_Des_Legion:0 "赤王の軍団"
 SUM_GT_Des_Legion_desc:0 "赤王の軍団が編成され、その多くは砂漠の傭兵だ。"
 SUM_GT_Des_Wrath:0 "審判の日"
 SUM_GT_Des_Wrath_desc:0 "審判の日が定められ、教令院は古い借りを清算し始める。"
 SUM_GT_Des_Revive:0 "赤王の帰還"
 SUM_GT_Des_Revive_desc:0 "賢者たちは赤王の帰還を宣言する。それは人形の神に宿っている。"
 SUM_GT_Des_Throne:0 "砂漠の王座"
 SUM_GT_Des_Throne_desc:0 "砂漠の王座がグーラバードに立ち、スメールの旧き神は忘れられる。"
 SUM_GT_Dot_Visit:0 "ドットーレの来訪"
 SUM_GT_Dot_Visit_desc:0 "ドットーレが自らスメールシティを訪れ、教令院は丁重にもてなす。"
 SUM_GT_Dot_Deal:0 "ファデュイとの協定"
 SUM_GT_Dot_Deal_desc:0 "スメールはスネージナヤと協定を結び、その条項は余白に手で書かれている。"
 SUM_GT_Dot_Lab:0 "地下実験室"
 SUM_GT_Dot_Lab_desc:0 "地下実験室が拡張され、砂丘の下の洞窟へ通じる。"
 SUM_GT_Dot_Subject:0 "試験体"
 SUM_GT_Dot_Subject_desc:0 "試験体の名簿は長くなる。多くは追放された砂の民だ。"
 SUM_GT_Dot_Wisdom:0 "知識の交易"
 SUM_GT_Dot_Wisdom_desc:0 "知識が取引され、教令院は機械の図面を得る。"
 SUM_GT_Dot_Machine:0 "機械の造物"
 SUM_GT_Dot_Machine_desc:0 "機械の造物が流れ作業から下り、最初の一群はそのまま兵営へ入る。"
 SUM_GT_Dot_Factory:0 "工場の量産"
 SUM_GT_Dot_Factory_desc:0 "工場は昼夜止まらず、スメールの空は灰色に覆われる。"
 SUM_GT_Dot_Weapon:0 "人形兵器"
 SUM_GT_Dot_Weapon_desc:0 "人形兵器が配備され、兵士は味方を恐れ始める。"
 SUM_GT_Dot_Clone:0 "切片"
 SUM_GT_Dot_Clone_desc:0 "ドットーレの切片がスメールを歩き、どれが本人か誰にも分からない。"
 SUM_GT_Dot_Blasphemy:0 "冒涜の造物"
 SUM_GT_Dot_Blasphemy_desc:0 "スメールの学者がこの世界に属さないものを作り始める。"
 SUM_GT_Dot_Alliance:0 "スネージナヤ同盟"
 SUM_GT_Dot_Alliance_desc:0 "スメールはスネージナヤと同盟し、その砂漠はスネージナヤの前哨になる。"
 SUM_GT_Dot_Master:0 "禁忌の掌握"
 SUM_GT_Dot_Master_desc:0 "教令院は禁忌を掌握したと自認し、それを戸棚に鎖で閉じる。"
 SUM_GT_Dot_Supreme:0 "神と並ぶ"
 SUM_GT_Dot_Supreme_desc:0 "スメールの神はスネージナヤの卓に座り、第二位と肩を並べる。"
 SUM_GT_Mac_Ruin:0 "遺跡の発掘"
 SUM_GT_Mac_Ruin_desc:0 "遺跡が組織的に発掘され、赤王の機械が次々と出土する。"
 SUM_GT_Mac_Atlas:0 "機械図譜"
 SUM_GT_Mac_Atlas_desc:0 "妙論派が出土した機械を図譜に描き起こす。"
 SUM_GT_Mac_Ameta:0 "アマタの機核"
 SUM_GT_Mac_Ameta_desc:0 "アマタの機核が複製され、新しい神の骨組みになる。"
 SUM_GT_Mac_Energy:0 "エネルギー・モジュール"
 SUM_GT_Mac_Energy_desc:0 "エネルギーモジュールが量産され、スメールの工房に灯が下がる。"
 SUM_GT_Mac_Remelt:0 "熔鋳の術"
 SUM_GT_Mac_Remelt_desc:0 "熔鋳の術が回復し、捨てられた機関を作り直せるようになる。"
 SUM_GT_Mac_Tablet:0 "熔鋳石板"
 SUM_GT_Mac_Tablet_desc:0 "熔鋳石板が組み合わされ、失われた一そろいの工芸が記されている。"
 SUM_GT_Mac_Khaj:0 "カージュ・ニスートの鍵"
 SUM_GT_Mac_Khaj_desc:0 "カージュ・ニスートの鍵が見つかる。それが開けるのは、開けてはならない扉だ。"
 SUM_GT_Mac_Factory:0 "機械工場"
 SUM_GT_Mac_Factory_desc:0 "機械工場が動き出し、工匠は歯車に置き換えられる。"
 SUM_GT_Mac_Army:0 "自動軍団"
 SUM_GT_Mac_Army_desc:0 "自動軍団が列を成す。給金もいらず、降伏も知らない。"
 SUM_GT_Mac_Golem:0 "石像の巨兵"
 SUM_GT_Mac_Golem_desc:0 "赤王の石像が呼び覚まされ、隊伍の先頭を歩く。"
 SUM_GT_Mac_Sky:0 "浮遊都市"
 SUM_GT_Mac_Sky_desc:0 "浮遊都市の図面が復元され、スメールは空に都を築こうとする。"
 SUM_GT_Mac_Core:0 "核心中枢"
 SUM_GT_Mac_Core_desc:0 "核心中枢が完成し、スメール全土が機械で統制される。"
 SUM_GT_Mac_Age:0 "機械の世"
 SUM_GT_Mac_Age_desc:0 "スメールは機械の世に入る。人こそがこの機械で最も不正確な部品だ。"
 SUM_GT_Aby_Whisper:0 "深淵の囁き"
 SUM_GT_Aby_Whisper_desc:0 "深淵が世界樹を通して語りかける。スメールの造神を手伝ってもよいと。"
 SUM_GT_Aby_Pact:0 "深淵との取引"
 SUM_GT_Aby_Pact_desc:0 "教令院は密かに深淵と取引し、造神に必要なものを手に入れる。"
 SUM_GT_Aby_Knowledge:0 "禁忌の知識"
 SUM_GT_Aby_Knowledge_desc:0 "赤王がかつて触れた禁忌の知識が再び取り出される。"
 SUM_GT_Aby_Corrupt:0 "侵蝕"
 SUM_GT_Aby_Corrupt_desc:0 "雨林が侵蝕され始め、死域が広がる。"
 SUM_GT_Aby_Monster:0 "魔獣"
 SUM_GT_Aby_Monster_desc:0 "砂漠の奥で魔獣が目覚め、交易路が絶える。"
 SUM_GT_Aby_Nail:0 "判罰の釘"
 SUM_GT_Aby_Nail_desc:0 "判罰の釘が一本抜かれ、それが落ちた地に亀裂が走る。"
 SUM_GT_Aby_Void:0 "虚空の門"
 SUM_GT_Aby_Void_desc:0 "虚空の門が砂丘の下に開き、その向こうから風が吹き出す。"
 SUM_GT_Aby_Sandworm:0 "砂虫の覚醒"
 SUM_GT_Aby_Sandworm_desc:0 "眠っていた砂虫が目覚め、列柱砂原は彼らの狩場になる。"
 SUM_GT_Aby_Fallen:0 "堕落した学者"
 SUM_GT_Aby_Fallen_desc:0 "学者が禁忌の知識に呑まれ、教令院は彼らを名簿から消す。"
 SUM_GT_Aby_Rite:0 "禁忌の儀"
 SUM_GT_Aby_Rite_desc:0 "禁忌の儀が新しい神の前で完遂され、スメールの夜は長くなる。"
 SUM_GT_Aby_Legion:0 "深淵の軍団"
 SUM_GT_Aby_Legion_desc:0 "深淵のものが軍団に編成され、スメールのために戦う。"
 SUM_GT_Aby_Black:0 "漆黑の力"
 SUM_GT_Aby_Black_desc:0 "漆黑の力が新しい神の体に注がれ、神は言うことを聞かなくなる。"
 SUM_GT_Aby_Abyss:0 "深淵を抱く"
 SUM_GT_Aby_Abyss_desc:0 "スメールは認める。手にしているものは、もはや自分では制御できないものだと。"
 SUM_GT_Iro_Censor:0 "禁書令"
 SUM_GT_Iro_Censor_desc:0 "禁書令が雨林の薬草と砂漠の歌にまで及ぶ。"
 SUM_GT_Iro_Purge:0 "異論の粛清"
 SUM_GT_Iro_Purge_desc:0 "造神計画に反対する学者が粛清され、学派には一つの声だけが残る。"
 SUM_GT_Iro_Church:0 "学院国教"
 SUM_GT_Iro_Church_desc:0 "教令院が国教とされ、草神の聖所は学堂に変えられる。"
 SUM_GT_Iro_Total:0 "全面統治"
 SUM_GT_Iro_Total_desc:0 "教令院がスメールの一本一本の糸を握る。"
 SUM_GT_The_Throne_of_Gods:0 "造神の王座"
 SUM_GT_The_Throne_of_Gods_desc:0 "人形の神が王座に就き、教令院がその背後に立つ。スメールは命令できる神と、命令を下す学院を持つ。"
 SUM_GT_Eternal_Regency:0 "教令院の永久摂政"
 SUM_GT_Eternal_Regency_desc:0 "神は作られたが、誰もそれを統治させようとしない。教令院は神の名で摂政を宣言し、いつまでも摂政を続ける。"
 SUM_PL_Sands_and_Crowns:0 "砂と林"
 SUM_PL_Sands_and_Crowns_desc:0 "教令院の勅令が雨林の木と砂漠の壁の双方に貼られる。スメールの都と荒野は同じ法の下で生きねばならない。"
 SUM_PL_Int_Autonomy:0 "砂漠の自治"
 SUM_PL_Int_Autonomy_desc:0 "村の守り手が自治の文書を受け取る。"
 SUM_PL_Int_Garrison:0 "駐屯軍"
 SUM_PL_Int_Garrison_desc:0 "教令院がオアシスの縁に軍を駐屯させ、隊商は静かになる。"
 SUM_PL_Int_Final:0 "スメール全土"
 SUM_PL_Int_Final_desc:0 "スメール全土が一冊の図帳に収まる。"
 SUM_PL_Ere_Officer:0 "傭兵上がりの将校"
 SUM_PL_Ere_Officer_desc:0 "戦をくぐった傭兵が学堂に送られ、出てくれば将校だ。"
 SUM_PL_Ere_Legion:0 "金砂軍団"
 SUM_PL_Ere_Legion_desc:0 "金砂軍団が編成され、旗にはスメールと自らの紋章が縫い込まれる。"
 SUM_PL_Ere_Banner:0 "金砂の旗"
 SUM_PL_Ere_Banner_desc:0 "金砂の旗が掲げられ、旅団とスメールの軍が同じ場所に立つ。"
 SUM_PL_Arm_Ranger:0 "雨林の猟兵"
 SUM_PL_Arm_Ranger_desc:0 "猟兵は林巡隊から選ばれる。森の歩き方なら誰にも負けない。"
 SUM_PL_Arm_Air:0 "スメール空軍"
 SUM_PL_Arm_Air_desc:0 "スメール空軍が成立し、飛行士は素論派の天象学者から選ばれる。"
 SUM_PL_Arm_Modern:0 "現代陸軍"
 SUM_PL_Arm_Modern_desc:0 "スメールの陸軍が形を成す。狩人、傭兵、学者、砂の民でできている。"
 SUM_PL_Nav_Fleet:0 "スメール艦隊"
 SUM_PL_Nav_Fleet_desc:0 "スメール艦隊が編成され、その旗号はオルモス港の帆柱に掲がる。"
 SUM_PL_Nav_Customs:0 "税関"
 SUM_PL_Nav_Customs_desc:0 "税関が立ち、密輸船は迂回し始める。"
 SUM_PL_Nav_Sea:0 "海のスメール"
 SUM_PL_Nav_Sea_desc:0 "スメールの船団がオルモス港を出て、七国の港へ向かう。"
 SUM_PL_Dip_Natlan:0 "ナタ国境"
 SUM_PL_Dip_Natlan_desc:0 "ナタの部族とスメールが砂の関で対峙し、どちらも先に退かない。"
 SUM_PL_Dip_Mond:0 "モンドの隊商"
 SUM_PL_Dip_Mond_desc:0 "モンドの隊商が風車と酒を運んでくる。"
 SUM_PL_Dip_Voice:0 "スメールの声"
 SUM_PL_Dip_Voice_desc:0 "スメールの声が七国の議卓に現れ始める。"
 SUM_PL_Won_Ormos:0 "オルモスの座乗艦"
 SUM_PL_Won_Ormos_desc:0 "オルモス港の外で、座乗艦の帆柱が再び立つ。"
 SUM_PL_Won_Wood:0 "木材と香辛料"
 SUM_PL_Won_Wood_desc:0 "木材と香辛料がスメールの二本の脚になる。"
 SUM_PL_Won_Legacy:0 "スメールの遺産"
 SUM_PL_Won_Legacy_desc:0 "スメールは自らの過去を典籍に収め、後の者のために残す。"
 SUM_PL_The_Sands_and_the_Leaves:0 "砂と葉の和解"
 SUM_PL_The_Sands_and_the_Leaves_desc:0 "雨林と砂漠が同じ法の下で暮らす。スメールの都と荒野の間で、初めて刃ではなく言葉が交わされる。"
 SUM_PRO_Aka_Six_Darshan:0 "六大学派の座次"
 SUM_PRO_Aka_Six_Darshan_desc:0 "生論・素論・知論・明論・因論・妙論。六派それぞれに思惑があり、座次の争いはそのまま権力の争いである。"
 SUM_PRO_Aka_Censor:0 "禁書令"
 SUM_PRO_Aka_Censor_desc:0 "教令院が禁書令を発した。赤王、禁忌の知識、世界樹の記憶に関わる書庫はすべて封印される。"
 SUM_PRO_For_Gandharva:0 "ガンダルヴァ村の低地"
 SUM_PRO_For_Gandharva_desc:0 "ガンダルヴァ村の狩人たちが自ら集まり、教令院に代わって雨林の境界を守っている。"
 SUM_PRO_Des_Morning_Wind:0 "砂海の朝風"
 SUM_PRO_Des_Morning_Wind_desc:0 "朝風がヒュポスタイル砂原を渡り、隊商は赤王の残した旧道を進む。"
 SUM_PRO_Des_Eremites:0 "エルマイト旅団の旗"
 SUM_PRO_Des_Eremites_desc:0 "砂丘の間でエルマイト旅団の旗が立ち上がっては消える。彼らの契約はモラだけを相手にし、教令院には従わない。"
 SUM_PRO_Ak_Terminal:0 "アカシャの端末"
 SUM_PRO_Ak_Terminal_desc:0 "アカシャは知識をすべての者に配り、すべての者の夢を奪っていく。"
 SUM_PRO_Ak_Dream:0 "奪われた夢"
 SUM_PRO_Ak_Dream_desc:0 "スメールの人々はもう夢を見ない。教令院は進歩と言い、アランナラは災厄と言う。"
 SUM_PRO_Fat_Second:0 "第二席の招待状"
 SUM_PRO_Fat_Second_desc:0 "第二席の招待状が大賢者の机に届く。物腰は丁寧で、条件は苛酷だった。"
 SUM_PRO_Ere_Blood:0 "血の掟"
 SUM_PRO_Ere_Blood_desc:0 "エルマイト旅団は血の掟を守る。血脈は大地と結びつき、飢饉の記憶は骨の髄に刻まれている。"
 SUM_PRO_Ere_Mercenary:0 "傭兵の契約"
 SUM_PRO_Ere_Mercenary_desc:0 "傭兵は教令院の荷を運び、砂漠の部族の武器も運ぶ。"
 SUM_PRO_Ara_Song:0 "アランナラの歌"
 SUM_PRO_Ara_Song_desc:0 "アランナラは雨林の奥で歌う。その声を聞けるのは子どもだけである。"
 SUM_PRO_Ara_Rana:0 "ラナの失踪"
 SUM_PRO_Ara_Rana_desc:0 "森の巡視官ラナが姿を消した。アランナラに従って夢の世界へ入ったという。"
 SUM_ST_Sanctuary_Open:0 "浄善宮を開く"
 SUM_ST_Sanctuary_Open_desc:0 "門番の衛士に命令が下り、浄善宮の扉が開かれる。"
 SUM_ST_Sanctuary_Free:0 "神の鎖を解く"
 SUM_ST_Sanctuary_Free_desc:0 "鎖が落ちる。小吉祥草王が初めて牢から外へ出た。"
 SUM_ST_Sanctuary_Court:0 "神前の議政"
 SUM_ST_Sanctuary_Court_desc:0 "草神が朝に臨み、六大学派の長が彼女の前で報告する。"
 SUM_ST_Sanctuary_Monastery:0 "浄善宮の僧団"
 SUM_ST_Sanctuary_Monastery_desc:0 "浄善宮が旧例を復し、僧たちが古い礼を再び唱える。"
 SUM_ST_Sanctuary_Shrine:0 "草神の聖所"
 SUM_ST_Sanctuary_Shrine_desc:0 "草神の聖所が雨林と砂漠の各地に建てられる。"
 SUM_ST_Sanctuary_Reform:0 "神託の改革"
 SUM_ST_Sanctuary_Reform_desc:0 "草神が新たな教諭を発し、教令院が長く濫用してきた旧条を廃する。"
 SUM_ST_Sanctuary_Doctrine:0 "神権の教義"
 SUM_ST_Sanctuary_Doctrine_desc:0 "神権の教義が成文化され、草神の判断はあらゆる学派の論争より上に置かれる。"
 SUM_ST_Sanctuary_Clergy:0 "神職の叙任"
 SUM_ST_Sanctuary_Clergy_desc:0 "草神が新たな神職を叙任する。雨林の出と砂漠の出が半々である。"
 SUM_ST_Dream_Gate:0 "夢の門"
 SUM_ST_Dream_Gate_desc:0 "アカシャが止まり、スメールの人々は再び夢を見はじめる。"
 SUM_ST_Dream_Sabzeruz:0 "サブゼルズ祭の再開"
 SUM_ST_Dream_Sabzeruz_desc:0 "サブゼルズ祭が国の大典として戻る。もはや学者の演目ではない。"
 SUM_ST_Dream_Mushroom:0 "夢茸"
 SUM_ST_Dream_Mushroom_desc:0 "雨林の茸が夢の息を吸って育ち、新たな薬となる。"
 SUM_ST_Dream_Theater:0 "夢の劇場"
 SUM_ST_Dream_Theater_desc:0 "ニルーが舞台で花神を演じる。客席には学者もいれば、髪を剃った砂民もいる。"
 SUM_ST_Dream_Song:0 "アランナラの歌謡"
 SUM_ST_Dream_Song_desc:0 "アランナラの歌謡が文字に記され、スメールの典籍に収められる。"
 SUM_ST_Dream_Record:0 "夢の記録"
 SUM_ST_Dream_Record_desc:0 "学者たちが一人ひとりの夢を記録しはじめ、研究の材料とする。"
 SUM_ST_Dream_Heal:0 "夢による癒し"
 SUM_ST_Dream_Heal_desc:0 "医師が夢を用いて、戦と飢饉の残した古傷を和らげる。"
 SUM_ST_Dream_Memory:0 "思い出の味"
 SUM_ST_Dream_Memory_desc:0 "オアシスの人々が昔の思い出を食卓に並べ、旅人と分け合う。"
 SUM_ST_Dream_Eternal:0 "永続の夢"
 SUM_ST_Dream_Eternal_desc:0 "スメールは長い夢に入る。そこに飢饉もなく、忘却もない。"
 SUM_ST_Ara_Meet:0 "アランナラとの出会い"
 SUM_ST_Ara_Meet_desc:0 "草神みずから学者を率いて雨林に入り、アランナラと会う。"
 SUM_ST_Ara_Hymn:0 "アランナラの賛美歌"
 SUM_ST_Ara_Hymn_desc:0 "アランナラの賛美歌がスメールの文字に訳され、伝わっていく。"
 SUM_ST_Ara_Rana:0 "ラナの帰還"
 SUM_ST_Ara_Rana_desc:0 "失踪したラナが村へ戻り、アランナラから託された種を持ち帰る。"
 SUM_ST_Ara_Seed:0 "アランナラの種"
 SUM_ST_Ara_Seed_desc:0 "枯れた種がガンダルヴァ村に埋められ、再び芽吹くのを待つ。"
 SUM_ST_Ara_Kusava:0 "クリカラの草"
 SUM_ST_Ara_Kusava_desc:0 "クリカラの草が薬草として採られ、禁忌の知識に蝕まれた者を癒す。"
 SUM_ST_Ara_Kalpalata:0 "カルパラタ蓮"
 SUM_ST_Ara_Kalpalata_desc:0 "カルパラタ蓮は夢の最も深いところでしか開かない。アランナラはそれを草神に捧げる。"
 SUM_ST_Ara_King:0 "アランナラの王"
 SUM_ST_Ara_King_desc:0 "アランナラが新たな王を選び、すべてのアランナラを代表させる。"
 SUM_ST_Ara_Alliance:0 "アランナラ同盟"
 SUM_ST_Ara_Alliance_desc:0 "アランナラとスメールが盟を結び、雨林の根を守る。"
 SUM_ST_Ara_Covenant:0 "緑陰の約"
 SUM_ST_Ara_Covenant_desc:0 "緑陰の約が結ばれる。アランナラが守る森を、スメールは伐らない。"
 SUM_ST_Tree_Root:0 "世界樹の根"
 SUM_ST_Tree_Root_desc:0 "世界樹の根はスメール全土を貫く。草神はそれを記憶の血管と呼ぶ。"
 SUM_ST_Tree_Dream:0 "世界樹の夢"
 SUM_ST_Tree_Dream_desc:0 "世界樹も夢を見る。その夢には大慈樹王がまだ生きている。"
 SUM_ST_Tree_Irminsul:0 "イアームスルの囁き"
 SUM_ST_Tree_Irminsul_desc:0 "世界樹が囁く。五百年前のあの忘却のことを。"
 SUM_ST_Tree_Memory:0 "消された記憶"
 SUM_ST_Tree_Memory_desc:0 "草神はある名を思い出し、書き記したあと、自らの手で消す。"
 SUM_ST_Tree_Wither:0 "枯れた枝"
 SUM_ST_Tree_Wither_desc:0 "世界樹の一枝が枯れかけている。学者には原因が分からない。"
 SUM_ST_Tree_New:0 "新たな白枝"
 SUM_ST_Tree_New_desc:0 "枯れ枝のそばに新しい白枝が伸びる。草神は、スメールが自ら伸ばしたのだと言う。"
 SUM_ST_Tree_Sage:0 "樹王の知恵"
 SUM_ST_Tree_Sage_desc:0 "樹王の知恵が書物にまとめられ、スメールの学派すべての共通の基となる。"
 SUM_ST_Tree_Light:0 "浄化の光"
 SUM_ST_Tree_Light_desc:0 "浄化の光が世界樹の裂け目に差し込み、死域が退いていく。"
 SUM_ST_Tree_Eternal:0 "常緑の聖樹"
 SUM_ST_Tree_Eternal_desc:0 "世界樹は常緑である。その根の下には、新旧二人の草神の共通の記憶がある。"
 SUM_ST_Rain_Watch:0 "雨林の見張り"
 SUM_ST_Rain_Watch_desc:0 "巡視隊が拡張され、雨林の境界に初めて常設の見張りが置かれる。"
 SUM_ST_Rain_Ranger:0 "巡視官の拡張"
 SUM_ST_Rain_Ranger_desc:0 "ティナリが巡視官の長となる。部下の多くは雨林で育った狩人である。"
 SUM_ST_Rain_Gandharva:0 "ガンダルヴァの防線"
 SUM_ST_Rain_Gandharva_desc:0 "ガンダルヴァ村に防線が築かれ、死域は森の外に阻まれる。"
 SUM_ST_Rain_Village:0 "村落の共同防衛"
 SUM_ST_Rain_Village_desc:0 "雨林の各村が共同防衛を結び、互いに見張り合う。"
 SUM_ST_Rain_Beast:0 "森の巨獣"
 SUM_ST_Rain_Beast_desc:0 "雨林の巨獣に再び住処ができ、村を襲わなくなる。"
 SUM_ST_Rain_Medicine:0 "雨林の薬草"
 SUM_ST_Rain_Medicine_desc:0 "雨林の薬草が組織的に採集され、医師は薬に困らなくなる。"
 SUM_ST_Rain_Conserve:0 "伐採禁止令"
 SUM_ST_Rain_Conserve_desc:0 "伐採禁止令が下り、斧は取り上げられる。"
 SUM_ST_Rain_Guard:0 "翠緑の衛隊"
 SUM_ST_Rain_Guard_desc:0 "翠緑の衛隊が編成され、雨林と聖樹の護衛だけを務める。"
 SUM_ST_Rain_Forever:0 "万緑常青"
 SUM_ST_Rain_Forever_desc:0 "雨林は学者が来る前の姿を取り戻す。"
 SUM_ST_Seal_Whisper:0 "禁忌の知識の囁き"
 SUM_ST_Seal_Whisper_desc:0 "封印された書庫の中で、禁忌の知識が低く語りかける。"
 SUM_ST_Seal_Study:0 "禁忌の誘惑"
 SUM_ST_Seal_Study_desc:0 "学者が禁書を開かずにいられなくなる。"
 SUM_ST_Seal_Net:0 "結界を張る"
 SUM_ST_Seal_Net_desc:0 "草神が世界樹の周りに結界を張る。"
 SUM_ST_Seal_Corrupt:0 "蝕まれた学者"
 SUM_ST_Seal_Corrupt_desc:0 "学者が蝕まれ、スメールは自らの蔵書を調べ直さねばならなくなる。"
 SUM_ST_Seal_Nail:0 "裁きの釘"
 SUM_ST_Seal_Nail_desc:0 "赤王の時代に残された裁きの釘を、学者が改めて測量する。"
 SUM_ST_Seal_Nib:0 "ニーベルンゲンの影"
 SUM_ST_Seal_Nib_desc:0 "世界の外の力が裂け目の中で寝返りを打ち、スメールの空が一瞬暗くなる。"
 SUM_ST_Seal_Abyss:0 "深淵を拒む"
 SUM_ST_Seal_Abyss_desc:0 "草神が世界の外からの声を拒む。"
 SUM_ST_Seal_Oath:0 "誓い守る者"
 SUM_ST_Seal_Oath_desc:0 "誓い守る者が、命を懸けて封印を守ると誓う。"
 SUM_ST_Seal_Final:0 "封淵の完成"
 SUM_ST_Seal_Final_desc:0 "封淵が完成する。世界樹が静まり、草神はようやく眠れる。"
 SUM_RP_Dar_Amurta:0 "生論派の請願"
 SUM_RP_Dar_Amurta_desc:0 "生論派が請願を提出し、雨林の研究権を巡視官に戻すよう求める。"
 SUM_RP_Dar_Rtawahist:0 "素論派の天文"
 SUM_RP_Dar_Rtawahist_desc:0 "素論派が星見の帳簿を広げる。帳簿は星図より見苦しかった。"
 SUM_RP_Dar_Haravatat:0 "明論派の典籍"
 SUM_RP_Dar_Haravatat_desc:0 "明論派が典籍を整理し、禁書令の下の残巻を再び目録に載せる。"
 SUM_RP_Dar_Vahumana:0 "因論派の追及"
 SUM_RP_Dar_Vahumana_desc:0 "因論派が、大賢者の権限がどこから来たのかを問いはじめる。"
 SUM_RP_Dar_Reform:0 "大賢者の罷免"
 SUM_RP_Dar_Reform_desc:0 "大賢者は議事堂を出るよう命じられる。退出のとき、誰も彼の味方をしなかった。"
 SUM_RP_Dar_Election:0 "学派の推挙"
 SUM_RP_Dar_Election_desc:0 "六大学派が新たな長を推挙し、票数は公開される。"
 SUM_RP_Dar_Publish:0 "学報の自由"
 SUM_RP_Dar_Publish_desc:0 "学報は自由に刊行でき、誤ったものも印刷できる。"
 SUM_RP_Dar_Patent:0 "特許と褒賞"
 SUM_RP_Dar_Patent_desc:0 "発明者は特許を得られ、学問が実利を生むようになる。"
 SUM_RP_Dar_Council:0 "学派議事会"
 SUM_RP_Dar_Council_desc:0 "学派議事会がスメール最高の学問機関となる。"
 SUM_RP_Par_Charter:0 "憲章の起草"
 SUM_RP_Par_Charter_desc:0 "憲章の起草が始まる。第一条には、スメールはいかなる学者一人のものでもない、と記される。"
 SUM_RP_Par_Assembly:0 "学者議会"
 SUM_RP_Par_Assembly_desc:0 "学者議会が開かれ、議席は雨林、砂漠、都市に配られる。"
 SUM_RP_Par_Press:0 "新聞の自由"
 SUM_RP_Par_Press_desc:0 "新聞が現れ、国政を論じる者が名を記すことを許される。"
 SUM_RP_Par_Party:0 "結社と政党"
 SUM_RP_Par_Party_desc:0 "学派の外に政党が生まれ、スメールの政治に初めて分岐ができる。"
 SUM_RP_Par_Police:0 "治安官署"
 SUM_RP_Par_Police_desc:0 "治安官署が置かれる。巡視隊は雨林だけを扱い、人を裁かなくなる。"
 SUM_RP_Par_Census:0 "人口調査"
 SUM_RP_Par_Census_desc:0 "スメールが初めて自らの人口を数える。"
 SUM_RP_Par_Local:0 "地方自治"
 SUM_RP_Par_Local_desc:0 "都市と砂漠がそれぞれ自治を得て、教令院は共通の法だけを司る。"
 SUM_RP_Par_School:0 "公共学堂"
 SUM_RP_Par_School_desc:0 "公共学堂が村にまで届き、読み書きは金持ちのものではなくなる。"
 SUM_RP_Par_Republic:0 "学者共和国"
 SUM_RP_Par_Republic_desc:0 "スメールは共和国となる。権力は学者、商人、狩人、そしてオアシスを守る者から来る。"
 SUM_RP_Com_Treasury:0 "国庫"
 SUM_RP_Com_Treasury_desc:0 "国庫が改めて帳簿を付けられ、大賢者が持ち去った金は想像より多いと分かる。"
 SUM_RP_Com_Tax:0 "税制改革"
 SUM_RP_Com_Tax_desc:0 "税制は土地と人頭に基づく形に改められ、砂漠は二重に課税されなくなる。"
 SUM_RP_Com_Caravan:0 "隊商の特許"
 SUM_RP_Com_Caravan_desc:0 "隊商が通行の特許を得て、雨林と砂漠の間で物が動きはじめる。"
 SUM_RP_Com_Port:0 "オルモス港の開港"
 SUM_RP_Com_Port_desc:0 "オルモス港が七国に開かれ、スメールは初めて外国の商人に門を開く。"
 SUM_RP_Com_Bank:0 "スメール銀行"
 SUM_RP_Com_Bank_desc:0 "スメール銀行が開業し、学者は研究のために借り入れできる。"
 SUM_RP_Com_Guild:0 "商会連合"
 SUM_RP_Com_Guild_desc:0 "商会が連合し、スメールの荷を七国へ運ぶ。"
 SUM_RP_Com_Coffee:0 "珈琲と砂糖"
 SUM_RP_Com_Coffee_desc:0 "珈琲と砂糖がスメールの新たな名刺となる。"
 SUM_RP_Com_Industry:0 "軽工業"
 SUM_RP_Com_Industry_desc:0 "製糸と織造がスメールに根づき、工房は市の外れまで並ぶ。"
 SUM_RP_Com_Prosperity:0 "富める国"
 SUM_RP_Com_Prosperity_desc:0 "スメールの穀倉が満ち、飢饉の記憶が初めて薄れる。"
 SUM_RP_Kno_Terminal:0 "アカシャの開放"
 SUM_RP_Kno_Terminal_desc:0 "アカシャは教令院の専有ではなくなり、各都市が接続できる。"
 SUM_RP_Kno_Data:0 "知識の公有"
 SUM_RP_Kno_Data_desc:0 "知識は公有と宣言され、学識は年功で配られなくなる。"
 SUM_RP_Kno_Print:0 "活字と書房"
 SUM_RP_Kno_Print_desc:0 "活字が広がり、書の値は徒弟にも買えるほど下がる。"
 SUM_RP_Kno_School:0 "平民学堂"
 SUM_RP_Kno_School_desc:0 "砂漠の村に平民学堂が開く。"
 SUM_RP_Kno_Desert:0 "砂漠の講学"
 SUM_RP_Kno_Desert_desc:0 "学者が砂漠に入って講義し、学生には傭兵も狩人もいる。"
 SUM_RP_Kno_Research:0 "研究の自由"
 SUM_RP_Kno_Research_desc:0 "研究に教令院の許可は要らなくなる。"
 SUM_RP_Kno_Language:0 "文字の普及"
 SUM_RP_Kno_Language_desc:0 "スメールの文字が村の入口にまで届く。"
 SUM_RP_Kno_Truth:0 "真理に制限なし"
 SUM_RP_Kno_Truth_desc:0 "禁書令が廃止される。真理は紙の上に書かれることを許される。"
 SUM_RP_Cit_Village:0 "砂漠の村落"
 SUM_RP_Cit_Village_desc:0 "砂漠の村落が初めてスメールの地図に記される。"
 SUM_RP_Cit_Tribe:0 "部族の名簿"
 SUM_RP_Cit_Tribe_desc:0 "部族の名簿が作られ、血の掟がスメールに認められる。"
 SUM_RP_Cit_School:0 "砂海学堂"
 SUM_RP_Cit_School_desc:0 "砂海学堂が開講し、スメールの文字と水利を教える。"
 SUM_RP_Cit_Water:0 "オアシスの水利"
 SUM_RP_Cit_Water_desc:0 "オアシスの水路が再び浚われ、田は村の外まで広がる。"
 SUM_RP_Cit_Caravan:0 "商道の共管"
 SUM_RP_Cit_Caravan_desc:0 "商道はスメールと部族が共に管理し、通行料を一方が決めることはなくなる。"
 SUM_RP_Cit_Amnesty:0 "追放者の赦免"
 SUM_RP_Cit_Amnesty_desc:0 "教令院に追放された砂漠の人々が赦され、自らの村へ戻る。"
 SUM_RP_Cit_Chief:0 "部族の共議"
 SUM_RP_Cit_Chief_desc:0 "各部族の長がスメールの議事会に入る。"
 SUM_RP_Cit_Equal:0 "雨林と砂漠の平等"
 SUM_RP_Cit_Equal_desc:0 "雨林と砂漠は法の前で平等となる。"
 SUM_RP_Cit_Commonwealth:0 "砂漠の共栄"
 SUM_RP_Cit_Commonwealth_desc:0 "オアシスが一つにつながり、砂漠はもはやスメールの隅ではない。"
 SUM_RP_Edu_Border:0 "辺境学堂"
 SUM_RP_Edu_Border_desc:0 "砦のそばに辺境学堂が建てられ、兵も書を読む。"
 SUM_RP_Edu_Desert:0 "砂漠の巡防"
 SUM_RP_Edu_Desert_desc:0 "砂漠巡防隊が編成され、商道に常設の護衛が置かれる。"
 SUM_RP_Edu_Officer:0 "士官学堂"
 SUM_RP_Edu_Officer_desc:0 "士官学堂が授業を始め、指揮は出自によらなくなる。"
 SUM_RP_Edu_Corps:0 "常備軍団"
 SUM_RP_Edu_Corps_desc:0 "常備軍団が編成され、スメールは初めて自らの兵を持つ。"
 SUM_RP_Edu_Recon:0 "斥候と測量"
 SUM_RP_Edu_Recon_desc:0 "斥候がスメール全土を一枚の図に描く。"
 SUM_RP_Edu_Supply:0 "後方の駅"
 SUM_RP_Edu_Supply_desc:0 "後方の駅が鉄道と水路に沿って広がる。"
 SUM_RP_Edu_Drill:0 "教練の統一"
 SUM_RP_Edu_Drill_desc:0 "全軍の教練が統一され、号令は最も遠い哨所まで届く。"
 SUM_RP_Edu_Tech:0 "外国製兵器の導入"
 SUM_RP_Edu_Tech_desc:0 "兵器を外国から導入し、スメールはそれを模造しはじめる。"
 SUM_RP_Edu_Shield:0 "スメールの盾"
 SUM_RP_Edu_Shield_desc:0 "スメールの盾が雨林と砂漠の間に立ち、共和国のために外敵を阻む。"
 SUM_GT_Iro_Decrees:0 "大賢者の勅令"
 SUM_GT_Iro_Decrees_desc:0 "大賢者の勅令は議事堂を通らなくなる。"
 SUM_GT_Iro_Secret:0 "秘密警察"
 SUM_GT_Iro_Secret_desc:0 "秘密警察が作られ、新聞の名が一人また一人と消えていく。"
 SUM_GT_Iro_Akasha:0 "アカシャの監視"
 SUM_GT_Iro_Akasha_desc:0 "アカシャが報告を返しはじめる。誰が話した一言一句まで記録される。"
 SUM_GT_Iro_Mobilize:0 "全民動員"
 SUM_GT_Iro_Mobilize_desc:0 "全民動員令が下り、雨林も砂漠も等しく徴発される。"
 SUM_GT_Iro_Propaganda:0 "学院の宣伝"
 SUM_GT_Iro_Propaganda_desc:0 "教令院の宣伝が城壁を覆い、スメールはかつてなく強いと説く。"
 SUM_GT_Iro_School:0 "思想の試験"
 SUM_GT_Iro_School_desc:0 "学生の進級はまず思想で決まり、学問はその次となる。"
 SUM_GT_Iro_Army:0 "党衛軍団"
 SUM_GT_Iro_Army_desc:0 "教令院直属の軍団が作られ、賢者だけに忠誠を誓う。"
 SUM_GT_Iro_Fear:0 "恐怖による統治"
 SUM_GT_Iro_Fear_desc:0 "スメールは恐怖で治める。もう誰も夢を見ようとしない。"
 SUM_GT_Iro_Eternal:0 "永遠の教令院"
 SUM_GT_Iro_Eternal_desc:0 "教令院は、その統治はスメールとともに在ると宣言する。"
 SUM_PL_Int_Puppet:0 "総督府"
 SUM_PL_Int_Puppet_desc:0 "教令院が砂漠に総督府を置き、四つの傀儡国への詔令はここから出る。"
 SUM_PL_Int_Integrate:0 "ハドラマベトの編入"
 SUM_PL_Int_Integrate_desc:0 "ハドラマベトがスメールの行省に併合される。"
 SUM_PL_Int_Border:0 "境界の画定"
 SUM_PL_Int_Border_desc:0 "商道とオアシスの境界が改めて画定される。"
 SUM_PL_Int_Tax:0 "砂漠の税制"
 SUM_PL_Int_Tax_desc:0 "砂漠の税は収穫で測られ、人頭で課されなくなる。"
 SUM_PL_Int_Road:0 "砂海の駅道"
 SUM_PL_Int_Road_desc:0 "駅道がスメール城からヒュポスタイル砂原まで延びる。"
 SUM_PL_Int_Union:0 "砂と林の一体"
 SUM_PL_Int_Union_desc:0 "雨林と砂漠が一つのスメールに溶け合う。"
 SUM_PL_Ere_Contract:0 "鍍金の契約"
 SUM_PL_Ere_Contract_desc:0 "教令院とエルマイト旅団が契約を結び直す。条項は以前より細かく書かれた。"
 SUM_PL_Ere_Nationalize:0 "旅団の国有化"
 SUM_PL_Ere_Nationalize_desc:0 "エルマイト旅団がスメールの序列に組み込まれる。"
 SUM_PL_Ere_Weapon:0 "砂海の武備"
 SUM_PL_Ere_Weapon_desc:0 "砂海の兵器工房が動き出し、その刃は教令院の図面より正確である。"
 SUM_PL_Ere_Scout:0 "砂漠の斥候"
 SUM_PL_Ere_Scout_desc:0 "砂漠の斥候が、隣国と接するすべての砂の峠をスメールのために見張る。"
 SUM_PL_Ere_Pay:0 "兵餉"
 SUM_PL_Ere_Pay_desc:0 "兵餉が期日に支払われ、傭兵は初めて掠奪に頼らずに済む。"
 SUM_PL_Ere_Loyal:0 "旅団の忠誠"
 SUM_PL_Ere_Loyal_desc:0 "エルマイト旅団がスメールに忠誠を誓う。条件は、スメールが彼らの血を認めることだった。"
 SUM_PL_Arm_Draft:0 "徴兵令"
 SUM_PL_Arm_Draft_desc:0 "徴兵令が下り、雨林と砂漠がそれぞれ人口に応じて兵を出す。"
 SUM_PL_Arm_Training:0 "操練"
 SUM_PL_Arm_Training_desc:0 "市の外れに操練場が建てられ、号令は昼夜止まらない。"
 SUM_PL_Arm_Artillery:0 "弩砲と火砲"
 SUM_PL_Arm_Artillery_desc:0 "弩砲と火砲が並び、スメールの兵器は二世代が共存する。"
 SUM_PL_Arm_Tank:0 "砂漠の装甲"
 SUM_PL_Arm_Tank_desc:0 "装甲車が砂の上を走り、教令院は初めて砂丘を越えられる車を得る。"
 SUM_PL_Arm_Industry:0 "兵器工場"
 SUM_PL_Arm_Industry_desc:0 "兵器工場が動き出し、スメールの銃はもう輸入だけに頼らない。"
 SUM_PL_Arm_Staff:0 "総参謀部"
 SUM_PL_Arm_Staff_desc:0 "総参謀部が置かれ、作戦は賢者の気まぐれに従わなくなる。"
 SUM_PL_Nav_Port:0 "オルモス港"
 SUM_PL_Nav_Port_desc:0 "オルモス港が拡張され、停泊地は灯台の外まで並ぶ。"
 SUM_PL_Nav_Dock:0 "船渠"
 SUM_PL_Nav_Dock_desc:0 "船渠が動き出し、スメールは初めて自らの船を造る。"
 SUM_PL_Nav_Gun:0 "大艦巨砲"
 SUM_PL_Nav_Gun_desc:0 "艦隊は巨砲の道を選び、その口径は隣国より大きい。"
 SUM_PL_Nav_Trade:0 "海運"
 SUM_PL_Nav_Trade_desc:0 "海運が始まり、香辛料と陶磁がオルモス港から海へ出る。"
 SUM_PL_Nav_Whale:0 "鯨波の危険"
 SUM_PL_Nav_Whale_desc:0 "遠海の巨鯨が商船を沈め、教令院は人を遣って調べさせる。"
 SUM_PL_Nav_Admiral:0 "海軍学堂"
 SUM_PL_Nav_Admiral_desc:0 "海軍学堂が港に開かれ、風と星を教える。"
 SUM_PL_Dip_Liyue:0 "璃月の使節"
 SUM_PL_Dip_Liyue_desc:0 "璃月の使節が訪れ、語られるのは鉱脈と商道である。"
 SUM_PL_Dip_Inazuma:0 "稲妻との通商"
 SUM_PL_Dip_Inazuma_desc:0 "稲妻の商船がオルモス港に着き、刀と絹をもたらす。"
 SUM_PL_Dip_Fontaine:0 "フォンテーヌの技術"
 SUM_PL_Dip_Fontaine_desc:0 "フォンテーヌの技師が機械の図面を持ち込む。"
 SUM_PL_Dip_Snezhnaya:0 "至冬の影"
 SUM_PL_Dip_Snezhnaya_desc:0 "至冬の隊商には別のものが混じっていた。教令院は三度調べた。"
 SUM_PL_Dip_League:0 "七国の学術連盟"
 SUM_PL_Dip_League_desc:0 "スメールが七国の学術連盟を提唱し、学者が互いに行き来できるようになる。"
 SUM_PL_Dip_Aid:0 "対外援助"
 SUM_PL_Dip_Aid_desc:0 "スメールが隣国の被災者に糧と薬を送る。"
 SUM_PL_Won_Surasthana:0 "浄善宮の修繕"
 SUM_PL_Won_Surasthana_desc:0 "浄善宮は長く修繕されずにいた。巧みな職人が改修を引き受ける。"
 SUM_PL_Won_Alcazarzaray:0 "アルカザルザライ"
 SUM_PL_Won_Alcazarzaray_desc:0 "カーヴェのアルカザルザライが再び着工する。今度は債権者が扉を叩かない。"
 SUM_PL_Won_Industry:0 "工業化"
 SUM_PL_Won_Industry_desc:0 "スメールに煙突が増え、学者は石炭が足りるかを計算しはじめる。"
 SUM_PL_Won_Mine:0 "砂漠の鉱脈"
 SUM_PL_Won_Mine_desc:0 "砂漠の鉱脈が開かれ、スメールは自らの鉄を持つ。"
 SUM_PL_Won_Craft:0 "工芸の復興"
 SUM_PL_Won_Craft_desc:0 "古い工芸が再び取り上げられ、職人に立場ができる。"
 SUM_PL_Won_Great:0 "宏大な事業"
 SUM_PL_Won_Great_desc:0 "スメールは雨林と砂漠の間に橋を架けようとする。"

