 tungsten_desc:0 "Необработанный кристалл. В умелых руках становится ценным материалом для оружия.\n\nРедок, но встречается по всему Тейвату, необходим для оружия."
 steel_desc:0 "Руда марказита. В умелых руках становится оружием. Руда хранит память о битвах.\n\nВстречается локально. Основной материал для производства оружия."
 chromium_desc:0 "Необработанный фиолетовый кристалл. После обработки становится ценным.\n\nНеобходим для производства сплавов, но добывается в основном в Инадзуме."
 oil_desc:0 "Смола, остающаяся после посещений данжей. Содержит силу линий земли, используется как топливо."
 rubber_desc:0 "Очищенная слизь слайма. Вредна для кожи, избегайте контакта.\n\nИспользуется в авиации благодаря своим свойствам."
 aluminium_desc:0 "Древесина дерева Цуйхуа, прочная и красивая. Используется для ветряных крыльев.\n\nВстречается по всему Тейвату."
 
