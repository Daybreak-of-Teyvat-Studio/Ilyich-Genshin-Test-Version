 SUM_Neo.85.d:"死域被一处一处清掉，草木重新长回来。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
 SUM_Neo.85.a:"以草神之名行事"
 SUM_Neo.85.b:"以律条为先"
 SUM_Neo.86.t:"林中巨兽"
 SUM_Neo.86.d:"雨林里的巨兽重新有了家，不再袭击村落。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。"
 SUM_Neo.86.a:"让梦回到须弥"
 SUM_Neo.86.b:"先看住封印"
 SUM_Neo.87.t:"雨林药草"
 SUM_Neo.87.d:"雨林药草成体系地采集，医者不再无药可用。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。"
