#event
dragonspine.1.t:0"Драконий хребет: Пролог"
dragonspine.1.d:0"«Сегодня на холодном хребте появился тёплый луч солнца. Он освещает новый Международный институт и учёных со всего мира. Все улыбаются, особенно мондштадтцы. Институт должен был быть в Мондштадте, но из-за плана освоения хребта его перенесли сюда, поручив руководство §Cглавному алхимику §BАльбедо§!.\n\nВ это время ему помогает §Hбиблиотекарь §bЛиза§!, которая вернётся в Мондштадт после работы.\n\nСреди учёных выделяется §Bбиоалхимик §RСахароза§!, создающая морозостойкие организмы.\n\nВсе смотрят в будущее с надеждой, но это будущее может не наступить.\n\n§RМондштадт идёт к расколу, и судьба хребта скоро начнётся.§!"
dragonspine.1.a:0"Мир — лишь жалкая сцена."
dragonspine.1.b:0"Герои танцуют под рукой судьбы."

dragonspine.2.t:0"Работа Сахарозы"
dragonspine.2.d:0"«Настоящий шедевр! — воскликнула учёная из Сумеру. — И полезный, и красивый! Сахароза, как ты назовёшь его?»\n\n«М-м...» — задумалась Сахароза. — «Пусть будет “Цветоснег”».\n\n«Очень поэтично! Почему?»\n\n«Потому что это цветок, растущий на снегу».\n\n«...Вы всегда так называете?»\n\n«Да! У меня есть “Цветотрава”, “Травоцвет”, “Травотравоцвет”!»\n\nУчёная замолчала. Увидев её лицо, Сахароза спросила:\n\n«Н-неужели плохо?»\n\n— Кто сможет сказать «нет» этой девушке? Сегодня учёная вспоминала этот день с лёгкой грустью:"
dragonspine.2.a:0"Как хочется потрогать её уши..."

dragonspine.3.t:0"Изобретение Сахарозы"
dragonspine.3.d:0"«Весть о богатом урожае разнеслась по всему хребту. Люди собрались вокруг полей, глядя на золотое море. Многие, прожив здесь годы, привыкли к скудной земле, где росли только мята и хвойные. Увидев пшеницу, они почувствовали любовь к жизни.\n\nОдин житель сказал: “Я не верил, что можно выращивать что-то в снегах. Но это случилось!”\n\nЗолотая пшеница растёт там, где ей не место — как и наши города. Она — символ нашей смелости.»\n\n— Четыре месяца назад, «Пионер хребта»"
dragonspine.3.a:0"Можно дать ей более поэтичное название?"
dragonspine.3.b:0"Немедленно внедрить!"

dragonspine.4.t:0"Работа Альбедо"
dragonspine.4.d:0"«Сегодня обсуждаем соблюдение Трудового кодекса, борьбу с принудительными сверхурочными...»\n\nСовет хребта прозвали «зоопарком», но когда Альбедо встаёт, зоопарк затихает. Это не потому, что он диктатор, а потому, что он безупречен. Любой, кто пытается спорить, терпит поражение. Сначала многие спорили, потом только новички, а теперь все привыкли.\n\nКонечно, это не значит, что его не любят. Все знают, что он добр, просто держится на расстоянии.\n\nМногие смотрят на него с обожанием. Такой талантливый человек мог бы узурпировать власть, но он придерживается демократии...\n\nВпрочем, Альбедо не заботится о власти. Он считает себя алхимиком."
dragonspine.4.a:0"Раз Альбедо так сказал, значит, так и надо."

dragonspine.5.t:0"Результаты Альбедо"
dragonspine.5.d:0"Альбедо поставил подпись.\n\nЗа три месяца до открытия института завершился второй этап освоения хребта. Он был нужен для добычи звездного железа. В ходе него нашли много ресурсов. Мясо стало деликатесом, в лагерях появилось тепло, люди мигрировали сюда.\n\nВ третьем этапе мы создадим горнолыжные курорты и туристические маршруты."
dragonspine.5.a:0"Работать в нормальном темпе."
dragonspine.5.b:0"Ускорить строительство!"

dragonspine.6.t:0"Работа Лизы"
dragonspine.6.d:0"«Лиза даже на хребте сохраняет невозмутимость. В офисе всегда пахнет чаем. Когда она ушла, все удивились.\n\nВсе полюбили её. Она всегда готова помочь, даёт полезные советы и лекарства. Но не беспокойте её во время сна и чаепития.\n\nХотела бы я быть такой же умной и красивой, как она...»"
dragonspine.6.a:0"— Из дневника чиновницы."

dragonspine.7.t:0"Спасение Лизы"
dragonspine.7.d:0"— Холод. Джозеф уже не чувствовал холода.\n\nЕда и топливо кончились, он знал, что не доберётся до базы. Он был мёртв, только ещё думал. Скоро и это прекратится.\n\n...Но кто-то будет скучать по нему. Его сын.\n\n«Я плохой отец», — подумал он.\n\nВдруг он услышал треск электричества. Он решил, что у него галлюцинации.\n\n«Говорит спасательный отряд хребта», — раздался спокойный женский голос. — «Мы нашли вас. Следуйте инструкциям, чтобы спастись».\n\nВ нём проснулась надежда.\n\n\nЧас спустя Джозефа спасли. Это было три месяца назад."
dragonspine.7.a:0"Отлично!"
dragonspine.7.b:0"Немедленно внедрить!"

dragonspine.8.t:0"Хаос в правительстве!"
dragonspine.8.d:0"Наше правительство узнало о расколе Мондштадта раньше других. Многие чиновники готовятся к бегству, некоторые саботируют работу, другие пытаются работать, но их эффективность низка. Хуже всего то, что мы ничего не можем сделать."
dragonspine.8.a:0"Тишина!"
dragonspine.8.b:0"Как правительство дошло до такого!"

dragonspine.9.t:0"Перебои со снабжением!"
dragonspine.9.d:0"Новости: поставки продовольствия из Ордена Рыцарей Запада прекратились. Мы можем производить многое, но не достаточно продовольствия.\n\nК счастью, Альбедо начал создавать стратегические запасы три месяца назад. Должно быть, мы заполнили амбары?"
dragonspine.9.a:0"Мадам, вы съели последнюю курицу."
dragonspine.9.b:0"Мне страшно думать о будущем... Без омлета?"

dragonspine.10.t:0"Заговор учёных!"
dragonspine.10.d:0"Новости о расколе дошли до других стран. Если жители Ли Юэ хотят заработать на войне, то учёные из Сумеру имеют злые намерения. Полиция выяснила, что Великий Мудрец приказал им добыть секретные знания и вмешаться в политику."
dragonspine.10.a:0"Эти иностранные авантюристы!"
dragonspine.10.b:0"Заговор Великого Мудреца!"

dragonspine.11.t:0"Хаос в армии!"
dragonspine.11.d:0"Новости о расколе достигли армии. Солдаты разделились: одни хотят защищать Мондштадт, другие поддерживают раскол, третьи дезертируют.\n\nБоевой дух упал."
dragonspine.11.a:0"У нас есть силы для реорганизации?"
dragonspine.11.b:0"Армия не может выступить."

dragonspine.12.t:0"Остановка производства!"
dragonspine.12.d:0"Новости о расколе вызвали панику. Работы остановлены, производство заморожено. Над хребтом нависла угроза."
dragonspine.12.a:0"Их можно понять."
dragonspine.12.b:0"Что нам делать?"

dragonspine.13.t:0"Альбедо избран"
dragonspine.13.d:0"Альбедо закончил речь, и люди зааплодировали. Его холодность сочли спокойствием и уверенностью.\n\nОн знал, что они ищут лидера. Он собирался оправдать их ожидания.\n\n«У нас много работы, — сказал он. — Возвращайтесь к своим обязанностям»."
dragonspine.13.a:0"Альбедо вернёт мир и стабильность!"

dragonspine.14.t:0"Лиза избрана"
dragonspine.14.d:0"Когда Лиза вышла на трибуну, многие ждали шуток. Но она была серьёзна:\n\n«...Война требует побед. Но что такое победа? Нанести много потерь врагу, разрушить его семьи. Это не наш путь. Худшее, что может сделать человек — убивать и быть убитым.»\n\n«...Каждый имеет право на безопасность. Мы не можем защитить весь Мондштадт, но можем защитить наших близких, тех, кто пришёл к нам за безопасностью. Здесь мы имеем право на мирную жизнь.»\n\nВсе смотрели на неё с уважением, а она улыбнулась.\n\n«Многие знают меня как любительницу чая. Я не хочу менять это мнение. Наоборот, я скажу, что чаепитие — это прекрасно.»\n\n«Наша цель — чтобы каждый мог спокойно выпить чашечку чая.»"
dragonspine.14.a:0"Своими руками заработать безопасность!"

dragonspine.15.t:0"Сахароза избрана"
dragonspine.15.d:0"Когда Сахароза увидела своё имя в списке кандидатов, она подумала, что это шутка. Когда её голоса росли, она радовалась, а когда обогнала Альбедо, она онемела.\n\nНо это воля народа. Она приняла ответственность. После её речи все зааплодировали."
dragonspine.15.a:0"Сахароза?"
dragonspine.15.b:0"Сахароза справится!"

dragonspine.16.t:0"За мир в Мондштадте..."
dragonspine.16.d:0"Альбедо определил курс: не прятаться в хребте, а влиять на ситуацию.\n\nДля этого нужна армия. Он обратился к солдатам, чтобы поднять их дух."
dragonspine.16.a:0"В тёмном небе сияют звёзды солдат."

dragonspine.17.t:0"..."
dragonspine.17.d:0""
dragonspine.17.a:0"Одна воля — воля миллионов."

dragonspine.18.t:0"За жизни соотечественников..."
dragonspine.18.d:0"За Лагерным городом, столицей хребта, группа людей уходила вдаль. Им махали провожающие, они направлялись в охваченный войной Мондштадт.\n\nСреди них были целители, травники, медики. Они могли бы остаться в безопасности, но решили идти.\n\nНа вопрос «зачем?» они отвечали по-разному. Но настоящая причина — их горячие сердца.\n\nГруппа скрылась за горизонтом. Ребёнок спросил мать: «Когда они вернутся?»"
dragonspine.18.a:0"Когда война кончится и свобода вернётся."

dragonspine.19.t:0"Медики из Драконьего хребта"
dragonspine.19.d:0"Новое руководство хребта во главе с Сахарозой отправляет медиков для помощи пострадавшим. Мы можем получить их помощь за небольшие деньги. Согласиться?"
dragonspine.19.a:0"Почему нет?"
dragonspine.19.b:0"Лучше отказаться."

dragonspine.20.t:0"Надвигается закат"
dragonspine.20.d:0"§RЗакат близок§!.\n\nМондштадт на грани раскола. Нас ждут трудные времена...\n\nНо у нас нет административного лидера. Альбедо — лишь руководитель проекта. Нужен лидер. Кто это будет?"
dragonspine.20.a:0"Ситуация ухудшается, нужно решать."

dragonspine.21.t:0"Поток беженцев!"
dragonspine.21.d:0"В Драконьем хребте сменилось руководство. Лиза открыла зелёный коридор, и беженцы пошли к ним, снижая нашу нагрузку."
dragonspine.21.a:0"Отлично! Удачи им!"
dragonspine.21.b:0"Мы запомним их благородство."

dragonspine.22.t:0"Хребет отправляет больше медиков"
dragonspine.22.d:0"Хребет отправляет больше медиков. Это снизит потери, но у них могут быть свои цели. Как быть?"
dragonspine.22.a:0"Это хорошо?"
dragonspine.22.b:0"Не пускать."
dragonspine.22.b_desc:0"Солдаты будут недовольны, потребуются политические очки."
dragonspine.22.c:0"Прогнать!"
dragonspine.22.c_desc:0"Вызовет недовольство."
dragonspine.22.e:0"Прогнать всех!"
dragonspine.22.e_desc:0"Сильное падение поддержки войны."

dragonspine.23.t:0"Золото в снегах"
dragonspine.23.d:0"«Мама, там большое поле!»\n\nМорозостойкая пшеница дала урожай. Люди успокоятся."
dragonspine.23.a:0"Жизнь..."

dragonspine.24.t:0"Наш новый дом"
dragonspine.24.d:0"«Мама, лекарства подешевели!»\n\nХребет был самым динамично развивающимся регионом. Успех позволил ввести льготы. Люди полюбили свой новый дом."
dragonspine.24.a:0"Теперь это наш дом."

dragonspine.25.t:0"Письма солдатам"
dragonspine.25.d:0"«Мама, спасатели ответили!»\n\nСолдаты, потерявшие смысл, получили письма от спасённых. Их дух возродился."
dragonspine.25.a:0"Мы сражаемся за это."

dragonspine.26.t:0"Совещание завершено"
dragonspine.26.d:0"За два месяца ситуация ухудшилась. Совет принял решение:\n\n1. Избрать лидера с чрезвычайными полномочиями.\n2. Сохранять нейтралитет. Добровольцы не представляют хребет.\n3. Ввести нормирование и комендантский час, мобилизовать силы.\n4...\n\nСтрах ушёл. Люди были готовы работать."
dragonspine.26.a:0"Теория готова. К практике."

dragonspine.28.t:0"Саботаж раскрыт!"
dragonspine.28.d:0"Мы поймали агентов хребта. Их помощь была не бескорыстной. Как быть?"
dragonspine.28.a:0"Закрыть глаза."
dragonspine.28.b:0"Выслать часть медиков!"
dragonspine.28.c:0"Выслать всех!"
dragonspine.28.e:0"Война!"

dragonspine.29.t:0"Эвакуация!"
dragonspine.29.d:0"Агенты хребта устроили диверсии и скрылись."
dragonspine.29.a:0"Мы могли бы что-то сделать, но поздно."
dragonspine.29.b:0"Эти подлецы! Готовить контрудар!"

dragonspine.30.t:0"Приглашение хребта"
dragonspine.30.d:0"Хребет предлагает союз для защиты от врагов.\n\n«Мы слабы, но вместе сильнее»."
dragonspine.30.a:0"Вместе мы сильнее."
dragonspine.30.b:0"Отказаться."

dragonspine.31.t:0"Предложение хребта"
dragonspine.31.d:0"Хребет предлагает объединить правительства, чтобы выжить. Наши лидеры сохранят посты."
dragonspine.31.a:0"В путь!"
dragonspine.31.b:0"Сохраним независимость."

dragonspine.32.t:0"Предложение хребта"
dragonspine.32.d:0"Хребет предлагает объединиться. Наши лидеры сохранят посты."
dragonspine.32.a:0"В путь!"
dragonspine.32.b:0"Сохраним независимость."

dragonspine.33.t:0"Хребет зовёт к объединению!"
dragonspine.33.d:0"Хребет занял Мондштадт и призывает к мирному объединению. Отказ означает войну."
dragonspine.33.a:0"Война должна закончиться."
dragonspine.33.b:0"Мы не признаем их лидерство!"

dragonspine.34.t:0"Первый рассвет нового Мондштадта"
dragonspine.34.d:0"...Празднование объединения. Сахароза провозгласила «Республику Мондштадта».\n\nВсе смеялись, когда она оговорилась. Это было весело. Затем оркестр сыграл гимн. Прошли парады с бронированными тараканами и гигантскими жуками..."
dragonspine.34.a:0"И что дальше?"

dragonspine.35.t:0"Первый ветер нового Мондштадта"
dragonspine.35.d:0"...Празднование объединения. Сахароза провозгласила «Федерацию Мондштадта».\n\nВсе смеялись, когда она оговорилась. Затем оркестр сыграл гимн. Прошли парады. Вечером — демонстрации.\n\nНа следующее утро люди пели гимн."
dragonspine.35.a:0"Война окончена, мир наступил!"
dragonspine.35.b:0"Милая глава."
dragonspine.35.c:0"Счастливые дни вернулись?"

dragonspine.36.t:0"Первый рассвет нового Мондштадта"
dragonspine.36.d:0"...Вечером прошли демонстрации. Сахароза запустила «искусственное солнце» — символ независимости от богов.\n\nВ каждую годовщину это солнце будет сиять.\n\n			— «История Республики Мондштадт»"
dragonspine.36.a:0"Война окончена, мир наступил!"
dragonspine.36.b:0"Хочу погладить уши Сахарозы."
dragonspine.36.c:0"Мама, я хочу ещё раз посмотреть на жуков."

dragonspine.37.t:0"«Четверг Сахарозы»"
dragonspine.37.d:0"Для продвижения биоалхимической еды Сахароза проводит акции «Четверг Сахарозы».\n\nОчередь за едой и автографами.\n\nОдин посетитель сказал: «Я пришёл не за едой, а чтобы увидеть Сахарозу»."
dragonspine.37.a:0"Сегодня «Четверг Сахарозы», дайте 50 Моры."

dragonspine.38.t:0"Девятиглавый червь"
dragonspine.38.d:0"Харрис верил, что еда — ключ к счастью. Но война прервала поставки.\n\n«Нам нужен лидер», — сказал Стивенс.\n\n«Нет, — сказал Харрис, — нам нужны пирожки из червей!»\n\nВсе достали пирожки. Стивенс был в шоке.\n\n«Ты с ума сошёл? Это яд!»\n\n«Попробуй», — сказали они.\n\nОн попробовал и... остался жив.\n\n(Реклама) «Жареные черви»."
dragonspine.38.a:0"— Сахароза"

dragonspine.39.t:0"Желание Сахарозы"
dragonspine.39.d:0"Вудсон, ставший чиновником, думал, что понимает всех, кроме жены. Но он ошибся.\n\nСахароза, с синяками под глазами, принесла ему документы. Альбедо стоял рядом.\n\n«Это мои идеи, — сказала она. — Я думаю, они пригодятся».\n\nОн взял первый документ и чуть не поперхнулся кофе. Там было написано:"
dragonspine.39.a:0"Проект «Бронированный таракан»"

dragonspine.40.t:0"Бронированный таракан"
dragonspine.40.d:0"Когда Вудсону сказали, что его приглашают на демонстрацию «бронированного таракана», он подумал: «Это реально?»\n\nУвидев его, он был поражён: «Что это?»\n\n«Таракан», — сказала Лина. Он был гладким, с голубыми узорами и грибом на голове для управления.\n\n«Как круто!» — сказал Вудсон.\n\nОн оседлал таракана и назвал его «Лика»."
dragonspine.40.a:0"Пусть повеселится."

dragonspine.41.t:0"Друг по переписке"
dragonspine.41.d:0"«Спасибо за прошлое письмо, — писала Сахароза. — Благодаря вашим советам я создала много нового».\n\n«Мой недавний успех — ваша заслуга... Спасибо»."
dragonspine.41.a:0"Адресат: несуществующий цветок"

dragonspine.42.t:0"Популярная песня"
dragonspine.42.d:0"В ходе войны появилась песня «Приказ Ордена», высмеивающая Орден."
dragonspine.42.a:0"Орден не даст вам жалованья, так что идите на хребет~"
dragonspine.42.b:0"Отправили 500 000 человек спасать Мондштадт от мондштадтцев~"

dragonspine.43.t:0"Патриотическая песня"
dragonspine.43.d:0"Появилась песня «За жареного гуся», обличающая Лоуренсов."
dragonspine.43.a:0"Реакционеры продают Мондштадт, получая жареного гуся~"
dragonspine.43.b:0"Завтра Лоуренсы будут кормить гостей из Шнежной~"
dragonspine.43.c:0"Военачальникам нужен только живот, их семьи сидят в городе, готовясь к предательству~"
dragonspine.43.e:0"Еда для них важнее соотечественников, жизнь мондштадтца не стоит курицы~"

dragonspine.44.t:0"Антивоенная песня"
dragonspine.44.d:0"Появилась песня «Что я узнал в школе», высмеивающая военную пропаганду."
dragonspine.44.a:0"Я узнал, что Орден всегда прав~"
dragonspine.44.b:0"Наш избранный лидер — лучший, выборы творят чудеса~"
dragonspine.44.c:0"Я узнал, что солдаты не умирают, здесь утопия~"
dragonspine.44.e:0"Учитель так мне сказал, вот чему нас учат~"

dragonspine.45.t:0"Новая песня"
dragonspine.45.d:0"Появилась песня «Ода Альбедо», прославляющая его."
dragonspine.45.a:0"Армия Лоуренсов хуже всех, она бежит с поля~"
dragonspine.45.b:0"Орден платит цветами, а мы получаем Мору~"
dragonspine.45.c:0"Под защитой Барбатоса, как ветер, мы идём в бой; кто, как не мы, получает жалованье вовремя?~"
dragonspine.45.e:0"Альбедо, наш герой, сияющее золото хребта! Ради тебя мы готовы перевернуть Мондштадт!~"

dragonspine.46.t:0"Новая песня"
dragonspine.46.d:0"Появилась песня «Песня Сахарозы» о вкусной еде."
dragonspine.46.a:0"Мы любим гель Сахарозы, любим соус Сахарозы~"
dragonspine.46.b:0"Мы любим курицу Сахарозы, любим курицу~"
dragonspine.46.c:0"Вперёд, товарищи, вперёд!~"

dragonspine.47.t:0"Новое название"
dragonspine.47.d:0"Гель Сахарозы переименовали в «соус Сахарозы». Теперь его так и называют."
dragonspine.47.a:0"Народ любит."
dragonspine.47.b:0"Я люблю соус Сахарозы!"
dragonspine.47.c:0"Соус Сахарозы так вкусен..."

dragonspine.48.t:0"Зачем мы воюем?"
dragonspine.48.d:0"Баул стоял на посту, глядя на снег.\n\n«Рыцарь, спускайся», — сказал кто-то.\n\nБаул не двинулся.\n\n«Нас больше не нужно... Правительство шатается...»\n\nЧеловек ушёл, пошатываясь. Баул задумался: «Зачем я здесь?»\n\nОн вспомнил детство, отца, вино...\n\nПисем от отца больше не было.\n\nНа пятый день войны Баул покинул пост."
dragonspine.48.a:0"Больше его никто не видел."

dragonspine.49.t:0"Захват Виноградника Рассвет!"
dragonspine.49.d:0"Армия хребта захватила Виноградник Рассвет."
dragonspine.49.a:0"Пресс-релиз хребта"
dragonspine.49.b:0"Мир близок?"

dragonspine.50.t:0"Захват Виноградника Рассвет!"
dragonspine.50.d:0"Армия Сахарозы захватила Виноградник Рассвет. Жители были удивлены хорошей дисциплиной солдат."
dragonspine.50.a:0"Пресс-релиз хребта"
dragonspine.50.b:0"Мир близок?"

dragonspine.51.t:0"Освобождение замка Лоуренсов!"
dragonspine.51.d:0"Мы взяли замок Лоуренсов. Это поворотный момент в войне."
dragonspine.51.a:0"Мы отомстили!"
dragonspine.51.b:0"Мир близок?"

dragonspine.52.t:0"Освобождение замка Лоуренсов!"
dragonspine.52.d:0"Мы взяли замок Лоуренсов."
dragonspine.52.a:0"Мы отомстили!"
dragonspine.52.b:0"Мир близок?"

dragonspine.53.t:0"Заметки Мурана"
dragonspine.53.d:0"«Ты ещё моешь посуду? Рыцари Белого Мела скоро войдут!» — сказала Лиан.\n\n«Я хочу посмотреть, какие они», — ответил Муран.\n\n«Армия есть армия».\n\nВошли рыцари. «Не бойтесь, мы за мир. Мы будем соблюдать порядок»."
dragonspine.53.a:0"Дисциплинированная армия."
dragonspine.53.b:0"«Мы за мир!»"

dragonspine.54.t:0"Заметки Мурана"
dragonspine.54.d:0"«В таверне много людей», — удивился Фрай.\n\n«Люди успокоились», — сказал Муран.\n\n«Хорошо, что есть еда».\n\n«Появились ягоды».\n\n«Что это за портрет?» — спросил Фрай.\n\n«Сахарозы. На всякий случай»."
dragonspine.54.a:0"...Она милая."
dragonspine.54.b:0"Слышал о выборах?"

dragonspine.55.t:0"Битва с Орденом"
dragonspine.55.d:0"Орден объявил нас мятежниками. Мы будем сражаться.\n\nЭта война — испытание. Орден не может защитить Мондштадт."
dragonspine.55.a:0"Мы больше не верны Ордену."
dragonspine.55.b:0"Враг или друг."
dragonspine.55.c:0"Мы построим новый Мондштадт!"

dragonspine.56.t:0"Заметки Мурана"
dragonspine.56.d:0"«В таверне много людей», — удивился Фрай.\n\n«Люди успокоились», — сказал Муран.\n\n«Хорошо, что есть еда».\n\n«Появились ягоды».\n\n«Что это за портрет?» — спросил Фрай.\n\n«Сахарозы. На всякий случай»."
dragonspine.56.a:0"...Она милая."
dragonspine.56.b:0"Слышал о моём таракане?"

dragonspine.57.t:0"Заметки Мурана"
dragonspine.57.d:0"«Ты ещё моешь посуду? Рыцари Белого Мела скоро войдут!» — сказала Лиан.\n\n«Я хочу посмотреть, какие они», — ответил Муран.\n\nВошли рыцари. «Не бойтесь, мы за мир. Мы будем соблюдать порядок»."
dragonspine.57.a:0"У меня плохое предчувствие. Уйдём через подземный ход."
dragonspine.57.b:0"«Мы за мир!»"

dragonspine.58.t:0"На ветру"
dragonspine.58.d:0"«Я всё ещё не понимаю начальство...» — ворчал Том. «Я не могу привыкнуть к этому таракану! Джерри, а ты?»\n\n«Ага», — рассеянно ответил Джерри, сжимая гриб на голове таракана. «Отдых закончился, едем».\n\n«Линк-старт!»\n\nОни мчались на тараканах. Джерри чувствовал странную связь.\n\nВдруг он услышал женский голос."
dragonspine.58.a:0"«Джерри...»"
dragonspine.58.b:0"Чей это голос?"

dragonspine.59.t:0"Хребет объявляет нейтралитет"
dragonspine.59.d:0"Хребет объявляет о нейтралитете, отказываясь от налогов и помощи Ордену.\n\nУ них проблемы с продовольствием и хаосом."
dragonspine.59.a:0"Каждая сторона делает выбор."
dragonspine.59.b:0"Это измена!"
dragonspine.59.c:0"Они защищают себя."
dragonspine.59.e:0"Орден теряет союзников."
dragonspine.59.f:0"Можно атаковать их."
dragonspine.59.g:0"Они хотят выжить."
dragonspine.59.h:0"У хребта есть амбиции."

dragonspine.60.t:0"Беженцы в Вольфендоме"
dragonspine.60.d:0"Беженцы стекаются в Вольфендом, где создано временное правительство."
dragonspine.60.a:0"Каждая сторона делает выбор."
dragonspine.60.b:0"Это раскол."
dragonspine.60.c:0"Бедные люди."
dragonspine.60.e:0"Орден не может защитить народ."
dragonspine.60.f:0"Трусы."
dragonspine.60.g:0"Несчастные."
dragonspine.60.h:0"О."

dragonspine.61.t:0"Торговля с хребтом"
dragonspine.61.d:0"Хребет предлагает обмен технологий на ресурсы. Согласиться?"
dragonspine.61.a:0"Гражданские технологии."
dragonspine.61.b:0"Военные технологии."
dragonspine.61.c:0"Морские и воздушные технологии."
dragonspine.61.e:0"Нет."

dragonspine.62.t:0"Успех"
dragonspine.62.d:0"Ответ получен. Сделка заключена."
dragonspine.62.a:0"Отлично!"

dragonspine.63.t:0"Неудача"
dragonspine.63.d:0"Ответ получен. Отказ."
dragonspine.63.a:0"Они не понимают..."

dragonspine.64.t:0"Плоды модернизации"
dragonspine.64.d:0"Инвестиции окупились. Экономика процветает."
dragonspine.64.a:0"Отлично!"

dragonspine.65.t:0"Хребет выходит из нейтралитета"
dragonspine.65.d:0"Хребет меняет курс."
dragonspine.65.a:0"Дракон проснулся."
dragonspine.65.b:0"Неважно."

dragonspine.66.t:0"Конец войны"
dragonspine.66.d:0"«Мама!»\n\nРебёнок смотрел на толпу.\n\n«Много людей!»\n\nЛиза объявила о создании федерации. Люди кричали."
dragonspine.66.a:0"Наконец..."
dragonspine.66.b:0"Война окончена!"

dragonspine.67.t:0"Выбор"
dragonspine.67.d:0"Лиза задумалась. Интернет, созданный по образцу Сумеру, развивался слишком быстро.\n\nНужно остановить это.\n\nНо народ просил сохранить его."
dragonspine.67.a:0"Правильное решение. Мы продолжим."
dragonspine.67.b:0"Пусть не будет печали..."

dragonspine.68.t:0"Конец плача"
dragonspine.68.d:0"Решение принято. Мы подключаем всех."
dragonspine.68.a:0"Это последняя война."
dragonspine.68.b:0"Пусть не будет печали..."

dragonspine.69.t:0"Ребёнок"
dragonspine.69.d:0"Поток сознания сформировался.\n\n«Я —»\n\nКто оно?"
dragonspine.69.a:0"§b«Мы»§!"
dragonspine.69.b:0"§B«Большое мы»§!"
dragonspine.69.c:0"§3«Океан»§!"
dragonspine.69.e:0"§R«Большой коллектив»§!"
dragonspine.69.f:0"§5«Мондштадт»§!"
dragonspine.69.g:0"§g«Проект G11-AKUR-45»§!"

dragonspine.70.t:0"Свадьба"
dragonspine.70.d:0"Свадьба медиков, спасших многих.\n\nВсе смеялись.\n\nБард играл."
dragonspine.70.a:0"Счастливая пара."
dragonspine.70.b:0"Как пробуждение."

dragonspine.71.t:0"Слёзы Сахарозы"
dragonspine.71.d:0"Психолог сообщила, что Сахароза часто плачет без причины."
dragonspine.71.a:0"Нужно помочь ей."
dragonspine.71.b:0"Кто её обидел?"

dragonspine.72.t:0"Сахароза упала в обморок"
dragonspine.72.d:0"Сахароза потеряла сознание перед выступлением."
dragonspine.72.a:0"Нужно помочь ей."
dragonspine.72.b:0"Кто её так загонял?"

dragonspine.73.t:0"Сахароза бодра"
dragonspine.73.d:0"Сахароза здорова."
dragonspine.73.a:0"Так держать."
dragonspine.73.b:0"Маленький вклад."

dragonspine.74.t:0"Не моя война"
dragonspine.74.d:0"«Не плачь».\n\nНо ребёнок плакал.\n\nВсе шли молча.\n\nЛина вспоминала довоенную жизнь. Она взяла ребёнка."
dragonspine.74.a:0"Беженцы, идите в хребет."
dragonspine.74.b:0"Справедливость только в мире."

dragonspine.75.t:0"Возвращение души"
dragonspine.75.d:0"Юлий очнулся во тьме.\n\n«Извините, я забыл изменить форму», — сказал световой шар. — «Я Кайсар, вы мертвы, но ваша душа сохранена».\n\n«Скажите жене, чтобы не горевала».\n\n«Вы сможете управлять телом и работать».\n\n«Ах».\n\n«И сможете видеть их»."
dragonspine.75.a:0"Будут этические вопросы."

dragonspine.76.t:0"Хлеб!"
dragonspine.76.d:0"Джозеф вернулся домой.\n\n«Папа, привет!»\n\nОн приготовил ужин.\n\nСнег стучал в окно."
dragonspine.76.a:0"«Джоэль, ешь мясо»."

dragonspine.77.t:0"Будущее Мондштадта"
dragonspine.77.d:0"Рыцарь спросил врага: «За что ты воюешь?»\n\n«За будущее Мондштадта!»\n\n«А ты?»\n\n«Я была рыбачкой. Мой муж и ребёнок погибли. Я воюю за других детей».\n\nВраг замешкался, и она убила его."
dragonspine.77.a:0"За детей Мондштадта!"

dragonspine.78.t:0"Захват Виноградника Рассвет"
dragonspine.78.d:0"Лиза пришла в Виноградник Рассвет. Рабочие боялись.\n\n«Здесь ещё делают вино?» — спросила она.\n\nСтрах ушёл.\n\nЭто войдёт в историю."
dragonspine.78.a:0"«Лиза и освобождённый народ»"

dragonspien.1.t:0"Золотой путь"
dragonspien.1.d:0"«...Администрация стабилизирована, другие дела решаются... Доклад окончен». Вудсон сел. Альбедо встал, и в комнате стало тихо.\n\nЛюди чувствовали спокойствие."
dragonspien.1.a:0"Иди к Альбедо, он дарит покой."

dragonspien.2.t:0"Голод"
dragonspien.2.d:0"«Говорят, будет выбор еды!» — сказала Лина.\n\nВудсон промолчал. Они могли выбирать только чёрный хлеб и воду.\n\n«А что там, в переулке?»\n\nЭто был труп."
dragonspien.2.a:0"«Не смотри, пошли»."

dragonspien.3.t:0"Баланс"
dragonspien.3.d:0"«Раньше в деревне было трудно, — писала Хейлс. — Теперь урожай вырос».\n\n«Помогите с пособием», — попросил крестьянин.\n\n«Посади пшеницу и получишь субсидию»."
dragonspien.3.a:0"Ешь мясо — иди к Альбедо."

dragonspien.4.t:0"Будущее"
dragonspien.4.d:0"«Земли хребта преобразились», — писала Хейлс.\n\n«Равняйсь! Беженцы, равняйсь!»\n\nТракторы пахали поля."
dragonspien.4.a:0"Спасибо за курицу."

dragonspien.5.t:0"Конец голода"
dragonspien.5.d:0"«Сегодня много еды», — сказала Лина.\n\n«Снабжение наладилось».\n\nРестораны открылись.\n\nВ переулке никого не было."
dragonspien.5.a:0"Альбедо молодец."
dragonspien.5.b:0"Что завтра?"

dragonspien.6.t:0"Странное явление"
dragonspien.6.d:0"Нельсон проснулся без головной боли.\n\n«Надо закупать товары, цены растут».\n\nОн пошёл в магазин и увидел всех своих коллег, включая Банда."
dragonspien.6.a:0"«Банд, ты здесь?!»"
dragonspien.6.b:0"Завод безлюден."

dragonspien.7.t:0"Бестселлер"
dragonspien.7.d:0"Вышла книга «Необычный хребет» о рабочем, разбогатевшем благодаря труду."
dragonspien.7.a:0"Классика."
dragonspien.7.b:0"Понятно."

dragonspien.8.t:0"Литература успеха"
dragonspien.8.d:0"Популярны книги о саморазвитии."
dragonspien.8.a:0"Цель — работа."
dragonspien.8.b:0"Ага."

dragonspien.9.t:0"Возвращение пасты"
dragonspien.9.d:0"«Тихо», — сказал Нельсон. — «Товары появились».\n\n«Да, производство налажено».\n\n«Я стану «рыцарем труда»»."
dragonspien.9.a:0"Наш труд не напрасен."
dragonspien.9.b:0"Банд, о чём ты?"

dragonspien.10.t:0"Антивоенная песня"
dragonspien.10.d:0"Появилась песня «У Лоуренса одно яйцо»."
dragonspien.10.a:0"У Лоуренса одно яйцо~"
dragonspien.10.b:0"Не учите детей!"

dragonspien.11.t:0"Незавершённое"
dragonspien.11.d:0"Незавершённое"
dragonspien.11.a:0"Незавершённое"
dragonspien.11.b:0"Незавершённое"

dragonspien.12.t:0"Незавершённое"
dragonspien.12.d:0"Незавершённое"
dragonspien.12.a:0"Незавершённое"
dragonspien.12.b:0"Незавершённое"

dragonspien.13.t:0"Популярная песня"
dragonspien.13.d:0"Появилась песня «Хребет»."
dragonspien.13.a:0"Они отнимают у вас семьи!"
dragonspien.13.b:0"Вперёд, все как один!"

dragonspien.14.t:0"Мир в Мондштадте"
dragonspien.14.d:0"«Вудсон, уже виден Мондштадт!»\n\nОн проснулся. Война кончилась.\n\nЛина сжала его руку."
dragonspien.14.a:0"Он чувствовал тепло."
dragonspien.14.b:0"Наконец..."

dragonspien.15.t:0"Незавершённое"
dragonspien.15.d:0"Незавершённое"
dragonspien.15.a:0"Незавершённое"
dragonspien.15.b:0"Незавершённое"

dragonspien.16.t:0"Незавершённое"
dragonspien.16.d:0"Незавершённое"
dragonspien.16.a:0"Незавершённое"
dragonspien.16.b:0"Незавершённое"

dragonspien.17.t:0"Незавершённое"
dragonspien.17.d:0"Незавершённое"
dragonspien.17.a:0"Незавершённое"
dragonspien.17.b:0"Незавершённое"

dragonspien.18.t:0"Книга анекдотов"
dragonspien.18.d:0"Вышла «Книга мондштадтских анекдотов»."
dragonspien.18.a:0"Не смешно."
dragonspien.18.b:0"Автор в розыске."

dragonspien.19.t:0"Книга анекдотов"
dragonspien.19.d:0"Второй том."
dragonspien.19.a:0"Почему я это вижу?"
dragonspien.19.b:0"Готовим облаву."

dragonspien.20.t:0"Книга анекдотов"
dragonspien.20.d:0"Третий том."
dragonspien.20.a:0"Как ты смеешь?"
dragonspien.20.b:0"Почему его не поймают?"

dragonspien.21.t:0"Книга анекдотов"
dragonspien.21.d:0"Анекдот о депутате."
dragonspien.21.a:0"Забавно."
dragonspien.21.b:0"Это наша свобода."

dragonspien.22.t:0"Книга анекдотов"
dragonspien.22.d:0"Анекдот о шпионах."
dragonspien.22.a:0"Интересно."
dragonspien.22.b:0"Он думает, что смешно?"

dragonspien.23.t:0"Книга анекдотов"
dragonspien.23.d:0"Анекдот о газете."
dragonspien.23.a:0"Кратко."
dragonspien.23.b:0"Автор наглеет."

dragonspien.97.t:0"Взгляд"
dragonspien.97.d:0"«Я видела Альбедо на фотографии», — сказала Хейлс.\n\n«Удачи». — сказал Ирва.\n\n«Но я видела его дважды»."
dragonspien.97.a:0"Может, есть лестница?"
dragonspien.97.b:0"Они заодно?"

dragonspien.98.t:0"Возрождение свободы"
dragonspien.98.d:0"«Наши предки свергли аристократию и создали свободную страну.»\n\n«Теперь мы объединили Мондштадт.»\n\n«Мы посвятим себя великому делу.»\n\n				— Альбедо"
dragonspien.98.a:0"За свободу!"

dragonspien.99.t:0"Возрождение нации"
dragonspien.99.d:0"«Кристаллизация очищает материю, а диктатура делает нацию сильной.»\n\n«Мы верим, что нация — это договор. Когда правительство не исполняет его, народ имеет право на расторжение.»\n\n«Старое правительство провалилось. Мы объявляем о создании Национальной Республики Мондштадт.»\n\n				— Альбедо"
dragonspien.99.a:0"Да здравствует Мондштадт и свобода!"

geneideachange.1001.t:0"Рост производительности"
geneideachange.1001.d:0"Производительность выросла."
geneideachange.1001.a:0"Вперёд!"
geneideachange.1001.b:0"Спасибо за пасту."

geneideachange.1002.t:0"Боевой дух растёт"
geneideachange.1002.d:0"Солдаты активны."
geneideachange.1002.a:0"Кто-то должен воевать."
geneideachange.1002.b:0"Народ нуждается в нас!"

geneideachange.1003.t:0"Рост продовольствия"
geneideachange.1003.d:0"Урожай вырос."
geneideachange.1003.a:0"Маленький вклад."
geneideachange.1003.b:0"Можно сфотографироваться?"

geneideachange.1004.t:0"Смягчение конфликтов"
geneideachange.1004.d:0"Конфликты уменьшились."
geneideachange.1004.a:0"Единство!"
geneideachange.1004.b:0"Мы одна семья."

geneideachange.1005.t:0"Рост продовольствия"
geneideachange.1005.d:0"Урожай вырос немного."
geneideachange.1005.a:0"Заслуга крестьян."
geneideachange.1005.b:0"Мы сделали три вещи..."

geneideachange.1006.t:0"Рост производительности"
geneideachange.1006.d:0"Производительность выросла."
geneideachange.1006.a:0"Мы зависим от этого."
geneideachange.1006.b:0"Спасибо за пасту."

geneideachange.1007.t:0"Боевой дух растёт"
geneideachange.1007.d:0"Солдаты возвращаются."
geneideachange.1007.a:0"К оружию."
geneideachange.1007.b:0"Вернуться на посты."

geneideachange.1008.t:0"Смягчение конфликтов"
geneideachange.1008.d:0""
geneideachange.1008.a:0"Мир."
geneideachange.1008.b:0"Тише."

geneideachange.1009.t:0"Незавершённое"
geneideachange.1009.d:0"Незавершённое"
geneideachange.1009.a:0"Незавершённое"
geneideachange.1009.b:0"Незавершённое"

#news
DRA_news.1.t:0"Национал-витализм объединил Мондштадт!"
DRA_news.1.d:0"Гражданская война в Мондштадте закончилась. Победил Драконий хребет.\n\nАльбедо объявил о создании Национальной Республики Мондштадт, основанной на «национал-витализме»."
DRA_news.1.a:0"Что за чушь?"
DRA_news.1.b:0"Дух хорош, но..."
DRA_news.1.c:0"Мы за свободу!"
DRA_news.1.e:0"Реакционеры!"

DRA_news.2.t:0"Консервативный ревизионизм объединил Мондштадт!"
DRA_news.2.d:0"Гражданская война закончилась. Победил Драконий хребет.\n\nАльбедо объявил о создании Свободной Федерации Мондштадта."
DRA_news.2.a:0"Лучше, чем экстремисты."
DRA_news.2.b:0"Это не остановит новую войну."
DRA_news.2.c:0"Да здравствует свободный Мондштадт!"
DRA_news.2.e:0"Справедливость любой ценой!"

DRA_news.3.t:0"Футуризм объединил Мондштадт!"
DRA_news.3.d:0"Гражданская война закончилась. Победил Драконий хребет.\n\nСахароза объявила о создании Республики Мондштадт."
DRA_news.3.a:0"Слишком радикально."
DRA_news.3.b:0"Новый друг."
DRA_news.3.c:0"Мечтайте, друзья!"
DRA_news.3.e:0"Смешно..."

DRA_news.4.t:0"Социал-ревизионизм объединил Мондштадт!"
DRA_news.4.d:0"Гражданская война закончилась. Победил Драконий хребет.\n\nСахароза объявила о создании Федеративного Содружества Мондштадта."
DRA_news.4.a:0"Слишком радикально."
DRA_news.4.b:0"Хотелось бы больше прогресса."
DRA_news.4.c:0"Видите ли вы свет?"
DRA_news.4.e:0"Они не продержатся."

DRA_news.5.t:0"Рыцари Белого Мела взяли Мондштадт!"
DRA_news.5.d:0"Хребет занял Мондштадт."
DRA_news.5.a:0"Смутное время."
DRA_news.5.b:0"Путь к миру!"

DRA_news.7.t:0"Рыцари Белого Мела взяли Виноградник Рассвет!"
DRA_news.7.d:0"Хребет захватил Виноградник Рассвет."
DRA_news.7.a:0"Смутное время."
DRA_news.7.b:0"Вперёд!"

DRA_news.8.t:0"Рыцари Белого Мела взяли Виноградник Рассвет!"
DRA_news.8.d:0"Хребет захватил Виноградник Рассвет. Сахароза раздала продовольствие."
DRA_news.8.a:0"Смутное время."
DRA_news.8.b:0"Вперёд!"

DRA_news.9.t:0"Социал-либерализм объединил Мондштадт!"
DRA_news.9.d:0"Гражданская война закончилась. Победил Драконий хребет.\n\nЛиза объявила о создании нового правительства."
DRA_news.9.a:0"Справедливость!"
DRA_news.9.b:0"Война окончена."
