# 凝光执政危机
#####################
 LYY_Wash_decision_categories_II:"凝光执政危机"
 LYY_Wash_decision_categories_II_desc:"帝君遇刺之后，凝光摄政，而执政之危日深：大萧条所至，市井凋敝，百姓怨声载道，短期新政不足以缓之，临时政府之合法性遂遭挑战。神灵辞世，权柄空虚，三方各怀其志：三眼五显仙人、月海亭、七星内部之反对派，争相发难，各执其词。境外之地，北有蒙德，西有须弥，东有稻妻，皆虎视眈眈，磨拳擦掌。至此危局，国事维艰，尔等安得不体谅凝光阁下一二乎？群玉阁灯火彻夜，奏牍积案，侍者三易烛而不敢息。§R当前执政危机等级：[?LYY_Work_Pressure]§!"
 LYY_Wash_decision_II:"清洗进行中"
 LYY_Wash_decision_II_desc:"危机日深，璃月之政乱将愈烈，凝光阁下属之兰生索命厅或以极端之策解之。此举或可缓其执政之危。"
 LYY_Wash_decision_result:"执政危机或将缓解"
 LYY_Wash_event_II.1.t:"公审叛徒"
LYY_Wash_event_II.1.d:"思之再三，必为璃月内有奸细作祟，其策划帝君遇刺之事，欲使璃月陷于不可回之惨境。纵粉身碎骨，亦当为璃月扫清尘埃！此人不思忠君报国，谋刺岩王帝君，阴谋结反动之党，专事破坏璃月之和，依临时政府特别军事管理法，当处以极刑！岩上茶室主人·天权星特别情报官·总务司兰生索命厅长·夜兰阁下。"
 LYY_Wash_event_II.1.a:"一家哭何如一国哭！"
 LYY_Wash_event_II.2.t:"虚惊一场"
LYY_Wash_event_II.2.d:"依总务司兰生索命厅夜兰阁下之详查，此人无确凿叛国之行为与证据可入罪。兰生索命厅不屑造冤假之案，故此人幸而逃过一劫。"
 LYY_Wash_event_II.2.a:"望尔等忠君报国！"
 LYY_Wash_decision_death:"一位璃月柱石被处决！"
 LYY_Wash_event_II.3.t:"璃月临时政府成立"
 LYY_Wash_event_II.3.d:"天权凝光，受任于帝君遇刺之际，奉命于国家危难之间，百般思量，不知救国何如，故而遍访遗贤，求问治国之道！"
 LYY_Wash_event_II.3.a:"礼之用和为贵！"
 LYY_Wash_event_II.3.b:"乱世当用重典！"
 LYY_Wash_decision_II_Conspiracy_Increase:"阴谋进行中"
 LYY_Wash_decision_II_Conspiracy_Increase_desc:"神灵辞世，权柄空虚，各方野心勃勃：三眼五显仙人、月海亭、七星内部之反对派，争相发难。此举将加剧凝光阁下之执政危机。"
 LYY_Wash_decision_Conspiracy_Increase:"执政危机或将加剧"
 LYY_Wash_decision_II_Cat:"组织撸猫活动"
 LYY_Wash_decision_II_Cat_desc:"将自蒙德猫尾酒馆租猫一批，组织公务员撸猫疗心，以缓其阴谋之进度。"
 LYY_Wash_decision_over:"§R如果璃月临时政府仍然存在，则触发效果：凝光执政危机结束，内战危机结束！§!"

