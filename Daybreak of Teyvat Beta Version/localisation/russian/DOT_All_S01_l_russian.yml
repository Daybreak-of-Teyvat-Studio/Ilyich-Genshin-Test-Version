ANR_Bennett_Special_Decisions:0"Душа первопроходца"
ANR_Bennett_Special_Decisions_desc:0"\nНо Беннет не остановился, он чувствовал, что все страдания, которые он пережил в прошлом, были лишь подготовкой к преодолению этого испытания.\nВ конце этого адского пути его ждало...\n"
