 #############
 # ヒルチャール
 #############
 Ilyich_Hilichurl:"ヒルチャール"
 Ilyich_Hilichurl_equipment:"ヒルチャール"
 Ilyich_Hilichurl:"テイワットの荒野をさすらう原始の民。人間に似た姿を持つが、知恵と霊性を失っている。記録によれば千年以上も大地に出没してきたが、歴史も文明も持たない。五百年前の漆黒の災厄以降、大地の各地に広く分布するようになった。個々は力が弱く統率もないが、時に人々に多大な厄介事をもたらす。"
 Ilyich_Hilichurl_Support:"ヒルチャール支援小隊"
 Ilyich_Hilichurl_Support_equipment:"ヒルチャール支援小隊"
 Ilyich_Hilichurl_Support:"テイワットの荒野をさすらう原始の民。人間に似た姿を持つが、知恵と霊性を失っている。記録によれば千年以上も大地に出没してきたが、歴史も文明も持たない。五百年前の漆黒の災厄以降、大地の各地に広く分布するようになった。個々は力が弱く統率もないが、時に人々に多大な厄介事をもたらす。"
