 # 璃月大加班 event
 LYYwash.1.t:"头条：公务员暴毙！"
LYYwash.1.d:"于吾辈超速运转之政府工作中，许多勤恳之公务员如被割倒之麦，成片而倒。多人于晕倒时打碎手边之器，将免费供应之落日果汁洒于一地。扫地之妇入办公室，便见一群人倒于鲜红之液中。虽彼等惟是晕倒，然此惊悚之景遂成传言，许多民众误以为吾辈之公务员已集体暴毙。传言初起于北码头，一日而遍港中。有商贾闻之，闭户不市，云官府已空。总务司急出告示，言诸吏无恙，惟劳顿耳。告示贴出，观者不解，问曰：既无恙，何以倒？吏不能答，告示遂为笑谈。自后凡有吏倒于案上，同僚辄以果汁戏之。上官闻而怒，禁言此事，禁之愈急，传之愈广。有吏扶墙而行，行三步而倚。茶房日夜煮姜汤，汤尽则以冷水代之，饮者不觉。"
 LYYwash.1.a:"抢救这些人！然后，也许是时候休息一下了。"
LYYwash.1.b:"积压之务愈多，惟有加班！"
 LYYwash.2.t:"头条：将领在加班中猝死！"
LYYwash.2.d:"因任务过重，吾辈直至见报方知此讯：吾辈一位暂离军事之域、为处当前之危而任事之将领，于无尽之工作中晕倒。一部分之新闻媒体已打出将领猝死之题，幸而吾辈已及时寻得此诸媒体，有必要则可令其缄口。吾辈当何为？将领之名不见于报，报中但称某将军。其属吏守于门外，不使人入，云将军方寐。医者出，云脉尚在，惟气血两亏，非旬月可复。媒体之馆在绯云坡，凡三家，皆受牒而去。其一家不受牒，翌日排版房火，稿尽焚。市井闻之，皆不复问将军之死生，而问火从何起。总务司答曰：天干物燥。众皆笑而不言。将军于三日后醒，醒即索文书，左右不与。此事终不了了之。报馆主人后迁于外港，云此地不宜久居，然其馆仍日出一纸。"
 LYYwash.2.a:"快治疗这家伙，工作还没结束呢！"
LYYwash.2.b:"压下此事，使倒下者隐而休之！"
 LYYwash.3.t:"头条：千岩军巡逻队员横死街头！"
LYYwash.3.d:"璃月新闻界已开始为一新消息撰文：一位千岩军将士于巡逻时倒下，为街边民众送去抢救。此诸媒体为吸人眼目，已将这位将士定义为横死之人。姑置将至之舆论批判不论，吾辈当如何处置此事？将士名阿吉，年二十三，守南码头三年。医者云：中暑，非死。报馆已印，字大如钱，题曰：又一横死。其家闻之，母哭于门，邻里皆来。同营之卒往报社，请改其题，报馆不开门。卒怒，欲撞门，为队正所止。队正曰：此非武人可争之事，当诉于有司。有司受牒，三日不报。阿吉醒于第四日，自起而食粥。报馆闻之，改题曰：将士复苏，官医神效。阿吉见报，掷之于地，云：吾非死于报上，何以复活于报上？众皆大笑。阿吉自此不喜见报。"
 LYYwash.3.a:"给巡逻队安排一段休息时间。"
LYYwash.3.b:"今非倒下之时，纵死亦当续任！"
 LYYwash.4.t:"头条：将领因缺乏休息而精神失常！"
LYYwash.4.d:"据新闻媒体报道，吾辈一位将领出现明显之行为之碍，要为行动迟缓、认知失常，其状一日坏于一日，似为此前高强度之加班所致。此事已于民众中激起热议，许多人疑吾辈璃月政府歧视武官，将过多之工作付于将领。医者诊之，云脑中有积，非药可速去。其夫人日侍于侧，凡文书皆匿不使见。将领醒则索图，夫人以白纸进，彼视之良久，曰：此图无山。民间议者分二派：一曰恤之，一曰贬之。恤者云：此人为璃月劳而死其半。贬者云：武人素悍，安有劳而病者？此诈也。两派争于茶楼，至夜不散。总务司遣医三人会诊，诊毕不署名。或问其故，医曰：脉可书，断不可书。将军终不能复起，退居于奥藏山下，日对一石。石上有刀痕，深浅不一。"
 LYYwash.4.a:"让他休个假吧，不过不要让别人知道。"
 LYYwash.4.b:"让他歇几天，然后立刻起来工作！"
 LYY_Wash1_dynamic_modifier:"加班狂潮"
 LYY_Wash1_dynamic_modifier_desc:"然也。七星安璃月之功，不至白费。惟加班不息，则前路自不断延伸。"
