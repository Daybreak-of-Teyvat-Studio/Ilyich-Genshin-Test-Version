#ideas
gene_bad_development:0"Замедленное экономическое развитие:0"
gene_bad_development_desc:0"Наше экономическое развитие замедлено, что вынуждает нас тратить больше ресурсов на социальные нужды и стабильность. Если не исправить ситуацию, мы отстанем в гонке развития."

gene_better_development:0"Строительство нашей страны"
gene_better_development_desc:0"Наши совместные усилия приносят плоды, экономика страны процветает. Мы своими руками построим светлое будущее."

gene_backward_industry:0"Отсталая промышленность"
gene_backward_industry_desc:0"Наша промышленность отстала: она потребляет много ресурсов и труда, но даёт мало продукции, что ограничивает нашу военную промышленность."

gene_advanced_production:0"Передовые производственные линии"
gene_advanced_production_desc:0"Наши технологии превосходят средний уровень Тейвата на несколько лет — мы можем производить больше товаров и оружия за меньшее время, что поможет нам выжить в грядущем хаосе."

gene_not_industrialization:0"Отсутствие индустриализации"
gene_not_industrialization_desc:0"У нас нет промышленности, и многие товары, которые должны производиться массово, изготавливаются кустарно."

gene_industrialized_well:0"Процветающие промышленные цепочки"
gene_industrialized_well_desc:0"Наше промышленное производство достигло пика в Тейвате — все отрасли работают в связке, создавая процветание."

gene_low_initiative:0"Низкая производительность труда"
gene_low_initiative_desc:0"Наши рабочие не горят желанием работать — хотя внешне они трудятся, производительность падает."

gene_labour_active:0"Сознательный труд"
gene_labour_active_desc:0"Наши меры поощрения и пропаганды приносят плоды — рабочие с энтузиазмом идут на заводы ради общего будущего."

gene_labour_active_2:0"Передовое управление производством"
gene_labour_active_2_desc:0"Мы улучшили управление, исключив саботаж и повысив координацию между производственными единицами."

gene_backward_agriculture:0"Отсталое сельское хозяйство"
gene_backward_agriculture_desc:0"Мы ведём сельское хозяйство по старинке, используя примитивные орудия и методы. Многие крестьяне даже не знают, что Дендро ускоряет рост растений. Эта «традиция» отнимает много сил и ресурсов, и без реформ мы не сможем развиваться дальше."

not_enough_farms:0"Нехватка продовольствия"
not_enough_farms_desc:0"Продовольствие — основа общества, и у нас как раз его не хватает. Без стабильных поставок эта проблема будет отвлекать нас и истощать бюджет."

gene_advanced_large_farms:0"Передовое крупное фермерство"
gene_advanced_large_farms_desc:0"Мы создали сельскохозяйственную модель, почти не требующую ручного труда. Огромные поля, механизация, пестициды и препараты Дендро обеспечивают невиданную производительность труда."

gene_efficient_intensive_agriculture:0"Эффективное интенсивное сельское хозяйство"
gene_efficient_intensive_agriculture_desc:0"Мы создали новую модель: крестьяне объединяются в кооперативы, совместно используют оборудование и передовые технологии, решая проблемы, которые веками мучили земледельцев Тейвата. Наша урожайность с единицы площади бьет все рекорды."

gene_agricultural_nation:0"Идиллия"
gene_agricultural_nation_desc:0"Наше общество основано на сельском хозяйстве. Большая часть населения занята в этой сфере, поэтому мы лучше владеем навыками и имеем необходимую инфраструктуру."

gene_agri_for_industry:0"Промышленность и сельское хозяйство вместе"
gene_agri_for_industry_desc:0"Наше сельское хозяйство и промышленность развиваются параллельно, дополняя друг друга. Развитие сельского хозяйства позволяет людям работать в промышленности, а промышленность даёт технику для сельского хозяйства."

gene_agri_grow_with_industry:0"Промышленность помогает сельскому хозяйству"
gene_agri_grow_with_industry_desc:0"Ради развития промышленности мы готовы жертвовать частью сельхозпроизводства. В краткосрочной перспективе это вредно, но в долгосрочной промышленность поможет сельскому хозяйству."

gene_backward_resources_production:0"Отсталая добыча ресурсов"
gene_backward_resources_production_desc:0"Наши технологии добычи устарели, аварии на шахтах — обычное дело; слизь добывается в боях со слаймами, а не на фермах."

gene_advanced_resources_production:0"Передовая добыча ресурсов"
gene_advanced_resources_production_desc:0"Мы внедрили передовые технологии, обеспечив безопасный и эффективный труд, что стимулирует развитие других отраслей."

gene_high_burden:0"Огромное финансовое бремя"
gene_high_burden_desc:0"Мы столкнулись с огромными расходами, вынуждающими сокращать другие статьи бюджета."

gene_low_burden:0"Финансовое бремя"
gene_low_burden_desc:0"Мы столкнулись с значительными расходами, которые замедляют наше развитие."

gene_less_burden:0"Сокращение расходов"
gene_less_burden_desc:0"Наши расходы сократились, и сэкономленные средства можно направить на другие нужды."

gene_little_welfare:0"Символические льготы"
gene_little_welfare_desc:0"У нас есть социальные льготы... только на бумаге."

gene_middle_welfare:0"Умеренные льготы"
gene_middle_welfare_desc:0"Мы предоставляем гражданам умеренные социальные гарантии, чтобы они не беспокоились о выживании и болезнях."

gene_high_welfare:0"Высокий уровень льгот"
gene_high_welfare_desc:0"Наши граждане получают лучшие социальные гарантии в Тейвате — смертельно больные получают дорогие лекарства бесплатно, никто не беспокоится о жилье."

gene_construct_our_future:0"Вместе строим будущее"
gene_construct_our_future_desc:0"Мы и наши союзники договорились в ближайшие годы совместно развивать экономику и создавать светлое будущее."

gene_fight_together:0"Концентрация сил"
gene_fight_together_desc:0"Перед лицом грядущего хаоса в Тейвате мы сосредоточим силы в руках самого важного игрока, чтобы он привёл нас к будущему."

gene_political_chaos:0"Политический хаос"
gene_political_chaos_desc:0"Наше правительство парализовано: указы противоречат друг другу, регионы оспаривают власть центра, оппозиция сеет смуту. Мы не можем ничего сделать."

gene_united_as_one_man:0"Единство"
gene_united_as_one_man_desc:0"Внутренние политические силы консолидировались ради общей цели. Эта рожденная в единстве сила приведёт нас к победе."

gene_common_ground_among_us:0"Многообразие"
gene_common_ground_among_us_desc:0"Наша политическая система позволяет различным силам высказываться без излишних конфликтов, все разногласия решаются путём переговоров."

gene_one_country:0"Одна страна"
gene_one_country_desc:0"Перед лицом беспрецедентной угрозы слабый либерализм приведет нас к гибели. Теперь наша воля будет исполняться, и ничто не остановит нас!"

gene_public_opposition:0"Народное недовольство"
gene_public_opposition_desc:0"Народ выступает против нас — либо против нашей политики, либо против нас самих. Это создаёт препятствия и сеет нестабильность."

gene_public_support:0"Народная поддержка"
gene_public_support_desc:0"Благодаря нашим усилиям народ поддерживает нас. Наша политика получает априорное одобрение и реализуется более эффективно."

gene_one_leader:0"Один лидер"
gene_one_leader_desc:0"Человек в схватке со зверем не может думать о голоде, иначе он погибнет. Страна перед лицом смерти не может тратить время на демократические процедуры. Народ понял, что лучший выбор — просто поддерживать своего лидера."

gene_farsighted_culture:0"Футуристическая метакультура"
gene_farsighted_culture_desc:0"Благодаря далекоидущей социологии мы изменили мышление нашего народа, и поддержка нашей политики — лишь побочный продукт этого успеха. В отличие от иностранцев, ослеплённых фанатизмом, наш народ поддерживает нас осознанно, оценивая наши решения рационально."

gene_cultural_conflict:0"Культурный конфликт"
gene_cultural_conflict_desc:0"В нашем обществе живут люди разных культур, и конфликты между ними усиливаются. Это серьёзный дестабилизирующий фактор. Если не решить проблему, мы можем стать свидетелями терактов."

gene_cultural_harmony:0"Культурная гармония"
gene_cultural_harmony_desc:0"Разные этнические группы в нашей стране наконец-то мирно сосуществуют, считая друг друга соотечественниками, а не врагами. Наши силы объединены ради общего процветания."

gene_one_nation:0"Одна нация"
gene_one_nation_desc:0"Наша страна объединена под знаменем одной нации — величайшего и подлинного знамени."

gene_ungoverned_Vision:0"Неуправляемые обладатели Глаза Бога"
gene_ungoverned_Vision_desc:0"Число обладателей Глаза Бога в нашем обществе достигло значительной величины, а их бесконтрольность создаёт проблемы с порядком."

gene_organized_Vision:0"Организованный контроль над обладателями Глаза Бога"
gene_organized_Vision_desc:0"Мы создали эффективную систему управления обладателями Глаза Бога, подавив смутьянов и предоставив талантливым возможность приносить пользу обществу."

gene_initiative_of_V_owner:0"Инициатива обладателей Глаза Бога"
gene_initiative_of_V_owner_desc:0"Поощряемые нами обладатели Глаза Бога активно участвуют в войне, производстве и управлении, ускоряя развитие общества."

gene_V_owner_vanguard:0"Авангард обладателей Глаза Бога"
gene_V_owner_vanguard_desc:0"Обладатели Глаза Бога усвоили идею, что их сила — это не только привилегия, но и долг. Они стали авангардом общества, ведя за собой остальных."

gene_without_research_system:0"Отсутствие научной системы"
gene_without_research_system_desc:0"У нас нет зрелой научной системы, инновации рождаются случайно, что замедляет наши исследования."

gene_rotten_research_system:0"Прогнившая научная система"
gene_rotten_research_system_desc:0"Наша научная система слишком стара и прогнила — коррупция, плагиат и нелегальные исследования снижают эффективность использования ресурсов."

gene_politicalized_research:0"Чрезмерно политизированная наука"
gene_politicalized_research_desc:0"По разным причинам наше научное сообщество вынуждено принимать сомнительные теории за истину, что порождает лжеучёных и пустую трату ресурсов."

gene_booming_research:0"Бурное развитие науки"
gene_booming_research_desc:0"Инновации охватили все сферы нашего общества, от институтов до заводов. Это ускоряет исследования и прогресс."

gene_farsighted_research:0"Футуристическая сверхнаука"
gene_farsighted_research_desc:0"Благодаря долгосрочному планированию и далекоидущим стратегиям мы создали новую, эффективную научную систему, глубоко укоренённую в обществе. Из её ветвей мы построим корабль, который отвезёт нас в будущее."

gene_efficient_research:0"Эффективная научная система"
gene_efficient_research_desc:0"Сегодня исследования — это коллективный труд, и мы создали систему, обеспечивающую это сотрудничество."

gene_backward_edu_system:0"Отсталая система образования"
gene_backward_edu_system_desc:0"Хорошие образовательные системы похожи друг на друга, а плохие — каждая по-своему. Наша система устарела, и мы страдаем от нехватки учёных и квалифицированных рабочих."

gene_no_edu_system:0"Отсутствие образования"
gene_no_edu_system_desc:0"Отсутствие образования хуже отсталого. Наша ситуация близка к катастрофе, и без реформ мы не сможем нанять квалифицированный персонал."

gene_politicalized_education:0"Чрезмерно политизированное образование"
gene_politicalized_education_desc:0"Политизация образования неизбежна, но чрезмерная политизация вредна. Это проявляется по-разному: от навязывания теологии до искажения фактов."

gene_efficient_education:0"Передовое и эффективное образование"
gene_efficient_education_desc:0"Наши школы работают как заводы, производя кадры для всех сфер общества — от учёных до квалифицированных рабочих."

gene_equal_education:0"Передовое и равное образование"
gene_equal_education_desc:0""

gene_born_as_lord:0"Рождённые королями"
gene_born_as_lord_desc:0"Мы создали условия для появления сверхлюдей, и эти люди поведут нас в будущее."

gene_all_great:0"Каждый велик"
gene_all_great_desc:0"Естественным или искусственным путём мы достигли вершины человеческого развития. Каждый рождается с потенциалом гения, способного творить историю."

gene_realm_of_freedom:0"Царство свободы"
gene_realm_of_freedom_desc:0"В нашем обществе развитие человеческого потенциала стало самоцелью. Мы познали законы истории и общества, став хозяевами природы и общества, освободившись от слепых сил. Теперь мы творим свою историю."

