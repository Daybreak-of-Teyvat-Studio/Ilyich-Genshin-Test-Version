l_simp_chinese:
SNE_szx.1.t: "女皇敕令"
SNE_szx.1.d: "……在女皇陛下的宏伟蓝图中，「神之心」是不可或缺的部分……"
SNE_szx.1.a: "我们将攫取众神的权柄"

SNE_szx.2.t: "迪卢克的消息"
SNE_szx.2.d: "凯亚漫不经心的向琴转述迪卢克的警告，至冬的外交文书也同期而至，执行官「女士」将以“诗歌交流”的名义参加今年的风花节，法尔伽团长的远征尚未结束，我们需要警惕一切潜在的敌人，适当让步在政治上是必要的"
SNE_szx.2.a: "蒲公英随着晨间的风远行\n秋日的风带回收获的芬芳"

SNE_szx.3.t: "大厦将倾"
SNE_szx.3.d: "“「公子」已经乘船进入沉玉谷”\n比起夜兰送来的密报，凝光更担心的是今日北国银行对璃月市场进行了全面加息与贸易削减，只要今年的请仙典仪顺利完成，这些手段只不过小把戏。"
SNE_szx.3.a: "山雨欲来"

SNE_szx.4.t: "前线战报"
SNE_szx.4.d: "“……前线叛军出现大量可以使用元素力的战士，但他们的神之眼有些奇怪，抓到的俘虏也表现得异常亢奋……”\n这份战报虽然是送往天守阁，但鸣神大社和神里家也得到了同样的抄本，雷电将军收到的却是此战大捷"
SNE_szx.4.a: "鸣神的国土，浮世越百千年未曾变易"

SNE_szx.5.t: "噩梦"
SNE_szx.5.d: "博士，今天的你看起来很年轻啊。\n你知道的，这句话对我来说可不算什么奉承。\n那全盛时期的「切片」，此刻在哪呢？"
SNE_szx.5.a: "在一场……关于「亵渎」的实验之中"

SNE_szx.6.t: "逐影庭消息"
SNE_szx.6.d: "至冬的逐影庭探员在月度报告中汇报了能源与金属市场的大幅膨胀，一场或将席卷整个提瓦特的风暴正在北方酝酿，根据可靠的线人汇报至冬将会对各国开展全面的干涉活动，虽然我们隔海相望，但我们仍需要在台上与台下均保持体面的胜利，避免可能发生的全面开战。"
SNE_szx.6.a: "有趣，但也仅止于此了"

SNE_szx.7.t: "花羽会斥候报告"
SNE_szx.7.d: "大量愚人众由挪德卡莱方向进入了纳塔领土，我们尝试追踪他们，但他们似乎得到了纳塔本地势力帮助，避开了几乎所有的侦查哨点，请问需要继续跟踪吗？火神大人。"
SNE_szx.7.a: "你敢参与这场角逐吗？"

SNE_fw.1.t: "苍星同盟"
SNE_fw.1.d: "我们将拾起曾经的同盟旗帜，苍星之盟终究要向天理举起叛旗"
SNE_fw.1.a: "今夜，星光闪耀"

SNE_fw.2.t: "诸神黄昏"
SNE_fw.2.d: "槲寄生计划已经完成，现在我们要重新从天理手中夺回我们的爱"
SNE_fw.2.a: "今夜，星光闪耀"

SNE_fw.3.t: "自由与希望之歌"
SNE_fw.3.d: "若是风有朝一日重归酷烈，暴君妄图再度将凡人凌虐\n我等必不吝让血沾染明花，即便是要再度与神座反戈\n若是风如此刻般恒久温柔，若高天愿眷顾我等的国度\n我等必不吝永护蒙德的歌，如新风曾赐我等庇护之所"
SNE_fw.3.a: "假如你不再凯旋，我可不会为你哭泣\n我要像今天一样，再为你痛饮一杯"

SNE_fw.4.t: "千年的契约之港"
SNE_fw.4.d: "金鼓裂云催阵，旌旗卷地连山。\n浊浪破崖风满垒，铁弩张弓月作弦。\n戎车镇隘关。\n\n岂惧高天之威，但悲浮世苦楚。\n百险何辞共赴难，万里长驱靖九寰。\n千岩卫阙垣。"
SNE_fw.4.a: "水无定，花有尽，会相逢。\n可是人生常在，别离中。"

SNE_fw.5.t: "永恒与希望之梦"
SNE_fw.5.d: "刀枪剑戟八于队，铁马兵戈十万里。\n说是那泉台路遥，无常樱。\n且待那春风吹散，小夜岚\n\n诸君啊，如今黄泉归来，\n且看幻光浮世作何模样。\n那幽冥地府未审判，永劫光景无变移。\n\n呜呼，终非昔日之世。\n过去之心不可得，徒留我等\n英名进绘鉴，百鬼入画图。"
SNE_fw.5.a: "于此浮世中，不独入寝可成梦，事事皆虚空"

SNE_fw.6.t: "黄金与自然之智"
SNE_fw.6.d: "世间一切煊赫与完美，\n终将消散如指间的沙尘。\n\n莫要为虚妄的浮名探寻世间奥秘，\n谁能解开高天之主铸就的妙谛？\n\n将爱奉予众人吧，趁年岁尚允时。"
SNE_fw.6.a: "明光的智慧啊，愿你驱散愚昧与黑暗。"

SNE_fw.7.t: "正义与审判之舞"
SNE_fw.7.d: "仁慈、创始的权柄、向无形者的赋形\n调谐、完美的擢升、对不平衡的掌控\n复仇、剑下的报惩、旧日沉沦的迷梦\n剧场、瞻妄的幻想、无尽轮回与牺牲\n奥秘、死亡与新生、救世的孤独冰冷"
SNE_fw.7.a: "万无意志薄弱之缺陷者，\n既不降服于天使，也不屈服死神"

SNE_fw.8.t: "战争与牺牲之火"
SNE_fw.8.d: "你是否畏惧死亡？你是否勇气依旧？\n铭记英雄的名字，追随他们\n再一次，踏上战场\n为家人，为故乡，为国家，为荣光\n为理想，为愿望，为未来，为希望。"
SNE_fw.8.a: "我们付出了诸多牺牲，冲破了无数的迷茫"