DOT_nuke_ideas_01:0 "Траур по всей земле"
DOT_nuke_ideas_01_desc:0 "После взрыва город превратился в руины, тысячи погибли, больше людей бежали. Выжившие столкнулись с нехваткой еды, воды и медицины, их будущее потеряло смысл."

DOT_nuke_decisions:0 "Проект «Восточный ветер»"
DOT_nuke_decisions_desc:0 "Восточный ветер, быстрее коня. Оглянись назад — гора высоко. Восточный ветер, рушит горы. Битва в разгаре. Восточный ветер, остриё не притупилось. Если небо упадёт, он поддержит.\n\nДля удара «Восточным ветром» необходимы: §Yсостояние войны§!, ракетная база, ядерные боеголовки и ракеты.\n\nПри ядерном ударе армия теряет 75% боеспособности, здания разрушаются до 5-го уровня, население сокращается на 190 000, и регион получает модификатор «Выжженная земля». Стабильность и поддержка войны падают на 5%, страна получает национальный дух «Траур по всей земле».\n" 

