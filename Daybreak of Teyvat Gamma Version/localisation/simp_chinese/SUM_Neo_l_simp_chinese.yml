 SUM_Neo_SGS.107.d:"水驿与井归公，取水按人。多占的退回去。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
