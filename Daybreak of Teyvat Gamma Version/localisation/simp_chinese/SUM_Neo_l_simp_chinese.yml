 SUM_SDH_RB_Tent_Maker_desc:"帐幕作坊做的是行军帐与风袋，风天扎营快一刻钟，队伍就少折损一批。"
 SUM_Neo_SDH.115.t:"帐幕作坊"
 SUM_Neo_SDH.115.d:"帐幕作坊做的是行军帐与风袋，风天扎营快一刻钟，队伍就少折损一批。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
