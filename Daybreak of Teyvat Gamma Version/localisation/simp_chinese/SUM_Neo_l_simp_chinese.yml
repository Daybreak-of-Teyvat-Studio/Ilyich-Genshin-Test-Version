 SUM_Neo.301.b:"交由地方自理"
 SUM_Neo.302.t:"海关"
 SUM_Neo.302.d:"海关立起来，走私的船开始绕着走。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。高塔投下的影子越来越长，傍晚时就盖住了半条街。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。"
