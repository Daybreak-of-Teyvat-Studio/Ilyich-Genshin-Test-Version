 SUM_Neo_SGS_Combo_AH_View_desc:"稳定度 +15%、月度人口 +30000"
 SUM_Neo_SGS_Combo_BH_View:"旧章毋易"
 SUM_Neo_SGS_Combo_BH_View_desc:"政治点数获取 +20%、研究速度 +10%"

 #### 民族精神 ####
 SUM_SGS_I_Pari_Vigil:"花灵护境"
 SUM_SGS_I_Pari_Vigil_desc:"花灵守着沙丘腰带已不知几百年的光阴。她们看护的是新生与死亡的交界：孩子在沙里落地，老人归于黄沙，都有她们在旁守着。把生死两头，守得稳稳当当。"
 SUM_SGS_I_Suzerain_Edict:"诏达邮亭"
 SUM_SGS_I_Suzerain_Edict_desc:"雨林的敕令一卷卷送到沙丘的水驿上，纸上写的无非赋税如何征、商路如何管，条条都要沙丘照办。把别人的规矩硬往自家头上套，叫人不服。"
 SUM_SGS_I_Jinn_Scripture:"矫论团典册"
 SUM_SGS_I_Jinn_Scripture_desc:"矫论团守着经书，也守着商道与水驿。经义讲起来并不深奥，可真要照着去做却处处犯难。正好应了那句：说得容易，做时难。"
 SUM_SGS_I_Hall_of_Mystery:"圣显厅启户"
 SUM_SGS_I_Hall_of_Mystery_desc:"沙下埋着一座圣显厅，厅里藏着法度与图样。那些图样勾着人心，引着一批又一批人往沙里钻，有人为求学问，有人为寻宝贝。这座旧厅，成了沙海的谜。"
 SUM_SGS_I_Dune_Route:"丘间互市"
 SUM_SGS_I_Dune_Route_desc:"商道沿着沙丘的脊背蜿蜒而行，白日里日头毒，商队便歇着，一到夜里方才赶路。这昼伏夜行的法子，养活了半条商道，也养活了沿途多少人。"
 SUM_SGS_I_Scarce_Water:"水邮有程"
 SUM_SGS_I_Scarce_Water_desc:"水驿里的水一概由矫论团掌管，谁来取水都要在册上记一笔，取了多少、几时取的写得明白。在这沙海之中水比盐还金贵，有水便有命，谁也不敢糟蹋。"
 SUM_SGS_I_Sacred_Beasts:"沙海瘗骨"
 SUM_SGS_I_Sacred_Beasts_desc:"沙里偶尔掘出圣骸兽的遗骨，一截白骨埋在沙中。捡到的人多半不肯留，转手卖与行商换几袋摩拉，把前朝的旧物换成了活人的营生。"
 SUM_SGS_I_Merchant_Word:"采商贾言"
 SUM_SGS_I_Merchant_Word_desc:"在沙丘地界，官府办事都得先探那几位大商户的口风。他们把头一点，事情就顺顺当当办成；眉头一锁，这事八成就吹。这片沙丘的生意能做起来，靠的就是这几位一句话的分量。"
 SUM_SGS_I_Jinn_Alliance:"灵人连契"
 SUM_SGS_I_Jinn_Alliance_desc:"花灵与矫论团结成盟约，立下一条：凡人的事由凡人自己定，花灵只在旁看着，不再替人拿主意。这一盟一立，沙丘腰带的众人从此挺直了腰杆。有分教：凡人自立，花灵只在旁看着。"
 SUM_SGS_I_Independent_Flag:"灵光自树"
 SUM_SGS_I_Independent_Flag_desc:"灵光纹样的旗立在了各处水驿的旗杆上，风一吹猎猎作响，远远望去便知是沙丘的地界。这旗一端起来便是沙丘从此自己说了算，连远来的商队也认得这面旗。"
 SUM_SGS_I_Light_Commonwealth:"灵光立社"
 SUM_SGS_I_Light_Commonwealth_desc:"沙丘腰带的规矩简明：事由人定，花灵只在旁陪着；愿由人许，代价也由人自己担。各安其位，不越边界，把凡人与花灵的名分分得清清楚楚。"
 SUM_SGS_I_Pari_Teacher:"花灵为傅"
 SUM_SGS_I_Pari_Teacher_desc:"花灵教凡人本事只教三样：看星，看水，看沙。她们从不把答案直接说出，只教人怎么去看、怎么去问。学会了这三样，遇事便能自己去寻答案。"
 SUM_SGS_I_Light_Guard:"灵光为戍"
 SUM_SGS_I_Light_Guard_desc:"沙丘军团的旗上绣着一圈圈灵光纹样。这队伍古怪，别家怕风沙，他们偏在风沙天里站得最稳，风越大阵越整，把灵光旗守得纹丝不动。"
 SUM_SGS_I_Scholar_Republic:"诸生共政"
 SUM_SGS_I_Scholar_Republic_desc:"沙丘的城邦立下了宪章，执事不是上面派的，是众人公推的；律例不是一人定的，是大家共议的。把一城的事，交还了一城的人。"
 SUM_SGS_I_Open_Scripture:"经帙听披"
 SUM_SGS_I_Open_Scripture_desc:"商道旁的水驿里，常能见着这样的光景：识字的人捧着经卷高声念，一圈不识字的行商围着听，听完还要把那道理默记于心。这些经卷是矫论团抄写的，一处驿站送一份。就这么着，一部书传遍了各条商道。"
 SUM_SGS_I_Dune_Commune:"丘地入官"
 SUM_SGS_I_Dune_Commune_desc:"沙丘的水驿与井一概归了公，田地合在一处耕种，收成按各人出的工分。多劳多得，少劳少得，谁出多少力众人眼里都看着，偷懒不得，没人再有怨言。"
 SUM_SGS_I_Sand_Throne:"沙王复降"
 SUM_SGS_I_Sand_Throne_desc:"沙丘的规章，是接着赤王传下来的老规矩，件件都有出处，不是凭空编出来的。这么一说，名分也就正了，大伙儿都服气：咱们的章法，从古时候就有了。"
 SUM_SGS_I_Mech_Corps:"堂中陈械"
 SUM_SGS_I_Mech_Corps_desc:"圣显厅里挖出的构装修好之后竟能走能动，沙丘的人给它装上兵器，一列排开便成了一支队伍。把古人的旧物变成了今日的奇兵，连雨林那边听了也觉稀罕。"
 SUM_SGS_I_State_Rite:"列于大祀"
 SUM_SGS_I_State_Rite_desc:"灵光之礼如今升做了国祀，年年到了时候众人便聚在圣显厅外，点烛行礼，郑重其事。这一礼既立，沙丘便有了自家的祭祀，年年如此从不间断。"
 SUM_SGS_I_Old_Dune:"仍循旧章"
 SUM_SGS_I_Old_Dune_desc:"沙丘立规矩，旧例能留的都留了下来，只在外头多加一层公议的过场。凡事众人再商量一遍方才定夺，既不丢了老传统，又添了新规矩。"
 SUM_SGS_I_Foreign_Hand:"邻邦染指"
 SUM_SGS_I_Foreign_Hand_desc:"北国派来使团，说愿意出钱替沙丘修水驿，可附带的条件是要在商道上设一处自家驿站。黄鼠狼给鸡拜年，沙丘的人心里雪亮，当面敷衍，背后早有了主意。"

 #### 等级 / 共振 ####
 SUM_Neo_SGS_T1:"灵光垂灭"
 SUM_Neo_SGS_T1_desc:"一档灵光将熄。花灵闭口不言，问也不答，圣显厅外头空落落的，只有风卷着沙打门。看守的老者每日照旧去拂一遍石阶，拂完坐在阶上发怔，等到天黑才回。"
 SUM_Neo_SGS_T2:"灵光寥落"
 SUM_Neo_SGS_T2_desc:"二档灵光零星。几处水驿还留着灯，灯下备着水与草料，过往的人却少。偶尔有个把旅人推门进来，问一句：「花灵还应不应？」掌柜的只摆手。夜里的灯，多半是白点的。"
 SUM_Neo_SGS_T3:"灵光侵盛"
 SUM_Neo_SGS_T3_desc:"三档上灵光渐明。花灵开口了，说话慢，一句一句地教人认路、认草、认水。它只与人同行，不替人走，脚步还得自己迈。听的人起初将信将疑，走过两回便不吭声了。"
 SUM_Neo_SGS_T4:"灵光共矢"
 SUM_Neo_SGS_T4_desc:"四档灵光同契。人跟花灵立了约，白纸黑字写得明白：人出力，灵出光，谁也不能赖。遇事一同商议，出了差池各担其责。立约当日，圣显厅外站满了人。"
 SUM_Neo_SGS_T5:"灵光并耀"
 SUM_Neo_SGS_T5_desc:"五档灵光共明。沙丘腰带的规矩不再刻在石上，改由人与花灵一处商议，愿许了才算数。谁不肯许也没人硬逼，只是众人的路他走不进去。灵光遍照，人心也就齐了。"
 SUM_Neo_SGS_U1:"重门深扃"
 SUM_Neo_SGS_U1_desc:"一档厅门深锁。圣显厅里的法度与图样堆在架上落灰，没人读得懂；几件构装散在廊下，缺胳膊少腿也没人会修。钥匙挂在老看守腰上，他每日去锁前站一站，只锁不启。"
 SUM_Neo_SGS_U2:"零简偶读"
 SUM_Neo_SGS_U2_desc:"二档零星释读。有几个老书生认得古文字，凑在一处逐字地抠，抠出来的多是陈年旧规。念给旁人听，听的人直打哈欠。可就是这几个人，日后成了沙丘的宝贝。"
 SUM_Neo_SGS_U3:"半扉虚掩"
 SUM_Neo_SGS_U3_desc:"三档一到厅门半开。三块石板拼到一处，纹路对上了，旧法便能读通大半。读书的人点着灯熬了几夜，读到要紧处拍案叫好，又不敢大声。看守的钥匙也松了手。"
 SUM_Neo_SGS_U4:"旧章就帙"
 SUM_Neo_SGS_U4_desc:"四档旧法成册。圣显厅里的条文一条条抄下来订成一册放在案头，遇着争水、争地、争牲口，翻开一查竟与今日的事对得上。老书生们道：「祖宗的法子，没过时。」"
 SUM_Neo_SGS_U5:"重门大启"
 SUM_Neo_SGS_U5_desc:"五档厅门全开。圣显厅的构装尽数修好，站在廊下听人使唤，法度也一条条用在今日的沙丘上。修构装的匠人、读旧法的书生都在厅里有了一席。这厅门一开，沙丘的底气便不同了。"
 SUM_Neo_SGS_Combo_HH:"灵法双耀"
 SUM_Neo_SGS_Combo_HH_desc:"灵光与人同行，旧法为今用。沙丘腰带这一回两样都齐了：人肯出力，灵肯照路，厅里的旧法抄成册压在案头。有了共识也有了法度，遇事先讲，讲不通再翻册子。"
 SUM_Neo_SGS_Combo_LL:"幽厅深扃"
 SUM_Neo_SGS_Combo_LL_desc:"花灵闭口，旧法不读。沙丘腰带又退回各城自守的老路，城与城之间不通报，井水各吃各的。厅门重新上了锁，钥匙压在箱底。有人问起从前那点灵光，年长的只摆手道：「莫提了。」"
 SUM_Neo_SGS_Combo_AH:"灵光灼然"
 SUM_Neo_SGS_Combo_AH_desc:"这一档灵光压过了旧法。遇事不再翻册子，先问花灵，问明白了众人点头便算定规。旧法还挂在厅里落着灰，没人去动。老书生心里不痛快，可也说不出什么来。"
 SUM_Neo_SGS_Combo_BH:"旧章毋易"
 SUM_Neo_SGS_Combo_BH_desc:"圣显厅的旧法压过灵光。沙丘的事一桩桩照旧典的条目来办，翻到第几条便办第几条，谁也不许多嘴。花灵的光还亮着，只是没人去问。法度太密，人心便疏。"

 #### 新闻 ####
 SUM_Neo_SGS_News.1.t:"诏抵水邮"
 SUM_Neo_SGS_News.1.d:"「占住一处地方，比说一百句话都响。」沙丘的旗，头一回插上雨林第一道哨所。那旗是粗布缝的，绣着灵光纹样，旗杆拿驼毛绳一道道绑在垛口上。插旗的正是头一个攀上墙的后生，他爬上去把旗一抖，风便把它撑直。站墙头往东看，先是河渠，清水一道道蜿蜒；再远是平原，田畴连片；最远是须弥城，尖塔在雾里只露个顶。教令院得了信，连夜遣使赶来，使者衣冠齐整，随从捧着两只匣子，说是些薄礼。阵前的人不收匣子，只回一句：先撤哨，再谈别的。使者张了张口，没再说下去。旗插好，众人退下墙头，把哨所里的灶重新点着，煮了一锅糊糊，先给守过这墙的伤兵盛。"
 SUM_Neo_SGS_News.1.a:"阅"
 SUM_Neo_SGS_News.2.t:"阶前烛烂"
 SUM_Neo_SGS_News.2.d:"「一卷文书最怕的，不是被撕了，是被原封不动退回来。」教令院敕令送到水驿那天，日头正毒。信使一路风尘，衣摆全是沙，捧着卷轴在驿门口报了名号。矫论团的人出来接了，也不请他进去坐，就站在檐下展开卷轴。那敕令写得客气，字极工整，一行行无非叫沙丘安分守己、莫生事端，末尾还许了几样好处，说是体恤边民。看的人从头看到尾，又倒回去瞄一眼落款，随即把卷轴卷起，原样递回信使手里，说了声有劳。信使站着不走，说上头还有一句口信。接的人道，口信就不必了，纸上写的我们都看见了。檐下风把纸角吹得直响。信使把卷轴抱紧，退了两步，才转身下阶。"
 SUM_Neo_SGS_News.2.a:"阅"
 SUM_Neo_SGS_News.3.t:"沙底隐堂"
 SUM_Neo_SGS_News.3.d:"沙里埋了不知多少年的东西一旦重见天日，人心里那段早忘的旧事，也跟着被翻了出来。圣显厅的门让黄沙封了许久，沙丘腰带贴榜招人来清。应募的不要工钱，自带筐和铁锹，天色未明就干开了。沙子是会跑的，白日掘开，入夜风一刮又平回去半截，大伙儿便想了个法子，两侧拿草席扎起挡墙，一层一层朝里挖。挖到第三天，锹尖当地碰到硬物，刨开竟是一溜石阶。台阶一级级向下，每级高过人头顶，阶面上刻着密密纹路，风沙磨得只剩浅浅一道痕。有人伸手去摸那纹路，许久不语，末了把手在衣摆上擦了又擦。管事让人在阶上静坐半日，谁也不提动工。有人主张冲洗干净，管事直摆头，说沙得留着，好让后来人明白这地方是怎么挖出来的。"
 SUM_Neo_SGS_News.3.a:"阅"
 SUM_Neo_SGS_News.4.t:"商涂易向"
 SUM_Neo_SGS_News.4.d:"收钱的那几个坐了三天，脸晒得乌黑，最后自己都笑了，说这卡立在这儿，是给沙子看的。商道边新设了道税卡，卡在窄路口，横一根木杆，杆后头俩人见驮队就伸手要钱。头日还有些进账，次日就稀了，到第三天连个影子都等不着。原来驮队另有老路，绕过一道沙梁，多走半日脚程，钱却分文不花；也有那犟的偏走新卡，交完钱一算账，比绕路还亏，下一趟便乖乖改道。有个老驮夫蹲井边啃饼，说这卡来得蹊跷，像不是收钱，是盯人的。旁人追问盯什么人，他也不答，抖抖缰绳牵着骆驼走了。后来新卡一撤，木杆扔在沙里，被娃娃们抬去当了马骑。路是人一步步走出来的，卡也是人想法子绕过去的，那条新道上，从此只留两道空车辙。"
 SUM_Neo_SGS_News.4.a:"阅"
 SUM_Neo_SGS_News.5.t:"归其诏版"
 SUM_Neo_SGS_News.5.d:"「他们没收。」回到东边，信使只吐出这四个字。他怀里那卷敕令，还是出门时那副封得好好的模样，没一个人肯接。打从水驿门口被当众退回来，他就那么抱着卷轴站着，从日头当顶站到日头偏西，影子在脚底下越拖越长。驿里人打他身边来来往往，没谁多看一眼；守驿的老卒扫地扫到他脚前，也只顿了顿，绕开走。后来一个挑水的后生看不下去，端了碗水搁他脚边，他看了看，终究没喝。天擦黑，驿门口的灯一盏盏亮起来，他才转过身，一步一步往东挪，走几步便回头，也不知是看灯，还是看那不肯收他的地方。夜里风大，他把卷轴紧紧揣在怀里，怕沙糊了封泥。是啊，捧着一卷没人接的文书，那滋味，比挨一顿打还难受。"
 SUM_Neo_SGS_News.5.a:"阅"
 SUM_Neo_SGS_News.6.t:"新帜及杪"
 SUM_Neo_SGS_News.6.d:"「来不来不要紧，一片羽毛就是回话了。」升旗那天，到水驿的人比平日多。新缝的旗用白线在赭色布上绣出灵光纹样，绳一拽，旗升到杆顶，让风撑开，纹样便看得清清楚楚。众人抬眼往台上瞅，都在等花灵露面。等了好一阵，台上空空如也，底下开始窃窃私语。正纳闷，一只风鸟自沙丘那头飞来，绕旗杆转了两圈，抖落一片极淡的青白羽毛，轻飘飘落在杆脚的沙上。有个老者弯腰拾起，托在掌心给众人看。一个年轻人问，是不是花灵恼了。老者摇头，说它把想说的话都搁这片羽毛里了。众人于是不再出声，纷纷摘下帽子。那片羽毛后来装进一只木匣，供在驿中案头；旗在杆上哗啦响了一夜。"
 SUM_Neo_SGS_News.6.a:"阅"
 SUM_Neo_SGS_News.7.t:"丘上屯锐"
 SUM_Neo_SGS_News.7.d:"「各自散着只顾自家，聚到一处才成其为军。」沙丘腰带把三路人合成一支。这三路人马根底各不相同：护商道的终年随驮队跋涉，哪个沙窝有水都记得清；守泉的祖祖辈辈侍弄一口井，井里井外的事比家里还熟；乡兵们农闲时才操练、农忙就下地，手里刀枪都是自家打的。三路人会齐，先在校场比了一场：护路的脚下生风，守泉的耐力绵长，乡兵出手最辣，谁看谁都不服气。管事的不去劝解，只把花名册往长案上一摊，一行行填将下去。轮到旗号这一栏，众人争了半日，最后敲定用灵光纹样，雇人绣到旗面上。名册誊了两份，一份存水驿、一份随军走，执笔的书吏写到夜半，灯油添了三回。一个守泉老兵摸着旗角叹道，守了大半辈子一口井，眼下守的是一条长线了。"
 SUM_Neo_SGS_News.7.a:"阅"
 SUM_Neo_SGS_News.8.t:"花灵发语"
 SUM_Neo_SGS_News.8.d:"「它叫咱们自家拿主意，这比句句叮嘱更难接。」花灵开口的这一日，四下里没鼓乐、没排场。它立在驿外沙丘上，身形薄得像层雾气，众人不敢凑近，只在远远的地方围了个半圈。好一会儿，它才吐出话来，声音不大，被风一吹就散，可连最外圈的人都听得清清楚楚：你们的事，你们自己定。说完便闭上口，再不言语。围着的人互相看着，没有一个肯先出声。冷不丁一个后生跪倒磕头，站起来时两眼通红。旁边老者伸手去扶，自己的手却抖个不停。有个妇人斗胆问，先前听来的那些训话，如今还算不算数。花灵不答，风把它的身影吹得更淡。众人四散时脚步都轻悄悄的，这天水驿的钟，从早到晚没谁去撞一下。往后议事，那把主位一直空着，没人去坐。"
 SUM_Neo_SGS_News.8.a:"阅"
 SUM_Neo_SGS_News.9.t:"候所易主"
 SUM_Neo_SGS_News.9.d:"「换旗不拆墙，好教后来的人有个念想。」雨林插进沙丘的第一座哨所，这天算交了手。两边谁也没动刀，在墙根底下各站一溜，报过名号就算完事。原先驻守的兵打点好包裹，从东门离去，走出老远还回头望了几眼。沙丘的人自南门而入，头一件事是爬上房顶换旗。旗是换掉了，墙体一砖没动，只把上面的旧纹样拿泥抹平。一个老兵伸手抚过墙上的箭孔，说这些坑是去年那一仗留下的。身边年轻人问，填不填平。老兵摇头，说留着好，让人瞧瞧这墙经历过什么。墙脚有口井，井圈砌得簇新，雨林人撤走时没顾上填，沙丘人打上水，先舀一碗递给留下的守兵。墙头挂灯的铁钩还钉在原处，没人去拆。"
 SUM_Neo_SGS_News.9.a:"阅"
 SUM_Neo_SGS_News.10.t:"丘上东瞻"
 SUM_Neo_SGS_News.10.d:"队伍长得没边，走了大半天才过完，扬起来的黄沙把日头都遮得暗了一层。出水驿那天刚蒙蒙亮，商道上露水还没干，人马便一队队朝东开拔，驼铃叮当响成一片：打头的是护路的，断后的是运水车。驿门口站满送行的人，有老妇挎着篮子，把煮鸡蛋一个劲往兵士手里塞；有娃娃追着队伍跑了好一段，被大人一把拽回。有个兵扭过头喊，等我回来，给你捎须弥城的糖吃。他娘在门边低低应了声，脑袋却始终没抬。队里跟着个文书，边走边同旁边人唠，说沿这条商道走满十天，就能望见须弥城的尖塔。那人问他怕不怕走这么远。文书想了想，老实说怕，可路还得往前走。两边沙丘上站着几个牧人，久久望着，直到队伍的影子全没了。"
 SUM_Neo_SGS_News.10.a:"阅"

