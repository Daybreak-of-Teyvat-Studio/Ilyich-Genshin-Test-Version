 New_Era:"新时代"
 New_Era_desc:"璃月内战终以？？之胜落幕。昔蒙德坠神之事，竟重演于璃月，所异者，璃月无备新神以代旧神。万国闻璃月脱神治，皆惊。然无论何如，神明之统，似已于璃月落幕。黄金屋炉火未熄，惟铸币之榜换新人名。各国使节驻于南码头，日以电报报其国，皆云事不可测。"
