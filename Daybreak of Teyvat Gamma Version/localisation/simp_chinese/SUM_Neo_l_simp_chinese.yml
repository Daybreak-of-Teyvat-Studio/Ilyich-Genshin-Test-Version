 SUM_Neo_SGS.87.d:"檄文一传，矫论团与各族的青壮自带口粮来投。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。"
