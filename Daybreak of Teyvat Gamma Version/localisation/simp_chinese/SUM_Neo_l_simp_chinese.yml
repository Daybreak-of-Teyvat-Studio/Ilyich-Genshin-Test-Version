 SUM_SDH_Dec_Crisis_Plague_desc:"封锁疫处并施药救治。"
 SUM_SDH_Dec_Crisis_Riot:"弹压骚动"
 SUM_SDH_Dec_Crisis_Riot_desc:"用治安队平息骚动。"
 SUM_Neo_SDH_Mechanism:"机制状态"
 SUM_Neo_SDH_Mechanism_desc:"机制状态只读面板。按花神与风暴两条轴的数值，显示哈德拉玛维特当前的等级以及该档生效的国家修正。条目不可点击，仅供随时查看机制进度，方便你判断下一步该往哪条轴上使劲。面板会随轴值变化即时刷新，无需手动操作。"
