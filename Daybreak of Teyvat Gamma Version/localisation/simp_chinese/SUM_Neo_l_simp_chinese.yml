 SUM_Neo_SDH.116.d:"单设军费库，动用要三个人同时开口。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
