DOT_ControlProvince.1.t:0"Собор Запада пал!"
DOT_ControlProvince.1.d.generic:0"Собор Запада, возвышающийся над Мондштадтом, захвачен войсками [FROM.GetAdjective]. Во время битвы множество жителей укрылось в соборе, и потери были велики.\n\nВпервые за тысячу лет, со времён войны с аристократией, собор оказался в руках не Церкви и не Ордена."
DOT_ControlProvince.1.d.LAWversion:0"Собор Запада, возвышающийся над Мондштадтом, захвачен войсками [FROM.GetAdjective]. Войска [FROM.FROM.GetAdjective] отчаянно сопротивлялись, но были вынуждены отступить.\n\nНочью собор загорелся, и очевидцы видели поезд с сокровищами, уходящий на юг."
DOT_ControlProvince.1.a:0"Ветер свободы не перестанет дуть..."
DOT_ControlProvince.1.b:0"Святыня Мондштадта наша!"
DOT_ControlProvince.1.c:0"Свергнуть статую!"
DOT_ControlProvince.1.e:0"Нас опередили..."
DOT_ControlProvince.1.f:0"Тёмные времена настали для Мондштадта..."
DOT_ControlProvince.1.g:0"В Мондштадте всё всегда так плохо."

#蒙德城门
DOT_ControlProvince.2.t:0"Ворота Мондштадта пали!"
DOT_ControlProvince.2.d.generic:0"После долгой и жестокой битвы у стен Мондштадта, ворота города захвачены войсками [FROM.GetAdjective]. Войска [FROM.FROM.GetAdjective] отчаянно сопротивлялись, но были отброшены.\n\nПоловина жителей Мондштадта охвачена паникой, пытаясь уйти от линии фронта, другая половина пытается присоединиться к сопротивлению."
DOT_ControlProvince.2.d.LAWversion:0"После долгой и жестокой битвы у стен Мондштадта, ворота города захвачены войсками [FROM.GetAdjective]. Войска [FROM.FROM.GetAdjective] отчаянно сопротивлялись, но были отброшены.\n\nТеперь на мосту у ворот пятна крови [FROM.FROM.GetAdjective], голуби исчезли, их сменили вороны."
DOT_ControlProvince.2.a:0"Сопротивление только начинается!"
DOT_ControlProvince.2.b:0"Продолжить наступление!"
DOT_ControlProvince.2.c:0"Наконец-то!"
DOT_ControlProvince.2.e:0"В городе остались наши близкие..."
DOT_ControlProvince.2.f:0"В Мондштадте всё всегда так плохо."

