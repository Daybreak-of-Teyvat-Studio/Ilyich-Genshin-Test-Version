DRA_dragonspine_affairs:0"Дела хребта"
DRA_dragonspine_affairs_desc:0"Административная система хребта эффективна. Мы можем вкладывать ресурсы в развитие."
DRA_upgrade_Sucrose_ideas:0"Реформа помощи"
DRA_upgrade_Sucrose_ideas_desc:0"Временное решение для обновления идей."
DRA_upgrade_Albedo_ideas:0"Повышение боевого духа"
DRA_upgrade_Albedo_ideas_desc:0"Временное решение."
DRA_upgrade_Lisa_ideas:0"Развитие"
DRA_upgrade_Lisa_ideas_desc:0"Временное решение."
DRA_more_medical_help:0"Продолжение помощи"
DRA_more_medical_help_desc:0"Мы отправим больше медиков. При достижении 20 уровня помощи, дух «Мир» сменится на «Сияющую звезду мира»."
DRA_medical_level:0"Уровень помощи"
DRA_plant_special_wheat:0"Расширение посевов"
DRA_plant_special_wheat_desc:0"Распространение морозостойкой пшеницы.\n§RМожно выбрать только один план.§!"
DRA_construct_planning:0"Жилищная программа"
DRA_construct_planning_desc:0"Улучшение жилищных условий.\n§RМожно выбрать только один план.§!"
DRA_saving_plan:0"Мобилизация спасателей"
DRA_saving_plan_desc:0"Поиск пропавших.\n§RМожно выбрать только один план.§!"
DRA_our_preparation:0"Результаты"
DRA_our_preparation_desc:0"Мы увидим результаты наших действий."

