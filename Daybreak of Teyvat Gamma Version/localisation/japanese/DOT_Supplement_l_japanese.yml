 SWI_army_limitations_TT:0 "§R市民軍以外の正規軍の訓練や、軍事的用意に関連するディシジョン以外で既存の編制に変更を加えることはできない。§!\n\n§Yスイス§!は武器を手に取る必要に迫られた時、自国の一般市民を頼ることになる。訓練できる民兵の数は限られており、初期においては§Y統制率§!にも上限が設けられる。\n\n国家方針「§Y$SWI_armed_neutrality$§!」を完了したあかつきには、市民軍の拡張や強化ができるようになり、最終的にディシジョン「§Y$SWI_activate_militia$§!」を通じて配備することも可能になる。市民軍を配備中は、時間の経過と共にスイスの経済ペナルティが累積されて行くが、軍を引き上げればリセットされる。"
 SWI_banned_foreign_nazi_propaganda_idea:0 "ナチ外国支部によるプロパガンダの禁止"
