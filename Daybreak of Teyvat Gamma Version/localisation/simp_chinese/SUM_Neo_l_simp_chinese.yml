 SUM_Neo.44.b:"先看住封印"
 SUM_Neo.45.t:"梦剧场"
 SUM_Neo.45.d:"妮露在剧场里演花神，观众里有学者，也有剃了发的沙民。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。高塔投下的影子越来越长，傍晚时就盖住了半条街。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。"
