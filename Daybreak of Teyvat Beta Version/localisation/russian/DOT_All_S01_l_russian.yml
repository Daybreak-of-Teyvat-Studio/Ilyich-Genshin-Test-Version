##龙脊雪山第一幕丽莎线（DRA_focus_13）国策
DRA_Goal_of_Lisa:0"План развития Лизы"
DRA_Goal_of_Lisa_desc:0"Госпожа Лиза объявила, что Драконий хребет будет сохранять нейтралитет в гражданской войне, защищая жителей и беженцев. Это наш генеральный курс, и теперь мы детализируем план."
DRA_Peaceful_Land:0"Оазис мира"
DRA_Peaceful_Land_desc:0"В условиях войны наше богатое и мирное место — мечта многих. С помощью пропаганды мы привлечём беженцев. Они получат жильё и еду в обмен на труд."
DRA_Happy_Land:0"Последний рай"
DRA_Happy_Land_desc:0"В условиях войны наше богатое и мирное место — мечта многих. Мы улучшим управление городом, чтобы справиться с наплывом беженцев."
DRA_Committee_More_Powerful:0"Разум объединяет нас"
DRA_Committee_More_Powerful_desc:0"В кризис мы должны быть едины. Мы расширим полномочия Комитета по этике, чтобы он лучше помогал правительству."
DRA_Light_of_Knowledge:0"Свет знаний освещает путь"
DRA_Light_of_Knowledge_desc:0"Процветание Драконьего хребта основано на передовых технологиях, которые мы будем поддерживать даже в военное время."
DRA_First_One_Year_Plan:0"Первый годовой план"
DRA_First_One_Year_Plan_desc:0"Для решения проблем и поддержания уровня жизни мы разработали план на ближайший год под руководством Лизы."
DRA_Accelerate_Redistribution:0"Ускорение перераспределения"
DRA_Accelerate_Redistribution_desc:0"В ходе развития мы заметили рост неравенства. Это вредно для экономики и несправедливо. Пора принять меры."
DRA_Construction_in_Camp:0"Планирование Лагерного города"
DRA_Construction_in_Camp_desc:0"Лагерный город — столица Драконьего хребта. Мы инвестируем в его промышленность."
DRA_Construction_in_XueZang:0"Инвестиции в Погребённый город"
DRA_Construction_in_XueZang_desc:0"Погребённый город, выросший на торговле с Ли Юэ, теперь может развиваться. Мы инвестируем в его заводы."
DRA_Construction_in_Ports:0"Расширение торговли в порту Шеллинга"
DRA_Construction_in_Ports_desc:0"Порт Шеллинга, ставший незамерзающим благодаря технологиям Фонтейна, получит инвестиции для развития."
DRA_More_Powerful_Economy:0"Стимулирование экономики"
DRA_More_Powerful_Economy_desc:0"Наши экономические успехи привели к росту доходов, но люди боятся войны и копят деньги. Мы должны повысить их уверенность, чтобы стимулировать потребление."
DRA_Happy_and_Fair_Land:0"Мирная и процветающая земля"
DRA_Happy_and_Fair_Land_desc:0"Успешное развитие укрепило репутацию Драконьего хребта как мирного и процветающего места. Мы привлечём больше беженцев."
DRA_Train_Their_Agri_Skill:0"Обучение беженцев агротехнике"
DRA_Train_Their_Agri_Skill_desc:0"Проблему продовольствия можно решить, обучив беженцев сельскому хозяйству."
DRA_Develop_Agri_Scale:0"Стимулирование сельского хозяйства"
DRA_Develop_Agri_Scale_desc:0"Проблему продовольствия можно решить субсидиями."
DRA_Land_of_Full:0"Сытый рай"
DRA_Land_of_Full_desc:0"Благодаря нашим усилиям, продовольственное положение в Драконьем хребте нормализовалось. Теперь мы можем принять больше беженцев."
DRA_Oil_of_Industry:0"Смазка для промышленности"
DRA_Oil_of_Industry_desc:0"Наша промышленность заработает быстрее, если мы обучим беженцев."
DRA_Encourage_with_Bonus:0"Материальное стимулирование"
DRA_Encourage_with_Bonus_desc:0"Мы введём поощрения, чтобы повысить производительность труда."
DRA_Land_of_Happiness:0"Счастливый край"
DRA_Land_of_Happiness_desc:0"Заводы снова работают, товары текут по Мондштадту. Даже критики должны признать наш успех."
DRA_Second_One_Year_Plan:0"Второй годовой план"
DRA_Second_One_Year_Plan_desc:0"Первый годовой план перевыполнен. Мы начинаем второй. Те, кто называл нас трусами, будут поражены нашим прогрессом."
DRA_To_The_Side:0"За стены"
DRA_To_The_Side_desc:0"Наши города переполнены. Мы расширим их, чтобы вместить новые функции."
DRA_Plan_of_New_City:0"Новый город"
DRA_Plan_of_New_City_desc:0"Экономический успех позволяет нам улучшить инфраструктуру и санитарию."
DRA_Get_Upper_Level:0"Захват верхних звеньев цепочки"
DRA_Get_Upper_Level_desc:0"Наши технологические преимущества позволяют нам захватить верхние звенья цепочки, что принесёт большую выгоду."
DRA_Eat_Golden:0"Поедание золотого гуся"
DRA_Eat_Golden_desc:0"Наши технологические преимущества — это золотой гусь. Но ради краткосрочной выгоды мы обменяем их на другие блага."
DRA_More_Infra_Better_Us:0"Инфраструктурный бум"
DRA_More_Infra_Better_Us_desc:0"Наша инфраструктура — это фундамент экономики. Пора построить на нём здание."
DRA_Scientist_Wonderland:0"Власть знаний"
DRA_Scientist_Wonderland_desc:0"Технологии и образование — основа нашего благополучия. Мы усилим эти преимущества."
DRA_Forts_of_Lisa:0"Стена Лизы"
DRA_Forts_of_Lisa_desc:0"Нам нужна стена, линия обороны, чтобы защитить нашу мирную жизнь. Эта стена будет названа в честь Лизы."
DRA_New_Soildiers_Know_Peace:0"Армия мира"
DRA_New_Soildiers_Know_Peace_desc:0"Беженцы, познавшие ужасы войны, станут хорошими солдатами, если их обучить."
DRA_Encourage_Our_Army_Lisa:0"Повышение боевого духа"
DRA_Encourage_Our_Army_Lisa_desc:0"Мы восстановим боевой дух армии."
DRA_Produce_More_Weapons:0"Ковка мира"
DRA_Produce_More_Weapons_desc:0"Отрицающие мир — бессовестны, отрицающие вооружение — глупы. Нам нужна военная промышленность."
DRA_Hunger_of_Army:0"Удовлетворение военных потребностей"
DRA_Hunger_of_Army_desc:0"Рост оборонных потребностей требует развития военной промышленности."
DRA_Up_our_Confidence:0"Повышение уверенности"
DRA_Up_our_Confidence_desc:0"Долгий мир сделал народ боязливым. Нам нужно убедить их в нашей силе."
DRA_Compl_Second_Plan:0"Завершение второго плана"
DRA_Compl_Second_Plan_desc:0"Второй годовой план завершён. Наша жизнь улучшилась благодаря Лизе. Пора двигаться дальше."
DRA_Look_Down_to_See_Mond:0"Взгляд свысока"
DRA_Look_Down_to_See_Mond_desc:0"Несколько лет назад мы были слабы, теперь нас нельзя игнорировать. Пора менять внешнюю политику."
DRA_Foget_It_Now:0"Забыть о декларации"
DRA_Foget_It_Now_desc:0"Сила Драконьего хребта выводит нас в центр событий. Мы выйдем за пределы хребта."
DRA_For_Reunion_of_Mond:0"За воссоединение Мондштадта"
DRA_For_Reunion_of_Mond_desc:0"Вставайте, дети Мондштадта! Славный день настал! Мы жаждем свободы и готовы сражаться!"
DRA_Fight_for_ours:0"За благополучие народа"
DRA_Fight_for_ours_desc:0"Видите ли вы солдат тирана, убивающих народ? Они отнимают у вас жён и детей! Вперёд, вперёд, все как один! Кровью врагов оросим поля!"
DRA_Peace_the_MOND:0"Умиротворение"
DRA_Peace_the_MOND_desc:0"Гражданская война всё ещё продолжается. Мы не можем ждать нового героя. Только народ Мондштадта может спасти себя. Мондштадтцы, вставайте на защиту мира и свободы!"
DRA_Liberation_Came_Back_Again:0"Свобода вернулась в Мондштадт!"
DRA_Liberation_Came_Back_Again_desc:0"Под руководством Лизы, при поддержке народа, рыцари Белого Мела вернули мир и свободу Мондштадту! Весть о победе разнеслась по всей стране, и наши подвиги станут легендой."
DRA_Lisa_To_our_Future:0"В будущее"
DRA_Lisa_To_our_Future_desc:0"Мы преодолели трудности, мы вооружились, мы будем совершенствоваться и достигнем звёзд."
##龙脊雪山第一幕砂糖线（DRA_focus_12）国策
DRA_Sell_Points:0"Продажа технологий"
DRA_Cooperate_with_Springvale_and_Wolfendom:0"Сотрудничество"
DRA_Cooperate_with_Springvale_and_Wolfendom_desc:0"В охваченном войной Мондштадте есть два нейтральных региона — Вольфендом и Спрингвейл. Заключив с ними союз, мы сможем защитить друг друга."
DRA_Trial_of_Sucrose:0"Испытание Сахарозы"
DRA_Trial_of_Sucrose_desc:0"Сахароза — пока неопытный лидер, но она обладает желанием учиться и служить народу. Она начинает работать под руководством Альбедо."
DRA_For_Peoples_Bread:0"За хлеб народа"
DRA_For_Peoples_Bread_desc:0"Продовольственный кризис угрожает стабильности. Сначала мы должны решить эту проблему. Правительство, допускающее голод, не заслуживает доверия."
DRA_Radical_Agricultural_Innovation:0"Радикальные инновации"
DRA_Radical_Agricultural_Innovation_desc:0"Морозостойкие культуры Сахарозы помогут решить проблему голода. Мы рискнём внедрить их, несмотря на возможные риски."
DRA_Sucrose_Nutrition_Liquid:0"Питательный гель Сахарозы"
DRA_Sucrose_Nutrition_Liquid_desc:0"Мы сосредоточимся на производстве питательного геля из соломы и травы. Он дешёв, прост в изготовлении и вкусен. Но он выглядит отвратительно, и нам придётся убедить народ его принять."
DRA_Buy_Food:0"Закупка продовольствия"
DRA_Buy_Food_desc:0"Мы закупим продовольствие в Ли Юэ и одновременно развиваем сельское хозяйство. Сахароза будет вести переговоры с купцами из Ли Юэ."
DRA_Relief_Agencies:0"Создание служб помощи"
DRA_Relief_Agencies_desc:0"Недостаточно просто снизить цены. Нужно помочь тем, кто потерял работу и средства к существованию. Мы создадим службы помощи, где они смогут получить работу или еду."
DRA_Chicken_Came_Back:0"Курица вернулась"
DRA_Chicken_Came_Back_desc:0"Продовольственный кризис решён. Сахароза доказала свою компетентность, а правительство показало свою способность управлять."
DRA_Sucrose_Prop:0"Сахароза в рекламе"
DRA_Sucrose_Prop_desc:0"Чтобы народ принял новые продукты, мы привлечём популярную Сахарозу для их рекламы."
DRA_Sucrose_Good:0"Сахароза в сиянии"
DRA_Sucrose_Good_desc:0"После решения кризиса, Сахароза получит заслуженный отдых, чтобы восстановить силы."
DRA_Sucrose_Strong:0"Здоровая Сахароза"
DRA_Sucrose_Strong_desc:0"Нагрузка сказалась на здоровье Сахарозы. Мы наймём ей тренера, чтобы укрепить её тело."
DRA_Sucrose_Forts:0"Линия Сахарозы"
DRA_Sucrose_Forts_desc:0"Мы построим укрепления на границе, чтобы защититься от вторжения."
DRA_Support_Our_Compatriots:0"Улучшение механизмов помощи"
DRA_Support_Our_Compatriots_desc:0"Наша медицинская помощь по всему Мондштадту принесла нам хорошую репутацию. Но мы должны улучшить её эффективность, чтобы спасать больше людей."
DRA_Better_our_Performance:0"Улучшение имиджа"
DRA_Better_our_Performance_desc:0"Наш нейтралитет зависит от нашего имиджа и обороноспособности. Улучшим имидж, чтобы другие охотнее принимали нашу помощь."
DRA_Expand_our_Influences:0"Расширение влияния"
DRA_Expand_our_Influences_desc:0"Мы должны не только лечить раненых, но и бороться с причинами войны. Используя наших волонтёров, мы будем распространять антивоенные настроения, которые со временем станут неудержимыми."
DRA_More_Support:0"Увеличение помощи"
DRA_More_Support_desc:0"После реформы мы отправим больше медицинских работников в Мондштадт."
DRA_Allow_Speical_Action:0"Разрешение на особые действия"
DRA_Allow_Speical_Action_desc:0"Может ли малое зло быть оправдано для великой цели? Сахароза приняла решение."
DRA_Urgent_Defense:0"Экстренная оборона"
DRA_Urgent_Defense_desc:0"Альбедо оставил план экстренной мобилизации на случай войны."
DRA_For_Peoples_Live:0"За жизнь народа"
DRA_For_Peoples_Live_desc:0"Продовольственный кризис — это угроза, армия — это нож у горла. После объявления нейтралитета наша армия потеряла цель. Мы должны восстановить её боевой дух."
DRA_Radical_Military_Innovation:0"Радикальные военные инновации"
DRA_Radical_Military_Innovation_desc:0"Армия потеряла смысл существования. По совету Альбедо, мы внедрим новые технологии и проведём реформы, включая создание солдатских комитетов."
DRA_CockMon_Go:0"Бронированные тараканы"
DRA_CockMon_Go_desc:0"Наши реформы находят отклик у половины армии. Мы наберём новых солдат, готовых принять новое вооружение."
DRA_Normal_Reorganize:0"Обычная реорганизация"
DRA_Normal_Reorganize_desc:0"Мы используем обычные методы для повышения боевого духа — материальное стимулирование и пропаганду."
DRA_Restore_Armies_Morale:0"Набор новобранцев"
DRA_Restore_Armies_Morale_desc:0"Наша армия слишком мала для защиты. Мы проведём призыв, чтобы пополнить ряды."
DRA_Take_our_Arms:0"К оружию"
DRA_Take_our_Arms_desc:0"Боевой дух армии восстановлен, солдаты снова на страже."
DRA_Look_out_Dragonspine:0"За пределами хребта"
DRA_Look_out_Dragonspine_desc:0"Пока мы занимались внутренними делами, ситуация снаружи изменилась. Пора пересмотреть наш курс."
DRA_Sucrose_Nice:0"Бодрая Сахароза"
DRA_Sucrose_Nice_desc:0"Решение проблемы армии подняло дух Сахарозы. Пора дать ей отдохнуть."
DRA_Sucrose_Cash:0"Финансирование Сахарозы"
DRA_Sucrose_Cash_desc:0"Сахароза попросила больше средств на исследования. Мы не можем отказать."
DRA_Promote_our_Army:0"Военное развитие"
DRA_Promote_our_Army_desc:0"Наша армия нуждается в модернизации вооружения и тактики."
DRA_Promote_our_Army1:0"Военное развитие"
DRA_Promote_our_Army1_desc:0"Наша армия нуждается в модернизации вооружения и тактики."
DRA_Better_Planning:0"Точное планирование"
DRA_Better_Planning_desc:0"Мы будем полагаться на тщательное планирование."
DRA_Better_Planning1:0"Точное планирование"
DRA_Better_Planning1_desc:0"Мы будем полагаться на тщательное планирование."
DRA_Living_Signal_Receiver:0"Живой передатчик"
DRA_Living_Signal_Receiver_desc:0"Мы разработаем дешёвые средства связи с помощью биоалхимии."
DRA_Firepower_and_Firepower:0"Огневая мощь"
DRA_Firepower_and_Firepower_desc:0"Артиллерия и стихии дешевле человеческих жизней. Мы уничтожим врага огнём."
DRA_Firepower_and_Firepower1:0"Огневая мощь"
DRA_Firepower_and_Firepower1_desc:0"Артиллерия и стихии дешевле человеческих жизней. Мы уничтожим врага огнём."
DRA_Guidance_System_from_Mint:0"Наведение на мяте"
DRA_Guidance_System_from_Mint_desc:0"Мы разработаем систему наведения, использующую мяту для обнаружения вражеской артиллерии."
DRA_Flexible_Fight:0"Манёвренная война"
DRA_Flexible_Fight_desc:0"Мы будем использовать манёвры для перерезания линий снабжения и окружения врага."
DRA_Flexible_Fight1:0"Манёвренная война"
DRA_Flexible_Fight1_desc:0"Мы будем использовать манёвры для перерезания линий снабжения и окружения врага."
DRA_Alive_Armor:0"Живая броня"
DRA_Alive_Armor_desc:0"Мы создадим новую бронетехнику."
DRA_Coordinate_with_Mints:0"Синергия с мятой"
DRA_Coordinate_with_Mints_desc:0""
DRA_Primary_Bio_Industry:0"Первичная биоиндустрия"
DRA_Primary_Bio_Industry_desc:0""
DRA_Pioneer_of_Military:0"Военный новатор"
DRA_Pioneer_of_Military_desc:0""
DRA_Pioneer_of_Military1:0"Военный новатор"
DRA_Pioneer_of_Military1_desc:0""
DRA_Continue_our_Const:0"Продолжение строительства"
DRA_Continue_our_Const_desc:0"Война прервала наше развитие. Пора возобновить его. Наша цель — чтобы у каждого в доме была курица!"
DRA_Expand_Ports:0"Окно в Ли Юэ"
DRA_Expand_Ports_desc:0"Торговля с Ли Юэ была слабой, но сейчас, из-за войны, Ли Юэ вынужден торговать с нами. Мы получим большую выгоду."
DRA_Foreign_Trade:0"Весенний свет"
DRA_Foreign_Trade_desc:0"Наплыв беженцев переполнил Лагерный город. Мы создадим свободные экономические зоны на юго-западе и юго-востоке, чтобы привлечь инвестиции."
DRA_Larger_Industry:0"Весенний гром"
DRA_Larger_Industry_desc:0"Промышленное развитие возобновилось!"
DRA_Sell_our_Tech:0"Еда из гуся"
DRA_Sell_our_Tech_desc:0""
DRA_Invest_Military_Pro:0"Меч самообороны"
DRA_Invest_Military_Pro_desc:0"Отрицающие мир — бессовестны, отрицающие вооружение — глупы. Нам нужна военная промышленность."
DRA_Better_Pro:0"Щит мира"
DRA_Better_Pro_desc:0"С ростом военной промышленности наша армия укрепляется."
DRA_Accelerate_Military_Cons:0"Меч правосудия"
DRA_Accelerate_Military_Cons_desc:0"Наша армия становится слишком сильной для обороны. Возможно, мы должны вмешаться в войну ради мира."
DRA_Star_Silvers:0"Ферма звездного железа"
DRA_Star_Silvers_desc:0"Новое изобретение Сахарозы — слаймы, поедающие руду. Мы увеличим их производство для добычи железа."
DRA_Slime_Farms:0"Ферма слаймов"
DRA_Slime_Farms_desc:0"Под руководством Сахарозы мы создадим фермы слаймов для производства слизи."
DRA_Manmade_shuzhi:0"Синтетическая смола"
DRA_Manmade_shuzhi_desc:0"Мы наладим производство синтетической смолы."
DRA_Miracle_of_DRA_Economy:0"Экономическое чудо"
DRA_Miracle_of_DRA_Economy_desc:0"В кровавой войне Драконий хребет стал сияющим городом. Мы преодолели все трудности и превзошли довоенный уровень."
DRA_Not_Stand_Alone:0"Не в одиночестве"
DRA_Not_Stand_Alone_desc:0"Война продолжается, но мы изменились. Пора выходить за пределы хребта."
DRA_Sucrose_Mental_Help:0"Психолог для Сахарозы"
DRA_Sucrose_Mental_Help_desc:0"Сахароза слишком добра для этого мира. Мы наймём ей психолога."
DRA_Unite_for_Peace:0"За мир"
DRA_Unite_for_Peace_desc:0"В охваченном войной Мондштадте есть нейтральные силы — Вольфендом и Спрингвейл. Мы пригласим их к объединению."
DRA_Unite_Against_War:0"За войну"
DRA_Unite_Against_War_desc:0"Видите ли вы солдат, убивающих народ? Они отнимают у вас семьи! Вперёд, вперёд! Кровью врагов оросим поля!"
DRA_Liberate_Mond:0"Освобождение Мондштадта"
DRA_Liberate_Mond_desc:0"Народ уполномочил нас выйти за пределы хребта. Мы вернём мир и свободу Мондштадту!"
DRA_Bring_Peace_Back:0"Мир вернулся"
DRA_Bring_Peace_Back_desc:0"Военачальники повержены, мир и свобода вернулись в Мондштадт. Наши подвиги станут легендой!"
DRA_To_our_Future:0"В будущее"
DRA_To_our_Future_desc:0"Мы преодолели трудности, мы вооружились, мы будем совершенствоваться и достигнем звёзд."
DRA_Vote_for_Last_Action:0"Разрешение на окончательные действия"
DRA_Vote_for_Last_Action_desc:0"Наши действия не обусловлены амбициями. Мы делаем это ради Мондштадта, потому что это абсолютно необходимо."
DRA_focuson_Antiwar_Prop:0"Антивоенная пропаганда"
DRA_focuson_Antiwar_Prop_desc:0"Мы проведём антивоенную пропаганду по всему Мондштадту."
##龙脊雪山第二幕阿贝少线（即focus_tree_21F）国策
DRA_Reborn_of_Mond_Nation:0"Возрождение нации Мондштадта"
DRA_Reborn_of_Mond_Nation_desc:0"Под руководством Великого консула Альбедо мы свергли слабое правительство и военачальников, восстановив порядок. Теперь мы должны залечить раны и возродить Мондштадт."
DRA_Save_Mond_Life:0"Возрождение жизни"
DRA_Save_Mond_Life_desc:0"Страна подобна зверю, здоровье которого зависит от каждой клетки. Мы решительно устраним болезни и восстановим гомеостаз!"
DRA_NO_BUGS:0"Уничтожение вредителей"
DRA_NO_BUGS_desc:0"В нашем обществе есть паразиты, которые потребляют ресурсы, не создавая ценности. Мы вычистим их и используем ресурсы для развития."
DRA_Multi_Level_Economy:0"Многоуровневая экономика"
DRA_Multi_Level_Economy_desc:0"Свободный рынок ведёт к хаосу, а тотальный контроль — к застою. Мы создадим многоуровневую экономику, где государство управляет ключевыми отраслями, а низы имеют свободу."
DRA_Open_on_Mouth:0"Экономика канарейки"
DRA_Open_on_Mouth_desc:0"Свобода необходима для экономики, но её нужно защищать, как канарейку от хищников."
DRA_Green_Villages:0"Зелёные деревни"
DRA_Green_Villages_desc:0"Мы перераспределим землю, улучшим инфраструктуру и условия жизни в деревнях."
DRA_Born_of_Chimera:0"Рождение химеры"
DRA_Born_of_Chimera_desc:0"Разрозненные предприятия неэффективны. Мы объединим их в трест для координации."
DRA_Ambiguous_Law:0"Двусмысленный закон"
DRA_Ambiguous_Law_desc:0"Мы объявим о либерализации экономики, но реформы будут проводиться постепенно."
DRA_Dad_Anywhere:0"Отец Мондштадта везде"
DRA_Dad_Anywhere_desc:0"Прежняя политика провалилась. Наша экономическая политика принесла порядок."
DRA_Spread_New_Technique_of_Agri:0"Внедрение агротехнологий"
DRA_Spread_New_Technique_of_Agri_desc:0"Крестьяне консервативны, но мы внедрим новые технологии для их же блага."
DRA_Break_the_Net:0"Разорвать паутину"
DRA_Break_the_Net_desc:0"Связи между властью и корпорациями привели к коррупции. Мы разорвём эту паутину."
DRA_Dad_Show_Show_Way:0"Отец указывает путь"
DRA_Dad_Show_Show_Way_desc:0"Великий консул Альбедо, обладающий высшим разумом и опытом, укажет нам путь."
DRA_Stop_Weakening:0"Прекращение упадка"
DRA_Stop_Weakening_desc:0"Экономический кризис преодолён, и вскоре мы превзойдём былое процветание."
DRA_The_Iron_Order:0"Железный порядок"
DRA_The_Iron_Order_desc:0"Хаос разрушил власть на местах. Мы введём военное положение, чтобы навести порядок."
DRA_No_another_V:0"Больше никакой Веннессы"
DRA_No_another_V_desc:0"Мы подавим остатки оппозиции, начиная с полиции."
DRA_Wind_of_Decarabian:0"Ветер Декарабиана"
DRA_Wind_of_Decarabian_desc:0"Мы переосмыслим историю Декарабиана, чтобы укрепить нашу власть и выявить оппозицию."
DRA_Supervise_V_owners:0"Контроль над Глазами Бога"
DRA_Supervise_V_owners_desc:0"Обладатели Глаза Бога — это потенциальная угроза. Мы поставим их на учёт."
DRA_Real_Meaning_of_Wind:0"Истинный смысл ветра"
DRA_Real_Meaning_of_Wind_desc:0"Барбатос учил не хаосу, а порядку. Мы переосмыслим его учение."
DRA_Play_the_Metal_Drum:0"Барабанный бой"
DRA_Play_the_Metal_Drum_desc:0"Образование формирует человека. Мы создадим новую систему образования для воспитания сильной нации."
DRA_Pure_Nation:0"Чистота нации"
DRA_Pure_Nation_desc:0"Иностранцы развязали войну. Мы ужесточим контроль над границами."
DRA_Great_Dictator:0"Великий диктатор"
DRA_Great_Dictator_desc:0"Великий консул Альбедо поведёт нас к победе."
DRA_Nation_Strengthened_For_Dictatorship:0"Сила в диктатуре"
DRA_Nation_Strengthened_For_Dictatorship_desc:0"Только железная воля может привести к победе."
DRA_Greatest_Alchemy:0"Величайшая алхимия"
DRA_Greatest_Alchemy_desc:0"Философский камень создан, и каждый подданный стал частью нового порядка."
DRA_Stop_Existence_of_Enemies_among_us:0"Уничтожение врагов"
DRA_Stop_Existence_of_Enemies_among_us_desc:0"Нация — это основа государства. Мы устраним всех врагов внутри."
DRA_Preparation_for_out:0"Подготовка к внешней угрозе"
DRA_Preparation_for_out_desc:0"Мы должны готовиться к войне, так как никто не заслуживает доверия."
