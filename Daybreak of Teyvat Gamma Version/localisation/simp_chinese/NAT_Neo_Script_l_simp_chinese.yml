 NAT_Canopy_Canopy_Council_Idea:"树冠议所"
 NAT_Canopy_Canopy_Council_Idea_desc:"悬木人将议所设于一棵古木树冠最高处，那里无座椅，只有横生粗枝。数长老攀上，或扶藤索，或踩枝杈。一年轻后生至，四下张望，寻不到坐处，便问：「怎么连个凳子皆无？」为首长老以脚磕脚下枝干，曰：「站着说话，比坐着清楚。」后生半信半疑，也学众人扶藤索站定。议事始，果无人久坐打盹，一句话未说完，脚下枝头便随晃一晃，人之精神反提起。议至日头偏西，后生扶藤索之手酸矣，却仍站着，听长老将末一句说完。"
 NAT_Canopy_Canopy_Council_tt:"树冠议所\n本族由此获得了只属于它自己的一份本事：\n[political_power_gain_tt]\n[stability_factor_tt]\n[research_speed_factor_tt]\n[stability_weekly_factor_tt]"
 NAT_Canopy_Felling_Dispute_Idea:"伐木生争"
 NAT_Canopy_Felling_Dispute_Idea_desc:"悬木人欲为搭栈道伐一树，可那树乃林中神树。斧手抡斧，方欲落下，为一位老祭司伸手拦住。老祭司绕树走三圈，摸树身古名刻痕，曰：「此树，谁来定价？」斧手将斧往地一顿，曰：「栈道不定，藤索运不出，全族皆困于林中。」旁一后生亦曰：「祖先刻古名，为护树，非为护着谁不许动。」老祭司默然半晌，自怀取出一小截燃素，置树根下，退两步：「价，吾来定。汝伐，记此一截。」斧手点头，复抡斧，第一下落离燃素最远那侧。"
