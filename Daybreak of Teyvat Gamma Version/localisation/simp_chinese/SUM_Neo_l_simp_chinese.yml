 SUM_Neo.198.t:"新神睁眼"
 SUM_Neo.198.d:"新神睁眼。它看的第一样东西，是跪下的贤者们。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。"
