 Mavuika:"玛薇卡"
 Mavuika_desc:"炽焰、焚燔与战火之神，_尔命因纷争而起，_尔路以英名铺就，_尔光如烈阳烧尽群山。_六族之火汇于尔掌，_万古之夜惧尔瞳仁。_吾辈集于群星之火，_看圣火照彻烬寂海，_以证此役之胜负。_火不灭，_纳塔便不亡。"
 NAT_Mavuika:"玛薇卡"
 NAT_Mavuika_desc:"炽焰、焚燔与战火之神，_你的命因火山而生，_你的路以古名铺就，_你的光如烈阳灼穿黑瘴。_你以五百年长眠守住一簇圣火，_换来六族今朝同立一处。_我们汇集于群星之火，_看龙焰与源火齐燃，_见证这场角逐的胜负。_火在，_人便在。"
 Mavuika_N:"玛薇卡之焰"
 Mavuika_N_desc:"炽焰、焚燔与战火之神，_尔命因角逐而起，_尔路以誓约铺就，_尔光如烈阳焚尽深渊。_自悬木少女而至火神之位，_以不灭之志存于圣火。_吾辈集于群星之火，_听归火圣夜之歌传遍赤地，_以证此役之胜负。_火种不熄，_荣光长存。"

