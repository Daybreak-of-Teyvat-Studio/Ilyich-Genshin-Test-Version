 SUM_SGS_PRO_Pari_Nasejuna:"那塞犹那的歌"
 SUM_SGS_PRO_Pari_Nasejuna_desc:"那塞犹那会唱花灵的歌，孩子听着睡，大人听着想起自己的祖母。"
 SUM_Neo_SGS.5.t:"那塞犹那的歌"
 SUM_Neo_SGS.5.d:"那塞犹那会唱花灵的歌，孩子听着睡，大人听着想起自己的祖母。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
