ABY_lumine:0 "Люмин"
ABY_lumine_desc:0 "Наша путешественница такая милая, да, весь Орден единогласно согласен, что Люмин должна быть правительницей мира, а все люди должны быть её верными слугами."
ABY_kong:0 "Кун"
ABY_kong_desc:0 "Кровный родственник Люмин и восхвалитель её великих деяний, оператор, запечатлевший подвиги путешественницы."
ABY_yuanshang:0 "Юаньшан"
ABY_yuanshang_desc:0 "Прославляющий себя как певца Ордена Бездны по имени Юаньшан, вероятно, потому что его впервые встретили в Энканомии, так почему бы не назваться Юанься?"
ABY_guzhong:0 "Гучжун"
ABY_guzhong_desc:0 "Прославляющий себя как певца Ордена Бездны по имени Гучжун, вероятно, потому что его впервые встретили в горной долине, и он чуть не был превращён Киничем в подарок, чтобы наша путешественница могла на нём отыграться."
ABY_shanxia:0 "Шанься"
ABY_shanxia_desc:0 "Прославляющий себя как певца Ордена Бездны по имени Шанься, вероятно, потому что его впервые встретили у подножия гор, он в некоторой степени помог нашей путешественнице разрешить кризис в Натлане, ясно, что этот парень — предатель Бездны."
ABY_dawei:0 "Давэй Цю"
ABY_dawei_desc:0 "Странный хиличурл с иероглифом «вэй» в имени, говорят, что перед каждым круткой бить Давэй Цю повышает шанс выпадения, возможно, это происходит из древнего пророчества «гнев превыше всего творит чудеса», вопрос о том, почему Давэй сохранил историю о своей торговле телом."
