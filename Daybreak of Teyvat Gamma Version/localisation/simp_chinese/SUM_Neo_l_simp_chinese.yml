 SUM_Neo.123.t:"第一场表决"
 SUM_Neo.123.d:"须弥第一次用表决来决定国政。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。"
