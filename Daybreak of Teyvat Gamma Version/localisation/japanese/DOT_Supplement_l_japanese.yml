 SOV_training_activities_curtailed:0 "削減された訓練費"
 SOV_training_activities_curtailed_desc:0 "直近の軍事演習からの報告によると、大部分の車両が機械的故障により脱落し、またかなりの数の新兵が負傷したことが示されている。我々がこの失敗の真の原因を見つけ出すまで大規模な演習は禁止された。"
 SOV_trotskyist_revolutionary_agitation:0 "トロツキストの革命扇動"
 SOV_trotskyist_revolutionary_agitation_desc:0 "トロツキスト派の支持者や[SOV.GetAdjective]・ボリシェヴィキ党と同調しているその他の共産主義分子は[ROOT.GetAdjective]の大衆を扇動し、労働者階級にマルクス主義のイデオロギーを喧伝し、我が国政府に対する武装闘争を呼びかけている。"
 SOV_trotskyist_revolutionary_agitation_tt:0 "ディシジョン§Y$ban_communist_party$§!を有効化すると、この国民精神の影響が軽減される。"
