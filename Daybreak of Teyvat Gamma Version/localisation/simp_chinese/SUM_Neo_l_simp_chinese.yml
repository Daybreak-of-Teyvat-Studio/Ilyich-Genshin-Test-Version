 SUM_Neo.205.t:"赤王信徒"
 SUM_Neo.205.d:"赤王的信徒被收编，成了新神的第一批祭司。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。高塔投下的影子越来越长，傍晚时就盖住了半条街。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。"
