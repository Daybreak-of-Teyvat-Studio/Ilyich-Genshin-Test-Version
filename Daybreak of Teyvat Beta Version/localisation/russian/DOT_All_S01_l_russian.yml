DOT_Space_Program.1.t:0 "Проект «Просвещение»"
DOT_Space_Program.1.d:0 "Правительство [ROOT.GetNameWithFlag] объявило о запуске космической программы. Мы используем науку и магию для изучения мира и освобождения от иллюзий. Мы не хотим жить в мире, контролируемом богами. Мы хотим исследовать вселенную и найти свою судьбу. Для этого мы построим космодром и ракету."
DOT_Space_Program.1.a:0 "Наш путь — к звёздам!"
DOT_Space_Program.2.t:0 "Космическая база"
DOT_Space_Program.2.d:0 "Правительство [ROOT.GetNameWithFlag] объявило о завершении строительства космической базы. Она находится в горах и оснащена передовыми ракетными технологиями. Наша цель — исследовать вселенную и найти новые ресурсы. Мы верим, что за фальшивым небом нас ждут бесконечные знания."
DOT_Space_Program.2.a:0 "Наш путь — к звёздам!"
DOT_Space_Program.3.t:0 "Первый космический эксперимент"
DOT_Space_Program.3.d:0 "Правительство [ROOT.GetNameWithFlag] сообщает, что первый космический эксперимент не увенчался успехом. Ракета взорвалась на высоте 8 км из-за неисправности. Это серьёзная неудача, показавшая наши технологические слабости."
DOT_Space_Program.3.a:0 "Наш путь — к звёздам!"
DOT_Space_Program.4.t:0 "Второй космический эксперимент"
DOT_Space_Program.4.d:0 "Правительство [ROOT.GetNameWithFlag] объявило о втором запуске ракеты. Взлёт прошёл успешно, но когда ракета приблизилась к Небесному Острову, красный луч сбил её. Это была подлая атака!"
DOT_Space_Program.4.a:0 "Злодейство Небесного Острова очевидно!"
DOT_Space_Program.5.t:0 "Третий космический эксперимент"
DOT_Space_Program.5.d:0 "Правительство [ROOT.GetNameWithFlag] объявило о третьем запуске. Мы запустили 18 ракет одновременно, чтобы обмануть Небесный Остров. Три ракеты прорвали блокаду, но разбились о небесный купол. Эксперимент дал нам ценные данные. Мы не сдадимся."
DOT_Space_Program.5.a:0 "Наш путь — к звёздам!"
