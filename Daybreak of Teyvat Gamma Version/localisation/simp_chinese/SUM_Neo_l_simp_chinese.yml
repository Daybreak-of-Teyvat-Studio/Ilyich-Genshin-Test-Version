 SUM_SDH_RC_Date_Grove:"枣椰林"
 SUM_SDH_RC_Date_Grove_desc:"沿渠遍植枣椰，三年成林，果实按户分。"
 SUM_Neo_SDH.147.t:"枣椰林"
 SUM_Neo_SDH.147.d:"沿渠遍植枣椰，三年成林，果实按户分。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SDH.147.a:"把遗迹挖开"
 SUM_Neo_SDH.147.b:"把遗迹封回去"
 SUM_SDH_RC_Rotation:"轮牧"
 SUM_SDH_RC_Rotation_desc:"草场分片轮牧，放牧的日子写在木牌上。"
 SUM_Neo_SDH.148.t:"轮牧"
 SUM_Neo_SDH.148.d:"草场分片轮牧，放牧的日子写在木牌上。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
