 INA_communication:0 "通讯工具"
 INA_communication_desc:0 "大幅加强通讯连的通讯能力，使得我们可以以最快的速度，将我们的部队组织起来。"
 INA_communication_tooltip:0 "通讯连组织度+100，组织度恢复速度+1."
 INA_ironways:0 "铁道部"
