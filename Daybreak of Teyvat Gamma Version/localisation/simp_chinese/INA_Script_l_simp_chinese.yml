 INA_air_dominance:0 "鸣雷无双"
 INA_air_dominance_desc:0 "与传说中略有差异，在稻妻，天狗一族更善于用雷，而非御风"
 INA_cas_focus:0 "九天雷霆"
 INA_cas_focus_desc:0 "从天而降的雷鸣，绝不是拿双脚去蹬对面一下就没了的废物技能"
 INA_air_ground_cooperation:0 "空地协作"
 INA_air_ground_cooperation_desc:0 "将战争变为立体而非平面"
 INA_flying_artillery:0 "空中炮艇"
