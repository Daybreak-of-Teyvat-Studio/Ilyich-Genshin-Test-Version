DOT_ControlProvince.10.d.generic:0"Башня Короля, бывшее обиталище Декарабиана, захвачена войсками [FROM.GetAdjective]. Солдат водрузил флаг [FROM.GetAdjective] на вершине.\n\nБашня стала ещё более разрушенной, но сила Декарабиана поддерживает её."
