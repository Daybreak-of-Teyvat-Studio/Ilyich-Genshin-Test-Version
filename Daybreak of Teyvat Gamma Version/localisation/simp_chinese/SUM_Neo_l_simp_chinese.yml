 SUM_Neo.36.t:"神殿重建"
 SUM_Neo.36.d:"荒废的神殿被重新修起，工匠昼夜赶工。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。"
