 SOV_politicized_military:0 "政治化された軍部"
 SOV_politicized_military_battle_priests:0 "陸軍の戦う司祭"
 SOV_politicized_military_battle_priests_desc:0 "軍事部隊内で従軍司祭の任務を行う神品は、隊員の士気を高ち、教会と神が我らの味方であることを部隊内に信じさせている。"
 SOV_politicized_military_desc:0 "政治将校は熱心にイデオロギー的演説や階級間の政治的議論を行うが、度を越した管理、将校に対する過剰な監視、さらには部隊指揮官の命令妨害まで行うことが多々ある。"
 SOV_politicized_military_swap:0 "軍の政治顧問"
 SOV_politicized_military_swap_desc:0 "政治的な配慮が軍事的な決定を大幅に影響することがあってはならないが、決定に至るまでには、こうした政治的な配慮がある程度考慮されてしかるべきだ。"
 SOV_popular_speeches_poum:0 "大衆への演説"
 SOV_popular_speeches_poum_desc:0 "現地の組織、海外の班スターリン主義勢力の有力者などの協力を得て、支配地域で大規模な情報・宣伝活動を展開し、大衆の間に革命の炎を再び燃え上がらせている。"
 SOV_preparations_for_soviet_japanese_war:0 "ソ日戦争の準備"
 SOV_preparations_for_soviet_japanese_war_desc:0 "$SOV_prepare_a_war_with_japan_desc$"
 SOV_puppet_international_of_soviet_republics_idea:0 "国際ソビエト共和国"
 SOV_puppet_international_of_soviet_republics_idea_desc:0 "大いなる全の一部となることは我が国にとって大きな利益をもたらす。"
 SOV_purged_junior_army_officers_1:0 "下級陸軍将校の粛清"
 SOV_purged_junior_army_officers_1_desc:0 "大勢の下級陸軍将校が、扇動、サボタージュ、反ソビエト思想の罪でNKVDによって逮捕された。過去の戦争で多くの経験を積んだ将校と古参兵を失ったため、赤軍は危険な混乱状態に置かれている。"
 SOV_purged_junior_army_officers_1_tt:0 "§Y全地上車両§!: 信頼性ボーナス: §R-10%§!"
 SOV_purged_junior_army_officers_2_tt:0 "§Y全地上車両§!: 信頼性ボーナス: §R-20%§!"
 SOV_purged_junior_army_officers_3_tt:0 "§Y全地上車両§!: 信頼性ボーナス: §R-30%§!\n§Y$politically_connected$§!が新たな将軍が利用可能な唯一の特性になる。"
 SOV_purged_junior_navy_officers_1:0 "下級海軍将校の粛清"
 SOV_purged_junior_navy_officers_1_desc:0 "大勢の下級海軍将校が、扇動、サボタージュ、反ソビエト思想の罪でNKVDによって逮捕された。過去の戦争で多くの経験を積んだ将校と古参兵を失ったため、赤軍は危険な混乱状態に置かれている。"
 SOV_purged_junior_navy_officers_3_tt:0 "§Y$politically_connected$§!が新たな提督が利用可能な唯一の特性になる。"
 SOV_rehabilitated_military_ns:0 "$SOV_rehabilitated_military$"
 SOV_rehabilitated_military_ns_desc:0 "政治将校の手綱を少し緩め、指揮官に事を進める自由を与える時だ。"
