 SUM_Neo_SGS.123.b:"把土地归入官仓"

 #### 丙线 · 沙王正统 ####
 SUM_SGS_RC_The_Legacy_of_the_Sand_Kings:"沙王的遗制"
 SUM_SGS_RC_The_Legacy_of_the_Sand_Kings_desc:"第三条路翻的是更旧的一笔账：沙丘腰带曾是赤王治下的一环，圣显厅里存着当年的法度。有人主张把这份法度请回来，用旧制管今日的沙。"
 SUM_Neo_SGS.124.t:"沙王的遗制"
 SUM_Neo_SGS.124.d:"第三条路翻的是更旧的一笔账：沙丘腰带曾是赤王治下的一环，圣显厅里存着当年的法度。有人主张把这份法度请回来，用旧制管今日的沙。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGS.124.a:"重立赤王的旧制"
 SUM_Neo_SGS.124.b:"重建城邦的议会"
 SUM_SGS_RC_Trace_Line:"溯沙王统"
 SUM_SGS_RC_Trace_Line_desc:"把沙丘腰带历代的主事者理了一遍，理到最上头，只剩一个名字：赤王。"
 SUM_Neo_SGS.125.t:"溯沙王统"
 SUM_Neo_SGS.125.d:"把沙丘腰带历代的主事者理了一遍，理到最上头，只剩一个名字：赤王。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGS.125.a:"召集能战之众"
 SUM_Neo_SGS.125.b:"召集能谋之士"
 SUM_SGS_RC_Claim_Legacy:"承其遗制"
 SUM_SGS_RC_Claim_Legacy_desc:"宣称沙丘腰带承赤王的遗制，法度有据，名分有源。"
 SUM_Neo_SGS.126.t:"承其遗制"
 SUM_Neo_SGS.126.d:"宣称沙丘腰带承赤王的遗制，法度有据，名分有源。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGS.126.a:"以神权号令沙漠"
 SUM_Neo_SGS.126.b:"以律法约束诸城"
 SUM_SGS_RC_Court_Back:"复朝仪"
 SUM_SGS_RC_Court_Back_desc:"重立朝仪，谁站哪一级都有定规。定规立起来，人心反而定了。"
 SUM_Neo_SGS.127.t:"复朝仪"
 SUM_Neo_SGS.127.d:"重立朝仪，谁站哪一级都有定规。定规立起来，人心反而定了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGS.127.a:"把遗迹挖开"
 SUM_Neo_SGS.127.b:"把遗迹封回去"
 SUM_SGS_RC_Narrow_Council:"缩议政"
 SUM_SGS_RC_Narrow_Council_desc:"议政之席从几十缩到九个，说话能算数的人少了，事办得快了。"
 SUM_Neo_SGS.128.t:"缩议政"
 SUM_Neo_SGS.128.d:"议政之席从几十缩到九个，说话能算数的人少了，事办得快了。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGS.128.a:"重立赤王的旧制"
 SUM_Neo_SGS.128.b:"重建城邦的议会"
 SUM_SGS_RC_Law_Old:"旧法为纲"
 SUM_SGS_RC_Law_Old_desc:"以圣显厅的旧法为纲，新条一律照旧法解释。"
 SUM_Neo_SGS.129.t:"旧法为纲"
 SUM_Neo_SGS.129.d:"以圣显厅的旧法为纲，新条一律照旧法解释。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SGS.129.a:"召集能战之众"
 SUM_Neo_SGS.129.b:"召集能谋之士"
 SUM_SGS_RC_Army_One:"编为一军"
 SUM_SGS_RC_Army_One_desc:"护路的人、守泉的兵、各城的乡兵全编进一支军，旗号与粮饷统一。"
 SUM_Neo_SGS.130.t:"编为一军"
 SUM_Neo_SGS.130.d:"护路的人、守泉的兵、各城的乡兵全编进一支军，旗号与粮饷统一。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGS.130.a:"以神权号令沙漠"
 SUM_Neo_SGS.130.b:"以律法约束诸城"
 SUM_SGS_RC_Staff:"设军师府"
 SUM_SGS_RC_Staff_desc:"军师府管谋划与粮道，不直接带兵。带兵与谋划分开。"
 SUM_Neo_SGS.131.t:"设军师府"
 SUM_Neo_SGS.131.d:"军师府管谋划与粮道，不直接带兵。带兵与谋划分开。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGS.131.a:"把遗迹挖开"
 SUM_Neo_SGS.131.b:"把遗迹封回去"
 SUM_SGS_RC_Garrison_All:"遍设戍所"
 SUM_SGS_RC_Garrison_All_desc:"商道与绿洲遍设戍所，街街有岗。设起来之后，夜里行路的人少了。"
 SUM_Neo_SGS.132.t:"遍设戍所"
 SUM_Neo_SGS.132.d:"商道与绿洲遍设戍所，街街有岗。设起来之后，夜里行路的人少了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGS.132.a:"重立赤王的旧制"
 SUM_Neo_SGS.132.b:"重建城邦的议会"
 SUM_SGS_RC_Conscript:"征兵法"
 SUM_SGS_RC_Conscript_desc:"凡成丁者皆有服役之责，服役期满可以回家。"
 SUM_Neo_SGS.133.t:"征兵法"
 SUM_Neo_SGS.133.d:"凡成丁者皆有服役之责，服役期满可以回家。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SGS.133.a:"召集能战之众"
 SUM_Neo_SGS.133.b:"召集能谋之士"
 SUM_SGS_RC_Purge:"清队"
 SUM_SGS_RC_Purge_desc:"把军中不听话的几支清了，清出去的没有罪状。"
 SUM_Neo_SGS.134.t:"清队"
 SUM_Neo_SGS.134.d:"把军中不听话的几支清了，清出去的没有罪状。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGS.134.a:"以神权号令沙漠"
 SUM_Neo_SGS.134.b:"以律法约束诸城"
 SUM_SGS_RC_Open_Hall:"重开圣显厅"
 SUM_SGS_RC_Open_Hall_desc:"重开圣显厅，取的是法度，也是厅里的构装。"
 SUM_Neo_SGS.135.t:"重开圣显厅"
 SUM_Neo_SGS.135.d:"重开圣显厅，取的是法度，也是厅里的构装。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SGS.135.a:"把遗迹挖开"
 SUM_Neo_SGS.135.b:"把遗迹封回去"
 SUM_SGS_RC_Mech_Hall:"厅中构装"
 SUM_SGS_RC_Mech_Hall_desc:"厅里的构装修好之后能走能动，装上兵器就是一队不知疲倦的兵。"
 SUM_Neo_SGS.136.t:"厅中构装"
 SUM_Neo_SGS.136.d:"厅里的构装修好之后能走能动，装上兵器就是一队不知疲倦的兵。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGS.136.a:"重立赤王的旧制"
 SUM_Neo_SGS.136.b:"重建城邦的议会"
 SUM_SGS_RC_Mech_Smith:"构装工坊"
 SUM_SGS_RC_Mech_Smith_desc:"专设工坊修补构装，工匠由外邦雇来，图纸锁在柜里。"
 SUM_Neo_SGS.137.t:"构装工坊"
 SUM_Neo_SGS.137.d:"专设工坊修补构装，工匠由外邦雇来，图纸锁在柜里。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SGS.137.a:"召集能战之众"
 SUM_Neo_SGS.137.b:"召集能谋之士"
 SUM_SGS_RC_Great_Works:"兴土木"
 SUM_SGS_RC_Great_Works_desc:"在圣显厅旁起一片宫室，石料从旧遗迹里拆。"
 SUM_Neo_SGS.138.t:"兴土木"
 SUM_Neo_SGS.138.d:"在圣显厅旁起一片宫室，石料从旧遗迹里拆。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGS.138.a:"以神权号令沙漠"
 SUM_Neo_SGS.138.b:"以律法约束诸城"
 SUM_SGS_RC_Slab_Script:"释读石板"
 SUM_SGS_RC_Slab_Script_desc:"召集识字的人释读石板，读出来的多是旧规与旧账。"
 SUM_Neo_SGS.139.t:"释读石板"
 SUM_Neo_SGS.139.d:"召集识字的人释读石板，读出来的多是旧规与旧账。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGS.139.a:"把遗迹挖开"
 SUM_Neo_SGS.139.b:"把遗迹封回去"
 SUM_SGS_RC_Priest_Order:"祭司之序"
 SUM_SGS_RC_Priest_Order_desc:"祭司按序受职，序由官府定。灵是旧的灵，管灵的人是新的人。"
 SUM_Neo_SGS.140.t:"祭司之序"
 SUM_Neo_SGS.140.d:"祭司按序受职，序由官府定。灵是旧的灵，管灵的人是新的人。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SGS.140.a:"重立赤王的旧制"
 SUM_Neo_SGS.140.b:"重建城邦的议会"
 SUM_SGS_RC_Rite_State:"国祀"
 SUM_SGS_RC_Rite_State_desc:"把灵光之礼升为国祀，礼在圣显厅外办，来的有官也有民。"
 SUM_Neo_SGS.141.t:"国祀"
 SUM_Neo_SGS.141.d:"把灵光之礼升为国祀，礼在圣显厅外办，来的有官也有民。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGS.141.a:"召集能战之众"
 SUM_Neo_SGS.141.b:"召集能谋之士"
 SUM_SGS_RC_Pari_Office:"置灵官"
 SUM_SGS_RC_Pari_Office_desc:"设一个管花灵之事的官位，花灵不来，官也没事可做。"
 SUM_Neo_SGS.142.t:"置灵官"
 SUM_Neo_SGS.142.d:"设一个管花灵之事的官位，花灵不来，官也没事可做。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGS.142.a:"以神权号令沙漠"
 SUM_Neo_SGS.142.b:"以律法约束诸城"
 SUM_SGS_RC_Shrine_All:"遍立灵龛"
 SUM_SGS_RC_Shrine_All_desc:"各处水驿立龛，龛前多站一个官。"
 SUM_Neo_SGS.143.t:"遍立灵龛"
 SUM_Neo_SGS.143.d:"各处水驿立龛，龛前多站一个官。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGS.143.a:"把遗迹挖开"
 SUM_Neo_SGS.143.b:"把遗迹封回去"
 SUM_SGS_RC_Pilgrim_Guard:"护法队"
 SUM_SGS_RC_Pilgrim_Guard_desc:"朝圣路上派护法队，护的不只是香客，还有沿路的税卡。"
 SUM_Neo_SGS.144.t:"护法队"
 SUM_Neo_SGS.144.d:"朝圣路上派护法队，护的不只是香客，还有沿路的税卡。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGS.144.a:"重立赤王的旧制"
 SUM_Neo_SGS.144.b:"重建城邦的议会"
 SUM_SGS_RC_Camel_Heavy:"重装驼骑"
 SUM_SGS_RC_Camel_Heavy_desc:"给驼骑加甲，慢是慢了些，冲起来挡不住。"
 SUM_Neo_SGS.145.t:"重装驼骑"
 SUM_Neo_SGS.145.d:"给驼骑加甲，慢是慢了些，冲起来挡不住。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGS.145.a:"召集能战之众"
 SUM_Neo_SGS.145.b:"召集能谋之士"
 SUM_SGS_RC_Storm_Banner:"风沙军团"
 SUM_SGS_RC_Storm_Banner_desc:"选耐风沙的人编成军团，专挑沙暴天出击。"
 SUM_Neo_SGS.146.t:"风沙军团"
 SUM_Neo_SGS.146.d:"选耐风沙的人编成军团，专挑沙暴天出击。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGS.146.a:"以神权号令沙漠"
 SUM_Neo_SGS.146.b:"以律法约束诸城"
 SUM_SGS_RC_Fort_Chain:"堡垒链"
 SUM_SGS_RC_Fort_Chain_desc:"沿商道修一串堡垒，堡与堡之间骑兵一日可达。"
 SUM_Neo_SGS.147.t:"堡垒链"
 SUM_Neo_SGS.147.d:"沿商道修一串堡垒，堡与堡之间骑兵一日可达。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SGS.147.a:"把遗迹挖开"
 SUM_Neo_SGS.147.b:"把遗迹封回去"
 SUM_SGS_RC_Weapon_Works:"军械监"
 SUM_SGS_RC_Weapon_Works_desc:"设军械监专管造兵器，监里的匠人比官还横。"
 SUM_Neo_SGS.148.t:"军械监"
 SUM_Neo_SGS.148.d:"设军械监专管造兵器，监里的匠人比官还横。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGS.148.a:"重立赤王的旧制"
 SUM_Neo_SGS.148.b:"重建城邦的议会"
 SUM_SGS_RC_War_Chest:"军费库"
 SUM_SGS_RC_War_Chest_desc:"单设军费库，动用要三个人同时开口。"
 SUM_Neo_SGS.149.t:"军费库"
 SUM_Neo_SGS.149.d:"单设军费库，动用要三个人同时开口。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SGS.149.a:"召集能战之众"
 SUM_Neo_SGS.149.b:"召集能谋之士"
 SUM_SGS_RC_Old_Order:"旧制照行"
 SUM_SGS_RC_Old_Order_desc:"有人主张照旧例行事：该交的交，该办的办，只把账本换个封皮。"
 SUM_Neo_SGS.150.t:"旧制照行"
 SUM_Neo_SGS.150.d:"有人主张照旧例行事：该交的交，该办的办，只把账本换个封皮。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGS.150.a:"以神权号令沙漠"
 SUM_Neo_SGS.150.b:"以律法约束诸城"
 SUM_SGS_RC_Tribute_New:"贡赋新算"
 SUM_SGS_RC_Tribute_New_desc:"与雨林重算贡赋，交还是交，只是数少了，名目换了。"
 SUM_Neo_SGS.151.t:"贡赋新算"
 SUM_Neo_SGS.151.d:"与雨林重算贡赋，交还是交，只是数少了，名目换了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGS.151.a:"把遗迹挖开"
 SUM_Neo_SGS.151.b:"把遗迹封回去"
 SUM_SGS_RC_Border_Old:"边界旧约"
 SUM_SGS_RC_Border_Old_desc:"边界不动，只把守界的人换成自己人。"
 SUM_Neo_SGS.152.t:"边界旧约"
 SUM_Neo_SGS.152.d:"边界不动，只把守界的人换成自己人。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGS.152.a:"重立赤王的旧制"
 SUM_Neo_SGS.152.b:"重建城邦的议会"
 SUM_SGS_RC_Keep_Clerks:"留用旧吏"
 SUM_SGS_RC_Keep_Clerks_desc:"会算账的人到哪朝都缺，旧吏大多留用。"
 SUM_Neo_SGS.153.t:"留用旧吏"
 SUM_Neo_SGS.153.d:"会算账的人到哪朝都缺，旧吏大多留用。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGS.153.a:"召集能战之众"
 SUM_Neo_SGS.153.b:"召集能谋之士"
 SUM_SGS_RC_Quiet_Land:"守成之策"
 SUM_SGS_RC_Quiet_Land_desc:"不折腾，不扩张，把眼下的日子过稳。"
 SUM_Neo_SGS.154.t:"守成之策"
 SUM_Neo_SGS.154.d:"不折腾，不扩张，把眼下的日子过稳。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。"
 SUM_Neo_SGS.154.a:"以神权号令沙漠"
 SUM_Neo_SGS.154.b:"以律法约束诸城"
 SUM_SGS_RC_Sand_Throne:"沙王再临"
 SUM_SGS_RC_Sand_Throne_desc:"圣显厅旁起了一座高台，台下是按号站好的军。台上的人受了名分，第一道令是把沙丘所有的道都设卡、所有的驿都设戍。沙丘从没有这样整齐，也从没有这样安静。"
 SUM_Neo_SGS.155.t:"沙王再临"
 SUM_Neo_SGS.155.d:"圣显厅旁起了一座高台，台下是按号站好的军。台上的人受了名分，第一道令是把沙丘所有的道都设卡、所有的驿都设戍。沙丘从没有这样整齐，也从没有这样安静。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGS.155.a:"把遗迹挖开"
 SUM_Neo_SGS.155.b:"把遗迹封回去"
 SUM_SGS_RC_Old_Dune:"沙丘守成"
 SUM_SGS_RC_Old_Dune_desc:"沙丘腰带与雨林重划了账：税减了，哨撤了，地界不动。水驿照旧开，学馆照旧办，矫论团的经义照旧在帐里讲。日子过得比前几年安稳。"
 SUM_Neo_SGS.156.t:"沙丘守成"
 SUM_Neo_SGS.156.d:"沙丘腰带与雨林重划了账：税减了，哨撤了，地界不动。水驿照旧开，学馆照旧办，矫论团的经义照旧在帐里讲。日子过得比前几年安稳。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGS.156.a:"重立赤王的旧制"
 SUM_Neo_SGS.156.b:"重建城邦的议会"

 #### 开战须弥 · 雨林的门 ####
 SUM_SGS_WAR_The_Dune_Rises:"沙丘东望"
 SUM_SGS_WAR_The_Dune_Rises_desc:"沙丘腰带的商路、水驿与圣显厅，名分上还挂在雨林名下。花灵不再替人做决定，可这一次，她们替凡人看清了一件事：不把这笔账清掉，沙上的人永远弯着腰。"
 SUM_Neo_SGS.157.t:"沙丘东望"
 SUM_Neo_SGS.157.d:"沙丘腰带的商路、水驿与圣显厅，名分上还挂在雨林名下。花灵不再替人做决定，可这一次，她们替凡人看清了一件事：不把这笔账清掉，沙上的人永远弯着腰。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGS.157.a:"以动员令起兵"
 SUM_Neo_SGS.157.b:"以盟约召集部族"
 SUM_SGS_WAR_Call_All:"召集各城各部"
 SUM_SGS_WAR_Call_All_desc:"召集令传遍各城各族，来的人比估的多。"
 SUM_Neo_SGS.158.t:"召集各城各部"
 SUM_Neo_SGS.158.d:"召集令传遍各城各族，来的人比估的多。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SGS.158.a:"直取雨林关隘"
 SUM_Neo_SGS.158.b:"先断其商路"
 SUM_SGS_WAR_War_Fund:"征军费"
 SUM_SGS_WAR_War_Fund_desc:"盐路出一半，商户出一半，凑出这笔军费。"
 SUM_Neo_SGS.159.t:"征军费"
 SUM_Neo_SGS.159.d:"盐路出一半，商户出一半，凑出这笔军费。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGS.159.a:"把话说给雨林人听"
 SUM_Neo_SGS.159.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Ration:"配给"
 SUM_SGS_WAR_Ration_desc:"粮与盐按口配给，先军后民。"
 SUM_Neo_SGS.160.t:"配给"
 SUM_Neo_SGS.160.d:"粮与盐按口配给，先军后民。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SGS.160.a:"倾全境之力"
 SUM_Neo_SGS.160.b:"留一支后手"
 SUM_SGS_WAR_War_Council:"定三路"
 SUM_SGS_WAR_War_Council_desc:"军议定三路：一路沿商道，一路穿沙脊，一路绕绿洲。"
 SUM_Neo_SGS.161.t:"定三路"
 SUM_Neo_SGS.161.d:"军议定三路：一路沿商道，一路穿沙脊，一路绕绿洲。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGS.161.a:"以动员令起兵"
 SUM_Neo_SGS.161.b:"以盟约召集部族"
 SUM_SGS_WAR_Proclaim:"讨雨林檄"
 SUM_SGS_WAR_Proclaim_desc:"檄文写的是账：欠的水、占的路、多收的税，一条条列着。"
 SUM_Neo_SGS.162.t:"讨雨林檄"
 SUM_Neo_SGS.162.d:"檄文写的是账：欠的水、占的路、多收的税，一条条列着。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SGS.162.a:"直取雨林关隘"
 SUM_Neo_SGS.162.b:"先断其商路"
 SUM_SGS_WAR_Night_March:"夜行"
 SUM_SGS_WAR_Night_March_desc:"大军夜里走，靠星光定向。星光一暗就停，停在沙窝里。"
 SUM_Neo_SGS.163.t:"夜行"
 SUM_Neo_SGS.163.d:"大军夜里走，靠星光定向。星光一暗就停，停在沙窝里。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGS.163.a:"把话说给雨林人听"
 SUM_Neo_SGS.163.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Wind_Guide:"识风人"
 SUM_SGS_WAR_Wind_Guide_desc:"识风的人走在最前，看云就知道哪片要起沙。"
 SUM_Neo_SGS.164.t:"识风人"
 SUM_Neo_SGS.164.d:"识风的人走在最前，看云就知道哪片要起沙。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGS.164.a:"倾全境之力"
 SUM_Neo_SGS.164.b:"留一支后手"
 SUM_SGS_WAR_Beast_Load:"驭兽驮运"
 SUM_SGS_WAR_Beast_Load_desc:"驯好的沙兽驮辎重，比驼能多走半程。"
 SUM_Neo_SGS.165.t:"驭兽驮运"
 SUM_Neo_SGS.165.d:"驯好的沙兽驮辎重，比驼能多走半程。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGS.165.a:"以动员令起兵"
 SUM_Neo_SGS.165.b:"以盟约召集部族"
 SUM_SGS_WAR_Water_Hop:"沿水驿跳进"
 SUM_SGS_WAR_Water_Hop_desc:"沿水驿一站站跳，跳一步，补给近一分。"
 SUM_Neo_SGS.166.t:"沿水驿跳进"
 SUM_Neo_SGS.166.d:"沿水驿一站站跳，跳一步，补给近一分。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGS.166.a:"直取雨林关隘"
 SUM_Neo_SGS.166.b:"先断其商路"
 SUM_SGS_WAR_Silent:"无声行军"
 SUM_SGS_WAR_Silent_desc:"全军训无声行军，铃不响，蹄包布。"
 SUM_Neo_SGS.167.t:"无声行军"
 SUM_Neo_SGS.167.d:"全军训无声行军，铃不响，蹄包布。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGS.167.a:"把话说给雨林人听"
 SUM_Neo_SGS.167.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Storm_Post:"强攻哨所"
 SUM_SGS_WAR_Storm_Post_desc:"雨林伸进沙丘的哨所先得拔掉，拔一处，商道就少一处卡。"
 SUM_Neo_SGS.168.t:"强攻哨所"
 SUM_Neo_SGS.168.d:"雨林伸进沙丘的哨所先得拔掉，拔一处，商道就少一处卡。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGS.168.a:"倾全境之力"
 SUM_Neo_SGS.168.b:"留一支后手"
 SUM_SGS_WAR_Siege_Rig:"造攻具"
 SUM_SGS_WAR_Siege_Rig_desc:"照圣显厅的图样造攻具，笨重，可哨所的墙怕这个。"
 SUM_Neo_SGS.169.t:"造攻具"
 SUM_Neo_SGS.169.d:"照圣显厅的图样造攻具，笨重，可哨所的墙怕这个。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGS.169.a:"以动员令起兵"
 SUM_Neo_SGS.169.b:"以盟约召集部族"
 SUM_SGS_WAR_Cut_Water:"断水驿"
 SUM_SGS_WAR_Cut_Water_desc:"把哨所上游的水引开，守军有水而汲不上。"
 SUM_Neo_SGS.170.t:"断水驿"
 SUM_Neo_SGS.170.d:"把哨所上游的水引开，守军有水而汲不上。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGS.170.a:"直取雨林关隘"
 SUM_Neo_SGS.170.b:"先断其商路"
 SUM_SGS_WAR_Night_Wall:"夜攀"
 SUM_SGS_WAR_Night_Wall_desc:"挑最灵便的人攀墙，攀上去的不到一半，墙上的灯却灭了。"
 SUM_Neo_SGS.171.t:"夜攀"
 SUM_Neo_SGS.171.d:"挑最灵便的人攀墙，攀上去的不到一半，墙上的灯却灭了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGS.171.a:"把话说给雨林人听"
 SUM_Neo_SGS.171.b:"把话说给沙漠人听"
