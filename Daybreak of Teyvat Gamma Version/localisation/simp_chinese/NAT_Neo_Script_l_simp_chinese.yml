 NAT_Flower_Petition_Idea:"分宗陈情花羽会"
 NAT_Flower_Petition_Idea_desc:"花羽会高塔上，鹰主将一封羽书交与青羽龙，附耳数语。龙振翅盘旋三匝，越飞越高，直上云头。塔下之人仰颈看，飞羽遮半边日头。有族人问：「焱庭接得住此羽书么？」鹰主按腰间羽冠，眯眼望云里黑点，曰：「落地便算数，接不接由他。」那龙飞至焱庭宫城之上，双爪一松，羽书飘然落下，正落一面石鼓上。守门兵拾起羽书，展开一看，纸角犹沾一片真羽。捧书往里飞跑，石鼓为风一拂，嗡地自鸣一声，鼓面那片羽毛犹在轻轻打转。"
