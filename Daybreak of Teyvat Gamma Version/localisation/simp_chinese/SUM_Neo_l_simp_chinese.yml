 SUM_SGS_RA_Keeper_desc:"看园的人不穿军装，手里有刀。抢圣所的没有一个有好下场。"
 SUM_Neo_SGS.84.t:"看园人"
 SUM_Neo_SGS.84.d:"看园的人不穿军装，手里有刀。抢圣所的没有一个有好下场。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
