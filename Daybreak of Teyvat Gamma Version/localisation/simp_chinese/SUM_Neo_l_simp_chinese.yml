 SUM_Neo.119.t:"六派共和"
 SUM_Neo.119.d:"六大学派地位平等，须弥的学问不再由一派说了算。高塔投下的影子越来越长，傍晚时就盖住了半条街。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。教令院的门槛这几天被踩得很低，进去的人比出来的人多。"
