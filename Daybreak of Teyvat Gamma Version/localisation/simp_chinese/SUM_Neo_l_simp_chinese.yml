 SUM_SGS_WAR_Keep_Post_desc:"哨所易手便改成自己的戍所，门朝哪边开由沙丘定。"
 SUM_Neo_SGS.172.t:"据哨而守"
 SUM_Neo_SGS.172.d:"哨所易手便改成自己的戍所，门朝哪边开由沙丘定。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
