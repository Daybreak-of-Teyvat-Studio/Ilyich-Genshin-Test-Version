 SUM_Neo_SGS.89.b:"把利润收归官库"
 SUM_SGS_RA_Light_Commonwealth:"灵光之邦"
 SUM_SGS_RA_Light_Commonwealth_desc:"沙丘腰带把圣显厅外的沙地当成了议事场，人定事，花灵在旁。愿由人许，代价由人担，花灵只替他们记住每一句说过的话。"
 SUM_Neo_SGS.90.t:"灵光之邦"
 SUM_Neo_SGS.90.d:"沙丘腰带把圣显厅外的沙地当成了议事场，人定事，花灵在旁。愿由人许，代价由人担，花灵只替他们记住每一句说过的话。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
