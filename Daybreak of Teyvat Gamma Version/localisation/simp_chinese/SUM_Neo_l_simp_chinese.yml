 SUM_Neo.27.t:"圣树加冕"
 SUM_Neo.27.d:"净善宫的门被推开。被囚五百年的小吉祥草王走出囚笼，须弥的天空第一次为她亮起。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。"
 SUM_Neo.27.a:"让神谕通行"
 SUM_Neo.27.b:"收束信仰的边界"
 SUM_Neo.28.t:"开启净善宫"
 SUM_Neo.28.d:"守门的卫士接到命令，把净善宫的门打开。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。"
 SUM_Neo.28.a:"以草神之名行事"
 SUM_Neo.28.b:"以律条为先"
 SUM_Neo.29.t:"解下神的锁链"
 SUM_Neo.29.d:"锁链落地。小吉祥草王第一次走出囚室。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。高塔投下的影子越来越长，傍晚时就盖住了半条街。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。"
 SUM_Neo.29.a:"让梦回到须弥"
 SUM_Neo.29.b:"先看住封印"
 SUM_Neo.30.t:"草神的冠冕"
 SUM_Neo.30.d:"学者为草神戴上冠冕，不再以看守的身份。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。"
 SUM_Neo.30.a:"让神谕通行"
 SUM_Neo.30.b:"收束信仰的边界"
 SUM_Neo.31.t:"神前议政"
 SUM_Neo.31.d:"草神临朝，六大学派首座在她面前汇报。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。"
