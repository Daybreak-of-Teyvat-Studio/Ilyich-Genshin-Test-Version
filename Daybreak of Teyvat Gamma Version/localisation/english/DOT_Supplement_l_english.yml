 SPR_military_disloyalty:0 "Military Disloyalty"
 SPR_military_disloyalty_desc:0 "The failed 'Sanjurjada' military coup attempt in 1932 still casts it shadow over the Spanish military to this day. In the aftermath, various disloyal military commanders, among them the coup's leader José Sanjurjo, fled to exile in Portugal and continue their plotting even now.\n\nEven this failure has not discouraged disloyal officers, however, as even within Spain itself many desire to see a return to a Monarchy, or even a strong Fascist dictatorship. Too strong meddling by the government in the internal affairs of the military may well spark yet another uprising; far more violent and bloody than the last."
 SPR_military_disloyalty_tt:0 "§RCannot train units, disband units, or edit unit templates.§!\n"
 SPR_national_strikes:0 "National Strikes"
 SPR_national_strikes_desc:0 "The country finds itself seemingly in the grips of the starting stages of a workers' revolution; strike upon strike paralyze the industry and daily life as workers demand less work and more pay, and poor tenant farmers increasingly appropriate farmland while the government turns a blind eye."
