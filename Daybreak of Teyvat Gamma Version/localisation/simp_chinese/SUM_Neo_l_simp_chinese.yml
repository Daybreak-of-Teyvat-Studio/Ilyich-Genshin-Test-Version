 SUM_Neo.320.t:"木材与香料"
 SUM_Neo.320.d:"木材与香料成了须弥的两条腿。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。"
 SUM_Neo.320.a:"以武力压服"
 SUM_Neo.320.b:"以德政感召"
 SUM_Neo.321.t:"工艺复兴"
 SUM_Neo.321.d:"旧工艺被重新捡起来，匠人有了名分。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。"
 SUM_Neo.321.a:"先立威"
 SUM_Neo.321.b:"先立信"
 SUM_Neo.322.t:"宏伟工程"
 SUM_Neo.322.d:"须弥要在雨林与沙漠之间修一座桥。高塔投下的影子越来越长，傍晚时就盖住了半条街。教令院的门槛这几天被踩得很低，进去的人比出来的人多。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。"
 SUM_Neo.322.a:"由教令院决断"
 SUM_Neo.322.b:"交由地方自理"
 SUM_Neo.323.t:"须弥的遗产"
 SUM_Neo.323.d:"须弥把自己的过去收进典籍，留给后来的人。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。教令院的门槛这几天被踩得很低，进去的人比出来的人多。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
 SUM_Neo.323.a:"以武力压服"
 SUM_Neo.323.b:"以德政感召"
 SUM_Neo.324.t:"沙与林的和解"
 SUM_Neo.324.d:"雨林与沙漠在同一条律法下生活。须弥的城与旷野之间，第一次不用刀剑说话。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。"
 SUM_Neo.324.a:"先立威"
 SUM_Neo.324.b:"先立信"

 #################### 决议 ####################
 SUM_Neo_Akademiya:"教令院与学派"
 SUM_Neo_Akademiya_desc:"这里集中了教令院平时的政务与六大学派的改革事务。推进学派改革、清理学阀旧弊、开放档案与整顿学风，都能一步一步抬高学院在国家政治里的分量，也会牵动学院机制的走向。每完成一项，机制便向前推进一格，请在经营学院与照看其他事务之间自行安排先后，免得顾此失彼。"
 SUM_Neo_Desert:"沙漠与镀金"
 SUM_Neo_Desert_desc:"沙漠事务的决议组，涵盖沙海各部的往来、商路与边境事宜。处理绿洲的水权、游牧部族的归属以及沙海商队的通关，都会影响须弥对沙漠地区的掌控。把这里的决议一件件办妥，日后与沙漠三国打交道时便能多几分主动，也多几分回旋的余地。"
 SUM_Neo_Oracle:"神谕与梦境"
 SUM_Neo_Oracle_desc:"神谕决议组围绕须弥的神谕机制展开。通过占卜、解读与回应民众的祈愿，你可以推动神谕指数起伏，从而改变国家当前所处的等级修正。每一档修正各有侧重，或利于稳定，或利于进取，请按你希望须弥走向的方向挑选相应的举措。"
 SUM_Neo_War:"军备与外交"
 SUM_Neo_War_desc:"战争决议组负责战时的动员与对外用兵。征募、军工、战线支援与外交施压都归在这里，能在局势紧张时为国家争取时间与空间。战争期间的每一项决议都要消耗资源与时间，请优先处理最紧要的方向，避免处处铺开却处处吃紧。"
 SUM_Neo_Wonder:"奇观修缮"
 SUM_Neo_Wonder_desc:"奇观决议组用于兴建须弥的标志性工程。从净善宫到各处圣所，每一座奇观都能为国家带来长久的好处，也会占去相当的人力与物力。决定先建哪一座，等于决定让须弥以何种面貌示人，也等于决定资源该投向哪一方面的声望。"
 SUM_Neo_Genesis:"造神与禁忌"
 SUM_Neo_Genesis_desc:"创世决议组处理须弥根本理念的抉择。是延续既有的教令与神谕，还是另辟新路，都会在这里逐步显现。这里的每一项选择都会牵动国家机制的根本走向，一旦选定便很难回头，请谨慎对待，避免中途反复改弦。落子之前不妨多想一想，也为将来留出转圜的余地。"
 SUM_Neo_Crisis:"危机应对"
 SUM_Neo_Crisis_desc:"危机决议组用于应对突如其来的变故。无论是教令内部的动荡、沙漠方向的压力，还是民间对信仰的质疑，都会在这里得到处置。及时完成相应决议，可以避免危机一点点累积成难以收拾的局面，也能为后续的调整留出余地。免得临到关头再手忙脚乱，白白折损实力。"
 SUM_Neo_Mechanism:"机制状态"
 SUM_Neo_Mechanism_desc:"机制状态只读面板。这里按当前神谕与学院两条轴的数值，显示须弥此刻所处的等级以及该档生效的国家修正。面板中的条目无法点击，只用于随时查看机制进度，帮助你在推进国策与决议之前判断当前形势，做到心中有数。免得因为看错了等级而错失良机。"
