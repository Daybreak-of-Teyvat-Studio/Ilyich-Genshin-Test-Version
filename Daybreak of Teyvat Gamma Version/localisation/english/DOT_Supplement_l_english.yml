# ===== 须弥国策树 =====
 SUM_PRO_Dawn_of_Sabzeruz:0 "The Bell of Sabzeruz"
 SUM_PRO_Dawn_of_Sabzeruz_desc:0 "The bell of the Sabzeruz Festival rings over Sumeru City. Beneath the towers of the Akademiya the crowd and the scholars stand apart, and nobody says the thing everyone knows: the Dendro Archon is still locked in the Sanctuary of Surasthana. BY 荷花酥"
 SUM_PRO_Aka_Shadow:0 "The Grand Sage's Shadow"
 SUM_PRO_Aka_Shadow_desc:0 "Grand Sage Azar decides Sumeru's course alone in the council hall. The heads of the Six Darshans merely sit and listen."
 SUM_PRO_For_Tighnari:0 "The Forest Ranger's Report"
 SUM_PRO_For_Tighnari_desc:0 "Forest Ranger Tighnari submits his report: the Withering is spreading along the lowlands of Pardis Dhyai."
 SUM_PRO_For_Collei:0 "The Forgotten Illness"
 SUM_PRO_For_Collei_desc:0 "Collei's Eleazar is brought up again, and nobody wants to admit it has anything to do with forbidden knowledge."
 SUM_PRO_Des_Aaru:0 "Lamps of Aaru Village"
 SUM_PRO_Des_Aaru_desc:0 "The lamps of Aaru Village light Candace's spear. The village guards hold back the Akademiya's tax collectors for the desert."
 SUM_PRO_Ak_Knowledge:0 "The Price of Knowledge"
 SUM_PRO_Ak_Knowledge_desc:0 "Knowledge has a price tag, and a scholar's seniority is worth more than his learning."
 SUM_PRO_Gen_Project:0 "The God-Making Project"
 SUM_PRO_Gen_Project_desc:0 "The Akademiya begins the god-making project, to build a new god out of a puppet's body and replace the imprisoned Dendro Archon."
 SUM_PRO_Gen_Puppet:0 "The Puppet's Body"
 SUM_PRO_Gen_Puppet_desc:0 "The Balladeer's body is carried into the Akademiya's basement, where machinery and divinity are stitched together."
 SUM_PRO_Gen_Fatui:0 "Visitors in the Laboratory"
 SUM_PRO_Gen_Fatui_desc:0 "Fatui envoys come and go from the laboratory, and the Akademiya pretends not to see them."
 SUM_PRO_Fat_Dottore:0 "Dottore's Proposal"
 SUM_PRO_Fat_Dottore_desc:0 "Dottore proposes using Sumeru's scholars and resources to finish his experiment."
 SUM_PRO_Fat_Factory:0 "Factories in the Desert"
 SUM_PRO_Fat_Factory_desc:0 "Fatui factories rise in the heart of the desert, their chimneys smoking day and night."
 SUM_PRO_Ere_Revolt:0 "Rumours of Revolt"
 SUM_PRO_Ere_Revolt_desc:0 "Rumours of revolt travel between the dunes, and the Eremites begin to gather."
 SUM_PRO_Ara_Vana:0 "The World of Dreams"
 SUM_PRO_Ara_Vana_desc:0 "The Aranara spread the world of dreams before the forest ranger, and the shadow of Greater Lord Rukkhadevata still lingers there."
 SUM_PRO_The_Choice:0 "The Choice of the Road"
 SUM_PRO_The_Choice_desc:0 "Three roads lie before Sumeru: bring the god back, hand power to the scholars and the desert folk, or finish the god-making project."
 SUM_ST_Crown_of_the_Sacred_Tree:0 "Coronation of the Sacred Tree"
 SUM_ST_Crown_of_the_Sacred_Tree_desc:0 "The doors of the Sanctuary of Surasthana are pushed open. Lesser Lord Kusanali, imprisoned for five hundred years, walks out of her cage, and for the first time the sky of Sumeru brightens for her."
 SUM_ST_Sanctuary_Crown:0 "The Dendro Archon's Crown"
 SUM_ST_Sanctuary_Crown_desc:0 "The scholars place the crown on the Dendro Archon's head, no longer as her jailers."
 SUM_ST_Sanctuary_Pilgrim:0 "The Pilgrim Road"
 SUM_ST_Sanctuary_Pilgrim_desc:0 "A long line of pilgrims forms on the mountain road to the Sanctuary of Surasthana."
 SUM_ST_Sanctuary_Temple:0 "Rebuilding the Temple"
 SUM_ST_Sanctuary_Temple_desc:0 "The abandoned temple is raised again, and the craftsmen work through the night."
 SUM_ST_Sanctuary_Law:0 "Code of Theocracy"
 SUM_ST_Sanctuary_Law_desc:0 "The code of theocracy is proclaimed, and law is administered in the Dendro Archon's name."
 SUM_ST_Sanctuary_Throne:0 "Coronation on the Throne"
 SUM_ST_Sanctuary_Throne_desc:0 "Lesser Lord Kusanali is crowned in the Sanctuary of Surasthana. Sumeru bows to its own god for the first time."
 SUM_ST_Dream_Night:0 "Long Night and Dream"
 SUM_ST_Dream_Night_desc:0 "Through the long night, dreams return to every pillow."
 SUM_ST_Dream_Dance:0 "Dance of the Flower God"
 SUM_ST_Dream_Dance_desc:0 "The Dance of the Flower God is staged anew, with dancers chosen from both the rainforest and the desert."
 SUM_ST_Dream_School:0 "The School of Dreams"
 SUM_ST_Dream_School_desc:0 "Painters of Kshahrewar and astronomers of Spantamad open a discipline of dreams together."
 SUM_ST_Dream_Truth:0 "Truth in a Dream"
 SUM_ST_Dream_Truth_desc:0 "In a dream the Dendro Archon shows the scholars the memory that was painted over on Irminsul."
 SUM_ST_Ara_Vana:0 "Dreams of Vimara Village"
 SUM_ST_Ara_Vana_desc:0 "The children of Vimara Village hear the Aranara again."
 SUM_ST_Ara_Flower:0 "The Nara Blossom"
 SUM_ST_Ara_Flower_desc:0 "The Nara blossom opens at the edge of the rainforest, and the Aranara call it a token of promise."
 SUM_ST_Ara_World:0 "The World of Dreams"
 SUM_ST_Ara_World_desc:0 "The Dendro Archon and the Aranara guard the world of dreams together, and Sumeru's dreaming has a border at last."
 SUM_ST_Ara_Blessing:0 "Blessing of the Aranara"
 SUM_ST_Ara_Blessing_desc:0 "The blessing of the Aranara falls on every tree in Sumeru."
 SUM_ST_Tree_Rukkhadevata:0 "Legacy of Greater Lord Rukkhadevata"
 SUM_ST_Tree_Rukkhadevata_desc:0 "Greater Lord Rukkhadevata left little behind: a painted-over mark, and a name no one remembers."
 SUM_ST_Tree_Recall:0 "Calling Back the Old Name"
 SUM_ST_Tree_Recall_desc:0 "She tries to write her own name back into Irminsul, and the brush stops in mid-air."
 SUM_ST_Tree_Scroll:0 "Scrolls Beneath the Tree"
 SUM_ST_Tree_Scroll_desc:0 "The scrolls buried under Irminsul are dug out, filled with writing no one can read."
 SUM_ST_Tree_Truth:0 "The Truth of the Tree"
 SUM_ST_Tree_Truth_desc:0 "The people of Sumeru learn at last that their Dendro Archon is not the first."
 SUM_ST_Rain_Patrol:0 "Rainforest Patrol"
 SUM_ST_Rain_Patrol_desc:0 "The forest rangers patrol the paths that run like leaf veins."
 SUM_ST_Rain_Poison:0 "Clearing the Withering"
 SUM_ST_Rain_Poison_desc:0 "The Withering is cleared zone by zone, and the plants grow back."
 SUM_ST_Rain_Mushroom:0 "Fungal Research"
 SUM_ST_Rain_Mushroom_desc:0 "Amurta turns the study of fungi into a serious discipline."
 SUM_ST_Rain_Forest:0 "The Whole Rainforest"
 SUM_ST_Rain_Forest_desc:0 "The whole rainforest passes into the keeping of the forest rangers."
 SUM_ST_Seal_Reject:0 "Sealing the Forbidden Books"
 SUM_ST_Seal_Reject_desc:0 "The forbidden books are sealed in a stone chamber, and the key is given to the Dendro Archon."
 SUM_ST_Seal_Purge:0 "Purging Dark Arts"
 SUM_ST_Seal_Purge_desc:0 "Forest rangers and the verdant guard clear out the nests of those who practise forbidden arts in private."
 SUM_ST_Seal_Sand:0 "Sealing the Wenut"
 SUM_ST_Seal_Sand_desc:0 "The Wenut sleeping under the desert are sealed again."
 SUM_ST_Seal_Eternal:0 "The Eternal Seal"
 SUM_ST_Seal_Eternal_desc:0 "The seal is set, and a whole rainforest now stands between Sumeru and the forbidden."
 SUM_ST_The_Crowned_God:0 "The Age of the Verdant Crown"
 SUM_ST_The_Crowned_God_desc:0 "Lesser Lord Kusanali is crowned in the Sanctuary of Surasthana. Rainforest and desert bow to one name at last, and Sumeru enters the age of the verdant crown."
 SUM_RP_Republic_of_Scholars:0 "Republic of Scholars"
 SUM_RP_Republic_of_Scholars_desc:0 "The Grand Sage's council hall is pushed open. Scholars, merchants and desert village guards walk in together and demand a new law for Sumeru."
 SUM_RP_Dar_Spantamad:0 "Haravatat's Laboratory"
 SUM_RP_Dar_Spantamad_desc:0 "Haravatat's laboratory opens to the public, and its findings are no longer locked in a back room."
 SUM_RP_Dar_Kshahrewar:0 "Kshahrewar's Blueprints"
 SUM_RP_Dar_Kshahrewar_desc:0 "Kshahrewar brings out its blueprints and says Sumeru's houses should be built to the measure of a person."
 SUM_RP_Dar_Exam:0 "Scholarly Examination"
 SUM_RP_Dar_Exam_desc:0 "Promotion is decided by examination, and birth no longer counts."
 SUM_RP_Dar_Academy:0 "Republic of the Six Darshans"
 SUM_RP_Dar_Academy_desc:0 "The Six Darshans stand equal, and no single school dictates Sumeru's learning."
 SUM_RP_Par_Vote:0 "The First Vote"
 SUM_RP_Par_Vote_desc:0 "Sumeru decides its affairs by vote for the first time."
 SUM_RP_Par_Court:0 "An Independent Court"
 SUM_RP_Par_Court_desc:0 "The court is independent of the Akademiya, and sages stand trial like anyone else."
 SUM_RP_Par_Budget:0 "Budget Review"
 SUM_RP_Par_Budget_desc:0 "Every coin out of the treasury passes the assembly."
 SUM_RP_Par_Constitution:0 "Promulgating the Constitution"
 SUM_RP_Par_Constitution_desc:0 "The constitution is proclaimed. The Dendro Archon's name is written in the last article, as a witness."
 SUM_RP_Com_Mint:0 "The Right of Coinage"
 SUM_RP_Com_Mint_desc:0 "The right of coinage returns to the assembly, and private coin is exchanged back."
 SUM_RP_Com_Trade:0 "Trade with the Seven Nations"
 SUM_RP_Com_Trade_desc:0 "Sumeru signs trade terms with its neighbours, and spice and coffee find new outlets."
 SUM_RP_Com_Plantation:0 "Spice Plantations"
 SUM_RP_Com_Plantation_desc:0 "Spice plantations spread, and even the desert's edge is planted."
 SUM_RP_Com_Rail:0 "The Sand Sea Railway"
 SUM_RP_Com_Rail_desc:0 "The railway runs into the desert, and the balance between caravans and Eremites grows delicate."
 SUM_RP_Kno_Archive:0 "The Library of Ten Thousand Scrolls"
 SUM_RP_Kno_Archive_desc:0 "The Akademiya's sealed rooms are opened, and the library opens to all."
 SUM_RP_Kno_Women:0 "A Seat for Women Scholars"
 SUM_RP_Kno_Women_desc:0 "Women scholars take seats in the assembly, and the old rules of the schools loosen."
 SUM_RP_Kno_Ruin:0 "Ruin Scholarship"
 SUM_RP_Kno_Ruin_desc:0 "The study of ruins becomes a prominent discipline, and the walls of the Scarlet King's age are measured stone by stone."
 SUM_RP_Kno_All:0 "Knowledge Belongs to All"
 SUM_RP_Kno_All_desc:0 "Sumeru declares that knowledge belongs to all."
 SUM_RP_Kno_Enlighten:0 "The Age of Enlightenment"
 SUM_RP_Kno_Enlighten_desc:0 "Scholars walk out of the towers and into the markets and oases."
 SUM_RP_Cit_Rights:0 "Citizenship for the Desert Folk"
 SUM_RP_Cit_Rights_desc:0 "The desert folk receive citizenship, and tax collectors no longer walk into oases as they please."
 SUM_RP_Cit_Oasis:0 "Oasis Settlement"
 SUM_RP_Cit_Oasis_desc:0 "The oasis settlement plan begins, and the desert folk have land of their own."
 SUM_RP_Cit_Gold:0 "Naturalising the Eremites"
 SUM_RP_Cit_Gold_desc:0 "The Eremites may choose to naturalise, keeping their banners and formations."
 SUM_RP_Cit_Union:0 "Sumeru United"
 SUM_RP_Cit_Union_desc:0 "Blood and forest become one Sumeru."
 SUM_RP_Edu_Militia:0 "The Militia System"
 SUM_RP_Edu_Militia_desc:0 "The militia system spreads, and rainforest and desert each hold their own ground."
 SUM_RP_Edu_Fort:0 "Border Fortresses"
 SUM_RP_Edu_Fort_desc:0 "Fortresses line the border between Sumeru and its neighbours."
 SUM_RP_Edu_Tactic:0 "Desert Warfare"
 SUM_RP_Edu_Tactic_desc:0 "Officers write desert guerrilla tactics into the drill manual."
 SUM_RP_Edu_Army:0 "The New Army"
 SUM_RP_Edu_Army_desc:0 "Sumeru has a new army. It is the republic's last insurance."
 SUM_RP_The_Republic_Standing:0 "The Republic Stands"
 SUM_RP_The_Republic_Standing_desc:0 "On the day the constitution takes effect, scholars, merchants, hunters and village guards stand together before the council hall. Sumeru is a republic."
 SUM_RP_The_Gilded_Commune:0 "The Gilded Commune"
 SUM_RP_The_Gilded_Commune_desc:0 "The Eremites and the desert folk pull down the last tower of the Akademiya. For the first time Sumeru's wealth stays in Sumeru's hands."
 SUM_GT_Throne_of_Genesis:0 "Throne of Genesis"
 SUM_GT_Throne_of_Genesis_desc:0 "Beneath the Akademiya, the puppet's body is joined to a Gnosis. Sumeru means to make a god by human hands, to rule Sumeru for them."
 SUM_GT_Gen_Resume:0 "Restarting the God-Making"
 SUM_GT_Gen_Resume_desc:0 "The Grand Sage orders the god-making project restarted, and the files are carried out of the sealed room."
 SUM_GT_Gen_Shell:0 "The Puppet's Shell"
 SUM_GT_Gen_Shell_desc:0 "The puppet's body is reassembled, its joints fitted with parts from the Scarlet King's age."
 SUM_GT_Gen_Core:0 "The Gnosis"
 SUM_GT_Gen_Core_desc:0 "A Gnosis is set into the puppet's chest."
 SUM_GT_Gen_Test:0 "The Testing Ground"
 SUM_GT_Gen_Test_desc:0 "The tests are carried out under the dunes, and the list of subjects is sealed."
 SUM_GT_Gen_Divinity:0 "Infusing Divinity"
 SUM_GT_Gen_Divinity_desc:0 "Divinity is poured in little by little, and the puppet's fingers begin to move."
 SUM_GT_Gen_Knowledge:0 "The Flood of Knowledge"
 SUM_GT_Gen_Knowledge_desc:0 "The Akasha Terminal pours all knowledge into the puppet, and the first sentence it learns is Sumeru."
 SUM_GT_Gen_Mechanic:0 "The Machine God"
 SUM_GT_Gen_Mechanic_desc:0 "The puppet stands up. It looks more like a god than any sage."
 SUM_GT_Gen_Perfect:0 "The Perfect Puppet"
 SUM_GT_Gen_Perfect_desc:0 "The puppet's body is tuned to perfection, and the Akademiya refuses to admit it is only a machine."
 SUM_GT_Gen_Ritual:0 "The Rite of Descent"
 SUM_GT_Gen_Ritual_desc:0 "The rite of descent is held before the Sanctuary of Surasthana, with all Six Darshans present."
 SUM_GT_Gen_Awaken:0 "The New God Opens Its Eyes"
 SUM_GT_Gen_Awaken_desc:0 "The new god opens its eyes. The first thing it sees is the sages kneeling."
 SUM_GT_Gen_Name:0 "Naming the New God"
 SUM_GT_Gen_Name_desc:0 "The sages name the new god, and the name holds both the Scarlet King and the Akademiya."
 SUM_GT_Gen_Enthrone:0 "Enthroning the God"
 SUM_GT_Gen_Enthrone_desc:0 "The new god is enthroned, and the old god of the Sanctuary of Surasthana is moved to a side hall."
 SUM_GT_Gen_Complete:0 "God-Making Complete"
 SUM_GT_Gen_Complete_desc:0 "God-making is complete. Sumeru has a god that can be ordered about."
 SUM_GT_Des_Memory:0 "Memory of the Scarlet King"
 SUM_GT_Des_Memory_desc:0 "The sages dig out the memory of the Scarlet King and call it Sumeru's older pride."
 SUM_GT_Des_Pillar:0 "Hypostyle Desert"
 SUM_GT_Des_Pillar_desc:0 "The old columns of the Hypostyle Desert are raised again, carved over with new hymns."
 SUM_GT_Des_City:0 "Gurabad Restored"
 SUM_GT_Des_City_desc:0 "Walls rise again on the ruins of Gurabad."
 SUM_GT_Des_Cult:0 "Followers of the Scarlet King"
 SUM_GT_Des_Cult_desc:0 "The followers of the Scarlet King are taken in and become the new god's first priests."
 SUM_GT_Des_Gold:0 "The Dream of Gold"
 SUM_GT_Des_Gold_desc:0 "The dream of the golden age is told to the people of Sumeru again."
 SUM_GT_Des_Remnant:0 "Remnants"
 SUM_GT_Des_Remnant_desc:0 "The remnants deep in the desert are taken for oracles."
 SUM_GT_Des_Echo:0 "Echoes of the Desert"
 SUM_GT_Des_Echo_desc:0 "The echo travels between the dunes, saying the Scarlet King is coming back."
 SUM_GT_Des_Oasis:0 "The Eternal Oasis"
 SUM_GT_Des_Oasis_desc:0 "The mirage of the eternal oasis hangs above the sand sea."
 SUM_GT_Des_King:0 "King of the Sands"
 SUM_GT_Des_King_desc:0 "The new god calls itself heir to the King of the Sands."
 SUM_GT_Des_Legion:0 "The Scarlet Legion"
 SUM_GT_Des_Legion_desc:0 "The Scarlet Legion is formed, its ranks filled mostly with desert mercenaries."
 SUM_GT_Des_Wrath:0 "The Day of Judgement"
 SUM_GT_Des_Wrath_desc:0 "The day of judgement is set, and the Akademiya begins to settle old scores."
 SUM_GT_Des_Revive:0 "The Scarlet King Returns"
 SUM_GT_Des_Revive_desc:0 "The sages proclaim the return of the Scarlet King, dwelling in the puppet god."
 SUM_GT_Des_Throne:0 "The Desert Throne"
 SUM_GT_Des_Throne_desc:0 "The desert throne is raised in Gurabad, and Sumeru's old god is forgotten."
 SUM_GT_Dot_Visit:0 "Dottore's Visit"
 SUM_GT_Dot_Visit_desc:0 "Dottore comes to Sumeru City in person, and the Akademiya receives him with courtesy."
 SUM_GT_Dot_Deal:0 "The Pact with the Fatui"
 SUM_GT_Dot_Deal_desc:0 "Sumeru signs a pact with Snezhnaya, its terms written in the margins."
 SUM_GT_Dot_Lab:0 "The Underground Laboratory"
 SUM_GT_Dot_Lab_desc:0 "The underground laboratory is enlarged, reaching the caverns beneath the dunes."
 SUM_GT_Dot_Subject:0 "Test Subjects"
 SUM_GT_Dot_Subject_desc:0 "The roll of test subjects grows longer, most of them exiled desert folk."
 SUM_GT_Dot_Wisdom:0 "The Trade in Knowledge"
 SUM_GT_Dot_Wisdom_desc:0 "Knowledge is traded, and the Akademiya gets machine blueprints in return."
 SUM_GT_Dot_Machine:0 "Machine Creations"
 SUM_GT_Dot_Machine_desc:0 "Machine creations come off the line, and the first batch goes straight to the barracks."
 SUM_GT_Dot_Factory:0 "Mass Production"
 SUM_GT_Dot_Factory_desc:0 "The factories run day and night, and the sky of Sumeru turns grey."
 SUM_GT_Dot_Weapon:0 "Puppet Weapons"
 SUM_GT_Dot_Weapon_desc:0 "Puppet weapons enter service, and soldiers begin to fear their own comrades."
 SUM_GT_Dot_Clone:0 "Slices"
 SUM_GT_Dot_Clone_desc:0 "Dottore's slices walk about Sumeru, and no one can tell which one is him."
 SUM_GT_Dot_Blasphemy:0 "Blasphemous Works"
 SUM_GT_Dot_Blasphemy_desc:0 "Sumeru's scholars begin to build things that do not belong to this world."
 SUM_GT_Dot_Alliance:0 "The Snezhnayan Alliance"
 SUM_GT_Dot_Alliance_desc:0 "Sumeru allies with Snezhnaya, and its desert becomes a Snezhnayan outpost."
 SUM_GT_Dot_Master:0 "Mastering the Forbidden"
 SUM_GT_Dot_Master_desc:0 "The Akademiya believes it has mastered the forbidden, and locks it in a cabinet."
 SUM_GT_Dot_Supreme:0 "Beside a God"
 SUM_GT_Dot_Supreme_desc:0 "Sumeru's god sits at Snezhnaya's table, shoulder to shoulder with the Second."
 SUM_GT_Mac_Ruin:0 "Excavating the Ruins"
 SUM_GT_Mac_Ruin_desc:0 "The ruins are excavated systematically, and the Scarlet King's machines come out one by one."
 SUM_GT_Mac_Atlas:0 "Mechanical Atlas"
 SUM_GT_Mac_Atlas_desc:0 "Kshahrewar draws the unearthed machines into an atlas."
 SUM_GT_Mac_Ameta:0 "The Amita Core"
 SUM_GT_Mac_Ameta_desc:0 "The Amita machine core is reproduced and becomes the new god's frame."
 SUM_GT_Mac_Energy:0 "Energy Modules"
 SUM_GT_Mac_Energy_desc:0 "Energy modules enter mass production, and the workshops of Sumeru hang with lamps."
 SUM_GT_Mac_Remelt:0 "The Art of Remelting"
 SUM_GT_Mac_Remelt_desc:0 "The art of remelting is recovered, and discarded mechanisms can be made again."
 SUM_GT_Mac_Tablet:0 "The Remelting Tablets"
 SUM_GT_Mac_Tablet_desc:0 "The remelting tablets are pieced together, holding a whole lost craft."
 SUM_GT_Mac_Khaj:0 "The Key of Khaj-Nisut"
 SUM_GT_Mac_Khaj_desc:0 "The Key of Khaj-Nisut is found, and it opens a door that should have stayed shut."
 SUM_GT_Mac_Factory:0 "Machine Factories"
 SUM_GT_Mac_Factory_desc:0 "The machine factories open, and craftsmen are replaced by gears."
 SUM_GT_Mac_Army:0 "The Automatic Legion"
 SUM_GT_Mac_Army_desc:0 "The automatic legion forms up. It needs no pay and knows nothing of surrender."
 SUM_GT_Mac_Golem:0 "Stone Colossi"
 SUM_GT_Mac_Golem_desc:0 "The stone statues of the Scarlet King are woken and walk at the head of the column."
 SUM_GT_Mac_Sky:0 "The Floating City"
 SUM_GT_Mac_Sky_desc:0 "The blueprints of the floating city are restored, and Sumeru means to build a city in the sky."
 SUM_GT_Mac_Core:0 "The Central Core"
 SUM_GT_Mac_Core_desc:0 "The central core is completed, and all Sumeru is run by machines."
 SUM_GT_Mac_Age:0 "The Machine Age"
 SUM_GT_Mac_Age_desc:0 "Sumeru enters the machine age. People are the least precise part of the machine."
 SUM_GT_Aby_Whisper:0 "Whispers of the Abyss"
 SUM_GT_Aby_Whisper_desc:0 "The Abyss speaks through Irminsul, saying it is willing to help Sumeru make a god."
 SUM_GT_Aby_Pact:0 "A Bargain with the Abyss"
 SUM_GT_Aby_Pact_desc:0 "The Akademiya bargains with the Abyss in secret, and gets what god-making requires."
 SUM_GT_Aby_Knowledge:0 "Forbidden Knowledge"
 SUM_GT_Aby_Knowledge_desc:0 "The forbidden knowledge the Scarlet King once touched is taken out again."
 SUM_GT_Aby_Corrupt:0 "Corrosion"
 SUM_GT_Aby_Corrupt_desc:0 "The rainforest begins to corrode, and the Withering spreads."
 SUM_GT_Aby_Monster:0 "Beasts"
 SUM_GT_Aby_Monster_desc:0 "Beasts wake deep in the desert, and the trade roads are cut."
 SUM_GT_Aby_Nail:0 "The Nail of Judgement"
 SUM_GT_Aby_Nail_desc:0 "One of the nails of judgement is pulled out, and the ground where it fell splits open."
 SUM_GT_Aby_Void:0 "The Gate of the Void"
 SUM_GT_Aby_Void_desc:0 "The gate of the void opens under the dunes, and wind blows out from behind it."
 SUM_GT_Aby_Sandworm:0 "The Wenut Awaken"
 SUM_GT_Aby_Sandworm_desc:0 "The Wenut that slept awaken, and the Hypostyle Desert becomes their hunting ground."
 SUM_GT_Aby_Fallen:0 "Fallen Scholars"
 SUM_GT_Aby_Fallen_desc:0 "Scholars are swallowed by forbidden knowledge, and the Akademiya strikes them from the rolls."
 SUM_GT_Aby_Rite:0 "The Forbidden Rite"
 SUM_GT_Aby_Rite_desc:0 "The forbidden rite is completed before the new god, and the nights of Sumeru grow longer."
 SUM_GT_Aby_Legion:0 "The Abyssal Legion"
 SUM_GT_Aby_Legion_desc:0 "Things of the Abyss are formed into a legion and fight for Sumeru."
 SUM_GT_Aby_Black:0 "The Power of Darkness"
 SUM_GT_Aby_Black_desc:0 "The power of darkness is poured into the new god's body, and the god stops obeying."
 SUM_GT_Aby_Abyss:0 "Embracing the Abyss"
 SUM_GT_Aby_Abyss_desc:0 "Sumeru admits that what it holds is no longer something it can control."
 SUM_GT_Iro_Censor:0 "The Edict of Forbidden Books"
 SUM_GT_Iro_Censor_desc:0 "The edict of forbidden books extends to rainforest herbs and desert songs."
 SUM_GT_Iro_Purge:0 "Purging Dissent"
 SUM_GT_Iro_Purge_desc:0 "Scholars who oppose the god-making project are purged, and only one voice remains in the schools."
 SUM_GT_Iro_Church:0 "The Akademiya as State Religion"
 SUM_GT_Iro_Church_desc:0 "The Akademiya is made the state religion, and the shrine of the Dendro Archon is turned into a schoolroom."
 SUM_GT_Iro_Total:0 "Total Rule"
 SUM_GT_Iro_Total_desc:0 "The Akademiya holds every thread in Sumeru."
 SUM_GT_The_Throne_of_Gods:0 "The Throne of Gods"
 SUM_GT_The_Throne_of_Gods_desc:0 "The puppet god sits on the throne and the Akademiya stands behind it. Sumeru has a god that can be ordered, and an academy that gives the orders."
 SUM_GT_Eternal_Regency:0 "The Akademiya's Eternal Regency"
 SUM_GT_Eternal_Regency_desc:0 "The god is made, and no one will let it rule. The Akademiya declares a regency in the god's name, and rules on and on."
 SUM_PL_Sands_and_Crowns:0 "Sands and Leaves"
 SUM_PL_Sands_and_Crowns_desc:0 "The Akademiya's edicts are posted on rainforest trees and desert walls alike. The cities and the wilds of Sumeru must live under one law."
 SUM_PL_Int_Autonomy:0 "Desert Autonomy"
 SUM_PL_Int_Autonomy_desc:0 "The village guards receive their charter of autonomy."
 SUM_PL_Int_Garrison:0 "Garrisons"
 SUM_PL_Int_Garrison_desc:0 "The Akademiya garrisons the edge of the oases, and the caravans fall quiet."
 SUM_PL_Int_Final:0 "All Sumeru"
 SUM_PL_Int_Final_desc:0 "All Sumeru is gathered into a single atlas."
 SUM_PL_Ere_Officer:0 "Officers from the Ranks"
 SUM_PL_Ere_Officer_desc:0 "Mercenaries who have seen war are sent to school, and come out as officers."
 SUM_PL_Ere_Legion:0 "The Gilded Legion"
 SUM_PL_Ere_Legion_desc:0 "The Gilded Legion is formed, its banner bearing both Sumeru and its own crest."
 SUM_PL_Ere_Banner:0 "The Banner of Gold Sand"
 SUM_PL_Ere_Banner_desc:0 "The banner of gold sand is raised, and the Eremites stand with Sumeru's army."
 SUM_PL_Arm_Ranger:0 "Rainforest Rangers"
 SUM_PL_Arm_Ranger_desc:0 "The rangers are picked from the forest patrol, and none walk a forest better than they do."
 SUM_PL_Arm_Air:0 "The Sumeru Air Force"
 SUM_PL_Arm_Air_desc:0 "The Sumeru Air Force is founded, its pilots chosen from the astronomers of Spantamad."
 SUM_PL_Arm_Modern:0 "The Modern Army"
 SUM_PL_Arm_Modern_desc:0 "Sumeru's army takes shape. It is made of hunters, mercenaries, scholars and desert folk."
 SUM_PL_Nav_Fleet:0 "The Sumeru Fleet"
 SUM_PL_Nav_Fleet_desc:0 "The Sumeru Fleet is formed, and its colours fly from the masts of Port Ormos."
 SUM_PL_Nav_Customs:0 "Customs"
 SUM_PL_Nav_Customs_desc:0 "Customs houses go up, and smuggling ships begin to steer around them."
 SUM_PL_Nav_Sea:0 "Maritime Sumeru"
 SUM_PL_Nav_Sea_desc:0 "Sumeru's ships leave Port Ormos and sail for the ports of the seven nations."
 SUM_PL_Dip_Natlan:0 "The Natlan Border"
 SUM_PL_Dip_Natlan_desc:0 "Natlan's tribes and Sumeru face each other at the sand gate, and neither will step back first."
 SUM_PL_Dip_Mond:0 "Mondstadt Caravans"
 SUM_PL_Dip_Mond_desc:0 "Mondstadt's caravans bring windmills and wine."
 SUM_PL_Dip_Voice:0 "The Voice of Sumeru"
 SUM_PL_Dip_Voice_desc:0 "Sumeru's voice begins to be heard at the councils of the seven nations."
 SUM_PL_Won_Ormos:0 "The Flagship of Ormos"
 SUM_PL_Won_Ormos_desc:0 "Outside Port Ormos, the flagship's masts are raised again."
 SUM_PL_Won_Wood:0 "Timber and Spice"
 SUM_PL_Won_Wood_desc:0 "Timber and spice become Sumeru's two legs."
 SUM_PL_Won_Legacy:0 "The Legacy of Sumeru"
 SUM_PL_Won_Legacy_desc:0 "Sumeru gathers its past into books and leaves it for those who come after."
 SUM_PL_The_Sands_and_the_Leaves:0 "The Reconciliation of Sands and Leaves"
 SUM_PL_The_Sands_and_the_Leaves_desc:0 "Rainforest and desert live under one law. Between Sumeru's cities and its wilds, words are used instead of blades for the first time."
 SUM_PRO_Aka_Six_Darshan:0 "Seats of the Six Darshans"
 SUM_PRO_Aka_Six_Darshan_desc:0 "Amurta, Rtawahist, Haravatat, Spantamad, Vahumana and Kshahrewar each hold their own designs. The quarrel over seating is a quarrel over power."
 SUM_PRO_Aka_Censor:0 "The Censor's Edict"
 SUM_PRO_Aka_Censor_desc:0 "The Akademiya issues a ban on forbidden texts. Every file touching the Scarlet King, forbidden knowledge or the memory of Irminsul is sealed away."
 SUM_PRO_For_Gandharva:0 "The Lowlands of Gandharva"
 SUM_PRO_For_Gandharva_desc:0 "The hunters of Gandharva Ville organize themselves to guard the rainforest border on the Akademiya's behalf."
 SUM_PRO_Des_Morning_Wind:0 "Morning Wind on the Sand Sea"
 SUM_PRO_Des_Morning_Wind_desc:0 "Morning wind sweeps the Hypostyle Desert while caravans follow the old roads left by the Scarlet King."
 SUM_PRO_Des_Eremites:0 "Banners of the Eremites"
 SUM_PRO_Des_Eremites_desc:0 "Eremite banners rise and fall among the dunes. Their contracts answer to Mora alone, never to the Akademiya."
 SUM_PRO_Ak_Terminal:0 "Akasha Terminals"
 SUM_PRO_Ak_Terminal_desc:0 "The Akasha hands knowledge to everyone, and takes away everyone's dreams."
 SUM_PRO_Ak_Dream:0 "Dreams Taken Away"
 SUM_PRO_Ak_Dream_desc:0 "The people of Sumeru no longer dream. The Akademiya calls it progress. The Aranara call it disaster."
 SUM_PRO_Fat_Second:0 "An Invitation from the Second Seat"
 SUM_PRO_Fat_Second_desc:0 "An invitation from the Second Seat reaches the Grand Sage's desk. Courteous in wording, ruthless in terms."
 SUM_PRO_Ere_Blood:0 "The Law of Blood"
 SUM_PRO_Ere_Blood_desc:0 "The Eremites keep the law of blood. Lineage is bound to the land, and the memory of famine is written in their bones."
 SUM_PRO_Ere_Mercenary:0 "Mercenary Contracts"
 SUM_PRO_Ere_Mercenary_desc:0 "Mercenaries escort goods for the Akademiya, and weapons for the tribes of the desert."
 SUM_PRO_Ara_Song:0 "Song of the Aranara"
 SUM_PRO_Ara_Song_desc:0 "The Aranara sing deep in the rainforest. Only children can hear them."
 SUM_PRO_Ara_Rana:0 "Rana's Disappearance"
 SUM_PRO_Ara_Rana_desc:0 "The forest ranger Rana has vanished. They say she followed the Aranara into the world of dreams."
 SUM_ST_Sanctuary_Open:0 "Opening the Sanctuary"
 SUM_ST_Sanctuary_Open_desc:0 "The guards at the gate receive the order. The doors of the Sanctuary of Surasthana open."
 SUM_ST_Sanctuary_Free:0 "Breaking the God's Chains"
 SUM_ST_Sanctuary_Free_desc:0 "The chains fall. For the first time, the Lesser Lord Kusanali walks out of her cell."
 SUM_ST_Sanctuary_Court:0 "Council Before the God"
 SUM_ST_Sanctuary_Court_desc:0 "The Dendro Archon holds court, and the heads of the six Darshans report before her."
 SUM_ST_Sanctuary_Monastery:0 "Clergy of the Sanctuary"
 SUM_ST_Sanctuary_Monastery_desc:0 "The Sanctuary restores its old rites, and the monks recite the ancient liturgies once more."
 SUM_ST_Sanctuary_Shrine:0 "Shrines of the Dendro Archon"
 SUM_ST_Sanctuary_Shrine_desc:0 "Shrines to the Dendro Archon rise across rainforest and desert alike."
 SUM_ST_Sanctuary_Reform:0 "Reform by Oracle"
 SUM_ST_Sanctuary_Reform_desc:0 "The Dendro Archon issues new edicts, abolishing the old clauses the Akademiya abused for so long."
 SUM_ST_Sanctuary_Doctrine:0 "Doctrine of Theocracy"
 SUM_ST_Sanctuary_Doctrine_desc:0 "The doctrine of theocracy is set to writing. The Archon's judgment stands above every scholarly dispute."
 SUM_ST_Sanctuary_Clergy:0 "Investiture of the Clergy"
 SUM_ST_Sanctuary_Clergy_desc:0 "The Archon invests new clergy, half of them born in the rainforest and half in the desert."
 SUM_ST_Dream_Gate:0 "Gate of Dreams"
 SUM_ST_Dream_Gate_desc:0 "With the Akasha shut down, the people of Sumeru begin to dream again."
 SUM_ST_Dream_Sabzeruz:0 "Sabzeruz Restored"
 SUM_ST_Dream_Sabzeruz_desc:0 "The Sabzeruz Festival returns as a national rite, no longer merely a performance by scholars."
 SUM_ST_Dream_Mushroom:0 "Dream Mushrooms"
 SUM_ST_Dream_Mushroom_desc:0 "Mushrooms in the rainforest grow fat on the breath of dreams and become a new medicine."
 SUM_ST_Dream_Theater:0 "Theater of Dreams"
 SUM_ST_Dream_Theater_desc:0 "Nilou plays the Goddess of Flowers on stage. The audience holds scholars, and sandfolk with shaven heads."
 SUM_ST_Dream_Song:0 "Ballads of the Aranara"
 SUM_ST_Dream_Song_desc:0 "The ballads of the Aranara are written down and entered into the archives of Sumeru."
 SUM_ST_Dream_Record:0 "Records of Dreams"
 SUM_ST_Dream_Record_desc:0 "Scholars begin recording every dream as research material."
 SUM_ST_Dream_Heal:0 "Healing by Dreams"
 SUM_ST_Dream_Heal_desc:0 "Physicians use dreams to soothe the old wounds left by war and famine."
 SUM_ST_Dream_Memory:0 "The Taste of Memory"
 SUM_ST_Dream_Memory_desc:0 "The people of the oasis set old memories on the table and share them with travelers."
 SUM_ST_Dream_Eternal:0 "The Eternal Dream"
 SUM_ST_Dream_Eternal_desc:0 "Sumeru enters a long dream. In it there is no famine, and no forgetting."
 SUM_ST_Ara_Meet:0 "Meeting the Aranara"
 SUM_ST_Ara_Meet_desc:0 "The Archon herself leads the scholars into the rainforest to meet the Aranara."
 SUM_ST_Ara_Hymn:0 "Hymns of the Aranara"
 SUM_ST_Ara_Hymn_desc:0 "The hymns of the Aranara are translated into the script of Sumeru and passed down."
 SUM_ST_Ara_Rana:0 "Rana's Return"
 SUM_ST_Ara_Rana_desc:0 "The lost Rana returns to her village, carrying the seed entrusted to her by the Aranara."
 SUM_ST_Ara_Seed:0 "The Aranara's Seed"
 SUM_ST_Ara_Seed_desc:0 "The withered seed is buried in Gandharva Ville, waiting to sprout again."
 SUM_ST_Ara_Kusava:0 "Kurikara Grass"
 SUM_ST_Ara_Kusava_desc:0 "Kurikara grass is harvested as medicine for those eroded by forbidden knowledge."
 SUM_ST_Ara_Kalpalata:0 "Kalpalata Lotus"
 SUM_ST_Ara_Kalpalata_desc:0 "The Kalpalata lotus opens only in the deepest dream. The Aranara offer it to the Archon."
 SUM_ST_Ara_King:0 "King of the Aranara"
 SUM_ST_Ara_King_desc:0 "The Aranara choose a new king to speak for all of them."
 SUM_ST_Ara_Alliance:0 "Aranara Alliance"
 SUM_ST_Ara_Alliance_desc:0 "The Aranara and Sumeru swear an alliance to guard the roots of the rainforest."
 SUM_ST_Ara_Covenant:0 "Covenant of the Green Shade"
 SUM_ST_Ara_Covenant_desc:0 "The Covenant of the Green Shade is sworn: the forests the Aranara keep shall never be felled by Sumeru."
 SUM_ST_Tree_Root:0 "Roots of Irminsul"
 SUM_ST_Tree_Root_desc:0 "The roots of Irminsul run beneath all of Sumeru. The Archon calls them the veins of memory."
 SUM_ST_Tree_Dream:0 "The Dream of Irminsul"
 SUM_ST_Tree_Dream_desc:0 "Irminsul dreams too, and in its dream the Greater Lord Rukkhadevata still lives."
 SUM_ST_Tree_Irminsul:0 "Whispers of Irminsul"
 SUM_ST_Tree_Irminsul_desc:0 "Irminsul whispers of the forgetting that happened five hundred years ago."
 SUM_ST_Tree_Memory:0 "Memory Erased"
 SUM_ST_Tree_Memory_desc:0 "The Archon remembers a name, writes it down, and then erases it with her own hand."
 SUM_ST_Tree_Wither:0 "The Withering Branch"
 SUM_ST_Tree_Wither_desc:0 "One branch of Irminsul is withering, and the scholars cannot find why."
 SUM_ST_Tree_New:0 "A New White Branch"
 SUM_ST_Tree_New_desc:0 "Beside the dead branch grows a new white one. The Archon says Sumeru grew it by itself."
 SUM_ST_Tree_Sage:0 "Wisdom of the Tree King"
 SUM_ST_Tree_Sage_desc:0 "The wisdom of the Tree King is compiled into volumes, the common root of every school in Sumeru."
 SUM_ST_Tree_Light:0 "Light of Purification"
 SUM_ST_Tree_Light_desc:0 "Light of purification pours into the cracks of Irminsul, and the Withering retreats."
 SUM_ST_Tree_Eternal:0 "The Evergreen Sacred Tree"
 SUM_ST_Tree_Eternal_desc:0 "Irminsul stays evergreen. Beneath its roots lie the shared memories of two Dendro Archons, old and new."
 SUM_ST_Rain_Watch:0 "Rainforest Watch"
 SUM_ST_Rain_Watch_desc:0 "The ranger corps is expanded. For the first time the rainforest border has a standing watch."
 SUM_ST_Rain_Ranger:0 "Forest Rangers Expanded"
 SUM_ST_Rain_Ranger_desc:0 "Tighnari becomes head of the rangers, and most of his people are hunters raised in the rainforest."
 SUM_ST_Rain_Gandharva:0 "The Gandharva Line"
 SUM_ST_Rain_Gandharva_desc:0 "Gandharva Ville raises a line of defense, holding the Withering outside the forest."
 SUM_ST_Rain_Village:0 "Village Defense League"
 SUM_ST_Rain_Village_desc:0 "The villages of the rainforest form a league and keep watch for one another."
 SUM_ST_Rain_Beast:0 "Beasts of the Forest"
 SUM_ST_Rain_Beast_desc:0 "The great beasts of the rainforest have a home again, and no longer raid the villages."
 SUM_ST_Rain_Medicine:0 "Rainforest Herbs"
 SUM_ST_Rain_Medicine_desc:0 "Rainforest herbs are gathered in an organized way, and physicians are no longer left without medicine."
 SUM_ST_Rain_Conserve:0 "Logging Ban"
 SUM_ST_Rain_Conserve_desc:0 "The logging ban is issued, and the axes are taken back."
 SUM_ST_Rain_Guard:0 "Emerald Guard"
 SUM_ST_Rain_Guard_desc:0 "The Emerald Guard is raised, charged solely with the defense of the rainforest and the sacred tree."
 SUM_ST_Rain_Forever:0 "Evergreen Forever"
 SUM_ST_Rain_Forever_desc:0 "The rainforest returns to what it was before the scholars came."
 SUM_ST_Seal_Whisper:0 "Whispers of Forbidden Knowledge"
 SUM_ST_Seal_Whisper_desc:0 "Forbidden knowledge mutters inside the sealed files."
 SUM_ST_Seal_Study:0 "Temptation of the Forbidden"
 SUM_ST_Seal_Study_desc:0 "A scholar cannot resist opening the banned volume."
 SUM_ST_Seal_Net:0 "Warding Barrier"
 SUM_ST_Seal_Net_desc:0 "The Archon sets a barrier around Irminsul."
 SUM_ST_Seal_Corrupt:0 "Corrupted Scholar"
 SUM_ST_Seal_Corrupt_desc:0 "A scholar is eroded, and Sumeru must take stock of its own library."
 SUM_ST_Seal_Nail:0 "The Divine Nail"
 SUM_ST_Seal_Nail_desc:0 "The Divine Nail left from the Scarlet King's age is measured anew by the scholars."
 SUM_ST_Seal_Nib:0 "Shadow of Nibelung"
 SUM_ST_Seal_Nib_desc:0 "A power from beyond the world turns over in the crack, and the sky of Sumeru darkens for an instant."
 SUM_ST_Seal_Abyss:0 "Rejecting the Abyss"
 SUM_ST_Seal_Abyss_desc:0 "The Archon rejects the voices from beyond the world."
 SUM_ST_Seal_Oath:0 "Oathkeepers"
 SUM_ST_Seal_Oath_desc:0 "The Oathkeepers swear to hold the seal with their lives."
 SUM_ST_Seal_Final:0 "Sealing Complete"
 SUM_ST_Seal_Final_desc:0 "The seal is complete. Irminsul falls quiet, and the Archon can finally sleep."
 SUM_RP_Dar_Amurta:0 "Amurta's Petition"
 SUM_RP_Dar_Amurta_desc:0 "Amurta submits a petition to return research rights in the rainforest to the rangers."
 SUM_RP_Dar_Rtawahist:0 "Rtawahist's Astronomy"
 SUM_RP_Dar_Rtawahist_desc:0 "Rtawahist lays out its star-gazing accounts, and the accounts look worse than the star charts."
 SUM_RP_Dar_Haravatat:0 "Spantamad's Archives"
 SUM_RP_Dar_Haravatat_desc:0 "Spantamad sorts its archives and recatalogs the fragments left under the ban."
 SUM_RP_Dar_Vahumana:0 "Vahumana's Questioning"
 SUM_RP_Dar_Vahumana_desc:0 "Vahumana begins to ask where the Grand Sage's authority comes from."
 SUM_RP_Dar_Reform:0 "Deposing the Grand Sage"
 SUM_RP_Dar_Reform_desc:0 "The Grand Sage is asked to leave the council chamber. No one speaks for him as he walks out."
 SUM_RP_Dar_Election:0 "Election by the Darshans"
 SUM_RP_Dar_Election_desc:0 "The six Darshans elect a new head, and the votes are made public."
 SUM_RP_Dar_Publish:0 "Free Journals"
 SUM_RP_Dar_Publish_desc:0 "Journals may publish freely, and even wrong ideas can be printed."
 SUM_RP_Dar_Patent:0 "Patents and Prizes"
 SUM_RP_Dar_Patent_desc:0 "Inventors may claim patents, and learning begins to earn its keep."
 SUM_RP_Dar_Council:0 "Council of Darshans"
 SUM_RP_Dar_Council_desc:0 "The Council of Darshans becomes the highest scholarly body in Sumeru."
 SUM_RP_Par_Charter:0 "Drafting a Charter"
 SUM_RP_Par_Charter_desc:0 "The charter is drafted. Its first article reads: Sumeru belongs to no single scholar."
 SUM_RP_Par_Assembly:0 "Scholars' Assembly"
 SUM_RP_Par_Assembly_desc:0 "The Scholars' Assembly opens, with seats given to rainforest, desert and city alike."
 SUM_RP_Par_Press:0 "Free Press"
 SUM_RP_Par_Press_desc:0 "Newspapers appear, and those who debate the state may now sign their names."
 SUM_RP_Par_Party:0 "Associations and Parties"
 SUM_RP_Par_Party_desc:0 "Parties form outside the Darshans, and Sumeru's politics branch for the first time."
 SUM_RP_Par_Police:0 "Constabulary"
 SUM_RP_Par_Police_desc:0 "The constabulary is founded. The rangers keep to the rainforest and no longer police people."
 SUM_RP_Par_Census:0 "Census"
 SUM_RP_Par_Census_desc:0 "Sumeru counts its own people for the first time."
 SUM_RP_Par_Local:0 "Local Autonomy"
 SUM_RP_Par_Local_desc:0 "Cities and desert gain self-rule, and the Akademiya keeps only the common law."
 SUM_RP_Par_School:0 "Public Schools"
 SUM_RP_Par_School_desc:0 "Public schools reach the villages, and literacy is no longer a luxury of the rich."
 SUM_RP_Par_Republic:0 "Republic of Scholars"
 SUM_RP_Par_Republic_desc:0 "Sumeru becomes a republic. Power flows from scholars, merchants, hunters, and those who keep the oases."
 SUM_RP_Com_Treasury:0 "The Treasury"
 SUM_RP_Com_Treasury_desc:0 "The treasury is audited anew, and the money the Grand Sage moved turns out to be more than anyone imagined."
 SUM_RP_Com_Tax:0 "Tax Reform"
 SUM_RP_Com_Tax_desc:0 "Taxation is rebuilt around land and headcount, and the desert is no longer taxed double."
 SUM_RP_Com_Caravan:0 "Caravan Charters"
 SUM_RP_Com_Caravan_desc:0 "Caravans receive passage charters, and goods begin to move between rainforest and desert."
 SUM_RP_Com_Port:0 "Port Ormos Opened"
 SUM_RP_Com_Port_desc:0 "Port Ormos opens to all seven nations, and Sumeru opens to foreign merchants for the first time."
 SUM_RP_Com_Bank:0 "Bank of Sumeru"
 SUM_RP_Com_Bank_desc:0 "The Bank of Sumeru opens, and scholars may borrow to fund their research."
 SUM_RP_Com_Guild:0 "Merchants' Union"
 SUM_RP_Com_Guild_desc:0 "The merchant guilds unite to carry Sumeru's goods to the seven nations."
 SUM_RP_Com_Coffee:0 "Coffee and Sugar"
 SUM_RP_Com_Coffee_desc:0 "Coffee and sugar become the new calling card of Sumeru."
 SUM_RP_Com_Industry:0 "Light Industry"
 SUM_RP_Com_Industry_desc:0 "Silk reeling and weaving take root in Sumeru, and workshops spill into the outskirts."
 SUM_RP_Com_Prosperity:0 "A Land of Plenty"
 SUM_RP_Com_Prosperity_desc:0 "Sumeru's granaries fill, and the memory of famine fades for the first time."
 SUM_RP_Kno_Terminal:0 "Akasha Opened"
 SUM_RP_Kno_Terminal_desc:0 "The Akasha is no longer the Akademiya's alone. Every city may connect."
 SUM_RP_Kno_Data:0 "Knowledge as Commons"
 SUM_RP_Kno_Data_desc:0 "Knowledge is declared common property, no longer rationed by seniority."
 SUM_RP_Kno_Print:0 "Movable Type and Bookshops"
 SUM_RP_Kno_Print_desc:0 "Movable type spreads, and book prices fall until even apprentices can afford them."
 SUM_RP_Kno_School:0 "Commoners' Schools"
 SUM_RP_Kno_School_desc:0 "Commoners' schools open in the villages of the desert."
 SUM_RP_Kno_Desert:0 "Lectures in the Desert"
 SUM_RP_Kno_Desert_desc:0 "Scholars walk into the desert to lecture. Their students include mercenaries and hunters."
 SUM_RP_Kno_Research:0 "Freedom of Research"
 SUM_RP_Kno_Research_desc:0 "Research no longer needs a permit from the Akademiya."
 SUM_RP_Kno_Language:0 "Literacy Spread"
 SUM_RP_Kno_Language_desc:0 "The script of Sumeru reaches every village gate."
 SUM_RP_Kno_Truth:0 "Truth Unbound"
 SUM_RP_Kno_Truth_desc:0 "The ban is repealed. Truth is allowed on paper."
 SUM_RP_Cit_Village:0 "Desert Villages"
 SUM_RP_Cit_Village_desc:0 "The villages of the desert are written into the atlas of Sumeru for the first time."
 SUM_RP_Cit_Tribe:0 "Tribes Registered"
 SUM_RP_Cit_Tribe_desc:0 "The tribal rolls are drawn up, and the law of blood is recognized by Sumeru."
 SUM_RP_Cit_School:0 "Sand Sea School"
 SUM_RP_Cit_School_desc:0 "The Sand Sea School opens, teaching the script of Sumeru and the management of water."
 SUM_RP_Cit_Water:0 "Oasis Irrigation"
 SUM_RP_Cit_Water_desc:0 "The canals of the oasis are dredged anew, and fields spread beyond the village."
 SUM_RP_Cit_Caravan:0 "Shared Trade Routes"
 SUM_RP_Cit_Caravan_desc:0 "The trade roads are held jointly by Sumeru and the tribes, and no single side sets the toll."
 SUM_RP_Cit_Amnesty:0 "Amnesty for the Exiled"
 SUM_RP_Cit_Amnesty_desc:0 "Desert folk exiled by the Akademiya are pardoned and return to their villages."
 SUM_RP_Cit_Chief:0 "Tribal Council"
 SUM_RP_Cit_Chief_desc:0 "The chiefs of every tribe enter the council of Sumeru."
 SUM_RP_Cit_Equal:0 "Equality of Forest and Desert"
 SUM_RP_Cit_Equal_desc:0 "Rainforest and desert stand equal before the law."
 SUM_RP_Cit_Commonwealth:0 "Desert Commonwealth"
 SUM_RP_Cit_Commonwealth_desc:0 "The oases join into one body, and the desert is no longer the margin of Sumeru."
 SUM_RP_Edu_Border:0 "Frontier Schools"
 SUM_RP_Edu_Border_desc:0 "Frontier schools are built beside the forts, and soldiers learn to read as well."
 SUM_RP_Edu_Desert:0 "Desert Patrol"
 SUM_RP_Edu_Desert_desc:0 "The desert patrol is formed, and the trade roads gain a standing guard."
 SUM_RP_Edu_Officer:0 "Officers' Academy"
 SUM_RP_Edu_Officer_desc:0 "The officers' academy begins instruction, and command no longer depends on birth."
 SUM_RP_Edu_Corps:0 "Standing Legion"
 SUM_RP_Edu_Corps_desc:0 "The standing legion is raised, and Sumeru has an army of its own for the first time."
 SUM_RP_Edu_Recon:0 "Scouts and Surveyors"
 SUM_RP_Edu_Recon_desc:0 "Scouts map the whole of Sumeru onto a single chart."
 SUM_RP_Edu_Supply:0 "Supply Depots"
 SUM_RP_Edu_Supply_desc:0 "Supply depots spread along the railways and the waterways."
 SUM_RP_Edu_Drill:0 "Unified Drill"
 SUM_RP_Edu_Drill_desc:0 "The drill manual is unified, and the passwords carry to the farthest outpost."
 SUM_RP_Edu_Tech:0 "Imported Arms"
 SUM_RP_Edu_Tech_desc:0 "Arms are imported from abroad, and Sumeru begins to copy them."
 SUM_RP_Edu_Shield:0 "Shield of Sumeru"
 SUM_RP_Edu_Shield_desc:0 "The Shield of Sumeru stands between rainforest and desert, holding off foreign enemies for the republic."
 SUM_GT_Iro_Decrees:0 "Decrees of the Grand Sage"
 SUM_GT_Iro_Decrees_desc:0 "The Grand Sage's decrees no longer pass through the council chamber."
 SUM_GT_Iro_Secret:0 "Secret Police"
 SUM_GT_Iro_Secret_desc:0 "The secret police is founded, and names vanish from the newspapers one by one."
 SUM_GT_Iro_Akasha:0 "Akasha Surveillance"
 SUM_GT_Iro_Akasha_desc:0 "The Akasha begins reporting back. It records every word everyone says."
 SUM_GT_Iro_Mobilize:0 "Total Mobilization"
 SUM_GT_Iro_Mobilize_desc:0 "Total mobilization is decreed, and rainforest and desert alike are conscripted."
 SUM_GT_Iro_Propaganda:0 "Akademiya Propaganda"
 SUM_GT_Iro_Propaganda_desc:0 "Akademiya propaganda covers the walls, declaring that Sumeru has never been stronger."
 SUM_GT_Iro_School:0 "Ideological Examinations"
 SUM_GT_Iro_School_desc:0 "Students are promoted by ideology first and learning second."
 SUM_GT_Iro_Army:0 "Party Legion"
 SUM_GT_Iro_Army_desc:0 "A legion answering directly to the Akademiya is formed, loyal only to the sages."
 SUM_GT_Iro_Fear:0 "Rule by Fear"
 SUM_GT_Iro_Fear_desc:0 "Sumeru rules by fear. No one dares to dream anymore."
 SUM_GT_Iro_Eternal:0 "The Eternal Akademiya"
 SUM_GT_Iro_Eternal_desc:0 "The Akademiya declares that its rule shall last as long as Sumeru itself."
 SUM_PL_Int_Puppet:0 "Governor's Office"
 SUM_PL_Int_Puppet_desc:0 "The Akademiya sets up a governor's office in the desert, and decrees for four puppet states issue from it."
 SUM_PL_Int_Integrate:0 "Annexing Hadramaveth"
 SUM_PL_Int_Integrate_desc:0 "Hadramaveth is folded into the provinces of Sumeru."
 SUM_PL_Int_Border:0 "Drawing Borders"
 SUM_PL_Int_Border_desc:0 "The borders of trade roads and oases are drawn clear."
 SUM_PL_Int_Tax:0 "Desert Taxation"
 SUM_PL_Int_Tax_desc:0 "Desert taxes are assessed by harvest rather than by head."
 SUM_PL_Int_Road:0 "Sand Sea Post Road"
 SUM_PL_Int_Road_desc:0 "The post road runs from Sumeru City to the Hypostyle Desert."
 SUM_PL_Int_Union:0 "One Sumeru"
 SUM_PL_Int_Union_desc:0 "Rainforest and desert merge into a single Sumeru."
 SUM_PL_Ere_Contract:0 "The Gilded Contract"
 SUM_PL_Ere_Contract_desc:0 "The Akademiya and the Eremites sign a new contract, with terms written finer than before."
 SUM_PL_Ere_Nationalize:0 "Nationalizing the Eremites"
 SUM_PL_Ere_Nationalize_desc:0 "The Eremites are folded into the ranks of Sumeru."
 SUM_PL_Ere_Weapon:0 "Sand Sea Armaments"
 SUM_PL_Ere_Weapon_desc:0 "The armories of the sand sea open, and their edges cut truer than Akademiya blueprints."
 SUM_PL_Ere_Scout:0 "Desert Scouts"
 SUM_PL_Ere_Scout_desc:0 "Desert scouts watch every pass that borders a neighbor on Sumeru's behalf."
 SUM_PL_Ere_Pay:0 "Soldier's Pay"
 SUM_PL_Ere_Pay_desc:0 "Pay is issued on time, and for the first time mercenaries need not live by plunder."
 SUM_PL_Ere_Loyal:0 "Eremite Loyalty"
 SUM_PL_Ere_Loyal_desc:0 "The Eremites swear loyalty to Sumeru, on condition that Sumeru knows their blood."
 SUM_PL_Arm_Draft:0 "Conscription Order"
 SUM_PL_Arm_Draft_desc:0 "Conscription is decreed, and rainforest and desert each supply men by population."
 SUM_PL_Arm_Training:0 "Drill"
 SUM_PL_Arm_Training_desc:0 "Training grounds are built on the outskirts, and the orders never stop day or night."
 SUM_PL_Arm_Artillery:0 "Ballistae and Cannons"
 SUM_PL_Arm_Artillery_desc:0 "Ballistae stand beside cannons. Two generations of Sumeru's weapons serve at once."
 SUM_PL_Arm_Tank:0 "Desert Armor"
 SUM_PL_Arm_Tank_desc:0 "Armored cars run on the sand, and for the first time the Akademiya has vehicles that cross the dunes."
 SUM_PL_Arm_Industry:0 "Arsenal"
 SUM_PL_Arm_Industry_desc:0 "The arsenal opens, and Sumeru's rifles no longer come wholly from abroad."
 SUM_PL_Arm_Staff:0 "General Staff"
 SUM_PL_Arm_Staff_desc:0 "The general staff is founded, and operations no longer answer to a sage's whim."
 SUM_PL_Nav_Port:0 "Port Ormos"
 SUM_PL_Nav_Port_desc:0 "Port Ormos is expanded, and its berths run past the lighthouse."
 SUM_PL_Nav_Dock:0 "Drydock"
 SUM_PL_Nav_Dock_desc:0 "The drydock opens, and Sumeru builds its own ships for the first time."
 SUM_PL_Nav_Gun:0 "Big Ships, Big Guns"
 SUM_PL_Nav_Gun_desc:0 "The fleet takes the big-gun path, with calibers larger than its neighbors'."
 SUM_PL_Nav_Trade:0 "Sea Trade"
 SUM_PL_Nav_Trade_desc:0 "Sea trade begins, and spice and porcelain leave Port Ormos by water."
 SUM_PL_Nav_Whale:0 "Peril of the Whale"
 SUM_PL_Nav_Whale_desc:0 "A great whale of the far sea sinks a merchant ship, and the Akademiya sends men to look."
 SUM_PL_Nav_Admiral:0 "Naval Academy"
 SUM_PL_Nav_Admiral_desc:0 "The naval academy opens in the harbor, teaching wind and stars."
 SUM_PL_Dip_Liyue:0 "Envoy from Liyue"
 SUM_PL_Dip_Liyue_desc:0 "An envoy from Liyue arrives to discuss ore veins and trade roads."
 SUM_PL_Dip_Inazuma:0 "Trade with Inazuma"
 SUM_PL_Dip_Inazuma_desc:0 "Inazuman merchant ships dock at Port Ormos, bringing blades and silk."
 SUM_PL_Dip_Fontaine:0 "Fontainian Technology"
 SUM_PL_Dip_Fontaine_desc:0 "Fontainian engineers bring blueprints for machinery."
 SUM_PL_Dip_Snezhnaya:0 "The Snezhnayan Shadow"
 SUM_PL_Dip_Snezhnaya_desc:0 "There is something else in the Snezhnayan caravan. The Akademiya inspects it three times."
 SUM_PL_Dip_League:0 "Seven Nations Academic League"
 SUM_PL_Dip_League_desc:0 "Sumeru proposes a seven-nation academic league, so that scholars may visit one another."
 SUM_PL_Dip_Aid:0 "Foreign Aid"
 SUM_PL_Dip_Aid_desc:0 "Sumeru sends grain and medicine to the disaster-struck people of neighboring lands."
 SUM_PL_Won_Surasthana:0 "Restoring the Sanctuary"
 SUM_PL_Won_Surasthana_desc:0 "The Sanctuary of Surasthana has gone long unrepaired. Skilled craftsmen take up the work."
 SUM_PL_Won_Alcazarzaray:0 "Alcazarzaray"
 SUM_PL_Won_Alcazarzaray_desc:0 "Kaveh's Alcazarzaray resumes construction, and this time no creditor comes knocking."
 SUM_PL_Won_Industry:0 "Industrialization"
 SUM_PL_Won_Industry_desc:0 "Chimneys multiply across Sumeru, and scholars begin calculating whether the coal will last."
 SUM_PL_Won_Mine:0 "Desert Ore Veins"
 SUM_PL_Won_Mine_desc:0 "The ore veins of the desert are opened, and Sumeru has iron of its own."
 SUM_PL_Won_Craft:0 "Craft Revival"
 SUM_PL_Won_Craft_desc:0 "Old crafts are taken up again, and artisans gain standing."
 SUM_PL_Won_Great:0 "The Great Project"
 SUM_PL_Won_Great_desc:0 "Sumeru will build a bridge between the rainforest and the desert."

