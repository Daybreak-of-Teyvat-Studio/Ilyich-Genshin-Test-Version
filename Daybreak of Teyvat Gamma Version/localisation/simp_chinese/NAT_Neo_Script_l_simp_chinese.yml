#内战决议
 NAT_fascism_on_the_rise:"刑鼎思潮兴"
 NAT_fascism_on_the_rise_desc:"纳塔的世道起了变化，刑鼎之说渐渐成了主流，讲的人越来越多，也想把六族都拢到自己旗下。这套道理讲究以重典立威、凭铁腕定纷，恰合了如今人心思定的光景。通往刑鼎的路，大门已敞开，摆在面前的只有两条：是敲钟击鼓、循着礼法慢慢改过去，还是聚起烈火、以雷霆之势一把烧过去。铸匠们已在炉边分了帮，一方要照旧例慢慢锻，一方要添足燃素一把烧红。走哪条路，纳塔往后的日子，便大不一样。"
 prepare_for_fascist_civil_war:"厉兵备战"
 prepare_for_fascist_civil_war_desc:"民意像火山灰里的火苗，要等它自己旺起来，只怕深渊先压到了门口。为了纳塔，也顾不得许多了，即便有人要在这番动荡里折了性命，也得果断下手。公投是慢慢讲理，内战却是拿刀说话，锻炉、栈道、部族兵马都要遭一回大罪。可这一场打完，往后要推行甚么，就再没人敢说个不字。"
 expand_civil_fascism_support:"蛊惑民意"
 expand_civil_fascism_support_desc:"焱庭的威信一天天往下掉，四处的不安稳像晒干的火榴秆，正好点火。越是这般光景，越要把六族百姓拉到自己这一边，让他们长久地拥护，还敢站出来当众顶撞焱庭。说到底，这些催着换天下之法，比起按部就班地换火主，是有些不上台面。可谁掌火谁说了算，等火起来了，谁还记得那些讲究。"
 army_support_for_fascist_civil_war:"扩军逞强"
 army_support_for_fascist_civil_war_desc:"枪杆子握在谁手里，仗就替谁打。没有军心向着我们，任凭说得天花乱坠，真到了刀兵相见的那天，也是一场空。所以头一桩要紧事，是把六族兵马拢得铁桶一般，从带兵的到扛枪的，人人都要对我们死心塌地。军心稳了，这盘棋才下得动。"
 army_support_TT: "每次军队支持度的提升都会给你的阵营在内战中带来10%的兵力加成，最多可达到70%。\n"
 ensure_general_loyalty_for_fascist_civil_war:"固偏将忠"
 ensure_general_loyalty_for_fascist_civil_war_desc:"有些带六族兵马的将官，私下亦颇赞许刑鼎那套道理，只是碍着颜面不肯明说。这等人物，正该早些拉拢，许以好处，结以情义，令他们在火起那日站到我们这边来。将官之心一稳，手里部族兵也就跟着稳了。"
 ensure_marshal_loyalty_for_fascist_civil_war:"固元帅忠"
 ensure_marshal_loyalty_for_fascist_civil_war_desc:"几位统兵的部族元帅，也有人暗里认同刑鼎的主张。此辈位高权重，一句话能定一部族兵马的趋向，万万轻忽不得。须得早早去结交，去劝说，把他们心里那点动摇，化作实在的效忠。待开战之日，元帅们肯点头，大局便定了大半。"
 siphon_equipment_stockpiles_for_fascist_civil_war:"私调军储"
 siphon_equipment_stockpiles_for_fascist_civil_war_desc:"焱庭的武库里堆着刀枪，其中不少，将来都用得上。趁着无人留意，一点一点把它们挪出来、藏起来，不惊动任何人。积少成多，等真要动手的那天，这批器械便是我们的本钱。做这事得稳，手一抖，便全盘皆输。"
 formulate_surprise_attack_plan_for_fascist_civil_war:"阴谋突袭"
 formulate_surprise_attack_plan_for_fascist_civil_war_desc:"对面尚不知祸事将落到头上，照旧在营里吃喝议事。这份蒙在鼓里的糊涂，恰是我们最该护住的。消息半点不能走漏，筹划得越秘，猛然发难那日占的便宜便越大。要在敌人还没回过神时，一把掐住他咽喉。"
 formulate_surprise_attack_plan_for_civil_war_tt: "奇袭计划会给予所有在核心领土作战的陆军师25%的攻击加成，持续30日。\n"
 ignite_the_fascist_civil_war:"煽起内战"
 ignite_the_fascist_civil_war_desc:"火签已掷了出去，该备的都备齐了，从今往后，再没有回头的路。火一旦点起来，要么烧出个新纳塔，要么把自己也烧成灰。可事到如今，谁也别想再把手缩回来，只能咬着牙，一路走到底。"
 rebuild_the_nation_fascism:"重整山河"
 rebuild_the_nation_fascism_desc:"内战之火终于烧完，满目焦土，断壁残垣。打仗是一回事，收拾这副烂摊子又是一回事。如今要做的，是把塌了的锻炉重盖起来，把荒了的谷田重新种上，令流散百姓各回各家。废墟之上，纳塔得从头再立一回。"
 open_up_political_discourse_fascism:"纵谈国是"
 open_up_political_discourse_fascism_desc:"治国者不可只听一声。焱庭之上，凡有异议，皆当容其尽言；言虽逆耳，未必无理。与其使异论伏于暗处，不若置之明处，与众共议。听得久了，或于其中得一条太平改制之路。纳塔之变，大抵就成在这点容人的气量上。"
 discredit_government_fascism:"指斥朝政"
 discredit_government_fascism_desc:"如今焱庭的诸多不是，一桩桩都摆在眼前，只消把它们一条条数出来，让六族百姓自己去想：究竟是甚么样的道理，把纳塔弄成了这般模样。人心一旦起了疑，那旧规矩便松动了。要换天，先得让人不信这天。"
 hold_the_fascist_national_referendum:"勒行公投"
 hold_the_fascist_national_referendum_desc:"拥护的人已够多了，这会儿举行六族公议，再没有半分凶险。让六族的百姓各自投下一枚火签，把权柄安安稳稳交到该管之人手里。刀兵不动而大事已成，这般换法，最是稳妥不过。"
 NAT_democratic_on_the_rise:"修禊思潮兴"
 NAT_democratic_on_the_rise_desc:"纳塔的风向变了，修禊之说渐成主流，讲的人四处奔走，要让六族都点头。这套道理讲求涤荡旧弊、凡事公议，如春水冲开淤塞河道，正合人心思变的光景。通往修禊之门已敞开，摆在眼前两条路：一条敲鼓聚众，按章程慢慢改过去；一条沸反盈天，拿动荡一把掀过去。流泉舟子与沃陆农人在渡口争起，一个要顺水慢慢清淤，一个要开闸放水冲个痛快。走哪条，纳塔明日便大不同。"
 prepare_for_democratic_civil_war:"预备干戈"
 prepare_for_democratic_civil_war_desc:"民心像山涧的水，要等它自己流到跟前，只怕深渊先到了门口。为了纳塔，也顾不上慢慢来了，即便有人要在这番风波里折了性命，也得果断行事。公投是坐下来讲理，内战却是刀兵相见，锻炉、栈道、部族兵马都要折损一大片。可这一场过后，要立甚么规矩、行甚么章程，就再没人敢拦。"
 expand_civil_democratic_support:"博取民意"
 expand_civil_democratic_support_desc:"焱庭失信，四处的不平像雨后的火榴芽，恰是火候。越是这般，越要把六族百姓笼到自己身边，让他们长久地信服，还敢站出来当众争个公道。说到底，这些推着换天下的法子，比起规规矩矩地换火主，是有些不大体面。可大势一起来，谁还顾得上那些讲究。"
 army_support_for_democratic_civil_war:"扩军固本"
 army_support_for_democratic_civil_war_desc:"刀把子向着谁，仗便替谁打。没有军心归附，任凭道理讲得再动听，真到兵戎相见，也是水中捞月。头一桩要紧的，是把六族兵马拢得齐齐整整，从带兵的到扛枪的，人人都要与我们同心。军心一定，这盘棋才走得下去。"
 ensure_general_loyalty_for_democratic_civil_war:"安偏将心"
 ensure_general_loyalty_for_democratic_civil_war_desc:"有些带六族兵马的将官，私下已倾向修禊之主张，只是不肯明说。这等人物，正该早早结交，许以好处，动以情理，令其在风起那日站到我们这边。稳住一个将官的心，便是稳住他手下那一营兵马。"
 ensure_marshal_loyalty_for_democratic_civil_war:"安元帅心"
 ensure_marshal_loyalty_for_democratic_civil_war_desc:"几位统兵的部族元帅，也有人暗中赞同修禊的道理。这些人一句话能调一部族兵，万万轻忽不得。要趁早去结交、去劝说，把他们心里那点摇摆，换成踏踏实实的支持。等事发之日，元帅们肯点头，大局就定了大半。"
 siphon_equipment_stockpiles_for_democratic_civil_war:"调拨军备"
 siphon_equipment_stockpiles_for_democratic_civil_war_desc:"焱庭武库里的刀枪，有不少将来正用得上。趁着无人留意，一点一点挪出来、藏妥当，不惊动半个人。积少成多，等真要动手那天，这批器械便是我们的依靠。这事最要一个稳字，手一抖，满盘皆输。"
 formulate_surprise_attack_plan_for_democratic_civil_war:"暗定奇谋"
 formulate_surprise_attack_plan_for_democratic_civil_war_desc:"对面还不知祸事已挂在头顶，照旧在营里吃茶议事。这份蒙在鼓里的糊涂，恰是我们最要护住的。风声半点都不能漏，算计得越深，等骤然发难那天，占的先机便越大。要赶在敌人回过神之前，一把攥住要害。"
 ignite_the_democratic_civil_war:"挑起内战"
 ignite_the_democratic_civil_war_desc:"火签已落定，该备的俱已备齐，从此再无回头之路。火一烧起，要么烧出一个新纳塔，要么把自家也烧成灰。然事已至此，谁也收不回手；六族百姓都在看着，只得咬定牙关走到底。"
 rebuild_the_nation_democratic:"再造邦家"
 rebuild_the_nation_democratic_desc:"内战之火总算熄了，满眼焦土断垣。打仗是一桩事，收拾残局又是一桩。眼下要紧的，是把塌了的锻炉重起，荒了的谷田重种，令逃散百姓各归其家。废墟之上，纳塔须从头再立一回。"
 open_up_political_discourse_democratic:"开放政议"
 open_up_political_discourse_democratic_desc:"治国不能只容一种声音。焱庭里那些逆耳之言，不妨敞开胸怀听一听，说不定听着听着，真能听出一条太平改制的路。把各家意见请上台面，总好过让其在暗处发酵。纳塔变局，也许就在这容人气度里悄悄成了。"
 discredit_government_democratic:"非议朝政"
 discredit_government_democratic_desc:"焱庭的诸多不是，一桩桩都摆在眼前，只消逐条数出来，让六族百姓自己去琢磨：是怎样的道理，把纳塔弄成这般模样。人心一生疑，旧规矩便松了。要把这旧天换过去，先得叫百姓打心底里不再信它。"
 hold_the_democratic_national_referendum:"举行公决"
 hold_the_democratic_national_referendum_desc:"归附的人已够多，这会儿举行六族公议，再无半分凶险。让六族百姓各投一枚火签，把权柄安安稳稳交到众人所认之人手里。不动刀兵而大事告成，六族同声，这般换法，最稳妥不过。"
 NAT_communism_on_the_rise:"启明思潮兴"
 NAT_communism_on_the_rise_desc:"纳塔长夜里，启明之说渐渐传开，讲的人越来越多，要让六族都迎来那道光。这套道理讲求破晓众生、苦乐同担，如地底之火终于冲出裂缝，正合久压思变的人心。通往启明之门已敞开，眼前两条路：一条按章程慢慢迎那曙光，一条掀翻黑夜一把搏来天亮。矿洞匠人分了两边，一派要架起燃素灯一寸一寸往深处探，一派要炸开岩层把火直接放出。走哪条，纳塔明日便大不同。"
 prepare_for_communist_civil_war:"备战内乱"
 prepare_for_communist_civil_war_desc:"民心像压在岩下的火，要等它自己烧穿石头，只怕深渊先压到了头顶。为了纳塔，顾不得慢慢来了，即便有人要在这番震荡里折了性命，也得决然行事。公投是坐下来讲理，内战是刀兵相见，锻炉、栈道、部族兵马都要折损一大片。可这一场过后，要立甚么章程，就再没人敢拦。"
 expand_civil_communist_support:"收揽民心"
 expand_civil_communist_support_desc:"焱庭失信，四处的不平像晒干的火榴秆，正等着一点星火。越是这般，越要把六族百姓聚到自己身边，让他们长久地拥护，还敢站出来当众争个公道。说到底，这些催着换天下的法子，比起按部就班地换火主，是有些不大体面。可大势一起来，谁还顾得上那些讲究。"
 army_support_for_communist_civil_war:"扩军树威"
 army_support_for_communist_civil_war_desc:"枪杆子向着谁，仗就替谁打。没有军心归附，任凭道理讲得再透，真到刀兵相见，也是镜花水月。头一桩要紧的，是把六族兵马拧成一股，从带兵的到扛枪的，人人都要与我们同心。军心一定，这盘棋才落得下去。"
 ensure_general_loyalty_for_communist_civil_war:"结偏将心"
 ensure_general_loyalty_for_communist_civil_war_desc:"有些带六族兵马的将官，心里已向着启明的道理，只是面上不肯认。这等人物，正该早早结交，许以好处，动以情义，令其在天将亮那日站到我们这边。稳住一个将官的心，便是稳住他手下那一营兵。"
 ensure_marshal_loyalty_for_communist_civil_war:"结元帅心"
 ensure_marshal_loyalty_for_communist_civil_war_desc:"几位统兵的部族元帅，也有人暗地赞许启明之主张。这些人一开口便能调一支兵，万万慢待不得。要趁早去结交、去劝说，把他们心里的迟疑换成实打实的拥护。等天亮那一刻，元帅们肯点头，大局便定了大半。"
 siphon_equipment_stockpiles_for_communist_civil_war:"挪用军备"
 siphon_equipment_stockpiles_for_communist_civil_war_desc:"焱庭武库里的刀枪，有不少迎曙光时正用得上。趁无人留意，一点一点挪出来、藏停当，不惊动半个人。积少成多，等真要动手那天，这批器械便是我们的本钱。这事要的是一个稳字，手若一抖，满盘皆输。"
 formulate_surprise_attack_plan_for_communist_civil_war:"密谋奇袭"
 formulate_surprise_attack_plan_for_communist_civil_war_desc:"对面还不知天亮之锤已悬头顶，照旧在营里喝茶议事。这份懵懂，恰是我们最该护住的。风声半点不能漏，筹划得越隐秘，等骤然发难那天，占的先机越大。要赶在敌人回神之前，一把捏住他命门。传令斥候换了三班，人人只记半句口令，合起来才是一整条计。"
 ignite_the_communist_civil_war:"点燃内战"
 ignite_the_communist_civil_war_desc:"火签已掷下，该备的都备齐了，从此再无回头路。火一烧起来，要么烧出个天亮，要么把自己也烧成灰。可事到如今，谁也收不回手，六族的火都点起来了，只能咬着牙一路走到底。"
 rebuild_the_nation_communism:"重建邦国"
 rebuild_the_nation_communism_desc:"内战之火终于熄了，满目焦土，断壁残垣。打仗是一桩事，收拾残局又是一桩。眼下要紧的，是把塌了的锻炉重盖、荒了的谷田重种，令流散百姓各回各家。废墟之上，纳塔要迎着启明之光，从头再立一回。"
 open_up_political_discourse_communist:"广开言路"
 open_up_political_discourse_communist_desc:"治国不能只容一种声音。焱庭里那些逆耳之论，尽可摆到明处说。压得住的嘴，压不住底下的火。把各家所想摊开来议，路才走得长。纳塔变局，也许就在这份容人雅量里慢慢长成。"
 discredit_government_communism:"质疑朝政"
 discredit_government_communism_desc:"焱庭诸多不是，一桩一桩摆在眼前，只消逐条数出，让六族百姓自己去想：是怎样的道理，把纳塔弄成这般模样。人心一生疑，旧规矩便松了。要迎来启明的天亮，先得叫百姓打心底不再信这沉沉之夜。"
 hold_the_communist_national_referendum:"召集公投"
 hold_the_communist_national_referendum_desc:"归附的人已够多，这会儿举行六族公议，再无半分凶险。让六族百姓各投一枚火签，把权柄安安稳稳交到众人所举之人手里。不动刀兵而大事告成，让每个人都在新纳塔里有一份，这般换法，最稳妥不过。"
 military_support_for_fascist_civil_war: "在内战中拥有军队支持。\n"
