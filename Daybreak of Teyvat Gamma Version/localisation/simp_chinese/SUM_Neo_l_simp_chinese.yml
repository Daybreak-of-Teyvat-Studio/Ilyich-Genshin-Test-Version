 SUM_Neo_SGS.88.t:"军前立龛"
 SUM_Neo_SGS.88.d:"在雨林边上立一处军前的灵龛，敌人看了心乱，自己看了心定。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
