 LYY_Marxism_Leninism_ADJ:"璃月"
 KQP_the_Peoples_Revolutionary_Committee_idea:"人民革命委员会"
 KQP_the_Peoples_Revolutionary_Committee_idea_desc:"人民革命委员会者，以刻晴为首之新行政系统也。其废七星旧制之下举贤之法，代之以选举。论其名，凡公民皆有选举之权；考其实，选举之果，仍系于委员会控地之力、民拥护之诚与各族之望。今委员会尚足以代表大众，然其运行因过度之民主，内部分裂，势如拔河。玉京台东署中，投票之匦日启，争票之状，见于市井。"
 KQP_thin_domination_idea:"统治力稀薄"
 KQP_thin_domination_idea_desc:"人民革命委员会虽据璃月最富庶之璃月港，得旧大陆之援最便，然于其余诸地，控制实难称乐观。盗宝团、新美利坚之暴徒，乃至史莱姆、丘丘人，皆为其患。昔年激进之城市化，更使农人离心，怨之入骨。欲脱此境，必除暴徒、安农人，二者缺一，则革命无出头之日。碧水原乡野，农人焚田契以泄愤；层岩道上，盗匪夜出，商旅结队而行。"
 LYY_the_Famine:"饥荒"
 LYY_the_Investment:"投资"
 LYY_Robbing_Peter_to_Pay_Paul:"拆东墙补西墙"
 LYY_Pressure_ideas:"施压"
 LYY_Invest_in_Glazed_Pavilion_ideas:"投资琉璃亭"
 LYY_Invest_in_the_Crescent_ideas:"投资新月轩"
 LYY_Harbor_of_Wealth_idea:"财富汇集之港"
 LYY_Harbor_of_Wealth_idea_desc:"§g为流通而造之船，遇港亦泊，故璃月乃万财所聚之地。摩拉克斯§!璃月自古为商贾之都，四方视为致富之地。岁岁请仙典仪，岩王帝君必降明断，以导其发展。宵小惮其契约，不敢欺璃月之商。枫丹既兴工业，璃月仍以其庞然之体、当权者之远识，聚财如故。南码头秤台十座，日入金币以石计；黑岩厂矿砂成列，舟装而海运。"
 LYY_Labor_Dispatch_idea:"劳务派遣"
 LYY_Labor_Dispatch_idea_desc:"§g我们皆为生计而乞。我们已非当年身强力壮、满怀热忱、辞别奥鲁罗之少年，惟余一具具苍白之影。我们惟欲归家。赫尔曼·布施·贝塞拉§!工业革命之风自枫丹来，璃月速纳之：工厂座座而起，万家自田亩入于滚滚浓烟，璃月之货复畅销于万国。然惟璃月之口，不足以饲资本此巨兽。其目遂投于国外，彼处尚有无数劳力，待其征服。于是成批之人，或为花花世界所诱，或径直被抓被掳，踏上此地。其中比重最大者，乃璃月与稻妻所签《劳务派遣协定》。论其名，《协定》为双赢：璃月得所需之劳力，稻妻于《协定》期满后得有素养之劳工，更得其侨汇以建其国。然彼劳工何如？其事之详，惟§g无冢之骨§!能§R说清§!。北码头夜航之舟，舱中挤者数百，登岸则名册点收，如点货物。矿道深处，稻妻之工十居其四，音异而汗同。"
 LYY_Low_Quality_Industry_idea:"低质量工业"
 LYY_Low_Quality_Industry_idea_desc:"惜哉，璃月虽于工业之初即有布局，然至今其技仍不能与枫丹比肩，甚至难独立设计新品。长久之传统，使璃月乏技术之才；于此一点，璃月连分裂散乱之蒙德皆不如。遂使枫丹肆意于璃月收专利之税，工业化之进度大受其拖。同时，初期鼓励设厂之策过宽，良莠不齐之品并出，购者不满。黑岩厂所出之械，三试而二者停；枫丹技师驻厂，修一机而索金百两。"
 LYY_Crippled_Labor_Laws_idea:"残废劳工法"
 LYY_Crippled_Labor_Laws_idea_desc:"初，璃月政府招商最力。为安资本之心，早期竟全无《劳工法》！直至去年，玉衡星刻晴始倡《劳工法》，交七星表决，终以妥协而罢。所议定者，表面循九时劳动、普遍医保、禁童工诸则，实则无一台阁受理劳资之争，市人戏称「残废之劳工法」。不卜庐门外，候诊之工日增；绯云坡讼师，拒受工案，云无据可依。"
 LYY_KeQing_can_work_tt:"刻晴是我们的领袖"
 KQP_reduced_resource_acquisition_for_suppressing_reactionaries_tt:"§R减少§!镇压反动派资源获得"
 LYY_cost_5_million_tt:"§R花费§!500万§Y£mora 摩拉§!"
 LYY_the_Economic_Crisis_is_Over:"经济危机结束"
 LYY_The_Year_of_Eclipsing_Star:"天权之年"
 LYY_The_Year_of_Eclipsing_Star_desc:"璃月七星素有轮主祭岩王帝君之传统。经济既盛，此传统渐变：主祭者于当年七星会议，默许而握主导之权。去年主祭者，玉衡星刻晴，世称玉衡之年。今年则天权之年，天权星凝光阁下将出何策，众皆拭目。黄金屋前彩楼已起，匾上惟书四字：天权主祭。"
 LYY_Appease_the_Public:"安抚民众情绪"
 LYY_Appease_the_Public_desc:"帝君之逝，于璃月民心，打击甚巨。今港中上下人心惶惶，民争囤日用之物，以待荒年。此于大局非佳音，须安其不安之情。南码头米铺，晨启门则人已列，一人限购三斗；总务司出榜安民，榜下抄录者众。"
 LYY_Opening_up_Key_Trade_Routes:"开放重点商路"
 LYY_Opening_up_Key_Trade_Routes_desc:"事实证明，先时封锁之策过于严苛。今可易以温法：惟断其小径，商道要冲，严守即可。石门关外，小道三处，各设一哨，哨卒八人；正道之卡，增卒倍之。"
 LYY_Subsidised_Shops:"补贴商铺"
 LYY_Subsidised_Shops_desc:"若问璃月何物使之运转？必答曰£mora 摩拉。而摩拉之流转，又赖商人。然大萧条与饥荒之年，名为商人之心脏，似不能泵璃月摩拉之血矣。我等所当为者，行心肺复苏之术于璃月！商会门前，贴补之榜高悬；受补之铺，晨即开门，云不开铺则补不入。"
 LYY_Military_First:"军队优先"
 LYY_Military_First_desc:"无军能空腹行军。冰之女皇之精锐，蝗虫一般之愚人众，彼辈若空腹，连蒙德孩童亦不能慑！欲使千岩军尽其用，速发其饷。重云营中，上月欠饷，逃卒十七；本月饷至，归队者三十有一。"
 LYY_Bring_down_Grain_Prices:"平抑粮价"
 LYY_Bring_down_Grain_Prices_desc:"商人之胡萝卜已发，商路已开，百货与£mora 摩拉复源源流入璃月。今当出大棒：囤积居奇之奸商，令其吐出所发之国难财！玉京台出榜，限三日平价；有商匿粮不售，籍其仓，米凡八百石，尽数平粜。"
 LYY_Invest_in_the_Crescent:"投资新月轩"
 LYY_Invest_in_the_Crescent_desc:"细思即知，月菜轩执于海味，其本甚稳。璃月本为海港之城，彼等于动荡之中犹能保其营收，则璃月饮食创收之半壁，由此可保。南码头鱼市，晨四时开，贩者百余家，半数供于月菜轩。"
 LYY_Invest_in_Glazed_Pavilion:"投资琉璃亭"
 LYY_Invest_in_Glazed_Pavilion_desc:"璃月山珍多出轻策庄，多入琉璃亭。琉璃亭若不能续购山珍，轻策庄之民何以收其入？欲不拉大璃月贫富之距，且保港中民用餐之本不再飙升，此或为上选。轻策庄山道，晨挑夫络绎，担中皆冬笋、山菌，直入琉璃亭后厨。"
 LYY_Invest_in_Wanmintang:"投资万民堂"
 LYY_Invest_in_Wanmintang_desc:"此最出人意表之选：舍琉璃亭、新月轩二巨室，而扶万民堂。万民堂体量远逊二者，然以亲民与品质，于璃月餐饮界绝处逢生。勿论两大菜系！民众若以其接地气，为维稳计，则选万民堂。灶前锅气蒸腾，一日食客三百，招牌之菜，数十年不易其法。"
 KQP_Formation_of_the_Peoples_Revolutionary_Committee:"组建人民革命委员会"
 KQP_Formation_of_the_Peoples_Revolutionary_Committee_desc:"帝君遇刺之后，凝光假新政之名，越七星之制，篡至高之权。然彼身为天权星，进退失度，俗手频出：非惟不解遇刺所起之信危，更挑无谓之战争。观璃月之惨状，玉衡星刻晴不复容忍其倒行逆施，遂倡革命。今依至冬之议，刻晴决废旧七星体制，建由璃月港民所选之人民革命委员会，以尽大众之力，使其自愿卫其国。投票之日，设匦于玉京台前三日，投者逾万，有农人自碧水原步行二日至港，投毕复行二日而归。"

