 Book_MOT:0 "§G【推荐游玩】§!\n每当人们，从这里走过\n都说啊，多么美丽的花；\n这花属于，自由的战士——\n他为蒙德的自由献出生命。\n蒙德已经在西风骑士团的领导下走过了上千年的时光，当这伟大组织的领导权来到琴·古恩希尔德的手中，她更是将蒙德带向了前所未有的高峰。在这里，激进的民主理想得到实践，从深渊、枫丹和至冬流出的先进技术得到广泛应用，一切都欣欣向荣。曾几何时，琴团长一度以为自己的理想就要实现了。\n可惜，风暴将至。\n在剧烈的崩塌中，琴·古恩希尔德将面对她理想前的最后一道难关——比她以往跨过的一切障碍都要恐怖得多的难关。她必须不惜一切代价闯过这道难关，决不能将蒙德的未来交到那些居心不良的军阀手中。不然，蒙德此时的光明也许永远不会再复现于这片土地，只能作为逝去的历史被人们不断回忆了。"
 #\n\n有趣的内容：\n内战前 争分夺秒，平衡取舍，抱薪救火\n内战中 与贵族军的限时冲突，维持下降的稳定和战争支持，转向战时经济，通过一场又一场胜利扶大厦于将倾。\n内战后 建设蒙德，实践对自由的理解。\n可能的路线：\n琴 公理战胜，实现自由理想（蓝）\n在内战中突出重围，用胜利高举民主自由理想的火炬。\n琴 回船归港，永护蒙德\n作出必要的妥协，为下一次实践理想做好准备。在此之前，用铁腕守护蒙德。\n诺艾尔 临危受命，挽救危局，大政奉还\n诺艾尔 希望破灭，结晶之夜，黑玫瑰盛开\n诺艾尔 高歌猛进，公投连任，红玫瑰绽放
 Book_LYY:0 "§G【推荐游玩】§!在提瓦特东南的海岸，璃月港在帝君的庇佑下斩开了几千年的风浪，在璃月人的眼里，帝君与璃月有着如磐岩般的契约，守护璃月本就是理所应当之事，绵延万年之责，可是无论好事坏事都会有着自己的终点，随着愚人众在璃月境内的活动，将要展开的请仙典仪显得危机重重。而璃月的近海，当年被帝君所镇压的漩涡魔神奥赛尔，也似乎终于不再甘愿如此结局了……"
