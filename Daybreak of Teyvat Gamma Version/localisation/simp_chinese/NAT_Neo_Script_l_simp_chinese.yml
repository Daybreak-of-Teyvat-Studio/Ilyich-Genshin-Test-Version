 NAT_Nightwind_Night_Council_Idea:"夜烟聚议"
 NAT_Nightwind_Night_Council_Idea_desc:"烟谜主议事，专挑夜半三更，且从不著于简。数祭司裹灰袍，摸黑至秘密议事地，谁亦不点灯。一年轻祭司带一卷竹简，欲记议程，为老祭司一把按住：「此处之言，不落纸。」年轻祭司收回竹简，茫然曰：「不留日志，日后拿何凭据？」老祭司暗中笑曰：「无凭据，方无人拿它作把柄。」众人围一堆将熄炭火坐下，你一句我一句，声压甚低，说完一句，便由风将话吹散。议至后半夜，炭火尽熄，四周漆黑，只闻各人呼吸。年轻祭司数呼吸，候到头一声鸡叫，议事便散，各人自摸黑散去，谁亦未留半字。"
