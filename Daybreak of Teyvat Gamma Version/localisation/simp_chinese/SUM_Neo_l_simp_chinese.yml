 #### 民族精神 ####
 SUM_SDH_I_Matriarch_Rule:"主母之治"
 SUM_SDH_I_Matriarch_Rule_desc:"哈德拉玛维特，规矩多由主母一句话定下，并不落在文字上。众人有事，便去问主母，主母说了，便算数。这规矩虽不落纸，人人心里却记得清楚。端的简便。"
 SUM_SDH_I_Suzerain_Edict:"敕令在门"
 SUM_SDH_I_Suzerain_Edict_desc:"雨林的敕令，贴在城门之上，管着赋税与驻军。过往行人，都要驻足看上一看。这敕令贴出来，沙地的人看了，心里各有滋味。这敕令端的压人。"
 SUM_SDH_I_Floral_Blood:"花神的女儿"
 SUM_SDH_I_Floral_Blood_desc:"历代主母，都自称是花神的女儿。这话传开，信众遍布各部，人人虔信。这花神的名头，端的笼络住了人心。每逢祭期，各部的人便朝着主母所在的方向礼拜。"
 SUM_SDH_I_Storm_Land:"风沙之地"
 SUM_SDH_I_Storm_Land_desc:"沙地一年三月刮风，风起时商路断绝，城邑相隔。人们只好躲在屋里，等风过去。这风端的厉害，把一片沙地割成许多块。商队只能等风停了再走，往往一等就是好几天。"
 SUM_SDH_I_Hidden_Wells:"暗井与后路"
 SUM_SDH_I_Hidden_Wells_desc:"沟壑深处，藏着一些不标在图上的井。这是各部留给自己的退路，平日里秘不外传。这暗井端的要紧，风急时全靠它活命。外人纵然路过，也看不出那井下藏着什么。"
 SUM_SDH_I_Ruin_Expedition:"遗迹探险"
 SUM_SDH_I_Ruin_Expedition_desc:"遗迹之中，藏着钥石与图纸。有人得了，便引着一批批人往沙里去寻。这沙里端的藏着无数秘密，惹得人前赴后继。有人空手而归，有人却从此没了踪影。"
 SUM_SDH_I_Tribal_Scatter:"部族各散"
 SUM_SDH_I_Tribal_Scatter_desc:"各部各守其地，议事时先吵座次，谁坐上首，谁坐下首，争个不休。这议事先吵座次，端的误事。有一回为了座次，竟争论了整整一日，正事反倒搁在一边。"
 SUM_SDH_I_Caravan_Toll:"商队分成"
 SUM_SDH_I_Caravan_Toll_desc:"过境的商队，照例要留下一成货物，算是买了平安。守卡的收了货，便放行。这一成货，买的却是一路无虞。守卡的收了货，便在货单上画个押，放人过去。"
 SUM_SDH_I_Desert_League:"沙地之盟"
 SUM_SDH_I_Desert_League_desc:"诸部立盟，共守沙地，共分水源，共抗敕令。立盟那日，杀羊歃血，人人表态。这盟一端立，沙地便拧成了一股。自此有福同享，有难同当，端的不负盟誓。"
 SUM_SDH_I_Independent_Flag:"独立之旗"
 SUM_SDH_I_Independent_Flag_desc:"花神与沙丘的纹样，立在各城城头。旗一飘，远远便认得出是沙地的人。这纹样端的提气，众人看了，心里便有主。敌军望见这旗，便知是沙地的人在守城。"
 SUM_SDH_I_Floral_Kingdom:"花神之国"
 SUM_SDH_I_Floral_Kingdom_desc:"花神的龛，立遍各城。祭司由信众公推，绿洲之水按口分。这般公道，人人服气。祭司既由公推，便不敢偏私；水既按口分，便无人敢多占。众人无不称便。"
 SUM_SDH_I_Pilgrim_Guild:"香客行会"
 SUM_SDH_I_Pilgrim_Guild_desc:"香客自组行会，管路上的食宿与安全。行会立了规矩，众人照着办。这行会端的周到，香客上路便不愁了。行会还立了章程，违者要受罚，端的井井有条。"
 SUM_SDH_I_Holy_Guard:"护法卫队"
 SUM_SDH_I_Holy_Guard_desc:"护法卫队，平日里守着神庙，一旦有事，也随军出征。护时如墙，攻时如虎。这卫队端的了得。两班人马轮换，护时寸步不退，攻时一往无前，端的了得。"
 SUM_SDH_I_Storm_State:"沙暴军国"
 SUM_SDH_I_Storm_State_desc:"各部之兵，编为一军，号令统一，粮饷也统一。从前各吹各号的光景，一去不返。这一编，端的成了一支劲旅。有那不服的，也只好收起私心，听候号令。"
 SUM_SDH_I_Mech_Corps:"构装队伍"
 SUM_SDH_I_Mech_Corps_desc:"遗迹里的构装，装上兵器，便成了一队兵。它们不知疲倦，也不怕死。这构装上阵，端的省了许多人命。列阵之时，刀枪齐举，步伐如一，端的威风。"
 SUM_SDH_I_Sand_Commune:"沙地公产"
 SUM_SDH_I_Sand_Commune_desc:"地把分回各部，水按口分，粮在荒年共放。众人各安其业，争端也少了。这般分法，端的公道。从前为地界争得你死我活，如今各安其分，倒也清净。"
 SUM_SDH_I_Oasis_Assembly:"绿洲自治"
 SUM_SDH_I_Oasis_Assembly_desc:"各处绿洲，立下宪章，代表按月议事，法官按季巡判。事事有章可循。这宪章一端立，绿洲便治理得井井有条。代表们按期而来，从无一人迟到，端的守信。"
 SUM_SDH_I_Open_Trade:"公开税则"
 SUM_SDH_I_Open_Trade_desc:"税则刻在碑上，谁交多少，自己算得出来。官署不能多收，商户也不肯少交。这税则一明，争端便息了。有那想多收的，也怕碑上的字，不敢伸手动脚。"
 SUM_SDH_I_Common_Law:"沙地共律"
 SUM_SDH_I_Common_Law_desc:"合诸部旧规，编成一部共律，法官按律巡判。从前各族规矩不同，如今一律通行。这共律一端行，众人都受了约束。法官到了一处，便升座审案，模样十分威严。"
 SUM_SDH_I_Old_Accord:"旧例照行"
 SUM_SDH_I_Old_Accord_desc:"旧例能留的都留，只是多了一层公议的过场。凡事经众人议过，方才定夺。这一层过场，端的少了些专断。这般不轻易改旧章，众人心里也踏实，端的稳妥。"
 SUM_SDH_I_Foreign_Hand:"外邦的手"
 SUM_SDH_I_Foreign_Hand_desc:"北国的使团，舍得花钱，开出的价码越往后越大。他们要的是沙地的好处。这使团出手阔绰，端的叫人动心。他们今日添一桩，明日添一桩，贪心端的没个底。"

 #### 等级 / 共振 ####
 SUM_Neo_SDH_T1:"一档：香火将断"
 SUM_Neo_SDH_T1_desc:"这一档，香火将断。花神的龛前落满黄沙，祭礼也停了三年，只剩几个老人家围着火塘，把旧年的诞祭一句一句说给孙辈听。风一过，连那点话头也散了。"
 SUM_Neo_SDH_T2:"二档：香火零星"
 SUM_Neo_SDH_T2_desc:"二档，香火零星。几处绿洲还立着龛，龛前摆着半碗凉水，算是有人来过。信众散的散、走的走，剩下的也不敢声张，只在天黑后关起门来烧一炷香。"
 SUM_Neo_SDH_T3:"三档：香火渐盛"
 SUM_Neo_SDH_T3_desc:"到了三档，香火渐盛。各城的诞祭又办起来了，鼓乐一响，街面上人挤人，连外乡的商队也停下看。从前不敢报名字的信众，如今挺着腰杆在册上画押，算有了名分。"
 SUM_Neo_SDH_T4:"四档：香火遍野"
 SUM_Neo_SDH_T4_desc:"四档上，香火遍野。各部族的长老同坐一席，共尊花神的规矩，主母坐上位，底下另设公议，凡事众人举手表决。谁要独断，众人便把袖子一甩，起身就走。"
 SUM_Neo_SDH_T5:"五档：花神当国"
 SUM_Neo_SDH_T5_desc:"五档上，花神当国。沙地的律条不再从雨林来，改从龛前出。祭司由信众公推，谁家出的香火多，说话也未必响。规矩立在信仰上，连旅团过境也要下马。"
 SUM_Neo_SDH_U1:"一档：风平"
 SUM_Neo_SDH_U1_desc:"一档风平。沙地上没有常备的兵，各部族的壮丁各守各的井、各守各的羊圈。官署来征调，长老把茶碗一放，只说过不去。这地方太平得叫人心里发虚。"
 SUM_Neo_SDH_U2:"二档：风起"
 SUM_Neo_SDH_U2_desc:"二档风起。三五支佣兵、几伙民兵，凑得起来，也散得飞快。东边敲鼓，西边吹号，谁听谁的，全看当日谁管饭。真到要动刀，先得吵上半个时辰，谁也不服谁。"
 SUM_Neo_SDH_U3:"三档：有军可用"
 SUM_Neo_SDH_U3_desc:"到了三档，有军可用。沙地养起一支常备的兵，白日操演，夜里巡更，旗号只认一个。令箭一到，拔营就走，不必再挨家挨户去求人。长老们这才睡了个安稳觉。"
 SUM_Neo_SDH_U4:"四档：风卫成军"
 SUM_Neo_SDH_U4_desc:"四档，风卫成军。刮风天的队伍练成了，风沙里睁得开眼，走得动路，整营整营地拉出去。别处的兵躲风，他们趁着风走，赶到时敌手还眯着眼，来不及拔刀。"
 SUM_Neo_SDH_U5:"五档：风沙之军"
 SUM_Neo_SDH_U5_desc:"五档，风沙之军。部族的骑手、旅团的刀手，连同遗迹里挖出的构装，编作一军。构装走在前头，铁壳上还沾着沙，后头的人马紧跟。这样的阵仗开出去，沙丘都要让路。"
 SUM_Neo_SDH_Combo_HH:"神军合流"
 SUM_Neo_SDH_Combo_HH_desc:"花神的旗与沙暴的军团并到一处，旗在前，兵在后，走起来竟像一支人马。信众有了拳头，兵也有了名分，龛前的香火与营里的号角一块响。"
 SUM_Neo_SDH_Combo_LL:"香火无兵"
 SUM_Neo_SDH_Combo_LL_desc:"神龛零落，兵旅散尽。沙地上又只剩各部自守，井边插着自家的木牌，路上遇见生人先摸刀。官署的公文送到沙丘边，长老们看也不看，卷起来塞进灶膛。"
 SUM_Neo_SDH_Combo_AH:"神权独尊"
 SUM_Neo_SDH_Combo_AH_desc:"这一回，是信仰压过了兵马。花神的名头一抬，旅团的刀便收回鞘里，各部争了多年的水权，也在龛前一句话断清。沙地的规矩改由祭司嘴里出，军营只管听令。"
 SUM_Neo_SDH_Combo_BH:"兵在神前"
 SUM_Neo_SDH_Combo_BH_desc:"沙暴军团大过神龛。营里的号令先出，庙门后开，祭司捧着经卷在门口等，等兵过完了才敢念。长老们私下摇头，说这沙地敬的不再是花神，是刀。可摇头归摇头，粮还是要交。"

 #### 新闻 ####
 SUM_Neo_SDH_News.1.t:"主母的敕令"
 SUM_Neo_SDH_News.1.d:"教令院新下一道敕令，遣使送到哈德拉玛维特。那使节一路扬尘，进了大帐，双手将敕令呈上，腰杆挺得笔直。主母接过来，也不细看，只漫不经心地扫了一眼，脸上不喜不怒，随手便交给身旁的人收着。那副神情，仿佛接的是一张废纸。使节偷眼观看，心里暗暗吃惊，来时那点趾高气扬，早去了大半。旁边的人捧着敕令，也不敢多问，悄悄退到一旁，将文书卷好收入匣中。主母端的不是容易被一纸文书吓住的人。主母只顾端起茶碗，慢慢啜了一口，仿佛眼前什么事也不曾发生。使节站也不是，坐也不是，末了只得讪讪告辞，带着一肚子气回去交差。旁边的谋士凑上前来，低声问这敕令如何处置，主母淡淡道：先搁着，不必理会。"
 SUM_Neo_SDH_News.1.a:"阅"
 SUM_Neo_SDH_News.2.t:"花神诞祭"
 SUM_Neo_SDH_News.2.d:"花神诞祭到了，沙地几处绿洲同时开锣。那祭日里，处处张灯结彩，香火缭绕，歌乐之声连着响了七夜，昼夜不绝。往年不过是小打小闹，今年却不同，来的人比往年多了许多，有附近的百姓，也有远道而来的商队，把绿洲挤得水泄不通。卖花的、卖香的、耍把戏的，沿街摆开，吆喝声此起彼伏。有老者捧着花环，恭恭敬敬献在神前，口中喃喃祷告。孩子们追着灯火跑，笑声洒了一地，直到夜深方肯归家。端的繁华热闹，胜似往年。祭坛设在绿洲中央，四围插满鲜花，香气浓得化不开。有巫者披着彩衣，手舞足蹈，口中念着古老的祝词，众人便跟着齐声应和。沙地里难得这般热闹，人人都把平日的愁苦暂且丢开，只管尽兴。"
 SUM_Neo_SDH_News.2.a:"阅"
 SUM_Neo_SDH_News.3.t:"盐路涨价"
 SUM_Neo_SDH_News.3.d:"盐路上新添了一处税卡，卡子一立，盐价便跟着涨了。原来过一道卡，便要交一道钱，这钱到头来还是摊在盐上，买盐的人吃了亏。那些跑惯了盐路的驮队，哪里肯吃这个哑巴亏，一个个绕开了新卡子，依旧走那走了多年的旧道。旧道隐蔽，关卡也少，虽然远些，却省下一笔钱。新卡子立在那儿，形同虚设，每日里冷冷清清，收不上几个钱。收税的差官急得直跳脚，派人去拦，也拦不住几条道，只得干瞪眼。端的上有政策，下有对策。盐商们私下聚在一处，骂那税卡骂得狗血淋头，却也拿不出别的法子，只好各自绕道。旧道上人马反而多了起来，倒比从前更热闹些。那些守卡子的兵丁，有几个竟也偷偷走了后门。"
 SUM_Neo_SDH_News.3.a:"阅"
 SUM_Neo_SDH_News.4.t:"沙暴季"
 SUM_Neo_SDH_News.4.d:"换季的头一场大风来了，这一刮就是三天三夜。那风卷着黄沙，铺天盖地，白天也昏暗如同黑夜。路上的商队没法子，只得就地停摆，把货卸下来，人躲进帐里。有几处营地扎得低洼，被沙丘一步步埋了半截，帐篷塌了，灶坑也填平了。等风停了，人从沙里刨出来，一个个灰头土脸，叫苦不迭。有经验的驼夫早有准备，用布把口鼻捂得严严实实，才不至于呛坏。商队清点货物，少了好几箱，心疼得直跺脚。这场大风端的厉害，把沙地搅了个天翻地覆。风停之后，天边露出一线昏黄，人们才敢从帐里钻出来。四处一望，沙丘的模样全变了，昨日的地标都不见了，连老驼夫也辨不清方向，只得凭着星光慢慢摸索。"
 SUM_Neo_SDH_News.4.a:"阅"
 SUM_Neo_SDH_News.5.t:"烧掉的敕令"
 SUM_Neo_SDH_News.5.d:"教令院的使节还在帐中絮叨，主母忽地起身，拿过那道敕令，就着灯火点燃。那纸一见火，便卷曲着烧起来，火星毕剥作响。使节惊得目瞪口呆，话也说不下去。主母也不看他，只把烧剩的纸灰随手一扬。恰好一阵风从帐外卷进来，把那灰吹得漫天飞舞，扑了使节一身，连衣襟上都落满了黑灰。使节愣了半晌，抖了抖衣裳，灰溜溜地退出大帐。旁边的人看了，无不暗中称快，却又不敢笑出声。主母端的硬气，端的教令院从来没见过这等人物。那使节回到客帐，越想越气，把主母的举动添油加醋地告回教令院。主母听说了，也不在意，只吩咐手下把帐中洒扫干净，仿佛什么也没发生过。自此教令院再送文书来，气焰便矮了半截。"
 SUM_Neo_SDH_News.5.a:"阅"
 SUM_Neo_SDH_News.6.t:"独立之旗"
 SUM_Neo_SDH_News.6.d:"哈德拉玛维特的城头，升起了新的旗号。一边是花神的纹样，一边是沙丘的纹样，端的是沙漠与花神并立的意思。旗子在风里猎猎作响，好不威风。雨林方面瞧见这旗，心知大事不妙。当夜，雨林在沙地的戍所便撤了两处，守卒收拾了行李，灰溜溜地退回雨林去了。走得急，连锅灶都没来得及拆，留下满地狼藉。有人登高望见那两处空营，冒出几缕余烟，在夜色里袅袅上升。端的旗帜一换，局面便不同了。守了两处的雨林兵，临走时还回头张望，似乎不敢相信这旗真的换了。城中的百姓听说戍所撤了，纷纷跑来看热闹，指着那旗议论纷纷。有胆大的，竟伸手摸了摸旗角，被兵丁笑着挥手赶开。"
 SUM_Neo_SDH_News.6.a:"阅"
 SUM_Neo_SDH_News.7.t:"风卫成军"
 SUM_Neo_SDH_News.7.d:"哈德拉玛维特把各部的兵马合在一处，编成一支新军。先前那些兵各归各的部，号令不齐，如今一锅烩了，统一操练，统一调度。主母还特意挑起大风天来操演，说沙漠的兵，本就该在风沙里练出来。那日狂风大作，黄沙蔽日，新军却列阵如常，进退有度，半点不乱。营门口新贴出一张号册，上头写着各部的编号与口令，进出的人都要对着号册唱名。有生人想混进去，对着半天对不上，被拦在门外，盘问了许久才放行。端的成了一支劲旅。操演完毕，主母当众讲了话，说风沙不可怕，怕的是人心不齐。众人听了，齐齐呐喊，声浪竟盖过了风声。自此各部的人马混在一处，日子久了，也就分不出彼此，端的成了一家人。"
 SUM_Neo_SDH_News.7.a:"阅"
 SUM_Neo_SDH_News.8.t:"公议庭"
 SUM_Neo_SDH_News.8.d:"主母的厅堂对面，忽地立起了一座公议庭。这两座厅隔着一条街，你望着我，我望着你，端的有点意思。一边是主母发号施令的地方，一边是众人公议的场所。每日里两边都有人进进出出，可奇怪的是，进出的人碰了面，却互相不看一眼，仿佛不认得似的。这边的人低着头快步走，那边的人扭过脸装作看天。有人看不过去，问这是为何，老成的摇摇头说：两边各有各的章程，井水不犯河水。问的人似懂非懂，也就不再多问。端的透着一股说不清的别扭。公议庭里每日也开会，议的是粮价、水价、关税这些琐事，议完了便把条文抄出来，贴在庭外的墙上。可主母的厅里出了什么令，公议庭的人从不打听，两边各守各的规矩。"
 SUM_Neo_SDH_News.8.a:"阅"
 SUM_Neo_SDH_News.9.t:"戍所易手"
 SUM_Neo_SDH_News.9.d:"雨林伸进哈德拉玛维特的第一座戍所，到底还是易了手。那戍所易手之后，房顶的旗子换了，由雨林的换成花与沙丘的纹样。奇怪的是，那墙却一砖没拆，依旧好好地立着。有人不解，问何故不拆。带兵的将官笑道：墙是死的，插上咱的旗，便是咱的墙，拆它做甚？果然，没几日，那戍所里头便驻进了沙漠的兵，墙头添了岗哨，壕沟也疏浚了一遍，还囤了几缸清水。一座旧的戍所，就这样成了新的据点。端的房子还是那房子，主人却换了。那墙根下原先堆着的拒马、鹿角，也被人拖到一旁，换成了沙漠的样式。有几个路过的商队见了，还道是雨林新修的工事，待看清旗色，才惊觉主人已经换了。端的这戍所，改头换面，认不出来了。"
 SUM_Neo_SDH_News.9.a:"阅"
 SUM_Neo_SDH_News.10.t:"风卷东向"
 SUM_Neo_SDH_News.10.d:"沙地的军队，趁换季的大风出了绿洲。那日风沙漫天，正好掩人耳目，大军悄悄开拔，一路向东。随军的人一路算着路程，有人说，再走十天，就能望见须弥城的尖塔了。这话一传开，众军精神一振，脚下也快了几分。有老兵指着东方说：那塔尖儿，我年轻时见过，高得插进云里。众人听了，都伸长脖子往前望，仿佛那尖塔已经在眼前。风还在刮，黄沙打在脸上，却挡不住那一股子期待。有人夜里梦见了那城，醒来时满脸都是沙。端的归心似箭，士气如虹。部众听了这话，一个个都来了精神，连夜赶路也不觉得累。主母骑马走在最前头，时不时勒马四望，像是在估算着还有多少日程。那面旗在风里啪啪作响。"
 SUM_Neo_SDH_News.10.a:"阅"
 #################### 沙丘腰带 ####################
 #### 序章 · 花灵的守望 ####
 SUM_SGS_PRO_The_Paris_Vigil:"花灵的守望"
 SUM_SGS_PRO_The_Paris_Vigil_desc:"沙丘腰带的沙下，埋着圣显厅，也埋着花灵。花灵从灵光里生出，替凡人守着边界，一守几百年。凡人在沙上筑城、通商、争水，花灵就在旁看着，从不插手，也从不离开。"
 SUM_Neo_SGS.1.t:"花灵的守望"
 SUM_Neo_SGS.1.d:"沙丘腰带的茫茫黄沙之下，埋着一座圣显厅，也埋着一群花灵。那些花灵是从灵光里生出来的，天生就知道替凡人守着这条新生的边界。一守就是几百年的光阴。凡人在沙上筑起城池，通商贩货，为一口水争得头破血流，花灵就在旁边静静看着，从不插手，也从不离开。有个赶路的旅人，夜里在沙丘间迷了方向，忽见前方有一点柔和的光，循着光走，竟走出了沙海。他回头想谢那光，光却早已不见了，仿佛从未有过。端的这些花灵，是沙地里最忠实的守望者。沙丘腰带的人世代都见惯了那道光，却不知有多少迷路的旅人，是靠着它才捡回一条命。花灵们就这样，一代又一代，守着这条看不见的界线，把安稳留给沙上的人。"
 SUM_Neo_SGS.1.a:"循教令院发下的旧例"
 SUM_Neo_SGS.1.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Pari_Wish:"花灵的许愿"
 SUM_SGS_PRO_Pari_Wish_desc:"花灵能替人圆一个愿，可愿圆了，就要付代价。来求的人不少，肯付代价的却不多。这天底下没有白得的便宜。有人许了愿，付不起代价，反倒悔不当初。"
 SUM_Neo_SGS.2.t:"花灵的许愿"
 SUM_Neo_SGS.2.d:"花灵有一桩本事，能替人圆一个愿。这愿不论大小，花灵都能设法办成，可天底下没有白吃的筵席，愿圆了，便要付一份代价。来求的人倒是不少，有求财的，有求医的，有求姻缘的，把花灵的跟前挤满了。可真到了要付代价的时候，十个里倒有九个打了退堂鼓。有人听说要拿十年的寿数去换，脸都白了；有人听说要舍弃最心爱之物，扭头便走。只有一个汉子，为了救垂死的女儿，咬着牙应了下来，宁愿自己折寿。端的愿易圆，代价难付。花灵见他这般坚决，方才开口，说代价是叫他从此再也见不到女儿的模样，只余下满心的想念。那汉子听了，呆立良久，末了还是咬咬牙应了。女儿果然活了下来，可他从此看谁都只记声音，端的叫人叹息。"
 SUM_Neo_SGS.2.a:"把账目封存"
 SUM_Neo_SGS.2.b:"把账目摊开"
 SUM_SGS_PRO_Pari_Zurvan:"祖尔宛"
 SUM_SGS_PRO_Pari_Zurvan_desc:"祖尔宛，是最早的花灵，年纪比沙丘腰带这个名字还老。她说话很少，听人说话时却总点头。这般沉静，端的有些道行。她这般年高，端的少见，众花灵都敬她三分。"
 SUM_Neo_SGS.3.t:"祖尔宛"
 SUM_Neo_SGS.3.d:"花灵之中，有一位唤作祖尔宛的，是最早的一位。她的年纪，比沙丘腰带这个名字还要老，端的阅尽了几百年的沧桑。祖尔宛平日里说话极少，常常是一整天也不吐一个字。可她有个习惯，别人说话的时候，她总在一旁静静地听着，一边听，一边轻轻点头，仿佛把每个字都记在了心里。有年轻的花灵向她请教道理，她也不多讲，只是点了点头，那年轻花灵竟也似懂非懂地明白了。有人问她为何总点头，她淡淡道：说得好，我便点头。端的位高言简，点到为止。日子久了，众花灵都习惯了祖尔宛的点头，把那轻轻一点，当成了最了不得的赞许。谁要是办事稳妥，得了她一点头，便能高兴上好几天。端的这位老花灵，不言不语，却自有威信。"
 SUM_Neo_SGS.3.a:"按官署的判断行事"
 SUM_Neo_SGS.3.b:"按自己的判断行事"
 SUM_SGS_PRO_Pari_Sorush:"索鲁什的信"
 SUM_SGS_PRO_Pari_Sorush_desc:"索鲁什，替花灵们传话，把沙上的事一件件带给祖尔宛。信里多是好消息，坏消息却由她自己带回。这传话的差事，端的费心。这般传话端的辛苦。"
 SUM_Neo_SGS.4.t:"索鲁什的信"
 SUM_Neo_SGS.4.d:"花灵里头有个叫索鲁什的，专管替众人传话。沙地上发生的各样事情，无论大小，都由他一件件记下，再带给祖尔宛。索鲁什是个报喜不报忧的性子，信里写的，多是什么商队平安过了沙海，什么村社获得了丰收，尽是些好消息。可若是哪里出了灾祸，死了人，他便不肯写在信上，宁可自己跑一趟，亲口把坏消息带回去。有回一处绿洲断了水，他一路飞奔，满脸风尘地赶到祖尔宛面前，低声把噩耗说了，连嗓子都哑了。祖尔宛听罢，默默地点了点头。端的报喜容易报忧难。祖尔宛听罢那噩耗，许久没有言语，只是抬手替索鲁什拂去肩上的沙。索鲁什站在一旁，低着头，心里比那断水的绿洲还苦。端的传话的人，报忧时最难开口。"
 SUM_Neo_SGS.4.a:"先看住脚下的城"
 SUM_Neo_SGS.4.b:"先看住远方的人"
 SUM_SGS_PRO_Pari_Nasejuna:"那塞犹那的歌"
 SUM_SGS_PRO_Pari_Nasejuna_desc:"那塞犹那，会唱花灵的歌。孩子听着听着便睡了，大人听着，却想起自己的祖母。这歌声端的动人。那歌声一起，连沙上的风都似听得慢了，听的人久久不愿散去。"
 SUM_Neo_SGS.5.t:"那塞犹那的歌"
 SUM_Neo_SGS.5.d:"花灵中有一位唤作那塞犹那的，生得一副好嗓子，会唱花灵的歌。那歌声缠绵悠远，仿佛从很远的地方飘来。小孩子听了，不一会便眼皮打架，甜甜地睡了过去，做着满是花的梦。大人听了，却是另一番滋味，往往会怔怔地出神，想起自己早已过世的祖母，想起儿时依偎在祖母怀里的光景，眼眶便红了。有一回，那塞犹那在绿洲边唱了一夜，第二日天明，好些个汉子眼圈都是红的，却谁也不肯说破，只推说风沙迷了眼。端的歌声动人，勾起了各人心底最软的地方。那歌声里像是藏着什么，说不清是喜是悲，只是听了叫人心里发酸。后来那塞犹那离去，绿洲上再没人唱得那般好，人们才明白，当日听了歌红了眼眶，原是难得的福分。"
 SUM_Neo_SGS.5.a:"循教令院发下的旧例"
 SUM_Neo_SGS.5.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Pari_Price:"许愿的代价"
 SUM_SGS_PRO_Pari_Price_desc:"许愿的代价，照例不写在纸上，等愿圆了，才由花灵说出来。有人付得起，有人付不起。这代价端的难料。愿圆之后，那代价才慢慢压上身来，端的躲不过。"
 SUM_Neo_SGS.6.t:"许愿的代价"
 SUM_Neo_SGS.6.d:"许愿的规矩，端的古怪。那许愿要付的代价，照例是不写在纸上的。来求愿的人只管许愿，花灵也只管圆愿，究竟要付出什么，事先一概不说。直等到愿望圆了，花灵才慢慢把代价说出来。这个时候，有人付得起，欣然应允；也有人付不起，当场就傻了眼，悔青了肠子。有个商人求花灵保佑他生意兴隆，果然发了大财，可等花灵说出代价，是要他从此再也尝不到一点甜味，他顿时脸色惨白，连连后退。端的这代价，轻重全看各人的造化。还有个女子，求花灵让久病的丈夫痊愈，代价是把自己一头长发尽数剃去，从此再不能留发。她想了想，竟也应了。丈夫病愈那日，她摸着光滑的头，眼里却是笑。端的代价虽重，各人心里各有一杆秤。"
 SUM_Neo_SGS.6.a:"把账目封存"
 SUM_Neo_SGS.6.b:"把账目摊开"
 SUM_SGS_PRO_Jinn_Scripture:"矫论团的经卷"
 SUM_SGS_PRO_Jinn_Scripture_desc:"矫论团守着几卷经书，写的是花灵与凡人如何共处。经义不深，做起来却难。这道理人人懂，行起来却难。矫论团的人日日诵读，却常说，难在自家身上行。"
 SUM_Neo_SGS.7.t:"矫论团的经卷"
 SUM_Neo_SGS.7.d:"沙丘腰带有一伙人，唤作矫论团，世世代代守着几卷经书。那经书上写的，无非是花灵与凡人该如何相处，哪些事该做，哪些事不该做。经文本身并不深奥，字字句句都好懂，可偏偏做起来难如登天。凡人贪心，得了花灵的好处，还想得更多；花灵心软，明知凡人难缠，却总狠不下心。矫论团的人便夹在当中，这边劝一句，那边劝一句，跑断腿也说不清。有一回两方为一口水闹得不可开交，矫论团翻遍经卷，也找不出个立竿见影的法子，只得先劝两家各退一步。端的知易行难。矫论团的人无奈，只好把经卷上的话翻来覆去地讲，讲得口干舌燥，听的人却左耳进右耳出。有人叹道：经卷好写，人心难调，这句话端的不错。"
 SUM_Neo_SGS.7.a:"按官署的判断行事"
 SUM_Neo_SGS.7.b:"按自己的判断行事"
 SUM_SGS_PRO_Sage_Rashnu:"拉什努的判词"
 SUM_SGS_PRO_Sage_Rashnu_desc:"拉什努，是矫论团里断事的人。他的判词从不说谁对谁错，只说往后怎么过。这判法端的高明。判词一出，两边虽都不服，却也只得照着往下过日子。"
 SUM_Neo_SGS.8.t:"拉什努的判词"
 SUM_Neo_SGS.8.d:"矫论团里有个叫拉什努的，专管断事。凡有花灵与凡人争执不下的事，都送到他跟前。奇怪的是，拉什努下判词，从来不说谁对谁错，也从不追究谁是谁非，他只说往后该怎么过。有人不服，追问到底是谁理亏，拉什努只是笑笑：追究过去，能讨回什么？往后怎么相处，才是正经。原来他看得透彻，这边界上的事，本就难分对错，与其翻旧账伤了和气，不如向前看。经他断过的案子，两方往往都能点头，各自揣着心事回去。端的断事的高明，不在明断，在了局。有一回，一个人为了半亩地的边界闹了三年，告到拉什努跟前。拉什努也不问旧账，只说两家各让一尺，往后和睦相处。那人还想争辩，拉什努摆摆手，便不再听了。端的他断事，只往前看。"
 SUM_Neo_SGS.8.a:"先看住脚下的城"
 SUM_Neo_SGS.8.b:"先看住远方的人"
 SUM_SGS_PRO_Klingsor:"克林索尔的记录"
 SUM_SGS_PRO_Klingsor_desc:"克林索尔，把圣显厅里的东西一件件记下来，记完便封进箱子。他记得清楚，可到底说了多少，没人知道。这人端的守口如瓶。这人端的谨慎。"
 SUM_Neo_SGS.9.t:"克林索尔的记录"
 SUM_Neo_SGS.9.d:"矫论团中有个叫克林索尔的，立下一桩苦差。圣显厅里头藏着许多物件，克林索尔便一件一件地登记在册，写清名目、来历、形状，记完一件，便封进箱子，贴上封条。他记得极仔细，一笔一划从不含糊，仿佛要将那些东西的魂魄都留在纸上。有人问他到底记了多少件，他抬起头，想了想，却缄口不言。究竟说了多少，旁人无从知晓。有人说他是要留一份底账，好叫后人知道；也有人说他另有心事，不肯与人说。端的这个克林索尔，藏着一肚子学问，也藏着一肚子秘密。箱子一只只排开，封条上都有他的手印，谁也不许擅自开启。有人说他这是给自己留后路，也有人说他是怕东西散失，究竟如何，只有他自己心里明白。"
 SUM_Neo_SGS.9.a:"循教令院发下的旧例"
 SUM_Neo_SGS.9.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Buer_Line:"布尔的旧账"
 SUM_SGS_PRO_Buer_Line_desc:"布尔留下一本旧账，记的是雨天与沙天的水位。这账本传到第三代，便断了。这旧账端的稀罕，断了便无处可寻。后来的人想找这本账，却再也找不到了。"
 SUM_Neo_SGS.10.t:"布尔的旧账"
 SUM_Neo_SGS.10.d:"早年有个叫布尔的人，留下一本旧账。那账本上别的不记，专记下雨天与刮沙天的水位高低，哪一日涨了，哪一日落了，一笔一笔，记得清清楚楚。布尔在世时，常拿着这本账，教人看天时、防旱涝，救了不少庄户。他死之后，账本传到了儿子手里，儿子又传给孙子。传到第三代，那孙子对这发黄的旧账全无兴趣，拿它换了半袋枣子。一本记了几十年水位的账，就此断了香火。后来沙地闹起旱灾，人们才想起布尔的那本账，四处去寻找，却再也找不到了。端的前人栽树，后人乘凉；前人记账，后人轻掷。如今那本账早不知流落何方，沙地的人每遇大旱，只能凭老辈的口传估摸天时，再没有那般精细的记录了。"
 SUM_Neo_SGS.10.a:"把账目封存"
 SUM_Neo_SGS.10.b:"把账目摊开"
 SUM_SGS_PRO_Academy_Tent:"帐中学"
 SUM_SGS_PRO_Academy_Tent_desc:"矫论团在帐中讲学，讲的是经卷，也是算术与地理。来听的人不分族，人人可听。这讲学端的开放。帐外风沙呼啸，帐内却静悄悄的，只听得见讲课声。"
 SUM_Neo_SGS.11.t:"帐中学"
 SUM_Neo_SGS.11.d:"矫论团常在中军帐里讲学。他们讲的可不只是经卷上的道理，还教算术，教地理，教人怎么丈量沙丘，怎么辨认星辰。来听课的人，端的什么族都有，有沙漠的，有雨林的，也有走商的，挤在一顶大帐里，不分彼此。讲课的先生也不问你从哪里来，只管从头讲起，听懂了便点头，没听懂便再问。有一回，一个沙漠的孩子和一个雨林的孩子为一道题争起来，争到最后，竟一起笑了起来，成了朋友。端的学问不分家，知识无高低。讲学的先生也不收束脩，只求听的人肯用心。常常一讲就是大半日，讲到兴起处，连沙暴来了也不肯中断。众人便挪到背风处，接着听下去。端的这帐中，装得下各族的人，也装得下各样的学问。"
 SUM_Neo_SGS.11.a:"按官署的判断行事"
 SUM_Neo_SGS.11.b:"按自己的判断行事"
 SUM_SGS_PRO_Dune_Route:"沙丘的商道"
 SUM_SGS_PRO_Dune_Route_desc:"商道沿着沙丘的脊走，昼伏夜行。走熟了这条路的人，闭着眼也知道哪一段会塌。这经验端的难得。那塌了的沙段，走错一步便要埋进沙里，端的凶险。"
 SUM_Neo_SGS.12.t:"沙丘的商道"
 SUM_Neo_SGS.12.d:"沙丘腰带有一条商道，端的凶险。那路沿着沙丘的脊背走，两边都是陡坡，一不小心便滚下去。白日里太阳毒辣，沙子烫脚，商队便昼伏夜行，趁月亮出来才赶路。走熟了这条道的人，本领大得很，闭着眼睛也知道哪一段沙松，哪一段会塌。老驼夫走在头里，脚下一踩，便知虚实，遇到要塌的路段，远远就绕开。有一回，一个年轻的商队不听劝，硬走了一段险路，果然沙塌下去，险些连人带货埋进沙里，多亏老驼夫赶到，才把人拽了上来。端的这条路，靠的是经验二字。老驼夫说，走这条道有一样诀窍：脚感。踩上去虚飘飘的，便是要塌；踩上去实沉沉的，方能落脚。年轻的听着，只当是玄虚，直到自己陷了一次，才信了这话。"
 SUM_Neo_SGS.12.a:"先看住脚下的城"
 SUM_Neo_SGS.12.b:"先看住远方的人"
 SUM_SGS_PRO_Water_Halt:"路上的水驿"
 SUM_SGS_PRO_Water_Halt_desc:"每隔一日路程，便设一处水驿。水由矫论团管，取水要记账。这水驿端的要紧，行路全靠它。水驿之间相隔一日路，恰好让人赶得及，端的安排得巧。"
 SUM_Neo_SGS.13.t:"路上的水驿"
 SUM_Neo_SGS.13.d:"那条商道上，每隔一日路程，便设着一处水驿。那水驿里头储着清水，专供过往的商队人马解渴。水由矫论团掌管，取一桶水，便要记一笔账，写明哪支商队，取了多少，几时取的。这规矩立得严，为的是怕有人贪心，多占了水，叫后来的人没得喝。有一回，一队商人不服，想偷偷多取几桶，被管驿的人当场拦下，按规矩补了账，还罚了钱。众商队见了，从此都规规矩矩，取水时排起长队。端的这水账，救了不少人的命。水驿的屋子用土坯垒成，屋顶架着草席，为的是遮阳。屋后的沙地里埋着陶罐，储的水便从不多的泉眼一罐罐运来。管驿的人日夜守着，夜里还要提灯巡一圈，怕有人偷水，也怕沙子埋了井口。"
 SUM_Neo_SGS.13.a:"循教令院发下的旧例"
 SUM_Neo_SGS.13.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Camel_Hire:"雇驼"
 SUM_SGS_PRO_Camel_Hire_desc:"外邦的商队，雇本地的驼与驼夫，价钱写在契上。契若是丢了，就得照市价重付。这契约端的要紧。有那贪便宜不立契的，事后被索要高价，叫苦不迭。"
 SUM_Neo_SGS.14.t:"雇驼"
 SUM_Neo_SGS.14.d:"外邦来的商队，到了沙丘腰带，人生地不熟，少不得要雇本地的骆驼与驼夫。那价钱是白纸黑字写在契上的，明明白白，双方画了押。可这契约有个要紧处：一旦丢了，便无凭无据，得照当下的市价重新付钱。而那市价，往往比先前说好的高出一大截。有些粗心的商人，把契揣在怀里，结果过河时弄湿了，或者歇脚时弄丢了，第二日驼夫便涨了价，口口声声说按市价。那商人叫苦不迭，却也无可奈何，只得忍痛多掏银子，心疼得直咧嘴。端的这契约，端的要收好。驼夫们也有自己的规矩：契在，便按契办；契不在，便按市价，决不赊欠。外邦人初来时不信，吃过一两次亏，也就学乖了，把契看得比钱还重。"
 SUM_Neo_SGS.14.a:"把账目封存"
 SUM_Neo_SGS.14.b:"把账目摊开"
 SUM_SGS_PRO_Salt_Trade:"盐与香料"
 SUM_SGS_PRO_Salt_Trade_desc:"沙丘腰带，出口的是盐与香料，换回来的是铁与布。这一进一出的差价，养活了半条路。这买卖端的划算。盐与香料出去，铁与布回来，一来一往，路便养活了。"
 SUM_Neo_SGS.15.t:"盐与香料"
 SUM_Neo_SGS.15.d:"沙丘腰带这地方，日子过得倒也滋润。他们往外出口的，是沙漠里出产的盐与香料，这些东西别处稀罕得很；换回来的，是铁与布，都是沙地里造不出的紧俏货。这一来一往，里的差价可观，端的养活了半条商道上的人。驼夫、脚夫、客栈、水驿，都指着这点差价过活。有一年香料丰收，换回来的铁多了，铁价便跌了，商人们又赶紧改换别的货，另寻利市。就这么着，一车车盐和香料运出去，一车车铁和布运回来，沙丘腰带的日子，便在这往来中一天天过下去。盐从沙湖边晒出，香料从远道贩来，一包一包装上驼背，便是一条财路。铁打成的锄犁，布裁成的衣裳，运到沙地便成了抢手货。这般互通有无，两下里都得好处。"
 SUM_Neo_SGS.15.a:"按官署的判断行事"
 SUM_Neo_SGS.15.b:"按自己的判断行事"
 SUM_SGS_PRO_Merchant_Word:"商户的话"
 SUM_SGS_PRO_Merchant_Word_desc:"几家大商户，在沙丘腰带说话有分量。他们点头的事，官署办得飞快。这商户端的势大。有商户要办的事，只消几句话，官署便立刻照办，端的爽利。"
 SUM_Neo_SGS.16.t:"商户的话"
 SUM_Neo_SGS.16.d:"沙丘腰带有几家大商户，端的财大气粗，说话极有分量。他们若是一齐点了头，便是天大的事，也能办得顺顺当当；他们若是皱一皱眉，官署里便要掂量掂量。有一回，官署想修一段商道，钱粮不足，正愁着，几家大商户聚在一起吃了顿饭，席间点了点头，第二日钱粮便送到了，工程当即开工，速度之快，叫人咋舌。也有那不开眼的小官，想绕过这几家商户自行其事，结果处处碰壁，办事处处卡壳，最后还得乖乖上门求教。端的这些商户，虽无官职，却胜似官职。这几家商户还常在一起商量，把控着盐与香料的价钱，官署想插手也插不进。有人背后叫他们遮天的手，可真要办起事来，还得仰仗他们。"
 SUM_Neo_SGS.16.a:"先看住脚下的城"
 SUM_Neo_SGS.16.b:"先看住远方的人"
 SUM_SGS_PRO_Hall_of_Mystery:"圣显厅"
 SUM_SGS_PRO_Hall_of_Mystery_desc:"圣显厅的入口，被沙埋了半截。进去的人带出来的东西，一半上交，一半不见了。这厅里端的蹊跷。那些不见的东西，人人都猜，却谁也不肯明说。端的蹊跷。"
 SUM_Neo_SGS.17.t:"圣显厅"
 SUM_Neo_SGS.17.d:"圣显厅的入口，被流沙埋了半截。那入口原本高一丈，如今只露出三尺，人得弯腰才钻得进去。里面黑黢黢的，藏着多少东西，没人说得清。进去的人，带出来的物件，一半按规矩上交矫论团，另一半却神不知鬼不觉地不见了，落进了各人的腰包。沙还在不住地往里灌，今日清出来，明早又堆上，仿佛这座厅堂迟早要被黄沙彻底吞没。有一回，一队人进去，费了九牛二虎之力清开入口，才取出几件东西，第二日再去，沙又灌满了，白费了一日的力气。端的这圣显厅，像个填不满的无底洞。矫论团的人也为这事头疼，派了人轮班看守，可沙子是活的，堵也堵不住。有人叹道：这厅堂原是叫沙吞的，人不过暂时借着用用罢了。"
 SUM_Neo_SGS.17.a:"循教令院发下的旧例"
 SUM_Neo_SGS.17.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Key_Slab:"钥匙石板"
 SUM_SGS_PRO_Key_Slab_desc:"有一块石板能开门，这块石板被分成三块，由三方各执一块。这石板端的紧要，少一块便开不了门。三方约定，缺一块便不开门，端的互相牵制。端的难开。"
 SUM_Neo_SGS.18.t:"钥匙石板"
 SUM_Neo_SGS.18.d:"圣显厅有一样了不得的宝贝，是一块能开门的石板。那石板刻着古怪的花纹，往门上一合，沉闭的石门便应声而开。可这块石板，如今分作了三块，端的分成三截。这三块石板，并不在一处，而是由三方各执一块，各自收藏，谁也不肯轻易示人。要想开那石门，非得三块石板合在一处不可，少一块都休想。三方彼此猜忌，谁也不放心把自家的那块交出来，生怕一交出去，便再也要不回，反落个吃亏。于是这门，便常年闭着。端的这块石板，难倒了不知多少英雄。三方约定，每隔几年便聚一次，商议合璧开门的事，可到了日子，总有一方推说有事，不肯带石板来。就这么一年拖一年，石门始终沉睡着。"
 SUM_Neo_SGS.18.a:"把账目封存"
 SUM_Neo_SGS.18.b:"把账目摊开"
 SUM_SGS_PRO_Relic_Record:"遗物入册"
 SUM_SGS_PRO_Relic_Record_desc:"从厅里出来的东西，一律入册，谁挖的、归谁看，都写得清清楚楚。这规矩端的严密。入册之后，谁再想私拿，便有账可查，端的防得严密，谁也瞒不过。"
 SUM_Neo_SGS.19.t:"遗物入册"
 SUM_Neo_SGS.19.d:"圣显厅中掘出的物件，一件也含糊不得。那日内厅门口摆开一张长案，案上摊着厚厚的册子，几个书吏蘸墨守候，笔尖悬在纸上，专等抬东西的人来。凡从厅里抬出的陶片、石碑、金箔，都要先到此案前，问明是何人于何处挖得，再定归何人看管，一一写在册上，画押为凭，方许拿走。有一件巴掌大的金片，两个后生争说是自己先瞧见的，你拉我扯，险些动了拳头。书吏也不偏袒，只把二人名字并排写下，注明同挖同看，日日轮值，日后若生是非，翻册便知。这规矩看着琐碎，实则大有深意：东西一旦入册，便有了主儿，谁也休想私自拿去换了酒钱。端的把一桩最容易生是非的事，用一支笔按平了。"
 SUM_Neo_SGS.19.a:"按官署的判断行事"
 SUM_Neo_SGS.19.b:"按自己的判断行事"
 SUM_SGS_PRO_Hieroglyph:"沙海古文字"
 SUM_SGS_PRO_Hieroglyph_desc:"厅里的字，是古沙漠文，认得的人不到十个。这十个人，如今都在矫论团名下。这学问端的稀罕。这十个人轻易不肯出手，矫论团待他们如上宾。端的稀罕。"
 SUM_Neo_SGS.20.t:"沙海古文字"
 SUM_Neo_SGS.20.d:"圣显厅四壁刻满古沙漠文，弯弯曲曲如蛇行，大的盈尺，小的如拳。这文字传自前朝，如今认得的，天下不及十人。原来矫论团广招饱学之士，把能识古字的尽数收在名下，供着养着，只求他们读得懂墙上的话。有一回厅中新刮出一行字，众人围着束手无策，几个年轻的学士挠头搔耳，谁也念不出。还是矫论团里一位白须老者，搬来矮凳，眯眼看了半晌，伸手一字一字点着念将出来，满堂方恍然大悟，纷纷记在纸上。那老者念罢，又指着一处剥落的字，说此处缺了两笔，众人依言推敲，果然补上，一堂人尽皆叹服。端的应了那句老话：识字的便是掌钥匙的人。其中大有学问。"
 SUM_Neo_SGS.20.a:"先看住脚下的城"
 SUM_Neo_SGS.20.b:"先看住远方的人"
 SUM_SGS_PRO_Sealed_Door:"封着的门"
 SUM_SGS_PRO_Sealed_Door_desc:"厅子最深处，有一扇封着的门，封条是几百年前贴的。一直没有动过。这扇门端的神秘。有人想凑近看看，却被拦了回来，端的不许人碰，连看都不许多看。"
 SUM_Neo_SGS.21.t:"封着的门"
 SUM_Neo_SGS.21.d:"圣显厅越是往里，越是幽深阴凉，走一步便觉寒气逼人。走到尽头，有一扇石门紧紧闭着，门上交叉贴着封条，纸色黄脆，边角卷起，一望便知是几百年前贴下的。这些年来，进出的人不知多少，个个走到门前便止了脚，谁也不敢伸手去揭那封条。有胆大的后生，仗着几杯酒意凑近，指尖刚碰到纸边，便被旁人一把扯住，低声喝道：这门后头的因果，岂是你我敢窥的？那后生缩手不迭，脸上讪讪的。旁人又道：这封条上压着前朝的印，谁揭谁担待不起。那后生听得吐了吐舌头，再不敢看那门一眼。不揭封条，未必是怕，倒是心中存着一份敬畏，知道有些事，不到时候便不该知道。端的把万千好奇，都按在这一纸旧封之下。"
 SUM_Neo_SGS.21.a:"循教令院发下的旧例"
 SUM_Neo_SGS.21.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Sand_Worm_Lore:"沙下的巨虫"
 SUM_SGS_PRO_Sand_Worm_Lore_desc:"沙丘下的巨虫，怕光，只在夜里出来。商队夜行的时候，都绕着它走。这巨虫端的凶猛。老辈人传下话来，夜里行路万不可举火，一举火便招它来，端的要紧。"
 SUM_Neo_SGS.22.t:"沙下的巨虫"
 SUM_Neo_SGS.22.d:"沙丘底下藏着一种巨虫，身躯粗如梁柱，行过处沙面翻涌，最怕的便是光亮。白日里它蛰伏不动，一待天黑，便钻出沙面游走，所过之处沙痕蜿蜒，如犁翻地，沟垄足有半人深。因此商队若是夜里赶路，远远望见沙面有新翻的沟垄，便知巨虫就在近处，当下绕道而行，宁可多走十几里，也不肯从它头顶经过。有一回一支驼队贪近，硬要抄直路，结果惊动了巨虫，满队人畜吓得四散，货箱撒了一沙，驼铃响到天明。后来那队人折回原地，照着老法子绕行，果然一路平安。自此以后，夜行的规矩便添了一条：见沟即绕，不可造次。端的靠这小心二字，保全了多少人命。老驼工又说，那虫虽怕光，却极记仇，若惊扰了它，它能循着气味追出十几里。"
 SUM_Neo_SGS.22.a:"把账目封存"
 SUM_Neo_SGS.22.b:"把账目摊开"
 SUM_SGS_PRO_Sacred_Beast:"沙海圣骸"
 SUM_SGS_PRO_Sacred_Beast_desc:"沙里偶有圣骸兽的遗骸，骨头能制药，也能做兵器。捡到的人多半卖了。这遗骸端的值钱。那骨头拿去熬药，据说能治沙毒，有些还打成了刀，端的稀罕。"
 SUM_Neo_SGS.23.t:"沙海圣骸"
 SUM_Neo_SGS.23.d:"沙漠深处，有时能掘出圣骸兽的遗骨，一对巨角弯如新月，几节脊骨白得像霜，埋在沙里不知多少年。这骨头是稀罕物，懂行的拿去研末，能配出治伤的灵药；巧手的匠人拿来打磨，又能做成锋利的兵器。因此但凡有人捡着，多半不肯留在手里，转手便卖与行商，换几袋摩拉。有一回一个牧羊小孩，在干河床边踢出一截白骨，拿回家中，原本是把骨头当玩意儿踢着走，他爹起先还骂他胡闹，待到连夜背进城里换了钱，方才眉开眼笑，直夸儿子有造化，回来便给孩子买了一头小羊。也有那贪心的，挖出一整副骨架，连夜用车拉走，生怕被人瞧见。这遗骨本是前朝的旧物，如今却成了活人的营生，世事变迁，端的叫人作难。"
 SUM_Neo_SGS.23.a:"按官署的判断行事"
 SUM_Neo_SGS.23.b:"按自己的判断行事"
 SUM_SGS_PRO_Scarab_Swarm:"甲虫成群"
 SUM_SGS_PRO_Scarab_Swarm_desc:"圣甲虫成群的时候，是沙下要松动的前兆。老辈人看虫便知天。这本事端的厉害。老辈人一看虫群，便知地底要动，忙叫众人避开，端的灵验，从未错过一回。"
 SUM_Neo_SGS.24.t:"甲虫成群"
 SUM_Neo_SGS.24.d:"沙海之中，有一种圣甲虫，平日里零零星星并不起眼，在沙粒间爬来爬去。可若有一日，成群的甲虫忽然从沙里涌出，黑压压爬成一片，那便是老辈人说的，沙下要松动了。原来这虫子对地底的动静最是灵敏，沙层一有变动，它们便争先恐后往外逃。所以那些久走沙路的老驼工，一看甲虫成群，便知近日埋伏着沙暴或地陷，赶紧催促众人扎营躲避。有一年甲虫结队而出，老驼工力排众议，硬是把商队拦在原地，众人不解，直抱怨耽误了路程。三日后沙暴果然压境，别处的商队吃了大亏，独这一队安然无恙。众人不由得佩服，纷纷向老驼工赔不是，说往后看虫行事，再不敢轻慢。端的应了那句：老辈看虫能知天，避得风沙一命全。"
 SUM_Neo_SGS.24.a:"先看住脚下的城"
 SUM_Neo_SGS.24.b:"先看住远方的人"
 SUM_SGS_PRO_Pari_Beast:"花灵与兽"
 SUM_SGS_PRO_Pari_Beast_desc:"花灵能与沙里的兽说话，说的是很久以前的事。听懂的兽，便不再伤人。这本领端的奇妙。花灵说上几句，那猛兽便低下头来，端的不肯再伤人，也不再扰商队。"
 SUM_Neo_SGS.25.t:"花灵与兽"
 SUM_Neo_SGS.25.d:"花灵有一种本领，能与沙中的走兽言语。她们说的不是眼前的事，尽是些很久以前的旧话，讲草木如何生，讲沙海如何变，娓娓道来，如唱古谣。那些凶兽听了，竟像听懂了一般，凶性渐渐收敛，连獠牙都收了回去。有一回一只发狂的沙兽，连伤数人，众人束手，纷纷拿起了刀枪。一位花灵却缓步上前，俯身在其耳边低语片刻，说的皆是千万年前的旧事。那兽便伏在地上，再不逞凶，掉头钻入沙中去了。又有一回，一群孩子误闯了兽穴，眼看那兽扑将过来，一位花灵远远唱起古调，那兽竟停住脚步，侧耳听了半晌，慢慢退了回去，孩子们方才脱身。花灵不以力服兽，却以旧情动之，端的比刀枪更高一筹。"
 SUM_Neo_SGS.25.a:"循教令院发下的旧例"
 SUM_Neo_SGS.25.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Beast_Patrol:"护路的人"
 SUM_SGS_PRO_Beast_Patrol_desc:"矫论团雇人护路，护路的人兼着打兽。工钱不高，可管饭。这差事端的稳妥。护路的人白日里赶路，夜里守着篝火，遇上野兽便挺刀而上，端的辛苦。"
 SUM_Neo_SGS.26.t:"护路的人"
 SUM_Neo_SGS.26.d:"商道之上不太平，常有凶兽出没，矫论团便出面雇了一班人来护路。这些护路的人，白日里巡道，遇上凶兽便要提刀上去厮杀，算是一身兼了两样差事。论工钱却是不高，一月下来剩不下几个钱，好在东家管饭，一天三顿有着落，倒也饿不着。于是一些走投无路的汉子，便来投这个差事，图的是个安稳饭碗。有一回一伙人巡到僻静处，撞见两头沙兽，众人齐心协力，挥刀呐喊，堪堪将其赶走，回来各人领了工钱，又吃饱了一顿，也就把方才的凶险丢在脑后。也有那新来的汉子，头一回撞见沙兽，腿肚子直转筋，躲在一旁不敢上前，待众人赶走了兽，方才红着脸爬出来，从此也练出了胆气。这碗饭端的是拿命换的，可在这沙海之中，能有一顿饱饭，也就知足了。"
 SUM_Neo_SGS.26.a:"把账目封存"
 SUM_Neo_SGS.26.b:"把账目摊开"
 SUM_SGS_PRO_Edict_Post:"敕令到沙"
 SUM_SGS_PRO_Edict_Post_desc:"雨林的敕令，送到沙丘腰带，管的是赋税与商路。官署接过来照办，矫论团却不接。这矫论团端的硬气。官署照办不误，矫论团却把敕令搁在一边，端的各行其是。"
 SUM_Neo_SGS.27.t:"敕令到沙"
 SUM_Neo_SGS.27.d:"雨林那边一道敕令，辗转送到沙丘腰带。那敕令上写的，无非是赋税如何征、商路如何管，条条框框，都要沙丘照办。当地官署接过敕令，连忙设案供奉，逐条抄录，真个是照章办事，不敢有误，连夜便张榜晓谕。独有矫论团这一班人，把敕令搁在一旁，看也不看，明言不接这道命令。为首的还把那敕令拿起来，翻看两遍，冷笑一声，掷在案上，说道：这上头的规矩，条条都是替雨林打算，与沙丘何干？众人听了，齐声附和。有人劝他们识时务，他们只冷笑一声：沙丘的事，凭什么由雨林来指手画脚？那官署的人讨了个没趣，只得悻悻而回。一道敕令，接与不接之间，便见出各人的心肠，端的埋下了日后风波。"
 SUM_Neo_SGS.27.a:"按官署的判断行事"
 SUM_Neo_SGS.27.b:"按自己的判断行事"
 SUM_SGS_PRO_Tax_Sand:"沙税的算法"
 SUM_SGS_PRO_Tax_Sand_desc:"沙税按商队计，一年一算。算法是雨林定的，算出来总是雨林多一分。这算法端的偏心。商户明知吃亏，却也无可奈何，端的忍气吞声，谁也不敢去争。"
 SUM_Neo_SGS.28.t:"沙税的算法"
 SUM_Neo_SGS.28.d:"沙丘的赋税，是按商队来收的，一年清算一回。这算法却是雨林那边定下的，算盘珠子由人拨弄，算来算去，到头来总是雨林多占一分便宜。商队的首领们心里明白，却也说不出个所以然，只能在心里叫苦。有一回年终结账，一队商人围着算盘算了半宿，越算越气，最后把算盘一摔：这账分明是欺负咱们不识字！旁边一个老账房却摆手，劝他们声音小些，免得惹祸。众人只得压下火气，按那算式认了。算法操在别人手里，便是明吃亏也只能咽下，端的应了那句：人为刀俎，我为鱼肉。那老账房私下里透个消息，说雨林定的算法里藏着一笔暗账，名目唤作耗损，其实都归了雨林。众人方知不是自己算错，只是被人做了手脚，纵然知晓，也无可奈何。"
 SUM_Neo_SGS.28.a:"先看住脚下的城"
 SUM_Neo_SGS.28.b:"先看住远方的人"
 SUM_SGS_PRO_Forest_Outpost:"雨林的哨所"
 SUM_SGS_PRO_Forest_Outpost_desc:"雨林在商道旁设了哨所，查的是货，也是人。查得多了，商队便改道。这哨所端的扰人。商队无奈，只好绕远路走，多走了几日，端的费时费力。端的恼人。"
 SUM_Neo_SGS.29.t:"雨林的哨所"
 SUM_Neo_SGS.29.d:"雨林在商道两旁，一处接一处设下哨所，名目说是查验货物，实则连过路的人也要盘问再三。今日查这队的货，明日验那人的身，翻箱倒筐，没完没了。有一回一队商人在哨所前被拦了整整一日，货全翻出来摊在地上，日光晒化了香料，损失不小。带队的忍不住争辩几句，那查货的却把眼一瞪，说这是规矩，谁也不许多嘴。商队不堪其扰，索性绕开哨所，另寻小路行走。那些小路本是人迹罕至的荒沙，难走归难走，好歹不用看人脸色。日子一久，原来的大道反倒冷清了，那些哨所就设在空路上，守着一堆无用，几个兵卒对着空荡荡的路面打呵欠。苛政猛于虎，查得紧了，人自然往宽处走，端的把一条好端端的商道，硬生生走荒废了。"
 SUM_Neo_SGS.29.a:"循教令院发下的旧例"
 SUM_Neo_SGS.29.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Clerk_Sand:"书吏的笔"
 SUM_SGS_PRO_Clerk_Sand_desc:"雨林派来的书吏，管着账目，笔一动，数字就变。商户给他起了个不太好听的名号。这书吏端的叫人恨。商户背后都叫他吸血的书吏，端的恨得牙痒。"
 SUM_Neo_SGS.30.t:"书吏的笔"
 SUM_Neo_SGS.30.d:"雨林派了一个书吏，专管沙丘的账目。此人手握一支笔，账本在他手里，笔尖一动，数目便翻云覆雨，说是多少便是多少。商户们敢怒而不敢言，私下里给他起了个难听的名号，背地里唤作吸血笔，只是当面不敢叫出。有一回一户商户的账目，明明已经结清，那书吏笔杆一转，又凭空多出一笔欠账，气得那商户当场发抖，却也无可奈何，只能赔着笑脸求情。旁人看不过去，替他分辩两句，那书吏却把账本一合，说账上写得清清楚楚，若不信，自去雨林告状。账本操于人手，是非便由人捏造，端的叫人齿冷。后来这事传开，众人才明白那书吏的账，从来是看人下菜碟：模样老实的便多算几笔，懂几句官话的便少算些。于是大家凑钱请了个懂账的先生。"
 SUM_Neo_SGS.30.a:"把账目封存"
 SUM_Neo_SGS.30.b:"把账目摊开"
 SUM_SGS_PRO_Vigil_Question:"守望的疑问"
 SUM_SGS_PRO_Vigil_Question_desc:"有花灵问：凡人若一直被人管着，守望还有什么意义。祖尔宛听了，却一直没有回答。这一问端的戳心。这句话问出来，四周一时寂静，端的叫人无言以对。"
 SUM_Neo_SGS.31.t:"守望的疑问"
 SUM_Neo_SGS.31.d:"一日，众花灵聚在一处，其中一位忽然开口，问出一个憋了许久的问题：凡人若世世代代被人管着，咱们这般苦苦守望，究竟还有什么意义？此言一出，四下寂然，连风沙都似停了。众人把目光投向祖尔宛，盼她有个说法。谁知祖尔宛沉默良久，始终没有答话，只是望着远处沙丘，仿佛在想什么极远的事。问话的花灵站在原地，脸上写着不甘，却也不再追问。旁边一位年长的花灵轻叹一声，说这问题她也曾想过，只是想不出答案，索性不想了。那提问的花灵却不肯罢休，又道：咱们守着，是为凡人好；可若凡人自己不肯好，咱们这般守，岂不是一厢情愿？不回答也是一种回答，这一问便如一颗石子，投进了花灵们长久平静的心湖，荡开圈圈涟漪。"
 SUM_Neo_SGS.31.a:"按官署的判断行事"
 SUM_Neo_SGS.31.b:"按自己的判断行事"

 #### 独立之路 ####
 SUM_SGS_IND_The_Vigil_Ends:"守望有尽"
 SUM_SGS_IND_The_Vigil_Ends_desc:"花灵守了几百年，守的是凡人能自己站起来那一天。如今雨林的敕令压着沙丘腰带，压得凡人的腰都弯了。花灵不再替人做决定，可这一次，她们头一个站到了前面。"
 SUM_Neo_SGS.32.t:"守望有尽"
 SUM_Neo_SGS.32.d:"花灵守住这片沙海，已不知几百年的光阴。她们守的，原是等凡人有朝一日能自己站起来，不必再仰人鼻息。可如今雨林的敕令一道道压来，压在沙丘腰带上，压得凡人的腰越弯越低，连头都不敢抬。往日花灵从不替人拿主意，凡事都由凡人自决。可这一回不同，她们竟头一个站到了众人前面，站在了敕令与凡人之间。有凡人瞧见，惊得说不出话，只道花灵向来不问世事，今日怎的变了。花灵却不多解释，只把那些被雨林逼得抬不起头的百姓，一个个扶了起来。守了几百年不动的花灵，为何一朝挺身？只因她们看得明白，再不站出来，凡人便要永世直不起腰来。端的应了那句：忍到无可忍处，便是翻身之时。"
 SUM_Neo_SGS.32.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.32.b:"把盟约收进箱底"
 SUM_SGS_IND_Pari_Council:"花灵与众议"
 SUM_SGS_IND_Pari_Council_desc:"花灵头一回开口，向凡人说话。说的是：你们的事，你们自己定。这话端的痛快。凡人听了，先是不敢信，后来才敢抬头说话，端的开了新例，从此不必事事听神吩咐。"
 SUM_Neo_SGS.33.t:"花灵与众议"
 SUM_Neo_SGS.33.d:"那一日，沙丘腰带的凡人聚在圣显厅前，心中七上八下，不知等待他们的是什么。忽然之间，一位花灵缓步走出，头一回开口，对凡人说起话来。众人屏息静听，连咳嗽都不敢。只听她言道：你们的事，你们自己定。简简单单一句话，落在众人耳中，却如惊雷一般。众人你看看我，我看看你，几乎不敢相信自己的耳朵。有个老者颤声问道：这话当真？花灵点了点头，目光扫过全场，缓缓说道：你们脚下这条路，你们自己走；你们头上的天，你们自己撑。花灵几百年来只在暗处守望，从不在人前插嘴，今日这番话，端的破天荒头一遭。众人先是一怔，继而欢呼声响成一片，压了多年的闷气，一朝吐了出来。"
 SUM_Neo_SGS.33.a:"召集部族共商"
 SUM_Neo_SGS.33.b:"等官署先松口"
 SUM_SGS_IND_Zurvan_Word:"祖尔宛的一句话"
 SUM_SGS_IND_Zurvan_Word_desc:"祖尔宛只说了一句：守着不动，也是一种偏袒。说完，便退回沙下去了。这话端的通透。话音落下，沙下便再无声息，众花灵面面相觑，端的决绝。端的决绝。"
 SUM_Neo_SGS.34.t:"祖尔宛的一句话"
 SUM_Neo_SGS.34.d:"众人正议论纷纷，你一言我一语，莫衷一是。忽见祖尔宛现身，她并不长篇大论，只淡淡说了一句：守着不动，也是一种偏袒。此言落地，众人还未及回味，她身形一晃，便退回沙下，再不见踪影，只留沙面一道浅浅的纹路，转瞬被风抹平。众人站在原地，回味她那句话，越想越觉惭愧。有人低声道：原来咱们先前只盼着花灵替咱们拿主意，却忘了自己的事，本该自己担当。这一句，端的把众人心里最后一点依赖，也敲得粉碎。祖尔宛这一句，是把花灵往日的沉默也算了进去，端的振聋发聩。原来不偏不倚，有时恰是最大的偏袒，因为她明明白白地告诉众人：袖手旁观，便等于站在了压迫者一边。"
 SUM_Neo_SGS.34.a:"备好兵与粮"
 SUM_Neo_SGS.34.b:"多派几趟使节"
 SUM_SGS_IND_Jinn_Alliance:"矫论团入盟"
 SUM_SGS_IND_Jinn_Alliance_desc:"矫论团把经卷摊开，说经义讲的正是这一天。于是他们入了盟。这入盟端的顺理成章。经卷既已摊开，众人也便不再迟疑，当场立誓入盟，端的干脆。"
 SUM_Neo_SGS.35.t:"矫论团入盟"
 SUM_Neo_SGS.35.d:"矫论团那班饱学之士，听得花灵与凡人这番举动，纷纷把经卷摊将开来，逐字逐句比对，有的念出声，有的拿笔圈点。为首的长老翻到一卷古册，指着其中一行，高声念道：民之事，民自决之，神惟旁观。念罢，合上经卷，环视众人，说道：这不是正合了今日之事么？一时间和者甚众。果然在古老经义中寻着印证，说经上讲的，正是今日这一天。于是他们再无迟疑，当下决意入盟，与沙丘腰带众人站在一处，当日便把名册送到圣显厅，愿听调遣，连那几个素来傲慢的学者，也低下了头。矫论团向来心高，不肯轻易附和，如今连他们都引经据典地赞成了，可见这桩事果真是顺天应人，端的应了那句：得道者多助。"
 SUM_Neo_SGS.35.a:"把旗立起来"
 SUM_Neo_SGS.35.b:"把旗先卷起来"
 SUM_SGS_IND_Wish_End:"不再许愿"
 SUM_SGS_IND_Wish_End_desc:"花灵宣布：从今往后，不再替人圆愿，凡人的愿，由凡人自己圆。这话端的干脆。凡人听了这话，起初面面相觑，后来都点了头，端的干脆，从此不再求神圆愿。"
 SUM_Neo_SGS.36.t:"不再许愿"
 SUM_Neo_SGS.36.d:"花灵当众宣布一桩大事：从今往后，不再替凡人圆愿。凡人心中有什么愿望，不必再来求神，凡人的愿，就由凡人自己去圆。有凡人听了，先是欢喜，继而发愁，说道：往日有神明替咱们圆愿，如今神不管了，万一圆不成，却怎生是好？花灵答道：圆得成圆不成，都是你们自己的事，自己担着，才算是真正站了起来。此言一出，众人先是错愕，继而悟出其中深意，纷纷点头。有几个年轻人当场便立下心愿，说要靠自己的力气，把沙丘的井凿得更深，把商道修得更平。这并非花灵撒手不管，倒是把许愿的责任，交还到凡人自己手中。往日求神赐福，得之侥幸，失之怨天；如今愿望自己挣来，成败都在自身，端的是让人挺直腰杆做人。"
 SUM_Neo_SGS.36.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.36.b:"把盟约收进箱底"
 SUM_SGS_IND_Pari_Blessing:"花灵的祝福"
 SUM_SGS_IND_Pari_Blessing_desc:"花灵不替人办事，却给了沙丘腰带一样东西：遇事不必先问神的底气。这底气端的宝贵。这底气不是别的，是遇事自己拿主意的胆量，端的难得，比什么都珍贵。"
 SUM_Neo_SGS.37.t:"花灵的祝福"
 SUM_Neo_SGS.37.d:"花灵既已不再替凡人办大小事务，却并未一走了之。她们给沙丘腰带留下一样东西，不是金银，不是刀枪，而是一股底气。这底气，不在金银堆里，也不在刀枪刃上，却扎在每个人心窝里。凡是有了这底气的，遇事便不慌不忙，不再像从前那般，遇事先跑去问神，问完了还要看神的颜色。这底气便是：往后遇事，不必先问神明许可，凡人自己拿主意便是。这股底气看不见摸不着，却比什么都珍贵。有了它，凡人遇事不再惶惶然仰人鼻息，而是敢作敢当，连说话的声音都响亮了几分，有个从前的老怯懦，如今竟敢当着众人争辩道理，谁也说他不倒。端的如人得了主心骨，走路都稳当几分。这事端的蹊跷。"
 SUM_Neo_SGS.37.a:"召集部族共商"
 SUM_Neo_SGS.37.b:"等官署先松口"
 SUM_SGS_IND_Route_Grip:"把控商道"
 SUM_SGS_IND_Route_Grip_desc:"商道上的水驿与关卡，换成本地人管。过路的照旧要走这条道。这般接管端的妥当。本地人接了手，反倒把水驿打理得更周全，端的争气，过路的商队也都说好。"
 SUM_Neo_SGS.38.t:"把控商道"
 SUM_Neo_SGS.38.d:"沙丘腰带拿定主意，把商道上的水驿与关卡，一概换成本地人来掌管。往日那些外来的官儿，尽数撤走，卷起铺盖走了；换上土生土长的本地人，认得沙路，也懂人情。有新上任的本地驿丞，头一日便把水井淘了一遍，又亲自量了水量，登记在册，比那外来官儿仔细十倍，过往商队见了，无不称便。只是过路的商队照旧要走这条道，买卖往来，一切如常，并不因换了管事的人便断了生计。这换人一节，看着平常，实则关系重大，水驿关卡操在自家手里，赋税去向、过往盘查，便都由自己说了算，再不必看那雨林使节的脸色，也不必按月把账册送去重审。端的把命脉从别人手中，一点点收了回来。"
 SUM_Neo_SGS.38.a:"备好兵与粮"
 SUM_Neo_SGS.38.b:"多派几趟使节"
 SUM_SGS_IND_Toll_Local:"自设税卡"
 SUM_SGS_IND_Toll_Local_desc:"税卡由本地商户合议设立，收来的钱，用来修路与凿井。这钱取之于商，用之于路。钱花了出去，路修得平平整整，井也凿得深，端的实惠，众商户都拍手称快。"
 SUM_Neo_SGS.39.t:"自设税卡"
 SUM_Neo_SGS.39.d:"税卡这一桩事，沙丘腰带的本地商户聚在一处，你一言我一语，合议着设立章程。这税卡设在哪里、收多少、如何收，都是众人商量着定下的，无人独自说了算。众人争到激烈处，也拍过桌子，可末了还是按多数人的意思定了，人人都认这个章程。收上来的钱，也不进谁的私囊，一概用来修路凿井。不多时，商道旁的废井修成了新井，塌了的路段也铺平了，过往的人见了，都说这税缴得值。这税取之于民，用之于民，端的与往日雨林那般只知搜刮，大不相同。众人见了这等公道，缴纳起来也心甘情愿。这事传开，四乡的商队都来打听，都说沙丘腰带这税卡，端的比别处公道。也有些精明的商户，主动多了缴些，说修路凿井是好事，多出些也无妨。"
 SUM_Neo_SGS.39.a:"把旗立起来"
 SUM_Neo_SGS.39.b:"把旗先卷起来"
 SUM_SGS_IND_Caravan_Charter:"商队章程"
 SUM_SGS_IND_Caravan_Charter_desc:"立下章程：商队在沙丘腰带内，许进不许抢，违者不许再走这条路。这章程端的严明。章程刻在木牌上，立在路口，谁都看得见，犯了规矩便不准再走，端的明白。"
 SUM_Neo_SGS.40.t:"商队章程"
 SUM_Neo_SGS.40.d:"沙丘腰带立下一条章程，明白晓谕众人：凡商队进入此地，只许规规矩矩做买卖，不许抢劫生事。哪个敢违了这条章程，便永远不许再走这条路，断了它的营生。章程还写在木牌上，立在商道入口，识字不识字的，都叫人念给他听。有个惯会强买强卖的贩子，头一个犯了规矩，当场被逐出商道，货物充公，众人看了，无不咋舌。这章程一出，商道上的风气顿时为之一清，连往年惯会欺行霸市的，也收敛了不少。做买卖讲的是个信字，若纵容抢掠，谁还敢来？这批人若不惩戒，往后人人效仿，商道早晚要变成强盗的窝。如今立下规矩，赏罚分明，端的让商队安心，也让本地百姓得个清静。此事非同小可。"
 SUM_Neo_SGS.40.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.40.b:"把盟约收进箱底"
 SUM_SGS_IND_Mint_Dune:"沙丘铸钱"
 SUM_SGS_IND_Mint_Dune_desc:"开炉铸钱，成色写在钱边上，周边各邦都肯收。这钱端的通行。铸出来的钱，成色足，分量准，拿到别处也认，端的通行无阻。商队带了这钱，走遍周边都不愁花。"
 SUM_Neo_SGS.41.t:"沙丘铸钱"
 SUM_Neo_SGS.41.d:"沙丘腰带要立住自己的计较，便开炉铸起钱来。这铸钱的炉火昼夜不熄，匠人们光着膀子，把铜水注入钱范，一枚枚新钱叮当落地，还带着热气。有匠人专管验成色，每一炉钱铸成，都要抽几枚出来，用锉刀锉开看那成色，锉得对的方许流通，锉不对的便回炉重铸。与别处不同的是，这钱的成色明明白白写在钱边上，成色几何，一望便知，绝无偷工减料。因此周边各邦都肯收这钱，商队拿着它四处通行，无往不利。有一回到周边的邦国，那边的商人拿过钱，就着日头一照，见钱边小字分明，当下便收了，连价都没还。钱上的成色，便是信用的凭据，端的凭这一行小字，赢得了四方的信任。"
 SUM_Neo_SGS.41.a:"召集部族共商"
 SUM_Neo_SGS.41.b:"等官署先松口"
 SUM_SGS_IND_Reserve_Store:"暗仓"
 SUM_SGS_IND_Reserve_Store_desc:"盐与粮，悄悄囤进沙丘深处的暗仓。囤的不是别的，是底气。这暗仓端的要紧。暗仓设在沙丘深处，入口极隐蔽，端的没人找得到，便是自家人也少有人知道。"
 SUM_Neo_SGS.42.t:"暗仓"
 SUM_Neo_SGS.42.d:"沙丘腰带一面铸钱，一面又悄悄囤起粮盐。他们在沙丘深处掘地建仓，仓口掩得极秘，外头丝毫看不出来，只留几丛枯草遮掩。这暗仓入口窄小，仅容一人侧身进出，外头再用乱石堆住，便是有心人路过，也只当是塌了的沙坑。一车车的盐、一袋袋的粮，趁夜运进暗仓，堆积如山，连仓的门都压得沉。管仓的人按月清点，一袋一袋登记明白，谁也不许私自开仓，就是那管仓的自己，也须两人同去，方可开锁。这般囤积，并非为了发财，囤的是一份底气。俗话说手中有粮，心中不慌，一旦风吹草动，有了这些储备，便不至于被人拿住命脉。端的应了那句：有备方能无患。这暗仓平日里无人知晓，待到风声一紧，方才派上用场，端的用心良苦。"
 SUM_Neo_SGS.42.a:"备好兵与粮"
 SUM_Neo_SGS.42.b:"多派几趟使节"
 SUM_SGS_IND_Dune_Guard:"沙丘守军"
 SUM_SGS_IND_Dune_Guard_desc:"把护路的人、矫论团的护法，与各部民兵合编成一支守军。这守军端的齐整。三路人马合到一处，日夜操练，端的成了一支劲旅，把守着商道，端的安稳。"
 SUM_Neo_SGS.43.t:"沙丘守军"
 SUM_Neo_SGS.43.d:"沙丘腰带要护住自家地界，便把几路人马合到一处。那些原本护路的人、矫论团手下的护法，还有各部落抽调的民兵，一概编入册籍，合成一支守军。合编那日，三路人马在沙地上列队，护路的提着刀，护法捧着经卷，民兵扛着长矛，虽是各样打扮，却都听一人号令。这支守军既护商道，也守水驿，遇有事端，便听号令行事，再不各自为战。当下推举了统领，定了哨探、传令、接应的章程，又划分了各自巡守的地段，谁管哪一段，都写得清清楚楚。先前各管各的，如遇大敌便各自为战，如今合编一处，号令统一，端的如五指握成拳头，打出去更有力气。这一编，端的把三股散沙拧成了一股绳，往后再遇风雨，便可彼此照应，不至于各自逃散。"
 SUM_Neo_SGS.43.a:"把旗立起来"
 SUM_Neo_SGS.43.b:"把旗先卷起来"
 SUM_SGS_IND_Pari_Scout:"花灵的眼"
 SUM_SGS_IND_Pari_Scout_desc:"花灵能借风鸟与沙兽的眼睛，替守军看路。她们看，却不说。这般守望端的尽职。花灵看得远，却不多嘴，只在心里记下，端的稳重，守军得了消息，也好预先防备。"
 SUM_Neo_SGS.44.t:"花灵的眼"
 SUM_Neo_SGS.44.d:"守军巡路，还有一样别人没有的帮助。花灵能借风鸟与沙兽的眼睛，替守军远远探看道路。哪条路上有埋伏，哪处沙丘藏着凶险，她们看得清清楚楚，比人眼还准。有一回，花灵借着风鸟的眼睛，看见远处沙丘后头伏着一伙歹人，在哪里扎了营，守军依着那方向摸去，果然拿了个正着。只是她们看了，却不说出来，从不当场指点，任凭守军自己去判断，因为她们明白，凡事都由凡人自己拿主意，才是正经。为何要看而不说？原来花灵不愿再替凡人做决定，只把消息藏在风里，让有心人自己去领会。端的守住了分寸，既不越界，也不误事。守军得了这等帮助，巡路时胆气便壮了几分，只是人人都记着，不可依赖太过，终究还要靠自己的眼睛。"
 SUM_Neo_SGS.44.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.44.b:"把盟约收进箱底"
 SUM_SGS_IND_Beast_Handler:"驭兽人"
 SUM_SGS_IND_Beast_Handler_desc:"驯沙兽的人，从矫论团里选。驯好的兽，能负辎重，也能冲阵。这沙兽端的有用。驯好的沙兽，负重远行不在话下，冲起阵来更是凶猛，端的了得，敌军见了都怕。"
 SUM_Neo_SGS.45.t:"驭兽人"
 SUM_Neo_SGS.45.d:"守军之中，要挑人驯养沙兽。这驯兽的人选，却是从矫论团里挑出来的。原来矫论团中多有懂古法、通兽性的能人，识得古法，懂得兽语，知道沙兽什么时候发怒，什么时候温顺，驯起来自有一套手段，由他们来驯兽，再合适不过。驯好的沙兽，平日里能驮负辎重，跟着商队跋涉；一旦临阵，又能披上鞍甲，直冲敌阵，端的如虎添翼。有一回商队遇上劫匪，那几头沙兽披鞍冲阵，一声长嘶，竟把匪众冲得七零八落，货物分毫未失。用人得当，事半功倍，这般安排，端的把矫论团的本事，用在了刀刃上。自此沙丘腰带，端的有了自己能冲阵的兽骑。那沙兽越是驯得熟，临阵越是听话，比寻常战马还要稳当，端的成了一支奇兵。"
 SUM_Neo_SGS.45.a:"召集部族共商"
 SUM_Neo_SGS.45.b:"等官署先松口"
 SUM_SGS_IND_Storm_Drill:"风沙操演"
 SUM_SGS_IND_Storm_Drill_desc:"操演专挑风沙天，练的是辨向与结阵。练熟的人，风越大越稳。这本事端的难得。起初兵士们在风里睁不开眼，练得久了，竟能迎风站立，端的长进，主帅看了连连点头。"
 SUM_Neo_SGS.46.t:"风沙操演"
 SUM_Neo_SGS.46.d:"守军操演，专挑起风沙的日子。别人躲风沙还来不及，他们偏要在黄沙漫天里演练。练的是两样本事：一是辨明方向，不被风沙迷了路；二是结阵而立，彼此照应不乱，为的是到了战场上，乱军之中也能认得自己人，不至于自相践踏。练得熟了的人，风越大反倒越稳，站在沙暴里纹丝不动，连眼睛都不眨。也有些新兵起初站不稳，被风沙吹得东倒西歪，练得久了，竟也能在狂风里扎住马步，纹丝不动。平日练兵挑好天气，上了战场一遇风沙便慌了手脚；如今偏在恶劣天气里磨炼，端的把本事练到了骨头里，临阵方能从容。这般练法，看似苦楚，实则大有道理：平日里多流汗，战时才少流血。众人练得一身硬本事，后来遇上沙暴里的恶战，端的没有一人慌乱。"
 SUM_Neo_SGS.46.a:"备好兵与粮"
 SUM_Neo_SGS.46.b:"多派几趟使节"
 SUM_SGS_IND_Water_Guard:"守泉的人"
 SUM_SGS_IND_Water_Guard_desc:"水驿都派了人守，守的是水，也是这条商道的命。这守水端的要紧。守水的人日夜不离，连夜里都要巡上几遍，端的辛苦。这水便是商道的命，守水就是守命。"
 SUM_Neo_SGS.47.t:"守泉的人"
 SUM_Neo_SGS.47.d:"商道沿线每一处水驿，都派了专人把守。这守驿之人，守的不光是那一汪清水，守的是过往人畜的性命，更是整条商道的命脉。沙漠之中，水便是命，一处水驿若失了守，商队便可能渴死在半路，连尸首都寻不着。有一年，一处水驿的守卒擅离了岗，结果一队商人在沙里迷了路，险些全队渴死，事后那守卒被重重责罚，众人方知守驿的干系，端的重大。因此守驿之人，个个恪尽职守，昼夜不离，连睡觉都睁着一只眼。每处水驿还备了水牌，记着往来人数，日日核对，谁多喝了谁少喝了，都要问个明白。守水便是守命，端的把这些无名小卒的干系，看得比什么都要紧。端的把这一方水土，护得铁桶也似，过往商队无不称颂。"
 SUM_Neo_SGS.47.a:"把旗立起来"
 SUM_Neo_SGS.47.b:"把旗先卷起来"
 SUM_SGS_IND_Proclaim:"沙丘的告示"
 SUM_SGS_IND_Proclaim_desc:"告示用古沙漠文与通行文各写一遍，贴在每处水驿的墙上。这告示端的周全。告示贴出去，识字的人便念给不识字的听，一传十，十传百，端的无人不知。"
 SUM_Neo_SGS.48.t:"沙丘的告示"
 SUM_Neo_SGS.48.d:"新立的规矩章程，要让人人知晓，便写了告示。这告示却不只用一种文字，而是古沙漠文与通行文各写一遍，贴在每一处水驿的墙上，任人观看。那告示写得明明白白，凡商队入境有哪些规矩，纳税几成，违了如何处置，一条一款，都列在上头。识得古字的，读那古沙漠文；只识通行文的，也能看个明白。有个不识字的老商，站在墙下听了半日，回头对同伴说：这回倒好，连我这样的，也能听懂了。为何要写两遍？原来沙丘腰带的人心不齐，文字也杂，若只写一种，便有一半人看不懂。如今两样并贴，端的周全，叫谁都不能推说不知。后来别处也学着样，把告示写成两样文字，端的成了沙丘腰带的一桩规矩，再没人因看不懂而吃亏。"
 SUM_Neo_SGS.48.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.48.b:"把盟约收进箱底"
 SUM_SGS_IND_Raise_Banner:"举灵光旗"
 SUM_SGS_IND_Raise_Banner_desc:"沙丘腰带，立起自己的旗，旗上是灵光的纹样。这旗端的提气。旗一升起，远远便能望见，众人看了精神一振，端的提气。这一面旗，便是沙丘腰带自立的意思。"
 SUM_Neo_SGS.49.t:"举灵光旗"
 SUM_Neo_SGS.49.d:"沙丘腰带既已自立，便立起了自己的旗帜。那旗幡在风里猎猎作响，旗面上绣着灵光的纹样，一圈圈光晕，宛若花灵周身的光华，远远望去便认得出。那旗是众人一针一线缝出来的，绣了整整七日，旗面上还缀着各部的标记，意思是沙丘腰带各部，从此是一家。这旗一立，沙丘腰带便有了自己的名号，众人望见旗，心中便有了依靠，走路都添了几分精神。自此每逢商队经过，望见那旗，便知到了沙丘腰带的地界，心中先自安了一半。旗者，众心所向也，端的把分散的人心，聚在了一面旗上。那旗一立，端的成了沙丘腰带的魂。众人约定，旗在人在，旗若倒了，便合力再扶起来。往后每逢集会，众人先向那旗行礼，方才议事，端的把一面布，看成了自家的根本。"
 SUM_Neo_SGS.49.a:"召集部族共商"
 SUM_Neo_SGS.49.b:"等官署先松口"
 SUM_SGS_IND_Reject_Edict:"拒受敕令"
 SUM_SGS_IND_Reject_Edict_desc:"敕令送到水驿，被当众卷起来，还给了信使。信使捧着卷轴，站了很久。这场面端的难堪。信使无奈，只好捧着卷轴回去，端的没趣，话也不敢多说一句。"
 SUM_Neo_SGS.50.t:"拒受敕令"
 SUM_Neo_SGS.50.d:"雨林的敕令，又送到沙丘的水驿上来。这一回，守驿的众人当着信使的面，把那敕令卷将起来，原封不动，还给了信使。信使捧着卷轴，愣在当场，站了许久，竟不知如何是好，脸上红一阵白一阵。他张了张嘴，想要说些什么，却见众人神色坚决，一个字也劝不进去，只得一肚子气闷在心里。这一卷一还之间，端的把沙丘腰带的心意，表露得明明白白：从今往后，雨林的话，咱们不听了。那信使怔了半晌，只得闷闷收起卷轴，转身复命去了，走的时候，还忍不住回头望了一眼那面新立的旗，脚下却不敢停。那信使回至雨林，把沙丘一卷还敕的事，一五一十说了。雨林那边听了，勃然大怒，可沙丘远在沙漠深处，一时也奈何不得，只得暂且按下，端的不甘。"
 SUM_Neo_SGS.50.a:"备好兵与粮"
 SUM_Neo_SGS.50.b:"多派几趟使节"
 SUM_SGS_IND_Redraw_Border:"重定界"
 SUM_SGS_IND_Redraw_Border_desc:"商道两侧的地界，重新划过，把雨林的哨所圈在外头。这划界端的巧妙。哨所被圈在外头，雨林的人看了干瞪眼，却也无可奈何，端的解气，从此商道便归自家管了。"
 SUM_Neo_SGS.51.t:"重定界"
 SUM_Neo_SGS.51.d:"沙丘腰带把商道两侧的地界，重新划定一番，立了界碑，写明四至。界碑用青石凿成，字迹刻得深深的，风吹日晒也不怕，四至写明，东到哪里，西到哪里，一丝不含糊。这一划不打紧，竟把雨林先前设下的那些哨所，统统圈到了界外。哨所本在道上，如今道归了沙丘，哨所便成了界外之物，再无由头插手商道上的事。雨林那边得知，也没有办法，总不能越过界线来拆哨所，只得由它去。这重划地界，端的釜底抽薪，不与你争吵，只把界线一挪，叫你的哨所名不正、言不顺，自己就撤了。端的谋定而后动。端的应了那句：不战而屈人之兵。雨林那几个哨所，没费一兵一卒，便自己撤了个干净，端的干净利落。"
 SUM_Neo_SGS.51.a:"把旗立起来"
 SUM_Neo_SGS.51.b:"把旗先卷起来"
 SUM_SGS_IND_Final_Word:"祖尔宛的最后一句"
 SUM_SGS_IND_Final_Word_desc:"祖尔宛在众议上，说了最后一句：凡人的路，从今往后，由凡人自己走。这话端的斩钉截铁。说完，祖尔宛便不再言语，众人把这话记在心里，端的郑重。"
 SUM_Neo_SGS.52.t:"祖尔宛的最后一句"
 SUM_Neo_SGS.52.d:"众议之上，众人各抒己见，议论纷纷，从日中争到日偏。待到将要散会，祖尔宛忽然开口，说出最后一句话：凡人的路，从今往后，由凡人自己走。言罢，她再不多言，四下里顿时安静下来，连呼吸都听得见。众人面面相觑，想起这些年受的窝囊气，再看看眼前这花灵，心里都亮堂起来。这一句便是定音之锤，把方才的种种争论，一锤定音。花灵守望几百年的心愿，到此刻方算了结。端的如拨云见日，凡人的前程，从此交还凡人自己手中。有那性急的，当场便问：那雨林的敕令，还认不认？祖尔宛道：既是凡人自己走的路，旁人的敕令，认与不认，也在凡人。众人听了，越发踏实。端的把话说到这个地步，再无半分含糊。"
 SUM_Neo_SGS.52.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.52.b:"把盟约收进箱底"
 SUM_SGS_IND_Envoy_Port:"港口来客"
 SUM_SGS_IND_Envoy_Port_desc:"港口的客商，带来船与价，开口便问：沙丘的盐，走不走海路。这买卖端的大。客商说得天花乱坠，众人听了心动，却不肯轻易答应，端的慎重，毕竟干系不小。"
 SUM_Neo_SGS.53.t:"港口来客"
 SUM_Neo_SGS.53.d:"港口来了外海的客商，带着船只，也带着价钱，找到沙丘腰带的人。这些人开门见山，开口便问：沙丘的盐，走不走海路？原来沙丘的盐质地优良，名头早已传到海上，客商们想用船来贩运，图个厚利。那客商还拿出海图，指着上头的航路说，从沙丘往东，不出十日便可到达大港，那边的价钱，比陆路高出好几成。他们把样品摊在案上，白花花的盐粒在日头下闪。海路一通，销路便宽，沙丘的盐不愁卖不出去。端的应了那句：货好不怕巷子深。众人听了这话，心里都有了几分盘算，有人担心路远难行，有人却已经盘算起明年该晒多少盐。当下众人便与客商约好，先运一批盐试走海路，若成了，再作长远计较。端的把一条新路，从嘴里说到了纸上。"
 SUM_Neo_SGS.53.a:"召集部族共商"
 SUM_Neo_SGS.53.b:"等官署先松口"
 SUM_SGS_IND_Envoy_North:"北国使团"
 SUM_SGS_IND_Envoy_North_desc:"北国的使团，愿意出资修水驿，条件是要在商道上设一处他们的驿站。这条件端的精明。这条件明摆着是要插一脚进来，众人听了，都留了个心眼，端的精明。"
 SUM_Neo_SGS.54.t:"北国使团"
 SUM_Neo_SGS.54.d:"北国派来一个使团，说愿出资帮沙丘修葺水驿。那使团说得天花乱坠，说什么修驿是美意，设站不过便于歇脚，绝不干涉商道上的规矩。可这话听着是好意，他们随身附带的条件，却也不轻：要在商道上设一处他们自己的驿站。沙丘腰带的人哪个是傻的，听得出那话里的弦外之音。天上不会白白掉馅饼，出资修驿是假，借机插足商道是真。当下先摆酒款待，把那使团哄住了，暗地里却召集众人，商议如何回绝。端的应了那句：来者不善，善者不来。为首的答道：那驿站名曰共用，实则处处受制于人，今日容他插足，明日他便反客为主。众人听了，都道有理，当下便定了主意，只嘴上敷衍，到底不肯松口。端的把来者那点算盘，看得透透彻彻。"
 SUM_Neo_SGS.54.a:"备好兵与粮"
 SUM_Neo_SGS.54.b:"多派几趟使节"
 SUM_SGS_IND_Envoy_Rain:"雨林的门"
 SUM_SGS_IND_Envoy_Rain_desc:"对雨林，仍留着一扇门。派去的人，带着商约与账。这余地端的留得妙。门虽留着，门槛却也设得清楚，端的周全。这般留有余地，日后进退皆便。"
 SUM_Neo_SGS.55.t:"雨林的门"
 SUM_Neo_SGS.55.d:"沙丘腰带虽已自立，可对雨林并未把话说死，到底还留着一扇门。他们派了人前往雨林，去的时节，带着商约，也带着账本。带的商约上，写明沙丘的盐仍按旧价供给雨林，账本上也把历年往来一笔笔算清，半分不欠。这商约是买卖的凭据，账目是往来的明细，端的摆出一副生意人的样子：咱们虽有别扭，买卖却照做。留这一扇门，是有分寸的举动，不把事做绝，日后也好转圜。有人问为何不把话说绝，为首的答道：今日把门关死了，明日想通买卖，连个说话的地方都没有，留一线，到底是给自己留的。临行前，众人叮嘱：话要说软，理要站硬，莫坠了沙丘腰带的名头。使者诺诺连声，收拾停当便上了路。端的把一扇门，留得周周全全。"
 SUM_Neo_SGS.55.a:"把旗立起来"
 SUM_Neo_SGS.55.b:"把旗先卷起来"
 SUM_SGS_IND_Buy_Iron:"购军械"
 SUM_SGS_IND_Buy_Iron_desc:"向外邦买铁与火，用沙丘的盐与香料抵价。这买卖端点划算。铁与火买回来，打造兵器，修筑城郭，端的实用。沙丘不产铁，这一笔买卖，端的紧要。"
 SUM_Neo_SGS.56.t:"购军械"
 SUM_Neo_SGS.56.d:"沙丘腰带要置办军械农具，少不了铁，也少不了火。这铁与火，端的比什么都紧，没有铁，铸不出农具兵器；没有火，炼不成铜钱开不了炉。可这些东西本地不出产，只得向外邦去买。拿什么抵价呢？便是沙丘盛产的盐与香料。这一物换一物，各取所需，外邦得了稀罕的盐香料，沙丘得了要紧的铁与火。有一回外邦的商队运来一车铁锭，沙丘这边抬出上好的盐砖与香料，两下里验货过秤，各取所需，谁也不吃亏。通商之道，贵在互通有无，端的把这沙漠里的出产，换成了立身的本钱。他们还与外邦约下，往后盐香料照旧供给，铁火也照旧换来，公平交易，两下里都得好处。有个老商户掐着指头算了算，说这一趟买卖，端的比往年任何一回都划算。"
 SUM_Neo_SGS.56.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.56.b:"把盟约收进箱底"
 SUM_SGS_IND_Scout_Forest:"探雨林"
 SUM_SGS_IND_Scout_Forest_desc:"派人去雨林，只学一件事：教令院在沙丘，还有几处脚跟。这打探端的要紧。这探子去时扮作行商，一路小心，端的机警。教令院根基深浅，端的要查明白。"
 SUM_Neo_SGS.57.t:"探雨林"
 SUM_Neo_SGS.57.d:"沙丘腰带派人前往雨林，此去不为别的，只为打探一桩消息：教令院在沙丘地带，究竟还留着几处脚跟。原来教令院势力盘根错节，明面上虽退了，暗地里未必干净。有人曾在沙丘见过教令院的人，穿着便服，称是来考查学问，可行踪诡秘，谁也摸不准底细。这几个探子扮作商旅，一路留心查访，见到熟悉的面孔便记在心里，务要把教令院残存的据点，摸个清清楚楚。临行前，为首的千叮万嘱，说这一趟只许看，不许露痕迹，万万不可打草惊蛇。知己知彼，方能百战不殆，端的把这探查的差事，看得极重。临行前，为首的又定下暗号，凡有教令院的人出没，便在路边石上画一记，后来人见了便知。端的把探查的事，安排得细细致致。"
 SUM_Neo_SGS.57.a:"召集部族共商"
 SUM_Neo_SGS.57.b:"等官署先松口"
 SUM_SGS_IND_Declaration:"沙丘腰带宣布独立"
 SUM_SGS_IND_Declaration_desc:"灵光旗升上了水驿的旗杆。花灵没有到场，只托风鸟带来一片羽毛，落在旗上。矫论团的人把告示念了两遍，念完，把敕令卷起来，交给了等在门外的信使。这一日端的轰动。端的一时传遍。"
 SUM_Neo_SGS.58.t:"沙丘腰带宣布独立"
 SUM_Neo_SGS.58.d:"那一日，灵光旗缓缓升上水驿的旗杆，猎猎飘扬。花灵并未亲至，只托一只风鸟衔来一片羽毛，轻轻落在旗面上，算是到场。那羽毛飘飘摇摇，落在旗面上，谁也不知从何而来，众人见了，都道是花灵的心意，心中越发敬重。矫论团的人当众把告示念了两遍，声音洪亮，一字一顿。念罢，当场把雨林的敕令卷将起来，交给等在门外的信使。那信使接了卷轴，抬眼望望旗上的羽毛，又看看围立的众人，张了张口，终是没说出话来。这一升旗、一落羽、一还敕令，端的把沙丘腰带的自立，办得既体面又周全。那信使捧着卷轴，怏怏而去。那羽毛在旗上停了许久，风来也不吹去，众人越发称奇，都说这是花灵应允的意思。端的把一桩大事，办得叫人心服口服。"
 SUM_Neo_SGS.58.a:"备好兵与粮"
 SUM_Neo_SGS.58.b:"多派几趟使节"

 #### 甲线 · 灵光共鸣 ####
 SUM_SGS_RA_The_Light_Resonance:"灵光共鸣"
 SUM_SGS_RA_The_Light_Resonance_desc:"花灵不替人做决定，却愿意与人同行。有人主张，沙丘腰带的路就该这样走：人定事，花灵在旁，愿由人许，路由人担。这话端的在理。这话端的在理，众人听了都服。"
 SUM_Neo_SGS.59.t:"灵光共鸣"
 SUM_Neo_SGS.59.d:"花灵虽不替凡人做决定，却愿意与人同行。有人便主张，沙丘腰带的路，就该这般走：凡事由人自己定，花灵只在旁边陪着；愿望由人自己许下，路也由人自己去担。这话一出，众人纷纷附和，都说这些年来，大事小事都指望着神，到头来反倒把自己活成了木头人。这话说得极是，既不失了对花灵的敬重，又守住了凡人自主的本分。花灵为伴，不喧宾夺主；凡人为主，也不妄自尊大。有人把这话说给花灵听，花灵只是点了点头，并未多言，可那点头之中，端的含着无限的欣慰。后来这话越传越广，连孩童玩耍时，也学着大人说：这事我自家定。再遇事时，众人果然先自己商量，拿不定主意，方才去问花灵，端的把自主二字，种进了每一个人的心坎里。"
 SUM_Neo_SGS.59.a:"让商路连通四方"
 SUM_Neo_SGS.59.b:"把商路关起来自守"
 SUM_SGS_RA_Rite_Light:"灵光之礼"
 SUM_SGS_RA_Rite_Light_desc:"在圣显厅外的沙地上，办起灵光之礼。礼不长，来的人都带一支蜡烛。这礼端的简单。众人捧着蜡烛，站在沙地上，灯光一点连成一片，端的好看。端的好看。"
 SUM_Neo_SGS.60.t:"灵光之礼"
 SUM_Neo_SGS.60.d:"沙丘腰带要行灵光之礼，便选在圣显厅外的沙地上。那礼节并不冗长，来赴礼的人，各自带了一支蜡烛。众人围拢，将蜡烛一一点燃，沙地上星星点点，映着灵光，风一吹，火苗歪一歪，却都不灭。众人围着烛火，谁也不说话，只听着风沙在外面呜呜地响，心里却觉着从未有过的安宁。一支蜡烛虽小，却象征着各人心中一点光明，聚在一处，便能照破黑暗。端的以简朴见诚意，不在排场，在心到。礼毕，各人把蜡烛捧回，插在自家门前，一路上星星点点，端的把整个沙丘腰带照成了一片光明。后来这烛火的风俗，端的一直传了下去。年年今夜，圣显厅外的沙地上，总有星星点点的烛光，映着灵光，端的照破了满天的黑。"
 SUM_Neo_SGS.60.a:"以契约立信"
 SUM_Neo_SGS.60.b:"以枪杆立威"
 SUM_SGS_RA_Pari_Choir:"花灵的歌"
 SUM_SGS_RA_Pari_Choir_desc:"那塞犹那，教人唱花灵的歌。孩子唱得最准，大人唱得最用心。这歌端的入心。那塞犹那在旁指点，哪里唱高了，哪里唱低了，端的一丝不苟，众人唱得越发齐整。"
 SUM_Neo_SGS.61.t:"花灵的歌"
 SUM_Neo_SGS.61.d:"有个叫那塞犹那的，教众人学唱花灵的歌。这歌儿婉转，孩子学得最快，唱得也最准；大人虽慢些，唱得却最用心。众人起初七高八低，调子怎么也合不拢，直唱到第二遍，才渐渐齐整，汇成一片，连沙里的风都似在跟着和。那塞犹那站在中间，一手打着拍子，一手指点众人，哪里唱高了，哪里唱低了，都逃不过他的耳朵。歌声齐不齐，端的看人心齐不齐，唱到第二遍方齐，正应了众人从生疏到默契的过程。孩子们唱完，还缠着他再教一曲，大人则笑着散去，说这歌儿，唱一回便年轻一回。自那以后，花灵的歌便在沙丘腰带传唱开来，逢年过节，家家户户都要唱上一段，连走夜路的商队，也哼着这调子壮胆。端的把一支歌儿，唱成了众人心里的念想。"
 SUM_Neo_SGS.61.a:"把利润分给城邦"
 SUM_Neo_SGS.61.b:"把利润收归官库"
 SUM_SGS_RA_Shrine_Light:"遍立灵龛"
 SUM_SGS_RA_Shrine_Light_desc:"各处水驿，立一处灵龛，龛前不放供品，只放一盏灯。这龛端的清净。灯昼夜不熄，端的长明。这灯不为供神，只为照路，端的别有深意。"
 SUM_Neo_SGS.62.t:"遍立灵龛"
 SUM_Neo_SGS.62.d:"各处水驿，都立起一处灵龛。这灵龛与别处的神龛不同，龛前并不摆放三牲供品，也不设香火，只安安静静放着一盏灯，灯芯细细，昼夜长明。那灯用的是沙丘自产的灯油，一盏能烧上好几个月，添油的人按时来添，从不间断。为何只放一盏灯？原来花灵不似那些爱吃供奉的神明，她们要的不是牺牲与跪拜，而是人心中的一点明净。那龛前也无人跪拜，过路的人若是累了，便在龛下歇一歇脚，望望那盏灯，心里便踏实了。一盏灯，便是这份心意，端的清淡中见真诚。添油的人也都留心，若见灯芯将尽，便提前来添，从不叫它灭了。夜行的商队望见那一点光，便知离水驿不远，心里先自安了。端的把一盏灯，守得周周全全。"
 SUM_Neo_SGS.62.a:"借水草养人"
 SUM_Neo_SGS.62.b:"借商队养兵"
 SUM_SGS_RA_Pilgrim_Dune:"朝圣之路"
 SUM_SGS_RA_Pilgrim_Dune_desc:"去圣显厅的路，重新走通了。路上的人结伴而行，遇着沙暴便躲进沟里。这路端的难走。结伴而行，遇上沙暴便互相照应，端的稳妥，少了许多凶险。"
 SUM_Neo_SGS.63.t:"朝圣之路"
 SUM_Neo_SGS.63.d:"通往圣显厅的道路，久已荒废，如今被重新走通了。路上行人渐渐多了起来，多是结伴而行，三三两两，互相照应，不至于落单。路上还设了歇脚的石堆，隔上十几里便有一处，行人到了那里，便知离圣显厅又近了一程。走沙漠最怕沙暴，一旦狂风卷沙而来，众人便寻一处沙沟，躲将进去，用布蒙住口鼻，待风头过去再上路。有一回几个孩子贪玩，落在后头，眼看被风沙卷住，亏得前面的大人折回来寻，才把几个孩子一个个拽进沟里，险之又险。这路通了，圣显厅便不再是遥远的旧迹，端的把散落的人心，又重新连在了一处。端的把散落各处的人心，重新连在了一处。路上相识的人，后来多成了朋友，逢年过节还要互相走动，端的把一条路，走成了人情。"
 SUM_Neo_SGS.63.a:"让商路连通四方"
 SUM_Neo_SGS.63.b:"把商路关起来自守"
 SUM_SGS_RA_Festival_Light:"灵光节"
 SUM_SGS_RA_Festival_Light_desc:"每年在圣显厅，办一次灵光节。节日里不办买卖，只办歌与灯。这节端的雅致。到了那日，各处的人齐聚圣显厅，唱歌点灯，端的热闹，连沙丘都似亮了起来。"
 SUM_Neo_SGS.64.t:"灵光节"
 SUM_Neo_SGS.64.d:"沙丘腰带定下规矩，每年在圣显厅办一次灵光节。这节日里有个特别的讲究：不许做生意，不谈买卖，只办歌与灯。节前，众人早早地擦净了圣显厅的石阶，把新采的灯油分装好，孩子们则满地拾干柴，预备夜里点灯。众人聚在一处，唱歌的唱歌，点灯的点灯，热热闹闹，却无半分铜臭，连平日里最爱讨价还价的，也把算盘搁在了家里。一年到头为生计奔波，总要留一日不为衣食，只为心中的欢喜与敬重，端的张弛有度，懂得生活。夜幕一落，圣显厅前灯烛齐明，歌声笑声，隔着几道沙丘都听得见。有老人指着那灯，对孩童说：这光，便是咱们沙丘腰带的心。端的把一年的辛劳，都化作了这一夜的欢喜。"
 SUM_Neo_SGS.64.a:"以契约立信"
 SUM_Neo_SGS.64.b:"以枪杆立威"
 SUM_SGS_RA_Pari_Pact:"与花灵的约"
 SUM_SGS_RA_Pari_Pact_desc:"与花灵立约：人不求神断事，神不替人担责。立约的场面，很安静。这约端的公道。约既立下，人神各守本分，谁也不越界，端的清爽，从此再无怨言。"
 SUM_Neo_SGS.65.t:"与花灵的约"
 SUM_Neo_SGS.65.d:"沙丘腰带与花灵，立下一纸盟约。约上写得明白：凡人不求神明来断是非，神明也不替凡人担那责任。各守本分，互不越界。那盟约用古沙漠文写在石板上，立在各处水驿，识字的人读了，便念给不识字的听，一传十，十传百，人人都知道这约。这立约的场面，并不喧闹，反倒安安静静，众人肃立，连衣角拂动的声音都听得见，心中却都明白这约的分量。立约不靠锣鼓喧天，端的靠这份心照不宣的郑重，安静里头，自有千钧之力。立约那日，花灵只静静立在一旁，待众人写罢，方才微微颔首，便飘然退去。端的这一约，不靠刀枪之威，不靠官爵之势，只凭着众人一颗自愿的心，端的立得稳稳当当。"
 SUM_Neo_SGS.65.a:"把利润分给城邦"
 SUM_Neo_SGS.65.b:"把利润收归官库"
 SUM_SGS_RA_Wish_Rule:"许愿之规"
 SUM_SGS_RA_Wish_Rule_desc:"定下许愿的规矩：愿要写明，代价要写明，写不明的不许许。这规矩端的严明。规矩写明，便无人抵赖，端的公道。这般写法，端的省了许多口舌。"
 SUM_Neo_SGS.66.t:"许愿之规"
 SUM_Neo_SGS.66.d:"许愿一事，也有了新的规矩。凡要许愿，须把愿望明明白白写将出来，还要把代价也一并写明，一个字也含糊不得。若写得含糊不清，模棱两可，那便不许许，任你再三恳求也无用。规矩还写明，愿若许下，便须照着去做，做不到的，要把缘由也说清楚，不能含糊了事。这规矩立得极妙，往日许愿含含糊糊，事后扯皮不断；如今白纸黑字，愿是愿，价是价，端的把一笔糊涂账，变成了明白交易。有个年轻人起初嫌麻烦，后来仗着这规矩，果真讨回了公道，方知这白纸黑字的好处。这规矩还传到别处，邻近邦国听了，也照着立下条文，都说沙丘腰带这法子，端的周全。把许愿这件玄乎事，办成明明白白的交易，端的叫人心服。"
 SUM_Neo_SGS.66.a:"借水草养人"
 SUM_Neo_SGS.66.b:"借商队养兵"
 SUM_SGS_RA_Pari_Teacher:"花灵为师"
 SUM_SGS_RA_Pari_Teacher_desc:"花灵授徒，不教现成答案，只教人怎么发问。她们领着弟子看星、看水、看沙，看的都是同一片天地，可各人问的话不同，领悟便不同。端的授人以渔，不授人以鱼。"
 SUM_Neo_SGS.67.t:"花灵为师"
 SUM_Neo_SGS.67.d:"花灵教凡人本事，教的却是三样：看星、看水、看沙。然而她们并不把这些本事当作答案，直接告诉凡人该怎么如何，只教凡人怎么去看、怎么去问。有花灵说，答案都在天地间，星里有方向，水里藏深浅，沙中记年月，只要会看，处处都是学问。看星识方向，看水知深浅，看沙辨吉凶，学到手了，遇事便自己去寻答案。这端的授人以渔，而非授人以鱼。学会了这三样本事，凡人遇事便能自己去寻答案，不必事事求人，端的把本领交到了各人自己手里。有那聪明的，学了几年，竟能自己推算出沙暴的时辰，端的应了那句：师父领进门，修行在个人。花灵见了，也只是笑笑，从不多夸一句，端的把众人，都当成了能自己走路的人。"
 SUM_Neo_SGS.67.a:"让商路连通四方"
 SUM_Neo_SGS.67.b:"把商路关起来自守"
 SUM_SGS_RA_Witness_Pari:"花灵作证"
 SUM_SGS_RA_Witness_Pari_desc:"立大契那日，特请花灵到场作证。洋洋洒洒的证词，只一句：此事是人自己定的。端的干脆。众人听了，都道这话虽短，却把干系撇得清清楚楚，往后谁也赖不得别人。"
 SUM_Neo_SGS.68.t:"花灵作证"
 SUM_Neo_SGS.68.d:"那大契立下之时，众人请花灵前来作证。花灵的证词极短，只有区区一句：此事，是人自己定的。这一句证词，端的重若千钧。重就重在，它把沙丘腰带的自立，从头到尾，都归到了凡人自己身上，明明白白告诉天地，这沙丘腰带的自立，既非神明所赐，也非外力所迫，乃是凡人自己拿的主意。花灵只在旁作证，不居功，不揽权，那花灵说完，便退到一旁，再不言语，任凭众人如何相请，也不肯多说一个字，端的守住了分寸。当时在场的众人，无不肃然起敬。后来这话被刻在石碑上，立在圣显厅前，凡有经过的，都要停下来读上一遍。这一句话，端的把凡人与花灵的名分，分得清清楚楚：凡人自立，花灵为证，各安其位，毫不含糊。"
 SUM_Neo_SGS.68.a:"以契约立信"
 SUM_Neo_SGS.68.b:"以枪杆立威"
 SUM_SGS_RA_Duty_Split:"各担其责"
 SUM_SGS_RA_Duty_Split_desc:"人管甚么、花灵管甚么，从前是一笔糊涂账，遇事便互相推诿。如今一条条写得清清楚楚，刻在板上，挂在厅前。这规矩一定，谁该办甚么，明明白白，再没人能扯皮。"
 SUM_Neo_SGS.69.t:"各担其责"
 SUM_Neo_SGS.69.d:"沙丘腰带诸城，人与花灵比邻而居，朝夕相见。往日里各管各的，人巡商道、守水井，花灵管花圃、报风信，从无一本明白账。遇上风灾路断，便你推我、我推你，谁也不肯担责任。这推诿的根由，只为各人所司何事，从来不曾写清。这一日矫论团的长老聚众议事，当着众人把人与花灵各管的一桩桩分说明白：某段沙道归人巡，某片花田归灵守；某口井归人挑水，某处风信归灵预报。有花灵剔着花枝问道，倘若沙暴不分人灵，却叫谁去挡。长老道，人挡沙，灵报风，各尽力便是。众人听了，都道有理。恐日久生误，又命书吏将名册重新抄了一遍，一笔一画端端正正，抄成两本，一本留在议事厅，一本交花灵收着。自此谁该管什么，一望便知，再没得相互推口的。"
 SUM_Neo_SGS.69.a:"把利润分给城邦"
 SUM_Neo_SGS.69.b:"把利润收归官库"
 SUM_SGS_RA_Read_Hall:"释读圣显厅"
 SUM_SGS_RA_Read_Hall_desc:"圣显厅里，石壁石板尽是古字。识字的众人一块块释读，读将出来，多的是些旧规矩、旧账目。这些字压在沙下多少年，一朝读出来，竟都是前人算过的老账。端的翻旧账，也是续香火。"
 SUM_Neo_SGS.70.t:"释读圣显厅"
 SUM_Neo_SGS.70.d:"圣显厅中，石壁高耸，上头刻满了古沙漠文，年代久远，苔痕斑驳。矫论团的学者日日仰着脖子，把那些字一块块释读出来。这些字哪里是什么仙文天书，读出来多半是些旧规与旧账：某年某城欠了某城的粮，某口井归谁家挑水，某段商道如何分税。有一块石上刻着罚约，写着偷水者罚羊一只。学者读到此处，忍不住笑出声来。也有那认不全的，便用炭笔描下形状，带回去慢慢琢磨。他们把读出的字一一注在旁，日积月累，厅壁竟像添了一层新注。"
 SUM_Neo_SGS.70.a:"借水草养人"
 SUM_Neo_SGS.70.b:"借商队养兵"
 SUM_SGS_RA_Slab_Three:"三块石板"
 SUM_SGS_RA_Slab_Three_desc:"厅中散着三块石板，众人费了许多力气，才把它们拼作一块。三板合一，只听轰隆一声，那厅门竟裂开一道缝。既不是金玉，也不是机关，竟是一缕风。端的奇异。"
 SUM_Neo_SGS.71.t:"三块石板"
 SUM_Neo_SGS.71.d:"圣显厅深处，原藏着三块石板，各缺一角，分开看时纹路都接不上。矫论团的学者将其并在一处，你推我挪，试着拼合。说也奇怪，三块石板合成一块，严丝合缝，纹路相连，竟似天成。只听轧轧一声，厅门开了一道缝。缝里并无金光异宝，只是一股风，凉飕飕地透进来，带着沙枣花香。众人面面相觑，谁也不敢先伸手。有胆大的少年凑近去看，被长老一把扯住衣袖，道，且慢，先记下时辰。这一阵风端的从何处来，却不是这回书要表的。"
 SUM_Neo_SGS.71.a:"让商路连通四方"
 SUM_Neo_SGS.71.b:"把商路关起来自守"
 SUM_SGS_RA_Archive_Light:"灵光藏书"
 SUM_SGS_RA_Archive_Light_desc:"释读出来的文字，众人抄成册页，分送各处水驿，摆在藏书架上。这册子不锁不藏，谁来都能翻看。端的公开。由此人人知晓旧规旧账，再没人能一手遮天。"
 SUM_Neo_SGS.72.t:"灵光藏书"
 SUM_Neo_SGS.72.d:"矫论团把释读的成果抄成册，用的是上好的莎草纸，装订得厚厚一本。他们央水驿的驿丞，将这册书存放在水驿的藏书里，用木匣盛着，外头写着书名。这藏书之处向来是锁着的，如今却特地另设一格，谁都能看。往来商队歇脚，识字的水手便取出翻看，看不明白的，就问守驿的书吏。书吏也乐得讲解，指着上头的旧账说，这便是咱们祖上订立规矩的来由。日子久了，书页翻得起了毛边。"
 SUM_Neo_SGS.72.a:"以契约立信"
 SUM_Neo_SGS.72.b:"以枪杆立威"
 SUM_SGS_RA_Keep_Seal:"封条不动"
 SUM_SGS_RA_Keep_Seal_desc:"圣显厅最深处，有一道门贴着封条，众人谁也不去动它。原来是祖尔宛早有言在先，说那扇门不急，时候未到，切莫擅动。众人谨记这话，年年岁岁，那封条依旧完好。"
 SUM_Neo_SGS.73.t:"封条不动"
 SUM_Neo_SGS.73.d:"圣显厅越往里走，石门越重，到了最深处，有一道门上贴着封条，封条上的字谁也认不全。有那好事的，屡次想伸手去揭，都被祖尔宛拦下。祖尔宛道，那扇门不急，时辰未到，揭开了反倒惹出乱子。众人听了，方才罢手。这封条之下究竟藏着什么，连矫论团的长老也不晓得。有人猜是历代经卷，有人猜是镇厅之宝，议论纷纷，终无定论。只是那封条经了这许多年月，颜色已褪，边角也卷了起来，却依旧纹丝不动，端端正正贴在原处。"
 SUM_Neo_SGS.73.a:"把利润分给城邦"
 SUM_Neo_SGS.73.b:"把利润收归官库"
 SUM_SGS_RA_Hall_Guard:"守厅人"
 SUM_SGS_RA_Hall_Guard_desc:"守厅之人，由矫论团与守军两下轮值，今日你、明日我。那轮值表明明白白贴在门外，谁当值、几时换班，一目了然。这法子端的公道，既无人常年霸着，也无人推诿偷懒。"
 SUM_Neo_SGS.74.t:"守厅人"
 SUM_Neo_SGS.74.d:"圣显厅既要护着经卷，又不能无人看守，矫论团与守军便议定轮值。这一日你值守，那一日我值守，十日一换，周而复始。轮值表写得明白，贴在厅门之外，谁值何日，一目了然。这法子端的公道，省得推诿，也省得争功。到了换班之时，前班的人要把厅内情形一一交代：哪块石板挪动过，哪处封条完好，都写得清清楚楚。有一回守军的人睡过了头，矫论团的人顶了半日，事后也无人计较，只把轮值表前头那日改了。"
 SUM_Neo_SGS.74.a:"借水草养人"
 SUM_Neo_SGS.74.b:"借商队养兵"
 SUM_SGS_RA_Dune_Regiment:"沙丘军团"
 SUM_SGS_RA_Dune_Regiment_desc:"守军的兵、驭兽的人、护路的卒，三下里合编，成了一支军团。那旗号上绣着灵光，在日头底下闪闪发亮。三路人马归一，号令便齐，端的如臂使指。"
 SUM_Neo_SGS.75.t:"沙丘军团"
 SUM_Neo_SGS.75.d:"沙丘腰带各处人马，原本零散，守军的守军，驭兽人的驭兽人，护路的护路，各不相属。矫论团首倡，把这三路人马编成一军。旗号也新制了一面，旗上绣着灵光，风一吹，那灵光仿佛流转。编成那日，校场上人马齐整，驭兽人牵着巨兽，守军按刀而立，护路的背着弓。长老立在点将台上，把军旗一挥，三军齐声呐喊，声震沙丘。自此这群人有了名分，不再是一盘散沙。"
 SUM_Neo_SGS.75.a:"让商路连通四方"
 SUM_Neo_SGS.75.b:"把商路关起来自守"
 SUM_SGS_RA_Light_Scout:"灵光侦骑"
 SUM_SGS_RA_Light_Scout_desc:"侦骑探路，不用人眼，却借那风鸟的翅膀。原来风鸟飞得高、看得远，前头有甚动静，它先瞧见，比人早、比人远。端的厉害。"
 SUM_Neo_SGS.76.t:"灵光侦骑"
 SUM_Neo_SGS.76.d:"行军打仗，最要紧的是先晓得敌人在哪里。风沙连里有那聪明的侦骑，养了几只风鸟，专用来看路。这风鸟飞得高，看得远，又能识得风向，比起人眼，端的强得多。人骑马探路，不过数十里；风鸟展翅，一炷香便飞出百里，把前头沙丘背后的动静，看得明明白白。有一回敌军埋伏在沙谷，侦骑尚未察觉，风鸟已在空中盘旋，急得上蹿下跳。侦骑会意，忙报与主将，方才避过一劫。自此军中约定，凡出行之前，先放风鸟。"
 SUM_Neo_SGS.76.a:"以契约立信"
 SUM_Neo_SGS.76.b:"以枪杆立威"
 SUM_SGS_RA_Storm_Company:"风沙连"
 SUM_SGS_RA_Storm_Company_desc:"有一支兵马，专挑风天出击，唤作风沙连。这连人马惯在沙暴里厮杀，别人避之不及，他们却迎着风上。编成之后第一仗，恰在沙暴里打，端的得心应手，赢得漂亮。"
 SUM_Neo_SGS.77.t:"风沙连"
 SUM_Neo_SGS.77.d:"风沙连编成之后，头一仗便遇上沙暴。那一日天色昏黄，狂风卷着黄沙，遮天蔽日，对面不见人。众军士都有些慌了，主将却哈哈大笑，道，此乃天助我也。这风沙连本是沙里生、沙里长的，别人怕沙暴，他们却惯经了。只见他们借着风势，反倒把敌军冲得七零八落。敌军眯着眼睛，辨不清方向，弓也拉不开，刀也举不稳。风沙连的人却摸熟了风向，专拣那背风处掩杀过去。这一仗大获全胜，军中自此都得了个话柄，说风沙连是风天里炼出来的。"
 SUM_Neo_SGS.77.a:"把利润分给城邦"
 SUM_Neo_SGS.77.b:"把利润收归官库"
 SUM_SGS_RA_Water_Post:"水驿成兵"
 SUM_SGS_RA_Water_Post_desc:"各处水驿，都设了一班守兵。守的是驿，也是水。端的守水便是守命。有这一班兵丁守着，那一方水井水源，便无人敢私自霸占。"
 SUM_Neo_SGS.78.t:"水驿成兵"
 SUM_Neo_SGS.78.d:"各处水驿，本是商旅歇脚、取水之处，如今也各设一处守兵。这守兵不单守着驿舍，更要紧的是守水。沙漠里头，水便是命，井水一旦被人下了药，或是被壅断了源，一城的人都得渴死。是以这守兵日日守在井边，不许人搅浑，不许人私占。有一回几个泼皮想偷引井水，被守兵拿住，捆在驿门前示众。自此无人敢再打这井的主意。守兵们也晓得，守住了这口井，便守住了往来客商的性命。"
 SUM_Neo_SGS.78.a:"借水草养人"
 SUM_Neo_SGS.78.b:"借商队养兵"
 SUM_SGS_RA_Field_Song:"随军歌"
 SUM_SGS_RA_Field_Song_desc:"军中传唱花灵的歌，唱的是守土，是同行。那歌调子简单，词也朴实，老兵唱一遍，新兵跟着哼一遍，到第二遍，竟也会了。端的入耳。于是满营皆歌，士气大振。"
 SUM_Neo_SGS.79.t:"随军歌"
 SUM_Neo_SGS.79.d:"风沙连军中，每逢夜宿沙丘，篝火燃起，众人便唱起花灵的歌。这歌原是花灵教的，唱的是守土与同行，词句质朴，调子悠长。新兵初来，嫌这歌软绵绵的，不肯开口。老兵却道，你且听第二遍。唱到第二遍，那调子一转，雄浑起来，新兵不知不觉也跟着哼。三遍过后，竟也会了。于是满营歌声，随风飘出老远。花灵听了，便在火光外头轻轻应和。众军士唱着唱着，竟忘了白日里厮杀之苦。"
 SUM_Neo_SGS.79.a:"让商路连通四方"
 SUM_Neo_SGS.79.b:"把商路关起来自守"
 SUM_SGS_RA_Sacred_Oasis:"圣所"
 SUM_SGS_RA_Sacred_Oasis_desc:"有几处绿洲，被立为圣所。只一句：许进不许占。端的明白。谁来饮水歇脚都欢迎，可谁想圈地占了，却万万不能。由此这几处绿洲，永远向众人敞开。"
 SUM_Neo_SGS.80.t:"圣所"
 SUM_Neo_SGS.80.d:"沙漠之中，绿洲难得，哪一处有泉水、有草木，便是活命所在。矫论团与众人商议，把几处要紧的绿洲立为圣所，立下规矩：许进不许占。这规矩端的仁厚，无论哪一族哪一邦的商旅，只要进了圣所，便可取水解渴、歇脚乘凉，只是不许在此筑屋垦田，据为己有。有那贪心的，想圈一块地，众人便群起而攻之。自此几处绿洲，成了往来客商的活命之地，草木也涵养得越发茂盛。"
 SUM_Neo_SGS.80.a:"以契约立信"
 SUM_Neo_SGS.80.b:"以枪杆立威"
 SUM_SGS_RA_Water_Gift:"分水之礼"
 SUM_SGS_RA_Water_Gift_desc:"圣所的水，按人头分给四围百姓。不分你是哪一族，不问你属哪一邦，只要是口渴的人，便有一份。端的公道。由此各族各邦的人，都念圣所的好。"
 SUM_Neo_SGS.81.t:"分水之礼"
 SUM_Neo_SGS.81.d:"圣所既立，那取水便有讲究。矫论团议定，圣所的水按口分给周围的人，不分族与邦。沙漠里头，各族各邦向来为水争斗，如今这规矩一立，倒是头一回把人当人看。不分你是哪一族，也不分你属哪一邦，只要人在这里，便有一份水。分水之时，众人排成长队，大桶小罐，各按人口领了，谁也不许多拿。有一回一个外邦人分不到，众人还要把自己那份匀些与他。"
 SUM_Neo_SGS.81.a:"把利润分给城邦"
 SUM_Neo_SGS.81.b:"把利润收归官库"
 SUM_SGS_RA_Light_Garden:"灵光园"
 SUM_SGS_RA_Light_Garden_desc:"绿洲边上，新开了一座园子。一半是好看的花草，一半是治病的药草。端的两全。闲人来赏花，病人来采药，各取所需。端的巧妙。"
 SUM_Neo_SGS.82.t:"灵光园"
 SUM_Neo_SGS.82.d:"某处绿洲之边，矫论团辟出一片地，开了一座园子。园里种的不独花木，更多的是药草。沙漠行旅，最怕的是伤病，一旦生了病，前不着村后不着店，只能等死。这园中的药草，晒干了碾成末，治吐泻、治中暑，端的救了不少人命。有懂医的矫论团学者，日日在此料理，教当地人认得各样药草。花灵也来帮忙，替那药苗引来露水。日子久了，这园子成了远近闻名的地方。"
 SUM_Neo_SGS.82.a:"借水草养人"
 SUM_Neo_SGS.82.b:"借商队养兵"
 SUM_SGS_RA_Refuge:"避难所"
 SUM_SGS_RA_Refuge_desc:"圣所还有一桩好处，便是兼作避难之所。一遇风灾战乱，那大门便敞开，收容逃难的人，给口饭吃，给处地方歇。端的仁厚。由此圣所之名，传遍沙丘。"
 SUM_Neo_SGS.83.t:"避难所"
 SUM_Neo_SGS.83.d:"圣所不但供人取水，还兼做避难之所。一遇风灾战乱，便开门收人。这风灾说来就来，黑风一卷，房舍都掀了；战乱更是没个准，今日里太平，明日里就杀到眼前。圣所的门此时便大开着，任你哪一族哪一邦的百姓，都可进来躲避。里头备着水、备着粮，还有那御寒的毛毡。有一回邻邦打仗，逃难的扶老携幼，挤满了圣所，竟无人在里头争做那抢掠的事。"
 SUM_Neo_SGS.83.a:"让商路连通四方"
 SUM_Neo_SGS.83.b:"把商路关起来自守"
 SUM_SGS_RA_Keeper:"看园人"
 SUM_SGS_RA_Keeper_desc:"看园的人，不穿军装，一身布衣，可手里头却握着刀。别看他打扮寻常，端的惹不得。那些想抢圣所的，没一个落得好下场。端的威严。"
 SUM_Neo_SGS.84.t:"看园人"
 SUM_Neo_SGS.84.d:"看园的人，不穿军装，身上却藏着一把刀。这刀不是拿来欺人的，是拿来护这圣所的。原来圣所屡有人来抢，有那胆大的，趁着夜色想偷取水井、毁那药园，都被看园人拿刀拦下。自从立下规矩，抢圣所的没有一个有好下场：轻的罚做苦役，重的便枷在驿前示众。看园人平日里莳花弄草，看上去与寻常园丁无异，可一旦有人来犯，那刀便出了鞘。有一回三个泼皮来抢水，被看园人一刀背打翻两个，余下那个跪地求饶。"
 SUM_Neo_SGS.84.a:"以契约立信"
 SUM_Neo_SGS.84.b:"以枪杆立威"
 SUM_SGS_RA_Word_Forest:"致雨林书"
 SUM_SGS_RA_Word_Forest_desc:"给雨林的书信，写得客客气气。尽是商路怎么走、水位涨落几分，半句刀兵的话也不提。端的绵里藏针。话虽客气，道理却一句不含糊。"
 SUM_Neo_SGS.85.t:"致雨林书"
 SUM_Neo_SGS.85.d:"沙丘腰带要与雨林那边打交道，写了几封书信送去。这书信写得极客气，通篇说的是商路如何、水位如何，半句刀兵也不提。这是矫论团的主意，他们知道雨林那边素来与沙漠不甚和睦，若一开口便提刀兵，只怕事情更糟。是以信中尽拣那和气话说，什么愿通商路、愿通报水情，写得诚恳。送信的使者也是挑了又挑，专拣那口舌便给的。雨林那边接了信，果然也以礼相待。"
 SUM_Neo_SGS.85.a:"把利润分给城邦"
 SUM_Neo_SGS.85.b:"把利润收归官库"
 SUM_SGS_RA_March_Dune:"沿沙丘东进"
 SUM_SGS_RA_March_Dune_desc:"大军东进，不走路，偏沿着沙丘的脊背走。原来行走沙脊，风一起便把足迹吹得干干净净，端的无迹可寻。敌军想跟踪，也摸不着方向。"
 SUM_Neo_SGS.86.t:"沿沙丘东进"
 SUM_Neo_SGS.86.d:"沙丘腰带的大军，既已编成，便沿着沙丘脊一路东进。这行军最难的是留痕，人马走过，沙上便是一串脚印，敌军见了，便能追踪觅迹。偏偏这一日起了大风，风卷黄沙，把那足迹吹得平平整整，竟似从未有人来过。众军士借着风势，悄无声息地行了数十里。有那押后的，回头一望，但见黄沙茫茫，哪里还有半点痕迹，不由得赞道，此乃天助。主将听了，只是微微一笑，催军速行。"
 SUM_Neo_SGS.86.a:"借水草养人"
 SUM_Neo_SGS.86.b:"借商队养兵"
 SUM_SGS_RA_Volunteer:"义从"
 SUM_SGS_RA_Volunteer_desc:"檄文一传出去，矫论团的人、各族的青壮，纷纷自带口粮来投军。来的人比预想的还多。端的众望所归。那些人背粮带刀，从四面八方赶来，端的踊跃。"
 SUM_Neo_SGS.87.t:"义从"
 SUM_Neo_SGS.87.d:"大军东进之前，先发了一道檄文，四处传扬。这檄文中，把起兵的缘由说得明白，无非是要争那水、争那路，争一个不受人欺的公道。这檄文一传，各处响应，矫论团的人与各族的青壮，纷纷自带口粮来投。有那卖掉羊群凑盘缠的，有那背着弓箭走了数百里的，一日之间，校场上便聚了数千人。主将见人心齐整，大喜，命人搭起台来，当众宣讲檄文。众人听了，欢声雷动。"
 SUM_Neo_SGS.87.a:"让商路连通四方"
 SUM_Neo_SGS.87.b:"把商路关起来自守"
 SUM_SGS_RA_Front_Shrine:"军前立龛"
 SUM_SGS_RA_Front_Shrine_desc:"雨林边上，立起一处军前灵龛。敌人望见，心里先就乱了；自家将士望见，心里反倒定了。端的是攻心之计。同一座龛，两边看了，滋味各自不同。"
 SUM_Neo_SGS.88.t:"军前立龛"
 SUM_Neo_SGS.88.d:"大军临近雨林边界，矫论团在军前立了一处灵龛，供奉花灵。这灵龛端的有些古怪：敌人望见了，心里便乱，自己人望见了，心里反定。原来那灵龛里供着花灵的像，雕得慈悲安详，敌军见了，想起家中妻儿，士气便泄了几分；自己人见了，想起守土护民的誓言，胆气便壮了几分。主将每日清晨，必亲往灵龛前上香。众军士也纷纷效仿，出战之前，都来拜一拜。这一仗尚未开打，士气已先分了高下。"
 SUM_Neo_SGS.88.a:"以契约立信"
 SUM_Neo_SGS.88.b:"以枪杆立威"
 SUM_SGS_RA_Terms_Light:"最后的话"
 SUM_SGS_RA_Terms_Light_desc:"大军兵临关隘，方才把条件摆出来。一要撤哨，二要减税，三要还水，四要认独立。端的条条实在。这几条不早不晚，偏偏此时提出，端的拿捏住了火候。"
 SUM_Neo_SGS.89.t:"最后的话"
 SUM_Neo_SGS.89.d:"大军一路东进，直抵一处关隘，方才勒住马，提出条件来。要问是何条件，共有四桩：一是撤去哨卡，二是减轻赋税，三是归还占用的水源，四是认沙丘腰带独立。矫论团派了能言善辩的使者，入关去见那守关的官。使者把四条一一说了，又道，若肯依从，商路依旧，百姓安然；若不依从，只怕刀兵相见。守关官听了，沉吟半晌，不敢立时答复。"
 SUM_Neo_SGS.89.a:"把利润分给城邦"
 SUM_Neo_SGS.89.b:"把利润收归官库"
 SUM_SGS_RA_Light_Commonwealth:"灵光之邦"
 SUM_SGS_RA_Light_Commonwealth_desc:"圣显厅外的沙地，成了众人议事场。事是人定的，愿是人许的，代价也是人担的，花灵只在旁听着，替众人把每句话都记住，谁也抵赖不得。众人都道，这话端的公道。"
 SUM_Neo_SGS.90.t:"灵光之邦"
 SUM_Neo_SGS.90.d:"沙丘腰带的人，把圣显厅外那片沙地，当作了议事场。这议事端的古怪：人定事，花灵在旁听着。众人围着篝火坐定，你一言我一语，商量的都是要紧事。愿由人许，代价也由人担，花灵并不插手，只在一旁静静听着，把他们说过的每一句话，都记在心里。原来花灵记性极好，日后若有反悔，它们便把当日的话一一复述出来，叫人无从抵赖。有那轻诺寡信的，此时也不敢随口许愿。"
 SUM_Neo_SGS.90.a:"借水草养人"
 SUM_Neo_SGS.90.b:"借商队养兵"

 #### 乙线 · 学者城邦 ####
 SUM_SGS_RB_The_Scholar_Cities:"学者城邦"
 SUM_SGS_RB_The_Scholar_Cities_desc:"矫论团守着经卷，也守着沙路与水井。有人主张，把沙丘腰带的城邦建成学者的城邦：议事、立律、办学、通商，让那经义落地，变成人人能过日子的规矩。端的实在。"
 SUM_Neo_SGS.91.t:"学者城邦"
 SUM_Neo_SGS.91.d:"矫论团守着经卷，也守着路与水。有人主张，把沙丘腰带的城邦建成学者的城邦：议事、立律、办学、通商，样样都要有，让那经义落地，变成能过日子的规矩。这主张一出，众人议论纷纷。有的道，经卷里的话向来是空的，如何能当饭吃？那主张的学者便道，你但见那旧账旧规，哪一样不是过日子的道理？众人听了，方才恍然。自此各城之中，议事厅、学馆、集市，一应都照经义立起。"
 SUM_Neo_SGS.91.a:"把土地分给部族"
 SUM_Neo_SGS.91.b:"把土地归入官仓"
 SUM_SGS_RB_City_Charter:"城邦宪章"
 SUM_SGS_RB_City_Charter_desc:"每处城邦，都立下一份宪章。公事由谁议、谁办、谁查，一条条明明白白。端的周全。从此办事有章程，再不是一人说了算。"
 SUM_Neo_SGS.92.t:"城邦宪章"
 SUM_Neo_SGS.92.d:"沙丘腰带各城，都要立一份宪章。这宪章写得明白：公事由谁议、谁办、谁查，一件件分派清楚。这法子端的周到，省得日后推诿。议事的是众人选出的代表，办事的是公推的执事，查办的又是另一班人，三下里互相牵制，谁也别想一手遮天。宪章写成，抄了数份，一份藏在议事厅，一份立在集市口，让人人看得见。有那不识字的，便请人念与他听。自此办事都有章程，不再凭那官爷一时高兴。"
 SUM_Neo_SGS.92.a:"推举公议的执事"
 SUM_Neo_SGS.92.b:"沿用旧日的长老"
 SUM_SGS_RB_Council_Hall:"议事厅"
 SUM_SGS_RB_Council_Hall_desc:"议事厅的门，偏偏朝着集市开。谁都能进去旁听。旁听的人一多，那些当官的说话便谨慎了，端的没人敢信口开河。日子久了，那些议事的官儿，行事也越发谨慎了。"
 SUM_Neo_SGS.93.t:"议事厅"
 SUM_Neo_SGS.93.d:"各城议事厅的门，特意朝着集市开。这举动端的奇特：谁都能进去旁听。往日里议事，都是关起门来，百姓不得与闻；如今这门一开，赶集的、卖菜的，都能进去听上两句。起初众人还有些拘谨，后来听惯了，便也坦然。说也奇怪，旁听的人多了，那议事的人说话反倒谨慎起来，不敢信口开河，更不敢偏袒徇私。原来众目睽睽之下，谁不要脸面？有一回一位执事说了句糊涂话，台下便有人喝倒彩，那执事登时涨红了脸。"
 SUM_Neo_SGS.93.a:"让花神的誓约作证"
 SUM_Neo_SGS.93.b:"让官署的法度作证"
 SUM_SGS_RB_Citizen_Roll:"民籍"
 SUM_SGS_RB_Citizen_Roll_desc:"各城的人，都逐个登记造册。谁是本城人，谁是外来的，一册可查。端的清楚。由此奸细难混，赋役也摊得公平。衙门里把册子一翻，便知其人来路。"
 SUM_Neo_SGS.94.t:"民籍"
 SUM_Neo_SGS.94.d:"各城之中，人来人往，成分复杂，矫论团便把各城的人逐个登记。这一登记端的清楚：谁是本城土著，谁是外邦来的，一册可查。登记之时，写明姓名、来历、住在何处，用的是那古沙漠文与通行文字两种字迹。有那来历不明的，便要多问几句，问明白了才予登记。自此城中人口一清二楚，办起事来也有个凭据。有一回城里出了盗案，捕快按册查访，不多时便破了案。"
 SUM_Neo_SGS.94.a:"与雨林互通有无"
 SUM_Neo_SGS.94.b:"与雨林划清界限"
 SUM_SGS_RB_Elected_Steward:"公推执事"
 SUM_SGS_RB_Elected_Steward_desc:"城里的执事，不由上头指派，却由众人公推。任期三年，任满便得让贤，不得连任。端的防人恋栈。由此你方唱罢我登场，没人能独占久了。"
 SUM_Neo_SGS.95.t:"公推执事"
 SUM_Neo_SGS.95.d:"各城办事的执事，不是那世袭的官，也不是上面派来的，而是由城里公推。这公推端的公道：任三年，任满不得连任。到了选举那日，众人聚在议事厅，各举所知，票数多的便当选。当选的人当众立誓，要尽责办差。三年任满，无论干得好歹，都得交印，另选新人。有人劝那办得好的执事再干一任，那执事却道，规矩如此，不可破了例。众人听了，无不叹服。"
 SUM_Neo_SGS.95.a:"把土地分给部族"
 SUM_Neo_SGS.95.b:"把土地归入官仓"
 SUM_SGS_RB_Limits:"限权之法"
 SUM_SGS_RB_Limits_desc:"在任的官员，有两条铁律：一不许经商，二不许占水。这规矩立得极细，想钻空子也难。端的严明。由此为官的专心办事，不与民争利。"
 SUM_Neo_SGS.96.t:"限权之法"
 SUM_Neo_SGS.96.d:"在任的执事，规矩立得极细：不得经商，不得占水。这一条端的厉害，也端的难破。原来执事手里有权，若一边当官一边经商，一边管水一边占井，那百姓还有活路？是以宪章写得明白，凡在任者，不许置办产业，不许承揽工程，不许多占水源。上任之先，先要把自家的田产井渠登记在册，任内不得再添。有那想钻空子的，把产业记在亲属名下，也被查了出来，当场革职。自此做官的，断了那发财的念头。"
 SUM_Neo_SGS.96.a:"推举公议的执事"
 SUM_Neo_SGS.96.b:"沿用旧日的长老"
 SUM_SGS_RB_Academy_Dune:"沙丘学馆"
 SUM_SGS_RB_Academy_Dune_desc:"学馆里头，教的尽是实在学问：算术、地理、律例，还教那古沙漠文。这些学问样样能用。端的实在。少了哪一样，过日子都要吃亏。端的巧妙。"
 SUM_Neo_SGS.97.t:"沙丘学馆"
 SUM_Neo_SGS.97.d:"各城都设了学馆，教的那五花八门：算术、地理、律例，样样都有，还教那古沙漠文。这学馆端的齐整，先生是矫论团里饱学之士，学生是城中各家子弟，不分贫富，都可来听。有那穷苦人家的孩子，交不起束脩，先生也照样教。算术教的是记账纳税，地理教的是识路认水，律例教的是安分守己，古沙漠文教的是读那石壁上的旧字。孩子们初学时叫苦，后来渐渐入了门。"
 SUM_Neo_SGS.97.a:"让花神的誓约作证"
 SUM_Neo_SGS.97.b:"让官署的法度作证"
 SUM_SGS_RB_Scripture_Open:"经卷公开"
 SUM_SGS_RB_Scripture_Open_desc:"矫论团把经卷抄了许多份，分送到各处水驿。这经卷不再锁在深阁，端的传播开来。识字的众人争相传阅，那经义便如水上波，一圈圈荡将出去。"
 SUM_Neo_SGS.98.t:"经卷公开"
 SUM_Neo_SGS.98.d:"矫论团把经卷抄了许多份，分发到各处水驿。这抄经端的辛苦，书吏们伏案疾书，一笔一画，不敢潦草，常常抄到夜深。抄好之后，用莎草纸裹了，一捆捆送到各水驿，供往来客商阅览。有那水驿偏远，数年也无人送去，他们便专派了驼队，跋涉数百里送往。有一回驼队遇了沙暴，人驼俱失，后来又在沙里寻回那几捆经卷，纸页虽被沙磨毛了，字却还在。"
 SUM_Neo_SGS.98.a:"与雨林互通有无"
 SUM_Neo_SGS.98.b:"与雨林划清界限"
 SUM_SGS_RB_Scribe_School:"书记之教"
 SUM_SGS_RB_Scribe_School_desc:"矫论团最看重的，是教人写字这门课。原来在这沙丘地面上，会写字的，比会打仗的还稀罕。端的金贵。一个识字的人，顶得上半个先生。"
 SUM_Neo_SGS.99.t:"书记之教"
 SUM_Neo_SGS.99.d:"矫论团最看重的一门课，便是教人写字。这写字在他们眼里比什么都金贵。原来这沙漠之中，会写字的比会打仗的还稀罕。打仗的到处都是，识字的却十个里挑不出一个。是以矫论团立下规矩，凡学馆之中，写字是头等功课，日日要练。练字的莎草纸贵重，学生们便先在沙盘上划，划熟了再写到纸上。有那学得快的，先生便夸他，说他日后必能抄经、必能办事。众人都道，这写字端的能改换门庭。"
 SUM_Neo_SGS.99.a:"把土地分给部族"
 SUM_Neo_SGS.99.b:"把土地归入官仓"
 SUM_SGS_RB_Press_Dune:"抄书坊"
 SUM_SGS_RB_Press_Dune_desc:"抄书坊里，把宪章与律例抄了许多份，贴到各处水驿墙上。那告示一贴，过往行人都能看清。端的明白。谁犯了哪条，自己心里有数。"
 SUM_Neo_SGS.100.t:"抄书坊"
 SUM_Neo_SGS.100.d:"抄书坊把宪章与律例抄了许多份，贴在各处水驿。这一张贴端的周到：凡有集市、有水驿的地方，墙上都贴着那宪章律例，白纸黑字，明明白白。过往客商歇脚，抬头便看得见。有那识字的，便驻足细读，看看这地方的规矩如何；不识字的，也叫人念与自己听。抄书坊的人隔些日子便来轮换，把那破损的揭下，重新贴上新的。有一回有人故意揭了张告示，抄书坊的人查出后，罚他重抄十份。"
 SUM_Neo_SGS.100.a:"推举公议的执事"
 SUM_Neo_SGS.100.b:"沿用旧日的长老"
 SUM_SGS_RB_Script_Study:"释读古文字"
 SUM_SGS_RB_Script_Study_desc:"识得古沙漠文的人，凑在一处，把散落在沙里的字，一块一块认将回来。这活计费时费力，端的辛苦。然而古字一认出，旧事便明了。端的巧妙。"
 SUM_Neo_SGS.101.t:"释读古文字"
 SUM_Neo_SGS.101.d:"会古沙漠文的人凑在一处，把散在沙子里的字一块块认回来。这古沙漠文年代久远，认得的人本就不多，加之风沙侵蚀，许多字迹都模糊了。这些学者便背着干粮，深入大漠，寻访那些残碑断碣。找到一处，便伏在地上，拂去沙土，一笔一画地辨认。认出一个，便欢呼一声，如获至宝。有一块石碑被沙埋了半截，他们挖了三日才挖将出来，上头的字竟还清晰。"
 SUM_Neo_SGS.101.a:"让花神的誓约作证"
 SUM_Neo_SGS.101.b:"让官署的法度作证"
 SUM_SGS_RB_Fair_Toll:"公开税则"
 SUM_SGS_RB_Fair_Toll_desc:"税则刻在石碑上，立在水驿门口。谁该交多少，自己掰指头就算得出来，端的明白。那些想多收的，再没处下手。那碑上的字，刻得端端正正。"
 SUM_Neo_SGS.102.t:"公开税则"
 SUM_Neo_SGS.102.d:"各城的税则刻在碑上，立在水驿门口。这法子端的公道：谁交多少，自己算得出。原来旧日收税，全凭那税吏一张嘴，他说多少便是多少，百姓吃了哑巴亏。如今把税则刻在石碑上，明码标价，童叟无欺。碑上写着，一驼货抽几文，一桶水纳几钱，写得清清楚楚。往来商队看了碑，自己便能算出该纳多少，不多也不少。有那税吏想多收的，商队便指着碑与他理论，税吏也只得作罢。"
 SUM_Neo_SGS.102.a:"与雨林互通有无"
 SUM_Neo_SGS.102.b:"与雨林划清界限"
 SUM_SGS_RB_Open_Market:"开市通商"
 SUM_SGS_RB_Open_Market_desc:"集市不分内外，谁来都能做生意。这般开放，外邦的商队来得比往年多了许多。端的兴旺。那驼铃叮当，从早响到晚。那集市上，南腔北调的话都听得见。"
 SUM_Neo_SGS.103.t:"开市通商"
 SUM_Neo_SGS.103.d:"各城集市不分内外，外邦商队来得比往年多。自从立下那公道税则，又任外邦商队往来，这集市便一日热闹似一日。外邦的香料、玻璃、良马，都运到这里来换那沙漠的盐与药草。账房里的算盘从早打到晚，一直亮着灯。有那细心人算过，这一年里的税收，比往年多了三成。集市上人头攒动，叫卖声、讨价声不绝于耳。矫论团的人看了，心里欢喜，知道这通商的路子是走对了。"
 SUM_Neo_SGS.103.a:"把土地分给部族"
 SUM_Neo_SGS.103.b:"把土地归入官仓"
 SUM_SGS_RB_Trade_House:"商行合办"
 SUM_SGS_RB_Trade_House_desc:"几家大商户，合设了一处商行，专营外邦贸易。这行有个规矩：账目公开，谁都能查。端的敞亮。由此众人放心，生意越发红火。端的巧妙。"
 SUM_Neo_SGS.104.t:"商行合办"
 SUM_Neo_SGS.104.d:"几家大商户合设了一处商行，专营外邦贸易。这商行端的与别处不同：账目公开。原来商户们合计，与其各自为战、互相压价，不如合在一处，利益均沾。他们立下章程，约定买卖如何分利、亏空如何分担，都写得明白。每月初一，把账目张挂在商行门前，谁都能看。有那小伙计发现账目不实的，便当众指明，管事的也不恼，立即改正。自此生意越做越大，外邦商队也乐意与他们打交道。"
 SUM_Neo_SGS.104.a:"推举公议的执事"
 SUM_Neo_SGS.104.b:"沿用旧日的长老"
 SUM_SGS_RB_Caravan_Insure:"商队互保"
 SUM_SGS_RB_Caravan_Insure_desc:"商队合出一笔保银，谁在路上出了事，照数赔偿。赔了几回之后，那沙路反倒太平了。端的灵验。原来保银一亮，劫匪知道无利可图，也就散了。"
 SUM_Neo_SGS.105.t:"商队互保"
 SUM_Neo_SGS.105.d:"往来商队合出了一笔保银。这保银是拿来做什么的？原来沙漠行旅，最怕遇劫，一旦出了事，便倾家荡产。如今各队合出银两，凑成一笔公银，倘若哪一支商队路上出了事，便从中照价赔偿。这法子一出，果然灵验：赔了几回之后，那劫道的反而少了。原来劫道的晓得，抢了也白抢，货主有保银赔，自己却要担那被追捕的风险。是以路上反倒太平起来。商队们总结说，这叫花钱买平安。"
 SUM_Neo_SGS.105.a:"让花神的誓约作证"
 SUM_Neo_SGS.105.b:"让官署的法度作证"
 SUM_SGS_RB_Mint_Dune:"铸钱"
 SUM_SGS_RB_Mint_Dune_desc:"开炉铸钱，那钱的边沿上，把成色与重量都刻得清清楚楚。这般做法，谁也短不了分量。端的公道。商人拿着这钱，心里踏实。那钱一文是一文，童叟无欺。"
 SUM_Neo_SGS.106.t:"铸钱"
 SUM_Neo_SGS.106.d:"沙丘腰带开了炉，自己铸起钱来。这铸钱可不是小事，成色与重量都刻在钱边。原来往日里用那外邦的钱，成色参差不齐，常常吃亏。如今自己铸钱，用上等的铜，每一枚都足斤足两，钱边上还刻着字，写明成色几何、重几钱几分。有那眼刁的商人，拿在手里一掂，便知货真价实。铸钱之初也费了一番周折，炉温、铜料都要反复试。第一炉出来的钱不多，后来渐渐熟了，才够用。"
 SUM_Neo_SGS.106.a:"与雨林互通有无"
 SUM_Neo_SGS.106.b:"与雨林划清界限"
 SUM_SGS_RB_Common_Well:"共井"
 SUM_SGS_RB_Common_Well_desc:"水驿与井，尽数归了公。按人头分，谁也不许多占。那些占多了的，统统退将出来。端的公道。由此再无人敢囤水居奇。那井台边上，再无人敢私设栅栏。"
 SUM_Neo_SGS.107.t:"共井"
 SUM_Neo_SGS.107.d:"各处水驿与井都归了公。这一归公端的改了旧习：取水按人，多占的退回去。原来有些豪强霸着水井，不许旁人取用，百姓敢怒不敢言。如今井归了公，派专人看守，按人口分水，一人一份，谁也不许多占。有那原先霸井的，如今也只得按规矩来，起初还不服，后来见众人皆然，也就罢了。分水之时，先老弱、后壮丁，井然有序。百姓们都说，这水归了公，才真是公道。"
 SUM_Neo_SGS.107.a:"把土地分给部族"
 SUM_Neo_SGS.107.b:"把土地归入官仓"
 SUM_SGS_RB_Agri_Together:"合耕"
 SUM_SGS_RB_Agri_Together_desc:"各城的田，合在一处安排轮作，这块种罢种那块，地力便养得住。收成按各人出的工分。端的公平。多劳多得，谁也无话。田头立着木牌，写着各家轮到的次序。"
 SUM_Neo_SGS.108.t:"合耕"
 SUM_Neo_SGS.108.d:"各城的田合在一处安排轮作。这轮作端的科学：今年种麦，明年种豆，后年歇耕，地力便养得住。若是年年种一样，地力耗干了，收成便一年不如一年。矫论团里有懂农事的，把各城的田统一规划，哪片种什么，何时轮歇，都排得明白。收成之后按工分分配，谁出的力多，谁便分得多。有那偷懒的，分到的便少，众人也无话可说。自此田地越种越肥，收成一年好过一年。"
 SUM_Neo_SGS.108.a:"推举公议的执事"
 SUM_Neo_SGS.108.b:"沿用旧日的长老"
 SUM_SGS_RB_Public_Granary:"公仓"
 SUM_SGS_RB_Public_Granary_desc:"丰年时节，把余粮收进公仓；到了荒年，便开仓平价粜出。这仓里存的不只是粮，更是众人的命脉。端的周全。由此荒年也不至于饿殍。"
 SUM_Neo_SGS.109.t:"公仓"
 SUM_Neo_SGS.109.d:"丰年收粮入公仓，荒年开仓平粜。这公仓里存的不只是粮。原来矫论团立下规矩，丰年时百姓把多余的粮食缴入公仓，由专人保管；到了荒年，便开仓放粮，平价粜与百姓，不许囤积居奇。公仓里除了粮，还存着盐、存着药、存着那救灾的毛毡。有一年大旱，颗粒无收，全靠这公仓接济，一城的人方才熬了过来。百姓们感念，都说这公仓端的救命。"
 SUM_Neo_SGS.109.a:"让花神的誓约作证"
 SUM_Neo_SGS.109.b:"让官署的法度作证"
 SUM_SGS_RB_Mutual_Aid:"共济"
 SUM_SGS_RB_Mutual_Aid_desc:"出事的商队、受灾的村子，都由城里出钱出粮接济。这般帮扶，端的仁厚。谁家有了难处，众人便搭把手，端的暖心。那接济的粮，都是直接从公仓里支的。"
 SUM_Neo_SGS.110.t:"共济"
 SUM_Neo_SGS.110.d:"出事的商队与受灾的村子，由城里出钱出粮接济。这规矩端的厚道：商队若在路上遭了劫，村子若遇了灾，都不用独自撑着。原来沙漠之中祸事说来就来，一家一户哪里禁得起？如今城里设了救济的款项，谁家遭了难，报与官府，便有钱粮送来。有一回一支商队被劫，人货俱失，城里拨了银两与粮食，助他们重整旗鼓。那受灾的村子也得了接济，不至于流离失所。众人都说这沙丘腰带端的有人情。"
 SUM_Neo_SGS.110.a:"与雨林互通有无"
 SUM_Neo_SGS.110.b:"与雨林划清界限"
 SUM_SGS_RB_Craft_Common:"匠户合工"
 SUM_SGS_RB_Craft_Common_desc:"铁匠与制盐的匠人，合在一处做工。工钱按件计算，多劳多得，工具却归公家。端的周全。由此匠人们专心做工，不计较家什。"
 SUM_Neo_SGS.111.t:"匠户合工"
 SUM_Neo_SGS.111.d:"铁匠与制盐的合在一处做工。这合做端的巧妙：铁匠打的锄头、刀具，盐工晒的盐巴，都是百姓日用不可少的。矫论团把他们编在一处作坊里，工钱按件算，打一把锄头给几文，晒一斗盐给几文，多劳多得。工具却归公，不许私藏。原来若工具归了私人，便有人囤积居奇，旁人便做不成工。如今工具归公，谁用谁领，用毕归还，端的公道。作坊里叮叮当当，从早到晚，好不热闹。"
 SUM_Neo_SGS.111.a:"把土地分给部族"
 SUM_Neo_SGS.111.b:"把土地归入官仓"
 SUM_SGS_RB_Home_Guard:"乡兵"
 SUM_SGS_RB_Home_Guard_desc:"各城出丁，组成乡兵。这些人平时扛锄头务农，一有战事便集合扛刀。端的两不耽误。农忙种田，农闲练兵。刀枪存在库里，农闲才领出来操练。"
 SUM_Neo_SGS.112.t:"乡兵"
 SUM_Neo_SGS.112.d:"各城出丁组成乡兵。这乡兵与那正规军不同：平时务农，战时集合。原来沙丘腰带地广人稀，养不起那许多常年当兵的，便想出这法子。每户抽一丁，编入乡兵，日常里扛锄头种地，一旦有警，便放下农具，拿起刀枪。乡兵们定期操练，拉弓、使刀、列阵，一样不落。有一回敌军来犯，乡兵们接到号令，半日之间便在关前聚齐，把敌军杀了个措手不及。自此众人都晓得这乡兵端的能战。"
 SUM_Neo_SGS.112.a:"推举公议的执事"
 SUM_Neo_SGS.112.b:"沿用旧日的长老"
 SUM_SGS_RB_Watch_Dune:"望楼"
 SUM_SGS_RB_Watch_Dune_desc:"商道旁，立起一座座望楼。白天举旗，夜里举火，端的专人守望着。一有动静，信号便一路传开。那望楼上的旗火，一处接着一处，能传出十几里远。"
 SUM_Neo_SGS.113.t:"望楼"
 SUM_Neo_SGS.113.d:"商道旁立起了一座座望楼。这望楼是拿来做什么的？原来沙漠行旅最怕遇劫，若有那高处瞭望的，便能早早发现动静。望楼筑在商道旁的高处，白天有人举旗，夜里有人举火，以那旗色火光为号，通报前方平安与否。若见敌情便举起红旗，若一路无事便举白旗。商队远远望见，便知前路吉凶。有一回一伙劫匪藏在沙谷，望楼上的人瞧见，立刻举火报警，商队得以绕道避开。"
 SUM_Neo_SGS.113.a:"让花神的誓约作证"
 SUM_Neo_SGS.113.b:"让官署的法度作证"
 SUM_SGS_RB_Route_Patrol:"护商队"
 SUM_SGS_RB_Route_Patrol_desc:"有一队人马，专管巡视沙道，护送商队。遇上劫匪，他们便追将上去，端的尽责。有这队人马在，商队走路便踏实。那些人马日日巡行，沙道上少见劫匪的影子。"
 SUM_Neo_SGS.114.t:"护商队"
 SUM_Neo_SGS.114.d:"护商队专巡沙道，遇劫则追。这护商队是风沙连里分出来的一支，专门护送往来商队。他们骑马巡行在沙道之上，或前或后，不离商队左右。一旦遇有劫匪，便拍马追去，非把那伙人拿住不可。有一回一伙劫匪抢了商队的骆驼，护商队追了三十里，终于在一处沙丘后头将他们围住，人赃俱获。自此劫匪们晓得，这沙道上有一支护商队，轻易不敢再来。商队们也乐意交由他们护送。"
 SUM_Neo_SGS.114.a:"与雨林互通有无"
 SUM_Neo_SGS.114.b:"与雨林划清界限"
 SUM_SGS_RB_Peace_Hall:"治安署"
 SUM_SGS_RB_Peace_Hall_desc:"治安署的差事，由本处人充任。无非是偷盗抢劫这些事。端的实在。本地人管本地事，情形熟，办得快。那署里的差役，都是街坊熟人，办案格外用心。"
 SUM_Neo_SGS.115.t:"治安署"
 SUM_Neo_SGS.115.d:"各城设了治安署，署里的差役都由本处人充任。这治安署管的是偷抢，本是那维持地方安宁的所在。用本处人端的有些好处：本地人熟识地方，谁家是良民、谁家是泼皮，一清二楚，办起案来事半功倍。有一回城里丢了东西，治安署的差役按图索骥，不多时便拿了贼。只是这法子也有弊端，若差役徇私，袒护亲友，便难秉公。是以又立下规矩，办案须有旁人作证，不许一人独断。"
 SUM_Neo_SGS.115.a:"把土地分给部族"
 SUM_Neo_SGS.115.b:"把土地归入官仓"
 SUM_SGS_RB_Water_Militia:"守泉兵"
 SUM_SGS_RB_Water_Militia_desc:"各水驿，都设了守泉的兵丁。守的是泉，也是路。端的守水便是守路。有他们守着，那水源与商道，便都安稳。那守泉的兵，日夜轮班，从不离人。"
 SUM_Neo_SGS.116.t:"守泉兵"
 SUM_Neo_SGS.116.d:"水驿各设了守泉的兵。这守泉的兵守的是泉，也是路。原来沙漠中的泉水往往就在商道之旁，守住了泉便守住了路。若是泉被人下了药、或被人霸占，商队便无法前行，这商路也就断了。是以守泉的兵日夜在泉边巡守，不许人搅浑、不许人私占。有一回一伙人想引泉灌自己的田，被守泉兵拿住，勒令填平沟渠，方才作罢。自此这泉端的清清亮亮，长流不断。"
 SUM_Neo_SGS.116.a:"推举公议的执事"
 SUM_Neo_SGS.116.b:"沿用旧日的长老"
 SUM_SGS_RB_Neutral_Pact:"中立之约"
 SUM_SGS_RB_Neutral_Pact_desc:"与四邻立下盟约。沙丘不与人结盟，不许外兵驻扎，也不供粮给交战的一方。端的中立。由此四面宾服，沙丘自保。那盟约抄了三份，四邻各执一份。"
 SUM_Neo_SGS.117.t:"中立之约"
 SUM_Neo_SGS.117.d:"沙丘腰带与四邻立约，约中写明三桩：沙丘不结盟、不驻外兵、不供粮于战。这三条约法端的周全：不结盟，是不卷入那远处的争斗；不驻外兵，是不许别国兵马踏入沙丘；不供粮于战，是不给那交战的任何一方输粮。立约之时，四邻的使者都到了，歃血为盟，各执一份。自此沙丘腰带守住了中立，四邻也晓得这里的规矩，不敢轻易侵犯。有一回邻邦打仗，都想拉沙丘入伙，沙丘只把约书一亮便回绝了。"
 SUM_Neo_SGS.117.a:"让花神的誓约作证"
 SUM_Neo_SGS.117.b:"让官署的法度作证"
 SUM_SGS_RB_Trade_Treaty:"通商之约"
 SUM_SGS_RB_Trade_Treaty_desc:"与外邦通商，也立下条约。税则怎么收，侨民怎么护，都写得清清楚楚。端的周全。由此商路通达，争端也少。那约文就刻在市场的石壁上，人人可看。"
 SUM_Neo_SGS.118.t:"通商之约"
 SUM_Neo_SGS.118.d:"沙丘腰带与外邦通商，也立下约。这约中写得明白：税则如何、护侨如何，一桩桩都载在约上。原来与外邦做生意，最怕的是那说不清的纠纷，货被扣了、人被欺了，若无约在先便无从理论。如今立了约，税则照碑上所刻，不得随意加征；外邦商旅在此也得妥为保护，不得欺凌。有那违约的，便按约追究。约成之后，外邦商队来得更多，生意越发兴旺。"
 SUM_Neo_SGS.118.a:"与雨林互通有无"
 SUM_Neo_SGS.118.b:"与雨林划清界限"
 SUM_SGS_RB_Border_Talk:"边界磋商"
 SUM_SGS_RB_Border_Talk_desc:"与雨林谈地界，一里一里地慢慢谈。哪里谈不拢，便先搁将起来，不急。端的沉得住气。谈成一里便算一里，积少成多。那些谈妥的地界，都立了石碑为记。"
 SUM_Neo_SGS.119.t:"边界磋商"
 SUM_Neo_SGS.119.d:"沙丘腰带与雨林交界，那地界原是一笔糊涂账，你说归你，我说归我，谁也拿不出铁证。这一日两边各遣能言善辩之人，带一卷旧舆图，就在沙边一处绿洲坐下慢慢计较。谈地界不比旁的勾当，一里一里地量，一寸一寸地争，量过了还要翻旧碑、查旧案、斗口才。雨林来的使者口似悬河，指着一道干涸的旧河床，说这水当年是他们祖上引来的；沙丘这边的老者不甘示弱，捧出一块风蚀的界石，说石上刻的字还认得。两边从日中争到日头偏西，口干舌燥，谁也说服不了谁。那使者见势不妙，把舆图一卷，说今日且搁着，改日再议；沙丘众人也乐得收场，各自翻身上马。临别时两边约定，待到来年开春，各带新证据再坐到一处理论。"
 SUM_Neo_SGS.119.a:"把土地分给部族"
 SUM_Neo_SGS.119.b:"把土地归入官仓"
 SUM_SGS_RB_Keep_Old:"旧例照行"
 SUM_SGS_RB_Keep_Old_desc:"矫论团的旧例，能留的尽数留下。只是多添了一层公议的过场，凡事拿出来大家议一议。端的稳妥。旧例不失，新意也添。那公议一场，端的费些工夫，却也值当。"
 SUM_Neo_SGS.120.t:"旧例照行"
 SUM_Neo_SGS.120.d:"矫论团行事，自来有一套老规矩，哪条路该走，哪句话该说，都有成例可循。这一回他们商议改章程，众人本以为要改弦更张，谁知主事的老者却道，旧例能留的尽数留下，只是凡事之上再添一层公议。便是众人围坐一圈，把一件事情摊开来，你一句我一句，当着大众的面说清楚，再举手定夺。当下便有人不服，说先前凭一句经卷便能断的事，如今却要当众唠叨，岂不啰嗦？那老者捋须笑道，规矩还是那些规矩，只是多一道过场，叫人心服口服。众人将信将疑，试着议了两桩事，果然议论过后，办的还是旧规矩，可各人脸上都多了几分坦然。自此凡有大事，众人先议论再定夺，虽多费些口舌，倒也少了许多怨言。"
 SUM_Neo_SGS.120.a:"推举公议的执事"
 SUM_Neo_SGS.120.b:"沿用旧日的长老"
 SUM_SGS_RB_Quiet_Grow:"守成"
 SUM_SGS_RB_Quiet_Grow_desc:"沙丘的规矩，端在一个稳字。不折腾，不扩张，安安生生把眼下的日子过稳当。端的实在。不求轰轰烈烈，只求细水长流。那沙丘的百姓，这些年确实少了许多惊吓。"
 SUM_Neo_SGS.121.t:"守成"
 SUM_Neo_SGS.121.d:"沙丘腰带这些年是折腾怕了，今日兴兵，明日改制，闹得百姓不得安生。这一回主事者痛定思痛，立下主意：不折腾，不扩张，只把眼下的日子过稳当。这话说来容易，做起来却难。当下便有那好事的少年，跃跃欲试，要练兵马、拓疆土，好建一番功业。主事者只是摇头，指着城外那片刚种下的麦田道，你但见这田，才下种不多时，若此刻又去动刀兵，谁来收割？那少年犹自不服。主事者又道，井里的水刚够吃，商道刚通，学馆刚开，哪一样经得起折腾？不如安分守己，把日子一天天过扎实。众人听了，方才把那颗躁动的心按下去。从此沙丘腰带少了许多声响，百姓倒也落个清静。"
 SUM_Neo_SGS.121.a:"让花神的誓约作证"
 SUM_Neo_SGS.121.b:"让官署的法度作证"
 SUM_SGS_RB_Scholar_Republic:"学者共和"
 SUM_SGS_RB_Scholar_Republic_desc:"沙丘城邦，各自立了宪章：执事由众人公推，律例由大家共议，学馆里教的是算术与古文字。矫论团的经义，至此才算落了地，成了人人能过日子的规矩。端的实在。"
 SUM_Neo_SGS.122.t:"学者共和"
 SUM_Neo_SGS.122.d:"单说沙丘腰带一带，大小城邦星罗棋布，这一回各城都立下宪章，把规矩明明白白写在石板上。那执事的选法也改了，不由一家一姓把持，而是由众人公推；那律例的定法也变了，不由一人拍板，而是众人共议。这宪章写得朴实，没有那些花里胡哨的辞藻，只讲一件件实在事。城里的学馆也重开起来，教的不再是空洞的玄谈，而是算术与古文字。孩童们拨着算珠，一笔一画地临摹古字，倒也学得津津有味。矫论团那一套经义，往日高悬在经卷里，如今落到地上，成了能纳粮、能断案、能过日子的规矩。有那老学究起初摇头，说这般俗气，后来见市面安稳、诉讼清楚，也暗暗点头。那老学究后来也时常到学馆转转，看孩子们识字，脸上渐渐有了笑意。"
 SUM_Neo_SGS.122.a:"与雨林互通有无"
 SUM_Neo_SGS.122.b:"与雨林划清界限"
 SUM_SGS_RB_Dune_Commune:"沙丘公产"
 SUM_SGS_RB_Dune_Commune_desc:"水驿与井都归了公，田合在一处轮作，收成按工分；匠户也聚在一处做工，工具归公。矫论团道，这正是经卷里写的那个样子。端的应了古话。"
 SUM_Neo_SGS.123.t:"沙丘公产"
 SUM_Neo_SGS.123.d:"沙丘腰带改了章程，头一件便是把水驿与井归了公。先前那井是各家各户私有的，浇地要花钱买水，如今归了公，谁都能挑。第二件是把零碎田亩合在一处轮作，今年种麦，明年种豆，地力不伤；收成也不按田多少分，而是按各人出的工分。第三件是把散居的匠户聚到一处做工，铁匠、陶匠、木匠比邻而居，连锤子、窑、刨子这些家什也归了公，谁用谁领。原来是矫论团翻出经卷，说上面写的就是这个样子，公田公井，合力做工，按劳分粮。当下有人嫌麻烦，说自家那把用了半辈子的锤子怎的也要交出去？可几个月下来，田里收成不薄，匠户做工也快，众人方才无话。"
 SUM_Neo_SGS.123.a:"把土地分给部族"
 SUM_Neo_SGS.123.b:"把土地归入官仓"

 #### 丙线 · 沙王正统 ####
 SUM_SGS_RC_The_Legacy_of_the_Sand_Kings:"沙王的遗制"
 SUM_SGS_RC_The_Legacy_of_the_Sand_Kings_desc:"第三条路，翻的是更旧的一笔账。沙丘腰带曾是赤王治下的一环，圣显厅里还存着当年的法度。有人主张，把这份旧法请将回来，用它管今日的沙。端的复古。"
 SUM_Neo_SGS.124.t:"沙王的遗制"
 SUM_Neo_SGS.124.d:"沙丘腰带议革新，摆在前头的本有两条路，一条顺着旧例修修补补，一条学着雨林改弦更张。谁知偏生有人翻出第三条路，翻的是更旧的一笔账。这账旧到什么地步？原来沙丘腰带在千百年前，曾是赤王治下的一环，那时节圣显厅里存着成套的法度，刻在石板上，埋在黄沙中。有那博古的学者，从沙里刨出几块残碑，捧着跑到议事厅，说这法度有根有据，何不把它请回来，用旧制管今日的沙？此言一出，满堂哗然。有人赞成，说古法久经考验；有人反对，说时代变了，老办法管不了新事。两下里争得不可开交。那学者只是把残碑往案上一放，说诸位且先看看石上写的字，再争不迟。"
 SUM_Neo_SGS.124.a:"重立赤王的旧制"
 SUM_Neo_SGS.124.b:"重建城邦的议会"
 SUM_SGS_RC_Trace_Line:"溯沙王统"
 SUM_SGS_RC_Trace_Line_desc:"沙丘历代的主事者，众人从头理了一遍。竟只剩下一个名字，赤王。端的源头在此。千条万条，归到一处。那名字刻在石板最上头，谁也不敢再添一笔。"
 SUM_Neo_SGS.125.t:"溯沙王统"
 SUM_Neo_SGS.125.d:"那班主张复古的学者，为了把旧制的根子寻清楚，索性把沙丘腰带历代的主事者从头理了一遍。他们翻遍残碑断碣，访遍白须老者，把一个个名字抄在纸上，从近世数到中古，从中古再往上溯。这一理不打紧，越往上理，那名字便越稀少，到后来，几百年间竟只剩寥寥数人，再往上追，到得最上头，纸上便只剩一个名字。众人围着那张纸看了半晌，谁也不说话。末了还是那位年长的学者开口，念出三个字：赤王。念罢，厅内一片寂然。原来千百年来，这片沙海的主事者换来换去，可追本溯源，竟都落在赤王一人身上。有那年轻气盛的，本想争辩，此刻也张了张嘴，把话咽了回去。众人把这名字端端正正写在纸上，供在案头，仿佛得了主心骨一般。"
 SUM_Neo_SGS.125.a:"召集能战之众"
 SUM_Neo_SGS.125.b:"召集能谋之士"
 SUM_SGS_RC_Claim_Legacy:"承其遗制"
 SUM_SGS_RC_Claim_Legacy_desc:"沙丘腰带，宣称承的是赤王遗制。这一宣称，法度便有了凭据，名分便有了源头。端的理直气壮。再没人说他们是没根的沙寇。那名分一定，众人便都认了这笔传承。"
 SUM_Neo_SGS.126.t:"承其遗制"
 SUM_Neo_SGS.126.d:"那班考古的学者既然理出了赤王的名头，胆气便壮了起来，索性当众宣称：沙丘腰带承的是赤王遗制，法度有据，名分有源。原来他们手里攥着几块从圣显厅旧址挖出的石板，板上刻着古文字，虽残缺不全，可那规制、那礼数，依稀还能辨认。当下便在集市上、议事厅里，把这话说了又说。有那听众将信将疑，问这法度究竟从何而来？学者便把石板上的字一句句念出来，说这叫有据；又把历代主事者的名单一摆，说这叫有源。众人听了，有的点头，有的摇头。偏有那好事的少年追问，说既然有据有源，为何这些年却又丢了？那学者一怔，随即道，遗失是遗失，根源终归还在。"
 SUM_Neo_SGS.126.a:"以神权号令沙漠"
 SUM_Neo_SGS.126.b:"以律法约束诸城"
 SUM_SGS_RC_Court_Back:"复朝仪"
 SUM_SGS_RC_Court_Back_desc:"重立朝仪，谁站哪一级，都有定规矩。这规矩一立，众人各安其位，人心反倒安定了。端的奇怪。有规矩，便少了非分之想。那朝仪排定之后，谁该站何处，再无争论。"
 SUM_Neo_SGS.127.t:"复朝仪"
 SUM_Neo_SGS.127.d:"沙丘腰带既宣称承了赤王遗制，少不得要把那套朝仪重立起来。这朝仪说穿了便是规矩，谁站哪一级，谁坐哪一把椅子，谁先开口谁后开口，都有定规，半分乱不得。起初众人还觉着麻烦，站个位置也要争上一争，谁也不肯落在人后。主事者却不急，只叫人把那定规刻在牌子上，挂在议事厅门口，每日照着站位。日子一久，怪事却来了：自从定规立起来，人心反倒安定了。先前为争座次吵得面红耳赤的，如今各自站定，也不觉得委屈；新来的年轻人不知规矩，站在旁人的位置上，自己便觉着别扭。原来人心里都有个尺，有了定规，这尺便有了准星，谁高谁低一目了然，反倒省了许多口舌。"
 SUM_Neo_SGS.127.a:"把遗迹挖开"
 SUM_Neo_SGS.127.b:"把遗迹封回去"
 SUM_SGS_RC_Narrow_Council:"缩议政"
 SUM_SGS_RC_Narrow_Council_desc:"议政的席位，从几十缩到了九个。说话算数的人一少，扯皮便少了，事反倒办得快了。端的干脆。人多嘴杂，反误事儿。那九张席位，端的比从前几十张嘴强。"
 SUM_Neo_SGS.128.t:"缩议政"
 SUM_Neo_SGS.128.d:"单说沙丘腰带重立朝仪之后，接着便动了议政的席次。先前那议事厅里，能坐下来议政的多达几十号人，七嘴八舌，一件小事能吵上三天，到末了也没个结果。这一回主事者痛下决心，把那几十张椅子一撤，只留下九张。皆是各城中历练最深、办事最稳的九个，旁的闲杂人等，一概站在阶下听候。这一改，效果立现：说话能算数的人少了，可事却办得快了。先前要吵三天的，如今一炷香便定下章程；先前你推我诿的，如今九个一拍板，众人便分头去办。有那被撤了椅子的，起初满腹牢骚，后来见事情办得利索，城里日子也宽裕，也就渐渐没了言语。这九个位子看着寻常，端的把沙丘的朝仪撑了起来。"
 SUM_Neo_SGS.128.a:"重立赤王的旧制"
 SUM_Neo_SGS.128.b:"重建城邦的议会"
 SUM_SGS_RC_Law_Old:"旧法为纲"
 SUM_SGS_RC_Law_Old_desc:"以圣显厅的旧法为纲，凡是新立的条令，一律照着旧法来解释。这般做法，端的有根有据。新法旧法，一脉相承，不乱。那旧法一字未改，端的稳当。"
 SUM_Neo_SGS.129.t:"旧法为纲"
 SUM_Neo_SGS.129.d:"沙丘腰带立了新规矩，可这新规矩的来历，却要从圣显厅说起。原来那圣显厅是赤王旧时的所在，厅中藏着一部旧法，字字古奥。主事者当下立下一条铁律：凡新定的条令，一律以圣显厅的旧法为纲，新条怎么讲，都要照着旧法去解释，不得自行其是。这一条看似寻常，实则把新法的根牢牢扎在了旧法上。当下便有那头脑活络的，想借新条夹带私货，把一处空缺填成自家的好处，谁知主事者把旧法一翻，逐字比对，那点心思立刻露了馅。自此众人晓得，新条不是可以随意揉捏的面团，而是要在旧法的模子里刻出来的。有几回争论不下，众人便跑到圣显厅，对着旧法一字一句地抠，抠明白了再回来办事。"
 SUM_Neo_SGS.129.a:"召集能战之众"
 SUM_Neo_SGS.129.b:"召集能谋之士"
 SUM_SGS_RC_Army_One:"编为一军"
 SUM_SGS_RC_Army_One_desc:"护路的、守泉的、各城的乡兵，三下里合编，成了一支大军。旗号统一，粮饷也统一。端的整齐。再不是各顾各的散兵。那旗号一色，粮饷一般，端的整齐。"
 SUM_Neo_SGS.130.t:"编为一军"
 SUM_Neo_SGS.130.d:"沙丘腰带地面辽阔，商道四通八达，向来是各管各的：护路的归护路，守泉的归守泉，各城的乡兵更是各听各的号令。这一回主事者一扫积弊，下了一道令：护路的人、守泉的兵、各城的乡兵，通通编进一支军，旗号画成一样，粮饷也由一处统一发放。先前那护路的见了守泉的，各认各的旗，遇事谁也不服谁；如今同是一支军，同一个旗号，同一本粮册，调起来得心应手。当下便有那老兵起初不肯，说自己跟了旧主子多年，怎的忽然改了门庭？可领了统一的新粮饷，吃了几顿饱饭，又见打仗时彼此照应，也就安心了。从此沙丘腰带有了真正属于自己的一支军。一支军最怕的便是各怀心思，如今旗号粮饷归一，这隐患便除了。"
 SUM_Neo_SGS.130.a:"以神权号令沙漠"
 SUM_Neo_SGS.130.b:"以律法约束诸城"
 SUM_SGS_RC_Staff:"设军师府"
 SUM_SGS_RC_Staff_desc:"军师府，只管谋划与粮道，并不直接带兵。带兵的与谋划的，两下分开，端的周全。各司其职，谁也不越界。那军师府的令牌，只能调粮，不能调兵。"
 SUM_Neo_SGS.131.t:"设军师府"
 SUM_Neo_SGS.131.d:"沙丘腰带既然立了一支军，少不得要设个运筹的所在，这便是军师府。这军师府的规矩甚是古怪：它只管谋划与粮道，却不直接带兵。原来主事者深谙一个道理，带兵的人若又管谋划，手里的权便太大，久而久之，只怕尾大不掉。于是立下章程，把带兵与谋划生生分开。那军师府里坐着几位足智多谋的，日日对着沙盘推演，算粮算路，算天时算人心，算出个方略来，便交给带兵的去施行。带兵的只管冲锋陷阵，谋划的只管运筹帷幄，两下里互相配合，又互相牵制。当下便有那大将不以为然，觉得自己出生入死，反倒要听几个舞文弄墨的安排。后来几番交战，靠着军师府算准了粮道、掐准了时机，果然连连得手，那大将方才心悦诚服。"
 SUM_Neo_SGS.131.a:"把遗迹挖开"
 SUM_Neo_SGS.131.b:"把遗迹封回去"
 SUM_SGS_RC_Garrison_All:"遍设戍所"
 SUM_SGS_RC_Garrison_All_desc:"商道与绿洲，处处设了戍所，端的是街街有岗。这戍所一设，夜里行路的人反倒少了。端的怪事。原来夜禁森严，谁也不敢犯夜。那戍所的灯火，一夜到天明都亮着。"
 SUM_Neo_SGS.132.t:"遍设戍所"
 SUM_Neo_SGS.132.d:"沙丘腰带为了护住商道，想出一个法子：在商道与绿洲处处设立戍所，几乎街街有岗，镇镇有兵。不过是夯土筑成的小堡，插一面旗，驻三五兵丁，盘查过往行人。先前这沙海上商道辽阔，盗匪出没，行商夜间赶路，提心吊胆。如今戍所一处接一处，灯火相望，倒也安稳。可怪事又来了：戍所设起来之后，夜里行路的人反倒少了。原来有了戍所盘查，那些夜里偷走私货、逃税躲役的人不便了，索性改在白天走大道；而安分的行商，也图个白天安全，不肯摸黑赶路。于是夜里的沙道上，只剩风声与沙响。有那守夜的兵丁，裹着皮袄靠在堡墙上，几夜不见一个人影，倒也落个清闲。"
 SUM_Neo_SGS.132.a:"重立赤王的旧制"
 SUM_Neo_SGS.132.b:"重建城邦的议会"
 SUM_SGS_RC_Conscript:"征兵法"
 SUM_SGS_RC_Conscript_desc:"凡是成丁的男丁，都有服役的责任。服役期满，便放回家乡。端的公道。有事打仗，无事归田。服役的期限写得明白，到期便放还乡，还发给路引，端的体恤。"
 SUM_Neo_SGS.133.t:"征兵法"
 SUM_Neo_SGS.133.d:"沙丘腰带立了新军，兵员从何而来？原来立下一条规矩：凡成丁者，皆有服役之责，到了年头，便要应征入伍。这服役不是终身的，期满便可回家。那期限也不算长，够你把护路守泉的本事学会，够你随队走上几趟商道。当下征令一下，各城都忙着登记成丁的男子。有那富贵人家的子弟，从前哪肯吃这份苦，如今也得编入队伍，与穷苦人家的孩子一同操练。起初叫苦连天，晒脱了皮，磨破了脚，可日子久了，倒也练出一身筋骨。服役期满那日，主事者亲自发放归家的文书，众人领了文书，欢欢喜喜回家务农经商。有那在军中待出感情的，临走时还三步一回头。这服役之法既尽了义务，又不误农时，端的两全其美。"
 SUM_Neo_SGS.133.a:"召集能战之众"
 SUM_Neo_SGS.133.b:"召集能谋之士"
 SUM_SGS_RC_Purge:"清队"
 SUM_SGS_RC_Purge_desc:"军中那几支不听话的兵马，被清理了出去。竟一个字也没有。端的狠辣。说清就清，全凭上头一句话。那几支兵马，就此散在各处，再不成军。"
 SUM_Neo_SGS.134.t:"清队"
 SUM_Neo_SGS.134.d:"沙丘腰带新军初立，人马虽众，却也混杂，其中有几支人马向来不听号令，仗着人多，自行一方。主事者决意整顿，把这些不听话的几支清理出去。这清理的手法甚是蹊跷：清出去的人，竟没有一纸罪状。原来主事者不愿把事情闹大，更不愿落个清洗的恶名，于是只说军中要精简，某些人马不合新编，请回原籍便是。那几支人马的首领起初暴跳如雷，嚷着要讨个说法，可一细想，自己平日确实不听调遣，如今新军令严，留下去只怕更没好处，便也悻悻离去。旁人见了，虽觉蹊跷，却也无人深究。自此军中再无那等桀骜不驯的，号令一下，莫不相从。这般不动声色的手段，比明刀明枪更叫人心里发毛，从此军中再无一人敢逞强。"
 SUM_Neo_SGS.134.a:"以神权号令沙漠"
 SUM_Neo_SGS.134.b:"以律法约束诸城"
 SUM_SGS_RC_Open_Hall:"重开圣显厅"
 SUM_SGS_RC_Open_Hall_desc:"圣显厅重新开放。一要厅里存的法度，二要厅中的构装。端的两全。那构装披甲执刃，端的厉害。那构装披甲之后，端的刀枪不入，只是费些修理的功夫。"
 SUM_Neo_SGS.135.t:"重开圣显厅"
 SUM_Neo_SGS.135.d:"沙丘腰带要复古制，少不得要重开那座荒废多年的圣显厅。这圣显厅里头，藏着的何止是法度？那一根根立柱、一尊尊石像，皆是赤王旧时留下的构装，机关巧妙，非同小可。当下主事者带着一干人，拂去厅中积沙，推开沉重石门，但见里面蛛网尘封，一派荒凉。众人先取那刻在墙上的法度，一字一句地誊抄；后又盯上了那些构装，试着拨弄机关，只见一尊石像竟缓缓抬起了手臂，惊得众人连连后退。原来这取圣显厅，取的不仅是纸上的法度，还有这厅里能动能走的构装。有那胆大的工匠，绕着石像看了一圈又一圈，嘴里啧啧称奇，说这等巧夺天工之物，若能为己所用，胜却千军万马。"
 SUM_Neo_SGS.135.a:"把遗迹挖开"
 SUM_Neo_SGS.135.b:"把遗迹封回去"
 SUM_SGS_RC_Mech_Hall:"厅中构装"
 SUM_SGS_RC_Mech_Hall_desc:"厅里的构装，修好之后竟能走能动。再把兵器往上一装，便成了一队不知疲倦的兵。端的神奇。不吃不喝，昼夜能战。那些构装从不言苦，端的省了许多兵马。"
 SUM_Neo_SGS.136.t:"厅中构装"
 SUM_Neo_SGS.136.d:"单说圣显厅里那些构装，被工匠们费尽心力修好之后，果然能走能动。不过石块拼成的人形，内里机关流转，竟能迈步挥臂，一日一夜不知疲倦。当下工匠们试着给一尊构装上了一柄长戈，那构装便舞将起来，戈影翻飞，虎虎生风，看得众人眼花缭乱。主事者大喜，当即下令照此办理，把厅中构装尽数披甲执兵，排成队列。你道这一队兵有何等好处？不吃粮，不睡觉，不喊累，刀砍上来只当搔痒，箭射上去迸出火星。有那老兵在旁看得目瞪口呆，说打了半辈子仗，从没见过这等怪物。从此沙丘腰带凭空多了一支不知疲倦的兵马。那构装列队站在校场上，纹丝不动，连日头晒久了也不见出一个汗珠，端的叫人称奇。"
 SUM_Neo_SGS.136.a:"重立赤王的旧制"
 SUM_Neo_SGS.136.b:"重建城邦的议会"
 SUM_SGS_RC_Mech_Smith:"构装工坊"
 SUM_SGS_RC_Mech_Smith_desc:"专设了一处工坊，修补那些构装。工匠是从外邦雇来的，图纸却锁在柜里，端的防人。匠人只管做，不知其所以然。那工坊门户严谨，端的防得很紧。"
 SUM_Neo_SGS.137.t:"构装工坊"
 SUM_Neo_SGS.137.d:"那些构装虽好，却也有个毛病：年久失修，动不动便要散架。主事者为此专设了一处工坊，专门修补构装。这工坊里的工匠，竟不是本地人，而是从外邦重金雇来的。原来修这构装的机关之术，本地工匠无人通晓，只好求助于外邦。那些外邦工匠进了工坊，日日对着石人拆了又装、装了又拆，忙得不亦乐乎。可主事者对他们却防得很紧，凡修构装的图纸，一概锁在柜里，钥匙攥在自己手中，工匠要用时须得当面领取，用完即刻交回，半分不许带出工坊。有那工匠心中不快，暗想我等替你卖力，却连张图纸都信不过？可转念一想，工钱给得足额，也就按下不提。那修好的构装一台赛过一台，主事者嘴上不说，心里却也服气。"
 SUM_Neo_SGS.137.a:"召集能战之众"
 SUM_Neo_SGS.137.b:"召集能谋之士"
 SUM_SGS_RC_Great_Works:"兴土木"
 SUM_SGS_RC_Great_Works_desc:"圣显厅旁，新起了一片宫室。竟是从旧遗迹上拆下来的。端的省事。旧砖新用，倒也气派。那些旧石料拆一处便少一处，端的可惜。"
 SUM_Neo_SGS.138.t:"兴土木"
 SUM_Neo_SGS.138.d:"沙丘腰带既要复古，少不得要盖几座像样的宫室，以显气象。主事者便在圣显厅旁，相中一片空地，要起一片宫室。原来不从别处采买，而是从附近的旧遗迹里拆。那些遗迹年代久远，早已荒草萋萋，无人问津，如今正好拆来用。当下便有一班匠人，扛着锤凿，跑到遗迹前，挑那完好的石块凿下来，用车拉回工地。有那老成持重的见了，不免摇头，说这是拆了祖宗的东西盖自家的房子，只怕不吉利。主事者却道，旧遗迹闲置也是闲置，与其让风沙慢慢侵蚀，不如拆来盖宫室，物尽其用。众人虽觉有理，可眼见那一根根刻着古纹的石柱轰然倒下，心里终究有些不是滋味。"
 SUM_Neo_SGS.138.a:"以神权号令沙漠"
 SUM_Neo_SGS.138.b:"以律法约束诸城"
 SUM_SGS_RC_Slab_Script:"释读石板"
 SUM_SGS_RC_Slab_Script_desc:"召集识字的人，来释读那些石板。多的是旧规矩、旧账目，端的是翻老账。那些陈年旧事，一朝重见天日。那些旧账翻将出来，端的叫人咋舌。"
 SUM_Neo_SGS.139.t:"释读石板"
 SUM_Neo_SGS.139.d:"圣显厅与旧遗迹里刨出了无数石板，上面刻满了古文字，只是年代久远，如今识得的人寥寥无几。主事者便张榜召集天下识字之人，前来释读。这释读的差事可不轻松：石板上的字古奥难懂，有的缺了半边，有的被风沙磨平，得一点点地辨认、推测。当下便有各方学者应召而来，围坐在石板旁，你一言我一语地琢磨。读出来的东西，倒也实在，多是些旧规与旧账：哪年哪月收了多少粮，哪块地归谁家，犯了什么事该罚多少。有那满怀期望、想从石板里读出惊天秘密的，未免失望；可也有那细心的，从一笔旧账里看出了先民过日子的模样，啧啧称奇。这些旧规旧账看似琐碎，却让沙丘人第一次看清了先人是怎样在这片沙海上活过来的。"
 SUM_Neo_SGS.139.a:"把遗迹挖开"
 SUM_Neo_SGS.139.b:"把遗迹封回去"
 SUM_SGS_RC_Priest_Order:"祭司之序"
 SUM_SGS_RC_Priest_Order_desc:"祭司受职，都按次序来，那次序由官府排定。灵还是那旧灵，管灵的却换成了新人。端的意味深长。神未改，人已换。那些新受职的祭司，端的敬畏，不敢怠慢。"
 SUM_Neo_SGS.140.t:"祭司之序"
 SUM_Neo_SGS.140.d:"沙丘腰带重开祭祀，那祭司的位子少不得要重新安排。这安排也有一番学问：祭司按序受职，谁先谁后，谁主谁次，这序却不由神定，而是由官府来定。原来主事者吸取旧教训，不愿让祭司一族坐大，便把排位之权收归官府。于是有一班新任命的祭司，按着官府排下的名次，一一受职。那供奉的灵，还是千百年来旧有的灵，香火照旧；可管灵的人，却换成了官府新派的这一班。有那老祭司心里酸楚，说自己守了大半辈子的神龛，到头来竟被新人顶了位子；可新人毕恭毕敬，上香祷告一丝不苟，倒也挑不出错处。这便是主事者的高明处：灵不变，人心却稳了。这新旧交替之间，最难的便是这般不动声色，主事者却办得从容。"
 SUM_Neo_SGS.140.a:"重立赤王的旧制"
 SUM_Neo_SGS.140.b:"重建城邦的议会"
 SUM_SGS_RC_Rite_State:"国祀"
 SUM_SGS_RC_Rite_State_desc:"灵光之礼，升做了国祀。那礼在圣显厅外举办，来的有官，也有民。端的隆重。官民同拜，端的齐心。那国祀办得隆重，香火连着几夜不断，端的盛大。"
 SUM_Neo_SGS.141.t:"国祀"
 SUM_Neo_SGS.141.d:"沙丘腰带的祭祀既已重张，主事者索性把那灵光之礼升格为国祀。原是当地百姓祭拜神灵、祈求福祉的老礼数，如今升了格，成了举国上下都要行的大典。这大典的所在，不在别处，就在圣显厅外那片开阔的广场上。到了日子，但见广场上人山人海，来的有官也有民：官儿们衣冠齐整，按品级列班；百姓们则扶老携幼，挤在人群后头看热闹。礼官高声唱赞，乐师奏起古乐，香烟缭绕，烛火通明。有那从前不把这礼当回事的，如今见举国同祭，也肃然起敬。主事者站在高台上，望着黑压压的人群，心里明白：这一礼升格，收拢的可是满满的人心。礼数一升，香火便旺，远近百姓赶来赴礼的，把圣显厅外的空地都站满了。"
 SUM_Neo_SGS.141.a:"召集能战之众"
 SUM_Neo_SGS.141.b:"召集能谋之士"
 SUM_SGS_RC_Pari_Office:"置灵官"
 SUM_SGS_RC_Pari_Office_desc:"新设了一个官位，专管花灵之事。端的清闲。花灵若不来，这官便没事可做，只是干坐着。端的虚实难料。那官儿日日坐在衙里，端的清闲得紧。"
 SUM_Neo_SGS.142.t:"置灵官"
 SUM_Neo_SGS.142.d:"沙丘腰带把祭祀弄得热闹，少不得要设各种名目的官。其中有一桩，甚是古怪：竟设了一个专管花灵之事的官位。这花灵是何等人物？原是花神座下的使女，踪迹飘忽，灵异非常，寻常人等哪能轻易见到。官府偏生设了这个官，专人负责接待、供奉花灵，显得郑重其事。可怪就怪在，那花灵从来不肯露面，官儿备下的香案、供果、供品，日日摆着，却从没人来享用。于是这管花灵的官，成了个最清闲的差事：每日到岗，上香，看看供品，再下班回家，无事可做。有那笑话的，说这官儿端的是舒服，除了花灵不来，别的一切都省心。那官儿自己也苦笑，说我这官，是专等一个不肯来的人。"
 SUM_Neo_SGS.142.a:"以神权号令沙漠"
 SUM_Neo_SGS.142.b:"以律法约束诸城"
 SUM_SGS_RC_Shrine_All:"遍立灵龛"
 SUM_SGS_RC_Shrine_All_desc:"各处水驿，都立起了神龛。龛前还多站了一个官。端的稀奇。拜神的地方，也添了官气。那龛前的官儿，日日坐在那里，端的是给仪式添些体面。"
 SUM_Neo_SGS.143.t:"遍立灵龛"
 SUM_Neo_SGS.143.d:"沙丘腰带水驿众多，乃商旅性命所系。这一回官府下令，在各处水驿旁立起神龛，龛前还多站一个官。原来立龛是为了供神，求那水源不竭、行旅平安；多站一个官，则是为了督办驿务、盘查行人。于是但凡有水驿的地方，便多了一处小龛，龛里供着泥塑的神像，龛前立着一名官儿，按着时辰上香、登记过往客商。那些赶路的行商，远远望见龛前的官，心里便有几分怵：这又要登记，又要验关牒。可也难怪，水驿乃命脉所在，容不得半点闪失。有那初次经商的年轻人，不知规矩，漏报了一件货，被那官儿拦下盘问半晌，吓得冷汗直冒。日子久了，众人也就习惯了这龛前一站。"
 SUM_Neo_SGS.143.a:"把遗迹挖开"
 SUM_Neo_SGS.143.b:"把遗迹封回去"
 SUM_SGS_RC_Pilgrim_Guard:"护法队"
 SUM_SGS_RC_Pilgrim_Guard_desc:"朝圣路上，派了护法队。表面护的是香客，其实还有沿路的税卡。端的用心。一箭双雕。那些护法的兵，端的尽心，香客与税卡两下里都照看周全。"
 SUM_Neo_SGS.144.t:"护法队"
 SUM_Neo_SGS.144.d:"沙丘腰带朝圣之路渐热，香客络绎不绝，官府便在这条路上派了护法队。名义上自然是护送香客，保他们一路平安，免遭盗匪劫掠。可实际上，这护法队护的还不止香客，沿路那一处处税卡，也在他们的照看之内。原来官府早把朝圣当成了一桩大买卖：香客沿途要吃要住，要过卡缴税，这中间的油水，可不比寻常。于是护法队一面护着香客，一面盯着税卡，既防贼也防漏税。那些香客哪里晓得这些弯弯绕，只当是官府体恤，一路感恩戴德。有那精明的商贩，却瞧出了门道，趁着朝圣的热闹，在路边摆摊做起了生意，也靠这护法队的威风沾了不少光。这护法队走的是明面，收的是暗钱，端的一举两得。"
 SUM_Neo_SGS.144.a:"重立赤王的旧制"
 SUM_Neo_SGS.144.b:"重建城邦的议会"
 SUM_SGS_RC_Camel_Heavy:"重装驼骑"
 SUM_SGS_RC_Camel_Heavy_desc:"给驼骑披上了甲。慢是慢了些，可冲将起来，端的挡不住。那些笨重的驼骑，行走如山，势不可当。那披甲的驼骑，走一步便是一阵尘土，端的稳当。"
 SUM_Neo_SGS.145.t:"重装驼骑"
 SUM_Neo_SGS.145.d:"沙丘腰带要为商道护卫，少不得要装备驼骑。这沙漠里行军，靠的是骆驼，可骆驼皮软，遇上刀箭便吃亏。于是主事者想出一个法子：给驼骑加甲。当下便有匠人，用皮条与铁片，给骆驼披上一身铠甲，连脖子、胸口都护得严严实实。这一加甲，驼骑是慢了些，原先一日能赶的路，如今要多费些工夫，骆驼披着重甲，走起来也气喘吁吁。可好处也是明摆着的：一旦冲将起来，那披甲的驼骑便如同一堵移动的墙，刀砍上去迸火星，箭射上去当叮当，敌人哪里挡得住。当下有那骑兵试了一回，拍手叫好，说这铁驼冲阵，胜过十队轻骑。从此沙丘腰带的多了一支披甲驼骑，行走沙海，威风八面。"
 SUM_Neo_SGS.145.a:"召集能战之众"
 SUM_Neo_SGS.145.b:"召集能谋之士"
 SUM_SGS_RC_Storm_Banner:"风沙军团"
 SUM_SGS_RC_Storm_Banner_desc:"挑选耐得风沙的人，编成一支军团。这支兵马专挑沙暴天出击。端的骠悍。别人躲避，他们迎风。那军团里的人，个个惯经风沙，端的剽悍得很。"
 SUM_Neo_SGS.146.t:"风沙军团"
 SUM_Neo_SGS.146.d:"沙丘腰带练兵，专挑耐得住风沙的人。原来这沙海上打仗，讲究的是与天斗，沙暴一起，天昏地暗，寻常人等睁不开眼、站不稳脚，可若能练出一批不惧风沙的健儿，专挑沙暴天出击，那便占尽便宜。于是主事者下令，从各城遴选那些生于沙、长于沙、惯经风沙的精壮，编成一军。这军团的人，个个皮肤黝黑，眼里揉得进沙子，风沙越大越是精神。平日里苦练沙漠中辨向、潜行、突袭的本事。每逢沙暴将至，旁人皆躲，他们却精神抖擞，借着漫天黄沙的掩护，悄然摸向敌营。敌人万没料到这等天气还有人来袭，往往猝不及防。有那吃了亏的，恨恨地说这哪是打仗，分明是沙里钻出来的鬼。"
 SUM_Neo_SGS.146.a:"以神权号令沙漠"
 SUM_Neo_SGS.146.b:"以律法约束诸城"
 SUM_SGS_RC_Fort_Chain:"堡垒链"
 SUM_SGS_RC_Fort_Chain_desc:"沿商道修起一串堡垒。堡与堡之间，骑兵一日便能到达，端的呼应灵通。首尾相救，再不怕被截断。那些堡垒首尾相望，端的如常山之蛇。"
 SUM_Neo_SGS.147.t:"堡垒链"
 SUM_Neo_SGS.147.d:"沙丘腰带商道漫长，护卫不易，主事者便想出一个稳当法子：沿商道修一长串堡垒。这堡垒的修法大有讲究，不是东一座西一座随便修，而是算好了距离，堡与堡之间，骑兵快马一日便可抵达。如此一来，一处有警，邻堡的骑兵当日便能赶到驰援，首尾相应，如同常山之蛇。当下便有工匠沿商道勘测选址，挖土夯墙，一座座堡垒拔地而起。每座堡里屯着兵马，备着粮草，插着旗号，远远望去，如同沙漠中的一串珍珠。那些行商见了这一串堡垒，心里踏实了许多，知道这一路有靠山。有那守堡的兵卒，日日登高瞭望，望着前后两堡的烟火，倒也不觉得寂寞。这堡垒连成一串，商道上便再无那等前不着村、后不着店的凶险去处了。"
 SUM_Neo_SGS.147.a:"把遗迹挖开"
 SUM_Neo_SGS.147.b:"把遗迹封回去"
 SUM_SGS_RC_Weapon_Works:"军械监"
 SUM_SGS_RC_Weapon_Works_desc:"设了一个军械监，专管打造兵器。监里的匠人，脾气比当官的还横。端的古怪。有一技在身，便有底气。那军械监的匠人，端的宝贝自己的手艺。"
 SUM_Neo_SGS.148.t:"军械监"
 SUM_Neo_SGS.148.d:"沙丘腰带立了军，兵器便是大事，主事者为此专设一个军械监，专管打造兵器。原以为是个规规矩矩的衙门，谁知里头的匠人，一个个脾气火爆，本事却也真大，打出的刀枪锋利无比。这些匠人仗着手艺在手，谁也求着他们，便渐渐骄横起来，连监里的官儿都不放在眼里。有一回，一位官儿来催缴兵器，说话稍稍急了些，那匠头把锤子往砧上一剁，瞪着眼道，催什么催，火候不到，急也打不出好刀！那官儿竟被噎得说不出话，只得陪笑回去。这军械监的匠人比官还横，倒也难怪，在这沙海上，能打出好兵器的，才是真本事。这般匠人纵有千般不是，可打出的兵器实在锋利，主事者也只好由着他们。"
 SUM_Neo_SGS.148.a:"重立赤王的旧制"
 SUM_Neo_SGS.148.b:"重建城邦的议会"
 SUM_SGS_RC_War_Chest:"军费库"
 SUM_SGS_RC_War_Chest_desc:"单设了一座军费库。端的难。要动用库里的钱，得三个人同时开口才成。端的谨慎。谁也别想私自挪用。那三道口令，端的把钱库守得铁桶也似。"
 SUM_Neo_SGS.149.t:"军费库"
 SUM_Neo_SGS.149.d:"沙丘腰带养了这支军队，钱粮便是命脉，主事者为此单设了一座军费库，把军费单独存放，不与寻常国库混在一处。这军费库的规矩最是森严：库里的钱，谁也不能擅动，若要动用，须得三个人同时开口，缺一不可。原来主事者吃过银钱上的亏，知道一个人的手一旦伸进钱库，便再难收回，于是立下这三人共管之法。那三个人，各有各的钥匙，各有各的印信，要取钱时，三人齐聚，当面对验，缺一人便开不得库门。当下便有那想钻空子的，想贿赂其中一个，谁知那两人根本不认，事情便告吹。自此军费库铜墙铁壁，谁也别想从中捞取分毫。管库的老吏每日擦拭账册，念叨着这规矩立得好。"
 SUM_Neo_SGS.149.a:"召集能战之众"
 SUM_Neo_SGS.149.b:"召集能谋之士"
 SUM_SGS_RC_Old_Order:"旧制照行"
 SUM_SGS_RC_Old_Order_desc:"有人主张，一切照旧例行事。该交的交，该办的办，只是把账本换个封皮。端的省事。名目虽新，里子依旧。那旧例依旧，端的省了许多争论。"
 SUM_Neo_SGS.150.t:"旧制照行"
 SUM_Neo_SGS.150.d:"沙丘腰带与雨林重算账目，众人意见纷纷。其中有一派人，主张照旧例行事：该交的照旧交，该办的照旧办，一切都不改，只不过把那账本换个新封皮，做个样子罢了。原来他们不愿得罪雨林，也不愿触动自家的老规矩，只盼着糊弄过去。当下便在议事厅上侃侃而谈，说什么祖宗之法不可轻变，又说换汤不换药最是稳妥。可话音未落，便有那性子直的站出来反驳，说账本换个封皮，里头的旧账还是旧账，欠的水、占的路一样不少，这般自欺欺人，何曾在替沙丘百姓打算？两下里争得面红耳赤。主事者听了半晌，只是低头不语，究竟依了哪边，暂且按下不表。那主张照旧的，兀自还想再争，见主事者不语，只得讪讪退下。"
 SUM_Neo_SGS.150.a:"以神权号令沙漠"
 SUM_Neo_SGS.150.b:"以律法约束诸城"
 SUM_SGS_RC_Tribute_New:"贡赋新算"
 SUM_SGS_RC_Tribute_New_desc:"与雨林重算贡赋。交还是照旧交，只是数目少了些，名目也换了。端的体面。面上有了光，里子也实惠。那少交的数目虽小，端的也是面子。"
 SUM_Neo_SGS.151.t:"贡赋新算"
 SUM_Neo_SGS.151.d:"沙丘腰带与雨林的账，到底还是要重算。这一回算下来，结论是：交还是交，只是数目少了，名目也换了。这账算得颇有讲究：先前叫进贡，如今换个名目，改叫互市或摊派，听着便不那么刺耳；数目上也减了几成，让沙丘这边喘口气。当下双方便各派算手，坐在席间拨着算盘，一笔一笔地对。那雨林来的算手起先把价抬得老高，沙丘这边的算手不甘示弱，把历年的旧账一翻，指出哪年多收了、哪年重了，一条条列得分明。几番推算下来，那数与名目便定了。虽然沙丘这边仍要往外掏东西，可比起往年，确乎轻省了些。有那心思活的，说这是不磕头也不吃亏的买卖。这般重算，名目上好看，里子也实惠，沙丘这边总算喘过一口气。"
 SUM_Neo_SGS.151.a:"把遗迹挖开"
 SUM_Neo_SGS.151.b:"把遗迹封回去"
 SUM_SGS_RC_Border_Old:"边界旧约"
 SUM_SGS_RC_Border_Old_desc:"边界一寸不动。只是把守界的人，换成了自家兄弟。端的巧妙。地界如旧，主人已换。那地界一寸未动，碑石依旧立在原来的沟上，只是守碑的人换了装束。端的巧。"
 SUM_Neo_SGS.152.t:"边界旧约"
 SUM_Neo_SGS.152.d:"沙丘腰带与雨林议和，条款之中有一条最是要紧：边界一寸不动，只把守界的人换成自己人。原来先前那边界上，守卡的尽是雨林的人，沙丘百姓过往，处处受制，低人一头。如今地界照旧，可守界的人却换成了沙丘自家子弟，这一下，情形便大不同了。当下便有沙丘的兵丁，接管了各处关卡，插上自家的旗号。那些过往的行商百姓，看见守卡的换成了熟人，心里也踏实了几分。有那从前的守卡兵，交了差事，灰溜溜地退回雨林那边去。旁人看了，都说这一着棋妙：地盘一寸没让，可里子却换了个干净。这守关的人一换，沙丘百姓过关再不必低人一头。有那昔日吃过守卡苦头的，特意绕道走一回自家关卡，只为看一眼新换的旗号。"
 SUM_Neo_SGS.152.a:"重立赤王的旧制"
 SUM_Neo_SGS.152.b:"重建城邦的议会"
 SUM_SGS_RC_Keep_Clerks:"留用旧吏"
 SUM_SGS_RC_Keep_Clerks_desc:"会算账的人，哪一朝都缺。那些旧吏，大多留用下来。端的识时务。换汤不换药，衙门还得靠他们转。那些旧吏熟悉账目，端的省了新官许多摸索的工夫。"
 SUM_Neo_SGS.153.t:"留用旧吏"
 SUM_Neo_SGS.153.d:"沙丘腰带一番改革，朝廷上下少不得要用人。这用人也有门道：那些会算账、懂政务的旧吏，大多被留用了。原来新朝初立，百废待兴，最缺的便是能办事的人。那些旧吏虽然在改朝换代中难免心存观望，可要说理财断案、催科征粮，却是把好手，换作一群生手，只怕要把事情办得一团糟。主事者深明此理，便不计前嫌，把旧吏大多留用，仍旧叫他们管钱粮、理词讼。当下便有那革命口号喊得最响的年轻人不服，觉得自己劳苦功高，反倒不如那些旧吏吃香。主事者便道，会算账的人到哪朝都缺，你若也能把这本账算清楚，我便也用你。那年轻人碰了一鼻子灰，只得回去苦练算盘。这般用人，端的把新旧两班人都拴在了一处。"
 SUM_Neo_SGS.153.a:"召集能战之众"
 SUM_Neo_SGS.153.b:"召集能谋之士"
 SUM_SGS_RC_Quiet_Land:"守成之策"
 SUM_SGS_RC_Quiet_Land_desc:"治国之道，端在一个稳字。不折腾，不扩张，安安稳稳把眼下的日子过好。端的实在。不求虚名，只求实惠。那些折腾的事，一件也不做，端的安稳。"
 SUM_Neo_SGS.154.t:"守成之策"
 SUM_Neo_SGS.154.d:"沙丘腰带兜兜转转，折腾了好大一圈，到头来主事者又回到那句老话：不折腾，不扩张，把眼下的日子过稳。这话听着平淡，却是拿血汗换来的教训。先前也曾意气风发，要兴兵、要拓土、要复古，结果呢？兵兴了，钱粮耗尽；复古了，争议丛生。如今总算明白，沙丘的百姓要的不是那惊天动地的伟业，而是井里有水、田里有粮、夜里能睡个安稳觉。于是主事者收起雄心，专心于眼前：修水驿，劝农桑，平诉讼，通有无。那些跃跃欲试要建功立业的，也渐渐熄了心思。城里的日子，一日不同于一日，慢慢地稳了下来。有那历经动荡的老人，捋着白须叹道，这才像过日子的样子。这安稳二字，说来平淡，却是沙丘百姓盼了多少年的福分。"
 SUM_Neo_SGS.154.a:"以神权号令沙漠"
 SUM_Neo_SGS.154.b:"以律法约束诸城"
 SUM_SGS_RC_Sand_Throne:"沙王再临"
 SUM_SGS_RC_Sand_Throne_desc:"圣显厅旁，起了座高台，台下军士按号站定。台上的人受了名分，第一道令便是：沙丘所有的道都设卡，所有的驿都设戍。端的齐整。沙丘从没这般安静。"
 SUM_Neo_SGS.155.t:"沙王再临"
 SUM_Neo_SGS.155.d:"圣显厅旁，新起了一座高台，台高数丈，登台远望，半个沙丘腰带尽收眼底。这一日台上台下，聚集了沙丘的兵马，台下按着号令站得整整齐齐，刀枪如林，旗帜招展。那台上站着的，便是新受名分的主事者，他身披甲胄，接受了这座高台，也就接受了统辖这片沙海的名分。受名分已毕，他当即颁布第一道令：把沙丘所有的道都设上卡，所有的驿都设上戍，一处分不得遗漏。此令一下，各路人马火速分头去办。不消几日，沙丘腰带的大小道路上，关卡林立，驿戍相望。那沙丘从没有这样整齐过，也从没有这样安静过：整齐的是那一字排开的兵与旗，安静的是那再没人敢造次的人心。有那老者远远望着高台，喃喃道，这沙海，如今是真正捏成一只拳头了。"
 SUM_Neo_SGS.155.a:"把遗迹挖开"
 SUM_Neo_SGS.155.b:"把遗迹封回去"
 SUM_SGS_RC_Old_Dune:"沙丘守成"
 SUM_SGS_RC_Old_Dune_desc:"沙丘与雨林，重划了账：税减了，哨撤了，地界却不动。水驿照旧开，学馆照旧办，矫论团的经义照旧在帐里讲。端的安稳。日子比前几年好过。"
 SUM_Neo_SGS.156.t:"沙丘守成"
 SUM_Neo_SGS.156.d:"沙丘腰带与雨林把那笔旧账重新划过，划定的条款着实在理：税减了，哨撤了，地界却一寸不动。这一划，双方都松了口气。税减了，百姓肩上的担子轻了；哨撤了，边境上的火药味淡了；地界不动，谁也没伤着脸面。沙丘这边得了喘息，便安心办起自家的正事：水驿照旧开，过往商旅照样有水源；学馆照旧办，孩童们照样拨算珠、临古字；矫论团的经义，也照旧在帐里讲，只是讲得更贴合过日子。这一连串安稳下来，沙丘的日子，果然比前几年强多了。市面渐渐兴旺，人心渐渐安定，夜里行商也敢走远路了。有那在最乱时逃离的百姓，如今又陆续搬了回来。日子安稳了，那逃散的人家又慢慢聚了回来，沙丘的市面，一日胜过一日。"
 SUM_Neo_SGS.156.a:"重立赤王的旧制"
 SUM_Neo_SGS.156.b:"重建城邦的议会"

 #### 开战须弥 · 雨林的门 ####
 SUM_SGS_WAR_The_Dune_Rises:"沙丘东望"
 SUM_SGS_WAR_The_Dune_Rises_desc:"沙丘的商路、水驿与圣显厅，名分上仍挂在雨林名下。花灵不再替人做决定，可这一次，她们替凡人看清了一件事：不把这笔账清掉，沙上的人便永远弯着腰。端的透彻。"
 SUM_Neo_SGS.157.t:"沙丘东望"
 SUM_Neo_SGS.157.d:"沙丘腰带的商路、水驿与圣显厅，名分上依旧挂在雨林名下，并未完全脱钩。这名分上的牵扯，就像一根看不见的线，时时扯着沙丘人的心。可这一回，有一桩事却叫人回味：那花灵，往日是替人做决定的，凡人的事，她们一开口便定了。可这一次，她们不再替人拿主意，只是让凡人自己看清了一件事：不把这笔旧账清干净，沙上的人便永远弯着腰，直不起身。原来花灵们看透，凡事靠别人做主，终究是寄人篱下，唯有自己把账算清、把腰挺直，才算真正站稳。此言传开，沙丘的百姓默默记在心里。有那年轻后生，听完久久无言，末了攥紧了拳头。花灵这番点破，不啻在沙丘人心里点了一盏灯，照见了自己弯曲多年的腰。"
 SUM_Neo_SGS.157.a:"以动员令起兵"
 SUM_Neo_SGS.157.b:"以盟约召集部族"
 SUM_SGS_WAR_Call_All:"召集各城各部"
 SUM_SGS_WAR_Call_All_desc:"召集令传遍各城各族。来投的人，比原先估的还多。端的踊跃。那些青壮背粮带刀，从四面八方赶来。那来投的人，把各城的粮仓都吃紧了，端的踊跃。"
 SUM_Neo_SGS.158.t:"召集各城各部"
 SUM_Neo_SGS.158.d:"沙丘腰带要办大事，先下了召集令。这召集令一路传檄，传遍了各城各族：沙漠的城邦、绿洲的部落、商道的各族，处处都收到了消息。原来主事者要召集众人共议一件关乎这片沙海的大事，特地广而告之。令一下，各城各族便纷纷动身，有的是骑驼而来，有的是驾车而至，有的干脆徒步穿越沙海。到了约定的日子，那聚拢来的人，黑压压站了一大片，比主事者事先估摸的多了不少。原来这些年沙丘日子渐稳，人心思聚，一听说要共议大事，便都赶来瞧个热闹、出份力气。主事者站在高处，望着这满满一片人头，心里又喜又忧：喜的是民心可用，忧的是人多了，主意也杂，这会可不好开。"
 SUM_Neo_SGS.158.a:"直取雨林关隘"
 SUM_Neo_SGS.158.b:"先断其商路"
 SUM_SGS_WAR_War_Fund:"征军费"
 SUM_SGS_WAR_War_Fund_desc:"这笔军费，一半出自盐路，一半出自商户。两边各担一半，端的公道。凑将起来，竟也足够。那盐路的利钱，平日里都归了商户，如今拿出一半来充军，端的痛快。"
 SUM_Neo_SGS.159.t:"征军费"
 SUM_Neo_SGS.159.d:"要办大事，钱粮开路，这军费从何而来，成了头等难题。主事者为此想出一个摊派之法：那盐路，出一半；那商户，出一半，两边合力，凑出这笔军费。原来沙丘的盐路，乃是相当当的财源，盐商获利丰厚，理应出这份钱；而那些走南闯北的商户，靠着沙丘的商道发了财，也该回报一二。当下便派人分头去知会盐路与商户。那盐商起先叫苦，说盐利微薄，可一算总账，也知道这笔钱躲不过，只得忍痛掏出；那商户们更是你推我诿，最后还是商会出面，按各家资本大小分摊了事。几番周折，这笔军费总算凑齐，一文不少。主事者点了点头，说有钱就好办事。这军费来得不易，主事者吩咐分文都要花在刀刃上，半点不许糟践。"
 SUM_Neo_SGS.159.a:"把话说给雨林人听"
 SUM_Neo_SGS.159.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Ration:"配给"
 SUM_SGS_WAR_Ration_desc:"粮与盐，都按人口配给。先尽着军队，再轮到百姓。端的分明。先后有序，谁也无话。那粮盐的份例，都按人头称过，多一粒也不给，端的分明。"
 SUM_Neo_SGS.160.t:"配给"
 SUM_Neo_SGS.160.d:"军费既已凑齐，接下来便是粮盐的分配。这沙海上，粮与盐皆是命根子，容不得乱分。主事者立下规矩：粮与盐一律按人口配给，一日几合粮、几钱盐，都有定数，谁也不许多占。可这配给也有个先后：先军后民。原来养兵乃头等大事，兵丁吃饱了，才有力气护住这片沙海，于是军中优先，百姓次之。当下便在各处设了配给的点，按名册一户户地发放。有那兵丁领了足额的粮盐，自然欢喜；百姓这边虽稍晚一步，可数足额，倒也没什么怨言。有那机灵的，想多领一份，冒名顶替，被管配给的吏一眼识破，当场呵斥回去。自此粮盐分配有条不紊，人心也稳。这先军后民虽分了先后，可毕竟都有定数，不至于有人饿肚子。"
 SUM_Neo_SGS.160.a:"倾全境之力"
 SUM_Neo_SGS.160.b:"留一支后手"
 SUM_SGS_WAR_War_Council:"定三路"
 SUM_SGS_WAR_War_Council_desc:"军议定了三路进兵。一路沿商道，一路穿沙脊，一路绕绿洲。端的周全。三路并进，端叫敌人顾此失彼。那三路人马，端的分头行事，互不相扰。"
 SUM_Neo_SGS.161.t:"定三路"
 SUM_Neo_SGS.161.d:"沙丘腰带大计已定，少不得要议定进兵的方略。那军师府的诸位，对着沙盘推演了数日，终于议出三路兵马：一路沿着商道稳步推进，一路穿越沙脊险中求胜，一路绕行绿洲伺机而动。这三路各有所长：沿商道的一路，粮草补给方便，稳扎稳打；穿沙脊的一路，出敌不意，最为凶险，也最为奇巧；绕绿洲的一路，则可掩人耳目，从侧翼包抄。当下便点齐三路人马，各派一员得力的将领统带，约定了日期，分头进发。那出征的将士，个个摩拳擦掌，披甲执兵，号角一响，三路人马便如三支利箭，朝着不同的方向射了出去。有那老兵望着远去的尘土，低声对同伴道，这一回，怕是要动真格的了。"
 SUM_Neo_SGS.161.a:"以动员令起兵"
 SUM_Neo_SGS.161.b:"以盟约召集部族"
 SUM_SGS_WAR_Proclaim:"讨雨林檄"
 SUM_SGS_WAR_Proclaim_desc:"檄文上写的，端的是一笔账。欠的水、占的路、多收的税，一条条列得清清楚楚。端的明白。有理有据，端的理直气壮。那檄文传将出去，端的激起一片响应。"
 SUM_Neo_SGS.162.t:"讨雨林檄"
 SUM_Neo_SGS.162.d:"三路大军未动之前，先有一纸檄文传了出去。这檄文不写那些讨伐的套话，也不骂什么逆天悖理，通篇写的却是一笔账：欠的水、占的路、多收的税，一条条列得分明。原来主事者深谙人心，知道打仗要打得有理，这檄文便是把沙丘百姓这些年的委屈，一件件摆出来给天下人看。那执笔的书吏，把旧账翻了个底朝天，哪一年欠了多少水，哪一处路被占了几里，哪一回税多收了几成，写得清清楚楚，连数目都核对过。檄文一出，各处传抄，百姓们读了，都说这话说到了心坎里，原先那些憋屈，如今总算有了出处。有那热血青年，读罢檄文，当场就要报名从军。这檄文传开，沙丘的怨气便有了出处，端的抵得上千军万马。"
 SUM_Neo_SGS.162.a:"直取雨林关隘"
 SUM_Neo_SGS.162.b:"先断其商路"
 SUM_SGS_WAR_Night_March:"夜行"
 SUM_SGS_WAR_Night_March_desc:"大军夜里行路，靠星光辨认方向。星光一暗，队伍便停下来，就停在沙窝里。端的谨慎。不辨方向，绝不冒进。那沙窝里歇着的人马，端的安静得很，连咳嗽都不敢出声。"
 SUM_Neo_SGS.163.t:"夜行"
 SUM_Neo_SGS.163.d:"三路大军进发，偏生选在夜里行军。这沙漠里夜行，靠的不是灯笼火把，而是天上的星光。原来白日里沙海刺眼，目标太大，夜里借着星光赶路，既能隐蔽，又凉快省力。军中那些识星的向导，仰头辨着星座，认准了方向，便领着队伍稳步向前。可这法子也有个短处：沙漠的夜，说变就变，一旦云起，星光被遮，便辨不得方向。于是军中立下死规矩：星光一暗，全军即刻停下，就地扎营，躲在沙窝里，绝不敢乱走一步。有那回，一片乌云飘来，星光顿失，大军便齐刷刷停在沙丘的背风处，人衔枚，马裹蹄，静静等着云散。许久星光重现，方才又拔营前行。这般谨慎，端的把夜行军的风险压到了最小，多少回都靠它躲过了沙暴。"
 SUM_Neo_SGS.163.a:"把话说给雨林人听"
 SUM_Neo_SGS.163.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Wind_Guide:"识风人"
 SUM_SGS_WAR_Wind_Guide_desc:"识风的人，走在队伍最前头。他抬眼看看云，便知道哪片要起沙。端的神了。有他引路，大军避开风沙。那识风的人，端的眼尖，一片云便能看出十里外的风沙。"
 SUM_Neo_SGS.164.t:"识风人"
 SUM_Neo_SGS.164.d:"夜里行军，最怕的是沙暴骤起，主事者便特地选了识风的人走在最前。这识风的人，都是沙海里滚出来的老手，他们观云辨风，本领通神：看一眼天边的云色，闻一闻风里的气息，便知道哪片沙地待会儿要起沙，哪道沙梁即将移动。有他们走在头里，大军便如同长了眼睛。这一日，那领头的识风者忽然抬手，示意全军止步，众人顺着他指的方向望去，但见远处天际，一片黄云正悄悄翻卷。识风者低声道，不好，那片要起沙了，且绕道走。众人依言，临时改道，方才避开了一场漫天沙暴。有那年轻的兵丁，起初还不信，待看见那片沙地果然黄沙漫天，方才咋舌，说这识风的，端的比神仙还灵。"
 SUM_Neo_SGS.164.a:"倾全境之力"
 SUM_Neo_SGS.164.b:"留一支后手"
 SUM_SGS_WAR_Beast_Load:"驭兽驮运"
 SUM_SGS_WAR_Beast_Load_desc:"驯好的沙兽，用来驮运辎重。这兽比骆驼还能多走半程。端的得力。有它帮忙，粮草便跟得上。那沙兽驮着粮草，端的省力，只是喂养起来费些草料。"
 SUM_Neo_SGS.165.t:"驭兽驮运"
 SUM_Neo_SGS.165.d:"大军远行，粮草辎重最是累赘，主事者便想出一个法子：用驯好的沙兽驮运辎重。原是沙海中土生土长的异兽，性情温顺，力大无穷，脚掌宽厚，走在沙上如履平地，不陷不沉。军中的驯兽人，费了许久工夫，才把它们一一驯服，配上驮架，用来运载粮草器械。这一用，果然好用：那沙兽耐力惊人，一口气能比骆驼多走出半程路来，且吃的少，喝的少，极为省心。当下便有那管粮的官，拍着沙兽的脖子赞不绝口，说有了这等坐骑，粮草便跟得上了。行军途中，但见一队队沙兽，驮着沉沉的辎重，稳稳当当地跟在大军后头，从不掉队。这沙兽端的省心，一路驮来，粮草器械一件不曾失落，管粮的乐得合不拢嘴。"
 SUM_Neo_SGS.165.a:"以动员令起兵"
 SUM_Neo_SGS.165.b:"以盟约召集部族"
 SUM_SGS_WAR_Water_Hop:"沿水驿跳进"
 SUM_SGS_WAR_Water_Hop_desc:"大军沿水驿，一站一站往前跳。每跳一步，补给便近了一分。端的稳当。不贪快，步步为营。那一站站的补给，端的接得上，人马从不缺水。"
 SUM_Neo_SGS.166.t:"沿水驿跳进"
 SUM_Neo_SGS.166.d:"大军进发，补给最难，主事者便定下一个法子：沿水驿一站站往前跳。这跳字大有讲究：大军不是一口气冒进，而是以水驿为落脚点，攻下一处水驿，便在此站稳脚跟，补充粮水，再向前推进到下一处。如此一站站地跳，跳一步，后头的补给便近一分，前方的战线也稳一分。原来沙漠作战，最怕补给线拉得太长，一旦被截断，便全军困在沙海里。如今这般步步为营，每进一步都有水驿相接，粮草能源源不断地跟上。当下大军依计而行，今日下一驿，明日下一驿，稳扎稳打。有那性急的将领嫌慢，主事者便道，慢些无妨，稳当要紧，沙海里冒进，是要吃大亏的。众人听了，方才耐住性子。"
 SUM_Neo_SGS.166.a:"直取雨林关隘"
 SUM_Neo_SGS.166.b:"先断其商路"
 SUM_SGS_WAR_Silent:"无声行军"
 SUM_SGS_WAR_Silent_desc:"沙丘练兵，先练一个静字。号令一下，全军夜行，铃铛摘了不摇，马蹄裹上厚布，几百人鱼贯而过，连宿鸟也不惊动。兵贵神隐，端的把一支人马，练成了沙上的影子。静之一字，端的利害。"
 SUM_Neo_SGS.167.t:"无声行军"
 SUM_Neo_SGS.167.d:"大军夜行，最怕暴露行踪，主事者便下令全军习练无声行军。这无声行军，规矩多多：马蹄要用布层层包裹，落下去悄无声息；驼铃、马铃一概摘下，不许发出半点声响；连那兵士身上的甲片，也要用布条缠紧，走起来不得叮当作响。更有那严厉的规矩：不许高声说话，不许咳嗽，连传令也用手势与低语。当下全军严守，行起军来，但见人影幢幢，悄无声息，如同一片影子在沙上滑过。有那新兵不惯，忍不住咳了一声，立刻被身旁的老兵狠狠瞪了一眼，吓得再不敢出声。这一番无声行军练成，大军便能神不知鬼不觉地摸到敌人近前。这一番无声行军练熟，大军便如同一柄藏在鞘里的刀，不到近前，敌人浑然不觉。"
 SUM_Neo_SGS.167.a:"把话说给雨林人听"
 SUM_Neo_SGS.167.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Storm_Post:"强攻哨所"
 SUM_SGS_WAR_Storm_Post_desc:"沙丘要打通商道，头一桩便是拔钉子。雨林伸进沙丘的哨所，便如钉在肉里的刺，得一处一处拔去。拔掉一处，商道上便少一处关卡，商队也少受一回盘剥。端的先把这些刺拔净，才好谈别的。"
 SUM_Neo_SGS.168.t:"强攻哨所"
 SUM_Neo_SGS.168.d:"三路大军既定，头一件事便是拔除那些伸进沙丘的雨林哨所。这些年雨林在沙丘的商道上，处处插手，设了一处处哨所，卡住要道，沙丘百姓过往，处处受制。如今要夺回自家商道，先得拔掉这些钉子。主事者下令：雨林伸进沙丘的哨所，先得拔掉，且不须多，拔一处，商道便少一处卡。当下三路人马，分头行动，专挑那些哨所下手。有那哨所守兵顽抗的，便一时刀兵相见；有那识时务的，见大势已去，便弃械投降。拔掉一处哨所，当地百姓便欢欣鼓舞，拆去卡子，重开商道。如此一处接一处地拔，沙丘的商道，便一点点地重新畅通起来。有那老商贩，摸着重新畅通的路，眼眶都红了。"
 SUM_Neo_SGS.168.a:"倾全境之力"
 SUM_Neo_SGS.168.b:"留一支后手"
 SUM_SGS_WAR_Siege_Rig:"造攻具"
 SUM_SGS_WAR_Siege_Rig_desc:"沙丘造攻具，不另出心裁，只照着圣显厅里的图样打造。这东西笨重非常，几十人抬着走，看着蠢笨，可那雨林哨所的土墙偏偏怕它，一旦撞上，墙便裂开大口。端的应了那句：笨有笨的用处。笨物偏能啃硬墙。"
 SUM_Neo_SGS.169.t:"造攻具"
 SUM_Neo_SGS.169.d:"沙丘腰带营中有一伙木匠铁匠，都是打小跟着父辈修渠造闸的，如今被叫到一处，照着圣显厅墙上的旧图样造攻具。那图样刻的是古时破城的家什，样子粗笨，木梁比人腿还粗，铁钩有小儿臂膀大。头一件造出来，十几个壮汉抬着走了半里地，气喘如牛，围看的兵都笑，说这物件还没到哨所，人先累垮了。领工的老匠人也不恼，蹲在地上用手指头画，叫众人把梁再削薄一层，钩子再改短一寸，试了三回，方才轻便些。运到哨所墙下那天，守军立在垛口上看，看得发怔，有个兵伸手去摸墙土，摸下一把，脸就白了。那墙原是夯土夹碎石砌的，经不起这般大家伙一撞。头一下撞上去，墙上簌簌落土；第二下，垛口裂了缝。笨有笨的用处，只要撞得着。"
 SUM_Neo_SGS.169.a:"以动员令起兵"
 SUM_Neo_SGS.169.b:"以盟约召集部族"
 SUM_SGS_WAR_Cut_Water:"断水驿"
 SUM_SGS_WAR_Cut_Water_desc:"攻哨所有一巧法，不去硬攻，只在上游把水引开。那哨所里明明蓄着水，可水道一断，守军守着水池却汲不上来。渴上三日，人心先乱，不攻自破。端的省了多少刀兵。端的断了水源，敌人自乱。"
 SUM_Neo_SGS.170.t:"断水驿"
 SUM_Neo_SGS.170.d:"那哨所扎在半坡上，吃水全靠上游一条小溪。沙丘腰带的人不打墙，先遣一队人往上游去，趁着夜色掘开一道旧渠，把溪水引到山背后的洼地里。天亮了，哨所的人照旧挑桶下坡，走到溪边一看，溪底只剩一层湿沙，几洼浑水，连驴都不肯喝。守军在墙上骂了半日，骂得口干，越发没水。有人想出主意，在墙内掘井，掘了三丈深，只掘出干土与碎石。第三日，哨所的伙夫端着一碗水分给八个人，一人一口，喝完都把碗底舔了。有个兵趁夜摸下坡去偷水，被巡哨的按住，捆了送回墙根，守军连骂也懒得骂。百夫长夜里把水囊数了三遍，数目没少，心里却越发慌。列位围城之法多端，断粮是断命，断水也是断命，断水还快些。"
 SUM_Neo_SGS.170.a:"直取雨林关隘"
 SUM_Neo_SGS.170.b:"先断其商路"
 SUM_SGS_WAR_Night_Wall:"夜攀"
 SUM_SGS_WAR_Night_Wall_desc:"夜袭哨所，专挑身手灵便的人攀墙。那墙高丈余，攀上去的不到一半，其余的摔下来，摔得鼻青脸肿。可就在这乱当口，墙上的灯忽然一盏盏灭了，原来早有人埋伏在暗处。"
 SUM_Neo_SGS.171.t:"夜攀"
 SUM_Neo_SGS.171.d:"攻哨所那一夜，营里挑出三十个手脚最灵便的后生，都是自幼在沙丘上翻崖越坎的，腰里别短刀，背上缠麻绳，趁三更天摸到墙根。墙上每隔十步挂一盏油灯，照得墙头雪亮，人一露头便要挨箭。头一批十个人攀上去，绳断的断，手滑的滑，落在墙下闷声不响。内中有个绰号沙狐的，攀到半墙绳磨断了，跌进墙根一堆沙里，翻身起来拍拍土，又往墙上摸。正在这时，天上起了一阵风，把墙头的灯一盏接一盏吹灭了，守军摸黑放箭，射的尽是空处。墙头一阵乱，有人踩翻了灯油，火沿着木栏舔上去。剩下的人趁这一暗，纷纷搭上墙头。事后清点，三十人上去的不到一半，可上去的那一半，已经把门开了。成事不全靠人多，多半靠那一阵风。"
 SUM_Neo_SGS.171.a:"把话说给雨林人听"
 SUM_Neo_SGS.171.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Keep_Post:"据哨而守"
 SUM_SGS_WAR_Keep_Post_desc:"哨所一旦易手，沙丘并不拆毁，只把它改成自己的戍所。门朝哪边开，墙上挂谁的旗，一概由沙丘说了算。昨日还是雨林的关卡，今日便成了沙丘的眼睛。"
 SUM_Neo_SGS.172.t:"据哨而守"
 SUM_Neo_SGS.172.d:"哨所一到了手，头一件事不是庆功，是改门。那哨所原是雨林那边立的，门朝东开，正对着往须弥城去的大道，摆明了是看着沙丘的。沙丘的人接过手来，先拆了东门，重新在朝南一面砌起门洞，说是门朝哪边开，得由沙丘的水与风说了算。砌门的匠人一边垒砖一边念叨，说这墙根底下埋着旧年的界石，挖出来一看，字迹早被沙磨平了。门楣上新刻了三个字，刻得歪，倒一眼认得。戍所里原来的粮仓、马棚、瞭望台都留着，只把旗换了，把墙上的雨林纹样凿去，抹上一层新泥。守在这里的兵，多半是本地招的，白日操练，夜里轮值，闲了便蹲在门口抽旱烟。过路的问，门朝南不晒么。守门的说，晒，可南边是自家的水。"
 SUM_Neo_SGS.172.a:"倾全境之力"
 SUM_Neo_SGS.172.b:"留一支后手"
 SUM_SGS_WAR_Turn_Guard:"策反戍卒"
 SUM_SGS_WAR_Turn_Guard_desc:"雨林的戍卒，大半是花钱雇来的，并非死心塌地。沙丘派去的人也不多说，只问一句：你替谁当兵？这一问，便问得许多人心里活动。给谁扛枪不是扛，谁给的粮多，便替谁卖命。"
 SUM_Neo_SGS.173.t:"策反戍卒"
 SUM_Neo_SGS.173.d:"雨林在各处哨所屯的兵，十成里有七成是雇来的，按月给钱，管饭管住，死了给一笔抚恤，家里人来领了钱便走。沙丘腰带摸清了这个底细，派了几个能说会道的人，扮作贩盐的、修渠的，混到哨所附近的村口，见着戍卒便蹲下来说闲话。闲话说了半日，末了只问一句：你替谁当兵。那戍卒先是一愣，随即低头去抠鞋底的泥，抠了半天，说不出一句囫囵话。有那心直的便道，谁给钱我替谁当兵。派去的人点点头，也不多劝，起身挑担子走了，走出十来步，回头又说一句，钱是雨林给的，命可是你自己的。那戍卒立在原地，把这句话嚼了半晌。此后他换哨时，总要多看两眼东边那条路。看官但见，一句话问在要紧处，比十面锣鼓还响。"
 SUM_Neo_SGS.173.a:"以动员令起兵"
 SUM_Neo_SGS.173.b:"以盟约召集部族"
 SUM_SGS_WAR_Village_Talk:"联络漠边村社"
 SUM_SGS_WAR_Village_Talk_desc:"雨林边的村社，也给重税压得喘不过气。沙丘派去的人带着账本，算给他们看：同样一担粮，交与雨林剩几成，交与沙丘剩几成。账目摆开，村社的人动了心。端的靠一本账，说动了四面八方。"
 SUM_Neo_SGS.174.t:"联络漠边村社"
 SUM_Neo_SGS.174.d:"雨林边上那些村社，往年只交一份租，如今哨所要粮，教令院要税，过路的兵还要一份草料钱，一年下来，仓里剩不下几斗。沙丘腰带的人要去说这事，不带刀，只带一本账。那账是几个老书吏熬了半月抄的，哪一年交了几成，哪一年又添了什么名目，一笔一笔记得分明。到了村里，众人围坐，把账摊在膝上，一页一页念给村老听。念到某一年凭空多出的那一项，村老拍了下大腿，说这一项连我们都没弄明白。说的人便道，弄不明白的，原也用不着再交。屋里静了一阵，有人先笑出声来。里正起身，取来一盒印泥，说今日这话，各人按个手印罢。于是排着队按，按完了把账本合上，交给村里收着。临出门，里正追出来问，赶明年的账还念不念。来的人回头道，念。"
 SUM_Neo_SGS.174.a:"直取雨林关隘"
 SUM_Neo_SGS.174.b:"先断其商路"
 SUM_SGS_WAR_Amnesty:"宽赦"
 SUM_SGS_WAR_Amnesty_desc:"沙丘招降，定下规矩：凡归降者，旧事一概不问。愿留下的，分给田地，叫他们落地生根；愿走的，发足口粮，送他们上路。"
 SUM_Neo_SGS.175.t:"宽赦"
 SUM_Neo_SGS.175.d:"哨所与村社的人来归，营门大开，不搜身，不问旧事，只在案前排成两行。案上一边摆着地契，一边摆着粮袋，谁也不藏着。愿留下的，登个名，领一块地，地界当场由里正指给你看；愿走的，也不难为，量三斗粮，装进袋里，扛上肩便可出营。有个老兵站了半晌，问了一句：我从前在对面放过箭，你们不记这个？管事的抬起头，说记那个做什么，你要留下，明日便与我同吃一锅饭。老兵听了，把肩上的袋子放下来，蹲在原处不走了。后头一个抱着孩子的妇人探头问，那我家那口子还在对面，也能来么。管事的道，来罢，来了照这个规矩。列位收人心不在话说得漂亮，在你肯不肯把地契与粮袋一并拿出来。一桩办下来，营门口的地界桩一日挪了三回。"
 SUM_Neo_SGS.175.a:"把话说给雨林人听"
 SUM_Neo_SGS.175.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Buy_Clerk:"收买书吏"
 SUM_SGS_WAR_Buy_Clerk_desc:"关卡上的事，全靠书吏那一支笔。沙丘的人把摩拉递过去，书吏便把档换上一份，该记的少记，该抹的抹去。钱到笔转，一桩麻烦便消弭于无形。这法子虽不光彩，可在这沙海之中，省了无数口舌。"
 SUM_Neo_SGS.176.t:"收买书吏"
 SUM_Neo_SGS.176.d:"雨林与沙丘之间的关卡，设在大道咽喉上，来往驮队都要过关。关卡上不认人，认档：你是什么货，几时过的，往哪里去，一律由书吏记在册上，册子锁在木柜里，钥匙挂在书吏腰上。沙丘的人摸透了这一层，不硬闯，专在书吏身上做工夫。先是请酒，再是送一匹布，末了把一叠摩拉压在茶碗底下。那书吏收了，也不多话，把原来的档抽出来，另誊一份，货名改作粗盐，数目减了三成。驮队第二日大摇大摆过关，守关的兵翻册一看，摆手放行。过了半月上头来人查，书吏把新誊的一册捧上去，原册早在灶里烧了，查的人翻来翻去，只见数目齐整。那驮队回程时，又在茶碗底下压了一叠。一道关隘的厚薄，不在墙高，在那一支笔。"
 SUM_Neo_SGS.176.a:"倾全境之力"
 SUM_Neo_SGS.176.b:"留一支后手"
 SUM_SGS_WAR_False_News:"反间"
 SUM_SGS_WAR_False_News_desc:"沙丘用计，专在消息上做文章。故意把假话透给雨林的斥候，让他们当了真，回去说给自己人听。以假乱真，端的混淆了敌人的耳目。等雨林那边信以为真，调兵遣将，沙丘早已另有所图。"
 SUM_Neo_SGS.177.t:"反间"
 SUM_Neo_SGS.177.d:"沙丘营中捉了两个雨林斥候，没杀，也没关，只给了一顿饱饭。饭桌上坐着一个管事的，闲闲地说起话来，说南边那条道空得很，主力都往北去了。两个斥候听着，眼睛不住地转，饭也吃得快了。管事的话说到一半，故意压低了声，跟旁边人嘀咕两句，又摆手叫别说。这一来，两个斥候越发把耳朵竖着。第二日放他们回去，走时还塞了两块干粮。两人一路跑回营中，把听到的话一字不落地报了。雨林那边的主将半信半疑，先遣一队人往南探，探回来报说道上确有炊烟，其实是几个牧人烧的火。这一疑便误了三日，主将后来拍着案骂，骂的却是自己。骂完了，叫人把那两个斥候调去看草料。看官但见，假话要让人自己说出去，才有人信。"
 SUM_Neo_SGS.177.a:"以动员令起兵"
 SUM_Neo_SGS.177.b:"以盟约召集部族"
 SUM_SGS_WAR_Supply:"辎重线"
 SUM_SGS_WAR_Supply_desc:"大军未动，粮草先行。沙丘的辎重沿商道铺开，一站接着一站，如同长蛇。前一营吃完，后一营的粮车恰好赶到。端的把整条商道，变成了自家的粮道，人马走到哪里，便有接济跟到哪里。端的粮草接上，仗才敢往下打。"
 SUM_Neo_SGS.178.t:"辎重线"
 SUM_Neo_SGS.178.d:"大军要往东去，最怕的不是前头的刀，是后头的粮。沙丘腰带把商道上的旧驿站一处一处清理出来，隔三十里设一站，站里囤水、囤草、囤面，夜里点灯，白日挂旗。每站留一个老卒看门，来一队驮子便在一块木牌上划一道，划满了换一块。驮队从水驿出发，走到第一站换牲口，走到第二站换车夫，走到第三站把空袋卸下，装满再走。一站接一站，像一根绳子串起来，前头的人只消回头，便知道后头有东西跟着。有一站被沙埋了半截，老卒带着几个人挖了两日，把门重新淘出来。有一回前队断粮，炊事的人急得跺脚，管事的只说一句，等半个时辰。半个时辰后，后站的驮队到了。列位兵走多远，全看这条线有多长。"
 SUM_Neo_SGS.178.a:"直取雨林关隘"
 SUM_Neo_SGS.178.b:"先断其商路"
 SUM_SGS_WAR_Water_Team:"运水"
 SUM_SGS_WAR_Water_Team_desc:"沙漠作战，水比命贵。沙丘的运水队昼夜不停，车夫换人不换车，日夜兼程。人歇车不歇，一车车清水，源源不断送往阵前。"
 SUM_Neo_SGS.179.t:"运水"
 SUM_Neo_SGS.179.d:"沙丘这地方，打仗最费的不是箭，是水。营里专拨了一支运水队，二十辆大车，每车装四只羊皮水囊，白日走，夜里也走，车轮上裹着布，走在沙上不出声。车夫分两班，一班走前半夜，一班走后半夜，到点便换人，车不多停一刻。每回出发前，管队的要挨个捏一捏水囊，捏出气声的便换下来。有一辆车陷进流沙，二十来个人卸了水囊，拿肩顶着车杠硬推，推到天亮才出来。有个老车夫连着赶了三夜，眼皮肿得像桃，管事的把他拽下来，他还不肯，说这一车水是给前头伤兵送的。管事的道，你倒在路上，这一车水就白费了。老车夫听了，蹲在车边就睡，睡了不到一炷香，又爬起来去套牲口。前头喝的那一口水，是后头有人拿命换的。"
 SUM_Neo_SGS.179.a:"把话说给雨林人听"
 SUM_Neo_SGS.179.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Medic:"战地医帐"
 SUM_SGS_WAR_Medic_desc:"沙丘行军，医帐跟着队伍走。受了伤的，能就地治便就地治，不必抬回后方。郎中背着药箱，随叫随到，金疮药一敷，伤口便裹将起来。端的省了往返奔波，也少折损了许多性命。救得一命，胜造浮屠。"
 SUM_Neo_SGS.180.t:"战地医帐"
 SUM_Neo_SGS.180.d:"军中设了医帐，随着队伍走，不落在后头。帐里铺着草席，摆着几只木箱，箱里是刀圭、麻布、艾草与几味晒干的草药。伤轻的抬进来，洗净伤口，敷上药，缠两圈布，当日便叫人背回队里去；伤重的留在帐中，日夜有人守着。帐里不记名字，只记号，谁抬进来便在席边挂一块木牌，写上是哪一营的。帐外常排着一小串人，有的自己走来的，有的被人架着，谁都不肯先哼一声。有个后生腿上中了一箭，箭杆断在肉里，医官拿小刀剖开取出，后生咬着一根木棍，满头是汗，一声没吭。取完了，医官说，三日换一次药，别沾沙。后生点头，拄着棍自己走回去了。当夜有个重伤的喊娘，守帐的就坐在旁边，一直坐到天亮。看官但见，就地治一个人，便多一个人回去。"
 SUM_Neo_SGS.180.a:"倾全境之力"
 SUM_Neo_SGS.180.b:"留一支后手"
 SUM_SGS_WAR_Forge_Move:"随军匠坊"
 SUM_SGS_WAR_Forge_Move_desc:"沙丘的铁作坊，竟是跟着军队一并走的。炉子架在车上，铁砧也搬着走，到了驻地，支起炉灶便开打。缺了刀补刀，缺了矛造矛，什么坏得快，现打什么。"
 SUM_Neo_SGS.181.t:"随军匠坊"
 SUM_Neo_SGS.181.d:"营里跟着一处铁作坊，不设在城里，就设在大军后头三里地。风箱一拉，火头窜起半人高，铁砧上叮叮当当，从早响到晚。前头缺箭镞，这里便开炉打镞；前头说盾太薄，这里便加一层铁皮；有一日驼鞍上的铁环断了几副，铁匠看了看，说这物件现成，两炉就够。打仗用的东西，件件都等不得，从城里运来要十天，这里一日便得。每回拔营，炉子不能灭，铁匠用湿毡裹了炭，架在车上一路走，到了地方支起风箱就干。有一回风箱的皮破了，一个老铁匠把自己的一件皮袄割了缝上。铁匠们黑了脸，手上全是烫疤，吃饭时捏不住筷子，就用手抓。有个小徒弟问师父，咱们算不算兵。师父头也不抬，说兵在前头，咱们在他们后头。炉火若熄一夜，前头便多添几口棺材。"
 SUM_Neo_SGS.181.a:"以动员令起兵"
 SUM_Neo_SGS.181.b:"以盟约召集部族"
 SUM_SGS_WAR_Rear_Tax:"后方捐输"
 SUM_SGS_WAR_Rear_Tax_desc:"前方的仗打得紧，后方的捐输照收不误。出钱出粮的人心里也明白，眼下多捐些，等打胜了，便可以抵扣往后的税。这买卖划得来，于是众人踊跃。端的把后方的钱粮，也变成了打仗的本钱。"
 SUM_Neo_SGS.182.t:"后方捐输"
 SUM_Neo_SGS.182.d:"大军一动，钱粮如流水。沙丘腰带在后方照旧收捐输，不摊派，只挂一块牌子，写明今日收什么，明日收什么，谁交了几何，都记在明处。来交的人排着队，有牵羊的，有扛粮袋的，有把自家织的毡子卷了抱来的。案上摆两本册子，一本红皮记可抵的，一本黑皮记白送的，红册锁在木匣里，钥匙由三个人分着拿。管账的问一句，你这是捐，还是借。多半的人答，算是借罢，等打胜了，从税里扣。管账的便笑，把名字写在红册上，注明可抵。有个商人交得多，只求写在儿子名下，说我这把年纪等不到那一天了。有个老妇交了一小袋枣，说家里没有别的，就这个还算拿得出手。肯拿出东西的人，心里都已经押了这一注。"
 SUM_Neo_SGS.182.a:"直取雨林关隘"
 SUM_Neo_SGS.182.b:"先断其商路"
 SUM_SGS_WAR_Last_Storm:"最后一场风"
 SUM_SGS_WAR_Last_Storm_desc:"沙丘定下总攻的日子，专挑换季的大风天。风一起，黄沙漫天，天地都分不清东西。就在这乱风里，沙丘的人马掩杀过去，敌人辨不清方向，弓也射不准。端的借这天时，打了一个漂亮的胜仗。"
 SUM_Neo_SGS.183.t:"最后一场风"
 SUM_Neo_SGS.183.d:"总攻的日子，没挑月圆，也没挑吉日，只等换季那一场大风。那风是沙丘上一年一度的，从北边卷过来，天色像陈年的铜锈，人站在三步外便看不清脸。营中早得了信，兵士用布蒙了口鼻，用绳把刀柄缠在手上，只等风起。老卒们白日里蹲在帐外看云，看云脚往哪边翻，便知道风还有几日。风来之前，营里把能拴的东西都拴了，驼队蹲在背风的沙窝里，人抱着刀睡。风起那日午后，天地果然分不清，日头成了一点白斑，营里的旗撕了一道口子。队伍顶着风往东推，沙打在脸上像针扎，有人的帽子被卷走，也不去追。前队走到哨所墙下，守军还在揉眼睛。天时这东西，会用的当它一路兵，不会用的只当它是天气。"
 SUM_Neo_SGS.183.a:"把话说给雨林人听"
 SUM_Neo_SGS.183.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Break:"破阵"
 SUM_SGS_WAR_Break_desc:"两军对阵，沙丘先放出最硬的驼骑压住正面。等敌人阵脚一动，两翼的游骑便如利刃般插将进去。正面顶住，两翼包抄，端的把敌人的阵势绞得粉碎。这一招硬中带巧，端的厉害。"
 SUM_Neo_SGS.184.t:"破阵"
 SUM_Neo_SGS.184.d:"列阵那一日，沙丘把最硬的一支驼骑摆在正面。那些骆驼都是养熟了的，听见鼓声不惊，人坐在上面比马高出一头，披着厚毡，刀砍上去不进门。驼骑列成三排，慢吞吞往前压，走得极稳，像一堵会动的墙，坐在上面的人把布裹到只露一双眼睛。驼蹄把沙踩得实了，后头的步卒便沿着这条硬道跟着上。两翼的游骑却轻，一人双马，鞍边挂着水囊，约定了以中军旗为号，号手每人只带一支号，吹破了便没有第二支。对面的阵脚一乱，号旗一落，两翼便动了，绕开正面，从沙梁后头兜过去，专挑阵尾的辎重与旗手。有一队游骑冲到旗下，一刀砍断旗绳，旗落下来的时候，正面还没接上手。硬的一路压住不动，快的两路才有空处。"
 SUM_Neo_SGS.184.a:"倾全境之力"
 SUM_Neo_SGS.184.b:"留一支后手"
 SUM_SGS_WAR_See_Towers:"望见尖塔"
 SUM_SGS_WAR_See_Towers_desc:"有士卒登上雨林高处，放眼一望，隐隐望见须弥城的尖塔。众人走了这么远的路，打了这么久的仗，为的便是那几座塔。它是教令院的所在，也是压在沙丘头上的山。望见那塔，众人心里定了。"
 SUM_Neo_SGS.185.t:"望见尖塔"
 SUM_Neo_SGS.185.d:"东进到第五日，队伍爬上了一道雨林边的高坡。坡上有树，树叶子大得能遮住一个人。众人在坡上歇脚，一人分一口水，谁也不多喝。领兵的叫众人停下，自己拨开枝叶往东望。坡下是河渠、水田、一片一片的绿，绿到尽头，几座尖塔从雾里立起来，塔身细长，顶上泛一点白。走了这么远的路，为的就是那几座塔。有个年轻兵士看得发怔，问了一句，那塔里住着什么人。旁边老卒说，住着写字的人。年轻的不再问，只把刀往腰里紧了紧。坡上的风带着水气，吹在脸上是凉的，众人闻着这气味，都不说话。后头有个老兵说，他年轻时在这一带运过盐，那时脚下还都是雨林的地界。多少仗打下来，起因都在远远望见的那一眼。"
 SUM_Neo_SGS.185.a:"以动员令起兵"
 SUM_Neo_SGS.185.b:"以盟约召集部族"
 SUM_SGS_WAR_Terms:"提出条件"
 SUM_SGS_WAR_Terms_desc:"沙丘的人马兵临城下，方才把条件摆出来：撤去哨所，减去重税，归还水道，认下沙丘独立。四条款款明白，端的不再多费唇舌。到了这一步，胜负已分，任凭雨林如何，也得按这四条来。有分教：四条一出，再无转圜。"
 SUM_Neo_SGS.186.t:"提出条件"
 SUM_Neo_SGS.186.d:"兵到城下，扎住营，不攻，先遣一个使者到城门口说话。使者不带兵刃，只带一张纸，纸上写着四条：一，撤了雨林边上的哨；二，减了村社的税；三，把引走的水还回来；四，认沙丘腰带自立。城上起初射下一箭，插在使者脚前三步，使者不动，把纸举得更高些。守城的人接了纸，看了半晌，说要禀报上去。使者道，那就慢慢地禀，我们在这儿等着。这一等便是三日，城上城下都没动刀，白日里各吃各的饭，夜里各点各的灯。第三日，城里有人从水门递出一篮饼，使者接了，转手分给守门的兵。第四日城上换了个说话的人，声音比先前软。条件这东西，要在刀已出鞘的时候提，才有人细看。此后三日，城上城下竟无一人高声说话，连咳嗽都憋着。"
 SUM_Neo_SGS.186.a:"直取雨林关隘"
 SUM_Neo_SGS.186.b:"先断其商路"
 SUM_SGS_WAR_Sumeru_Day:"须弥之日"
 SUM_SGS_WAR_Sumeru_Day_desc:"到了这一步，这仗已然不只是胜负。打给雨林看，是叫他们知道沙丘不可欺；打给沙丘自己看，是叫众人明白，凡人自己也能挺直腰杆。这一仗，端的打出了志气，也打出了名分。"
 SUM_Neo_SGS.187.t:"须弥之日"
 SUM_Neo_SGS.187.d:"这仗打到这个地步，营中有个老参议夜里坐在火边，对着一圈人说起话来。他说，这仗一半是打给雨林看的，让他们知道沙丘的刀不是摆设；另一半，是打给沙丘自己看的。众人问这话怎讲。老参议道，沙丘这些部落，往日各守一口井，为一道水渠能打三代人的官司，如今能并肩站到一处，靠的不是盟书，是这一路走下来的脚印。有个年轻头领不服，说打完这一仗，井还是各家的井。老参议笑了笑，指着火堆说，柴是各人抱来的，火是一堆。年轻头领低头想了半晌，把手里的一块炭添进火里。火堆旁静了一静，有人把手里的一块饼掰开，分了一半给旁边的人。人心要合，得有一件大家一同扛过的事。"
 SUM_Neo_SGS.187.a:"把话说给雨林人听"
 SUM_Neo_SGS.187.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Dune_On_Forest:"沙丘东进"
 SUM_SGS_WAR_Dune_On_Forest_desc:"沙丘腰带的旗，插上了第一道雨林哨所。再往东，便是河渠平原，再往东，便是须弥城。教令院连夜遣使，说一切好商量。阵前的人只回一句：先撤哨，再谈别的。端的把话堵得严严实实。"
 SUM_Neo_SGS.188.t:"沙丘东进"
 SUM_Neo_SGS.188.d:"沙丘腰带的旗，头一回插上了雨林的第一道哨所。那旗是粗布缝的，绣着灵光纹样，旗杆用驼毛绳一道一道绑在垛口上。插旗的就是头一个攀上墙的那个后生，他爬上去，把旗一抖，风就把它撑直了。站在墙头往东看，先是河渠，清水一道一道蜿蜒，再远是平原，田畴连片，最远是须弥城，尖塔在雾里只露个顶。教令院得了信，连夜遣使赶来，使者衣冠齐整，随从捧着两只匣子，说是些薄礼。阵前的人不收匣子，只回了一句：先撤哨，再谈别的。使者张了张口，没再说下去。旗插好，众人退下墙头，把哨所里的灶重新点着，煮了一锅糊糊，先给守过这墙的伤兵盛。占住一处地方，比说一百句话都响。"
 SUM_Neo_SGS.188.a:"倾全境之力"
 SUM_Neo_SGS.188.b:"留一支后手"

 #### 决议 ####
 SUM_SGS_Govern:"城邦与水务"
 SUM_SGS_Govern_desc:"沙丘腰带设有政务一组，专管这片商旅之地的日常。安置流民，整饬关卡，维护驿站，件件都要料理。往来一顺，生意才做得成，客商才留得住。端的把杂事管得井井有条，这片沙地才有生计。"
 SUM_SGS_Faith:"花灵与经卷"
 SUM_SGS_Faith_desc:"沙丘腰带另设信仰一组。往来之人各有各的神，如何让这些信念彼此相安，便是这里的难题。若能叫各路人马进得来，住得下，走得开，端的便是功德一件。"
 SUM_SGS_Trade:"商道与盐"
 SUM_SGS_Trade_desc:"沙丘腰带商贸一组，靠中转与买卖立足。掌住了货源与价差，便能在沙海站稳脚跟。做买卖讲究眼力，更讲究时机，早一步下手与晚一步跟上，光景便大不相同。看准了时机，才把利钱攥在手里。"
 SUM_SGS_Army:"沙丘守军"
 SUM_SGS_Army_desc:"沙丘腰带军事一组，护商守隘，清剿沙匪，都要靠自己人手。轻骑与哨探，是这里的看家本领。人多眼杂之地，武备不可松懈，否则商路一断，家业便难为继。"
 SUM_SGS_Crisis:"风沙与饥馑"
 SUM_SGS_Crisis_desc:"沙丘腰带危机一组，专应沙暴劫掠、商路断绝这类变故。凡事预则立，早些处置，总好过临阵慌乱。少折些人马货物，把损失压在能承受的范围，便还有翻身的指望。端的留得青山，不怕没柴。"
 SUM_SGS_Dec_Gov_Charter:"立城邦宪章"
 SUM_SGS_Dec_Gov_Charter_desc:"沙丘腰带要立规矩，先为各处城邦订下一份宪章。这宪章写得明白，哪些事该办，哪些事不该办，白纸黑字，人人可查。端的把往日的口说无凭，变成了有章可循，谁也不能再随意翻脸。有分教：宪章既立，众城不敢乱来。"
 SUM_SGS_Dec_Gov_Roll:"编民籍"
 SUM_SGS_Dec_Gov_Roll_desc:"沙丘腰带要摸清家底，便派人登记各城的人口与户数。哪家几口人，哪户几间房，一笔一笔写在册上。端的把糊涂账理清了，征兵收税才有依据，再不必凭那几句含糊的话。"
 SUM_SGS_Dec_Gov_Steward:"公推执事"
 SUM_SGS_Dec_Gov_Steward_desc:"各城的执事，不再由上面指派，改由城里人公推。众人你一言我一语，推举出素来公道的人来管事。这执事办得好坏，众人眼里都看着。端的把管事的人，交给了众人自己挑。"
 SUM_SGS_Dec_Gov_Water:"清丈水权"
 SUM_SGS_Dec_Gov_Water_desc:"沙丘腰带要把水权理清，派人把各城的水重新清丈造册。哪口井归谁，哪条渠灌哪片田，都量得清清楚楚。端的免了日后争水的口舌，一册在手，谁也休想多占一分。"
 SUM_SGS_Dec_Gov_Road:"修沙道"
 SUM_SGS_Dec_Gov_Road_desc:"沙丘腰带要便商旅，便把城与城之间的沙道，一段段补平。坑洼的填土，塌陷的垫石，两端的路终于连成一片。端的叫商队走得顺畅，再不必绕那坑坑洼洼的冤枉路。"
 SUM_SGS_Dec_Faith_Rite:"办灵光礼"
 SUM_SGS_Dec_Faith_Rite_desc:"沙丘腰带要行灵光之礼，便选在圣显厅外的沙地上。众人各带一支蜡烛，围拢点燃，星星点点映着灵光。礼数不繁，端的在一片烛光里，表尽了心中的敬意。"
 SUM_SGS_Dec_Faith_Hall:"清理圣显厅"
 SUM_SGS_Dec_Faith_Hall_desc:"圣显厅久埋沙中，沙丘腰带便组织人手，一筐一筐把沙清理出去。众人挥锹挑担，干了整整几日，厅里的石阶方才露出来。端的把先人的旧迹，从沙底重新刨了出来。"
 SUM_SGS_Dec_Faith_Script:"释读古文字"
 SUM_SGS_Dec_Faith_Script_desc:"圣显厅里挖出许多石板，上面的古字无人认得。沙丘腰带便把识字的人都召了来，围在石板旁，一字一句地释读。众人七嘴八舌，端的把沉睡的旧文，一个字一个字唤醒。"
 SUM_SGS_Dec_Faith_Shrine:"立灵龛"
 SUM_SGS_Dec_Faith_Shrine_desc:"沙丘腰带要在各处水驿立灵龛。这龛前不摆三牲，只安一盏灯，昼夜长明。过路的人歇脚时望一眼，心里便踏实。端的把一点明净，安在了每条商道上。"
 SUM_SGS_Dec_Trade_Post:"设税卡"
 SUM_SGS_Dec_Trade_Post_desc:"沙丘腰带要在商道要口设卡征税。这卡设在何处，收几成，都由众人合议。收来的钱不进私囊，一概修路凿井。端的取之于民用之于民，商队缴得心甘情愿。"
 SUM_SGS_Dec_Trade_Halt:"修水驿"
 SUM_SGS_Dec_Trade_Halt_desc:"沙丘腰带要在商道上增修水驿与井。一处接一处，隔上十几里便有一处歇脚的地方。商队到了那里，有水喝，有荫乘。端的把一条荒沙，变成了往来不绝的活路。"
 SUM_SGS_Dec_Trade_Insure:"商队互保"
 SUM_SGS_Dec_Trade_Insure_desc:"沙丘腰带要护商路，便组织商队互保。这一队出事，众人齐来照应；那队遇险，各家一并出手。端的把散沙拧成了一股绳，劫匪见了也退避三舍。端的巧妙。"
 SUM_SGS_Dec_Trade_Mint:"铸钱"
 SUM_SGS_Dec_Trade_Mint_desc:"沙丘腰带要铸自己的钱，便架起炉子，昼夜不停地开炉。铜水注入钱范，一枚枚叮当落地。钱边上明写着成色，一望便知，周边各邦都肯收。端的凭这一行小字，立住了信用。端的钱边写明成色，四方放心。"
 SUM_SGS_Dec_Trade_Caravan:"招徕商队"
 SUM_SGS_Dec_Trade_Caravan_desc:"沙丘腰带要招徕远来的商队，便把税减了又减。远道的商人一算账，觉着有利可图，便赶着驼队来了。来的多了，市面便热闹，沙地也跟着富起来。端的让利于人，实则利己。"
 SUM_SGS_Dec_Army_Levy:"征发守军"
 SUM_SGS_Dec_Army_Levy_desc:"沙丘腰带要护住地界，便向各城征发守军。这座城出十人，那座城出二十，凑成一支队伍。众人虽来自各处，却都听一人号令。端的把各城的人，拧成了一支守家的兵。"
 SUM_SGS_Dec_Army_Beast:"驯沙兽"
 SUM_SGS_Dec_Army_Beast_desc:"沙丘腰带要驯养沙兽，专挑矫论团里懂兽性的能人。驯好的沙兽，平日驮得辎重，临阵又能披鞍冲杀。端的把沙漠里的猛兽，变成了自家的帮手。端的巧妙。"
 SUM_SGS_Dec_Army_Drill:"操演风战"
 SUM_SGS_Dec_Army_Drill_desc:"沙丘腰带操演守军，偏挑风沙天。别家躲风沙，他们偏在黄沙漫天里练辨向，练结阵。练得熟了，风越大反倒越稳。端的把本事练到了骨头里，上阵方能从容。"
 SUM_SGS_Dec_Army_Fort:"增筑戍所"
 SUM_SGS_Dec_Army_Fort_desc:"沙丘腰带要在商道增筑戍所与望楼。隔上一段路，便立一处，驻人守望。望楼上的人远远望见动静，便能早早示警。端的把整条商道，罩进了一张网里。"
 SUM_SGS_Dec_Crisis_Storm:"赈济风灾"
 SUM_SGS_Dec_Crisis_Storm_desc:"沙暴过后，不少人家被毁得片瓦无存。沙丘腰带便开仓赈济，一袋粮一袋盐地发下去。遭了灾的人得了接济，不至于流离失所。端的是把仓里的存粮，用在了刀刃上。"
 SUM_SGS_Dec_Crisis_Water:"调停争水"
 SUM_SGS_Dec_Crisis_Water_desc:"两处城邦为了争水，闹得不可开交，险些动了刀兵。沙丘腰带便派人前去调解，把水权重新量过，各分应得的一份。端的把一场干戈，化成了杯酒。"
 SUM_SGS_Dec_Crisis_Plague:"防疫"
 SUM_SGS_Dec_Crisis_Plague_desc:"某处起了疫病，沙丘腰带当机立断，先把那处封住，不许人随意出入。一面又施药救治，把郎中派进去。端的把疫病堵在一处，不至于蔓延开来。端的巧妙。"
 SUM_Neo_SGS_Mechanism:"机制状态"
 SUM_Neo_SGS_Mechanism_desc:"这面牌子不问事，只照实记账。帕里、遗物两条轴走到哪一档，沙丘腰带什么等级、吃哪几条修正，列在上头。条目按不得，轴值一变牌子自己就换。抬眼一瞧便知该往哪条轴上使力。"
 SUM_Neo_SGS_T1_View:"灵光共鸣 · 一档：灵光将熄"
