 #### 民族精神 ####
 SUM_SDH_I_Matriarch_Rule:"主母抚部"
 SUM_SDH_I_Matriarch_Rule_desc:"哈德拉玛维特的规矩多由主母一句话定下，并不落在文字上。众人有事便去问主母，主母说了便算数。这规矩虽不落纸，人人心里却记得清楚。"
 SUM_SDH_I_Suzerain_Edict:"悬诏于门"
 SUM_SDH_I_Suzerain_Edict_desc:"雨林的敕令贴在城门之上，管着赋税与驻军。过往行人都要驻足看上一看。沙地的人看了，心里各有滋味。这敕令压人。"
 SUM_SDH_I_Floral_Blood:"花神遗胤"
 SUM_SDH_I_Floral_Blood_desc:"每逢祭期，各部的人便朝主母所在的方向遥遥礼拜。历代主母都称自己是花神的女儿，这话传将开去，信众遍布各部，人人虔诚信奉。花神这一名号，把散在各处的人心都拢到了一处。"
 SUM_SDH_I_Storm_Land:"碛土之乡"
 SUM_SDH_I_Storm_Land_desc:"沙地一年三月刮风，风起时商路断绝，城邑相隔。人们只好躲在屋里等风过去。这风厉害，把一片沙地割成许多块。商队只能等风停了再走，往往一等就是好几天。"
 SUM_SDH_I_Hidden_Wells:"伏井备退"
 SUM_SDH_I_Hidden_Wells_desc:"沟壑深处藏着一些不标在图上的井，这是各部留给自己的退路，平日里秘不外传。风急时全靠它活命，外人纵然路过也看不出那井下藏着什么。这暗井要紧。"
 SUM_SDH_I_Ruin_Expedition:"探幽入墟"
 SUM_SDH_I_Ruin_Expedition_desc:"遗迹之中藏着钥石与图纸，有人得了便引着一批批人往沙里去寻。这沙里藏着无数秘密，惹得人前赴后继。有人空手而归，有人却从此没了踪影。"
 SUM_SDH_I_Tribal_Scatter:"诸部离析"
 SUM_SDH_I_Tribal_Scatter_desc:"各部各守其地，议事时先吵座次，谁坐上首谁坐下首，争个不休。火塘边那几块毡子都快被抢破了。有一回为了座次竟争论整整一日，汤都凉了三回，正事反倒搁在一边。"
 SUM_SDH_I_Caravan_Toll:"行商分息"
 SUM_SDH_I_Caravan_Toll_desc:"过境的商队照例要留下一成货物，算是买了平安。守卡的收了货便在货单上画个押，放人过去。驼铃一响，队尾的人回头看那卡子一眼。这一成货，买的却是一路无虞。"
 SUM_SDH_I_Desert_League:"沙碛要盟"
 SUM_SDH_I_Desert_League_desc:"诸部立盟，共守沙地，共分水源，共抗敕令。立盟当日杀羊歃血，人人表态。这盟一端立，沙地便拧成了一股，自此有福同享，有难同当，不负盟誓。"
 SUM_SDH_I_Independent_Flag:"幡然自立"
 SUM_SDH_I_Independent_Flag_desc:"敌军一望见那旗，便知道守城的是沙地人。花神同沙丘的纹样绘在旗上，立在各处城头，风一吹远远就认得出来。这纹样最提气，百姓望见，心里便踏实了。"
 SUM_SDH_I_Floral_Kingdom:"花神肇邦"
 SUM_SDH_I_Floral_Kingdom_desc:"凡肯归附的绿洲，都供起花神龛，祭司由信众推选，泉水按人头分派。祭司既是大家选的，办事就不敢存私；水既是按口分的，也就没人多占。如此公道，四下里都心悦诚服。"
 SUM_SDH_I_Pilgrim_Guild:"香众结团"
 SUM_SDH_I_Pilgrim_Guild_desc:"一路上的食宿与安全，都由香客自己组的行会打理。行会立下章程，众人照章办事，违犯了规矩的要受罚，倒也安排得齐齐整整。有这行会张罗，香客上路再不必发愁。"
 SUM_SDH_I_Holy_Guard:"置护法军"
 SUM_SDH_I_Holy_Guard_desc:"护法卫队平时守着神庙，战事一起便随军出征，两拨人轮流替换。守庙时像一道墙，半步不退；上阵时如猛虎，只进不退。这支人马，委实了得。"
 SUM_SDH_I_Storm_State:"尚武成邦"
 SUM_SDH_I_Storm_State_desc:"各部之兵编为一军，号令统一，粮饷也统一，从前各吹各号的光景一去不返。营里立一面大旗，风起时哗哗作响，各部的人见了都往旗下聚。这一编，端的成了一支劲旅。"
 SUM_SDH_I_Mech_Corps:"机装成行"
 SUM_SDH_I_Mech_Corps_desc:"遗迹里翻出来的构装，一经装上兵器就成了兵，既不会疲乏也不会畏死。摆开阵来，刀枪齐刷刷举起，步子踩得一般齐，看着好不威风。让这些铁家伙打头阵，便能用更少的人命去拼。"
 SUM_SDH_I_Sand_Commune:"沙产入官"
 SUM_SDH_I_Sand_Commune_desc:"地把分回各部，水按口分，粮在荒年共放。众人各安其业，争端也少了。从前为地界争得你死我活，如今各安其分，倒也清净。这般分法公道。"
 SUM_SDH_I_Oasis_Assembly:"洲部自专"
 SUM_SDH_I_Oasis_Assembly_desc:"一处处绿洲各立宪章：代表按月聚会商议，法官按季巡回办案，诸事都照章程来。代表们到了日子便来，从不迟误。宪章立起来之后，绿洲上下治理得清清楚楚。"
 SUM_SDH_I_Open_Trade:"榜列赋则"
 SUM_SDH_I_Open_Trade_desc:"税则刻在碑上，谁交多少自己算得出来。官署不能多收，商户也不肯少交。有想多收的也怕碑上的字，不敢伸手动脚。这税则一明，争端便息了。"
 SUM_SDH_I_Common_Law:"沙碛共条"
 SUM_SDH_I_Common_Law_desc:"合诸部旧规编成一部共律，法官按律巡判。从前各族规矩不同，如今一律通行。法官到了一处便支帐升座，案上摊着律书，书角压一块石头。这共律一端行，众人都受了约束。"
 SUM_SDH_I_Old_Accord:"悉依旧例"
 SUM_SDH_I_Old_Accord_desc:"旧例能留的都留，只是多了一层公议的过场。凡事经众人议过方才定夺，议时就把旧例摊在毡上一条一条念。这一层过场少了些专断，不轻易改旧章，众人心里也踏实。"
 SUM_SDH_I_Foreign_Hand:"邻邦染指"
 SUM_SDH_I_Foreign_Hand_desc:"价码开得一笔比一笔高，这是北国使团的手段。他们想要沙地的好处，今天加一桩，明天添一条，贪心没有底。出手这般阔绰，不由得人不心动。"

 #### 等级 / 共振 ####
 SUM_Neo_SDH_T1:"祀典垂绝"
 SUM_Neo_SDH_T1_desc:"这一档香火将断。花神的龛前落满黄沙，祭礼也停了三年，只剩几个老人家围着火塘，把旧年的诞祭一句一句说给孙辈听。风一过，连那点话头也散了。"
 SUM_Neo_SDH_T2:"庙祀寥落"
 SUM_Neo_SDH_T2_desc:"二档香火零星。几处绿洲还立着龛，龛前摆着半碗凉水，算是有人来过。信众散的散、走的走，剩下的也不敢声张，只在天黑后关起门来烧一炷香。"
 SUM_Neo_SDH_T3:"香火日繁"
 SUM_Neo_SDH_T3_desc:"到了三档香火渐盛。各城的诞祭又办起来了，鼓乐一响街面上人挤人，连外乡的商队也停下看。从前不敢报名字的信众，如今挺着腰杆在册上画押，算有了名分。"
 SUM_Neo_SDH_T4:"祀烟四起"
 SUM_Neo_SDH_T4_desc:"四档上香火遍野。各部族的长老同坐一席，共尊花神的规矩，主母坐上位，底下另设公议，凡事众人举手表决。谁要独断，众人便把袖子一甩起身就走。"
 SUM_Neo_SDH_T5:"花神临朝"
 SUM_Neo_SDH_T5_desc:"五档上花神当国。沙地的律条不再从雨林来，改从龛前出。祭司由信众公推，谁家出的香火多说话也未必响。规矩立在信仰上，连旅团过境也要下马。"
 SUM_Neo_SDH_U1:"海晏风清"
 SUM_Neo_SDH_U1_desc:"一档风平。沙地上没有常备的兵，各部族的壮丁各守各的井、各守各的羊圈。官署来征调，长老把茶碗一放，只说过不去。这地方太平得叫人心里发虚。"
 SUM_Neo_SDH_U2:"风方初起"
 SUM_Neo_SDH_U2_desc:"二档风起。三五支佣兵、几伙民兵凑得起来也散得飞快。东边敲鼓，西边吹号，谁听谁的，全看当日谁管饭。真到要动刀，先得吵上半个时辰，谁也不服谁。"
 SUM_Neo_SDH_U3:"余旅可战"
 SUM_Neo_SDH_U3_desc:"到了三档有军可用。沙地养起一支常备的兵，白日操演，夜里巡更，旗号只认一个。令箭一到拔营就走，不必再挨家挨户去求人。长老们这才睡了个安稳觉。"
 SUM_Neo_SDH_U4:"风卫列伍"
 SUM_Neo_SDH_U4_desc:"四档风卫成军。刮风天的队伍练成了，风沙里睁得开眼，走得动路，整营整营地拉出去。别处的兵躲风，他们趁着风走，赶到时敌手还眯着眼，来不及拔刀。"
 SUM_Neo_SDH_U5:"风沙皆劲卒"
 SUM_Neo_SDH_U5_desc:"五档风沙之军。部族的骑手、旅团的刀手，连同遗迹里挖出的构装编作一军。构装走在前头，铁壳上还沾着沙，后头的人马紧跟。这样的阵仗开出去，沙丘都要让路。"
 SUM_Neo_SDH_Combo_HH:"神旅合势"
 SUM_Neo_SDH_Combo_HH_desc:"花神的旗与沙暴的军团并到一处，旗在前，兵在后，走起来竟像一支人马。信众有了拳头，兵也有了名分，龛前的香火与营里的号角一块响。"
 SUM_Neo_SDH_Combo_LL:"有祀无戎"
 SUM_Neo_SDH_Combo_LL_desc:"神龛零落，兵旅散尽。沙地上又只剩各部自守，井边插着自家的木牌，路上遇见生人先摸刀。官署的公文送到沙丘边，长老们看也不看，卷起来塞进灶膛。"
 SUM_Neo_SDH_Combo_AH:"教权独大"
 SUM_Neo_SDH_Combo_AH_desc:"这一回是信仰压过了兵马。花神的名头一抬，旅团的刀便收回鞘里，各部争了多年的水权也在龛前一句话断清。沙地的规矩改由祭司嘴里出，军营只管听令。"
 SUM_Neo_SDH_Combo_BH:"陈兵神宇"
 SUM_Neo_SDH_Combo_BH_desc:"沙暴军团大过神龛。营里的号令先出，庙门后开，祭司捧着经卷在门口等，等兵过完了才敢念。长老们私下摇头，说这沙地敬的不再是花神，是刀。可摇头归摇头，粮还是要交。"

 #### 新闻 ####
 SUM_Neo_SDH_News.1.t:"主母出令"
 SUM_Neo_SDH_News.1.d:"大帐里，主母只顾端着茶碗慢慢啜，仿佛眼前什么事也不曾发生，把那使节晾在一旁。那使节是教令院派来的，一路扬尘赶到大帐，双手把敕令呈上，腰杆挺得笔直，来时那一副趾高气扬的模样，此刻早去了大半。主母接过文书，也不细看，只漫不经心地扫了一眼，脸上不喜不怒，随手便交给身旁的人收着，那神情，仿佛接的是一张废纸。旁边的人捧着敕令，也不敢多问，悄悄退到一旁，将文书卷好，收进匣中。使节偷眼观看，心里暗暗吃惊，站也不是，坐也不是，末了只得讪讪告辞，带着一肚子气回去交差。主母不是一纸文书就能吓住的人。等使节走了，谋士凑上前低声问这敕令如何处置，主母淡淡道：「先搁着，不必理会。」"
 SUM_Neo_SDH_News.1.a:"阅"
 SUM_Neo_SDH_News.2.t:"花神诞祭启幕"
 SUM_Neo_SDH_News.2.d:"街巷里灯火闹到半夜，孩童追着灯影嬉笑，迟迟不肯散去。花神诞祭这日，沙地好几处绿洲同时开张，家家挂彩灯、处处起香烟，歌吹之声一连七宿不停。往年的祭典不过敷衍，今年却大不一样，四面八方的人都涌了来，近处的乡民、远道的驼队，把绿洲塞得满满当当。沿街的摊子挨挨挤挤，卖花的、卖香的、变戏法的，吆喝声一浪盖过一浪。祭坛设在绿洲正中，鲜花围了一圈，香气熏人；有长者双手捧着花环，恭谨献于神前，口中念念有词。彩衣巫者又唱又跳，念起古老祝词，众人便跟着应和。沙地难得这般红火，人人都把平日的苦楚暂且搁下，只管尽兴。"
 SUM_Neo_SDH_News.2.a:"阅"
 SUM_Neo_SDH_News.3.t:"盐值腾贵"
 SUM_Neo_SDH_News.3.d:"那新卡子冷冷清清摆着，一天收不上几个钱，收税的差官急得直蹦，派人去拦，可道儿太多拦不过来，只能干瞪眼。事情是这样：盐路上新设了一道税卡，卡子一立，盐价跟着往上蹿。过一卡交一笔钱，这钱末了还是摊进盐里，吃亏的是买盐的人。跑惯盐路的驮队哪肯咽这口气，纷纷绕开新卡，仍走那走了多年的老道。老道隐蔽、关卡又少，虽远些，倒省下钱。上有政策，下有对策，盐商们私下凑一处把税卡骂了个狗血淋头，可也没别的招，各自绕道了事。老道上人马反倒多了，比从前还热闹，守卡的兵丁有几个竟也偷走后门溜号。"
 SUM_Neo_SDH_News.3.a:"阅"
 SUM_Neo_SDH_News.4.t:"三日大风"
 SUM_Neo_SDH_News.4.d:"风停之后，天边露出一线昏黄，人们才敢从帐里钻出来。这一场换季的头场大风，一刮就是三天三夜，卷着黄沙铺天盖地，白天也昏暗如同黑夜。路上的商队没法子，只得就地停摆，把货卸下来，人躲进帐里；有几处营地扎得低洼，被沙丘一步步埋了半截，帐篷塌了，灶坑也填平了。等风一停，人从沙里刨将出来，一个个灰头土脸，叫苦不迭。有经验的驼夫早有准备，用布把口鼻捂得严严实实，才不至于呛坏；商队清点货物，少了好几箱，心疼得直跺脚。这场大风厉害，把沙地搅了个天翻地覆。四处一望，沙丘的模样全变了，昨日的地标都不见了，连老驼夫也辨不清方向，只得凭着星光慢慢摸索。"
 SUM_Neo_SDH_News.4.a:"阅"
 SUM_Neo_SDH_News.5.t:"焚其诏书"
 SUM_Neo_SDH_News.5.d:"那纸灰被风一卷，漫天飞舞，扑了使节一身，连衣襟上都落满了黑灰。原来教令院的使节还在帐中絮叨，主母忽地起身，拿过那道敕令，就着灯火点燃，那纸一见火便卷曲着烧起来，火星毕剥作响。使节惊得目瞪口呆，话也说不下去。主母也不看他，只把烧剩的纸灰随手一扬，恰好一阵风从帐外卷进来，吹得那灰漫天都是。使节愣了半晌，抖了抖衣裳，灰溜溜地退出大帐。旁边的人看了，无不暗中称快，却又不敢笑出声。主母这般硬气，教令院从来没见过。那使节回到客帐，越想越气，把主母的举动添油加醋地告回教令院。主母听说了也不在意，只吩咐手下把帐中洒扫干净，仿佛什么也没发生过。自此教令院再送文书来，气焰便矮了半截。"
 SUM_Neo_SDH_News.5.a:"阅"
 SUM_Neo_SDH_News.6.t:"幡然自立"
 SUM_Neo_SDH_News.6.d:"城里人听说戍所撤了，一窝蜂跑来看热闹，指着旗议论个不休，有胆大的伸手去摸旗角，被兵丁笑着挥手撵开。原来哈德拉玛维特城头新升起一面旗，一边绣花神纹样，一边绣沙丘纹样，取的正是沙漠与花神并立之意，风一吹猎猎作响，好不威风。雨林那边望见这旗，晓得大事不妙，当夜就把沙地的两处戍所撤了，守卒收拾行李灰溜溜退回雨林，走得匆忙，连锅灶都顾不上拆，撇下一地狼藉。有人登高望见那两座空营，余烟几缕在夜色里袅袅升起。旗一换，局面就变了，那两处守卒临走还回头张望，似乎不敢信这旗真换了。"
 SUM_Neo_SDH_News.6.a:"阅"
 SUM_Neo_SDH_News.7.t:"风卫列伍"
 SUM_Neo_SDH_News.7.d:"营门口新贴了张号册，写着各部的编号和口令，进出的人都得对着唱名。有个生人想混进去，对着号册比划半天对不上，被拦在门外盘问了好一阵才放行。原来哈德拉玛维特把各部兵马并到一处，编成一支新军。早先那些兵各归各部，号令不齐，如今合在一块儿，统一操练、统一调度。主母偏挑了大风天来操演，说沙漠的兵本就该在风沙里练。那天狂风怒号，黄沙遮日，新军列阵如常，进退丝毫不乱，果然是支劲旅。操演罢，主母当众训话，说风沙不可怕，怕的是人心不齐，众人齐声呐喊，声浪把风声都压了下去。日子久了，各部人马混在一处，再分不出你我，成了一家人。"
 SUM_Neo_SDH_News.7.a:"阅"
 SUM_Neo_SDH_News.8.t:"街南置狱"
 SUM_Neo_SDH_News.8.d:"两处厅堂隔着一条街，你望着我，我望着你，最有意思的是两边进出的人碰了头，竟谁也不看谁一眼：这边低头快步走，那边扭脸装作瞧天。主母厅堂对面，忽然立起一座公议庭，一边是她发号施令之处，一边是众人公议之场，每日里两边都有人出出进进。有人瞧着别扭，问是何故，老成的摇头道：「两边各有各的章程，井水不犯河水。」问的人似懂非懂，也就不言语了。公议庭天天开会，议的不过是粮价、水价、关税这些琐事，议完把条文抄出贴在庭外墙上。可主母厅里出了什么令，公议庭的人从不打听，两边各守各的规矩，透着股说不清的别扭。"
 SUM_Neo_SDH_News.8.a:"阅"
 SUM_Neo_SDH_News.9.t:"戍垒易主"
 SUM_Neo_SDH_News.9.d:"将官一句话就把问的人噎住了。原来雨林头一座伸进哈德拉玛维特的戍所，到底易了主：屋顶那面旗换成了花与沙丘的纹样，可墙体一砖未动，照样立得稳稳当当。有人纳闷，问为何不连墙一起推倒，将官笑道：「墙是死的，插上咱的旗，便是咱的墙，拆它做甚？」才几日，戍所里便住进了沙漠兵，墙头加了岗，壕沟疏浚过，还储了几缸清水，旧堡垒转眼成了新据点。屋子还是那屋子，主子换了人。墙根原先堆的拒马、鹿角被拖到一边，改摆成沙漠的样式。几队商队打这儿经过，远看还以为是雨林新修的工事，待旗色入眼，才惊觉换了主人，这座戍所已改得面目全非。"
 SUM_Neo_SDH_News.9.a:"阅"
 SUM_Neo_SDH_News.10.t:"飓风东下"
 SUM_Neo_SDH_News.10.d:"一个老兵抬手朝东一指：「那塔尖儿，我年轻时见过，高得扎进云里。」众人听了，纷纷踮脚往前望，仿佛那尖塔已在眼前。沙地的兵马趁着换季狂风出了绿洲，那日黄沙蔽天，正好掩住行踪，大军悄然东进。随军的人一路盘算日程，都说再走十日，便能看见须弥城的尖塔，此话一出，人人抖擞，脚步也快了。风仍呼呼地刮，沙粒打在脸上生疼，却压不住心里那点盼头，有人夜里梦见那城，醒来满脸是沙。归心似箭，士气如虹，众人精神抖擞，连夜赶路也不知疲倦。主母策马行在最前，不时勒马环顾，像在推算还剩几日路程，那面旗在风里啪啪作响。"
 SUM_Neo_SDH_News.10.a:"阅"
 #################### 沙丘腰带 ####################
 #### 序章 · 花灵的守望 ####
 SUM_SGS_PRO_The_Paris_Vigil:"花灵护境"
 SUM_SGS_PRO_The_Paris_Vigil_desc:"沙丘腰带的沙下埋着圣显厅，也埋着花灵。花灵从灵光里生出，替凡人守着边界，一守几百年。凡人在沙上筑城、通商、争水，花灵就在旁看着，从不插手，也从不离开。"
 SUM_Neo_SGS.1.t:"花灵护境"
 SUM_Neo_SGS.1.d:"黄沙底下埋着一座圣显厅，也埋了一群花灵，这地方便是沙丘腰带。花灵是灵光育出来的，天生就担着一桩差事：替凡人守住那条新划出来的界，一守便是几百载。沙上的人盖城、做买卖，为一口水争得头破血流，这群花灵只在一旁静静瞧着，从不出手，也不撤离。有个走夜路的旅人，在沙丘间转得晕头转向，忽见前头一点温光，顺着那光走，硬是走出了沙海；等他想回身道谢，光早散得无影无踪，像是不曾有过。说他们是沙地最忠实的守望者，一点不假。此间百姓世代看惯那道光，却未必晓得，有多少迷路人靠它捡回了性命。花灵一代接一代，守着这条看不见的界，把稳当日子留在了沙上。"
 SUM_Neo_SGS.1.a:"循教令院发下的旧例"
 SUM_Neo_SGS.1.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Pari_Wish:"花灵立誓"
 SUM_SGS_PRO_Pari_Wish_desc:"花灵能替人圆一个愿，可愿圆了就要付代价。来求的人不少，肯付代价的却不多。有人许了愿付不起代价，反倒悔不当初。这天底下没有白得的便宜。"
 SUM_Neo_SGS.2.t:"花灵立誓"
 SUM_Neo_SGS.2.d:"求愿的人挤满了花灵跟前，求财的、求医的、求姻缘的，可到了掏代价那一步，十个里九个都缩了回去：有的一听要折十年寿数，脸唰地白了；有的一听要舍了最心爱的物件，扭头就走。唯独一个汉子，女儿命在旦夕，他牙一咬也应了，宁可自己少活几年。花灵见他这般决绝，才缓缓开口，说代价不是别的，是往后叫他再也见不着女儿的模样，只留一腔念想在心里。那汉子呆立半晌，末了还是狠下心点头。女儿果然救活了，只是从此他看谁都只记着声音，再辨不清模样，旁人看了无不叹息。花灵能圆愿，可这愿不论大小，都得拿一样东西来换，天底下没有白得的便宜。"
 SUM_Neo_SGS.2.a:"把账目封存"
 SUM_Neo_SGS.2.b:"把账目摊开"
 SUM_SGS_PRO_Pari_Zurvan:"端坐祖尔宛"
 SUM_SGS_PRO_Pari_Zurvan_desc:"祖尔宛是最早的花灵，年纪比沙丘腰带这个名字还老。她说话很少，听人说话时却总点头。她这般年高少见，众花灵都敬她三分。"
 SUM_Neo_SGS.3.t:"趺坐祖尔宛"
 SUM_Neo_SGS.3.d:"年轻花灵来讨教道理，她也不多说，只把头轻轻一点，那年轻花灵竟像悟着了什么，似懂非懂地走开了。花灵里有个叫祖尔宛的，是资格最老的一位，年纪比沙丘腰带这个名字还久远，几百年沧桑都看过。祖尔宛平日寡言，常常一整天吐不出一个字，可她有个毛病：旁人说话时，她总在旁边静静听着，边听边微微点头，像要把每个字都收进心里。有人问她干嘛老点头，她淡淡回：「说得好，我便点头。」位高言简，点到为止。日子一长，众花灵都把她那一点头看得极重，当成天大的赞许，谁办事牢靠，得她点一下，能高兴好几天。这位老花灵，不言不语，威信却自在。"
 SUM_Neo_SGS.3.a:"按官署的判断行事"
 SUM_Neo_SGS.3.b:"按自己的判断行事"
 SUM_SGS_PRO_Pari_Sorush:"索鲁什简"
 SUM_SGS_PRO_Pari_Sorush_desc:"索鲁什替花灵们传话，把沙上的事一件件带给祖尔宛。信里多是好消息，坏消息却由她自己带回。这传话的差事费心。"
 SUM_Neo_SGS.4.t:"索鲁什简"
 SUM_Neo_SGS.4.d:"有回一处绿洲断了水，索鲁什一路飞奔，满脸风尘赶到祖尔宛跟前，压着嗓子把噩耗说了，连声音都哑了。花灵里有个叫索鲁什的，专管传话，沙地上大事小事都经他一件件记下，再带给祖尔宛。他这人报喜不报忧，信上写的无非商队平安过了沙海、村社得了丰收，净是好消息；哪处遭了灾、死了人，他不肯落笔，宁可自己跑一趟当面说。祖尔宛听完，半晌没言语，只抬手替他拂去肩头沙尘，轻轻点了点头。报喜容易报忧难，索鲁什垂手站在一边，心里比那断水的绿洲还苦。传话的人，最难开口的就是报忧这一趟。"
 SUM_Neo_SGS.4.a:"先看住脚下的城"
 SUM_Neo_SGS.4.b:"先看住远方的人"
 SUM_SGS_PRO_Pari_Nasejuna:"那塞犹那谣"
 SUM_SGS_PRO_Pari_Nasejuna_desc:"那塞犹那会唱花灵的歌。孩子听着听着便睡了，大人听着却想起自己的祖母。那歌声一起，连沙上的风都似听得慢了，听的人久久不愿散去。"
 SUM_Neo_SGS.5.t:"那塞犹那谣"
 SUM_Neo_SGS.5.d:"天亮以后，好几个汉子眼圈发红，谁也不肯明说，只推说夜里风沙迷了眼。花灵中有位叫那塞犹那的，生得好嗓子，会唱花灵的歌，那调子缠绵悠远，像从极远的地方飘过来。娃娃们听了，不多时便眼皮发沉，甜甜睡去，梦里满是鲜花；大人听了却是另一番滋味，往往怔怔出神，想起早已故去的祖母，想起小时候偎在祖母怀里的光景，眼眶便热了。那歌声像藏着什么，说不清是喜是悲，听的人心里直发酸，勾起了各人最软的那块地方。后来那塞犹那走了，绿洲上再没人唱得那样好，人们这才回过味来：当日听歌红了眼眶，原是一场难得的福分。"
 SUM_Neo_SGS.5.a:"循教令院发下的旧例"
 SUM_Neo_SGS.5.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Pari_Price:"祈愿有直"
 SUM_SGS_PRO_Pari_Price_desc:"许愿的代价照例不写在纸上，等愿圆了才由花灵说出来。有人付得起，有人付不起。愿圆之后那代价才慢慢压上身来，躲不过。"
 SUM_Neo_SGS.6.t:"祈愿有直"
 SUM_Neo_SGS.6.d:"求愿的人里，有个做买卖的，花灵应允保他生意红火，果然让他发了大财。谁知代价一报出来，竟是要他这辈子再也尝不着一丝甜味，那商人顿时面如土色，一连后退好几步。这许愿的规矩古怪就古怪在，该付什么代价，事先半句不提。纸上不写，口里不说，求愿的只管求，花灵只管圆，等愿望成了，才慢吞吞把账摊开。这一刻，有人掏得起，欢欢喜喜应了；也有人当场傻眼，肠子都悔青。代价轻重，全凭各人造化。另有个女子，丈夫久病不愈，她求花灵让丈夫好起来，代价是把一头长发尽数剃光，从此再留不得发。她略一沉吟，竟也点头应下。丈夫病愈那天，她伸手摸着那颗青亮亮的头，眼里却满是笑意。代价再重，各人心里自有一杆秤。"
 SUM_Neo_SGS.6.a:"把账目封存"
 SUM_Neo_SGS.6.b:"把账目摊开"
 SUM_SGS_PRO_Jinn_Scripture:"矫论团典册"
 SUM_SGS_PRO_Jinn_Scripture_desc:"矫论团守着几卷经书，写的是花灵与凡人如何共处。经义不深，做起来却难。这道理人人懂，行起来却难。矫论团的人日日诵读，却常说难在自家身上行。"
 SUM_Neo_SGS.7.t:"矫论团典册"
 SUM_Neo_SGS.7.d:"两家人为了一口水吵翻了天，矫论团把经卷翻烂了也寻不出速效的法子，只能先劝双方各让一步。话说沙丘腰带有一群人唤矫论团，世世代代守着几卷经书，写的都是花灵与凡人相处的规矩，什么该做什么不该做。经文浅白，字字好懂，真要实行却比登天还难：凡人得了花灵的恩惠，胃口越来越大；花灵心肠软，明知凡人难缠，总下不了狠心。矫论团夹在两下中间，左边劝一句右边说一声，腿跑断了也说不清楚。知易行难，他们只好把经上的道理翻来覆去地讲，讲到口干舌燥，听的人却左耳进右耳出。有人叹道：「经卷好写，人心难调。」这话半点不假。"
 SUM_Neo_SGS.7.a:"按官署的判断行事"
 SUM_Neo_SGS.7.b:"按自己的判断行事"
 SUM_SGS_PRO_Sage_Rashnu:"拉什努谳"
 SUM_SGS_PRO_Sage_Rashnu_desc:"拉什努是矫论团里断事的人。他的判词从不说谁对谁错，只说往后怎么过，末了总教两边各分一瓢水、各让一垄地。判词一出，两边虽都不服，却也只得照着往下过日子。"
 SUM_Neo_SGS.8.t:"拉什努谳"
 SUM_Neo_SGS.8.d:"有一人为了半亩地的边界，闹了整整三年，告到拉什努跟前，拉什努也不问旧账，只说两家各让一尺，往后和睦相处，那人还想争辩，拉什努摆摆手，便不再听了。矫论团里有个叫拉什努的，专管断事，凡有花灵与凡人争执不下的事，都送到他跟前。奇怪的是，拉什努下判词从来不说谁对谁错，也不追究谁是谁非，只说往后该怎么过。有人不服，追问到底是谁理亏，拉什努只是笑笑：「追究过去，能讨回什么？往后怎么相处，才是正经。」原来他看得透彻，这边界上的事本就难分对错，与其翻旧账伤了和气，不如向前看。经他断过的案子，两方往往都能点头，各自揣着心事回去。断事的高明，不在明断，在了局。"
 SUM_Neo_SGS.8.a:"先看住脚下的城"
 SUM_Neo_SGS.8.b:"先看住远方的人"
 SUM_SGS_PRO_Klingsor:"克林索尔志"
 SUM_SGS_PRO_Klingsor_desc:"克林索尔把圣显厅里的东西一件件记下来，记完便封进箱子。他记得清楚，可到底说了多少没人知道。这人守口如瓶。"
 SUM_Neo_SGS.9.t:"克林索尔志"
 SUM_Neo_SGS.9.d:"一排排木箱码得整齐，每只封条上都摁着他的指印，谁也不许私自启封。矫论团里有个叫克林索尔的，认下一桩苦差：圣显厅里藏着数不清的物件，他逐件登记入册，名目、来历、形制都写得清清楚楚，记完一件便装箱、贴封条。他下手极细，一笔一划不肯马虎，仿佛要把那些物件的魂魄都留在纸上。有人问他一共记了多少件，他抬眼想了想，竟缄口不答，旁人终究摸不着底。这位克林索尔，怀里揣着满腹学问，也揣着满腹心事。有人说他要留一份底账给后人，也有说他另有隐衷不肯吐露；有人猜他为自己备后路，也有说怕物件散失，到底如何，只有他自己清楚。"
 SUM_Neo_SGS.9.a:"循教令院发下的旧例"
 SUM_Neo_SGS.9.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Buer_Line:"布尔发籍"
 SUM_SGS_PRO_Buer_Line_desc:"布尔留下一本旧账，记的是雨天与沙天的水位。这账本传到第三代便断了，这旧账稀罕，断了便无处可寻。后来的人想找这本账，却再也找不到了。"
 SUM_Neo_SGS.10.t:"布尔发籍"
 SUM_Neo_SGS.10.d:"传到第三代，那孙子对这本泛黄的旧账毫无耐心，拿它换了半袋枣子，一本记了几十年的水位簿，就此断了传承。早年间有个叫布尔的，留下一册旧账，别的不载，专记雨雪天与风沙天的水位涨落，哪日高哪日低，笔笔分明。布尔在世时，常拿这账教人观天时、防旱涝，救了不少庄户人家；他去世后，账本先归儿子，再传孙子。谁想后来沙地大旱，人们忽地记起布尔那本账，四处搜寻，却再也寻不着了。前人栽树，后人乘凉；前人记账，后人轻掷。如今那账不知流落何方，沙地人每逢大旱，只能凭老辈口传估摸天时，再没有那样精细的记录了。"
 SUM_Neo_SGS.10.a:"把账目封存"
 SUM_Neo_SGS.10.b:"把账目摊开"
 SUM_SGS_PRO_Academy_Tent:"幄中披卷"
 SUM_SGS_PRO_Academy_Tent_desc:"矫论团在帐中讲学，讲的是经卷，也是算术与地理。来听的人不分族，人人可听。帐外风沙呼啸，帐内却静悄悄的，只听得见讲课声。"
 SUM_Neo_SGS.11.t:"幄设讲席"
 SUM_Neo_SGS.11.d:"帐里坐满了人，沙漠的、雨林的、跑买卖的，挤在一顶大帐中不分彼此，讲学的先生也不问你打哪来，只从头讲起，听懂了点头，没懂再问。矫论团常在军中帐里讲学，教的何止经卷上的道理，算术、地理、丈量沙丘、辨认星斗，样样都教。有一回，一个沙漠娃和一个雨林娃为一道题争得面红耳赤，争到最后，两人竟相视大笑，就此做了朋友。学问不分家，知识无高低，先生也不收束脩，只盼听的人肯用心。常常一讲大半日，讲到兴起，连沙暴来了都不肯停，众人便一齐挪到背风处接着听。这一顶帐，装得下各族的人，也装得下各样的学问。"
 SUM_Neo_SGS.11.a:"按官署的判断行事"
 SUM_Neo_SGS.11.b:"按自己的判断行事"
 SUM_SGS_PRO_Dune_Route:"丘间行贾"
 SUM_SGS_PRO_Dune_Route_desc:"商道沿着沙丘的脊走，昼伏夜行。走熟了这条路的人闭着眼也知道哪一段会塌。那塌了的沙段走错一步便要埋进沙里，凶险。"
 SUM_Neo_SGS.12.t:"丘间行贾"
 SUM_Neo_SGS.12.d:"有个年轻商队不听劝，偏挑险路走，果然脚下塌了方，险些连人带货一并埋进沙里，多亏老驼夫飞身赶来把人拽起。沙丘腰带上那条商道凶险异常，路顺着沙丘脊背延伸，两旁皆是陡坡，一不留神便滚落下去。白日里日头毒辣，沙子烫得脚疼，商队只好白天歇着，专等月亮升起再赶路。走熟这条道的人本领高强，闭上眼也晓得哪段沙松软、哪段要塌陷。老驼夫走在队伍最前，脚往沙上轻轻一踩便知虚实，遇上危险路段远远就领着绕开。他把诀窍传给后生：踩上去虚飘飘的便要塌，实沉沉的才敢落脚，年轻人起先只当是玄乎话，直到自己陷了一回，才信得五体投地。这条道，靠的就是经验二字。"
 SUM_Neo_SGS.12.a:"先看住脚下的城"
 SUM_Neo_SGS.12.b:"先看住远方的人"
 SUM_SGS_PRO_Water_Halt:"沿涂置水邮"
 SUM_SGS_PRO_Water_Halt_desc:"每隔一日路程便设一处水驿，水由矫论团管，取水要记账。水驿之间相隔一日路，恰好让人赶得及。这水驿端的要紧，行路全靠它。"
 SUM_Neo_SGS.13.t:"沿涂置水邮"
 SUM_Neo_SGS.13.d:"管驿的人入夜要提灯绕着驿屋巡一圈，一是防人摸黑偷水，二是提防风沙把井口一点点埋住。这条商道上，走一天路程便有一处水驿，屋里储着清水，专给来往的商队人马解渴。水由矫论团掌着，谁来取一桶就得记上一笔：哪支商队、取了几桶、什么时辰，写得清清楚楚。规矩为何定得这样死？还不是怕有人贪心，一次多占，害得后头赶来的人一滴也捞不着。曾有一队商人不服气，想趁乱多灌几桶，被管驿的当场喝住，照章补了账不说，还罚了银钱。旁的商队看在眼里，往后取水都老老实实排起长队。这一本水账，救过的性命真不计其数。驿屋拿土坯垒墙，顶上铺一层草席挡日头，屋后的沙地里埋着陶罐，那点泉水全靠一罐罐从远处运来，管驿的人昼夜不离。"
 SUM_Neo_SGS.13.a:"循教令院发下的旧例"
 SUM_Neo_SGS.13.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Camel_Hire:"佣此驼群"
 SUM_SGS_PRO_Camel_Hire_desc:"外邦的商队雇本地的驼与驼夫，价钱写在契上。契若是丢了就得照市价重付。有贪便宜不立契的，事后被索要高价，叫苦不迭。这契约要紧。"
 SUM_Neo_SGS.14.t:"券书驼直"
 SUM_Neo_SGS.14.d:"那商人把契揣在怀里过河，一不留神浸湿了，等第二日找驼夫出发，人家立马涨了价，口口声声按市价算。他叫苦不迭，却拿不出凭据，只好忍痛多掏银子，心疼得直咧嘴。外邦来的商队到沙丘腰带，人生地不熟，少不得雇本地的骆驼和驼夫，价钱本该白纸黑字写在契上，双方画押为凭。可这契有个要命处：一旦丢了，便无凭无据，得照眼下的市价重付，而那市价往往比先前讲好的高出一大截。也有的商人歇脚时把契弄丢了，一样遭此一劫。驼夫们的规矩倒也分明：契在按契办，契没了便按市价，决不赊欠。外邦人头回来不信这个邪，吃过一两次亏，也就学乖了，把那张契看得比钱还重，收得妥妥帖帖。"
 SUM_Neo_SGS.14.a:"把账目封存"
 SUM_Neo_SGS.14.b:"把账目摊开"
 SUM_SGS_PRO_Salt_Trade:"盐香二物"
 SUM_SGS_PRO_Salt_Trade_desc:"沙丘腰带把盐与香料运出去，又从外头换回铁与布。这一去一回，中间的差价养活了半条商路。算起来，这买卖着实划算。"
 SUM_Neo_SGS.15.t:"盐香二物"
 SUM_Neo_SGS.15.d:"盐从沙湖边一垄垄晒出来，香料从遥远的南方贩来，一包一包装上驼背，就是一条财路；换回来的铁打成锄犁，布裁成衣裳，运到沙地便成了抢手货。沙丘腰带靠着一进一出，日子过得颇为滋润。他们把本地出的盐和香料运出去，这些东西别处稀罕；带回来的是铁和布，都是沙地里造不出来的紧俏货。这一来一往，中间差价相当可观，养活着半条商道上的人，驼夫、脚夫、客栈、水驿，全指着它过活。有一年香料大丰收，换回来的铁多了，铁价就往下落，商人们立马调转船头改贩别的货，另找赚头。就这么着，盐和香料一车车运出，铁和布一车车运回，互通有无，两头都讨得好处。"
 SUM_Neo_SGS.15.a:"按官署的判断行事"
 SUM_Neo_SGS.15.b:"按自己的判断行事"
 SUM_SGS_PRO_Merchant_Word:"采商贾言"
 SUM_SGS_PRO_Merchant_Word_desc:"几家大商户在沙丘腰带说话有分量，他们点头的事官署办得飞快。有商户要办的事，只消几句话，官署便立刻照办，爽利。这商户势大。"
 SUM_Neo_SGS.16.t:"采商贾言"
 SUM_Neo_SGS.16.d:"官署打算修一段商道，苦于钱粮不够，正没辙，几家大商户凑到一处吃了顿饭，席间那么一点头，第二日钱粮就送到了，工程当场开工，快得叫人咋舌。沙丘腰带有这么几家大商户，财大气粗，说话极有分量：他们齐声点头，天大的事也顺顺当当；他们要是皱皱眉，官署就得掂量掂量。也有那不开眼的小官，想绕开这几家自行其事，结果处处碰壁，办什么事都卡壳，末了还得乖乖上门讨教。这几家还时常聚首商量，把盐和香料的价钱攥在手里，官署想插手也插不进去。虽没有一官半职，势力却胜过官府。有人背地里管他们叫遮天的手，可真遇到事要办，还得仰仗人家。"
 SUM_Neo_SGS.16.a:"先看住脚下的城"
 SUM_Neo_SGS.16.b:"先看住远方的人"
 SUM_SGS_PRO_Hall_of_Mystery:"圣显厅启户"
 SUM_SGS_PRO_Hall_of_Mystery_desc:"圣显厅的入口被沙埋了半截。进去的人带出来的东西，一半上交，一半不见了。那些不见的东西人人都猜，却谁也不肯明说。这厅里端的蹊跷。"
 SUM_Neo_SGS.17.t:"圣显厅半湮"
 SUM_Neo_SGS.17.d:"一队人费了九牛二虎之力把入口的沙清开，好容易取出几件东西，谁知第二日再来，沙又灌得满满当当，一天力气全白搭。圣显厅的入口本有一丈高，如今让流沙埋得只露三尺，人得弯着腰才钻得进去，里头黑洞洞的，究竟藏着多少物件，谁也讲不清。进去的人带出来的东西，一半照规矩交给矫论团，另一半就神不知鬼不觉地塞进了各人腰包。沙子还在不住往里灌，今天清出来，明早又堆上，这厅堂看样子早晚要叫黄沙彻底吞掉。矫论团也为这事头疼，派人轮班守着，可沙子是活的，堵也堵不住。有人叹道：这厅原就是留给沙吞的，人不过暂时借来用用罢了，像个填不满的无底洞。"
 SUM_Neo_SGS.17.a:"循教令院发下的旧例"
 SUM_Neo_SGS.17.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Key_Slab:"钥石之牒"
 SUM_SGS_PRO_Key_Slab_desc:"开门的石板被锯成三截，三方各执一截，约好了缺一截门就开不得。三方就此互相牵制，谁也没法独占。这石板关系重大，少一截，那门便无论如何也打不开。"
 SUM_Neo_SGS.18.t:"钥石之牒"
 SUM_Neo_SGS.18.d:"圣显厅里有一件了不得的宝贝，是块能开门的石板，上头刻着古怪花纹，往门上一合，沉闭的石门便应声而开。可这块石板如今裂成了三截，分作三处，由三方各执一块，藏着不肯轻易示人。要开石门，非得三块合到一处，缺一块都休想。三方彼此猜忌，谁也不放心把自家那块交出来，生怕一去不回反吃了亏，于是这门常年闭着。三方约定每隔几年聚一次，商议合璧开门，可每到了日子，总有一方推说有事不肯带石板来，一年拖一年，石门始终沉睡。这块石板，难倒了不知多少英雄好汉。"
 SUM_Neo_SGS.18.a:"把账目封存"
 SUM_Neo_SGS.18.b:"把账目摊开"
 SUM_SGS_PRO_Relic_Record:"故物著籍"
 SUM_SGS_PRO_Relic_Record_desc:"从厅里出来的东西一律入册：谁挖的、归谁看，都写得清清楚楚。册子用线装，页角抹了蜡防潮。入册之后谁再想私拿便有账可查，殿角的铜钟也照例入册，钟上一道旧痕都记了。"
 SUM_Neo_SGS.19.t:"故物著籍"
 SUM_Neo_SGS.19.d:"为一片金片，两个后生险些在厅里动起手来，你拽我扯，谁都说自己先瞧见。管登记的书吏也不恼，把两人名字并排写下，注明同挖同看、按日轮值，往后若有纠纷，翻册便知。原来圣显厅抬出的物件，一桩也马虎不得。内厅门口早摆好一张长案，案上摊着厚厚的册子，几个书吏蘸墨守着，笔尖悬在纸上，专候抬东西的人过来。举凡陶片、石碑、金箔，都得先在案前问清楚：谁挖的、在哪挖的，再定由谁看管，一一登册、画押为凭，才准带走。这规矩瞧着琐碎，用意却深：东西一登册便有了主儿，谁也别想偷偷拿去换了酒钱。一桩顶容易惹是非的事，就让一支笔给按平了。"
 SUM_Neo_SGS.19.a:"按官署的判断行事"
 SUM_Neo_SGS.19.b:"按自己的判断行事"
 SUM_SGS_PRO_Hieroglyph:"碛中古篆"
 SUM_SGS_PRO_Hieroglyph_desc:"厅里的字是古沙漠文，认得的人不到十个，这十个人如今都在矫论团名下。这十个人轻易不肯出手，矫论团待他们如上宾。这学问稀罕。"
 SUM_Neo_SGS.20.t:"碛中古篆"
 SUM_Neo_SGS.20.d:"厅里新刮出一行字，众人围拢来却谁也念不出，几个年轻学士急得抓耳挠腮。还是团里一位白胡子老者搬来矮凳，眯着眼端详半晌，伸手一个字一个字点着读下去，满堂这才恍然大悟，纷纷伏案记下。老者余兴未尽，又指一处剥落的字迹，说这里短了两笔，众人依着推敲，果然补得分毫不差，一屋子人尽皆叹服。圣显厅四面墙壁刻满了古沙漠文，弯弯曲曲像蛇在爬行，大的一尺见方，小的不过拳头，这字传自前朝，如今天下认得的不足十人。矫论团广征博学，但凡识得古字的读书人，都招至门下好生供养，就盼着他们读得懂墙上的话。看得出来，识字的人手里便攥着开门的钥匙，这里头的学问，深着呢。"
 SUM_Neo_SGS.20.a:"先看住脚下的城"
 SUM_Neo_SGS.20.b:"先看住远方的人"
 SUM_SGS_PRO_Sealed_Door:"此门深封"
 SUM_SGS_PRO_Sealed_Door_desc:"厅子最深处有一扇封着的门，封条是几百年前贴的，一直没有动过。有人想凑近看看却被拦了回来，不许人碰，连看都不许多看。"
 SUM_Neo_SGS.21.t:"此门深封"
 SUM_Neo_SGS.21.d:"一个后生仗着几杯酒劲凑到门前，指尖刚挨上封条，就被身旁人一把攥住，压着嗓子喝道：「门后头的因果，是你我敢窥的？」那后生连忙缩手，脸上讪讪的。原来圣显厅越往里走越幽深阴凉，一步比一步凉，走到尽头是一扇石门紧闭，上头封条交叉贴着，纸已发黄发脆，边角都卷了起来，一看便知是几百年前贴下的。这些年进进出出的人不计其数，个个走到门前便收住脚，谁也不敢伸手去揭。旁人又告诉那后生，封条上压着前朝的印，谁揭谁担待不起，他听得直吐舌头，再不敢朝那门多看一眼。不揭封条，未必全是怕，更多是心里存着一份敬畏，晓得有些事不到时候就不该知道，把满腹好奇都按在这一纸旧封之下。"
 SUM_Neo_SGS.21.a:"循教令院发下的旧例"
 SUM_Neo_SGS.21.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Sand_Worm_Lore:"沙底蛰虫"
 SUM_SGS_PRO_Sand_Worm_Lore_desc:"沙丘下的巨虫怕光，只在夜里出来，商队夜行的时候都绕着它走。老辈人传下话来，夜里行路万不可举火，一举火便招它来。这巨虫凶猛。"
 SUM_Neo_SGS.22.t:"沙底蛰虫"
 SUM_Neo_SGS.22.d:"那支驼队差点全军覆没。他们贪图近路，偏抄直道走，不料惊动了沙底下的巨虫，一时间人喊畜叫、四散奔逃，货箱撒得满沙都是，驼铃一直响到天亮。后来众人折回原路，照老法子绕行，才平平安安到了地方。原来这沙丘底下藏着一种大虫，身子粗得像房梁，最见不得光亮，白天伏着不动，天一黑便钻出来游荡，爬过之处沙痕弯弯曲曲，像犁翻过的地，沟垄深得能没过半个人。所以夜行的商队只要望见沙面上有新翻的沟，就晓得虫在近处，立马绕道，宁可多走十几里也不从它头顶过。打这以后，夜行的规矩里就添了一条：见沟便绕，切莫造次。老驼工还叮嘱，这虫虽怕光，记性却极好，谁惊了它，它能循着气味一路追出十几里。"
 SUM_Neo_SGS.22.a:"把账目封存"
 SUM_Neo_SGS.22.b:"把账目摊开"
 SUM_SGS_PRO_Sacred_Beast:"沙海瘗骨"
 SUM_SGS_PRO_Sacred_Beast_desc:"沙里偶尔挖出圣骸兽的遗骨，那骨头熬药能解沙毒，打造的兵器也锋利。捡到的人多半转手卖了，因其价钱不低。也有人把骨头磨成刀，据说削铁如泥。"
 SUM_Neo_SGS.23.t:"沙海瘗骨"
 SUM_Neo_SGS.23.d:"放羊的娃在干河床边踢出一截白骨，拎回家本当玩意，他爹起先还骂他胡闹，等连夜背进城里换了钱，立刻喜上眉梢，直夸娃有造化，转头就买了一头小羊。沙漠深处时不时能挖出圣骸兽的遗骨，一对巨角弯如新月，几节脊骨白得像霜，埋在沙里不知多少岁月。这是稀罕物件：懂行的研成细末，能配出治伤的灵药；手巧的匠人拿来打磨，能做成锋利的兵器。因此谁要是捡着，多半不肯留在手上，转手卖给行商，换几袋摩拉。也有那贪心的，挖出一整副骨架，连夜用大车拉走，生怕被旁人撞见。这遗骨本是前朝的旧物，如今倒成了活人的营生，世事变迁，真叫人感慨。"
 SUM_Neo_SGS.23.a:"按官署的判断行事"
 SUM_Neo_SGS.23.b:"按自己的判断行事"
 SUM_SGS_PRO_Scarab_Swarm:"甲虫盈野"
 SUM_SGS_PRO_Scarab_Swarm_desc:"老辈人只要瞧见圣甲虫成群往外爬，就知道沙底要松动了，急忙招呼众人躲开，这么多年从未看走过眼。原来这虫群涌出，正是地底有变的先兆。观虫知地的本领，实是老辈人一代代攒下的见识。"
 SUM_Neo_SGS.24.t:"甲虫盈野"
 SUM_Neo_SGS.24.d:"有一年甲虫结队而出，老驼工力排众议，硬把商队拦在原地不让动身，众人摸不着头脑，直抱怨白白耽误路程。谁知三天后沙暴果然压境，别处商队吃了大亏，独这一队安然无恙，众人这才服气，纷纷向老驼工赔不是，说往后看虫行事再不敢怠慢。沙海里有一种圣甲虫，平常零散得很，在沙粒间爬来爬去不起眼；可哪天要是成群的虫子忽然从沙里涌出来，黑压压爬成一片，那就是老辈人说的，沙底下要松动了。原来这虫对地底的动静最灵敏，沙层一有变化便争先恐后往外逃。久走沙路的老驼工一瞧见甲虫成群，就晓得近日埋着沙暴或是地陷，赶忙催着众人扎营躲避。老辈看虫能知天，避得风沙一命全，这话半点不假。"
 SUM_Neo_SGS.24.a:"先看住脚下的城"
 SUM_Neo_SGS.24.b:"先看住远方的人"
 SUM_SGS_PRO_Pari_Beast:"花灵百兽"
 SUM_SGS_PRO_Pari_Beast_desc:"几句交谈过后，那头沙中猛兽竟把头垂了下来。花灵同它说的，是许久以前的旧事；听懂了的兽，从此不伤人，也不去惊扰过路的商队。这般与兽相通的本事，当真奇妙。"
 SUM_Neo_SGS.25.t:"花灵百兽"
 SUM_Neo_SGS.25.d:"有一头疯了的沙兽连着伤了好几个人，众人没辙，都把刀枪抄了起来，一位花灵却慢慢走过去，俯身在它耳边低语一阵，说的都是千万年前的旧事，那兽便趴在地上不再逞凶，扭头钻进沙里去了。花灵有一样本事，能跟沙里的走兽说话，讲的不是眼前事，全是陈年旧话：草木怎么发芽，沙海怎么变迁，慢悠悠地像在唱一支古谣。那些凶兽听着，竟像真听懂了，凶气一点点消下去，连獠牙都收了起来。还有一回，几个娃娃误闯兽穴，眼看那兽扑过来，一位花灵在远处唱起古调，那兽竟停住脚，侧耳听了半晌渐渐退回去，娃娃们这才脱险。花灵不靠力气降兽，只以旧情打动它，比刀枪还高明。"
 SUM_Neo_SGS.25.a:"循教令院发下的旧例"
 SUM_Neo_SGS.25.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Beast_Patrol:"护路之众"
 SUM_SGS_PRO_Beast_Patrol_desc:"矫论团雇人护路，护路的人兼着打兽，工钱不高，可管饭。护路的人白日赶路，夜里守着篝火，遇上野兽便挺刀而上。这差事稳妥却辛苦。"
 SUM_Neo_SGS.26.t:"护路之众"
 SUM_Neo_SGS.26.d:"商道上凶兽出没无常，矫论团索性出钱雇了一班人专门护路。这班人白天沿道巡查，撞见凶兽便得提刀迎上去厮杀，巡路与搏兽两副担子一肩挑。可工钱实在微薄，忙活一月也攒不下几文，好在东家管一日三餐，饿不着肚子，于是些没了活路的汉子便来投奔，图的就是这份稳当口粮。有一回众人巡到僻静地段，冷不丁撞上两头沙兽，大家呐喊着挥刀齐上，费好大劲才把兽撵跑，回来领了工钱、饱餐一顿，方才的凶险也就抛到脑后。也有那头一回上前的新手，见了沙兽吓得腿肚子打转，缩在边上不敢动弹，等人赶走了兽才红着脸爬出来，几回下来倒也壮起了胆。这碗饭是拿命换的，可在沙海里能有个饱饭吃，也就知足了。"
 SUM_Neo_SGS.26.a:"把账目封存"
 SUM_Neo_SGS.26.b:"把账目摊开"
 SUM_SGS_PRO_Edict_Post:"诏至沙徼"
 SUM_SGS_PRO_Edict_Post_desc:"官署照章收下、依令办事，矫论团却把那文书往旁边一搁，照旧各行其是。雨林送到沙丘腰带的敕令，说的是赋税与商路两桩事。这矫论团的骨头，当真硬得很。"
 SUM_Neo_SGS.27.t:"诏至沙徼"
 SUM_Neo_SGS.27.d:"领头的把那道敕令翻看两遍，冷笑一声摔在案上，说：「这上头的规矩，条条都为雨林打算，与沙丘有什么相干？」众人跟着齐声附和。雨林的敕令几经辗转送到了沙丘腰带，写的无非是赋税怎么征、商路怎么管，条条框框都要沙丘照办。当地官署接了令，赶紧设案供起，一条条抄录，连夜张榜晓谕，真个不敢有半分差池。独有矫论团这一伙人，把敕令撂在一边看都不看，明言不接。有人劝他们识时务，他们只报以冷笑：「沙丘的事，凭什么由雨林来指手画脚？」官署的人碰了一鼻子灰，只好悻悻回去。一道敕令，接与不接之间，各人的心肠就露了出来，也为日后的风波埋下了引子。"
 SUM_Neo_SGS.27.a:"按官署的判断行事"
 SUM_Neo_SGS.27.b:"按自己的判断行事"
 SUM_SGS_PRO_Tax_Sand:"科沙赋法"
 SUM_SGS_PRO_Tax_Sand_desc:"沙税按商队计，一年一算。算法是雨林定的，算出来总是雨林多一分。商户明知吃亏却也无可奈何，忍气吞声，谁也不敢去争。这算法偏心。"
 SUM_Neo_SGS.28.t:"科沙赋法"
 SUM_Neo_SGS.28.d:"有一年年终算账，一伙商人围着算盘算了半宿，越算越恼，末了把算盘一摔：「这账明摆着欺负咱不识字！」旁边一个老账房急忙摆手，叫他们小声些免得招祸，众人只得压着火气，认了那算式。沙丘的税是按商队收的，一年结一回账，可这算法出自雨林，算盘珠子攥在人家手里，拨来拨去，到头总是雨林多占一分便宜。商队首领们心里透亮，却讲不出个中门道，只能干着急。算法捏在别人手里，明吃着亏也得往肚里咽，正所谓人为刀俎，我为鱼肉。那老账房私下漏了话，说雨林的算法里藏着一笔暗账，挂着耗损的名目，其实都进了雨林腰包。众人方知不是自己算错，是叫人做了手脚，可即便晓得，又无可奈何。"
 SUM_Neo_SGS.28.a:"先看住脚下的城"
 SUM_Neo_SGS.28.b:"先看住远方的人"
 SUM_SGS_PRO_Forest_Outpost:"林疆置候"
 SUM_SGS_PRO_Forest_Outpost_desc:"雨林在商道旁设了哨所，查的是货，也是人。查得多了商队便改道，只好绕远路走，多走了几日，费时费力。这哨所扰人。"
 SUM_Neo_SGS.29.t:"林疆置候"
 SUM_Neo_SGS.29.d:"雨林沿着商道一处挨一处设哨所，嘴上说是查货，其实连过路的人也要翻来覆去盘问，今天查这队，明天验那人，箱子袋子翻个底朝天没个完。有一队商人就在哨所前耗了整整一天，货物全摊在太阳底下，香料都晒化了，折了不少本钱。带队的忍不住理论两句，查货的把眼一瞪，说这是规矩，谁也不许多嘴。商队受不了这份气，干脆撇开哨所走小路，那些小路本是人迹稀到的荒沙，难走归难走，好歹不用看人脸色。时间一长，大路反倒冷落，哨所孤零零立在空路上，几个兵卒对着空路直打呵欠。苛政猛于虎，查得越紧人越往别处走，一条好好的商道，就这么给折腾荒了。"
 SUM_Neo_SGS.29.a:"循教令院发下的旧例"
 SUM_Neo_SGS.29.b:"听沙海与部族的呼声"
 SUM_SGS_PRO_Clerk_Sand:"文吏持管"
 SUM_SGS_PRO_Clerk_Sand_desc:"商户们背地里都管雨林派来的书吏叫吸血鬼，提起来就恨得牙痒。那书吏掌着账目，笔头轻轻一动，数目就变了样。这样的书吏，怎不叫人恼恨。"
 SUM_Neo_SGS.30.t:"文吏持管"
 SUM_Neo_SGS.30.d:"商户们心里憋屈，当面不敢吐半个字，背地里却给那书吏取了个难听的诨号，唤作吸血笔。雨林遣了个书吏专管沙丘账目，此人手中一支笔便如刀把，账本一落到他手里，笔尖轻轻一动，数目便翻云覆雨，全凭他一句话。有户商户的账早结清了，那书吏笔杆一挑，又凭空多算出一笔欠账，气得那商户浑身发抖，也只能赔笑求情。旁边有人看不过，替他分辨几句，书吏把账本啪地合拢，说上头写得明明白白，要不信只管去雨林告状。账本攥在一人手中，是非黑白就全由他捏造，叫人看了齿冷。后来这事传开，众人才摸清底细：这书吏的账一向看人下菜碟，面相老实的便多记几笔，通几句官话的便少算些。于是大家凑份子请了位懂账的先生，不再任他一人摆弄。"
 SUM_Neo_SGS.30.a:"把账目封存"
 SUM_Neo_SGS.30.b:"把账目摊开"
 SUM_SGS_PRO_Vigil_Question:"戍望启疑"
 SUM_SGS_PRO_Vigil_Question_desc:"有花灵问：「凡人若一直被人管着，守望还有什么意义？」祖尔宛听了却一直没有回答。这句话问出来，四周一时寂静，叫人无言以对。"
 SUM_Neo_SGS.31.t:"戍望启疑"
 SUM_Neo_SGS.31.d:"一句话问出来，四下里霎时静了，连风沙都像停住。众花灵聚在一处，其中一位憋了许久，终于开口：「凡人世世代代受人管着，咱们这般苦苦守着，究竟图个甚？」大伙儿的目光齐刷刷落到祖尔宛身上，盼她给个说法。谁知她沉默良久，一句也没答，只望着远处沙丘，像在想极远的事。提问的花灵立在原地，脸上写着不甘，却也没再追问。旁边一位年长的轻叹一声，说这问题她也想过，只是想不出，索性不想了。可那花灵不肯罢休，又道：「咱们守着是为凡人好，倘若凡人自己不肯好，这般守岂不是一厢情愿？」不答也是答，这一问像颗石子投进平静的湖心，圈圈涟漪久久不散。"
 SUM_Neo_SGS.31.a:"按官署的判断行事"
 SUM_Neo_SGS.31.b:"按自己的判断行事"

 #### 独立之路 ####
 SUM_SGS_IND_The_Vigil_Ends:"戍望垂尽"
 SUM_SGS_IND_The_Vigil_Ends_desc:"花灵守了几百年，守的是凡人能自己站起来那一天。如今雨林的敕令压着沙丘腰带，压得凡人的腰都弯了。花灵不再替人做决定，可这一次她们头一个站到了前面。"
 SUM_Neo_SGS.32.t:"戍望垂尽"
 SUM_Neo_SGS.32.d:"往日花灵从不替人拿主意，凡事都让凡人自决，可这一回，她们竟头一个站到了众人前头，立在敕令与百姓之间。有凡人瞧见，惊得说不出话，只道花灵向来不问世事，今日怎么变了。花灵也不解释，只把那些被雨林压得抬不起头的百姓一个个扶起来。原来雨林的敕令一道接一道压来，压在沙丘腰带上，凡人的腰越弯越低，连头都不敢抬。花灵守着这片沙海几百年，为的就是等凡人有朝一日能自己站稳，不再仰人鼻息。守了几百年不动，为何一朝挺身？只因她们看得透：再不出头，凡人便要永世直不起腰。忍到无可忍处，便是翻身之时。"
 SUM_Neo_SGS.32.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.32.b:"把盟约收进箱底"
 SUM_SGS_IND_Pari_Council:"花灵预政"
 SUM_SGS_IND_Pari_Council_desc:"花灵头一回开口向凡人说话，说的是：「你们的事，你们自己定。」凡人听了先是不敢信，后来才敢抬头说话。这话端的痛快，从此开了新例。"
 SUM_Neo_SGS.33.t:"花灵预政"
 SUM_Neo_SGS.33.d:"「你们自己的事，你们自己拿主意。」一位花灵缓步走出，破天荒头一回对凡人开口，声音不大，落进众人耳朵里却像炸了个雷。那天沙丘腰带的凡人齐聚圣显厅前，心里七上八下，不晓得等着自己的是什么，冷不丁听了这话，面面相觑，都不敢信自己的耳朵。有个老者声音发颤：「这话可作数？」花灵点点头，目光掠过全场，缓缓道：「脚下的路自己走，头顶的天自己撑。」花灵几百年来只在暗处守着，从不在人前多一句嘴，今日这番话真是开了天辟了地。众人先是一愣，随即欢呼声潮水般涌起，憋了多年的闷气，总算痛痛快快吐了出来。"
 SUM_Neo_SGS.33.a:"召集部族共商"
 SUM_Neo_SGS.33.b:"等官署先松口"
 SUM_SGS_IND_Zurvan_Word:"祖尔宛语"
 SUM_SGS_IND_Zurvan_Word_desc:"祖尔宛只说了一句：「守着不动，也是一种偏袒。」说完便退回沙下去了。话音落下，沙下便再无声息，众花灵面面相觑。这话通透，也决绝。"
 SUM_Neo_SGS.34.t:"祖尔宛语"
 SUM_Neo_SGS.34.d:"「按兵不动，其实也是偏帮。」祖尔宛现身，平平淡淡一句，众人尚未回过味，她身影一晃就沉回沙下，没了踪迹，沙面只余一道浅浅的痕，转瞬叫风抹去。方才众人还你一言我一语争个不休，谁也拿不定主张，此刻都钉在原地，咀嚼那句话，越琢磨越觉得脸上发热。有人低声嘀咕：先前咱们光指望花灵替咱做主，竟忘了自家的事原该自家担。这话一出，众人心里最后那点靠山也算塌了。祖尔宛连花灵往日的沉默都算了进去，真是发人深省：不偏不倚，有时偏是最大的偏袒，冷眼旁观，就等于帮着压人的人。"
 SUM_Neo_SGS.34.a:"备好兵与粮"
 SUM_Neo_SGS.34.b:"多派几趟使节"
 SUM_SGS_IND_Jinn_Alliance:"矫论团结盟"
 SUM_SGS_IND_Jinn_Alliance_desc:"矫论团把经卷摊开，就着殿前的长明灯一页页指给人看，说经义讲的正是这一天。经卷既已摊开，众人也便不再迟疑，当场立誓入了盟。"
 SUM_Neo_SGS.35.t:"矫论团结盟"
 SUM_Neo_SGS.35.d:"「百姓的事，百姓自己决断，神明只在一旁看着。」议事的长老翻开一卷古册，指着其中一行朗声念出，念罢合上本子扫视众人道：「这不正是眼下这桩事？」应声附和的立时一大片。矫论团那帮读书人听说花灵与凡人的举动，早把经卷摊了一桌，逐字逐句地核对，有的朗朗读出，有的提笔圈画，果然在旧经里找到了出处，说经上讲的恰是今日这一幕。于是再不犹豫，当场决定入盟，跟沙丘腰带众人站到一处，当天就把名册送进圣显厅听候调遣，连平日最眼高于顶的几个学者也低了头。矫论团素来傲气，从不轻易附和，如今连他们都引经据典地点了头，可见这事当真顺天应人，正应了得道多助那句老话。"
 SUM_Neo_SGS.35.a:"把旗立起来"
 SUM_Neo_SGS.35.b:"把旗先卷起来"
 SUM_SGS_IND_Wish_End:"誓不祈愿"
 SUM_SGS_IND_Wish_End_desc:"凡人听了这话，起先面面相觑，后来都点了头。花灵宣布：「往后不再替人圆愿，凡人的愿，还得凡人自己去圆。」这话，说得干脆利落。"
 SUM_Neo_SGS.36.t:"誓不祈愿"
 SUM_Neo_SGS.36.d:"「往后你们的心愿，自己想法子去圆，别再来求我。」花灵当众撂下这话，凡人听了先是一喜，接着又犯了愁，有人忍不住问：「从前有神明替咱们办，如今神撒手不管，万一圆不成，那可怎么办？」花灵回得干脆：「成与不成，都是你们自家的事，自己扛着，才算真真正正站直了。」众人起先一愣，回过味来齐齐点头，有几个血气方刚的年轻人当场立愿，说要凭自己的力气把井凿深、把路修平。这一着看着像撒手不管，其实是把圆愿的责任交回凡人自己手上：从前求神赐福，得来靠侥幸，落空就怨天；如今愿望是自己挣来的，成败全在自身，这才叫挺着腰杆做人。"
 SUM_Neo_SGS.36.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.36.b:"把盟约收进箱底"
 SUM_SGS_IND_Pari_Blessing:"花灵赐嘏"
 SUM_SGS_IND_Pari_Blessing_desc:"花灵不替人办事，却给了沙丘腰带一样东西：遇事不必先问神的底气。这底气不是别的，是遇事自己拿主意的胆量，比什么都珍贵。"
 SUM_Neo_SGS.37.t:"花灵赐嘏"
 SUM_Neo_SGS.37.d:"有个从前的老怯懦，如今竟敢当众争辩道理，谁也说他不倒，人得了主心骨，连走路都稳当几分。花灵不再替凡人办大小事务，却没一走了之，她们留下一样东西：不是金银刀枪，而是一股底气，扎在每个人心窝里。有了它，遇事不慌不忙，不再像从前那样先跑去问神、问完还要看神的颜色；往后自己拿主意便是，不必先问神明许可。这底气看不见摸不着，却比什么都珍贵，凡人有了它，不再惶惶然仰人鼻息，倒敢作敢当，连说话声音都响亮几分。此事说也蹊跷：花灵一撒手，凡人反倒挺直了腰杆。"
 SUM_Neo_SGS.37.a:"召集部族共商"
 SUM_Neo_SGS.37.b:"等官署先松口"
 SUM_SGS_IND_Route_Grip:"扼其商涂"
 SUM_SGS_IND_Route_Grip_desc:"商道上的水驿与关卡换成本地人管，过路的照旧要走这条道。本地人接了手，反倒把水驿打理得更周全，过路的商队也都说好。这般接管妥当。"
 SUM_Neo_SGS.38.t:"扼其商涂"
 SUM_Neo_SGS.38.d:"新来的本地驿丞上任头一天，先淘井、再量水、登册，一样不落，比先前那外来官儿仔细十倍，来往商队无不称便。沙丘腰带打定主意，把商道上的水驿关卡都交给本地人打理，外来的官儿卷铺盖走人，换上土生土长的乡民，认得沙路，也通人情。别看只是换个人，这里头的干系大得很：水驿关卡一旦操在自家手里，赋税往哪里去、过往怎么盘查，就都由自己说了算，再不用看雨林使节的脸色，也不必按月把账册送过去重审。商队照旧走这条道，买卖往来一切如常，并没因换了管事的人就断了生计。说到底，这是把命脉一点点从别人手里收回来。换人一节表面寻常，实则关系着沙丘腰带能否自立。"
 SUM_Neo_SGS.38.a:"备好兵与粮"
 SUM_Neo_SGS.38.b:"多派几趟使节"
 SUM_SGS_IND_Toll_Local:"擅立榷场"
 SUM_SGS_IND_Toll_Local_desc:"收来的税钱，修了路又凿了井，路铺得平平坦坦，井打得很深，商户们见了无不拍手。税卡是本地商户一同商量着设的。这银钱取之于商，用之于路，倒也公道。"
 SUM_Neo_SGS.39.t:"擅立榷场"
 SUM_Neo_SGS.39.d:"修路凿井的钱从哪来？就出自那新设的税卡。本地商户凑到一处把这桩事议了又议：卡摆在哪、抽多少、怎么个收法，都是大伙儿你一言我一语敲定的，没谁能一个人说了算。争到面红耳赤时桌子也拍过，可末了总按多数人的意思办，人人心服。收上来的钱一分不进私囊，全拿去修路凿井，没多久，商道旁的废井重新见了水，塌下去的路段也铺得平平的，过往行人看了都说这税缴得不冤。这钱取之于民用之于民，跟从前雨林只顾搜刮两样，众人缴得心甘情愿。风声传开，四乡商队都跑来打听，都说沙丘的税比别处讲道理，还有精明人主动多缴些，说修桥补路是好事，多添些也无妨。"
 SUM_Neo_SGS.39.a:"把旗立起来"
 SUM_Neo_SGS.39.b:"把旗先卷起来"
 SUM_SGS_IND_Caravan_Charter:"行商立约"
 SUM_SGS_IND_Caravan_Charter_desc:"立下章程：商队在沙丘腰带内许进不许抢，违者不许再走这条路。章程刻在木牌上立在路口，谁都看得见，犯了规矩便不准再走。这章程严明。"
 SUM_Neo_SGS.40.t:"行商立约"
 SUM_Neo_SGS.40.d:"有个惯会强买强卖的贩子头一个犯了新规，当场被赶出商道，货物充公，众人看了无不咋舌。沙丘腰带立的章程写得明白：凡商队入境，只许规矩做买卖，不许抢劫生事，谁敢犯，就永远别再走这条路，断了它的营生。这章程刻在木牌上，立在商道口，识字不识字的都叫人念给他听。章程一出，商道风气顿时一清，连往年欺行霸市的也收敛不少。做买卖讲的是一个信字，纵容抢掠，谁还敢来？这班人若不惩戒，人人效仿，商道早晚成了强盗窝。如今赏罚分明，商队安心，百姓也得清静。此事看着寻常，其实非同小可。"
 SUM_Neo_SGS.40.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.40.b:"把盟约收进箱底"
 SUM_SGS_IND_Mint_Dune:"丘中设冶"
 SUM_SGS_IND_Mint_Dune_desc:"开炉铸钱，成色写在钱边上，周边各邦都肯收。铸出来的钱成色足，分量准，拿到别处也认。商队带了这钱走遍周边都不愁花。"
 SUM_Neo_SGS.41.t:"丘中设冶"
 SUM_Neo_SGS.41.d:"那邻邦商人把钱举向日头，眯眼瞧了瞧钱沿，立刻点头收下，连价都懒得还。旁人问他怎这般爽快，他笑道：钱上錾着成色，分量一清二楚，还费什么口舌。这正是沙丘腰带铸钱的高明处。他们要立住自家的计较，索性开炉造钱，炉火昼夜不熄，匠人赤着膊把铜水浇进钱范，一枚枚新钱带着热气叮当落地。每一炉铸好，都有专人抽几枚，用锉刀豁开验成色，对了放行，错了回炉重来。别处的钱成色藏头露尾，这钱偏把分量錾在钱沿上，拿眼一瞧便知几分几厘，掺不得半点假。四邻因此都肯收，商队揣着它走遍各方，从没碰过钉子。钱沿那行小字，便是通行四方的凭信。"
 SUM_Neo_SGS.41.a:"召集部族共商"
 SUM_Neo_SGS.41.b:"等官署先松口"
 SUM_SGS_IND_Reserve_Store:"置一伏廪"
 SUM_SGS_IND_Reserve_Store_desc:"盐与粮悄悄囤进沙丘深处的暗仓，囤的不是别的，是底气。暗仓设在沙丘深处，入口极隐蔽，没人找得到，便是自家人也少有人知道。"
 SUM_Neo_SGS.42.t:"沙底藏廪"
 SUM_Neo_SGS.42.d:"外人路过那片沙丘，只当是个塌了的坑，哪里想得到底下藏着座粮仓。仓口掩得严实，外头拿枯草一盖、乱石一堆，任谁也瞧不出蹊跷；入口窄得很，只容一人侧身钻进，管仓的自己来，也得两个人一块儿才开得了锁。沙丘腰带一面开炉铸钱，一面悄悄在这沙丘深处挖地建仓，把粮盐一车车、一袋袋趁夜运进去，堆得像小山，连仓门都压得沉。管仓的按月清点，逐袋登记，谁也不许私自开启。他们囤这些可不是为了发财，而是囤一份底气。老话说手中有粮心中不慌，一旦风声不对，有了这些存货，就不至于叫人掐住脖子。有备方能无患，这仓平日里没人知晓，等到局面一紧才派上用场，用心可谓深矣。"
 SUM_Neo_SGS.42.a:"备好兵与粮"
 SUM_Neo_SGS.42.b:"多派几趟使节"
 SUM_SGS_IND_Dune_Guard:"丘上屯锐"
 SUM_SGS_IND_Dune_Guard_desc:"把护路的人、矫论团的护法与各部民兵合编成一支守军。三路人马合到一处，日夜操练，成了一支劲旅，把守着商道。这守军齐整。"
 SUM_Neo_SGS.43.t:"丘上屯锐"
 SUM_Neo_SGS.43.d:"列队那天，护路的握着刀，护法捧着经卷，民兵扛着长矛，三拨人穿戴各异，却听同一个人号令。沙丘腰带要守住地界，就把原本分散的几拨人拢到一处编成守军：护路的、矫论团麾下的护法、各部落抽来的民兵，统统上册。这支守军商道也护、水驿也守，有事听令而行，不再各打各的。统领是现推的，哨探、传令、接应的章程也一并定下，哪段归谁巡守写得明明白白。从前各管一摊，遇上大敌便各自逃散；如今拧成一股，号令如一，攥成拳头打出去才有力。这一编，把三盘散沙合成一根绳，日后再有风浪，大伙儿相互照应，不至于一哄而散。"
 SUM_Neo_SGS.43.a:"把旗立起来"
 SUM_Neo_SGS.43.b:"把旗先卷起来"
 SUM_SGS_IND_Pari_Scout:"花灵为视"
 SUM_SGS_IND_Pari_Scout_desc:"花灵能借着风鸟与沙兽的眼睛替守军看道，看了却不说破，只把情形默记在心。她们望得远，嘴又紧，守军得了信儿便能提前防备。这般稳重，实属难得。"
 SUM_Neo_SGS.44.t:"花灵为视"
 SUM_Neo_SGS.44.d:"有一回，花灵借风鸟的眼，望见远处沙丘后伏着歹人、扎了营，守军照那方向摸过去，果然拿了个正着。守军巡路有一样本事是旁人没有的：花灵能借风鸟与沙兽的眼睛，替他们远远探看，哪条路有埋伏、哪处沙丘藏凶险，看得比人眼还准。可怪就怪在，她们看了却从不当场点破，任凭守军自己判断，只把消息藏在风里，让有心人自己去领会。为何看而不说？原来花灵不愿再替凡人拿主意，凡事都由凡人自己决断才是正经，这么守着分寸，既不越界也不误事。守军得了这等暗中相助，巡路胆气壮了几分，只是人人记着不可依赖太过，终究得靠自己的眼睛。"
 SUM_Neo_SGS.44.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.44.b:"把盟约收进箱底"
 SUM_SGS_IND_Beast_Handler:"驭兽之众"
 SUM_SGS_IND_Beast_Handler_desc:"驯兽的人从矫论团里挑选。调教好的沙兽，驮辎重走得远，上阵冲锋更是凶狠异常，敌军一望见便心惊。这兽的用处，着实不小。"
 SUM_Neo_SGS.45.t:"团选驯师"
 SUM_Neo_SGS.45.d:"商队那回撞上劫匪，几头沙兽披着鞍甲冲上去，一声长嘶把匪众冲得七零八落，货物一点没丢。能把兽练到这般听话，全亏了矫论团里那班懂门道的人。守军要挑人驯养沙兽，目光就落在这群人身上：他们识得古法、通兽语，晓得沙兽什么时候暴躁、什么时候温顺，驯起来自有章法，换旁人还真不成。驯好的沙兽，平常替商队驮货赶路，一旦临阵便披甲冲锋，如同添了翅膀。把合适的人放在合适的差事上，往往事半功倍，这一安排算是把矫论团的本事使在了刀刃上。打这儿起，沙丘腰带有了能上阵的兽骑，沙兽越驯越熟，临阵比战马还稳，成了对面摸不透的一支奇兵。"
 SUM_Neo_SGS.45.a:"召集部族共商"
 SUM_Neo_SGS.45.b:"等官署先松口"
 SUM_SGS_IND_Storm_Drill:"碛上演阵"
 SUM_SGS_IND_Storm_Drill_desc:"兵士们起先在狂风里连眼都睁不开，练久了竟能迎风稳稳站住，风越猛站得越牢。操演专拣风沙天进行，练的就是辨方向和结阵。主帅瞧了连连颔首，这身本事可不是一朝一夕练成的。"
 SUM_Neo_SGS.46.t:"碛上演阵"
 SUM_Neo_SGS.46.d:"练兵偏挑刮风沙的天气，是沙丘守军定下的规矩。旁人避风沙唯恐不及，他们倒好，越是在黄沙漫天里越要操练。练的其实就两件事：一是认得方向，别让风沙转了向；二是结成阵势互相照应，真打起仗来在乱军里也认得出自己人，不至于自家人踩了自家人。练到家的人，风越大反倒越沉得住，立在沙暴里纹丝不动，眼睫都不颤一下；新兵蛋子起初被吹得东倒西歪，磨久了也能在狂风里扎住马步。寻常练兵都拣好天，真上了战场一遇风沙就乱套；他们偏在恶劣天候里死磨，把本事练进骨头，临阵自然从容。这法子看着苦，道理却透：平时多流一身汗，战时就少流一片血。后来在沙暴里打硬仗，竟没一人慌了神。"
 SUM_Neo_SGS.46.a:"备好兵与粮"
 SUM_Neo_SGS.46.b:"多派几趟使节"
 SUM_SGS_IND_Water_Guard:"守泉之夫"
 SUM_SGS_IND_Water_Guard_desc:"水驿都派了人守，守的是水，也是这条商道的命。守水的人日夜不离，连夜里都要巡上几遍。这水便是商道的命，守水就是守命。"
 SUM_Neo_SGS.47.t:"守泉之夫"
 SUM_Neo_SGS.47.d:"曾有个守卒擅离了岗，一队商人在沙里转了向，差点全队渴死，事发之后那守卒挨了重罚，众人才晓得这差事干系有多大。商道沿途每处水驿都有专人看着，这人守的哪里只是一汪水，是来往人畜的命，是整条商道的血脉。沙漠里水就是命，一处驿失了守，商队便可能渴毙半道，连尸首都没人寻。所以守驿的个个尽职，昼夜不离，睡觉都留着一只眼。每处还挂了水牌，往来人数记在上头，天天核对，谁多饮了谁少饮了都要问清楚。守水就是守命，这班无名小卒肩上的担子，被看得比天还大，把一方水土护得严严实实，过路商队没有不夸的。"
 SUM_Neo_SGS.47.a:"把旗立起来"
 SUM_Neo_SGS.47.b:"把旗先卷起来"
 SUM_SGS_IND_Proclaim:"沙丘张榜"
 SUM_SGS_IND_Proclaim_desc:"告示用古沙漠文与通行文各写一遍，贴在每处水驿的墙上。识字的人便念给不识字的听，一传十，十传百，无人不知。这告示周全。"
 SUM_Neo_SGS.48.t:"沙丘张榜"
 SUM_Neo_SGS.48.d:"告示贴在每处水驿墙上，规规矩矩写着：商队进来有哪些章程、纳税几成、犯了怎么罚，一款一项不含糊。难得的是它写了两遍，古沙漠文一遍、通行文一遍，认得哪种字就看哪种。识古字的读那古老的，只通通行文的也能看个明白。有个不识字的老商在墙根底下听了半天，回头跟同伴念叨：这回好了，连咱这号人也能听懂。沙丘腰带为何费这功夫写两遍？就因为此地人心杂、文字也杂，单写一样，保准有一半人抓瞎；两样并排一贴，谁也别想推说不知情。后来旁的地方也照着学，告示都写成两种文字，竟成了沙丘腰带立下的一条规矩，再没人因为看不懂字而吃亏。"
 SUM_Neo_SGS.48.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.48.b:"把盟约收进箱底"
 SUM_SGS_IND_Raise_Banner:"高擎灵光帜"
 SUM_SGS_IND_Raise_Banner_desc:"沙丘腰带立起自己的旗，旗上是灵光的纹样。旗一升起远远便能望见，众人看了精神一振。这一面旗，便是沙丘腰带自立的意思。"
 SUM_Neo_SGS.49.t:"高擎灵光帜"
 SUM_Neo_SGS.49.d:"这旗是众人一针一线缝出来的，足足绣了七日，旗面绣着一圈圈灵光纹样，像极花灵身上的光华，还缀着各部的记号，意思说沙丘腰带各部从今是一家。沙丘腰带自立之后，便有了自己的旗，旗幡迎风猎猎，老远就认得出。旗一立，算是有了名号，众人望见旗心里就踏实，连走路都添了几分精神；往后商队远远瞧见，便知进了沙丘地界，心先放下大半。旗者，众心所向，把散着的人心聚到一面布上，这旗便成了沙丘腰带的魂。众人立约：旗在人在，旗要是倒了，就合力再扶起来；往后每逢集会，先对着旗行礼才议事，把一面布当成了自家的根。"
 SUM_Neo_SGS.49.a:"召集部族共商"
 SUM_Neo_SGS.49.b:"等官署先松口"
 SUM_SGS_IND_Reject_Edict:"返其诏书"
 SUM_SGS_IND_Reject_Edict_desc:"信使捧着那卷被退还的敕令，在原地愣了许久，末了只能原样捧回去，连一句多话都不敢讲。敕令送到水驿，竟被当众卷起退还。这一幕，实在叫人难堪。"
 SUM_Neo_SGS.50.t:"焚其诏牒"
 SUM_Neo_SGS.50.d:"信使捧着那卷轴杵在原地，好半晌回不过神，脸上红一阵白一阵，嘴唇动了动想说什么，可瞅众人神色坚决，半句也劝不进，只好把气憋在肚里。雨林的敕令又送到了沙丘水驿，这回守驿的当着信使的面，把卷轴原样卷好塞还给他。一卷一还之间，沙丘腰带的态度亮得明白：往后雨林说什么，都不算数了。信使怔了许久，闷闷收起卷轴转身复命，临走还忍不住回头瞟一眼那面新旗，脚下却不敢停。等他回到雨林，把沙丘退敕的经过原原本本一说，那边登时火冒三丈，只是沙丘远在沙海深处，一时也够不着，只好先把这口气咽下。"
 SUM_Neo_SGS.50.a:"备好兵与粮"
 SUM_Neo_SGS.50.b:"多派几趟使节"
 SUM_SGS_IND_Redraw_Border:"重画封疆"
 SUM_SGS_IND_Redraw_Border_desc:"雨林的人瞧着那新划的地界，只能干着急，半点法子也没有。商道两旁的边界重新划过，雨林的哨所被划在了外圈。这条商道，从此便归了自己人掌管。这一手，划得委实巧妙。"
 SUM_Neo_SGS.51.t:"界石标戍"
 SUM_Neo_SGS.51.d:"「你们的哨所，如今立在界外了。」沙丘的使者把这话带到雨林那边，对方竟无言以对。原来沙丘腰带收回商道，用的不是刀兵，是界碑。他们把大道两侧的地界重新丈量重画，立起青石碑，字凿得深深的，四至写得一丝不差：东到哪、西到哪，绝不含糊。这一画不要紧，雨林早先设在道上的几处哨所，全被圈到了界线以外。大道既归沙丘，哨所就成了界外之物，再没由头插手商道上的事。雨林也奈何不得，总不能跨过界来拆哨所，只好由它去。这一招不争不吵，只把界线一挪，叫你的哨所名不正、言不顺，自个儿就撤了，正是釜底抽薪。谋定而后动，不战而屈人之兵，干干净净。"
 SUM_Neo_SGS.51.a:"把旗立起来"
 SUM_Neo_SGS.51.b:"把旗先卷起来"
 SUM_SGS_IND_Final_Word:"祖尔宛遗训"
 SUM_SGS_IND_Final_Word_desc:"祖尔宛在众议上说了最后一句：「凡人的路，从今往后由凡人自己走。」说完便把手中那卷旧经合上，压在案头。众人记在心里，散了会仍立在阶下不肯走。"
 SUM_Neo_SGS.52.t:"祖尔宛遗训"
 SUM_Neo_SGS.52.d:"「凡人的路，今后凡人自己走。」众人从日中争到日头偏西，正待散场，祖尔宛忽然丢下这么一句，随即缄口，四下里静得连喘气声都听得见。大家面面相觑，想起这些年受的窝囊气，又看看眼前这花灵，心里一下子透亮了。这一句好似定音的锤，把满屋的争执一锤敲定；花灵守望了几百年的心愿，到这一刻才算落定，凡人的前程重新交回凡人自己手上，犹如拨云见日。有个性急的当场便问：「雨林的敕令，还认不认？」祖尔宛回得利落：「路既是凡人自己走，旁人的敕令，认与不认，也由凡人定夺。」众人听了心里愈发踏实，话说到这个地步，再没有半分含糊。"
 SUM_Neo_SGS.52.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.52.b:"把盟约收进箱底"
 SUM_SGS_IND_Envoy_Port:"远客抵埠"
 SUM_SGS_IND_Envoy_Port_desc:"港口的客商带来船与价，开口便问：「沙丘的盐，走不走海路？」客商说得天花乱坠，众人听了心动，却不肯轻易答应。这买卖大，干系不小。"
 SUM_Neo_SGS.53.t:"津头客至"
 SUM_Neo_SGS.53.d:"外海客商把盐样摊在案上，白花花的盐粒在日头下直闪，开口便问沙丘的盐走不走海路。原来沙丘盐质地出众，名气早飘到了海上，客商想用船运来赚一笔。他们摊开海图指点：从沙丘往东不到十天就到大港，那边的价比陆路高出好几成。港口来了外海的船，也带来了新行情。海路一通销路就宽，好盐不愁没处卖。众人心里都拨起了算盘，有人顾虑路远难走，有人已在盘算明年晒多少盐。当下便同客商说定，先运一批试走海路，成了再图长远，一条新道，就这么从嘴上落到了纸面。"
 SUM_Neo_SGS.53.a:"召集部族共商"
 SUM_Neo_SGS.53.b:"等官署先松口"
 SUM_SGS_IND_Envoy_North:"朔使入境"
 SUM_SGS_IND_Envoy_North_desc:"北国的使团愿意出资修水驿，条件是要在商道上设一处他们的驿站。这条件明摆着是要插一脚进来，众人听了都留了个心眼。这条件精明。"
 SUM_Neo_SGS.54.t:"朔方来聘"
 SUM_Neo_SGS.54.d:"北国使团开价倒大方，说愿意掏钱替沙丘修水驿，话说得漂亮：修驿是番好意，设站不过是让人歇脚，绝不碰商道的规矩。可甜言蜜语听进耳朵，附带的条件却不轻，他们要在商道上设一处自家的驿站。沙丘腰带的人哪个不精，弦外之音一清二楚，世上没有白来的好处，掏钱修驿是幌子，借机插一脚才是真。当下先摆开酒席把这伙人稳住，背地里召集众人商量怎么挡回去。来者不善，为首的一句挑明：「那驿站挂着共用的名，实则样样受制于人，今天容他伸手，明天他就反客为主。」众人皆以为然，打定主意面上敷衍，就是不松这个口，把对方肚里的算盘照得雪亮。"
 SUM_Neo_SGS.54.a:"备好兵与粮"
 SUM_Neo_SGS.54.b:"多派几趟使节"
 SUM_SGS_IND_Envoy_Rain:"林门洞辟"
 SUM_SGS_IND_Envoy_Rain_desc:"对雨林仍留着一扇门，派去的人带着商约与账。门虽留着，门槛却也设得清楚。这般留有余地，日后进退皆便。"
 SUM_Neo_SGS.55.t:"叩林之扉"
 SUM_Neo_SGS.55.d:"沙丘腰带虽然自立，跟雨林却没把门封死，到底留着一道缝。他们打发人去雨林，怀里揣着商约，也夹着账本：商约写明沙丘的盐照旧按老价供给，账本把历年往来一笔笔算清，分文不欠。摆出的就是生意人姿态，纵有嫌隙，买卖照做。留这道缝是有分寸的，不把事做绝，往后要转圜也有个落脚处。有人不解，问干嘛不把底牌全摊开，带队的答：「今天把门闩死，明天想互通有无，连个接话的人都不剩，留条缝，说到底是给自己留的。」临走前众人再三叮嘱：嘴上客气，理却要站得硬，别坠了沙丘腰带的名头。使者一一应下，收拾停当便上了路，把这道门留得周周全全。"
 SUM_Neo_SGS.55.a:"把旗立起来"
 SUM_Neo_SGS.55.b:"把旗先卷起来"
 SUM_SGS_IND_Buy_Iron:"市取兵械"
 SUM_SGS_IND_Buy_Iron_desc:"向外邦买铁与火，用沙丘的盐与香料抵价。铁与火买回来打造兵器、修筑城郭，实用。沙丘不产铁，这一笔买卖紧要。"
 SUM_Neo_SGS.56.t:"盐铁相易"
 SUM_Neo_SGS.56.d:"沙丘要置办军械农具，铁和火是关键：没铁打不出犁铧刀枪，没火炼不成铜钱、开不了炉子。可这两样本地都不出，只能拿沙丘盛产的盐和香料去外邦换。有一趟外邦商队拉来一车铁锭，沙丘这边抬出上好的盐砖和香料，两家当面验货过秤，各取所需，谁也没吃亏。通商的道理就在于互通有无，把沙漠里的出产，换成安身立命的本钱。双方还约下，往后盐香料照旧供应，铁火照旧换来，公平买卖，两边都得利。有个老商户掰着指头算了一遍，说这一趟，比往年哪回都来得划算。"
 SUM_Neo_SGS.56.a:"把盟约写进沙里的石板"
 SUM_Neo_SGS.56.b:"把盟约收进箱底"
 SUM_SGS_IND_Scout_Forest:"入林探胜"
 SUM_SGS_IND_Scout_Forest_desc:"派人去雨林只学一件事：教令院在沙丘还有几处脚跟。这探子去时扮作行商，一路小心机警。教令院根基深浅，要查明白。"
 SUM_Neo_SGS.57.t:"诇营察迹"
 SUM_Neo_SGS.57.d:"几个探子挑着盐担混进集市，眼观六路，见到熟面孔便记在心里。这趟不为买卖，只为摸清教令院到底还在沙丘留了几处落脚。教令院势力盘根错节，明面上撤了，暗地里未必干净；有人曾在沙丘撞见教令院的人，穿便服，口称考查学问，可行踪鬼祟，谁也摸不清底细。临行前，为首的把众人叫到一处千叮万嘱：此去只许看，不许留痕迹，万万不可打草惊蛇，知己知彼方能百战不殆。他又定下暗号，凡见教令院的人出没，就在路边石上画一记，后来人一瞧便懂。这一桩探查的差事，安排得滴水不漏。"
 SUM_Neo_SGS.57.a:"召集部族共商"
 SUM_Neo_SGS.57.b:"等官署先松口"
 SUM_SGS_IND_Declaration:"沙丘腰带自主"
 SUM_SGS_IND_Declaration_desc:"灵光旗升上了水驿的旗杆。花灵没有到场，只托风鸟带来一片羽毛落在旗上。矫论团的人把告示念了两遍，念完把敕令卷起来交给等在门外的信使。这一日轰动，一时传遍。"
 SUM_Neo_SGS.58.t:"沙丘腰带自主"
 SUM_Neo_SGS.58.d:"一根羽毛随风飘来，轻轻搭在旗面上，众人都不晓得它是打哪来的，只当是花灵托风鸟捎来的心意，心里头越发敬重。那日灵光旗顺着旗杆慢慢升起来，在风里猎猎作响，花灵本人却没露面。矫论团的人当着大伙把告示高声念了两遍，一字一顿，念完便卷起雨林的敕令，递给等在门外的信使。信使接了卷轴，抬眼瞧瞧旗上那根羽毛，又扫一圈围在四周的人，嘴唇动了半天，到底没吐出一个字。升旗、落羽、还敕令，这几桩事连着办下来，自立这场面办得体面又周全，信使只好捧着卷轴怏怏走人。那羽毛在旗面上逗留了许久，风也吹它不走，众人越发称奇，都说这是花灵点了头，一桩大事办得叫人心服口服。"
 SUM_Neo_SGS.58.a:"备好兵与粮"
 SUM_Neo_SGS.58.b:"多派几趟使节"

 #### 甲线 · 灵光共鸣 ####
 SUM_SGS_RA_The_Light_Resonance:"灵光相应"
 SUM_SGS_RA_The_Light_Resonance_desc:"花灵不替人做决定，却愿意与人同行。有人主张沙丘腰带的路就该这样走：人定事，花灵在旁，愿由人许，路由人担。这话在理，众人听了都服。"
 SUM_Neo_SGS.59.t:"灵光相应"
 SUM_Neo_SGS.59.d:"后来连孩童玩耍，都学着大人说：「这事我自家定。」花灵虽不替凡人拿主意，却肯陪着人走。有人就主张，沙丘腰带的路该这么走：凡事人自己定，花灵在旁边陪着；愿望人自己许，路也人自己担。此话一出众人纷纷附和，都说这些年大事小事都指望神，到头来反倒把自己活成了木头人。这话既不失对花灵的敬重，又守住了凡人自主的本分：花灵为伴不喧宾夺主，凡人为主也不妄自尊大。有人把这话说给花灵听，花灵只点了点头，没多言语，可那一点头里含着无限的欣慰。这话越传越广，再遇事众人果然先自己商量，实在拿不定主意才去问花灵，把自主二字，实实在在种进了每个人心坎里。"
 SUM_Neo_SGS.59.a:"让商路连通四方"
 SUM_Neo_SGS.59.b:"把商路关起来自守"
 SUM_SGS_RA_Rite_Light:"修灵光祀"
 SUM_SGS_RA_Rite_Light_desc:"在圣显厅外的沙地上办起灵光之礼，礼不长，来的人都带一支蜡烛。众人捧着蜡烛站在沙地上，灯光一点连成一片，好看。"
 SUM_Neo_SGS.60.t:"修灵光祀"
 SUM_Neo_SGS.60.d:"来赴礼的人手里都攥着一支蜡烛，围成一圈挨个点着，沙地上星星点点映着灵光，风过来火苗歪一歪，却谁也不灭。灵光之礼就摆在圣显厅外的沙地上，仪式并不啰嗦。众人守着烛火一言不发，只听风沙在外头呜呜地刮，心里反倒生出从没有过的安宁。蜡烛虽小，映着各人心里那点亮，聚到一处就能把黑夜撕开；礼不在排场，贵在心意到了。行完礼，各人把蜡烛捧回家插在门前，一路星星点点，把整片沙丘腰带都照亮了。这烛火的风俗后来一直没断，年年这一夜，圣显厅外总有星星点点的烛光映着灵光，把满天的黑照了个透。"
 SUM_Neo_SGS.60.a:"以契约立信"
 SUM_Neo_SGS.60.b:"以枪杆立威"
 SUM_SGS_RA_Pari_Choir:"花灵曼声"
 SUM_SGS_RA_Pari_Choir_desc:"那塞犹那教人唱花灵的歌，孩子唱得最准，大人唱得最用心。那塞犹那在旁指点，哪里唱高了，哪里唱低了，一丝不苟，众人唱得越发齐整。"
 SUM_Neo_SGS.61.t:"花灵曼声"
 SUM_Neo_SGS.61.d:"「这调子，唱上一回就年轻一回。」大人笑着四散，孩子却还不肯放过那塞犹那，缠着要再学一支。那塞犹那原是来教众人唱花灵歌的，歌儿婉转，娃娃学得最快也最准，成年人慢些倒最肯用心。起先众人七高八低，怎么也凑不到一处，直唱到第二遍才渐渐合拢，汇成一片，连沙里的风都像在跟着哼。那塞犹那立在当中，一手打拍一手比划，谁高了谁低了都瞒不过他的耳朵；歌唱得齐不齐，其实看人心齐不齐。打这以后，花灵的歌就在沙丘腰带传开了，逢年过节家家都要唱一段，连摸黑赶路的商队也哼着这调子给自己壮胆，一支歌，成了大伙儿心里的念想。"
 SUM_Neo_SGS.61.a:"把利润分给城邦"
 SUM_Neo_SGS.61.b:"把利润收归官库"
 SUM_SGS_RA_Shrine_Light:"随地树龛"
 SUM_SGS_RA_Shrine_Light_desc:"各处水驿立一处灵龛，龛前不放供品，只放一盏灯。灯昼夜不熄，长明。这灯不为供神，只为照路，别有深意。"
 SUM_Neo_SGS.62.t:"随地树龛"
 SUM_Neo_SGS.62.d:"跟别处供神的地方不同，水驿这灵龛前头，不摆猪羊三牲，也不点香，就安安静静搁一盏灯，灯芯细细的，昼夜不灭。灯烧的是沙丘本地榨的油，一盏能顶好几个月，添油的人按时来添，从没断过。为什么只搁一盏灯？因为花灵不像那些讲究供奉的神，她们要的不是宰牲磕头，是人心底里那一点清亮。龛前也没人下跪，走累了就在龛下歇歇脚，望望那盏灯，心里就安稳了。添油的人也长了个心眼，见灯芯快烧到底就提前来续，绝不叫它熄了。夜行的商队远远望见这一点光，就知道水驿快到了，心里先放下大半，这一盏灯，守得是周周全全。"
 SUM_Neo_SGS.62.a:"借水草养人"
 SUM_Neo_SGS.62.b:"借商队养兵"
 SUM_SGS_RA_Pilgrim_Dune:"千里谒庙"
 SUM_SGS_RA_Pilgrim_Dune_desc:"赶路的人结伴同行，遇上沙暴就躲进沟里相互照应，凶险因此少了许多。通往圣显厅的道路，终于重新走得通了。只是这一路，到底还是难行。"
 SUM_Neo_SGS.63.t:"千里谒庙"
 SUM_Neo_SGS.63.d:"通往圣显厅的老路荒废多年，如今重新踩通，走的人渐渐多起来，多半三两结伴，彼此有个照应，免得落了单。沿路每隔十几里就堆一处歇脚的石堆，行人到了便知又近了一程。沙漠里最凶险的是沙暴，狂风裹着黄沙扑来，众人就钻进沙沟，拿布捂住口鼻，等风头过了再动身。有回几个孩子贪玩掉在后头，眼看要被风沙卷走，多亏前头大人折回来找，一个个拽进沟里，真真是险。路一通，圣显厅就不再是遥远的旧迹；路上结识的人后来多成了朋友，逢年过节还相互串门，一条路，硬是走成了人情，把散在各处的人心又牵到了一处。"
 SUM_Neo_SGS.63.a:"让商路连通四方"
 SUM_Neo_SGS.63.b:"把商路关起来自守"
 SUM_SGS_RA_Festival_Light:"陈灵光之庆"
 SUM_SGS_RA_Festival_Light_desc:"每年在圣显厅办一次灵光节，节日里不办买卖，只办歌与灯。到了当日各处的人齐聚圣显厅，唱歌点灯，连沙丘都似亮了起来。这节雅致。"
 SUM_Neo_SGS.64.t:"灵光节罢市"
 SUM_Neo_SGS.64.d:"灵光节一年一回，设在圣显厅，有个怪规矩：这天不谈买卖、不做生意，只弄歌和灯。节前众人就张罗开了，石阶擦得锃亮，新榨的灯油一份份分好，娃娃们满地拾柴，留着夜里点火。到了正日子，唱歌的唱歌，点灯的点灯，热热闹闹却半点铜臭也没有，连平日里最爱斤斤计较的，也把算盘锁进了柜子。一年到头为衣食奔忙，总要腾出一天，不为填肚子，只为心里的欢喜和敬意，懂歇的人才算懂日子。天一黑，圣显厅前灯火齐明，歌声笑声隔着几道沙丘都传得过来。一位老人指着那片灯，对身边娃说：「这光，就是咱沙丘腰带的心。」整年的辛苦，全化在这一夜的欢喜里。"
 SUM_Neo_SGS.64.a:"以契约立信"
 SUM_Neo_SGS.64.b:"以枪杆立威"
 SUM_SGS_RA_Pari_Pact:"盟于花灵"
 SUM_SGS_RA_Pari_Pact_desc:"人神各安其分，谁也不去踩过那条线，从此两下里再无怨言。与花灵定的约很明白：人不请神明来判断是非，神也不替人去担责任。这约，称得上公道。"
 SUM_Neo_SGS.65.t:"盟于花灵"
 SUM_Neo_SGS.65.d:"盟约是沙丘腰带同花灵一道立的，刻在石板上，用的是古沙漠文，就立在各处水驿。约里两条说得死死的：凡人不请神明来判断谁是谁非，神明也不替凡人扛那份责任，各管各的，谁也别越界。识字的人读了，就念给不识字的听，一传十、十传百，没几天人人都晓得了。立约那天没敲锣也没打鼓，反倒静悄悄的，众人肃立，连衣角扫过的声响都听得真真的，各人心里都掂得出这约有多重。这份郑重是心照不宣的，越是安静，越有千钧的分量。花灵那天只默默立在一旁，等众人写完了，才轻轻点一下头，飘然而去。这约不仗刀枪之威，不借官爵之势，单凭众人一颗自愿的心，就立得稳稳当当。"
 SUM_Neo_SGS.65.a:"把利润分给城邦"
 SUM_Neo_SGS.65.b:"把利润收归官库"
 SUM_SGS_RA_Wish_Rule:"立祈愿式"
 SUM_SGS_RA_Wish_Rule_desc:"愿望和代价都须写得清清楚楚，含混的压根不许许。这样立了规矩，谁也赖不得账，口舌也省了不少。规矩既明文写定，便无人能够抵赖。"
 SUM_Neo_SGS.66.t:"立祈愿式"
 SUM_Neo_SGS.66.d:"许愿这事也立了新章法：要许愿，就得把愿望一笔一画写出来，代价也得跟着写明白，一个字都不许含混；要是写得模棱两可，你就是把嘴皮子磨破也不给许。章法上还写着，愿一许下就得照着办，办不到的得把原由讲清楚，不能稀里糊涂糊弄过去。这章程定得实在高明：从前许愿吞吞吐吐，事后没完没了地扯皮，如今白纸黑字，愿归愿、价归价，一笔烂账硬是理成了明白买卖。有个后生起先嫌太麻烦，后来靠这章程真讨回了公道，才晓得白纸黑字的妙处。这法子还传到了外头，邻近的邦国听了也照猫画虎立条文，都夸沙丘腰带这章程周全，把许愿这件神神道道的事，办成了清清楚楚的交易，让人心服。"
 SUM_Neo_SGS.66.a:"借水草养人"
 SUM_Neo_SGS.66.b:"借商队养兵"
 SUM_SGS_RA_Pari_Teacher:"花灵为傅"
 SUM_SGS_RA_Pari_Teacher_desc:"花灵授徒不教现成答案，只教人怎么发问。她们领着弟子看星、看水、看沙，看的都是同一片天地，可各人问的话不同，领悟便不同。"
 SUM_Neo_SGS.67.t:"花灵为傅"
 SUM_Neo_SGS.67.d:"有花灵说，答案都在天地之间：星里藏着方向，水里藏着深浅，沙里记着年月，只要会看，处处都是学问。花灵教凡人的本事，就三样：看星、看水、看沙，可她们从不把这当答案直接塞给人，只教人怎么去看、怎么去问。看星识方向，看水知深浅，看沙辨吉凶，学到手了遇事自己去寻答案，这叫授人以渔而非授人以鱼。有那聪明的，学了几年竟能自己推算沙暴的时辰，正应了师父领进门、修行在个人。花灵见了也只是笑笑，从不多夸一句，把众人都当成能自己走路的人，把本领实实在在交到了各人手里。"
 SUM_Neo_SGS.67.a:"让商路连通四方"
 SUM_Neo_SGS.67.b:"把商路关起来自守"
 SUM_SGS_RA_Witness_Pari:"花灵临盟"
 SUM_SGS_RA_Witness_Pari_desc:"立大契当日特请花灵到场作证，洋洋洒洒的证词只一句：「此事是人自己定的。」众人听了，都道这话虽短，却把干系撇得清清楚楚，往后谁也赖不得别人。"
 SUM_Neo_SGS.68.t:"花灵临盟"
 SUM_Neo_SGS.68.d:"圣显厅前立着一块石碑，路过的人总要停下来，念一遍上头那句短话：「这事，是人自己定的。」刻碑的由来，是立大契那天众人请花灵来作证。她的证词短得不能再短，就这一句，可重若千钧。它把沙丘腰带的自立从头到尾都归到凡人身上，明明白白告诉天地：不是神赐的，不是外力逼的，是凡人自己拿的主意。花灵只在旁边做个见证，不居功、不揽权，说完便退到一旁，任众人怎么请，也不肯再多说一个字。当时在场的人无不肃然起敬。就这一句，把凡人与花灵的名分分得清清楚楚：凡人自立，花灵为证，各安其位，毫不含糊。"
 SUM_Neo_SGS.68.a:"以契约立信"
 SUM_Neo_SGS.68.b:"以枪杆立威"
 SUM_SGS_RA_Duty_Split:"分任厥责"
 SUM_SGS_RA_Duty_Split_desc:"人管甚么、花灵管甚么，从前是一笔糊涂账，遇事便互相推诿。如今一条条写得清清楚楚，刻在板上挂在厅前，谁该办甚么明明白白，再没人能扯皮。"
 SUM_Neo_SGS.69.t:"分任厥责"
 SUM_Neo_SGS.69.d:"长老当着满堂的人，把人、灵各管的一桩桩事分说明白：某段沙道归人巡，某片花田归灵守，某口井归人挑水，某处风信归灵预报。沙丘腰带诸城，人与花灵比邻而居，往日各管各的，从没一本明白账。遇着风灾路断，便你推我、我推你，谁也不肯担责，病根就在各人管什么从没写清。有花灵剔着花枝问：「倘若沙暴不分人灵，叫谁去挡？」长老道：「人挡沙，灵报风，各尽力便是。」众人听了都说有理。怕日子久了又出差错，长老命书吏把名册重抄一遍，一笔一画抄成两份，一份留议事厅，一份交花灵收着。这下谁该管什么，一望便知，再没得推诿的。"
 SUM_Neo_SGS.69.a:"把利润分给城邦"
 SUM_Neo_SGS.69.b:"把利润收归官库"
 SUM_SGS_RA_Read_Hall:"圣显厅释文"
 SUM_SGS_RA_Read_Hall_desc:"圣显厅里石壁石板尽是古字，识字的众人一块块释读，读将出来多的是些旧规矩、旧账目。这些字压在沙下多少年，一朝读出来竟都是前人算过的老账。翻旧账，也是续香火。"
 SUM_Neo_SGS.70.t:"圣显厅释文"
 SUM_Neo_SGS.70.d:"罚一只羊。就为偷了一点水。这是圣显厅石壁上一条罚约，一个学者读到这儿，忍不住笑出了声，笑声在空落落的厅里撞出回音。那些刻在石壁上的古沙漠文，年深日久，苔痕斑驳，哪是什么仙文天书？矫论团的学者天天仰着脖子，一字一字地抠，读出来尽是旧规旧账：某年某城欠了某城多少粮，某口井归哪家挑水，某段商道怎么分税。遇到认不全的字，就拿炭笔把形状描下来，揣回去慢慢琢磨，再把读懂的字注在旁边。年头一长，那面石壁竟像又添了一层新注。"
 SUM_Neo_SGS.70.a:"借水草养人"
 SUM_Neo_SGS.70.b:"借商队养兵"
 SUM_SGS_RA_Slab_Three:"石版三块"
 SUM_SGS_RA_Slab_Three_desc:"厅中散着三块石板，众人费了许多力气才把它们拼作一块。三板合一，只听轰隆一声，那厅门竟裂开一道缝。既不是金玉，也不是机关，竟是一缕风。"
 SUM_Neo_SGS.71.t:"石版三块"
 SUM_Neo_SGS.71.d:"「慢着，先把时辰记下来。」一个少年胆子大，凑到门缝前往里瞧，被长老一把拽住袖子。圣显厅深处原藏着三块石板，各缺一角，分开瞧纹路压根接不上。矫论团的学者把它们拼到一处，你推我挪地试着合，怪就怪在，三块一凑严丝合缝，纹路连成一体，像天生的整块。只听轧轧一声，厅门裂开道缝，缝里没有金光也没有异宝，就是一股凉风透进来，带着沙枣花香。众人你看我我看你，没一个敢先伸手。这风打哪来，书里且按下不表。"
 SUM_Neo_SGS.71.a:"让商路连通四方"
 SUM_Neo_SGS.71.b:"把商路关起来自守"
 SUM_SGS_RA_Archive_Light:"灵光汇典"
 SUM_SGS_RA_Archive_Light_desc:"释读出来的文字众人抄成册页，分送各处水驿，摆在藏书架上。这册子不锁不藏，谁来都能翻看。由此人人知晓旧规旧账，再没人能一手遮天。"
 SUM_Neo_SGS.72.t:"灵光汇典"
 SUM_Neo_SGS.72.d:"那册子被人翻得纸边都卷了毛。矫论团把释读出来的东西，用上好的莎草纸誊清，订成一本厚厚的册子，托水驿驿丞收进驿里藏书，装进木匣，封面上题了书名。藏书屋向来上锁，这回特意空出一格，谁来都能翻。商队歇脚时，识字的水手取出来看，有不解的便问守驿书吏，书吏也乐得讲，指着那上头的旧账说：这便是咱祖上立规矩的来由。"
 SUM_Neo_SGS.72.a:"以契约立信"
 SUM_Neo_SGS.72.b:"以枪杆立威"
 SUM_SGS_RA_Keep_Seal:"封识毋启"
 SUM_SGS_RA_Keep_Seal_desc:"圣显厅最深处有一道门贴着封条，众人谁也不去动它。原来是祖尔宛早有言在先，说那扇门不急，时候未到切莫擅动。众人谨记这话，年年岁岁，那封条依旧完好。"
 SUM_Neo_SGS.73.t:"封识毋启"
 SUM_Neo_SGS.73.d:"有人猜是历代经卷，有人猜是镇厅的至宝，说了多年也没个准。圣显厅越往里石门越沉，最深一道门上贴着封条，上头的字谁也认不全。几个好事的屡次伸手想揭，都被祖尔宛拦住，她讲这门不急，时候没到，揭开反惹乱子，众人方才收手。连矫论团的长老也不知封条底下藏着什么，只见这封条历经岁月，颜色褪尽、边角卷起，却还端端正正贴在原处，纹丝没动。"
 SUM_Neo_SGS.73.a:"把利润分给城邦"
 SUM_Neo_SGS.73.b:"把利润收归官库"
 SUM_SGS_RA_Hall_Guard:"守厅之吏"
 SUM_SGS_RA_Hall_Guard_desc:"守厅之人由矫论团与守军两下轮值，今日你明日我。那轮值表明明白白贴在门外，谁当值、几时换班一目了然。既无人常年霸着，也无人推诿偷懒。这法子公道。"
 SUM_Neo_SGS.74.t:"旬日迭守"
 SUM_Neo_SGS.74.d:"有一回守军的人睡过了头，矫论团的顶了半日，事后谁也没计较，只把轮值表前头那日改了了事。圣显厅既要护经卷，又不能没人看着，矫论团与守军便商定轮班值守：今天你、明天我，十天一换，周而复始。轮值表写得清清楚楚，贴在厅门外面，谁哪天当值一目了然。这法子公道，既省得推诿，也省得争功。每到换班，前一班要把厅里的情形一一交代：哪块石板挪过、哪处封条完好，都写得明明白白。"
 SUM_Neo_SGS.74.a:"借水草养人"
 SUM_Neo_SGS.74.b:"借商队养兵"
 SUM_SGS_RA_Dune_Regiment:"丘上练旅"
 SUM_SGS_RA_Dune_Regiment_desc:"守军的兵、驭兽的人、护路的卒三下里合编，成了一支军团。那旗号上绣着灵光，在日头底下闪闪发亮。三路人马归一，号令便齐，如臂使指。"
 SUM_Neo_SGS.75.t:"丘上练旅"
 SUM_Neo_SGS.75.d:"校场上三路人马列得齐齐整整：驭兽人牵着巨兽，守军按刀而立，护路的背着弓。长老立在点将台上，把军旗一挥，三军齐声呐喊，声浪震得沙丘都在抖。沙丘腰带各处人马原本零散，守军的守军、驭兽的驭兽、护路的护路，各不相属，矫论团首倡把这三路并成一军，还新制了一面旗，旗上绣着灵光，风一吹那光仿佛在流转。打这以后，这群人才算有了名分，不再是一盘散沙。"
 SUM_Neo_SGS.75.a:"让商路连通四方"
 SUM_Neo_SGS.75.b:"把商路关起来自守"
 SUM_SGS_RA_Light_Scout:"灵光四探"
 SUM_SGS_RA_Light_Scout_desc:"侦骑探路不用人眼，却借那风鸟的翅膀。原来风鸟飞得高看得远，前头有甚动静它先瞧见，比人早、比人远。厉害。"
 SUM_Neo_SGS.76.t:"灵光四探"
 SUM_Neo_SGS.76.d:"有一回敌军埋在沙谷里，侦骑还没察觉，风鸟早在上头盘旋，急得上蹿下跳，侦骑会意，忙报主将，才算躲过一劫。行军打仗最要紧的，是先摸清敌人在哪。风沙连里有聪明的侦骑，养了几只风鸟专管看路，这鸟飞得高、看得远，又识得风向，比人眼强得多：人骑马探路不过几十里，风鸟一展翅，一炷香便飞出百里，把前头沙丘背后的动静瞧得清清楚楚。自此军中定了规矩，凡要出行，先放风鸟。"
 SUM_Neo_SGS.76.a:"以契约立信"
 SUM_Neo_SGS.76.b:"以枪杆立威"
 SUM_SGS_RA_Storm_Company:"风沙弥望"
 SUM_SGS_RA_Storm_Company_desc:"有一支兵马专挑风天出击，唤作风沙连。这连人马惯在沙暴里厮杀，别人避之不及，他们却迎着风上。编成之后第一仗恰在沙暴里打，得心应手，赢得漂亮。"
 SUM_Neo_SGS.77.t:"风沙试勇"
 SUM_Neo_SGS.77.d:"「天助我也！」狂风卷着黄沙，天昏地暗，对面都不见人，军士们心里发毛，主将却仰头大笑。风沙连成军后头一仗就撞上沙暴，可这连的人沙里生沙里长，别人怕，他们偏惯经，借着风势反把敌军冲散了架。敌军眯着眼分不清方向，弓拉不开、刀举不稳；风沙连的人摸透了风向，专往背风处掩杀，这一仗赢得漂亮。军里就此传开一句话：风沙连是风天里炼出来的。"
 SUM_Neo_SGS.77.a:"把利润分给城邦"
 SUM_Neo_SGS.77.b:"把利润收归官库"
 SUM_SGS_RA_Water_Post:"水邮置戍"
 SUM_SGS_RA_Water_Post_desc:"各处水驿都设了一班守兵，守的是驿，也是水。有这一班兵丁守着，那一方水井水源便无人敢私自霸占。守水便是守命。"
 SUM_Neo_SGS.78.t:"水邮置戍"
 SUM_Neo_SGS.78.d:"沙漠里水就是命，井水要是让人下了药，或者把水源壅断，一城的人都得渴死。各处水驿原本只是商旅歇脚取水的地方，如今也添了守兵，守的不光是房子，顶要紧的是守水。守兵天天守在井边，不许搅浑，也不许私占。有几个泼皮想偷引井水，当场被拿住，捆在驿门前示众，打这以后没人再敢打井的主意。守兵心里透亮：守住这口井，就守住了往来客商的命。"
 SUM_Neo_SGS.78.a:"借水草养人"
 SUM_Neo_SGS.78.b:"借商队养兵"
 SUM_SGS_RA_Field_Song:"行歌从军"
 SUM_SGS_RA_Field_Song_desc:"军中传唱花灵的歌，唱的是守土，是同行。那歌调子简单，词也朴实，老兵唱一遍，新兵跟着哼一遍，到第二遍竟也会了。于是满营皆歌，士气大振。"
 SUM_Neo_SGS.79.t:"重聆再四"
 SUM_Neo_SGS.79.d:"「不急，听第二遍。」新兵嫌这曲子软绵绵的，懒得张嘴，老兵只这么说了一句。风沙连夜里在沙丘宿营，篝火噼啪烧着，众人便唱起花灵传下的歌，唱的是守土、唱的是同行，词儿质朴，调子拖得长。头一遍唱下来七零八落，可唱到第二遍，那调门陡地一转，竟雄浑起来，新兵不知不觉也跟着哼，等到第三遍，也就顺顺当当会了。满营的歌声乘着风飘出老远，花灵在火光外头轻轻跟着应和。军士们唱着唱着，白日里厮杀的疲苦，竟都丢到爪哇国去了。"
 SUM_Neo_SGS.79.a:"让商路连通四方"
 SUM_Neo_SGS.79.b:"把商路关起来自守"
 SUM_SGS_RA_Sacred_Oasis:"神灵之宅"
 SUM_SGS_RA_Sacred_Oasis_desc:"有几处绿洲被立为圣所，只一句：许进不许占。谁来饮水歇脚都欢迎，可谁想圈地占了却万万不能。由此这几处绿洲永远向众人敞开。"
 SUM_Neo_SGS.80.t:"圣地毋侵"
 SUM_Neo_SGS.80.d:"绿洲在沙漠里是稀罕物，有一眼泉、有一片草木，便是一处活命的所在。矫论团跟大伙儿一合计，挑几处顶要紧的绿洲划为圣所，定了条铁规矩：只准进去，不准占。这规矩厚道得很，不管你是哪族哪邦的商旅，进了圣所就能取水、歇脚、乘凉，可不能在里头盖房、开荒、圈地。真有那贪心的想据一块地，众人便一齐上前理论，非把他撵走不可。打这以后，几处绿洲成了往来客商的活命地，草木也养得愈发繁茂。"
 SUM_Neo_SGS.80.a:"以契约立信"
 SUM_Neo_SGS.80.b:"以枪杆立威"
 SUM_SGS_RA_Water_Gift:"剖水要盟"
 SUM_SGS_RA_Water_Gift_desc:"圣所的水按人头分给四围百姓，不分你是哪一族，不问你属哪一邦，只要是口渴的人便有一份。由此各族各邦的人都念圣所的好。"
 SUM_Neo_SGS.81.t:"剖水新盟"
 SUM_Neo_SGS.81.d:"沙漠里各族各邦向来为水红眼，这规矩一立，头一回不分彼此：只要人在圣所，便有一份水，管你哪一族、属哪一邦。取水按人口分，矫论团议定的，众人排着长队，大桶小罐各按人头领，多一滴也不许。有一回一个外邦人没轮上，众人二话不说，把自己那份匀了些给他。把人当人看，这句话头一回在圣所成了真。"
 SUM_Neo_SGS.81.a:"把利润分给城邦"
 SUM_Neo_SGS.81.b:"把利润收归官库"
 SUM_SGS_RA_Light_Garden:"灵光园新辟"
 SUM_SGS_RA_Light_Garden_desc:"绿洲边上新开了一座园子，一半是好看的花草，一半是治病的药草。闲人来赏花，病人来采药，各取所需。这般安排巧妙。"
 SUM_Neo_SGS.82.t:"圃中艺药"
 SUM_Neo_SGS.82.d:"有懂医的矫论团学者日日在此料理，教当地人认各样药草，花灵也来帮忙，替药苗引来露水，日子久了这园子远近闻名。某处绿洲边上，矫论团辟出一片地开了座园子，里头种的不光花木，更多的是药草。沙漠行旅最怕伤病，一旦生病前不着村后不着店，只能等死；这园里的药草晒干碾末，能治吐泻、治中暑，救过不少人命。"
 SUM_Neo_SGS.82.a:"借水草养人"
 SUM_Neo_SGS.82.b:"借商队养兵"
 SUM_SGS_RA_Refuge:"置避乱之舍"
 SUM_SGS_RA_Refuge_desc:"圣所还有一桩好处，便是兼作避难之所。一遇风灾战乱那大门便敞开，收容逃难的人，给口饭吃，给处地方歇。由此圣所之名传遍沙丘。"
 SUM_Neo_SGS.83.t:"危时纳众"
 SUM_Neo_SGS.83.d:"黑风一卷，房舍都能掀翻；战乱更是没个准，今日太平，明日刀就杀到眼前。圣所除了供人取水，还兼着避难，一遇风灾战乱就开门纳人，任你哪一族哪一邦的百姓都能进来躲，里头水、粮、御寒的毛毡都备着。有一回邻邦交兵，逃难的扶老携幼把圣所挤得满满当当，奇的是竟没人在里头行抢，大家挤在一处，倒还相互照应。"
 SUM_Neo_SGS.83.a:"让商路连通四方"
 SUM_Neo_SGS.83.b:"把商路关起来自守"
 SUM_SGS_RA_Keeper:"守圃之夫"
 SUM_SGS_RA_Keeper_desc:"看园的人不穿军装，一身布衣，可手里头却握着刀。别看他打扮寻常，惹不得。那些想抢圣所的，没一个落得好下场。"
 SUM_Neo_SGS.84.t:"圃者怀刃"
 SUM_Neo_SGS.84.d:"看园的汉子腰间别着一把刀，平常莳花弄草，看着跟普通园丁没两样，可真有人来犯，刀立马出鞘。这刀不是欺负人的，是护圣所的。原来圣所常有人来抢，有胆大的趁夜想偷井水、毁药园，都被他拦下。规矩立下之后，抢圣所的没一个落得好：轻的罚做苦役，重的枷在驿门口示众。那回三个泼皮摸黑来抢水，看园人不慌不忙抽出刀，拿刀背一抡就撂倒两个，剩下的吓得跪在地上直求饶。一把刀，护住了一方圣所的清净。"
 SUM_Neo_SGS.84.a:"以契约立信"
 SUM_Neo_SGS.84.b:"以枪杆立威"
 SUM_SGS_RA_Word_Forest:"遗书林薮"
 SUM_SGS_RA_Word_Forest_desc:"给雨林的书信写得客客气气，尽是商路怎么走、水位涨落几分，半句刀兵的话也不提。话虽客气，道理却一句不含糊。绵里藏针。"
 SUM_Neo_SGS.85.t:"遗书林薮"
 SUM_Neo_SGS.85.d:"雨林向来跟沙漠不和睦，矫论团怕一开口就提刀兵把事弄僵，所以这几封信写得极客气，通篇只谈商路、水位，半句争斗的话也没有。沙丘腰带要跟雨林通个声气，写了几封书信送去，净拣和气话说，什么愿通商路、愿通报水情，字字诚恳。送信的使者挑了又挑，专拣那口齿伶俐的。雨林那边接了信，果然也客客气气地回了礼。"
 SUM_Neo_SGS.85.a:"把利润分给城邦"
 SUM_Neo_SGS.85.b:"把利润收归官库"
 SUM_SGS_RA_March_Dune:"循丘东指"
 SUM_SGS_RA_March_Dune_desc:"大军东进不走路，偏沿着沙丘的脊背走。原来行走沙脊，风一起便把足迹吹得干干净净，无迹可寻。敌军想跟踪，也摸不着方向。"
 SUM_Neo_SGS.86.t:"循丘东指"
 SUM_Neo_SGS.86.d:"偏偏这一日起了大风，风卷黄沙把足迹吹得平平整整，像从没人来过。沙丘腰带的大军既已编成，便沿沙丘脊一路东进，行军最难的是留痕：人马走过沙上便是一串脚印，敌军见了便能追踪。众军士借着风势悄无声息行了几十里，有那押后的回头一望，但见黄沙茫茫哪还有半点痕迹，不由赞了句天助。主将听了只是微微一笑，催军速行。"
 SUM_Neo_SGS.86.a:"借水草养人"
 SUM_Neo_SGS.86.b:"借商队养兵"
 SUM_SGS_RA_Volunteer:"义从云集"
 SUM_SGS_RA_Volunteer_desc:"矫论团的人与各族的青壮，纷纷自带口粮挎着刀赶来，四面八方汇聚一处，到的人比事先估摸的还多，把各城粮仓都吃紧了。"
 SUM_Neo_SGS.87.t:"传檄纠义"
 SUM_Neo_SGS.87.d:"檄文一传，各处响应，矫论团的人和各族青壮纷纷自带口粮来投，有卖掉羊群凑盘缠的，有背着弓箭走了几百里的，一天之间校场上就聚了几千人。大军东进之前先发了一道檄文四处传扬，把起兵的缘由说得明白，无非是争那水、争那路，争一个不受人欺的公道。主将见人心齐整大喜，命人搭起台来当众宣讲檄文，众人听了欢声雷动。"
 SUM_Neo_SGS.87.a:"让商路连通四方"
 SUM_Neo_SGS.87.b:"把商路关起来自守"
 SUM_SGS_RA_Front_Shrine:"阵前奉龛"
 SUM_SGS_RA_Front_Shrine_desc:"雨林边上立起一处军前灵龛。敌人望见心里先就乱了，自家将士望见心里反倒定了。同一座龛，两边看了滋味各自不同。"
 SUM_Neo_SGS.88.t:"阵前奉主"
 SUM_Neo_SGS.88.d:"原来那灵龛里供着花灵的像，雕得慈悲安详：敌军见了想起家中妻儿，士气便泄几分；自己人见了想起守土护民的誓言，胆气便壮几分。这灵龛有些古怪，敌人望见心里便乱，自己人望见心里反定。大军临近雨林边界，矫论团在军前立了一处灵龛供奉花灵，主将每日清晨必亲自上香，众军士也跟着学，出战之前都来拜一拜。这一仗还没开打，士气先分了高下。"
 SUM_Neo_SGS.88.a:"以契约立信"
 SUM_Neo_SGS.88.b:"以枪杆立威"
 SUM_SGS_RA_Terms_Light:"留其末言"
 SUM_SGS_RA_Terms_Light_desc:"大军兵临关隘方才把条件摆出来：一要撤哨，二要减税，三要还水，四要认独立。这几条不早不晚，偏偏此时提出，拿捏住了火候。"
 SUM_Neo_SGS.89.t:"留其末言"
 SUM_Neo_SGS.89.d:"使者把四条一一说了，又道：若肯依从，商路依旧、百姓安然；若不依从，只怕刀兵相见，守关官听了沉吟半晌，不敢立时答复。大军一路东进，直抵一处关隘才勒住马，提出条件来。条件共有四桩：撤去哨卡、减轻赋税、归还占用的水源、承认沙丘腰带独立。矫论团派了能言善辩的使者入关去见守关的官。"
 SUM_Neo_SGS.89.a:"把利润分给城邦"
 SUM_Neo_SGS.89.b:"把利润收归官库"
 SUM_SGS_RA_Light_Commonwealth:"灵光立社"
 SUM_SGS_RA_Light_Commonwealth_desc:"圣显厅外的沙地成了众人议事场。事是人定的，愿是人许的，代价也是人担的，花灵只在旁听着，替众人把每句话都记住，谁也抵赖不得。众人都道这话公道。"
 SUM_Neo_SGS.90.t:"灵光立社"
 SUM_Neo_SGS.90.d:"人围着火堆坐定，七嘴八舌商量要紧事，愿自己许、代价自己担，花灵只坐在一旁静静听，一句嘴也不插。沙丘腰带的人把圣显厅外那片沙地当成了议事的地方，这议事有个古怪处：主意是人拿的，花灵只在旁边听着。她们记性极好，凡人说过的话一字不落全记在心里，日后谁要是翻悔，她们便把当日的话原封不动背出来，叫你想赖都赖不掉。就为这个，那些轻诺寡信的人，这时也不敢张口随便许愿，议事场上句句都得掂量着说。"
 SUM_Neo_SGS.90.a:"借水草养人"
 SUM_Neo_SGS.90.b:"借商队养兵"

 #### 乙线 · 学者城邦 ####
 SUM_SGS_RB_The_Scholar_Cities:"诸生立国"
 SUM_SGS_RB_The_Scholar_Cities_desc:"矫论团守着经卷，也守着沙路与水井。有人主张把沙丘腰带的城邦建成学者的城邦：议事、立律、办学、通商，让那经义落地，变成人人能过日子的规矩。"
 SUM_Neo_SGS.91.t:"诸生立国"
 SUM_Neo_SGS.91.d:"「经卷里的话向来是空的，怎能当饭吃？」有人当场质疑。那主张的学者便反问：「你且看那些旧账旧规，哪一样不是过日子的道理？」众人这才恍然，连连拱手称是。矫论团守着经卷，也守着路和水，有人主张把沙丘腰带的城邦建成学者的城邦：议事、立律、办学、通商样样齐备，让经义落到地上，变成能过日子的规矩。这主张一出议论纷纷，自此各城里议事厅、学馆、集市，一应都照经义立了起来。"
 SUM_Neo_SGS.91.a:"把土地分给部族"
 SUM_Neo_SGS.91.b:"把土地归入官仓"
 SUM_SGS_RB_City_Charter:"镌邦之典"
 SUM_SGS_RB_City_Charter_desc:"厚厚的贝叶册上，抄着每座城邦订下的宪章：公事谁来议、谁来办、谁来查，一条条写得明明白白。册子就摆在议事厅的案头，办事从此有了章程。"
 SUM_Neo_SGS.92.t:"镌邦之典"
 SUM_Neo_SGS.92.d:"公家的事谁来议、谁来办、谁来查，一件件都得写清楚，免得日后互相推诿，沙丘腰带各城因此都要立宪章。议事的是众人推举的代表，办事的是公推的执事，查办的另是一班人，三股势力彼此牵制，谁也别想一手遮天。宪章抄成几份，议事厅存一份、集市口立一份，人人看得到，不识字的请人念一念。从此办事有章程，不再凭官爷一时高兴。"
 SUM_Neo_SGS.92.a:"推举公议的执事"
 SUM_Neo_SGS.92.b:"沿用旧日的长老"
 SUM_SGS_RB_Council_Hall:"坐镇公堂"
 SUM_SGS_RB_Council_Hall_desc:"议事厅的门偏偏朝着集市开，谁都能进去旁听。旁听的人一多，那些当官的说话便谨慎了，没人敢信口开河。日子久了，行事也越发谨慎。"
 SUM_Neo_SGS.93.t:"肆门向市"
 SUM_Neo_SGS.93.d:"有回一位执事说了句昏话，台下立刻哄起倒彩，那执事脸涨得通红。各城议事厅的大门偏朝着集市开，谁想听都能进去，这在往日是想都不敢想的。从前议事关起门来，百姓连边都沾不着。如今门一敞，赶集的、卖菜的都能进来听两耳朵，起先还拘谨，听久了也就自在。怪就怪在，听的人越多，议事的反倒越谨慎，不敢随口乱说，更不敢徇私，众目睽睽之下谁不爱惜脸面？"
 SUM_Neo_SGS.93.a:"让花神的誓约作证"
 SUM_Neo_SGS.93.b:"让官署的法度作证"
 SUM_SGS_RB_Citizen_Roll:"括户成籍"
 SUM_SGS_RB_Citizen_Roll_desc:"衙门里翻一翻册子，来人的底细便清楚：是本城的，还是外来的，都写得明白。各城的人逐个登记造册，奸细再难混进来，赋役也摊得均了。"
 SUM_Neo_SGS.94.t:"两牒著籍"
 SUM_Neo_SGS.94.d:"各城人杂，来来往往的什么人都有，矫论团便逐户登记造册，谁是本城土著、谁是外邦客商，翻册便知。登记要写明姓名、来历、住处，古沙漠文和通行文两种字迹并用；来历说不清的，多盘问几句再录。曾有一桩盗案，捕快照着册子挨家查访，没多久人赃俱获。城中人口从此清清楚楚，办事也有了凭据。"
 SUM_Neo_SGS.94.a:"与雨林互通有无"
 SUM_Neo_SGS.94.b:"与雨林划清界限"
 SUM_SGS_RB_Elected_Steward:"众意所推"
 SUM_SGS_RB_Elected_Steward_desc:"城里的执事不由上头指派，却由众人公推，任期三年，任满便得让贤，不得连任。由此你方唱罢我登场，没人能独占久了。端的防人恋栈。"
 SUM_Neo_SGS.95.t:"众意所推"
 SUM_Neo_SGS.95.d:"到了交印那天，那位执事把铜印反复擦净，才双手奉上，旁人看了无不叹服。各城的执事不是世袭，也不是上头指派，而是城里人公推的，一任三年，期满不得连任。选举那天众人齐聚议事厅各举所知，票投进陶罐，当众倒出来数；当选者手按经卷立誓尽忠职守。三年一到，干得好歹都得交印换人，有人劝那位干得好的再任一届，他道：「规矩摆着，破不得例。」"
 SUM_Neo_SGS.95.a:"把土地分给部族"
 SUM_Neo_SGS.95.b:"把土地归入官仓"
 SUM_SGS_RB_Limits:"约章限权"
 SUM_SGS_RB_Limits_desc:"在任的官员有两条铁律：一不许经商，二不许占水。这规矩立得极细，想钻空子也难。由此为官的专心办事，不与民争利。"
 SUM_Neo_SGS.96.t:"约章限权"
 SUM_Neo_SGS.96.d:"有个执事自作聪明，把产业挂到亲戚名下，想蒙混过关，照样被查了出来，当场革职。从此做官的都断了发财的念头。原来执事一上任，头一道禁令就横在那儿：不许经商，不许占水。这规矩定得狠，也难钻空子。执事手里有权，若一边当官一边做买卖、一边管水一边霸井，百姓还怎么活？宪章里写得明明白白：在任者不许置办产业，不许承揽工程，不许多占水源；上任之前，得先把自家的田产井渠一一登记上册，任内一概不许再添。"
 SUM_Neo_SGS.96.a:"推举公议的执事"
 SUM_Neo_SGS.96.b:"沿用旧日的长老"
 SUM_SGS_RB_Academy_Dune:"丘上设序"
 SUM_SGS_RB_Academy_Dune_desc:"学馆里头教的尽是实在学问：算术、地理、律例，还教那古沙漠文。这些学问样样能用，少了哪一样过日子都要吃亏。"
 SUM_Neo_SGS.97.t:"丘上设序"
 SUM_Neo_SGS.97.d:"算术、地理、律例、古沙漠文，各城的学馆里教得杂七杂八。执教的先生都是矫论团里学问深的，来听的学生是城里各家的孩子，有钱没钱都一样收，穷苦人家的娃交不起束脩，先生照教不误。算术学的是怎么记账纳税，地理学的是认路找水，律例教人安分守己，古沙漠文则是为了读懂石壁上那些旧字。娃娃们刚开头叫苦连天，学着学着也就入了门。"
 SUM_Neo_SGS.97.a:"让花神的誓约作证"
 SUM_Neo_SGS.97.b:"让官署的法度作证"
 SUM_SGS_RB_Scripture_Open:"经帙听披"
 SUM_SGS_RB_Scripture_Open_desc:"矫论团把经卷抄了许多份分送到各处水驿，这经卷不再锁在深阁，传播开来。识字的众人争相传阅，那经义便如水上波，一圈圈荡将出去。"
 SUM_Neo_SGS.98.t:"经帙听披"
 SUM_Neo_SGS.98.d:"有一回驼队遇上沙暴，人驼都失了，后来在沙里把那几捆经卷寻回来，纸页给沙磨得起了毛，字却还清楚。矫论团把经卷抄了许多份分送各处水驿，抄经是苦差，书吏伏案疾书，一笔一画不敢潦草，常抄到夜深。抄好拿莎草纸裹了，一捆捆送到各水驿供客商阅览；有几处水驿偏远，几年也没人送去，他们便专派驼队跋涉几百里送过去。"
 SUM_Neo_SGS.98.a:"与雨林互通有无"
 SUM_Neo_SGS.98.b:"与雨林划清界限"
 SUM_SGS_RB_Scribe_School:"书吏传业"
 SUM_SGS_RB_Scribe_School_desc:"矫论团最看重的是教人写字这门课。原来在这沙丘地面上，会写字的比会打仗的还稀罕，一个识字的人顶得上半个先生。"
 SUM_Neo_SGS.99.t:"书吏传业"
 SUM_Neo_SGS.99.d:"沙漠里能打仗的随处可见，能提笔写字的却十个里挑不出一个。矫论团因此把习字列为学馆的头等大事，天天都得练。练字的莎草纸金贵，学子们先拿手指在沙盘上划拉，划熟了再往纸上落笔。谁写得快写得好，先生便夸他将来准能抄经办事，众人都信写字能改换门庭。"
 SUM_Neo_SGS.99.a:"把土地分给部族"
 SUM_Neo_SGS.99.b:"把土地归入官仓"
 SUM_SGS_RB_Press_Dune:"录副开肆"
 SUM_SGS_RB_Press_Dune_desc:"抄书坊里把宪章与律例抄了许多份，贴到各处水驿墙上。那告示一贴，过往行人都能看清，谁犯了哪条自己心里有数。"
 SUM_Neo_SGS.100.t:"律榜悬邮"
 SUM_Neo_SGS.100.d:"集市也好、水驿也罢，但凡人多的地方，墙上总贴着宪章律例，白纸黑字一览无余，抄书坊干的就是这桩事。过往客商歇脚一抬头便瞧见，识字的站住细读，看看此地规矩如何；不识字的拉住人念给自己听。隔一阵子抄书坊的人就来换一趟，破损的揭掉重贴。有回有人故意撕了张告示，查出来罚他重抄十份，从此没人再敢乱动。"
 SUM_Neo_SGS.100.a:"推举公议的执事"
 SUM_Neo_SGS.100.b:"沿用旧日的长老"
 SUM_SGS_RB_Script_Study:"审文辨体"
 SUM_SGS_RB_Script_Study_desc:"识得古沙漠文的人凑在一处，把散落在沙里的字一块一块认将回来。这活计费时费力，然而古字一认出，旧事便明了。"
 SUM_Neo_SGS.101.t:"审文辨体"
 SUM_Neo_SGS.101.d:"一块石碑让沙埋了半截，众人挖了整整三日才刨出来，上头的字竟还清晰如初。会古沙漠文的学者凑到一处，要把散落在沙里的字一个个认回来。这文字年头久远，本就没几个人认得，又经风沙侵蚀，多半模糊难辨。学者们背着干粮深入大漠寻访残碑断碣，寻见一处便伏地拂去沙土，一笔一画地辨认，认出一个便欢呼一声，如得至宝。"
 SUM_Neo_SGS.101.a:"让花神的誓约作证"
 SUM_Neo_SGS.101.b:"让官署的法度作证"
 SUM_SGS_RB_Fair_Toll:"榜列赋则"
 SUM_SGS_RB_Fair_Toll_desc:"水驿门口立着一块石碑，上头端端正正刻着税则。该缴多少，自己扳指头便能算清，那些想多收的，再也寻不着空子。"
 SUM_Neo_SGS.102.t:"榜列赋则"
 SUM_Neo_SGS.102.d:"旧时收税，全凭税吏一张嘴，他说三就是三，百姓吃了哑巴亏也没处说理。如今各城把税则凿在石碑上，就立在水驿门口，一驼货抽几文、一桶水纳几钱，明码标价童叟无欺。商队来到碑前，照着上头一算便知该缴多少，分毫不差。偏有税吏想多收的，商队便指着碑文同他理论，那税吏理亏，也只得作罢。"
 SUM_Neo_SGS.102.a:"与雨林互通有无"
 SUM_Neo_SGS.102.b:"与雨林划清界限"
 SUM_SGS_RB_Open_Market:"开市通商"
 SUM_SGS_RB_Open_Market_desc:"集市不分内外，谁来都能做生意。外邦的商队来得比往年多了许多，驼铃叮当从早响到晚，那集市上南腔北调的话都听得见。"
 SUM_Neo_SGS.103.t:"开市通商"
 SUM_Neo_SGS.103.d:"有细心人算过，这一年的税收比往年足足多了三成。公道税则一立，外邦商队又任其往来，各城集市不分内外，一天比一天红火：外邦的香料、玻璃、良马运进来，换走沙漠的盐与药草，账房算盘从早打到晚，灯就没熄过。集市上人挤人，叫卖声、讨价声此起彼伏，矫论团的人看着心里欢喜，知道通商这条路走对了。"
 SUM_Neo_SGS.103.a:"把土地分给部族"
 SUM_Neo_SGS.103.b:"把土地归入官仓"
 SUM_SGS_RB_Trade_House:"诸肆合赀"
 SUM_SGS_RB_Trade_House_desc:"几家大商户合设了一处商行，专营外邦贸易。这行有个规矩：账目公开，谁都能查。由此众人放心，生意越发红火。"
 SUM_Neo_SGS.104.t:"诸肆合赀"
 SUM_Neo_SGS.104.d:"这处商行是几家大商户合伙立的，专做外邦贸易，最与众不同的就是把账摊在明处。起初各家各干各的，互相压价，谁也落不着好，后来干脆合到一处，利益均沾。章程定得细：赚了银子怎么分、赔了本钱怎么摊，白纸黑字写着。每月初一，账本挂到商行门口，路过的人都能瞧两眼。有回一个伙计发现账目对不上，当众指出来，管事的不但不恼，当场就改了。这样一来生意蒸蒸日上，外邦商队也更愿意跟他们往来。"
 SUM_Neo_SGS.104.a:"推举公议的执事"
 SUM_Neo_SGS.104.b:"沿用旧日的长老"
 SUM_SGS_RB_Caravan_Insure:"行商相保"
 SUM_SGS_RB_Caravan_Insure_desc:"商队合出一笔保银，谁在路上出了事照数赔偿。赔了几回之后那沙路反倒太平了。原来保银一亮，劫匪知道无利可图也就散了。"
 SUM_Neo_SGS.105.t:"行商相保"
 SUM_Neo_SGS.105.d:"商队们事后一合计，管这叫花钱买平安。各行商队凑出一笔公银，专备路上不测：沙漠行旅最怕遇劫，一旦出事便倾家荡产，如今有了这笔保银，哪支队伍遭了事就照价赔付。这招果然管用，赔了几回之后，拦路抢劫的反倒见了少，原来匪徒明白抢了也是白抢，货主有保银兜底，自己却要冒被追捕的险，路上因此太平许多。"
 SUM_Neo_SGS.105.a:"让花神的誓约作证"
 SUM_Neo_SGS.105.b:"让官署的法度作证"
 SUM_SGS_RB_Mint_Dune:"炉冶更铸"
 SUM_SGS_RB_Mint_Dune_desc:"开炉铸钱，那钱的边沿上把成色与重量都刻得清清楚楚，谁也短不了分量。商人拿着这钱心里踏实，一文是一文，童叟无欺。"
 SUM_Neo_SGS.106.t:"足陌改铸"
 SUM_Neo_SGS.106.d:"往日用外邦的钱，成色忽高忽低，做买卖常吃亏，沙丘腰带索性自己开炉铸钱。铸钱是桩大事，用的是上等铜，每枚都足斤足两，钱边刻着字，写明成色几何、重几钱几分，眼毒的商人拿手一掂就知真假。开炉头一阵也费了功夫，炉温火候、铜料配比反复试，第一炉出来的不多，慢慢熟练了才够用。"
 SUM_Neo_SGS.106.a:"与雨林互通有无"
 SUM_Neo_SGS.106.b:"与雨林划清界限"
 SUM_SGS_RB_Common_Well:"同汲一泉"
 SUM_SGS_RB_Common_Well_desc:"早年有人拿井水做买卖，如今水驿和水井一律充了公，按人头分，一户一份。先前多占的都得吐出来，井台边再也见不着私设的栅栏。囤水抬价这桩事，从此断了根。"
 SUM_Neo_SGS.107.t:"据井者遁"
 SUM_Neo_SGS.107.d:"从前有豪强霸住水井不许旁人沾，百姓敢怒不敢言。如今各处水驿和井都收归公有，按人头取水，多占的得退回来：井派专人看着，一人一份，谁也不许多拿。原先霸井的那几个起头还不服气，后来见人人都这么办，也就歇了心思。分水时先尽着老人孩子，再轮壮丁，秩序井然，百姓都说水归了公才叫真公道。"
 SUM_Neo_SGS.107.a:"把土地分给部族"
 SUM_Neo_SGS.107.b:"把土地归入官仓"
 SUM_SGS_RB_Agri_Together:"耦耕共田"
 SUM_SGS_RB_Agri_Together_desc:"各城的田合在一处安排轮作，这块种罢种那块，地力便养得住。收成按各人出的工分，多劳多得谁也无话。田头立着木牌，写着各家轮到的次序。"
 SUM_Neo_SGS.108.t:"迭种养土"
 SUM_Neo_SGS.108.d:"田地要养地力，年年种一样的庄稼，地力耗干，收成便一年差过一年；若今年种麦、明年种豆、后年闲着，地力就缓过来了。矫论团里懂农事的人把各城的田统一规划，哪片种什么、何时轮歇，安排得明明白白。收成后按出力多少分配，多劳多得，偷懒的分得少，众人也无话讲，田地越种越肥沃，收成一年高过一年。"
 SUM_Neo_SGS.108.a:"推举公议的执事"
 SUM_Neo_SGS.108.b:"沿用旧日的长老"
 SUM_SGS_RB_Public_Granary:"公廪充牣"
 SUM_SGS_RB_Public_Granary_desc:"碰上丰年，多余的粮食尽数送进公仓；荒年一到，便开仓照平价粜出。仓底铺着石板，又垫一层干苔，挡潮也防鼠。门背后钉着枣椰木削的签子，一行行记着哪年哪部存了多少。这仓囤的是粮食，守的是大伙儿的命。"
 SUM_Neo_SGS.109.t:"义廪三储"
 SUM_Neo_SGS.109.d:"矫论团定下规矩：丰年百姓把吃不完的粮缴进公仓，交专人保管；荒年便开仓，平价把粮粜给百姓，不准囤积居奇。这仓里存的不只粮食，还有盐、有药、有救灾用的毛毡。有一年大旱，地里颗粒无收，全靠这公仓接济，一城的人才熬过难关，百姓感念，都说这公仓是救命的。"
 SUM_Neo_SGS.109.a:"让花神的誓约作证"
 SUM_Neo_SGS.109.b:"让官署的法度作证"
 SUM_SGS_RB_Mutual_Aid:"众相扶救"
 SUM_SGS_RB_Mutual_Aid_desc:"谁家遭了难，城里就拨钱拨粮过去，粮食直接从公仓里取。商队在道上出事、村落遇上灾害，都有人管。邻里之间，原就该这么互相扶一把。"
 SUM_Neo_SGS.110.t:"遭难见援"
 SUM_Neo_SGS.110.d:"有一回一支商队被劫，人货俱失，城里拨了银两粮食助他们重整旗鼓；那受灾的村子也得了接济，不至于流离失所。出事的商队、受灾的村子，都由城里出钱出粮接济，这规矩厚道，遭了难不用独自撑着。沙漠里祸事说来就来，一家一户哪里禁得起？如今城里设了救济的款项，谁家遭难报与官府，便有钱粮送来，众人都说这沙丘腰带有人情。"
 SUM_Neo_SGS.110.a:"与雨林互通有无"
 SUM_Neo_SGS.110.b:"与雨林划清界限"
 SUM_SGS_RB_Craft_Common:"匠户云集"
 SUM_SGS_RB_Craft_Common_desc:"铁匠与制盐的匠人合在一处做工，工钱按件计算，多劳多得，工具却归公家。由此匠人们专心做工，不计较家什。"
 SUM_Neo_SGS.111.t:"匠户云集"
 SUM_Neo_SGS.111.d:"叮叮当当的敲打声从早响到晚，这处作坊是矫论团把铁匠和制盐的编到一处成的。铁匠打的是锄头刀具，盐工晒的是盐巴，都是百姓天天离不得的东西。工钱按件计，打一把锄头给几文，晒一斗盐给几文，多劳便多得。只是工具一概归公，谁也不许私藏。为啥这么定？工具若落在私人手里，保不齐有人囤起来抬价，旁人想做工都寻不着家伙。如今要用就去领，用完送回原处，大家都说这样公道。"
 SUM_Neo_SGS.111.a:"把土地分给部族"
 SUM_Neo_SGS.111.b:"把土地归入官仓"
 SUM_SGS_RB_Home_Guard:"募乡里丁"
 SUM_SGS_RB_Home_Guard_desc:"种地的汉子，农闲时就操练刀枪。各城按丁口抽人编成乡兵，兵器都存在库房里，到了农闲才取出来练。平日里握锄头，一有战事便挎钢刀，种田与练兵两样都不耽误。"
 SUM_Neo_SGS.112.t:"按籍点丁"
 SUM_Neo_SGS.112.d:"号令一下，半日之间乡兵便在关前聚齐，给来犯的敌军来了个措手不及。自此人人都晓得，这乡兵能打仗。原来沙丘腰带地广人稀，养不起一大群常年吃粮的兵，就想出这个法子：每户抽一个丁编成乡兵，平日荷锄种田，一旦有警便撂下农具、抄起刀枪。他们定期操练，拉弓、使刀、列阵样样不落，农忙时是庄稼汉，号角一响就成了兵。"
 SUM_Neo_SGS.112.a:"推举公议的执事"
 SUM_Neo_SGS.112.b:"沿用旧日的长老"
 SUM_SGS_RB_Watch_Dune:"筑台瞭望"
 SUM_SGS_RB_Watch_Dune_desc:"商道旁立起一座座望楼，白天举旗，夜里举火，专人守望着。一有动静信号便一路传开，那旗火一处接着一处，能传出十几里远。"
 SUM_Neo_SGS.113.t:"登陴望敌"
 SUM_Neo_SGS.113.d:"沙漠里赶路最怕撞上劫匪，高处若能有人瞭望，便能提早察觉。商道旁于是立起一座座望楼，筑在高处，白天举旗夜里举火，用旗色火光传消息：见敌情举红旗，一路太平举白旗，商队远远望见就知前路吉凶。有一伙劫匪藏在沙谷里，望楼上的人瞧见当即举火示警，商队得以绕道避开。"
 SUM_Neo_SGS.113.a:"让花神的誓约作证"
 SUM_Neo_SGS.113.b:"让官署的法度作证"
 SUM_SGS_RB_Route_Patrol:"护彼行商"
 SUM_SGS_RB_Route_Patrol_desc:"有一队人马专管巡视沙道、护送商队，遇上劫匪便追将上去。有这队人马在商队走路便踏实，众人马日日巡行，沙道上少见劫匪的影子。"
 SUM_Neo_SGS.114.t:"遭掠疾驰"
 SUM_Neo_SGS.114.d:"自从那回吃了亏，沙道上的劫匪轻易不敢再露面。那是护商队追出三十里的结果。这支护商队是从风沙连里抽出来的，专司护送往来商队，骑着马在沙道上巡弋，一会儿前一会儿后，总贴着车队不走远。哪里撞上劫匪，他们拍马就追，拿不住人不撒手。那回一伙贼人抢了商队的骆驼，他们一路紧追，末了在一座沙丘背后合围，连人带赃一齐拿住。商队见他们这般可靠，都愿意把身家托付，请他们护送。"
 SUM_Neo_SGS.114.a:"与雨林互通有无"
 SUM_Neo_SGS.114.b:"与雨林划清界限"
 SUM_SGS_RB_Peace_Hall:"置诘盗署"
 SUM_SGS_RB_Peace_Hall_desc:"治安署的差事由本处人充任，无非是偷盗抢劫这些事。署里备一副木枷、一面锣，锣一响街坊都出来看。本地人管本地事，情形熟办得快，巷口贴的告示也是书吏一笔一笔写的。"
 SUM_Neo_SGS.115.t:"熟案善办"
 SUM_Neo_SGS.115.d:"办案须有旁人作证，不许一人独断，判完还得在署门口贴一张告示，这是各城治安署后来添下的规矩。原来署里的差役都从本地人里挑，专管偷抢，图的是一方安宁。本地人熟门熟路，谁家本分、谁家耍赖心里有数，办起案来省力。有回城里丢了东西，差役顺着集市一路访查，不多时就在骆驼贩子的驮子里搜出了赃物。可这法子也有短处：差役若徇私、袒护亲友，就难以秉公。是以才立下作证、张贴告示这一条，好叫众人监督。"
 SUM_Neo_SGS.115.a:"把土地分给部族"
 SUM_Neo_SGS.115.b:"把土地归入官仓"
 SUM_SGS_RB_Water_Militia:"泉上戍卒"
 SUM_SGS_RB_Water_Militia_desc:"泉眼和商道，都有人昼夜看着。各水驿都派了守泉的兵，一班接一班从没断过人。有这批人守在那儿，水源不出岔子，往来的商队也放心。"
 SUM_Neo_SGS.116.t:"护泉即衢"
 SUM_Neo_SGS.116.d:"「引泉水浇自家的田，想都别想。」守泉兵把那伙人拿住，勒令他们填平沟渠才作罢。水驿各处都设了守泉的兵，守的是泉，其实也是路。原来沙漠里的泉水多半傍着商道，泉守住了，路便守住了；泉若被人下了药、或是霸了去，商队就没法前行，商路也就断了。是以守泉兵日夜在泉边巡查，不许人搅浑、不许人私占。经了这一遭，那泉水清清亮亮，长流不断。"
 SUM_Neo_SGS.116.a:"推举公议的执事"
 SUM_Neo_SGS.116.b:"沿用旧日的长老"
 SUM_SGS_RB_Neutral_Pact:"守中之盟"
 SUM_SGS_RB_Neutral_Pact_desc:"沙丘对四邻居约法三章：不结盟、不让外兵驻扎、不接济交战的任何一方。条约誊了三份，四邻各拿一份收好。两边都把规矩守得稳当，沙丘也就保全了自己。"
 SUM_Neo_SGS.117.t:"守中之盟"
 SUM_Neo_SGS.117.d:"立约那天四邻使者都到了，歃血为盟各执一份。沙丘腰带跟四邻立的约，写明三桩：头一桩不结盟，不掺和远处的争斗；第二桩不驻外兵，不许别国兵马踏进沙丘；第三桩不供粮于战，谁打仗都不给一方送粮。这三条约法周全，把中立守得牢牢的，四邻也摸清了这里的规矩不敢轻犯。后来邻邦开战，两边都想拉沙丘入伙，沙丘只把约书往出一亮便回绝了，谁也没能说动。"
 SUM_Neo_SGS.117.a:"让花神的誓约作证"
 SUM_Neo_SGS.117.b:"让官署的法度作证"
 SUM_SGS_RB_Trade_Treaty:"互市之盟"
 SUM_SGS_RB_Trade_Treaty_desc:"和外邦做买卖，也有约在先：税怎么征、外来的客商怎么护，条条款款都写得清楚。约文刻在集市的石壁上，谁都能凑过去读一读。规矩摆在明处，商道通畅，争执也跟着少了。"
 SUM_Neo_SGS.118.t:"互市之盟"
 SUM_Neo_SGS.118.d:"与外邦做买卖，最怕遇上说不清的纠纷：货被扣了、人被欺了，若没个约在先，连理论的地方都找不着。沙丘腰带因此与外邦通商也立了约，把税则怎么定、护侨怎么办，一桩桩白纸黑字载明。税则照碑上刻的来，不许随意加征；外邦商旅在此地也得好生保护，不许欺凌；谁违了约，便按约追究。约一立成，外邦商队来得更多，生意越发兴旺。"
 SUM_Neo_SGS.118.a:"与雨林互通有无"
 SUM_Neo_SGS.118.b:"与雨林划清界限"
 SUM_SGS_RB_Border_Talk:"对案定疆"
 SUM_SGS_RB_Border_Talk_desc:"与雨林谈地界，一里一里地慢慢谈。哪里谈不拢便先搁将起来，谈成一里便算一里，积少成多。那些谈妥的地界都立了石碑为记。"
 SUM_Neo_SGS.119.t:"对案定疆"
 SUM_Neo_SGS.119.d:"「改日再议。」雨林使者把舆图一卷，转身要走。这片交界之地，沙丘和雨林各执一词，都说归自己，可谁也拿不出凭证。两边便各挑了能言善辩的人，带一卷旧舆图，到沙边绿洲坐下细谈。丈量地界是个磨人的活计，一段一段量、一寸一寸争，量罢还要掘旧碑、翻旧案、斗口才。那使者口才极佳，指着一条早干的旧河床，道是祖上引来的水；沙丘老者则祭出一块风沙啃过的界石，说上面的字还辨得出。两人从晌午辩到日头偏西，唇焦舌燥，谁也压不倒谁。使者见无隙可乘，便收了舆图；沙丘这边也顺势起身，翻身上马。临行两边说定，等来年开春，各备新证，再坐到一处慢慢理论。"
 SUM_Neo_SGS.119.a:"把土地分给部族"
 SUM_Neo_SGS.119.b:"把土地归入官仓"
 SUM_SGS_RB_Keep_Old:"悉依旧例"
 SUM_SGS_RB_Keep_Old_desc:"矫论团的旧例能留的尽数留下，只是多添了一层公议的过场。凡事拿出来大家议一议，议时把旧例与经卷并排摊着。旧例不失，新意也添。"
 SUM_Neo_SGS.120.t:"悉依旧例"
 SUM_Neo_SGS.120.d:"「规矩没变，无非多一道当众议论的手续，好让大伙儿心里服气。」主事老者捋着胡子笑道。矫论团办事向来有老章程，走哪条路、说哪句话都照成例。这回商议改章，众人以为要翻天覆地，谁知老者说旧例能留的都留，只在上面添一层公议：大家围成一圈，把一件事摊开来你一言我一语讲明白，再举手定夺。立时有人不服，说从前一句经卷就能断的事如今偏要当众絮叨。众人半信半疑试了两桩，议论归议论，最后办的还是老规矩，可每张脸上都多了几分舒坦。从此凡遇大事先议论后拍板，嘴上多费些，怨言倒少了。"
 SUM_Neo_SGS.120.a:"推举公议的执事"
 SUM_Neo_SGS.120.b:"沿用旧日的长老"
 SUM_SGS_RB_Quiet_Grow:"聊以守成"
 SUM_SGS_RB_Quiet_Grow_desc:"沙丘的规矩端在一个稳字。不折腾，不扩张，安安生生把眼下的日子过稳当。不求轰轰烈烈，只求细水长流。这些年少了许多惊吓。"
 SUM_Neo_SGS.121.t:"优游卒岁"
 SUM_Neo_SGS.121.d:"主事者指着城外那片刚下种的麦田道：「你但见这田，才下种不多时，若此刻又去动刀兵，谁来收割？」沙丘腰带这些年折腾怕了，今日兴兵明日改制，闹得百姓不得安生，这一回痛定思痛，立下主意：不折腾、不扩张，只把眼下的日子过稳当。当下有好事的少年跃跃欲试，要练兵拓土建一番功业，主事者只是摇头。他又道：「井里的水刚够吃，商道刚通，学馆刚开，哪一样经得起折腾？不如安分守己把日子过扎实。」众人听了方才把那颗躁动的心按下，从此沙丘腰带少了许多声响，百姓倒落个清静。"
 SUM_Neo_SGS.121.a:"让花神的誓约作证"
 SUM_Neo_SGS.121.b:"让官署的法度作证"
 SUM_SGS_RB_Scholar_Republic:"诸生共政"
 SUM_SGS_RB_Scholar_Republic_desc:"沙丘城邦各自立了宪章：执事由众人公推，律例由大家共议，学馆里教的是算术与古文字。矫论团的经义至此才算落了地，成了人人能过日子的规矩。"
 SUM_Neo_SGS.122.t:"诸生共政"
 SUM_Neo_SGS.122.d:"那老学究后来常往学馆跑，看娃娃们拨算珠、描古字，脸上渐渐有了笑。头些日子他可不是这般模样，那时节直摇头，嫌新规矩俗气。沙丘腰带各城这回都立了宪章，把章程一条条刻上石板；执事不再由一家一姓把持，改由众人公推；律例也不兴一人拍板，改成大伙儿共议。宪章写得朴实，没那些花哨辞藻，净讲实在事。学馆也重开了，教的不再是空泛玄谈，换成算术和古文字。矫论团那套经义，从前高搁在经卷里够不着，如今落了地，成了能纳粮、能断案、能过日子的章程。老学究起先嫌俗，后来看市面安稳、诉讼清楚，也就悄悄点了头。"
 SUM_Neo_SGS.122.a:"与雨林互通有无"
 SUM_Neo_SGS.122.b:"与雨林划清界限"
 SUM_SGS_RB_Dune_Commune:"丘地入官"
 SUM_SGS_RB_Dune_Commune_desc:"水驿与井都归了公，田合在一处轮作，收成按工分；匠户也聚在一处做工，工具归公。矫论团道，这正是经卷里写的那个样子。"
 SUM_Neo_SGS.123.t:"丘地入官"
 SUM_Neo_SGS.123.d:"「我用了半辈子的锤子，凭啥说收就收？」那天有人抱着铁锤堵在议事厅门口不肯挪步。可如今，再没人提这茬了。原来沙丘腰带立了新章法：头一条，水驿和井都归了公家，从前浇地要掏钱买水，如今扁担一挑就来。第二条，各家零碎的田并成大片轮着种，头年麦子次年豆，地力养得住；分粮也不看谁家田多，单看谁下的力气大。第三条，散在四处的匠人挪到一处做工，打铁的、烧陶的、做木活的紧挨着，连锤子、窑、刨子都上了公账，要用就去领。这套章法是矫论团从旧经卷里翻出来的，讲究公田公井、众人合力、按劳取粮。刚立章程那阵怨声载道，等秋后一算，田里收成不薄，活儿也做得飞快，那些抱怨自然就散了。"
 SUM_Neo_SGS.123.a:"把土地分给部族"
 SUM_Neo_SGS.123.b:"把土地归入官仓"

 #### 丙线 · 沙王正统 ####
 SUM_SGS_RC_The_Legacy_of_the_Sand_Kings:"循沙王旧"
 SUM_SGS_RC_The_Legacy_of_the_Sand_Kings_desc:"第三条路翻的是更旧的一笔账。沙丘腰带曾是赤王治下的一环，圣显厅里还存着当年的法度。有人主张把这份旧法请将回来，用它管今日的沙。"
 SUM_Neo_SGS.124.t:"循沙王旧"
 SUM_Neo_SGS.124.d:"「诸位先看看石上写的字，再争不迟。」那学者把残碑往案上一撂，满堂的争吵便顿了一顿。沙丘腰带议革新，摆在前头的本有两条路：一条就着旧例修修补补，一条照雨林的样子彻底改换。哪知半路有人翻出第三条，竟是更陈的一本旧账。这账陈到哪一步？千百年前沙丘腰带原是赤王治下的一环，那会儿圣显厅存着成套法度，刻在石板上、埋进黄沙里。有个好古的学者从沙里刨出几块残碑，捧着跑进议事厅，说法度有根有据，何不请回来用旧制管今日的沙。话一落地，满堂像开了锅：赞的说古法经得起岁月，驳的说世道变了、老办法不顶用，两下里争得不可开交。"
 SUM_Neo_SGS.124.a:"重立赤王的旧制"
 SUM_Neo_SGS.124.b:"重建城邦的议会"
 SUM_SGS_RC_Trace_Line:"稽沙王绪"
 SUM_SGS_RC_Trace_Line_desc:"沙丘历代的主事者众人从头理了一遍，竟只剩下一个名字：赤王。千条万条归到一处，源头在此。那名字刻在石板最上头，谁也不敢再添一笔。"
 SUM_Neo_SGS.125.t:"稽沙王绪"
 SUM_Neo_SGS.125.d:"「赤王。」年长学者念出这两个字，厅内登时静得没一点声响。那班主张复古的人，为把旧制的根子刨出来，索性将沙丘腰带历代主事者从头查起：残碑断碣一块块去拓，白须老者一户户去问，得来的名字都誊在纸上，近世的排在前头，中古的接在后头，再一代代往前追。这一查不要紧，越往前名字越稀，到后来几百年间竟只落得寥寥几个，追到最上头，纸上便孤零零剩了一个。众人围着那张纸看了半晌，谁也没作声。原来千百年来这片沙海的主事者换了一茬又一茬，追根究底，竟都归到赤王一人身上。有几个年轻气盛的本想争辩，这时也张了张嘴，把话咽了回去。众人把这三个字工工整整誊在纸上，供在案头，仿佛寻着了主心骨。"
 SUM_Neo_SGS.125.a:"召集能战之众"
 SUM_Neo_SGS.125.b:"召集能谋之士"
 SUM_SGS_RC_Claim_Legacy:"袭其旧章"
 SUM_SGS_RC_Claim_Legacy_desc:"沙丘腰带抬出赤王留下的旧制，说自己正是它的传人。这么一讲，规矩有了出处，名分也定了下来。众人认下这笔传承，再没人骂他们是没根没底的沙寇。"
 SUM_Neo_SGS.126.t:"袭其旧章"
 SUM_Neo_SGS.126.d:"「这就叫有凭，这就叫有源。」学者把石板上的字逐句念出，又将历代主事者的名单一摊。考古那班人既然理出了赤王这名头，腰杆便硬了，当众宣扬沙丘腰带承的是赤王遗制，法度有凭、名分有源。他们手里握着几块从圣显厅旧址挖来的石板，上面刻着古字，虽残缺，那规制礼数还辨得出，于是在集市、议事厅里逢人便说。听的人有信有不信，追问这法度打哪来，学者便这般回答。偏有个好事少年反问：既是有凭有源，这些年怎么又丢了？学者一愣，随即答道丢了归丢了，根子终归还在。"
 SUM_Neo_SGS.126.a:"以神权号令沙漠"
 SUM_Neo_SGS.126.b:"以律法约束诸城"
 SUM_SGS_RC_Court_Back:"朝仪再造"
 SUM_SGS_RC_Court_Back_desc:"朝堂上的规矩重新定过，站班的次序人人清楚。台阶换上新凿的石板，一级一级分得明白；阶前两列月莲开得齐整，没人敢乱踩。尊卑一排定，各人便守着各人的位置。"
 SUM_Neo_SGS.127.t:"复举赤王祀"
 SUM_Neo_SGS.127.d:"规矩一立，人心反倒安定了，这倒是主事者当初没想到的。沙丘腰带既打出承赤王遗制的旗号，那套朝仪自然要重新立起来。所谓朝仪，说到底就是一套定规：谁立在何处、谁坐第几位、谁先开腔谁后开腔，样样都有讲究，半点错不得。起初众人嫌它繁琐，为站个位置也要争，谁都不肯落在旁人后头。主事者却不慌，只让人把规矩一条条刻在木牌上，挂到议事厅门口，每日照着牌子站班。时日一久，奇事便来了：先前为座次争得脸红脖子粗的，如今各归各位，也不觉着委屈；新来的后生站错了地方，自己先就觉得别扭。原来人心深处都有一杆秤，有了定规，这秤才有了准星，谁高谁低一目了然，反倒省下无数口舌。"
 SUM_Neo_SGS.127.a:"把遗迹挖开"
 SUM_Neo_SGS.127.b:"把遗迹封回去"
 SUM_SGS_RC_Narrow_Council:"删繁议政"
 SUM_SGS_RC_Narrow_Council_desc:"议事的位子，从几十张砍到九张。厅里换了条长案，九把椅子排成一溜，案上搁九只陶杯，连倒水的都少跑许多路。拿主意的人精简了，扯皮的事也就跟着少。"
 SUM_Neo_SGS.128.t:"存九去余"
 SUM_Neo_SGS.128.d:"那几十张旧椅子被人一张张抬出议事厅时，有人心里老大不乐意。这是主事者下的令：议政的位子只留九个，坐的都是各城阅历最深、办事最稳的九位，其余人一律退到阶下站着听。从前这厅里乌泱泱坐着几十号人，七嘴八舌，一桩小官能吵上三天也没个结果。椅子一撤，毛病立时就好了：能开口定事的少了，事情反倒办得快。往日吵三天的，如今一炷香便定下章程；往日你推我诿的，如今九人一拍板，众人便分头去办。起初丢了座位的那些人满腹牢骚，后来见事情办得利索、城里日子也宽裕，气也就消了。这九把交椅看着寻常，沙丘重立的朝仪，全凭它们撑起。"
 SUM_Neo_SGS.128.a:"重立赤王的旧制"
 SUM_Neo_SGS.128.b:"重建城邦的议会"
 SUM_SGS_RC_Law_Old:"旧章毋改"
 SUM_SGS_RC_Law_Old_desc:"以圣显厅的旧法为纲，凡是新立的条令一律照着旧法来解释。新法旧法一脉相承，不乱。那旧法一字未改。"
 SUM_Neo_SGS.129.t:"旧章毋改"
 SUM_Neo_SGS.129.d:"圣显厅本是赤王旧时居处，厅里藏着一部古法，字句深奥。新条令到底怎么来的？原来主事者立过一条铁规矩：往后凡有新规，一律拿圣显厅的旧法作纲，新条怎么讲都得依着旧法去解，不能自己另说一套。这规矩看着平淡，实则是把新法的根死死扎进了旧法里。曾有个脑子活泛的想在添新条时夹带私货，把一处空档改成自家的便宜，哪知主事者翻开旧法逐字一比，他那点小花招当场就露了馅。众人由此懂得，新条不是能随便捏的面团，得照着旧法的模子一点点刻出来。有几回争得难分难解，大伙儿干脆跑进圣显厅，对着旧法一字一句地抠，抠透了再回来办事。"
 SUM_Neo_SGS.129.a:"召集能战之众"
 SUM_Neo_SGS.129.b:"召集能谋之士"
 SUM_SGS_RC_Army_One:"纠众成旅"
 SUM_SGS_RC_Army_One_desc:"护路的、守泉的、各城的乡兵三下里合编，成了一支大军，旗号统一，粮饷也统一。发下的号衣一个颜色，肩上缝同一条纹。走在道上像一条线，再不是各顾各的散兵。"
 SUM_Neo_SGS.130.t:"纠众成旅"
 SUM_Neo_SGS.130.d:"沙丘腰带从此有了真正属于自己的一支军，这让主事者松了口气。要知道从前这里地盘宽广、商道四通八达，护路的、守泉的、各城乡兵向来各管各的，各认各的旗号，遇事谁也不服谁。这回主事者把积弊一扫，下令三路人马统统编进一支军：旗号画成一样，粮饷也从一处统一发放。从前护路的撞见守泉的，各认各旗；如今同是一军、同旗、同一本粮册，调度起来顺顺当当。有老兵起初不乐意，说跟了旧主子多年，怎的忽然改换门庭；可领了新粮饷、吃了几顿饱饭，又见打仗时彼此照应，也就安心了。旗号粮饷一归拢，各怀心思的隐患也就除了。"
 SUM_Neo_SGS.130.a:"以神权号令沙漠"
 SUM_Neo_SGS.130.b:"以律法约束诸城"
 SUM_SGS_RC_Staff:"开军师幕"
 SUM_SGS_RC_Staff_desc:"出主意的不带兵，带兵的不出主意，两下分得清清楚楚。军师府只管谋划和粮草转运，手里那块木牌烙着个粮字，凭它调粮，却调不动一兵一卒。各人守着各人的职分，谁也不去管别人的事。"
 SUM_Neo_SGS.131.t:"开军师幕"
 SUM_Neo_SGS.131.d:"带兵的将官曾憋着一肚子气：自己出生入死，偏偏要听几个对着沙盘指指点点的人调度。可几番仗打下来，靠军师府算准粮道、掐准时机，连连得手，这位大将才真正服了气。沙丘腰带既立了军，少不得要设个运筹的所在，这便是军师府。它规矩古怪：只管谋划和粮道，从不直接领兵。主事者深知一个道理，带兵的若又抓谋划，权柄太重，日子久了怕尾大不掉，于是立章程把两样生生拆开。府里坐着几位足智多谋的，日日对着沙盘演算，算粮、算路、算天时、算人心，谋定一策便交给带兵的去施行。冲锋陷阵是一头的事，运筹帷幄是另一头的事，彼此配合，又彼此牵制。"
 SUM_Neo_SGS.131.a:"把遗迹挖开"
 SUM_Neo_SGS.131.b:"把遗迹封回去"
 SUM_SGS_RC_Garrison_All:"随地设戍"
 SUM_SGS_RC_Garrison_All_desc:"沿着商道和绿洲，一处接一处设了戍所，每条街都有岗哨，灯火亮一整宿。宵禁的规矩又严，没人敢夜里乱走，街上到了晚上反倒冷清。"
 SUM_Neo_SGS.132.t:"随地设戍"
 SUM_Neo_SGS.132.d:"沙道上入了夜，只剩风卷黄沙的声响，赶路的影子都见不着一个。说也奇怪，戍所越设得多，夜里赶路的反倒绝了迹。原来沙丘腰带为护商道，在沿途与绿洲处处立戍所，几乎是街街设岗、镇镇驻兵。这戍所不过是夯土垒起的小堡，插一面旗，驻三五个兵丁，专管盘查往来的人。早先这沙海上商道辽阔、盗匪横行，行商夜里赶路无不提心吊胆。如今一处接一处的戍所灯火遥遥相望，按理该更太平。可那些趁着夜色偷运私货、逃税躲役的，被盘查断了财路，索性改在白日走大道；安分的行商也图白天安稳，不肯再摸黑。守堡的兵丁裹着皮袄倚在土墙上，连着几夜不见人影，倒也乐得清闲。"
 SUM_Neo_SGS.132.a:"重立赤王的旧制"
 SUM_Neo_SGS.132.b:"重建城邦的议会"
 SUM_SGS_RC_Conscript:"立调丁法"
 SUM_SGS_RC_Conscript_desc:"凡是成丁的男丁都有服役的责任，服役期满便放回家乡，还发给路引，一纸薄薄的凭据。服役的期限写得明白，到期便放还乡，不许留难。"
 SUM_Neo_SGS.133.t:"丁壮尽隶"
 SUM_Neo_SGS.133.d:"征令一下，各城都忙着登记成丁的男子，连富贵人家的公子也逃不掉。沙丘腰带立了新军，兵员从哪来？规矩写得明白：凡是成丁，都有服役的责任，到了年头就得应征。这差事不是终身的，期满便能回家，时限也不长，够学会护路守泉的本事、跟着队伍走上几趟商道便是。从前那些富家子弟哪肯吃这份苦，如今也得编进队伍，跟穷人家的孩子一起操练。开头叫苦连天，晒脱了皮、磨破了脚，可熬过一阵，倒练出一副好筋骨。服役期满那天，主事者亲自发下归家文书，众人欢欢喜喜回家务农经商；有几个在军里待出交情的，临走还三步一回头。这法子既尽了义务，又不误农时，着实两全。"
 SUM_Neo_SGS.133.a:"召集能战之众"
 SUM_Neo_SGS.133.b:"召集能谋之士"
 SUM_SGS_RC_Purge:"简阅行伍"
 SUM_SGS_RC_Purge_desc:"军中那几支不听话的兵马被清理了出去，竟一个字也没有。说清就清，全凭上头一句话。那几支兵马就此散在各处，再不成军。"
 SUM_Neo_SGS.134.t:"汰去无状"
 SUM_Neo_SGS.134.d:"那几支被请回原籍的人马，临走连一张罪状都没拿到。主事者不愿把事情闹大，更不想落个清洗的恶名，只推说军中要精简，这几支不合新编，请回老家便是。沙丘腰带新军刚立，人马虽多却杂，有几支向来不服号令，仗着人多各霸一方。主事者决意整顿，这才有了这蹊跷的处置。那几支的首领起初暴跳如雷，嚷着要讨个说法，可静下心想，自己平日确实不听调遣，如今军令森严，赖着不走只怕更没好处，便悻悻去了。旁人瞧着虽觉蹊跷，也没谁深究。打这以后，军中再没那等桀骜的，号令一出，莫不依从。这般不声不响的手段，比明刀明枪更叫人心里发毛，从此没人再敢逞强。"
 SUM_Neo_SGS.134.a:"以神权号令沙漠"
 SUM_Neo_SGS.134.b:"以律法约束诸城"
 SUM_SGS_RC_Open_Hall:"圣显厅重启"
 SUM_SGS_RC_Open_Hall_desc:"圣显厅重新开了门，为的是取里头的法度，还有那些构装。构装一旦披甲执刃，刀枪都砍不进去，只是一旦损坏，修起来颇费工夫。"
 SUM_Neo_SGS.135.t:"圣显厅重启"
 SUM_Neo_SGS.135.d:"那扇沉重的石门被推开时，里头积沙厚厚一层，蛛网到处牵连，荒凉得叫人心里发怵。沙丘腰带既然要复古，这座废弃多年的圣显厅便非重开不可。众人随主事者拂开积沙、跨进门里，先就被眼前的物件镇住了：一根根立柱、一尊尊石像，都是赤王当年留下的构装，机括精巧，非寻常物事。他们先取墙上刻的法度，逐字逐句誊在纸上；随后又去看那些石像，试着拨弄机括。哪知一尊石像竟慢慢抬起手臂，众人吓得连连倒退。原来这圣显厅里值得取的，不光是纸上的法度，还有这些能走能动的构装。有个胆大的工匠绕着石像转了一圈又一圈，啧啧称奇，说这般巧夺天工的东西若归了自己，胜过千军万马。"
 SUM_Neo_SGS.135.a:"把遗迹挖开"
 SUM_Neo_SGS.135.b:"把遗迹封回去"
 SUM_SGS_RC_Mech_Hall:"堂中陈械"
 SUM_SGS_RC_Mech_Hall_desc:"厅里的构装修好之后竟能走能动，再把兵器往上一装，便成了一队不知疲倦的兵。不吃不喝，昼夜能战，从不言苦，端的省了许多兵马。"
 SUM_Neo_SGS.136.t:"堂中陈械"
 SUM_Neo_SGS.136.d:"校场边上，一个老兵看直了眼，半晌才憋出一句：打了半辈子仗，没见过这样的兵。那些石头人列着队立在日头底下，一站一整天，纹丝不动，连滴汗都不淌。这是圣显厅里修好的构装。工匠费尽心力把它们复原，石人内藏机关，竟能迈步挥臂，昼夜不知疲倦。有个匠人递给一尊构装一柄长戈，那石头人便舞将起来，戈影翻飞，虎虎生风，看的人眼花缭乱。主事者大喜过望，当即传令照办，把厅中构装尽数披甲执兵，列成队伍。这队伍的妙处旁人想不到：不必喂粮，不用歇息，更不叫苦；砍上去的刀如同挠痒，射上去的箭迸出火星。沙丘腰带凭空添出一支不知疲乏的兵马，真是奇景。"
 SUM_Neo_SGS.136.a:"重立赤王的旧制"
 SUM_Neo_SGS.136.b:"重建城邦的议会"
 SUM_SGS_RC_Mech_Smith:"设构作局"
 SUM_SGS_RC_Mech_Smith_desc:"专设了一处工坊修补那些构装，匠人是从外邦雇来的，图纸却锁在柜里。匠人只管做，不知其所以然。那工坊门户严谨，防得很紧。"
 SUM_Neo_SGS.137.t:"设构作局"
 SUM_Neo_SGS.137.d:"构装是石头拼的，年头一久便爱散架，主事者便专设一处工坊来修。修这些机关的本事，本地匠人没一个通晓，只好拿重金去外邦雇人。外邦工匠进了坊，天天对着石人拆开又装好、装好又拆开，忙个不停。主事者对他们却防得死死的：修构装的图纸一律锁进柜子，钥匙自己收着，匠人要用得当面来领，用完立刻交回，半张也不许带出坊去。有匠人心里不痛快，暗想我替你卖力气，连张图纸都信不过？可转念一想工钱给得足，也就忍了。修出来的构装一台比一台利落，主事者嘴上没话，心里却也服气。"
 SUM_Neo_SGS.137.a:"召集能战之众"
 SUM_Neo_SGS.137.b:"召集能谋之士"
 SUM_SGS_RC_Great_Works:"大兴版筑"
 SUM_SGS_RC_Great_Works_desc:"圣显厅旁新起了一片宫室，竟是从旧遗迹上拆下来的。旧砖新用倒也气派，只是那些旧石料拆一处便少一处。"
 SUM_Neo_SGS.138.t:"毁墟起殿"
 SUM_Neo_SGS.138.d:"一根刻着古纹的石柱轰然倒地，尘土飞扬，旁边看的人都默不作声。为了显出复古的气象，沙丘腰带要盖几座像样的宫室，地址就选在圣显厅旁的一片空地上。石料从哪来？主事者没让人去远处采买，倒盯上了附近的旧遗迹。那些遗迹荒废多年，野草长得比人高，早没人过问，拆来正好。匠人们扛着锤凿赶过去，拣那完好的石块一点点凿下来，装车拉回工地。有见识深的老者直摇头：拆祖宗留下的东西盖自家的房，只怕不吉利。主事者的说法是，遗迹搁着也是搁着，与其任风沙慢慢啃蚀，不如拆来派上用场。众人嘴上应着，眼见石柱一根根倒下，心里终究不是个滋味。"
 SUM_Neo_SGS.138.a:"以神权号令沙漠"
 SUM_Neo_SGS.138.b:"以律法约束诸城"
 SUM_SGS_RC_Slab_Script:"审石辨文"
 SUM_SGS_RC_Slab_Script_desc:"召集识字的人来释读那些石板，多的是旧规矩、旧账目，是翻老账。那些陈年旧事一朝重见天日，翻将出来叫人咋舌。"
 SUM_Neo_SGS.139.t:"审石辨文"
 SUM_Neo_SGS.139.d:"识得古字的人本就没几个，如今从圣显厅和旧遗迹里起出成堆的石板，上头刻满了字，却没人读得懂。主事者便贴出榜文，召天下识字的人前来辨读。这活儿着实费神：石上的字古奥不说，有的缺了半边，有的让风沙磨得没了棱角，只能一笔一划地猜、一点一点地认。四方的学者应召而来，围着石板坐成一圈，你一言我一语地推敲。读出来的倒都是实在东西，尽是些旧规矩、陈年账：哪年哪月进了多少粮、哪块地归哪户人家、犯了事该罚几何。有人本盼着能读出什么惊天动地的秘密，未免扫兴；可也有心细的，从一笔旧账里瞧出了先民过日子的光景，连声道奇。这些旧规旧账瞧着零碎，却让沙丘人第一次看明白，先人是怎样在这片沙海上安身立命的。"
 SUM_Neo_SGS.139.a:"把遗迹挖开"
 SUM_Neo_SGS.139.b:"把遗迹封回去"
 SUM_SGS_RC_Priest_Order:"序定祀班"
 SUM_SGS_RC_Priest_Order_desc:"祭司上任有先来后到，次序是官府排的，一笔一笔记在名册上。受职当日殿前烧起一炉香，香灰轻轻落在册页上。神还是那位神，侍奉的人却换了一批新面孔。"
 SUM_Neo_SGS.140.t:"序定祀班"
 SUM_Neo_SGS.140.d:"神灵还是那批旧神，香火照旧，只是管神的人换成了官府新派的一班。沙丘腰带重开祭祀，祭司的位子得重新排：按序受职，谁先谁后、谁主谁次，这回不凭神意，全由官府排定。主事者记取旧日的教训，生怕祭司一族坐大，便把排位之权攥在自己手里。新任的祭司照官府开出的名次一一受职。有老祭司心里发酸，守了大半辈子神龛，末了被新人顶了位；可新人上香祷告毕恭毕敬，一丝不苟，也寻不出错处。主事者的高明就在这里：神还是那个神，人心却安定了。新旧交替最难是这般不露痕迹，偏偏他办得从容。"
 SUM_Neo_SGS.140.a:"重立赤王的旧制"
 SUM_Neo_SGS.140.b:"重建城邦的议会"
 SUM_SGS_RC_Rite_State:"列于大祀"
 SUM_SGS_RC_Rite_State_desc:"灵光之礼，如今升格成了国家的大典，就在圣显厅外举行。当官的和平头百姓一道参拜，心也齐，香火一连几夜没断过，场面极是隆重。"
 SUM_Neo_SGS.141.t:"灵光入飨"
 SUM_Neo_SGS.141.d:"礼官扯着嗓子唱赞，乐师奏起古乐，香烟一团团缭绕，烛火照得四处通明。广场上挤满了人，官儿们衣冠齐整、按品级排班，百姓们扶老携幼，在后头踮脚看热闹。沙丘腰带的祭祀既已重新张罗起来，主事者索性把灵光之礼抬成国祀。这本是当地百姓祭神祈福的老礼数，如今一升格，就变成举国上下都得行的大典，地点就设在圣显厅外那片开阔广场。有从前不把这礼放在心上的，如今见举国同祭，也跟着肃然起敬。主事者立在高台之上，望着眼前黑压压的人头，心中透亮：这一升格，收拢的是满满的人心。礼数一抬，香火跟着旺起来，远近赶来赴礼的百姓，把广场外的空地都占满了。"
 SUM_Neo_SGS.141.a:"召集能战之众"
 SUM_Neo_SGS.141.b:"召集能谋之士"
 SUM_SGS_RC_Pari_Office:"置司灵之吏"
 SUM_SGS_RC_Pari_Office_desc:"新设了一个官位专管花灵之事。花灵若不来这官便没事可做，只是干坐着。那官儿日日坐在衙里，清闲得紧。"
 SUM_Neo_SGS.142.t:"置吏司花灵"
 SUM_Neo_SGS.142.d:"「我这官儿，专等一个不肯来的人。」管花灵的官说着自己先苦笑起来。沙丘腰带把祭祀办得热闹，各色官名目繁多，最古怪的，是一个专管花灵的位子。花灵原是花神座下使女，行踪飘忽、灵异得很，寻常人哪能轻易见着。官府偏设了这官，命人专司接待供奉，郑重其事。可怪就怪在，那花灵压根不露面，官儿每日备下的香案供果，摆了又摆，从没人来动一分。于是这成了最有福气的闲职：到岗、上香、瞧一眼供品，便可打道回府，整日无事。有人打趣说这官当得舒坦，除却花灵不来，样样都省心。"
 SUM_Neo_SGS.142.a:"以神权号令沙漠"
 SUM_Neo_SGS.142.b:"以律法约束诸城"
 SUM_SGS_RC_Shrine_All:"随地树龛"
 SUM_SGS_RC_Shrine_All_desc:"各处水驿都立起了神龛，龛前还多站了一个官。拜神的地方也添了官气，那龛前的官儿日日坐在那里，是给仪式添些体面。"
 SUM_Neo_SGS.143.t:"随地树龛"
 SUM_Neo_SGS.143.d:"「又登记，又验关牒，真是麻烦。」赶路的行商望见龛前立着个官儿，心里先怵了三分。沙丘腰带水驿遍布，是商旅的性命线，官府便下令在每处水驿旁盖一座神龛，再加一名官儿守着。龛里供神，求的是水源长流、往来平安；官儿守在龛前，管的却是驿务盘查。于是有水驿的地方，便多了一座小龛，龛里一尊泥塑神像，龛前一名官儿，按着时辰上香，把过往客商逐个登记在册。有初次跑商的年轻人不懂规矩，漏报了一件货，被官儿拦下盘问半晌，吓得冷汗直冒。水驿是命脉，容不得闪失，久了众人也就习惯龛前这一站。"
 SUM_Neo_SGS.143.a:"把遗迹挖开"
 SUM_Neo_SGS.143.b:"把遗迹封回去"
 SUM_SGS_RC_Pilgrim_Guard:"立护法伍"
 SUM_SGS_RC_Pilgrim_Guard_desc:"朝圣路上派了护法队，表面护的是香客，其实还有沿路的税卡。队里一半人持矛，一半人背账。一箭双雕，香客与税卡两下里都照看周全。"
 SUM_Neo_SGS.144.t:"香众输榷"
 SUM_Neo_SGS.144.d:"这护法队走的是明面，收的是暗钱，一举两得。香客哪里晓得这些弯弯绕，只当官府体恤，一路感恩戴德；偏有精明的商贩瞧出门道，趁朝圣热闹在路边摆摊做起了生意，也沾了不少光。沙丘腰带朝圣之路渐热、香客络绎不绝，官府便在这路上派了护法队。名义自然是护送香客、保一路平安、免遭盗匪，可实际上护的还不止香客，沿路那一处处税卡也在照看之内。原来官府早把朝圣当成一桩大买卖：香客沿途要吃要住、要过卡缴税，中间油水不比寻常。于是护法队一面护香客，一面盯税卡，既防贼也防漏税。"
 SUM_Neo_SGS.144.a:"重立赤王的旧制"
 SUM_Neo_SGS.144.b:"重建城邦的议会"
 SUM_SGS_RC_Camel_Heavy:"肃整驼旅"
 SUM_SGS_RC_Camel_Heavy_desc:"驼骑身上加了甲，行走是迟缓了些，可一旦冲起来，谁也拦不住。那笨重的大家伙挪动起来像座山在走，每一步都掀起一片黄尘，来势凶猛。"
 SUM_Neo_SGS.145.t:"再整驼行"
 SUM_Neo_SGS.145.d:"「这铁驼冲阵，抵得上十队轻骑！」试过一回的骑兵回来拍着大腿叫好，说那场面直叫人头皮发麻：数十头披甲骆驼并排冲来，如同一堵铁墙碾过去，敌人刀砍上去只见火星四溅，箭射上去叮当作响，转眼阵脚就乱了。沙丘腰带要给商道护卫，少不得置办驼骑；沙漠行军本靠骆驼，无奈驼皮太软，遇上刀箭便吃亏。主事者便叫匠人拿皮条串起铁片，给骆驼周身披甲，连脖颈胸口都裹得严严实实。披甲之后，驼骑脚程是慢了些，原先一天能赶的路如今得多费工夫，骆驼负重也直喘粗气。可一旦冲将起来，那披甲驼骑便有如会走的墙壁，敌人哪里挡得住。从此沙丘腰带多出这一支披甲驼骑，行走沙海，威风八面。"
 SUM_Neo_SGS.145.a:"召集能战之众"
 SUM_Neo_SGS.145.b:"召集能谋之士"
 SUM_SGS_RC_Storm_Banner:"风沙为劲旅"
 SUM_SGS_RC_Storm_Banner_desc:"挑选耐得风沙的人编成一支军团，这支兵马专挑沙暴天出击。别人躲避，他们迎风，军团里的人个个惯经风沙。"
 SUM_Neo_SGS.146.t:"风沙为劲旅"
 SUM_Neo_SGS.146.d:"「沙里钻出来的鬼！」败下阵来的敌兵抹着脸上的沙，恨恨地骂。那一仗，对手是趁沙暴来的：狂风卷着黄沙，吹得人睁不开眼，火把尽数熄灭，骆驼惊得直挣缰绳。就在这昏天黑地里，一队人影悄无声息摸到营边，等人察觉，刀已架上了脖子。沙丘腰带练兵挑人，与别处不同，专找耐得住风沙的。沙上交战讲究与天斗，寻常兵卒一遇沙暴便乱了阵脚，若能炼出一批不惧风沙的健儿，专拣这等天时出击，便宜就占定了。主事者便从各城遴选沙里生、沙里长的精壮，另编一军。这班人皮肤晒得黝黑，眼里揉得进沙粒，风越大越抖擞。平日里练的是辨向、潜行、突袭；每回沙暴将至，旁人忙着躲避，他们却借黄沙掩护摸营，敌人万没料到，往往吃亏。"
 SUM_Neo_SGS.146.a:"以神权号令沙漠"
 SUM_Neo_SGS.146.b:"以律法约束诸城"
 SUM_SGS_RC_Fort_Chain:"堡戍相望"
 SUM_SGS_RC_Fort_Chain_desc:"沿商道修起一串堡垒，堡与堡之间骑兵一日便能到达，高声一呼便有人应。堡上白日挂旗，夜里点灯，一递一递传下去。首尾相救，如常山之蛇。"
 SUM_Neo_SGS.147.t:"堡垒相衔"
 SUM_Neo_SGS.147.d:"赶路的商队远远望见黄沙里冒出一座座夯土堡，旗子在风里啪啪作响，心里那根绷着的弦便松了。沙丘腰带的商道太长，护卫不易，主事者索性沿路修起一长串堡垒。这堡垒不是随便修的：堡与堡间的距离都算好了，恰好骑兵快马一日便能赶到。如此，一处出了警，邻近堡垒当日就能发兵来救，首尾相接，如同常山之蛇。工匠们沿着商道勘测选址、挖土夯墙，一座座堡垒拔地而起；每座里头屯着兵、储着粮、插着旗，连绵望去好似沙漠中的一串珍珠。守堡的兵卒日日登楼远眺，望着前后两堡的烽烟，也就不觉寂寞。自打堡垒连成串，商道上那种前不着村后不着店的凶险地方，便再找不着了。"
 SUM_Neo_SGS.147.a:"把遗迹挖开"
 SUM_Neo_SGS.147.b:"把遗迹封回去"
 SUM_SGS_RC_Weapon_Works:"置兵器官"
 SUM_SGS_RC_Weapon_Works_desc:"设了一个军械监专管打造兵器，监里的匠人脾气比当官的还横。有一技在身便有底气，那些匠人宝贝自己的手艺。"
 SUM_Neo_SGS.148.t:"匠人恃技"
 SUM_Neo_SGS.148.d:"「催什么催！火候不到，急也打不出好刀！」匠头把锤子往砧上一剁，瞪着眼道。那来催缴兵器的官儿被噎得说不出话，只得陪笑回去。沙丘腰带立了军，兵器是大事，主事者专设军械监打造兵器。原以为是规矩衙门，谁知里头匠人个个脾气火爆，本事却真大，打出的刀枪锋利无比。这些匠人仗着手艺在身、人人求着他们，渐渐骄横起来，连监里的官都不放在眼里。军械监的匠人比官还横，倒也难怪：在这沙海上，能打出好兵器的才是真本事。这般匠人纵有千般不是，打出的兵器实在锋利，主事者也只好由着他们。"
 SUM_Neo_SGS.148.a:"重立赤王的旧制"
 SUM_Neo_SGS.148.b:"重建城邦的议会"
 SUM_SGS_RC_War_Chest:"军帑充牣"
 SUM_SGS_RC_War_Chest_desc:"军费另存一处库房。想从里头支钱，得三个人一齐发话才行。三道口令把库门守得严严实实，谁也别打算私下里动一分一毫。"
 SUM_Neo_SGS.149.t:"三钥同启"
 SUM_Neo_SGS.149.d:"管库老吏每日擦拭账册，嘴里念叨这规矩立得到底好。三把钥匙、三道印信，谁也甭想独自开库。沙丘腰带养着这支军队，钱粮是命脉，主事者特意单设一座军费库，把银钱单独存放，不与国库相混。库中防护极严：银钱谁也不能擅动，要动用，须三人一齐开口，少一个都不成。主事者早年在银钱上吃过亏，懂得手一旦伸进钱库便难收回，才定下这三人共管的法子。三人各执一把钥匙、各掌一枚印信，取钱时凑齐当面对验，缺一人库门便打不开。也曾有人想钻空子，偷偷去贿赂其中一个，哪知另外两个压根不认，图谋当场就黄。从此军费库铜墙铁壁，没人能从中捞走分毫。"
 SUM_Neo_SGS.149.a:"召集能战之众"
 SUM_Neo_SGS.149.b:"召集能谋之士"
 SUM_SGS_RC_Old_Order:"仍循旧章"
 SUM_SGS_RC_Old_Order_desc:"有人主张一切照旧例行事，该交的交，该办的办，只是把账本换个封皮。名目虽新里子依旧，连旧例上的朱笔圈点都照抄下来。"
 SUM_Neo_SGS.150.t:"率由旧章"
 SUM_Neo_SGS.150.d:"「老章程动不得，把账本换个新封皮，敷衍过去就是。」议事厅上，主张照旧的人说得振振有词。沙丘腰带与雨林重算账目，众人各执一词，谁也不肯让。这一派人主张凡事照旧：该缴的照缴、该办的照办，只是把账本外头换张新皮，做个样子。说到底，他们既不愿得罪雨林，也不肯动自家的老规矩，只盼着糊弄过去。话还没落地，便有个性子耿直的站出来顶回去：封皮换了，里头的旧账分毫没动，欠下的水、占去的路一样不少，这般自欺欺人，哪里是在替沙丘百姓打算？两边你一言我一语，争得面红耳赤。主事者听了半晌，只管低头不语，到底依了哪一边，暂且按下不表。主张照旧的还想再辩，见主事者不开口，只好讪讪退下。"
 SUM_Neo_SGS.150.a:"以神权号令沙漠"
 SUM_Neo_SGS.150.b:"以律法约束诸城"
 SUM_SGS_RC_Tribute_New:"覆核贡赋"
 SUM_SGS_RC_Tribute_New_desc:"与雨林重算贡赋，交还是照旧交，只是数目少了些，名目也换了。面上有了光，里子也实惠，那少交的数目虽小也是面子。"
 SUM_Neo_SGS.151.t:"覆核贡赋"
 SUM_Neo_SGS.151.d:"交还是交，只是数目减了几成，名目也换了，这就是重算之后的结论。往日叫进贡，如今改称互市、摊派，听着顺耳；数目再削几成，让沙丘缓过一口气。两边各派算手坐到席上，噼啪拨着算盘一笔笔核。雨林算手一开口把价抬得老高，沙丘算手不示弱，翻出陈年旧账，哪年多收、哪年重收，一条条摆得清楚。几番推算，数目名目就定了。有个心思活络的说，这买卖不磕头也不吃亏。沙丘虽说还得往外掏东西，到底比往年轻省，体面实惠都占了，总算喘过这口气。"
 SUM_Neo_SGS.151.a:"把遗迹挖开"
 SUM_Neo_SGS.151.b:"把遗迹封回去"
 SUM_SGS_RC_Border_Old:"界有宿盟"
 SUM_SGS_RC_Border_Old_desc:"地界半分没改，换的只是守边的人，如今站岗的都是自己人。界碑还戳在原来那道沟上，碑没动，守碑的却换了衣裳。地方还是那块地方，做主的已经不是从前那拨了。"
 SUM_Neo_SGS.152.t:"界有宿盟"
 SUM_Neo_SGS.152.d:"说起议和条款，最要紧的一条不在别处，就在那道边界上：地界一寸不动，只把守关的人换成沙丘自家子弟。有个从前在自家关卡吃过苦头的，听说后特意绕道走了一趟，就为亲眼瞧瞧那面新换的旗。早先边界上的关卡，把守的全是雨林兵，沙丘百姓打这儿过，处处受人气，抬不起头。如今地盘还是那块地盘，守卡的却换成了沙丘兵丁，这才大不一样。兵丁接管了各处关卡，自家的旗号往上一插；来往的行商百姓见守卡的是熟人，心里也踏实不少。那批旧守卡兵交了差，灰头土脸退回雨林。看的人都夸这步棋走得妙：一寸地没让出去，里子却换了个彻底。"
 SUM_Neo_SGS.152.a:"重立赤王的旧制"
 SUM_Neo_SGS.152.b:"重建城邦的议会"
 SUM_SGS_RC_Keep_Clerks:"吏仍守职"
 SUM_SGS_RC_Keep_Clerks_desc:"会拨算盘的人，哪个朝都少不了，因此那批旧吏多半留了下来。衙门的日常，还得指着他们张罗；账目熟门熟路，新来的官也省得从头摸索。"
 SUM_Neo_SGS.153.t:"旧胥守职"
 SUM_Neo_SGS.153.d:"「会算账的人，哪个朝代都缺。你若也能把这本账理清，我一样用你。」主事者一句话，把那年轻人顶了回去。新朝刚立，百事待举，最缺的就是能实际办事的人，所以那帮懂账务、熟政务的旧吏，大半都留了下来。这些人经过改朝换代，心里未免犯嘀咕，可论起理财断案、催粮收款，是把好手；换成一群毛头生手，非把事办砸不可。主事者心里透亮，便不计较旧账，照旧让他们管钱粮、断词讼。偏有那喊革命口号喊得最凶的年轻人不服气，自觉劳苦功高，反倒不如旧吏吃得开，碰了一鼻子灰，只好回去苦练算盘。这一手用人，倒把新旧两班人都拢到了一处。"
 SUM_Neo_SGS.153.a:"召集能战之众"
 SUM_Neo_SGS.153.b:"召集能谋之士"
 SUM_SGS_RC_Quiet_Land:"守成勿扰"
 SUM_SGS_RC_Quiet_Land_desc:"治国之道端在一个稳字。不折腾，不扩张，安安稳稳把眼下的日子过好。不求虚名，只求实惠，那些折腾的事一件也不做。"
 SUM_Neo_SGS.154.t:"率循旧矩"
 SUM_Neo_SGS.154.d:"「这才像过日子的样子。」一位历经动荡的老人捋着白须，叹了这么一句。安稳二字听着平淡，却是沙丘百姓盼了多少年的福气。主事者折腾了好大一圈，末了又回到那句老实话：不折腾，不扩张，把眼前的日子过稳。这话是拿血汗换来的。先前也曾意气风发，要兴兵、要拓土、要复古，到头来兵一兴钱粮就见底，古一复争议就丛生。如今总算明白，百姓要的不是惊天伟业，不过是井里有水、田里有粮、夜里能睡个安稳觉。于是雄心收起，专心眼前几桩：修水驿、劝农桑、平诉讼、通有无。那些想建功立业的，也渐渐熄了心思，城中日子一日强过一日。"
 SUM_Neo_SGS.154.a:"以神权号令沙漠"
 SUM_Neo_SGS.154.b:"以律法约束诸城"
 SUM_SGS_RC_Sand_Throne:"沙王复降"
 SUM_SGS_RC_Sand_Throne_desc:"圣显厅旁起了座高台，台下军士按号站定。台上的人受了名分，第一道令便是：沙丘所有的道都设卡，所有的驿都设戍。沙丘从没这般齐整安静。"
 SUM_Neo_SGS.155.t:"沙王复降"
 SUM_Neo_SGS.155.d:"「这沙海，如今算真正捏成一只拳头了。」有老者远远望着那座高台，口中喃喃。高台是圣显厅旁边新起的，足有数丈高，站上去放眼一望，半个沙丘腰带都收在眼底。这天台上台下聚满了兵马，台下依着号令列得笔管条直，刀枪密得像林子，旗子猎猎招展。台上站着的，正是刚领了名分的主事者，一身甲胄，接了这座高台，也就接了统辖这片沙海的名分。名分刚领完，他头一道令就发了下去：沙丘地面，凡有道处一律设卡，凡有驿处一律设戍，一处都不许落下。令一下，各路人马飞快分头去办。没几天工夫，沙丘的大小道路上关卡鳞次、驿戍相望。沙丘从没这么齐整过，也没这么安静过：齐整的是那排开一线的兵与旗，安静的是再没人敢乱来的人心。"
 SUM_Neo_SGS.155.a:"把遗迹挖开"
 SUM_Neo_SGS.155.b:"把遗迹封回去"
 SUM_SGS_RC_Old_Dune:"丘中守局"
 SUM_SGS_RC_Old_Dune_desc:"沙丘与雨林重划了账：税减了，哨撤了，地界却不动。水驿照旧开，学馆照旧办，矫论团的经义照旧在帐里讲。日子比前几年好过。"
 SUM_Neo_SGS.156.t:"丘中守局"
 SUM_Neo_SGS.156.d:"税减了，哨撤了，地界一寸没让，这笔旧账划过之后，两边都长舒一口气。道理摆在明处：百姓肩上轻了，边境那点火药味也散了，谁的脸面都不曾损。沙丘腾出这口气，便一门心思办自家的正事，水驿照常开，往来商旅有水喝；学馆照常办，孩童照常拨算珠、描古字；矫论团的经义照常在帐里讲，只是越发讲得贴近过日子。这一连串安稳下来，沙丘日子比前几年强出不少。市面日渐兴旺，人心日渐平定，行商夜里也敢赶远路了。当年兵荒马乱逃出去的人家，如今又陆续回转，市面一天胜过一天。"
 SUM_Neo_SGS.156.a:"重立赤王的旧制"
 SUM_Neo_SGS.156.b:"重建城邦的议会"

 #### 开战须弥 · 雨林的门 ####
 SUM_SGS_WAR_The_Dune_Rises:"丘上东瞻"
 SUM_SGS_WAR_The_Dune_Rises_desc:"沙丘的商路、水驿与圣显厅名分上仍挂在雨林名下。花灵不再替人做决定，可这一次她们替凡人看清了一件事：不把这笔账清掉，沙上的人便永远弯着腰。"
 SUM_Neo_SGS.157.t:"丘上东瞻"
 SUM_Neo_SGS.157.d:"有个年轻后生听完花灵那番话，久久没吭声，末了把拳头攥得紧紧的。花灵这一番开导，好似在沙丘人心里点亮一盏灯，把他们弯了多年的腰照得清清楚楚。沙丘的商路、水驿连同圣显厅，名分上还挂在雨林名下，没完全脱开，这层牵扯像根无形的绳，时时拽着大伙的心。可这一回的事却耐人寻味：花灵往常是替人拿主意的，凡人的事她们一张口便定了；这回偏不替人做主，只让凡人自己悟透一桩事，这笔旧账若不清算干净，沙上的人就永远挺不直腰杆。原来花灵早看明白了，凡事仰人鼻息终究是寄人篱下，只有自己把账理清、把腰杆挺起来，才算是真站住了脚跟。这番话传开去，沙丘百姓都默默记在了心里。"
 SUM_Neo_SGS.157.a:"以动员令起兵"
 SUM_Neo_SGS.157.b:"以盟约召集部族"
 SUM_SGS_WAR_Call_All:"纠合城部"
 SUM_SGS_WAR_Call_All_desc:"召集令一下，各城各族都传遍了。年轻的汉子们背着口粮、挎着钢刀，从四面八方往一处赶，来的人比预想的多得多，各城的粮仓一时都供应紧张。"
 SUM_Neo_SGS.158.t:"纠合城部"
 SUM_Neo_SGS.158.d:"主事者站在高处，望着眼前黑压压一片人头，心里又喜又忧：喜的是民心可用，忧的是人一多主意就杂，这会不好开。这些年沙丘日子安稳下来，人心思聚，一听说要共议大事，各城各族便都赶了来，一半瞧热闹，一半出力气。召集令一路传檄，沙漠城邦、绿洲部落、商道各族，处处都得了信。原来主事者要聚众人商议一桩关乎整片沙海的大事，特意广而告之。令一下，众人纷纷动身：有骑驼来的，有坐车来的，也有干脆徒步穿过沙海的。到了约定那日，聚来的人黑压压站了一大片，比原先估摸的还多不少。"
 SUM_Neo_SGS.158.a:"直取雨林关隘"
 SUM_Neo_SGS.158.b:"先断其商路"
 SUM_SGS_WAR_War_Fund:"敛取军需"
 SUM_SGS_WAR_War_Fund_desc:"打仗要用的钱，盐路出一半，商户出另一半。盐路的赚头，往常都进了商人的腰包，这回匀出一半来充军费，两下凑在一起，居然也够了数。"
 SUM_Neo_SGS.159.t:"两处输饷"
 SUM_Neo_SGS.159.d:"军费来得不易，主事者吩咐分文都要花在刀刃上，半点不许糟践。要办大事，钱粮开路，可这军费从何而来，成了头等难题。主事者想出个摊派法子：盐路出一半、商户出一半，两边合力凑齐。沙丘的盐路是顶顶的财源，盐商获利丰厚，理当出这份钱；那些走南闯北的商户靠着沙丘商道发财，也该回报一二。当下分头去知会盐路与商户。盐商起先叫苦，说盐利微薄，可一算总账，晓得这钱躲不过，只得忍痛掏出；商户们你推我诿，最后还是商会出面，按各家资本大小摊派了事。几番周折，这笔军费总算凑齐，一文不差。主事者点头道，有钱就好办事。"
 SUM_Neo_SGS.159.a:"把话说给雨林人听"
 SUM_Neo_SGS.159.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Ration:"计口授食"
 SUM_SGS_WAR_Ration_desc:"口粮和食盐，都照人头分发，先满足军队，再顾百姓。每一份都过了秤，多一粒也不肯给，次序摆得明白，谁也没得抱怨。"
 SUM_Neo_SGS.160.t:"先戎后庶"
 SUM_Neo_SGS.160.d:"军费刚凑齐，跟着就得议粮盐怎么分。在这沙海上，粮和盐都是命根子，分起来容不得半点马虎。主事者定下的章程是：粮盐一律照人口发放，一天几合粮、几钱盐都有定额，谁也不许多占一文。这发放还分个先后，先军后民。道理也简单，养兵是天大的事，兵丁填饱了肚子才有力气护住这片沙海，所以军中头一份、百姓第二份。当即在各处设了发放的点，照着名册挨家挨户发。兵丁领足额粮盐自然欢喜；百姓虽晚上一步，可数目一文不少，也没人抱怨。偏有个自作聪明的想冒名多领一份，被管发放的吏当场识破，训斥一顿赶了回去。从此粮盐分发井井有条，人心也稳。先军后民虽有个先后，毕竟各有定数，谁也不至于饿肚子。"
 SUM_Neo_SGS.160.a:"倾全境之力"
 SUM_Neo_SGS.160.b:"留一支后手"
 SUM_SGS_WAR_War_Council:"分途三策"
 SUM_SGS_WAR_War_Council_desc:"军中议下三路进兵的方略：一支顺着商道走，一支翻过沙脊，一支绕着绿洲抄过去。三路人各走各的，互不干扰，敌人想防也防不过来。"
 SUM_Neo_SGS.161.t:"画沙定三"
 SUM_Neo_SGS.161.d:"「这一回，怕是要动真格的了。」一个老兵盯着远去的滚滚尘土，低声嘀咕。号角呜地一响，三支人马便分头开拔，好似三支离弦的箭，各奔一个方向。出征的将士披甲执兵，一个个摩拳擦掌。原来沙丘大计敲定之后，进军的路数还得细议。军师府那几位对着沙盘推演了好几日，才定下三路：一条贴着商道往前压，粮草跟得上，走得稳；一条直插沙脊，最险也最巧，专求出其不意；一条绕着绿洲兜圈，掩人耳目，好从侧面包抄。三路各派一员得力将领统带，日子也约好了，到点一齐动身。"
 SUM_Neo_SGS.161.a:"以动员令起兵"
 SUM_Neo_SGS.161.b:"以盟约召集部族"
 SUM_SGS_WAR_Proclaim:"草檄问罪"
 SUM_SGS_WAR_Proclaim_desc:"檄文上写的是一笔账，欠的水、占的路、多收的税一条条列得清清楚楚。有理有据，理直气壮，传将出去激起一片响应。"
 SUM_Neo_SGS.162.t:"飞檄诘林"
 SUM_Neo_SGS.162.d:"白日里沙海刺眼、目标太大，夜里借星光赶路，既能藏形又凉快省力。三路大军进发，偏偏挑在夜里行军，靠的也不是灯笼火把，而是满天星斗。军中那些识星的向导仰头辨着星座，认准了方向，便领着队伍稳步向前。可这法子也有短处：沙漠的夜说变就变，一旦云起遮了星光，便辨不得方向。为此军中立下死规矩：星光一暗，全军立刻停下，就地扎营，躲进沙窝里，一步也不敢乱走。有一回一片乌云飘来，星光顿失，大军便齐刷刷停在沙丘背风处，人衔枚、马裹蹄，静静候着云散。过了许久星光重现，才又拔营前行。这般谨慎，把夜行的风险压到了最小，多少回都靠它避开了沙暴。"
 SUM_Neo_SGS.162.a:"直取雨林关隘"
 SUM_Neo_SGS.162.b:"先断其商路"
 SUM_SGS_WAR_Night_March:"暗中夜驰"
 SUM_SGS_WAR_Night_March_desc:"大军夜里行路靠星光辨认方向，星光一暗队伍便停下来，就停在沙窝里。不辨方向绝不冒进，那沙窝里歇着的人马连咳嗽都不敢出声。"
 SUM_Neo_SGS.163.t:"乘星夜驰"
 SUM_Neo_SGS.163.d:"仗要打得有理，檄文便是把沙丘百姓这些年的委屈，一件件摆给天下人瞧。主事者深谙此理，三路大军未动，先传出这么一纸檄文。这檄文不写讨伐的套话，也不骂逆天悖理，通篇只写一笔账：欠的水、占的路、多收的税，条条列得分明。执笔的书吏把旧账翻了个底朝天，哪年欠多少水、哪处路占了几里、哪回税多收了几成，写得清清楚楚，连数目都核对过。檄文一出，四处传抄，百姓读了都说这话讲到了心坎里，原先那些憋屈，如今总算有了出处。有热血青年读罢，当场便要报名从军。这一纸檄文传开，沙丘积攒的怨气便有了着落，抵得上千军万马。"
 SUM_Neo_SGS.163.a:"把话说给雨林人听"
 SUM_Neo_SGS.163.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Wind_Guide:"辨风之能"
 SUM_SGS_WAR_Wind_Guide_desc:"队前走着个识风的人，眼力极尖：抬眼看看云，便知道哪一片要起沙，只凭一朵云就能料到十里之外的风沙。大军由他引着走，把风沙都避开了。"
 SUM_Neo_SGS.164.t:"望云识风"
 SUM_Neo_SGS.164.d:"「不好，那片要起沙，快绕道！」领头的识风者抬手拦住全军，压着嗓子丢下这一句。众人顺他手指的方向看去，只见远处天边一片黄云正悄悄翻卷。原来夜里行军最忌沙暴突袭，主事者特意挑了识风的人走在大队最前头。这帮识风的都是沙海里滚出来的老手，看云识风的本事神了：瞄一眼天边云的颜色、嗅一嗅风里的气味，就知道哪片沙地马上要扬沙、哪道沙梁就要移动。有他们头前领路，大军便像多了双眼睛。当下众人依言临时改道，才躲开一场铺天盖地的沙暴。有个年轻兵丁起先还不信邪，等望见那片沙地果然黄沙遮天，才伸着舌头说，这识风的，竟比神仙还准。"
 SUM_Neo_SGS.164.a:"倾全境之力"
 SUM_Neo_SGS.164.b:"留一支后手"
 SUM_SGS_WAR_Beast_Load:"役兽负运"
 SUM_SGS_WAR_Beast_Load_desc:"驯好的沙兽用来驮运辎重，这兽比骆驼还能多走半程。有它帮忙粮草便跟得上，只是喂养起来费些草料。"
 SUM_Neo_SGS.165.t:"役兽负运"
 SUM_Neo_SGS.165.d:"管粮的官一路跟下来，乐得嘴都合不上：粮草器械一件没丢。原来大军远行，最怕粮草辎重拖累，主事者便寻了个法子，拿驯熟的沙兽来驮。这沙兽本是沙海里土生土长的异兽，性子温顺，气力又大，脚掌宽厚，踩在沙上不陷不沉，如走平地。军里驯兽的人费了不少工夫，才把它们逐一调教服帖，架上驮鞍，用来装粮草、载器械。这一使果然省事：沙兽耐力极好，一口气比骆驼还多赶半程路，吃得少、喝得少，最是省心。那管粮官拍着沙兽的脖子夸了又夸，说有了这等脚力，粮草就断不了顿。行军道上，一队队沙兽驮着沉沉的担子，稳稳缀在大军后头，从没掉过队。"
 SUM_Neo_SGS.165.a:"以动员令起兵"
 SUM_Neo_SGS.165.b:"以盟约召集部族"
 SUM_SGS_WAR_Water_Hop:"循邮而前"
 SUM_SGS_WAR_Water_Hop_desc:"大军沿水驿一站一站往前跳，每跳一步补给便近了一分。不贪快，步步为营，那一站站的补给接得上，人马从不缺水。"
 SUM_Neo_SGS.166.t:"循邮而前"
 SUM_Neo_SGS.166.d:"「慢些不打紧，稳当才要紧，沙海里冒进要吃大亏。」性急的将领嫌推进慢，主事者便拿这话劝住众人，大家这才耐下性子。大军人沙漠作战，补给线一旦拉长被截断，便是全军困死在里头。为此主事者定了个稳当法子，顺着水驿一站站往前挪。这挪法有讲究：大军不贪快，拿水驿当落脚点，夺下一处便扎稳、补足粮水，再往下一处进。挪一步，后头补给就近一步，前头战线也牢一分。如此步步为营，每进一步都有水驿接应，粮草能源源不断供上。大军依计，今日取一驿，明日取一驿，稳扎稳打。"
 SUM_Neo_SGS.166.a:"直取雨林关隘"
 SUM_Neo_SGS.166.b:"先断其商路"
 SUM_SGS_WAR_Silent:"衔枚疾走"
 SUM_SGS_WAR_Silent_desc:"沙丘练兵先练一个静字。号令一下全军夜行，铃铛摘了不摇，马蹄裹上厚布，几百人鱼贯而过，连宿鸟也不惊动。把一支人马练成了沙上的影子。静之一字，利害。"
 SUM_Neo_SGS.167.t:"匿踪宵济"
 SUM_Neo_SGS.167.d:"练成这无声行军，整支大军便像一柄收在鞘里的刀，没到跟前，敌人半点察觉也没有。沙丘人夜行最忌讳走漏踪迹，主事者便下命全军习练这套本领，规矩定得细：马蹄用布层层缠裹，落地不闻声响；驼铃、马铃一概摘去，不许出半点声；连身上甲片也拿布条扎紧，走动不得叮当乱响。更有一条严的：不准高声讲话，不准咳嗽，连传令都用手势和耳语。全军照办，真走起来人影绰绰却悄无声息，仿佛一片影子贴着沙面滑过去。有个新兵憋不住咳了一声，身旁老兵立刻狠狠剜他一眼，吓得他把嘴捂住，再不敢吭声。"
 SUM_Neo_SGS.167.a:"把话说给雨林人听"
 SUM_Neo_SGS.167.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Storm_Post:"力破敌斥"
 SUM_SGS_WAR_Storm_Post_desc:"沙丘要打通商道头一桩便是拔钉子。雨林伸进沙丘的哨所如钉在肉里的刺，得一处一处拔去。拔掉一处商道上便少一处关卡，商队也少受一回盘剥。先把这些刺拔净，才好谈别的。"
 SUM_Neo_SGS.168.t:"力破敌斥"
 SUM_Neo_SGS.168.d:"要解决的心头大患，就是雨林伸进来那些哨所。这些年雨林在沙丘商道上到处插手，一处处哨卡占着要道，百姓过往受尽刁难。三路大军既然排定，头一件事便是拔掉这些钉子。主事者的令简单：哨所一座座拔，拔掉一处，商道就少一处卡。三路人马分头行事，专瞄哨所下手，顽抗的就刀兵相见，识趣的见大势已去便弃械归降。每拔一处，当地百姓欢天喜地拆了卡子、重开商道。如此挨个拔将过去，商道一点点畅通了。有个跑了一辈子商的老贩，伸手摸着平坦的路，眼眶都红了。"
 SUM_Neo_SGS.168.a:"倾全境之力"
 SUM_Neo_SGS.168.b:"留一支后手"
 SUM_SGS_WAR_Siege_Rig:"锻制攻械"
 SUM_SGS_WAR_Siege_Rig_desc:"沙丘造攻具不另出心裁，只照着圣显厅里的图样打造。这东西笨重非常，几十人抬着走，看着蠢笨，可那雨林哨所的土墙偏偏怕它，一旦撞上墙便裂开大口。笨物偏能啃硬墙。"
 SUM_Neo_SGS.169.t:"拙器上阵"
 SUM_Neo_SGS.169.d:"墙是夯土掺碎石垒的，瞧着厚，其实一撞就散。头一记撞上去，墙上簌簌落土；第二记，垛口便崩开一道缝。那守军在垛口上瞧得发呆，有个兵伸手往墙上一抠，抠下一把土来，脸色当时就白了。造这攻具的，是营里一伙木匠铁匠，打小跟父辈修渠造闸，这回被调到一处，照着圣显厅墙上的旧图样打造。图上画的是古时破城的家伙，模样粗笨，木梁比人腿还粗，铁钩赛过娃娃的胳膊。第一件造好，十几个壮汉抬着走了半里地，累得气喘如牛，围看的兵都笑，说这东西还没到哨所，人先累趴下了。领工的老匠人不恼，蹲在地上拿手指头比划，叫把梁削薄一层、钩子改短一寸，试了三回才轻省些。笨归笨，只要撞得着就使得。"
 SUM_Neo_SGS.169.a:"以动员令起兵"
 SUM_Neo_SGS.169.b:"以盟约召集部族"
 SUM_SGS_WAR_Cut_Water:"断其水邮"
 SUM_SGS_WAR_Cut_Water_desc:"攻哨所有一巧法，不去硬攻，只在上游把水引开。那哨所里明明蓄着水，可水道一断，守军守着水池却汲不上来。渴上三日人心先乱，不攻自破。"
 SUM_Neo_SGS.170.t:"宵导涧水"
 SUM_Neo_SGS.170.d:"百夫长夜里把水囊数了一遍又一遍，数是一个没少，心里却越发发毛。原来围城夺寨，断粮固要命，断水更要命，而且断水来得更快。那哨所半坡上扎着，吃水全仗上游一条小溪。沙丘的人没急着攻墙，先悄悄遣一队人摸到上游，趁黑掘开一条旧渠，溪水便被引到山背后的洼地里存了起来。转天清早，哨所的人照例挑桶下山，到溪边一望都愣住了：溪底只剩湿沙几汪，浑水连牲口都不肯沾嘴。守军在墙上骂了半晌，骂得口干舌燥，越骂越渴。有人想在墙里掘井救急，挖了三丈多深，尽是干土碎石，半滴不见。第三日，伙夫端来一碗水，八个人轮着喝，一人一口，饮罢都把碗底舔净。有个兵夜里摸下山偷水，被巡哨拿住捆回墙根，守军连骂的劲儿都没了。"
 SUM_Neo_SGS.170.a:"直取雨林关隘"
 SUM_Neo_SGS.170.b:"先断其商路"
 SUM_SGS_WAR_Night_Wall:"乘夜仰登"
 SUM_SGS_WAR_Night_Wall_desc:"夜袭哨所专挑身手灵便的人攀墙。那墙高丈余，攀上去的不到一半，其余的摔下来鼻青脸肿。可就在这乱当口，墙上的灯忽然一盏盏灭了，原来早有人埋伏在暗处。"
 SUM_Neo_SGS.171.t:"三十登垣"
 SUM_Neo_SGS.171.d:"事后清点，爬上墙的不到三十人的一半，可就是这一半，把城门从里头打开了。可见成事不靠人多，多半靠那一阵来得好不到的风。那夜攻哨所，营里选了三十个手脚最灵的后生，都是自小在沙丘上翻山跳涧惯了的，腰间别着短刀，背上缠好麻绳，趁三更天摸到墙脚。墙上每隔十步挑一盏油灯，照得墙头亮如白昼，谁探一下头就得挨箭。第一批十个人攀上去，绳子断的断、手一滑的滑，跌到墙下闷声不响。有个诨号沙狐的，爬到半截绳子磨断，摔进墙根沙堆里，翻身起来掸掸土，又贴着墙往上摸。恰好这时刮起一阵风，墙头灯一盏接一盏灭了，守军黑地里放箭，射的全落了空。墙上一时大乱，有人踢翻灯油，火苗顺着木栏杆往上舔。余下的人趁这漆黑，一个接一个翻上了墙头。"
 SUM_Neo_SGS.171.a:"把话说给雨林人听"
 SUM_Neo_SGS.171.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Keep_Post:"凭哨拒守"
 SUM_SGS_WAR_Keep_Post_desc:"哨所一旦易手，沙丘并不拆毁，只把它改成自己的戍所。门朝哪边开、墙上挂谁的旗，一概由沙丘说了算。昨日还是雨林的关卡，今日便成了沙丘的眼睛。"
 SUM_Neo_SGS.172.t:"凭哨拒守"
 SUM_Neo_SGS.172.d:"「晒归晒，可南边淌的是咱自家的水，值当。」守门兵回过来客这句问话。哨所才夺下来，众人顾不上摆酒庆功，头一件事竟是改门。这座哨所原先归雨林，大门冲东，正对着去须弥城的大道，摆明了是盯着沙丘的。沙丘的人一接手，先把东门拆了，在朝南那面另凿一个门洞，说门该朝哪边开，得听沙丘的水与风的。垒砖的匠人一边干活一边嘀咕，说这墙根底下埋着块老界石，刨出来一瞧，字迹全让沙给磨没了。门楣上新刻的三个字，笔画歪歪扭扭，好在还认得出来。仓房、马棚、瞭望台都原样留着，单把旗换了，墙上雨林的纹样凿掉，重新抹一层泥。驻守的多是本地招募的兵，白天操练，入夜轮值，得闲就蹲在门边抽几口旱烟。"
 SUM_Neo_SGS.172.a:"倾全境之力"
 SUM_Neo_SGS.172.b:"留一支后手"
 SUM_SGS_WAR_Turn_Guard:"诱降戍卒"
 SUM_SGS_WAR_Turn_Guard_desc:"雨林的戍卒大半是花钱雇来的，并非死心塌地。沙丘派去的人也不多说，只问一句：「你替谁当兵？」这一问便问得许多人心里活动。谁给的粮多便替谁卖命。"
 SUM_Neo_SGS.173.t:"阴诱逻卒"
 SUM_Neo_SGS.173.d:"那戍卒站在原地，把这句话在心里翻来覆去嚼了半晌，打这以后，每逢换哨，总忍不住多看两眼东边那条路。一句话点到要害，比敲十面锣鼓还管用。原来雨林在各处哨所屯的兵，十成里有七成是花钱雇的，按月发饷、供吃供住，死了给一笔抚恤金，家里人领了钱就走。沙丘腰带把这个底细摸了个透，就派几个口齿伶俐的人，扮成贩盐的、修渠的，混到哨所旁的村口，看见戍卒便蹲下来闲扯。扯了大半晌，末了才淡淡问一句：你替谁当兵。那戍卒先是一怔，低头抠鞋底的泥，抠了好一阵，竟说不出一句完整话。有那直性子的便接道，谁给钱我替谁卖命。派去的人只点点头，并不劝，起身挑起担子便走，走出十来步，才回头撂下那句话。"
 SUM_Neo_SGS.173.a:"以动员令起兵"
 SUM_Neo_SGS.173.b:"以盟约召集部族"
 SUM_SGS_WAR_Village_Talk:"缔好沙砦"
 SUM_SGS_WAR_Village_Talk_desc:"雨林边的村社也给重税压得喘不过气。沙丘派去的人带着账本算给他们看：同样一担粮，交与雨林剩几成，交与沙丘剩几成。账目摆开，村社的人动了心。"
 SUM_Neo_SGS.174.t:"联漠上砦"
 SUM_Neo_SGS.174.d:"「弄不明白的，原也用不着再交。」念账的这一句落地，屋里静了一阵，有人先笑出声。里正起身取来一盒印泥，说今日这话，各人按个手印罢。于是排队按，按完把账本合上交给村里收着。临出门，里正追出来问，赶明年的账还念不念。来人回头道，念。沙丘的人去雨林边上那些村社说这事，不带刀，只带一本账。那账是几个老书吏熬了半个月抄成的，哪年交了几成、哪年添了什么名目，一笔笔分明。那些村社往年只交一份租，如今哨所要粮、教令院要税、过路兵还要草料钱，一年下来仓里剩不下几斗。到了村里，众人围坐，把账摊在膝头一页页念给村老听。念到某年凭空多出的那一项，村老拍着大腿，说这一项连我们都没弄明白。"
 SUM_Neo_SGS.174.a:"直取雨林关隘"
 SUM_Neo_SGS.174.b:"先断其商路"
 SUM_SGS_WAR_Amnesty:"下诏宥罪"
 SUM_SGS_WAR_Amnesty_desc:"沙丘招降定下规矩：凡归降者旧事一概不问。愿留下的分给田地，叫他们落地生根；愿走的发足口粮，送他们上路。"
 SUM_Neo_SGS.175.t:"陈列地粮"
 SUM_Neo_SGS.175.d:"有个老兵站了半晌，忍不住问：我从前在对面放过箭，你们不记这个？管事的抬起头，答得干脆：记那个做什么，你要留下，明日便与我同吃一锅饭。老兵听了，把肩上袋子放下，蹲在原地不走了。后头一个抱孩子的妇人探头问，我家那口子还在对面，也能来么。管事的道，来罢，来了照这个规矩。收人心不在话说得漂亮，在你肯不肯把地契与粮袋一并摆出来。哨所和村社的人来归，营门大开，不搜身、不问旧事，只在案前排成两行。案上一边搁着地契，一边搁着粮袋，谁也不藏。愿留下的，登个名、领一块地，地界当场由里正指给你看；愿走的也不难为，量三斗粮装进袋里，扛上肩便可出营。这一桩办下来，营门口的地界桩一日挪了三回。"
 SUM_Neo_SGS.175.a:"把话说给雨林人听"
 SUM_Neo_SGS.175.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Buy_Clerk:"赂结文吏"
 SUM_SGS_WAR_Buy_Clerk_desc:"关卡上的事全靠书吏那一支笔。沙丘的人把摩拉递过去，书吏便把档换上一份，该记的少记，该抹的抹去。这法子虽不光彩，可在这沙海之中省了无数口舌。"
 SUM_Neo_SGS.176.t:"金帛通吏"
 SUM_Neo_SGS.176.d:"驮队往回走时，又在茶碗底下压了一叠摩拉。这关口是厚是薄，全在于书吏那支笔。关卡扼在大道咽喉，来往驮队都得从这里过；关上认的是档，不是人：何等货物、几时过关、发往何处，全由书吏登在册子上，册子锁入木柜，钥匙就挂在书吏腰间。沙丘的人摸清这一节，不硬闯，单在书吏跟前下工夫：头一回请吃酒，第二回送匹布，最后一叠摩拉压到茶碗底下。那书吏收下也不言语，抽出旧档重新誊过，货名写成粗盐，数目削去三成。驮队次日大模大样过关，守兵翻开册子瞧一眼，挥手就放。过了半个月上头派人来查，书吏把新誊的册子呈上，原册早丢进灶膛烧成灰，查的人翻来翻去，只看见数目齐齐整整。"
 SUM_Neo_SGS.176.a:"倾全境之力"
 SUM_Neo_SGS.176.b:"留一支后手"
 SUM_SGS_WAR_False_News:"行反间计"
 SUM_SGS_WAR_False_News_desc:"沙丘用计专在消息上做文章，故意把假话透给雨林的斥候，让他们当了真回去说给自己人听。等雨林那边信以为真调兵遣将，沙丘早已另有所图。"
 SUM_Neo_SGS.177.t:"席间泄机"
 SUM_Neo_SGS.177.d:"那两个斥候一路奔回营，把听来的话一字不落报了：南边那条道空得很，主力都往北去了。雨林主将半信半疑，先遣一队人往南探，回报说路上确有炊烟，其实只是几个牧人烧的火。这一疑就误了三日，主将后来拍着桌子骂自己糊涂。骂完，把那两个斥候调去看草料。原来营里捉住这两个雨林斥候时，没杀也没关，先赏了一顿饱饭。饭桌边坐着个管事的，闲闲地说起，说罢又故意压低嗓子跟旁人嘀咕两句，摆手叫别说。两个斥候把耳朵竖得老高，饭也扒得更快。第二日放他们回去，临走还塞了两块干粮。假话得让敌人自己说出去，才有人肯信。"
 SUM_Neo_SGS.177.a:"以动员令起兵"
 SUM_Neo_SGS.177.b:"以盟约召集部族"
 SUM_SGS_WAR_Supply:"军装络绎"
 SUM_SGS_WAR_Supply_desc:"粮道一断人马便走不动。沙丘的辎重沿商道铺开，一站接着一站如同长蛇，前一营吃完，后一营的粮车恰好赶到。人马走到哪里便有接济跟到哪里。粮草接上，仗才敢往下打。"
 SUM_Neo_SGS.178.t:"卅里一驿"
 SUM_Neo_SGS.178.d:"「稍等半个时辰。」前队断了粮，押粮的急得直跺脚，管事的只丢下这一句。工夫不大，后站驮队果然赶到了。大队人马向东开进，真正让人犯难的，不是迎面遇上的刀兵，而是身后接不上的粮草。沙丘腰带把商道两旁废弃的旧驿站一处拾掇出来，每隔三十里便立一站，站内囤着水、草、面，夜里点灯、白天挂旗。每站留一个老卒看门，来一队驮子就在木牌上划一道，划满换块新牌。驮队打水驿出发，头一站换牲口，第二站换车夫，第三站卸下空袋、装足再走。站挨着站，像一根长绳把它们串成一串，前头的人只要回头一望，就晓得后头有东西正跟上来。有一站让沙埋了半截，老卒带人刨了两天，才把门重新掏出来。兵马能走多远，全看这条补给线铺得有多长。"
 SUM_Neo_SGS.178.a:"直取雨林关隘"
 SUM_Neo_SGS.178.b:"先断其商路"
 SUM_SGS_WAR_Water_Team:"输水济众"
 SUM_SGS_WAR_Water_Team_desc:"沙漠作战水比命贵。沙丘的运水队昼夜不停，车夫换人不换车，日夜兼程。人歇车不歇，一车车清水源源不断送往阵前。"
 SUM_Neo_SGS.179.t:"裹轮宵载"
 SUM_Neo_SGS.179.d:"前头喝的那一口水，是后头有人拿命换的。沙丘这地方打仗，最费的不箭，是水。营里专拨一支运水队，二十辆大车，每车装四只羊皮水囊，白日走、夜里也走，车轮裹着布，碾在沙上不出声。车夫分两班，一班走前半夜、一班走后半夜，到点换人，车子一刻不停。每回出发前，管队的挨个捏水囊，捏出气声的便换下来。有一辆车陷进流沙，二十来个人卸了水囊，拿肩顶着车杠硬推，推到天亮才出来。有个老车夫连赶三夜，眼皮肿得像桃，管事的把他拽下来，他还不肯，说这车水是给前头伤兵送的。管事的道，你倒在路上，这车水就白费了。老车夫听了，蹲在车边就睡，不到一炷香，又爬起来套牲口。"
 SUM_Neo_SGS.179.a:"把话说给雨林人听"
 SUM_Neo_SGS.179.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Medic:"阵前置医"
 SUM_SGS_WAR_Medic_desc:"沙丘行军医帐跟着队伍走，受了伤的能就地治便就地治，不必抬回后方。郎中背着药箱随叫随到，金疮药一敷伤口便裹将起来。省了往返奔波，也少折损了许多性命。"
 SUM_Neo_SGS.180.t:"即地置医"
 SUM_Neo_SGS.180.d:"「三日换一回药，莫沾沙。」医官拔出断箭，丢下这么一句。那后生腿上中箭，箭杆断在肉里，医官拿小刀剖开皮肉把箭头取出来，他咬着根木棍，满头是汗，硬是一声没吭。取完，他点点头，拄着棍自己走回队里去了。军中这处医帐跟着队伍走，从不落在后头。帐里铺着草席，摆几只木箱，放着刀圭、麻布、艾草和几味晒干的草药。伤轻的抬进来，洗净、敷药、缠上两圈布，当天就叫人背回队；伤重的留下，日夜有人守着。帐里不记姓名，只挂号，抬进来一个便在席边挂块木牌，写明哪营的。帐外常排着一小串人，有自己走来的，有被人架来的，谁都不肯先哼一声。当夜有个重伤的喊娘，守帐的就坐在旁边，一直守到天亮。就地救活一个，前头就多一个能回去的。"
 SUM_Neo_SGS.180.a:"倾全境之力"
 SUM_Neo_SGS.180.b:"留一支后手"
 SUM_SGS_WAR_Forge_Move:"军携作匠"
 SUM_SGS_WAR_Forge_Move_desc:"沙丘的铁作坊竟是跟着军队一并走的。炉子架在车上，铁砧也搬着走，到了驻地支起炉灶便开打。缺了刀补刀，缺了矛造矛，什么坏得快现打什么。"
 SUM_Neo_SGS.181.t:"军携百工"
 SUM_Neo_SGS.181.d:"「兵在前头卖命，咱们在他们后头打铁。」小徒弟问算不算兵，师父头也不抬，甩下这么一句。营里这处铁作坊并不设在城中，就安在大军后方三里地。风箱一拉，火苗窜起半人高，铁砧上从天亮叮当到天黑。前头要箭镞，这边就开炉锤镞；嫌盾牌薄，就再加一层铁皮；有一天驼鞍上的铁环断了几个，铁匠瞅一眼，说这是现成活计，两炉火就够了。打仗的器械样样耽误不得，从城里运来得十天，这里一天就能交活。每次拔营，炉火都不许熄，铁匠拿湿毡裹住炭火架上大车，到了驻地支起风箱就干。有一回风箱的皮破了，一个老铁匠把自己的皮袄割下来缝上。匠人们熏得满脸乌黑，手上尽是烫疤，吃饭时筷子都捏不住，索性下手抓。炉火要是熄上一宿，前头就得添好几口棺材。"
 SUM_Neo_SGS.181.a:"以动员令起兵"
 SUM_Neo_SGS.181.b:"以盟约召集部族"
 SUM_SGS_WAR_Rear_Tax:"转饷不绝"
 SUM_SGS_WAR_Rear_Tax_desc:"前方的仗打得紧，后方的捐输照收不误。出钱出粮的人心里也明白，眼下多捐些等打胜了便可抵扣往后的税。这买卖划得来，于是众人踊跃。"
 SUM_Neo_SGS.182.t:"征输于后"
 SUM_Neo_SGS.182.d:"「就写在我儿子名下罢，我这把年纪，怕是等不到那天了。」一个商人交得很多，只提了这么个要求。旁边一个老妇捧来一小袋枣，说家里再没别的东西，就这个还拿得出手。肯把东西交出来的人，心里早押下了这一注。大军开动，钱粮花得跟流水似的，沙丘腰带在后方照旧收捐输，却不搞摊派，只挂出一块牌子，写明今天收什么、明天收什么、谁交了多少，一切都摆在明面上。来交纳的人排成长队，有牵羊的、扛粮袋的，也有把自家织的毡子卷起来抱来的。案上摊着两本册子，红皮的那本记能抵扣的，黑皮的记白送的，红册锁进木匣，钥匙分由三个人掌着。管账的照例问一句是捐还是借，多数人答算借罢，等打了胜仗从税里扣；管账的便笑一笑，把名字登进红册，注明可抵。"
 SUM_Neo_SGS.182.a:"直取雨林关隘"
 SUM_Neo_SGS.182.b:"先断其商路"
 SUM_SGS_WAR_Last_Storm:"终风大起"
 SUM_SGS_WAR_Last_Storm_desc:"沙丘定下总攻的日子，专挑换季的大风天。风一起黄沙漫天，天地都分不清东西。就在这乱风里沙丘的人马掩杀过去，敌人辨不清方向，弓也射不准。"
 SUM_Neo_SGS.183.t:"终风复起"
 SUM_Neo_SGS.183.d:"前队摸到哨所墙下时，守军还在揉眼睛。队伍是顶着风往东推的，沙打在脸上像针扎，有人帽子被卷走也不去追。风起那日午后，天地果然分不清，日头缩成一点白斑，营中旗子撕开一道口子。这风沙丘一年一度，从北边卷来，天色像陈年的铜锈，人站三步外就认不清脸。总攻的日子没挑月圆，也没选吉日，单等的就是换季这一场大风。营里早得了信，兵士拿布蒙口鼻、用绳缠刀柄，只待风起；老卒白天蹲帐外看云脚往哪边翻，便知风还有几日。风来之前，能拴的都拴牢，驼队蹲进背风沙窝，人抱着刀睡。天时会用的当一路兵，不会用的只当是天气。"
 SUM_Neo_SGS.183.a:"把话说给雨林人听"
 SUM_Neo_SGS.183.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Break:"一谋溃敌"
 SUM_SGS_WAR_Break_desc:"两军对阵，沙丘先放出最硬的驼骑压住正面，等敌人阵脚一动，两翼的游骑便如利刃般插将进去。正面顶住，两翼包抄，把敌人的阵势绞得粉碎。这一招硬中带巧。"
 SUM_Neo_SGS.184.t:"驼行渐逼"
 SUM_Neo_SGS.184.d:"号旗一落，两翼的游骑便从沙梁背后兜了过去，专拣阵尾的辎重和旗手下手。有一队直冲到旗下面，一刀割断旗绳，旗子飘然落地的时候，正面的人马还没跟上来接应。这正是列阵那天就算计好的：硬的一路死死顶住不动，快的两路才腾得出空当。沙丘把最硬的一支驼骑摆在正面打头阵，那些骆驼喂养得熟，听见鼓声丝毫不惊，人骑在上头比坐马还高出一头，身上披着厚毡，刀劈上去都进不去。驼骑排成三排，缓缓向前压，稳得像一堵会移动的墙，骑手用布把脸裹得只露眼睛，驼蹄把沙踩得瓷实，后面的步卒便踏着这条硬道跟上来。两翼游骑却轻装，一人配两匹马，鞍边拴着水囊，约好以中军旗为号，号手身上每人只带一支号，吹破了也没得换。"
 SUM_Neo_SGS.184.a:"倾全境之力"
 SUM_Neo_SGS.184.b:"留一支后手"
 SUM_SGS_WAR_See_Towers:"远瞩浮图"
 SUM_SGS_WAR_See_Towers_desc:"有士卒登上雨林高处放眼一望，隐隐望见须弥城的尖塔。众人走了这么远的路，打了这么久的仗，为的便是那几座塔。那是教令院的所在，也是压在沙丘头上的山。望见那塔，众人心里定了。"
 SUM_Neo_SGS.185.t:"遥瞻高标"
 SUM_Neo_SGS.185.d:"「那塔里住着什么人？」有个年轻兵望着东边，忍不住问。东进第五天，人马爬上一道靠着雨林的高坡，坡上树木高大，一片叶子就能把一个兵盖住。众人歇脚，一人只分一口水，谁也舍不得多喝。领兵的让大伙噤声，自己分开枝叶朝东瞭望。坡下河渠纵横、水田连片，满眼碧绿，绿到尽头，雾里立起几座尖塔，塔身细长，塔尖泛着一点白光。千里迢迢走来，为的就是这几座塔。旁边一个老卒答那年轻兵，说住的是写字的人。年轻兵没再问，只伸手把刀往腰里紧了紧。坡上风带着水汽，扑到脸上凉飕飕的，众人闻着这气味，都默不作声。半晌，有个老兵开口，说年轻时他就在这一带运盐，那会儿脚下还全是雨林的地盘。许多仗打来打去，根子往往就在远远望见的这一眼里。"
 SUM_Neo_SGS.185.a:"以动员令起兵"
 SUM_Neo_SGS.185.b:"以盟约召集部族"
 SUM_SGS_WAR_Terms:"开口议约"
 SUM_SGS_WAR_Terms_desc:"沙丘的人马兵临城下方才把条件摆出来：撤去哨所，减去重税，归还水道，认下沙丘独立。四条款款明白，不再多费唇舌。有分教：四条一出，再无转圜。"
 SUM_Neo_SGS.186.t:"胪列条款"
 SUM_Neo_SGS.186.d:"「四条都写在这儿，你们慢慢禀。」使者把纸举过头顶，人却一步不退。提条件这件事，得趁刀已经出鞘，对方才会认真看。兵临城下，营盘扎得稳稳的，偏不进攻，先打发一个使者空着手去城门底下传话，连个随从都没带。纸上列得清清楚楚：其一，撤掉雨林边上的哨；其二，减了村社的税；其三，把引走的水归还；其四，承认沙丘腰带自立。城头先射下一支箭，钉在使者脚前三步开外，他连眼皮都没眨，反把纸举得更高。守城人接过纸，看了半晌，说要向上禀报。使者道，那就不急，我们在此候着。这一候便是三天，城上城下谁也不动刀，白天各自埋锅造饭，夜里各自点灯。第三日，城里从水门递出一篮饼，使者接过来，随手分给了守门的兵。第四日，城上换了个答话的，口气软了许多。往后三天，两边没一个人高声说话，连咳嗽都憋着。"
 SUM_Neo_SGS.186.a:"直取雨林关隘"
 SUM_Neo_SGS.186.b:"先断其商路"
 SUM_SGS_WAR_Sumeru_Day:"须弥启旦"
 SUM_SGS_WAR_Sumeru_Day_desc:"到了这一步，这仗已然不只是胜负。打给雨林看是叫他们知道沙丘不可欺；打给沙丘自己看，是叫众人明白凡人自己也能挺直腰杆。这一仗打出了志气，也打出了名分。"
 SUM_Neo_SGS.187.t:"须弥告庆"
 SUM_Neo_SGS.187.d:"火堆边有人把饼掰成两半，递一半给身旁的人，一时谁都没言语。老参议守着火堆，指着它对围坐的一圈人开口：柴是各人抱来的，火到底烧成了一堆。这仗打到这份上，他夜里坐在火边忽然来了这么一段话，说一半是打给雨林看的，让他们明白沙丘的刀不是花架子；另一半是打给沙丘自己看的。众人莫名其妙。老参议道，沙丘这许多部落，从前各守一口井，为争一道水渠能结三代人的冤仇，如今能肩挨肩站在一处，靠的不是盟书一纸，是这一路一同踩出来的脚印。有个年轻头领不服，说打完了仗，井还不是各家自己的。老参议笑而不答，只拿手点了点火。年轻头领低头想了半晌，把手里的炭添进火里。人心要拧成一股绳，总得有一件大伙一块儿扛过来的事。"
 SUM_Neo_SGS.187.a:"把话说给雨林人听"
 SUM_Neo_SGS.187.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Dune_On_Forest:"丘上东趋"
 SUM_SGS_WAR_Dune_On_Forest_desc:"沙丘腰带的旗插上了第一道雨林哨所。再往东便是河渠平原，再往东便是须弥城。教令院连夜遣使说一切好商量，阵前的人只回一句：「先撤哨，再谈别的。」把话堵得严严实实。"
 SUM_Neo_SGS.188.t:"丘上东趋"
 SUM_Neo_SGS.188.d:"「先撤哨，再谈别的。」教令院连夜派来的使者捧着两只匣子，说是薄礼，阵前的人看也不看，只丢了这一句。使者张了张嘴，没再言语。沙丘的旗头一回插上雨林第一道哨所，那旗是粗布缝的，上面绣着灵光纹样，旗杆拿驼毛绳一道道绑在垛口上。插旗的正是头一个翻上墙头的后生，他爬上去把旗一抖，风便把它绷得笔直。立在墙头往东望，近处河渠蜿蜒，清水一道道；再远是平原，田地连成片；最远处须弥城的尖塔，在雾里只露出一个顶。旗插稳了，众人退下墙头，把哨所里的灶重新烧起来，煮了一锅糊糊，先盛给守过这墙的伤兵。占住一处地方，比说一百句话都顶用。"
 SUM_Neo_SGS.188.a:"倾全境之力"
 SUM_Neo_SGS.188.b:"留一支后手"

 #### 决议 ####
 SUM_SGS_Govern:"邦司水利"
 SUM_SGS_Govern_desc:"沙丘腰带设有政务一组专管这片商旅之地的日常。安置流民，整饬关卡，维护驿站，件件都要料理。往来一顺生意才做得成，客商才留得住。"
 SUM_SGS_Faith:"花灵拥帙"
 SUM_SGS_Faith_desc:"沙丘腰带另设信仰一组。往来之人各有各的神，如何让这些信念彼此相安便是这里的难题。若能叫各路人马进得来、住得下、走得开，便是功德一件。"
 SUM_SGS_Trade:"贸涂盐道"
 SUM_SGS_Trade_desc:"沙丘腰带商贸一组靠中转与买卖立足。掌住了货源与价差便能在沙海站稳脚跟。做买卖讲究眼力，更讲究时机，看准了才把利钱攥在手里。"
 SUM_SGS_Army:"丘上屯锐"
 SUM_SGS_Army_desc:"沙丘腰带军事一组，护商守隘、清剿沙匪都要靠自己人手。轻骑与哨探是这里的看家本领。人多眼杂之地武备不可松懈，否则商路一断家业便难为继。"
 SUM_SGS_Crisis:"沙碛继馑"
 SUM_SGS_Crisis_desc:"沙丘腰带危机一组专应沙暴劫掠、商路断绝这类变故。凡事预则立，早些处置总好过临阵慌乱。少折些人马货物，把损失压在能承受的范围便还有翻身的指望。"
 SUM_SGS_Dec_Gov_Charter:"悬法于邦"
 SUM_SGS_Dec_Gov_Charter_desc:"沙丘腰带要立规矩，先为各处城邦订下一份宪章，哪些事该办、哪些事不该办，白纸黑字人人可查。把往日的口说无凭变成了有章可循，谁也不能再随意翻脸。"
 SUM_SGS_Dec_Gov_Roll:"括户著籍"
 SUM_SGS_Dec_Gov_Roll_desc:"沙丘腰带要摸清家底便派人登记各城的人口与户数，哪家几口人、哪户几间房，一笔一笔写在册上。把糊涂账理清了，征兵收税才有依据。"
 SUM_SGS_Dec_Gov_Steward:"众意所推"
 SUM_SGS_Dec_Gov_Steward_desc:"各城的执事不再由上面指派，改由城里人公推。众人你一言我一语，推举出素来公道的人来管事，办得好坏众人眼里都看着。"
 SUM_SGS_Dec_Gov_Water:"稽核水程"
 SUM_SGS_Dec_Gov_Water_desc:"沙丘腰带要把水权理清，派人把各城的水重新清丈造册。哪口井归谁、哪条渠灌哪片田都量得清清楚楚，一册在手谁也休想多占一分。"
 SUM_SGS_Dec_Gov_Road:"平治沙涂"
 SUM_SGS_Dec_Gov_Road_desc:"沙丘腰带要便商旅，便把城与城之间的沙道一段段补平，坑洼的填土，塌陷的垫石，两路终于连成一片。端的叫商队走得顺畅。"
 SUM_SGS_Dec_Faith_Rite:"陈灵光祀"
 SUM_SGS_Dec_Faith_Rite_desc:"沙丘腰带要行灵光之礼便选在圣显厅外的沙地上。众人各带一支蜡烛围拢点燃，星星点点映着灵光。礼数不繁，在一片烛光里表尽了敬意。"
 SUM_SGS_Dec_Faith_Hall:"圣显厅除秽"
 SUM_SGS_Dec_Faith_Hall_desc:"圣显厅久埋沙中，沙丘腰带便组织人手一筐一筐把沙清理出去。众人挥锹挑担干了整整几日，厅里的石阶方才露出来，把先人的旧迹从沙底重新刨了出来。"
 SUM_SGS_Dec_Faith_Script:"审文辨体"
 SUM_SGS_Dec_Faith_Script_desc:"圣显厅里挖出许多石板，上面的古字无人认得。沙丘腰带便把识字的人都召了来围在石板旁一字一句地释读，众人七嘴八舌，把沉睡的旧文一个字一个字唤醒。"
 SUM_SGS_Dec_Faith_Shrine:"树此灵位"
 SUM_SGS_Dec_Faith_Shrine_desc:"沙丘腰带要在各处水驿立灵龛，这龛前不摆三牲，只安一盏灯昼夜长明。过路的人歇脚时望一眼心里便踏实，把一点明净安在了每条商道上。"
 SUM_SGS_Dec_Trade_Post:"增设榷卡"
 SUM_SGS_Dec_Trade_Post_desc:"沙丘腰带要在商道要口设卡征税，这卡设在何处、收几成，都由众人合议。收来的钱不进私囊一概修路凿井，商队缴得心甘情愿。"
 SUM_SGS_Dec_Trade_Halt:"治水邮涂"
 SUM_SGS_Dec_Trade_Halt_desc:"沙丘腰带要在商道上增修水驿与井，一处接一处，隔上十几里便有一处歇脚的地方。商队到了那里有水喝有荫乘，把一条荒沙变成了往来不绝的活路。"
 SUM_SGS_Dec_Trade_Insure:"行商相保"
 SUM_SGS_Dec_Trade_Insure_desc:"沙丘腰带要护商路便组织商队互保，这一队出事众人齐来照应，那队遇险各家一并出手。把散沙拧成了一股绳，劫匪见了也退避三舍。"
 SUM_SGS_Dec_Trade_Mint:"炉冶更铸"
 SUM_SGS_Dec_Trade_Mint_desc:"沙丘腰带要铸自己的钱便架起炉子昼夜不停地开炉，铜水注入钱范，一枚枚叮当落地。钱边上明写着成色，一望便知，凭这一行小字立住了信用。"
 SUM_SGS_Dec_Trade_Caravan:"招来行贾"
 SUM_SGS_Dec_Trade_Caravan_desc:"沙丘腰带要招徕远来的商队便把税减了又减。远道的商人一算账觉着有利可图，便赶着驼队来了。来的多了市面便热闹，沙地也跟着富起来。"
 SUM_SGS_Dec_Army_Levy:"调守陴卒"
 SUM_SGS_Dec_Army_Levy_desc:"沙丘腰带要护住地界便向各城征发守军，这座城出十人，那座城出二十，凑成一支队伍。众人虽来自各处却都听一人号令。"
 SUM_SGS_Dec_Army_Beast:"驯彼荒兽"
 SUM_SGS_Dec_Army_Beast_desc:"沙丘腰带要驯养沙兽，专挑矫论团里懂兽性的能人。驯好的沙兽平日驮得辎重，临阵又能披鞍冲杀，把沙漠里的猛兽变成了自家的帮手。"
 SUM_SGS_Dec_Army_Drill:"演风阵图"
 SUM_SGS_Dec_Army_Drill_desc:"沙丘腰带操演守军偏挑风沙天。别家躲风沙，他们偏在黄沙漫天里练辨向、练结阵，练得熟了风越大反倒越稳。把本事练到了骨头里，上阵方能从容。"
 SUM_SGS_Dec_Army_Fort:"增戍筑垒"
 SUM_SGS_Dec_Army_Fort_desc:"沙丘腰带要在商道增筑戍所与望楼，隔上一段路便立一处驻人守望。望楼上的人远远望见动静便能早早示警，把整条商道罩进了一张网里。"
 SUM_SGS_Dec_Crisis_Storm:"发廪赈风"
 SUM_SGS_Dec_Crisis_Storm_desc:"沙暴过后不少人家被毁得片瓦无存，沙丘腰带便开仓赈济，一袋粮一袋盐地发下去。遭了灾的人得了接济，不至于流离失所。"
 SUM_SGS_Dec_Crisis_Water:"平其水讼"
 SUM_SGS_Dec_Crisis_Water_desc:"两处城邦为了争水闹得不可开交，险些动了刀兵。沙丘腰带便派人前去调解，把水权重新量过各分应得的一份，把一场干戈化成了杯酒。"
 SUM_SGS_Dec_Crisis_Plague:"御疫有备"
 SUM_SGS_Dec_Crisis_Plague_desc:"某处起了疫病，沙丘腰带当机立断先把那处封住不许人随意出入，一面又施药救治把郎中派进去。把疫病堵在一处，不至于蔓延开来。"
 SUM_Neo_SGS_Mechanism:"众械齐作"
 SUM_Neo_SGS_Mechanism_desc:"这块板子不掺和事，只把实数摆出来。帕里、遗物两条轴走到哪一档，沙丘腰带什么等级、吃哪几条修正，列在上头。条目按不得，轴值一动板子便自己翻页。扫上一眼就知道力气该往哪根轴上使。"
 SUM_Neo_SGS_T1_View:"灵光垂灭"
 SUM_Neo_SGS_T1_View_desc:"稳定度 -10%、月度人口 -20000"
