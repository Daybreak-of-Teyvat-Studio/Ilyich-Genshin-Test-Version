 SUM_Neo.159.t:"启蒙之世"
 SUM_Neo.159.d:"学士走出高塔，走进市集与绿洲。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。"
