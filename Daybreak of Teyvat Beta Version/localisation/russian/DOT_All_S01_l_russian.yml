andrius.112.b:0"Свобода человека начинается со свободы разума!"
andrius.112.c:0"Хватит спорить, давайте договоримся!"


andrius.1001.t:0"Новый цветочный магазин Флоры"
andrius.1001.d:0"Недавно в Вольфендоме вновь открылся новый, но уже знакомый магазин.\nЭто цветочный магазин под названием «Язык цветов». Как и раньше в Мондштадте, маленькая Флора стояла за прилавком, окружённая цветами. Увидев это, корреспондент вспомнил мирную и процветающую жизнь в Мондштадте до войны.\nНа вопрос корреспондента Флора радостно ответила: «Пожив в Вольфендоме, я заметила, что люди постепенно перестали голодать и начали искать что-то другое, например, украшения для своих домов... Поэтому я снова открыла магазин, надеясь помочь. Я смогла открыть “Язык цветов” благодаря поддержке всех».\nФлора была одной из первых беженцев в Вольфендоме и долгое время работала на текстильной фабрике. Накопив денег и заняв у друзей, она, наконец, открыла новый «Язык цветов».\nНовый магазин пользуется большим спросом, даже больше, чем раньше. Временно помогающая в магазине командир ополчения, мисс Эйлин, рассказала нашему корреспонденту:\n«Я боялась, что магазин не окупится, а теперь столько посетителей, я просто устала».\nУспех нового «Языка цветов» показывает, что жители Вольфендома теперь могут позволить себе предметы роскоши. За несколько лет пройти путь от голода до такого уровня — это настоящее чудо нашего совместного строительства.\nОдин проходивший мимо рыбак, пожелавший остаться неизвестным, сказал, что глубоко тронут и чуть не прослезился."
andrius.1001.a:0"«Постойте, это только для просмотра!»"


andrius.1002.t:0"Амбиции покорения звёзд"
andrius.1002.d:0"В нашем растущем исследовательском институте появился один талантливый, но полный фантазий человек. Теперь он предлагает разработать «ракету» — аппарат, использующий реакцию перегрузки Пиро и Электро для достижения большой высоты, для наблюдения за объектами в верхних слоях атмосферы. Конечно, его можно использовать и как оружие.\nЕго коллеги отмечают, что в его проекте много нереалистичных моментов и требуются параметры, недостижимые современными технологиями. Как нам поступить с его предложением?"
andrius.1002.a:0"Возможно, когда-нибудь это пригодится. Вложим немного."
andrius.1002.b:0"Не стоит, деньги не с неба падают."

andrius.1003.t:0"Цель правосудия"
andrius.1003.d:0"Наш административный аппарат постепенно избавляется от «худобы» и обрастает «мышцами». Теперь мы наконец построили первый суд. Он находится в деревянном доме, внутри всё просто и скромно; посторонний, взглянув, может подумать, что это столовая.\nЭтот суд уже начал работать, упорядочивая наши судебные процессы (некоторые мыслители считают, что такое понимание «правильности» требует обсуждения) и помогая нам разрешать гражданские споры. Однако возникла и новая проблема: нашей судебной системе не хватает «руководящей идеи», и иногда мы сталкиваемся с дилеммами. Например, в недавнем случае, который требует вашего решения:\nЭто снова связано с туалетом. Прошу, не ешьте пока... Неужели жизнь человека — это переезд из одного туалета в другой? Итак, недавно в некоторых общинах в писсуарах общественных туалетов появились странные вёдра с надписями о том, что по приказу правительства нужно собирать мочу для централизованной переработки, хотя мы ничего подобного не приказывали. Расследование показало, что группа людей обманным путём собирала мочу для продажи суеверным старикам для изгнания злых духов и для извлечения веществ для алхимии. Все они пойманы, а улики... никто не хочет их забирать.\nЭто дело можно рассматривать и как серьёзное (мошенничество, кража «имущества»), и как незначительное (достаточно воспитательной беседы). Но наше решение зависит от идеологической позиции. Какова цель нашего наказания: устрашить преступников или исцелить их для возвращения в общество?\nСторонники первого подхода считают, что справедливое наказание — лучший способ предотвратить преступления и соответствует естественному чувству справедливости: добрые должны получать награду, а злые — наказание. Преступники должны быть наказаны, чтобы они отказались от своих «схем» и направили свою энергию в другое русло — они ведь даже на это способны, значит, могут заработать и честным путём.\nСторонники второго подхода считают, что такое поведение порождено обществом: наши законы недостаточно известны, и они пошли на это, потому что мы плохо работаем. А если у этих вещей есть рынок, значит, мы недостаточно хорошо обучаем население. Мы должны перевоспитать их, «исцелить» от склонности к... «краже имущества», чтобы они могли нормально вернуться в общество.\nЧто мы выберем?"
andrius.1003.a:0"Карательное правосудие. Посадим на время, оштрафуем, чтобы знали, что нельзя."
andrius.1003.b:0"Исцеляющее правосудие. Объясним им важность гигиены и найдём им полезное дело."

andrius.1004.t:0"Методы школьного образования"
andrius.1004.d:0"С начала гражданской войны в Мондштадте дети не только потеряли возможность учиться, но и часто не могли нормально питаться. В течение долгого времени у нас в Вольфендоме не было школ, а дети часто использовались как рабочая сила, иногда даже на опасных работах.\nТеперь мы наконец построили первую школу — под открытым небом. Дети сидят на маленьких деревянных ящиках, используя большие в качестве столов, и слушают учителя.\nКонечно, это только начало. Одна школа не вместит всех детей Вольфендома. Со временем мы откроем школы повсюду, чтобы после войны дети могли получить образование и найти своё место в жизни. Неграмотные взрослые смогут посещать вечерние школы, чтобы повысить квалификацию.\nНо перед этим нам нужно решить одну проблему, на этот раз не связанную с туалетами: какую образовательную политику выбрать? Это может не изменить наше положение немедленно, но окажет долгосрочное влияние.\nОдни предлагают систему «разделения по способностям», когда учеников одного возраста, но с разным уровнем знаний, распределяют по разным классам для «индивидуального обучения». Это позволяет с меньшими затратами готовить специалистов разного уровня. Однако критики опасаются, что это приведёт к огромному разрыву между классами, где «сильные» получат лучшее образование, а «слабых» просто бросят. И тогда распределение по классам будет определяться не только успеваемостью.\nДругая идея — максимально равное образование, независимо от происхождения и способностей. Это позволит выявить действительно талантливых людей, а не тех, кто получил преимущество благодаря ресурсам. Это соответствует духу эгалитаризма. Но критики утверждают, что интеллект, настойчивость и способности у людей различаются, и даже если при рождении они равны, к школьному возрасту разрыв уже ощутим, и это будет пустой тратой ресурсов.\nЧто мы выберем?"
andrius.1004.a:0"Система разделения по способностям"
andrius.1004.b:0"Равное образование"

andrius.1005.t:0"«Спасите класс»"
andrius.1005.d:0"В нашем процветающем Вольфендоме растут духовные потребности людей, и рождается новая форма искусства — манга. Она требует массового читателя и прибыли от продаж, использует кадры для создания иллюзии непрерывности, уделяя больше внимания выразительности, чем деталям.\nСреди недавно появившихся манг самой популярной стала... созданная Фишль в свободное время «Спасите класс», которая, видимо, отражает её опыт в образовании.\nСюжет: в мире «Парящего шара» великий врач «Учитель Спаситель» после восстановления Луны заболевает и становится учителем в элитной школе. Ученики, опасаясь за его жизнь, пытаются его спасти. Начинаются весёлые будни.\nСчитается, что эта манга имеет не только развлекательную, но и глубокую социальную значимость. Хотя господин Озвальдо утверждает, что Фишль просто придумала название на ходу.\nПожелавший остаться неизвестным Беннет сказал: «Очень интересно! Хотя я не понял, почему, но мне понравилось!»"
andrius.1005.a:0"Это тоже важная сторона необходимой политики."
andrius.1005.b:0"Критика может быть полезной."
andrius.1005.c:0"Забавно, но не более."

andrius.1006.t:0"Позор"
andrius.1006.d:0"Недавно в газетах появилась история о том, как осуждённая за попытку растления малолетней ***** столкнулась с «особым отношением» в своей общине.\nКогда её поймали, её проступок стал известен всей общине. После освобождения её статус резко упал. Местные жители начали держать детей подальше от неё, школы и другие учреждения, связанные с детьми, отказались принимать её на работу. При приближении к детям соседи прогоняли её, а на дверях её дома появилась табличка «Насильник детей».\nОна заявила, что покинет общину. Формально она больше не преступница, но действия жителей вряд ли можно назвать неправомерными. Как нам реагировать?"
andrius.1006.a:0"Что тут обсуждать? Поделом."
andrius.1006.b:0"Стоит ли перенять это в наших законах?"
andrius.1006.c:0"Мы должны предотвратить распространение таких методов на другие преступления и не допустить самосуда."

andrius.1007.t:0"Образцовая тюрьма"
andrius.1007.d:0"Недавно появилась статья об успешной реабилитации заключённых в одной тюрьме.\nДиректор тюрьмы, бывший педагог, добровольно вызвался возглавить её, когда мы решили перейти к исцеляющему правосудию. Она проявила инициативу, организовав в тюрьме различные мероприятия: обучение заключённых рабочим профессиям, чтобы они могли зарабатывать и легче адаптироваться после освобождения; активно работала с внешним миром, чтобы подготовить почву для их возвращения. Самое удивительное — она создала в тюрьме оркестр.\nСтатистика показывает, что трудоустройство выпускников этой тюрьмы выше среднего, а уровень рецидивизма — ниже. Однако и содержание такой тюрьмы обходится дороже, и расходы несёт государство.\nКак нам к этому относиться?"
andrius.1007.a:0"Это наш идеал исцеляющего правосудия."
andrius.1007.b:0"Бред, заключённые там отдыхают, что ли?"
andrius.1007.c:0"Достойно похвалы, но не для подражания."

andrius.1008.t:0"Учитель начальной школы"
andrius.1008.d:0"«...Таким образом, когда материальных благ станет достаточно, частная собственность отомрёт, и человечество перейдёт к распределению по потребностям», — сказал он, повернувшись.\n«Учитель, у меня вопрос, — спросил один из детей. — Если всё можно будет брать бесплатно, не начнут ли люди присваивать вещи, не делясь ими? И не остановится ли распределение из-за нехватки?»\nМолодой человек улыбнулся: «Нет. Представления людей формируются под влиянием среды. В условиях изобилия их мышление изменится... Вот грубый пример», — начал он расхаживать по классу, как часто делал. «В Вольфендоме раньше не хватало туалетов, и правительство принимало законы, чтобы регулировать их использование. Но теперь эти законы отменены. Почему? Потому что туалетов стало “достаточно”, и никто не борется за места. Так мы достигли распределения по потребностям в отношении туалетов, и никто не захочет монополизировать место из ностальгии...»\nДети засмеялись. Они запомнят этот урок на много лет."
andrius.1008.a:0"«Дети, в этом суть: наши представления меняются вместе с окружающей средой»."

andrius.1009.t:0"Возобновление войны"
andrius.1009.d:0"Мондштадт снова охвачен войной — в то время как мы ещё не закончили восстановление.\nМы знаем, что за последние годы все устали от войны. Все говорят, что война только уничтожает то, что мы создали, и уносит жизни наших близких.\nНо враг не сложит оружие только потому, что мы хотим мира. Напротив, если мы не проявим волю и решимость сражаться, враг ворвётся на нашу землю, отнимет наши плоды, убьёт наших близких. Только борьба защитит то, что мы имеем.\nПоэтому мы будем сражаться. Не как враг — ради грабежа, захвата, гегемонии или «нового порядка», — а ради созидания, защиты, мира и права каждого жителя Мондштадта свободно ходить по своей земле.\nПоэтому мы будем сражаться. Пусть они увидят нашу силу, наше мужество, нашу решимость защищать счастье, мир и свободу! Пусть они больше никогда не посмеют нас презирать, пусть пожалеют о нападении и вечно нас боятся!\nМы должны сражаться, нам нужно сражаться, мы обязаны сражаться, поливая поля Мондштадта кровью врагов!\nВ этой войне у народа Мондштадта только два пути. Один ведёт к победе, другой — к смерти."
andrius.1009.a:0"Смерть не для свободных людей!"
andrius.1009.b:0"Земля Мондштадта рождает героев, их клинки устремлены к тиранам!"

andrius.1010.t:0"«Ведьмак 3»"
andrius.1010.d:0"Прогресс в алхимии и элементальной технологии привёл к появлению вычислительных машин. Мы смогли уменьшить компьютеры размером с комнату до портативных устройств. Это позволило им войти в повседневную жизнь, и кто-то придумал использовать их для развлечения — так родились видеоигры. Со временем они становились всё популярнее и сложнее, что также стимулировало развитие компьютерных технологий.\nСегодня вышла новая часть популярной серии: «Ведьмак 3: Дикая Охота». В ней игрок становится «кибер-ведьмаком», использующим хакерские навыки для борьбы с мировым злом. Несмотря на некоторый героический пафос, игра несёт в себе глубокий смысл.\nИнтересно, что встроенная в игру карточная игра «Гвинт» оказалась настолько увлекательной, что многие игроки забрасывают основной сюжет ради партий с NPC. За это игру прозвали «Гвинт 3: Дикая Ставка»."
andrius.1010.a:0"Как это, ни одной карты погоды? Это точно заговор!"

andrius.1011.t:0"Явление Небесного Принципа..."
andrius.1011.d:0"Давным-давно... наши предки вместе с Барбатосом сражались с «Королём Башен». Он был могущественным демоном, и тогда нам помогал великий бог ветра.\nТеперь... Небесный Принцип будет сражаться с нами, а Барбатоса рядом нет.\nНаш враг обладает силой, превосходящей всё, с чем сталкивались наши предки. Морозный Гвоздь, который он обрушил, одним ударом уничтожил древнюю цивилизацию на Драконьем хребте, и мы до сих пор видим это ужасное оружие. Наши мечты о прекрасном будущем могут сгореть в этом огне.\nНо это не значит, что мы должны сдаться, молить о пощаде и плакать. Даже если мы это сделаем, мы не выживем.\nМы держим оружие, и в наших сердцах горит мужество... Возможно, мы совершим подвиг, превосходящий деяния предков, и одолеем этого врага, превосходящего богов. И тогда мы сможем продолжить строить наше будущее, встречать утреннюю зарю и создать мир, где пухлые дети спокойно слушают сказки бабушек.\nВозможно... мы не сможем противостоять Небесному Принципу и исчезнем, как те цивилизации, оставив лишь несколько стел и книг. Тысячелетняя культура Мондштадта канет в Лету, и никто не вспомнит наших имён, наших идеалов, нашего отчаяния и мужества.\nДля Небесного Принципа мы как насекомые! Но даже у насекомых есть достоинство. Если нам суждено встретить смерть... то лучше встретить её стоя на коленях?"
andrius.1011.a:0"Мы жаждем драгоценной свободы и готовы за неё сражаться..."
andrius.1011.b:0"Это последняя борьба, объединимся до завтра..."
andrius.1011.c:0"Прощай, земля отцов, помни о нас..."
andrius.1011.e:0"Сыны и дочери Мондштадта, кто из вас хочет быть зарезанным как скот..."

andrius.1012.t:0"«Меч Сокола 3: Разрыв Небес»"
andrius.1012.d:0"Прогресс в алхимии и элементальной технологии привёл к появлению вычислительных машин. Мы смогли уменьшить компьютеры размером с комнату до портативных устройств. Это позволило им войти в повседневную жизнь, и кто-то придумал использовать их для развлечения — так родились видеоигры. Со временем они становились всё популярнее и сложнее, что также стимулировало развитие компьютерных технологий.\nНедавно вышла новая часть популярной серии: «Меч Сокола 3: Разрыв Небес». Серия посвящена мечу героини Натлана, Веннессы, и считается классикой, ностальгией для целого поколения.\nРазработчики уже анонсировали дополнение «Здесь, на стыке неба и моря», вызвавшее большой энтузиазм среди игроков."
andrius.1012.a:0"Дай-ка поищу, как скрафтить монстра..."

andrius.1013.t:0"«Безмолвный балет»"
andrius.1013.d:0"Прогресс в алхимии и элементальной технологии привёл к появлению вычислительных машин. Мы смогли уменьшить компьютеры размером с комнату до портативных устройств. Это позволило им войти в повседневную жизнь, и кто-то придумал использовать их для развлечения — так родились видеоигры. Многие считают, что они могут стать искусством, превосходящим все другие, объединяя текст, изображение и музыку.\nНедавно вышла игра «Безмолвный балет», названная критиками «романом, вставленным в компьютер». Сюжет: главный герой приходит в себя и обнаруживает, что он полицейский в городе «Молчание», и вместе с напарницей расследует убийство. В финале он находит существо, которое должно быть вымышленным.\nМногие игроки не поняли, что такое «древесный червь», но были тронуты этим моментом."
andrius.1013.a:0"«Я существую». «...И я тоже»."
andrius.1013.b:0"Знал бы, что так кончится, лучше бы играл в карты с мамочкой Сильвер..."

andrius.1014.t:0"«Проект Идеальный Город»"
andrius.1014.d:0"Прогресс в алхимии и элементальной технологии привёл к появлению вычислительных машин. Мы смогли уменьшить компьютеры размером с комнату до портативных устройств. Это позволило им войти в повседневную жизнь, и кто-то придумал использовать их для развлечения — так родились видеоигры. Многие считают, что они могут стать искусством, превосходящим все другие, объединяя текст, изображение и музыку.\nНедавно вышла игра «Проект Идеальный Город», получившая высокую оценку за креативность и геймплей. Игрок становится мэром-ситуационистом и строит идеальный город, а в итоге — превращает весь Тейват в один гигантский город.\nМногие игроки не могли оторваться от игры часами; на сегодняшний день в игре построено уже сотни тысяч «идеальных городов»."
andrius.1014.a:0"Опять пробка из-за урановоза!"
andrius.1014.b:0"На второй день после релиза — посмотри на моё время игры."

andrius.1015.t:0"«Крайний Король»"
andrius.1015.d:0"Прогресс в алхимии и элементальной технологии привёл к появлению вычислительных машин. Мы смогли уменьшить компьютеры размером с комнату до портативных устройств. Это позволило им войти в повседневную жизнь, и кто-то придумал использовать их для развлечения — так родились видеоигры. Однако, несмотря на их пользу, многие по-прежнему считают их вредными, как когда-то бумагу считали хуже бамбуковых табличек.\nНедавно вышла игра «Крайний Король», получившая высокие оценки за увлекательность. Игрок управляет династией первопроходцев, строит поселения и захватывает власть, используя различные методы — от заключения браков до войн.\nНекоторые методы в игре считаются слишком реалистичными и аморальными, что подтверждает мнение критиков о вреде игр."
andrius.1015.a:0"Дочь моей дочери..."

andrius.1016.t:0"«Предельная прибыль: Горизонт 5»"
andrius.1016.d:0"Прогресс в алхимии и элементальной технологии привёл к появлению вычислительных машин. Мы смогли уменьшить компьютеры размером с комнату до портативных устройств. Это позволило им войти в повседневную жизнь, и кто-то придумал использовать их для развлечения — так родились видеоигры. С самого начала было ясно, что они могут приносить огромную прибыль, и это подтвердилось. Сейчас на рынке множество игр, и одна из самых популярных — «Предельная прибыль: Горизонт 5».\nИгрок начинает с небольшим капиталом и, используя кредиты, мошенничество и финансовые махинации, создаёт корпорацию, а затем пытается монополизировать рынок и даже купить муниципальные услуги. В итоге игроки часто оказываются втянутыми в бесконечную гонку."
andrius.1016.a:0"Дай-ка научу тебя играть! Сначала поставь крематорий и выгребную яму вверх по течению..."

andrius.1017.t:0"«Ресторан Южного Воробья»"
andrius.1017.d:0"Прогресс в алхимии и элементальной технологии привёл к появлению вычислительных машин. Мы смогли уменьшить компьютеры размером с комнату до портативных устройств. Это позволило им войти в повседневную жизнь, и кто-то придумал использовать их для развлечения — так родились видеоигры. Со временем они становились всё популярнее и сложнее. На их основе создаются образовательные методики, а некоторые компании даже перенимают игровые механики для управления.\nНедавно разработчики популярной казуальной игры «Ресторан Южного Воробья» объявили о прекращении выпуска DLC, что вызвало много шума. Сюжет основан на сеттинге из Ли Юэ, где воробей-оборотень открывает ресторан, чтобы осуществить свою мечту. Разработчики заявили, что игра «раздулась» и они принимают критику, завершая разработку DLC5.\nСтатистика показывает, что популярность главной героини резко выросла, поднявшись на 38 позиций в ежегодном рейтинге."
andrius.1017.a:0"Хозяйка не для того, чтобы её есть!"

andrius.1018.t:0"День труда!"
andrius.1018.d:0"После того как споры о будущем курсе утихли, мы объявили День труда официальным праздником и заранее подготовили план празднования. Сегодня наступил День труда, и мы запустили подготовку, которая длилась почти две недели.\nТрудящиеся получили почти недельный оплачиваемый отпуск, что дало им возможность участвовать в наших мероприятиях. Улицы украшены, прохожие останавливаются, чтобы посмотреть на грандиозные первомайские демонстрации. Организованные правительством демонстранты несут транспаранты с лозунгами «Строим лучшую жизнь», «Исцелим раны войны» и размахивают нашими флагами. На них маленькие красные треугольники, символизирующие тему Дня труда: труд, отдых и развлечения.\nПо всей нашей территории проходят различные культурные мероприятия, от детей до стариков, с целью не только развлечь, но и пропагандировать величие труда. Первое — это главное.\nМногие интеллектуалы, которые никогда не работали физически, также приняли участие в общественных работах (для получения партийного стажа или чтобы почувствовать тяжесть труда). После работы все вспотели, но улыбались.\nВ последний день праздника Генеральный секретарь Беннет вместе с народом наблюдал за первомайским парадом. Стройные и мужественные солдаты маршировали, демонстрируя, что эти особые трудящиеся готовы защищать наши плоды. Вокруг раздавались оглушительные аплодисменты."
andrius.1018.a:0"Я сплю по четырнадцать часов в день!"
andrius.1018.b:0"Да здравствует трудолюбивый и храбрый народ Мондштадта!"

andrius.1019.t:0"День труда!"
andrius.1019.d:0"После того как споры о будущем курсе утихли, мы объявили День труда официальным праздником и заранее подготовили план празднования. Сегодня наступил День труда, и мы запустили подготовку, которая длилась почти две недели.\nМестные общины также провели демократические голосования, чтобы определить продолжительность выходных — от четырёх до девяти дней. Люди отдыхают семьями, гуляют в новых парках. На лужайках видно, как дети резвятся, а в воздухе летают мыльные пузыри.\nНародные представители, которые никогда не отдыхают, сегодня заняты — они ходят по домам с опросами, пожимают руки, аплодируют на чужих свадьбах, чтобы завоевать голоса.\nНа третий день праздника прошли «воспитательные субботники», когда родители учили детей убирать мусор, чтобы они почувствовали тяжесть труда. Однако дети восприняли это как новую игру. Некоторые родители просто сами убрали всё, пока дети сидели в сторонке.\nВ последний день праздника профсоюзы и местные власти устроили грандиозные демонстрации, показывая плоды нашего труда. Однако некоторые протащили свои лозунги вроде «Шестичасовой рабочий день», «Закон о сладких цветочных курицах», «Шампунь из Спрингвейла» и «Больше уличных фонарей»."
andrius.1019.a:0"Кто посмел беспокоить меня в восемь утра в День труда!?"
andrius.1019.b:0"Да здравствует трудолюбивый и храбрый народ Мондштадта!"

andrius.1020.t:0"День труда!"
andrius.1020.d:0"После того как споры о будущем курсе утихли, мы объявили День труда официальным праздником и заранее подготовили план празднования. Сегодня наступил День труда, и мы запустили подготовку, которая длилась почти две недели.\nПо нашим правилам, праздник должен длиться семь дней, но сейчас ведутся споры о том, что такое «день»: некоторые пытаются доказать, что семь дней на самом деле равны девяти... Такие споры часто возникают в народе и, возможно, связаны с нашей идеологией.\nНекоторые художники и активисты организовали акцию «От основ до могилы» — бесплатные уроки игры на губной гармошке в парке. Их стало так много, что они переехали на улицу, и оттуда доносится музыка. Таких мероприятий много, и не все они безвредны — уборщикам пришлось работать сверхурочно, так как некоторые пытались «творить» через вандализм.\nНекоторые провели «трудовые игры», обучая детей через игру. Однако дети нашли игры слишком幼稚, а взрослые — наоборот, увлечённо играли, как в парке аттракционов.\nНаконец, по инициативе центрального правительства художники (профессионалы и любители) провели семидневную выставку. Опросы показали, что работы любителей пользуются большей популярностью. Возможно, дело в словах Беннета о работах профессионалов: «Что это за хрень?»"
andrius.1020.a:0"Обновите! День труда не повод для мангак не рисовать!"
andrius.1020.b:0"Да здравствует трудолюбивый и храбрый народ Мондштадта!"

andrius.1021.t:0"Сон о ветре и цветах..."
andrius.1021.d:0"Сегодня Праздник ветра и цветов. Точнее, это второй Праздник ветра и цветов, который мы, беженцы, отмечаем после ухода из дома. В прошлый раз мы были заняты едой и жильём и не могли позволить себе праздновать.\nТеперь мы прочно обосновались в Вольфендоме, у нас есть запасы продовольствия, и люди больше не спят на земле. Настало время отметить наш успех и показать плоды труда.\nВ этом ещё бедном месте мы не можем украшать города гирляндами, как в Мондштадте, и не хватает ветряных крыльев, но мы нашли новые способы празднования. Из дерева делают простые музыкальные инструменты и играют на улицах, из ягод делают краски и украшают дома и лица. Праздничное настроение ничуть не хуже.\nВ праздник охотников особенно много — это способ совместить традиционные «лучные состязания» с ловлей лис и отпусканием их с венками на удачу в любви. Теперь у каждой лисы в лесу на голове венок.\nПразднование — это и надежда на будущее, и прощание с прошлым. Гражданская война продолжается, и многие гибнут. Есть акции по разбрасыванию одуванчиков в память о погибших. Каждый из нас потерял в этой войне слишком много: родных, дома, счастливую жизнь... Но мы не остановимся. Мы своими руками отстроим дом и вернём счастье. А те, кто вверг нас в это, возможно, когда-нибудь заплатят.\nВ конце праздника жители Вольфендома выбрали свою «Звезду Праздника ветра и цветов». Нашей звездой стал(а)..."
andrius.1021.a:0"Беннет!"
andrius.1021.b:0"Фишль!"
andrius.1021.c:0"Диона!"
andrius.1021.e:0"Рэйзор!"

andrius.1022.t:0"Сон о ветре и цветах..."
andrius.1022.d:0"Сегодня Праздник ветра и цветов. Это наш второй праздник в Вольфендоме. Гражданская война всё ещё продолжается.\nВольфендом теперь в цветах, в воздухе разлиты звуки музыки и смех. У нас достаточно ресурсов для обычных праздничных мероприятий, и этот «прогресс» радует людей.\nИз-за сокращения дичи «лунные состязания» теперь не охота. Раньше они символизировали историю освоения Мондштадта; теперь они также символизируют нашу недавнюю историю возрождения и строительства. Возможно, когда-нибудь это значение станет частью традиции.\nПовсюду проходят представления, искусство со всего Тейвата, включая танцы из Сумеру. Рэйзор выступил со своими волками, заслужив аплодисменты. Волки, принявшие людей, теперь тоже хорошо живут — все они располнели. Хотя некоторые говорят, что это ограничивает свободу диких животных, волки, кажется, не против.\nКак и в прошлом году, мы провели поминовение погибших в войне, но теперь оно организовано центральным правительством. Среди летящих одуванчиков и кружащихся анемонов печаль сменяется гневом. В Вольфендоме распространяется новое мнение: все остальные силы в войне — лишь отвратительные палачи, и кто бы ни победил, Мондштадт не обретёт светлого будущего. Это будущее мы должны построить сами.\nЖители Вольфендома больше не считают себя беглецами. Они храбры и добры, и их храбрость и доброта ведут их к борьбе. Народ жаждет боя. Народ призывает к войне."
andrius.1022.a:0"Если они не хотят мира, мы заставим их быть мирными!"
andrius.1022.b:0"Мирное будущее куётся оружием."

andrius.1023.t:0"Сон о ветре и цветах..."
andrius.1023.d:0"Сегодня Праздник ветра и цветов.\nГражданская война окончена. Храбрый и добрый народ Мондштадта вернул миру и свободу. Теперь нет грохота пушек, но есть новые проблемы: восстановление общества и порядка. Хотя это трудно, жизнь уже лучше.\nПод влиянием нашего опыта в Вольфендоме, в Праздник ветра и цветов появилась новая традиция: писать пожелания умершим и надежды на будущее на бумажках, делать из них «гигантские одуванчики» и отправлять их по ветру.\nПрошлые страдания заставляют ценить настоящее. После праздника люди готовы продолжать строить будущее.\nВозможно, когда-нибудь люди будут вспоминать Праздник ветра и цветов как день памяти погибших в гражданской войне."
andrius.1023.a:0"Ветер приносит новые истории, время превращает их в мифы."
andrius.1023.b:0"Старые истории приходят с ветром и прорастают во времени."
andrius.1023.c:0"Всё становится мифами и легендами, которые никогда не умирают..."

andrius.1024.t:0"Праздник фонарей?"
andrius.1024.d:0"Хотя это немного странно, мы действительно празднуем Праздник фонарей из Ли Юэ. После войны Мондштадт начал культурный обмен с соседями, и Праздник фонарей был признан «передовой культурой» и введён.\nИз-за отсутствия плавучего камня правительство не организовывает строительство гигантских фонарей, но богачи закупили его в Ли Юэ и наняли рабочих для строительства фонарей. Хотя это выглядит странно, это их право тратить деньги.\nВажнее, чем копировать фонарики, — внедрение передовой культуры Ли Юэ. Мы выделили ключевые понятия: верность, сыновняя почтительность, покорность... и пропагандируем их через культурные мероприятия, что должно способствовать стабильности и в конечном итоге помочь населению.\nВ конце концов, после войны нам особенно важно подчеркнуть возвращение к семейным ценностям и стабильности.\nБыло предложение пригласить рок-певицу из Ли Юэ Синь Янь, но его отклонили из-за её слишком радикальных и бессмысленных взглядов, не соответствующих духу Мондштадта."
andrius.1024.a:0"Пламя передаётся по наследству, добродетель не угасает."

andrius.1025.t:0"Праздник фонарей?"
andrius.1025.d:0"Сегодня в Мондштадте можно увидеть странное явление: люди делают фонарики в стиле Ли Юэ, а магазины проводят распродажи. Давайте посмотрим, что происходит!\nОказывается, традиционный праздник Ли Юэ прижился в свободном Мондштадте. За несколько недель до этого информация о нём просочилась в СМИ: журналы публиковали истории о фонарях, газеты описывали традиции, а реклама рекламировала «функции» фонарей для привлечения удачи.\nГенеральный директор компании «Солёные воды», выкупившей административные права на Спрингвейл, заявил, что Праздник фонарей может стать новой точкой экономического роста, стимулируя потребление, производство и создание рабочих мест, а также способствуя конкуренции и эффективному распределению ресурсов."
andrius.1025.a:0"Где купить дешёвые товары к Празднику фонарей? Сейчас расскажет наш корреспондент..."

andrius.1026.t:0"Возвращение ветра, вино, праздник."
andrius.1026.d:0"Наступил Праздник возвращения ветра и вина. Но у нас нет прошлогоднего вина, чтобы открыть его и пригласить Барбатоса, наши вина либо остались далеко, либо были уничтожены. Можно сказать, это «Праздник без бога ветра».\nБез вина люди начали искать другие радости: встречу урожая и участие в ярмарках. Изначально идея ярмарки была народной, но теперь её возглавляет наше правительство. На ярмарке продаются поделки и еда от частных производителей и общин. Однако были жалобы на некачественное самогонное вино, значит, нужно усилить контроль.\nЭтот праздник отличается от прежних не только отсутствием выдержанного вина, но и нашими инновациями. За несколько дней до него нам поступили тысячи предложений, и с помощью демократической процедуры мы решали, какие из них реализовать. Теперь в каждом здании правительства можно увидеть новые мероприятия, рождённые народной фантазией."
andrius.1026.a:0"Ой, это подарок?"

andrius.1027.t:0"Рэйзор среди народа"
andrius.1027.d:0"Рэйзор до сих пор не знает имён своих родителей, их лиц, их характера. Он знает о них только то, что они существовали.\n«Господин Рэйзор, ваша очередь говорить», — сказал кто-то.\n...Но он не чувствует себя одиноким. Он стоит на трибуне и оглядывает небольшую комнату. Здесь много людей: политические противники, союзники, общественные активисты, представители предпринимателей... За последнее время он своим трудом и талантом завоевал многих, но многие всё ещё против него, и, возможно, никогда не станут его друзьями.\nНо он не боится противников. Он знает, что у него есть друзья и за пределами этой комнаты. Они наслаждаются праздником, ходят по ярмаркам, пьют, пишут предложения, воспитывают детей... у него много друзей, и их будет всё больше.\n«Мама, папа», — подумал он."
andrius.1027.a:0"«Теперь я сражаюсь за моих “Лупика”»."

andrius.1028.t:0"Мы вернули свободу на родину!"
andrius.1028.d:0"Сегодня великий день. Сегодня день окончания гражданской войны и возвращения единства Мондштадта. Это конец наших страданий и первый шаг к светлому будущему. Народ наконец получил свободу ходить по своей земле и право построить счастливую жизнь своими руками.\nСегодня мы чествуем храбрых солдат, аплодируем трудолюбивым производителям, радуемся будущему и скорбим о павших. Несколько лет назад злодеи, предавшие Мондштадт, развязали войну, и мы были вынуждены бежать в Вольфендом. Тогда никто не воспринимал нас всерьёз, нас гоняли как мячик, и если бы не милосердие Рэйзора, мы бы стали одними из безымянных жертв войны.\nТеперь мы вырвались из Вольфендома, наши солдаты прошли по каждому уголку Мондштадта, наши флаги развеваются на самой высокой точке, а те, кто заставлял нас страдать, теперь у наших ног. Мы отвоевали мир, свободу и достоинство! И мы отдадим этот мир, свободу и достоинство каждому нашему соотечественнику!\nМы стали легендой, нашу победу называют чудом. Наша история войдёт в анналы, как история Веннессы, и через тысячу лет её будут петь барды!\nНаша цель — не бомбами создать «новый порядок», а вернуть Мондштадту мир и свободу. Эта цель ещё не достигнута, и мы даже не приблизились к её началу. Для этого мы будем проводить нашу волю по всему Мондштадту. Пусть противники продолжают шуметь, мы продолжим мчаться к лучшей жизни!"
andrius.1028.a:0"Война окончена, мир наступил!"
andrius.1028.b:0"Да здравствует мир! Да здравствует свобода! Да здравствует народ Мондштадта!"

andrius.1029.t:0"Трудовой герой Ульфа"
andrius.1029.d:0"Сегодня мы расскажем о герое. Этот герой не на поле боя, а в тылу — простой рыбак. Не благородного происхождения, не обладатель Глаза Бога, а один из нас. Это Ульфа, трудовой герой.\n«На самом деле, я не умел плавать до приезда в Вольфендом, — сказал Ульфа корреспонденту. — Я строил лодки на озере Сидра, и все они тонули. В Вольфендоме другие рыбаки научили меня строить лодки и ловить рыбу. Я постоянно совершенствовался, обменивался знаниями и получил эту награду».\nУльфа усердно работал и часто был лучшим по улову. Он охотно делился секретами с коллегами: «Одних знаний мало. Нужна решимость и постоянство».\nКоллеги также хвалили его за доброту и смелость. Однажды он спас тонущую мисс Флору.\n«Хо-хо, Ульфа всегда быстр в действиях», — сказала потом Флора.\n«В такой ситуации каждый захотел бы помочь. Но одного желания мало! — сказал Ульфа. — Нельзя уклоняться, нужно действовать. Если есть желание, возможность и долг, почему бы не сделать?»\nУльфа любит своё дело, стремится к совершенству, трудолюбив и готов к самопожертвованию. В своей простой работе он добился необычайных результатов, создав гимн труду в нашем строительстве. Честь ему!"
andrius.1029.a:0"Мечты человечества едины."

andrius.1030.t:0"Боевой герой Эйлин"
andrius.1030.d:0"Нельзя... падать здесь.\nЭйлин с трудом встала, и несколько клинков направились на неё.\nОна вся в крови, в руке только короткий железный меч. Она тяжело дышит, обливается потом, сил нет.\n«Все ждут меня... Отец, его болезнь не прошла, больше некому зарабатывать... В отряде некому командовать... Я должна защищать всех...» — пронеслись в её голове обрывки мыслей.\nОна услышала шаги вражеского офицера: «У нас нет ресурсов для пленных, прикончите её».\nОна услышала, как взводят курки, и страх смерти сжал её сердце.\nВ страшной боли она взмахнула мечом —\n— Огонь обвил клинок и вырвался вихрем!\n...Когда Эйлин пришла в себя, все враги лежали поверженными, а в руке она сжимала алый самоцвет. Глаз Бога Пиро снизошёл к ней в этот момент.\n«Вот как это решается... Если у меня есть такая сила...»"
andrius.1030.a:0"Война начинается людьми, и люди могут её закончить."
andrius.1030.b:0"Если вы видите этот вариант, значит, здесь ошибка.\nFROM:[FROM.GetNameDef] ROOT:[ROOT.GetNameDef] PREV:[PREV.GetNameDef]"

andrius.1031.t:0"Борьба с оппозицией"
andrius.1031.d:0"Теперь наша фракция считается лидером Вольфендома, и остальные лидеры согласны сотрудничать с нами. Однако оппозиция всё ещё существует, они не верят, что мы можем построить достойный Вольфендом, распространяют дезинформацию и сеют хаос, как будто результаты выборов — фальшивка.\nРади стабильности Вольфендома мы должны что-то сделать с этими смутьянами. Что нам делать?"
andrius.1031.a:0"§RРасстрелять всех!"
andrius.1031.b:0"Арестовать ключевых членов!"
andrius.1031.c:0"Просто критиковать их в прессе."

andrius.1032.t:0"Либертарианские террористы!"
andrius.1032.d:0"Сегодня потрясло Вольфендом: группа экстремальных либертарианцев, отвергающих нашу политику, напала на дом одного из наших чиновников и убила его жену и мать. Уцелела только маленькая дочь. Весть быстро распространилась, и наша способность защищать народ подверглась сомнению.\nНачалась масштабная операция по поимке преступников, чтобы доказать нашу силу."
andrius.1032.a:0"Почему это случилось?"

andrius.1033.t:0"Террористы-реакционеры!"
andrius.1033.d:0"Сегодня потрясло Вольфендом: группа реакционеров, отвергающих нашу политику, напала на школу. Ополченцы прибыли быстро, но один ребёнок погиб, и несколько детей пострадали. Весть быстро распространилась, и наша способность защищать народ подверглась сомнению.\nНачалась масштабная операция по поимке преступников, чтобы доказать нашу силу."
andrius.1033.a:0"Бесчеловечно!"

andrius.1034.t:0"Левые партизаны!"
andrius.1034.d:0"Сегодня потрясло Вольфендом: группа левых радикалов атаковала здание правительства. Они никого не убили, просто взорвали все туалеты в здании. Почти целый день из здания шёл ужасный запах. Весть быстро распространилась, став поводом для шуток.\nХотя прямых потерь не было, это сильно подорвало наш авторитет и стабильность."
andrius.1034.a:0"Как же воняет!"

#35号事件不做

andrius.1036.t:0"Возвращение"
andrius.1036.d:0" — Мы вернулись. Мы, народ Мондштадта, победили всех реакционных врагов и вернули себе власть.\nГоспожа Диона, как лидер нашей борьбы, хотя и была обманута врагами, именно она повела нас против новых врагов, рождённых среди нас, вернув свободу народу Мондштадта.\nСвобода... История Мондштадта — это путь от низшей свободы к высшей. Теперь мы поднялись ещё на одну ступень. Как когда-то после падения Короля Башен власть захватили аристократы, а Веннесса победила старую аристократию.\nПоначалу, приехав в Вольфендом, мы думали, что трудности ограничатся строительством жилья, едой и организацией правительства. Потом мы столкнулись с необходимостью защищать себя и развиваться. Затем — с необходимостью победить военачальников и объединить Мондштадт. Мы преодолели и это, но в будущем обязательно возникнут новые препятствия.\nНо, как мы видим сейчас, эти препятствия станут лишь ступеньками. Испытания делают нас сильнее, чем другие страны, не прошедшие через это.\nНаша великая §RМондштадтская Народная Республика§b будет шаг за шагом подниматься по этим ступеням, достигать вершин и видеть прекрасные пейзажи, недоступные другим."
andrius.1036.a:0"Солнце снова встаёт."

andrius.1037.t:0"Частичная приватизация гражданской промышленности?"
andrius.1037.d:0"В ходе нашего строительства Мондштадта мы сталкивались с бесчисленными разногласиями. Поступали разные предложения. Одно из них: приватизировать часть гражданской промышленности, например, текстильную, чтобы облегчить административную нагрузку. Это вызвало бурные дискуссии. Сколько сторонников, столько и противников.\nКак нам отреагировать на эту волну?"
andrius.1037.a:0"Можно попробовать."
andrius.1037.b:0"Мы должны сохранить широкую государственную собственность."
andrius.1037.c:0"Дайте мне список ключевых членов обеих фракций."

andrius.1038.t:0"Пределы национализации"
andrius.1038.d:0"В ходе нашего строительства Мондштадта мы сталкивались с бесчисленными разногласиями. Одно из предложений: полностью национализировать часть отраслей, чтобы они находились под прямым контролем правительства, облегчая контроль над ключевыми отраслями, ускоряя инфраструктурные проекты и стимулируя занятость.\nЭто предложение имеет смысл, но вопрос в том, до какой степени проводить национализацию. Некоторые считают, что чрезмерная национализация вредна для свободного рынка и создаёт ненужное бремя для бюджета."
andrius.1038.a:0"Национализировать только самое важное."
andrius.1038.b:0"Национализировать электроэнергетику, водоснабжение, транспорт, металлургию и другие отрасли, не ориентированные на краткосрочную прибыль."
andrius.1038.c:0"Кроме того, национализировать высокодоходные отрасли, например, табачную, для пополнения бюджета."
andrius.1038.e:0"Наши государственные предприятия должны монополизировать большинство отраслей."

andrius.1039.t:0"Тебя обманули"
andrius.1039.d:0"Несмотря на внутреннюю радость, Диона по привычке изобразила недовольство.\nВ этой комнате много людей: консерваторы, предприниматели, представители общественности. Казалось бы, Диона заручилась поддержкой всего Вольфендома. Теперь у неё мощная команда советников, их обширные знания помогут ей.\nНекоторое время она поддерживала курс Беннета, но, поразмыслив, побоялась, что он слишком радикален. Поэтому она здесь, как «вторая линия», чтобы вести народ к светлому будущему через переговоры.\nСамое трудное позади, подумала Диона, нужно двигаться вперёд!\nНо она не видела, как в тени люди обменивались усмешками..."
andrius.1039.a:0"В чём дело?"

andrius.1040.t:0"Ошибки в промышленной автономии"
andrius.1040.d:0"На нашем пути возникла новая проблема: после внедрения заводской демократии, участия руководства в труде, рабочих в управлении, реформирования устаревших правил и объединения рабочих, руководителей и техников, многие заводы показали небывалый рост производительности и качества, появились новые технологии —\n— но на многих других заводах возникли проблемы:\nНа некоторых заводах рабочие добровольно отказались от демократии, доверившись лидеру, создав патриархальную систему;\nНа других заводах образовались группировки, оттесняющие посторонних, что привело к появлению «рабочей аристократии»;\nНа третьих заводах сформировались клики, намеренно снижающие производственные показатели, чтобы получать больше льгот...\nКак решить эти проблемы? Правильный ли мы выбрали путь?"
andrius.1040.a:0"Нужно притормозить, возможно, мы что-то упустили..."
andrius.1040.b:0"Вернуться к старой системе единоначалия и материального стимулирования."
andrius.1040.c:0"Путь тернист, но направление верное."

andrius.1041.t:0"Рост ожирения..."
andrius.1041.d:0"На нашем пути к лучшей жизни появилось новое препятствие: ожирение. Во время восстановления Мондштадта производство продуктов питания постоянно росло, и потребление тоже, а теперь растёт и уровень ожирения.\nОжирение приводит к хроническим заболеваниям, ухудшая здоровье населения. Некоторые смертельные болезни можно лечить элементальной магией, а некоторые неизлечимые — алхимией. Но в Тейвате нет лекарства от диабета.\nКонечно, ожирение означает, что уровень недоедания снизился, и можно ожидать, что следующее поколение будет умнее и выше, что неплохо.\nКак нам реагировать?"
andrius.1041.a:0"Добавить баллы за физкультуру на вступительных экзаменах!"
andrius.1041.b:0"Пропагандировать здоровый образ жизни!"
andrius.1041.c:0"Провести кампанию за здоровье, вдохновляя людей на регулярные тренировки!"
andrius.1041.e:0"Обложить налогом производителей вредной пищи и инвестировать в здоровую еду!"

andrius.1042.t:0"Снижение ожирения"
andrius.1042.d:0"На нашем пути к лучшей жизни был достигнут выдающийся успех, по крайней мере, так пишут газеты: статистика показывает, что уровень ожирения снизился. Это, очевидно, связано с увеличением количества рабочих мест во время восстановления, и люди, которые раньше бездельничали, теперь занимаются физическим трудом, сбрасывая лишний вес.\nПреимущества снижения ожирения очевидны: это соответствует современным представлениям о красоте, снижает риск хронических заболеваний, а подтянутые работники явно эффективнее полных."
andrius.1042.a:0"Так держать!"
andrius.1042.b:0"Но как же пухлость? Мне не нравятся такие худые."

andrius.1043.t:0"Волна пришла"
andrius.1043.d:0"Сегодня наши войска вошли в Мондштадт, водрузив флаг над штаб-квартирой бывшего Ордена Рыцарей, объявив о взятии города. Поскольку многие в нашей армии — бывшие жители Мондштадта, оккупация не встретила сопротивления.\nПо сравнению с другими силами, Орден Рыцарей казался не столь «злодейским», но он показал свою неспособность защищать народ и обеспечивать свободу. Поэтому мы заменили их. К тому же, сколько может существовать военное правительство?\nЕсли наша победа над владениями Гуннхильдр доказала, что мы можем бороться за власть, то взятие Мондштадта заставило замолчать оставшихся военачальников. Если мы смогли войти в город, который Лоуренсы не могли взять годами, то кто сможет нас остановить?\nНаша сила исходит из народного желания мира и свободы. Это желание превратилось в непреодолимую волну. Волна идёт на военачальников."
andrius.1043.a:0"Мы наконец вернулись домой!"
andrius.1043.b:0"Война действительно заканчивается..."
andrius.1043.c:0"Вперёд, вперёд, вперёд!"

andrius.1044.t:0"Прорыв блокады"
andrius.1044.d:0"Сегодня, после нескольких дней осады среди виноградников, наши войска прорвали оборону «Виноградника Рассвет» и вошли в центр владений Гуннхильдр.\nПод испуганными взглядами слуг и чиновников мы объявили о политике оккупации. Простые работники освобождены, а некоторые офицеры арестованы. Хозяин поместья бежал с войсками, но взятие «Виноградника Рассвет» — это крупная победа.\nКогда мы объявили войну владениям Гуннхильдр, весь Мондштадт смеялся над нами. Теперь наши враги будут поражены нашей силой и мужеством. Эта победа нанесла серьёзный удар по силе, которая держала нас в осаде, и показала миру: мы не трусливые собаки, мы волки, вырвавшиеся из Вольфендома на свободу."
andrius.1044.a:0"Никто больше не загонит нас в клетку!"
andrius.1044.b:0"Война заканчивается?"
andrius.1044.c:0"Скорее раздувай огонь, пока он горяч, только так можно победить!"

andrius.1045.t:0"Я — волна"
andrius.1045.d:0"Сегодня наши войска водрузили флаг над самым роскошным замком Лоуренсов, взяв «столицу» этих зачинщиков войны.\nПосле зачистки последних очагов сопротивления мы навели порядок и провели облаву. Затем, под взглядами жителей, мы устроили парад у замка, объявив о «крупной победе освободительной войны», а затем взорвали замок.\nНаш журналист написал: «Этот замок построен не на славе. Его первый владелец был предателем, а вся его красота и величие основаны на страданиях народа Мондштадта — наших погибших в войне. Вот почему мы его разрушили».\nРазрушение замка — это как шах и мат в шахматах. Как долго эти реакционеры могут продержаться? Этот срок войдёт в историю. Если он будет коротким, то станет историческим анекдотом.\nЭта победа и все предыдущие показывают миру нашу силу, мудрость и мужество. Мы — неудержимая волна, мы — сама волна!"
andrius.1045.a:0"Мы отомстили за наших близких!"
andrius.1045.b:0"Война действительно заканчивается."
andrius.1045.c:0"Это последняя борьба, объединимся до завтра..."

andrius.1046.t:0"Театр крови, взывающий к крови"
andrius.1046.d:0"«Вот история героев Вольфендома и Мондштадта!»\nПосле этих слов кроваво-красный занавес опустился. Люди в багровом театре захлопали своими толстыми руками и пронзительно закричали. Они были одеты в тёмно-красное и носили ржаво-красные шляпы. За их спинами горел розовый свет, отбрасывая длинные тени.\n«Священная комедия!» — говорили все.\n«Великая история!» — кричали все.\n«Эпос героев!» — восклицали все.\nНо никто не сожалел о конце истории. Все знали, что такие истории будут повторяться в театре снова и снова, как и в последние тысячелетия.\nСколько бы лет ни прошло, они всегда будут видеть в этом кровавом театре великих людей и храбрых героев, танцующих как лепестки на ветру под действием идеалов, желаний и прошлого, и падающих на землю с глухим стуком. В такие моменты они смеялись, как будто это доказывало их превосходство над героями.\nНо одного у них было больше, чем у героев, — свободы.\nИстории героев, история народа Мондштадта, история этого мира... это лишь бесконечно повторяющиеся трагикомедии в этом театре. Они повторялись в прошлом и будут повторяться в будущем."
andrius.1046.a:0"История этого мира — лишь кукольный театр судьбы."
andrius.1046.b:0"Герои мира танцуют под рукой судьбы."

andrius.1047.t:0"Возвращение в Вольфендом"
andrius.1047.d:0"Слушая смех издалека, Диона снова повернулась.\nЭто холм, покрытый свежей зеленью. На росистой траве стоит большая группа людей со всего Мондштадта. Разные профессии и статусы, но две общие черты:\nПервая: они противники нынешнего порядка в Мондштадте.\nВторая: все выше Дионы.\n«Нам пора. Такое положение дел — результат наших прошлых ошибок. Теперь... мы станем «беженцами» и снова перевернём мир», — сказала Диона, повзрослевшая и умудрённая опытом. — «Теперь мы будем бороться с врагом, которого сами создали. Он сильнее и хитрее, и для победы нам понадобится больше времени и усилий... Но раз вы здесь, у вас есть воля.»\n«Может, сначала выпьем?» — пошутил кто-то.\n«Вы, пьяницы...» — покачала головой Диона. — «Я намешаю вам, когда мы придём на место!»\nОни ушли, их фигуры растаяли за холмом, а затем стихли и голоса.\nОни ушли, чтобы однажды «вернуться».\nНо, возможно... они никогда не вернутся."
andrius.1047.a:0"Возможно, они вернутся завтра."
andrius.1046.b:0"Дорога в тысячу ли начинается с первого шага..."

andrius.1048.t:0"Давным-давно..."
andrius.1048.d:0"«Три—»\n«Бабушка, — спросил ребёнок, держа бабушку за руку в тёплом солнечном свете, — что это за высокая колонна?»\n«Два—»\n«Дитя, — ласково ответила бабушка, — это не колонна. Это Звёздный Путь».\n«Один!»\nВ этот момент башня, стоящая между небом и землёй, засияла голубым светом, а затем из её вершины вырвался поток света. Все присутствующие и те, кто смотрел трансляцию, разразились ликующими криками!\n«Звёздный поезд покинул Тейват и улетел за пределы мира», — сказал диктор.\nНесколько лет назад величайшие учёные Тейвата изобрели «Звёздный Путь» — устройство для сверхскоростных путешествий по галактике. Теперь, в 2200 году новой эры, первый Звёздный поезд отправился в путь к звёздам."
andrius.1048.a:0"«Бабушка, я хочу стать первопроходцем!»"
andrius.1048.b:0"Через тернии к звёздам..."

andrius.1049.t:0"Вольфендом. Пролог"
andrius.1049.d:0"Издавна Вольфендом был одним из самых безлюдных мест Мондштадта. Мало людей — мало торговли и производства. Но что это здесь решает? Здесь правит не военное правительство, не купцы, не бюрократы и не учёные, а неизменный закон природы — выживает сильнейший.\nЕсли здесь и есть «лидер», то это §BРэйзор§b. Этот юноша, хоть и говорит с трудом, будучи обладателем Глаза Бога и вершиной пищевой цепочки, является «естественным правительством». Он тоже живёт охотой и мало контактирует с внешним миром.\nМногие годы в Вольфендоме царил мир, единственными конфликтами были природные. Мондштадт тоже был мирным. Даже война не интересовала никого в этом безлюдном и бесполезном месте.\nНо если у тебя есть дар предвидения... возможно, ты увидишь, что занавес этой великой драмы уже поднимается. Сможет ли Мондштадт сохранить мир? А если война начнётся, сможет ли Вольфендом остаться в стороне?\n...Возможно, у обитателей Вольфендома осталось не так много времени для мирной жизни.\nНа исторической сцене главные роли сыграют не только Рэйзор. В Гильдии искателей приключений §RФишль§b и §RБеннет§b также появятся на сцене истории, а в Спрингвейле уже маячит фигура §BДионы§b..."
andrius.1049.a:0"Прошу садиться, представление начинается!"
andrius.1049.b:0"Как тихо, в горах нет смутьянов..."

andrius.1050.t:0"Монстры против героев SLG"
andrius.1050.d:0"Сегодня вышло продолжение популярной AVG «Монстры против героев» — «Монстры против героев SLG», вызвавшее ажиотаж в магазинах.\nВ первой части героиня Лука разрушила планы «бога-творца» Яриис. В новой части, после смерти Яриис, баланс света и тьмы нарушился, возникло множество параллельных миров, и в хаосе родился «Увядающий».\nЧтобы противостоять Увядающему, игрок должен объединить мир, развивать технологии и производство, сделав его крепостью. В финале игрок выбирает путь спасения миров: сотрудничество с небесами («План Миндального Печенья»), с демонами («План Жены»), или, увидев конец обоих путей, принять помощь от «Кота Лапласа» и пойти «неизведанным путём».\nИгра получила высокие оценки, и разработчики уже анонсируют «Монстры против героев 2»."
andrius.1050.a:0"Вперёд, героиня Лука. Иди, чтобы положить конец концам..."

andrius.2001.t:0"Война грядёт!"
andrius.2001.d:0"Случилось то, чего мы все боялись: враг вступил на нашу землю. Те, кто бежал в Вольфендом от войны, снова готовятся к бою.\nНо на этот раз мы не будем бежать. Во всём Мондштадте больше некуда бежать. Наша подготовка окупится в предстоящих боях!"
andrius.2001.a:0"Наступил самый опасный час!"

