DOT_Space_Program_decisions:0 "Проект «Просвещение»"
DOT_Space_Program_decisions_desc:0 "«Просвещение» — это амбициозный проект по изучению мира за пределами неба. Человечество никогда не прорывалось сквозь фальшивое небо, установленное Первым богом. Это барьер, отделяющий Тейват от Бездны и ограничивающий наши горизонты. История Тейвата полна войн и страданий, а Морозные Гвозди — это наказание за человеческие амбиции. Но мы не должны отказываться от исследований. Используя науку и технологии, мы создадим аппараты, способные преодолеть фальшивое небо. По теории Жданова Циолковского, многоступенчатые ракеты смогут достичь нужной скорости и высоты. Тейват — это колыбель человечества, но человечество не должно оставаться в ней навсегда. «Просвещение» — это первый шаг к новому миру."
DOT_Space_Program_decisions_01:0 "Начать проект «Просвещение»"
DOT_Space_Program_decisions_01_desc:0 "Наша цель — построить корабль для полёта за фальшивое небо и оборудование для выживания в экстремальных условиях. Мы используем ресурсы и таланты со всего мира. Только так мы раскроем правду о Тейвате и противостоим врагам."
DOT_Space_Program_decisions_02:0 "Построить космическую базу"
DOT_Space_Program_decisions_02_desc:0 "Для «Просвещения» нужна космическая база для запуска ракет. Мы освободимся от оков Небесного Принципа и станем хозяевами своей судьбы."
DOT_Space_Program_decisions_03:0 "Первый космический эксперимент"
DOT_Space_Program_decisions_03_desc:0 "Первый космический эксперимент"
