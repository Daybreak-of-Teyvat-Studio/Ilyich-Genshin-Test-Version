 # 英霊召喚
 #############
 Ilyich_Keqing:"刻晴・英霊"
 Ilyich_Amber:"アンバー・英霊"
 Ilyich_Furina:"フリーナ・英霊"
 DVA_Dvalin:"嵐竜・ドヴァーリン"
 Ilyich_Sizhaoxing:"伝説の戦艦・アルコル"
 Ilyich_Sizhaoxing_tech:"伝説の戦艦・アルコル"
 Ilyich_Sizhaoxing_desc:"伝説の戦艦・アルコル"
 Ilyich_Sizhaoxing_tech_desc:"伝説の戦艦・アルコル"
 Ilyich_Sizhaoxing_equipment:"伝説の戦艦・アルコル"
 Ilyich_Sizhaoxing_1:"伝説の戦艦・アルコル"
 Ilyich_Sizhaoxing_1_equipment:"伝説の戦艦・アルコル"
 equipment_designer_Ilyich_Sizhaoxing:"伝説の戦艦・アルコル"
 Ilyich_Tech_decisions:"伝説の戦艦・アルコル"
 Ilyich_Tech_decisions_01:"伝説の戦艦・アルコル"
 Ilyich_Tech_decisions_02:"伝説の戦艦・アルコル"
 Ilyich_Tech_decisions_desc:"南斗光りて碧川に垂れ、孤舟月を載せて長天を行く。\n千年の星魂、滄海を凌ぎ、一棹清風万淵を鎮む。"
 Ilyich_Tech_decisions_01_desc:"南斗光りて碧川に垂れ、孤舟月を載せて長天を行く。\n千年の星魂、滄海を凌ぎ、一棹清風万淵を鎮む。"
 Ilyich_Tech_decisions_02_desc:"南斗光りて碧川に垂れ、孤舟月を載せて長天を行く。\n千年の星魂、滄海を凌ぎ、一棹清風万淵を鎮む。"
 DOT_Tech.3.t:"英霊召喚"
 DOT_Tech.3.d:"満たせ、満たせ、満たせ、満たせ、満たせ！\n我が身は汝の元に、汝の剣は我が命に預ける。天命の召喚に応えよ。この意思に従うならば、答えよ。ここに誓う。\n我は世のあらゆる善を成し遂げ、\n我は世のあらゆる悪を討ち滅ぼす。\n抑止の輪を越え、現れよ、天秤の守護者よ！"
 DOT_Tech.3.a:"ああああああああ"
