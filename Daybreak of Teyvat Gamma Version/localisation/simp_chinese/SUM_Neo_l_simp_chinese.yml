 SUM_Neo.205.b:"把风险压在柜子里"
 SUM_Neo.206.t:"黄金之梦"
 SUM_Neo.206.d:"黄金时代的梦被重新讲给须弥人听。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。"
