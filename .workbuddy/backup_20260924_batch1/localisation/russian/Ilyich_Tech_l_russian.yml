 # Хиличурлы
 #############
 Ilyich_Hilichurl:"Хиличурл"
 Ilyich_Hilichurl_equipment:"Хиличурл"
 Ilyich_Hilichurl:"Примитивные обитатели, бродящие по пустошам Тейвата. По облику похожи на людей, но лишены разума и духовности. Согласно записям, они бродят по этим землям более тысячи лет, не оставляя за собой ни истории, ни цивилизации. После тёмной катастрофы пятьсот лет назад они широко расселились по всему континенту. Несмотря на слабость и отсутствие организации, порой доставляют людям немало хлопот."
 Ilyich_Hilichurl_Support:"Поддерживающая рота хиличурлов"
 Ilyich_Hilichurl_Support_equipment:"Поддерживающая рота хиличурлов"
 Ilyich_Hilichurl_Support:"Примитивные обитатели, бродящие по пустошам Тейвата. По облику похожи на людей, но лишены разума и духовности. Согласно записям, они бродят по этим землям более тысячи лет, не оставляя за собой ни истории, ни цивилизации. После тёмной катастрофы пятьсот лет назад они широко расселились по всему континенту. Несмотря на слабость и отсутствие организации, порой доставляют людям немало хлопот."
