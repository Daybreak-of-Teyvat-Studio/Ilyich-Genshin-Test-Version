# 决议：七星请仙典仪
#####################
 LYY_Rite_of_Inviting_Decision_Begin:"§R开始七星请仙典仪§!"
 LYY_Rite_of_Inviting_Decision_End:"§R结束七星请仙典仪§!"
 LYY_Rite_of_Inviting_Decision_Add:"§R七星请仙典仪进度增加§!"
 LYY_Rite_of_Inviting_decision_categories:"七星请仙典仪"
 LYY_Rite_of_Inviting_decision_categories_desc:"璃月节庆之最著者，莫若「七星请仙典仪」。岩神岁岁亲临，传下囗谕，凡民循其意而行，则事事顺遂，不至逾越生乱。上古之世，璃月先民自农人中遴选代表，迎送岩神，献以丰厚之祭礼、肃穆之祝词，恭听神谕，布于众人：今年经营何向，种何谷，通何商，避何灾。凡此皆定，则民知所从，国以稳固。典仪之台设于黄金屋前，阶石九级，皆有旧痕。典仪之日，市肆早闭，万民束带而立，无声如山林。仙鹤衔书而下，群吏捧之而升，观者数千，屏息仰视。§Y七星请仙典仪进度：§!§R[?LYY_Rite_of_Inviting_Index]§!"
 LYY_Rite_of_Inviting_Decision:"§Y七星请仙典仪§!"
 LYY_Rite_of_Inviting_decision_01:"历史之神"
 LYY_Rite_of_Inviting_decision_01_desc:"收集£mora 摩拉肉、翡玉什锦袋、珍珠翡翠白玉汤。"
 LYY_Rite_of_Inviting_decision_02:"开拓之神"
 LYY_Rite_of_Inviting_decision_02_desc:"收集霓裳花、琉璃袋、绝云椒椒、清心、马尾、莲蓬。"
 LYY_Rite_of_Inviting_decision_03:"炉灶之神"
