 SWI_army_limitations_TT:0 "§RCannot train regular forces outside of Citizen Militias, and cannot edit existing templates outside of the Military Readiness decisions§!\n\n§YSwitzerland§! relies on their civilian population to take up arms when needed. A limited amount of militias can be trained, and they will have their §YOrganization§! initially capped.\n\nOnce the focus §Y$SWI_armed_neutrality$§! is completed, the militias will be able to be expanded, improved and eventually, deployed using the §Y$SWI_activate_militia$§! decision. While the militias are deployed, penalties to the Swiss economy will stack up over time, but they'll reset after they're recalled."
