 GRE_debt_to_the_ifc_2:0 "I.F.C.への債務"
 GRE_debt_to_the_ifc_2_desc:0 "ギリシャはI.F.C.（国際金融委員会。かつては大きな影響力を誇っていた組織で、現在はイギリス、フランス、イタリアのみが委員を務めている）に多額の借金を抱えている。I.F.C.は肥大化しているにも関わらず、加盟国らはギリシャが借金の全額を支払うことを望んでいる。つまり、借金を支払うか、他の方法をもって借金から逃れられない限り、我々の財布の紐はI.F.C.に握られた状態であるということだ。"
