 ITA_nuclear_research:0 "核研究"
 ITA_nuclear_research_desc:0 "我々は原子力開発の先駆けだ。まもなく、これこそが世界最大の軍事力となる日がやってくる。"
 ITA_offensive_in_ethiopia:0 "エチオピア侵攻"
