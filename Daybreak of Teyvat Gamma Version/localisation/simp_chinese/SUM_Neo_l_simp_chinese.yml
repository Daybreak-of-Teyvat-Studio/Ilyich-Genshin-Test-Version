 SUM_Neo_Info_Board:"须弥张榜"
 SUM_Neo_Info_Board_desc:"\n须弥势力重要信息公示\n\n此处汇总须弥此刻的核心机制数值，以及各轴当前等级所生效的国家修正。数值随国策、决议与事件即时变动，无需手动刷新，也不占用任何决议位，任何时刻都可以打开这里确认当下所处的等级。\n\n§Y神谕：§![?SUM-Oracle-Index]\n§W[SUM_Neo_Oracle_tier_name]§!\n§G[SUM_Neo_Oracle_tier_mods]§!\n\n§Y学院：§![?SUM-Canon-Index]\n§W[SUM_Neo_Canon_tier_name]§!\n§G[SUM_Neo_Canon_tier_mods]§!\n\n§Y共振：§!§W[SUM_Neo_Combo_combo_name]§!\n§G[SUM_Neo_Combo_combo_mods]§!\n\n两条轴各自决定一项国家修正，等级越高，修正越强。两条轴同时走高，还会额外触发一层共振修正，请注意同步推进。\n"
 SUM_Neo_SGD_Info_Board:"旅团张榜"
 SUM_Neo_SGD_Info_Board_desc:"\n镀金沙漠势力重要信息公示\n\n此处汇总镀金沙漠此刻的核心机制数值，以及各轴当前等级所生效的国家修正。数值随国策、决议与事件即时更动，不必手动刷新，也不占决议位，随时可翻开此板核对当下的档位。\n\n§Y赤王遗志：§![?SUM-SGD-Deshret-Index]\n§W[SUM_Neo_SGD_A_tier_name]§!\n§G[SUM_Neo_SGD_A_tier_mods]§!\n\n§Y旅团声望：§![?SUM-SGD-Eremite-Index]\n§W[SUM_Neo_SGD_B_tier_name]§!\n§G[SUM_Neo_SGD_B_tier_mods]§!\n\n§Y共振：§!§W[SUM_Neo_SGD_Combo_combo_name]§!\n§G[SUM_Neo_SGD_Combo_combo_mods]§!\n\n两条轴各自决定一项国家修正，等级越高，修正越强。两轴齐头并进，另有共振修正追加一层，推进时宜两头兼顾。\n"
 SUM_Neo_SDH_Info_Board:"哈德张榜"
 SUM_Neo_SDH_Info_Board_desc:"\n哈德拉玛维特势力重要信息公示\n\n此处汇总哈德拉玛维特此刻的核心机制数值，以及各轴当前等级所生效的国家修正。国策、决议与事件一变，这里的数值便跟着变，无须手动刷新，也不占任何决议位，想核对档位，随时打开来看。\n\n§Y花神遗泽：§![?SUM-SDH-Floral-Index]\n§W[SUM_Neo_SDH_A_tier_name]§!\n§G[SUM_Neo_SDH_A_tier_mods]§!\n\n§Y沙暴之威：§![?SUM-SDH-Storm-Index]\n§W[SUM_Neo_SDH_B_tier_name]§!\n§G[SUM_Neo_SDH_B_tier_mods]§!\n\n§Y共振：§!§W[SUM_Neo_SDH_Combo_combo_name]§!\n§G[SUM_Neo_SDH_Combo_combo_mods]§!\n\n两条轴各自决定一项国家修正，等级越高，修正越强。若两轴一并走高，共振修正还会再添一层，务必两轴同推。\n"
 SUM_Neo_SGS_Info_Board:"沙丘腾榜"
 SUM_Neo_SGS_Info_Board_desc:"\n沙丘腰带势力重要信息公示\n\n此处汇总沙丘腰带此刻的核心机制数值，以及各轴当前等级所生效的国家修正。数值跟着国策、决议与事件即时走，不必手刷，也不占决议位，当下到了哪一档，翻开这里一看便知。\n\n§Y灵光共鸣：§![?SUM-SGS-Pari-Index]\n§W[SUM_Neo_SGS_A_tier_name]§!\n§G[SUM_Neo_SGS_A_tier_mods]§!\n\n§Y赤沙遗珍：§![?SUM-SGS-Relic-Index]\n§W[SUM_Neo_SGS_B_tier_name]§!\n§G[SUM_Neo_SGS_B_tier_mods]§!\n\n§Y共振：§!§W[SUM_Neo_SGS_Combo_combo_name]§!\n§G[SUM_Neo_SGS_Combo_combo_mods]§!\n\n两条轴各自决定一项国家修正，等级越高，修正越强。两轴同时升上去，共振便多给一层修正，推的时候两边都别落下。\n"

