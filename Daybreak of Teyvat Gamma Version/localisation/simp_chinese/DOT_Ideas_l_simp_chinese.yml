The_Imprisoned_God_desc:0 "500年前的坎瑞亚灾厄期间，须弥的神明「大慈树王」失踪，教令院将新生的草神带回了须弥，并将其命名为「小吉祥草王」。然而，教令院以及大部分须弥人民的信仰依旧是「大慈树王」，作为继任者的「小吉祥草王」并未被完全认可，再加上「小吉祥草王」一直被贤者们软禁在「净善宫」，行动严重受限，导致许多须弥人都并未对她的存在太过重视，渐渐的，贤者们开始取代神明治理须弥。"
