 SUM_Neo.38.b:"先看住封印"
 SUM_Neo.39.t:"神权法典"
 SUM_Neo.39.d:"神权法典颁布，律法以草神之名施行。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。"
