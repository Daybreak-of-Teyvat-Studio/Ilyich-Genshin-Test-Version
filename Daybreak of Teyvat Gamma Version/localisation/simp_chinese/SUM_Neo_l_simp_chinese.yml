 SUM_Neo.113.b:"把权柄交还民间"
 SUM_Neo.114.t:"废黜大贤者"
 SUM_Neo.114.d:"大贤者被请出议事厅。走出门时，没有人替他说话。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。"
 SUM_Neo.114.a:"按学派议决行事"
 SUM_Neo.114.b:"听从乡野的呼声"
 SUM_Neo.115.t:"学派推举"
 SUM_Neo.115.d:"六大学派推举新的首座，票数公开。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。"
 SUM_Neo.115.a:"以律法为绳"
 SUM_Neo.115.b:"以人情为度"
 SUM_Neo.116.t:"学者考成"
 SUM_Neo.116.d:"学者的升迁改由考成决定，出身不再作数。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。"
