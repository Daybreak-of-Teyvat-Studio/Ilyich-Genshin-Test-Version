 Third-Round_Knockout:0 "Three Bowls, Can't Cross the Port"
 Thunder_and_Eternity:0 "Thunder and Eternity"
 Thunder_and_Eternity_desc:0 "Thunder and Eternity: Crossing endless thunderstorms, step onto the islands blessed by red maples and cherry blossoms, amid the surrounding sandbanks, towering cliffs, and secluded forests, witness the eternity sought by the Almighty Shogun of the Grand Narukami Shrine."
