 SUM_Neo.300.t:"大舰巨炮"
 SUM_Neo.300.d:"舰队选了巨炮一路，口径比邻国更大。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。"
