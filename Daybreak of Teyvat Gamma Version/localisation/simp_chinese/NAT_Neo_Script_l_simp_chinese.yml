 # 81. Against the Grain
 NAT_Event.81.t:"代价几何"
 NAT_Event.81.d:"新国初立，税吏带木尺入沃陆之邦谷场，挨家量颗粒果之收成，量一垄记一笔。征兵木牌挨家贴上，点走各家儿郎。界碑新立，青石面犹泛白。老猎手蹲碑边，以烟斗敲石面道：「从前吾追猎物走，翻三座山无人问；今过一道界碑，须验三回。」子攥弓立其后，闷声道：「粮要交，丁要出，那猎物犹算不算咱的？」税吏抱账册上前，涨红脸道：「不立税、不出丁，深渊打来，拿甚么挡？」老猎手将烟斗往鞋底一磕：「那也莫把祖宗走之路，一刀截断。」两人对界碑各不肯让。主事者蹲身，捻碑边之土，伸手接子手中征兵木牌，翻至背面，以炭条添一行小字，复递还他，道：「路留一段，税亦照交。先这么办。」老猎手盯那行字，半晌无言，末了将烟斗别回腰间，扛弓，头一个往山里去。"
 NAT_Event.81.a:"火神恩重难偿"
 NAT_Event.81.b:"矢志输诚"

 # 纳塔之春

 NAT_Event.82.t:"基尼奇掌纳塔卫"
 NAT_Event.82.d:"圣火底下教场，军士列得笔直。护国本门当众宣任命：基尼奇就任护国之职，主持息兵分室，统辖全境巡防、飞骑与戒严诸部，一令下去便可定人生死。此任命乃玛薇卡亲准。军士齐举拳，呼声震得竞技场石阶直颤。基尼奇面朝圣火立誓：「凡动摇纳塔纲纪者，凡私通深渊、妄议圣火者，一律押入息兵分室，从严处置，绝无宽贷。」誓词一落，全境戒备立紧，禁言之令随之下，异动部族、越格之言、私斗之徒，尽列搜捕名册。飞骑连夜整装，铁甲于火光中泛冷光。队尾一老兵望高悬之日头，低声叹道：「日头恁高，影子已生出来矣。」亦有人于人群接口道：「后世自有评说。」基尼奇闻之，只回一句：「顺圣火者活，逆圣火者亡。」转身走下教场，顺手将案上名册翻至第一页，以朱笔于头一个名字上圈了一圈。"
 NAT_Event.82.a:"天无二日"
 NAT_Event.82.b:"忠贞不贰"
 #文言文翻译腔（即把古文硬译成现代汉语的那种生硬、逐字对应、保留虚词语序的风格）

 NAT_Event.83.t:"恰斯卡统纳塔飞骑"
 NAT_Event.83.d:"长屋火塘烧至半夜，柴添了又添。新刻火律悬于墙上，兽皮头一行大字，谁入门先瞥一眼。老酋长盘腿坐火边，将一块柴往里推，道：「祖上打猎种颗粒果，一族守一炉火，猎物分而食之，从不立册。」年轻族人蹲对面，以火钳拨炭，道：「从前自在，深渊来了拿甚么挡？吾兄即去年殁者。」老酋长闷半晌，道：「挡固要挡，然界碑一立，山便不是那座山矣。」一后生自门外探头，手扬刚领之伍籍木牌，道：「这上头写了日子，过了日子便走？」主事者接木牌，就火光视之，问那后生：「汝想不想去？」后生怔了怔，言想去，惟恐回不来。主事者还木牌，又于墙角那卷画硫晶支脉之旧猎图上按了按，谓老酋长道：「旧路照走，界碑只挡外人。」老酋长抬眼视那猎图，终将手中柴搁下，起身去墙边，展开旧猎图。"
 NAT_Event.83.a:"火恩镂骨"
 NAT_Event.83.b:"倾心效忠"

 NAT_Event.84.t:"玛拉妮掌纳塔谍报"
 NAT_Event.84.d:"沃陆之邦谷场方分完田，界石埋入土中，露出半截。年轻人对那半截石看了许久，回顾身边老人道：「那咱的火，还算不算咱自己的？」老人不答，但将火塘边之柴往里推了推。税吏在另一头敲锣，呼按新册交粮，一斗一斗过秤。数妇人围秤嘀咕，往年此时颗粒果早入自家仓矣。一汉子扛粮袋，赌气将袋往秤上一撂：「交便交，只是这秤是谁定的？」税吏涨红脸道：「火神定之律，众人按之手印。」汉子冷笑：「手印固按了，可按时无人告咱，祖辈走之路要划入别人之界。」主事者分开人群至秤边，先抓一把粮视成色，又弯腰拨开半截界石旁之土，看埋石之深浅，直腰道：「秤照旧，界石往里挪三步，田埂仍归各家。」汉子盯他半晌，将撂出之粮袋重提起来码好。税吏怔着，主事者将那杆秤往他怀里一塞，令其重敲锣。"
 NAT_Event.84.a:"永怀火神恩"
 NAT_Event.84.b:"丹心效命"

 NAT_Event.85.t:"授希诺宁领禁卫"
 NAT_Event.85.d:"「天无二日，国无二主。」此语传了些日子，各家听之各有滋味。使者案头堆数桩事：牧人赶牲口往高处走，言低地草不足；山口探子来报，深渊气息久久不散，路人言其处较别处为冷。六族使者吵至傍晚，一酋长拍案曰：「纳塔当听焱庭之火！」另一人冷笑曰：「凭甚么听它的？」一老妇端一盆灰自门外过，闻言停步，曰：「听谁的都成，只别把我家火塘灭了。」满屋人一时无一言。墙角有个孩子在数灯花，数到第七朵便忘了数到几。窗外风把鼓声送进来，一下一下，不甚齐。主事者挑亮案上灯，捻火种于灯焰上点了点，望跳动之火苗，末乃言曰：「一个纳塔，只可有一团火，先查清该由谁添。」将那几桩事一件件卷起，压于灯下，起身去熄外头之鼓。"
 NAT_Event.85.a:"世沐火神恩"
 NAT_Event.85.b:"永矢忠贞"

 NAT_Event.85.t:"拜茜特拉莉为宰辅"
 NAT_Event.85.d:"「天无二日，国无二主。」此语传了些日子，各家听之各有滋味。使者案头堆数桩事：牧人赶牲口往高处走，言低地草不足；山口探子来报，深渊气息久久不散，路人言其处较别处为冷。六族使者吵至傍晚，一酋长拍案曰：「纳塔当听焱庭之火！」另一人冷笑曰：「凭甚么听它的？」一老妇端一盆灰自门外过，闻言停步，曰：「听谁的都成，只别把我家火塘灭了。」满屋人一时无一言。墙角有个孩子在数灯花，数到第七朵便忘了数到几。窗外风把鼓声送进来，一下一下，不甚齐。主事者挑亮案上灯，捻火种于灯焰上点了点，望跳动之火苗，末乃言曰：「一个纳塔，只可有一团火，先查清该由谁添。」将那几桩事一件件卷起，压于灯下，起身去熄外头之鼓。"
