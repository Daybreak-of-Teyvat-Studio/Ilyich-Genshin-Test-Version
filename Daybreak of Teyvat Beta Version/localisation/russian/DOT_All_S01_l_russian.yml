#奇观描述
 wonder_description1_1:0 "[Get_Wonder_Effect]\n\nКрупнейшая библиотека на севере континента. Большинство книг доступно для публики."
 wonder_description1_2:0 "[Get_Wonder_Effect]\n\nКрупнейшая библиотека на севере континента. Большинство книг доступно для публики.\nСобрание книг со всего Мондштадта привлекает учёных издалека."
 wonder_description1_3:0 "[Get_Wonder_Effect]\n\nКрупнейшая библиотека на севере континента. Большинство книг доступно для публики.\nСобрание книг со всего Мондштадта привлекает учёных издалека.\nНовая система облегчает поиск, многие говорят, что здесь быстрее, чем дома.\n\nЗнание — сила, Фонтейн — бекон."
 wonder_description2_1:0 "[Get_Wonder_Effect]\n\nСтатуя Барбатоса. На постаменте надпись: «Врата к Небесному Острову»."
 wonder_description2_2:0 "[Get_Wonder_Effect]\n\nСтатуя Барбатоса. На постаменте надпись: «Врата к Небесному Острову».\nТеперь статуя окружена магазинами и туристами."
 wonder_description2_3:0 "[Get_Wonder_Effect]\n\nСтатуя Барбатоса. На постаменте надпись: «Врата к Небесному Острову».\nТеперь статуя окружена магазинами и туристами.\nЛифт доставляет туристов на руку статуи, но некоторые предпочитают лететь.\n\nВетер разносит семена одуванчиков, стихи и истории, а также мягких путешественников."
 wonder_description4_1:0 "[Get_Wonder_Effect]\n\nНеустанный ветер омывает эту землю. Великое дерево, посаженное героями, тихо шумит на ветру."
 wonder_description4_2:0 "[Get_Wonder_Effect]\n\nНеустанный ветер омывает эту землю. Великое дерево, посаженное героями, тихо шумит на ветру.\nОкрестности превращены в национальный парк."
 wonder_description4_3:0 "[Get_Wonder_Effect]\n\nНеустанный ветер омывает эту землю. Великое дерево, посаженное героями, тихо шумит на ветру.\nОкрестности превращены в национальный парк.\nЛифт доставляет на вершину дерева, где можно сфотографироваться."
 wonder_description9_1:0 "[Get_Wonder_Effect]\n\nРуины амфитеатра. Сухой ветер приносил сюда истории и уносил их вдаль."
 wonder_description9_2:0 "[Get_Wonder_Effect]\n\nРуины амфитеатра. Сухой ветер приносил сюда истории и уносил их вдаль.\nРуины отреставрированы, в храме снова появилась жизнь."
 wonder_description9_3:0 "[Get_Wonder_Effect]\n\nРуины амфитеатра. Сухой ветер приносил сюда истории и уносил их вдаль.\nРуины отреставрированы, в храме снова появилась жизнь.\nСнова проводятся ритуальные представления, привлекающие зрителей."
 wonder_description91_1:0 "[Get_Wonder_Effect]\n\nБескрайнее море Одуванчиков, где летают белые духи."
 wonder_description91_2:0 "[Get_Wonder_Effect]\n\nБескрайнее море Одуванчиков, где летают белые духи.\nС появлением поселенцев здесь выросли дома, а лисы располнели."
 wonder_description91_3:0 "[Get_Wonder_Effect]\n\nБескрайнее море Одуванчиков, где летают белые духи.\nС появлением поселенцев здесь выросли дома, а лисы располнели.\nСо временем здесь выросли города, поражающие прохожих."
 wonder_description60_1:0 "[Get_Wonder_Effect]\n\nБывшая резиденция Декарабиана. Ветер в руинах шепчет древние тайны."
 wonder_description60_2:0 "[Get_Wonder_Effect]\n\nБывшая резиденция Декарабиана. Ветер в руинах шепчет древние тайны.\nБашня отреставрирована, здесь появились поселения и производства."
 wonder_description60_3:0 "[Get_Wonder_Effect]\n\nБывшая резиденция Декарабиана. Ветер в руинах шепчет древние тайны.\nБашня отреставрирована, здесь появились поселения и производства.\nНижние этажи превращены в музей, где дети слушают истории."

 wonder_description121:0 "[Get_Wonder_Effect]\n\nПроцветающий порт, где по контрактам торгуют со всем миром. Добро пожаловать в Ли Юэ."
 wonder_description122:0 "[Get_Wonder_Effect]\n\nВдали от порта, на горе Тяньхэн. Семь Звёзд и главы гильдий управляют Ли Юэ."
 wonder_description146:0 "[Get_Wonder_Effect]\n\nДрево, источающее холодный лунный свет. Его корни уходят вглубь, возможно, соединяясь с чем-то древним."
 wonder_description153:0 "[Get_Wonder_Effect]\n\nДевять каменных колонн, охраняющих покой долины."
 wonder_description186:0 "[Get_Wonder_Effect]\n\nКогда-то здесь собирались герои клана Гухуа. Хотя клан пришёл в упадок, зал всё ещё стоит."
 wonder_description181:0 "[Get_Wonder_Effect]\n\n«...В ущелье журчит ручей, к северо-востоку — святилище, к юго-западу — крутые склоны...»"
 wonder_description175:0 "[Get_Wonder_Effect]\n\nВесенний ветер проносится над горами, разнося аромат чая и лепестков."
 wonder_description177:0 "[Get_Wonder_Effect]\n\nВдоль реки Бишуй, у водопада, расположен процветающий порт, где смешиваются голоса купцов и моряков."
 wonder_description162:0 "[Get_Wonder_Effect]\n\nГора Цинцэ укрывает деревню, где старики, дети и поля живут в покое. Легенды о древнем зле канули в лету."
 wonder_description169:0 "[Get_Wonder_Effect]\n\nКогда-то здесь цвели цветы, но мечта ушла, и руины остались."
 wonder_description127:0 "[Get_Wonder_Effect]\n\nПарящий над Ли Юэ Нефритовый чертог. Сейчас он в разработке, но вы можете использовать атомную бомбу в качестве временной замены."
 wonder_description124:0 "[Get_Wonder_Effect]\n\n«Когда я впервые увидел это чудо природы, я был потрясён... Но после многих лет работы в Главном управлении я устал от этой красоты... Спасибо наставнику за помощь.»"
