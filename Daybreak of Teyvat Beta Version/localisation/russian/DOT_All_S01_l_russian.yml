 Yuehai_Kiosk_Turmoil:0 "Смута в павильоне Юэхай (тест)"
 Yuehai_Kiosk_Turmoil_desc:0 "Семь Звёзд Ли Юэ определяют путь страны, но после смерти Владыки дела в Ли Юэ сложны и противоречивы. Это привело к образованию двух основных фракций, которые спорят об экономике, армии и пропаганде, накапливая ресурсы. Если наступит смута, борьба за власть станет неизбежной."
 ANR_struggle_from_three_routes:0"Борьба за курс в Вольфендоме"
 ANR_struggle_from_three_routes_desc:0"Борьба за курс в Вольфендоме будет вестись между Беннетом, Фишль и Дионой. Если ни один кандидат не победит с подавляющим влиянием, Рэйзор всё ещё может остаться лидером.§GКогда влияние кандидата достигнет 4, откроется национальный фокус для его прихода к власти. Вы также можете позволить Рэйзору продолжить свои реформы. Однако когда влияние одного кандидата достигнет 5, Рэйзор потеряет возможность остаться.§W\n§RВлияние Беннета: §W[?and_bennetts_influence]\n§YВлияние Фишль: §W[?and_fischls_influence]\n§BВлияние Дионы: §W[?and_dionas_influence]"

