 NAT_Springs_Kinetic_Proclamation_Idea:"凌波檄告"
 NAT_Springs_Kinetic_Proclamation_Idea_desc:"流泉之众欲向焱庭明立场，选逐浪之日宣告。航首立于舟头，身后数十小舟列成一线，浪起时齐踏浪而起。有使者自焱庭来，立岸上喊：「这是要造反？」航首不理，只将贝螺举至唇边，吹三声长音。三声既过，舟上众人齐声应和，声浪压过涛声。使者涨红脸，复喊一句甚么，为一浪头打湿袍角，退后两步。航首方回头，看他一眼，曰：「话吾踏浪说完矣，汝带回焱庭去。」说罢一跺舟头，小舟如箭射向浪心，将那使者喊声甩于身后。"
