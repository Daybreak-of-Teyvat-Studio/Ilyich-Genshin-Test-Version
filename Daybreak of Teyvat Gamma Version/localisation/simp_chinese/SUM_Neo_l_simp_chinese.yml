 SUM_Neo_SGD_T4:"四档：王统渐立"
 SUM_Neo_SGD_T4_desc:"四档：王统渐立。沙漠以赤王为号整合诸城。"
 SUM_Neo_SGD_T5:"五档：赤沙之主"
 SUM_Neo_SGD_T5_desc:"五档：赤沙之主。沙漠以赤王的威名号令四方。"
 SUM_Neo_SGD_U1:"一档：旅团离散"
 SUM_Neo_SGD_U1_desc:"一档：旅团离散。各支佣兵各投其主，沙漠无兵可用。"
 SUM_Neo_SGD_U2:"二档：契约零散"
 SUM_Neo_SGD_U2_desc:"二档：契约零散。旅团只接短约，来去不认人。"
 SUM_Neo_SGD_U3:"三档：旅团在侧"
 SUM_Neo_SGD_U3_desc:"三档：旅团在侧。一支可用的佣兵常驻沙漠。"
 SUM_Neo_SGD_U4:"四档：旅团归心"
 SUM_Neo_SGD_U4_desc:"四档：旅团归心。佣兵与部族的兵编在一处听调。"
 SUM_Neo_SGD_U5:"五档：沙海强军"
 SUM_Neo_SGD_U5_desc:"五档：沙海强军。沙漠的兵自己成军，不假外求。"
