DRA_Shadow_of_Dra:0"Тень Драконьего хребта"
DRA_Shadow_of_Dra_desc:0"В тени хребта скрывается неизвестная угроза. Мы должны понять её цели.\n\n§YПри разном уровне «Силы Тени» доступны разные решения.§！\n\n§B███§R будет использовать наши слабости. Если мы не решим проблему до объединения Мондштадта, последствия будут серьёзными.§!\n\n	§RСила Тени: §W[?Power_of_Shadow]\n	§!"
DRA_power_auto_change:0"Баланс сил"
DRA_power_auto_change_desc:0"Противостояние будет идти, и его исход зависит от соотношения сил.\n\n§RПри силе тени ниже 40 она будет снижаться, выше — расти.§!"
DRA_Stop_our_fight:0"Прекращение борьбы"
DRA_Stop_our_fight_desc:0"Не будем тратить силы на противостояние.\n\n§RПропускает один цикл «Баланса сил».§!"
DRA_Stop_their_breaking:0"Предотвращение саботажа"
DRA_Stop_their_breaking_desc:0"\n\n§RПредотвращает следующий саботаж.§!"
DRA_destroy_auto_happen:0"Саботаж"
DRA_destroy_auto_happen_desc:0"Тень действует, подрывая нашу власть.\n\n§RСпорные решения увеличивают силу тени, умеренные — уменьшают.§!\n\n§RПериодические атаки тени снижают стабильность и поддержку войны. При высокой силе тени эффект сильнее.§!"
DRA_daily_search:0"Обыск"
DRA_daily_search_desc:0"Мы проведём обыск для снижения силы тени.\n\n§RМалое снижение.\nПри силе тени выше 40 полиция ненадёжна.§!"
DRA_large_scale_Search:0"Массовый обыск"
