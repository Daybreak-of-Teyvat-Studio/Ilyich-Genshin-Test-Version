 NAT_Canopy_Canopy_Oath_Idea:"树冠誓约"
 NAT_Canopy_Canopy_Oath_Idea_desc:"悬木人立誓，选在数棵古木根脉相连处。众人围一段盘错老根站定，皆不肯先开口。一后生问：「此誓，如何立方算数？」老酋拔腰间短刀，于掌心划一道，滴血于根上：「一荣俱荣，一损俱损。根断，人亦断。」后生们相继照做，血珠顺根须纹路渗入，了无痕迹。末一个年纪最小，手抖甚，老酋握其手，助他划毕。血滴下，林中风过，树冠齐响一声。老酋将短刀插回鞘，对众曰：「从今往后，此根便是吾等之命。」说罢，率先转身，往林深处行去。"
