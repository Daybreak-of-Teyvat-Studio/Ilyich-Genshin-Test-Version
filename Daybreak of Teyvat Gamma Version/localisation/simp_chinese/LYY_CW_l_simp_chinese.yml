 #################### 璃月新闻 ####################
 LYY_News.9001.t:"观海楼上一声雷"
 LYY_News.9001.d:"璃月港送仙典仪行至一半，自称天权星使之旅者叩观海楼之门，随后一声惊雷，瓦上落尘。\n往生堂仪倌先至，只看一眼，曰：「座上无人，惟余尘土。」\n于璃月人而言，此乃一整套以千年写成之规矩，忽然失其执笔之人。此后千岩军按刀不语，七星闭门三日，港口海风之中，第一次飘起无有答案之疑。\n是夜城中人多未睡，然亦无人上街。窗纸映灯，灯一直亮到四更。四更之后，一盏一盏灭。\n其一张符后为一孩童拾去，藏于襟中，家中大人不知。\n观海楼那扇门此后闭三日。第四日开门，门槛落薄灰一层，灰上一行脚印，来而复去。守门兵卒曰：「此脚印非人所留。」\n那椅子原样留在座上，三日未动。此后移入内殿，罩以素布，布角以铜钉压之。"
 LYY_News.9001.a:"阅"
 LYY_News.9002.t:"七星失序城分三"
 LYY_News.9002.d:"帝君遗诏语焉不详，七星谁属，各执一词。玉衡、天权、月海亭三处灯火彻夜不熄，各自告示贴于同一面城墙，一张压着一张。\n一场无人宣战之战，自此而始：千岩军一夜分作数部，各为其主；商路断于关口，渔船困于港内。\n璃月自来未有此景。连街上之猫，亦学会绕开披甲者而行。\n有一户人家，门首摆碗箸两副，一以自用，一以待不知归否之子。摆七日，收一副。第八日，又摆出。此后常摆，摆了半年。\n那面城墙后遂称告示墙。三日之内贴十一张，颜色不一，字迹各异，边角皆为风卷起。有孩童于墙根画一马，为大人所挞。次日马又出，画得更大，旁又添鞍一副。\n告示墙后为雨水冲过一回，字迹化开，红黑不分。有人重贴，贴者未署官衔。"
 LYY_News.9002.a:"阅"
 LYY_News.9003.t:"港口尽锁万船停"
 LYY_News.9003.d:"自岸线至灯塔，一夜之间立起层层闸门。通行令遂比黄金更抢手，一处码头泊位，抵得半条街之铺面。\n海外商队停于港外，进退两难。本地渔户将船拖上岸，坐于船帮出神。\n一老人曰：「我活半世，头一回见璃月自内插门。」\n闸门设三道：一验令，一验货，一验人。验人一处排得最长。\n守闸兵卒一日换四班。一班中一老兵私谓人曰：「我守门二十年，头一回不知所守为谁。」\n此语无人上报，亦无人敢接。\n闸门开合有时：卯时开，酉时闭。闭门之后，港中只剩灯火。有渔船误时，漂于港外一夜。次日入港，船家首问：「昨夜可有人出寻我。」守闸者摇首。船家曰：「也好。」\n通行令分三等：铁、木、纸。纸令最贱，亦最多。有人以纸令换米一袋。\n有持铁令而无名姓者，守闸者亦不问。"
 LYY_News.9003.a:"阅"
 LYY_News.9004.t:"群玉阁夜半重升"
 LYY_News.9004.d:"沉默多日之后，群玉阁于夜色中重新升空，灯火照半个璃月港。阁顶换旗一面，色与从前不同。\n港中议论纷纭。有拍手者，有收拾细软者，亦有只立岸畔，看那灯火一整夜者。\n或曰：「此乃一句说得极响之话。无论谁坐那座浮空之楼，皆请全城抬头看清。」\n一幕僚私记一笔：阁中灯数，向来三十五盏。今夜，三十四。此笔记于一私册，私册后失传。可见者，惟那一夜抬头之人。抬头者不少。\n所少一盏在阁之西角。此后三年，其处一直空着，无人补。\n那面新旗升三日，第四日即换。换旗者未言缘由。港中人曰：「旗换得快，可见阁中主意未定。此语传至阁中，无人追究。」\n西角灯位后摆空椅一张。椅上无垫，风大则动。\n那空椅上后落薄灰一层，无人拂。"
 LYY_News.9004.a:"阅"
 LYY_News.9005.t:"千岩军裂作数部"
 LYY_News.9005.d:"最寒人心之报，出于千岩军内：同一军旗下长大之旧部，今分守城门南北两端。白日彼此相望，夜中换岗亦不招呼。\n有老兵擦甲至锃亮，坐营门外一夜。\n此军素以不退二字闻名，至此乃第一次逢一个无令可遵之清晨。\n次日点卯，应到一千二百，到者九百七十一。缺席者半归家，半往别处。\n营中刀兵，自此相向。或曰：「璃月内战之真开端，不在城头，而在此一夜无声之营房。」\n营中名册当日封存，封条盖两印，两印非一处所盖。次日开封，有人于册尾补一行：「来者九百七十一。」写毕搁笔，未署年月。\n那名册后成凭据，无人敢毁。册尾一行，后为人以朱笔圈之。圈者何人，册上无名。或曰圈者即书者，或曰非是。\n南门与北门之间，隔一街。街心石板，是年为人刨去数块，作路障。"
 LYY_News.9005.a:"阅"
 LYY_News.9006.t:"巨渊炮响黑岩易主"
 LYY_News.9006.d:"巨渊矿道深处，闷响不绝。黑岩厂铁门于黄昏时为众所撞开。矿工缩于巷道，听上头脚步换过一拨又一拨。\n此地乃璃月国防之根，亦无数人之坟场。握巨渊者，握重新武装璃月之势。\n井下之人不知此理。须待多年之后，方有人肯讲与彼等听。\n井下一处水眼，乃矿工自凿。是夜有人守之，守至天明，曰：「上头换谁都无妨，此水一断，下面便全完了。」\n其后水眼果未断。守水眼者，姓名未入册。\n黑岩厂铁门后重铸一扇，比旧门厚两指。铸门匠人曰：「旧门为众所撞开，撞开来那一道力，自外而入。此语只说一遍，此后不再提。」\n厂中旧账后为人翻出，末页记一行：「某年某月，井下十七人，未回。」\n厂中会计后亦不知所往，账页为虫蛀去半行，只余十七人未回五字。"
 LYY_News.9006.a:"阅"
 LYY_News.9007.t:"北国舰泊云来海"
 LYY_News.9007.d:"云来海有舰队下锚，桅上挂灰白之旗。甲板上立者，皆厚裘。问其所自来，曰：「北国。」\n其口称维持秩序。所携者，一纸待签之约，与一排指码头之舰炮。璃月战火，自此非一家之事。港中老人摇首曰：「借来之兵，请之易，送之难。」\n约成九条。第九条曰：「此约期满，双方各归其位。」期满之日，有人往问此语作不作数。答者曰：「纸上如此。」问者以炭记于船帮。船帮之字，后为浪打去。\n舰队泊于港外一冬。冬尽，甲板上换一批人，厚裘易为薄衣。岸上人渐看熟那面灰白旗，看熟则不复指点。\n有一门炮后为卸下，置于码头，作镇港之物。炮口朝海。炮身有铭文，字磨去其半，惟余一冬字。守港者每日拂之，如拂碑。\n有小儿攀炮而上，为守港者抱下。小儿问：「此炮还打么。」守港者曰：「不复打。」又问：「那陈此何为。」曰：「陈之，教人记得曾打过。」"
 LYY_News.9007.a:"阅"
 LYY_News.9008.t:"绝云闭山断来路"
 LYY_News.9008.d:"群峰之间，起一道不见之墙。旧日可通之山道，一日之内尽封。入山采药者皆被婉劝而退，再往上，只有风雪。\n云端仙人似无意插手人间之争，却同时收拢所有出入之路。\n或曰避世，或曰蓄力。二者无论何属，璃月皆少一条可回头之路。\n山中采药者数人未听劝，仍向上行。行三日，归者一人，默然不语，只将药篓倒空。篓中无药，唯有雪。或问其上所有。摇首。再问，曰：「无路。」\n封山之后，山下药铺断药数味。断最久者一味，治咳之药也。掌柜托人上山问，去七日，空手而回。曰山上有人应声，只二字：「等着。」\n山下村中后多一条规矩：进山先报。报者须书姓名与去向。书三年，一册未满。\n那册子后存于村祠，祠门不锁，任人翻看。"
 LYY_News.9008.a:"阅"
 LYY_News.9009.t:"沉玉谷里粮将尽"
 LYY_News.9009.d:"南方山谷之讯来得很迟：梯田干裂，溪流浑浊。守谷之人将最后一季稻子分了又分，仍不足过冬。\n彼等未曾向任何一方求援，只将谷口藤篱扎得更紧。\n此地之人相信，有些账不该算给外人听。然风声终是传出，连同彼等拒绝进城之倔强，一并记在璃月战报之侧。\n谷中有人将种子留下。留种那数日，全谷只喝稀汤，将米尽数埋入土中。有人饿倒田边，抬回之后，醒来首问：「种子曾埋否。」\n第二年，谷中出苗。\n谷口藤篱后加横木一道。加横木之日，全谷出工，连孩子亦搬得动一根。横木上未刻字，只在正中系旧布一条。\n那袋种子后分出三成，借与邻谷。借时立字据，据上写：还种不还米。\n谷中老人后语人曰：「那一冬，谷里未死一人，惟人人瘦一圈。」瘦可复长，种子若吃尽，便无来年。"
 LYY_News.9009.a:"阅"
 LYY_News.9010.t:"城下千帐难民潮"
 LYY_News.9010.d:"内战进入第二月，卢村、白驹、明蕴一带百姓扶老携幼涌向港口。城墙下搭帐篷上千顶，炊烟比城中更密。\n无人肯认，而人人可见：此仗已从军中账本，翻到百姓饭桌之上。\n谁先使此辈回田，谁先摸到璃月真正分量。\n其中一老妇，怀中抱陶罐一具。或问罐中何物。曰：「灶灰。」问带此何为。曰：「家中那口灶尚在，须将灰带回。」是夜睡于罐旁。罐口以布扎之，扎三道，布乃自其衣上撕下。\n帐篷区后辟出一街，街名乃难民自起，曰归街。街不长，只有三十七户。有人于街口立木板一块，板上书：「此处不问来处。」此板后为人抬入衙门，一直悬着。\n归街孩童后在街上滚铁环，滚得整条街皆响。有官来查看，立片刻即走。\n街口那木板后为虫蛀一角，衙门补薄铁一叶。"
 LYY_News.9010.a:"阅"
 LYY_News.9011.t:"内战落幕归一统"
 LYY_News.9011.d:"数月之战，于最后一处据点投降后止。胜者之旗自港口直插至山道口，沿途百姓自洒自扫，将散落瓦砾拢作一堆。\n此非可庆之胜。战场上所留之人，有敌有友；城中空缺，远不止一个座位。\n新政府接手第一件公事：点清尚有多少人活着，尚有多少炉火未熄。\n点户名册有一栏曰归处，填之最慢。有人填半页便止，曰填不下去。主事者曰：「填不下去者，书一待字。」那一页后书四十三待字。待至末了，多半无下文。\n清道之人中，有一跛足少年扫得最净。或问何故卖力。曰：「我家之墙已倒，扫干净些，看着不像废弃。」\n此少年后入清扫队，领一份工钱。以第一份工钱买石灰，将自家断墙重砌一截。\n再砌之后，他在墙根下种了一株石榴。有人问其故，曰：「有活物，才像有人住。」"
 LYY_News.9011.a:"阅"
 LYY_News.9012.t:"新政府重开旧署"
 LYY_News.9012.d:"新政权第一道告示甚短：税照旧收，法照旧用，官署照常开门，天亮即办。\n此一语，比任何誓词皆令市井安静。停摆数月之后，人所最惧者，无政也。\n一老账房立门前良久，末了将自家算盘搬回柜台。搬时以手巾擦一遍，擦得极慢。\n告示贴三日，第四日为人揭去一角。揭者乃卖菜人，曰欲拿回垫箱底。管事者见之，未拦，另贴一张。\n此后无人再揭。\n算盘搬回柜台之后，老账房第一笔生意乃代人写信。写三封，收两文钱。以两文钱压于算盘之下，未曾花。\n那三封信后有两封退回，因收信之人已不在。或问何故不花。曰：「压着，心里有底。」那算盘后一直摆于柜台，直至其故去。\n那两文钱后被人翻出一回，铜已发暗，串钱麻绳断一股。"
 LYY_News.9012.a:"阅"
 LYY_News.9013.t:"诸国遣使重回席"
 LYY_News.9013.d:"蒙德、稻妻、须弥、枫丹使节先后抵港，递上措辞各异之国书。有于信中试探者，有于信中示好者，亦有只安静附货物清单一份者。\n璃月于内战期间几自提瓦特图上消失数月。今其重归，带一身伤，与一本清楚之账。\n诸国所看者，是其尚余多少力气。璃月自知，要紧者乃打算如何用这些力气。\n四封国书后存入库中，编作一二三四。编号乃收书老吏自排，曰：「这般排，往后好找。」库中原有六封旧国书，皆内战前所收。\n十封并作一处，新旧杂陈，无人分。\n使节同住一街，出门相见，彼此点头。曾有两國使节同坐茶肆一桌，各说其说，说至日落，无一人改口。茶肆主人曰：「是日卖出之茶，乃平日三倍。」\n此街后被人称作使节街。街口有一卖纸者，生意最好。"
 LYY_News.9013.a:"阅"
 LYY_News.9014.t:"云来撤防争未决"
 LYY_News.9014.d:"云来海去留之议，谈判桌上气氛一日冷过一日。至冬欲留一处常年补给口岸，新政府只肯给一张限期通商许可。\n双方皆明，此乃谁于这片海上有言之权之争。\n合约终签，而每一行字旁，皆留一道无人打算填实之空。\n那张合约后翻看多回，每回皆有人于空处签字画押。画押者自以为定事，实则只是将空处填得更空。至末了，那几行字反倒无人再看。\n或问此算不算约。签字者曰：「算。」算到下一回再议为止。\n那一处口岸后只开半年，另半年封。封港之时，岸上留一盏灯。灯为谁所点，无人过问。开港之日，灯即灭。\n是年通商许可，只发十一张。第一张与本地一小船行。十一张之中，七张于半年内转手。\n那盏灯后被人取走，无人问其下落。"
 LYY_News.9014.a:"阅"
 LYY_News.9015.t:"天空岛始终不答"
 LYY_News.9015.d:"数月以来，无论璃月如何改朝换代，那座悬于云端之浮岛始终未出一语，连征兆亦无。\n璃月人素习于向天理借神谕以定国是。此一回头一次要自己为天命下定义。\n有人因此不安，亦有人因此一舒：原来不为人所视，亦一自由耳。\n神谕未至，反倒给了此城一个自己开口之由。有吏曰：「既无神谕，此后凭何决事。」同列曰：「凭议。」\n城中此后议政，多一句常话：天不语，吾辈便自己说。此语初只在议事厅说，后来街上亦言之。\n浮岛后偶有云影掠过，形状像人。城中多有议论。有一老翁曰：「那年我在山上见过一回，甚么都没有。此后他不再言。」\n是年城中无祭天之仪典。有人提议补办，议三次，未办。祭天旧乐谱尚在库中，无人取阅。库吏曰：「谱上之字，一半乃古体。」"
 LYY_News.9015.a:"阅"
 LYY_News.9016.t:"巨渊再震连夜堵"
 LYY_News.9016.d:"巨渊深处有声，如地底翻身。矿道之灯次第而灭，守军与工役连夜出井。出者三百七十一人，点至天明，无一缺者。\n既出，封道、浇铸、加固，三日而成。有老矿工立于井口，视封石良久，曰：「此道我凿了十七年，今日亲手封之。」言毕而去，未回顾。\n内战以来，防务久废，井上无一卒。至是始设守，一班八人，三班轮值。或问何须八人。管事曰：「一人听久，风声亦作脚步。」八人之中，必有一人醒着；醒者出声，余者应声。\n井口悬铃，风过则鸣。悬铃者曰：「铃一响，便知下面还醒着。」\n封道三月而毕。石上刻一横线，刻者曰：「此线者，到此为止也。其后无人加刻一字。」\n铃后易以铜，声愈远。易铃者曰：「铜声沉，井下听得见。此言传至矿上，矿工每过井口，皆抬头看一眼铃。」\n是年冬，井口结冰。守者以热水浇之，浇一处，冻一处。后不复浇，但于冰上撒灰一层，使人知脚下空虚。"
 LYY_News.9016.a:"阅"
 LYY_News.9017.t:"南十字船队启航"
 LYY_News.9017.d:"商船与护航舰合为一队，离港。桅上之旗，于晨光中次第展开。所向者，璃月商路图上从未标注之海域。\n内战封港，困一代人于岸上。至是而解。其所最欲为者，往外走。\n船长曰：「此趟不为夺人生意，只为使海上之人重新记得，璃月之船回来了。」\n航图后新画一片海域，以朱笔勾其边，旁注四字：「可去，慎行。」四字为船长自书。书毕，谓船工曰：「往后此图上每一处，皆须有人走一趟。」\n船队归时已秋。所携之货不多，所携之图则厚。船长铺图于码头，任人来看。看者围三层，至天黑乃散。\n图后为人抄七份，分送各船行。抄时谁亦未藏私。抄图者中有二人不识水路，错三处。船长未改，惟于错处旁画一圈。\n或问何不令重抄。他曰：「错处留一圈，后人抄时便多看一眼。」处处皆对，反倒无人看。"
 LYY_News.9017.a:"阅"
 LYY_News.9018.t:"百工重聚擦旧器"
 LYY_News.9018.d:"铁、木、船、染诸匠陆续回坊。新政府不大办庆典，只将告示一张钉于码头：工价、工时、学徒、伤病，皆书于明处。\n此非施舍。一城之骨，从来长在会作器物之人身上。\n有人将落满尘灰之工具重新擦亮，曰：「先将应做者做出。」余话，待有物可看时再说。\n告示牌后移至坊门口，正对炉子。或问何故移此。移者曰：「作活之人抬头便见，方叫明处。」\n此后坊中工价三年未动。\n坊中后立一条：学徒头一年不付工钱，管饭。或言不公。老师傅曰：「吾当年亦如此过来。此条争半年，末仍照旧。」\n坊门口那面告示牌后添两行：「一曰工钱按月，二曰伤病给药。」学徒中有三个，乃归街之孩童。\n三童子初来时不敢近炉，只在门边立着看。第三日，方有一个伸手，摸了摸砧子。"
 LYY_News.9018.a:"阅"
 LYY_News.9019.t:"神之眼议而不禁"
 LYY_News.9019.d:"议会中有人建言：「神之眼持有者，当加以登记与限制。亦有驳之者，曰：璃月元气，一半便在这些人之手。」\n争论无果。政府终答只一句：「既不禁，亦不倚。」\n如何与力量相处，璃月此前未尝认真思之。今须于无神明注视之下，独自面对此事。\n有人以为此语不痛快。议长曰：「不痛快之话，方用得久。」\n此条后写入约法，列第九。前八条皆论税、论兵、论路。\n此条后引来奏议一份，奏议曰：「不禁者，恐其乱；不倚者，恐其骄。」议长批四字：「知了。」奏议归档，此后无下文。\n神之眼持有者后仍行于市，不挂任何标记。街上之人亦渐不指点。是年市面神之眼，明处见十一枚，暗处不知几枚。\n此条既列，市井议论又起，议了数月，渐无人在意。"
 LYY_News.9019.a:"阅"
 LYY_News.9020.t:"长桌边上签公约"
 LYY_News.9020.d:"末次谈判，璃月与新交诸方共签通行公约一纸，所载多而琐：遇险互救、船只通行、货物互认、争端共裁。\n签字之时无仪仗，只有一屋算盘之声。\n璃月未留豪言，惟重学一难事：于一张人人皆在之长桌边坐下，以理相争。\n公约凡十四条。第十四条原文只有一句：「此后有争，先议，后动。」\n藏入库中之抄本，后为人翻出看过。翻者只见末页空白，曰：「留得好。」言毕合上，放回原处。库中那一格此后未再开，直至多年之后。\n抄本凡七份，一份留港，六份随使节出海。留港者置于议事厅柜中，柜不上锁。或问何故。管柜者曰：「欲看者，任其看。」\n柜中那一份后为虫蛀一角。管柜者不补，只于蛀处夹薄纸一片。\n公约此后增补三次，条款增至二十一条。增补之会仍在那张长桌边开，席上无一人高声。"
 LYY_News.9020.a:"阅"

