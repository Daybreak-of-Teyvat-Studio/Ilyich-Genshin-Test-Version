 SPA_awaiting_the_rebellion:0 "Awaiting the Rebellion"
 SPA_awaiting_the_rebellion_desc:0 "The coup has been meticulously planned, and we are ready to spring it at any time. However, we have learned from our previous failures. Rather than have a repeat of the 1932 Sanjurjada fiasco, we will wait until popular sentiment sufficiently supports our cause, ensuring we will not be so easily ousted."
 SPA_carlism:0 "Carlism"
 SPA_carlism_desc:0 "In 1830 King Ferdinand VII promulgated the Pragmatic Sanction and made his daughter, the future Isabella II, heir presumptive. This act removed his brother Infante Carlos from the line of succession, and so, upon the King's death, supporters of Infante Carlos ignited a series of civil wars, uniting under the banner of Carlism and fighting for the reinstatement of the Salic line of succession.\n\nA century later, the Carlist movement is still very much alive, and its militias, called Requetés, train unceasingly in preparation for the time where they will once more be needed to defend Christianity and champion the return of the rightful King."
