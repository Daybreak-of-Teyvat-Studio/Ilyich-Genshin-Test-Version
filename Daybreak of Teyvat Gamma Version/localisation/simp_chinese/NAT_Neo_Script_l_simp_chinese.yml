 NAT_Canopy_Ancient_Name_Private_Idea:"古名私授"
 NAT_Canopy_Ancient_Name_Private_Idea_desc:"悬木人将古名传授收归族内。从前外族人来学，祭司当众念诵，谁皆听得见；今番传授改在林中小棚，只许本族后生入。一外族老学者闻讯赶来，立棚外曰：「古名乃天下共有，凭何不令吾听？」守棚祭司隔藤帘应曰：「字是共有，名字乃自家先祖的。」学者不肯走，蹲棚外耗一下午。棚内，祭司以燃素于黑曜石一笔一笔刻那古名，后生们随念，声压甚低。日头落时，学者终起身去矣。祭司掀藤帘，将刻就石片递一后生，令揣入怀中带出林子。"
