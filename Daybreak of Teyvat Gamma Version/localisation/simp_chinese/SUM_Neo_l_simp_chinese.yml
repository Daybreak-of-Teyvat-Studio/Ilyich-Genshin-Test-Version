 SUM_SGS_RA_March_Dune_desc:"大军沿沙丘脊东进，风把足迹吹平。"
 SUM_Neo_SGS.86.t:"沿沙丘东进"
 SUM_Neo_SGS.86.d:"大军沿沙丘脊东进，风把足迹吹平。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
