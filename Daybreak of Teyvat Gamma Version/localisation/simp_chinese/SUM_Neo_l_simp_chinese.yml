 SUM_Neo.35.t:"神谕改革"
 SUM_Neo.35.d:"草神颁下新的教谕，废去教令院滥权已久的旧条。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。"
