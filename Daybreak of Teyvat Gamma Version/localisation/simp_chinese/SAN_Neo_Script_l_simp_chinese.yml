# ========================================================================
# 珊瑚宫剧本 BY 桂花糕  —— BY 桂花糕
# ========================================================================

 SAN_PW_Mechanism:"机制状态"
 SAN_PW_Mechanism_desc:"机制状态只读面板。按授权与深渊两条轴的数值，显示珊瑚宫战后当前的等级以及该档生效的国家修正。面板条目无法点击，只用于随时查看机制进度，帮助你在推进战后决议之前判断当前形势，做到心中有数。面板会随轴值变化即时刷新，无需手动操作。"
 SAN_PW_governance_category:"珊瑚宫战后 · 治理"
 SAN_PW_governance_category_desc:"珊瑚宫战后的治理决议组，处理岛内秩序的重建。安抚稻妻各町、整顿神社与奉行所、安置伤残与流民，都属于这里的范畴。治理得当，授权指数才能稳步提升，岛上的民心也才会真正安定下来，新政权才算有了立身的根基。治理若有疏漏，前面辛苦得来的局面也可能付诸东流。"
 SAN_PW_reconstruction_category:"珊瑚宫战后 · 复建"
 SAN_PW_reconstruction_category_desc:"珊瑚宫战后的复建决议组。重修岛路、渔场与工坊，恢复战后的生产与生计。每一项复建都对应一段具体的工期，完成后才能让海岛重新运转起来。重建的进度，直接关系到珊瑚宫能否在接下来的岁月里站稳脚跟，也关系到岛上百姓的生计能否早日恢复正常。"
 SAN_PW_white_night_category:"珊瑚宫战后 · 白夜"
 SAN_PW_white_night_category_desc:"珊瑚宫的白夜遗产决议组，围绕渊下宫的遗存与白夜国的旧事展开。勘探、封印与整理这些遗产，会牵动深渊指数，也关系到珊瑚宫如何看待自己与脚下那片深海之间的渊源，是回避旧事，还是坦然面对。如何取舍，取决于珊瑚宫想给后人留下怎样的说辞。"
 SAN_PW_Mandate_Tier_1_View:"御神威权 · 第 1 档"
 SAN_PW_Mandate_Tier_1_View_desc:"政通人和日，文书顺遂人心定，潮信自可期。政治点数获取 +10%、稳定度 +5%、战争支持度（周） -0.50%。新政初行，气象一新，官署文书一日快似一日，诸务皆有章法。"
 SAN_PW_Mandate_Tier_2_View:"御神威权 · 第 2 档"
 SAN_PW_Mandate_Tier_2_View_desc:"二层旨意落，学塾工坊同沾惠，上下俱称便。政治点数获取 +5%、稳定度 +5%、研究速度 +5%。庙堂与匠作同时得了便利，办事的人都说顺手，学塾里的新课也排得快了。"
 SAN_PW_Mandate_Tier_3_View:"御神威权 · 第 3 档"
 SAN_PW_Mandate_Tier_3_View_desc:"威权渐次重，条陈愈细法愈明，降心自归附。政治点数获取 +10%、稳定度 +8%、占领区顺从度增长 +10%。占领之地的百姓渐渐肯与新任的官差说话了，市集上的争执也愿意报官评理了。"
 SAN_PW_Mandate_Tier_4_View:"御神威权 · 第 4 档"
 SAN_PW_Mandate_Tier_4_View_desc:"雷霆手段出，利弊从来各占半，灯油多费些。稳定度 +12%、战争支持度（周） +0.80%、研究速度 -8%、陆军攻击 +5%。兵锋既利，书案上的灯却要多熬几盏。"
 SAN_PW_Mandate_Tier_5_View:"御神威权 · 第 5 档"
 SAN_PW_Mandate_Tier_5_View_desc:"极盛藏疲惫，繁华底下有暗涌，万物皆有价。稳定度 +18%、战争支持度（周） +1.20%、研究速度 -15%、消费品工厂占比 +8%、占领区顺从度增长 -10%。威仪是买来的，账目里一样一样写得明白。"
 SAN_PW_Deep_Tier_1_View:"白夜秘仪 · 第 1 档"
 SAN_PW_Deep_Tier_1_View_desc:"白夜之学启，幽深典籍费心力，得失本参半。稳定度 +8%、研究速度 -10%。埋首古卷的人夜里睡得都迟了，窗外鸡叫三遍还舍不得搁笔，同伴劝也劝不住，所得却也是真的。"
 SAN_PW_Deep_Tier_2_View:"白夜秘仪 · 第 2 档"
 SAN_PW_Deep_Tier_2_View_desc:"禁知初通晓，实效渐显账可查，古图换新器。研究速度 +8%、工厂产出 +5%。工坊里新添的法子，都是照白夜国的旧图改的，老师傅看了直说妙，徒弟们抄图抄得飞快，连夜赶制了三套。"
 SAN_PW_Deep_Tier_3_View:"白夜秘仪 · 第 3 档"
 SAN_PW_Deep_Tier_3_View_desc:"学问入堂奥，往深里走人发慌，账目两分明。研究速度 +15%、工厂最大效率 +8%、稳定度 -5%。学问往深里走，人心难免发慌，街上的闲话也多了些，所得所失，簿册上一笔一笔都记着。"
 SAN_PW_Deep_Tier_4_View:"白夜秘仪 · 第 4 档"
 SAN_PW_Deep_Tier_4_View_desc:"古法会新器，声势渐成龙骨硬，代价亦不小。研究速度 +22%、工厂产出 +10%、稳定度 -12%、消费品工厂占比 +5%。提纯的学问养出来的力量，稳当里带着锋芒。"
 SAN_PW_Deep_Tier_5_View:"白夜秘仪 · 第 5 档"
 SAN_PW_Deep_Tier_5_View_desc:"禁知尽出时，恍如洪炉初开启，寒暑两惊人。研究速度 +30%、工厂产出 +15%、稳定度 -20%、陆军攻击 +10%、战争支持度（周） -1%。力量很足，代价也重，执此柄者自己掂量。"
 SAN_PW_Combo_Twin_High_View:"共振 · 双柱并秀"
 SAN_PW_Combo_Twin_High_View_desc:"双柱齐并立，两头烧火炉温足，人心费柴薪。稳定度 -5%、政治点数获取 +15%、研究速度 +10%、陆军攻击 +10%。两条线同时用力，进项可观，人心须另加看护。"
 SAN_PW_Combo_Twin_Low_View:"共振 · 双轨并稳"
 SAN_PW_Combo_Twin_Low_View_desc:"双轨并行处，宽缓为政日子松，办事亦从容。稳定度 +6%、消费品工厂占比 -5%、政治点数获取 +5%。百姓的日子松快些，官署办事也从容了几分，茶馆里的闲话都平和了。"
 SAN_PW_Combo_A_High_View:"共振 · 神政同辉"
 SAN_PW_Combo_A_High_View_desc:"神政合一路，祝词政令同门出，声气自然壮。稳定度 +10%、政治点数获取 +10%、战争支持度（周） +0.50%。纲举目张，令出一门，众人听令也听得踏实，回话都回得利落。"
 SAN_PW_Combo_B_High_View:"共振 · 术业专精"
 SAN_PW_Combo_B_High_View_desc:"术业专攻处，锐意求进脚程快，风景顾不上。研究速度 +15%、工厂产出 +8%、稳定度 -8%。走得快的人，难免顾不上沿途的人心，沿途的怨言也攒下了些，账上的盈亏自己会说话。"

 SAN_genshin_party:0 "海祇大御神"
 SAN_neutrality_party:0 "御建鸣神"
 SAN_communism_party:0 "曚云神社"
 SAN_fascism_party:0 "渊下神宫"
 SAN_democratic_party:0 "现人神巫女"

# ========================================================================
# 国策部分
# ========================================================================

 # ========================== 第一阶段：揭旗起事 (1-30) ==========================
 SAN_the_resistance_begins:"反抗的开端"
 SAN_the_resistance_begins_desc:"浪涌拍礁石，珠光不落淤泥里，愿作剑头芒。原来眼狩令既下，珊瑚宫前那一炷香便未曾冷过。心海素日不言兵，此际却亲执令旗立于阶上，声音亦轻，只说得一句：「海祇岛的愿望，一桩也不肯舍。」阶下众巫女听毕，各自低头拂了拂衣上水气。一时海风过处，火种自宫前一点燃起，映得满阶珠光如雪。诸岛自此不再沉默。 —— BY 桂花糕"
 
 SAN_mobilize_watatsumi_militia:"动员海祇民兵"
 SAN_mobilize_watatsumi_militia_desc:"渔叉出旧匣，弓弦久静忽有声，壮丁列沙汀。望泷村的壮丁们翻出尘封的渔叉与长弓，一时塘边无人说话，只有磨石声此起彼伏。心海亲至滩头，将旗一一交到各队手里，说：「诸位的气力，原是过日子的本事，今日先借与海祇一用。」众人应了，声不甚高，却齐。散时有人回头望了一眼自家的渔排，便转身入了队列。"
 
 SAN_establish_sangonomiya_hq:"建立珊瑚宫大本营"
 SAN_establish_sangonomiya_hq_desc:"图穷见珊瑚，一灯挑亮海祇山，令出如潮信。大本营设于珊瑚宫深处，战略地图缓缓摊开，压以四枚螺钿镇纸。心海大人亲自坐镇，执笔先将诸岛水道一一勾过，半日方歇。她道：「军令要如潮水，涨落有时，误不得一刻。」左右便依此立下传令的班次，一时宫中灯火彻夜不熄，只闻笔尖沙沙，如春蚕食叶。"
 
 SAN_gorou_army_reforms:"五郎军事改革"
 SAN_gorou_army_reforms_desc:"大将之威，如犬影之迅捷。五郎下营先看灶，再看脚上的鞋，末了才看刀。他定的操练法极苦：山地负重，雨天拉练，一旬一演。起初兵士们私下叫苦，一月后演武，各队进退如一人，叫苦的声便没了。有老队正说：「五郎将军带兵，像牧犬赶羊，看着慢，一只也丢不了。」"
 
 SAN_covert_courier_service:"建立秘密情报网"
 SAN_covert_courier_service_desc:"信鸽渡封锁，渔船暗格藏密简，一路到宫前。封锁线下，明路既断，遂开暗路。渔船的暗舱、参拜者的签筒、货担的夹层，皆可藏信。信分三样颜色，红者急，白者常，黑者毁。有一站的老妈妈收信半生，只识得颜色不识字，人说她经手千封，无一封失落。心海闻之，亲赠一枚御守，道：「这比军功牌体面。」"
 
 SAN_strategic_pockets_doctrine:"锦囊妙计战略"
 SAN_strategic_pockets_doctrine_desc:"心海的锦囊，百局皆备。兵法研至极处，战场上的变量皆入了算：潮时、风向、敌将的性情、粮道的长短，逐一赋数。人多势众的敌军压过来，机动与奇袭便是破局之刃。一次演习，心海以半数兵力困住全数之敌，事后复盘，图上批注密密麻麻，如蚁行纹。将官们传阅之后，无人再敢轻视案头的算册。计谋这条线，织得越密，网就收得越紧。"
 
 SAN_vision_vanguard_action:"神之眼先锋行动"
 SAN_vision_vanguard_action_desc:"尚未失去愿望的勇士们，就是最前的锋刃。神之眼的持有者编入先锋突击之队，以元素之力撕幕府的阵线：一瞬雷光，一环水幕，一步风行，阵脚便乱。每一战之前，队中有个不成文的礼数：互看一眼彼此的眼上之光。这不止是力气的较量，是意志的较量。愿望是不灭的星火，此刻便烧在阵前。"
 
 SAN_pearl_rationing_program:"珍珠配给计划"
 SAN_pearl_rationing_program_desc:"好钢用在刀刃，一粥一饭有谱。战时配给立了三等：前线、工坊、岛户，粮册按人按日，红白之事另有加给。起先岛户嫌分得碎，后来见前线的船一船一船满载而去，也就不言语了。管仓的先生每日挂牌报数，仓里有几石、耗了几斗，人人可看。心海巡仓那日，抓一把米在掌心看了看，只说：「米粒齐整，仓官用心了。」仓官后来对人说，那一句话，比赏银沉。岛安则军安，粮稳则心稳。"
 
 SAN_naval_ambush_tactics:"海上伏击战术"
 SAN_naval_ambush_tactics_desc:"迷雾笼海面，礁石暗藏杀机现，战舰影忽闪。海祇水域礁脉纵横，快船熟其路者，进退皆在敌之意外。袭扰之法定了三条：只打辎重，不打民船；一击即走，不恋战果；雾起则出，雾散则没。幕府的运输线自此旬旬有失，护送兵一添再添，添到运货不如护货多。有幕府舰长在航海日志里抱怨：这片海，白天是海，起雾便是鬼域。海祇的船娘听了，笑而不语。"
 
 SAN_shrine_maiden_volunteers:"巫女志愿者动员"
 SAN_shrine_maiden_volunteers_desc:"除了战场的拼杀，后勤与医疗同样关键。珊瑚宫的巫女们走下神坛，加入医疗营与救护队。她们用轻柔的歌声安抚伤员，用精湛的医术拯救生命。这股温柔的力量，是前线士兵们心中最坚实的后盾。"
 
 SAN_recruitment_of_ronin:"招募流浪武士"
 SAN_recruitment_of_ronin_desc:"流落荒野的剑客，忽然有了要去的地方。海祇的招书散至全稻妻的渡口：不为地，不为钱，为大义。来的浪人各有来历，有佩断刀的，有背酒葫芦的，有把主家牌位缝在衣襟里的。编队不问过去，只立一条：既往之仇，入营则止。这些武者野惯了，操练场上不服管，可一上白刃的合战，纪律忽然就有了，原来刀客的规矩在刀上，不在册上。老兵看了几场，服气了：这些人补进来，中坚便厚了三分。"
 
 SAN_kokomi_art_of_war_study:"心海兵法研习"
 SAN_kokomi_art_of_war_study_desc:"现人神非止香火，兵书案上自千秋。心海每夜闭门读古今兵法，批注写满册页，苇册翻毛了边。她将旧法与新势相参，写成海祇自家的防御之论：潮有信，故防有谱；岛有数，故援有次。文书颁行各营，操练遂有了谱。行政的效率也随之清了，各司的册子当日事当日毕。有近侍见她灯下揉腕，劝她歇，她道：「脑子里的图多一张，将士们少流一滩血，这笔账划算。」"
 
 SAN_wartime_taxation_arrangements:"战时税收安排"
 SAN_wartime_taxation_arrangements_desc:"最后一战要钱，钱从秤上来。税收的架子重调：商税按利，渔税按汛，田税按年景，奢侈之货加倍，柴米之需全免。收上来的每一笔皆入专册，专款专用，榜上公示。缴税的商户起初叫苦，后来见前线的船一船船满载而去，苦声便低了。战胜之后的繁华，将是给所有岛民最好的回礼。"
 
 SAN_resistance_fortification_plan:"反抗军加固计划"
 SAN_resistance_fortification_plan_desc:"名椎滩与海祇岛之间的要冲，堡垒一座接一座立了起来。石垒三面抹灰，炮位藏于假渔棚之下，潮退时显露，潮起时不见。守军分作两班，一班筑，一班练，工地与操场互为表里。有人问，堡筑这么厚，是不是只求守得住。督工的答：「守是本分，可堡后有路，路通反攻的码头。等敌人把力气耗在墙上，那扇后门便该开了。」天堑为墙，墙后藏刀，这才是工事的全貌。"
 
 SAN_foreign_mercenary_outreach:"异国雇佣兵联络"
 SAN_foreign_mercenary_outreach_desc:"重金募远客，刀头舔蜜异乡人，合同写得清。离岛的密道通向四方，游荡的雇佣兵一队队来了。接洽的官员先递契书，酬金、伤亡的抚恤、撤出的日子，皆写得明白。有佣兵头子看完契，笑道：「跟明白人做买卖，刀也敢使。」一时异乡的旗帜插在演武场边，与海祇的军旗隔栏相望，倒也相安。"
 
 SAN_logistics_tunnel_project:"后勤隧道工程"
 SAN_logistics_tunnel_project_desc:"深挖地下道，穿行群山密林间，补给永连绵。幕府的空中哨船日日在头顶过，陆路运输遂转地下：隧道自海祇腹地起，穿山过涧，至前线粮台而止。掘进皆以旧矿法，昼夜轮班，洞口以藤蔓掩之。头一段贯通那日，民夫入洞走了一遍，出来时说：「头顶是敌军的地界，脚下是自家的路，走这一趟，心里痛快。」自此粮车改道而行，天上的哨船，看见的只是一片安静的山林。"
 
 SAN_vision_user_integration:"神之眼持有者整合"
 SAN_vision_user_integration_desc:"一颗神之眼，便是一段不肯熄的愿望。持有者依元素编组：雷者主袭，水者主御，风者主探，火者主破，元素相激之间，杀伤成倍地生。协同之训日日不辍，队形、时机、收敛与爆发，皆按谱演练。他们将是反抗军最锋利的一把剑，剑柄上刻着两个字：愿望。"
 
 SAN_underground_intelligence_network:"地下情报网络扩张"
 SAN_underground_intelligence_network_desc:"鸣神岛的市井之间，眼线如根须在土下蔓延。花见坂的茶屋里说书人换了新词，町街的工坊里学徒多了几张生面孔，每一处都有自家人。天领奉行的一举一动：几点换岗、粮车走哪条街、哪位官近来手紧，皆有细报入宫。市声愈喧，账愈清。情报房的墙上钉着一张城坊图，图上的针眼已经数不清了。"
 
 SAN_coastline_patrol_strategy:"海岸线巡逻战略"
 SAN_coastline_patrol_strategy_desc:"浮标测风浪，海灵芝香报远近，一夜五十里。近海设了巡防的班次，又沿海面布下元素浮标，浮标以海灵芝为引，敌船一近，夜夜有人望见异光。老渔民教年轻人认浮标的颜色，说：「这是咱家的院墙。」自此幕府的探船，连岸都摸不着了，巡哨的边界往外推了数十里。"
 
 SAN_village_council_empowerment:"村议会授权"
 SAN_village_council_empowerment_desc:"权柄放下去，人心浮上来。望泷村等基层之单位，许其自议村事：渠怎么修，市几日一开，学堂请哪位先生，皆由村议定，官府只看账。头一届村议开会，吵到掌灯，散会时人人面红，个个心里痛快。战时的政令由此走得快了，民心的凝聚成了御外最厚的墙。让人民真正做主，这话落到实处，不过是把一件件小事还给村里。"
 
 SAN_emergency_rice_storage_tactics:"紧急粮食储备战略"
 SAN_emergency_rice_storage_tactics_desc:"深积粮，高筑墙。岛腹之中凿出战备粮仓十余处，仓中谷陈相因，防潮的石壁里衬着桐油纸。管仓的官员按季盘点，鼠洞要堵，湿气要防，账册一式两份。封锁最紧的那年，市面无一日断粮。有老兵看着运粮的队伍说：「山肚子里有粮，人心里便不慌。」"
 
 SAN_signal_flag_protocol:"旗语通讯协议"
 SAN_signal_flag_protocol_desc:"浪大雾深，旗语是海上的嘴。新定的旗语章程译成密谱：寻常讯号明码，军机暗码，暗码每旬一换。失去元素通讯之时，桅上的旗与岸上的塔仍能对答。演试那日，两船相隔三里，风急浪高，旗起旗落，一句问，一句答，分毫不差。老水手望着那面翻卷的旗道：「旗是布做的，话是铁做的。」此后的海战，旗即军令。"
 
 SAN_partisan_warfare_arrangements:"游击战术部署"
 SAN_partisan_warfare_arrangements_desc:"隐于丛林中，击于敌之所不备，退如晨雾散。反抗军编成小队，每队不过十余人，各配向导一名，皆本地猎户出身。战法定了口诀：敌进我转，敌疲我扰，敌驻我断其水。八酝岛的密林裂谷成了天然的棋盘，幕府军清剿三月，歼敌无算，自损亦无算，粮道倒是断了四回。被俘的幕府军官叹道：「同海祇军打这一仗，不是打仗，是与整座岛打。」小队的旗帜没有旗杆，只在腰间缠一截红布。"
 
 SAN_scout_unit_reorganization:"侦察部队改组"
 SAN_scout_unit_reorganization_desc:"侦察兵是军队的眼睛，选眼比选刀更苛。新的选法立了三关：辨物于百步之外，记路于夜行一遭之后，忍静于三日无人言语之间。头一期应选者三百，留者不足三十。留下的编入连队，潜行、观风、绘图的课目日夜相接。此后敌后的每一张战图，都出自这三十人之手。总攻的坐标一列一列送到案头，心海看罢只道：「眼睛亮了，刀才知道往哪里落。」"
 
 SAN_naval_mine_laying_strategy:"水雷布设战略"
 SAN_naval_mine_laying_strategy_desc:"危险不必声张，沉在浪底自有人收账。踏鞴砂的旧料改成水雷，浮标作渔标之状，锚链沉于幕府必经的航道。布设的船夜出昼归，海图上记了暗号，自家渔船人手一张。头一响在拂晓，敌运输舰伤而未沉，拖着烟回港，全港皆惊。此后那条航道，幕府的船绕出半里，绕行的路恰又进入第二线的雷区。水师的老兵望着平静的海面道：「最凶的话，往往是一句不说。」"
 
 SAN_island_fortress_objective:"岛屿要塞化目标"
 SAN_island_fortress_objective_desc:"全岛皆成垒，地堡依着岩洞生，来者啃不动。海祇岛要塞化，要塞不在新，在巧：渔村的晒网架翻起来便是炮位，岩洞口垒起珊瑚石便是射孔，退潮时的暗礁图恰是守军的路引。工事既成，妇人孩童各知就近躲入哪一处洞，井水往何处藏，粮往何处移。有入侵过的幕府斥候被放回，只带一句话：「岛上每块石头后头，都可能站着人。」守护家园，寸土皆是关口。"
 
 SAN_heroic_propaganda_campaign:"英雄史诗宣传行动"
 SAN_heroic_propaganda_campaign_desc:"歌起渔火里，英雄的名讳编作岛歌，唱彻夜航船。前线的战功，经诗人编成岛歌，随商船渔火传遍各岛。渡口的船娘唱，学塾的孩童也唱，唱到「潮退三更月照甲」一句，满船都静了。战士们听了，磨刀更勤。有老兵说：「名字进了歌里，人便不敢偷懒了。」"
 
 SAN_defense_line_coordination:"防线协同强化"
 SAN_defense_line_coordination_desc:"大御神之佑，化作岩壑之森严。各处的防线原本各自为守，号令不通。今立统一的调度之台，凡一处受压，左右两线的火炮即时调转，援兵循暗道而行。演试那日，东台假作被攻，未及一炷香，西线的援军已绕至「敌」后。守将叹道：「从前是各守各的门，如今是一座岛守一处。」"
 
 SAN_black_market_supply_deal:"黑市物资交易协议"
 SAN_black_market_supply_deal_desc:"禁令锁明面，暗巷深灯照旧通，珠换铁与盐。封锁之下，明面的商路断了，暗处的路却从未断过。心海遣人与离岛黑市首脑密议，以珍珠易工业器物与稀有矿石。交易在深夜的货栈里完成，银货两讫，各自不问来路。管事回来禀道：「这条路脏些。」心海道：「脏些，好过断气。」一时岛上炉火，竟没有一夜熄过。"
 
 SAN_first_phase_offensive_prep:"第一阶段攻势筹备"
 SAN_first_phase_offensive_prep_desc:"万事俱备，只欠东风。动员既毕，防线既固，反攻的章程便摆上了案。名椎滩的潮时、风向、暗礁，皆写在图的边角。心海挑进攻的日子，挑得极细，左右催她，她说：「潮水不等人，也不骗人。」签发的当夜，各营的灯皆亮到天明。第一阶段的目标只有一句：撕开封锁，直入神无冢。"

 # ========================== 第二阶段：内战烽火 (31-70) ==========================
 SAN_kannazuka_offensive_strategy:"神无冢攻势战略"
 SAN_kannazuka_offensive_strategy_desc:"名椎滩的血斛开过几轮，剑锋所向，便是神无冢。此地为稻妻工业命脉所系，得之则军械自丰。战法两头并进：正面陈兵牵制，另遣锐士自裂谷侧翼潜入，断其水源与炭道。动员那夜，各营磨刀声连成一片，火把映着滩涂上的血斛，红得像铁。心海巡营至三更，只嘱咐一句：「夺炉不毁炉，那炉往后是众人的饭碗。」将士皆应。此役轻重，人人心里有数。"
 
 SAN_seize_mikage_furnace_action:"夺取御影炉心行动"
 SAN_seize_mikage_furnace_action_desc:"御影炉心是稻妻最大的心脏，得之则军工血脉自通。突袭之队趁雷雨夜进山，先断外联，再取炉前。守炉的幕府兵未及列阵，火把已从三面围拢。炉心到手那日，炉火未熄，工匠原班留用，只在炉口换了守卫的名册。心海在报文上批了一行：炉留人，人留技，技留稻妻。勇士们冒着祟神之气进出的那段路，往后要写进军歌里去。"
 
 SAN_nazuchi_beach_deployment:"名椎滩战术部署"
 SAN_nazuchi_beach_deployment_desc:"夕照名椎滩，血斛开处即疆界，登岸莫迟疑。名椎滩地势平阔，最宜敌军大举抢滩，故纵深阵地设了三层：滩头沉船作垒，滩后旧船架炮，林缘掘壕相接。血斛的红花丛恰是天然的地界标，守军记方位皆以花丛为准。敌军几次试探登陆，皆被压在滩涂上进退失据。守将传令各营：「敌登岸三日之内，滩上不许他站稳脚跟。」踏鞴砂的炉火，就在这道滩的身后，不容有失。"
 
 SAN_tatarasuna_reconstruction_plan:"踏鞴砂重建计划"
 SAN_tatarasuna_reconstruction_plan_desc:"战火退了，废墟里得有人来点灯。踏鞴砂工业区的修复全线铺开：依缴获的图样重建炉体，依旧匠的名册召回技工。原先的「神不在之丘」，一夜一夜亮起来。头一座炉复燃那天，四周山民都来看火光，有人当场落泪，说是十年没见过这么亮的山。熔炉为自由而烧，此话从口号变成了眼前的火。"
 
 SAN_yashiori_island_pacification:"八酝岛平定行动"
 SAN_yashiori_island_pacification_desc:"八酝岛受祟神余恨之蚀久矣，田荒井浊，夜有异声。平定之役两线并行：巫女与卫队深入灾区，仪式安抚神骸；民众分批后撤，粮药随之。撤离的队伍与进岛的队伍在石阶上错身，谁也没说话，只互相点了点头。仪式做完那夜，异声止了，井水复清。一道心理与物资的双重防线，就此在岛上立了起来。"
 
 SAN_tatarigami_containment_project:"祟神能量遏制工程"
 SAN_tatarigami_containment_project_desc:"海祇的虔诚，足以净化千年之怨。祟神遏制之役全线开工：神龛依古法重立，导流之槽依山势而凿，怨气入槽，汇于深池，不再漫进田里与井里。八酝的农户头一年收成回涨，村口的井水试了三回，皆清。这既是民生，也是军实：怨气蓄于池中，可引可导，或成一脉战时的能源。田安了，人心便安了一半。"
 
 SAN_fontaine_engineering_outreach:"联络枫丹工程团队"
 SAN_fontaine_engineering_outreach_desc:"远客自枫丹，机巧携来通海气，炉边添新师。枫丹的工程师滞留稻妻者，心海遣人一一拜访问候，请其入工坊共事。泽维尔到了踏鞴砂，先绕炉看了三圈，末了道：「这炉的脾气，得顺它。」一时枫丹的图纸与海祇的手艺合在一处，机器的声响齐整了，出活的时辰也短了。工人们说：「外来的师傅，倒真懂这炉。」"
 
 SAN_secret_liaison_with_kamisato:"神里家秘密联络"
 SAN_secret_liaison_with_kamisato_desc:"笺素渡夜海，社奉行中通款曲，盟成白鹭洲。欲孤立天领奉行，海祇与社奉行神里家暗通款曲。信使月夜渡海，笺上无印，只在折角处各留一枚樱瓣。两家所求一致：废眼狩令。所议之事，各自半个字也不外泄。绫人回的短笺只一句：「稻妻的天，总要有人先去撑。」盟约无形，胜过有形，幕府的铁幕，自此从里面松了一根栓。"
 
 SAN_kazuha_vanguard_strategic_unit:"万叶先锋战略单位"
 SAN_kazuha_vanguard_strategic_unit_desc:"身在人间，心向山水，一柄刀上风声起。枫原万叶应募而来，随行者不过十数人，行囊里却只有酒与诗。海祇为这队人单设一营，不问来历，只付了一句话：阵前自由，阵后同罪。万叶初到，先在海边坐了半日，看潮起潮落，末了笑道：「此地风好，宜出刀。」突袭之战，此营自侧翼入阵，如风穿林，敌阵未合先乱。军中遂传：见叶落，须防刀。"
 
 SAN_shumatsuban_collaboration_tactics:"终末番协同战术"
 SAN_shumatsuban_collaboration_tactics_desc:"社奉行默许之下，终末番的忍者陆续来投。这些人来去无声，惯走夜路，投名状只有一句话：不问姓名，只问结果。海祇的侦察营跟着学：藏身术、循声辨位、一夜八十里的脚程。两下切磋了半年，侦察营的白刃与潜行俱进。有忍者临别留了一句：「黑暗里的账，终归要拿到阳光下去算。」阴阳两面的功夫，都在暗中长进。"
 
 SAN_higi_village_relief_action:"绯木村救援行动"
 SAN_higi_village_relief_action_desc:"病气锁孤村，药船一至门重启，烟火渐次归。绯木村为祟神所困，怪病流行，人心惶惶。心海令药船载药渡海，重病者移往后方调养，轻者就地服药，井水一一检验。半月后，村里先响起了鸡鸣，继而炊烟。有老妇送医官出门，往他袖里塞了一把炒豆，道：「救人的人，先吃饱。」"
 
 SAN_ore_extraction_modernization:"矿产开采现代化行动"
 SAN_ore_extraction_modernization_desc:"旧矿开了新眼。八酝岛的矿井依白夜国的旧法改装：绞盘加齿，轨道铺洞，晶化骨髓的采选一日千里。原先矿工背筐爬坡，一日两趟；如今轨道车往来，一日八趟，人反倒轻省。冶炼坊的料仓自此不见底，锻刀的火再没歇过。矿上的老工头摸着新轨道道：「从前矿养人，如今矿养刀。这洞里每一筐石头，出去都是弹丸。」账册添新页，产量翻番，皆记着白夜的名字。"
 
 SAN_musoujin_gorge_defensive_line:"无想刃狭间防线"
 SAN_musoujin_gorge_defensive_line_desc:"天雷劈下的裂谷，今成天堑守门闩。无想刃狭间深不见底，谷口风急，鸟难横越。守军依崖设垒：索桥两道，皆可一日拆尽；崖顶炮位三层，射界互相遮护。幕府军两次试探，皆在谷前顿兵。守将夜里巡崖，俯看谷底流云，对左右道：「将军一刀留的地界，如今替百姓守着，也算这刀没白挥。」谷上的灯火，自此夜夜不熄，敌人望之，如望一道裂开的门神。"
 
 SAN_weapon_forging_standardization:"武器锻造标准化"
 SAN_weapon_forging_standardization_desc:"稻妻的刀是艺术品，战争要的却是数量与齐整。踏鞴砂的工坊归并，武器之规格统一成册：尺寸、分量、口径，皆有定数。匠人从艺术的手转向工业的手，头一个月都别扭，第三个月，出械的数翻了倍。士兵的武装快了，补给的零件互通了，前线的战力实打实地涨了。老刀匠收起了最后一柄手工刀，说留给孙子看。"
 
 SAN_recruit_yashiori_volunteers:"八酝岛志愿者招募"
 SAN_recruit_yashiori_volunteers_desc:"祟神平后，八酝岛的幸存者自己找上了军门。这些人半家园毁，眼里有火，报名册一日填满三册。募兵官原想按例体检再收，见他们立在那里不动，便把册子直接递了出去。编入新师团那日，无人讲话，各人只把自家村子、自家亲人的名字写在布条上，缠于腕间。操练最苦的一段，他们抢着去；驻防最险的一处，他们自己请。腕上的布条一日洗一次，字迹淡了再描。复仇的权利，自家的土地，皆在这一缠一洗之间。"
 
 SAN_mikage_furnace_overload_safety:"御影炉心过载安全协议"
 SAN_mikage_furnace_overload_safety_desc:"炉心是匹烈马，须有缰。愚人众屡屡窥伺踏鞴砂，炉心遂立安全之约：祟神能量分档调控，过三分则减料，过五分则停炉，值守者有权先停后报。章程颁行那日，有工匠嫌碍产，监正指着墙上旧事簿念了一段：昔年炉心过载，半山为墟。念完满堂无声。此后炉前多了一口铜铃，铃响即停，无问官阶。老工人说：「这铃比赏钱金贵，听见它，就是命。」"
 
 SAN_sabotage_tenryou_supply_lines:"破坏天领奉行补给线"
 SAN_sabotage_tenryou_supply_lines_desc:"截其辎重，乱其粮草，胜兵先胜于灶。情报网引路，轻装之队夜出：神无冢与鸣神岛之间的粮站、炭场、驿马厩，一一过手。得粮不烧，混入沙土；得马不杀，放归野林；驿传的木牌一夜换了三处地名。月余，幕府前线的军报全是催粮的字。幕府军士夜半轮岗，怀里揣着冷饭团，望着黑黢黢的山影骂人。总攻之前，先让对面的锅凉下来，这一课，兵书早写明了。"
 
 SAN_kujou_encampment_siege_plan:"九条阵屋围攻计划"
 SAN_kujou_encampment_siege_plan_desc:"钉子先围后拔，蛇自洞出，一击而毙。九条阵屋乃天领奉行前进之基，粮械皆囤于此。心海定计：先断其水道与驿路，围而不攻，示弱于东。敌军果出主力来夺粮道，行至预设谷地，两翼火炮齐发，退路早被沉船堵死。一战竟功，阵屋易帜。清点时发现敌囤粮三千石、炭二百担，皆完好，军需官喜得直搓手。战后心海在图上落一枚珠子，道：「钉子拔了，门轴还在，别松劲。」"
 
 SAN_wartime_propaganda_expansion:"战时宣传扩张"
 SAN_wartime_propaganda_expansion_desc:"让真相走到铁幕的另一边去。传布的渠道全面铺开：渔船的舱底夹着小册，说书的新词里埋着时事，学塾的孩子回家复述功课，功课里藏着勘定奉行的贪账与天领奉行的横事。稻妻的民众渐渐明白了一个词：解放者。海祇的意志，就这样一村一镇地，成了受压之人心里的盼头。"
 
 SAN_centralized_command_structure:"中心化指挥结构"
 SAN_centralized_command_structure_desc:"师团既渐多，旧制扁平不相宜，令出一灯台。战事既扩，各师团散在诸岛，旧日扁平的章程渐不济事。心海遂立中心调度之制，战略令自珊瑚宫直下各师，中间不设冗层。试行一月，响应快了数倍。有将佐私议此制太拢权，她闻之只道：「战时如此。战罢再议，我不恋这个权。」"
 
 SAN_resource_stockpiling_strategy:"资源储备战略"
 SAN_resource_stockpiling_strategy_desc:"未雨先修檐。各控制区强立战备之仓：铁锭、粮米、雷晶、药材，分类分仓，湿者垫板，贵者加锁。仓册三写：仓吏一册，官库一册，副本送珊瑚宫，岁末对勘。头一年虫蛀了些粮，此后仓底皆铺细网，鼠不能近。有人笑这些仓是死钱，心海答：「潮有落时，仓是落潮时的岸。」次年海路一断，前线的补给竟未歇一日，笑声没了。死钱活用，方是储备的本意。"
 
 SAN_amendment_of_the_code_of_conduct:"行为准则修正案"
 SAN_amendment_of_the_code_of_conduct_desc:"月照军门静，条规章悬众目间，秋毫无犯时。行为准则修订既毕，誊作大字，悬于各营辕门。原来军中旧例，掠民者笞，新章又添一条：伤平民者，虽将官不贷。一时军士过门，皆驻足读一遍才走。有营官私下嘀咕太严，五郎闻之，只道：「百姓看军中人的眼，比看刀更细。刀钝了能磨，眼冷了，磨不回来。」次日操练，营门外卖菜的老妪照旧支摊，无人再驱。"
 
 SAN_watatsumi_trade_routes_protection:"海祇贸易航线保护"
 SAN_watatsumi_trade_routes_protection_desc:"海浪滔天处，铁甲巨舰巡航忙，商船安然归。幕府的海上封锁既立，护航的编队随之而立：要津布巡逻之艇，暗礁设防线，商船编队而行，舰在侧，灯在前。与离岛及异国的贸易自此未歇一旬。货主们在码头上立了块木牌，写着四个字：风浪有伴。经济的血脉，就这样在炮口的注视下，一船一船地续着。"
 
 SAN_joint_staff_military_academy:"联合参谋军事学院"
 SAN_joint_staff_military_academy_desc:"院立珊瑚宫，兵书与新学同案，青蓝相继时。军校设在宫侧旧书院，五郎亲授操典，术士授水文，账房先生竟也有一席，教的是粮秣核算。头一期的学员多是渔民子弟，起初听不懂沙盘，一个月后，能就着一幅海图吵半个时辰。结业考是实兵推演，胜负各有，考官只问一句：败了，何处可救。有学员答得周全，五郎批注：可带队。一时书院灯火，夜夜过半，稻妻军中的新骨，就在这灯下一点点长成。"
 
 SAN_industrial_migration_plan:"工业迁移计划"
 SAN_industrial_migration_plan_desc:"不把鸡蛋放在一只篮里。踏鞴砂的精密工坊，一部一部迁入海祇岛山腹，洞口以珊瑚岩砌伪，远看只像寻常礁壁。迁移那半月，山路夜夜有灯火，抬机器的号子压得极低。迁毕试产，炉火在洞中亮起，热气顺着旧泉眼散出去，山外草木不损。监工的老匠抚着洞壁道：「从前怕敌舰的炮，如今炮来，山替大伙儿挨。」账册上添一行小注：核心产能，皆在巫女眼皮底下。"
 
 SAN_advanced_reconnaissance_missions:"高级侦察任务"
 SAN_advanced_reconnaissance_missions_desc:"轻舟夜渡海，影向山下无人识，来去一叶间。侦察之士携缴获的器物与炼金探测仪，潜入鸣神岛影向山左近，幕府哨卡竟无人知觉。所获布防图册，逐日递回珊瑚宫。心海于灯下摊图，以朱笔轻点数处，道：「决战之期未至，先把这些门认熟了。」"
 
 SAN_frontline_medical_support_reform:"前线医疗支援改革"
 SAN_frontline_medical_support_reform_desc:"阵前设医帐，抬回一个是一个，军心自不摇。前线的医疗重编：急救站设在火力之后半里，重者分级后送，药材按各营伤亡的比例拨付。原先伤兵多用渔船运，颠簸一夜，人没到宫先没了。如今快船接力，救回的多了。军中相传一句话：「海祇不丢下人，所以人不肯散。」"
 
 SAN_watatsumi_naval_shipyard_expansion:"海祇海军造船厂扩张"
 SAN_watatsumi_naval_shipyard_expansion_desc:"深水港湾内，重锤声声震碧波，铁船向远洋。踏鞴砂的工业之果用到了船上：船台扩了三倍，龙骨的料换成了新炼的钢。要造更大的蒸汽战舰，让海祇的蓝色之旗飘到更远的海面上去。下水那日，全港的人来看，船身入水的一瞬，浪花高过船头，欢呼声压过了浪声。稻妻的海洋霸权，就从这一副龙骨上，一寸一寸夺回来。"
 
 SAN_strategic_reserve_mobilization:"战略储备动员"
 SAN_strategic_reserve_mobilization_desc:"决战前夕，底牌翻开。隐匿的战力尽数出册：最后一批适龄的志愿者、退役的老兵、渔村的护村队，整编为预备队师团。点名那日，队伍从码头排到山脚，被点到的应一声「在」，声浪一波接一波。这些储备的力，将作为压垮幕府防线的最后一根稻草，在最要紧的时辰投入战场。毕其功于一役，此其时也。"
 
 SAN_shrine_defence_coordination:"神社防御协同"
 SAN_shrine_defence_coordination_desc:"神社所在，即是节点。各岛神社部署小队的精锐，平日守社，战时守口。社前一株樱、一挂注连绳、一座鸟居，皆是士卒心里的一根梁柱。幕府军攻过一处神社，半日不克，伤亡数倍于别处，军报里写：守者皆死战，无一人退。心海闻之，命各社战死者名讳录于社册，每年樱开时诵一遍。信仰之地，守的是地，也是心。"
 
 SAN_logistical_efficiency_overhaul:"后勤效率大整顿"
 SAN_logistical_efficiency_overhaul_desc:"心海的算学用在了粮车上。后勤的账目通盘重算：哪一段路换船，哪一段换骡，哪一处该设中仓，皆以数定。原先一石米运到前线，路上耗三成；如今环节减半，损耗不足一成。军需官初时不服，同她当面算了三日夜，末了拜服。前线的士兵只觉得饭是热的，箭是足的，不知账房里熬灯的辛苦。心海在册尾批了一行小字：子弹到得早，营里少名单。"
 
 SAN_maritime_patrol_fleet_setup:"海上巡逻舰队组建"
 SAN_maritime_patrol_fleet_setup_desc:"近海已清，远海须巡。中型巡逻舰队组建既毕，八酝至鸣神间的深水道，旬旬有船。海乱鬼的巢穴一处一处清，幕府的哨船见了旗便避。巡防的章程写得细：遇商船验牌放行，遇渔船问风送水，遇敌船先喊话后动手。头一个月缉获海乱鬼三舟，渔民们凑了鱼干送到码头。舰长在日志里写：「海清了，渔火才敢亮；渔火亮了，这条走廊才算真通。」"
 
 SAN_elite_warrior_training_reforms:"精锐勇士训练改革"
 SAN_elite_warrior_training_reforms_desc:"乱世练精兵，短兵相接寸土争，一刃定生死。近身接战之术重编：武艺之外，兼习借势，墙垛、桅杆、断桅，皆可藏身。操演时以湿布蒙眼，于窄巷中辨声而进。结业那日，教头令他们车轮战一名老兵，老兵被围十数重，竟撑到茶凉。教头道：「他们出阵，便是凿子，专凿最硬的那处甲。」"
 
 SAN_synthetic_material_research_action:"合成材料研究行动"
 SAN_synthetic_material_research_action_desc:"踏鞴砂的副产物，向来当废料堆着，如今成了宝。合成材料的研究以此起步：新料入甲，韧而不沉，装甲的分量轻了，骨头却硬了。试验场里，新甲板挨了一轮弩矢，面上只有白点。与幕府重型装备的那一层代差，就这样一层一层地补。工坊的墙上贴着一张字条，是某位学徒写的：废料堆里，藏着明天的甲。"
 
 SAN_national_conscription_arrangements:"国民征兵安排"
 SAN_national_conscription_arrangements_desc:"为着正道，一岛之人皆愿执戈。征兵的册子重造：不按门第，按丁口；不问贫富，同体检。免役有章，独子奉亲者缓征，学子延役，人人都看得懂。征募那日，渡口排起了长队，有人替亡兄报名，有人自邻岛赶船而来。册房的老书吏一笔记下，一笔不改。原来海祇打的不是官家的仗，是家家户户自己的仗，故册上有名者，无一人叫屈。"
 
 SAN_heavy_artillery_deployment_plan:"重型火炮部署计划"
 SAN_heavy_artillery_deployment_plan_desc:"巨炮上高台，一响山摇海失色，垒灰随风散。御影炉心改出的铸炮之法，铸成攻坚的重炮，先在演武场试射。炮响处，百步外的石垒塌了半边，众人耳朵里嗡嗡半日。重炮随即部署于各处高地，炮口所向，正对幕府防线的关节。有炮手夜里巡炮，摸着冰凉的炮身说：「明日谁也拦不住它说话。」"
 
 SAN_experimental_aircraft_prototype_plan:"实验性航空雏形计划"
 SAN_experimental_aircraft_prototype_plan_desc:"木骨配帆布，雏鹰离地三尺高，痴心敢问天。白夜国太阳神车的传说与枫丹的机械，一时都成了图纸。造出的飞行器裹着帆布，木架上还带着胶味，离地不过三尺，飞了半条巷便落下来。众人都笑，造它的人不笑，只记下坠处，改了再试。有人问他图什么，他说：「鸟也没跟谁商量过。」"
 
 SAN_total_war_industrial_focus:"全面战争工业重点"
 SAN_total_war_industrial_focus_desc:"齿轮与熔炉，吃下了全国的力气。非急需的轻工尽数停歇，织机改锤，茶炉让位，举国之力尽数倾入军工。妇孺拆料，老者记账，渔船改运矿石。极端的集中换来了极端的产能：与幕府长期相抗的战争工业，就在这几个月里立了起来。海祇岛成了一座钢炉，炉口朝着幕府的方向。"
 
 SAN_narukami_infiltration_strategy:"鸣神岛渗透战略"
 SAN_narukami_infiltration_strategy_desc:"雷暴声里，影子早已进了城。鸣神岛的渗透营历尽三月，散入稻妻城的市井：有充账房先生的，有挑担卖针线的，落脚处皆离天守阁不远。总攻令下之日，城中三处同时举事：断其驿传，乱其更鼓，门户自内而开。城外的兵未动，城里的钟先哑了。有潜伏者事毕自坊间撤出，混在早市人潮里，与相熟的菜贩点头而过，那菜贩竟是同袍。铁幕自内裂，不待外锤。"
 
 SAN_tenshukaku_offensive_arrangements:"天守阁总攻安排"
 SAN_tenshukaku_offensive_arrangements_desc:"最后的时辰到了。诸军齐集鸣神岛边缘，只候现人神巫女的号令。心海立于崖头，身后是连绵的帆，身前是天守阁的灯。她把袖中的令旗抽出，又不急着举，先朝海拜了三拜。众军肃然。为着大御神的荣光，为着凡人的愿望，旗落，炮鸣。天守阁的方向，夜色裂开了一道口子。"

 # ========================== 第三阶段：平定旧域 (71-110) ==========================
 SAN_seirai_island_expedition_strategy:"清籁岛远征战略"
 SAN_seirai_island_expedition_strategy_desc:"雷云锁孤岛，行军图上无坦途，先算风雨来。清籁岛雷暴经年不散，进军之前，雷期、潮汛、船期，皆要算到最细。浅濑神社的旧事，越石村的老人口中还有零星几段，皆录成册随船。此去既为失落的资源，也为平定诸岛背后的乱源。船离港那日，天边雷云压得极低，老舵工看了一眼，道：「雷要收了，正是好时辰。」"
 
 SAN_unseal_amakumo_thunder_plan:"解封天云雷暴计划"
 SAN_unseal_amakumo_thunder_plan_desc:"浅濑响留下的法术残片，字迹已淡，理路犹存。学者依其法，试着引动天云峠的雷暴：不求它熄，先求它顺。头一回引动，雷云的走向偏了半里，观测的众人半日不敢出声。此法若成，那股忿恨之力可得安放，海祇亦可得一脉电讯之障，敌械近身即乱。雨季过后，天云峠的雷声，竟真的一日日温驯了些。"
 
 SAN_koseki_village_rehabilitation:"越石村康复安排"
 SAN_koseki_village_rehabilitation_desc:"雷鸣散后，笑语当还此村。越石村的居民陆续迁回，屋塌了半数，渔船烂在滩上。海祇遣行政与工匠两队常驻：修船先修大家共用的两条，立契谁先用谁后用；补助按户发放，不设酒宴，不贴告示，只挨家走一遍。头一个月，村里夜晚还是黑的；第三个月，补网的老妇们又在码头聚齐了。有老人拉着工作队员的手不放，说：「回头走的时候，别连灯一起带走。」后方既稳，前线的米袋也沉了。"
 
 SAN_ako_domeki_legacy_investigation:"百目鬼遗产调查行动"
 SAN_ako_domeki_legacy_investigation_desc:"雷暴锁孤舟，昔年海盗今何在，遗册在残躯。赤穗百目鬼乃传说中海盗王，其人虽殁，威名犹在。心海遣人入清籁岛雷暴之地，寻其遗下的财货与战册。清籁丸残骸打捞数月，得旧航海图一卷，图上朱批历历，皆百年前的海战心得。老水手见了，抚图半日道：「这一手走位，如今没人会了。」"
 
 SAN_seirai_maru_salvage_operation:"清籁丸打捞工程"
 SAN_seirai_maru_salvage_operation_desc:"破败的巨舰在星光下垂泪。清籁丸半沉在雷暴之侧，桅折帆烂，船身犹存。打捞之役举全岛之力：潜工下海探舱，绞盘与浮囊并用，雷期一到便撤，雷歇再续。三个雷汛之后，巨舰终于浮出水面，船底的贝与珊瑚厚得像一层甲。工程师抚着船舷道：「老船出了这么多年的力，如今该轮到它再站一班岗。」这不止是文物归位，是海祇工程之力的见证。"
 
 SAN_thunder_manifestation_study:"雷音权现研究行动"
 SAN_thunder_manifestation_study_desc:"雷音权现，纯粹忿恨化雷霆，凡人探秘行。科考队以学者与武士混编，隔着重重护障，观测这一尊元素之灵。它每一度的怒起，电弧的走向、鸣声的节拍，皆录成册。册上的规律渐渐连成线，雷元素的感应之器依此制成，军中的电讯对抗陡然精进了三层。观测日志的末页写着一行小字：它恨了一千年，如今这恨，替活人干事。"
 
 SAN_asase_shrine_restoration_plan:"浅濑神社修复计划"
 SAN_asase_shrine_restoration_plan_desc:"社朽岛心荒，一担梁木渡海来，人心自归附。清籁岛浅濑神社年久倾颓，岛民散落，香火几绝。心海以修缮为第一件政事，命人备足梁木瓦料渡海送去，交与代理宫司寝子。寝子得了材料，一时兴工，社貌日日一新。岛上老人来看，站了半日，末了道：「社活了，岛便也活了。」信仰既复，人心自向珊瑚宫。"
 
 SAN_storm_rider_training_action:"雷暴骑兵训练行动"
 SAN_storm_rider_training_action_desc:"清籁的雷区就是演武场。雷暴骑兵选胆大心细的苗子，在雷雨里练行军，在风口练张弩，在电光里练辨识方位。头一期练完，十人里瘦了九人，唯有马比来时壮了。教官的章程只有一句：雷不等人，练时如战时。此后风暴骤起，别营收兵，此营反冲。他们成了恶劣天候里的王牌，影随雷至。"
 
 SAN_seirai_naval_fortress_strategy:"清籁海军要塞战略"
 SAN_seirai_naval_fortress_strategy_desc:"清籁南岸，礁脉如齿，正好作要塞的骨。海防炮藏于礁腹，水雷哨设于浪口，雷暴期即是天然的封锁期。要塞成后，稻妻通往暗之外海的咽喉，便捏在海祇手中。守军的营房凿在岩里，冬天听雷，夏天听潮。有士兵新来，夜里被雷惊醒，老兵说：「听惯了，雷就是更夫。」清籁从此是南边的盾牌，盾牌的影子，一直铺到外海去。"
 
 SAN_amakumo_energy_harnessing_plan:"天云能量捕获计划"
 SAN_amakumo_energy_harnessing_plan_desc:"雷藏云峠里，一朝引下作灯明，天怒化炊烟。天云峠素为雷暴所据，舟人不敢近。工匠遂于其地立集电巨木，引天雷入地脉，沿海底电缆送回各岛工坊。初合闸那夜，诸岛灯火齐明，渔村老妪对着灯看了半日，道：「天上发怒，原来也能给人烧水。」"
 
 SAN_tsurumi_island_reconnaissance_plan:"鹤观岛侦察安排"
 SAN_tsurumi_island_reconnaissance_plan_desc:"雾里探旧俗，鹤观轮回千载事，先访雾中灯。鹤观是世所遗忘的禁忌之地，先行者趁雾隙登陆，循着雾中忽明忽暗的灯火寻路。岛中心的路径只有一条，错一步便是原路。侦察不为拓地，先为揭开雾海之后的远古真相：血祭的来历、雷鸟的旧约、木灵的歌。卷宗一页页补全，雾里那座岛，终于有了轮廓。"
 
 SAN_dispel_fog_over_tsurumi_action:"驱散鹤观迷雾行动"
 SAN_dispel_fog_over_tsurumi_action_desc:"千载雾锁岛，一羽白鸿引归路，灯自雾中生。阿瑠之羽送回后，巫女们依羽上残存的祈语，学着与迷雾里的声音说话。惑饲滩与逢岳之野立起元素灯塔，塔灯初亮那夜，雾竟退开一线，露出久违的星。岛上的老祭司看见灯，跪下去半日不肯起，说是他祖父的祖父走时，岛上也亮过一回这样的灯。此番轮回归结，诸岛议定：鹤观的灯，往后夜夜长明，不再让它熄了。"
 
 SAN_save_ruu_soul_strategic_action:"救赎阿瑠灵魂战略"
 SAN_save_ruu_soul_strategic_action_desc:"阿瑠的歌，不该再在血祭里打转。心海亲主此役，巫女列班，循地脉节点一一修补：断处续之，乱处理之，淤塞处以祝词通之。行至最后一节，忽有白羽自雾中落下，落在祭坛正中，众巫女屏息。远征鹤观的船既备，军械之外，多载了成箱的清酒、盐与御守。老祭司在码头合掌，只说了一句：「这一趟，去接人回家。」"
 
 SAN_kapatcir_restless_energy_containment:"卡帕奇莉能量遏制"
 SAN_kapatcir_restless_energy_containment_desc:"雷鸟遗怒未曾散，紫色电光犹在山头走。卡帕奇莉的残能屡屡暴走，劈断古木，惊散渔汛。海祇遂立元素拘束之局：以雷晶列阵收其频率，导引入蓄能之塔，怒时收，顺时放。头一回收束成功，塔身嗡鸣半日，山下的灯火竟亮了几分。老祭司望着塔道：「她生前护过这座岛，如今她的怒气也归了灯，倒像她还在。」雷与电自此有了两处归宿：一处在天上，一处在塔里。"
 
 SAN_moshiri_ritual_site_reform:"茂知祭场改革安排"
 SAN_moshiri_ritual_site_reform_desc:"血祭之地，换了香火。茂知祭场的旧坛拆去杀伐之器，改立讲席与画案：整理鹤观的旧文字，拓录古石上的刻痕，孩童白日识字，夜里听老人讲祖先的歌。原先每岁血祭的口子，如今是赛歌的日子。有老巫祝起初日日来坐，说是守着旧神；半年后，竟抱着一摞拓片来找学者对字。心海闻之，在文书上批了八个字：旧神让路，让的是火。鹤观的心，就这样一寸一寸地贴了过来。"
 
 SAN_mt_kanna_mining_exploration:"菅名山矿产勘探行动"
 SAN_mt_kanna_mining_exploration_desc:"菅名山的大坑底下，卧着好石头。诅咒既解，勘矿的队伍背着绳梯与罗盘下去，洞里静得能听见彼此的心跳。头一层采得晶化骨髓，再往深处，竟寻得几种稀有的合金之料，入炉一试，韧性强了三成。矿样送回踏鞴砂，老铸师捧着看了半晌，道：「有了它，重甲的厚度能减一分，马就省一分力。」坑口遂立了矿籍，谁下的洞、采几何，皆有册可查。山有藏，国有账，两不相欺。"
 
 SAN_shirakoro_peak_observation_post:"知比山观测站建设"
 SAN_shirakoro_peak_observation_post_desc:"知比山的高处，云雾在脚下过。观测之站依遗迹旧法改建：塔顶安置望天之镜，山腹设值守之房，昼夜有人盯云、记风、录雨。稻妻全地的天时自此有了谱，船队出海先问山，炮期排演先看册。老站长是渔家出身，他说：「从前看天靠经验，如今看天靠册子，可册子上的字，一笔一笔还是从天上下来的。」精准的天时，是海上行动的先手。"
 
 SAN_riftstalker_containment_tactics:"兽境猎犬遏制战术"
 SAN_riftstalker_containment_tactics_desc:"深渊来的东西，怕的不是刀，是道理不对路。鹤观境内「兽境」之兽游荡，噬地气，乱心神。海祇遂立专章：研其弱点，以特定元素相克，蚀其腐蚀之力；又训士卒列阵不乱，闻异响先护耳目。头一回遭遇战，兽群突至，阵型竟未散一寸，事后点验，伤者三人，皆轻。此例写成手册，发至各岛。老教官说：「与怪东西打，胆要稳，谱要对。谱对了，深渊也啃不动队伍。」"
 
 SAN_ancient_civilization_study_action:"远古文明系统性研究"
 SAN_ancient_civilization_study_action_desc:"壁上画犹存，石根文字待重读，天钉落之前。鹤观的壁画与石根文字，经学者们反复摹拓，渐渐译出。天钉落下之前的旧事，一时有了眉目。众人这才知道，眼前这座岛，原是一段被封印的文明之外遗。有老学者抚碑良久，道：「咱们不是在治一岛，是在替千年前的故人看家。」"
 
 SAN_tsurumi_coastal_radar_setup:"鹤观海岸雷达设置"
 SAN_tsurumi_coastal_radar_setup_desc:"知比山的地下遗迹里，藏着远距离波段测天之法的根。依此造出的第一台雷达，立在鹤观最偏的海角。此地偏，恰是好处：外海来的任何动静，先过它这一关。站上的值守极清苦，一盏灯，一册记录，一只取暖的火盆。老站员说：「全岛的觉，都托给这一盏灯了。」黑幕之后的不速之客，自此再难遁形。"
 
 SAN_shirne_maiden_of_outer_islands:"外岛巫女巡抚行动"
 SAN_shirne_maiden_of_outer_islands_desc:"现人神的祝祷，当遍及每一座岛。巡抚之团派往清籁与鹤观，分支的社务所随之而立：户籍、医帐、学塾，一样一样办起来。巫女每到一村，先拜本地的神，再宣珊瑚宫的令，两样都不偏废。鹤观的老人起初闭门，后来听说社里分盐分药，门便开了。三处领土就此缝在一处，缝线的针脚，是一趟一趟的渡船。"
 
 SAN_veteran_resettlement_program:"老兵移居安置行动"
 SAN_veteran_resettlement_program_desc:"新附之地的边上，先扎下老兵的篱笆。清籁与鹤观划地安置：退伍之士领田、领农具、领一间屋，官家协助修渠修路。老兵们白日垦荒，夜里照旧列操，村民看了一季，心便定了。有人问老兵苦不苦，一个断了两指的老兵举起手笑道：「这双手拿刀是刀，拿锄是锄，饿不着。」边境的地界上，稳，就这样一户一户长了出来。"
 
 SAN_fortress_network_expansion:"要塞网络全域扩张"
 SAN_fortress_network_expansion_desc:"高台相犄角，炮口遥遥相守望，群岛一张网。诸岛的高处修起炮台与阵垒，彼此的射程相接，一处举火，处处可见。防务的图挂满一墙，线与线交织，如渔网收口。演习那日，敌军假想抢滩，未及半程，三面火力已至。守将收图时说：「海面再宽，进了这张网，便都是靶子。」"
 
 SAN_islands_economic_integration:"诸岛经济整合战略"
 SAN_islands_economic_integration_desc:"孤岛各有产，串作一环便活络，互济自成城。海祇出珍珠，清籁出雷晶，鹤观出矿石，原先各卖各的，价被中间商压得极低。如今三岛立了互市之约，你家的货换我家的粮，船一靠岸便两讫。头一年冬，鹤观歉收，清籁的粮船顶风而去，岛上人记了这份情。次年鹤观的矿石便贱卖三成，账面上吃亏，人心上赚回。老会计笑道：「这盘账，一半在纸上，一半在海上。」"
 
 SAN_outer_defence_command_reforms:"外海防御司令部改组"
 SAN_outer_defence_command_reforms_desc:"外海三岛，一令同调。外海防御司令部设于清籁，清籁、鹤观、海祇的防务归一统筹：烽号、旗语、潮信，三岛同一本册子。原先各岛自守，援兵互相等；如今责任划片，谁的门口谁守，谁的背后谁接应。演试那日，鹤观举烽，清籁出船，海祇备械，半日齐备。司令官在总结上写了一句土话：「邻居家的火，烧不到你家墙，是因为你家先去挑了水。」"
 
 SAN_maritime_trade_monopoly_strategy:"海洋贸易垄断战略"
 SAN_maritime_trade_monopoly_strategy_desc:"诸岛在手，南方之海的市易便有了主。海祇以政令立专属之权：凡过此海域的商船，皆须受官验、纳官税，税册公开，斤两分明。初时外邦商人叫苦，几月后见港口无盗、货价无欺，反倒认了这门规矩。离岛的官秤成了信物，凭秤出货，一诺千金。账房年终结算，关税收入翻了倍。老港监抚着秤杆道：「这杆秤立住了，比十艘炮船都管用。」"
 
 SAN_naval_aviation_training_action:"海军航空兵强化训练"
 SAN_naval_aviation_training_action_desc:"清籁的狂风里，初生的翅膀学飞。实验飞行队驻岛练艺：短甲板上起落，借云藏身，逆风收放。头一个月摔坏了两架旧机，教官把残件钉在棚口，说：「记住它们，往后每落稳一次，都欠它们一笔。」学员们夜里加练，白天互相掐着表数秒。三个月后，全队皆能在颠簸的甲板上落定。老水兵仰头看那掠桅而过的小小机影，喃喃道：「海的规矩要改了，往后天上也有路。」"
 
 SAN_island_logistics_hub_plan:"离岛后勤中枢计划"
 SAN_island_logistics_hub_plan_desc:"诸岛一局棋，补给中转有其枢，朝发夕可至。各岛之间设大型补给站，站址选在传送地脉的节点上，快船昼夜往返。原先前线催饷，文书走三日，如今物资自中枢出，一日可达。头一回全链演试，晨间自海祇装船，午至清籁换驳，暮抵鹤观卸栈，账面上一枚钉子未少。管站的老书吏拨完算盘，长出一口气道：「从前追物资，是追贼；如今物资自己走，倒像赴约。」"
 
 SAN_regional_administrative_offices:"区域行政署设立"
 SAN_regional_administrative_offices_desc:"新土之治，署在民边。区域行政署设于要镇，直隶珊瑚宫：断狱、税册、学籍，三样归署，村落旧俗不废，与署并行。署里的文官皆是考选而来，上任先立约：三年一考，考的是讼平不平、粮实不实、塾满不满。原先的村落自治，好人办不了事，恶人办坏事；如今文书有根，冤情有门。有老农到署里补了一张田契，出来时说：「这张纸揣着，夜里睡得着了。」政令下到土里，才算种活了。"
 
 SAN_pan_island_defense_pact_action:"全岛防御公约行动"
 SAN_pan_island_defense_pact_action_desc:"一岛受难，诸岛同赴，这一纸公约比铁网难破。签署那日，各岛长者按指印于册，指印的颜色深浅不一，郑重却相同。条文简得像渔家话：邻岛烽起，船即离港；邻岛缺粮，仓即开门；邻岛阵亡者，诸岛皆挂白。原来人心散时，铁丝网也拦不住；人心拢了，一纸薄纸便是城墙。公约原件供在议堂，旁边没有护卫，只有一盏长明灯。有孩童问守灯的老人这是什么，老人道：「这是各家互相许的愿。」"
 
 SAN_tsurumi_resource_processing_hub:"鹤观资源深加工中心"
 SAN_tsurumi_resource_processing_hub_desc:"原矿出口是笨买卖，鹤观要自己开炉。选矿与精炼之坊建于岛内，依当地的能量之性炼高纯度的合金：矿就地选，料就地炼，成锭再下海。产业链一延伸，货的身价翻了倍，外邦的订单跟着涨价也买不到优先。岛上第一次有了自己的匠籍册，第一批学徒是当年的采珠人家的孩子。"
 
 SAN_ritual_stone_energy_research:"仪式石能量研究"
 SAN_ritual_stone_energy_research_desc:"鹤观的祭石，不止记着神事。学者依物理之法重组古石：石上旧刻的纹路竟与新法相合，重组之后，蓄电之能数倍于旧。头一块成形的石电，点亮了整座工棚的灯，半月未暗。若此法成熟，军中的远程机动、夜行照明，皆有了着落。老石匠摸着那块石头说：「祖上传下来的石头，原是求雨的，如今管灯，也算殊途同归。」图纸封存入档，档上标注：鹤观来物，慎用，善待。"
 
 SAN_seirai_storm_prediction_center:"清籁风暴预测中心"
 SAN_seirai_storm_prediction_center_desc:"清籁岛中央立起一座气象之塔，塔顶的风杯日夜转着。观天者分班值守，大气里的电荷一有异动，便记入册、放信号。自塔成之后，海上三回风暴，船队皆提前半日收港，一次也没折损。水师的老船工说：「从前出海赌天，如今出海看塔。塔上的灯一变，桨就变。」风暴从此成了战术，成了掩护，成了自家的兵。"
 
 SAN_ako_pirate_fleet_integration:"百目鬼余部整合行动"
 SAN_ako_pirate_fleet_integration_desc:"海寇亦知归，一纸招安定风波，猛士入行伍。百目鬼旧部散在诸岛，素以剽悍称。心海下招安之令：凡愿宣誓效忠海祇者，即编入海军正册，赏罚与正规军一体。诸寇首聚而议之，半日乃定，一时刀船齐至，列于宫前听点。五郎视此新军，道：「他们是烈犬，须有人拿着链子。」心海道：「链子不在手上，在账上。」"
 
 SAN_koseki_village_fishing_standardization:"越石村渔业标准化"
 SAN_koseki_village_fishing_standardization_desc:"渔汛有定时，网眼粮仓皆有谱，海不欺勤人。越石村的捕捞加工立了新规：网眼几寸、起网几时、冰窖几度，皆写在一块木牌上，挂渡口。起初老渔户嫌拘束，说打鱼是凭手感的事；一季后，村仓满了，价也稳了，嫌的人不言语了。冷藏之器添置后，鲜鱼远卖至离岛，利润翻了一倍。村长把木牌擦得锃亮，逢人便指给孩子看：「凭手感吃饭的日子过去了，凭规矩吃饭，饿不着。」"
 
 SAN_amakumo_peak_scientific_base:"天云峰科研基地建设"
 SAN_amakumo_peak_scientific_base_desc:"高台近雷声，学者携书避世来，灯窗夜夜明。天云峠高处建起一座学馆，天时虽恶，胜在清静，雷声之外再无杂音。全稻妻的聪明人陆续来了，各携一箱书。夜里诸窗灯火不齐，争论之声倒齐。有学者道：「千年解不开的难题，未必难在题上，难在无人对坐争吵。」心海批曰：「准其吵。」"
 
 SAN_storm_shield_technology_plan:"风暴护盾技术计划"
 SAN_storm_shield_technology_plan_desc:"雷鸟曾以一身的电光罩住整座鹤观，这件事给了工匠一个念头：电场若能蓄，护盾便能立。研究的法子是以元素场为骨，蓄雷为衣，罩住一小队人马。头一回试放，罩住了半顶帐幕，外头的沙袋被轰得冒烟，里头的灯火纹丝未晃。距离实用还远，图纸却一日一日厚了。老工匠说：「这道看不见的墙，迟早立起来，墙里头，是活人。」"
 
 SAN_outer_islands_customs_union:"外岛关税同盟安排"
 SAN_outer_islands_customs_union_desc:"外岛诸港，一本账册。关税同盟既立，先撤的是岛与岛之间的关卡：货过界不二次纳税，船靠岸一次结清。原先一担货三道税，商贩宁贩贱货；如今好货敢走远路，市面顿宽。外岛特产一一入册：清籁的雷晶、鹤观的矿材、海祇的珍珠，价同秤平。岁末对账，三岛皆有盈余，账房却把最得意的一笔记在人情簿上：头一年冬，无一处岛民因缺粮闭户。小邦合拢来，便是海上的大户。"
 
 SAN_watatsumi_maritime_supremacy_plan:"海祇海洋霸权计划"
 SAN_watatsumi_maritime_supremacy_plan_desc:"南部海域的绝对之位，以舰与塞定：舰队的操演排满月历，要塞的炮位列满海图。要让所有邻邦看明白一件事：这片海的主人换了。海祇大御神的旗，从此是这片蔚蓝唯一的正统符号。通告发至各邦那日，附了一份航路图，图上新画的界线，笔锋极重。"
 
 SAN_outer_expeditionary_corps_setup:"外海远征军团组建"
 SAN_outer_expeditionary_corps_setup_desc:"此军出，不为守，为的是把话带到远处。外海远征军团成军：远征军士、雷暴骑兵、百目鬼余部，三色旗同营。装备择精良者与之，操练较常军加倍。有军官问，守土之兵尚嫌薄，何以分兵于外。统帅答：「屋里的火要旺，须有一根柴伸到灶外去。」自此此军常备待发，船在港，帆不落。提瓦特何处的火种难燃，他们的船便往何处去。矛既在手，路便在海的那一头。"

 # ========================== 第四阶段：白夜遗产 (111-140) ==========================
 SAN_enkanomiya_exploration_project:"渊下宫大探险计划"
 SAN_enkanomiya_exploration_project_desc:"渊下别有天，崩塌遗迹藏前史，探秘步步营。通往渊下宫的封印既开，先遣队持灯而入，凡断桥、陷阶、坍柱，皆一一记下。深处的藏书楼积尘盈寸，翻开的瞬间，灰尘在光柱里飞。领队的人在册上写：「此处的书，比活人的岁数都老。」渊底的旧史，自此有了重见天日的机会。"
 
 SAN_search_for_before_sun_and_moon_action:"寻找《日月前事》行动"
 SAN_search_for_before_sun_and_moon_action_desc:"禁书藏于渊底，取之须入常夜。《日月前事》原藏在渊下宫图书馆最深处，取书之议定后，选了一支懂古文、识星图的队伍下渊。行前众人净手，向大御神拜了三拜。书请出来那夜，常夜的灯忽然齐亮了一瞬，守灯的巫女说是错觉，又说不是。为着海祇民的来历与名分，这一趟风险，值得担。云层之上的窥视固然可怕，可来历不明，才是真正的无根。"
 
 SAN_dainichi_mikoshi_reactivation_plan:"重启大日御舆计划"
 SAN_dainichi_mikoshi_reactivation_plan_desc:"古日沉常夜，龙蜥啃断旧节点，万人补天工。大日御舆的传导节点，为龙蜥啃蚀多处，一时渊中愈暗。工匠们下渊修补，白日上工，夜里歇在龙骨旁。修复完工那夜，御舆重燃，常夜忽亮如黄昏。有老工看着那团光，半日不语，末了道：「白夜国的人，到底还是把它点着了。」"
 
 SAN_jizhashi_training_reforms:"地走官训练改革"
 SAN_jizhashi_training_reforms_desc:"旧律一夜伤不得，新法添了章法。地走官的选拔重开，候选者蒙眼入洞，一夜之内不许伤，不许出声，天明自出口归队者录。首试三十人，归者九人，个个衣衫完好。在暗处练就的步法，倒比明处更稳。新律又添拳脚搏击之技，古法与新技相合，进退有了尺寸。结业那日，九人列队，皆不点灯。观礼的将官立于暗处半晌，竟不知他们几时已换了两轮岗。暗中之眼，自此有了传人。"
 
 SAN_vishap_containment_measures:"龙蜥遏制战术安排"
 SAN_vishap_containment_measures_desc:"深海的龙嗣是远古的邻人，也是最老的威胁。龙蜥研究所修复之后，其生物之弱点一一验明：气味之引、频率之扰、化学之忌，皆成了手段。禁区之界重划，界碑上刻的不是恐吓，是研究人员的名讳。更有大胆的设想：以筛选之法，驯其可为役者。深海之下的事，从此有了册、有了界、有了章法。"
 
 SAN_evernight_temple_archeology:"常夜灵庙考古行动"
 SAN_evernight_temple_archeology_desc:"幽冥藏妙理，灵庙深处测毫厘，古阵待重明。常夜之中，灵庙的每一寸石壁皆以细尺量过，古阵的刻痕逐笔摹下。破解之功缓，学者们却不急，说这些阵法沉睡千年，不差这一时。有一晚，摹本上的两道刻痕忽然对上了，满室的人围拢来看，谁也没敢出声。空间传送的门，露了一条缝。"
 
 SAN_serpents_heart_ritual_study:"蛇心之地仪式研究"
 SAN_serpents_heart_ritual_study_desc:"蛇心之地，空间交叠的奇点。炼金术士与术数之士组队监测祭坛的震频，记了整整一季的册。震动有律，律中有门：跨维度的能量可循律引入，亦可循律收束。若成，便是一道常规火力打不透的防线。试验那夜，半空忽现一层水样的膜，火矢射之，尽没于膜内。众人半晌无言，末了有人小声道：「原来天地之间，还藏着这样一页书。」"
 
 SAN_abyss_technology_integration:"深渊科技系统性整合"
 SAN_abyss_technology_integration_desc:"古法配新炉，白夜遗篇今再读，器成天下惊。白夜国的远古图谱与踏鞴砂的炉火，原是两路学问，一时凑在一处，竟相得益彰。工匠依图谱改制能源与机括，数年之间，产出已胜过大陆诸国。有老匠抚着新器叹道：「白夜国亡了千年，手艺倒比人活得长。」众人皆默然，只将图纸又描了一遍。"
 
 SAN_enkanomiya_industrial_complex:"渊下宫工业联合体"
 SAN_enkanomiya_industrial_complex_desc:"在巨大的地底空间内，建立起完全封闭的自动化工厂链。由于不受地表气候与战火影响，这里将成为国家最安全的战略生产基地。每一台下线的机械都将集成了高能核心，代表着反抗军武装力量的最高技术巅峰。"
 
 SAN_ancient_vessel_restoration:"古代潜航舰修复"
 SAN_ancient_vessel_restoration_desc:"残骸卧渊底，旧器新翻成铁鲸，无声渡重关。渊底的古潜航舰残骸，先后捞起三具。工匠们拆其机括，仿其形制，数年乃成自家第一批深潜之舰。试航那夜，舰自渊底穿过幕府水道，守军一无所觉。归来时舰身犹带寒气，心海立于埠头看了半日，道：「好，就要这种静。」"
 
 SAN_chronos_worship_integration:"时间之执政信仰整合"
 SAN_chronos_worship_integration_desc:"时刻统千风，故神名讳重入世，人心有归处。常世大神卡伊洛斯，掌时刻与千风，其名久为尘埃所封。巫女们重拾旧仪，将这段信仰讲与岛民听。一时村中老少皆去听讲，倒不为敬神，为求个心里安稳。有老妇拜罢道：「日子有准头，人便不怕了。」心海闻之，记于册，道：「信这个的深处，原是信人自己。」"
 
 SAN_forbidden_history_dissemination:"禁忌历史扩散行动"
 SAN_forbidden_history_dissemination_desc:"小册出深宫，茶肆村塾皆有声，疑种自心生。渊底发现的旧史，印成小册，分赠诸岛的书肆与村塾。册子不长，半个时辰读完，读完的人多半不肯立刻走。有人在渡船上读，海风掀页，邻座的陌生人凑过来同看。官府不禁，心海道：「怀疑的种子，原在人心里，不过替它浇点水。」"
 
 SAN_byakuya_military_standardization:"白夜军事标准化"
 SAN_byakuya_military_standardization_desc:"古制入新籍，地走官阶重排定，符文铸刀兵。渊下宫的古军制与今时动员之体，原是两样规矩，一时并作一册。军衔依「地走官」旧等重排，升迁考绩皆有定程；兵器则依古籍符文统一样式，全军划一。有军官领新械在手，掂了掂道：「从前的刀各是各的脾气，如今一个模子。」主者道：「模子一了，纪律便有了根。」"
 
 SAN_hydro_elemental_weaponry_plan:"水元素高能武器计划"
 SAN_hydro_elemental_weaponry_plan_desc:"血枝蕴奇理，珊瑚化怒作奔雷，激流断铁甲。大蛇血枝珊瑚遇水则张、受压则崩的旧理，被工匠翻了出来，制成高压水炮。试射那日，一道水线激出，百步外的旧船板应声洞穿，断口齐整如切。围观的水师军官半日无言，末了有人摸着断口道：「这一炮不是火，是海自己在发怒。」图纸连夜誊清，炮位先布在滩头，正对幕府巡船惯走的航线。海祇的水，从此有了牙。"
 
 SAN_abyssal_intelligence_gathering:"深渊情报收集安排"
 SAN_abyssal_intelligence_gathering_desc:"渊底有隙缝，风声异物皆入册，先知先觉人。心海设深渊侦察连，遣精干之人下渊底最深处，凡缝隙中风声、水色、异动，皆记于册。册呈上来，她逐页看过，忽指一行道：「这一处，比上月又宽了三指。」左右悚然。原来天下变局，先从这些无声处露头，能先看见的，便先有三分胜算。"
 
 SAN_dainichi_energy_grid_expansion:"大日御舆能源网扩张"
 SAN_dainichi_energy_grid_expansion_desc:"合金引深光，渊底之明出泉户，地上海上同。以特制的传导合金铺网，先通渊下宫每一处巷陌，再反向输送至海面的诸岛。竣工那日，两地同时点灯，灯火隔着海水相映。有工程师立在缆端，看灯看了半日，道：「从今往后，天黑不天黑，只看人肯不肯点。」燃料的时代，至此便算过了。"
 
 SAN_subterranean_bunker_network:"地底碉堡群网络"
 SAN_subterranean_bunker_network_desc:"渊下宫的路口，岩层里长出了獠牙。火力点依天然岩壁修筑，嵌着龙蜥防御的旧科技：地表落下来的任何打击，到了这一层都要先问过岩石。碉堡的射口朝外，灯口朝内，守卒三班轮值。有人问，这里是最后的避难所么。守卒答：「是避难所，也是出发的地方。」堡垒在下，希望在上，渊底的火，迟早烧到地表去。"
 
 SAN_enkanomiya_civilian_resettlement:"渊下宫平民迁入安排"
 SAN_enkanomiya_civilian_resettlement_desc:"故土在渊下，狭间之街重起屋，白夜有人烟。狭间之街的旧屋，修的修，建的建，自来水道先通，学塾随后。迁来的渔家起初怕黑，夜里不敢出门，半月后便在巷口点起灯笼织网。有老人摸着新居的墙道：「祖上住过的街，脚底下的石头都是熟的。」地表的地窄，渊下的天地，倒越住越宽。"
 
 SAN_ancient_archives_decryption_action:"古代档案全面解码"
 SAN_ancient_archives_decryption_action_desc:"尘封启深室，量子古档重重锁，译出即真珠。渊下宫机密室中，封存的古档仍是一页页哑谜。学者们以炼金阵与算学穷举强解，译出一页，便得一方失传的丹方或一张图纸。众皆惜之如珠玉，各自抄录三份，一份入库，一份随身，一份藏于别处。有人道：「白夜国人的心思，原都锁在这些字缝里。」"
 
 SAN_watatsumi_enkanomiya_united_front:"海祇-渊下宫统一战线"
 SAN_watatsumi_enkanomiya_united_front_desc:"地表与地底，本是一家。政治、军事、文教三样，渊下宫与海祇诸岛全面归一：户籍互认，军籍互通，学籍互转。让所有的岛民明白：这是一家有底细、有传承、有手艺的大家。跨维度的认同既立，国家的意志便牢不可破。地底的灯与地面的火，照的是同一片海。"
 
 SAN_abyssal_resource_monopoly_plan:"深渊资源垄断计划"
 SAN_abyssal_resource_monopoly_plan_desc:"奇珍出渊底，地表无处可寻来，握之即筹码。渊下宫出产的几样稀有材料，地表诸国遍寻不得。心海遂立专营之规，凡出渊者必由官册登记，外邦欲购，须以器物技术来换。一时各国使者候于离岛，珠价未开，先问矿价。有商人叹道：「从前是人卖珠，如今是珠挑人买。」"
 
 SAN_experimental_underwater_armor_action:"实验性深海装甲行动"
 SAN_experimental_underwater_armor_action_desc:"深水试新甲，黑暗高压皆平地，猎手出自海。以渊底所得的耐压之材制外骨骼甲，先行于浅海，再下深渊。着甲的士兵在水下行走如常，黑暗里凭声辨位。试毕出水，卸甲的手抖了半日，人却笑道：「海底原来这么静。」海军陆战队自此有了新装，海底的路，算是踩开了。"
 
 SAN_white_night_doctrine_development:"白夜作战教义开发"
 SAN_white_night_doctrine_development_desc:"地底的空间窄，暗与明的界线模糊，正是新战法的用武之地。「白夜作战法」应运而生：照明与黑暗的交替之用，窄口的控制之要，远程火力的精准之节，条条落在纸面，招招练在洞里。陆军转成一支极有弹性的力量，多恶劣的战场都接得住。操典的末页印着一行字：白夜交替之处，即是我军之门。"
 
 SAN_enkanomiya_high_command_setup:"渊下宫最高指挥部"
 SAN_enkanomiya_high_command_setup_desc:"地底设中枢，防御科研与工造，一并归渊署。渊下疆土日广，遂立渊下指挥部，防务、科研、工造，各自成司，又与地表的帅署声气相通。两地文书往来，晨发午至。有参谋笑言：「从前一个岛管一岛，如今一口井管一井。」指挥架构五位一体，渊、陆、海、空、潜，各有其序。"
 
 SAN_ancient_tactics_integration:"古代战术系统性整合"
 SAN_ancient_tactics_integration_desc:"古阵今重构，龙蜥旧法教小队，杀气自重生。白夜国先民对付龙蜥的结阵之法，原是散落在古籍里的残篇。参谋们依元素共鸣的数理重新推演，定作小组作战的成法，一班十二人，各司其位。演武那日，重甲当道，小队绕行如水，须臾便将其掀翻。老教头叹道：「远吕羽氏年代的手笔，竟一点不旧。」"
 
 SAN_enkanomiya_reserve_training_plan:"渊下宫预备役训练计划"
 SAN_enkanomiya_reserve_training_plan_desc:"移民皆习武，巷战渊操成常课，危时即成军。渊中移民一律受基础军训，农时做工，闲时列操，地形复杂的巷陌正好作演武之场。妇人能运伤者，少年能传号令。演习那日，警钟一响，满巷人各归其位，半个时辰便齐。教官点完名，说了一句：「这才像白夜国的子孙。」"
 
 SAN_subterranean_supply_overhaul:"地底物资周转大整顿"
 SAN_subterranean_supply_overhaul_desc:"海床与地底之间，立起垂直的重载升降之梯。大型升降机凿岩而建，一次能运十车料，地表与渊下宫之间的物资周转，自旬日缩至一日。原先走盘山栈道，一车料要换六次肩；如今绞盘一响，直上直下。外部打击落下时，这一条循环的脉照样在动。管升降的老匠说：「地上的门会被炮堵住，地下的脉堵不住。」"
 
 SAN_abyssal_cultural_restoration_plan:"深渊文化复兴计划"
 SAN_abyssal_cultural_restoration_plan_desc:"旧俗重开时，衣冠节祭各归位，先祖有光辉。白夜国的服饰、节祭与旧艺，原散落在各家箱底，一时由巫女们逐村访求，一一录册。重开祭典那日，老人穿上旧衣，对着海站了半日。有后生问何必如此，老人道：「人知道自家从何处来，腰杆便自己直了。」此后外岛来使，见小小渔村亦有此等气象，无不吃惊。"
 
 SAN_unification_of_the_two_realms:"两界意志大统一"
 SAN_unification_of_the_two_realms_desc:"在珊瑚宫的旗帜下，地表的珍珠与地底的白夜正式融为一体。现人神巫女大人宣布国家进入新的纪元。这种从行政到灵魂的全方位统一，标志着海祇岛已完成了从一个地区反抗势力到一个拥有独特文明根基的独立强国的华丽转身。两界一心，共铸未来。"
 
 SAN_final_archeological_synthesis:"最终考古学大综述"
 SAN_final_archeological_synthesis_desc:"万卷归一库，渊底千年皆有序，史脉自成书。渊下宫的诸般发现，分门别类，终成一部总纲。心海又倡建白夜大学，凡译出的学问，皆入讲堂。落成那日，老学者们扶杖来看新楼，指着梁柱说：「从前这些字，是偷着读的。」如今灯火通明，历史不再是被封存的证物，成了向上的阶梯。"

 # ========================== 第五阶段：战后构想 (141-180) ==========================
 SAN_post_war_future_debate:"战后未来大辩论"
 SAN_post_war_future_debate_desc:"幕府成旧梦，新稻妻往何处去，三路人马各执一词。心海开讲于珊瑚宫前，不设座次，渔夫与学者同席。神权一派说，乱后须有主心骨；共和一派说，主心骨一立，愿望又要进匣子；革命一派说，天上那位不倒，地上争来争去都是借来的屋。争了半月，未分胜负，倒是吵出了几条共识：先修学塾，先清冤狱，先许人说话。散场那晚有人问心海倾向哪边，她道：「舵盘在大家手里，我只管看水。」"

 # --- 路线A：现人神绝对权威 (威权) ---
 SAN_divine_authority_consolidation:"强化现人神绝对权威"
 SAN_divine_authority_consolidation_desc:"海祇大御神，荣光永驻信徒心，神谕定乾坤。战后欲求速定，朝议奉心海为唯一之主，神权即政权。诏下之日，钟鼓齐鸣，万民伏拜。她受了礼，回宫却将诏书的副本压在灯下，看了半日。侍女问何故，她道：「人把神抬得太高，神便不敢生病，不敢老，不敢错。」烛花爆了一声，她添了灯油。"
 
 SAN_enforced_orobashi_orthodoxy:"强制大蛇正统信仰"
 SAN_enforced_orobashi_orthodoxy_desc:"一尊大蛇神，社坛重立旧香火，异祠渐无声。大蛇远吕羽氏尊定为唯一正统，曚云神社一一重修，巫女重录古祝。鸣神旧祠的香案撤去，古卷收归官库。有村人夜里偷偷拜旧神，巫女知道了，也不声张，只把官库的古卷借他一册。心海闻之，道：「信是拴不住的，只可引。」"
 
 SAN_clerical_administrative_overhaul:"神职行政体系重组"
 SAN_clerical_administrative_overhaul_desc:"衙署即道场，官阶神品一体看，令下如钟鸣。心海将行政的等第与神职的等第并成一册，凡入衙门者，须先过神学的考核。一时告示贴出，求试者众，落第者亦众。有人不服，问凭何考校。主考的巫女答：「在神前说不了谎，在百姓前更说不了。」自此官吏们笔下慎了三分，政令反倒清爽了。"
 
 SAN_monolith_industrial_prioritization:"单一工业重点化战略"
 SAN_monolith_industrial_prioritization_desc:"国之资财，倾于一炉。核心军工一体专办：国营大工坊归并精干，商贾之竞争者皆歇，铁、炭、匠，三样皆聚于踏鞴砂一线。有人忧此策太险，把鸡蛋全放进了山腹里。主管的答得直白：「战时造船钉都嫌慢，顾不得分篮子。」自此产能陡增，火炮月出一批，弹药船一船接一船。工坊的墙上挂了一幅字，是心海手书：聚则有力。落笔极稳，墨色极深。"
 
 SAN_theocratic_military_indoctrination:"神权军事洗脑行动"
 SAN_theocratic_military_indoctrination_desc:"为着领袖，也为着信仰，士卒已把性命搁在旗后面。军中的忠诚之课日日不歇：晨诵祝词，夜读战史，腕上缠着写有家训的布条。冲锋的号一响，队形竟不散，前排倒下，后排补位，脚下踩的是同袍的血，眼里的光却不减。外邦的武官观操后写道：此军的狂热，刀不能解。神权的火种烧到这一步，已是烈火烹油。"
 
 SAN_purging_the_unbelievers_action:"清除不信者行动"
 SAN_purging_the_unbelievers_action_desc:"灯火之下，亦有背身之人。不愿向珊瑚宫宣誓的，册上有名，行动有据，密卫按册行事：轻者夺其职，重者迁其居，通敌者另议。行此策那夜，执法官问心海，宽严的界线在哪里。她道：「不拜是他的事，卖岛是另一回事，两本册子分开记。」自此岛内有暗流者敛迹，告密的诬状却也开始多起来，官府又立了一册：诬告同罪。纯洁这两个字太重，压秤的时候，得格外小心。"
 
 SAN_divine_economic_planning_strategy:"神圣经济计划战略"
 SAN_divine_economic_planning_strategy_desc:"一纸五年计，米盐铁木皆有主，神笔批春秋。五年计划由心海亲笔核准，米粮几石、铁料几吨、布匹几匹，皆入总册。市场之事一时收束，配给有度，无囤积，亦无匮乏。粮官呈上账目，她逐项勾画，忽停在一处道：「这一乡的盐，分得太薄，改了。」账上无一句闲话，笔笔都是治生。"
 
 SAN_prophets_of_the_deep_network:"深渊先知情报网"
 SAN_prophets_of_the_deep_network_desc:"深渊先知网，巫女夜里听龙语，棋先三步落。能与远吕羽氏遗恨相通的巫女，尽数入了情报之局：白夜观星，渊底听脉，占得之语与商船的见闻、敌港的粮价并案而析。说来玄，验起来却灵：三回预判敌动，两回皆中。局长把功劳分作两半记，一半记科学，一半记神谕。心海批注：验了的才叫情报，没验的叫故事。先知在暗处听，庙堂在明处算，胜负便在那一明一暗之间。"
 
 SAN_supreme_edict_drafting:"最高诏令草拟计划"
 SAN_supreme_edict_drafting_desc:"这是定所有岛民命数的至高之文。基本法草定：现人神之权永久化、明文化，土地、资财、生死之权，皆归神座。条文一字一字过秤，誊写用最重的礼纸。有起草的文官夜里搁笔，对烛自语：「这一笔落下去，千年都擦不掉了。」法成之日，权在法上，序在权上。带血的基石，从此垫在海祇的每一道政令底下。"
 
 SAN_holy_expansionist_doctrine:"神圣扩张主义教义"
 SAN_holy_expansionist_doctrine_desc:"海阔岂有界，珠光所照皆子民，教义出深宫。国中颁下新教义：凡蓝色之水，皆当归大御神子民耕渔。教义写成那日，草案在议堂里过了三遍，反对的人也不少，末了却都画了押，原来条文里添了一句：所至之地，先授耕渔之法，后议归附。舰队遂向更远的群岛去，船上载的不只是刀，还有稻种与渔网。老舵工望着海平线道：「海从不开口，可海边的烟囱多了，海就算换了姓。」"
 
 SAN_watatsumi_eternal_dominance_plan:"海祇永恒主宰计划"
 SAN_watatsumi_eternal_dominance_plan_desc:"海祇之权，当及于诸岛与暗之外海。每一处要冲，立神像，筑要塞：神像的面朝着海，要塞的炮口也朝着海，治权就这样落成人人日日可见的实景。「海祇岛」这三个字，要成为东方海域唯一的名号。主宰一切，绝不动摇。"
 
 SAN_divine_monarchy_manifesto:"神圣君主制宣言"
 SAN_divine_monarchy_manifesto_desc:"帝国新开基，礼冠重整旧仪卫，白日不落海。海祇神圣帝国立国宣言颁下，恢复古仪与贵族的等第，朝服按品色分列，钟磬皆有定音。大典那日，新贵们衣冠齐整，进退有度。有老臣看着阶下的仪卫，低声道：「这样齐整，像一座塔。」旁人问塔如何，他道：「塔稳，只是风一吹，塔尖先凉。」"
 
 SAN_ultimate_theocracy_implementation:"终极神权体制实施"

 # --- 路线B：海祇民主议会 (民主) ---
 SAN_democratic_council_strategy:"海祇民主议会战略"
 SAN_democratic_council_strategy_desc:"权柄还诸岛，巫女退居作元首，议席代万声。威权复辟之忧，心海比谁都早想到。遂立诸岛联合议会，政令出自议席，她自请退居宗教元首，世俗之权大半交出。交印那日，老宫司捧着印匣的手抖了抖，道：「大人真的不后悔。」心海笑道：「印在谁手里，都得有人看着。」一时诸岛称善，疑虑者亦渐渐服了。"
 
 SAN_multi_island_parliament_setup:"多岛联合议会筹建"
 SAN_multi_island_parliament_setup_desc:"从海祇到鸣神，从清籁到离岛，一票一票，皆是自己的声音。筹建之议起于废墟之上：宪章草案誊作数份，逐岛征求意见，渔妇的、船工的、塾师的，一条一条记。有武官急了，问何日能定，主持的先生道：「章程是给子孙用的，急不得。」内部争端自此有了去处：动笔，不动刀。草案定稿那夜，抄写的人手都酸了，灯油添了三回。民主的火种虽小，落进人间，便有了燎原的样子。"
 
 SAN_yashiro_commission_advisory_role:"社奉行顾问咨询权"
 SAN_yashiro_commission_advisory_role_desc:"尊重传统，是共和的真味。社奉行神里家受邀任议会终身的文华顾问：派系之争由其调停，旧俗遗产由其护持。老权力与新秩序共处一室，头三个月磕磕绊绊，第四个月，第一桩调停成了。社会之动荡就此少了大半，过渡之路走得平稳了许多。绫人在顾问的就任礼上只说了一句：「稻妻的旧，也是稻妻的根。」"
 
 SAN_ritou_merchant_trade_pact:"离岛商会贸易协定"
 SAN_ritou_merchant_trade_pact_desc:"离岛的商路开了，天下的货自此过海祇的眼。与万国商会及本地商帮立约：关税大减，唯军械买卖与掠卖人口两项不松手。异国的商号货栈接踵而至，码头昼夜卸货，号子声连成一片。本地商贩先学记账，再学议价，一两年间，竟出了几个像样的商号。有人问，让外人赚了钱，图什么。主事的道：「钱是水，渠是自家的，水过渠一次，渠就深一寸。」离岛重兴，商埠之枢渐成。"
 
 SAN_freedom_of_worship_proclamation:"信仰自由大宣言"
 SAN_freedom_of_worship_proclamation_desc:"一纸解千结，千年隔阂付潮声，各拜各的神。信仰自由的宣言张于诸岛码头，识字的高声念给不识字的听。念到「信仰是个人的慰藉」一句，人群里有巫女有僧人，都没作声，各自低头想了想。散后有人问心海，两尊神如何共处，她道：「海那么大，容得下两条鱼。」"
 
 SAN_liberal_economic_reforms_plan:"自由派经济改革计划"
 SAN_liberal_economic_reforms_plan_desc:"官厂的铁锁开了，私坊的炉火便旺了。战时国营工坊拆分，听凭民间自开自办，官家只立两样：护着自家的图纸，养着作坊里伤了的工人。头一年，离岛的小工坊冒出六十余家，你造船钉，我造渔轮，价贱物好。有老掌柜在门口挂匾：拙匠不欺。同业公议价，不许贱买同行的手艺。老账房抚册而笑：「从前靠令行事，如今靠市说话，市比令公道。」市井一活，百业自春。"
 
 SAN_council_of_elders_integration:"长老议会整合安排"
 SAN_council_of_elders_integration_desc:"村头白发坐，长老入席共商量，政令遂通行。望泷村诸村的长老会，原只管村中红白与水利。心海邀其入地方咨议之席，凡涉本村的政令，须先问过他们。一时老人们拄杖赴会，说话慢，却句句落在实处。有官佐嫌其迟缓，心海道：「慢些好，他们点头了，村里便没人摇头。」"
 
 SAN_citizens_militia_organization:"公民民兵组织建设"
 SAN_citizens_militia_organization_desc:"卸锄即执枪，老兵领操童子习，村村是壁垒。志愿的国民警卫，由退伍老兵带着本村后生操练，一旬一会，风雨不误。兵器存于各家，籍册存于村公所。有人问何苦如此认真，教官道：「外敌来时，不会替你挑日子。」一时各村晒谷场上，口令声此起彼伏，连孩童也会拿棍比划两下。自由之邦，原是这般光景。"
 
 SAN_social_welfare_expansion_action:"社会福利扩张行动"
 SAN_social_welfare_expansion_action_desc:"国的盈余，先落在弱者身上。全民医疗与义务教育并举：各岛设诊所，药按册配；学塾免塾费，书由官印。战后头一年，疫病少了一半，识字的人多了一倍。老人们起初不信白给的事，抱着孩子来看诊所的招牌，看了三回才敢进门。心海说：「岛民的眼睛亮了，岛才真的亮了。」这一代新国民，会在学塾里争辩，会在市上问为什么，他们便是稻妻往后的骨头。"
 
 SAN_pan_teyvat_diplomatic_outreach:"全提瓦特外交拓展"
 SAN_pan_teyvat_diplomatic_outreach_desc:"锁国的门开了，先递出去的是茶，不是刀。海祇遣使往蒙德、往璃月，拜西风骑士团与七星：不订攻守，先订商路与学籍。留学生去了蒙德的学院，琴谱与矿学书成箱运回。外邦初时观望，见海祇的船不载兵只载货，便也松了口风。使团归国那日，码头人群里有人问使节：见着外国是什么样子。使节想了想，道：「月亮是同一个，可人家的灯，比咱们多。」门既然开了，风就进来了。"
 
 SAN_constitution_of_sangonomiya_drafting:"珊瑚宫宪法草拟行动"
 SAN_constitution_of_sangonomiya_drafting_desc:"一纸定疆界，权柄亦有归束处，白纸不欺人。宪章草拟之议开于珊瑚宫，心海亲自督其事。条文逐条相争，议领袖之权有限，议百姓之权有名，议司法独立不倚。有起草者欲将巫女之权写宽些，心海提笔改了，道：「写窄些，后人好用。」一时灯下笔声不歇，纸上的字句，比任何刀兵都长久。"
 
 SAN_democratic_industrial_modernization:"民主工业现代化"
 SAN_democratic_industrial_modernization_desc:"众岛共一炉，巧艺相传无保留，厂声连海潮。诸岛立科研之盟，渊底与地表的图籍器物，互通有无。精密的机括业一时大兴，枫丹来的商人摸着海祇产的钟表机芯，半日不放，道：「这手艺，搁在枫丹也是上等。」账房答：「各岛合力的东西，自然好些。」工业的跃进，原是众人合抬起来的。"
 
 SAN_joint_island_defense_reforms:"诸岛联合防御改革"
 SAN_joint_island_defense_reforms_desc:"一岛烽起，诸岛自应，号令不出一门而遍行诸海。跨岛民防之网既立，各岛公民武装悉入军籍，平日渔耕，闻号则聚。演练那日，清籁午时举烽，未至申时，海祇的快船已泊在鹤观码头接人。指挥之权不集于一人，各岛自守，邻岛互援，敌军破一处，余处不乱。老岛主们初时怕失了自家枪械，后来见演习里自家子弟走得齐整，反倒催着再添两条快船。岛岛为垒，人人为盾，这便是和平的本钱。"
 
 SAN_ultimate_republican_vision:"终极共和远景蓝图"
 SAN_ultimate_theocracy_implementation_desc:"碎片拼成了完整的版图。海祇联合共和国，于此日正式宣告诞生。数百万岛民从此同属一个家园：和平、丰足、共治，提瓦特新时代的每一个清晨，都将从此岸开始。升旗那日，海面无风自浪，诸岛的渔火次第亮起，像谁在海面上撒了一把星。自由之海，波澜壮阔。"

 # --- 路线C：白夜远征军 (/革命) ---
 SAN_celestia_defiance_pact:"反抗天理圣约"
 SAN_celestia_defiance_pact_desc:"揭开伪秩序，血荐轩辕战高天，白夜意志坚。《日月前事》既明，天空岛那层伪装，原也遮不住了。心海不再求苟安，聚诸将立约，要组一支敢向神灵叫阵的军。盟书仅一纸，末行写道：「凡人的名分，须凡人自己写。」一时众皆按印，印色深红，久久不褪。有长老问胜算几何，心海道：「问这个，便已经输了。」"
 
 SAN_export_revolutionary_ideals_action:"革命理想输出行动"
 SAN_export_revolutionary_ideals_action_desc:"火种不独燃，一海之光分万盏，天下有回声。心海遣革命之师分赴诸国，不带刀兵，只带书册与讲席。所到之处，有士人来听，有农人围观。有人问他们怕不怕惹祸，领队的答：「火种搁在自家灶里，终究只是自家亮。」一时各国暗流涌动，反抗的联盟，自这几个讲席上悄悄结起。"
 
 SAN_dark_sea_expeditionary_strategy:"暗之外海远征战略"
 SAN_dark_sea_expeditionary_strategy_desc:"雷暴之外海，大蛇取珠的旧去处，今人再问津。暗之外海素为禁地，雷暴环之，舟不敢近。心海设远征之议，选敢死之士，先遣三船探路。船上供着大御神的珊瑚枝，水手们说：「当年蛇神便是在那里得的珠。」船去无音，三月后方归，带回一身盐霜与半箱奇物。众人围看半日，无人说话。"
 
 SAN_celestial_order_disruption_plan:"天理秩序扰乱计划"
 SAN_celestial_order_disruption_plan_desc:"古器噪地脉，天上之眼一时朦，暗窗自此开。渊下宫出土的古器，原是白夜国人用来扰地脉的旧物。工匠仿制数十具，散布诸岛，同时运转，天理窥探稻妻的那只眼，一时便花了。监视册上疑影重重，正邪难辨。心海看着册子道：「它看不清的时候，便是咱们的时辰。」混乱不是祸，是刀。"
 
 SAN_radical_industrial_collectivization:"激进工业集体化"
 SAN_radical_industrial_collectivization_desc:"一切工厂归公社，一切成果归众人。私产尽废，工坊入社，工匠按技授职，产额按需分派。起先是乱了一段：账不清，料不齐，有人出工不出力。公社立了新章：超额者记红点，红点换学籍与医席，怠工者不作罚，调去最难最苦的一段。半年后，弹药的产出翻了番，食堂的饭菜也稠了。老工匠摸着新机器说：「从前机器是坊主的，如今是大家的，坏了自己心疼。」炉火彻夜，皆为那一战。"
 
 SAN_vanguard_of_the_abyss_recruitment:"深渊先锋兵团招募"
 SAN_vanguard_of_the_abyss_recruitment_desc:"地走官们从渊底上来，火种随之而上。队伍里甚至收了几个异类：对现世不满的、无处容身的、来历说不清的，皆入「白夜突击队」。他们不惧深渊的蚀，不惧神威的压，是纯粹的意志结成的一支矛。出渊那夜，队首的旗是黑的，旗上一个白字：夜。领袖的指引在前，天空的雷霆在上，这支矛，迟早掷向天上去。"
 
 SAN_clandestine_abyssal_alliances:"深渊秘密结盟协议"
 SAN_clandestine_abyssal_alliances_desc:"火中取板栗，敌之敌人暂为友，暗路亦行舟。深渊教团的一支分支，托人递来合作的口信。心海允了临时的默契，只约了两条：互不刺探，互不越界。左右皆忧，说这是引狼入室。她道：「天上那位原也不是善客。狼要过路，看它往哪边咬。」一时密信往来，皆用旧历暗语，纸阅毕即焚。"
 
 SAN_mobilize_the_under_dwellers_strategy:"地底住民总动员战略"
 SAN_mobilize_the_under_dwellers_strategy_desc:"渊底有万民，灯下亦有兵。地底训练营开于渊下宫旧馆，白夜的长明灯下，渔夫、书吏、织妇各依册编队，操练，授械，识字。有人问，地在底下，仗在地上，练他何用。教官指着头顶的岩层道：「岩层压不灭志气，志气一旦上来，比火还烫。」首批成军的营伍出渊那日，地表的守军远远看见一线灯火自渊口盘旋而上，无一人出声，只在道旁肃立。地下有火，天当惧之。"
 
 SAN_total_ideological_war_prep:"全域意识形态战备"
 SAN_total_ideological_war_prep_desc:"这一战不止夺城，还夺魂。思想之战线全面铺开：反抗的哲学印成小册，塾里教，船上讲，渔火堆边也有人念。让每一个国民深信：挑战神灵，是最高尚的命数。此等精神之热，赋国家以近乎自毁的攻性，理性与温吞的阻碍，皆将被这股洪流碾过。铁幕未破，人心先破。"
 
 SAN_sky_throne_reconnaissance_action:"天之御座侦察行动"
 SAN_sky_throne_reconnaissance_action_desc:"云上那座岛，历来只许仰望。白夜国失落的轨道观测之法既出，海祇便试以镜测天：录高层大气的元素流向，算那座悬浮之岛的虚实空隙。观测塔的灯夜夜亮着，册子一页一页厚起来。高处不胜寒，测天的巫女却越站越稳。有人问看得见什么，她答：「看得见它也有影子。」神座之高，至此有了尺寸。"
 
 SAN_final_assault_on_the_divine_arrangements:"神圣安排终极突击"
 SAN_final_assault_on_the_divine_arrangements_desc:"兵陈祭坛前，海空潜渊齐举火，一击破陈规。总攻之期既定，诸军会于渊下宫祭坛之前。火炮锁定了目标，水师的阵形在图上已成，各队的令旗皆换了新色。出征前夜，无人高声，磨刀声与潮声相和。心海巡营一周，只留一句话：「此去不为杀人，为的是把命从天手里拿回来。」"
 
 SAN_liberation_of_all_teyvat_strategic_vision:"全提瓦特解放战略愿景"
 SAN_liberation_of_all_teyvat_strategic_vision_desc:"白夜归有日，故土烟火续旧梦，新篇自兹始。国中的志向，不止于诸岛：凡执政治下之地，皆许其自治自立。这话说出去，外邦多讥其大，海祇的学子却在学塾里认真抄录。原来第一王座时代的旧卷里，凡人原是自立门户的，后来才被神一座一座压下去。心海在学塾落成礼上只说了一句：「先把自家的日子过成例子，别人才信。」新世界远在天边，脚下的路却是一步一步量的。"
