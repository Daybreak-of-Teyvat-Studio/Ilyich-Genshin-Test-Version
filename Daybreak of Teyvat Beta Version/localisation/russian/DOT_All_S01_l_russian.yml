Gunnhildr:0 "Совет Гуннхильдр"
Gunnhildr_desc:0 "В те времена, когда Мондштадт был диким и ледяным, Гуннхильдр была самым сильным вождём среди беженцев. Её отец был подданным Декарабиана. Он не вынес тирании и увёл свой род из города. Но за стенами было нелегко, и беженцы оказались во власти вьюг. Когда надежда угасла, дух ветра услышал молитву Гуннхильдр. Так молитва дочери и стоны народа стали верой, которая дала силу духу ветра. Он дал им убежище и разделил с ними силу защиты. После смерти отца Гуннхильдр стала вождём и первой жрицей, до конца защищая свой народ."

 Zhongli:0 "Моракс"
 Zhongli_desc:0 "§YВладыка, не менявший мир тысячу лет§!\n§gВладыка Камня правил Ли Юэ тысячелетия, и хотя мир менялся, он оставался незыблемым. Свергнуть такого «тысячелетнего правителя» непросто.§!\nИз семи архонтов остались только двое — Ветра и Камня, и только Владыка Камня по-прежнему усердно правит своей страной. После тысячелетий правления древний Владыка осознал, что не может противостоять «эрозии». Ему нужно испытание для Ли Юэ — испытание для Семи Звёзд и бессмертных, чтобы понять, сможет ли Ли Юэ обойтись без него. И это испытание наступает с активизацией Фатуи..."

 Raiden:0 "Сёгун Инадзумы"
 Raiden_desc:0 "После гибели первого Сёгуна, Баль, в погоне за вечностью, Сёгун издала указы об изоляции и охоте на Глаза Бога. Люди, не знавшие о смерти Баль, были удивлены жестокостью и терпимостью к коррупции Комиссий. Но Сёгун, как автомат, цеплялась за свои указы, не обращая внимания на протесты."
 Jean:0 "Джин Гуннхильдр"
 Jean_desc:0 "Из рода Гуннхильдр, одного из трёх великих родов Мондштадта, Джин следует завету «Вечно защищать Мондштадт». После ухода Великого Магистра Фальки в экспедицию она стала исполняющей обязанности капитана, взвалив на себя все заботы. Все уважают её и боятся, что она не выдержит такой нагрузки, но она незаменима. Кризис с Ураганом и давление Фатуи сводят на нет все попытки облегчить ей жизнь..."
 NingGuang:0 "Нин Гуан"
 NingGuang_desc:0 "Ценная, как нефрит, и далёкая, как звёзды. Нин Гуан — одна из Семи Звёзд Ли Юэ, занимающая место Тяньцюань. Она проницательна и красноречива. Даже в торговом Ли Юэ она — выдающийся купец. Все, кто встречал её, поражены её проницательностью и умом. Она известна своей Нефритовой палатой, парящей над гаванью. Нин Гуан — многоликая загадка."
 King_of_the_Millennium:0 "Тысячелетний правитель"
 Ganyu:0 "Гань Юй"
 Ganyu_desc:0 "Пьёт росу, ест злаки. Добра и осторожна, не попадает в сети. Для Семи Звёзд Гань Юй — не просто спутница, а координатор сложной информации и основа эффективности гавани. Горы отчётов и протоколов проходят через её руки. Тысячи лет Семь Звёзд сменяли друг друга, а Гань Юй оставалась, наблюдая за процветанием Ли Юэ. Полу-человек, полу-бессмертная, она любит и яркие огни города, и тишину гор."
 Shenhe:0 "Шэнь Хэ"
 Shenhe_desc:0 "Мирская суета, причины и следствия исчезают. Шэнь Хэ из побочной ветви клана экзорцистов, была взята на воспитание Цинъюнь. Для неё Цинъюнь — мудрый наставник. Шэнь Хэ — особенная ученица. Жизнь с бессмертными далась ей нелегко, но она необычайно талантлива и получила признание. Однако долгое употребление трав и жизнь в горах отдалили её от людей. Её считают беловолосой бессмертной. Характер и красная нить добавляют ей тайны. Её прошлое — как легенда. Как воспримут эту загадочную женщину?"

 Keqing:0 "Кэцин"
 Keqing_desc:0 "Громовая мощь, дух перемен. Юйхэн, одна из Семи Звёзд. Кэцин скептически относится к единоличной власти Владыки — но боги ценят таких людей. Как одна из Семи Звёзд, она — человек действия. Она лично изучила рельеф Ли Юэ, чтобы эффективно использовать землю. Она всегда в курсе дел, в то время как Владыка появляется лишь раз в год. Тысячи лет процветания подтверждали правильность пути Владыки, но Кэцин сомневается. Процветание Ли Юэ подобно замку на песке. От нас не зависит, когда придёт прилив. Владыка защищал Ли Юэ тысячу лет, но будет ли так через тысячу, десять тысяч лет? Этот вопрос движет Кэцин. Для других это излишнее беспокойство, но она не может игнорировать эту угрозу. Это будущее, которое не представляли жители Ли Юэ... Но кто-то должен идти впереди. Кэцин готова взять это на себя."
 
 Yelan:0 "Е Лань"
 Yelan_desc:0 "В бескрайнем мире одинокий странник приходит и уходит."
 
 Ying:0 "Люмин"
 Ying_desc:0 "Путешественница, пришедшая из-за пределов мира, у которой бог отнял родственника, и теперь она ищет Семь Архонтов."
 Traveller_desc:0 "Путешественница, пришедшая из-за пределов мира, у которой бог отнял родственника, и теперь она ищет Семь Архонтов."
 Paimon_desc:0 "Аварийный паёк, резерв, талисман, говорящая фея, летающий питомец, волшебный морепродукт, внешний орган, Паймон, Пушистик, существо с ногами, но без рук."

 Yoimiya:0 "Наганохара Ёимия"

 Ayaka:0 "Камисато Аяка"

 Kokomi:0 "Сангономия Кокоми"

 Eula:0 "Эола Лоуренс"
 Eula_desc:0 "Как капитан партизанского отряда Ордена Рыцарей Запада и известная «Пенная Рыцарь», Эола часто патрулирует и имеет множество заслуг. Рыцари в горах часто становятся мишенью монстров, но Эола быстро приходит на помощь и устраняет угрозы, даже атакуя оплоты Ордена Бездны. Но её происхождение — она последняя из рода Лоуренсов — делает её изгоем. Она порвала с семьёй и вступила в Орден. Из-за предрассудков к ней относятся несправедливо, видя в ней «опасную личность». Годы опыта заставили Эолу воздвигнуть невидимый щит. «Месть» — это лишь внешний аспект этого щита. Только отбросив слухи, можно увидеть её истинную суть."

 Amber:0 "Эмбер"

 Diluc:0 "Дилюк"

 Sara:0 "Кудзё Сара"

 Neko:0 "Нэко"
 Neko_desc:0 "Святилище выглядит лучше, и моя шерсть стала мягче, мяу-мяу."
 Book_ASA:0 "Святилище выглядит лучше, и моя шерсть стала мягче, мяу-мяу."
 Itto:0 "Аратаки Итто"
 Itto_desc:0 "Оникс, герой, полный страсти: в его жилах течёт кровь они, и он был первым главой клана Аратаки в Ханамизаке. Сейчас он скрывается на острове Цуруми из-за преследования Комиссии Тэнрё. Никогда не слышали о клане Аратаки? Вы хотите проблем?"

 Eula_desc:0 "В вихре танца разрубая цепи грешников. Как капитан партизанского отряда Ордена Рыцарей Запада и известная «Пенная Рыцарь», Эола часто патрулирует и имеет множество заслуг. Рыцари в горах часто становятся мишенью монстров, но Эола быстро приходит на помощь и устраняет угрозы, даже атакуя оплоты Ордена Бездны. Но её происхождение — она последняя из рода Лоуренсов — делает её изгоем. Она порвала с семьёй и вступила в Орден. Из-за предрассудков к ней относятся несправедливо, видя в ней «опасную личность». Годы опыта заставили Эолу воздвигнуть невидимый щит. «Месть» — это лишь внешний аспект этого щита. Только отбросив слухи, можно увидеть её истинную суть."

 Amber_desc:0 "Разведчик Эмбер, готова! Этот трофей вручается Эмбер в память о её впечатляющей трёхкратной победе в соревнованиях по полётам. Пусть её энтузиазм никогда не угаснет на ветру. — Исполнительный председатель Ассоциации виноделов Мондштадта, Эзе."

 Diluc_desc:0 "Я буду идти вперёд, пока не наступит рассвет. Господин Дилюк — как прекрасное вино, но слишком много льда. В Мондштадте любят вино. После тяжёлого дня лучшая награда — бокал вина. Но когда вино попадает в горло, появляются тысячи причин выпить ещё. Однако владелец «Виноградника Рассвет», Дилюк, никогда не пьёт. На вопрос он отвечает загадочной улыбкой."
 
 Sara_desc:0 "Быстрый гром, сверкающий свет. Генерал Комиссии Тэнрё, решительная и храбрая. Если Сёгун — гром в небесах, то Кудзё Сара — молния. Сара, как приёмная дочь рода Кудзё, всегда официальна. Её считают строгой и немногословной, но на самом деле она выбрала путь служения, подавив свои чувства. Её главная цель — служить Сёгуну. Даже если в конце пути её не будет, она не пожалеет. Если у человека может быть только одно желание, это желание Сары — победа для всех нас, даже если на поле боя не останется её. За холодным лицом скрывается горячее сердце, подобное тлеющему огню и тихому грому."
 Kokomi_desc:0 "Тысяча стратегий, победа за тысячу ли. Верховная жрица Сангономии, лидер Санго. Люди считают её мудрой и проницательной, всегда спокойной и всё улаживающей. Она изучала военные трактаты и искусна в стратегии, её хитроумные планы спасали положение при недостатке ресурсов. Она также управляет внутренними делами, торговлей, дипломатией и надзором, заслужив доверие всех сил Санго. «Будьте уверены, с госпожой Кокоми» — часто слышно на Санго. Но мало кто знает, что её мечтой было быть стратегом за кулисами. Разговоры истощают её, на речах у неё трясутся руки, а работа пугает. Самое счастливое время для неё — после работы сидеть дома и читать книги по стратегии. Чем выше статус, тем сложнее."

Albedo:0 "Альбедо"
Albedo_desc:0 "Чистая земля, рождающая изначальных людей. Мастер алхимии, он не раскрывает сути вещей. Он общается с простыми людьми, показывая им искренность и доброту. Он вежлив и элегантен. Хотя он не ищет общения, он не откажет в помощи. Если он признает вас другом, он найдёт время нарисовать ваш портрет. Главный алхимик Ордена Рыцарей Запада, Альбедо, удивляет всех своими знаниями. Гений, Белый Мел или капитан разведки... Он не заботится о титулах, сосредоточившись на исследованиях. Его цель — не богатство, а познание."
 Diona:0 "Диона"
 Diona_desc:0 "Суперзвезда барменов «Кошачьего хвоста», восходящая звезда виноделия Мондштадта, главный враг традиций — так видят Диону мондштадтские пьяницы. Но эта девушка из Спрингвейла с кошачьими ушами и хвостом называет себя «убийцей винной индустрии». Её искусство смешивания — это попытка испортить напиток. Этот парадокс связан с её «благословением» или «проклятием»: любое вино, приготовленное Дионой, становится невероятно вкусным. Но она не сдаётся и продолжает пытаться создать отвратительное вино, чтобы уничтожить виноделие Мондштадта."
 Barbara:0 "Барбара"
 Barbara_desc:0 "Барбара — молитвенница Ордена Рыцарей Запада. Она лечит водой и пением. В Мондштадте верят, что она обладает магией, исцеляющей тело и душу. Для Барбары эта магия — просто усердный труд."
 Albedo:0 "Альбедо"
 Albedo_desc:0 "Чистая земля, рождающая изначальных людей. Мастер алхимии, он не раскрывает сути вещей. Он общается с простыми людьми, показывая им искренность и доброту. Он вежлив и элегантен. Хотя он не ищет общения, он не откажет в помощи. Если он признает вас другом, он найдёт время нарисовать ваш портрет. Главный алхимик Ордена Рыцарей Запада, Альбедо, удивляет всех своими знаниями. Гений, Белый Мел или капитан разведки... Он не заботится о титулах, сосредоточившись на исследованиях. Его цель — не богатство, а познание."
 
 
 #character
ANR_Bennett:0"Беннет"
ANR_Bennett_desc:0"Беннет — энергичный и добрый юноша из Мондштадта, мечтающий стать великим искателем приключений. Но его преследует «неудача». Обвалы, невероятные враги и пустые возвращения. Но это не останавливает его. Он продолжает приключения, закаляясь в «неудачах». Ворон Оз восхищается его телом, Фалька — его бесстрашием, а Барбара — его ловкостью вправлять вывихи. Чтобы стать великим искателем приключений, даже свою «неудачу» нужно использовать как трамплин. Вот о чём мечтает Беннет."
ANR_Fischl:0"Фишль"
ANR_Fischl_desc:0"Принцесса осуждения из «Сумеречного царства» — Фишль, с тёмным спутником-вороном, явилась в Тейват по зову судьбы. Она так представляется в Гильдии искателей приключений. Так как она может видеть через Оза, её приняли в Гильдию. Поначалу было трудно понять её язык, но благодаря Озу её полюбили. Необычная разведчица быстро добывала информацию, завоевав доверие."
ANR_Diona:0"Диона"
ANR_Diona_desc:0"Суперзвезда барменов «Кошачьего хвоста», восходящая звезда виноделия Мондштадта, главный враг традиций — так видят Диону мондштадтские пьяницы. Но эта девушка из Спрингвейла с кошачьими ушами и хвостом называет себя «убийцей винной индустрии». Её искусство смешивания — это попытка испортить напиток. Этот парадокс связан с её «благословением» или «проклятием»: любое вино, приготовленное Дионой, становится невероятно вкусным. Но она не сдаётся и продолжает пытаться создать отвратительное вино, чтобы уничтожить виноделие Мондштадта."
ANR_Razor:0"Рэйзор"
ANR_Razor_desc:0"Андриус, Владыка Севера, часто привечает странников и подкидышей. Волк-мальчик живёт с волками. Его нашёл Великий Магистр Фалька и дал ему имя Рэйзор. Лиза стала его наставницей. Фалька дал ему железные когти, а Лиза научила его использовать Глаз Бога. В Мондштадте ходят слухи о мальчике, который охотится с волками. Его считают волчьим оборотнем. Рэйзор, волк-мальчик, стоит на холме, греясь на солнце со своей стаей, которую он считает своей семьёй."
Bennett:0"Беннет"
Bennett_desc:0"Беннет — энергичный и добрый юноша из Мондштадта, мечтающий стать великим искателем приключений. Но его преследует «неудача». Обвалы, невероятные враги и пустые возвращения. Но это не останавливает его. Он продолжает приключения, закаляясь в «неудачах». Ворон Оз восхищается его телом, Фалька — его бесстрашием, а Барбара — его ловкостью вправлять вывихи. Чтобы стать великим искателем приключений, даже свою «неудачу» нужно использовать как трамплин. Вот о чём мечтает Беннет."
Fischl:0"Фишль"
Fischl_desc:0"Принцесса осуждения из «Сумеречного царства» — Фишль, с тёмным спутником-вороном, явилась в Тейват по зову судьбы. Она так представляется в Гильдии искателей приключений. Так как она может видеть через Оза, её приняли в Гильдию. Поначалу было трудно понять её язык, но благодаря Озу её полюбили. Необычная разведчица быстро добывала информацию, завоевав доверие."
Diona:0"Диона"
Diona_desc:0"Суперзвезда барменов «Кошачьего хвоста», восходящая звезда виноделия Мондштадта, главный враг традиций — так видят Диону мондштадтские пьяницы. Но эта девушка из Спрингвейла с кошачьими ушами и хвостом называет себя «убийцей винной индустрии». Её искусство смешивания — это попытка испортить напиток. Этот парадокс связан с её «благословением» или «проклятием»: любое вино, приготовленное Дионой, становится невероятно вкусным. Но она не сдаётся и продолжает пытаться создать отвратительное вино, чтобы уничтожить виноделие Мондштадта."
Razor:0"Рэйзор"
Razor_desc:0"Андриус, Владыка Севера, часто привечает странников и подкидышей. Волк-мальчик живёт с волками. Его нашёл Великий Магистр Фалька и дал ему имя Рэйзор. Лиза стала его наставницей. Фалька дал ему железные когти, а Лиза научила его использовать Глаз Бога. В Мондштадте ходят слухи о мальчике, который охотится с волками. Его считают волчьим оборотнем. Рэйзор, волк-мальчик, стоит на холме, греясь на солнце со своей стаей, которую он считает своей семьёй."



