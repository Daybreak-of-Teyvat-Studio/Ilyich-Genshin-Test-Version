gene_hunter_in_sky:0"Охотники в небе"
gene_hunter_in_sky_desc:0"У нас лучшие лётчики-истребители в Тейвате, охраняющие наше небо. Враги называют их чудовищами."

gene_focus_on_midium_plane:0"Массовое производство средних самолётов"
gene_focus_on_midium_plane_desc:0""

gene_burn_to_ash:0"Сожжены дотла"
gene_burn_to_ash_desc:0"Наши бомбардировщики и штурмовики сеют ужас среди врагов, обращая их в бегство."

gene_focus_on_large_plane:0"Массовое производство тяжёлых самолётов"
gene_focus_on_large_plane_desc:0""

gene_burn_to_ash:0"Апокалиптическая вспышка"
gene_burn_to_ash_desc:0"Наши стратегические бомбардировщики наводят ужас на врагов — их бомбы становятся кошмаром для всех."

gene_not_enough_supply:0"Нехватка снабжения"
gene_not_enough_supply_desc:0"Нашим солдатам не хватает всего — от еды до боеприпасов. Без решения этой проблемы мы будем воевать голодными и разутыми."

gene_backward_logistics:0"Отсталая логистика"
gene_backward_logistics_desc:0"Наша логистика — как плохой фундамент. Снабжение разбалансировано: на фронте не хватает боеприпасов, а на складах их горы. Без решения мы можем проиграть войну смешным и позорным образом."

gene_advanced_logistics:0"Передовая логистика"
gene_advanced_logistics_desc:0"Мы создали современную систему снабжения, позволяющую доставлять на фронт даже пирожные."

gene_peoples_for_war_for_people:0"Народная война"
gene_peoples_for_war_for_people_desc:0"Народ объединился для войны. Солдаты стали героями. Гражданские помогают чем могут — от разведки до снабжения, а наша логистика адаптировалась к современной войне."

gene_no_command_system:0"Отсутствие системы управления"
gene_no_command_system_desc:0"Победа куётся в штабах, но у нас их нет. Солдаты остаются без командования, что может привести к хаосу на поле боя."

gene_better_commander:0"Расширение штаба"
gene_better_commander_desc:0""

gene_capture_enemies_equipment:0"Нет своих пушек — враг их нам даст"
gene_capture_enemies_equipment_desc:0"Нет своих пушек — враг их нам даст! Пока наше производство отстаёт, мы будем вооружаться трофейным оружием, что создаст проблемы со снабжением, но выбора нет."

gene_military_democracy:0"Военная демократия"
gene_military_democracy_desc:0"Наши солдаты — не пушечное мясо. Они участвуют в обсуждении тактики и понимают цели боя, что повышает эффективность и сплочённость."

gene_no_back:0"Ни шагу назад"
gene_no_back_desc:0"За нашими спинами — наши семьи, рабочие, крестьяне, дети. Отступать — значит предать их. Мы остановим врага, разобьём и уничтожим любой ценой!"

