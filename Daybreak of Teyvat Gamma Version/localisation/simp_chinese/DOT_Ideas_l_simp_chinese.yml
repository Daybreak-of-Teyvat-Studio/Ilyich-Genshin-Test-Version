 Acara_Crafts_desc:0 "阿折罗造像：阿折罗造像总部位于奥摩斯港。"
 Sailing_Breeze_desc:0 "远航之风:「贤者的说教何其枯燥，不如斟满花酿的美酒，踏上征服七海的航程。」"
 With_Wind_Comes_Glory_desc:0 "荣光之风：荣光之风总部在蒙德城。您可以在那里购买纪念品，但请注意，荣光之风的交易货币不是摩拉，而是风之印。"
 Liuli_Pavilion_desc:0 "琉璃亭：琉璃亭总部位于璃月港，是璃月港最著名的“璃菜”馆。您可以在那里购买新的食谱「岩港三鲜」。"
 Scent_of_Spring_desc:0 "春香窑：春香窑是璃月城内的一家店铺，店员是莺儿。莺儿是璃月城内春香窑的店员，也是香药师。她还是蒙德城炼金术师蒂玛乌斯的女友。她的性格古灵精怪，喜欢以调笑的语言逗弄自己有好感的朋友们。"
 Third-Round_Knockout_desc:0 "三碗不过港：三碗不过港总部位于璃月港。"
 Hanfeng_Ironmongers_desc:0 "寒锋铁器：寒锋铁器总部位于璃月港。你可以璃月船厂附近找到铁匠老章，他会锻造寒锋铁器，可获得各类材料和武器。"	
 Lambad_Tavern_desc:0 "兰巴德酒馆"
 Bimarstan_desc:0 "健康之家"
 The_Crux_Fleet_desc:0 "南十字船队：「南十字船队」是以璃月港为根据地活动的武装船队。所谓「武装船队」，只是字面上的意思：一支装备了可靠火力的船队。在商界中也属特殊，不会将情义归为筹码，丢掉性命也要坚持完成的事，可不是筹码二字能够说清。「南十字船队」的旗舰「死兆星号」正停在孤云阁附近补给。船队常年漂泊在外，也会综合各方情报建立沙盘，来模拟登上陌生岛屿后的境况，排除魔物的威胁。「南十字」的一切作为均已得到七星的许可…大致如此。近日凝光特批准增建三座船坞仓库，以供「南十字船队」停泊维护之需。"		
 Pearl_Galley_desc:0 "珠钿舫"
 Good_Hunter_desc:0 "猎鹿人"
 Jade_Chamber_desc:0 "群玉阁"
 Kamisato_Estate_desc:0 "神里屋敷：稻妻三大奉行之一，由神里家世代担任的社奉行负责掌管祭祀活动与人文艺术相关的事务，但其实际上的职责繁多就连幕府中人也很难搞得清楚。相比于担任家主的哥哥，作为妹妹的「白鹭公主」似乎更加受到民众的爱戴。"
 Guhua_Clan_desc:0 "古华派"

 
 generic_tank_manufacturer_desc:0 "往生堂殡仪馆：往生堂总部位于璃月港绯云坡南部，负责承办丧葬事宜。往生堂第七十七代堂主是胡桃。"
 generic_motorized_equipment_manufacturer_desc:0 "天使的馈赠酒馆：天使的馈赠是蒙德城的一家酒馆。它的总部位于蒙德城东北方，酒保查尔斯出售三种不同类型的饮料，每种饮料售价1500摩拉，每天限购2个。"
 generic_infantry_equipment_manufacturer_desc:0 "猎鹿人餐厅"
 generic_artillery_manufacturer_desc:0 "长野原烟花店"
 generic_light_aircraft_manufacturer_desc:0 "九十九物小卖部"
 generic_medium_aircraft_manufacturer_desc:0 "望舒客栈大酒店：端坐在荻花洲南端的客栈，似乎也承担着客栈以外的使命。据说望舒客栈的楼阁是恋人共约赏月的胜地。坊间有传说道，纵然贵为仙人者，偶尔也会在此沐浴清冷的月光。"
 generic_heavy_aircraft_manufacturer_desc:0 "黑岩风之翼制造厂"
 generic_naval_aircraft_manufacturer_desc:0 "北国银行船坞"
 generic_naval_manufacturer_desc:0 "孤云阁竹筏作坊：璃月人会劝说孤云阁更加适合远看，不适合踏足。但是外地人并不听劝。相传孤云阁是旧时众神的碑林，开采出的资材与众不同。"
 generic_industrial_concern_desc:0 "天目锻冶屋：天目锻冶屋总部在稻妻城。它是雷电五传中的一个锻刀流派，其锻刀技艺源自雷电将军。天目锻冶屋的锻刀理念是依靠耐心和全力以赴的意志力，而不是特殊的秘密锻造法。"
