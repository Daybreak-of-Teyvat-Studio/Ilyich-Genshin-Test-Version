 DOT_INTRO_TEXT_NOW_6: "曾牵引着原初的天球，为一整个世界带来爱与热忱的§C三月女神§!早已逝去，但追逐着潮汐的人们并未停止欢歌与祈祷，因为新的§C月神§!将要重临\n\n如今，月光不及之处，§0旧日的阴影§!向星辰，亮出了逐猎的爪牙\n\n请团结一切可能的力量面对旧日的漆黑，往事在水中倒影出未来，谎言的帷幕已然松动，抓紧时间，月亮，要坠下来了\n\n「§C霜月之子§!」\n\n传说中黄金国的遗胤，在抛弃旧日的文明后，选择了在山林之间的生活。他们所唯一不曾抛舍的，只有对「§C月神§!」的信仰。但随着愚人众的到来，从来如此的宁静或许也到了最后的时刻\n\n遥远的故土早已湮落于受造之主的王庭；然而那些高傲的后嗣却依然在漆黑的枯潮中点亮了最初的明灯，纺出那悠远的祷歌，祈望新月的庇护\n\n「§Y执灯人§!」\n\n长久以来对抗着深渊永无休止的入侵与狂猎，守护着挪德卡莱的自由与和平的古老组织，已在过去的大战中元气大伤。而面对着新的威胁，新一代的执灯士们是否还能完成自己的使命\n\n「叮铃哐啷蛋卷工坊」\n\n原本只是以为天才小女孩用来研究「最美味蛋卷机器」的小型工作间。但伴随着众多精巧发明的诞生，这里逐渐渐成为了知名的机械工坊。不过求那位天才办事的时候态度可得好一点，不然你拿到的零件随时可能蹦出一份难吃的蛋卷！\n\n「伏尼契商会」\n\n为了维护基本的秩序，那夏镇的商人们组成的了商会。但诸岛之间的法外狂徒又怎么会被规则所束缚呢？若是要说有谁能让他们感到恐惧，恐怕只有哪位「秘闻馆」的老板娘吧\n\n「愚人众」\n\n在最高指令「苍星圣敕」的辉谕下，愚人众执行官们被悉数召回至冬，前往挪德卡莱。新成立的月矩力实验设计局中，无数传动机关日以继夜的轮转。这里人们纷纷猜测，那擎着苍星旗帜的军势究竟为何而来，或者，是为「谁」而来\n\n「§0狂猎§!」\n\n深渊的大军如风暴掠过旷野与峡谷，若是你靠得足够近，甚至能听见他们诡谲的低语。深渊的气息正在酝酿。漆黑的枯潮在寒夜中低语，等待着撕裂日渐稀薄的帷幕、将那些羸弱的灵魂吞噬殆尽的契机。「规则」难及的阴影中，纵然「死亡」亦非折磨与苦难的终结\n\n「西风骑士团」\n\n隶属于蒙德远征军的一小队精锐骑士，跟随大团长穿越整个至冬来到挪德卡莱，据说他们是为了一项重要的任务而来"

