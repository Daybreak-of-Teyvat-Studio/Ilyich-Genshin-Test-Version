 #################### 新闻 ####################
 SUM_Neo_News.1.t:"花神诞祭的钟声"
 SUM_Neo_News.1.d:"花神诞祭在须弥城开锣。教令院的学者与市集的人群隔着一道石阶站着，净善宫的门依旧关着。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。"
 SUM_Neo_News.1.a:"阅"
 SUM_Neo_News.2.t:"净善宫的门开了"
 SUM_Neo_News.2.d:"净善宫的门被推开，须弥人第一次在正午的日光里见到被囚五百年的小吉祥草王。高塔投下的影子越来越长，傍晚时就盖住了半条街。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。"
 SUM_Neo_News.2.a:"阅"
 SUM_Neo_News.3.t:"六大学派的座次"
 SUM_Neo_News.3.d:"六大学派在议事厅外排成两列，为了第几把椅子争了整整一天。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。"
 SUM_Neo_News.3.a:"阅"
 SUM_Neo_News.4.t:"沙漠的旗"
 SUM_Neo_News.4.d:"镀金旅团的旗在列柱沙原上升起，商队绕开了教令院设的税卡。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。"
 SUM_Neo_News.4.a:"阅"
 SUM_Neo_News.5.t:"虚空的回声"
 SUM_Neo_News.5.d:"虚空终端开始回传须弥人说过的话。学者们说这是进步，商人们把石头塞进了终端的出声口。教令院的门槛这几天被踩得很低，进去的人比出来的人多。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。"
 SUM_Neo_News.5.a:"阅"
 SUM_Neo_News.6.t:"造神的传闻"
 SUM_Neo_News.6.d:"教令院地下传出机械转动的声响。贤者们说那是风，学者们说那不像风。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。"
 SUM_Neo_News.6.a:"阅"
 SUM_Neo_News.7.t:"第二席的到访"
 SUM_Neo_News.7.d:"愚人众第二席的车队驶入须弥城，城门口的花被换了新的。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。"
 SUM_Neo_News.7.a:"阅"
 SUM_Neo_News.8.t:"奥摩斯港的桅杆"
 SUM_Neo_News.8.d:"奥摩斯港的泊位排到灯塔之外，七国的旗挂在同一片桅杆上。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。高塔投下的影子越来越长，傍晚时就盖住了半条街。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。"
 SUM_Neo_News.8.a:"阅"
 SUM_Neo_News.9.t:"沙海铁路通车"
 SUM_Neo_News.9.d:"第一列火车驶出须弥城，抵达列柱沙原边缘的绿洲。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。"
 SUM_Neo_News.9.a:"阅"
 SUM_Neo_News.10.t:"世界树的低语"
 SUM_Neo_News.10.d:"世界树在夜里发出声响，巡林官说那是树在说话，教令院说那是风。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。高塔投下的影子越来越长，傍晚时就盖住了半条街。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。"
 SUM_Neo_News.10.a:"阅"
 SUM_Neo_News.11.t:"新的神座"
 SUM_Neo_News.11.d:"净善宫正殿立起一座新的神座。须弥人说不清坐在上面的是谁。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。"
 SUM_Neo_News.11.a:"阅"
 SUM_Neo_News.12.t:"须弥的抉择"
 SUM_Neo_News.12.d:"须弥走到了岔路口。书院、圣树与王座，三条路摆在执政者面前。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。高塔投下的影子越来越长，傍晚时就盖住了半条街。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。"
 SUM_Neo_News.12.a:"阅"

 #################### 镀金沙漠 ####################
 #### 序章 · 藩属之影 ####
 SUM_SGD_PRO_Shadow_of_the_Suzerain:"藩属之影"
 SUM_SGD_PRO_Shadow_of_the_Suzerain_desc:"镀金沙漠的城门归教令院管，税册归教令院写，连城门口那口钟敲几下，也要照雨林发来的公文办。沙子记得住每一任总督的名字，总督们却连沙丘朝哪边长都懒得问。"
 SUM_Neo_SGD.1.t:"藩属之影"
 SUM_Neo_SGD.1.d:"镀金沙漠的城门归教令院管，税册归教令院写，连城门口那口钟敲几下，也要照雨林发来的公文办。沙子记得住每一任总督的名字，总督们却连沙丘朝哪边长都懒得问。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGD.1.a:"循教令院发下的旧例"
 SUM_Neo_SGD.1.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Tax_Ledger:"税册上的沙漠"
 SUM_SGD_PRO_Tax_Ledger_desc:"税吏把名目抄了满满一卷，从水井到骆驼铃铛都算一份。城民把这一卷贴在墙上，算是知道自己一年要交几回。"
 SUM_Neo_SGD.2.t:"税册上的沙漠"
 SUM_Neo_SGD.2.d:"税吏把名目抄了满满一卷，从水井到骆驼铃铛都算一份。城民把这一卷贴在墙上，算是知道自己一年要交几回。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SGD.2.a:"把账目封存"
 SUM_Neo_SGD.2.b:"把账目摊开"
 SUM_SGD_PRO_Governor:"教令院的总督"
 SUM_SGD_PRO_Governor_desc:"总督由雨林指派，任期三年，任期里最大的政绩是把税收到手。至于沙漠怎么过日子，公文上从来不问。"
 SUM_Neo_SGD.3.t:"教令院的总督"
 SUM_Neo_SGD.3.d:"总督由雨林指派，任期三年，任期里最大的政绩是把税收到手。至于沙漠怎么过日子，公文上从来不问。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGD.3.a:"按官署的判断行事"
 SUM_Neo_SGD.3.b:"按自己的判断行事"
 SUM_SGD_PRO_Garrisons:"雨林的驻军"
 SUM_SGD_PRO_Garrisons_desc:"城墙上站的是别处调来的兵，口令用雨林的口音喊。他们守得住城门，却认不出城里的路。"
 SUM_Neo_SGD.4.t:"雨林的驻军"
 SUM_Neo_SGD.4.d:"城墙上站的是别处调来的兵，口令用雨林的口音喊。他们守得住城门，却认不出城里的路。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGD.4.a:"先看住脚下的城"
 SUM_Neo_SGD.4.b:"先看住远方的人"
 SUM_SGD_PRO_Censor_Eyes:"沙中的耳目"
 SUM_SGD_PRO_Censor_Eyes_desc:"官署在各处路口都放了人，记下谁说了什么、谁见了谁。记性太好的人，在这年头不算好事。"
 SUM_Neo_SGD.5.t:"沙中的耳目"
 SUM_Neo_SGD.5.d:"官署在各处路口都放了人，记下谁说了什么、谁见了谁。记性太好的人，在这年头不算好事。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SGD.5.a:"循教令院发下的旧例"
 SUM_Neo_SGD.5.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Petition:"陈情的状纸"
 SUM_SGD_PRO_Petition_desc:"有长者跪在官署门口递状纸，递到第三回，状纸被风吹走了一半，剩下的半张也没人接。"
 SUM_Neo_SGD.6.t:"陈情的状纸"
 SUM_Neo_SGD.6.d:"有长者跪在官署门口递状纸，递到第三回，状纸被风吹走了一半，剩下的半张也没人接。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGD.6.a:"把账目封存"
 SUM_Neo_SGD.6.b:"把账目摊开"
 SUM_SGD_PRO_Old_Road:"旧道与商队"
 SUM_SGD_PRO_Old_Road_desc:"商队走的是赤王年间就有的旧道，一路上没有一块界碑写着雨林的名字。"
 SUM_Neo_SGD.7.t:"旧道与商队"
 SUM_Neo_SGD.7.d:"商队走的是赤王年间就有的旧道，一路上没有一块界碑写着雨林的名字。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。"
 SUM_Neo_SGD.7.a:"按官署的判断行事"
 SUM_Neo_SGD.7.b:"按自己的判断行事"
 SUM_SGD_PRO_Oasis_Well:"绿洲的泉水"
 SUM_SGD_PRO_Oasis_Well_desc:"绿洲的泉是全城的命，可水权攥在官署手里。挑水的人天不亮就得排队。"
 SUM_Neo_SGD.8.t:"绿洲的泉水"
 SUM_Neo_SGD.8.d:"绿洲的泉是全城的命，可水权攥在官署手里。挑水的人天不亮就得排队。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.8.a:"先看住脚下的城"
 SUM_Neo_SGD.8.b:"先看住远方的人"
 SUM_SGD_PRO_Salt_Field:"盐碱地的收成"
 SUM_SGD_PRO_Salt_Field_desc:"盐碱地里只能种些耐旱的豆子，收成薄，可税是一样的税。农人把薄收的年景记在心里，不写在纸上。"
 SUM_Neo_SGD.9.t:"盐碱地的收成"
 SUM_Neo_SGD.9.d:"盐碱地里只能种些耐旱的豆子，收成薄，可税是一样的税。农人把薄收的年景记在心里，不写在纸上。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGD.9.a:"循教令院发下的旧例"
 SUM_Neo_SGD.9.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Bazaar:"集市的秤"
 SUM_SGD_PRO_Bazaar_desc:"集市的秤年年要换，越换越沉。买卖的人心里有数，嘴上不说。"
 SUM_Neo_SGD.10.t:"集市的秤"
 SUM_Neo_SGD.10.d:"集市的秤年年要换，越换越沉。买卖的人心里有数，嘴上不说。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGD.10.a:"把账目封存"
 SUM_Neo_SGD.10.b:"把账目摊开"
 SUM_SGD_PRO_Pathfinder:"识路的向导"
 SUM_SGD_PRO_Pathfinder_desc:"只有土生土长的向导认得沙丘每年挪到哪。雨林来的测绘队画了三年地图，还是走丢过两回。"
 SUM_Neo_SGD.11.t:"识路的向导"
 SUM_Neo_SGD.11.d:"只有土生土长的向导认得沙丘每年挪到哪。雨林来的测绘队画了三年地图，还是走丢过两回。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGD.11.a:"按官署的判断行事"
 SUM_Neo_SGD.11.b:"按自己的判断行事"
 SUM_SGD_PRO_Red_King_Column:"赤王的石柱"
 SUM_SGD_PRO_Red_King_Column_desc:"石柱在沙里露着半截，上面的字没有人认得，可路过的人都会伸手摸一摸。"
 SUM_Neo_SGD.12.t:"赤王的石柱"
 SUM_Neo_SGD.12.d:"石柱在沙里露着半截，上面的字没有人认得，可路过的人都会伸手摸一摸。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGD.12.a:"先看住脚下的城"
 SUM_Neo_SGD.12.b:"先看住远方的人"
 SUM_SGD_PRO_Scarlet_Slate:"赤沙石板"
 SUM_SGD_PRO_Scarlet_Slate_desc:"有商队从遗迹里带出石板，官署说是赃物要没收。石板最后还是进了官署的库房，谁也没再见过。"
 SUM_Neo_SGD.13.t:"赤沙石板"
 SUM_Neo_SGD.13.d:"有商队从遗迹里带出石板，官署说是赃物要没收。石板最后还是进了官署的库房，谁也没再见过。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGD.13.a:"循教令院发下的旧例"
 SUM_Neo_SGD.13.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Tomb_Slab:"掘墓人的口供"
 SUM_SGD_PRO_Tomb_Slab_desc:"掘墓人被抓住审了三夜，交代的是遗迹里的机关，不是金子去了哪。"
 SUM_Neo_SGD.14.t:"掘墓人的口供"
 SUM_Neo_SGD.14.d:"掘墓人被抓住审了三夜，交代的是遗迹里的机关，不是金子去了哪。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGD.14.a:"把账目封存"
 SUM_Neo_SGD.14.b:"把账目摊开"
 SUM_SGD_PRO_Staff_Scarlet:"赤沙之杖的传说"
 SUM_SGD_PRO_Staff_Scarlet_desc:"老辈人说赤王有一根杖，杖所指处沙会开、水会来。年轻人说那是哄孩子的故事，可夜里还是会听。"
 SUM_Neo_SGD.15.t:"赤沙之杖的传说"
 SUM_Neo_SGD.15.d:"老辈人说赤王有一根杖，杖所指处沙会开、水会来。年轻人说那是哄孩子的故事，可夜里还是会听。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SGD.15.a:"按官署的判断行事"
 SUM_Neo_SGD.15.b:"按自己的判断行事"
 SUM_SGD_PRO_Sand_Worm:"沙下的巨虫"
 SUM_SGD_PRO_Sand_Worm_desc:"商队绕开固定的几处沙丘，说是底下住着东西。官署发过公告，说这是迷信。公告发完，绕路的人更多了。"
 SUM_Neo_SGD.16.t:"沙下的巨虫"
 SUM_Neo_SGD.16.d:"商队绕开固定的几处沙丘，说是底下住着东西。官署发过公告，说这是迷信。公告发完，绕路的人更多了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGD.16.a:"先看住脚下的城"
 SUM_Neo_SGD.16.b:"先看住远方的人"
 SUM_SGD_PRO_Elder_Fire:"长老的火塘"
 SUM_SGD_PRO_Elder_Fire_desc:"各部族的长老围着火塘议事，火不熄，话就不停。雨林来的官坐在最外圈，插不上话。"
 SUM_Neo_SGD.17.t:"长老的火塘"
 SUM_Neo_SGD.17.d:"各部族的长老围着火塘议事，火不熄，话就不停。雨林来的官坐在最外圈，插不上话。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGD.17.a:"循教令院发下的旧例"
 SUM_Neo_SGD.17.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Blood_Law:"血的律法"
 SUM_SGD_PRO_Blood_Law_desc:"部族的规矩写在血里，犯了事由长老处置，官署的律条到了沙丘边就打住了。"
 SUM_Neo_SGD.18.t:"血的律法"
 SUM_Neo_SGD.18.d:"部族的规矩写在血里，犯了事由长老处置，官署的律条到了沙丘边就打住了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGD.18.a:"把账目封存"
 SUM_Neo_SGD.18.b:"把账目摊开"
 SUM_SGD_PRO_Bridal_Pact:"聘礼与盟誓"
 SUM_SGD_PRO_Bridal_Pact_desc:"两族结亲便是结盟，聘礼单子比条约还长。这一套官署看不懂，也管不着。"
 SUM_Neo_SGD.19.t:"聘礼与盟誓"
 SUM_Neo_SGD.19.d:"两族结亲便是结盟，聘礼单子比条约还长。这一套官署看不懂，也管不着。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SGD.19.a:"按官署的判断行事"
 SUM_Neo_SGD.19.b:"按自己的判断行事"
 SUM_SGD_PRO_Herdsmen:"牧人与羊群"
 SUM_SGD_PRO_Herdsmen_desc:"牧人赶着羊顺着水草走，一年里从不踏进城里几回，却比谁都清楚沙漠的脾气。"
 SUM_Neo_SGD.20.t:"牧人与羊群"
 SUM_Neo_SGD.20.d:"牧人赶着羊顺着水草走，一年里从不踏进城里几回，却比谁都清楚沙漠的脾气。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。"
 SUM_Neo_SGD.20.a:"先看住脚下的城"
 SUM_Neo_SGD.20.b:"先看住远方的人"
 SUM_SGD_PRO_Oath_Flower:"永誓之花"
 SUM_SGD_PRO_Oath_Flower_desc:"部族之间立誓要折一枝花，花谢之前谁也不能翻脸。花谢得很快，所以誓言也立得很勤。"
 SUM_Neo_SGD.21.t:"永誓之花"
 SUM_Neo_SGD.21.d:"部族之间立誓要折一枝花，花谢之前谁也不能翻脸。花谢得很快，所以誓言也立得很勤。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGD.21.a:"循教令院发下的旧例"
 SUM_Neo_SGD.21.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Eremite_Banner:"旅团的旗"
 SUM_SGD_PRO_Eremite_Banner_desc:"镀金旅团不认旗号，只认契约。今天替官署押货，明天可能替反对官署的人押货。"
 SUM_Neo_SGD.22.t:"旅团的旗"
 SUM_Neo_SGD.22.d:"镀金旅团不认旗号，只认契约。今天替官署押货，明天可能替反对官署的人押货。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。"
 SUM_Neo_SGD.22.a:"把账目封存"
 SUM_Neo_SGD.22.b:"把账目摊开"
 SUM_SGD_PRO_Contract:"契约与摩拉"
 SUM_SGD_PRO_Contract_desc:"旅团的账房比官署的税吏精明，一笔一划都算得清楚。契约上写明的，刀就朝着那个方向。"
 SUM_Neo_SGD.23.t:"契约与摩拉"
 SUM_Neo_SGD.23.d:"旅团的账房比官署的税吏精明，一笔一划都算得清楚。契约上写明的，刀就朝着那个方向。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGD.23.a:"按官署的判断行事"
 SUM_Neo_SGD.23.b:"按自己的判断行事"
 SUM_SGD_PRO_God_King_Legacy:"神王之遗"
 SUM_SGD_PRO_God_King_Legacy_desc:"神王之遗是沙漠里最大的一支佣兵团，名下的附属团数不清，规矩是入团先留案底，好拿住人。"
 SUM_Neo_SGD.24.t:"神王之遗"
 SUM_Neo_SGD.24.d:"神王之遗是沙漠里最大的一支佣兵团，名下的附属团数不清，规矩是入团先留案底，好拿住人。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.24.a:"先看住脚下的城"
 SUM_Neo_SGD.24.b:"先看住远方的人"
 SUM_SGD_PRO_Blazing_Lion:"炽光之狮"
 SUM_SGD_PRO_Blazing_Lion_desc:"有人从神王之遗里脱了身，自己拉了一支队，立下的第一条规矩是不接抢劫的活。"
 SUM_Neo_SGD.25.t:"炽光之狮"
 SUM_Neo_SGD.25.d:"有人从神王之遗里脱了身，自己拉了一支队，立下的第一条规矩是不接抢劫的活。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGD.25.a:"循教令院发下的旧例"
 SUM_Neo_SGD.25.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Mercenary_Code:"佣兵的规矩"
 SUM_SGD_PRO_Mercenary_Code_desc:"佣兵有佣兵的讲法：付钱之前是朋友，付钱之后是路人，赖账就是仇人。这条讲法比官署的律例好使得多。"
 SUM_Neo_SGD.26.t:"佣兵的规矩"
 SUM_Neo_SGD.26.d:"佣兵有佣兵的讲法：付钱之前是朋友，付钱之后是路人，赖账就是仇人。这条讲法比官署的律例好使得多。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGD.26.a:"把账目封存"
 SUM_Neo_SGD.26.b:"把账目摊开"
 SUM_SGD_PRO_Camelry:"驼队骑手"
 SUM_SGD_PRO_Camelry_desc:"沙漠里骑马跑不快，能跑的是驼。驼队的骑手从小跟骆驼一起长大，比军官更懂什么叫耐渴。"
 SUM_Neo_SGD.27.t:"驼队骑手"
 SUM_Neo_SGD.27.d:"沙漠里骑马跑不快，能跑的是驼。驼队的骑手从小跟骆驼一起长大，比军官更懂什么叫耐渴。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SGD.27.a:"按官署的判断行事"
 SUM_Neo_SGD.27.b:"按自己的判断行事"
 SUM_SGD_PRO_Tribal_Militia:"部族民兵"
 SUM_SGD_PRO_Tribal_Militia_desc:"各部族自己养着民兵，兵器是自家的，粮是自家的。官署征调过两回，回来的不到一半。"
 SUM_Neo_SGD.28.t:"部族民兵"
 SUM_Neo_SGD.28.d:"各部族自己养着民兵，兵器是自家的，粮是自家的。官署征调过两回，回来的不到一半。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGD.28.a:"先看住脚下的城"
 SUM_Neo_SGD.28.b:"先看住远方的人"
 SUM_SGD_PRO_Frontier_Fort:"边关的土堡"
 SUM_SGD_PRO_Frontier_Fort_desc:"边关的土堡垒了又塌，塌了又垒。守堡的人换过几拨，堡还是那个堡。"
 SUM_Neo_SGD.29.t:"边关的土堡"
 SUM_Neo_SGD.29.d:"边关的土堡垒了又塌，塌了又垒。守堡的人换过几拨，堡还是那个堡。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SGD.29.a:"循教令院发下的旧例"
 SUM_Neo_SGD.29.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Sand_Recon:"沙海的侦察"
 SUM_SGD_PRO_Sand_Recon_desc:"侦察的人走在最前面，认的是脚印和风，不是地图。他们带回来的消息，官署常常不信。"
 SUM_Neo_SGD.30.t:"沙海的侦察"
 SUM_Neo_SGD.30.d:"侦察的人走在最前面，认的是脚印和风，不是地图。他们带回来的消息，官署常常不信。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGD.30.a:"把账目封存"
 SUM_Neo_SGD.30.b:"把账目摊开"
 SUM_SGD_PRO_Smuggled_Arms:"偷运的军械"
 SUM_SGD_PRO_Smuggled_Arms_desc:"军械从各种名目下运进沙漠，官署查得紧，就绕着走别的路。查到最后，连查的人也开始带货。"
 SUM_Neo_SGD.31.t:"偷运的军械"
 SUM_Neo_SGD.31.d:"军械从各种名目下运进沙漠，官署查得紧，就绕着走别的路。查到最后，连查的人也开始带货。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGD.31.a:"按官署的判断行事"
 SUM_Neo_SGD.31.b:"按自己的判断行事"

 #### 独立之路 ####
 SUM_SGD_IND_The_Long_Road:"漫长的独立路"
 SUM_SGD_IND_The_Long_Road_desc:"沙漠与雨林之间隔着的不只是沙。要走到独立那一步，先得把散在各处的城邦、部族与旅团捏成一股绳，再让雨林相信这股绳勒得住它自己。"
 SUM_Neo_SGD.32.t:"漫长的独立路"
 SUM_Neo_SGD.32.d:"沙漠与雨林之间隔着的不只是沙。要走到独立那一步，先得把散在各处的城邦、部族与旅团捏成一股绳，再让雨林相信这股绳勒得住它自己。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SGD.32.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.32.b:"把盟约收进箱底"
 SUM_SGD_IND_Envoy_Tribes:"派出说客"
 SUM_SGD_IND_Envoy_Tribes_desc:"说客带着礼物走遍各部，礼物是次要的，话才是主要的。话要说得让长老们觉得是自己的主意。"
 SUM_Neo_SGD.33.t:"派出说客"
 SUM_Neo_SGD.33.d:"说客带着礼物走遍各部，礼物是次要的，话才是主要的。话要说得让长老们觉得是自己的主意。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGD.33.a:"召集部族共商"
 SUM_Neo_SGD.33.b:"等官署先松口"
 SUM_SGD_IND_Council_Sand:"沙海议事"
 SUM_SGD_IND_Council_Sand_desc:"几十个部族的代表聚在一处，坐了三天。吵得最凶的是座次，散会时却把要紧的一条写进了盟约。"
 SUM_Neo_SGD.34.t:"沙海议事"
 SUM_Neo_SGD.34.d:"几十个部族的代表聚在一处，坐了三天。吵得最凶的是座次，散会时却把要紧的一条写进了盟约。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGD.34.a:"备好兵与粮"
 SUM_Neo_SGD.34.b:"多派几趟使节"
 SUM_SGD_IND_Pact_Blood:"血誓之盟"
 SUM_SGD_IND_Pact_Blood_desc:"立盟要放血，要折花，要当众念一遍祖辈的誓词。念完这些人就不再是各顾各的部族了。"
 SUM_Neo_SGD.35.t:"血誓之盟"
 SUM_Neo_SGD.35.d:"立盟要放血，要折花，要当众念一遍祖辈的誓词。念完这些人就不再是各顾各的部族了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGD.35.a:"把旗立起来"
 SUM_Neo_SGD.35.b:"把旗先卷起来"
 SUM_SGD_IND_Chieftain_League:"部族同盟"
 SUM_SGD_IND_Chieftain_League_desc:"同盟不设共主，只设一个轮值的座。谁坐上去谁就得替大家扛事。"
 SUM_Neo_SGD.36.t:"部族同盟"
 SUM_Neo_SGD.36.d:"同盟不设共主，只设一个轮值的座。谁坐上去谁就得替大家扛事。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGD.36.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.36.b:"把盟约收进箱底"
 SUM_SGD_IND_Hidden_Camp:"沙下的营地"
 SUM_SGD_IND_Hidden_Camp_desc:"营地在沙丘背风的一面，从外边看不出痕迹。要走的人先在这里落脚，再分头出去。"
 SUM_Neo_SGD.37.t:"沙下的营地"
 SUM_Neo_SGD.37.d:"营地在沙丘背风的一面，从外边看不出痕迹。要走的人先在这里落脚，再分头出去。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SGD.37.a:"召集部族共商"
 SUM_Neo_SGD.37.b:"等官署先松口"
 SUM_SGD_IND_Foundry:"沙中的铁匠铺"
 SUM_SGD_IND_Foundry_desc:"铁匠铺白天打农具，夜里打别的东西。炉子没凉过，来取货的从不走前门。"
 SUM_Neo_SGD.38.t:"沙中的铁匠铺"
 SUM_Neo_SGD.38.d:"铁匠铺白天打农具，夜里打别的东西。炉子没凉过，来取货的从不走前门。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SGD.38.a:"备好兵与粮"
 SUM_Neo_SGD.38.b:"多派几趟使节"
 SUM_SGD_IND_Camel_Corps:"驼骑整编"
 SUM_SGD_IND_Camel_Corps_desc:"把各部的驼队编成号，按号发粮。从前各部自己管自己，如今号令一处出。"
 SUM_Neo_SGD.39.t:"驼骑整编"
 SUM_Neo_SGD.39.d:"把各部的驼队编成号，按号发粮。从前各部自己管自己，如今号令一处出。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGD.39.a:"把旗立起来"
 SUM_Neo_SGD.39.b:"把旗先卷起来"
 SUM_SGD_IND_Sand_Tactic:"沙暴战术"
 SUM_SGD_IND_Sand_Tactic_desc:"沙漠的仗要借风打。风起时不打，风停时再打，这是几百年打出来的经验。"
 SUM_Neo_SGD.40.t:"沙暴战术"
 SUM_Neo_SGD.40.d:"沙漠的仗要借风打。风起时不打，风停时再打，这是几百年打出来的经验。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGD.40.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.40.b:"把盟约收进箱底"
 SUM_SGD_IND_Powder_Store:"隐蔽的弹药库"
 SUM_SGD_IND_Powder_Store_desc:"弹药分藏在几处废弃的遗迹里，位置只有三个人知道。三个人里有一个后来失踪了。"
 SUM_Neo_SGD.41.t:"隐蔽的弹药库"
 SUM_Neo_SGD.41.d:"弹药分藏在几处废弃的遗迹里，位置只有三个人知道。三个人里有一个后来失踪了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGD.41.a:"召集部族共商"
 SUM_Neo_SGD.41.b:"等官署先松口"
 SUM_SGD_IND_War_Drill:"临战操演"
 SUM_SGD_IND_War_Drill_desc:"操演在夜里进行，练的是集结与分散。练到后来，连口令都省了，看火光就知道该往哪走。"
 SUM_Neo_SGD.42.t:"临战操演"
 SUM_Neo_SGD.42.d:"操演在夜里进行，练的是集结与分散。练到后来，连口令都省了，看火光就知道该往哪走。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SGD.42.a:"备好兵与粮"
 SUM_Neo_SGD.42.b:"多派几趟使节"
 SUM_SGD_IND_Toll_Posts:"商路税卡"
 SUM_SGD_IND_Toll_Posts_desc:"税卡设在路口，收的是过路钱。钱不进官库，进的是盟约的账。"
 SUM_Neo_SGD.43.t:"商路税卡"
 SUM_Neo_SGD.43.d:"税卡设在路口，收的是过路钱。钱不进官库，进的是盟约的账。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。车辙一直压到城门口。"
 SUM_Neo_SGD.43.a:"把旗立起来"
 SUM_Neo_SGD.43.b:"把旗先卷起来"
 SUM_SGD_IND_Salt_Monopoly:"盐利专营"
 SUM_SGD_IND_Salt_Monopoly_desc:"沙漠缺盐，盐就是命。把盐捏在手里，等于捏住了大半条商路。"
 SUM_Neo_SGD.44.t:"盐利专营"
 SUM_Neo_SGD.44.d:"沙漠缺盐，盐就是命。把盐捏在手里，等于捏住了大半条商路。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGD.44.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.44.b:"把盟约收进箱底"
 SUM_SGD_IND_Caravan_Pact:"商队盟约"
 SUM_SGD_IND_Caravan_Pact_desc:"商队立盟互保，路上遇劫一起还手。这一条比官署的巡防管用。"
 SUM_Neo_SGD.45.t:"商队盟约"
 SUM_Neo_SGD.45.d:"商队立盟互保，路上遇劫一起还手。这一条比官署的巡防管用。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGD.45.a:"召集部族共商"
 SUM_Neo_SGD.45.b:"等官署先松口"
 SUM_SGD_IND_Coin_Sand:"沙海的铸币"
 SUM_SGD_IND_Coin_Sand_desc:"几家大商户合铸了一种新钱，成色足，比官铸的好使。市上的人认这个，不认印章。"
 SUM_Neo_SGD.46.t:"沙海的铸币"
 SUM_Neo_SGD.46.d:"几家大商户合铸了一种新钱，成色足，比官铸的好使。市上的人认这个，不认印章。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGD.46.a:"备好兵与粮"
 SUM_Neo_SGD.46.b:"多派几趟使节"
 SUM_SGD_IND_Blockade_Market:"罢市与封锁"
 SUM_SGD_IND_Blockade_Market_desc:"要挟雨林的时候，罢市比动兵管用。集市一关，往雨林去的货就断了。"
 SUM_Neo_SGD.47.t:"罢市与封锁"
 SUM_Neo_SGD.47.d:"要挟雨林的时候，罢市比动兵管用。集市一关，往雨林去的货就断了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SGD.47.a:"把旗立起来"
 SUM_Neo_SGD.47.b:"把旗先卷起来"
 SUM_SGD_IND_Proclamation:"告沙漠民书"
 SUM_SGD_IND_Proclamation_desc:"文书用沙漠的古文字写，贴在每座城的门外。认得的人不多，可认得的都会念给别人听。"
 SUM_Neo_SGD.48.t:"告沙漠民书"
 SUM_Neo_SGD.48.d:"文书用沙漠的古文字写，贴在每座城的门外。认得的人不多，可认得的都会念给别人听。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGD.48.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.48.b:"把盟约收进箱底"
 SUM_SGD_IND_Flag_Raise:"立起旗帜"
 SUM_SGD_IND_Flag_Raise_desc:"旗是各家凑布缝的，红底上一只展翅的鸟。旗立起来那天，城门口没人收税。"
 SUM_Neo_SGD.49.t:"立起旗帜"
 SUM_Neo_SGD.49.d:"旗是各家凑布缝的，红底上一只展翅的鸟。旗立起来那天，城门口没人收税。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGD.49.a:"召集部族共商"
 SUM_Neo_SGD.49.b:"等官署先松口"
 SUM_SGD_IND_Reject_Edict:"拒受敕令"
 SUM_SGD_IND_Reject_Edict_desc:"雨林发来的敕令当着使节的面撕了，撕的是几百年的规矩。"
 SUM_Neo_SGD.50.t:"拒受敕令"
 SUM_Neo_SGD.50.d:"雨林发来的敕令当着使节的面撕了，撕的是几百年的规矩。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGD.50.a:"备好兵与粮"
 SUM_Neo_SGD.50.b:"多派几趟使节"
 SUM_SGD_IND_Claim_Land:"重申地界"
 SUM_SGD_IND_Claim_Land_desc:"地界重划了一遍，把雨林设的界碑挪走，换成本地长老立的石堆。"
 SUM_Neo_SGD.51.t:"重申地界"
 SUM_Neo_SGD.51.d:"地界重划了一遍，把雨林设的界碑挪走，换成本地长老立的石堆。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGD.51.a:"把旗立起来"
 SUM_Neo_SGD.51.b:"把旗先卷起来"
 SUM_SGD_IND_Declaration_Text:"独立宣言的定稿"
 SUM_SGD_IND_Declaration_Text_desc:"宣言改了七稿，改到最后只剩三条：不受敕令、自定赋税、自养军伍。"
 SUM_Neo_SGD.52.t:"独立宣言的定稿"
 SUM_Neo_SGD.52.d:"宣言改了七稿，改到最后只剩三条：不受敕令、自定赋税、自养军伍。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGD.52.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.52.b:"把盟约收进箱底"
 SUM_SGD_IND_Envoy_North:"北方来的信使"
 SUM_SGD_IND_Envoy_North_desc:"北边来的信使在城外等了半月，见面只问一句：沙漠站哪一边。"
 SUM_Neo_SGD.53.t:"北方来的信使"
 SUM_Neo_SGD.53.d:"北边来的信使在城外等了半月，见面只问一句：沙漠站哪一边。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGD.53.a:"召集部族共商"
 SUM_Neo_SGD.53.b:"等官署先松口"
 SUM_SGD_IND_Envoy_Port:"港口客商"
 SUM_SGD_IND_Envoy_Port_desc:"港口的客商带来的是船票和价钱。沙漠若开港，货就从海上走，不必再看雨林的脸色。"
 SUM_Neo_SGD.54.t:"港口客商"
 SUM_Neo_SGD.54.d:"港口的客商带来的是船票和价钱。沙漠若开港，货就从海上走，不必再看雨林的脸色。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGD.54.a:"备好兵与粮"
 SUM_Neo_SGD.54.b:"多派几趟使节"
 SUM_SGD_IND_Envoy_Sea:"东海的船队"
 SUM_SGD_IND_Envoy_Sea_desc:"东海来的船队在近海停了一夜，没有靠岸。旗舰上挂的旗，沙暴天里也看得清。"
 SUM_Neo_SGD.55.t:"东海的船队"
 SUM_Neo_SGD.55.d:"东海来的船队在近海停了一夜，没有靠岸。旗舰上挂的旗，沙暴天里也看得清。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。"
 SUM_Neo_SGD.55.a:"把旗立起来"
 SUM_Neo_SGD.55.b:"把旗先卷起来"
 SUM_SGD_IND_Envoy_Winter:"北国的使团"
 SUM_SGD_IND_Envoy_Winter_desc:"北国的使团最舍得花钱，开口就要驻军的权利。长老们对这笔钱心动，对那两个字犯怵。"
 SUM_Neo_SGD.56.t:"北国的使团"
 SUM_Neo_SGD.56.d:"北国的使团最舍得花钱，开口就要驻军的权利。长老们对这笔钱心动，对那两个字犯怵。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGD.56.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.56.b:"把盟约收进箱底"
 SUM_SGD_IND_Buy_Arms:"购置军械"
 SUM_SGD_IND_Buy_Arms_desc:"向外邦买军械，买的是铁和火，卖的是往后若干年的承诺。"
 SUM_Neo_SGD.57.t:"购置军械"
 SUM_Neo_SGD.57.d:"向外邦买军械，买的是铁和火，卖的是往后若干年的承诺。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGD.57.a:"召集部族共商"
 SUM_Neo_SGD.57.b:"等官署先松口"
 SUM_SGD_IND_Declaration:"镀金沙漠宣布独立"
 SUM_SGD_IND_Declaration_desc:"城头上那面红底飞鸟旗升到顶又落下半尺，是风大。广场上站满了人，往日收税的官署大门关着，门口的石阶上坐着长老，正把盟约一条条念出来。从这一天起，沙漠不再替雨林交税，也不再替雨林出兵。"
 SUM_Neo_SGD.58.t:"镀金沙漠宣布独立"
 SUM_Neo_SGD.58.d:"城头上那面红底飞鸟旗升到顶又落下半尺，是风大。广场上站满了人，往日收税的官署大门关着，门口的石阶上坐着长老，正把盟约一条条念出来。从这一天起，沙漠不再替雨林交税，也不再替雨林出兵。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGD.58.a:"备好兵与粮"
 SUM_Neo_SGD.58.b:"多派几趟使节"

 #### 甲线 · 沙海商路 ####
 SUM_SGD_RA_The_Caravan_Road:"沙海商路的算盘"
 SUM_SGD_RA_The_Caravan_Road_desc:"有人主张沙漠的未来在绿洲与商队：把水引出来，把城邦立起来，让契约和律例管事。这条路走得慢，可走过的城邦没有一个愿意回头。"
 SUM_Neo_SGD.59.t:"沙海商路的算盘"
 SUM_Neo_SGD.59.d:"有人主张沙漠的未来在绿洲与商队：把水引出来，把城邦立起来，让契约和律例管事。这条路走得慢，可走过的城邦没有一个愿意回头。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGD.59.a:"让商路连通四方"
 SUM_Neo_SGD.59.b:"把商路关起来自守"
 SUM_SGD_RA_Aqueduct:"引水入城"
 SUM_SGD_RA_Aqueduct_desc:"水渠从山里引来，一路铺到城根。渠修成那天，城里的人放下手里的活，站在渠边看水。"
 SUM_Neo_SGD.60.t:"引水入城"
 SUM_Neo_SGD.60.d:"水渠从山里引来，一路铺到城根。渠修成那天，城里的人放下手里的活，站在渠边看水。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGD.60.a:"以契约立信"
 SUM_Neo_SGD.60.b:"以枪杆立威"
 SUM_SGD_RA_Palm_Grove:"棕榈成林"
 SUM_SGD_RA_Palm_Grove_desc:"沿渠遍植棕榈，三年成荫。树是公家的，果实按人头分。"
 SUM_Neo_SGD.61.t:"棕榈成林"
 SUM_Neo_SGD.61.d:"沿渠遍植棕榈，三年成荫。树是公家的，果实按人头分。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGD.61.a:"把利润分给城邦"
 SUM_Neo_SGD.61.b:"把利润收归官库"
 SUM_SGD_RA_Canal_Dark:"沙下的暗渠"
 SUM_SGD_RA_Canal_Dark_desc:"地面上不留痕迹，水从沙下走。暗道的位置记在城邦的册子上，不记在任何一个人的脑子里。"
 SUM_Neo_SGD.62.t:"沙下的暗渠"
 SUM_Neo_SGD.62.d:"地面上不留痕迹，水从沙下走。暗道的位置记在城邦的册子上，不记在任何一个人的脑子里。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGD.62.a:"借水草养人"
 SUM_Neo_SGD.62.b:"借商队养兵"
 SUM_SGD_RA_Green_Fringe:"沙缘的绿带"
 SUM_SGD_RA_Green_Fringe_desc:"在沙与田之间立起一道草带，挡住流沙。挡不住也得挡，田是一年一年守出来的。"
 SUM_Neo_SGD.63.t:"沙缘的绿带"
 SUM_Neo_SGD.63.d:"在沙与田之间立起一道草带，挡住流沙。挡不住也得挡，田是一年一年守出来的。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGD.63.a:"让商路连通四方"
 SUM_Neo_SGD.63.b:"把商路关起来自守"
 SUM_SGD_RA_Water_Right:"水权的分配"
 SUM_SGD_RA_Water_Right_desc:"水按户分配，谁家的地多谁家的水多，谁都写在明处。写在明处就少吵。"
 SUM_Neo_SGD.64.t:"水权的分配"
 SUM_Neo_SGD.64.d:"水按户分配，谁家的地多谁家的水多，谁都写在明处。写在明处就少吵。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGD.64.a:"以契约立信"
 SUM_Neo_SGD.64.b:"以枪杆立威"
 SUM_SGD_RA_City_Charter:"城邦宪章"
 SUM_SGD_RA_City_Charter_desc:"每座城立一份宪章，写明城里的公事由谁议、谁办、谁查。三件事分给三拨人。"
 SUM_Neo_SGD.65.t:"城邦宪章"
 SUM_Neo_SGD.65.d:"每座城立一份宪章，写明城里的公事由谁议、谁办、谁查。三件事分给三拨人。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGD.65.a:"把利润分给城邦"
 SUM_Neo_SGD.65.b:"把利润收归官库"
 SUM_SGD_RA_Council_Hall:"议事厅"
 SUM_SGD_RA_Council_Hall_desc:"议事厅是城里最结实的一座屋，门朝集市开，谁都能推门进去旁听。"
 SUM_Neo_SGD.66.t:"议事厅"
 SUM_Neo_SGD.66.d:"议事厅是城里最结实的一座屋，门朝集市开，谁都能推门进去旁听。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGD.66.a:"借水草养人"
 SUM_Neo_SGD.66.b:"借商队养兵"
 SUM_SGD_RA_Citizen_Roll:"民籍与册"
 SUM_SGD_RA_Citizen_Roll_desc:"把城里的人逐个登记，谁是本地谁是新来，一册可查。有了册子，赋税与兵役才说得清。"
 SUM_Neo_SGD.67.t:"民籍与册"
 SUM_Neo_SGD.67.d:"把城里的人逐个登记，谁是本地谁是新来，一册可查。有了册子，赋税与兵役才说得清。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGD.67.a:"让商路连通四方"
 SUM_Neo_SGD.67.b:"把商路关起来自守"
 SUM_SGD_RA_Guild_Charter:"行会特许"
 SUM_SGD_RA_Guild_Charter_desc:"各行业立行会，行会自己定行情与学徒的规矩，官署只管收税，不管行规。"
 SUM_Neo_SGD.68.t:"行会特许"
 SUM_Neo_SGD.68.d:"各行业立行会，行会自己定行情与学徒的规矩，官署只管收税，不管行规。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SGD.68.a:"以契约立信"
 SUM_Neo_SGD.68.b:"以枪杆立威"
 SUM_SGD_RA_Elected_Steward:"推举执事"
 SUM_SGD_RA_Elected_Steward_desc:"执事由城里推举，任三年，任满不得连任。推举的时候吵得凶，任上反倒安静。"
 SUM_Neo_SGD.69.t:"推举执事"
 SUM_Neo_SGD.69.d:"执事由城里推举，任三年，任满不得连任。推举的时候吵得凶，任上反倒安静。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGD.69.a:"把利润分给城邦"
 SUM_Neo_SGD.69.b:"把利润收归官库"
 SUM_SGD_RA_Fair_Toll:"公平税则"
 SUM_SGD_RA_Fair_Toll_desc:"税则写在一张牌上，立在城门口。过路的人先看牌再交钱，交多少自己算得出来。"
 SUM_Neo_SGD.70.t:"公平税则"
 SUM_Neo_SGD.70.d:"税则写在一张牌上，立在城门口。过路的人先看牌再交钱，交多少自己算得出来。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SGD.70.a:"借水草养人"
 SUM_Neo_SGD.70.b:"借商队养兵"
 SUM_SGD_RA_Open_Market:"开市通商"
 SUM_SGD_RA_Open_Market_desc:"集市不分内外，谁都能来摆摊。外邦的商队头一回来的时候将信将疑，第二回就带了整队货。"
 SUM_Neo_SGD.71.t:"开市通商"
 SUM_Neo_SGD.71.d:"集市不分内外，谁都能来摆摊。外邦的商队头一回来的时候将信将疑，第二回就带了整队货。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGD.71.a:"让商路连通四方"
 SUM_Neo_SGD.71.b:"把商路关起来自守"
 SUM_SGD_RA_Caravan_Insurance:"商队互保"
 SUM_SGD_RA_Caravan_Insurance_desc:"几支商队合出一笔保银，谁在路上出事就从这笔银子里赔。赔了几回之后，路上反而太平了。"
 SUM_Neo_SGD.72.t:"商队互保"
 SUM_Neo_SGD.72.d:"几支商队合出一笔保银，谁在路上出事就从这笔银子里赔。赔了几回之后，路上反而太平了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGD.72.a:"以契约立信"
 SUM_Neo_SGD.72.b:"以枪杆立威"
 SUM_SGD_RA_Mint_Oasis:"绿洲铸币"
 SUM_SGD_RA_Mint_Oasis_desc:"铸新钱，成色与重量都刻在钱边上。钱好使，是因为拿着的人信。"
 SUM_Neo_SGD.73.t:"绿洲铸币"
 SUM_Neo_SGD.73.d:"铸新钱，成色与重量都刻在钱边上。钱好使，是因为拿着的人信。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGD.73.a:"把利润分给城邦"
 SUM_Neo_SGD.73.b:"把利润收归官库"
 SUM_SGD_RA_Grand_Route:"通衢商路"
 SUM_SGD_RA_Grand_Route_desc:"把几条旧道连成一条通衢，沿途设驿站与井。走上这条路的人，一年里能多跑两趟。"
 SUM_Neo_SGD.74.t:"通衢商路"
 SUM_Neo_SGD.74.d:"把几条旧道连成一条通衢，沿途设驿站与井。走上这条路的人，一年里能多跑两趟。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGD.74.a:"借水草养人"
 SUM_Neo_SGD.74.b:"借商队养兵"
 SUM_SGD_RA_Academy_Oasis:"绿洲学馆"
 SUM_SGD_RA_Academy_Oasis_desc:"学馆教的是算术、地理与律例，来学的有城里的孩子，也有部族的少年。"
 SUM_Neo_SGD.75.t:"绿洲学馆"
 SUM_Neo_SGD.75.d:"学馆教的是算术、地理与律例，来学的有城里的孩子，也有部族的少年。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGD.75.a:"让商路连通四方"
 SUM_Neo_SGD.75.b:"把商路关起来自守"
 SUM_SGD_RA_Law_Code:"沙漠律例"
 SUM_SGD_RA_Law_Code_desc:"把各部各城的老规矩合成一部律例，合不拢的就先空着。空着的地方，将来再吵。"
 SUM_Neo_SGD.76.t:"沙漠律例"
 SUM_Neo_SGD.76.d:"把各部各城的老规矩合成一部律例，合不拢的就先空着。空着的地方，将来再吵。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。"
 SUM_Neo_SGD.76.a:"以契约立信"
 SUM_Neo_SGD.76.b:"以枪杆立威"
 SUM_SGD_RA_Circuit_Judge:"巡回法官"
 SUM_SGD_RA_Circuit_Judge_desc:"法官按季走遍各城，就地审案。判词要当着双方念，念完各不服也得各自回去。"
 SUM_Neo_SGD.77.t:"巡回法官"
 SUM_Neo_SGD.77.d:"法官按季走遍各城，就地审案。判词要当着双方念，念完各不服也得各自回去。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGD.77.a:"把利润分给城邦"
 SUM_Neo_SGD.77.b:"把利润收归官库"
 SUM_SGD_RA_Contracts_Archive:"契约存档"
 SUM_SGD_RA_Contracts_Archive_desc:"凡立大契的都要留一份底在存档处，日后有争执，取出来对一对便知。"
 SUM_Neo_SGD.78.t:"契约存档"
 SUM_Neo_SGD.78.d:"凡立大契的都要留一份底在存档处，日后有争执，取出来对一对便知。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGD.78.a:"借水草养人"
 SUM_Neo_SGD.78.b:"借商队养兵"
 SUM_SGD_RA_Scribes:"书记与学徒"
 SUM_SGD_RA_Scribes_desc:"书记在沙漠里是稀罕的行当，会写字的比会打仗的少。学馆里最抢手的一门课就是写字。"
 SUM_Neo_SGD.79.t:"书记与学徒"
 SUM_Neo_SGD.79.d:"书记在沙漠里是稀罕的行当，会写字的比会打仗的少。学馆里最抢手的一门课就是写字。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.79.a:"让商路连通四方"
 SUM_Neo_SGD.79.b:"把商路关起来自守"
 SUM_SGD_RA_Well_Pact:"共井之约"
 SUM_SGD_RA_Well_Pact_desc:"邻村邻城共用一口井的，立约写明轮流取水的时辰。约立得细，争水的事就少。"
 SUM_Neo_SGD.80.t:"共井之约"
 SUM_Neo_SGD.80.d:"邻村邻城共用一口井的，立约写明轮流取水的时辰。约立得细，争水的事就少。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGD.80.a:"以契约立信"
 SUM_Neo_SGD.80.b:"以枪杆立威"
 SUM_SGD_RA_Karez:"梯田与坎儿井"
 SUM_SGD_RA_Karez_desc:"把坡地开成梯田，把地下水用暗渠引来。庄稼比从前多种了一季，农人比从前多睡了一个时辰。"
 SUM_Neo_SGD.81.t:"梯田与坎儿井"
 SUM_Neo_SGD.81.d:"把坡地开成梯田，把地下水用暗渠引来。庄稼比从前多种了一季，农人比从前多睡了一个时辰。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SGD.81.a:"把利润分给城邦"
 SUM_Neo_SGD.81.b:"把利润收归官库"
 SUM_SGD_RA_Date_Harvest:"枣椰丰产"
 SUM_SGD_RA_Date_Harvest_desc:"枣椰是沙漠的粮也是糖，丰产的年景，市上的价钱能落三成。"
 SUM_Neo_SGD.82.t:"枣椰丰产"
 SUM_Neo_SGD.82.d:"枣椰是沙漠的粮也是糖，丰产的年景，市上的价钱能落三成。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGD.82.a:"借水草养人"
 SUM_Neo_SGD.82.b:"借商队养兵"
 SUM_SGD_RA_Rotation:"草场轮牧"
 SUM_SGD_RA_Rotation_desc:"草场分片轮着放，牧场主们把日子排好。排好的日子写在木牌上，挂在羊圈的门口。"
 SUM_Neo_SGD.83.t:"草场轮牧"
 SUM_Neo_SGD.83.d:"草场分片轮着放，牧场主们把日子排好。排好的日子写在木牌上，挂在羊圈的门口。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGD.83.a:"让商路连通四方"
 SUM_Neo_SGD.83.b:"把商路关起来自守"
 SUM_SGD_RA_Granary:"常平仓"
 SUM_SGD_RA_Granary_desc:"丰年买粮存进仓，荒年开仓平粜。仓里存的不只是粮，是人心。"
 SUM_Neo_SGD.84.t:"常平仓"
 SUM_Neo_SGD.84.d:"丰年买粮存进仓，荒年开仓平粜。仓里存的不只是粮，是人心。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGD.84.a:"以契约立信"
 SUM_Neo_SGD.84.b:"以枪杆立威"
 SUM_SGD_RA_Militia_Law:"乡兵之法"
 SUM_SGD_RA_Militia_Law_desc:"每城每族出丁，平时务农，战时集合。兵器自备，粮从公出。"
 SUM_Neo_SGD.85.t:"乡兵之法"
 SUM_Neo_SGD.85.d:"每城每族出丁，平时务农，战时集合。兵器自备，粮从公出。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGD.85.a:"把利润分给城邦"
 SUM_Neo_SGD.85.b:"把利润收归官库"
 SUM_SGD_RA_Oasis_Wall:"守绿洲的长墙"
 SUM_SGD_RA_Oasis_Wall_desc:"沿绿洲外缘垒一道低墙，挡住流沙也挡住散骑。墙不高，够用就行。"
 SUM_Neo_SGD.86.t:"守绿洲的长墙"
 SUM_Neo_SGD.86.d:"沿绿洲外缘垒一道低墙，挡住流沙也挡住散骑。墙不高，够用就行。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGD.86.a:"借水草养人"
 SUM_Neo_SGD.86.b:"借商队养兵"
 SUM_SGD_RA_Watchtower:"望楼"
 SUM_SGD_RA_Watchtower_desc:"几里一座望楼，白天举旗，夜里举火。消息传得比马快。"
 SUM_Neo_SGD.87.t:"望楼"
 SUM_Neo_SGD.87.d:"几里一座望楼，白天举旗，夜里举火。消息传得比马快。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。"
 SUM_Neo_SGD.87.a:"让商路连通四方"
 SUM_Neo_SGD.87.b:"把商路关起来自守"
 SUM_SGD_RA_Route_Patrol:"商道巡防"
 SUM_SGD_RA_Route_Patrol_desc:"巡防队专护商路，遇劫则追。追得凶了，劫道的就改行去种地。"
 SUM_Neo_SGD.88.t:"商道巡防"
 SUM_Neo_SGD.88.d:"巡防队专护商路，遇劫则追。追得凶了，劫道的就改行去种地。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGD.88.a:"以契约立信"
 SUM_Neo_SGD.88.b:"以枪杆立威"
 SUM_SGD_RA_Peace_Guard:"治安队"
 SUM_SGD_RA_Peace_Guard_desc:"城里的治安队由本城人充任，抓的是偷抢，不是议论。"
 SUM_Neo_SGD.89.t:"治安队"
 SUM_Neo_SGD.89.d:"城里的治安队由本城人充任，抓的是偷抢，不是议论。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SGD.89.a:"把利润分给城邦"
 SUM_Neo_SGD.89.b:"把利润收归官库"
 SUM_SGD_RA_Republic_Stands:"绿洲共和既立"
 SUM_SGD_RA_Republic_Stands_desc:"各城的执事在同一份宪章上按了手印，绿洲的水按户分，商路上的税按牌收，法官按季巡。沙漠第一次是靠一叠写得清清楚楚的纸。"
 SUM_Neo_SGD.90.t:"绿洲共和既立"
 SUM_Neo_SGD.90.d:"各城的执事在同一份宪章上按了手印，绿洲的水按户分，商路上的税按牌收，法官按季巡。沙漠第一次是靠一叠写得清清楚楚的纸。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。沙丘上的路标也是新的。"
 SUM_Neo_SGD.90.a:"借水草养人"
 SUM_Neo_SGD.90.b:"借商队养兵"

 #### 乙线 · 旅团公议 ####
 SUM_SGD_RB_The_Eremite_Council:"旅团公议"
 SUM_SGD_RB_The_Eremite_Council_desc:"另一条路把沙漠交给旅团与部族共管：契约归公，水源归公，打仗的活由旅团接下。有人把这叫佣兵的国，也有人把这叫没有主子的国。"
 SUM_Neo_SGD.91.t:"旅团公议"
 SUM_Neo_SGD.91.d:"另一条路把沙漠交给旅团与部族共管：契约归公，水源归公，打仗的活由旅团接下。有人把这叫佣兵的国，也有人把这叫没有主子的国。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGD.91.a:"把土地分给部族"
 SUM_Neo_SGD.91.b:"把土地归入官仓"
 SUM_SGD_RB_Merger:"旅团合流"
 SUM_SGD_RB_Merger_desc:"几支大旅团把名号并成一个，账目合一。并入的那天，各团把旧旗折起来收进了箱子。"
 SUM_Neo_SGD.92.t:"旅团合流"
 SUM_Neo_SGD.92.d:"几支大旅团把名号并成一个，账目合一。并入的那天，各团把旧旗折起来收进了箱子。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGD.92.a:"推举公议的执事"
 SUM_Neo_SGD.92.b:"沿用旧日的长老"
 SUM_SGD_RB_Public_Ledger:"公账公开"
 SUM_SGD_RB_Public_Ledger_desc:"团里的钱进多少出多少，按月贴在营门口。起初有人嫌丢人，后来发现这样反倒好借钱。"
 SUM_Neo_SGD.93.t:"公账公开"
 SUM_Neo_SGD.93.d:"团里的钱进多少出多少，按月贴在营门口。起初有人嫌丢人，后来发现这样反倒好借钱。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGD.93.a:"让花神的誓约作证"
 SUM_Neo_SGD.93.b:"让官署的法度作证"
 SUM_SGD_RB_Rank_By_Merit:"以功定阶"
 SUM_SGD_RB_Rank_By_Merit_desc:"队里的位子按功劳排，不看出身。这一条得罪了不少老人，也招来了不少年轻人。"
 SUM_Neo_SGD.94.t:"以功定阶"
 SUM_Neo_SGD.94.d:"队里的位子按功劳排，不看出身。这一条得罪了不少老人，也招来了不少年轻人。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGD.94.a:"与雨林互通有无"
 SUM_Neo_SGD.94.b:"与雨林划清界限"
 SUM_SGD_RB_Veteran_Pension:"老卒的抚恤"
 SUM_SGD_RB_Veteran_Pension_desc:"打不动的老卒退下来有一份抚恤，按月发。这份钱换来的东西，比金子值钱。"
 SUM_Neo_SGD.95.t:"老卒的抚恤"
 SUM_Neo_SGD.95.d:"打不动的老卒退下来有一份抚恤，按月发。这份钱换来的东西，比金子值钱。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SGD.95.a:"把土地分给部族"
 SUM_Neo_SGD.95.b:"把土地归入官仓"
 SUM_SGD_RB_Eremite_Charter:"旅团章程"
 SUM_SGD_RB_Eremite_Charter_desc:"章程写明三条：不劫商队、不掠村庄、不弃同伴。违了的，逐出并退赔。"
 SUM_Neo_SGD.96.t:"旅团章程"
 SUM_Neo_SGD.96.d:"章程写明三条：不劫商队、不掠村庄、不弃同伴。违了的，逐出并退赔。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGD.96.a:"推举公议的执事"
 SUM_Neo_SGD.96.b:"沿用旧日的长老"
 SUM_SGD_RB_Common_Land:"土地归部"
 SUM_SGD_RB_Common_Land_desc:"把官署名下的地分回各部，部里再按人头分到户。分地那几天，沙丘边上的火塘没熄过。"
 SUM_Neo_SGD.97.t:"土地归部"
 SUM_Neo_SGD.97.d:"把官署名下的地分回各部，部里再按人头分到户。分地那几天，沙丘边上的火塘没熄过。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGD.97.a:"让花神的誓约作证"
 SUM_Neo_SGD.97.b:"让官署的法度作证"
 SUM_SGD_RB_Water_Commons:"水源归公"
 SUM_SGD_RB_Water_Commons_desc:"水井与绿洲不再归任何一家，取水按人。这条规矩是各部吵了七天才吵出来的。"
 SUM_Neo_SGD.98.t:"水源归公"
 SUM_Neo_SGD.98.d:"水井与绿洲不再归任何一家，取水按人。这条规矩是各部吵了七天才吵出来的。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGD.98.a:"与雨林互通有无"
 SUM_Neo_SGD.98.b:"与雨林划清界限"
 SUM_SGD_RB_Grain_Store:"部族的公仓"
 SUM_SGD_RB_Grain_Store_desc:"各部出自己的余粮存进公仓，荒年按口分。存进去的时候有人嘀咕，取出来的时候没人说话。"
 SUM_Neo_SGD.99.t:"部族的公仓"
 SUM_Neo_SGD.99.d:"各部出自己的余粮存进公仓，荒年按口分。存进去的时候有人嘀咕，取出来的时候没人说话。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGD.99.a:"把土地分给部族"
 SUM_Neo_SGD.99.b:"把土地归入官仓"
 SUM_SGD_RB_Craft_Collective:"匠户合工"
 SUM_SGD_RB_Craft_Collective_desc:"铁匠、织工、制盐的合在一处做工，工钱按件算，工具归公。"
 SUM_Neo_SGD.100.t:"匠户合工"
 SUM_Neo_SGD.100.d:"铁匠、织工、制盐的合在一处做工，工钱按件算，工具归公。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGD.100.a:"推举公议的执事"
 SUM_Neo_SGD.100.b:"沿用旧日的长老"
 SUM_SGD_RB_Elder_Recall:"长老可罢"
 SUM_SGD_RB_Elder_Recall_desc:"长老若犯了众怒，部众可以当众罢免。这一条写进盟约的时候，几个老长老的脸都沉了。"
 SUM_Neo_SGD.101.t:"长老可罢"
 SUM_Neo_SGD.101.d:"长老若犯了众怒，部众可以当众罢免。这一条写进盟约的时候，几个老长老的脸都沉了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGD.101.a:"让花神的誓约作证"
 SUM_Neo_SGD.101.b:"让官署的法度作证"
 SUM_SGD_RB_Deshret_Oath:"赤王的旧誓"
 SUM_SGD_RB_Deshret_Oath_desc:"赤王当年许过沙漠人一件事：不求神也能活。这句旧誓被人重新翻出来，念给新立的盟约听。"
 SUM_Neo_SGD.102.t:"赤王的旧誓"
 SUM_Neo_SGD.102.d:"赤王当年许过沙漠人一件事：不求神也能活。这句旧誓被人重新翻出来，念给新立的盟约听。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGD.102.a:"与雨林互通有无"
 SUM_Neo_SGD.102.b:"与雨林划清界限"
 SUM_SGD_RB_Pilgrim_Road:"朝圣之路"
 SUM_SGD_RB_Pilgrim_Road_desc:"去遗迹的路被重新走通，路边的井有人打理。走这条路的人不为拜神，为的是认一认自己从哪来。"
 SUM_Neo_SGD.103.t:"朝圣之路"
 SUM_Neo_SGD.103.d:"去遗迹的路被重新走通，路边的井有人打理。走这条路的人不为拜神，为的是认一认自己从哪来。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGD.103.a:"把土地分给部族"
 SUM_Neo_SGD.103.b:"把土地归入官仓"
 SUM_SGD_RB_Scarlet_Rite:"赤沙之礼"
 SUM_SGD_RB_Scarlet_Rite_desc:"每年在沙里办一场仪式，是给旧年王者的，也是给这一代人的。仪式不长，办完就散。"
 SUM_Neo_SGD.104.t:"赤沙之礼"
 SUM_Neo_SGD.104.d:"每年在沙里办一场仪式，是给旧年王者的，也是给这一代人的。仪式不长，办完就散。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGD.104.a:"推举公议的执事"
 SUM_Neo_SGD.104.b:"沿用旧日的长老"
 SUM_SGD_RB_Relics_Kept:"遗物入册"
 SUM_SGD_RB_Relics_Kept_desc:"从遗迹里出来的东西一律入册，谁挖的、挖在哪、归谁看，都写清楚，免得有人拿它去换钱。"
 SUM_Neo_SGD.105.t:"遗物入册"
 SUM_Neo_SGD.105.d:"从遗迹里出来的东西一律入册，谁挖的、挖在哪、归谁看，都写清楚，免得有人拿它去换钱。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGD.105.a:"让花神的誓约作证"
 SUM_Neo_SGD.105.b:"让官署的法度作证"
 SUM_SGD_RB_Song_of_Sand:"沙海的诗"
 SUM_SGD_RB_Song_of_Sand_desc:"有人把这几十年的事编成诗，在篝火边传唱。诗里没有英雄，只有活下来的人。"
 SUM_Neo_SGD.106.t:"沙海的诗"
 SUM_Neo_SGD.106.d:"有人把这几十年的事编成诗，在篝火边传唱。诗里没有英雄，只有活下来的人。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGD.106.a:"与雨林互通有无"
 SUM_Neo_SGD.106.b:"与雨林划清界限"
 SUM_SGD_RB_Ore_Pit:"开矿取铁"
 SUM_SGD_RB_Ore_Pit_desc:"山里开了几处矿，出的是铁与铜。矿是公的，下矿的按班轮值，工钱按月结。"
 SUM_Neo_SGD.107.t:"开矿取铁"
 SUM_Neo_SGD.107.d:"山里开了几处矿，出的是铁与铜。矿是公的，下矿的按班轮值，工钱按月结。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGD.107.a:"把土地分给部族"
 SUM_Neo_SGD.107.b:"把土地归入官仓"
 SUM_SGD_RB_Smith_Public:"公营铁坊"
 SUM_SGD_RB_Smith_Public_desc:"铁坊归公，农具与兵器都从这儿出。坊里的师傅带徒弟，徒弟学成不必外流。"
 SUM_Neo_SGD.108.t:"公营铁坊"
 SUM_Neo_SGD.108.d:"铁坊归公，农具与兵器都从这儿出。坊里的师傅带徒弟，徒弟学成不必外流。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGD.108.a:"推举公议的执事"
 SUM_Neo_SGD.108.b:"沿用旧日的长老"
 SUM_SGD_RB_Salt_Works:"盐场"
 SUM_SGD_RB_Salt_Works_desc:"盐场晒的是盐，也是钱。盐价由公议定，不许囤积。"
 SUM_Neo_SGD.109.t:"盐场"
 SUM_Neo_SGD.109.d:"盐场晒的是盐，也是钱。盐价由公议定，不许囤积。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGD.109.a:"让花神的誓约作证"
 SUM_Neo_SGD.109.b:"让官署的法度作证"
 SUM_SGD_RB_Cloth_Loom:"织造"
 SUM_SGD_RB_Cloth_Loom_desc:"沙漠的织工把羊毛与驼绒织成布，厚实耐穿，远销外邦。"
 SUM_Neo_SGD.110.t:"织造"
 SUM_Neo_SGD.110.d:"沙漠的织工把羊毛与驼绒织成布，厚实耐穿，远销外邦。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGD.110.a:"与雨林互通有无"
 SUM_Neo_SGD.110.b:"与雨林划清界限"
 SUM_SGD_RB_Tool_Share:"农具共享"
 SUM_SGD_RB_Tool_Share_desc:"大件的农具由公仓统一管，哪家要用去登记。省下来的钱，够添几头牲口。"
 SUM_Neo_SGD.111.t:"农具共享"
 SUM_Neo_SGD.111.d:"大件的农具由公仓统一管，哪家要用去登记。省下来的钱，够添几头牲口。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGD.111.a:"把土地分给部族"
 SUM_Neo_SGD.111.b:"把土地归入官仓"
 SUM_SGD_RB_Levy_System:"轮值之制"
 SUM_SGD_RB_Levy_System_desc:"各家出丁轮值，一轮半年，值完回家。轮值的人有粮有饷，家里的地有人代种。"
 SUM_Neo_SGD.112.t:"轮值之制"
 SUM_Neo_SGD.112.d:"各家出丁轮值，一轮半年，值完回家。轮值的人有粮有饷，家里的地有人代种。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGD.112.a:"推举公议的执事"
 SUM_Neo_SGD.112.b:"沿用旧日的长老"
 SUM_SGD_RB_Sand_Ranger:"沙海游骑"
 SUM_SGD_RB_Sand_Ranger_desc:"游骑不带辎重，走的是商队不走的路，打的是快进快出。"
 SUM_Neo_SGD.113.t:"沙海游骑"
 SUM_Neo_SGD.113.d:"游骑不带辎重，走的是商队不走的路，打的是快进快出。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGD.113.a:"让花神的誓约作证"
 SUM_Neo_SGD.113.b:"让官署的法度作证"
 SUM_SGD_RB_Siege_Hand:"攻坚人手"
 SUM_SGD_RB_Siege_Hand_desc:"沙漠少攻坚，多袭扰。真到了要攻克关隘的时候，就得凑一支专干这活的人手。"
 SUM_Neo_SGD.114.t:"攻坚人手"
 SUM_Neo_SGD.114.d:"沙漠少攻坚，多袭扰。真到了要攻克关隘的时候，就得凑一支专干这活的人手。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.114.a:"与雨林互通有无"
 SUM_Neo_SGD.114.b:"与雨林划清界限"
 SUM_SGD_RB_Field_Kitchen:"行军灶"
 SUM_SGD_RB_Field_Kitchen_desc:"行军灶做不出好饭，但一定要准时。吃上热食的队伍，走的路比别人远。"
 SUM_Neo_SGD.115.t:"行军灶"
 SUM_Neo_SGD.115.d:"行军灶做不出好饭，但一定要准时。吃上热食的队伍，走的路比别人远。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SGD.115.a:"把土地分给部族"
 SUM_Neo_SGD.115.b:"把土地归入官仓"
 SUM_SGD_RB_Wounded_Tent:"伤兵帐"
 SUM_SGD_RB_Wounded_Tent_desc:"伤兵帐里管的是止血与接骨，管不了的就送回去。能救一个是一个。"
 SUM_Neo_SGD.116.t:"伤兵帐"
 SUM_Neo_SGD.116.d:"伤兵帐里管的是止血与接骨，管不了的就送回去。能救一个是一个。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGD.116.a:"推举公议的执事"
 SUM_Neo_SGD.116.b:"沿用旧日的长老"
 SUM_SGD_RB_Recognize:"求列邦承认"
 SUM_SGD_RB_Recognize_desc:"使节带着盟约的抄本四处登门，要的只是一句话：承认沙漠自己管自己。"
 SUM_Neo_SGD.117.t:"求列邦承认"
 SUM_Neo_SGD.117.d:"使节带着盟约的抄本四处登门，要的只是一句话：承认沙漠自己管自己。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGD.117.a:"让花神的誓约作证"
 SUM_Neo_SGD.117.b:"让官署的法度作证"
 SUM_SGD_RB_Trade_Treaty:"通商条约"
 SUM_SGD_RB_Trade_Treaty_desc:"与外邦通商而立约，约里写清税则与护侨，不写别的。"
 SUM_Neo_SGD.118.t:"通商条约"
 SUM_Neo_SGD.118.d:"与外邦通商而立约，约里写清税则与护侨，不写别的。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGD.118.a:"与雨林互通有无"
 SUM_Neo_SGD.118.b:"与雨林划清界限"
 SUM_SGD_RB_Hire_Out:"佣兵外派"
 SUM_SGD_RB_Hire_Out_desc:"旅团接外邦的活，打的是别处的仗，挣的是本地的粮。这一条让不少长老皱眉。"
 SUM_Neo_SGD.119.t:"佣兵外派"
 SUM_Neo_SGD.119.d:"旅团接外邦的活，打的是别处的仗，挣的是本地的粮。这一条让不少长老皱眉。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGD.119.a:"把土地分给部族"
 SUM_Neo_SGD.119.b:"把土地归入官仓"
 SUM_SGD_RB_Border_Talk:"边界磋商"
 SUM_SGD_RB_Border_Talk_desc:"与邻邦磋商边界，一里一里地谈，谈不拢就先搁着，搁着也不动兵。"
 SUM_Neo_SGD.120.t:"边界磋商"
 SUM_Neo_SGD.120.d:"与邻邦磋商边界，一里一里地谈，谈不拢就先搁着，搁着也不动兵。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SGD.120.a:"推举公议的执事"
 SUM_Neo_SGD.120.b:"沿用旧日的长老"
 SUM_SGD_RB_Rainforest_Delegation:"雨林的门"
 SUM_SGD_RB_Rainforest_Delegation_desc:"对雨林还是留着一扇门，派去的人带着商约，也带着刀。门开多大，看对面怎么接。"
 SUM_Neo_SGD.121.t:"雨林的门"
 SUM_Neo_SGD.121.d:"对雨林还是留着一扇门，派去的人带着商约，也带着刀。门开多大，看对面怎么接。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGD.121.a:"让花神的誓约作证"
 SUM_Neo_SGD.121.b:"让官署的法度作证"
 SUM_SGD_RB_Commune:"旅团公议之世"
 SUM_SGD_RB_Commune_desc:"沙漠的公事如今由两部人管：一部管水与地，一部管契约与兵。两部的人在同一张长桌上坐着，桌角刻着一条规矩，是当年神王之遗的案底被一把火烧掉之后才刻上的。"
 SUM_Neo_SGD.122.t:"旅团公议之世"
 SUM_Neo_SGD.122.d:"沙漠的公事如今由两部人管：一部管水与地，一部管契约与兵。两部的人在同一张长桌上坐着，桌角刻着一条规矩，是当年神王之遗的案底被一把火烧掉之后才刻上的。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGD.122.a:"与雨林互通有无"
 SUM_Neo_SGD.122.b:"与雨林划清界限"
 SUM_SGD_RB_Oath_of_Floral_King:"花神与赤王同誓"
 SUM_SGD_RB_Oath_of_Floral_King_desc:"沙漠的旧神没有走，只是被埋在沙里太久。如今赤王的旧誓与花神的旧盟被人一并翻出来，刻在同一块石板上，立在绿洲的泉边。从此沙漠的规矩里，多了一条与神无关、与人有关的道理。"
 SUM_Neo_SGD.123.t:"花神与赤王同誓"
 SUM_Neo_SGD.123.d:"沙漠的旧神没有走，只是被埋在沙里太久。如今赤王的旧誓与花神的旧盟被人一并翻出来，刻在同一块石板上，立在绿洲的泉边。从此沙漠的规矩里，多了一条与神无关、与人有关的道理。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGD.123.a:"把土地分给部族"
 SUM_Neo_SGD.123.b:"把土地归入官仓"

 #### 丙线 · 赤王复兴 ####
 SUM_SGD_RC_The_Return_of_the_Red_King:"赤王的旗"
 SUM_SGD_RC_The_Return_of_the_Red_King_desc:"第三条路主张把沙漠重新捏成一个有力的整体：立王统、修神庙、整军伍、开遗迹。走这条路的人说，沙漠吃过太多散的亏，散着就永远受欺。"
 SUM_Neo_SGD.124.t:"赤王的旗"
 SUM_Neo_SGD.124.d:"第三条路主张把沙漠重新捏成一个有力的整体：立王统、修神庙、整军伍、开遗迹。走这条路的人说，沙漠吃过太多散的亏，散着就永远受欺。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGD.124.a:"重立赤王的旧制"
 SUM_Neo_SGD.124.b:"重建城邦的议会"
 SUM_SGD_RC_Royal_Line:"溯王统"
 SUM_SGD_RC_Royal_Line_desc:"把沙漠历代王室的血脉理了一遍，理到最后，能继的一支只剩下旁系。旁系也是系。"
 SUM_Neo_SGD.125.t:"溯王统"
 SUM_Neo_SGD.125.d:"把沙漠历代王室的血脉理了一遍，理到最后，能继的一支只剩下旁系。旁系也是系。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGD.125.a:"召集能战之众"
 SUM_Neo_SGD.125.b:"召集能谋之士"
 SUM_SGD_RC_Coronation:"加冕"
 SUM_SGD_RC_Coronation_desc:"加冕在旧王城的遗址办，冠是照着壁画新打的，重得压脖子。戴上去的人，从此不能再说自己是普通人。"
 SUM_Neo_SGD.126.t:"加冕"
 SUM_Neo_SGD.126.d:"加冕在旧王城的遗址办，冠是照着壁画新打的，重得压脖子。戴上去的人，从此不能再说自己是普通人。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGD.126.a:"以神权号令沙漠"
 SUM_Neo_SGD.126.b:"以律法约束诸城"
 SUM_SGD_RC_Court_Order:"朝仪"
 SUM_SGD_RC_Court_Order_desc:"重立朝仪，谁站在哪一级台阶上都有定规。定规立起来，人心反而定了。"
 SUM_Neo_SGD.127.t:"朝仪"
 SUM_Neo_SGD.127.d:"重立朝仪，谁站在哪一级台阶上都有定规。定规立起来，人心反而定了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGD.127.a:"把遗迹挖开"
 SUM_Neo_SGD.127.b:"把遗迹封回去"
 SUM_SGD_RC_Council_Narrow:"缩议政"
 SUM_SGD_RC_Council_Narrow_desc:"议政的席位从几十个缩到九个，说话能算数的人少了，事情办得快了。"
 SUM_Neo_SGD.128.t:"缩议政"
 SUM_Neo_SGD.128.d:"议政的席位从几十个缩到九个，说话能算数的人少了，事情办得快了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SGD.128.a:"重立赤王的旧制"
 SUM_Neo_SGD.128.b:"重建城邦的议会"
 SUM_SGD_RC_Succession_Law:"王位之法"
 SUM_SGD_RC_Succession_Law_desc:"定下继位的规矩，免得日后又为了这个打成一团。规矩写得死板，死板才管得住人。"
 SUM_Neo_SGD.129.t:"王位之法"
 SUM_Neo_SGD.129.d:"定下继位的规矩，免得日后又为了这个打成一团。规矩写得死板，死板才管得住人。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGD.129.a:"召集能战之众"
 SUM_Neo_SGD.129.b:"召集能谋之士"
 SUM_SGD_RC_Rebuild_Temple:"重修仙庙"
 SUM_SGD_RC_Rebuild_Temple_desc:"把塌了的庙一处处修回去，壁画照旧，香火照旧。修庙的人比拜庙的人多。"
 SUM_Neo_SGD.130.t:"重修仙庙"
 SUM_Neo_SGD.130.d:"把塌了的庙一处处修回去，壁画照旧，香火照旧。修庙的人比拜庙的人多。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGD.130.a:"以神权号令沙漠"
 SUM_Neo_SGD.130.b:"以律法约束诸城"
 SUM_SGD_RC_Priest_Order:"祭司之序"
 SUM_SGD_RC_Priest_Order_desc:"祭司按序受职，序由官府定。神是旧的神，管神的人是新的人。"
 SUM_Neo_SGD.131.t:"祭司之序"
 SUM_Neo_SGD.131.d:"祭司按序受职，序由官府定。神是旧的神，管神的人是新的人。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGD.131.a:"把遗迹挖开"
 SUM_Neo_SGD.131.b:"把遗迹封回去"
 SUM_SGD_RC_Deshret_Rite:"赤王之祀"
 SUM_SGD_RC_Deshret_Rite_desc:"重办赤王的祭礼，礼在沙里办，供的是旧日王者的威名，也是今人的胆气。"
 SUM_Neo_SGD.132.t:"赤王之祀"
 SUM_Neo_SGD.132.d:"重办赤王的祭礼，礼在沙里办，供的是旧日王者的威名，也是今人的胆气。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。祭坛的火到天亮才灭。"
 SUM_Neo_SGD.132.a:"重立赤王的旧制"
 SUM_Neo_SGD.132.b:"重建城邦的议会"
 SUM_SGD_RC_Floral_Shrine:"花神之龛"
 SUM_SGD_RC_Floral_Shrine_desc:"花神的信众不断绝，官府就替他们立龛，只是龛前要多一站一个官。"
 SUM_Neo_SGD.133.t:"花神之龛"
 SUM_Neo_SGD.133.d:"花神的信众不断绝，官府就替他们立龛，只是龛前要多一站一个官。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGD.133.a:"召集能战之众"
 SUM_Neo_SGD.133.b:"召集能谋之士"
 SUM_SGD_RC_Pilgrim_Guard:"护法队"
 SUM_SGD_RC_Pilgrim_Guard_desc:"朝圣路上派护法队，护的不只是香客，还有沿路的税卡。"
 SUM_Neo_SGD.134.t:"护法队"
 SUM_Neo_SGD.134.d:"朝圣路上派护法队，护的不只是香客，还有沿路的税卡。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGD.134.a:"以神权号令沙漠"
 SUM_Neo_SGD.134.b:"以律法约束诸城"
 SUM_SGD_RC_Army_Reform:"整军"
 SUM_SGD_RC_Army_Reform_desc:"把各部各团的兵编成一支军，旗号、号令、粮饷都统一。编掉的那些老队，心里不服，手上也得听。"
 SUM_Neo_SGD.135.t:"整军"
 SUM_Neo_SGD.135.d:"把各部各团的兵编成一支军，旗号、号令、粮饷都统一。编掉的那些老队，心里不服，手上也得听。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SGD.135.a:"把遗迹挖开"
 SUM_Neo_SGD.135.b:"把遗迹封回去"
 SUM_SGD_RC_Staff_College:"设军师府"
 SUM_SGD_RC_Staff_College_desc:"军师府管谋划与粮道，不直接带兵。带兵与谋划分开，谁也翻不了天。"
 SUM_Neo_SGD.136.t:"设军师府"
 SUM_Neo_SGD.136.d:"军师府管谋划与粮道，不直接带兵。带兵与谋划分开，谁也翻不了天。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SGD.136.a:"重立赤王的旧制"
 SUM_Neo_SGD.136.b:"重建城邦的议会"
 SUM_SGD_RC_Garrison_All:"遍设戍所"
 SUM_SGD_RC_Garrison_All_desc:"城城设戍所，街街有岗。戍所设起来之后，夜里行路的人少了。"
 SUM_Neo_SGD.137.t:"遍设戍所"
 SUM_Neo_SGD.137.d:"城城设戍所，街街有岗。戍所设起来之后，夜里行路的人少了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGD.137.a:"召集能战之众"
 SUM_Neo_SGD.137.b:"召集能谋之士"
 SUM_SGD_RC_Conscription:"征兵法"
 SUM_SGD_RC_Conscription_desc:"凡成丁者皆有服役之责，服役期满可以回家。法一立，各家藏着不算成丁的人。"
 SUM_Neo_SGD.138.t:"征兵法"
 SUM_Neo_SGD.138.d:"凡成丁者皆有服役之责，服役期满可以回家。法一立，各家藏着不算成丁的人。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGD.138.a:"以神权号令沙漠"
 SUM_Neo_SGD.138.b:"以律法约束诸城"
 SUM_SGD_RC_Purge_Soft:"清队"
 SUM_SGD_RC_Purge_Soft_desc:"把军里不听话的几支清了，清出去的没有罪状，只有一句不合适。"
 SUM_Neo_SGD.139.t:"清队"
 SUM_Neo_SGD.139.d:"把军里不听话的几支清了，清出去的没有罪状，只有一句不合适。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGD.139.a:"把遗迹挖开"
 SUM_Neo_SGD.139.b:"把遗迹封回去"
 SUM_SGD_RC_Dig_More:"重开遗迹"
 SUM_SGD_RC_Dig_More_desc:"把封了的遗迹重新挖开，挖出的是铜与石，也是一堆谁也说不清的东西。"
 SUM_Neo_SGD.140.t:"重开遗迹"
 SUM_Neo_SGD.140.d:"把封了的遗迹重新挖开，挖出的是铜与石，也是一堆谁也说不清的东西。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGD.140.a:"重立赤王的旧制"
 SUM_Neo_SGD.140.b:"重建城邦的议会"
 SUM_SGD_RC_Great_Works:"兴土木"
 SUM_SGD_RC_Great_Works_desc:"在旧王城边上起一片新的宫室，用的石料从遗迹里拆。拆旧盖新，是沙漠的老手艺。"
 SUM_Neo_SGD.141.t:"兴土木"
 SUM_Neo_SGD.141.d:"在旧王城边上起一片新的宫室，用的石料从遗迹里拆。拆旧盖新，是沙漠的老手艺。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SGD.141.a:"召集能战之众"
 SUM_Neo_SGD.141.b:"召集能谋之士"
 SUM_SGD_RC_Relic_Armory:"遗物军械"
 SUM_SGD_RC_Relic_Armory_desc:"遗迹里出来的机关与构装拆开研究，能用的就装到军里。"
 SUM_Neo_SGD.142.t:"遗物军械"
 SUM_Neo_SGD.142.d:"遗迹里出来的机关与构装拆开研究，能用的就装到军里。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.142.a:"以神权号令沙漠"
 SUM_Neo_SGD.142.b:"以律法约束诸城"
 SUM_SGD_RC_Slab_Script:"释读石板"
 SUM_SGD_RC_Slab_Script_desc:"召集识字的人释读石板，读出来的字凑不成句，凑出来的几句都像预言。"
 SUM_Neo_SGD.143.t:"释读石板"
 SUM_Neo_SGD.143.d:"召集识字的人释读石板，读出来的字凑不成句，凑出来的几句都像预言。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGD.143.a:"把遗迹挖开"
 SUM_Neo_SGD.143.b:"把遗迹封回去"
 SUM_SGD_RC_Canal_King:"王渠"
 SUM_SGD_RC_Canal_King_desc:"沿旧渠的走向重开一条王渠，渠成之后，中部的荒原也能住人。"
 SUM_Neo_SGD.144.t:"王渠"
 SUM_Neo_SGD.144.d:"沿旧渠的走向重开一条王渠，渠成之后，中部的荒原也能住人。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGD.144.a:"重立赤王的旧制"
 SUM_Neo_SGD.144.b:"重建城邦的议会"
 SUM_SGD_RC_Camel_Heavy:"重装驼骑"
 SUM_SGD_RC_Camel_Heavy_desc:"给驼骑加甲，慢是慢了些，冲起来的时候挡不住。"
 SUM_Neo_SGD.145.t:"重装驼骑"
 SUM_Neo_SGD.145.d:"给驼骑加甲，慢是慢了些，冲起来的时候挡不住。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGD.145.a:"召集能战之众"
 SUM_Neo_SGD.145.b:"召集能谋之士"
 SUM_SGD_RC_Sandstorm_Banner:"沙暴旗下的军团"
 SUM_SGD_RC_Sandstorm_Banner_desc:"选一批耐风沙的人编成军团，专挑沙暴天出击。风是他们的城墙。"
 SUM_Neo_SGD.146.t:"沙暴旗下的军团"
 SUM_Neo_SGD.146.d:"选一批耐风沙的人编成军团，专挑沙暴天出击。风是他们的城墙。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGD.146.a:"以神权号令沙漠"
 SUM_Neo_SGD.146.b:"以律法约束诸城"
 SUM_SGD_RC_Fort_Chain:"堡垒链"
 SUM_SGD_RC_Fort_Chain_desc:"沿边修一串堡垒，堡与堡之间骑兵一日可达，前线就成了线。"
 SUM_Neo_SGD.147.t:"堡垒链"
 SUM_Neo_SGD.147.d:"沿边修一串堡垒，堡与堡之间骑兵一日可达，前线就成了线。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SGD.147.a:"把遗迹挖开"
 SUM_Neo_SGD.147.b:"把遗迹封回去"
 SUM_SGD_RC_Weapon_Works:"军械监"
 SUM_SGD_RC_Weapon_Works_desc:"设军械监，专管造兵器。监里的匠人比官还横，因为没有他们，军就是空的。"
 SUM_Neo_SGD.148.t:"军械监"
 SUM_Neo_SGD.148.d:"设军械监，专管造兵器。监里的匠人比官还横，因为没有他们，军就是空的。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SGD.148.a:"重立赤王的旧制"
 SUM_Neo_SGD.148.b:"重建城邦的议会"
 SUM_SGD_RC_War_Chest:"军费库"
 SUM_SGD_RC_War_Chest_desc:"单设一座军费库，钱只进不出，动这笔钱要三个人同时开口。"
 SUM_Neo_SGD.149.t:"军费库"
 SUM_Neo_SGD.149.d:"单设一座军费库，钱只进不出，动这笔钱要三个人同时开口。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。"
 SUM_Neo_SGD.149.a:"召集能战之众"
 SUM_Neo_SGD.149.b:"召集能谋之士"
 SUM_SGD_RC_Old_Order:"旧制照行"
 SUM_SGD_RC_Old_Order_desc:"有人主张照旧例行事：该交的交，该办的办，只是账本换个封皮。这样的人在城里很多。"
 SUM_Neo_SGD.150.t:"旧制照行"
 SUM_Neo_SGD.150.d:"有人主张照旧例行事：该交的交，该办的办，只是账本换个封皮。这样的人在城里很多。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.150.a:"以神权号令沙漠"
 SUM_Neo_SGD.150.b:"以律法约束诸城"
 SUM_SGD_RC_Tribute_Terms:"贡赋的新算法"
 SUM_SGD_RC_Tribute_Terms_desc:"与雨林重算贡赋，交还是交，只是数少了，名目换了。换名目不换里子，两边都下得来台。"
 SUM_Neo_SGD.151.t:"贡赋的新算法"
 SUM_Neo_SGD.151.d:"与雨林重算贡赋，交还是交，只是数少了，名目换了。换名目不换里子，两边都下得来台。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGD.151.a:"把遗迹挖开"
 SUM_Neo_SGD.151.b:"把遗迹封回去"
 SUM_SGD_RC_Border_Status:"边界的旧约"
 SUM_SGD_RC_Border_Status_desc:"边界不动，只把守界的人换成自己人。人换了，界就换了主人。"
 SUM_Neo_SGD.152.t:"边界的旧约"
 SUM_Neo_SGD.152.d:"边界不动，只把守界的人换成自己人。人换了，界就换了主人。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGD.152.a:"重立赤王的旧制"
 SUM_Neo_SGD.152.b:"重建城邦的议会"
 SUM_SGD_RC_Keep_Officials:"留用旧吏"
 SUM_SGD_RC_Keep_Officials_desc:"官署的旧吏大多留用，会算账的人到哪朝都缺。留用他们，税才收得上来。"
 SUM_Neo_SGD.153.t:"留用旧吏"
 SUM_Neo_SGD.153.d:"官署的旧吏大多留用，会算账的人到哪朝都缺。留用他们，税才收得上来。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGD.153.a:"召集能战之众"
 SUM_Neo_SGD.153.b:"召集能谋之士"
 SUM_SGD_RC_Quiet_Land:"守成之策"
 SUM_SGD_RC_Quiet_Land_desc:"不折腾，不扩张，把眼下的日子过稳。这条路不响亮，却最不容易翻车。"
 SUM_Neo_SGD.154.t:"守成之策"
 SUM_Neo_SGD.154.d:"不折腾，不扩张，把眼下的日子过稳。这条路不响亮，却最不容易翻车。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGD.154.a:"以神权号令沙漠"
 SUM_Neo_SGD.154.b:"以律法约束诸城"
 SUM_SGD_RC_Scarlet_Throne:"赤王王座重光"
 SUM_SGD_RC_Scarlet_Throne_desc:"旧王城的遗址上垒起一座高台，台下是按号站好的军。台上的人受了冠，第一道令是把沙漠所有的路都设卡、所有的城都设戍。沙漠从没有这样整齐过，也从没有这样安静过。"
 SUM_Neo_SGD.155.t:"赤王王座重光"
 SUM_Neo_SGD.155.d:"旧王城的遗址上垒起一座高台，台下是按号站好的军。台上的人受了冠，第一道令是把沙漠所有的路都设卡、所有的城都设戍。沙漠从没有这样整齐过，也从没有这样安静过。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。"
 SUM_Neo_SGD.155.a:"把遗迹挖开"
 SUM_Neo_SGD.155.b:"把遗迹封回去"
 SUM_SGD_RC_Suzerain_Order:"沙海守成"
 SUM_SGD_RC_Suzerain_Order_desc:"沙漠与雨林重新划定了两边的账：贡赋减了三成，边界的守军换成自己人，城里的旧吏一个没动。城门口那口钟照旧敲，只是敲钟的人换了衣裳。"
 SUM_Neo_SGD.156.t:"沙海守成"
 SUM_Neo_SGD.156.d:"沙漠与雨林重新划定了两边的账：贡赋减了三成，边界的守军换成自己人，城里的旧吏一个没动。城门口那口钟照旧敲，只是敲钟的人换了衣裳。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGD.156.a:"重立赤王的旧制"
 SUM_Neo_SGD.156.b:"重建城邦的议会"

 #### 开战须弥 · 雨林的门 ####
 SUM_SGD_WAR_The_March_on_Sumeru:"兵向雨林"
 SUM_SGD_WAR_The_March_on_Sumeru_desc:"独立只是第一步。沙漠的粮仓、商路与水源，多半还在雨林的手里捏着。要真正说了算，就得把那道门敲开，把雨林从沙漠的账本上划掉。"
 SUM_Neo_SGD.157.t:"兵向雨林"
 SUM_Neo_SGD.157.d:"独立只是第一步。沙漠的粮仓、商路与水源，多半还在雨林的手里捏着。要真正说了算，就得把那道门敲开，把雨林从沙漠的账本上划掉。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SGD.157.a:"以动员令起兵"
 SUM_Neo_SGD.157.b:"以盟约召集部族"
 SUM_SGD_WAR_Mobilize:"全面动员"
 SUM_SGD_WAR_Mobilize_desc:"动员令传遍各城各族，市集上的男人走了一半，剩下的多半是老人和孩子。"
 SUM_Neo_SGD.158.t:"全面动员"
 SUM_Neo_SGD.158.d:"动员令传遍各城各族，市集上的男人走了一半，剩下的多半是老人和孩子。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGD.158.a:"直取雨林关隘"
 SUM_Neo_SGD.158.b:"先断其商路"
 SUM_SGD_WAR_War_Tax:"开征军费"
 SUM_SGD_WAR_War_Tax_desc:"添一笔军费，商人出大头，农人出小头，谁也得交。交钱的人说，等打赢了再说。"
 SUM_Neo_SGD.159.t:"开征军费"
 SUM_Neo_SGD.159.d:"添一笔军费，商人出大头，农人出小头，谁也得交。交钱的人说，等打赢了再说。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGD.159.a:"把话说给雨林人听"
 SUM_Neo_SGD.159.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Ration:"配给"
 SUM_SGD_WAR_Ration_desc:"粮与盐按口配给，先紧着前线和做工的人。配给的规矩贴在各城的墙上。"
 SUM_Neo_SGD.160.t:"配给"
 SUM_Neo_SGD.160.d:"粮与盐按口配给，先紧着前线和做工的人。配给的规矩贴在各城的墙上。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SGD.160.a:"倾全境之力"
 SUM_Neo_SGD.160.b:"留一支后手"
 SUM_SGD_WAR_War_Council:"军议"
 SUM_SGD_WAR_War_Council_desc:"军议定下三路进兵：一路走商道，一路走沙脊，一路沿渠。"
 SUM_Neo_SGD.161.t:"军议"
 SUM_Neo_SGD.161.d:"军议定下三路进兵：一路走商道，一路走沙脊，一路沿渠。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.161.a:"以动员令起兵"
 SUM_Neo_SGD.161.b:"以盟约召集部族"
 SUM_SGD_WAR_Proclaim:"讨雨林檄文"
 SUM_SGD_WAR_Proclaim_desc:"檄文写得平实，说的是欠税、占水、扣粮三件事，一件一件都有账可查。"
 SUM_Neo_SGD.162.t:"讨雨林檄文"
 SUM_Neo_SGD.162.d:"檄文写得平实，说的是欠税、占水、扣粮三件事，一件一件都有账可查。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGD.162.a:"直取雨林关隘"
 SUM_Neo_SGD.162.b:"先断其商路"
 SUM_SGD_WAR_Sandstorm_March:"借风而进"
 SUM_SGD_WAR_Sandstorm_March_desc:"大军等一场沙暴上路，风把人遮住，也把脚印遮住。"
 SUM_Neo_SGD.163.t:"借风而进"
 SUM_Neo_SGD.163.d:"大军等一场沙暴上路，风把人遮住，也把脚印遮住。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SGD.163.a:"把话说给雨林人听"
 SUM_Neo_SGD.163.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Night_Ride:"夜行"
 SUM_SGD_WAR_Night_Ride_desc:"白天歇，夜里走，靠的是星星和旧道。领路的人走在最前面，一步不错。"
 SUM_Neo_SGD.164.t:"夜行"
 SUM_Neo_SGD.164.d:"白天歇，夜里走，靠的是星星和旧道。领路的人走在最前面，一步不错。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGD.164.a:"倾全境之力"
 SUM_Neo_SGD.164.b:"留一支后手"
 SUM_SGD_WAR_Camel_Column:"驼队辎重"
 SUM_SGD_WAR_Camel_Column_desc:"辎重用驼不用车，驼能喝十天的干，车走三天的沙。"
 SUM_Neo_SGD.165.t:"驼队辎重"
 SUM_Neo_SGD.165.d:"辎重用驼不用车，驼能喝十天的干，车走三天的沙。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SGD.165.a:"以动员令起兵"
 SUM_Neo_SGD.165.b:"以盟约召集部族"
 SUM_SGD_WAR_Oasis_Hop:"绿洲跳进"
 SUM_SGD_WAR_Oasis_Hop_desc:"沿着绿洲一座座地跳，每跳一步，补给就近一分，雨林的地图就少一块。"
 SUM_Neo_SGD.166.t:"绿洲跳进"
 SUM_Neo_SGD.166.d:"沿着绿洲一座座地跳，每跳一步，补给就近一分，雨林的地图就少一块。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.166.a:"直取雨林关隘"
 SUM_Neo_SGD.166.b:"先断其商路"
 SUM_SGD_WAR_Guide_Sand:"识途的向导"
 SUM_SGD_WAR_Guide_Sand_desc:"向导认得连雨林测绘队都没画出来的路。这条路是几百年前逃荒的人踩出来的。"
 SUM_Neo_SGD.167.t:"识途的向导"
 SUM_Neo_SGD.167.d:"向导认得连雨林测绘队都没画出来的路。这条路是几百年前逃荒的人踩出来的。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGD.167.a:"把话说给雨林人听"
 SUM_Neo_SGD.167.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Storm_Pass:"强攻关隘"
 SUM_SGD_WAR_Storm_Pass_desc:"关隘立在雨林边上，是雨林伸进沙漠的一只手。这只手得先砍断。"
 SUM_Neo_SGD.168.t:"强攻关隘"
 SUM_Neo_SGD.168.d:"关隘立在雨林边上，是雨林伸进沙漠的一只手。这只手得先砍断。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.168.a:"倾全境之力"
 SUM_Neo_SGD.168.b:"留一支后手"
 SUM_SGD_WAR_Siege_Engine:"造攻城之器"
 SUM_SGD_WAR_Siege_Engine_desc:"照遗迹里的图样造了几架抛石机与撞锤，笨重，可关隘不怕云梯。"
 SUM_Neo_SGD.169.t:"造攻城之器"
 SUM_Neo_SGD.169.d:"照遗迹里的图样造了几架抛石机与撞锤，笨重，可关隘不怕云梯。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGD.169.a:"以动员令起兵"
 SUM_Neo_SGD.169.b:"以盟约召集部族"
 SUM_SGD_WAR_Cut_Water:"断渠"
 SUM_SGD_WAR_Cut_Water_desc:"把关隘上游的渠掘断，守军有水而汲不上来，撑不了太久。"
 SUM_Neo_SGD.170.t:"断渠"
 SUM_Neo_SGD.170.d:"把关隘上游的渠掘断，守军有水而汲不上来，撑不了太久。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGD.170.a:"直取雨林关隘"
 SUM_Neo_SGD.170.b:"先断其商路"
 SUM_SGD_WAR_Ladder_Night:"夜袭关墙"
 SUM_SGD_WAR_Ladder_Night_desc:"选最灵便的人攀墙，攀上去的活着的不到一半，墙上的灯火却在那一夜灭了。"
 SUM_Neo_SGD.171.t:"夜袭关墙"
 SUM_Neo_SGD.171.d:"选最灵便的人攀墙，攀上去的活着的不到一半，墙上的灯火却在那一夜灭了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGD.171.a:"把话说给雨林人听"
 SUM_Neo_SGD.171.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Occupy_Pass:"据关而守"
 SUM_SGD_WAR_Occupy_Pass_desc:"关隘易手之后不推倒，改成自己的戍所。门朝哪边开，由沙漠说了算。"
 SUM_Neo_SGD.172.t:"据关而守"
 SUM_Neo_SGD.172.d:"关隘易手之后不推倒，改成自己的戍所。门朝哪边开，由沙漠说了算。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SGD.172.a:"倾全境之力"
 SUM_Neo_SGD.172.b:"留一支后手"
 SUM_SGD_WAR_Sand_Mission:"策反沙漠驻军"
 SUM_SGD_WAR_Sand_Mission_desc:"雨林在沙漠的驻军大半是本地人，派去的人只问一句：你是替谁当兵。"
 SUM_Neo_SGD.173.t:"策反沙漠驻军"
 SUM_Neo_SGD.173.d:"雨林在沙漠的驻军大半是本地人，派去的人只问一句：你是替谁当兵。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGD.173.a:"以动员令起兵"
 SUM_Neo_SGD.173.b:"以盟约召集部族"
 SUM_SGD_WAR_Rain_People:"联络雨林村社"
 SUM_SGD_WAR_Rain_People_desc:"雨林的村社也在交重税，也在被征兵。派去的人不带兵器，只带账本给对面看。"
 SUM_Neo_SGD.174.t:"联络雨林村社"
 SUM_Neo_SGD.174.d:"雨林的村社也在交重税，也在被征兵。派去的人不带兵器，只带账本给对面看。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SGD.174.a:"直取雨林关隘"
 SUM_Neo_SGD.174.b:"先断其商路"
 SUM_SGD_WAR_Promise_Amnesty:"宽赦令"
 SUM_SGD_WAR_Promise_Amnesty_desc:"凡归降者不问旧事，愿意留下的分地，愿意走的给粮。这一条比刀好用。"
 SUM_Neo_SGD.175.t:"宽赦令"
 SUM_Neo_SGD.175.d:"凡归降者不问旧事，愿意留下的分地，愿意走的给粮。这一条比刀好用。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGD.175.a:"把话说给雨林人听"
 SUM_Neo_SGD.175.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Bribe_Clerk:"收买书吏"
 SUM_SGD_WAR_Bribe_Clerk_desc:"雨林的关卡靠书吏记档，书吏认得每一个来往的人。钱递过去，档换一份。"
 SUM_Neo_SGD.176.t:"收买书吏"
 SUM_Neo_SGD.176.d:"雨林的关卡靠书吏记档，书吏认得每一个来往的人。钱递过去，档换一份。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SGD.176.a:"倾全境之力"
 SUM_Neo_SGD.176.b:"留一支后手"
 SUM_SGD_WAR_Whisper_Back:"反间"
 SUM_SGD_WAR_Whisper_Back_desc:"把假消息透给雨林的斥候，让他们把话说给自己人听。兵不血刃的事，多半靠这个。"
 SUM_Neo_SGD.177.t:"反间"
 SUM_Neo_SGD.177.d:"把假消息透给雨林的斥候，让他们把话说给自己人听。兵不血刃的事，多半靠这个。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SGD.177.a:"以动员令起兵"
 SUM_Neo_SGD.177.b:"以盟约召集部族"
 SUM_SGD_WAR_Supply_Chain:"辎重线"
 SUM_SGD_WAR_Supply_Chain_desc:"辎重线沿商路铺开，一站接一站。前线吃什么，看后面这条线顺不顺。"
 SUM_Neo_SGD.178.t:"辎重线"
 SUM_Neo_SGD.178.d:"辎重线沿商路铺开，一站接一站。前线吃什么，看后面这条线顺不顺。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGD.178.a:"直取雨林关隘"
 SUM_Neo_SGD.178.b:"先断其商路"
 SUM_SGD_WAR_Water_Wagons:"运水车队"
 SUM_SGD_WAR_Water_Wagons_desc:"沙漠作战，水比粮要紧。运水的车队昼夜不停，车夫换人不换车。"
 SUM_Neo_SGD.179.t:"运水车队"
 SUM_Neo_SGD.179.d:"沙漠作战，水比粮要紧。运水的车队昼夜不停，车夫换人不换车。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SGD.179.a:"把话说给雨林人听"
 SUM_Neo_SGD.179.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Field_Hospital:"战地医帐"
 SUM_SGD_WAR_Field_Hospital_desc:"医帐随军而走，能就地治的就地治，治不了的往后送。能救回来的比往年多。"
 SUM_Neo_SGD.180.t:"战地医帐"
 SUM_Neo_SGD.180.d:"医帐随军而走，能就地治的就地治，治不了的往后送。能救回来的比往年多。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SGD.180.a:"倾全境之力"
 SUM_Neo_SGD.180.b:"留一支后手"
 SUM_SGD_WAR_Forge_Camp:"随军铁作坊"
 SUM_SGD_WAR_Forge_Camp_desc:"随军的铁作坊修兵器、打马掌，缺什么现造什么。"
 SUM_Neo_SGD.181.t:"随军铁作坊"
 SUM_Neo_SGD.181.d:"随军的铁作坊修兵器、打马掌，缺什么现造什么。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。"
 SUM_Neo_SGD.181.a:"以动员令起兵"
 SUM_Neo_SGD.181.b:"以盟约召集部族"
 SUM_SGD_WAR_Tax_Rear:"后方催征"
 SUM_SGD_WAR_Tax_Rear_desc:"后方的税照收不误，只是名目换成了捐输。捐输的人指望打胜了能抵税。"
 SUM_Neo_SGD.182.t:"后方催征"
 SUM_Neo_SGD.182.d:"后方的税照收不误，只是名目换成了捐输。捐输的人指望打胜了能抵税。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGD.182.a:"直取雨林关隘"
 SUM_Neo_SGD.182.b:"先断其商路"
 SUM_SGD_WAR_Last_Storm:"最后一场沙暴"
 SUM_SGD_WAR_Last_Storm_desc:"总攻选在换季的第一场大风，风一起，天与地分不清，正好掩兵。"
 SUM_Neo_SGD.183.t:"最后一场沙暴"
 SUM_Neo_SGD.183.d:"总攻选在换季的第一场大风，风一起，天与地分不清，正好掩兵。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGD.183.a:"把话说给雨林人听"
 SUM_Neo_SGD.183.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Break_Line:"破阵"
 SUM_SGD_WAR_Break_Line_desc:"把最硬的驼骑压在正面，等对方阵形一动，两翼的游骑就插进去。"
 SUM_Neo_SGD.184.t:"破阵"
 SUM_Neo_SGD.184.d:"把最硬的驼骑压在正面，等对方阵形一动，两翼的游骑就插进去。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SGD.184.a:"倾全境之力"
 SUM_Neo_SGD.184.b:"留一支后手"
 SUM_SGD_WAR_Rain_Palace:"望见净善宫"
 SUM_SGD_WAR_Rain_Palace_desc:"从雨林的高处往下看，能望见须弥城里的尖塔。走了这么远，为的是那几座塔。"
 SUM_Neo_SGD.185.t:"望见净善宫"
 SUM_Neo_SGD.185.d:"从雨林的高处往下看，能望见须弥城里的尖塔。走了这么远，为的是那几座塔。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。"
 SUM_Neo_SGD.185.a:"以动员令起兵"
 SUM_Neo_SGD.185.b:"以盟约召集部族"
 SUM_SGD_WAR_Terms_Demand:"提出条件"
 SUM_SGD_WAR_Terms_Demand_desc:"兵临城下才提条件：撤军、减贡、还地、认沙漠的独立。条条都是账上有的。"
 SUM_Neo_SGD.186.t:"提出条件"
 SUM_Neo_SGD.186.d:"兵临城下才提条件：撤军、减贡、还地、认沙漠的独立。条条都是账上有的。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGD.186.a:"直取雨林关隘"
 SUM_Neo_SGD.186.b:"先断其商路"
 SUM_SGD_WAR_Sumeru_Day:"须弥之日"
 SUM_SGD_WAR_Sumeru_Day_desc:"到了这一步，这一仗是打给雨林看的，也是打给沙漠自己看的。"
 SUM_Neo_SGD.187.t:"须弥之日"
 SUM_Neo_SGD.187.d:"到了这一步，这一仗是打给雨林看的，也是打给沙漠自己看的。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SGD.187.a:"把话说给雨林人听"
 SUM_Neo_SGD.187.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Storm_the_Rainforest:"兵临雨林"
 SUM_SGD_WAR_Storm_the_Rainforest_desc:"沙漠的旗插上了第一道雨林关隘。往东是平原与河渠，再往东是须弥城的高塔。教令院的使节连夜赶到阵前，说可以谈；阵前的人只回了一句话：先谈撤军，再谈别的。"
 SUM_Neo_SGD.188.t:"兵临雨林"
 SUM_Neo_SGD.188.d:"沙漠的旗插上了第一道雨林关隘。往东是平原与河渠，再往东是须弥城的高塔。教令院的使节连夜赶到阵前，说可以谈；阵前的人只回了一句话：先谈撤军，再谈别的。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SGD.188.a:"倾全境之力"
 SUM_Neo_SGD.188.b:"留一支后手"

 #### 决议 ####
 SUM_SGD_Govern:"城邦与政务"
 SUM_SGD_Govern_desc:"镀金沙漠的政务决议组，处理沙漠帝国的内政与秩序。整肃官署、调和商团与神庙的关系、安定绿洲民生，都属于这里的范畴。国家越是稳固，越能支撑日后的扩张与征战，仓促冒进反而容易动摇根本。仓促冒进只会动摇根本，稳扎稳打方是长久之计。"
 SUM_SGD_Trade:"商路与泉"
 SUM_SGD_Trade_desc:"镀金沙漠的商路决议组。控制沙海商道、征收通行税、与过往商队订立契约，都能充实国库。金子流动的方向，往往就是沙漠强国真正的影响力所在。谁握住商路，谁就握住沙漠的命脉，也握住与邻邦讨价还价的底气。商路一旦打通，府库与人心都会随之丰盈起来。"
 SUM_SGD_Faith:"赤王与花神"
 SUM_SGD_Faith_desc:"镀金沙漠的信仰决议组。围绕赤王的旧训与沙漠诸神的祭祀展开，处理祭司阶层的诉求与民众的信念。信仰越是统一，沙漠的动员能力就越强，也越能凝聚沙海各部的人心，让号令出得去、兵员征得来。人心齐了，许多难事也就迎刃而解。"
 SUM_SGD_Army:"沙海军伍"
 SUM_SGD_Army_desc:"镀金沙漠的军事决议组。整编佣兵、修缮要塞与操练沙海部队都在这里。沙漠的军队靠的是纪律与后勤，把这两样做扎实，才能在战场上立于不败之地，也才守得住辛苦打下的绿洲与商道。兵甲既足，号令才有人肯听。这样才配得上这份家业。"
 SUM_SGD_Crisis:"风沙与饥馑"
 SUM_SGD_Crisis_desc:"镀金沙漠的危机决议组，用于处理突发的事变与内外的威胁。沙漠之地从来不缺风波，及时应对才能避免事态扩大，也才能保住辛苦攒下的家底，免得一场变故把多年经营付诸东流。稳住局面，才谈得上日后的经营。稳住阵脚，才有翻盘的余地。"
 SUM_SGD_Dec_Gov_Land:"厘清地产"
 SUM_SGD_Dec_Gov_Land_desc:"把官署名下的沙地重新造册。"
 SUM_SGD_Dec_Gov_Roll:"编民籍"
 SUM_SGD_Dec_Gov_Roll_desc:"登记各城的人口与户数。"
 SUM_SGD_Dec_Gov_Judges:"巡城问政"
 SUM_SGD_Dec_Gov_Judges_desc:"派执事巡查各城的政务。"
 SUM_SGD_Dec_Gov_Road:"修官道"
 SUM_SGD_Dec_Gov_Road_desc:"把城与城之间的旧道补平。"
 SUM_SGD_Dec_Gov_School:"立学馆"
 SUM_SGD_Dec_Gov_School_desc:"在城邦里兴办启蒙的学馆。"
 SUM_SGD_Dec_Trade_Toll:"立税卡"
 SUM_SGD_Dec_Trade_Toll_desc:"在商路各口设卡收税。"
 SUM_SGD_Dec_Trade_Salt:"专营盐利"
 SUM_SGD_Dec_Trade_Salt_desc:"把盐场收归盟约经营。"
 SUM_SGD_Dec_Trade_Caravan:"招募商队"
 SUM_SGD_Dec_Trade_Caravan_desc:"出资组织往外的商队。"
 SUM_SGD_Dec_Trade_Well:"凿井"
 SUM_SGD_Dec_Trade_Well_desc:"在缺水处凿新井，安顿流民。"
 SUM_SGD_Dec_Trade_Mint:"铸新钱"
 SUM_SGD_Dec_Trade_Mint_desc:"开炉铸一枚成色足的沙漠钱。"
 SUM_SGD_Dec_Faith_Dig:"清理遗迹"
 SUM_SGD_Dec_Faith_Dig_desc:"组织人手清理一处赤王遗迹。"
 SUM_SGD_Dec_Faith_Shrine:"立龛安民"
 SUM_SGD_Dec_Faith_Shrine_desc:"给花神的信众立一处安身的龛。"
 SUM_SGD_Dec_Faith_Oath:"重立部族盟誓"
 SUM_SGD_Dec_Faith_Oath_desc:"召集长老重立血的盟约。"
 SUM_SGD_Dec_Faith_Pilgrim:"护朝圣路"
 SUM_SGD_Dec_Faith_Pilgrim_desc:"沿遗迹之路设护队与井。"
 SUM_SGD_Dec_Army_Levy:"征发民兵"
 SUM_SGD_Dec_Army_Levy_desc:"向各部族征发一批民兵。"
 SUM_SGD_Dec_Army_Hire:"雇请旅团"
 SUM_SGD_Dec_Army_Hire_desc:"以摩拉雇镀金旅团效力。"
 SUM_SGD_Dec_Army_Fort:"增筑戍所"
 SUM_SGD_Dec_Army_Fort_desc:"在要道增筑戍所与望楼。"
 SUM_SGD_Dec_Army_Drill:"操演沙战"
 SUM_SGD_Dec_Army_Drill_desc:"按沙暴战术操演各路兵。"
 SUM_SGD_Dec_Crisis_Storm:"赈济风灾"
 SUM_SGD_Dec_Crisis_Storm_desc:"开仓赈济被沙暴毁家的人。"
 SUM_SGD_Dec_Crisis_Flood:"疏浚旧渠"
 SUM_SGD_Dec_Crisis_Flood_desc:"疏浚淤塞的旧渠，防春汛。"
 SUM_SGD_Dec_Crisis_Riot:"弹压骚动"
 SUM_SGD_Dec_Crisis_Riot_desc:"用治安队平息城中的骚动。"
 SUM_Neo_SGD_Mechanism:"机制状态"
 SUM_Neo_SGD_Mechanism_desc:"机制状态只读面板。按黛斯赫雷特与埃雷米特两条轴的数值，显示镀金沙漠当前的等级以及该档生效的国家修正。条目不可点击，仅供随时查看机制进度，方便你判断下一步该往哪条轴上使劲。面板会随轴值变化即时刷新，无需手动操作。"
 SUM_Neo_SGD_T1_View:"赤王遗志 · 一档：赤王之名只剩传说"
 SUM_Neo_SGD_T1_View_desc:"稳定度 -10%、战争支持度 -5%"
 SUM_Neo_SGD_T2_View:"赤王遗志 · 二档：旧事重提"
 SUM_Neo_SGD_T2_View_desc:"稳定度 -5%"
 SUM_Neo_SGD_T3_View:"赤王遗志 · 三档：遗迹重开"
 SUM_Neo_SGD_T3_View_desc:"稳定度 +5%、战争支持度 +5%"
 SUM_Neo_SGD_T4_View:"赤王遗志 · 四档：王统渐立"
 SUM_Neo_SGD_T4_View_desc:"稳定度 +10%、战争支持度 +10%"
 SUM_Neo_SGD_T5_View:"赤王遗志 · 五档：赤沙之主"
 SUM_Neo_SGD_T5_View_desc:"稳定度 +15%、战争支持度 +15%、陆军攻击 +10%"
 SUM_Neo_SGD_U1_View:"旅团声望 · 一档：旅团离散"
 SUM_Neo_SGD_U1_View_desc:"陆军攻击 -10%、战争支持度 -10%"
 SUM_Neo_SGD_U2_View:"旅团声望 · 二档：契约零散"
 SUM_Neo_SGD_U2_View_desc:"陆军攻击 -5%"
 SUM_Neo_SGD_U3_View:"旅团声望 · 三档：旅团在侧"
 SUM_Neo_SGD_U3_View_desc:"陆军攻击 +5%、战争支持度 +5%"
 SUM_Neo_SGD_U4_View:"旅团声望 · 四档：旅团归心"
 SUM_Neo_SGD_U4_View_desc:"陆军攻击 +10%、军队组织度 +5%"
 SUM_Neo_SGD_U5_View:"旅团声望 · 五档：沙海强军"
 SUM_Neo_SGD_U5_View_desc:"陆军攻击 +15%、军队组织度 +10%、征兵率 +10%"
 SUM_Neo_SGD_Combo_HH_View:"共振 · 双王并起"
 SUM_Neo_SGD_Combo_HH_View_desc:"稳定度 +20%、战争支持度 +15%"
 SUM_Neo_SGD_Combo_LL_View:"共振 · 散沙之世"
 SUM_Neo_SGD_Combo_LL_View_desc:"稳定度 -20%、陆军防御 +20%"
 SUM_Neo_SGD_Combo_AH_View:"共振 · 王统独尊"
 SUM_Neo_SGD_Combo_AH_View_desc:"稳定度 +15%、战争支持度 +10%"
 SUM_Neo_SGD_Combo_BH_View:"共振 · 旅团当国"
 SUM_Neo_SGD_Combo_BH_View_desc:"政治点数获取 +20%、陆军攻击 +10%"

 #### 民族精神 ####
 SUM_SGD_I_Suzerain_Shadow:"藩属之影"
 SUM_SGD_I_Suzerain_Shadow_desc:"镀金沙漠在名分上仍是雨林的下属，政令要经教令院过目。"
 SUM_SGD_I_Eremite_Host:"旅团在境"
 SUM_SGD_I_Eremite_Host_desc:"镀金旅团在沙漠里有自己的营寨与账房，替谁打仗只看契约。"
 SUM_SGD_I_Desert_Grievance:"沙海的旧怨"
 SUM_SGD_I_Desert_Grievance_desc:"雨林与沙漠之间的赋税与地界，几百年没有算清。"
 SUM_SGD_I_Scarce_Water:"水贵如金"
 SUM_SGD_I_Scarce_Water_desc:"沙漠的水攥在少数人手里，谁分水谁说了算。"
 SUM_SGD_I_Caravan_Wealth:"商路之利"
 SUM_SGD_I_Caravan_Wealth_desc:"旧道上的商队带来税与消息，也带来外邦的耳目。"
 SUM_SGD_I_Red_King_Legacy:"赤王的余响"
 SUM_SGD_I_Red_King_Legacy_desc:"赤王留下的遗迹与传说，是沙漠人心里未熄的一团火。"
 SUM_SGD_I_Tax_Heavy:"税册如山"
 SUM_SGD_I_Tax_Heavy_desc:"税目一年比一年多，城民把账都记在心里。"
 SUM_SGD_I_Tribal_Levy:"部族的兵"
 SUM_SGD_I_Tribal_Levy_desc:"部族民兵自备兵器与口粮，听调不听编。"
 SUM_SGD_I_Sand_League:"沙海同盟"
 SUM_SGD_I_Sand_League_desc:"诸城与诸部结成同盟，共抗雨林的敕令。"
 SUM_SGD_I_Independent_Flag:"独立的旗"
 SUM_SGD_I_Independent_Flag_desc:"红底飞鸟旗立在各城城头，代表沙漠自己说了算。"
 SUM_SGD_I_Oasis_Republic:"绿洲共和"
 SUM_SGD_I_Oasis_Republic_desc:"各城的执事共议国事，水与税都写在明处。"
 SUM_SGD_I_Open_Market:"开市通商"
 SUM_SGD_I_Open_Market_desc:"集市不分内外，商队云集，税则公开。"
 SUM_SGD_I_Law_of_Sand:"沙漠律例"
 SUM_SGD_I_Law_of_Sand_desc:"一部合诸城诸部之规的律例，法官巡城而判。"
 SUM_SGD_I_Citizen_Militia:"乡兵制度"
 SUM_SGD_I_Citizen_Militia_desc:"各城出丁，平时务农，战时集合，粮从公出。"
 SUM_SGD_I_Desert_Commune:"沙海公议"
 SUM_SGD_I_Desert_Commune_desc:"水与地归公，契约与兵由两部共管。"
 SUM_SGD_I_Twin_Oath:"双誓之国"
 SUM_SGD_I_Twin_Oath_desc:"赤王的旧誓与花神的旧盟同刻一石，立在绿洲泉边。"
 SUM_SGD_I_Public_Ledger:"公账制度"
 SUM_SGD_I_Public_Ledger_desc:"团里的账目与税则一律公开，谁都能查。"
 SUM_SGD_I_Scarlet_Crown:"赤沙王冠"
 SUM_SGD_I_Scarlet_Crown_desc:"重立的王统以赤王为号，军、政、祀集于一身。"
 SUM_SGD_I_Militant_Desert:"沙海军国"
 SUM_SGD_I_Militant_Desert_desc:"诸城诸部之兵编为一军，号令与粮饷统一。"
 SUM_SGD_I_Ruin_Works:"遗迹工程"
