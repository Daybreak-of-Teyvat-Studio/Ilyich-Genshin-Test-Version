 SUM_Neo.227.t:"与神并肩"
 SUM_Neo.227.d:"须弥的神坐在至冬的桌边，与第二席并肩。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。高塔投下的影子越来越长，傍晚时就盖住了半条街。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。"
