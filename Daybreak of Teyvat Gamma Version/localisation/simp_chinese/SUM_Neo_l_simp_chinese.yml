 SUM_Neo.34.t:"草神圣所"
 SUM_Neo.34.d:"草神的圣所在雨林与沙漠各处立起。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。"
