 DOT_army_corruption:0 "陸軍の腐敗"
 DOT_army_corruption_desc:0 "我々の軍隊は腐敗と縁故主義に満ちている。強力な軍隊に変えたいならば、長期かつ費用の掛かる軍隊改革計画を実行に移さねばならないだろう。"
