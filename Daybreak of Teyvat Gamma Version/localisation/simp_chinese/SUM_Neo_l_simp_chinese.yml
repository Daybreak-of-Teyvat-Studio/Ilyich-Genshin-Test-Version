 #################### 民族精神 ####################
 SUM_Neo_Wise_Land:"智折锋镝"
 SUM_Neo_Wise_Land_desc:"这个国家不靠兵刃立身，靠的是满腹经纶。教令院管着典籍、管着讲席，连哪句话算真理也由它说了算。坊间两个汉子争执不下，面红耳赤之际，总有一个梗着脖子来一句：「这是教令院定的。」对方立刻气短三分。一句话便能分出对错，这份权势，着实比钢刀还厉害。"
 SUM_Neo_Akasha_Dependence:"万事皆托虚空"
 SUM_Neo_Akasha_Dependence_desc:"须弥人头上都戴着一枚终端，遇事不问自己，先问它。路怎么走，药怎么配，连亲事该不该成，也要等它答一句。有个老妇不肯戴，儿孙都笑她痴。她只说道：「我想的，还不及它一夜想的多。」儿孙听了，也就不再劝。"
 SUM_Neo_Imprisoned_God:"囚神于宫"
 SUM_Neo_Imprisoned_God_desc:"净善宫的门常年关着，门里锁着须弥的神。教令院的公文，落款都写她的名字，念出来时人人低头。有个小吏送公文进去，回来跟人说道：「只看见一扇屏风，后头坐着个人影，一直没动。」听的人都压低了声音。"
 SUM_Neo_Sage_Oligarchy:"贤者擅权"
 SUM_Neo_Sage_Oligarchy_desc:"六大学派各有一位首座，加上大贤者，七个人坐在议事厅里。表面上有商有量，桌底下却各打各的算盘。今日你压我一头，明日我在课上驳你一句。散会时都拱手作别，转过廊柱，脸色就换了。有个小吏在柱后瞧见，忍不住撇了撇嘴。"
 SUM_Neo_Desert_Grievance:"沙碛宿怨"
 SUM_Neo_Desert_Grievance_desc:"雨林与沙漠的旧账，要从几百年前算起。沙漠那边说祖上被赶出绿洲，雨林这边说当年是他们先动的手。两边各有一本账，翻出来记得清清楚楚，就是数目对不上。有一回两拨人在路上遇见，都把头一扭，只当没看见。"
 SUM_Neo_Fatui_Influence:"愚人众潜伺"
 SUM_Neo_Fatui_Influence_desc:"造神计划里的图样、机件、药剂，样样都过多托雷的手。他来得不多，一封信却能改三道工序。有个工匠接到信，看了半晌道：「又改。」教令院的人心里明白：这神造出来，头一个听谁的还未可知。可箭已在弦上，收不回来了。"
 SUM_Neo_Genesis_Project:"阴图伪神"
 SUM_Neo_Genesis_Project_desc:"教令院要造神，造的不是供在庙里的神，是能听号令的神。这话说出去没人信，可工坊里的架子已经立起来了。大贤者在厅上说道：「神若不能听人的话，供它何用？」满座低头，谁也不敢接这一句。"
 SUM_Neo_Exhausted_Treasury:"帑藏如洗"
 SUM_Neo_Exhausted_Treasury_desc:"这几年又修路，又造神，又养兵，库房里的摩拉一箱箱往外抬。管账的翻开簿子：前年的进项还剩三成，去年只剩一成。有人提议加税，有人提议裁人，议到天黑，油灯添了两回，也没议出个所以然。管账的把簿子一合，叹道：「再这么下去，要空了。」"
 SUM_Neo_Forest_Watch:"林薮置戍"
 SUM_Neo_Forest_Watch_desc:"巡林队守的不是城墙，是林子的边。他们认得哪条水往哪流，哪片林不能砍。提纳里带人一趟趟走，走到死域边上便停下，插一根木牌。有个新兵问：「插这牌子做什么？」提纳里道：「叫后来人别再往前。」须弥人吃的粮，一半出在雨林，这队人守的就是饭碗。"
 SUM_Neo_Eremite_Host:"唯钱为命"
 SUM_Neo_Eremite_Host_desc:"在镀金旅团眼里，旗号不值钱，摩拉才是硬的。谁钱袋鼓，刀枪就替谁出力。某商人雇他们护货，半路上又有人出双倍的价，这些人立刻调头，将原先的雇主围了起来。商人跺脚嚷道：「钱我可是付了的！」为首的一边颠着钱袋一边笑道：「人家给得多。」商人目瞪口呆，一句话也接不上。"
 SUM_Neo_Crowned_God:"旒冕加身"
 SUM_Neo_Crowned_God_desc:"净善宫的门开了，小吉祥草王走了出来。是日城中静得出奇，连集市都收了摊。教令院的人跪在阶下，把头埋得很低。自此公文头一句改了，不再是教令院议定，而是神谕如此。有个书吏写着写着，停笔看了看那句，才又低头。"
 SUM_Neo_Dream_Return:"梦复还人"
 SUM_Neo_Dream_Return_desc:"是夜，须弥城的人睡下之后，头一回各自做了梦。有人梦见旧屋，有人梦见死去的亲人，醒来枕上湿了一片。次日集市上互相问：「你梦见什么了？」说完都笑，笑着笑着又不说了。有个老汉抹了把眼角，扭头走开。"
 SUM_Neo_Aranara_Pact:"兰那罗旧盟"
 SUM_Neo_Aranara_Pact_desc:"兰那罗在林子里唱着歌，把一支新芽交到人手里，这盟便算立了。它们说的话旁人听不懂，可那支芽插进土里，第二日就长了一寸。巡林官蹲在旁边看了半日，叹道：「这些小家伙，记性比人长。」"
 SUM_Neo_World_Tree_Boon:"世界树垂庥"
 SUM_Neo_World_Tree_Boon_desc:"世界树的根须从地底盘过来，穿过雨林，一直伸到沙漠边上。所过之处，井水回甜，枯枝发芽。有个老人跪在树根前烧香，巡林官把他扶起来：「这不是神像，是活的。」老人却道：「活的，才该拜。」巡林官听了，也没再劝。"
 SUM_Neo_Greenery_Eternal:"万木长春"
 SUM_Neo_Greenery_Eternal_desc:"这几年雨林一年比一年密，路被藤蔓吞了，观测台也塌在树里。学者起初还去丈量，后来连路都找不着，便不去了。鸟兽不怕人，坐在枝上看人走过。有人叹道：「这是退步。」提纳里却道：「不必退，也不必进，由它去。」"
 SUM_Neo_Seal_Complete:"渊户终闭"
 SUM_Neo_Seal_Complete_desc:"须弥与那些不该碰的东西之间，如今隔着一整片雨林。林子密得连风都绕着走，深处的水潭终年不见日头。有个胆大的想穿过去看看，走到第三日便折了回来，浑身是泥，说道：「再往前，就没路了。」听的人便都死了那条心。"
 SUM_Neo_Shadow_Sealed:"闭门拒渊"
 SUM_Neo_Shadow_Sealed_desc:"世界之外有声音传来，一声一声，像有人敲门。草神坐在宫中，抬起手，那声音便断了。她不作解释，也不许人问。有个学者在笔记里写：「神听见了，只是不肯应。」写完这一句，他盯着看了半晌，自己把那页撕了。"
 SUM_Neo_Sacred_Court:"庙堂议政"
 SUM_Neo_Sacred_Court_desc:"六大学派的首座依次进殿，捧着卷子，跪在阶下念。念到要紧处，座上的人便问一句，问得极细。有个首座答不上来，额头直冒汗，拿袖子抹了两回。散朝时众人退出殿门，谁也不看谁，各自把卷子卷紧了。"
 SUM_Neo_Green_Guard:"绿营初立"
 SUM_Neo_Green_Guard_desc:"这一队兵不守城，只守林。甲上缠着藤，刀鞘插着新折的枝，走路不出声。遇着偷伐的，先劝；不听，便把人绑在树下，等巡林官来发落。有个商人笑他们不像兵，队正淡淡道：「本来就不是兵。」"
 SUM_Neo_Memory_Faded:"涤除旧识"
 SUM_Neo_Memory_Faded_desc:"世界树上少了一段，谁也说不清少了什么。账本上明明记着一笔，翻到那一页却是空白。有几个老人半夜坐起来，说梦见一个人，脸看不清，名字就在嘴边。天亮后再问，他们都摇头：「忘了，忘了。」"
 SUM_Neo_Republic_Charter:"镌共和典"
 SUM_Neo_Republic_Charter_desc:"共和的宪章立起来，头一条便写明：律法不由一人拟定。从此议事厅里要多议三遍，议定了还要张贴出去，任人指摘。有个老学者不惯，摇头道：「这样，办不成事。」旁边的年轻人笑答：「办不成，就慢慢办。」"
 SUM_Neo_Scholar_Council:"诸派会议"
 SUM_Neo_Scholar_Council_desc:"六大学派自此同席，不分高低，一人一票，议定了才算数。头一回议事，为一句措辞争了整日，从日出争到掌灯。有个首座争到口干，端起茶又放下，接着争。散会时谁也没赢，可那一条终究改得周全了些。"
 SUM_Neo_Open_Knowledge:"智归兆民"
 SUM_Neo_Open_Knowledge_desc:"教令院把书库的门开了，不论出身，肯读便可进去。头一日来了个卖鱼的少年，手上带着腥气，站在架前不敢伸手。老书吏递给他一本：「翻坏了不打紧。」少年捧着书，一直站到日头偏西，连鱼担子都忘了挑。"
 SUM_Neo_Free_Press:"邸报自梓"
 SUM_Neo_Free_Press_desc:"议论国政的，从此可在文末署上自己名字。头几日没人敢署，稿子送来，落款一律空着。后来一个教书先生头一个写了名，同僚替他捏把汗，第二日竟没人来找他。此后署名的渐多，报摊上的纸一日快似一日。"
 SUM_Neo_Sumeru_Bank:"钱柜新设"
 SUM_Neo_Sumeru_Bank_desc:"城里新开了银号，专借钱给做学问的。借的人要写明用途，还要找人作保。有个研究古文字的后生借了一笔，买纸墨，在屋里关了两年，出来抱着一摞手稿。掌事的翻了两页，点头道：「这钱，没白借。」"
 SUM_Neo_Ormos_Open:"奥摩斯港启市"
 SUM_Neo_Ormos_Open_desc:"关口上的税则改了，外商的货不必再层层验看，交了钱便放行。头一批来的商队在城外卸货，卸了整整三日。市集上香料价落了两成，本地摊主骂了几日：「这还让不让人活？」骂归骂，后来也添了新货色。"
 SUM_Neo_Citizenship:"授沙民版"
 SUM_Neo_Citizenship_desc:"律法上添了一行：沙漠民与雨林人同罪同罚，不再分作两等。头一桩案子是个沙民与城里人争水，判官按新律断，各打一半。沙民出来，站在阶下看了半天匾额，喃喃道：「这上头的字，我也认得了。」"
 SUM_Neo_Sand_Rail:"沙海驰轨"
 SUM_Neo_Sand_Rail_desc:"铁轨一节节铺进沙漠，铺轨的顶着日头，把枕木一根根砸进沙里。头一班车开出当日，沿路的人都跑出来看，孩子追着车厢跑了半里。有个老人摸了摸铁轨，缩回手道：「不烫。这东西，竟不吃水。」"
 SUM_Neo_Prosperity:"殷阜为国"
 SUM_Neo_Prosperity_desc:"这几年风调雨顺，渠也修了，谷仓一进进满起来。秋收那月，打谷场上晒的谷子望不到边，麻雀落下来，赶都赶不完。管仓的老吏拿着斗量，量到天黑还没量完，把斗一撂：「明日再量！」"
 SUM_Neo_Republic_Army:"更练锐卒"
 SUM_Neo_Republic_Army_desc:"共和国的兵不与别处同，不吃谁的饷，只听宪章的调遣。校场上立着一块石碑，刻的是誓词，新兵入伍要对着它念一遍，念完把手指按在名册上。有个老兵拍拍新兵肩膀：「这支部队，是给最坏的时候留着的。」"
 SUM_Neo_Gilded_Commune:"旅团置社"
 SUM_Neo_Gilded_Commune_desc:"工坊与矿场收归公用，赚的摩拉按份分给做工的人。头一回分红，队伍排到街口。有人领了钱不敢信，捧在手里数了三遍。有个老矿工捏着那几枚摩拉道：「挖了三十年，头一回知道挖出来的东西值多少。」"
 SUM_Neo_Sand_Equal:"沙林同风"
 SUM_Neo_Sand_Equal_desc:"沙漠与雨林的界碑撤了，两边户籍并作一册。有个沙民姑娘嫁到林子里，嫁妆是两匹骆驼，一路走到村口，村里人放了鞭炮。老人说这是几十年没有的事。也有人在旁边泼冷水：「界碑好撤，人心难并。」说罢，自己也笑了。"
 SUM_Neo_God_Made:"人铸为神"
 SUM_Neo_God_Made_desc:"那神立在殿上，一声令下，它便动。教令院的人起初还怕它，日子久了只当它是一件器物，谁当值谁使唤。有一日它抬起头，盯着一个人看了很久，那人手一抖，令符啪地落地。此后，再无人说它是器物。"
 SUM_Neo_Deshret_Reborn:"赤王复起"
 SUM_Neo_Deshret_Reborn_desc:"贤者们对外宣称，赤王的魂已附在新神身上。这话一出，沙漠那边竟安静了几日。有人从阿如村赶来，跪在殿外要看一眼，被兵丁拦下。他在门口坐了一夜，天亮时说道：「我看见了。」说完便走了，谁也不知他到底看见没有。"
 SUM_Neo_Dottore_Alliance:"盟于朔北"
 SUM_Neo_Dottore_Alliance_desc:"沙漠里起了几座营垒，旗子不是须弥的。至冬的人来去自由，车马不必查验，井水也紧着他们用。有个沙民赶羊路过，被拦下问话，放行时羊少了两只。他回村说了，村人只劝他：「莫提，莫提，说了也没用。」"
 SUM_Neo_Machine_Age:"机关盈宇"
 SUM_Neo_Machine_Age_desc:"工坊里换上新机，齿轮一转，一日的活抵十人。掌事的拿簿子点数，看谁慢便划去一个名。工人不敢停，手上磨破了裹块布接着做。有个老工人叹道：「我做了四十年，如今倒不如一具铁架。」旁边人听了，都没敢接话。"
 SUM_Neo_Abyss_Touched:"幽黑骤临"
 SUM_Neo_Abyss_Touched_desc:"这日封条裂了，众人推门进去，屋里只剩一摊黑灰，守库的腿一软，瘫在地上。教令院的库房越堆越满，有几样东西连主管都叫不出名。夜里库房常传出没来由的响动，换了几拨看守，都说听见里头有人讲话。"
 SUM_Neo_Iron_Law:"教令院峻法"
 SUM_Neo_Iron_Law_desc:"「这押，画得还有什么意思。」一个首座搁下笔，叹道。如今大贤者的敕令直接下到各城，议事厅那一关索性省了。六派首座头回听说还问了两遍，后来也懒得问。公文一到照例画押，画完便对着窗外发半天的呆。"
 SUM_Neo_Secret_Police:"阴置缉曹"
 SUM_Neo_Secret_Police_desc:"报章上的名字一日少似一日，先不见了两个常写时论的，后来连印书的也不见了。报摊上照旧摆着纸，翻开一看，整版只剩些不打紧的琐事。有个读者翻了半天，把纸放下，想问又没敢问，转身走了。"
 SUM_Neo_Akasha_Oversight:"虚空密伺"
 SUM_Neo_Akasha_Oversight_desc:"那终端连上各官署，人说的话一句句都进去，落成文字，堆在案上。有个差役在会上说错一句，第二日便被叫去问话，回来时脸都白了。此后众人说话都先在肚里过三遍，话越来越短，短到只剩「是」或「不是」。"
 SUM_Neo_Total_Rule:"一人蔽日"
 SUM_Neo_Total_Rule_desc:"城里的粮、水、书、路，样样都归教令院管。连谁家办丧事要几炷香，也有一纸文书可依。百姓遇事先打听上头的意思，打听不着便等着。有人说道：「这样倒也省心。」可说这话时，眼睛却看着别处。"
 SUM_Neo_Automaton_Legion:"械自为伍"
 SUM_Neo_Automaton_Legion_desc:"营中列着一队铁人，不吃粮，不领军饷，站一日也不晃。号令一下，它们便向前走；倒下的不再起来，后头的接着走。督军看它们走过长街，回头对副将道：「这样的兵，倒是好使。」副将望着那队伍，没有应声。"
 SUM_Neo_Eternal_Regency:"永世秉衡"
 SUM_Neo_Eternal_Regency_desc:"教令院以神的名义摄政，说是暂代，待神能理事便交还。这话说了十年，神还坐在屏风后头。每逢有人提起交还，公文上便添一句：「时机未到。」年复一年，连当初说这话的人，自己也不再提了。"
 SUM_Neo_Forbidden_Knowledge:"暗执禁术"
 SUM_Neo_Forbidden_Knowledge_desc:"教令院翻那批禁书，翻出几样能用的法子，试了几回都成了，胆子便壮起来。掌事的在厅上说道：「禁忌，不过是一门还没归类的学问。」话音刚落，窗外一阵风把灯吹灭，满座默然，谁也没起身去点。"
 SUM_Neo_Oracle_Edge:"垂谕下临"
 SUM_Neo_Oracle_Edge_desc:"城中人家的门上，近来多了一枚草叶记号。起初偷偷挂，后来明着挂，再后来连官署的门楣上也挂了。教令院的人看了不作声，只吩咐底下把公文里的措辞改软些。有个书吏改着改着，自己先笑了。"
 SUM_Neo_Canon_Edge:"律如霜雪"
 SUM_Neo_Canon_Edge_desc:"律条一月添几条，添到后来连书吏也记不全。市集上摆摊要证，走路要牌，连夜里点灯也有数目。有个卖饼的老汉被罚了钱，问犯了哪一条，差役翻了半天簿子，说道：「反正犯了。」老汉气得直哆嗦，却也没处说理。"
 SUM_Neo_Forest_Rangers:"增置林尉"
 SUM_Neo_Forest_Rangers_desc:"提纳里做了巡林官之首，头一日上任，没进衙门，先往林子里走了一趟。回来时靴上全是泥，手里捏着一片枯叶，说道：「西边的死域，又近了一步。」底下的人听了，一个个把腰间的刀挪正了。"
 SUM_Neo_Gilded_Legion:"旅团成旅"
 SUM_Neo_Gilded_Legion_desc:"镀金旅团新树一面大旗，旗上绣着须弥纹样，又缀自家族徽，风一卷，两样并在一处。这伙佣兵认的是摩拉，也认这地界的规矩，索性都绣上去，两面不得罪。有个老兵看了笑道：「这旗，谁都不得罪。」"
 SUM_Neo_Sumeru_Navy:"须弥治舟"
 SUM_Neo_Sumeru_Navy_desc:"奥摩斯港的桅杆上，新挂起一面须弥水师旗号，风里猎猎作响。港中船工抬头看了半晌，说道：「这旗一挂，往后海上再有风吹草动，众人便不是各自逃命了。」港口的旗，挂的是胆气。"
 SUM_Neo_Sumeru_Airforce:"须弥习飞"
 SUM_Neo_Sumeru_Airforce_desc:"「敢情天，是这么个样子。」一个学者头回上天，下来笑道。须弥要练一支奇兵，驾飞器的偏不从行伍里挑，倒去素论派找那帮观天象的。这帮人平日仰头认星斗、识风云，如今叫他们驾飞器上天，正对路。懂天的，才敢上天。"
 SUM_Neo_Mobilized_Nation:"举邦尽起"
 SUM_Neo_Mobilized_Nation_desc:"须弥一道令下，沙漠与雨林一齐抽丁，连偏僻村子也不放过。沙漠的汉子牵着骆驼来，雨林的青年背着弓来，两下里在教令院前排成两队，互相打量。这一抽，倒把两路人马拧成了一股。"
 SUM_Neo_General_Staff:"设总戎幕"
 SUM_Neo_General_Staff_desc:"「那我坐这儿做什么？」老贤者点头点烦了，开口问。参谋处的人赔笑：「您坐着，就是章程。」从前用兵全看贤者一时高兴，今日想战便战，明日想歇便歇；如今立了规矩，打仗自有参谋处拿章程，贤者只管点头。打仗不是儿戏，哪能由着性子。"
 SUM_Neo_Sand_Warfare:"沙中演阵"
 SUM_Neo_Sand_Warfare_desc:"军中有位老军官，把沙漠里那套游击法子一条条写下，收进操典：如何借沙丘隐身，如何夜里袭营，写得明白。有个年轻军官看了，叹道：「这法子，倒比书本管用。」这原本是佣兵的看家本领，如今成了官家的正经章程。"
 SUM_Neo_Frontier_Forts:"边筑坚堡"
 SUM_Neo_Frontier_Forts_desc:"荒沙里头，一座座砖石要塞沿着边境排开，像串起的珠子。夜里烽火点起来，一处有警，处处都晓得。守兵望见远处火起，就把自己这处也燃上，火光接了一宿又一宿。这些要塞，便是国家的门槛。"
 SUM_Neo_Imported_Arms:"购求异械"
 SUM_Neo_Imported_Arms_desc:"从前须弥的兵器全向外采买，如今自己开了作坊，照着样子仿制。匠人们把器械拆散了又拼起，反复琢磨几个月，才造出趁手的家伙。一位老匠盯着新成的枪端详良久，笑道：「这枪，出自咱自己的炉子。」能自己打造，骨气才硬，不必仰人鼻息。"
 SUM_Neo_Seven_Nations:"七邦互市"
 SUM_Neo_Seven_Nations_desc:"须弥的香料与咖啡，先前只卖给来往商队，如今七国处处通商，货色换了新出路。商人们装船的装船，驮骆驼的驮骆驼，忙得不亦乐乎。有个老商人一边点数一边唱小曲。货通天下，国便活了。"
 SUM_Neo_Scholar_League:"七邦同文"
 SUM_Neo_Scholar_League_desc:"从前学者各守一派，互不串门；如今开了禁，彼此可以往来。你到我书房看卷，我到你讲堂听讲，六派之间渐渐有了走动。有个老学者串了几回门，笑道：「这学问，本就不该砌墙隔开。」书卷也跟着互换了几回。"
 SUM_Neo_Spice_Trade:"香料通商"
 SUM_Neo_Spice_Trade_desc:"那股子香气，从集市的摊子飘到码头，又随着商船钻进七国的院落，人人都想讨一点。有个外乡客凑近闻了闻，忍不住道：「这味儿，正是须弥的！」天下人提起须弥，先想到的就是这香料，一国的名头竟系在这上头。"
 SUM_Neo_Coffee_Boom:"苦饮调饴"
 SUM_Neo_Coffee_Boom_desc:"须弥新起一行营生，便是咖啡。从雨林边到城郊，处处种着咖啡树，炒制的香气弥漫街巷。年轻学徒也进得作坊，端着杯子学那手艺，烫了手直甩。这一行当，养活了不少人。"
 SUM_Neo_Silk_Looms:"缫丝就杼"
 SUM_Neo_Silk_Looms_desc:"须弥的织机越添越多，工坊从城里一直排到城郊，机杼声昼夜不绝，连城外农舍也改成了作坊。蚕丝从各地运来，织成绸缎又运出去。有个老织工拍拍机子：「这响声，就是钱响。」"
 SUM_Neo_Desert_Mines:"沙中凿冶"
 SUM_Neo_Desert_Mines_desc:"沙漠深处探出矿脉，须弥征了人夫开采，头一炉铁水终于流了出来。匠人围着炉子看了半宿，有个伸手试了试，赞道：「这铁，够硬！」有了自己的铁，造刀造犁都不求人。铁匠铺的火，从此没熄过。"
 SUM_Neo_Wood_Trade:"输木与香"
 SUM_Neo_Wood_Trade_desc:"须弥靠两条腿走路：一条是雨林的木，一条是沙漠的货。雨林伐木顺河而下，沙漠驼队踏沙而来，两下里在城里交汇。有个老商人掰着指头道：「缺了哪条，都站不稳当。」两样货物，缺一便跛。"
 SUM_Neo_Craft_Revival:"百工竞起"
 SUM_Neo_Craft_Revival_desc:"「这是你祖爷爷使的。」老师傅把旧工具一件件摆开，对徒弟道，年轻的学徒便都围上来学。那些失传多年的老手艺，被人从旧箱底翻出来重新拾掇，雕花的、铸铜的、织锦的，一个个又开了张。"
 SUM_Neo_Great_Works:"大营宫室"
 SUM_Neo_Great_Works_desc:"须弥立下大志，要在雨林与沙漠之间修一座长桥，让两处往来不必绕远路。工匠量了地形，在图上画了又画，改了七回。这桥修成，便把两块地缝在一处。桥影倒在水里，站在一头，能望见另一头。"
 SUM_Neo_Public_Schools:"广开义塾"
 SUM_Neo_Public_Schools_desc:"须弥广设蒙学，教平民子弟识字读书，不再是有钱人家独享。穷苦人家把孩子送来，先生一丝不苟地教。有个卖柴的把娃送到学里，自己蹲在门口等，听娃念书，咧嘴直笑。识字的人多了，国家才有指望。朗朗书声，传到了巷口。"
 SUM_Neo_Irrigation:"绿洲浚渠"
 SUM_Neo_Irrigation_desc:"须弥修了水渠，匠人扛着工具沿村丈量，把活水引到村外，绕过沙丘流进干裂的田里。荒地变成熟田，田亩一寸寸扩开。有个老农蹲在渠边，看着水慢慢渗进土里，笑得合不拢嘴。水利一兴，粮食便多。"
 SUM_Neo_Treasury_Reform:"厘定税章"
 SUM_Neo_Treasury_Reform_desc:"「当真不用加倍了？」老汉把告示看了又看，还是不敢信。「白纸黑字摆着，还能有假？」旁边人推了他一把。原来沙漠百姓从前纳粮要加一倍，如今章程改了，跟雨林那边一律看待。告示贴遍各城，识字的高声念给众人听，沙漠人这才放心把货拿去换钱。"
 SUM_Neo_Mint_Rights:"权操钱冶"
 SUM_Neo_Mint_Rights_desc:"市面上私钱泛滥，须弥下令设局兑换，把私钱一一收回，换上官铸的钱。官炉重开，炉火三日不熄。新钱边上多一道纹，是须弥沙丘的样式。有个钱贩子起初直叫苦，后来见官钱好用，也服了。"
 SUM_Neo_Six_Darshan:"学派合治"
 SUM_Neo_Six_Darshan_desc:"六大学派各有所长，不能再由一派独断学问。教令院里生论、素论、知论、明论、因论、妙论六派并列，各占一席。遇事大家商议着来，谁也压不倒谁。头一回六席坐齐，谁也不肯先开口，后来还是妙论派先咳了一声，众人拾柴火焰高。"
 SUM_Neo_Ruin_Studies:"考稽故墟"
 SUM_Neo_Ruin_Studies_desc:"残墙断壁躺在赤王旧都，学者拿尺子一段段量过去，尺寸记下、图形绘好，还给每段编了号。风沙刮得睁不开眼，擦一擦接着量。一个年轻学者蹲在墙根感慨：「这块砖，年头比咱们的城还久。」手里这一笔，谁也不敢草率。"
 SUM_Neo_Ameta_Study:"阿玛塔枢"
 SUM_Neo_Ameta_Study_desc:"「古人的手艺，到今日又使上了。」老匠捧着机核道。匠人照着古图复刻机核，图纸改了又画，那机核精巧异常，关节处分毫不差，后来竟被用做新神的骨架。"
 SUM_Neo_Remelting:"冶铸得法"
 SUM_Neo_Remelting_desc:"那些废弃多年的旧机关，被送进炉里回炉重造。炉火烧了三天三夜，铁水映红匠人的脸，废铁又成了新器。有个老匠拿新件对着光看了看，笑道：「这叫物尽其用。」会省的人，才会造。"
 SUM_Neo_Print_Press:"梓行活字"
 SUM_Neo_Print_Press_desc:"须弥兴了印书之法，书一本本印出来，价钱大跌，连学徒也买得起。印好的书墨迹未干，就被人抢着拿走。有个穷学生抱着书回屋，一路紧搂着，如获至宝。书便宜了，学问才传得开。"
 SUM_Neo_Managed_Desert:"析沙为省"
 SUM_Neo_Managed_Desert_desc:"沙漠里四个傀儡国，名头各自不同，诏令却都从一处总督府发出。四方的公文同出一源，连字迹都一个样。有个百姓拿着两份告示比了比，嘀咕：「这字，跟那边的一模一样。」百姓只知有总督，不知有国王。这便是换汤不换药。"
 SUM_Neo_Wonder_Tourism:"巨构胜境"
 SUM_Neo_Wonder_Tourism_desc:"净善宫与无郁夷摩宫两处名胜，引得四方旅人慕名而来。有人带着干粮跋涉千里，只为看一眼宫墙；有人支起帐篷，就在宫外住下。有个旅人还把见闻画在纸上，拿回去给人看。名胜，便是国家的门面。"
 SUM_Neo_Festival_Nation:"花神诞祭启幕"
 SUM_Neo_Festival_Nation_desc:"花神诞祭停了多年，如今重新定为国之大典，满城张灯结彩。花铺子连夜赶制花冠，供不应求。有个花匠一边扎花一边道：「这手艺，总算又用上了。」百姓捧鲜花涌上街头，歌乐声不绝。这祭一复，人心便齐。"
 SUM_Neo_Scholar_Free_City:"诸生自市"
 SUM_Neo_Scholar_Free_City_desc:"有个外来的学者住了三年还不肯走，天天泡在书肆里。须弥城如今成了读书人的聚散地，南来北往的都在这里歇脚，客栈住满，书肆生意格外红火。学者云集的地方，便是文明兴盛之所。"
 SUM_Neo_Peace_of_Sands:"沙林辑睦"
 SUM_Neo_Peace_of_Sands_desc:"须弥城与旷野之间，头一回不用刀剑说话，改用言语交涉。从前在沙口剑拔弩张，如今两边各派使者，坐下递茶讲理，从日头说到星出。有个使者端起茶碗道：「这一碗，算结了。」能坐下来谈，总比动刀强。"
 SUM_Neo_Nahidas_Mercy:"草神垂慈"
 SUM_Neo_Nahidas_Mercy_desc:"草神小吉祥草王心怀慈悲，把宽恕二字写进律法。犯了错的人若能悔过，便有改过的机会；便是判了死罪的，也能凭一纸悔过书改判。有个死囚改判当日，捧着文书，跪在地上哭得说不出话。律法之外，还有人心。"
 SUM_Neo_Academic_Mobilization:"学宫尽起"
 SUM_Neo_Academic_Mobilization_desc:"「笔杆子，也扛起了枪。」老学者原本只会握笔，如今也学着扛枪，手都磨出了茧。须弥把读书人也编进队伍：有的做参谋，有的管营造，有的理粮草，有的修器械，各展所长。报国未必只靠笔墨。"
 SUM_Neo_Veteran_Corps:"旧卒成旅"
 SUM_Neo_Veteran_Corps_desc:"拿惯了刀的手去握笔，起先把墨洒得满桌都是，日子久了也就顺当。那些沙场上下来的老佣兵，被送进学堂读书认字，学一门安身的本事。有个老兵课还不散就追着先生喊：「再多教几个字！」刀能放下，书也得当真拿起来。"
 SUM_Neo_Sand_Scouts:"沙碛遣谍"
 SUM_Neo_Sand_Scouts_desc:"沙漠里布下眼线，一队人专替须弥盯着各处沙口，稍有异动便飞报。有个斥候在沙丘后蹲了三日，回来只报一句：「来了五骑。」风吹沙移也瞒不过他们的眼睛。有这些人守着，国门便多了层保障。他们的眼睛，比鹰还尖。"
 SUM_Neo_Ambassador_Voice:"远扬声教"
 SUM_Neo_Ambassador_Voice_desc:"有一回被人抢白，使节不慌不忙翻开卷宗，念出旧约，那人才住了口。须弥遣使四方，七国的议事桌上从此有了它说话的地方。那使者带着书卷货单，逢人便讲须弥的道理，据理力争，从此旁人不敢小瞧。国不与人往来，便发不出声音。"
 SUM_Neo_Refuge_Harbor:"纳彼流离"
 SUM_Neo_Refuge_Harbor_desc:"邻国乱起，流民扶老携幼涌向须弥。须弥开城收留，分粮安置。城门外的粥棚日夜冒热气，有个孩童捧着碗，喝得满嘴是米汤。病倒了便请医者来诊治。收留流民是积德的事，也是添丁的好事。"
 SUM_Neo_Guard_of_Wise:"贤者拥兵"
 SUM_Neo_Guard_of_Wise_desc:"「这营里，只认贤者的令。」守营的把令箭一拦。有位王爷亲自来传令，竟也吃个闭门羹。须弥新设一支军团，只对贤者效忠，旁人纵有兵权也调不动，军纪严明，唯贤者之命是从。效忠一人，终究不如效忠一国。"
 SUM_Neo_Desert_Legion:"赤王总戎"
 SUM_Neo_Desert_Legion_desc:"这支队伍里，大半是沙漠出来的佣兵，惯走沙路，耐得干渴，自带水囊与干粮，走得比谁都快。他们插上旗号，便成了国家的兵。有个老兵拍拍水囊道：「这玩意在，走三天不渴。」草莽也可成劲旅，打起仗来，个个争先。"
 SUM_Neo_War_Economy:"兵兴理赋"
 SUM_Neo_War_Economy_desc:"须弥一声令下，所有工坊尽数改造军械，打造盔甲器械。原先织布的改锻铁，原先制陶的改铸器，连学堂里的匠徒也调来帮忙，日夜赶工。有个织工放下梭子，抓起铁锤，直叫手生。这是要举国之力备战。"
 SUM_Neo_Forest_Militia:"林薮皆戎"
 SUM_Neo_Forest_Militia_desc:"雨林与沙漠各自组织民兵，各守各的地界，互不相扰。雨林人守林，沙漠人守沙，平日倒也相安。遇上外敌，才临时合兵一处，各带各的干粮弓箭。有个雨林民兵同沙漠人分干粮，笑道：「你那饼，倒耐嚼。」守土各有其法。"
 SUM_Neo_Port_Customs:"新关初置"
 SUM_Neo_Port_Customs_desc:"奥摩斯港加了关卡，查得紧了。走私的船只好绕道而行，不敢靠岸。税吏得了赏钱，守得更严，连渔船也要登记造册，一件货物都不许漏。有个渔家老汉叹道：「打鱼也要报账了。」这边一紧，那边便绕。"
 SUM_Neo_Urban_Works:"筑此邦城"
 SUM_Neo_Urban_Works_desc:"须弥城邦的营建，交给妙论派主持。这派人懂结构、会营造，盖房修路样样在行：哪里的墙该加厚，哪里的桥该起拱，他们一看便知。有个老匠量了量墙基，点头道：「这里，得再砌三尺。」盖房子，也要行家。"
 SUM_Neo_Healers_Path:"医门正路"
 SUM_Neo_Healers_Path_desc:"一个老兵醒来，摸着旧伤道：「这些年压在心里的，倒淡了。」须弥的医者会一招引人入梦、抚平心伤的本事。受伤的人睡过去，醒来眉眼舒展，梦里的光景还记得清清楚楚。这治病的法子，果然奇妙。"
 SUM_Neo_Scholar_Exiles:"逋客言旋"
 SUM_Neo_Scholar_Exiles_desc:"当年被流放四方的学者，如今陆续回须弥，身上还带着风尘。进城当日，昔日同窗都来迎接，有人还带了外邦的书回来，讲给众人听。有个老学者拍着同窗肩膀道：「这些年，可算熬过来了。」浪子回头，总是喜事。"
 SUM_Neo_Desert_Amnesty:"宥罪于沙"
 SUM_Neo_Desert_Amnesty_desc:"须弥新下了一道赦令：早先发配到沙漠的人，罪一概免了，都准还乡。有个老汉接到文书，一家人喜极而泣，抱作一团，从此不必在风沙里东躲西藏。老人把那纸文书贴在胸口，哽咽道：「枯木也有今日。」一纸赦令，果真叫枯木重新发了芽。"
 SUM_Neo_Green_Shield:"须弥干城"
 SUM_Neo_Green_Shield_desc:"有一回沙盗夜里偷袭，被守哨的发现，一箭射落了马。须弥在雨林与沙漠间筑起一道防线，像堵绿墙护着两处安宁，岗哨相接、烽火相传，沙盗摸到近前便被乱箭射回。这道防线，是拿人命守着的护身符。"
 SUM_Neo_Twin_Throne:"二王并峙"
 SUM_Neo_Twin_Throne_desc:"须弥如今是两个头：一头草神，一头教令院，各据一端。国家便在两者之间小心行走，哪边也不敢得罪。有个官儿抱怨：「这差事，难做。」两强并立，谁轻谁重难断，最考验本事。草神与院里，各握一半。"
 SUM_Neo_Wilderness_Order:"大荒之世"
 SUM_Neo_Wilderness_Order_desc:"教令院与神龛一齐失势，须弥无可依傍，索性退回旷野，靠部族村社自守。学堂锁了门，神龛冷了香火，众人重拾旧日的弓与锄。有个老族长把弓往肩上一挎：「靠山倒了，咱自己站。」"
 SUM_Neo_Dawn_Of_Teyvat:"提瓦特黎明"
 SUM_Neo_Dawn_Of_Teyvat_desc:"七国的目光都盯着须弥，看它往何处去。须弥不左顾右盼，只管走自己选的路。有人劝它依附大国，有人劝它闭门自守，它都不听。有个使节说了半天，须弥的官儿只回一句：「路，咱自己走。」任凭旁人说。"
 SUM_Neo_Journal_Freedom:"学报自梓"
 SUM_Neo_Journal_Freedom_desc:"「真理不怕辩。」有个小孩拿着两本说法相左的书，翻来翻去，看得比大人还认真。须弥的规矩变了，连错的东西也准印出来，让人自己分辨。书肆里无所不有，读者自行取舍，印错了也不必追究，改日再印一版便是。"
 SUM_Neo_Desert_Governor:"督府镇沙"
 SUM_Neo_Desert_Governor_desc:"沙漠四国表面各有君长，诏令却从同一处发出，连措辞都一个样。四国的王坐在各自的王座上，接的竟是同一道命令。有个臣子把两份诏令一比，惊道：「一字不差！」敢情都是牵线木偶，好手段。"
 SUM_Neo_Mushroom_Harvest:"采此梦蕈"
 SUM_Neo_Mushroom_Harvest_desc:"「烂泥里，也能生宝贝。」老药农采了一筐又一筐，笑道。雨林的腐土里冒出一种新药材，采药人拨开落叶一朵朵摘下，那菌子颜色透亮，据说能治多年的旧病，药铺争着收购。"
 SUM_Neo_Akasha_Shut:"尽闭虚空"
 SUM_Neo_Akasha_Shut_desc:"书页翻得哗哗响。虚空停了之后，须弥人再不能靠那玩艺儿记事，万事得自个儿往心里装。起初大伙儿叫苦连天，嫌麻烦，时间一长也就顺了。有个老妈妈拍着腿笑：「这脑瓜子，倒练灵光了。」从前张嘴就答得出的事，如今非得翻书卷找。脑瓜子老不用，是要钝的。"
 SUM_Neo_Genesis_Delayed:"神功中辍"
 SUM_Neo_Genesis_Delayed_desc:"那造神大计进行到半途，偏卡在一道工序上，怎么也推不动。匠人围着图纸干着急，换了几班人，试了十几种法子，那关节仍旧合不拢。有个工匠把图纸一推：「这玩意儿，比登天还难。」造神原非易事，图纸摊了满桌。"
 SUM_Neo_Sandstorm_Scourge:"风灾为虐"
 SUM_Neo_Sandstorm_Scourge_desc:"「像鬼哭一般。」商人捂着耳朵，听了整整一夜，天亮了还不敢动弹。一场沙暴压顶而来，黄沙漫天，商道被埋，连绿洲都糊住了。商队赶紧躲进岩缝，骆驼卧成一圈、把头埋进沙里，好几日不敢出来。沙暴无情，委实凶悍。"
 SUM_Neo_Green_Alliance:"翠木连盟"
 SUM_Neo_Green_Alliance_desc:"雨林各村与兰那罗结下同盟，人树同心，共守山林。约好的事刻在树皮上，风一吹便作响。兰那罗唱起歌来，村里的孩子都听得懂，跟着哼。歌声一起，林子都跟着响。这同盟，果然奇妙。"
 SUM_Neo_Scholar_Soldier:"儒冠隶伍"
 SUM_Neo_Scholar_Soldier_desc:"那些读过书的学子，如今也扛起枪杆上阵，认真劲儿比谁都足。操练时一板一眼，丝毫不肯偷懒，连睡觉都抱着枪，生怕误了差事。有个同屋的半夜起来，见他还抱着枪，笑道：「你这是读书还是当兵？」读书人认真起来，了得。"
 SUM_Neo_Twin_Capital:"两都并立"
 SUM_Neo_Twin_Capital_desc:"入夜之后，须弥城与奥摩斯港一齐亮起灯火，两处辉映，如双星并耀。港里的船与城里的车，把两处连成一片。有个赶夜路的人远远望见那片灯光，抹了把汗，脚下便有了劲。灯多，便是人多。"

 #################### 等级 / 共振 ####################
 SUM_Neo_Oracle_T1:"无主之秋"
 SUM_Neo_Oracle_T1_desc:"走在须弥街上，你问谁是草神，十个人九个摇头。小吉祥草王这几个字，只在发黄的旧书脚注里偶尔冒个头，连当祭司的都早就转了行。城角一尊落满尘的神像，如今被人用来靠扫帚。神被人忘到这份上，也算遭了一劫。"
 SUM_Neo_Oracle_T2:"神祇咫尺"
 SUM_Neo_Oracle_T2_desc:"第二档，神在边缘。净善宫的门依旧锁着，却有人悄悄在门外放一束花，放下便走，不敢久留，走出老远还回头望一眼。这花虽小，藏着人心。有个守门的武士天天来数那花，数着数着，自己也放了一束。"
 SUM_Neo_Oracle_T3:"神权日隆"
 SUM_Neo_Oracle_T3_desc:"「到底听谁的？」一个百姓在墙下看了半天，挠头道。第三档，神权渐渐立起，草神的教谕开始和教令院的敕令并排贴出，两种声音一齐在须弥响起。两张令贴在同一面墙上，这是要分庭抗礼了。"
 SUM_Neo_Oracle_T4:"神谕方至"
 SUM_Neo_Oracle_T4_desc:"第四档的规矩是：政令先要送到草神案头，点头了才算数，哪怕教令院拟得再好，也得往净善宫跑一趟。有个性子急的官儿想越过这一关，被同僚死死拉住：「你不要命了？」神既执了权，谁还敢先办后报。"
 SUM_Neo_Oracle_T5:"神光下贲"
 SUM_Neo_Oracle_T5_desc:"净善宫那扇门，到第五档总算敞开了。草神从里头出来，成了须弥说一不二的主宰，大小事都揽到自己肩上，六大学派乖乖低头，没人再敢擅专。有位老臣上殿奏事，一眼瞧见上头坐的正是草神，脚下一顿，连忙拜倒。"
 SUM_Neo_Canon_T1:"学宫将颓"
 SUM_Neo_Canon_T1_desc:"「没人听了。」老首座来过一回，见桌上落满灰，拿指头一划，叹道。头一档，学院崩解：教令院再也调不动须弥这盘棋，令发出去却无人执行，威风扫地。书院冷冷清清，讲义蒙尘，首座们各回各家，无人过问。"
 SUM_Neo_Canon_T2:"纲纪日隳"
 SUM_Neo_Canon_T2_desc:"「这纸，留着糊窗吧。」驿使送来的敕令，边境官佐看也不看就往案上一撂。第二档，律例松弛：教令院发的敕令出了城便没人认，成了一张废纸。法不出城，远些的地方索性自己立起规矩来。"
 SUM_Neo_Canon_T3:"学宫守旧"
 SUM_Neo_Canon_T3_desc:"门是开着，可就是不肯多收人。第三档的教令院，只守着旧章程过安稳日子，不再往外伸手。新来的递了三回帖子，回回石沉大海，忍不住叹：「这门槛，是越垒越高了。」里头的人占着位子，日子过得悠哉。"
 SUM_Neo_Canon_T4:"律如霜雪"
 SUM_Neo_Canon_T4_desc:"第四档的厉害，连一声叹气都不放过。有个差役夜里叹气，第二天就被传去问：「你昨夜为何不安？」虚空终端把人说的话全回传上去，一丝不漏，众人开口前都得先掂量。就连梦里说了梦话，也有人记下来。这档铁律，真是严密到骨头缝里。"
 SUM_Neo_Canon_T5:"学宫独尊"
 SUM_Neo_Canon_T5_desc:"第五档，学院至上。教令院成了须弥独一份的意志，旁的声音一概不许有。六派首座唯阿扎尔马首是瞻，连草神的话也要经它过一遍。有个首座提议议一议，被人瞪了一眼，便不言语了。一言堂自此始，再无第二处点灯。"
 SUM_Neo_Combo_Twin_High:"教门合辙"
 SUM_Neo_Combo_Twin_High_desc:"草神与教令院握手言和，须弥一手握神谕，一手执铁律，两样都拿在手里：草神管人心，教令院管规矩，各不越界。头一回两会同堂，草神笑了笑，阿扎尔也拱了拱手，倒也相安。这般局面少见。一手慈悲，一手规矩。"
 SUM_Neo_Combo_Twin_Low:"大荒之世"
 SUM_Neo_Combo_Twin_Low_desc:"学院与神龛一齐失势，须弥退回旷野，只靠部族村社抱团自守。村长与首领聚在篝火边议事，一坛酒传了一圈。有个老村长把酒碗往地上一顿：「往后，各顾各，也顾大家。」没了靠山，只得自己撑着。弓箭和锄头，又成了宝贝。"
 SUM_Neo_Combo_A_High:"神木自尊"
 SUM_Neo_Combo_A_High_desc:"老首座把改过的章程翻来覆去看，一个劲摇头：「一夜之间，全翻了个个儿。」如今的局势是神谕压着敕令，教令院只好退到草神身后，再不敢抢在前头。草神开口，六派就得动章程。从前院里做主，如今掉了个头，主次既定，老规矩便翻了篇。"
 SUM_Neo_Combo_B_High:"以律绳院"
 SUM_Neo_Combo_B_High_desc:"敕令压过神谕，须弥一切都按律条办，半步不逾矩。草神的教谕束之高阁，阿扎尔说一不二，六派首座唯唯诺诺。有回草神递句话进去，也排了三日才批下来。这般死板也有好处：草神的话，也得排队等候。"

 #################### 新闻 ####################
 SUM_Neo_News.1.t:"九响闻天"
 SUM_Neo_News.1.d:"花神诞祭这一日，须弥城里锣鼓敲得震天响。但见教令院前的高塔下，分作两班人：一班是衣冠齐整的学者，捧着书卷，站得笔直；一班是市井的百姓，挎着篮子，踮脚张望。中间隔着一道石阶，你望着我，我望着你，谁也不肯先迈过去。原来那桩人人肚里明白的事，小吉祥草王至今还锁在净善宫里，这件事谁敢头一个说将出来？有胆大的后生，往石阶上踏了半步，被身旁的老人一把扯住，低声喝道休要造次。那后生只得缩回脚。街角卖花的摊子，今日生意格外好，人们买了花，却不知该往何处献。日头渐渐西斜，净善宫那两扇门，依旧关得死死的，门环上落了一层薄灰。日头落尽，街上的话头还没散，一路传到奥摩斯港去。"
 SUM_Neo_News.1.a:"阅"
 SUM_Neo_News.2.t:"净善宫门始辟"
 SUM_Neo_News.2.d:"是日，净善宫前聚了黑压压一片人，都为着同一桩事。忽然宫门内传来一阵响动，两扇尘封多年的大门，竟被人从里头缓缓推开。这门已经五百年不曾为外人开过。众人踮起脚，伸长了脖子，只见一位小小的身影，从幽暗的殿里走了出来。那正是小吉祥草王。她被囚了五百年，如今头一回站在正午的日光底下，阳光落在她身上，晃得人睁不开眼。有那老妇人，当场便抹起泪来，口中念叨，苦了我可怜的草王。旁边的学者却张着嘴，半晌说不出话，从前他们在书里读过的名字，如今竟活生生站在眼前。有那孩子，被大人举在肩头，睁着大眼，直说那身影小得可怜。人群里静了片刻，忽地爆发出一阵欢呼，有人跪下磕头，有人把花高高举起。有分教：五百年暗无天日，一朝重见天光。"
 SUM_Neo_News.2.a:"阅"
 SUM_Neo_News.3.t:"六派列席"
 SUM_Neo_News.3.d:"六大学派的首座们，这一日为了排座位的事，在议事厅外争了整整一天。看那廊下，六把椅子一字排开，首座们却谁也不肯先坐。这个说我这一派立派最早，该坐首位；那个说我这一脉弟子最多，理当我先。你一言，我一语，争得面红耳赤，唾沫横飞。有上了年纪的，捋着胡子搬出古老规矩；有年轻的，索性把袖子一挽，就要理论高低。六个人从日上三竿争到日头西沉，椅子还是空着，谁也没坐成。旁边伺候的书记官，站得腿都酸了，手里那本名册翻了一遍又一遍，到底也没记下个座次。有几个好事的，索性搬来板凳，坐在廊下看这笑话，一边嗑着瓜子。有路过的学生，偷看一眼，掩嘴直笑，被首座瞪了一眼，吓得赶紧低头走开。"
 SUM_Neo_News.3.a:"阅"
 SUM_Neo_News.4.t:"张帜于碛"
 SUM_Neo_News.4.d:"列柱沙原上，是日竖起了一面旗。那旗是大红底子，金线绣成，迎着风猎猎作响，正是镀金旅团的旗号。原来教令院在要道上设了税卡，凡过往商队，一律要缴钱。镀金旅团的人马占了这片沙原，便与那税卡对上。有精明的商队头目，远远望见税卡的影子，把缰绳一勒，领着驼队拐进旁边的沙沟，绕道走了。守卡的兵丁望见远处尘烟，追将出来，那驼队早转过两道沙丘，连影子都不见了，只留下一串深深浅浅的蹄印。税吏气得直跺脚，却也无奈。那旗底下，还摆着几坛酒，佣兵们边喝边笑，全不把税卡放在眼里。镀金旅团的佣兵们抱刀坐在旗底下，看着驼队远去，发出一阵哄笑。有分教：明处税卡拦路，暗处沙道绕行，这税究竟收不收得到，还要看本事。"
 SUM_Neo_News.4.a:"阅"
 SUM_Neo_News.5.t:"虚空回响"
 SUM_Neo_News.5.d:"须弥城里，新近兴起一件怪事。人人都戴上了那虚空终端，把平日里说过的话，一一回传出来。学者们见了，欢喜得不得了，说这是天大的进步，古人做梦都想不到。可商人们却各自心里打鼓。有开铺子的，当着人面说了句价钱，转个身便听终端里原样念了出来，惊得手里算盘都掉了。你道怎的？原来这终端专把人说过的话，一字不落地传出去，连一句私话也不肯放过。商人们慌了神，凑在一处商议，也想不出个长法。有几个老成的，索性把要说的话都写在纸上，连嘴都不敢张。偏有个性子急的，趁人不备，捡起一块石头，硬生生塞进终出声口，那声音立刻闷了下去。旁人见了，先是一愣，继而纷纷效仿，不出半日，城里半数终端都塞了石头。"
 SUM_Neo_News.5.a:"阅"
 SUM_Neo_News.6.t:"神造之说"
 SUM_Neo_News.6.d:"教令院的地下，这些日子常在夜里传出声响。那声音低沉，嗡嗡作响，间或夹杂着齿轮咬合的咔咔声，听久了，教人心里发毛。有几个值夜的学者，壮着胆子，顺着石阶往下探。走到底下，只见一道厚厚的石门，门缝里透出微光，那声响正是从门后传来。众人你看看我，我看看你，谁也不敢上前。第二日，他们把这桩事禀报给贤者。贤者端坐在议事厅里，听罢，慢悠悠地说，那不过是地下的风，不必大惊小怪。几个学者听了，面面相觑，其中一个忍不住低声道，那分明是机括转动，怎的像是风？这话被贤者听见，瞪了一眼，那学者便不敢再言语。有几个胆小的学者，夜里索性蒙头大睡，假装什么也没听见。夜里，那声响依旧，嗡嗡地响个不停。有分教：地底机声隆隆，堂上偏说是风。"
 SUM_Neo_News.6.a:"阅"
 SUM_Neo_News.7.t:"二席宵临"
 SUM_Neo_News.7.d:"是日，愚人众的车队浩浩荡荡驶入须弥城。打头的是几辆漆黑的马车，车帘垂得严严实实，车上插着愚人众的旗号，为首的正是第二席。守城的兵丁远远望见，早吓得站直了身子，连大气也不敢出。这第二席来路非凡，惹不起。说不定何时，那车帘一动，露出半张脸来，围观的人便赶紧低下头。城里管事的，为了迎接这位贵客，早早便吩咐下去，把城门口摆的鲜花，尽数换成了新的。只见那花一色儿的新鲜，红的红，白的白，排得整整齐齐，香气扑鼻。有卖花的老汉，本来守着自己的摊子，被差役一顿催促，只好把自己最好的花也搬了去，心里心疼，嘴上却不敢说。车队进城后，城门口的花，就那样新鲜地摆着。"
 SUM_Neo_News.7.a:"阅"
 SUM_Neo_News.8.t:"奥摩斯港樯立"
 SUM_Neo_News.8.d:"奥摩斯港，如今繁华。是日，港里的船挤得满满当当，泊位一直排到灯塔之外。后来的船只，只能在港外抛锚，等着空位。看那桅杆，一根挨一根，密得像树林。最奇的是，那些船上挂的旗，竟是七国各具，红的、蓝的、白的、金的，五颜六色，都挂在同一片桅杆上，随风飘扬。有蒙德的风车旗，有璃月的岩纹旗，有稻妻的雷纹旗，还有至冬、枫丹、纳塔的旗号，一面面搅在一处。码头上的工人扛着货，来来往往，吆喝声、号子声，响成一片。有初来乍到的水手，看得眼花缭乱，感叹道，好大阵仗，七国的船，竟挤在一处。旁边的老搬运工擦了把汗，笑道，这算什么，再过几日，怕是灯塔外头也停不下了。"
 SUM_Neo_News.8.a:"阅"
 SUM_Neo_News.9.t:"沙海轨成"
 SUM_Neo_News.9.d:"须弥城外，新造出一条铁轨，铁轨上跑着一样新奇物件，叫做火车。这一日，第一列火车要试跑，消息传开，满城的人都赶来看稀罕。但见那火车，一节接着一节，铁皮打造，冒着一缕白烟，突突突地响。随着一声长鸣，火车缓缓开动，越跑越快，转眼便把城甩在身后。看那沿路的人，有的追着跑，有的骑马跟，孩子们更是欢呼雀跃。火车一路向沙漠方向驶去，穿过戈壁，越过沙丘，不多时，便抵达列柱沙原边缘的一片绿洲。车上的人下了车，个个赞不绝口，说这铁家伙了得，比骆驼快了十倍不止。绿洲里的居民，从没见过这等东西，远远围着看，小孩胆大的，还伸手去摸那冰凉的铁轮。列位"
 SUM_Neo_News.9.a:"阅"
 SUM_Neo_News.10.t:"世界树微言"
 SUM_Neo_News.10.d:"夜深人静之时，那世界树竟发出声响来。巡林官值夜，远远听得那声音，似人低语，又似叹息，一阵一阵，随风飘来。他心中诧异，悄悄走近，只见那大树纹丝不动，枝叶却似在轻轻颤动。第二日，巡林官把这事禀报上去，口中说道，那分明是树在说话。教令院听了，却不以为然，只说那是夜风穿过枝叶，何足为奇。两下里各执一词，谁也说服不了谁。有好事的学者，夜里特地跑到树下，屏息听了半宿，回来说，那声音确乎不像风，倒像是有人在里面低低念叨。可这话传到教令院，又被当作妄言。巡林官见说不通，只得叹气，仍旧每夜去听。这树究竟说没说话，无人能断。"
 SUM_Neo_News.10.a:"阅"
 SUM_Neo_News.11.t:"别筑神栖"
 SUM_Neo_News.11.d:"净善宫的正殿，这些日子新立起一座神座。那座儿雕得精美，镶金嵌玉，端的是气派非凡。可怪就怪在，须弥人看了，竟说不清那上头坐的到底是谁。有老成的，进殿瞻仰一番，出来时被众人围住问，只摇头道，看不真切。有胆大的，大着胆子走近，抬头细看，越看越糊涂，那神像的面目，似曾相识，却又分明陌生。有大胆的，竟伸手去掀帷幔一角，却被守殿的人厉声喝退。有说是草神的，有说是别的什么大人的，众说纷纭，没个准话。这座儿立得蹊跷，来路不明，叫人心里犯嘀咕。殿里的香火，倒是日日有人上，只是上香的人，拜完便走，谁也不敢多留。有分教：一座新神座，满城猜不休，说不清坐的是哪位，只道是须弥的难言之隐。"
 SUM_Neo_News.11.a:"阅"
 SUM_Neo_News.12.t:"须弥定策"
 SUM_Neo_News.12.d:"须弥到了这般地步，站在了岔路口上。看那面前，摆着三条路：一条通向书院，那里书声琅琅，学者们埋头经典，把学问看得比天还大；一条通向圣树，那里树影婆娑，草王的低语在叶间回荡，仿佛在召唤什么；还有一条通向王座，那里金光闪闪，权柄在手，号令七国，威风。这三条路，条条都关乎须弥的国运，轻忽不得。三条路摆在执政者面前，一条也舍不得丢，可又明知只能择其一。执政者坐在殿上，望着那三条路，久久不语。议事厅里，众人争来争去，各有各的主张。这个说学问是立国之本，那个说神意不可违背，还有的说，须弥当执牛耳，方能扬眉吐气。争到后来，谁也说服不了谁，只把难题留给了当权的人。"
 SUM_Neo_News.12.a:"阅"

 #################### 镀金沙漠 ####################
 #### 序章 · 藩属之影 ####
 SUM_SGD_PRO_Shadow_of_the_Suzerain:"藩服阴霾"
 SUM_SGD_PRO_Shadow_of_the_Suzerain_desc:"镀金沙漠的城门归教令院管，税册归教令院写，连城门的钟敲几下，也得照雨林发来的公文办。沙子记得每一任总督的名字，总督们却连沙丘朝哪边长都懒得问。有个老总督风量了量风向，笑道：「咱守的是别人的门。」自家门口，倒像个客人。"
 SUM_Neo_SGD.1.t:"藩服阴霾"
 SUM_Neo_SGD.1.d:"镀金沙漠的那座城，城门归教令院管，税册归教令院写，连城门口那口钟，每日敲几下，也要照着雨林发来的公文办，半点做不得主。这城里的规矩，都是从雨林来的。沙子是有记性的，一任又一任总督的名字，都印在沙里，风吹不掉；可那些总督老爷，却连城外的沙丘朝哪边长，都懒得问一声。有新来的总督，走马上任，先不问民生，只把税册翻了又翻，惟恐少收了一文。城里的老居民，看着一张张陌生的面孔来了又去，摇着头说，这些老爷，眼里只有税册，哪有沙漠。那钟敲起来，一下一下，不紧不慢，仿佛在数着总督们来的日子。那口钟照旧每日敲响，声音在沙城里回荡，听着像是替谁数着日子。"
 SUM_Neo_SGD.1.a:"循教令院发下的旧例"
 SUM_Neo_SGD.1.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Tax_Ledger:"籍帐书沙"
 SUM_SGD_PRO_Tax_Ledger_desc:"税吏把名目抄了满满一卷，从水井到骆驼铃铛，样样都算一份。卷子往城墙上一贴，城民围着看，才知道自家一年要交几回、交几样。有个老汉数着数着笑出声，笑着笑着又不笑了，扭头问道：「这铃铛，也算一份？」税吏道：「写着呢。」"
 SUM_Neo_SGD.2.t:"籍帐书沙"
 SUM_Neo_SGD.2.d:"那税吏，为了把税目理清楚，把名目抄了满满一卷。你道这卷上有多少名目？从城里的水井，到骆驼脖子上的铃铛，但凡能沾上边的，都算作一份，无孔不入。抄完这一卷，税吏自己先念了一遍，念得口干舌燥。城里的百姓见了，也没个章程，索性把那一卷贴在墙上，日日看着，好歹知道自己一年里要交几回钱。墙根底下，天天围着一群人，指指点点，议论不休。有识字的，蹲在墙根，一项一项念给不识字的邻人听，念一项，众人便叹一声。念到后来，有人忍不住骂道，连驼铃都要交钱，这税刮到了骨头缝里。旁人赶紧捂住他的嘴，怕被官署听见。那卷纸贴在墙上，日晒风吹，渐渐泛黄卷边，可上头的名目，一个字也抹不掉。有分教：一张税卷贴墙上，字字都是血汗钱。"
 SUM_Neo_SGD.2.a:"把账目封存"
 SUM_Neo_SGD.2.b:"把账目摊开"
 SUM_SGD_PRO_Governor:"教令院都督"
 SUM_SGD_PRO_Governor_desc:"「我连它朝哪边长都不知道。」老总督卸任当日站在城头望着沙丘，叹道。总督由雨林指派，三年一任，任里最大的政绩就是把税收齐，收得齐有奖，收不齐换人。至于沙漠怎么过活、井里还有没有水，公文上一个字不问。"
 SUM_Neo_SGD.3.t:"教令院都督"
 SUM_Neo_SGD.3.d:"这沙漠城的总督，来头不便，都是由雨林指派下来的，一任三年。三年里头，他最大的政绩，便是把税如数收到手里，一文不短。至于这沙漠里的人怎么过日子，井里有没有水，田里长不长粮，公文上从来不问一句。那总督初来时，也曾在堂上信誓旦旦，说要体恤民情。可真到任上，每日里只盯着税册，谁交得多，谁便是有功的良民；谁交不上，便差人去催，催得鸡飞狗跳。有上进的，还把收税的数目刻在石碑上，算作自己的功德。城里的百姓，见总督换得勤，三年一换，来去匆匆，连个面熟的都留不下。有那老人叹道，铁打的沙漠，流水的总督，他们要的，是沙里的金子，不是沙里的人。"
 SUM_Neo_SGD.3.a:"按官署的判断行事"
 SUM_Neo_SGD.3.b:"按自己的判断行事"
 SUM_SGD_PRO_Garrisons:"林疆屯锐"
 SUM_SGD_PRO_Garrisons_desc:"本地人实在瞧不过去，拽着新兵袖子道：「跟我走！」城墙上是外处调来的兵，口令用雨林口音喊，喊得城下人一愣一愣。守城门他们在行，城里的路却认不得，问口水井在哪儿都得找人领。真有风吹草动，他们先迷了路。"
 SUM_Neo_SGD.4.t:"林疆屯锐"
 SUM_Neo_SGD.4.d:"那城墙上站岗的兵，都不是本地人，乃是从别处调来的。他们口里的口令，用的是雨林的口音，喊将出来，城里的百姓听不懂，只当是鸟语。看那兵丁，一个个荷枪实弹，脸色生硬，站在城头，是威风。那口音喊将出来，硬得像嚼了沙子，百姓听了只觉得好笑。可他们守得住城门，却认不出城里的路。有那百姓问路，兵丁翻着眼睛，半晌指不出个方向。有一回，一队兵奉命去城里拿人，转来转去，竟在巷子里迷了路，最后还是一个当地的孩子，把他们领到了地方。城里的老居民看了，暗暗发笑，说这些兵，守着城，却连城都不认得。那口音古怪的口令，每晚照旧在城头响起，一声接一声，在沙漠的夜空里散开，听着倒有几分凄凉。"
 SUM_Neo_SGD.4.a:"先看住脚下的城"
 SUM_Neo_SGD.4.b:"先看住远方的人"
 SUM_SGD_PRO_Censor_Eyes:"沙间置耳"
 SUM_SGD_PRO_Censor_Eyes_desc:"「好，好，嘴严。」茶客被请去喝了回茶，回来后再不敢多言，旁人问茶好不好，他只这么答。官署在各处路口都安插了人，一件褂子、一顶斗笠往墙角一蹲，就记下谁说了什么、谁见过谁。记性太好的人，这年头可不是好事。"
 SUM_Neo_SGD.5.t:"沙间置耳"
 SUM_Neo_SGD.5.d:"那官署，手段厉害，在各处路口，都安插了人。众人装作闲逛的、卖杂货的，眼睛却四处乱转，把谁说了什么话、谁见了什么人，一一记在心里，回头便去禀报。这年头，记性太好的人，不算好事。城里有爱说话的，前脚在茶摊上发了两句牢骚，后脚官署便找上门来，吓得他再不敢张口。茶摊的老板娘，也学会了少说两句，只管低头做生意。有谨慎的，索性把嘴闭得紧紧的，与人相见，也只点头，不敢多言。偏有个老实的货郎，见人就爱打招呼，见谁都记着名，结果被请去问了几回话，出来时脸都白了。从此他学乖了，见了熟人也低头走。那些放在路口的人，依旧日日转悠，眼睛盯着来来往往的行人。有分教：路口处处有耳目，多记一句话，便多一分祸。"
 SUM_Neo_SGD.5.a:"循教令院发下的旧例"
 SUM_Neo_SGD.5.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Petition:"投牒诉冤"
 SUM_SGD_PRO_Petition_desc:"有位长者跪在官署门口递状纸，一跪三日。递到第三回，风起，状纸被吹走一半。他扑地去捡，捡回来的半张也没人接。长者把纸按在膝上，一遍遍抹平，抹了半晌，起身走了，嘴里念叨：「留着，留着总能递上去。」"
 SUM_Neo_SGD.6.t:"投牒诉冤"
 SUM_Neo_SGD.6.d:"城里有一位长者，家中遭了冤屈，要去官署递状纸。那老人白发苍苍，拄着拐杖，跪在官署门口，双手把状纸高高举起。头一回递上去，里头的人看也不看，摆摆手赶他走；第二回，他又跪了半日，还是没人理；到了第三回，一阵风刮过来，把那状纸吹走了一半，剩下的半张，被他死死攥在手里。老人膝行几步，把那半张纸再递将上去，可门里的差役，只探头看了一眼，便把门关了，任凭老人如何磕头，也不再来。那半张状纸，风一吹，又从老人手里飘落，落在台阶下的沙尘里。老人怔怔地看着，半晌，才慢慢弯下腰，把它捡起来，揣进怀里，颤巍巍地走了。这状纸递了三回，端的连一张也没递进去。"
 SUM_Neo_SGD.6.a:"把账目封存"
 SUM_Neo_SGD.6.b:"把账目摊开"
 SUM_SGD_PRO_Old_Road:"古道行商"
 SUM_SGD_PRO_Old_Road_desc:"商队走的还是赤王年间就有的旧道，驼铃一响，一串人影沿着沙脊走。一路上没有一块界碑写着雨林的名字。风把旧年车辙抹了又露，露了又抹。有个老向导拍了拍路边的石头道：「这条道，比官署老得多。」众人听了，都肃然起来。"
 SUM_Neo_SGD.7.t:"古道行商"
 SUM_Neo_SGD.7.d:"那沙漠里的商队，走的仍是赤王年间就有的旧道。这条道，祖祖辈辈走了千百年，沙丘认得，骆驼认得，连石头缝里的草都认得。可这一路上，从头到尾，竟没有一块界碑写着雨林的名字。这旧道本是沙漠自己的路，与雨林无干，如今城门虽归了雨林管，这路却还是那条路。有那老向导，骑在骆驼上，指着路边的断石说，从前赤王在位时，这道上立着碑，碑上刻着古字，如今碑倒了，字也埋了，只剩商队的蹄印，一层叠一层。有上了年纪的驼夫，每回路过，也要在断石旁歇一歇脚。年轻的商人听了，只管催着赶路，哪里肯听这些旧话。驼铃叮当，响在空荡荡的沙道上，仿佛在替那条古老的路，低低地唱着挽歌。"
 SUM_Neo_SGD.7.a:"按官署的判断行事"
 SUM_Neo_SGD.7.b:"按自己的判断行事"
 SUM_SGD_PRO_Oasis_Well:"洲泉喷玉"
 SUM_SGD_PRO_Oasis_Well_desc:"「急什么，签还没到我呢。」前头的人回过头来。挑水的天不亮就排队，队伍从井台一直排到巷口，桶碰桶地响，有个后生等了半个时辰问前头快了没。绿洲的泉是全城命根，水权却攥在官署手里，一瓢一瓢都得凭签，轮到谁，谁把签往井栏上一搁。"
 SUM_Neo_SGD.8.t:"洲泉喷玉"
 SUM_Neo_SGD.8.d:"那绿洲的泉，全城的命脉。城里的百姓，吃水用水，全靠这一汪泉水。可这水权，偏偏攥在官署手里，百姓要用，得看官署的脸色。看那泉边，天还不亮，挑水的人便排起了长队，扁担靠在肩上，水桶搁在脚边，一个挨一个，弯弯曲曲排了半条街。那排队的队伍里，有妇人头顶着水罐，一等等到日头老高。有勤快的，半夜就来，也只排在中间；来晚的，只好等着日头升高，水渐渐浑了，才轮得到。看管泉口的差役，坐在阴凉处，摇着扇子，慢悠悠地放行，谁要给钱，便往前挪几位。有性子急的，忍不住抱怨两句，立刻被旁边的人拉住，低声道，休要作声，这水还得挑呢。众人只得忍气吞声，默默地往前挪。有分教：一泉养活全城人，水权却攥官署手。"
 SUM_Neo_SGD.8.a:"先看住脚下的城"
 SUM_Neo_SGD.8.b:"先看住远方的人"
 SUM_SGD_PRO_Salt_Field:"卤田薄获"
 SUM_SGD_PRO_Salt_Field_desc:"盐碱地里只能种些耐旱豆子，苗稀，荚瘪，收成薄得叫人心疼。可税是一样的税，一粒不短。有个农人蹲在田埂上，捏着一把瘪豆，叹道：「这点收成，全交了还不够。」他把薄年景一笔笔记在心里，不写纸上，纸上写了也没人看。"
 SUM_Neo_SGD.9.t:"卤田薄获"
 SUM_Neo_SGD.9.d:"那盐碱地里，种不出什么好庄稼，只能种些耐旱的豆子。那豆子结得稀稀拉拉，收成薄得可怜，可交的税，却和丰年一样，一文也不少。这年头，种地的人难。有那老农，蹲在地头，捻着几粒瘪豆，皱着眉直叹气，可向官署纳粮的数目，却半分也短不得。有交不上粮的，只好把种子也交了去，来年拿什么下种，却顾不上了。交不上税，差役便提着锁链上门，牵走家里仅有的牲口。农人们心里苦，却没处说，只好把那薄收的年景，一笔一笔记在心里，却不写在纸上。有识字的，想写，也被家里人拦住，说写了便是把柄，反倒惹祸。田里的豆子，一年薄过一年，可税册上的数目，年年照旧。"
 SUM_Neo_SGD.9.a:"循教令院发下的旧例"
 SUM_Neo_SGD.9.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Bazaar:"市列钧衡"
 SUM_SGD_PRO_Bazaar_desc:"「买不买？不买靠边！」摊主把秤砣往台上一磕，瞪着眼。有个外乡客不服，要过秤来看，只得把话咽了。集市的秤年年换，越换越沉，一斤能称出八两，买卖人心里有数嘴上不说，只把袖里的手攥紧些。"
 SUM_Neo_SGD.10.t:"市列钧衡"
 SUM_Neo_SGD.10.d:"那集市上的秤，年年都要换新的。你道为何？原来那秤，一年比一年沉，称起货来，同样的东西，称出的分量却一年比一年多。买东西的人，明明称着够了数，回家一比，却发现亏了不少。可这秤是官署定的，谁敢说个不字？买卖的人，心里都有数，嘴上却谁也不说。有精明的，自己带杆私秤，两下里一比，便知吃了亏，却也只是苦笑，把那点亏，算在价钱里头。有个老实巴交的卖油郎，被那秤坑得多了，忍不住嘀咕了一句，立刻被旁边的老主顾使眼色止住。集市上依旧熙来攘往，吆喝声不断，人人都作出一副和气的模样。这秤越换越沉，把那点亏心，都藏在了秤星里。有分教：秤星年年沉，人心日日明，只是不敢说。此事非同小可。"
 SUM_Neo_SGD.10.a:"把账目封存"
 SUM_Neo_SGD.10.b:"把账目摊开"
 SUM_SGD_PRO_Pathfinder:"老马识途"
 SUM_SGD_PRO_Pathfinder_desc:"只有土生土长的向导认得沙丘每年挪到哪，抬眼看一看风，便知道路在哪边。雨林来的测绘队画了三年地图，标得密密层层，还是走丢过两回。有一回困在沙里，还是向导寻来的。后来队里干脆出钱，请向导带路。"
 SUM_Neo_SGD.11.t:"老马识途"
 SUM_Neo_SGD.11.d:"那沙漠里的沙丘，年年都在挪动，今日的路，明日便可能变了模样。只有土生土长的向导，才认得那沙丘每年挪到哪里，闭着眼睛也能找出路来。可雨林来的测绘队，偏偏不信这个。他们带着罗盘、仪器，画了整整三年的地图，自以为把每一道沙丘都标得清清楚楚。谁知这沙丘，偏偏不听地图上那一套，一夜大风，便挪了地方。测绘队照着地图走，走丢过两回，有一回险些渴死在沙里，多亏了当地向导，循着骆驼的足迹，才把他们找了回来。那向导骑着骆驼，笑眯眯地说，这沙是会走路的，地图画得再好，也追不上它。那些仪器，也被风沙磨得锈迹斑斑，成了摆设。测绘队的人听了，满脸通红，却也无可奈何。"
 SUM_Neo_SGD.11.a:"按官署的判断行事"
 SUM_Neo_SGD.11.b:"按自己的判断行事"
 SUM_SGD_PRO_Red_King_Column:"赤王石表"
 SUM_SGD_PRO_Red_King_Column_desc:"石柱在沙里露着半截，上面的字没人认得，连老书生也只摇头。可路过的人都会伸手摸一摸，摸完在衣襟上蹭蹭手，谁也不说什么。有个孩子要摸，被爹一把按住：「别碰，老祖宗的东西。」风把柱上的沙吹了一层，又落一层。"
 SUM_Neo_SGD.12.t:"赤王石表"
 SUM_Neo_SGD.12.d:"那沙漠里，随处可见半截石柱，从沙中斜斜地露出来。石柱上刻着弯弯曲曲的古字，年月久了，风沙磨得模糊，如今再也没有人认得。可怪就怪在，凡是从这里路过的人，不论商队还是驼夫，都会伸出一只手，在石柱上摸一摸，仿佛这样便能讨个吉利。有胆小的，摸完还要合十拜一拜，口中念念有词。有老成的，摸一把石柱，抬头望望，摇摇头说，这上头的字，怕是赤王年间的，如今认得的人，都没了。年轻人听了，只当是老人说古，摸一摸便跟着队伍走了。那石柱就那样立着，一半在沙里，一半在外头，任凭风吹日晒，任凭人来人往，默默地看着这沙漠里的悲欢。有分教：石柱半埋沙，古字无人识，路人摸一把，各有一桩心事。这话儿说长了，暂且按下。"
 SUM_Neo_SGD.12.a:"先看住脚下的城"
 SUM_Neo_SGD.12.b:"先看住远方的人"
 SUM_SGD_PRO_Scarlet_Slate:"沙中石牒"
 SUM_SGD_PRO_Scarlet_Slate_desc:"有商队从遗迹里带出几块石板，官署说是赃物，要没收。商队不肯，官署便封了货栈，扣了人。领头的在门口喊冤：「这是俺们挖的！」没用。石板末了还是抬进官署库房，从此谁也没再见过。赃物进了库房，便成了公物。"
 SUM_Neo_SGD.13.t:"沙中石牒"
 SUM_Neo_SGD.13.d:"有一支商队，路过一处古遗迹，从里头带出几块石板。那石板上刻着古纹，沉甸甸的，有些年头。消息传到官署，官署当即派人来，说这是从遗迹里盗出的赃物，要尽数没收。商队的人辩解说，这是捡的，不是偷的，可哪里辩得清？石板还是被一车拉走了，进了官署的库房。那库房门禁森严，寻常人进不去。石板进去之后，便再也没有人见过。有好事的，隔些日子便去打听，官署只推说封存着，待将来查验。日子一久，这事便渐渐凉了，石板的事，也没人再提。有人说，那石板上的古纹，说不定记着什么了不得的秘密；也有人说，不过是几块破石头。到底如何，无人知晓。这才是头一桩。"
 SUM_Neo_SGD.13.a:"循教令院发下的旧例"
 SUM_Neo_SGD.13.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Tomb_Slab:"发冢者辞"
 SUM_SGD_PRO_Tomb_Slab_desc:"掘墓人被抓住，审了三夜，鞭子抽断两根。他交代遗迹里的机关怎么开、哪道门会塌，一句不提金子去了哪。问到第三夜，他抬起头，脸上全是血，说道：「我若知道金子在哪，还掘什么墓？」审的人一愣，鞭子举在半空，没落下去。"
 SUM_Neo_SGD.14.t:"发冢者辞"
 SUM_Neo_SGD.14.d:"有几个掘墓的贼，摸进沙漠深处的遗迹，想刨些值钱的东西。谁知那遗迹里机关重重，他们才挖开一处甬道，便触动了机关，被守在那里的人当场拿住。官署把这伙人抓回去，审了整整三夜。那三夜里，刑讯的动静，隔着几条街都听得见。众人原本以为，这帮贼必是刨出了金子，交代的自然是金子的去处。谁知审到最后，那几个贼交代的，竟全是遗迹里机关的布置，这里有个暗弩，那里有道陷坑，一五一十，说得清清楚楚。问到金子，却都说没见着什么金子。这出乎众人意料。审案的官，起初不信，反复拷问，那几个贼翻来覆去，只有一句话，机关倒是见了不少，金子却没摸着。有分教：三夜审贼问金子，贼却只说机关多。有道是，早备一日，少愁十日。"
 SUM_Neo_SGD.14.a:"把账目封存"
 SUM_Neo_SGD.14.b:"把账目摊开"
 SUM_SGD_PRO_Staff_Scarlet:"沙杖之纪"
 SUM_SGD_PRO_Staff_Scarlet_desc:"「那杖，如今落在何处？」后生忍不住问，老辈人吧嗒着烟，偏不答。老一辈传说赤王有根杖，杖尖指处沙裂水涌，枯井也能出甘泉；年轻人撇嘴说哄小孩的，可一到夜里还是围着火听，听得眼里放光。"
 SUM_Neo_SGD.15.t:"沙杖之纪"
 SUM_Neo_SGD.15.d:"沙漠深处的阿如村，每到夜里，篝火边便围满了人。老辈人捧着水烟袋，慢悠悠讲起赤王的旧事，说赤王当年有一根神杖，杖头往沙地轻轻一点，沙子便向两边裂开，清水汩汩涌将上来，荒滩转眼化作绿洲。几个年轻人嘴上撇着，笑这是哄娃娃的闲话，说谁真见过什么神杖。可到了夜深人静，一个个却把身子往前挪，连大气也不敢出，眼睛直盯着火堆，只怕漏听半句。有个孩童追问杖尖落在何处，老人抬手一指远处黑黢黢的沙丘，众人便都回过头去望，仿佛那沙丘当下就会裂开一般。这杖是真是假，谁也讲不明白，可沙漠里的人，心底都盼着有一日沙真能开、水真能来，好教子孙不再受这干渴之苦。"
 SUM_Neo_SGD.15.a:"按官署的判断行事"
 SUM_Neo_SGD.15.b:"按自己的判断行事"
 SUM_SGD_PRO_Sand_Worm:"沙底蛰虫"
 SUM_SGD_PRO_Sand_Worm_desc:"商队总绕开固定的几处沙丘，说底下住着东西，驼一近就惊。官署发过公告，白纸黑字说这是迷信，劝人照直走。公告贴出去没几日，绕路的人反倒更多。有个老驼工指着公告笑道：「上头写着别绕，它自己咋不走近？」"
 SUM_Neo_SGD.16.t:"沙底蛰虫"
 SUM_Neo_SGD.16.d:"沙漠里有几处沙丘，商队经过时总要远远绕开，说是底下压着东西，惹不得。官署的老爷听了，只当是乡野迷信，提笔写了一张公告，贴在路口，写明丘下并无可疑，命众人照旧行走。那告示墨迹尚新，贴告示的差役拍拍手便走了，连一眼也不肯多看那沙丘。公告贴出不上三日，绕路的人反倒更多了。原来那几处沙丘，风一吹便有呜呜的声响，夜里像有人低哭，赶驼的老手说，这是沙下的东西在喘气。有个不信邪的年轻人，仗着胆大，硬从丘边赶车过去，回来时脸色煞白，驼铃一声也没敢摇，问他自己看见了什么，他却摇头不肯说，只劝人以后绕道走。官府的一张纸，压不住人心里的怕，越是要人别怕，怕的人越添了十分。"
 SUM_Neo_SGD.16.a:"先看住脚下的城"
 SUM_Neo_SGD.16.b:"先看住远方的人"
 SUM_SGD_PRO_Elder_Fire:"耆宿守燎"
 SUM_SGD_PRO_Elder_Fire_desc:"各部族长老围着火塘议事，火不熄，话不停。谁家水少了，谁家羊丢了，一桩桩摆开来，说到天亮也有。雨林来的官坐在最外圈，捧着茶碗干笑，半天插不上一句。他想开口，刚咳一声，长老们又争起来了，他便把话咽了回去。"
 SUM_Neo_SGD.17.t:"耆宿守燎"
 SUM_Neo_SGD.17.d:"各部族的长老，围着火塘议事，火不熄，话便不停。中间的人们说的是沙里的水草，是驼队的去向，是祖辈传下的老规矩，一句挨着一句，谁也不肯让人。雨林来的官坐在最外圈，身上衣衫齐整，手里捧着公文，那公文上盖着雨林的大印，边角都翻卷了，几次想开口，却被一阵笑声盖了过去。他清了清嗓子，把公文举得高了些，仍旧没人回头。有个年轻长老斜眼瞅了瞅，低声说了句什么，众人便都哄笑起来，笑他不懂规矩，火塘边哪有外人插嘴的份。那官脸上讪讪的，只得把公文卷起收进袖中，闷坐着直到火塘渐冷，末了起身走了，连告辞的话也没人接。这火塘边的位子，坐得进坐不进，不是靠官职，是靠祖上流的血。"
 SUM_Neo_SGD.17.a:"循教令院发下的旧例"
 SUM_Neo_SGD.17.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Blood_Law:"以血立条"
 SUM_SGD_PRO_Blood_Law_desc:"「到了这儿，就按这儿的规矩。」长老说。有个外乡人犯了事，搬出官署律条来争辩，长老只这一句就把他顶了回去。部族的规矩写在血里，犯了事带到长老面前，该罚该逐一句话定。官署律条到了沙丘边就打住，两个章程各管一段。"
 SUM_Neo_SGD.18.t:"以血立条"
 SUM_Neo_SGD.18.d:"部族的规矩，不是写在纸上，是写在血里的。谁家偷了水，谁家越了界，连牛羊踩了别家的草场，也要按老法子赔个明白，事由长老处置，罚羊罚驼，重则逐出族外，众人无有一个不服。有一回，官署的差役拿着律条追到沙丘脚下，要拿人问罪，却被一群牧人团团围住。领头的长老把腰刀往沙里一插，说这丘这边是官署的律条，那丘那边是祖宗的血，井水不犯河水。差役看看那把刀，又看看黑压压的人群，只得悻悻退回。有两个年轻的还追出几步，喊说再敢来拿人，就把他捆了丢进沙窝里。差役头也不回，走得飞快。从此官署的律条，到了沙丘边便打住了。纸上写得再明白，也压不住几百年传下来的老规矩。"
 SUM_Neo_SGD.18.a:"把账目封存"
 SUM_Neo_SGD.18.b:"把账目摊开"
 SUM_SGD_PRO_Bridal_Pact:"纳币要盟"
 SUM_SGD_PRO_Bridal_Pact_desc:"两族结亲便是结盟，聘礼单子开得比条约还长：驼几头、布几匹、盐几袋，一笔不许含糊。有个媒人数着聘礼，念一笔，两边点一次头。成了亲，两家便是一条心，打起来一起上。这一套，官署看不懂，也管不着。"
 SUM_Neo_SGD.19.t:"纳币要盟"
 SUM_Neo_SGD.19.d:"沙漠里的两族结亲，便是结盟。聘礼的单子拉得老长，多少只驼、多少匹马、几口井的使用权，还有几匹上好的驼绒、几坛陈年的枣酒，一样样写得清楚，比官署的条约还周详。迎亲当日，两队人马对歌相和，新郎骑着最壮的骆驼，新娘的头巾上缀满银片，走一步响一片，众人交换了信物，又当众饮过一碗水，从此祸福相共。官署的老爷拿到那张单子，请师爷念了半日，翻来覆去看了半晌，横竖看不懂，说这哪像婚书，分明是一份盟约。可他看不懂，也就管不着，人家结他们的亲，立他们的盟。这沙漠里的道理，往往不在官署的条文里，倒在这一碗水、一纸聘礼中。两家从此认了亲家，逢年过节还要互相送礼，比那盟约还热络几分。"
 SUM_Neo_SGD.19.a:"按官署的判断行事"
 SUM_Neo_SGD.19.b:"按自己的判断行事"
 SUM_SGD_PRO_Herdsmen:"驱群就草"
 SUM_SGD_PRO_Herdsmen_desc:"牧人赶着羊顺水草走，哪里有水往哪里去，一年里踏进城门的回数数得清。可论沙漠的脾气，比谁都清楚：哪片天要起风，哪处沙会走，望一眼便知。有回城里人要穿沙，特地请了个老牧人带路，一路上果然没迷。"
 SUM_Neo_SGD.20.t:"驱群就草"
 SUM_Neo_SGD.20.d:"沙漠里的牧人，赶着羊群顺着水草走，一年里踏不进城里几回。城里人笑他们见识短，说这些人连钟点都分不清，谁知这牧人比谁都清楚沙漠的脾气。哪片沙丘背后藏着苦水，哪处岩缝里能寻到湿土，哪阵风来要起沙暴，他抬头看看天，闻闻风里的气味，便知个八九分。羊群要走，他便拔营；羊群不走，他便搭起帐篷守着，一住就是半月。有一年大旱，河水断了，官署派来的向导带着人马迷了路，在沙海里转了三天三夜，水囊都快空了，还是一位老牧人寻见他们，把人带出了沙海。众人这才服气，纷纷拿出钱来谢他，老牧人却摆摆手，只说举手之劳。走惯了沙的人，认的是天色和草色，不是官署画的地图。"
 SUM_Neo_SGD.20.a:"先看住脚下的城"
 SUM_Neo_SGD.20.b:"先看住远方的人"
 SUM_SGD_PRO_Oath_Flower:"长盟之花"
 SUM_SGD_PRO_Oath_Flower_desc:"部族之间立誓，各折一枝花，插在两家中间，花谢之前谁也不能翻脸。花谢得快，三五日便蔫，所以誓也立得勤，一年不知折多少枝。有个长老嫌烦，嘟囔：「这花，比买卖还多。」可真没了这枝花，谁也下不来台。"
 SUM_Neo_SGD.21.t:"长盟之花"
 SUM_Neo_SGD.21.d:"部族之间立誓，要折一枝花为证。花枝插在中间，花谢之前，谁也不许翻脸。可沙漠里的花，开得艳，谢得也快，朝看还鲜活，暮看就蔫了，花瓣一落，誓便解了。于是这誓言便立得格外勤，今日两族折花立誓，明日又为别的事再折一回。有一回，两族为一口井争得脸红脖子粗，眼看要动手，长者折来一枝花，插在井边，两人对着花各念一句誓词，便各自收了刀。果然三日之内，花就谢了，两家也就和好如初。有人笑说，这花谢得太快，倒显得人情薄。长老却摇头，说花谢了可以再折，誓立了就要认，快有快的好处，谁也不好意思长久记仇。这折花立誓，也是一门处世的本事。这话听着好笑，用起来却灵，把仇怨化在了花开花谢之间。"
 SUM_Neo_SGD.21.a:"循教令院发下的旧例"
 SUM_Neo_SGD.21.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Eremite_Banner:"旅团张帜"
 SUM_SGD_PRO_Eremite_Banner_desc:"镀金旅团不认旗号，只认契约。今日替官署押货，明日替与官署作对的人押货，脸不变，刀也不换。有人问：「你们到底站哪边？」领头的把契纸一抖，笑道：「站付钱这边。」问的人也笑了，不再追问。"
 SUM_Neo_SGD.22.t:"旅团张帜"
 SUM_Neo_SGD.22.d:"镀金旅团，不认旗号，只认契约。他们替谁押货，全看谁出的摩拉多。今日替官署押一批军械，明日就许替反对官署的人押另一批，全不觉得有什么不对。有一回，官署与反对的人同时来雇，他们把两头的价码一比，拣高的应了，回头还向低的那头赔个笑，说生意归生意，莫要见怪。押货的路上，遇见官署的巡骑盘问，他们把契约一亮，说是奉命办差，巡骑看看那朱红的印章，也只得放行。因此两边都骂他们反复，两边又都少不了他们。这旅团眼里，旗号是虚的，契约是实的，白纸黑字写明押什么、走哪条路，刀便朝着那个方向，至于那旗号底下坐着的是谁，他们从不放在心上。左右逢源，两头都得罪不起。"
 SUM_Neo_SGD.22.a:"把账目封存"
 SUM_Neo_SGD.22.b:"把账目摊开"
 SUM_SGD_PRO_Contract:"券与金币"
 SUM_SGD_PRO_Contract_desc:"旅团的账房比官署税吏还精明，一笔一划算得清楚，连草料钱也摊到人头。契约上写明的，刀便朝那个方向；没写明的，刀就搁着不动。有个雇主想添一条，账房把笔一拦：「添可以，加钱。」这行当里，纸上几个字比人命重。"
 SUM_Neo_SGD.23.t:"券与金币"
 SUM_Neo_SGD.23.d:"旅团的账房，端的比官署的税吏还精明。一笔一划，算得清清楚楚，连路上损耗几斗水、折了几只驼，都记得明明白白，算盘打得噼啪作响，一文钱也不肯含糊。契约上写明的，他们一丝不苟照办，写一个字，便办一件事，从不打半点折扣。官署的税吏却不同，收钱时手一摊，名目换来换去，什么脚费、什么验货钱，谁也弄不明白。有一回，两边核对一笔旧账，官署的账目糊成一团，翻了半日也理不出头绪，旅团的账却条理分明，哪日进、哪日出，一笔笔都对得上，反倒成了断案的依据。契约上写得越清楚，刀就朝着那个方向去得越准，这便是旅团立身的本钱。那税吏涨红了脸，翻了半日也挑不出一个错字，只得认输。"
 SUM_Neo_SGD.23.a:"按官署的判断行事"
 SUM_Neo_SGD.23.b:"按自己的判断行事"
 SUM_SGD_PRO_God_King_Legacy:"王家故器"
 SUM_SGD_PRO_God_King_Legacy_desc:"「既是兄弟，就别想走。」管事的把册子一合。神王之遗是沙漠最大的佣兵团，附庸小团数不清，旗子一插半条商路便归它管。入团的规矩是先留案底，姓名、籍贯、欠过谁的债一样样记下，有个新人填完名想反悔，已经来不及了。"
 SUM_Neo_SGD.24.t:"王家故器"
 SUM_Neo_SGD.24.d:"神王之遗，是沙漠里最大的一支佣兵团，名下的附属团，数也数不清，大大小小足有几十处，旗号各异，却都认这一个总号。要入这团，头一条规矩便是先留案底，姓名、来历、家在何处、先前干过什么，一桩桩登记在册，按了手印才算了事。有人说这是拿住人的把柄，团里却说，留了案底，弟兄们才不敢乱来，犯了事也好查，死了也好往家里报信。有一回，一个新来的想隐瞒出身，说自己是个放羊的，被账房三问两问便露了马脚，原来是个在别处犯了事逃来的，当下赶了出去，连盘缠也没收。这团能聚起如许多人，靠的就是这一本册子。后来团里凡有争执，都翻这册子断是非，比刀把子还牢靠。"
 SUM_Neo_SGD.24.a:"先看住脚下的城"
 SUM_Neo_SGD.24.b:"先看住远方的人"
 SUM_SGD_PRO_Blazing_Lion:"雄狮灼灼"
 SUM_SGD_PRO_Blazing_Lion_desc:"有人从神王之遗脱身，带着旧伤，也带走几十个肯跟他的弟兄。他自拉一队，旗子是新的，头一条规矩便是不接抢劫的活。有人笑他傻，他只说道：「抢来的钱，花着烫手。」弟兄们听了，都把刀插回鞘里。"
 SUM_Neo_SGD.25.t:"雄狮灼灼"
 SUM_Neo_SGD.25.d:"有人从神王之遗里脱了身，自己拉起一支队伍。他受够了团里那些打家劫舍的勾当，说跟着他们，钱是赚了，名声却臭了，于是立下的头一条规矩，便是不接抢劫的活，只护商、只押货、只拿该拿的钱。有人笑他清高，说沙漠里靠刀吃饭，哪里挑得干净，你不抢，别人抢，还不是一样。他却不听，宁可少赚些摩拉，也不肯坏了这条规矩。有一回，一伙人被劫了来求他出手，他先问明白是护送还是报仇，听说是护送，便爽快应下，听说是趁火打劫，当即把人赶走。日子久了，商队反倒都愿意找他，图的是个安稳。这人脱身另立门户，把自己的名姓看得比摩拉还重。可见行得正，走得远，商队认的是这份踏实，不是嘴上的豪言。"
 SUM_Neo_SGD.25.a:"循教令院发下的旧例"
 SUM_Neo_SGD.25.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Mercenary_Code:"客兵自约"
 SUM_SGD_PRO_Mercenary_Code_desc:"「玩笑，玩笑！」雇主话没说完，刀已出了鞘，他赶忙把钱袋捧上前。佣兵有佣兵的讲法：给钱之前是朋友，酒肉管够；给了钱各走各路；若是赖账，刀上说话。这套讲法比官署律例还灵，说出去人人都认。"
 SUM_Neo_SGD.26.t:"客兵自约"
 SUM_Neo_SGD.26.d:"佣兵有佣兵的讲法：付钱之前是朋友，称兄道弟，酒肉不分；付钱之后是路人，各走各路，谁也不欠谁；若是赖账，那便是仇人，刀兵相见，决不轻饶。这条讲法，比官署的律例好使得多。官署断案，要写状子、要过堂、要等批文，三推四阻，黄花菜都凉了。佣兵却干脆，一句赖账，当下便见分晓，绝无第二句话。有一回，一个商队想赖掉尾款，才起了心思，风声便传到佣兵耳朵里，还没等他出门，刀已经架在了脖子上，那商人吓得腿软，连忙如数付清，还多赔了一桌酒钱。这道理虽粗，却管用，沙漠里的人认这个，比认官署的告示还深。省了多少告状的工夫，也省了那些推诿扯皮的口舌，所以人人都服。"
 SUM_Neo_SGD.26.a:"把账目封存"
 SUM_Neo_SGD.26.b:"把账目摊开"
 SUM_SGD_PRO_Camelry:"驼群骑者"
 SUM_SGD_PRO_Camelry_desc:"沙漠里头，马是跑不快的，蹄子陷进沙中，喘不上几口就得歇；倒是那骆驼，一步一摇，能走上整整一天。骑手们从小和骆驼厮混，几时该饮水、几时该勒缰，心里比谁都有底。有个军官嫌慢想催，老驼工笑他：「牲口乏了，你急也无用。」"
 SUM_Neo_SGD.27.t:"驼群骑者"
 SUM_Neo_SGD.27.d:"沙漠里骑马跑不快，能跑的，是驼。马在这样的沙地上，蹄子一陷便是半尺，跑不上几里就喘得口吐白沫，好马也成了废马。驼却不同，脚掌宽厚，踏沙如履平地，几日不饮水也照样驮货，饿了啃几口荆棘也能活。驼队的骑手，从小便跟骆驼一处长大，喂料、饮水、认路、看病，样样精通，哪头驼脾气躁，哪头驼耐力足，他一望便知，比军官更懂什么叫耐渴。有一回，一队官兵带着马进沙海，渴得人仰马翻，马一匹匹倒下，还是一位驼队老手领着，寻到一处隐蔽的水源，才把人带了出来。打仗要使马，走沙漠却得使驼，各有各的用处，用错了地方，便是自取其累。驼队走沙海，要靠这般老手，换个生手来，非把人马折在里头不可。"
 SUM_Neo_SGD.27.a:"按官署的判断行事"
 SUM_Neo_SGD.27.b:"按自己的判断行事"
 SUM_SGD_PRO_Tribal_Militia:"诸部起卒"
 SUM_SGD_PRO_Tribal_Militia_desc:"各部族自养民兵，兵器是自家的，粮是自家的，操练也在自家场院。官署征调过两回：头一回去了三百，回来一百五；第二回长老干脆把青壮藏进沙窝，官署的人找了一日，只看见几只羊。这兵，是部族的兵。"
 SUM_Neo_SGD.28.t:"诸部起卒"
 SUM_Neo_SGD.28.d:"各部族自己养着民兵，兵器是自家的，粮草也是自家的，不用官署一文钱，连操练都在自家的草场上。官署征调过两回，说是要合并训练，编入官军，结果去的浩浩荡荡，回来的不到一半，剩下的不是逃了，就是伤了。原来这些民兵，宁可回家种地放羊，也不肯受官署的约束，更不愿听外人的号令。有一回，官署又来点卯，各部的头人你推我诿，这个说人病了，那个说驼丢了，还有一个说为准备水草走不开，愣是凑不齐数。派来的官儿气得直瞪眼，却也无可奈何。这民兵认的是族里的长老，不是官署的印信，谁给粮草就跟谁走。可见强扭的瓜不甜，官署的算盘到底打错了，不如由着他们，反倒还能落个人情。"
 SUM_Neo_SGD.28.a:"先看住脚下的城"
 SUM_Neo_SGD.28.b:"先看住远方的人"
 SUM_SGD_PRO_Frontier_Fort:"关外筑垒"
 SUM_SGD_PRO_Frontier_Fort_desc:"边关土堡垒了又塌，塌了又垒，一层土一层沙，垒了几十年，还是那副模样。守堡的换过好几拨，口令跟着口音变，堡还是那个堡。有个新兵问：「这堡守谁？」老兵指了指风：「守它。」新兵不懂，老兵也不解释。"
 SUM_Neo_SGD.29.t:"关外筑垒"
 SUM_Neo_SGD.29.d:"边关的土堡，垒了又塌，塌了又垒。沙一侵蚀，墙皮便一片片往下剥，守堡的人一拨拨地换，先来的嫌苦走了，后来的又补上，唯有那座土堡，还是那个土堡，歪歪斜斜立在风沙里。有一年沙暴过后，堡墙塌了半边，新来的兵找出旧砖，照着原样又垒起来，垒到一半又塌，再垒，直忙到星满天。有人问，这破堡守着有何用，早晚还不是一堆土？老兵说，堡虽破，立在这儿，就是个界，沙漠的人望见它，心里就踏实，知道再往前便是官署的地界。铁打的营盘流水的兵，就是这般，人换了一茬又一茬，界却还在那里。老兵说完，又蹲下去补那刚塌的一角，手上泥抹了一脸，年轻兵看了，也默默跟着上手，竟没人肯弃它而去。"
 SUM_Neo_SGD.29.a:"循教令院发下的旧例"
 SUM_Neo_SGD.29.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Sand_Recon:"遣谍入沙"
 SUM_SGD_PRO_Sand_Recon_desc:"探子回报远处有异动，官署没当回事，等人赶去看，事情早过了三日。带队的叹道：「早说了，你们不信。」侦察的走在前头，低头认的是脚印和风，不是地图：蹄印新不新、风里有没有驼铃，一眼就明白。"
 SUM_Neo_SGD.30.t:"遣谍入沙"
 SUM_Neo_SGD.30.d:"侦察的人，总走在队伍最前头，离大队数十里，单枪匹马，悄悄摸过去。他们认的是脚印和风，不是地图。哪里的沙新翻过，哪里的驼粪还带着温度，哪阵风里夹着生人的气味，他们一望便知，一嗅便明。带回来的消息，官署却常常不信，说这是夸大其词，危言耸听。有一回，侦察的人报告前方沙丘后有埋伏，足有百十号人，回来时衣裳都刮破了，也不肯歇一口气，先把消息报了。官署的军官不信，说哪来许多人，执意进军，结果中了伏，人马折了大半，吃了大亏，那军官自己也被捉了去。这沙海里的眼睛，比纸上的图靠得住，不信眼线，只信地图，便是这般下场。眼线胜过地图百倍，可惜那军官到死也没明白这个道理。"
 SUM_Neo_SGD.30.a:"把账目封存"
 SUM_Neo_SGD.30.b:"把账目摊开"
 SUM_SGD_PRO_Smuggled_Arms:"私输兵械"
 SUM_SGD_PRO_Smuggled_Arms_desc:"军械挂着各种名目运进沙漠：写成农具，写成锅碗，写成给神庙的供奉。官署查得紧，便绕别的路，驼队昼伏夜行。查到后来，连查的人也带货，抽一份脚钱。有个检查的笑：「咱这是，睁一只眼闭一只眼。」"
 SUM_Neo_SGD.31.t:"私输兵械"
 SUM_Neo_SGD.31.d:"军械从各样名目下运进沙漠，有的报作农具，有的报作商货，有的干脆夹在盐包里，官署查得紧，运货的便绕别的路走。一开始还偷偷摸摸，夜里赶路，见了卡子就发慌，后来查的人收惯了好处，索性睁一只眼闭一只眼，见车就放。查到最后，连查的人自己也加入了带货的行列，白天查货，夜里放货，月底分钱。有一回，一个新来的税吏认真起来，要开箱验货，箱盖都掀开了，反倒被同僚拉到一旁劝住，说这是大家的饭碗，何必认真，那税吏只得把手缩了回去。这沙漠里的关防，查来查去，查成了一笔生意。把个关防，做成了发财的营生，上头睁一只眼，下头乐得其所，唯有新来的还蒙在鼓里。"
 SUM_Neo_SGD.31.a:"按官署的判断行事"
 SUM_Neo_SGD.31.b:"按自己的判断行事"

 #### 独立之路 ####
 SUM_SGD_IND_The_Long_Road:"自立方始"
 SUM_SGD_IND_The_Long_Road_desc:"沙漠与雨林之间隔的，不只是沙。要走到独立那一步，先得把散在各处的城邦、部族、旅团捏成一股绳，你争我夺的旧账暂且撂下。有个首领把三家旧怨摆上桌，自己先撕了那页账：「从今往后，不翻这个。」绳捏成了，还得让雨林亲眼看看，这股绳勒得住它自己。"
 SUM_Neo_SGD.32.t:"自立方始"
 SUM_Neo_SGD.32.d:"沙漠与雨林之间，隔着的不只是沙，还有几百年积下的怨气。要走到独立的那一步，先得把散在各处的城邦、部族与旅团，捏成一股绳，再让雨林相信，这股绳勒得住它自己，不会一扯就散。说客们四处奔走，一会儿劝这城的头人，一会儿说那族的长老，磨破了嘴皮，连嗓子都哑了。有人问，这绳真有那么结实？为首的指着远处说，一根绳细，十根绳粗，百根绳便能拴住骆驼，只要大家心齐，雨林纵有千军万马，也奈何不得。这独立二字，说起来轻，做起来重，先要人心齐，心不齐，再多的人也是一盘散沙。可惜话是这么说，做起来却难如登天，各部各有各的算盘，说客们磨破了嘴，也未见得人人点头。"
 SUM_Neo_SGD.32.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.32.b:"把盟约收进箱底"
 SUM_SGD_IND_Envoy_Tribes:"使辩士行"
 SUM_SGD_IND_Envoy_Tribes_desc:"礼品在各处毡房里转了一圈，火塘边坐坐就走。说客要传的话才是正经，可他偏不直说，只丢下个话头让长老们自己接。接话的那位沉吟许久，忽然一拍大腿：「这事，该由咱们自己拿主意。」话头一接过去，便成了长老们自己的主张。"
 SUM_Neo_SGD.33.t:"使辩士行"
 SUM_Neo_SGD.33.d:"有说客，带着礼物走遍各部，礼物是次要的，话才是主要的。话要说得巧妙，让长老们听着听着，觉得这主意原是自己想出来的，不是别人塞给他的。说客到了一族，先不提正事，只陪着喝茶，夸这族的水草好、驼队壮、姑娘俊，夸够了，才慢慢说到雨林的欺压，说一句，停一停，看长老脸色。长老一拍大腿，说这事我早有此意，只是没人敢先提。说客便顺势把盟约的条文递上，长老看也不看便签了名，还连声说是该当如此。这游说的本事，端的在于教人觉得主意是自己的，到了这个份上，事情便成了一大半。把话说到人心坎上了，所以一路走下来，盟约签得顺顺当当，这也算一桩本事。"
 SUM_Neo_SGD.33.a:"召集部族共商"
 SUM_Neo_SGD.33.b:"等官署先松口"
 SUM_SGD_IND_Council_Sand:"碛中集议"
 SUM_SGD_IND_Council_Sand_desc:"几十个部族代表聚在一处，坐了三天，毡房外骆驼拴了一长排。吵得最凶的不是水权，是座次：谁坐上首，谁坐下首，争得脸红脖子粗。有两个差点掀了桌子。散会时，却把最要紧的一条写进了盟约，方才那两个又勾肩搭背起来了。"
 SUM_Neo_SGD.34.t:"碛中集议"
 SUM_Neo_SGD.34.d:"几十个部族的代表，聚在一处，一连坐了三天，帐篷外驼马拴了一大片。吵得最凶的，不是盟约的条文，倒是座次。谁坐上首，谁坐下手，谁挨着长老，谁靠边站，各不相让，争得面红耳赤，几乎要拔刀。到了第三日，饭也顾不上吃，忽然有人冲进来，说雨林的兵又过了界，抢占了两口井，众人神色一凛，当下把座次丢过一边，你一句我一句，把要紧的一条写进了盟约，从此共御外侮，有福同享，有祸同当。散会时，先前争座次的人，反倒互相让起座来，都说你坐上首。这盟约能成，靠的是外头那个共同的敌人。应了那句老话，兄弟阋于墙，外御其侮，先前的争吵，此刻想来倒像是一场笑话，众人也都笑了。"
 SUM_Neo_SGD.34.a:"备好兵与粮"
 SUM_Neo_SGD.34.b:"多派几趟使节"
 SUM_SGD_IND_Pact_Blood:"啮血结盟"
 SUM_SGD_IND_Pact_Blood_desc:"「从今往后，有福同享，有祸同当。」年长的领着念完誓词，把碗往地上一顿。立盟要放血、要折花、要当众念祖辈的誓：血滴进同一只碗，花插在众人中间。誓词一句句念下来，末一句时几十条汉子的嗓子都哑了，从此不再各顾各。"
 SUM_Neo_SGD.35.t:"啮血结盟"
 SUM_Neo_SGD.35.d:"立盟当日，要放血，要折花，要当众念一遍祖辈传下的誓词。血滴进碗里，酒也倒进碗里，花插在碗边，众人轮流念那拗口的古话，念得磕磕绊绊，有人念错了字，急得满脸通红，却无人敢笑。念完，把这碗血酒分饮了，一人一口，传下去，从此这些人便不再是各顾各的部族，而是一家人，有难同当。有一个年轻人在底下小声问，这誓词念完当真就作数？长老瞪他一眼，说血都喝了，还能有假，你要是反悔，这碗酒可不是白喝的。年轻人吓得吐了吐舌头。这立盟的规矩，靠这一碗血酒，把几十颗心拴在一处。把众人拴成了一条心，从此有福同享，有祸同当，谁家有了难，各处都来相帮，再不是各顾各的散沙。"
 SUM_Neo_SGD.35.a:"把旗立起来"
 SUM_Neo_SGD.35.b:"把旗先卷起来"
 SUM_SGD_IND_Chieftain_League:"诸部连盟"
 SUM_SGD_IND_Chieftain_League_desc:"「这椅子，看着风光，坐着扎屁股。」新上任的坐了三天，被各处的事吵得头大。同盟不立共主，只设一个轮值的位子，一年一换，谁也别想赖着不走。谁坐上去谁替大家扛事，出了岔子头一个挨骂。"
 SUM_Neo_SGD.36.t:"诸部连盟"
 SUM_Neo_SGD.36.d:"这同盟，不设共主，只设一个轮值的座。今年你坐，明年他坐，谁坐上去，谁就得替大家扛事，遇了事头一个出头，有了难头一个顶上，赔钱出力，都在所不辞。座上的人虽无共主之名，却有共主之实，只是这实权轮着来，谁也别想独占，今年风光，明年便退到一边听人调度。有一回，轮到一位年轻的头人坐座，遇上雨林挑衅，抢了牲畜，他年轻气盛，拍案而起，点起人马就去追，果然替众人争回了面子，把牲畜夺了回来。这轮值之法，能防一人独大，又能教人人出力，妙得很。比立一个共主还妥当，共主做得久了便要专权，这轮座的却年年换人，想专也专不成，倒把众人拧成了一股绳。"
 SUM_Neo_SGD.36.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.36.b:"把盟约收进箱底"
 SUM_SGD_IND_Hidden_Camp:"沙底立屯"
 SUM_SGD_IND_Hidden_Camp_desc:"从远处望，这一带尽是黄沙，瞧不出半点名堂，其实背风的沙丘后头藏着个营地。要走的人先歇脚更衣，再各自散去。新来的人纳闷：「怎的不挂旗？」管事的回他：「旗是挂给外人瞧的。」这里不竖旗、不点火，白日里静得如同死沙一片。"
 SUM_Neo_SGD.37.t:"沙底立屯"
 SUM_Neo_SGD.37.d:"营地在沙丘背风的一面，从外边望去，只见黄沙漫漫，看不出半点痕迹，连个脚印也寻不见。要走的人，先在这里落脚，歇过气，喝口水，换过装，再分头出去，各奔东西。营里立着几根木桩，拴着骆驼，地下埋着水囊，还有几袋炒熟的麦子，都是事先备好的。外头的巡骑经过，也看不出这沙丘后头藏着许多人马，只道是荒丘一座。有一回，追兵从这里经过，离营地不过一箭之地，马蹄声都听得见，众人屏住气息，连骆驼也捂住了嘴，追兵竟丝毫没有察觉，扬尘而去。这藏兵的法子，靠的是沙丘这一道天然屏障。藏得严实，若不是自家引路，外人哪里寻得着，便是走到跟前，也只当是荒丘一座，谁的脚也不会往那里拐。"
 SUM_Neo_SGD.37.a:"召集部族共商"
 SUM_Neo_SGD.37.b:"等官署先松口"
 SUM_SGD_IND_Foundry:"沙间设冶"
 SUM_SGD_IND_Foundry_desc:"城里铁匠铺，白日打锄头镰刀，夜里却打别的东西。炉火从早烧到晚，没凉过一回。来取货的不走前门，只绕到后巷敲三下门。有个孩子好奇，趴在门缝往里瞧，被爹一把拎走：「不该看的别看。」这铺子打的什么，街坊谁也不问。"
 SUM_Neo_SGD.38.t:"沙间设冶"
 SUM_Neo_SGD.38.d:"铁匠铺，白天打的是锄头镰刀，夜里打的，却是别的物事。炉子从早烧到晚，没个凉的时候，风箱呼嗒呼嗒响个不停。来取货的人，从不走前门，都是趁黑绕到后门，先敲三下，停一停，再敲两下，递上牌子，对上了暗号，货便从后窗递出来，一手交钱，一手交货，从不多点灯。有一回，官署的差役白天来查，铁匠正叮叮当当打一把锄头，火星子四下飞溅，验过便走了，谁也想不到，这铺子夜里打的是刀，更是连夜打好的一批，都埋在后院的沙堆底下。这明修栈道、暗度陈仓的手段，瞒过了多少人的眼睛。神不知鬼不觉，官署的人只道那铺子生意清淡，哪知它夜里灯火通明，打的尽是刀枪，一宿能出十几把。"
 SUM_Neo_SGD.38.a:"备好兵与粮"
 SUM_Neo_SGD.38.b:"多派几趟使节"
 SUM_SGD_IND_Camel_Corps:"驼旅就列"
 SUM_SGD_IND_Camel_Corps_desc:"「我走了八趟，该领八份。」老驼工翻着册子，指着自己那行。管粮的点头：「一笔不差。」各部的驼队如今都编了号按号发粮，从前自管自、号令七零八落，如今一声令下驼铃齐响。谁该出多少、走了几趟，翻开册子便明白。"
 SUM_Neo_SGD.39.t:"驼旅就列"
 SUM_Neo_SGD.39.d:"各部族的驼队，如今都编成了号，一号、二号、三号，一直排到几十号，按号发粮，按号派差，谁也别想冒领。从前各部自己管自己，粮草自有，号令自出，合成一处，如今却号令一处出，粮草一处发，队伍整齐了许多，走起路来，一队挨着一队，驼铃响成一片。有一回，官署想故技重施，暗中许以重利，拉拢其中一队，那队的头人却把号牌一亮，说如今我们编了号，听的是盟约的令，不是官署的令，你那点摩拉，还是留着买水喝吧。来人碰了一鼻子灰，只得回去。这编号之法，看着寻常，端的把散沙拢成了拳头。令官署没了辙，拉拢不成，又不敢强来，只得由着他们去，从此这编号之法，各处都照着学了起来。"
 SUM_Neo_SGD.39.a:"把旗立起来"
 SUM_Neo_SGD.39.b:"把旗先卷起来"
 SUM_SGD_IND_Sand_Tactic:"借风为阵"
 SUM_SGD_IND_Sand_Tactic_desc:"老兵教徒弟的头一件事，是学会等风。沙地里交手，风卷黄沙眯了眼就按兵不动，等风一歇再一拥而上。徒弟依言等了半刻，风停时冲上去，果然得手。这个法子，是祖上几百年用血换来的，书本上查不到，只靠师徒口耳相传。"
 SUM_Neo_SGD.40.t:"借风为阵"
 SUM_Neo_SGD.40.d:"沙漠里的仗，要借着风打。风起的时候，沙遮天蔽日，睁不开眼，箭也射不准，这时候交手，谁也看不清谁，所以不打，各自收敛人马，寻地方躲风。要等风停了，尘沙落定，人马精神也养足了，再厮杀不迟。这是几百年打出来的经验，老兵传小兵，记了又记，写在羊皮上，念了又念。有一回，一支人马不懂这个道理，仗着人多，趁风起时掩杀过去，结果逆风眯了眼，弓拉不开，刀也砍不实，被对方杀得大败，主将也受了伤。这沙漠用兵，要顺天时、借地势，不是光凭一腔血气。吃了大亏，才记住这教训，后来沙漠里用兵，都要先问风向，风未起时按兵不动，风既定了一鼓作气，再不敢造次，这教训记了整整一代人。"
 SUM_Neo_SGD.40.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.40.b:"把盟约收进箱底"
 SUM_SGD_IND_Powder_Store:"暗藏军火"
 SUM_SGD_IND_Powder_Store_desc:"「他是不是也这么想的？」一个把另一个一把拉住。有个胆大的想去看看那些坛罐，两人便都住了脚，怕一不小心把自己也埋进沙里。弹药分藏在几处废遗迹，位置只三人知晓，后来其中一人失了踪，剩下两个谁也不敢独自去动。"
 SUM_Neo_SGD.41.t:"暗藏军火"
 SUM_Neo_SGD.41.d:"弹药分藏在几处废弃的遗迹里，都是早年赤王时代留下的旧洞，位置只有三个人知道。三人各记一处，互相不知全貌，为的是防万一，便是被人拿住，也交不出全部。不想其中一人，后来竟失踪了，生不见人，死不见尸，连住处的行李也没带走。众人猜疑了许久，有的说被官署抓了，严刑逼供，有的说卷了财物逃走，还有的说遇了沙暴，埋在沙里。为首的放心不下，只得把另外两处赶紧转移，连夜挖出来，另换地方埋好。这藏货的法子，也怕人心靠不住，防来防去，防的还是自己人。防人防到自己头上来了，后来团里立下新规，凡管一处暗号的，家眷都要留在营里，每月还要对一遍口供，如此费尽心机，也不知是福是祸。"
 SUM_Neo_SGD.41.a:"召集部族共商"
 SUM_Neo_SGD.41.b:"等官署先松口"
 SUM_SGD_IND_War_Drill:"临敌演武"
 SUM_SGD_IND_War_Drill_desc:"「看它。」老兵指了指火光。新兵看不清，问往哪走，老兵只让他盯着火亮。操演放在夜里，练的是集结与分散，练到后来连口令都省了：火光亮一下便聚，暗下去便散。黑暗里不靠嘴，靠眼睛和脚。"
 SUM_Neo_SGD.42.t:"临敌演武"
 SUM_Neo_SGD.42.d:"操演在夜里进行，练的是集结与分散。一声令下，众人从四面八方聚拢，悄无声息；再一声令下，又散作满天星，眨眼间没了踪影。练到后来，连口令都省了，只看火光的明暗，便知道该往哪里走、该聚还是该散，火把一举是聚，火把一灭是散，火光向左便往左。有一回，官署的探子远远望见沙丘上灯火明灭，一会儿亮，一会儿灭，忽东忽西，看不懂是何讲究，只回报说沙漠人在夜里点灯玩耍，小孩子一般。这无声的操演，练的是默契，火光便是命令，比喊破喉咙还管用。比金鼓旌旗还灵，那探子回报之后，官署将信将疑，派了大队人马夜里来窥，远远望见火光起落，仍旧莫名其妙，只道沙漠人果然行事古怪，哪里知道这火光里藏着千军万马的号令。"
 SUM_Neo_SGD.42.a:"备好兵与粮"
 SUM_Neo_SGD.42.b:"多派几趟使节"
 SUM_SGD_IND_Toll_Posts:"商涂置榷"
 SUM_SGD_IND_Toll_Posts_desc:"过路钱收到手，并不进官府库里，倒一笔笔记进盟约的公账，大伙都有份。收税的也老实，收完就在木牌上划一道。有商队问：「这钱归谁？」收税的笑答：「众人平分，连你也算一份。」账目都摊在明处，谁也没法含糊。"
 SUM_Neo_SGD.43.t:"商涂置榷"
 SUM_Neo_SGD.43.d:"税卡设在路口，收的是过路钱，数额写得明明白白，摆在桌上，谁也不许多要一文。这钱却不进官署的库，进的是盟约的账，用以养兵、买械、救济穷族，一笔笔都记在册上。车队打这里过，车辙一直压到城门口，赶车的老手都认得这规矩，主动把摩拉交了，换取一路平安，还要道一声辛苦。有一回，官署的税吏也来凑热闹，想在旁边另设一卡，同样的货，偏要多收一份，却被商队集体绕开，宁可多走三十里，也不从他那里过，一个子儿也没收着，那税吏只得灰溜溜撤走。这税卡收的钱，取之于商，用之于众，比官署的苛捐赢得了人心。比官署会收买人心，商队宁可多走这三十里，也不肯去那多收一文的卡子，人情向背，就在这几文钱上。"
 SUM_Neo_SGD.43.a:"把旗立起来"
 SUM_Neo_SGD.43.b:"把旗先卷起来"
 SUM_SGD_IND_Salt_Monopoly:"盐榷独擅"
 SUM_SGD_IND_Salt_Monopoly_desc:"沙漠缺盐，盐就是命。谁把盐捏在手里，谁便捏住大半条商路。从前有奸商囤盐，等着抬价，害得百姓淡着嘴过日子，有个老妇抱怨：「菜都没味儿了。」如今盐归了公，价钱平稳，人心也稳。"
 SUM_Neo_SGD.44.t:"盐榷独擅"
 SUM_Neo_SGD.44.d:"沙漠缺盐，盐便是命。没有盐，人没气力，肉也存不住，几日便要坏。谁要是把盐捏在手里，便等于捏住了大半条商路，因为产盐的那几处盐湖，都在沙漠腹地，四周尽是流沙，外人寻不见路。官署想垄断盐利，派兵守了盐湖，结果沙漠人干脆绕开官署的商路，自己组织驼队贩运，夜里装盐，白天赶路。有一回，官署断了盐的供应，想逼人就范，谁知各部早有储存，家家户户都藏着几坛盐，反倒把官署的市镇闹得没盐可用，居民叫苦不迭，官署只得又把路放开。这盐虽小，能系住一方人的生死。把盐看成了命根子，后来沙漠人自己立了盐法，谁贩盐、走哪路、卖什么价，都定得清清楚楚，官署再想插手，也插不进来了。"
 SUM_Neo_SGD.44.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.44.b:"把盟约收进箱底"
 SUM_SGD_IND_Caravan_Pact:"行商啮血"
 SUM_SGD_IND_Caravan_Pact_desc:"劫匪刚露头，前后两队驼铃一齐响，那伙人掂量掂量，缩回沙丘后头去了。商队立盟互保，路上遇劫便一齐还手，这法子比官署巡防还管用：巡防来去有时，商队却日日同行、首尾相顾。"
 SUM_Neo_SGD.45.t:"行商啮血"
 SUM_Neo_SGD.45.d:"商队立了盟，互相担保，路上遇了劫，一处遇险，各处一起还手，绝不袖手旁观。这一条，比官署的巡防管用得多。官署的巡兵来得慢，等赶到时，货早被抢光了，只剩下空驼在沙里打转。商队自己却不同，驼铃一响，附近的同伴便围拢过来，少则十几，多则几十，把劫匪团团困住。有一回，一伙悍匪劫了一支商队，正在那里分赃，正当得意，四面八方涌来数十条好汉，刀光一闪，打得匪徒抱头鼠窜，连抢去的东西也尽数夺回。这互保之法，端的胜过了官署的巡防，靠的是众人齐心。靠的不是一人力勇，而是众人齐心，后来那几个匪徒被捆了送到盟约的帐前，当众发了誓，从此再不敢打沙漠商队的主意，这互保之名，越发传得远了。"
 SUM_Neo_SGD.45.a:"召集部族共商"
 SUM_Neo_SGD.45.b:"等官署先松口"
 SUM_SGD_IND_Coin_Sand:"碛中改铸"
 SUM_SGD_IND_Coin_Sand_desc:"几家大商户合铸一种新钱，成色足，掂着沉，比官铸的还好使。市上的人认这钱，不认那印章。有个老商人把新钱掂了掂，笑道：「这钱，实在。」钱好不好使，不在印，在分量。攥在手里，沉甸甸的叫人安心。"
 SUM_Neo_SGD.46.t:"碛中改铸"
 SUM_Neo_SGD.46.d:"几家大商户，合在一起铸了一种新钱，成色足，分量准，比官署铸的钱还好使。官署的钱越铸越薄，含的铜也越来越少，这新钱却是实打实的，市上的人认这个，不认官署的印章。拿这新钱去买货，童叟无欺，商人也乐意收，收了转手就使，从不打折。官署急了，下令禁用，说私铸钱币是死罪，告示贴得满城都是，可市上照用不误。有一回，官署的巡吏在集市上收缴，摊主们把钱往怀里一揣，异口同声说这是找零寻不开的，你搜我这搜他，竟搜不出一枚，巡吏也无可奈何。这钱好不好使，在成色，不在印章。把官署的威风扫尽了，后来官署索性也睁一只眼，私下里收起铸钱的税来，反倒落个实惠，只是面子上还挂着禁用的告示。"
 SUM_Neo_SGD.46.a:"备好兵与粮"
 SUM_Neo_SGD.46.b:"多派几趟使节"
 SUM_SGD_IND_Blockade_Market:"闭市绝途"
 SUM_SGD_IND_Blockade_Market_desc:"要挟雨林，罢市比动兵更管用。集市一关，往雨林去的货便断了，缺了粮盐，那里先乱。有个掌柜把铺门一关，对手下道：「看他们谁先撑不住。」不动一刀一枪，叫人自己服软，这才是上策。"
 SUM_Neo_SGD.47.t:"闭市绝途"
 SUM_Neo_SGD.47.d:"要挟雨林的时候，罢市比动兵还管用。集市一关，往雨林去的货便断了，香料、盐、驼绒、药材，样样都缺。雨林的人离了沙漠的货，日子便不好过，连官署的厨房都开不出像样的饭食。有一回，雨林无理欺压，扣押了沙漠的商队，沙漠人也不动刀兵，只把集市一关，三条街的摊子全收了，货栈也落了锁，钥匙攥在会长手里，连卖水的也挑着担子回了家。不出半月，雨林那边便派人来讲和，态度比先前恭顺了许多，还主动放了扣押的商队。这罢市之策，兵不血刃，便叫人低了头，比起刀兵相见，省了许多性命。叫雨林吃了个哑巴亏，讲和时还赔了几车货，从此雨林再不敢轻易扣押沙漠的商队，这罢市二字，成了沙漠手里的一张硬牌。"
 SUM_Neo_SGD.47.a:"把旗立起来"
 SUM_Neo_SGD.47.b:"把旗先卷起来"
 SUM_SGD_IND_Proclamation:"腾榜谕沙"
 SUM_SGD_IND_Proclamation_desc:"文书用沙漠古文字写成，贴在每座城门外。认得的人不多，可认得的都会念给旁人听。有个识字的老者站在墙下，一句句念，围了一圈人。一字传十，十字传百，不消几日，满城皆知。"
 SUM_Neo_SGD.48.t:"腾榜谕沙"
 SUM_Neo_SGD.48.d:"文书写在羊皮上，用的是沙漠的古文字，贴在每一座城的门外，拿石块压着四角，生怕风吹跑。认得这字的人本就不多，可认得的，都会念给别人听，念完还要逐句讲解一番。于是这文书上的话，一传十、十传百，满城的人都知道了，连不识字的老婆子也能说上几句。官署派人来撕，前脚撕了，后脚又贴上一张，撕不胜撕。有一回，一个识字的老者站在城门口，高声念那文书，念到激昂处，声音发颤，围听的人越聚越多，密密麻麻站了一片，连差役也不敢上前阻拦，只远远站着。这古文字虽冷僻，挡不住话传千里。把话传到了千家万户，后来官署见撕不胜撕，索性不再派人，那羊皮文书便一直贴在城门上，风吹日晒，字都淡了，看的人却依旧不少。"
 SUM_Neo_SGD.48.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.48.b:"把盟约收进箱底"
 SUM_SGD_IND_Flag_Raise:"高立旗号"
 SUM_SGD_IND_Flag_Raise_desc:"那旗是各家凑布缝成的，红底上一只展翅的鸟。旗立起来当日，城门口竟没人收税。过往商队都停了脚，仰头看那鸟在风里抖翅。有个孩子指着旗喊：「它要飞了！」众人听了，都笑了。那鸟在风里抖着翅膀，像真要飞起来。"
 SUM_Neo_SGD.49.t:"高立旗号"
 SUM_Neo_SGD.49.d:"那面旗，是各家凑了布，你一块我一块，一针一线缝起来的。红底上一只展翅的鸟，是请城里最好的绣娘描的样，绣了整整七日，鸟羽根根分明，像是就要飞起来。旗立起来那一天，风吹得猎猎作响，广场上站满了人，男女老少都有，仰着头看。城门口，往日收税的官署差役不见了，税卡也撤了，过往的车马畅通无阻，赶车的把鞭子甩得啪啪响。有个老汉摸着旗角，眼泪直流，说等了这一日，等了大半辈子，如今总算见着了。这面旗虽是几块布缝的，抵得过千军万马，因为它缝的是众人的心。把众人的心缝在了一处，从当日起，沙漠各行其是久了，如今旗下一站，便知是一家人，往后遇事，大家都要护着这面旗。"
 SUM_Neo_SGD.49.a:"召集部族共商"
 SUM_Neo_SGD.49.b:"等官署先松口"
 SUM_SGD_IND_Reject_Edict:"返其诏书"
 SUM_SGD_IND_Reject_Edict_desc:"雨林发来的敕令，当着使节的面撕了。撕的不只是一张纸，是几百年的旧规矩。那使节脸涨得紫，指着地上嚷了几句，却半句也驳不出，只得俯身拾起碎纸回去。碎纸片落了一地，风一吹，散得更远，没人再去捡。"
 SUM_Neo_SGD.50.t:"返其诏书"
 SUM_Neo_SGD.50.d:"雨林发来的敕令，当着使节的面，被一把撕了。撕的人手劲很大，纸片纷纷落地，有一片还飘到了使节的靴子上。那使节脸涨得通红，嚷嚷着说这是几百年的规矩，历代相承，撕了便是反叛，要奏明上头，发兵来问罪。为首的长老冷笑一声，说规矩是你们定的，我们沙漠人从来不认，你那几百年，与我们何干。说完，把碎纸扫到一旁，命人端上茶来，请使节坐下说话，就当什么也没发生。使节哪里坐得住，一甩袖子，拂袖而去，连茶也没喝一口。这一撕，撕的是纸，断的是几百年的老规矩。端的撕得干净，也撕得痛快，那敕令的碎片被风一吹，散了一地，有几个后生还要上去踩两脚，长老也不拦，只说让它去吧，横竖再没人认它。"
 SUM_Neo_SGD.50.a:"备好兵与粮"
 SUM_Neo_SGD.50.b:"多派几趟使节"
 SUM_SGD_IND_Claim_Land:"申画旧疆"
 SUM_SGD_IND_Claim_Land_desc:"「动它试试？」长老一瞪眼。有个后生嫌那石堆丑，想搬正，从此再没人敢挪。地界重划一遍，雨林立的界碑被搬走，换成本地长老垒的石堆，那石堆不高、歪歪扭扭，却压得住人心。这地归谁，看石堆便知。"
 SUM_Neo_SGD.51.t:"申画旧疆"
 SUM_Neo_SGD.51.d:"地界重新划了一遍。雨林设在沙漠边缘的界碑，是早年用汉白玉刻的，如今被一处处挪走，推倒在地，换成本地长老立起的石堆。石堆不高，垒得却结实，一块压一块，上面还压着一块刻了字的石头，字是沙漠的古文。有雨林的人来理论，说界碑是朝廷立的，盖着大印，怎么能挪，这是羞辱朝廷。长老把手一指那些石堆，说这地里的沙，哪一处没流过我们祖宗的血，界碑认不得，石头认得，你那大印，在这里不好使。那人还要争辩，众人便一齐围上来，他只得悻悻走了。这石堆虽土，立的是自家的底气。把自家的地界立住了，后来雨林再派人来量地，望见那些石堆，便知这里是沙漠的地盘，话也说不出口，掉头就走。"
 SUM_Neo_SGD.51.a:"把旗立起来"
 SUM_Neo_SGD.51.b:"把旗先卷起来"
 SUM_SGD_IND_Declaration_Text:"草创宣言"
 SUM_SGD_IND_Declaration_Text_desc:"宣言改了七稿，改到最后只剩三条：不受敕令，自定赋税，自养军伍。字写在羊皮上，念的人只念了三句。底下的人各自咬破指头，在纸角按了血印。有个老者边按边道：「字少，记得住。」话少反而有力，十七条抵不上这三条。"
 SUM_Neo_SGD.52.t:"草创宣言"
 SUM_Neo_SGD.52.d:"那宣言，前前后后改了七稿，改一回，吵一回，纸都写了几十张。第一稿洋洋洒洒，写了几十条，从赋税写到兵役，从水道写到市集，后来越删越短，改到最后，只剩下三条：一不受雨林敕令，二自定赋税，三自养军伍。有人嫌太少，说三条怎么够，脸上无光。为首的却说，字越少，记得越牢，办得到才是真的，写一百条办不到，不如三条条条算数，落地生根。众人听了，都点头称是，当下把三条抄在羊皮上，念了三遍。这宣言改到七稿才定，删繁就简，句句都要落地。字字算数，后来盟约里凡有争议，都拿这三条来断，合则用，不合则改，不改的便不算盟约，这般干脆，倒是从前那几十条做不到的。"
 SUM_Neo_SGD.52.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.52.b:"把盟约收进箱底"
 SUM_SGD_IND_Envoy_North:"朔方信至"
 SUM_SGD_IND_Envoy_North_desc:"北边使者等在城外，足足耗了半个月才获准进城，头一句便问：「沙漠倒向哪边？」这话分量重，堂上顿时鸦雀无声，长老们面面相觑，没一个肯先开口。使者等得胡须都长了几分，终究没听到准信，只得怏怏打道回府。"
 SUM_Neo_SGD.53.t:"朔方信至"
 SUM_Neo_SGD.53.d:"北边来的信使，在城外足足等了半个月。守城的起先不许他进城，说没有文书，不许擅入，他就在客栈里住着，日日到城门口张望，鞋底都磨薄了。半个月后，终于有人传话，召他进去见面。进了城，一路左弯右绕，蒙上眼睛才带进府里。见了面，那长老也不寒暄，连茶也不倒，只问一句：沙漠站哪一边？信使愣了一下，说这话说来话长，容我从头道来。长老摆摆手，说来话长就别说了，短话才中听，我们只听这一句。信使张了张嘴，竟不知如何回答。这半个月等来的，就是这一句要命的问话。把来使问住了，那信使在沙漠又住了几日，日日求见，长老只是不见，末了问他一句，你还没想清楚，回去再想想吧，信使只得悻悻回国。"
 SUM_Neo_SGD.53.a:"召集部族共商"
 SUM_Neo_SGD.53.b:"等官署先松口"
 SUM_SGD_IND_Envoy_Port:"埠头聚贾"
 SUM_SGD_IND_Envoy_Port_desc:"港口客商带来的，是船票与价钱。有个船长把价目往桌上一摊：「走海路，省三成脚费。」沙漠若开港，货便从海上走，不必再看雨林脸色。那些船长年在风浪里讨生活，最懂什么划算。"
 SUM_Neo_SGD.54.t:"埠头聚贾"
 SUM_Neo_SGD.54.d:"港口来的客商，带来的不是刀兵，是船票和价钱。他们摊开账本，一样样报给沙漠的头人们听：若沙漠开港，货便从海上走，不必再看雨林的脸色，运费还能省下三成，日子越过越宽裕。头人们听着，眼睛渐渐亮了，互相递着眼色。有个老成持重的问，开港要多少本钱，船从哪里来。客商一笑，说本钱的事好商量，先试一年，赔了算我们的。又说那海路上，风平浪静时，一月便能往返，比走陆路快得多。这海路一开，给沙漠添了一条生路，再不必受制于人。给沙漠指了一条新路，只是开港要修码头、置船只、设关津，样样都要钱，头人们商量了许久，末了还是咬牙应下，说无论如何，这雨林的脸色，是再也不看了。"
 SUM_Neo_SGD.54.a:"备好兵与粮"
 SUM_Neo_SGD.54.b:"多派几趟使节"
 SUM_SGD_IND_Envoy_Sea:"东溟舟至"
 SUM_SGD_IND_Envoy_Sea_desc:"「这旗，是来谈买卖，还是来探路的？」老渔民嘀咕，没人答他，各自心里打着算盘。东海的船队在近海停了一夜没靠岸，旗舰上那面旗连沙暴天都看得清，岸上的人望着那片灯火，一宿没合眼。"
 SUM_Neo_SGD.55.t:"东溟舟至"
 SUM_Neo_SGD.55.d:"东海来的船队在近海泊了一宿，帆收着，始终不曾靠岸。船上的人远远望见沙漠的海岸线，却按兵不动，只派了几只小艇，在近处转了一圈，量了量水深。旗舰上挂着一面旗，旗色鲜明，在月色下也看得真切，便是沙暴天里，也看得清清楚楚。守在岸上的探子回报，说这支船队来路不明，船有十几艘，桅杆高耸，不知是来做买卖，还是来探虚实。为首的听了，命人加倍留意，昼夜轮班盯着，却不要惊动他们，也不许放箭。这海上来的船队，让沙漠人多了一重心思，不知是福是祸。让沙漠人一夜没睡安稳，第二日天刚亮，那船队便升帆起了锚，顺着海流往北去了，岸上的人面面相觑，不知这一走，是去而复返，还是就此别过。"
 SUM_Neo_SGD.55.a:"把旗立起来"
 SUM_Neo_SGD.55.b:"把旗先卷起来"
 SUM_SGD_IND_Envoy_Winter:"北使来朝"
 SUM_SGD_IND_Envoy_Winter_desc:"北国使团带着一箱银子来，出手阔绰得很，一张口却要驻军的权。长老们盯着那白花花的银子直咽唾沫，可驻军二字钻进耳朵，脖子里又凉了半截。年轻首领刚要说话，老长老一脚踩住他：「银子好拿，人可不好打发！」这便宜看着大，终究没人敢占。"
 SUM_Neo_SGD.56.t:"北使来朝"
 SUM_Neo_SGD.56.d:"北国的使团，最是舍得花钱，一进沙漠，便沿途撒摩拉，收买人心。他们一开口，便要驻军的权利，愿拿大笔摩拉和军械来换，说是帮你守边，分文不取。长老们听着那数目，一个个心动，眼睛发亮，手指在膝上轻轻敲着。可一听到驻军两个字，又不由得犯怵，想起引狼入室的旧事，前朝的教训还摆在眼前，谁也不敢头一个点头。使团以为他们嫌少，又把价码添了添，还许下许多好处。长老们互相看了看，仍旧是不说话，一个个端起茶碗。这钱虽诱人，可驻军二字，让人生怕，不敢轻易应承。端的把长老们难住了，钱是要用的，兵是不能让别人驻的，两下里左右为难，议了三日，末了回话说，钱可以收，兵却一个也不引进来。"
 SUM_Neo_SGD.56.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.56.b:"把盟约收进箱底"
 SUM_SGD_IND_Buy_Arms:"市取军器"
 SUM_SGD_IND_Buy_Arms_desc:"「拿将来作押，你怎么看？」老臣摇头道。有个同伴问赚在哪，他捧着契约说这买卖看着赚。向外邦买军械，买到的是铁与火，卖出去的却是往后若干年的承诺。铁与火看得见，往后那些年却看不见。"
 SUM_Neo_SGD.57.t:"市取军器"
 SUM_Neo_SGD.57.d:"向外邦买军械，买的是铁和火，卖的却是往后若干年的承诺。人家把刀枪火药一批批运来，鸟铳、火炮、甲胄，样样精良，条件是沙漠日后要替人家说话，让出几条商路，结为盟友，永不相负。有一回，一批坚利的火器运到，首领抚着炮筒，欢喜不尽，翻来覆去看了又看，可签下那份文书时，手却有些抖，笔都握不稳。旁边的人劝他，说不过是几句话，签了也无妨。他叹道，这几句话，抵得上几千条性命。这天下的便宜，从来不是白占的，得了人家的铁，便要拿将来的承诺去还。把后路押了出去，那文书一签，往后十年，沙漠的商路、海运、盟友，都要看人家脸色，将军抚着炮筒的手，抖了许久也没能停住。"
 SUM_Neo_SGD.57.a:"召集部族共商"
 SUM_Neo_SGD.57.b:"等官署先松口"
 SUM_SGD_IND_Declaration:"旅团自立"
 SUM_SGD_IND_Declaration_desc:"城头那面红底飞鸟旗，升到顶又被风压下半尺。广场上站满了人，官署大门关着，石阶上坐着长老，正把盟约念出来。念到末一句，他声音发哑，底下的人却齐声应了。从这一天起，沙漠不再替雨林交税，也不再替雨林出兵。"
 SUM_Neo_SGD.58.t:"旅团自立"
 SUM_Neo_SGD.58.d:"城头上那面红底飞鸟旗，升到顶，又被风吹落下半尺，旗角猎猎地拍打着旗杆。广场上站满了人，黑压压望不到边，连屋檐上都趴着孩子。往日收税的官署，大门紧紧关着，门上的封条还新，墨迹未干。石阶上坐着几位长老，正把盟约一条条念出来，声音洪亮，字字清楚，念一条，众人便应一声。从这一天起，沙漠不再替雨林交税，也不再替雨林出兵，各自的日子各自过。念到最后一条，旗恰被风扯得笔直，展翅的鸟像是活了，众人齐齐欢呼，声震沙天。这一日，改变了沙漠的命数。宣了个明白，从此沙漠的税自己收，兵自己养，雨林的敕令进了沙漠便是一张废纸，广场上欢声雷动，连那面旗也似懂人意，猎猎作响。"
 SUM_Neo_SGD.58.a:"备好兵与粮"
 SUM_Neo_SGD.58.b:"多派几趟使节"

 #### 甲线 · 沙海商路 ####
 SUM_SGD_RA_The_Caravan_Road:"计沙海程"
 SUM_SGD_RA_The_Caravan_Road_desc:"有人主张，沙漠的未来在绿洲与商队：把水引出来，把城邦立起来，让契约与律例管事。有人嫌慢，主张快刀斩乱麻。可这条路虽慢，走过的城邦，竟没有一个愿意回头。"
 SUM_Neo_SGD.59.t:"计沙海程"
 SUM_Neo_SGD.59.d:"有人主张，沙漠的未来在绿洲与商队，不在刀枪。把水引出来，把城邦立起来，让契约和律例管事，人人有活干，有饭吃，不靠打劫过日子。这条路走得慢，一城一城地建，一渠一渠地修，十年树木，急不得。可走过的城邦，没有一个愿意回头去过那游荡的日子，住惯了城里，便再不想睡帐篷。有一回，一个在城邦住惯了的人，随商队出了趟远门，风餐露宿，吃尽了苦头，回来便说，还是城里踏实，有井有水，有街有市。这慢工出细活，稳当，比那铤而走险的强。走得慢，却走得稳当，那些靠刀枪起事的地方，今日称王，明日便败，反倒不如这一渠一城，攒下了便是攒下了，谁也夺不去，住进去的人，再不想走。"
 SUM_Neo_SGD.59.a:"让商路连通四方"
 SUM_Neo_SGD.59.b:"把商路关起来自守"
 SUM_SGD_RA_Aqueduct:"决渠注城"
 SUM_SGD_RA_Aqueduct_desc:"水渠从山里引来，一路铺到城根。渠修成当日，城里人放下手里的活，都站在渠边看水。那水流得慢，看的人却久久不肯散。有个老汉蹲下身，伸手撩了撩，笑道：「这水，真到了。」有水的地方，连风都显得软了些。"
 SUM_Neo_SGD.60.t:"决渠注城"
 SUM_Neo_SGD.60.d:"水渠从山里引来，一路弯弯绕绕，穿过沙丘，绕过石滩，铺到城根底下。渠修成当日，城里的人放下手里的活，男女老少都站在渠边看水，铁匠丢了锤子，卖菜的挑着担子就跑来了。那水清亮亮的，顺着新修的渠汩汩流来，阳光底下一闪一闪，孩子们伸手去撩，被大人喝住，怕他们失足。有个老人蹲在渠边，捧起一捧水，闻了又闻，眼眶竟红了，说活了一辈子，头一回见水能流到家门口。这沙漠里的水，比金子还金贵，修成这一条渠，不知费了多少人力，死了多少人。把全城的人都引到了渠边，后来每逢渠水涨时，男女老少都要来看一看，孩子在水边扔石子，老人蹲在石阶上抽烟，这渠便成了城里最热闹的所在。"
 SUM_Neo_SGD.60.a:"以契约立信"
 SUM_Neo_SGD.60.b:"以枪杆立威"
 SUM_SGD_RA_Palm_Grove:"棕榈蔚然"
 SUM_SGD_RA_Palm_Grove_desc:"沿渠遍植棕榈，三年便成了荫。树是公家的，果实按人头分。头一年结果，孩子们在树下抢着捡，有个为抢一颗椰枣摔了个跟头，惹得老人笑得合不拢嘴。树是公家的，谁也不敢私自砍一棵。"
 SUM_Neo_SGD.61.t:"棕榈蔚然"
 SUM_Neo_SGD.61.d:"沿渠两岸，遍植棕榈，一棵挨着一棵，绿油油排了一路。三年光景，树苗便长成荫，树冠遮住了渠水，走在底下，凉飕飕的。树是公家的，谁也不许私自砍伐，违者罚水三月。结下的果实，按人头分，人人有份，连过路的商队也分得一份。有一年果子收成好，堆得像小山，分到最后，连刚出生的娃娃也分了一份。有人问，娃娃吃不得，分它作甚？管事的说，这是规矩，人人有份，一个也不能少，今日少了，明日就有人不服。这公家的树、按头的果，透着一股公道。叫人心服，那管事的分果时，总是最后一个拿，有人劝他也留些好的，他说规矩是先人定的，我若破了，众人便都破了，这话说得众人无言，从此分果从无争执。"
 SUM_Neo_SGD.61.a:"把利润分给城邦"
 SUM_Neo_SGD.61.b:"把利润收归官库"
 SUM_SGD_RA_Canal_Dark:"沙底穿渠"
 SUM_SGD_RA_Canal_Dark_desc:"水从沙底下走，地面不留痕迹。暗道的位置记在城邦册子上，不记在任何一个人脑子里。有人提议记在心里更稳妥，老成的摇头：「人会有私心，册子不会。」那册子锁在柜里，钥匙由专人掌着，两人各执一半。"
 SUM_Neo_SGD.62.t:"沙底穿渠"
 SUM_Neo_SGD.62.d:"水在地面不留痕迹，是从沙底下走的，明面上看不见渠，只见偶尔有几处竖着石堆，做个记号。暗道的位置，一笔一画记在城邦的册子上，藏在匣子里，却不记在任何一个人的脑子里都不全，为的是防人起了歹心，独自占了水源。要用时，几个人一同翻册子，寻到地方，挖开沙层，水自然就来了，用完再填上。有一回，一个管册子的想私自改一处暗道，把水引到自家地里，被众人发觉，当下除了名，逐出城邦。这以册记水、不以人记的法子，稳妥。把水藏在了众人心里，册子虽厚，却谁也记不全，要用时须得几处头人一同到场，各念一段，拼将起来才算数，少一个人，这水便寻不出来，想私下改也改不成。"
 SUM_Neo_SGD.62.a:"借水草养人"
 SUM_Neo_SGD.62.b:"借商队养兵"
 SUM_SGD_RA_Green_Fringe:"沙际树栅"
 SUM_SGD_RA_Green_Fringe_desc:"在沙与田之间，立起一道草带，挡流沙。这草挡不住也得挡，田是一年一年守出来的。种草的弯着腰，把草根一株株按进沙里，汗滴进沙里就没了。草一年比一年密，沙一年比一年远。有个老农蹲在地头：「这草，比人还争气。」"
 SUM_Neo_SGD.63.t:"沙际树栅"
 SUM_Neo_SGD.63.d:"沙与田的交界上，一道草带立了起来，把流沙拦在外面。那草耐旱，根扎得深，能将沙攥住，风一吹，草叶呜呜作响，沙却过不去。可沙漠的沙，哪里是说挡就挡得住的，今日挡住，明日风一吹，草带又埋了半截。挡不住也得挡，坏了再补，补了再坏，一年一年地守。田，便是一年一年这样守出来的，多出一垄是一垄。有一回，一场大沙暴过后，草带全毁了，连田也埋了，众人也不气馁，卷起袖子重新栽，重新翻地。这守田如守城，端的靠的是个韧字。熬过了多少个春秋，那草带一年被埋一回，众人便一年补一回，补到后来，草根越扎越深，沙竟渐渐推不动了，田也一年宽似一年，这守田的韧劲，赛过了守城。"
 SUM_Neo_SGD.63.a:"让商路连通四方"
 SUM_Neo_SGD.63.b:"把商路关起来自守"
 SUM_SGD_RA_Water_Right:"析水授户"
 SUM_SGD_RA_Water_Right_desc:"「上头写着呢。」另一家指了指牌子，那家便把水瓢收了回去。水按户分配，地多的人家水便多，都写在明处，就少了许多争吵。从前为半桶水翻脸的两家邻居，如今照册取水各自无话。"
 SUM_Neo_SGD.64.t:"析水授户"
 SUM_Neo_SGD.64.d:"水按户分配，谁家的地多，谁家的水便多，明明白白写在册上，贴在村口的墙上，人人都能去看。谁也不许私下多占，谁也不吃亏，多一勺少一勺，都算得清楚。写在明处，就少了争吵，省了许多口舌，邻里之间也和气。有一回，一户人家想多引一点水，夜里悄悄改了口子，把水往自家地里引，被邻家一早看见，当场指出来，叫来众人评理。那户人家脸一红，无话可说，只得又把口子改回原样，还赔了一筐椰枣。这分水之法，贵在一个明字，明则公，公则安。把一桩难事办成了易事，从此邻里之间少了许多口角，家家按地上的亩数领水，多寡明白，谁也不眼红谁，村口那面墙上的册子，倒成了众人信服的东西。"
 SUM_Neo_SGD.64.a:"以契约立信"
 SUM_Neo_SGD.64.b:"以枪杆立威"
 SUM_SGD_RA_City_Charter:"镌邦之典"
 SUM_SGD_RA_City_Charter_desc:"宪章把城里的公事分得清楚：议是一拨人，办是一拨人，查又是一拨人，谁也不能身兼两职。有个人想议完接着自己办，被旁人顶了回去：「你一人全占了，别人还干什么？」三拨人各守一摊，谁也休想伸手去管别人的事。"
 SUM_Neo_SGD.65.t:"镌邦之典"
 SUM_Neo_SGD.65.d:"须弥沙漠里，城邦众多，向来各管各的事，遇上一桩公事，你推我，我推你，到头来没个着落。这一日，几城的头人聚在阿如村的火塘边，说要给每座城立一份宪章。这宪章不是摆设，白纸黑字写得明白：城里的公事，谁来议，谁来办，谁来查，三桩事分作三拨人去管。议的人只管拿主意，办的人只管跑腿，查的人专挑毛病，三下里谁也不许兼着。查事的一拨，专挑人的毛病，众人起先嫌他多事，后来才知少了不行。有个年轻后生忍不住问，何苦分得这般细？一位白头老者笑道，从前一件事坏在一个人手里，旁人只能干瞪眼；如今三拨人互相盯着，谁想动手脚，也须过另外两关。满座听了，都道这法子稳当，提笔的提笔，按印的按印，一份宪章就此立下。"
 SUM_Neo_SGD.65.a:"把利润分给城邦"
 SUM_Neo_SGD.65.b:"把利润收归官库"
 SUM_SGD_RA_Council_Hall:"坐镇公堂"
 SUM_SGD_RA_Council_Hall_desc:"议事厅是城里最结实的屋，门朝集市开，谁都能推门进去旁听。有个卖菜老汉听得入神，菜篮子举在手里半天也没放下，里头的茄子都掉了。那门板日里从早敞到晚，没人拦着谁。"
 SUM_Neo_SGD.66.t:"石堂向市"
 SUM_Neo_SGD.66.d:"城里要盖一座议事厅，众人商量着，别处都可将就，唯有这厅堂，须用最结实的石料，垒得比谁家屋子都牢固。不多时日，一座高屋立在集市尽头，门朝着最热闹的街口开，两扇门板日里从早敞到晚。原来立屋的人存了一片苦心：但凡城里议什么大事，谁都能推门进去，站在旁边听一听，听得懂也罢，听不懂也罢，没人拦着，也没人赶。起先有几个胆小的，伸头探脑不敢进，后来见里头的人只顾说话，并不拿眼瞪人，胆子便大起来，索性搬条凳子坐下听。有一回，一个卖菜的老汉听得入了神，手里的菜篮子都忘了放下。日子一久，这议事厅竟成了城里最热闹的所在。此中大有文章。"
 SUM_Neo_SGD.66.a:"借水草养人"
 SUM_Neo_SGD.66.b:"借商队养兵"
 SUM_SGD_RA_Citizen_Roll:"括民著籍"
 SUM_SGD_RA_Citizen_Roll_desc:"把城里人逐个登记：谁是本城，谁是新来，一册可查。书吏挨门挨户去问，问到游荡的旅团，便记一笔「无籍」。有个佣兵梗着脖子：「爷爷没籍！」书吏照记不误。有了这册子，赋税兵役才说得清。从前装穷喊冤的，翻开册子便无话可讲。"
 SUM_Neo_SGD.67.t:"括民著籍"
 SUM_Neo_SGD.67.d:"有几户新来的，起初想隐瞒人口，见册上写得清楚，只得老实报上。也有老人不识字，书记便一项项念给他听：「籍贯某某，年岁某某，可错了？」老人点头，记下才作罢。书记伏案写得手腕发酸，心里却欢喜。这一册大账立起来，往后城里的事便像沙地上插了标杆，查得清，走得稳。新法头一桩，是清点人口：官府派人挨家挨户地走，把城里人逐个登上册，本地土生的、外乡新来的，籍贯年岁，一笔一笔记下，汇成一册。这册子瞧着平常，用处却大。旧时收税派役，凭几句口传，富的装穷，穷的喊冤，一笔糊涂账怎么也算不清。如今翻开一查，谁该出多少赋、服几日兵役，白白写在纸上，再没扯皮的余地。"
 SUM_Neo_SGD.67.a:"让商路连通四方"
 SUM_Neo_SGD.67.b:"把商路关起来自守"
 SUM_SGD_RA_Guild_Charter:"给行会符"
 SUM_SGD_RA_Guild_Charter_desc:"各行业自立行会，行情与学徒的规矩都自行会定，官署只管收税。内行管内行事，再没人拿外行充内行。行会里论价，常常争得面红耳赤。有个老匠同后生争金价，争完却拍拍他肩膀：「有长进。」争完，一同长进。"
 SUM_Neo_SGD.68.t:"给行会符"
 SUM_Neo_SGD.68.d:"那铁匠气得把锤子往砧上一摔，半晌缓不过气。一把刀明明值三枚摩拉，偏被外行压到两枚，这口气如何咽得下。如今行了新法，这冤屈再不会有了。城中行当渐渐多起来：铁匠、织工、陶匠、盐商，各有一班人马。众人商议，索性让各行各业自立行会，行情几何、学徒几时出师，都归行会自己定夺；官署只管到期收税，别的一概不插手。这一条最合匠人心意。行会里尽是懂行的，一把刀值多少，瞧瞧成色便知，再没人能外行充内行。官府也落得清闲，只管收钱，不问行规，两下都欢喜。匠人们凑在一处，论刀论布，争得面红耳赤，可争完了，各家的手艺却一同长进。有个老织工笑道：「争归争，手上的活计却马虎不得。」"
 SUM_Neo_SGD.68.a:"以契约立信"
 SUM_Neo_SGD.68.b:"以枪杆立威"
 SUM_SGD_RA_Elected_Steward:"众举一人"
 SUM_SGD_RA_Elected_Steward_desc:"执事由城里推举，一任三年，任满不得连任。推举当日吵得面红耳赤，可一旦定了，众人反倒齐心。落选的还主动上前道喜：「这回你上，下回我来。」新执事上任头一日，天不亮便坐进厅里，谁来都接待。"
 SUM_Neo_SGD.69.t:"众举一人"
 SUM_Neo_SGD.69.d:"有个老头儿，当初在集上吵得最凶，后来见执事办得公道，私下对人说道：「先前是怕选错了人，如今看来，倒是我多心了。」要知那日选执事，集市上闹翻了天：张三公道，李四能干，众人各执一词，吵得面红耳赤，唾沫横飞，险些动了拳头。有几个嘴快的，把候选人的旧事一桩桩翻出来数落，听的人时而点头，时而摇头。原来这城里执事，如今改由众人推举，章程定得明白：一任三年，任满交印，不许连任。奇的是，等人真上了任，先前吵得最凶的反倒都不吭声了。吵归吵，一旦选定了便齐心，谁也不再去添乱。新执事也争气，天天坐在厅里办事，不摆架子，不耍威风。"
 SUM_Neo_SGD.69.a:"把利润分给城邦"
 SUM_Neo_SGD.69.b:"把利润收归官库"
 SUM_SGD_RA_Fair_Toll:"税则持平"
 SUM_SGD_RA_Fair_Toll_desc:"税则写在一块大牌上，立在城门口。过路的先看牌，再交钱，交多少自己算得出。有个税吏想多收一文，被商人当场指出：「牌上写着两文！」税吏只得缩回手。那牌子立在城门，比税吏的嘴靠得住。"
 SUM_Neo_SGD.70.t:"税则持平"
 SUM_Neo_SGD.70.d:"城门口竖着一块大木牌，字有斗大，老远就望得见。凡进城的人，望见这牌，都要站住：先瞧瞧上头的税则，再看看自己挑的货，心里默算该缴多少，算明白了，才走到税吏跟前掏钱。这牌子是官府新立的，一条条税则写得清楚。它省了多少口舌！从前没有牌，收多收少全凭税吏开口，商贩被勒索惯了，只能忍气吞声。如今白纸黑字亮在城门，谁都瞧得见，税吏想多收一文，立刻就有人当场指破。商队的老把式经过，总要把牌念一念，念完点点头，挑担进城。不识字的，便求旁人念一遍，听完道声多谢。"
 SUM_Neo_SGD.70.a:"借水草养人"
 SUM_Neo_SGD.70.b:"借商队养兵"
 SUM_SGD_RA_Open_Market:"开市通商"
 SUM_SGD_RA_Open_Market_desc:"集市不分内外，谁来都能摆摊。外邦商队头回来时将信将疑，卸一半货试试；第二回便赶来整队，把半条街都塞满。有个摊主笑道：「上回你还怕卖不掉呢。」如今这集市上南腔北调，什么口音都听得见。"
 SUM_Neo_SGD.71.t:"开市通商"
 SUM_Neo_SGD.71.d:"那外邦老商站在集市边上，先把货物卸下一半，两只眼还不住往四下里瞟，生怕有人来赶。头一回赶着骆驼来，他实在将信将疑。为首的老商探头探脑，问旁边人：「这地界真许我们摆摊？」旁人点头道：「许，尽管摆。」他犹自不信。谁知一上午卖得出奇的好，收了摊数钱，比在别处还多。这新立的集市有一条规矩：不分内城外城，不分本地外邦，谁来都能摆摊做买卖。到了第二回，那老商二话不说，赶来整整一队货，一不做二不休，把货全卸下来，摆得满满当当。骆驼排成长龙，把半条街都塞满了。如今这集市，南腔北调的口音都有，反倒成了沙漠里最热闹的所在。"
 SUM_Neo_SGD.71.a:"让商路连通四方"
 SUM_Neo_SGD.71.b:"把商路关起来自守"
 SUM_SGD_RA_Caravan_Insurance:"行商相保"
 SUM_SGD_RA_Caravan_Insurance_desc:"「倒真爽快。」领头的捧着赔下来的银子道。几支商队凑了一笔保银，谁在路上遭了事，就从这钱里补。有一支队伍被劫，保银当天就赔到手。这么赔付几回，劫道的没了油水，道路上反倒清净了。银钱明明白白摆着，谁也不必扯皮。"
 SUM_Neo_SGD.72.t:"行商相保"
 SUM_Neo_SGD.72.d:"那伙劫道的，听说商队有了赔付的底气，抢也讨不着多少便宜，反惹得巡防队追得紧，索性收了刀枪，改行种地去了。沙漠里商路难走，时有劫匪出没，商队提心吊胆。几支商队一合计，各出一些摩拉，凑成一笔保银，由专人掌管，立下规矩：谁在路上出了事，遭了抢，折了货，便从这笔银子里照数赔付。这保银办了没多久，怪事就来了。头一回赔付，是给一支被劫的商队，银子发出去，众人也不心疼。第二回，第三回，赔了几趟之后，路上的劫案竟一天少似一天。如今商队走在路上，驼铃声声，再不用三步一回头。有个老驼工笑道：「从前是拿命赶路，如今是拿着保银赶路，心里踏实。」大伙都说，这银子出的值，出在明处，用在明处。"
 SUM_Neo_SGD.72.a:"以契约立信"
 SUM_Neo_SGD.72.b:"以枪杆立威"
 SUM_SGD_RA_Mint_Oasis:"洲设钱冶"
 SUM_SGD_RA_Mint_Oasis_desc:"「你看，边上的字。」一个商人把钱举到光下照，另一个便不言语了。两个商人为找零差点吵起来。新铸的钱，成色分量都刻在钱边上，这钱好使不靠金铜，靠的是拿钱的人信。先前收钱要咬一咬才敢要，如今看一眼掂一掂便知。"
 SUM_Neo_SGD.73.t:"洲设钱冶"
 SUM_Neo_SGD.73.d:"老商人捧着一把新钱，掂了掂，对伙计道：「你瞧，这钱分量实在，人心的分量，也跟着实在了。」伙计接过细看，钱沿上刻着成色几分、分量几重，一笔一画，明明白白。要知这钱的来历，还得说旧钱的不是。先前那些钱，成色一回差似一回，拿在手里轻飘飘的，拿到市上，人家先要咬一口，皱一皱眉，有的索性不收，买卖双方常为此争得脸红脖子粗。官府有见及此，才新铸了这一批。这钱好不好使，不看铜，不看金，全凭拿着的人信得过。如今边上刻着定数，谁也不用咬，瞧一眼、掂一掂，心里便有了数。卖货的见了，眉开眼笑，爽爽快快把货交出去。渐渐的，远近商队都认这钱，走到哪儿都使得。往日找零那些口舌，如今也没了。"
 SUM_Neo_SGD.73.a:"把利润分给城邦"
 SUM_Neo_SGD.73.b:"把利润收归官库"
 SUM_SGD_RA_Grand_Route:"商涂四达"
 SUM_SGD_RA_Grand_Route_desc:"把几条旧道连成一条通衢，沿途设驿站、挖井。走这条路的人，一年能多跑两趟。有个老驼工掐指一算，笑得胡子直翘：「多跑两趟，多挣两份！」从前赶一趟歇三回，如今连货带人一并顺当。"
 SUM_Neo_SGD.74.t:"商涂四达"
 SUM_Neo_SGD.74.d:"入夜，驿站里灯火点点，赶路的人围着火堆闲话，再不像从前那般凄惶。那年轻驼夫头回走这新路，进得驿站，见草料备得足，井水清亮，忍不住赞道：「这路修得，真是积德的事！」要搁从前，哪有这等舒坦。沙漠里原有几条旧道，年久失修，被风沙埋得断断续续，走一步磕一步。官府决意把它们连成一条通衢，沿途隔一段设一处驿站，挖一口井，供行人歇脚饮水。这路一修成，好处说不完：旧时赶一趟路，人困驼乏，连个歇脚的地方都没有，一年到头跑不了几趟；如今有了驿站井水，乏了便歇，渴了便饮，人和牲口都少受罪。商队的老把式掐指一算，一年竟能多跑两趟，每多一趟，就多赚一笔。有那好事的，把这事记上了册。"
 SUM_Neo_SGD.74.a:"借水草养人"
 SUM_Neo_SGD.74.b:"借商队养兵"
 SUM_SGD_RA_Academy_Oasis:"洲设学舍"
 SUM_SGD_RA_Academy_Oasis_desc:"部族那少年头一回到学馆，两只眼睛忙不过来，四处张望，连先生的书案也伸手摸了摸。先生不但不恼，还笑道：「喜欢，就多来看看。」少年咧开嘴。学馆里教的是算术、地理、律例，城里娃和部族少年都来。"
 SUM_Neo_SGD.75.t:"洲设学舍"
 SUM_Neo_SGD.75.d:"有个孩子的娘，天天立在学馆门外听，听见儿子念书，一张脸笑成了一朵花。这学馆的门槛，快被踩平了。城里新开这所学馆，请了位先生教书，教的尽是新鲜学问：算术、地理，还有律例。来求学的三教九流：有城里稚童，个头才及案台，背书摇头晃脑；也有部族里送来的少年，一身沙土气，头回进屋，两只眼东瞅西瞅，不够使唤。先生一视同仁，并不嫌弃，算术从加减算起，地理先讲本城，律例挑最简单的条文念。那些部族少年起初跟不上，抓耳挠腮，日子久了，慢慢也摸着门道。每至夜里，学馆灯火通明，读书声传出老远。有个过路的行人驻足听了半晌，暗自寻思：这沙漠里，居然也有了读书声。"
 SUM_Neo_SGD.75.a:"让商路连通四方"
 SUM_Neo_SGD.75.b:"把商路关起来自守"
 SUM_SGD_RA_Law_Code:"沙碛立条"
 SUM_SGD_RA_Law_Code_desc:"「这几处，留给后人吵吧。」执笔的写到空白页，搁笔叹道。旁边人笑：「你倒省事。」把各部各城的老规矩合成一部律例，合不拢的地方先空着，那几处空白明摆着，是留给将来争的。"
 SUM_Neo_SGD.76.t:"沙碛立条"
 SUM_Neo_SGD.76.d:"各部派来的人围着长桌，你念一段我念一段，合得拢的记下，合不拢的谁也不肯让，先空着，留待来日。有个性急的后生不耐烦，问何不干脆定下。一位老成持重的长者摇头道：「律例急不得。今日硬按下去，明日人家不服，仍是争吵。不如空着，留个余地，等人心平了再填。」原来各部各城，老规矩多如牛毛，你一条他一款，往往对不上，众人决意把它们汇到一处，编成通行律例。这活儿最费力。一部律例，写得满满当当，偏又留着几处空白。执笔的人写到那几页，只好搁笔叹气。要知这几处空白，众人心里都雪亮，是留着将来再吵的。"
 SUM_Neo_SGD.76.a:"以契约立信"
 SUM_Neo_SGD.76.b:"以枪杆立威"
 SUM_SGD_RA_Circuit_Judge:"谳使出巡"
 SUM_SGD_RA_Circuit_Judge_desc:"一位商人涨红了脸，嘴唇动了半天想反驳，终究没敢出声。原来那巡案官每季度都要遍历各城，就地问断，判词就当着当事人的面宣读。他带上路的家当极少，一头驮兽背着卷宗和旧帐篷，到了城下就支起棚子升座。判词一念完，你纵有满腹不服，也只能各回各家。"
 SUM_Neo_SGD.77.t:"谳使出巡"
 SUM_Neo_SGD.77.d:"两个商人为一匹布争执不下，各说各有理。法官问明情由，当堂把判词一字一句念将出来。那输的一方脸涨得通红，嘴张了几张，到底没吐出一个字，悻悻地去了。这法官断案有个古怪规矩：判词写成，定要当着原告被告的面念出来；念罢，任你如何不服，也只能各自回家，不许在堂上撒泼。原来律例虽定，还得有人断案，官府便设下法官，按着节气走遍各城，就地审案，省得把人犯远远押到府城。旁人问法官，何必当众念。法官道：「念给他听，好教他明白输在哪里。心里服不服，日后再论，只是这堂上的规矩，却立住了。」围观的人听了，都点头，说这判法明白。众人无不称善。"
 SUM_Neo_SGD.77.a:"把利润分给城邦"
 SUM_Neo_SGD.77.b:"把利润收归官库"
 SUM_SGD_RA_Contracts_Archive:"券契入藏"
 SUM_SGD_RA_Contracts_Archive_desc:"凡立大契的，都留一份底在存档处，收进樟木柜，柜上编号。日后起了争执，取出来一对便知。先前两个商人打了一辈子官司，各执一词。如今字据俱在，赖账的捧着那底稿看了半晌，也无话可说。"
 SUM_Neo_SGD.78.t:"券契入藏"
 SUM_Neo_SGD.78.d:"那个赖账的商人被带到存档处，看见老吏捧出一卷发黄的契纸，脸色唰地就白了。他原以为年头久了，谁也记不清当初立的什么约，这才敢翻脸不认账。谁知官府早有规矩：城里人立契，买卖田地也好、借贷银钱也罢，凡立大契都得留一份底稿，收进这专门的存档处。当年那纸底稿取出来一摊，白纸黑字，字据俱在，他登时张口结舌。早先没这存档的时候，两个商人打了一辈子官司，你说我赖账、我说你讹人，各执一词拿不出凭据，法官急得抓耳挠腮，最后只能和稀泥判了。如今有了底稿，是非一对照就明白。打那以后，城里人立契都晓得要多留一份底，管存档的老吏把契纸一张张按年月理齐，心里明白：这些纸片片，都是往后断案的凭据。"
 SUM_Neo_SGD.78.a:"借水草养人"
 SUM_Neo_SGD.78.b:"借商队养兵"
 SUM_SGD_RA_Scribes:"书吏授业"
 SUM_SGD_RA_Scribes_desc:"书记在沙漠里是稀罕行当，会写字的比会打仗的还少。学馆里最抢手的便是写字这一门。有个牧羊少年拿树枝在沙上划拉，划了又抹，手上磨出茧子。先生看了，递给他一支真笔：「沙上写的，留不住。」"
 SUM_Neo_SGD.79.t:"书吏授业"
 SUM_Neo_SGD.79.d:"老人们啧啧称奇：一支笔，竟比一把刀还金贵。说的是部里那个放羊少年，家里世代放羊，他偏生迷上了写字，日日拿树枝在沙地上划来划去，划了抹、抹了划，手上硬生生磨出一层茧。后来他果真成了部里头一个会写字的人，替族人写信记账，人人敬重。逢年过节，提着礼上门求字的，把门槛都踏平了。要知沙海之中，识字的先生为何这般稀罕？这话半点不假，会写字的，比会耍刀弄枪的还少。部族里遇了事要写封信，往往得走上几十里，才能寻到一个书记。那书记走到哪儿，都有人堆着笑脸，捧上好茶。城里学馆开了几门课，偏偏写字这一门最挤，孩子们打破头也要学，先生收徒都收不过来。只有那明白人，早看破了。"
 SUM_Neo_SGD.79.a:"让商路连通四方"
 SUM_Neo_SGD.79.b:"把商路关起来自守"
 SUM_SGD_RA_Well_Pact:"同井要盟"
 SUM_SGD_RA_Well_Pact_desc:"邻村共用一口井的，立约写明轮流取水的时辰，一刻不差。约立得细，争水的事就少。有个人半夜偷着打水，第二日照约罚了双倍，还被挂着牌子示众。那木牌就挂在井边，风吹日晒也不摘。"
 SUM_Neo_SGD.80.t:"同井要盟"
 SUM_Neo_SGD.80.d:"两家碰了面，还能笑着打个招呼，再不为半桶水红了脸。那偷水的，半夜摸到井边，以为没人瞧见，谁知第二日就被照约问罪，罚了双倍的水，打这以后，再没人敢耍这点小聪明。原来邻村邻城，常有几家合用一口井，水在这地界最金贵，为一桶水翻脸的，时有耳闻。立约的人想了个细法子，把取水的时辰一一写清：谁家哪一时辰打水，一刻不差，全定在约上，连谁先谁后、误了时辰怎么补，都写着。起初有人嫌烦，撇嘴道：「打口水还要看时辰，小题大做。」哪知日子一久，争水的果然少了。先前为谁先谁后吵得不可开交，如今照约行事，时辰一到自然轮着你，谁也挑不出理。列位，这便是立约的好处。"
 SUM_Neo_SGD.80.a:"以契约立信"
 SUM_Neo_SGD.80.b:"以枪杆立威"
 SUM_SGD_RA_Karez:"层町暗渠"
 SUM_SGD_RA_Karez_desc:"「这地，一年能打两回了。」老农蹲在田埂上，抓把泥土闻了闻，笑得合不拢嘴。把坡地开成梯田，又用暗渠引来地下水，如今一年多种一季，农人夜里竟能多睡一个时辰。"
 SUM_Neo_SGD.81.t:"层町暗渠"
 SUM_Neo_SGD.81.d:"孙儿在田里追着蜻蜓跑，老人看着，眼睛眯成一条缝，弯下腰凑近田垄闻了闻泥土，笑得合不拢嘴。他蹲在自家新开的田埂上，掐指算了半晌，笑道：「从前一年忙到头，如今多种一季，晚上竟能多睡一个时辰，这日子，是有盼头了。」沙地种田，难就难在水土：众人琢磨出两个法子，一是把坡地开成层层梯田，好把雨水留住，二是从地下挖暗渠，引水浇田。这两桩一办成，庄稼的收成便大不同。旧时一年只种一季，地力薄，水也不够，农人成年累月在地里刨食；如今梯田一层叠一层，暗渠纵横交错，水旱都不怕，竟能多种一季。多打一季粮，腰包鼓了，觉也睡得安稳。"
 SUM_Neo_SGD.81.a:"把利润分给城邦"
 SUM_Neo_SGD.81.b:"把利润收归官库"
 SUM_SGD_RA_Date_Harvest:"枣实盈仓"
 SUM_SGD_RA_Date_Harvest_desc:"「脏！」孩子正吃得满嘴是甜，连落地的枣核都捡起来啃，被他娘拍了一下。枣椰是沙漠的粮，也是糖，丰产年一串串压弯枝头，市上价钱落了三成，穷人家也买得起几串解馋。"
 SUM_Neo_SGD.82.t:"枣实盈仓"
 SUM_Neo_SGD.82.d:"孩子们围着果堆，吃得满嘴是甜，连落在地上的枣核，都要捡起来再啃两口。枣椰这东西，在沙漠里可是宝贝，它的果子能当粮，能充饥，还能熬成糖，甜到心里。逢上枣椰丰产的年景，那景象喜人：一串串枣椰压弯了枝头，沉甸甸的，摘下来堆成小山，黄灿灿一眼望不到边。果子多了，价钱自然就落，市上的枣椰价，一落就是三成。从前穷苦人家舍不得吃，如今也能买上几串，解解馋。卖果子的摊主吆喝得嗓子都哑了，一边数摩拉，一边笑道：「今年这果子，结得多，卖得贱，可众人都能吃上，倒也是桩好事。」有个老汉买了几串，坐在树下慢慢嚼，连说这日子甜。树上的枣椰还剩着不少没摘，风一吹，香甜味飘出老远。"
 SUM_Neo_SGD.82.a:"借水草养人"
 SUM_Neo_SGD.82.b:"借商队养兵"
 SUM_SGD_RA_Rotation:"逐场迭牧"
 SUM_SGD_RA_Rotation_desc:"一块木牌挂在羊圈门口，风吹日晒也不摘，上头写着草场轮放的日程。哪天进哪片草场，瞧一眼牌子就明白。有回一个后生想多放一天，老牧人指着牌子道：「上头写着呢。」"
 SUM_Neo_SGD.83.t:"逐场迭牧"
 SUM_Neo_SGD.83.d:"羊圈门口挂着一块木牌，上头写着每片草场该轮到哪一天。谁家的羊哪天进哪片草场，看牌便知。有个年轻牧人不解，问老牧人为何把日子挂出来。老牧人指着木牌道：「写下来，大伙照着办，谁也不许多放一天，草场才养得起咱们。」年轻人恍然大悟，原来这牌上写的，是草场的养生之道。要说这法子的来历：放牧也有讲究，草场若让牲口一年四季啃个不停，草根都要啃绝，来年便没得放。牧场主们聚在一处商定，把草场切成一片一片，轮着放：这块啃光了，便赶到下一块，留先前那块缓一缓，好重新长草。为把日子排明白，才立了那块木牌。这法子实行下来，草场果然养得住，羊群也肥壮了，乖乖往下一片草场走，谁也不用催。"
 SUM_Neo_SGD.83.a:"让商路连通四方"
 SUM_Neo_SGD.83.b:"把商路关起来自守"
 SUM_SGD_RA_Granary:"置常平廪"
 SUM_SGD_RA_Granary_desc:"丰年买粮存进仓，荒年开仓平价粜出。那年旱灾，全靠仓里的粮救了命。有个老妇捧着米袋，眼眶红了，嘴唇直哆嗦：「这粮，救了俺一家。」仓里存的不只是粮，是人心。"
 SUM_Neo_SGD.84.t:"廪实系心"
 SUM_Neo_SGD.84.d:"那年天旱，地里颗粒不收，市上的粮价一天翻几个跟头，百姓慌了神，挤在粮铺门口，摸着空钱袋干瞪眼。正慌乱间，官府的仓门开了，一斗粮按平价粜出，队伍排得老长，可人人手里都拎得了米。老妇人捧着米袋，眼泪扑簌簌往下掉，连声道：「这仓里的粮，救了咱全家的命！」原来早些年，众人立了个长远的法子：丰年粮多价贱，官府便掏钱买粮，一囤一囤存进大仓；到了荒年粮少价贵，再开仓平价粜出，让穷人也能买得起。这仓里头，头一年存的是粮，年头久了，存下的却是人心。打那以后，城里人一提起这仓，心里就怀着份敬意。管仓的人日日把仓门扫得干净，粮囤码得齐整。百姓都说，多亏当年那句丰年积谷的老话，才没断了活路。"
 SUM_Neo_SGD.84.a:"以契约立信"
 SUM_Neo_SGD.84.b:"以枪杆立威"
 SUM_SGD_RA_Militia_Law:"立乡伍法"
 SUM_SGD_RA_Militia_Law_desc:"每城每族出丁，平时务农，战时集合。兵器自备，粮草从公中出。有个父亲拍着儿子肩膀道：「只管安心操练，家里的地，爹替你种着。」校场上刀矛如林，号声一响，黑压压站齐了。"
 SUM_Neo_SGD.85.t:"立乡伍法"
 SUM_Neo_SGD.85.d:"一个父亲拍着儿子的肩膀道：「去吧，家里有公家的粮，你只管安心操练，家里的地，为父替你种着。」儿子听了，胸脯挺得老高。号角一响，校场上刀矛林立，人山人海，个个精神抖擞。要问这兵从何而来？官府立了规矩：每城每族都得抽丁，平日里各务农桑，一有警讯便聚拢听用，为的是守卫自家乡土。刀矛弓箭由各人自备，粮草却由公家供给，不消当兵的解囊。这章程一定，众人反倒争着报名。旧时一提征兵，百姓躲还来不及；如今兵器是自己的，粮草是公家的，守的又是自家田舍，哪个还肯落在人后。日头底下，一排排刀矛寒光闪闪，照得人心头发亮。"
 SUM_Neo_SGD.85.a:"把利润分给城邦"
 SUM_Neo_SGD.85.b:"把利润收归官库"
 SUM_SGD_RA_Oasis_Wall:"立垣卫洲"
 SUM_SGD_RA_Oasis_Wall_desc:"沿绿洲外缘垒一道低墙，挡流沙，也挡散骑。这墙不高，够用就行。有个年轻工匠边垒边嘀咕：「这么矮，顶什么用？」老成的笑道：「能挡一挡，便是功劳。」墙根底下，孩子们绕着玩，再不怕风沙。"
 SUM_Neo_SGD.86.t:"立垣卫洲"
 SUM_Neo_SGD.86.d:"一个牧羊的娃娃趴在矮墙上，数着远处慢悠悠过来的驼队，羊群就在墙根下啃草，再不怕风沙卷走。这道土墙不高，是众人绕着绿洲外缘垒的。垒高了费时费力，也用不着。它挡两样东西：一是年年往绿洲边上爬的流沙，二是来去如风的散骑。墙虽矮，风沙撞上去总要缓一缓；散骑到了墙下，也得勒马慢行找缺口，这一慢，守墙的就抢了先手。当初垒墙时，有个工匠边干边念叨：这么矮的墙，能顶什么用？老成的人笑他：够用就成，能挡住一分，便是一分功劳。墙垒成后，绿洲果然安生多了。远远望去，那道土色的堤稳稳护着一片绿，街坊四邻都传遍了。"
 SUM_Neo_SGD.86.a:"借水草养人"
 SUM_Neo_SGD.86.b:"借商队养兵"
 SUM_SGD_RA_Watchtower:"筑台瞭望"
 SUM_SGD_RA_Watchtower_desc:"隔几里筑一座望楼，白天举旗，夜里举火。一处见动静，一程程传下去，转眼几十里。有回快马还没跑出十里，救兵已到了，那商人惊得直咂舌。火光一处接一处，像条火龙在沙丘上游。"
 SUM_Neo_SGD.87.t:"传烽递帜"
 SUM_Neo_SGD.87.d:"「咱们的快马还没跑出十里，救兵就到了，真是神了！」获救的商队后来见人就说这话。原来沙漠太大，消息难传，众人便想了个主意：每隔几里地盖一座望楼，楼里轮流派人守着，白天升旗，夜里点火。这一旗一火，传得比快马还快。哪座望楼先瞧见动静，旗子一举，隔壁望楼看见了也跟着举，一程接一程往下传，眨眼间消息就飞出几十里。到了夜里，火头一处连一处，火光映着沙丘，活像一条火龙在游走。守楼的人昼夜倒班，眼睛熬得又酸又涩，也不敢合眼打个盹。守卫换了一茬又一茬，旗和火却从来没断过。自从有了这套法子，沙漠里就再没有送不出去的消息了。"
 SUM_Neo_SGD.87.a:"让商路连通四方"
 SUM_Neo_SGD.87.b:"把商路关起来自守"
 SUM_SGD_RA_Route_Patrol:"商涂置戍"
 SUM_SGD_RA_Route_Patrol_desc:"巡防队专护商路，遇劫便追。追得凶了，那伙劫道的索性收了刀枪，改行种地，还托人捎话：「不抢了，种地踏实。」商队走在路上，驼铃声也响得欢快。从前三步一回头的路，如今放心走到底。"
 SUM_Neo_SGD.88.t:"商涂置戍"
 SUM_Neo_SGD.88.d:"为首的把刀往沙地一扔，带了手下人开荒种田，从此金盆洗手。劫道这买卖，风险大了，油水却薄，算下来还不如下力气种地。商路要太平，少不了一支巡防队。这队人马专管护着商路，遇上劫匪便追，追得越凶越好。起初那伙人仗着熟悉沙路，劫了一回又一回，把商队吓得不敢上路。自从巡防队成立后，马力健，脚程快，一有警讯便追，追得那伙人东奔西窜，没个安生。如今商队走在路上，再不见那伙人的影子，驼铃声也响得欢快了。有个老商人说道：「从前走这条路，提心吊胆；如今踏实多了。」那条从前冷清的沙路，渐渐又热闹起来，驼铃声昼夜不绝。"
 SUM_Neo_SGD.88.a:"以契约立信"
 SUM_Neo_SGD.88.b:"以枪杆立威"
 SUM_SGD_RA_Peace_Guard:"编诘盗之伍"
 SUM_SGD_RA_Peace_Guard_desc:"城里治安队由本城人充任，只抓偷抢，不管议论。几个茶客议论朝政，声音大了些，治安队路过只当没听见，还朝茶摊点了点头。茶摊上的人越聚越多，茶水也多卖了几壶。"
 SUM_Neo_SGD.89.t:"只缉盗贼"
 SUM_Neo_SGD.89.d:"「咱们只管偷抢的，说话又不犯法，管他怎的。」治安队那人笑着撂下这句，径直走了过去。几个茶客正围在摊上议论朝政，你一言我一语，嗓门大了些，把前后街坊都招来看热闹，治安队的恰好路过听见，却装作没听见。旁人问他怎不管，他才回了这么一句。原来城里的治安交给本城人打理，这治安队全是城里百姓充任，昼夜巡查，专抓偷盗抢劫的歹人。他们执法有个分寸：只拿偷抢，不问议论。众人听了都夸这治安队懂事。从此城里风气越发好，小偷小摸绝了迹，百姓说话也自在。茶摊上的议论声一天比一天响亮，摊主也乐，人多嘴杂，茶水就卖得多，两下都欢喜。这里头大有学问。"
 SUM_Neo_SGD.89.a:"把利润分给城邦"
 SUM_Neo_SGD.89.b:"把利润收归官库"
 SUM_SGD_RA_Republic_Stands:"洲众共政"
 SUM_SGD_RA_Republic_Stands_desc:"各城执事在同一份宪章上按手印，水按户分，税按牌收，巡案的官按季巡。沙漠头一回靠一叠写得清清楚楚的纸管事。那手印按下去，红彤彤一片。有个执事举起手看了看：「十个指头，都按上了，谁也不许翻悔。」"
 SUM_Neo_SGD.90.t:"洲众共政"
 SUM_Neo_SGD.90.d:"有个老者抚摸着新立的界碑，回头对孙子说道：「记住今日，这是咱们沙漠头一回立规矩。」原来这天立盟，各城执事聚在一处，在同一份宪章上，一个个按下鲜红的手印。这一叠纸，分量千斤：绿洲的水按户均分，商路上的税照牌收取，法官按季巡行各城，都写得清清楚楚。想我沙漠之地，千百年来靠着口头约定过日子，今日头一回，靠一叠明白纸来管事。散了会，众人走出厅堂，沙丘上的路标也都是新立的，一根根木桩插在沙里，指着通往各城的方向。众人听了老者的话，都觉在理，纷纷点头，把手印又按得实了些。"
 SUM_Neo_SGD.90.a:"借水草养人"
 SUM_Neo_SGD.90.b:"借商队养兵"

 #### 乙线 · 旅团公议 ####
 SUM_SGD_RB_The_Eremite_Council:"旅众会议"
 SUM_SGD_RB_The_Eremite_Council_desc:"老佣兵把刀往桌上一横：「谁说没主子？主子就是这契约。」还有一条路可走：把沙漠交给旅团同部族共管，契约、水源都归公，厮杀的差事由旅团接下来。有人唤它佣兵的国，也有人唤它没主子的国。"
 SUM_Neo_SGD.91.t:"旅众会议"
 SUM_Neo_SGD.91.d:"部族的人和旅团的汉子，从此同在一处喝水议事，谁家缺粮、谁路上遇险，大伙一同帮衬。名号之争，到头来倒显得无关紧要了。有个旅团头目听说后哈哈大笑：「叫什么都好，只要大伙有饭吃、有水喝、没人欺负，这国有没有主子，又有什么要紧！」众人都笑了。治理沙漠其实另有一条路子：有人主张，与其事事归官府管，不如交给旅团和部族共同打理。契约归公，水源归公，厮杀征战的活计则由镀金旅团接下来。众人议定，沙漠的事大家商量着办。有人给新章程取名叫佣兵的国，有人却说这是个没有主子的国，两下各执一词，谁也说服不了谁，争到后来索性随它去。"
 SUM_Neo_SGD.91.a:"把土地分给部族"
 SUM_Neo_SGD.91.b:"把土地归入官仓"
 SUM_SGD_RB_Merger:"旅团并部"
 SUM_SGD_RB_Merger_desc:"几支大旅团并成一个名号，账目也合成一本。并入当日，各团把旧旗抖去沙尘，一圈圈折好，收进木箱。有个老兵望着那箱子，眼眶发湿，低声道：「这旗跟了我二十年。」木箱供在厅上，谁走过都要看一眼。"
 SUM_Neo_SGD.92.t:"旅团并部"
 SUM_Neo_SGD.92.d:"议事厅角落里搁着一只木箱，常有路过的汉子停下脚步，掀开看一眼，又轻轻合上。箱里是几面折得整整齐齐的旧旗。要说这些旗的来历，得从头讲起：沙漠里原本有几支大旅团，各竖各的旗号，各管各的人马，彼此间也井水不犯河水。后来几家头目坐在一处商议，索性把名号归一、账目合一，往后便成了一家。合并那天，各团把自己那面旧旗郑重取下，抖净沙尘，一圈圈折好，收进这只箱子。旗上那些名号和旧印，从此都成了陈迹。有个跟旗打了十几年交道的老兵，望着箱子直抹眼角，哽声道：「这旗跟了我十几年啊。」旁人拍他肩膀劝道：「旗虽收了，人还在，往后并作一家，势力更大。」老兵点点头，把箱盖上的灰来回擦了好几遍。这事后来传开，有好事的提笔记下，收进了册子。"
 SUM_Neo_SGD.92.a:"推举公议的执事"
 SUM_Neo_SGD.92.b:"沿用旧日的长老"
 SUM_SGD_RB_Public_Ledger:"公籍尽发"
 SUM_SGD_RB_Public_Ledger_desc:"团里的钱，进出多少，按月贴在营门口。起初有人嫌丢人，说：「自家底子亮给谁看？」后来发现账目清楚，借钱反倒容易。那牌子前天天围着人，念完了还拿指头一笔笔比对。"
 SUM_Neo_SGD.93.t:"公籍尽发"
 SUM_Neo_SGD.93.d:"营门口那块牌子，如今成了大伙最爱凑热闹的地方，天天有人围在那里念上几遍。牌子上每月更新一次，把团里进出的银钱一笔笔写得清清楚楚，谁都能凑过去看个明白。要说立这牌子的缘由，还得从旅团合并说起：几团并作一家后，管钱成了头疼事，于是定下章程，钱怎么进怎么出，逐笔登记，按月张贴。刚推行时，有人浑身不自在。有个管账的头目就嫌丢脸，嘟囔道：「咱们挣的钱一笔笔贴出去，叫外人看笑话，多丢人！」可时间一长，众人慢慢品出滋味来了：账目公开，好处多多。团里手头紧要借钱，外人见账目清清楚楚，晓得这团靠得住，爽爽快快就把钱借了；早先遮遮掩掩的时候，借个钱简直比登天还难。那个先前嫌丢人的头目，后来也红着脸改口：「原来这丢人的事，竟是桩好事。」一句话惹得弟兄们哄堂大笑。"
 SUM_Neo_SGD.93.a:"让花神的誓约作证"
 SUM_Neo_SGD.93.b:"让官署的法度作证"
 SUM_SGD_RB_Rank_By_Merit:"计功叙位"
 SUM_SGD_RB_Rank_By_Merit_desc:"队里的位子按功劳排，不看出身。这一条得罪了不少老人，也招来不少年轻人。有个骑士练武格外卖力，一边挥刀一边道：「这身武艺，便是我的本钱。」营里练武的风气，一日浓似一日。"
 SUM_Neo_SGD.94.t:"计功叙位"
 SUM_Neo_SGD.94.d:"有个年轻骑士在操练时格外卖力，对同伴说道：「咱们没有家世，可这条命和这身武艺，就是咱们的本钱。」同伴听了，也连连点头。原来队里的位子，如今按功劳大小来排，不再看谁的出身贵贱。这一条新规，有人欢喜有人愁，得罪了不少老人。那些老资格，原本凭着辈分稳占高位，如今要跟新来的人比功劳，心里如何服气？有的背着人直摇头，说：「这世道变了，连个先来后到都不讲了！」可这条规矩，也招来不少年轻人：他们出身寻常，没有靠山，却有一身本事和胆气，如今有了一条凭功劳升迁的路，一个个摩拳擦掌，跃跃欲试。一时间，营里练武的风气比从前浓了许多，人人都憋着劲要立功。"
 SUM_Neo_SGD.94.a:"与雨林互通有无"
 SUM_Neo_SGD.94.b:"与雨林划清界限"
 SUM_SGD_RB_Veteran_Pension:"存问旧卒"
 SUM_SGD_RB_Veteran_Pension_desc:"老卒退下来，每月有一份抚恤，按时发放。有个断臂的老卒接过银子，手直发抖，半晌哽咽道：「我这条命，值了。」那银子按月发，从不误了日子，老卒们心里都有底。"
 SUM_Neo_SGD.95.t:"存问旧卒"
 SUM_Neo_SGD.95.d:"那个缺了一条胳膊的老卒，双手捧着刚领到的银子，抖得厉害，嘴唇动了半天没吐出字，最后哽咽着说：「我这条命，值了！」沙漠的旅团里立了新规矩：老卒打不动仗、退下来之后，每月照样能领一份银子，按时发到手，一文不短。这份银子数目不大，可买回来的东西比金子还金贵。早先可不是这样：老卒一退伍，就没人管了，血战半生，到头来连饭都吃不饱，想起来让人心寒。如今按月领饷，老了也有依靠，年轻人在前头卖命，心里自然踏实。旁边年轻弟兄看着这一幕，暗暗盘算：等我老了，也能得这般照应，干起来更起劲。众人把这份抚恤看得比什么都重。每逢发饷那天，营门口排着长长的队伍，老卒们脸上都笑开了花。这事后来传遍了全城。"
 SUM_Neo_SGD.95.a:"把土地分给部族"
 SUM_Neo_SGD.95.b:"把土地归入官仓"
 SUM_SGD_RB_Eremite_Charter:"旅约新立"
 SUM_SGD_RB_Eremite_Charter_desc:"章程写明三条：不劫商队，不掠村庄，不弃同伴。违了的逐出，还须退赔。有个团员偷拿一匹绸缎，被当众逐出，照价赔了，临走连水囊都不许带。三项刻在木牌上，牌立在营门口，谁犯了都按着办。"
 SUM_Neo_SGD.96.t:"旅约新立"
 SUM_Neo_SGD.96.d:"有个血气方刚的年轻团员，见商队驮着一匹绸缎起了贪心，顺手牵羊拿了一件。事情很快败露，头目当着全队人的面把他赶了出去，还按价赔了人家。那小伙子脸涨得通红，一句话也辩不出，只好灰溜溜走了。大伙儿看在眼里，才明白这章程绝非摆设。原来旅团立过一条铁规矩，头一条就列了三款：不许抢劫商队，不许惊扰村庄，不许丢下同伴。这三款，每一条都是拿血换来的教训，犯了事的，轻的赶出队伍，重的还要照数赔偿，绝不姑息。打这以后，队里再没人敢越雷池一步。商队望见旅团的旗，不用再吓得掉头就跑，有的还主动上前招呼；村里百姓见队伍过来，也不慌着躲了，有的还捧出茶水招待。这支队伍的名声，一天比一天响亮。"
 SUM_Neo_SGD.96.a:"推举公议的执事"
 SUM_Neo_SGD.96.b:"沿用旧日的长老"
 SUM_SGD_RB_Common_Land:"均田于部"
 SUM_SGD_RB_Common_Land_desc:"官署名下的地分回各部，再按人头分到户。分地那几天，沙丘边上的火塘没熄过。年轻人连夜扛锄头去看，抓起一把沙土捏了又捏，道：「这真是咱自家的地了。」薄薄一张纸，在他手里重若千斤。"
 SUM_Neo_SGD.97.t:"均田于部"
 SUM_Neo_SGD.97.d:"年轻人蹲在地头，抓起一把沙土捏了又捏，仿佛捧着世间最珍贵的东西。他连夜扛锄头赶来看这刚分到的地，对着它看了又看，直到月亮升起才转身回家。官署名下的田地，如今分回各部，各部再按人头分到各家。分地那几日，沙丘边的火塘夜里没熄过，家家围着火，等着领那块属于自己的地。这地祖辈都归官家，头一回落到自家手里，人们捧着分地文书，心里热乎乎的。火塘边，老人给孩子讲：「这地往后就是咱们的，要好好伺候它，才能养家糊口。」孩子听得似懂非懂，也跟着点头。那文书薄薄一张纸，在他手里却重若千斤，捧得稳稳的。"
 SUM_Neo_SGD.97.a:"让花神的誓约作证"
 SUM_Neo_SGD.97.b:"让官署的法度作证"
 SUM_SGD_RB_Water_Commons:"水泽入官"
 SUM_SGD_RB_Water_Commons_desc:"水井与绿洲不再归哪家所有，取水按人。这一条各部足足吵了七天，从口水横飞吵到几乎拔刀，末了才你让我、我让你定下。有个汉子红着脸道：「往后这水，谁都能打！」井边从此吵架少，说笑多。"
 SUM_Neo_SGD.98.t:"水泽入官"
 SUM_Neo_SGD.98.d:"井边如今少了争执，多了笑语。水井与绿洲不再归哪一家哪一户，取水按人头分，人人有份。这条规矩，是吵出来的。各部为它争了整整七日：头日里众口纷纭，唾沫横飞；次日有人拍案，险些动手；第五日更是刀都快拔了出来，旁人苦苦相劝；直到第七日，吵得人困气乏，火气也消了大半，你退一步我让一分，才把章程定下。章程一定，争端果然稀了。旧时为抢水邻里结仇，如今按人头分水，谁也挑不出理。那个当初吵得最凶的头人，后来勉强认了句：「吵这一场，倒吵出个公道。」人都说，这七天七夜的争吵，吵得值。"
 SUM_Neo_SGD.98.a:"与雨林互通有无"
 SUM_Neo_SGD.98.b:"与雨林划清界限"
 SUM_SGD_RB_Grain_Store:"诸部置廪"
 SUM_SGD_RB_Grain_Store_desc:"各部把余粮存进公仓，荒年按口分。存粮时有人嘀咕，取粮时却都没了话。先前嘀咕最凶的那个，捧着粮低声道：「这粮，存得值。」那几张不情愿的脸，后来都笑开了。"
 SUM_Neo_SGD.99.t:"诸部置廪"
 SUM_Neo_SGD.99.d:"先前嘀咕得最凶的那个人，捧着领来的粮食，低着头，半晌憋出一句：「这粮，存得值。」旁人听了，都会心地笑。各部把余粮拿出来存进公仓，遇上荒年再按人口分给各家。往仓里送粮那会儿，有人心里犯嘀咕：我辛辛苦苦打的粮，凭什么充公？嘴上不说，脸上却挂着不情愿，粮袋往秤上一放，手都沉了几分。可到了荒年取粮，那些人一个个都没了话。偏那年大旱，自家地里颗粒不收，全凭公仓的粮熬过难关。仓门前排起长队，扶老携幼，人人等着称粮领米。管仓的把仓门大开，一袋袋粮食发出去，心里也笃定，暗想当初那几张不情愿的脸，如今都换成了笑容。"
 SUM_Neo_SGD.99.a:"把土地分给部族"
 SUM_Neo_SGD.99.b:"把土地归入官仓"
 SUM_SGD_RB_Craft_Collective:"匠户云集"
 SUM_SGD_RB_Craft_Collective_desc:"铁匠、织工、制盐的合在一处做工，工钱按件算，工具归公。先前有个铁匠买不起炉砧，只能给人打下手；如今只管出力，多劳多得。他抡起锤子笑道：「这回打的都是自家的。」"
 SUM_Neo_SGD.100.t:"匠户云集"
 SUM_Neo_SGD.100.d:"到了发工钱的日子，人人喜笑颜开，三个一堆五个一簇，数着摩拉，盘算着添置些什么。匠人们还说道：「等攒够了钱，要在坊前立一块碑，记下这太平年月。」铁匠、织工、制盐的匠人，如今合在一处做工：工钱按件来算，做一把刀得多少，织一匹布得多少，晒一池盐得多少，明明白白；做工的家伙什儿则归公中置办，不必匠人自己掏钱。这法子最合匠人的心意。先前有个铁匠，想打铁却买不起炉子与铁砧，空有一身力气，只能给人打下手；如今工具归公，他只管出力气，按件领钱，多劳多得。铁坊里炉火昼夜不熄，叮叮当当的锤声响成一片；织机咔咔作响，盐田白花花一眼望不到边。匠人们聚在一处，手艺长进得快，钱也挣得稳当。"
 SUM_Neo_SGD.100.a:"推举公议的执事"
 SUM_Neo_SGD.100.b:"沿用旧日的长老"
 SUM_SGD_RB_Elder_Recall:"耆宿可黜"
 SUM_SGD_RB_Elder_Recall_desc:"长老若犯了众怒，部众可当众罢免。这一条写进盟约时，几个老长老脸色一个比一个沉，有人端碗的手都在抖。有个年轻人当众念完，那老长老低着头，半晌没憋出一句话来。"
 SUM_Neo_SGD.101.t:"耆宿可黜"
 SUM_Neo_SGD.101.d:"有个年轻后生说得直白：「长老也是人，也会犯错，犯了错，凭什么不能换？」老长老们听着，无言以对，只把头低下去。长老本是部里最受人敬重的，可若是犯了众怒，如今部众也能当众把他罢免。这一条写进盟约的时候，气氛着实尴尬：几个头发花白的老长老坐在那里，听人念这一条，脸色一个比一个沉，有的把脸扭向一边，有的端着水碗的手微微发抖。他们心里明白，这规矩是冲着自己这样的人来的。这条规矩一定，部里办事果然公道了许多，长老们也收敛不少，再不敢随意逞威风。自这规矩立后，长老办事实在，部众也肯听命，上下反倒比从前和睦。当初那几位沉下去的脸，如今也渐渐舒展开了。"
 SUM_Neo_SGD.101.a:"让花神的誓约作证"
 SUM_Neo_SGD.101.b:"让官署的法度作证"
 SUM_SGD_RB_Deshret_Oath:"赤王宿盟"
 SUM_SGD_RB_Deshret_Oath_desc:"赤王当年许过一句话，不求神也能活。正是这句旧誓，年代久了几乎被忘尽，如今被人翻出来，一字一句念给盟誓的众人听。念到末了，老人们眼眶都红了，有人低声道：「这话，我们等了几十年。」"
 SUM_Neo_SGD.102.t:"赤王宿盟"
 SUM_Neo_SGD.102.d:"盟誓的场合里，忽然有人提起一句老掉牙的话。那是赤王在世时留给沙漠人的：不求神，也能活下去。日子隔得太久，这句誓言早没几个人记得了。如今盟约新成，那人不知怎么想了起来，当众翻出来，一字一句念给众人听。念到「不求神，也能活下去」时，全场忽然静得出奇，连远处风沙的呼啸都听不见了。几个白发老人眼眶发红：原来那位远古的王者，早给后人留下这样一句硬气话。如今大伙凭着自己的双手和这张盟约过日子，不拜神，不求人，竟真把这句老话应验了。一个老人低声嘟囔：「赤王当年说的话，今日到底应验了，咱们总算没负了他。」众人听了，都默不作声地点头。年轻后生们虽不懂得这句话的分量，却也一个个神情肃穆，恭恭敬敬地行了一礼。"
 SUM_Neo_SGD.102.a:"与雨林互通有无"
 SUM_Neo_SGD.102.b:"与雨林划清界限"
 SUM_SGD_RB_Pilgrim_Road:"千里谒庙"
 SUM_SGD_RB_Pilgrim_Road_desc:"去遗迹的路重新走通，路边的井也有人打理。走这路的不是拜神，是认自己的根。年轻人抚摸断墙上的刻痕，轻声道：「原来先人曾在这里生活过。」"
 SUM_Neo_SGD.103.t:"千里谒庙"
 SUM_Neo_SGD.103.d:"有个年轻人站在遗迹的断墙前，伸手抚摸着上面斑驳的刻痕，轻声道：「原来咱们的先人，曾在这里生活过。」他站了很久，手指在刻痕上停留，才转身离去。通往遗迹的路，如今重新被人走通了；路边那些荒废多年的井，也有人淘洗干净，重新打理，好让过路的人饮水。走这条路的，却不是为了拜神。这些人背着行囊，一路风尘，要到那古老的遗迹去，为的是认一认自己从哪里来。沙漠里的部族年代久远，许多人不知道自己的先祖是谁、从何处迁徙而来，如今遗迹里残存的石刻、断碑，或许能给出答案。同来的人也纷纷驻足，有的拓下石刻上的字，有的在断墙边久久伫立。这一趟路，没白走。"
 SUM_Neo_SGD.103.a:"把土地分给部族"
 SUM_Neo_SGD.103.b:"把土地归入官仓"
 SUM_SGD_RB_Scarlet_Rite:"修赤沙祀"
 SUM_SGD_RB_Scarlet_Rite_desc:"每年在沙里办一场仪式，祭旧年王者，也给活人看。仪式不长，点篝火，诵祝词，说完便散。孩子问父亲图什么，父亲道：「图的是别忘了自己是谁。」"
 SUM_Neo_SGD.104.t:"修赤沙祀"
 SUM_Neo_SGD.104.d:"孩子把父亲的话记在心里，似懂非懂地点了点头。父亲想了想，答道：「图的是别忘了自己是谁，从哪来，往后该怎么走。」原来孩子问的是：这仪式年年办，图个什么？沙漠里每年到了时节，便要办这样一场仪式，一为祭奠旧年的王者，二为活着的人。仪式并不长：众人聚在沙丘上点起篝火，由年长的长者诵几句古老祝词，追忆往昔，再说眼下的日子。年轻人听得认真，老人们神色庄重。没有冗长排场，也没有繁缛礼节，该说的说完，该祭的祭毕，众人便各自散去。篝火渐渐熄了，人们三三两两往回走，嘴里还念着那几句祝词。明年这个时候，他们还会再来。"
 SUM_Neo_SGD.104.a:"推举公议的执事"
 SUM_Neo_SGD.104.b:"沿用旧日的长老"
 SUM_SGD_RB_Relics_Kept:"故物著籍"
 SUM_SGD_RB_Relics_Kept_desc:"从遗迹里挖出的东西一律入册：谁挖的、挖在哪、归谁看，都写清楚。入册的画押，物件锁进石室。先前有人拿古物去换钱，如今一查便知。有个年轻人挖出古镜想卖，被拦下登记，也就释然道：「留着也好。」"
 SUM_Neo_SGD.105.t:"故物著籍"
 SUM_Neo_SGD.105.d:"有个年轻人挖出一面古镜，兴冲冲地要拿去卖，被管事拦下，登记入册。他起先不乐意，嘟囔了几句，后来听说这古物关系着部族的来历，也就释然了。从遗迹里挖出来的东西，如今一律要登记入册：是谁挖的，挖在什么地方，该由谁来保管，都要写得清清楚楚。定下这条规矩，为的是防一样弊病。先前有人从遗迹里掘出古物，转手便换成了摩拉，老祖宗留下的东西被拆得七零八落，也没人管得着；如今册子一立，件件出土的东西都有案可查，谁敢私自拿去变卖，一查便露馅。管事的把古镜里三层外三层包好，锁进柜中。那册子越积越厚，后来特地打了一只木柜来盛，钥匙就交给管事的收着。这桩新鲜事顺着商道一路传，没多久便传遍了半座城。"
 SUM_Neo_SGD.105.a:"让花神的誓约作证"
 SUM_Neo_SGD.105.b:"让官署的法度作证"
 SUM_SGD_RB_Song_of_Sand:"沙海入咏"
 SUM_SGD_RB_Song_of_Sand_desc:"有人把这几十年的事编成诗，在篝火边传唱。诗里没有英雄，只有活下来的人。年轻人问怎么没有英雄，老人拨拨篝火道：「能活下来，便是英雄。」"
 SUM_Neo_SGD.106.t:"沙海入咏"
 SUM_Neo_SGD.106.d:"话说篝火旁，一个后生听完歌，憋不住问：「唱了这半宿，怎的一个英雄也没有？」拨弄火堆的老人抬起头，慢悠悠答道：「能在这沙漠里活下来，把日子过下去，便已经是英雄了。」众人听了这话，都默然点头，那后生怔怔望着火光，半天没言语。这些年头的沧桑，被人编成歌谣，围着篝火一遍遍唱。可这歌谣里偏没有半点英雄气：没谁横扫千军，没谁建功立业，唱的全是芝麻大的寻常事，谁家逃过了沙暴，谁在荒年领过救济粮，谁跟着商队踩出了新路。唱到末了，一句也没夸那些风光人物，唱的全是硬生生活下来的人。火堆噼啪爆着火星，歌声明明灭灭飘过沙丘，听的人有的眼眶红了，有的跟着小声哼起来。这歌，就这么一辈传一辈地唱了下去。"
 SUM_Neo_SGD.106.a:"与雨林互通有无"
 SUM_Neo_SGD.106.b:"与雨林划清界限"
 SUM_SGD_RB_Ore_Pit:"凿石得铁"
 SUM_SGD_RB_Ore_Pit_desc:"却说山里开了几处矿，出铁与铜，矿归公有，下矿的按班轮值，工钱按月结。先前矿被豪强把持，工钱七扣八扣，稍有不从便是一顿鞭子。如今矿洞里火把通明，锤钎叮当响，有个矿工笑道：「这回工钱，一个子儿不少。」"
 SUM_Neo_SGD.107.t:"凿石得铁"
 SUM_Neo_SGD.107.d:"一个年轻矿工抹去脸上的灰，咧嘴笑道：「如今这矿是咱们大伙的，干起来浑身是劲，使不完的力气！」山里新开了几处矿，出的是铁和铜，归公中所有，不经哪一家哪一户独占。匠人们按班次轮流下井，一班接一班，人歇工不歇；工钱按月结算，到日子一文不短。早先这矿落到一家豪强手里，下矿的累死累活，工钱七扣八扣，落不到几个钱，稍有不从就挨鞭子。如今归了公，轮班、月结，那窝囊气再没人受。矿洞里火把明晃晃，锤钎叮当响，一车车矿石拉出来堆在山脚。山下人看着矿石往外运，都说矿归了公，好处终归落到大伙手里，再不用看豪强脸色。"
 SUM_Neo_SGD.107.a:"把土地分给部族"
 SUM_Neo_SGD.107.b:"把土地归入官仓"
 SUM_SGD_RB_Smith_Public:"官冶铁场"
 SUM_SGD_RB_Smith_Public_desc:"铁坊归公，农具与兵器都从这儿出。师傅带徒弟，倾囊相授，徒弟学成便留在坊里，不必外流。老师傅看着徒弟打的刀，点头道：「好，手艺有传承了。」"
 SUM_Neo_SGD.108.t:"官冶铁场"
 SUM_Neo_SGD.108.d:"老师傅把徒弟新打的一把刀拿在手里，翻来覆去看了几遍，点头赞道：「好！这手艺总算有了传承，我死也瞑目了。」铁坊归了公，农具、兵器都从这里出炉。师傅带徒弟，是手把手地教：抡锤的姿势，掌钳的力道，看火候的眼力，徒弟在旁一样样描摹。旧时学艺，师傅多半藏着一手，怕教会徒弟饿死自己，徒弟出师还得背井离乡另谋生路；如今师傅把压箱底的本事全掏出来，徒弟学成了就留在坊里接着打。炉火昼夜旺，人才一茬接一茬，手艺愈发精进。徒弟们一个赛一个争气，打出的农具结实耐用，四乡农户都认这铁坊的招牌。老师傅偶尔踱过，瞧见徒弟们忙活，捋着胡子直点头。"
 SUM_Neo_SGD.108.a:"推举公议的执事"
 SUM_Neo_SGD.108.b:"沿用旧日的长老"
 SUM_SGD_RB_Salt_Works:"卤场初辟"
 SUM_SGD_RB_Salt_Works_desc:"盐场晒的是盐，也是钱，盐价由公议定，不许囤积。先前奸商囤盐，害百姓吃不上；如今价稳，家家饭桌都有了咸味。盐价牌立在盐场门口，写死了数目，谁也改不得。有商人想抬价，被一句话顶回去：「牌上写着，谁也改不得。」"
 SUM_Neo_SGD.109.t:"盐即泉布"
 SUM_Neo_SGD.109.d:"盐田里白花花晒了一地，工人一筐筐往仓里装，附近几座盐场堆得跟小山似的，在日头下白生生晃眼。「如今这盐价公道，咱们也吃得起盐了！」老妇人拎着刚买的盐，喜滋滋地说。盐场晒出来的既是盐，也是钱：这东西一天也离不得，谁攥住盐就攥住一条财路。先前有奸商囤积居奇，把盐藏着等高价再卖，害得百姓没盐吃或只能咬牙买贵的，怨声载道。如今章程定下：盐价由公中议，定多少就是多少，谁也不准囤，敢囤的重罚不饶。这一下盐价稳了，百姓再不受窝囊气，家家饭桌上都添了咸味。"
 SUM_Neo_SGD.109.a:"让花神的誓约作证"
 SUM_Neo_SGD.109.b:"让官署的法度作证"
 SUM_SGD_RB_Cloth_Loom:"设机杼局"
 SUM_SGD_RB_Cloth_Loom_desc:"织工把羊毛与驼绒织成布，厚实耐穿，远销外邦。梭子穿来穿去，手指翻飞，一匹布一寸寸织出来。外邦商队专程来贩，一车车拉走，有个商人摸着布道：「这布，扛得住风沙。」"
 SUM_Neo_SGD.110.t:"巧工织毳"
 SUM_Neo_SGD.110.d:"「好家伙，你这布都卖到天边去啦！」旁边的人打趣。那织工女子望着自己织的布一匹匹装上驼车，脸上笑开了花，扬声道：「织得好，自然有人抢着要，咱这手艺，总算争了口气！」沙漠织工手儿巧，羊毛驼绒在他们手里织成一方方布，厚实耐穿，挡得住夜里刺骨的寒，也扛得住风沙磨。女子们坐在织机前，梭子穿梭，十指翻飞，一匹布一寸寸慢慢织出来。这布好，远近传名，沙漠人爱用不说，还远销到外邦。外邦商队专程赶来，一车车往回拉。名声越传越远，连遥远城邦的人都来贩。织工们从早忙到晚，手上不停，人虽累，心里却甜。"
 SUM_Neo_SGD.110.a:"与雨林互通有无"
 SUM_Neo_SGD.110.b:"与雨林划清界限"
 SUM_SGD_RB_Tool_Share:"农具共享"
 SUM_SGD_RB_Tool_Share_desc:"大件农具由公仓统管，哪家要用去登记便可借。先前各家都置一套，闲时多用时少，钱花得冤；如今轮借，省下的钱够添几头牲口。农忙时来借农具的，排成了长队，有人笑道：「这法子，省了大钱。」"
 SUM_Neo_SGD.111.t:"农具共享"
 SUM_Neo_SGD.111.d:"农忙时节，来借农具的排成了长队，管仓的人叮嘱：「借归借，还回来时得洗干净，下回才好借给别人。」耐人寻味。「这法子好，我一家省下的钱，添了一头小驴！」一个农户把借来的犁洗干净还回去，对管仓的人说道，管仓的笑着点头。重犁、石磨这些大件农具，不是家家都置办得起的，如今归公仓统一管理，哪家要用，登记一声就能借。这法子省大钱了：旧时各家各户都要置办全套，用得少闲得多，白花了银子；如今公用轮借，省下的钱够添几头牲口。仓里农具摆得齐整，登记簿上借还一笔笔清楚。"
 SUM_Neo_SGD.111.a:"把土地分给部族"
 SUM_Neo_SGD.111.b:"把土地归入官仓"
 SUM_SGD_RB_Levy_System:"立迭役法"
 SUM_SGD_RB_Levy_System_desc:"各家出丁轮值，一轮半年，值满便回家。当值的有粮饷，家里的地有人代种，再无后顾之忧。年轻人回家见禾苗齐整，一块石头落地，对家里人道：「这半年，没白去。」"
 SUM_Neo_SGD.112.t:"立迭役法"
 SUM_Neo_SGD.112.d:"「这轮值的章程，真是想到咱们心坎里去了！」晚饭桌上，那后生对家里人说道。他服役期满，扛着行李回家，瞧见自家的地侍弄得齐整，心里一块石头才算落地，行李一撂先往地里转了一圈，见禾苗长得齐刷刷的，这才进屋歇着。各家出丁轮值，一轮半年，满了期就回家种地。章程写得明白：当值的人领粮饷，家里几亩地有人代耕，不会撂荒。这么一安排，当值的安心，在家的也放心。旧时征兵，最怕地没人种，出去一趟回来草长没膝，一年白忙；如今代耕有人、粮饷照发，当兵的再没后顾之忧。轮换那天，新班接旧班，老兵拍拍新兵肩膀，把沙路上的规矩叮嘱了好几句。"
 SUM_Neo_SGD.112.a:"推举公议的执事"
 SUM_Neo_SGD.112.b:"沿用旧日的长老"
 SUM_SGD_RB_Sand_Ranger:"轻骑出碛"
 SUM_SGD_RB_Sand_Ranger_desc:"游骑不带辎重，走商队不敢走的险路，打快进快出的仗。夜袭敌营放一把火，前后不过一炷香，等敌军提刀追出，只剩几串蹄印被风沙抹平。有个游骑拍马回来道：「一把火，够他们忙活半宿。」"
 SUM_Neo_SGD.113.t:"轻骑出碛"
 SUM_Neo_SGD.113.d:"带队的游骑赶回营里，盔甲都没顾上卸，就先报了平安。营中弟兄都说，这等来去如风的打法，直叫敌人摸不着头脑，其中大有学问。游骑这路兵马，讲究的就是一个快字：不带辎重，轻装上路，专挑商队都不敢涉足的险径，打的是一锤子买卖。敌人才愣得一下，他们已到眼前；等对方回过味来要合围，他们早挟着战果，没影在沙丘背后。不恋战，不贪功，得手就撤，让人防不胜防。有一回夜袭敌营，一把火烧起，救出被掳之人，前后不过一炷香。等敌军提刀追出来，沙海里哪里还有人，只余几串浅蹄印，转眼就被风沙填平。"
 SUM_Neo_SGD.113.a:"让花神的誓约作证"
 SUM_Neo_SGD.113.b:"让官署的法度作证"
 SUM_SGD_RB_Siege_Hand:"益攻坚士"
 SUM_SGD_RB_Siege_Hand_desc:"沙漠少攻坚，多袭扰。真到了非攻关隘不可时，游骑便派不上用场，得另凑一支精锐，架云梯，挖地道，冒箭雨往前冲。为首的把刀一横道：「这活九死一生，怕死的现在退出。」"
 SUM_Neo_SGD.114.t:"益攻坚士"
 SUM_Neo_SGD.114.d:"攻城那天，一架架云梯搭上城头，地底下同时掘开坑道，喊杀声震得地动山摇。这支人马是军中特意挑出的精锐，专啃硬骨头：架云梯、挖地道、顶着箭雨往前冲。大漠里打仗多是袭扰游斗，少有攻坚拔城的硬仗，这也难怪：地方辽阔、关隘稀少，真去攻城耗时费力还不讨好。可一旦非拿下某处关隘不可，寻常游骑就顶不上，得另凑一支专干这活的队伍。选拔时一个个都是百里挑一的好汉，平日练得格外苦，手脚上的老茧厚得能磨穿铁。为首的曾对众人说：「这活计九死一生，可若没有咱们，这关隘便攻不下来。」众人齐齐应诺，声震沙丘。"
 SUM_Neo_SGD.114.a:"与雨林互通有无"
 SUM_Neo_SGD.114.b:"与雨林划清界限"
 SUM_SGD_RB_Field_Kitchen:"野炊立灶"
 SUM_SGD_RB_Field_Kitchen_desc:"行军灶做不出好饭，却一定要准时。队伍走完一天，远远望见灶上的烟，脚下便添了力气。吃上热食的，走的路比别人远。那灶上的烟一冒，队伍的脚步便快了，有人笑道：「有口热的，腿就有劲。」"
 SUM_Neo_SGD.115.t:"沙际立炊"
 SUM_Neo_SGD.115.d:"有一回三路人马同行，两队按点吃了热乎饭，一队贪赶路冷了灶，先到的抢占泉眼，后到的只能守着一汪浑沙叹气。众人这才服了：灶上的规矩误不得。大漠行军，最苦的不是厮杀，是吃饭这一桩。灶垒在沙地上，风一吹火苗乱晃，米煮成夹生，汤里尽是细沙，伙夫忙得满头大汗，可开饭时辰一点不敢挪。明明做不出好饭，偏立着死规矩：到点就开饭，晚一息都不行。原因为哪般？大漠赶路全凭一口热食垫底，热汤下肚，冻僵的身子缓过劲，脚下添力，一天多赶三十里；啃冷干粮的半道就垮了脚，远远被甩开。到后来，这灶上的时辰便成了军中头一条铁律。"
 SUM_Neo_SGD.115.a:"把土地分给部族"
 SUM_Neo_SGD.115.b:"把土地归入官仓"
 SUM_SGD_RB_Wounded_Tent:"设伤兵幕"
 SUM_SGD_RB_Wounded_Tent_desc:"伤兵帐里管的是止血与接骨，管不了的就送回去。军医昼夜不合眼，一个伤口一个伤口地看。有个伤兵疼得直叫，军医按住道：「忍一忍，这条胳膊保得住。」能救一个是一个，这条规矩没人明说，人人却都守着。"
 SUM_Neo_SGD.116.t:"自幄牵还"
 SUM_Neo_SGD.116.d:"有个小卒腿被长矛扎穿，人都说这腿保不住了，军医偏不撒手，剔净碎骨、敷上药、拿木板夹紧，半个月后竟能下地行走。伤兵帐里药气混着血腥，军医蹲在伤兵身旁，一手压紧止血布，一手去接错位的骨头，额头上的汗珠一滴滴砸进沙土。能救的当场止血正骨，硬把人从鬼门关拽回来；救不活的也不强留，草草裹一裹送回后方，好腾出帐里的位置。帐中不分贵贱，只论伤势：重的先治，轻的自己咬牙扛。也有伤得太重的，军医摇头叹气，命人抬走。帐外担架进进出出没个停时，这郎中昼夜守着，手上的血洗了一遍又一遍，衣裳从没干过。有人劝他歇歇，他只摇头：「帐里还躺着人呢。」"
 SUM_Neo_SGD.116.a:"推举公议的执事"
 SUM_Neo_SGD.116.b:"沿用旧日的长老"
 SUM_SGD_RB_Recognize:"乞邻邦许"
 SUM_SGD_RB_Recognize_desc:"使节带着盟约抄本四处登门，要的只是一句话：承认沙漠自己管自己。有的城一口应下，有的关起门来不见。使节也不恼，明日再来。有的城关上门，使节就在门外等，道：「我等得起。」"
 SUM_Neo_SGD.117.t:"乞邻邦许"
 SUM_Neo_SGD.117.d:"「肯认的记下，推诿的也记下，来日再算！」使节回到沙漠，把各国回话誊成册，呈给主事人时撂下这句话。要知这趟差事有多难，得从头说起。沙漠派他揣着盟约抄本，挨城登门，只讨一句：承认沙漠自管自。这话听着轻飘，压下来却千钧重。有一回路过一处绿洲，那头人翻了脸，拔刀相向，使节把抄本往怀里一揣，昂然道：「我为沙漠百姓而来，头可断，这句话却改不得！」那人锐气一挫，到底松了口。也有的滑头，今日推明日，他便天天坐人家门槛上候着，硬把心等软；碰上爽利的，当场画押，他深深一揖到地。整趟走下来，嘴皮子都磨薄了：点头的、推诿的、闭门不见的，各色人等都有。"
 SUM_Neo_SGD.117.a:"让花神的誓约作证"
 SUM_Neo_SGD.117.b:"让官署的法度作证"
 SUM_SGD_RB_Trade_Treaty:"结互市契"
 SUM_SGD_RB_Trade_Treaty_desc:"与外邦通商立约，约里只写税则与护侨，别的一概不写。少写一条，便少一桩日后的争。那边想添些条款，使者摇头道：「多了反倒不好办。」"
 SUM_Neo_SGD.118.t:"结互市契"
 SUM_Neo_SGD.118.d:"货被扣在卡子上，商队老把式从怀里摸出约本一递，守卡的翻看半天，乖乖放行。这事说起来简单：沙漠跟外邦做买卖，立了张盟约。两边在帐子里吵得口干舌燥，最后落笔，纸上就两条款：头一条讲税，货物过关抽多少，写得清清楚楚；第二条讲护侨，两边商旅到了对方地界，性命财产都得保住。别的废话一句没有。纸虽薄，压手。早先没这约，商人被劫了货连个说理的地方都没有，只能认栽；现在白纸黑字，谁敢赖账大伙就指着约问。精明的商队出门揣两份约本，过关卡就亮一亮，守卡的也不敢多刁难。后来两边真按约办事，商路越走越宽，别国见了约书也照着样子学。"
 SUM_Neo_SGD.118.a:"与雨林互通有无"
 SUM_Neo_SGD.118.b:"与雨林划清界限"
 SUM_SGD_RB_Hire_Out:"客兵居外"
 SUM_SGD_RB_Hire_Out_desc:"旅团接外邦的活，打的是别处的仗，挣的是本地的粮。这一条让不少长老皱眉，有人拍案道：「自家的刀，凭什么替人去磨？」可账上的摩拉，到底实在。"
 SUM_Neo_SGD.119.t:"客兵居外"
 SUM_Neo_SGD.119.d:"「粮是有了，人呢？回来的越来越少，埋在外乡的越来越多，这粮还能咽得下？」族中议事，几个长老把桌子拍得震天响。也有血气方刚的后生反驳：「不去打仗，粮打哪儿来？难道坐等饿死？」两边争到天黑，谁也没说动谁。这事从何说起？镀金旅团接了外邦的活，扛刀带枪去替别处厮杀，得胜回来驮的不是金银，是本地紧缺的粮。这买卖表面划算，却惹得几位长老皱眉：沙漠儿郎本该守着自家水井绿洲，如今倒替外人卖命，家里反倒空了。旅团首领坐在末位闷头灌酒，末了撂下一句：「这碗饭，端着烫手，放下又饿。」后来城里立了规矩：旅团出外打仗须留名册，阵亡的抚恤家里一文不许拖欠，长老们这才稍稍宽心。"
 SUM_Neo_SGD.119.a:"把土地分给部族"
 SUM_Neo_SGD.119.b:"把土地归入官仓"
 SUM_SGD_RB_Border_Talk:"对案定疆"
 SUM_SGD_RB_Border_Talk_desc:"与邻邦磋商边界，一里一里地谈，谈不拢就先搁着，搁着也不动兵。那地图摊在桌上，两人各指一边，谁也不让。谈了一日，各回各的帐，临走都丢下一句：「明日再议。」"
 SUM_Neo_SGD.120.t:"对案定疆"
 SUM_Neo_SGD.120.d:"「地是死的，人是活的，今日搁下的，来日未必争不回来；一旦动了刀，死的就不止一两个人了。」老使臣撂下这话，众人听了都觉稳当。沙漠与邻邦划界，两边各派巧舌如簧的人，捧着旧图一里一里地磨。这段归谁、那段属哪，争的都是寸土，谁也不肯让。有人急眼了，主张干脆动兵，把这几尺界硬打出来。主事的老成持重按住道：「打容易，收场难，今日抢来的地，明日还得拿人去填，何苦来哉。」两边这才收刀退去，谈不拢的先撂着各回各家。那几段撂着的边界荒着无人过问，反倒落个清净，牧人照旧在界河边饮牲口。"
 SUM_Neo_SGD.120.a:"推举公议的执事"
 SUM_Neo_SGD.120.b:"沿用旧日的长老"
 SUM_SGD_RB_Rainforest_Delegation:"林门洞辟"
 SUM_SGD_RB_Rainforest_Delegation_desc:"对雨林仍留着一扇门，派去的人带着商约，也带着刀。门开多大，全看对面怎么接。来人若客气，便请进帐喝茶；若来者不善，刀也就横在膝上。领头的把刀一按道：「和气做生意，翻脸就动手。」"
 SUM_Neo_SGD.121.t:"林门洞辟"
 SUM_Neo_SGD.121.d:"「开得了这门，也关得了这门。」使节辞行时丢下这么一句。沙漠跟雨林之间，一直留着条缝没封死。去谈的人怀里揣着商约，腰上也挂着刀，这两样原是一套：谈得来就开市，握手言欢；谈不来就亮刀，门随时合上。门开几成，端看对方拿什么礼数招呼。识礼的堆着笑脸迎来，商队便鱼贯而入，骆驼背驮满满，一路欢歌；托大的把商约摔在地上，使节就猫腰捡起，拍拍灰，一声不吭退走，转头便调兵马。这软硬两手使得纯熟。城里闲人说这使节半是商贾半是武夫。后来两边开起市来，第一批货就换回不少盐和布，沙漠人尝到甜头，都说这门开得值。"
 SUM_Neo_SGD.121.a:"让花神的誓约作证"
 SUM_Neo_SGD.121.b:"让官署的法度作证"
 SUM_SGD_RB_Commune:"旅团之议"
 SUM_SGD_RB_Commune_desc:"「旧案烧了，规矩得留。」有人拍着桌角说。如今沙漠的公事分作两拨人管，一拨管水土地亩，一拨管契约兵戈，两拨人同桌办事，桌角刻着一条规矩，是当年神王旧案被大火烧尽之后才刻上去的。"
 SUM_Neo_SGD.122.t:"旅团之议"
 SUM_Neo_SGD.122.d:"一张长桌，桌角深深刻着一条规矩。这桌子有来历：当年神王之遗的案底遭了一把火，旧卷全成了灰，活人总得立个新章程，于是把规矩一刀刀刻在了桌角上。如今沙漠的公事分作两部打理：一部专管水地，渠怎么分、田怎么耕都归它；一部专管契约与兵，盟约怎么立、队伍怎么调都归它。两部的人就围着这张长桌议事。起初各说各的理，争得脸红脖子粗，险些把桌子拍散了架；慢慢地才明白过来，管水的离不了护兵，带兵的也离不了粮地，合起来两下都利，分开了两下都伤。起初还争谁高谁低，后来悟透了：水地没有兵就保不住，契约没有粮就行不通。打这以后，长桌上再听不见拍案声，一应公事都照着桌角那行规矩办。"
 SUM_Neo_SGD.122.a:"与雨林互通有无"
 SUM_Neo_SGD.122.b:"与雨林划清界限"
 SUM_SGD_RB_Oath_of_Floral_King:"花神赤王共盟"
 SUM_SGD_RB_Oath_of_Floral_King_desc:"赤王留下的旧誓，还有花神当年的盟约，被人一同翻了出来，镌在一方石板上，安放在绿洲的泉眼旁。一位老者带着孩童来识碑上的字，指点着说：「这些字句，是咱们人自己订下的。」自此沙漠的规矩之中，便多了一条不靠神明、只凭人心的道理。"
 SUM_Neo_SGD.123.t:"花神赤王共盟"
 SUM_Neo_SGD.123.d:"有后生把泉边石板上的字抄下来，带回去教娃娃们念。那石板立在绿洲泉眼旁，是有人把赤王的旧誓、花神的旧盟一并翻出来，请石匠并排刻上去的，沉得很。沙漠的老神其实没走远，只是在沙底下埋得太久，连名号都落了灰。旧时候沙漠的规矩件件打着神意：神说怎么办就怎么办，没人敢问一句为什么。如今两篇誓词并排刻着，赤王归赤王，花神归花神，谁也压不住谁。年头久了，人们围着石板打水、歇脚、闲谈，慢慢咂摸出一条新道理：规矩里竟多出一条不关神、只关人的名堂。神的话算不算数，先看地上的活人答应不答应。石板风吹日晒，金粉掉了不少，来看的人却一年多似一年。"
 SUM_Neo_SGD.123.a:"把土地分给部族"
 SUM_Neo_SGD.123.b:"把土地归入官仓"

 #### 丙线 · 赤王复兴 ####
 SUM_SGD_RC_The_Return_of_the_Red_King:"赤王建帜"
 SUM_SGD_RC_The_Return_of_the_Red_King_desc:"第三条路，主张把沙漠重新捏成一整块：立王统，修神庙，整军伍，开遗迹。走这条路的人拍着桌子道：「沙漠吃够了散的亏，散着便永远受欺。」听的人多半点头。"
 SUM_Neo_SGD.124.t:"赤王建帜"
 SUM_Neo_SGD.124.d:"点头的人只认死一个理：沙漠再不能这么散下去了。这话是一个游说者喊出来的，他跑遍沙漠各处，嗓子又干又哑，见人便劝。原来近来沙漠里兴起第三条路，主张把散落的沙子重新攥成拳头：立王统、定名分，修神庙、聚人心，整军伍、练兵马，开遗迹、搜旧物，四桩事一桩大过一桩。走这条路的人心里憋着一口气，说这些年吃亏就吃在一个散字上：各部各顾各，遇事像一盘散沙，人家上门欺负，你瞅我我瞅你，谁也不肯先出头；散着就永远受欺，合起来才挺得直腰杆。听的人有热血上涌的，也有直摇头的，担心王统立起来，又是一道套在头上的新枷锁。"
 SUM_Neo_SGD.124.a:"重立赤王的旧制"
 SUM_Neo_SGD.124.b:"重建城邦的议会"
 SUM_SGD_RC_Royal_Line:"追稽王绪"
 SUM_SGD_RC_Royal_Line_desc:"「旁系也是系。」老者把谱牒摊在膝上，指头点了又点，一锤定音。众人争了半日便再无话说。原来把历代王室的血脉理了一遍，理到最后，能继承的一支只剩旁系。"
 SUM_Neo_SGD.125.t:"残牒稽统"
 SUM_Neo_SGD.125.d:"「旁系也是系！血脉虽远，终归一个源头。赤王的血传到今天，能剩下这一支已是天大的万幸，难道就为一个旁字，便扔了不管？」主事人把谱册啪地一合，朗声说道。众人一想，也觉在理。要立王统，头一件事就是把历代王室的血脉理清楚：管事的翻遍旧谱残卷，一处一处核对，一代一代往下排，理到最后，直系竟断了线，能接上的只剩旁系一支。这旁系名头不响，众人心里直打鼓：隔了好几代，还算王族吗？于是把旁系这一支迎回来，供上先王牌位，挑日子告庙。那旁系后生也不是纨绔子弟，荒年开过仓，沙暴里救过人，品行端正。大伙儿你瞅瞅我、我瞅瞅你，末了都点了头。"
 SUM_Neo_SGD.125.a:"召集能战之众"
 SUM_Neo_SGD.125.b:"召集能谋之士"
 SUM_SGD_RC_Coronation:"陈加冕之仪"
 SUM_SGD_RC_Coronation_desc:"「从今日起，您便是王。」身旁老臣低声道。加冕礼在旧王城遗址举行，冠冕照着壁画新打，重得压脖子，他抬手扶了扶，脖颈都酸了。戴上这顶冠的人，从此不能再自称寻常百姓。"
 SUM_Neo_SGD.126.t:"墟中受册"
 SUM_Neo_SGD.126.d:"新王戴上那顶冠时，才明白它有多沉。冠是照着旧王城壁画新铸的，金光耀眼，压得脖颈发酸，他掐着步子登台，头也不敢抬。老臣凑近低声提点：「戴上这东西，从此就再不是寻常百姓了，一言一行都牵着整个沙漠。」新王喉头动了动，重重点头，抬手扶正。加冕大典设在旧王城废墟上，那里早塌成断壁、荒草没膝，这回清扫干净铺上红毡，勉强撑起场面。台下黑压压跪倒一片，山呼声震得黄沙直颤；礼官高声唱礼，呼声一浪高过一浪，他却只觉那冠愈发沉。典毕，落日西垂，他独自立在残垣上望了很久，心里雪亮：这副担子，重逾千钧。"
 SUM_Neo_SGD.126.a:"以神权号令沙漠"
 SUM_Neo_SGD.126.b:"以律法约束诸城"
 SUM_SGD_RC_Court_Order:"厘正朝仪"
 SUM_SGD_RC_Court_Order_desc:"重立朝仪，谁站哪一级台阶，都有定规。规矩一立，人心反倒定了。从前挤作一团的，如今按班次站好，鸦雀无声。有个官员低声问身旁的：「该站哪级？」那一个抬手指了指台阶，自己心里先有数，再不敢乱走一步。"
 SUM_Neo_SGD.127.t:"牍书定仪"
 SUM_Neo_SGD.127.d:"新朝刚立，头一件事便是把上朝的规矩重新定下：谁站哪级台阶、谁先进帐、谁后张口，全写成条文刻在木牌上，挂到殿外。刚开始谁都不习惯，常有人站错了地方，被礼官悄悄拽到一边，臊得脸通红。日子一长也就各归各位了：文官立左边，武将站右边，宗室排前头，老臣列后头。奇怪的是，这规矩越定得死，人心反倒越安稳。早先大伙儿心里都没底，不知谁大谁小，暗地里较劲使绊；如今台阶往那一站，高低自见，用不着再猜。上朝时静悄悄的，散朝后也井井有条，连咳嗽一声都听得真真的。有位老臣私下讲：「这规矩，瞧着是捆人，其实护人；人人都明白自己该站哪儿，就不会动歪心思。」这话传出去，旁的衙门也跟着立起了台阶。常言道，规矩越死，人心越定，诚不欺我。 殿角那面铜锣敲了三下，声音悠悠的，百来号人衣角一动不动，谁也不敢先迈步。"
 SUM_Neo_SGD.127.a:"把遗迹挖开"
 SUM_Neo_SGD.127.b:"把遗迹封回去"
 SUM_SGD_RC_Council_Narrow:"删繁议政"
 SUM_SGD_RC_Council_Narrow_desc:"议政席位从几十个缩到九个，说话能算数的人少了，事情办得反倒快了。从前一人一句扯到天黑，如今九人围坐，片刻便决。九把椅子一摆，有人笑道：「这回不用扯到天黑了。」"
 SUM_Neo_SGD.128.t:"去座存九"
 SUM_Neo_SGD.128.d:"人一少，事情反倒办得快了。原先议政席位满满当当，几十号人你一言我一语，一桩小事能吵上半年。新朝立后大刀阔斧，把席位一口气砍到九个，得罪了不少人，被裁的骂街说独断专行。可怪事就出在这：九人围坐一圈，各管一摊，议一件事三言两语就有章程，当日出令，当日施行。先前那议而不决、决而不行的痼疾，竟一扫而空。被裁的私下仍不服，可眼见新朝办事利落，也只好把话咽回肚里。年头久了他们慢慢明白，这九把交椅都是凭本事挣来的，不是白坐的。此后每逢大事，九人围桌，一番议论便定章程。"
 SUM_Neo_SGD.128.a:"重立赤王的旧制"
 SUM_Neo_SGD.128.b:"重建城邦的议会"
 SUM_SGD_RC_Succession_Law:"立王位条"
 SUM_SGD_RC_Succession_Law_desc:"定下继位的规矩，免得日后又为这个打成一团。那规矩写得死板：长子承位，无子则兄终弟及，血亲之外一概不论。有人嫌它不近人情，可真到了霎时，谁也说不出二话。老臣道：「写得死，才管得住人。」"
 SUM_Neo_SGD.129.t:"立王位条"
 SUM_Neo_SGD.129.d:"旧时沙漠最怕一桩事：先王咽了气，几个王子便各拉人马刀兵相见，搅得天翻地覆，百姓跟着遭殃。新王朝把继位这事当成天大的事，也最忌讳旁人议论，这回干脆把话挑明：嫡长继承，次序排定，刻上铁板，谁也别想多嘴。条文写得死之又死，嫡庶、长幼、过继各种情形都一条条列清，半点空子也不留。有人嫌太死，主事的却说：「越死越管得住人，留一道缝，日后就有人钻。」于是立碑起誓，昭告众人。后来真有几回，有人动了别样心思，一想起这铁打的规矩，也就罢了。那年几位王子争得面红耳赤，吵了半日，末了还是照规矩办。 那块铁碑立在议事厅外，日头晒得烫手，路过的王子们远远瞧见，都绕着走。"
 SUM_Neo_SGD.129.a:"召集能战之众"
 SUM_Neo_SGD.129.b:"召集能谋之士"
 SUM_SGD_RC_Rebuild_Temple:"重葺仙祠"
 SUM_SGD_RC_Rebuild_Temple_desc:"「颜色都得照旧样，差一分便不是那尊神了。」匠人眯着眼道。塌了的庙一处处修回去，壁画照旧、香火照旧，匠人们攀在脚手架上，一笔一笔描那旧壁画。修庙的人竟比拜庙的还多。"
 SUM_Neo_SGD.130.t:"重葺仙祠"
 SUM_Neo_SGD.130.d:"新朝一处一处重修那些塌掉的庙：歪倒的柱子扶正，剥落的壁画照原样细细补上，香炉擦得发亮，断了的香火重新续起来。可怪了，动工修庙的人竟比来拜神的还多。匠人、苦力、画师进进出出，冷清多年的庙宇被闹得热火朝天。反倒有那诚心香客，大老远提着供品赶来，一见满地脚手架就发了愣，不知该冲哪儿下跪。一位拄杖老者叹道：「神像还是那尊神像，壁画还是那幅壁画，只是拜的人少了，修的人多了。」可见庙修得再齐整，香火旺不旺，到头来还得看人心。开光那天香客来了不少，挤在殿里上香，着实热闹。有人看了感叹：原来百姓心坎里，到底还留着这位神。 脚手架上的木匠还在叮叮当当地敲，几个孩童蹲在阶前，探头望着重新描过的壁画，指指点点。 香炉里升起一缕青烟，绕着新描的壁画慢慢散开。"
 SUM_Neo_SGD.130.a:"以神权号令沙漠"
 SUM_Neo_SGD.130.b:"以律法约束诸城"
 SUM_SGD_RC_Priest_Order:"序定祀班"
 SUM_SGD_RC_Priest_Order_desc:"祭司按序受职，那序由官府来定。神还是旧的神，管神的却是新的人。老祭司交出印信时，手抖了抖，终究还是鞠了一躬，低声道：「神没变，管神的换了人。」"
 SUM_Neo_SGD.131.t:"序定祀班"
 SUM_Neo_SGD.131.d:"神明没变，管神的人却换了。新朝重修庙宇之后，祭司也要重新受职，可这回谁掌大祭、谁管香火、谁司祭器，不由神庙自己说了算，而是由官府一纸文书排定，写得清清楚楚。名号没换，法相未动，可祭司们接过官牒，心里说不出是什么滋味：从前他们自认是神明的仆人，如今倒成了官府的属吏，见了官也得低头哈腰。有的看得开，捧着官牒谢恩；有的却拂袖而去，说这是拿神明做交易。官府也不挽留，转身就补上新人，新人照旧上香叩拜，一点不含糊。有个老祭司不服气，故意把时辰报错，想让新人当众出丑；哪知那新人不慌不忙，拿起册子逐条核对，分毫不差，连那老祭司都暗暗点头，心里认了服。"
 SUM_Neo_SGD.131.a:"把遗迹挖开"
 SUM_Neo_SGD.131.b:"把遗迹封回去"
 SUM_SGD_RC_Deshret_Rite:"修赤王祭"
 SUM_SGD_RC_Deshret_Rite_desc:"重办赤王的祭礼，礼就在沙里办，供的是旧日王者的威名，也是今人的胆气。风卷着黄沙掠过祭坛，众人齐齐俯身。那礼从日头偏西办到掌灯，沙地上跪了一片人。司礼的高声念道：「赤王在上，今人在此！」"
 SUM_Neo_SGD.132.t:"修赤王祭"
 SUM_Neo_SGD.132.d:"新朝要重办赤王的祭礼，偏偏把祭坛设到茫茫黄沙里。坛的四周插满旗幡，让风刮得呼呼作响；主祭的人立在坛上，高举火把，朗声念起赤王当年那句旧誓，声音被风卷着送出老远。坛下军士按刀肃立，火光映着一张张面孔，人人心口都涌起一股豪气。祭火从黄昏一直燃到天亮才慢慢熄下去，守夜的人换了一茬又一茬，谁也不肯先走，都说是沾了王者的气象。转年再办，来的人比头一回还多，连远地的部落都赶来助祭。众人盯着那跳动的火，心里那点自卑和惶恐，仿佛也随青烟散尽了。沙漠的人心，便跟着这火一年比一年旺。 坛边的沙地被火烤得发烫，风里飘着一股焦木与香灰混的味道，几个年轻军士握刀的手心里全是汗。 火堆里偶尔爆出一星火花，飘上半空，转眼就没了踪影。"
 SUM_Neo_SGD.132.a:"重立赤王的旧制"
 SUM_Neo_SGD.132.b:"重建城邦的议会"
 SUM_SGD_RC_Floral_Shrine:"花神置宇"
 SUM_SGD_RC_Floral_Shrine_desc:"花神的信众不断绝，官府便替他们立龛，只是龛前要多站一个官。拜的人是真心，站的官却是冷眼。两下里各守各的，倒也相安。拜的人闭着眼，站的官却睁着眼，谁也不扰谁。"
 SUM_Neo_SGD.133.t:"花神置宇"
 SUM_Neo_SGD.133.d:"龛里的香灰一日厚似一日，官儿换了一任又一任，香火却始终没断。花神的信众到底不曾断绝，年年岁岁总有人来拜。官府见拦不住，索性替他们立了龛，方便祭拜。只是这龛前，比先前多站了一个官，这多出来的一个人，意味深长。先前信众拜花神是自家的心思，跪下磕头，心里想什么谁也不管；如今龛前站了官，众人跪拜都有人看着，嘴里念的词也斟酌着改了几分。有那耿直的信众，不肯对着官磕头，转身便走；也有那乖觉的，反倒觉得有了官府撑腰，拜得更踏实，供品也摆得更丰盛。龛还是那个龛，神还是那位神，只是多了一双眼睛。有的信众索性把那官儿也当成龛前的一景，上香时顺手也给他行个礼。"
 SUM_Neo_SGD.133.a:"召集能战之众"
 SUM_Neo_SGD.133.b:"召集能谋之士"
 SUM_SGD_RC_Pilgrim_Guard:"立护法伍"
 SUM_SGD_RC_Pilgrim_Guard_desc:"朝圣的道上有一支护法队伍，他们照看的不光是进香的善信，连沿途的税卡也一并守着。善信道过谢，这队人却死死盯着路口，目光片刻不离。为首的撂下话：「善信走到哪儿，我们的岗就守到哪儿。」一路紧随，从无半步松懈。"
 SUM_Neo_SGD.134.t:"分兵护两"
 SUM_Neo_SGD.134.d:"香客们私下犯了嘀咕：「我等是来拜神的，怎么弄得像押着货过关一样？」护法队的头目听了只笑：「神要拜，税也要抽，两头都护着，才保你一路平安。」香客们无奈，只好接着赶路。通往圣地的朝圣路上，新朝派了护法队一程程护送，名义上是护着香客、防备盗匪风沙，可明眼人都瞧得出，沿路那一座座税卡才是护得最紧的。香客背着香囊一步步跋涉，护法队前头开道、后头压阵，到了税卡就帮着盘查客商，抽税验货一样不落。好在那伙盗匪果然收敛了，路上安宁了些。只是香税一年比一年重，香客嘴上不说，心里都有一本账。有精明的索性避开官道，从沙脊上绕过去图个省事，护法队也睁一只眼闭一只眼。"
 SUM_Neo_SGD.134.a:"以神权号令沙漠"
 SUM_Neo_SGD.134.b:"以律法约束诸城"
 SUM_SGD_RC_Army_Reform:"整饬军伍"
 SUM_SGD_RC_Army_Reform_desc:"「旗号换了，兵还是那些兵。」老队头嘟囔了一句，被旁边人劝住。原来各部各团的兵都并成了一支军，旗号、号令、粮饷一准划一。那些被撤的老队心里不服，手上却得听话，号令一发，再不敢各走各的。"
 SUM_Neo_SGD.135.t:"收卒结伍"
 SUM_Neo_SGD.135.d:"那支新军操练起来，号令齐整、进退合度，比先前各吹各号的队伍强出百倍；阅兵那天队伍打城门下走过，百姓都看直了眼。沙漠各部各团向来是各打各的旗、各听各的令，新朝一出手，硬把这一盘散沙捏成了一支军：旗号划一，号令归一，粮饷也由官府统一发下。这一编，省事实在省事，可也招来一肚子怨气。那些被撤的老队伍，祖传的旗号说没就没，心里哪服气？私下骂骂咧咧，说这是断了人家的根。可骂归骂，粮饷攥在人家手心，号令大过天，手里却不得不听。操练时新旧兵掺在一块，起初还互相别着劲，日子久了倒也磨出几分默契。有个老兵捏着旧旗，眼圈红了，末了还是把旗交了上去。 校场上的黄土被脚步踏起一层浮尘，落日一照，黄澄澄的，映着一张张年轻的脸。"
 SUM_Neo_SGD.135.a:"把遗迹挖开"
 SUM_Neo_SGD.135.b:"把遗迹封回去"
 SUM_SGD_RC_Staff_College:"开军师幕"
 SUM_SGD_RC_Staff_College_desc:"军师府管谋划与粮道，不直接带兵。带兵与谋划分开，谁也翻不了天。那军师伏在案上画图，一笔一笔，都在算粮。案上的粮道图换了一张又一张，墨迹都没干透，他自语道：「兵可以打，粮不能断。」"
 SUM_Neo_SGD.136.t:"开军师幕"
 SUM_Neo_SGD.136.d:"带兵的只管打仗，谋划的只管运筹，粮草供给另由军师府调度，三者环环相扣，缺一不可。新朝专设了一个军师府，只管谋划和粮道，却不直接带兵，这一分开便是关键所在。旧时的毛病就出在将领既掌兵又抓粮，势力一大就不听调遣，动不动拿兵权要挟朝廷；如今兵权、谋划、粮道分在三处，彼此牵制。带兵的想开战，先得向军师府讨粮；军师府要调兵，也得禀明主上，不能擅自做主。有一回大将请求出战，军师府以粮草尚未齐备为由驳回，大将干瞪着眼，也只好按捺下来。有人嫌这样办事太啰嗦，主事的却道：「宁可啰嗦些，也不可叫一人独大。」后来果真有人想学旧日权臣独揽大权，就因军师府在旁牵制，终究没能得逞。"
 SUM_Neo_SGD.136.a:"重立赤王的旧制"
 SUM_Neo_SGD.136.b:"重建城邦的议会"
 SUM_SGD_RC_Garrison_All:"随地设戍"
 SUM_SGD_RC_Garrison_All_desc:"沙漠诸城，城城设起戍所，街街头头都立着岗。入夜之后，灯火一处接一处，巡卒的刀映着月光。自打戍所立起来，夜里行路的人便少了。原来巡卒逢人便盘问：「什么人？」谁也不愿惹那麻烦。"
 SUM_Neo_SGD.137.t:"随地设戍"
 SUM_Neo_SGD.137.d:"梆子声到了街口便断了，更夫被岗哨拦下，掏腰牌、答话、验过，才放他过去。这新朝治下，城城设戍所、街街设岗哨，小所十来人、大所数十人，横刀立马把着路口。自打有了这阵仗，走夜路的人眼见着稀了。从前沙漠的夜多自在，寻常人家趁着月色串个门、访个友，谁也不当回事；如今一更鼓一过，街上就空了场，唯有戍所的灯孤零零亮着。偶尔有赶夜路的，被岗哨一声喝住，盘问个半天，验明腰牌才放行。有人拍手说治安好了，夜里再不怕劫道；也有人私下嘀咕管得太死，出趟门都得报备。戍所的兵全不理会，只按令行事，风雨无阻。岗哨的刀在火把下亮晃晃，把一条街照得通明，偏偏照不见半个行人。有人就叹：太平倒是太平了，可这夜里，到底是歹人怕官，还是百姓也怕起官来？"
 SUM_Neo_SGD.137.a:"召集能战之众"
 SUM_Neo_SGD.137.b:"召集能谋之士"
 SUM_SGD_RC_Conscription:"立调丁法"
 SUM_SGD_RC_Conscription_desc:"沙漠立下新法，凡成丁者皆有服役之责，年限一满便放回家。法才立，各家便把尚未成丁的藏进地窖，报户口时一个个都说年纪尚小。有那差役挨门查点，也查不出个所以然。有百姓私下道：「这兵役，谁家不怕？」"
 SUM_Neo_SGD.138.t:"十六登籍"
 SUM_Neo_SGD.138.d:"新朝下了道令：成年男子都得服兵役，期满才准回家。这命令本意不坏，可到了下面执行就乱了套。原来成丁的门槛卡在十六岁，孩子刚满十六就得被拉去当兵。百姓们急了，想出各样花样躲避：有的把生日往小了改，有的把儿子藏进地窖，有的赶忙给儿子完婚，好借口儿子已经成家拖着不去。官府派人逐户清查，查到藏人的就罚粮罚钱，一点不含糊。可百姓的招数也跟着翻新，防不胜防。有一家为了躲兵役，干脆全家搬进沙漠深处，好几年都不敢回城。差役挨村搜查，可藏着的人实在太多，哪里查得过来。有个老吏见了直叹气：「这法令一颁布，家家都藏着没到年纪的人，等于白定了。」官府无可奈何，最后只好改弦更张，按田亩多少摊派兵役。"
 SUM_Neo_SGD.138.a:"以神权号令沙漠"
 SUM_Neo_SGD.138.b:"以律法约束诸城"
 SUM_SGD_RC_Purge_Soft:"简阅行伍"
 SUM_SGD_RC_Purge_Soft_desc:"军里那几支不听话的兵，被一概清了出去。问其罪状，却没有什么，只一句不合适便打发了。众人被赶出营门，连个去处也没有，军中自此无人敢有异议。有分教：军中容不得异己，一句话便是罪名。"
 SUM_Neo_SGD.139.t:"无辜见录"
 SUM_Neo_SGD.139.d:"军里那几支不听招呼的队伍，最后卷铺盖默默出了营门。新朝整军，这一桩办得干脆：把桀骜的几支清出去。可清人跟厮杀两样，这里头的讲究最多。那几支队伍，愣是寻不出一条罪状：没反叛，没贪墨，也没耽误军机，无非平日里傲气些、不大服管。上头传下的话，只轻飘飘三个字：不合适。这三个字说不清道不明，却谁也驳不倒。被清的兵脱了甲、缴了械，灰溜溜离营，连个说法也没处讨。旁人瞧着心里凉了半截：原来这军里，听话比能干更要紧。有那乖觉的，从此把头埋得更低。有人壮着胆子问主事的官，那官把眼一瞪：「不合适就是不合适，难道还要讲出个所以然不成？」众人再不敢吭声。 营门口的旗杆空了两根，风一吹，绳子抽在杆上啪啪作响，没人再去理会。"
 SUM_Neo_SGD.139.a:"把遗迹挖开"
 SUM_Neo_SGD.139.b:"把遗迹封回去"
 SUM_SGD_RC_Dig_More:"重启故墟"
 SUM_SGD_RC_Dig_More_desc:"那些封了的遗迹，如今又要重新挖开。镐头下去，挖出铜器石块，还有一堆谁也说不清的物件。有老成的劝道：「手下留情，先人埋的东西动不得。」可上头催得紧，哪里肯听。这遗迹里究竟埋着什么，没几个人说得上来。"
 SUM_Neo_SGD.140.t:"重启故墟"
 SUM_Neo_SGD.140.d:"「这东西，怕不是人间造得出的。」老匠人盯着那件铜疙瘩，摇着头说。一个胆大的后生捧着它来问，听这一句，围观的人背脊都凉了。那是新朝重挖早年封存遗迹时出土的：铜器、石碑、断剑，一件件搬出来堆满院子；可夹在中间的，还有一堆谁也说不清的东西：说不出年月，说不出来历，连上头的纹路是字是画都分不清。请了识字的老者围着看半天，也只摇头。有人说是前朝宝藏，有人道是神王遗物，还有人背地里嘀咕邪气重、不宜深究。新朝一概不管，只拣能用的拿去使，用不上的就堆进库房积灰。那些说不清的物件，夜里还隐隐发光，守库的兵谁也不敢独自靠近。"
 SUM_Neo_SGD.140.a:"重立赤王的旧制"
 SUM_Neo_SGD.140.b:"重建城邦的议会"
 SUM_SGD_RC_Great_Works:"大兴版筑"
 SUM_SGD_RC_Great_Works_desc:"旧王城边上，新起了一片宫室。那石料从何而来？全是拆了遗迹运来的。拆旧盖新，本是沙漠的老手艺。工地上，工匠们搬石垒墙，尘土飞扬。有个老匠人边干边摇头，低声道：「这石头上有古字，只怕得罪了先人。」"
 SUM_Neo_SGD.141.t:"毁旧营新"
 SUM_Neo_SGD.141.d:"「旧石头闲着也是闲着，拿来盖新宫，有什么不妥？」有人这么替新朝辩解。可也有人摇头：拿祖宗的东西给今人撑门面，心里总不是滋味。新朝在旧王城遗址边上新起宫室，那些石料哪来的？是从远远的遗迹上一块块拆下来的。这拆旧盖新，原是沙漠的老手艺，祖辈就靠这个：缺木少石，便把前朝的墙拆了砌本朝的宫，把古人的坟平了盖今人的屋。匠人做惯了，凿子一挥石缝就开。有个心细的，看出拆下来的石头上还留着旧日刻纹，便悄悄把这几块砌进了新宫的墙根。新宫一日日成形，巍巍峨峨，气派得很，只是石缝里像还渗着前朝的气息。老人们仰头看着，一齐叹气：这沙漠的宫阙啊，就是一本永远翻不完的旧账。"
 SUM_Neo_SGD.141.a:"召集能战之众"
 SUM_Neo_SGD.141.b:"召集能谋之士"
 SUM_SGD_RC_Relic_Armory:"故器充兵"
 SUM_SGD_RC_Relic_Armory_desc:"遗迹里挖出的机关与构装，都被拆开细细研究。能用的部件，便装进军里使。军械营中，奇形怪状的机括摆了一地，匠人们拆了又装，装了又拆。有装成的果然厉害，只是偶尔走火，吓得人一跳，匠人赔笑道：「这东西，性子还没摸透。」"
 SUM_Neo_SGD.142.t:"故器充兵"
 SUM_Neo_SGD.142.d:"有件构装拆到最后，里头竟滚出一把沙来，谁也讲不清它在沙底埋了多少年。新朝从遗迹里掘出的机关构装，并不当古董供着，反倒拆开细细琢磨。那些铜人、石兽、连弩，年代久远早成了废铁，可匠人拆开一看，里头机括精巧得叫人咋舌。能用的修修补补装进军中：连弩改一改成军中利器，构装拼一拼做营里守卫。匠人围着这些物件拆了又装、装了又拆，废寝忘食，连饭都顾不上吃。这改过的家伙使起来趁手，比旧物强出不少，军士们得了新玩意儿个个喜笑颜开。也有几个老兵摇头，说这来路不明的东西用着心里发毛。 作坊里机油味呛人，匠人拿袖子抹了把脸，手上油黑发亮，笑得露出白牙。"
 SUM_Neo_SGD.142.a:"以神权号令沙漠"
 SUM_Neo_SGD.142.b:"以律法约束诸城"
 SUM_SGD_RC_Slab_Script:"审石辨文"
 SUM_SGD_RC_Slab_Script_desc:"教令院召集识字的人，来释读那些石板。众人围着看了半日，读出来的字，东一个西一个，竟凑不成句。偏有几句凑出来的，读着倒像预言，叫人心里发毛。有个学者低声道：「这不像记事的，倒像谶语。」"
 SUM_Neo_SGD.143.t:"审石辨文"
 SUM_Neo_SGD.143.d:"石板上那些字缺胳膊少腿，笔画又古怪，一群识字的人围着瞪眼辨认半晌，勉强认出几个，可拼来凑去，怎么也凑不成一句完整话。新朝把这班人召来，本是要他们释读遗迹里出土的石板，这差事最磨人。有几块倒拼出了短句，偏偏那几句读着都像预言，说什么沙上将要崛起王城，说什么旧誓将要重新光耀。众人你看看我、我看看你，谁也不敢落笔：万一真是预言，说对了还好，说错了可是欺君的大罪。有人主张照实抄下，有人主张一把火烧了免得惹祸，争来争去，最后只把那几句抄下呈了上去。众人读了心里都不踏实，不知这预言究竟主吉主凶。有位老者说道：「古人的话，宁可信其有，不可信其无。」也有人斥之为一派胡言。"
 SUM_Neo_SGD.143.a:"把遗迹挖开"
 SUM_Neo_SGD.143.b:"把遗迹封回去"
 SUM_SGD_RC_Canal_King:"浚治王渠"
 SUM_SGD_RC_Canal_King_desc:"沿着旧渠的走向，重开一条王渠。渠成之后，水一路流到中部荒原，那片荒了多年的地，竟也能住人了。渠水淌过，两岸百姓欢呼雀跃，有人当场便搭起草棚，笑道：「有水，咱就在这儿安家！」有分教：一条王渠活一方，荒原从此有人烟。"
 SUM_Neo_SGD.144.t:"浚复王渠"
 SUM_Neo_SGD.144.d:"渠修成那天，清水顺着水道哗哗淌进中部的荒原。新朝沿着旧渠的走向，重新开了一条王渠；这渠年久失修，早被黄沙埋住，这回照着旧迹一寸寸挖通。挖渠的人顶着烈日，挖了塌、塌了再挖，手上磨出血泡也没人喊一声苦。水一到，荒原便活了：先前那儿是不毛之地，黄沙漫漫连鸟都不落；如今水一浇，草绿了，草绿了就能放牧、能屯田，就有人家搬来落脚。才几年工夫，荒原上立起村落，炊烟袅袅。逃荒的人闻讯赶来，在渠边搭起窝棚开荒种地，不过一年，渠边就住了人家，鸡犬相闻。有老农蹲在渠边，捧起一把水叹道：「沙漠的命，就在这水里。」有人指着渠水感慨：有水，就有命。 渠水拐弯处，几个妇人蹲在石板上捶洗衣物，棒槌声和着水声，传出老远。"
 SUM_Neo_SGD.144.a:"重立赤王的旧制"
 SUM_Neo_SGD.144.b:"重建城邦的议会"
 SUM_SGD_RC_Camel_Heavy:"肃整驼旅"
 SUM_SGD_RC_Camel_Heavy_desc:"给驼骑加甲，走起来慢是慢了些，可冲阵时挡不住。披甲的骆驼，铁甲垂到腹下，走一步哗啦作响。有起初嫌慢的，待到临阵，方知这甲救命，刀砍上去只留一道白痕，不由赞道：「这甲，值！」"
 SUM_Neo_SGD.145.t:"肃整驼旅"
 SUM_Neo_SGD.145.d:"真到了阵前，众人才晓得厉害：箭矢如雨射来，披甲的驼骑冲在头里，箭射在甲上叮当乱响，竟穿不透。新朝给驼骑加甲，这驼骑本就笨重，再披一层铁甲，走起来慢吞吞一步一晃，看着憨态可掬。有人笑它累赘，说这样的队伍如何冲锋陷阵？可一交阵，众人便笑不出了。那披甲骆驼冲起来像一堵墙，铁甲护着要害，弓箭射上叮当弹开，近身刀砍也只留一道白痕，敌阵战马撞上这铁塔般的驼骑，登时人仰马翻。原来这慢是为快蓄力，这重是为冲锋稳当。加甲的驼骑一旦跑开便再也拦不住。先前有人讥笑这是画蛇添足，把轻骑弄成笨壳子；后来敌军一见驼骑披甲而来，便退避三舍。"
 SUM_Neo_SGD.145.a:"召集能战之众"
 SUM_Neo_SGD.145.b:"召集能谋之士"
 SUM_SGD_RC_Sandstorm_Banner:"风帜之众"
 SUM_SGD_RC_Sandstorm_Banner_desc:"选一批耐风沙的人，编成军团，专挑沙暴天出击。风卷黄沙，遮天蔽日，正是他们的城墙。敌人睁不开眼，他们却认得路，摸上去便是一阵砍杀。这等兵难缠，风越大，他们越精神。风是城墙，沙是刀兵。"
 SUM_Neo_SGD.146.t:"风帜之众"
 SUM_Neo_SGD.146.d:"敌军探子刚报「风沙太大，啥也看不清」，话还没落地，一支人马已从沙幕里杀将出来。新朝挑了一批经得住风沙的汉子，另编一军，这些人土生土长在沙漠，风里来沙里去，练出一副好身手：黄沙眯不了眼，沙暴困不住脚。这军打仗，专拣沙暴天动手。别人躲风沙还来不及，他们偏迎着沙直冲。为啥？漫天黄沙就是最好的掩护，风声盖住马蹄，沙幕藏了人影，敌军还没回过神，刀已架到脖子上了。风是他们的墙，沙是他们的刃。有人问起，为首的答道：「旁人把风沙当祸害，咱当它是城墙；风一起，就是咱的屏障。」这军逢沙暴必出，战无不胜，敌人听了名号就发怵。沙粒打得脸生疼，他们眯着眼，越杀越起劲。"
 SUM_Neo_SGD.146.a:"以神权号令沙漠"
 SUM_Neo_SGD.146.b:"以律法约束诸城"
 SUM_SGD_RC_Fort_Chain:"堡戍相望"
 SUM_SGD_RC_Fort_Chain_desc:"沿边境修起一串堡垒，堡与堡之间，骑兵一日可达。这一串堡垒连起来，前线便成了一条线，再不是各处零散的据点。烽火台一座接一座，狼烟一起，半天之内便传遍全线。堡垒连珠，边境成线。"
 SUM_Neo_SGD.147.t:"堡戍星罗"
 SUM_Neo_SGD.147.d:"一处燃起狼烟，报警的讯号沿着堡垒一座座传下去，援军转眼就到。新朝沿边境修了一串堡垒，一座挨一座，远望像连成线的珠子。堡与堡间的距离都是算好的，快马一天能赶到下一座，传令、换防、运粮，样样不误。这么一来，原本七零八落的前线连成一条线，动一处便牵动全身。早先敌人来犯，这边挨打那边不知，首尾照应不上；如今堡垒串成一线，军情一站站往下递，快得跟接力似的。守边兵士也踏实了，知道背后有依靠。从前边境是散落的点，如今连成一串，敌人撞上来就像撞在铁壁上，进不得退不甘。守卒握刀立在堡头，望着绵延而去的烽燧，心里有了底。"
 SUM_Neo_SGD.147.a:"把遗迹挖开"
 SUM_Neo_SGD.147.b:"把遗迹封回去"
 SUM_SGD_RC_Weapon_Works:"置兵器官"
 SUM_SGD_RC_Weapon_Works_desc:"设了一座军械监，专管造兵器。监里炉火从早烧到晚，匠人赤着上身打铁，脾气比官还横。你道为何？原来没有他们，军队便是一具空壳。有不懂事的官想克扣工钱，被匠人当面顶回去：「少一个子儿，这刀你自个儿打！」那官也只得罢了。"
 SUM_Neo_SGD.148.t:"匠者居尊"
 SUM_Neo_SGD.148.d:"监里的官见着匠人，也得赔三分笑脸，话都说得客客气气。你道为什么？新朝设了军械监专管造兵器，可这衙门里的匠人，比当官的还牛气。没他们，军队就是个空壳：刀枪剑戟、弓弩甲胄，哪样不经过匠人的手？他们稍微一撂挑子，前线立刻没了器械。匠人自己明白斤两，走道都带风。有回一个外行官想充内行，嫌刀打得不好要改样式，匠人把刀往案上一拍：「你懂什么？这刀是拿命试出来的！」那官脸涨得通红，只好讪讪退下。上官反倒笑道：「少了这帮匠人，军里就是空的，手里没家伙，拿什么打仗？」于是隔三差五登门请教，好酒好肉先送过去。匠人受了敬重，打出的兵器越发精良，炉火昼夜不熄，锤声叮叮当当。"
 SUM_Neo_SGD.148.a:"重立赤王的旧制"
 SUM_Neo_SGD.148.b:"重建城邦的议会"
 SUM_SGD_RC_War_Chest:"军帑充牣"
 SUM_SGD_RC_War_Chest_desc:"单设一座军费库，钱只进不出。要动这笔钱，须三个人同时开口，少一个也不成。库门上锁三重，钥匙分三人掌着。有想挪用的，凑不齐三人，只好干瞪眼。有分教：钱进容易出钱难。"
 SUM_Neo_SGD.149.t:"饷入而弗出"
 SUM_Neo_SGD.149.d:"库门前养着两条凶犬，生人不敢近前，守库兵丁昼夜倒班，连只苍蝇也钻不进去。新朝单设一座军费库，专存军费，这库的规矩古里古怪：钱只往里进，不往外掏。各处的税赋、商人的捐输，流水似的往里送，可要从中拿一个铜板出来，比登天还难。动这笔钱，得三个人一齐点头，少一个都不行；三人各执一把钥匙，谁也单独开不了那道库门。旧时的毛病，是银子进来快、出去也快，不明不白就填了谁的腰包；如今三人互相盯着，谁也甭想独自做主。有回前线催粮催得火急，请拨银子，三个人一时凑不齐，硬生生拖了半个月。虽有人抱怨，却没人敢破这例。有人想伸手，买通了三人中的两个，偏偏第三个不松口，到底没成。"
 SUM_Neo_SGD.149.a:"召集能战之众"
 SUM_Neo_SGD.149.b:"召集能谋之士"
 SUM_SGD_RC_Old_Order:"仍循旧章"
 SUM_SGD_RC_Old_Order_desc:"城里有一班人，主张照旧例行事。该交的交，该办的办，只是账本换个封皮，旁的都不动。这样的人，城里很多。他们凑在茶馆里，就着一壶薄荷茶，你一言我一语，都说：「祖宗的法子，错不了。」"
 SUM_Neo_SGD.150.t:"仍循旧章"
 SUM_Neo_SGD.150.d:"茶楼酒肆里这类人一抓一大把，凑到一处就念叨：「改来改去，还不是那套？折腾而不如安稳。」新朝更张那阵，有一班人主张照老规矩办，倒也非存心作对，只图个安稳：该纳的税照纳，该当的差照当，上头换了名号，他们就把账本换个封皮，里头的账一笔一笔仍是老样子。你问新朝好在哪，他说不上来；问旧朝坏在哪，他也只叹两声。日子怎么过还怎么过，新官来了照样赔笑，照样呈上账本。有回新官翻账，看出封皮新、里子旧，气得把桌子一拍，可挑来拣去竟找不出大错来。新朝的官听了这些牢骚，也不争辩，任他们说去。众人捧着茶碗，你一言我一语，说得挺热闹。"
 SUM_Neo_SGD.150.a:"以神权号令沙漠"
 SUM_Neo_SGD.150.b:"以律法约束诸城"
 SUM_SGD_RC_Tribute_Terms:"重科贡赋"
 SUM_SGD_RC_Tribute_Terms_desc:"与雨林重算贡赋。交还是交，只是数目少了三成，名目也换了。换名目不换里子，两边都下得来台。文书上一句句写得客气，其实骨子里还是那一套。两边使臣各让一步，拱手道：「这事，就这么定了。」"
 SUM_Neo_SGD.151.t:"重科贡赋"
 SUM_Neo_SGD.151.d:"雨林使臣临走前，背着人悄悄跟沙漠的官儿说道：「名目是改了，可心里都透亮，往后还得指着这个过日子。」官儿笑而不答，只点了点头，两人彼此心知肚明。新朝跟雨林重新算贡赋，这一算大有讲究：该交的分文不少，只是数目略减，名头也换了新的。早先叫岁贡，如今改称互市之利；早先是单方进献，如今写成两边往来。名头一换，听着就顺耳多了。可明白人都清楚，换的是面子，不换的是里子：东西照旧得送，好处照旧进了沙漠的口袋。雨林那边也乐于就坡下驴，名头既然好听，便点头画押，双方都下了台。有耿直的臣子想戳破这层纸，被上官使个眼色止住，只好把话咽回肚里。两边堆着笑，都说往后和气生财，这一纸新约，两头都得了实惠。"
 SUM_Neo_SGD.151.a:"把遗迹挖开"
 SUM_Neo_SGD.151.b:"把遗迹封回去"
 SUM_SGD_RC_Border_Status:"界上旧盟"
 SUM_SGD_RC_Border_Status_desc:"边界一寸不动，只把守界的人换成了自己人。人一换，这界便换了主人。界碑还是那块界碑，守碑的却已是沙漠的兵。有过往的商队纳闷：「这关口，怎么说变就变了？」"
 SUM_Neo_SGD.152.t:"界上旧盟"
 SUM_Neo_SGD.152.d:"雨林的人不服，想来争辩，守界的兵笑说道：「界没动，你还争什么？」对方一想这话也在理，只得悻悻而归。新朝与邻邦的边界一寸未动，奇妙的是边界虽没动，主人却换了。怎么换的？原来只把守界的人换成了自己人。先前界碑旁驻的是别人的兵，挂的是别人的旗；如今兵撤了，换上沙漠戍卒，旗也换了颜色。界碑还是那块碑，刻字还是那些字，可守它的人一变，这边界便认了新主。周边百姓起初还照旧往界那边赶集，被新戍卒拦下，才知世道变了。守界兵按令行事，只在自己这一侧收税放人。新兵站在碑边，把刀往地上一杵，望着旧人远去。这一换，边境的规矩、口音、旗号都跟着变了。"
 SUM_Neo_SGD.152.a:"重立赤王的旧制"
 SUM_Neo_SGD.152.b:"重建城邦的议会"
 SUM_SGD_RC_Keep_Officials:"吏仍守职"
 SUM_SGD_RC_Keep_Officials_desc:"官署里的旧吏，大多留用。会算账的人，到哪一朝都缺。留着他们，税才收得上来。那些老吏照样坐在案后拨算盘，一笔一笔，熟门熟路。新来的官反倒要请教他们：「这笔账，怎么算？」"
 SUM_Neo_SGD.153.t:"吏仍守职"
 SUM_Neo_SGD.153.d:"有个年轻官儿想显显本事，一把算盘打得噼里啪啦，末了账目糊涂成一团，还得厚着脸皮去求旧吏收拾。新朝的官署里，那帮旧吏多半留了下来。倒不是新朝心软念旧，实在是用得上：会拨算盘的人，哪朝哪代都缺。那些账目往来的窍门、税收厘金的规矩，他们闭上眼都算得明白；新来的哪怕一肚子学问，对着一本乱账也只有干瞪眼。上头索性一纸令下，旧吏照旧留任，只是头顶上换了个新官。这帮人也机灵，见风使舵，把新官的脾性摸了个透，该呈的账呈上，该说的话说足，税粮便能源源不断地收上来。有人骂他们没骨气，他们只赔着笑：「升官是别想了，饭碗总算保住。」果然新官到任两眼漆黑，事事都得靠这帮旧吏撑着。"
 SUM_Neo_SGD.153.a:"召集能战之众"
 SUM_Neo_SGD.153.b:"召集能谋之士"
 SUM_SGD_RC_Quiet_Land:"守成勿扰"
 SUM_SGD_RC_Quiet_Land_desc:"不折腾，不冒进，先把眼下的日子守稳。这条路听着不响亮，却最不容易翻车。有好大喜功的，嫌这法子太闷，可真出了乱子，方知稳妥的可贵。百姓得以安心耕织，有人说：「平平安安，就是好日子。」"
 SUM_Neo_SGD.154.t:"守成勿扰"
 SUM_Neo_SGD.154.d:"别家把摊子铺得铺天盖地，闹腾得鸡飞狗跳，这里却是另一番光景：集照开，井照打，日子照旧过。沙漠里还有这么一路主张，听着最不响亮：不折腾，不扩张，守着眼前的日子安安稳稳过下去。没有开疆拓土的豪言，也没有立王统的壮举，可偏偏是这一路，最经得起风浪。人家修庙、整军、掘遗迹，闹得沸反盈天，他们只守着水井、田地、账本，该下地就下地，该做买卖就做买卖。船小好调头，摊子大了反倒一有风吹草动就手忙脚乱。急性子嫌他们窝囊，他们淡淡回一句：「日子是过给自己的，不是摆给旁人瞧的。」为首的把话说得明白：「大志能换几个钱？沙漠穷了这几十年，百姓图的不过是口粮和水，安稳压倒一切。」"
 SUM_Neo_SGD.154.a:"以神权号令沙漠"
 SUM_Neo_SGD.154.b:"以律法约束诸城"
 SUM_SGD_RC_Scarlet_Throne:"赤王还朝"
 SUM_SGD_RC_Scarlet_Throne_desc:"旧王城遗址上，垒起一座高台。台下军士按号站定，台上的人受了冠。第一道令：沙漠所有路都设卡，所有城都设戍。沙漠从没有这样整齐，也从没有这样安静，台下众人俯首，鸦雀无声。"
 SUM_Neo_SGD.155.t:"赤王还朝"
 SUM_Neo_SGD.155.d:"从前王城人来人往热闹非凡，如今他站在高台上俯视脚下黑压压的军阵，连一声咳嗽都听不着。新王在旧王城废墟上垒起一座高台，石料全是拆来的旧物；台下军士按号令排得笔直，鸦雀无声。他一步步登台受了冠，那冠压得脊背挺直。环视一周，他缓缓开口，颁下第一道令：沙漠所有的路口设卡，所有的城池设戍。话音一落，台下齐声应诺，声浪滚过黄沙。打这天起，沙漠从没这么整齐过，也没这么安静过：路上有卡，城中有戍，人来人往都照规矩走，连讨价还价的声儿都低了几分。远处一位老者望着这阵势，喃喃道：「这沙漠，真个是换了个模样。」只是这般整齐安静里头，究竟藏着福还是祸，谁也说不准。"
 SUM_Neo_SGD.155.a:"把遗迹挖开"
 SUM_Neo_SGD.155.b:"把遗迹封回去"
 SUM_SGD_RC_Suzerain_Order:"碛中守局"
 SUM_SGD_RC_Suzerain_Order_desc:"沙漠与雨林重划了账：贡赋减三成，守界的换成自己人，旧吏一个没动。城门口那口钟照旧敲，只是敲钟的人换了衣裳。钟声依旧，城却是另一番光景了。"
 SUM_Neo_SGD.156.t:"碛中守局"
 SUM_Neo_SGD.156.d:"有明白人指着那敲钟的叹道：「钟还是那口钟，响还是那个响，可敲钟的人，早换了。」沙漠跟雨林把两边的账重新划了一遍，这一划，账面上清爽不少：贡赋去了三成，守界的兵换成自家子弟，城里的旧吏却一个没动。该减的减，该换的换，该留的留，桩桩件件都盘算得清楚。城门那口老钟照旧每天敲，当当的声响飘过城墙，百姓听了几十年，早听惯了。只是这回敲钟人换了身衣裳：早先是雨林打发的差役，如今是沙漠自己的兵。钟没换，声没变，敲钟的人一改，这座城便改了叫法。有起早赶集的听见钟响，怔了怔，才回过神来世道不同了。挑担的路人从钟底下过，听着熟悉的钟声，浑然不觉天已经变了。"
 SUM_Neo_SGD.156.a:"重立赤王的旧制"
 SUM_Neo_SGD.156.b:"重建城邦的议会"

 #### 开战须弥 · 雨林的门 ####
 SUM_SGD_WAR_The_March_on_Sumeru:"移师伐林"
 SUM_SGD_WAR_The_March_on_Sumeru_desc:"独立只是第一步。沙漠的粮仓、商路与水，多半还捏在雨林手里。要真正说了算，就得把那道门敲开，把雨林从沙漠的账本上一笔划掉。这段账，沙漠人记了不止一年，有人咬牙道：「这笔账，该算了。」"
 SUM_Neo_SGD.157.t:"移师伐林"
 SUM_Neo_SGD.157.d:"议事厅里，主张这事的人把地图往桌上一摊，手指头点着那几处粮仓和水源说道：「这些不攥在咱们手心，独立便是句空话；人家一掐脖子，咱们立刻断粮断水。」众人一听，脸色都变了。沙漠独立不过是头一步，这一步迈出去瞧着红火，其实站都站不稳：粮仓、商路、水源多半还握在雨林手里。粮仓在人家地盘上，商路过人家关口，水从人家山里淌出来，样样都是命根子。要真做得到家，就得把门敲开，把雨林从账本上一笔笔抹去。有识之士看得透，再三上言：今日的独立是虚架子，人家卡住粮水，用不了三个月就见分晓。主事的却按下不提，只推说时机不到。于是沙漠一面庆贺，一面偷偷屯粮练兵，等着来日。"
 SUM_Neo_SGD.157.a:"以动员令起兵"
 SUM_Neo_SGD.157.b:"以盟约召集部族"
 SUM_SGD_WAR_Mobilize:"四境皆起"
 SUM_SGD_WAR_Mobilize_desc:"动员令传遍各城各族，市集上的男人走了一半，剩下的多半是老人和孩子。昨日还吆喝的汉子，今日便背上了刀。妇人拉着孩子的手，立在路边相送。有分教：一声令下，半城男儿。"
 SUM_Neo_SGD.158.t:"四境皆起"
 SUM_Neo_SGD.158.d:"说书人把醒木往桌上一拍，惊堂木响处，满堂茶客都竖起耳朵，讲的正是好男儿从军的故事。动员令一下，各城各族像平地炸了雷。集上原本挤得转不开身，做买卖的、耍手艺的、看热闹的，闹哄哄一片；令旗一到，青壮汉子丢下摊子、撂了家什，转身回家捆行李投军去了。才几天，集市就塌了半边：走的多是壮劳力，留下的不是白头老翁，就是扯着衣角乱窜的娃。卖水的老汉守着空摊子直愣神，一个妇人抱着孩子在路口站着，望着队伍开拔的方向，站了半晌也不挪步。那令箭快马一程接一程，城传城、族传族。人听了，先是沸沸扬扬议论一阵，转眼汉子们便扛刀带枪走了大半。老汉蹲在墙根发呆，妇人抱着娃在门首抹泪。"
 SUM_Neo_SGD.158.a:"直取雨林关隘"
 SUM_Neo_SGD.158.b:"先断其商路"
 SUM_SGD_WAR_War_Tax:"科敛军资"
 SUM_SGD_WAR_War_Tax_desc:"税吏挨门挨户地催，做买卖的直心疼，种地的直叹气，可嘴上都软绵绵地应一句：「打完仗再算这笔账。」背地里却一个个叫苦不迭。新添的这笔军费，摊下来商人担大头，农人担小头，谁也躲不过去。"
 SUM_Neo_SGD.159.t:"科敛军资"
 SUM_Neo_SGD.159.d:"收税的差役挨门挨户地催，算盘珠子拨得噼啪响，有一户老农把粮袋底儿都倒了出来，望着空荡荡的囤子半晌说不出话。新朝要添军费，钱从哪儿来？摊派：商人挑大头，农人出小头，人人有份，谁也躲不掉。商人底子厚，出得多，心疼得直吸气；农人就那几亩薄田，出的虽少，也都是汗珠子摔八瓣换来的。交钱的人嘴里念叨的都是同一句话：等打赢了再说。这话里一半是盼头，一半是无奈。有精明商人一边掏钱，一边盘算日后能不能从关税上找补回来；有老实农人把铜板一个个数清楚，叹口气交上去。收钱的官登了账，开出票据，许诺战后加倍奉还。众人交完钱都说：这钱到底值不值，且等打赢了再论。"
 SUM_Neo_SGD.159.a:"把话说给雨林人听"
 SUM_Neo_SGD.159.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Ration:"计口授食"
 SUM_SGD_WAR_Ration_desc:"粮与盐按口配给，先紧着前线和做工的人。配给的规矩，一张张贴在各城墙上。墙下百姓仰头看着，有的点头，有的皱眉。那告示下头还画着一个装粮的袋，提醒众人省着些用。"
 SUM_Neo_SGD.160.t:"计口授粮"
 SUM_Neo_SGD.160.d:"那盐金贵，领到手的人都揣在怀里，像护着眼睛似的。新朝把粮和盐按人头来分，章程贴在每座城的墙上，写得明明白白：一人一天几合粮、几钱盐，分毫不差。先顾谁？先顾前线和出力气的人。当兵的提着脑袋拼命，工匠流着汗修渠造械，他们吃饱了才办得成事；余下的，才轮到寻常人家。于是城里到处是揣着票据排队的人，队伍七拐八弯，拖出老长。领到手的千恩万谢，排在后面怕领不着的踮起脚脖子往前望。墙上的字谁都认得，可认得归认得，到底照不照着办，还得看那管粮的官心正不正。百姓捏着凭证，一勺一勺地量；有想占便宜多舀一勺的，被管事的一顿训，赶忙缩回手去。"
 SUM_Neo_SGD.160.a:"倾全境之力"
 SUM_Neo_SGD.160.b:"留一支后手"
 SUM_SGD_WAR_War_Council:"幄中议兵"
 SUM_SGD_WAR_War_Council_desc:"军议定下三路进兵：一路走商道，一路走沙脊，一路沿渠。三路人马各领口令，约好在何处会合。沙盘上，三支令旗分插三处。帐前诸将各自记牢口令，为首的叮嘱：「别忘了会合的地点。」"
 SUM_Neo_SGD.161.t:"三路分驰"
 SUM_Neo_SGD.161.d:"主帅在沙盘上拿小旗一插，说道：「三路如同三根手指，捏起来才成拳头；任何一路受挫，另两路都要照应。」众将齐声答应，当下点齐兵马，各按路线开拔，旌旗蔽日，直向雨林而去。军议已定，三路进兵，这三路人马各有各的走法：一路走商道，那是熟路，商队常年往来，水草关卡都清楚，走起来稳当，只是敌人也料得到；一路走沙脊，那是险路，沙梁起伏荒无人烟，寻常人不敢走，恰好出敌不意；一路沿渠，那是水路，跟着王渠走向，水源不缺，只是路途绕远。三路分头，约期会师。主帅在帐中对着地图指了三处，叮咛再三：哪一路遇敌，哪一路策应，都写得清清楚楚。诸将领令，各自点兵，火速备办。"
 SUM_Neo_SGD.161.a:"以动员令起兵"
 SUM_Neo_SGD.161.b:"以盟约召集部族"
 SUM_SGD_WAR_Proclaim:"传檄伐林"
 SUM_SGD_WAR_Proclaim_desc:"檄文写得平实，说的是欠税、占水、扣粮三件事。一件一件，都有账可查。檄文贴在城门，识字的高声念给众人听。听到恼处，人人切齿，个个摩拳擦掌。"
 SUM_Neo_SGD.162.t:"传檄伐林"
 SUM_Neo_SGD.162.d:"主帅说道：「咱们出兵，不为一时的意气，只为这三笔旧账；师出有名，才教人心服。」檄文传到各处，沙漠人看了都道有理，士气为之一振。新朝出师，先发了一篇檄文，写得平实，没有那些骈四俪六的花哨话，只老老实实数了三件事：一是欠税，多少银子哪年欠的；二是占水，哪处水源被谁占了；三是扣粮，多少车粮卡在何地。一件件账目清楚，有据可查。打仗要有个名头，名头正，师才出得有理。这篇檄文不去漫骂，只摆账本，倒叫人无从反驳。有人读了点头道：「这话在理。」也有对面的读了脸上一阵红一阵白，却找不出话来回。檄文传到各处，传抄附抄的落满了市井。"
 SUM_Neo_SGD.162.a:"直取雨林关隘"
 SUM_Neo_SGD.162.b:"先断其商路"
 SUM_SGD_WAR_Sandstorm_March:"乘风而前"
 SUM_SGD_WAR_Sandstorm_March_desc:"大军专等一场沙暴才上路。风把人遮住，也把脚印遮住。黄沙漫天，人马借着风声掩护，悄悄向前推进。敌人哨探望见，只当是寻常风沙，哪知风声正好掩住了马蹄。"
 SUM_Neo_SGD.163.t:"乘风而前"
 SUM_Neo_SGD.163.d:"主帅传下将令：「风不刮起来，谁也不许上路。」众人起先不懂，主帅解释道：「大漠里用兵，最忌走漏行踪；等一场沙暴，风把人遮住，也把脚印抹平，敌军的探子便无从琢磨。」众人这才恍然。几天后狂风骤起，天昏地暗，大军悄然开拔。原来大军按兵不动，专等一场沙暴，这一等等得人心焦：连着几日晴空万里，一粒沙也不扬，将士们急得直转磨。终于有一天，天边黄云翻卷，狂风呼啸，沙暴来了，主帅令旗一挥，大军顶风上路。那风沙真够厉害：风把人裹住，十步开外认不清脸；沙把脚印盖住，刚走过的路转眼就平了。有这等掩护，行军安稳许多，敌人就算有探子也摸不着踪影。将士们裹着沙弯着腰，一步步往前蹭，风声里只剩粗重的喘息。"
 SUM_Neo_SGD.163.a:"把话说给雨林人听"
 SUM_Neo_SGD.163.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Night_Ride:"暗中夜驰"
 SUM_SGD_WAR_Night_Ride_desc:"白天歇息，夜里赶路，靠的是星星和旧道。领路的人走在最前头，一步也不错。夜色沉沉，队列无声，只听得驼铃轻响。便是遇上巡骑，也难寻他们的踪迹。"
 SUM_Neo_SGD.164.t:"昼息宵行"
 SUM_Neo_SGD.164.d:"天边刚泛鱼肚白，大军已经摸到了敌人地界边上。这一趟行军反着来：日头底下猫着歇，星月出来才动身。认路全凭两样，头顶的星斗指方向，脚下的旧道认里程，少一样都不成。打头的是个本地老向导，这人闭着眼睛都能数清哪里陷坑、哪里埋井，他脚步不错，后面一长串人便跟着不错。夜里的沙凉水似的，也静，队伍悄没声地往前挪，偶尔一声蹄响，立刻叫夜色吞了。那天偏赶上天阴，星子全叫云遮住，向导便收住脚，蹲下身抓一把沙在指间捻了捻，又辨了辨风来的方向，半晌才起身，抬手朝前一点，队伍接着走。后头的人心里暗暗佩服。他们不点灯、不点火，就靠星和路；沙漠的夜最宜赶路，凉快，又藏得住人。"
 SUM_Neo_SGD.164.a:"倾全境之力"
 SUM_Neo_SGD.164.b:"留一支后手"
 SUM_SGD_WAR_Camel_Column:"驼负军装"
 SUM_SGD_WAR_Camel_Column_desc:"辎重用驼不用车。驼能熬十天的干，车走三天的沙。一队队骆驼驮着粮草缓慢前行，仿佛一座座移动的小山。队尾的驼铃一串接一串，响个不停。"
 SUM_Neo_SGD.165.t:"驼负军装"
 SUM_Neo_SGD.165.d:"老驼工临了又嘱咐几句：「驼队走沙最怕贪快，歇脚先卸驮，让骆驼打几个滚，饮足了水再上路，才不伤元气。」沙漠行军，头一桩难处不是杀敌，是运粮。辎重队有使车的，有使驼的，一比便分出高下：大车装得多，可一陷进软沙就动不了，推车的兵吆喝半天，轮子反倒越陷越深，走三天就得停下喘口气；骆驼不一样，蹄子底下长着肉垫，踩沙如同踩平地，背上驮着粮袋水囊，十天不沾水也照走。有个老驼工拍着驼脖子对大伙说：「这畜生肚里存着十天的干粮，那大车只撑三天的沙路，你说该使哪个？」众人听了都点头称是。当下三军立下规矩，辎重全换成骆驼，那些笨重大车丢在营边，劈了当柴烧。"
 SUM_Neo_SGD.165.a:"以动员令起兵"
 SUM_Neo_SGD.165.b:"以盟约召集部族"
 SUM_SGD_WAR_Oasis_Hop:"践洲而前"
 SUM_SGD_WAR_Oasis_Hop_desc:"沿着绿洲一座座地跳。每跳一步，补给就近一分，雨林的地图便少一块。队伍从这片绿洲到那片绿洲，走走停停，稳扎稳打。每一处泉边，都留着接应的专人。"
 SUM_Neo_SGD.166.t:"践洲而前"
 SUM_Neo_SGD.166.d:"一个跑沙路的老向导给大军出了个主意：别一口气扎太深，沿着绿洲一处一处往前跳。啥叫跳？夺下一片绿洲，就把营盘往前挪一程，再去夺下一片，步步为营。每挪一步，后方的粮草水源就近一分，前头的补给就跟上一分，雨林手里的地图就少一块。法子看着慢，其实稳。三军依计，今天奔这眼泉拔营，明天朝那片棕榈林开拔；每占一处就掘井、筑垒、屯粮，把它变成自己的落脚地。雨林测绘队辛苦画了多年的边图，被这么一跳一跳啃得支离破碎。沿途的绿洲，有的还住着人家，有的只剩几棵枯棕榈，掌事的一概叫扎营，掘井的掘井，垒墙的垒墙，一处也不空过。 新扎的营盘升起炊烟，一缕缕散在暮色里，绿洲上头第一次飘起这样的烟。"
 SUM_Neo_SGD.166.a:"直取雨林关隘"
 SUM_Neo_SGD.166.b:"先断其商路"
 SUM_SGD_WAR_Guide_Sand:"引途之叟"
 SUM_SGD_WAR_Guide_Sand_desc:"驼背上的向导一眼就能分出哪片沙地有坑、哪处能取水。这片地界连雨林测绘队都没画进图里，路是早年逃荒的百姓踩出来的。他拍着驼脖子笑：「闭着眼我都能走。」"
 SUM_Neo_SGD.167.t:"引途之叟"
 SUM_Neo_SGD.167.d:"向导拍着胸口说，这片大沙海的路他认得。众人疑惑得紧：雨林测绘队年年在这儿画图，还有大把地方没标出来，你一个向导凭啥认得？向导笑而不答，只招手叫跟上。原来这条小道根本不是官修驿路，是几百年前逃荒的灾民为求活命，赶着骆驼一处水源一处水源硬踩出来的。那些人早化成沙了，可踩出的脚迹被风沙埋了又露、露了又埋，偏留下这么条隐秘通路。这向导的祖上正是逃荒队伍里的人，认路的本事就这么一代代口传下来。众人跟着走，果然走一段就见一眼泉，连关卡都松。向导还讲，逃荒人怕迷路，每隔一程就在沙里埋只空水囊当路标，那些水囊到今天还埋着，每一处他都认得。夕阳把驼影拖得老长，一队人无声地往前赶。 沙脊上夕阳西坠，驼影拖得老长，一队人闷头跟着向导走。 向导忽然停脚，扒开一丛枯草，底下果然压着半只烂水囊，众人才服了。"
 SUM_Neo_SGD.167.a:"把话说给雨林人听"
 SUM_Neo_SGD.167.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Storm_Pass:"攻坚破隘"
 SUM_SGD_WAR_Storm_Pass_desc:"关隘立在雨林边上，是雨林伸进沙漠的一只手。这只手，得先砍断。关隘高耸，墙厚壕深，着实难攻。众军议定，先拿它开刀。关里的守军也知这一日难过，日夜提防。"
 SUM_Neo_SGD.168.t:"攻坚破隘"
 SUM_Neo_SGD.168.d:"沙漠和雨林交界的地方，杵着一座雄关，正正卡在沙漠边上。打个比方，这是雨林伸过来的一只手，死死掐着沙漠的脖子；这只手一天不断，驼队就一天别想安稳往来。军里议论着要打通东西，先得拔了这颗钉子。众将各出主意，有说绕道的，有说求和的，唯有个上了年纪的车骑都尉冷笑：「绕道躲得过今日躲不过明天，求和是与虎谋皮。倒不如硬砍断这只手。」大伙听了都点头。于是挑精兵、备器械，直奔这关而去。原来过了这关往东，便是平展展的河渠与平原，粮草人马都能放开走；不先拿下来，往后寸步难行。 关城的阴影落在沙地上，老远望去，像一头蹲伏的猛兽。"
 SUM_Neo_SGD.168.a:"倾全境之力"
 SUM_Neo_SGD.168.b:"留一支后手"
 SUM_SGD_WAR_Siege_Engine:"斫造攻具"
 SUM_SGD_WAR_Siege_Engine_desc:"照遗迹里的图样，造了几架抛石机与撞锤。家伙笨重，可关隘不怕云梯，偏怕这等重器。抛石机一声响，巨石飞过墙头，砸得守军抱头鼠窜。有分教：笨物虽钝，专破坚城。"
 SUM_Neo_SGD.169.t:"斫造攻具"
 SUM_Neo_SGD.169.d:"军里要攻关，却缺攻城的大家伙。正一筹莫展，有个士兵从一处古遗迹里翻出一卷残图，画的分明是抛石机和撞锤的样式。匠人们凑上来照猫画虎，连夜赶造了几架。造出来果然笨得可以：一架抛石机得十来号人才推得动，撞锤沉得像座小山，行军时慢吞吞落在最后，有人直摇头，说这玩意儿怕是不顶用。哪知攻坚那天，雨林守军仗着墙高壁厚，只防云梯爬城，哪想到抛石机从远处飞来巨石，又哪想到撞锤一下一下砸城门。笨是笨，可这关偏偏不怕云梯，怕的就是这笨家伙。匠人当下又赶造许多，长枪大戟似的堆在营里，专等攻城那天用。有个识货的老卒摸着撞锤连声叫好。 那撞锤黑沉沉地卧在营里，孩子们好奇，凑上去摸一把，被匠人笑着轰开。 撞锤黑沉沉地卧在营里，几个胆大的孩子凑上去摸，被匠人笑着挥手轰开。 夜里匠人打铁，砧声叮当，惊起了营边树上栖息的乌鸦，扑棱棱飞了一片。 老卒说，这笨东西看着憨，砸起城门来却顶十个云梯。"
 SUM_Neo_SGD.169.a:"以动员令起兵"
 SUM_Neo_SGD.169.b:"以盟约召集部族"
 SUM_SGD_WAR_Cut_Water:"决其沟渠"
 SUM_SGD_WAR_Cut_Water_desc:"城里的守军明明守着水，却打不上来，原来上游那条渠被人挖断了。渠水一断，眼前只剩干涸的河床，渠底的烂泥晒得一块块龟裂。守兵站在城头干望着，一点办法也没有，军心于是散了。撑不了几日，这城就守不住了。"
 SUM_Neo_SGD.170.t:"断流困敌"
 SUM_Neo_SGD.170.d:"这关依山傍水，旁边一条渠从上游引水下来，专供关里守军吃喝。军里有个懂水利的谋士瞄了一眼就说：攻关不用硬冲，把上游那条渠掘断就成。众人将信将疑，照计趁夜摸到上游，挥锹挖断了渠堤。一夜工夫，渠水全渗进沙地；关里守军起先没在意，到第二天取水的地方一滴也流不出来，才慌了手脚。沙漠里头，粮草还能凑合，没水可熬不了几天。守军就算仓里存着水，可眼看着断流的干渠，心里先乱了，料定这城守不长久，军心顿时散了大半。谋士又说：掘了渠再在上游堆道沙坝，万一守军想挖开旧道，也叫他白忙。众人依言，一夜之间把那条渠改得认不出来了。"
 SUM_Neo_SGD.170.a:"直取雨林关隘"
 SUM_Neo_SGD.170.b:"先断其商路"
 SUM_SGD_WAR_Ladder_Night:"宵犯关垣"
 SUM_SGD_WAR_Ladder_Night_desc:"选最灵便的人攀墙。攀上去的，活着的不到一半，墙上的灯火却在是夜灭了。云梯一架接一架靠上城墙，喊杀声震天。天亮时，城头已换了守旗的人。"
 SUM_Neo_SGD.171.t:"宵犯关垣"
 SUM_Neo_SGD.171.d:"攻城略地，本来就是拿人命去填的，到这儿可不能心软。攻关那夜，军中挑出一队最利索的人，个个身轻似燕，专管攀墙。他们腰系绳索，趁着黑影，一个接一个往高墙上爬。墙头灯火通明，守军箭如雨下，爬上去的纷纷中箭栽下来，摔在墙根，活着登上墙头的不到一半。剩下那一半到底上了墙，不声不响摸到点灯处，一刀结果守灯兵，把墙上的灯一盏盏掐灭。那一夜，原本亮如白昼的关墙，灯火竟全熄了。灯一灭，黑影里再分不清敌我，城门也趁乱被撬开。爬上墙的健卒又摸到箭囊、滚木，一股脑推下墙去，墙上顿时乱作一团，守军的号令都喊不出来了。"
 SUM_Neo_SGD.171.a:"把话说给雨林人听"
 SUM_Neo_SGD.171.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Occupy_Pass:"凭关死拒"
 SUM_SGD_WAR_Occupy_Pass_desc:"关隘易手之后，并不推倒，改成了自己的戍所。门朝哪边开，从此由沙漠说了算。城头换上了沙漠的旗，守卒来往巡查。过往商队见了新旗，赶紧改口称颂。"
 SUM_Neo_SGD.172.t:"凭关死拒"
 SUM_Neo_SGD.172.d:"主将没听那将吏的话。关隘一拿下，沙漠兵站上城头，有人来报，说这墙又高又厚，留着是后患，不如烧了推平，免得雨林回头来抢。主将摆手：「且慢，拆了可惜。」这关正扼着东西咽喉，地势好得没法说；拆了剩一堆荒土，留下改成自家戍所才划算。他当即传令：关里的旗号换掉，守门的兵换掉，连城门朝哪边开都重新定章程。有老人感慨，早先这关是雨林探进来的一只手，如今这手被沙漠剁下，接到自己身上，往后门朝哪开，沙漠说了算。又派人贴出告示，晓谕关内百姓：沙漠入境秋毫无犯，安分过日子的免粮一年。新旗升上城头，被风展开猎猎响，关下百姓远远望着，谁也没敢先出声。"
 SUM_Neo_SGD.172.a:"倾全境之力"
 SUM_Neo_SGD.172.b:"留一支后手"
 SUM_SGD_WAR_Sand_Mission:"诱叛沙戍"
 SUM_SGD_WAR_Sand_Mission_desc:"雨林派来的说客声音放得极软，开口只问了一句：「你拿饷是为哪家卖命？」这一下正戳在心窝上，听的人心里翻江倒海，好些个默默把头垂了下去。原来雨林在沙漠的兵马，十之七八都是当地人。"
 SUM_Neo_SGD.173.t:"诱叛沙戍"
 SUM_Neo_SGD.173.d:"「你到底是替谁卖命？」一句话，问得营里好些人抬不起头。雨林在沙漠地界驻兵，可掰指头一数，大半竟是本地人。沙漠这边派了个巧舌如簧的扮成货郎混进营，身上没带刀枪，碰见兵卒就抛这一句。这些本地人祖辈住沙漠，吃沙里的粮、喝沙里的水，眼下却穿着雨林的号衣替雨林守自家的关，说到底，是给外人看门。头一回问，还有人梗着脖子回「当兵吃粮天经地义」；可问得多了，不少人就默默低下头，心里翻来覆去琢磨自己到底为谁扛枪。营里议论开了，军心就散了。那货郎又追一句：「替雨林守一个月关，能领几文摩拉？」众人掰指头一算，竟比沙漠开的少一大截，心里越发不是味。帐外风沙抽打着篷布，啪啪响，那几个低头的兵卒指甲都掐进掌心。"
 SUM_Neo_SGD.173.a:"以动员令起兵"
 SUM_Neo_SGD.173.b:"以盟约召集部族"
 SUM_SGD_WAR_Rain_People:"通款林坞"
 SUM_SGD_WAR_Rain_People_desc:"雨林的村社也在交重税，也在被征兵。派去的人不带兵器，只带账本给对面看。那账本上一笔笔，处处与沙漠一般苦。对面的人看了，默然良久。"
 SUM_Neo_SGD.174.t:"通款林坞"
 SUM_Neo_SGD.174.d:"领头那人把刀枪都留在了营里，只揣一本账去雨林村社。随行的人不解，他说这回去是讲理，不是打架。到了村社，他把账本往头人面前一摊，上头一笔笔全是雨林村社交的重税，还有被拉走的丁壮名册。那头人起先还嘴硬，说雨林治下人人安乐，哪有这等事。领头人不跟他吵，只把账本往前推了推：「你自己看，这税一年重过一年，这丁一户抽过一户，你们村的后生如今还剩几个？」头人翻着账本，脸上一阵红一阵白，半天吭不出声。敢情雨林的村社一样在受这份罪。领头的又道，沙漠跟他们一样是被雨林盘剥的苦人，何必替人卖命。众人听了连连点头，都觉这话说到心窝里。屋里静得只剩纸页翻动的声，头人捧账本的手直抖。"
 SUM_Neo_SGD.174.a:"直取雨林关隘"
 SUM_Neo_SGD.174.b:"先断其商路"
 SUM_SGD_WAR_Promise_Amnesty:"下宽大之诏"
 SUM_SGD_WAR_Promise_Amnesty_desc:"「早知如此，何必死战。」有人叹道。凡来归降的，旧账一概不究：想留下的分给田地，想走的发足口粮。这条法子，比刀剑还好使。归降的人拖家带口而来，放下兵刃领了田契，一个个欢天喜地。"
 SUM_Neo_SGD.175.t:"勿问前愆"
 SUM_Neo_SGD.175.d:"沙漠定了条规矩，真够厉害：凡从雨林过来归降的，旧账一笔勾销。你从前替雨林打过仗、守过关，一概不追究，只问你现在愿不愿留。愿留的分块田让你踏实种；愿走的发够口粮，爱投哪儿投哪儿，绝不为难。有个久在军中、手上沾过血的将校，本以为投降必被治罪，吓得整夜合不上眼；谁知过来后主将连句重话都没有，反手赏了块好地。这人感激得掉泪，见人就夸沙漠的好。这条安民的章程，比雪亮的刀还好使，好多城池没打就降了。消息传开，远近来投的络绎不绝，有拖家带口的，主将都吩咐地方官妥帖安置，连住处口粮都给备得齐齐整整。 那将校接过地契，手指哆嗦着，半晌才说出一句多谢。 那将校捧着地契，手指直哆嗦，半晌才挤出一句多谢。"
 SUM_Neo_SGD.175.a:"把话说给雨林人听"
 SUM_Neo_SGD.175.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Bribe_Clerk:"赂结文吏"
 SUM_SGD_WAR_Bribe_Clerk_desc:"书吏接过钱，手微微一抖，随即揣进袖筒，笔尖一转，名字就挪到了另一行。雨林的关卡靠书吏记档，来往的人他都认得，银钱一递过去，那档便换了一份。"
 SUM_Neo_SGD.176.t:"赂结文吏"
 SUM_Neo_SGD.176.d:"雨林关卡守得严，靠的是书吏记档这一手。关棚底下，书吏执笔坐着，来往行人姓甚名谁、打哪儿来、往哪儿去，都得一一登册。这人认得每一个过路的，谁脸上有疤、谁说话带什么腔，都记在心里，想蒙混过关难上加难。可世上没有钻不通的缝。沙漠这边摸清了路数，趁夜深人静把一封银钱悄悄塞进书吏手里。那书吏先是一愣，随即眯眼一笑，提笔另写一份档册，把要紧的名目全改了。一份假档，就放一行人安然过关。不过一封银钱，便换来一队人马平安通过，省了多少刀兵。书吏收了钱，照旧坐在关棚底下，脸上一点异样也瞧不出。 关棚外的风卷着沙粒，打在书吏的纸页上，沙沙作响，他却头也不抬。 关棚外的风卷着沙粒打在纸页上，沙沙作响，书吏却头也不抬。 那书吏假装咳嗽一声，把假档册递出去，手心里全是汗。 那行人牵着骆驼，头也不回地没入夜色。"
 SUM_Neo_SGD.176.a:"倾全境之力"
 SUM_Neo_SGD.176.b:"留一支后手"
 SUM_SGD_WAR_Whisper_Back:"行反间计"
 SUM_SGD_WAR_Whisper_Back_desc:"把假消息透给雨林的斥候，让他们把话说给自己人听。兵不血刃的事，多半靠这个。斥候得了假信，如获至宝，飞奔回去禀报。有分教：借敌之口，乱敌之心。"
 SUM_Neo_SGD.177.t:"醴肉豢谍"
 SUM_Neo_SGD.177.d:"两军对垒，动刀子是战，还有一样不动血的手段更高明。沙漠这边拿住雨林一个斥候，不杀，反倒好酒好肉款待，临了还故意透几句假话进他耳朵。透的什么？无非是某处粮草快完了、某位将领打算倒戈之类。斥候得了信如捡着宝贝，连夜赶回，一五一十学给自家听。话出自自家斥候之口，雨林那边哪能不信？于是疑疑惑惑，调度上瞻前顾后，白白误了战机。这就是兵不血刃的招数，不费一兵一卒，凭一张嘴一条计，就教敌人自己乱了阵脚。那斥候回报后，雨林将官果然上当，把兵马从要道上调走；等回过味来，关卡早换了旗号，懊悔也来不及了。 那斥候酒足饭饱，抹着嘴千恩万谢，哪里知道自己带回去的是催命的话。 斥候酒足饭饱抹着嘴道谢，哪里晓得自己捎回去的是句催命话。"
 SUM_Neo_SGD.177.a:"以动员令起兵"
 SUM_Neo_SGD.177.b:"以盟约召集部族"
 SUM_SGD_WAR_Supply_Chain:"军装络绎"
 SUM_SGD_WAR_Supply_Chain_desc:"辎重线沿商路铺开，一站接一站。前线吃什么，看后面这条线顺不顺。粮车一辆接一辆，昼夜兼程，押粮的兵来回奔走不敢停歇。哪一环断了，前线便要饿肚子。"
 SUM_Neo_SGD.178.t:"站站积粮"
 SUM_Neo_SGD.178.d:"大军在前头拼命，后面那条运粮线才是真命根子。沙漠把补给沿着古老商路一站站铺开，每站都设粮仓、水窖，囤足粮草。这商路本是驼队走熟了的，有井有驿有歇脚处，拿来运军需正合适。早先从这一站到下一站要好几天，如今隔一段就设个中转，兵卒接力倒腾，粮草便一车车往前推。前线将士每天吃啥穿啥，全指望这条线通顺；线一断，前头就算有猛将也得饿肚子。所以主将反复叮嘱，护粮的兵比冲阵的还要紧。掌事的又定下章程，每站留足三天的存粮，哪怕碰上沙暴阻隔，前线也不至于断顿。押运的兵卒昼夜在商路上奔走不停。 驿站门口的灯一盏接一盏亮起来，像给这条补给线缀上了一串珠子。 驿站门口的灯一盏接一盏亮起来，像给这条补给线缀了一串珠子。"
 SUM_Neo_SGD.178.a:"直取雨林关隘"
 SUM_Neo_SGD.178.b:"先断其商路"
 SUM_SGD_WAR_Water_Wagons:"车运甘泉"
 SUM_SGD_WAR_Water_Wagons_desc:"沙漠作战，水比粮要紧。运水的车队昼夜不停，车夫换人不换车。一辆辆水车在沙道上吱呀前行，革囊里的水一路晃荡。车夫们眼睛熬得通红，也舍不得停。"
 SUM_Neo_SGD.179.t:"车运甘泉"
 SUM_Neo_SGD.179.d:"沙漠打仗跟别处不同，头一桩是水比粮金贵。人在沙海里走，渴上三天就得倒，饿几天倒还能撑。所以沙漠这边运水的车马昼夜不停，白天怕太阳晒，就趁夜里赶路，月亮底下一串水车吱吱呀呀往前挪。拉车的牲口受不了这般折腾，跑久了要趴窝，押运官想了个辙：车夫可以换班歇息，运水的车却一刻不停，人歇车不歇。就这么一车车水从后方绿洲源源送上前线。有了水，沙漠里的兵才立得住脚。水车上的皮囊都是生牛皮缝的，不渗不漏，日头也晒不透；押运兵还不时往上浇水，怕皮子干裂，伺候得无微不至。 月色下，皮囊里的水随着车轮轻轻晃荡，发出沉闷的响声。 月色底下，皮囊里的水随车轮轻轻晃荡，发出闷闷的响声。"
 SUM_Neo_SGD.179.a:"把话说给雨林人听"
 SUM_Neo_SGD.179.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Field_Hospital:"阵前置医"
 SUM_SGD_WAR_Field_Hospital_desc:"医帐随军而走。能就地治的就地治，治不了的往后送。能救回来的，比往年多了。医者昼夜忙着包扎，草药的苦味弥漫帐中。伤兵们咬着布条，任凭处置，一声不吭。"
 SUM_Neo_SGD.180.t:"阵前置医"
 SUM_Neo_SGD.180.d:"伤卒抬进帐，先不看官大官小，只看伤重不重。沙漠这边打算得早：医帐跟着大军一路走，郎中、药材、担架样样齐全。受了伤的，能就地治就在帐里敷药包扎，治好了赶紧归队；伤得太重挪不动的，用担架、驼车往后送，到大营里慢慢养。往年打仗，多少伤卒没人管，倒在沙里再没爬起来；如今有了随军医帐，救活的比从前多得多。军里见主将这般体恤，都说跟着这样的主帅死了也值，打起来格外猛。帐外担架排成一溜，血滴在沙上，转眼被吸干，只留下星星点点的暗痕。军中还立了规矩：进帐的伤卒不问官职，一律按伤势轻重治，先重后轻，谁也别想插队。众人见了，都夸主帅公道。 医帐里药气浓得呛人，郎中俯身忙碌，额上的汗顺着下巴滴到沙土里。"
 SUM_Neo_SGD.180.a:"倾全境之力"
 SUM_Neo_SGD.180.b:"留一支后手"
 SUM_SGD_WAR_Forge_Camp:"军携冶作"
 SUM_SGD_WAR_Forge_Camp_desc:"随军的铁作坊，专修兵器、打马掌，缺什么现造什么。炉火昼夜不熄，锤声叮当，火星四溅。有断了刃的刀，顷刻便重新锻好。火星溅到匠人脸上，他也毫不在意。"
 SUM_Neo_SGD.181.t:"军携冶作"
 SUM_Neo_SGD.181.d:"洪炉的火光那夜把半边天都烧红了。远征在外，兵器最费：刀砍卷刃、枪折了杆、马掌磨穿，若都送回后方修，一来一回仗早打完了。沙漠这边特地备了座随军铁作坊，几座炉子几把锤跟着大军走。匠人黑白连轴转，哪件兵器坏了就地修，哪匹马掉了掌立刻打个新的钉上。军里最怕缺东西现造不出，有了这作坊，缺啥造啥，刀钝了磨、枪断了打，便利得很。那晚匠人打了一宿马掌，天亮时刚好赶上大队开拔。铁匠里有几个是赤王旧地的手艺人，本事极高，经他们手做出的兵器锋利耐用，军里都抢着要。铁砧上火星四溅，匠人古铜色的脸被炉火映得发亮，汗珠一落进火里就滋地一声。"
 SUM_Neo_SGD.181.a:"以动员令起兵"
 SUM_Neo_SGD.181.b:"以盟约召集部族"
 SUM_SGD_WAR_Tax_Rear:"催征后方"
 SUM_SGD_WAR_Tax_Rear_desc:"后方的税照收不误，只是名目换成了捐输。捐输的人，指望打胜了能抵税。税吏照旧上门，百姓嘴里抱怨，手里还是把钱掏了出来。那名目换得勤，钱却一分没少。"
 SUM_Neo_SGD.182.t:"催征后方"
 SUM_Neo_SGD.182.d:"远征花钱如流水，后方的钱粮照收不误，只是这回换了个名头：不叫纳税，叫捐输。沙漠百姓最厌官府催税，一听收税二字眉头就拧成疙瘩；改叫捐输，听着像自愿报效，脸上有光，心里也顺气。捐了粮钱的都盼着，等这仗打赢、新朝建立，今日的捐输就能抵日后的赋税，连本带利都有个说法。于是交钱的反倒比往常积极，官府也乐意换这名目，把钱粮收得满当当。有个厚道老农，把家里最后一袋摩拉也捐了，说只要打胜仗，子孙就不用再看雨林的脸色。掌事的听了，还亲自过去宽慰几句。 那老农把钱袋攥了又攥，最后狠狠心递出去，转身时眼圈红了。 那老农把钱袋攥了又攥，末了狠心递出去，转身时眼圈红红的。 掌事的拍了拍老农的肩，劝他回去，说好日子在后头，老农点点头，大步走了。"
 SUM_Neo_SGD.182.a:"直取雨林关隘"
 SUM_Neo_SGD.182.b:"先断其商路"
 SUM_SGD_WAR_Last_Storm:"终风大作"
 SUM_SGD_WAR_Last_Storm_desc:"总攻选在换季的第一场大风。风一起，天与地分不清，正好掩兵。狂风卷沙，三军人马借势掩杀过去，只等一声令下便冲了上去。有分教：天时在我，风助军威。"
 SUM_Neo_SGD.183.t:"终风大作"
 SUM_Neo_SGD.183.d:"「再等一场大风。」众人急着催总攻，主将偏不下令，只抬手指向天边。原来沙漠换季常起大风，风一起飞沙走石，天地搅作一团，十步外瞧不见人。主将要的就是这个空档：大军借风沙遮掩，悄悄摸到敌阵跟前，对方还没看清来了多少人，刀已架到脖子上。他还预先安排人在风沙里点起烟火当信号，各路兵马一见烟火，便知时机到了，一齐冲杀。果然不多久狂风骤起，黄沙蔽日，天地混成一个颜色。主将令旗一挥，三军乘风掩杀过去，打了个敌人措手不及。士卒们屏住呼吸，攥紧刀枪，单等令旗一落。"
 SUM_Neo_SGD.183.a:"把话说给雨林人听"
 SUM_Neo_SGD.183.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Break_Line:"一谋溃敌"
 SUM_SGD_WAR_Break_Line_desc:"驼骑像一堵墙压将过去，敌阵一乱，两翼的游骑便趁势插进，马蹄声起，再也收拾不住。最硬的驼骑压在正面，等对方阵脚一动，两翼骑兵就插进去。那一鼓作气的狠劲，敌人哪里挡得住。"
 SUM_Neo_SGD.184.t:"驼旅当锋"
 SUM_Neo_SGD.184.d:"正面那队驼骑，是主将手里的硬牌。总攻那天他把最精锐、最能扛的一支摆在当头，让它直压敌人中军。这驼骑人高马大冲起来没法挡，摆正面一是把敌人阵脚钉住，二是把敌人的眼神都拽到正面来。果然两军一接手，敌人就把老本压向正面，阵形跟着动；主将等的正是这一下。他藏在两翼的游骑见敌人阵势一乱，立刻从旁边斜刺进去，像两把尖刀直戳软肋。正面顶得死，两翼包得快，敌人头尾照应不上，眨眼就乱成一团。驼骑披着厚甲，刀砍不进，冲起来活像一堵铁墙；两翼游骑却轻装简从，专抄人后路，一慢一快配得严丝合缝。驼蹄踏起的黄土遮天蔽日，两翼的游骑早没进烟尘里了。"
 SUM_Neo_SGD.184.a:"倾全境之力"
 SUM_Neo_SGD.184.b:"留一支后手"
 SUM_SGD_WAR_Rain_Palace:"远眺净善宫"
 SUM_SGD_WAR_Rain_Palace_desc:"从雨林的高处往下望，能望见须弥城里的尖塔。走了这么远，为的就是那几座塔。尖塔在日光下闪闪发亮，众人望着都不言语，只暗暗握紧了刀。有分教：千里奔波，只为一塔。"
 SUM_Neo_SGD.185.t:"远眺净善宫"
 SUM_Neo_SGD.185.d:"林海尽头那几座塔的影子，是老卒先瞧见的。大军翻过高山进雨林，一个兵卒登上高地远望，忽然嚷：「列位快瞧，那远处隐隐的，莫不是须弥城的尖塔？」众人顺手看去，果然在绿得发暗的林梢上头立着几座高塔，阳光一照亮闪闪的。从沙漠一路杀到雨林，多少沙海、多少关隘、多少场血战都过来了，到头来奔的就是这几座塔。塔底下是教令院，是大贤者阿扎尔发号施令的所在，也是小吉祥草王被囚的净善宫。将士们望着塔，心里明白最硬的仗还在后头。有年轻士卒指着塔尖打趣，说等拿下须弥城，非进去量量那教令院的高塔究竟多高；旁边老卒却摇头，说塔底下关着的，是小吉祥草王。风穿过林梢，带着湿漉漉的草叶味，几员老兵忍不住深深吸了一口，这气味跟沙漠的干风全然不同。"
 SUM_Neo_SGD.185.a:"以动员令起兵"
 SUM_Neo_SGD.185.b:"以盟约召集部族"
 SUM_SGD_WAR_Terms_Demand:"开口议约"
 SUM_SGD_WAR_Terms_Demand_desc:"兵临城下才提条件：撤军、减贡、还地、认沙漠独立。条条都是账上有的。使节捧着文书念，一条一条，理直气壮。念完把文书往案上一放，昂首等对方答话。"
 SUM_Neo_SGD.186.t:"开口议约"
 SUM_Neo_SGD.186.d:"围城围到水泄不通，沙漠这边才慢悠悠摊开条件，一条条都不新鲜：雨林的兵撤出沙漠，压了多年的重贡减下来，占去的绿洲关隘还回来，还有承认沙漠自成一国、不再听雨林节制。哪是临时张嘴讹人？每一条后头都记着账，都是沙漠这些年吞下的委屈、流过的血。主将遣人把条件送进城，话说得硬气：打了这许久，讨的就是这几桩。说到底，雨林这些年对沙漠征收没个边、驻军压着、占地不还、名分不给，如今新旧账一块算，一文也不肯让。使节捧着那单子，手微微发抖，额上的汗顺着鬓角往下淌。"
 SUM_Neo_SGD.186.a:"直取雨林关隘"
 SUM_Neo_SGD.186.b:"先断其商路"
 SUM_SGD_WAR_Sumeru_Day:"须弥启旦"
 SUM_SGD_WAR_Sumeru_Day_desc:"到了这一步，这一仗是打给雨林看的，也是打给沙漠自己看的。两军阵前，旌旗猎猎，鼓角齐鸣。这一仗的分量，不只是几座城池，更要让天下人知道沙漠的厉害。有分教：一战既胜，内外皆惊。"
 SUM_Neo_SGD.187.t:"须弥启旦"
 SUM_Neo_SGD.187.d:"主将的话说得沉：这一仗，打的哪里只是一座城。打到眼下这地步，一层是让雨林瞧的，让那帮素来把沙漠看轻的学者官儿明白，沙漠汉子不是任人宰的羊，也敢操刀争个名分；再一层是让沙漠自己瞧的，让各部各族明白，大伙儿心齐就能拧成绳，不再各顾各当散沙。所以军纪一遍遍强调：不扰民，不妄杀，得打出个体面的旗号。这一仗，争的是一口气，立的是一方志。主将又说：「咱们今日怎么干，后人都要议论；要是只会烧杀，跟雨林那帮官儿还有什么分别？」兵卒们听了，把那点想占便宜的心思都按了下去。号角声歇，四下里静得只剩旗面扑扑的响动。"
 SUM_Neo_SGD.187.a:"把话说给雨林人听"
 SUM_Neo_SGD.187.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Storm_the_Rainforest:"师次林下"
 SUM_SGD_WAR_Storm_the_Rainforest_desc:"沙漠的旗，插上了第一道雨林关隘。往东是平原与河渠，再往东是须弥城的高塔。教令院的使节连夜赶到阵前，说可以谈。阵前的人只回一句：「先谈撤军，再谈别的。」寸步不让。"
 SUM_Neo_SGD.188.t:"师次林下"
 SUM_Neo_SGD.188.d:"教令院的使节连夜赶到阵前，气都没喘匀，就说大贤者阿扎尔愿意谈，什么条件都好商量。主将立在关头，只回了他一句：「先谈撤军，再谈别的。」声音不高，却字字砸在地上。使节当场怔住，张了张嘴，到底没敢再提旁的。原来沙漠这边早把话撂死了：雨林的兵一天不撤出沙漠，其余的一概免开尊口。主将心里明白，雨林不撤，谈什么都是空话；只有先把兵退了，沙漠才算真正挺直腰杆。他当即命人把这话传回城里。旗是新插的，稳稳当当立在雨林伸进沙漠的头一道关上，关头风大，旗面猎猎，把他的影子在落日下拖得老长。向东一望，过了这关便是平展的原野、交错的河渠，再往东，须弥城的高塔隐隐在望。"
 SUM_Neo_SGD.188.a:"倾全境之力"
 SUM_Neo_SGD.188.b:"留一支后手"

 #### 决议 ####
 SUM_SGD_Govern:"邦治庶务"
 SUM_SGD_Govern_desc:"镀金沙漠设了政务决议组，专管内政与秩序。整肃官署，调和商团与神庙，安定绿洲民生，都归这里管。国家越稳，越撑得住日后的征战；仓促冒进，反倒动摇根基。根基稳固，方能图远。"
 SUM_SGD_Trade:"贸涂与泉"
 SUM_SGD_Trade_desc:"金子往哪儿流，沙漠的势力便在哪儿扎根。镀金沙漠设下商路决议组：控制沙海商道、征收通行税、同商队订立契约，件件都能充实国库。有分教：商路一通，府库自丰。"
 SUM_SGD_Faith:"赤王暨花神"
 SUM_SGD_Faith_desc:"镀金沙漠设了信仰决议组，围着赤王旧训与诸神祭祀办理。祭司的诉求，百姓的信念，都在这里。信仰越齐整，动员越有力，号令出得去，兵员征得来。祭司登高一呼，众人响应。"
 SUM_SGD_Army:"沙海治戎"
 SUM_SGD_Army_desc:"镀金沙漠设了军事决议组，整编佣兵，修缮要塞，操练沙海部队。沙漠的军队，靠的是纪律与后勤。这两样做扎实，方能守住绿洲与商道。有分教：兵甲既足，号令方行。"
 SUM_SGD_Crisis:"沙碛继馑"
 SUM_SGD_Crisis_desc:"镀金沙漠设了危机决议组，专管突发事变与内外威胁。沙漠之地，从来不缺风波。及时应对，方能保住多年家底，免得一场变故付诸东流。此组一立，遇上事便不至于措手不及。"
 SUM_SGD_Dec_Gov_Land:"厘正经界"
 SUM_SGD_Dec_Gov_Land_desc:"把官署名下的沙地重新造册。哪块归谁，四至几何，一笔一笔记清。书吏拿着卷尺丈量沙地，忙了整月。从今往后，谁占地谁纳粮，账上一清二楚，谁也别想多占一寸。有分教：沙地有册，争端便少。"
 SUM_SGD_Dec_Gov_Roll:"括户著籍"
 SUM_SGD_Dec_Gov_Roll_desc:"登记各城的人口与户数。哪家人几口，多大的孩子，都要报上。差役挨家敲门，一笔一笔填进册子。此后征丁派役，照着册子点名，再无人能藏丁漏报。"
 SUM_SGD_Dec_Gov_Judges:"行城咨政"
 SUM_SGD_Dec_Gov_Judges_desc:"派执事巡查各城的政务。谁办事不力，谁贪了钱，都要查个明白。执事带着随从，骑着驮兽走城过巷，宿在官驿，进门先封账房。官员们见了都恭恭敬敬，那些作威作福的也收敛不少。"
 SUM_SGD_Dec_Gov_Road:"葺其官涂"
 SUM_SGD_Dec_Gov_Road_desc:"把城与城之间的旧道补平。坑洼填土，断桥重架，商队走得顺畅。工匠们挥汗如雨，一段段修补。从前车马走一趟要颠三天，如今一日便到，商旅无不称便。"
 SUM_SGD_Dec_Gov_School:"创一学舍"
 SUM_SGD_Dec_Gov_School_desc:"在城邦里兴办学馆。请先生教孩子识字算数，将来好替官署办事。学馆里童声琅琅，先生拿着戒尺来回踱步。这些孩子读书识字，日后便是官署的后备人手。有分教：识字明理，疆方能治。"
 SUM_SGD_Dec_Trade_Toll:"置一榷所"
 SUM_SGD_Dec_Trade_Toll_desc:"在商路各口设卡收税。过往商队按货纳钱，少了不放行。税卡一处接一处，商队只好乖乖缴税。税款一车车入了库，国库日渐充盈，关卡却一处比一处气派。"
 SUM_SGD_Dec_Trade_Salt:"盐榷毋私"
 SUM_SGD_Dec_Trade_Salt_desc:"把盐场收归盟约经营。盐是家家户户少不得的，握住了盐，便握住了钱袋子。盐工们晒盐堆垛，白花花一片。百姓再贵也得买，这买卖稳当。有分教：盐铁之利，国之命脉。"
 SUM_SGD_Dec_Trade_Caravan:"招彼行商"
 SUM_SGD_Dec_Trade_Caravan_desc:"出资组织往外的商队。备好骆驼与货物，选老成的头目带队，往远邦去做买卖。商队浩浩荡荡出发，驼铃叮当。这一去少则数月多则一年，带的货换了金子回来，利市三倍。"
 SUM_SGD_Dec_Trade_Well:"掘井得甘"
 SUM_SGD_Dec_Trade_Well_desc:"在缺水处凿新井，安顿流民。井出了水，人便有了根，荒地也能成村落。井架立起，清水涌出，流民们欢呼。荒地上渐渐有了炊烟与人声，竟把这里当成了家。有分教：一口新井，养活一方。"
 SUM_SGD_Dec_Trade_Mint:"更铸一炉"
 SUM_SGD_Dec_Trade_Mint_desc:"开炉铸一枚成色足的沙漠钱。铜水浇进模子，冷却后便是一枚钱，钱文清晰，掂着沉甸甸。钱面上铸着沙漠的花纹，商人见了都放心使，从此买卖再不必称金论两。"
 SUM_SGD_Dec_Faith_Dig:"修治故墟"
 SUM_SGD_Dec_Faith_Dig_desc:"组织人手清理一处赤王遗迹。扒开黄沙，露出石阶与断柱。工匠们小心翼翼，屏着气息，生怕碰坏了什么。那些石阶断柱，默默述说着赤王的旧事。有分教：拂去千年沙，重见赤王踪。"
 SUM_SGD_Dec_Faith_Shrine:"设龛抚众"
 SUM_SGD_Dec_Faith_Shrine_desc:"给花神的信众立一处安身的龛。龛虽小，却有了烧香磕头的地方。信众们捧着花，恭恭敬敬摆上。每逢节庆，龛前便摆满鲜花与供品，香火不断。"
 SUM_SGD_Dec_Faith_Oath:"诸部重盟"
 SUM_SGD_Dec_Faith_Oath_desc:"召集长老，重立血的盟约。歃血为誓，谁背盟谁受罚。长老们围坐一圈，刀划破指头，血滴进酒里。那酒碗传了一圈，人人饮下便是一家人。有分教：血盟既立，生死相托。"
 SUM_SGD_Dec_Faith_Pilgrim:"护彼谒道"
 SUM_SGD_Dec_Faith_Pilgrim_desc:"沿遗迹之路设护队与井。朝圣的人路上有人护着，有水喝，便敢走这长路。护队骑驼巡行，井边排着长队。有了这两样，再远的路也有人敢走，香客一路念叨，倒也不觉辛苦。"
 SUM_SGD_Dec_Army_Levy:"调发乡兵"
 SUM_SGD_Dec_Army_Levy_desc:"向各部族征发一批民兵。每部落抽壮丁若干，自备刀弓，听候调遣。部族的人牵马而来，脸上涂着油彩。这些民兵召之即来，事毕便散，省了许多粮饷。有分教：各部出丁，合成一军。"
 SUM_SGD_Dec_Army_Hire:"募彼旅团"
 SUM_SGD_Dec_Army_Hire_desc:"以摩拉雇镀金旅团效力。这伙佣兵认钱不认人，钱到人手，刀便为你用。旅团的人接了钱，掂了掂，咧嘴一笑。这笔钱花得值，刀枪现成，本事现成，省了许多操练的事。"
 SUM_SGD_Dec_Army_Fort:"增戍筑垒"
 SUM_SGD_Dec_Army_Fort_desc:"在要道增筑戍所与望楼。高处筑楼便于瞭望，要道设所卡住咽喉。望楼一座座立起，远远便能望见。从此要道之上，一处有警处处皆知，再无偷过之人。有分教：楼高眼宽，所坚固守。"
 SUM_SGD_Dec_Army_Drill:"沙中演武"
 SUM_SGD_Dec_Army_Drill_desc:"按沙暴战术操演各路兵。趁着风起，练习隐蔽与突袭。风沙之中队伍忽散忽聚，一遍不成再来一遍，直到人人烂熟于心。风沙再大也乱不了阵脚，战时方能不慌。"
 SUM_SGD_Dec_Crisis_Storm:"发廪赈风"
 SUM_SGD_Dec_Crisis_Storm_desc:"开仓赈济被沙暴毁家的人。粮一袋袋发出去，帐篷一顶顶搭起来。灾民领了粮，含泪道谢。粥棚一搭，灾民便有了指望，一个个捧着碗称谢。有分教：仓中一粒，救命一命。"
 SUM_SGD_Dec_Crisis_Flood:"浚其故渠"
 SUM_SGD_Dec_Crisis_Flood_desc:"疏浚淤塞的旧渠，防春汛。把淤泥一筐筐挖出，渠水重新通畅。民夫挥锹不止，汗水顺着脸颊淌。两岸的田也保住了，百姓肩挑手抬忙了整月，如今总算能睡个安稳觉。"
 SUM_SGD_Dec_Crisis_Riot:"戡定喧乱"
 SUM_SGD_Dec_Crisis_Riot_desc:"用治安队平息城中的骚动。闹事的人被一个个按住，市集渐渐安静。治安队持棍而立，驱散围观的人。闹事的头目被押着游街示众，其余人见了，都缩着脖子不敢再闹。有分教：小乱早平，免成大祸。"
 SUM_Neo_SGD_Mechanism:"众械齐作"
 SUM_Neo_SGD_Mechanism_desc:"这块面板只供看，不许点。它按黛斯赫雷特与埃雷米特两条轴的数值，显示镀金沙漠眼下的等级，并将该档的国家修正一一列出。百姓随时可瞧，好掂量下一步往哪条轴上使劲。轴值一变，面板即时刷新，不劳手动。"
 SUM_Neo_SGD_T1_View:"赤王遗烈"
 SUM_Neo_SGD_T1_View_desc:"稳定度 -10%、战争支持度 -5%"
