# 结盟获得千岩军
#####################

 LYY_Event_infantry.1.t:"结盟千岩"
 LYY_Event_infantry.1.d:"璃月与贵邦缔盟已久，谊若金兰，共守河山。今闻贵邦欲训千岩军，以固疆防。我邦千岩军，承岩神遗泽，习磐石战法，结阵如嶽，攻坚若霆；其教头皆百战精锐，深谙岩元素驭使之术，可化兵卒为铁壁，赋散勇以雄魂。 兹为彰盟友之诚，特请暂租教头108人，赴贵邦执教。彼等携《千岩秘典》一卷，内含阵图演变、岩铠铸炼之法，可助贵军速成精锐。"
 LYY_Event_infantry.1.a:"好极，我可以称帝了！"

