 SOV_uncertain_counter_revolution_idea:0 "不確かな反革命"
 SOV_understaffed_bureaucracy:0 "人員不足の官僚機構"
 SOV_understaffed_bureaucracy_desc:0 "NKVDは行政内部の大規模な陰謀の証拠を発見し、何人かの官僚が役職から解任された。"
