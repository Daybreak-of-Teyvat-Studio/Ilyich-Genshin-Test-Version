 SUM_Neo_SDH.117.b:"让官署的法度作证"
 SUM_SDH_RB_Curfew:"宵禁"
 SUM_SDH_RB_Curfew_desc:"入夜宵禁，街上只有巡逻的人。夜里安静了，白天的话也少了。"
 SUM_Neo_SDH.118.t:"宵禁"
 SUM_Neo_SDH.118.d:"入夜宵禁，街上只有巡逻的人。夜里安静了，白天的话也少了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SDH.118.a:"与雨林互通有无"
 SUM_Neo_SDH.118.b:"与雨林划清界限"
 SUM_SDH_RB_Propaganda:"宣谕"
 SUM_SDH_RB_Propaganda_desc:"把雨林欠沙漠的账编成歌，在集市上唱，在各城之间传。"
 SUM_Neo_SDH.119.t:"宣谕"
 SUM_Neo_SDH.119.d:"把雨林欠沙漠的账编成歌，在集市上唱，在各城之间传。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SDH.119.a:"把土地分给部族"
 SUM_Neo_SDH.119.b:"把土地归入官仓"
 SUM_SDH_RB_Tribunal:"军法处"
 SUM_SDH_RB_Tribunal_desc:"设军法处，临阵脱逃者就地正法。判决之后要当众宣布。"
 SUM_Neo_SDH.120.t:"军法处"
 SUM_Neo_SDH.120.d:"设军法处，临阵脱逃者就地正法。判决之后要当众宣布。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SDH.120.a:"推举公议的执事"
 SUM_Neo_SDH.120.b:"沿用旧日的长老"
 SUM_SDH_RB_Mobilize_All:"全国动员"
 SUM_SDH_RB_Mobilize_All_desc:"全国动员令一下，能拿兵器的人都上了名册。"
 SUM_Neo_SDH.121.t:"全国动员"
 SUM_Neo_SDH.121.d:"全国动员令一下，能拿兵器的人都上了名册。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SDH.121.a:"让花神的誓约作证"
 SUM_Neo_SDH.121.b:"让官署的法度作证"
 SUM_SDH_RB_Iron_Storm:"铁与沙之世"
 SUM_SDH_RB_Iron_Storm_desc:"哈德拉玛维特的兵不再散在各部，是按号驻在固定的营里。风起了照操，风停了照练。沙漠第一次有了这样一支在风里不散的军，也有了这样一张排得密密的号册。"
 SUM_Neo_SDH.122.t:"铁与沙之世"
 SUM_Neo_SDH.122.d:"哈德拉玛维特的兵不再散在各部，是按号驻在固定的营里。风起了照操，风停了照练。沙漠第一次有了这样一支在风里不散的军，也有了这样一张排得密密的号册。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SDH.122.a:"与雨林互通有无"
 SUM_Neo_SDH.122.b:"与雨林划清界限"
 SUM_SDH_RB_Sand_Commune:"沙地公产"
 SUM_SDH_RB_Sand_Commune_desc:"哈德拉玛维特的地分回了各部，水按口分，粮按荒年共放。主母厅对面立起了公议庭，两座厅隔着一条街对着，来往的人先去哪一座，看当天的日头。"
 SUM_Neo_SDH.123.t:"沙地公产"
 SUM_Neo_SDH.123.d:"哈德拉玛维特的地分回了各部，水按口分，粮按荒年共放。主母厅对面立起了公议庭，两座厅隔着一条街对着，来往的人先去哪一座，看当天的日头。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SDH.123.a:"把土地分给部族"
 SUM_Neo_SDH.123.b:"把土地归入官仓"

 #### 丙线 · 绿洲自治 ####
 SUM_SDH_RC_The_Oasis_Parliament:"绿洲议政"
 SUM_SDH_RC_The_Oasis_Parliament_desc:"第三条路既不要神权也不要军国，只求把哈德拉玛维特的几处绿洲经营成能自己过日子的地方：议政、通商、立律、养民，对外只求一件事，别来管。"
 SUM_Neo_SDH.124.t:"绿洲议政"
 SUM_Neo_SDH.124.d:"第三条路既不要神权也不要军国，只求把哈德拉玛维特的几处绿洲经营成能自己过日子的地方：议政、通商、立律、养民，对外只求一件事，别来管。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH.124.a:"重立赤王的旧制"
 SUM_Neo_SDH.124.b:"重建城邦的议会"
 SUM_SDH_RC_Oasis_Charter:"绿洲宪章"
 SUM_SDH_RC_Oasis_Charter_desc:"每处绿洲立一份宪章，写明公事由谁议、谁办、谁查。"
 SUM_Neo_SDH.125.t:"绿洲宪章"
 SUM_Neo_SDH.125.d:"每处绿洲立一份宪章，写明公事由谁议、谁办、谁查。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SDH.125.a:"召集能战之众"
 SUM_Neo_SDH.125.b:"召集能谋之士"
 SUM_SDH_RC_Council_Oasis:"绿洲议事"
 SUM_SDH_RC_Council_Oasis_desc:"各处绿洲推代表到一处议事，议期一月，议完各回各家。"
 SUM_Neo_SDH.126.t:"绿洲议事"
 SUM_Neo_SDH.126.d:"各处绿洲推代表到一处议事，议期一月，议完各回各家。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SDH.126.a:"以神权号令沙漠"
 SUM_Neo_SDH.126.b:"以律法约束诸城"
 SUM_SDH_RC_Elder_Elect:"公推长老"
 SUM_SDH_RC_Elder_Elect_desc:"长老不再世袭，由绿洲上的住户公推，任期三年。"
 SUM_Neo_SDH.127.t:"公推长老"
 SUM_Neo_SDH.127.d:"长老不再世袭，由绿洲上的住户公推，任期三年。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SDH.127.a:"把遗迹挖开"
 SUM_Neo_SDH.127.b:"把遗迹封回去"
 SUM_SDH_RC_Petition_Hall:"陈情处"
 SUM_SDH_RC_Petition_Hall_desc:"设陈情处，谁有冤屈递纸子，三日之内必有回话。"
 SUM_Neo_SDH.128.t:"陈情处"
 SUM_Neo_SDH.128.d:"设陈情处，谁有冤屈递纸子，三日之内必有回话。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SDH.128.a:"重立赤王的旧制"
 SUM_Neo_SDH.128.b:"重建城邦的议会"
 SUM_SDH_RC_Office_Limit:"限权之法"
 SUM_SDH_RC_Office_Limit_desc:"定下在任者不得经商、不得占水的规矩。规矩立得细，破得也难。"
 SUM_Neo_SDH.129.t:"限权之法"
 SUM_Neo_SDH.129.d:"定下在任者不得经商、不得占水的规矩。规矩立得细，破得也难。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SDH.129.a:"召集能战之众"
 SUM_Neo_SDH.129.b:"召集能谋之士"
 SUM_SDH_RC_Road_Fix:"修商道"
 SUM_SDH_RC_Road_Fix_desc:"把几处绿洲之间的旧道补平，沿途设井与驿站。"
 SUM_Neo_SDH.130.t:"修商道"
 SUM_Neo_SDH.130.d:"把几处绿洲之间的旧道补平，沿途设井与驿站。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SDH.130.a:"以神权号令沙漠"
 SUM_Neo_SDH.130.b:"以律法约束诸城"
 SUM_SDH_RC_Tax_Public:"公开税则"
 SUM_SDH_RC_Tax_Public_desc:"税则刻在碑上立在城门口，谁交多少自己算得出来。"
 SUM_Neo_SDH.131.t:"公开税则"
 SUM_Neo_SDH.131.d:"税则刻在碑上立在城门口，谁交多少自己算得出来。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SDH.131.a:"把遗迹挖开"
 SUM_Neo_SDH.131.b:"把遗迹封回去"
 SUM_SDH_RC_Trade_House:"商行"
 SUM_SDH_RC_Trade_House_desc:"几家大商户合设商行，专营外邦贸易，账目公开。"
 SUM_Neo_SDH.132.t:"商行"
 SUM_Neo_SDH.132.d:"几家大商户合设商行，专营外邦贸易，账目公开。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SDH.132.a:"重立赤王的旧制"
 SUM_Neo_SDH.132.b:"重建城邦的议会"
 SUM_SDH_RC_Salt_Public:"盐归公营"
 SUM_SDH_RC_Salt_Public_desc:"盐场由公议经营，盐价由公议定，不许囤积。"
 SUM_Neo_SDH.133.t:"盐归公营"
 SUM_Neo_SDH.133.d:"盐场由公议经营，盐价由公议定，不许囤积。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SDH.133.a:"召集能战之众"
 SUM_Neo_SDH.133.b:"召集能谋之士"
 SUM_SDH_RC_Mint_Oasis:"绿洲铸钱"
 SUM_SDH_RC_Mint_Oasis_desc:"开炉铸钱，成色与重量刻在钱边，周边各邦都收。"
 SUM_Neo_SDH.134.t:"绿洲铸钱"
 SUM_Neo_SDH.134.d:"开炉铸钱，成色与重量刻在钱边，周边各邦都收。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SDH.134.a:"以神权号令沙漠"
 SUM_Neo_SDH.134.b:"以律法约束诸城"
 SUM_SDH_RC_Common_Law:"共律"
 SUM_SDH_RC_Common_Law_desc:"把各部的旧规合成一部共律，合不拢的先空着，日后再说。"
 SUM_Neo_SDH.135.t:"共律"
 SUM_Neo_SDH.135.d:"把各部的旧规合成一部共律，合不拢的先空着，日后再说。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SDH.135.a:"把遗迹挖开"
 SUM_Neo_SDH.135.b:"把遗迹封回去"
 SUM_SDH_RC_Judge_Ride:"巡回法官"
 SUM_SDH_RC_Judge_Ride_desc:"法官按季走遍各绿洲，就地审案，判词当众念。"
 SUM_Neo_SDH.136.t:"巡回法官"
 SUM_Neo_SDH.136.d:"法官按季走遍各绿洲，就地审案，判词当众念。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SDH.136.a:"重立赤王的旧制"
 SUM_Neo_SDH.136.b:"重建城邦的议会"
 SUM_SDH_RC_School_Oasis:"学馆"
 SUM_SDH_RC_School_Oasis_desc:"学馆教算术、地理、律例，也教识字。来学的不分部族。"
 SUM_Neo_SDH.137.t:"学馆"
 SUM_Neo_SDH.137.d:"学馆教算术、地理、律例，也教识字。来学的不分部族。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.137.a:"召集能战之众"
 SUM_Neo_SDH.137.b:"召集能谋之士"
 SUM_SDH_RC_Contracts:"契约存档"
 SUM_SDH_RC_Contracts_desc:"凡立大契者留底于存档处，日后有争执取出来对。"
 SUM_Neo_SDH.138.t:"契约存档"
 SUM_Neo_SDH.138.d:"凡立大契者留底于存档处，日后有争执取出来对。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SDH.138.a:"以神权号令沙漠"
 SUM_Neo_SDH.138.b:"以律法约束诸城"
 SUM_SDH_RC_Press:"抄书坊"
 SUM_SDH_RC_Press_desc:"抄书坊把共律与宪章抄了很多份，发到各处绿洲。"
 SUM_Neo_SDH.139.t:"抄书坊"
 SUM_Neo_SDH.139.d:"抄书坊把共律与宪章抄了很多份，发到各处绿洲。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SDH.139.a:"把遗迹挖开"
 SUM_Neo_SDH.139.b:"把遗迹封回去"
 SUM_SDH_RC_Home_Guard:"乡兵"
 SUM_SDH_RC_Home_Guard_desc:"各处绿洲出丁组成乡兵，平时务农，战时集合。"
 SUM_Neo_SDH.140.t:"乡兵"
 SUM_Neo_SDH.140.d:"各处绿洲出丁组成乡兵，平时务农，战时集合。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SDH.140.a:"重立赤王的旧制"
 SUM_Neo_SDH.140.b:"重建城邦的议会"
 SUM_SDH_RC_Watch_Oasis:"望楼"
 SUM_SDH_RC_Watch_Oasis_desc:"绿洲外缘设望楼，白天举旗夜里举火，消息传得比马快。"
 SUM_Neo_SDH.141.t:"望楼"
 SUM_Neo_SDH.141.d:"绿洲外缘设望楼，白天举旗夜里举火，消息传得比马快。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SDH.141.a:"召集能战之众"
 SUM_Neo_SDH.141.b:"召集能谋之士"
 SUM_SDH_RC_Wall_Low:"挡沙墙"
 SUM_SDH_RC_Wall_Low_desc:"沿绿洲垒一道低墙，挡流沙也挡散骑。"
 SUM_Neo_SDH.142.t:"挡沙墙"
 SUM_Neo_SDH.142.d:"沿绿洲垒一道低墙，挡流沙也挡散骑。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SDH.142.a:"以神权号令沙漠"
 SUM_Neo_SDH.142.b:"以律法约束诸城"
 SUM_SDH_RC_Road_Patrol:"护商队"
 SUM_SDH_RC_Road_Patrol_desc:"护商队专巡盐路，遇劫则追，追到手就地处置。"
 SUM_Neo_SDH.143.t:"护商队"
 SUM_Neo_SDH.143.d:"护商队专巡盐路，遇劫则追，追到手就地处置。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SDH.143.a:"把遗迹挖开"
 SUM_Neo_SDH.143.b:"把遗迹封回去"
 SUM_SDH_RC_Peace_Order:"治安署"
 SUM_SDH_RC_Peace_Order_desc:"治安署由本处人充任，管的是偷抢，不管议论。"
 SUM_Neo_SDH.144.t:"治安署"
 SUM_Neo_SDH.144.d:"治安署由本处人充任，管的是偷抢，不管议论。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.144.a:"重立赤王的旧制"
 SUM_Neo_SDH.144.b:"重建城邦的议会"
 SUM_SDH_RC_Karez_Oasis:"坎儿井"
 SUM_SDH_RC_Karez_Oasis_desc:"在坡地开坎儿井，把地下水引来，田多了一季。"
 SUM_Neo_SDH.145.t:"坎儿井"
 SUM_Neo_SDH.145.d:"在坡地开坎儿井，把地下水引来，田多了一季。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SDH.145.a:"召集能战之众"
 SUM_Neo_SDH.145.b:"召集能谋之士"
 SUM_SDH_RC_Terrace:"梯田"
 SUM_SDH_RC_Terrace_desc:"把坡地开成梯田，种耐旱的粮。"
 SUM_Neo_SDH.146.t:"梯田"
 SUM_Neo_SDH.146.d:"把坡地开成梯田，种耐旱的粮。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
