l_simp_chinese:

# =======================
# 须弥剧本 BY 荷花酥
# =======================

# 甲 | 圣树加冕 | 小吉祥草王重掌须弥，废除造神计划，让梦与自然回到须弥 | 尘世主义
# 乙 | 学者共和 | 废黜贤者寡头，学者、商人、沙漠民共立宪法 | 修禊主义 启明主义
# 丙 | 造神王座 | 把造神计划做完，以外力统治须弥 | 刑鼎主义 中和主义

 #################### 序章 · 花神诞祭 ####################
 SUM_PRO_Dawn_of_Sabzeruz:"花神诞祭钟声响"
 SUM_PRO_Dawn_of_Sabzeruz_desc:"钟声敲了九下，把须弥城的人全引到教令院门前。高塔下头，学者与百姓分作两拨站着，大眼瞪小眼，没一个肯先开口。草神被关在净善宫里这事，大伙儿心里雪亮，可就是没人敢先讲。卖椰枣的老汉蹲在墙角，担子倒了也顾不上。驼铃从列柱沙原那端传来，塔影一寸寸压过青石阶。—— BY 荷花酥"
 SUM_PRO_Aka_Shadow:"阿扎尔专政"
 SUM_PRO_Aka_Shadow_desc:"阿扎尔坐在议事厅那张乌木大案后，国事无论大小，都要经他一人过目。六大学派的首座分列两旁，捧着贝叶册，低头盯着地砖，满堂静得连针落地都听得见。阿扎尔说东，无人敢道西；他眉头一皱，众人便都噤了声。明论派的首座心里不服，才开口半句，被他把手一抬，立时把话咽回肚里，脸涨得通红，再不敢抬头。须弥一国往哪里走，全凭他这一张嘴。"
 SUM_PRO_Aka_Six_Darshan:"六家序位"
 SUM_PRO_Aka_Six_Darshan_desc:"教令院议事，先议的不是国事，是座次。那张乌木长案摆在堂上，谁坐得近一寸，谁的话便压人一头。生论、素论、知论、明论、因论、妙论，六家凑到一处，各怀各的心思。有个钻营的，提着礼盒在贤者门外候了半日，求的是往前挪个位子；偏有个懒得计较的，搬张凳子坐到廊檐底下，图个清静。两人为一把椅子争得面红耳赤，最后还是贤者咳了一声才作罢。待坐定之后，彼此大眼瞪小眼，连咳嗽都轻着些。"
 SUM_PRO_Aka_Censor:"颁禁焚书"
 SUM_PRO_Aka_Censor_desc:"藏书楼的灶膛里，火苗正一页页地舔着纸。那白发老学究把自己抄了半辈子的札记，一张张撕下、卷紧，往火里塞。纸灰打着旋儿飘上房梁，他盯着那火，半晌没动。原来教令院新颁了禁书令：卷宗里但凡提到赤王的、牵着禁忌知识的、连着世界树记忆的，一概封存入库，不许外传。文书刚递到他手上时，他抖得连纸都捏不住。旁边的小厮想拦，话到嘴边，终究没敢出声。"
 SUM_PRO_For_Tighnari:"林尉上闻"
 SUM_PRO_For_Tighnari_desc:"禅那园的低地上，死域一日一夜吞去了半片林地。巡林官提纳里一身短打，从雨林赶回来，鞋底糊满烂泥，裤脚尽是草屑。进门顾不得歇，先把一份报告拍在案上，纸上朱笔勾着一道红线。众人围过来看，脸上登时变了色。提纳里拿指头戳着那道红线，叫道：「再拖下去，这林子就没了！」屋里静了一瞬，有人忙去收拾家伙，连茶都顾不上喝。"
 SUM_PRO_For_Collei:"沉疴见忘"
 SUM_PRO_For_Collei_desc:"茶摊角落里，几个人正压着嗓子嚼舌，说的正是柯莱身上那魔鳞病。这病根与禁忌知识脱不了干系，人人肚里雪亮，嘴上却谁也不肯挑明，都怕惹火烧身。提纳里恰从旁边路过，听见半句，眉头立时拧起，拿眼扫过去。那几个嚼舌的立时住了口，讪讪地四散走开。柯莱走过时，只当没听见，手里却把袖口攥得紧紧的。"
 SUM_PRO_For_Gandharva:"禅那园下隰"
 SUM_PRO_For_Gandharva_desc:"「这林子就是我们的家。」一个老猎手把刀往地上一插，扔下这么句话。教令院人手不够，禅那园的猎人们便自己聚合起来，替官府守着雨林边界。白日设陷坑，夜里举火把巡逻，撞见死域便一齐扑上去，一文工钱也不曾领。有人问起图什么，众人只是点头，谁也不再多说。火把映着树影，一路巡到天明。"
 SUM_PRO_Des_Morning_Wind:"碛上晨飚"
 SUM_PRO_Des_Morning_Wind_desc:"「日头毒起来了，快走！」领头的老商拿鞭子朝那几根残破石柱一指，扯着嗓子喊。商队沿着赤王留下的旧道往前挪，驼峰上捆着香料和椰枣，铃铛一步一响。晨风从列柱沙原上掠过，卷起细细的沙。有个年轻伙计嫌走得慢，伸手在驼屁股上拍了一下，被老商瞪了一眼。众人催着骆驼紧走，那串驼铃越飘越远，沙地上只留下一溜脚印。"
 SUM_PRO_Des_Eremites:"镀金旅团之帜"
 SUM_PRO_Des_Eremites_desc:"「空口白话，也敢来使唤爷爷？」一个大汉揪住使者的衣领，把他掼回沙地里，笑得前仰后合。那使者是教令院派来说项的，才开口半句，就落了这般下场。沙漠里的镀金旅团，旗帜在沙丘间起起落落，刀法勇悍，只认一个死理：谁给摩拉，便替谁卖命；教令院的话，半个字也不听。众人轰然大笑，那使者爬起来，灰溜溜地走了。"
 SUM_PRO_Des_Aaru:"阿如村张灯"
 SUM_PRO_Des_Aaru_desc:"阿如村的灯火，夜夜照着坎蒂丝手中那杆长矛。她立在村口，替沙漠挡住教令院派来的税吏。那些税吏远远望见矛尖寒光，脚下一转，便绕道走了。村里的老人吧嗒着旱烟，说道：「有坎蒂丝在，这村子便塌不了。」众人听了，也都把心放回肚里。"
 SUM_PRO_Ak_Terminal:"虚空之器"
 SUM_PRO_Ak_Terminal_desc:"夜里人人睡得沉，眼皮底下却空空荡荡，连个影儿也不见。原来那虚空终端把各人的梦，不知不觉间都悄悄收了去。它神通广大，知识一份份分派到手里，只要动个念头，万事皆知。世人只道得了知识，哪里晓得梦早已没了。有个老妇人清早醒来，跟家里人道：「昨夜睡得实在，却像没睡一般，一个梦也没做。」"
 SUM_PRO_Ak_Knowledge:"智慧论值"
 SUM_PRO_Ak_Knowledge_desc:"「这算什么道理！」一个年轻人把讲义往桌上一摔，拂袖就走。须弥城里的学问，如今也明码标价，一页讲义值几枚摩拉。资历反倒比真才实学值钱：深的开口便有人听，浅的纵有一肚子真知，也没人搭理。那年轻人走到门口又回头，指着满桌讲义骂了一句，才愤愤去了。掌柜的只管拨算盘，头也不抬。"
 SUM_PRO_Ak_Dream:"梦为人攫"
 SUM_PRO_Ak_Dream_desc:"隐在雨林里的兰那罗说，这是灭顶的灾祸；教令院却道是天大的进步，人人省心。原来须弥人如今是不做梦了。看官试想，夜里睡得香甜，眼里却空空荡荡，连个影儿也没有。人活着连梦都不做，与那木偶有何两样？有个孩子问娘：「梦是什么？」那娘张了张嘴，竟答不上来。"
 SUM_PRO_Gen_Project:"阴图伪神"
 SUM_PRO_Gen_Project_desc:"「这事太过逆天，怕要惹出祸来！」一个老成持重的工匠私下直摇头。旁人忙拿眼色拦他，他才把话咽了回去。教令院暗地里已把造神计划开了工，要拿一具人偶的躯壳造出新神，去替那被囚的草神。工匠们日夜赶工，把神性符文一笔笔刻进冰冷机括里。那老工匠手里的凿子顿了顿，终究没再多言。"
 SUM_PRO_Gen_Puppet:"攒成人形"
 SUM_PRO_Gen_Puppet_desc:"守夜的小工匠揉了揉眼睛，只当自己看花了。那胸口的核心，分明亮了一亮，随即又灭了。这具散兵的躯体，是几天前抬进地下密室的。说是人偶，关节里全是机括，偏又嵌着一枚神性核心，机械和神性硬凑到一处，瞧着说不出的别扭。工匠们围着它忙了整月，拆开又装上，谁也拿不准它到底几时才醒。小工匠壮着胆子凑近看了看，那核心安安静静，什么动静也没有，他才敢喘口气。"
 SUM_PRO_Gen_Fatui:"试所临宾"
 SUM_PRO_Gen_Fatui_desc:"上官把眼一横，那多嘴的立时把半句话缩了回去，从此再不敢开口。这些日子，愚人众的使者频繁进出教令院的实验室，今日送图纸，明日带走样本。院里上下谁都瞧见，却谁都装作没瞧见，只管低头干活。有个新来的书记官不明就里，凑过去多问了一句，出的门来才晓得厉害，再经过那实验室，连脚步都放轻了。"
 SUM_PRO_Fat_Second:"二席投刺"
 SUM_PRO_Fat_Second_desc:"阿扎尔把那帖子往案上一搁，半晌不言语。旁的官儿偷眼看他脸色，谁也不敢先开腔。这是愚人众第二席送来的请帖，措辞客气，字字恭维，字里行间却藏着苛刻条款，一条比一条难应。他读了两遍，指头在帖面上敲了又敲，忽然问左右：「这帖子，回还是不回？」满堂的人面面相觑，竟没一个应声。"
 SUM_PRO_Fat_Dottore:"多托雷进策"
 SUM_PRO_Fat_Dottore_desc:"那多托雷，向教令院提出一桩怪事，要借须弥的学者与物产，去成全他那桩惊天实验。他说话时两眼发亮，条分缕析，听的人却脊背发凉。有个明白人暗里寻思：「这哪里是借，分明是取！」只是当着面，谁也不敢说破。"
 SUM_PRO_Fat_Factory:"沙中建作"
 SUM_PRO_Fat_Factory_desc:"「此地不接待闲人，快走！」守门的横刀一拦，那个胆大的只得缩回脖子。沙漠腹地里，冷不丁冒出愚人众一座工厂，烟囱日夜吐黑烟，把半边天都熏暗了。机器轰鸣，震得沙丘直抖，附近商队都绕着走。有个老人远远望了望，摇头道：「这黑烟遮了日头，往后的日子怕是不好过。」"
 SUM_PRO_Ere_Blood:"以血立条"
 SUM_PRO_Ere_Blood_desc:"押回来的那个人，跪在族众面前，头也不抬。他叛逃之后跑出千里，到底还是被揪了回来。镀金旅团有条血的律法，血脉和大地紧紧拴在一起。老人们常说，饥馑的苦楚早写进骨头缝里，揉不进面，也洗不掉。谁敢背弃族人，就得吃这律法的裁处，逃到天涯海角也没用。这回众人亲眼见了，方知那律法从不是吓唬人的空话。有年轻人想求情，被长老一眼瞪了回去。"
 SUM_PRO_Ere_Mercenary:"募卒为券"
 SUM_PRO_Ere_Mercenary_desc:"有人讥他们没骨气，领头的把钱袋掂了掂，反倒笑了：「摩拉落袋，便是骨气。」这伙佣兵，替教令院押过货，转过头又替沙漠部族押兵器，两边的钱都收得心安理得，谁也不肯得罪。货担子才翻过一道沙丘，他们就把旗号一换，主顾随之也换了。方才笑话的那人还想再说，被他们一通大笑盖了下去，只得悻悻走开。"
 SUM_PRO_Ere_Revolt:"乱萌已露"
 SUM_PRO_Ere_Revolt_desc:"「莫要轻动，性命不是儿戏！」一个老人拄着杖，站在沙丘上劝。那些年轻人哪里肯听，早把刀柄攥出了汗。沙丘之间的风声，近来一天紧似一天，处处都在传起义的话。镀金旅团的人马暗里聚拢，一支支小队往绿洲靠，刀枪擦得雪亮。老人见劝不住，把杖往沙里一顿，叹道：「这世道，终究是要变了。」"
 SUM_PRO_Ara_Song:"兰那罗讴吟"
 SUM_PRO_Ara_Song_desc:"「娘，这歌哪里来的？」一个孩子哼着哼着，忽然回头问。他娘只当是胡说，摆摆手走开了。雨林深处，兰那罗们正唱着歌，那声音轻得很，像露珠顺着叶脉滚下来。大人们听不见，只道是风穿过树梢；偏偏这些天真的孩子听得真切，还跟着一句句哼。其实这歌，本就只唱给心净的人听。那孩子见娘不理，也不恼，自己又哼了起来。"
 SUM_PRO_Ara_Rana:"拉娜无迹"
 SUM_PRO_Ara_Rana_desc:"拉娜失踪了。头一天村里人还当她巡林去了，到第三天，才觉得不对。有个孩子站出来说，亲眼瞧见她跟着一群兰那罗，钻进一个梦里的世界，从此没再露面。众人信一半疑一半。老巡林官把火把往地上一戳，说：「翻遍这座林子，也得把人找回来！」当夜就有人打着火把进山，寻到天亮，连片衣角也没见着。"
 SUM_PRO_Ara_Vana:"枕中天地"
 SUM_PRO_Ara_Vana_desc:"兰那罗把那梦的世界，缓缓摊开在巡林官眼前。但见林海无边，光斑在地上跳，远处立着一个温柔的影子，正是大慈树王留下的余韵。巡林官看得呆了，半晌说不出话，末了才问一句：「这是哪里？」兰那罗只笑，不答。"
 SUM_PRO_The_Choice:"歧路当决"
 SUM_PRO_The_Choice_desc:"满朝文武为这桩事争得脸红脖子粗，你一句我一句，谁也说服不了谁。摆在须弥面前的，是三条路：迎回真正的神明；把权柄分给学者与沙漠之民；再不然，索性把造神计划做将下去。三条路各有利弊，各有各的拥护者。有个文官掰着指头算了半天，末了把袖子一甩：「我说不通你们！」大贤者坐在上头，只是不言语。"

 SUM_Neo.1.t:"梵钟九叩"
 SUM_Neo.1.d:"须弥城中花神诞祭，钟声敲过九下，满城百姓都往教令院前聚来。但见那高塔拔地而起，塔尖几乎戳破云层，塔身上刻满了弯弯曲曲的古纹。塔下分作两拨人，一拨是衣冠齐整的学者，一拨是短打装束的百姓，中间隔着一级青石台阶，彼此你看着我，我看着你，谁也不肯先开腔。原来那件人人肚里雪亮的事，草神至今还锁在净善宫中，没人敢头一个说将出来。正议论间，大贤者阿扎尔的轿子从人丛后抬过，众人登时箝了口，连咳声都不敢有。有胆大的，拿手指指净善宫的方向，又飞快缩回袖里，生怕被人瞧见。旁边卖椰枣的小贩也停了叫卖，伸长脖子张望，秤上的椰枣撒了一地也顾不得捡。有孩童趁乱捡了几颗，被爹娘一把拽住，低声骂道：「今日的钟，不是白听的。」孩童缩了缩脖子，把椰枣又放回秤盘上去了。—— BY 荷花酥"
 SUM_Neo.1.a:"遵循教令院的旧例"
 SUM_Neo.1.b:"听雨林与沙漠的声音"
 SUM_Neo.2.t:"阿扎尔当国"
 SUM_Neo.2.d:"大贤者阿扎尔端坐议事厅上，一张乌木大案摆在他面前，一应国事皆由他一人裁断。六大学派的首座分列两旁，手里捧着贝叶册，眼睛盯着地面，是鸦雀无声。阿扎尔问一句，众人答一句，问的是东，没人敢答西。有一回明论派的首座略有异议，才开口半句，便被阿扎尔抬手止住，那首座即刻把话咽了回去，脸涨得通红，再不敢抬头。这须弥国的走向，就系在这大贤者一人身上。他若点头，政令便行，六派首座跟着附和；他若摇头，满堂的计议都作了废纸。有识趣的，事先猜透了他的心思，早早把话备好，只等他一问便答。有新来的书记官，不明就里，多问了一句，阿扎尔只扫他一眼，他便把后半句吞了回去，此后再不敢开口。"
 SUM_Neo.2.a:"把卷宗封存"
 SUM_Neo.2.b:"把卷宗摊开"
 SUM_Neo.3.t:"六家竞席"
 SUM_Neo.3.d:"教令院里六大学派，生论、素论、知论、明论、因论、妙论，名目虽别，心思却各不一样。每逢议事，那座次便成了天大的事。生论派仗着人多，要坐头把交椅；素论派自诩通晓星象，不肯居人之下；妙论派的画师更妙，连椅子摆放的角度都要争上一争。其实争的是教令院里的权柄。谁坐得近，谁的话便重，奏章便能递到上头；谁坐得远，谁的建议便压在箱底，永无出头之日。为此六派首座明里拱手作揖，暗里较劲使绊，议事厅的空气紧得很。有一回为争一个座位，两派首座竟从日中吵到日落，谁也不肯让步。更有好事的，私下里排了张座次图，注明谁该坐第几位，传递之间，竟比公文还走得快。那图上传到第三手，添了几笔朱批，到后来连阿扎尔案头也压了一张，他看了不语，只把它扣在镇纸底下。"
 SUM_Neo.3.a:"按学者的判断行事"
 SUM_Neo.3.b:"按自己的判断行事"
 SUM_Neo.4.t:"教令院焚籍"
 SUM_Neo.4.d:"是日教令院颁下一道禁书令，茶摊酒肆都在传。凡卷宗里提到赤王的，涉及禁忌知识的，牵连世界树记忆的，一概封存入库，钥匙分作三把，交与三人掌管，缺一把也开不得。有藏书的老学究，接到文书时手都抖了，把自己抄了半辈子的札记一页页撕下，塞进灶膛烧了，火光映得满脸愁容。书吏挨家挨户地收，收一本登一本，登记簿写了厚厚几册，堆在墙角像座小山。有舍不得的，偷偷把几页藏进夹层，整日里提心吊胆，睡觉都不敢关窗。这禁令一下，须弥城里识字的人人自危，连做梦都怕说出不该说的话。连学堂里的先生，讲到这一节，也要先把门窗关严，压低了嗓门，生怕隔墙有耳。有几个胆小的学生，索性把笔记都烧了。"
 SUM_Neo.4.a:"遵循教令院的旧例"
 SUM_Neo.4.b:"听雨林与沙漠的声音"
 SUM_Neo.5.t:"林尉密陈"
 SUM_Neo.5.d:"巡林官提纳里，一身短打扮，腰间挂着药囊，这一日从雨林深处赶回禅那园，鞋底全是烂泥，裤脚也被荆棘划破了几处。他进得门来，也不歇息，抹一把脸上的汗，先把一份报告递上去，纸上用朱笔画着一道弯弯曲曲的红线。原来死域正沿着禅那园的低地蔓延，一日一夜便吞掉半片林地，树木枯黑，草叶尽灰，连溪水都泛着异样的颜色。提纳里指着那红线道：再拖下去，禅那园就保不住了。众人听了，脸色都变。有年轻的巡林人，当场就要提刀去砍，被提纳里一把拦住，说这东西砍不得，越砍越是蔓延。提纳里又说，这死域的根须扎在地下，深不可测，若只顾在地面上扑杀，无异于割草留根，春风吹又生。众人听了，方才恍然大悟。"
 SUM_Neo.5.a:"把卷宗封存"
 SUM_Neo.5.b:"把卷宗摊开"
 SUM_Neo.6.t:"疫气弥城"
 SUM_Neo.6.d:"柯莱身上的魔鳞病，近来又被人数落起来。有人见她脖颈上那一片鳞状的纹路，便交头接耳，说这病来得蹊跷，莫不是沾了什么不干净的东西。可话到嘴边，一个个又把头摇得像拨浪鼓，谁也不肯明说。原来这魔鳞病的根子，人人疑心与禁忌知识有关，只是这话犯忌，谁沾谁倒霉，轻则丢官，重则丧命。提纳里心里明镜似的，却也只是把柯莱护在身后，替她挡住那些探究的目光。柯莱低着头，拿围巾把脖子裹得严严实实，脚步匆匆穿过人群，恨不得找个地缝钻进去。有好心的，递来一碗豆汤，汤上浮着几片香辛叶，她接过来，声音低得几乎听不见：「多谢。」旁人见状，也就把话头岔开，只说些天气收成，说巡林官前日又在道成林里清了一处死域，再不提那病字。风从雨林里吹来，带着帕蒂莎兰的甜香，她深深吸了一口，像要把这一日咽下去似的。"
 SUM_Neo.6.a:"按学者的判断行事"
 SUM_Neo.6.b:"按自己的判断行事"
 SUM_Neo.7.t:"禅那园幽涉"
 SUM_Neo.7.d:"禅那园的猎人们，见死域日日逼近，教令院派来的人又不顶用，便自己聚在一处商议。有见过世面的老猎手，把一张兽皮往桌上一摊，用炭笔画出雨林的边界，说道：咱们守自己的家园，等不得官府了。众人齐声应是，声震林樾。于是你出弓，我出箭，他出陷阱，几十号人分作几队，沿着林子的边沿日夜巡逻。遇见死域的灰雾，便燃起特制的药草熏赶，那烟气又苦又辣，熏得人直流眼泪。他们替教令院守着雨林的边界，却不要官府一粒米，都是些硬骨头。有朝廷的使者来慰问，带了些许赏钱，众人竟一人不取，尽数退了回去。如今这林子的边界，一段段都有人认领，谁的地界谁照看，真出了事，一声唿哨，四面八方的人便都聚了来。"
 SUM_Neo.7.a:"遵循教令院的旧例"
 SUM_Neo.7.b:"听雨林与沙漠的声音"
 SUM_Neo.8.t:"晨风卷列柱沙原"
 SUM_Neo.8.d:"清晨时分，一阵晨风掠过列柱沙原，卷起细细的沙粒，打在人脸上生疼。一支商队驮着香料与织物，沿着赤王留下的旧道缓缓前行，驼铃一声接一声，在空旷的沙原上荡出老远。领头的老向导骑在骆驼背上，手里攥着一只旧罗盘，那针儿东指西指，竟没个准头。他索性收起罗盘，凭着一株株半埋的石柱辨认方向。那些石柱都是赤王年间立下的，如今被风沙啃得残缺不全，柱身上的古文字也模糊了。日头渐渐升高，沙面烫得能烙饼，商伙们用头巾裹紧了脸，只露出一双眼睛。有年轻的忍不住问：这道还走得通么？老向导嘿嘿一笑：赤王走过的道，错不了。正说着，一排白骨从沙里露出半截，想是当年倒在此处的旅人，老向导见了，也只是合十念了一声，催着队伍快走。"
 SUM_Neo.8.a:"把卷宗封存"
 SUM_Neo.8.b:"把卷宗摊开"
 SUM_Neo.9.t:"镀金旅团之帜"
 SUM_Neo.9.d:"镀金旅团的旗号，在沙丘间一处接一处地竖起来。那旗子被风吹得猎猎作响，一会儿卷起，一会儿展开，远远望去，像一片游动的火。这伙人行事有个规矩：契约只认摩拉，不认教令院。你出得起价，他便替你卖命，刀山火海也不皱眉；你若拿官府的名义来压他，他连正眼都不瞧。有一回教令院派人来征调，话里带着三分官腔，旅团的头目当场把契约撕得粉碎，说道：「这买卖不做得。」来人灰溜溜地走了，走时还回头看了一眼那面旗。旗下众佣兵有的擦枪，有的喂马，谁也没把来人放在心上。这伙人也有义气，只要契约在身，便把命交出来，刀枪剑戟都不退缩，可若是无钱的白差，任你说破喉咙，也休想支使他们动一动。沙暴起时，旗便卷成一束，人聚在旗下躲风，等风头过去，再接着把旗竖起来。"
 SUM_Neo.9.a:"按学者的判断行事"
 SUM_Neo.9.b:"按自己的判断行事"
 SUM_Neo.10.t:"阿如村张灯"
 SUM_Neo.10.d:"阿如村的夜里，家家户户点起灯火，昏黄的光照在坎蒂丝那杆长矛上，矛尖闪着冷冷的青光。坎蒂丝是这村的守护者，世代守着这片绿洲，从没让外人越雷池一步。这一日教令院的税吏带着一队人马来，要挨家挨户地收税，说是新上的名目，连水井都要算进去。坎蒂丝往村口一站，长矛往沙地上一顿，说道：这村里的水，是祖辈传下来的，谁来收税，先问过我这杆矛。那税吏见她神色凛然，又见村里的青壮都攥紧了拳头，只得悻悻退回。守村人替沙漠挡了一回，村里人当晚多添了一把柴，孩子们围着篝火，听老人讲坎蒂丝的故事。那税吏回去后，遣人送来一封公函，措辞严厉，坎蒂丝看也不看，随手压在石桌下，仍旧每日到井边巡视，风雨无阻。"
 SUM_Neo.10.a:"遵循教令院的旧例"
 SUM_Neo.10.b:"听雨林与沙漠的声音"
 SUM_Neo.11.t:"虚空之器"
 SUM_Neo.11.d:"须弥城里，人人耳后都戴着一个虚空终端。这东西神通广大，你要问什么，它便把知识一样样分发给你，方便，连小孩子都能对答如流。可它还有一样厉害处：把每个人的梦，都悄悄收了去。从前的人夜里做梦，梦见飞，梦见花，梦见早已作古的亲人，如今一觉睡到天亮，脑子里空空荡荡，连一个梦也不剩。有上了年纪的，夜半醒来，总觉得丢了什么要紧的东西，却怎么也想不起，只对着天花板发呆。学者们四处宣讲，说这是进步，百姓却渐渐觉得少了许多滋味。有做母亲的，夜里想梦见早夭的孩子，想得心口发疼，偏偏一夜无梦，醒来只对着枕头出神。雨林深处，兰那罗的歌声倒夜夜不断，只是城里人再也听不见了。有人说，这终端省了梦，也省了人的念想，得不偿失。"
 SUM_Neo.11.a:"把卷宗封存"
 SUM_Neo.11.b:"把卷宗摊开"
 SUM_Neo.12.t:"智慧论值"
 SUM_Neo.12.d:"这须弥城里的学问，如今也标上了价码。知识明码标价，一份讲义值多少摩拉，都写得明明白白，贴在学堂门口。你要听讲，先掏钱；你要翻那善本，先掏更多的钱；你想请教一个问题，还得另算束脩。更奇的是，学者的资历比学问还值钱。同样一句话，从白发老学究嘴里说出来，便是金科玉律，众人连连点头；换作年轻后生说，便被当作放屁，无人理会。于是人人争着熬资历，把头发熬白了再开口，真有学问的反倒没人听。有那明白人看了，只是摇头叹气，说这世道，颠倒了。于是学堂里，常见白发老者念着陈年旧句，学生听得昏昏欲睡，却不敢打瞌睡；那边年轻才俊有新见解，刚一开口，便被一句「你懂什么」顶了回去。教令院门前的价目牌，被日头晒得发白，也无人去换。"
 SUM_Neo.12.a:"按学者的判断行事"
 SUM_Neo.12.b:"按自己的判断行事"
 SUM_Neo.13.t:"梦为人攫"
 SUM_Neo.13.d:"自从虚空终端普及，须弥人便不再做梦了。夜里躺下，闭上眼，眼前一片黑，直挺挺挨到天亮，无趣。教令院的人四处宣讲，说这是天大的进步，人不再被虚幻的梦困扰，可以专心向学，把精力都用在功名上。可雨林深处的兰那罗却唱起歌来，那歌里说：「没有梦的人，就像没有根的树，看着还立着，其实心已经死了。」有那孩子听了这歌，竟莫名落下泪来，自己也说不清是为何。这梦的有无，事关重大，只是当局者迷，旁观者清。城里的学者只顾着欢喜，哪里有工夫去听林子里那些细小的歌声。兰那罗见没人肯听，便也不再唱，只把那歌埋进土里，等着哪一天，有懂的人来听。这一等，端的不知道要等到什么时候。桓那兰那的梦垣上，花开了一茬又一茬，歌声却停了很久。"
 SUM_Neo.13.a:"遵循教令院的旧例"
 SUM_Neo.13.b:"听雨林与沙漠的声音"
 SUM_Neo.14.t:"阴图伪神"
 SUM_Neo.14.d:"大贤者阿扎尔，早就存了一桩心思。他见草神被囚在净善宫中，那神位空悬多年，便想出一个大胆的计策，名唤造神计划。原来他要寻一具人偶之躯，把一个新神造出来，端端正正地供上神位，好取代那被囚的草神，把权柄牢牢抓在自己手里。这一下，须弥的天地便要翻个身。有老成持重的首座听了，吓得连连摆手，说这事万万使不得，神明岂是人力能造的，自古哪有这等狂妄。阿扎尔却把眼睛一瞪，说事在人为，自古哪有做不成的事。众人面面相觑，再不敢言语。那首座退下后，回到自己房里，整夜翻来覆去，想着神明岂是凡人能造的，越想越是害怕，第二天一早便称病不朝。阿扎尔得知，也只是冷笑一声，并不派人去劝，铁了心要做下去。"
 SUM_Neo.14.a:"把卷宗封存"
 SUM_Neo.14.b:"把卷宗摊开"
 SUM_Neo.15.t:"攒成人形"
 SUM_Neo.15.d:"是日夜里，几辆蒙着黑布的马车，悄悄驶进教令院，车门上连个标记也没有。车上运的，正是散兵的躯体。这散兵本是愚人众的第六席，浑身上下多是机械，如今被人抬进教令院的地下深处。那地下实验室里，灯火通明，工匠们忙作一团，把机械的关节一寸寸拆开，又将神性的东西硬生生凑在一起。有胆小的工匠，手一抖，差点把零件掉在地上，被监工狠狠瞪了一眼，吓得赶紧低下头。机油味混着说不清的香气，在屋里弥漫，熏得人头晕。这机械与神性本是两样东西，硬要凑在一处，凶险得很。监工把门窗锁死，钥匙攥在自己手里，连送饭都要从窗口递进来。那散兵躺在石台上，浑身插满管线，也不知是死是活，只在偶一抬手间，露出几点幽光。"
 SUM_Neo.15.a:"按学者的判断行事"
 SUM_Neo.15.b:"按自己的判断行事"
 SUM_Neo.16.t:"试所临宾"
 SUM_Neo.16.d:"自打造神计划启动，愚人众的使者便频繁出入教令院的实验室。众人披着黑色斗篷，来去匆匆，谁也不知他们姓甚名谁，见了人也只把帽檐压得更低。教令院的上上下下，都装作没看见，该巡查的绕着走，该登记的留着空白，连门房的老头都得了吩咐，不许多问一句。唯有地下实验室的灯，整夜整夜地亮着，从黄昏点到天明，竟没有一刻熄灭。有值夜的更夫，远远望着那灯光，私下里嘀咕：「这深更半夜的，亮着灯做甚？」旁边人赶紧把他拉住，叫他莫要多嘴，小心招来横祸。后来那更夫果真害了场大病，发着高烧，嘴里反复念叨着灯光和黑影，家人只当他撞了邪，请了祭司来做法事，却不知道他看见的，不是鬼。灯油一桶一桶地抬进地窖，抬的人也不问来路。"
 SUM_Neo.16.a:"遵循教令院的旧例"
 SUM_Neo.16.b:"听雨林与沙漠的声音"
 SUM_Neo.17.t:"二席投刺"
 SUM_Neo.17.d:"这一日，大贤者阿扎尔的案头上，多了一封请帖。那请帖是愚人众第二席发来的，纸是上好的羊皮，边角烫着金，字写得龙飞凤舞，措辞客气，一口一个敬仰，一口一个幸会。阿扎尔起初还微微含笑，可读到后头，脸色便沉了下来，把羊皮纸攥出了褶子。原来那客套话底下，藏着一堆苛刻的条件：要人，要地，要实验室里随意进出的自由，还要教令院一概不得过问。阿扎尔把请帖往案上一摔，半晌无言。这般请帖，不去是得罪人，去了是卖自身，左右为难，怎么做都是错。阿扎尔在厅里踱了半宿，烛火烧短了一截，地上落满烛泪。他一会儿想答应，好借愚人众之力成事，一会儿又怕引狼入室，落个引火烧身的下场，举棋不定。"
 SUM_Neo.17.a:"把卷宗封存"
 SUM_Neo.17.b:"把卷宗摊开"
 SUM_Neo.18.t:"多托雷进策"
 SUM_Neo.18.d:"愚人众里有个多托雷，人称博士，是个做实验的疯子，眼里只有学问，全无人情。他到了须弥，便向大贤者阿扎尔提议：你这里有的是学者，有的是资源，何不都借与我，来完成我的实验？这话说得轻巧，可阿扎尔听在耳里，却像吞了个苍蝇，半晌说不出话。原来这多托雷做实验，向来不把人当人，须弥的学者一旦落到他手里，是凶多吉少，进去多少，出来多少还两说。可阿扎尔又贪图他的本事，想着借力成事，一时竟拿不定主意，只在厅里来回踱步。多托雷见他犹豫，便又添了一把火，说实验若成，须弥便可一夜之间强盛，何乐不为，至于那些学者的性命，不过是些可以替换的材料罢了。阿扎尔听到这里，脸上的神情，有些动摇了。"
 SUM_Neo.18.a:"按学者的判断行事"
 SUM_Neo.18.b:"按自己的判断行事"
 SUM_Neo.19.t:"沙中建作"
 SUM_Neo.19.d:"沙漠腹地里，近来冒出一座愚人众的工厂。那地方原本荒无人烟，只有几丛骆驼刺，突然之间，厂房立起，烟囱高耸，日夜不停地喷着黑烟，把半边天都熏得昏黄。路过的商队远远望见，都说是妖怪作祟，绕着道走。有大胆的凑近去看，只见厂房外头站着荷枪实弹的守卫，一个个面无表情，里头传来机器轰鸣，响得人耳朵发聋，说话都得扯着嗓子。沙漠里的部族见了，人人惶恐，说这黑烟毒害了绿洲的水，再这样下去，日子就过不成了。有老人对着黑烟叹气，说祖辈传下的清水，怕是要毁在这一代。没过半年，工厂附近的井水果然变了味，苦得不能入口，连羊喝了都拉肚子。部族的人这才信了先前的话，收拾家当，牵着骆驼，往远处的水源迁去，一步三回头。"
 SUM_Neo.19.a:"遵循教令院的旧例"
 SUM_Neo.19.b:"听雨林与沙漠的声音"
 SUM_Neo.20.t:"以血立条"
 SUM_Neo.20.d:"镀金旅团虽是些佣兵，行事却自有一套规矩，唤作血的律法。这律法说，人的血脉与大地相连，谁占了你的地，便是夺了你的命，此仇不共戴天。他们世代在沙漠里讨生活，饥馑的记忆，早就写进了骨头缝里，一饿起来，连梦都是干的。所以他们为何这样看重契约，为何这样认死理？原来沙漠里缺水少粮，一个不信守承诺的人，是活不下去的，谁肯把后背交给他。故此他们重然诺，轻生死，一句话说出口，便是九牛也拉不回。有新入伙的后生不懂，老佣兵便拍着他的肩膀说：「孩子，在这片沙海里，信誉比摩拉还金贵。」所以你若要问，他们为何宁可站着死，也不肯跪着活？只消看一眼那片寸草不生的沙海，便什么都明白了。"
 SUM_Neo.20.a:"把卷宗封存"
 SUM_Neo.20.b:"把卷宗摊开"
 SUM_Neo.21.t:"募卒为券"
 SUM_Neo.21.d:"那些佣兵，左右逢源，两头不得罪。这一日替教令院押运一车货物，从须弥城出发，走的是官道，旗号打得明明白白，过关过卡一路放行。过了几日，你若往沙漠深处走，又见同一伙人，替沙漠里的部族押运一车武器，用麻布盖得严严实实，走的是荒僻小道，专挑夜里赶路。问起缘由，他们嘿嘿一笑：谁给摩拉，就替谁办事，这叫买卖，与旁的无关。教令院恨他们脚踩两只船，可要用人的时候，还得来找他们；部族信不过外人，可这伙人拿钱办事，倒也公道。有一回，教令院与部族同时雇了他们，一边要护粮车，一边要劫粮车。这伙人收了两边的钱，先护着走一段，再闪开一条道，让部族的人劫了去，两边都交代得过去，滴水不漏。"
 SUM_Neo.21.a:"按学者的判断行事"
 SUM_Neo.21.b:"按自己的判断行事"
 SUM_Neo.22.t:"乱萌已露"
 SUM_Neo.22.d:"近来沙丘之间，风声一天紧似一天。有往来贩卖的商旅，带来消息，说沙漠里有人举事了，要反抗教令院的盘剥，连税卡都被人掀了。这传闻一传十，十传百，越传越邪乎，到后来竟说成天兵下凡。镀金旅团的人听了，便开始暗中聚拢，各路人马往一处靠。原来他们早就憋着一肚子气：教令院又是收税，又是禁书，如今连沙漠里的水井都要管，欺人太甚。如今有人振臂一呼，他们便想凑这个热闹。旗号一面接一面地竖起来，篝火一处接一处地点起来，把沙丘照得红彤彤，映着一张张兴奋的脸。有老成的劝道：且慢，但见风头。那老成的话音未落，便有人跳出来反驳，说机会就在眼前，错过了要后悔一辈子。两下里争了起来，火光映着一张张涨红的脸，谁也压不住。"
 SUM_Neo.22.a:"遵循教令院的旧例"
 SUM_Neo.22.b:"听雨林与沙漠的声音"
 SUM_Neo.23.t:"兰那罗行谣"
 SUM_Neo.23.d:"雨林深处，时常飘来一阵歌声。那歌不是人唱的，原是兰那罗唱的。兰那罗是些小小的林中精怪，藏在树叶与蘑菇之间，寻常人哪里看得见它们的影子。它们唱起歌来，清清脆脆，可奇怪的是，只有孩子能听见。大人们走到跟前，只当是风声，是虫鸣，浑不在意，脚步也不停一停；孩子们却停下脚步，侧着耳朵，咯咯地笑，说那是好朋友在唱歌。有那大人见孩子对着空处说话，还当孩子着了魔，喝令他们闭嘴，快些赶路。孩子们哪里肯听，依旧追寻那歌声，往林子深处跑去，裙摆挂满了露珠。有聪明的母亲，见孩子总往林子里跑，便悄悄跟在后头，想看个究竟。可她走到树下，只听见风过树叶的沙沙声，那歌声却像有意躲着她，一声也听不见。"
 SUM_Neo.23.a:"把卷宗封存"
 SUM_Neo.23.b:"把卷宗摊开"
 SUM_Neo.24.t:"拉娜无迹"
 SUM_Neo.24.d:"巡林官拉娜，这些日子竟失踪了。遍寻禅那园内外，都不见她的影子，同伴们急得像热锅上的蚂蚁。有人最后见到她时，她正跟着几个兰那罗，往雨林最深处走。那些兰那罗围着她打转，唱着听不懂的歌，她便像着了魔一般，一步步跟了进去，回过头来还朝同伴笑了笑。等众人再寻时，早已没了踪迹。有见多识广的说：怕是跟着兰那罗，走进了梦的世界。那梦的世界是个什么地方，谁也说不清，只道进去了的人，便再难回来。同伴们点起火把，在林子里找了一整夜，只寻见她遗落的一条头巾，挂在荆棘上，被露水打得透湿。那头巾后来被同伴带了回来，交到提纳里手里。提纳里盯着它看了半晌，说她多半是平安的，只是去了个我们到不了的地方，急也急不来。"
 SUM_Neo.24.a:"按学者的判断行事"
 SUM_Neo.24.b:"按自己的判断行事"
 SUM_Neo.25.t:"枕中天地"
 SUM_Neo.25.d:"那拉娜既入了梦的世界，兰那罗便把这个世界，慢慢摊开在她面前。但见四下里光怪陆离，树木会说话，花草能唱歌，一切都在轻轻地浮动，连脚下的土地都软绵绵的。远处有溪流倒着流淌，鱼儿在半空中游弋，仿佛天地间的一切，都在这里翻了个身。更奇的是，这梦的深处，竟还留着一道影子，端端正正地立着，周身笼着一层淡淡的光。有那兰那罗指给她看，叽叽喳喳地说，那就是大慈树王留下的影子。拉娜定睛瞧去，那影子朦胧苍翠，似曾相识，那轮廓她曾在绘本上见过千百遍，忽觉心头一酸，眼泪便扑簌簌落了下来。她这才明白，须弥的记忆并没有全丢，还藏在这梦的世界里，等着有心人来寻溪流尽头，光影渐淡，那影子却愈发分明。"
 SUM_Neo.25.a:"遵循教令院的旧例"
 SUM_Neo.25.b:"听雨林与沙漠的声音"
 SUM_Neo.26.t:"歧路当决"
 SUM_Neo.26.d:"到了这步田地，三条路明明白白摆在须弥面前。头一条，是打开净善宫，把草神迎回来，仍旧奉她为主，一切照旧例行事。第二条，是把教令院的权力交出去，学者与沙漠民各分一半，大家共管国事，谁也别想独大。第三条，是把那造神计划硬着头皮做完，另立一个新神。这三条路，条条都有人主张，条条都有人反对，端的谁也说不清。有那老臣拍着桌子主张迎回神明，说神明乃国之根本，不可一日虚悬；有那少壮派嚷着要分权，说教令院独断专行久矣，非改不可；还有人躲在暗处，偷偷盘算着造神的好处，想借新神上位。众人争到后来，脸红脖子粗，谁也说服不了谁，从日中直吵到日头偏西。茶续了三道，殿上的灯点起来了，人还不肯散。"
 SUM_Neo.26.a:"把卷宗封存"
 SUM_Neo.26.b:"把卷宗摊开"

 #################### 甲线 · 圣树加冕 ####################
 SUM_ST_Crown_of_the_Sacred_Tree:"神木受册"
 SUM_ST_Crown_of_the_Sacred_Tree_desc:"净善宫那扇沉重的大门，被人缓缓推开。被囚了五百年的小吉祥草王，一步步走出囚笼，阳光落在她身上。是日，须弥的天空头一回为她亮起，云开雾散，金光万道。守门的卫士垂手侍立，有几个竟偷偷抹起眼泪来。"
 SUM_ST_Sanctuary_Open:"净善宫启扉"
 SUM_ST_Sanctuary_Open_desc:"年轻卫士刚抬起眼，老卫士的肘子就到了，他赶紧低下头去。守门的奉了命，两扇大门这才慢慢朝两边分开。门轴吱呀一声，闷响在殿里回荡，五百年不见天光的尘被一道透进来的光惊起，在半空里打着旋。卫士们垂手站着，谁也不敢看那门里的身影。年轻卫士大气不敢出，只听见自己的心咚咚跳。"
 SUM_ST_Sanctuary_Free:"去神桎梏"
 SUM_ST_Sanctuary_Free_desc:"那锁链当啷一声落地，惊起殿中一片尘埃。小吉祥草王抬起脚，头一回走出困了她五百年的囚室。脚步轻轻，却像踩在众人心上，满殿的人都不由得屏住了呼吸。连那素来冷静的老学究，也觉着嗓子眼里发紧。"
 SUM_ST_Sanctuary_Crown:"草神之冕"
 SUM_ST_Sanctuary_Crown_desc:"众人商定为草神戴上冠冕，这一回再不是看守的姿态，而是满心敬奉。老匠人连夜赶制，冠上缀满细翠叶。戴上霎时，满殿的人齐齐拜伏，山呼之声震得殿角微颤。有个老匠人揉着眼道：「老汉做了四十年匠人，今日算没白做。」"
 SUM_ST_Sanctuary_Court:"庙堂议政"
 SUM_ST_Sanctuary_Court_desc:"首座们一个个上前来回话，谁也不敢藏着掖着。草神听得很仔细，偶尔插一句，问得人冷汗直冒。轮到明论派那位，话才说半句就卡了壳。草神笑了一笑：「你这笔账，怕是没理清。」那首座当场两腿发软，额上的汗顺着鬓角往下淌。这一日她临朝听政，六派俯首，威仪落在殿上每一个角落。"
 SUM_ST_Sanctuary_Monastery:"净善宫梵众"
 SUM_ST_Sanctuary_Monastery_desc:"净善宫复了旧日规矩，祭司们重新诵读那荒疏已久的古礼。晨钟暮鼓，一响满城可闻，香火也渐渐旺起来。有个老人听了那钟声，忍不住抹泪，说道：「这光景，阔别了五百年喽！」旁边的人听了，也都觉着眼眶发热。"
 SUM_ST_Sanctuary_Pilgrim:"千里谒庙"
 SUM_ST_Sanctuary_Pilgrim_desc:"「慢慢走，总能到。」老婆婆拄着杖，走得气喘，嘴里还念叨着。前头的人回头扶她一把，队伍又缓缓往上挪。通往净善宫的山道上，朝圣者排成一条长队，蜿蜒几里不断。有人赤着脚一路叩首，有人捧着供果，风尘仆仆，脸上却满是虔诚。山路再陡，也挡不住众人的脚步。有个年轻人想抄近道，被旁边人一把拉住：「心不诚，走捷径也是白搭。」"
 SUM_ST_Sanctuary_Shrine:"草神旧祠"
 SUM_ST_Sanctuary_Shrine_desc:"雨林和沙漠各处，都立起了草神的圣所。画工照着旧图描壁，石匠把柱子镂空，样样做得精细。四乡的百姓赶来参拜，香火旺得很，连偏僻角落也聚了人。有个画工蹲在壁画前补最后一笔，有人问他画的是什么，他头也不抬：「这面墙，画到老也画不完。」问的人没趣，走开去看别处了。"
 SUM_ST_Sanctuary_Reform:"神谕更张"
 SUM_ST_Sanctuary_Reform_desc:"草神颁下一道新教谕，把教令院滥用已久的旧条，一条条废去。那些靠着旧规作威作福的官儿，登时失了靠山，敢怒而不敢言。市井百姓听了，无不拍手称快。有个卖水的汉子把担子一撂，叫道：「这道教谕，早该来了！」众人轰然附和。"
 SUM_ST_Sanctuary_Temple:"殿宇重兴"
 SUM_ST_Sanctuary_Temple_desc:"那些荒废多年的神殿，如今重新动工修起。工匠昼夜赶工，斧凿声不绝于耳。断了的石柱重新立起，剥落的壁画一点点补全。有个老匠人抚着石壁，指头一遍遍摩挲那旧刻的纹路，叹道：「总算等到这一天了。」说罢，眼眶竟有些红。"
 SUM_ST_Sanctuary_Doctrine:"神权垂训"
 SUM_ST_Sanctuary_Doctrine_desc:"石碑立在堂前，上头刻着新的教义，诏告天下。往后草神说的话，盖过六派所有争辩，任凭生论素论如何花言巧语，也动不了分毫。六派首座心里不服，面上却只能低头。有个首座盯着碑文看了许久，最后长叹一声，转身走了几步又回头望望，到底没再说半个字。"
 SUM_ST_Sanctuary_Clergy:"册拜诸职"
 SUM_ST_Sanctuary_Clergy_desc:"「雨林和沙漠，这回总算扯平了。」沙漠来的那位，偷偷扯了扯身边雨林同伴的袖子，压低了嗓子。草神册封新一任神职，出身雨林的与来自沙漠的，各占半数，这般安排用心良苦，叫两边都无话说。受封者披上崭新祭袍，齐齐叩谢，殿上殿下皆大欢喜。那雨林同伴点了点头，脸上也带着笑，两人相视一眼，都把心里的疑虑放下了。"
 SUM_ST_Sanctuary_Law:"垂宪立制"
 SUM_ST_Sanctuary_Law_desc:"「这世道，总算有说理的地方了！」那含冤多年的人，捧着法典一路叩阍，终于昭雪，出来时哭得像个孩子，逢人便说这一句。神权法典颁行天下，一条一律，都以草神之名施行。从此断案不再看谁官大，只看法典怎么写。市井里也唱起新调童谣，句句都在颂这法典。有个孩童在巷口唱着，被他爹笑着拍了下脑袋：「唱得好，回家唱给你娘听。」"
 SUM_ST_Sanctuary_Throne:"宝座加尊"
 SUM_ST_Sanctuary_Throne_desc:"小吉祥草王坐上了净善宫的宝座。须弥人头一回朝着自家的神明俯首，山呼之声震得云彩都散了。她低眼看着阶下的人，目光里尽是慈悲。阶下有个老妇跪着，仰起脸，嘴唇抖了半天才喊出一声，声音哑得几乎听不见。旁边的小女孩也跟着跪下，学大人合掌，眼珠却滴溜溜往宝座上转。"
 SUM_ST_Dream_Gate:"叩梦之扉"
 SUM_ST_Dream_Gate_desc:"虚空终端一闭，那些被收走的梦，一桩桩又回到须弥人枕边。当夜城里静得出奇，只听得屋顶藤叶沙沙响。有个老者醒来，摸着枕畔草席，喜极而泣，说道：「梦里见着了，坐在枣椰树下喝汤，还是旧日的模样。」说着，又用袖子揩了揩眼。"
 SUM_ST_Dream_Sabzeruz:"花神诞祭再启"
 SUM_ST_Dream_Sabzeruz_desc:"花神诞祭重新办成了国之盛典，不再只是学者关起门来的表演。街头巷尾搭起彩棚，百姓与学者一同起舞，锣鼓喧天，火把照得夜如白昼。连守摊子的小贩也跟着拍手，索性把担子一撂，挤进人堆里跳将起来。"
 SUM_ST_Dream_Night:"永夜求梦"
 SUM_ST_Dream_Night_desc:"「这觉睡得，连贼都不来了。」值夜的更夫敲过三梆，驻足听了听，笑出了声。长夜漫漫，那久违的梦，重新回到每个人枕边。孩子们梦见在花丛里追逐，老人们梦见了年轻时的模样。须弥这一夜安宁得很，连猫儿都不叫唤。更夫又往前走了几步，见家家户户都熄了灯，索性把梆子搁下，靠着墙也打起盹来。"
 SUM_ST_Dream_Mushroom:"毒蕈成丛"
 SUM_ST_Dream_Mushroom_desc:"雨林里的蘑菇得了梦里溢出的气息，一簇簇猛长，个个肥嫩。采药人见了喜出望外，采满一篓，晒干入药，专治睡不着的毛病，灵验得很。老药农把蘑菇摊开来晾，咂着嘴说：「邪门，真是邪门。」有个睡不好的人吃了几天，一觉睡到天亮，提着鸡蛋来道谢，老药农笑得合不拢眼。"
 SUM_ST_Dream_Theater:"筑梦之台"
 SUM_ST_Dream_Theater_desc:"妮露在剧场里重演花神，舞姿翩跹，看得人如痴如醉。台下看客里，既有衣冠楚楚的学者，也有剃了头、披着沙巾的沙民，一同叫好。喝彩声掀翻了棚顶。有个沙民把手中水囊往地上一顿，扯着嗓子喊：「好！再来一段！」"
 SUM_ST_Dream_Dance:"踏歌花神之舞"
 SUM_ST_Dream_Dance_desc:"「这舞，倒有新意。」台下那个老学究本想挑礼数不周，看着看着，却跟着点了头，嘴里还嘀咕出声。花神之舞重新编排，删去那些繁文缛节，添进雨林与沙漠的舞步。舞者从两处一同选出，赤脚踩在花地毯上，脚铃清脆。这般光景，前所未见。旁边有人听见老学究嘀咕，凑过来问：「您老不是说这舞不合礼数么？」他把眼一瞪：「礼数是死的，人是活的。」"
 SUM_ST_Dream_Song:"兰那罗清歌"
 SUM_ST_Dream_Song_desc:"兰那罗传唱的歌谣，被学者一字一句记成文字，端端正正收进须弥典籍。从此这雨林小调，不再只靠口耳相传，读书人也能展卷而歌。田间小儿唱它，学堂先生也唱它。有个老先生摇头晃脑地念着，忽然拍案：「好句子！这便是天籁。」"
 SUM_ST_Dream_Record:"梦录其状"
 SUM_ST_Dream_Record_desc:"「这个……不记也罢。」害羞的后生醒来后，忙把记梦的纸往席子底下一塞，脸涨得通红。学者们生出兴致，把各人的梦一一记下，当作研究的材料。有的梦天马行空，有的梦琐碎寻常，厚厚叠了几大摞。同屋的学友伸手要去抽那张纸，被他一把按住，急道：「没什么好看的，都是些没影的事。」学友笑着缩回手，他也讪讪地笑了。"
 SUM_ST_Dream_School:"梦学开宗"
 SUM_ST_Dream_School_desc:"妙论派的画师，与素论派的天象学者，索性合开了一门梦的学问。一个用画笔描摹梦中光景，一个用星盘推演梦的来由，两下里珠联璧合，引来无数旁听。有个学生听得出神，笔都忘了动，直道：「原来梦也有这般讲究。」"
 SUM_ST_Dream_Heal:"假梦医创"
 SUM_ST_Dream_Heal_desc:"「这些年，头一回睡得这么踏实。」老兵醒来时眉头舒展，摸着身上的旧伤，长长叹了一口气。医者另辟蹊径，用温柔的梦去安抚那些陈年旧伤。战场上落下的病根，饥荒里熬出的心结，都在梦里慢慢化开。同屋的病友见他气色好，问用了什么法子，他指了指枕头：「就是睡，睡梦里什么都没有，反倒把这些乱七八糟的念头都睡没了。」"
 SUM_ST_Dream_Memory:"往味难忘"
 SUM_ST_Dream_Memory_desc:"绿洲里的人家，喜欢把旧日回忆端上桌，与远来的旅人分享。一壶椰枣酒，几碟小菜，说到动情处，满座唏嘘。旅人听了，也想起自家故乡。有个汉子说到一半，声音哽住，掩着面走了出去，众人也不拦，只管续上酒。"
 SUM_ST_Dream_Truth:"梦中得实"
 SUM_ST_Dream_Truth_desc:"「这是谁抹的？」那学者惊出一身冷汗，颤声问出来。草神在梦中，向他展示世界树被涂抹的一段记忆。但见好好的一行字迹，被人硬生生抹去，留下一片刺眼的空白。草神不答，只把那空白又亮了亮。学者盯着那片空白，越看越觉得心惊，伸手想去摸，指尖却什么也触不着。他猛地抬头，草神已经不见了。"
 SUM_ST_Dream_Eternal:"令梦不绝"
 SUM_ST_Dream_Eternal_desc:"须弥这一回，竟陷进一场绵绵长梦。梦里没有饥荒，没有疫病，也没有恼人的遗忘；街口馕炉日夜不熄，人人脸上带笑。只是这梦太甜，甜得叫人不愿醒来。几个学者私下议论，说话都压着嗓子，怕被梦里的人听去。有个低声道：「再这么睡下去，只怕……」话未说完，被人一把捂了嘴。"
 SUM_ST_Ara_Meet:"邂逅兰那罗"
 SUM_ST_Ara_Meet_desc:"草神亲自领着学者，一步步走进幽深雨林，去与兰那罗相见。那些小精灵起初躲在叶后，探出半个脑袋；见草神笑容温和，才怯生生围上来。有个小的捧出一枚果子，塞进她手心里，仰头问道：「你就是草神么？」草神蹲下身，笑着点头。"
 SUM_ST_Ara_Hymn:"兰那罗讴歌"
 SUM_ST_Ara_Hymn_desc:"兰那罗唱的赞美诗，被译成须弥文字，在城中不胫而走。读书人捧着译稿反复吟诵，只觉字句清丽，满口生香。孩子们更是争相传抄，当作新奇儿歌。有个书生念到得意处，拍案叫好：「这等句子，竟出自林中小辈！」"
 SUM_ST_Ara_Vana:"庄梦依稀"
 SUM_ST_Ara_Vana_desc:"维摩庄的孩子们，这一日又听见久违的兰那罗之声。那声音顺着风，穿过树梢，轻轻落进院里。孩子们丢下手里的活计，循声跑进林子，笑声惊起满树飞鸟。有个孩子边跑边喊：「等等我们！」几个大人追出来，却也站住听了。"
 SUM_ST_Ara_Rana:"拉娜生还"
 SUM_ST_Ara_Rana_desc:"失踪的拉娜平安回村，怀里还揣着兰那罗托付的一颗种子。众人围上来问长问短，她只笑而不答，把种子埋进屋后土里，浇了一瓢井水。说也奇怪，那土上当日便冒出一点新绿，叶尖卷着，像刚睡醒的小兽。有个小孩蹲着看了半晌，叫道：「它动了！它真动了！」"
 SUM_ST_Ara_Seed:"兰那罗播籽"
 SUM_ST_Ara_Seed_desc:"「好，总算没白等。」守林的老汉蹲在旁边，捋着胡子笑，拿手轻轻把土又培上一些。那颗曾经枯萎的种子，被郑重埋进禅那园沃土。人们日日来浇水看守，盼它发芽。头几日毫无动静，直到一场春雨过后，土里才钻出一点嫩绿。老汉招手喊来几个年轻人看，那嫩绿在风里轻轻晃着，几个人蹲成一圈，谁也舍不得伸手去碰。"
 SUM_ST_Ara_Flower:"掇那菈英"
 SUM_ST_Ara_Flower_desc:"「这个……给你。」后生红着脸，把花递过去。那菈花在雨林边缘悄悄开放，花瓣上还沾着晶莹的露水。兰那罗说，这花是约的信物，谁若真心相待，它便为谁开放。姑娘接过去，低头一笑，把花别在发间。后生见她收了，心里一块石头落地，挠着头半天说不出下一句话。旁边路过的兰那罗悄悄笑了一声，两人谁也没察觉。"
 SUM_ST_Ara_Kusava:"俱利伽罗草"
 SUM_ST_Ara_Kusava_desc:"「这药，倒真把我从鬼门关拉回来了。」那病人坐起来，脸上渐渐有了血色。俱利伽罗的草被采来入药，专治那些被禁忌知识侵蚀的人。这草看着寻常，煎成汤药却灵验异常。医者视它如救命仙草，藏得很仔细，连晒药都自己一个人守着。有个学徒想多看一眼，被他伸手挡住：「这草金贵，少碰为妙。」"
 SUM_ST_Ara_Kalpalata:"撷取劫波"
 SUM_ST_Ara_Kalpalata_desc:"劫波莲这般奇物，只在梦的最深处悄然开放，一现便凋谢。兰那罗小心翼翼采下，捧去献给草神。草神接过来，笑道：「这心意，比花还珍贵。」那花在掌中一现即谢，香气却留了整日。旁边的小兰那罗都踮着脚看，舍不得眨眼。"
 SUM_ST_Ara_World:"枕中天地"
 SUM_ST_Ara_World_desc:"梦境的四周，不知何时围出一圈那菈花，花影连成一道墙。草神与兰那罗立下规矩：梦是大家的梦，进门前先递个话。从此再没人敢翻进别人的梦境乱动。有一回一个莽撞的精怪想越界，被那菈花拦住，兰那罗笑眯眯道：「此门不通，回去吧。」"
 SUM_ST_Ara_King:"兰那罗共主"
 SUM_ST_Ara_King_desc:"林子里选王，不比别处敲锣打鼓。兰那罗们围着新王，唱的唱跳的跳，闹得枝叶乱颤。这王生得平常，却人人服它，分派差事从不乱套。它抬手压了压，声音不高：「都回自个儿的岗位去，别误了事。」大伙儿这才收了声，四散走开。"
 SUM_ST_Ara_Alliance:"兰那罗合盟"
 SUM_ST_Ara_Alliance_desc:"兰那罗与须弥正式立下盟约，同护雨林的根。盟书刻在古树上，双方各执一半。谁若背约，另一方便可凭这半纸盟书问罪。从此人与精灵同心协力，再不许人乱砍滥伐。有个老兰那罗把盟书摸了又摸，叹道：「这回，林子有靠山了。」"
 SUM_ST_Ara_Blessing:"兰那罗降嘏"
 SUM_ST_Ara_Blessing_desc:"兰那罗的祝福，轻轻落在须弥每一棵树上。那些树得了祝福，枝叶越发繁茂，花开得更盛，连路边老树都抽出新芽，满城皆是生机。有个种果的老农仰头看了看，咂嘴道：「今年这果子，怕是要甜上几分。」"
 SUM_ST_Ara_Covenant:"树下要盟"
 SUM_ST_Ara_Covenant_desc:"绿荫之约郑重立下：凡是兰那罗所守的林子，须弥上下一概不伐；违者不论身份，一律重罚。此约一出，伐木的斧头都收了起来，雨林得以安宁。有个不服的还犟嘴，被众人按着在盟书上签了名，只得悻悻走了。"
 SUM_ST_Tree_Root:"盘根树庭"
 SUM_ST_Tree_Root_desc:"地底下藏着一张大网，那是世界树的根，横的竖的，铺满须弥。草神低头瞧着，开口道：「这些根须记得所有事，把万物都拴在一块儿。」旁边一个学者蹲下去，顺着一条根往土里望，越望越看不到头，忍不住啧了一声。草神点头：「看不见的，才是根。」"
 SUM_ST_Tree_Dream:"梦绕树庭"
 SUM_ST_Tree_Dream_desc:"世界树也有它的梦。梦里没有这五百年的种种劫难，还是大慈树王在时的光景：草木繁盛，众生安乐。那梦深得很，轻轻一窥便叫人沉醉。有个学者窥过一回，醒来竟哭了半宿，旁人问他，他只摇头：「太好了，好得叫人难受。」"
 SUM_ST_Tree_Rukkhadevata:"树王遗绪"
 SUM_ST_Tree_Rukkhadevata_desc:"大慈树王留下的东西实在不多，不过一条被人涂抹的印记，一段再无人记得的名字。可就是这一点半爪，仍藏着天大的秘密。草神捧着它，久久沉默。旁边的学者想问，见她神色，又把话咽了回去。"
 SUM_ST_Tree_Irminsul:"伊尔明苏尔古篆"
 SUM_ST_Tree_Irminsul_desc:"世界树在低声絮语，说的正是五百年前那场大遗忘。那声音含混不清，忽高忽低，像是有话难言。草神侧耳听了许久，神色渐渐凝重。半晌，她一句话也说不出，只把手轻轻按在树干上，像是要安慰它。"
 SUM_ST_Tree_Memory:"涤除旧识"
 SUM_ST_Tree_Memory_desc:"草神忽然想起一个名字，提笔写在纸上，写罢却又亲手将它抹去。那字迹被涂成一团墨渍，再辨不清。她望着那团墨，眼中似有万千心事，指尖还沾着未干的墨痕。旁边的学者探头想看，她把纸一合，说道：「这个，不必看了。」"
 SUM_ST_Tree_Recall:"复其故称"
 SUM_ST_Tree_Recall_desc:"她想把那个名字重新写回世界树，笔举在半空，却迟迟落不下去。那一笔重若千钧，难以下定决心。良久，笔尖的墨滴落，纸上一团晕染。她终是把笔搁下，起身推窗看树，望着那满眼苍翠，半晌不语。"
 SUM_ST_Tree_Wither:"枝丫枯萎"
 SUM_ST_Tree_Wither_desc:"世界树有一枝正渐渐枯萎，叶子发黄，生机断绝。学者们围着它查了又查，翻遍典籍，也找不出半点缘由。草神看了，只是轻轻摇头。园中诸人面面相觑。有个年轻学者忍不住问：「难道是天意？」草神不答。"
 SUM_ST_Tree_New:"白枝初萌"
 SUM_ST_Tree_New_desc:"那枯枝旁边，竟抽出一枝雪白新条，在满目苍翠中格外醒目。草神说道：「这是须弥自己长出来的，不必仰仗他人。」众学者看了，惊讶得说不出话。有个伸手去摸，指尖刚挨上，又慌忙缩了回来，笑道：「这白的，倒真稀奇。」"
 SUM_ST_Tree_Scroll:"树腹藏书"
 SUM_ST_Tree_Scroll_desc:"世界树下埋藏多年的典籍，被小心翼翼挖了出来。那上头的字古奥难认，写满无人能读的符号。学者们摊开卷轴，面面相觑，竟无一人能识，只好请来几位老贤者一同参详。一个老贤者眯着眼看了半晌，道：「这字迹，倒像是更古的年份。」"
 SUM_ST_Tree_Sage:"树王藏智"
 SUM_ST_Tree_Sage_desc:"树王留下的智慧，被整理成一册册典籍，成了须弥各派共用的根基。生论素论也好，知论妙论也罢，都要从这里取材。学者们奉它为圭臬，日日研读不倦。有个年轻学子捧着书，边读边记，连饭都忘了吃。"
 SUM_ST_Tree_Light:"净光普照"
 SUM_ST_Tree_Light_desc:"那净化的光，一道道照进世界树的裂隙里。但见黑气滋滋作响，节节败退，连那盘踞已久的死域，也一点点退开去。草木逢光，重又挺直腰杆。守在一旁的巡林官握紧了刀，看得出了神，半晌才吐出一口气。"
 SUM_ST_Tree_Truth:"根下隐情"
 SUM_ST_Tree_Truth_desc:"城里炸开了锅：原来如今这位草神，不是头一位。老人们摇头叹气，年轻人围上来问个没完。草神没有躲闪，当众点了头。一个白胡子老头挤到前头，声音发抖：「那先前那位呢？」草神沉默半晌，抬手指向那棵树：「你要找的人，全在树里头。」"
 SUM_ST_Tree_Eternal:"圣树不凋"
 SUM_ST_Tree_Eternal_desc:"世界树万古常青，枝叶扶疏，荫庇着一方水土。在它那深密根须之下，埋着新旧两位草神共同的记忆，一桩桩一件件，都化作树的年轮。后人若要追索旧事，只须数这树上的圈。有个老者对小辈说道：「读史不必翻书，数数这树便够了。」"
 SUM_ST_Rain_Watch:"林薮置戍"
 SUM_ST_Rain_Watch_desc:"巡林队这一回大大扩编，雨林边界头一回有了常年驻守的守望。哨塔一座接一座立起，巡林官带着猎犬来回巡查。从此盗伐者不敢轻易入境，林子安宁了许多。有个盗伐的刚探个头，望见塔上的旗，扭头便跑。"
 SUM_ST_Rain_Ranger:"增置林尉"
 SUM_ST_Rain_Ranger_desc:"提纳里管着巡林官，手下尽是林子里滚大的猎户。哪条兽道通哪里，一声鸟叫是吉是凶，他们闭着眼都清楚。提纳里带着这班人守边，使得顺手。一天夜里，众人守着篝火，一个老猎户忽然朝远处比了两声，提纳里立刻起身：「有情况，抄家伙。」"
 SUM_ST_Rain_Patrol:"林间巡徼"
 SUM_ST_Rain_Patrol_desc:"巡林官们沿着那叶脉一般纵横的小径，来回巡逻不停。他们脚步轻巧，穿行树影之间，留意每一处异动。遇有倒木阻路，便顺手清理干净。夜里靠着树干打个盹，天没亮又起身。有个年轻的困得直点头，被队长拿树枝一拨，激灵一下便醒透了。"
 SUM_ST_Rain_Gandharva:"禅那园置戍"
 SUM_ST_Rain_Gandharva_desc:"禅那园筑起一道道防线，木栅深沟，层层设障，硬把死域挡在林子外头。死域蔓延到栅前，再也进不得半步，园中草木得以保全。猎人们守了三夜，眼都熬红了。有个揉着眼道：「它再敢近一步，我便拿火把烧它个干净！」"
 SUM_ST_Rain_Village:"村坞相保"
 SUM_ST_Rain_Village_desc:"林中各村商定：一家有事，四面来帮。村口都架起大鼓，鼓一响，邻村的人提着刀就赶过来。盗匪和死域从此讨不到便宜，百姓夜里睡得踏实。有个头回听见鼓响的娃娃刚要哭，被大人一把捂住嘴：「噤声，有贼来了。」"
 SUM_ST_Rain_Poison:"芟除死域"
 SUM_ST_Rain_Poison_desc:"那害人的死域，被巡林队一处接一处清剿干净。黑气散去，焦土重新泛绿，草木一棵棵又长出来。溪水也复了清亮，鱼虾重新游弋其中。巡林队收兵回营，路上哼起小调。有个走在后头的，弯腰捧了口溪水，笑道：「这水，甜了。」"
 SUM_ST_Rain_Beast:"林藏怪兽"
 SUM_ST_Rain_Beast_desc:"雨林里的巨兽，重新有了安稳家园，不必四处游荡。它们回到深林洞穴，饮水觅食，竟不再袭击村落的牲畜。村民与野兽，各安其生。只是夜里仍能听见远山低吼。有个村民拍拍胸口：「听着吓人，倒也安心，它在山里呢。」"
 SUM_ST_Rain_Medicine:"入林采药"
 SUM_ST_Rain_Medicine_desc:"大夫开方子，不再为找药发愁了。原先缺医少药的村子，如今库房里也堆满了常用药材。草药从林子里采回来，一味味归类、晒干、炮制，收进匣中。老药农领着徒弟站在药架前，手指点过一排排抽屉：「这一格治头疼，那一格管腹泻，记牢了，别抓错。」"
 SUM_ST_Rain_Mushroom:"蕈谱新修"
 SUM_ST_Rain_Mushroom_desc:"蘑菇不再是可有可无的野味了。生论派的人把它当成一门正经学问，分门别类画了图，毒性一味味试出来，写成册子。从前山里人随便采来吃的菌子，如今摆上了学者的书案。一个老学究捧着那册子，眉毛一扬：「别瞧这菌子不起眼，里头的门道深得很。」"
 SUM_ST_Rain_Conserve:"申严禁伐"
 SUM_ST_Rain_Conserve_desc:"教令院颁下禁伐令，那些乱砍滥伐的刀斧，统统收了上去。守林卫士沿路巡查，见有偷伐的便严加惩处。雨林里的树木，总算喘过一口气。村里老猎户摸着树皮，半日不说话，末了轻声道：「这才像话。」"
 SUM_ST_Rain_Guard:"绿营初立"
 SUM_ST_Rain_Guard_desc:"翠绿卫队正式成军，专司雨林与圣树的护卫。他们披着绿甲，手执长戈，日夜轮流值守。有了这支人马，再有歹人敢打林子的主意，先要问过他们手中之刀。有个新兵头回上岗，握着戈手心冒汗，队长低声道：「稳住，别慌。」"
 SUM_ST_Rain_Forest:"林疆大定"
 SUM_ST_Rain_Forest_desc:"一只野兔钻进林子，刚探头就被人揪住了后颈。巡林官拨开草丛，笑道：「这回看你往哪儿跑。」整片雨林，从山头到谷底，溪边到密林，早已划给巡林官看守。他们布下的眼线像张网，林子护得铁桶也似，什么活物溜进来都瞒不过。"
 SUM_ST_Rain_Forever:"万木长春"
 SUM_ST_Rain_Forever_desc:"林口站着个老巡林人，听了半晌鸟叫，长长吐出一口气：「这才像话，这才像话。」雨林又变回学者们来之前的样子：藤蔓缠着古树，野兽在林间穿行，鸟儿在枝头鸣唱。那份宁静，就像从来没有谁进来搅和过。"
 SUM_ST_Seal_Whisper:"禁语萦回"
 SUM_ST_Seal_Whisper_desc:"三更时分，石室中隐隐有了动静，细碎的，像谁在翻书页。那些封存的卷宗里，禁忌知识到夜里就作怪。守库人汗毛都竖起来，刀攥得死紧，却挪不动脚，冲门里喝道：「什么人躲里头？」半晌没人应，他只好退回灯影，再不敢上前。"
 SUM_ST_Seal_Study:"邪禁惑心"
 SUM_ST_Seal_Study_desc:"有个胆大的学者，到底忍不住，偷偷翻开那册禁书。才看几行，便觉头晕目眩，眼前浮现出不该见的景象。他慌忙合上，手抖个不住，嘴里直念叨：「罢了，罢了！」此后夜里常做噩梦，再不敢近那书架。"
 SUM_ST_Seal_Reject:"尽缄禁帙"
 SUM_ST_Seal_Reject_desc:"那些害人的禁书，被一册册封进坚固石室，厚重石门一合，再难开启。那钥匙郑重交到草神手中，由她亲自保管。从此谁也别想再轻易翻看。石室外头，还派了卫士日夜轮守。有个新来的卫士问要守到几时，老卫士道：「守到这钥匙烂了为止。」"
 SUM_ST_Seal_Net:"张幕为界"
 SUM_ST_Seal_Net_desc:"草神在世界树四周，设下一道严密结界。那结界无形无质，却能挡住一切侵扰。有不怀好意的念头靠近，便被悄无声息弹回去。守界的修士只须闭目端坐，便可安然无事。有个好奇的伸手去探，指尖像撞在墙上，惊道：「嘿，真有东西！」"
 SUM_ST_Seal_Corrupt:"儒冠渐腐"
 SUM_ST_Seal_Corrupt_desc:"大白天里，一个学者对着墙壁自言自语，神色恍惚，话都说颠倒了。原来是禁忌知识把他迷了心窍。这事传出，须弥上下都惊了，纷纷把自家藏书重新清点。这一查，竟翻出不少漏网之物。管库人一头冷汗，叹道：「差一点就闯下大祸。」"
 SUM_ST_Seal_Purge:"芟除邪法"
 SUM_ST_Seal_Purge_desc:"私练禁术的窝点，被巡林队和翠绿卫队一个个拔掉。破门、抄书、拿人，半点情面都不留。有一处还藏着间暗室，也叫人一锅端了。有个头目被按翻在地，还扯着嗓子喊冤：「小人不过是图个新鲜！」这一通整治，真是雷厉风行。"
 SUM_ST_Seal_Nail:"神钉镇罪"
 SUM_ST_Seal_Nail_desc:"那根判罚之钉，是赤王年间留下的。学者们把它取出来，量了一遍又一遍，每一寸都记下，可它到底派什么用场，谁也说不上来。钉子寒气逼人，摸一把透骨凉。一个年轻学者刚用指尖挨近，就忙不迭缩手：「这物件，邪门得很。」"
 SUM_ST_Seal_Nib:"尼伯龙潜影"
 SUM_ST_Seal_Nib_desc:"那来自世界之外的力量，在裂隙里翻了个身。只一瞬间，须弥的天空便暗了一暗，日月无光，风也骤停。众人仰头惊望，心里都生出一种不祥。教令院的钟，无风自响了三声。有个老者脸都白了，喃喃道：「这钟，从不白响的。」"
 SUM_ST_Seal_Sand:"锁此巨虫"
 SUM_ST_Seal_Sand_desc:"沙海底下那条沙虫，沉睡多年，忽然拱起一道沙浪，把过路驼队吓得四散。教令院连夜点起香火，念咒的念咒，填沙的填沙，好容易将它按回原处。封土的人手都在抖，不敢回头，只听见身后沙还在往下陷，领头的喝道：「快走，别停！」"
 SUM_ST_Seal_Abyss:"闭门拒渊"
 SUM_ST_Seal_Abyss_desc:"殿外的侍从只见灯火抖了抖，便定了。一个小侍从低声问：「神上，方才什么响动？」草神摇头：「无妨，看好你的门。」原来虚空里有人在低语，说的不是须弥的言语。草神独自坐在净善宫里，闭着眼不理，任那些话在耳边骚扰，手在膝头攥得发白。"
 SUM_ST_Seal_Oath:"守誓之众"
 SUM_ST_Seal_Oath_desc:"一个年轻人把掌心的血在石面上抹匀，咬紧牙关没吭一声。封印前聚满了立誓的人，人人割开手掌按上血。为首的高声开口：「只要还有一口气，这印就塌不得！」众人应了一声，声音不高，却齐整得很。从此大家分头守夜，回家二字再没人提。"
 SUM_ST_Seal_Eternal:"万祀封缄"
 SUM_ST_Seal_Eternal_desc:"封印落成当日，教令院把最后一块石碑立起，碑上不刻名，只刻一道纹。从此须弥与那禁忌之地中间，隔着一整片雨林，树长得比塔还高。风声过林，像有人在里头走动。有个巡林人夜半听见响动，喝问一声，林子里却没人应。"
 SUM_ST_Seal_Final:"渊户终闭"
 SUM_ST_Seal_Final_desc:"封渊既成，世界树的叶子一夜之间不再作响。草神在净善宫里坐了很久，才把肩头松下来。侍从端上热茶，她没喝，只说道：「今夜不必点灯。」窗外的雨停了，檐上还在滴。侍从应一声，轻轻退出去，把门带上。"
 SUM_ST_The_Crowned_God:"翠冕加身"
 SUM_ST_The_Crowned_God_desc:"这日净善宫前铺了红毯，雨林的使者站在左，沙漠的部族站在右，两班人见了面，破天荒点了头。小吉祥草王自阶上缓步而下，受了两边的礼。沙漠那边有个头人，头一回朝雨林的人拱了拱手，双方都笑了。须弥自此换了年号。"

 SUM_Neo.27.t:"神木受册"
 SUM_Neo.27.d:"是日，净善宫那扇尘封了五百年的大门，终于被人从外头推开。门轴转动，发出吱呀的声响，像是在诉说这些年的委屈。门开处，阳光倾泻而入，照在一个小小的身影上。那被囚了五百年的小吉祥草王，一步一步，慢慢走出了囚笼。她抬起头，望向天空，眼睛里还带着几分茫然，仿佛不信这日子真能到来。说也奇怪，就在霎时，须弥的天空第一次为她亮了起来，云层层层散开，金光万道，连沙漠吹来的风都柔和了几分，连树梢的雀儿也跟着和鸣。守在门外的百姓，纷纷跪倒在地，口称神明，欢声雷动。有那老妇人，跪在地上，双手合十，泪流满面，嘴里念叨着：神明啊，你终于出来了。有那年轻人，激动得把帽子抛向了半空。"
 SUM_Neo.27.a:"让神谕通行"
 SUM_Neo.27.b:"收束信仰的边界"
 SUM_Neo.28.t:"净善宫启扉"
 SUM_Neo.28.d:"净善宫门前，站着两名卫士。这两人守门多年，从没想过有朝一日要开这扇门，平日里连靠近都不敢，只远远地望着。这一日，上头传来命令，叫他们把门打开。两人对望一眼，手都有些发抖。一个道：这可使不得，开了门，担待不起，脑袋怕是要搬家。另一个却说：上头的命令，岂敢违抗，违了命令同样是死，横竖是个死，不如听令。两人争了半晌，终究是那胆大的抽出钥匙，插进锁孔。只听咔哒一声，锁开了，声音在寂静中格外刺耳。两人各自闪到一边，垂着头，不敢看门里的景象，腿肚子直转筋。这一锁一开之间，须弥的历史便翻过了新的一页。后来那两个卫士，一个升了官，一个告老还乡，端的造化不同。那把钥匙，后来收进了内库。"
 SUM_Neo.28.a:"以草神之名行事"
 SUM_Neo.28.b:"以律条为先"
 SUM_Neo.29.t:"去神桎梏"
 SUM_Neo.29.d:"那净善宫的囚室里，小吉祥草王的身上，原缠着沉重的锁链，压得她抬不起头来。那锁链锈迹斑斑，一环扣着一环，少说也有几十斤重。门开之后，有大胆的，上前替她把锁链一根根解开。锁链落地，当啷一声，在地上砸出深深的印子，也砸在众人心上。小吉祥草王活动了一下僵硬的手腕，迈开脚步，第一次走出了那间关了她五百年的囚室。她的脚步还带些踉跄，毕竟关得太久，腿脚都麻了，几乎站立不稳，身旁的人连忙扶住，围观的百姓都屏住了呼吸。可她的眼睛，却亮得很，像藏着满天星星。有那老妇人见了，忍不住抹起眼泪来，说可怜见的，五百年呐。草王却回过身，冲她轻轻点了点头，嘴唇微动，似乎想说什么，终究没有说出口。"
 SUM_Neo.29.a:"让梦回到须弥"
 SUM_Neo.29.b:"先看住封印"
 SUM_Neo.30.t:"草神之冕"
 SUM_Neo.30.d:"草王出了囚室，六派的学者便商议着，要为她行加冕之礼。他们捧出一顶冠冕，那冠冕是用黄金与玉石做的，冠沿缀一圈干枯的帕蒂沙兰，花瓣薄得透光，在灯下熠熠生辉，是难得之物。那冠冕的样式，正是照着净善宫旧藏的图样打的，用心良苦。可问题来了：从前这些学者，都是以看守的身份来看着草王的，如今要给她戴冠，行君臣之礼，不好意思。有年长的学者，捧着冠冕的手直发抖，低着头，不敢看草王的眼睛，额上沁出了细汗，手心也攥出了水。草王却微微一笑，示意他尽管来，不必拘束，说往日之事，朕不追究。那学者这才上前，恭恭敬敬地把冠冕戴在她头上，手抖得几乎戴歪了，引得旁边人捏了一把汗。两旁众人见了，都松了一口气。殿外的钟敲过三响，廊下的香炉腾起一缕青烟。"
 SUM_Neo.30.a:"让神谕通行"
 SUM_Neo.30.b:"收束信仰的边界"
 SUM_Neo.31.t:"庙堂议政"
 SUM_Neo.31.d:"草王既已复位，便在净善宫里临朝听政。六大学派的首座，齐齐整整地立在阶下，一个个屏气凝神，不敢抬头，连呼吸都放轻了，唯恐惊扰了神明。这光景，与从前大贤者阿扎尔独断专行时，天差地别，其时众人还可以争辩几句，如今却只有俯首听命。草王坐在上头，声音虽轻，却字字清楚，句句在理。她问起生论派，生论派的首座便上前禀报；问起素论派，素论派的首座又上前；问到妙论派，那首座竟紧张得说错了话，脸涨得通红。众人你看看我，我看看你，心里都明白：这须弥国，如今是神明亲自过问了。有那曾巴结过阿扎尔的，暗暗捏了一把汗，生怕被翻旧账。有大胆的，偷抬眼看了一眼，又慌忙低下，再不敢看第二眼。"
 SUM_Neo.31.a:"以草神之名行事"
 SUM_Neo.31.b:"以律条为先"
 SUM_Neo.32.t:"净善宫梵众"
 SUM_Neo.32.d:"草王复位之后，净善宫便恢复了旧例。那些荒废了多年的礼节，一件件重新拾掇起来，连宫墙都粉刷一新，庭院里的杂草也拔得干干净净。宫里请来了几位年高德劭的祭司，他们穿着整洁的祭服，每日清晨，集合在殿前，诵读古礼。那诵经之声，嗡嗡地在宫墙间回荡，听着让人心里踏实，连檐下的鸟都不叫了，仿佛也在倾听。有年轻的侍从，从未听过这等古礼，站在旁边听得呆了，手里端着的茶都凉了，洒了一手也不觉得。草王坐在殿上，微微颔首，脸上露出久违的笑容。礼乐一兴，便意味着世道又回到了正轨，百姓心里也有了主心骨，再不必惶惶度日。殿外的老榕树下，几个香客驻足聆听，也都跟着合十。香炉里的烟升得笔直，一丝风也无。"
 SUM_Neo.32.a:"让梦回到须弥"
 SUM_Neo.32.b:"先看住封印"
 SUM_Neo.33.t:"千里谒庙"
 SUM_Neo.33.d:"草王显圣的消息一传开，四面八方的百姓，便往净善宫赶来。通往净善宫的那条山道，弯弯曲曲，平日里冷冷清清，这些日子却热闹起来。朝圣者排成了长队，从山脚一直排到半山腰，蜿蜒如龙，首尾都望不见。有拄着拐杖的老人，有抱着孩子的妇人，也有远道而来的沙漠商旅，大家操着不同的口音，说着不同的话。他们手里捧着鲜花与供品，一步一步地往上挪，谁也不着急。有体力不支的，旁边人便搀一把，递过水囊。山道两旁，有小贩摆摊卖水卖饼，生意格外兴隆，乐得合不拢嘴，连夜赶制货担。有那专人维持秩序，扯着嗓子来回吆喝，叫众人莫要拥挤，前头的慢慢走，后头的莫要催，辛苦。队伍过处，山道上的尘土积了半寸厚，风一吹，便扑了满头满脸。"
 SUM_Neo.33.a:"让神谕通行"
 SUM_Neo.33.b:"收束信仰的边界"
 SUM_Neo.34.t:"草神旧祠"
 SUM_Neo.34.d:"草王的圣名传开之后，她的圣所，便在须弥各处立了起来。不单是雨林里，就连那干旱的沙漠中，也立起了供奉草神的小庙。雨林里的圣所，用新鲜的树枝与花朵搭成，绿意盎然，蜂蝶环绕；沙漠里的圣所，则用石块垒起，虽简陋，却也打扫得干干净净，一尘不染。每逢节庆，人们便到圣所前献上花果，点起香火，袅袅升起，直升云霄。有沙漠里的孩子，第一次听说草神的名字，便仰头问：「草神是不是会给沙漠也带来绿意，让我们这里也长出树木？」老人们听了，笑而不答，只摸摸他的头，说他日便知。这圣所立的，不仅是神像，更是人心里的盼头。有远道的香客，还在庙旁种下一株小树，说要与圣所一同长大。风过处，花香与檀香混作一处，飘出老远。"
 SUM_Neo.34.a:"以草神之名行事"
 SUM_Neo.34.b:"以律条为先"
 SUM_Neo.35.t:"神谕更张"
 SUM_Neo.35.d:"草王临朝之后，第一桩大事，便是颁下新的教谕。原来那教令院滥权已久，定下许多苛条，什么禁书令，什么收税法，压得百姓喘不过气来，敢怒而不敢言。草王一条条地看，一条条地废，当着六派首座的面，把那些旧条文一条条划掉，说道：「学问本是使人明理的，不是拿来压人的，更是不是拿来发财的，你们错了。」众人听了，无不心悦诚服，连连点头。有那从前靠着旧条发财的，暗暗叫苦不迭，回家后整夜睡不着；百姓们却奔走相告，说终于有了出头之日，夜里都能睡个安稳觉。这新谕一下，犹如拨云见日，让须弥人重见了天光。有受害的百姓，听说新谕，特地赶来叩头谢恩，被草王温言劝起。那废掉的旧条文收拢起来，足有两尺高，一并烧了。"
 SUM_Neo.35.a:"让梦回到须弥"
 SUM_Neo.35.b:"先看住封印"
 SUM_Neo.36.t:"殿宇重兴"
 SUM_Neo.36.d:"净善宫外的那些神殿，年久失修，早已塌得不成样子，杂草丛生，狐兔做窝，一片荒凉。草王复位后，便下旨重修。这一下，各地的工匠都调动起来，昼夜赶工。但见工地上，脚手架密密麻麻，锤凿声叮叮当当，从天亮响到天黑，歇也不歇。有那石匠，光着膀子，一锤一锤地凿着砂岩，凿下的石粉堆在脚边，风一过便扬起一片白，汗珠顺着脊梁往下淌，砸在尘土里，摔成八瓣。泥瓦匠在房梁上爬来爬去，动作利落，如履平地，看得人眼花缭乱。草王也时常亲临工地，看看进度，慰劳工匠，叫人送来热汤热饭。众人见神明如此体恤，干得更起劲了，恨不得把一天的活计两天干完。有那附近百姓，也自愿来帮工，递砖送水，工地上一片热火朝天。到了晚间，工地点起火把，照得半山通明，新起的拱廊影子投在墙上，一排连着一排，锤凿声仍不停歇。"
 SUM_Neo.36.a:"让神谕通行"
 SUM_Neo.36.b:"收束信仰的边界"
 SUM_Neo.37.t:"神权垂训"
 SUM_Neo.37.d:"草王为了杜绝六派无休止的争辩，便把神权教义，一条条写成了文字，刻在石碑上，立在净善宫前，让人人得见。那教义写得明白：「凡有争论，一以草神的判断为准，任何学派不得置喙，违者以悖逆论处。」这一下，六派首座再没什么可争的了。从前他们为了一句话，能吵上三天三夜，吵得面红耳赤，拍桌子瞪眼睛，如今有了圣裁，人人只得俯首称是。这法子管用，把那些无谓的口舌之争，一下子就平息了，省了多少是非。有那明白人说道：「神明在上，众人省心，从此再不用扯皮，倒也清净。」从此议事厅上，再听不见往日那般争吵，众人各安其位，肃然而退。有新来的，还想争辩，被旁边人一把拉住。那石碑高二丈，字大如拳，隔着十步也看得真切。"
 SUM_Neo.37.a:"以草神之名行事"
 SUM_Neo.37.b:"以律条为先"
 SUM_Neo.38.t:"册拜诸职"
 SUM_Neo.38.d:"草王为了雨林与沙漠之间的和睦，特意册封了一批新的神职。这回分派，公平：出身雨林的占一半，出身沙漠的也占一半，谁也不多，谁也不少。原来雨林与沙漠，积怨已久，动辄争吵，草王这是有意让两边的人，同殿为臣，共襄国事，在日常相处中化开旧疙瘩。那些新受封的神职，有负责祭祀的，有管理圣所的，有宣讲教义的，各司其职，各有分工。雨林人懂得草木，沙漠人熟悉水源，正好互相配上，取长补短。受封当日，两拨人站在一处，起初还有些生分，你看看我，我看看你，行过礼后，便渐渐亲热起来，互道姓名，谈得投机。两下里处得融洽，端的不分彼此。受封的册子上，两边的名字排在一处，墨迹一般新，往后同殿出入，便是一家人了。"
 SUM_Neo.38.a:"让梦回到须弥"
 SUM_Neo.38.b:"先看住封印"
 SUM_Neo.39.t:"垂宪立制"
 SUM_Neo.39.d:"草王又颁布了一部神权法典。这部法典，把大大小小的律条，都写明在册，刻在石板上，一律以草神之名施行。这法典与从前的旧律，不同：旧律是教令院关起门来定的，处处偏袒权贵，百姓有冤无处诉；新律却是草王亲自过目，一字一句都斟酌过，为的是公道二字。法典颁下之日，净善宫前张灯结彩，百姓争相传阅，人人争先恐后。有识字的，当场念给众人听，念到公道处，众人齐声喝彩，掌声经久不息，震得屋檐都在颤。从此须弥国中，行事有了准绳，再不是那班权贵一句话就能定人生死。有从前含冤的，捧着旧状纸来申诉，法典之下，竟真讨回了公道，称奇。那石板抬出来时，八个人才抬得动，沿街百姓都伸头去看。"
 SUM_Neo.39.a:"让神谕通行"
 SUM_Neo.39.b:"收束信仰的边界"
 SUM_Neo.40.t:"宝座加尊"
 SUM_Neo.40.d:"到了加冕这一日，净善宫里旌旗招展，钟鼓齐鸣，响彻云霄，惊动了满城百姓。小吉祥草王端坐在宝座之上，头戴冠冕，身披华服，宝相庄严，令人不敢仰视。六派首座、各方神职、雨林与沙漠的百姓代表，依次上前，行大礼参拜。这须弥国建国以来，第一次向自己的神明行这样的礼。那场面壮观：但见香烟缭绕，烛火通明，跪倒的人黑压压跪了一大片，连针掉在地上都听得见。草王受了礼，缓缓起身，目光扫过众人，温和得像春水，吹化了众人心里的冰。有那老臣跪在地上，激动得热泪盈眶，口中喃喃：「这一天，终于等到了，老臣死而无憾。」那钟鼓之声，好不热闹。礼成之后，宫门外放了半日鞭炮，纸屑积了三寸厚。"
 SUM_Neo.40.a:"以草神之名行事"
 SUM_Neo.40.b:"以律条为先"
 SUM_Neo.41.t:"枕上回梦"
 SUM_Neo.41.d:"草王复位后，第一桩要紧事，便是关闭那害人的虚空终端。终端一关，须弥人耳后空空荡荡，起初还不大习惯，走路都觉得轻飘飘的，仿佛少了依靠，连话都不会说了。可没过几日，奇事便发生了：他们重新做起梦来。有那孩子，梦见自己长出了翅膀，在雨林上空飞来飞去，醒来还咯咯笑；有那老人，梦见了年轻时的心上人，醒来时嘴角还带着笑，眼角却湿了。夜里的人间，又有了悲欢离合，有了喜怒哀乐。这梦原是人心最深处的东西，虚空把它偷走了，如今草王替大家找了回来，功德无量。有做了一夜好梦的，白日里精神焕发，见人便笑，说那梦里的光景，比真还真。街坊邻里，都围着说梦，热闹。更有失眠多年的，一夜安睡，天亮时分兀自不敢信。"
 SUM_Neo.41.a:"让梦回到须弥"
 SUM_Neo.41.b:"先看住封印"
 SUM_Neo.42.t:"花神诞祭再启"
 SUM_Neo.42.d:"花神诞祭，这几年被教令院办得变了味，成了学者们显示学问的表演，引经据典，卖弄文辞，百姓只能在旁边看着，插不上手，无趣。草王复位后，便下令恢复旧制，把花神诞祭重新办成举国同庆的盛典。这一日，须弥城里张灯结彩，家家户户都走出门来。有舞龙的，有踩高跷的，有摆摊卖小吃的，热闹非凡，锣鼓声震天响，连沙漠的风都似跟着奏乐。不但学者参加，市井百姓、沙漠商旅、雨林猎户，人人都有一份，都能露一手。草王亲自到场，与民同乐，还下了场与众人一同起舞。这才叫真正的节日，官民同欢，普天同庆。有那平日里难得出门的老人，也由儿孙搀着，来到街上凑热闹。歌舞直到半夜，城门口的火把燃尽三茬方歇。"
 SUM_Neo.42.a:"让神谕通行"
 SUM_Neo.42.b:"收束信仰的边界"
 SUM_Neo.43.t:"永夜求梦"
 SUM_Neo.43.d:"自打虚空终端关闭，那漫长的黑夜里，梦便重新回到了每个人的枕边。这梦啊，不分贫富贵贱，人人都做得，人人都做得起，不看你的钱袋，不问你的出身，公平。白日里，大家各司其职，或耕或读，或商或猎，各安其分；到了夜里，闭上眼睛，各人便进入各人的梦乡。有做梦的，一夜之间，走遍了天涯海角，经历了几世人生；有无梦的，反倒睡得不踏实，次日精神萎靡，哈欠连天，没趣。古人说日有所思，夜有所梦，这梦原是白日心思的延续。如今须弥人又能做梦，说明这世道，真真安稳下来了，人人心里都有了盼头。这梦乡之中，端的藏着各人平日的念想，藏都藏不住。有那穷书生与富商同夜得梦，醒来各自说与人听，竟无高下之分。"
 SUM_Neo.43.a:"以草神之名行事"
 SUM_Neo.43.b:"以律条为先"
 SUM_Neo.44.t:"毒蕈蔓生"
 SUM_Neo.44.d:"草王复位之后，须弥的雨林里，生出一种奇特的蘑菇来。这蘑菇不靠雨水，也不靠阳光，专吸着人们梦里的气息生长。原来虚空终端一关，梦里那股子灵气，便无处可去，都渗进了泥土里，被蘑菇吸了去。这蘑菇长得又大又肥，颜色鲜艳，伞盖上还有星星点点的光斑，在夜里微微发亮。有懂药的巡林官提纳里，采了回去仔细研究，发现这蘑菇竟是一味难得的药材，能安神定魄，治失眠多梦，效果奇佳，灵验。众人听了，都啧啧称奇，说这梦也能入药，闻所未闻。这叫物尽其用，连缥缈的梦，都能变成治病救人的东西。有那采药人，试着用它煎汤，喝下后竟一夜安眠，醒来神清气爽。提纳里把蘑菇分装小袋，发与各村药铺，叮嘱不可贪多。"
 SUM_Neo.44.a:"让梦回到须弥"
 SUM_Neo.44.b:"先看住封印"
 SUM_Neo.45.t:"伶人拟花神"
 SUM_Neo.45.d:"那妮露，是须弥城里赫赫有名的舞娘，一双长袖舞起来，能叫满场屏息，了得。花神诞祭上，她在剧场里演花神，那舞姿轻盈得像花间蝴蝶，一颦一笑，牵动人心。台下的观众，五花八门：有衣冠楚楚的学者，也有剃了发的沙民，还有雨林来的猎户，三教九流，坐在一处。从前学者与沙民，是绝不肯坐在一起的，如今却肩并着肩，一同看戏，难得。妮露舞到动情处，水袖一甩，满场寂静，连咳嗽声都没有。舞罢，掌声雷动，经久不息，房梁上的灰尘都震了下来。有那沙民，学着学者的样子，也站起来鼓掌，两人相视一笑，前嫌尽释。有那老学者，也忍不住跟着节拍点头，忘了平日里的矜持。剧场外没挤进去的，扒着窗口听，直听到散场还不肯走。"
 SUM_Neo.45.a:"让神谕通行"
 SUM_Neo.45.b:"收束信仰的边界"
 SUM_Neo.46.t:"踏歌花神之舞"
 SUM_Neo.46.d:"草王复位后，便命人把花神之舞重新编排。这一回的规矩，与从前不同：舞者不再单从学者里挑，而是从雨林与沙漠两处一同选出。于是选舞者的消息一出，两地的人都踊跃报名，把报名处围得水泄不通，险些挤塌了桌子。雨林的姑娘，舞步轻盈，像风拂过树梢；沙漠的姑娘，舞步热情，像火掠过沙丘。两种舞风，本欲合在一处，起初还格格不入，排练时常常跳不到一块儿去，你快了我慢了，闹出不少笑话。可日子久了，你迁就我，我迁就你，渐渐便合了拍，浑然一体。到了演出当日，两拨人手拉着手，舞成一片，天衣无缝，看的人无不喝彩。台下观众看得如痴如醉，掌声一波高过一波，久久不肯散去。演罢，草王亲自给舞者簪花，两地的姑娘们笑作一团。"
 SUM_Neo.46.a:"以草神之名行事"
 SUM_Neo.46.b:"以律条为先"
 SUM_Neo.47.t:"兰那罗清歌"
 SUM_Neo.47.d:"那些兰那罗在雨林里唱的歌谣，从前只有孩子听得见，如今草王复位，便命人把这些歌谣，一句句记录下来，写成文字，收进须弥的典籍里。这桩差事，交给了妙论派的学者。他们带着纸笔，走进雨林，蹲在蘑菇旁边，侧着耳朵倾听，把兰那罗的歌声一字一句地记下，生怕漏掉了一个音，那专注的模样，叫人感动。那些歌谣，写的都是草木、花朵、星星与梦，读来清新动人，满纸生机。有那老学究，起初还不以为然，说这不过是小孩子的玩意儿，读了几首之后，竟也爱不释手，连连赞叹。这叫雅俗共赏，连小小的兰那罗，也有了自己的典籍。那学者们，看得珍惜。抄成的歌本凡三十册，封皮用雨林阔叶压成，翻开来还有一股草木气。"
 SUM_Neo.47.a:"让梦回到须弥"
 SUM_Neo.47.b:"先看住封印"
 SUM_Neo.48.t:"梦录其状"
 SUM_Neo.48.d:"须弥人重新做梦之后，那些学者便动了心思：何不把每个人的梦，都记录下来，作为研究的材料？于是他们四处走访，挨家挨户地请人讲述夜里的梦。有记得清的，便说得绘声绘色，仿佛身临其境；有记不清的，便只记得一些零碎的片段，东一句西一句，前后不搭。学者们把这些梦，一条条抄在册子上，分门别类，编上号码，仔细。有的梦荒诞不经，上天入地；有的梦却暗含深意，发人深省。有懂心理的学者，竟能从梦里看出一个人的心思，断出他白日里藏着的心事，端的神了。这梦的研究，成了一门大学问，引得人人好奇。有专管此事的，还把梦按喜悲凶吉分作几类，编成卷帙，堆满了书架。有夫妻同梦的，两册对在一处，竟接得上，众皆称异。也有人说，梦里见过些小东西，戴着树叶帽子在林子里唱歌，学者听了只笑，说那是兰那罗的旧话，如今的孩子梦里才寻得着。"
 SUM_Neo.48.a:"让神谕通行"
 SUM_Neo.48.b:"收束信仰的边界"
 SUM_Neo.49.t:"梦学开宗"
 SUM_Neo.49.d:"妙论派的画师，与素论派的天象学者，破天荒地合开了一门学问，专研究梦。原来那画师善画梦境，能把梦里的光怪陆离，一笔笔描在纸上，活灵活现；当日象学者呢，能从星象的运转里，推算出梦的吉凶祸福。两下里一拍即合，便联手开了这门课。课堂上，画师一面画，一面讲那梦里的景致；学者一面指着星图，一面解说其中的道理。学生们听得入了迷，眼睛都不眨。有调皮的，当场就做起白日梦来，趴在桌上睡着了，被先生一声喝醒，惹得满堂大笑，连画师手里的笔都差点掉了。课后，学生们还在议论那梦境与星象，各执一词，竟也争得热闹。有那富家子弟，出重金求画师描一梦，画师笑而不受，只道梦是公道物，不可买卖。"
 SUM_Neo.49.a:"以草神之名行事"
 SUM_Neo.49.b:"以律条为先"
 SUM_Neo.50.t:"假梦医创"
 SUM_Neo.50.d:"须弥连年征战，又遭饥荒，许多百姓的心里，都留下了深深的旧伤。这些伤，药石治不好，针灸也治不好，病人整夜整夜地睡不着，眼看着一日瘦似一日，愁人。后来有聪明的医者，想出一个法子：用梦来安抚这些旧伤。他们让病人睡在一处特制的屋里，点上安神香，播放舒缓的曲子，轻声引导病人做那些温暖平和的梦。梦见久别的亲人，梦见金黄的丰收，梦见太平年景，温暖。病人在梦里得到了慰藉，醒来时，心里的伤痛便轻了几分，脸上也有了血色。这法子灵验，许多饱经苦难的人，都渐渐好了起来。这叫心病还须心药医，药到病除。医者又教家属白日里多说宽心话，夜里焚的香换成雨林安息香。屋外再不许人喧哗，连狗都拴去了别院。"
 SUM_Neo.50.a:"让梦回到须弥"
 SUM_Neo.50.b:"先看住封印"
 SUM_Neo.51.t:"往味难忘"
 SUM_Neo.51.d:"须弥沙漠边缘，有一处绿洲，棕榈成荫，泉水叮咚。这一日来了个远道旅人，风尘满身，水囊早空，晒得嘴唇起皮。绿洲人家见他可怜，忙把他让进椰棚底下。不多时，老翁端出一盘椰枣，妇人们捧来新烤的面饼，又舀来一瓦罐清泉水。众人围着旅人坐定，你一言我一语，说起旧日的往事。那老翁捋着花白胡须，讲起赤王还在的年月，说其时沙海如何繁华，笑声里却又夹着几声叹息。有个孩童听不懂，只顾啃饼，被大人拍了一掌，方才住口。那旅人吃了饼，喝了水，脸上渐渐有了血色，听到入神处，筷子停在半空，半晌才咽下一口。这沙漠里的人家，最看重的不是金银，乃是把旧事讲与外人听的那份心意。一碗水，一块饼，几句旧话，便是待客的至诚。"
 SUM_Neo.51.a:"让神谕通行"
 SUM_Neo.51.b:"收束信仰的边界"
 SUM_Neo.52.t:"梦中得实"
 SUM_Neo.52.d:"净善宫中，草神小吉祥草王端坐莲台，掌心浮起一缕清光。她见过无数学者的梦，这一夜却有些不同。有个白发的老学者，日日钻研世界树，苦于一段记忆总是残缺，像被人用浓墨涂去。这一夜他刚合眼，便觉身子轻飘飘的，忽而立在一条通天大树之下。那粗大的树干上有一道抹痕，斑斑驳驳，仿佛被人刻意更改。草神现身树前，指尖轻轻一点，那抹痕里便浮出几个模糊身影，转眼又散了去。老学者急上前要问，草神却摇首，示意他把这残缺记下。这被涂抹的一段记忆，正藏着须弥今日万千灾祸的根由。草神不得以梦相示，为的是借学者之眼，把这桩久远的旧事重新翻将出来。老学者醒来，把梦里所见一笔笔画下，钉在案头，夜夜对着出神。"
 SUM_Neo.52.a:"以草神之名行事"
 SUM_Neo.52.b:"以律条为先"
 SUM_Neo.53.t:"令梦不绝"
 SUM_Neo.53.d:"是日，须弥城中忽然起了一场大梦。上自教令院的首座，下至市井的贩夫，一个个眼皮沉重，倒在榻上便睡。这一睡不要紧，竟睡出个极其太平的世界来。梦里头，沙漠与雨林一般丰饶，谷米满仓，再没有饥荒二字；人们也记得住一切旧事，祖辈的名姓，儿时的玩笑，件件清晰，再没有遗忘这桩苦楚。这梦好不诱人。有做小买卖的，梦见自家铺子生意兴隆，银钱流水也似进来；有人梦见故去的亲人重又坐在灶前，笑吟吟唤他吃饭；有学者梦见那残缺的典籍忽然完整，字字句句都读得通，喜得在梦里直拍大腿。然而梦虽好，终究是虚，醒转来还不是照旧。这满城的酣梦，究竟是福是祸，还须草神醒来定夺。夜里虫声都歇了，满城寂静。"
 SUM_Neo.53.a:"让梦回到须弥"
 SUM_Neo.53.b:"先看住封印"
 SUM_Neo.54.t:"邂逅兰那罗"
 SUM_Neo.54.d:"草神小吉祥草王，见学者们只在净善宫中读死书，对雨林中的兰那罗只闻其名，从未见其面，便决意亲自走一遭。这一日，她带着几名心腹学者出了须弥城，一路穿林涉水，进了那郁郁苍苍的雨林。但见古木参天，藤蔓垂地，湿气扑面，鸟鸣不绝。行至一处林间空地，草神屈指一弹，树叶簌簌作响，从那树洞石缝之间，竟钻出些小小的身影来。那些个兰那罗，头戴花叶，身量不过三尺，睁着乌溜溜的大眼，先是你看看我、我看看你，又互相叽叽喳喳。学者们看得目瞪口呆，其中一个险些惊呼出声，被草神一个眼神按住。这兰那罗乃是雨林的旧主，世人难得一见，今日草神亲自引荐，机缘难得。林间草叶上露水未干，日光一照，七彩流转。"
 SUM_Neo.54.a:"让神谕通行"
 SUM_Neo.54.b:"收束信仰的边界"
 SUM_Neo.55.t:"兰那罗讴歌"
 SUM_Neo.55.d:"雨林深处，兰那罗们自古便有歌。那调子清越，绕着古树盘旋，唱的是雨林的雨、树根的深、月色的凉。只是这歌向来只在这方林子里传，须弥城里的人无从得闻。有位通晓古今文字的学者，随草神入了雨林，听那歌听得呆了，当下便取笔砚，一字一句地记。那兰那罗的歌没有固定字句，随风而变，学者记得手忙脚乱，漏了一句便急得抓耳挠腮，只得请兰那罗重唱。兰那罗们见他记得认真，也放缓了歌喉，一遍遍地唱与他听。回到教令院，这学者把那歌词细细译成须弥文字，又替它作了注解，刊刻出来，不多几日，便在城中书肆里流传开了。这歌声本是林间小调，一旦落进文字，竟成了人人争读的诗篇。有买不起的，站在书肆门口抄，抄完便摇头晃脑念将起来。"
 SUM_Neo.55.a:"以草神之名行事"
 SUM_Neo.55.b:"以律条为先"
 SUM_Neo.56.t:"庄梦依稀"
 SUM_Neo.56.d:"维摩庄是个靠着雨林的小村落。早年间，村里的孩子们常听见林中有细细的歌声，那便是兰那罗在唱。后来死域蔓延，林子病了，歌声也一日弱似一日，终于听不见了。孩子们长大，再没人当真，只当是老人的闲话。这一日，草神与兰那罗合力净化了林子，那歌声便又了起来。午后时分，几个孩子正在村口的老树下玩耍，忽听得林间飘来一缕熟悉的调子。起先他们以为听岔了，屏住呼吸再听，果然真切。有个小姑娘扔了手中的野果，撒腿就往林边跑，一边跑一边喊：「回来了，回来了。」众人闻声出来，侧耳静听，那歌声悠悠荡荡，一如从前。这声音一回来，维摩庄便又有了生气。此话一传十，十传百。村口老树下，老人把这一节又说与孙儿听。"
 SUM_Neo.56.a:"让梦回到须弥"
 SUM_Neo.56.b:"先看住封印"
 SUM_Neo.57.t:"拉娜生还"
 SUM_Neo.57.d:"维摩庄有个小姑娘，名叫拉娜。她生来眼盲，却心思灵透，最爱听林中兰那罗的歌。那年死域突起，她走入林子，便再没回来，村里人打着火把寻了三天三夜，寻不见半个人影，都道她凶多吉少，从此村口那棵老树下，常年有人望着林子发呆。这一日，村口忽然来了个熟悉的身影，正是拉娜。她依旧闭着双眼，手里却紧紧攥着一个小小的布包。村人围将上来，问她这些年去了何处。拉娜笑道，她被兰那罗救了，在那里住了许久。说着，她打开布包，里头是几粒饱满的种子。原来这是兰那罗托她带回的，说要把雨林的根重新种下。这失踪的孩子平安归来，还带回这样一件托付，悲喜交加。众人听着，有的抹泪，有的称奇。那布包上还系着一根草茎，打的结，村中无人识得。"
 SUM_Neo.57.a:"让神谕通行"
 SUM_Neo.57.b:"收束信仰的边界"
 SUM_Neo.58.t:"兰那罗播籽"
 SUM_Neo.58.d:"拉娜从雨林带回的那几粒种子，虽是兰那罗所托，却已枯萎发黑，皱巴巴的像几粒小石子，瞧不出半点生机。村里有人见了，摇头说这活不成了，何苦白费力气，劝她趁早丢了。拉娜却把那布包搂在怀里，说什么也不肯。草神听说此事，却亲自来了。她捧着那几粒枯种，看了又看，说这种子看着枯了，里面的魂魄却还在，只消寻一处好地方埋下，耐心守候，或许还有指望。当下便选在禅那园中，令人掘开一抔净土，把种子一一埋了，覆上细土，浇了泉水。自此，草神每日必要来瞧一瞧，风雨无阻，有时还蹲下身，用手轻轻拨开土看那种子可曾动静。埋种处插了根木签作记，签上不写字，只系了一根红绳。这枯萎的种子能不能发芽，还要看造化。"
 SUM_Neo.58.a:"以草神之名行事"
 SUM_Neo.58.b:"以律条为先"
 SUM_Neo.59.t:"那菈再葩"
 SUM_Neo.59.d:"雨林边缘，有一种小花，名唤那菈花。这花开得古怪，偏在林子与外界交界的地方开放，花色嫩绿，瓣上还带着细细的纹路，风一吹便轻轻摇晃，像在朝人点头。是日，草神与兰那罗立约之后，这花便顺着林缘，一处接一处地开了起来，远远望去，像给雨林镶了一道绿边。兰那罗们见了，欢喜不尽，说这花便是约定的信物，凡花开之处，便是两下里说好了要相守的地方。有几个年幼的兰那罗，还围着花丛跳起舞来，笑声脆得如银铃。有好奇的村人想去采摘，刚伸出手，却被花叶上的细刺扎了一下，疼得缩了回来，旁的村民都笑了。这花不单好看，还守着信义，不可轻慢。村里人从此不许孩童近花，只许远远地看，看它一春一春地开。"
 SUM_Neo.59.a:"让梦回到须弥"
 SUM_Neo.59.b:"先看住封印"
 SUM_Neo.60.t:"俱利伽罗草"
 SUM_Neo.60.d:"雨林中有一种草，名唤俱利伽罗，叶片青碧，揉碎了有股清苦的香气，生在那阴湿的林下，寻常人轻易认不出来。早年间，这草只当野草看待，无人问津。后来禁忌知识为祸，凡沾染了那黑气的学者与百姓，轻则神志昏沉，重则形销骨立，请了多少医者都束手无策，眼睁睁看着病人一日弱似一日。有位懂药的医者，翻遍了旧册，又亲自入林试采，发现这俱利伽罗的草汁，竟能一点点压住那侵蚀。他当即采了一大捆回去，煎成汤药，给那病人灌下。不过三日，病人脸上的黑气果然退了，人也清醒了些，还能喝下半碗米粥。是日医者又多采了几筐，晒干了收在陶罐里，以备来日。这不起眼的野草，偏能解这要命的灾殃，造化弄人。"
 SUM_Neo.60.a:"让神谕通行"
 SUM_Neo.60.b:"收束信仰的边界"
 SUM_Neo.61.t:"梦中采菡"
 SUM_Neo.61.d:"在梦的最深处，生着一种奇花，名唤劫波莲。此花通体莹白，花瓣薄如蝉翼，只在人梦境深时才肯现身，寻常人等闲见不着。兰那罗们感念草神救了雨林，便商议着要献一件最珍贵的礼物。他们潜入那梦的深处，采来一朵劫波莲，捧到草神面前。那花在兰那罗手中，隐隐泛着柔光，仿佛还带着梦里的凉意。草神见了，甚是珍爱，把它供在净善宫中，日夜以灵光滋养。怎料这花虽好，却只开了一夜。待到天明，那莹白的花瓣便一片片落尽，只剩空空的花梗。草神见了，也不惋惜，只说世间至美之物，往往最难久留，能看上一眼，已是缘分。这一夜的花，虽谢得快，那份心意却长留。宫人把落瓣收在锦盒里，说香气三年不散，有近侍想偷瞧，被草神笑着挡开。"
 SUM_Neo.61.a:"以草神之名行事"
 SUM_Neo.61.b:"以律条为先"
 SUM_Neo.62.t:"枕中天地"
 SUM_Neo.62.d:"自草神与兰那罗合力净化了雨林，那一方梦境便渐渐稳了下来。先前这梦与那梦之间，界限模糊，人一睡着，往往走到了别人的梦里去，闹出许多笑话。有卖菜的，睡了一觉，梦见自己坐在教令院里批阅公文，醒来还直犯嘀咕；也有学者梦见自己在沙漠里赶骆驼，急出一身冷汗。草神见了，便与兰那罗一同商量，如何给这梦立个规矩。于是草神以世界树的灵气为线，兰那罗以林中的古木为桩，里应外合，为须弥的梦境划出了一道边界。这一番布置，整整忙了七七四十九日，方才妥帖。自此，各人的梦各归各处，再不串门。这梦有了边界，益处不少，人们睡得安稳，再不会无端做起别人的梦来。那桩为界，桩桩都选在古树身上，树上都系了一根草茎为记。"
 SUM_Neo.62.a:"让梦回到须弥"
 SUM_Neo.62.b:"先看住封印"
 SUM_Neo.63.t:"兰那罗共主"
 SUM_Neo.63.d:"兰那罗一族，向来有一位王，替众人拿主意。后来那老王年迈，力不从心，兰那罗们便商议着要选一位新的。这一日，大大小小的兰那罗都聚到林中最古老的那棵树下。有的兰那罗能歌，有的善舞，有的最会辨药，各有各的本事。众人你推我让，争论不休，吵得树上的叶子都簌簌往下落，有几个性子急的，竟争得面红耳赤。末了，还是草神出面，说这王不必样样第一，只要心地公道，肯替大家说话便是。众人听了，方才恍然，当下便推举出一位心肠最热的兰那罗来。那新王先是推辞，后来见众意难违，方才应下，向众人深深一揖。那树下还摆着新采的野果，众兰那罗边吃边议，倒也不觉着累。这王位不论本事高低，端的只看一颗公心。"
 SUM_Neo.63.a:"让神谕通行"
 SUM_Neo.63.b:"收束信仰的边界"
 SUM_Neo.64.t:"兰那罗合盟"
 SUM_Neo.64.d:"雨林的根，向来由兰那罗守护。后来须弥人与兰那罗交往日深，便有人提议，何不立个盟约，把这份守护明明白白写下来，也好教后人有个凭据。这一日，草神做证，须弥的使臣与兰那罗的王各据一方，行了那古老的盟礼。那盟礼古朴得很，先由兰那罗的王以手中花枝蘸了泉水，在古树根上洒了三洒；须弥使臣则以教令院的印信，在贝叶上按了三按。两边各执一词，都说从此以后，须弥与兰那罗同心同德，共护这雨林的根，有福同享，有难同当。礼成之后，众人围着古树欢呼，那欢呼声惊飞了一林子的雀鸟。那贝叶被众人传着看了许久，边角都磨毛了，末了郑重收进教令院的宝库。这盟约一立，雨林便有了双重的保障，稳固。"
 SUM_Neo.64.a:"以草神之名行事"
 SUM_Neo.64.b:"以律条为先"
 SUM_Neo.65.t:"兰那罗降嘏"
 SUM_Neo.65.d:"兰那罗们立盟之后，心中欢喜，便把满满的祝福，洒向须弥境内的每一棵树。是夜，须弥上下的树木，无论是雨林中的参天古木，还是城中的行道小树，枝头都仿佛被一层柔光笼住，连那最不起眼的墙角树苗，也不曾落下。待到天明，人们推门出来，但见每棵树的梢头，都挂着一颗晶亮的露水，圆圆整整，像极了谁昨夜留下的一颗泪珠。有孩童踮起脚去够，那露水却轻轻一滚，落进草丛里，寻不见了，惹得那孩童跺着脚直嚷。妇人们抬头看了半晌，都啧啧称奇，说从未见过这等景致。有多情的少年，还特意记下这日子，说要年年此时来看露水，旁人听了都笑他有心。这露水便是兰那罗的祝福，落在树上，润物无声。到午间，露水化尽，树梢却绿得格外精神。"
 SUM_Neo.65.a:"让梦回到须弥"
 SUM_Neo.65.b:"先看住封印"
 SUM_Neo.66.t:"树下要盟"
 SUM_Neo.66.d:"须弥城中，向来有人靠砍伐雨林的树木谋生。斧斤之声，终日在林边响起，一棵棵大树轰然倒下，惊得林中鸟兽四散。兰那罗们见树木一棵棵倒下，心疼得不行，便央求草神出面。草神于是召集众人，立下了一条约法，名曰绿荫之约。这约法写得明白：「凡兰那罗所守之林，须一概不许砍伐，违者重罚。」约法一出，那些惯于伐木的人先是哗然，叫苦连天，后来见草神主意已定，也只得把斧头收了。有嘴硬的，私下里嘀咕了几句，被巡林官听见，当场训斥了一顿，方才没敢再言语。如今那林边清清静静，只剩鸟叫虫鸣，再听不见那刺耳的斧斤之声了。这绿荫之约护住的，不单是树，更是雨林里万千生灵的家。约法刻在林口的木牌上，字旁画着一株小树。"
 SUM_Neo.66.a:"让神谕通行"
 SUM_Neo.66.b:"收束信仰的边界"
 SUM_Neo.67.t:"根蟠树庭"
 SUM_Neo.67.d:"须弥境内，有一棵通天的世界树，根深叶茂，笼罩一方。草神常带着学者，去那树下讲学。这一日，她指着地下说：「你们只看见地上的树干，却不知这树的根系，早已贯通了须弥全境。东边沙漠的沙丘之下，西边雨林的泥土之中，都有它的根须在延伸，盘根错节，纵横千里。」学者们听了，半信半疑，俯身贴地细听，果然隐隐有流动的声响，嗡嗡然如人低语。草神又说：「这些根须，便是记忆的血管，须弥古往今来的人和事，都顺着它流转、储藏，一件也不会遗漏。」众人听得入了神，竟忘了日头西斜。草神说罢，又引着众人看了几处根须露出地面的所在，果然盘曲如龙。这世界树神奇，把一方水土的记忆，都牢牢系在一处。"
 SUM_Neo.67.a:"以草神之名行事"
 SUM_Neo.67.b:"以律条为先"
 SUM_Neo.68.t:"梦萦树庭"
 SUM_Neo.68.d:"世界树不但有根，也有梦。这一夜，草神守在树旁，忽见那树身泛起柔和的光，竟自入梦。她心中好奇，便顺着那光，走进了树的梦里。但见梦中另是一番天地，草木格外丰茂，溪水格外清澈，人和善相处，一派太平气象。更奇怪的是，那梦中的树下，端坐着一位慈祥的女子，正低头抚弄一株幼苗，那神情温柔得像在照看自己的孩子。草神定睛一看，那容颜竟与传说中的大慈树王一般无二。她心中一震，刚要上前，那梦境却如水波般散了，眼前只剩一棵静静的树。草神在树下伫立良久，直到那光彻底散尽，方才转身离去，心中久久不能平静。这世界树的梦里，留着的正是大慈树王还在的旧日时光，令人感慨。回宫路上，她一步三回头，把那树影看了又看。"
 SUM_Neo.68.a:"让梦回到须弥"
 SUM_Neo.68.b:"先看住封印"
 SUM_Neo.69.t:"树王遗绪"
 SUM_Neo.69.d:"大慈树王逝去之后，留下的东西其实不多。草神曾亲自清点，翻遍了净善宫的旧藏，也只寻出两样。一样是一道印记，刻在一块古老的石片上，只是那印记被人涂抹过，糊里糊涂，看不清原本的模样，只余下几道浅浅的划痕。另一样更奇，竟是一段名字，可这段名字早已无人记得，问遍了教令院的老学究，也没人能说个所以然，有的说是脱落了，有的说是从来就没传下来。草神捧着那石片，看了许久，心中说不出的滋味，末了轻轻放回匣中。草神又想，那位树王既留下这印记，想必也有话要留给后人，只是如今无人能懂了。一位曾经庇佑一方的树王，身后竟只余下这涂抹的印记与无名的旧姓，叫人欷歔。那石匣上积了薄薄一层灰，无人再敢开启。"
 SUM_Neo.69.a:"让神谕通行"
 SUM_Neo.69.b:"收束信仰的边界"
 SUM_Neo.70.t:"伊尔明苏尔之典"
 SUM_Neo.70.d:"世界树下，夜深人静之时，常有一种低低的声响，像是有人在说话。起初守夜的学者以为是风，听久了才觉出那声音竟有字句，只是含含糊糊，听不真切。这一夜，草神独自坐在树下，那低语便又响了起来，说的是五百年前的一场遗忘。原来是日，一场大难过后，须弥人忽然忘了许多要紧的事，连带着把一位该记着的人也忘了个干净，从此再没人提起。草神听着那低语，眉头紧锁，伸手抚住树干，仿佛要把它稳住，又好似在安慰那棵通天的古树。那声音一遍遍地说着，仿佛生怕今人忘了，又仿佛知道说了也是徒然，只管低回不已。这世界树的低语，想把那被遗忘的旧事，重新说与今人听，只是听者几人能懂。树皮上一道旧痕，摸上去温温的，像有脉息。"
 SUM_Neo.70.a:"以草神之名行事"
 SUM_Neo.70.b:"以律条为先"
 SUM_Neo.71.t:"涤除旧识"
 SUM_Neo.71.d:"草神日夜思索，想要寻回那段被遗忘的名字。这一日，她独坐窗前，忽然心头一亮，一个名字清清楚楚地浮了上来，就仿佛多年未见的老友，忽然在眼前现身。她大喜过望，忙铺开纸笔，蘸墨要写，那手竟有些发抖。可那笔尖刚落到纸上，写出一字，她的手却抖得更厉害了。原来这名一旦写下，便要牵出许多旧事，而那些旧事，如今的须弥人未必承受得起，弄不好又要掀起一场风波。草神犹豫再三，末了还是狠下心来，就着未干的墨迹，把刚写下的字一笔一笔抹去，纸上只留下一团模糊的墨痕。她望着那团墨痕，呆呆地出了一回神，终究什么也没再说，只把它收进了匣中。这想起又抹去之间，藏着说不尽的苦衷。此后那纸匣再没开过，锁钥由草神亲收。"
 SUM_Neo.71.a:"让梦回到须弥"
 SUM_Neo.71.b:"先看住封印"
 SUM_Neo.72.t:"复其故称"
 SUM_Neo.72.d:"草神见那旧名寻不回来，忽而想到自身。她想，若把自己这名字写回世界树，让世人永远记得，岂不更好。当下她便来到树下，掌心凝起一团灵光，化作一支无形之笔，悬在那被涂抹的痕迹旁边。那笔尖明明已抵到了树身，却迟迟落不下去。她对着那痕迹凝望了许久，心中翻来覆去。原来她转念一想，自己若把这名字刻将上去，与那被抹去的旧事又有何分别，都是叫后人记住一个名字罢了，未必真是好事。想到此处，她那一笔便停在半空，终究没有落下，那灵光也渐渐散了，树身上半点痕迹也不曾添。是夜她独坐到天明，望着那树，眼里说不清是喜是悲，连身边的侍从都不敢上前搭话。这一笔停住，见得草神心中有大计较。"
 SUM_Neo.72.a:"让神谕通行"
 SUM_Neo.72.b:"收束信仰的边界"
 SUM_Neo.73.t:"枝丫枯萎"
 SUM_Neo.73.d:"世界树虽是常青，这一日却有一枝忽然枯了。那枯枝起先只是叶色发黄，没几日便枝干干裂，眼看要断，那枯黄的颜色，在一树青翠里格外扎眼。教令院派了好几拨学者来查，有的说是水土出了毛病，有的说是虫蛀，还有的说是什么禁忌知识作的祟。众人各执一词，围着那枯枝绕了三圈，量了又量，查了又查，有的还取了树皮回去化验，到头来还是找不出半点缘由。有几个年轻气盛的，争得面红耳赤，谁也不肯服谁。草神见了，也不催促，只叫他们把那枯枝围起来，莫要轻动，免得再伤了它。草神看在眼里，也不言语，只命人取来清水，每日替那枯枝浇上几回，静待它自己好转。连这满腹经纶的学者都束手无策，古怪。惟有树下扫叶的老役夫，日日代浇，不声不响。"
 SUM_Neo.73.a:"以草神之名行事"
 SUM_Neo.73.b:"以律条为先"
 SUM_Neo.74.t:"白枝初萌"
 SUM_Neo.74.d:"那枯枝旁边，过了些日子，竟渐渐抽出一根新枝来。那新枝通体雪白，不似寻常的青绿，在日光下泛着柔和的光，瞧着十分奇异，那白枝与枯枝并排生着，一枯一荣，煞是好看。学者们见了，又是一番议论，都说这白枝来路不明，有的说是祥瑞，有的说是异兆，争个不停。草神却微微一笑，说你们不必惊讶，这枝不是我种的，也不是世界树自己生的，乃是须弥这一方水土、这一方百姓，自己长出来的。众人听了，似懂非懂，围着那白枝看了许久，有几个伸手去摸，那白枝温润如玉。草神说罢，伸手轻抚那白枝，枝上的光泽便愈发柔和，众人看了，方才渐渐信了这话。这枯枝与新枝一前一后，像是旧事已去、新生方来。后来有人绘图记下，题作枯荣同枝。"
 SUM_Neo.74.a:"让梦回到须弥"
 SUM_Neo.74.b:"先看住封印"
 SUM_Neo.75.t:"树腹藏书"
 SUM_Neo.75.d:"世界树的根须之下，埋着不少前朝的典籍。这一日，几个学者动了念头，便带了铲子锄头，在树根旁掘将起来。掘了半日，果然从深土里挖出一只石匣。那石匣朽得厉害，一碰就掉渣，众人不敢大意，用软布一层层裹了，方才抬出来。小心翼翼撬开，里头是厚厚一叠发黄的册子，纸都脆了。及至翻开一看，都傻了眼，那上头写的字，歪歪扭扭，古里古怪，竟没一个认得，众人面面相觑。他们把册子传给草神看，草神看了，也只摇头，说这字出自极古的年月，如今认得的人，怕是没了。草神又说，这字虽认不得，笔画里却自有章法，想来当日的人，也非等闲之辈。这埋藏的典籍虽重见天日，可那上头的字，成了无解的谜。那石匣至今仍摆在书楼架上，不敢再启。"
 SUM_Neo.75.a:"让神谕通行"
 SUM_Neo.75.b:"收束信仰的边界"
 SUM_Neo.76.t:"树王藏智"
 SUM_Neo.76.d:"大慈树王在时，留下了许多智慧言语，散见在各处旧卷之中，有的刻在石碑上，有的写在贝叶上，零零碎碎，不成系统。草神见那些言语散在各处，恐日久散佚，便命教令院的学者们，把它们一一搜集起来，分门别类，细加整理。这些学者不敢怠慢，查旧卷，访老人，笔录口传，有的为了一句话，竟翻遍了半座书楼。忙了许久，方才编成一部大书。那书编成之日，草神亲自作序，六大学派的首座都来贺喜，仪式十分隆重。这书一出，六大学派都奉它为根本，凡有争论，便去书里寻那依据，从此省却了许多口舌。这树王的智慧，经这一番整理，竟成了须弥学派共同的根基，惠及后世。书楼特辟一室藏之，钥匙由六派各执一把。"
 SUM_Neo.76.a:"以草神之名行事"
 SUM_Neo.76.b:"以律条为先"
 SUM_Neo.77.t:"净光普照"
 SUM_Neo.77.d:"死域，本是雨林中一处要命的病，黑气所过，草木枯死，连走兽都远远避开，端的是寸草不生。草神见了，心中不忍，便与兰那罗合力，施行那净化的法术。这一日，但见净善宫方向升起一道柔光，那光顺着世界树的根须，一路淌进雨林，钻进死域的裂隙里。说也奇怪，那黑气一遇上光，便滋滋地退，像雪遇到了炭火，一转眼便化作了缕缕青烟。不过半日，死域的边线便往回缩了一大截，露出底下的泥土来。守在旁边的学者看得目瞪口呆，半晌才回过神来，有个胆大的，已试着往那退去的地方探了探头。不多时，那林间又有了新绿，连许久不见的蝴蝶也飞回来了。这净化之光灵验，把那害人的死域，硬生生逼了回去。退净之处插了木牌，上书净域二字。"
 SUM_Neo.77.a:"让梦回到须弥"
 SUM_Neo.77.b:"先看住封印"
 SUM_Neo.78.t:"根下隐情"
 SUM_Neo.78.d:"须弥人一向以为，小吉祥草王便是开天辟地以来第一位草神，这观念深入人心，从无人置疑。这一日，草神在净善宫中，当着众学者之面，说出了一段旧事，说在她之前，还有一位草神，便是那大慈树王。众人听了，先是一愣，继而议论纷纷，都说难以置信。有年长的学者，翻出旧卷比对，果然在字里行间寻到些蛛丝马迹，方才信了，禁不住连连点头。也有年轻气盛的，起初还嘴硬，后来见证据确凿，也只得哑口无言。自此后，教令院里便时时有人翻检旧卷，想再从字缝里寻些旁证，添了一桩公案。这一桩旧事揭开，把须弥人的认知翻了个个儿，原来他们供奉的神明，并非独一份，这事一传开，满城都在议论，连说书人都编了新词。"
 SUM_Neo.78.a:"让神谕通行"
 SUM_Neo.78.b:"收束信仰的边界"
 SUM_Neo.79.t:"圣树不凋"
 SUM_Neo.79.d:"世界树历经这许多风波，依旧枝繁叶茂，青翠不减当年，那满树的叶子在风中沙沙作响，仿佛在诉说着什么。草神常对学者说：「你们看这树常青，却不知它的根须底下，藏着两代草神的记忆。一代是大慈树王，一代便是她自己。」那一桩桩的旧事，一桩桩的心事，都安安静静地埋在根下，随着树液流转，永不磨灭。学者们听了，俯身抚那树干，仿佛真能觉出些许温度，也不知是真是幻。草神又说，正因有这两代人的心血，这树才长得这般茂盛。这两段记忆一前一后，正如那树的一枝一叶，缺一便不成其常青，所以说到底，新旧原是一体。这世界树如一位沉默的见证者，把新旧两代神明的心血，一并记在心里。树下青苔愈厚，行人过此，无不放轻脚步。"
 SUM_Neo.79.a:"以草神之名行事"
 SUM_Neo.79.b:"以律条为先"
 SUM_Neo.80.t:"林薮置戍"
 SUM_Neo.80.d:"须弥的雨林，先前只有零星的巡林之人，管不过来那大片林子，常有顾此失彼之憾。自从草神与兰那罗立了约，便决意把巡林队好好扩一扩。这一纸令下，各处便张起榜文，招募那熟悉林性的好手。榜文一出，应者云集，有世居林中的猎户，有采药的老手，都赶来报名。不多时，便聚起了一队人马，分成若干小队，分驻在雨林各处。那边界之上，还头一回立起了常设的哨所，有人昼夜轮值，风雨无阻，再不似从前那般三天打鱼两天晒网。那榜文贴出之后，连沙漠边上的人也有赶来应募的，都说这回的巡林，与往日不同，谁都想来出一份力。这雨林的边界，从此有了固定的守望，再不是从前那般疏于管顾。哨所皆用整木搭成，屋顶苫着棕叶。"
 SUM_Neo.80.a:"让梦回到须弥"
 SUM_Neo.80.b:"先看住封印"
 SUM_Neo.81.t:"增置林尉"
 SUM_Neo.81.d:"这巡林队里，有个出类拔萃的人物，名叫提纳里。他生得一对长耳，眼力极佳，最善辨识林中的草药与异动，走起路来悄无声息。众人见他本事高强，又公道正派，便一致推他做了巡林官之首。他手下的众人，多半是道成林里土生土长的猎人，爬树如履平地，辨路胜似识掌，隔着半里地便能闻出蕈猪的气味，个个都是好手。提纳里领着他们，今日巡东，明日巡西，哪处死域复起，哪处巨兽游荡，他都了如指掌。因而每回出巡，总能避开险处，寻着那最要紧的地方去看。每逢出发，他总要站在队前，把当日的路数细细分派一番。手下有不服的，起先还处处与他别扭，后来见识了他的本事，也就心悦诚服了。这提纳里称职，把手下一群人带得服服帖帖。队中夜巡的口令，三日一换，取的尽是林中物事，今日「月莲」，明日「蕈伞」，外人听了摸不着头脑。"
 SUM_Neo.81.a:"让神谕通行"
 SUM_Neo.81.b:"收束信仰的边界"
 SUM_Neo.82.t:"林间巡徼"
 SUM_Neo.82.d:"雨林之中，本没有正经的大路，只有那些走兽与采药人踩出的小径。这些小径曲曲折折，四通八达，恰似一片巨大树叶上的叶脉，走错了便难辨东西。巡林官们便沿着这叶脉一般的小径巡逻。但见他们一个个轻装简从，裤脚高高挽起，手里拿着砍刀拨开挡路的藤蔓，脚下的腐叶发出沙沙的声响，不一会便汗流浃背。遇上岔路，领头的便停下来，蹲身细看地上的痕迹，辨一辨是人是兽，再定去处。有时遇上横倒的枯木挡道，众人便合力搬开，或是寻那空隙钻将过去。这一路走下来，众人协力而行，齐心，裤脚上的泥浆积了半指厚。这巡逻看着寻常，也要眼力与耐心，一步疏忽，便可能走了岔路。回到哨所，各自烤火烘衣，明日还要再巡。"
 SUM_Neo.82.a:"以草神之名行事"
 SUM_Neo.82.b:"以律条为先"
 SUM_Neo.83.t:"禅那园置戍"
 SUM_Neo.83.d:"禅那园，本是须弥一处清幽的所在，园中草木葱茏，亭台精巧，最宜修行静心。自从死域蔓延，这园子便首当其冲，黑气几度逼到园墙之外，园中的草木都枯黄了大半。草神见了，便命人在园子四周筑起一道防线，用的乃是世界树的灵木，掺以兰那罗的祝福。这道防线不高，却自有一股灵气，死域的黑气飘到近前，便如撞上了无形的墙，再也进不得半分。守园的巡林官日夜看守，不敢松懈，手中皆持着那灵木做成的长矛。说也奇怪，自这防线一立，园中的草木便又渐渐转青，如今已是郁郁葱葱。那巡林官还把防线外的地面扫得干干净净，但凡有一点黑气的影子，立时便飞报上去。这禅那园有了防线，保住了这一方清净。过路的香客都要在墙外站一站，沾沾这灵气。"
 SUM_Neo.83.a:"让梦回到须弥"
 SUM_Neo.83.b:"先看住封印"
 SUM_Neo.84.t:"村坞相保"
 SUM_Neo.84.d:"雨林之中，村落散户，星罗棋布，先前各顾各的，遇上死域或巨兽，往往各自逃命，谁也顾不上谁，吃了不少亏。草神见了，便劝他们结成联防。这一说，各村的首领便聚到一处商议，起初也争论了好一阵子，末了终于定下规矩：某处有警，便点火为号，邻村望见，即刻来援；平日里则互通消息，共守边界。那点火的高台，一座座在村头立了起来，还派专人轮值看守。有一回死域逼近某村，消息一出，邻村的壮丁扛着家伙就赶了来，硬是把那黑气逼了回去。那高台之上，还悬着一面铜锣，锣一响，几里地外都听得见，快捷，从此各村夜间也都睡得安稳了。这各村一联防，端的拧成了一股绳，再不是从前那般一盘散沙。高台上的火把，隔三差五便添一回油，守台人睡时也睁着半只眼。"
 SUM_Neo.84.a:"让神谕通行"
 SUM_Neo.84.b:"收束信仰的边界"
 SUM_Neo.85.t:"芟除死域"
 SUM_Neo.85.d:"那一处处死域，自草神施行净化以来，便被一点一点地清剿干净。先是那近处的，后是那深远的，但凡黑气所聚，巡林官与兰那罗便联手前往，以灵光驱散。那黑气初时还想抵抗，滋滋作响，怎奈敌不过灵光，只得节节败退。黑气一退，那死去的土地竟又活了过来。先是钻出嫩嫩的青草，继而抽出灌木的新芽，再后来，连高大的树木也重新抽枝发叶。不过一年光景，那原先寸草不生的地方，便又绿意盎然，看不出半点旧日的创伤，有些地方竟比从前还茂盛些。草神听闻此事，也亲自来看过一回，见那新绿漫山遍野，脸上才露出了笑意。随行的兰那罗们更是围着那新长的草木，跳了半日的舞。这草木复生，叫人欢喜。有迁走的村民，也陆陆续续搬回了旧址。"
 SUM_Neo.85.a:"以草神之名行事"
 SUM_Neo.85.b:"以律条为先"
 SUM_Neo.86.t:"林藏怪兽"
 SUM_Neo.86.d:"雨林之中，本住着些庞然大物。先前死域侵扰，它们的窝巢被毁，食物难寻，便时常下山，闯进村落骚扰百姓，叼走牲畜，踏坏庄稼，村民们苦不堪言。自从死域被清、雨林复绿，这些巨兽也寻回了旧日的巢穴，林中果实丰足，它们吃得饱饱的，便懒得再下山了。这一日，有村民远远望见一头长鬓虎在林边徘徊，鬃毛竖着，眼睛在暗处发亮，吓得魂飞魄散，忙敲锣报警，全村都操起了家伙。谁知那巨兽只是低头啃了几口树叶，便慢悠悠地转身回林去了，仿佛压根没把村里放在眼里。众人看得面面相觑，都松了一口气。村里的老人说，这巨兽原也有灵性，只是从前被死域逼得没了去处，才这般胡闹，如今得了安身之所，自然就安分了。这巨兽有了家，安分了许多。倒是林里的蕈猪仍旧不安分，夜夜拱人篱笆，村里只得派人在篱外撒一圈香辛果的渣，把猪引开。"
 SUM_Neo.86.a:"让梦回到须弥"
 SUM_Neo.86.b:"先看住封印"
 SUM_Neo.87.t:"入林采药"
 SUM_Neo.87.d:"雨林之中，草药遍地，先前却不曾有章法，采药的东一把西一把，常常糟蹋了好些珍贵的药草。有不懂行的，把有用的当野草扔了，把有毒的当宝贝采了，闹出不少乱子。草神见了，便命懂药的学者定下规矩：何草何时可采，何草须留根，何草不可多取，都一一写明，刊成册子，发与采药人。起初也有人嫌麻烦，依旧照旧采法，后来吃了亏，方才晓得这册子的好处。自此，众人按册采药，有序有度，再不胡乱糟蹋。那医者们得了充足的药材，配药时再不愁缺这少那，救回的性命也不知有多少。那册子还画着各样草药的图形，根是根，叶是叶，一看便知，连不识字的人也能照着采，详尽。这药草成体系地采将起来，两全其美。"
 SUM_Neo.87.a:"让神谕通行"
 SUM_Neo.87.b:"收束信仰的边界"
 SUM_Neo.88.t:"蕈谱新修"
 SUM_Neo.88.d:"教令院六大学派之中，有个生论派，专司那草木生灵的学问。雨林里蕈类繁多，五色缤纷，有的圆如小伞，有的细如手指，先前只当是寻常野菌，无人深究。生论派的学者们，这一日结伴入林，采了各色蕈子回来，细细地分辨它们的形状、颜色、毒性、用处，一一记录在案。有的蕈子能入药，有的蕈子能佐餐，还有的蕈子毒性剧烈，须远远避开，碰都碰不得。学者们为了辨一蕈之毒，竟亲自试尝，险些出了事，幸得草神及时制止。他们把这些分门别类，编成专书，讲得头头是道。那专书既成，连邻近国度的人都慕名来购，一时洛阳纸贵，生论派的名头也随之响了。这蕈类研究经这一番经营，竟成了一门正经学问，填补了空白。"
 SUM_Neo.88.a:"以草神之名行事"
 SUM_Neo.88.b:"以律条为先"
 SUM_Neo.89.t:"申禁樵采"
 SUM_Neo.89.d:"先前那绿荫之约虽立，仍有那贪利之徒，偷偷入林砍伐，趁着月黑风高，一斧一斧地偷着砍。草神见了，决心下一道严厉的禁伐令。这一日，教令院张出榜文，明言须弥全境，凡兰那罗所守之林，一律不许砍伐，违者严惩不贷。令下之后，巡林官便挨村挨户地收那伐木的刀斧，有多少收多少，熔的熔，封的封，连那柴堆里的旧斧头都搜了出来。有藏匿不交的，被查了出来，当场便罚，还游街示众。众人见了这阵仗，再不敢造次，从此那斧斤之声，便在林边绝了迹。兰那罗们见那斧声绝了，欢喜得在林间唱了一整夜的歌，那歌声飘到城里，人人都说从未听过这般好听的曲调。这禁伐令雷厉风行，把那砍树的歪风，一举压了下去。"
 SUM_Neo.89.a:"让梦回到须弥"
 SUM_Neo.89.b:"先看住封印"
 SUM_Neo.90.t:"绿营初立"
 SUM_Neo.90.d:"须弥境内，虽有巡林官看守雨林，可那神圣的世界树，也要有人护卫，方能万无一失。草神便决意再建一支部队，名曰翠绿卫队，专司雨林与圣树的护卫。这一支人马，皆从那本领高强的巡林老手中选拔，个个身手不凡，又忠诚可靠。入选之日，人人都要立下重誓，方许入伍。成军当日，草神亲自校阅，赐下翠绿的旗帜，上书四个大字，众卫士齐齐拜倒，山呼万岁，那声音直震得林中飞鸟乱飞。自此，这翠绿卫队便日日夜夜，守护在世界树旁。那旗帜在风中猎猎作响，威风，城里百姓见了，都道须弥从此又多了一支劲旅。这翠绿卫队一成，如虎添翼，与巡林官互为表里，把那雨林圣树护得铁桶一般，连一只飞虫也近不得身。"
 SUM_Neo.90.a:"让神谕通行"
 SUM_Neo.90.b:"收束信仰的边界"
 SUM_Neo.91.t:"林疆大定"
 SUM_Neo.91.d:"自巡林队扩编以来，管的地方越来越大。先是那边界哨所，继而那深处幽林，一处处都纳入了巡林官的守备，连那从前无人问津的荒僻角落，也有人巡到了。到后来，整个雨林全境，竟都归了他们管辖。巡林官们把辖境划分成片，每片设一头目，统领数人，日日巡查，夜夜守望，各管各的那一片，责任分明。哪处出了异动，片刻便有飞鸽报知，上下畅通，如臂使指。有一回深处起了死域，不过半日，巡林官便赶到了那里，快当。各片的头目每旬还要聚在一处议事，把这一旬的见闻彼此通报，好的褒奖，差的训诫，赏罚分明，谁也不敢懈怠。这雨林全境归入巡林官，调度得宜，再没有从前那般顾此失彼的弊病。各片交界处立了木牌，写明界址，牌下埋着一包各头目画押的字据。禅那园那片归了老巡林管，园里人说他夜里还与兰那罗对歌，唱的是外乡人听不懂的调子。"
 SUM_Neo.91.a:"以草神之名行事"
 SUM_Neo.91.b:"以律条为先"
 SUM_Neo.92.t:"万木长春"
 SUM_Neo.92.d:"这一番经营下来，那雨林渐渐回了旧日的模样。死域没了，乱砍的停了，巨兽安分了，药草有序了，各村联防，巡林密布，端的焕然一新。草神这一日重入林中，但见古木参天，藤萝缠绕，鸟鸣婉转，溪水潺潺，一派生机盎然，连那多年不见的奇花异草，也都开了。她走到一处，还记得当年这里曾是一片死域，黑气冲天，寸草不生，如今却是绿意盈盈，判若两世，心中不胜感慨。随行的学者也都啧啧称奇，说这般的景致，多年不曾见了。草神一路走一路看，见那林中旧日的痕迹都已消散，心中那块石头，方才落了地，随行的众人都齐齐松了一口气。这雨林恢复到没有学者之前的样子，顺应了天道，还了林子本来面目。林口的旧警台上落了雀，草神叫人留着，说且做个记认。"
 SUM_Neo.92.a:"让梦回到须弥"
 SUM_Neo.92.b:"先看住封印"
 SUM_Neo.93.t:"禁语萦回"
 SUM_Neo.93.d:"教令院有一处石室，里头封着些禁忌知识的卷宗。那些书虽被封了，却不安分，仿佛里头关着什么活物。夜深人静之时，守夜的书记官常听见石室里传出低低的声响，像是有人在翻书，又像是有人在梦呓，断断续续，听不真切，那声音忽高忽低，仿佛在与人应答。他起先以为是老鼠作祟，壮着胆子凑近门缝一瞧，里头黑漆漆的，什么也没有，可那声音却依旧不绝。他吓得头发都竖了起来，忙退到一旁，再不敢近前，第二日便请了人来作法。后来那书记官索性在门外贴了一道符，说也奇怪，那声音便弱了些，只是夜深人静时还隐约听得见，诡异非常。这禁忌知识即便封存，仍在卷宗里低声说话，阴魂不散。新来的书记官听了这段来历，宁可去值别处夜，也不肯挨着那道门。"
 SUM_Neo.93.a:"让神谕通行"
 SUM_Neo.93.b:"收束信仰的边界"
 SUM_Neo.94.t:"邪禁惑心"
 SUM_Neo.94.d:"有个年轻的学者，好奇心重，偏不信那禁书有什么邪门，总想着一探究竟。这一日，他趁守卫不备，溜进了石室，摸索着寻到那册禁书，当下便翻开来看。那书页上写的字，古奥诡异，他起先还能勉强辨认，看着看着，便觉头昏目眩，眼前的字仿佛活了过来，一行行扭动起来，像无数小虫在纸上爬。他心中一惊，想合上书，可那手却不听使唤，像是被什么粘住了，动弹不得。就在这时，草神恰巧赶到，一把按住他的手腕，厉声喝道，还不放下。那学者如梦方醒，冷汗直流，扑通一声瘫坐在地。草神又细细叮嘱他，往后切不可再犯这等傻事，那学者连连点头，脸上兀自惊魂未定，好半晌才回过神来，起身时膝头还发软，扶着书楼的门框才立住。这禁书邪门，好奇心害死人。"
 SUM_Neo.94.a:"以草神之名行事"
 SUM_Neo.94.b:"以律条为先"
 SUM_Neo.95.t:"尽缄禁帙"
 SUM_Neo.95.d:"那一册禁书险些酿祸，草神决意严加封存，再不许它出来害人。她令人寻来一块巨石，那石又厚又重，坚不可摧，把那禁书层层裹了，封进一间坚固的石室，石室的墙皆以灵木加固，门口又加了三道锁，一把比一把牢固。这钥匙共有三把，旁人一概不得经手，统统交与草神亲自保管。草神把钥匙拢在袖中，片刻也不离身，又命巡林官昼夜看守，不许任何人靠近那石室半步，从此那石室便成了教令院的禁地。有不知趣的想来打听，都被巡林官挡了回去。草神还立下规矩，每至岁时，必要亲自开启石室查验一回，看看那封印可还牢靠，旁的人一概不许同去，谨慎。这禁书既已深锁，又交与神明保管，万无一失。石室门前的地上，磨出了一道浅浅的凹痕，是巡林官来回站出来的。"
 SUM_Neo.95.a:"让梦回到须弥"
 SUM_Neo.95.b:"先看住封印"
 SUM_Neo.96.t:"张幕为界"
 SUM_Neo.96.d:"世界树乃须弥命脉所在，草神唯恐禁忌知识再去侵扰，便决意在树周围设下一道结界，把它护个严严实实。这一日，她登上树顶，掌心凝聚全身灵力，往下一按，但见一圈淡淡的光晕，顺着树身缓缓铺开，罩住了整棵世界树，又向四周延伸，把那一方天地都笼在里头。这结界看不见摸不着，可但凡有邪祟靠近，便如撞上了铜墙铁壁，进不得半分。守树的学者只见光芒一闪，随即一切如常，若非亲身所见，谁信这里头大有文章。草神收了灵力，脸色略显苍白，却露出了欣慰的神色。那结界立成之后，世界树的叶子反而更绿了些，仿佛也觉出了这份安稳，在风中轻轻舒展，一派安然。这结界一端稳稳立住，护住了须弥的根。有飞鸟撞上结界，扑腾两下便折回，学者们记下这一节，作了个凭证。"
 SUM_Neo.96.a:"让神谕通行"
 SUM_Neo.96.b:"收束信仰的边界"
 SUM_Neo.97.t:"儒冠渐腐"
 SUM_Neo.97.d:"是日，教令院里有个学者，忽然神色大变，口吐胡言，手舞足蹈，竟像是被什么迷了心窍。众人慌忙请来草神，草神一看，便知他是被禁忌知识侵蚀了。她当下施法，暂且稳住那学者，把他安顿到静室歇着，心中却明白，这祸患必是藏在哪本书里，若不根除，早晚还要害人。于是她下令，把教令院所有的藏书，一册一册地清点排查，凡有可疑的，统统挑出来另置一处。这一查，查了整整三日，竟查出好几册夹带禁书的旧卷，那禁书竟藏在书脊的夹层之中，隐蔽。草神又命人把那几册禁书小心捧了，另寻一处更深的石室存放，从此严加看管，再不许凡人轻易触碰。这一番清点，查出了病根，把那祸患的源头挖了出来。清点的册子录了三份，一份呈草神，两份分存六派。"
 SUM_Neo.97.a:"以草神之名行事"
 SUM_Neo.97.b:"以律条为先"
 SUM_Neo.98.t:"芟除邪法"
 SUM_Neo.98.d:"那私自研习禁术之人，见教令院查得紧，便躲到雨林深处，结了个秘密的巢穴，日夜钻研那害人的法门，自以为神不知鬼不觉。这事被巡林官察觉，飞报草神。草神当即下令，着巡林队与翠绿卫队联手，前往清剿。这一日，两队人马趁着拂晓，悄悄围了那巢穴，趁其不备，一拥而入。里头那几个人还在埋头念咒，忽闻喊杀声，吓得魂飞魄散，纷纷束手就擒。那些禁术的器具、卷轴，尽数被缴，堆在一处，一把火烧了个干净，首恶押回教令院问罪，那火光映红了半片林子。草神闻报，方才放下心来，又命人在那巢穴四周种上灵木，把那块被污了的土地，一点一点养将回来。这巢穴一端被端，除去了心腹之患。巢穴旧址后来长出一丛清心，巡林官每旬来看一回长势。"
 SUM_Neo.98.a:"让梦回到须弥"
 SUM_Neo.98.b:"先看住封印"
 SUM_Neo.99.t:"神钉镇罪"
 SUM_Neo.99.d:"赤王时代，曾留下一些奇异的物事，其中有一件名曰判罚之钉，据说能断人罪业，是那远古王权的象征。这钉子年代久远，早埋在黄沙之下，无人问津。这一日，几个好事的学者，把它掘了出来，想要重新测量、考究它的来历。他们架起仪器，量了又量，量的那钉子长宽几何，分量几许，上头的纹路又是何等模样，一一记在册上。可量来量去，那钉子仿佛总有些说不出的古怪，今日量的与昨日量的，竟差之分毫，数据对不上号。学者们面面相觑，百思不得其解。末了，学者们只得把那钉子仍埋回沙下，另立一块石碑记其所在，好叫后来的人再来考究。这赤王旧物，神秘莫测，任你如何测量，也测不透其中的玄机。那石碑立在沙丘背风处，碑上的字，如今已被风沙磨得只剩半边。"
 SUM_Neo.99.a:"让神谕通行"
 SUM_Neo.99.b:"收束信仰的边界"
 SUM_Neo.100.t:"尼伯龙潜影"
 SUM_Neo.100.d:"是日，须弥的天空，忽然暗了一瞬。起初人们以为不过是一片云飘过，可抬头细看，那暗却来得蹊跷，并非云遮，日头明明好好地挂着，倒像是有什么庞然大物，在世界之外的裂隙里翻了个身。那一瞬间，日光尽敛，四下里陡然一凉，连林中的鸟雀都噤了声，扑棱棱地四散奔逃，满城的人都惊得停下了手中的活计，城中的狗也夹着尾巴狂吠。守在净善宫的草神，猛地抬起头来，目光射向当日际裂隙，面色前所未有地凝重，手中的笔啪地一声掉在地上。城中百姓惊魂未定，纷纷焚香祷告，都问这是福是祸，草神却只是摇头，叫众人暂且安心。这世界之外的力量，端的非同小可，才一翻身，便叫须弥的天色为之一暗。当夜教令院的灯，一层一层亮到天明，无人合眼。"
 SUM_Neo.100.a:"以草神之名行事"
 SUM_Neo.100.b:"以律条为先"
 SUM_Neo.101.t:"锁此巨虫"
 SUM_Neo.101.d:"须弥大漠深处，黄沙底下原压着一条沉睡千年的沙虫。这虫来头不小，乃是赤王旧日留下的镇物，当年大慈树王亲手封它，用的正是世界树的根须，一根根扎进沙里，才算把它制住。原来这些年封印松动，沙虫在沙下翻了个身，白日里整片沙丘会自己走动，夜深人静时，地下传来低沉吼声，隔着几里地都听得见。附近阿如村的百姓不敢近前，镀金旅团的商队也绕道而行。守封印的守誓者世代守在这里，传到现在这一辈，人人把符文熟记于心。这一日他们齐聚沙丘之上，掘开浮沙，重画符文，把新砍的根须一道道埋进去，念动古咒。费了九牛二虎之力，沙虫才重新沉睡下去。埋根的坑填平后，上头压了块青石，石上系了三色绸带。"
 SUM_Neo.101.a:"让梦回到须弥"
 SUM_Neo.101.b:"先看住封印"
 SUM_Neo.102.t:"闭门拒渊"
 SUM_Neo.102.d:"净善宫中，小吉祥草王端坐莲台，四下里静得能听见叶落。这一日虚空忽然起了异样，一个陌生的声音凭空响起，自称来自世界之外，言语间尽是诱哄，要草神依他行事，说这须弥百姓原该由他来调度。这声音来路不明，有人说是什么异世的使者，有人猜是愚人众的异端，更有人说是多托雷在背后捣鬼，总之不是这世界里的东西。那声音一遍遍在耳边打转，忽而许以大力，忽而威胁恐吓，宫中侍从个个惊慌，掩面不敢抬头。草神却纹丝不动，连眼皮也不曾跳一下。她缓缓睁开双眼，抬起一只手按住虚空终端，指尖透出碧绿微光，只轻轻一句，便将那声音逐出虚空，宫中重归寂静。干净利落，不留半分情面。那声音逃出宫外，再不敢近前，虚空里从此清净了。"
 SUM_Neo.102.a:"让神谕通行"
 SUM_Neo.102.b:"收束信仰的边界"
 SUM_Neo.103.t:"誓者复盟"
 SUM_Neo.103.d:"大漠深处那道封印之下，沙虫方才重新睡去，守誓者们便围在沙丘顶上，举行立誓之礼。为首的老者须发皆白，手中捧着一卷祖传的誓文，念一句，众人应一句，声如黄钟大吕。誓文写得明白：自今日起，封印若有一日松动，守誓者便以身相殉，绝不后退半步。这守誓者世代相承，父传子，子传孙，名字虽不载入教令院的册籍，那一腔血气却比谁都真。旁边有年轻后生问，若是沙虫冲出来了呢？老者把脸一沉，说那便拿命去填，填到填不住为止。众人听了，个个把胸脯拍得山响。誓罢，风沙大作，沙丘上的脚印转眼被抹平，只有那誓言还留在众人心头。后来每逢风起沙动，守誓者便登上沙丘，把誓文重念一遍，年年如此，从无间断。"
 SUM_Neo.103.a:"以草神之名行事"
 SUM_Neo.103.b:"以律条为先"
 SUM_Neo.104.t:"万祀封缄"
 SUM_Neo.104.d:"守誓者立誓之后，封印的工程日夜不停。那是一道横贯大漠与雨林的禁制，根须从世界树一直牵来，埋进沙下，又沿着雨林的边缘立起石碑，碑上刻满古文字。原来雨林里生生死死，草木最盛，恰能把那禁忌之物的气息一层层化去，比砖石还牢靠。这一日最后一块石碑合拢，工匠们退到数十步外，但见那道禁制秋毫无犯，绿意从雨林一路铺到沙漠边缘，恰似一道青色的长城。从此须弥城与那禁忌之间，便隔着这一整片雨林，人人都知界限所在，再不敢越雷池一步。从此，夜里再也听不见沙下的吼声。雨林边上的村寨还立起界碑，碑文晓谕众人，越界者罚，护林者赏，把这道界限守得铁桶也似。界碑旁的树上拴了铜铃，风一吹便响，隔着二里地也听得见。"
 SUM_Neo.104.a:"让梦回到须弥"
 SUM_Neo.104.b:"先看住封印"
 SUM_Neo.105.t:"渊户终闭"
 SUM_Neo.105.d:"封渊大功告成，那道贯通天地的禁制终于合拢。世界树自根到梢，本来日夜颤动，这些年被禁忌之识侵扰，枝叶间时有杂音。如今封印一落，树身渐渐安静下来，连叶子摆动都放轻了。小吉祥草王连日操劳，眸子底下早现出青影，这些日子她一面调度封印，一面还要安抚城中百姓，片刻不得安闲。这一夜净善宫中格外宁静，草神倚在莲台之上，听着窗外的雨声，眼皮渐渐沉了下去。这位草神自从苏醒以来，何曾有过一刻囫囵觉？如今万事粗定，她才敢合上双眼。这一觉，睡得极为沉稳，连梦也不曾做一个。宫人轻手轻脚地放下帷幔，连咳嗽都不敢出声，生怕惊了这一场好梦。连日里紧绷的神经，此刻才一同松了下来。帷幔外守着的侍女也倚着门框打起盹来，一动不敢动。"
 SUM_Neo.105.a:"让神谕通行"
 SUM_Neo.105.b:"收束信仰的边界"
 SUM_Neo.106.t:"翠冕加身"
 SUM_Neo.106.d:"封渊既定，须弥城中不待吩咐，便忙起一件大事：为小吉祥草王举行加冕之礼。这一日净善宫前，钟鼓齐鸣，香烟缭绕，六派首座、商贾豪右、雨林的巡林官、沙漠的头人，齐齐立在阶下。雨林的人与沙漠的人，向来各走各的路，隔着一片大沙漠，谁也不服谁，今日却破天荒立在一处，向着同一个名字低头。但见那小吉祥草王缓步登上高台，头戴花冠，身披翠袍，眉目之间尽是慈悲。礼官高声唱名，声音传遍广场，四面八方的人齐齐跪下。自这一日起，须弥改了旧气象，人称苍翠之世。欢呼声中，雨林的使节与沙漠的头人破天荒地并肩而立，一同向新王行礼，这一幕，须弥的老人都说活了一辈子也没见过。礼毕，两人谁也不肯先走，末了相视一笑，各回各队。"
 SUM_Neo.106.a:"以草神之名行事"
 SUM_Neo.106.b:"以律条为先"

 #################### 乙线 · 学者共和 ####################
 SUM_RP_Republic_of_Scholars:"诸生共政"
 SUM_RP_Republic_of_Scholars_desc:"议事厅的门被人一把推开，进来的不只是学者，还有挑担的商人、守村的沙民，鞋上带着泥。他们不坐，只站着。为首的把担子一撂，说道：「我们要给须弥换一部律法！」大贤者手里的笔停在半空，满堂鸦雀无声。"
 SUM_RP_Dar_Amurta:"生论派陈情"
 SUM_RP_Dar_Amurta_desc:"生论派的首座捧着请愿书，走进行列，把书高高举过头顶，叫道：「只求一件事，把雨林的研究权还给巡林官！」堂上静了片刻，有人悄悄把窗推开，风一进来，纸角便翻。那首座举着书，手臂酸了，却不肯放下。"
 SUM_RP_Dar_Rtawahist:"素论派窥天"
 SUM_RP_Dar_Rtawahist_desc:"素论派把账本摊在长桌上，一页页翻过去，观星的银子花到哪里，写得含糊。首座指着其中一行，说道：「这账，比星图还难看。」满堂的人凑过去看，谁也不出声。有个管账的悄悄把算盘往袖里藏了藏。"
 SUM_RP_Dar_Spantamad:"知论派开作"
 SUM_RP_Dar_Spantamad_desc:"一个学徒壮着胆子拧开瓶塞，立刻熏得连连咳嗽，惹得满屋人哄笑。那扇常年上锁的门，已被知论派卸下抬到院里，实验室从此敞开，谁都能进来瞧那些瓶瓶罐罐。头一天来的多是学徒，手扶桌沿不敢碰。老学者立在门边，丢下一句：「只管看，随便看。」"
 SUM_RP_Dar_Haravatat:"明论派之藏"
 SUM_RP_Dar_Haravatat_desc:"一个老学者摸着书脊，忽然哭出声来：「这东西，我被禁了三十年啊！」旁人劝他，他只摇头，又低头补那残页。库房里的霉味，散了三日才淡，原来是明论派把窗全打开了。学人们搬出一箱箱残卷，缺的页补上，虫蛀的晒过，一册册重新编目。"
 SUM_RP_Dar_Vahumana:"因论派致诘"
 SUM_RP_Dar_Vahumana_desc:"一张纸在六派手里转了一圈，谁也不肯落名。纸上那句话，是因论派的人把旧档从开国那年翻起，一页页查出来的：大贤者的权柄，到底是谁给的？接过纸的人捏了半晌，终究塞回袖中，赔笑说：「这个……我手抖得厉害。」"
 SUM_RP_Dar_Kshahrewar:"妙论派绘式"
 SUM_RP_Dar_Kshahrewar_desc:"一个老匠人蹲下身，拿手比了比门槛，点头道：「这高矮正好，进出便当。」工匠们围在院里那卷图纸旁，指指点点，越看越欢喜。图纸是妙论派搬来的，画的是寻常人家的屋子。领头的说：「屋子是给人住的，尺寸得依着人，不能依着贤者的心思。」"
 SUM_RP_Dar_Reform:"黜其元老"
 SUM_RP_Dar_Reform_desc:"这日散会，两名侍从走到大贤者身边，恭恭敬敬说了一声：「请。」他把桌上卷宗收好，整整衣襟，一步一步走出议事厅。满堂的人都低着头，没有一个人替他说话。走到门口，他脚步顿了顿，终究没回头。"
 SUM_RP_Dar_Election:"六派共举"
 SUM_RP_Dar_Election_desc:"「这把椅子，你坐得体面。」落选的那位头一个拱手，倒把众人看愣了。六派推举新首座，票箱就搁在院子当中，唱票的立在台阶上，一声声报将出来。围着的学人听见自己名字，脸一阵红一阵白。偏有个唱一票歇一歇的，底下的人急得直跺脚，嗓子都喊哑了。空箱子往桌上一撂，这事就算定了。"
 SUM_RP_Dar_Exam:"课试诸生"
 SUM_RP_Dar_Exam_desc:"从今往后，学者升迁不看门第，只看考成。考场设在旧库房，一人一桌，卷子糊了名字。有个世家子弟考了三回不中，蹲在墙根抽气。旁人劝他，他只说道：「是我学问不济，怨不得人。」说完，把笔往袖里一插，走了。"
 SUM_RP_Dar_Publish:"学报自梓"
 SUM_RP_Dar_Publish_desc:"学报可以自由刊行，印坊的机器从上月就没停过。头一期登了篇指摘贤者的文章，错处不少，也无人删。有人问主笔怕不怕，他把墨辊一推，说道：「错的东西也该印出来，让读者自去分辨。」那人听了，也就不再多问。"
 SUM_RP_Dar_Patent:"赏其绝技"
 SUM_RP_Dar_Patent_desc:"发明者抱着图纸去领专利，官署的人核了又核，末了盖了印，还给了笔赏钱。那老汉捧着文书出门，站在日头下看了半晌，笑得像个孩子，逢人便说：「这下，学问也能换米下锅了！」"
 SUM_RP_Dar_Academy:"学派合治"
 SUM_RP_Dar_Academy_desc:"六大学派自此不分高下，议事时按位次坐，谁也不能压谁一头。往日最有面子的那一派，头一回坐到末席，倒也坐得安稳。有人笑他落势，那首座淡淡道：「这一票，我照样投得。」堂上的事，须得六家点头才算数。"
 SUM_RP_Dar_Council:"诸派会议"
 SUM_RP_Dar_Council_desc:"学派议事会立了章程，凡是学问上的大事，都得拿到这里来议。贤者说得再好，六派不点头，也作不得数。头一日开议，从午后争到掌灯，才定下一条。散会时众人腿都麻了，扶着桌子起身，嘴里还嘟囔：「明日再来。」"
 SUM_RP_Par_Charter:"属稿定章"
 SUM_RP_Par_Charter_desc:"宪章开始起草，执笔的人换了三个，字斟句酌。第一条写得最慢，改了七遍，末了落下一句：「须弥不属于任何一位学者。」写完，执笔的人把笔搁下，手还在抖。旁边的老者凑过去看了，半晌，郑重点了点头。"
 SUM_RP_Par_Assembly:"诸生开院"
 SUM_RP_Par_Assembly_desc:"学者议会开议，座位按地域分，雨林一边，沙漠一边，城邦居中。头一日点名，沙漠来的那位站起来，朗声报了村名。堂上的人愣了愣，才鼓起掌来。他坐下时，手里还攥着驼缰，惹得旁边的人笑了。"
 SUM_RP_Par_Vote:"首议可否"
 SUM_RP_Par_Vote_desc:"木牌一人一块，赞成的搁左边，反对的搁右边。这是须弥头一回拿表决定国政，唱票的喊到后来声都哑了，两边数目咬得死紧。末一块牌一落，满堂长长吐了口气，有人偷偷抹了把汗。有个老学人把牌攥得湿漉漉的，笑道：「省了吵那些闲架，倒也干脆。」"
 SUM_RP_Par_Press:"邸报自梓"
 SUM_RP_Par_Press_desc:"报章一出，街上多了卖纸的童子，嗓门一个赛一个。议论国政的文章头一回署上真名，写的人把名字写得很小，却没人再涂掉。有个老者买了一张，站在墙根念给不识字的听，念到痛快处，拍着报纸叫道：「这话说到家了！」"
 SUM_RP_Par_Party:"结社联朋"
 SUM_RP_Par_Party_desc:"学派之外又起了政党，各自挂了招牌，在茶摊上拉人。往日一同做学问的同窗，如今分坐两张桌子，说话都客气了三分，谁也不先提旧事。有两个老同学碰见，愣了愣，只拱了拱手，各自走开。须弥的政事，从此有了岔路。"
 SUM_RP_Par_Court:"别置谳所"
 SUM_RP_Par_Court_desc:"「这判词，竟不问他师从哪一位！」老妇人颤声说完，被人赶紧扯了袖子，叫她压低嗓子。法庭挪到了教令院墙外，门楣上不挂贤者的印。头一桩案子审的是个老学者，他站在阶下，跟寻常人一样报名姓。判词念罢，四下里静了半晌，连咳嗽都忍着。旁人见那老妇人紧张，反倒笑了：「这里不问师门，只问理。」"
 SUM_RP_Par_Police:"置巡捕署"
 SUM_RP_Par_Police_desc:"「往后林子归我们，城里归你们。」提纳里把旧文书捆扎停当，撂下这句话。治安官署挂牌当日，巡林队把城里的差事全交了，只留雨林那一摊。两边抱拳作别。有个巡林官嘟囔了句「倒是清爽」，被提纳里扫了一眼，立刻噤了声。官署门前新挂的牌子，漆还没干透。"
 SUM_RP_Par_Census:"清查户籍"
 SUM_RP_Par_Census_desc:"须弥头一回清点人口，书吏逐村走，连帐篷也掀开数。沙漠那边有人不肯报，嚷道：「报了名，就要抽丁！」书吏耐着性子解释，末了在册上写了四个字：一户五人。那人凑过来看，半信半疑地把帐篷又放下了。"
 SUM_RP_Par_Budget:"审议岁计"
 SUM_RP_Par_Budget_desc:"国库的账搬到议会厅，一笔笔念。念到某处，堂上有人站起来问：「这笔钱，买了什么？」管账的翻遍文书，答不上来，汗顺着下巴滴在册子上。满堂静了一阵，自此每笔支出都得过堂。"
 SUM_RP_Par_Local:"郡邑自专"
 SUM_RP_Par_Local_desc:"「井是公家的，挨着次序来！」老议事拿旱烟杆一敲，那后生便不言语了。城邦和沙漠各自管起自家事，教令院只管通行的律条。阿如村自己立规矩，头一条便是水井轮着用。教令院派来的人瞧了半晌，把公文往袖里一收，转身走了。村里人围在井边，看那后生红着脸蹲下，把手伸进凉水里。"
 SUM_RP_Par_School:"广开义塾"
 SUM_RP_Par_School_desc:"十七个娃头一天进学堂，有放羊的，有挑水的，手上还沾着泥。旧仓房收拾出来做了村口的学堂，桌凳高一块低一块。老先生不嫌弃，先铺纸，教他们写自己的名字。有个放羊的把笔攥得像攥羊鞭，写出来的字歪歪扭扭，先生瞧了直乐。放学时，那娃把写好的纸揣进怀里，一路小跑回家给娘看。"
 SUM_RP_Par_Constitution:"布新宪章"
 SUM_RP_Par_Constitution_desc:"宪法颁布当日，全城的人都到广场上看。条文念到最末一条，念的人顿了顿，那上面写着草神的名字，只作见证，不预政务。念完，人群里有人轻轻应了一声，接着便都有些眼热。有个老人抹了抹眼角，没说话。"
 SUM_RP_Par_Republic:"诸生之国"
 SUM_RP_Par_Republic_desc:"须弥成了共和国。权力不从天降，也不由一人独揽，是从学者、商人、猎人与守绿洲的人手里，一分一厘凑起来的。开国当日下了雨，众人在泥里站着，谁也不肯先走。有个老猎人仰着脸让雨打，笑道：「这雨，倒像是给咱们洗尘。」"
 SUM_RP_Com_Treasury:"帑藏充溢"
 SUM_RP_Com_Treasury_desc:"「这么些银钱，究竟流向了何处？」年轻书吏忍不住问，老账房摆摆手，叫他莫问。国库重新盘账，账房点了三夜的灯。往年的数目对不上，一笔笔往下追，追到一间空库，才晓得大贤者挪走的比众人猜的还多。管账的把算盘一推，整间屋子静得只剩灯花爆响。"
 SUM_RP_Com_Tax:"厘定税章"
 SUM_RP_Com_Tax_desc:"新税法按田亩与人头收，一亩一斗，一口一文，写得明明白白。沙漠那边往日要加倍，这回一并勾了。税吏下乡，沙民围上来看告示。有个老汉伸手摸了摸那行字，半晌才道：「这回，倒不欺人了。」"
 SUM_RP_Com_Mint:"权操钱冶"
 SUM_RP_Com_Mint_desc:"铸币权收归议会，官炉重开，钱样换了新的，边上多一道纹。市面上的私钱限期兑回，兑不完的，当街砸了。铸钱的铜从沙漠旧窟里淘来，熔时掺一点沙金，钱色发红。有个钱贩子捧着半袋旧钱蹲在炉边，看一枚枚化掉，嘴里念叨：「这钱，本是从阿如村一路驮来的……」炉火一旺，那点旧钱也化作一汪红水了。"
 SUM_RP_Com_Caravan:"给商队符"
 SUM_RP_Com_Caravan_desc:"商队领了通行文书，从此雨林与沙漠之间的货，可以明目张胆地走。头一趟车队过境，驼铃响了半日，守卡的只看文书，不看货。押队的老汉捋着胡子说道：「走了二十年，头回这么踏实！」"
 SUM_RP_Com_Port:"奥摩斯港启市"
 SUM_RP_Com_Port_desc:"奥摩斯港开了，外国的船一艘接一艘靠岸，桅杆密得像林子。卸货的脚夫忙到天黑，码头上的话有七八种，谁也听不懂谁，只认得摩拉。有个脚夫举起一锭银子，对着几个外商比划，大家都笑了。须弥头一回向外商敞开。"
 SUM_RP_Com_Trade:"七邦互市"
 SUM_RP_Com_Trade_desc:"须弥与邻国签下通商条款，香料、咖啡各有出路。签约当日，双方换了文书，又各饮一杯。有个商人站在阶下，掐着指头算税，算完咧嘴笑道：「这一趟，能省下半月的脚费！」自此车队不必绕远路。"
 SUM_RP_Com_Bank:"钱柜新设"
 SUM_RP_Com_Bank_desc:"须弥银行开业，柜台是新打的，铜栏杆擦得能照见人。头一个上门的不是商人，是个穷学者，抱着手稿来借钱。掌柜的翻了两页，盖了印，笑道：「这稿子，就押在这儿。」那学者千恩万谢地走了。学问自此也能押在柜上。"
 SUM_RP_Com_Guild:"百商合券"
 SUM_RP_Com_Guild_desc:"各家商会凑在一处，立了字号，公推一位老掌柜管事。从此须弥的货运到七国，路上有人接应，遇事有人出头。头一批货出港当日，老掌柜站在码头上，一直看到船没了影，才捋着胡子道：「成了。」"
 SUM_RP_Com_Plantation:"香圃连畦"
 SUM_RP_Com_Plantation_desc:"沙民蹲在田埂上瞧苗，一个道：「这土，竟也认人。」另一个笑道：「只要你肯下力气伺候它。」香料园一处接一处开出来，连沙漠边上也垦了几块，引水浇灌，苗栽得整齐。头一年收成稀烂，第二年便见绿。有个沙民伸手摸了摸嫩苗，又赶紧缩回手，怕碰折了。"
 SUM_RP_Com_Coffee:"苦饮调饴"
 SUM_RP_Com_Coffee_desc:"咖啡与糖成了须弥的新招牌。城里新开了几家铺子，煮咖啡的壶擦得锃亮，糖块摆在碟里，一碟三块。有个外来的客商尝了一口，皱着眉又喝一口，末了问道：「这方子，卖不卖？」店主笑道：「不卖，请你常来就是。」"
 SUM_RP_Com_Industry:"百工渐兴"
 SUM_RP_Com_Industry_desc:"缫丝与织造的作坊在城外落成，烟囱一排排立起来，机杼声从早响到晚。女工下了工，成群往城里走，袖口沾着丝絮，一路说笑。老织匠摸着新机子，叹道：「这物件，比手快十倍！」旁边徒弟问怎么用，他便比划起来。"
 SUM_RP_Com_Rail:"沙海驰轨"
 SUM_RP_Com_Rail_desc:"铁路修进沙漠，铁轨一直铺到沙丘底下。头一列火车开过，牧人牵着羊站在远处看，羊被汽笛惊得乱窜。商队的人蹲在路基旁，脸上看不出喜忧。有个老驼工吐了口唾沫：「这铁家伙一响，咱们的驼铃怕是要没人听了。」往后的路谁说了算，难讲。"
 SUM_RP_Com_Prosperity:"殷阜为国"
 SUM_RP_Com_Prosperity_desc:"须弥的谷仓一囤囤满起来，管仓的人挨个查验，摸着粮堆直笑。饥荒那年啃过的树皮，如今的孩子听着像故事。有个老人端着碗坐在门槛上，扒了一口饭，叹道：「这碗饭，吃得安稳。」"
 SUM_RP_Kno_Terminal:"虚空普施"
 SUM_RP_Kno_Terminal_desc:"虚空终端不再由教令院独占，各城邦都能接入。头一日接入，阿如村的老人对着终端说了句话，竟得了回音，吓得他后退两步，叫道：「它……它应我了！」孩子们围上来，抢着问东问西，把老人挤到了一边。"
 SUM_RP_Kno_Data:"智归兆民"
 SUM_RP_Kno_Data_desc:"教令院贴出告示：知识为公有，不再按资历发放。往日要熬到三阶才许看的书，如今学徒也能借。有个小学徒捧着书回屋，连夜读到天亮，眼睛红得像兔子，第二天顶着俩红肿眼珠子来还书，还舍不得放手。"
 SUM_RP_Kno_Archive:"楼贮群书"
 SUM_RP_Kno_Archive_desc:"教令院那间常年落锁的密室开了，门轴响得像哭。万卷书库向所有人敞开，书架上落了厚灰，一拂就是一层。头一个进去的是个扫地的杂役，他站在门口，不敢往里迈。里头有人喊：「进来吧，都是你的了！」他这才怯生生迈进去。"
 SUM_RP_Kno_Print:"梓行活字"
 SUM_RP_Kno_Print_desc:"活字印刷铺子一家接一家开，排字的师傅手指飞快。书的价钱一降再降，末了连学徒也买得起。有个孩子攒了半年的钱，买了本薄册子，抱在怀里不肯撒手，睡觉都搁在枕边。"
 SUM_RP_Kno_School:"设塾授民"
 SUM_RP_Kno_School_desc:"平民学堂在沙漠村落里开学，教室是帐篷，黑板是块涂了墨的木板。头一日来了九个孩子，还有两个大人蹲在后头听。教书的人说道：「想学的都留下，没人赶你们。」那两个大人不好意思，只把头低下，却也没走。"
 SUM_RP_Kno_Women:"虚席待媛"
 SUM_RP_Kno_Women_desc:"女学者头一回拿到议席，走进议事厅时，满堂的人都不作声。她挑了个靠窗的位子坐下，把卷宗摊开，一条条讲。起初有人低头不语，听到后来，连最古板的老先生也点了头，低声道：「这话说得在理。」"
 SUM_RP_Kno_Desert:"沙中设讲"
 SUM_RP_Kno_Desert_desc:"「换不来水，换得来道理。」学者这么答那个赶驼的。他背着书箱进沙漠讲学，帐篷底下坐了二十来人，佣兵、猎人、赶驼的都在。讲到入神处，那佣兵把刀往沙里一撂，听得忘了神。风把帐篷吹得哗哗响，竟没人起身。散场时，那赶驼的还在琢磨那句话，牵着骆驼走出老远才回过神。"
 SUM_RP_Kno_Research:"研求无禁"
 SUM_RP_Kno_Research_desc:"「我这题目，倒不知打哪一笔写起。」年轻学者挠着头。做学问不再要批条，自己立个题目便动手。有人乐得好几夜不合眼，也有人犯了难，站在院里不知从哪儿下脚。管库的老头捋着胡子：「从前是等上头批，如今是等自己想通。」那年轻学者于是铺开纸，先写了个题目，又揉成一团，扔进了纸篓。"
 SUM_RP_Kno_Ruin:"考稽故墟"
 SUM_RP_Kno_Ruin_desc:"「你能烧得出来？」同伴一句话，把那学者问住了。他没接腔，只蹲下身把砖缝里的沙一点点抠出来。赤王时代的旧墙，如今成了考据的宝贝，学者们带着尺子绳索，一段段量过去。另一人摸着墙根道：「这砖的烧法，早失传喽。」日头都落山了，几个人还围着墙根打转，掌灯的催了两遍，才恋恋不舍地走。"
 SUM_RP_Kno_Language:"文教四达"
 SUM_RP_Kno_Language_desc:"「你看，我会写自己的名字了！」妇人冲旁边人嚷，眼角笑出了褶子。须弥的字传到村口，墙上刷着大字，连井台上都刻了名。她拿树枝在地上照着描，描了半日，总算把自己的名字写全。旁边人凑过来看，她却用袖子盖住，笑道：「待我写完，再给你瞧。」"
 SUM_RP_Kno_Truth:"真理无疆"
 SUM_RP_Kno_Truth_desc:"禁书令废了。库房里那些封了三十年的书重见天日，纸都发脆，翻开得先呵口气。老学者一册册往外抱，抱到后来索性坐在地上哭，边哭边道：「可算见着天了！」真理自此可以写在纸上，不必再藏在心里。"
 SUM_RP_Kno_All:"智为天下"
 SUM_RP_Kno_All_desc:"须弥宣告：知识属于所有人。这话写在城门上，来来往往的人都看得见。有个挑夫停下担子，仰头念了一遍，念得磕磕绊绊，念完自己先笑了，拍着脑袋道：「是我识得晚！」旁边人也跟着笑。"
 SUM_RP_Kno_Enlighten:"牖民以智"
 SUM_RP_Kno_Enlighten_desc:"学士们背起书箱，走出高塔，进了市集与绿洲。茶摊上有人拉着他们问医理，问水利，问得琐碎。学士蹲在小板凳上，一笔笔写在纸上，写得满手是墨。有个老农问完了，端碗茶递过去：「先生，喝口水，歇歇。」"
 SUM_RP_Cit_Village:"沙中成聚"
 SUM_RP_Cit_Village_desc:"沙漠的村落头一回被画进须弥图册，画图的人骑着驼，一村村地走。画到阿如村，村长搬出旧井的图，非要他描得仔细：「这井，描大些！」册子印出来，村民围着看，指着一个小点笑，说那就是咱村。"
 SUM_RP_Cit_Tribe:"诸部入籍"
 SUM_RP_Cit_Tribe_desc:"部族名册立起来，各家的谱系由族老口述，书吏一笔笔记。记到某支断了线，族老沉默半晌，说道：「那年逃荒，走了三房，再没寻回来。」说罢，拿手在桌上抹了一把。血的律法自此被须弥认下。"
 SUM_RP_Cit_Rights:"授沙民籍"
 SUM_RP_Cit_Rights_desc:"沙漠民得了公民权，文书发到家里，纸上有印。往年税吏可以随意踏进绿洲，如今得先递帖子。有个老汉把文书压在枕下，夜里摸了两回，嘴里念叨：「这纸，可是咱的凭据。」摸到天亮才睡着。"
 SUM_RP_Cit_School:"沙海设序"
 SUM_RP_Cit_School_desc:"沙海学堂开班，教的是须弥文字与水利。头一堂讲水，先生拿沙盘演示沟渠怎么走，孩子们围成一圈，看得眼睛发亮。有个孩子举手问道：「先生，能把水引到我家门口么？」先生笑道：「先把字认全了再说。」"
 SUM_RP_Cit_Water:"绿洲浚渠"
 SUM_RP_Cit_Water_desc:"绿洲的水渠重新疏浚，淤泥一筐筐抬出来，渠底的石头还认得出旧纹。水一通，田亩便扩到村外，荒了多年的地也翻出新土。妇人们在新田边插木桩，插得整整齐齐。有个媳妇直起腰，擦把汗道：「这田，总算活了。」"
 SUM_RP_Cit_Oasis:"垦此荒洲"
 SUM_RP_Cit_Oasis_desc:"绿洲垦殖的章程铺开，划地的人拿着绳子在沙边量，一户一块，打桩为界。沙民蹲在自家地头，捏起一把土，搓了又搓。有个当场哭了，说道：「祖宗三代，没摸过自己的土！」旁人劝他，他只把那土攥得更紧。"
 SUM_RP_Cit_Caravan:"商道共辖"
 SUM_RP_Cit_Caravan_desc:"商道由须弥与部族共管，收路费的岗亭两边各派人。头一日交接，两边的人对坐了半天，谁也不肯先开口收钱。末了商队来了，两边一同上前，倒把赶驼的吓了一跳，勒住驼道：「这……这是收钱，还是打劫？」众人哄笑。"
 SUM_RP_Cit_Amnesty:"宥还流人"
 SUM_RP_Cit_Amnesty_desc:"被教令院流放的沙漠人得了赦，一队人牵着驼从边境回来。走到村口，先看见自家的老井，井台上还刻着他父亲的名字。他把行囊一放，跪下去捧了口水喝，边喝边道：「这水，还是那个味。」"
 SUM_RP_Cit_Gold:"镀金旅团来附"
 SUM_RP_Cit_Gold_desc:"镀金旅团得了归化的门路，旗帜与编制都可留着，只把枪口的方向改一改。谈条件当日，首领把旧旗铺在桌上，摸了摸旗面，说道：「这面旗底下，死了不少弟兄。」谈完，旗还是那面旗，只是从此听的号令换了。"
 SUM_RP_Cit_Chief:"诸部会议"
 SUM_RP_Cit_Chief_desc:"各部族的首领进了议事会，坐的是新打的椅子，个个坐得笔直。头一回发言，一位老首领讲的是水井，讲得琐碎，堂上的人却听得认真。他末了说道：「水井的事，我说了四十年，没人听。」散会时，学者们一直送他到门口。"
 SUM_RP_Cit_Equal:"沙林均平"
 SUM_RP_Cit_Equal_desc:"律法上添了一句：雨林与沙漠，在法前一样。这一句写得短，争的人却多。写定当日，堂上一位沙漠来的议员站起来，什么也没说，只朝众人拱了拱手，眼圈红了。旁边人递过毛巾，他摆摆手，坐下了。"
 SUM_RP_Cit_Union:"沙林合疆"
 SUM_RP_Cit_Union_desc:"血与林合成一个须弥。这话是签约当日说的，说的人把两张纸并在一处，按了同一个印。雨林的使者与沙漠的首领互相看了一眼，各自伸出手来，握在一处。围观的百姓拍手，拍得掌心发红。有个老人喊道：「这才像一家！」"
 SUM_RP_Cit_Commonwealth:"沙林共阜"
 SUM_RP_Cit_Commonwealth_desc:"绿洲连成一片，水渠相接，路上设了驿站，夜里也有灯火。往日里被当作边角的沙漠，如今在图册上占了一整页。有个旅人从南走到北，逢人便说：「走了半月，水囊竟没空过！」"
 SUM_RP_Edu_Border:"边隅设序"
 SUM_RP_Edu_Border_desc:"「这个字，再抄十遍。」瘸腿老军拿拐杖敲敲桌角，那兵苦着脸，也只得抄。边疆的学堂就挨着要塞，墙是新的，屋里刀架挨着书架。下了操的兵进来，把刀往架上一靠，坐下认字。老军教得慢，兵们也不催。有个兵抄完十遍，把纸吹了吹，悄悄塞进怀里，说要寄回家。"
 SUM_RP_Edu_Desert:"沙徼置戍"
 SUM_RP_Edu_Desert_desc:"「饶了我吧，下回再不敢了！」那劫道的被按在沙地上求饶，巡防的却笑：「放了你，转个身又来。」沙漠巡防队刚立起来，营盘就扎在商道要冲，白日夜里都派人巡。头一回出队便撞上一伙拦路的，三两下就散了。打这以后，商队的骆驼没再丢过，夜里也敢生火做饭，驼铃一路响到天明。押队的老汉说，这伙后生顶用得很。"
 SUM_RP_Edu_Militia:"编氓为兵"
 SUM_RP_Edu_Militia_desc:"民兵的规矩铺开，雨林的自守雨林，沙漠的自守沙漠。农闲时操练，农忙时下地，枪就搁在门后。有个老汉操练时总慢半拍，队长骂他，他嘿嘿笑。可一喊到自家村名，他跑得比谁都快，众人笑道：「这老儿，真有两下子。」"
 SUM_RP_Edu_Officer:"设武备塾"
 SUM_RP_Edu_Officer_desc:"军官学堂开课，头一日点名，报上来的出身五花八门，有商贩的儿子，有猎户的子弟。教官把名册一合，说道：「这里只认本事，不认老子。」头一仗演习，那个商贩的儿子赢了，猎户的子弟不服，约下回再比。"
 SUM_RP_Edu_Corps:"简练常旅"
 SUM_RP_Edu_Corps_desc:"常备军团成军当日，校场上站了黑压压一片，旗子一面接一面。将军走上将台，讲了不到十句，底下的兵齐声应了一嗓子，震得树上鸟都飞了。有个新兵扯着嗓子喊得最响，旁边人捅他：「将军没问呢！」须弥头一回有了自己的兵。"
 SUM_RP_Edu_Fort:"边筑坚堡"
 SUM_RP_Edu_Fort_desc:"「瞧得见自家的么？」旁边人问了一句，那人指指远处，没言语。要塞顺着国境一座座排开，石料是从旧王城拆来的，砌得又厚又牢。守军上墙当日，望远的说道：「站这儿，能望见三国的炊烟。」军械一车车往里送，有个年轻兵搬得直喘，旁边老兵接过来帮他扛，说：「往后这墙，就是咱的家。」"
 SUM_RP_Edu_Recon:"谍骑绘图"
 SUM_RP_Edu_Recon_desc:"「就是没水，才要添。」将军趴在图上看了半夜，指着一处这么说。斥候撒出去整三月，回来时靴子都磨穿了。他们把走过的路一笔笔描下，拼成一张大图，铺开占满一屋子。一个斥候道：「那地方，连滴水都没有。」将军说完，拿笔在那个点上重重圈了一圈，墨都洇开了。"
 SUM_RP_Edu_Supply:"沿涂置亭"
 SUM_RP_Edu_Supply_desc:"后勤驿站沿着铁路与水路铺开，一站接一站，粮草、弹药、草料各有堆场。头一回试运，一车军粮从城郊运到边关，只用了四日，比驼队快了一半。管事的掐指算了算，笑出了声；押车的老兵却摸了摸腰间驼铃，叹道：「往后，这铃怕是用不上了。」"
 SUM_RP_Edu_Tactic:"沙中演阵"
 SUM_RP_Edu_Tactic_desc:"军官把沙漠里打滚的那套战法写进操典，一行行写，写到伏击一段，笔停了很久。他叫来几个老佣兵，让他们把当年怎么躲沙暴、怎么断水的话都说一遍。一个老佣兵道：「沙暴来了，趴下，别动！」军官一笔笔记住。操典写完，厚得像块砖。"
 SUM_RP_Edu_Drill:"合为戎典"
 SUM_RP_Edu_Drill_desc:"全军训典统一，口令一遍遍往下传，传到最远的哨所，已走了半个月。哨所的兵跟着学，学得七扭八歪，倒也没人偷懒。传令的官临走留下一句：「口令记不对，人头落地！」众兵齐声应下，把那口令又念了三遍。"
 SUM_RP_Edu_Tech:"购求异械"
 SUM_RP_Edu_Tech_desc:"军械从外国买了进来，拆开摆在桌上，工匠围着看，看得眼花。领头的老师傅拿尺子量了三天，才敢动手仿造。头一批仿出来的枪，打了十发，炸了两支。他没恼，抹了把手上的油，只让人再量一遍，说道：「差一分，就要人命。」"
 SUM_RP_Edu_Army:"更练锐卒"
 SUM_RP_Edu_Army_desc:"旁边人一把捂住那老头的嘴，连声「噤声」。老头还要挣着往外吐那句话：「这是共和国最后的靠山。」众人只好把他拽到一旁。须弥的新陆军，枪是簇新的，操是全新的，连脚上的靴子都一律发下。阅兵当日，队伍打议事厅前走过，脚步齐得像一个人踩出来的。军容是齐整，可谁也不敢多说那层意思。旁边人叮嘱他：这话烂在肚里，莫要再提。"
 SUM_RP_Edu_Shield:"须弥干城"
 SUM_RP_Edu_Shield_desc:"「没看明白就走？」守营的朝坡那边喊了一声。外敌来探，趴在坡上瞧了半日，见盾墙纹丝不动，悄悄退了。须弥之盾横在雨林与沙漠中间，营垒依着地势，前头是林，后头是水。将士把盾牌靠墙放着，日夜轮班，甲不离身。有个新兵头回值守，紧张得手心冒汗，老兵叫他：「把稳了，别慌。」"
 SUM_RP_The_Republic_Standing:"共政既成"
 SUM_RP_The_Republic_Standing_desc:"宪法生效当日，议事厅前站满了人，学者、商人、猎人、守村人挤在一处，鞋上沾着泥与沙。有人把宪法抄在大纸上，举过头顶。风把纸吹得哗哗响，谁也没伸手去按。有个老猎手扯着嗓子喊：「这纸，咱须弥人自己写的！」众人齐声叫好。"
 SUM_RP_The_Gilded_Commune:"旅团置社"
 SUM_RP_The_Gilded_Commune_desc:"镀金旅团与沙漠民合在一处，攻破了教令院最后一座塔。塔倒当日，尘土扬了半城，众人站在废墟上，看见库里堆着的金银。有个沙民喊了一声：「这是须弥人的！」众人应声如雷，声震得残砖都往下掉。"

 SUM_Neo.107.t:"诸生共政"
 SUM_Neo.107.d:"加冕礼方过，须弥城中还有一桩悬案未了。原来那些年大贤者阿扎尔独揽大权，议事厅的大门向来只为他一人而开，六派首座也只能侧身旁听。这一日，议事厅的两扇大门被人从外头一把推开，走进来的不止是衣冠楚楚的学者，还有满身风尘的商人，更有几个沙漠里守绿洲的村人，腰间还别着弯刀。这几路人马本是井水不犯河水，今日却凑在一处，为的是同一件事：给须弥换一部新律法。为首的学者把请愿书往案上一拍，声言旧律不除，须弥百姓永无宁日。阿扎尔坐在上首，脸色一阵青一阵白，半晌说不出话来。这一推，推出了一个新的须弥。阶下的人越聚越多，把议事厅围了个水泄不通，都在等一个答复。有人爬上墙头张望，被巡卫唤下来，也不恼，只在底下等着。"
 SUM_Neo.107.a:"推进议会的议程"
 SUM_Neo.107.b:"把权柄交还民间"
 SUM_Neo.108.t:"生论派陈情"
 SUM_Neo.108.d:"议事厅里，各路人马轮番陈情。先有生论派的首座站将出来，双手递上一份请愿，字写得密密麻麻。原来这些年生论派把雨林的研究权攥在手里，巡林官们终日巡山，反倒不许采集标本，不准记录草木，遇事还得跑来教令院请示。这成何体统？那首座今日当众请命，要把雨林的研究权一并交还巡林官，说是谁日日守着林子，谁才配研究林子。这话嘟嘟囔囔念出来，底下巡林官们个个伸长了脖子。提纳里也在人群里，连连点头；旁边的柯莱攥紧了拳头，眼里放着光。阿扎尔坐在上头，把那请愿书翻了两翻，终究没敢驳回。从这一日起，雨林里的事，巡林官说了算。这一下，巡林官们总算出了头，往后巡山再不用看人脸色。巡林官把令牌往腰里一别，当夜便点齐人马进了林子。"
 SUM_Neo.108.a:"按学派议决行事"
 SUM_Neo.108.b:"听从乡野的呼声"
 SUM_Neo.109.t:"素论派窥天"
 SUM_Neo.109.d:"生论派的话音才落，素论派的人便越众而出。这素论派掌管观星之术，向来以推算天象为能事，谁料这一回，他们不推星象，先算起账来。只见几个学者抬来一大摞账册，往案上一摊，那纸页散开，竟比观星的星图还铺得开。这账一摊开，众人的眼睛都直了：原来历年的经费，大半没用在观星台上，倒不知去向，账面亏空比天上的窟窿还大。为首的学者指着账上一行，说这一笔买的是星盘，星盘却从没见人用过；又指一行，说这一笔修的是观星台，台子却三年没开过顶。阿扎尔听得脸上发热，低头假装看文书。这账目摊开，比星图还难看，暗处不知藏着多少猫腻。这般账目摆在明处，如何不叫人心惊肉跳？账目一页页翻过，议政厅里静得能听见纸响，无人再说情面。"
 SUM_Neo.109.a:"以律法为绳"
 SUM_Neo.109.b:"以人情为度"
 SUM_Neo.110.t:"知论派开作"
 SUM_Neo.110.d:"素论派算完账，知论派接着开口。这知论派掌管言语与符文之学，实验多在密室中进行，历来门禁森严，非本派弟子不得入门。这一日，知论派的首座当众宣布：从今往后，实验室的大门敞开，凡须弥百姓，无论士农工商，皆可进来观看，研究成果也不再锁进密室，一并公之于众。此言一出，满堂哗然。有老学者皱眉，说学问岂可便宜外人？那首座却道，学问本是天下公器，锁在密室里发霉，倒辜负了它。说罢，当下便取来钥匙，当面把那尘封多年的密室门打开，让众人进去瞧个明白。这一开，把多少秘密晒在了日头底下。有胆大的百姓，当场便取了卷册翻看，指着上头的符文问长问短，学者们也一一作答，再不藏着掖着。"
 SUM_Neo.110.a:"推进议会的议程"
 SUM_Neo.110.b:"把权柄交还民间"
 SUM_Neo.111.t:"明论派之藏"
 SUM_Neo.111.d:"知论派开放了密室，明论派也不甘落后。这明论派掌管天文与历算，库中典籍汗牛充栋，只是这些年一道禁书令下来，多少书卷被打入冷宫，或遭焚毁，或落满灰尘，散乱得不成样子。这一日，明论派的学者们卷起袖子，把库门大开，一函一函地清理起来。那些残卷有的被水浸过，字迹模糊；有的被虫蛀得千疮百孔，拼都拼不齐。学者们便一张张摊平，一笔一笔誊抄，按年月重新编目，标出哪卷是原本，哪卷是残篇。有年轻学者捧着半页残纸，如获至宝，说这上头记的，正是失传已久的星象。端的忙了整整三日，一部尘封的典籍重见天日。一函函残卷重排上架，书库中渐渐有了章法，后来的人按目索骥，再不必大海捞针。有个老书吏对着目录，老泪纵横，说他抄了一辈子书，头一回见这般齐整。"
 SUM_Neo.111.a:"按学派议决行事"
 SUM_Neo.111.b:"听从乡野的呼声"
 SUM_Neo.112.t:"因论派致诘"
 SUM_Neo.112.d:"各派都在清算旧账，因论派却把眼光放得更远。这因论派专攻因果之学，最爱追问一件事的来龙去脉。这一日，因论派的首座站出来，当着满堂的人，向阿扎尔发问：敢问大贤者，您这一身权柄，究竟从何而来？是祖上所传，还是众人所举？若是祖传，须弥的律法何曾写过？若是众举，又是谁举的，几时举的，可有凭据？这一连串问题，如同连珠箭，支支射在阿扎尔的痛处。他张了张嘴，先说是祖制，因论派便翻出律条，说律条上并无此款；改口说是众望所归，因论派又问众人在哪里，凭据何在。问得那大贤者哑口无言，脸色煞白。因论派还不肯罢休，又追问一句，既无凭据，这权柄莫非是凭空生出来的？满堂哄笑，阿扎尔面上越发挂不住。"
 SUM_Neo.112.a:"以律法为绳"
 SUM_Neo.112.b:"以人情为度"
 SUM_Neo.113.t:"妙论派绘式"
 SUM_Neo.113.d:"因论派问得大贤者无言，妙论派的人便捧着一卷图纸走上前来。这妙论派掌管营造与机关之术，平日里盖房子、造器物，最讲究个实用。只见那首座把图纸在案上铺开，上头画着须弥城的房舍街巷，标得清清楚楚。这图纸上画的，与如今的须弥大不相同：如今的屋子，门高得够不着，窗小得透不进光，据说为的是彰显学问的庄严，住的人反倒憋屈。妙论派的首座指着图纸道，房子是给人住的，该按人的身量来盖，门要伸手可及，窗要敞亮通风，街巷要留得下人走。这一番话，说得众人连连点头，都道这才像个住人的地方。议长当场拍板，着妙论派依此图纸，先于城郊试盖一处，让众人看看，房子按人的身量盖，究竟是何等光景。"
 SUM_Neo.113.a:"推进议会的议程"
 SUM_Neo.113.b:"把权柄交还民间"
 SUM_Neo.114.t:"黜其元老"
 SUM_Neo.114.d:"诸派你一言我一语，把阿扎尔的不是数了个遍。到了这地步，众人也不再多言，只齐齐立起身来，请大贤者离开议事厅。这议事厅他坐了不知多少年，往日里谁敢正眼瞧他？今日却是众口一词，要他走人。阿扎尔缓缓站起，扶着案角，一步一步往门口挪。他走到门边，忍不住回头望了一眼，满指望有人念在这些年的情分上，替他说两句好话。可是满厅的人，一个个低着头，或看自己的鞋尖，或翻自己的文书，竟没有一个人开口。这位大贤者，就这样走出了议事厅，身后静得连一根针掉在地上都听得见。这阿扎尔在须弥经营多年，门生故吏遍于朝野，谁知今日一走，竟无一人肯送，应了那句树倒猢狲散。门下那伙帮闲的，早一哄而散，各寻各的新主子去了。"
 SUM_Neo.114.a:"按学派议决行事"
 SUM_Neo.114.b:"听从乡野的呼声"
 SUM_Neo.115.t:"六派共举"
 SUM_Neo.115.d:"阿扎尔走了，议事厅里空出一把交椅，这便要推举新的首座。往日的首座都是上头指派，谁强谁上，底下人连个屁也放不得。这一回却不同了：六大学派各推各的人，当众投票，票数一笔一画写在板上，谁得几票，人人都看得见。但见书记官高声唱票，一票一票地念，唱到后来，生论派与妙论派的两位先生票数咬得紧，你追我赶，差着一两票。厅里的人大气也不敢出，眼睛都盯着那块板。待到最后一票唱完，妙论派的首座以一票之差胜出，众人这才松过一口气，齐齐鼓起掌来。这一票一票数得明白，再没有暗箱操作那一套。新首座当场起身，向满座深深一揖，说既蒙众人推举，日后必当秉公办事，不负这一票一票的重托。众人发声喊，都道：「恁地才好！」那票箱是新打的，缝里塞过纸条，也一一点验过了。"
 SUM_Neo.115.a:"以律法为绳"
 SUM_Neo.115.b:"以人情为度"
 SUM_Neo.116.t:"课试诸生"
 SUM_Neo.116.d:"新首座一上台，头一件事便是改规矩。原来须弥的学者升迁，向来看出身：名师门下、世家子弟，哪怕本事稀松，也能步步高升；寒门学子纵有真才实学，也常被压着。这一日新规颁下：往后升迁，一概以考成定高下，看的是你做了多少实事，出了多少成果，至于师承门第，一概不作数。此令一出，那些靠祖宗吃饭的少爷们登时傻了眼，一个个像霜打的茄子。倒是有几个寒门出身的年轻学者，把袖子一撸，暗暗攒足了劲，只等考成当日一显身手。这一改，须弥的学问场上，从此凭本事说话。考成之期一到，考场设在教令院前，人人当场答题、当众评卷，那几个真有本事的寒门学子，果然一鸣惊人，拔了头筹。落第的把卷子往怀里一揣，梗着脖子道：「明年再考！」说罢转身便走。"
 SUM_Neo.116.a:"推进议会的议程"
 SUM_Neo.116.b:"把权柄交还民间"
 SUM_Neo.117.t:"学报自梓"
 SUM_Neo.117.d:"考成的新规刚立，学报的事又摆上桌面。原来须弥的学报一向由教令院把持，凡要刊印的文章，先得送上去审，不合上头胃口的，一概砍掉，连个理由都不给。这一日众人议定：往后学报自由刊行，谁有见解，皆可付印，便是错了的东西，也可以印出来，让大家伙儿共同评议。此言一出，有老成持重的人摇头，说错了也印，岂不误人？一位年轻学者却反驳道，学问本就是越辩越明，怕只怕没人敢说错话，那才是学问的末路。众人听了，都道这话在理。从此，须弥的报章上，什么声音都有，热闹得很。不上半年，市井之间便有了专说国政的小报，贩夫走卒也买来读，边读边议论，须弥城里的空气，从此都带了几分新意。报馆门前，每日五更便有人排队，那伙计一边收钱一边喊：「还有十份！」话音未落，早被抢去大半。"
 SUM_Neo.117.a:"按学派议决行事"
 SUM_Neo.117.b:"听从乡野的呼声"
 SUM_Neo.118.t:"赏其绝技"
 SUM_Neo.118.d:"学报自由之后，还有一桩实惠事：须弥定下规矩，凡有发明创造之人，皆可领取专利，学问从此能换得实利。原来那些年，学者们绞尽脑汁造出精巧的器物，转眼便被人仿去，自己一文钱也落不着，到头来还是穷书生一个。如今有了专利，谁造的东西，便归谁专有，旁人要用，得付银子。此令一下，教令院里那些捣鼓机关的能工巧匠，一个个眉开眼笑，夜以继日地鼓捣起来。妙论派的首座更是把算盘拨得噼啪响，盘算着造个什么新玩意儿好。这一改，学问不再是清谈，倒成了养家糊口的本事。不多时日，市上便见了新造的器物，机关精巧，皆出自须弥工匠之手，拿了专利的人家，日子渐渐滋润起来，把学问做成了养家买卖。"
 SUM_Neo.118.a:"以律法为绳"
 SUM_Neo.118.b:"以人情为度"
 SUM_Neo.119.t:"学派合治"
 SUM_Neo.119.d:"专利之利刚行，六大学派之间那点子旧成见，也该了结了。原来须弥的学问，向来有一派独大的毛病，哪一派得了势，便把持教令院，别派都得看脸色。这一日六派首座共坐一堂，当众议定：六大学派地位一律平等，往后须弥的学问，再不由哪一派单独说了算，凡事皆要六派商议而行。这话听着平常，做起来可难。生论派与妙论派素来不对付，知论派又嫌因论派空谈，可今日为了须弥学问的将来，各派都把成见暂且按下。从此，教令院里再无一家独大之说，六派坐在同一张桌子前，你一言我一语，倒也热闹。议事之日，六派首座轮流出任主席，一派提议，五派评议，再无人敢一家独断，把个学问场办得气象一新。那把主席的椅子，六派轮着搬回自家去，摆在堂前，好不体面。"
 SUM_Neo.119.a:"推进议会的议程"
 SUM_Neo.119.b:"把权柄交还民间"
 SUM_Neo.120.t:"诸派会议"
 SUM_Neo.120.d:"六派平等之后，须弥的学问场中便立起一个新的规矩：设一个学派议事会，由六派共同派员组成，凡学问上的大事，都拿到这议事会上议定。这议事会一立，便成了须弥最高的学问机构，比往日的大贤者还说了算。往日里，学问一事全凭大贤者一人拍板，他喜欢哪派，哪派便吃香；如今却要六派坐下来，你商量我商量，按多数人的意思办。议事会每月开议一次，桌上摆着各派呈上的议案，一条一条地议，议一条定一条，书记官在旁一一记下，贴在告示栏里，谁都能看。端的从这一日起，须弥的学问，不再是一家之言，倒是众人拾柴火焰高。那告示栏前，天天围着看议案的人，指指点点，议论纷纷，学问之事，从此再不是关起门来的勾当。"
 SUM_Neo.120.a:"按学派议决行事"
 SUM_Neo.120.b:"听从乡野的呼声"
 SUM_Neo.121.t:"属稿定章"
 SUM_Neo.121.d:"学派议事会立稳之后，须弥又要办一件开天辟地的大事：起草宪章。这宪章乃是国家的根本大法，须弥立国以来，何曾有过这样的东西？向来是贤者说什么便是什么，百姓只有听的份。这一日，议事会推举出几位饱学之士，关起门来起草。头一条写什么，众人争得不可开交，最后落笔定下：须弥不属于任何一位学者。这话看似平常，其实石破天惊，等于把大贤者那一套彻底推翻。为首的学者写下这一条，手都有些发抖，说这一笔下去，须弥便换了人间。这一部宪章，字字千钧，条条都是为百姓争来的。宪章既定，又推举出一位德高望重的老学者执笔润色，逐字逐句地打磨，务求条条明白，人人都能读懂，再不似往日律令那般佶屈聱牙。"
 SUM_Neo.121.a:"以律法为绳"
 SUM_Neo.121.b:"以人情为度"
 SUM_Neo.122.t:"诸生开院"
 SUM_Neo.122.d:"宪章起草既定，学者议会便要开议。这议会与往日的议事厅大不相同：往日那议事厅，坐的全是教令院里的学者，雨林的巡林官、沙漠的头人，连门都摸不着。如今这议会，席位按地方来分，雨林占几席，沙漠占几席，须弥城邦占几席，各处的人都能进去说上话。这一日开议之期，但见各处代表陆续到场，雨林的人穿着短打，沙漠的人裹着头巾，城里的学者长袍峨冠，三路人马坐在一处，倒也相安。书记官唱过名，议长敲响木槌，宣布开会。这一场议会，开的乃是须弥从来未有之局。散会之后，三方代表各回各处，把议定的事说与乡亲听，雨林与沙漠的人头一回觉得，国政里也有自己一份，不再只是被管的一群。有老农听完，把决议往烟纸上一抄，贴在灶头，日日看它一眼。"
 SUM_Neo.122.a:"推进议会的议程"
 SUM_Neo.122.b:"把权柄交还民间"
 SUM_Neo.123.t:"首议可否"
 SUM_Neo.123.d:"议会既开，头一件大事便是表决。须弥立国以来，决定国政从来是大贤者一人说了算，哪里用得着表决？这一日议长把一件议案付表决，说道，如今是新章程，凡事要按多数人的意思办，赞成者举手，反对者不举手，举手多者为准。但见满场的人，有的举手，有的按兵不动，书记官在一旁数得仔细，一笔一笔记下数目。那些习惯了看大人脸色的老臣，一时竟不知手该不该举，左顾右盼，好不尴尬。待数完毕，议长宣布议案通过，满场这才响起掌声。须弥第一次用表决定了国政，开了千古未有之例。这一日的表决，须弥人议论了好些天，都说从前一句话的事，如今偏要举手数人数，可这数出来的，才是众人的意思。会散时众人发声喊，各自归家，路上兀自数着指头算票数。"
 SUM_Neo.123.a:"按学派议决行事"
 SUM_Neo.123.b:"听从乡野的呼声"
 SUM_Neo.124.t:"邸报自梓"
 SUM_Neo.124.d:"议会开了新例，须弥的报章也如雨后春笋一般冒了出来。往日里议论国政是个禁忌，谁敢在报上写两句，保不齐就招来祸事，所以人人匿名，连个真名都不敢留。如今新律许人议论国政，还许人留下姓名。这一日，一份新办的报章头版上，赫然署着作者的真名，堂堂正正，毫无遮掩。那人在文章里直陈时弊，说国库如何亏空，税赋如何不均，字字句句都戳在痛处。一报到手，满城传阅，看的人纷纷叫好，都说这才叫言论自由。街头的报童举着报纸沿街叫卖，声音传遍了须弥城的每条巷子。报馆越办越多，笔杆子们竞相激扬文字，有骂贪官的，有颂新政的，各抒己见，把个须弥城搅得沸沸扬扬，却再没人因言获罪。报馆连夜加印两回，墨犹未干，早被人抢购一空。"
 SUM_Neo.124.a:"以律法为绳"
 SUM_Neo.124.b:"以人情为度"
 SUM_Neo.125.t:"结社联朋"
 SUM_Neo.125.d:"报章一多，人的心思也活泛了。须弥向来只有学派，不论政党，士人们聚在一起，谈的是学问，不是政治。如今国政既许人议论，渐渐便有人结起党来：有的主张缓进，说须弥的旧制不能一下子全推倒；有的主张激进，说不破不立，越快越好。两下里各树一帜，各拉人马，你辩我驳，争得不亦乐乎。这须弥的政治，头一回有了分岔，不再是一条道走到黑。有老人摇头，说派系一起，国家便不得安宁；年轻人却说，有争才有进，怕的是万马齐喑。不同主张的人各奔东西，须弥的政坛从此热闹起来。两党相争，各出主张，一个要稳，一个要快，吵得不可开交，可吵归吵，谁也不敢再提独断专行四个字，这政治，从此活了起来。"
 SUM_Neo.125.a:"推进议会的议程"
 SUM_Neo.125.b:"把权柄交还民间"
 SUM_Neo.126.t:"别置谳所"
 SUM_Neo.126.d:"政党纷立，须弥的律法也跟着改了。这一日颁下新规：法庭独立于教令院，往后审案断狱，再也用不着看贤者的脸色，便是贤者犯了法，也要老老实实到庭受审。这可是破天荒的头一遭。往日的贤者，那是何等尊贵，谁敢审他？他的话便是律法，哪里还用得着受审？如今律条写得明明白白，王子犯法与庶民同罪，贤者自然也不在话下。有受过贤者欺压的人，听说这话，喜得直抹眼泪，说这可盼到出头之日了。法庭的门一朝敞开，告状的人排成了长队。这一改，贤者的威风扫地，律法的面子才立起来。头一个被送上法庭的，便是个作恶多旧官，他起先还仗着老关系叫嚣，及至律条一摆，顿时瘫软在地。旁听的人挤了一屋，连窗台上都坐了孩童，探头张望。"
 SUM_Neo.126.a:"按学派议决行事"
 SUM_Neo.126.b:"听从乡野的呼声"
 SUM_Neo.127.t:"置巡捕署"
 SUM_Neo.127.d:"法庭既立，治安的事也得有个着落。这一日须弥成立治安官署，专管人间诉讼缉捕之事。这官署与巡林队可不同：巡林队只管雨林里的花草树木、死域异变，从不管人的事；人的事，一概归治安官署办理。官署衙门不大，却昼夜有人值守，那盏灯从天黑亮到天明，彻夜不熄。夜里有人路过，常见灯火通明，官差们进进出出，忙个不停。原来新律初行，告状的、报案的、调解纠纷的，把个官署挤得门庭若市。起初有人不惯，说这治安官署的灯太亮，晃得人心里发毛；后来渐渐习惯了，反倒觉得那灯光暖人心窝，知道有人替百姓做主。那灯光夜夜不熄，百姓看在眼里，都说这新衙门，与旧日不同，真个是替人做主的所在。有老人领着孙儿打门前过，指着道：「看，那便是替百姓点灯的所在。」孙儿似懂非懂地点了点头。"
 SUM_Neo.127.a:"以律法为绳"
 SUM_Neo.127.b:"以人情为度"
 SUM_Neo.128.t:"清查户籍"
 SUM_Neo.128.d:"治安官署忙了些日子，须弥又办起一件新事：清点人口。须弥立国以来，从没认真数过自己有多少人，城里多少，雨林多少，沙漠多少，都是一笔糊涂账。这一日官府发下告示，要挨家挨户登记造册，连远在阿如村的百姓、游荡的镀金旅团，也在清查之列。书吏们背着册子，走街串巷，一家一家地问，有的百姓起初不明就里，还以为要加税，纷纷藏躲，后来听说只是登记，才放下心来。也有机灵的，趁机报虚数，想多领些口粮，被书吏一眼识破，笑骂几句，照实记下。忙了几个月，须弥头一回把自己的家底摸了个清楚。册籍造好，呈报议会，须弥四境有多少人口，从此一目了然，征兵征税，都有了凭据。有漏报的，被里正挨门挨户查出，补了册，还数落了一场。"
 SUM_Neo.128.a:"推进议会的议程"
 SUM_Neo.128.b:"把权柄交还民间"
 SUM_Neo.129.t:"审议岁计"
 SUM_Neo.129.d:"人口既清，国库也该盘一盘了。这一日议会定下规矩：国库的每一笔支出，无论大小，都要拿到议会上议过，由多数人同意方能支用。这规矩一立，那些习惯了大手大脚花钱的官儿，登时傻了眼。往日里花银子，贤者一句话就成，谁敢问个所以然？如今可倒好，买笔墨要报账，修城墙要报账，连招待使节的酒钱，也得一笔一笔摆到台面上说清楚。有大手大脚惯了的，叫苦不迭，说这般琐碎，还怎么办事？议长却道，国家的钱，本是百姓的血汗，花得明白，才对得起百姓。端的这一改，国库的花销再不是糊涂账。有想浑水摸鱼的，把一笔开销拆成几笔报账，被议会一眼识破，当面驳回，还罚了银子，再没人敢做手脚。那账房先生被罚了半月工钱，灰头土脸，再不敢弄玄虚。"
 SUM_Neo.129.a:"按学派议决行事"
 SUM_Neo.129.b:"听从乡野的呼声"
 SUM_Neo.130.t:"郡邑自专"
 SUM_Neo.130.d:"国库管严了，地方的事也该有个章程。这一日议会议定：须弥城邦与沙漠各得自治，本地的事务，本地人自己商量着办；教令院不再事事插手，只管一样，就是通行的律法，确保各处规矩不冲突，商旅往来有章可循。这自治二字，沙漠的朋友盼了多少年。往日里沙漠的事，偏要教令院说了算，隔着一片黄沙，指挥的人连水井在哪都不知道，如何能服众？如今各管各的，沙漠的头人们聚在阿如村，自己议自己的事，个个眉开眼笑。这一分，须弥城与沙漠各得其所，再不为谁说了算而争吵。沙漠的头人们还约法三章，凡往来商旅，一律护送到底，若有劫掠，十倍赔偿，把个沙漠治理得路不拾遗，商旅称便。有不长眼的剪径贼，撞在护商队手里，被捆成一串送了官。"
 SUM_Neo.130.a:"以律法为绳"
 SUM_Neo.130.b:"以人情为度"
 SUM_Neo.131.t:"广开义塾"
 SUM_Neo.131.d:"地方自治既行，教化之事也提上日程。这一日议会决议：把公共学堂建到村里去，让贫苦人家的孩子也能读书识字，再不像从前，只有有钱人才请得起先生。这学堂就盖在村口，用的是新刨的木头，课桌板凳还散发着松木的清香，孩子们头一回摸到这样的桌子，稀罕得不行。老远而来的先生，把笔墨纸砚一一摆开，村里的娃娃们睁大了眼睛，跟着一笔一画地描。有的孩子家中穷困，连饭都吃不饱，如今却能在学堂里识字，爹娘见了，喜得合不拢嘴。这一办，须弥的乡下，从此也有了读书声。先生的教鞭一指，娃娃们便跟着念，朗朗书声从村口飘出，惊飞了树上的雀鸟，把个偏僻乡村添了几分文气，再不是只知种地的所在。"
 SUM_Neo.131.a:"推进议会的议程"
 SUM_Neo.131.b:"把权柄交还民间"
 SUM_Neo.132.t:"布新宪章"
 SUM_Neo.132.d:"公共学堂刚办起来，须弥的头等大事便到了：宪法正式颁布。这一日，须弥城万人空巷，人们聚集在广场上，听书记官高声宣读宪法条文，一条一条，清清楚楚。这宪法乃是新须弥的根本，条条规定着百姓的权利，也规定着政府的规矩。读到最后一条，众人忽然安静下来，但见那一条上写着草神的名字，作为这部宪法的见证。原来众人感念小吉祥草王这些年的恩德，特意把她的名字写在最后，让她做个见证。话音刚落，广场上欢声雷动，掌声经久不息。这一部宪法，写满了须弥百姓的心愿。宪法刻石立碑，竖在议事厅前，百姓经过，都要驻足看上几眼，那最后一行草神的名字，人人念得出来，都说这是须弥的定海神针。碑前地上香灰积得厚了，扫地的杂役一日两回，犹自扫不及。"
 SUM_Neo.132.a:"按学派议决行事"
 SUM_Neo.132.b:"听从乡野的呼声"
 SUM_Neo.133.t:"诸生之国"
 SUM_Neo.133.d:"宪法颁布之后，须弥便正式成了共和国。这共和国与往日大不相同：往日的权柄，攥在贤者一人手里，如今却来自四方，来自教令院的学者，来自集市上的商人，来自雨林里的猎人，也来自沙漠中守着绿洲的人。这一日新政府成立，四方代表齐聚一堂，共同执掌国政。有那老臣私下嘀咕，说这成何体统，读书人竟要与猎人、商贾同殿称臣。可年轻人听了却拍手称快，说这才叫真正的须弥，人人有份，人人有责。这一变，须弥国体一新，再不是哪一家哪一姓的私产。四方代表议定，国政大事，须经议会商议，再交众人评议，谁也不能独断。那些昔日高高在上的老爷，如今也得坐在板凳上听人说话，把个权力分到了各人手里，再无处藏私。"
 SUM_Neo.133.a:"以律法为绳"
 SUM_Neo.133.b:"以人情为度"
 SUM_Neo.134.t:"勾稽旧籍"
 SUM_Neo.134.d:"共和国初立，万事待兴，头一桩便是重新盘账。这一日，新任的财政官带着书吏，把国库的老账本一摞摞搬出来，从头查起。这一查不要紧，查出来的亏空，比众人预想的还大得多。原来那些年大贤者阿扎尔掌权，挪用的银钱一桩接一桩，有的拿去修了净善宫的高墙，有的花在无人过问的工程上，还有的干脆不知所踪，账上一笔带过，连个去向都没写。财政官一笔一笔核下来，越核越是心惊，最后把账本往案上一摔，说这些钱，够须弥百姓吃上好几年。这一笔笔旧账，把那大贤者的老底掀了个干净。财政官把那笔笔烂账抄成清册，呈报议会，众人看了，无不震怒，纷纷追问钱去了哪里，要那大贤者给出个说法。议会上有人一拍案几，喝道：「钱到哪里去了，须说个明白！」满座轰然应和。"
 SUM_Neo.134.a:"推进议会的议程"
 SUM_Neo.134.b:"把权柄交还民间"
 SUM_Neo.135.t:"厘定税章"
 SUM_Neo.135.d:"国库的亏空查清了，赋税也得跟着改。这一日议会议定新税法：往后收税，按田亩与人头计算，田多的多交，人多的多交，一律平等。这新法最要紧的一条，是废了往日沙漠加倍纳税的旧例。原来那些年，沙漠的百姓本就苦，水少地薄，偏还要交双倍的税，逼得不少人铤而走险，当了镀金旅团。如今新法一下，沙漠与城邦一视同仁，再无加倍之说。阿如村的老人们听说，半信半疑，直到看见官府张贴的告示，才敢相信这是真的，一个个喜极而泣。这一改，沙漠百姓肩上的担子，总算轻了几分。新税法还明定，荒年可酌情减免，沙漠之地，尤要体恤，端的这几条下来，百姓们无不称颂，都说新法新就新在公道二字上头。沙漠的老牧民听了，把手放在胸口，道：「公道二字，值千金。」说罢把新粮册看了一遍又一遍。"
 SUM_Neo.135.a:"按学派议决行事"
 SUM_Neo.135.b:"听从乡野的呼声"
 SUM_Neo.136.t:"钱冶归公"
 SUM_Neo.136.d:"税法改罢，钱法也得肃清。这一日议事厅下令：铸币之权，收归议事厅，地方不得私铸；市面上的私钱，一律官府兑回，另换官铸的新钱。须弥往日币制混乱，私钱泛滥，有的成色不足，有的薄得没分量。驼队自沙海归城，一囊枣椰换来的尽是劣钱，商贾吃惯了哑巴亏，又不识成色。如今新令既下，兑铺先开在奥摩斯港的巴扎里，再沿商道一路铺到阿如村，柜上摆一杆小秤，称那钱的轻重，秤星子磨得发亮，看着便教人放心。百姓揣着旧钱来，照价换了沉甸甸的新钱，掂一掂，看一看边上的纹，个个喜笑颜开。有私铸钱的作坊，被查抄了炉子，掌柜的枷号三日示众。这一番整顿，须弥的钱法自此清爽，驼铃响过沙道，买卖也公道了。"
 SUM_Neo.136.a:"以律法为绳"
 SUM_Neo.136.b:"以人情为度"
 SUM_Neo.137.t:"给商队符"
 SUM_Neo.137.d:"钱法既清，商路也该畅通。这一日议会颁下通行特许：凡领得特许的商队，可在雨林与沙漠之间自由往来，沿途关卡不得刁难。这雨林与沙漠，向来货不通流：雨林的香料、药材运不到沙漠，沙漠的盐巴、织物也进不了雨林，两边百姓守着好东西，却只能眼馋。如今有了通行特许，商队们立刻活跃起来，驼铃叮当，一队接一队地穿梭在绿洲与林间。有的商队头一回把雨林的可可豆运到阿如村，村民们尝了新鲜，赞不绝口；有的把沙漠的织毯带进禅那园，学者们也爱不释手。这一通，两地的货物从此流了起来。不多时，雨林的可可豆、沙漠的椰枣，在两地的集市上都见了踪影，百姓尝了新鲜，都说这通行特许，办到了好处。"
 SUM_Neo.137.a:"推进议会的议程"
 SUM_Neo.137.b:"把权柄交还民间"
 SUM_Neo.138.t:"奥摩斯港启市"
 SUM_Neo.138.d:"商路刚通，海路也要打开。这一日须弥宣布：奥摩斯港对七国开港，欢迎各国的商船前来贸易。这可是须弥头一回向外商敞开大门。往日的奥摩斯港，虽是个好去处，却半遮半掩，外人进来诸多不便。如今港口大兴土木，新铺的石板还湿漉漉的，栈桥修缮一新，码头工人忙着搬运货物，吆喝声此起彼伏。不多时，七国的商船便闻风而至，桅杆林立，把个港口挤得水泄不通。那些远道而来的外商，第一次踏上须弥的土地，东张西望，满眼新奇。这一开港，须弥从此与七国通有无，生意做进了四海。港务官忙着丈量泊位，订立章程，又盖起货栈，堆满待运的香料与咖啡，这座古港，一夜之间成了须弥通向外头的门户。码头上脚夫呐喊装卸，号子一声接一声，直闹到月上桅杆。"
 SUM_Neo.138.a:"按学派议决行事"
 SUM_Neo.138.b:"听从乡野的呼声"
 SUM_Neo.139.t:"七邦互市"
 SUM_Neo.139.d:"奥摩斯港一开，邻国纷纷遣使前来。这一日，须弥与几个邻国签下通商条款，约定互市免税，往来便利。这条款一签，最得利的便是须弥的香料与咖啡。原来这两样东西，须弥有的是好货，只是从前销路不畅，堆在仓里发霉。如今条款一立，香料与咖啡便换了出路，一船一船地运往邻国，换回银钱与别的货物。商人们乐得合不拢嘴，纷纷扩大种植，连原本荒着的地方也种上了咖啡。有精明的，还把咖啡豆烘焙炒制，研成细粉，装罐远销，赚得盆满钵满。这一签，须弥的特产走出了国门。条款既定，两国货币汇率也一一订明，商人们再不必为兑换扯皮，货物报关一路绿灯，这通商之事，从此顺顺当当，再无往日那般磕绊。"
 SUM_Neo.139.a:"以律法为绳"
 SUM_Neo.139.b:"以人情为度"
 SUM_Neo.140.t:"钱柜新设"
 SUM_Neo.140.d:"通商条款刚签，须弥又添一桩新鲜事：银行开业了。这银行专管存放银钱、放款借贷，须弥百姓头一回见这样的衙门。最得利的，要数那些做研究的学者。原来学者们空有一肚子学问，却苦于没钱，想买仪器、想买纸张、想远行考察，都得自己掏腰包，常常捉襟见肘。如今有了银行，学者可以拿研究成果作抵押，借贷银钱去做研究，等有了成果，再慢慢归还。此例一开，教令院里那些穷书生，一个个精神大振，借钱置办起仪器来，夜以继日地钻研。这一办，学问再不因缺钱而中断。银行门前，借贷的人排成队伍，有做研究的学者，也有开作坊的匠人，柜台后的账房拨着算盘，一笔笔登记在册，这银钱活了起来。存钱的、借钱的，把柜台围得水泄不通，伙计喊破了嗓子。"
 SUM_Neo.140.a:"推进议会的议程"
 SUM_Neo.140.b:"把权柄交还民间"
 SUM_Neo.141.t:"百商合券"
 SUM_Neo.141.d:"钱庄既立，商贾们也抱起团来。这一日，须弥各家商会联合起来，立了一个总商会，专管对外贩运之事，替须弥把货运到七国去。往日商户各自为战，一队驼铃孤零零走过沙道，遇上劫道的，连个报信的人也没有，吃了亏无处申诉。如今商会合了股，置办驼队船队，雇护卫护送，一出行便是几十头驮兽连成一串，铃声响出去半里地，盗匪远远听见便绕开了。总商会还立下规矩：统一货号，统一价钱，不许互相压价，更不许以次充好；香料、枣椰、绸缎各归各栈，栈口立牌，牌上写明斤两。有想耍小聪明的，掺了次货，被商会查出来，罚了银子，还逐出行会。这一联合，须弥的货走得又远又稳，名声随着驼铃与船帆传到各国。"
 SUM_Neo.141.a:"按学派议决行事"
 SUM_Neo.141.b:"听从乡野的呼声"
 SUM_Neo.142.t:"香圃连畦"
 SUM_Neo.142.d:"商会联合之后，货源成了要紧事。这一日须弥决议：广开香料种植园，连沙漠的边缘也要种上东西。沙漠边缘向来荒芜，除了耐旱的骆驼刺，什么也不长，谁都觉得那是没救的废地。如今引来水源，改良土壤，竟在沙地上种出了香料作物。起初没人相信，说沙漠里能长出什么？待到第一茬香料收获，那浓郁的香气随风飘出老远，怀疑的人才闭了嘴。种植园一处接一处地铺开，沙漠边缘渐渐绿了起来，连飞鸟也多了。那些原本靠游牧为生的沙漠人，也进园子里做工，挣一份安稳钱。这一铺，荒沙之上竟长出了香料。园子里的工人，多是附近的沙漠百姓，早出晚归，按月领饷，日子有了奔头，端的这片昔日的不毛之地，竟养活了一方人口。"
 SUM_Neo.142.a:"以律法为绳"
 SUM_Neo.142.b:"以人情为度"
 SUM_Neo.143.t:"苦饮调饴"
 SUM_Neo.143.d:"香料种得红火，咖啡与糖也跟着出了名。须弥本就产咖啡，如今销路一开，咖啡园子一处接一处，咖啡豆炒得香飘十里。那糖更不必说，甜得纯正，做成糕点，入口即化。这一日，须弥把咖啡与糖当作新的名片，荐给七国的客商。但见宴席之上，主人端出一杯浓咖啡，又捧上一碟糖糕，客人们尝了，无不竖起大拇指，说这味道，别处再寻不着。有精明的客商，当即便下了大单，要把须弥的咖啡与糖运回本国贩卖。这两样东西，从此成了须弥的招牌，提起须弥，人们便想到咖啡的香、糖的甜。客商们还把咖啡的种法、糖的熬法一并学了去，运回本国，须弥的名声便随着这香甜的滋味传遍七国市井，这两样小物，倒成了大招牌。"
 SUM_Neo.143.a:"推进议会的议程"
 SUM_Neo.143.b:"把权柄交还民间"
 SUM_Neo.144.t:"缫丝成帛"
 SUM_Neo.144.d:"咖啡与糖出了名，须弥的手工业也不甘落后。这一日，缫丝与织造之术在须弥落地生根，一处处的工坊排到城郊，连绵不绝。这缫丝织造原是精细活计，须弥从前只会种桑养蚕，好端蚕茧，只能贱卖给外邦商队。如今学会了手艺，自己缫丝，自己织造，蚕茧在当地就成了光洁的绸缎。但见工坊里织机一排排摆开，咔嚓咔嚓从早响到晚，梭子来往如穿梭，一匹匹绸往下淌。须弥的织工又别出心裁，把帕蒂沙兰的花样织进缎面，紫红一朵，浮在光里，走一走动一动，花也像活的。那绸拿在手里滑如凝脂，比进口的还真不差。织出的绸一半运往七国换钱，一半留在本城做衣裳，须弥人穿上自家的料子，这才明白：手艺便是财源。"
 SUM_Neo.144.a:"按学派议决行事"
 SUM_Neo.144.b:"听从乡野的呼声"
 SUM_Neo.145.t:"沙海驰轨"
 SUM_Neo.145.d:"织造业兴旺，交通也要跟上。这一日，须弥决意修一条铁路，直修进沙漠深处。这铁路是新鲜玩意儿，铁轨一寸寸铺进黄沙，火车冒着黑烟，轰隆隆地开进沙漠，把个古老的沙漠惊得目瞪口呆。沙漠里的人哪见过这等怪物，起初远远躲着看，后来才敢靠近。这铁路一修，最微妙的是商队与镀金旅团的关系。往日里商队走沙漠，常要雇镀金旅团护送，那是花钱买平安；如今有了铁路，货物坐火车走得更稳更快，护送的买卖便清淡了。镀金旅团的人心里不是滋味，常常在铁路边转悠，眼神复杂。这一修，沙漠的旧规矩，悄悄起了变化。铁路沿线，还添了几处车站，附近百姓挑了土产来卖，倒也热闹，这铁轨铺到哪里，哪里便活了起来。"
 SUM_Neo.145.a:"以律法为绳"
 SUM_Neo.145.b:"以人情为度"
 SUM_Neo.146.t:"殷阜为国"
 SUM_Neo.146.d:"铁路修进沙漠，粮食的运输也便利了。这一日，须弥各处传来喜讯：谷仓满了。须弥从前常闹饥荒，沙漠尤甚，一遇旱年，颗粒无收，百姓饿得啃树皮，那记忆刻骨铭心。如今不一样了，水利修得好，田亩开得多，加上铁路畅通，粮食能从丰年之地运到歉收之处，再不似从前，一处闹饥，处处干瞪眼。但见那一座座谷仓，囤得满满当当，谷粒堆得冒了尖，看守的仓吏笑得合不拢嘴。村里老人蹲在谷仓门口，抓一把新米在手里搓着，眼眶却红了，说这辈子头一回见这么多粮。这饥馑的记忆，第一次淡了下去。官府还立了常平仓，丰年收粮，歉年放粮，调剂有余不足，这饥荒二字，须弥人总算能稍稍将它忘却了。仓墙上记粮的白垩字，一年一换，从没断过。"
 SUM_Neo.146.a:"推进议会的议程"
 SUM_Neo.146.b:"把权柄交还民间"
 SUM_Neo.147.t:"虚空普施"
 SUM_Neo.147.d:"粮食充足，民生安定，须弥又要把一样东西还给百姓：虚空。这虚空终端向来由教令院独占，寻常百姓想接入，比登天还难，知识的大门紧紧关着。这一日议会下令：虚空终端不再由教令院独霸，各城邦皆可接入，人人都能享用虚空中的知识。令下之后，各城邦忙着架设接收的设施，工匠们日夜施工，把一根根线路铺到城里乡间。待到开通当日，百姓们头一回戴上终端，只觉眼前豁然开朗，无穷的知识扑面而来，一个个惊奇得说不出话。有老农戴上终端，查到了种地的学问，连连称奇。这虚空一开，知识再不是少数人的私产。城乡之间，一时间架设了无数终端，学校里、茶馆中，处处都可接入，这知识的门，从此向人人敞开。"
 SUM_Neo.147.a:"按学派议决行事"
 SUM_Neo.147.b:"听从乡野的呼声"
 SUM_Neo.148.t:"智归兆民"
 SUM_Neo.148.d:"虚空向百姓开放，须弥再进一步，宣布知识为公有。这一下可是掀了教令院的老底。原来须弥的学问，向来论资排辈：你进了教令院，熬够年头，才能读到某些书，学到某些知识，资历不够，便是不给你看。如今新令一出，知识公有，学识不再按资历发放，谁想学，谁就能学，书摆在架上，人人都可翻阅。那些熬了半辈子资历的老学者，起初老大不乐意，说这成何体统，学问岂可人人得而学之？可年轻人却欢呼雀跃，一头扎进书堆里，如饥似渴。这一宣布，须弥的学问场上，从此再没有藏着掖着的事。各处的藏书楼也应运而生，书抄了一份又一份，辗转相传，端的这须弥的学问，再不是少数人的专利，倒成了满城人的事。有抄书人嫌纸贵，索性写在芭蕉叶上，倒别有一番意趣。"
 SUM_Neo.148.a:"以律法为绳"
 SUM_Neo.148.b:"以人情为度"
 SUM_Neo.149.t:"楼贮群书"
 SUM_Neo.149.d:"知识公有既定，教令院那些锁了多年的密室，也该打开了。这一日，教令院当众开启密室大门，那尘封已久的万卷书库，第一次向所有人敞开。这书库里头，藏着多少珍稀典籍，有的孤本天下无双，有的手稿笔迹斑驳，从前只有少数高层才能一窥，寻常学子连门都进不得。如今大门一开，人们鱼贯而入，但见书架高耸，书卷浩繁，看得人眼花缭乱。有年轻学者捧着一册渴求已久的孤本，手都在发抖，蹲在角落里一页页地读，生怕看漏了一个字。图书管理员忙前忙后，登记造册，叮嘱众人爱惜。这密室一开，多少秘籍重见天日。书库门外，还立下借书的规矩，登记造册，按期归还，损坏赔偿，这些秘籍从此流转世间，再无人能独占。"
 SUM_Neo.149.a:"推进议会的议程"
 SUM_Neo.149.b:"把权柄交还民间"
 SUM_Neo.150.t:"梓行活字"
 SUM_Neo.150.d:"万卷书库开放，读书的人多了，书却不够用。这一日，活字印刷之术在须弥铺开，一时间，印坊林立，书籍大量印行。这活字印刷神奇，字模可以拆了重排，一本书印完，字模拆下来还能印下一本，比起从前一字一句地抄写，快了何止十倍。书一多，价钱便落了下来，从前一部书贵得吓人，穷书生攒一年也买不起，如今降到学徒也买得起。但见市集上，书摊一个挨一个，顾客络绎不绝，有学徒模样的年轻人，攥着几个摩拉，挑了一册心仪已久的书，喜滋滋地走了。这一铺开，须弥的书香，飘进了千家万户。印坊的伙计们日夜排字，墨香弥漫了半条街，学生们捧着新书，如获至宝，这一门手艺，把须弥的读书声送进了千家万户。"
 SUM_Neo.150.a:"按学派议决行事"
 SUM_Neo.150.b:"听从乡野的呼声"
 SUM_Neo.151.t:"设塾授民"
 SUM_Neo.151.d:"沙漠深处有个村落，祖祖辈辈只认得沙丘和驼铃，从没见过学堂。这一日村口那间废了多年的土屋忽然收拾出来，墙上抹了新泥，门口挂上一块木牌，上面歪歪扭扭写着学堂二字。村里人围过来看热闹，谁也不信这土屋能教出什么名堂。从须弥城来了个年轻学者，卷着几卷书，站在土屋前拍了拍身上的沙尘，对众人说道，从今日起，凡是愿意来听的，不论牧童还是匠人，都能进这屋里坐下。有老人摇头，说咱们祖上连字都不识，学那做甚。学者也不争辩，只把一块石板立在门外，用炭笔写下一个字，问有谁认得。众人面面相觑。半晌，一个放羊的孩子怯生生走上前，念出了那个字。这学堂教的不是做官的本事，是识字算数的日用。"
 SUM_Neo.151.a:"以律法为绳"
 SUM_Neo.151.b:"以人情为度"
 SUM_Neo.152.t:"虚席待媛"
 SUM_Neo.152.d:"教令院议事厅向来是男人的天下，六派首座端坐两旁，女子连门边都站不得，只能在外厅候着传话。这一年规矩忽然松了。有位女学者治学严谨，曾在死域边缘查访多日，几番遇险，带回厚厚一摞笔记。众人本以为她至多立在厅外听候差遣，谁知大贤者当众叫出她的名字，抬手指给她一张席位。老派几位首座脸色顿时不好看，有人把茶盏往案上一顿，冷笑说祖上从无此例，成何体统。女学者不慌不忙，展开笔记，把一路所见逐条说来，哪处水源枯了，哪处沙丘移了，哪处死域又往外扩了，件件有据，条理分明。那些首座听着听着，面色渐渐缓了，竟无人再提祖例二字。散会时，有人悄悄把席位往里挪了半尺。规矩原是人立的，也能被人改。"
 SUM_Neo.152.a:"推进议会的议程"
 SUM_Neo.152.b:"把权柄交还民间"
 SUM_Neo.153.t:"沙中设讲"
 SUM_Neo.153.d:"须弥的学者从前只在净善宫和高塔里读书，脚不沾沙，出门有车马，连风沙都没怎么见过。如今不同了，一队学者背着书箱，跟着驼队深入沙漠，就在棕榈树下支起案子讲学。来听的人可就杂了，有挎着弯刀的佣兵，有背着弓箭的猎人，还有满手老茧的采盐人，三教九流，什么都有。众人起初不好意思坐近，远远蹲着，拿怀疑的眼打量这些读书人。学者招手道，过来，知识不挑人，站得远反倒听不真。一个佣兵大着胆子坐下，问书上有没有讲怎么认星星辨方向。学者便指着天上一颗星，教他分辨南北，又教他看沙丘的走向。猎人听着听着，也凑过来问起了雨水的常识。学问这东西，拿去换摩拉未必值钱，拿到沙海里却能救人性命。"
 SUM_Neo.153.a:"按学派议决行事"
 SUM_Neo.153.b:"听从乡野的呼声"
 SUM_Neo.154.t:"研求无禁"
 SUM_Neo.154.d:"从前在须弥做研究，事事都要呈报教令院，一张批条盖了印才能动土开挖，往往等批条下来，沙丘都挪了位置，遗迹也被风埋了半截。有位学者为了等一纸文书，在客栈里白住了三个月，盘缠都快花光，急得嘴角起泡。这一天新令下来，凡考据、测量、掘井诸般研究，一概不必再领批条，学者自行做主便是。那学者拿着令，先是不信，反复看了三遍，又问传令的人可是当真。传令的点头，他这才把积攒多年的旧批条揉成一团，狠狠扔进风里。这一纸令看着轻，压在学者头上却重如山。自此谁想探一处遗迹，背起工具便走，再不用看人脸色。那团揉皱的旧批条，被风卷着打了几个旋，落在骆驼粪堆里，再无人去捡。从此沙丘挪到哪，学者的绳尺便跟到哪。"
 SUM_Neo.154.a:"以律法为绳"
 SUM_Neo.154.b:"以人情为度"
 SUM_Neo.155.t:"考稽故墟"
 SUM_Neo.155.d:"赤王时代留下的旧墙，从前只当是些没用的断砖，风吹雨打也没人理，牧人还拿它挡过羊圈。自打考据成了显学，情形就变了。一队学者扛着绳尺来到遗址，把那残墙一段一段量过去，长几尺，高几丈，砖缝里嵌着什么，都细细记下。有人拿刷子扫去墙面的沙，露出几行古文字，众人争着辨认，谁也不肯落后，吵得面红耳赤。村里的孩子也跑来看，问这些破墙有什么用，能换几块糖么。一位老学者蹲下身，摸着冰凉的砖说，这墙里头藏着咱们的根，根在，人便不散。众人听了，似懂非懂。从前弃如敝屣的东西，如今成了宝贝。那孩子听不太懂，回家却把画着古字的墙皮描在了沙地上，描了满满一捧。村里后来索性把那段残墙圈起来，砌了矮栏，逢年祭拜。"
 SUM_Neo.155.a:"推进议会的议程"
 SUM_Neo.155.b:"把权柄交还民间"
 SUM_Neo.156.t:"文教四达"
 SUM_Neo.156.d:"须弥文字从前只在高塔里传，百姓见了那弯弯曲曲的符号，只当是天书，谁也不敢碰。如今官府在每一个村口都立起一块木牌，把村名、井位、水源都写在上面，还派了识字的书吏教人认。起初没人敢近前，怕玷污了那上头的字。后来有个胆大的后生指着木牌念出了村名，众人这才知道，原来这字与自家的日子有干系，认得了便能少受欺负。渐渐的，赶集的、挑水的都要到牌前看一眼，认字的人越来越多。有老人感慨，说咱们这村子祖祖辈辈没个名头，如今总算有了自己的名字。文字到了村口，才算是活了。有个不识字的老婆婆，央人把自己的名姓也写在牌侧，说死也死个有名字的。赶集认不了字，出了村便是睁眼瞎，如今这话没人再说了。"
 SUM_Neo.156.a:"按学派议决行事"
 SUM_Neo.156.b:"听从乡野的呼声"
 SUM_Neo.157.t:"真理无疆"
 SUM_Neo.157.d:"从前须弥有禁书令，哪些书能读、哪些书要烧，都有明文规定。书房里若藏着禁书，一旦被查出便是大罪，连累街坊邻里。有个爱书的人，把一本禁书用油布裹了三层，埋在院中的枣椰树下，夜深人静才敢挖出来翻上几页，看完又战战兢兢埋回去。这一天禁书令废了，教令院的门槛险些被人踏破。那人听说消息，跑到树下把书挖出来，抖掉泥土，摊在日头底下晒，书页都发了霉。他一面晒一面笑，眼泪却扑簌簌落下来。一本书能见天日，也是一桩天大的事。他把书捧回家，翻开来，一页一页读到半夜，烛花爆了三回。那棵枣椰树，他后来再不许旁人动一枝一叶；邻家孩子来讨书看，他拣了无碍的几卷借出去，只许看三日，逾期便亲自上门去讨。"
 SUM_Neo.157.a:"以律法为绳"
 SUM_Neo.157.b:"以人情为度"
 SUM_Neo.158.t:"智为天下"
 SUM_Neo.158.d:"须弥城中有一座藏书的高塔，从前塔门紧闭，守得铁桶也似，只有教令院的人能进出，百姓路过只能仰头看看，连门槛都摸不得。这一日塔门大开，当众宣布，知识不属于少数人，而属于所有人。看热闹的人起初不敢进，怕冒犯了什么，站在门口探头探脑。有个老仆壮着胆子走进去，摸了摸那一排排书架，又翻了翻书页，问能不能借一本回去给孙子看。管事的点头应允，说但拿无妨。老仆抱着书，乐得合不拢嘴，一路走一路笑。知识本是天下公器，锁在高塔里久了，倒像是谁家私产，如今物归原主。第二日一早，塔门口便排开一条长队，有挎篮的，有抱娃的，一直排到街角。有识字的老塾师，索性搬条凳子坐在塔门口，替人念书收几个铜子。"
 SUM_Neo.158.a:"推进议会的议程"
 SUM_Neo.158.b:"把权柄交还民间"
 SUM_Neo.159.t:"牖民以智"
 SUM_Neo.159.d:"须弥的学士从前深居简出，出了高塔便不认得市集的路，连椰枣和香料都分不清。如今不同了，他们三三两两走进市集与绿洲，跑到香料摊前问价钱，蹲在水渠边看水流，跟卖椰枣的老妇聊起天来。有个年轻学士头一回进市集，只顾抬头看那高高的楼阁，被一头骆驼撞了一下，跌坐在地，惹得众人哄笑。他也跟着笑，爬起来拍拍土，接着看那驼队如何卸货，看得十分仔细。旁边卖水的老汉递过一碗水，他道了谢，一饮而尽。读书人肯低头看市井，这学问才算落到了地上，不再悬在半空。自当日后，市集上常见学士的袍角，卖椰枣的摊子也添了记账的笔画。骆驼认得他们了，见了袍角也不吐口水，只慢悠悠嚼着草料。有个学士买了两斤椰枣，付账时掏出的却是块墨锭，惹得摊主大笑。"
 SUM_Neo.159.a:"按学派议决行事"
 SUM_Neo.159.b:"听从乡野的呼声"
 SUM_Neo.160.t:"沙中成聚"
 SUM_Neo.160.d:"须弥的图册从前只画城池要道，沙漠里的大小村落一概不载，仿佛那些地方不算须弥的地界，只是些无关紧要的沙包。这一年官府派人重新测绘，要把每一处村落都写进图册。画师跟着驼队来到一个偏远村子，支起画板，把村子的房屋、水井、棕榈树一一描下，连村口那条歪歪扭扭的小路也没落下。村里人围过来看，七嘴八舌，问画上去有甚用处，又不能多打粮食。画师说，画上去，天下人便知道有这么个村子，再不算化外之地。有个老人听了，竟有些激动，摸着画板上自家的屋子看了半晌，嘴里念念有词。被写进图册，便是被承认为自己人。图册发到各村当日，村长把图册供在堂屋最高处，来客必先看图。有村子请画师题了村名，逢人便夸，说这名字如今写在官家册上。"
 SUM_Neo.160.a:"以律法为绳"
 SUM_Neo.160.b:"以人情为度"
 SUM_Neo.161.t:"诸部入籍"
 SUM_Neo.161.d:"沙漠各部族自古有自己的律法，血液与血脉的规矩代代相传，哪支归哪支管，清清楚楚，却一直不被须弥承认，仿佛上不得台面。这一年官府立起部族名册，把各部的名号、头人、地界一一登记在案，明明白白承认血脉的律法有效。有位部族长老按了手印，看着名册上自家的名字，沉默良久，手指在那名字上摩挲了半天。有人问他是不是高兴，他缓缓摇头，说这不是高兴不高兴的事，是咱们的名头头一回上了官家的册子，往后子孙也有凭有据，再没人敢说是野人。名册这东西看着是一张纸，实则是一份承认。名册用蓝布包了，藏在部族最要紧的帐里，与神器放在一处。按手印时，长老把拇指在印泥里蘸了三蘸，按得端端正正。那帐里还点着一盏长明灯，说是名册放处，灯不可灭，灭则部族气数短。"
 SUM_Neo.161.a:"推进议会的议程"
 SUM_Neo.161.b:"把权柄交还民间"
 SUM_Neo.162.t:"授沙民籍"
 SUM_Neo.162.d:"从前沙漠民在须弥不算正经百姓，税吏想何时踏进绿洲便何时踏进，进村就翻箱倒柜，搜刮起来全凭高兴，谁也不敢拦。这一年新法颁下，沙漠民一律获得公民权，与城里人一般无二，税吏再不能随意闯进绿洲。有个税吏照旧想到村里收钱，被村民拦在沙丘外，拿出新法条给他看。那税吏竖着看了半天，认不得几个字，又不好发作，脸涨得通红，灰溜溜走了。村里人望着他的背影，头一回挺直了腰杆。公民二字，写起来简单，争起来却不知费了多少口舌。那法条后来抄了许多份，贴在绿洲井台边，风吹日晒，字迹犹存。有个先前帮税吏带路的二溜子，如今反倒站在人前念法条，念得字正腔圆。众人笑他：昨日帮凶，今日先生。那法条后来传到更远的沙海深处，连商队的驼工都能说上两句。"
 SUM_Neo.162.a:"按学派议决行事"
 SUM_Neo.162.b:"听从乡野的呼声"
 SUM_Neo.163.t:"沙海设序"
 SUM_Neo.163.d:"沙海学堂办起来，教的是两样东西，一样是须弥文字，一样是水利，都是村里最缺的。开课当日，来的人挤破了门，有老人带着孙子，有妇人抱着孩子，把土屋围得水泄不通，来晚的只能站在窗外。先生先在黑板上写了个水字，问谁知道水从哪里来。有个孩子说从井里来，有个说从天上掉下来，还有的说从骆驼背上驮来，引得众人哄笑。先生笑了，说都不全对，待我慢慢讲给你们听。他又拿出一根水准尺，教众人怎么看水渠的高低，怎么让水往该去的地方流。那些种地的听着听着，眼睛渐渐亮了。这学堂教的字能记账，教的水能浇田，都是实打实的本事。散学时众人不肯走，围着先生问东问西，问得掌灯才散。有白日误课的，夜里提着灯笼来补课，先生只好再讲一遍。"
 SUM_Neo.163.a:"以律法为绳"
 SUM_Neo.163.b:"以人情为度"
 SUM_Neo.164.t:"绿洲浚渠"
 SUM_Neo.164.d:"绿洲的水渠年久失修，淤塞得只剩下细流，田亩一年比一年少，眼看就要荒废。这一年官府组织人手，把水渠重新疏浚一遍。众人扛着铁锹下到渠底，一锹一锹把淤泥挖出来，肩膀磨破了皮也不肯歇，汗珠子摔在泥里。水一通，清亮的渠水哗哗流进田里，枯了多年的田又活了过来。田亩一路扩到村外，从前是沙地的地方，如今种上了庄稼。有个老农蹲在田埂上，看着水流，半天说不出话，末了抹了把眼睛，说这水声听着比唱曲还受用。水便是沙漠的命根子。渠上分水的木闸也换了新的，闸口刻着各村的名，轮到谁家放水，看牌便知。有偷开闸的，被巡渠的老汉追出二里地，一把揪住衣领，押到村里评理。自此放水的日子井然有序，再没人红过脸。"
 SUM_Neo.164.a:"推进议会的议程"
 SUM_Neo.164.b:"把权柄交还民间"
 SUM_Neo.165.t:"垦此荒洲"
 SUM_Neo.165.d:"官府推出绿洲垦殖计划，把荒沙分给无地的沙漠民，让他们自己开荒种地，永为自己产业。消息传来，有人不信，说沙子里怎么能种出东西，怕是官家画饼哄人。可当真有人领了一块地，扛着锄头就下了沙丘。头一年引水、固沙、施肥，忙得脚不沾地，手上磨出了血泡，日头晒脱了皮，到了秋天，竟真的收了一季粮食。那人在自己地头立了根木桩，上面刻下自己的名字，左看右看，越看越喜欢。有了自己的地，人心便定了，再不愿四处漂泊。邻村见着眼热，也一窝蜂来领地，官府的木牌都刻不及。有开荒开得凶的，手上血泡破了又起，村里人都唤他做铁手掌。问他苦不苦，他咧嘴一笑：「苦甚么，这是自家的地！」说完又挥锄挖将起来。"
 SUM_Neo.165.a:"按学派议决行事"
 SUM_Neo.165.b:"听从乡野的呼声"
 SUM_Neo.166.t:"商道共辖"
 SUM_Neo.166.d:"须弥与各部族之间的商道，从前过路费全由一方说了算，你加一成，我加两成，各方争执不下，常常闹得商队不敢上路，货物烂在半道。这一年议定共管之策，须弥与部族各派人手，一同设卡，一同定价，过路费再不由哪一方独断。有商队头回经过，见关卡上站着两拨人，一个须弥人，一个部族人，正低头核对账簿，你一言我一语，谁也做不了主。那商队放心大胆地交了钱，一路畅通，连声说这买卖做得踏实。买卖要长久，公道二字少不了。起初两部的人也闹过别扭，为一文钱的差价争到日头偏西，末了各自让一步，倒成了交情。自此关卡换防，须弥人带了雨林的蜜饯，部族人回赠沙漠的奶饼，你一来我一往，比亲兄弟还热络。"
 SUM_Neo.166.a:"以律法为绳"
 SUM_Neo.166.b:"以人情为度"
 SUM_Neo.167.t:"宥还流人"
 SUM_Neo.167.d:"从前有些沙漠人因言语冲撞了教令院，被扣上一顶大帽子，流放到偏远之地，有家归不得，一走就是十几年。这一日赦令下来，凡是旧年流放的人，一律准许回乡。有个在外漂泊多年的沙漠人，背着破包袱走了几个月，鞋底磨穿，终于望见自家的村子。村口那棵老棕榈树还在，枝子还是那样歪。他站在树下，愣了半晌，眼眶就红了。有孩童不认得他，问他找谁。他说，我找我自己家。能在自己村里老去，也是一桩福分。到家那晚，邻舍都聚拢来问这些年的光景。他把包袱打开，里头没甚值钱物，只有一双磨穿底的鞋，众人看了都红了眼圈。次日一早，村人凑了木料砖瓦，帮他把塌了半边的屋子重新搭起来。他后来把那双磨穿的鞋挂在门楣上，说是给儿孙看个明白。"
 SUM_Neo.167.a:"推进议会的议程"
 SUM_Neo.167.b:"把权柄交还民间"
 SUM_Neo.168.t:"镀金旅团来附"
 SUM_Neo.168.d:"镀金旅团本是沙漠里出了名的佣兵，来去无定，只认摩拉不认人，谁的价高便给谁卖命。这一年官府开了归化的口子，旅团可以编入须弥的队伍，旗帜与编制一概保留，一个也不拆散。操场上，归化的旅团列队操练，喊号子的声音整齐划一，震得沙都颤。有个老兵起初不情愿，说咱们自由惯了，受不得管束。可当号子一响，他竟也跟着喊了起来，声音比谁都响，喊完自己先愣了。旗帜还在，编制还在，换了的是那份归属感。说罢又咧嘴：「只是这号子，喊得人心里热。」操练既毕，他把旧日的镖旗收进箱底，把新旗端端正正挂上旗杆。有弟兄问他还想不想走单帮，他摆摆手：「有粮饷，有营盘，还有个名分，比做流寇强多矣。」说罢把旗绳又紧了一紧。"
 SUM_Neo.168.a:"按学派议决行事"
 SUM_Neo.168.b:"听从乡野的呼声"
 SUM_Neo.169.t:"诸部会议"
 SUM_Neo.169.d:"须弥的议事会从前只有六派首座与城中显贵，个个衣冠楚楚，沙漠部族的首领连门槛都摸不着，只能在门外干等。这一年各部族首领头一回被请进议事会，与众人同坐一列。有位首领进厅时，还习惯性地在门口脱了鞋，被工作人员拦住，说不必如此，您也是这里的主人。那首领愣了愣，挺起胸膛走了进去。议事时，他操着生硬的须弥话，把部族的难处一条条摆出来，什么缺水，什么缺粮，众人竟听得十分认真，还一一记下。坐得上议事席，才算真真正正成了一家人。散会后，侍从送他出门，他还回头把议事厅的匾额看了两眼，嘴里念叨：「好地方，好地方。」后来他把那双脱下的鞋又穿上了，进厅却再没脱过。议事会的门房后来也学了乖，见了部族来人，先搬椅子再倒茶。"
 SUM_Neo.169.a:"以律法为绳"
 SUM_Neo.169.b:"以人情为度"
 SUM_Neo.170.t:"沙林均平"
 SUM_Neo.170.d:"从前雨林与沙漠在律法上两样看待，同是一桩事，情形不同，判罚便不同，沙漠人往往吃亏，有冤也无处诉。这一年新律颁行，明文规定雨林与沙漠一律平等，再无厚此薄彼。有桩案子，雨林人和沙漠人各执一词，闹到衙门，众人本以为官府会偏袒一边，谁知判官翻开的律条是一样的，两边同用一条律，同问一样的话，一样也不偏。判完，双方都不服气，却又都说不出理来，只好各自散去。律法若肯一碗水端平，天下便少了许多怨气。那沙漠人的同乡原备了银子，准备托人打点，见这般判法，银子又收了回去，笑道：「这官司，输得明白，赢得也明白。」旁听的众人也都点头称是。判官收堂时把惊堂木一拍，喝道：「律条面前，无雨林沙漠之分！」此话传出去，两处百姓都竖大拇指。"
 SUM_Neo.170.a:"推进议会的议程"
 SUM_Neo.170.b:"把权柄交还民间"
 SUM_Neo.171.t:"沙林合疆"
 SUM_Neo.171.d:"须弥有雨林，有沙漠，一个湿一个干，向来各过各的，井水不犯河水，连话都少说。如今朝廷倡导血与林合成一个须弥，雨林的物产、沙漠的人马，从此算作一家，不分彼此。起初两边都不自在，雨林人嫌沙漠人粗野，沙漠人嫌雨林人啰嗦，一处议事便要拌嘴。可共处日久，渐渐也就惯了，牙磕舌头哪有不碰的。有一回沙暴来袭，雨林人主动送去粮水，沙漠人则替他们护住田地，两下里都出了力。合则两利，分则两伤，这个道理连沙漠的风都懂。沙暴过后，雨林人送来的粮水一车车卸在绿洲口，沙漠人杀了几只羊款待，两边的人围着篝火吃了一夜，天亮时谁也不记得先前拌过的嘴。自此后，两边的娃娃常在一处玩耍，雨林的口音里掺了沙腔，沙漠的歌里带了水声。"
 SUM_Neo.171.a:"按学派议决行事"
 SUM_Neo.171.b:"听从乡野的呼声"
 SUM_Neo.172.t:"沙林共阜"
 SUM_Neo.172.d:"从前沙漠里的绿洲零零星星，隔着大片荒沙，彼此难得来往，走一趟要冒不少风险，遇上沙暴便九死一生。这一年各处水渠连通，绿洲渐渐连成一片，驼队从一个村子到另一个村子，再不必冒死穿越大沙海。有个商队头一回走这条新路，黄昏时望见前方一处连着一处的灯火，还以为是海市蜃楼，揉了揉眼睛，掐了掐胳膊。待走近了，才知是绿洲的村落，炊烟袅袅，人声喧闹，还有孩子追着驼队跑。沙漠不再是须弥的边角，反倒成了四通八达的通衢。那商队头子逢人便说这条新路，说走一趟省下半个月的脚程，众人起初不信，及至亲眼见了那一线灯火，方才服了。沿路又添了几处打水的新井，井台上刻着各村的村名，是谁出的力，都记在石头上。"
 SUM_Neo.172.a:"以律法为绳"
 SUM_Neo.172.b:"以人情为度"
 SUM_Neo.173.t:"边隅设序"
 SUM_Neo.173.d:"须弥在边疆要塞旁盖起学堂，连当兵的也读书识字，这可算是头一遭。起初将士们不以为然，说拿枪的手哪能拿笔，读书是文人的事。学堂先生也不恼，先教他们认自己的名字，再教他们看地图、记口令。有个老兵头一回写下自己的名字，捧着那张纸看了又看，说这辈子头一回见自己的名字长啥样，端详了半宿。后来士兵们竟爱上了读书，夜里哨所的灯常常亮到很晚，有人还读出了声。有文化的兵，才知为何而战。有个新兵把名字写歪了，被同伍笑了一场，他不服气，每晚加练半张纸，一个月后那一笔一划，竟写得端端正正。学堂的先生后来把将士们的功课订成册子，送到城里去，六派的首座们翻着看，半晌没人说话。有个将军也来旁听了一课，坐在最后一排，笔记记得比谁都满。"
 SUM_Neo.173.a:"推进议会的议程"
 SUM_Neo.173.b:"把权柄交还民间"
 SUM_Neo.174.t:"沙徼置戍"
 SUM_Neo.174.d:"沙漠商道从前盗匪横行，商队走一趟要提心吊胆，货物被劫是常事，不少人行了半辈子车，最后连本钱都赔了进去，只好改行。这一年官府成立沙漠巡防队，沿着商道设了常设的护卫，一队人马定期巡逻，风雨无阻。有支商队头回在有护卫的路上行走，见远处沙尘起处，一队骑兵稳稳赶到，为首的举起令牌，查验过路文书后放行，还嘱咐一路小心。商队的人悬着的心这才放下，头一回睡了个安稳觉。商路安稳，买卖才旺。后来商队过卡，还主动给巡防队捎些吃食，骑兵们推辞不过，收了便替他们多望一程路。有不信邪的匪帮，偏挑巡防换班的空当下手，被埋伏的骑兵围了个正着，贼首被擒，余众跪地求饶，商路自此太平。自此商道上走车的，都说一条路养活两路人，巡防的与赶车的，见面都点头。"
 SUM_Neo.174.a:"按学派议决行事"
 SUM_Neo.174.b:"听从乡野的呼声"
 SUM_Neo.175.t:"编氓为兵"
 SUM_Neo.175.d:"须弥推行民兵制度，雨林与沙漠各守自己的地，闲时种地打猎，战时拿起刀枪，两下里都不误。有村民起初担心，说咱们庄稼汉哪会打仗，拿起锄头还行，刀枪可没摸过。教头便说，守家护院的本事，人人都该会，不会便学。于是逢农闲，村里的空地上便有人练刀习武，妇孺在旁看着，孩子们拿着木棍比划，闹哄哄的。沙漠那边也照样练，只是练的是骑马射箭，沙地上马蹄翻飞。自己守自己的地，才守得最牢。秋后比武，庄稼汉的扁担功竟胜了两个混混，从此村里练武的人更多了，连半大孩子也会几手把式。有回邻村遭了贼，联防的号锣一响，各村青壮顷刻聚齐，贼人还没得手，已被围在坡下，捆了送到官府去。联防的册子设在祠堂里，各家出丁几人、使甚家伙，都写在上头，一目了然。"
 SUM_Neo.175.a:"以律法为绳"
 SUM_Neo.175.b:"以人情为度"
 SUM_Neo.176.t:"设武备塾"
 SUM_Neo.176.d:"从前须弥带兵的军官，靠的是出身高贵，世代相传，老子是官儿子也是官，寻常人连边都摸不着。这一年军官学堂开课，指挥不再看出身，凭本事说话。学堂门口贴出告示，凡有一技之长者皆可报名，不论贵贱。有个沙民牧人的儿子前来应试，赶着羊群走了七日沙道，鞋底磨穿了两双。他弓马娴熟，又识得几行字，竟被取中。那些世家子弟不服，当场就要闹，可几场考较下来，谁优谁劣，明明白白，再也无话可说。那牧人的儿子后来带兵有方，领着一队人在沙暴里走了三天不曾失散，靠的是认得星与沙丘的走势。昔日不服的世家子弟，如今见了他也执礼甚恭。学堂又立了条规矩：考较之日，无论谁家子弟，一律穿布衣入场，认得出来的只有本事，认不出来的只有门第。"
 SUM_Neo.176.a:"推进议会的议程"
 SUM_Neo.176.b:"把权柄交还民间"
 SUM_Neo.177.t:"简练常旅"
 SUM_Neo.177.d:"须弥从前遇事临时征兵，抓壮丁凑数，打完仗就地解散，从来没有一支自己的常备兵，遇着急事往往措手不及。这一年常备军团成军，须弥头一回有了属于自己的军队。成军当日，教场上旗帜招展，队列整齐，将士个个精神抖擞，一声令下，动作齐整，连根针都掉不下来。营中另备了水囊与沙盐，驼队随营而行，走沙道也不至于渴死。有位须发皆白的老臣站在高台上看着，忽然落下泪来，说打了这些年仗，我们总算有自己的兵了，死也瞑目。老臣散场时不肯坐轿，一路走回府去，逢人便说今日的军容。成军次日便开了练，从清晨练到日头落山，没有一个人叫苦；散队时将士还自发把教场打扫干净，沙也扫得平平整整。操练之余又立军功簿，谁有一技之长都记在上头，凭据说话，谁也做不得假。"
 SUM_Neo.177.a:"按学派议决行事"
 SUM_Neo.177.b:"听从乡野的呼声"
 SUM_Neo.178.t:"边筑坚堡"
 SUM_Neo.178.d:"须弥沿着与邻国的边界，一处接一处地修起要塞，烽火台遥遥相望，遇有动静便狼烟四起，一处点火处处知晓。有座要塞修在险要的隘口，墙高丈余，石块垒得严丝合缝，连只老鼠也钻不进来。守卒日夜轮班，警惕地望着远方。风沙是顶难缠的敌手，一遇沙暴，烽燧的烟刚起便被吞了，只好改用铜锣，一递一递敲过去；台里还屯着水与干枣，免得守卒渴死在台上。起初百姓不惯，见那高墙横在门前，出入都要绕道，嘴里颇有怨言。后来边境安宁，盗匪绝迹，众人方才明白，这几座要塞挡住的是祸患。后来孩子们在那要塞底下放风筝，守卒也不驱赶，还替他们捡过几回断线的风筝。守将把各处烽火台的号令编成口诀，夜里抽查，答不上的罚站一夜岗。"
 SUM_Neo.178.a:"以律法为绳"
 SUM_Neo.178.b:"以人情为度"
 SUM_Neo.179.t:"谍骑绘图"
 SUM_Neo.179.d:"须弥派出斥候，走遍全境，把山川、河流、道路、村落一一画在图上，好让朝廷对自家家底心中有数，不打没把握的仗。有个年轻斥候翻山越岭，脚底磨出了血泡，鞋都穿烂了两双，却半点不肯歇脚。有一回他趴在岩石上，就着暮色把一处险要地形描下来，手指冻得发僵也不肯停，生怕漏了一笔，误了大事。几个月后，一张详尽的地图终于绘成，须弥全境尽在纸上，连条羊肠小路都清清楚楚。知己知彼，先要知己。他绘的那张图后来成了军中的范本，同僚抄绘时，都先验一验他注的尺寸，说错一寸也不行。图成之日呈上朝廷，君臣传看，有老臣抚图叹道：「有此一图，用兵便如掌上观纹。」图收归兵部，专库保存。有图上无路的去处，他宁可多绕三天，也要亲眼看过再落笔，说不实之图，害人害国。"
 SUM_Neo.179.a:"推进议会的议程"
 SUM_Neo.179.b:"把权柄交还民间"
 SUM_Neo.180.t:"沿涂置亭"
 SUM_Neo.180.d:"行军打仗，粮草先行，这是自古不变的道理。这一年须弥沿着驿道与水路，一处接一处地铺开后勤驿站，囤粮草、养马匹、修车辆，事事备得齐全。每到一站，驼队卸下驮子，水囊灌满，驮兽喂了豆料再上路。有个管驿站的吏员，把账本记得清清楚楚，哪站存粮多少，哪站有几匹马，翻一翻便知，分毫不差。有回一支队伍长途行军，又累又饿，走到一处驿站，热饭热菜早已备好，锅里还炖着枣椰，人马都得了歇息，士卒吃得香甜，赞不绝口。那吏员夜里还提灯巡库，一袋一袋捏过去，说账本要实，库里的粮更要实，坏一袋都瞒不得。沿途驿站墙上都钉了一块木牌，写着到前站的里数与打尖的时辰，行军的人一看便知。驿站后头还种着几株枣椰，说是给过路的人解渴。"
 SUM_Neo.180.a:"按学派议决行事"
 SUM_Neo.180.b:"听从乡野的呼声"
 SUM_Neo.181.t:"沙中演阵"
 SUM_Neo.181.d:"沙漠里打仗，向来靠的是灵活机动，骑兵忽聚忽散，来去如风，专挑敌人的软肋下手，从不硬碰硬。这一年军官把沙漠游击的战法一条条写进操典，教全军操练，让人人都会使。有位老军官亲身演示，如何假装败退，如何诱敌深入，如何趁夜奇袭，讲得眉飞色舞。年轻的军官们听得目瞪口呆，方知打仗还有这般学问，纷纷提笔记下，生怕忘了。兵无常势，水无常形，能因地制宜才是高明。操典印成当日，军中争相传抄，有骑兵把那几条战法编成口诀，走在路上也哼哼唧唧地背。操练之余又设对演，两军各扮敌我，胜的一方记功，输的一方复盘，输赢都要说出个所以然。有几个骑兵把口诀编成了调子，行军时低声哼，走累了哼，连战马听熟了，蹄步都跟着那调子合拍。"
 SUM_Neo.181.a:"以律法为绳"
 SUM_Neo.181.b:"以人情为度"
 SUM_Neo.182.t:"合为戎典"
 SUM_Neo.182.d:"须弥从前各部队练兵各有各的章法，口令不一，号令不同，你喊前进我喊后退，几支队伍到了一处便乱了套，常常闹出笑话。这一年全军训典统一，从最远的哨所到最近的营房，一律照着同一本操典练，口令传到哪里都不走样。有回两支队伍在沙丘下会合，号令一响，动作整齐划一，如同一个人，进退之间毫无参差，连脚步声都响在一处。带队的军官这才点头，说这仗能打了；旁观的牧人抱着羊鞭看了，也忍不住喝彩。颁行之初也有刺头的，故意喊错口令，被教官当众罚了三趟号，自此营中再没人敢拿令当儿戏。军中又立了稽查，专查操典行得如何，查出一处不合，便记在那营官名下，季考时算总账。连伙夫营都跟着改了传菜的口令，喊起来一样干脆利落。"
 SUM_Neo.182.a:"推进议会的议程"
 SUM_Neo.182.b:"把权柄交还民间"
 SUM_Neo.183.t:"购求异械"
 SUM_Neo.183.d:"须弥的军械从前全靠外国进口，价钱贵不说，坏了还无处修，一旦断了来源，只能干瞪眼，任人拿捏。这一年一边引进新式军械，一边设了作坊自己仿造，要摆脱那受制于人的局面。铸坊里炉火昼夜不熄，铁匠照着样子一锤一锤地打，头几件做得粗糙，后来渐渐精良。坊中又向沙漠旧窟里讨来赤王年间的黑铁与晶石，熔了掺进去，刃口竟比寻常铁器硬上一分。有个老匠人拿着自己造的刀与进口的比了比，连劈几根木桩，竟不落下风。求人不如求己，能把别人的本事学来，才是真本事。后来作坊出的刀成了紧俏货，邻国也来订购，匠人嘴上不说，心里都憋着一股劲，铁锤抡得比先前更响。作坊又立师徒制，老师傅带徒弟，一锤一凿都要过手，出师须打出一把过得了老匠人眼的刀。"
 SUM_Neo.183.a:"按学派议决行事"
 SUM_Neo.183.b:"听从乡野的呼声"
 SUM_Neo.184.t:"更练锐卒"
 SUM_Neo.184.d:"须弥有了新式陆军，训练有素，器械精良，兵强马壮，成了共和国最后的保险。这支部队不归任何一派私有，不听哪个贤者的私下号令，只听共和国的，谁也调不动半步。有回城中生了乱子，几个闹事的人纠集一处，众人慌作一团，只见新式陆军开到，队列齐整，不乱不噪，三两下便稳住了局面，闹事的人一看这阵仗，顿时作鸟兽散。百姓隔着门缝看，心里踏实了许多。有这支兵在，共和国便稳如磐石。乱子平后，有长老要把酒肉送去犒军，领兵的却只收了一壶清茶，道：「守土是本分，不受犒赏。」长老叹道：「好一支干净的兵。」归来对乡人说，有这样的兵守着，睡也睡得安稳。此后各派议事，凡有争执不下处，都先看陆军的态度，陆军不表态，谁也不敢先动手。"
 SUM_Neo.184.a:"以律法为绳"
 SUM_Neo.184.b:"以人情为度"
 SUM_Neo.185.t:"须弥干城"
 SUM_Neo.185.d:"须弥之盾立于雨林与沙漠之间，替共和国挡住外敌，日夜警戒，从不懈怠。这支部队不轻启战端，却也从不容人犯境半步。有一股外敌来犯，探马飞报，盾军连夜开赴边境，列阵迎敌，甲仗鲜明，旗帜如林，一眼望不到头。敌军远远望见须弥军容严整，士气高昂，知难而退，不战而走，连营垒都没敢扎。能战方能言和，手中有盾，才有人肯坐下来谈，不然人家只当你软弱可欺。敌军退后，盾军也不追击，只在边境线上扎营三日，立起界碑，方才徐徐班师，沿途秋毫无犯。盾军的兵额、驻所、粮饷，一概列在明处，人人可查，为的就是叫百姓知道，这支盾为谁而立。有随军的书记把这三日的光景记进营史，末尾添了一句：盾立于此，非为好战，为的是盾后头那些点灯的人家。"
 SUM_Neo.185.a:"推进议会的议程"
 SUM_Neo.185.b:"把权柄交还民间"
 SUM_Neo.186.t:"共政既成"
 SUM_Neo.186.d:"宪法生效当日，须弥城中热闹非凡，学者、商人、猎人、守村人一齐聚到议事厅前，站成黑压压一片，那阵仗几百年来头一回。议事厅的大门缓缓打开，新宪法当众宣读，一字一句，清清楚楚，念了足有一炷香。读罢，众人齐声欢呼，声震屋瓦，惊起一群飞鸟。有位老猎人扛着猎枪站在人群里，听不太懂那些文绉绉的话，却也跟着欢呼，把帽子抛上了天。旁边的人问他欢呼什么，他说，往后咱们都是这国的主人了。须弥从此成了一个共和国。那宪法刻成了铜版，钉在议事厅外墙上，不识字的也围着看，有人拿炭笔照着描，回家教孩子念。有描得好的，被先生夸了两句，从此愈发上心，把宪法当功课背了下来。有人抄完还找先生对了一遍，一个字不敢错，错一个字便觉得对不起那一炷香的宣读。"
 SUM_Neo.186.a:"按学派议决行事"
 SUM_Neo.186.b:"听从乡野的呼声"
 SUM_Neo.187.t:"旅团置社"
 SUM_Neo.187.d:"镀金旅团与沙漠民联手，一鼓作气推翻了教令院的最后一座塔。那塔原本是教令院权势的象征，高耸入云，压在沙漠百姓头上多少年，塔倒之日，尘埃冲天，半边天都黄了。众人围着倒塌的塔基，久久不愿散去，有人对着废墟吐了口唾沫，骂一声早该如此。随后清点财富，须弥多年积攒的钱粮，头一回留在了须弥人自己手里，不再一车车送往远处。有个沙漠老人捧着一袋摩拉，手都在抖，说这是咱们自己的钱，攥得死紧。塔倒了大快人心。后来真在废墟旁立了块小碑，不刻字，只刻一座倒了的塔，来往行人看见，都要站上一站。碑旁常年有人放一朵沙漠玫瑰，谁放的没人看见，只是日日都有一朵新的。有老人带孩子来看那碑，指着道：「记住这座塔的模样，一辈子别忘了。」孩子似懂非懂，那碑的模样却记了一辈子。"
 SUM_Neo.187.a:"以律法为绳"
 SUM_Neo.187.b:"以人情为度"

 #################### 丙线 · 造神王座 ####################
 SUM_GT_Throne_of_Genesis:"营此神座"
 SUM_GT_Throne_of_Genesis_desc:"教令院地底下有间大厅，灯火终年不灭。人偶的躯体平放在石台上，胸腔开着，一颗神之心缓缓落进去。围着的贤者退了一步，谁也不敢先出声。半晌，大贤者才低声道：「咱们要造一个神，替自己坐着这把椅子。」众人听了，都低下头去。"
 SUM_GT_Gen_Resume:"重铸神躯"
 SUM_GT_Gen_Resume_desc:"「只管抄你的！」旁边人喝道。年轻书吏手脚发凉，抄到某一页忽然住手，那上头记着上一回失败的名录。大贤者一纸令下，造神计划重又开张。密室门打开，蒙尘的档案一箱箱抬出来，纸头发黄，边角都卷了。抄录的人连夜誊写，抄到天亮，桌上的烛台积了一摊蜡。"
 SUM_GT_Gen_Shell:"攒成人形"
 SUM_GT_Gen_Shell_desc:"人偶的躯体重新拼装，关节处用上赤王时代的零件，铜件上的纹路还看得清。工匠拿布一遍遍擦，擦得发亮，才敢往上装。装到最后一块，手一抖，冷汗啪地滴在石板上。领头的瞪他一眼：「稳着点，这东西经不得磕碰。」"
 SUM_GT_Gen_Core:"夺得神核"
 SUM_GT_Gen_Core_desc:"一颗神之心被捧进厅里，用绸子裹着，捧的人走一步停一步。装进胸腔霎时，厅里的灯焰齐齐一暗。众人屏着气，等那灯再亮。灯亮了，人偶的手指却动了一下。有个工匠揉了揉眼，叫道：「动了！它动了！」"
 SUM_GT_Gen_Test:"肇建试场"
 SUM_GT_Gen_Test_desc:"试验选在沙丘底下，洞口用沙袋堵了，只留一条道。受试的人一个个进去，出来时脸色各异，有的发青，有的发笑。名单当场封存，贴上蜡印，谁也不许看。有个书吏多问了一句，被人拉到一边，喝道：「不该问的别问。」"
 SUM_GT_Gen_Divinity:"以神髓注"
 SUM_GT_Gen_Divinity_desc:"神性一点一点灌进去，像往空罐里注水，注得极慢。灌到第三日，人偶的手指忽然屈了一下。守夜的人吓得跌坐在地，半晌才爬起来去报。厅里的贤者赶来看，看了很久，没人说话。末了大贤者才吐出三个字：「成了。」"
 SUM_GT_Gen_Knowledge:"识海奔涌"
 SUM_GT_Gen_Knowledge_desc:"虚空终端把全部知识灌进人偶，灌了整整七日，管子烫得能烙手。第八日，人偶睁开眼睛，开口说的头一句话是：「须弥。」记录的人手一抖，把这两个字写歪了。旁边人凑过来看，念道：「它头一个认的，是这个地方。」"
 SUM_GT_Gen_Mechanic:"机关为神"
 SUM_GT_Gen_Mechanic_desc:"人偶站了起来，脚下的石台被踩出裂纹。它抬起头，目光扫过厅里每个人，众人不由自主矮了半截。有个老贤者忽然发现，自己竟在发抖，忙把袖子里的手攥住。这尊人偶，比谁都更像神。"
 SUM_GT_Gen_Perfect:"铸此完偶"
 SUM_GT_Gen_Perfect_desc:"人偶的躯体被调到完美，肌肤、骨节、瞳色，样样挑不出错。教令院发下文书：不许人称它机括傀儡，只许称它神。有个年轻学人私下嘀咕了一句：「终究是木头做的。」第二天就被调去了边关。"
 SUM_GT_Gen_Ritual:"盛陈降神"
 SUM_GT_Gen_Ritual_desc:"降神仪式在净善宫前举行，香案摆了三重，六大学派一个不缺。鼓声一响，众人齐齐跪下，只有主持的贤者还站着。念到最末一句，风把幡吹得倒卷，啪地打在柱上，没人敢去扶。有个小沙弥看了，忙把头埋得更低。"
 SUM_GT_Gen_Awaken:"神瞳初启"
 SUM_GT_Gen_Awaken_desc:"「你们怕什么？」新神睁开眼，头一个撞进眼里的，是阶下跪着的一片贤者，全是背影，没谁敢抬头。它瞧了许久，忽然发问。满殿静得吓人，没一个人应声。过了半晌，大贤者的喉咙动了动，到底没吐出字。新神眨了眨眼，又问了一遍，声音里听不出喜怒。"
 SUM_GT_Gen_Name:"伪神立号"
 SUM_GT_Gen_Name_desc:"贤者们为新神取名，关在屋里议了三日。有人说要取赤王的名号，有人说要带上教令院。争到末了，凑成一个又长又拗口的名字，听着像两块石头磨在一处。写定之后，无人再念。有个书吏试着念了一遍，自己先笑了，赶紧把纸卷起来。"
 SUM_GT_Gen_Enthrone:"奉神践祚"
 SUM_GT_Gen_Enthrone_desc:"新神登基当日，净善宫换了旗。旧神被抬到偏殿，殿里只有一扇小窗，光落在地上，像一小块布，风一吹就挪半寸。抬的人脚步很轻，路却走得很快。有个抬轿的忍不住回头望了一眼，被领头的喝住：「快走！」"
 SUM_GT_Gen_Complete:"伪神既成"
 SUM_GT_Gen_Complete_desc:"造神一事到底成了。那尊人偶睁了眼，站起身来，净善宫里外鸦雀无声。贤者们整衣叩首，口称神谕，袖里却都攥着号令木牌。须弥从此有了一位听得懂号令的神。有个老贤者叩完头起身，悄悄把袖里木牌又攥紧了些。"
 SUM_GT_Des_Memory:"赤王旧魂"
 SUM_GT_Des_Memory_desc:"贤者们翻检旧档，从沙里掘出一卷赤王的记忆。卷上字迹歪斜，读一句要停三回。他们偏说这是须弥更早的骄傲，捧着它在讲坛上念了整宿。听的人直打呵欠，却没人敢走。有个打盹的被旁边人一碰，激灵坐直了。"
 SUM_GT_Des_Pillar:"列柱沙原"
 SUM_GT_Des_Pillar_desc:"列柱沙原上，那几根倒了的旧柱又被立起。百十个沙民拉绳使杠，号子喊得震天：「一！二！起！」柱上旧纹被凿平，另刻新颂词，字口还带着石粉的白。风一过，粉扑了人一脸，众人抹抹眼，接着拉。"
 SUM_GT_Des_City:"居尔城重光"
 SUM_GT_Des_City_desc:"却说居尔城。那地方断墙残垣躺了几百年，这一日忽然来了工匠，和泥的和泥，垒石的垒石，墙一层层往上长。有个过路的问：「砌给谁住？」工匠摇头不答，只把灰抹得更平些。"
 SUM_GT_Des_Cult:"赤王之徒"
 SUM_GT_Des_Cult_desc:"赤王旧日的信徒，本在沙里偷偷烧香。教令院一纸文书下来，把他们尽数收编，换上新裁白袍。头一日领去磕头，磕的却是那尊人偶。有个老信徒磕到一半，抬头看了一眼，又赶紧把头低下去，嘴里念叨：「赤王啊……」旁边人咳了一声，他便住了口。"
 SUM_GT_Des_Gold:"金沙幻梦"
 SUM_GT_Des_Gold_desc:"教令院派出宣讲的人，走街串巷，把黄金时代的老梦重讲一遍，说其时沙里流的是奶与蜜，人人不必低头。听讲的多是挑水的、赶驴的，蹲在墙根听。有个赶驴的听完，抹抹嘴道：「照这么说，咱祖上还阔过？」众人笑笑，各自散了。"
 SUM_GT_Des_Remnant:"余响不绝"
 SUM_GT_Des_Remnant_desc:"沙漠深处常有怪响，风钻过石缝，呜呜咽咽像有人说话。有队商人夜里听见了，回来便说那是神谕。这话一传十，十传百，传到教令院。学者们也不驳，只把它抄进档里。有个抄档的问道：「这也算数？」上官道：「写你的。」"
 SUM_GT_Des_Echo:"沙际遗响"
 SUM_GT_Des_Echo_desc:"沙丘之间起了回声，一声递一声，越传越远。起初只是牧人听见，后来连城里的孩子也会哼那调子。调子里翻来覆去就一句：赤王要回来了。有个孩子哼着哼着问他娘：「赤王是谁？」娘一把捂住他嘴：「别唱了！」教令院听了，既不认，也不查。"
 SUM_GT_Des_Oasis:"长存之洲"
 SUM_GT_Des_Oasis_desc:"沙海之上，忽然浮起一片绿洲的影子，有水，有树，树影还晃。赶路的人奔过去，走了一日，那影子仍在原处。有个跪下去捧水，捧起一把干沙，愣了半晌，哭道：「明明看见水的！」回来一说，众人都道是永恒绿洲显了灵。"
 SUM_GT_Des_King:"沙海称孤"
 SUM_GT_Des_King_desc:"那新神开口，声音不像人声，自称是沙中之王的继承者。殿上众人一齐跪下，只有个年轻书吏愣了愣，被人从背后按低了头。从此文书上凡写神号，前头都要添这一长串。那书吏写着写着，笔一顿，心里道：「这名号，倒比人还长。」"
 SUM_GT_Des_Legion:"赤王总戎"
 SUM_GT_Des_Legion_desc:"赤王军团成军是日，校场上站了三千人。看那队伍，多是沙漠里的佣兵，甲是自己带来的，刀也是。点名的书吏念一个，应一个，念到后来嗓子都哑了，哑着嗓子喊：「下一个！」旗却是新的，一色赤红，风一吹，哗啦啦响。"
 SUM_GT_Des_Wrath:"大狱将临"
 SUM_GT_Des_Wrath_desc:"审判之日定了下来，就在下一个朔日。教令院连夜翻旧账，哪年谁说过什么话，谁在墙角写过什么字，一笔笔都记着。被叫去问话的人排到廊下，出来时脸都是白的。有个进去时还嘴硬，出来时腿都软了，扶着墙走。"
 SUM_GT_Des_Revive:"赤王复起"
 SUM_GT_Des_Revive_desc:"「赤王若真回来，头一件事，只怕是认这些不肖子孙。」人群外头，一个老者压着嗓子对同伴说。同伴没敢接话，只把帽檐压低了些。高台上，贤者们当众宣称赤王归来，说就附在那尊人偶身上。台下有人欢呼，也有人悄悄往后缩。这场面，热闹里透着一股说不清的蹊跷。"
 SUM_GT_Des_Throne:"筑座于沙"
 SUM_GT_Des_Throne_desc:"居尔城正中，起了一座王座，全是黄铜打的，日头一照晃眼。座上坐着人偶，座下跪着贤者。至于净善宫里那位旧神，香案上的花枯了三日，也没人换。有个小侍从偷看了一眼，被长老拿眼一扫，赶忙低头去扫地。"
 SUM_GT_Dot_Visit:"多托雷叩关"
 SUM_GT_Dot_Visit_desc:"席间没有一个人敢先动筷子，只有他自顾自吃得很从容。多托雷亲至须弥城，一身白袍，面上罩着面具，走路听不见声响。教令院大开中门，连摆三日宴席。有个胆大的偷瞄了一眼，只觉那面具背后的眼睛正对着自己，吓得赶紧把筷子放回原处，再不敢抬起来。"
 SUM_GT_Dot_Deal:"愚人众结契"
 SUM_GT_Dot_Deal_desc:"须弥与至冬签下协定，正本誊得工工整整。只是每页边上另有一行小字，是手写的，墨色不同。誊抄的书吏看见了，不敢问，照着抄又不甘心，末了把那行字抄得比正文还小，自己盯着看了半晌，啥也没说。"
 SUM_GT_Dot_Lab:"幽窟试术"
 SUM_GT_Dot_Lab_desc:"城底下的实验室又扩了一层，一直挖到沙丘下的洞窟。运石的车夜里进出，车轮裹了布，走在街上不出声。有个挑夫失手碰落一块石，当啷一响，被领头的瞪了一眼，当下腿就软了，扶着墙才没跪下去。"
 SUM_GT_Dot_Subject:"养此畸质"
 SUM_GT_Dot_Subject_desc:"那本试验体的名册，一月添一册，册册都厚。翻开看，名字多是沙民，且是被流放过的。书吏抄名时手不停，抄到熟人便顿一顿，随即又照抄下去。他偷偷把那名字看了两遍，末了锁进铁柜，钥匙只一把，攥在自己手里。"
 SUM_GT_Dot_Wisdom:"鬻知为市"
 SUM_GT_Dot_Wisdom_desc:"知识也能论斤称。教令院开了间密室，一边收书，一边出图。至冬来的客商把机械图纸摊在案上，贤者把抄本推过去，两边都不言语，各自卷起走人。头一回做完，有个贤者关上门，搓了搓手，低声道：「这买卖，做得。」如此一共做了三回。"
 SUM_GT_Dot_Machine:"铸成机关"
 SUM_GT_Dot_Machine_desc:"一个小兵伸手去摸铁人的手，触手冰凉，惊得赶忙缩回。传送机道头一回开动，铁件顺着长槽一件件前行，到了尽头竟自己立住。旁观的人都后退了半步。头一批七十二个走下机道，当天就装车送进军营，连身上的号衣都备得齐整。"
 SUM_GT_Dot_Factory:"工坊量产"
 SUM_GT_Dot_Factory_desc:"老妇抖着衣裳，抬头望了望天，叹道：「这日子，天都不青了。」旁边人赶紧拉她一把，叫她莫要乱说。工厂昼夜不歇，烟囱一根挨一根，大白天也吐黑烟。城里原本青湛湛的天，如今蒙了一层灰。衣裳晾在外头，收回来一抖，尽落黑末。"
 SUM_GT_Dot_Weapon:"傀偶充刃"
 SUM_GT_Dot_Weapon_desc:"人偶兵器列装当日，兵士排成两行，一行是人，一行是人偶。人偶不动，也不喘气。夜里宿营，有个兵士翻身，撞见同伴睁着眼坐在铺上，吓得叫出声来：「你、你怎么不睡？」细看才知是铁做的，同屋的人哄堂大笑。"
 SUM_GT_Dot_Clone:"割取一脔"
 SUM_GT_Dot_Clone_desc:"多托雷的切片在须弥城里走动，一人在东街买茶，一人在西市问价，两个碰了面，还相互点了点头。街坊看得发怔，不知哪个是正主。有个胆大的凑近问道：「两位，到底哪位是真的？」两人答得一字不差，把那人也绕糊涂了。"
 SUM_GT_Dot_Blasphemy:"铸此不祥"
 SUM_GT_Dot_Blasphemy_desc:"须弥的学者如今造的东西，图纸上没有，书上也没有。问他们照着什么造，只答一句：「凭想。」工坊里昼伏夜出，做出来的物件，一半不像活物，一半不像死物。有个老工匠进去看了一眼，扭头就走，边走边嘟囔：「这不是匠人干的活。」"
 SUM_GT_Dot_Alliance:"盟于朔北"
 SUM_GT_Dot_Alliance_desc:"须弥与至冬结了盟。盟书一签，沙漠边上就起了几座营寨，挂的是至冬的旗。过往商队要验路引，验的人说的是北边口音。有个老牧人蹲在坡上看了一晌，把羊一赶，绕开了道，边走边嘀咕：「这地方，越发不认人了。」"
 SUM_GT_Dot_Master:"暗执禁术"
 SUM_GT_Dot_Master_desc:"教令院自认把禁忌摸透了。他们打了一只铁柜，柜上刻满封印，把那些见不得光的东西一件件收进去，落了锁，钥匙分作三截，三人各持一截。柜子摆在议事厅正中，议事时人人从柜前过，腰杆便都直了些。有个年轻官儿问：「这柜里到底是什么？」三位持钥的一齐瞪他，他便不言语了。"
 SUM_GT_Dot_Supreme:"与神同列"
 SUM_GT_Dot_Supreme_desc:"至冬摆宴，长桌两头坐的是贵人。须弥的神坐在桌边，与第二席并肩，穿的是至冬裁的袍子。席间敬酒，先敬第二席，再敬神。神不饮，那杯便搁着，搁到散席也没人敢撤。有个侍者想收，被旁边人一把拽住，附耳道：「别动，那是给神留的。」"
 SUM_GT_Mac_Ruin:"发冢探墟"
 SUM_GT_Mac_Ruin_desc:"「这东西，真能转？」年轻队员捧着齿轮问。老队员答道：「转了三千年了。」沙里的遗迹一处处掘开，先划方格，再下铲，连挖出来的沙都要过筛。赤王的机械陆续见了天日，齿轮上的沙吹干净，竟还转得动。发掘队拿布把物件裹好，编上号，一捆捆驮上驼背。"
 SUM_GT_Mac_Atlas:"机巧图经"
 SUM_GT_Mac_Atlas_desc:"妙论派领了差事，把出土的机械一件件拆开，量过尺寸，画成图谱。图上密密的线，旁边注着小字，连一颗铆钉也不放过。有个画师画到第七日，眼花了，把齿轮画成了莲花，自己还纳闷：「这花，怎么有齿？」旁边人笑得直不起腰。"
 SUM_GT_Mac_Ameta:"阿玛塔枢"
 SUM_GT_Mac_Ameta_desc:"阿玛塔的机核复刻出来，小小一枚，捧在手里发沉。工匠照图一层层装，装了四十九日，成一具骨架。骨架立起时，屋里灯火一齐矮了半寸。众人不敢出声，只听齿轮在里头走，咯噔、咯噔。有个工匠咽了口唾沫，悄悄把工具放下了。"
 SUM_GT_Mac_Energy:"元力之枢"
 SUM_GT_Mac_Energy_desc:"城外的老农看了半夜，翻来覆去睡不着，抱怨：「亮成这样，鸡都当是天亮了。」储能的机件一批批造出来，一箱箱往外发。工坊里挂起了灯，从前要添油，如今不用添，灯也长明不灭。夜里从城外望去，白光连成一片，倒像城里又起了一座城。"
 SUM_GT_Mac_Remelt:"冶铸得法"
 SUM_GT_Mac_Remelt_desc:"熔铸之术又恢复了。废了的机关不必扔，抬进炉里，化了再浇，浇出来的件比原来的还齐整。老工匠摸着新件，叹道：「这手艺，我祖父会，我只学了一半。」如今炉火一旺，那半截也补上了。他拿新件对着光看了看，眼里竟有点发亮。"
 SUM_GT_Mac_Tablet:"铸石成牒"
 SUM_GT_Mac_Tablet_desc:"熔铸石板碎成几十块，散在各处。学者们拼了三日三夜，拼到最后一块，满板的字连成一篇，竟是一整套失传工艺，从头一步到末一步，一块不缺。念完满屋人都不出声。半晌，有个老学者颤声说道：「老祖宗的手艺，回来了。」"
 SUM_GT_Mac_Khaj:"卡赫尼斯之匙"
 SUM_GT_Mac_Khaj_desc:"卡赫尼斯之钥到底找着了，就压在一口枯井底。钥匙不大，黄铜的，齿口极细。学者捧回去，插进那扇门上的孔，一拧就开了。门后没有光，也没有声。开门的当下就退了半步，攥着钥匙的手直冒汗。旁边人问：「里头有什么？」他摇摇头：「没看清。」"
 SUM_GT_Mac_Factory:"设械作场"
 SUM_GT_Mac_Factory_desc:"机械工厂开工当日，老工匠们都到齐了，站在门口。厂里没有人手的位置，只有一排排齿轮。领工的说道：「往后，你们只管看图。」有个老师傅伸手摸了摸齿轮，摸了一手油，回头就走，边走边道：「这活，不是人干的。」领工的在后头喊他，他也不回头。"
 SUM_GT_Mac_Army:"械自为伍"
 SUM_GT_Mac_Army_desc:"「他们不喊、不叫，就知道往前走！」那个逃回来的兵连滚带爬，边跑边嚷。自动军团列成阵，横平竖直，站满了整片沙地，不发饷，不吃饭，也不交头接耳。对阵当日，对面喊降，阵里没人应声，只顾往前推。推到日落，沙上再没了一点声响。"
 SUM_GT_Mac_Golem:"石人骤起"
 SUM_GT_Mac_Golem_desc:"「低头，别看它眼睛！」老兵一把揪住新兵的后领。新兵抬头瞧了一眼，腿肚子立时转了筋。赤王的石像被唤醒，高有三丈，肩上立着一只鹰。它一步踏下去，沙便陷半尺，队伍从它腿边过，人只到它膝盖。它走在最前头，两眼是两团暗火，走一路，烧一路。"
 SUM_GT_Mac_Sky:"浮城崛起"
 SUM_GT_Mac_Sky_desc:"「这城，怎么上去？」一个工匠挠着头问。贤者没答，只把图重新铺平了些。浮空城的图纸复原出来，摊开占满一整间屋，画的是一座城，底下不着地基，尽是几团云纹。贤者指着图道：「须弥要在天上造一座城。」底下的人看看屋顶，又看看图，你看我我看你。"
 SUM_GT_Mac_Core:"枢纽居中"
 SUM_GT_Mac_Core_desc:"中枢塔盖起来后，四面找不见一扇窗。须弥的粮草、水务、兵卒、物料，从此都打这一处调度。哪个村子缺了水，哪段路该修，一道指令传下去，半日工夫便办妥当。百姓照着吩咐做就是，用不着追问缘由。有位村长捏着那道命令直摇头：「办得快是快，就是没人给咱讲清楚，到底图什么。」"
 SUM_GT_Mac_Age:"机关盈宇"
 SUM_GT_Mac_Age_desc:"须弥进了机械之世。街上车马有序，田里水渠按时开合，连报时都不用人敲钟。只是但凡出错，差错总出在人身上。有个监工冷冷说道：「人，是这套机括里最不准的零件。」这话传到工坊，众人低头不语。老工匠把锤子往地上一磕，半晌没吭声。"
 SUM_GT_Aby_Whisper:"渊底微言"
 SUM_GT_Aby_Whisper_desc:"须弥人头一回听见深渊开口，是在世界树底下。那声音闷沉沉的，仿佛从地底钻出来，说要助须弥一臂之力造神。贤者们立在树影里，整整站了半宿，没一个敢搭腔。大贤者到底憋不住，问了一句：「你要的是什么？」对面只传来几声冷笑，再无别的动静。夜风卷着树叶，沙沙响了一宿。"
 SUM_GT_Aby_Pact:"渊市通幽"
 SUM_GT_Aby_Pact_desc:"教令院与深渊做了一笔交易，做得极密。交货的地方在沙丘背阴处，无灯无火。那边送来几口黑箱，这边付出去几卷图。箱盖一开，冷气扑脸。搬箱的人回来便病了，躺了半月，发起寒热，嘴里直念叨：「那箱子里，有东西在看着我。」"
 SUM_GT_Aby_Knowledge:"妄窥幽秘"
 SUM_GT_Aby_Knowledge_desc:"赤王当年碰过的那套禁忌知识，又被取了出来。本封在石匣里，匣上刻着不许开的字样。开匣当日，学者们围成一圈，谁也不敢先伸手。末了是个年轻的动了手，指甲划在石上，响得刺耳。匣盖一掀，里头一股冷气冲上来，那年轻的手一抖，却没敢缩回去。"
 SUM_GT_Aby_Corrupt:"氛祲相侵"
 SUM_GT_Aby_Corrupt_desc:"雨林那边先坏了事。树皮上起黑斑，一片片往下掉，草踩上去发脆。巡林官在地图上把死域的边线往外挪了一指，挪完看了半晌，又挪了一指，越挪手越沉。没几日，村里的孩子开始咳，娘们把娃抱在怀里，直往林子外头躲。"
 SUM_GT_Aby_Monster:"缚兽平妖"
 SUM_GT_Aby_Monster_desc:"沙漠深处的魔兽醒了。先是驼队失了踪，后是商道上有血迹，从沙里一路拖到岩后。跑回来的人脸都白了，叫道：「那东西有牛那么大，走得比马快！」商道就此断了，市面上的盐一日涨了三回。有个盐贩子把秤一摔：「这叫什么世道！」"
 SUM_GT_Aby_Nail:"神钉镇罪"
 SUM_GT_Aby_Nail_desc:"「底下……底下有东西！」靠近的那人两腿一软，一屁股坐在沙里，嘴里反复念叨。判罚之钉被拔出一枚，拔时搭了三根铁索，十几个人一齐用力，喊着号子，拽了半日才见松动。钉子一出来，地底轰然一声，裂开一道望不见底的口子，风从缝里往上冒，带着铁腥。"
 SUM_GT_Aby_Void:"叩启虚空"
 SUM_GT_Aby_Void_desc:"沙丘底下开了一道虚空之门，门框是黑的，门里也是黑的。风从门后吹出来，不冷不热，吹得人心里发空。有人往门里扔了块石头，扔出去半晌，没听见落地。众人便都退了。有个胆大的还想再扔一块，被同伴一把拽住：「够了，走！」"
 SUM_GT_Aby_Sandworm:"巨虫破土"
 SUM_GT_Aby_Sandworm_desc:"列柱沙原底下睡着的沙虫醒了。沙面上先鼓起一道土脊，走一路，翻一路。一头骆驼被拖下去，只留下一个坑。牧人不敢再放羊，把羊圈挪到岩根底下。有个老牧人望着那道土脊，叹道：「这沙，也翻了脸了。」如今那片沙原没人敢过。"
 SUM_GT_Aby_Fallen:"学者堕落"
 SUM_GT_Aby_Fallen_desc:"「查无此人。」家属连着问了三回，得来的都是这四个字。那几个学者叫禁忌知识吞了心神，起初夜里尽说胡话，后来写字都颠倒，到末了连自家大门都寻不着。教令院派人来，把他们的名姓从册子上狠狠划掉，一笔不留。有位老母亲却不信，日日守在院门外头等，一直等得满头白发。"
 SUM_GT_Aby_Rite:"设坛犯禁"
 SUM_GT_Aby_Rite_desc:"那场禁忌仪式就在新神面前做成。地上画了三重圆，圆里点着黑烛。念到第三遍，烛火一齐矮下去，殿里暗了。从是夜起，须弥的夜就比从前长，天亮得晚，鸡叫也迟。有更夫敲梆，敲着敲着嘀咕：「这夜，怎么熬不到头？」"
 SUM_GT_Aby_Legion:"幽渊聚旅"
 SUM_GT_Aby_Legion_desc:"深渊里的东西被编成军团，也发号衣，也排队。只是那号衣穿在它们身上，撑得变了形。点名的书吏喊一个，走出来一个，脚不沾地。领军的贤者说道：「这是须弥的兵。」听的人都低下了头。有个书吏揉了揉眼，以为自己看花了，再看一眼，还是那样。"
 SUM_GT_Aby_Black:"幽黑骤临"
 SUM_GT_Aby_Black_desc:"一个贤者两条腿一软，靠扶着柱子才没滑倒，失声叫道：「它……它不听使唤了！」漆黑的力气一勺一勺灌进新神身子。头天神还答话，第三天就慢了半拍，到第七天，任贤者怎么下令，它只把头缓缓转过来，两眼黑得望不见底。殿上众人这才回过味来：请来的这位，根本不认谁是自己人。"
 SUM_GT_Aby_Abyss:"委身渊薮"
 SUM_GT_Aby_Abyss_desc:"大贤者憋了许久，才吐出一句：「事到如今，只能硬着头皮走下去。」话音一落，满堂脸色尽白。教令院终究认了这桩祸事。议事厅里，一位贤者把窗户纸捅破：「咱们手里攥着的，早就不是能由咱做主的东西了。」四下里静悄悄的，没人接茬。窗外风大，把摊开的图吹落在地，也无人去拾。"
 SUM_GT_Iro_Decrees:"大贤颁令"
 SUM_GT_Iro_Decrees_desc:"大贤者的敕令如今不再经过议事厅。笔墨落定，直接发下去，六派首座到用印时才看见内容。有个首座问了一句：「这事，怎么不先议？」送文的人只笑不答。从此议事厅的门照开，人照坐，只是不议事。有个来开会的坐了半晌，没等到一句正经话，起身走了。"
 SUM_GT_Iro_Secret:"阴置缉曹"
 SUM_GT_Iro_Secret_desc:"暗探立了起来，不穿号衣，也不挂招牌。他们坐在茶摊上，蹲在巷口，把听来的话记在小本上。隔几日，报章上就有名字不见，先是小名家，后是大学者，空出来的地方留着白。茶客偶一抬头，见那蹲着的人正拿笔描，赶紧把话咽了回去。"
 SUM_GT_Iro_Censor:"颁禁焚书"
 SUM_GT_Iro_Censor_desc:"禁书令又扩了一回，这回连雨林的药草册子、沙漠的旧歌谣也一并禁了。查的人进村翻箱，翻出歌本就烧，火光映着墙。有个老妇人从火里抢出一页，塞进怀里，被推倒在地也没撒手，嘴里喊道：「这是俺娘教的歌！」"
 SUM_GT_Iro_Akasha:"虚空密伺"
 SUM_GT_Iro_Akasha_desc:"虚空终端改了口径，不再只往下发，也往上回。人说什么，它记什么，连梦话也一并收了去。有个人对着终端骂了一句，第二日就被叫去问话，回来时脸青着。从此街上人说话都压着嗓子，说话先抬头看一眼头顶，才敢张嘴。"
 SUM_GT_Iro_Mobilize:"举邦尽起"
 SUM_GT_Iro_Mobilize_desc:"征召令颁了下来，沙漠雨林一体抽丁。按户点名，三丁抽一，五丁抽二。村口老榕树下摆了张桌，桌后坐着书吏，念一个，走一个。送行的妇人不敢哭出声，只把干粮往儿子怀里塞，低声道：「活着回来。」那儿子点点头，没敢回头。"
 SUM_GT_Iro_Purge:"芟除异己"
 SUM_GT_Iro_Purge_desc:"「咋没人反对？」新来的实在憋不住，问出了口。旁边人朝隔壁那张空凳努了努嘴，他便不作声了。凡是反对造神计划的学者，一个个被清了出去：有的发配边地查水渠，有的忽然染了病，有的连夜把书房搬空。剩下的人再议事，到末了总是一片附和。六派的招牌还挂着，能发出的却只剩一个声音。"
 SUM_GT_Iro_Propaganda:"榜示院门"
 SUM_GT_Iro_Propaganda_desc:"教令院的告示糊满了城墙，一张压一张，糊到墙角。上头写的是同一句话：须弥从未如此强大。刷墙的匠人一边刷一边念，念熟了，回家也说给娃听。娃问强大是啥，匠人想了想，说道：「就是……不挨饿。」娃又问：「那咱从前呢？」匠人没答，把刷子往桶里一蘸。"
 SUM_GT_Iro_School:"课核士论"
 SUM_GT_Iro_School_desc:"「照上头的意思写。」同窗这么劝他。他依言改了口，转年便得了升迁。学院改了规矩，升迁先查你信什么，再看你会什么，每季填一张表，问的全是心思，不问本事。有个学生照实答，硬生生压了三年。升迁当日他请同窗吃酒，喝到半酣，却只顾闷头，没吐几句。"
 SUM_GT_Iro_Church:"尊学为国"
 SUM_GT_Iro_Church_desc:"教令院被立为国教，从此拜的是学院，念的是院规。草神的圣所被腾出来，神像挪到偏殿，正殿摆上课桌，一排一排。讲台就设在那座石座上。有个先生指着石座对学生说：「这里，原先是放供品的。」学生们面面相觑，谁也没敢接话。"
 SUM_GT_Iro_Army:"党卫为旅"
 SUM_GT_Iro_Army_desc:"教令院直属的军团成立了。誓词是新写的，不敬神，不敬国，只敬贤者。列队当日，三千人齐声念了一遍，声音撞在墙上又弹回来。有个老兵念到一半停了嘴，旁边人狠狠看他一眼，他赶紧接着念完，声音却小了下去。"
 SUM_GT_Iro_Fear:"以惧治民"
 SUM_GT_Iro_Fear_desc:"须弥如今是用恐惧管着的。街上看不见巡丁，可人人知道有人在看。孩子夜里做了梦，白天不敢讲，怕一句闲话顺进终端里去。久而久之，连梦也少了，夜里只听得风吹藤叶。教令院说这叫太平。有个老人夜里醒来，听听四下没声，反倒更不敢睡了。"
 SUM_GT_Iro_Total:"一人蔽日"
 SUM_GT_Iro_Total_desc:"教令院握住了须弥的每一根线。粮在它手，水在它手，路引在它手，连娶亲摆几桌也得先呈报。百姓自嘲说：「如今连喘气都有定数。」话是笑着说的，说完却都四下张了张，才敢散去。"
 SUM_GT_Iro_Eternal:"教令院不泯"
 SUM_GT_Iro_Eternal_desc:"教令院正式宣布，它的统治与须弥同在，永无期限。文告刻在石碑上，立在城门口，字口描了金。往来的客商看了，有的点头，有的绕道。石碑底下常有孩子坐着乘凉，坐着坐着就长大了。有个孩子拿石块在碑脚划了两道，被大人喝住，赶紧跑了。"
 SUM_GT_The_Throne_of_Gods:"营此神座"
 SUM_GT_The_Throne_of_Gods_desc:"人偶之神坐上王座，衣袍垂到阶下。教令院诸贤立在它身后，一字排开。这景象看着齐整，实则倒了个个儿：神受人令，学堂发令。须弥有了一个听得懂号令的神，和一所发号令的学堂。有个新来的官员看了半天，忽然觉着，跪着的才是真掌权的。"
 SUM_GT_Eternal_Regency:"教令院代秉"
 SUM_GT_Eternal_Regency_desc:"神是造出来了，可谁也没打算把权交给它。教令院发了一纸文告，说神尚年幼，诸事由学院以神之名摄理。这一摄，就没个尽头。神坐在殿上，一日说不上三句话。有一回它开口想说什么，旁边的贤者赶忙把话头接过，神便又不言语了。"

 SUM_Neo.188.t:"营此神座"
 SUM_Neo.188.d:"教令院的地下，藏着一间不为外人所知的密室，门禁森严，连打扫的人都蒙着眼进出。密室里摆着一具人偶的躯体，关节精巧，肌肤细腻，却始终少了一口气，静静地躺在石台上。这一日，几个贤者捧着一颗神之心下来，神色肃穆，围拢在石台四周，当众将它接进人偶的胸口。机关咔哒一声合拢，严丝合缝，人偶的眼珠微微转了转。须弥这是要在人手里造出一个神，替他们统治须弥。有贤者望着人偶，低声说，从今往后，须弥的命便系在这具躯壳上了。接心那夜，密室外三重岗哨，连贤者的随从也不许靠近，有人听见里头一声轻响，守夜的兵握紧了枪。自当日起，密室的钥匙分成两半，一半在阿扎尔袖中，一半在博尔吉亚箱里，谁也不全。"
 SUM_Neo.188.a:"加速造神的工序"
 SUM_Neo.188.b:"暂缓，先看住学院"
 SUM_Neo.189.t:"重铸神躯"
 SUM_Neo.189.d:"大贤者阿扎尔一纸令下，重启了尘封多年的造神计划。密室厚重的门被缓缓推开，积灰的档案一卷卷搬出来，摊在宽大的案上，灰扑扑的一大片。书记官连夜誊抄，烛火烧了半宿，蜡泪堆了一摊，手指都写酸了。那些图纸上画着人偶的构造，标注密密麻麻，看的人眼花缭乱。有年轻书记官看得心惊，壮着胆子问这当真要做成，莫不是疯了。老书记官赶紧嘘了一声，回头看了看重门，说休要乱问，这计划一旦启动，便再没有回头的路，你我都担待不起。有些门一旦推开，就再也关不上了。誊抄的图纸堆满三案，书记官轮班倒，茶水一夜添了十几回，交卷时人人眼窝深陷，却无一笔错漏。交卷次日，老书记官病了一场，梦里还在抄那密密麻麻的标注，家人听着都心惊。"
 SUM_Neo.189.a:"调集全部资源"
 SUM_Neo.189.b:"留一手，别赌上须弥"
 SUM_Neo.190.t:"攒成人形"
 SUM_Neo.190.d:"人偶的躯体被重新拼装，工匠们忙了整整一月，废寝忘食。关节处用上了赤王时代的零件，据说那是从一处古迹里挖出来的，坚硬异常，百年不坏，寻常铁匠见了都要咋舌。老工匠捧着那零件，对着光看了又看，赞不绝口，说这等物件，咱们如今竟造不出来，古人厉害。组装时，众人屏气凝神，一处关节一处关节地接，生怕差了分毫，错了半寸便前功尽弃。待最后一枚螺钉拧紧，人偶端端正正立在架上，仿佛活人一般。古人的手艺，了得。接毕当日，匠师们退到廊下，对那具躯壳拜了三拜，说这是祖师爷传下的规矩。那三拜拜得极慢，起身后无人说话，各自收拾工具，脚步声在廊下响成一片。廊下的脚步声里，谁也没提那一拜之后的事，各自散去，当晚工坊提早熄了灯。有个年轻匠人问首领，这三拜拜的是甚么，首领道：「拜的是手艺，也是造孽。」问的人低下头，不敢再问。"
 SUM_Neo.190.a:"让新神更快睁眼"
 SUM_Neo.190.b:"把风险压在柜子里"
 SUM_Neo.191.t:"魂寄木人"
 SUM_Neo.191.d:"那颗神之心终被稳稳装进人偶的胸腔，四下里静得能听见针落。贤者们围拢来，屏住呼吸，一个个瞪大了眼。只听胸腔里似有搏动之声，一下，又一下，渐渐均匀起来，仿佛真有一颗心在跳。人偶的肤色也渐渐有了血色，从苍白转为温润，连指甲都泛起淡淡的粉。有个贤者伸手探了探，惊呼竟有心跳，声音都变了调。众人这才信了，原来这造神之术，真的成了。大贤者阿扎尔看着，嘴角露出一丝笑意，仿佛看见了须弥的未来。神之心一入，凡物便有了神性。散会时众人脚步都轻了，谁也不敢在它面前大声说话，连咳一声都要侧过身去。散会路上，有两个贤者险些撞在廊柱上，只因眼睛只顾盯着自己的鞋尖。自当日起，议事厅的门槛被人磨矮了一截，进出的人都放轻了脚步。有个书记官忘了带簿子，急得在廊下打转，同僚递他半页废纸，他如获至宝。"
 SUM_Neo.191.a:"加速造神的工序"
 SUM_Neo.191.b:"暂缓，先看住学院"
 SUM_Neo.192.t:"幽窟试所"
 SUM_Neo.192.d:"这造神的试验，是在沙丘之下暗中进行的，外人一概不知。地面上照常风沙呼啸，看不出半点异样，地下却建起一座工坊，灯火通明，机杼之声不绝于耳。参与试验的受试者名单被严严实实封存，装进一只铁匣，钥匙由大贤者阿扎尔亲自掌管，旁人碰不得。有人壮起胆子问起那些受试者的下落，管事的只推说不知道，脸一沉再不开口，问的人只好讪讪退下。工坊深处，不时有奇怪的声响传出，听的人心里发毛，夜里做噩梦。这等事情，终究见不得天日。工坊外的巷子里，夜里有人泼水，第二天早上总是结了一层薄冰，也没人问缘由。问事的人也学乖了，再去只站在巷口张一眼，张完便走，一步不多留。巷口张一眼的人多了，那家便在门口挂了块布帘，帘子一挂，张望的也省了。帘子挂上之后，那家当夜搬去了亲戚处，只留个老仆看门，说是家中有人养病。"
 SUM_Neo.192.a:"调集全部资源"
 SUM_Neo.192.b:"留一手，别赌上须弥"
 SUM_Neo.193.t:"以神髓注"
 SUM_Neo.193.d:"神性被一点一点灌进人偶的躯体，一丝一缕，都要算得分明。贤者们轮番值守，日夜不停地催动机关，不敢有半分懈怠。起初人偶纹丝不动，如同死物，众人心里都打鼓。到了第三日深夜，手指忽然轻轻动了一下。守在旁边的书记官以为是眼花，揉了揉眼再看，那手指果然又缓缓动了。他惊得叫出声来，众人一齐围拢，屏息凝视。只见那人偶的手指屈伸自如，仿佛有了知觉，连指尖的纹路都透着活气。这一动，便是神性成了的凭据。有个胆小的书记官当场吓晕过去，被人抬出去时手里还死死攥着那半卷图纸。图纸后来裱了起来，挂在工坊正壁，落款处留了一行小字，无人署名。无人署名的小字后来被识出来，是匠师首领的笔迹，众人问起，他只说写错了。首领后来把那小字涂了，重新题了四个大字：慎始敬终。"
 SUM_Neo.193.a:"让新神更快睁眼"
 SUM_Neo.193.b:"把风险压在柜子里"
 SUM_Neo.194.t:"识海奔涌"
 SUM_Neo.194.d:"虚空终端把天下知识一股脑灌进人偶的脑中，不分门类，不问深浅。无数卷书籍、无数条见闻，顺着无形的管道源源不断涌进去，快得让人目眩，连在一旁看着的人都觉得脑袋发涨。人偶缓缓睁开眼，眸子里似有流光转动，仿佛有星辰在内里闪烁。众人屏息等着，不知它开口第一句会说些什么，是惊天动地的箴言，还是古怪难懂的咒语。良久，人偶才缓缓吐出两个字，须弥。原来它学会的第一句话，便是这个国家的名字。这第一句话，倒也有些意思。在场的书记官把它一笔一笔录进档册，档册的封皮上，写的是第一言三字。档册的锁钥由三人分掌，开册须三人同到，少一个也不开。三人同到开册的规矩执行了一季，后来只改了三人轮值，册却再没人敢单独碰。有个轮值的头一日便开了小差，被同僚告发，罚了半月俸，自此再无人敢旷。"
 SUM_Neo.194.a:"加速造神的工序"
 SUM_Neo.194.b:"暂缓，先看住学院"
 SUM_Neo.195.t:"机关为神"
 SUM_Neo.195.d:"人偶终于站了起来，稳稳当当，落在众人面前。它立在殿中，身姿挺拔，气度非凡，比任何一位贤者都更像神，仿佛天生便该受供奉。贤者们立在它面前，不由自主地矮了三分，连语气都轻了。它缓缓走动，每一步都稳稳当当，衣袂无风自动，是威严逼人。有个年轻贤者望着它，竟生出膜拜之心，扑通跪了下去，额头贴地，旁人也跟着要跪。相由心生，这人偶既有了神性，便自然带着一股迫人的威压。那跪下的年轻贤者后来被同僚扶起，回到家中便病了一场，逢人只说是着了凉。他病好之后辞了职，回家种田去了，临行把官袍叠得整整齐齐，留在案上。有个卖菜的老儿挤在人丛后头，踮脚张了一回，啐道：「威风，可惜不是正经人！」话未落音，便被人捂了嘴，拖出殿外去了。众人看它走得两遭，胆大的凑近了看，胆小的只把头缩在帽子里。"
 SUM_Neo.195.a:"调集全部资源"
 SUM_Neo.195.b:"留一手，别赌上须弥"
 SUM_Neo.196.t:"铸此完偶"
 SUM_Neo.196.d:"人偶的躯体被调到十全十美，每一处关节、每一寸肌肤，都找不出半点瑕疵，连一根汗毛都安放得恰到好处。教令院那些贤者围着看了又看，交口称赞，谁也不肯说它只是个机械，说了仿佛便是亵渎。有人说它是神，有人说它是须弥的新希望，却没人敢提一个造字。大贤者阿扎尔更是绝口不提机械两个字，只郑重地称它为新生的神明，神色敬畏，仿佛连他自己也信了。到了这份上，假亦真，真亦假，谁还分得清。连伙房的杂役都知道，给那上头备饭的案子要擦三遍，擦不干净是要挨鞭子的。那杂役擦完案子，还对着空案作了个揖，做惯了，倒忘了上头原本没有人。那杂役作揖的案子，后来换了新人擦，新来的见了也照旧作揖，无人教他。管事的每日擦完，还要对着案面验三遍光，验得照得出人影，方才歇手。"
 SUM_Neo.196.a:"让新神更快睁眼"
 SUM_Neo.196.b:"把风险压在柜子里"
 SUM_Neo.197.t:"盛陈降神"
 SUM_Neo.197.d:"降神仪式在净善宫前隆重举行，六大学派尽数到场，黑压压站了一片，连屋檐上都趴着人，来晚的只能踮脚。祭坛上香烟缭绕，乐声齐鸣，鼓擂得震天响，震得人心头发颤。人偶端坐其上，纹丝不动，宝相庄严。六派首座依次上前行礼，神色恭谨，不敢有半点马虎，一个接一个，规规矩矩。有旁观的老者低声对孙子说，这阵仗，比当年迎神还要热闹几分。孙子仰着脖子问，那当真是神么。老者摇摇头，又赶紧摆摆手，没敢答话。这场面做足了，是神非神，反倒没人敢深究。街面上的说书人也添了新词，只拣体面的话说，说到神字时，声音总要压低三分。有说书人夜里回家，把新词改了两处才睡，第二天再上台，一字不差。听书的人多了，退场时脚步也轻，仿佛台下坐久了，人人都沾了三分规矩。这规矩传开，连巷口卖梨的都知道了，称梨时都小声些。"
 SUM_Neo.197.a:"加速造神的工序"
 SUM_Neo.197.b:"暂缓，先看住学院"
 SUM_Neo.198.t:"神瞳初启"
 SUM_Neo.198.d:"新神缓缓睁开双眼，目光扫过殿前众人，那目光淡淡扫过，却叫人心里发紧。它看的第一样东西，便是那跪了一地的贤者们。六派首座伏在地上，额头贴着冰凉的石板，连大气也不敢出，生怕惊扰了什么。新神看了片刻，似乎有些疑惑，竟歪了歪头，打量着这些人。有个贤者膝行上前，高声颂词，声音都在发抖，念得磕磕巴巴。造神的人，到头来反倒跪在了自己造的神面前，是造化弄人。颂词念毕，殿中静得能听见烛芯爆响，那人偶不发一言，众人跪了足足一炷香。自当日后，殿前的地砖磨出了一片亮光，跪的人多了，砖也跪得出来。殿前那片亮光日日有人擦拭，说是圣迹，擦的人心里明白，那不过是砖。有个新来的守殿小吏，头一遭见这般场面，腿一软也跟着跪了，起身后膝盖肿了三日。"
 SUM_Neo.198.a:"调集全部资源"
 SUM_Neo.198.b:"留一手，别赌上须弥"
 SUM_Neo.199.t:"伪神立号"
 SUM_Neo.199.d:"贤者们聚在一处，为新神商议名号。这个说要显威严，那个说要示仁德，还有的要讨个吉利，七嘴八舌，争了半日也没定下来，脸都争红了。末了还是大贤者阿扎尔一锤定音，说这名字里，既要有赤王，也要有教令院，如此方能承古开今，让天下人记住这份基业。众人听了，齐声叫好，再无异议，先前争得凶的也不做声了。书记官铺开纸笔，郑重写在册上，一笔一画不敢潦草。取名这件事，看似小事，实则定下了名分。名册用金线装订，供在净善宫的案上，往后每逢大事，都要在册前宣读一遍。册前宣读时，读的人须净手焚香，读错一字，便要重头再读。有一回读错一字，读的人自请领罚，跪读三遍，自此册前再无人错一字。宣读毕，册归原匣，匣上一把黄铜锁，锁匙挂在草神腰间，走路时叮当作响。"
 SUM_Neo.199.a:"让新神更快睁眼"
 SUM_Neo.199.b:"把风险压在柜子里"
 SUM_Neo.200.t:"奉神践祚"
 SUM_Neo.200.d:"新神登基大典在净善宫举行，礼乐齐鸣，百官朝贺，一个挨一个，排得满满当当。新神端坐神位，接受众人膜拜，神态安然，仿佛本就该坐在这位置上。而净善宫里供奉的旧神，则被恭恭敬敬地请了下来，移到偏殿去了，连蛛网都一同拂去。有老臣望着旧神被抬走，眼中闪过一丝复杂的神色，张了张嘴，终于什么也没说，只把头低下。一朝天子一朝臣，神位也有新旧更替，世间之事，大抵如此。旧神像抬出宫门时，天上正过一阵风，吹得幡布哗哗响，众人都不敢抬头。风过之后，抬像的人谁也没说话，只把绳子又紧了紧，走得更快了。走得更快的那队人，后来把绳子换成了铁链，说风吹幡布，看着不肃穆。有个守门的老卒，看那像出了门，对着背影拱了拱手，算是送旧主最后一程。"
 SUM_Neo.200.a:"加速造神的工序"
 SUM_Neo.200.b:"暂缓，先看住学院"
 SUM_Neo.201.t:"伪神既成"
 SUM_Neo.201.d:"净善宫深处，那具以机核为骨、以神之心为魂的人偶，终于在无数符文次第亮起时睁开了双眼。这一日教令院六派首座齐齐列在阶下，人人屏住呼吸，连咳嗽都不敢出声。大贤者阿扎尔亲手将一面指令牌捧上前去，牌上纹路纵横，像极了一副缰绳。他口念一声醒来，那神偶果真应声，缓缓转过脖颈，目光扫过众人。目光落到谁身上，谁便不由自主矮了半截，膝盖竟有些发软。有个老学者后来在酒桌边私下说，那眼神不像是在看人，倒像是在看一件等着摆放的器物，看得人脊背发凉。旁边的人忙掩住他的嘴，不敢让他再说下去，只怕隔墙有耳。从此须弥便有了一位能工巧匠造出来的神，唤之即来，挥之即去。宫里的灯自当日起就没熄过，守夜的更夫换了三班，谁也不知道里头在忙些甚么。更夫交接时只递一句话：「里头无动静。」除此之外，再无第二句。"
 SUM_Neo.201.a:"调集全部资源"
 SUM_Neo.201.b:"留一手，别赌上须弥"
 SUM_Neo.202.t:"赤王旧魂"
 SUM_Neo.202.d:"教令院的藏书阁里，贤者们连日翻检，从一卷发黄的残简中抠出了赤王旧日的记忆。那记忆被抄在莎草纸上，字迹被风沙啃得残缺，却仍看得出当年的排场。旧事里说赤王曾统率沙海诸部，建起黄金的城池，连天上的星辰都要听他号令。贤者们你传我、我传你，把这几页纸捧得比什么都金贵，逢人便说：这才是须弥更早的骄傲，比那锁在宫里的草神体面得多。有个年轻学生听得入神，追问那记忆里有没有普通人的影子，贤者却把脸一沉，说他问的不是该问的。众人便都低下头去，只管抄写那几行字。闲话休提，自此赤王之名在须弥城中日盛一日。那残简被供在案上，每日有人轮流看守，生怕再被风沙啃去一个字，看得比自己的性命还重。"
 SUM_Neo.202.a:"让新神更快睁眼"
 SUM_Neo.202.b:"把风险压在柜子里"
 SUM_Neo.203.t:"列柱沙原"
 SUM_Neo.203.d:"列柱沙原上，风埋了不知多少年的旧石柱，这一日被匠人们一根根刨了出来。那些柱子东倒西歪，柱身上的古文字被沙磨得浅了，工匠却偏要在这残破之上再刻新字。新刻的都是颂词，一字一句都在夸赞赤王的功业，说什么沙海因他而生光，星辰因他而失色。刻字的匠人蹲在滚烫的石头上，一笔一划地描，汗水滴进石缝里，转眼就被吸干。有个年老石匠低声嘀咕，说这些柱子当年立的并不是这个意思，话音未落就被工头喝住，叫他少惹口舌。列柱重新立起当日，远远望去，一排排石柱直插天际，倒真有几分王都的气象。有孩童拾起掉落的石屑，在沙地上照样描画，描完便被大人喝止，说这石头上的字不是小孩子能碰的。有胆大的夜里点灯去拓字，拓完回家便病，家人只当是着了凉，请郎中吃了三副药。拓字的人病好后，那盏灯便收了，家里人从此夜里把他的房门反锁。"
 SUM_Neo.203.a:"加速造神的工序"
 SUM_Neo.203.b:"暂缓，先看住学院"
 SUM_Neo.204.t:"居尔城重光"
 SUM_Neo.204.d:"居尔城废了多年，断壁残垣间尽是黄沙，忽有一日来了大批人马，说是要在此地重起城墙。那些工匠先在沙里刨出旧日的墙基，再把新烧的砖一块块垒上去。新砖与旧石颜色不同，远远看去，倒像是一条灰黄相间的伤疤。有个老驼夫路过，停下脚步看了半晌，说这城墙他小时候就见过塌掉的样子，如今竟又立起来了，只是不知道住在里头的人还是不是从前那批。旁边的兵士喝令他快走，说此地不许闲人逗留。驼夫只得牵着骆驼离开，走出老远还回头张望。不多时日，居尔城果然又有了城墙的模样，只是城门紧闭，进出的都是佩刀的兵。新砖是城外窑里赶烧出来的，窑工日夜守着火，烧坏一窑便要赔上几个月的工钱，因此夜里窑火映得半边天都红了。"
 SUM_Neo.204.a:"调集全部资源"
 SUM_Neo.204.b:"留一手，别赌上须弥"
 SUM_Neo.205.t:"赤王之徒"
 SUM_Neo.205.d:"沙漠里那些赤王的旧信徒，原本东一伙西一伙，各自守着一处残破的祭坛。这一日教令院派人前来，说新神已然降世，凡信奉赤王者皆可入教令院供职。那些信徒起初不肯，说自己拜的是赤王，不是什么人偶。来人只淡淡说了一句：人偶里头住的，正是赤王的魂。众人听了这话，面面相觑，终究跪下领了祭司的服饰。有个白发老祭司抱着旧祭坛上的香灰，迟迟不肯换上新袍，嘴里念叨着赤王从不用人替他说话。旁边的人劝他莫要说这些旧话，当心被当作异端。老祭司长叹一声，到底还是把新袍披上了。新祭司们学着人偶的模样，每日定时跪拜，连跪拜的时辰都有人敲钟提醒，错了一刻便要受罚。那白发老祭司跪在最后头，膝盖疼得发麻，却不敢起身。"
 SUM_Neo.205.a:"让新神更快睁眼"
 SUM_Neo.205.b:"把风险压在柜子里"
 SUM_Neo.206.t:"金沙幻梦"
 SUM_Neo.206.d:"须弥城里，近来茶楼酒肆最爱讲一个旧梦，说是赤王治下的黄金时代，沙海遍地黄金，夜夜笙歌，人人都不愁吃喝。这梦原是贤者们从旧卷里翻出来的，本没几个人当真，可讲的人多了，听的人也就信了。有个说书人在台上讲得眉飞色舞，台下有个从沙漠来的行商却冷笑一声，说他祖父说过，其时的沙民连水都喝不上，哪来的遍地黄金。四座一听，都把这行商瞪住，说他是故意扫兴。行商也不争辩，低头喝完碗里的茶，起身走了。说书人清了清嗓子，又把那梦讲了一遍，众人听得连连点头。说书人得了赏钱，越发来了精神，把黄金时代说得天花乱坠，连沙里长出的草都说是金的。听的人越聚越多，把茶楼挤得水泄不通，掌柜的笑得合不拢嘴。"
 SUM_Neo.206.a:"加速造神的工序"
 SUM_Neo.206.b:"暂缓，先看住学院"
 SUM_Neo.207.t:"幽穴有声"
 SUM_Neo.207.d:"沙漠深处，有一处被风沙半掩的旧洞窟，近来常有奇怪的声响从中传出。那声音嗡嗡然，似人语又非人语，听久了竟像是有人在念叨什么。有几个胆大的商队循声而去，蹲在洞口听了半宿，回来便到处宣扬，说这是赤王显灵，留下的神谕。消息传到教令院，贤者们大喜，立刻派人前去记录，把那声响一字不差地抄下来，奉为圭臬。有个随行的工匠却说，那声音他小时候在别处也听过，分明是风吹过中空石柱的动静，哪里是什么神谕。这话被队长听见，当场呵斥，叫他不得胡言。工匠便闭了嘴，只是抄写的人依旧一笔一划，把风声当成了天书。抄写的人抄了满满一纸，末尾还郑重地盖上教令院的印，说这便是赤王留下的真神谕，谁敢不信便是欺君。"
 SUM_Neo.207.a:"调集全部资源"
 SUM_Neo.207.b:"留一手，别赌上须弥"
 SUM_Neo.208.t:"沙际遗响"
 SUM_Neo.208.d:"那一声残响传开之后，沙漠里便起了流言，说赤王要回来了。这流言先是三三两两的人在篝火边低声传说，后来竟越传越广，连绿洲里的孩子都会唱：赤王归来，沙海生辉。传话的人各添各的油醋，有的说亲眼看见了王旗，有的说听见了战鼓，还有的说赤王已经站在了沙丘之巅。有个老驼工听得不耐烦，说自己走南闯北几十年，从没见过哪个王真从沙里爬回来，眼下倒好，满沙漠都是王了。众人听了只是笑，谁也不肯信他的。不多几日，这话竟传进了须弥城，连教令院的书吏都开始在本子上记。须弥城的书吏把这几句话记进公文，还添上一笔说沙漠民心可用，值得趁势安抚。大贤者阿扎尔看了微微一笑，说不必安抚，等着便是，赤王自己会回来。"
 SUM_Neo.208.a:"让新神更快睁眼"
 SUM_Neo.208.b:"把风险压在柜子里"
 SUM_Neo.209.t:"长存之洲"
 SUM_Neo.209.d:"是日黄昏，沙海上空忽然现出一片奇景，但见楼台亭榭、清泉绿树，悬在半空之中，隐隐约约，如梦如幻。那正是传说里永恒绿洲的模样，多少沙民做梦都想见到的地方。消息传开，远近的人都跑到沙丘上仰望，有人当场跪下磕头，说这是赤王开的门，接他回绿洲去。有几个年轻后生按捺不住，牵着骆驼就往幻象的方向走，要说上一探究竟，结果越走越远，脚下的沙子越发烫人，幻象却始终悬在前头，可望而不可即。待到日落，幻象便散了，什么也没有留下。老人们说，那是海市蜃楼，可年轻人不肯听，只说赤王在天上等着他们。有个妇人抱着孩子指着幻象说，那就是咱们该去的地方，孩子却只顾哭，说肚子饿。妇人摸了摸空水囊，没再说话。"
 SUM_Neo.209.a:"加速造神的工序"
 SUM_Neo.209.b:"暂缓，先看住学院"
 SUM_Neo.210.t:"沙海称孤"
 SUM_Neo.210.d:"那具新造的神偶立在居尔城的高台之上，开口说了第一句话，便自称是沙中之王的继承者。此言一出，台下众人先是寂静，继而欢呼，那些赤王的旧信徒更是激动得热泪盈眶，说赤王果然没有抛下他们。大贤者阿扎尔站在台侧，微微点头，显然对这说法十分中意。可有个从阿如村来的长者却皱起眉头，他见过真正从沙漠里走出来的王是什么模样，哪里会站在一座高台上靠人递话。他把这话说给旁边的人听，那人吓得赶紧捂住他的嘴，说这话若被听见，是要掉脑袋的。长者冷笑一声，到底把话咽了回去。台下欢呼一浪高过一浪，有人跪地叩头，说等这天等了半辈子。神偶却直挺挺立着，连眼皮都不抬，仿佛台下跪的不是人，是一片麦子。"
 SUM_Neo.210.a:"调集全部资源"
 SUM_Neo.210.b:"留一手，别赌上须弥"
 SUM_Neo.211.t:"赤王总戎"
 SUM_Neo.211.d:"赤王的名头一亮出来，沙漠里的佣兵们便纷纷聚拢，原来散在各处的枪手、驼客、刀客，如今都打起了赤王军团的旗号。这些佣兵原本只为摩拉卖命，谁给钱多就给谁办事，如今却说自己是王师，要为赤王打天下。领头的头目把队伍召集起来，训话说：从前咱们为钱而战，如今为神而战，这是天大的体面。底下有人高声应和，也有人悄悄撇嘴，说换了旗号，粮饷却不见多。有个老佣兵把枪擦了又擦，擦完却叹了口气，说打了一辈子仗，从没见哪支军队不发军饷还能打仗的。旁边的人叫他住口，说如今是给神卖命，谈钱俗气。头目又宣布，凡入团者先发一把新枪，粮饷按旧例减半，说是为神尽忠，本就该勒紧裤带。有个老兵当场把枪往地上一戳，说道：「枪是好枪，饭是冷饭，这忠字写来不易。」说罢竟被拖了下去。后来团里发饷，当众唱名领钱，谁多问一句饷银几何，便多站一个时辰的岗。"
 SUM_Neo.211.a:"让新神更快睁眼"
 SUM_Neo.211.b:"把风险压在柜子里"
 SUM_Neo.212.t:"大狱将临"
 SUM_Neo.212.d:"教令院忽然传出话来，说要定一个审判之日，把多年积压的旧账一笔笔清算。这道命令一下，须弥城里顿时人心惶惶，昔日里得过好处的人，如今都怕被翻出旧账。书吏们抱着一摞摞卷宗，从早翻到晚，把陈年旧事都翻了出来，谁在哪一年说过什么话，谁在哪一日办过什么事，记得比当事人还清楚。有个官员平日里作威作福，这一日听见风声，吓得连夜把自家的账本烧了，结果烧出的烟被巡夜的人瞧见，反倒坐实了罪名。审判之日定在下月初一，届时六派首座都要到场，人人都说这一场审判下来，须弥城怕是要去掉一层皮。被点了名的，有的连夜逃出城，有的四处托人说情，还有的反咬旁人一口。教令院门前整日车马不断，人人脸上都写着慌张。"
 SUM_Neo.212.a:"加速造神的工序"
 SUM_Neo.212.b:"暂缓，先看住学院"
 SUM_Neo.213.t:"赤王复起"
 SUM_Neo.213.d:"教令院的贤者们一改往日口径，公然宣称赤王已然归来，就附在那具人偶的神身之上。这话原是有人不信的，可贤者们摆出种种证据，说人偶睁眼的是日，正是赤王归来的时辰，连天象都对得上。于是乎，半信半疑的人也渐渐信了。有个老贤者在讲坛上说得起劲，说赤王当年不过是用了一具凡人的身子，如今这神偶比那身子结实百倍，正是天意。台下有个年轻学生忍不住站起来问，既然赤王归来，为何不肯开口说一句旧部都懂的暗语。老贤者面色一沉，说这是天机不可泄露，喝令他坐下。那学生涨红了脸，到底没敢再问。老贤者讲完，抬手指着人偶说，诸位看那神色，岂不正是赤王再世？众人望去，那神偶面无表情，可谁也不敢说半个不字。"
 SUM_Neo.213.a:"调集全部资源"
 SUM_Neo.213.b:"留一手，别赌上须弥"
 SUM_Neo.214.t:"筑座于沙"
 SUM_Neo.214.d:"居尔城中新起了一座王座，据说是以赤王的旧座为样，用黄金与黑石铸成，高高立在大殿正中。那王座落成之日，教令院六派首座齐齐入殿朝拜，口称沙中之王。从此须弥的旧神便渐渐无人提起，净善宫的大门紧闭，门前冷落得长出了草。有个曾给草神送过饭的老侍从路过，看见那宫门上的铜环都生了锈，忍不住红了眼眶，却被新来的守卫喝令走开，说这里是禁地，不许闲人靠近。老侍从只好转身离去，一边走一边摇头。旁人问他为何叹息，他只说天气太干，迷了眼睛。殿外的广场上，旧的草神像早被人搬走，不知扔到了哪个角落。有几个念旧的老百姓偷偷在墙角摆上一束干花，第二日便被人扫得干干净净，连花瓣都没剩下。那扫地的也不言语，只是扫完把笤帚立在那墙角，像给谁留了个位置。有人夜里又去摆花，摆完蹲在暗处看，看那扫地的一早果然又来。"
 SUM_Neo.214.a:"让新神更快睁眼"
 SUM_Neo.214.b:"把风险压在柜子里"
 SUM_Neo.215.t:"多托雷叩关"
 SUM_Neo.215.d:"是日，须弥城外来了几辆样式古怪的车，车上下来一位披着白袍的人，正是愚人众的第二席多托雷。教令院早早得了消息，六派首座亲自出城迎接，礼数周到得前所未有。多托雷下车也不寒暄，只抬眼把须弥城打量了一遍，说这座城建在树底下，倒也别有风味。入席之后，他并不怎么吃酒，只问教令院要人、要地方、要材料，件件都直指要害。陪席的贤者面上赔笑，心里却发凉，只觉这人像个走路的刀锋，锋芒都藏在笑里。有个年轻学者说了句什么，多托雷微微一笑，那学者便再也说不出话来。席间有个贤者问起至冬来意，多托雷把酒杯往桌上一顿，说须弥要什么只管开口，至冬要什么却由不得须弥说不。满座都觉这话里带着刀。"
 SUM_Neo.215.a:"加速造神的工序"
 SUM_Neo.215.b:"暂缓，先看住学院"
 SUM_Neo.216.t:"愚人众结契"
 SUM_Neo.216.d:"须弥与至冬的协定，终于在教令院的大厅里签下。那协定的正文写得冠冕堂皇，说什么互通有无、共谋福祉，可翻到页边，却有一行手写的小字，墨色与正文不同，写得潦草又急切。有好事的书吏偷偷辨认，那行字写的是：人偶归我，图纸归你，算力各半。众人看了这行字，才明白所谓的协定，原来是拿须弥的神明去换至冬的机器。有个老成持重的首座想说些什么，一看那行小字下头压着的印章，便把话咽了回去，只在心里暗暗叫苦。协定签罢，至冬的马车便一辆接一辆地开进了须弥城。签字的笔是至冬人带来的，笔尖蘸的墨也格外黑，落在纸上竟像钉子钉进去一般。老首座看着那墨迹，心里暗想这一笔下去，须弥往后怕是要看至冬人的脸色过日子了。"
 SUM_Neo.216.a:"调集全部资源"
 SUM_Neo.216.b:"留一手，别赌上须弥"
 SUM_Neo.217.t:"幽窟试术"
 SUM_Neo.217.d:"须弥城下，原本就有些废弃的地窖，这一日忽被教令院征了去，说是要扩建为地下实验室。工匠们先把地窖挖深，又向沙丘的方向掘出一条长长的甬道，甬道尽头连着一处天然洞窟，幽深不见底。为了不让外人察觉，洞口用石板盖住，上面还铺了沙，种了几丛耐旱的草。有个挖洞的工匠不小心挖偏了方向，掘出一具不知哪个年月的枯骨，工头立刻叫人把枯骨埋了，禁止声张。那工匠心里发毛，夜里做梦都梦见那枯骨在敲门。没过几日，洞窟里便传出低低的嗡鸣，昼夜不息，守在洞口的人说那声音像极了活人的呼吸。为了遮人耳目，地面上依旧种着草、搭着棚，看上去像处货栈，谁也想不到脚下竟藏着这么大一个洞窟。货栈的账房每日照旧进出，账本做得漂漂亮亮，其实一页页都是空话。货栈外添了两名脚夫，整日坐在门口打草鞋，眼睛却盯着过路的人。"
 SUM_Neo.217.a:"让新神更快睁眼"
 SUM_Neo.217.b:"把风险压在柜子里"
 SUM_Neo.218.t:"畸人著籍"
 SUM_Neo.218.d:"地下实验室里，试验体的名册一日长似一日，起初不过寥寥数人，后来竟密密麻麻写满了好几页。这些试验体多数是被流放的沙民，有的犯了罪，有的不过是欠了债，还有的仅仅因为说错了话，便被抓来这里。名册上写着编号，却不写姓名，仿佛人一旦进了这里，便不再是从前那个人。有个书吏负责登记，一日登记到一个熟悉的名字，那是他小时候的邻居，他手一抖，笔尖在纸上戳出一个墨点。主管叫他划掉重写，他不敢违抗，便把那名字改成了编号。从此他每夜都睡不踏实，总觉得那名字在纸上看着他。那些被划去的名字，没有一个家里收到过通知，亲人只当是自家人犯了事、不肯回来，依旧日日到门口张望。有个书记官誊到一半手抖起来，墨滴在纸上，他慌忙用指头去抹，越抹越黑。那书记官后来换了差事，临走把那册子推给继任的，手一松，像卸了千斤担。"
 SUM_Neo.218.a:"加速造神的工序"
 SUM_Neo.218.b:"暂缓，先看住学院"
 SUM_Neo.219.t:"鬻知为市"
 SUM_Neo.219.d:"教令院近来想通了一桩事，知识原是可以拿来换钱的。他们把珍藏多年的学问一卷卷搬到台面上，拿去与至冬人交易，换回了一卷卷机械的图纸。那些图纸上画的玩意儿，须弥的学者见都没见过，什么自动的机关、会走的兵偶，画得精密无比。有个老派的学者抱着自家的旧书，痛心疾首地说这是把传家的宝贝拿去换了块废铁，可旁边的年轻人却眼睛发亮，只顾着翻看那些图纸，嘴里啧啧称奇。老学者摇头苦笑，说等你们明白过来，怕是连后悔都来不及了。年轻人哪里肯听，只当他是老糊涂。交易一日接着一日，须弥的旧书一车车运出去，至冬的图纸一车车运进来。老学者抱着最后几卷不忍出手，终究被人从怀里抽走。至冬的商人验货时拿放大镜一页页照，验完只付半价，还说是看在同教的情分上。最后几卷运走当日，老学者站在巷口看着，车辙压过的地方，积了半尺黄土。"
 SUM_Neo.219.a:"调集全部资源"
 SUM_Neo.219.b:"留一手，别赌上须弥"
 SUM_Neo.220.t:"铸成机关"
 SUM_Neo.220.d:"须弥城外的厂房里，新造的机械造物一批接一批地从流水线上走下来。那流水线是至冬人设计的，工人只需站在旁边上发条、装零件，一件件铁疙瘩便自己动了起来，走起路来咔咔作响。第一批造出来的机器还没来得及验看，便被直接送进了营寨。营里的士兵头一回见这东西，都围上来瞧热闹，有个胆大的伸手去摸，被长官一巴掌打开，说这玩意力气大得能捏碎人骨头，莫要乱碰。那机器却像听懂了似的，忽然转过头来，两只铁眼直勾勾地盯着众人，看得士兵汗毛倒竖。营中自此添了新规：每日要给它们上油、紧螺丝，油是沙漠里榨的，装在一只旧铜壶里，一个不慎便夹伤了手。有个新兵夜里给机器上油，多看了两眼那双眼睛，回营便发起高烧。新规又添一条：上油时不得与它对视，违者禁足三日。"
 SUM_Neo.220.a:"让新神更快睁眼"
 SUM_Neo.220.b:"把风险压在柜子里"
 SUM_Neo.221.t:"工坊量产"
 SUM_Neo.221.d:"须弥城外的工厂，自从开工之后便昼夜不停，炉火映红了半边天，烟囱里冒出的黑烟把天空都蒙上了一层灰。从前须弥的天空是何等清亮，站在高塔上能望见远处的沙丘，如今却灰蒙蒙一片，连太阳都成了个模糊的盘子。城里的百姓起初还抱怨，说这烟呛得人咳嗽，晾在院子里的衣裳都落了一层黑灰，可抱怨了几日也就惯了。有个老园丁守着自家的花园，眼看着花叶上积了灰，怎么洗也洗不干净，急得直跺脚，说这哪里是建工厂，分明是在埋葬须弥。旁边的人劝他小声些，当心被当作反对新政的嫌疑。城里的孩子从没见过这样的天，放学路上都捂着口鼻，咳嗽声此起彼伏。有个母亲把孩子关在家里，不让他出去玩，孩子趴在窗口望着灰蒙蒙的天，问娘，太阳去哪儿了。"
 SUM_Neo.221.a:"加速造神的工序"
 SUM_Neo.221.b:"暂缓，先看住学院"
 SUM_Neo.222.t:"傀偶充刃"
 SUM_Neo.222.d:"众人偶兵器列装之后，须弥的军营里便添了一桩怪事。这些人偶与真人一般无二，会走路、会说话，甚至会讲笑话，混在士兵堆里，竟分不出哪个是人、哪个是偶。起先大家还觉得新鲜，渐渐的却怕了起来。有个士兵夜里站岗，看见同伴一动不动地立在那里，眼睛一眨不眨，便壮着胆子问了一句口令，那同伴却答得分毫不差，只是声音里没有一丝活人的热气。士兵吓得枪都掉了。后来营寨里订下规矩，人人都要在手腕上系一根红绳，绳是沙民手搓的，染料来自沙漠的石子，没有红绳的便是人偶。可没过几日，红绳也能仿造了，士兵们便连自己都信不过了。后来连睡觉都不敢睡实，士兵们轮流值夜，眼睛盯着身边人的手腕，生怕身边躺着的，是那个白日里还跟自己说笑的伙伴。有人说这日子过得比打仗还累。"
 SUM_Neo.222.a:"调集全部资源"
 SUM_Neo.222.b:"留一手，别赌上须弥"
 SUM_Neo.223.t:"独力敌众"
 SUM_Neo.223.d:"多托雷到了须弥之后，城里便常常见到他的身影，有时在街角，有时在酒肆，有时又在教令院的廊下。起初人们以为他分身乏术，后来才知道，这人把自己切成了好几片，每一片都是他，每一片又都只记得自己的一部分。于是乎，同一个多托雷，上午在这条街上对人笑，下午又在另一条街上把人吓得魂飞魄散。有个酒保自称认得他，说他来喝酒从不付钱，另一个酒保却说胡说，他明明每次都付得比谁都爽快。两人争得面红耳赤，最后却发现，他们说的竟是同一个人的不同切片。从此须弥城里的人见了白袍的身影，都绕着走，生怕打了招呼却认错了人。更奇的是，有人同一日在两处见到他，两处的多托雷竟隔空对骂，都说对方是假的。旁人懒得分辨，只管低头行礼。"
 SUM_Neo.223.a:"让新神更快睁眼"
 SUM_Neo.223.b:"把风险压在柜子里"
 SUM_Neo.224.t:"铸此不祥"
 SUM_Neo.224.d:"须弥的学者们，自从得了至冬的图纸，胆子便一天大似一天，竟动手造起不属于这个世界的东西来。他们把从遗迹里挖出的机关、从深渊里换来的知识、从赤王记忆里翻出的诀窍，一股脑儿搅在一起，造出的东西既不像须弥的旧物，也不像至冬的新式，非驴非马，却又偏偏能跑能动能杀人。有个老学者看着那些成品，连连摇头，说这东西没有名字，没有来处，造出来的时候就已经违背了天理。旁边的年轻人却洋洋得意，说这叫创新，正是须弥千载难逢的机会。话音刚落，那新造的玩意儿忽然自己动了一下，把桌上的墨水瓶撞翻，黑墨淌了满桌。众人面面相觑，不知是谁下的命令。那摊黑墨谁也收拾不了，众人只得由它淌着，眼看着它爬满了半张图纸。"
 SUM_Neo.224.a:"加速造神的工序"
 SUM_Neo.224.b:"暂缓，先看住学院"
 SUM_Neo.225.t:"盟于朔北"
 SUM_Neo.225.d:"须弥与至冬结盟之后，最显著的变化，便是那片沙漠。至冬人看中了须弥沙漠的地理位置，说这里正对着南方的要道，是天然的前哨。于是乎，沙漠里一夜之间多了许多营房、哨塔和仓库，至冬的兵士荷枪实弹，在沙丘间来来往往，把原本冷清的沙漠搅得热闹起来。当地的沙民却高兴不起来，说这沙漠是他们的家，如今倒成了别人家的营盘，连走路都要被人盘问。有个老牧人赶着羊群路过哨卡，被拦下来查了半天，等放行时，羊都晒得蔫了。他敢怒不敢言，只好在心里暗骂几句。哨塔上的兵士日夜盯着来往的行人，连一只骆驼都要盘问半日。沙民们渐渐学会了绕路走，宁可多走三天，也不愿从那哨卡底下过。有人说这前哨守的是须弥，其实守的是至冬人的利益。"
 SUM_Neo.225.a:"调集全部资源"
 SUM_Neo.225.b:"留一手，别赌上须弥"
 SUM_Neo.226.t:"暗执禁术"
 SUM_Neo.226.d:"教令院自以为已经把禁忌之术摸了个透，便公然宣称：禁忌已不足惧，须弥已能驾驭。为了显示这份自信，他们把记载禁忌知识的典籍装进一只铁柜，柜门上锁，钥匙交给大贤者亲自保管，仿佛锁住了柜子便锁住了祸患。有个老学者却惴惴不安，私下里对人言：这禁忌不是别的物件，锁得住纸，锁不住人心，今天把它锁进柜子，明天人心的锁却开了。这话传到贤者耳中，贤者只笑他多虑，说如今须弥有神可驱使、有机器可依赖，还怕什么禁忌。老学者见劝不动，只好作罢，只是每回经过那只铁柜，都要加快脚步。那铁柜放在议事厅最里头，柜门上还贴了封条，封条上盖着大贤者的印。看守的侍卫换了一班又一班，个个都被叮嘱，不论听见柜子里有什么动静，都不许开看。"
 SUM_Neo.226.a:"让新神更快睁眼"
 SUM_Neo.226.b:"把风险压在柜子里"
 SUM_Neo.227.t:"与神同列"
 SUM_Neo.227.d:"须弥那位新造的神，如今已不坐在净善宫，而是被搬到了至冬的桌边。那是至冬女皇的议事厅，长桌之上，须弥的神端坐在侧，与愚人众的第二席多托雷并肩而坐，仿佛一位真正的盟友。可它只是件摆设，多托雷说一句，它便应一句，连眼珠转动的时机都要等人提醒。有个至冬的将军看不惯，说这哪里是神，分明是件会点头的摆件，多托雷却笑着回道：会点头的神，才是好神。那位将军冷哼一声，再不言语。而远在须弥的教令院，还在为自家神明能跻身至冬的议事厅而沾沾自喜。议事时，须弥的神始终一言不发，端端正正坐着，多托雷说什么，它便轻轻点头。有个至冬文官暗想，这哪里是来结盟的神，分明是件摆设。散会时至冬人先行一步，须弥的神留在殿上，殿中烛火摇了两摇，无人去剪烛。至冬文官归国后把这话写进密报，末尾添一句：此盟可恃十年，宜速图之。"
 SUM_Neo.227.a:"加速造神的工序"
 SUM_Neo.227.b:"暂缓，先看住学院"
 SUM_Neo.228.t:"发冢探墟"
 SUM_Neo.228.d:"须弥各处遗迹，这一日被教令院列了清单，要一处一处系统地发掘。发掘队带着测罗盘的仪器和成箱的镐头，先到大赤沙海，又转到列柱沙原，但凡有旧石堆的地方都要挖上几锹。挖出来的东西堆满了卡车，有碎裂的石板，有锈蚀的齿轮，还有一尊尊造型古怪的赤王机械，有的缺了胳膊，有的少了腿，却仍能看出当年的精巧。有个年轻的发掘员挖出一件完好的机关鸟，高兴得举起来给众人看，那机关鸟忽然展翅，扑棱一下飞出老远，吓得众人仰头去追。队长却呵斥他大惊小怪，说这些东西迟早都要送进实验室拆解。发掘出的东西越堆越多，连附近的屋子都塞满了，有些还带着致命机关。有个工人被出土的机械划伤了胳膊，伤口发黑，从此没人敢伸手乱碰。"
 SUM_Neo.228.a:"调集全部资源"
 SUM_Neo.228.b:"留一手，别赌上须弥"
 SUM_Neo.229.t:"机巧图经"
 SUM_Neo.229.d:"那些从遗迹里挖出的赤王机械，都被送到了教令院的妙论派手里。妙论派的学者们围着一桌子的零件，又是量尺寸，又是拆关节，把每一件机械都画成了精细的图谱。图谱上标注着齿轮的齿数、连杆的长短，连哪一处该上油、哪一处容易断，都写得清清楚楚。有个老画师眼神不济，戴着厚厚的镜片还凑到跟前去看，一笔一划地描，描到一处复杂的机关，忍不住骂了一句，说这赤王当年造东西，怎么也不替后辈着想。旁边的人笑他，说你骂归骂，画还得画。老画师哼了一声，到底把那处机关描得一丝不苟。没过多久，这些图谱便成了工坊造机的范本。老画师画完最后一笔，摘下镜片揉了揉眼，说这图我描了一辈子机关，从没见过这么精巧的。"
 SUM_Neo.229.a:"让新神更快睁眼"
 SUM_Neo.229.b:"把风险压在柜子里"
 SUM_Neo.230.t:"阿玛塔枢"
 SUM_Neo.230.d:"教令院从赤王的旧物中，找出了一枚名为阿玛塔的机核，据说那是赤王旧日神躯的核心。这机核虽然残破，却依然透着一股古老而强横的力量，妙论派的学者们如获至宝，照着它的模样一比一地复刻，铸成了新神的骨架。复刻之日，工匠们把滚烫的金属浇进模具，火花四溅，足足忙了三天三夜。有个参与铸核的工匠说，他分明看见那机核在炉火中微微颤动，仿佛不甘心被人仿造，可工头叫他莫要胡说，说这是他熬夜熬花了眼。骨架铸成之后，装进人偶的躯壳，严丝合缝，众人看了都啧啧称奇，说赤王的骨，果真配得上新造的神。复刻成的骨架沉得出奇，几个人合力才抬得动，抬时那骨架还隐隐发出低鸣，仿佛从很远的地方传来。工匠们相视变色。"
 SUM_Neo.230.a:"加速造神的工序"
 SUM_Neo.230.b:"暂缓，先看住学院"
 SUM_Neo.231.t:"元力之枢"
 SUM_Neo.231.d:"新神的骨架既成，教令院又马不停蹄地造起能量模块来。这模块是驱动神偶的关键，一块接一块地从工坊里造出来，每一块都亮着幽幽的光。为了赶进度，须弥的工坊昼夜开工，连檐下都挂满了灯，远远望去，整座城亮如白昼，竟比花神诞祭时还要热闹。有个老工匠一边打磨模块，一边嘟囔，说造神就造神，何必把全城的灯都点起来，这不是劳民伤财么。旁边的学徒却说，这是大喜事，点几盏灯算什么。老工匠摇摇头，只管低头干活。到了夜里，那些灯把须弥照得如同白日，睡不着的人站在窗前，都说这光看着热闹，却透着一股说不出的冷清。灯一直亮到天明，第二日又有更大的工坊开工，灯便添得更多。须弥城从此夜夜通明，可人们睡得反倒不踏实。"
 SUM_Neo.231.a:"调集全部资源"
 SUM_Neo.231.b:"留一手，别赌上须弥"
 SUM_Neo.232.t:"冶铸得法"
 SUM_Neo.232.d:"赤王旧卷里的熔铸之术，被教令院的学者们重新琢磨了出来。这门手艺失传多年，从前那些坏了、锈了的机关，只能当废铁扔掉，如今有了熔铸之术，竟能把废铁回炉，重铸成新的机关。工坊里炉火熊熊，匠人们把堆成小山的废机关投进炉子，熔成铁水，再浇进新的模具。有个老匠人捧着一件祖传的旧机关看了又看，终究还是把它投进了炉子，嘴里念叨着：老伙计，对不住了，你且去投个好胎。旁边的人听了这话，都笑他魔怔。老匠人也不辩解，只盯着炉火，直到那旧机关化成一汤铁水。不多时，新的机关便从炉中取出，锃亮如新。这手艺传开后，工坊里的废铁身价倍增，从前当垃圾扔的，如今都有人抢着要。有个收破烂的老汉一夜发了财，见人便说世道变了。"
 SUM_Neo.232.a:"让新神更快睁眼"
 SUM_Neo.232.b:"把风险压在柜子里"
 SUM_Neo.233.t:"铸石成牒"
 SUM_Neo.233.d:"妙论派在遗迹里挖出了好几块熔铸石板，每一块上都刻着密密麻麻的图文。这些石板原本散落各处，缺了角、断了边，谁也看不懂上头写的是什么。后来学者们把石板一块块拼合起来，严丝合缝，竟拼出了一整套失传的工艺，从选料、配料到火候、淬炼，写得巨细无遗。有个年轻学者捧着拼好的石板，激动得手都在抖，说这简直是天赐的宝物，有了它，须弥的机关之术便能再现赤王时代的荣光。可旁边一位老者却泼冷水，说赤王的工艺是好，可赤王当年为何要把这些石板藏起来、拆散，怕的不是后人学不会，而是学得太会。年轻学者听不进去，只当他是嫉妒。石板被供在妙论派的密室里，派专人看守，想看一眼都得层层通报。老者的话后来竟一语成谶。"
 SUM_Neo.233.a:"加速造神的工序"
 SUM_Neo.233.b:"暂缓，先看住学院"
 SUM_Neo.234.t:"卡赫尼斯之匙"
 SUM_Neo.234.d:"教令院在赤王的遗迹深处，找到了一把名为卡赫尼斯的钥匙。那钥匙造型古怪，非金非玉，握在手里冰凉刺骨，钥匙上的纹路与虚空终端的纹路竟有几分相似。学者们如获至宝，按着遗迹里的指引，找到了一扇紧闭的石门。门上有一处锁孔，形状与那钥匙分毫不差。有人主张不要开，说这既然被称作禁门，必有缘由，可大贤者阿扎尔却在旁冷冷地说了句：我等既已掌握禁忌，何惧一扇门。于是钥匙插入锁孔，轻轻一转，石门轰然洞开，门后吹出一股阴冷的风，风中似乎夹着低语。众人面面相觑，谁也不敢第一个迈进去。阿扎尔却抬脚便入，仿佛那门后当真有什么在等着他。门后的低语越来越清晰，听着像在念什么人的名字，可谁也听不清念的是谁。"
 SUM_Neo.234.a:"调集全部资源"
 SUM_Neo.234.b:"留一手，别赌上须弥"
 SUM_Neo.235.t:"设械作场"
 SUM_Neo.235.d:"那座按赤王工艺建起的机械工厂，终于全面开工。厂里原本该由工匠动手的活计，如今都被齿轮和连杆取代，传送带一转，零件自己走动，装配自己完成，从头到尾不见几个人影。有个老工匠站在车间门口看了半晌，越看越不是滋味，说这哪还是工厂，分明是座大机器，人是多余的。旁边的年轻人却说，这正是进步，机器比人听话，不会偷懒，也不会闹脾气。老工匠叹了口气，说机器不会闹脾气，可也不会替你想办法，等到哪天机器出了毛病，看你们找谁去。年轻人摆摆手，只当他啰嗦。老工匠摇着头走开了，从此再没来过。开工不到半月，车间里的人便少了一半，剩下的只管盯着仪表按开关，连工具都摸不到了。厂门口那口老井，原是给匠人打水喝的，如今也填了。填井当日，几个老匠人捧着水囊站在一旁，谁也没说话。"
 SUM_Neo.235.a:"让新神更快睁眼"
 SUM_Neo.235.b:"把风险压在柜子里"
 SUM_Neo.236.t:"械自为伍"
 SUM_Neo.236.d:"须弥的自动军团，终于成军列阵。那队伍里没有一个活人，全是铁打的兵偶，一排排立得笔直，刀枪齐整，连呼吸声都没有。教令院的官员检阅之后，赞不绝口，说这支部队不吃不喝，不要军饷，更不会闹饷哗变，实乃治国安邦的利器。可有个久经沙场的老将却笑不出来，他悄声对身边的人说：不懂投降的兵，才是最可怕的兵。活人打到绝境，尚知道放下武器保命，这些铁疙瘩却只会一味地杀下去，直到把对面杀光，或者把自己耗干。旁边的人问他，那岂不是无敌之师。老将摇头，说无敌的军队，往往也是最不懂什么是分寸的军队。检阅完毕，那些兵偶便被分派到各处驻防，站在城门口一动不动，连苍蝇落在脸上都不眨一眼。有孩童不知深浅，往兵偶脚下丢了颗石子，被大人一把捂住嘴，拽回屋里锁了半日。后来守门的换了兵偶，换岗的士卒省了事，只在换班时往它们肩上搭一条汗巾。"
 SUM_Neo.236.a:"加速造神的工序"
 SUM_Neo.236.b:"暂缓，先看住学院"
 SUM_Neo.237.t:"石人骤起"
 SUM_Neo.237.d:"居尔城里那尊赤王的石像，忽然在一日之间活了过来。那石像本是新近雕成，立在王座之侧，谁也没想到它会动。先是眼珠上的石屑簌簌落下，露出底下幽深的暗光，继而石像缓缓抬起手臂，迈开沉重的步子，竟走到队伍最前头，为自动军团开路。跟着的兵偶们齐刷刷让开道路，把石像奉为先锋。有个胆大的士兵骑马跟在旁边，看清了那石像的面目，说那哪里是赤王，分明是教令院照着记忆里模糊的样子拼出来的赝品，连鼻子都歪了。旁边的同伴吓得脸都白了，叫他住口，说这话若被石像听见，大家都要化作石屑。石像却只管往前走，对周遭的一切不闻不问。石像走过之处，沙土都被踩得极深，留下一串沉重的脚印。跟着的兵偶亦步亦趋，没有一丝声响。"
 SUM_Neo.237.a:"调集全部资源"
 SUM_Neo.237.b:"留一手，别赌上须弥"
 SUM_Neo.238.t:"浮城之式"
 SUM_Neo.238.d:"教令院从赤王的遗迹里，复原出了一份浮空城的图纸。那图纸上画的是一座悬在半空的城池，楼阁连绵，街道纵横，下头由一根巨大的柱子撑起，仿佛通天之作。妙论派的学者们看了图纸，个个眼睛放光，说须弥也要在天上建一座城，重现赤王时代的荣光。消息传开，匠人们日起夜地点灯赶工，先把那根通天柱立了起来，再一层层往上盖楼。有个从阿如村来的老农仰头看了半天，说这城盖在天上，地里的庄稼可怎么种，难道要天天爬上去不成。旁边的人笑他见识短，说天上是给神住的，庄稼仍旧在地上种。老农摇摇头，到底是想不明白。匠人们吃住都在工地上，因柱子太高，脚手架搭了整整三层，风一吹便吱呀作响，上面的人吓得腿软，却还得硬着头皮往上爬。"
 SUM_Neo.238.a:"让新神更快睁眼"
 SUM_Neo.238.b:"把风险压在柜子里"
 SUM_Neo.239.t:"枢纽居中"
 SUM_Neo.239.d:"须弥的核心中枢，终于在教令院的中心落成。那是一座通体银白的高塔，塔顶悬着一枚巨大的能量核心，光芒四射，整个须弥城，乃至四面的沙漠与雨林，都通过地下的线路与它相连。从此，谁家的灯几点亮，哪条街的门禁几点开，城外的水闸几时放水，都由这中枢统一调度，分毫不差。起先百姓还觉得方便，可渐渐的便觉出不对来。有人的灯忘了关，中枢竟自己切断了电源，连招呼都不打一声。有个老太太抱怨说，从前邻里之间还能互相照应，如今连串个门都要先问过机器，这叫什么事。旁边的邻居提醒她小声些，当心被中枢听见。老太太冷笑，说机器哪有耳朵。可那灯光却偏偏暗了一暗，仿佛是在回应。第二日那盏灯又暗了一暗，老太太闭了嘴，往后夜里说话，都用被子蒙着头。那老太太后来屋里点了两盏灯，一盏自己用，一盏摆在窗台，给那中枢看着。"
 SUM_Neo.239.a:"加速造神的工序"
 SUM_Neo.239.b:"暂缓，先看住学院"
 SUM_Neo.240.t:"机关盈宇"
 SUM_Neo.240.d:"到了这般地步，须弥算是彻底进入了机械之世。从造神到造兵，从点灯到开门，事事都离不开机器，机器越造越多，越造越精，倒把活生生的人比了下去。教令院的官员在议事厅里意气风发，说这是须弥千载难逢的大时代，人从此可以摆脱劳碌，享清福了。可底下的人心里却明白，所谓享清福，不过是给人换了个说法。机器容不得半点差错，人却有七情六欲，会累会病会走神，在这套精密的机器里，人反倒成了最不精确的零件。有个老工匠一语道破，说机器造得再好，也是人造的，哪天机器反过来把人当成零件换掉，那才叫热闹。此言一出，满座皆惊，人人把目光投向那位老工匠。老工匠说完便把酒碗一放，起身回家，当晚便收拾了细软，说是投奔乡下亲戚去。众人回过神来，都没接话，各自把杯里的酒一口干了，散席比往常早了一个时辰。"
 SUM_Neo.240.a:"调集全部资源"
 SUM_Neo.240.b:"留一手，别赌上须弥"
 SUM_Neo.241.t:"渊底微言"
 SUM_Neo.241.d:"是日，须弥的世界树忽然发出异样的声响，树根深处的虚空终端里，竟传出了声音。那声音幽深而冰冷，自称来自深渊，说深渊愿意帮须弥造神，只要教令院点头，禁忌的知识、古老的力量，要什么有什么。消息报到教令院，贤者们先是震惊，继而大喜过望，说这不正是天赐的良机么。可有几个老成的学者却坐不住了，说深渊之物，哪有平白无故帮人的道理，今日它肯帮你造神，明日它就要你拿东西来换，这代价怕不是须弥承受得起的。大贤者阿扎尔却一挥手，打断了众人的争论，说他自有分寸。深渊的声音便在树根里低低地笑着，仿佛已经看见了须弥未来的模样。那声音此后再没断过，每当夜深人静，世界树根须便轻轻颤动，把那句话一遍遍送到虚空终端里。"
 SUM_Neo.241.a:"让新神更快睁眼"
 SUM_Neo.241.b:"把风险压在柜子里"
 SUM_Neo.242.t:"渊市通幽"
 SUM_Neo.242.d:"教令院到底还是与深渊做成了交易。这交易做得极是隐秘，连六派首座都不全知情，只有大贤者阿扎尔和几个心腹经手。交易的地点就在世界树根部的虚空终端前，那边递过来的是禁忌的知识与深渊的力量，这边交出去的是须弥的算力与活人做试验的名额。每一次交易，深渊都要在须弥身上多咬下一口，而教令院每回都安慰自己说，这是最后一回了。有个参与经手的书吏后来对人说，他亲眼看见那些从深渊来的东西在容器里蠕动，像活物一般，看得他几夜都没睡好觉。可上头催得紧，他也只能硬着头皮照办。交易的地方围起帷幕，外头只见一车车东西运进去，从没见有东西运出来。偶尔有人发疯发狂，教令院便说他们染了时疫，悄悄关押起来。"
 SUM_Neo.242.a:"加速造神的工序"
 SUM_Neo.242.b:"暂缓，先看住学院"
 SUM_Neo.243.t:"妄窥幽秘"
 SUM_Neo.243.d:"教令院为了造神，竟把赤王当年碰过的禁忌知识重新翻了出来。那些知识被封存在最深的密室里，卷轴上写着扭曲的文字，寻常人看上一眼便觉头痛欲裂。学者们戴着特制的护具，才敢靠近。有个年轻学者好奇，偷偷摘下护具看了一眼，当场鼻血长流，瘫在地上，口里反复念叨着一句话，谁也听不懂。众人吓得把他抬了出去，从此再没人敢大意。禁忌知识一旦取出，便再也压不住，它像长了腿一般，自己钻进学者们的脑子里，叫他们日思夜想，欲罢不能。老学者们摇头叹息，说赤王当年就是碰了这东西才落得那般下场，如今须弥竟又要走一遍老路。密室门口昼夜有人把守，进出的学者都面色惨白，两眼发直。有个进去的学者出来后三天说不出话，第四天开口第一句，问的是门锁好了没有。把守的兵卒换了三拨，谁也说不清门里在做什么，只记得换岗时那门缝里透出的凉气。"
 SUM_Neo.243.a:"调集全部资源"
 SUM_Neo.243.b:"留一手，别赌上须弥"
 SUM_Neo.244.t:"氛祲侵林"
 SUM_Neo.244.d:"自从禁忌之力在须弥泛滥，雨林那边便渐渐不对劲起来。先是边缘地带的草木无故枯萎，接着泥土发黑，溪水变浑，最后连空气里都飘着一股腐坏的味道。巡林官提纳里带着柯莱查看了多处，回来后把一份报告压在旧报告之上，死域的边界，又往北挪了一里。柯莱看着那些枯萎的树林，眼圈都红了，说她从小就知道死域可怕，却从没见过它扩张得这样快。提纳里沉默良久，只说了一句：再这样下去，就没有回头的路了。远处，死域的黑雾正无声地漫过来，像一只张开的手，要把整片雨林攥进掌心。提纳里把样本带回禅那园，一遍遍比对旧记录，越比眉头皱得越紧。柯莱问死域为何扩张这样快，提纳里摇头说，当务之急是护住还没被侵蚀的林子。"
 SUM_Neo.244.a:"让新神更快睁眼"
 SUM_Neo.244.b:"把风险压在柜子里"
 SUM_Neo.245.t:"妖兽梗途"
 SUM_Neo.245.d:"沙漠深处的魔兽，近来纷纷苏醒，把往来商道搅得一塌糊涂。那些商道本是沙民和商队走了几百年的老路，如今魔兽一出，商队走到半路便被惊散，货物丢的丢、散的散，好些人再也没有回来。消息传开，无人敢再走这条道。没过几日，商道口竟立起了木栅，一道接一道，把入口封得严严实实，栅上还挂着牌子，写着此路不通。有个老驼夫赶着驼队来到栅前，望着那封死的道路发了半天的呆，说这商道不通，等于断了须弥沙漠的活路，可是没办法，谁敢拿命去闯。驼队只好掉头，扬起一片黄沙。商道两旁的村子也跟着萧条，铺子关了一多半，剩下的人没生意可做，只好收拾行李往阿如村去。沿途尽是丢弃的货箱和破帐篷，看着叫人心惊。"
 SUM_Neo.245.a:"加速造神的工序"
 SUM_Neo.245.b:"暂缓，先看住学院"
 SUM_Neo.246.t:"神钉镇罪"
 SUM_Neo.246.d:"须弥的学者们，竟胆大包天地拔出了天钉中的一枚。那判罚之钉从天而降，钉入沙海多年，本是惩罚赤王旧罪的记号，谁也不敢靠近。如今教令院为取其中的力量，竟把它拔了出来。钉子刚一离地，钉入之处便裂开一道大口，黑气从裂缝中喷涌而出，方圆几十里的沙子都跟着往下陷。有个在附近勘测的工匠，眼睁睁看着脚下的地面裂开，惊得撒腿就跑，一边跑一边喊，说天要塌了。旁人只当他吓疯了，可回头一看，那裂缝还在扩大，隐隐透出底下不明所以的幽光。教令院的人却如获至宝，说这裂缝里藏着的力量，正是造神急需的。那裂缝后来被教令院用铁链封住，可每到夜里，链子便被震得哗哗作响，守在附近的人都不敢合眼。"
 SUM_Neo.246.a:"调集全部资源"
 SUM_Neo.246.b:"留一手，别赌上须弥"
 SUM_Neo.247.t:"叩启虚空"
 SUM_Neo.247.d:"沙丘之下，那扇被称为虚空之门的石门，终于被打开了。门后吹出一股风，风里带着一股说不清的味道，既不像沙，也不像海。有胆大的学者朝门里喊了一声，想听听回声，可那声音仿佛被什么东西吞了，竟连一丝回音都没有。众人面面相觑，都说这可真是邪门，活了这么大，从没见过会吃声音的门。有个老成持重的学者主张把门重新关上，说这门后头必不正常，可大贤者阿扎尔却不同意，说门的另一头连着虚空，正是须弥求之不得的东西。他命人把门守住，自己亲自站在门前，任那风吹动衣袍。学者们试过往门里扔石头，石头落下去，半点声响都没有，像掉进了无底的深处。有人说这门连着虚空，虚空里本就没有声音，可他自己说着也发了毛。"
 SUM_Neo.247.a:"让新神更快睁眼"
 SUM_Neo.247.b:"把风险压在柜子里"
 SUM_Neo.248.t:"巨虫破土"
 SUM_Neo.248.d:"列柱沙原下头，那些沉睡了不知多少年的沙虫，近来纷纷醒了过来。这些沙虫身躯庞大，藏在沙下无声无息，只在沙面上留下一个个隆起的沙包，如同活动的沙丘。它们一醒，列柱沙原便成了猎场，但凡有活物经过，沙下便猛地窜出一条巨虫，张开血盆大口，把人和骆驼一并吞了。那些新立起的石柱，有不少被沙虫撞倒、拱断，横七竖八地倒在沙里。有个侥幸逃回来的商队伙计，说起那场面仍心有余悸，说那虫子的嘴比门板还大，一口就能吞下整匹骆驼。从此列柱沙原再无人敢去，连教令院的发掘队都停了工。教令院的发掘队停了工，那些刚立起的石柱也被弃在沙里，任凭沙虫出没。从前这里是赤王的王土，如今连靠近都要拿命去换。"
 SUM_Neo.248.a:"加速造神的工序"
 SUM_Neo.248.b:"暂缓，先看住学院"
 SUM_Neo.249.t:"学者堕落"
 SUM_Neo.249.d:"那些钻研禁忌知识的学者，一个个被那知识吞掉了心神。起初只是通宵达旦地读书，后来便不吃不喝，再后来连话也不会好好说了，只会念念有词，眼睛里闪着异样的光。教令院眼见这些人废了，也不救济，只是冷冷地把他们的名字从名册上一笔划去，仿佛这些人从未存在过。有个负责划名的书吏，划到第七个名字时，手抖得几乎握不住笔，因为那名字他认得，是当初带他入门的恩师。主管在旁边催促，说快些，别误了新名册的抄写。书吏咬着牙划了下去，一笔下去，恩师便成了个不存在的人。当夜他做了一个梦，梦见那些被划掉的名字排成一列，齐齐望着他。被划去的人从此无处可去，有的流落街头，有的夜夜守在院门外，盼着有人还能认出他们。"
 SUM_Neo.249.a:"调集全部资源"
 SUM_Neo.249.b:"留一手，别赌上须弥"
 SUM_Neo.250.t:"设坛犯禁"
 SUM_Neo.250.d:"那场筹备已久的禁忌仪式，终于在新神面前完成了。仪式在净善宫前的大广场上举行，教令院六派首座齐齐到场，深渊的低语自地底传来，与虚空终嗡鸣交织成一片。仪式完成的霎时，新神的眼中亮起两点幽光，广场上的灯火齐齐熄灭，须弥的天空，竟从此暗了下来。此后须弥的夜，一日长似一日，白昼越来越短，原先只需点上几盏灯便过的黄昏，如今要熬上好一阵才见天光。百姓们起初以为是天时反常，后来才隐隐觉得，是那场仪式把什么东西从黑暗里放了进来。有个老妇人每晚都坐在门口，望着越来越长的夜叹气，说她活了一辈子，没见过这样长的夜，只怕这夜长下去，就再也要不回从前那种说亮就亮的早晨了。那老妇人后来搬去同亲戚一处住，走时把门口的灯留下，说万一亮了，好照个路。长夜之下，城里的更夫添了一岗，可报时的梆子声，一夜比一夜迟。"
 SUM_Neo.250.a:"让新神更快睁眼"
 SUM_Neo.250.b:"把风险压在柜子里"
 SUM_Neo.251.t:"幽渊聚旅"
 SUM_Neo.251.d:"造神之事既定，须弥的军营里便多了一样怪东西。那深渊之物，本是不该现于阳世的魔物，如今被教令院用符箓拘了，硬生生编入行伍，替须弥打仗。这些魔物无形无质，只用一团黑影立在地上，号令一发，便齐齐向前，刀枪砍上去竟如砍水。营中的兵卒初时见了，夜里都做噩梦，后来也就惯了。有一回操练，那黑影听得号令，竟自行排成方阵，进退分毫不乱，比活人还齐整。监军的官儿看得呆了，半晌才想起记功。每当黄昏埋锅造饭，一列的火堆从营门直排到沙丘背后，火光映着那些黑影，拖出老长的影子。有老兵私下说，这火是给活人烤手用的，不是给它们暖身的。旁边人听了，也不接话，只把柴禾往火里添。火堆旁说话的人渐渐少了，都竖着耳朵听沙丘那边的动静，柴禾添得越来越勤。那些黑影后来不进火光，只在光边上绕，绕够了便退回沙丘后头去。"
 SUM_Neo.251.a:"加速造神的工序"
 SUM_Neo.251.b:"暂缓，先看住学院"
 SUM_Neo.252.t:"幽黑骤临"
 SUM_Neo.252.d:"净善宫中那尊新造的神，起初泥塑木雕一般，端坐在台上，任凭贤者祷告，半点动静也无。大贤者阿扎尔命人把虚空里导出的漆黑之力，一桶一桶灌进神的躯体。这力道凶狠，才灌了三日，那神的眼珠便自己转动起来，第四日竟开口说了一句谁也听不懂的话。造神本是要造一个听话的傀儡，谁知漆黑之力最是不驯，灌得越多，神越不肯依人。它起初只是摇头，后来便挥手把面前的香炉扫落在地。伺候的祭司吓得跪下，贤者们面面相觑，谁也不敢上前。有胆大的说再灌些保准压得住，众人将信将疑，又命人抬来一坛。这一坛灌下去，那神忽然放声大笑，笑声震得殿梁上的灰尘簌簌落下，伺候的人无不腿软。阿扎尔脸上也失了血色，却还硬着头皮说这是神威显灵。"
 SUM_Neo.252.a:"调集全部资源"
 SUM_Neo.252.b:"留一手，别赌上须弥"
 SUM_Neo.253.t:"委身渊薮"
 SUM_Neo.253.d:"那新神闹了几场之后，教令院里再没人敢说造神是件容易事。先前在议事厅上，贤者们拍着胸脯，说这神造出来便由须弥调度，指哪儿打哪儿。如今呢，神夜夜在净善宫里发怒，砸碎的器皿装了几筐，连大贤者阿扎尔的话也一句不听。这一日六派首座聚在一处，议了半晌，末了由一位老成持重的开口，说了一句实话：我们手里握着的，早已不是自己能使唤的东西了。此言一出，满堂寂然。有人想把这话收回去，却再也找不出别的话来。须弥上下头一回承认自己闯了祸，可承认归承认，那神还在宫里坐着，赶也赶不走。有几位首座私下商议，想请一位德高望重的老先生进宫劝劝，可那老先生连连摆手，说连大贤者的话都不听，谁还劝得动。"
 SUM_Neo.253.a:"让新神更快睁眼"
 SUM_Neo.253.b:"把风险压在柜子里"
 SUM_Neo.254.t:"大贤颁令"
 SUM_Neo.254.d:"自从造神那桩事闹大，大贤者阿扎尔便不大到议事厅去了。往日里，一道敕令要经六派首座画押，你一言我一语，争到日头偏西才定得下来。如今不同了，阿扎尔坐在净善宫旁边的一间小屋里，口述一句，书记官记一句，写完盖上大印，便算数。议事厅的桌椅依旧摆得齐整，只是坐的人越来越少。有不知趣的官儿抱着卷轴进去，才发现厅里冷冷清清，连茶都没人备。那官儿站了半晌，只得又把卷轴抱回去。往日里议事厅上争得面红耳赤，虽是啰嗦，到底还有个商量，如今一人说了算，倒省了口舌，也断了进言的路。有几个老成的大臣看得明白，却也不肯出头，只在背后摇头叹息，谁也不肯做那出头的椽子。老臣们散朝时彼此使个眼色，谁也不开口，各自上轿，轿帘放得比往日更低。"
 SUM_Neo.254.a:"加速造神的工序"
 SUM_Neo.254.b:"暂缓，先看住学院"
 SUM_Neo.255.t:"阴置缉曹"
 SUM_Neo.255.d:"教令院新设了一个名目，唤作纠察司，外人只当是查案的衙门，其实专管拿人。这班人走路没声，进出门都不敲门，谁家夜里点灯说两句闲话，第二日便有人找上门来。城中有一份小报，平日里专登些学者轶事，自打纠察司设立，那报上的名字便一日少似一日。先是登载反对造神的几位先生，名字被墨涂了；后来连提过一句异议的，也同样涂掉。到了月末，整版竟只剩些歌功颂德的话。有印刷的匠人偷偷数过，被涂掉的名字比留下的还多。有一回排字房的伙计手快，把一个名字漏了没涂，第二日那伙计便不见了，位子上换了个生面孔。自此人人噤声，连油墨都不敢多蘸。报上少了名字，牢里便多了人。报馆的墨匠们从此只管印，不看稿，印完的版子当天便刮平了重铸。"
 SUM_Neo.255.a:"调集全部资源"
 SUM_Neo.255.b:"留一手，别赌上须弥"
 SUM_Neo.256.t:"禁令苛察"
 SUM_Neo.256.d:"禁书令原先只管着教令院里的典籍，后来越管越宽，连雨林的药草、沙漠的歌谣也一并禁了。雨林那边，采药的老人背着一篓草药过岗哨，被书吏拦下，说这草有个治梦的名目，不许带进城。老人争辩说祖上就这么用，书吏不听，一脚把药篓踢翻。沙漠那头更可笑，几个歌女唱了支老调，词里带了半个神字，便被拖去问话。草药能治病，歌谣能解闷，原是无害的东西，只因沾了旧日的名目，便都成了罪过。百姓们渐渐连张口唱歌也不敢，走路都低着头。采药的老人回到村中，把这事说与乡邻听，众人听了都不言语，只把家里的旧药方翻出来，一张一张烧了。沙漠的歌女们也被勒令改口，唱起新编的颂词，唱到一半竟忘了词。忘了词的歌女回家便病，病好后再登台，词都唱全了，只是嗓子里少了先前的味。"
 SUM_Neo.256.a:"让新神更快睁眼"
 SUM_Neo.256.b:"把风险压在柜子里"
 SUM_Neo.257.t:"虚空密伺"
 SUM_Neo.257.d:"虚空终端原本是给人答疑解惑的宝贝，如今却变了模样，竟能把自己听过的话一句句回传上去。城中茶摊上有个汉子，头一日牢骚了一句粮价太贵，第二日便有人上门，把他说的原话一字不差地念给他听。那汉子吓得脸都白了，从此喝茶只敢低头。这虚空终端记性极好，谁在何处说了何话，几时说的，对谁说的，都记得清清楚楚。防民之口，甚于防川，如今连心里想的都不敢吐半个字。市井之间人人相见，只谈天气，不说国事。有个卖菜的农妇，随口说了句今日菜贱，隔日便有人来问她是不是心怀不满，吓得她再不敢开口。茶博士见风头不对，索性在墙上贴了张纸条，写着莫谈国事四个字。那张纸条后来换了几茬，纸都发黄了，四个字却越写越大，末一回用朱笔写的。"
 SUM_Neo.257.a:"加速造神的工序"
 SUM_Neo.257.b:"暂缓，先看住学院"
 SUM_Neo.258.t:"举邦尽起"
 SUM_Neo.258.d:"大贤者一纸动员令颁下，须弥全境都要抽丁当兵。这令写得分明，沙漠与雨林一例，不许有半分例外。沙漠的村镇里，官差挨家挨户点名，凡是能拿得动刀的，十八以上五十以下，一概登记。雨林那边也一般，巡林队里抽走了一批，连采药的少年也没放过。有母亲拉着儿子的手不肯放，官差只说这是王命，谁敢违抗。这一来，种地的少了，经商的少了，连采药的人也没了。田里荒着，铺子关着，满城尽是披甲拿枪的生面孔。村庄里也乱了套，铁匠铺日夜打刀，供不应求；粮铺的米价一日三涨，有钱也买不着。有逃丁的汉子，躲进雨林深处，从此不敢回家，家中老小只得以泪洗面。雨林深处逃丁的人渐渐聚成一小村，村口无牌无匾，外人问起，只说猎户歇脚处。"
 SUM_Neo.258.a:"调集全部资源"
 SUM_Neo.258.b:"留一手，别赌上须弥"
 SUM_Neo.259.t:"芟除异己"
 SUM_Neo.259.d:"当初议造神时，六派之中原也有几个明白人，力言不可，说神造出来必然失控。如今神果然闹起来，那些说过不可的先生，反倒先遭了殃。教令院里一连数日，都有人被请去问话，进去时是先生，出来时便换了脸色，收拾书本，连夜搬出了学院。有的索性不知去向，只剩座位空着。这一番清洗过后，六派首座再没人敢提半个不字，议事厅上只剩一种论调，尽说造神如何英明。有投机的人，反而因此升了官。有一位老先生，平日里最是会说话的，这回也学乖了，逢人便说造神如何顺天应人，说得比谁都溜。旁人听了，也不拆穿，只当他在说梦话。学院里的空气，一日紧似一日。说他梦话的人后来也学了几句，在学院里人前人后各说一套，两边都不落下。"
 SUM_Neo.259.a:"让新神更快睁眼"
 SUM_Neo.259.b:"把风险压在柜子里"
 SUM_Neo.260.t:"榜示院门"
 SUM_Neo.260.d:"教令院为粉饰太平，命人把宣扬国威的画报贴满全城。但见须弥城的城墙，从东门到西门，一色都是新糊的黄纸，上面画着高塔入云，神像端坐，四下里臣民跪拜。画角下写着一行大字，说须弥从未有今日之强。路过的百姓抬眼看了看，又低头走开。有个孩子指着画上的神像问母亲，那神怎么没有脸，母亲慌忙捂住他的嘴。那孩子挣开手，又指着画上一个跪着的人问，那人怎么没有头，母亲这回索性抱起孩子快步走开。城墙脚下，有两个书吏正提着浆糊桶，把昨晚被风雨揭掉的画角，重新仔细糊上，一面糊一面还抬头端详，生怕贴歪了。越是声势浩大，越显出心里发虚。真正强盛的国度，哪里用得着把牛皮贴满城墙。贴牛皮的浆糊用得凶，官办的糊坊日夜赶工，四邻的住户都被征了浆子去。"
 SUM_Neo.260.a:"加速造神的工序"
 SUM_Neo.260.b:"暂缓，先看住学院"
 SUM_Neo.261.t:"课核士论"
 SUM_Neo.261.d:"教令院取士的规矩，如今也改了。往日里学生升迁，全凭学问高低，文章写得好，便有人举荐。如今却不同，先要查你平日里说过什么话，读过什么书，对造神之事是拥护还是腹诽。这一句思想，比学问还要紧。有个生论派的用功学生，文章做得花团锦簇，只因私下里叹过一句新神不像神，便被压了三级，同窗都升上去，独他还在原处守着一架旧标本柜。这样一来，学生们谁还肯用心读书，一个个都学那逢迎的口吻，把拥护的话说得比谁都响。到了考校当日，人人争着表忠，把造神的好处背得滚瓜烂熟，倒把真正的学问抛在脑后。主考的官儿听得满意，连连点头，当场便点了几个善表忠的做了榜首。榜首几人上任后第一件事，是把落榜的考卷搜了烧掉，说免得流出去惹是非。"
 SUM_Neo.261.a:"调集全部资源"
 SUM_Neo.261.b:"留一手，别赌上须弥"
 SUM_Neo.262.t:"尊学为国"
 SUM_Neo.262.d:"话说净善宫旁那座旧庙，香火断了。几个孩童趁先生不留神，嘴里偷哼旧日的祈祷歌，被先生听见，沉下脸来，罚抄书十页。自此再没人敢唱。要知这歌为何唱不得，还得从新法说起。大贤下一道令，教令院立成了须弥国教，但凡祭祀讲学，一应以教令院的规矩为准。草神小吉祥草王是须弥的神，连她这圣所也保不住了。旧庙原是供奉草神的地方，如今改成了学堂：神像搬走，供桌撤去，地上摆满一排排书案。有几个白胡子老祭司舍不得，跪在门口不肯起，被兵卒连拖带拽赶开。他们也不走远，蹲在墙根底下，望着搬空的圣所，眼泪一把一把往下掉。有几个胆大的信众上前理论，守门兵卒一顿呵斥，也只得含恨退下。打这天起，净善宫旁再听不见祈祷的歌声，只有学馆里的读书声，一日响过一日。风从列柱沙原那头刮来，卷起一股香料气，吹过空荡荡的供台。"
 SUM_Neo.262.a:"让新神更快睁眼"
 SUM_Neo.262.b:"把风险压在柜子里"
 SUM_Neo.263.t:"党卫为旅"
 SUM_Neo.263.d:"教令院新募了一支人马，不归须弥的军队节制，只听贤者的号令，唤作贤者亲军。这班人马皆是精挑细选，吃得饱，饷银足，身上穿的是黑甲，手里拿的是利刃。操练起来，脚步声如打雷，一列过去，地面都在抖。城中的正规军见了他们，也要让三分，只因这亲军只对贤者一人效忠，连大将的话也不买账。手握刀兵的人若只知有贤者，不知有国，那祸根便埋下了。有一回两军在街上起了口角，亲军拔刀就刺，旁人都不敢上前劝。后来还是一位领兵的将军出面，好说歹说，才把两边劝开，可从此两军之间结下了梁子。一支军队若目中无人，只知仰仗贤者的鼻息，早晚会闯出大祸来。那梁子结下后，两军换防都错开日子，谁也不肯与谁同营，营中间隔着三里地。"
 SUM_Neo.263.a:"加速造神的工序"
 SUM_Neo.263.b:"暂缓，先看住学院"
 SUM_Neo.264.t:"以惧治民"
 SUM_Neo.264.d:"如今的须弥，靠两样东西管着百姓：一是刀兵，二是恐惧。夜间城里熄灯早，街上静得怕人，偶尔一声犬吠，都能叫人打几个寒噤。人们见面不敢多说，走路不敢回头，连睡梦里都不敢胡思乱想。先前花神诞祭时，满城的人还敢唱歌跳舞，还敢议论国事，如今呢，连做一个梦都要小心翼翼，生怕梦里说了什么，被那虚空终端听了去。有个老妇人夜里梦见了从前的热闹，醒来竟吓得出了一身冷汗，赶紧告诉了儿女，叫他们千万别声张。到了白日，街上的告示又添了新条，说做梦也是要留心的，凡有异梦，须得禀报。有个卖豆腐的，因说了句昨夜梦见涨水，便被带去问了一堂，回来时脸白得像纸。那卖豆腐的后来把豆腐挑子改成了木匠铺子，问起缘故，只说梦见涨水不吉利。"
 SUM_Neo.264.a:"调集全部资源"
 SUM_Neo.264.b:"留一手，别赌上须弥"
 SUM_Neo.265.t:"一人蔽日"
 SUM_Neo.265.d:"教令院这些年来，把须弥的大小事务，一根一根都抓在自己手里。钱粮出于谁手，它管；军队听谁号令，它管；就连百姓读什么书、说什么话，它也要管。城中有一根看不见的线，一头系在教令院，一头系着每个人的脖颈，贤者轻轻一扯，那人便得跟着走。有不服的，线一收紧，便喘不过气来。这须弥国就好比一个木偶戏台，教令院是那提线的艺人，满城百姓都是台上傀儡，举手投足，无不由人。你若不信，但见那市井之间：卖菜的吆喝几声，便有人记下；孩子哭闹几句，便有人登门。人人都在那根线上系着，动弹不得。从前百姓见了官，尚敢辩两句理，如今连抬头看一眼都不敢。登门的人也记着册子，谁家几口、几间房、几只羊，册上列得明明白白，日日更新。"
 SUM_Neo.265.a:"让新神更快睁眼"
 SUM_Neo.265.b:"把风险压在柜子里"
 SUM_Neo.266.t:"教令院不泯"
 SUM_Neo.266.d:"教令院为把权柄坐实，竟宣告天下，说教令院的统治与须弥同在，须弥不亡，教令院不倒。这话贴在各处的告示上，写得堂而皇之。有那明白人看了，私下里冷笑：这分明是把须弥当作自家的私产，把百姓当作自家的奴仆。城里有位老学者，看了告示，久久不语，末了叹道，从前须弥是众人的须弥，如今却成了教令院的须弥。旁边的人听了，脸都变了色，慌忙拉他走开，生怕隔墙有耳。这等话本不敢说，如今偏有人说出来，可见人心思变。那老学者回到家，关上门，半晌没言语。老伴问他怎么了，他只摇头，说这世道，越来越不讲理了。第二日，他便称病不出，连教令院的课也不去讲了。他称病的日子，家里的书一本本装箱，老伴问，他说潮湿，得晾晾。"
 SUM_Neo.266.a:"加速造神的工序"
 SUM_Neo.266.b:"暂缓，先看住学院"
 SUM_Neo.267.t:"营此神座"
 SUM_Neo.267.d:"净善宫中那尊人偶之神，终于被扶上了王座。但它虽坐在宝座上，却是个空壳，全凭教令院在背后牵线。奇妙：须弥如今有了一个可以被下令的神，又有了一个专管下令的学院。神在台前受万人朝拜，教令院在幕后发号施令，一个装样子，一个掌实权。每逢大典，那神端坐不动，贤者在旁边念一句，神便点一下头，众官员俯首称是。有眼睛尖的，看出神的眼珠其实是空的，只是不敢说。每逢初一十五，百官还要齐齐上表，称颂神明英明，那表章写得花团锦簇，其实都是教令院授意。神在台上听得呆呆的，也不知说的什么，只管点头。有几个心思活的官员，已经琢磨着如何攀上贤者这座高枝。攀高枝的头一个果然升了官，上任当日衙门口的鼓换了面新的，敲起来格外响。"
 SUM_Neo.267.a:"调集全部资源"
 SUM_Neo.267.b:"留一手，别赌上须弥"
 SUM_Neo.268.t:"教令院代秉"
 SUM_Neo.268.d:"神是造出来了，可怪就怪在，谁也不肯真让它掌权。那些贤者原指望造个听话的傀儡，谁知神造出来后性情不定，越发不敢放手。于是教令院想了个名目，宣称神年幼，须由贤者代管国事，唤作以神之名摄政。这一摄政，便没了尽头，今日说神未长大，明日说神需静养，一字拖下去，权柄便牢牢攥在贤者手里。名为摄政，实为夺权，那神不过是个摆设，供在台前，替贤者的每一道命令作个幌子。百姓们起初还当神明真有旨意，后来才渐渐看出门道：凡神点头的事，多半是贤者先定了的。城里有句俏皮话，说神是块牌位，贤者是那烧香的人，牌位端着不动，香火却都落进了烧香人的袖里。俏皮话传到第三日，说的人少了，因为说的人里有两个被人叫去问了话。"
 SUM_Neo.268.a:"让新神更快睁眼"
 SUM_Neo.268.b:"把风险压在柜子里"

 #################### 沙与林 · 军备外交 ####################
 SUM_PL_Sands_and_Crowns:"沙林两地"
 SUM_PL_Sands_and_Crowns_desc:"教令院的一道敕令，同时贴上雨林的树干与沙漠的土墙。贴的人一手拿糨糊，一手拿刷子，雨林里贴得歪，沙漠里贴得正。有个沙民凑过去看，问贴的什么，贴的人道：「往后，都一样了。」从此城里的与旷野的，都要照同一条律法过日子。"
 SUM_PL_Int_Puppet:"开府治事"
 SUM_PL_Int_Puppet_desc:"教令院在沙漠里设了总督府，一座四合大院，门口立着两只石兽。四家傀儡国的诏令都从这里发出，写好了盖上印，派快马送去。院子里整日有人进出，出来时腰都弯着。有个新来的差役腰杆挺得直，被老差役一拍后背：「弯点，这是总督府。」"
 SUM_PL_Int_Integrate:"苍漠归疆"
 SUM_PL_Int_Integrate_desc:"苍漠囿土到底并进了须弥的行省。并的当日，界碑拔起来，换了一块新的，字是凿的。沙民围在边上看，有个伸手摸了摸新碑，说道：「这石头凉。」从此税吏来得勤了，路引也认这地方的章。有个老沙民望着新碑，半晌才道：「换了主儿了。」"
 SUM_PL_Int_Autonomy:"沙部自专"
 SUM_PL_Int_Autonomy_desc:"一个后生挤上前问：「这张纸，真能作数？」老汉便把那卷黄纸举得老高：「三个印戳在上头，还会是假的？」守村人盼了多少年，这自治的文书总算到了手，一卷黄纸揣在怀里，走一路摸一路，只怕弄丢了。回村当众念给大家听，念到「自行处置」四个字，满院子的人齐声松了口气。"
 SUM_PL_Int_Border:"画定封疆"
 SUM_PL_Int_Border_desc:"商道与绿洲的边界又重新画过一回。画界的人带着绳尺，一处处量，量完在沙上插木桩，桩头涂红。有两处争执不下，便把绳子拉直了让两边看。看完了，各自退了三步。有个老沙民盯着那红桩看了半晌，嘀咕：「这红，是为谁涂的？」"
 SUM_PL_Int_Tax:"定沙赋式"
 SUM_PL_Int_Tax_desc:"有个老农当着税吏的面咧嘴笑了，笑完自己先愣住，赶紧抬手把嘴抹了一把。沙漠的税则换了新的章程，往后照着收成来计，不再按人头摊派。头一年过去，遭旱的人家少缴一半，粮食多的多缴些。村里的老账房拿算筹拨弄半晌，点头道：「这回的账，算得公。」"
 SUM_PL_Int_Garrison:"营中屯锐"
 SUM_PL_Int_Garrison_desc:"如今商队过这绿洲，稳当多了：骆驼不再丢，走夜路也敢生火做饭。原来教令院在边上驻了兵，营盘离水源三里，好田一分不占。只是每过一道卡便得缴钱，比往常多出不少。有个跑买卖的拨着算盘道：「安稳是要花钱买的。」有人笑他抠，他把算盘一合：「不是抠，是本钱。」"
 SUM_PL_Int_Road:"沙海置邮"
 SUM_PL_Int_Road_desc:"驿道从须弥城一路铺到列柱沙原。铺路的石从北山拉来，一块块砸实，砸一段验一段。修到第七十里，遇上一片流沙，工匠只好改道绕行。绕的那一弯，后来成了歇脚的地方。有个赶驼的在那弯里卸货歇脚，笑道：「这弯，倒救了咱们。」"
 SUM_PL_Int_Union:"沙林同风"
 SUM_PL_Int_Union_desc:"「这酒，真烈！」雨林来的人咳了两声，到底还是干了，抹着嘴道。合并当日，两边各派代表在城门口对坐，先换文书，再换酒盏。沙漠的人喝了雨林的甜汤，也一饮而尽，咂嘴道：「这汤，倒甜。」两边相视一笑，雨林与沙漠从此合成了一个须弥。"
 SUM_PL_Int_Final:"须弥一统"
 SUM_PL_Int_Final_desc:"「先生，真不用再画了？」年轻弟子忍不住问。先生点点头，手却在封皮上摩挲了许久。须弥全境到底归进一册图里，厚三指，翻开三十六幅，山水路村井，样样标着。画图的学者在末页题了一行小字：此后无须再画。合上册子，屋里静了半晌。"
 SUM_PL_Ere_Contract:"旅团立券"
 SUM_PL_Ere_Contract_desc:"教令院与镀金旅团重订了契约。这一回条款写得极细，连谁管饭、谁修刀、伤了谁赔，都一条条列明。旅团头领看了半日，指着其中一款问道：「这条，怎么说？」答的人也答得细。头领点点头，末了两边按了手印，指头上的墨还没干就握了手。"
 SUM_PL_Ere_Nationalize:"旅团入籍"
 SUM_PL_Ere_Nationalize_desc:"镀金旅团编进须弥的序列，从此有了名号，有了饷，也有自己的营房。老佣兵把旧甲收进箱底，穿上新号衣，站在队里总觉得肩头发痒，伸手挠了挠。教头喊：「立正！」他把腰一挺，倒也像回事。旁边人憋着笑，没敢出声。"
 SUM_PL_Ere_Officer:"募卒拜将"
 SUM_PL_Ere_Officer_desc:"打过仗的佣兵被送去学堂，坐在矮凳上，握笔像握刀。教习在板上写阵图，他们看着看着，伸手在桌上比划，把桌子拍得咚咚响。学上半年，出来便是军官，肩上多了道杠。头一回领兵，喊的还是沙里那几句，兵士们听不懂，却也照样动。"
 SUM_PL_Ere_Weapon:"沙海缮甲"
 SUM_PL_Ere_Weapon_desc:"沙海的兵器坊开了工，炉子一烧，半条街都热。打出的刀不上油，刀口在光下一照，齐得像一条线。老师傅说道：「教令院的图纸画得再细，也细不过手上分寸。」验刀的拿布一割，布断刀不卷。围观的人齐声喝彩，老师傅却只顾擦他的锤子。"
 SUM_PL_Ere_Scout:"沙碛遣谍"
 SUM_PL_Ere_Scout_desc:"沙漠的斥候替须弥看边。凡与邻国接壤的沙口，一处处都有人蹲着，白日藏在岩后，夜里贴着沙走。回报的话极短，只说几个人、几匹马。有一处沙口三年没动静，照样守着。有人问守它做什么，斥候道：「没动静，才要守。」"
 SUM_PL_Ere_Legion:"旅团成旅"
 SUM_PL_Ere_Legion_desc:"镀金军团成军当日，旗子抬出来，一面绣须弥纹，一面绣族徽，针脚密得看不出接头。旗一展，风从底下兜上来，两面图案一齐翻。老兵看了，眼圈有点红，赶紧低头整甲，嘴里嘟囔：「风大，迷了眼。」旁边人听了，也都没说话。"
 SUM_PL_Ere_Pay:"如期给饷"
 SUM_PL_Ere_Pay_desc:"军饷按月发下，一日不拖。发饷当日，账房在门口摆张桌，一个个点名，点到便递一小袋。有个佣兵接过，没往怀里塞，先解开数了一遍。数完笑道：「这辈子头一回，是拿的，不是抢的。」旁边人拍他肩膀，他也没恼。"
 SUM_PL_Ere_Loyal:"旅团输诚"
 SUM_PL_Ere_Loyal_desc:"镀金旅团向须弥效了忠，条件只一条：须弥得认他们的血。这话是头领当着众人说的，说完把刀横在案上。贤者们面面相觑，末了在文书上添了半行。添的那半行，是阵亡者的名字入册。头领看了那半行，伸手把刀收了回去，拱手道：「够了。」"
 SUM_PL_Ere_Banner:"金砂张帜"
 SUM_PL_Ere_Banner_desc:"金砂旗升起来了，旗杆立在营门口，绳子一拉，旗便往上走。旅团的人站左边，须弥的兵站右边，中间空着三尺。教头喊了声：「合队！」两边往前挪三步，肩碰着肩。有人没忍住笑了一声，赶忙又站直，把笑憋了回去。"
 SUM_PL_Arm_Draft:"下括丁令"
 SUM_PL_Arm_Draft_desc:"征兵令颁下，雨林与沙漠各按人口出丁。册子先造，男丁几口写得明白。抽签在祠堂前，签筒一摇，摇出谁便是谁。抽中的接了红布条，回家收包袱。抽不中的低着头，不知是庆幸还是惭愧。有个娘拽住抽中的儿子，塞给他一把炒米，没哭出声。"
 SUM_PL_Arm_Training:"日夕训武"
 SUM_PL_Arm_Training_desc:"操练场建在城郊，一片平地，四角立着望杆。天不亮就起号，号一响，满场都是脚步。教头嗓门极大，喊一声能传到河边。附近人家起初睡不着，半月后便听不见了，反倒拿这号声当报时。有个老妇听着号响，说道：「该起来烧火了。」"
 SUM_PL_Arm_Ranger:"林薮出锐"
 SUM_PL_Arm_Ranger_desc:"猎兵是从巡林队里挑的。挑的法子也怪，不看力气，只看走路：进林子走一遭，出来时枝叶不动、脚上不沾泥的，就挑上。这些人打仗不列阵，散在树后，一箭一个。敌兵进了林子，先迷路。有个被射中的还不知箭从哪来，只顾着拨拉草丛找路。"
 SUM_PL_Arm_Artillery:"弩铳并列"
 SUM_PL_Arm_Artillery_desc:"「你倒不怕炸？」弩手回敬一句。老炮手嫌弩炮慢，嘟囔：「这玩意儿，急死人。」校场上一字排开，左边木弩炮，靠绞盘；右边铁火炮，靠火药，两样隔着十步，各打各的靶。教头站在中间，谁的话也不听，只管喊：「各自装填！」"
 SUM_PL_Arm_Tank:"沙旅重铠"
 SUM_PL_Arm_Tank_desc:"装甲车头一回在沙地上跑，履带一压，沙往两边翻。跑出两里，陷进软沙，众人拿板子垫，垫了半个时辰才出来。出来接着跑，过三道沙丘，车身蒙了一层黄。有个老驼工看了半天，叹道：「头回见车能过沙丘，咱们的驼，怕是要歇着了。」"
 SUM_PL_Arm_Air:"须弥习飞"
 SUM_PL_Arm_Air_desc:"「值！」头一回试飞下来，那人手抖得端不住碗，嘴上却硬得很。须弥的空军成立，驾机的不从军里挑，专从素论派挑看星位准的。后来再看星，他对同伴说：「这星，比从前近了。」同伴笑他：「你是离得近了。」"
 SUM_PL_Arm_Industry:"立军械坊"
 SUM_PL_Arm_Industry_desc:"兵工厂开了工，头一批枪下线当日，厂里挂红。枪身新，木托上还带刨花味。验枪的一支支试，试到三百支，手都麻了。管事的说道：「往后，不必等北边的船了。」这话传出去，枪价当夜就落了三成。有个枪贩子直跺脚：「这生意，没法做了！」"
 SUM_PL_Arm_Staff:"设总戎幕"
 SUM_PL_Arm_Staff_desc:"总参谋部成立了，屋里挂满地图，桌上摆着沙盘。参谋昼夜轮值，把沙口、水井一一标出。从此打仗不再等贤者兴头上的话，要按图按令。有个老贤者看了半日，走时丢下一句：「这屋里，没有神。」众人听了，都没接话。"
 SUM_PL_Arm_Modern:"改练新式军"
 SUM_PL_Arm_Modern_desc:"须弥的陆军成了型。队伍里有猎人，有佣兵，有学者，也有沙民。猎人认路，佣兵认命，学者认图，沙民认水。四种人凑一处，头一个月吵得不可开交，第二个月便同锅吃饭。教头蹲在锅边说道：「这就叫军。」"
 SUM_PL_Nav_Port:"奥摩斯港舣舟"
 SUM_PL_Nav_Port_desc:"奥摩斯港扩了又扩，泊位一直排到灯塔之外。栈桥是新打的，木桩还渗着树脂。船一多，港口就吵，扛包的、喊价的、骂人的，混成一片。管港的书吏拿着册子跑前跑后，跑得鞋底都薄了，抹把汗道：「这港，快装不下喽。」"
 SUM_PL_Nav_Dock:"葺治船宫"
 SUM_PL_Nav_Dock_desc:"船坞开了工，须弥头回造自己的船。龙骨是北山伐的老木，抬进来要二十人。钉钉的是个老匠，一锤一锤，极慢。有人催他，他说道：「船要下海，急不得。」船下水当日，岸上站满人，没人说话。等船稳稳浮住，才轰然叫起好来。"
 SUM_PL_Nav_Fleet:"须弥治舟"
 SUM_PL_Nav_Fleet_desc:"须弥的舰队成了军，旗号挂在奥摩斯港最高的桅杆上。风一大，旗展开来，港里港外都看得见。水手按册编了队，头回列队上船，脚步踏得栈桥直晃。老船主在岸上捋着胡子看，叹道：「这阵势，从前没有。」"
 SUM_PL_Nav_Gun:"巨舰负铳"
 SUM_PL_Nav_Gun_desc:"舰队定了章程，走的是巨炮一路。炮身铸了半年，试炮当日，炮口一响，海面塌下去一个坑，浪头扑上甲板。看的人耳朵嗡嗡响了三天。有人捂着耳朵问值不值，管炮的说道：「口径大一分，话就少一句。」那人不懂，管炮的也不再解释。"
 SUM_PL_Nav_Trade:"通海之途"
 SUM_PL_Nav_Trade_desc:"奥摩斯港里，海运渐渐开张，香料与瓷器一箱箱抬上大船，压得船舷沉沉吃水。艄公解开缆绳，乘风便往七国码头而去。这一趟买卖，赚个盆满钵满。回来当日，艄公站在船头，冲岸上的人喊：「货卖了个好价！」"
 SUM_PL_Nav_Customs:"新关初置"
 SUM_PL_Nav_Customs_desc:"「活该，谁让他不走正道。」守卡的对同伴说。那走私的船家望见关卡，哪里敢靠岸，夜里绕道走了。奥摩斯港新设了关卡，凡进出的船都得验关牒、缴税银才放行。守卡的笑了一声：「这一招，断了他的活路。」"
 SUM_PL_Nav_Whale:"鲸涛叵测"
 SUM_PL_Nav_Whale_desc:"「那鲸背上，似有伤痕。」探路的船回来报了这么一句。事情要从远海说起：一头巨鲸发威，撞翻了一艘商船，人和货全掉进水里。消息传回须弥，教令院忙派船去看，要弄清是天灾还是另有蹊跷。众人听了，都觉得这事透着古怪。"
 SUM_PL_Nav_Admiral:"置水师塾"
 SUM_PL_Nav_Admiral_desc:"老教习指着星道：「认得这个，风浪里就有一条活路。」港口新开了海军学堂，专教驾船的学问。学员先认风向，再观星斗，夜夜对着天穹比划。这观星识风的本事，到了风浪里，果然能救人一命。"
 SUM_PL_Nav_Sea:"海上立邦"
 SUM_PL_Nav_Sea_desc:"须弥船队浩浩荡荡驶出奥摩斯港，扯满风帆，沿海路直奔七国码头。船头劈开波浪，水手齐声吆喝：「起锚！」号子一阵接一阵，把须弥的名号，一路播到海外诸邦。"
 SUM_PL_Dip_Liyue:"璃月来聘"
 SUM_PL_Dip_Liyue_desc:"璃月使者拿起一块矿石：「这块，成色如何？」须弥的官儿接过来掂了掂，报了个数。璃月遣使来，随行带了几箱矿石样品，宾主坐定也不客套，开口便谈矿脉怎么开采、商道怎么打通，讨价还价，说的都是实在话。"
 SUM_PL_Dip_Inazuma:"稻妻互市"
 SUM_PL_Dip_Inazuma_desc:"「这刀，怎么卖？」须弥商人拿起一把刀，对着光照了照。船主伸出两根指头，商人便皱起眉。稻妻的商船渐渐靠了奥摩斯港，船上一水的刀与绸，刀淬得雪亮，绸缎光可鉴人，围观的市井啧啧称奇。"
 SUM_PL_Dip_Natlan:"界接纳塔"
 SUM_PL_Dip_Natlan_desc:"「凭文书！」须弥的官儿回道。纳塔的首领喊：「这地，凭什么归你？」沙口之地，两边人马对面扎营，旌旗相望，剑拔弩张，主事的勒马相持，谁也不肯先退半步。这片沙口本是无主之地，如今倒成了是非窝。"
 SUM_PL_Dip_Fontaine:"取法枫丹"
 SUM_PL_Dip_Fontaine_desc:"「这东西，怎么就自己转了？」年轻学子指着图上一处问。枫丹匠人笑而不答，只把图纸卷得更紧。枫丹遣来几名巧匠，怀里揣着一卷卷图纸，画的尽是精巧机括，齿轮咬合，机关转动，须弥学者看了半日，连声称奇。"
 SUM_PL_Dip_Snezhnaya:"朔北潜影"
 SUM_PL_Dip_Snezhnaya_desc:"「这底下，装的什么？」验货的敲了敲车板问。「些许零碎，不值一提。」商队头儿赔着笑答。至冬的商队进城，货物堆了满满一车，教令院的人验货时，觉出车底藏着别的东西，翻来覆去查了三遍。那商队的人面上陪笑，额角却沁出了汗。"
 SUM_PL_Dip_Mond:"蒙德互市"
 SUM_PL_Dip_Mond_desc:"「掌柜的，赏一碗尝尝？」几个馋嘴的围在车边讨酒。蒙德来的商队一路上迤逦而行，车上载着风车与酒。那风车见风就转，咯咯作响，引得孩童追着跑；酒坛封泥一启，香味扑鼻，围观的人直咽口水。蒙德人笑着舀了一勺递过去，几人仰头饮尽，抹嘴赞了声好。"
 SUM_PL_Dip_League:"七邦同文"
 SUM_PL_Dip_League_desc:"「这主意好，一国的学问，成了七国的。」老学者捋须笑道，当下收拾行囊要去走一遭。须弥首倡七国学术联盟，广发文书，邀各国学者往来，今日你来讲学，明日我去访师，卷帙互通，见闻日广。"
 SUM_PL_Dip_Aid:"援及邻邦"
 SUM_PL_Dip_Aid_desc:"「这碗粥，救了一家老小！」一个老者捧着粥碗，手直抖，哭道。邻国遭了灾荒，饿殍遍野，须弥不忍坐视，忙筹了粮米草药装车送去。灾民见了粮车，齐齐跪下磕头，须弥的人赶紧上前扶起。"
 SUM_PL_Dip_Voice:"远扬声教"
 SUM_PL_Dip_Voice_desc:"七国议事，往日哪有须弥的座位。如今须弥的使臣端坐席间，开口便议天下大事，字字有所倚仗。他一开口，满座都静了静。这声音来得不易，皆因国力渐渐强盛，再没人敢把须弥当小邦看。"
 SUM_PL_Won_Surasthana:"净善宫重葺"
 SUM_PL_Won_Surasthana_desc:"「这柱子非照原样换不可。」老匠手扶朽梁，说得斩钉截铁。净善宫年头久了，梁柱朽坏，瓦砾遍地。教令院请来巧匠修缮，匠人搭起高架，一砖一瓦细细拾掇，务必要恢复从前的模样。那老匠把尺寸反复量了三遍，才肯落锯动工。"
 SUM_PL_Won_Alcazarzaray:"无郁夷摩宫"
 SUM_PL_Won_Alcazarzaray_desc:"卡维的无郁夷摩宫再度开工，这一回银钱宽裕，工匠齐全，再没有债主上门催讨。卡维立在工地上，指点画策。有个工匠来报尺寸，他接过一看，笑了：「这回，不差了。」脸上终于见了笑意，把旧日的遗憾一一补齐。"
 SUM_PL_Won_Ormos:"奥港座舟"
 SUM_PL_Won_Ormos_desc:"奥摩斯港外，那艘座舰的桅杆重新竖起，缆绳绷得笔直，风帆高悬。水手爬上桅杆，忙着调索具。有个在顶上喊：「绳子再紧些！」底下的人便一齐拽。这桅杆一立，须弥的海上威风便又回来了。"
 SUM_PL_Won_Industry:"百工竞作"
 SUM_PL_Won_Industry_desc:"须弥城外，烟囱一日多过一日，黑烟袅袅升起，把半边天都熏灰了。工匠开工造物，烧的却是煤。有个细心的学者拨起算盘，算来算去，皱眉道：「这煤，只怕不够烧上半年。」旁边人听了，也都沉了脸。"
 SUM_PL_Won_Mine:"沙中凿冶"
 SUM_PL_Won_Mine_desc:"早先须弥用铁，样样求人，得看别家脸色。如今沙漠深处的矿脉一处处开挖，铁石一车车拉回城，腰板这才硬了起来。老铁匠拿起一块新出的铁掂了掂，脸上有了笑意：「这铁，是咱自己地面上出的。」"
 SUM_PL_Won_Wood:"输木与香"
 SUM_PL_Won_Wood_desc:"须弥的生财之道，如今靠两样：一是雨林的木材，一是沙海的香料。木材盖屋造船，香料远销海外，两样撑起半壁财源。有个老商人算了笔账，笑道：「这就好比人添了两条腿，走得稳当。」"
 SUM_PL_Won_Craft:"百工竞起"
 SUM_PL_Won_Craft_desc:"「手艺攥在手里，总得有人接着。」老织锦匠一边教徒弟，一边叮嘱。从前那些快断了香火的旧手艺，如今又被捡了起来，织锦的、制陶的、打金的，都挂上了匠人名号，受人敬重。名分一立，手艺便能一代代传下去。"
 SUM_PL_Won_Great:"大营宫室"
 SUM_PL_Won_Great_desc:"「多打进去些，这桥得撑几百年！」老工匠立在桥头高声喊。原来须弥起了个大愿，要在雨林与沙漠间架起一座长桥，免得两边来往绕远路、受跋涉之苦。工匠们勘了地势，打下木桩，昼夜不停地赶工。这一天堑，到底化成了通途。"
 SUM_PL_Won_Legacy:"须弥旧泽"
 SUM_PL_Won_Legacy_desc:"「一笔一划，都是留给后人的。」一个书吏抄得手腕发酸，撂下笔叹道。须弥把这些年的旧事搜罗齐了，编成典籍，抄书的人伏在案上不停地写，墨汁一缸接一缸地用。这典籍一代代传下去，后人便清楚自家的根从哪儿来。"
 SUM_PL_The_Sands_and_the_Leaves:"沙林辑睦"
 SUM_PL_The_Sands_and_the_Leaves_desc:"雨林与沙漠，如今同守一条律法，再不似往日动辄拔刀相向。须弥的城与旷野之间，头一回不用刀剑说话，只用道理分辩。有个老沙民同雨林的人喝了回酒，叹道：「这等光景，委实难得。」"

 SUM_Neo.269.t:"一令两悬"
 SUM_Neo.269.d:"教令院为显威风，把新颁的敕令，一式两份，一份贴在雨林的大树上，一份贴在沙漠的土墙上。雨林那边树高林密，告示贴上去，被雨水泡得发皱，也没人来揭；沙漠那边日头毒，纸晒得发黄卷了边，也没人敢撕。这一纸文书，是要把须弥的城池与旷野，一并压在同一条律法底下。从前沙漠自有沙漠的规矩，雨林自有雨林的习俗，如今一律不许，都得听教令院的。有赶路的商队看了告示，只当没看见，低头加紧赶路。雨林里有个老酋长，气得把门前的告示扯了下来，可没过两日，新的又贴了上去，比先前还大。沙漠的族长们也聚在一处商议，议来议去，终究没敢把那纸揭了，只在背地里叹气。族长们散会时把那纸抄件传看了一遍，看完折好，各揣进怀里最贴身的地方。"
 SUM_Neo.269.a:"以武力压服"
 SUM_Neo.269.b:"以德政感召"
 SUM_Neo.270.t:"沙督受命"
 SUM_Neo.270.d:"教令院在沙漠腹地新设了一座总督府，高墙深院，门口站着两队黑甲兵。府里住着一位总督，凡沙漠四国的诏令，都从这里发出。这四国表面上是自主的邦国，各有各的王，其实不过是须弥手里四个牵线的木偶。总督府里的书吏，每日誊写诏令，写好盖上印，便由快马分送四处。那四国的王接到诏令，只会照抄一遍，贴出去让百姓看。有个沙漠老人看了诏令，撇撇嘴说，这分明是人家替我们做的主意，可话到嘴边，又咽了回去。总督府门前，每日来求见的人排成长队，有送钱的，有告状的，可多半连门也进不去。那总督深居简出，偶尔出来巡视，也是前呼后拥，百姓远远望见，都避到一旁。避到一旁的人里，有个老者看得直摇头，说这排场，从前须弥的官是受不起的。"
 SUM_Neo.270.a:"先立威"
 SUM_Neo.270.b:"先立信"
 SUM_Neo.271.t:"苍漠归疆"
 SUM_Neo.271.d:"苍漠囿土那一片地方，原本是沙漠中一处自由自在的所在，如今被教令院一纸命令，划作须弥的一个行省。这一来，当地的人便从主人变成了属民。官差带着图册挨家丈量土地，插上界桩，说是要按新规矩收税。有世居此地的老族长，气得胡子直抖，说这地是我们祖辈留下的，凭什么归了须弥。官差只说这是王命，抗命者斩。疆土一易主，百姓便遭殃，从前唱惯的歌，如今不敢唱了；从前走惯的路，如今要交钱了。苍漠囿土的年轻人，被编入须弥的军队，开拔时，老人们追着送出好几里，哭声震天。有首歌原是唱沙漠自由自在的，如今谁若唱起，便有人说这是心怀故土，要报告官府，久而久之，连那歌调都快失传了。那歌调后来只在沙漠最深处的帐子里唱，唱时把门帘压低，鼓点也放得极轻。"
 SUM_Neo.271.a:"由教令院决断"
 SUM_Neo.271.b:"交由地方自理"
 SUM_Neo.272.t:"沙部自专"
 SUM_Neo.272.d:"沙漠里有几个村子，向来由守村人照看，算是自主惯了。这回教令院为了笼络人心，竟发下文书，许他们自治。守村人接过那卷文书，翻来覆去看了几遍，虽不大识字，却也明白了个大意：村中琐事，仍由村人自理。村里的老人见了，稍稍松了口气，说总算保住了祖上的一点体面。可也有明白人提醒，这自治是人家赏的，今日能赏，明日便能收。凡是由上头赐下的恩典，终究握在上头手里，守村人捧着文书，心里到底是喜是忧，自己也说不清。村里的年轻人倒有些欢喜，以为从此可以少受些管束，可没过几日，收税的官差照样上门，披甲的兵马照样过境，方才明白那文书不过是一张废纸。守村人把文书收进木箱，叹了口气。那木箱后来锁了，钥匙挂在房梁上，守村人每逢初一，取下来擦一遍锁。"
 SUM_Neo.272.a:"以武力压服"
 SUM_Neo.272.b:"以德政感召"
 SUM_Neo.273.t:"量地正疆"
 SUM_Neo.273.d:"教令院遣了测绘的官儿，带着罗盘图册，把沙漠里的商道与绿洲的边界，一处一处重新画清。这边界一画，添了许多麻烦。从前商队赶路，哪里有水便在哪里歇脚，如今哪里是官道，哪里是地界，都有明文，走错一步便要受罚。有绿洲边上的农户，昨日还在自家地里浇水，今日一量，竟成了官家的地，要纳租子。这边界画得越清，百姓的活动便越窄，从前那点随心所欲的自在，从此一去不返。有一处绿洲，原本是几户人家共用的，如今图上标作官地，那几户人家一夜之间成了佃户，还得向官府交租。他们捧着旧地契去找官儿理论，官儿把图册一摊，说这上头写得明白，任你如何分说，也休想改。有个倔老汉把旧地契顶在头上走了三趟，末了一趟，连门房都不让他进了。"
 SUM_Neo.273.a:"先立威"
 SUM_Neo.273.b:"先立信"
 SUM_Neo.274.t:"定沙赋式"
 SUM_Neo.274.d:"沙漠里征税的规矩，向来是按人头算，家里有几口人，便交几份粮。这法子苛刻得很，穷人家孩子多，交不起的只好逃走。这回教令院改了章程，说是按收成计税，收得多便多交，收得少便少交。乍一听，倒像是件好事。有个种椰枣的农人，头一年收成不好，果然少交了些，心里还暗暗欢喜。谁知到了第二年，官差来量收成时，把树上还没熟的果子也折了进去，算下来竟比按人头还多。规矩改得好看，执行起来却是另一回事，百姓的苦，半点也没少。那椰枣农人召了几个同伴，想去找官差说说理，可人家把账本一翻，条条都在理上，他们的话反倒成了无理取闹。众人只得忍气吞声，回到地里，望着满树果子发呆。满树的果子那年熟透了没人摘，落了一地，第二年的花开得倒比往年还盛。"
 SUM_Neo.274.a:"由教令院决断"
 SUM_Neo.274.b:"交由地方自理"
 SUM_Neo.275.t:"洲中结垒"
 SUM_Neo.275.d:"教令院在沙漠各处的绿洲边上，都驻扎了兵马。但见水边搭起了一座座营帐，黑甲兵牵着骆驼来回巡逻，戈矛在日光下闪着寒光。这一来，那些向来横行沙海的商队，竟都安静了。从前商队过绿洲，强买强卖，一言不合便拔刀相向，如今见了驻军，一个个都规规矩矩，按价付钱，不敢造次。这驻军原是为弹压，可也真个镇住了场面。只是商队安静归安静，那绿洲傍水而居的百姓，平日里被兵马惊扰，夜里也不敢点灯，苦不堪言。有一回，几个兵卒夜里扰了绿洲边一户人家，那家的老汉忍无可忍，去找驻军的头目理论，谁知反被扣了个滋事的罪名，捆在营门外示众。从此百姓见了兵，躲得比见了豺狼还快。有个老妇人夜里偷偷去给那老汉送水，被哨兵喝住，问她是甚么人，她只说：「给他送最后一程。」哨兵怔了怔，竟放她过去了。"
 SUM_Neo.275.a:"以武力压服"
 SUM_Neo.275.b:"以德政感召"
 SUM_Neo.276.t:"沙海置邮"
 SUM_Neo.276.d:"教令院为便于调兵传令，新修了一条驿道，从须弥城一直铺到列柱沙原。这条路用石板一段段铺成，宽得能并排跑两辆马车，路边每隔一段便立一根石柱，算是里程。修路时征发了不少民夫，沙地里日头毒，许多人晒脱了皮。路修成之后，快马三日便能跑到沙原尽头，从前要走半月。这驿道于用兵方便，可于百姓，却未必是福。路一通，官差来得勤了，税卡也跟着多了，过一回便剥一层皮。修路的民夫里，有不少是沙漠的百姓，他们顶着毒日头搬石头，吃的是粗糠，喝的是苦水，累倒了的便被丢在路边。路修成了，官家的快马一日数十趟地跑，可那些修路的民夫，多半再也没能回到自己的村子。有个民夫临走前在路边埋了半块干饼，说回来再吃，同行的人都别过脸去，没人敢应声。"
 SUM_Neo.276.a:"先立威"
 SUM_Neo.276.b:"先立信"
 SUM_Neo.277.t:"沙林同风"
 SUM_Neo.277.d:"教令院一番整顿，把雨林与沙漠两处地方，硬生生合成了一个须弥。从前这两地风俗各异，一个湿热多雨，一个干旱少水，百姓也各说各的话，各唱各的歌。如今一纸令下，便要不分彼此，同归一套律法管束。这合并说得好听，唤作大一统，做起来却难。雨林的人被征去守沙漠的关口，沙漠的人被调去修雨林的栈道，彼此都叫苦不迭。有老成的摇头说，把一个雨林一个沙漠捏到一处，看着整齐，终究是两股筋。雨林的人嫌沙漠的风沙太干燥，沙漠的人嫌雨林的瘴气太湿重，彼此看不惯，动辄口角。教令院却又下令，要两地互通婚姻，共纳同一样税，这一来，怨气更多，只是人人不敢明说罢了。有个雨林后生娶了沙漠姑娘，两家用两套礼数各办了一场喜事，喜酒喝到半夜，两边的亲戚已称了亲家。"
 SUM_Neo.277.a:"由教令院决断"
 SUM_Neo.277.b:"交由地方自理"
 SUM_Neo.278.t:"须弥一统"
 SUM_Neo.278.d:"教令院把须弥全境的山川、城郭、绿洲、沙丘，一乡一里都画进了一册图册。这图册是细，哪处有水，哪处有路，哪处住着多少户人家，都标得清清楚楚。这样的图册，从前是给行商指路用的，如今却成了官府管束百姓的凭仗。哪片地该纳税，哪个人该抽丁，都照着图册来查。全境归于一纸图册，把偌大一个须弥，缩成了几张薄纸，百姓的生死，便都写在纸上，由人随手涂抹。那图册每过一季便重画一回，哪处田要加税，哪处村要抽丁，全凭上头一句话。有管图册的书吏，暗地里把自家的田亩往少处改，被同僚告发，竟也抄了家。可见这薄纸一张，能定人生死。自此后，管图册的书吏每季对账，错了数字的当场锁拿，对簿的厅里，日日都有人跪着画押。"
 SUM_Neo.278.a:"以武力压服"
 SUM_Neo.278.b:"以德政感召"
 SUM_Neo.279.t:"旅团立券"
 SUM_Neo.279.d:"教令院与镀金旅团之间，向来有雇佣的契约。这回双方重订，条款写得比从前更细，几时集合，几时发饷，误了期如何罚，临阵退了如何办，一条一条，密密麻麻写了几十行。契约写得细，原是为免去扯皮，可也把旅团套得更紧。镀金旅团的首领看了那契约，冷笑一声，说这哪里是雇人，分明是卖身。可话虽如此，眼下须弥势大，不接受又没别的去处，只得按下手印。那契约末尾还写着，若旅团不肯为须弥尽忠，便要退还全部饷银，还要治罪。镀金旅团的几个首领凑在一处，就着油灯把那几十行字看了又看，越看越觉得像是一条绳索，可眼下不给饷银，连饭也吃不上，终究都按了手印。按完手印，有个头人把手往裤腿上擦了又擦，像要把那印泥擦掉，擦不掉，便把手揣回袖里。"
 SUM_Neo.279.a:"先立威"
 SUM_Neo.279.b:"先立信"
 SUM_Neo.280.t:"旅团入籍"
 SUM_Neo.280.d:"镀金旅团这些散兵游勇，向来是拿钱办事，谁给摩拉替谁卖命。这回教令院一纸命令，把他们编入了须弥的正规序列，从此不再是散伙，而是有名有册的官家兵马。旅团里有人欢喜，有人忧愁。欢喜的是从此有了固定的饷银，再不用四处找活；忧愁的是从此再不能挑主子，教令院叫打谁便得打谁。这编入序列，把这班游勇，从野路子收进了笼子。首领虽然心里不情愿，可瞧着那花花的饷银，到底还是应了。编入序列当日，旅团的兵士要换上须弥的号衣，有几个老兵死活不肯，说这身衣服穿上去，便不是沙漠的人了。后来还是首领发话，说人在屋檐下，不得不低头，众人才勉强换了。有个老兵换了号衣，对着河水照了照，把旧皮带解下来揣进怀里，道：「留个念想。」旁边的兄弟笑他婆妈，他也不恼，只道：「你们年轻时再看看。」众人都笑，笑着笑着便都不笑了。换衣当日，有个老兵把号衣抖开看了三遍，末了朝南边沙漠的方向拜了一拜，方才穿上。"
 SUM_Neo.280.a:"由教令院决断"
 SUM_Neo.280.b:"交由地方自理"
 SUM_Neo.281.t:"募卒拜将"
 SUM_Neo.281.d:"教令院想了个法子，把那些打过仗的老佣兵，一批批送进学堂读书。这学堂教的不是诗书，而是兵法、律令与教令院的规矩。学上一年半载，出来便授予军官的职称。这也算量才录用，让那只会砍人的粗人，学些带兵的本事。可也有那老佣兵，拿惯了刀，握笔如握锄头，坐在课堂里直打瞌睡。先生讲什么军令如山，他听着只当是耳旁风。待到挂着军官的牌子出来，手底下真带了兵，才知这学堂没白上。那老兵后来带兵，果然有一套，逢到险处，先让部下隐蔽，自己探路，把在沙场里滚出来的本事都用上了。只是他到底改不了粗脾气，一急起来便骂人，手底下那些读书出身的副官，听了直皱眉。有一日课上讲到行军布阵，那老兵忽把桌子一拍，站将起来，比划着说沙场上如何借风势、如何藏沙梁，一席话讲得先生也执笔细记，满堂肃然。"
 SUM_Neo.281.a:"以武力压服"
 SUM_Neo.281.b:"以德政感召"
 SUM_Neo.282.t:"沙海缮甲"
 SUM_Neo.282.d:"沙海里新开了一处处兵器坊，炉火昼夜不熄，打造刀枪甲胄。这班匠人原是沙漠里打惯了兵器的好手，手艺端的精巧。教令院送来图纸，他们照着打造，可打出来的刀，刀口竟比图纸上画的还准，锋利几分。监造的官儿起初不信，拿去一试，果然削铁如泥，惊得直咋舌。沙漠百姓世代与风沙刀剑为伴，这打兵器的本事，原是刻在骨头里的。教令院得了这批匠人，如虎添翼，只是这刀越造越利，将来砍向谁，却谁也说不准。沙海的兵器坊越开越多，炉火映红了半边天，夜里远远望去，如同白昼。匠人们日夜赶工，手指头上全是老茧。有人私下里说，这刀若是砍向沙漠自己人，造孽，可这话也只敢在心里想想。有个老匠人打完最后一把刀，把刀插在沙里，对着炉子拜了三拜，道：「刀是好刀，只盼它安分。」徒弟在旁听得直点头，把这话记了一辈子。"
 SUM_Neo.282.a:"先立威"
 SUM_Neo.282.b:"先立信"
 SUM_Neo.283.t:"沙碛遣谍"
 SUM_Neo.283.d:"须弥与邻国接壤的地方，尽是茫茫沙海，关口难守。教令院便招募了一班沙漠斥候，都是土生土长的沙民，认得每一处沙丘，识得每一条隐蔽的通道。这班人三三两两，散在边境上，替须弥盯着每一处沙口。有一回，一队不明来历的人马想偷过沙口，刚翻过一道沙梁，便被埋伏的斥候看得清清楚楚，一声唿哨，消息便传了回去。这沙漠斥候眼尖腿快，抵得上千军万马。只是他们本是沙民，如今替须弥守边，也不知是福是祸。有一回，一队斥候追着偷越沙口的人，追了三天三夜，回来时一个个嘴唇干裂，人瘦了一圈。可统领只淡淡问了一句拿住没有，便打发他们去了。斥候们站在风里，谁也没有应声。后来有人替他们讨赏，统领摆摆手道：「守边是本分，赏甚么赏。」斥候们听了，把水囊一收，又进沙海里去了。"
 SUM_Neo.283.a:"由教令院决断"
 SUM_Neo.283.b:"交由地方自理"
 SUM_Neo.284.t:"旅团成旅"
 SUM_Neo.284.d:"镀金旅团编入须弥之后，索性改头换面，组成了一支镀金军团。成军当日，校场上旌旗招展，最当中一面大旗，不寻常：上头一半绣着须弥的纹样，一半绣着旅团自家的族徽，两样并在一处，倒也济济。这旗上的讲究，耐人寻味。须弥要的是这支人马效忠，旅团要的是保住自己的脸面，一面旗上，各让一步。军团里的老兵望着那旗，有人得意，有人沉默。得意的是从此名正言顺，沉默的是这旗终究寄人篱下。成军之后，镀金军团驻扎在沙海边缘，平日里仍由自家的首领管束，可一到战时，号令便从须弥城传来。有老兵嘀咕，说这旗上的族徽，迟早要被须弥的纹样盖了去，旁边人听了，慌忙捂住他的嘴。捂嘴的那人后半夜又寻着他，低声道：「话我说了，你听见就忘了罢。」两人此后再没提过。"
 SUM_Neo.284.a:"以武力压服"
 SUM_Neo.284.b:"以德政感召"
 SUM_Neo.285.t:"月给军粮"
 SUM_Neo.285.d:"镀金军团成军之后，教令院倒也守信用，军饷按月按时发下，一纹不少。那些老佣兵，向来是打了仗才拿钱，拿不到便自己去抢，兵匪原是一家。如今头一回，到日子便有人在营门口支起桌子，一个一个点名发饷，银子白花花地摆在桌上。佣兵们排着队领了，掂了掂分量，脸上都有些诧异。有个干了半辈子的老兵，领了饷竟有些手足无措，说打了这么多年仗，头一回不用自己动手去抢。按时发饷原是当兵的本分，可落在这些游勇身上，竟成了稀罕事。有几个年轻些的佣兵，领了饷银便跑去酒肆，狠狠喝了一顿，出来时醉醺醺地说，跟着须弥干，不比走沙道差。可那老兵只摇头，说拿人手短，吃人嘴软，只怕这饷银不是白给的。"
 SUM_Neo.285.a:"先立威"
 SUM_Neo.285.b:"先立信"
 SUM_Neo.286.t:"旅团输诚"
 SUM_Neo.286.d:"镀金旅团虽然编了序列、受了军饷，可骨子里到底不是须弥的人。这一回，他们当面把条件讲明：效忠须弥可以，但须弥得认得他们的血，认得他们是沙漠的儿女，不能拿他们当任意驱使的奴仆。这话硬气。教令院权衡再三，到底应了，许他们保留自己的习俗，不由得改姓换名。旅团的首领听了，这才把手按在胸前，行了沙漠最重的礼。可也有人心知肚明，这条件今日应得，明日未必作数。果然，过了些日子，教令院便以统一军制为由，要旅团改了旗号、换了服饰，那认血的条件，竟一点一点被抹去。旅团的首领找上门去理论，人家只推说这是上头的规矩，他一个小小的头目，也做不得主。首领回来那晚把账本摔在案上，骂了一宿，天亮时又把账本一页页抚平，照旧送了上去。"
 SUM_Neo.286.a:"由教令院决断"
 SUM_Neo.286.b:"交由地方自理"
 SUM_Neo.287.t:"金砂张帜"
 SUM_Neo.287.d:"镀金军团正式归了须弥的号令，是日，沙漠的校场上，金砂旗缓缓升起。这旗是旅团的旧旗，金线绣出的沙纹，在日头下耀人的眼。旗升起来，旅团的兵与须弥的兵，头一回肩并肩站在一处，列成整齐的队伍。这两路人马，一个来自沙海，一个来自雨林与城池，从前各走各路，甚至刀剑相向，如今竟同立在一面旗下。有那老兵偷偷打量身边的人，彼此都觉着别扭。可号令一响，两下里竟也步调一致。金砂旗在风中猎猎作响，旗下的人各怀心思，可号令既出，也只得依令而行。岸边观礼的百姓看不出这些门道，只道是须弥军威大振。有明白的，却望着那两面旗，暗暗叹了口气。叹气的那人后来把族徽缝在里衣上，外头照穿号衣，说里子是自己的，面子随它去。"
 SUM_Neo.287.a:"以武力压服"
 SUM_Neo.287.b:"以德政感召"
 SUM_Neo.288.t:"括户点丁"
 SUM_Neo.288.d:"教令院为扩充军伍，又颁下一道征兵令，雨林与沙漠两处，各按人口多少出丁。这令一下，各处便忙着清查户口，数一数村里有多少男丁，按数摊派。雨林的村落里，本就人烟稀少，这一抽，几乎把青壮都抽走了，只剩老人孩子看家。沙漠那边也好不到哪里，一户人家有几个儿子，便得送去几个。有母亲哭着送儿子出门，官差只催着快走。这按人口出丁，看着公道，实则苦了众人丁兴旺的穷家。被抽走的青壮，编成新兵，押着往军营去，一路上哭声不绝。到了营中，又是剃头，又是换衣，一个个都变了模样。教令院还命人把抽丁的数目刻在石碑上，立在城门口，说是论功行赏，其实谁也没那个心思去看。碑上的数目越刻越大，刻碑的匠人手不停，心里发凉，说这碑再刻下去，石头都不够用了。"
 SUM_Neo.288.a:"先立威"
 SUM_Neo.288.b:"先立信"
 SUM_Neo.289.t:"夙夜训卒"
 SUM_Neo.289.d:"教令院在须弥城郊圈下一大片空地，建起了操练场。但见场上黄土夯实，划出一道道整齐的线，木桩、靶子、壕沟，样样齐备。这一处操场，是昼夜不闲。天刚蒙蒙亮，号角一响，兵士便列队跑圈；到了夜里，火把点起，口令声、脚步声、刀枪撞击声，仍旧此起彼伏。这一通操练，把一群乌合之众，练成了队列整齐的劲旅。可那震天的口令，扰得四乡百姓夜不能眠，有老人叹道，这口令声日夜不停，叫人心里发慌。那操场昼夜操练，兵士们跑圈、刺杀、列阵，一遍又一遍，雨天也不歇。有吃不消的，昏倒在黄土上，被泼一盆凉水，醒了又接着练。教令院的大员隔三差五来巡视，看着整齐的队列，满意地点头。有个教官看不下去，夜里偷偷给昏倒的兵卒塞了两块糖，第二日他自己也挨了训。"
 SUM_Neo.289.a:"由教令院决断"
 SUM_Neo.289.b:"交由地方自理"
 SUM_Neo.290.t:"林薮出锐"
 SUM_Neo.290.d:"须弥要建一支能在雨林里打仗的猎兵，教令院便打起了巡林队的主意。这巡林队里的人，日日穿行在雨林深处，认得每一条兽径，识得每一处陷阱，比谁都会在林中走路。于是挑了又挑，选了其中最精干的几百人，编作猎兵。这班人果然了得，往林中一钻，便如游鱼入水，悄无声息，敌人还没看见人影，箭已到了跟前。提纳里闻讯也曾来看过，点头说这是把好手。猎兵之利，端在熟悉地形，让那雨林成了自家的庭院。这班猎兵入了伍，仍旧不改老习气，走路专挑没路的地方走，说这样才不留下痕迹。上级起初还嫌他们不守规矩，后来见他们能在雨林里来去自如，无人能及，也只得由着他们。他们过林子时从不清点人数，来几个是几个，走时一个不少，林子里的人说他们是有影子的影子。"
 SUM_Neo.290.a:"以武力压服"
 SUM_Neo.290.b:"以德政感召"
 SUM_Neo.291.t:"弩铳并列"
 SUM_Neo.291.d:"须弥的军营里，如今摆着两样兵器，端的奇妙：一样是老式的弩炮，靠机括发力，射出巨箭；一样是新式的火炮，装填火药，轰然作响。这两样并排陈列，各不相让。老弩炮安静，偏又射得准，不惊动林中的走兽，也不惊起沙丘下的飞鸟；新火炮威风，一炮下去，山石炸裂，半里外的驼队都要惊了群。有守旧的老兵信不过火炮，说这玩意动静太大，吓人也吓己；年轻军官却捧着火炮不放，说这才是制胜的利器。两样兵器在营里各占一隅，老兵守着弩炮，视若珍宝，日日擦拭上油；新军捧着火炮，也不肯让人碰一碰。有一回教场比试，弩炮射得又稳又准，火炮却轰然一声，把靶子炸得粉碎，两边各自喝彩。比试散了，两边的匠人凑到一处喝酒，喝到半酣，各自掏出图样来比划，酒醒时图纸已换了三张。"
 SUM_Neo.291.a:"先立威"
 SUM_Neo.291.b:"先立信"
 SUM_Neo.292.t:"沙旅重铠"
 SUM_Neo.292.d:"教令院的工匠，造出了一种能在沙地上跑的铁车，外面包着厚厚的甲板，底下安着宽宽的轮带，唤作装甲车。这车在沙丘上跑起来，轰隆隆一阵，竟不陷进沙里，神奇。沙漠行军，最怕的就是车马陷沙，如今有了这车，教令院头一回有了能翻过沙丘的倚仗。试车当日，一众贤者站在沙丘上看热闹，只见那铁车爬上沙梁，又稳稳滑下，扬起一片沙尘。有老兵伸手摸了摸那铁甲，烫手，惊得缩了回来。试车成功后，教令院便命工匠照样子多造，很快便有一队铁车列在军中。那些沙漠的王公见了，惊得目瞪口呆，从此再不敢小瞧须弥。可这铁车也有个毛病，一开起来动静太大，几十里外都听得见，若是想要偷袭，休想。有机灵的盗匪，索性蹲在道边听声，听见铁车响便跑，跑得比铁车转得还快。"
 SUM_Neo.292.a:"由教令院决断"
 SUM_Neo.292.b:"交由地方自理"
 SUM_Neo.293.t:"须弥习飞"
 SUM_Neo.293.d:"教令院竟异想天开，要建一支空军，让兵士插翅上天。这飞行员从哪里挑？却是从素论派的天象学者里选。这班学者平日里仰望星空，测算风向，对天上的门道最是精通。于是挑了一批年轻力壮的，教他们驾驶飞行的器械。让读书人去当飞行员，也算别出心裁。这些学者初上飞天器械，个个头晕目眩，可到底底子好，懂得风向气流，没几个月便能驾驶自如。待到编成空军，从天上一掠而过，地面上的人都仰头看呆了。空军成立后，那些天象学者摇身一变，成了飞行员，受的供奉比寻常将官还厚。有人看了眼红，也想往里钻，可一打听，要懂天象、要识风向，还要能把那飞天器械使得顺，哪里是轻易学得会的，只得作罢。有个落第的学人不服，托人进了队，头一个月摔了七回，第八回飞起来当日，同伴都替他喊破了喉咙。"
 SUM_Neo.293.a:"以武力压服"
 SUM_Neo.293.b:"以德政感召"
 SUM_Neo.294.t:"炉冶铸铳"
 SUM_Neo.294.d:"须弥从前用的枪械刀兵，多半是从邻国买来的，价钱贵不说，还常常被卡脖子。这回教令院痛下决心，建起了一座座兵工厂，自己造枪造炮。开工当日，炉火熊熊，机器轰鸣，一座座厂房里，工人们日夜赶工。第一批枪造出来，拿去与进口的一比，竟也不差。须弥从此有了自己的兵工厂，枪械不再全靠外人，长了一口气。可那厂房里昼夜不息的烟火，也呛人，工人们累弯了腰。兵工厂里，工人们被编了号，每日有定额，做不满便要扣饷。监工的拿着鞭子来回巡视，谁敢偷懒，一鞭子抽下去。第一批枪出厂后，教令院大喜，又追加了订单，厂房日夜不息，烟囱冒出的黑烟，把半边天都熏暗了。有个老枪工干完这批活便告老，走时把锉刀留下，说下一批枪，还用它开的第一道膛。"
 SUM_Neo.294.a:"先立威"
 SUM_Neo.294.b:"先立信"
 SUM_Neo.295.t:"设总戎幕"
 SUM_Neo.295.d:"从前须弥打仗，儿戏，往往由贤者一时兴起，拍拍脑袋便下令进兵，全不顾地形敌情。这一回，教令院学了个乖，设立了总参谋部，专管谋划战事。这参谋部里，聚集了各派的能人，有懂地理的，有懂兵法的，有懂补给的，每日围着沙盘推演，一处一处算得分明。自此作战不再听贤者的兴致，而由参谋们反复筹谋。那一班老贤者起初还不服，后来见打了几场胜仗，也只得闭了嘴。总参谋部设立后，那些只会逢迎的老贤者被晾在一边，心里老大不自在，可又挑不出毛病，只得忍着。参谋们每日围着沙盘，一处一处推演，连粮草补给都算得分明。头一回照着参谋的谋划出兵，果然大胜，从此军中上下，都服了这参谋部。参谋部里有几个笔杆子，画起图来一张接一张，将军看着满案图样直皱眉，末了把茶碗一顿，道：「打得赢便好。」众将轰然应诺。"
 SUM_Neo.295.a:"由教令院决断"
 SUM_Neo.295.b:"交由地方自理"
 SUM_Neo.296.t:"改练新式军"
 SUM_Neo.296.d:"须弥的陆军，经这一番整顿，终于成了模样。这支部队，杂得很：有雨林里钻出来的猎人，有沙海里混饭的佣兵，有教令院里走出来的学者，还有世代住在荒漠的沙民。四路人马，各怀各的本事，凑在一处。这陆军虽杂，却也各有所长：猎人善伏，佣兵敢斗，学者懂谋，沙民识路。头一回大会操，四路人马列在一处，口令一响，竟也能进退合度。有旁观的老将看了，捋须点头，说这支部队，不可小觑。四路人马凑在一处，起初也闹了不少笑话：猎人嫌佣兵粗野，佣兵嫌学者文弱，学者嫌沙民不识字，沙民嫌猎人话多。可打了几回仗，各人都显出本事来，方才明白这队伍是缺一不可。须弥这支部队，虽然来路杂，倒也真能打仗。"
 SUM_Neo.296.a:"以武力压服"
 SUM_Neo.296.b:"以德政感召"
 SUM_Neo.297.t:"奥摩斯港舣舟"
 SUM_Neo.297.d:"奥摩斯港本是须弥通向外洋的口岸，如今教令院要它派上大用场，便下令扩建。这一扩，港湾里竖起了一排排新的栈桥，泊位一个接一个，竟排到了灯塔之外。从前船只靠岸要等上几天，如今几十艘大船并排停着，也绰绰有余。港口扩建，为的是容纳舰队，可也着实方便了商旅。只是当日夜不歇的打桩声，扰得附近渔民不得安生。有渔家老汉望着密密麻麻的桅杆，叹了口气，说这港口越修越大，自家的渔船，倒没处停了。奥摩斯港扩建之后，来往的商船确实多了，可码头上的苦力也多了几倍，都是被征来的穷苦人。他们扛着货包，弯着腰，从船舱一直走到库房，一日下来，腰都直不起来。港口越热闹，他们的汗就流得越多。"
 SUM_Neo.297.a:"先立威"
 SUM_Neo.297.b:"先立信"
 SUM_Neo.298.t:"埠头设厂"
 SUM_Neo.298.d:"奥摩斯港旁，新开了一座座船坞，木料堆得像小山，工匠们锯木的锯木，钉钉的钉钉，忙得不亦乐乎。这船坞一开工，破了须弥的天荒，头一回自己造自己的船。从前须弥的船只，多半向外购置，如今有了船坞，从龙骨到船帆，都能自己动手。第一艘船下水当日，港里挤满了看热闹的人，只听吱呀一声，那船滑入水中，稳稳浮着，众人齐声喝彩。有老船匠抹了把汗，笑得合不拢嘴。第一艘船下水之后，工匠们又接着造第二艘、第三艘，船坞里一派繁忙。教令院得了这许多船，胆子也壮了，竟想着要把舰队开到更远的海上去。有老水手看着新船，摸着船舷说，这船造得是结实，可不知要开去送死，还是去扬威。老水手摸完船舷又摸桅杆，摸了一遍才下船，下船时回头望了一眼，谁也不知道他在想甚么。"
 SUM_Neo.298.a:"由教令院决断"
 SUM_Neo.298.b:"交由地方自理"
 SUM_Neo.299.t:"须弥治舟"
 SUM_Neo.299.d:"须弥的舰队，终于在奥摩斯港成军了。但见港湾里，一艘艘战船整齐排列，桅杆高耸，帆樯如林。最高的一艘旗舰上，挂着须弥的旗号，随风猎猎作响。这支舰队一旦成军，须弥便不只是陆上的强国，连海上也有了威风。成军当日，教令院的大员亲临港口，登船检阅，水兵们列队在甲板上，刀枪如林，端的是威武。岸上围观的百姓，也都伸长了脖子。有老人喃喃道，咱们须弥，如今连海上都有了兵船。舰队成军之后，教令院时常命他们在海上操演，炮声隆隆，惊得海鸟四散。有一回操演遇上了风浪，几艘小船翻了，水兵们落在海里，两腿蹬着浪，好不狼狈。岸上的人看着揪心，舰上的将官却只顾着记录演练的成效。落水的兵卒爬上岸，抹一把脸又报名登船，将官在册子上添了一行，笔尖顿了顿，还是写下了。"
 SUM_Neo.299.a:"以武力压服"
 SUM_Neo.299.b:"以德政感召"
 SUM_Neo.300.t:"巨舰负铳"
 SUM_Neo.300.d:"须弥舰队在兵器上，独独选了一条路子：装巨炮。别的国家讲究船快炮小，须弥偏不，专门的炮管铸得又粗又长，口径比邻国的舰炮大了整整一圈。这巨炮霸道，一炮轰出去，海面上炸起冲天水柱，敌船挨上一发，便要翻身。也有明白人担忧，说这炮太大，装上船身子笨重，遇上灵活的敌舰，怕是追不上。可教令院的大员却认准了，说一炮定胜负，何须追逐。待到试炮当日，炮声一响，岸上的人无不被震得捂住耳朵。巨炮装上舰船之后，须弥的水师的确威风了一阵，敌船远远望见那粗炮管，便不敢靠近。可日子久了，毛病也渐渐露出来：炮太重，船走得慢，遇上灵活的敌舰，追不上也躲不开。教令院的大员却依旧嘴硬，说一炮之威，抵得上十炮。"
 SUM_Neo.300.a:"先立威"
 SUM_Neo.300.b:"先立信"
 SUM_Neo.301.t:"万樯集埠"
 SUM_Neo.301.d:"奥摩斯港自从通了海运，日日帆樯林立，桅杆多得像一片树林。看那码头上，工人们扛着一箱箱香料瓷器，汗流浃背，号子声此起彼伏。香料是雨林深处采来的，箱子一开，香气扑鼻，呛得人直打喷嚏；瓷器是窑里刚出的，白得像雪，薄得像纸，摔在地上便碎成一地。商人站在船头，掰着手指算这一趟能赚几多摩拉，算完咧嘴直笑。港口的老渔户捋着胡子说，从前这里冷清得只听得见浪响，如今倒像赶集一般热闹。有好事的，把出海的日子记在墙上，一日一画，画了满满一面。船老大吩咐伙计解开缆绳，只等潮水一到便扬帆出海。这海运一开，须弥的货物便走遍七国，便利。有道是，凡事预则立。潮水来的当日，码头上挤满了看热闹的，帆一升起来，人丛里便是一片叫好声。"
 SUM_Neo.301.a:"由教令院决断"
 SUM_Neo.301.b:"交由地方自理"
 SUM_Neo.302.t:"埠头置榷"
 SUM_Neo.302.d:"奥摩斯港新立起一处海关，关卡设在入港的窄口。凡进港的船只，都要停下受检，货单一样样核对，少一箱便不放行。管关的吏员拿着名册，上船翻箱倒柜，连舱底也不放过。有那老实商人，规规矩矩缴了税，心里还算服气；偏有一伙走私的，听说立了关，吓得魂飞魄散，大老远就把船头一转，绕着关卡走小道。他们趁着夜色，把货卸在荒滩上，再用骆驼一驮一驮运进沙漠。守关的兵丁望见远处有船影晃过，追上前去，那船早溜得没了影踪，只余下一串水泡。那走私的头目得了手，回到沙漠，还得意洋洋，对手下说，任他关卡如何严，咱自有法子绕过。手下听了，个个佩服。有分教：明处立关，暗处绕道，这关卡与走私的，要斗上一斗。个中三味，慢慢体味。"
 SUM_Neo.302.a:"以武力压服"
 SUM_Neo.302.b:"以德政感召"
 SUM_Neo.303.t:"鲸涛叵测"
 SUM_Neo.303.d:"当日远海之上出了一桩怪事。有一艘商船正扬帆疾行，忽然海水翻涌，一头巨鲸从水下跃出，身子比船还长，尾巴一甩，竟把商船撞个底朝天。船上的货箱子扑通通落进海里，有会水的扒着木板，哭喊救命；不会水的，转眼便沉了下去，好不凄惨。消息传回奥摩斯港，教令院当即差人前去查勘。那几个学者到了海上，只见海面漂着碎木，浪头一卷一卷，哪里有巨鲸的影子？有老水手颤巍巍地说，那鲸是多年前成的精，专在夜里出没，撞船乃是常事。学者们听了，半信半疑，把碎木捞起几块，记在册子上，回城交差去了。那几块碎木，后来摆在教令院的厅里，谁来都能看一眼，却谁也说不出个所以然。看的人里有猜是船板的，有猜是兵器的，猜来猜去，末了都说，留着罢，往后总有明白的人。"
 SUM_Neo.303.a:"先立威"
 SUM_Neo.303.b:"先立信"
 SUM_Neo.304.t:"置水师塾"
 SUM_Neo.304.d:"奥摩斯港新开了一所海军学堂，专教那出海的本事。学堂请来有经验的老船长做先生，教学生看风向、识星斗。看那课堂上，挂着一幅星图，先生指着星斗说道，夜里行船，全靠这星儿辨别方向；又拿一杆小旗插在院中，教学生看旗角飘向哪边，便知风从何来。学生们有记性好的，把星象编成歌诀，日日念诵；有的笨些，夜里对着星空发呆，半天也认不准一颗。先生也不恼，手把手地教，一遍不懂再来一遍。有好事的问先生，学这些究竟何用？先生笑答：识得风星，方能不迷航、不遇盗，稳稳当当把货送到。众人听了，方才恍然大悟，一个个埋头苦练，夜里对着星图，一颗一颗地认，不敢懈怠。这学堂一开，须弥的海上便有了自己的人。"
 SUM_Neo.304.a:"由教令院决断"
 SUM_Neo.304.b:"交由地方自理"
 SUM_Neo.305.t:"海上立邦"
 SUM_Neo.305.d:"单说须弥的船队，是日从奥摩斯港浩浩荡荡驶出。但见十数条大船，张满白帆，趁着好风，一路向远海而去。船队里管事的，是教令院派来的老成官员，怀里揣着公文，要往七国港口走一遭。船上装着香料、瓷器与各样货物，压得船身沉沉的。行了几日，海天一色，望不见岸，有初出海的小伙计，晕船吐得翻江倒海，老水手见了，递上一片姜，笑说习惯便好。又行几日，远远望见别国的港口，旗帜招展，船队便鸣号靠岸。码头上早有接货的人在等候，卸货的卸货，点数的点数，一片繁忙。有初次靠岸的水手，踩着跳板，腿还打颤，惹得旁人发笑。须弥的船队走出奥摩斯港，驶向七国的港口，这一去，把须弥的名声带到了海外。"
 SUM_Neo.305.a:"以武力压服"
 SUM_Neo.305.b:"以德政感召"
 SUM_Neo.306.t:"璃月来聘"
 SUM_Neo.306.d:"璃月的使节到访须弥，为的是矿脉与商道两桩大事。那使节带着随从，进了教令院的议事厅，与须弥的官员分宾主坐下。看那使节开了口，说的是璃月那边发现了几处好矿，愿与须弥互通有无；又说起商道，欲借须弥的港口，把货转运到别处。须弥的官员听罢，沉吟半晌，先不应答，只叫人献上茶来。两下里你一言我一语，说得投机处，彼此点头；说到紧要处，又各自斟酌。议了一日，方才议出个大概。有旁观的书记官，把话一句句记下，回去好向大贤者禀报。到了第二日，两边又坐下来，把昨日未尽的话接着说，一字一句，务求妥当。这邦交之事，要算计分明，一步也错不得。议到僵处，双方主事的各自离席喝一碗茶，回来接着议，那茶续了七道，条款才落定。"
 SUM_Neo.306.a:"先立威"
 SUM_Neo.306.b:"先立信"
 SUM_Neo.307.t:"稻妻互市"
 SUM_Neo.307.d:"稻妻的商船驶进奥摩斯港，泊在指定的泊位上。那船身漆得乌亮，船头挂着稻妻的旗。船员们抬下一箱箱的货，打开一看，尽是亮闪闪的刀与光溜溜的绸。那刀是稻妻的名匠打的，锋利异常，吹毛断发；那绸是本地的丝织的，摸上去滑如凝脂。须弥的商人围上来，看得眼馋，伸手摸摸这把刀，又捻捻那匹绸，爱不释手。有懂行的，蹲下身细看刀身上的纹路，连连点头，说把好刀。两边做起买卖，讨价还价，各不相让，吵吵嚷嚷，半日方定。有没抢到好刀的，追着商人问，下一回几时再来，商人笑说，来年开春准到。众人听了，皆大欢喜。还有那孩子，围着船看稀罕，被大人一把拎了回去。稻妻的商船带来刀与绸，让奥摩斯港又添了几分热闹。"
 SUM_Neo.307.a:"由教令院决断"
 SUM_Neo.307.b:"交由地方自理"
 SUM_Neo.308.t:"界接纳塔"
 SUM_Neo.308.d:"当日纳塔的部族与须弥在沙口对峙，闹得剑拔弩张。原来那沙口是通往绿洲的要道，两边都说这路该归自己管。纳塔的人马一字排开，个个身强力壮，手持长矛，脸上涂着油彩；须弥这边也不示弱，列阵相迎，刀出鞘，弓上弦。两下里隔着一段沙地，你瞪着我，我瞪着你，谁也不肯先退一步。风卷着黄沙，吹得人睁不开眼，气氛绷得像拉满的弓弦。有胆大的，往前跨了两步，对面也跨了两步，眼看就要动手。正在这时，两边各有一位长者出面，手执拐杖，走到中间，好说歹说，方才劝住。两位长者你劝一句，我劝一句，说得口干舌燥，两边这才把刀收了，矛也放下。这沙口之争，险些酿成大祸。收刀之后，两边的老人互敬一碗水，水是从两口井里各打来的，倒在一个碗里，分不出彼此。"
 SUM_Neo.308.a:"以武力压服"
 SUM_Neo.308.b:"以德政感召"
 SUM_Neo.309.t:"取法枫丹"
 SUM_Neo.309.d:"枫丹的工程师远道而来，给须弥带来了一卷机械的图纸。那图纸画得精细，层层叠叠，标注着各样机括的尺寸。工程师到了教令院，把图纸往案上一铺，指着上头的齿轮连杆，对须弥的学者讲说。看那图纸之上，画的是一种能自行运转的机械，据说是用水力带动，省时省力。须弥的学者围拢来看，有看得懂的，连连称妙；有看不懂的，只觉眼花缭乱，如看天书。工程师也不藏私，一边讲解，一边比划，说得口若悬河。有好事的问，这机械造出来要花多少摩拉？工程师伸出手指数了数，众人听了，咋舌不已。有胆大的，当场就要凑钱合买一台，试试这洋机器的本事。工程师听了，连声说好。这图纸虽好，还要看造不造得出来。"
 SUM_Neo.309.a:"先立威"
 SUM_Neo.309.b:"先立信"
 SUM_Neo.310.t:"朔北潜影"
 SUM_Neo.310.d:"至冬的商队来到须弥，车上一箱一箱，封得严严实实。教令院的吏员见了，心中起疑，按规矩把货箱打开检查。这一查，查了三次：头一回查的是货单，数目对不上；第二回查的是箱底，夹层里藏着东西；第三回索性把车驾拆开，连轴子里都搜了一遍。那至冬商人脸上陪着笑，心里却直打鼓，额上渗出细汗。原来这商队里，藏着别的东西，乃是不便见光的物件。教令院的吏员老练，三查两查，便查出些端倪，当即把领头的请进屋内，细细盘问。那人起初矢口否认，及至教令院把夹层里的东西抖落出来，方才软了手脚，一五一十招认。周围看热闹的人见了，无不伸舌。这至冬商队里藏的东西，有些蹊跷。那批蹊跷的货后来入了官库，库门上加了两道锁，钥匙一在税关，一在议会，谁也私开不得。"
 SUM_Neo.310.a:"由教令院决断"
 SUM_Neo.310.b:"交由地方自理"
 SUM_Neo.311.t:"蒙德互市"
 SUM_Neo.311.d:"蒙德的商队一路风尘，来到须弥城外。那商队赶着马车，车上装满风车与美酒。风车是蒙德的特产，一架架用木板钉成，风一吹便呼呼转动；那酒是葡萄酿的，装在橡木桶里，打开桶盖，酒香四溢。商人们把货摆开，吆喝着招揽主顾。须弥的百姓围上来看稀罕，有没见过风车的，伸手拨弄叶片，咯咯直笑；有爱喝酒的，凑到桶边闻了闻，连连点头。有好事的问，这酒如何？商人舀起一碗，递过去，那人说声好，仰头便饮，咂嘴称妙。有买定风车的，扛在肩上，一路转着回家，惹得街上的孩子跟了一路。两边交易，你搬酒桶，我扛风车，好不热闹。蒙德的商队带来风车与酒，让须弥城又添了异域风光。有嘴快的伙计学了两句蒙德话，逢客便说，说得走了调，客商也听得直乐。"
 SUM_Neo.311.a:"以武力压服"
 SUM_Neo.311.b:"以德政感召"
 SUM_Neo.312.t:"七邦同文"
 SUM_Neo.312.d:"须弥倡议七国学术联盟，欲使各国的学者互相往来，共研学问。这倡议一出，教令院便差人分头去往六国，递上文书，说明来意。看那文书之上，写得恳切：学问无国界，若能互通有无，七国皆受其益。各国的学者听了，有热心的，当即应允，愿意前来；有谨慎的，还要禀明本国贤者，再作定夺。没过多久，便有远道而来的学者，背着书箱，踏入须弥的书院。他们与本地的学者围坐论道，你引经据典，我据理力争，辩到会心处，相视而笑。有不通语言的，靠着手势与图画，也能交流。书院里日日人来人往，读书声、争论声，混成一片，端的比往日热闹了十倍。这联盟一立，让学问活了起来。连看门的老头儿也听熟了几个名词，扫院子时嘴里念念有词，念的竟是论辩的题目。"
 SUM_Neo.312.a:"先立威"
 SUM_Neo.312.b:"先立信"
 SUM_Neo.313.t:"援及邻邦"
 SUM_Neo.313.d:"邻国遭了灾，荒了大片田地，灾民流离失所。须弥得知消息，教令院一商议，决定送粮送药过去。当下备了数十车粮食，又装了满满几箱草药，派了押运的官员与车队，浩浩荡荡出发。那粮是仓里陈年的储备，一袋袋码得整齐；那药是雨林采来的，能治疫病。车队走了好几日，到了灾区，只见田地龟裂，百姓面黄肌瘦，见了粮车，个个眼放光。须弥的官员把粮一袋袋分发下去，又支起大锅熬药，热气腾腾。有那老弱病残，优先照顾。灾民们千恩万谢，有的竟跪下磕头。须弥的官员又请来郎中，为病人诊脉开方，忙到深夜方歇。临行时，灾民送了一程又一程，挥泪作别。押运的车队回程时，车上轻了，心里却沉甸甸的。这雪中送炭之举，积德。"
 SUM_Neo.313.a:"由教令院决断"
 SUM_Neo.313.b:"交由地方自理"
 SUM_Neo.314.t:"远扬声教"
 SUM_Neo.314.d:"须弥自从渐渐强盛，在七国之中也有了地位。往日七国议事，须弥不过陪坐末席，插不上话；如今不同了，但凡议事，必给须弥留一把交椅。看那议事桌上，各国使者围坐一圈，须弥的使者坐在其中，侃侃而谈，说的是通商、学术诸般事宜。他随身带着一卷舆图、一包香料，说到商道，便摊开图来，指给人看驼队从奥摩斯港起行，几日到沙海，几日过隘口；说到学问，便引一句古书，众人听了频频点头。有不服气的，故意刁难，抛出难题，使者不慌不忙，一一作答，驳得那人心服口服。有几个原本拿不定主意的，至此也点了头。议罢，须弥的使者把议定的文本抄了一份带回，纸都翻卷了边，却当宝贝似的揣在怀里，回去要先呈教令院，再抄一份送去净善宫。"
 SUM_Neo.314.a:"以武力压服"
 SUM_Neo.314.b:"以德政感召"
 SUM_Neo.315.t:"净善宫重葺"
 SUM_Neo.315.d:"那净善宫年久失修，殿宇斑驳，墙皮剥落，梁柱上爬满了蛛网，下雨时各处漏雨，滴答作响。教令院看不过去，便请了位巧匠来主持整修。那巧匠姓氏不必细表，只说他一手木活，巧夺天工。他带了徒弟进宫，先细看那梁柱，哪里糟了，哪里裂了，一一记下；又爬上房顶，查看瓦片。看那巧匠，量了又量，画了图样，方才动手。先是加固梁柱，把朽木换掉；再补瓦片，堵住漏处。徒弟们递工具、和灰浆，忙得不亦乐乎。整修了月余，净善宫焕然一新，雕梁画栋，光彩照人。那漏雨的地方补得严严实实，再下雨时，滴答之声便听不见了。有进宫看过的人说，里头的柱子漆得油光锃亮，照得见人影。这座宫殿藏着多少秘密，无人知晓。"
 SUM_Neo.315.a:"先立威"
 SUM_Neo.315.b:"先立信"
 SUM_Neo.316.t:"无郁夷摩宫"
 SUM_Neo.316.d:"单说那巧匠卡维，先前造无郁夷摩宫，欠下大笔债务，被债主追得东躲西藏，工程半途而废。如今时来运转，那无郁夷摩宫重新开工。这一回，卡维早早把银钱备足，账目算得清清楚楚，再不必为钱发愁。看那工地上，工匠们各司其职，砌墙的砌墙，立柱的立柱，梁木是从雨林里伐的，一路靠驼队拖到城下，卡维亲自督工，这里看看，那里摸摸，稍有不合规矩，便叫重来。他对待工匠却厚道，工钱按时发，还管饱饭，众人肯卖力。工程进展顺当，一日快过一日。有那旧日债主听说开工，本想再来讨债，一打听，卡维如今银钱宽裕，账目明白，讨不成，只得悻悻而去。卡维站在工地上，看着拔地而起的宫墙，长长舒了一口气，脸上终于有了笑模样。这一回扬眉吐气。落成当日，卡维把锯了一半的木料收进工具箱，说下一处工地，还用它起第一根梁。"
 SUM_Neo.316.a:"由教令院决断"
 SUM_Neo.316.b:"交由地方自理"
 SUM_Neo.317.t:"奥港座舟"
 SUM_Neo.317.d:"奥摩斯港外，那座大船停靠多年，桅杆早折了，船身蒙尘，像个垂暮的老兵。这一日，工匠们开来，要把桅杆重新立起来。看那场景，好不热闹：几个人抬着粗大的桅杆，喊着号子，一步步挪到船边；工匠在上面接着，用绳索牢牢捆住，再一点点竖直。那桅杆又高又沉，立起来时，众人捏着一把汗，生怕歪倒。费了半日工夫，方才稳稳立定，接着挂上帆，风一吹，帆鼓得像满月。有水手爬上桅杆，检查绳索，欢喜得直叫。岸上看热闹的人拍手叫好。有那老水手抚着桅杆，眼眶竟有些发热，说这船当年何等威风，如今总算又有了指望。众人听了，也都唏嘘。船老大吩咐备酒，又要厨下炖一锅香辛羊肉，要与工匠们痛饮一场，码头上的苦力也被叫来同坐。这桅杆一立，座舰便能重新出海。"
 SUM_Neo.317.a:"以武力压服"
 SUM_Neo.317.b:"以德政感召"
 SUM_Neo.318.t:"黑烟塞空"
 SUM_Neo.318.d:"须弥城外，这一二年间，烟囱如春笋般冒了出来，一根根吐着黑烟，遮天蔽日。原来各处开了作坊、工场，烧煤的炉子日夜不停。那些学者见了，忽然想起一桩事来：这煤烧得这般快，库存还够几时？于是几个学者凑在一处，拨着算盘，掐着指头，算起账来。这个说，照这烧法撑不过一年；那个说，还得从沙道另一头调运。有精细的，跑到作坊门口一车一车数进煤，记在小本上。算来算去，众人眉头紧锁。有几个年轻学者索性跑到城外，蹲在烟囱底下数了三日，回来把数目往桌上一摆，众人更是愁眉不展。有人主张限着烧，有人主张赶紧去买，争了半日也没个章程。烟灰落下来，覆在道旁的帕蒂沙兰上，紫红的花瓣蒙了一层黑，看着叫人心疼。这工业兴旺本是好事，也带来隐忧。"
 SUM_Neo.318.a:"先立威"
 SUM_Neo.318.b:"先立信"
 SUM_Neo.319.t:"沙中凿冶"
 SUM_Neo.319.d:"沙漠深处探出一条矿脉，蕴藏着上好的铁矿。教令院当即组织人手前去开采。看那矿场，一派繁忙：矿工们挥镐抡锤，叮叮当当，砸开岩石；有人把矿石一筐筐挑出，堆成小山；炉子日夜燃着，火光冲天，把半边天都映红了。那铁水沸腾，倒进模子，冷却后便成铁锭，一块块摞得整齐。须弥人见了，欢喜异常，从前打铁用的铁，多靠外处运来，如今自家有了矿，再不求人。铁匠铺的炉火也更旺了，打的农具、兵器，源源不断。有老矿工擦着汗说，这沙底下埋了多少宝贝，从前竟不知道。那矿脉越挖越深，出来的铁也越来越好，教令院见了，喜不自胜，又添了人手，添了炉子。须弥有了自己的铁，腰杆更硬。有个老矿工把第一块铁带回家里，供在灶台上，说这铁是自己一锤一锤敲出来的。"
 SUM_Neo.319.a:"由教令院决断"
 SUM_Neo.319.b:"交由地方自理"
 SUM_Neo.320.t:"输木与香"
 SUM_Neo.320.d:"单说须弥这两样物产，一样是木材，一样是香料，成了立国的两条腿。看那雨林之中，伐木的工匠成对结伴，抡起斧头，砍倒大树，然后顺着河流，把木头扎成木排，一路放到城里；那木头质地坚实，是造房造船的好材料。香料则不同，采自深山，一筐筐晒干，装进箱子，香气四溢，远销海外。城里靠这两样吃饭的人，不计其数：伐木的、运木的、采香的、贩香的，各行各业，红红火火。有精明的商人，两头通吃，既贩木材又贩香料，赚得盆满钵满。教令院见了，也乐得收税，库银日渐充盈。码头上，木材堆得像小山，一垛挨一垛；香料装了车，一辆接一辆，络绎不绝。这两条腿站得稳，须弥便立于不败。有算账的先生把两条腿的进项列成一单，贴在柜台上，客人一看，都点头称是。"
 SUM_Neo.320.a:"以武力压服"
 SUM_Neo.320.b:"以德政感召"
 SUM_Neo.321.t:"百工竞起"
 SUM_Neo.321.d:"须弥从前有许多老手艺，织布的、制陶的、打金的，年代久远，几近失传。如今世道变了，这些旧工艺又被重新捡了起来。教令院特意设了匠籍，把有一技之长的匠人登记在册，给了名分，月月发给钱粮。看那些匠人，重新拿起搁置多年的工具，手上生了锈，起初笨拙，练上几日，便又熟练如初。织布的梭子穿梭，啪啪作响；制陶的转盘飞转，泥坯在手中成形；打金的锤子轻敲，金箔薄如蝉翼。有那年轻人，见了羡慕，也来拜师学艺。老匠人捋须笑道：这手艺传了三代，如今总算后继有人。那新来的年轻人，起初连梭子都拿不稳，练上几日，也能织出个像样的布来，老匠人看了，捋须点头。匠人有了名分，扬眉吐气。有名分之后，织坊里添了带徒的章程，老师傅收徒须立字据，字据与名册放在一处。"
 SUM_Neo.321.a:"先立威"
 SUM_Neo.321.b:"先立信"
 SUM_Neo.322.t:"大营宫室"
 SUM_Neo.322.d:"须弥境内，雨林与沙漠两下相隔，往来不便。沙漠的货要运到雨林，雨林的粮要送到沙漠，中间隔着一片荒地，走起来绕老大一圈。教令院一合计，决定在两下之间修一座桥，把这片地方连通起来。看那工地上，工匠们先打地基，一块块石头垒进土里，夯实了，再架桥面。雨林这边气候潮湿，木材易腐，工匠便选用耐腐的硬木；沙漠那边风沙大，桥墩就得砌得格外结实。两头的工匠分工合作，各展所长。有沙漠的向导，来看看地形，指说这里风大，桥要修矮些；雨林的匠人，则说那里水多，桥洞要留大些。众人商量着，取长补短。看那工匠们，热得汗流浃背，也没一个叫苦的，都盼着桥早些修成。这桥一修成，两下便连成一片。"
 SUM_Neo.322.a:"由教令院决断"
 SUM_Neo.322.b:"交由地方自理"
 SUM_Neo.323.t:"须弥旧泽"
 SUM_Neo.323.d:"须弥历史悠久，历代相传的故事、工艺、见闻，散落各处，全凭口耳相传，日久难免失传。教令院有鉴于此，便召集一众学者，着手编纂典籍，把须弥的过去一桩桩、一件件，都收录进去。看那书院之中，学者们埋头伏案，有的翻阅旧卷，有的执笔誊写，沙沙作响。你把这一段沙漠的来历写下来，我把那一条雨林的物产记进去，还有赤王的旧事、花神的传说，一一在册。抄写了一卷又一卷，摞起来一人多高。有那年轻学者，边抄边叹，原来咱须弥竟有这许多故事。有的学者抄着抄着，竟抄出了从没人提起的旧事，欢喜得像得了宝贝。抄成的典籍，用牛皮封了皮，一排排码在架上，是须弥的传家之宝。这典籍一成，后来的便有据可查。"
 SUM_Neo.323.a:"以武力压服"
 SUM_Neo.323.b:"以德政感召"
 SUM_Neo.324.t:"沙林辑睦"
 SUM_Neo.324.d:"从前，雨林与沙漠各守一方，风俗不同，常起争执，动辄拔刀相向。如今须弥一统，立下统一的律法，两下里都在这一条律法下过日子。看那集市之上，雨林的商人与沙漠的驼队比邻而居，你卖你的香料，我卖我的皮毛，虽然言语不同，却也能比划着做成买卖。偶有纠纷，也不再动刀动枪，而是寻那官府评理，按律法论断。城里人与旷野的牧人，也渐渐相安无事，再不必刀剑相见。有那老人坐在树下感叹，打了多少年的架，如今总算消停了。那老人又说，从前走这条路，怀里得揣着刀，如今空着手来去，也无妨。旁边年轻人听了，只当是老话，笑笑便过；独有经历过旧日的，听着直点头。这太平日子来得不易。经历过旧日的那个，后来把这故事说给孙儿听，说到末了，总要添一句：「记住这日子。」孙儿听熟了，自己也会念了。"
 SUM_Neo.324.a:"先立威"
 SUM_Neo.324.b:"先立信"

 #################### 决议 ####################
 SUM_Neo_Akademiya:"教令院与诸派"
 SUM_Neo_Akademiya_desc:"一桩桩政务，连同六派的更张，都在这院里料理：学阀的积弊要清，卷档要放开，学风要扳正。哪件办妥了，学院的规矩便往前挪一步。至于孰先孰后，全凭你权衡，切不可顾了这头、误了那头。"
 SUM_Neo_Desert:"沙碛旅团"
 SUM_Neo_Desert_desc:"沙漠自成一班议案，管的是沙海各部往来、商路与边境。绿洲水权归谁，游牧部族附哪边，商队怎么过关，都系着须弥在沙漠的势力。这些事办妥，日后与沙漠三国周旋，手里便多几分底气。"
 SUM_Neo_Oracle:"谕入幻境"
 SUM_Neo_Oracle_desc:"神谕一班议案，绕着神谕的规矩打转。占卜吉凶，靠一撮沙、一炉火，看灰上裂纹怎么走；解读天意，回应祈愿，都叫神谕的数起落，变成国中的增益。这增益或利守成，或利进取，须认准须弥要走的路。"
 SUM_Neo_War:"武备邦交"
 SUM_Neo_War_desc:"募兵丁、造军械、接济前阵、遣使施压，这些事都归战争一班。风声一紧，它便替国家争些地步。只是桩桩件件都要花银子、耗时日，得挑最要紧的先办。倘若处处铺开，反倒处处吃紧，那便得不偿失了。"
 SUM_Neo_Wonder:"葺此巨构"
 SUM_Neo_Wonder_desc:"奇观一班议案，专为兴起标示一方的建筑工程。从净善宫到各处圣所，石料自降诸魔山一路运来，驼队压弯了沙道。座座奇观都能利国久远，却也费人工、耗物料。先建哪一座，便是定须弥拿什么面目示人。"
 SUM_Neo_Genesis:"渎神贾祸"
 SUM_Neo_Genesis_desc:"创世一班议案，管的是须弥根本道理的取舍。是守旧日的教令神谕，还是另开新路，都在这里渐渐分明。每项选择都牵动国本，一旦落定便难回头，务要三思；也莫把话说死，留些转圜余地。"
 SUM_Neo_Crisis:"艰危当救"
 SUM_Neo_Crisis_desc:"危机一班议案，专应突如其来的变故。教令内乱，沙漠施压，民间疑神，都在这里料理。办理及时，便不叫祸患积成难收拾的摊子，也为日后留些余地，免得临头手忙脚乱，折损元气。"
 SUM_Neo_Mechanism:"众械齐作"
 SUM_Neo_Mechanism_desc:"有一面板，只供观看，不能点动。左边一格记神谕，右边一格记学院，两格高低一合，便显出须弥此刻的品级，另附一行小字，写明这一档生效的国中增益。宫里人看了，都说比旧日的签筒明白。"
 SUM_Neo_Dec_Aka_Reform_Darshan:"重定六家"
 SUM_Neo_Dec_Aka_Reform_Darshan_desc:"教令院议事厅里，六大学派的座次又要重排。哪派坐上首，哪派掌哪摊事，都得重新厘定。堂上那六把椅子是旧木打的，谁坐哪一把，牵动各派脸面。议事前一日，各家都打发人来堂上探过，摸摸椅背，看了看位子，才回去复命。"
 SUM_Neo_Dec_Aka_Purge_Sage:"更易首座"
 SUM_Neo_Dec_Aka_Purge_Sage_desc:"议事厅里有几位首座，占着位子不办事，误人子弟。教令院下了决心，把这不称职的请出门去，换上干练的。这等整顿，委实要一番魄力。那些个尸位素餐的，收拾了书箱，只好卷铺盖走人，临走还嘟囔：「我熬了二十年……」"
 SUM_Neo_Dec_Aka_Open_Archive:"启此琅函"
 SUM_Neo_Dec_Aka_Open_Archive_desc:"教令院库中藏书汗牛充栋，往日高墙深锁，寻常学者难得一阅。如今开了禁，任凭翻阅抄录。有个老学究头一回进去，摸着书架直叹：「书藏得再好，不如传得广。」这一放开，不知成就了多少学问。"
 SUM_Neo_Dec_Aka_Scholarship:"置奖劝学"
 SUM_Neo_Dec_Aka_Scholarship_desc:"「这真是给我的？」放羊的娃攥着银钱，直发愣。须弥多的是贫寒子弟，天资好却没钱读书，教令院特设资助供他们应考。管事的笑道：「拿去，好好读。」这银钱花在寒门身上，换得出真才，也算一桩功德。"
 SUM_Neo_Dec_Aka_Exam:"课试诸生"
 SUM_Neo_Dec_Aka_Exam_desc:"「熬不动喽。」墙根底下几个混日子的直叹气。往日学者升迁凭资历，熬年头就能往上爬；如今换了章程，一律拿考成说话，考得好的擢升，考得差的降黜。那些指望熬年头的没了门路，真有本事的反倒挺直了腰杆。"
 SUM_Neo_Dec_Aka_Journal:"学报获梓"
 SUM_Neo_Dec_Aka_Journal_desc:"学报一事，往日要经层层审查，篇篇掣肘。如今许其自由刊行，学者有了说话的地方，新说得以流传。学问之道，贵在争鸣。这一放开，你一篇我一篇，争得热闹，倒真个百花齐放。"
 SUM_Neo_Dec_Aka_Research_Grant:"拨帑资研"
 SUM_Neo_Dec_Aka_Research_Grant_desc:"有个工匠领了银钱，当场就买料开工，三个月造出一件新器来。教令院拨下这笔钱，专供实用的学问：造器械、试药剂、推算法，只要有用都能来请领。这银钱花在实地上，成效看得见，不是那等纸上空谈。"
 SUM_Neo_Dec_Aka_Census:"稽核丁籍"
 SUM_Neo_Dec_Aka_Census_desc:"须弥境内，学者学徒到底多少，向来没个确数。教令院决意逐户清点，登册在案：谁师从何人，专攻何学，一一载明。差役背着册子走村过巷，连禅那园的看守也照问一遍。有个看守笑道：「我这看林的，也算学者？」差役道：「算，都算。」清了家底，便于调遣。"
 SUM_Neo_Dec_Aka_Virtual:"厘定虚空之器"
 SUM_Neo_Dec_Aka_Virtual_desc:"管事的把终端一收：「这一回，也算多了。」那冒领的还嘴硬，说：「我就多领了一回。」虚空终端干系重大，谁能领用本有定制，近来却有人浑水摸鱼，滥领滥用。教令院要清查发放的权柄，把不该给的尽数收回，这空子总算堵住了。"
 SUM_Neo_Dec_Aka_Vahumana:"因论派致诘"
 SUM_Neo_Dec_Aka_Vahumana_desc:"「贤者的权，是谁给的？」一个因论派学者当堂发问，满堂都捏了把汗。六派之中，因论派最爱追问权柄的边界，最是直言犯上，教令院反倒扶持，许他们自由论辩。这学问听着刺耳，却能叫当权的心里有所忌惮。"
 SUM_Neo_Dec_Aka_Kshahrewar:"妙论派司工"
 SUM_Neo_Dec_Aka_Kshahrewar_desc:"妙论派最擅营造，起高楼，修桥梁，筑宫室，样样在行。教令院索性把城邦营建一事，尽交他们主持。有个老工匠量了量地基，对徒弟道：「这活，咱熟。」让内行办内行事，稳妥；那些外行瞎指挥的乱象，自此可免。"
 SUM_Neo_Dec_Aka_Amurta:"生论派司苑"
 SUM_Neo_Dec_Aka_Amurta_desc:"「这一片，活了。」生论派学者蹲在林子里，扒开草看新发的芽。雨林的林务关乎草木生灵，正合生论派本行，教令院便把巡查林木、防治死域、护育生机这摊事交给他们。让懂行的管林子，才守得住这一方青绿。"
 SUM_Neo_Dec_Aka_Spantamad:"知论派开作"
 SUM_Neo_Dec_Aka_Spantamad_desc:"搬进新屋的那位学者，高兴得绕着屋子转了一整圈。知论派讲究元素与道理，最需要宽敞地方，教令院便替他们扩建研求之所，添仪器、开新舍。古人说要做成事，先得把家伙什备利索；院舍一扩，出的成果自然更丰。"
 SUM_Neo_Dec_Aka_Rtawahist:"望台观象"
 SUM_Neo_Dec_Aka_Rtawahist_desc:"「正了。」老星象师爬上重修的台，扶着栏杆看了一眼，点头道。素论派观星望宿全靠观星台，这些年台体倾颓，刻度失准，教令院便扶正台基、更换仪器。观星之道差之毫厘谬以千里，这台一修，看得便准了。"
 SUM_Neo_Dec_Aka_Haravatat:"明论派著录"
 SUM_Neo_Dec_Aka_Haravatat_desc:"卷目一端正，宛如配了把开锁的钥匙。明论派掌着典籍，卷帙浩繁却乱糟糟，寻一卷书难得要命，教令院便令他们重编目录、分门别类，把次序理清楚。有个学者照目找书，一找便着，喜得直说省了半日工夫。"
 SUM_Neo_Dec_Aka_Press:"设刊书坊"
 SUM_Neo_Dec_Aka_Press_desc:"书坊掌柜 慨然道：「这书，总算走进了寻常人家。」原先书价贵，寒士买不起，学问便传不开。教令院出面扶持刊印的作坊，招工匠、压书价。这一压，连挑水担水的都置得起一册。学问到了这一步，才算真正播开去。"
 SUM_Neo_Dec_Aka_Union:"诸家合议"
 SUM_Neo_Dec_Aka_Union_desc:"六位首座头回坐到一处，你看我、我看你，半晌没人开腔。还是其中一位先咳了一声，话匣子才打开。六派平日各揣心思、各说各话，教令院特意召他们同厅共议。众人拾柴火焰高，这一联合，纷争少了，共识多了。"
 SUM_Neo_Dec_Aka_Exile_Return:"征还逋客"
 SUM_Neo_Dec_Aka_Exile_Return_desc:"先前有学者因言获罪，被流放他乡，有家难回。如今教令院开恩赦免，准他们归来复职。文书顺着商道送出去，那些漂泊的学者背着旧书箱，一站站走回须弥城。有个走到城门的，进门先掸袍上的沙，哽咽道：「可算回来了。」"
 SUM_Neo_Dec_Des_Oasis_Work:"垦此荒洲"
 SUM_Neo_Dec_Des_Oasis_Work_desc:"「这地，活了。」老农引水进了自家的田，蹲在田埂上看水慢慢渗。沙漠里水比金贵，绿洲就是命根子，须弥组织沙漠百姓围泉开荒、引水灌田，把荒滩一点点变成熟地。一处绿洲张开，便能养活许多人家。"
 SUM_Neo_Dec_Des_Road:"沙海置邮"
 SUM_Neo_Dec_Des_Road_desc:"赶驼的老汉蹲在新铺的石路边，伸手摸了摸路面，叹了声：「这路，好走多了。」原来沙漠的商道常叫风沙掩埋，行走极难。须弥决意经常维护：清沙、铺石、立标引路。路一修通，商旅往来顺畅，货物也流通起来，沙漠跟着活络了。"
 SUM_Neo_Dec_Des_Caravan_Guard:"行商自备"
 SUM_Neo_Dec_Des_Caravan_Guard_desc:"有一回劫道的刚露头，护卫就抽刀迎上，那伙人抱头便跑。沙漠商队常遭劫掠，财货难保，须弥便给他们配了护卫，一路随行护送，遇上盗匪便挺刃向前。有了这护送，商队安心，买卖也敢做大。"
 SUM_Neo_Dec_Des_Tax_Relief:"蠲沙民赋"
 SUM_Neo_Dec_Des_Tax_Relief_desc:"「真减了？」老汉凑近告示看了半晌。「真减了。」税吏点头。沙漠行省的百姓常年被重税压得喘不过气，须弥决意减轻税负、让利于民。赋税一减，百姓喘过气来，对官府也多了几分亲近。"
 SUM_Neo_Dec_Des_Aaru_Aid:"赈恤阿如村"
 SUM_Neo_Dec_Des_Aaru_Aid_desc:"「这是救命的粮！」村里老人捧着米袋，手直抖。沙口村落土地贫瘠，遇上荒年便揭不开锅，须弥送去粮米草药救济困厄。粮车一到，灾民齐齐跪下磕头。这等雪中送炭，自叫那些村落感恩戴德。"
 SUM_Neo_Dec_Des_Eremite_Pay:"旅团责偿"
 SUM_Neo_Dec_Des_Eremite_Pay_desc:"镀金旅团替须弥办事，讲的是一个钱字。须弥决意按期结算契约，该给的摩拉一枚不欠。每月由专人押着钱袋，沿商道送到营里。有个佣兵接过钱袋，掂了掂，笑道：「这回，没短少。」用人之道，不拖欠，方才叫人肯卖力。"
 SUM_Neo_Dec_Des_Eremite_Drill:"旅团聚训"
 SUM_Neo_Dec_Des_Eremite_Drill_desc:"镀金旅团虽勇，却多是散兵游勇，缺了章法。须弥组织他们按期操练：列阵、进退、号令，一样样教。操演选在沙丘背风的洼地，号角一响，黄沙扬起半人高。有个佣兵站错了位，被教头一脚踹回队里：「站稳了！」规矩一端上，战力大增。"
 SUM_Neo_Dec_Des_Amnesty:"宥还流人"
 SUM_Neo_Dec_Des_Amnesty_desc:"「我还能回家？」那流放多年的老汉捧着赦令，泪就落了下来。教令院从前把一批人流放沙漠，任其自生自灭；如今须弥改了主意，下赦令准他们回故土。这一道赦令，把散了的人心收拾起来，沙漠里的怨气也消了不少。"
 SUM_Neo_Dec_Des_Trial:"诸部会谳"
 SUM_Neo_Dec_Des_Trial_desc:"「头一回，官府不夺咱的规矩。」部族首领愣了半晌，才说出这句话。沙漠各部族自有祖传的断案规矩，须弥决意认下他们的断案之权，不轻易插手。这等因俗而治省了许多麻烦，也让部族觉着受了尊重。"
 SUM_Neo_Dec_Des_Water:"凿渠引水"
 SUM_Neo_Dec_Des_Water_desc:"一个娃娃把手伸进渠里拨水，笑得直喊：「水来了！」原来沙漠里处处缺水，两片绿洲隔着茫茫黄沙。须弥便动了开挖水渠的念头，把远处的水一路引来，多灌几片田地。通水当日，各村的人都赶到渠边看热闹。从此荒漠也能种出庄稼来，这法子实在巧妙。"
 SUM_Neo_Dec_Des_School:"沙海设序"
 SUM_Neo_Dec_Des_School_desc:"「我这辈子，头回写自己的名字。」老牧民写到一半，停了笔。沙漠百姓多不识字，吃过不少哑巴亏，须弥便办起识字学堂，教他们读写算数。头一堂课，人人开了窍。学堂一立，后辈便有了出头的指望。"
 SUM_Neo_Dec_Des_Scout:"沙碛遣谍"
 SUM_Neo_Dec_Des_Scout_desc:"「那伙人，往东去了。」斥候牵着驼在沙里转了三日，回来只报了这一句。沙口一带地形杂，黄沙漫道，盗匪出没，须弥便派斥候扮作行商，四处巡查打探。有了这耳目，敌情早知，遇事便不慌。"
 SUM_Neo_Dec_Des_Chief:"诸部会议"
 SUM_Neo_Dec_Des_Chief_desc:"起先那几位首领隔着半张桌子，谁也不搭理谁。后来有人递过水囊，话才慢慢多了。沙漠里的部族各立山头，很难齐心，须弥干脆把各路头人请到一处议事。这首席一设，缺的能互通、旧怨能化解，整片沙漠也就拧成了一股。"
 SUM_Neo_Dec_Des_Smuggle:"缉此私贩"
 SUM_Neo_Dec_Des_Smuggle_desc:"「就这一趟，放小的一回？」走私的被截住，还求情。「不行。」守卡的把货一扣。沙漠一带走私猖獗，货物逃税，钱财白白外流，须弥决意严查：沿途设卡，见货就查，查获便抄。走私一断，财源不再流失，规矩也立起来了。"
 SUM_Neo_Dec_Des_Mine:"沙中凿冶"
 SUM_Neo_Dec_Des_Mine_desc:"「看见了！是铁！」一个矿工高举刚挖出的矿石大喊，众人呼啦一下围拢来看。沙漠深处原本埋着不少矿，却一直没人动手，好好儿的宝贝就那么埋着。须弥召集人手架起井架、运来家伙，一头扎进沙海开挖。矿一出土，等于又添了一条进项。"
 SUM_Neo_Dec_Des_Garrison:"洲中屯锐"
 SUM_Neo_Dec_Des_Garrison_desc:"营盘刚扎好，盗匪就远远探了两回，见那旗帜整齐，没敢下手。绿洲水草丰美，向来是兵家必争，须弥决意在水源要紧处驻军，守护百姓。驻军一设，盗匪不敢来犯，商旅也得安宁。"
 SUM_Neo_Dec_Ora_Shrine:"重葺草神之祠"
 SUM_Neo_Dec_Ora_Shrine_desc:"老信众进来，见神像重新描了金，双手合十，眼泪就下来了。草神的圣所年久失修，香火冷落，须弥决意重整：重塑神像、清扫庭除，让它重现庄严。这一修，信众有了瞻仰处，人心也聚拢了。"
 SUM_Neo_Dec_Ora_Festival:"花神诞祭启幕"
 SUM_Neo_Dec_Ora_Festival_desc:"街上渐渐有了喜庆气：扎彩灯的忙彩灯，备祭品的忙祭品，搭戏台的忙戏台。花神诞祭将近，须弥上下都动了起来。一个孩童举着彩灯跑过，险些撞翻祭品，被他娘一把揪住。祭典一端起，举国同庆，连净善宫门前也热闹了几分。"
 SUM_Neo_Dec_Ora_Dream_Record:"录梦成卷"
 SUM_Neo_Dec_Ora_Dream_Record_desc:"须弥人如今不做梦，可旧日的梦还在。须弥组织学者寻访老人，围在火塘边，把梦中见闻一一记下，连梦里见过的小东西也照样画下来。有个老人说着说着，停了半晌：「那棵树，如今还在么？」这记录一端，存住了将失的记忆。"
 SUM_Neo_Dec_Ora_Aranara:"修兰那罗祀"
 SUM_Neo_Dec_Ora_Aranara_desc:"雨林深处住着一群兰那罗，与世无争，却掌着古老的记忆。须弥决意备下礼物，向他们致意修好。使者捧着果子走进林子，那些小家伙躲在叶后探头。这等示好，能换来情谊，也换来宝贵的扶持。"
 SUM_Neo_Dec_Ora_Heal:"假梦医创"
 SUM_Neo_Dec_Ora_Heal_desc:"老兵醒来摸着旧伤，长叹：「这些年，总算睡了个安稳觉。」须弥人心里埋着多年的旧伤，难以启齿，须弥便借梦的法子，配一炉安神香、几味汤药去安抚。梦里由医者引着走一遭，醒来心里便松快些。心病还须心药医，果然不假。"
 SUM_Neo_Dec_Ora_Pilgrim:"千里谒庙"
 SUM_Neo_Dec_Ora_Pilgrim_desc:"一个老婆婆拄杖走了一程，笑道：「这下，能走到跟前了。」净善宫深在里头，寻常百姓根本靠不近。须弥便特地修出一条朝圣的路，让信众能一路瞻拜过去。路修好当日，四乡的人都跑来看。这一来既便了信众，也把对草神的诚敬摆在了明处。"
 SUM_Neo_Dec_Ora_Hymn:"兰那罗歌队"
 SUM_Neo_Dec_Ora_Hymn_desc:"歌声一响，满场都静了，有人听着听着落了泪，说是想起小时候。兰那罗歌声动人，最擅吟唱古谣，须弥便组织他们成立诗班，在祭典上歌唱。这歌声如天籁入耳，把雨林的灵气都唱了出来。"
 SUM_Neo_Dec_Ora_Clergy:"颁命诸神"
 SUM_Neo_Dec_Ora_Clergy_desc:"「稳住，神看着呢。」老祭司低声叮嘱。受封当日，新任祭司捧着祭器，手还有些抖。神职主持祭祀、引导信众，缺不得，须弥决意册封一批新的补上手。册封一毕，香火有人承接，教义也有人宣讲。"
 SUM_Neo_Dec_Ora_Doctrine:"缀辑教条"
 SUM_Neo_Dec_Ora_Doctrine_desc:"「这些话，再不记下就散了。」一位老学者守着那堆断简残篇直发愁。草神的道理，历来靠人口口相传，东一句西一句没个准。须弥便召集学者，把这些零碎搜罗起来，编成册子，让信众有个依循。道理一落成书，便好传给后世了。"
 SUM_Neo_Dec_Ora_Truth:"究其旧称"
 SUM_Neo_Dec_Ora_Truth_desc:"「这一行，怎么空了一块？」学者翻着旧档忽然停住，旁边人忙拉他袖子，示意别问。世界树下，多少名字被悄然抹去，连亲人也记不得，须弥决意追问那些失落的名字，寻回真相。这等追根究底，是需要几分胆气的。"
 SUM_Neo_Dec_Ora_Guard:"护此神木"
 SUM_Neo_Dec_Ora_Guard_desc:"「谁？」新兵见树下黑影一晃，握紧了戈喝问，却原是只夜鸟。世界树是须弥根本，神圣不可侵犯，须弥便派翠绿卫队日夜轮班守护，防歹人破坏。卫队一站，树安稳了，信众也安心。"
 SUM_Neo_Dec_Ora_Blessing:"盛陈赐嘏"
 SUM_Neo_Dec_Ora_Blessing_desc:"「求个好收成，娃们就不挨饿了。」老农跪在坛下，嘴里反复念叨。为了让国泰民安、风调雨顺，须弥举国祈求草神赐福，祭司们设坛祈禳，诚心祷告。赐福虽只是个心愿，倒也把人心聚到一处，让百姓有了盼头。"
 SUM_Neo_Dec_Ora_Temple:"殿宇告成"
 SUM_Neo_Dec_Ora_Temple_desc:"有个工匠特地从沙漠跑到雨林的工地上，看了直点头：「这木头盖的，比石头还精神。」须弥的主意，是在雨林和沙漠各立一座神殿，让两边的人都能就近拜神。工地上分头动工，各显手艺：雨林那座用木料，沙漠那座使石块。两座殿一分，草神的威名便传遍四方。"
 SUM_Neo_Dec_Ora_Covenant:"树下要盟"
 SUM_Neo_Dec_Ora_Covenant_desc:"重立当日，兰那罗捧着旧盟书来，和新的并在一处，按了手印。须弥与兰那罗旧日曾立绿荫之约守护雨林，这些年约定渐疏，如今决意重立盟约、再续前缘。约一重立，雨林又有了守护。"
 SUM_Neo_Dec_Ora_Dreamgate:"叩梦之扉"
 SUM_Neo_Dec_Ora_Dreamgate_desc:"门一开缝，一个老者探头往里张望，眼眶忽地红了：「我梦见我娘了。」须弥人做了千万年的梦，到如今竟无处找寻。为此决意开启梦境之门，让人重新看一眼那梦里的世界。门一敞开，那些丢了许久的梦，便一个个回来了。"
 SUM_Neo_Dec_War_Recruit:"括丁充军"
 SUM_Neo_Dec_War_Recruit_desc:"「活着回来。」一个娘拽着儿子的袖子，把一包炒米塞进他怀里。儿子点点头，没敢回头。边境上风声一天紧似一天，须弥颁下征兵令，各处张榜招壮丁，年轻子弟纷纷披甲执兵，辞别爹娘来报到。这兵一征，国中便有了御敌的底气。"
 SUM_Neo_Dec_War_Drill:"三军演武"
 SUM_Neo_Dec_War_Drill_desc:"新兵虽多，却未经历战阵。须弥组织全军操演：列阵、冲杀、进退、号令，日日不息。教场上旌旗一色，弩手压住后排，长枪手伏在沙棱后头。有个新兵慢了半拍，被教头吼道：「跟上了！」这操演一端上规矩，乌合之众也练成劲旅。"
 SUM_Neo_Dec_War_Arsenal:"廓军械坊"
 SUM_Neo_Dec_War_Arsenal_desc:"「这刀，能砍断铁。」工匠打出新刀，举到光里一照，笑道。刀枪甲胄是打仗的根本，须弥决意扩建兵工厂，添炉灶、增工匠，炉火昼夜不熄。厂子一扩，军械便源源打了出来，供给前军。"
 SUM_Neo_Dec_War_Port:"奥摩斯港拓埠"
 SUM_Neo_Dec_War_Port_desc:"奥摩斯港船只日多，泊位不够，常常挤作一团，两艘船抢一个位子，吵得不可开交。须弥决意扩建泊位，深挖港池，多搭码头。这港口一扩，舰船进出便利，海运也跟着兴旺。"
 SUM_Neo_Dec_War_Fleet:"舟师巡海"
 SUM_Neo_Dec_War_Fleet_desc:"有两艘匪船被拦下，匪徒跳水便跑，舰上的人也不追，只把空船拖回港。近海常出没盗匪，劫掠商船，行旅不安，须弥便派舰队扬帆巡航，遇匪就打，绝不轻饶。舰队一巡，海面清靖，商旅往来再无忧。"
 SUM_Neo_Dec_War_Air:"飞军巡徼"
 SUM_Neo_Dec_War_Air_desc:"「那边扎了三顶帐篷。」一架飞机掠过沙口，回来报了这一句。须弥新添了空军，能御风而行、俯瞰四方，便派他们巡逻边境、查探敌情。这空军一巡，如同苍鹰盘空，什么异动都逃不过它的眼睛。"
 SUM_Neo_Dec_War_Fort:"增筑坚堡"
 SUM_Neo_Dec_War_Fort_desc:"「这厚度，撞不开了。」守军在城墙上走了走，拍拍墙砖道。边境要塞是国家的门户，须弥决意加固：把墙筑厚、把壕挖深、架上强弩。要塞一固，易守难攻，来犯的敌人休想越雷池一步。"
 SUM_Neo_Dec_War_Supply:"沿涂置亭"
 SUM_Neo_Dec_War_Supply_desc:"「好，没受潮。」押粮的老兵到了驿站，解开粮袋看了看，拍了拍道。兵马未动，粮草先行，须弥沿途增设驿站，囤粮草、备车马，好让前军补给不断。驿站一设，后顾无忧，打起仗来才有底气。"
 SUM_Neo_Dec_Dip_Liyue:"往聘璃月"
 SUM_Neo_Dec_Dip_Liyue_desc:"使节一到，那边设宴款待，席间说起旧年一笔矿买卖，两边都笑了。须弥与璃月素来交好，矿脉商道往来频繁，须弥便派使节带上国书和重礼前去商谈。这一来，两国的交情又近了几分。"
 SUM_Neo_Dec_Dip_Inazuma:"聘于东瀛"
 SUM_Neo_Dec_Dip_Inazuma_desc:"「既来了，就等得起。」使节在港口等了半月才获准上岸，随行的人急了，他却是这句话。稻妻锁国多年，关津严密，外人难得入门，须弥便远渡重洋备下厚礼，要同它修好通商。这等远交，需要几分胆识与耐心。"
 SUM_Neo_Dec_Dip_Natlan:"与纳塔界"
 SUM_Neo_Dec_Dip_Natlan_desc:"「就依这个办。」使节把地图在桌上一摊，手指按住一条线。纳塔人盯着看了半晌，终于点头。沙口之争原本各说各有理，须弥与纳塔相持不下；如今遣使把道理摆开、界限划清，这一场交涉，到底免了一场刀兵。"
 SUM_Neo_Dec_Dip_Fontaine:"效枫丹工"
 SUM_Neo_Dec_Dip_Fontaine_desc:"工坊里摆着一具拆开盖的机件，围了半屋子匠人，谁也不敢先动手。末了老师傅撸起袖子：「我来！」枫丹的机械精巧天下闻名，须弥决意学它的手艺，请巧匠来讲学，买机件回来仿制。手艺一学来，本国工匠便大长进。"
 SUM_Neo_Dec_Dip_Snezhnaya:"察朔北旅"
 SUM_Neo_Dec_Dip_Snezhnaya_desc:"有一回车底翻出个夹层，里头净是些说不清的物件。至冬商队往来频繁，难免夹带蹊跷，须弥便严加稽查：验货查人，一丝可疑也不放过。稽查一严，那些居心不良的便无处遁形。"
 SUM_Neo_Dec_Dip_League:"七邦同文"
 SUM_Neo_Dec_Dip_League_desc:"须弥首倡七国学术联盟，广发檄文，邀各国学者互通有无，共研学问。驿马沿商道一路跑出去，卷轴上的墨还没干透。联盟一立，倒真让天下学问聚于一堂，彼此切磋，人才往来如织。"
 SUM_Neo_Dec_Dip_Aid:"援及邻邦"
 SUM_Neo_Dec_Dip_Aid_desc:"灾民看见粮车，呼啦啦跪了一地，一个老者抱着米袋哭道：「这粮，救了俺全家！」邻国遭了灾，哀鸿遍野、饿殍塞道，须弥不忍袖手，筹了粮米草药装满几车送去。这救济一端，人命救了，善缘也结下了。"
 SUM_Neo_Dec_Dip_Voice:"远扬声教"
 SUM_Neo_Dec_Dip_Voice_desc:"七国议事，须弥不可无声。须弥决意遣使出席，带一卷舆图、一包香料，在各国场合替本国说话，争那该得的分寸。这声音一发，须弥在天下便有了地位。回国当日，使者把议定的文书誊了一份，压在马鞍下带回来，进门先掸了掸身上的尘。"
 SUM_Neo_Dec_Won_Surasthana:"净善宫重饰"
 SUM_Neo_Dec_Won_Surasthana_desc:"壁画剥落得厉害，老匠拿笔比了半天，叹道：「这一笔，得照原样描。」净善宫多年没人住，梁木朽、瓦片落，须弥决意大加整修，把梁柱一根根扶正，丹青一笔笔补上，要还它旧日气象。这座宫一修葺，那些压在尘土底下的往事，就有了依托。"
 SUM_Neo_Dec_Won_Alcazar:"夷摩旧构"
 SUM_Neo_Dec_Won_Alcazar_desc:"卡维的无郁夷摩宫，先前因缺钱停了工。如今银钱既备，须弥决意续建，了却卡维一桩心愿。梁木从雨林伐来，石料从旧窟凿出，脚手架支到半空。卡维仰头看了半晌，笑道：「这回，能盖完了。」这宫一续建，那巧思巨构终得落成。"
 SUM_Neo_Dec_Won_Ormos:"奥港修舟"
 SUM_Neo_Dec_Won_Ormos_desc:"奥摩斯港外的座舰，久经风浪，船体破损。须弥决意修复：更换船板，重竖桅杆。有个老船匠敲了敲新换的船板，笑道：「结实。」这舰一修好，又能扬帆出海，再展须弥海上之威。"
 SUM_Neo_Dec_Won_Road:"开筑驰道"
 SUM_Neo_Dec_Won_Road_desc:"教令院下了告示，要修一条大驿道，从雨林直通沙漠。征来的民夫沿路扎营，白日夯土，夜里烧石，一车车碎石压进泥里。有个老工匠摸着路面道：「这条路一修成，沙漠与雨林，就再没隔断。」众人听了，都直起腰笑了。"
 SUM_Neo_Dec_Won_Canal:"凿通长渠"
 SUM_Neo_Dec_Won_Canal_desc:"雨林外缘那一带泥软水浅，教令院点了三百人挖渠。铁锹下去，泥浆没到膝盖，挖渠的赤着上身，一筐筐往外抬。有个后生滑倒在泥里，抹了把脸，又爬起来挖。这渠一成，上游的水便分到下游田里去了。"
 SUM_Neo_Dec_Won_Market:"广其市集"
 SUM_Neo_Dec_Won_Market_desc:"须弥城的市集原只一条街，买卖挤在一处，肩碰肩，脚踩脚。教令院拨了钱，把两旁的棚子拆了重起，又多划出三进场子。开市当日，香料、布匹、陶器摆得满街，喊价的嗓子此起彼落。有个卖香料的终于有了自家摊子，笑得合不拢嘴。"
 SUM_Neo_Dec_Won_Library:"筑楼庋书"
 SUM_Neo_Dec_Won_Library_desc:"教令院要另起一座藏书楼，择的是城东高地。工匠先立石基，再架木梁，梁上刻了防潮的纹路。有个老书吏每日来看，蹲在地基边道：「这楼里要收的，是几百年没人敢翻的卷子。」年轻工匠听了，手上也都仔细了些。"
 SUM_Neo_Dec_Won_Mint:"设冶钱局"
 SUM_Neo_Dec_Won_Mint_desc:"铸币的工坊设在城西，门口兵丁把守，闲人不得近前。炉火烧得通红，铜饼在砧上压过一道又一道，压出的摩拉堆进木箱，箱盖一合便上锁。掌事的拍拍箱子道：「钱出自谁的手，权便落在谁的手。」旁边人听了，都没敢接话。"
 SUM_Neo_Dec_Won_Plant:"设香作场"
 SUM_Neo_Dec_Won_Plant_desc:"一个老妇拈起一撮香料闻了闻，点头赞道：「这成色，不比外邦差。」城外新盖起三排屋舍：一排晾料，一排碾磨，一排装袋，女人们坐在屋檐下挑拣，指甲缝里尽是赭红。先前香料得送到外邦去加工，如今自家动手做，价钱便下来了。"
 SUM_Neo_Dec_Won_Loom:"设织作局"
 SUM_Neo_Dec_Won_Loom_desc:"织造工坊里摆了四十张机，脚踏板一响，梭子来回穿，一日能出十几匹布。管事的挑了几个手快的妇人做头，工钱按匹算。有个老织工摸着新布，赞道：「这经纬，比外邦的还密。」那几个妇人听了，脚下踩得更欢了。"
 SUM_Neo_Dec_Won_Wall:"增陴浚隍"
 SUM_Neo_Dec_Won_Wall_desc:"「不吱呀了，踏实。」守兵夜里巡墙，踩着新换的木板走了走，笑道。各城的墙都旧了，雨林的潮气把砖泡酥，指头一抠就掉渣，教令院便调石匠分段修补：墙头加高两尺，垛口重新排过。"
 SUM_Neo_Dec_Won_Sky:"浮城筑垒"
 SUM_Neo_Dec_Won_Sky_desc:"教令院兴了一桩大工，要在半空里造城。工匠把石料配上浮空机件，一块块吊上去，白日看去，像云里悬着一堆碎瓦。有个老工匠仰头看了半晌，擦了擦眼花，叹道：「这不是人间的活计。」旁边年轻工匠听了，倒觉得新鲜。"
 SUM_Neo_Dec_Gen_Resume:"复启神造"
 SUM_Neo_Dec_Gen_Resume_desc:"造神计划停了半年，这一日又开。各道工序重新点卯，人偶的架子从库里抬出来，蒙在上头的布一掀，灰扑了满地。工匠们咳嗽着后退一步。大贤者只看了一眼，吐出两个字：「接着办。」众人便都低头干活去了。"
 SUM_Neo_Dec_Gen_Shell:"缀木成偶"
 SUM_Neo_Dec_Gen_Shell_desc:"工坊深处摆着一具躯体，四肢分作几段，工匠照图样一段段接。接口处要严丝合缝，差一分便得重来。有个守夜的半夜听见里头响动，推门一看，只见半截手臂在灯下泛着冷光，吓得他手里的灯差点掉了。"
 SUM_Neo_Dec_Gen_Test:"布此试局"
 SUM_Neo_Dec_Gen_Test_desc:"试验当日，场中清得干净，围了三层人。那具躯体被推到中央，掌事的念了指令，它便抬手、转身、下跪，做得齐整。看的人先是叫好，后来都没了声：只见它伸手一捏，把一块铁石捏成了粉末，从指缝里簌簌落下。"
 SUM_Neo_Dec_Gen_Knowledge:"以识灌注"
 SUM_Neo_Dec_Gen_Knowledge_desc:"虚空终端连着那具躯体的后颈，一股股学问灌将进去。书吏在旁记数，灌到第三日，纸上已记满。老学者瞧着说道：「这几百年典籍，它一夜吞下，却不知哪一条该用在哪处。」旁边人听了，都若有所思。"
 SUM_Neo_Dec_Gen_Ritual:"盛陈降神"
 SUM_Neo_Dec_Gen_Ritual_desc:"降神的仪式要办得隆重，教令院先清了场，备下香烛净水与一面大鼓。仪官练了七日步法，走错一步便重来。到了前夜，净善宫外挂了满墙的灯，风一吹，灯影在墙上乱晃。有个小沙弥偷看了一眼，被师父喝去：「闭眼，不许看！」"
 SUM_Neo_Dec_Gen_Deshret:"修葺赤王陵"
 SUM_Neo_Dec_Gen_Deshret_desc:"赤王陵的甬道积了几百年的沙，教令院派人一车车往外运。挖到第七日，露出一道石门，门上刻的纹路没人认得。带队的学者伸手一摸，指上沾了层细粉，凑近一闻，脸色一变：「这不是沙。」同伴听了，都把手缩了回去。"
 SUM_Neo_Dec_Gen_Machine:"仿其机枢"
 SUM_Neo_Dec_Gen_Machine_desc:"阿玛塔的机核只剩残件，工匠照残件反推图样，画了又撕，撕了又画。第十一日，头一枚复刻的机核出炉，转了三圈便停。掌事的捧在手里，皱眉道：「还差一口气。」工匠们听了，又低头去改那图样。"
 SUM_Neo_Dec_Gen_Factory:"工坊营转"
 SUM_Neo_Dec_Gen_Factory_desc:"沙漠里的工厂昼夜不歇，烟囱的黑烟顺风往南去，落在村落的水井上。工人三班轮换，交接时只点点头，不说话。有个老工人掰着指头算，叹道：「两个月，没见着日头了。」旁边人听了，也都没有言语。"
 SUM_Neo_Dec_Gen_Abyss:"究此禁术"
 SUM_Neo_Dec_Gen_Abyss_desc:"翻到半路，一个人忽地掩住嘴，声音发颤：「这上头写的，不是人间的话。」库里封着一批卷子，外头裹了三层布、贴着封条，这天封条揭开，学者点起灯逐页翻看。掌事的头也不抬：「接着抄。」那人手抖得厉害，终究还是抄了下去。"
 SUM_Neo_Dec_Gen_Seal:"封识益固"
 SUM_Neo_Dec_Gen_Seal_desc:"「既怕它出来，何苦又去招惹？」年轻书吏问道。掌事的把手一摊：「锁得住，才敢碰。」教令院一面翻禁忌、一面加固封印，两头都做：石匠在遗迹口砌了三重墙，书吏给每卷禁书编号锁进铁柜。那人似懂非懂，低头锁柜去了。"
 SUM_Neo_Dec_Gen_Censor:"申禁益严"
 SUM_Neo_Dec_Gen_Censor_desc:"禁令原本只管几类书，这一回添了一大摞名目，连讲星象、讲古史的都算在内。书吏挨家去搜，搜出的卷子堆在院里烧，火光映得半条街通红。有个学生站在人堆里，嘴唇动了动，想说什么，终究没出声，把头低了下去。"
 SUM_Neo_Dec_Gen_Police:"增设诇察"
 SUM_Neo_Dec_Gen_Police_desc:"旁人问起问了什么，他只摇头：「没问什么。」此后再没人敢问。城里新设一处衙署，门脸不起眼，进出的人都不着官服，白日里坐在茶摊只喝茶不言语，夜里便有人被请去问话，问完放回来，脸白得像纸。"
 SUM_Neo_Dec_Gen_Mobilize:"举邦尽起"
 SUM_Neo_Dec_Gen_Mobilize_desc:"征召令一颁，各城丁壮都要造册，一家出几人，按田亩算。差役拿着册子在巷口点名，点到谁，谁便收拾行李。有个妇人拽着汉子的袖子不肯放，差役把册子一合，说道：「这是大贤者的令。」妇人这才松手，汉子低头走了。"
 SUM_Neo_Dec_Gen_Dottore:"通款多托雷"
 SUM_Neo_Dec_Gen_Dottore_desc:"多托雷的使者又来了，这回带了一箱图样。箱子打开，里头的纸泛着异样的蓝。议事厅的门关了三日，送进去的饭食有一半原样端出来。第四日门开，掌事的只说了一句：「照他的法子办。」众人面面相觑，谁也没敢问那箱里到底是什么。"
 SUM_Neo_Dec_Gen_Throne:"筑座迎神"
 SUM_Neo_Dec_Gen_Throne_desc:"净善宫里新设了一座，座高三尺，铺着暗绿的绒。工匠量了又量，说这尺寸是照着神像的规制来的。座上还空着，每日有人来擦，擦得能照见人影。有个老侍从擦完退下，回头看了一眼，叹道：「这椅子，还不知谁来坐。」"
 SUM_Neo_Dec_Cri_Famine:"发廪赈饥"
 SUM_Neo_Dec_Cri_Famine_desc:"南边几个村子遭了灾，田里颗粒无收，人啃树皮啃到发苦。教令院开了仓，粮车一辆接一辆往南去。村口排起长队，一人一斗，凭牌领取。有个老汉把粮袋抱在怀里，蹲在墙根下不肯走，旁人劝他回家，他只摇头：「我得看着粮。」"
 SUM_Neo_Dec_Cri_Plague:"疫气尽消"
 SUM_Neo_Dec_Cri_Plague_desc:"瘟疫起于城西水巷，先是几户发热，后来一条街都关了门。教令院派医者，白布蒙面，挨户去诊，诊完把病人抬到城外帐里隔开。有个汉子守着亲人不肯走，医者说道：「你留着，他也活不成。」那汉子这才被人架了出去。"
 SUM_Neo_Dec_Cri_Withering:"扫平荒域"
 SUM_Neo_Dec_Cri_Withering_desc:"死域的边界一年往北挪一里，到的地方草木枯黑，鸟兽绝迹。巡林队带着火与刀进去，见一株烧一株，烧完在原地撒盐。有个年轻的说道：「这地，几十年长不出东西了。」老巡林官没答，只把刀插回鞘里，转身走了。"
 SUM_Neo_Dec_Cri_Riot:"弭此乱萌"
 SUM_Neo_Dec_Cri_Riot_desc:"城里闹了起来，起因是粮价，闹到后来连官署的门都砸了。治安官带人赶到，先不拔刀，站在台阶上喊道：「都散了！有事慢慢说！」喊了三遍没人听，才叫后队上前。散场时地上落了一只鞋，没人来捡。"
 SUM_Neo_Dec_Cri_Refugee:"抚辑流亡"
 SUM_Neo_Dec_Cri_Refugee_desc:"沙漠那边涌来一批流民，赶着瘦驼，背着锅碗，在城门外扎了营。教令院划了块空地安置，发口粮与草席，又派人登记姓名。书吏问一句，他们答一句；问到原籍，许多人都低下头不作声。有个娃捧着草席，问娘：「咱还回去么？」娘没答。"
 SUM_Neo_Dec_Cri_Strike:"解作坊之争"
 SUM_Neo_Dec_Cri_Strike_desc:"工坊停了工，机器冷着，人坐在门口晒太阳。管事的去问，工人们只说工钱太薄，一日的力气换不来一日的饭。有个老匠把工具往地上一搁：「干不动喽。」调停的来了三日，末了在纸上按了手印，工钱添一成，机器才又转起来。"
 SUM_Neo_Dec_Cri_Sandstorm:"沙后抚伤"
 SUM_Neo_Dec_Cri_Sandstorm_desc:"那场沙暴刮了一夜，天亮时半个村子被沙埋了。人们拿铁锹挖，先挖出门，再挖出窗，挖出来的牲口已经硬了。有个妇人扒着窗户口哭喊自家娃的名字。教令院的人来点数，一面数一面记，记完说道：「往后再不在这处住人。」"
 SUM_Neo_Dec_Cri_Water:"水利复通"
 SUM_Neo_Dec_Cri_Water_desc:"西边几处绿洲的水一年浅似一年，井绳放下去，够不着底。教令院调了水车与渠工，从上游引一道细流下来。水到村口当日，孩子们赤脚在水里追着跑。有个老人蹲在渠边，掬了一捧水，看了很久，叹道：「这水，总算又回来了。」"
 SUM_Neo_Dec_Cri_Bandit:"戡定沙寇"
 SUM_Neo_Dec_Cri_Bandit_desc:"商道上有一伙沙匪，占了隘口，过往商队都要留下三成货。教令院派兵去剿，兵分三路，夜里摸上隘口。火把一亮，匪众四散。头目被押回来时还在笑，说道：「这条道上的规矩，从来是强者立的。」押他的兵一脚踹在他膝弯上，他才跪了。"
 SUM_Neo_Dec_Cri_Spy:"芟除谍者"
 SUM_Neo_Dec_Cri_Spy_desc:"教令院里查出一桩事：有个抄书的书吏，抄了十年公文，抄的都是不该外传的。抓他当日，他正在灯下誊写，笔没停，只问一句：「你们是怎么看出来的？」来人没答，只把纸笔一收。押走时，桌上那页纸才写了一半。"
 SUM_Neo_Dec_Cri_Cult:"禁绝妖言"
 SUM_Neo_Dec_Cri_Cult_desc:"城南有一处院子，夜夜有人聚，门窗糊得严实，只听见低低念诵。查禁的破门进去，见墙上画着一只眼睛，香炉里的灰还热。众人跪了一地，无一人抬头。领头的说道：「我们求的不是神，是不死。」查禁的听了，把香炉一脚踢翻。"
 SUM_Neo_Dec_Cri_Wild:"逐兽出林"
 SUM_Neo_Dec_Cri_Wild_desc:"雨林深处下来一头巨兽，踏坏三亩稻田，夜里在村口转，眼睛像两盏灯。村民敲锣打鼓赶了几夜，赶不走。后来巡林队来了，一支带药的箭射中它的腿，它才一瘸一拐退回林子里。有个村民抹着汗道：「这大家伙，总算走了。」"
 SUM_Neo_Dec_Cri_Landslide:"崩岸急筑"
 SUM_Neo_Dec_Cri_Landslide_desc:"连日大雨，山坡塌了半边，泥石堵了商道，底下压着两辆货车。抢修的人冒雨上工，铁镐砸下去，泥一汪汪地流。有个后生一边挖一边骂天。挖到第二日，挖出一只车轴，人围过去看了看，谁也没说话。"
 SUM_Neo_Dec_Cri_Amnesty:"涣汗大号"
 SUM_Neo_Dec_Cri_Amnesty_desc:"大赦的告示贴在四门，狱里放出百来号人，一个个在日头下眯着眼，站了半天不知往哪里去。有个老汉在门口等儿子，等到天黑才等着。父子对看了一眼，谁也没哭。老汉只把手往儿子肩上一按：「走，回家。」"
 SUM_Neo_Dec_Cri_Memorial:"抚吊殁者"
 SUM_Neo_Dec_Cri_Memorial_desc:"追悼当日，广场上摆了长桌，桌上一排空碗，碗里各插一支白花。念名的一个接一个念，念到一半嗓子哑了，换人接着念。有个娃问娘：「他们怎么不答应？」娘一把捂住他嘴。风把花吹落几朵，没人去捡。"
