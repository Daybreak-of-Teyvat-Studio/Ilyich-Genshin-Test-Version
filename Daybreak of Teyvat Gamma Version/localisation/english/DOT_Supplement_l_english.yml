 SOV_second_five_year_plan_fake_1939_ns_desc:0 "$SOV_third_five_year_plan_desc_default$"
 SOV_seraya_loshad_battery:0 "Seraya Loshad Battery"
 SOV_sevastopol_marine_plant:0 "Sevastopol Marine Plant"
 SOV_shipyard_staff_purged:0 "Shipyard Staff Purged"
 SOV_shipyard_staff_purged_desc:0 "After a large-scale investigation into multiple allegations of sabotage and other suspicious activities in the Navy, the NKVD has made numerous arrests, leaving some of our shipyards and naval bases seriously understaffed."
 SOV_shocked_by_surprise_attack:0 "Shocked by Surprise Attack"
 SOV_shocked_by_surprise_attack_cant_join_factions_tt:0 "Set the rule: £trigger_no Can join factions."
 SOV_shocked_by_surprise_attack_desc:0 "The enemy military operation against our country, codenamed Operation Countenance, has taken our government and military by surprise. Our forces are overwhelmed, our communications have been cut off, and summoning enemy diplomats to demand an explanation has turned out to be futile. While we try to figure out this chaos, our foreign relations are effectively neutralized."
 SOV_siberian_lessons:0 "Siberian Lessons"
 SOV_soviet_advisors_spr:0 "Soviet Military Advisors"
 SOV_soviet_advisors_spr_desc:0 "Military advisors and other skilled military personnel have arrived from the [SOV.GetNameDef] to support us in our fight against fascism and the reactionary counter-revolution."
 SOV_soviet_airforce_aircraft_production_focus_dynamic_modifier:0 "$SOV_soviet_airforce_dynamic_modifier$"
 SOV_soviet_airforce_aircraft_production_focus_dynamic_modifier_alt:0 "$SOV_soviet_airforce_dynamic_modifier_alt$"
