 SUM_Neo_SGS.7.d:"矫论团守着几卷经书，写的是花灵与凡人如何共处。经义不深，做起来难。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
