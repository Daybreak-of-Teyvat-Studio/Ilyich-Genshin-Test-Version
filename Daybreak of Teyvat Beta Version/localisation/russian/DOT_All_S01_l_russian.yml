LYY_Wonder_DecCat:0"Проект использования чудес Ли Юэ"
LYY_Wonder_DecCat_desc:0"\nЗемли Ли Юэ полны природных и рукотворных чудес. Вложив ресурсы, мы можем использовать их.\n\nНефритовая палата находится в [?global.LYY_Location_of_127] [?global.LYY_Location_of_127.GetName], владелец — []\nНефритовая палата даёт сильные негативные эффекты в регионе. Если регион захвачен врагом, он может потратить очки командования, чтобы разрушить палату. Если регион контролируется силами Ли Юэ, палата может сменить владельца!"
MOT_Wonder_DecCat_Statue:0"На высоте, ведя народ"
MOT_Wonder_DecCat_Statue_desc:0"§gВетер разносит семена одуванчиков, стихи и истории, а также мягких путешественников.§!\n\nСтатуя Барбатоса — не только туристическая достопримечательность, но и чудо, хранимое Богом Ветра.\nВ мирное время туристы приезжают сюда, чтобы полюбоваться статуей. Многие мондштадтцы считают полёт к рукам статуи доказательством мастерства. Брошенные оттуда семена одуванчиков разносятся по миру.\nЭто здание обладает туристической и культурной ценностью, и мы можем использовать её.\n\nТекущий этап: [?MOT_WOnder_Statue_Buildx]"
MOT_Wonder_DecCat_Tree:0"Ветреный край"
MOT_Wonder_DecCat_Tree_desc:0"§gНеустанный ветер омывает эту землю. Великое дерево, посаженное героями, тихо шумит на ветру.§!\n\nВ Ветреном крае растёт гигантское дерево, тень которого сравнится с Собором Запада. Говорят, здесь Ураган заключил союз с Барбатосом.\nЗдесь пересекаются пути путешественников, и вокруг вырос город. Дерево — это общая память жителей, но его среде угрожает опасность. Вложив средства, мы можем превратить его в парк, где посетители будут слушать наши истории и проникаться нашей культурой.\n\nТекущий этап: [?MOT_WOnder_Tree_Buildx]"
MOT_Wonder_DecCat_Sea:0"Море Одуванчиков"
MOT_Wonder_DecCat_Sea_desc:0"§gУ одуванчиков нет языка, они не могут говорить. Я лишь смотрю, как она, как великан, срывает мой одуванчик пальцами.§!\n\nМоре Одуванчиков когда-то считалось вымыслом, но наши исследователи нашли его на севере, и теперь оно под нашим контролем.\n\n\nТекущий этап: [?MOT_WOnder_Tower_Buildx]"
MOT_Wonder_DecCat_Tower:0"Древняя башня"
MOT_Wonder_DecCat_Tower_desc:0"§gПравитель Башни исчез. Ветер в руинах шепчет тайны: о его хозяине, о духе ветра и о песнях, потрясших башню...§!\n\nРуины Урагана когда-то были столицей Декарабиана. Люди кланялись ему не из любви, а потому что ветер сбивал их с ног.\nС годами башня обветшала, но её огромные залы и механизмы всё ещё можно использовать. Мы можем создать музей, чтобы показать жестокость Декарабиана и укрепить свою власть.\n\nТекущий этап: [?MOT_WOnder_Tower_Buildx]"
MOT_Wonder_DecCat_Temple:0"Древний Храм тысячи ветров"
MOT_Wonder_DecCat_Temple_desc:0"§gРуины амфитеатра. Сухой ветер приносил сюда истории и уносил их вдаль.§!\n\nВ древности, во время борьбы Короля Ветра и Волка Севера, люди построили храм на восточных скалах, моля о защите. Они поклонялись Времени и Ветру. «Ветер приносит истории, время даёт им рост».\n\nТеперь это руины, место для археологов и искателей приключений. Вложив средства, мы можем возродить его.\n\nТекущий этап: [?MOT_WOnder_Temple_Buildx]"
MOT_Wonder_DecCat_Library:0"Библиотека Ордена Рыцарей Запада"
MOT_Wonder_DecCat_Library_desc:0"§gС момента основания Ордена, когда Легнфиндер превратил старые бани в библиотеку, усилиями поэтов, учёных и путешественников здесь собрано крупнейшее собрание книг на севере.§!\n\nБиблиотека полна знаний, привлекая учёных со всего мира. Мы можем расширить собрание и упростить доступ, превратив её в академический центр Мондштадта и всего севера.\n\nТекущий этап: [?MOT_WOnder_Library_Buildx]"
