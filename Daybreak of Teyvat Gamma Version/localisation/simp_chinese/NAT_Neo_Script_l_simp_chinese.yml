 NAT_Canopy_Saurian_Raising_Idea:"驯兽自畜"
 NAT_Canopy_Saurian_Raising_Idea_desc:"悬木人将幼兽抱回本族棚中养。一小兽方断奶，见生人便往后缩。管棚老猎户不急靠近，只将切好之肉放手心，蹲棚口一动不动。一路过外人伸手欲摸，小兽呲牙低吼，老猎户将他挡开：「急甚么，它犹未认人。」外人讪讪收手。老猎户日日来喂，喂前总先轻声唤一句本族调子。日子久，小兽一听那调子便凑来，自他手心叼走肉。及小兽长成，老猎户将手伸入棚内，它便低头蹭其手腕，任他套上脖圈。外人复伸手，它又躲老猎户身后。"
