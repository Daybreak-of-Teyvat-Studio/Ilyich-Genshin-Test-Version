 Basic_Food_and_Clothing:0 "Базовое благосостояние"
 Basic_Food_and_Clothing_desc:0 "В мире всё принадлежит всем, каждый заботится о своих, но есть законы и порядок. Это малая гармония."
 Collective_Prosperity:0 "Общее процветание"
 Collective_Prosperity_desc:0 "В великом мире все равны, и старые, и молодые находят покой, и никто не остаётся без заботы. Это великая гармония."

 
