 SUM_Neo.208.t:"沙漠的回声"
 SUM_Neo.208.d:"回声在沙丘间传开，说赤王要回来了。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。"
