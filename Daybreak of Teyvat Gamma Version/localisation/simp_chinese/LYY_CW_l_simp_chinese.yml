 KQP_Spirit_Red_Citadel:"墙字出城外"
 KQP_Spirit_Red_Citadel_desc:"城墙上大书一行，字高及丈，城外数里皆见。书者为一老匠，书毕自梯下，视之良久，谓字太大。主者答以大则远可见。老匠谓远可见者，亦远可射。主者谓射者射字，不射人。老匠乃言：字落则人仰视，见城上无人，心先散矣。主者默然，命于字下加筑一垛，垛成，字犹在，而射者不能及。是后每晨守卒登垛，必先视字，而后视野。城墙之石取自天衡山，石色青，雨后有光。"
 KQP_Spirit_Long_Morning:"天光迟复来"
 KQP_Spirit_Long_Morning_desc:"天亮得极慢，慢至人疑夜不肯尽。官署照旧启门，学堂照旧授课，灯笼一盏一盏撤下，无人言庆。小儿问其母今可贺乎。母问贺何事。儿谓夜尽矣。母良久乃言，夜尽者常也，非功也。儿不解。母指街示之，卖饼者已出摊，笼上白气初起。璃月港街上卖饼者先出摊，笼上白气初起，散于檐下。"
 LYY_News.100.t:"一纸公文封仙路"
 LYY_News.100.d:"璃月港钟声一晨敲了一刻。玉京台传出文书甚短，而港城议论之声由是尽止：自此仙凡两途分判，凡人不复受箓，仙人不复过问政务。悬于头顶多年那一条路，为一纸公文封了。\n或曰清醒，或曰忘本。药庐老医师收香炉入柜，收时以布裹三层。学堂新开之课，却排到明年，报名者挤破门槛。\n街上照旧买卖，惟路过旧祠，脚步不觉放慢。海风把告示吹得作响，纸角卷起，露出下面压着之旧符。有人伸手去扶，又缩回手来。\n是日港中卖符摊子收三家，卖纸笔者多五家。\n夜间更夫打更，经过旧祠，破例不敲梆子。\n此后三月，港中旧祠香火减七成。有些老人改为在家设一小龛，龛前不点香，只放清水一杯。有人问何意。老人曰：「不敬香，亦不算忘。」药庐那位老医师后亦取香炉出，摆在柜上，未点。柜上积灰，香炉上却无。\n旧祠前石阶，为人坐得发亮。"
 LYY_News.100.a:"路既断，人自向前"

