#####################
# 璃月大加班
#####################
 LYY_Wash1_dynamic_modifier:"加班狂潮"
 LYY_Wash1_dynamic_modifier_desc:"然也。七星安璃月之功，不至白费。惟加班不息，则前路自不断延伸。"
 A_Liyue_Nine_Nine_Six:"玉京台压力增大"
 A_Liyue_Nine_Nine_Six_desc:"突发之危，使我等之公务日繁。七星二星带头之下，政府为新务而疯狂加班，如仓鼠入健身之轮。今不得不于处理危机之余，兼顾公务员之健康。§Y工作压力定期而涨，至某阈值则触发负面事件。可用决议改工作压力之数与工作效率之级。效率之级愈高，压力涨愈速，触发负面事件之阈值亦愈低。§!§Y当前公务员工作压力：[?LYY_Work_Pressure|R]§!§Y工作效率等级：§![?LYY_Press_Level|R]"
 Liyue_Nine_Nine_Six:"玉京台压力增大"
 Liyue_Nine_Nine_Six_desc:"突发之危，使我等之公务日繁。七星二星带头之下，政府为新务而疯狂加班，如仓鼠入健身之轮。今不得不于处理危机之余，兼顾公务员之健康。§Y工作压力定期而涨，至某阈值则触发负面事件。可用决议改工作压力之数与工作效率之级。效率之级愈高，压力涨愈速，触发负面事件之阈值亦愈低。§!§Y当前公务员工作压力：[?LYY_Work_Pressure|R]§!§Y工作效率等级：§![?LYY_Press_Level|R]"
 LYY_More_Pressure:"加速政府运转"
 LYY_More_Pressure_desc:"为速决危机，将加快政府之运转，然公务员之健康恐愈劣。"
 LYY_Fewer_Pressure:"放缓政府运转"
 LYY_Fewer_Pressure_desc:"为使公务员长久任事，将暂缓工作之进度，然危机之决恐因之迟缓。"
 LYY_AUTO_Pressure:"案牍之劳形"
 LYY_AUTO_Pressure_desc:"公务员方勤于公务，而疲劳与疾病乘隙而上，扼其咽喉。§R此决议组定期重复，每毕一次，皆依当前效率之级增工作压力，并改下次循环所予政治点数之加成。§!"
 LYY_Regular_Physical_Exam:"生命之周期"
 LYY_Regular_Physical_Exam_desc:"工作压力既重，公务员之健康偶有集中爆发之时，其果恶劣。§R此决议组定期重复，每毕一次，若当前工作压力高于阈值，则触发负面事件。§!"
 LYY_Speed_up_Finance:"金融部门全力运转"
 LYY_Speed_up_Finance_desc:"将暂增公务员之任，以速金融之务，冀改经济之状。"
 LYY_Speed_up_Construction:"集中加速工业建设"
 LYY_Speed_up_Construction_desc:"将置工业生产与建设于工作之重，冀改建设生产之状。"
 LYY_Speed_up_Training:"全心投入军队动员"
