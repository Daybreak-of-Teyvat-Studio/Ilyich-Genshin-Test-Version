 SUM_Neo.269.t:"沙与林"
 SUM_Neo.269.d:"教令院的敕令同时贴上雨林的树与沙漠的墙。须弥的城与旷野要在同一条律法下生活。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。"
 SUM_Neo.269.a:"以武力压服"
 SUM_Neo.269.b:"以德政感召"
 SUM_Neo.270.t:"总督府"
 SUM_Neo.270.d:"教令院在沙漠设总督府，四个傀儡国的诏令从这里发出。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。教令院的门槛这几天被踩得很低，进去的人比出来的人多。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。"
 SUM_Neo.270.a:"先立威"
 SUM_Neo.270.b:"先立信"
 SUM_Neo.271.t:"整合苍漠囿土"
 SUM_Neo.271.d:"苍漠囿土被并入须弥的行省。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。"
 SUM_Neo.271.a:"由教令院决断"
 SUM_Neo.271.b:"交由地方自理"
 SUM_Neo.272.t:"沙漠自治"
 SUM_Neo.272.d:"守村人拿到自治的文书。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。教令院的门槛这几天被踩得很低，进去的人比出来的人多。高塔投下的影子越来越长，傍晚时就盖住了半条街。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。"
