 SPA_agustin_munoz_grandes:0 "アグスティン・ムニョス・グランデス"
 SPA_alfredo_kindelan_duany:0 "アルフレド・キンデラン・ドゥアニ"
 SPA_angel_salas_larrazabal:0 "アンヘル・サラス・ララサバル"
