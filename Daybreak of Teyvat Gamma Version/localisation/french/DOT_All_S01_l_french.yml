  # Politique nationale
  ANR_struggle_from_three_routes:0 "Lutte de lignes à Wolvendom"
  ANR_struggle_from_three_routes_desc:0 "La lutte de lignes à Wolvendom oppose Bennett, Fischl et Diona. Si aucun candidat ne remporte une influence écrasante, Razor peut rester le chef. §G Lorsqu'un candidat atteint 4 points d'influence, des politiques nationales lui sont débloquées. Vous pouvez aussi conserver Razor et ses réformes. §W Si un candidat atteint 5 points d'influence, Razor perd toute chance de rester au pouvoir. §R Points d'influence de Bennett : §W [?and_bennetts_influence] §Y Points d'influence de Fischl : §W [?and_fischls_influence] §B Points d'influence de Diona : §W [?and_dionas_influence]"
  ANR_support_Bennett:0 "Soutenir Bennett"
  ANR_support_Bennett_desc:0 "§R L'influence de Bennett augmente de 1 point §W"
  ANR_support_Fischl:0 "Soutenir Fischl"
  ANR_support_Fischl_desc:0 "§R L'influence de Fischl augmente de 1 point §W"
  ANR_support_Diona:0 "Soutenir Diona"
  ANR_support_Diona_desc:0 "§R L'influence de Diona augmente de 1 point §W"
  ANR_oppose_Bennett:0 "S'opposer à Bennett"
  ANR_oppose_Bennett_desc:0 "§R L'influence de Bennett diminue de 1 point §W"
  ANR_oppose_Fischl:0 "S'opposer à Fischl"
  ANR_oppose_Fischl_desc:0 "§R L'influence de Fischl diminue de 1 point §W"
  ANR_oppose_Diona:0 "S'opposer à Diona"
  ANR_oppose_Diona_desc:0 "§R L'influence de Diona diminue de 1 point §W"
  ANR_unite:0 "Unir Mondstadt"
  ANR_unite_desc:0 "§G S'il reste des puissances mondstadtiennes qui ne sont pas nos vassales, ou si nous n'avons pas une couleur et un nom de pays unifiés, utilisez cette résolution pour unifier le territoire §W"
  ANR_uniformize_subject:0 "Redéfinir la décentralisation"
  ANR_uniformize_subject_desc:0 "Nous libérerons toutes les puissances mondstadtiennes hors de l'Ordre des Chevaliers et du Village de l'Eau en tant que marionnettes, avec une couleur et un nom unifiés, pour accélérer notre développement."
  ANR_reunite:0 "Centraliser Mondstadt"
  ANR_reunite_desc:0 "Nous fusionnerons tous nos vassaux mondstadt et récupérerons tous les cœurs de territoire de Mondstadt."
  ANR_support_Bennett_1:0 "Bennett : organiser la production des réfugiés"
  ANR_support_Bennett_2:0 "Bennett : aider à bâtir des infrastructures"
  ANR_support_Bennett_3:0 "Bennett : distribuer des vivres à la population"
  ANR_oppose_Bennett_1:0 "Bennett : galvaniser la population"
  ANR_oppose_Bennett_2:0 "Bennett : appeler au travail bénévole"
  ANR_support_Fischl_1:0 "Fischl : inspecter les établissements savants"
  ANR_support_Fischl_2:0 "Fischl : superviser la diffusion des nouvelles technologies"
  ANR_support_Fischl_3:0 "Fischl : mettre en place une réforme administrative populaire"
  ANR_oppose_Fischl_1:0 "Fischl : préparer des campagnes politiques"
  ANR_oppose_Fischl_2:0 "Fischl : se concentrer sur la propagande extérieure"
  ANR_support_Diona_1:0 "Diona : négocier avec les groupes d'intérêts"
  ANR_support_Diona_2:0 "Diona : plan d'amélioration des infrastructures"
  ANR_support_Diona_3:0 "Diona : subventionner le commerce de Wolvendom"
  ANR_oppose_Diona_1:0 "Diona : mesures de maintien de l'ordre exceptionnelles"
  ANR_oppose_Diona_2:0 "Diona : développer l'industrie militaire par contrainte"
  ANR_support_Razor_1:0 "Razor : tirer les leçons des combats"
  ANR_support_Razor_2:0 "Razor : constituer une milice de Wolvendom"
  ANR_support_Razor_3:0 "Razor : défilé militaire de Wolvendom"
  ANR_oppose_Razor_1:0 "Razor : organiser des consultations démocratiques"
  ANR_oppose_Razor_2:0 "Razor : mobilisation pour la guerre"
  ANR_Not_Show_Bennett:0 "Masquer les résolutions de Bennett"
  ANR_Not_Show_Fischl:0 "Masquer les résolutions de Fischl"
  ANR_Not_Show_Diona:0 "Masquer les résolutions de Diona"
  ANR_Not_Show_Razor:0 "Masquer les résolutions de Razor"
  ANR_Bennett_Special_Decisions:0 "Âme d'aventure"
  ANR_Bennett_Special_Decisions_desc:0 "Bennett ne s'arrête pas. Il sent que toutes ses malheurs passés n'étaient là que pour lui permettre de surmonter ce péril. Au terme de ce voyage d'enfer, qu'est-ce qui l'attend au bout ?"
  ANR_Bennett_Decisions1:0 "Construire un système de production"
  ANR_Bennett_Decisions2:0 "Se concentrer sur l'économie"
  ANR_Bennett_Decisions3:0 "Améliorer les conditions de vie"
  ANR_Bennett_Decisions4:0 "Galvaniser le peuple"
  ANR_Bennett_Decisions5:0 "Appeler au travail bénévole"
  ANR_Fischl_Special_Decisions:0 "Valse de la nuit éternelle"
  ANR_Fischl_Special_Decisions_desc:0 "La Princesse de la Condamnation brûlera son propre cœur. À mesure que sa splendeur immortelle éclatera, un nouveau univers naîtra. La Princesse comprendra enfin que chaque instant de la vie, même le plus insignifiant, mérite d'être chéri."
  ANR_Fischl_Decisions1:0 "Guider le progrès savant"
  ANR_Fischl_Decisions2:0 "Diffuser les nouvelles technologies"
  ANR_Fischl_Decisions3:0 "Réforme administrative au service du peuple"
  ANR_Fischl_Decisions4:0 "Se concentrer sur la propagande extérieure"
  ANR_Diona_Special_Decisions:0 "Ode funeste de la fin"
  ANR_Diona_Special_Decisions_desc:0 "Si partager est insupportable, comment pourrions-nous supporter que tout nous soit retiré ?"
  ANR_Diona_Decisions1:0 "Négocier les groupes d'intérêts"
  ANR_Diona_Decisions2:0 "Améliorer les infrastructures"
  ANR_Diona_Decisions3:0 "Subventionner le commerce"
  ANR_Diona_Decisions4:0 "Mesures de maintien de l'ordre exceptionnelles"
  ANR_Diona_Decisions5:0 "Développer l'industrie militaire"
  ANR_Razor_Special_Decisions:0 "Chasseur lupin"
  ANR_Razor_Special_Decisions_desc:0 "Il s'est juré de devenir plus fort que quiconque. Quand le danger surviendra, il protégera ses Lupikal."
  ANR_Razor_Decisions1:0 "Tirer les leçons des combats"
  ANR_Razor_Decisions2:0 "Intensifier l'entraînement des troupes"
  ANR_Razor_Decisions3:0 "Organiser un défilé"
  ANR_Razor_Decisions4:0 "Mobilisation pour la guerre"
  ANR_support_Bennett_1_desc:0 "§R Il faut au moins 4 points d'influence à Bennett pour appliquer cette résolution §!\nPour nourrir et loger tous les réfugiés présents et à venir, nous confions à Bennett l'organisation de leurs travaux. Nous nous battons de nos propres mains pour une vie confortable."
  ANR_support_Bennett_2_desc:0 "§R Il faut au moins 3 points d'influence à Bennett pour appliquer cette résolution. De plus, cela augmente son influence de 1 point ! §!\nLe Œil d'Archonte de Bennett et ses expériences passées lui permettent d'aider à bâtir des canaux et des tunnels. Sa force surhumaine lui permet de porter des charges hors de portée des hommes ordinaires. En le voyant à l'œuvre, les habitants de Wolvendom lui voueront de l'affection."
  ANR_support_Bennett_3_desc:0 "§R Cela augmente l'influence de Bennett de 1 point ! §!\nAu fil des travaux collectifs, Bennett a gagné la confiance de toute la population locale. Nous l'envoyons distribuer les vivres stockées et achetées pour calmer le peuple, et sa renommée grandira davantage."
  ANR_support_Fischl_1_desc:0 "§R Il faut au moins 2 points d'influence à Fischl pour appliquer cette résolution. De plus, cela augmente son influence de 1 point ! §!\nSi Fischl n'a pas de grandes connaissances savantes, elle dispose d'un regard et d'un don exceptionnels pour détecter les axes de recherche. Avec son aide, nos études avanceront rapidement."
  ANR_support_Fischl_2_desc:0 "§R Il faut au moins 3 points d'influence à Fischl pour appliquer cette résolution. De plus, cela augmente son influence de 1 point ! §!\nFischl préconise l'utilisation des technologies nouvelles pour réduire le gaspillage et augmenter la productivité. Selon elle, le manque de main-d'œuvre nous impose d'adopter ces innovations au plus tôt. Nous la chargeons de superviser leur mise en œuvre, afin que les fruits du progrès soient admirés de tous, et que sa réputation grandisse."
  ANR_support_Fischl_3_desc:0 "§R Cela augmente l'influence de Fischl de 1 point ! §!\nFischl est à la tête de notre réforme administrative. Elle n'aime pas ce poste, mais elle met en pratique ses théories pour adapter notre gouvernement aux besoins du peuple. En tant qu'auteure de cette réforme, son prestige s'accroîtra."
  ANR_support_Diona_1_desc:0 "§R Il faut au moins 2 points d'influence à Diona pour appliquer cette résolution §!\nAncienne barmaid, Diona maîtrise l'art de communiquer et sait l'importance de bons liens avec les groupes populaires. Nous la chargeons de négocier avec syndicats, associations paysannes, entreprises collectives et milices populaires, pour coopérer et réguler ces groupes afin de préserver la paix à Wolvendom."
  ANR_support_Diona_2_desc:0 "§R Il faut au moins 3 points d'influence à Diona pour appliquer cette résolution. De plus, cela augmente son influence de 1 point ! §!\nInstallée à Wolvendom après avoir quitté le Village de l'Eau, Diona a toujours coordonné la production et le commerce. Elle sait combien les infrastructures sont vitales, comme des veines reliant tous nos secteurs de production. Nous lançons son plan de travaux publics grâce aux subventions de l'État et aux financements privés, et sa renommée augmentera."
  ANR_support_Diona_3_desc:0 "§R Cela augmente l'influence de Diona de 1 point ! §!\nNotre gouvernement ne peut pas contrôler toute la production de Wolvendom, c'est pourquoi le commerce a éclos dans nos espaces libres et fait preuve d'une vitalité surprenante. Certains projets sont plus simples à confier aux marchands. Nous mettons en place des politiques de faveur au commerce, sous la supervision de Diona, qui connaît bien les marchands, afin que les bénéfices profitent à tous."
  ANR_support_Razor_1_desc:0 "§R Les trois autres candidats doivent avoir moins de 5 points d'influence pour cette résolution §!\nDepuis la création de notre milice, nous combattons des monstres, des bêtes sauvages et les dangers de la nature. Nos batailles ont révélé des failles et de nouvelles tactiques. Razor, chef de nos troupes, tire toutes les leçons et corrige nos méthodes."
  ANR_support_Razor_2_desc:0 "§R Les trois autres candidats doivent avoir moins de 5 points d'influence pour cette résolution. De plus, l'influence des trois diminue de 1 point chacune ! §!\nLa menace extérieure approche. Il nous faut une milice pour nous défendre. Razor rassemble des armes et entraîne les hommes. Ses allées et venues seront gravées dans la mémoire de tous les habitants de Wolvendom."
  ANR_support_Razor_3_desc:0 "§R L'influence des trois diminue de 1 point chacune ! §!\nDes armes ne suffisent pas à gagner, il faut galvaniser nos cœurs. Nous organisons un grand défilé à Wolvendom pour montrer notre force et notre volonté de nous défendre, afin que chaque habitant croie en notre victoire."
  ANR_oppose_Bennett_1_desc:0 "§R Il faut au moins 3 points d'influence à Bennett pour appliquer cette résolution. De plus, son influence diminue de 1 point ! §!\nLa bonne humeur et le travail de Bennett font que le peuple écoute ses discours plus volontiers que nos propagandes habituelles. Nous l'envoyons galvaniser la population. Si cela profite à la collectivité, cela use toutefois sa popularité."
  ANR_oppose_Bennett_2_desc:0 "§R Il faut au moins 3 points d'influence à Bennett pour appliquer cette résolution. De plus, son influence diminue de 1 point ! §!\nTout le monde voit Bennett travailler sans relâche. Le peuple le voit comme un grand frère plutôt qu'un haut fonctionnaire. Nous l'appelons à mobiliser chacun pour le travail bénévole. Si cela profite à la collectivité, cela use toutefois sa renommée."
  ANR_oppose_Fischl_1_desc:0 "§R Il faut au moins 3 points d'influence à Fischl pour appliquer cette résolution. De plus, son influence diminue de 1 point ! §!\nLes réfugiés affluent sans cesse, nos administrations croulent sous les tâches. Nous demandons à Fischl de travailler des nuits supplémentaires avec tous nos fonctionnaires pour résoudre les affaires et mettre en œuvre nos politiques. Son exposition médiatique diminuera, et son influence s'affaiblira."
  ANR_oppose_Fischl_2_desc:0 "§R Il faut au moins 3 points d'influence à Fischl pour appliquer cette résolution. De plus, son influence diminue de 1 point ! §!\nNous voyons les bienfaits de la propagande extérieure. Fischl doit continuer ses efforts pour collecter des dons et des ressources venues d'ailleurs. Travailler sans relâche réduira sa popularité."
  ANR_oppose_Diona_1_desc:0 "§R Il faut au moins 3 points d'influence à Diona pour appliquer cette résolution. De plus, son influence diminue de 1 point ! §!\nDes trouble-fête et des comploteurs existent au sein de Wolvendom. Nous devons agir fermement pour préserver l'ordre. Diona mène l'opération avec une détermination comparable à sa haine du vin, même si les commerçants s'inquiètent. C'est une mesure indispensable."
  ANR_oppose_Diona_2_desc:0 "§R Il faut au moins 3 points d'influence à Diona pour appliquer cette résolution. De plus, son influence diminue de 1 point ! §!\nAncienne habitante du Village de l'Eau, Diona sait l'importance de l'armement. Nous lançons l'expansion de notre industrie militaire. Certains accusent cela de détruire le marché libre, mais sans défense, il n'y aura ni marché ni liberté."
  ANR_oppose_Razor_1_desc:0 "§R Les trois autres candidats doivent avoir moins de 5 points d'influence pour cette résolution §!\nRazor a grandi avec notre gouvernement et sait l'intérêt des échanges. Il organise des conférences de consultation pour harmoniser nos projets et atteindre nos objectifs communs."
  ANR_oppose_Razor_2_desc:0 "§R Les trois autres candidats doivent avoir moins de 3 points d'influence pour cette résolution. De plus, leur influence augmente de 1 point chacune ! §!\nNous devons nous défendre. Razor mobilise toute la population pour produire des armes et préparer l'économie à la guerre. Les habitants devront souffrir, mais c'est indispensable."
