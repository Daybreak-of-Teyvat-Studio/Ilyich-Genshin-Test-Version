andrius.112.d:0"Как уже говорилось, Вольфендом подошёл к решающей развилке. Перед нами как минимум четыре пути, и за каждым из них могут открыться новые разветвления... Прежде чем выбрать направление, давайте оглянемся на пройденный путь и посмотрим на возможные варианты.\nВо-первых, нынешнее состояние Вольфендома можно назвать естественно сложившимся «анархическим» обществом. Гражданская война в Мондштадте разрушила старые классовые перегородки. Прибывшие в Вольфендом люди (по нашей инициативе) стихийно создали организации взаимопомощи, демократическое правительство, законы, начали производство, а теперь ещё и дерутся на улицах за своих лидеров. К счастью, у нас есть законы, чтобы их усмирять... Большинство населения довольно такой «свободой», но некоторые считают, что её недостаточно, слишком много или она направлена не в ту сторону.\nЗа последние годы, когда у нас не было времени следить за этим, широко распространилась идеология «либертарного просвещённого социализма», особенно среди производителей. Сейчас это основная база поддержки Беннета. Они считают, что либертарный просвещённый социализм описывает наше прошлое и настоящее, и если мы продолжим этот путь, то будем переходить от одного успеха к другому.\nФишль, в свою очередь, развила либертарный социализм в «ситуационизм», предложив более быстрый путь к просвещённому обществу. Её сторонники ссылаются на её художественные произведения. Фишль проявила необычайные способности в строительстве и боях, и её поддерживают идеалистические администраторы, интеллигенция и многие, кто извлёк выгоду из её идей.\nГосподин Рэйзор хочет уладить новые противоречия. Это предложение выглядит неуместно, но находит отклик. К тому же, он был «представителем» Вольфендома и героем войны, поэтому у него тоже есть сторонники.\n...Вот возможные пути Вольфендома. Когда мы выберем один, обратной дороги уже не будет. Право выбора будет предоставлено народу — скоро начнутся всеобщие выборы!"
