 SUM_Neo.37.b:"以律条为先"
 SUM_Neo.38.t:"神职册封"
 SUM_Neo.38.d:"草神册封新的神职，出身雨林与沙漠的人各占半数。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。"
