 SUM_Neo.247.t:"虚空之门"
 SUM_Neo.247.d:"虚空之门在沙丘下打开，风从门后吹出来。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。门里没有回音。"
