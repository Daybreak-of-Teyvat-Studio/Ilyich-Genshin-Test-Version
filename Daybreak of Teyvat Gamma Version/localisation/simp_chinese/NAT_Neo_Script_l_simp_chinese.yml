#国策

 # 阶段1：六大部族的博弈（1-10）
 NAT_Call_Tribal_Council:"六部焚火聚议"
 NAT_Call_Tribal_Council_desc:"赤石之原，热浪蒸人，石面炙得鸟兽不敢落足。火神火令既下，六骑各持一符，分投六寨，限三日之内到源火城旧址议事。至期，六部酋首陆续而到，各带亲随，于台下依齿排定。祭坛之前，宣令者捧令读过，先说深渊压境，再问六部何以御敌。沃陆农酋以开山斧顿地，争言旧火不可轻并；回声锻主和之，铁锤一击，石屑簌簌而落。宣令者亦不强辩，只取六样本部信物置于火前：颗粒果、燃素锭、贝螺、藤绳、鹰羽、烟灰谜图。火光一照，六影并现，投于石壁，长短不齐。众酋看了半晌，各自把随身器械搁下。火愈烧愈旺，六面旗一字排开，风过处旗角搅作一处，竟分不清哪面是哪面。"

 NAT_Win_Warlords_Alliance:"缔诸酋之盟"
 NAT_Win_Warlords_Alliance_desc:"六族之会吵了三日，诸部酋首各据一案，谁也不肯先低其头。朝中察知，空言同心无益，须使各家各得一分甜头，方肯就范。乃将沃陆的粮价、回声的燃素秘方、流泉的商路，一条一条摆上石案，欲得者以兵来换。沃陆铁骑先到，回声锻炉继之点火，流泉船帆亦挂起火旗。三路人马立于源火城下，旗色各异，号令却渐合成一个。此盟尚脆，如新出窑之陶，然纳塔人到底头一回为同一件事站到一处。"

 NAT_Pacify_Volu_Bang:"沃陆之邦归心"
 NAT_Pacify_Volu_Bang_desc:"沃陆之邦的田铺在火山灰上，颗粒果串串压弯了枝。这几月为着一条火渠，农人与邻族红了眼，锄头都磨成了刀。使者踏着发烫的田埂入寨，于谷场边与农酋立誓：火渠重新划界，粮价由国中兜底。老农将信将疑，直待那渠水果真淌进自家田里，方才把刀放下，重新扶起犁来。秋至，金黄果穗晒满谷场，小儿在粮堆里打滚。纳塔的粮仓，到底还是这一片黑土。"

 NAT_Woo_Echo_Sons:"结好回声之子"
 NAT_Woo_Echo_Sons_desc:"回声之子的工坊藏在峡谷里，锤声昼夜不绝，打出的刀矛皆带火气。使者自图兰圣城背回一截古锻模，又许以烬寂海高纯燃素作薪炭。锻主接模在手，翻来覆去看了半宿，次日便起了新炉。铁水奔涌那日，全族来看，头一批掺燃素的长剑排作一行，冷定之后刃口泛出幽蓝。锻主率族宣誓效忠，自此回声炉火即为纳塔军坊。锤声愈密，峡谷里震得人两耳发麻。"

 NAT_Reconcile_Spring_Folk:"和流泉之众"
 NAT_Reconcile_Spring_Folk_desc:"流泉之众的船挂在烬寂海支流上，握着纳塔唯一海路。前些年闹了别扭，把闸门一关，内陆的香料与铁遂断了顿。使者溯流登旗舰，与航首摊开账本：内陆市面尽开，商路亦须对纳塔敞开。条款议了一夜，天将明时航首方吹响开船号角。挂火旗的商船重过水道，港口又起叫卖之声，矿石、香料、粮米一箱一箱卸下。流泉船帆，自此把纳塔与七国连作一处。"

 NAT_Bind_Hanging_Tree_Clan:"悬木人缔盟"
 NAT_Bind_Hanging_Tree_Clan_desc:"悬木人住在峭壁巨木上，藤梯一收，谁也上不来。使者攀着灼热岩壁入寨，与崖主立约：自治照旧，国中出人出料修葺山寨，悬木人替纳塔守边。崖主打量半晌，将藤索一抖，算是应了。此后藤梯沿山隘一路架去，斥候于每道关口留下暗记。山下部族走上来，抬头只见木屋凌空、藤桥如网，方知此关之固。悬木人的根，扎进岩壁，也扎进纳塔的边地。"

 NAT_Win_Feather_Guild:"结花羽会援"
 NAT_Win_Feather_Guild_desc:"花羽会鹰主立于高塔之上，肩头立一只绒翼龙，整片火山尽在眼底。使者献上回声之子所打鹰哨，又许于高地筑一座御风塔。鹰主吹哨一声，龙群自云中应声而下，遂点头应允。此后载信使的飞骑往来各族领空，尘封的空战图册重新摊开，少年人一遍一遍研习。纳塔号令插上翅膀，哪一族有异动，鹰眼先见，火令随至。分据之酋再欲藏匿，也藏不过那一片天。"

 NAT_Appease_Smoke_Mystics:"烟谜主受抚"
 NAT_Appease_Smoke_Mystics_desc:"烟谜主居迷雾之中，草药一烧，烟里便见吉凶。使者独入祭坛，不听奉承，只听巫首讲了一夜箴言，末了应下：密仪绝不外传，亦不许外人搅扰。巫首隔烟看了许久，终于点头。此后雾中多了一条看不见的线，密探无声出入各方，把风声送到案头；迷雾本身也成一道墙，外人的眼探不进来。深渊精神侵蚀最怕这烟，一熏即散。纳塔要走的第一步，都先在这雾里过了遍筛。"

 NAT_Mediate_Tribal_Border_Disputes:"诸部平边讼"
 NAT_Mediate_Tribal_Border_Disputes_desc:"六族边境之上，为一条水源、一处猎场，年年要红几回脸。使者踏遍这些是非之地，搬出古纳塔旧规：各出一名勇士，于圣火竞技场火神面前公平斗一场，胜者得地利，败者由国中补偿。头一场在两族交界摆开，四下里人山人海，刀光一照，两边火气倒泄了一半。斗毕，胜者得了硫晶矿，败者牵回突角龙，谁也不曾吃亏。烽烟一处一处散去，纳塔版图就在这一次次言和里连成整块。"

 NAT_Establish_Great_Fire_Pact:"缔大炎之盟"
 NAT_Establish_Great_Fire_Pact_desc:"源火祭坛之前，篝火烧得正旺，六族各遣一人围火而立，面目皆为火光照红。使者举起自图兰圣城寻回的源火权杖，以玛薇卡之名宣读大炎之约：共尊火神，共享地利，共御深渊，各族风俗照旧，律法却要归一。石碑立于祭坛中央，六位首领挨个按上血印。血滴熔岩，滋的一声便干了，倒像被火收了去。散落火种，这一日总算并作一堆。纳塔从此有了共守之约，再不必各烧各的火。"

 # 阶段2：火神的权柄与议会（11-20）
 NAT_Mavuika_s_Will_Declaration:"玛薇卡宣志"
 NAT_Mavuika_s_Will_Declaration_desc:"大炎之约的印尚未干，使者已登圣火台，乃代玛薇卡宣告：纳塔要绝分裂，重拾古名，齐心看向烬寂海深处那一片黑。赤红宣言顺着热风滚过火山原野，一路传到最远寨子。祭司把火焰图腾刻上每一座祭坛，古老祷文昼夜不息。有人听了热血上涌，也有人暗自攥紧了刀，然谁都明白，火神的话既已出口，再没有收回之理。自这一日起，纳塔只剩一条路，向前走。"

 NAT_Reform_Tribal_Parliament:"六部新议制"
 NAT_Reform_Tribal_Parliament_desc:"旧日之会，位次按各族拳头大小而排，谁地盘大便谁说了算，一道令常议上十日半月。使者把桌椅重新摆过：沃陆、回声、流泉、悬木、花羽、烟谜六族各占一席，火神另设一席压阵，谁的声音皆不许被埋。新规头一回用，争还是争，争完总能拿出一个众皆认可的章程。决议一道道传往边境，驿马踏过硫晶支脉，跑断了腿。此会不复为吵嚷之所，倒真成了纳塔定议之处。分散的部族心思，就在这张新桌边，慢慢拧成一股。"

 NAT_Strengthen_Fire_God_Authority:"崇火神威"
 NAT_Strengthen_Fire_God_Authority_desc:"这些年各家把火神挂在嘴上，心里却各有一本账，甚至拿自治做挡箭牌，不把圣火放在眼里。朝中出手不留情：每一座城的最高处立起圣徽，初一祭祀，谁也不许缺；违令的分裂之徒严办，虔诚者照样有赏。祭坛前的火重新旺起，玛薇卡之名在每一个寨子被念熟。火神威严如压顶之山，压住暗流，也压住觊觎。纳塔人要的，就是这一份说一不二的定力。"

 NAT_Codify_Ancient_Name_System:"编修古名"
 NAT_Codify_Ancient_Name_System_desc:"五百年前，坎瑞亚之灾起，纳塔古名冲散大半。多少英雄之名，只剩半句歌谣。朝廷请烟谜主学者与花羽会史官出门：翻岩刻，抄歌谣，问族谱，一字一字往回捞。屠龙的希巴拉克，盗火的库库尔坎，抗暴的奥奇坎，这些名字重新被人念出，许多老人便在火塘边红了眼。《纳塔古名大典》编成那日，纳塔人才知自己的魂，一向都在这些名字里。"

 NAT_Suppress_Separatist_Forces:"靖离叛之族"
 NAT_Suppress_Separatist_Forces_desc:"几个顽固老酋躲在烬寂海雾里，背人串联，要把刚立的国再撕开。烟谜主密探先得了信，报到案前，乃调悬木人山地精锐封住山口，再令回声重甲堵住谷地，一齐围上。叛众头目押到源火祭坛时还嘴硬，火一起，腿便软了。判词念毕，四下静得怕人。自此纳塔再无人敢提分裂二字。老人们都说，火能烧尽野草，也能烧尽人心里的妄念。"

 NAT_Honor_Heroes_Of_The_Calamity:"追念灾厄英雄"
 NAT_Honor_Heroes_Of_The_Calamity_desc:"五百年前那场灾厄，魔物漫山遍野涌来，多少纳塔人抄起兵刃便上，再没回来。朝廷在火山中枢修起一座英雄祭坛，把无名者的名字尽请上去，编作歌谣，交花羽鹰手唱遍六族。祭日一到，人们捧着火焰之花来献，小儿踮脚看碑上字，认不全，便听大人念。那些用命换来的太平，不能只写在纸上。歌声一年一年传下，纳塔人的胆气也就一年一年续上。"

 NAT_Redress_Ocican_Tyranny_Injustice:"昭雪奥奇坎"
 NAT_Redress_Ocican_Tyranny_Injustice_desc:"奥奇坎当政那些年，是纳塔最黑的一段日子。半人半龙之王脾气暴烈，冤死不计其数，各族之仇就此结下。朝廷命人把封尘案卷尽搬出来，一桩一桩查，凡蒙冤者一律昭雪。石碑上既刻他的暴行，也刻他晚年为封深渊而自焚的那一份担当，留与后人自己去看、去想。冤气既散，压在几代人心上的石头也算搬开。纳塔人要的公道，不在把谁踩到底，而在把这段旧账讲明白。"

 NAT_Redress_Ocican_Tyranny_Injustice-B:"奥奇坎平冤"
 NAT_Redress_Ocican_Tyranny_Injustice-B_desc:"奥奇坎旧案压了几代人的胸口。那半龙之主在希巴拉克死后性情大变，措置酷烈，多少忠良含冤而亡，部族之间的梁子越结越深。朝廷把积灰判牍重新摊开，命人逐条访查，凡屈打成招者尽数平反。熔岩碑一面写他的罪，一面写他最后舍身，功过都摆在火光里，不遮不掩。老人们围着碑看了整日，末了长长出口气。恩怨到了火里，也就化作灰了。"

 NAT_Establish_Duel_Mediation_System:"立决斗调停"
 NAT_Establish_Duel_Mediation_System_desc:"纳塔人爱决斗，可分据之世一言不合即拔刀，多少好汉死得不明不白。朝廷搬出古法，立下官断之规：惟经六族之会与火神许者方准斗，场场须有圣火竞技场火神祭司在场作证，暗算偷袭一概不许。规矩一立，私斗便少了大半。想在场子上分高下的，先得过公证人那一关；输了的人，也还能全须全尾走回去。纳塔人野性脾气被圈进规矩里，荣耀还是那个荣耀，血却少流许多。"

 NAT_Unite_Tribal_Law_Code:"诸部同律"
 NAT_Unite_Tribal_Law_Code_desc:"六部本各有一律，同一桩偷谷之事，此方罚三筐，彼方罚一牛，百姓争至阶前。朝廷乃召六部最老律学者集于图兰圣城，将条文逐条摊开比对。沃陆老学究攥颗粒果旧账本曰：「罚谷之规，改不得。」回声匠人以铁锤顿案：「锻炉之例，亦须写入。」两下争得面赤。主事者不忙下断，取火神旧律为底，将合用旧条次第嵌入，刻于数十块熔岩石板。石板分头立于各城广场，一赶路农人立于碑前，照新条数清自家之债，伸手抹净碑面浮灰。"

 NAT_Mavuika_s_Oath_To_Natlan:"玛薇卡誓纳塔"
 NAT_Mavuika_s_Oath_To_Natlan_desc:"火山之巅，源火祭坛之上，使者展开玛薇卡火令，对满山黑压压众人开口。下立老农，手攥颗粒果；旁攒锻工，袒臂而立，众皆无声。使者念一句，山风便把火令吹得猎猎作响，乃再念一句，言玛薇卡守此赤地，火不灭，古名不失。锻工丛中有人低声问：「深渊果打上门，此火靠得住？」旁侧老农将果袋往怀中一按：「火神既开口，你我只管添柴。」使者以权杖指天，赤火雨纷纷而落，落于各人肩头。满山之人相继俯身，额贴发烫之土。"

 # 阶段3：炉心与源火的秘辛（21-30）
 NAT_Explore_Turan_Sacred_City:"图兰圣城探访"
 NAT_Explore_Turan_Sacred_City_desc:"统一之后，纳塔方腾出手来，探那火山腹地的图兰圣城。此城乃源火出生之地，火龙王修库特尔曾居于此，底下埋着人龙共生的旧密与燃素的根本。朝廷择烟谜主祭司、花羽鹰手、回声匠人，凑作一队，携了最好的器械下甬道。脚下石板刻满不识之符，壁上壁画里人龙并排而立，深处一跳一跳的，是源火之脉。每进一步，纳塔的来路便清楚一分。"

 NAT_Study_Phyton_Technology:"燃素研习"
 NAT_Study_Phyton_Technology_desc:"图兰圣城石板一片一片翻出，上头记着古纳塔炼燃素的全部法门。朝廷把回声之子最好的匠人，与烟谜主的学者关在一处，昼夜译那些密语。炉塌了重砌，方错了再来，不知废了多少炉炭，总算把提纯与稳住的诀窍摸出。燃素熔炉在各工坊次第响起，火顺火渠，流进作坊与人家。源火不再是祭坛上供着的虚名，竟成了实有的力气，推着纳塔往前走。"

 NAT_Dragon_Human_Relationship_Policy:"人龙通好"
 NAT_Dragon_Human_Relationship_Policy_desc:"壁画上写得明白，古时人与龙为邻，一同守着这片火。五百年灾厄把这份交情砸碎，龙躲进烬寂海，人也学会了猜忌。朝廷力排众议，定下新规：火山谷地最肥一片让与龙族，伤龙者偿命，逢年过节送粮送料，以源火祭坛之名立盟。起初人龙碰面皆绷着脸，后来龙吼里没了火气，两边哨兵也并肩巡边。龙焰与源火交织一处，纳塔等于找回半条丢了几百年的命。"

 NAT_Source_Fire_Heart_Guard:"守源火之心"
 NAT_Source_Fire_Heart_Guard_desc:"源火之心埋在图兰最深熔核里，纳塔众火皆自此出，地脉也靠它稳住，深渊自然盯得最紧。朝廷调来悬木人卫士与花羽鹰手，围着熔核砌了一层又一层熔岩堡垒，烟谜主祭司于墙上布下燃素结界。堡垒四面皆是喷射之口，空中鹰手昼夜盘旋，地面卫士寸步不离。火旗在熔核边哗哗作响，一寸土也布下火网。谁想动纳塔心窝，先得问这片火答不答应。"

 NAT_Elemental_Furnace_Construction:"筑元素熔炉"
 NAT_Elemental_Furnace_Construction_desc:"燃素一通，造那传说中的元素熔炉便有了着落。朝廷调流泉巧匠与回声锻师，在火山中枢一干数年。炉体以龙鳞岩配燃素合金浇成，里头符文密如蛛网，能将源火之劲一点一点抽出，再送至各处。烟囱吐出赤焰那日，方圆数十里皆亮。火顺专渠，流进每一座城，每一间作坊，每一户人家。灯亮了，炉转了，纳塔自此进了源火为力之日。"

 NAT_Win_Dragon_Sages_Support:"结龙贤之援"
 NAT_Win_Dragon_Sages_Support_desc:"龙贤居烬寂海深处龙巢，活了几千年，元素、深渊、人龙旧事，无有不知。使者携自图兰寻回的龙族古物登门，把纳塔的难处与求和的诚意摊开来讲，许下世代守护龙族栖息之地。老龙听毕，沉默良久，方肯把压箱底的学问取出，又派技师随人改燃素炉。有了龙贤指路，纳塔学问一日长过一日，深渊那层神秘面纱也被揭开一角又一角。"

 NAT_Suppress_Anti_Dragon_Extremists:"缉反龙狂徒"
 NAT_Suppress_Anti_Dragon_Extremists_desc:"人龙方和，便有数个死心眼的部族不干，咬定龙是祸根，暗地里烧龙巢、拦使者，要把这桩盟约搅黄。朝廷一面令密探端了闹事之窝，一面遣人四处讲古：壁画上人龙如何并肩，和好又给纳塔添了多少力。火气烧起容易，要人心里真转过弯，还得靠事实说话。待反龙口号彻底没了声息，龙焰与源火方真正并作一处，一同守着这片红土。"

 NAT_Ancient_Dragon_Forge_Restoration:"古龙炉重燃"
 NAT_Ancient_Dragon_Forge_Restoration_desc:"得龙贤指点，朝廷寻到沉睡火山最深处的古龙锻炉。那是古人龙合力所造的神器，能借龙焰与源火打造克敌兵刃，只是千年下来，早成一堆废铁。朝廷召各族最好的匠人齐来：以回声之法修炉身，以烟谜秘仪重燃素核，再请龙族技师校准龙焰之口。炉火重吐那一瞬，赤光照得满洞如昼。第一柄掺龙鳞与燃素的长剑出炉时，纳塔之兵总算敢直面深渊。"

 NAT_Seal_Abyss_Rifts_In_Volcano:"镇火山渊隙"
 NAT_Seal_Abyss_Rifts_In_Volcano_desc:"深渊黑气顺地脉裂缝往纳塔渗，土坏了，水浑了，人也跟着说胡话。朝廷率人龙战士、祭司、工匠赶赴每一道裂隙，用龙贤所传封印术，配烟谜的净化与燃素的火力，一处一处堵。工匠打模块，祭司念祷文，战士清魔物，各司其职。最后一道缝以龙鳞熔岩封死时，火山风里那种低语头一回彻底没了。纳塔腹地总算喘过一口气，能安心攒力气。"

 NAT_Master_Secret_Source_Technology:"得源火秘艺"
 NAT_Master_Secret_Source_Technology_desc:"古龙锻炉重新点火，裂隙也堵上了，纳塔匠人终于摸到源火最深的秘艺：把深渊之暗反过来炼成火。朝廷将烟谜密仪、龙贤智慧、回声手艺与新的燃素理论揉作一处，专设一衙署攻此关。试了又试，废了无数炉，总算成了：抓来的深渊之力可化为干净源火，兵器上也能刻下克敌符文。这门手艺一旦铺开，纳塔便不再只守着躲，有了与深渊正面叫板的本钱。"

 # 阶段4：决斗法典与荣花演武（31-40）
 NAT_Establish_Duel_Code:"立决斗律"
 NAT_Establish_Duel_Code_desc:"圣火竞技场沙地之上，二勇士正斗得难分，忽自袖中抖出毒针，那一个当场翻倒。围观者轰然散开。主事者急喝停，命人拾那毒针置于石台，当众立下新规：偷袭者、藏毒者一概不许上场，点到即止，胜负由火神祭司当场判之。有少年气盛者跳出嚷曰：「打输便认，何故复限我兵器？」主事者将那毒针往其脚前一掷：「汝敢用之，是以命换面子也。」众皆默然。此后凡大决斗皆移于此场，公证祭司立于沙边，手握记胜负之骨片。"

 NAT_Build_Sacred_Duel_Arena:"神圣斗台"
 NAT_Build_Sacred_Duel_Arena_desc:"有了法典，还须一座配得上的场子。朝廷在源火城正中动工，修一座神圣决斗竞技场，六族手艺尽用其上：沃陆夯土基座、回声燃素灯、流泉水道降温、悬木藤编看台、花羽鹰徽、烟谜符文结界。场心铺龙鳞岩，四围看台一层叠一层，坐得下数万人，顶上穹顶能开能合，日光星光皆落得进来。场子落成那日，六族之人头一回为同一件事喝彩。在此分胜负，赢得体面，输得也体面。"

 NAT_Hold_Glorious_Flower_Martial_Arts:"重开荣花演武"
 NAT_Hold_Glorious_Flower_Martial_Arts_desc:"为试刀，也为把人心拢作一处，朝廷办了头一届荣花演武，一连七日。单人斗、合力斗、各路兵器专精，六族勇士尽挤进场，各显本事。演武不设生死局，只比技巧胆气，胜者由火神亲戴「荣花勇士」名号，再赏一件燃素所打兵器。场中呐喊一浪盖过一浪，少年人看得眼亮，转身便扎进练习场。纳塔的尚武劲儿，被这七日点到极处。"

 NAT_Standardize_Honor_Duel_Rules:"荣决定规"
 NAT_Standardize_Honor_Duel_Rules_desc:"荣花演武办得热闹，朝廷却看出规矩上还有缝。乃将六族决斗名师与律法学者请到一处，把条款一条一条拧紧：为面子方准斗，为私仇为财者不许；开斗先立字据，讲明为何而斗、后果如何；场上至少三名公证人盯着，手脚不干净者一律算输；输了认命，赢了也不许赶尽杀绝。规矩细了，决斗反更成体统。纳塔人爱刀，也得让刀有个分寸，荣耀方才立得住。"

 NAT_Establish_Duel_Champion_System:"决斗魁制"
 NAT_Establish_Duel_Champion_System_desc:"决斗既旺，朝廷索性立起名头：全国首席冠军、各部冠军、各路兵器冠军，一层一层排下。首席冠军三年一评，须从荣花演武里杀出，不光刀法好，还须品行端正、心里有纳塔，往后教人、主持归火圣夜大典。部中冠军，则管本部传承、带徒弟。名头一定，少年人有了奔头，练得更勤。决斗不再是争个你死我活，倒成了传荣耀、守家园的一条正路。"

 NAT_Duel_Training_Camp_System:"决斗营制"
 NAT_Duel_Training_Camp_System_desc:"要人人拿得起刀，朝廷便在全国铺开训练营：六部各一座，由本部冠军当教头，教格斗、教兵器、教配合，也教规矩。成年纳塔人皆可免费来学，男女不论，学得好的再挑进国中大营深造。营中不单练武，也讲纳塔旧事、古名与还魂诗，小儿头一回知自己从何处来。待这些人遍布六族，深渊哪怕半夜摸进来，随便一个村口，都能站出一队持燃素兵刃的人。"

 NAT_Duel_Training_Camp_System-B:"决斗营制二"
 NAT_Duel_Training_Camp_System-B_desc:"朝廷把练兵这件事铺到每一个寨子。六部各立一座大营，冠军做教头，手上教的是真功夫，嘴里讲的是老规矩。来者皆收，不问出身，练出师便回原籍，把本事传与更多人。山中娃儿过去只见过柴刀，如今握上制式长矛，眼神都不一样。夜校还教认字、唱古歌，武与文一同长。纳塔这块地，从此藏龙卧虎，深渊来了才知，随便哪个山坡后头都蹲着好手。"

 NAT_Hold_Fire_Return_Sacred_Night_Pilgrimage:"归火圣夜重巡"
 NAT_Hold_Fire_Return_Sacred_Night_Pilgrimage_desc:"归火圣夜那晚，传说火神之力最盛，战死之魂会顺火光回家。朝廷把旧年巡礼重新办起，又添新意：人人提燃素灯笼，自四面八方往源火祭坛走，一路须过数关，试胆、试智、试刀。到得祭坛，祭司赐福，冠军上台献艺，火把连作一条条龙。老人说，那一夜能见故人影子在火里冲你笑。灯笼之光把山谷照得透亮，阳世人与阴间魂，就这么在火里碰了一面。"

 NAT_Duel_Resolve_Tribal_Conflicts:"决斗息争"
 NAT_Duel_Resolve_Tribal_Conflicts_desc:"国已统一，部族之间为一条界、一处矿，仍要红脸。朝廷便把决斗也用在这上头：凡非大故之争，各遣一人上圣火竞技场斗一场，胜负即结果，两边皆得认。这么办，面子保住，血也少流，正合纳塔人认武不认软的脾气。两造当场以真刀相搏，看台上自己人给自己人喊，打完照样坐下来喝火山酒。你敬我一尺，我让你一丈，六族交情就在这一次次堂堂正正的较量里越拧越紧。"

 NAT_Flame_Blessing_For_Duel_Warriors:"火祝赐勇士"
 NAT_Flame_Blessing_For_Duel_Warriors_desc:"源火祭坛前列一行勇士，首席火神祭司赤足登坛，手托一盏自源火之心取来之火。当先上前者，使双刃之少年，铠甲上犹留上一场豁口。祭司念起古祷文，以火按于其刀刃，刀身渐透红光。少年握了握刀柄，低声曰：「此一场，替吾娘争也。」祭司不接话，只将火复按其胸甲，甲上豁口处暖了一片。后数人依次上前，或执回声锻之开山斧，或执花羽之长矛，皆将兵器递得稳稳。末了那少年退下坛，行至场边蹲下，以指腹将刀刃之灰一点一点抹去。"

 NAT_Ultimate_Duel_Of_Heroes:"群英终决"
 NAT_Ultimate_Duel_Of_Heroes_desc:"纳塔愈强，深渊之影愈近。朝廷张罗一场终极决斗，把六族顶尖勇士尽请入竞技场，数万人注视，火神祭司见证，一场一场打。各人把看家本事、部族绝学、源火之力尽数使出，一招一式皆是力与美之极。最后立着的那一个，得了「纳塔第一勇士」名号，成了抗渊先锋。最后一剑落下，满场欢呼如雷炸开，人人心里只剩一个念头：有此勇士，深渊打得赢。"

 # 阶段5：部族的整合与裂痕（41-50）
 NAT_Promote_Natlan_National_Identity:"扬纳塔同心"
 NAT_Promote_Natlan_National_Identity_desc:"国已合一，不少人心里仍先认本部、再认纳塔。朝廷要把这口气拧过来：学堂开纳塔史与文化课，小儿自幼便知六族如何走到一处；满城办文化节，各家好东西尽摆出来，节却只有一个，叫纳塔；归火圣夜、荣花演武，皆办成举国同乐的大日子。日子久了，「我是纳塔人」这句话便长进各人骨头里。六族之火，从此烧的是同一座炉。"

 NAT_Integrate_Tribal_Resource_System:"诸族资储统合"
 NAT_Integrate_Tribal_Resource_System_desc:"从前六族各守一摊：沃陆有粮，回声有矿，流泉有鱼，悬木有木，花羽有畜，烟谜有药。东西堆在自家仓里发霉，别处却急得跳脚。朝廷设一总管物力之衙署，遣人把全国山水矿藏挨个踏勘一遍，再按各处所需分派：沃陆谷子供全民，回声矿产先紧军坊，流泉水产接济沿海与内陆。账算得细，路也修得通，货栈门槛都被车辙磨深。部族之间那道看不见的墙，就这么一点一点拆了。纳塔仓廪头一回连成一片，家底既厚，腰杆自然硬。"

 NAT_Unify_Tribal_Military_Forces:"诸部同兵"
 NAT_Unify_Tribal_Military_Forces_desc:"从前六族各有其兵，旗号不一，兵刃不一，打法亦不一，凑到一处如一盘散沙，遇着深渊只能各自逃命。朝廷把这些兵重新编过：沃陆庄稼汉做步卒，回声匠人进军坊之营，流泉水手上战船，悬木好手守山隘，花羽鹰手飞上天，烟谜祭司掌符箓。部伍划一，兵器划一，操练号令亦皆划一，一本阵法册发到每个什长手里。合操那日，六个方阵走得整整齐齐，如一整块烧红的铁。纳塔之兵，从此不再姓沃陆、姓回声，只姓纳塔。"

 NAT_Autonomy_Policy_For_Loyal_Tribes:"忠部自治诏"
 NAT_Autonomy_Policy_For_Loyal_Tribes_desc:"统一那几年，有几族自始至终没二心，平叛、抗渊皆冲在前头。朝廷要酬其忠，又不愿逼人改了祖辈规矩，便立下自治章程：地方之事准其自管，旧俗祭礼照旧行，分物力时多与一分，族中能人也优先进朝办事。老酋捧着那卷章程看了又看，末了按上手印。各家之火还是各家点，颗粒果照旧入自家仓，可都朝着图兰圣城那堆火添柴。纳塔这一国，既容得下六样风俗，又拧得出一股心气，靠的就是这份分寸。"

 NAT_Establish_Unified_Taxation_System:"定一统赋法"
 NAT_Establish_Unified_Taxation_System_desc:"从前六族收税各收各的，沃陆缴颗粒果，回声缴铁锭，有重得让人喘不过气，有轻得国库见底，账本摊开，没有两本能对上。朝廷下令立一套通用之税：按各处富庶定下等次，税种数目写得清清楚楚，专设税吏按章征收，一文钱也要入公家账。收上来的钱粮，修路、练兵、办学、敬火神，样样有去处。百姓头一回明白自家钱粮花在何处，抱怨少了，官府的话也灵了。账目一清，纳塔这台大车方才转得稳当。"

 NAT_Suppress_Rebellious_Tribal_Elders:"靖叛部长老"
 NAT_Suppress_Rebellious_Tribal_Elders_desc:"有几个老酋恋着旧日权柄，明里归顺，暗地勾连外人，哄着族中人再举叛旗。朝廷靠烟谜主密探摸清巢穴，精锐一出便把首恶拿住。跟着起哄的寻常族人，并不一概问罪，只叫他们到火塘边听上几夜道理，明白分裂只会招来深渊；死不改口的那几个，方按火律严办。判词念毕，纳塔再无人敢拿统一二字做赌。老人说，刀能砍断乱旗，道理才能收住乱心，两样都少不得。"

 NAT_Suppress_Rebellious_Tribal_Elders-B:"再靖叛酋"
 NAT_Suppress_Rebellious_Tribal_Elders-B_desc:"几个失势的老头子不甘心，躲在暗处串通外敌，拿旧日情分蛊惑族人，要把纳塔再撕成六块。烟谜主的眼睛早盯上了他们，兵马悄围营寨，首恶一个也不曾走脱。对那些被裹挟的族人，朝廷并不赶尽杀绝，只叫他们亲眼看看深渊探子如何拿他们做棋子；为首者，则交圣火前律条定罪。一场风波平息，纳塔舆图上再没有第二种旗号。劈开一根柴容易，要六家之火烧成一堆，靠的可不只是刀。"

 NAT_Unify_Cultural_And_Educational_System:"同文同教"
 NAT_Unify_Cultural_And_Educational_System_desc:"沃陆有谷歌，回声有锤调，花羽有羽谣，六族各有规矩，本是好事，可小儿只认自家山，不知纳塔为何物，学问也深浅不齐。朝廷召学者编出一部通用课本：纳塔来路、六族风俗、火神律令、荣花演武规矩，尽写进去，全国一体教之。又设护文衙门，各家老歌旧俗照样留着，只是都要汇进纳塔这一本大书。孩童同念一段书，同唱一支歌，长大提起彼此，便不再说「那族人」，而说「我们纳塔人」。"

 NAT_Establish_Natlan_Unified_Law:"定纳塔一统律"
 NAT_Establish_Natlan_Unified_Law_desc:"先前并过一次律法，可纳塔一日一日变，新事新愁层出不穷，旧条文渐渐不够用。朝廷把全国律学大家、六族长老与官员尽请到图兰圣城，就着旧典一条一条增补，民讼、刑名、兵律、市易，样样定出规矩，赏罚写得明白，又立一条：火律之前，六族一律平等。新律颁行那日，抄本贴满各城之墙。有争端者不必再各讲各家有理，只需翻到哪一条，照着办便是。纳塔从此不靠谁的拳头大说话，而靠写下来的字。"

 NAT_Integrate_Tribal_Guard_Forces:"诸族护卫归一"
 NAT_Integrate_Tribal_Guard_Forces_desc:"统一之后，六族仍留自家护卫，看家护院是好手，可兵刃旧、操练少、号令各听各的，真遇大乱便乱了阵脚。朝廷把这些人编作国中巡警与地方守备：巡警管日常纲纪、捉拿歹人，守备帮着正规军守边、救险、弹压。甲械发一样的，操练按一样的册子，号令亦归一处。夜里村口巡逻的火把，从此不再写着某族某寨，只插纳塔火纹徽记。地方既安，朝廷之令头一回真正走到了每一条山沟。"

 NAT_All_Tribes_Unification_Declaration:"诸部归一诏"
 NAT_All_Tribes_Unification_Declaration_desc:"多年经营，纳塔在朝堂、钱粮、兵马、文教、律法上都并成一体。朝廷择源火祭坛办一场大典，六族首领、长老、勇士皆到，提瓦特六国也遣使来看。宣言一句一句念下，从分裂旧苦讲到统一难处，再讲往后要守的土地、要抗的深渊。末一字落下，祭坛之火腾地冲天，六面族旗与纳塔国旗一道升起，欢呼声把火山都震得发颤。那一刻，六簇火彻底并作一堆，纳塔二字方算真正立住。"

 # 阶段6：燃素军工与龙骸锻造（51-60）
 NAT_Establish_Phyton_Weapon_Research:"设燃素武器院"
 NAT_Establish_Phyton_Weapon_Research_desc:"统一之后，深渊魔物反倒更凶，旧刀旧炮砍上去如挠痒。朝廷把全国能人聚作一处：回声锻师，烟谜符师，龙贤学者，纳塔匠人，专设一座燃素兵器坊。众人把燃素脾气摸透，造出喷火之器，震天之燃素雷，刻着克渊符文的长剑，还有打得远的燃素炮。头一批新兵刃抬出试手，魔物黑壳一挨即裂。纳塔之兵头一回觉出手中兵刃靠得住。有了这些利器，守家才站得住，反攻方有指望。"

 NAT_Flame_Enchantment_Forge_Expansion:"火焰附魔锻坊拓"
 NAT_Flame_Enchantment_Forge_Expansion_desc:"新兵刃造得出，还须造得多。朝廷令将火焰附魔的锻坊处处扩建，添炉、进料、招徒，把锻造排作一道接一道的工序。龙骸之能也用上了：龙鳞龙骨掺入燃素合金，打出的甲更坚，刀更利。炉火自天亮烧到天黑，又自天黑烧到天亮，一车一车兵刃拉去营中，连盟友也分得几车。锻坊锤声成了纳塔最响的动静，听着它，人心里便踏实：深渊再来，有的是器械应它。"

 NAT_Dragon_Bone_Armor_Development:"龙骨铸甲"
 NAT_Dragon_Bone_Armor_Development_desc:"魔物一爪过来，寻常甲胄如纸糊一般。朝廷启动龙骨装甲，把龙族送来的遗骨配上燃素与符文，一遍一遍试比例、改火候，总算炼出既能挡爪牙、又能抗黑暗侵蚀的重甲。头一批发下，士兵穿着冲阵，魔物尖牙崩得七零八落，人却囫囵。甲做得结实，手脚却不笨，跑跳挥刀皆不耽误。穿这身龙骨甲，纳塔之兵往前站得直了，只因晓得这副甲背后，是龙族与纳塔一同立下的约。"

 NAT_Expansion_Of_Volcano_Industrial_Zone:"火山工区广拓"
 NAT_Expansion_Of_Volcano_Industrial_Zone_desc:"火山地热与燃素，是纳塔炉冶的命脉。统一后要的东西多了，原先那点厂区挤得转不开身。朝廷把周边山谷平原一并划入，新盖民坊、军坊、学堂、货栈，铺开一张大网。厂中燃素供能，火用得干净，烟也少；路修得四通八达，料进得来，货出得去。扩建既毕的火山炉冶之区，成了提瓦特数得上的大工场，自家民生与军坊俱养得活，余下的还能卖与他国换摩拉。火山之火，此番真烧成了纳塔的财源。"

 NAT_Mobile_Warfare_Tactics_Innovation:"疾战新法"
 NAT_Mobile_Warfare_Tactics_Innovation_desc:"兵刃既利，打法也得跟着换。朝廷请老将、龙贤与知兵之人凑到一处，照着纳塔山林海岸，琢磨出一套机动打法：燃素驱动的车与飞器跑得快、绕得开，专挑敌人软肋插去；山林之中则分小股游走，打了便走，走了又来。战法一推行，兵马不再死守一条线，哪里告急便卷向哪里。深渊魔物还在列阵，纳塔人马已绕到其后。打仗这件事，纳塔从此讲究一个快字。"

 NAT_Flame_Artillery_Development:"研铸火焰炮"
 NAT_Flame_Artillery_Development_desc:"大战场上，火炮是定胜负之物。朝廷令匠人把燃素与旧炮凑作一处，造出纳塔自己的火焰炮：高纯燃素作弹，能打灼烧之弹、炸开之弹、穿甲之弹，打得远、打得准、也打得狠。炮车底下装了快挪的架子，放完一炮便换个地方，敌人想找也找不着。头一批炮推至阵前，轰开魔物之阵，火光把半边天映红。守边、攻城、大会战，皆少不得它开口。深渊成群压来时，这门炮便是纳塔的答话。"

 NAT_Flame_Artillery_Development-B:"火焰火炮再造"
 NAT_Flame_Artillery_Development-B_desc:"要把深渊挡在门外，光靠刀盾不成，须有压得住场的火炮。朝廷把燃素之术灌进炮膛，造出能喷火、能炸、能破甲的火焰炮，射程既远，落点又准，一炮下去魔物成片倒下。炮身装在灵动底盘上，放完便走，敌人摸不着它的影。炮队拉到边关试炮那日，山头都被火光染红，老炮手眯眼校准，口中只说一个字：准。此后纳塔关防之后，总蹲着这几门炮，如几双火红的眼，盯着深渊来的方向。"

 NAT_Naval_Forge_Construction:"舟师铸坊"
 NAT_Naval_Forge_Construction_desc:"纳塔海岸绵长，海路一断，买卖生计俱受其累。朝廷乃于流泉大港起船坊，专造战船：有疾行之快舟，有火力之巨舰，有能载飞器之大舶，亦有专克水下魔物之怪船。船骨用龙骸，机括烧燃素，风浪虽急，亦自稳当。船坞中昼夜锤声不绝，一船才下水，一船又上架，帆上尽绣纳塔火纹。水师既成，沿海商船方敢远出，渔人亦敢把网撒到更远的水里。烬寂海的黑，至此头一回收回海中。"

 NAT_Aviation_Industry_Expansion:"拓造飞航"
 NAT_Aviation_Industry_Expansion_desc:"天上没有自家的飞器，地面便天天挨炸。朝廷在花羽聚居之地建起飞器制造之大工场，燃素为心，轻料为骨，造出侦查、格斗、轰炸、运货各样飞器。飞手于教场上练之不已，起飞、盘旋、俯冲，一套比一套利落。待飞骑成军那日，天上是纳塔之翼，地上是纳塔之兵，海上纳塔之船，三路一齐铺开。深渊魔物再想从头顶摸下，先得问天上那群鹰答不答应。纳塔天空，从此有了主。"

 NAT_Elite_Flame_Warrior_Training:"精锐焰兵"
 NAT_Elite_Flame_Warrior_Training_desc:"有些险处，寻常兵去不得，须有一支拿命换命的尖刀。朝廷自全军挑出最好的苗子，送进尖刀营打磨：练体力、练刀法、练配合，还要学会与深渊黑气周旋，把燃素直接使在身上。教头是老将、冠军与龙贤，一个个都拿出压箱底的本事。数年磨下来，这些人一身是胆，一身也是伤，握着火器能在魔群里进出自如。最凶的仗，总是他们先上。纳塔人管他们叫精锐火焰战士，见了他们，连深渊的吼声也要低几分。"

 NAT_Military_Industry_Modernization:"铸兵新制"
 NAT_Military_Industry_Modernization_desc:"纳塔军坊已有几分模样，可要跟深渊拼命，还嫌不够利索。朝廷决意把军坊通盘翻新：请提瓦特最好的匠法来，让造兵如流水一般顺；自研样到出厂再到保养，一条龙接上；又办起学堂，教出一批懂行的人；龙族的老手艺也请进来一同使。军坊一改新法，刀枪出炉快了，样式也精了，阵前要何物便赶何物。纳塔手里，头一回攥住能打长久仗的本钱。这场仗要打多久，工坊的炉火便烧多久。"

 # 阶段7：深渊的低语与烬寂海的阴影（61-70）
 NAT_Investigate_Abyss_Infiltration:"缉深渊渗透"
 NAT_Investigate_Abyss_Infiltration_desc:"纳塔愈强，烬寂海那边的黑心思愈多，竟悄悄钻进城里寨里。有人被低语迷了心窍，成了魔物傀儡，地脉里也冒出古怪波动。朝廷下令全国彻查：烟谜主祭司贴着地脉听动静，密探挨家挨户查可疑之人，龙贤帮着辨那些黑气来路。查的人钻进迷雾沼泽、废矿洞、老遗迹，一件一件挖出深渊的鬼门道：拿祭祀引，拿低语哄，拿黑气染。路数摸清了，防起来才有准头。纳塔要守的不只是城墙，还有自家人的心。"

 NAT_Strengthen_Night_God_Realm_Protection:"夜国固防"
 NAT_Strengthen_Night_God_Realm_Protection_desc:"夜神之国是纳塔人魂灵去处，也是挡深渊的一道精神墙，还魂诗的奇迹便自那里来。近时黑气要把这墙泡软，地脉与魂灵皆受了惊，此处一失守，纳塔便丢了根。朝廷带祭司与龙贤赶到，以源火加固地脉屏障，用烟谜净仪驱散黑气，在天钉四周摆下燃素符阵，又挑精锐守门，闲人一概不许进。魂灵得以安睡，地脉重归干净。夜神之国那点微光稳住，纳塔人才算有了最里头一道靠山。"

 NAT_Clean_Up_Abyss_Cult_Forces:"清除渊邪"
 NAT_Clean_Up_Abyss_Cult_Forces_desc:"查来查去，深渊在纳塔的暗线，多半是一个个邪教之窝。他们拿「得黑暗之力」做饵，专挑心志薄弱之人下手，办邪祭、唤魔物，把黑瘴引到田垄边，闹得四邻不安。朝廷下令举国搜讨，兵、警、部族护卫一齐动手，照着密探的线一个一个拔钉子。武力之外也不忘人心：首领按律严办，被哄骗的则拉回来讲道理，叫他们看清那所谓神通有多害人。最后一个邪坛捣毁时，深渊在纳塔的嘴也算堵上。百姓从此听见低语，先想起的不是怕，是警惕。"

 NAT_The_Shadow_Of_The_Embersea:"烬寂海潜影"
 NAT_The_Shadow_Of_The_Embersea_desc:"烬寂海是纳塔西边门户，也是深渊扎窝之处。五百年前那场灾厄过后，海里黑气一年浓过一年，魔物时不时扑上村落商船。朝廷沿海岸修起坚牢炮台，架上火焰炮与喷火器，组了海防水师与巡岸之队，起初犹遣人下浅海画图，摸清魔物之窝与黑气之源。要塞立起之后，海岸线上火把连成一片，夜里也亮堂。西边阴影还在，可它再想漫进纳塔，先得问这道火墙。守住了海，纳塔方能腾出手去算总账。"

 NAT_Hold_War_Council_Against_Abyss:"抗渊战议"
 NAT_Hold_War_Council_Against_Abyss_desc:"光守是守不出太平的，须把怎么打定下来。朝廷把六族首领、将领、龙贤、祭司、学者尽请到源火城，开一场最高规格的战会。众人把深渊底细、进犯路数、所欲何为，一条一条摆开，末了定下四句：守要稳，清要准，打要主动，盟友要拉齐。哪族出兵、哪处屯粮、哪门学问先攻，皆在图上标得清清楚楚，又议定联合龙族与提瓦特各国的盟约框架。会既散，纳塔上下只剩一个心思：把深渊打回去。一场卫国大仗，就此拉开弦。"

 NAT_Unite_Dragon_Alliance_Against_Abyss:"合龙抗渊盟"
 NAT_Unite_Dragon_Alliance_Against_Abyss_desc:"龙族与纳塔比邻而居，深渊要吞的，也有它们的窝。战会方散，使者便亲上龙巢，与龙首缔盟：纳塔给龙族安居之地与粮草，龙族派精锐入伙，把元素之力与深渊老底尽拿出来共享。盟既立，龙战士与人兵混着操练，龙匠帮着改兵器，龙贤与纳塔学者同攻抗渊之法。龙焰与源火一处烧，人龙并肩往前冲，纳塔的抗渊之力一下翻了几番。提瓦特再没有第二处，能把人与龙拧成这一股绳。"

 NAT_Unite_Dragon_Alliance_Against_Abyss-B:"龙盟再抗渊"
 NAT_Unite_Dragon_Alliance_Against_Abyss-B_desc:"唇亡齿寒，深渊扩张，龙族也难独善。使者亲赴龙巢，把盟约一条一条说定：纳塔护龙族栖身之地、按时送物资，龙族则抽调好手编入纳塔军中，龙息与火械一道使，深渊秘闻也不再藏。自此演武场里人龙混编，炉边龙匠指点改良，书房里龙贤与学者对坐推演。两下力气并到一处，纳塔抗渊阵势为之一新。人龙旧约，原是刻在壁画上的，如今又活生生立于对渊之阵前。"

 NAT_Repair_Sealing_Needle_Of_Shadow:"缝影针重铸"
 NAT_Repair_Sealing_Needle_Of_Shadow_desc:"缝影针是纳塔钉住深渊的老法宝，一根一根立在全国，针身刻着克渊之符，把污染的地脉按住，把裂隙堵死。千年下来，不少针钝了，裂了，封印之劲也散了。朝廷纠合匠人、祭司与龙贤为队，携高纯燃素与符料走遍各处：断的接上，钝的重新刻符，再灌进源火与龙焰。一针复活一寸地，地脉随之稳了下来。待最后一根缝影针立稳，纳塔脚底下再没有黑气可钻的空子。这些沉默的针，替纳塔把门前的缝一根一根缝死。"

 NAT_Develop_Abyss_Resistance_Technology:"研御渊术"
 NAT_Develop_Abyss_Resistance_Technology_desc:"深渊黑气最阴毒，伤肉身，还污心神与器械，纳塔之兵为此吃了大亏。朝廷把科研力气拧作一处，专攻克渊之法：自燃素与龙鳞里提出精华，配成解毒之药；于刀甲上刻更硬的克渊符，挡住黑气侵蚀；又教士兵静心、祭祀、对着假想魔物反复对练，把听见低语不乱心的本事练出来。药、符、心三样一齐上，兵在阵前站得稳了，伤亡也一日一日少下去。纳塔人终于不必一听见深渊之名，就先怯了三分。"

 NAT_Heroes_Memorial_For_Calamity:"立灾厄英雄碑"
 NAT_Heroes_Memorial_For_Calamity_desc:"抗渊这些年，多少勇士把性命撂在阵前。朝廷在源火城正中修起一座英雄碑：黑曜石作座，一个个名字与事迹刻在上头，碑顶立着手持燃素剑、仰头望天的英雄像，像中灌着源火，夜夜透出温光。每年灾厄纪念日，人们捧着花与祭品来，小儿听大人念碑上名字，念着念着便把那些故事记进心里。这座碑不单给死者，也给活人：看见它，便知脚下太平是谁换来，往后该往哪里站。"

 NAT_Mavuika_s_Abyss_Burning_Oath:"玛薇卡焚渊"
 NAT_Mavuika_s_Abyss_Burning_Oath_desc:"源火祭坛火柱窜得比旗杆犹高，使者立于火前，身后乃纳塔子民与龙族战士。其一字一句念那焚渊之誓：以源火之名，以古名之荣，以英雄之魂，焚尽深渊，寸土不退。念至「绝不退缩」，嗓音已哑。台下一龙族战士以爪拍胸甲，用龙语随吼一声，众乃齐声高呼，声浪将火柱压矮一截复弹起。一年轻兵士攥紧燃素兵刃，问身旁老卒：「当真战至最后一兵一卒？」老卒将火烤热之手按于其肩，只吐一字：「上。」火柱冲天，将半边天烧红，众人手中兵器皆映同一片红。"

 # 阶段8：万火归一与纳塔的新生（71-80）
 NAT_The_Great_Unity_Of_All_Fires:"万火同炉"
 NAT_The_Great_Unity_Of_All_Fires_desc:"焚渊之誓一立，纳塔才算真到了万火归一。六族没了彼此隔阂，人人皆以纳塔人自居；源火与龙焰搅作一处，成了最强的抗渊之力；老传统与新手艺互相成全，把纳塔文明托到新高度。朝廷在源火城办起大典，六簇火即六族，最后一齐汇进中央圣火，火头冲得老高。万火归一之光把赤色大地照亮那一刻，纳塔真正拧成一个整体。往后再有深渊压来，六族只会同时拔刀，不会再各顾各的火塘。"

 NAT_Establish_Diplomatic_Relations_With_Liyue:"璃月通好"
 NAT_Establish_Diplomatic_Relations_With_Liyue_desc:"纳塔起来了，又铁了心抗渊，提瓦特各国都开始正视这片火地。璃月是商贸大港，见多识广，家底也厚，与它交好两皆有利。朝廷遣使团往璃月港，带上燃素工艺品、火山宝石与龙鳞特产，把结好的诚意摆出来。璃月的岩王帝君与七星认了纳塔的实力，也认了这份诚意，双方签字建交，通商、技艺、兵事皆议合作。璃月给纳塔通商之路与救急之资，纳塔则把抗渊经验与燃素之术拿去共享。同盟之梁，一头架在璃月，一头扎在纳塔。"

 NAT_Teyvat_Flame_Diplomacy_Initiative:"提瓦特火盟"
 NAT_Teyvat_Flame_Diplomacy_Initiative_desc:"与璃月建交既顺，朝廷便要趁势把提瓦特各国都请到一处。乃首倡火焰通好之举，邀蒙德、稻妻、须弥、枫丹、至冬各遣人来纳塔赴会。会上把深渊之患讲透：此祸不止加于纳塔，乃是全提瓦特之祸。又把纳塔抗渊经验、燃素兵器与缝影针之法一一摊开，末了提出立一抗渊同盟。说辞诚恳，行事也实在。各国渐次点头，通商、技艺、兵事，一项一项立约画押，又约常通消息，一同演武。通好之举既成，纳塔遂为同盟之首，其声亦传遍提瓦特。"

 NAT_Alliance_With_Mondstadt_And_Inazuma:"蒙德稻妻盟"
 NAT_Alliance_With_Mondstadt_And_Inazuma_desc:"峰会上，蒙德之风与稻妻之雷，同纳塔之火正相配：蒙德有骑军与飞骑，稻妻有锻术与水师。朝廷与西风骑士团团长、稻妻幕府将军签下三国盟约：战时互相救应，共用营地粮草；平时一同操练，交流手艺，合造抗渊兵器。盟约既立，蒙德骑兵与纳塔步卒并肩冲，稻妻战舰与流泉之舟一同巡。三股力拧作一处，自天上罩到海里。三国之心齐了，提瓦特抗渊也就有了主心骨。"

 NAT_Sumeru_Academic_And_Industrial_Cooperation:"须弥学工盟"
 NAT_Sumeru_Academic_And_Industrial_Cooperation_desc:"须弥是提瓦特做学问的圣地，元素、地脉、生灵之学都在那儿，正合纳塔之用。朝廷与教令院签下合作之书：两边合建学堂，一同钻研深渊之底、地脉之谜与燃素之深用；学者与留学生互相往还，手艺见识来回换；又合办工场，把须弥纸上的道理，变成纳塔炉里的出产。此一合作，纳塔学问与炉冶如插翅，进度一日千里，抗渊之法也一件一件冒出来。火之国有股子蛮劲，如今又添须弥之智，恰好互补。"

 NAT_Eternal_Flame_Legion_Establishment:"铸永炎之师"
 NAT_Eternal_Flame_Legion_Establishment_desc:"要打大仗，又要对同盟有个交代，朝廷决意建一支跨国抗渊劲旅，名为永恒火焰军团。此军以纳塔精锐为核，也收璃月、蒙德、稻妻、须弥来的好手。人人配最利的燃素兵刃、龙骨重甲与克渊之具，由纳塔之将与各国行家同领其众。军团之责，是往提瓦特各处打深渊，救受侵之国，守住要紧地脉与遗迹。誓师那日，源火城上火旗如林。军团誓毕，便分头开拔。从此提瓦特何处有深渊作乱，何处便有一柄燃着的利剑赶到。"

 NAT_Natlan_Industrial_Renaissance:"纳塔兴工"
 NAT_Natlan_Industrial_Renaissance_desc:"赖各国往来与自家苦干，纳塔迎来炉冶之大兴。以火山炉冶之区为腹心，民坊、军坊、燃素、物材，次第立起：民坊出日用农具与建材，百姓生计渐有起色；军坊赶制刀炮守具，阵前不忧无械；燃素自给之外，尚可外销；物材坊试出新合金、新料子，手艺一节高过一节。烟囱连成一片，锤声连成一片雷。纳塔不再是守着火山过日子的部族之地，它成了提瓦特数得上的炉冶之国，钱粮家底，都攒得厚实。"

 NAT_Fontaine_And_Snezhnaya_Diplomatic_Outreach:"枫丹至冬通使"
 NAT_Fontaine_And_Snezhnaya_Diplomatic_Outreach_desc:"枫丹机械精、律法明，至冬兵强、冰术高，与这两国交好，同盟之势方算圆满。朝廷分遣使团：往枫丹谈机械与律法往来，把人家的精密手艺学来，也把回声之子的锻炉规矩理得更齐；往至冬结互信，换抗渊消息与打法，又学那冰元素之用，与纳塔的火配作一对。两处通好既成，各国之力便都补到一处：枫丹补精巧，至冬补寒锐，纳塔补火烈。提瓦特抗渊，从此织成一张四面的网。"

 NAT_Mavuika_s_Eternal_Flame_Blessing:"玛薇卡永焰"
 NAT_Mavuika_s_Eternal_Flame_Blessing_desc:"源火城是日静甚，工坊之锤皆停。祭司捧新炼燃素锭，层层码于源火祭坛四角，使者立中央，待那火起。金焰果自坛心涌出，徐徐漫过整城，远工坊烟囱亦镀一层黄。一老工匠踮脚望火，对身侧学徒道：「此火与往日不同，稳。」学徒伸手去接一片飘落火星，火星落掌心不烫，唯暖。使者奉玛薇卡之意志传下话去，声借火传遍街巷。老工匠将手中燃素锭往炉内一送，炉口即刻腾起同样金焰。"

 NAT_Glory_Of_Natlan_The_Land_Of_Burning_Fires:"纳塔燃土荣光"
 NAT_Glory_Of_Natlan_The_Land_Of_Burning_Fires_desc:"争了几百年，斗了几百年，纳塔总算盼来自己的荣耀。分裂六族并作一团，深渊之压退去，纳塔成了提瓦特强盛同心之国。抗渊同盟之中，它为主心骨；各国席上，它开口有人听；文明长卷里，老传统与新工艺也写得相得益彰。源火之光遍照赤色大地，古名之荣重又抬起，英雄故事代代相传，人龙共处之佳话也传到提瓦特每一处。这片燃烧之土，如今是太平之垒，是兴旺之范，是每个纳塔人挺胸的缘由。这份荣耀，当与源火一同，永远烧下去。"
 # 纳塔国家理念 Localisation（30个）
 # 纳塔Ideas本地化文本
 NAT_Mavuika_Eternal_Authority:"火神执永柄"
 NAT_Mavuika_Eternal_Authority_desc:"这是不灭之火玛薇卡执掌的至高权柄，自初代火神希巴拉克传下，在圣火长明的盟地里昭示万代。火神以焚尽黑暗的烈焰护着部族，以不灭之志把人心拢作一处，六族俯首，政令归心。有这份权柄压阵，纳塔战士战心如圣火一般旺，威权与战魂熔作一处，成了抗渊最硬的精神脊梁。火神之志，只要这火不灭，便永远不会弯。"

 NAT_Volu_Bang_Fertility_Oath:"沃陆之邦丰饶誓"
 NAT_Volu_Bang_Fertility_Oath_desc:"沃陆之邦田垄间，金穗压弯了腰，一头突角龙在田埂上徐徐啃草，尾一扫，惊起数只蚂蚱。老农蹲田边，抓起一把土捻了捻，复添新火山灰。旁侧少年抱一筐颗粒果问：「说定留三分与族里，此秤如何定？」老农将果筐往秤上一搁，秤杆压得平平：「谷如何长，秤便如何定，祖上皆是这般量的。」突角龙低头蹭了蹭老农之肩，老农拍其鼻，起身将田中水口挖开一道，令水循旧沟流入下一块田。"

 NAT_Echo_Sons_Forging_Heritage:"回声之子锻火"
 NAT_Echo_Sons_Forging_Heritage_desc:"回声之子峡谷中，锻炉从无熄时。一嵴锋龙卧炉侧，鳞片为火映得发亮。匠人袒臂抡锤，一下一下往烧红之铁上砸，火星溅于龙鳞，龙亦不避。老匠人自架上取一块硫磺支脉之晶，掷入炉中，火苗忽地蹿高，乃开口：「当年伊葵便是这般将燃素熔入，火候差一分，刃即脆。」年轻匠人将出炉之刀按入水中，嗤的一声白气腾起，举刀对炉光看刃口，末了插于架上刀丛，腾手去拉风箱。"

 NAT_Spring_Folk_Trade_Waterway:"流泉之众通航"
 NAT_Spring_Folk_Trade_Waterway_desc:"流泉之众与鳍游龙同守的水路，是纳塔连通四方的脉络。温泉乡之水绕溶水之地曲折而流，商船顺碧波走遍提瓦特海岸，帆影与泉声一唱一和，买卖的热闹把这里捧成纳塔通商枢纽。航路既旺，货走得快，船也造得好，帆影快如游龙逐浪。火之国度的商路，就此把各处钱粮汇作一处，也把纳塔与提瓦特拴作一条水线。泉声不息，商路不绝。"

 NAT_Hanging_Tree_Clan_Fortification:"悬木人筑天堑"
 NAT_Hanging_Tree_Clan_Fortification_desc:"悬木人与匿叶龙一同搭起的天险，是纳塔踞在山崖上的屏障。先祖拿绳索钩爪，把巨木悬于峭壁，造出易守难攻的寨子。这门手艺一代一代传下，纳塔工事便稳如石头生进山里。悬木人匠艺既精，堡垒拔地而起，攻守之道皆到化境。每一处机关里，都藏着匿叶龙的隐秘与悬木人的韧劲。深渊要从山上进纳塔，先得爬过这些悬空的木寨。树在崖上立着，纳塔边境也就立着。"

 NAT_Feather_Guild_Air_Supremacy:"花羽会掌空域"
 NAT_Feather_Guild_Air_Supremacy_desc:"花羽会与绒翼龙同舞之空翼，乃纳塔天际的焰色荣光。勇士与绒翼龙在翘枝崖上并肩盘旋，翼影如流云，遮了半边长空；空战本事，就在风火里磨得越发精纯。造翼工坊锤鸣昼夜不绝。空中攻势如鹰扑食，每一振翅，皆攒着花羽会的胆气。纳塔之天，从此不容他人插翅。深渊黑影再想自头顶压下，先撞上一片不肯退的羽翼。"

 NAT_Smoke_Mystics_Mystic_Ritual:"烟谜主秘仪"
 NAT_Smoke_Mystics_Mystic_Ritual_desc:"烟谜主与暝视龙相守的谜烟秘仪，乃纳塔最隐秘的夜域之学。镜璧山上迷烟缭绕，祭司以灵谜涂鸦与夜神之国对话，借暝视之能探深渊踪迹，谜烟一起，消息便比风还快。这份自夜神传来的本事，把打探与藏身之道都练到极处，密探来去无影，迷烟织作一张大网，把深渊诡计与外人的窥探一并罩住。纳塔要防的，往往先在烟里过一遍。"

 NAT_Ancient_Name_Inheritance_System:"古名承续"
 NAT_Ancient_Name_Inheritance_System_desc:"纳塔代代相传的古名，是英雄荣光的不死延续。自希巴拉克那时起，黑曜石羽毛上以燃素刻下英雄事迹与精神，凝成一个个古名，再由大灵拣选，把英雄意志递到族人手里。这份传承令纳塔之魂越发炽烈，战士拿古名起誓，在阵前把胆气磨得发亮，战心如圣火一般不灭。每一个古名后头，都站着一段不肯低头的往事，也立着一份对深渊的死磕。名字念出来，人便有了来处。"

 NAT_Fire_Return_Sacred_Night_Pilgrimage:"归火圣夜巡礼"
 NAT_Fire_Return_Sacred_Night_Pilgrimage:"归火圣夜巡礼"
 NAT_Fire_Return_Sacred_Night_Pilgrimage_desc:"归火圣夜是纳塔最盛的巡礼，也是圣火竞技场里的一场焰色狂欢。族里人以武相会，角逐的热火汇成圣火薪柴，让那簇火长燃不熄，把深渊挡在门外。巡礼一办，人心便拢到一处，稳得像山；战士被角逐烈焰一激，战心熊熊，万千族民皆愿为守这片盟地挺身而出。火把连成龙，火光映着一张张脸，纳塔人的胆气，就在这一夜一夜的圣火里越烧越旺。"

 NAT_Phyton_Technology_Innovation:"燃素新铸"
 NAT_Phyton_Technology_Innovation_desc:"纳塔源火所养的燃素之术，乃古龙智慧与人之手艺的合璧。自火龙王修库特尔以燃素驱动机括，这股力便一变再变。人把古龙学问接过来，令燃素渗进工坊与学堂。手艺一革新，炉中所出倍增，求学者接踵而至。燃素之火不再只是祭坛上供着的神迹，竟成了推着纳塔前行的实有之力，也成了与深渊硬碰的凭仗。"

 NAT_Dragon_Human_Symbiosis_Covenant:"人龙盟誓"
 NAT_Dragon_Human_Symbiosis_Covenant_desc:"纳塔跨越千年的人龙盟约，是火之国度最金贵的一段交情。自盗火者开了人与龙同处的头，六族各与一族龙相守，龙之神力与人之巧思掺到一处，成了纳塔独有的荣光。有了这盟约，人心安，战士借龙之勇猛把陆上攻势打得凌厉，军坊亦在人龙智慧相碰中日日精进。人与龙把后背交给对方，深渊再来，要面对的不只一柄刀，而是刀与龙息一同扑上。"

 NAT_Duel_Code_Glory:"斗法荣光"
 NAT_Duel_Code_Glory_desc:"圣火竞技场看台挤满人，场中二战士依法典之规各退三步。号令一下，一抢先突进，另一侧身让过，反手一记正中要害，却收了力，只于对方铠甲留一道白印。判胜祭司举起骨片，看台轰然叫好。一初上场之少年攥着木剑，问旁侧老战士：「上了战场，亦照此规矩？」老战士将木剑往其手中塞紧：「法典在，刀方不糊涂。」少年点头，退至场边，蹲下身将木剑穗子重系一遍，系得死死的。"

 NAT_Night_God_Realm_Protection:"夜国镇守"
 NAT_Night_God_Realm_Protection_desc:"夜神之国连着纳塔地脉，是大灵与族人生死相依之地。夜神以地脉为基、以大灵为引，护着纳塔人的魂，也给活人的盟地筑起一道看不见的墙。有这份守护，民心安稳，暗中关防隐如夜域，驻守战士立得稳如磐石。夜神之国透出的那点微光，穿过重重迷烟，成了挡住深渊、护住魂灵的最后一道屏障。人睡去之后，还有人在替他们守着夜。"

 NAT_Fire_Stealer_Wisdom_Heritage:"盗火之智承传"
 NAT_Fire_Stealer_Wisdom_Heritage_desc:"流泉之众浮土静界中，一排石碑刻着弯弯曲曲之龙文，数学者方拿燃素灯一寸寸照认。领头老学者以袖拂去碑面浮土，念出一行，回顾徒弟曰：「库库尔坎偷来圣火那日，亦无人信凡人能懂此。」徒弟举灯凑近，火光于石缝间晃，那行龙文渐显形状。老学者将灯搁下，自怀中摸出一卷抄半之纸，续补数笔，末尾画一小火苗，吹了吹墨，卷起塞入筒中。"

 NAT_Embersea_Abyss_Defense_Line:"烬寂海御渊"
 NAT_Embersea_Abyss_Defense_Line_desc:"纳塔西境烬寂海之关防，是拿血与火浇出来的一道挡暗之墙。这片荒原是特诺切与桑哈杰拿命换来，底下埋着无数英雄，纳塔人以燃素与巨石把线筑起，将深渊黑影拦在西边。关防修筑疾如一阵风，陆上守备坚不可摧；英雄英魂在，战士疲累便消散，一站便是几天几夜。每一寸关防上都写着同一句话：深渊到此为止。"

 NAT_Dragon_Bone_Military_Forging:"龙骨锻兵"
 NAT_Dragon_Bone_Military_Forging_desc:"纳塔独有的龙骨军坊，乃古龙遗骨与燃素熔在一处的战阵荣光。自万杰鲁以龙骨铸剑，匠人便懂了这骨头坚韧，拿燃素反复锻打，打出最硬甲、最利炮。这套法子令陆上兵器护甲挡得住爪牙，火炮准头与威力也越发狠厉，军坊锤声从不停歇。龙骨之硬，配上纳塔人之狠，成了与深渊硬碰的最大底牌。"

 NAT_Great_Tribal_Unity_Oath:"诸族同心盟誓"
 NAT_Great_Tribal_Unity_Oath_desc:"六部之人围圣火堆旁，各站一方，皆不肯先趋前。希巴拉克当年立人龙大盟之旧话为人提起，沃陆之邦农酋冷笑一声，回声之子锻主抱臂。使者将六样本部旧物摆成一圈：颗粒果、断锤、海螺、藤绳、鹰羽、烟灰谜图。乃开口曰：「当年希巴拉克能拢六族于一处，靠的不是谁压谁。」锻主注视那圈旧物，先将断锤置之火边。农酋见之，亦解下果袋。相继而行，六物皆入火圈，青烟绞作一缕。一年轻后生伸手将将散之火拨拢，火星溅于其手背。"

 NAT_Glorious_Flower_Martial_Arts_Ceremony:"荣花演武开典"
 NAT_Glorious_Flower_Martial_Arts_Ceremony_desc:"荣花演武，乃六族较技之会。自纳博尔为救龙的伙伴开此一头，圣火竞技场中烈焰腾空，勇士各执兵刃，轮番上场，一合既罢，一合又起。败者不服，胜者不敢自满，战技遂日精一日。演武之荣既起，陆上攻势亦随之凌厉，投军者络绎不绝。然每办一场演武，深渊那头便多出一批难制的对手。场散之后，火堆尚红，立在灰里的尽是些筋骨更硬的纳塔兵。"

 NAT_Great_Spirit_Soul_Blessing:"大灵守夜魂"
 NAT_Great_Spirit_Soul_Blessing_desc:"夜神之国门首悬六面图腾，各肖其形：炭为沃陆，锤为回声，螺为流泉，藤为悬木，羽为花羽，烟纹为烟谜。纳塔人战殁，魂不即散，循古歌一路归去，付大灵看顾。生者亦常于梦中得微光，伤处易合，惧意渐淡。祭司请灵，法各不同：或以烟，或以火，或以泉，或以藤，或以羽，或以谜。既请而至，初无排场，但觉周身一暖而已。及深渊压境，人心先定，手中之刀乃稳。"

 NAT_Secret_Source_Automaton_Military_Application:"秘源机兵入军"
 NAT_Secret_Source_Automaton_Military_Application_desc:"古龙所遗秘源机兵，乃秘源之术与军坊的合璧。自火龙王以燃素驱那些机括，机关之智便被人学去，寻捕械、构型械之属，成了打深渊的帮手。机兵一人军坊，所造之数倍于往昔，破阵之能亦日渐其强，连车械做工都跟着精了。秘源之力，遂成纳塔手中一把不费人命的机械利刃，摆在深渊面前，寒光逼人。"

 NAT_Abyss_Resistance_Tactics_System:"抗渊方略"
 NAT_Abyss_Resistance_Tactics_System_desc:"纳塔与深渊打了千百年，一身本事皆自血火里淬出。自初代火神希巴拉克的巡夜之战，到玛薇卡的狩夜之战，纳塔人一次一次摸深渊软肋，攒出一套自家打法。这套打法使战士伤亡大减，陆上关防稳如磐石，烟谜主密探眼线也更加灵便。每一条战法后头，都是拿命试出来的经验，也不含一点花架子。纳塔人打深渊，靠的就是这份实打实的老练。"

 NAT_Xibarak_Hero_Legacy:"希巴拉克遗烈"
 NAT_Xibarak_Hero_Legacy_desc:"旧书画那一幕：希巴拉克一箭穿火龙王之眼瞳，己身随后投身源火，自火中重生成火神。说书老人拍一下醒木，将书摊开与围着之娃娃看，指那页曰：「他立人龙大盟，非为坐那神座，乃为与深渊划条线。」一半大孩子踮脚，以指描书上箭痕，描至火龙王眼处停住。老人将书页压平，续念大盟旧规。孩子忽抽回手，攥起腰间练手木刀，朝院中稻草人劈下一刀。"

 NAT_Ocikan_Tyranny_Injustice_Redress:"奥奇坎昭雪"
 NAT_Ocikan_Tyranny_Injustice_Redress_desc:"给奥奇坎平反，是纳塔对真相的一番追寻，亦是与旧账的一回了断。这位半人半龙的谋主，因执念于希巴拉克而落得暴虐，晚年却拿自己身子去封了深渊，一生功过难言，到底洗清了冤名。案既翻过，民心乃安，朝廷威信亦厚，四方通好随之和顺。纳塔人不曾将这位旧王一味抹黑，也不曾一味粉饰，只把功过都摆到火光下看。肯正视过往的国，往前走时才更稳。"

 NAT_Volcano_Industrial_Zone_Expansion:"拓火山工坊"
 NAT_Volcano_Industrial_Zone_Expansion_desc:"图兰大火山周边的厂区扩建，是源火之赐与手艺相融。火山地热与燃素给了炉冶使不尽之力，工坊顺山麓一座一座拔起，民坊军坊交错，织成纳塔炉冶之心。厂区一扩，民坊所出翻番，军坊做工更精，整片工场之工效节节上蹿。火山烈焰，就此从祭祀的圣火变成推动纳塔往前的炉火。烟囱冒得越高，纳塔的腰杆便越硬。"

 NAT_Natlan_National_Identity_Construction:"纳塔同心"
 NAT_Natlan_National_Identity_Construction_desc:"纳塔千百年的民族认同，是火之民族一点点熬出来的精神。从人龙相争到人龙共生，从六族互相掐到自己人坐一条凳，纳塔人以火为图腾、以圣火为信，把六样的人拧成了一种认同。这份认同让民族之魂越烧越旺，六族稳如磐石，对外说话也更有分量。每个纳塔人提起自己的来处，都能挺直腰板说一句：我是火之民族的人。心齐了，火才不灭，深渊才进不来。"

 NAT_Soul_Return_Poem_Oath:"还魂诗立誓"
 NAT_Soul_Return_Poem_Oath_desc:"夜里，数祭司围坐归火圣夜旧坛边，轮唱那支还魂诗。调一起一落，坛上之火亦随明灭。一新寡妇人抱亡夫所留旧刀坐于人后，听至某句，肩头一颤。领唱老祭司放缓拍子，回望一眼，声更低：「魂循调子而归，人便须替他行尽余下之路。」妇人将刀横于膝，以袖口一寸寸擦去刀鞘之土。唱至末句，坛心火苗忽一直，众人影子在墙上齐齐一晃，复落原处。"

 NAT_Flame_Flow_Pool_Esoterica:"流炎池传秘"
 NAT_Flame_Flow_Pool_Esoterica_desc:"图兰圣城那座流炎之池的秘传，乃火龙王修库特尔留给后人的一份厚礼。古龙曾泡在池中，自满满燃素里汲取智识；这套法子后来被人学去，成了治学与办工场的源头。池中之智令纳塔学问一日快过一日，学堂与作坊次第而起，工坊所出亦随之而涨。燃素里藏着的智慧，如一点不灭之火，照着纳塔前行，也照着它与深渊相搏。"

 NAT_Shadow_Sealing_Needle_Reinforcement:"缝影针镇渊"
 NAT_Shadow_Sealing_Needle_Reinforcement_desc:"回声之子的缝影针，乃纳塔挡深渊的上古屏障。当年陶奥鲁借大灵之力铸针，钉住火山大王的臂膀，也把深渊暗影一并封住，这门手艺代代相传。针一加固，陆上关防更牢，驻守战士立得更稳，各处也越发安定。每一根缝影针里，都凝着大灵之力与族民之心，如一道上了锁的枷，把深渊牢牢拴在纳塔门外。"

 NAT_Six_Heroes_Heroic_Legacy:"六英杰遗烈"
 NAT_Six_Heroes_Heroic_Legacy_desc:"烬寂海边，风中皆是灰。六英杰之事迹早刻入古名，碑上只留影，特诺切之名列于最前。一年轻兵士蹲黑曜石碑前，拿燃素灯照那些刻痕，念及其一，回顾带队老人曰：「此六人，当真皆自那片海归来？」老人接灯，往碑上照得更亮：「归者非人，乃名字也。」年轻兵士默然半晌，自怀中掏出一小块刻半之黑曜石，就碑上之痕，照样子刻下自己第一笔。"

 NAT_Great_Unity_Of_All_Fires_Glory:"万火归一荣光"
 NAT_Great_Unity_Of_All_Fires_Glory_desc:"万火归一的荣光，是纳塔把力气尽拧到一处的结果。六族同心，人龙并肩，古名之荣、圣火之威、大灵之佑，尽并作一束焚黑烈焰。朝廷号令此番没人打折扣，各处安安稳稳，战士胆气烧到极处，工坊所出、陆上攻势也都到了极处。六簇火并作一堆，再不分散，照得赤色大地一片通明。深渊望见这火，才知纳塔已是拆不开、分不散的一个整块。"

 # 1. 希巴拉克初代火神遗产
 SHEBARAK_FIRST_FIRELORD_LEGACY:"希巴拉克初火"
 SHEBARAK_FIRST_FIRELORD_LEGACY_desc:"归火圣夜里，六族火堆一字排开。老祭司举起自火龙王心口取来之旧物，对围着之战士曰：「希巴拉克便是自此中重生，万火归一，头一个念头即在此刻。」台下一年轻战士攥刀，忽觉耳边似有人吼一声，那是希巴拉克穿过千年之战吼。乃以刀顿地，震得火星四溅。老祭司将旧物供回坛心，六堆火为夜风一吹，火头俱朝一方歪去。年轻战士注视那片火，将刀尖插入脚边之土，蹲身守着。"

 # 2. 库库尔坎盗火者智慧
 KUKULKAN_FIRE_BRINGER_LEGACY:"库库尔坎盗火"
 KUKULKAN_FIRE_BRINGER_LEGACY_desc:"浮土静界入口，二工匠方将一块龙文碑往回拖，碑面尽是难辨之符。领头者把燃素灯凑上，光在刻痕里游，念一段，徒弟在纸上一笔笔抄。那工匠直腰曰：「瓦萨克拉胡巴肯将火偷与人时，龙族犹骂他疯。」徒弟把抄就之纸吹干，卷入筒中。二人抬碑往工坊行，路过方下水之战船，船坞内燃素管线吱呀作响。工匠将碑靠墙根，自筒中抽那纸，就炉火复添一行译出之字。"

 # 3. 六大部族大联盟誓约
 SIX_TRIBES_GREAT_ALLIANCE:"六部大盟誓"
 SIX_TRIBES_GREAT_ALLIANCE_desc:"这是希巴拉克拉着沃陆、回声等六族立下的神圣盟约，打破各家各守一方的旧墙，以圣火为证，同挡外敌与深渊。盟约写明，六家好处共享：沃陆沃土养人，回声炉子造刀，流泉航道连通四方。这份同心的遗泽，令纳塔每到将散之时又能聚回。征兵号角一响，各族勇士便丢下手里的活，奔同一个战场去。旗子各有各色，可都朝着一堆火走。"

 # 4. 归火圣夜巡礼之誓
 HOLY_FIRE_NIGHT_PILGRIMAGE:"归火圣夜巡礼"
 HOLY_FIRE_NIGHT_PILGRIMAGE_desc:"这是纳塔最神圣的一场竞技盛典，源头是希巴拉克借死之执政之力定下的规矩。勇士在圣火竞技场里争荣耀，角逐烧起的火，还维系着深渊封印。巡礼里冒出的英雄，会接下一个古名，去做巡夜之人，替纳塔挡黑。这份遗产令纳塔人自幼尚武，军队在比试里长了经验，战魂在圣火里淬得更硬。每隔几日便有一股新胆气注入民心，地脉里流的英雄意志，令陆上战法学得更快。"

 # 5. 夜神之国大灵庇佑
 NIGHT_GOD_KINGDOM_BLESSING:"大灵佑夜国"
 NIGHT_GOD_KINGDOM_BLESSING_desc:"夜神之国门口插一排图腾，最右那根乃新立。一老兵拄拐行至图腾前，伸手摸了摸上头所刻炭纹，那是其兄弟之魂守着之处。低声曰：「你走那年，犹是我教你磨刀。」守坛小祭司递过一碗水，老兵接了，徐徐浇于图腾脚下之土。小祭司曰：「大灵记着呢，深渊钻不进来。」老兵点头，将拐靠图腾上，扶膝徐徐蹲下，脸对那道炭纹。"

 # 6. 燃素锻造秘术
 PHLOGISTON_FORGING_TECHNIQUE:"燃素锻造术"
 PHLOGISTON_FORGING_TECHNIQUE_desc:"这是回声之子传了千年的本事。源头在锻火英雄伊葵，他那套燃素编织法，把火山源火与龙鳞龙骨揉到一处，打甚么都不坏。匠人在峡谷工坊里捶了又捶，令燃素渗进金属骨头缝里。工坊所出随之倍增，换甲械时顺如流水。这份秘术令纳塔兵刃自带灼烧之力；哪怕堆在角落的旧兵刃，灌进燃素也能重新上阵。锤声千年未断，每一响都在给纳塔添硬气。"

 # 7. 人龙共生盟约
 HUMAN_DRAGON_SYMBIOSIS_COVENANT:"人龙共生盟"
 HUMAN_DRAGON_SYMBIOSIS_COVENANT_desc:"这是希巴拉克砸碎人龙奴役枷锁之后，定下的契约。自此纳塔人不再怕龙，转而与鳍游龙、绒翼龙一同过日子，一同打仗。龙焰给战士刀上添威，龙鳞令冲锋更锐，特种营里也收进龙裔之敏捷。自布基纳与山王康加玛托并肩，到松伽塔同穆胡鲁共斩恶龙，一桩桩旧事都写在这约里。人与龙之力交织到一处，成了跨越种族的守护交情。"

 # 8. 古名英雄传承
 ANCIENT_NAME_HEROIC_HERITAGE:"古名承英烈"
 ANCIENT_NAME_HEROIC_HERITAGE_desc:"竞技场边，一枚燃素刻过之黑曜石置于石台。新来勇士伸手去碰，指腹方挨石面，眼前之光晃了一下，似有人在地脉里回头看他。带队之将在旁曰：「沃摩延管同心，武卡管超越，杜麦尼管希望，汝揣哪一枚，便照哪一枚之性子带兵。」勇士收手，将黑曜石攥入掌心，行至场心站定。对面并无一人，他仍照记忆里先辈之样，先抱拳，再拔刀，刀锋在日头下划出一道亮。"

 # 9. 春之部族水道智慧
 SPRING_CLAN_WATERWAY_WISDOM:"春部水道智"
 SPRING_CLAN_WATERWAY_WISDOM_desc:"这是流泉之众代代传下的生计本事，源头是初代首领乌努库开辟航道的传说。他们驾着鳍游龙，把温泉与海岸连作一线，织出纳塔水网。这份智慧令水师得水流之助：船行得快，探得也远；路途既熟，粮秣便省。商船顺着开出的道走，把燃素工艺品运到远方。造船厂就在温泉养着的土地上，昼夜开工。流泉水路，成了纳塔搭向外界的一根缆绳。"

 # 10. 回声之子锻造匠心
 ECHO_CLAN_FORGING_INGENUITY:"回声之子铸艺"
 ECHO_CLAN_FORGING_INGENUITY_desc:"这是回声之子的立身本事。当年伊葵宁可把手稿烧了，也不让技艺落进暴君手里；后来松伽塔拿龙骨打出弥坚骨。匠人把这份执念与荣耀，一锤一锤熔进器物里。匠心一使，军坊所出节节高，改换甲械少走许多弯路，步卒与甲士的刀也都带着燃素之火。峡谷里锤声千年未歇，每一响都在磨更利的刃，替纳塔战士磨出攻守的本事。"

 # 11. 悬木人绝壁战技
 HANGING_CLAN_CLIMBING_SKILL:"悬木人绝壁战"
 HANGING_CLAN_CLIMBING_SKILL_desc:"此乃悬木人在踞石山悬崖间练出的活命本事。先祖以绳索钩爪，把巨木吊在壁上安家，就险地里练出一身他族不能及的身手。此技既成，纳塔之兵不再惧复杂地形：渡河如履平地，涉水守御与架设工事，都快了几分。战士攀壁如猿，在山里设伏，把来犯之敌引进天堑困死。正如当年布基纳为摘火榴果，硬是降了那道绝壁。"

 # 12. 花羽会空翼巡弋
 FEATHER_GUILD_AIR_PATROL:"这是花羽会传承自莉安歌的驭龙之术。那被龙族养大的少女，三度射落邪龙，又三度治愈，将绒翼龙之敏捷融进空战技艺。部族勇士驾龙翼翱翔天际，飞器灵便，航程大增，空中之势倍增，每架输兵之器皆可多载数十壮士。他们巡于纳塔天际，寸土不遗；眼如雄鹰，敌人动静无所遁形，遂成守护长空的一面坚盾。"
 FEATHER_GUILD_AIR_PATROL:"这是花羽会传承自莉安歌的驭龙之术。那被龙族养大的少女，三度射落邪龙，又三度治愈，将绒翼龙之敏捷融进空战技艺。部族勇士驾龙翼翱翔天际，飞器灵便，航程大增，空中之势倍增，每架输兵之器皆可多载数十壮士。他们巡于纳塔天际，寸土不遗；眼如雄鹰，敌人动静无所遁形，遂成守护长空的一面坚盾。"

 # 13. 沃野部族丰饶之赐
 PLAINS_CLAN_FERTILE_LAND:"沃野丰饶之赐"
 PLAINS_CLAN_FERTILE_LAND_desc:"此乃沃陆之邦扎根火山沃土所得的馈赠。火山灰把地养得肥，颗粒果一串串结，突角龙也来帮着耕，纳塔因此有了提瓦特最满的粮仓。这份丰饶令日子过得俭省，工坊所出却高，本地物产一无所弃。农人守着阿霍布立下的丰饶誓约，在火渠浇过的田里弯腰，金黄穗子被风一吹，如浪伏下去。纳塔的家底，就埋在这片黑土里。"

 # 14. 烟谜主谜烟秘仪
 SMOKE_CLAN_MYSTERY_SECRET:"烟谜主秘仪"
 SMOKE_CLAN_MYSTERY_SECRET_desc:"此乃烟谜主所守夜域秘术。祭司取荧光角菌研作墨，于岩壁画灵谜涂鸦，借谜烟与夜神之国大灵相语。秘仪既行，纳塔藏事、解事之能出奇，耳目之网张得极宽，敌兵一动，便已入了网中。桑哈杰当日赖此预见深渊之灾，茜特菈莉亦以涂鸦封过魔物。谜烟如帘，把纳塔的盘算遮得严密，探子钻不入，黑气亦透不过。"

 # 15. 火龙王源火之力
 FIRE_DRAGON_KING_PRIMAL_FIRE:"火龙王御源火"
 FIRE_DRAGON_KING_PRIMAL_FIRE_desc:"这是火龙王修库特尔留下的源火余威。他虽被深渊蚀过，源火本性依旧暴烈，给纳塔兵器注进一股原始的破坏力。这份力量令部众软硬之势俱涨，破关之能更增，砸起工事来翻倍地狠。燃素之刀一经源火烧过，魔物黑壳便滋滋而化，仿佛甚么都挡不住。就如当年希巴拉克一枪穿起火龙王之眼，那道锋芒，从古至今都没凉过。"

 # 16. 还魂诗不朽誓约
 REVIVAL_POEM_IMMORTAL_OATH:"还魂不朽誓"
 REVIVAL_POEM_IMMORTAL_OATH_desc:"圣火竞技场里，还魂诗一起头，归队老兵便一个接一个自人群后走出，拍去肩上之灰。一年轻号手数人头，数着数着多出一个，愣了一下。吹号老人将号递他：「此乃希巴拉克同若娜瓦当年定下之约，为家而死者，借古名与诗能归。」年轻号手将号举至唇边，照调补了一声。那多出之老兵循声望来，抬手拍其肩。号手将号口朝下，倒出里头积灰，复吹起第二句。"

 # 17. 巡夜者战争经验
 NIGHT_WATCHER_WAR_EXPERIENCE:"巡夜者历战"
 NIGHT_WATCHER_WAR_EXPERIENCE_desc:"这是纳塔人与深渊厮杀几千年攒下的家底。自葬火之战到坎瑞亚灾厄，巡夜之人在烬寂海边与魔物死磕，拿血换来一身见识。这份经验令步卒、飞骑、水师都学得快，敌军在空中也占不稳便宜。战士摸透魔物脾气：哪一下致命，如何闪避，心中皆有数，黑里照样能打。正如特诺切与桑哈杰当年，拿命封住巴窟纳瓦的那股决绝。"

 # 18. 玛薇卡永恒烈焰
 MAVEKA_ETERNAL_BLAZING_FLAME:"玛薇卡永恒焰"
 MAVEKA_ETERNAL_BLAZING_FLAME_desc:"此乃历代最强火神玛薇卡所留的炽烈意志。她自悬木人一个少女，走到执掌圣火之位，归火圣夜巡礼中未曾一败；为守纳塔，她把意识存进圣火，一存便是五百年。这份烈焰令纳塔战意高涨，兵刃之威与调兵之权一同而涨。战士举刀时，能觉出玛薇卡穿过岁月按下来的一只手；到最后那场对深渊的仗，便烧成谁也拦不住的一股。"

 # 19. 奥奇卡纳塔烬城遗产
 OCHIKAN_ASH_CITY_LEGACY:"奥奇卡纳塔遗业"
 OCHIKAN_ASH_CITY_LEGACY_desc:"烬城废墟里，一燃素管线犹在吱呀转动，半截露于塌墙之外。数工匠蹲管线旁，拿灯照上头旧纹，一笔笔往纸上描。领头者以锤敲管壁，听那回响曰：「奥奇坎封了禁城，这些管子倒不肯停。」徒弟将描就之纸摊于膝，对着墙上残存熔岩石碑，一符一符地认。工匠把纸卷好塞入怀，起身踢开脚边碎砖，露出碑底新的一行刻痕，蹲下去，以指尖顺那痕徐徐划过。"

 # 20. 茜特菈莉黑曜涂鸦
 CITLALI_OBSIDIAN_GRAFFITI:"茜特菈莉涂鸦"
 CITLALI_OBSIDIAN_GRAFFITI_desc:"这是烟谜主传奇萨满茜特菈莉传下的灵谜涂鸦：以荧光角菌为墨、黑曜石为底，把记忆与守护之力刻进岩壁。涂鸦既成，纳塔藏消息的本事更牢，走险地折损也轻，军中防守得加持，探子之窝更难端。涂鸦如夜神之国睁着一只眼，盯着深渊往里渗的每一步。战士在画过符的地方打仗，如有大灵在背后护着，再黑也看得清哪边是赢。"

 # 21. 特诺切议事棒传说
 TENOCHE_TALKING_STICK_LEGEND:"这是最后一位特诺奇兹托克人特诺切的遗物。当年他手持聊聊棒，聚合分裂之部族，在烬寂海与深渊魔物同归于尽。这份传说使纳塔兵马攻伐与突破之能俱增，城市作战如虎添翼，士气始终高昂。议事棒木纹中藏着同心之古名。战士挥刃时，仿佛听见特诺切召集盟友的呐喊：为共同的家园而战，无畏生死。"
 TENOCHE_TALKING_STICK_LEGEND:"这是最后一位特诺奇兹托克人特诺切的遗物。当年他手持聊聊棒，聚合分裂之部族，在烬寂海与深渊魔物同归于尽。这份传说使纳塔兵马攻伐与突破之能俱增，城市作战如虎添翼，士气始终高昂。议事棒木纹中藏着同心之古名。战士挥刃时，仿佛听见特诺切召集盟友的呐喊：为共同的家园而战，无畏生死。"

 # 22. 烬寂海戍边勇士
 ASH_SEA_GARRISON_WARRIORS:"烬寂海戍边"
 ASH_SEA_GARRISON_WARRIORS_desc:"这是守在烬寂海关防的勇士传下来的意志。五百年前，桑哈杰与特诺切在此没了命，后来的人一个接一个补上，拿血肉替纳塔垒起挡渊之墙。这份意志令部众筑垒之能更高，手脚更快，无谓折损更少，核心地界攻守也更硬。勇士在被时间丢下的荒原上巡逻，甲上沾着火山灰与魔物之血。他们死死钉在那儿，纳塔腹地才听不见深渊动静。"

 # 23. 燃素机兵战争造物
 PHLOGISTON_AUTOMATON_WAR_MACHINE:"燃素机兵造物"
 PHLOGISTON_AUTOMATON_WAR_MACHINE_desc:"这是远古龙族与纳塔人一同造出的战争机器，以燃素为心，自寻捕械一路造到深古秘源机龙，装着龙族炉冶极艺。这份造物令甲械更值钱，车兵、机兵打得更猛，破阵也更利。机兵齿轮一转，带着源火轰鸣，甲上刻的克渊符能挡住黑气。它成了纳塔步卒之钢铁洪流，就如当年龙族靠机兵建起图兰圣城，一样的辉煌。"

 # 24. 大灵先祖指引
 GREAT_SPIRIT_ANCESTOR_GUIDANCE:"大灵先祖引路"
 GREAT_SPIRIT_ANCESTOR_GUIDANCE_desc:"一巡夜人在图腾柱下歇脚，将灯笼搁于柱脚，对柱上那道最老刻痕开口。那痕乃第一位大灵察阿克所留。低声曰：「吾这一夜未见异样，汝等亦替我看着些。」风穿林子，柱上藤索轻轻晃动，似有人应了一声。巡夜人提起灯笼，挂回柱顶，火光将刻痕照得更清。摸出怀中还魂诗抄页，借光看一行，折好塞回，扛起灯笼，沿旧路往下一根柱子行去。"

 # 25. 纳塔龙血血脉
 NATLAN_DRAGON_BLOODLINE:"纳塔龙血裔"
 NATLAN_DRAGON_BLOODLINE_desc:"这是纳塔人与龙共处千年，沉淀在血脉里的馈赠。自奥奇坎的半人半龙之身，到布基纳与山王的交情，龙血与人身掺到一处，带来一股子超凡耐受力。这份血脉令军中规矩更齐、攻守更稳，酷暑严寒也少折损人，破阵更利。纳塔战士血管里流着源火与龙焰，再难的处境也稳得住手。就如嵴锋龙的祖上，天生便能在火山荒原来去自如。"

 # 26. 荣花演武武道文化
 GLORY_FLOWER_MARTIAL_ART_CULTURE:"荣花演武争锋"
 GLORY_FLOWER_MARTIAL_ART_CULTURE_desc:"这是纳塔传了千年的武道盛会，和归火圣夜并称双璧。勇士以武相会，在比试里磨技艺、也把人心拢到一处。这份文化让新兵上手更快，队伍长经验更顺，请知兵者来也少花些钱，规矩自然立得住。演武场的鼓一响，纳塔人血里那点勇武就醒了，年轻人在对决里接住古名的精神，每一招都憋着一股争荣光的劲。武道这门传统，就越传越新。"

 # 27. 图兰圣山地热恩赐
 TULAN_SACRED_MOUNTAIN_GEOTHERMAL_BOUNTY:"图兰圣山赐"
 TULAN_SACRED_MOUNTAIN_GEOTHERMAL_BOUNTY_desc:"这是图兰大火山给纳塔的天然好处。作为源火生出之地，山体里到处是地热与燃素矿，养着炉冶与农田。这份恩赐令盖房、修工事都快，本地之物用得充分，取燃料也省事。纳塔人以地热推熔炉，用火山灰改土，图兰圣山的脉搏与纳塔工坊的心跳，跳到了一个点上。就如远古龙族在此建起圣城，把源火之力留给后来人用。"

 # 28. 缝影针深渊封印
 SHADOW_STITCH_NEEDLE_ABYSS_BARRIER:"缝影针镇渊"
 SHADOW_STITCH_NEEDLE_ABYSS_BARRIER_desc:"这是回声之子长老陶奥鲁拿大灵之力打造的抗渊神器。四根燃素钉柱钉住火山大王手臂，也把深渊钻进来的缝堵死。这份封印令核心地界守得更牢，暗处之乱也起不来，人心安分，驻军都能少些。遍布纳塔的缝影针，如给地脉缝伤口的一根根线，把污染死死锁在边上。钉柱上符文一闪，仿佛能听见大灵在念祷文，护着纳塔地脉干净。"

 # 29. 六英杰光辉传承
 SIX_HEROES_RADIANCE:"六杰传辉"
 SIX_HEROES_RADIANCE_desc:"这是五百年前坎瑞亚灾厄中，六位英雄留下的荣耀：万杰鲁之力，孟尼利克之超，桑哈杰之献，布基纳之回火，松伽塔之祝福，图帕克之同心。此传既承，带兵者所统之众愈广。陆海空将领一上手，品级便高；各门学问研究起来，也省几分力。英雄古名在纳塔大地传着，其胆其智皆化进队伍骨头。新一代便接着写抗渊的故事。"

 # 30. 纳塔不屈战魂
 NATLAN_INDOMITABLE_WAR_SPIRIT:"纳塔百战不屈"
 NATLAN_INDOMITABLE_WAR_SPIRIT_desc:"战壕里，一年轻兵士之燃素兵刃卷了刃，蹲于土坎后，拿石一下下磨。旁侧老兵将仅剩半块干粮塞他：「葬火之战那会儿，连这也没有。」年轻兵士咬一口，将刀在石上复蹭数下，刃口总算见了点光。号角于远处响起，二人同时起身，老兵将末一支箭插入箭袋，年轻兵士把卷刃之刀横于胸前。脚下乃坎瑞亚灾厄所留旧壕，墙上犹嵌未拔净之箭。号角第二遍响，二人一前一后翻出土坎，刀光在灰天里一闪。"
 # 纳塔决策（Decision）Localisation（30个）

 NAT_Decisions:"§Y归火圣夜巡礼§!" # 纳塔核心机制
 NAT_Decisions_desc:"\n归火圣夜巡礼，乃纳塔至圣之竞技盛典，亦维系深渊封印之要仪也。筹办之际，烟谜主祭司画灵谜涂鸦，一一指明赛程；回声之子赶制竞技燃素兵刃；六族各择最骁勇者，俟时登场。工匠修圣火竞技场黑曜石看台，务令齐整；沃陆之族备足颗粒果与火山酒；花羽会驭龙骑士于半空布燃素符阵。百姓延颈企盼新英雄出世，角逐之火一燃，压渊之封印复牢一分。\n\n§Y深渊侵蚀度：§!§R[?NAT-ABY-Index]§!\n\n§G[NAT_grace_tier_mods]§!\n\n§Y火神的恩情：§!§R[?MVK-Prestige-Index]§!\n\n§G[NAT_abyss_tier_mods]§!\n\n纳塔将于历史演进中，视§Y深渊侵蚀度§!与§Y火神的恩情§!而趋异途。\n\n"
