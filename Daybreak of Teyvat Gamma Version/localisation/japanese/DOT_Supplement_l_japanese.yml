 ITA_italian_hegemony_subjects:0 "イタリアの覇権"
 ITA_italian_hegemony_subjects_desc:0 "[ITA.GetNameDef]の覇権の下に集う我々はファシズムの守り手であり、その存在は、さながら真実と啓蒙の砦である。何人たりとも我々の進む道を阻ませはしない！"
 ITA_italian_highways_modifier:0 "$ITA_italian_highways_bba$"
 ITA_italian_irredentism_ns:0 "$ITA_italian_irredentism$"
 ITA_italian_irredentism_ns_desc:0 "[ITA.GetNameDef]が全ての潜在能力を解放し、持てる力の全てを発揮するには、この国の本来の国境にまで領土を拡大させ、イタリア国民が正当な所有者たるあらゆる土地を統一する必要がある！"
 ITA_italys_destiny_idea:0 "イタリアの宿命"
 ITA_junio_valerio_borghese:0 "ユニオ・ヴァレリオ・ボルゲーゼ"
 ITA_liberation_or_death_ns:0 "$ITA_liberation_or_death$"
 ITA_liberation_or_death_ns_desc:0 "いよいよ、イタリアを独裁政治から解放するための最終局面に入った。ここまで来たら、もはや引き返すことはできない！"
 ITA_libyan_railway_modifier:0 "リビア鉄道"
