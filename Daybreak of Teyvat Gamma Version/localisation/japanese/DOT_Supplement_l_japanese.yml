 SOV_anti_capitalist_campaign_generic:0 "反資本主義活動"
 SOV_anti_capitalist_campaign_generic_desc:0 "資本主義者など信用に値しない。選択肢を与えられれば、ブルジョワは常にプロレタリアートの抑圧を選択するに違いない。我々は、奴らに戦いを挑む準備をする必要があるのだ。"
