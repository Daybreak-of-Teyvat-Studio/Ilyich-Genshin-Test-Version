DRA_Ensure_Consumer:0"Товары"
DRA_Ensure_Consumer_desc:0"Мы наладим производство товаров."
DRA_Ensure_Food:0"Продовольствие"
DRA_Ensure_Food_desc:0"Мы решим продовольственную проблему."
DRA_for_hamony:0"Культурный диалог"
DRA_for_hamony_desc:0"Мы уменьшим культурные конфликты."
DRA_call_labours:0"Возвращение рабочих"
DRA_call_labours_desc:0"Мы вернём рабочих на заводы."
DRA_call_fighters:0"Боевой дух солдат"
DRA_call_fighters_desc:0"Мы поднимем боевой дух солдат."
DRA_expand_our_farms:0"Расширение ферм"
DRA_expand_our_farms_desc:0"Мы расширим фермы для производства продовольствия."
