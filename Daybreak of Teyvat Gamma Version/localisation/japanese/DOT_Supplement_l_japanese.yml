 MTG_naval_treaty_adherent:0 "ロンドン海軍軍縮条約調印国"
 MTG_naval_treaty_adherent_desc:0 "我が国はロンドン海軍軍縮条約に署名したため、主力艦の保有量が制限されている。"
 MTG_naval_treaty_adherent_reduced:0 "エスカレーター条項発動"
 MTG_naval_treaty_adherent_reduced_desc:0 "ワシントン海軍軍縮条約の一部の署名国がロンドン海軍軍縮条約を放棄した後、エスカレーター条項を発動し、主力艦の保有量と軍備の制限を緩和した。"
