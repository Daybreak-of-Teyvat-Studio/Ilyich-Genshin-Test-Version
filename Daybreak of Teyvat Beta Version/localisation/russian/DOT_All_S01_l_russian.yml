#14 教会反对派攻克西风大教堂
DOT_ControlProvince.14.t:0"Церковная оппозиция захватила Собор Запада!"
DOT_ControlProvince.14.d.generic:0"Собор Запада захвачен Церковной оппозицией. Они давно выступали против Церкви, но только во время войны перешли к оружию.\n\nОчевидцы видели, как после боя в собор входили люди, не похожие на солдат, и в соборе было тихо."
DOT_ControlProvince.14.a:0"Еретики захватили святыню..."
DOT_ControlProvince.14.b:0"Наконец-то!"
DOT_ControlProvince.14.c:0"Что они будут делать?"
DOT_ControlProvince.14.e:0"В Мондштадте всё всегда так плохо."

DOT_ControlProvince.15.t:0"Гавань Ли Юэ пала!"
DOT_ControlProvince.15.d.generic:0"В ходе ожесточённой войны гавань Ли Юэ захвачена войсками [FROM.GetAdjective]. Это важный торговый центр, но он стал полем битвы.\n\nЗдания и инфраструктура сильно пострадали. Жители бежали. [FROM.FROM.GetDef] обещает вернуть гавань.\n\nВойска [FROM.GetAdjective] продолжают наступление.\n\nВесь мир следит за ситуацией."
DOT_ControlProvince.15.a:0"Тысяча скал незыблема..."
DOT_ControlProvince.15.b:0"Великая победа!"
DOT_ControlProvince.15.c:0"Тёмные времена..."
DOT_ControlProvince.15.e:0"Будем ждать."

DOT_ControlProvince.16.t:0"Дворец Юйцзин пал!"
DOT_ControlProvince.16.d.generic:0"В ходе ожесточённой битвы административный центр Ли Юэ, дворец Юйцзин, сильно пострадал и пал.\n\nВойска [FROM.GetAdjective] атаковали стремительно. Здания разрушены, слышны взрывы. Внутри уничтожены документы, есть жертвы.\n\nВласти начали эвакуацию. Войска ведут бои. Город в осаде."
DOT_ControlProvince.16.a:0"Яйцо, сахар, миндаль — всё при мне."
DOT_ControlProvince.16.b:0"Великая победа!"
DOT_ControlProvince.16.c:0"Тёмные времена..."
DOT_ControlProvince.16.e:0"Будем ждать."

DOT_ControlProvince.17.t:0"Золотой дом пал!"
DOT_ControlProvince.17.d.generic:0"Золотой дом, центр эмиссии Моры в Ли Юэ, захвачен в ходе войны. Это символ и опора экономики Ли Юэ.\n\nНесмотря на охрану, враг взял верх и захватил дом.\n\nЭто шокирует всех. Это огромный удар по экономике. В доме могли храниться сокровища и документы.\n\nПравительство заявляет, что дух народа не сломлен."
DOT_ControlProvince.17.a:0"Теперь у нас нет ни одной Моры."
DOT_ControlProvince.17.b:0"Великая победа!"
DOT_ControlProvince.17.c:0"Тёмные времена..."
DOT_ControlProvince.17.e:0"Будем ждать."

DOT_ControlProvince.18.t:0"Центр Бездны Цэнъянь пал!"
DOT_ControlProvince.18.d.generic:0"Горнодобывающий центр Бездна Цэнъянь захвачен. Это был важный источник ресурсов.\n\nБорьба за ресурсы была ожесточённой. Обе стороны стремились захватить его. Войска [FROM.GetAdjective] одержали верх.\n\nЦэнъянь превратилась в руины. Процветание исчезло, остались только камни."
DOT_ControlProvince.18.a:0"Тысяча скал незыблема..."
DOT_ControlProvince.18.b:0"Великая победа!"
DOT_ControlProvince.18.c:0"Тёмные времена..."
DOT_ControlProvince.18.e:0"Будем ждать."

DOT_ControlProvince.19.t:0"Вершина Цинъюнь пала!"
DOT_ControlProvince.19.d.generic:0""
DOT_ControlProvince.19.a:0"Тысяча скал незыблема..."
DOT_ControlProvince.19.b:0"Великая победа!"
DOT_ControlProvince.19.c:0"Тёмные времена..."
DOT_ControlProvince.19.e:0"Будем ждать."

DOT_ControlProvince.20.t:0"Остров Гуюнь пал!"
DOT_ControlProvince.20.d.generic:0"Главный военно-морской порт Ли Юэ, остров Гуюнь, захвачен в ходе войны. Это шокирует всю страну.\n\nПотеря Гуюня ставит под угрозу безопасность и оборону. Это также повлияет на геополитику.\n\nПравительство созвало экстренное совещание и обещает вернуть порт."
DOT_ControlProvince.20.a:0"Тысяча скал незыблема..."
DOT_ControlProvince.20.b:0"Великая победа!"
DOT_ControlProvince.20.c:0"Тёмные времена..."
DOT_ControlProvince.20.e:0"Будем ждать."

