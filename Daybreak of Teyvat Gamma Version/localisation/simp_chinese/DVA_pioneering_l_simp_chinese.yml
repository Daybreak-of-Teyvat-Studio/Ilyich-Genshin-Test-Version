l_simp_chinese:
 DVA_pioneering_cat:0 "拓荒战争"
 DVA_pioneering_cat_desc:0 "风龙领的荒野仍被丘丘部落占据。以有限的战争，一步一步拓清 edges，直至收复全境。"
 DVA_start_pioneering:0 "发动拓荒战役"
 DVA_start_pioneering_desc:0 "对占据风龙领外围的丘丘部落发动一场有限战争：只夺作战区内的地块，不扩大事态。"
 DVA_pioneering_mission:0 "拓荒战役进行中"
 DVA_pioneering_mission_desc:0 "在战区内驱逐丘丘人，占领全部目标地块。"
 DVA_pioneering_mission_timeout:0 "拓荒战役无功而返"
 is_not_engaged_in_a_limited_war:0 "当前没有进行中的拓荒战役"
 DVA_PIONEERING_PEACE_TT:0 "向对方派出谈和使者"
 DVA_pioneering_events.1.t:0 "拓荒战役告捷"
 DVA_pioneering_events.1.desc:0 "我们的战士在风龙领外围的荒野上击溃了丘丘人的抵抗，目标地块已在控制之下。是见好就收，还是乘胜追击？"
 DVA_pioneering_events.1.a:0 "派出使者，谈和"
 DVA_pioneering_events.1.b:0 "继续进军！"
 DVA_pioneering_events.2.t:0 "风龙领的谈和使者"
 DVA_pioneering_events.2.desc:0 "风龙领派来使者，要求就双方的冲突举行谈判。在他们看来，这场拓荒不过是有限的边界摩擦。"
 DVA_pioneering_events.2.a:0 "结束这场冲突吧"
 DVA_pioneering_events.2.b:0 "丘丘人绝不退让！"
 DVA_pioneering_events.4.t:0 "谈和被拒"
 DVA_pioneering_events.4.desc:0 "对方拒绝了我们的谈和请求，战争仍将继续。"
 DVA_pioneering_events.4.a:0 "那就打到底"
 DVA_pioneering_events.6.t:0 "拓荒战役受挫"
 DVA_pioneering_events.6.desc:0 "战事旷日持久，补给线吃紧，国内对这场远征的怨言四起。我们不得不停下脚步。"
 DVA_pioneering_events.6.a:0 "从长计议"
 DVA_pioneering_events.10.t:0 "女士南下"
 DVA_pioneering_events.10.desc:0 "至冬的执行官「女士」罗莎琳·克鲁兹希卡·洛厄法特率军南下，兵不血刃地接管了丘丘人让出的先遣基地一线。至冬的霜色旗帜，插进了蒙德与璃月之间的荒野。\n风龙领的拓荒者们意识到：挡在他们面前的，已经不只是丘丘人了。"
 DVA_pioneering_events.10.a:0 "至冬的手伸得太长了……"
 DVA_pioneering_events.11.t:0 "拓荒完成"
 DVA_pioneering_events.11.desc:0 "丘丘部落被逐出了风龙领外围的全境，荒野重新归于秩序。但南方领的至冬驻军近在咫尺——收复失地的战争，才刚刚拉开帷幕。"
 DVA_pioneering_events.11.a:0 "真正的战争，还在后面"
 DVA_pioneering_start_reconquest:0 "收复失地"
 DVA_pioneering_start_reconquest_desc:0 "至冬南方领占据了拓荒者夺回的土地。召集拓荒者，发起收复战争——这将是一场有限战争：目标只有南方领占据的土地，180 天内见分晓。"
 DVA_pioneering_reconquest_mission:0 "收复失地"
 DVA_pioneering_reconquest_mission_desc:0 "在 180 天之内夺回南方领占据的全部土地。"
 DVA_pioneering_events.12.t:0 "失地收复"
 DVA_pioneering_events.12.desc:0 "拓荒者的旗帜重新插遍了北部的每一座山丘，至冬南方领的驻军被彻底逐出了这片土地。士兵们在风龙废墟的城墙上刻下了阵亡者的名字——这场仗，他们没有白打。"
 DVA_pioneering_events.12.a:0 "土地将记住我们"
 DVA_pioneering_events.13.t:0 "收复受挫"
 DVA_pioneering_events.13.desc:0 "一百八十天过去了，南方的战线依旧胶着。继续消耗下去只会让公社在两条战线上同时失血——与南方领的停战协定，在一片骂声中被签署了。"
 DVA_pioneering_events.13.a:0 "我们还会回来的"
 DVA_PIONEERING_RECONQUEST_VICTORY_TT:0 "收复全部失地，吞并至冬南方领，并消除其全部核心"
 DVA_PIONEERING_RECONQUEST_FAILED_TT:0 "与南方领停战，拓荒战争夺取的土地归南方领所有"
 DVA_pioneering_invasion_mission:0 "至冬的注视"
 DVA_pioneering_invasion_mission_desc:0 "南方领的至冬驻军正在等待命令。倒计时结束后，「女士」将率军南下。每控制一个丘丘人占据的州，就可以拖延一次登陆。"
 DVA_pioneering_invasion_extension_mission:0 "至冬的注视（续期）"
 DVA_pioneering_invasion_extension_mission_desc:0 "拓荒者的推进迫使至冬推迟了登陆命令。倒计时结束后若再无缓期，「女士」将率军南下。"
 DVA_pioneering_extend_invasion:0 "拖延登陆命令"
 DVA_pioneering_extend_invasion_desc:0 "我们每控制一处丘丘人的土地，至冬的登陆命令就得多犹豫一天。每控制一个新的丘丘人州，即可将登陆倒计时延长 25 天。"
 DVA_PIONEERING_NEW_STATE_TT:0 "我们控制着尚未清算的丘丘人州"
