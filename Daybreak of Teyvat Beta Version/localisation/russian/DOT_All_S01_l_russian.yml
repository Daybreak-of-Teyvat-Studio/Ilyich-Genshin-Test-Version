Teyvat_News.30.t:0 "Мондштадт празднует Праздник Волана"
Teyvat_News.30.d:0 "Когда Мондштадт был ещё маленькой деревней, Барбатос бросил перо птицы, символизирующее свободу. На месте, куда упало перо, позже был основан город. С тех пор люди каждый год отмечают этот праздник. Около 1000 лет назад аристократы изменили правила: они отменили состязания и сами выбирали девушек для волана. Но это вызвало гнев бога. Барбатос явился как бард Венти и помог Веннессе освободить Мондштадт. С тех пор Праздник Волана снова стал народным праздником."
Teyvat_News.30.a:0 "С Праздником Волана!"


Teyvat_News.31.t:0 "Мондштадт празднует Праздник Ветра и Цветов"
Teyvat_News.31.d:0 "Праздник Ветра и Цветов — традиционный праздник свободы и любви. Люди дарят цветы тем, кого любят или уважают. Каждый год выбирают Звезду Праздника, которая дарит Барбатосу «Цветок Ветра». Но мнения о том, какой цветок является «Цветком Ветра», расходятся."
Teyvat_News.31.a:0 "С Праздником Ветра и Цветов!"


Teyvat_News.32.t:0 "Ли Юэ празднует Праздник Фонарей"
Teyvat_News.32.d:0 "Один из главных праздников Ли Юэ, когда зажигают тысячи фонарей. Это праздник в честь героев. Ночью запускают фонари, чтобы души героев нашли дорогу домой."
Teyvat_News.32.a:0 "С Праздником Фонарей"


Teyvat_News.33.t:0 "Инадзума празднует Фестиваль Цветов и Красок"
Teyvat_News.33.d:0 "Несмотря на войну, жители Инадзумы нашли время для праздника, организованного Великим Храмом Наруками."
Teyvat_News.33.a:0 "С Фестивалем Цветов и Красок"


Teyvat_News.34.t:0 "Ли Юэ празднует Праздник Луны"
Teyvat_News.34.d:0 "Праздник Луны возник из обычая бессмертных. Люди собираются в красивые лунные ночи, чтобы отпраздновать воссоединение. Владыка Камня объединил несколько праздников в один."
Teyvat_News.34.a:0 "С Праздником Луны"

Teyvat_News.35.t:0 "Сумеру празднует Праздник Рождения Богини Цветов"
Teyvat_News.35.d:0 "Говорят, этот праздник возник, когда богини праздновали день рождения Древесной Владычицы. Богиня Цветов танцевала, и на месте её танца расцветали Падисары. Теперь празднуют день рождения Малой Богини Древа. После её возвращения праздник постепенно забыли."
Teyvat_News.35.a:0 "С Праздником Рождения Богини Цветов"

Teyvat_News.36.t:0 "Мондштадт празднует Праздник Возвращения Ветра и Вина"



 

