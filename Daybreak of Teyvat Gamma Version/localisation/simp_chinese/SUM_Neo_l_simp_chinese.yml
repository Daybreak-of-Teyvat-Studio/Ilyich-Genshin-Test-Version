 SUM_Neo_SGD_Combo_BH:"旅团当国"
 SUM_Neo_SGD_Combo_BH_desc:"旅团与部族的枪杆压过旧名，契约与公议说了算。"

 #### 新闻 ####
 SUM_Neo_SGD_News.1.t:"沙漠的税册"
 SUM_Neo_SGD_News.1.d:"教令院把新的税册送到镀金沙漠，名目比去年多了一栏。城门口围了不少人，看完就散了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGD_News.1.a:"阅"
 SUM_Neo_SGD_News.2.t:"镀金旅团的价目"
 SUM_Neo_SGD_News.2.d:"镀金旅团开出了新的价目，谁出的摩拉多，刀就朝谁转。沙漠里的商队连夜改道。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGD_News.2.a:"阅"
 SUM_Neo_SGD_News.3.t:"沙下的石板"
 SUM_Neo_SGD_News.3.d:"有商队从遗迹带出一块石板，官署说是赃物，要没收。石板进了库房，再没出来过。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SGD_News.3.a:"阅"
 SUM_Neo_SGD_News.4.t:"绿洲的渠"
 SUM_Neo_SGD_News.4.d:"沙漠几座城邦合力开渠引水，水到了城根。渠边站满了看水的人，谁也不肯先回去。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SGD_News.4.a:"阅"
 SUM_Neo_SGD_News.5.t:"旗在城头"
 SUM_Neo_SGD_News.5.d:"红底飞鸟旗升上了镀金沙漠的城头。往日收税的官署大门关着，门口坐着念盟约的长老。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SGD_News.5.a:"阅"
 SUM_Neo_SGD_News.6.t:"东去的驼队"
 SUM_Neo_SGD_News.6.d:"沙漠的驼队不再往雨林送贡，改道去了港口。教令院的关卡空了一半。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SGD_News.6.a:"阅"
 SUM_Neo_SGD_News.7.t:"王座重光"
 SUM_Neo_SGD_News.7.d:"旧王城的遗址上新垒起高台，沙漠立起了自己的王。台下是按号站好的军。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SGD_News.7.a:"阅"
 SUM_Neo_SGD_News.8.t:"长老的账本"
 SUM_Neo_SGD_News.8.d:"沙漠的长老把各族旧誓抄在一处，念给各城听。念到一半，风把纸吹走了一张。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGD_News.8.a:"阅"
 SUM_Neo_SGD_News.9.t:"关隘易手"
 SUM_Neo_SGD_News.9.d:"雨林伸进沙漠的第一道关隘易了手。关墙没推倒，只是换了守的人和旗。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGD_News.9.a:"阅"
 SUM_Neo_SGD_News.10.t:"兵向雨林"
 SUM_Neo_SGD_News.10.d:"沙漠的军队离开绿洲往东去。随军的向导说，再走十天就能望见须弥城的尖塔。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SGD_News.10.a:"阅"
 #################### 哈德拉玛维特 ####################
 #### 序章 · 主母的权柄 ####
 SUM_SDH_PRO_The_Matriarchs_Hold:"主母的权柄"
 SUM_SDH_PRO_The_Matriarchs_Hold_desc:"哈德拉玛维特的规矩由主母定：谁能进哪座城、谁能拜哪座龛、商队的货该分几成，都听主母一句话。雨林发来的敕令贴在城门上，主母不点头，风就把纸刮走了。"
 SUM_Neo_SDH.1.t:"主母的权柄"
 SUM_Neo_SDH.1.d:"哈德拉玛维特的规矩由主母定：谁能进哪座城、谁能拜哪座龛、商队的货该分几成，都听主母一句话。雨林发来的敕令贴在城门上，主母不点头，风就把纸刮走了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SDH.1.a:"循教令院发下的旧例"
 SUM_Neo_SDH.1.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Matriarch_Word:"主母的话"
 SUM_SDH_PRO_Matriarch_Word_desc:"主母坐在厅里发话，话不多，可每一句都有人抄下来。抄下来的是规矩，不是意见。"
 SUM_Neo_SDH.2.t:"主母的话"
 SUM_Neo_SDH.2.d:"主母坐在厅里发话，话不多，可每一句都有人抄下来。抄下来的是规矩，不是意见。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SDH.2.a:"把账目封存"
 SUM_Neo_SDH.2.b:"把账目摊开"
 SUM_SDH_PRO_Babel_Line:"芭别尔的血脉"
 SUM_SDH_PRO_Babel_Line_desc:"现任主母的名字来自母亲，母亲的名字来自上一任。这条线拉得很长，拉得人不敢深问。"
 SUM_Neo_SDH.3.t:"芭别尔的血脉"
 SUM_Neo_SDH.3.d:"现任主母的名字来自母亲，母亲的名字来自上一任。这条线拉得很长，拉得人不敢深问。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SDH.3.a:"按官署的判断行事"
 SUM_Neo_SDH.3.b:"按自己的判断行事"
 SUM_SDH_PRO_Tribe_Council:"部族的座次"
 SUM_SDH_PRO_Tribe_Council_desc:"各支部族的座次离主母越近，分到的水就越多。座次每年重排，排一次吵一次。"
 SUM_Neo_SDH.4.t:"部族的座次"
 SUM_Neo_SDH.4.d:"各支部族的座次离主母越近，分到的水就越多。座次每年重排，排一次吵一次。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SDH.4.a:"先看住脚下的城"
 SUM_Neo_SDH.4.b:"先看住远方的人"
 SUM_SDH_PRO_Silent_Law:"不落文字的规矩"
 SUM_SDH_PRO_Silent_Law_desc:"主母的规矩大多不落文字，靠人传人。传的人多一句少一句，规矩就变了样。"
 SUM_Neo_SDH.5.t:"不落文字的规矩"
 SUM_Neo_SDH.5.d:"主母的规矩大多不落文字，靠人传人。传的人多一句少一句，规矩就变了样。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SDH.5.a:"循教令院发下的旧例"
 SUM_Neo_SDH.5.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Oath_Mistress:"誓于主母"
 SUM_SDH_PRO_Oath_Mistress_desc:"入部的人要在主母面前立誓，誓词照花神的名。立了誓的，翻脸就是渎神。"
 SUM_Neo_SDH.6.t:"誓于主母"
 SUM_Neo_SDH.6.d:"入部的人要在主母面前立誓，誓词照花神的名。立了誓的，翻脸就是渎神。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SDH.6.a:"把账目封存"
 SUM_Neo_SDH.6.b:"把账目摊开"
 SUM_SDH_PRO_Edict_Wall:"城门上的敕令"
 SUM_SDH_PRO_Edict_Wall_desc:"敕令贴在城门上，管的是赋税与驻军。看的人多，照办的人少。"
 SUM_Neo_SDH.7.t:"城门上的敕令"
 SUM_Neo_SDH.7.d:"敕令贴在城门上，管的是赋税与驻军。看的人多，照办的人少。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SDH.7.a:"按官署的判断行事"
 SUM_Neo_SDH.7.b:"按自己的判断行事"
 SUM_SDH_PRO_Tax_Officer:"教令院的税吏"
 SUM_SDH_PRO_Tax_Officer_desc:"税吏带着账本来收账，账本比人高。主母请他喝茶，账目就短了一截。"
 SUM_Neo_SDH.8.t:"教令院的税吏"
 SUM_Neo_SDH.8.d:"税吏带着账本来收账，账本比人高。主母请他喝茶，账目就短了一截。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SDH.8.a:"先看住脚下的城"
 SUM_Neo_SDH.8.b:"先看住远方的人"
 SUM_SDH_PRO_Forest_Guard:"雨林的戍卒"
 SUM_SDH_PRO_Forest_Guard_desc:"雨林在几处要道设了戍所，戍卒认不得路，出门得雇本地人带。"
 SUM_Neo_SDH.9.t:"雨林的戍卒"
 SUM_Neo_SDH.9.d:"雨林在几处要道设了戍所，戍卒认不得路，出门得雇本地人带。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.9.a:"循教令院发下的旧例"
 SUM_Neo_SDH.9.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Survey_Team:"测绘队"
 SUM_SDH_PRO_Survey_Team_desc:"测绘队画了三年地图，把几处水源标错了位置。主母没有更正。"
 SUM_Neo_SDH.10.t:"测绘队"
 SUM_Neo_SDH.10.d:"测绘队画了三年地图，把几处水源标错了位置。主母没有更正。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SDH.10.a:"把账目封存"
 SUM_Neo_SDH.10.b:"把账目摊开"
 SUM_SDH_PRO_Hidden_Accounts:"另一本账"
 SUM_SDH_PRO_Hidden_Accounts_desc:"主母另有一本账，记的是替各部藏下的粮与钱。这本账不给人看。"
 SUM_Neo_SDH.11.t:"另一本账"
 SUM_Neo_SDH.11.d:"主母另有一本账，记的是替各部藏下的粮与钱。这本账不给人看。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.11.a:"按官署的判断行事"
 SUM_Neo_SDH.11.b:"按自己的判断行事"
 SUM_SDH_PRO_Daughter_Floral:"花神的女儿"
 SUM_SDH_PRO_Daughter_Floral_desc:"历代主母都自称花神的女儿，信众也这么叫。这个名分比刀好用。"
 SUM_Neo_SDH.12.t:"花神的女儿"
 SUM_Neo_SDH.12.d:"历代主母都自称花神的女儿，信众也这么叫。这个名分比刀好用。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SDH.12.a:"先看住脚下的城"
 SUM_Neo_SDH.12.b:"先看住远方的人"
 SUM_SDH_PRO_Floral_Fete:"花神诞祭"
 SUM_SDH_PRO_Floral_Fete_desc:"诞祭在几处绿洲同时办，香火与歌乐连着七夜，来的人比往年多。"
 SUM_Neo_SDH.13.t:"花神诞祭"
 SUM_Neo_SDH.13.d:"诞祭在几处绿洲同时办，香火与歌乐连着七夜，来的人比往年多。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。香灰到天亮还是热的。"
 SUM_Neo_SDH.13.a:"循教令院发下的旧例"
 SUM_Neo_SDH.13.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Shrine_Village:"村头的龛"
 SUM_SDH_PRO_Shrine_Village_desc:"各村在村头立一处小小的龛，龛前不设官，只设一个照看的老人。"
 SUM_Neo_SDH.14.t:"村头的龛"
 SUM_Neo_SDH.14.d:"各村在村头立一处小小的龛，龛前不设官，只设一个照看的老人。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SDH.14.a:"把账目封存"
 SUM_Neo_SDH.14.b:"把账目摊开"
 SUM_SDH_PRO_Pilgrim_Path:"朝圣的小路"
 SUM_SDH_PRO_Pilgrim_Path_desc:"去绿洲朝圣的小路有人打理，路上遇人结伴，遇风躲沟。"
 SUM_Neo_SDH.15.t:"朝圣的小路"
 SUM_Neo_SDH.15.d:"去绿洲朝圣的小路有人打理，路上遇人结伴，遇风躲沟。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SDH.15.a:"按官署的判断行事"
 SUM_Neo_SDH.15.b:"按自己的判断行事"
 SUM_SDH_PRO_Floral_Way:"花神之道"
 SUM_SDH_PRO_Floral_Way_desc:"信众把花神的旧诗编成歌，在田间、在驼背上、在火边传唱。"
 SUM_Neo_SDH.16.t:"花神之道"
 SUM_Neo_SDH.16.d:"信众把花神的旧诗编成歌，在田间、在驼背上、在火边传唱。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SDH.16.a:"先看住脚下的城"
 SUM_Neo_SDH.16.b:"先看住远方的人"
 SUM_SDH_PRO_Storm_Season:"沙暴季"
 SUM_SDH_PRO_Storm_Season_desc:"一年里有三个月刮风，风起时商队停摆，城与城之间断了往来。"
 SUM_Neo_SDH.17.t:"沙暴季"
 SUM_Neo_SDH.17.d:"一年里有三个月刮风，风起时商队停摆，城与城之间断了往来。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH.17.a:"循教令院发下的旧例"
 SUM_Neo_SDH.17.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Caravan_Toll:"商队的分成"
 SUM_SDH_PRO_Caravan_Toll_desc:"过境的商队要留一成货给主母。留下一成，等于买了平安。"
 SUM_Neo_SDH.18.t:"商队的分成"
 SUM_Neo_SDH.18.d:"过境的商队要留一成货给主母。留下一成，等于买了平安。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SDH.18.a:"把账目封存"
 SUM_Neo_SDH.18.b:"把账目摊开"
 SUM_SDH_PRO_Guide_Storm:"识风的人"
 SUM_SDH_PRO_Guide_Storm_desc:"有人能看云识风，比看星准。这样的人在沙漠里比金子贵。"
 SUM_Neo_SDH.19.t:"识风的人"
 SUM_Neo_SDH.19.d:"有人能看云识风，比看星准。这样的人在沙漠里比金子贵。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SDH.19.a:"按官署的判断行事"
 SUM_Neo_SDH.19.b:"按自己的判断行事"
 SUM_SDH_PRO_Salt_Road:"运盐的路"
 SUM_SDH_PRO_Salt_Road_desc:"盐从北边的盐场运来，路上要过三道卡。过了三道卡，盐价翻了三倍。"
 SUM_Neo_SDH.20.t:"运盐的路"
 SUM_Neo_SDH.20.d:"盐从北边的盐场运来，路上要过三道卡。过了三道卡，盐价翻了三倍。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SDH.20.a:"先看住脚下的城"
 SUM_Neo_SDH.20.b:"先看住远方的人"
 SUM_SDH_PRO_Merc_Contract:"雇请佣兵"
 SUM_SDH_PRO_Merc_Contract_desc:"主母不养常备军，遇到事就雇。雇来的兵认钱，不认神。"
 SUM_Neo_SDH.21.t:"雇请佣兵"
 SUM_Neo_SDH.21.d:"主母不养常备军，遇到事就雇。雇来的兵认钱，不认神。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SDH.21.a:"循教令院发下的旧例"
 SUM_Neo_SDH.21.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Thousand_Ravine:"千壑沙地"
 SUM_SDH_PRO_Thousand_Ravine_desc:"沙地深处沟壑纵横，外人进去多半出不来。本地人进去，是为了躲人。"
 SUM_Neo_SDH.22.t:"千壑沙地"
 SUM_Neo_SDH.22.d:"沙地深处沟壑纵横，外人进去多半出不来。本地人进去，是为了躲人。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SDH.22.a:"把账目封存"
 SUM_Neo_SDH.22.b:"把账目摊开"
 SUM_SDH_PRO_Hidden_Well:"暗井"
 SUM_SDH_PRO_Hidden_Well_desc:"沙地里藏着几口不标在图上井，是各部留给自己人的后路。"
 SUM_Neo_SDH.23.t:"暗井"
 SUM_Neo_SDH.23.d:"沙地里藏着几口不标在图上井，是各部留给自己人的后路。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SDH.23.a:"按官署的判断行事"
 SUM_Neo_SDH.23.b:"按自己的判断行事"
 SUM_SDH_PRO_Storm_Camp:"风中的营地"
 SUM_SDH_PRO_Storm_Camp_desc:"营地在沟壑背风的一面，风再大也掀不翻。这样的营地有几十处。"
 SUM_Neo_SDH.24.t:"风中的营地"
 SUM_Neo_SDH.24.d:"营地在沟壑背风的一面，风再大也掀不翻。这样的营地有几十处。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。"
 SUM_Neo_SDH.24.a:"先看住脚下的城"
 SUM_Neo_SDH.24.b:"先看住远方的人"
 SUM_SDH_PRO_Beast_Cave:"兽径"
 SUM_SDH_PRO_Beast_Cave_desc:"沟底的兽径没人愿意走，可急了的时候，走兽径最快。"
 SUM_Neo_SDH.25.t:"兽径"
 SUM_Neo_SDH.25.d:"沟底的兽径没人愿意走，可急了的时候，走兽径最快。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SDH.25.a:"循教令院发下的旧例"
 SUM_Neo_SDH.25.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Old_Fort:"沙下的旧堡"
 SUM_SDH_PRO_Old_Fort_desc:"旧堡是几十年前留下的，没人记得是谁修的。墙还在，人早没了。"
 SUM_Neo_SDH.26.t:"沙下的旧堡"
 SUM_Neo_SDH.26.d:"旧堡是几十年前留下的，没人记得是谁修的。墙还在，人早没了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.26.a:"把账目封存"
 SUM_Neo_SDH.26.b:"把账目摊开"
 SUM_SDH_PRO_Expedition:"探险队的名单"
 SUM_SDH_PRO_Expedition_desc:"有一支探险队出过沙漠，回来的人比去时少。名单上划掉的名字，没有人再提。"
 SUM_Neo_SDH.27.t:"探险队的名单"
 SUM_Neo_SDH.27.d:"有一支探险队出过沙漠，回来的人比去时少。名单上划掉的名字，没有人再提。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SDH.27.a:"按官署的判断行事"
 SUM_Neo_SDH.27.b:"按自己的判断行事"
 SUM_SDH_PRO_Samir_Line:"萨梅尔的图纸"
 SUM_SDH_PRO_Samir_Line_desc:"萨梅尔留过几张图纸，画的是遗迹的入口。图纸被主母收走，锁进了箱子。"
 SUM_Neo_SDH.28.t:"萨梅尔的图纸"
 SUM_Neo_SDH.28.d:"萨梅尔留过几张图纸，画的是遗迹的入口。图纸被主母收走，锁进了箱子。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SDH.28.a:"先看住脚下的城"
 SUM_Neo_SDH.28.b:"先看住远方的人"
 SUM_SDH_PRO_Key_Stone:"钥石"
 SUM_SDH_PRO_Key_Stone_desc:"探险队从遗迹里带回一块钥石，据说能开某一扇门。门在哪，没人知道。"
 SUM_Neo_SDH.29.t:"钥石"
 SUM_Neo_SDH.29.d:"探险队从遗迹里带回一块钥石，据说能开某一扇门。门在哪，没人知道。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。钥石收在箱底，上了锁。"
 SUM_Neo_SDH.29.a:"循教令院发下的旧例"
 SUM_Neo_SDH.29.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Tribal_Wreck:"流亡的小部"
 SUM_SDH_PRO_Tribal_Wreck_desc:"有一支小部族从大族里出走，在沙地深处自立。主母提起他们时，只说两个字。"
 SUM_Neo_SDH.30.t:"流亡的小部"
 SUM_Neo_SDH.30.d:"有一支小部族从大族里出走，在沙地深处自立。主母提起他们时，只说两个字。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SDH.30.a:"把账目封存"
 SUM_Neo_SDH.30.b:"把账目摊开"
 SUM_SDH_PRO_Dig_Ghost:"掘墓的影子"
 SUM_SDH_PRO_Dig_Ghost_desc:"夜里有人打着火把去掘墓，天亮前把土填回原样。掘出了什么，只有他们自己知道。"
 SUM_Neo_SDH.31.t:"掘墓的影子"
 SUM_Neo_SDH.31.d:"夜里有人打着火把去掘墓，天亮前把土填回原样。掘出了什么，只有他们自己知道。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SDH.31.a:"按官署的判断行事"
 SUM_Neo_SDH.31.b:"按自己的判断行事"

 #### 独立之路 ####
 SUM_SDH_IND_Breaking_the_Edict:"断敕"
 SUM_SDH_IND_Breaking_the_Edict_desc:"哈德拉玛维特要独立，先得解决一件内里的事：主母的权柄来自神，也来自雨林的默许。把敕令撕掉容易，把主母的根基从雨林那边拔出来，才是难处。"
 SUM_Neo_SDH.32.t:"断敕"
 SUM_Neo_SDH.32.d:"哈德拉玛维特要独立，先得解决一件内里的事：主母的权柄来自神，也来自雨林的默许。把敕令撕掉容易，把主母的根基从雨林那边拔出来，才是难处。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SDH.32.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.32.b:"把盟约收进箱底"
 SUM_SDH_IND_Envoy_Tribes:"走访各部"
 SUM_SDH_IND_Envoy_Tribes_desc:"主母派亲信走遍各部，带的是雨林欠各部的账。"
 SUM_Neo_SDH.33.t:"走访各部"
 SUM_Neo_SDH.33.d:"主母派亲信走遍各部，带的是雨林欠各部的账。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SDH.33.a:"召集部族共商"
 SUM_Neo_SDH.33.b:"等官署先松口"
 SUM_SDH_IND_Council_Tent:"帐中议事"
 SUM_SDH_IND_Council_Tent_desc:"几十顶帐子围成一圈，议事的时候谁也不肯先进中间那顶。"
 SUM_Neo_SDH.34.t:"帐中议事"
 SUM_Neo_SDH.34.d:"几十顶帐子围成一圈，议事的时候谁也不肯先进中间那顶。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SDH.34.a:"备好兵与粮"
 SUM_Neo_SDH.34.b:"多派几趟使节"
 SUM_SDH_IND_Blood_Bond:"血盟"
 SUM_SDH_IND_Blood_Bond_desc:"立盟要当着花神的面放血。放了血的部族，从此算是一家人。"
 SUM_Neo_SDH.35.t:"血盟"
 SUM_Neo_SDH.35.d:"立盟要当着花神的面放血。放了血的部族，从此算是一家人。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SDH.35.a:"把旗立起来"
 SUM_Neo_SDH.35.b:"把旗先卷起来"
 SUM_SDH_IND_Exiles_Back:"召回流亡的小部"
 SUM_SDH_IND_Exiles_Back_desc:"当年出走的小部被召回，条件是过去的账一笔勾销。回是回来了，人心还在察。"
 SUM_Neo_SDH.36.t:"召回流亡的小部"
 SUM_Neo_SDH.36.d:"当年出走的小部被召回，条件是过去的账一笔勾销。回是回来了，人心还在察。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SDH.36.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.36.b:"把盟约收进箱底"
 SUM_SDH_IND_Desert_Pact:"沙地之盟"
 SUM_SDH_IND_Desert_Pact_desc:"盟约写明：共守沙地、共分水源、共抗敕令。三条之外，谁也不管谁。"
 SUM_Neo_SDH.37.t:"沙地之盟"
 SUM_Neo_SDH.37.d:"盟约写明：共守沙地、共分水源、共抗敕令。三条之外，谁也不管谁。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SDH.37.a:"召集部族共商"
 SUM_Neo_SDH.37.b:"等官署先松口"
 SUM_SDH_IND_Route_Grip:"把控盐路"
 SUM_SDH_IND_Route_Grip_desc:"盐路是哈德拉玛维特的命脉，谁把住盐路，谁就说得上话。"
 SUM_Neo_SDH.38.t:"把控盐路"
 SUM_Neo_SDH.38.d:"盐路是哈德拉玛维特的命脉，谁把住盐路，谁就说得上话。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SDH.38.a:"备好兵与粮"
 SUM_Neo_SDH.38.b:"多派几趟使节"
 SUM_SDH_IND_Caravan_Pact:"商队盟约"
 SUM_SDH_IND_Caravan_Pact_desc:"过境的商队与主母立约：保平安，换分成。约立得明白，路上就太平。"
 SUM_Neo_SDH.39.t:"商队盟约"
 SUM_Neo_SDH.39.d:"过境的商队与主母立约：保平安，换分成。约立得明白，路上就太平。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH.39.a:"把旗立起来"
 SUM_Neo_SDH.39.b:"把旗先卷起来"
 SUM_SDH_IND_Toll_Chain:"设卡收税"
 SUM_SDH_IND_Toll_Chain_desc:"要道上设卡收税，税不进官署的账。"
 SUM_Neo_SDH.40.t:"设卡收税"
 SUM_Neo_SDH.40.d:"要道上设卡收税，税不进官署的账。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SDH.40.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.40.b:"把盟约收进箱底"
 SUM_SDH_IND_Mint_Sand:"沙中铸钱"
 SUM_SDH_IND_Mint_Sand_desc:"把商路上流通的钱换成本地所铸，成色写死在钱边。"
 SUM_Neo_SDH.41.t:"沙中铸钱"
 SUM_Neo_SDH.41.d:"把商路上流通的钱换成本地所铸，成色写死在钱边。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SDH.41.a:"召集部族共商"
 SUM_Neo_SDH.41.b:"等官署先松口"
 SUM_SDH_IND_Stockpile:"囤积盐粮"
 SUM_SDH_IND_Stockpile_desc:"盐与粮悄悄囤进沙地深处的暗仓。囤的是粮，也是底气。"
 SUM_Neo_SDH.42.t:"囤积盐粮"
 SUM_Neo_SDH.42.d:"盐与粮悄悄囤进沙地深处的暗仓。囤的是粮，也是底气。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SDH.42.a:"备好兵与粮"
 SUM_Neo_SDH.42.b:"多派几趟使节"
 SUM_SDH_IND_Shrine_Arms:"龛前的兵"
 SUM_SDH_IND_Shrine_Arms_desc:"把守护神龛的人编成一队，名义上是护法，手里是刀。"
 SUM_Neo_SDH.43.t:"龛前的兵"
 SUM_Neo_SDH.43.d:"把守护神龛的人编成一队，名义上是护法，手里是刀。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。"
 SUM_Neo_SDH.43.a:"把旗立起来"
 SUM_Neo_SDH.43.b:"把旗先卷起来"
 SUM_SDH_IND_Storm_Militia:"沙暴民兵"
 SUM_SDH_IND_Storm_Militia_desc:"各部的民兵按沟壑划片，风起时各守各的口子。"
 SUM_Neo_SDH.44.t:"沙暴民兵"
 SUM_Neo_SDH.44.d:"各部的民兵按沟壑划片，风起时各守各的口子。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SDH.44.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.44.b:"把盟约收进箱底"
 SUM_SDH_IND_Hire_Riders:"雇骑"
 SUM_SDH_IND_Hire_Riders_desc:"雇来的骑手用来打快仗，打完就走，不管守土。"
 SUM_Neo_SDH.45.t:"雇骑"
 SUM_Neo_SDH.45.d:"雇来的骑手用来打快仗，打完就走，不管守土。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SDH.45.a:"召集部族共商"
 SUM_Neo_SDH.45.b:"等官署先松口"
 SUM_SDH_IND_Storm_Drill:"借风操演"
 SUM_SDH_IND_Storm_Drill_desc:"操演专挑风天，练的是辨向与结阵。练熟的队伍，风越大越稳。"
 SUM_Neo_SDH.46.t:"借风操演"
 SUM_Neo_SDH.46.d:"操演专挑风天，练的是辨向与结阵。练熟的队伍，风越大越稳。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。"
 SUM_Neo_SDH.46.a:"备好兵与粮"
 SUM_Neo_SDH.46.b:"多派几趟使节"
 SUM_SDH_IND_Silent_Arm:"暗中的手"
 SUM_SDH_IND_Silent_Arm_desc:"有几支不挂旗的小队，专办事不留言。主母说，这样的手得备着。"
 SUM_Neo_SDH.47.t:"暗中的手"
 SUM_Neo_SDH.47.d:"有几支不挂旗的小队，专办事不留言。主母说，这样的手得备着。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SDH.47.a:"把旗立起来"
 SUM_Neo_SDH.47.b:"把旗先卷起来"
 SUM_SDH_IND_Proclaim_Edict:"沙漠的告示"
 SUM_SDH_IND_Proclaim_Edict_desc:"告示用本地文字写，贴在各城门外。认得的人念给不认得的听，念完就开始议论。"
 SUM_Neo_SDH.48.t:"沙漠的告示"
 SUM_Neo_SDH.48.d:"告示用本地文字写，贴在各城门外。认得的人念给不认得的听，念完就开始议论。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。告示被风撕去了一角。"
 SUM_Neo_SDH.48.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.48.b:"把盟约收进箱底"
 SUM_SDH_IND_Raise_Banner:"举旗"
 SUM_SDH_IND_Raise_Banner_desc:"哈德拉玛维特立起自己的旗，旗上是花神与沙丘的纹样。"
 SUM_Neo_SDH.49.t:"举旗"
 SUM_Neo_SDH.49.d:"哈德拉玛维特立起自己的旗，旗上是花神与沙丘的纹样。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SDH.49.a:"召集部族共商"
 SUM_Neo_SDH.49.b:"等官署先松口"
 SUM_SDH_IND_Reject_Suzerain:"拒受敕令"
 SUM_SDH_IND_Reject_Suzerain_desc:"当着使节的面把敕令烧了。烧的时候风正好大，灰吹了使节一身。"
 SUM_Neo_SDH.50.t:"拒受敕令"
 SUM_Neo_SDH.50.d:"当着使节的面把敕令烧了。烧的时候风正好大，灰吹了使节一身。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SDH.50.a:"备好兵与粮"
 SUM_Neo_SDH.50.b:"多派几趟使节"
 SUM_SDH_IND_Redraw_Border:"重划地界"
 SUM_SDH_IND_Redraw_Border_desc:"地界照着水源与牧道重划，把雨林设的界碑挪开。"
 SUM_Neo_SDH.51.t:"重划地界"
 SUM_Neo_SDH.51.d:"地界照着水源与牧道重划，把雨林设的界碑挪开。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SDH.51.a:"把旗立起来"
 SUM_Neo_SDH.51.b:"把旗先卷起来"
 SUM_SDH_IND_Final_Word:"主母的最后一句"
 SUM_SDH_IND_Final_Word_desc:"主母当着各部代表的面说：从今往后，哈德拉玛维特的规矩由哈德拉玛维特人自己定。"
 SUM_Neo_SDH.52.t:"主母的最后一句"
 SUM_Neo_SDH.52.d:"主母当着各部代表的面说：从今往后，哈德拉玛维特的规矩由哈德拉玛维特人自己定。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SDH.52.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.52.b:"把盟约收进箱底"
 SUM_SDH_IND_Envoy_Port:"港口来客"
 SUM_SDH_IND_Envoy_Port_desc:"港口的客商带来船与价，开口就问：沙地的盐走不走海路。"
 SUM_Neo_SDH.53.t:"港口来客"
 SUM_Neo_SDH.53.d:"港口的客商带来船与价，开口就问：沙地的盐走不走海路。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.53.a:"召集部族共商"
 SUM_Neo_SDH.53.b:"等官署先松口"
 SUM_SDH_IND_Envoy_North:"北国使团"
 SUM_SDH_IND_Envoy_North_desc:"北国的使团最舍得花钱，也最不肯说明白钱要换什么。"
 SUM_Neo_SDH.54.t:"北国使团"
 SUM_Neo_SDH.54.d:"北国的使团最舍得花钱，也最不肯说明白钱要换什么。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SDH.54.a:"备好兵与粮"
 SUM_Neo_SDH.54.b:"多派几趟使节"
 SUM_SDH_IND_Envoy_Rain:"雨林的门"
 SUM_SDH_IND_Envoy_Rain_desc:"对雨林留一扇门，派去的人带着盐约，也带着账。"
 SUM_Neo_SDH.55.t:"雨林的门"
 SUM_Neo_SDH.55.d:"对雨林留一扇门，派去的人带着盐约，也带着账。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SDH.55.a:"把旗立起来"
 SUM_Neo_SDH.55.b:"把旗先卷起来"
 SUM_SDH_IND_Buy_Iron:"购置军械"
 SUM_SDH_IND_Buy_Iron_desc:"向外邦买铁与火，价钱用沙地的盐与驼来抵。"
 SUM_Neo_SDH.56.t:"购置军械"
 SUM_Neo_SDH.56.d:"向外邦买铁与火，价钱用沙地的盐与驼来抵。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SDH.56.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.56.b:"把盟约收进箱底"
 SUM_SDH_IND_Spy_Forest:"遣人间谍"
 SUM_SDH_IND_Spy_Forest_desc:"往雨林派几个人，学的是一样东西：教令院在沙地还有多少只脚。"
 SUM_Neo_SDH.57.t:"遣人间谍"
 SUM_Neo_SDH.57.d:"往雨林派几个人，学的是一样东西：教令院在沙地还有多少只脚。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SDH.57.a:"召集部族共商"
 SUM_Neo_SDH.57.b:"等官署先松口"
 SUM_SDH_IND_Declaration:"哈德拉玛维特宣布独立"
 SUM_SDH_IND_Declaration_desc:"主母把敕令摊在火上，纸卷起来，烧到底才断。各部代表围成一圈，看着那点火灭掉，谁也没有说话。城外的雨林戍卒当夜撤了两处，剩下的关上堡门，不再出来换水。"
 SUM_Neo_SDH.58.t:"哈德拉玛维特宣布独立"
 SUM_Neo_SDH.58.d:"主母把敕令摊在火上，纸卷起来，烧到底才断。各部代表围成一圈，看着那点火灭掉，谁也没有说话。城外的雨林戍卒当夜撤了两处，剩下的关上堡门，不再出来换水。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH.58.a:"备好兵与粮"
 SUM_Neo_SDH.58.b:"多派几趟使节"

 #### 甲线 · 花神圣战 ####
 SUM_SDH_RA_The_Floral_Crusade:"花神之旗"
 SUM_SDH_RA_The_Floral_Crusade_desc:"哈德拉玛维特的主母世代自称花神的女儿，信众遍布各部。有人主张把这份信仰从权柄里请出来，让它成为沙漠自己的旗帜。"
 SUM_Neo_SDH.59.t:"花神之旗"
 SUM_Neo_SDH.59.d:"哈德拉玛维特的主母世代自称花神的女儿，信众遍布各部。有人主张把这份信仰从权柄里请出来，让它成为沙漠自己的旗帜。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。旗子挂在城楼上，没风也响。"
 SUM_Neo_SDH.59.a:"让商路连通四方"
 SUM_Neo_SDH.59.b:"把商路关起来自守"
 SUM_SDH_RA_Grand_Fete:"大诞祭"
 SUM_SDH_RA_Grand_Fete_desc:"花神诞祭办遍各城，香火与歌乐连着七夜。办祭的钱由各家凑，账目公开。"
 SUM_Neo_SDH.60.t:"大诞祭"
 SUM_Neo_SDH.60.d:"花神诞祭办遍各城，香火与歌乐连着七夜。办祭的钱由各家凑，账目公开。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SDH.60.a:"以契约立信"
 SUM_Neo_SDH.60.b:"以枪杆立威"
 SUM_SDH_RA_Shrine_All:"遍立神龛"
 SUM_SDH_RA_Shrine_All_desc:"在每座城的入口立一处花神的龛。龛前不设官，只设一个照看的人。"
 SUM_Neo_SDH.61.t:"遍立神龛"
 SUM_Neo_SDH.61.d:"在每座城的入口立一处花神的龛。龛前不设官，只设一个照看的人。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH.61.a:"把利润分给城邦"
 SUM_Neo_SDH.61.b:"把利润收归官库"
 SUM_SDH_RA_Pilgrim_Guild:"香客行会"
 SUM_SDH_RA_Pilgrim_Guild_desc:"香客自组行会，管路上的食宿与安全。行会不收香火钱。"
 SUM_Neo_SDH.62.t:"香客行会"
 SUM_Neo_SDH.62.d:"香客自组行会，管路上的食宿与安全。行会不收香火钱。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SDH.62.a:"借水草养人"
 SUM_Neo_SDH.62.b:"借商队养兵"
 SUM_SDH_RA_Floral_Choir:"花神合唱"
 SUM_SDH_RA_Floral_Choir_desc:"各村各城都有合唱的班，唱的是花神的旧诗。唱的人不分部族。"
 SUM_Neo_SDH.63.t:"花神合唱"
 SUM_Neo_SDH.63.d:"各村各城都有合唱的班，唱的是花神的旧诗。唱的人不分部族。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SDH.63.a:"让商路连通四方"
 SUM_Neo_SDH.63.b:"把商路关起来自守"
 SUM_SDH_RA_Priest_Common:"公推祭司"
 SUM_SDH_RA_Priest_Common_desc:"祭司由信众公推，不由主母指派。这一条抽掉了主母的一半根基。"
 SUM_Neo_SDH.64.t:"公推祭司"
 SUM_Neo_SDH.64.d:"祭司由信众公推，不由主母指派。这一条抽掉了主母的一半根基。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH.64.a:"以契约立信"
 SUM_Neo_SDH.64.b:"以枪杆立威"
 SUM_SDH_RA_Temple_Land:"神庙的田"
 SUM_SDH_RA_Temple_Land_desc:"拨给神庙一份田地，收成供祭与济贫。田是公的，谁也不能卖。"
 SUM_Neo_SDH.65.t:"神庙的田"
 SUM_Neo_SDH.65.d:"拨给神庙一份田地，收成供祭与济贫。田是公的，谁也不能卖。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SDH.65.a:"把利润分给城邦"
 SUM_Neo_SDH.65.b:"把利润收归官库"
 SUM_SDH_RA_Alms_House:"济贫所"
 SUM_SDH_RA_Alms_House_desc:"神庙办济贫所，收的是走投无路的人。收进来的人多，走的人少。"
 SUM_Neo_SDH.66.t:"济贫所"
 SUM_Neo_SDH.66.d:"神庙办济贫所，收的是走投无路的人。收进来的人多，走的人少。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SDH.66.a:"借水草养人"
 SUM_Neo_SDH.66.b:"借商队养兵"
 SUM_SDH_RA_Craft_Holy:"神工坊"
 SUM_SDH_RA_Craft_Holy_desc:"神庙的工坊做器物也做兵器，做出来的东西一半给祭礼，一半给护法队。"
 SUM_Neo_SDH.67.t:"神工坊"
 SUM_Neo_SDH.67.d:"神庙的工坊做器物也做兵器，做出来的东西一半给祭礼，一半给护法队。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SDH.67.a:"让商路连通四方"
 SUM_Neo_SDH.67.b:"把商路关起来自守"
 SUM_SDH_RA_Fair_Sacred:"圣市"
 SUM_SDH_RA_Fair_Sacred_desc:"祭期开圣市，三日之内不抽税。市一开，四方的人都来。"
 SUM_Neo_SDH.68.t:"圣市"
 SUM_Neo_SDH.68.d:"祭期开圣市，三日之内不抽税。市一开，四方的人都来。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SDH.68.a:"以契约立信"
 SUM_Neo_SDH.68.b:"以枪杆立威"
 SUM_SDH_RA_Granary_God:"神仓"
 SUM_SDH_RA_Granary_God_desc:"神庙设一座粮仓，丰年收，荒年放。放粮的规矩写在仓门上。"
 SUM_Neo_SDH.69.t:"神仓"
 SUM_Neo_SDH.69.d:"神庙设一座粮仓，丰年收，荒年放。放粮的规矩写在仓门上。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SDH.69.a:"把利润分给城邦"
 SUM_Neo_SDH.69.b:"把利润收归官库"
 SUM_SDH_RA_Tribe_Welcome:"纳新部"
 SUM_SDH_RA_Tribe_Welcome_desc:"凡愿归附的部族，不问旧事，只问肯不肯守共同的规矩。"
 SUM_Neo_SDH.70.t:"纳新部"
 SUM_Neo_SDH.70.d:"凡愿归附的部族，不问旧事，只问肯不肯守共同的规矩。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SDH.70.a:"借水草养人"
 SUM_Neo_SDH.70.b:"借商队养兵"
 SUM_SDH_RA_Elder_Vote:"长老公议"
 SUM_SDH_RA_Elder_Vote_desc:"各部长老定期公议，议的是水源与牧道。议定了就共同担保。"
 SUM_Neo_SDH.71.t:"长老公议"
 SUM_Neo_SDH.71.d:"各部长老定期公议，议的是水源与牧道。议定了就共同担保。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SDH.71.a:"让商路连通四方"
 SUM_Neo_SDH.71.b:"把商路关起来自守"
 SUM_SDH_RA_Bride_Alliance:"联姻结盟"
 SUM_SDH_RA_Bride_Alliance_desc:"族与族之间以联姻加固盟约，聘礼的账由神庙记下。"
 SUM_Neo_SDH.72.t:"联姻结盟"
 SUM_Neo_SDH.72.d:"族与族之间以联姻加固盟约，聘礼的账由神庙记下。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SDH.72.a:"以契约立信"
 SUM_Neo_SDH.72.b:"以枪杆立威"
 SUM_SDH_RA_Orphan_Care:"收养孤儿"
 SUM_SDH_RA_Orphan_Care_desc:"战乱留下的孤儿由神庙与各部共养，长大之后愿意从军的从军。"
 SUM_Neo_SDH.73.t:"收养孤儿"
 SUM_Neo_SDH.73.d:"战乱留下的孤儿由神庙与各部共养，长大之后愿意从军的从军。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SDH.73.a:"把利润分给城邦"
 SUM_Neo_SDH.73.b:"把利润收归官库"
 SUM_SDH_RA_Blood_End:"止仇"
 SUM_SDH_RA_Blood_End_desc:"有仇的两族在花神龛前和解，血债一笔勾销。和解的场面办得很热闹。"
 SUM_Neo_SDH.74.t:"止仇"
 SUM_Neo_SDH.74.d:"有仇的两族在花神龛前和解，血债一笔勾销。和解的场面办得很热闹。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SDH.74.a:"借水草养人"
 SUM_Neo_SDH.74.b:"借商队养兵"
 SUM_SDH_RA_Storm_Banner:"沙暴旗下"
 SUM_SDH_RA_Storm_Banner_desc:"选一批专打风天的人组军团，旗是灰的，风里看不见。"
 SUM_Neo_SDH.75.t:"沙暴旗下"
 SUM_Neo_SDH.75.d:"选一批专打风天的人组军团，旗是灰的，风里看不见。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SDH.75.a:"让商路连通四方"
 SUM_Neo_SDH.75.b:"把商路关起来自守"
 SUM_SDH_RA_Holy_Guard:"护法卫队"
 SUM_SDH_RA_Holy_Guard_desc:"护法卫队守神庙，也随军出征。他们打仗有两种做法：护和攻。"
 SUM_Neo_SDH.76.t:"护法卫队"
 SUM_Neo_SDH.76.d:"护法卫队守神庙，也随军出征。他们打仗有两种做法：护和攻。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SDH.76.a:"以契约立信"
 SUM_Neo_SDH.76.b:"以枪杆立威"
 SUM_SDH_RA_Camel_Holy:"圣驼骑"
 SUM_SDH_RA_Camel_Holy_desc:"圣驼骑的驼鞍上绣着花神的纹样，骑手都是各部子弟。"
 SUM_Neo_SDH.77.t:"圣驼骑"
 SUM_Neo_SDH.77.d:"圣驼骑的驼鞍上绣着花神的纹样，骑手都是各部子弟。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SDH.77.a:"把利润分给城邦"
 SUM_Neo_SDH.77.b:"把利润收归官库"
 SUM_SDH_RA_Scout_Storm:"风眼侦骑"
 SUM_SDH_RA_Scout_Storm_desc:"侦骑专走风眼，风眼里最静，能看清对面在做什么。"
 SUM_Neo_SDH.78.t:"风眼侦骑"
 SUM_Neo_SDH.78.d:"侦骑专走风眼，风眼里最静，能看清对面在做什么。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SDH.78.a:"借水草养人"
 SUM_Neo_SDH.78.b:"借商队养兵"
 SUM_SDH_RA_Field_Shrine:"随军神龛"
 SUM_SDH_RA_Field_Shrine_desc:"军中带着一座能拆装的神龛，扎营就立起来。立起来，人心就定。"
 SUM_Neo_SDH.79.t:"随军神龛"
 SUM_Neo_SDH.79.d:"军中带着一座能拆装的神龛，扎营就立起来。立起来，人心就定。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。"
 SUM_Neo_SDH.79.a:"让商路连通四方"
 SUM_Neo_SDH.79.b:"把商路关起来自守"
 SUM_SDH_RA_Sacred_Oasis:"圣所绿洲"
 SUM_SDH_RA_Sacred_Oasis_desc:"把几处绿洲立为圣所，许进不许占。占了圣所的，人人得而讨之。"
 SUM_Neo_SDH.80.t:"圣所绿洲"
 SUM_Neo_SDH.80.d:"把几处绿洲立为圣所，许进不许占。占了圣所的，人人得而讨之。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SDH.80.a:"以契约立信"
 SUM_Neo_SDH.80.b:"以枪杆立威"
 SUM_SDH_RA_Water_Gift:"分水之礼"
 SUM_SDH_RA_Water_Gift_desc:"圣所绿洲的水按口分给周围的村与牧户，不分部族。"
 SUM_Neo_SDH.81.t:"分水之礼"
 SUM_Neo_SDH.81.d:"圣所绿洲的水按口分给周围的村与牧户，不分部族。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SDH.81.a:"把利润分给城邦"
 SUM_Neo_SDH.81.b:"把利润收归官库"
 SUM_SDH_RA_Garden_Holy:"圣园"
 SUM_SDH_RA_Garden_Holy_desc:"在绿洲边开一座园子，种花也种粮。管园的人由信众轮值。"
 SUM_Neo_SDH.82.t:"圣园"
 SUM_Neo_SDH.82.d:"在绿洲边开一座园子，种花也种粮。管园的人由信众轮值。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SDH.82.a:"借水草养人"
 SUM_Neo_SDH.82.b:"借商队养兵"
 SUM_SDH_RA_Refuge_Sand:"沙中避难所"
 SUM_SDH_RA_Refuge_Sand_desc:"圣所兼作避难所，风灾战乱时开门收人。收多少人，管多少饭。"
 SUM_Neo_SDH.83.t:"沙中避难所"
 SUM_Neo_SDH.83.d:"圣所兼作避难所，风灾战乱时开门收人。收多少人，管多少饭。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SDH.83.a:"让商路连通四方"
 SUM_Neo_SDH.83.b:"把商路关起来自守"
 SUM_SDH_RA_Oasis_Guard:"守所人"
 SUM_SDH_RA_Oasis_Guard_desc:"守圣所的人不穿军装，可手里有刀。抢圣所的，从来没有好下场。"
 SUM_Neo_SDH.84.t:"守所人"
 SUM_Neo_SDH.84.d:"守圣所的人不穿军装，可手里有刀。抢圣所的，从来没有好下场。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SDH.84.a:"以契约立信"
 SUM_Neo_SDH.84.b:"以枪杆立威"
 SUM_SDH_RA_Crusade_Word:"宣言之辞"
 SUM_SDH_RA_Crusade_Word_desc:"对雨林的檄文用花神的名义写，说的却是赋税与水源的账。"
 SUM_Neo_SDH.85.t:"宣言之辞"
 SUM_Neo_SDH.85.d:"对雨林的檄文用花神的名义写，说的却是赋税与水源的账。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.85.a:"把利润分给城邦"
 SUM_Neo_SDH.85.b:"把利润收归官库"
 SUM_SDH_RA_March_Storm:"借风东进"
 SUM_SDH_RA_March_Storm_desc:"大军候着换季的风东进，风把足迹吹平，也把守军遮住。"
 SUM_Neo_SDH.86.t:"借风东进"
 SUM_Neo_SDH.86.d:"大军候着换季的风东进，风把足迹吹平，也把守军遮住。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SDH.86.a:"借水草养人"
 SUM_Neo_SDH.86.b:"借商队养兵"
 SUM_SDH_RA_Holy_Volunteer:"信众从军"
 SUM_SDH_RA_Holy_Volunteer_desc:"檄文一传，各部的青壮自带口粮来投。投的人数比估的多了一倍。"
 SUM_Neo_SDH.87.t:"信众从军"
 SUM_Neo_SDH.87.d:"檄文一传，各部的青壮自带口粮来投。投的人数比估的多了一倍。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。"
 SUM_Neo_SDH.87.a:"让商路连通四方"
 SUM_Neo_SDH.87.b:"把商路关起来自守"
 SUM_SDH_RA_Shrine_Front:"军前立龛"
 SUM_SDH_RA_Shrine_Front_desc:"在雨林边上立起一道军前的龛，敌军看了心乱，自己看了心定。"
 SUM_Neo_SDH.88.t:"军前立龛"
 SUM_Neo_SDH.88.d:"在雨林边上立起一道军前的龛，敌军看了心乱，自己看了心定。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SDH.88.a:"以契约立信"
 SUM_Neo_SDH.88.b:"以枪杆立威"
 SUM_SDH_RA_Terms_Holy:"最后的条件"
 SUM_SDH_RA_Terms_Holy_desc:"兵临关隘才提条件：撤戍、减贡、还水、认独立。四条缺一不可。"
 SUM_Neo_SDH.89.t:"最后的条件"
 SUM_Neo_SDH.89.d:"兵临关隘才提条件：撤戍、减贡、还水、认独立。四条缺一不可。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SDH.89.a:"把利润分给城邦"
 SUM_Neo_SDH.89.b:"把利润收归官库"
 SUM_SDH_RA_Floral_Kingdom:"花神之国"
 SUM_SDH_RA_Floral_Kingdom_desc:"花神的龛立遍了哈德拉玛维特，祭司由信众公推，绿洲的水按口分。主母的旧座还摆在厅里，只是那张座上的权威，如今挪到了每一处龛前。"
 SUM_Neo_SDH.90.t:"花神之国"
 SUM_Neo_SDH.90.d:"花神的龛立遍了哈德拉玛维特，祭司由信众公推，绿洲的水按口分。主母的旧座还摆在厅里，只是那张座上的权威，如今挪到了每一处龛前。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SDH.90.a:"借水草养人"
 SUM_Neo_SDH.90.b:"借商队养兵"

 #### 乙线 · 沙暴军国 ####
 SUM_SDH_RB_The_Storm_Regiment:"沙暴军团"
 SUM_SDH_RB_The_Storm_Regiment_desc:"另一条路认定沙漠吃的亏全在太散：部落散、水源散、兵也散。要不再吃亏，就得把哈德拉玛维特拧成一支能在风里不散的军。"
 SUM_Neo_SDH.91.t:"沙暴军团"
 SUM_Neo_SDH.91.d:"另一条路认定沙漠吃的亏全在太散：部落散、水源散、兵也散。要不再吃亏，就得把哈德拉玛维特拧成一支能在风里不散的军。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SDH.91.a:"把土地分给部族"
 SUM_Neo_SDH.91.b:"把土地归入官仓"
 SUM_SDH_RB_Standing_Army:"常备军"
 SUM_SDH_RB_Standing_Army_desc:"不再临时雇兵，改为常备。常备军的粮饷由盐路出。"
 SUM_Neo_SDH.92.t:"常备军"
 SUM_Neo_SDH.92.d:"不再临时雇兵，改为常备。常备军的粮饷由盐路出。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SDH.92.a:"推举公议的执事"
 SUM_Neo_SDH.92.b:"沿用旧日的长老"
 SUM_SDH_RB_War_School:"讲武堂"
 SUM_SDH_RB_War_School_desc:"讲武堂教的是沙战与风战，也教识字。军官会写字的，比不会的好用。"
 SUM_Neo_SDH.93.t:"讲武堂"
 SUM_Neo_SDH.93.d:"讲武堂教的是沙战与风战，也教识字。军官会写字的，比不会的好用。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SDH.93.a:"让花神的誓约作证"
 SUM_Neo_SDH.93.b:"让官署的法度作证"
 SUM_SDH_RB_Rank_Strict:"严明军阶"
 SUM_SDH_RB_Rank_Strict_desc:"军阶从上到下排得清楚，越级发令的军法处置。"
 SUM_Neo_SDH.94.t:"严明军阶"
 SUM_Neo_SDH.94.d:"军阶从上到下排得清楚，越级发令的军法处置。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。"
 SUM_Neo_SDH.94.a:"与雨林互通有无"
 SUM_Neo_SDH.94.b:"与雨林划清界限"
 SUM_SDH_RB_War_Levy:"战时征发"
 SUM_SDH_RB_War_Levy_desc:"战时按户征发，轮值半年。征发令一下，集市上的年轻人少了一半。"
 SUM_Neo_SDH.95.t:"战时征发"
 SUM_Neo_SDH.95.d:"战时按户征发，轮值半年。征发令一下，集市上的年轻人少了一半。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SDH.95.a:"把土地分给部族"
 SUM_Neo_SDH.95.b:"把土地归入官仓"
 SUM_SDH_RB_Order_All:"一切号令"
 SUM_SDH_RB_Order_All_desc:"把各部的兵、神的兵、雇的兵全编进来，号令一处出。编不进的就地解散。"
 SUM_Neo_SDH.96.t:"一切号令"
 SUM_Neo_SDH.96.d:"把各部的兵、神的兵、雇的兵全编进来，号令一处出。编不进的就地解散。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。"
 SUM_Neo_SDH.96.a:"推举公议的执事"
 SUM_Neo_SDH.96.b:"沿用旧日的长老"
 SUM_SDH_RB_Mechan_Ruin:"遗迹的构装"
 SUM_SDH_RB_Mechan_Ruin_desc:"从遗迹里拆出的构装能走能动，装上兵器就是一队不知疲倦的兵。"
 SUM_Neo_SDH.97.t:"遗迹的构装"
 SUM_Neo_SDH.97.d:"从遗迹里拆出的构装能走能动，装上兵器就是一队不知疲倦的兵。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SDH.97.a:"让花神的誓约作证"
 SUM_Neo_SDH.97.b:"让官署的法度作证"
 SUM_SDH_RB_Mechan_Works:"构装工坊"
 SUM_SDH_RB_Mechan_Works_desc:"专设工坊修补构装，工匠由外邦雇来，图纸锁在柜里。"
 SUM_Neo_SDH.98.t:"构装工坊"
 SUM_Neo_SDH.98.d:"专设工坊修补构装，工匠由外邦雇来，图纸锁在柜里。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SDH.98.a:"与雨林互通有无"
 SUM_Neo_SDH.98.b:"与雨林划清界限"
 SUM_SDH_RB_Mechan_Parts:"部件的来路"
 SUM_SDH_RB_Mechan_Parts_desc:"构装的部件只有遗迹里有，掘一处少一处。有人提议向雨林买。"
 SUM_Neo_SDH.99.t:"部件的来路"
 SUM_Neo_SDH.99.d:"构装的部件只有遗迹里有，掘一处少一处。有人提议向雨林买。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SDH.99.a:"把土地分给部族"
 SUM_Neo_SDH.99.b:"把土地归入官仓"
 SUM_SDH_RB_Doctor_Contract:"第二席的契约"
 SUM_SDH_RB_Doctor_Contract_desc:"有位外邦的学者愿意提供构装的核心，代价是要在沙地设一处试验场。"
 SUM_Neo_SDH.100.t:"第二席的契约"
 SUM_Neo_SDH.100.d:"有位外邦的学者愿意提供构装的核心，代价是要在沙地设一处试验场。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SDH.100.a:"推举公议的执事"
 SUM_Neo_SDH.100.b:"沿用旧日的长老"
 SUM_SDH_RB_Mechan_Army:"机械队伍"
 SUM_SDH_RB_Mechan_Army_desc:"第一支全部由构装组成的队伍在一次风夜里出动，回来时一个部件没少。"
 SUM_Neo_SDH.101.t:"机械队伍"
 SUM_Neo_SDH.101.d:"第一支全部由构装组成的队伍在一次风夜里出动，回来时一个部件没少。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。"
 SUM_Neo_SDH.101.a:"让花神的誓约作证"
 SUM_Neo_SDH.101.b:"让官署的法度作证"
 SUM_SDH_RB_Storm_Core:"风卫"
 SUM_SDH_RB_Storm_Core_desc:"风卫专打风天，平日驻在最深处的营地，不下城。"
 SUM_Neo_SDH.102.t:"风卫"
 SUM_Neo_SDH.102.d:"风卫专打风天，平日驻在最深处的营地，不下城。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SDH.102.a:"与雨林互通有无"
 SUM_Neo_SDH.102.b:"与雨林划清界限"
 SUM_SDH_RB_Storm_Scout:"风哨"
 SUM_SDH_RB_Storm_Scout_desc:"风哨认风比认路准，能在百里外报出哪一片要起沙。"
 SUM_Neo_SDH.103.t:"风哨"
 SUM_Neo_SDH.103.d:"风哨认风比认路准，能在百里外报出哪一片要起沙。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SDH.103.a:"把土地分给部族"
 SUM_Neo_SDH.103.b:"把土地归入官仓"
 SUM_SDH_RB_Storm_Camel:"风驼营"
 SUM_SDH_RB_Storm_Camel_desc:"风驼营的驼都不上铃，行军时听不见一点响。"
 SUM_Neo_SDH.104.t:"风驼营"
 SUM_Neo_SDH.104.d:"风驼营的驼都不上铃，行军时听不见一点响。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SDH.104.a:"推举公议的执事"
 SUM_Neo_SDH.104.b:"沿用旧日的长老"
 SUM_SDH_RB_Storm_Siege:"破关队"
 SUM_SDH_RB_Storm_Siege_desc:"破关队专攻雨林伸进沙漠的关隘，练的是从风里摸到墙根。"
 SUM_Neo_SDH.105.t:"破关队"
 SUM_Neo_SDH.105.d:"破关队专攻雨林伸进沙漠的关隘，练的是从风里摸到墙根。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SDH.105.a:"让花神的誓约作证"
 SUM_Neo_SDH.105.b:"让官署的法度作证"
 SUM_SDH_RB_Storm_Endure:"耐渴训练"
 SUM_SDH_RB_Storm_Endure_desc:"全军训耐渴，三日无水照走。练出来的队伍，补给能减三成。"
 SUM_Neo_SDH.106.t:"耐渴训练"
 SUM_Neo_SDH.106.d:"全军训耐渴，三日无水照走。练出来的队伍，补给能减三成。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。"
 SUM_Neo_SDH.106.a:"与雨林互通有无"
 SUM_Neo_SDH.106.b:"与雨林划清界限"
 SUM_SDH_RB_Land_Commons:"土地归部"
 SUM_SDH_RB_Land_Commons_desc:"把主母名下与官署名下的地分回各部，部里再按人头分。"
 SUM_Neo_SDH.107.t:"土地归部"
 SUM_Neo_SDH.107.d:"把主母名下与官署名下的地分回各部，部里再按人头分。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.107.a:"把土地分给部族"
 SUM_Neo_SDH.107.b:"把土地归入官仓"
 SUM_SDH_RB_Water_Share:"水源均分"
 SUM_SDH_RB_Water_Share_desc:"水井与绿洲按人口比例分，多占的退回去。"
 SUM_Neo_SDH.108.t:"水源均分"
 SUM_Neo_SDH.108.d:"水井与绿洲按人口比例分，多占的退回去。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SDH.108.a:"推举公议的执事"
 SUM_Neo_SDH.108.b:"沿用旧日的长老"
 SUM_SDH_RB_Farm_Together:"合耕"
 SUM_SDH_RB_Farm_Together_desc:"把各部的田合在一处安排轮作，收成按工分。分得清，吵得少。"
 SUM_Neo_SDH.109.t:"合耕"
 SUM_Neo_SDH.109.d:"把各部的田合在一处安排轮作，收成按工分。分得清，吵得少。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SDH.109.a:"让花神的誓约作证"
 SUM_Neo_SDH.109.b:"让官署的法度作证"
 SUM_SDH_RB_Grain_Common:"共仓"
 SUM_SDH_RB_Grain_Common_desc:"丰年合仓，荒年共放。放粮按口，不问出自哪一族。"
 SUM_Neo_SDH.110.t:"共仓"
 SUM_Neo_SDH.110.d:"丰年合仓，荒年共放。放粮按口，不问出自哪一族。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SDH.110.a:"与雨林互通有无"
 SUM_Neo_SDH.110.b:"与雨林划清界限"
 SUM_SDH_RB_Speak_Reed:"公议之庭"
 SUM_SDH_RB_Speak_Reed_desc:"在主母厅的对面另立一座公议庭，谁都能去说。"
 SUM_Neo_SDH.111.t:"公议之庭"
 SUM_Neo_SDH.111.d:"在主母厅的对面另立一座公议庭，谁都能去说。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.111.a:"把土地分给部族"
 SUM_Neo_SDH.111.b:"把土地归入官仓"
 SUM_SDH_RB_Iron_Mine:"开矿"
 SUM_SDH_RB_Iron_Mine_desc:"在山里开矿取铁，矿工按班轮值，工钱按月结。"
 SUM_Neo_SDH.112.t:"开矿"
 SUM_Neo_SDH.112.d:"在山里开矿取铁，矿工按班轮值，工钱按月结。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SDH.112.a:"推举公议的执事"
 SUM_Neo_SDH.112.b:"沿用旧日的长老"
 SUM_SDH_RB_Forge_War:"军械坊"
 SUM_SDH_RB_Forge_War_desc:"军械坊专造兵器与马掌，做出来的东西先紧着风卫。"
 SUM_Neo_SDH.113.t:"军械坊"
 SUM_Neo_SDH.113.d:"军械坊专造兵器与马掌，做出来的东西先紧着风卫。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SDH.113.a:"让花神的誓约作证"
 SUM_Neo_SDH.113.b:"让官署的法度作证"
 SUM_SDH_RB_Salt_Money:"盐利养军"
 SUM_SDH_RB_Salt_Money_desc:"盐路的收入专款用于养军，账目贴在营门口。"
 SUM_Neo_SDH.114.t:"盐利养军"
 SUM_Neo_SDH.114.d:"盐路的收入专款用于养军，账目贴在营门口。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。"
 SUM_Neo_SDH.114.a:"与雨林互通有无"
 SUM_Neo_SDH.114.b:"与雨林划清界限"
