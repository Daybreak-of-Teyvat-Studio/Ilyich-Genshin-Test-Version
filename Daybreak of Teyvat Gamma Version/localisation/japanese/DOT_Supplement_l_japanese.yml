 GRE_state_of_the_nation_communism_desc:0 "§W£faction_gre_monarchist §Y君主主義者§!は[Root.GetMonarchistLoyaltyLevel]である。§![ROOT.GetMonarchistLoyaltyEffects]\n\n§W£faction_gre_venezelist §Y共和主義者§!は[Root.GetRepublicanLoyaltyLevel]である。§![ROOT.GetRepublicanLoyaltyEffects]\n\n§W£faction_gre_communist §Y共産主義者§!は[Root.GetCommunistLoyaltyLevel]である。§![ROOT.GetCommunistLoyaltyEffects]\n\n§W£faction_gre_fascist §Yファシスト§!は[Root.GetFascistLoyaltyLevel]である。§![ROOT.GetFascistLoyaltyEffects]"
