ANR_irregular_army:0"Нерегулярная армия"
ANR_irregular_army_desc:0"Можно сказать, что в Вольфендоме нет регулярной армии. Наши войска — сброд, и без реорганизации мы не сможем противостоять внешним угрозам."
ANR_fight_and_hunt:0"Охота в полях"
ANR_fight_and_hunt_desc:0"Охотники и волки Вольфендома закалены в боях, они опытны и полны решимости, могут адаптироваться к бою в нестандартных условиях."
ANR_backward_production_mode:0"Отсталые методы производства"
ANR_backward_production_mode_desc:0"В Вольфендоме почти нет промышленности, жители — волки и дикари, сложно вести производство и исследования. Если бы мир сохранился, это не было бы проблемой, но..."
ANR_backward_living_rate:0"Отсталые условия жизни"
ANR_backward_living_rate_desc:0"Связь — только криком, транспорт — пешком, в радиусе сотен миль нет больниц, в тысяче шагов — ни души."
ANR_plentiful_resources:0"Богатые природные ресурсы"
ANR_plentiful_resources_desc:0"Дикие звери, ягоды и кристальная руда — особенность Вольфендома. Только этим мы можем прокормить себя."
ANR_rangers_in_forests:0"Лесные странники"
ANR_rangers_in_forests_desc:0"В Вольфендоме всегда можно увидеть странных людей... они скачут по горам, летают по лесам, это не боевик, это обычная жизнь."
ANR_many_immigrants:0"Средний приток беженцев"
ANR_many_immigrants_desc:0"После раскола Мондштадта множество беженцев покинуло дома. По слухам, Вольфендом — единственное мирное место под защитой Волка Севера, и беженцы хлынули сюда, нарушив покой... но и дав новые возможности."
ANR_more_immigrants:0"Большой приток беженцев"
ANR_more_immigrants_desc:0"После создания администрации и решения проблем с жильём и едой, слухи о мирном Вольфендоме усилились, привлекая ещё больше беженцев."
ANR_far_more_immigrants:0"Огромный приток беженцев"
ANR_far_more_immigrants_desc:0"Наша подготовка к обороне заметна, и многие беженцы, ранее колебавшиеся, теперь направляются к нам, увеличивая давление."
ANR_most_immigrants:0"Гигантский приток беженцев"
ANR_most_immigrants_desc:0"Когда Вольфендом доказал свою способность защитить себя в охваченном войной Мондштадте, слухи о «единственном мирном месте» стали реальностью. Всё больше людей, жаждущих мира, прибывают к нам, увеличивая нагрузку на администрацию и обостряя разногласия между лидерами..."
ANR_innocuous_immigrants:0"Безопасный средний приток беженцев"
ANR_innocuous_immigrants_desc:0"После необходимых процедур мы можем принимать беженцев, не нарушая существующего порядка."
ANR_innocuous_more_immigrants:0"Безопасный большой приток беженцев"
ANR_innocuous_more_immigrants_desc:0"После необходимых процедур мы можем принимать беженцев, не нарушая существующего порядка."
ANR_innocuous_far_more_immigrants:0"Безопасный огромный приток беженцев"
ANR_innocuous_far_more_immigrants_desc:0"После необходимых процедур мы можем принимать беженцев, не нарушая существующего порядка."
