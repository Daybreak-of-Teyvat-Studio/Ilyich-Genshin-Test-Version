 #### 序章 · 花灵的守望 ####
 SUM_SGS_PRO_The_Paris_Vigil:"花灵的守望"
 SUM_SGS_PRO_The_Paris_Vigil_desc:"沙丘腰带的沙下埋着圣显厅，也埋着花灵。她们从灵光里生出来，替凡人守着新生的边界，一守就是几百年。凡人在沙上筑城、通商、争水，花灵就在旁边看着，从不插手，也从不离开。"
 SUM_Neo_SGS.1.t:"花灵的守望"
 SUM_Neo_SGS.1.d:"沙丘腰带的沙下埋着圣显厅，也埋着花灵。她们从灵光里生出来，替凡人守着新生的边界，一守就是几百年。凡人在沙上筑城、通商、争水，花灵就在旁边看着，从不插手，也从不离开。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
