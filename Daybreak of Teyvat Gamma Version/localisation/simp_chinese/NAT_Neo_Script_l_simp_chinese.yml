 NAT_Nightwind_Petition_Idea:"烟谜主陈情"
 NAT_Nightwind_Petition_Idea_desc:"烟谜主祭司将一纸陈情揉成团，浸烟灰，搓成一颗黑丸。一后生不解，问：「陈情何故写成一个谜？」祭司将黑丸搁舌上，闭目捻诀，吐气如烟，那烟半空盘成一字，转瞬复散。乃曰：「话讲明白，人便只记那句；谜留着，人才肯日日去想。」及至焱庭，满殿之人相对黑丸面面相觑。一老臣忽拍案，令人取炭盆，将黑丸投其中。青烟腾起，满室皆怪味。老臣盯烟纹视半晌，忽冷笑一声：「此为问吾等，肯不肯将秘仪归还。」众人方恍然，盆中青烟犹未散尽。"
