DRA_The_Only_Sun:0"Мудрость человека в колбе"
DRA_The_Only_Sun_desc:0""
DRA_Great_Secret:0"Великий обряд"
DRA_Great_Secret_desc:0""
DRA_Brilliant_Flaming_Nation:0"Сияющая горящая страна"
DRA_Brilliant_Flaming_Nation_desc:0"Мондштадт сияет, а нация горит. Как в алхимии, горение превратит нас в нечто большее."
DRA_Dawn_of_Teyvat:0"Рассвет Тейвата"
DRA_Dawn_of_Teyvat_desc:0"Теперь на горизонте Тейвата виден рассвет. Мы преодолели трудности и принесём рассвет всему Тейвату."
DRA_Per_aspera_ad_astra:0"Через тернии к звёздам"
DRA_Per_aspera_ad_astra_desc:0"«Одуванчик, одуванчик, лети с ветром вдаль... Он улетел туда, куда не достигнет Небесный Остров.»"

##龙脊雪山第二幕阿贝多线（即focus_tree_21B）国策

DRA_Victory_of_Mond_Demo:0"Победа демократии"
DRA_Victory_of_Mond_Demo_desc:0"После долгой борьбы мы вернули мир и разум в Мондштадт. Теперь мы восстановим страну из руин, и те, кто противился, увидят торжество демократии."
DRA_Begin_Rebuilding:0"Начало восстановления"
DRA_Begin_Rebuilding_desc:0"Война окончена, но борьба за счастье начинается. Мондштадт в руинах, и мы должны восстановить его."
DRA_Plan_our_Development:0"Экономическое восстановление"
DRA_Plan_our_Development_desc:0"Мы сосредоточимся на экономическом развитии, чтобы обеспечить народ хлебом."
DRA_Modernize_Fishery:0"Модернизация рыболовства"
DRA_Modernize_Fishery_desc:0"Рыбаки на озере Сидра нуждаются в модернизации. Мы инвестируем в технологии, чтобы улучшить безопасность и доходы."
DRA_Popularize_Application_of_Fertilizer:0"Внедрение удобрений"
DRA_Popularize_Application_of_Fertilizer_desc:0"Мы импортируем технологии из Сумеру и будем продавать удобрения крестьянам."
DRA_Support_Large_Farms:0"Поддержка крупных ферм"
DRA_Support_Large_Farms_desc:0"Мелкие крестьяне консервативны. Мы поощрим создание крупных ферм."
DRA_Reborn_of_Mond_Agriculture:0"Возрождение сельского хозяйства"
DRA_Reborn_of_Mond_Agriculture_desc:0"Наше сельское хозяйство возродилось, высвобождая рабочую силу для промышленности. Наступает новая эра!"
DRA_Invest_Advanced_Weapon_Product:0"Инвестиции в вооружение"
DRA_Invest_Advanced_Weapon_Product_desc:0"Сила — гарантия мира. Мы развиваем военную промышленность, чтобы защитить мир и создать рабочие места."
DRA_National_Arms_Corporation:0"Государственная оружейная корпорация"
DRA_National_Arms_Corporation_desc:0"Мы национализируем частные военные компании."
DRA_Expand_Arms_Factory:0"Планирование промышленности"
DRA_Expand_Arms_Factory_desc:0"Инвестиции направят промышленность в нужное русло."
DRA_Reborn_of_Mond_Industry:0"Возрождение промышленности"
DRA_Reborn_of_Mond_Industry_desc:0"Заводы снова работают, товары текут по стране."
DRA_Abundance_Came_Back:0"Процветание вернулось"
DRA_Abundance_Came_Back_desc:0"Экономика ожила, Мора течёт рекой, народ живёт лучше."
DRA_Move_our_Central_Government:0"Переезд правительства"
DRA_Move_our_Central_Government_desc:0"Мы перенесём столицу в Мондштадт, центр страны."
DRA_Control_Mond:0"Возвращение беженцев"
DRA_Control_Mond_desc:0"Беженцы возвращаются. Мы поможем им восстановить дома, завоевав доверие."
DRA_Reopen_Schools:0"Университет Рейндотт"
DRA_Reopen_Schools_desc:0"Мы назовём новый университет в честь наставницы Альбедо."
DRA_Reform_Education_System:0"Образовательная реформа"
DRA_Reform_Education_System_desc:0"Мы создадим систему образования, готовящую кадры для всех сфер."
DRA_Contrl_Unstable_Factors:0"Выманивание змеи из норы"
DRA_Contrl_Unstable_Factors_desc:0"Мы пригласим оппозицию на переговоры, чтобы затем нейтрализовать её."
DRA_Control_V_owners:0"Регистрация Глаз Бога"
DRA_Control_V_owners_desc:0"Мы зарегистрируем всех обладателей Глаза Бога, чтобы предотвратить их переход к оппозиции."
DRA_Repay_to_People:0"Диверсификация промышленности"
DRA_Repay_to_People_desc:0"Мы создадим новые отрасли, чтобы снизить зависимость от традиционных."
DRA_Build_Basic_Government:0"Антимонопольное расследование"
DRA_Build_Basic_Government_desc:0"Мы расследуем монополии и создадим антимонопольное законодательство."
DRA_Boost_Peoples_Confidence:0"Повышение уверенности"
DRA_Boost_Peoples_Confidence_desc:0"Мы вернём людям веру в будущее, чтобы стимулировать потребление."
DRA_Stability_Came_Back:0"Сияние вернулось"
DRA_Stability_Came_Back_desc:0"Мондштадт снова сияет. Восстановление завершено, и мы движемся дальше под руководством мудрого лидера."
DRA_Prepare_for_International_Action:0"Подготовка к внешней политике"
DRA_Prepare_for_International_Action_desc:0""
