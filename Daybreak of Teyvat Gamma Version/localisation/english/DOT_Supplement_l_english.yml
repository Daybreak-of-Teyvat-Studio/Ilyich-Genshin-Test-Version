 DOT_INTRO_TEXT_Mora:0 "Mora is the common currency of Teyvat. The balance of Mora income and spending reflects whether a nation runs in a healthy and efficient way.\n\nSettlement is made once a month. The following raise your income:\n1. Resource sales. Exporting resources brings steady returns.\n2. Industrial tax. Civilian factories serving the population, through the consumer goods factor, generate industrial tax, and this is the main source of income early on.\n3. Livelihood tax. Every region with population provides a consumption tax.\n4. Stability. Note that stability reflects how settled and how manageable the country is. Too low a stability makes tax collection hard, so treat stability as the first priority for economic growth.\n5. Fixed income. Some focuses and decisions grant fixed income.\n\nThe following raise your spending:\n1. Resource imports. Importing resources from other countries costs a great deal of Mora.\n2. Industrial subsidy. Every civilian factory, military factory and dockyard you operate requires an industrial subsidy.\n3. Army subsidy. Normal operation of the army also requires a great deal of Mora.\n4. Administrative spending. Every region you own costs Mora to administer.\n5. Development factor. As the country develops, the factors on these expenses keep rising.\n6. Fixed spending. Some fixed expenses are tied to focuses.\n\nNational debt: when income cannot cover spending, debt accumulates, and accumulated debt brings ever heavier penalties. Debt is not implemented yet. If you find the economy of the tag you are playing too inefficient to support development or war, please report it."
 DOT_INTRO_TEXT_NOW_6:0 "The §CThree Moon Goddesses§! who once drew the primordial sphere and brought love and ardour to a whole world are long gone, but the people who follow the tides have never stopped singing and praying, for a new §Cmoon goddess§! is about to return.\n\nNow, where the moonlight does not reach, §0the shadow of old days§! has bared its hunting claws at the stars.\n\nGather every force you can against the blackness of old days. The past mirrors the future in the water, the curtain of lies has already loosened. Make haste. The moon is going to fall.\n\nThe Frostmoon Scions\n\nHeirs of the golden kingdom in legend, who after casting off the old civilization chose life among the mountains and woods. The one thing they never cast off was faith in the §Cmoon goddess§!. But with the coming of the Fatui, a quiet that had always been so may now be in its final hour.\n\nTheir distant homeland long since sank into the court of the creator lord; yet those proud descendants still lit the first lamps in the blackening tide, spinning out that far-off prayer for the shelter of the new moon.\n\nThe Lamplighters\n\nAn ancient order that has long fought the endless invasion and Wild Hunt of the Abyss, guarding Nod-Krai's freedom and peace, was gravely weakened in the great war past. Facing a new threat, can the new generation of lamplighters still fulfil its charge?\n\nThe Clang-Clang Egg Roll Workshop\n\nOnce only a small workshop where a genius little girl studied a machine for the most delicious egg rolls. But as one ingenious invention followed another, it became a well known mechanical workshop. Still, be polite when you ask that genius for a favour, or the part you get may come with a bad egg roll attached.\n\nThe Vonich Trade Guild\n\nTo keep some basic order, the merchants of Nasha Town formed a guild. But how would outlaws among the islands ever be bound by rules? If anyone frightens them, it is probably only the proprietress of the Secret News House.\n\nThe Fatui\n\nUnder the shining decree of the highest order, the Pale Star Edict, the Fatui Harbingers have all been recalled to Snezhnaya and sent on to Nod-Krai. In the newly founded Lunar Torque Experimental Design Bureau, countless transmission mechanisms turn day and night. People here wonder why the army that raises the pale star banner has come, or for whom it has come.\n\nThe Wild Hunt\n\nThe armies of the Abyss sweep across the plains and canyons like a storm; come close enough and you can hear their strange whispers. The breath of the Abyss is brewing. The black tide mutters in the cold night, waiting for the moment to tear the thinning curtain and devour the frail souls utterly. In shadows the rules cannot reach, even death is not the end of torment.\n\nThe Knights of Favonius\n\nA small band of elite knights under the Mondstadt expeditionary force, who crossed all of Snezhnaya with the Grand Master to reach Nod-Krai. They are said to have come for an important task."
