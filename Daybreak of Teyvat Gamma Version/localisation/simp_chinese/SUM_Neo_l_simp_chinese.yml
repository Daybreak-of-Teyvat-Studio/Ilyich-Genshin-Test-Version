 SUM_Neo_SDH.179.d:"运水队昼夜不停，车夫换人不换车。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
