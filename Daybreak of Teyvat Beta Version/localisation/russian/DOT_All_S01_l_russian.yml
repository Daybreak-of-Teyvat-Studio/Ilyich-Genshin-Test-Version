ANR_Fischl_Special_Decisions:0"Ночной вальс"
ANR_Fischl_Special_Decisions_desc:0"\nПринцесса сожжёт своё сердце. С расцветом бессмертного сияния родится новая вселенная.\nИ принцесса поймёт, что каждый миг жизни, даже самый незначительный эпизод, нужно ценить.\n"
ANR_Fischl_Decisions1:0"Руководство академическим прогрессом"
