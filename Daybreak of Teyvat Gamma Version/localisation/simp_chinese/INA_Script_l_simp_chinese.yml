 ##########神子国策
 INB_politcal:0 "八重神社权力重组"
 INB_politcal_desc:0 "八重神社的帷幕之下，我们的问题堆积如山，为了匡正我们一意孤行的神明，必须重整整个神社。"
 INB_army_modernization:0 "军队重整"
 INB_army_modernizationl_desc:0 "我们的神社护卫队太过闲散，必须重整。"
 INB_manpower:0 "召集信徒"
 INB_manpower_desc:0 "神社附近人烟稀少，我们需要召集虔诚的信徒。"
 INB_industrial_planning:0 "工业规划"
 INB_industrial_planning_desc:0 "神社附近的土地要么是已经开发殆尽，要么是地形恶劣，想要发展工业必须重新规划土地用途。"
 INB_collective_farms:0 "基建计划"
 INB_collective_farms_desc:0 "拥有了合理的规划之后，基建计划也就提上日程了。"
 INB_law_university:0 "建立神学院"
 INB_law_university_desc:0 "为了扩大我们的科研能力，我们需要建立一所神学院。"
 INB_obedience:0 "协助"
 INB_obedience_desc:0 "影现在正走在正确的道路上，或许应该帮她一把。"
 INB_assertiveness:0 "修正"
 INB_assertiveness_desc:0 "影现在正走在错误的道路上，如果她不能及时醒悟，那就只能靠我们了。"
 INB_invast_eimountain:0 "投资影向山"
 INB_invast_eimountain_desc:0 "投资影向山"
 INB_cooperwithsan:0 "与珊瑚宫的合作"
 INB_cooperwithsan_desc:0 "独自击败我的神明或许有些困难，我们或许可以与珊瑚宫合作，但这意味着我们必须放弃那些土地的宣称权"
 INB_alone:0 "独行之路"
 INB_alone_desc:0 "独自击败我的神明或许有些困难，但我们绝不能以放弃土地为代价勾结乱党。"
 INB_surpriseattack:0 "奇袭"
 INB_surpriseattack_desc:0 "现在，是时候了，一举决胜。"
 INB_wintheina:0 "破军"
 INB_wintheina_desc:0 "或许是我们的奇袭奏效了，或许是影故意的，总之，现在我们入主天守阁了。"
 INB_enlargepublic:0 "扩建八重堂"
 INB_enlargepublic_desc:0 "八重堂原本就是稻妻最大的出版商，但现在对于八重大人来说，仅仅作为出版商的八重堂已经远远不够了，所以我们将扩建八重堂，扩大它的职责范围。"
 INB_yaereformation:0 "宗教改革"
 INB_yaereformation_desc:0 "原有的鸣神教义已经不足以满足我们当下的需求了，无论是在信仰上击败并改编珊瑚神社，还是在收集民众的信仰上，我们必须进行改革。" 
 INB_enhancbelife:0 "信仰强化"
 INB_enhancbelife_desc:0 "强化我们的队伍信仰。" 
 INB_yaeisgod:0 "神化神子"
 INB_yaeisgod_desc:0 "显然对于每一个都有自己神明的国度而言，我们不足以体现我们的特殊性，但如果我们声称，我们是受到两位神明共同眷恋的国度呢？" 
 INB_yaeearthlydeity:0 "常世的神明"
 INB_yaeearthlydeity_desc:0 "不同与其他的国度，我们的神明存在于常世之中，而这正是我们的信仰比其他国度更为正确的原因。" 
 INB_yaeblesscure:0 "治愈的神迹"
 INB_yaeblesscure_desc:0 "毫无疑问的一点是，神子大人仅仅只需要展示一些自己的治愈能力，就可以在八重堂的宣传下将这作为神迹宣传出去。进而建立我们的信仰优势。" 
 INB_yaediviegaze:0 "与你同在"
 INB_yaediviegaze_desc:0 "仅仅只证明我们的信仰优越性是远远不够的，我们还应该让我们的神明时常降临，与信徒们同在。" 
 INB_yaeblessgold:0 "财富大权"
 INB_yaeblessgold_desc:0 "财富与商业之神，这是岩国神明的称号之一，因此那些谋求利益的人往往都会去崇拜他，而如今它已经陨落了，我们为什么不为神子大人冠加这个称号？" 
 INB_yaeisgodofrich:0 "财富之神"
 INB_yaeisgodofrich_desc:0 "借由我们的政府调控，我们可以轻易的让那些配合并服从于我们的人发了大财，而伴随着他们的财富事迹被八重堂广泛传播，神子大人已经成为了名副其实的财富与商业之神。"  
 INB_yaeisgodofcure:0 "治愈之神"
 INB_yaeisgodofcure_desc:0 "借由我们的巫女队伍的广泛行动，我们治愈了越来越多的民众，而他们也自发的成为了免费的宣传，现在，他们对神子大人就是治愈之神这一点深信不疑。"  
 INB_anothergod:0 "双神眷恋的稻妻"
 INB_anothergod_desc:0 "在我们的宣传之下，不仅仅稻妻的民众对神子大人是神深信不疑，许多外国的信徒也开始相信这一点。" 

 INB_renewbuiding:0 "重整勘定奉行"
 INB_renewbuiding_desc:0 "勘定奉行主管外交以及对内的经济建设，但之前的勘定奉行中充斥了太多无能之辈，现在，是该重整他们了。"
 INB_rebuiding_mainisland:0 "扩建稻妻城"
 INB_rebuiding_mainisland_desc:0 "稻妻城以及天守阁是整个稻妻的核心地区，但这里的基建已经太过古旧了。五百年前的设施虽然有部分更新，但已经远远不能满足需求，对稻妻城的翻修扩建，就是新勘定奉行的第一个任务。"
 INB_rebuiding_temple:0 "开发影向山"
 INB_rebuiding_temple_desc:0 "既然将军大人已经将统治权交给了八重大人，那么自然为了方便处理各种事务，八重大人下令翻修影向山上那过于老旧的栈道以及山脚荒废的神社。这将是新勘定奉行的第一个任务。"
 INB_rebuiding_awayisland:0 "离岛开发"
 INB_rebuiding_awayisland_desc:0 "离岛是稻妻对外贸易最重要的港口，为了彰显我们的新变化，我们应该修整离岛的基础设施。"
 INB_unioncommerce:0 "邀请万国商会投资"
 INB_unioncommerce_desc:0 "万国商会是离岛最具影响力的商业集团，我们对他们发出官方的邀请，一定可以让其他的投资者放下顾虑。积极投入我们的工业建设。"
 INB_reorganizetheindustry:0 "重建工业系统"
 INB_reorganizetheindustry:0 "随着社会的各个力量积极投入我们的工业建设，我们的工业水平赶上了世界。"
 INB_rebuiding_mainindustry:0 "修复踏鞴砂"
 INB_rebuiding_mainindustry_desc:0 "踏鞴砂是整个稻妻最核心的工业区，御影炉心也安置在那里，但战乱和过于久远的设施使得御影炉心随时可能融毁，如果我们想要修复御影炉心就必须先修复踏鞴砂的基建"
 INB_rebuiding_reactor:0 "炉心维护计划"
 INB_rebuiding_reactor_desc:0 "借由我们的技术发展，我们寻找到了一种新的维护御影炉心的方法，这极大的降低了我们维修御影炉心的伤亡。"
 INB_new_reactor:0 "炉心重构"
 INB_new_reactor_desc:0 "在我们与丹枫的工匠合作之后，我们终于从尘封的档案库中找到了御影炉心的旧图纸存放表，这让我们得以重构整个御影炉心，而参与重构的丹枫工程师则更是拍着胸膛保证，新的御影炉心，在百年之内都绝不会出任何意外。"
 INB_summer_party:0 "夏祭盛典"
 INB_summer_party_desc:0 "夏夜祭，全稻妻最受欢迎的祭典，因为战乱，我们已经很久没有举行过一次像样的夏夜盛会了。现在，全新的稻妻城和离岛建设之后，我们该举行这样一场盛典来安抚我们民众饱经战乱的心灵了。"
 INB_transport:0 "薄荷屋开张"
 INB_transport_desc:0 "薄荷屋重开" 
 INB_goodjob:0 "经济良好"
 INB_goodjob_desc:0 "在完成一切之后，我们将拥有一个真正良好的经济。"
 INB_constructionsector:0 "稻妻军工部"
 INB_constructionsector_desc:0 "赶上时代并非易事，首先我们就得对勘定奉行进行改革，设立下属军工部，专辖军事工业。"
 INB_industrialsector:0 "稻妻工业部"
 INB_industrialsector_desc:0 "赶上时代并非易事，首先我们就得对勘定奉行进行改革，设立下属工业部，专辖民用工业。"
 INB_electronicssector:0 "勘定电子部"
 INB_electronicssector_desc:0 "为了统筹通讯类工作，一个下属的电子研发部门是非常有必要的。"
 INB_electronicsresceach:0 "电子技术革新"
 INB_electronicsresceach_desc:0 "为了解决通讯问题，我们将对通讯电子技术进行更多投入"
 INB_yaepublic:0 "八重堂分店"
 INB_yaepublic_desc:0 "随着新首都的建设完成，在影向山下建立一个八重堂的分部也被提上了日程"
 INB_yoimiyashop:0 "长野原烟花店"
 INB_yoimiyashop_desc:0 "新时代的战争需要更多的火药，但放眼整个稻妻唯一有火药制作能力的，竟然只有长野原烟花店一家，我们必须对长野原烟花店进行大规模投资以满足需求。"
 INB_eyessimith:0 "御用锻造屋"
 INB_eyessimith_desc:0 "新时代的战争中，旧时代的铁器依然需求极大，为了统合稻妻锻造业，有必要设立一家官方锻造屋了。"
 INB_lightironform:0 "经津流锻造"
 INB_lightironform_desc:0 "神里家族传承的经津流，在上一次雷电五传覆灭中受到了极大的损失，但他们也因祸得福，发展出了一种全新的经津流锻造术，这种锻造术极大的降低了锻造成本，但同时质量也有小幅度的下滑。"
 INB_heavyironform:0 "天目流锻造"
 INB_heavyironform_desc:0 "天目家族传承的天目流，是唯一完整流传至今的雷电五传，天目流的诀窍就是精益求精，讲究滴水穿石的耐心。或者说慢工出细活。这种锻造术极大的提升了武器的质量，但同时成本也有一定幅度的上涨"
 INB_foreign_experts:0 "外国专家"
 INB_foreign_experts_desc:0 "邀请外国专家" 
 INB_national_specialists:0 "本国专家"
 INB_national_specialists_desc:0 "重视本国专家" 
 INB_foregn_civil_factory:0 "邀请投资者"
 INB_foregn_civil_factory_desc:0 "邀请投资者，为我们的建设添砖加瓦。" 
 INB_build_rawsea:0 "荒海开发"
 INB_build_rawsea_desc:0 "荒海，稻妻北部的台地，只需要稍加开发，我们便可在此新建工业区。" 
 INB_build_eiislands:0 "群岛开发"
 INB_build_eiislands_desc:0 "鸣神岛附近的岛屿也可以通过砍伐无用的灌木，平整土地，得以开发利用。" 
 INB_build_gantian:0 "绀田拓荒"
 INB_build_gantian_desc:0 "绀田村是鸣神岛的主要粮食产出地区，但因为战乱与先前统治者的不作为，许多的土地已经被抛荒了，现在是时候拓荒开田了" 
 INB_develop_gantian:0 "投资柑金岛"
 INB_develop_gantian_desc:0 "柑金岛以及白狐之野，位于稻妻城与绀田村之间的巨大平地以及可开发港口，具有巨大的发展潜力。" 
 INB_rebuild_eimountain:0 "复兴影向山"
 INB_rebuild_eimountain_desc:0 "影向山，稻妻的最高峰兼宗教圣地，在之前的雷灾祸中，损毁严重，山脚的神社已被废弃，道路也破败不堪，是该复兴影向山了。" 
 INB_release_captail:0 "疏散非首都功能"
 INB_release_captail_desc:0 "稻妻城内已经拥堵不堪，太多的工业建筑等非首都建筑占用了太多的空间，我们现在必须将这些非首都建筑疏散到附近的岛屿上，缓解首都压力。" 
 INB_yaeminefactory:0 "鸣神矿业"
 INB_yaeminefactory_desc:0 "主要发展矿业" 
 INB_yaebuidingfactory:0 "天狐建筑司"
 INB_yaebuidingfactory_desc:0 "优先发展建筑业" 
 INB_yaeoilof_ships:0 "储备燃料"
 INB_yaeoilof_ships_desc:0 "虽然我们的树脂产量冠绝提瓦特，但我们应该居安思危。" 
 INB_yaerebuidships:0 "重建船坞"
 INB_yaerebuidships_desc:0 "我们的造船业荒废得太久太久了" 
 INB_yaecruisersubmarines:0 "巡洋潜艇"
 INB_yaecruisersubmarines_desc:0 "一种大型潜艇" 
 INB_yaeminsubmarines:0 "袖珍潜艇"
 INB_yaeminsubmarines_desc:0 "一种迷你潜艇，适合保卫近海" 
 INB_yaeupgrademinsubmarines:0 "雷魂驱动潜艇"
 INB_yaeupgrademinsubmarines_desc:0 "改良型迷你潜艇，它更强大，也更昂贵" 
 INB_yaedefenceoverseas:0 "海岸防卫"
 INB_yaedefenceoverseas_desc:0 "建筑海岸要塞" 
 INB_buildjiutiaozhenwu:0 "构筑阵地"
 INB_buildjiutiaozhenwu_desc:0 "九条阵屋的位置，极其重要的捍卫了鸣神岛的安全，我们要加强当地的建设。" 
 INB_buildjunzhen:0 "军镇建设"
 INB_buildjunzhen_desc:0 "我们不能仅仅依靠踏鞴砂作为军事工业基地，必须把鸡蛋放在不同的篮子里" 
 INB_buildfireandlighting:0 "淬炼雷火"
 INB_buildfireandlighting_desc:0 "天雷勾地火，无相火被我们镇压之后，有望成为全新的燃料炉核心" 
 INB_fixforinter:0 "修复前线"
 INB_fixforinter_desc:0 ""
 INB_yaeair_focus:0 "樱雷空军"
 INB_yaeair_focus_desc:0 "比起与敌人硬碰硬，神子大人更倾向于用雷暴投下无尽的天罚。用无穷无尽的雷鸣击碎黑暗。让一切敌人为稻妻神光而恐惧。"
 INB_yaeairdesigner_focus:0 "津经流航空设计司"
 INB_yaeairdesigner_focus_desc:0 "津经流，雷电五传之一由社奉行的神里家族传承，在近千年的演化中演化出了自己独有的传承。现在，是时候让他们来掌握我们的空军制造了"
 INB_yae_fighter_focus:0 "空中防卫"
 INB_yae_fighter_focus_desc:0 "神子大人不喜欢侵略，但也绝不软弱，捍卫整个稻妻的空域，也是计划的一部分"
 INB_yae_air_forts:0 "长生鸟计划"
 INB_yae_air_forts_desc:0 "神子大人提出了一种强力的对地支援机制造计划"
 INB_heavy_armor_focus:0 "装甲先锋"
 INB_heavy_armor_focus_desc:0 "对于这些新奇的东西，神子大人总是充满好奇的，毕竟这能极大的减少稻妻人民的伤亡，这样也能避免当年的悲剧再次上演吧"
 INB_methodical_battle:0 "军事推演"
 INB_methodical_battle_desc:0 "军事推演有时候和写小说也很类似呢，一定要结合实际，同时大胆揣测，所以在神子大人统管军队之前，好好学习理论知识也是非常重要的"
 INB_fortification_focus:0 "鸣雷防线"
 INB_fortification_focus_desc:0 "稻妻特殊的地理环境决定了，只要我们想，就可以依托防线轻易的将敌人阻挡在稻妻之外，不同于过去封锁整个稻妻的雷暴，我们可以依托防线达到阻挡敌人却不束缚自己的目的"
 INB_moble_forts:0 "移动防线"
 INB_moble_forts_desc:0 "将防御工事机动化？不，是将机动人员壁垒化。不管怎么说，现在我们的军队走到哪，都像一堵无法逾越的城墙。"
 INB_extend_the_maginot_line:0 "鸣神岛防线"
 INB_extend_the_maginot_line_desc:0 "还有什么方案，比我们之间在鸣神岛的所有登录口都设立坚固的防线更有安全感呢？"
 INB_infantry_tanks:0 "步战坦克"
 INB_infantry_tanks_desc:0 "启用设计商"
 INB_special_forces:0 "特种部队"
 INB_special_forces_desc:0 "扩编特种部队"
 INB_infantry_line:0 "步兵战线"
 INB_infantry_line_desc:0 "八重大人注重于步兵的装备制作。"
 INB_infantry_focus:0 "装备升级"
 INB_infantry_focus_desc:0 "在步兵装备中创造性的调整配方，与加入时间。"
 INB_support_focus:0 "信仰壁垒"
 INB_support_focus_desc:0 "神子大人和将军大人将成为为我们战士们最坚定的信仰，这将极大的提升他们的坚韧性，这将使得普通步兵营生命+5"
 INB_support_focus_effect_tooltip:0 "获得科技：信仰壁垒使得徒步步兵营生命+5."
 INB_mobilizaton:0 "八重动员令"
 INB_mobilizaton_desc:0 "作为鸣神大社的宫司与八重堂的总管。八重大人可以轻易的挑动整个稻妻的舆论环境，这使得八重大人可以轻松的动员一切力量。"
 INB_armor_focus:0 "重战车"
 INB_armor_focus_desc:0 "重型坦克加速卡"
 INB_heavydesigner:0 "经津流装甲"
 INB_heavydesigner_desc:0 "八重神子大人需要一个新的装甲设计师，还有谁比一直为八重宫司大人效力，同时又是雷电五传的经津流神里家，更合适的呢？"
 INB_heavydesigner_effect_tooltip:0 "使得重坦营，超重坦营生命+5，装备需求-15."
 INB_heavydefender:0 "先进装甲"
 INB_heavydefender_desc:0 "我们需要实验"
 INB_heavydeproduct:0 "重坦流水线"
 INB_heavydeproduct_desc:0 "极大的降低了重坦制造成本"
 INB_yaebureau_of_ships:0 "樱雷舰队"
 INB_yaebureau_of_ships_desc:0 "在神子大人的主导下，我们将建设一支专注于本土防卫的舰队，毕竟作为一个岛国，只要守住了海洋，就立于不败之地"
 INB_yae_submarines:0 "研究潜艇"
 INB_yae_submarines_desc:0 "神子大人认为潜艇这一武器将极大的加强我们的战斗力。"
 INB_yaecapital_ship:0 "舰船研究"
 INB_yaecapital_ship_desc:0 "舰船研究"
 INB_torpedo_cruisers:0 "重雷装巡洋舰"
 INB_torpedo_cruisers_desc:0 "对于鱼雷这样一款特殊的新武器，我们的工程师构建了一种方案，最大化的安装他们。"
 INB_yaecarrier_focus:0 "航母研究"
 INB_yaecarrier_focus_desc:0 "航母研究"
 INB_yaecarrier:0 "自建航母"
 INB_yaecarrier_desc:0 "自建航母"
 INB_yaecheapcarrer:0 "护卫航母"
 INB_yaecheapcarrer_desc:0 "一种廉价的护卫型航母，成本极低，但性能也同样极差。"
 INB_battleship_primacy:0 "巨舰大炮"
 INB_battleship_primacy_desc:0 "如果敌人认为我们装备了三十门大炮，那么我们就装上六十门，如果敌人认为我们的装甲有五厘米厚，那么我们就加到十厘米，没有哪一艘船是因为大炮太多而沉没的！"
 INB_seafortification:0 "海岸防卫"
 INB_seafortification_desc:0 "建立一道足以庇护整个鸣神岛的海岸要塞防线！"
 INB_yaefund_the_navy:0 "经津流造船司"
 INB_yaefund_the_navy_desc:0 "经津流的工匠们，当然在造船业上也能发挥出他们的作用"
 INB_fusiliers_marine:0 "海军陆战队"
 INB_fusiliers_marine_desc:0 "加速海军陆战队"
 
 ################稻妻内战########
INA_army_corruption:0 "严重腐败的军队"
INA_army_corruption_desc:0 "我们的军队被奉行府把持得太久了，里面充斥着无能的废物，贪污的臭虫以及贪生怕死的胆小鬼。这极大的影响了我们军队的战斗力。要赢得这场战争，我们必须重整我们的军队，清扫掉这里面的无能之辈。"
INA_army_corruption_2:0 "有些腐败的军队"
INA_army_corruption_2_desc:0 "我们已经成功的重组了军队，清除了里面那些贪污腐败的臭虫，但这只由废物和胆小鬼组成的军队依然难当大任。要赢得这场战争，我们必须继续重整我们的军队，清扫掉这里面的无能之辈。"
INA_army_corruption_3:0 "比较腐败的军队"
INA_army_corruption_3_desc:0 "我们已经成功的重组了军队，清除了大部分的害群之马，这支军队现在可堪一用。不过要赢得这场战争，我们必须继续重整我们的军队，彻底解决所有问题，一了百了。"
INA_huaping:0 "人偶将军"
INA_huaping_desc:0 "雷电将军在名义上统治着整个稻妻。因为影几乎将所有的工作都托管给了人偶将军，这使得三奉行有了极大的操作空间。"
INA_complete:0 "身心合一"
INA_complete_desc:0 "现在，心灵与身体的矛盾得以解决，分裂了五百年心灵与身躯再次合二为一。完全的雷电将军，完全的永恒之神，将再度君临整个稻妻。"
INA_eyeseek:0 "眼狩令"
INA_eyeseek_desc:0 "最初由天领奉行提议，经雷电将军批准，为保障稻妻能在永恒的道路上不受干扰，而决定对那些不完全服从于将军大人的神之眼持有者施加剥夺神之眼的惩罚，随着局势发展，眼狩令越发狂热，但因为神之眼持有者数量的稀少，因此大部分平民对此并没有太大意见。"
INA_locked:0 "锁国令"
INA_locked_desc:0 "在经历坎瑞亚一战之后，目睹了坎瑞亚覆灭惨剧的将军决定降下雷暴，封锁国境，除去极少数有能力穿越雷暴的商船还能在离岛与稻妻进行贸易之外，大部分的商贸活动都被禁止了，这极大的稳定了稻妻的局势，但也阻碍了稻妻的进步。不过千年不变的永恒，不正是将军大人的信念吗？"
INA_government_corruption:0 "无能的政府"
INA_government_corruption_desc:0 "将军在一心净土之中的时间太久了，三奉行早已经不再是当年高效忠诚的三奉行了，现如今三奉行之间充斥着明争暗斗，勾结外匪，对国家大事不闻不问，整个稻妻民不聊生。"
INA_disaster:0 "雷祸横行"
INA_disaster_desc:0"如今鸣神大社的宫司大人早已不再是忧国忧民的狐斋宫大人了，现在是将军的眷属八重神子，她仗着将军的宠爱，对神社应尽的职责敷衍了事，雷击木遭到歹徒的损坏，雷祸污染甚至早就蔓延在了影向山之下，而八重神子却痴迷于创办轻小说比赛。"
INA_civil_wars:0 "内战危机"
INA_civil_wars_desc:0 "眼狩令的实行，以及天领奉行的腐败给了那些叛乱分子以可乘之机，珊瑚宫的反抗军乘机向幕府举起了反旗。不管她们的理由有多么好听，我们的国家陷入了内乱是不争的事实。"
INA_pirate:0 "海盗横行"
INA_pirate_desc:0 "随着战乱的爆发，一些渔民以及逃兵落海为贼，占山为寇，肆意袭击路人，打劫商队，使得我们的商业贸易遭到了严重的破坏。"
###########神子##########
INA_fox_government:0 "八重政府"
INA_fox_government_desc:0 "神子领导下的新稻妻政府，更侧重于和平外交和文化宣传"
INA_fox_public:0 "八重堂"
INA_fox_public_desc:0 "神子所创办的八重堂，是全稻妻最大的出版社。现在八重堂也将承担稻妻一切的新闻和宣传任务。"
INA_yae_thoery:0 "移动防线"
INA_yae_thoery_desc:0 "八重神子大人在军事上讲究缓慢而坚定的推进，这使得我们的部队进攻缓慢，但难以阻挡。"
INA_infantry_line:0 "步兵生产线优化"
INA_infantry_line_desc:0 "专注于步兵，这将在一定程度上优化我们的步兵装备生产线"
INA_infantry_focus:0 "步兵装备升级"
INA_infantry_focus_desc:0 "在步兵武器制作中创造性的改良了玉钢的掺入比例与掺入手法，这使得它们更加坚固。"
INA_yae_mobilizaton:0 "八重动员令"
INA_yae_mobilizaton_desc:0 "八重神子在防御工事和步兵装备上优化的投入，最终达成了一体化设计，我们能同时提升我们的防线建设与步兵装备。"
INA_heavydesigner:0 "神里经津流"
INA_thegreatwin:0 "士气高涨"
INA_thegreatwin_desc:0 "雷电将军鼓舞了我们的将士，这让我们的军队士气高涨。"
INA_industrial_focus:0 "工业投资"
INA_industrial_focus_desc:0 "我们在工业上追加了投资，这让我们的工厂建设速度加快了"
INA_militaryindustrialfocus:0 "焦点军工"
INA_militaryindustrialfocus_desc:0 "我们聚焦在军事工业上，这让我们的军事工业建设速度大大的加快了"
INA_complexindustrialfocuss:0 "焦点民工"
INA_complexindustrialfocus_desc:0 "我们聚焦在民用工业上，这让我们的民用工业建设速度大大的加快了"
    ##  :0 ""
 # _desc:0 ""
INA_ironways:0 "总后勤部"
INA_ironways_desc:0 "后勤乃是大军之足，无后勤则军队无立足之处，让补给以最快的速度，送到它应该到达的位置，就是总后勤部的职责。"
INA_baldemaster:0 "免许皆传"
INA_baldemaster_desc:0 "免许皆传，乃是稻妻剑术的最高级别，意为不需要经过他人的允许即可自立宗门，传授剑道，而将军大人，在所有的武艺方面，全部都是，免许皆传。"


######################核电站###########
INA_nuclear_fusion_calm:0 "御影炉心-良好"
INA_nuclear_fusion_calm_desc:0 "御影炉心目前的工作状态非常的稳定，这为我们带来了大量的工业加成。"
INA_nuclear_fusion_normal:0 "御影炉心-正常"
INA_nuclear_fusion_normal_desc:0 "御影炉心目前的工作状态还算正常，这为我们带来了一定量的工业加成"
INA_nuclear_fusion_stable:0 "御影炉心-稳定"
INA_nuclear_fusion_stable_desc:0 "御影炉心目前的工作状态还算稳定，这为我们带来了少量的工业加成。"
INA_nuclear_fusion_unstable:0 "御影炉心-不稳"
INA_nuclear_fusion_unstable_desc:0 "御影炉心目前的工作状态不太稳定，这为我们带来了少量的工业减成。"
INA_nuclear_fusion_rage:0 "御影炉心-暴走"
INA_nuclear_fusion_rage_desc:0 "御影炉心目前的工作状态非常糟糕，我们必须立刻稳定下它，否则它随时可能融毁。"
INA_nuclear_fusion_boom:0 "御影炉心-融毁"
INA_nuclear_fusion_boom_desc:0 "已经没有什么御影炉心了，可能也没有什么稻妻了，整个反应堆已经彻底融毁，过载的雷元素席卷了稻妻的每一寸土地。这里已经是彻底的废土了。"
########珊瑚宫#######
SAN_Too_young:0 "年轻的领袖"
SAN_Too_young_desc:0 "作为海祈岛的领袖，心海太过年轻和稚嫩，过于繁重的压力让她不堪重负，以至于经常需要逃离工作岗位，躲藏到她自己的秘密基地去休息。这毫无疑问降低了工作效率。"
SAN_army_corruption:0 "鱼龙混杂"
SAN_army_corruption_desc:0 "为了对抗幕府的优势兵力，我们不得不大肆扩编反抗军，这让我们得以拥有足以与幕府抗衡的军队，但是，这也让我们的军队中混入了太多太多的渣滓，逃亡的海寇，被通缉的罪犯，幕府的间谍，甚至还有愚人众的奸细！"
SAN_planingtoomuch:0 "智计百出"
SAN_planingtoomuch_desc:0 "心海大人因为不通军事，所以每当大战将至之时，就会夙兴夜寐勤勉的查阅各种璃月小说，然后做出了厚厚的锦囊妙计交给前线的将士们。对此五郎大将感慨到：不知三军之权，而同三军之任，每到关键时刻，总是直接干预指挥，完了，完了。。"
SAN_worker_shortage:0 "圣土化的危机"
SAN_worker_shortage_desc:0 "圣土化，这一伴随着海祁岛的致命而又无法驱逐的危机。为了治愈土地的圣土化，我们需要每百年进行一次圣血珊瑚的采集，而如今圣土化又一次扩散开来，但我们却抽不出足够的人手去采集圣血珊瑚。这使得我们的产能极大的被损害了。"
SAN_devalue_the_inmuase:0 "敌人的破坏"
SAN_devalue_the_inmuase_desc:0 "那些混在我们军队中的败类，奸细和间谍，他们无恶不作，极大的破坏了我们的军队形象，这让我们对于占领地区的统治变得更为困难了。"
SAN_liyue_support:0 "璃月援助"
SAN_liyue_support_desc:0 "璃月港为我们提供了许多军事和经济援助，这为我们带来了许多优势，但不幸的是这些援助很快就要消耗殆尽了。"

################稻妻内战########
 Great_Depression_of_INA:0 "残暴背信的反抗军"
 genshin_noun:0 "背信者"
 INA_News.1.t:0 "人间惨剧"
 INA_News.1.d:0 "今日稻妻幕府宣称：珊瑚宫叛军占领了八酿岛之后，不但没有给当地居民带来任何他们所宣传的自由，反而大肆破坏八酿岛镇压崇神的镇物，致使整个八酿岛沦为这些不法之徒的乐园，而他们的目的是为了释放被斩杀的邪神奥罗巴斯的怨念。这些狂热的邪教分子，只会破坏而不懂得建设，且毫无荣辱之心，正是因为如此，这些叛乱分子在破坏了将军恩赐他们的珊瑚岛之后，又意图染指八酿岛。"
 INA_News.1.a:0 "一群可耻败类！"
 INA_News.1.b:0 "一派胡言！"
 INA_News.1.c:0 "稻妻的内战灾难"
 INA_News.2.t:0 "御前军事会的重组"
 INA_News.2.d:0 "今日，稻妻幕府展开新闻发布会，为了应对叛军越发猖狂的攻势，天领奉行大将九条裟罗奉命重整军事，重新组建名为御前军事会的军事机构。"
 INA_News.2.a:0 "让我们重整旗鼓。"
 INA_News.2.b:0 "不过是痴心妄想。"
 INA_News.2.c:0 "让我们拭目以待。"
 INA_News.3.t:0 "海寇剿灭宣言"
 INA_News.3.d:0 "今日，九条大将，万国商会会长，以及社奉行家主在发布会上做出重要讲话。万国商会会长指出；海盗，不剿不行啊，你想啊，你带着老婆孩子，出了海，吃着火锅唱着歌，突然，就让海盗劫了，所以，没有海盗的日子，才是好日子。九条大将则表示一定会肃清稻妻附近的所有可能的海盗藏身点，还稻妻民众海河晏清。"
  INA_News.3.a:0 "出发！剿匪！。"
 INA_News.3.b:0 "不过是徒劳无功。"
 INA_News.3.c:0 "让我们拭目以待。"
 INA_News.4.t:0 "海寇诏安宣言"
 INA_News.4.d:0 "今日，九条大将，万国商会会长，以及稻妻附近最大的海寇团伙在发布会上做出重要讲话。万国商会长指出；海贼，其实是可以诏安的，你想啊，如果不是那些叛军，抢了他们的粮食和住所，谁又愿意和伟大的幕府对抗呢，所以，幕府为了民众的安居乐业诏安了海贼。\n自今日起，凡是愿意归顺幕府的海贼，以往罪行，一笔勾销。"
 INA_News.4.a:0 "驱虎吞狼！。"
 INA_News.4.b:0 "当心搬石砸脚。"
 INA_News.4.c:0 "让我们拭目以待。"
 INA_News.5.t:0 "稻妻和平宣言"
 INA_News.5.d:0 "今日，随着和平条约的签署，漫长的稻妻内战终于结束了。幕府方面宣布在内战结束之后，该为过去战争中的功臣们论功行赏了。"
 INA_News.5.a:0 "久违的和平！。"
 INA_News.5.b:0 "久违的和平！"
 INA_News.5.c:0 "就这么结束了？"
 INA_News.6.t:0 "八重幕府"
 INA_News.6.d:0 "今日，幕府经历了长期的内部整顿之后，出现在发布会上的，竟然是八重宫司大人，如今的八重宫司依靠着将军大人的宠爱已然大权独揽，整个幕府上下已然是八重神社和社奉行的天下。"
 INA_News.6.a:0 "八重宫司大人！将军大人！。"
 INA_News.6.b:0 "居然会是她？"
 INA_News.6.c:0 "意料之外的结果"
  INA_News.7.t:0 "稻妻军政府"
 INA_News.7.d:0 "今日，幕府经历了长期的内部整顿之后，出现在发布会上的，是九条裟罗大人，如今的幕府权威尽失，在军队中威望极高的九条裟罗大将得到将军大人的肯定，也是情理之中，但毫无疑问的是，稻妻幕府接下来的行为恐怕会如九条裟罗的军事风格一样严酷无情。"
 INA_News.7.a:0 "将军大人英明！。"
 INA_News.7.b:0 "是她？倒是不意外"
 INA_News.7.c:0 "意料之中的结果"
   INA_News.8.t:0 "神明再现！"
 INA_News.8.d:0 "今日，幕府经历了长期的内部整顿之后，出现在发布会上的，竟然是将军大人本尊！如今的稻妻危机四伏，但将军大人没有抛弃她的民众，而是亲自出山。毫无疑问的是，这给整个稻妻的动乱局势加上一枚压舱石。"
 INA_News.8.a:0 "将军大人英明！。"
 INA_News.8.b:0 "是她？令人意外"
 INA_News.8.c:0 "稻妻局势变得有趣了。"
 INA_News.9.t:0 "神明再现！"
 INA_News.9.d:0 "今日，幕府经历了长期的内部整顿之后，出现在新闻发布会上的，竟然是将军大人本尊！如今的稻妻危机四伏，皆是因为小人作乱，各级官僚腐败无能，将军忍无可忍，决定亲自出山，而令人惊骇的是，在新闻发布会上，将军直接以雷霆的神威斩杀了四名小人，毫无疑问的是，稻妻接下来的局势绝不会太平。"
 INA_News.9.a:0 "常道恢宏，鸣神永恒！。"
 INA_News.9.b:0 "令人意外的残酷"
 INA_News.9.c:0 "快刀斩乱麻。"
 
 ################稻妻幕府########
INA_Too_young:0 "年轻的领袖"
INA_Too_young_desc:0 "前任巫女逝去得太过突然，以至于我们的新任巫女还没有完成全部的学习就被迫承担起领导整个海祈岛的重担。"
INA_huaping:0 "名义统治"
INA_huaping_desc:0 "雷电将军，全稻妻的最高统治者，但是普通民众已经接近一百年没有见过将军了，实际上朝纲完全由三奉行把控。"