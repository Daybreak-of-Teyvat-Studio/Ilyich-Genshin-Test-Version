Gunnhildr:0 "古恩希尔德议事会"
Gunnhildr_desc:0 "彼时蛮荒的蒙德冰原，古恩希尔德是流民中最强大的部族首领。古恩希尔德的父亲曾是迭卡拉庇安的部属。他对孤王乖戾的暴政忍无可忍，率部族逃离了狂风咆哮的古城。但城墙之外的荒芜之地难以生存，出走的流民尽管逃脱了暴君的爪牙，却很快被困在了无尽的风雪中。正当族人陷入绝境的时刻，千风之中的精灵听到了古恩希尔德的祈祷。就这样，族长年幼的女儿虔诚的求告与流民们被风雪掩盖的呼声凝结成为信仰。信仰集聚在风之精灵的身边，如同流水汇入清泉，为风之精灵带来力量。就这样，他为这一支部族提供了小小的庇护所，又将守护的力量分予族长的女儿。父亲去世后，古恩希尔德成为了这支无名部族的族长与首位女祭司，自此至终守护着族人。"

 Zhongli:0 "摩拉克斯"
 Zhongli_desc:0 "§Y千年未曾易世之君§!\n§g岩王帝君统治璃月的时间早已达到了千年，尽管俗世变幻万千却帝君依旧屹立不倒，让百姓去推翻这位“千年之君”显然有不小的难度。§!\n原初的七神，只剩下了风岩二位，而存活又兢兢业业管理自己国度的原初之神，似乎只剩下了璃月的岩神摩拉克斯。在守护璃月苍生千年之后，古老的岩神似乎终于意识到自己无法再对抗“磨损”，他需要一个考验璃月的机会——考验七星和与自己出生入死的诸位仙人，来判断璃月是否能离开自己。而这个机会，随着愚人众在璃月境内的活动愈发猖獗，终于到来了......"

 Raiden:0 "雷电将军"
 Raiden_desc:0 " 在初代雷神巴尔陨落后，为了追求无上的永恒，雷电将军颁布了著名的锁国令和眼狩令，不知巴尔已死的人们很是诧异那位雷神大人会用不近人情的执行手段，以及对天领奉行和勘定奉行的腐败与骄奢的容忍，如果说这些是被默许的，那么将军对于愚人众的渗透和海祇岛的叛军也不做反应就彻底叫人无法理解了。不管人们私下如何评论雷电将军，她也依旧只是像程序一样，死死地把握着锁国令和眼狩令，不曾松懈。"
 Jean:0 "琴_古恩希尔德"
 Jean_desc:0 "出自蒙德三大贵族的古恩希尔德家，琴也秉承着家族永护蒙德的祖训，在骑士团大团长法尔伽带队远征后担起了代理团长的担子，日夜操劳，事无巨细一并都要亲自处理。不管是骑士团的同僚还是蒙德城的居民，无一不对其表示最真诚的敬意，也担忧她无法承受如此高强度的工作，但是没有人能替代她，所有人只能尽量减少她的工作量，而最近的龙灾和愚人众的不断施压，似乎叫这一切的减压努力统统白费了......"
 NingGuang:0 "凝光"
 NingGuang_desc:0 "珍如宝钻，远如星幽。凝光是掌管重权的璃月七星之一，居天权星之位，识人心，擅话术。即使在人人经商的璃月港，她也是首屈一指的大商人。每个见过凝光的人都会被她惊人的洞察力与过人的头脑折服。不仅如此，凝光的作风也极为独特。她斥巨资搜集来大量浮空石制成基盘，又在其上建造出一座空前华美的宫殿。浮空石托起空中幻城，使之终年悬浮在璃月港上空。这座宫阁正如凝光本人一般，高不可测，远离众生，却轻易吸引了所有目光。震动商界的女富商、孩子们最喜欢的温柔姐姐、玉京台宴会上的名媛、甜食界的鉴赏名家……她是千面佳人，也是一个永远无法读懂的美丽谜题。"
 King_of_the_Millennium:0 "千年未易之君"
 Ganyu:0 "甘雨"
 Ganyu_desc:0 "饮必甘露，食必嘉禾。循循如仪，不罹罗网。饮必甘露，食必嘉禾。循循如仪，不罹罗网。对于高居玉京台的七枚明星来说，甘雨绝非服侍他们伴星，而是璃月港错综情报数据之网的统筹者，璃月港行政效率的筑基人。繁杂的会议纪要、冗乱的报表数据……每日成堆的文书恍如流水，皆由她一手整编成晓畅明晰的文字，用以辅助七星的每一个决策与每一次协商，指示各部机构的流转。千百年的时光里，历任七星不停更迭，唯有甘雨始终见证着璃月港的繁华烟火。血脉中人的一面令她留连绚烂的灯市，仙的本性亦使她怀念仙山与洞府的幽闲。在半人半仙的甘雨眼中，熙攘的人海与幽鸣的群峰，究竟何者才更堪称归宿？"
 Shenhe:0 "申鹤"
 Shenhe_desc:0 "红尘渺渺，因果烟消。申鹤本是驱魔世家旁系之子，出于一些原因被留云借风真君收养。对申鹤来说，留云借风真君是一位博学健谈的师父。对留云借风真君来说，申鹤也是她指点过的人类中最特别的那个。以人类之身与仙家一同生活并非易事，但申鹤体质特殊、意志过人，又极有仙术天赋，很受众仙家认可。不过，长年累月修行加上吃仙草、饮山露的生活习惯，让她离人间的生活越发遥远，甚至被当成过神秘的白发仙人。性格中偶然流露出的锋芒与身上绑缚的红绳，也为她的神秘再添一笔。若把她的过去写成故事，想必会有多个版本。天上仙女也好，白发魔头也罢，人们将如何看待这个神秘的女子？而掩藏在她身上的秘密与真心，也如山间云雾一般难以捕捉。"

 Keqing:0 "刻晴"
 Keqing_desc:0 "霆霓之势，变革之星。璃月七星之一，玉衡星，刻晴。她对帝君一言而决的璃月颇有微词——但实际上，神挺欣赏她这样的人。身为璃月七星，刻晴是个不折不扣的行动派。如果一件事在她看来是有价值、有必要的，那她一定会亲力亲为。比如，她曾亲自踏遍璃月全境，将地势地貌牢记于心，以便日后能够最大限度地利用每一寸土地。刻晴随时关注着璃月境内的大小事情，岩王帝君每年却只降临一次。数千年繁华的历史，已经证明追随帝君的脚步是正确之举，但刻晴对此则始终抱有顾虑——眼下璃月港的繁荣，就像沙滩上的宏伟沙堡。决定大海是否涨潮的，却不是人类自己。帝君已经守护了璃月千年，但下一个千年，十个千年，一百个千年，也会是如此吗？正是这个得不到回答的问题，让刻晴不断努力，丝毫不敢放松。在旁人看来，这是多余的担忧，但刻晴无法对这一潜在的隐患坐视不理。这是璃月人未曾设想过的未来……可总有人要走在时代最前沿，亲手开创新的道路。玉衡星刻晴，自然当仁不让。"
 
 Yelan:0 "夜兰"
 Yelan_desc:0 "渺渺天地间，幽客自去来"
 
 Ying:0 "荧"
 Ying_desc:0 "从世界之外漂流而来的旅行者，被神带走血亲，自此踏上寻找七神之路。"
 Traveller_desc:0 "从世界之外漂流而来的旅行者，被神带走血亲，自此踏上寻找七神之路。"
 Paimon_desc:0 "应急食品、储备粮、吉祥物、会说话的小仙灵、会飞的神秘宠物、神奇海鲜、外置器官、派毛、屑派蒙、两脚但不用脚的小东西。"

 Yoimiya:0 "长野原宵宫"

 Ayaka:0 "神里凝华"

 Kokomi:0 "珊瑚宫心海"

 Eula:0 "优菈·劳伦斯"
 Eula_desc:0 "作为西风骑士团「游击小队」的队长与声名显赫的「浪花骑士」，优菈长期率部在外巡逻，斩获过诸多功勋。驻扎在高山深涧中的骑士们时常成为魔物的突袭目标，优菈能用最为迅速的支援排除险情，化解危机，她也屡次率队主动进攻，捣毁深渊教团的据点，将阴谋扼杀于萌芽状态。可优菈的身世尤为特殊，诸多矛盾盘根错节——她是劳伦斯家族的末裔，被蒙德民众视为罪人之血的具象。这样的她却在多年前与家族决裂，加入了西风骑士团。碍于难以消除的偏见，优菈并未得到公正的对待。在蒙德民众眼里，她始终是「外人」，甚至——「危险人物」。多年来的经历促使优菈塑起无形之盾，保护自己免受无妄之灾。「复仇」一词，或许是这面盾牌最为外显的一角。唯有抛去流言蜚语，试着接受她待人处世的逻辑，才能认识到这位少女复杂外壳下的原貌吧。"

 Amber:0 "安柏"

 Diluc:0 "迪卢克"

 Sara:0 "九条裟罗"

 Neko:0 "寝子"
 Neko_desc:0 "神社看起来比以前好多了，奴家的毛毛也变柔顺了，喵喵。"
 Book_ASA:0 "神社看起来比以前好多了，奴家的毛毛也变柔顺了，喵喵。"
 Itto:0 "荒泷一斗"
 Itto_desc:0 "花坂之鬼，豪情快意：身体里流淌着鬼族之血的快意男儿，曾经活跃在稻妻城花见坂的荒泷派初代目头领，现因被天领奉行通缉，被迫隐居鹤观岛。什么，从没听说过荒泷派？你是想找茬吗？"

 Eula_desc:0 "于旋舞之时，斩断罪人的枷锁。作为西风骑士团游击小队的队长与声名显赫的浪花骑士，优菈长期率部在外巡逻，斩获过诸多功勋。驻扎在高山深涧中的骑士们时常成为魔物的突袭目标，优菈能用最为迅速的支援排除险情，化解危机，她也屡次率队主动进攻，捣毁深渊教团的据点，将阴谋扼杀于萌芽状态。可优菈的身世尤为特殊，诸多矛盾盘根错节——她是劳伦斯家族的末裔，被蒙德民众视为罪人之血的具象。这样的她却在多年前与家族决裂，加入了西风骑士团。碍于难以消除的偏见，优菈并未得到公正的对待。在蒙德民众眼里，她始终是外人，甚至——危险人物。多年来的经历促使优菈塑起无形之盾，保护自己免受无妄之灾。复仇一词，或许是这面盾牌最为外显的一角。唯有抛去流言蜚语，试着接受她待人处世的逻辑，才能认识到这位少女复杂外壳下的原貌吧。"

 Amber_desc:0 "侦察骑士安柏，准备就绪！此奖杯授予安柏，以纪念她让人敬佩的飞行大赛三连冠，愿她的热情在风中永不熄灭。——蒙德酒业行会执行主席埃泽。"

 Diluc_desc:0 "我会一直前行，直到黎明到来。迪卢克老爷是瓶佳酿，不过加冰太多。在蒙德城，人们热爱酒。一天辛劳后，一杯美酒是最好的犒赏。但当美酒入喉，遍地都是再喝下一杯的理由。但是，作为蒙德最大酒庄晨曦酒庄的庄主，迪卢克老爷却总是滴酒不沾。当有人向他问询，得到的回答却永远是一抹礼貌又神秘的微笑。"
 
 Sara_desc:0 "迅雷烈风，飞光万顷。天领奉行现役大将。杀伐果断，骁勇善战。若说将军大人是高天之上的鸣雷，九条裟罗便是难以防备的闪电。闪电先行，尔后必有骇人雷鸣。身为九条家的养子，她向来以官方态度对外。雷厉风行、不苟言笑……人们对九条裟罗的印象大抵如此。然而，这位背负着臣子职责，以忠义为己任的战将并非外表所见那般冷漠，而是决意要让自身好恶悲喜为大义让步，才亲手选择了割舍一部分心灵。对她而言，辅助将军大人实现永恒才是最首要的。纵使知道终点不会有自己的身影，也在所不惜。——胜利将会属于我们所有人，哪怕战场上最后剩下的不是我也好。假如人只能有一个愿望，这便是九条裟罗的愿望。藏在她冷峻外表下的，是一颗炽热如暗火、跃动如幽雷的心。"
 Kokomi_desc:0 "奇策百计，决胜千里。海祇岛的现人神巫女，即——海祇岛最高领袖。人们普遍认为珊瑚宫心海是一名足智多谋、深不可测的领导者。因为她脸上总是带着恬静的笑容，谈笑间将所有事务安排得井井有条。心海自幼通读各国兵书，军略才能出色，擅以奇策算计对手。海祇岛在人力物力上都不占优势，多亏心海布置的各种战术，才能多次转危为安。而在内政、商业、外交、监察等各个领域，心海也会尽自己所能做到最好。这些功绩令她深受海祇岛各方势力的信赖。放心，有珊瑚宫大人在，这句话也成为了海祇岛民众时常挂在嘴边的话语。但其实，很少有人知道心海从前最大的梦想不过是做一个隐于幕后的军师。对她来说，与人聊天是极度消耗能量的事，每次演讲会不自觉地手抖，面对繁重的工作也会有退缩的念头。每天她最快乐的事情，就是完成工作后宅在家里，捧一本心仪的兵书独自研究。年少登高位，对许多人而言都是莫大的幸运。可对心海来说，越在高处，越是如履薄冰。"

Albedo:0 "阿贝多"
Albedo_desc:0 "无垢之土，创生原初之人。在炼金术方上造诣极深，却不轻易说出事物的本质。穿行在对真理一知半解的凡人间，示其以恰到好处的真诚与和善。彬彬有礼，气质高雅。表面上疏于交际，其实并不吝于伸出援助之手。如果认可你这位朋友，即便相识不久，他也会在百忙之中抽时间为你绘制精美的肖像画。西风骑士团首席炼金术士阿贝多，正是这样一位神奇少年。从蒙德居民到骑士团成员，无不为他的学识所折服。天才、白垩之子或调查队长……他不怎么在意称号和名望，只专注于研究课题。财富和人脉不是他的目标。他渴望驾驭的，是从古到今深藏于人类头脑中的无上知识。"
 Diona:0 "迪奥娜"
 Diona_desc:0 "猫尾酒馆的超人气调酒师，蒙德酒业的超新星，传统势力的最大挑战者——这便是蒙德酒客们眼中的迪奥娜。可是这位清泉镇出身的猫耳猫尾少女，却一直以酒业杀手的名号自诩。包括她调酒的技艺，也根本就是我真的在努力破坏那杯讨厌的液体了。这种微妙的矛盾，源自于迪奥娜那说不清是被祝福还是被诅咒的体质，只要经迪奥娜之手调制过的酒类，都会变成难以想象的美味佳酿。然而迄今为止，对酒无比厌恶的她还没有想要放弃，调出无比难喝的酒，以一己之力摧毁蒙德酒业，依旧是调酒师迪奥娜孜孜不倦追求的目标。"
 Barbara:0 "芭芭拉"
 Barbara_desc:0 "芭芭拉是西风骑士团的祈礼牧师。 她用水元素治疗伤口，用歌声舒缓人们疲惫的心。在蒙德人的心里，芭芭拉拥有着神奇的魔法，能将患者的身心全都治愈——而在芭芭拉的心中，这种魔法名叫切实的努力。"
 Albedo:0 "阿贝多"
 Albedo_desc:0 "无垢之土，创生原初之人。在炼金术方上造诣极深，却不轻易说出事物的本质。穿行在对真理一知半解的凡人间，示其以恰到好处的真诚与和善。彬彬有礼，气质高雅。表面上疏于交际，其实并不吝于伸出援助之手。如果认可你这位朋友，即便相识不久，他也会在百忙之中抽时间为你绘制精美的肖像画。西风骑士团首席炼金术士阿贝多，正是这样一位神奇少年。从蒙德居民到骑士团成员，无不为他的学识所折服。天才、白垩之子或调查队长…他不怎么在意称号和名望，只专注于研究课题。财富和人脉不是他的目标。他渴望驾驭的，是从古到今深藏于人类头脑中的无上知识。"
 
 
 #character
ANR_Bennett:0"班尼特"
ANR_Bennett_desc:0"班尼特是一名热情而善良的蒙德少年，梦想成为伟大的冒险家。可是，他却始终被「不幸」所纠缠。无端的山石崩塌，超乎常理的强敌，还有永远空手而归的结局。不过，这些并不能让班尼特气馁。他依旧坚持冒险，在看似无止境的「不幸」中锻炼着自己。乌鸦奥兹称赞班尼特伤痕累累的强韧身躯，法尔伽对他无视痛楚的战斗方式充满好奇…就连总是与伤病员打交道的芭芭拉，也为他治疗脱臼的娴熟手法感到惊讶。想成为伟大的冒险家，就连这份「不幸」都要拿来当作踏脚石。这就是未来的伟大冒险家——少年班尼特心中所想。"
ANR_Fischl:0"菲谢尔"
ANR_Fischl_desc:0"异世界「幽夜净土」的断罪之皇女——菲谢尔，携暗之眷属夜鸦，应命运的召唤，降临于提瓦特大陆。菲谢尔向每个冒险家协会成员都是这么介绍自己的。因为能与乌鸦奥兹共享视觉，菲谢尔顺利进入了冒险家协会，成为了一名调查员。一开始为了听懂菲谢尔所说的话语，协会成员们可是费了不少功夫。好在经过不懈努力，加上奥兹的辛勤翻译，大家最终明白了菲谢尔的语言。这位举止发言与众不同的调查员侦察迅速，给出的情报也十分准确，这让她渐渐赢得了大家的信赖。"
ANR_Diona:0"迪奥娜"
ANR_Diona_desc:0"「猫尾酒馆」的超人气调酒师，蒙德酒业的超新星，传统势力的最大挑战者——这便是蒙德酒客们眼中的迪奥娜。可是这位清泉镇出身的猫耳猫尾少女，却一直以「酒业杀手」的名号自诩。包括她调酒的技艺，也根本就是「我真的在努力破坏那杯讨厌的液体了」。这种微妙的矛盾，源自于迪奥娜那说不清是被「祝福」还是被「诅咒」的体质，只要经迪奥娜之手调制过的酒类，都会变成难以想象的美味佳酿。然而迄今为止，对酒无比厌恶的她还没有想要放弃，调出无比难喝的酒，以一己之力摧毁蒙德酒业，依旧是调酒师迪奥娜孜孜不倦追求的目标。"
ANR_Razor:0"雷泽"
ANR_Razor_desc:0"北风的领主安德留斯素有收留流浪者、收养弃婴的传统。狼少年与狼群一起生活。狼少年被大团长法尔伽发现，法尔伽给他取了雷泽这个名字。丽莎则是雷泽的师父。法尔伽给了雷泽铁的爪子（大剑），丽莎给了他使用雷的牙（神之眼）的方法。至于在蒙德，则有关于一名少年的传闻。那名少年时刻与狼为伴，矫健地在树林之中奔猎，很少有人能接近他，他也从不靠近人类。在坊间的传闻里，有人说他是被狼收养的弃婴，有人说他是狼灵的化身。这些猜测都为这位狼少年蒙上了一层神秘的色彩。而狼少年，雷泽本人，今日依旧站在山岗上，和待他如卢皮卡的狼群一起，沐浴着温暖的阳光。"
