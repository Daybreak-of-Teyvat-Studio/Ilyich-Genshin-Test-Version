 #################### 民族精神 ####################
 SUM_Neo_Wise_Land:"智慧之国"
 SUM_Neo_Wise_Land_desc:"须弥这国不靠刀兵立身，靠的是一肚子学问。教令院掌着书、掌着课，也掌着哪句话算对。市井里吵架，末了总要抬出一句：教令院是这么说的。一句话能定是非，这权就比刀还重。"
 SUM_Neo_Akasha_Dependence:"依赖虚空"
 SUM_Neo_Akasha_Dependence_desc:"须弥人头上都戴着一枚终端，遇事不问自己，先问它。路怎么走，药怎么配，连亲事该不该成，也要等它答一句。有个老妇不肯戴，儿孙都笑她痴。她只说，我想的事还不及它一夜想的多。"
 SUM_Neo_Imprisoned_God:"被囚之神"
 SUM_Neo_Imprisoned_God_desc:"净善宫的门常年关着，门里锁着须弥的神。教令院的公文，落款都写她的名字，念出来时人人低头。有个小吏送公文进去，回来跟人说，只看见一扇屏风，屏风后头坐着个人影，一直没动。"
 SUM_Neo_Sage_Oligarchy:"贤者寡头"
 SUM_Neo_Sage_Oligarchy_desc:"六大学派各有一位首座，加上大贤者，七个人坐在议事厅里。表面上有商有量，桌底下却各打各的算盘。今日你压我一头，明日我在课上驳你一句。散会时都拱手作别，转过廊柱，脸色就换了。"
 SUM_Neo_Desert_Grievance:"沙漠的旧怨"
 SUM_Neo_Desert_Grievance_desc:"单说雨林与沙漠的旧账，要从几百年前算起。沙漠那边说祖上被赶出了绿洲，雨林这边说当年是他们先动的手。两边各有一本账，翻出来记得清清楚楚，就是数目对不上。路上遇见只当没看见。"
 SUM_Neo_Fatui_Influence:"愚人众渗透"
 SUM_Neo_Fatui_Influence_desc:"造神计划里的图样、机件、药剂，样样都过了多托雷的手。他来得不勤，一封信却能改三道工序。教令院的人心里明白，这神造出来，头一个听谁的还未可知。可箭已在弦上，收不回来了。"
 SUM_Neo_Genesis_Project:"造神计划"
 SUM_Neo_Genesis_Project_desc:"教令院要造神，造的不是供在庙里的神，是能听号令的神。这话说出去没人信，可工坊里的架子已经立起来了。大贤者在厅上说，神若不能听人的话，供它何用。满座低头，谁也不敢接这一句。"
 SUM_Neo_Exhausted_Treasury:"国库空虚"
 SUM_Neo_Exhausted_Treasury_desc:"这几年又是修路，又是造神，又是养兵，库房里的摩拉一箱一箱往外抬。管账的翻开簿子，前年的进项还剩三成，去年的只剩一成。有人提议加税，有人提议裁人，议到天黑也没议出个所以然。"
 SUM_Neo_Forest_Watch:"雨林守望"
 SUM_Neo_Forest_Watch_desc:"巡林队守的不是城墙，是林子的边。他们认得哪条水往哪流，哪片林不能砍。提纳里带着人一趟趟走，走到死域边上便停下，插一根木牌。须弥人吃的粮，一半出在雨林，这队人守的就是饭碗。"
 SUM_Neo_Eremite_Host:"旅团在侧"
 SUM_Neo_Eremite_Host_desc:"镀金旅团的人不认旗号，只认摩拉。谁的钱袋沉，枪口就朝谁指。有商人雇他们护送，走到半路又有人出双倍的价，他们便掉头把商队围了。那商人喊，我给过钱了。领头的说，他给得更多。"
 SUM_Neo_Crowned_God:"加冕之神"
 SUM_Neo_Crowned_God_desc:"净善宫的门开了，小吉祥草王走了出来。那一日城中静得出奇，连集市也收了摊。教令院的人跪在阶下，把头埋得很低。自此公文头一句改了，不再是教令院议定，而是神谕如此。"
 SUM_Neo_Dream_Return:"梦之归来"
 SUM_Neo_Dream_Return_desc:"那一夜，须弥城的人睡下之后，头一回各自做了梦。有人梦见旧屋，有人梦见死去的亲人，醒来枕上湿了一片。次日集市上互相问，你梦见什么了，说完都笑，笑着笑着又不说了。"
 SUM_Neo_Aranara_Pact:"兰那罗之约"
 SUM_Neo_Aranara_Pact_desc:"兰那罗在林子里唱着歌，把一支新芽交到人手里，这盟便算立了。它们说话旁人听不懂，可那支芽插进土里，第二日就长了一寸。巡林官蹲在旁边看了半日，说这些小家伙记性比人长。"
 SUM_Neo_World_Tree_Boon:"世界树的恩泽"
 SUM_Neo_World_Tree_Boon_desc:"世界树的根须从地底盘过来，穿过雨林，一直伸到沙漠的边上。所过之处，井水回甜，枯枝发芽。有老人跪在树根前烧香，被巡林官劝起来，说这不是神像，是活的。老人说，活的才该拜。"
 SUM_Neo_Greenery_Eternal:"万绿常青"
 SUM_Neo_Greenery_Eternal_desc:"这几年雨林一年比一年密，路被藤蔓吞了，观测台也塌在树里。学者起初还去丈量，后来连路都找不着便不去了。鸟兽不怕人了，坐在枝上看人走过。有人说这是退步，提纳里说不必退不必进。"
 SUM_Neo_Seal_Complete:"封渊完成"
 SUM_Neo_Seal_Complete_desc:"须弥与那些不该碰的东西之间，如今隔着一整片雨林。林子密得连风都绕着走，深处的水潭终年不见日头。有胆大的想穿过去看看，走到第三日便折回来，说再往前就没有路了。"
 SUM_Neo_Shadow_Sealed:"拒斥深渊"
 SUM_Neo_Shadow_Sealed_desc:"单说世界之外有声音传来，一声一声，像有人敲门。草神坐在宫中，抬起手，那声音便断了。她没有解释，也不许人问。有学者在笔记里写，神听见了，只是不肯应。写完这一句，纸被他自己撕了。"
 SUM_Neo_Sacred_Court:"神前议政"
 SUM_Neo_Sacred_Court_desc:"六大学派的首座依次进殿，一个个捧着卷子，跪在阶下念。念到要紧处，座上的人便问一句，问得极细，答不上来的便出汗。散朝时众人退出殿门，谁也不看谁，各自把卷子卷紧了。"
 SUM_Neo_Green_Guard:"翠绿卫队"
 SUM_Neo_Green_Guard_desc:"这一队兵不守城，只守林。甲上缠着藤，刀鞘插着新折的枝，走路不出声。遇着偷伐的，先劝，不听便把人绑在树下，等巡林官来发落。有商人笑他们不像兵，队正说，本来就不是兵。"
 SUM_Neo_Memory_Faded:"被抹去的记忆"
 SUM_Neo_Memory_Faded_desc:"世界树上少了一段，谁也说不清少了什么。账本上明明记着一笔，翻到那一页却是空白。有几个老人半夜坐起来，说梦见一个人，脸看不清，名字就在嘴边。天亮之后再问，他们都摇头。"
 SUM_Neo_Republic_Charter:"共和宪章"
 SUM_Neo_Republic_Charter_desc:"共和的宪章立起来，头一条便写明，律法不由一人拟定。从此议事厅里要多议三遍，议定了还要张贴出去，任人指摘。有老学者不惯，说这样办不成事。年轻的说，办不成就慢慢办。"
 SUM_Neo_Scholar_Council:"学派议事会"
 SUM_Neo_Scholar_Council_desc:"六大学派自此同席，不分高低，一人一票，议定了才算数。头一回议事，为一句措辞争了整日，从日出争到掌灯。散会时谁也没赢，可那一条终究改得周全了些。"
 SUM_Neo_Open_Knowledge:"知识公有"
 SUM_Neo_Open_Knowledge_desc:"教令院把书库的门开了，不论出身，肯读便可进去。头一日来了个卖鱼的少年，手上带着腥气，站在架前不敢伸手。老书吏递给他一本，说翻坏了也不打紧。少年捧着书，一直站到日头偏西。"
 SUM_Neo_Free_Press:"报章自由"
 SUM_Neo_Free_Press_desc:"议论国政的，从此可在文末署上自己名字。头几日没人敢署，稿子送来，落款一律空着。后来一个教书先生头一个写了名，第二日竟没人来拿他。此后署名的渐多，报摊上的纸一日快似一日。"
 SUM_Neo_Sumeru_Bank:"须弥银行"
 SUM_Neo_Sumeru_Bank_desc:"城里新开了银号，专借钱给做学问的。借的人要写明用途，还要找人作保。有个研究古文字的后生，借了一笔，买了纸墨，在屋里关了两年，出来抱着一摞手稿。掌事的翻了翻，说这钱没白借。"
 SUM_Neo_Ormos_Open:"奥摩斯开港"
 SUM_Neo_Ormos_Open_desc:"关口上的税则改了，外商的货不必再层层验看，交了钱便放行。头一批来的几支商队，在城外卸货，卸了整整三日。市集上的香料价落了两成，本地摊主骂了几日，后来也添了新货色。"
 SUM_Neo_Citizenship:"沙漠公民权"
 SUM_Neo_Citizenship_desc:"律法上添了一行，沙漠民与雨林人同罪同罚，不再分作两等。头一个案子是个沙民与城里人争水，判官按新律断了，各打一半。沙民出来时站在阶下看了半天匾额，说原来这字我也认得。"
 SUM_Neo_Sand_Rail:"沙海铁路"
 SUM_Neo_Sand_Rail_desc:"铁轨一节一节铺进沙漠，铺轨的工人顶着日头，把枕木一根一根砸进沙里。头一班车开出那日，沿路的人都跑出来看，孩子们追着车厢跑了半里。有老人摸着铁轨说不烫，说这东西竟不吃水。"
 SUM_Neo_Prosperity:"富庶之邦"
 SUM_Neo_Prosperity_desc:"单说这几年风调雨顺，渠也修了，谷仓一进一进地满起来。秋收那月，打谷场上晒的谷子望不到边，麻雀落下来，赶都赶不完。管仓的老吏拿着斗量，量到天黑还没量完，索性说明日再量。"
 SUM_Neo_Republic_Army:"新式陆军"
 SUM_Neo_Republic_Army_desc:"共和国的兵不与别处同，他们不吃谁的饷，只听宪章的调。校场上立着一块石碑，刻的是誓词，新兵入伍要对着它念一遍，念完了把手指按在名册上。老兵说，这支兵是给最坏的时候留着的。"
 SUM_Neo_Gilded_Commune:"镀金公社"
 SUM_Neo_Gilded_Commune_desc:"工坊与矿场收归公用，赚的摩拉按份分给做工的人。头一回分红，队伍排到街口，有人领了钱不敢信，捧在手里数了三遍。有个老矿工说，挖了三十年，头一回知道挖出来的东西值多少。"
 SUM_Neo_Sand_Equal:"沙林一体"
 SUM_Neo_Sand_Equal_desc:"沙漠与雨林的界碑撤了，两边的户籍并作一册。有沙民的姑娘嫁到林子里，嫁妆是两匹骆驼，一路走到村口，村里人放了鞭炮。老人说这是几十年没有的事。听人讲，界碑好撤，人心难并。"
 SUM_Neo_God_Made:"人造之神"
 SUM_Neo_God_Made_desc:"那神立于殿上，一声令下，它便动。教令院的人起初还怕它，日子久了只当它是一件器物，谁当值谁使唤。有一日它抬起头，看了一个人很久，那人手一抖，令符落地。此后无人再说它是器物。"
 SUM_Neo_Deshret_Reborn:"赤王归来"
 SUM_Neo_Deshret_Reborn_desc:"贤者们对外宣称，赤王的魂已附在新神身上。这话一出，沙漠那边竟安静了几日。有人从阿如村赶来，跪在殿外要看一眼，被兵丁拦下。他在门口坐了一夜，天亮时说，我看见了，便走了。"
 SUM_Neo_Dottore_Alliance:"至冬同盟"
 SUM_Neo_Dottore_Alliance_desc:"沙漠里起了几座营垒，旗子不是须弥的。至冬的人来去自由，车马不必查验，井水也紧着他们用。有沙民赶羊路过营垒，被拦下问话，放行时羊少了两只。他说给村人听，村人只叫他莫提。"
 SUM_Neo_Machine_Age:"机械之世"
 SUM_Neo_Machine_Age_desc:"工坊里换上了新机，齿轮一转，一日的活抵十人。掌事的拿着簿子点数，看谁慢便划去一个名。工人不敢停，手上磨破了裹块布接着做。有个老工人说，我做了四十年，如今倒不如一具铁架。"
 SUM_Neo_Abyss_Touched:"漆黑之力"
 SUM_Neo_Abyss_Touched_desc:"教令院库里的东西越攒越多，有几样连掌事的也叫不出名。夜里库房常有无端的风声，守库的人换了几拨，都说听见有人在里头说话。有一日封条裂了，屋里只剩一摊黑灰。"
 SUM_Neo_Iron_Law:"教令院铁律"
 SUM_Neo_Iron_Law_desc:"大贤者的敕令如今直下各城，议事厅那一关索性免了。六派首座头一回听说时还去问，问了两回，便不去问了。公文送到，他们照例画个押，画完对着窗外坐半天。"
 SUM_Neo_Secret_Police:"秘密警察"
 SUM_Neo_Secret_Police_desc:"报章上的名字一日少似一日，先是不见了两个常写时论的，后来连印书的也不见了。报摊上照旧摆着纸，翻开来看，一整版只剩些不打紧的琐事。有读者站在摊前翻了半天，把纸放下，也没问。"
 SUM_Neo_Akasha_Oversight:"虚空监控"
 SUM_Neo_Akasha_Oversight_desc:"那终端连上了官署，人说的话一句一句都进去，落成文字。有差役在会上说错一句，第二日便被叫去问。此后众人说话都先在肚里过三遍，得越来越短，短到只剩是或不是。"
 SUM_Neo_Total_Rule:"全面统治"
 SUM_Neo_Total_Rule_desc:"单说城里的粮、水、书、路，样样都归教令院管。连谁家办丧事要几炷香，也有一纸文书可依。百姓遇事先打听上头的意思，打听不着便等着。有人说这样倒也省心，可说话时眼睛看着别处。"
 SUM_Neo_Automaton_Legion:"自动军团"
 SUM_Neo_Automaton_Legion_desc:"营中列着一队铁人，不吃粮，不领军饷，站一日也不晃。号令一下，它们便向前走，倒下的不再起来，后头的接着走。督军看它们走过长街，回头对副将说，这样的兵倒是好使。副将没有应声。"
 SUM_Neo_Eternal_Regency:"永恒摄政"
 SUM_Neo_Eternal_Regency_desc:"教令院以神的名义摄政，说是暂代，待神能理事便交还。这话说了十年，神还坐在屏风后头。每逢有人提起交还，公文上便添一句：时机未到。年复一年，连说这话的人自己也不提了。"
 SUM_Neo_Forbidden_Knowledge:"掌握禁忌"
 SUM_Neo_Forbidden_Knowledge_desc:"教令院翻了那批禁书，翻出几样能用的法子，试了几回都成了，胆子便壮起来。掌事的在厅上说，禁忌不过是一门还没归类的学问。话音刚落，窗外一阵风把灯吹灭，满座默然，无人起身去点。"
 SUM_Neo_Oracle_Edge:"神谕将行"
 SUM_Neo_Oracle_Edge_desc:"城中人家的门上，近来又多了一枚草叶的记号。起初是偷偷挂，后来明着挂，再后来连官署的门楣上也挂了。教令院的人看了不作声，只叫底下把公文里的措辞改得软些。"
 SUM_Neo_Canon_Edge:"铁律森严"
 SUM_Neo_Canon_Edge_desc:"律条一月添几条，添到后来连书吏也记不全。市集上摆摊要证，走路要牌，连夜里点灯也有数目。有个卖饼的老汉被罚了钱，问他犯了哪一条，差役翻了半天簿子，说反正犯了。"
 SUM_Neo_Forest_Rangers:"巡林官扩编"
 SUM_Neo_Forest_Rangers_desc:"提纳里做了巡林官之首，头一日上任，没进衙门，先往林子里走了一趟。回来时靴上全是泥，手里捏着一片枯叶，说西边的死域又近了一步。底下的人听着，一个个把腰间的刀挪正了。"
 SUM_Neo_Gilded_Legion:"镀金军团"
 SUM_Neo_Gilded_Legion_desc:"镀金旅团新树一面大旗，旗上绣着须弥的纹样，又缀自家的族徽，风一卷两样并在一处。原来这伙佣兵认的是摩拉，也认这地界上的规矩，索性都绣上去，两面不得罪。"
 SUM_Neo_Sumeru_Navy:"须弥舰队"
 SUM_Neo_Sumeru_Navy_desc:"奥摩斯港的桅杆上，新挂起一面须弥水师的旗号，风里猎猎作响。港中船工抬头看了半晌，说这旗一挂，往后海面上再有风吹草动，众人便不再是各自逃命。港口的旗，挂的是胆气。"
 SUM_Neo_Sumeru_Airforce:"须弥空军"
 SUM_Neo_Sumeru_Airforce_desc:"须弥要练一支出奇的兵，飞行员不从行伍里挑，偏到素论派寻那班观天象的学者。这班人平日仰头看星斗，识得风云走势，如今教他们驾着飞器上天，端的合用。懂天的人方敢上天。"
 SUM_Neo_Mobilized_Nation:"全民动员"
 SUM_Neo_Mobilized_Nation_desc:"须弥一道令下，沙漠与雨林一齐抽丁，连偏僻村子也不放过。沙漠的汉子牵着骆驼来，雨林的青年背着弓前来，两下里在教令院前排成两队。这一抽，把两路人马拧成了一股。"
 SUM_Neo_General_Staff:"总参谋部"
 SUM_Neo_General_Staff_desc:"从前用兵，全凭贤者一时高兴，今日要战便战，明日要歇便歇。如今改了规矩，作战自有参谋处拿章程，贤者只管点头。打仗不是儿戏，哪能由着性子来。"
 SUM_Neo_Sand_Warfare:"沙漠战法"
 SUM_Neo_Sand_Warfare_desc:"军中有位老军官，把沙漠里那套游击的法子一条条写下，收进操典。如何借沙丘隐身，如何夜里袭营，写得明白。这法子原是佣兵的看家本领，如今成了官家的正经章程。"
 SUM_Neo_Frontier_Forts:"边境要塞"
 SUM_Neo_Frontier_Forts_desc:"须弥沿着边界一路筑起要塞，一座接着一座，像串珠般排开。荒沙里立起砖石，夜里点起烽火，一处有警，处处皆知。这些要塞便是国家的门槛。火光一夜接一夜。"
 SUM_Neo_Imported_Arms:"引进外械"
 SUM_Neo_Imported_Arms_desc:"须弥先前军械全靠外买，如今自己设了作坊，照着样式仿造。匠人拆了又装，装了又拆，几个月便造出可用的器械。自己能造，腰杆才硬，再不看人脸色。造出的器械，一件比一件精。"
 SUM_Neo_Seven_Nations:"七国通商"
 SUM_Neo_Seven_Nations_desc:"须弥的香料与咖啡，原先只卖给来往商队，如今七国处处通商，货色换了新出路。商人们装船的装船，驮骆驼的驮骆驼，忙得不亦乐乎。货通天下，国便活了。"
 SUM_Neo_Scholar_League:"七国学术联盟"
 SUM_Neo_Scholar_League_desc:"从前学者各守一派，互不串门，如今开了禁，彼此可以往来。你到我书房看卷，我到你讲堂听讲，六派之间渐渐有了走动。学问原不该砌墙隔开。书卷也跟着互换了几回。"
 SUM_Neo_Spice_Trade:"香料贸易"
 SUM_Neo_Spice_Trade_desc:"提起须弥，七国之人先想到的便是香料。那香气从集市飘到港口，飘进各国的宅院，人人争着要。一国之名，端的就系在这一味香料上。那味道一闻便知是须弥。"
 SUM_Neo_Coffee_Boom:"咖啡与糖"
 SUM_Neo_Coffee_Boom_desc:"须弥新起一桩产业，便是咖啡。从雨林边到城郊，处处种着咖啡树，烘焙的香气弥漫街巷。年轻学徒也进得作坊，端着杯子学那手艺。这新产业养活了不少人。"
 SUM_Neo_Silk_Looms:"缫丝与织造"
 SUM_Neo_Silk_Looms_desc:"须弥的织机越添越多，工坊从城里一直排到城郊，机杼之声昼夜不绝，连郊外的农舍也改成了作坊。蚕丝从各地运来，织成绸缎又运出去。这机杼声便是钱响。"
 SUM_Neo_Desert_Mines:"沙漠矿脉"
 SUM_Neo_Desert_Mines_desc:"沙漠深处探出矿脉，须弥征了人夫开采，第一炉铁水终于流了出来。匠人围着炉子看了半宿，说这铁够硬。有了自己的铁，造刀造犁都不求人。铁匠铺的火，从此没熄过。"
 SUM_Neo_Wood_Trade:"木材与香料"
 SUM_Neo_Wood_Trade_desc:"须弥靠两条腿走路，一条是雨林的木，一条是沙漠的货。雨林伐木顺河而下，沙漠驼队踏沙而来，两下里在城里交汇。缺了哪条都站不稳当。两样货物，缺一便跛。"
 SUM_Neo_Craft_Revival:"工艺复兴"
 SUM_Neo_Craft_Revival_desc:"那些失传多年的老手艺，如今被人从旧箱底翻出来，重新拾掇。雕花的、铸铜的、织锦的，一个个又开了张。老手艺里藏着祖辈的智慧。年轻学徒也跟着学了起来。"
 SUM_Neo_Great_Works:"宏伟工程"
 SUM_Neo_Great_Works_desc:"须弥立下大志，要在雨林与沙漠之间修一座长桥，好让两处往来不必再绕远路。工匠量了地形，先在图上画了又画。这桥修成，便把两块地缝在一处。桥影倒在水里，两端都望得见。"
 SUM_Neo_Public_Schools:"公共学堂"
 SUM_Neo_Public_Schools_desc:"须弥广设蒙学，教平民子弟识字读书，不再是有钱人家独享。穷苦人家把孩子送来，先生一丝不苟地教。识字的人多了，国家才有指望。朗朗书声，传到了巷口。"
 SUM_Neo_Irrigation:"绿洲水利"
 SUM_Neo_Irrigation_desc:"须弥修了水渠，匠人扛着工具沿村丈量，把活水引到村外，绕过沙丘流进干裂的田里，荒地变成熟田，田亩一寸寸扩开。农人望着渠水，笑得合不拢嘴。水利一兴，粮食便多。"
 SUM_Neo_Treasury_Reform:"税法改革"
 SUM_Neo_Treasury_Reform_desc:"旧例里沙漠百姓要加倍纳粮，如今改了章程，与雨林一视同仁。告示贴到沙漠各城，识字的人高声念给众人听。沙漠人放下心来，肯把货拿上市换钱。税轻了人心便稳。"
 SUM_Neo_Mint_Rights:"铸币权"
 SUM_Neo_Mint_Rights_desc:"市面上私钱泛滥，须弥下令设局兑换，把私钱一一收回，换上官铸的钱。商人起初担忧，后来见官钱好用，也就服了。钱归一处，买卖才稳。新钱上铸着须弥的纹样。"
 SUM_Neo_Six_Darshan:"六派共和"
 SUM_Neo_Six_Darshan_desc:"六大学派各有所长，不能再由一派独断学问。教令院里生论、素论、知论、明论、因论、妙论六派并列，各占一席，遇事大家商议着来，谁也压不倒谁。众人拾柴火焰高。"
 SUM_Neo_Ruin_Studies:"遗迹考据"
 SUM_Neo_Ruin_Studies_desc:"学者们来到赤王时代的废墟，把断墙一块块丈量，记录尺寸，绘图存档，还给残墙一块块编了号。风沙迷了眼，他们也不肯停。这些残墙里藏着古国的秘密。一笔一画，不敢马虎。"
 SUM_Neo_Ameta_Study:"阿玛塔机核"
 SUM_Neo_Ameta_Study_desc:"匠人依着古图复刻机核，那图纸改了又画，机核精巧异常，关节处一丝不差，竟被人用作新神的骨架。原来古人机关之术，到了今日又派上用场。"
 SUM_Neo_Remelting:"熔铸之术"
 SUM_Neo_Remelting_desc:"那些废弃多年的旧机关，如今被送进炉中回炉重造，炉火烧了三天三夜，铁水映红了匠人的脸，废铁又成了新器。匠人说这叫物尽其用。会省的人才会造。"
 SUM_Neo_Print_Press:"活字与书坊"
 SUM_Neo_Print_Press_desc:"须弥兴了印书之法，书一本本印出来，价钱大跌，连学徒也买得起，印好的书墨迹未干就被人抢着拿走。穷学生抱着书回屋，如获至宝。书便宜了，学问才传得开。"
 SUM_Neo_Managed_Desert:"沙漠行省"
 SUM_Neo_Managed_Desert_desc:"沙漠里四个傀儡国，名头各自不同，诏令却都从一处总督府发出。四方的公文同出一源，连字迹都一个样，百姓只知有总督，不知有国王。这便是换汤不换药。"
 SUM_Neo_Wonder_Tourism:"奇观之地"
 SUM_Neo_Wonder_Tourism_desc:"净善宫与无郁夷摩宫两处名胜，引得四方旅人慕名而来。有人带着干粮跋涉千里，只为看一眼宫墙，有人支起帐篷就在宫外住下。名胜便是国家的门面。有人还把见闻画在纸上。"
 SUM_Neo_Festival_Nation:"花神诞祭"
 SUM_Neo_Festival_Nation_desc:"花神诞祭停了多年，如今重新定为国之大典，满城张灯结彩，花铺子连夜赶制花冠，供不应求。百姓捧着鲜花涌上街头，歌乐之声不绝。这祭一复，人心便齐。"
 SUM_Neo_Scholar_Free_City:"学者自由市"
 SUM_Neo_Scholar_Free_City_desc:"须弥城如今成了学者的聚散之地，南来北往的读书人都在这里停留。客栈住满，书肆生意格外兴隆。学者云集之处，便是文明兴盛之所。住了三年也舍不得走。"
 SUM_Neo_Peace_of_Sands:"沙与林的和解"
 SUM_Neo_Peace_of_Sands_desc:"须弥城与旷野之间，头一回不用刀剑说话，改用言语交涉。从前在沙口剑拔弩张，如今两边各派使者，坐下递茶讲理，从日头说到星出。能坐下来谈，总比动刀强。茶碗一举，前嫌尽消。"
 SUM_Neo_Nahidas_Mercy:"草神的怜悯"
 SUM_Neo_Nahidas_Mercy_desc:"草神小吉祥草王心怀慈悲，把宽恕二字写进律法。犯了错的人若能悔过，便有改过的机会，便是判了死罪的人，也能凭一纸悔过书改判。律法之外还有人心。"
 SUM_Neo_Academic_Mobilization:"学院动员"
 SUM_Neo_Academic_Mobilization_desc:"须弥把学者也编入行伍，有的做参谋，有的管工务，有人管粮草，有人修器械，各展所长。拿笔的人如今也要操劳军国大事。读书人报国，未必只靠笔墨。笔杆子也扛起了枪。"
 SUM_Neo_Veteran_Corps:"老兵军团"
 SUM_Neo_Veteran_Corps_desc:"那些打过仗的老佣兵，如今被送去学堂读书识字，学那安身立命的本事。拿惯刀的手改拿笔，起初笨拙，后来也渐渐顺了。放下刀也要拿得起书。下了课还争着多认几个字。"
 SUM_Neo_Sand_Scouts:"沙漠斥候"
 SUM_Neo_Sand_Scouts_desc:"沙漠里布下眼线，一队人专替须弥盯着各处沙口，稍有异动便飞报。风吹沙移也瞒不过他们的眼睛。有这些人守着，国门便稳稳多了层保障。他们的眼睛，比鹰还尖。"
 SUM_Neo_Ambassador_Voice:"须弥之声"
 SUM_Neo_Ambassador_Voice_desc:"须弥遣使四方，七国的议事桌上从此有了须弥的声音。那使者带着书卷与货单，逢人便讲须弥的道理，据理力争，句句有声，旁人再不敢小瞧。国无外交则无声。"
 SUM_Neo_Refuge_Harbor:"纳难民"
 SUM_Neo_Refuge_Harbor_desc:"邻国乱起，流民扶老携幼涌向须弥，须弥开城收留，分粮安置，城门外的粥棚日夜冒着热气，病倒了便请医者来诊治。收留流民是积德的事，也是添丁的好事。"
 SUM_Neo_Guard_of_Wise:"贤者卫队"
 SUM_Neo_Guard_of_Wise_desc:"须弥新设一支军团，只对贤者效忠，旁人调不动，纵有兵权也休想支使。军纪严明，唯贤者之命是从。须知效忠一人，不如效忠一国。连国王的令也进不了营门。"
 SUM_Neo_Desert_Legion:"赤王军团"
 SUM_Neo_Desert_Legion_desc:"这支队伍里，大半是沙漠里出来的佣兵，惯走沙路，耐得干渴，自带水囊与干粮，走得比谁都快。他们插上旗号，便成了国家的兵。草莽也可成劲旅。打起仗来，个个争先。"
 SUM_Neo_War_Economy:"战时经济"
 SUM_Neo_War_Economy_desc:"须弥一声令下，所有工坊尽数转作军工，打造盔甲器械。原先织布的改锻铁，原先制陶的改铸器，连学堂里的匠徒也调来帮忙，日夜赶工。这是要举国之力备战。"
 SUM_Neo_Forest_Militia:"雨林民兵"
 SUM_Neo_Forest_Militia_desc:"雨林与沙漠各自组织民兵，各守各的地界，互不相扰。雨林人守林，沙漠人守沙，平日倒也相安，遇上外敌才临时合兵一处，各带各的干粮与弓箭。守土各有其法。"
 SUM_Neo_Port_Customs:"海关"
 SUM_Neo_Port_Customs_desc:"奥摩斯港加了关卡，查得紧了，走私的船只好绕道而行，不敢再靠岸。税吏得了赏钱，守得更严，连渔船也要登记造册，一件货物都不许漏。这边一紧，那边便绕。"
 SUM_Neo_Urban_Works:"城邦营建"
 SUM_Neo_Urban_Works_desc:"须弥城邦的营建，交给了妙论派来主持。这派人懂结构、会营造，盖房修路样样在行，哪里的墙该加厚，哪里的桥该起拱，他们一看便知。盖房子也要行家。"
 SUM_Neo_Healers_Path:"医者的路"
 SUM_Neo_Healers_Path_desc:"须弥的医者另有一门本事，能引人入梦，抚平心里的旧伤。受伤的人睡去，醒来时眉眼舒展，那梦里的光景还记得清清楚楚。这治病之法端的奇妙。醒来时，连旧年的疼都淡了。"
 SUM_Neo_Scholar_Exiles:"归来的流亡者"
 SUM_Neo_Scholar_Exiles_desc:"当年被流放四方的学者，如今陆续回到须弥，身上还带着风尘。他们进城时，昔日同窗都来迎接，有人还带了外邦的书回来，讲给众人听。浪子回头，总是喜事。"
 SUM_Neo_Desert_Amnesty:"沙漠大赦"
 SUM_Neo_Desert_Amnesty_desc:"须弥下了赦令，那些被流放到沙漠的人一概免罪，准其还乡。沙漠里的苦日子总算熬出了头，一家人抱头痛哭，从此不必再躲风沙。赦令一下，枯木逢春。"
 SUM_Neo_Green_Shield:"须弥之盾"
 SUM_Neo_Green_Shield_desc:"须弥在雨林与沙漠之间立起一道防线，像是绿色屏障，护着两处的安宁。岗哨相接，烽火相传，沙盗摸到近前便被乱箭射回。这防线便是两地的护身符。这道墙，是拿人命守着的。"
 SUM_Neo_Twin_Throne:"双王并立"
 SUM_Neo_Twin_Throne_desc:"须弥如今是两个头，一头是草神，一头是教令院，各据一端。国家便在两者之间小心行走，哪边也不敢得罪，谁轻谁重端的难断。两强并立，最考验本事。草神与院里，各握一半。"
 SUM_Neo_Wilderness_Order:"旷野之世"
 SUM_Neo_Wilderness_Order_desc:"教令院与神龛一齐失了势，须弥无可依傍，索性退回旷野，靠部族村社自守，学堂锁了门，神龛冷了香火，众人重拾旧日的弓与锄。靠山一倒，还得靠自己。"
 SUM_Neo_Dawn_Of_Teyvat:"提瓦特黎明"
 SUM_Neo_Dawn_Of_Teyvat_desc:"七国的目光都盯着须弥，看它往何处去。须弥不左顾右盼，只管走自己选的路，有人劝它依附大国，有人劝它闭门自守，它都不听。走自己的路，任凭旁人说。"
 SUM_Neo_Journal_Freedom:"学报自由"
 SUM_Neo_Journal_Freedom_desc:"须弥的信条变了，连错的东西也准印出来，让人自行分辨。书肆里什么都有，读者自去取舍，印错了也不必追责，改日再印一版便是。真理不怕辩。连小孩也学会翻着辨。"
 SUM_Neo_Desert_Governor:"沙漠总督府"
 SUM_Neo_Desert_Governor_desc:"沙漠四国表面各有君长，诏令却从同一处发出，连措辞都一个样。四国的王坐在各自的王座上，接的竟是同一道命令。原来都是牵线木偶，端的好手段。"
 SUM_Neo_Mushroom_Harvest:"梦蕈之收"
 SUM_Neo_Mushroom_Harvest_desc:"雨林的腐土里长出一种新药材，采药人拨开落叶，一朵朵采下来，拿去入药，那菌子颜色发亮，据说能治多年的旧疾，药铺争着收购。烂泥里也能生宝贝。采了一筐又一筐。"
 SUM_Neo_Akasha_Shut:"关闭虚空"
 SUM_Neo_Akasha_Shut_desc:"虚空一关，须弥人不能再靠终端记事，只好重新用自己的脑子。起初叫苦，日子久了也就惯了，从前张口便知的事，如今要翻书去查。脑子不用会生锈。记性反倒练出来了。"
 SUM_Neo_Genesis_Delayed:"造神受阻"
 SUM_Neo_Genesis_Delayed_desc:"那造神大计进行到半途，偏在一道工序上卡住，怎么也推不动。匠人们围着图纸干着急，换了几班人，试了十几种法子，那关节仍旧合不拢。造神原非易事。图纸摊了满桌。"
 SUM_Neo_Sandstorm_Scourge:"沙暴之患"
 SUM_Neo_Sandstorm_Scourge_desc:"一场沙暴压将下来，黄沙漫天，把商道掩了，连绿洲也糊住。商队躲进岩缝，骆驼卧成一圈，把头埋进沙里，数日不敢出来。沙暴无情，端的厉害。风声像鬼哭，听了一夜。"
 SUM_Neo_Green_Alliance:"翠林同盟"
 SUM_Neo_Green_Alliance_desc:"雨林各村与兰那罗结下同盟，人树同心，共守山林，约好的事刻在树皮上，风一吹便作响。兰那罗唱起歌来，村里的孩子都听得懂。这同盟端的奇妙。歌声一起，林子都跟着响。"
 SUM_Neo_Scholar_Soldier:"学者兵"
 SUM_Neo_Scholar_Soldier_desc:"那些读过书的学子，如今也扛起枪杆上阵，认真劲儿比谁都足。操练时一板一眼，丝毫不肯偷懒，连睡觉都抱着枪，生怕误了差事。读书人认真起来，端的了得。"
 SUM_Neo_Twin_Capital:"双都"
 SUM_Neo_Twin_Capital_desc:"入夜之后，须弥城与奥摩斯港一齐亮起灯火，两处辉映，如双星并耀，港里的船与城里的车把两处连成一片。赶路的人望见灯光，心里便有了奔头。灯多便是人多。"

 #################### 等级 / 共振 ####################
 SUM_Neo_Oracle_T1:"一档：无神之世"
 SUM_Neo_Oracle_T1_desc:"头一档，乃是无神之世。草神小吉祥草王的名字，只在旧典籍的脚注里偶尔见到，寻常人早已忘了，连祭司也换了行当。神被人忘，也算一劫。小吉祥草王的像也蒙了尘。"
 SUM_Neo_Oracle_T2:"二档：神在边缘"
 SUM_Neo_Oracle_T2_desc:"第二档，神在边缘。净善宫的门依旧锁着，却有人悄悄在门外放上一束花，放下便走，不敢久留，走出老远还回头望一眼。这花虽小，藏着人心。看花的人来了一茬又一茬。"
 SUM_Neo_Oracle_T3:"三档：神权渐立"
 SUM_Neo_Oracle_T3_desc:"第三档，神权渐立。草神的教谕开始与教令院的敕令并排而行，两样声音一齐在须弥响起，百姓听了反倒糊涂，不知该听谁的。这是要分庭抗礼。两道令并贴在同一面墙上。"
 SUM_Neo_Oracle_T4:"四档：神谕当行"
 SUM_Neo_Oracle_T4_desc:"第四档，神谕当行。须弥但凡有政令，先要送草神过目，点了头才得施行，教令院拟好的文书也得送到净善宫走一遭，谁也不敢耽搁。这便是神要掌权了。谁也不敢先斩后奏。"
 SUM_Neo_Oracle_T5:"五档：神临须弥"
 SUM_Neo_Oracle_T5_desc:"第五档，神临须弥。草神小吉祥草王成了须弥实打实的主宰，大小事务一肩挑起，六大学派俯首听命，再无一人敢自作主张。神终于归位。净善宫的门，终于开了。"
 SUM_Neo_Canon_T1:"一档：学院崩解"
 SUM_Neo_Canon_T1_desc:"头一档，学院崩解。教令院再调不动须弥这盘棋，令出而人不行，威风扫地，书院里冷冷清清，讲义落满了灰。靠规矩吃饭的，最怕没人听。首座们各回各家，无人再管。"
 SUM_Neo_Canon_T2:"二档：律例松弛"
 SUM_Neo_Canon_T2_desc:"第二档，律例松弛。教令院发的敕令，出了须弥城便没人认，成了一张废纸，边境的官佐照旧行事，只当没见着。法不出城，何以服众百姓。远一点的城，干脆自己立规。"
 SUM_Neo_Canon_T3:"三档：学院守成"
 SUM_Neo_Canon_T3_desc:"第三档，学院守成。教令院抱着旧章程过日子，不再向外扩张，只求保住现状，新人想进也进不来，旧人守着位子混日子。守成总比乱来强。门虽还开着，却不肯多收人。"
 SUM_Neo_Canon_T4:"四档：铁律森严"
 SUM_Neo_Canon_T4_desc:"第四档，铁律森严。虚空终端把人说的每一句话都回传上去，丝毫逃不得，众人开口前都先掂量，连梦里说了什么也有人记下。这般严密端的吓人。连叹气都有人记一笔。"
 SUM_Neo_Canon_T5:"五档：学院至上"
 SUM_Neo_Canon_T5_desc:"第五档，学院至上。教令院成了须弥独一份的意志，旁的声音一概不许有，六派首座唯阿扎尔马首是瞻，连草神的话也要经它过一遍。一言堂便自此始。再无第二处点灯。"
 SUM_Neo_Combo_Twin_High:"神学院合流"
 SUM_Neo_Combo_Twin_High_desc:"草神与教令院握手言和，须弥一手握神谕，一手执铁律，两样都拿在手里，草神管人心，教令院管规矩，各不越界，倒也相安。这般局面端的少见。一手慈悲，一手规矩。"
 SUM_Neo_Combo_Twin_Low:"旷野之世"
 SUM_Neo_Combo_Twin_Low_desc:"学院与神龛一齐失势，须弥退回旷野，只靠部族村社抱团自守，村长与首领聚在篝火边议事，一坛酒传了一圈。没了靠山，只得自己撑着。弓箭和锄头，又成了宝贝。"
 SUM_Neo_Combo_A_High:"圣树独尊"
 SUM_Neo_Combo_A_High_desc:"神谕压过了敕令，教令院退到草神身后，再不敢抢先，草神一句话，六派便得改章程，从前是院里说了算，如今反了过来。这便是主次已分。院里的老规矩，一夜翻了篇。"
 SUM_Neo_Combo_B_High:"铁律学院"
 SUM_Neo_Combo_B_High_desc:"敕令压过神谕，须弥一切都按律条的格子来运转，半步不逾矩，草神的教谕束之高阁，阿扎尔说一不二，六派首座唯唯诺诺。这般死板也有好处。草神的话，也得排队等候。"

 #################### 新闻 ####################
 SUM_Neo_News.1.t:"花神诞祭的钟声"
 SUM_Neo_News.1.d:"花神诞祭这一日，须弥城里锣鼓敲得震天响。但见教令院前的高塔下，分作两班人：一班是衣冠齐整的学者，捧着书卷，站得笔直；一班是市井的百姓，挎着篮子，踮脚张望。中间隔着一道石阶，你望着我，我望着你，谁也不肯先迈过去。原来那桩人人肚里明白的事，小吉祥草王至今还锁在净善宫里，这件事谁敢头一个说将出来？有那胆大的后生，往石阶上踏了半步，被身旁的老人一把扯住，低声喝道休要造次。那后生只得缩回脚。街角卖花的摊子，今日生意格外好，人们买了花，却不知该往何处献。日头渐渐西斜，净善宫那两扇门，依旧关得死死的，门环上落了一层薄灰。此话一传十，十传百。"
 SUM_Neo_News.1.a:"阅"
 SUM_Neo_News.2.t:"净善宫的门开了"
 SUM_Neo_News.2.d:"那一日，净善宫前聚了黑压压一片人，都为着同一桩事。忽然宫门内传来一阵响动，两扇尘封多年的大门，竟被人从里头缓缓推开。这门已经五百年不曾为外人开过。众人踮起脚，伸长了脖子，只见一位小小的身影，从幽暗的殿里走了出来。那正是小吉祥草王。她被囚了五百年，如今头一回站在正午的日光底下，阳光落在她身上，晃得人睁不开眼。有那老妇人，当场便抹起泪来，口中念叨，苦了我可怜的草王。旁边的学者却张着嘴，半晌说不出话，从前他们在书里读过的名字，如今竟活生生站在眼前。有那孩子，被大人举在肩头，睁着大眼，直说那身影小得可怜。人群里静了片刻，忽地爆发出一阵欢呼，有人跪下磕头，有人把花高高举起。有分教：五百年暗无天日，一朝重见天光。"
 SUM_Neo_News.2.a:"阅"
 SUM_Neo_News.3.t:"六大学派的座次"
 SUM_Neo_News.3.d:"六大学派的首座们，这一日为了排座位的事，在议事厅外争了整整一天。看那廊下，六把椅子一字排开，首座们却谁也不肯先坐。这个说我这一派立派最早，该坐首位；那个说我这一脉弟子最多，理当我先。你一言，我一语，争得面红耳赤，唾沫横飞。有那上了年纪的，捋着胡子搬出古老规矩；有那年轻的，索性把袖子一挽，就要理论高低。六个人从日上三竿争到日头西沉，椅子还是空着，谁也没坐成。旁边伺候的书记官，站得腿都酸了，手里那本名册翻了一遍又一遍，到底也没记下个座次。有几个好事的，索性搬来板凳，坐在廊下看这笑话，一边嗑着瓜子。有那路过的学生，偷看一眼，掩嘴直笑，被首座瞪了一眼，吓得赶紧低头走开。"
 SUM_Neo_News.3.a:"阅"
 SUM_Neo_News.4.t:"沙漠的旗"
 SUM_Neo_News.4.d:"列柱沙原上，那一日竖起了一面旗。那旗是大红底子，金线绣成，迎着风猎猎作响，正是镀金旅团的旗号。原来教令院在要道上设了税卡，凡过往商队，一律要缴钱。镀金旅团的人马占了这片沙原，便与那税卡对上。有那精明的商队头目，远远望见税卡的影子，把缰绳一勒，领着驼队拐进旁边的沙沟，绕道走了。守卡的兵丁望见远处尘烟，追将出来，那驼队早转过两道沙丘，连影子都不见了，只留下一串深深浅浅的蹄印。税吏气得直跺脚，却也无奈。那旗底下，还摆着几坛酒，佣兵们边喝边笑，全不把税卡放在眼里。镀金旅团的佣兵们抱刀坐在旗底下，看着驼队远去，发出一阵哄笑。有分教：明处税卡拦路，暗处沙道绕行，这税究竟收不收得到，端的还要看本事。"
 SUM_Neo_News.4.a:"阅"
 SUM_Neo_News.5.t:"虚空的回声"
 SUM_Neo_News.5.d:"须弥城里，新近兴起一件怪事。人人都戴上了那虚空终端，把平日里说过的话，一一回传出来。学者们见了，欢喜得不得了，说这是天大的进步，古人做梦都想不到。可商人们却各自心里打鼓。有那开铺子的，当着人面说了句价钱，转个身便听终端里原样念了出来，惊得手里算盘都掉了。你道怎的？原来这终端专把人说过的话，一字不落地传出去，连一句私话也不肯放过。商人们慌了神，凑在一处商议，也想不出个长法。有几个老成的，索性把要说的话都写在纸上，连嘴都不敢张。偏有个性子急的，趁人不备，捡起一块石头，硬生生塞进终端的出声口，那声音立刻闷了下去。旁人见了，先是一愣，继而纷纷效仿，不出半日，城里半数终端都塞了石头。"
 SUM_Neo_News.5.a:"阅"
 SUM_Neo_News.6.t:"造神的传闻"
 SUM_Neo_News.6.d:"教令院的地下，这些日子常在夜里传出声响。那声音低沉，嗡嗡作响，间或夹杂着齿轮咬合的咔咔声，听久了，教人心里发毛。有几个值夜的学者，壮着胆子，顺着石阶往下探。走到底下，只见一道厚厚的石门，门缝里透出微光，那声响正是从门后传来。众人你看看我，我看看你，谁也不敢上前。第二日，他们把这桩事禀报给贤者。贤者端坐在议事厅里，听罢，慢悠悠地说，那不过是地下的风，不必大惊小怪。几个学者听了，面面相觑，其中一个忍不住低声道，那分明是机括转动，怎的像是风？这话被贤者听见，瞪了一眼，那学者便不敢再言语。有几个胆小的学者，夜里索性蒙头大睡，假装什么也没听见。夜里，那声响依旧，嗡嗡地响个不停。有分教：地底机声隆隆，堂上偏说是风。"
 SUM_Neo_News.6.a:"阅"
 SUM_Neo_News.7.t:"第二席的到访"
 SUM_Neo_News.7.d:"那一日，愚人众的车队浩浩荡荡驶入须弥城。打头的是几辆漆黑的马车，车帘垂得严严实实，车上插着愚人众的旗号，为首的正是第二席。守城的兵丁远远望见，早吓得站直了身子，连大气也不敢出。这第二席来路非凡，端的惹不起。说不定何时，那车帘一动，露出半张脸来，围观的人便赶紧低下头。城里管事的，为了迎接这位贵客，早早便吩咐下去，把城门口摆的鲜花，尽数换成了新的。只见那花一色儿的新鲜，红的红，白的白，排得整整齐齐，香气扑鼻。有那卖花的老汉，本来守着自己的摊子，被差役一顿催促，只好把自己最好的花也搬了去，心里心疼，嘴上却不敢说。车队进城后，城门口的花，就那样新鲜地摆着。"
 SUM_Neo_News.7.a:"阅"
 SUM_Neo_News.8.t:"奥摩斯港的桅杆"
 SUM_Neo_News.8.d:"奥摩斯港，如今端的繁华。那一日，港里的船挤得满满当当，泊位一直排到灯塔之外。后来的船只，只能在港外抛锚，等着空位。看那桅杆，一根挨一根，密得像树林。最奇的是，那些船上挂的旗，竟是七国各具，红的、蓝的、白的、金的，五颜六色，都挂在同一片桅杆上，随风飘扬。有蒙德的风车旗，有璃月的岩纹旗，有稻妻的雷纹旗，还有至冬、枫丹、纳塔的旗号，一面面搅在一处。码头上的工人扛着货，来来往往，吆喝声、号子声，响成一片。有那初来乍到的水手，看得眼花缭乱，感叹道，端的好大阵仗，七国的船，竟挤在一处。旁边的老搬运工擦了把汗，笑道，这算什么，再过几日，怕是灯塔外头也停不下了。"
 SUM_Neo_News.8.a:"阅"
 SUM_Neo_News.9.t:"沙海铁路通车"
 SUM_Neo_News.9.d:"须弥城外，新造出一条铁轨，铁轨上跑着一样新奇物件，叫做火车。这一日，第一列火车要试跑，消息传开，满城的人都赶来看稀罕。但见那火车，一节接着一节，铁皮打造，冒着一缕白烟，突突突地响。随着一声长鸣，火车缓缓开动，越跑越快，转眼便把城甩在身后。看那沿路的人，有的追着跑，有的骑马跟，孩子们更是欢呼雀跃。火车一路向沙漠方向驶去，穿过戈壁，越过沙丘，不多时，便抵达列柱沙原边缘的一片绿洲。车上的人下了车，个个赞不绝口，说这铁家伙端的了得，比骆驼快了十倍不止。绿洲里的居民，从没见过这等东西，远远围着看，小孩胆大的，还伸手去摸那冰凉的铁轮。列位"
 SUM_Neo_News.9.a:"阅"
 SUM_Neo_News.10.t:"世界树的低语"
 SUM_Neo_News.10.d:"夜深人静之时，那世界树竟发出声响来。巡林官值夜，远远听得那声音，似人低语，又似叹息，一阵一阵，随风飘来。他心中诧异，悄悄走近，只见那大树纹丝不动，枝叶却似在轻轻颤动。第二日，巡林官把这事禀报上去，口中说道，那分明是树在说话。教令院听了，却不以为然，只说那是夜风穿过枝叶，何足为奇。两下里各执一词，谁也说服不了谁。有那好事的学者，夜里特地跑到树下，屏息听了半宿，回来说，那声音确乎不像风，倒像是有人在里面低低念叨。可这话传到教令院，又被当作妄言。巡林官见说不通，只得叹气，仍旧每夜去听。这树究竟说没说话，端的无人能断。"
 SUM_Neo_News.10.a:"阅"
 SUM_Neo_News.11.t:"新的神座"
 SUM_Neo_News.11.d:"净善宫的正殿，这些日子新立起一座神座。那座儿雕得精美，镶金嵌玉，端的是气派非凡。可怪就怪在，须弥人看了，竟说不清那上头坐的到底是谁。有那老成的，进殿瞻仰一番，出来时被众人围住问，只摇头道，看不真切。有那胆大的，大着胆子走近，抬头细看，越看越糊涂，那神像的面目，似曾相识，却又分明陌生。有那大胆的，竟伸手去掀帷幔一角，却被守殿的人厉声喝退。有说是草神的，有说是别的什么大人的，众说纷纭，没个准话。这座儿立得蹊跷，来路不明，端的叫人心里犯嘀咕。殿里的香火，倒是日日有人上，只是上香的人，拜完便走，谁也不敢多留。有分教：一座新神座，满城猜不休，说不清坐的是哪位，只道是须弥的难言之隐。"
 SUM_Neo_News.11.a:"阅"
 SUM_Neo_News.12.t:"须弥的抉择"
 SUM_Neo_News.12.d:"须弥到了这般地步，端的站在了岔路口上。看那面前，摆着三条路：一条通向书院，那里书声琅琅，学者们埋头经典，把学问看得比天还大；一条通向圣树，那里树影婆娑，草王的低语在叶间回荡，仿佛在召唤什么；还有一条通向王座，那里金光闪闪，权柄在手，号令七国，端的威风。这三条路，条条都关乎须弥的国运，端的轻忽不得。三条路摆在执政者面前，一条也舍不得丢，可又明知只能择其一。执政者坐在殿上，望着那三条路，久久不语。议事厅里，众人争来争去，各有各的主张。这个说学问是立国之本，那个说神意不可违背，还有的说，须弥当执牛耳，方能扬眉吐气。争到后来，谁也说服不了谁，只把难题留给了当权的人。"
 SUM_Neo_News.12.a:"阅"

 #################### 镀金沙漠 ####################
 #### 序章 · 藩属之影 ####
 SUM_SGD_PRO_Shadow_of_the_Suzerain:"藩属之影"
 SUM_SGD_PRO_Shadow_of_the_Suzerain_desc:"镀金沙漠的城门归教令院管，税册归教令院写，连城门的钟敲几下，也得照雨林发来的公文办。沙子记得每一任总督的名字，总督们却连沙丘朝哪边长都懒得问一句。自家门口，倒像个客人。"
 SUM_Neo_SGD.1.t:"藩属之影"
 SUM_Neo_SGD.1.d:"镀金沙漠的那座城，城门归教令院管，税册归教令院写，连城门口那口钟，每日敲几下，也要照着雨林发来的公文办，半点做不得主。这城里的规矩，端的都是从雨林来的。沙子是有记性的，一任又一任总督的名字，都印在沙里，风吹不掉；可那些总督老爷，却连城外的沙丘朝哪边长，都懒得问一声。有那新来的总督，走马上任，先不问民生，只把税册翻了又翻，惟恐少收了一文。城里的老居民，看着一张张陌生的面孔来了又去，摇着头说，这些老爷，眼里只有税册，哪有沙漠。那钟敲起来，一下一下，不紧不慢，仿佛在数着总督们来的日子。那口钟照旧每日敲响，声音在沙城里回荡，听着像是替谁数着日子。"
 SUM_Neo_SGD.1.a:"循教令院发下的旧例"
 SUM_Neo_SGD.1.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Tax_Ledger:"税册上的沙漠"
 SUM_SGD_PRO_Tax_Ledger_desc:"税吏把名目抄了满满一卷，从水井到骆驼铃铛，样样都算一份。卷子往城墙上一贴，城民围着看，才知道自家一年要交几回、交几样。有人数着数着笑出声，笑着笑着又不笑了。"
 SUM_Neo_SGD.2.t:"税册上的沙漠"
 SUM_Neo_SGD.2.d:"那税吏，为了把税目理清楚，把名目抄了满满一卷。你道这卷上有多少名目？从城里的水井，到骆驼脖子上的铃铛，但凡能沾上边的，都算作一份，端的无孔不入。抄完这一卷，税吏自己先念了一遍，念得口干舌燥。城里的百姓见了，也没个章程，索性把那一卷贴在墙上，日日看着，好歹知道自己一年里要交几回钱。墙根底下，天天围着一群人，指指点点，议论不休。有那识字的，蹲在墙根，一项一项念给不识字的邻人听，念一项，众人便叹一声。念到后来，有人忍不住骂道，连驼铃都要交钱，这税端的刮到了骨头缝里。旁人赶紧捂住他的嘴，怕被官署听见。那卷纸贴在墙上，日晒风吹，渐渐泛黄卷边，可上头的名目，一个字也抹不掉。有分教：一张税卷贴墙上，字字都是血汗钱。"
 SUM_Neo_SGD.2.a:"把账目封存"
 SUM_Neo_SGD.2.b:"把账目摊开"
 SUM_SGD_PRO_Governor:"教令院的总督"
 SUM_SGD_PRO_Governor_desc:"总督由雨林指派，任期三年，三年里最大的政绩便是把税收到手。收得齐，便有嘉奖，收不齐便换人。至于沙漠怎么过日子、井里还有没有水，公文上从来不问一句。"
 SUM_Neo_SGD.3.t:"教令院的总督"
 SUM_Neo_SGD.3.d:"这沙漠城的总督，端的来头不便，都是由雨林指派下来的，一任三年。三年里头，他最大的政绩，便是把税如数收到手里，一文不短。至于这沙漠里的人怎么过日子，井里有没有水，田里长不长粮，公文上从来不问一句。那总督初来时，也曾在堂上信誓旦旦，说要体恤民情。可真到任上，每日里只盯着税册，谁交得多，谁便是有功的良民；谁交不上，便差人去催，催得鸡飞狗跳。有那上进的，还把收税的数目刻在石碑上，算作自己的功德。城里的百姓，见总督换得勤，三年一换，来去匆匆，连个面熟的都留不下。有那老人叹道，铁打的沙漠，流水的总督，他们要的，是沙里的金子，不是沙里的人。"
 SUM_Neo_SGD.3.a:"按官署的判断行事"
 SUM_Neo_SGD.3.b:"按自己的判断行事"
 SUM_SGD_PRO_Garrisons:"雨林的驻军"
 SUM_SGD_PRO_Garrisons_desc:"城墙上站的是别处调来的兵，口令用雨林的口音喊，喊得城下人一愣一愣。这些兵守得住城门，却认不出城里的路，问个水井在哪儿还得拉人带路。真有个风吹草动，他们先迷了方向。"
 SUM_Neo_SGD.4.t:"雨林的驻军"
 SUM_Neo_SGD.4.d:"那城墙上站岗的兵，都不是本地人，乃是从别处调来的。他们口里的口令，用的是雨林的口音，喊将出来，城里的百姓听不懂，只当是鸟语。看那兵丁，一个个荷枪实弹，脸色生硬，站在城头，端的是威风。那口音喊将出来，硬得像嚼了沙子，百姓听了只觉得好笑。可他们守得住城门，却认不出城里的路。有那百姓问路，兵丁翻着眼睛，半晌指不出个方向。有一回，一队兵奉命去城里拿人，转来转去，竟在巷子里迷了路，最后还是一个当地的孩子，把他们领到了地方。城里的老居民看了，暗暗发笑，说这些兵，守着城，却连城都不认得。那口音古怪的口令，每晚照旧在城头响起，一声接一声，在沙漠的夜空里散开，听着倒有几分凄凉。"
 SUM_Neo_SGD.4.a:"先看住脚下的城"
 SUM_Neo_SGD.4.b:"先看住远方的人"
 SUM_SGD_PRO_Censor_Eyes:"沙中的耳目"
 SUM_SGD_PRO_Censor_Eyes_desc:"官署在各处路口都放了人，一件褂子、一顶斗笠，往墙角一蹲，便记下谁说了什么、谁又见了谁。记性太好的人，在这年头不算是好事，前日还与人说笑，昨日就被请去喝茶。"
 SUM_Neo_SGD.5.t:"沙中的耳目"
 SUM_Neo_SGD.5.d:"那官署，端的手段厉害，在各处路口，都安插了人。那些人装作闲逛的、卖杂货的，眼睛却四处乱转，把谁说了什么话、谁见了什么人，一一记在心里，回头便去禀报。这年头，记性太好的人，端的不算好事。城里有那爱说话的，前脚在茶摊上发了两句牢骚，后脚官署便找上门来，吓得他再不敢张口。茶摊的老板娘，也学会了少说两句，只管低头做生意。有那谨慎的，索性把嘴闭得紧紧的，与人相见，也只点头，不敢多言。偏有个老实的货郎，见人就爱打招呼，见谁都记着名，结果被请去问了几回话，出来时脸都白了。从此他学乖了，见了熟人也低头走。那些放在路口的人，依旧日日转悠，眼睛盯着来来往往的行人。有分教：路口处处有耳目，多记一句话，便多一分祸。"
 SUM_Neo_SGD.5.a:"循教令院发下的旧例"
 SUM_Neo_SGD.5.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Petition:"陈情的状纸"
 SUM_SGD_PRO_Petition_desc:"有长者跪在官署门口递状纸，一跪就是三日。递到第三回，风起，状纸被吹走一半，他扑地去捡，捡回来的那半张也没人接。长者把纸按在膝上抹平，抹了半晌，起身走了。"
 SUM_Neo_SGD.6.t:"陈情的状纸"
 SUM_Neo_SGD.6.d:"城里有一位长者，家中遭了冤屈，要去官署递状纸。那老人白发苍苍，拄着拐杖，跪在官署门口，双手把状纸高高举起。头一回递上去，里头的人看也不看，摆摆手赶他走；第二回，他又跪了半日，还是没人理；到了第三回，一阵风刮过来，把那状纸吹走了一半，剩下的半张，被他死死攥在手里。老人膝行几步，把那半张纸再递将上去，可门里的差役，只探头看了一眼，便把门关了，任凭老人如何磕头，也不再来。那半张状纸，风一吹，又从老人手里飘落，落在台阶下的沙尘里。老人怔怔地看着，半晌，才慢慢弯下腰，把它捡起来，揣进怀里，颤巍巍地走了。这状纸递了三回，端的连一张也没递进去。"
 SUM_Neo_SGD.6.a:"把账目封存"
 SUM_Neo_SGD.6.b:"把账目摊开"
 SUM_SGD_PRO_Old_Road:"旧道与商队"
 SUM_SGD_PRO_Old_Road_desc:"商队走的还是赤王年间就有的旧道，驼铃一响，一串人影沿着沙脊走。一路上没有一块界碑写着雨林的名字，风把旧年的车辙抹了又露，露了又抹。向导说，这条道比官署老得多。"
 SUM_Neo_SGD.7.t:"旧道与商队"
 SUM_Neo_SGD.7.d:"那沙漠里的商队，走的仍是赤王年间就有的旧道。这条道，祖祖辈辈走了千百年，沙丘认得，骆驼认得，连石头缝里的草都认得。可这一路上，从头到尾，竟没有一块界碑写着雨林的名字。这旧道本是沙漠自己的路，与雨林无干，如今城门虽归了雨林管，这路却还是那条路。有那老向导，骑在骆驼上，指着路边的断石说，从前赤王在位时，这道上立着碑，碑上刻着古字，如今碑倒了，字也埋了，只剩商队的蹄印，一层叠一层。有那上了年纪的驼夫，每回路过，也要在断石旁歇一歇脚。年轻的商人听了，只管催着赶路，哪里肯听这些旧话。驼铃叮当，响在空荡荡的沙道上，仿佛在替那条古老的路，低低地唱着挽歌。"
 SUM_Neo_SGD.7.a:"按官署的判断行事"
 SUM_Neo_SGD.7.b:"按自己的判断行事"
 SUM_SGD_PRO_Oasis_Well:"绿洲的泉水"
 SUM_SGD_PRO_Oasis_Well_desc:"绿洲的泉是全城的命，可水权攥在官署手里，一瓢一瓢都要凭签。挑水的人天不亮就去排队，队伍从井台一直排到巷口，桶碰桶地响。轮到谁，谁就把签往井栏上一搁。"
 SUM_Neo_SGD.8.t:"绿洲的泉水"
 SUM_Neo_SGD.8.d:"那绿洲的泉，端的全城的命脉。城里的百姓，吃水用水，全靠这一汪泉水。可这水权，偏偏攥在官署手里，百姓要用，得看官署的脸色。看那泉边，天还不亮，挑水的人便排起了长队，扁担靠在肩上，水桶搁在脚边，一个挨一个，弯弯曲曲排了半条街。那排队的队伍里，有妇人头顶着水罐，一等等到日头老高。有那勤快的，半夜就来，也只排在中间；来晚的，只好等着日头升高，水渐渐浑了，才轮得到。看管泉口的差役，坐在阴凉处，摇着扇子，慢悠悠地放行，谁要给钱，便往前挪几位。有那性子急的，忍不住抱怨两句，立刻被旁边的人拉住，低声道，休要作声，这水还得挑呢。众人只得忍气吞声，默默地往前挪。有分教：一泉养活全城人，水权却攥官署手。"
 SUM_Neo_SGD.8.a:"先看住脚下的城"
 SUM_Neo_SGD.8.b:"先看住远方的人"
 SUM_SGD_PRO_Salt_Field:"盐碱地的收成"
 SUM_SGD_PRO_Salt_Field_desc:"盐碱地里只能种些耐旱的豆子，苗稀，荚也瘪，收成薄得叫人心疼。可税是一样的税，一粒也不短。农人蹲在田埂上，把薄收的年景一笔一笔记在心里，不写在纸上，纸上写了也没人看。"
 SUM_Neo_SGD.9.t:"盐碱地的收成"
 SUM_Neo_SGD.9.d:"那盐碱地里，种不出什么好庄稼，只能种些耐旱的豆子。那豆子结得稀稀拉拉，收成薄得可怜，可交的税，却和丰年一样，一文也不少。这年头，种地的人端的难。有那老农，蹲在地头，捻着几粒瘪豆，皱着眉直叹气，可向官署纳粮的数目，却半分也短不得。有那交不上粮的，只好把种子也交了去，来年拿什么下种，却顾不上了。交不上税，差役便提着锁链上门，牵走家里仅有的牲口。农人们心里苦，却没处说，只好把那薄收的年景，一笔一笔记在心里，却不写在纸上。有那识字的，想写，也被家里人拦住，说写了便是把柄，反倒惹祸。田里的豆子，一年薄过一年，可税册上的数目，年年照旧。"
 SUM_Neo_SGD.9.a:"循教令院发下的旧例"
 SUM_Neo_SGD.9.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Bazaar:"集市的秤"
 SUM_SGD_PRO_Bazaar_desc:"集市的秤年年要换，越换越沉，一斤能称出八两来。买卖的人心里有数，嘴上不说，只把袖子里的手攥紧些。有外乡客不服，摊主把秤砣往台上一磕，问他还要不要买。"
 SUM_Neo_SGD.10.t:"集市的秤"
 SUM_Neo_SGD.10.d:"那集市上的秤，年年都要换新的。你道为何？原来那秤，一年比一年沉，称起货来，同样的东西，称出的分量却一年比一年多。买东西的人，明明称着够了数，回家一比，却发现亏了不少。可这秤是官署定的，谁敢说个不字？买卖的人，心里都有数，嘴上却谁也不说。有那精明的，自己带杆私秤，两下里一比，便知吃了亏，却也只是苦笑，把那点亏，算在价钱里头。有个老实巴交的卖油郎，被那秤坑得多了，忍不住嘀咕了一句，立刻被旁边的老主顾使眼色止住。集市上依旧熙来攘往，吆喝声不断，人人都作出一副和气的模样。这秤越换越沉，端的把那点亏心，都藏在了秤星里。有分教：秤星年年沉，人心日日明，只是不敢说。此事非同小可。"
 SUM_Neo_SGD.10.a:"把账目封存"
 SUM_Neo_SGD.10.b:"把账目摊开"
 SUM_SGD_PRO_Pathfinder:"识路的向导"
 SUM_SGD_PRO_Pathfinder_desc:"只有土生土长的向导认得沙丘每年挪到哪，抬眼看一看风，便知道路在哪边。雨林来的测绘队画了三年地图，标得密密层层，还是走丢过两回。后来队里的人出钱请向导带路。"
 SUM_Neo_SGD.11.t:"识路的向导"
 SUM_Neo_SGD.11.d:"那沙漠里的沙丘，年年都在挪动，今日的路，明日便可能变了模样。只有土生土长的向导，才认得那沙丘每年挪到哪里，闭着眼睛也能找出路来。可雨林来的测绘队，偏偏不信这个。他们带着罗盘、仪器，画了整整三年的地图，自以为把每一道沙丘都标得清清楚楚。谁知这沙丘，偏偏不听地图上那一套，一夜大风，便挪了地方。测绘队照着地图走，走丢过两回，有一回险些渴死在沙里，多亏了当地向导，循着骆驼的足迹，才把他们找了回来。那向导骑着骆驼，笑眯眯地说，这沙是会走路的，地图画得再好，也追不上它。那些仪器，也被风沙磨得锈迹斑斑，端的成了摆设。测绘队的人听了，满脸通红，却也无可奈何。"
 SUM_Neo_SGD.11.a:"按官署的判断行事"
 SUM_Neo_SGD.11.b:"按自己的判断行事"
 SUM_SGD_PRO_Red_King_Column:"赤王的石柱"
 SUM_SGD_PRO_Red_King_Column_desc:"石柱在沙里露着半截，上面的字没有人认得，连老书生也只摇头。可路过的人都会伸手摸一摸，摸完在衣襟上蹭蹭手，谁也不说什么。风把柱子上的沙吹了一层又落一层。"
 SUM_Neo_SGD.12.t:"赤王的石柱"
 SUM_Neo_SGD.12.d:"那沙漠里，随处可见半截石柱，从沙中斜斜地露出来。石柱上刻着弯弯曲曲的古字，年月久了，风沙磨得模糊，如今再也没有人认得。可怪就怪在，凡是从这里路过的人，不论商队还是驼夫，都会伸出一只手，在石柱上摸一摸，仿佛这样便能讨个吉利。有那胆小的，摸完还要合十拜一拜，口中念念有词。有那老成的，摸一把石柱，抬头望望，摇摇头说，这上头的字，怕是赤王年间的，如今认得的人，都没了。年轻人听了，只当是老人说古，摸一摸便跟着队伍走了。那石柱就那样立着，一半在沙里，一半在外头，任凭风吹日晒，任凭人来人往，默默地看着这沙漠里的悲欢。有分教：石柱半埋沙，古字无人识，路人摸一把，各有一桩心事。这话儿说长了，暂且按下。"
 SUM_Neo_SGD.12.a:"先看住脚下的城"
 SUM_Neo_SGD.12.b:"先看住远方的人"
 SUM_SGD_PRO_Scarlet_Slate:"赤沙石板"
 SUM_SGD_PRO_Scarlet_Slate_desc:"有商队从遗迹里带出几块石板，官署说是赃物，要没收。商队不肯，官署便封了货栈，扣了人。石板最后还是抬进了官署的库房，从此谁也没再见过。赃物进了库房，便成了公物。"
 SUM_Neo_SGD.13.t:"赤沙石板"
 SUM_Neo_SGD.13.d:"有一支商队，路过一处古遗迹，从里头带出几块石板。那石板上刻着古纹，沉甸甸的，端的有些年头。消息传到官署，官署当即派人来，说这是从遗迹里盗出的赃物，要尽数没收。商队的人辩解说，这是捡的，不是偷的，可哪里辩得清？石板还是被一车拉走了，进了官署的库房。那库房门禁森严，寻常人进不去。石板进去之后，便再也没有人见过。有那好事的，隔些日子便去打听，官署只推说封存着，待将来查验。日子一久，这事便渐渐凉了，石板的事，也没人再提。有人说，那石板上的古纹，说不定记着什么了不得的秘密；也有人说，不过是几块破石头。到底如何，端的无人知晓。这才是头一桩。"
 SUM_Neo_SGD.13.a:"循教令院发下的旧例"
 SUM_Neo_SGD.13.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Tomb_Slab:"掘墓人的口供"
 SUM_SGD_PRO_Tomb_Slab_desc:"掘墓人被抓住，审了三夜，鞭子抽断两根。他交代的是遗迹里的机关怎么开、哪道门会塌，一句也不提金子去了哪。问到第三夜，他抬起头说：我若知道金子在哪，还掘什么墓。"
 SUM_Neo_SGD.14.t:"掘墓人的口供"
 SUM_Neo_SGD.14.d:"有几个掘墓的贼，摸进沙漠深处的遗迹，想刨些值钱的东西。谁知那遗迹里机关重重，他们才挖开一处甬道，便触动了机关，被守在那里的人当场拿住。官署把这伙人抓回去，审了整整三夜。那三夜里，刑讯的动静，隔着几条街都听得见。众人原本以为，这帮贼必是刨出了金子，交代的自然是金子的去处。谁知审到最后，那几个贼交代的，竟全是遗迹里机关的布置，这里有个暗弩，那里有道陷坑，一五一十，说得清清楚楚。问到金子，却都说没见着什么金子。这端的出乎众人意料。审案的官，起初不信，反复拷问，那几个贼翻来覆去，只有一句话，机关倒是见了不少，金子却没摸着。有分教：三夜审贼问金子，贼却只说机关多。有道是，凡事预则立。"
 SUM_Neo_SGD.14.a:"把账目封存"
 SUM_Neo_SGD.14.b:"把账目摊开"
 SUM_SGD_PRO_Staff_Scarlet:"赤沙之杖的传说"
 SUM_SGD_PRO_Staff_Scarlet_desc:"老辈人说赤王有一根杖，杖所指处，沙会开，水会来，枯井里也能涌出甘泉。年轻人撇嘴，说那是哄孩子的故事，可一到夜里，还是围着火听，听得眼睛发亮。"
 SUM_Neo_SGD.15.t:"赤沙之杖的传说"
 SUM_Neo_SGD.15.d:"沙漠深处的阿如村，每到夜里，篝火边便围满了人。老辈人捧着水烟袋，慢悠悠讲起赤王的旧事，说赤王当年有一根神杖，杖头往沙地轻轻一点，沙子便向两边裂开，清水汩汩涌将上来，荒滩转眼化作绿洲。几个年轻人嘴上撇着，笑这是哄娃娃的闲话，说谁真见过什么神杖。可到了夜深人静，一个个却把身子往前挪，连大气也不敢出，眼睛直盯着火堆，只怕漏听半句。有个孩童追问杖尖落在何处，老人抬手一指远处黑黢黢的沙丘，众人便都回过头去望，仿佛那沙丘当下就会裂开一般。这杖是真是假，谁也讲不明白，可沙漠里的人，心底都盼着有一日沙真能开、水真能来，好教子孙不再受这干渴之苦。"
 SUM_Neo_SGD.15.a:"按官署的判断行事"
 SUM_Neo_SGD.15.b:"按自己的判断行事"
 SUM_SGD_PRO_Sand_Worm:"沙下的巨虫"
 SUM_SGD_PRO_Sand_Worm_desc:"商队总绕开固定的几处沙丘，说是底下住着东西，驼一近那儿就惊。官署发过公告，白纸黑字说这是迷信，劝人照直走。公告贴出去没几日，绕路的人反倒更多了。"
 SUM_Neo_SGD.16.t:"沙下的巨虫"
 SUM_Neo_SGD.16.d:"沙漠里有几处沙丘，商队经过时总要远远绕开，说是底下压着东西，惹不得。官署的老爷听了，只当是乡野迷信，提笔写了一张公告，贴在路口，写明丘下并无可疑，命众人照旧行走。那告示墨迹尚新，贴告示的差役拍拍手便走了，连一眼也不肯多看那沙丘。公告贴出不上三日，绕路的人反倒更多了。原来那几处沙丘，风一吹便有呜呜的声响，夜里像有人低哭，赶驼的老手说，这是沙下的东西在喘气。有个不信邪的年轻人，仗着胆大，硬从丘边赶车过去，回来时脸色煞白，驼铃一声也没敢摇，问他自己看见了什么，他却摇头不肯说，只劝人以后绕道走。官府的一张纸，压不住人心里的怕，越是要人别怕，怕的人越添了十分。"
 SUM_Neo_SGD.16.a:"先看住脚下的城"
 SUM_Neo_SGD.16.b:"先看住远方的人"
 SUM_SGD_PRO_Elder_Fire:"长老的火塘"
 SUM_SGD_PRO_Elder_Fire_desc:"各部族的长老围着火塘议事，火不熄，话就不停。谁家的水少了，谁家的羊丢了，一桩桩摆开来，说到天亮也有。雨林来的官坐在最外圈，捧着茶碗干笑，半天插不上一句话。"
 SUM_Neo_SGD.17.t:"长老的火塘"
 SUM_Neo_SGD.17.d:"各部族的长老，围着火塘议事，火不熄，话便不停。中间的人们说的是沙里的水草，是驼队的去向，是祖辈传下的老规矩，一句挨着一句，谁也不肯让人。雨林来的官坐在最外圈，身上衣衫齐整，手里捧着公文，那公文上盖着雨林的大印，边角都翻卷了，几次想开口，却被一阵笑声盖了过去。他清了清嗓子，把公文举得高了些，仍旧没人回头。有个年轻长老斜眼瞅了瞅，低声说了句什么，众人便都哄笑起来，笑他不懂规矩，火塘边哪有外人插嘴的份。那官脸上讪讪的，只得把公文卷起收进袖中，闷坐着直到火塘渐冷，末了起身走了，连告辞的话也没人接。这火塘边的位子，坐得进坐不进，端的不是靠官职，是靠祖上流的血。"
 SUM_Neo_SGD.17.a:"循教令院发下的旧例"
 SUM_Neo_SGD.17.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Blood_Law:"血的律法"
 SUM_SGD_PRO_Blood_Law_desc:"部族的规矩写在血里，犯了事，把人带到长老面前，由长老处置，该罚该逐，一句话说完。官署的律条到了沙丘边就打住，再往里走半步，便没人认。两个章程各管一段。"
 SUM_Neo_SGD.18.t:"血的律法"
 SUM_Neo_SGD.18.d:"部族的规矩，不是写在纸上，是写在血里的。谁家偷了水，谁家越了界，连牛羊踩了别家的草场，也要按老法子赔个明白，事由长老处置，罚羊罚驼，重则逐出族外，众人无有一个不服。有一回，官署的差役拿着律条追到沙丘脚下，要拿人问罪，却被一群牧人团团围住。领头的长老把腰刀往沙里一插，说这丘这边是官署的律条，那丘那边是祖宗的血，井水不犯河水。差役看看那把刀，又看看黑压压的人群，只得悻悻退回。有两个年轻的还追出几步，喊说再敢来拿人，就把他捆了丢进沙窝里。差役头也不回，走得飞快。从此官署的律条，到了沙丘边便打住了。纸上写得再明白，也压不住几百年传下来的老规矩。"
 SUM_Neo_SGD.18.a:"把账目封存"
 SUM_Neo_SGD.18.b:"把账目摊开"
 SUM_SGD_PRO_Bridal_Pact:"聘礼与盟誓"
 SUM_SGD_PRO_Bridal_Pact_desc:"两族结亲便是结盟，聘礼单子开得比条约还长，驼几头、布几匹、盐几袋，一笔都不许含糊。成了亲，两家便是一条心，打起来一起上。这一套官署看不懂，也管不着。"
 SUM_Neo_SGD.19.t:"聘礼与盟誓"
 SUM_Neo_SGD.19.d:"沙漠里的两族结亲，便是结盟。聘礼的单子拉得老长，多少只驼、多少匹马、几口井的使用权，还有几匹上好的驼绒、几坛陈年的枣酒，一样样写得清楚，比官署的条约还周详。迎亲那日，两队人马对歌相和，新郎骑着最壮的骆驼，新娘的头巾上缀满银片，走一步响一片，众人交换了信物，又当众饮过一碗水，从此祸福相共。官署的老爷拿到那张单子，请师爷念了半日，翻来覆去看了半晌，横竖看不懂，说这哪像婚书，分明是一份盟约。可他看不懂，也就管不着，人家结他们的亲，立他们的盟。这沙漠里的道理，往往不在官署的条文里，倒在这一碗水、一纸聘礼中。两家从此认了亲家，逢年过节还要互相送礼，比那盟约还热络几分。"
 SUM_Neo_SGD.19.a:"按官署的判断行事"
 SUM_Neo_SGD.19.b:"按自己的判断行事"
 SUM_SGD_PRO_Herdsmen:"牧人与羊群"
 SUM_SGD_PRO_Herdsmen_desc:"牧人赶着羊顺着水草走，哪里有水便往哪里去，一年里踏进城门的回数数得清。可论起沙漠的脾气，比谁都清楚：哪片天要起风，哪处沙会走，望一眼便知。城里人遇上事，还得请他们来问。"
 SUM_Neo_SGD.20.t:"牧人与羊群"
 SUM_Neo_SGD.20.d:"沙漠里的牧人，赶着羊群顺着水草走，一年里踏不进城里几回。城里人笑他们见识短，说这些人连钟点都分不清，谁知这牧人比谁都清楚沙漠的脾气。哪片沙丘背后藏着苦水，哪处岩缝里能寻到湿土，哪阵风来要起沙暴，他抬头看看天，闻闻风里的气味，便知个八九分。羊群要走，他便拔营；羊群不走，他便搭起帐篷守着，一住就是半月。有一年大旱，河水断了，官署派来的向导带着人马迷了路，在沙海里转了三天三夜，水囊都快空了，还是一位老牧人寻见他们，把人带出了沙海。众人这才服气，纷纷拿出钱来谢他，老牧人却摆摆手，只说举手之劳。走惯了沙的人，认的是天色和草色，不是官署画的地图。"
 SUM_Neo_SGD.20.a:"先看住脚下的城"
 SUM_Neo_SGD.20.b:"先看住远方的人"
 SUM_SGD_PRO_Oath_Flower:"永誓之花"
 SUM_SGD_PRO_Oath_Flower_desc:"部族之间立誓，要各折一枝花，插在两家中间，花谢之前谁也不能翻脸。花谢得快，三五日便蔫了，所以这誓立得也勤，一年里不知折掉多少枝。有长老嫌烦，可没了这枝花，谁也下不来台。"
 SUM_Neo_SGD.21.t:"永誓之花"
 SUM_Neo_SGD.21.d:"部族之间立誓，要折一枝花为证。花枝插在中间，花谢之前，谁也不许翻脸。可沙漠里的花，开得艳，谢得也快，朝看还鲜活，暮看就蔫了，花瓣一落，誓便解了。于是这誓言便立得格外勤，今日两族折花立誓，明日又为别的事再折一回。有一回，两族为一口井争得脸红脖子粗，眼看要动手，长者折来一枝花，插在井边，两人对着花各念一句誓词，便各自收了刀。果然三日之内，花就谢了，两家也就和好如初。有人笑说，这花谢得太快，倒显得人情薄。长老却摇头，说花谢了可以再折，誓立了就要认，快有快的好处，谁也不好意思长久记仇。这折花立誓，端的也是一门处世的本事。这话听着好笑，用起来却灵，端的把仇怨化在了花开花谢之间。"
 SUM_Neo_SGD.21.a:"循教令院发下的旧例"
 SUM_Neo_SGD.21.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Eremite_Banner:"旅团的旗"
 SUM_SGD_PRO_Eremite_Banner_desc:"镀金旅团不认旗号，只认契约。今日替官署押货，明日替与官署作对的人押货，脸不变，刀也不换。有人问他们到底站哪边，领头的把契纸一抖，说站这边。"
 SUM_Neo_SGD.22.t:"旅团的旗"
 SUM_Neo_SGD.22.d:"镀金旅团，不认旗号，只认契约。他们替谁押货，全看谁出的摩拉多。今日替官署押一批军械，明日就许替反对官署的人押另一批，全不觉得有什么不对。有一回，官署与反对的人同时来雇，他们把两头的价码一比，拣高的应了，回头还向低的那头赔个笑，说生意归生意，莫要见怪。押货的路上，遇见官署的巡骑盘问，他们把契约一亮，说是奉命办差，巡骑看看那朱红的印章，也只得放行。因此两边都骂他们反复，两边又都少不了他们。这旅团眼里，旗号是虚的，契约是实的，白纸黑字写明押什么、走哪条路，刀便朝着那个方向，至于那旗号底下坐着的是谁，他们从不放在心上。端的左右逢源，两头都得罪不起。"
 SUM_Neo_SGD.22.a:"把账目封存"
 SUM_Neo_SGD.22.b:"把账目摊开"
 SUM_SGD_PRO_Contract:"契约与摩拉"
 SUM_SGD_PRO_Contract_desc:"旅团的账房比官署的税吏还精明，一笔一划都算得清楚，连草料钱也要摊到人头。契约上写明的，刀便朝着那个方向；没写明的，刀就搁着不动。这行当里，纸上几个字比人命重。"
 SUM_Neo_SGD.23.t:"契约与摩拉"
 SUM_Neo_SGD.23.d:"旅团的账房，端的比官署的税吏还精明。一笔一划，算得清清楚楚，连路上损耗几斗水、折了几只驼，都记得明明白白，算盘打得噼啪作响，一文钱也不肯含糊。契约上写明的，他们一丝不苟照办，写一个字，便办一件事，从不打半点折扣。官署的税吏却不同，收钱时手一摊，名目换来换去，什么脚费、什么验货钱，谁也弄不明白。有一回，两边核对一笔旧账，官署的账目糊成一团，翻了半日也理不出头绪，旅团的账却条理分明，哪日进、哪日出，一笔笔都对得上，反倒成了断案的依据。契约上写得越清楚，刀就朝着那个方向去得越准，这便是旅团立身的本钱。那税吏涨红了脸，翻了半日也挑不出一个错字，只得认输。"
 SUM_Neo_SGD.23.a:"按官署的判断行事"
 SUM_Neo_SGD.23.b:"按自己的判断行事"
 SUM_SGD_PRO_God_King_Legacy:"神王之遗"
 SUM_SGD_PRO_God_King_Legacy_desc:"神王之遗是沙漠里最大的一支佣兵团，名下的附属团数不清，旗子一插，半条商路便归它管。规矩是入团先留案底，姓名、籍贯、欠过谁的债，一样样记下，好拿住人。进了这门就难抽身。"
 SUM_Neo_SGD.24.t:"神王之遗"
 SUM_Neo_SGD.24.d:"神王之遗，是沙漠里最大的一支佣兵团，名下的附属团，数也数不清，大大小小足有几十处，旗号各异，却都认这一个总号。要入这团，头一条规矩便是先留案底，姓名、来历、家在何处、先前干过什么，一桩桩登记在册，按了手印才算了事。有人说这是拿住人的把柄，团里却说，留了案底，弟兄们才不敢乱来，犯了事也好查，死了也好往家里报信。有一回，一个新来的想隐瞒出身，说自己是个放羊的，被账房三问两问便露了马脚，原来是个在别处犯了事逃来的，当下赶了出去，连盘缠也没收。这团能聚起如许多人，端的靠的就是这一本册子。后来团里凡有争执，都翻这册子断是非，端的比刀把子还牢靠。"
 SUM_Neo_SGD.24.a:"先看住脚下的城"
 SUM_Neo_SGD.24.b:"先看住远方的人"
 SUM_SGD_PRO_Blazing_Lion:"炽光之狮"
 SUM_SGD_PRO_Blazing_Lion_desc:"有人从神王之遗里脱了身，身上带着旧伤，也带走了几十个肯跟他走的弟兄。他自己拉了一支队，旗子是新的，第一条规矩便是不接抢劫的活。有人笑他傻，他只说：抢来的钱花着烫手。"
 SUM_Neo_SGD.25.t:"炽光之狮"
 SUM_Neo_SGD.25.d:"有人从神王之遗里脱了身，自己拉起一支队伍。他受够了团里那些打家劫舍的勾当，说跟着他们，钱是赚了，名声却臭了，于是立下的头一条规矩，便是不接抢劫的活，只护商、只押货、只拿该拿的钱。有人笑他清高，说沙漠里靠刀吃饭，哪里挑得干净，你不抢，别人抢，还不是一样。他却不听，宁可少赚些摩拉，也不肯坏了这条规矩。有一回，一伙人被劫了来求他出手，他先问明白是护送还是报仇，听说是护送，便爽快应下，听说是趁火打劫，当即把人赶走。日子久了，商队反倒都愿意找他，图的是个安稳。这人脱身另立门户，端的把自己的名姓看得比摩拉还重。可见行得正，走得远，商队认的是这份踏实，不是嘴上的豪言。"
 SUM_Neo_SGD.25.a:"循教令院发下的旧例"
 SUM_Neo_SGD.25.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Mercenary_Code:"佣兵的规矩"
 SUM_SGD_PRO_Mercenary_Code_desc:"佣兵有佣兵的讲法：付钱之前是朋友，酒肉管够；付钱之后是路人，各走各的；赖账便是仇人，刀上说话。这条讲法比官署的律例好使得多，说出去人人认，不必请官断。"
 SUM_Neo_SGD.26.t:"佣兵的规矩"
 SUM_Neo_SGD.26.d:"佣兵有佣兵的讲法：付钱之前是朋友，称兄道弟，酒肉不分；付钱之后是路人，各走各路，谁也不欠谁；若是赖账，那便是仇人，刀兵相见，决不轻饶。这条讲法，比官署的律例好使得多。官署断案，要写状子、要过堂、要等批文，三推四阻，黄花菜都凉了。佣兵却干脆，一句赖账，当下便见分晓，绝无第二句话。有一回，一个商队想赖掉尾款，才起了心思，风声便传到佣兵耳朵里，还没等他出门，刀已经架在了脖子上，那商人吓得腿软，连忙如数付清，还多赔了一桌酒钱。这道理虽粗，却管用，沙漠里的人认这个，比认官署的告示还深。端的省了多少告状的工夫，也省了那些推诿扯皮的口舌，所以人人都服。"
 SUM_Neo_SGD.26.a:"把账目封存"
 SUM_Neo_SGD.26.b:"把账目摊开"
 SUM_SGD_PRO_Camelry:"驼队骑手"
 SUM_SGD_PRO_Camelry_desc:"沙漠里骑马跑不快，马蹄陷进沙里，跑不上半里就得喘。能跑的是驼，一步一晃，能走上整日。驼队的骑手从小跟骆驼一处长大，比军官更懂什么叫耐渴，几时该喂水，几时该勒住。"
 SUM_Neo_SGD.27.t:"驼队骑手"
 SUM_Neo_SGD.27.d:"沙漠里骑马跑不快，能跑的，是驼。马在这样的沙地上，蹄子一陷便是半尺，跑不上几里就喘得口吐白沫，好马也成了废马。驼却不同，脚掌宽厚，踏沙如履平地，几日不饮水也照样驮货，饿了啃几口荆棘也能活。驼队的骑手，从小便跟骆驼一处长大，喂料、饮水、认路、看病，样样精通，哪头驼脾气躁，哪头驼耐力足，他一望便知，比军官更懂什么叫耐渴。有一回，一队官兵带着马进沙海，渴得人仰马翻，马一匹匹倒下，还是一位驼队老手领着，寻到一处隐蔽的水源，才把人带了出来。打仗要使马，走沙漠却得使驼，各有各的用处，用错了地方，便是自取其累。驼队走沙海，端的要靠这般老手，换个生手来，非把人马折在里头不可。"
 SUM_Neo_SGD.27.a:"按官署的判断行事"
 SUM_Neo_SGD.27.b:"按自己的判断行事"
 SUM_SGD_PRO_Tribal_Militia:"部族民兵"
 SUM_SGD_PRO_Tribal_Militia_desc:"各部族自己养着民兵，兵器是自家的，粮是自家的，操练也在自家场院。官署征调过两回，头一回去了三百，回来一百五；第二回长老把青壮藏进沙窝。这兵，是部族的兵。"
 SUM_Neo_SGD.28.t:"部族民兵"
 SUM_Neo_SGD.28.d:"各部族自己养着民兵，兵器是自家的，粮草也是自家的，不用官署一文钱，连操练都在自家的草场上。官署征调过两回，说是要合并训练，编入官军，结果去的浩浩荡荡，回来的不到一半，剩下的不是逃了，就是伤了。原来这些民兵，宁可回家种地放羊，也不肯受官署的约束，更不愿听外人的号令。有一回，官署又来点卯，各部的头人你推我诿，这个说人病了，那个说驼丢了，还有一个说为准备水草走不开，愣是凑不齐数。派来的官儿气得直瞪眼，却也无可奈何。这民兵认的是族里的长老，不是官署的印信，谁给粮草就跟谁走。可见强扭的瓜不甜，官署的算盘到底打错了，不如由着他们，反倒还能落个人情。"
 SUM_Neo_SGD.28.a:"先看住脚下的城"
 SUM_Neo_SGD.28.b:"先看住远方的人"
 SUM_SGD_PRO_Frontier_Fort:"边关的土堡"
 SUM_SGD_PRO_Frontier_Fort_desc:"边关的土堡垒了又塌，塌了又垒，一层土一层沙，垒了几十年，还是那副模样。守堡的人换过好几拨，口令跟着口音变，堡还是那个堡。新来的兵问这堡守谁，老兵指了指风。"
 SUM_Neo_SGD.29.t:"边关的土堡"
 SUM_Neo_SGD.29.d:"边关的土堡，垒了又塌，塌了又垒。沙一侵蚀，墙皮便一片片往下剥，守堡的人一拨拨地换，先来的嫌苦走了，后来的又补上，唯有那座土堡，还是那个土堡，歪歪斜斜立在风沙里。有一年沙暴过后，堡墙塌了半边，新来的兵找出旧砖，照着原样又垒起来，垒到一半又塌，再垒，直忙到星满天。有人问，这破堡守着有何用，早晚还不是一堆土？老兵说，堡虽破，立在这儿，就是个界，沙漠的人望见它，心里就踏实，知道再往前便是官署的地界。铁打的营盘流水的兵，端的就是这般，人换了一茬又一茬，界却还在那里。老兵说完，又蹲下去补那刚塌的一角，手上泥抹了一脸，年轻兵看了，也默默跟着上手，竟没人肯弃它而去。"
 SUM_Neo_SGD.29.a:"循教令院发下的旧例"
 SUM_Neo_SGD.29.b:"听沙海与部族的呼声"
 SUM_SGD_PRO_Sand_Recon:"沙海的侦察"
 SUM_SGD_PRO_Sand_Recon_desc:"侦察的人走在最前面，低着头，认的是脚印和风，不是地图。马蹄印新不新，风里有没有驼铃，他一眼便知。他们带回来的消息，官署常常不信，等信了，事情已经过了三日。"
 SUM_Neo_SGD.30.t:"沙海的侦察"
 SUM_Neo_SGD.30.d:"侦察的人，总走在队伍最前头，离大队数十里，单枪匹马，悄悄摸过去。他们认的是脚印和风，不是地图。哪里的沙新翻过，哪里的驼粪还带着温度，哪阵风里夹着生人的气味，他们一望便知，一嗅便明。带回来的消息，官署却常常不信，说这是夸大其词，危言耸听。有一回，侦察的人报告前方沙丘后有埋伏，足有百十号人，回来时衣裳都刮破了，也不肯歇一口气，先把消息报了。官署的军官不信，说哪来许多人，执意进军，结果中了伏，人马折了大半，吃了大亏，那军官自己也被捉了去。这沙海里的眼睛，端的比纸上的图靠得住，不信眼线，只信地图，便是这般下场。端的眼线胜过地图百倍，可惜那军官到死也没明白这个道理。"
 SUM_Neo_SGD.30.a:"把账目封存"
 SUM_Neo_SGD.30.b:"把账目摊开"
 SUM_SGD_PRO_Smuggled_Arms:"偷运的军械"
 SUM_SGD_PRO_Smuggled_Arms_desc:"军械挂着各种名目运进沙漠，写成农具、写成锅碗、写成给神庙的供奉。官署查得紧，便绕着走别的路，驼队昼伏夜行。查到后来，连查的人也开始带货，抽一份脚钱。"
 SUM_Neo_SGD.31.t:"偷运的军械"
 SUM_Neo_SGD.31.d:"军械从各样名目下运进沙漠，有的报作农具，有的报作商货，有的干脆夹在盐包里，官署查得紧，运货的便绕别的路走。一开始还偷偷摸摸，夜里赶路，见了卡子就发慌，后来查的人收惯了好处，索性睁一只眼闭一只眼，见车就放。查到最后，连查的人自己也加入了带货的行列，白天查货，夜里放货，月底分钱。有一回，一个新来的税吏认真起来，要开箱验货，箱盖都掀开了，反倒被同僚拉到一旁劝住，说这是大家的饭碗，何必认真，那税吏只得把手缩了回去。这沙漠里的关防，端的查来查去，查成了一笔生意。端的把个关防，做成了发财的营生，上头睁一只眼，下头乐得其所，唯有那新来的还蒙在鼓里。"
 SUM_Neo_SGD.31.a:"按官署的判断行事"
 SUM_Neo_SGD.31.b:"按自己的判断行事"

 #### 独立之路 ####
 SUM_SGD_IND_The_Long_Road:"漫长的独立路"
 SUM_SGD_IND_The_Long_Road_desc:"沙漠与雨林之间隔着的不只是沙。要走到独立那一步，先得把散在各处的城邦、部族与旅团捏成一股绳，你争我夺的旧账暂且撂下。绳捏成了，还得让雨林亲眼看一看，这股绳勒得住它自己。"
 SUM_Neo_SGD.32.t:"漫长的独立路"
 SUM_Neo_SGD.32.d:"沙漠与雨林之间，隔着的不只是沙，还有几百年积下的怨气。要走到独立的那一步，先得把散在各处的城邦、部族与旅团，捏成一股绳，再让雨林相信，这股绳勒得住它自己，不会一扯就散。说客们四处奔走，一会儿劝这城的头人，一会儿说那族的长老，磨破了嘴皮，连嗓子都哑了。有人问，这绳真有那么结实？为首的指着远处说，一根绳细，十根绳粗，百根绳便能拴住骆驼，只要大家心齐，雨林纵有千军万马，也奈何不得。这独立二字，说起来轻，做起来重，端的先要人心齐，心不齐，再多的人也是一盘散沙。可惜话是这么说，做起来却难如登天，各部各有各的算盘，说客们磨破了嘴，也未见得人人点头。"
 SUM_Neo_SGD.32.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.32.b:"把盟约收进箱底"
 SUM_SGD_IND_Envoy_Tribes:"派出说客"
 SUM_SGD_IND_Envoy_Tribes_desc:"说客带着礼物走遍各部，毡房里坐一坐，火塘边蹲一蹲，礼物是次要的，话才是主要的。他从不把话说明，只把话头递过去，让长老们自己接。接住了，便是长老们的主意。"
 SUM_Neo_SGD.33.t:"派出说客"
 SUM_Neo_SGD.33.d:"有说客，带着礼物走遍各部，礼物是次要的，话才是主要的。话要说得巧妙，让长老们听着听着，觉得这主意原是自己想出来的，不是别人塞给他的。说客到了一族，先不提正事，只陪着喝茶，夸这族的水草好、驼队壮、姑娘俊，夸够了，才慢慢说到雨林的欺压，说一句，停一停，看长老脸色。长老一拍大腿，说这事我早有此意，只是没人敢先提。说客便顺势把盟约的条文递上，长老看也不看便签了名，还连声说是该当如此。这游说的本事，端的在于教人觉得主意是自己的，到了这个份上，事情便成了一大半。端的把话说到人心坎上了，所以一路走下来，盟约签得顺顺当当，这也算一桩本事。"
 SUM_Neo_SGD.33.a:"召集部族共商"
 SUM_Neo_SGD.33.b:"等官署先松口"
 SUM_SGD_IND_Council_Sand:"沙海议事"
 SUM_SGD_IND_Council_Sand_desc:"几十个部族的代表聚在一处，坐了三天，毡房外头骆驼拴了一长排。吵得最凶的不是水权，是座次，谁坐上手谁坐下手，争到脸红脖子粗。散会时，却把最要紧的一条写进了盟约。"
 SUM_Neo_SGD.34.t:"沙海议事"
 SUM_Neo_SGD.34.d:"几十个部族的代表，聚在一处，一连坐了三天，帐篷外驼马拴了一大片。吵得最凶的，不是盟约的条文，倒是座次。谁坐上首，谁坐下手，谁挨着长老，谁靠边站，各不相让，争得面红耳赤，几乎要拔刀。到了第三日，饭也顾不上吃，忽然有人冲进来，说雨林的兵又过了界，抢占了两口井，众人神色一凛，当下把座次丢过一边，你一句我一句，把要紧的一条写进了盟约，从此共御外侮，有福同享，有祸同当。散会时，先前争座次的人，反倒互相让起座来，都说你坐上首。这盟约能成，端的靠的是外头那个共同的敌人。端的应了那句老话，兄弟阋于墙，外御其侮，先前的争吵，此刻想来倒像是一场笑话，众人也都笑了。"
 SUM_Neo_SGD.34.a:"备好兵与粮"
 SUM_Neo_SGD.34.b:"多派几趟使节"
 SUM_SGD_IND_Pact_Blood:"血誓之盟"
 SUM_SGD_IND_Pact_Blood_desc:"立盟要放血，要折花，要当众念一遍祖辈的誓词。血滴在同一个碗里，花插在众人中间，誓词一句一句念下来，念到末一句，几十条汉子的声音都哑了。念完就不再各顾各。"
 SUM_Neo_SGD.35.t:"血誓之盟"
 SUM_Neo_SGD.35.d:"立盟那日，要放血，要折花，要当众念一遍祖辈传下的誓词。血滴进碗里，酒也倒进碗里，花插在碗边，众人轮流念那拗口的古话，念得磕磕绊绊，有人念错了字，急得满脸通红，却无人敢笑。念完，把这碗血酒分饮了，一人一口，传下去，从此这些人便不再是各顾各的部族，而是一家人，有难同当。有一个年轻人在底下小声问，这誓词念完当真就作数？长老瞪他一眼，说血都喝了，还能有假，你要是反悔，这碗酒可不是白喝的。年轻人吓得吐了吐舌头。这立盟的规矩，端的靠这一碗血酒，把几十颗心拴在一处。端的把众人拴成了一条心，从此有福同享，有祸同当，谁家有了难，各处都来相帮，再不是各顾各的散沙。"
 SUM_Neo_SGD.35.a:"把旗立起来"
 SUM_Neo_SGD.35.b:"把旗先卷起来"
 SUM_SGD_IND_Chieftain_League:"部族同盟"
 SUM_SGD_IND_Chieftain_League_desc:"同盟不设共主，只设一个轮值的座，一年一换，谁也别想赖着不走。谁坐上去，谁就得替大家扛事，出了岔子头一个挨骂。坐上三日，便知道这座位不好坐。"
 SUM_Neo_SGD.36.t:"部族同盟"
 SUM_Neo_SGD.36.d:"这同盟，不设共主，只设一个轮值的座。今年你坐，明年他坐，谁坐上去，谁就得替大家扛事，遇了事头一个出头，有了难头一个顶上，赔钱出力，都在所不辞。座上的人虽无共主之名，却有共主之实，只是这实权轮着来，谁也别想独占，今年风光，明年便退到一边听人调度。有一回，轮到一位年轻的头人坐座，遇上雨林挑衅，抢了牲畜，他年轻气盛，拍案而起，点起人马就去追，果然替众人争回了面子，把牲畜夺了回来。这轮值之法，端的能防一人独大，又能教人人出力，端的妙得很。比立一个共主还妥当，共主做得久了便要专权，这轮座的却年年换人，想专也专不成，倒把众人拧成了一股绳。"
 SUM_Neo_SGD.36.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.36.b:"把盟约收进箱底"
 SUM_SGD_IND_Hidden_Camp:"沙下的营地"
 SUM_SGD_IND_Hidden_Camp_desc:"沙丘背风的一面，藏着一处营地。远望过去黄沙漫漫，半点痕迹也不露。要走的人先在此歇脚，换过衣裳，再分头出去。这营不挂旗，不举火，白日里静得像一片死沙。"
 SUM_Neo_SGD.37.t:"沙下的营地"
 SUM_Neo_SGD.37.d:"营地在沙丘背风的一面，从外边望去，只见黄沙漫漫，看不出半点痕迹，连个脚印也寻不见。要走的人，先在这里落脚，歇过气，喝口水，换过装，再分头出去，各奔东西。营里立着几根木桩，拴着骆驼，地下埋着水囊，还有几袋炒熟的麦子，都是事先备好的。外头的巡骑经过，也看不出这沙丘后头藏着许多人马，只道是荒丘一座。有一回，追兵从这里经过，离营地不过一箭之地，马蹄声都听得见，众人屏住气息，连骆驼也捂住了嘴，追兵竟丝毫没有察觉，扬尘而去。这藏兵的法子，端的靠的是沙丘这一道天然屏障。端的藏得严实，若不是自家引路，外人哪里寻得着，便是走到跟前，也只当是荒丘一座，谁的脚也不会往那里拐。"
 SUM_Neo_SGD.37.a:"召集部族共商"
 SUM_Neo_SGD.37.b:"等官署先松口"
 SUM_SGD_IND_Foundry:"沙中的铁匠铺"
 SUM_SGD_IND_Foundry_desc:"城里的铁匠铺，白日打锄头镰刀，夜里却打别的东西。炉火从早烧到晚，没凉过一回。来取货的人从不走前门，只绕到后巷敲三下门。这铺子打的什么，街坊谁也不问。"
 SUM_Neo_SGD.38.t:"沙中的铁匠铺"
 SUM_Neo_SGD.38.d:"铁匠铺，白天打的是锄头镰刀，夜里打的，却是别的物事。炉子从早烧到晚，没个凉的时候，风箱呼嗒呼嗒响个不停。来取货的人，从不走前门，都是趁黑绕到后门，先敲三下，停一停，再敲两下，递上牌子，对上了暗号，货便从后窗递出来，一手交钱，一手交货，从不多点灯。有一回，官署的差役白天来查，铁匠正叮叮当当打一把锄头，火星子四下飞溅，验过便走了，谁也想不到，这铺子夜里打的是刀，更是连夜打好的一批，都埋在后院的沙堆底下。这明修栈道、暗度陈仓的手段，端的瞒过了多少人的眼睛。端的神不知鬼不觉，官署的人只道那铺子生意清淡，哪知它夜里灯火通明，打的尽是刀枪，一宿能出十几把。"
 SUM_Neo_SGD.38.a:"备好兵与粮"
 SUM_Neo_SGD.38.b:"多派几趟使节"
 SUM_SGD_IND_Camel_Corps:"驼骑整编"
 SUM_SGD_IND_Camel_Corps_desc:"各部驼队，如今都编了号，按号发粮。从前各部自管自，号令七零八落；如今一声令下，驼铃齐响。编了号，谁该出多少粮，谁走了几趟，翻开册子便知。"
 SUM_Neo_SGD.39.t:"驼骑整编"
 SUM_Neo_SGD.39.d:"各部族的驼队，如今都编成了号，一号、二号、三号，一直排到几十号，按号发粮，按号派差，谁也别想冒领。从前各部自己管自己，粮草自有，号令自出，合成一处，如今却号令一处出，粮草一处发，队伍整齐了许多，走起路来，一队挨着一队，驼铃响成一片。有一回，官署想故技重施，暗中许以重利，拉拢其中一队，那队的头人却把号牌一亮，说如今我们编了号，听的是盟约的令，不是官署的令，你那点摩拉，还是留着买水喝吧。来人碰了一鼻子灰，只得回去。这编号之法，看着寻常，端的把散沙拢成了拳头。端的令官署没了辙，拉拢不成，又不敢强来，只得由着他们去，从此这编号之法，各处都照着学了起来。"
 SUM_Neo_SGD.39.a:"把旗立起来"
 SUM_Neo_SGD.39.b:"把旗先卷起来"
 SUM_SGD_IND_Sand_Tactic:"沙暴战术"
 SUM_SGD_IND_Sand_Tactic_desc:"沙漠里打仗，讲究借风。风起时黄沙迷眼，便按兵不动；风一停，就一拥而上。这法子是几百年拿血换来的经验，写不进书，只在一辈辈人嘴里传。会等风的人，才配赢这一仗。"
 SUM_Neo_SGD.40.t:"沙暴战术"
 SUM_Neo_SGD.40.d:"沙漠里的仗，要借着风打。风起的时候，沙遮天蔽日，睁不开眼，箭也射不准，这时候交手，谁也看不清谁，所以不打，各自收敛人马，寻地方躲风。要等风停了，尘沙落定，人马精神也养足了，再厮杀不迟。这是几百年打出来的经验，老兵传小兵，记了又记，写在羊皮上，念了又念。有一回，一支人马不懂这个道理，仗着人多，趁风起时掩杀过去，结果逆风眯了眼，弓拉不开，刀也砍不实，被对方杀得大败，主将也受了伤。这沙漠用兵，端的要顺天时、借地势，不是光凭一腔血气。端的吃了大亏，才记住这教训，后来沙漠里用兵，都要先问风向，风未起时按兵不动，风既定了一鼓作气，再不敢造次，这教训记了整整一代人。"
 SUM_Neo_SGD.40.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.40.b:"把盟约收进箱底"
 SUM_SGD_IND_Powder_Store:"隐蔽的弹药库"
 SUM_SGD_IND_Powder_Store_desc:"弹药分藏在几处废弃的遗迹里，位置只有三人知晓。这三人里，后来有一个失了踪。剩下两个谁也不敢独自去动那些坛罐，怕一不小心，连自己一并埋进沙里。"
 SUM_Neo_SGD.41.t:"隐蔽的弹药库"
 SUM_Neo_SGD.41.d:"弹药分藏在几处废弃的遗迹里，都是早年赤王时代留下的旧洞，位置只有三个人知道。三人各记一处，互相不知全貌，为的是防万一，便是被人拿住，也交不出全部。不想其中一人，后来竟失踪了，生不见人，死不见尸，连住处的行李也没带走。众人猜疑了许久，有的说被官署抓了，严刑逼供，有的说卷了财物逃走，还有的说遇了沙暴，埋在沙里。为首的放心不下，只得把另外两处赶紧转移，连夜挖出来，另换地方埋好。这藏货的法子，端的也怕人心靠不住，防来防去，防的还是自己人。端的防人防到自己头上来了，后来团里立下新规，凡管一处暗号的，家眷都要留在营里，每月还要对一遍口供，如此费尽心机，也不知是福是祸。"
 SUM_Neo_SGD.41.a:"召集部族共商"
 SUM_Neo_SGD.41.b:"等官署先松口"
 SUM_SGD_IND_War_Drill:"临战操演"
 SUM_SGD_IND_War_Drill_desc:"操演放在夜里，练的是集结与分散。练到后来，连口令都省了，只看火光的明暗，便知该往哪走。黑暗里不靠嘴，靠的是眼睛和脚。"
 SUM_Neo_SGD.42.t:"临战操演"
 SUM_Neo_SGD.42.d:"操演在夜里进行，练的是集结与分散。一声令下，众人从四面八方聚拢，悄无声息；再一声令下，又散作满天星，眨眼间没了踪影。练到后来，连口令都省了，只看火光的明暗，便知道该往哪里走、该聚还是该散，火把一举是聚，火把一灭是散，火光向左便往左。有一回，官署的探子远远望见沙丘上灯火明灭，一会儿亮，一会儿灭，忽东忽西，看不懂是何讲究，只回报说沙漠人在夜里点灯玩耍，小孩子一般。这无声的操演，端的练的是默契，火光便是命令，比喊破喉咙还管用。端的比金鼓旌旗还灵，那探子回报之后，官署将信将疑，派了大队人马夜里来窥，远远望见火光起落，仍旧莫名其妙，只道沙漠人果然行事古怪，哪里知道这火光里藏着千军万马的号令。"
 SUM_Neo_SGD.42.a:"备好兵与粮"
 SUM_Neo_SGD.42.b:"多派几趟使节"
 SUM_SGD_IND_Toll_Posts:"商路税卡"
 SUM_SGD_IND_Toll_Posts_desc:"税卡设在路口，收的是过路钱。这钱不进官库，却进了盟约的账，一笔一笔都算在众人头上。收税的也老实，收完便在牌上记一笔，谁也别想糊涂。"
 SUM_Neo_SGD.43.t:"商路税卡"
 SUM_Neo_SGD.43.d:"税卡设在路口，收的是过路钱，数额写得明明白白，摆在桌上，谁也不许多要一文。这钱却不进官署的库，进的是盟约的账，用以养兵、买械、救济穷族，一笔笔都记在册上。车队打这里过，车辙一直压到城门口，赶车的老手都认得这规矩，主动把摩拉交了，换取一路平安，还要道一声辛苦。有一回，官署的税吏也来凑热闹，想在旁边另设一卡，同样的货，偏要多收一份，却被商队集体绕开，宁可多走三十里，也不从他那里过，一个子儿也没收着，那税吏只得灰溜溜撤走。这税卡收的钱，取之于商，用之于众，端的比官署的苛捐赢得了人心。端的比官署会收买人心，商队宁可多走这三十里，也不肯去那多收一文的卡子，人情向背，就在这几文钱上。"
 SUM_Neo_SGD.43.a:"把旗立起来"
 SUM_Neo_SGD.43.b:"把旗先卷起来"
 SUM_SGD_IND_Salt_Monopoly:"盐利专营"
 SUM_SGD_IND_Salt_Monopoly_desc:"沙漠缺盐，盐就是命。谁把盐捏在手里，谁便捏住了大半条商路。从前有奸商囤盐，等着高价出卖，害得百姓淡着嘴过日子。如今盐归了公，价钱平稳，人心也稳。"
 SUM_Neo_SGD.44.t:"盐利专营"
 SUM_Neo_SGD.44.d:"沙漠缺盐，盐便是命。没有盐，人没气力，肉也存不住，几日便要坏。谁要是把盐捏在手里，便等于捏住了大半条商路，因为产盐的那几处盐湖，都在沙漠腹地，四周尽是流沙，外人寻不见路。官署想垄断盐利，派兵守了盐湖，结果沙漠人干脆绕开官署的商路，自己组织驼队贩运，夜里装盐，白天赶路。有一回，官署断了盐的供应，想逼人就范，谁知各部早有储存，家家户户都藏着几坛盐，反倒把官署的市镇闹得没盐可用，居民叫苦不迭，官署只得又把路放开。这盐虽小，端的能系住一方人的生死。端的把盐看成了命根子，后来沙漠人自己立了盐法，谁贩盐、走哪路、卖什么价，都定得清清楚楚，官署再想插手，也插不进来了。"
 SUM_Neo_SGD.44.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.44.b:"把盟约收进箱底"
 SUM_SGD_IND_Caravan_Pact:"商队盟约"
 SUM_SGD_IND_Caravan_Pact_desc:"商队立盟互保，路上遇了劫，一齐还手。这法子比官署的巡防还管用。巡防来去有时，商队却日日同行，首尾相顾，劫匪见了也得掂量。"
 SUM_Neo_SGD.45.t:"商队盟约"
 SUM_Neo_SGD.45.d:"商队立了盟，互相担保，路上遇了劫，一处遇险，各处一起还手，绝不袖手旁观。这一条，比官署的巡防管用得多。官署的巡兵来得慢，等赶到时，货早被抢光了，只剩下空驼在沙里打转。商队自己却不同，驼铃一响，附近的同伴便围拢过来，少则十几，多则几十，把劫匪团团困住。有一回，一伙悍匪劫了一支商队，正在那里分赃，正当得意，四面八方涌来数十条好汉，刀光一闪，打得匪徒抱头鼠窜，连抢去的东西也尽数夺回。这互保之法，端的胜过了官署的巡防，靠的是众人齐心。端的靠的不是一人力勇，而是众人齐心，后来那几个匪徒被捆了送到盟约的帐前，当众发了誓，从此再不敢打沙漠商队的主意，这互保之名，越发传得远了。"
 SUM_Neo_SGD.45.a:"召集部族共商"
 SUM_Neo_SGD.45.b:"等官署先松口"
 SUM_SGD_IND_Coin_Sand:"沙海的铸币"
 SUM_SGD_IND_Coin_Sand_desc:"几家大商户合铸了一种新钱，成色足，掂着沉，比官铸的还好使。市上的人认这钱，却不认那印章。钱好不好使，不在印，在分量。那钱攥在手里，沉甸甸的叫人安心。"
 SUM_Neo_SGD.46.t:"沙海的铸币"
 SUM_Neo_SGD.46.d:"几家大商户，合在一起铸了一种新钱，成色足，分量准，比官署铸的钱还好使。官署的钱越铸越薄，含的铜也越来越少，这新钱却是实打实的，市上的人认这个，不认官署的印章。拿这新钱去买货，童叟无欺，商人也乐意收，收了转手就使，从不打折。官署急了，下令禁用，说私铸钱币是死罪，告示贴得满城都是，可市上照用不误。有一回，官署的巡吏在集市上收缴，摊主们把钱往怀里一揣，异口同声说这是找零寻不开的，你搜我这搜他，竟搜不出一枚，巡吏也无可奈何。这钱好不好使，端的在成色，不在印章。端的把官署的威风扫尽了，后来官署索性也睁一只眼，私下里收起铸钱的税来，反倒落个实惠，只是面子上还挂着禁用的告示。"
 SUM_Neo_SGD.46.a:"备好兵与粮"
 SUM_Neo_SGD.46.b:"多派几趟使节"
 SUM_SGD_IND_Blockade_Market:"罢市与封锁"
 SUM_SGD_IND_Blockade_Market_desc:"要挟雨林，罢市比动兵更管用。集市一关，往雨林去的货便断了，缺了粮盐，那里先乱。不动一刀一枪，叫人自己服软，这才是上策。"
 SUM_Neo_SGD.47.t:"罢市与封锁"
 SUM_Neo_SGD.47.d:"要挟雨林的时候，罢市比动兵还管用。集市一关，往雨林去的货便断了，香料、盐、驼绒、药材，样样都缺。雨林的人离了沙漠的货，日子便不好过，连官署的厨房都开不出像样的饭食。有一回，雨林无理欺压，扣押了沙漠的商队，沙漠人也不动刀兵，只把集市一关，三条街的摊子全收了，货栈也落了锁，钥匙攥在会长手里，连卖水的也挑着担子回了家。不出半月，雨林那边便派人来讲和，态度比先前恭顺了许多，还主动放了扣押的商队。这罢市之策，端的兵不血刃，便叫人低了头，比起刀兵相见，端的省了许多性命。端的叫雨林吃了个哑巴亏，讲和时还赔了几车货，从此雨林再不敢轻易扣押沙漠的商队，这罢市二字，端的成了沙漠手里的一张硬牌。"
 SUM_Neo_SGD.47.a:"把旗立起来"
 SUM_Neo_SGD.47.b:"把旗先卷起来"
 SUM_SGD_IND_Proclamation:"告沙漠民书"
 SUM_SGD_IND_Proclamation_desc:"文书用沙漠古文字写成，贴在每座城的门外。认得的人不多，可认得的，都会念给旁人听。一字传十，十字传百，不消几日，满城皆知。"
 SUM_Neo_SGD.48.t:"告沙漠民书"
 SUM_Neo_SGD.48.d:"文书写在羊皮上，用的是沙漠的古文字，贴在每一座城的门外，拿石块压着四角，生怕风吹跑。认得这字的人本就不多，可认得的，都会念给别人听，念完还要逐句讲解一番。于是这文书上的话，一传十、十传百，满城的人都知道了，连不识字的老婆子也能说上几句。官署派人来撕，前脚撕了，后脚又贴上一张，撕不胜撕。有一回，一个识字的老者站在城门口，高声念那文书，念到激昂处，声音发颤，围听的人越聚越多，密密麻麻站了一片，连差役也不敢上前阻拦，只远远站着。这古文字虽冷僻，端的挡不住话传千里。端的把话传到了千家万户，后来官署见撕不胜撕，索性不再派人，那羊皮文书便一直贴在城门上，风吹日晒，字都淡了，看的人却依旧不少。"
 SUM_Neo_SGD.48.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.48.b:"把盟约收进箱底"
 SUM_SGD_IND_Flag_Raise:"立起旗帜"
 SUM_SGD_IND_Flag_Raise_desc:"那旗是各家凑布缝成的，红底上一只展翅的鸟。旗立起来那天，城门口竟没人收税。过往的商队都停了脚，仰头看那鸟在风里抖翅。那鸟在风里抖着翅膀，像要飞起来。"
 SUM_Neo_SGD.49.t:"立起旗帜"
 SUM_Neo_SGD.49.d:"那面旗，是各家凑了布，你一块我一块，一针一线缝起来的。红底上一只展翅的鸟，是请城里最好的绣娘描的样，绣了整整七日，鸟羽根根分明，像是就要飞起来。旗立起来那一天，风吹得猎猎作响，广场上站满了人，男女老少都有，仰着头看。城门口，往日收税的官署差役不见了，税卡也撤了，过往的车马畅通无阻，赶车的把鞭子甩得啪啪响。有个老汉摸着旗角，眼泪直流，说等了这一日，等了大半辈子，如今总算见着了。这面旗虽是几块布缝的，端的抵得过千军万马，因为它缝的是众人的心。端的把众人的心缝在了一处，从那日起，沙漠各行其是久了，如今旗下一站，便知是一家人，往后遇事，大家都要护着这面旗。"
 SUM_Neo_SGD.49.a:"召集部族共商"
 SUM_Neo_SGD.49.b:"等官署先松口"
 SUM_SGD_IND_Reject_Edict:"拒受敕令"
 SUM_SGD_IND_Reject_Edict_desc:"雨林发来的敕令，当着使节的面撕了。撕的不只是一张纸，是几百年的旧规矩。那使节脸涨得紫，却半句也驳不出，只得拾起碎纸回去。那碎纸片落了一地，没人再去捡。"
 SUM_Neo_SGD.50.t:"拒受敕令"
 SUM_Neo_SGD.50.d:"雨林发来的敕令，当着使节的面，被一把撕了。撕的人手劲很大，纸片纷纷落地，有一片还飘到了使节的靴子上。那使节脸涨得通红，嚷嚷着说这是几百年的规矩，历代相承，撕了便是反叛，要奏明上头，发兵来问罪。为首的长老冷笑一声，说规矩是你们定的，我们沙漠人从来不认，你那几百年，与我们何干。说完，把碎纸扫到一旁，命人端上茶来，请使节坐下说话，就当什么也没发生。使节哪里坐得住，一甩袖子，拂袖而去，连茶也没喝一口。这一撕，撕的是纸，断的是几百年的老规矩。端的撕得干净，也撕得痛快，那敕令的碎片被风一吹，散了一地，有几个后生还要上去踩两脚，长老也不拦，只说让它去吧，横竖再没人认它。"
 SUM_Neo_SGD.50.a:"备好兵与粮"
 SUM_Neo_SGD.50.b:"多派几趟使节"
 SUM_SGD_IND_Claim_Land:"重申地界"
 SUM_SGD_IND_Claim_Land_desc:"地界重划了一遍，雨林立的界碑被挪走，换成本地长老垒的石堆。那石堆不高，却压得住人心。从此这地归谁，看石堆便知。那石堆垒得歪歪扭扭，却没人敢挪。"
 SUM_Neo_SGD.51.t:"重申地界"
 SUM_Neo_SGD.51.d:"地界重新划了一遍。雨林设在沙漠边缘的界碑，是早年用汉白玉刻的，如今被一处处挪走，推倒在地，换成本地长老立起的石堆。石堆不高，垒得却结实，一块压一块，上面还压着一块刻了字的石头，字是沙漠的古文。有雨林的人来理论，说界碑是朝廷立的，盖着大印，怎么能挪，这是羞辱朝廷。长老把手一指那些石堆，说这地里的沙，哪一处没流过我们祖宗的血，界碑认不得，石头认得，你那大印，在这里不好使。那人还要争辩，众人便一齐围上来，他只得悻悻走了。这石堆虽土，端的立的是自家的底气。端的把自家的地界立住了，后来雨林再派人来量地，望见那些石堆，便知这里是沙漠的地盘，话也说不出口，掉头就走。"
 SUM_Neo_SGD.51.a:"把旗立起来"
 SUM_Neo_SGD.51.b:"把旗先卷起来"
 SUM_SGD_IND_Declaration_Text:"独立宣言的定稿"
 SUM_SGD_IND_Declaration_Text_desc:"宣言改了七稿，改到最后只剩三条：不受敕令，自定赋税，自养军伍。话少反而有力，十七条抵不上这三条。念的人只念了三句，底下的人却记了一辈子。"
 SUM_Neo_SGD.52.t:"独立宣言的定稿"
 SUM_Neo_SGD.52.d:"那宣言，前前后后改了七稿，改一回，吵一回，纸都写了几十张。第一稿洋洋洒洒，写了几十条，从赋税写到兵役，从水道写到市集，后来越删越短，改到最后，只剩下三条：一不受雨林敕令，二自定赋税，三自养军伍。有人嫌太少，说三条怎么够，脸上无光。为首的却说，字越少，记得越牢，办得到才是真的，写一百条办不到，不如三条条条算数，落地生根。众人听了，都点头称是，当下把三条抄在羊皮上，念了三遍。这宣言改到七稿才定，端的删繁就简，句句都要落地。端的字字算数，后来盟约里凡有争议，都拿这三条来断，合则用，不合则改，不改的便不算盟约，这般干脆，倒是从前那几十条做不到的。"
 SUM_Neo_SGD.52.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.52.b:"把盟约收进箱底"
 SUM_SGD_IND_Envoy_North:"北方来的信使"
 SUM_SGD_IND_Envoy_North_desc:"北边来的信使，在城外等了半月，才得见一面。见面只问一句：沙漠站哪一边。这一句问得重，满堂都静了。那信使在城外等得胡子都长了，也没人给他准话。"
 SUM_Neo_SGD.53.t:"北方来的信使"
 SUM_Neo_SGD.53.d:"北边来的信使，在城外足足等了半个月。守城的起先不许他进城，说没有文书，不许擅入，他就在客栈里住着，日日到城门口张望，鞋底都磨薄了。半个月后，终于有人传话，召他进去见面。进了城，一路左弯右绕，蒙上眼睛才带进府里。见了面，那长老也不寒暄，连茶也不倒，只问一句：沙漠站哪一边？信使愣了一下，说这话说来话长，容我从头道来。长老摆摆手，说来话长就别说了，短话才中听，我们只听这一句。信使张了张嘴，竟不知如何回答。这半个月等来的，端的就是这一句要命的问话。端的把来使问住了，那信使在沙漠又住了几日，日日求见，长老只是不见，末了问他一句，你还没想清楚，回去再想想吧，信使只得悻悻回国。"
 SUM_Neo_SGD.53.a:"召集部族共商"
 SUM_Neo_SGD.53.b:"等官署先松口"
 SUM_SGD_IND_Envoy_Port:"港口客商"
 SUM_SGD_IND_Envoy_Port_desc:"港口客商带来的，是船票与价钱。沙漠若开港，货便从海上走，不必再看雨林的脸色。那些船长年在风浪里讨生活，最懂什么划算。"
 SUM_Neo_SGD.54.t:"港口客商"
 SUM_Neo_SGD.54.d:"港口来的客商，带来的不是刀兵，是船票和价钱。他们摊开账本，一样样报给沙漠的头人们听：若沙漠开港，货便从海上走，不必再看雨林的脸色，运费还能省下三成，日子越过越宽裕。头人们听着，眼睛渐渐亮了，互相递着眼色。有个老成持重的问，开港要多少本钱，船从哪里来。客商一笑，说本钱的事好商量，先试一年，赔了算我们的。又说那海路上，风平浪静时，一月便能往返，比走陆路快得多。这海路一开，端的给沙漠添了一条生路，再不必受制于人。端的给沙漠指了一条新路，只是开港要修码头、置船只、设关津，样样都要钱，头人们商量了许久，末了还是咬牙应下，说无论如何，这雨林的脸色，是再也不看了。"
 SUM_Neo_SGD.54.a:"备好兵与粮"
 SUM_Neo_SGD.54.b:"多派几趟使节"
 SUM_SGD_IND_Envoy_Sea:"东海的船队"
 SUM_SGD_IND_Envoy_Sea_desc:"东海来的船队，在近海停了一夜，没有靠岸。旗舰上挂的那面旗，连沙暴天都看得清。这一夜谁也没睡，岸上的人望着灯火，心里各有算盘。"
 SUM_Neo_SGD.55.t:"东海的船队"
 SUM_Neo_SGD.55.d:"东海来的船队，在近海停了一夜，没有靠岸。船上的人远远望见沙漠的海岸线，却按兵不动，只派了几只小艇，在近处转了一圈，量了量水深。旗舰上挂着一面旗，旗色鲜明，在月色下也看得真切，便是沙暴天里，也看得清清楚楚。守在岸上的探子回报，说这支船队来路不明，船有十几艘，桅杆高耸，不知是来做买卖，还是来探虚实。为首的听了，命人加倍留意，昼夜轮班盯着，却不要惊动他们，也不许放箭。这海上来的船队，端的让沙漠人多了一重心思，不知是福是祸。端的让沙漠人一夜没睡安稳，第二日天刚亮，那船队便升帆起了锚，顺着海流往北去了，岸上的人面面相觑，不知这一走，是去而复返，还是就此别过。"
 SUM_Neo_SGD.55.a:"把旗立起来"
 SUM_Neo_SGD.55.b:"把旗先卷起来"
 SUM_SGD_IND_Envoy_Winter:"北国的使团"
 SUM_SGD_IND_Envoy_Winter_desc:"北国使团最舍得花钱，一开口就要驻军的权利。长老们对着那箱银子心动，可一听见驻军二字，又都犯了怵。钱好拿，人难送。银子虽好，驻军二字却没人敢应。"
 SUM_Neo_SGD.56.t:"北国的使团"
 SUM_Neo_SGD.56.d:"北国的使团，最是舍得花钱，一进沙漠，便沿途撒摩拉，收买人心。他们一开口，便要驻军的权利，愿拿大笔摩拉和军械来换，说是帮你守边，分文不取。长老们听着那数目，一个个心动，眼睛发亮，手指在膝上轻轻敲着。可一听到驻军两个字，又不由得犯怵，想起引狼入室的旧事，前朝的教训还摆在眼前，谁也不敢头一个点头。使团以为他们嫌少，又把价码添了添，还许下许多好处。长老们互相看了看，仍旧是不说话，一个个端起茶碗。这钱虽诱人，可驻军二字，端的让人生怕，不敢轻易应承。端的把长老们难住了，钱是要用的，兵是不能让别人驻的，两下里左右为难，议了三日，末了回话说，钱可以收，兵却一个也不引进来。"
 SUM_Neo_SGD.56.a:"把盟约写进沙里的石板"
 SUM_Neo_SGD.56.b:"把盟约收进箱底"
 SUM_SGD_IND_Buy_Arms:"购置军械"
 SUM_SGD_IND_Buy_Arms_desc:"向外邦买军械，买的是铁与火，卖出去的，却是往后若干年的承诺。这买卖看着赚，其实拿将来作押。那铁与火是看得见的，往后那些年却是看不见的。"
 SUM_Neo_SGD.57.t:"购置军械"
 SUM_Neo_SGD.57.d:"向外邦买军械，买的是铁和火，卖的却是往后若干年的承诺。人家把刀枪火药一批批运来，鸟铳、火炮、甲胄，样样精良，条件是沙漠日后要替人家说话，让出几条商路，结为盟友，永不相负。有一回，一批坚利的火器运到，首领抚着炮筒，欢喜不尽，翻来覆去看了又看，可签下那份文书时，手却有些抖，笔都握不稳。旁边的人劝他，说不过是几句话，签了也无妨。他叹道，这几句话，抵得上几千条性命。这天下的便宜，从来不是白占的，得了人家的铁，便要拿将来的承诺去还。端的把后路押了出去，那文书一签，往后十年，沙漠的商路、海运、盟友，都要看人家脸色，将军抚着炮筒的手，抖了许久也没能停住。"
 SUM_Neo_SGD.57.a:"召集部族共商"
 SUM_Neo_SGD.57.b:"等官署先松口"
 SUM_SGD_IND_Declaration:"镀金沙漠宣布独立"
 SUM_SGD_IND_Declaration_desc:"城头那面红底飞鸟旗，升到顶又落下半尺，是风大。广场上站满了人，官署大门关着，石阶上坐着长老，正把盟约念出来。从这一天起，沙漠不再替雨林交税，也不再替雨林出兵。"
 SUM_Neo_SGD.58.t:"镀金沙漠宣布独立"
 SUM_Neo_SGD.58.d:"城头上那面红底飞鸟旗，升到顶，又被风吹落下半尺，旗角猎猎地拍打着旗杆。广场上站满了人，黑压压望不到边，连屋檐上都趴着孩子。往日收税的官署，大门紧紧关着，门上的封条还新，墨迹未干。石阶上坐着几位长老，正把盟约一条条念出来，声音洪亮，字字清楚，念一条，众人便应一声。从这一天起，沙漠不再替雨林交税，也不再替雨林出兵，各自的日子各自过。念到最后一条，旗恰被风扯得笔直，展翅的鸟像是活了，众人齐齐欢呼，声震沙天。这一日，端的改变了沙漠的命数。端的宣了个明白，从此沙漠的税自己收，兵自己养，雨林的敕令进了沙漠便是一张废纸，广场上欢声雷动，连那面旗也似懂人意，猎猎作响。"
 SUM_Neo_SGD.58.a:"备好兵与粮"
 SUM_Neo_SGD.58.b:"多派几趟使节"

 #### 甲线 · 沙海商路 ####
 SUM_SGD_RA_The_Caravan_Road:"沙海商路的算盘"
 SUM_SGD_RA_The_Caravan_Road_desc:"有人主张，沙漠的未来在绿洲与商队：把水引出来，把城邦立起来，让契约与律例管事。这条路走得慢，可走过的城邦，没有一个愿意回头。"
 SUM_Neo_SGD.59.t:"沙海商路的算盘"
 SUM_Neo_SGD.59.d:"有人主张，沙漠的未来在绿洲与商队，不在刀枪。把水引出来，把城邦立起来，让契约和律例管事，人人有活干，有饭吃，不靠打劫过日子。这条路走得慢，一城一城地建，一渠一渠地修，十年树木，急不得。可走过的城邦，没有一个愿意回头去过那游荡的日子，住惯了城里，便再不想睡帐篷。有一回，一个在城邦住惯了的人，随商队出了趟远门，风餐露宿，吃尽了苦头，回来便说，还是城里踏实，有井有水，有街有市。这慢工出细活，端的稳当，比那铤而走险的强。端的走得慢，却走得稳当，那些靠刀枪起事的地方，今日称王，明日便败，反倒不如这一渠一城，攒下了便是攒下了，谁也夺不去，住进去的人，再不想走。"
 SUM_Neo_SGD.59.a:"让商路连通四方"
 SUM_Neo_SGD.59.b:"把商路关起来自守"
 SUM_SGD_RA_Aqueduct:"引水入城"
 SUM_SGD_RA_Aqueduct_desc:"水渠从山里引来，一路铺到城根。渠修成那天，城里的人放下手里的活，都站在渠边看水。那水流得慢，看的人却久久不肯散。有水的地方，连风都显得软了些。"
 SUM_Neo_SGD.60.t:"引水入城"
 SUM_Neo_SGD.60.d:"水渠从山里引来，一路弯弯绕绕，穿过沙丘，绕过石滩，铺到城根底下。渠修成那天，城里的人放下手里的活，男女老少都站在渠边看水，铁匠丢了锤子，卖菜的挑着担子就跑来了。那水清亮亮的，顺着新修的渠汩汩流来，阳光底下一闪一闪，孩子们伸手去撩，被大人喝住，怕他们失足。有个老人蹲在渠边，捧起一捧水，闻了又闻，眼眶竟红了，说活了一辈子，头一回见水能流到家门口。这沙漠里的水，端的比金子还金贵，修成这一条渠，不知费了多少人力，死了多少人。端的把全城的人都引到了渠边，后来每逢渠水涨时，男女老少都要来看一看，孩子在水边扔石子，老人蹲在石阶上抽烟，这渠便成了城里最热闹的所在。"
 SUM_Neo_SGD.60.a:"以契约立信"
 SUM_Neo_SGD.60.b:"以枪杆立威"
 SUM_SGD_RA_Palm_Grove:"棕榈成林"
 SUM_SGD_RA_Palm_Grove_desc:"沿渠遍植棕榈，三年便成了荫。树是公家的，果实按人头分。头一年结果时，孩子们在树下抢着捡，老人笑得合不拢嘴。那树是公家的，谁也不敢私自砍一棵。"
 SUM_Neo_SGD.61.t:"棕榈成林"
 SUM_Neo_SGD.61.d:"沿渠两岸，遍植棕榈，一棵挨着一棵，绿油油排了一路。三年光景，树苗便长成荫，树冠遮住了渠水，走在底下，凉飕飕的。树是公家的，谁也不许私自砍伐，违者罚水三月。结下的果实，按人头分，人人有份，连过路的商队也分得一份。有一年果子收成好，堆得像小山，分到最后，连刚出生的娃娃也分了一份。有人问，娃娃吃不得，分它作甚？管事的说，这是规矩，人人有份，一个也不能少，今日少了，明日就有人不服。这公家的树、按头的果，端的透着一股公道。端的叫人心服，那管事的分果时，总是最后一个拿，有人劝他也留些好的，他说规矩是先人定的，我若破了，众人便都破了，这话说得众人无言，从此分果从无争执。"
 SUM_Neo_SGD.61.a:"把利润分给城邦"
 SUM_Neo_SGD.61.b:"把利润收归官库"
 SUM_SGD_RA_Canal_Dark:"沙下的暗渠"
 SUM_SGD_RA_Canal_Dark_desc:"水从沙底下走，地面上不留痕迹。暗道的位置记在城邦的册子上，不记在任何一个人的脑子里。人会有私心，册子不会。那册子锁在柜里，钥匙由专人掌着。"
 SUM_Neo_SGD.62.t:"沙下的暗渠"
 SUM_Neo_SGD.62.d:"水在地面不留痕迹，是从沙底下走的，明面上看不见渠，只见偶尔有几处竖着石堆，做个记号。暗道的位置，一笔一画记在城邦的册子上，藏在匣子里，却不记在任何一个人的脑子里都不全，为的是防人起了歹心，独自占了水源。要用时，几个人一同翻册子，寻到地方，挖开沙层，水自然就来了，用完再填上。有一回，一个管册子的想私自改一处暗道，把水引到自家地里，被众人发觉，当下除了名，逐出城邦。这以册记水、不以人记的法子，端的稳妥。端的把水藏在了众人心里，册子虽厚，却谁也记不全，要用时须得几处头人一同到场，各念一段，拼将起来才算数，少一个人，这水便寻不出来，想私下改也改不成。"
 SUM_Neo_SGD.62.a:"借水草养人"
 SUM_Neo_SGD.62.b:"借商队养兵"
 SUM_SGD_RA_Green_Fringe:"沙缘的绿带"
 SUM_SGD_RA_Green_Fringe_desc:"在沙与田之间，立起一道草带，挡住流沙。这草挡不住也得挡，田是一年一年守出来的。种草的人弯着腰，把草根一株株按进沙里。草一年比一年密，沙一年比一年远。"
 SUM_Neo_SGD.63.t:"沙缘的绿带"
 SUM_Neo_SGD.63.d:"在沙与田之间，立起一道草带，挡住流沙。那草耐旱，根扎得深，能将沙攥住，风一吹，草叶呜呜作响，沙却过不去。可沙漠的沙，哪里是说挡就挡得住的，今日挡住，明日风一吹，草带又埋了半截。挡不住也得挡，坏了再补，补了再坏，一年一年地守。田，便是一年一年这样守出来的，多出一垄是一垄。有一回，一场大沙暴过后，草带全毁了，连田也埋了，众人也不气馁，卷起袖子重新栽，重新翻地。这守田如守城，端的靠的是个韧字。端的熬过了多少个春秋，那草带一年被埋一回，众人便一年补一回，补到后来，草根越扎越深，沙竟渐渐推不动了，田也一年宽似一年，这守田的韧劲，赛过了守城。"
 SUM_Neo_SGD.63.a:"让商路连通四方"
 SUM_Neo_SGD.63.b:"把商路关起来自守"
 SUM_SGD_RA_Water_Right:"水权的分配"
 SUM_SGD_RA_Water_Right_desc:"水按户分配，谁家的地多，谁家的水便多，都写在明处。写在明处，就少了许多争吵。从前为半桶水翻脸的邻居，如今照册取水，各自无话。水多水少写在牌上，谁也没话说。"
 SUM_Neo_SGD.64.t:"水权的分配"
 SUM_Neo_SGD.64.d:"水按户分配，谁家的地多，谁家的水便多，明明白白写在册上，贴在村口的墙上，人人都能去看。谁也不许私下多占，谁也不吃亏，多一勺少一勺，都算得清楚。写在明处，就少了争吵，省了许多口舌，邻里之间也和气。有一回，一户人家想多引一点水，夜里悄悄改了口子，把水往自家地里引，被邻家一早看见，当场指出来，叫来众人评理。那户人家脸一红，无话可说，只得又把口子改回原样，还赔了一筐椰枣。这分水之法，端的贵在一个明字，明则公，公则安。端的把一桩难事办成了易事，从此邻里之间少了许多口角，家家按地上的亩数领水，多寡明白，谁也不眼红谁，村口那面墙上的册子，倒成了众人信服的东西。"
 SUM_Neo_SGD.64.a:"以契约立信"
 SUM_Neo_SGD.64.b:"以枪杆立威"
 SUM_SGD_RA_City_Charter:"城邦宪章"
 SUM_SGD_RA_City_Charter_desc:"每座城立一份宪章，写明公事由谁议、谁办、谁查，三件事分给三拨人。议的不办，办的不查，谁也别想一手遮天。三拨人各管一摊，谁也插不得别人的手。"
 SUM_Neo_SGD.65.t:"城邦宪章"
 SUM_Neo_SGD.65.d:"须弥沙漠里，城邦众多，向来各管各的事，遇上一桩公事，你推我，我推你，到头来没个着落。这一日，几城的头人聚在阿如村的火塘边，说要给每座城立一份宪章。这宪章不是摆设，白纸黑字写得明白：城里的公事，谁来议，谁来办，谁来查，三桩事分作三拨人去管。议的人只管拿主意，办的人只管跑腿，查的人专挑毛病，三下里谁也不许兼着。查事的一拨，专挑人的毛病，众人起先嫌他多事，后来才知少了不行。有个年轻后生忍不住问，何苦分得这般细？一位白头老者笑道，从前一件事坏在一个人手里，旁人只能干瞪眼；如今三拨人互相盯着，谁想动手脚，也须过另外两关。满座听了，都道这法子稳当，提笔的提笔，按印的按印，一份宪章就此立下。"
 SUM_Neo_SGD.65.a:"把利润分给城邦"
 SUM_Neo_SGD.65.b:"把利润收归官库"
 SUM_SGD_RA_Council_Hall:"议事厅"
 SUM_SGD_RA_Council_Hall_desc:"议事厅是城里最结实的一座屋，门朝集市开，谁都能推门进去旁听。卖菜的老汉听得入神，连菜篮子都忘了放下。那门板日里从早敞到晚，没人拦着谁。"
 SUM_Neo_SGD.66.t:"议事厅"
 SUM_Neo_SGD.66.d:"城里要盖一座议事厅，众人商量着，别处都可将就，唯有这厅堂，须用最结实的石料，垒得比谁家屋子都牢固。不多时日，一座高屋立在集市尽头，门朝着最热闹的街口开，两扇门板日里从早敞到晚。原来立屋的人存了一片苦心：但凡城里议什么大事，谁都能推门进去，站在旁边听一听，听得懂也罢，听不懂也罢，没人拦着，也没人赶。起先有几个胆小的，伸头探脑不敢进，后来见里头的人只顾说话，并不拿眼瞪人，胆子便大起来，索性搬条凳子坐下听。有一回，一个卖菜的老汉听得入了神，手里的菜篮子都忘了放下。日子一久，这议事厅竟成了城里最热闹的所在。此中大有文章。"
 SUM_Neo_SGD.66.a:"借水草养人"
 SUM_Neo_SGD.66.b:"借商队养兵"
 SUM_SGD_RA_Citizen_Roll:"民籍与册"
 SUM_SGD_RA_Citizen_Roll_desc:"把城里的人逐个登记，谁是本城，谁是新来，一册可查。有了这册子，赋税与兵役才说得清。从前装穷喊冤的，如今翻开册子，再无话说。"
 SUM_Neo_SGD.67.t:"民籍与册"
 SUM_Neo_SGD.67.d:"新法初行，头一桩便是清点人口。官府派人挨家挨户地走，把城里的人逐个登记在册，谁是本地土生，谁是外乡新来，籍贯年岁，一笔记下，汇成一册大账。这册子看着平常，用处却大。从前收税派役，凭的是几句口传，富的装穷，穷的喊冤，一笔糊涂账怎么也算不清。如今有了册子，谁该出多少赋，谁该服几日兵役，翻开一查便知，再没有扯皮的余地。有几户新来的，起初还想隐瞒，见册子写得明白，只得老实报上。也有的老人不识字，书记便一项项念给他听，记下了才作罢。办理的书记一笔一画，写得手腕发酸，心里却欢喜：这册子一立，城里往后的事，就好比沙地上插了标杆，查得清，也走得稳。"
 SUM_Neo_SGD.67.a:"让商路连通四方"
 SUM_Neo_SGD.67.b:"把商路关起来自守"
 SUM_SGD_RA_Guild_Charter:"行会特许"
 SUM_SGD_RA_Guild_Charter_desc:"各行业自立行会，行情与学徒的规矩都自行会定，官署只管收税。内行管内行事，再没人拿外行充内行。行会里论价，常常争得面红耳赤，争完却一同长进。"
 SUM_Neo_SGD.68.t:"行会特许"
 SUM_Neo_SGD.68.d:"城里的行当渐渐多了，铁匠、织工、陶匠、盐商，各有一班人马。众人商议，索性让各行业自立行会，行情多少，学徒几时才算出师，都交由行会自己定夺，官署只管一样，便是到期收税，别的一概不插手。这一条最合匠人的心意。从前有个铁匠，手艺虽好，价钱却叫外行说了算，明明该值三枚摩拉，偏被压到两枚，气得他把锤子往砧上一摔，半晌没缓过气来。如今行了新法，行会里都是懂行的人，一把刀值多少，看一看成色便知，再没人能外行充内行。官府那边也落得清闲，只管收钱，不问行规，两下里都欢喜。行会里的匠人凑在一处，论刀论布，常常争得面红耳赤，可争完了，各家的手艺却一同长进。"
 SUM_Neo_SGD.68.a:"以契约立信"
 SUM_Neo_SGD.68.b:"以枪杆立威"
 SUM_SGD_RA_Elected_Steward:"推举执事"
 SUM_SGD_RA_Elected_Steward_desc:"执事由城里推举，一任三年，任满不得连任。推举那天吵得面红耳赤，可一旦定了，众人反倒齐心。新执事上任头一日，天不亮便坐进厅里，谁来都接待。"
 SUM_Neo_SGD.69.t:"推举执事"
 SUM_Neo_SGD.69.d:"城里的执事，改由众人推举，定下章程：一任三年，任满就得交印，不许连着做下去。这推举的日子，端的闹热。到了那天，集市上挤满了人，这个说张三公道，那个道李四能干，吵得面红耳赤，唾沫横飞，差点儿动了拳头。有几个嘴快的，把候选人的旧事翻出来，一件件数落，听的人一会儿点头，一会儿摇头。可怪的是，等执事真上了任，这些人反倒一个个安静下来。原来吵归吵，选定了便齐心，谁也不再去添乱。新任的执事也争气，日日坐在厅里办事，不摆架子，不耍威风。有个老头儿原先吵得最凶，后来见执事办得公道，私下里对人说，先前是怕选错了人，如今看来，倒是我多心了。端的耐人寻味。"
 SUM_Neo_SGD.69.a:"把利润分给城邦"
 SUM_Neo_SGD.69.b:"把利润收归官库"
 SUM_SGD_RA_Fair_Toll:"公平税则"
 SUM_SGD_RA_Fair_Toll_desc:"税则写在一块大牌上，立在城门口。过路的人先看牌，再交钱，交多少自己算得出。税吏想多收一个钱，也被人当场指出。那牌子立在城门，比税吏的嘴靠得住。"
 SUM_Neo_SGD.70.t:"公平税则"
 SUM_Neo_SGD.70.d:"要收税，先得让人心里有数。官府把税则一条条写在一块大木牌上，字写得斗大，立在城门口最显眼的地方。凡过路进城的人，远远望见那牌子，都要停下脚步，先看上几眼，再看自己担里的货，按牌上的数儿，一样样算清楚，该交多少，心里先有了底，然后才走到税吏跟前，把钱如数交上。这一块牌子，省了多少口舌。先前没有牌，收多收少全凭税吏一张嘴，过路的商贩被勒索惯了，敢怒不敢言。如今牌立在城门，白纸黑字，谁都能看，税吏想多收一个钱，也被人当场指出来。商队的老把式经过，总要停下来念一念，念完点点头，挑起担子大步进城。也有的不识字的，便请旁人念一遍，听完道一声多谢。"
 SUM_Neo_SGD.70.a:"借水草养人"
 SUM_Neo_SGD.70.b:"借商队养兵"
 SUM_SGD_RA_Open_Market:"开市通商"
 SUM_SGD_RA_Open_Market_desc:"集市不分内外，谁来都能摆摊。外邦商队头回来时将信将疑，卸一半货试试；第二回便赶来整队，把半条街都塞满。如今这集市上南腔北调，什么口音都听得见。"
 SUM_Neo_SGD.71.t:"开市通商"
 SUM_Neo_SGD.71.d:"这新立的集市，立下一条规矩：不分内城外城，不分本地外邦，谁来都能摆摊做买卖。起初可没这等好事。外邦的商队头一回赶着骆驼来，站在集市的边上，将信将疑，都不敢把货卸下来。为首的老商探头探脑，问旁边人，这地界真许我们摆摊？旁人点头道，许，尽管摆。那老商犹自不信，先把货物卸下一半试试，两眼还不住地往四下里瞟，生怕有人来赶。谁知一上午卖得出奇的好，收了摊数钱，比在别处还多。到了第二回，他二话不说，赶来整整一队货，骆驼排成长龙，把半条街都塞满了。如今这集市，南腔北调的口音都有，反倒成了沙漠里最热闹的所在。那老商一不做二不休，把货全卸了下来，摆得满满当当。"
 SUM_Neo_SGD.71.a:"让商路连通四方"
 SUM_Neo_SGD.71.b:"把商路关起来自守"
 SUM_SGD_RA_Caravan_Insurance:"商队互保"
 SUM_SGD_RA_Caravan_Insurance_desc:"几支商队合出一笔保银，谁在路上出了事，便从这银子里赔。赔过几回之后，劫道的无利可图，路上反倒太平。那银子放在明处，赔起来也爽快，没谁扯皮。"
 SUM_Neo_SGD.72.t:"商队互保"
 SUM_Neo_SGD.72.d:"沙漠里商路难走，时有劫匪出没，商队提心吊胆。几支商队一合计，各出一些摩拉，凑成一笔保银，由专人掌管。立下规矩：谁在路上出了事，遭了抢，折了货，便从这笔银子里照数赔付。这保银办了没多久，怪事就来了。头一回赔付，是给一支被劫的商队，银子发出去，众人也不心疼。第二回，第三回，赔了几趟之后，路上的劫案竟一天少似一天。原来那伙劫道的听说商队有了赔付的底气，抢了也讨不着多少便宜，反惹得巡防队追得紧，索性收了刀枪，改行去种地了。商队走在路上，驼铃声声，再不用三步一回头。有个老驼工笑道，从前是拿命赶路，如今是拿着保银赶路，心里踏实。大伙都说，这银子出的值，出在明处，用在明处。"
 SUM_Neo_SGD.72.a:"以契约立信"
 SUM_Neo_SGD.72.b:"以枪杆立威"
 SUM_SGD_RA_Mint_Oasis:"绿洲铸币"
 SUM_SGD_RA_Mint_Oasis_desc:"新铸的钱，成色与重量都刻在钱边上。这钱好使，不在金铜，在拿着的人信。先前那钱要咬一咬才敢收，如今看一眼掂一掂便知。找零时再不为成色争得脸红。"
 SUM_Neo_SGD.73.t:"绿洲铸币"
 SUM_Neo_SGD.73.d:"要活络买卖，先得有钱使。官府新铸一批钱，成色如何，分量多重，都一笔一画刻在钱边上，明明白白。这钱好不好使，不在铜，不在金，全在拿着的人信不信。先前那些钱，成色一次比一次差，拿在手里掂着轻，拿到市上，人家先要咬一咬，皱一皱眉，有的干脆不收，害得买卖双方争得脸红。如今这新钱，边上刻着定数，谁也不用咬，看一眼，掂一掂，心里就有数。卖货的见了这钱，眉开眼笑，痛痛快快把货交出去。渐渐的，远近的商队都认这钱，走到哪儿都能用。有个老商人捧着一把新钱，对伙计说，你瞧，这钱分量实在，人心的分量，也跟着实在了。找零的时候，也不再为成色争得脸红脖子粗。"
 SUM_Neo_SGD.73.a:"把利润分给城邦"
 SUM_Neo_SGD.73.b:"把利润收归官库"
 SUM_SGD_RA_Grand_Route:"通衢商路"
 SUM_SGD_RA_Grand_Route_desc:"把几条旧道连成一条通衢，沿途设驿站、挖井。走这条路的人，一年能多跑两趟。老把式掐指一算，笑得胡子直翘。从前赶一趟路要歇三回，如今连货带人一并顺当。"
 SUM_Neo_SGD.74.t:"通衢商路"
 SUM_Neo_SGD.74.d:"沙漠里本有几条旧道，年久失修，被风沙埋得断断续续，走起来磕磕绊绊。官府决意把这几条旧道连成一条通衢，沿途隔一段便设一处驿站，挖一口井，好让行路人歇脚饮水。这条路修成之后，好处说也说不尽。从前赶一趟路，人困驼乏，路上没个歇脚处，一年到头往返不了几趟。如今路上有驿站，有井水，走累了便歇，渴了便饮，人和牲口都少受罪。商队的老把式掐指一算，一年里竟能多跑两趟，多跑一趟，便多赚一笔。有个年轻驼夫头一回走这新路，见驿站里备着草料，井水清亮，忍不住赞道，这路修得，端的是积德的事。到了夜里，驿站里灯火点点，赶路的人围着火堆说话，再不似从前那般凄惶。有好事的，把它记在了册上。"
 SUM_Neo_SGD.74.a:"借水草养人"
 SUM_Neo_SGD.74.b:"借商队养兵"
 SUM_SGD_RA_Academy_Oasis:"绿洲学馆"
 SUM_SGD_RA_Academy_Oasis_desc:"学馆教的是算术、地理与律例，来的有城里的孩子，也有部族的少年。那少年头一回进屋，两只眼睛不够使，东张西望，先生却不嫌弃。"
 SUM_Neo_SGD.75.t:"绿洲学馆"
 SUM_Neo_SGD.75.d:"城里新开了一所学馆，请了先生来教书。教的不是别的，是算术、地理与律例三样。来这学馆求学的，倒也杂。有城里的孩子，年纪小小，背书背得摇头晃脑；也有部族里送来的少年，身上还带着沙土的气息，头一回进屋，两只眼睛不够使，东张西望。先生也不嫌弃，一视同仁，算术从加减教起，地理从本城讲起，律例从最简单的条文念起。那些部族的少年起初跟不上，急得抓耳挠腮，后来慢慢也就入门了。到了晚上，学馆里灯火明亮，读书声传出老远。路过的行人听了，忍不住停下脚步，心里想，这沙漠里，到底也有了读书声了。有个孩子的母亲，天天站在门外听，听见儿子念书，脸上笑开了花。"
 SUM_Neo_SGD.75.a:"让商路连通四方"
 SUM_Neo_SGD.75.b:"把商路关起来自守"
 SUM_SGD_RA_Law_Code:"沙漠律例"
 SUM_SGD_RA_Law_Code_desc:"把各部各城的老规矩合成一部律例，合不拢的先空着。空着的地方，留给将来再吵。执笔的人写到空白页，也只好搁笔叹气。那几处空白，明摆着是留给后人吵的。"
 SUM_Neo_SGD.76.t:"沙漠律例"
 SUM_Neo_SGD.76.d:"各部各城，老规矩多如牛毛，你这一条，他那一款，往往对不上。众人决意把各处的老规矩汇总起来，编成一部通行律例。这活儿最是费力。各部派来的人围着一张长桌，你念一段，我念一段，合得拢的便记下，合不拢的，谁也不肯让步，只好先在那一处空着，留待来日再议。有个性急的年轻人不耐烦，问为何不干脆定下。老成持重的长者摇头道，律例这事，急不得，今日硬按下去，明日人家不服，还是一场争吵。不如空着，留个余地，等人心平了再填。于是这部律例，有写得满满的篇章，也有几处空白。那几处空白，众人心里都明白，是将来还要吵的。执笔的人写到空白页，也只好搁下笔，叹一口气。"
 SUM_Neo_SGD.76.a:"以契约立信"
 SUM_Neo_SGD.76.b:"以枪杆立威"
 SUM_SGD_RA_Circuit_Judge:"巡回法官"
 SUM_SGD_RA_Circuit_Judge_desc:"法官按季走遍各城，就地审案，判词要当着双方念。念完任你不服，也得各自回家。有个商人涨红了脸，嘴张了张，到底没说出话。"
 SUM_Neo_SGD.77.t:"巡回法官"
 SUM_Neo_SGD.77.d:"律例既定，还得有人去断案。官府设下法官，按着节气，一处一处走遍各城，就地审案，不必把人犯远远押到府城。这法官断案，有个古怪规矩：判词写成之后，要当着原告被告的面，一字一句念出来。念完了，任你如何不服，也只得各自回家，不许在堂上撒泼。有一回，两个商人为一匹布争执，各说各有理，法官问明情由，当堂念了判词。那输的一方脸涨得通红，嘴张了张，到底没说出话，悻悻地走了。旁人问法官，何必当众念？法官道，念给他听，是要他明白输在哪里；心里服不服，日后再说，可这堂上的规矩，却是立住了。围观的人听了，也都点头，说这判法，端的明白。众人听了，无不称善，都说这判法端的明白。"
 SUM_Neo_SGD.77.a:"把利润分给城邦"
 SUM_Neo_SGD.77.b:"把利润收归官库"
 SUM_SGD_RA_Contracts_Archive:"契约存档"
 SUM_SGD_RA_Contracts_Archive_desc:"凡立大契的，都要留一份底在存档处。日后起了争执，取出来一对便知。先前两个商人打了一辈子官司，各执一词，如今字据俱在，赖账的无话可说。"
 SUM_Neo_SGD.78.t:"契约存档"
 SUM_Neo_SGD.78.d:"城里人立契，买卖田地，借贷钱银，都要写下一纸文书。官府又定一条规矩：凡立了大契的，都得留一份底稿，存放在专门的存档处。这一份底稿，看着多余，关键时候却能救命。先前有一桩案子，两个商人打了一辈子的官司，都说是对方赖账，各执一词，谁也拿不出凭据，断案的法官急得直挠头，最后也只能糊涂判了。如今有了存档处，把当年立的契约底稿取出来，两下一对，字据俱在，谁是谁非，一目了然。那想赖账的，登时哑口无言。从此城里人立契，都记得多留一份底。管存档的书记把契纸一张张理齐，按年月排好，心里道，这些纸片，日后都是断案的底气。从此再没人敢在契约上做手脚，惹一场没完没了的官司。"
 SUM_Neo_SGD.78.a:"借水草养人"
 SUM_Neo_SGD.78.b:"借商队养兵"
 SUM_SGD_RA_Scribes:"书记与学徒"
 SUM_SGD_RA_Scribes_desc:"书记在沙漠里是稀罕行当，会写字的比会打仗的还少。学馆里最抢手的就是写字这一门。有个牧羊少年拿树枝在沙上划拉，划了又抹，手上磨出茧子。"
 SUM_Neo_SGD.79.t:"书记与学徒"
 SUM_Neo_SGD.79.d:"沙漠里，会写字的人是稀罕物。会写字的，比会舞刀弄枪的还少。这话并不夸张。部族里出了事，要写封信，往往要走上几十里，去寻一个识字的书记。那书记便成了香饽饽，走到哪里，都有人陪笑脸，奉上好茶。城里的学馆开了几门课，最抢手的，端的是写字这一门。孩子们擂破了头也要学，先生收徒收不过来。有个部族的少年，家里世代放羊，偏偏他爱上写字，天天拿树枝在沙地上划拉，划了又抹，抹了又划，手上磨出了茧子。后来他真成了部里第一个会写字的人，替族人写信记账，人人敬重。老人们感叹，一支笔，竟比一把刀还金贵。逢年过节，还有人提着礼上门求他写字，门槛都快被踩平了。有那明白人，早已看破了。"
 SUM_Neo_SGD.79.a:"让商路连通四方"
 SUM_Neo_SGD.79.b:"把商路关起来自守"
 SUM_SGD_RA_Well_Pact:"共井之约"
 SUM_SGD_RA_Well_Pact_desc:"邻村共用一口井的，立约写明轮流取水的时辰，一刻不差。约立得细，争水的事就少。有人半夜偷着打水，第二日照约罚了双倍。那约写在木牌上，挂在井边。"
 SUM_Neo_SGD.80.t:"共井之约"
 SUM_Neo_SGD.80.d:"邻村邻城，常有共用一口井的。水是最金贵的东西，为争一桶水，邻里翻脸的事，时有发生。立约的人想了个细法子：把取水的时辰写得清清楚楚，谁家在哪一时辰打水，一刻也不差，都明明白白定在约上。这约立得极其细致，连谁先谁后，误了时辰如何补，都写了进去。起初有人嫌麻烦，说打口水还要看时辰，真是小题大做。可日子一长，争水的事果然少了许多。从前为了谁先谁后，吵得不可开交，如今照约办事，到了时辰自然轮到你，谁也挑不出理。有一回，有人半夜来偷着打水，第二日便被人照约问罪，罚了双倍的水，从此再没人敢。两家从此见面，还能笑着打招呼，再不为半桶水红了脸。列位"
 SUM_Neo_SGD.80.a:"以契约立信"
 SUM_Neo_SGD.80.b:"以枪杆立威"
 SUM_SGD_RA_Karez:"梯田与坎儿井"
 SUM_SGD_RA_Karez_desc:"把坡地开成梯田，把地下水用暗渠引来。如今多种一季，农人夜里竟能多睡一个时辰。老农蹲在田埂上，闻着泥土味，笑得合不拢嘴。"
 SUM_Neo_SGD.81.t:"梯田与坎儿井"
 SUM_Neo_SGD.81.d:"沙漠里种地，最难的是水土。众人想出两个法子：一是把坡地开成一层一层的梯田，好留住雨水；二是从地下挖暗渠，把地下水引到田里。这两样办成之后，庄稼的收成大不一样。从前一年只种一季，地力薄，水又不够，农人一年到头在地里刨食。如今梯田层层，暗渠纵横，水旱无忧，竟能多种一季。多收一季粮食，农人的腰包鼓了，觉也睡得踏实了。有个老农蹲在田埂上，望着自家新开的梯田，掐着指头算，笑道，从前一年忙到头，如今多种一季，晚上竟能多睡一个时辰，这日子，是有盼头了。他孙子在田里追逐打闹，老人看着，笑得眼睛眯成一条缝。他弯下腰，闻了闻泥土的味道，笑得合不拢嘴。"
 SUM_Neo_SGD.81.a:"把利润分给城邦"
 SUM_Neo_SGD.81.b:"把利润收归官库"
 SUM_SGD_RA_Date_Harvest:"枣椰丰产"
 SUM_SGD_RA_Date_Harvest_desc:"枣椰是沙漠的粮，也是糖。丰产的年景，一串串压弯枝头，市上的价钱一落三成。穷人家也能买上几串解馋，孩子们吃得满嘴是甜。落地的枣核，孩子也捡起来啃两口。"
 SUM_Neo_SGD.82.t:"枣椰丰产"
 SUM_Neo_SGD.82.d:"枣椰这东西，在沙漠里可是宝贝。它的果子能当粮，能充饥，还能熬成糖，甜到心里。逢上枣椰丰产的年景，那景象端的喜人。一串串枣椰压弯了枝头，沉甸甸的，摘下来堆成小山，黄灿灿一眼望不到边。果子多了，价钱自然就落。市上的枣椰价，一落就是三成。从前穷苦人家舍不得吃，如今也能买上几串，解解馋。卖果子的摊主吆喝得嗓子都哑了，一边数摩拉，一边笑着说，今年这果子，结得多，卖得贱，可众人都能吃上，倒也是桩好事。孩子们围着果堆，吃得满嘴是甜，连落在地上的枣核，都要捡起来再啃两口。有个老汉买了几串，坐在树下慢慢嚼，连说这日子甜。树上的枣椰，还剩着不少没摘，风一吹，香甜味飘出老远。"
 SUM_Neo_SGD.82.a:"借水草养人"
 SUM_Neo_SGD.82.b:"借商队养兵"
 SUM_SGD_RA_Rotation:"草场轮牧"
 SUM_SGD_RA_Rotation_desc:"草场分片轮放，牧场主把日子排好，写在木牌上，挂在羊圈门口。哪天进哪片草场，看牌便知，谁也不好多放一天。那木牌挂在羊圈门口，风吹日晒也不摘。"
 SUM_Neo_SGD.83.t:"草场轮牧"
 SUM_Neo_SGD.83.d:"放牧也有讲究。草场若是让牲口一年四季啃个不停，草根都要啃绝，来年便没得放。牧场主们聚在一处，商定把草场分成一片一片，轮着放，这块吃完了，赶到下一块，让先前那块歇一歇，好重新长草。为了把日子排得明白，他们把每片草场该轮到哪一天，写在一块木牌上，挂在羊圈的门口。谁家的羊哪天进哪片草场，看牌子便知。这法子实行下来，草场果然养得住，羊群也肥壮了。有个年轻牧人不解，问为何要把日子挂出来。老牧人指着木牌道，写下来，大家都照着办，谁也不好多放一天，草场才养得起咱们。那年轻人恍然大悟，原来这木牌上，写的是草场的养生之道。羊群也听得懂似的，乖乖往下一片草场走，谁也不用催。"
 SUM_Neo_SGD.83.a:"让商路连通四方"
 SUM_Neo_SGD.83.b:"把商路关起来自守"
 SUM_SGD_RA_Granary:"常平仓"
 SUM_SGD_RA_Granary_desc:"丰年买粮存进仓，荒年开仓平粜。那一年的旱灾，全靠仓里的粮救了命。老妇人捧着米袋，眼眶都红了。仓里存的不只是粮，是人心。"
 SUM_Neo_SGD.84.t:"常平仓"
 SUM_Neo_SGD.84.d:"丰年荒年，总难预料。众人想了个长远的法子：丰年粮多价贱，官府便出钱买粮，存进大仓；到了荒年，粮少价贵，再开仓平价粜出，好让穷人也能买得起。这仓里存的，头一年是粮，可日子久了，存下的却是人心。有一年闹旱，地里颗粒无收，市上的粮价翻着跟头往上涨，百姓慌作一团。亏得官仓开了，一斗粮按平价粜出，排队的百姓虽多，却个个有粮可买。有个老妇人捧着米袋，眼眶都红了，连声道，这仓里的粮，救了咱全家的命。从此城里人提起这仓，都怀着一份敬意。管仓的人，日日把仓门打扫得干净，把粮囤码得齐整。百姓们都说，这样的年头，多亏了当年那句丰年积谷的老话，才没断了活路。"
 SUM_Neo_SGD.84.a:"以契约立信"
 SUM_Neo_SGD.84.b:"以枪杆立威"
 SUM_SGD_RA_Militia_Law:"乡兵之法"
 SUM_SGD_RA_Militia_Law_desc:"每城每族出丁，平时务农，战时集合。兵器自备，粮草却从公中出。父亲拍着儿子的肩道，只管安心操练，家里的地为父替你种着。校场上刀矛如林，号声一响便齐了。"
 SUM_Neo_SGD.85.t:"乡兵之法"
 SUM_Neo_SGD.85.d:"要守城护路，总得有人拿刀。官府定下规矩：每城每族都要出丁，平时在家务农，一旦有事，便集合听用。这兵不为别的，是为守土。兵器自备，自家备下刀矛弓箭；粮草却从公中支出，不必当兵的自己贴。这规矩一定，众人反倒踊跃。先前若说征兵，百姓唯恐躲之不及，如今讲明白了，兵器是自己的，粮草是公家的，守的又是自家家园，哪个还肯落后。到了集合那天，校场上人山人海，刀矛如林，号声一响，个个精神抖擞。有个父亲拍着儿子的肩膀道，去吧，家里有公家的粮，你只管安心操练，家里的地，为父替你种着。儿子听了，把胸脯挺得老高。一排排刀矛，在日头下闪着寒光，照得人心里发亮。"
 SUM_Neo_SGD.85.a:"把利润分给城邦"
 SUM_Neo_SGD.85.b:"把利润收归官库"
 SUM_SGD_RA_Oasis_Wall:"守绿洲的长墙"
 SUM_SGD_RA_Oasis_Wall_desc:"沿绿洲外缘垒一道低墙，挡流沙，也挡散骑。这墙不高，够用就行。工匠边垒边嘀咕，老成的人笑道，能挡一挡，便是功劳。墙根底下，孩子们绕着玩，再不怕风沙。"
 SUM_Neo_SGD.86.t:"守绿洲的长墙"
 SUM_Neo_SGD.86.d:"绿洲是沙漠人的命根子，可有一样恼人，便是流沙年年往绿洲边上侵，还有那散骑劫匪，时不时来骚扰。众人商量，沿着绿洲的外缘，垒起一道低墙。这墙垒得并不高，垒得高的费时费力，也没那个必要。它挡的，一是慢慢逼过来的流沙，二是来去如风的散骑。墙不高，可风沙撞上去，便缓了一缓；散骑到了墙下，也须慢下来寻缺口，这一慢，守的人便得了先手。有个工匠边垒边嘀咕，这墙这般矮，挡得住什么？老成的人笑道，够用就行，能挡一挡，便是功劳。墙成之后，绿洲果然安生了许多。孩子们绕着墙根玩耍，再不担心风沙卷走自家的羊。远处望去，那墙像一道土色的堤，稳稳护着这一片绿洲。这事后来传遍了大街小巷。"
 SUM_Neo_SGD.86.a:"借水草养人"
 SUM_Neo_SGD.86.b:"借商队养兵"
 SUM_SGD_RA_Watchtower:"望楼"
 SUM_SGD_RA_Watchtower_desc:"隔几里便筑一座望楼，白天举旗，夜里举火。一处见动静，一程程传下去，转眼几十里。快马还没跑出十里，救兵已到了。那火光一处接一处，像条火龙在沙丘上游。"
 SUM_Neo_SGD.87.t:"望楼"
 SUM_Neo_SGD.87.d:"沙漠辽阔，消息传递最是难事。众人想出个法子：隔几里地便筑一座望楼，楼里派人守着，白日里举旗，夜里便举火。这一旗一火，端的比快马还快。一处望楼见了动静，旗子一举，相邻望楼望见，跟着举旗，一程一程传将下去，转眼之间，消息便传出去几十里。到了夜里，火光冲天，一处接一处，像条火龙在沙丘间游走。守楼的人，日夜轮班，眼睛盯得酸了，也不敢合眼。有一回商队遇险，消息从望楼一路传来，巡防队早产赶去，救下了人。商队的人后来对人说，咱们的快马还没跑出十里，救兵竟已到了，端的神了。望楼上的守卫，换了一班又一班，旗与火却从没断过。从此这沙漠里，再没有传不出去的消息。"
 SUM_Neo_SGD.87.a:"让商路连通四方"
 SUM_Neo_SGD.87.b:"把商路关起来自守"
 SUM_SGD_RA_Route_Patrol:"商道巡防"
 SUM_SGD_RA_Route_Patrol_desc:"巡防队专护商路，遇劫便追，追得凶了，那伙劫道的索性收了刀枪，改行种地。商队走在路上，驼铃声也响得欢快。从前三步一回头的路，如今可以放心走到底。"
 SUM_Neo_SGD.88.t:"商道巡防"
 SUM_Neo_SGD.88.d:"商路要太平，少不了一支巡防队。这队人马专管护着商路，遇上劫匪便追，追得越凶越好。这巡防队办得久了，竟把一伙劫道的给逼改了行。起初那伙人仗着熟悉沙路，劫了一回又一回，把商队吓得不敢走。自从巡防队成立后，马力健，脚程快，一有警讯便追，追得那伙人东奔西窜，没个安生。劫道这买卖，风险大了，油水却薄了，算下来还不如下力气种地。于是有为首的把刀一扔，带了手下人去开荒种田，从此金盆洗手。商队走在路上，再不见那伙人的影子，驼铃声也响得欢快了。有个老商人说，从前走这条路，提心吊胆，如今踏实多了。那条从前冷清的沙路，如今又渐渐热闹起来，驼铃声昼夜不绝。"
 SUM_Neo_SGD.88.a:"以契约立信"
 SUM_Neo_SGD.88.b:"以枪杆立威"
 SUM_SGD_RA_Peace_Guard:"治安队"
 SUM_SGD_RA_Peace_Guard_desc:"城里的治安队由本城人充任，只抓偷抢，不管议论。几个茶客议论朝政，声音大些，治安队路过只当没听见。茶摊上的人越聚越多，茶水也多卖了几壶。"
 SUM_Neo_SGD.89.t:"治安队"
 SUM_Neo_SGD.89.d:"城里的治安，交给了本城人去管。这治安队由城里百姓充当，昼夜巡查，抓的是偷盗抢劫的歹人。这执法也有个分寸：只抓偷抢，不管议论。有一回，几个茶客在摊上议论朝政，说这说那，声音大了些，把前后的街坊都招来看热闹。治安队的人恰好路过，听见了，却只当没听见，径直走过去。旁边有人问，他们议论这般，你怎的不管？那治安队的人笑道，咱们只管偷抢的，说话又不犯法，管他怎的。众人听了，都道这治安队懂事。从此城里的风气越发好，小偷小摸不见了，百姓说话也自在。茶摊上的议论声，反倒一天比一天响亮。茶摊的老板也乐，人多议论，茶水就卖得多，两下里都欢喜。其中大有学问。"
 SUM_Neo_SGD.89.a:"把利润分给城邦"
 SUM_Neo_SGD.89.b:"把利润收归官库"
 SUM_SGD_RA_Republic_Stands:"绿洲共和既立"
 SUM_SGD_RA_Republic_Stands_desc:"各城执事在同一份宪章上按了手印，水按户分，税按牌收，法官按季巡。沙漠头一回靠一叠写得清清楚楚的纸管事。那手印按下去，红彤彤一片，谁也不许翻悔。"
 SUM_Neo_SGD.90.t:"绿洲共和既立"
 SUM_Neo_SGD.90.d:"到了立盟的那一天，各城的执事聚在一处，在同一份宪章上，一个个按了鲜红的手印。这一叠纸，端的分量千斤。上面写得清清楚楚：绿洲的水，按户均分；商路上的税，照牌收取；法官按季巡行各城。想我沙漠之地，千百年来，靠着口头的约定过日子，今日头一回，是靠一叠写得明明白白的纸来管事。散了会，众人走出厅堂，只见沙丘上的路标也都是新立的，一根根木桩插在沙里，指着通往各城的方向。有个老者抚摸着新立的界碑，心中感慨，从今往后，沙漠行事，有了章法。他回头对孙子说，记住今日，这是咱们沙漠头一回立规矩。众人听了，都觉这话在理，纷纷点头，把那手印又按得实了些。"
 SUM_Neo_SGD.90.a:"借水草养人"
 SUM_Neo_SGD.90.b:"借商队养兵"

 #### 乙线 · 旅团公议 ####
 SUM_SGD_RB_The_Eremite_Council:"旅团公议"
 SUM_SGD_RB_The_Eremite_Council_desc:"另有一条路，把沙漠交给旅团与部族共管：契约归公，水源归公，厮杀的活由旅团接下。有人叫它佣兵的国，有人叫它没有主子的国。"
 SUM_Neo_SGD.91.t:"旅团公议"
 SUM_Neo_SGD.91.d:"治理沙漠，另有一条路。有人主张，与其事事都归官府，不如把沙漠交给旅团与部族一同来管理。这法子另是一番气象：契约归公，水源归公，打仗厮杀的活计，则由镀金旅团接了去。众人议定，从此沙漠的事，大家商量着办。有人给这新章程起了个名，唤作佣兵的国；也有人说，这分明是个没有主子的国。两下里各执一词，谁也说服不了谁，争到后来，索性由它去。有个旅团的头目听了，哈哈大笑，笑道，叫什么都好，只要大伙有饭吃，有水喝，没人来欺负，这国有没有主子，又有什么要紧。众人听了，也都笑了。部族的人与旅团的汉子，从此在一处喝水，在一处议事，谁家缺了粮，谁路上遇了险，大伙一同帮衬，遇事也好商量。"
 SUM_Neo_SGD.91.a:"把土地分给部族"
 SUM_Neo_SGD.91.b:"把土地归入官仓"
 SUM_SGD_RB_Merger:"旅团合流"
 SUM_SGD_RB_Merger_desc:"几支大旅团把名号并成一个，账目也合一。并入那天，各团把旧旗抖去沙尘，一圈圈折好，收进木箱。有个老兵望着箱子，眼眶发湿。木箱供在厅里，谁走过都看一眼。"
 SUM_Neo_SGD.92.t:"旅团合流"
 SUM_Neo_SGD.92.d:"沙漠里有几支大旅团，各树旗帜，各管各的人马。这一天，几家的头目坐到一处，说不如把名号并成一个，账目也合到一起，往后就是一家人不说两家话。合并那天，景象着实动人。各团把自己那面旧旗，郑重地取下来，抖一抖上面的沙尘，一圈一圈折好，收进一只木箱里，合上盖子。那旗上，有各团自己的名号和旧日的印记，如今都成了过去。有个老兵望着收旗的木箱，眼眶有些发湿，轻声说道，这旗跟了我十几年。旁边的人拍拍他的肩，道，旗收了，人还在，往后咱们并成一家，势更大了。那老兵点点头，把箱子上的灰擦了又擦。那木箱后来供在议事厅里，谁走过都要看上一眼，想起旧日情谊。有好事的，把它记在了册上。"
 SUM_Neo_SGD.92.a:"推举公议的执事"
 SUM_Neo_SGD.92.b:"沿用旧日的长老"
 SUM_SGD_RB_Public_Ledger:"公账公开"
 SUM_SGD_RB_Public_Ledger_desc:"团里的钱，进出多少，按月贴在营门口。起初有人嫌丢人，后来发现账目清楚，借钱反倒容易。那牌子前天天围着人，念完了还拿指头比对。"
 SUM_Neo_SGD.93.t:"公账公开"
 SUM_Neo_SGD.93.d:"旅团并成一家之后，管钱便成了大事。新立下规矩：团里的钱，进多少，出多少，每一笔都按月写明白，贴在营门口的公告牌上，谁都能看。这规矩初行时，还真有些人不自在。有个管的头目嫌臊，说咱们挣的钱，一笔笔贴出去，叫外人看笑话，多丢人。可日子久了，众人渐渐咂摸出味儿来。原来这账目公开，反倒好处多多。团里要借钱周转，别人见账目清清楚楚，知道这团靠得住，痛痛快快就借了。从前遮遮掩掩，借个钱比登天还难。那个先前嫌丢人的头目，后来也红了脸道，原来这丢人的事，竟是桩好事。弟兄们听了，哄堂大笑。从此营门口那块牌子，倒成了众人最爱看的地方，天天有人围着念。"
 SUM_Neo_SGD.93.a:"让花神的誓约作证"
 SUM_Neo_SGD.93.b:"让官署的法度作证"
 SUM_SGD_RB_Rank_By_Merit:"以功定阶"
 SUM_SGD_RB_Rank_By_Merit_desc:"队里的位子按功劳排，不看出身。这一条得罪了不少老人，也招来不少年轻人。有个骑士练武时格外卖力，说这身武艺便是本钱。营里练武的风气，一日浓似一日。"
 SUM_Neo_SGD.94.t:"以功定阶"
 SUM_Neo_SGD.94.d:"队里的位子，如今按功劳大小来排，不再看谁的出身贵贱。这一条新规，端的是有人欢喜有人愁。得罪了不少老人。那些老资格，原本凭着辈分，稳稳占着高位，如今要跟新来的人比功劳，心里如何服气？有的背着人直摇头，说这世道变了，连个先来后到都不讲了。可这条规矩，也招来了不少年轻人。他们出身寻常，没有靠山，却有一身的本事和胆气，如今有了一条凭功劳升迁的路，一个个摩拳擦掌，跃跃欲试。有个年轻骑士在操练时格外卖力，对同伴说，咱们没有家世，可这条命和这身武艺，就是咱们的本钱。同伴听了，也连连点头。一时间，营里练武的风气，比从前浓了许多，人人都憋着劲要立功。"
 SUM_Neo_SGD.94.a:"与雨林互通有无"
 SUM_Neo_SGD.94.b:"与雨林划清界限"
 SUM_SGD_RB_Veteran_Pension:"老卒的抚恤"
 SUM_SGD_RB_Veteran_Pension_desc:"老卒退下来，每月有一份抚恤，按时发放。有个断臂的老卒接过银子，手直发抖，半晌哽咽道，我这条命，值了。那银子按月发，从不误了日子，老卒们心里有底。"
 SUM_Neo_SGD.95.t:"老卒的抚恤"
 SUM_Neo_SGD.95.d:"那些打不动了的老卒，如今有了着落。团里定下章程：老卒年迈，退下来之后，每月都有一份抚恤银子，按时发放，一分不少。这一份银子，看着不多，可换来的东西，比金子还值钱。先前老卒退伍，无依无靠，血战一场，到头来连口饭都吃不上，叫人心寒。如今按月领饷，老有所养，年轻人在前头拼命，心里也就踏实了。有个断了胳膊的老卒，接过那银子，手掌直抖，半晌说不出话，末了哽咽道，我这条命，值了。旁边年轻的弟兄看了，暗暗想，将来我老了，也有这般着落，拼起来更有劲了。众人把这份抚恤，看得比什么都重。每到大牢发饷那天，营门口都排着长长的队，老卒们脸上都带着笑。这事后来传遍了大街小巷。"
 SUM_Neo_SGD.95.a:"把土地分给部族"
 SUM_Neo_SGD.95.b:"把土地归入官仓"
 SUM_SGD_RB_Eremite_Charter:"旅团章程"
 SUM_SGD_RB_Eremite_Charter_desc:"章程写明三条：不劫商队，不掠村庄，不弃同伴。违了的逐出还须退赔。有个团员偷拿一匹绸缎，被当众逐出，照价赔了。这三条刻在牌上，谁犯了都要按着办。"
 SUM_Neo_SGD.96.t:"旅团章程"
 SUM_Neo_SGD.96.d:"旅团立了章程，头一条便是铁打的规矩，共有三样：一不许劫掠商队，二不许惊扰村庄，三不许抛弃同伴。这三条，条条都是用血换来的教训。凡是违了的，轻则逐出队伍，重则还要退赔损失，绝无轻饶。有个年轻气盛的团员，一时贪心，偷拿了商队的一匹绸缎，事情败露，头目当着众人的面，把他逐了出去，还照价赔了人家。那人脸涨得通红，也无话可说，只好灰溜溜地走了。众人看了，都知这章程不是写着好看的。从此队伍里，无人敢犯这三条。商队见了旅团的旗，也不再吓得掉头就跑，有的还主动打招呼。村里的百姓见队伍过来，也不再躲藏，有的还端出茶水招待。这支队伍的名声，一天比一天好。"
 SUM_Neo_SGD.96.a:"推举公议的执事"
 SUM_Neo_SGD.96.b:"沿用旧日的长老"
 SUM_SGD_RB_Common_Land:"土地归部"
 SUM_SGD_RB_Common_Land_desc:"官署名下的地分回各部，再按人头分到户。分地那几天，沙丘边上的火塘没熄过。年轻人连夜扛锄头去看，抓起一把沙土捏了又捏。薄薄一张纸，在他手里重若千斤。"
 SUM_Neo_SGD.97.t:"土地归部"
 SUM_Neo_SGD.97.d:"官署名下的田地，如今要分回各部，各部再按人头，分到各家各户。分地那几天，沙丘边上的火塘，夜里没熄过。家家户户都围着火焰，等着分到属于自己的那块地。这地，祖祖辈辈都归官家，如今头一回，落到了自家手里。人们捧着分地的文书，心里头热乎乎的。有个年轻人分到地后，连夜扛着锄头去看，蹲在地头，抓起一把沙土，捏了又捏，仿佛那是世间最珍贵的东西。他对着那块地，看了又看，直到月亮升起才回家。火塘边，老人给孩子讲，这地往后就是咱们的，要好好伺候它，才能养家糊口。孩子们听得似懂非懂，却也跟着点头。那文书虽然只有薄薄一张纸，在他手里却重若千斤，捧得稳稳的。"
 SUM_Neo_SGD.97.a:"让花神的誓约作证"
 SUM_Neo_SGD.97.b:"让官署的法度作证"
 SUM_SGD_RB_Water_Commons:"水源归公"
 SUM_SGD_RB_Water_Commons_desc:"水井与绿洲不再归哪家所有，取水按人。这一条各部足足吵了七天，从口水横飞吵到几乎拔刀，最后才你让我、我让你定下。井边从此吵架少，说笑多。"
 SUM_Neo_SGD.98.t:"水源归公"
 SUM_Neo_SGD.98.d:"水井与绿洲，如今不再归哪一家哪一户所有，取水按人头分配，人人有份。这一条规矩，来得太不容易。各部为了它，足足吵了七天七夜。第一天，你一句我一句，吵得唾沫横飞；第二天，有人拍了桌子，差点动了手；到了第五天，几乎要拔刀相向，众人劝了又劝。直到第七天，众人吵累了，气也消了大半，才你让我，我让你，把这条规矩定下来。定下之后，争端果然少了。从前为争水，邻里成仇，如今按人头分水，谁也挑不出理。那个当初吵得最凶的头人，后来不甘不愿地承认，吵这一场，倒也吵出了个公道。从此那口井边，吵架的声音少了，说笑的声音多了。人们都说，这七天七夜的争吵，吵得值。"
 SUM_Neo_SGD.98.a:"与雨林互通有无"
 SUM_Neo_SGD.98.b:"与雨林划清界限"
 SUM_SGD_RB_Grain_Store:"部族的公仓"
 SUM_SGD_RB_Grain_Store_desc:"各部把余粮存进公仓，荒年按口分。存粮时有人嘀咕，取粮时却都没了话。先前嘀咕最凶的那个，捧着粮低声道，这粮，存得值。那几张不情愿的脸，后来都笑开了。"
 SUM_Neo_SGD.99.t:"部族的公仓"
 SUM_Neo_SGD.99.d:"各部把自己的余粮，都拿出来存进公仓，遇上荒年，再按人口分给各家。往仓里存粮的时候，有人心里嘀咕，我辛苦打的粮，凭什么拿去充公？嘴上虽不说，脸上却挂着一个不情愿，把粮袋往秤上一放，手都显得沉。可到了荒年，从仓里取粮的时候，那些嘀咕的人，一个个都没了话。原来那一年天旱，自家地里没收成，全靠着公仓的粮，才熬了过来。那几日仓门前排起长队，扶老携幼，人人都等着领粮过秤。捧着领来的粮食，先前嘀咕得最凶的那个人，低着头，半晌憋出一句，这粮，存得值。旁人听了，都会心地笑了。管仓的人把仓门打开，一袋袋粮食发出去，心里也踏实。管仓的人也感慨，当初存粮时那几张不情愿的脸，如今都变成了笑脸。"
 SUM_Neo_SGD.99.a:"把土地分给部族"
 SUM_Neo_SGD.99.b:"把土地归入官仓"
 SUM_SGD_RB_Craft_Collective:"匠户合工"
 SUM_SGD_RB_Craft_Collective_desc:"铁匠、织工、制盐的合在一处做工，工钱按件算，工具归公。先前有个铁匠买不起炉砧，只能打下手；如今只管出力，多劳多得。"
 SUM_Neo_SGD.100.t:"匠户合工"
 SUM_Neo_SGD.100.d:"铁匠、织工、制盐的匠人，如今合在一处做工。工钱按件来算，做一把刀得多少，织一匹布得多少，晒一池盐得多少，明明白白；做工的家伙什儿，则归公中置办，不必匠人自己掏钱。这法子最合匠人的心意。先前有个铁匠，想打铁却买不起炉子与铁砧，空有一身力气，只能给人打下手。如今工具归公，他只管出力气，按件领钱，多劳多得。铁坊里炉火昼夜不熄，叮叮当当的锤声，响成一片。织机咔咔作响，盐田白花花一眼望不到边。匠人们聚在一处，手艺长进得快，钱也挣得稳当。到了发工钱的日子，人人喜笑颜开，三个一堆五个一簇，数着摩拉，盘算着添置些什么。匠人们还说，等攒够了钱，要在坊前立一块碑，记下这太平年月。"
 SUM_Neo_SGD.100.a:"推举公议的执事"
 SUM_Neo_SGD.100.b:"沿用旧日的长老"
 SUM_SGD_RB_Elder_Recall:"长老可罢"
 SUM_SGD_RB_Elder_Recall_desc:"长老若犯了众怒，部众可当众罢免。这一条写进盟约时，几个老长老脸色一个比一个沉，有人端碗的手都在抖。那老长老低着头，半晌没憋出一句话来。"
 SUM_Neo_SGD.101.t:"长老可罢"
 SUM_Neo_SGD.101.d:"长老本是部里最受人敬重的，可若是犯了众怒，如今部众也能当众把他罢免。这一条写进盟约的时候，气氛着实尴尬。几个头发花白的老长老，坐在那里，听着人念这一条，脸色一个比一个沉，有的把脸扭向一边，有的端着水碗的手，微微发抖。他们心里明白，这规矩是冲着自己这样的人来的。有个年轻后生说得直白，长老也是人，也会犯错，犯了错，凭什么不能换？老长老们听着，无言以对，只把头低下去。这条规矩一定，部里办事果然公道了许多，长老们也收敛了不少，再不敢随意逞威风。自这规矩立后，长老办事实在，部众也肯听命，上下反倒比从前和睦。当初那几位沉下去的脸，如今也渐渐舒展开了。"
 SUM_Neo_SGD.101.a:"让花神的誓约作证"
 SUM_Neo_SGD.101.b:"让官署的法度作证"
 SUM_SGD_RB_Deshret_Oath:"赤王的旧誓"
 SUM_SGD_RB_Deshret_Oath_desc:"赤王当年许过一句话，不求神也能活。这句旧誓年代久了几乎被忘尽，如今被人翻出来，一字一句念给盟誓的众人听。老人们眼眶都红了。"
 SUM_Neo_SGD.102.t:"赤王的旧誓"
 SUM_Neo_SGD.102.d:"赤王当年，曾许过沙漠人一句话，道是不求神，也能活下去。这句旧誓，年代久了，几乎被人忘干净。如今新立的盟约成了，有人猛地想起这句话，便把它重新翻出来，一字一句，念给参加盟誓的众人听。念到不求神也能活这一句时，满场静了下来，连风沙的声音都显得远了。老人们听见这话，眼眶都红了。原来那一位旧年的王者，早就给沙漠人留下这么一句底气。如今大伙靠着自己和盟约过日子，不求神，不求人，倒真应了这句旧誓。有个老人喃喃道，赤王当年说的话，今日到底应验了，咱们总算没负了他。众人听了，都默默点头。年轻人听了，虽不懂其中分量，却也跟着肃然起敬，恭恭敬敬行了一礼。"
 SUM_Neo_SGD.102.a:"与雨林互通有无"
 SUM_Neo_SGD.102.b:"与雨林划清界限"
 SUM_SGD_RB_Pilgrim_Road:"朝圣之路"
 SUM_SGD_RB_Pilgrim_Road_desc:"去遗迹的路重新走通，路边的井也有人打理。走这路的不是拜神，是认自己的根。年轻人抚摸断墙上的刻痕，轻声说，原来先人曾在这里生活过。"
 SUM_Neo_SGD.103.t:"朝圣之路"
 SUM_Neo_SGD.103.d:"通往遗迹的路，如今重新被人走通了。路边那些荒废多年的井，也有人淘洗干净，重新打理，好让过路的人饮水。走这条路的，却不是为了拜神。这些人背着行囊，一路风尘，要到那古老的遗迹去，为的是认一认自己从哪里来。沙漠里的部族，年代久远，许多人都不知道自己的先祖是谁，从何处迁徙而来。如今遗迹里残存的石刻、断碑，或许能给出答案。有个年轻人站在遗迹的断墙前，伸手抚摸着上面斑驳的刻痕，轻声说道，原来咱们的先人，曾在这里生活过。他站了很久，手指在刻痕上停留，才转身离去。同来的人也纷纷驻足，有的拓下石刻上的字，有的在断墙边久久伫立。这一趟路，端的没白走。"
 SUM_Neo_SGD.103.a:"把土地分给部族"
 SUM_Neo_SGD.103.b:"把土地归入官仓"
 SUM_SGD_RB_Scarlet_Rite:"赤沙之礼"
 SUM_SGD_RB_Scarlet_Rite_desc:"每年在沙里办一场仪式，祭旧年王者，也给活人看。仪式不长，点篝火，诵祝词，说完便散。孩子问父亲图什么，父亲道，图的是别忘了自己是谁。"
 SUM_Neo_SGD.104.t:"赤沙之礼"
 SUM_Neo_SGD.104.d:"每年到了时节，沙漠里便要办一场仪式。这仪式，既是祭奠旧年的王者，也是为了活着的人。这仪式办得并不长。众人聚在沙丘之上，点起篝火，由年长的长者诵上几句古老的祝词，追忆往昔，再说说眼下的日子。年轻人听得认真，老人们神色庄重。没有冗长的排场，也没有繁缛的礼节，该说的说完，该祭的祭毕，众人便各自散去，该干什么干什么。有个孩子问父亲，这仪式年年办，图个什么？父亲想了想，答道，图的是别忘了自己是谁，从哪来，往后该怎么走。孩子似懂非懂地点点头，把父亲的话记在了心里。篝火渐渐熄了，人们三三两两往回走，嘴里还念着那几句祝词。明年的这个时候，他们还会再来。"
 SUM_Neo_SGD.104.a:"推举公议的执事"
 SUM_Neo_SGD.104.b:"沿用旧日的长老"
 SUM_SGD_RB_Relics_Kept:"遗物入册"
 SUM_SGD_RB_Relics_Kept_desc:"从遗迹里挖出的东西一律入册，谁挖的、挖在哪、归谁看，都写清楚。先前有人拿古物去换钱，如今一查便知。有个年轻人挖出古镜想卖，被拦下登记，也就释然。"
 SUM_Neo_SGD.105.t:"遗物入册"
 SUM_Neo_SGD.105.d:"从遗迹里挖出来的东西，如今一律要登记入册。是谁挖的，挖在什么地方，该由谁来保管，都要写得清清楚楚，明明白白。定下这条规矩，为的是防一样弊病。先前有人从遗迹里挖出古物，转手就拿去换了钱，把老祖宗留下的东西，卖得七零八落，谁也管不着。如今立了册子，每一件出土的东西都在案，谁要是私自拿去变卖，一查便知。有个年轻人挖出一面古镜，兴冲冲地要拿去卖，被管事拦下，登记入册。他起先不乐意，嘟囔了几句，后来听说这古物关系着部族的来历，也就释然了。管事的人把古镜小心包好，收进柜里。那册子越积越厚，后来专门打了一只木柜来装，钥匙由管事的人掌着。此话一传十，十传百。"
 SUM_Neo_SGD.105.a:"让花神的誓约作证"
 SUM_Neo_SGD.105.b:"让官署的法度作证"
 SUM_SGD_RB_Song_of_Sand:"沙海的诗"
 SUM_SGD_RB_Song_of_Sand_desc:"有人把这几十年的事编成诗，在篝火边传唱。诗里没有英雄，只有活下来的人。年轻人问怎么没有英雄，老人拨拨篝火道，能活下来，便是英雄。"
 SUM_Neo_SGD.106.t:"沙海的诗"
 SUM_Neo_SGD.106.d:"这几十年的沧桑变化，有人把它们编成了歌诗，在篝火旁边传唱。这歌诗里头，却没有半句英雄的故事。没有谁横扫千军，也没有谁建功立业，唱的尽是些寻常人的寻常事：谁家逃过了沙暴，谁家在荒年分到了粮，谁跟着商队走通了新路。唱到最后，一句也没有歌颂那风光的人物，唱的都是活下来的人。有个年轻人听罢，忍不住问，怎么没有英雄？唱歌的老人拨了拨篝火，缓缓答道，能在这沙漠里活下来，把日子过下去，便已经是英雄了。众人听了，都默然颔首。那年轻人若有所思，望着火光出了神。篝火噼啪作响，歌声在沙丘间飘荡，听着的人，有的红了眼眶，有的跟着轻轻哼唱。这歌声，就这样一代代传了下去。"
 SUM_Neo_SGD.106.a:"与雨林互通有无"
 SUM_Neo_SGD.106.b:"与雨林划清界限"
 SUM_SGD_RB_Ore_Pit:"开矿取铁"
 SUM_SGD_RB_Ore_Pit_desc:"山里开了几处矿，出铁与铜，矿归公有，下矿的按班轮值，工钱按月结。先前矿被豪强把持，工钱七扣八扣，稍有不从便是一顿鞭子。矿洞里火把通明，锤钎叮当响。"
 SUM_Neo_SGD.107.t:"开矿取铁"
 SUM_Neo_SGD.107.d:"山里新开了几处矿，出的是铁与铜。这矿归公中所有，不由哪一家哪一户独占。下矿的匠人，按着班次轮流值哨，一班接一班，歇人不歇工。工钱按月结算，到了日子，一个钱也不短少。先前那矿，被一家豪强把持，下矿的人累死累活，工钱却被七扣八扣，到手的没几个，稍有不从便是一顿鞭子。如今归了公，按班轮值，工钱月结，众人再不受那份窝囊气。矿洞里，火把照得明晃晃，锤钎敲得叮当响，一车车矿石被拉出来，堆在山脚。有个年轻矿工抹了把脸上的灰，笑道，如今这矿，是咱们大伙的，干起来也有劲，浑身有使不完的力气。山下的人见矿石一车车拉出，都说这矿归了公，到底是把好处分到了众人手里，再没人受那豪强的气。"
 SUM_Neo_SGD.107.a:"把土地分给部族"
 SUM_Neo_SGD.107.b:"把土地归入官仓"
 SUM_SGD_RB_Smith_Public:"公营铁坊"
 SUM_SGD_RB_Smith_Public_desc:"铁坊归公，农具与兵器都从这儿出。师傅带徒弟，倾囊相授，徒弟学成便留在坊里，不必外流。老师傅看着徒弟打的刀，点头道，好，手艺有传承了。"
 SUM_Neo_SGD.108.t:"公营铁坊"
 SUM_Neo_SGD.108.d:"铁坊如今也归了公，农具与兵器，都从这一处打出来。这铁坊里，师傅带着徒弟，手把手地教。师傅怎么抡锤，怎么掌钳，怎么看出火候，徒弟在旁边一样样学。从前学手艺，师傅往往留一手，生怕教会了徒弟，饿死了师傅，所以徒弟学成，还得离乡别井，到外处去找活路。如今不同了，师傅倾囊相授，徒弟学成了，就留在坊里，接着打铁。坊里炉火旺盛，人才一批接一批，手艺越传越精。有个老师傅看着徒弟打出的刀，点头赞道，好，这手艺算是有传承了，我死也瞑目了。坊里的徒弟，一个比一个争气，打出的农具又结实又好用，四乡的农户都认这铁坊的招牌。老师傅偶尔路过，看见徒弟们忙碌的身影，捋着胡子点头。"
 SUM_Neo_SGD.108.a:"推举公议的执事"
 SUM_Neo_SGD.108.b:"沿用旧日的长老"
 SUM_SGD_RB_Salt_Works:"盐场"
 SUM_SGD_RB_Salt_Works_desc:"盐场晒的是盐，也是钱，盐价由公议定，不许囤积。先前奸商囤盐，害百姓吃不上；如今价稳，家家饭桌都有了咸味。盐价牌立在盐场门口，写死了数目，谁也改不得。"
 SUM_Neo_SGD.109.t:"盐场"
 SUM_Neo_SGD.109.d:"盐场晒盐，晒出来的，是盐，也是钱。这盐，人人都得吃，一天也离不得，所以谁掌握了盐，谁就握着一条财路。从前有奸商囤积居奇，把盐藏起来，等着价钱高了再卖，害得百姓吃不上盐，或者只能买那贵得离谱的，怨声载道。如今立下规矩：盐价由公中议定，定下多少就是多少，谁也不许囤积，谁要是敢囤，严惩不贷。这一条一定，盐价稳稳当当，百姓再不受那奸商的气。盐田里，白花花的盐晒得满地都是，收盐的工人一筐筐往仓里装。有个老妇人买了盐，喜道，如今这盐价，公道，咱们也吃得起盐了。近处几座盐场，晒出的盐堆得像小山，白生生的一片，在日头下晃眼。百姓再不用为买盐发愁，家家户户的饭桌上，都有了咸味。"
 SUM_Neo_SGD.109.a:"让花神的誓约作证"
 SUM_Neo_SGD.109.b:"让官署的法度作证"
 SUM_SGD_RB_Cloth_Loom:"织造"
 SUM_SGD_RB_Cloth_Loom_desc:"织工把羊毛与驼绒织成布，厚实耐穿，远销外邦。梭子穿来穿去，手指翻飞，一匹布一寸寸织出来。外邦商队专程来贩，一车车拉走。那布扛得住风沙，也挡得住夜寒。"
 SUM_Neo_SGD.110.t:"织造"
 SUM_Neo_SGD.110.d:"沙漠里的织工，手儿最巧。他们把羊毛与驼绒，织成一方方的布。这布，厚实，耐穿，挡得住沙漠里刺骨的夜寒，也扛得住风沙的消磨。织布的女子坐在织机前，梭子穿来穿去，手指翻飞，一匹布就这样一寸寸织出来。这布织得好，远近闻名，不止沙漠里的人爱用，还远销到外邦去。外邦的商队，专程赶来贩这布，一车车地拉走。有个织工女子，望着自己织出的布被装上驼车，脸上露出笑意。旁边人打趣道，你这布，都卖到天边去了。她笑道，织得好，自然有人要，咱们的手艺，也算争了口气。这布的名声，越传越远，连远处城邦的人都专程来贩。织工们的手，从早忙到晚，虽累，心里却欢喜。"
 SUM_Neo_SGD.110.a:"与雨林互通有无"
 SUM_Neo_SGD.110.b:"与雨林划清界限"
 SUM_SGD_RB_Tool_Share:"农具共享"
 SUM_SGD_RB_Tool_Share_desc:"大件农具由公仓统管，哪家要用去登记便可借。先前各家都置一套，闲时多用时少，钱花得冤；如今轮借，省下的钱够添几头牲口。农忙时来借农具的，排成了长队。"
 SUM_Neo_SGD.111.t:"农具共享"
 SUM_Neo_SGD.111.d:"那些大件的农具，比如重犁、石磨，不是家家户户都置办得起的。如今这些家伙，都由公仓统一管理，哪家要用，去登记一声，便可借来使。这法子，省了大钱。先前每家都要置办一套农具，用的时候少，闲的时候多，钱花得冤枉。如今公用，各家轮着借，省下的钱，够添几头牲口。有个农户，头一回借了公仓的犁，用完洗干净，好好还了回去，对管仓的人说，这法子好，我一家省下的钱，添了一头小驴。管仓的笑着点头。仓里，农具摆放得整整齐齐，登记簿上，借还的记载一笔笔清楚。到了农忙时节，来借农具的人排成了队。管仓的人说，借归借，归还时须得洗干净，下回才好再借给别人。端的耐人寻味。"
 SUM_Neo_SGD.111.a:"把土地分给部族"
 SUM_Neo_SGD.111.b:"把土地归入官仓"
 SUM_SGD_RB_Levy_System:"轮值之制"
 SUM_SGD_RB_Levy_System_desc:"各家出丁轮值，一轮半年，值满便回家。当值的有粮饷，家里的地有人代种，再无后顾之忧。年轻人回家见禾苗齐整，一块石头落地。"
 SUM_Neo_SGD.112.t:"轮值之制"
 SUM_Neo_SGD.112.d:"各家出丁轮值，一轮半年，值满了便回家务农。这轮值也有章程：值班的人，有粮饷可领，家里那几亩地，也有人代为耕种，不会荒废。这般安排，当值的安心，在家的也放心。先前征兵，最怕的就是家里地没人种，出去一趟，回来地荒了，一年白干。如今有人代种，粮饷照发，当兵的人再无后顾之忧。到了轮换的日子，新的一班接旧的一班，老兵拍拍新兵的肩，叮嘱几句沙路上的规矩。有个服役期满的年轻人，扛着行李回家，见自家的地侍弄得齐齐整整，心中一块石头落了地。那年轻人放下行李，先到地里转了一圈，见禾苗长得齐整，这才进屋歇息。晚饭时，他对家里人说，这轮值的章程，真是想到咱们心坎里去了。"
 SUM_Neo_SGD.112.a:"推举公议的执事"
 SUM_Neo_SGD.112.b:"沿用旧日的长老"
 SUM_SGD_RB_Sand_Ranger:"沙海游骑"
 SUM_SGD_RB_Sand_Ranger_desc:"游骑不带辎重，走商队不敢走的险路，打快进快出的仗。夜袭敌营放一把火，前后不过一炷香，等敌军提刀追出，只剩几串蹄印被风沙抹平。"
 SUM_Neo_SGD.113.t:"沙海游骑"
 SUM_Neo_SGD.113.d:"游骑这一类兵马，最是来去如风。他们不带辎重，轻装上阵，走的是商队都不敢走的险路，打的是快进快出的仗。这游骑的厉害，就在一个快字。敌人还没回过神来，他们已经冲到跟前；等敌人反应过来要围堵，他们早已带着战果，消失在沙丘的另一边。他们不恋战，不贪功，一击即走，叫人防不胜防。有一回，游骑夜袭一处敌营，放了一把火，救走了被掳的人，前后不过一炷香的工夫。等敌军提刀追出，沙漠里哪里还有半个人影，只余下几串浅浅的蹄印，被风沙迅速抹平。带队的游骑回到营中，连盔甲都没来得及卸，便报了平安。营里的弟兄都说，这般来去如风的打法，端的让敌人摸不着头脑。其中大有学问。"
 SUM_Neo_SGD.113.a:"让花神的誓约作证"
 SUM_Neo_SGD.113.b:"让官署的法度作证"
 SUM_SGD_RB_Siege_Hand:"攻坚人手"
 SUM_SGD_RB_Siege_Hand_desc:"沙漠少攻坚，多袭扰。真到了非攻关隘不可时，游骑便派不上用场，得另凑一支精锐，架云梯，挖地道，冒箭雨往前冲。为首的说，这活九死一生。"
 SUM_Neo_SGD.114.t:"攻坚人手"
 SUM_Neo_SGD.114.d:"沙漠里打仗，少有那种攻坚拔城的硬仗，多是袭扰，是游斗。这也难怪，沙漠辽阔，关隘稀少，硬攻城池，既费时日，又耗人命，划不来。可话说回来，真到了非得攻克一处关隘不可的时候，寻常的游骑便派不上用场了。这时候，就得另凑一支专干这活的人手。这些人，是军中的精锐，专门练那攻坚的本事，架云梯，挖地道，冒着箭雨往前冲。选拔时，一个个都是百里挑一的好汉，平日里练得格外苦，手上脚上磨出的茧子，厚得能磨穿铁。为首的对众人说，这活计九死一生，可若没有咱们，这关隘便攻不下来。众人听了，齐齐应诺，声震沙丘。到了攻城那日，云梯一架接着一架靠上城墙，挖地道的从地下掘将进去，喊杀声震天动地。"
 SUM_Neo_SGD.114.a:"与雨林互通有无"
 SUM_Neo_SGD.114.b:"与雨林划清界限"
 SUM_SGD_RB_Field_Kitchen:"行军灶"
 SUM_SGD_RB_Field_Kitchen_desc:"行军灶做不出好饭，却一定要准时。队伍走完一天，远远望见灶上的烟，脚下便添了力气。吃上热食的，走的路比别人远。那灶上的烟一冒，队伍的脚步便快了。"
 SUM_Neo_SGD.115.t:"行军灶"
 SUM_Neo_SGD.115.d:"沙漠行军，最苦的不是厮杀，乃是吃饭。行军灶垒在沙上，风一裹，火苗东倒西歪，米下锅半生不熟，汤里飘着细沙。伙夫急得满头是汗，灶上的时辰却一刻不敢误。这灶上做不出好饭，偏立下一条死规矩：到了时辰必须开饭，迟一息也不成。却是为何？原来大漠里赶路，全凭一口热食垫底。热汤下肚，冻僵的身子暖过来，脚底便添了力气，一日能多走三十里。那些冷啃干粮的队伍，走到半途便塌了脚，远远落在后头。有一回三路人马同行，一路按时吃了热食，一路贪赶路冷了灶，结果先到的占了泉眼，后到的只剩一汪浑沙。众人方信这灶上的规矩，端的误不得。后来这灶上的时辰，便成了军中头一条铁律。"
 SUM_Neo_SGD.115.a:"把土地分给部族"
 SUM_Neo_SGD.115.b:"把土地归入官仓"
 SUM_SGD_RB_Wounded_Tent:"伤兵帐"
 SUM_SGD_RB_Wounded_Tent_desc:"伤兵帐里管的是止血与接骨，管不了的就送回去。军医昼夜不合眼，一个伤口一个伤口地看。能救一个是一个，这条规矩没人明说，人人却都守着。"
 SUM_Neo_SGD.116.t:"伤兵帐"
 SUM_Neo_SGD.116.d:"那伤兵帐里，终日弥漫着药气与血腥。军医蹲在伤兵身边，一手按住止血的布，一手去接歪了的骨，额上的汗一滴滴落进沙土。能救的，便在这里止血接骨，把人从鬼门关硬拽回来；救不下的，也不硬留，裹一裹送回后方去，免得白占帐中的位置。这帐中不分贵贱，只看伤势：重些的先治，轻些的自己扛着。有个小卒，腿被长矛扎穿，众人说他这条腿废了，军医偏不肯弃，剔出碎骨，敷上药，拿木板夹住，半月之后竟能下地走路。也有那伤得太重的，军医摇摇头，叹一声，命人抬走。帐外的担架，来来往往，没个停歇。这郎中白日黑夜守在帐里，手上的血洗了又洗，衣裳就没干过。有人劝他歇一歇，他只摇头，说帐里还躺着人。"
 SUM_Neo_SGD.116.a:"推举公议的执事"
 SUM_Neo_SGD.116.b:"沿用旧日的长老"
 SUM_SGD_RB_Recognize:"求列邦承认"
 SUM_SGD_RB_Recognize_desc:"使节带着盟约抄本四处登门，要的只是一句话：承认沙漠自己管自己。有的城一口应下，有的关起门来不见。使节也不恼，明日再来。有的城关上门，使节就在门外等。"
 SUM_Neo_SGD.117.t:"求列邦承认"
 SUM_Neo_SGD.117.d:"沙漠遣出使节，怀里揣着盟约的抄本，一城一城地登门。见了那边的头人，也不绕弯，只把抄本往案上一放，要的只是一句话：承认沙漠自己管自己。这一句话听着轻飘，落地却千钧重。使节走遍各处绿洲，口都说干了，有的点头，有的推诿，有的干脆闭门不见。遇到那爽快的，当场画押，使节便长揖到地；遇到那滑头的，今日推明日，使节便日日坐在门槛上等，愣是把人家等软了心。有一回对面翻了脸，拔刀相向，使节把抄本往怀里一揣，昂然道：我为沙漠百姓而来，头可断，这句话却改不得。那人气焰顿挫，到底松了口。使节回到沙漠，把各国的回话一条条抄下，呈给主事的人看，说道：肯认的记着，推诿的也记着，来日再算。"
 SUM_Neo_SGD.117.a:"让花神的誓约作证"
 SUM_Neo_SGD.117.b:"让官署的法度作证"
 SUM_SGD_RB_Trade_Treaty:"通商条约"
 SUM_SGD_RB_Trade_Treaty_desc:"与外邦通商立约，约里只写税则与护侨，别的一概不写。少写一条，便少一桩日后的争。那边想添些条款，使者摇头说，多了反倒不好办。"
 SUM_Neo_SGD.118.t:"通商条约"
 SUM_Neo_SGD.118.d:"沙漠与外邦通商，议定立一纸盟约。两边坐在帐中，讨价还价，争到口干舌燥，末了落笔，约里只写两桩：一桩是税则，货过多少抽多少，写得清清楚楚；一桩是护侨，两边商旅在对方地界上，性命财产都得保住。旁的闲话，一句也不写。这约看着薄，分量却厚。先前含糊惯了，商人被抢了货，告状无门，只能自认倒霉；如今白纸黑字，谁要赖账，众人便指着约问他。有那精明的商队，带着两份约本上路，过了卡子便掏出来晃一晃，守卡的看了，也不敢再多加刁难。有一回果真扣了货，商队把约本一递，对面翻看半晌，只得乖乖放行。后来两下里果真照约办事，商路越走越宽，别邦见了这约书，也照着格式一条条学。"
 SUM_Neo_SGD.118.a:"与雨林互通有无"
 SUM_Neo_SGD.118.b:"与雨林划清界限"
 SUM_SGD_RB_Hire_Out:"佣兵外派"
 SUM_SGD_RB_Hire_Out_desc:"旅团接外邦的活，打的是别处的仗，挣的是本地的粮。这一条让不少长老皱眉：自家的刀，凭什么替人去磨？可账上的摩拉，到底实在。"
 SUM_Neo_SGD.119.t:"佣兵外派"
 SUM_Neo_SGD.119.d:"镀金旅团接了外邦的活，扛着刀枪，远去打别处的仗。打赢了，带回来的却不是金银，而是本地紧缺的粮。这买卖听着划算，却让不少长老皱起了眉。为何？沙漠的儿郎，本该守着自家的水井与绿洲，如今却替外人去卖命，家里反倒空了。有一日族中议事，几个长老拍着桌子嚷：粮是有了，可人呢？回来的少了，埋在外乡的多了，这粮吃得下咽？也有那年轻气盛的辩道：不去打仗，粮从何来，难道等着饿死？两边争到天黑，谁也没说服谁。旅团的首领坐在末位，闷头喝酒，末了只说一句：这碗饭，端着烫手，放下又饿。城里为此还定下一条规矩：旅团出外打仗，得留下名册，阵亡的抚恤家里，不许拖欠。长老们这才略略宽心。"
 SUM_Neo_SGD.119.a:"把土地分给部族"
 SUM_Neo_SGD.119.b:"把土地归入官仓"
 SUM_SGD_RB_Border_Talk:"边界磋商"
 SUM_SGD_RB_Border_Talk_desc:"与邻邦磋商边界，一里一里地谈，谈不拢就先搁着，搁着也不动兵。那地图摊在桌上，两人各指一边，谁也不让。谈了一日，各回各的帐。"
 SUM_Neo_SGD.120.t:"边界磋商"
 SUM_Neo_SGD.120.d:"沙漠与邻邦磋商边界，两边派了能言善辩的人，捧着旧图，一里一里地谈。这一段归谁，那一段属哪，争的是寸土，谁也不肯松口。谈得拢的，便立桩为界；谈不拢的，便先搁在那里，各回各家。这搁着二字，最见耐性。有人急了，主张干脆动兵，把这三尺界，硬打出来。主事的老成持重，按捺住道：打容易，收场难，今日抢来的地，明日还得拿人去填，何苦来哉。于是两边收了刀，各自退去。那几段搁着的边界，荒着没人管，倒也落个太平，牧人照样在界河边饮水。那老使臣还说：地是死的，人是活的，今日搁下的，来日未必争不回来；一旦动了刀，死的便不止一两个人。众人听了，都觉这话稳当。"
 SUM_Neo_SGD.120.a:"推举公议的执事"
 SUM_Neo_SGD.120.b:"沿用旧日的长老"
 SUM_SGD_RB_Rainforest_Delegation:"雨林的门"
 SUM_SGD_RB_Rainforest_Delegation_desc:"对雨林仍留着一扇门，派去的人带着商约，也带着刀。门开多大，全看对面怎么接。来人若客气，便请进帐喝茶；若来者不善，刀也就横在膝上。"
 SUM_Neo_SGD.121.t:"雨林的门"
 SUM_Neo_SGD.121.d:"沙漠对雨林，到底留着一扇门，不曾关死。派去的人，带着商约去谈买卖，腰间却也挎着一把刀。这商约与这把刀，原是一套手段：谈得来，便开市通商，两只手握在一处；谈不来，刀也就亮出来，门随时能关。门开多大，全看对面怎么接。有那识趣的，笑脸相迎，商队便鱼贯而入，骆驼背上驮满货物，一路欢声；也有那傲慢的，把商约掷在地上，使节便拾起来，拍拍尘土，默默退出，回头便添了兵马。这一手软硬兼施，端的老辣。城里看热闹的，都说这使节，一半是商人，一半是武夫。后来两边果真开市，第一批货换回了不少盐与布，沙漠的人尝着甜头，便都说这门开得值。那使节却提醒：门能开，也能关。"
 SUM_Neo_SGD.121.a:"让花神的誓约作证"
 SUM_Neo_SGD.121.b:"让官署的法度作证"
 SUM_SGD_RB_Commune:"旅团公议之世"
 SUM_SGD_RB_Commune_desc:"沙漠公事如今由两部人管：一部管水与地，一部管契约与兵。两部的人在同一张长桌上坐着，桌角刻着一条规矩，是当年神王遗案底被一把火烧掉之后才刻上的。"
 SUM_Neo_SGD.122.t:"旅团公议之世"
 SUM_Neo_SGD.122.d:"沙漠的公事，如今分作两部来管：一部管水与地，凡渠如何分、田如何耕，都归他们；一部管契约与兵，凡盟约怎样立、队伍怎样调，都归他们。两部的人，同在一张长桌上议事。这张桌子大有来历，桌角刻着一条规矩，字迹深深，是当年神王之遗的案底被一把火烧掉之后，才一刀一刀刻上去的。火灭了，旧案成了灰，活人总得立个新章程。两部的人初时各执一词，吵得面红耳赤，几乎拍碎了桌子；后来慢慢懂了，管水的离不了护兵，管兵的也离不了粮地，合则两利，分则两伤。两部初时还争个高下，后来渐渐悟出道理：水地无兵则不安，契约无粮则不行。于是长桌上再没了拍案之声，一应公事，都按那桌角的规矩办。"
 SUM_Neo_SGD.122.a:"与雨林互通有无"
 SUM_Neo_SGD.122.b:"与雨林划清界限"
 SUM_SGD_RB_Oath_of_Floral_King:"花神与赤王同誓"
 SUM_SGD_RB_Oath_of_Floral_King_desc:"赤王旧誓与花神旧盟，被人一并翻出来，刻在同一块石板上，立在绿洲泉边。从此沙漠的规矩里，多了一条与神无关、与人有关的道理。"
 SUM_Neo_SGD.123.t:"花神与赤王同誓"
 SUM_Neo_SGD.123.d:"沙漠的旧神，其实不曾走远，只是被埋在沙里太久，连名字都蒙了尘。如今有人把赤王的旧誓与花神的旧盟，一并翻出来，请匠人刻在同一块石板上，立在绿洲的泉边。这一块石板，端的重得很。先前沙漠的规矩，桩桩件件都援引神意，神说如何便如何，谁也不敢疑问；如今两篇旧誓并排刻着，赤王归赤王，花神归花神，谁也压不得谁。日子久了，人们绕着石板取水、歇脚、谈事，渐渐悟出一条新道理：这规矩里，竟多了一条与神无关、与人有关的道理。神的话听不听，先要看地上的活人答不答应。那石板立在泉边，风吹日晒，金粉剥落不少，可来观看的人，反倒一年多似一年。有后生抄了石板上的字，带回去教给娃娃们念。"
 SUM_Neo_SGD.123.a:"把土地分给部族"
 SUM_Neo_SGD.123.b:"把土地归入官仓"

 #### 丙线 · 赤王复兴 ####
 SUM_SGD_RC_The_Return_of_the_Red_King:"赤王的旗"
 SUM_SGD_RC_The_Return_of_the_Red_King_desc:"第三条路，主张把沙漠重新捏成一个有力的整体：立王统，修神庙，整军伍，开遗迹。走这条路的人说，沙漠吃够了散的亏，散着便永远受欺。"
 SUM_Neo_SGD.124.t:"赤王的旗"
 SUM_Neo_SGD.124.d:"沙漠之内，第三条路渐渐有了声势。这条路的主张，是把散沙重新捏成一个有力的整体：立王统，定名分；修神庙，聚人心；整军伍，练兵马；开遗迹，搜旧物。四桩事，一桩比一桩大。走这条路的人，心里都憋着一口气。他们说，沙漠这些年吃的亏，都吃在一个散字上：各部各管各的，遇事便是一盘散沙，人家来欺，你看看我，我看看你，谁也不肯头一个出头。散着，便永远受欺；合起来，才挺得起腰杆。于是奔走呼号，一处一处去说合，嗓子都喊哑了。有人听了热血上涌，也有人摇头，怕这王统立起来，又是套在头上的新枷锁。当下听的人里，有的点头，有的摇头。点头的人只认一个理：沙漠再不能这样散下去。"
 SUM_Neo_SGD.124.a:"重立赤王的旧制"
 SUM_Neo_SGD.124.b:"重建城邦的议会"
 SUM_SGD_RC_Royal_Line:"溯王统"
 SUM_SGD_RC_Royal_Line_desc:"把历代王室的血脉理了一遍，理到最后，能继的一支只剩旁系。众人争了半日，最后那老者一锤定音：旁系也是系。那老者把谱牒摊在膝上，指头点了又点，才肯点头。"
 SUM_Neo_SGD.125.t:"溯王统"
 SUM_Neo_SGD.125.d:"要立王统，先得理一理沙漠历代王室的血脉。管这事的人，翻遍了旧谱残卷，一处一处地对照，一代一代地排下来。理到最后，直系的血脉竟断了，能接上的，只剩旁系一支。这旁系听着不响亮，众人心里都有些犯嘀咕：隔了几代，还算得王族么？主事的人却把谱册一合，朗声道：旁系也是系，血脉虽远，终归同出一源。当年赤王的血脉传到今日，能留下这一支，已是天大的万幸，难道就因一个旁字，便弃之不顾？众人想想，也觉有理。于是把旁系这一支迎了回来，供起先王的牌位，择日告庙。那旁系的后人也不是纨绔，荒年开过仓，沙暴天救过人，人品端正。众人你看我我看你，末了都点了头。"
 SUM_Neo_SGD.125.a:"召集能战之众"
 SUM_Neo_SGD.125.b:"召集能谋之士"
 SUM_SGD_RC_Coronation:"加冕"
 SUM_SGD_RC_Coronation_desc:"加冕在旧王城遗址办，冠是照壁画新打的，重得压脖子。戴上去的人，从此不能再说自己是普通人。他抬手扶了扶那冠，沉甸甸的。那冠压在头上，连脖子都酸了。"
 SUM_Neo_SGD.126.t:"加冕"
 SUM_Neo_SGD.126.d:"加冕的大典，就选在旧王城的遗址上办。那王城早成了一片断壁残垣，荒草没膝，如今扫净了，铺上红毡，倒也像个样子。新王头上戴的冠，是照着壁画上新打的，金光闪闪，沉甸甸压得脖子发酸。这冠看着华贵，戴上去可不轻松。新王掐着步子走上台，冠压得他连头也不敢抬。老臣在旁低声提醒：戴上这物件，从此便不能再说自己是寻常百姓了，一言一行，都系着整个沙漠。新王喉头动了动，郑重点头，伸手扶正了冠。台下黑压压跪了一片，山呼之声，震得黄沙都颤。礼官高声唱礼，台下的呼声一浪高过一浪，他却觉得那冠越发沉重。散场后独自站在残垣上，望了很久的落日，心里明白这担子重如千钧。"
 SUM_Neo_SGD.126.a:"以神权号令沙漠"
 SUM_Neo_SGD.126.b:"以律法约束诸城"
 SUM_SGD_RC_Court_Order:"朝仪"
 SUM_SGD_RC_Court_Order_desc:"重立朝仪，谁站哪一级台阶，都有定规。规矩一立，人心反倒定了。从前挤作一团的，如今按班次站好，鸦雀无声。谁站哪一级，自己心里先有数，再不敢乱走一步。"
 SUM_Neo_SGD.127.t:"朝仪"
 SUM_Neo_SGD.127.d:"新朝既立，头一件事，便是重立朝仪。谁站在哪一级台阶上，谁先入帐，谁后开口，一概定下规矩，刻在木牌上，挂在殿外。这规矩初立之时，众人还不惯，常有站错了位的，被礼官悄悄扯到一边，臊得满脸通红。日子久了，倒也各安其位：文官站左，武将站右，宗室居前，旧臣列后。怪的是，规矩越死，人心反倒越定。先前大家心里都没底，不知谁大谁小，暗地里较劲使绊；如今台阶一站，高下自见，谁也不用再猜。上朝时鸦雀无声，退朝时井井有条，连咳嗽声都听得分明。有个老臣私下说道：规矩这东西，看着是捆人，其实也护人；人人知道自己站在哪里，就不会起了妄念。这话传开，别的官署也照着立起台阶。"
 SUM_Neo_SGD.127.a:"把遗迹挖开"
 SUM_Neo_SGD.127.b:"把遗迹封回去"
 SUM_SGD_RC_Council_Narrow:"缩议政"
 SUM_SGD_RC_Council_Narrow_desc:"议政席位从几十个缩到九个，说话能算数的人少了，事情办得反倒快了。从前一人一句扯到天黑，如今九人围坐，片刻便决。九把椅子一摆，再没扯皮到天黑。"
 SUM_Neo_SGD.128.t:"缩议政"
 SUM_Neo_SGD.128.d:"议政的席位，原先满满当当，大大小小几十号人，你一言我一语，一件小事能吵上半年。新朝一立，大刀阔斧，把席位从几十个，一口气缩到九个。这一下得罪了不少人，被裁的气急败坏，骂街说这是独断专行。可怪事又来了：人少了，说话能算数的多了，事情反倒办得快了。九个席位围坐一圈，各管一摊，议一件事，三言两语便有了章程，当天出令，当天便执行下去。先前那种议而不决、决而不行的毛病，竟一扫而空。有那被裁的，私下里还不服气，可看着新朝办事的利落，也只得把话咽回肚里。丢了席位的人久了也明白，这九个位子，都是拿本事换来的，不是白坐的。后来每有大事，九人围桌，一番议论便定章程。"
 SUM_Neo_SGD.128.a:"重立赤王的旧制"
 SUM_Neo_SGD.128.b:"重建城邦的议会"
 SUM_SGD_RC_Succession_Law:"王位之法"
 SUM_SGD_RC_Succession_Law_desc:"定下继位的规矩，免得日后又为这个打成一团。那规矩写得死板，死板才管得住人。有人嫌它不近人情，可真到了那一刻，谁也说不出二话。"
 SUM_Neo_SGD.129.t:"王位之法"
 SUM_Neo_SGD.129.d:"新王朝头等大事，是把继位的规矩定下来。这一条最要紧，也最惹人忌讳。先前没有定制，先王一去，几个王子各树一旗，刀兵相见，把个沙漠搅得天翻地覆，百姓跟着遭殃。这一回，众人把话摊开来说：嫡长继承，顺序排定，写在铁板上，谁也不许多说半句。规矩写得死板到了极点，连嫡庶、长幼、过继的种种情形，都一条条列得明白，半点回旋的余地也不留。有人嫌太死，主事的却道：越是死板，才越管得住人，留了缝，日后就有人钻空子。于是立碑为誓，昭告众人。后来果然有几回，有人动了别的心思，一想到这铁打的规矩，也就熄了火。有一年几位王子争执不休，争了半日，还得照规矩办。"
 SUM_Neo_SGD.129.a:"召集能战之众"
 SUM_Neo_SGD.129.b:"召集能谋之士"
 SUM_SGD_RC_Rebuild_Temple:"重修仙庙"
 SUM_SGD_RC_Rebuild_Temple_desc:"把塌了的庙一处处修回去，壁画照旧，香火照旧。修庙的人竟比拜庙的人还多。匠人们攀在脚手架上，一笔一笔描那旧壁画。那壁画上的颜色，一笔一笔都照着旧样描。"
 SUM_Neo_SGD.130.t:"重修仙庙"
 SUM_Neo_SGD.130.d:"那一座座塌了的神庙，新朝一处处着手修回去。断了的柱子扶起来，缺了角的壁画照着旧样细细描，香炉重新擦亮，香火也照旧续上。修庙这桩事，古怪得很：修庙的人，竟比拜庙的人还多。匠人、苦力、画师，来来往往，把个冷清了多年的庙宇，闹得热火朝天。倒真有那虔诚的香客，提着供品远道来拜，见了满地脚手架，反倒愣住，不知该往哪里下跪。有老者拄杖叹道：神像还是那尊神像，壁画还是那幅壁画，只是拜的人少了，修的人多了。这庙修得再齐整，香火旺不旺，说到底，还得看人心。开光那日香客来了不少，挤在殿里上香，倒也热闹。有人叹道：原来百姓心里，到底还留着这尊神。"
 SUM_Neo_SGD.130.a:"以神权号令沙漠"
 SUM_Neo_SGD.130.b:"以律法约束诸城"
 SUM_SGD_RC_Priest_Order:"祭司之序"
 SUM_SGD_RC_Priest_Order_desc:"祭司按序受职，那序由官府来定。神还是旧的神，管神的却是新的人。老祭司交出印信时，手抖了抖，终究还是鞠了一躬。那印信交出去，老祭司的手抖了又抖。"
 SUM_Neo_SGD.131.t:"祭司之序"
 SUM_Neo_SGD.131.d:"神庙重修之后，祭司也要重新受职。这受职的次序，不由神庙自己定，却由官府一纸文书排下来：谁掌大祭，谁司香火，谁管祭器，都写得明明白白。这里头大有文章。神，还是那旧日的神，名号没改，法相没动；可管神的人，却换成了新朝任命的官。祭司们接过官牒，心里五味杂陈：先前他们自认是神的仆人，如今倒成了官府的属吏，见官也得低头。有的想得开，捧着官牒谢恩；有的拂袖而去，说这是拿神明来做买卖。官府也不强留，转身便补上新人，照样上香，照样叩拜。有老祭司想刁难，故意报错时辰，新人却不慌不忙，照册子一一核对，半点不乱，连老祭司也暗暗点头，倒是心服口服。"
 SUM_Neo_SGD.131.a:"把遗迹挖开"
 SUM_Neo_SGD.131.b:"把遗迹封回去"
 SUM_SGD_RC_Deshret_Rite:"赤王之祀"
 SUM_SGD_RC_Deshret_Rite_desc:"重办赤王的祭礼，礼就在沙里办，供的是旧日王者的威名，也是今人的胆气。风卷着黄沙掠过祭坛，众人齐齐俯身。那礼从日头偏西办到掌灯，沙地上跪了一片人。"
 SUM_Neo_SGD.132.t:"赤王之祀"
 SUM_Neo_SGD.132.d:"赤王的祭礼，新朝决定重办，而且偏要在沙里办。这祭礼上供的，不只是旧日王者的威名，还有今人的胆气。祭坛就设在茫茫黄沙之中，四周插满旗幡，被风吹得猎猎作响。主祭的人立于坛上，高举火把，朗声诵念赤王旧誓，声音被风卷着，送出老远。坛下的军士，个个按刀肃立，火光映着一张张脸，都添了几分豪气，血脉偾张。这祭火从黄昏烧起，一直烧到天色大亮，方才渐渐熄灭。守夜的人换了一拨又一拨，谁也不肯先撤，都说是沾了王者的气象。第二年祭礼再办，来的人比头一年更多，有远道的部落也赶来助祭。众人望着那火，心里那点自卑和惶恐，仿佛也跟着烧尽了。沙漠的人心，便跟着这火一年旺似一年。"
 SUM_Neo_SGD.132.a:"重立赤王的旧制"
 SUM_Neo_SGD.132.b:"重建城邦的议会"
 SUM_SGD_RC_Floral_Shrine:"花神之龛"
 SUM_SGD_RC_Floral_Shrine_desc:"花神的信众不断绝，官府便替他们立龛，只是龛前要多站一个官。拜的人是真心，站的官却是冷眼。两下里各守各的，倒也相安。拜的人闭着眼，站的官却睁着眼。"
 SUM_Neo_SGD.133.t:"花神之龛"
 SUM_Neo_SGD.133.d:"花神的信众，到底不曾断绝，年年岁岁，总有人来拜。官府见拦不住，索性替他们立了龛，方便祭拜。只是这龛前，比先前多站了一个官。这多出来的一个人，意味深长。先前信众拜花神，是自家的心思，跪下磕头，心里想什么，谁也不管；如今龛前站了官，众人跪拜，都有人看着，嘴里念的词，也斟酌着改了几分。有那耿直的信众，不肯对着官磕头，转身便走了；也有那乖觉的，反倒觉得有了官府撑腰，拜得更踏实，供品也摆得更丰盛。龛还是那个龛，神还是那位神，只是多了一双眼睛。有的信众索性把那官儿也当成龛前的一景，上香时顺手也给他行个礼。龛里的香灰一日厚似一日，官儿换了一任又一任，香火却始终没断。"
 SUM_Neo_SGD.133.a:"召集能战之众"
 SUM_Neo_SGD.133.b:"召集能谋之士"
 SUM_SGD_RC_Pilgrim_Guard:"护法队"
 SUM_SGD_RC_Pilgrim_Guard_desc:"朝圣路上派护法队，护的不只是香客，还有沿路的税卡。香客谢过护法，那队人却一眼不落地盯着路口。那护法队一路跟着，香客走多远，他们便守多远。"
 SUM_Neo_SGD.134.t:"护法队"
 SUM_Neo_SGD.134.d:"通往圣地的朝圣路上，新朝派了护法队，一程一程地护送。这护法队名义上护的是香客，防的是盗匪与风沙；可明眼人都看得出，沿路那一座座税卡，才是护得最紧的。香客们背着香囊，一步步跋涉，护法队在前开道，在后压阵；到了税卡，队员便帮着盘查过往客商，抽税验货，一样不落。有的香客私下嘀咕：我等是来拜神的，怎的像押着货过关。护法队的头目只笑：神要拜，税也要抽，两下里都护着，才保你一路平安。香客们听了，也只得继续赶路。好在那伙盗匪确实敛了迹，路上安宁了些。只是香税一年重似一年，香客嘴上不说，心里都有本账。有精明的，索性绕开官道，从沙脊上摸过去，图个省事。护法队也睁一眼闭一眼。"
 SUM_Neo_SGD.134.a:"以神权号令沙漠"
 SUM_Neo_SGD.134.b:"以律法约束诸城"
 SUM_SGD_RC_Army_Reform:"整军"
 SUM_SGD_RC_Army_Reform_desc:"把各部各团的兵编成一支军，旗号、号令、粮饷一律统一。那些被编掉的老队，心里不服，手上却也得听。号令一下，再不敢各走各的。"
 SUM_Neo_SGD.135.t:"整军"
 SUM_Neo_SGD.135.d:"沙漠各部各团的兵，向来各树旗号，各听各的令。新朝一下手，把这一盘散兵，硬生生编成一支军：旗号换成一样的，号令归于一处，粮饷也由官府统一发放。这一编，省事是真省事，可也惹出一肚子怨气。那些被编掉的老队，祖上传下来的旗号，说撤就撤，心里如何服气？私下里骂骂咧咧，说这是断了人家的根。可骂归骂，粮饷在人家手里，号令比天还大，手上却不得不听。操练时，新旧兵混在一处，起初还别着劲，你瞅我我瞅你，日子久了，倒也磨合出几分默契。有个老兵捏着旧旗，眼圈红了，末了还是把旗交了出去。新军操练起来，号令整齐，进退有度，比从前那些各吹各号的队伍强出百倍。阅兵那日，队列走过城门，百姓都看呆了。"
 SUM_Neo_SGD.135.a:"把遗迹挖开"
 SUM_Neo_SGD.135.b:"把遗迹封回去"
 SUM_SGD_RC_Staff_College:"设军师府"
 SUM_SGD_RC_Staff_College_desc:"军师府管谋划与粮道，不直接带兵。带兵与谋划分开，谁也翻不了天。那军师伏在案上画图，一笔一笔，都在算粮。那案上的粮道图换了一张又一张，墨迹都没干透。"
 SUM_Neo_SGD.136.t:"设军师府"
 SUM_Neo_SGD.136.d:"新朝设了军师府，专管谋划与粮道，却不直接带兵。这一分开，正是要害所在。带兵的只管打仗，谋划的只管运筹，粮道由军师府调度，一环扣着一环，却谁也离不开谁。先前那弊端，将领一手握着兵，一手抓着粮，翅膀硬了，便不听使唤，动不动拿兵权要挟朝廷；如今兵、谋、粮分作三处，互相牵制。带兵的想打仗，得先问军师府要粮；军师府想调兵，也得禀明主上，不得擅专。有一回大将请战，军师府以粮草未集为由驳回，大将干瞪着眼，也只得按下。有人嫌这般分法办事啰嗦，主事的人却说道：宁可啰嗦些，也不可叫一人独大。后来果然有人想效仿旧日权臣，一手遮天，却因军师府在旁掣肘，没能成事。"
 SUM_Neo_SGD.136.a:"重立赤王的旧制"
 SUM_Neo_SGD.136.b:"重建城邦的议会"
 SUM_SGD_RC_Garrison_All:"遍设戍所"
 SUM_SGD_RC_Garrison_All_desc:"沙漠诸城，城城设起戍所，街街头头都立着岗。看那入夜之后，灯火一处接一处，巡卒的刀映着月光。自打戍所立起来，夜里行路的人便少了。原来巡卒逢人便盘问，谁也不愿惹那麻烦。"
 SUM_Neo_SGD.137.t:"遍设戍所"
 SUM_Neo_SGD.137.d:"新朝治下，城城设戍所，街街设岗哨。那戍所小则十余人，大则数十人，握着刀枪，守着路口。这法子立起来，夜里行路的人，便明显少了。先前沙漠的夜晚，寻常百姓也敢趁着月色走亲访友，如今一更天一过，街上便清了场，只有戍所的灯还亮着。有那赶夜路的，被岗哨拦下，盘问半天，验过腰牌才肯放行。有人说这是治安好了，夜里再不怕劫匪；也有人私下抱怨，说是管得太严，连出个门都要报备。戍所的兵却不管这些，只按令行事，风雨无阻。有人叹道：安宁是安宁了，只是这夜里，究竟是歹人怕官，还是百姓也怕官？那岗哨的白刃在火把下闪着光，照得整条街明晃晃的，却照不见一个人影。"
 SUM_Neo_SGD.137.a:"召集能战之众"
 SUM_Neo_SGD.137.b:"召集能谋之士"
 SUM_SGD_RC_Conscription:"征兵法"
 SUM_SGD_RC_Conscription_desc:"沙漠立下新法，凡成丁者皆有服役之责，年限一满便放回家。法才立，各家便把尚未成丁的藏进地窖，报户口时一个个都说年纪尚小。有那差役挨门查点，也查不出个所以然。百姓怕那兵役，端的想尽了法子。"
 SUM_Neo_SGD.138.t:"征兵法"
 SUM_Neo_SGD.138.d:"新朝立法：凡成丁者，皆有服役之责，服役期满，便放回家。这法看着公道，底下却炸了锅。成丁的年限，卡在十六岁，谁家孩子满了十六，就得抽去当兵。于是各家的算盘，打得噼啪作响：有把生日改小的，有把儿子藏进地窖的，有紧着把媳妇娶进门、好说儿子已成家可缓役的。衙门派人挨家挨户地查，查出隐瞒的，罚粮罚钱，绝不宽宥。可道高一尺，魔高一丈，藏人的法子，层出不穷。有一户人家，为了躲役，举家搬进了深沙，几年不敢进城。官府派人挨家核查，查出来便罚。可藏的人太多，哪里查得过来。有个老吏叹道：法一立，各家藏着不算成丁的人，这法算是落了空。官府没法，只得改了章程，按田亩摊派。"
 SUM_Neo_SGD.138.a:"以神权号令沙漠"
 SUM_Neo_SGD.138.b:"以律法约束诸城"
 SUM_SGD_RC_Purge_Soft:"清队"
 SUM_SGD_RC_Purge_Soft_desc:"军里那几支不听话的兵，被一概清了出去。问其罪状，却没有什么，只一句不合适便打发了。那些人被赶出营门，连个去处也没有，军中自此无人敢有异议。有分教：军中容不得异己，一句话便是罪名。"
 SUM_Neo_SGD.139.t:"清队"
 SUM_Neo_SGD.139.d:"新朝整军，有一桩做得干脆：把军里不听话的几支，清了出去。这清人可不比杀伐，名堂最是讲究。那几支队伍，论罪状，一条也罗织不出来，他们没反叛，没贪墨，没误了军机，只是平日里桀骜些，不大听话罢了。于是上头给的口谕，只有轻飘飘一句：不合适。不合适三个字，说不清，道不明，却谁也反驳不得。被清的兵，卸了甲，缴了械，灰溜溜地离了营，连个说法也没处讨。旁人看了，心里都凉了半截：原来这军里，听话竟比能干还要紧。有那识趣的，从此把头低得更深。有人去问主事的官，官儿把眼睛一瞪，说道：不合适就是不合适，还要讲出个所以然不成？众人便不敢再问。那几支队伍的兵，收拾了铺盖，默默出了营门。"
 SUM_Neo_SGD.139.a:"把遗迹挖开"
 SUM_Neo_SGD.139.b:"把遗迹封回去"
 SUM_SGD_RC_Dig_More:"重开遗迹"
 SUM_SGD_RC_Dig_More_desc:"那些封了的遗迹，如今又要重新挖开。镐头下去，挖出的是铜器石块，还有一堆谁也说不清的物件。有那老成的，劝人手下留情，可上头催得紧，哪里肯听。这遗迹里究竟埋着什么，端的没几个人说得上来。"
 SUM_Neo_SGD.140.t:"重开遗迹"
 SUM_Neo_SGD.140.d:"新朝下令，把早年封了的遗迹，重新挖开。这一挖，挖出来的可不只是铜与石。铜器、石碑、断剑，一件件搬出来，摆满了院子；可夹在中间的，还有一堆谁也说不清的东西：说不清年份，说不清来历，说不清那上头的纹路，究竟是字还是画。请来识字的老者，围着看了半日，也只摇头。有人说是前朝的宝藏，有人说是神王的遗物，也有人悄悄说，那东西邪气重，不宜深究。新朝不管这些，只管挑能用的拿来用，用不上的，堆在库里积灰。那些说不清的东西，夜里竟隐隐发着光，守库的兵，谁也不肯独自靠近。有个胆大的后生捧着一件铜疙瘩问老匠人这是何物，老匠人摇摇头，说这东西怕不是人间的造物。众人听了，背上都有些发凉。"
 SUM_Neo_SGD.140.a:"重立赤王的旧制"
 SUM_Neo_SGD.140.b:"重建城邦的议会"
 SUM_SGD_RC_Great_Works:"兴土木"
 SUM_SGD_RC_Great_Works_desc:"旧王城边上，新起了一片宫室。那石料从何而来？全是拆了遗迹运来的。拆旧盖新，本是沙漠的老手艺。看那工地上，工匠们搬石垒墙，尘土飞扬。有那老匠人，边干边摇头，说这石头上有古字，只怕得罪了先人。"
 SUM_Neo_SGD.141.t:"兴土木"
 SUM_Neo_SGD.141.d:"新朝在旧王城的遗址旁边，起了一片新的宫室。那石料从何处来？竟是从远处的遗迹上，一块块拆来的。这拆旧盖新，原是沙漠的老手艺。沙漠里缺木少石，祖上便是这么办的：前朝的墙，拆了砌本朝的宫；古人的坟，平了盖今人的屋。匠人们干这活，熟练得很，凿子一挥，石缝便开。有那细心人，发现拆下的石料上，还留着旧日的刻纹，便悄悄拿去砌了新宫的墙根。新宫渐渐起了模样，巍巍峨峨，气派得很，只是那石缝里，仿佛还透着前朝的气息。老人们看着，感叹道：这沙漠的宫阙，是一本翻不完的旧账。有人看了觉得不是滋味，说这是拿祖宗的东西，给今人撑门面。也有人说，旧石头闲着也是闲着，拿来盖新宫，物尽其用，有何不可。"
 SUM_Neo_SGD.141.a:"召集能战之众"
 SUM_Neo_SGD.141.b:"召集能谋之士"
 SUM_SGD_RC_Relic_Armory:"遗物军械"
 SUM_SGD_RC_Relic_Armory_desc:"遗迹里挖出的机关与构装，都被拆开细细研究。能用的部件，便装进军里使。看那军械营中，奇形怪状的机括摆了一地，匠人们拆了又装，装了又拆。有那装成的，端的厉害，只是偶尔走火，吓得人一跳。"
 SUM_Neo_SGD.142.t:"遗物军械"
 SUM_Neo_SGD.142.d:"从遗迹里挖出来的机关与构装，新朝不把它们当古董供着，而是拆开了来研究。这一拆，端的拆出了名堂。那些个铜人、石兽、连弩，年深日久，早成了废铁，可匠人们拆开一看，里头的机括，精巧得让人咋舌。能用的，修修补补，便装到军里：那连弩改一改，成了军中的利器；那构装拼一拼，做了营里的守卫。匠人们围着这些物件，拆了装，装了拆，废寝忘食，连饭都忘了吃。有一件构装，拆到最后，里头竟滚出一把沙来，谁也说不清它在沙里埋了多少年。这改造过的家伙，用起来还真顺手，比旧的强出不少。军士们得了新家伙，眉开眼笑。有的老兵却摇头，说这来路不明的东西用着发毛。"
 SUM_Neo_SGD.142.a:"以神权号令沙漠"
 SUM_Neo_SGD.142.b:"以律法约束诸城"
 SUM_SGD_RC_Slab_Script:"释读石板"
 SUM_SGD_RC_Slab_Script_desc:"教令院召集识字的人，来释读那些石板。众人围着石板看了半日，读出来的字，东一个西一个，竟凑不成句。偏有几句凑出来的，读着倒像预言，叫人心里发毛，众人读了半日。"
 SUM_Neo_SGD.143.t:"释读石板"
 SUM_Neo_SGD.143.d:"新朝召集了一班识字的人，要他们释读遗迹里出土的石板。这桩差事，最是磨人。那些石板上的字，残缺不全，笔画古怪，众人围着瞪大了眼，认了半日，勉强认出几个。可把这几个字凑起来，怎么也凑不成一句囫囵话。有几个倒凑出了短句，偏偏那几句，读来都像预言，说什么沙上将起王城，说什么旧誓将要重光。识字的人面面相觑，不敢下笔：这要是预言，说对了还好，说错了，可是欺君的大罪。有人主张照实录下，有人主张付之一炬，免得惹祸。争来争去，最后只把那几句抄了，呈将上去。众人读了，心里都不踏实，不知道这预言是吉是凶。有个老者说道：古人的话，宁可信其有，不可信其无。也有人斥这是无稽之谈。"
 SUM_Neo_SGD.143.a:"把遗迹挖开"
 SUM_Neo_SGD.143.b:"把遗迹封回去"
 SUM_SGD_RC_Canal_King:"王渠"
 SUM_SGD_RC_Canal_King_desc:"沿着旧渠的走向，重开一条王渠。渠成之后，水一路流到中部荒原，那片荒了多年的地，竟也能住人了。看那渠水淌过，两岸百姓欢呼雀跃，有人当场便搭起草棚。有分教：一条王渠活一方，荒原从此有人烟。"
 SUM_Neo_SGD.144.t:"王渠"
 SUM_Neo_SGD.144.d:"新朝沿着旧渠的走向，重开一条王渠。这渠道年久失修，早被沙埋没了，如今照着旧迹，一寸一寸地挖通。渠工们顶着烈日，挖了又塌，塌了又挖，手上磨出了血泡，也没人叫苦。渠成那一日，清水顺着渠道，哗哗地流进中部的荒原。这水一到，荒原便活了。原先那是不毛之地，黄沙漫漫，鸟不拉屎；如今水一浇，草便绿了，草绿了，便能放牧，便能屯田，便有人家搬来住。不过几年光景，荒原上竟立起了村落，炊烟袅袅。有老农蹲在渠边，捧起一把水，叹道：沙漠的命，就在这水里。逃荒的人闻讯赶来，在渠边搭起窝棚，开荒种地。不过一年光景，荒原上竟有了人烟，炊烟袅袅，鸡犬相闻。有人指着渠水感慨：有水就有命。"
 SUM_Neo_SGD.144.a:"重立赤王的旧制"
 SUM_Neo_SGD.144.b:"重建城邦的议会"
 SUM_SGD_RC_Camel_Heavy:"重装驼骑"
 SUM_SGD_RC_Camel_Heavy_desc:"给驼骑加甲，走起来慢是慢了些，可冲阵时端的挡不住。看那披甲的骆驼，铁甲垂到腹下，走一步哗啦作响。有那起初嫌慢的，待到临阵，方知这甲救命，刀砍上去只留一道白痕。"
 SUM_Neo_SGD.145.t:"重装驼骑"
 SUM_Neo_SGD.145.d:"新朝给驼骑加甲。这驼骑本就笨重，如今再披上一层铁甲，走起来慢吞吞的，一步一晃，看着憨态可掬。有人笑它累赘，说这样的队伍，如何冲锋陷阵？可真到了阵上，众人便笑不出来了。那披甲的骆驼，冲起来竟像一堵墙，铁甲护着要害，弓箭射上去，叮当弹开，近身的刀砍上去，也只留一道白痕。敌阵的战马撞上这铁塔般的驼骑，登时人仰马翻。原来这慢，是为快蓄力；这重，是为冲时稳当。加甲的驼骑，一旦跑开了，便再也挡不住。有人讥笑说这是画蛇添足，好好的轻骑，弄成个笨重的壳子。可到了阵前，众人才晓得厉害：箭矢如雨射来，披甲的驼骑冲在头里，箭射在甲上，叮当乱响，竟穿不透。后来敌军见驼骑披甲而来，便退避三舍。"
 SUM_Neo_SGD.145.a:"召集能战之众"
 SUM_Neo_SGD.145.b:"召集能谋之士"
 SUM_SGD_RC_Sandstorm_Banner:"沙暴旗下的军团"
 SUM_SGD_RC_Sandstorm_Banner_desc:"选一批耐风沙的人，编成军团，专挑沙暴天出击。风卷黄沙，遮天蔽日，正是他们的城墙。敌人睁不开眼，他们却认得路，摸上去便是一阵砍杀。这等兵端的难缠，风越大，他们越精神。有分教：风是城墙，沙是刀兵。"
 SUM_Neo_SGD.146.t:"沙暴旗下的军团"
 SUM_Neo_SGD.146.d:"新朝选了一批耐风沙的人，单独编成一支军团。这些人，多是沙漠里长大的，风里来沙里去，练就了一身本事：风沙迷不了他们的眼，沙暴困不住他们的脚。这支军团打仗，专挑沙暴天出击。别人避风沙唯恐不及，他们却迎着风沙直上。为何？原来那漫天黄沙，便是他们最好的掩护。风声掩盖了马蹄，沙幕遮住了人影，敌军还没看清，他们已杀到眼前。风，是他们的城墙；沙，是他们的刀枪。有一回，敌军探子回报说风沙太大，什么也看不见，话音未落，这支军团已从沙里杀出。有人问他们何以如此，为首的说道：别人把风沙当祸害，咱把风沙当城墙；风一起，便是咱的屏障。这支军团每逢沙暴必出，屡战屡胜，敌军闻风丧胆。"
 SUM_Neo_SGD.146.a:"以神权号令沙漠"
 SUM_Neo_SGD.146.b:"以律法约束诸城"
 SUM_SGD_RC_Fort_Chain:"堡垒链"
 SUM_SGD_RC_Fort_Chain_desc:"沿边境修起一串堡垒，堡与堡之间，骑兵一日可达。这一串堡垒连起来，前线便成了一条线，再不是各处零散的据点。看那烽火台一座接一座，狼烟一起，半天之内便传遍全线。有分教：堡垒连珠，边境成线。"
 SUM_Neo_SGD.147.t:"堡垒链"
 SUM_Neo_SGD.147.d:"新朝沿着边境，修起一串堡垒。这堡垒一座挨着一座，鳞次栉比，远看像一串珠子。堡与堡之间，距离都算计好了，骑兵快马，一日之内便能从一个堡赶到另一个堡，传令、换防、递粮，都不误事。这一来，原本零零散散的前线，连成了一条线，牵一发而动全身。先前敌人来犯，这里打那里不知道，首尾不能相顾；如今一处告警，狼烟一起，沿着堡垒一线传开，援军很快便到。守边的兵，也踏实了许多，知道背后有靠。从前边境是散的点，此处有警，别处不知；如今堡垒连成一线，牒报一站传一站，快得像接力。敌人来犯，撞上这堡垒，便如撞在铁壁上，进不得，退不甘。守边兵士也胸有成竹，晓得背后有弟兄接应。"
 SUM_Neo_SGD.147.a:"把遗迹挖开"
 SUM_Neo_SGD.147.b:"把遗迹封回去"
 SUM_SGD_RC_Weapon_Works:"军械监"
 SUM_SGD_RC_Weapon_Works_desc:"设了一座军械监，专管造兵器。监里的匠人，脾气比官还横。你道为何？原来没有他们，军队便是一具空壳。有那不懂事的官，想克扣匠人工钱，被匠人当面顶了回去，也只得罢了。"
 SUM_Neo_SGD.148.t:"军械监"
 SUM_Neo_SGD.148.d:"新朝设了军械监，专管打造兵器。这衙门里的匠人，比那当官的还横。你道为何？只因没了他们，军队便是个空架子。刀枪剑戟，弓弩甲胄，样样都要经匠人之手；他们稍一撂挑子，前线便没了器械。所以那监里的官，见了匠人，也得赔三分笑脸，说话客客气气。匠人们便也知道自己的分量，走路都带着风。有一回，一个外行官儿想指挥内行，嫌匠人做的刀不好，要改样子，匠人把刀往案上一拍：你懂不懂？这刀是拿命试出来的！那官儿涨红了脸，也只得讪讪退下。上官却笑道：没有这帮匠人，军里就是空的，手里没家伙，拿什么打仗？于是上官时时登门请教，有好酒好肉先送过去。匠人们得了尊重，造出的兵器也格外精良。"
 SUM_Neo_SGD.148.a:"重立赤王的旧制"
 SUM_Neo_SGD.148.b:"重建城邦的议会"
 SUM_SGD_RC_War_Chest:"军费库"
 SUM_SGD_RC_War_Chest_desc:"单设一座军费库，钱只进不出。要动这笔钱，须三个人同时开口，少一个也不成。看那库门上锁三重，钥匙分三人掌着。有那想挪用的，凑不齐三人，只好干瞪眼。这规矩端的稳妥。有分教：钱进容易出钱难。"
 SUM_Neo_SGD.149.t:"军费库"
 SUM_Neo_SGD.149.d:"新朝单设了一座军费库，专门存放军费。这座库的规矩，最是古怪：钱只进不出。各处的税赋、商贾的捐输，源源不断往里送，可要往外拿一个铜板，却难如登天。动这笔钱，必须由三个人同时开口，缺一不可。这三个人，各管一把钥匙，谁也打不开那完整的库门。先前那弊端，银子进得快，出得也快，不知被谁中饱了私囊；如今三人互相盯着，谁也不许独自做主。有一回前线催粮催得急，请求拨银，三个人一时凑不齐，硬是拖了半月。虽有怨言，却也没人敢坏这规矩。有人想打这笔钱的主意，在三人里打通了两关节，结果第三个人不肯，到底没得逞。库门口还养着两条恶犬，闲人靠近不得，看库的兵丁日夜轮值，连只苍蝇也飞不进去。"
 SUM_Neo_SGD.149.a:"召集能战之众"
 SUM_Neo_SGD.149.b:"召集能谋之士"
 SUM_SGD_RC_Old_Order:"旧制照行"
 SUM_SGD_RC_Old_Order_desc:"城里有一班人，主张照旧例行事。该交的交，该办的办，只是账本换个封皮，旁的都不动。这样的人，城里端的很多。他们凑在一处，你一言我一语，都说祖宗的法子错不了。有分教：旧例照旧，只换新封皮。"
 SUM_Neo_SGD.150.t:"旧制照行"
 SUM_Neo_SGD.150.d:"新朝更张之际，有一班人，主张照旧例行事。这班人倒也不是存心作对，只求个安稳：该交的税，照旧交；该办的差，照旧办；上头换了名号，他们便把账本换个封皮，里头一笔一笔，还是老样子。这样的人，在城里着实不少。你若问他新朝有何好处，他也说不出；你若问他旧朝有何坏处，他也叹两声。只是日子怎么过，还怎么过，上任的来了，他照样赔笑，照样递上账本，照样把那套功夫使出来。有一回新官翻账本，发现封皮是新、内容是旧，气得拍案，可挑来挑去，也挑不出大错。茶楼酒肆里，一抓一大把。他们聚在一处便说：改来改去，还不是换汤不换药？与其折腾，不如安稳。新朝的官儿听了，也不与之争辩，只由着他们说去。"
 SUM_Neo_SGD.150.a:"以神权号令沙漠"
 SUM_Neo_SGD.150.b:"以律法约束诸城"
 SUM_SGD_RC_Tribute_Terms:"贡赋的新算法"
 SUM_SGD_RC_Tribute_Terms_desc:"与雨林重算贡赋。交还是交，只是数目少了三成，名目也换了。换名目不换里子，两边都下得来台。看那文书上一句句写得客气，其实骨子里还是那一套，两边使臣各让一步。"
 SUM_Neo_SGD.151.t:"贡赋的新算法"
 SUM_Neo_SGD.151.d:"新朝与雨林，重算起贡赋来。这一算，算得颇有讲究。该交的，还是交，一样不少；只是数目减了些，名目也换了。原先唤作岁贡，如今改称互市之利；原先是单方面进献，如今写成两边往来。名目一换，听着便顺耳多了。可明眼人都知道，换的是名目，不换的是里子：东西照旧要送，实惠照旧归了沙漠。雨林那边也乐得有个台阶，既然名头好听，便也点头画押，两边都下得来台。有那耿直的臣子想点破，被上官一个眼色止住，只得把话咽下。双方笑呵呵的，都道从此和气生财。雨林的使臣临走时，私下对沙漠的官儿说：名目虽改，心里都明白，往后还得靠这个过日子。官儿笑着点头，两人心照不宣。这一纸新约，两头都落了实惠。"
 SUM_Neo_SGD.151.a:"把遗迹挖开"
 SUM_Neo_SGD.151.b:"把遗迹封回去"
 SUM_SGD_RC_Border_Status:"边界的旧约"
 SUM_SGD_RC_Border_Status_desc:"边界一寸不动，只把守界的人换成了自己人。人一换，这界便换了主人。看那界碑还是那块界碑，守碑的却已是沙漠的兵。有那过往的商队，纳闷这关口怎么说变就变了。有分教：碑是不动碑，人是换新人。"
 SUM_Neo_SGD.152.t:"边界的旧约"
 SUM_Neo_SGD.152.d:"新朝与邻邦的边界，一寸也未动。奇妙的是，边界虽没动，主人却换了。怎么换的？原来只是把守界的人，换成了自己人。先前那界碑旁，驻的是别人的兵，挂的是别人的旗；如今兵撤了，换上沙漠的戍卒，旗也换了颜色。界碑还是那块界碑，刻字还是那些刻字，可守它的人一变，这边界便认了新主。有那周边的百姓，起初还照旧往界那边赶集，被新戍卒拦下，才知世道变了。守界的兵按令行事，只在自己这一侧收税放人。雨林的人起初不服，想来争辩，可人家笑说道：界没动，你还争什么？雨林的人一想，这话也在理，只得悻悻而归。守界的新兵站在碑边，把刀往地上一杵，望旧人远去。这一换，边境的规矩、口音、旗号，都跟着变了。"
 SUM_Neo_SGD.152.a:"重立赤王的旧制"
 SUM_Neo_SGD.152.b:"重建城邦的议会"
 SUM_SGD_RC_Keep_Officials:"留用旧吏"
 SUM_SGD_RC_Keep_Officials_desc:"官署里的旧吏，大多留用。会算账的人，到哪一朝都缺。留着他们，税才收得上来。看那些老吏，照样坐在案后拨算盘，一笔一笔，熟门熟路。新来的官反倒要向他们请教。"
 SUM_Neo_SGD.153.t:"留用旧吏"
 SUM_Neo_SGD.153.d:"新朝官署里，那班旧吏，大多留了下来。这倒不是新朝念旧，实在是用人之处。会算账的人，到哪一朝都缺。那账目往来的门道，税收厘金的规矩，他们闭着眼都能算清；新来的人，哪怕满腹经纶，面对一本乱账，也抓瞎。于是上头一纸令下，旧吏照旧留用，只是头顶换了新官。这班旧吏，也乖觉，见风使舵，把新官的脾气摸得门清，该递的账递上，该说的话说足。税赋便能源源收上来，不至于断了朝廷的嚼用。有人骂他们没骨气，他们只赔笑：提拔虽没有，饭碗却保住。果然，新官上任两眼一抹黑，全靠这些旧吏撑着。他们熟悉旧例，晓得哪一户有多少田，哪一条路收多少税。有个年轻官儿想露一手，结果把账算得一塌糊涂，还是求旧吏帮忙。"
 SUM_Neo_SGD.153.a:"召集能战之众"
 SUM_Neo_SGD.153.b:"召集能谋之士"
 SUM_SGD_RC_Quiet_Land:"守成之策"
 SUM_SGD_RC_Quiet_Land_desc:"不折腾，不扩张，把眼下的日子过稳。这条路听着不响亮，却最不容易翻车。有那好大喜功的，嫌这法子太闷，可真出了乱子，方知稳妥的可贵，百姓得以安心耕织。有分教：不求轰轰烈烈，但求岁岁平安。"
 SUM_Neo_SGD.154.t:"守成之策"
 SUM_Neo_SGD.154.d:"沙漠之内，还有一路主张，最是平淡：不折腾，不扩张，把眼下的日子过稳。这一路，听着最不响亮，没有开疆拓土的豪言，没有立王统的壮举，只求个安安稳稳。可偏偏是这条路，最不容易翻车。别人忙着修庙、整军、开遗迹，闹得沸沸扬扬，他们只守着自家的水井、田地、账本，该种地种地，该通商通商。风浪来了，船小好调头；别人摊子铺得大，一有风吹草动，便手忙脚乱。有那急性子嫌他们没出息，他们只淡淡回一句：日子是过给自己的，不是做给旁人看的。有人笑他们没出息，胸无大志。为首的却回答道：大志值几个钱？沙漠穷了几十年，百姓求的无非是口粮和水，安稳比什么都强。别处闹得天翻地覆时，这里的集照常开，井照常打。"
 SUM_Neo_SGD.154.a:"以神权号令沙漠"
 SUM_Neo_SGD.154.b:"以律法约束诸城"
 SUM_SGD_RC_Scarlet_Throne:"赤王王座重光"
 SUM_SGD_RC_Scarlet_Throne_desc:"旧王城遗址上，垒起一座高台。台下军士按号站定，台上的人受了冠。第一道令：沙漠所有路都设卡，所有城都设戍。沙漠从没有这样整齐，也从没有这样安静，台下众人俯首。"
 SUM_Neo_SGD.155.t:"赤王王座重光"
 SUM_Neo_SGD.155.d:"新王在旧王城的遗址上，垒起一座高台。这高台是拿拆来的旧石垒的，台下黑压压站满了军，一个个按着号令站好，鸦雀无声。新王一步步登上台，受了冠，冠压得他脊背笔直。他环视台下，缓缓开口，颁下第一道令：把沙漠所有的路都设上卡子，所有的城都设上戍所。令一下，台下齐声应诺，声浪滚过黄沙。这一日之后，沙漠从没有这样整齐过，也从没有这样安静过。路上有卡，城中有戍，人来人往，都按规矩走着，连讨价还价的声音都低了几分。有老者站在远处望着，喃喃道：这沙漠，真个是变了个模样。这整齐与安静里，不知是福是祸。受冠的人俯视台下黑压压的军阵，想起从前王城热闹的光景，如今却连一声咳嗽也听不见。"
 SUM_Neo_SGD.155.a:"把遗迹挖开"
 SUM_Neo_SGD.155.b:"把遗迹封回去"
 SUM_SGD_RC_Suzerain_Order:"沙海守成"
 SUM_SGD_RC_Suzerain_Order_desc:"沙漠与雨林重划了账：贡赋减三成，守界的换成自己人，旧吏一个没动。城门口那口钟照旧敲，只是敲钟的人换了衣裳。看那钟声依旧，城却是另一番光景了，换了主儿。有分教：钟是旧钟，人已非旧人。"
 SUM_Neo_SGD.156.t:"沙海守成"
 SUM_Neo_SGD.156.d:"沙漠与雨林，重新划定了两边的账。这一划，账面上清爽了许多：贡赋减了三成，边界的守军换成了自己人，城里的旧吏，却一个也没动。该减的减，该换的换，该留的留，样样都盘算得清楚。城门口那口老钟，照旧每日敲响，当当的声音，飘过城墙，百姓们听了多少年，早已习惯。只是这一回敲钟的人，换了衣裳：先前是雨林派来的差役，如今是沙漠自己的兵。钟还是那口钟，声还是那声响，敲钟的人一换，这城便改了称呼。有那早起赶集的，听得钟响，愣了一愣，才想起世道不同了。过往的行人挑着担子从钟下走过，听那钟声，浑然不觉这世间已经变了天。有明白人指着那敲钟人叹道：钟还是那口钟，声还是那声响，可敲钟的人，已不是从前的了。"
 SUM_Neo_SGD.156.a:"重立赤王的旧制"
 SUM_Neo_SGD.156.b:"重建城邦的议会"

 #### 开战须弥 · 雨林的门 ####
 SUM_SGD_WAR_The_March_on_Sumeru:"兵向雨林"
 SUM_SGD_WAR_The_March_on_Sumeru_desc:"独立只是第一步。沙漠的粮仓、商路与水，多半还捏在雨林手里。要真正说了算，就得把那道门敲开，把雨林从沙漠的账本上一笔划掉。这段账，沙漠人记了不止一年，旧恨难消。"
 SUM_Neo_SGD.157.t:"兵向雨林"
 SUM_Neo_SGD.157.d:"沙漠独立，只是第一步。这一步迈出去，看着有声有色，其实脚跟还没站稳。沙漠的粮仓、商路、水源，多半还捏在雨林的手里。粮仓在人家地界上，商路经人家关口，水源从人家山里流出来，一样一样，都是命脉。要真正说了算，就得把那道门敲开，把雨林从沙漠的账本上，一笔一笔划掉。有识之士看得透彻，屡次上言：今日的独立，是虚的，人家卡住粮水，不出三月，便见分晓。主事的却按下不表，只说时机未到。于是沙漠一边称庆，一边暗暗积粮练兵，等待来日。主张这话的人，在议事厅里把地图一摊，指着那几处粮仓和水源说道：这些不在咱们手里，独立就是空的；人家一掐脖子，咱们就得断粮断水。众人听了，脸上都变了色。"
 SUM_Neo_SGD.157.a:"以动员令起兵"
 SUM_Neo_SGD.157.b:"以盟约召集部族"
 SUM_SGD_WAR_Mobilize:"全面动员"
 SUM_SGD_WAR_Mobilize_desc:"动员令传遍各城各族，市集上的男人走了一半，剩下的多半是老人和孩子。看那街头，昨日还吆喝的汉子，今日便背上了刀。妇人拉着孩子的手，立在路边相送，送者泪下。有分教：一声令下，半城男儿。"
 SUM_Neo_SGD.158.t:"全面动员"
 SUM_Neo_SGD.158.d:"动员令传遍了沙漠各城各族。那令一到，便如平地起雷。各处的市集上，本来熙熙攘攘，做买卖的、耍手艺的、闲逛的，挤成一团。令一下，青壮男子便丢了摊子、撂了活计，回去收拾行装，应征去了。不过几日，市集上便冷清了大半：走了一半的男人，剩下的，多半是白发苍苍的老人，和扯着衣角乱跑的孩子。有那卖水的老汉，守着空摊子发呆；有那妇人，抱着孩子站在路口，望着队伍远去的方向，久久不归。茶馆里，说书的醒木一拍，讲的正是从军的故事。那令箭快马加鞭，一城传一城，一族传一族。市集上的人听了，汹汹议论，转眼间，男人便走了一半，都扛着刀枪投军去了。老汉蹲在墙根发呆，妇人抱着孩子在门口抹眼泪。"
 SUM_Neo_SGD.158.a:"直取雨林关隘"
 SUM_Neo_SGD.158.b:"先断其商路"
 SUM_SGD_WAR_War_Tax:"开征军费"
 SUM_SGD_WAR_War_Tax_desc:"添一笔军费，商人出大头，农人出小头，谁也得交。交钱的人嘴里说着，等打赢了再说。看那税吏挨家挨户催缴，商人肉疼，农人叹气，交钱的嘴上答应心里叫苦，苦了众人。有分教：打仗先要钱，钱从众人来。"
 SUM_Neo_SGD.159.t:"开征军费"
 SUM_Neo_SGD.159.d:"新朝要添一笔军费。这钱从何而来？摊派下去：商人出大头，农人出小头，谁也得交，一个也逃不脱。那商人，家底厚，自然是大头，心疼得直抽抽；那农人，本就薄田几亩，出的虽是小头，却也是血汗钱。交钱的人，嘴里都念叨着同一句：等打赢了再说。这话里，有几分盼头，也有几分无奈。有那精明的商人，一边交钱，一边盘算日后能不能把这笔钱，从关税里捞回来；有那老实的农人，把铜板一个个数出来，叹口气交上去。收钱的官，记下账，开给票据，许诺战后加倍偿还。收税的人挨家挨户地催，算盘打得噼里啪啦响。有一户老农，把最后一口粮袋交出去，望着空空的粮囤直发愣。交钱的人都说：这钱值不值，且等打赢了再论。"
 SUM_Neo_SGD.159.a:"把话说给雨林人听"
 SUM_Neo_SGD.159.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Ration:"配给"
 SUM_SGD_WAR_Ration_desc:"粮与盐按口配给，先紧着前线和做工的人。配给的规矩，一张张贴在各城墙上。看那墙下，百姓仰头看着，有的点头，有的皱眉。那告示下头，还画了一个装粮的袋，省着些用。有分教：口粮有数，先军后民。"
 SUM_Neo_SGD.160.t:"配给"
 SUM_Neo_SGD.160.d:"新朝把粮与盐，按人口配给。这配给的规矩，贴在各城的墙上，写得明白：每人每日几合粮、几钱盐，一丝不苟。先紧着谁？先紧着前线和做工的人。当兵的扛枪卖命，做工的出力气修渠造械，他们吃得饱，才有力气办事；剩下的，才轮到寻常百姓。于是城里处处可见，人们揣着票据，排队领粮，队伍弯弯曲曲，排出老远。有那领到粮的，千恩万谢；有那排在后头、担心领不到的，踮脚张望。墙上的规矩，谁都看得见，可看得见归看得见，能不能真按规矩办，还得看那管粮的官，公道不公道。百姓们排着长队，拿着凭证，一勺一勺地领。有那眼馋的，想多领一点，被管事的一顿训斥，只得缩回手。盐是稀罕物，领到手里，个个都宝贝似的揣进怀里。"
 SUM_Neo_SGD.160.a:"倾全境之力"
 SUM_Neo_SGD.160.b:"留一支后手"
 SUM_SGD_WAR_War_Council:"军议"
 SUM_SGD_WAR_War_Council_desc:"军议定下三路进兵：一路走商道，一路走沙脊，一路沿渠。三路人马各领口令，约好在何处会合。看那沙盘上，三支令旗分插三处。帐前诸将，各自记住了自己的口令，口令记牢。"
 SUM_Neo_SGD.161.t:"军议"
 SUM_Neo_SGD.161.d:"军议已定，三路进兵。这三路人马，各有各的走法。一路走商道，那是熟路，商队常年往来，水草、关卡都清楚，走起来稳当，只是敌人也料得到；一路走沙脊，那是险路，沙梁起伏，荒无人烟，寻常人不敢走，恰好出敌不意；一路沿渠，那是水路，跟着王渠的走向，水源不缺，只是路途绕远。三路分头，约期会师。主帅在帐中，对着地图，指了三处，叮咛再三：哪一路遇敌，哪一路策应，都写得清清楚楚。诸将领令，各自点兵，火速备办。主帅在沙盘上拿小旗一插，说道：三路如同三根手指，捏起来才成拳头；任何一路受挫，另两路都要照应。众将齐声答应。当下点齐兵马，各按路线开拔，旌旗蔽日，直向雨林而去。"
 SUM_Neo_SGD.161.a:"以动员令起兵"
 SUM_Neo_SGD.161.b:"以盟约召集部族"
 SUM_SGD_WAR_Proclaim:"讨雨林檄文"
 SUM_SGD_WAR_Proclaim_desc:"檄文写得平实，说的是欠税、占水、扣粮三件事。一件一件，都有账可查。看那檄文贴在城门，识字的高声念给众人听，听到恼处，人人切齿，听得众人个个摩拳擦掌，掷地有声。有分教：师出有名，账上有据。"
 SUM_Neo_SGD.162.t:"讨雨林檄文"
 SUM_Neo_SGD.162.d:"新朝出师，先发了一篇檄文。这檄文写得平实，没有那些个骈四俪六的花哨话，只老老实实数了三件事：一是欠税，多少银子，哪年欠的；二是占水，哪处水源，被谁占了；三是扣粮，多少车粮，卡在何地。一件一件，都账目清楚，有据可查。打仗要有个名头，名头正，师才出得有理。这篇檄文，不去漫骂，只摆账本，倒叫人无从反驳。有人读了，点头道：这话在理。也有那对面的，读了脸上一阵红一阵白，却找不出话来回。檄文传到各处，传抄的、附抄的，落满了市井。主帅说道：咱们出兵，不为一时的意气，只为这三笔旧账；师出有名，才教人心服。檄文传到各处，沙漠人看了，都道有理，士气为之一振。"
 SUM_Neo_SGD.162.a:"直取雨林关隘"
 SUM_Neo_SGD.162.b:"先断其商路"
 SUM_SGD_WAR_Sandstorm_March:"借风而进"
 SUM_SGD_WAR_Sandstorm_March_desc:"大军专等一场沙暴才上路。风把人遮住，也把脚印遮住。看那黄沙漫天，人马借着风声掩护，悄悄向前推进。敌人哨探望见，只当是寻常风沙。这边厢里，风声正好掩住了马蹄。"
 SUM_Neo_SGD.163.t:"借风而进"
 SUM_Neo_SGD.163.d:"大军按兵不动，单等一场沙暴。这等风，端的等得辛苦。连着几日，晴空万里，滴沙不扬，将士们急得团团转。终于有一日，天边黄云翻卷，狂风大作，沙暴来了。主帅一声令下，大军顶风上路。那风沙，端的厉害：风把人遮住，十步之外看不清脸；沙把脚印遮住，前面走过的路，转眼便平了。既有这等掩护，行军便安稳许多，敌人纵有探子，也寻不见踪迹。将士们裹着沙，弯着腰，一步一步往前挪，风声里只听得见粗重的喘息。主帅传下令来：风不起，不许上路。众人起初不解，主帅说道：沙漠作战，最怕暴露行踪；等一场沙暴，风把人遮住，也把脚印遮住，敌军探子便无从察觉。众人恍然大悟。数日后狂风大作，天地变色，大军悄然开拔。"
 SUM_Neo_SGD.163.a:"把话说给雨林人听"
 SUM_Neo_SGD.163.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Night_Ride:"夜行"
 SUM_SGD_WAR_Night_Ride_desc:"白天歇息，夜里赶路，靠的是星星和旧道。领路的人走在最前头，一步也不错。看那夜色沉沉，队列无声，只听得驼铃轻响。便是遇上巡骑，也难寻他们的踪迹，一路悄然无话。有分教：星斗为灯，旧道为图。"
 SUM_Neo_SGD.164.t:"夜行"
 SUM_Neo_SGD.164.d:"大军行事，一改常态：白天歇着，夜里赶路。这夜行军，靠的是天上的星星，和脚下的旧道。星斗指方向，旧道认路程，两者缺一不可。领路的人，走在最前头，原是本地的老向导，闭着眼都能说出哪里有坑、哪里有井。他一步不错，后面的人便跟着一步不错。夜里风凉，沙也静了，队伍无声无息地穿行，只有偶尔的马蹄声，被夜色吞没。有一回，天上云厚，星斗全遮了，向导便停下来，蹲下身，摸一摸脚下的沙，辨一辨风向，半晌，才又起身，指着前方继续走。将士们暗暗佩服。沙漠的夜凉如水，正好行军。他们不靠灯火，只靠星星和旧道辨认方向。那向导是本地老手，闭着眼都能说出哪里有水井。东方发白时，大军已逼近敌境。"
 SUM_Neo_SGD.164.a:"倾全境之力"
 SUM_Neo_SGD.164.b:"留一支后手"
 SUM_SGD_WAR_Camel_Column:"驼队辎重"
 SUM_SGD_WAR_Camel_Column_desc:"辎重用驼不用车。驼能喝十天的干，车走三天的沙。看那一队队骆驼，驮着粮草缓慢前行，仿佛一座座移动的小山。看那队尾的驼铃，走起来一串接一串，响个不停，铃声响。有分教：驼行十日，车止三日。"
 SUM_Neo_SGD.165.t:"驼队辎重"
 SUM_Neo_SGD.165.d:"沙漠里行军，头一桩难事不是厮杀，是运粮。那辎重队里有用车的，也有用驼的，两下里一比，高下立见。大车装得虽多，一陷进软沙便动弹不得，推车的兵卒吆喝了半日，车轮越陷越深，走上三天就得停下来歇脚。骆驼却大不相同，它蹄下生着肉垫，踏沙如踏平地，背上驮了粮袋水囊，一连十日不沾水也照样迈步。有个老驼工拍着驼脖子对众军道，这畜生肚里存着十天的干粮，那大车只走三天的沙路，你道该用哪一个。众人听了，都道老驼工说得有理。当下三军立下规矩，辎重尽数改用骆驼，把那些笨重的大车弃在营边，劈了当柴烧。那老驼工又叮嘱，驼队行沙最忌贪快，歇脚时先卸了驮，让驼儿打几个滚，饮饱了水再上路，方不伤了元气。"
 SUM_Neo_SGD.165.a:"以动员令起兵"
 SUM_Neo_SGD.165.b:"以盟约召集部族"
 SUM_SGD_WAR_Oasis_Hop:"绿洲跳进"
 SUM_SGD_WAR_Oasis_Hop_desc:"沿着绿洲一座座地跳。每跳一步，补给就近一分，雨林的地图便少一块。看那队伍从这片绿洲到那片绿洲，走走停停，稳扎稳打。每一处泉边，都留着接应的专人，泉边早有接应。"
 SUM_Neo_SGD.166.t:"绿洲跳进"
 SUM_Neo_SGD.166.d:"沙漠进军，最忌一口气深入。有个久走沙路的老向导献计，说不妨沿着绿洲一座一座地跳着走。怎的叫做跳？便是占了一处绿洲，便把营盘往前挪一程，再占下一处，如此节节推进。每往前跳上一步，后方的粮草水源便近了一分，前头的补给也就跟上一分，而雨林那边的地图，便要少上一块。这法子看着慢，其实稳当。众军依计而行，今日拔营奔这眼泉，明日又向那片棕榈林开去。每占一处，便掘井、筑垒、屯粮，把那绿洲变作自己的落脚处。雨林测绘队辛苦画了多年的边图，被这一跳一跳蚕食得七零八落。一路行来，那些绿洲有的还住着人家，有的只剩几株枯棕榈，掌事的都叫扎下营来，掘井的掘井，垒墙的垒墙，绝不空过一处。"
 SUM_Neo_SGD.166.a:"直取雨林关隘"
 SUM_Neo_SGD.166.b:"先断其商路"
 SUM_SGD_WAR_Guide_Sand:"识途的向导"
 SUM_SGD_WAR_Guide_Sand_desc:"向导认得连雨林测绘队都没画出来的路。这条路，是几百年前逃荒的人踩出来的。看那向导骑在驼上，指指点点，哪处有沙坑，哪处能取水，了如指掌，向导了如指掌。有分教：逃荒旧径，今日成了进军路。"
 SUM_Neo_SGD.167.t:"识途的向导"
 SUM_Neo_SGD.167.d:"三军要穿一片大沙海，随军的向导却拍着胸口说，这条路他认得。众人奇道，雨林的测绘队连年在此画图，尚且有许多地方不曾标出，你一个向导如何认得？那向导笑而不答，只叫众人跟他走。原来这条小道，并非什么官修驿路，而是几百年前逃荒的百姓，为着活命，指引着骆驼队一处水源一处水源地踩踏出来的。那些逃荒的人早已作古，可他们踩出的足迹，被风沙掩了又露，露了又掩，竟留下一条隐蔽的通路。这向导的祖上，正是当年逃荒人中的一员，这认路的本事，便是一代一代口传下来的。众人顺着这路走，果然处处有泉，门禁也松。这向导还说，当年逃荒人怕迷路，每隔一段便在沙里埋一只空水囊作记，那些水囊至今还埋着，他认得每一处。"
 SUM_Neo_SGD.167.a:"把话说给雨林人听"
 SUM_Neo_SGD.167.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Storm_Pass:"强攻关隘"
 SUM_SGD_WAR_Storm_Pass_desc:"关隘立在雨林边上，是雨林伸进沙漠的一只手。这只手，得先砍断。看那关隘高耸，墙厚壕深，端的难攻。众军议定，先拿它开刀。那关里的守军，也知这一日难过，守军日夜提防。"
 SUM_Neo_SGD.168.t:"强攻关隘"
 SUM_Neo_SGD.168.d:"沙漠与雨林交界之处，立着一座雄关。这关隘不偏不倚，正卡在沙漠的边上，打个比方，它就好比是雨林伸出的一只手，牢牢攥住了沙漠的咽喉。这只手一日不砍断，沙漠的驼队便一日不得安心往来。当下军中议定，要打通东西，先得拔掉这颗钉子。众将纷纷献策，有的说绕道，有的说求和，独有一位年老的车骑都尉冷笑说，绕道绕得了一时，绕不了一世，求和更是与虎谋皮，不如硬硬砍断这只伸进来的手。众人听了，都觉有理。于是点了精兵，备了器械，专奔这座关隘而来。原来过了此关，往东便是平坦的河渠与平原，粮草人马都能畅通，若不先取，后面寸步难行。"
 SUM_Neo_SGD.168.a:"倾全境之力"
 SUM_Neo_SGD.168.b:"留一支后手"
 SUM_SGD_WAR_Siege_Engine:"造攻城之器"
 SUM_SGD_WAR_Siege_Engine_desc:"照遗迹里的图样，造了几架抛石机与撞锤。家伙笨重，可关隘不怕云梯，偏怕这等重器。看那抛石机一声响，巨石飞过墙头，砸得守军抱头，墙头的守军抱头鼠窜，重器显威。有分教：笨物虽钝，专破坚城。"
 SUM_Neo_SGD.169.t:"造攻城之器"
 SUM_Neo_SGD.169.d:"军中要攻关，却缺攻城的器械。正没奈何，忽有一名士兵从一处古代遗迹里，寻出一卷残破的图样，上面画的竟是抛石机与撞锤的样式。众匠人围拢来看，依样画葫芦，连夜赶造了几架。这器械造出来，果然笨重非常，一架抛石机要十来个人才推得动，撞锤更是沉如小山，行军时慢吞吞落在后头，有人见了直摇头，说这等笨物，怕不顶用。谁知攻坚那日，雨林守军自恃关高墙厚，只防着云梯爬城，哪里防得到抛石机从远处飞来巨石，又哪里防得到撞锤一下一下砸那城门。笨重虽笨重，偏偏这关隘不怕云梯，却怕这笨家伙。当下匠人们又赶造了许多，长枪大戟般堆在营中，专等着攻城那日用它。有那识货的老卒见了，抚着那撞锤连声说好。"
 SUM_Neo_SGD.169.a:"以动员令起兵"
 SUM_Neo_SGD.169.b:"以盟约召集部族"
 SUM_SGD_WAR_Cut_Water:"断渠"
 SUM_SGD_WAR_Cut_Water_desc:"把关隘上游的渠掘断。守军有水却汲不上来，撑不了多久。看那渠水断流，只剩一片干河床。守军在城头望水兴叹，军心便乱了。渠底露出的淤泥，晒得裂成了块，军心由此乱了。"
 SUM_Neo_SGD.170.t:"断渠"
 SUM_Neo_SGD.170.d:"那座关隘依山傍水，关旁有一条渠，从上游引水下来，供给关内守军饮用。军中有个懂水利的谋士，看了一眼便道，攻关不必硬冲，只消掘断上游那条渠便好。众人半信半疑，依计派人趁着夜色，摸到上游，挥锹挖断了渠堤。那一夜之间，渠水尽数散入沙地，关内守军起初还不觉得，到了次日，取水的地方滴水下不来，这才慌了神。沙漠里头，人可以粮草将就，却没有水能撑长久的。守军纵然仓里还有存水，可眼睁睁望着断了流的干渠，心里先就乱了，想着这城迟早守不住，撑不了多久，军心便散了大半。谋士又道，掘渠之后，再在上游堆起沙坝，万一守军想挖开故道，也教他白费力气。众人依言，一夜之间把那渠改得面目全非。"
 SUM_Neo_SGD.170.a:"直取雨林关隘"
 SUM_Neo_SGD.170.b:"先断其商路"
 SUM_SGD_WAR_Ladder_Night:"夜袭关墙"
 SUM_SGD_WAR_Ladder_Night_desc:"选最灵便的人攀墙。攀上去的，活着的不到一半，墙上的灯火却在那一夜灭了。看那云梯一架接一架靠上城墙，喊杀声震天。天亮时，城头已换了守旗的人，城头易旗。有分教：血流墙下，换来一夜灯灭。"
 SUM_Neo_SGD.171.t:"夜袭关墙"
 SUM_Neo_SGD.171.d:"攻关那夜，军中挑了最灵便的一队人，个个身轻如燕，专管攀墙。这些人身系绳索，趁着黑影，一个接一个往那高墙上爬。墙头灯火通明，守军弓矢齐发，爬上去的人纷纷中箭坠落，摔在墙根，这就叫攀上去的，活着的不到一半。到此且莫心软，这世上攻城略地，原是拿人命去填的。可那剩下的一半，到底爬上了墙头，他们不声不响，摸到点灯之处，一刀结果了守灯军士，把那墙上的灯火一盏一盏扑灭。那一夜，关墙上原本照得如同白昼的灯火，竟尽数熄了。灯一灭，黑影里便再分不清敌我，城门也趁乱被撬开。那些攀上墙的健卒，又摸到箭囊滚木，尽数推下墙去，墙上顿时乱作一团，守军的号令也喊不出来了。"
 SUM_Neo_SGD.171.a:"把话说给雨林人听"
 SUM_Neo_SGD.171.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Occupy_Pass:"据关而守"
 SUM_SGD_WAR_Occupy_Pass_desc:"关隘易手之后，并不推倒，改成了自己的戍所。门朝哪边开，从此由沙漠说了算。看那城头换上了沙漠的旗，守卒来往巡查。过往商队见了新旗，赶紧改口称颂，商队改口。"
 SUM_Neo_SGD.172.t:"据关而守"
 SUM_Neo_SGD.172.d:"那关隘易了手，沙漠的兵占了城头。有将吏来报，说这关墙又高又厚，留着也是祸患，不如一把火烧了、推倒了干净，免得日后雨林再来争夺。主将却摇头，说道慢着，这关隘推倒了可惜。原来这关隘地势极好，正扼住东西咽喉，若把它拆了，不过是块荒土，倒不如留下来，改成咱们自己的戍所。于是发号施令，把关内的旗帜换了，把守门的兵卒换了，连那城门朝哪边开，也重新定了规矩。有老人叹道，当年这关是雨林伸手进来的一只手，如今这只手，被沙漠剁下来，接到了自己身上。门朝哪边开，端的由沙漠说了算。又遣人往关内张贴告示，晓谕百姓，说沙漠入境，秋毫无犯，各安生业者一律免粮一年。那些百姓见了告示，也就安下心来。"
 SUM_Neo_SGD.172.a:"倾全境之力"
 SUM_Neo_SGD.172.b:"留一支后手"
 SUM_SGD_WAR_Sand_Mission:"策反沙漠驻军"
 SUM_SGD_WAR_Sand_Mission_desc:"雨林在沙漠的驻军，大半是本地人。派去的人只问一句：你是替谁当兵？这一问，许多人便低下了头。看那说客轻言细语，听的人却心思浮动，这一问问到了软肋，攻心为上。有分教：一句话，问得人心摇。"
 SUM_Neo_SGD.173.t:"策反沙漠驻军"
 SUM_Neo_SGD.173.d:"雨林在沙漠地面驻着兵马，可这些驻军里头，大半竟是本地人。沙漠这边派了能言善辩的人，扮作行商，混进营去，也不带刀枪，见了个兵卒，只问一句：你是替谁当兵？这一句话，问得许多人张口结舌。这些本地人，祖上就住在沙漠，吃的沙里的粮，喝的沙里的水，如今却穿着雨林的号衣，替雨林守着沙漠的关隘，说到底，是替外人看自家的门。这一问，便像一根针，扎在心上。起初还有人嘴硬，说当兵吃粮，天经地义，问到后来，好些人便低下头去，暗暗思量起自己究竟是替谁卖命。军中议论纷纷，人心也就散了。那辩士又问，你们替雨林守关，一月能得几文摩拉？众人掰着指头一算，竟比沙漠给出的少了许多，心里越发不是滋味。"
 SUM_Neo_SGD.173.a:"以动员令起兵"
 SUM_Neo_SGD.173.b:"以盟约召集部族"
 SUM_SGD_WAR_Rain_People:"联络雨林村社"
 SUM_SGD_WAR_Rain_People_desc:"雨林的村社也在交重税，也在被征兵。派去的人不带兵器，只带账本给对面看。看那账本上一笔笔，处处与沙漠一般苦。对面的人看了，沉默半晌，对面的人默然良久。"
 SUM_Neo_SGD.174.t:"联络雨林村社"
 SUM_Neo_SGD.174.d:"沙漠这边又派出一干人，前往雨林的村社游说。这一回，众人备了刀枪，独独领头的那人却摆手，说此番不带兵器，只带账本。众人不解，那人便将账本摊开，指给对面村社的头人看。原来上面一笔一笔，记的都是雨林村社交的重税，还有被征去的丁壮名册。那头人起初还强辩，说雨林治下安居乐业，哪有这等事。领头的人也不争辩，只把账本往前一递，说你自己看，这税一年重过一年，这丁一户抽过一户，你村里的后生，如今还剩几个？那头人翻着账本，脸色一阵红一阵白，半晌说不出话来。原来雨林的村社，也在受着同样的苦。领头的又道，沙漠与你们一样，都是被雨林盘剥的苦人，何苦替人数钱卖命。众人听了，连连点头，都觉说到心坎上。"
 SUM_Neo_SGD.174.a:"直取雨林关隘"
 SUM_Neo_SGD.174.b:"先断其商路"
 SUM_SGD_WAR_Promise_Amnesty:"宽赦令"
 SUM_SGD_WAR_Promise_Amnesty_desc:"凡归降者，不问旧事。愿意留下的分地，愿意走的给粮。这一条，比刀好用。看那归降的人拖家带口而来，放下兵刃，领了田契，欢天喜地，放下兵刃便领了田契欢天喜地。有分教：一刀不如一诺，降者如归。"
 SUM_Neo_SGD.175.t:"宽赦令"
 SUM_Neo_SGD.175.d:"沙漠这边定了个规矩，端的厉害。凡有雨林那边过来归降的，一概不问旧事，不计前嫌。你从前替雨林打过仗、守过关，都不追究，只问你如今愿不愿意留下。愿意留下的，便分给田地，让他安稳耕种；愿意走的，便发给你口粮，任你投奔何处，绝不刁难。有那久在军中、杀过人的将校，本以为投降之后必被问罪，吓得夜夜睡不着，谁知过来之后，主将连一句重话都没有，倒赏了一块好地。这些人感激涕零，逢人便说沙漠的好处。这一条安民的规矩，比那明晃晃的刀还要好用，许多城池，不战而降。这一条传开之后，远近归降的络绎不绝，有那拖家带口来的，主将都叫地方官妥为安置，连住处口粮都预备得停停当当。"
 SUM_Neo_SGD.175.a:"把话说给雨林人听"
 SUM_Neo_SGD.175.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Bribe_Clerk:"收买书吏"
 SUM_SGD_WAR_Bribe_Clerk_desc:"雨林的关卡靠书吏记档，书吏认得每一个来往的人。钱递过去，档便换了一份。看那书吏收了钱，笔尖一转，名字就挪了行。那书吏接过钱，手抖了一下，随即便揣进袖里，换档。"
 SUM_Neo_SGD.176.t:"收买书吏"
 SUM_Neo_SGD.176.d:"雨林的关卡，防守严密，端的靠着一桩事，便是书吏记档。那书吏手执笔墨，坐在关棚底下，但凡来往行人，姓甚名谁、从何处来、往何处去，都要一一登记在册。这书吏认得每一个过往之人，谁的脸上有什么记认，谁说话什么口音，他都记在心里，想要蒙混过关，难如登天。可世上没有打不通的关节。沙漠这边的人，摸清了门道，趁着夜深，把一封银钱悄悄递到书吏手里。那书吏先是一怔，继而眯眼一笑，提笔重新写就一份档册，把要紧的名目尽数改了。一份假档，换得一行人安然过关。不过一封银钱，便换来一队人马平安过关，省了多少厮杀。那书吏收了银子，照旧坐在关棚底下，面上半点异样也无。"
 SUM_Neo_SGD.176.a:"倾全境之力"
 SUM_Neo_SGD.176.b:"留一支后手"
 SUM_SGD_WAR_Whisper_Back:"反间"
 SUM_SGD_WAR_Whisper_Back_desc:"把假消息透给雨林的斥候，让他们把话说给自己人听。兵不血刃的事，多半靠这个。看那斥候得了假信，如获至宝，飞奔回去禀报。这般借刀杀人的手法，端的阴狠，这一计毒。有分教：借敌之口，乱敌之心。"
 SUM_Neo_SGD.177.t:"反间"
 SUM_Neo_SGD.177.d:"两军对垒，刀兵相见固然是战，可还有一样不流血的手段，更高明些。沙漠这边捉了雨林的一个斥候，却不杀他，反好好款待，酒肉管够，临了还故意让几句话钻进他耳朵里。说的什么？无非是某某处粮草将尽、某某将领要临阵倒戈之类的假消息。这斥候得了信，如获至宝，连夜赶回，把这话一五一十说给自己人听。这话是从自家斥候嘴里说出来的，雨林那边如何不信？于是那边将信将疑，调度迟疑，白白错失了战机。这便是兵不血刃的手段，不费一兵一卒，只靠一张嘴、一条计，便能叫敌人自乱阵脚。古往今来，这样的事，多半靠的就是这个。那斥候回报之后，雨林的将官果然中计，把兵马调离了要道，待到察觉不对，关卡早已换了旗号，这才追悔莫及。"
 SUM_Neo_SGD.177.a:"以动员令起兵"
 SUM_Neo_SGD.177.b:"以盟约召集部族"
 SUM_SGD_WAR_Supply_Chain:"辎重线"
 SUM_SGD_WAR_Supply_Chain_desc:"辎重线沿商路铺开，一站接一站。前线吃什么，看后面这条线顺不顺。看那粮车一辆接一辆，昼夜兼程。看那押粮的兵，来回奔走不敢停歇，哪一环断了，前线便要饿肚子，粮道要紧。有分教：兵马未动，粮草先行。"
 SUM_Neo_SGD.178.t:"辎重线"
 SUM_Neo_SGD.178.d:"大军在前厮杀，后面这条辎重线，才是命脉。沙漠这边把补给线沿着古老的商路一站一站铺开，每一站都设有粮仓、水窖，囤着足够的粮草。这商路原本就是驼队走惯了的，有水井、有驿站、有歇脚的地方，如今拿来运军需，正好省了许多力气。从前一站到下一站，要走好几日，如今每隔一段便设一处中转，兵卒接力转运，粮草便源源不断往前推。前线的将士每日吃些什么，穿些什么，全看着后面这条线顺不顺。这条线若是断了，前线纵有猛将，也要饿肚子。所以主将再三叮嘱，护粮的兵比冲锋的兵还要紧。掌事的还定下章程，每一站都留足三日的存粮，遇了沙暴阻隔，前线也不至于断炊。那些押运的兵卒，日夜在商路上来往不绝。"
 SUM_Neo_SGD.178.a:"直取雨林关隘"
 SUM_Neo_SGD.178.b:"先断其商路"
 SUM_SGD_WAR_Water_Wagons:"运水车队"
 SUM_SGD_WAR_Water_Wagons_desc:"沙漠作战，水比粮要紧。运水的车队昼夜不停，车夫换人不换车。看那一辆辆水车，在沙道上吱呀前行，革囊里的水一路晃荡。车夫们眼睛熬得通红，也舍不得停，车夫熬红了眼。"
 SUM_Neo_SGD.179.t:"运水车队"
 SUM_Neo_SGD.179.d:"沙漠里打仗，有一桩与别处不同的道理，便是水比粮还要紧。人在沙海里行走，渴上三日便要倒下，饿上几日倒还熬得住。是以沙漠这边，运水的车队昼夜不停，白天怕日头晒，便趁着夜里赶路，一轮月亮底下，只见一串水车，吱吱呀呀往前挪。那拉车的牲口经不得这般折腾，跑久了就要趴下，于是押运的官儿定了个法子，车夫可以轮换，歇一歇再来，可这运水的车却半刻不停，人歇车不歇。就这么着，一车一车的水，从后方的绿洲源源送到前线。有了水，这沙漠里的军队，才站得住脚跟。那水车上的皮囊，都是用生牛皮缝就的，滴漏不漏，太阳也晒不透。押运的兵卒还定时给皮囊浇水，怕它干裂，端的伺候得周到。"
 SUM_Neo_SGD.179.a:"把话说给雨林人听"
 SUM_Neo_SGD.179.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Field_Hospital:"战地医帐"
 SUM_SGD_WAR_Field_Hospital_desc:"医帐随军而走。能就地治的就地治，治不了的往后送。能救回来的，比往年多了。看那医者昼夜忙着包扎，草药的苦味弥漫帐中。伤兵们咬着布条，任凭医者处置，一声不吭。有分教：妙手回春，军心亦安。"
 SUM_Neo_SGD.180.t:"战地医帐"
 SUM_Neo_SGD.180.d:"两军交战，刀剑无眼，难免有伤残。沙漠这边打算得周全，把医帐随着大军一路走，郎中、药材、担架，样样齐备。凡有受伤的兵卒，能就地医治的，便在帐中敷药包扎，尽快治好，好重回行伍；伤势太重、行动不便的，便用担架、驼车往后送，送到后方的大营里慢慢将养。往年打仗，许多伤卒就因为无人照管，倒在沙里再也没能起来，如今有了这随军的医帐，能救回来的，比往年多出许多。军中的人见主将如此体恤，都道跟着这样的主帅，便是死也值当，打起仗来格外奋勇。军中又立下条规，凡抬入医帐的伤卒，不论官职高低，一律按伤势轻重医治，先治重伤，后治轻伤，谁也不能插队。众军见了，都道这主帅公道。"
 SUM_Neo_SGD.180.a:"倾全境之力"
 SUM_Neo_SGD.180.b:"留一支后手"
 SUM_SGD_WAR_Forge_Camp:"随军铁作坊"
 SUM_SGD_WAR_Forge_Camp_desc:"随军的铁作坊，专修兵器、打马掌，缺什么现造什么。看那炉火昼夜不熄，锤声叮当，火星四溅。有那断了刃的刀，顷刻便重新锻好。那火星，溅到匠人脸上也不在意，不误军需。有分教：随军炉火，随打随用。"
 SUM_Neo_SGD.181.t:"随军铁作坊"
 SUM_Neo_SGD.181.d:"大军远征，兵器最是消耗得厉害。刀砍卷了刃，枪折了杆，马蹄的铁掌磨穿了，若是都要往后方送修，一来一回便误了战事。沙漠这边特地备了一座随军的铁作坊，几座洪炉、几把铁锤，跟着大军一并移动。匠人们白日黑夜地忙，哪里的兵器坏了，就地拿来修理；哪匹马的掌子掉了，立刻打个新的钉上。军中最怕的，就是缺了什么现造不出，如今有了这铁作坊，缺什么便造什么，刀钝了重磨，枪断了重打，端的便利。有一回夜里，洪炉的火光映红了半边天，匠人打了整整一宿的马掌，天亮时刚好赶上大队人马启程。那铁匠里有几个是赤王旧地的匠人，手艺极高，经他们手里打造出来的兵器，锋利耐用，军中都争着要他们的活计。"
 SUM_Neo_SGD.181.a:"以动员令起兵"
 SUM_Neo_SGD.181.b:"以盟约召集部族"
 SUM_SGD_WAR_Tax_Rear:"后方催征"
 SUM_SGD_WAR_Tax_Rear_desc:"后方的税照收不误，只是名目换成了捐输。捐输的人，指望打胜了能抵税。看那税吏照旧上门，百姓嘴里抱怨，手里还是把钱掏了出来。那名目换得勤，钱却一分没少，钱入库。"
 SUM_Neo_SGD.182.t:"后方催征"
 SUM_Neo_SGD.182.d:"大军远征，花费浩大，后方的钱粮，照旧是要收的。只是这一回，名目上换了个说法，不叫纳税，改叫捐输。原来沙漠的百姓，最恨的就是官府催税，一听见收税二字，眉头先就皱成一团。如今改称捐输，听着像是自愿报效国家，面上光彩，心里也舒服了些。那些捐了粮钱的，一个个都指望着，等这仗打胜了，新朝建立，自己今日的捐输，便能抵了日后的税赋，连本带利都有个说法。于是纳捐的人反倒比从前踊跃，官府也乐得换个名目，把钱粮收得满满当当。有那忠厚的老农，把自家仅剩的一袋摩拉也捐了出来，说但凡打胜了仗，子子孙孙便不再受雨林的鸟气。掌事的听了，也亲自去安慰几句。"
 SUM_Neo_SGD.182.a:"直取雨林关隘"
 SUM_Neo_SGD.182.b:"先断其商路"
 SUM_SGD_WAR_Last_Storm:"最后一场沙暴"
 SUM_SGD_WAR_Last_Storm_desc:"总攻选在换季的第一场大风。风一起，天与地分不清，正好掩兵。看那狂风卷沙，三军人马借势掩杀过去。端的天赐良机，众军精神倍增，只等一声令下便冲了上去，军威壮。有分教：天时在我，风助军威。"
 SUM_Neo_SGD.183.t:"最后一场沙暴"
 SUM_Neo_SGD.183.d:"到了总攻的关口，主将却迟迟不下令，只叫众人等候。众人急了，纷纷来问。主将指着天边道，且在等一场大风。原来沙漠里换季之时，常起大风，那风一起，飞沙走石，天与地都搅作一团，分不清哪是天、哪是地，十步之外看不见人。主将要的，正是这样一个时机。大军趁着风沙掩兵，悄悄摸到敌人阵前，对方还没看清来了多少人，刀已经架到了脖子上。果然不多时，狂风大作，黄沙漫天，天地为之一色。主将一声令下，三军乘风掩杀过去，打了个敌人措手不及。主将又预先叫人在风沙里点起烟火，作为信号，各路人马见了烟火，便知时机已到，一齐掩杀。三军都屏住气息，握紧刀枪，只等令旗一挥。"
 SUM_Neo_SGD.183.a:"把话说给雨林人听"
 SUM_Neo_SGD.183.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Break_Line:"破阵"
 SUM_SGD_WAR_Break_Line_desc:"把最硬的驼骑压在正面。等对方阵形一动，两翼的游骑便插进去。看那驼骑如墙推进，敌阵一乱，两翼马蹄声起。那驼骑步步紧逼，敌阵一乱，便再难收拾，端的狠辣，一鼓作气。"
 SUM_Neo_SGD.184.t:"破阵"
 SUM_Neo_SGD.184.d:"总攻那日，主将布下阵势，端的有些讲究。他把最精锐、最硬的一队驼骑，摆在正面，教他们直压敌人的中军。这驼骑人高马大，冲起来势不可挡，摆在正面，一是压住敌人的阵脚，二是引敌人的注意力都集中到正面来。果然两军一接战，敌人便把全力压向正面，阵形随之变动。主将等的，就是这一动。他早已埋伏在两翼的游骑，见敌人阵形一乱，立刻从两侧斜刺里插了进去，像两把尖刀，直捅敌人的软肋。正面顶住，两翼包抄，敌人首尾不能相顾，顿时大乱。这驼骑身上披着厚甲，刀砍不进，冲起来如同一堵铁墙，最是能压阵脚。两翼的游骑却轻装简从，专一抄人后路，一快一慢，配合得恰到好处。"
 SUM_Neo_SGD.184.a:"倾全境之力"
 SUM_Neo_SGD.184.b:"留一支后手"
 SUM_SGD_WAR_Rain_Palace:"望见净善宫"
 SUM_SGD_WAR_Rain_Palace_desc:"从雨林的高处往下望，能望见须弥城里的尖塔。走了这么远，为的就是那几座塔。看那尖塔在日光下闪闪发亮，众人望着，都不言语。众人望着那塔，都暗暗握紧了刀，握刀。有分教：千里奔波，只为一塔。"
 SUM_Neo_SGD.185.t:"望见净善宫"
 SUM_Neo_SGD.185.d:"大军一路东进，越过高山，进入雨林。有将士爬上一处高地，极目远眺，忽然嚷道，列位请看，那远方隐隐约约的，不是须弥城里的尖塔么？众人顺着他手指的方向望去，果然在郁郁葱葱的林海尽头，立着几座高塔的影子，在日光下闪闪发亮。从沙漠一路打到雨林，走了这么远的路，过了多少沙海、多少雄关、多少激战，原来为的，就是那几座塔。那塔下便是教令院，便是大贤者阿扎尔发号施令的地方，便是小吉祥草王被囚的净善宫所在。众将士望着那几座塔，心里都明白，真正的硬仗，还在后头。有那年轻士卒，指着一处处塔尖说笑，说等打下了须弥城，便进城去看看那教令院的高塔究竟有多高。老卒却摇头，说那塔下关着的，可是小吉祥草王。"
 SUM_Neo_SGD.185.a:"以动员令起兵"
 SUM_Neo_SGD.185.b:"以盟约召集部族"
 SUM_SGD_WAR_Terms_Demand:"提出条件"
 SUM_SGD_WAR_Terms_Demand_desc:"兵临城下才提条件：撤军、减贡、还地、认沙漠独立。条条都是账上有的。看那使节捧着文书念，一条一条，理直气壮。那使节念完，把文书往案上一放，昂首等对方答话，条条算账。"
 SUM_Neo_SGD.186.t:"提出条件"
 SUM_Neo_SGD.186.d:"大军浩浩荡荡，直抵须弥城下，把那城池围了个水泄不通。到了这一步，沙漠这边才不慌不忙地开出条件来。你道是哪几条？一是撤军，叫雨林的兵马从沙漠地面尽数撤走；二是减贡，把这些年加在沙漠头上的重贡减下来；三是还地，把侵占的绿洲关隘一一归还；四是认沙漠的独立，从此沙漠自成一国，不再受雨林节制。并非临时讹诈，条条都记在账上，都是这些年沙漠受的委屈、欠的血债。主将派人把条件送到城里，端的理直气壮，说我们打了这么久，要的就是这几桩。原来沙漠吃了雨林多年的亏，征收无度，驻军压境，占地不还，名分不认，如今一并算账，分毫不肯相让。"
 SUM_Neo_SGD.186.a:"直取雨林关隘"
 SUM_Neo_SGD.186.b:"先断其商路"
 SUM_SGD_WAR_Sumeru_Day:"须弥之日"
 SUM_SGD_WAR_Sumeru_Day_desc:"到了这一步，这一仗是打给雨林看的，也是打给沙漠自己看的。看那两军阵前，旌旗猎猎，鼓角齐鸣。这一仗的分量，端的不只是几座城池，更要让天下人知道沙漠的厉害。有分教：一战既胜，内外皆惊。"
 SUM_Neo_SGD.187.t:"须弥之日"
 SUM_Neo_SGD.187.d:"大军兵临城下，这仗打到这个地步，已经不单是为了夺城略地了。这一仗，一则是打给雨林看的。要让雨林那些向来轻视沙漠的学者、官儿们看看，沙漠的人不是任人宰割的羔羊，也有拿起刀枪、争取自己名分的骨气。二则是打给沙漠自己看的。要让沙漠各部族、各城邦的人看看，只要大家齐心，便能拧成一股绳，从今往后不再是一盘散沙，各顾各的。所以主将再三申明军纪，不许扰民，不许乱杀，端的要打出个堂堂正正的旗号来。这一仗，争的是一口气，立的是一方志。主将又道，咱们今日所作所为，后人都要评说，若只知烧杀抢掠，与雨林那些官儿有何两样？众军听了，都把那扰民的念头收了起来。"
 SUM_Neo_SGD.187.a:"把话说给雨林人听"
 SUM_Neo_SGD.187.b:"把话说给沙漠人听"
 SUM_SGD_WAR_Storm_the_Rainforest:"兵临雨林"
 SUM_SGD_WAR_Storm_the_Rainforest_desc:"沙漠的旗，插上了第一道雨林关隘。往东是平原与河渠，再往东是须弥城的高塔。教令院的使节连夜赶到阵前，说可以谈。阵前的人只回一句：先谈撤军，再谈别的，寸步不让。"
 SUM_Neo_SGD.188.t:"兵临雨林"
 SUM_Neo_SGD.188.d:"沙漠的旗，稳稳插上了雨林伸进沙漠的第一道关隘。主将立马关头，举目向东望去，但见过了这道关，便是一望无际的平原与纵横的河渠，再往东，那须弥城的高塔已然在望。正看间，教令院的使节连夜赶到阵前，说大贤者阿扎尔愿意谈，什么条件都好商量。那主将只回了一句话，声音不高，却字字如铁：先谈撤军，再谈别的。使节听了，怔在当场，再不敢提别的条件。原来沙漠这边打定了主意，雨林的兵一日不撤出沙漠，其余的都免开尊口。原来他深知，雨林若不肯撤兵，其余条件皆是空谈，唯有先退了兵，沙漠才算真正挺直了腰杆。当下便叫人把这话传回城去。"
 SUM_Neo_SGD.188.a:"倾全境之力"
 SUM_Neo_SGD.188.b:"留一支后手"

 #### 决议 ####
 SUM_SGD_Govern:"城邦与政务"
 SUM_SGD_Govern_desc:"镀金沙漠设有政务决议组，专管内政与秩序。整肃官署，调和商团与神庙，安定绿洲民生，皆归此处。国家越稳，越能支撑日后的征战；仓促冒进，反动摇根本，根基稳方能远图。"
 SUM_SGD_Trade:"商路与泉"
 SUM_SGD_Trade_desc:"镀金沙漠设有商路决议组。控制沙海商道，征收通行税，与商队订立契约，皆可充实国库。金子流向何处，沙漠的势力便在何处。谁握住商路，谁便握住命脉，商路便是命脉。有分教：商路一通，府库自丰。"
 SUM_SGD_Faith:"赤王与花神"
 SUM_SGD_Faith_desc:"镀金沙漠设有信仰决议组，围绕赤王旧训与诸神祭祀展开。祭司的诉求，百姓的信念，皆在此处。信仰越统一，动员越强，号令出得去，兵员征得来。祭司登高一呼众人响应。"
 SUM_SGD_Army:"沙海军伍"
 SUM_SGD_Army_desc:"镀金沙漠设有军事决议组，整编佣兵，修缮要塞，操练沙海部队。沙漠的军队，靠的是纪律与后勤。这两样做扎实，方能守住绿洲与商道。此组一立，军中便有主心骨，有了准。有分教：兵甲既足，号令方行。"
 SUM_SGD_Crisis:"风沙与饥馑"
 SUM_SGD_Crisis_desc:"镀金沙漠设有危机决议组，专管突发事变与内外威胁。沙漠之地，从来不缺风波。及时应对，方能保住多年家底，免得一场变故付诸东流。此组一立，遇上事便不至于措手不及。"
 SUM_SGD_Dec_Gov_Land:"厘清地产"
 SUM_SGD_Dec_Gov_Land_desc:"把官署名下的沙地，重新造册。哪块归谁，四至几何，一笔一笔记清。看那书吏拿着卷尺，丈量沙地，忙了整月。从今往后，谁占地谁纳粮，账上一清二楚，谁也别想多占一寸沙地。有分教：沙地有册，争端便少。"
 SUM_SGD_Dec_Gov_Roll:"编民籍"
 SUM_SGD_Dec_Gov_Roll_desc:"登记各城的人口与户数。哪家人几口，多大的孩子，都要报上。看那差役挨家敲门，一笔一笔填进册子。此后征丁派役，照着册子点名，再无人能藏丁漏报，端的清楚，再无隐漏。"
 SUM_SGD_Dec_Gov_Judges:"巡城问政"
 SUM_SGD_Dec_Gov_Judges_desc:"派执事巡查各城的政务。谁办事不力，谁贪了钱，都要查个明白。看那执事带着随从，走城过巷，官员们见了都恭恭敬敬。那些平日里作威作福的，也收敛了不少，贪吏收敛。有分教：钦差一到，百官屏息。"
 SUM_SGD_Dec_Gov_Road:"修官道"
 SUM_SGD_Dec_Gov_Road_desc:"把城与城之间的旧道补平。坑洼填土，断桥重架，商队走得顺畅。看那工匠们挥汗如雨，一段段修补。从前车马走一趟要颠三天，如今一日便到，商旅们无不称便，商旅称便。"
 SUM_SGD_Dec_Gov_School:"立学馆"
 SUM_SGD_Dec_Gov_School_desc:"在城邦里兴办启蒙的学馆。请先生教孩子识字算数，将来好替官署办事。看那学馆里，童声琅琅，先生拿着戒尺来回踱步。那些孩子读书识字，日后便是官署的后备人手。有分教：识字明理，疆方能治。"
 SUM_SGD_Dec_Trade_Toll:"立税卡"
 SUM_SGD_Dec_Trade_Toll_desc:"在商路各口设卡收税。过往商队，按货纳钱，少了不放行。看那税卡一处接一处，商队只好乖乖缴税。那税款一车车入了库，国库日渐充盈，商队虽叫苦，关卡却一处比一处气派。"
 SUM_SGD_Dec_Trade_Salt:"专营盐利"
 SUM_SGD_Dec_Trade_Salt_desc:"把盐场收归盟约经营。盐是家家户户少不得的，握住了盐，便握住了钱袋子。看那盐工们晒盐堆垛，白花花一片。百姓再贵也得买，这买卖端的稳当，盐场便成了取之不尽的钱袋。有分教：盐铁之利，国之命脉。"
 SUM_SGD_Dec_Trade_Caravan:"招募商队"
 SUM_SGD_Dec_Trade_Caravan_desc:"出资组织往外的商队。备好骆驼与货物，选老成的头目带队，往远邦去做买卖。看那商队浩浩荡荡出发，驼铃叮当。这一去少则数月多则一年，带的货换了金子回来，端的利市三倍。"
 SUM_SGD_Dec_Trade_Well:"凿井"
 SUM_SGD_Dec_Trade_Well_desc:"在缺水处凿新井，安顿流民。井出水，人便有了根，荒地也能成村落。看那井架立起，清水涌出，流民们欢呼。荒地上渐渐有了炊烟与人声，流民们掘土盖屋，竟把这里当成了家。有分教：一口新井，养活一方。"
 SUM_SGD_Dec_Trade_Mint:"铸新钱"
 SUM_SGD_Dec_Trade_Mint_desc:"开炉铸一枚成色足的沙漠钱。铜水浇进模子，冷却后便是一枚钱。看那钱文清晰，掂着沉甸甸。钱面上铸着沙漠的花纹，掂着沉甸甸，商人见了都放心使，从此买卖再不必称金论两。"
 SUM_SGD_Dec_Faith_Dig:"清理遗迹"
 SUM_SGD_Dec_Faith_Dig_desc:"组织人手清理一处赤王遗迹。扒开黄沙，露出石阶与断柱。看那工匠小心翼翼，生怕碰坏了什么。那些石阶断柱，默默述说着赤王的旧事，工匠们看得屏息，连大气也不敢出。有分教：拂去千年沙，重见赤王踪。"
 SUM_SGD_Dec_Faith_Shrine:"立龛安民"
 SUM_SGD_Dec_Faith_Shrine_desc:"给花神的信众，立一处安身的龛。龛虽小，却有了烧香磕头的地方。看那信众们捧着花，恭恭敬敬摆上。每逢节庆，龛前便摆满鲜花与供品，信众们磕头祈祷，端的虔诚，香火。"
 SUM_SGD_Dec_Faith_Oath:"重立部族盟誓"
 SUM_SGD_Dec_Faith_Oath_desc:"召集长老，重立血的盟约。歃血为誓，谁背盟谁受罚。看那长老们围坐一圈，刀划破指，血滴进酒里。那酒碗传了一圈，人人饮下便是一家人，谁若背盟，端的不得好死，永不相负。有分教：血盟既立，生死相托。"
 SUM_SGD_Dec_Faith_Pilgrim:"护朝圣路"
 SUM_SGD_Dec_Faith_Pilgrim_desc:"沿遗迹之路设护队与井。朝圣的人路上有人护着，有水喝，便敢走这长路。看那护队骑驼巡行，井边排着长队。有了这两样，再远的路也有人敢走，香客们一路念叨，倒也不觉辛苦。"
 SUM_SGD_Dec_Army_Levy:"征发民兵"
 SUM_SGD_Dec_Army_Levy_desc:"向各部族征发一批民兵。每部落抽壮丁若干，自备刀弓，听候调遣。看那部族的人牵马而来，脸上涂着油彩。这些民兵召之即来，事毕便散，端的省了许多粮饷，事毕便散去。有分教：各部出丁，合成一军。"
 SUM_SGD_Dec_Army_Hire:"雇请旅团"
 SUM_SGD_Dec_Army_Hire_desc:"以摩拉雇镀金旅团效力。这伙佣兵认钱不认人，钱到人手，刀便为你用。看那旅团的人接了钱，掂了掂，咧嘴一笑。这笔钱花得值，刀枪现成，本事现成，端的省了许多操练的事，契约。"
 SUM_SGD_Dec_Army_Fort:"增筑戍所"
 SUM_SGD_Dec_Army_Fort_desc:"在要道增筑戍所与望楼。高处筑楼，便于瞭望；要道设所，卡住咽喉。看那望楼一座座立起，远远便能望见。从此要道之上，一处有警处处皆知，再无偷过之人，端的稳固，烽烟。有分教：楼高眼宽，所坚固守。"
 SUM_SGD_Dec_Army_Drill:"操演沙战"
 SUM_SGD_Dec_Army_Drill_desc:"按沙暴战术操演各路兵。趁着风起，练习隐蔽与突袭。看那风沙之中，队伍忽散忽聚，端的熟练。一遍不成再来一遍，直到人人烂熟于心，风沙再大也乱不了阵脚，战时方能不慌。"
 SUM_SGD_Dec_Crisis_Storm:"赈济风灾"
 SUM_SGD_Dec_Crisis_Storm_desc:"开仓赈济被沙暴毁家的人。粮一袋袋发出去，帐篷一顶顶搭起来。看那灾民领了粮，含泪道谢。那粥棚一搭，灾民便有了指望，一个个捧着碗，含泪称谢，端的救了急，暖了心。有分教：仓中一粒，救命一命。"
 SUM_SGD_Dec_Crisis_Flood:"疏浚旧渠"
 SUM_SGD_Dec_Crisis_Flood_desc:"疏浚淤塞的旧渠，防春汛。把淤泥一筐筐挖出，渠水重新通畅。看那民夫挥锹不止，汗水顺着脸颊淌。两岸的田也保住了，百姓们肩挑手抬，忙了整月，如今总算能睡个安稳觉。"
 SUM_SGD_Dec_Crisis_Riot:"弹压骚动"
 SUM_SGD_Dec_Crisis_Riot_desc:"用治安队平息城中的骚动。闹事的人被一个个按住，市集渐渐安静。看那治安队持棍而立，驱散围观的人。闹事的头目被押着游街示众，其余人见了，一个个缩着脖子不敢再闹。有分教：小乱早平，免成大祸。"
 SUM_Neo_SGD_Mechanism:"机制状态"
 SUM_Neo_SGD_Mechanism_desc:"这块面板只供看，不许点。它按黛斯赫雷特与埃雷米特两条轴的数值，显示镀金沙漠眼下的等级，并将该档的国家修正一一列出。百姓随时可瞧，好掂量下一步往哪条轴上使劲。轴值一变，面板即时刷新，不劳手动。"
