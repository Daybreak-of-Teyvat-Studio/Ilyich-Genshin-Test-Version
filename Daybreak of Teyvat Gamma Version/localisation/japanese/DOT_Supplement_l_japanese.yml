 SOV_anti_soviet_military_thinking_banned_airforce:0 "反ソビエト的軍事思想の禁止"
 SOV_anti_soviet_military_thinking_banned_airforce_desc:0 "恥ずべき反動的理論家による文書や思想の研究と議論は現在、軍学校の空軍将校たちには禁じられており、人民の敵がソビエト空軍の隊列に侵入しないことを確実にするため卒業生は入念に検査される。"
 SOV_anti_soviet_military_thinking_banned_army:0 "反ソビエト的軍事思想の禁止"
 SOV_anti_soviet_military_thinking_banned_army_desc:0 "恥ずべき反動的理論家による文書や思想の研究と議論は現在、軍学校の陸軍将校たちには禁じられており、人民の敵が赤軍の隊列に侵入しないことを確実にするため卒業生は入念に検査される。"
 SOV_anti_soviet_military_thinking_banned_navy:0 "反ソビエト的軍事思想の禁止"
 SOV_anti_soviet_military_thinking_banned_navy_desc:0 "恥ずべき反動的理論家による文書や思想の研究と議論は現在、軍学校の海軍将校たちには禁じられており、人民の敵が赤色艦隊の隊列に侵入しないことを確実にするため卒業生は入念に検査される。"
