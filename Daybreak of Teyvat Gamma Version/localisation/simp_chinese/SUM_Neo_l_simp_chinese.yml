 SUM_Neo.69.t:"大慈树王的遗产"
 SUM_Neo.69.d:"大慈树王留下的东西不多，一条被涂抹的印记，一段无人记得的名字。教令院的门槛这几天被踩得很低，进去的人比出来的人多。高塔投下的影子越来越长，傍晚时就盖住了半条街。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
