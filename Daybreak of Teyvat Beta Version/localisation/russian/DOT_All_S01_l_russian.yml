gene_Libertarian_socialism:0"Либертарный социализм"
gene_Libertarian_socialism_desc:0"Свободное развитие каждого — условие свободного развития всех."

gene_Authoritarian_Socialism:0"Социализм авангарда"
gene_Authoritarian_Socialism_desc:0"Героический народ встал, мы едины и сильны, как сталь!"

gene_anarchic_communisim:0"Анархо-просвещенчество"
gene_anarchic_communisim_desc:0"Нет бога, нет хозяина!"

gene_left_nationalism:0"Левый национализм"
gene_left_nationalism_desc:0"Вставайте, не желающие быть рабами!"

gene_farsightism:0"Футуризм"
gene_farsightism_desc:0"Ценность человека в его талантах. Вместо того чтобы украшать себя, лучше вооружиться знаниями."

gene_V_owner_socialism:0"Социализм обладателей Глаза Бога"
gene_V_owner_socialism_desc:0""

gene_contextualism:0"Утопический футуризм/ситуационизм"
gene_contextualism_desc:0""

gene_conservatism:0"Консервативный ревизионизм"
gene_conservatism_desc:0"Демократия — это здоровая кровь, но она не должна выходить из берегов, как кровь из вен."

gene_social_liberalism:0"Социал-либерализм"
gene_social_liberalism_desc:0"Дать свободу другим и защитить свою свободу — одинаково благородные цели."

gene_social_democracy:0"Социал-ревизионизм"
gene_social_democracy_desc:0"Социализм возможен только через демократию, демократия — только через социализм."

gene_trade_liberalism:0"Торговый либерализм"
gene_trade_liberalism_desc:0"Лучшая защита потребителей — внутренняя конкуренция и свободная торговля."

gene_anarchic_capitalism:0"Анархо-капитализм"
gene_anarchic_capitalism_desc:0"Здесь каждый — король."

gene_national_socialism:0"Национал-социализм"
gene_national_socialism_desc:0"Безопасность страны не может зависеть от чужой милости. История пишется на острие меча, мир — это борьба. Свободу нельзя получить, не жертвуя собой."

gene_typical_fascism:0"Ортодоксальный этатизм"
gene_typical_fascism_desc:0"Наша борьба имеет два исхода: враг пройдёт по нашим трупам, или мы пройдём по трупам врага. То, что нельзя взять миром, берётся кулаком."

gene_reactionary_populism:0"Правый популизм"
gene_reactionary_populism_desc:0"Движущей силой перемен является не познание, а фанатизм, иногда даже истерия, толкающая народ вперёд."

gene_social_constructivism:0"Социальный конструктивизм"
gene_social_constructivism_desc:0"Не сознание определяет жизнь, а жизнь определяет сознание."

gene_Impetumism:0"Импетизм"
gene_Impetumism_desc:0"Величие любой организации, воплощающей идеал, заключается в её религиозном фанатизме и нетерпимости."

gene_national_vitalism:0"Национальный витализм"
gene_national_vitalism_desc:0"Вся природа — это борьба сильных и слабых. Только сильный побеждает. Если это правило нарушается, природа приходит в упадок, и государство, нарушающее этот закон, также приходит в упадок."

gene_surrealism:0"Сюрреализм"
gene_surrealism_desc:0"Всё сущее есть иллюзия."

gene_military_government:0"Военное правительство"
gene_military_government_desc:0"Солдаты не должны думать, за них думает вождь."

gene_paternal_dictatorship:0"Патерналистская диктатура"
gene_paternal_dictatorship_desc:0"Порядок, только порядок может дать свободу."

gene_statelessness:0"Анархия"
gene_statelessness_desc:0"Всё дозволено."

