 SUM_Neo.106.d:"小吉祥草王在净善宫加冕。雨林与沙漠第一次向同一个名字低头，须弥进入苍翠之世。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。"
 SUM_Neo.106.a:"以草神之名行事"
 SUM_Neo.106.b:"以律条为先"

