DRA_Ensure_Politic_Stability:0"Политическая стабильность"
DRA_Ensure_Politic_Stability_desc:0"Мы восстановим политическую стабильность.\n§RЭто подавит иностранное влияние.§!"
DRA_Ensure_Army:0"Боевой дух армии"
