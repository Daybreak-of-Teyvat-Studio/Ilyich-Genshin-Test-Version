 NAT_Ev_Mavuika_Oath_Idea:"纳塔誓言回响"
 NAT_Ev_Mavuika_Oath_Idea_desc:"玛薇卡火前立誓那句话，头一遍乃己所言。第二遍为祭司领众人念。后传至集市，卖颗粒果老汉哄童亦念，念至一半忘词，便胡诌两句接上。一铁匠将那句誓词錾于锤柄，每锤一下，火星里即蹦出半句。孩子问：「锤何故会响？」铁匠曰：「里头住着火神之言。」孩子不信，伸手去摸，被烫缩回。铁匠笑，将锤立于地，锤柄那行字正对门口，来人一入门先见此。"
 NAT_Ev_Great_Fire_Pact_Idea:"铸烈火大契"
 NAT_Ev_Great_Fire_Pact_Idea_desc:"六族使者于烈焰前依次按手印。沃陆老酋按得最重，掌纹嵌一道炭灰；回声锻主按毕，将手在围裙蹭了蹭；流泉航首按前先于水中浸手；悬木崖主攀树干够及石面；花羽鹰主放下肩上龙方伸手；烟谜巫首裹灰袍，只伸出一只手。契文摊中间，焱庭印盖左，六族印盖右。有人嘀咕：「此印压不压得住？」老酋将大手往契上复一按，曰：「压不压得住，看火。」火盆腾起一股青烟，将两排手印皆熏成黑亮之色。"
 NAT_Ev_All_Tribes_Unified_Idea:"诸族归一"
 NAT_Ev_All_Tribes_Unified_Idea_desc:"六族合于一句誓下那天，先将各家册子抱来堆火边。沃陆粮册、回声匠籍、流泉舟册、悬木林册、花羽羽册、烟谜谜册，摞起比人高。管册老吏拿绳捆三道，捆毕却犯难：往后兵从何出、粮从何调，谁说了算？方争着，沃陆老酋曰：「先搁一处，往后同调。」说罢解腰间调粮牌，搁册上；回声锻主将炉钥亦搁上；航首摘螺，崖主放藤索，鹰主拔一羽，巫首取一枚谜符。六物压六册。老吏将绳一收，抱起这摞物，往焱庭库里送。"
 NAT_Ev_Ultimate_Duel_Idea:"终极决斗余威"
 NAT_Ev_Ultimate_Duel_Idea_desc:"那场决斗打至日头落，二人于圣火竞技场换过三样兵器，斧、锤、长枪，谁亦未压住谁。末了皆收手，立场中喘气，看台松明火把烧得只余半截。人群散得甚慢，走出几步复回头。卖水小贩挑担愣于原地，桶内水晃半日未舀一瓢。一孩子攥父袖，掌心皆汗，问：「谁赢了？」父不答，只将孩子掌心之汗于己裤腿蹭掉，复攥紧往回走。场上沙被踩得坑坑洼洼，两串脚印自场心直拖至场门口，谁亦未回头扫。"
 NAT_Ev_Abyss_Burning_Oath_Idea:"焚渊立誓"
 NAT_Ev_Abyss_Burning_Oath_Idea_desc:"玛薇卡言欲以己之火焚那道裂隙，话不长，言毕先将权杖往地一顿，火自杖头窜起一丈高。焱庭中无人接话。片刻后，老祭司先自己之火盆拨出一块炭，添入坛内，曰：「吾添一块。」随者一，复添一。一年轻卫兵将今晚灯油亦倾入，灯芯当即灭，亦不点。火愈烧愈旺，映得每脸皆红。玛薇卡将杖举平，火头朝裂隙方向压去。众人随举臂，火光连成一片，将坛前影子拉得老长。"
 NAT_Ev_Duel_Code_Idea:"决斗立典"
 NAT_Ev_Duel_Code_Idea_desc:"写条文之屋不大，三矮案拼一处。首席祭司口述，书记官伏案记：何仇可上场，何仇不许；谁为裁定；打死人如何算。写至打死那条，笔停。有人主张偿命，有人曰：「场上无眼，怪不得谁。」争半宿，末了写成一句：入场即认生死，出场不复追究。条文抄三份，一存焱庭，一存演武场，一挂场口木牌。过些日子，民间有争执，竟先翻此条文中能打不能打，再至焱庭翻律。木牌前常有人仰头念，念至那句，身后人便不言矣。"
 NAT_Ev_Duel_Mediation_Idea:"设决斗调解"
 NAT_Ev_Duel_Mediation_Idea_desc:"调解人名册只五个名字，写于一张巴掌大皮上。管册老吏将皮子卷起，谁欲看皆须先过他这关。此番沃陆与悬木两族争一草坡，皆点名要同一调解人。那调解人方在自家锻炉边磨一把回声短刀，闻来意，先将刀放下，曰：「草坡吾不去，改去调解下一场。」两族使者不肯走，蹲门槛上候。日头偏，调解人拿起刀复磨数十下，方起身，将刀插回腰间，随他们出门。老吏在后将名册复卷紧一道，塞入怀，跟了上去。"
 NAT_Ev_Honor_Duel_Rules_Idea:"定荣誉斗规"
 NAT_Ev_Honor_Duel_Rules_Idea_desc:"新规贴于圣火竞技场口：荣誉决斗只争面子，不许牵扯土地与地利。头一不服者乃一年轻人，家祖田被占，欲借决斗讨回。守门老人将规矩念他听，念两遍，曰：「祖田之事，另寻说法。」年轻人攥拳立半晌，末了解腰间刀，交老人代管，空手上场。对手亦不好复提田事，二人拳脚往来，打个平手。散场后，二人蹲场外石阶分一壶水饮。自此，夜里巷口动刀者少矣，巡夜人手中所持松明火把亦少点几支。"
 NAT_Ev_Border_Dispute_Idea:"平边境之争"
 NAT_Ev_Border_Dispute_Idea_desc:"界碑复立稳那日，回声与沃陆两族巡逻队皆换新旗，一左一右，隔碑各立。签字文书收入匣，钥匙交第三方保管。看着是了结矣。然天一擦黑，两队人仍照旧出巡，行至碑前停一停，隔老远互看一眼，谁亦不先开口。一新兵问队长：「皆签字犹守何物？」队长将火把往碑一照，黑曜石碑面旧刀痕犹在，曰：「守至此痕平为止。」新兵伸手摸那道痕，指腹卡凹处，末了将手收回袖中，转身归队，靴底在碑前复压一道新印。"
 NAT_Ev_Clean_Abyss_Cults_Idea:"清除深渊邪教"
 NAT_Ev_Clean_Abyss_Cults_Idea_desc:"那几处巢穴乃连夜焚毁。火熄后，搜捕队入内清点，墙根下复冒新黑斑，比烧前犹多一处。队长拿刀刮一片下，置火把上烤，黑斑遇火不焦，反往上爬。将手一抖，那物落沙中，转眼钻没。随从问：「犹烧否？」队长不答，将刀往鞘一插。战报一叠叠送至焱庭，所写皆大捷，然管档老吏翻着翻着，将两份并一处看，眉头愈皱愈紧。将战报摊灯下，取朱笔于捷字旁画一圈，圈毕复抹去。窗外复送来一份新的，墨犹未干。"
 NAT_Ev_Woo_Flower_Guild_Idea:"花羽会之余波"
 NAT_Ev_Woo_Flower_Guild_Idea_desc:"花羽会鹰主来谈入伙，入门先将肩上青羽龙架到椅背，己身方坐。焱庭这边方开口言空域共管，鹰主即抬手：「别的不争，天上的事，吾等自家说了算。」对方犹欲再议，鹰主将龙架起，作势欲走。谈一整日，末了焱庭让步，将空域巡守由花羽会自管写入契。后来别部亦照此条写。鹰主接过契，看也未看完便按羽印，出门时青羽龙展翅，掠过场上旗尖。"
 NAT_Ev_Sacred_Night_Procession_Idea:"巡礼归火圣夜"
 NAT_Ev_Sacred_Night_Procession_Idea_desc:"归火圣夜那晚，巡礼之火须六族轮添。沃陆老酋添第一把谷壳，火苗窜一股焦香；回声锻主所添乃燃素锭，火色转青；流泉航首舀勺泉水泼上，火未灭，反更亮；悬木崖主搁一段藤；花羽鹰主拔一羽；烟谜巫首末了撒一把灰，念曰：「魂归其位。」六双手依次自火盆掠过。巡礼散，人各自归寨。过几日，二在不同寨添过火者在集市相遇，皆愣一下，先认出对方之手，方忆起是哪一夜。"
 NAT_Ev_Duel_Settle_Conflicts_Idea:"以斗息争"
 NAT_Ev_Duel_Settle_Conflicts_Idea_desc:"这两年入圣火竞技场者比从前少，然场外吵者未见少。有人为一句话争半月，谁亦不肯上场。管场老人急，贴出告示，对吵者曰：「口角不听，便入场中论。」头一被推入者乃话最多之人，三招不到便趴沙上，自起身拍拍土，认了。看者笑，笑毕各归家，那桩争吵亦无下文。后再有人吵至面红耳赤，旁人不劝，只往圣火竞技场方向一指，声便低下去。场上输者，从无谁翻脸不认，皆自系好腰带，走出门去。"
 NAT_Ev_Tribal_Council_Idea:"召集六部议事"
 NAT_Ev_Tribal_Council_Idea_desc:"六族头一回坐进同一屋，桌是方的，各占一边。谁亦不肯先开口。沃陆老酋将斧靠椅腿，先咳一声。回声锻主将锤往桌一放，桌面陷一坑。流泉航首收螺，悬木崖主解藤，花羽鹰主令龙停窗棂外，烟谜巫首裹灰袍坐末位。会开两日，自粮争至水，自水争至界。第三日，书记官将结论写出，念与众人听：「先勿急着动手。」六人传看一圈，谁亦未言好，谁亦未言不好。老酋提斧起，走出门去，余人相继跟上。"
 NAT_Ev_Calamity_Heroes_Monument_Idea:"立灾厄英雄碑"
 NAT_Ev_Calamity_Heroes_Monument_Idea_desc:"黑曜石碑自图兰火山口运下，一路轧坏悬木人所搭三段栈道。立碑那日，六族之人围看，石面光滑，一字亦无。石匠搭架，先刻谁，各族复争起。石匠将凿子往石一磕，曰：「按殉难先后。」后便自最早者刻起。头一名落刀时，石屑簌簌下坠，一老人伸手接一捧，攥于掌心。刻至第七十六个，天已黑，火把点起接续刻。末一名刻完，石匠将凿子往腰间一插，退三步看一眼。人群中无人言，只闻火把噼啪响。"
 NAT_Ev_National_Identity_Push_Idea:"广民族认同"
 NAT_Ev_National_Identity_Push_Idea_desc:"新课本发下那天，六族孩子头一回翻至同一页。上头写同一段希巴拉克古事，同一支归火圣夜之歌，同一个节日。教习先生念一句，孩子随念一句，口音各不同，字却认得一样。一长辈立门外看，皱眉曰：「此非吾等那套。」先生听见，亦不辩，只将课本翻至下页。过些年，节至，各族之鼓皆搬至图兰圣城同一场地，孩子先唱那支歌，再各跳各舞。从前皱眉长辈亦来，蹲场边，随拍两下手，拍毕己先笑。"
 NAT_Ev_Night_God_Realm_Defense_Idea:"镇守夜神国"
 NAT_Ev_Night_God_Realm_Defense_Idea_desc:"夜神国度边界上，哨塔一座接一座立起，隔三里一塔，塔顶皆挂灯。从前此带靠夜行者之耳守，风里有一点动静即须起身。今易新法：塔内轮值，见灯灭便点，点不着即敲钟。头一夜轮值年轻兵未敲过钟，紧张一宿，天亮方敢闭眼。老兵拍其肩，指塔下之路，曰：「人能走，狼亦能走，守者即是此条。」年轻人将灯芯拨亮，坐塔口，盯远处下一塔之灯火。"
 NAT_Ev_Redress_Ocican_Injustice_Idea:"平反奥奇坎冤"
 NAT_Ev_Redress_Ocican_Injustice_Idea_desc:"耻辱册摊于案，管册老吏拿笔一个个划名。划至奥奇坎那栏时，停笔，问身后人：「此名亦划？」身后无人答。蘸墨，终究划了，墨迹压住旧字。消息传至寨中，一老人方在门口晒谷，听完愣半晌，将簸箕往地一搁。他候此句候了三十年，候者乃其兄。兄之孙已不记祖父名讳。老人蹲下，自谷中捡一石子，攥片刻，复扔回簸箕。"
 NAT_Ev_Suppress_Rebellious_Elders_Idea:"叛族长老末路"
 NAT_Ev_Suppress_Rebellious_Elders_Idea_desc:"长老被押走那日，寨中静得反常。往日此时，老人们之声能自晒谷场传至井边，此日却无。数年轻人立路口，看押人之队走远，谁亦未跟上。一后生问：「往后仓门谁开？」无人应。归家拿起父亲所留旧钥匙，开自家仓门，开两下方对准锁孔。往常此事皆由长老管，钥匙亦归他们收。今钥匙攥于己手，反愣在仓门口。风将场上谷壳吹起，旋一圈复落下。四下看了看，将钥匙揣入怀，进屋去矣。"
 NAT_Ev_Reform_Tribal_Council_Idea:"部族议事改制"
 NAT_Ev_Reform_Tribal_Council_Idea_desc:"焱庭议事厅之门复量过，门槛拆去，换为平地。席位按新法重排，不复按血统坐。头一回开会，数出身寻常者走入，立空位前不敢坐。主持老人指空位，曰：「坐罢。」坐定后，将所携之物摆膝上：一为己打之沃陆式锄，一为抄半宿之账，一为与寨中孩子写字帖。老席位上者斜眼数回，不语。议至一半，那本账传看一圈，传至老席位时，有人伸手接过，翻两页，复传回。"
 NAT_Ev_Diplomacy_Liyue_Idea:"通好璃月"
 NAT_Ev_Diplomacy_Liyue_Idea_desc:"纳塔与璃月商船始同走一航线，头一趟各走各的，谁亦不肯跟在对方后。后遇顺风，二船并排一程，船工隔水互递干果，话未听懂，笑却懂了。第二趟便熟，夜里泊一处生火，各烤各鱼。璃月人讲山那边之灯，纳塔人讲火山口之红，比划半日，末了将对方之词记于己本上。货换得多，闲话亦随之多。一船工归寨，曰：「璃月之人会以石砌甚长之墙。」听者睁大眼，次日便有人跑去看是否属实。"
 NAT_Ev_Reconcile_Springs_Idea:"流泉之众和解"
 NAT_Ev_Reconcile_Springs_Idea_desc:"水路口谈判于流泉之众一处临泉棚中开，两边隔一矮桌坐下。上游人先开口：「今年水浅，闸须往上游挪半丈。」下游人不接此话，只将茶碗往桌一顿。谈半日，谁亦不提去岁抢水那桩。末了终让步，将新界写入文书，两家各按手印。散席时，上游人行至泉边洗手，下游人亦随来，二人并肩蹲着，谁亦未看谁。泉水自指缝过，凉得一样。上游人先起身，将袖放下，去矣。"
 NAT_Ev_Rally_Dragon_Sages_Idea:"龙贤归心"
 NAT_Ev_Rally_Dragon_Sages_Idea_desc:"龙贤士应允出山那日，熔炉冷了三月。使团入山时，洞口石门推不开，叫半日，里头方有人应。出者乃一老龙，鳞上蒙灰，问一句：「炉犹烧得动？」使团将燃素之状比与它看，老龙伸手接过，捏了捏，忽笑。转身入内，领七八条龙出，各抱一火种。回熔炉边，老龙将火种往炉膛一送，己之火贴上去。炉口先冒青烟，继窜红焰，愈烧愈旺。炉工们从无见过恁旺之火，皆退一步。老龙反往前凑，将鳞上之灰烤下一层。"
 MODIFIER_PRODUCTION_OIL_FACTOR:"石油产量"
 production_oil_factor_tt:" $MODIFIER_PRODUCTION_OIL_FACTOR$: $RIGHT|+=%1$"
 NAT_Council_category_desc:"焱庭议事厅。此厅乃纳塔诸事议决之所，亦两大要务常驻之览。深渊侵蚀与部族恩情之数，随时而新。不必点开细目，已可一眼看清纳塔当下所处之阶，与随之生效之国政；方略亦可随时而调。厅不设门槛，谁都可看，谁都可据此盘算下一步。"
 NAT_Tribe_Deep_Category_desc:"六族深耕决议组。邀请各部族入盟之后，还须一处地方处理他们各自的诉求，土地、俸禄、祭祀与争端都归这里管辖。恩情因此积累，部族才会愿意真正为纳塔所用，也才会在战事吃紧时出力出人。部族要的是实惠，给得不到位，恩情便无从谈起。"
 NAT_Rift_Category_desc:"裂隙与夜神决议组。围绕深渊裂隙的开合与夜神的祭祀展开，每一次处置都会牵动深渊指数。裂隙不封，祸患不止；然在封堵之前，也未必不能从中取些好处，全看如何权衡这中间的利弊。是封是取，皆在当下盘算之间。"
 NAT_Grand_Category_desc:"终局与路线决议组。局势行到尽头，纳塔须择一条路走下去。此处聚着决定国运的几桩大抉择，每一桩都要改动纳塔的格局与地位。落子之前，务须想清，只因再无回头重来之机。一旦走上某条路，便再难回头。"
 NAT_War_Category_desc:"战备决议组。部族大会既已召集，战争便近在眼前。征募、铸兵、结连盟友与散布檄文都归这里处置，能否抢占先手，往往就在这一组决议之间分晓，准备得越充分，开战之初便越是从容。准备得足，开战才站得稳；路线熟，才少走弯路。"
 NAT_Ceasefire_Category_desc:"停战决议组。战事进入尾声或陷入僵持时，如何收场比如何开战更难。这一组决议用于议和、安抚与善后，决定纳塔以怎样的姿态走出这场战争，也决定战后能留下些甚么家底与人心。这一局的得失，往往在收场时才见分晓。这一笔得失，要算得清清楚楚。"
 NAT_Temp_Crimson_Festival:"赤焰之节"
 NAT_Temp_Crimson_Festival_desc:"火把沿着街巷排成两条长龙，孩子们举着小火把在队伍里钻来钻去，谁家窗台上摆了颗粒果，顺手抓一把就跑。老人们坐在门槛上，看那火光从头走到尾，指着队里一个后生道：「去年他还是举火的那一个。」话没讲完，一队火把已拐过巷口，火舌舔着夜色，把墙上的影子拉得老长。节日只有短短一段日子，火把熄了，街巷黑下来，门槛上的人还坐着，谁也不肯先起身。"
 NAT_Event.150.t:"离心结盟"
 NAT_Event.150.d:"竞逐之盟议事厅上，盟主将佩刀横置案头，刀鞘正对主位。并不拔刀，但令众人看那刀之短长。当下开言道：「这一季猎场、盐井并巡边诸事，我盟自能看守，何必复向纳塔使者禀报？」言毕，厅中竟有数人微微颔首，这一颔首，较甚么反对之言皆更刺耳。纳塔使者立阶下，手捧按例送来火种与账册，欲进不敢，欲退不能。才待开言，盟主已抬手止之，道：「旧例之言，留待回焱庭再说未迟。」使者无奈，轻置火种于阶前，抱账册退立一旁。及至散席，门外有人低声议论：「使者体面尚且顾不得，这盟约还作得准么？」那口刀仍横案上，无人敢碰。一阵风穿厅堂，吹得账册哗然作响。使者以手按定，一页页翻回首页，抱紧，转身下阶去。"
 NAT_Event.160.t:"六部举兵"
 NAT_Event.160.d:"入夜，火把自山脊迤逦而下，直排至河谷口，若一条火龙。族中人把祖传的骨饰重新挂在胸前，乃出征方有之装束。为首者以矛尖顿地，只留一言：「我等非背弃纳塔，实不愿再替纳塔之过失赔上性命。」营地之外，新磨矛尖堆得山积，铁匠铺的炉火，整整一夜不曾熄灭。纳塔使者星夜驰至，为人拦于木栅外。亦不硬闯，但书劝谕之语于木牌，自栅缝递将进去。不多时，木牌被掷出，落泥中，字迹遭踩得模糊不清。及天明，队伍已开拔。沿途村落，或闭门不出，或置干粮于路侧，然无人肯先言己身所向。村口立一老妇，望那列火把渐远，将手中未曾送出之水囊缓缓收回，抱于怀里。直待火把尽没入夜色，方转身回屋，插门闩极响。"
 NAT_Event.170.t:"六旗并立"
 NAT_Event.170.d:"六面旗同一日升起，颜色各异，皆弃纳塔旧徽。盟约原本写在兽皮之上，今被人一块块割开，分与各家收着，谁亦不肯出己那一角。纳塔使者东西奔走，所见之门，一扇紧似一扇。有一家肯谈，开出条款，要纳塔先认各盟自守之权。使者方欲答言，门便掩半扇，里头抛出一语：「这一日，我等等得久了。」至第三日，河谷渡口已由各家分守，商队过往，须向三家逐一纳税。河面泊七八条货船，桅杆相挨，谁亦不肯先靠岸。有一条船停在河心，船主捏三份税单，哭笑不得，道：「过一道河，纳三回钱，这买卖还怎做？」艄公将篙往石上一撑，缓缓道：「汝掉头回去便是。」船主把税单折了又折，塞进怀里，到底仍教艄公撑船向渡口。"
 NAT_Event.210.t:"渊蚀日深"
 NAT_Event.210.d:"那一日，天地忽然静了下来，静得连风亦停。但见天边裂开一道暗色口子，若利爪撕帛，越撕越长。深渊之兵自裂口涌出，不呼号，亦不列阵，但默然向前攒行。阵前哨骑驰回禀报：「不闻战鼓，只闻潮水撞礁之声，一遍又一遍。」言毕，将染黑之手按于城墙，指缝间兀自滴黑血，亦不拭，回身复朝裂口凝望。纳塔之旗重插城头，火种分至各村，炉膛连夜点燃。再无人争论盟约是否公道，亦无人再提谁欠谁旧账。为母者将孩子按进地窖，为父者将磨好之刀一把把递将出去。有一父亲，交刀于子手中，只说二字：「守住。」子紧攥刀柄，并不答话，转身随队出门去。地窖口上，母亲盖定末一块石板，只留一线缝隙，透进些微火光。"
 NAT_Event.500.t:"魔潮漫旧矿道"
 NAT_Event.500.d:"地脉的震动，自夜里起到清晨兀自未歇。守地下壕堑之工人言曰，墙缝渗出者非水，乃一种带星屑之冷光，沾在皮肉上，便留一道浅浅白痕。有个工人伸出手背与同伴看，白痕果犹在。第一批魔物沿旧矿道爬将上来，为数不多，散得却广，此村至彼村，几乎同时皆有。守军无奈，拆兵马作数小股，东奔西走，疲于奔命。工坊之中，众人连夜把火种装进随身可带的铜匣，老幼先撤往后洞窟，青壮留守井口与熔炉。井口绳子一寸寸放下，放至尽头，亦未探着水。一匠人蹲熔炉边，以手护那点火，犹护风中一灯。同伴催其速撤，摇头道：「此火若灭，人便真无指望矣。」守至后半夜，火苗忽旺一旺，揉了揉眼，将铜匣往怀里又拢紧些。"
 NAT_Event.501.t:"诸族同心共守"
 NAT_Event.501.d:"这一回，先至者非魔物，倒是各族之队伍。带自家猎具、药草与熟识山路之向导，于约定渡口会齐。有人犹记上月为猎场争得面红耳赤，此刻却无复人提。一首领谓另一族首领道：「上回为猎场红脸，这一回，皆记在我头上便是。」对方将弓往肩一挎，道：「旧话休提。魔潮不认界碑，守住这段河，方是正理。」守夜篝火沿河一路铺将开去，火光映至山脊，连成一片。孩子安置于洞窟深处，听外头一浪接一浪之响动，渐次睡熟。岸边渔人收网，言水里动静较往年深，亦较往年近。天亮前最凶一波攻势竟被挡下，不曾有一面旗先撤，亦不曾有一族人先退。一向导指山脊上那片火光，对身旁人低声道：「汝看，皆连起来了。」那人顺其手指望去，将刀往雪里一插，蹲身就火烤起手来。"
 NAT_Event.610.t:"界门初开"
 NAT_Event.610.d:"界门立于河床正中，远望不过两根歪斜石柱，近前方知，两柱间那层薄薄黑暗，竟不透光。工匠持长杆试探，杆入半截，抽将出来时，前半段已不见，断口平整若刀削。环界门之山壁上，新长一圈黑色晶簇，随呼吸般之节奏微微发亮。长者言，此非天然裂隙，乃有人自那一头撬开一道缝。年轻工匠问曰：「既然撬得开，可还堵得回去么？」长者捻须道：「或能。只是要用之物，纳塔未必凑齐。」守军四下拉起栅栏，禁人靠近。然至夜里，总有人闻门后低低呼唤，若熟人叫己之名。巡夜之兵以耳贴柱，听半晌，色煞白而退，奔告长者。长者但教其塞耳，自己却于夜中踱至柱边，立了许久许久，末乃向那道黑暗掷一石，竟不闻落地之声。"
 NAT_Event.620.t:"龙群巡护山道"
 NAT_Event.620.d:"黎明之前，天上忽地暗了一片。抬头看时，却见是龙群。它们飞得并不快，沿着河谷与山脊间那条固定的路线绕行一圈，翅膀扇起的风，把地表的火星重新吹亮。领头的龙，在最深的那道裂隙上方停了许久，若在辨认甚么，俄而张口吐一道极亮之光，将裂隙边缘烧熔封死。地面之人初皆屏息，后有人先跪下去，继以第二个、第三个。一位老者对身边的孩子道：「何不速谢。」那孩子却挣开其手，但直勾勾盯天上。一轮巡护既毕，龙群不落，径直向上，钻入云层去。山坡上只剩烧得温热之岩面，与一群犹站不起身之人。过了许久，那孩子最先站起来，冲着天上那道渐渐合拢的黑影用力挥手，转身自坡上拾一石，摞于旁侧石堆之上。"
 NAT_Event.790.t:"烽烟告急"
 NAT_Event.790.d:"是时前军塘报，一日紧似一日。舆图上纳塔旗色，一处处为别家换去，换得甚快。仓廪告罄，粮囤将尽，人心随之摇动。有那等胆小军士，趁夜弃兵刃，悄然离营，并同伴亦不知会。大帐之内，众将环舆图争执。一将伸指按图上，道：「下一道关防，即设于此。」另一将伸手拨开，道：「设于此地，拿甚么把守？」两人各说各的，谁的手指都不肯离图上那一点。塘马一骑接一骑驰来，又一骑接一骑驰去，带回口信，一句短似一句。但见一老军坐炮位之侧，将炮膛擦了又擦，炮筒亮得可照人影。旁一新兵视之半晌，不禁问曰：「老丈擦几遍矣？」老军不回头，只道：「擦到它响为止。」新兵默然，咽怀中干粮一口，蹲身同那老军将火炮复细细擦一遍。火种兀自燃着，未尝熄灭。"
