 ITA_battaglia_del_grano_desc:0 "真に独立した国家であるためには、食料供給の面で外国の力を頼るわけにはいかず、農業での自給自足が実現可能でなければならない。「小麦の戦い」ののちに我々は自立し、今よりさらに大きな力を身につけることになるだろう。"
 ITA_battaglia_per_la_nascite:0 "誕生の戦い"
 ITA_battaglia_per_la_nascite_desc:0 "イタリアが真の繁栄を迎えるためには、もっと多くの兵士が必要だ。今以上の数の兵を確保するには、人口を増やさねばならない。そして人口を増やすには母親が不可欠であり、その母親達に必要なことは、我々がこの「誕生の戦い」に勝つことだ。"
 ITA_battaglia_per_la_terra:0 "地の戦い"
 ITA_battaglia_per_la_terra_desc:0 "「地の戦い」は何マイルもの沼地を枯渇させ、農地をつくり出すために実施される。新たな雇用の創出にもつながることから、諸外国の政府は既にイタリア人の挫けることのない精神に感銘を受けている。"
 ITA_bolstered_military_high_command:0 "強化された最高司令部"
 ITA_bolstered_military_high_command_desc:0 "軍隊が最大限に機能し、戦場で成果を上げるには、有能な指導者の存在が極めて重要となる。"
 ITA_bolstered_political_cabinet:0 "強化された閣僚"
 ITA_bolstered_political_cabinet_desc:0 "適材適所を徹底することで、ファシスト体制と我々による[ITA.GetNameDef]の統治体制が強化される。"
 ITA_brescia_arsenal:0 "ブレシア・アーセナル"
 ITA_caligulas_pride_dynamic_modifier_tt:0 "§Y$ship_hull_super_heavy_1$§!: $production_cost_tt$§G-15%§!\n§Y$ship_hull_super_heavy_1$§!: 装甲: §G+10%§!\n"
 ITA_camicie_nere:0 "黒シャツ隊"
 ITA_camicie_nere_desc:0 "黒シャツ隊は、いずれも個人として[ITA.GetLeader]に忠誠を誓った身であり、陸軍に所属する誰よりも頼りになる上に忠実な兵達だ。彼らにより強い権力と責任を与えることで、我々の統治体制が強化される。"
