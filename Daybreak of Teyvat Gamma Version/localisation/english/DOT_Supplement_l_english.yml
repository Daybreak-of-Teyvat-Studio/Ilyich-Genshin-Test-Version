 GUN_Investigate_Sea_of_Ember_Silence:0 "Investigate the Sea of Embers"
 GUN_Investigate_Sea_of_Ember_Silence_desc:0 "Investigate the Sea of Embers"
 GUN_Invite_Diona_desc:0 "The super popular bartender of the Cat's Tail, a rising star of Mondstadt's wine industry, and the greatest challenger to the traditional establishment—that is how Mondstadt's drinkers see Diona. But this cat-eared, cat-tailed girl from Springvale has always called herself the 'wine industry killer.' Even her bartending skills are just 'I'm really trying to ruin that horrible liquid.' This subtle contradiction stems from Diona's peculiar constitution—whether blessed or cursed—whereby any wine mixed by Diona turns into an unimaginably delicious drink. Yet to this day, she has not given up in her hatred of alcohol. Creating a truly awful wine and single-handedly destroying Mondstadt's wine industry remains the unremitting goal of bartender Diona."
 GUN_Invite_Yura_desc:0 "As the captain of the Knights of Favonius' Reconnaissance Company and the renowned 'Spindrift Knight,' Eula has long led her troops on patrols and earned many merits. The knights stationed in the high mountains and deep ravines often fall prey to monster attacks, but Eula provides swift support to eliminate dangers and avert crises. She has also led proactive assaults to destroy Abyss Order strongholds, nipping conspiracies in the bud. Yet Eula's background is uniquely tangled—she is a descendant of the Lawrence family, seen by the people of Mondstadt as the embodiment of 'sinner's blood.' Yet she broke with her family years ago and joined the Knights. Hindered by deep-rooted prejudice, Eula has never been treated fairly. In the eyes of Mondstadters, she is always an 'outsider,' even a 'dangerous person.' Years of experience have compelled her to build an invisible shield to protect herself from unprovoked harm. 'Vengeance' is perhaps the most visible facet of that shield. Only by casting aside rumours and accepting her logic can one recognise the true nature beneath this young woman's complex exterior."
