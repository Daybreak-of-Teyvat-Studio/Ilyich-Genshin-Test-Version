 SPA_anti_carlist_offensive:0 "対カルリスタ攻勢"
 SPA_anti_republican_offensive:0 "対共和派攻勢"
 SPA_awaiting_the_rebellion:0 "反乱の時を待つ"
 SPA_awaiting_the_rebellion_desc:0 "クーデターの計画は綿密に練られており、いまや発動の機会を待つばかりだ。しかしながら前回の失敗から学んだことがある。1932年のサンフルホの失敗を繰り返すくらいならば、人民の心情が十分に我々の支持に傾くまで待つつもりだ。そうすればそう簡単に孤立無援に陥ることはないだろう。"
 SPA_carlism:0 "カルリスモ"
 SPA_carlism_desc:0 "1830年、国王フェルナンド7世は国事詔書を布告し、娘である後のイサベル2世を王位継承者とした。この行為によって弟であるインファンテ・カルロスが継承者から除外されてしまい、王の死後、カルロスの支持者は一連の内戦の発端となり、カルリスタの旗の下、サリカ法に基づく継承の復活のために戦った。\n\nそれから1世紀経つ今もカルリスタ運動はいまだ活発であり、レケテスと呼ばれる市民兵たちは、キリスト教を守り、正当なる王の帰還を擁護するその時の為に備えて絶えず訓練を続けている。"
