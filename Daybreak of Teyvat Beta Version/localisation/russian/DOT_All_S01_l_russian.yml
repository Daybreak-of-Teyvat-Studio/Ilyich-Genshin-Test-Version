ANR_Bennett_Special_Decisions:0"Душа первопроходца"
ANR_Bennett_Special_Decisions_desc:0"\nНо Беннет не остановился, он чувствовал, что все страдания, которые он пережил в прошлом, были лишь подготовкой к преодолению этого испытания.\nВ конце этого адского пути его ждало...\n"
ANR_Bennett_Decisions1:0"Создание производственной системы"
ANR_Bennett_Decisions2:0"Фокус на экономическом развитии"
ANR_Bennett_Decisions3:0"Улучшение условий жизни"
ANR_Bennett_Decisions4:0"Поднятие боевого духа"
ANR_Bennett_Decisions5:0"Призыв к обязательным работам"
ANR_Fischl_Special_Decisions:0"Ночной вальс"
ANR_Fischl_Special_Decisions_desc:0"\nПринцесса сожжёт своё сердце. С расцветом бессмертного сияния родится новая вселенная.\nИ принцесса поймёт, что каждый миг жизни, даже самый незначительный эпизод, нужно ценить.\n"
ANR_Fischl_Decisions1:0"Руководство академическим прогрессом"
ANR_Fischl_Decisions2:0"Внедрение передовых технологий"
ANR_Fischl_Decisions3:0"Административные реформы в пользу народа"
ANR_Fischl_Decisions4:0"Внешняя пропаганда"
ANR_Diona_Special_Decisions:0"Песнь скорби"
ANR_Diona_Special_Decisions_desc:0"\nЕсли даже «делиться» невыносимо, как можно терпеть, когда «всё отнимают»?\n"
ANR_Diona_Decisions1:0"Координация групп интересов"
ANR_Diona_Decisions2:0"Улучшение инфраструктуры"
ANR_Diona_Decisions3:0"Субсидирование торговли"
ANR_Diona_Decisions4:0"Особые меры по поддержанию стабильности"
ANR_Diona_Decisions5:0"Расширение военного производства"
ANR_Razor_Special_Decisions:0"Охотник, как волк"
ANR_Razor_Special_Decisions_desc:0"\nОн дал себе слово: стать сильнее, сильнее всех. Когда придёт опасность, он защитит своих «Лупика».\n"
ANR_Razor_Decisions1:0"Обобщение боевого опыта"
ANR_Razor_Decisions2:0"Ускорение тренировок войск"
ANR_Razor_Decisions3:0"Проведение военного парада"
ANR_Razor_Decisions4:0"Проведение военной мобилизации"


ANR_support_Bennett_1_desc:0 "§RДля выполнения этого решения требуется влияние Беннета более 2.§!\nЧтобы дать беженцам, уже прибывшим и тем, кто придёт в Вольфендом, еду и одежду, мы отправим Беннета организовывать производственную деятельность. Мы своими руками добудем себе достойную жизнь."
ANR_support_Bennett_2_desc:0 "§RДля выполнения этого решения требуется влияние Беннета более 3.\nКроме того, это увеличит влияние Беннета на 1!§!\nГлаз Беннета и его жизненный опыт помогут ему в строительстве многих объектов, таких как каналы и туннели, а его невероятная сила позволит ему поднимать грузы, которые обычные люди не могут. Увидев активность Беннета, жители Вольфендома, несомненно, проникнутся к нему симпатией."
ANR_support_Bennett_3_desc:0 "§RЭто увеличит влияние Беннета на 1!§!\nВ ходе предыдущей производственной деятельности Беннет завоевал широкое доверие среди простых людей. Теперь мы отправим его в качестве представителя, чтобы раздавать населению Вольфендома продукты из наших запасов и купленные извне, чтобы стабилизировать обстановку, и репутация Беннета также улучшится."
ANR_support_Fischl_1_desc:0 "§RДля выполнения этого решения требуется влияние Фишль более 2.\nКроме того, это увеличит влияние Фишль на 1!§!\nХотя сама она не обладает большими академическими знаниями, Фишль обладает выдающимся талантом и чутьём, всегда находя ключ к прорыву в исследованиях. С её помощью наши академические исследования смогут быстро продвинуться вперёд."
ANR_support_Fischl_2_desc:0 "§RДля выполнения этого решения требуется влияние Фишль более 3.\nКроме того, это увеличит влияние Фишль на 1!§!\nГоспожа Фишль всегда выступала за использование передовых технологий для сокращения потерь ресурсов и повышения эффективности производства. По её мнению, именно из-за нехватки рабочей силы и ресурсов в Вольфендоме необходимо как можно раньше внедрять более совершенные технологии. Теперь мы отправим её контролировать внедрение новых технологий, оказывать руководство и поддержку, чтобы наше производство не останавливалось из-за боязни рисков или нежелания выходить из зоны комфорта. Результаты новых технологий станут известны широкой публике, и Фишль получит признание ещё большего числа людей."
ANR_support_Fischl_3_desc:0 "§RЭто увеличит влияние Фишль на 1!§!\nКак руководитель создания высшего административного аппарата, Фишль всегда считалась высшим административным лицом нашего временного правительства, хотя, похоже, она сама не особо хотела тратить на это время. Теперь мы воплотим в жизнь некоторые из её теорий, которые она не смогла реализовать ранее, преобразуя наш правительственный аппарат в соответствии с потребностями народа. Как инициатор реформ, авторитет Фишль также возрастёт."
ANR_support_Diona_1_desc:0 "§RДля выполнения этого решения требуется влияние Дионы более 2.§!\nВ отличие от других лидеров Вольфендома, бывший известный бармен Диона лучше умеет общаться с людьми и понимает важность поддержания хороших отношений с различными общественными группами. Теперь мы отправим её вести переговоры с новыми группами, сформировавшимися в Вольфендоме — от профсоюзов до сельскохозяйственных кооперативов, коллективных предприятий, новых торговых палат и отрядов народной обороны — заключая соглашения о сотрудничестве и одновременно вводя определённый контроль над этими людьми, чтобы обеспечить внутреннюю стабильность и безопасность Вольфендома."
ANR_support_Diona_2_desc:0 "§RДля выполнения этого решения требуется влияние Дионы более 3.\nЭто увеличит влияние Дионы на 1!§!\nДиона из Спрингвейла после прибытия в Вольфендом занималась координацией производства и коммерческой деятельности, поэтому она лучше других осознаёт важность инфраструктуры — это кровеносная система нашего выживания, связывающая все производственные звенья. Теперь, благодаря сбору средств и государственным субсидиям, мы готовы реализовать её план строительства инфраструктуры, и репутация Дионы также возрастёт."
ANR_support_Diona_3_desc:0 "§RЭто увеличит влияние Дионы на 1!§!\nИз-за ограниченных размеров нашего правительства мы не можем полностью контролировать всё растущее производство в Вольфендоме, поэтому коммерция возникла из щелей нашего контроля и проявила удивительную жизнеспособность. Мы также обнаружили, что некоторые проекты, которые трудно реализовать правительству, легко выполнить новым предпринимателям, поэтому наше сотрудничество с этими бизнесменами возникло естественно. По крайней мере на данный момент, эта коммерческая деятельность выгодна жителям Вольфендома. Чтобы такая выгода лучше служила Вольфендому, мы введём льготную политику для развития бизнеса, и это поручим Дионе, у которой более тесные связи с предпринимателями."
ANR_support_Razor_1_desc:0 "§RДля выполнения этого решения требуется, чтобы влияние всех трёх других кандидатов было меньше 5.§!\nС момента создания нашей армии они постоянно сражались — с врагами, с дикими зверями, с суровой природой. В этих боях выявились многие проблемы нашей армии и родились новые тактические инновации. Рэйзор как лидер армии обобщил эти проблемы и опыт и будет их совершенствовать."
ANR_support_Razor_2_desc:0 "§RДля выполнения этого решения требуется, чтобы влияние всех трёх других кандидатов было меньше 5.\nКроме того, это уменьшит влияние всех трёх кандидатов на 1!§!\nВнешняя угроза уже близка. Чтобы гарантировать мир в Вольфендоме в возможной войне, мы продолжим организовывать силы самообороны, для чего нужно оружие. Рэйзор займётся закупкой оружия и обучением войск. Его ловкость и активность запомнятся жителям Вольфендома."
ANR_support_Razor_3_desc:0 "§RЭто уменьшит влияние всех трёх кандидатов на 1!§!\nОдного лишь материального оснащения войск недостаточно для победы; нужно также вооружить их духовно, вооружить наш народ. Прежде всего, нужно убедить их, что мы можем победить, чтобы они были готовы отдать пот и кровь ради этой цели. Рэйзор проведёт военный парад в Вольфендоме, демонстрируя народу нашу решимость и способность защитить себя."
ANR_oppose_Bennett_1_desc:0"§RДля выполнения этого решения требуется влияние Беннета более 3.\nКроме того, это уменьшит влияние Беннета на 1!§!\nЭнтузиазм и трудолюбие Беннета заставляют большинство людей прислушиваться к его словам, а не воспринимать их как пустые лозунги, как это часто бывает с нашей обычной пропагандой. Теперь мы отправим Беннета с речами, чтобы поднять боевой дух народа. Это, несомненно, полезно для коллектива Вольфендома, но, возможно, это также подрывает его добрую репутацию."
ANR_oppose_Bennett_2_desc:0"§RДля выполнения этого решения требуется влияние Беннета более 3.\nКроме того, это уменьшит влияние Беннета на 1!§!\nЭнтузиазм и трудолюбие Беннета видны всем. Народ часто воспринимает его как «старшего брата по соседству», а не как высокопоставленного бюрократа — в Тейвате, какой высокопоставленный чиновник будет таскать стройматериалы на себе и учить людей, как сажать растения? Это также даёт ему своего рода авторитет. Теперь мы отправим Беннета призывать людей к обязательным работам, чтобы работать ради нашего завтра. Это, несомненно, полезно для коллектива Вольфендома, но, возможно, это также подрывает его добрую репутацию."
ANR_oppose_Fischl_1_desc:0"§RДля выполнения этого решения требуется влияние Фишль более 3.\nКроме того, это уменьшит влияние Фишль на 1!§!\nВ Вольфендом постоянно прибывают беженцы, и каждый день возникает бесчисленное множество дел, требующих решения; к тому же наше недавно созданное правительство не обладает достаточными административными возможностями, чтобы быстро их решать. Теперь мы заставим Фишль возглавить сверхурочную работу и мобилизуем всех административных сотрудников на работу сверхурочно, чтобы справиться с проблемами и реализовать наши планы. Постоянно работающая сверхурочно госпожа Фишль, возможно, потеряет влияние из-за снижения публичности."
ANR_oppose_Fischl_2_desc:0"§RДля выполнения этого решения требуется влияние Фишль более 3.\nКроме того, это уменьшит влияние Фишль на 1!§!\nТеперь мы увидели огромную силу внешней доброй воли, что в некоторой степени является заслугой Фишль, главного исполнителя внешней пропаганды. Теперь мы попросим её продолжить свою работу, расширяя нашу пропаганду и сбор пожертвований, чтобы получить больше материальной помощи извне! Пока мы продолжаем работать сверхурочно, наши запасы будут расти! Так что, не прекращайте работать сверхурочно!"
ANR_oppose_Diona_1_desc:0"§RДля выполнения этого решения требуется влияние Дионы более 3.\nКроме того, это уменьшит влияние Дионы на 1!§!\nОчевидно, что в этом мире не все люди — ангелы. В нашем Вольфендоме появляется всё больше смутьянов и даже заговорщиков, стремящихся свергнуть нас. Чтобы помешать им нарушить мир и стабильность Вольфендома, мы нанесём упреждающий и решительный удар, показав им, какой силой и решимостью обладает наше временное правительство. Операцию возглавит Диона, которая, по её словам, будет действовать с той же решимостью, с какой она стремится уничтожить винную промышленность Мондштадта… хотя Фишль надеется, что она выберет другую цель. Некоторые торговые палаты, кажется, сомневаются в наших действиях, но это необходимо сделать."
ANR_oppose_Diona_2_desc:0"§RДля выполнения этого решения требуется влияние Дионы более 3.\nКроме того, это уменьшит влияние Дионы на 1!§!\nКак лидер Спрингвейла, окружённого множеством военачальников, Диона хорошо знает важность вооружений. По её совету мы уже начали подготовку к расширению нашего военного производства. Некоторые называют действия Дионы «разрушением свободного рынка», но если мы не сможем защитить Вольфендом, здесь не будет ни свободы, ни рынка, останется только разруха."
ANR_oppose_Razor_1_desc:0"§RДля выполнения этого решения требуется, чтобы влияние всех трёх других кандидатов было меньше 5.§!\nРэйзор, выросший вместе с временным правительством Вольфендома, хорошо знает важность переговоров. По его инициативе мы проведём демократические консультации для содействия сотрудничеству между сторонами, координации развития всего Вольфендома и достижения наших общих целей."
ANR_oppose_Razor_2_desc:0"§RДля выполнения этого решения требуется, чтобы влияние всех трёх других кандидатов было меньше 3.\nКроме того, это увеличит влияние всех трёх кандидатов на 1!§!\nДля защиты Вольфендома нужна не только армия, но и экономическая система, работающая на войну. Теперь Рэйзор использует своё влияние для защиты Вольфендома, готовя оружие и ускоряя экономическую мобилизацию. Заставлять только что обустроившихся жителей Вольфендома делать это, конечно, тяжело, но мы вынуждены это сделать."

