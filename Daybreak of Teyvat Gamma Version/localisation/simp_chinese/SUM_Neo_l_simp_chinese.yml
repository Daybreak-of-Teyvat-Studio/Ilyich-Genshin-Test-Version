 SUM_Neo_SDH.180.b:"留一支后手"
 SUM_SDH_WAR_Forge_Move:"随军匠坊"
 SUM_SDH_WAR_Forge_Move_desc:"铁作坊随军走，缺什么现造什么。"
 SUM_Neo_SDH.181.t:"随军匠坊"
 SUM_Neo_SDH.181.d:"铁作坊随军走，缺什么现造什么。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。"
