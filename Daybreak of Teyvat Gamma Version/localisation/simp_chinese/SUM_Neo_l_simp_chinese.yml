 SUM_Neo_SGS.105.b:"让官署的法度作证"
 SUM_SGS_RB_Mint_Dune:"铸钱"
 SUM_SGS_RB_Mint_Dune_desc:"开炉铸钱，成色与重量刻在钱边。"
 SUM_Neo_SGS.106.t:"铸钱"
 SUM_Neo_SGS.106.d:"开炉铸钱，成色与重量刻在钱边。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
