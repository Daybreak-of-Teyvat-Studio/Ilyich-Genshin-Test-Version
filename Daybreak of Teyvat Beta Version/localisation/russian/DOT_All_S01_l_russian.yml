 Elementary_Education:0 "Начальное образование"
 Elementary_Education_desc:0 "История признаёт великими тех, кто трудился ради общей цели; опыт превозносит тех, кто приносит счастье большинству; религия учит, что идеалы — это самопожертвование. Если мы выберем служение человечеству, то не согнёмся под тяжестью, ибо это служение — наша радость. Наше счастье принадлежит миллионам, и перед нашим прахом благородные прольют слёзы."
