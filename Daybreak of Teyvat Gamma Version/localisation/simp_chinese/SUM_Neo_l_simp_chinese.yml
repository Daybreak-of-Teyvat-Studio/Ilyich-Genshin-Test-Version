 SUM_SDH_RC_Trade_Treaty_desc:"与外邦通商而约，约里写清税则与护侨。"
 SUM_Neo_SDH.151.t:"通商之约"
 SUM_Neo_SDH.151.d:"与外邦通商而约，约里写清税则与护侨。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
