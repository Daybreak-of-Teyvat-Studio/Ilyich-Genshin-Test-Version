 DOT_Tech.3.d:"Fill it, fill it, fill it, fill it, fill it!\nThy body shall serve beneath me; my fate shall be bound to thy blade. Answer the call ordained by heaven; if thou wilt abide by this vow and this covenant, speak forth!\nI vow to uphold all good in this world; I vow to slay all evil that dwells within it.\nBreak through the wheel of restraint and manifest, guardian of the scales!"
