 SUM_SDH_RC_Border_Talk_desc:"与邻邦一里一里地谈边界，谈不拢就先搁着。"
 SUM_Neo_SDH.152.t:"边界磋商"
 SUM_Neo_SDH.152.d:"与邻邦一里一里地谈边界，谈不拢就先搁着。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SDH.152.a:"重立赤王的旧制"
 SUM_Neo_SDH.152.b:"重建城邦的议会"
 SUM_SDH_RC_Keep_Old:"旧例照行"
 SUM_SDH_RC_Keep_Old_desc:"主母的旧例能留的都留，只是再加一层公议。改得慢，才不容易翻车。"
 SUM_Neo_SDH.153.t:"旧例照行"
 SUM_Neo_SDH.153.d:"主母的旧例能留的都留，只是再加一层公议。改得慢，才不容易翻车。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SDH.153.a:"召集能战之众"
 SUM_Neo_SDH.153.b:"召集能谋之士"
 SUM_SDH_RC_Quiet_Grow:"守成"
 SUM_SDH_RC_Quiet_Grow_desc:"不折腾不扩张，把眼下的日子过稳。沙漠里最难得的就是稳。"
 SUM_Neo_SDH.154.t:"守成"
 SUM_Neo_SDH.154.d:"不折腾不扩张，把眼下的日子过稳。沙漠里最难得的就是稳。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SDH.154.a:"以神权号令沙漠"
 SUM_Neo_SDH.154.b:"以律法约束诸城"
 SUM_SDH_RC_Oasis_Democracy:"绿洲自治既成"
 SUM_SDH_RC_Oasis_Democracy_desc:"哈德拉玛维特的几处绿洲各自立了宪章，代表按月议事，法官按季巡判，盐与水的账贴在碑上。主母的厅改成了陈情处，谁有话说，推门就进。"
 SUM_Neo_SDH.155.t:"绿洲自治既成"
 SUM_Neo_SDH.155.d:"哈德拉玛维特的几处绿洲各自立了宪章，代表按月议事，法官按季巡判，盐与水的账贴在碑上。主母的厅改成了陈情处，谁有话说，推门就进。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。"
 SUM_Neo_SDH.155.a:"把遗迹挖开"
 SUM_Neo_SDH.155.b:"把遗迹封回去"
 SUM_SDH_RC_Old_Order:"沙地守成"
 SUM_SDH_RC_Old_Order_desc:"哈德拉玛维特与雨林重划了账：贡赋减，戍兵撤，地界不动。主母的规矩照旧，只是多了一层要经公议的过场。日子过得比前几年安稳。"
 SUM_Neo_SDH.156.t:"沙地守成"
 SUM_Neo_SDH.156.d:"哈德拉玛维特与雨林重划了账：贡赋减，戍兵撤，地界不动。主母的规矩照旧，只是多了一层要经公议的过场。日子过得比前几年安稳。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SDH.156.a:"重立赤王的旧制"
 SUM_Neo_SDH.156.b:"重建城邦的议会"

 #### 开战须弥 · 雨林的门 ####
 SUM_SDH_WAR_The_Storm_Rises:"风起东向"
 SUM_SDH_WAR_The_Storm_Rises_desc:"哈德拉玛维特的粮、盐与商路，多半还攥在雨林手里。断了敕令只是名义上的事，要真把雨林从沙漠的账本上划掉，还得动兵。"
 SUM_Neo_SDH.157.t:"风起东向"
 SUM_Neo_SDH.157.d:"哈德拉玛维特的粮、盐与商路，多半还攥在雨林手里。断了敕令只是名义上的事，要真把雨林从沙漠的账本上划掉，还得动兵。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SDH.157.a:"以动员令起兵"
 SUM_Neo_SDH.157.b:"以盟约召集部族"
 SUM_SDH_WAR_Call_All:"召集各部"
 SUM_SDH_WAR_Call_All_desc:"召集令传遍各部，来的比估的多。来的人带的兵器五花八门，可都听号令。"
 SUM_Neo_SDH.158.t:"召集各部"
 SUM_Neo_SDH.158.d:"召集令传遍各部，来的比估的多。来的人带的兵器五花八门，可都听号令。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SDH.158.a:"直取雨林关隘"
 SUM_Neo_SDH.158.b:"先断其商路"
 SUM_SDH_WAR_War_Fund:"征军费"
 SUM_SDH_WAR_War_Fund_desc:"盐路出一半，商户出一半，凑出这笔军费。出钱的人等着打赢。"
 SUM_Neo_SDH.159.t:"征军费"
 SUM_Neo_SDH.159.d:"盐路出一半，商户出一半，凑出这笔军费。出钱的人等着打赢。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SDH.159.a:"把话说给雨林人听"
 SUM_Neo_SDH.159.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Ration:"配给"
 SUM_SDH_WAR_Ration_desc:"粮与盐按口配给，先军后民。配给的规矩贴在门外。"
 SUM_Neo_SDH.160.t:"配给"
 SUM_Neo_SDH.160.d:"粮与盐按口配给，先军后民。配给的规矩贴在门外。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。"
 SUM_Neo_SDH.160.a:"倾全境之力"
 SUM_Neo_SDH.160.b:"留一支后手"
 SUM_SDH_WAR_War_Council:"定三路"
 SUM_SDH_WAR_War_Council_desc:"军议定三路：一路沿盐路，一路穿沙地，一路绕绿洲。"
 SUM_Neo_SDH.161.t:"定三路"
 SUM_Neo_SDH.161.d:"军议定三路：一路沿盐路，一路穿沙地，一路绕绿洲。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。"
 SUM_Neo_SDH.161.a:"以动员令起兵"
 SUM_Neo_SDH.161.b:"以盟约召集部族"
 SUM_SDH_WAR_Proclaim:"讨雨林檄"
 SUM_SDH_WAR_Proclaim_desc:"檄文写的是账：欠的水、占的地、多收的税，一条一条列着。"
 SUM_Neo_SDH.162.t:"讨雨林檄"
 SUM_Neo_SDH.162.d:"檄文写的是账：欠的水、占的地、多收的税，一条一条列着。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SDH.162.a:"直取雨林关隘"
 SUM_Neo_SDH.162.b:"先断其商路"
 SUM_SDH_WAR_Night_Wind:"借风夜行"
 SUM_SDH_WAR_Night_Wind_desc:"大军等风起才动，风里辨不清人和影。"
 SUM_Neo_SDH.163.t:"借风夜行"
 SUM_Neo_SDH.163.d:"大军等风起才动，风里辨不清人和影。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SDH.163.a:"把话说给雨林人听"
 SUM_Neo_SDH.163.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Star_Guide:"观星定向"
 SUM_SDH_WAR_Star_Guide_desc:"夜行靠星定向，星光一暗就停，停了就地卧倒。"
 SUM_Neo_SDH.164.t:"观星定向"
 SUM_Neo_SDH.164.d:"夜行靠星定向，星光一暗就停，停了就地卧倒。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。"
 SUM_Neo_SDH.164.a:"倾全境之力"
 SUM_Neo_SDH.164.b:"留一支后手"
 SUM_SDH_WAR_Camel_Load:"驼队辎重"
 SUM_SDH_WAR_Camel_Load_desc:"辎重全靠驼，驼比车能多喝几天的干。"
 SUM_Neo_SDH.165.t:"驼队辎重"
 SUM_Neo_SDH.165.d:"辎重全靠驼，驼比车能多喝几天的干。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH.165.a:"以动员令起兵"
 SUM_Neo_SDH.165.b:"以盟约召集部族"
 SUM_SDH_WAR_Oasis_Leap:"沿绿洲跳进"
 SUM_SDH_WAR_Oasis_Leap_desc:"沿绿洲一座座跳，跳一步，补给近一分。"
 SUM_Neo_SDH.166.t:"沿绿洲跳进"
 SUM_Neo_SDH.166.d:"沿绿洲一座座跳，跳一步，补给近一分。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SDH.166.a:"直取雨林关隘"
 SUM_Neo_SDH.166.b:"先断其商路"
 SUM_SDH_WAR_Silent_Move:"无声行军"
 SUM_SDH_WAR_Silent_Move_desc:"命全军训无声行军，铃铛不响，蹄子包布。"
 SUM_Neo_SDH.167.t:"无声行军"
 SUM_Neo_SDH.167.d:"命全军训无声行军，铃铛不响，蹄子包布。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。"
 SUM_Neo_SDH.167.a:"把话说给雨林人听"
 SUM_Neo_SDH.167.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Storm_Keep:"强攻戍所"
 SUM_SDH_WAR_Storm_Keep_desc:"雨林伸进沙漠的戍所先得拔掉，拔掉一处，沙漠的脸面就松一分。"
 SUM_Neo_SDH.168.t:"强攻戍所"
 SUM_Neo_SDH.168.d:"雨林伸进沙漠的戍所先得拔掉，拔掉一处，沙漠的脸面就松一分。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。"
 SUM_Neo_SDH.168.a:"倾全境之力"
 SUM_Neo_SDH.168.b:"留一支后手"
 SUM_SDH_WAR_Siege_Rig:"造攻具"
 SUM_SDH_WAR_Siege_Rig_desc:"照遗迹图样造攻具，笨重，可戍所的墙不怕云梯。"
 SUM_Neo_SDH.169.t:"造攻具"
 SUM_Neo_SDH.169.d:"照遗迹图样造攻具，笨重，可戍所的墙不怕云梯。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
 SUM_Neo_SDH.169.a:"以动员令起兵"
 SUM_Neo_SDH.169.b:"以盟约召集部族"
 SUM_SDH_WAR_Cut_Canal:"掘渠"
 SUM_SDH_WAR_Cut_Canal_desc:"把戍所上游的渠掘断，守军有水而汲不上。"
 SUM_Neo_SDH.170.t:"掘渠"
 SUM_Neo_SDH.170.d:"把戍所上游的渠掘断，守军有水而汲不上。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH.170.a:"直取雨林关隘"
 SUM_Neo_SDH.170.b:"先断其商路"
 SUM_SDH_WAR_Night_Wall:"夜攀"
 SUM_SDH_WAR_Night_Wall_desc:"挑最灵便的人攀墙，攀上去的不到一半，墙上的灯却灭了。"
 SUM_Neo_SDH.171.t:"夜攀"
 SUM_Neo_SDH.171.d:"挑最灵便的人攀墙，攀上去的不到一半，墙上的灯却灭了。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SDH.171.a:"把话说给雨林人听"
 SUM_Neo_SDH.171.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Keep_Pass:"据关而守"
 SUM_SDH_WAR_Keep_Pass_desc:"关隘易手便改成自己的戍所，门朝哪边开由沙漠定。"
 SUM_Neo_SDH.172.t:"据关而守"
 SUM_Neo_SDH.172.d:"关隘易手便改成自己的戍所，门朝哪边开由沙漠定。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。"
 SUM_Neo_SDH.172.a:"倾全境之力"
 SUM_Neo_SDH.172.b:"留一支后手"
 SUM_SDH_WAR_Turn_Guard:"策反戍卒"
 SUM_SDH_WAR_Turn_Guard_desc:"雨林的戍卒大半是雇来的，派去的人只问一句：你替谁当兵。"
 SUM_Neo_SDH.173.t:"策反戍卒"
 SUM_Neo_SDH.173.d:"雨林的戍卒大半是雇来的，派去的人只问一句：你替谁当兵。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SDH.173.a:"以动员令起兵"
 SUM_Neo_SDH.173.b:"以盟约召集部族"
 SUM_SDH_WAR_Village_Talk:"联络漠边村社"
 SUM_SDH_WAR_Village_Talk_desc:"雨林边的村社也在交重税，派去的人不带兵器，只带账本。"
 SUM_Neo_SDH.174.t:"联络漠边村社"
 SUM_Neo_SDH.174.d:"雨林边的村社也在交重税，派去的人不带兵器，只带账本。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。"
 SUM_Neo_SDH.174.a:"直取雨林关隘"
 SUM_Neo_SDH.174.b:"先断其商路"
 SUM_SDH_WAR_Amnesty:"宽赦"
 SUM_SDH_WAR_Amnesty_desc:"凡归降者不问旧事，愿留的分地，愿走的给粮。"
 SUM_Neo_SDH.175.t:"宽赦"
 SUM_Neo_SDH.175.d:"凡归降者不问旧事，愿留的分地，愿走的给粮。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
 SUM_Neo_SDH.175.a:"把话说给雨林人听"
 SUM_Neo_SDH.175.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Buy_Clerk:"收买书吏"
 SUM_SDH_WAR_Buy_Clerk_desc:"关卡靠书吏记档，钱递过去，档就换一份。"
 SUM_Neo_SDH.176.t:"收买书吏"
 SUM_Neo_SDH.176.d:"关卡靠书吏记档，钱递过去，档就换一份。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SDH.176.a:"倾全境之力"
 SUM_Neo_SDH.176.b:"留一支后手"
 SUM_SDH_WAR_False_News:"反间"
 SUM_SDH_WAR_False_News_desc:"把假消息透给雨林的斥候，让他们说给自己人听。"
 SUM_Neo_SDH.177.t:"反间"
 SUM_Neo_SDH.177.d:"把假消息透给雨林的斥候，让他们说给自己人听。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。"
 SUM_Neo_SDH.177.a:"以动员令起兵"
 SUM_Neo_SDH.177.b:"以盟约召集部族"
 SUM_SDH_WAR_Supply:"辎重线"
 SUM_SDH_WAR_Supply_desc:"辎重沿盐路铺开，一站接一站，前线吃什么看这条线。"
 SUM_Neo_SDH.178.t:"辎重线"
 SUM_Neo_SDH.178.d:"辎重沿盐路铺开，一站接一站，前线吃什么看这条线。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。"
