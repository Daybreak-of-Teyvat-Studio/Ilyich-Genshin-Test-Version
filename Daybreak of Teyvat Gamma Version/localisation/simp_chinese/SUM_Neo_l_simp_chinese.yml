 SUM_Neo.135.t:"税法改革"
 SUM_Neo.135.d:"税法改成按田亩与人头收，沙漠不再加倍纳税。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。高塔投下的影子越来越长，傍晚时就盖住了半条街。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。"
 SUM_Neo.135.a:"按学派议决行事"
 SUM_Neo.135.b:"听从乡野的呼声"
 SUM_Neo.136.t:"铸币权"
 SUM_Neo.136.d:"铸币权收归议会，市面上的私钱被兑回。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。教令院的门槛这几天被踩得很低，进去的人比出来的人多。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
 SUM_Neo.136.a:"以律法为绳"
 SUM_Neo.136.b:"以人情为度"
 SUM_Neo.137.t:"商队特许"
 SUM_Neo.137.d:"商队获得通行特许，雨林与沙漠之间的货开始流动。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。"
 SUM_Neo.137.a:"推进议会的议程"
 SUM_Neo.137.b:"把权柄交还民间"
 SUM_Neo.138.t:"奥摩斯开港"
 SUM_Neo.138.d:"奥摩斯港对七国开港，须弥第一次向外商敞开。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。高塔投下的影子越来越长，傍晚时就盖住了半条街。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。码头新铺的石板还湿着。"
 SUM_Neo.138.a:"按学派议决行事"
 SUM_Neo.138.b:"听从乡野的呼声"
 SUM_Neo.139.t:"七国通商"
 SUM_Neo.139.d:"须弥与邻国签下通商条款，香料与咖啡换了出路。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。"
 SUM_Neo.139.a:"以律法为绳"
 SUM_Neo.139.b:"以人情为度"
 SUM_Neo.140.t:"须弥银行"
 SUM_Neo.140.d:"须弥银行开业，学者可以借贷去做研究。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。高塔投下的影子越来越长，傍晚时就盖住了半条街。"
