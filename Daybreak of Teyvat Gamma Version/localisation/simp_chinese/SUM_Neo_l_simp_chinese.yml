 SUM_Neo.209.t:"永恒绿洲"
 SUM_Neo.209.d:"永恒绿洲的幻象悬在沙海上空。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。教令院的门槛这几天被踩得很低，进去的人比出来的人多。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。高塔投下的影子越来越长，傍晚时就盖住了半条街。"
