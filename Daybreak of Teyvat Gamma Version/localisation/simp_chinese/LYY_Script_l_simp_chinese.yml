#####################
 LYY_Morax:"£mora 摩拉克斯"
 LYY_Morax_desc:"岩王帝君为七神中最古者，历岁已久。彼犹记魔神战争之火方熄，最后七位魔神各登神座，自兹终结魔神战争之世。七神性格各异，相去万里，而皆负引人类之圣责。时代迁变，七神多有更替。至于今日，最初七神之中，惟余二位：岩王帝君，与那位自由快活之风神。七神中第二古者，即彼自由快活之风神巴巴托斯。两千年前巴巴托斯初临璃月，岩王帝君第一念曰：此同僚于履职时遇难，需我之助。故未待其自风中落下，岩神已备迎接此邻国神明，只待开口，便将倾其所为。然风神乃以一瓶酒递于其前：「此乃蒙德之酒，你要尝尝么？」为送一瓶酒而弃职责，实在荒唐。虽然，彼风神仍不断来访，至璃月港四处游玩，又常向岩神问出种种奇问。此风神之好奇，与其手中之酒同无穷尽。自那时起，彼世之七神往往相聚于璃月。至今岩王帝君仍能忆及那些酒之味。此后世界迁变不已，彼所熟识者皆渐消逝。七神之位迭更，酒会之上七人已逝其五。最初七神引人类之古责，终于亦为一些新任神明视若无物。亲历三千余年风霜，最坚之岩亦能被磨。而风亦不复至其侧。某微雨之晨，古帝君行于璃月港，闻一商贾语其属曰：「你尽职甚善，去歇罢。」岩王帝君于熙攘人群中立久。「我之职责，亦已毕乎？」神灵如此自问。璃月港中祠庙凡三处，皆塑帝君像，像前石案为香火所熏，黑如墨。守祠老吏云：此案百年未换，换则非旧物。归离原田夫每岁春秋二祭，祭毕分胙，不争多寡。绝云间仙众亦有祭，惟不设像，以石为位。"
 LYY_Zhongli:"钟离"
 LYY_Zhongli_desc:"璃月之俗，请仙与送仙并重。最擅送别一道者，莫过于胡家传承七十七代之往生堂。然往生堂堂主胡桃，其专在送别凡人。至于送别仙人之诸般仪式，则付与一位道上故交钟离。仙人与璃月共度漫长之岁，三千余年来升天者寥寥，此即谓一切相关之传统只能存于纸面，其时间跨度实太长，非若童子咬糖葫芦赴一会，老来尚可卧竹椅再睹之事。然即眼光最苛、沉溺旧纸堆之老学究，亦不能于往生堂所办送仙典仪挑出一毫之病。非独仪中人之服饰合度，仪行之吉时、地、器，乃至当日天气、仪之长短、许观礼者之数、观礼者之身份职业年岁，凡此尽纳计量之中，亦无一不合节。若人以通古晓今称钟离，彼惟无奈一笑，叹曰：「我惟，记性颇佳。」其人善辨古器，一望即知其年，云铜色不可伪。往生堂凡有送仙之役，必先三日斋，钟离独居，不见客。"
 Zhongli:"摩拉克斯"
 Zhongli_desc:"§Y千年未曾易世之君§!\n§g岩王帝君治璃月之时已达千年，虽俗世变幻万千而帝君屹立不倒，使百姓推翻此千年之君，显然不易。§!\n原初七神，惟余风岩二君，而存活又勤于治其国者，似惟璃月之岩神摩拉克斯。守璃月苍生千年之后，古老之岩神似终觉己身不能再抗磨损，须得一试璃月之机，试七星与同己出生入死之诸仙，以断璃月能否离己而去。而此机，随愚人众于璃月境内之动愈发猖獗，终于至矣。往生堂阶前有古柏一株，钟离常立于其下，久而不语。人或问之，答曰：听风。"
 LYY_NingGuang:"凝光"
 LYY_NingGuang_desc:"少有人能想到，于阶层固化日深之璃月，尚有此一位出身寒微之巨富在政坛大放异彩。凝光以最不可思议之致富之能，有力冲激为传统门阀把持之璃月港政商界，扶植起一批听命于己之新企业、新高管、新员工。虽然，彼仍与老牌富豪之家保持冷淡之合作，而更专于预防民粹者之异动与仙人不满。在其眼中，官僚与自命不凡者之感性思维乃使璃月港裹足不前之罪魁。惟一心求财，将一切人际之关系与情感之冲动尽置于合同之天平上权衡，璃月人方能冲出迷雾，直抵彼岸。群玉阁之中，凡牍皆以朱墨别其缓急，朱者必当日毕。"
 LYY_GanYu:"甘雨"
 LYY_GanYu_desc:"于璃月，百姓多慕玉京台之生活，而于其中运转之则知之甚少。人知璃月七星为人中翘楚，握城市之命脉。然彼难知每一决议背后之数据所自，如何建立。人知每年新颁之条例皆给市面以全新之变数，却不知其如何自繁杂会议纪要中被摘出，渐整编为晓畅之文。甘雨，月海亭之秘书，担诸多世人不见之务。纵世人得知甘雨之位，恐亦难将此月海亭之秘书与破晓时分立于码头、安享早点之少女相联系。然于旭日东升之前，彼必复归高踞玉京台之上之月海亭，续完其契约。那是远在三千年前，彼与岩王帝君所签之契约。月海亭案上置三色签，凡牍入，先以色别之。其饮食甚简，早点惟清心一盏、糕一枚。"
 LYY_KeQing:"刻晴"
 LYY_KeQing_desc:"岩王帝君为璃月港带来繁荣，其治世威名化作演义传记，为人津津乐道。然而，身为离神最近之人，刻晴似为最乏敬畏者。「哼，说句不好听，摩拉克斯他真什么都懂么？」璃月七星随时留意港内大小之事，岩王帝君每年却只降临一次。千年之史已证追随帝君之步为正确之举，然刻晴终以为，生而为人，即当有人之骄傲，人之所想亦当见重。故彼常发与帝君相异之议，且一马当先付诸实行。如此激进之作，实取得不少杰出之成果，亦引来诸多岩王帝君虔诚信徒之反对。此反对于刻晴观之，无非偷懒之借口，惯于活于神明庇护之下，永不主动思人类之前景。然总须一人行于时代最前，亲手开创新路。玉衡星，自当仁不让。玉衡之署在玉京台东，门上无饰，惟悬一木牌。"
 LYY_ShenHe:"申鹤"
 LYY_ShenHe_desc:"申鹤本为驱邪世家旁系之子，却于种种机缘巧合之下，意外成为仙家弟子。名义上师从留云借风真君，然凭绝佳之根骨与悟性，速得其余几位仙人喜爱。日后陆续从诸仙处学，终以人类之身修出一身仙家术法。气质出尘，举手投足之间恍若可见仙气缭绕。一眼看去，谓为世外真仙亦不为过。然正因其长年隐修于山林之间，身边除几位仙人，来去者惟有些仙禽灵兽。积日既久，其性愈发淡漠疏远。"
 NingGuang:"凝光"
 NingGuang_desc:"珍如宝钻，远如星幽。凝光为掌重权之璃月七星之一，居天权星之位，识人心，擅话术。即于人人经商之璃月港，彼亦首屈一指之大商。凡见凝光者，皆为其惊人洞察与过人头脑所折服。不独如此，凝光之作亦甚独特。彼斥巨资搜集大量浮空石制成基盘，又于其上造一华美宫殿。浮空石托起空中幻城，使之终年悬于璃月港上空。此宫阁正如凝光本人，高不可测，远离众生，却轻易吸尽所有目光。震动商界之女富商、孩童最喜之温婉姐姐、玉京台宴上之名媛、甜食界之鉴赏名家，彼为千面佳人，亦为一永不可读懂之美丽谜题。群玉阁上下三层，阶以石为之，雨过则滑。"
 King_of_the_Millennium:"千年未易之君"
 Ganyu:"甘雨"
 Ganyu_desc:"饮必甘露，食必嘉禾。循循如仪，不罹罗网。于高居玉京台之七枚明星而言，甘雨乃璃月港错综情报数据之网之统筹者，璃月港行政效率之筑基人。繁杂之会议纪要、冗乱之报表数据，每日成堆之文书恍如流水，皆由其一手整编为晓畅明晰之文字，用以助七星每一决策与每一次协商，指示各部机构之流转。千百年之时光里，历任七星不停更迭，惟甘雨始终见证璃月港之繁华烟火。血脉中人之一面令其留连绚烂之灯市，仙之本亦使其怀念仙山与洞府之幽闲。于半人半仙之甘雨眼中，熙攘之人海与幽鸣之群峰，何者才更堪称归宿？其案头悬一铜铃，议事至夜则鸣，鸣则众散。"
 Shenhe:"申鹤"
 Shenhe_desc:"红尘渺渺，因果烟消。申鹤本为驱魔世家旁系之子，因故为留云借风真君所收养。于申鹤而言，留云借风真君为一位博学健谈之师。于留云借风真君而言，申鹤亦为其指点过之人类中最特别者。以人类之身与仙家同处非易事，然申鹤体质特殊、意志过人，又极有仙术之才，颇受众仙家认可。然长年累月修行，加以食仙草、饮山露之习，使其离人间之生活愈发遥远，甚至被当成神秘之白发仙人。性格中偶然流露之锋芒与身上绑缚之红绳，亦为其神秘再添一笔。若将其过去写成故事，想必有多个版本。天上仙女也好，白发魔头也罢，人将如何看待此神秘之女子？而掩藏于其身上之秘密与真心，亦如山间云雾一般难以捕捉。"
 Keqing:"刻晴"
 Keqing_desc:"霆霓之势，变革之星。璃月七星之一，玉衡星，刻晴。彼于帝君一言而决之璃月颇有微词，然实则神颇欣赏此等之人。身为璃月七星，刻晴乃不折不扣之行动派。若一事于其看来有价值、有必需，则必亲力亲为。譬如，彼曾亲踏璃月全境，将地势地貌牢记于心，以便日后能尽用每一寸之土。刻晴随时留意璃月境内大小之事，岩王帝君每年却只降临一次。数千年繁华之史，已证追随帝君之步为正确之举，然刻晴于此始终抱有顾虑，眼下璃月港之繁荣，如沙滩上之宏伟沙堡。定大海是否涨潮者，却非人类自己。帝君已守璃月千年，然下一千年，十千年，百千年，亦当如此乎？即此不得其答之问，使刻晴不断用力，丝毫不敢放松。于旁人观之，此为多余之忧，然刻晴不能坐视此潜在之患。此为璃月人未曾设想之未来。可总有人要行于时代最前，亲手开创新路。玉衡星刻晴，自当仁不让。其行不乘车，日行数十里，从者皆疲。"
 LYY_HuTao:"胡桃"
 LYY_Xiao:"魈"
 LYY_YunJin:"云堇"
 LYY_Marchosius:"马科修斯"
 LYY_YanFei:"烟绯"
 LYY_XingQiu:"行秋"
 LYY_Lanyan:"蓝砚"
 LYY_Lanyan_desc:"翦玉编春。于沉玉谷，每当居民需置家私，除精雕细刻之木桌木床，尚可选本地藤编师所制藤器。后者格调清新雅致，不失为一种好择。璃月港舶来之绫罗绸缎固美，然自家染出之布结实耐用，纹样与颜色瞧着亦亲切。打银与雕玉，更为沉玉谷手艺师之强项，璃月港珠宝老号明星斋不时遣人来看货。藤编、染布、打银、雕玉，及许多他艺，此诸域中最杰出之手艺人皆出沉玉谷，心灵手巧乃对其最好之形容。蓝砚即沉玉谷手工艺工会中一位藤编师。于幽静之山谷，碧水与古茶树之间，迷路之游人若遇一满身佩银之爱笑姑娘，那或许即外出采藤之蓝砚。请放心向其问路，热情之彼会带你出沉玉谷迷蒙之山雾，入白砖灰瓦之秀丽小镇翘英庄。谷中茶户多以藤器盛茶，谓竹器夺香。"
 LYY_XiangLing:"香菱"
 LYY_BeiDou:"北斗"
 LYY_QiQi:"七七"
 LYY_XinYan:"辛焱"
 LYY_BaiZhu:"白术"
 LYY_YeLan:"夜兰"
 LYY_ChongYun:"重云"
 LYY_Yaoyao:"瑶瑶"
 LYY_Xianyun:"闲云"
 LYY_Gaming:"嘉明"
 LYY_Gaming_desc:"遗珑埠码头货如轮转，商队与货物得安全高效穿梭于璃月各地乃至异域他乡，少不了镖师从中保驾护航。古往今来，走镖绝非易事，即商路已相对稳定之今日，一趟镖依然存在诸多变数。非此雇主临时更改路线，即彼客户挑刺拒收，途中亦不乏毛头小贼光顾骚扰，不走运则江洋大盗亦会大驾光临。虽说剑匣镖局能人辈出，然纵观镖局上下，真能上不得罪顾客、下不放过盗贼者，数来数去，惟嘉明而已。业务之能如此出众，商会自然热衷指定此少年镖师运其货。出镖局，嘉明之人气依然不减，街坊朋友提起皆竖大拇指，对此跑前跑后之热心小伙夸赞连连。「举手之劳耳！得闲来看我演舞兽戏，捧个人场便当无数，多谢你先，哈哈。」每受过其助者欲回礼道谢，彼皆如此打趣而答。镖车过后，道上遗车辙深二寸，雨则积水。"
 LYY_YaoYao:"瑶瑶"
 LYY_Childe:"达达利亚"
 LYY_Childe_desc:"虽已入愚人众最顶层之执行官列，而公子达达利亚之外表，似仍是一位稚气未脱之青年。如天鹅绒包裹之白银利刃，在其开朗自信之外表下，为锤炼至极之剑客之躯。彼为最年轻之愚人众执行官，亦为最危险之愚人众执行官之一。然而，公子似永远与其同僚不甚合得来。作为最纯粹之战士，彼于此充满阴谋之集体中显得格格不入。遗珑埠有舟自至冬来，泊三日，不见其货，惟见其人登岸向西。"
