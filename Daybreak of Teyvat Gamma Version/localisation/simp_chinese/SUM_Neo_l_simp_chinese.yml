 SUM_Neo.199.b:"把风险压在柜子里"
 SUM_Neo.200.t:"迎神登基"
 SUM_Neo.200.d:"新神登基，净善宫的旧神被移到偏殿。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。"
 SUM_Neo.200.a:"加速造神的工序"
