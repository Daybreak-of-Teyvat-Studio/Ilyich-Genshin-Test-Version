 ITA_regia_aeronautica_dynamic_modifier:0 "Regia Aeronautica"
 ITA_regia_aeronautica_dynamic_modifier_desc:0 "The newest branch of the Italian armed forces and was one of the greatest air forces in the world when it was formed, but has been lagging behind recently. By investing in our air force it can once again become the envy of the world."
