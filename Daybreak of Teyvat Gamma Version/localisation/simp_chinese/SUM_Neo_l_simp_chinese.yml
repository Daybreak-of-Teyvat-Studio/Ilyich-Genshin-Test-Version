 SUM_Neo.176.b:"把权柄交还民间"
 SUM_Neo.177.t:"常备军团"
 SUM_Neo.177.d:"常备军团成军，须弥第一次有了一支自己的兵。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
 SUM_Neo.177.a:"按学派议决行事"
 SUM_Neo.177.b:"听从乡野的呼声"
 SUM_Neo.178.t:"边境要塞"
 SUM_Neo.178.d:"要塞沿着须弥与邻国的边界排开。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。教令院的门槛这几天被踩得很低，进去的人比出来的人多。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。"
 SUM_Neo.178.a:"以律法为绳"
 SUM_Neo.178.b:"以人情为度"
 SUM_Neo.179.t:"斥候与测绘"
 SUM_Neo.179.d:"斥候把须弥全境画成一张图。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。"
 SUM_Neo.179.a:"推进议会的议程"
 SUM_Neo.179.b:"把权柄交还民间"
 SUM_Neo.180.t:"后勤驿站"
 SUM_Neo.180.d:"后勤驿站沿着铁路与水路铺开。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。教令院的门槛这几天被踩得很低，进去的人比出来的人多。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。"
 SUM_Neo.180.a:"按学派议决行事"
 SUM_Neo.180.b:"听从乡野的呼声"
 SUM_Neo.181.t:"沙漠战法"
 SUM_Neo.181.d:"军官把沙漠游击的战法写进操典。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。"
 SUM_Neo.181.a:"以律法为绳"
 SUM_Neo.181.b:"以人情为度"
 SUM_Neo.182.t:"统一操典"
 SUM_Neo.182.d:"全军训典统一，口令传到最远的哨所。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。"
 SUM_Neo.182.a:"推进议会的议程"
 SUM_Neo.182.b:"把权柄交还民间"
 SUM_Neo.183.t:"引进外械"
 SUM_Neo.183.d:"军械从外国引进，须弥开始自己仿造。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。"
 SUM_Neo.183.a:"按学派议决行事"
 SUM_Neo.183.b:"听从乡野的呼声"
 SUM_Neo.184.t:"新式陆军"
 SUM_Neo.184.d:"须弥有了新式陆军。它是共和国最后的保险。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。高塔投下的影子越来越长，傍晚时就盖住了半条街。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。"
 SUM_Neo.184.a:"以律法为绳"
 SUM_Neo.184.b:"以人情为度"
 SUM_Neo.185.t:"须弥之盾"
 SUM_Neo.185.d:"须弥之盾立于雨林与沙漠之间，替共和国挡住外敌。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
 SUM_Neo.185.a:"推进议会的议程"
 SUM_Neo.185.b:"把权柄交还民间"
 SUM_Neo.186.t:"共和既立"
 SUM_Neo.186.d:"宪法生效的那天，学者、商人、猎人与守村人在议事厅前站成一片。须弥成了一个共和国。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。教令院的门槛这几天被踩得很低，进去的人比出来的人多。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。"
 SUM_Neo.186.a:"按学派议决行事"
 SUM_Neo.186.b:"听从乡野的呼声"
 SUM_Neo.187.t:"镀金公社"
 SUM_Neo.187.d:"镀金旅团与沙漠民推翻了教令院的最后一座塔。须弥的财富第一次留在须弥人手里。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。高塔投下的影子越来越长，傍晚时就盖住了半条街。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。"
 SUM_Neo.187.a:"以律法为绳"
 SUM_Neo.187.b:"以人情为度"

 #################### 丙线 · 造神王座 ####################
 SUM_GT_Throne_of_Genesis:"造神王座"
 SUM_GT_Throne_of_Genesis_desc:"教令院的地下，人偶的躯体接上了神之心。须弥要在人手里造出一个神，替他们统治须弥。"
 SUM_GT_Gen_Resume:"重启造神"
 SUM_GT_Gen_Resume_desc:"大贤者下令重启造神计划，档案从密室里搬出来。"
 SUM_GT_Gen_Shell:"人偶的躯体"
 SUM_GT_Gen_Shell_desc:"人偶的躯体被重新拼装，关节用上赤王时代的零件。"
 SUM_GT_Gen_Core:"神之心"
 SUM_GT_Gen_Core_desc:"一颗神之心被装进人偶的胸腔。"
 SUM_GT_Gen_Test:"试验场"
 SUM_GT_Gen_Test_desc:"试验在沙丘下进行，受试者名单被封存。"
 SUM_GT_Gen_Divinity:"灌注神性"
 SUM_GT_Gen_Divinity_desc:"神性被一点一点灌进去，人偶的手指开始动。"
 SUM_GT_Gen_Knowledge:"知识的洪流"
 SUM_GT_Gen_Knowledge_desc:"虚空终端把全部知识灌入人偶，它学会的第一句话是须弥。"
 SUM_GT_Gen_Mechanic:"机械之神"
 SUM_GT_Gen_Mechanic_desc:"人偶站了起来。它比任何一位贤者都更像神。"
 SUM_GT_Gen_Perfect:"完美的人偶"
 SUM_GT_Gen_Perfect_desc:"人偶的躯体被调到完美，教令院拒绝承认它只是机械。"
 SUM_GT_Gen_Ritual:"降神仪式"
 SUM_GT_Gen_Ritual_desc:"降神仪式在净善宫前举行，六大学派全部到场。"
 SUM_GT_Gen_Awaken:"新神睁眼"
 SUM_GT_Gen_Awaken_desc:"新神睁眼。它看的第一样东西，是跪下的贤者们。"
 SUM_GT_Gen_Name:"为新神命名"
 SUM_GT_Gen_Name_desc:"贤者们为新神取名，名字里有赤王，也有教令院。"
 SUM_GT_Gen_Enthrone:"迎神登基"
 SUM_GT_Gen_Enthrone_desc:"新神登基，净善宫的旧神被移到偏殿。"
 SUM_GT_Gen_Complete:"造神完成"
 SUM_GT_Gen_Complete_desc:"造神完成。须弥有了一位可以被指挥的神。"
 SUM_GT_Des_Memory:"赤王的记忆"
 SUM_GT_Des_Memory_desc:"贤者们翻出赤王的记忆，说那是须弥更早的骄傲。"
 SUM_GT_Des_Pillar:"列柱沙原"
 SUM_GT_Des_Pillar_desc:"列柱沙原的旧柱被重新立起，柱上刻满新写的颂词。"
 SUM_GT_Des_City:"居尔城复兴"
 SUM_GT_Des_City_desc:"居尔城的废墟上重新起了墙。"
 SUM_GT_Des_Cult:"赤王信徒"
 SUM_GT_Des_Cult_desc:"赤王的信徒被收编，成了新神的第一批祭司。"
 SUM_GT_Des_Gold:"黄金之梦"
 SUM_GT_Des_Gold_desc:"黄金时代的梦被重新讲给须弥人听。"
 SUM_GT_Des_Remnant:"残响"
 SUM_GT_Des_Remnant_desc:"沙漠深处的残响被当成神谕。"
 SUM_GT_Des_Echo:"沙漠的回声"
 SUM_GT_Des_Echo_desc:"回声在沙丘间传开，说赤王要回来了。"
 SUM_GT_Des_Oasis:"永恒绿洲"
 SUM_GT_Des_Oasis_desc:"永恒绿洲的幻象悬在沙海上空。"
 SUM_GT_Des_King:"沙中之王"
 SUM_GT_Des_King_desc:"新神自称沙中之王的继承者。"
 SUM_GT_Des_Legion:"赤王军团"
 SUM_GT_Des_Legion_desc:"赤王军团成军，队伍里多是沙漠里的佣兵。"
 SUM_GT_Des_Wrath:"审判之日"
 SUM_GT_Des_Wrath_desc:"审判之日定下，教令院开始清算旧账。"
 SUM_GT_Des_Revive:"赤王归来"
 SUM_GT_Des_Revive_desc:"贤者们宣称赤王归来，附在人偶的神身上。"
 SUM_GT_Des_Throne:"沙漠王座"
 SUM_GT_Des_Throne_desc:"沙漠王座在居尔城立起，须弥的旧神被遗忘。"
 SUM_GT_Dot_Visit:"多托雷到访"
 SUM_GT_Dot_Visit_desc:"多托雷亲自来到须弥城，教令院以礼相待。"
 SUM_GT_Dot_Deal:"与愚人众的协定"
 SUM_GT_Dot_Deal_desc:"须弥与至冬签下协定，条款里的手写在页边。"
 SUM_GT_Dot_Lab:"地下实验室"
 SUM_GT_Dot_Lab_desc:"地下实验室扩建，通往沙丘下的洞窟。"
 SUM_GT_Dot_Subject:"试验体"
 SUM_GT_Dot_Subject_desc:"试验体的名册越来越长，多数是被流放的沙民。"
 SUM_GT_Dot_Wisdom:"知识的交易"
 SUM_GT_Dot_Wisdom_desc:"知识被拿来交易，教令院换回了机械的图纸。"
 SUM_GT_Dot_Machine:"机械造物"
 SUM_GT_Dot_Machine_desc:"机械造物从流水线上走下来，第一批就进了军营。"
 SUM_GT_Dot_Factory:"工厂量产"
 SUM_GT_Dot_Factory_desc:"工厂昼夜不停，须弥的天空蒙上灰。"
 SUM_GT_Dot_Weapon:"人偶兵器"
 SUM_GT_Dot_Weapon_desc:"人偶兵器列装，士兵开始害怕自己的同伴。"
 SUM_GT_Dot_Clone:"切片"
 SUM_GT_Dot_Clone_desc:"多托雷的切片在须弥走动，没人分得清哪个是他。"
 SUM_GT_Dot_Blasphemy:"亵渎之造"
 SUM_GT_Dot_Blasphemy_desc:"须弥的学者开始造不属于这个世界的东西。"
 SUM_GT_Dot_Alliance:"至冬同盟"
 SUM_GT_Dot_Alliance_desc:"须弥与至冬结盟，须弥的沙漠成了至冬的前哨。"
 SUM_GT_Dot_Master:"掌握禁忌"
 SUM_GT_Dot_Master_desc:"教令院自认已经掌握了禁忌，把它锁进柜子。"
 SUM_GT_Dot_Supreme:"与神并肩"
 SUM_GT_Dot_Supreme_desc:"须弥的神坐在至冬的桌边，与第二席并肩。"
 SUM_GT_Mac_Ruin:"遗迹发掘"
 SUM_GT_Mac_Ruin_desc:"遗迹被系统地发掘，赤王的机械一件件出土。"
 SUM_GT_Mac_Atlas:"机械图谱"
 SUM_GT_Mac_Atlas_desc:"妙论派把出土的机械画成图谱。"
 SUM_GT_Mac_Ameta:"阿玛塔机核"
 SUM_GT_Mac_Ameta_desc:"阿玛塔的机核被复刻，成为新神的骨架。"
 SUM_GT_Mac_Energy:"能量模块"
 SUM_GT_Mac_Energy_desc:"能量模块量产，须弥的工坊挂满灯。"
 SUM_GT_Mac_Remelt:"熔铸之术"
 SUM_GT_Mac_Remelt_desc:"熔铸之术恢复，废弃的机关可以重造。"
 SUM_GT_Mac_Tablet:"熔铸石板"
 SUM_GT_Mac_Tablet_desc:"熔铸石板拼合起来，写着一整套失传的工艺。"
 SUM_GT_Mac_Khaj:"卡赫尼斯之钥"
 SUM_GT_Mac_Khaj_desc:"卡赫尼斯之钥被找到，它打开的是一扇不该开的门。"
 SUM_GT_Mac_Factory:"机械工厂"
 SUM_GT_Mac_Factory_desc:"机械工厂开工，工匠被换成了齿轮。"
 SUM_GT_Mac_Army:"自动军团"
 SUM_GT_Mac_Army_desc:"自动军团列阵，不需要军饷，也不懂投降。"
 SUM_GT_Mac_Golem:"石像巨兵"
 SUM_GT_Mac_Golem_desc:"赤王的石像被唤醒，走在队伍最前面。"
 SUM_GT_Mac_Sky:"浮空城"
 SUM_GT_Mac_Sky_desc:"浮空城的图纸被复原，须弥要在天上建一座城。"
 SUM_GT_Mac_Core:"核心中枢"
 SUM_GT_Mac_Core_desc:"核心中枢落成，须弥全境由机械调度。"
 SUM_GT_Mac_Age:"机械之世"
 SUM_GT_Mac_Age_desc:"须弥进入机械之世。人是这套机器里最不精确的零件。"
 SUM_GT_Aby_Whisper:"深渊的低语"
 SUM_GT_Aby_Whisper_desc:"深渊隔着世界树说话，说它愿意帮须弥造神。"
 SUM_GT_Aby_Pact:"与深渊交易"
 SUM_GT_Aby_Pact_desc:"教令院秘密与深渊交易，换来造神所需的东西。"
 SUM_GT_Aby_Knowledge:"禁忌知识"
 SUM_GT_Aby_Knowledge_desc:"赤王曾碰过的禁忌知识被重新取出。"
 SUM_GT_Aby_Corrupt:"侵蚀"
 SUM_GT_Aby_Corrupt_desc:"雨林开始被侵蚀，死域扩大。"
 SUM_GT_Aby_Monster:"魔兽"
 SUM_GT_Aby_Monster_desc:"沙漠深处的魔兽苏醒，商道断了。"
 SUM_GT_Aby_Nail:"判罚之钉"
 SUM_GT_Aby_Nail_desc:"判罚之钉被拔出一枚，天钉落下的地方裂开。"
 SUM_GT_Aby_Void:"虚空之门"
 SUM_GT_Aby_Void_desc:"虚空之门在沙丘下打开，风从门后吹出来。"
 SUM_GT_Aby_Sandworm:"沙虫觉醒"
 SUM_GT_Aby_Sandworm_desc:"沉睡的沙虫觉醒，列柱沙原成了它们的猎场。"
 SUM_GT_Aby_Fallen:"堕落学者"
 SUM_GT_Aby_Fallen_desc:"学者被禁忌知识吞掉，教令院把他们从名册上划去。"
 SUM_GT_Aby_Rite:"禁忌仪式"
 SUM_GT_Aby_Rite_desc:"禁忌仪式在新神面前完成，须弥的夜变长了。"
 SUM_GT_Aby_Legion:"深渊军团"
 SUM_GT_Aby_Legion_desc:"深渊之物被编成军团，替须弥作战。"
 SUM_GT_Aby_Black:"漆黑之力"
 SUM_GT_Aby_Black_desc:"漆黑之力灌进新神的躯体，神开始不听话。"
 SUM_GT_Aby_Abyss:"拥抱深渊"
 SUM_GT_Aby_Abyss_desc:"须弥承认，它手里握着的已经不是自己能控制的东西。"
 SUM_GT_Iro_Decrees:"大贤者敕令"
 SUM_GT_Iro_Decrees_desc:"大贤者的敕令不再经过议事厅。"
 SUM_GT_Iro_Secret:"秘密警察"
 SUM_GT_Iro_Secret_desc:"秘密警察成立，报章上的名字一个个消失。"
 SUM_GT_Iro_Censor:"禁书令"
 SUM_GT_Iro_Censor_desc:"禁书令扩大到雨林药草与沙漠歌谣。"
 SUM_GT_Iro_Akasha:"虚空监控"
 SUM_GT_Iro_Akasha_desc:"虚空终端开始回传，它记录每个人说过的每一句话。"
 SUM_GT_Iro_Mobilize:"全民动员"
 SUM_GT_Iro_Mobilize_desc:"全民动员令颁下，沙漠与雨林一律抽丁。"
 SUM_GT_Iro_Purge:"清洗异见"
 SUM_GT_Iro_Purge_desc:"反对造神计划的学者被清洗，学派只剩一个声音。"
 SUM_GT_Iro_Propaganda:"学院宣传"
 SUM_GT_Iro_Propaganda_desc:"教令院的宣传铺满城墙，说须弥从未如此强大。"
 SUM_GT_Iro_School:"思想考试"
 SUM_GT_Iro_School_desc:"学生的升迁先看思想，再看学问。"
 SUM_GT_Iro_Church:"学院国教"
 SUM_GT_Iro_Church_desc:"教令院被立为国教，草神的圣所被改成学堂。"
 SUM_GT_Iro_Army:"党卫军团"
 SUM_GT_Iro_Army_desc:"教令院直属的军团成立，只对贤者效忠。"
 SUM_GT_Iro_Fear:"以恐惧治"
 SUM_GT_Iro_Fear_desc:"须弥用恐惧统治。没有人再敢做梦。"
 SUM_GT_Iro_Total:"全面统治"
 SUM_GT_Iro_Total_desc:"教令院握住了须弥的每一根线。"
 SUM_GT_Iro_Eternal:"永恒的教令院"
 SUM_GT_Iro_Eternal_desc:"教令院宣布，它的统治与须弥同在。"
 SUM_GT_The_Throne_of_Gods:"造神王座"
 SUM_GT_The_Throne_of_Gods_desc:"人偶之神坐上王座，教令院站在它身后。须弥有了一个可以被下令的神，和一个下令的学院。"
 SUM_GT_Eternal_Regency:"教令院永恒摄政"
 SUM_GT_Eternal_Regency_desc:"神造出来了，却谁也不肯让它掌权。教令院宣布以神之名摄政，一直摄政下去。"

 SUM_Neo.188.t:"造神王座"
 SUM_Neo.188.d:"教令院的地下，人偶的躯体接上了神之心。须弥要在人手里造出一个神，替他们统治须弥。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。"
 SUM_Neo.188.a:"加速造神的工序"
 SUM_Neo.188.b:"暂缓，先看住学院"
 SUM_Neo.189.t:"重启造神"
 SUM_Neo.189.d:"大贤者下令重启造神计划，档案从密室里搬出来。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。高塔投下的影子越来越长，傍晚时就盖住了半条街。"
 SUM_Neo.189.a:"调集全部资源"
 SUM_Neo.189.b:"留一手，别赌上须弥"
 SUM_Neo.190.t:"人偶的躯体"
 SUM_Neo.190.d:"人偶的躯体被重新拼装，关节用上赤王时代的零件。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。高塔投下的影子越来越长，傍晚时就盖住了半条街。"
 SUM_Neo.190.a:"让新神更快睁眼"
 SUM_Neo.190.b:"把风险压在柜子里"
 SUM_Neo.191.t:"神之心"
 SUM_Neo.191.d:"一颗神之心被装进人偶的胸腔。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。教令院的门槛这几天被踩得很低，进去的人比出来的人多。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。高塔投下的影子越来越长，傍晚时就盖住了半条街。"
 SUM_Neo.191.a:"加速造神的工序"
 SUM_Neo.191.b:"暂缓，先看住学院"
 SUM_Neo.192.t:"试验场"
 SUM_Neo.192.d:"试验在沙丘下进行，受试者名单被封存。沙漠的夜里冷得厉害，篝火旁有人谈起雨林，谈起的时候没有人笑。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。高塔投下的影子越来越长，傍晚时就盖住了半条街。"
