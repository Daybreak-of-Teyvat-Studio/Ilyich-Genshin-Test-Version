 SUM_Neo.193.t:"灌注神性"
 SUM_Neo.193.d:"神性被一点一点灌进去，人偶的手指开始动。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。"
 SUM_Neo.193.a:"让新神更快睁眼"
 SUM_Neo.193.b:"把风险压在柜子里"
 SUM_Neo.194.t:"知识的洪流"
 SUM_Neo.194.d:"虚空终端把全部知识灌入人偶，它学会的第一句话是须弥。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。"
 SUM_Neo.194.a:"加速造神的工序"
 SUM_Neo.194.b:"暂缓，先看住学院"
 SUM_Neo.195.t:"机械之神"
 SUM_Neo.195.d:"人偶站了起来。它比任何一位贤者都更像神。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。城门口的税吏换成了生面孔，收钱的规矩没变，收钱的人变了。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。兰那罗的歌声这几天更清晰，村里听不见的孩子也做了同一个梦。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。"
 SUM_Neo.195.a:"调集全部资源"
 SUM_Neo.195.b:"留一手，别赌上须弥"
 SUM_Neo.196.t:"完美的人偶"
 SUM_Neo.196.d:"人偶的躯体被调到完美，教令院拒绝承认它只是机械。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。高塔投下的影子越来越长，傍晚时就盖住了半条街。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。"
