 # ========================== 特殊事件 ==========================
 SAN_event.10081.t:"致信珊瑚宫"
 SAN_event.10081.desc:"月海亭联署官员谨呈主事甘雨案下：昔稻妻眼狩令颁，幕府逞威，残民夺眼，海疆闭锁。珊瑚宫倡义举兵，抗无道之政，然悬绝孤岛，兵粮俱窘。我亭承阁下筹度，联南十字北斗所部，犯风涛之险，输军械、济粮秣、通谍报，驰援海祇，共御强寇，患难相济，谊非寻常。今内争甫定，外患潜滋，敌寇窥伺东南海隅，烽烟有复燃之势。臣等合议：珊瑚宫扼海道要冲，军民习于水战，若与之缔结盟约，互为唇齿，实乃御敌长策。拟遣使赴海祇，申旧好、定盟规：情报互通以察敌踪，水师互援以固海防，商路共保以裕民生，敌来则同仇敌忾，犄角相应。此举上可固疆圉之安，下可通商旅之利，外可分敌之势，内可践昔时之谊。可否施行，伏请大人钧裁批示。若蒙允准，臣等即刻备办文书，遴选使节，克日成行。"
 SAN_event.10081.a:"为了大义！（盟约未必得成）"
 SAN_event.10081.b:"璃月之事，璃月人为之！"
 SAN_event.10082.t:"月海亭书至"
 SAN_event.10082.desc:"月海亭联南十字舰队、璃月各行商盟，谨致书于珊瑚宫现人神巫女殿下：昔眼狩令颁，稻妻板荡，幕府挟天守之威，行残民之政，夺神眼、锁海疆，万民嗟怨。海祇首倡义兵，抗无道之治，然悬居绝岛，兵甲粮草两困。当此之时，北斗将军亲率南十字船队，涉万里风涛，输军械、运士伍，屡犯险而不避；甘雨主事以月海亭之名，暗通声气，济粮秣、传情报，纾民困于倒悬。患难相扶，共御强寇，此谊海浪潮声，共为见证。今璃月陷于内乱，强敌环伺海隅，窥伺两境，非独力可支。月海亭今集诸方之力，愿与珊瑚宫结永久盟好：情报互通以察敌踪，水师互援以固海疆，商贸互济以裕民生，敌寇来犯则同仇敌忾，共赴戎行，守望相助，互为唇齿。伏惟殿下念昔日之谊，察当今之势，赐允盟誓，庶几海晏河清，两邦生民共沐升平。谨启。"
 SAN_event.10082.a:"为了大义！"
 SAN_event.10082.b:"璃月之事，璃月人为之！"
 SAN_event.10083.t:"海上盟约"
 SAN_event.10083.desc:"月海亭与珊瑚宫正式歃盟立约，结为攻守同盟，讯传七国，举世震骇。昔稻妻眼狩令兴，幕府肆虐，闭海残民。珊瑚宫举义海祇，孤军抗暴，兵粮俱竭，势甚危殆。其时南十字北斗受月海亭暗托，率舰犯涛，输军械、运义兵，屡挫敌锋；甘雨主事居中调度，济粮秣、通谍报，力纾海祇之困。二邦患难相扶，恩义素厚。今外患日迫，遂因旧谊定新盟：情报互通察敌踪，水师互援固海疆，商路共保裕民生，一邦遇寇，另一邦必发兵策应，海事争端同进退、共荣辱。约成之日，诸国失色，使节驰报，咸谓东海格局自此翻覆。盟书一式两份，以宝钿封缄，分藏两宫内府，岁互遣使聘问，共守其好，永为藩援。时论以为，二邦联横，据海道之利，拥水师之锐，势撼七国，诚近年之大变也。"
 SAN_event.10083.a:"此计太毒！"
 SAN_event.10083.b:"璃月之事，璃月人为之！"
 SAN-LYY_Support:"璃月的援助"
 SAN-LYY_Support:"璃月的援助"
 # ========================== 第一阶段：揭旗起事 (1-30) ==========================
 SAN_event.1.t:"潮头初起时"
 SAN_event.1.desc:"旗帜猎猎响，现人神之命将降，愿望莫两忘。珊瑚宫心海立于海祇大御神的祭坛前，一身素白巫女装束，眉目沉静，徐徐宣示：眼狩令乃践踏灵魂的苛政，海祇岛断不能坐视。坛下众人但闻此言，先是一静，继而欢呼动地，惊起满滩白鹭。反抗军的儿郎们早在望泷村结集，个个系上珊瑚色的腰带，把渔叉换作长刀，剑锋直指稻妻城。有人连夜写下檄文，贴在城下町的粉墙上，翌日被幕府差役刮去，第三日墙上字迹又现，墨色犹新，竟无人知是谁人手笔。珊瑚宫的巫女把祈祝文工工整整抄了两遍，一遍贴在海祇岛的朱牌坊上，任潮风翻动；一遍封入锦匣，差快船送进幕府。社奉行的年轻当家在灯下烧掉一封没有署名的信，看火舌卷到指尖方才撒手，灰烬打着旋落进庭院水池，半池红鲤纷纷聚拢，啄了两口，又散开了。 —— BY 桂花糕"
 SAN_event.1.a:"义之所在"

 SAN_event.2.t:"渔火照征衣"
 SAN_event.2.desc:"渔叉换长锋，青年挥别慈母颜，波涛入梦间。望泷村的年轻儿郎一早聚在滩头，把渔网卷了挂在梁上，渔叉都换成长锋，各自领了一副皮甲。有母亲立在门首，替儿子理一理领口，只说了一句「潮涨时回来」，便背过身去，再不回头。这些孩子原是打渔出身，风雨里长大，臂膀结实，如今家园有难，人人都是捍卫海祇岛的卫士。军中把他们按岛屿编作数营，操练的号子声一浪一浪，隔着山坳都听得见。彼时神里家的家臣连夜启程，车帘上挂着薄霜，一路无话，谁也不提此去做甚么。邪眼工厂的烟囱淡了下去，仓库门上却添了一把新锁。通商口岸的秤重新校过，校完了，商人看秤的眼神便不一样了。离岛的货队照旧进出，关税高过货值，也只得忍着，惟把委屈写进账本最后一页。"
 SAN_event.2.a:"众心成城"

 SAN_event.3.t:"灯下布阵图"
 SAN_event.3.desc:"珊瑚映月明，智将指点江山势，运筹帷幄里。大本营内烛火通明，一幅巨大的海图铺展案上，图上山峦起伏，水道纵横，每一处关隘、每一条航路都注了细字。心海大人亲临主持军议，素手执一枚白玉棋子，按在海祇岛东侧，遂将跨岛屿的调度次序一一议定：何处分兵，何处合围，粮船几日一发，都写在军令簿上。自此发出的每一道指令，皆如潮汐推浪，层层涌向幕府的防线。散会时已过三更，廊下值夜的巫女捧来热茶，众人捧盏，齐声谢了。海祇岛的渔船近海绕了一圈，捕的鱼比往年少，船工说是水暖了，鱼群远了。八酝岛连雨三日，神社石阶冲塌一角，竟抽不出人手去修。奉行所的牢房腾出一间，看管的人说，留给谁还未定。"
 SAN_event.3.a:"胜算在手"

 SAN_event.4.t:"五郎练兵记"
 SAN_event.4.desc:"犬影战阵前，忠勇之志燃胸膛，大将威名扬。五郎大将自己先脱了战袍，与士卒一处赤膊爬崖，山道崎岖，碎石扎进掌心也不肯停。新颁的训练大纲贴在各营帐口，白纸黑字，连伙夫都识得几条。士卒们先在山地里磨脚力，再分两队作模拟对抗，胜的一方吃热饭，败的一方喂马，起先还有人嘟囔，渐渐地都服了。不出两月，反抗军果然脱胎换骨，从一窝志愿者变成进退有度的正规军，扎营时栅栏拉得笔直，连马槽都排成一线。有人问五郎将军之威从何而来，他只答：「不在于权势，在于与士卒同生共死的觉悟。」说罢把营中最粗的那碗饭端起来，同新兵蹲在一处吃了。勘定奉行的人查了三家米铺的账，查到第三家，天已亮了，账房里灯油耗尽，伙计们伏在柜上睡熟，米香混着晨雾漫了一街。"
 SAN_event.4.a:"军威一振"

 SAN_event.5.t:"暗夜孤雁影"
 SAN_event.5.desc:"微风传秘语，潜行阴影乱敌踪，情报胜千雄。我们的秘密通信网络已悄悄穿透幕府的封锁线：走私船的夹层里塞着蜡丸，渔娘的鬓边簪着暗记，各岛眼线的密报沿一条看不见的水路，三日便可送到心海大人案头。心海将每份情报折成小小的方胜，插在案头一只青瓷瓶里，瓶中纸片盈寸，敌军每一项调动，皆在掌握。有人问她何以如此从容，她只淡淡道：「知己知彼，方立于不败。」彼时御影炉心重新点火那一日，鸣神岛上空飘着薄薄一层黑，落了一地细灰。离岛的客栈住满等船的人，掌柜把房价抬了三成，仍旧有人抢着住。白夜国的旧档被搬出来晒太阳，纸页摊了半个院，看的人比读的人还多。有个卖香的老妪把摊子挪到客栈门前，生意倒比先前好了三成。"
 SAN_event.5.a:"密报入手"

 SAN_event.6.t:"锦囊初开处"
 SAN_event.6.desc:"锦囊藏生机，兵法精微算无遗，奇袭正当时。心海大人亲手册封的锦囊按营分派，囊中各藏一条应对之策：遇伏如何走，粮绝如何守，潮涨如何进兵，潮落如何撤回，写得密密行行。士卒们捧着锦囊传看，无不惊叹军师大人未雨绸缪，连一支预备队的番号都写在囊底。后来实战之中，绝境里打开锦囊，照策而行，果然寻出转机，乱局之中反锁胜果，众人方信智慧之力，比重炮更能撼动人心。有渔夫在近海捞起一块铁片， 锈迹斑斑，像是船甲上的旧件，交到阵屋，阵屋的人问了名字，还赏了一碗热酒。他出门时把赏钱分给了同船的伙伴，自己只留下那只空碗。有人问那铁片的来历，阵屋的人也说不清，只叫登记在册，好生收着。"
 SAN_event.6.a:"妙算通神"

 SAN_event.7.t:"愿望出鞘时"
 SAN_event.7.desc:"神之眼烁光，赤子愿望化雷火，一念破苍茫。眼狩令之下，神之眼成了催命的符牌，可偏有一班持有者不肯把眼交出去，索性结成先锋突击队，聚在海祇岛的大纛之下。他们是协同进攻的元素洪流：雷光牵成一线，水浪卷作一环，火借风势，冰封退路，每一次元素爆发，都是一桩不肯低头的愿望。他们要向天理、向将军证明，凡人的愿望绝非随意可夺的玩物。训练场上，先锋们把神之眼贴身收着，夜里守着它入睡，像守着一星不灭的灯火。海祇岛的珊瑚换了新色，采珊瑚的人说今年的水比去年浊，捞上来的枝子也细了。三奉行的文书在案上摞成小山，最上面一份连封蜡都未拆，墨香混着雨气。九条阵屋的火把换了新的，城墙上守望的人比上个月多了一倍，甲叶在风里铮铮作响。"
 SAN_event.7.a:"先锋出阵！"

 SAN_event.8.t:"珍珠入万家"
 SAN_event.8.desc:"粒米思艰辛，珍珠碎散济贫苦，民心重千金。幕府的经济封锁一日紧似一日，海祇岛遂行起严格的配给之政：米按口分，盐按户给，油灯的烛芯都剪短了半寸。心海大人亲自动身走访村落，木屐踏过湿漉漉的滩涂，进屋先看米缸，再看老人手上的茧，末了把自己妆奁里那串珍珠取来，命人换了钱粮，散给最困苦的几户。巫女们劝她留一副妆奁体面，她只道：「民心重于千金，体面算得甚么。」岛民感念这份牺牲与公正，各岛遂拧成一股绳，团结便成了最坚固的防线。幕府的告示贴在桥头，墨迹被雨水泡开，能看清的字不多，有个老学究蹲在桥下辨认了半晌，起身长叹了一声，把伞收了，任雨淋着回去。米铺的掌柜连夜把粮册重誊了一份，誊完吹灯时，手在灯罩上停了一停。"
 SAN_event.8.a:"同舟共济"

 SAN_event.9.t:"雾中舰影"
 SAN_event.9.desc:"海雾锁战船，礁石暗藏杀机现，惊雷震海天。海祇岛周边的水文，外人摸不着门道：暗礁列在水下如棋局，海雾起时三步不见人，潮水一转，昨日的水路今日便成了坟场。快船编队借着这份地利，专挑幕府的运输线伏击，哨船在雾里引路，主力从礁后杀出，火罐掷处，敌舰的帆先着，随后是舵，巨舰在迷雾中团团打转，进退不得，我们却如鱼得水，来去无踪。海是海祇民的领地，幕府的权势到了这里，只配被波涛淹没。珊瑚宫的祭典照常举行，来的人比往常少，唱祝词的巫女声音却比往常大，祝词声混着涛声，直送到船队返航的桅灯里。有个哨童蹲在礁石上数船，数到第七艘，揉了揉眼睛，又从头数起，这一回数出了九艘，嘴里念的都是爹娘教的老口诀。"
 SAN_event.9.a:"海上告捷"

 SAN_event.10.t:"巫女怜孤客"
 SAN_event.10.desc:"白衣染尘灰，医者仁心抚创痛，歌声唤回归。珊瑚宫的巫女们放下了祭祀的铃铛，拿起了药草与纱布。战场后方搭起一排苇棚，便是医疗营：棚里土灶煨着药，砂罐咕嘟作响，苦香混着海风飘出去老远。巫女们白日清创换药，夜里提灯巡棚，见伤员睡不着，便低声哼起珊瑚宫的安魂谣，一嗓子把恐惧都唱散了。多少条命从她们指缝里捞回来，这股柔性的力量，是反抗军永不枯竭的源泉。有个断了手臂的渔家子弟，拆线那日执意给巫女们磕了一个头，被扶起来时眼泪把绷带都洇湿了。医疗营的门永远虚掩着，门口挂一盏白纸灯笼，上头一个红十字，夜里远远望去，像浮在海面的一点星。此事在诸岛之间悄悄传开，闻者各有各的心思。"
 SAN_event.10.a:"护佑生灵"

 SAN_event.11.t:"浪人归帐下"
 SAN_event.11.desc:"刀刃无主时，流落荒野叹浮生，海祇觅忠魂。失去领地的浪人们，一批批渡海来到海祇岛寻求新的归宿。岛上张出告示：凡愿为公义而战者，名誉与报酬，一样不缺。这些身经百战的武者个个体格精悍，眼神里有故事，入营先验刀、再验艺，胜过校尉者编入教头班，余者入各营，补强了近战的短板。他们的到来，让反抗军的战术愈发多变致命：夜袭用他们的野路子，守垒用他们的硬功夫。有个白发老浪人验艺时连赢三人，末了却把刀收进鞘里，说：「老了，教徒弟罢。」军中真就给他开了个武塾，一堂课教下来的，都是拿命换来的东西。消息传到珊瑚宫，巫女们把这桩事端端正正记进仪典簿里，墨迹晾干之前谁也不许去碰那一页，留作海祇广纳忠魂的凭证。"
 SAN_event.11.a:"剑客来集"

 SAN_event.12.t:"灯下课兵书"
 SAN_event.12.desc:"古卷翻残影，心海沉思月影中，智略贯苍穹。政务再忙，心海大人每夜仍留一个时辰读书：白夜国的遗迹文献残页、稻妻历代的战记、幕府流出的操典抄件，堆满半张案。她以遗迹之学印证实战，以战例反推地利，写成一部新的防御教义，条分缕析，连伙夫都看得懂。教义颁行之后，行政的效率与资源掌控之力节节攀升，这年轻的国家像一株海边的榕树，日日见长。抄书的书记官手都抄酸了，说大人写一个字，我们要抄十个。月夜里她偶一抬头，见窗外的月照在案头那瓶插着的方胜密报上，纸角泛白，像一枝开败了的花。心海大人只淡淡道，书里躺着的前人早把错处试遍了，我们少走一步弯路，阵前便少折一人；说罢提笔蘸墨，笔尖悬在纸上，半晌没有落下。"
 SAN_event.12.a:"学问无涯"

 SAN_event.13.t:"新赋济军需"
 SAN_event.13.desc:"国难当头日，千家万户献忠诚，财粮足军声。战线越拉越长，粮弹的消耗一日大过一日，税收之政不得不随之调整。心海大人申明于前：加赋可以，扰民不行，税收以平稳民生为前提，灾年减免，孤寡不征。又遣人往各处豪商处劝募，晓以大义，许以海祇岛的盐引与航运之利，富户们的捐输一船一船到埠。行政流程也简化了，从前的七道手令并为三道，前线要的弹药口粮，再未断过。有位粮商捐了半仓米，只求在收条上写他祖上的名讳，说祖上当年也打过幕府，这回算替他把当年的事做完了。御前会议开了整夜，最后只有一句话从门缝里传出来，听清的人不肯重复。盐引一发，奥摩斯港的帆樯又密了一层，卸货的号子声直响到月上东山才歇。"
 SAN_event.13.a:"厚积薄发。"

 SAN_event.14.t:"海祇筑垒时"
 SAN_event.14.desc:"磐石筑坚垒，任凭风雨狂雷袭，故土守无余。海祇岛的门户地带，一座座堡垒依着珊瑚岩崖拔地而起，灰白的石墙上凿出一排排箭窗，远看像嵌在崖上的蜂巢。天然的海蚀洞穴被改作弹药库，洞口用铁网遮了，潮水涨落，网眼里的贝壳一闪一闪；高地上架起远程重炮，炮口蒙着涂了桐油的布，唯有校射的旗子一日三换。如此加固，不单为守，更为日后反攻留一个踏实的跳板。驻垒的士卒每日操炮三次，潮涨时验一次射界，潮落时再验一次，雷雨夜里也照做不误。有浪人把刀鞘擦得发亮，坐在酒馆里一言不发，喝完就走，酒钱压在碗底，一个子儿不多。九条阵屋的火把换了新的，城墙上守望的人比上个月多了一倍，火光连成一线，像给黑夜镶了一圈红边。"
 SAN_event.14.a:"坚不可摧。"

 SAN_event.15.t:"异邦剑客渡海来"
 SAN_event.15.desc:"异乡客踏浪，重金礼聘助声威，乱局现生机。经由几条秘密水路，一班来自蒙德与璃月的佣兵陆续踏上海祇岛的滩头。他们行装利落，说话带着各处口音，兵器却保养得极好，刀鞘上还留着异国的纹样。为的是金钱，可那份拔营列阵的功夫，确是眼下最缺的：砌垒、布阵、夜袭，样样娴熟，把一潭死水的战局搅活了。幕府那边听得风声，也见识了外界力量的分量，行事便添了几分忌惮。头目与心海大人对坐议事，茶过三巡，契书用印，两不相疑。离岛的关口排起长队，通行文书要盖三个印，谁也说不清第三个印该寻谁去盖，有个跑单帮的贩子举着文书在人丛里挤了一整天，末了坐在缆桩上啃冷饭团，说明日再挤。关口差役瞧不过去，把自己的午饭分了他半个，转头又把文书收走了。"
 SAN_event.15.a:"兵甲益利"

 SAN_event.16.t:"地脉暗道成"
 SAN_event.16.desc:"深挖地层底，穿行群山密林间，奇兵出不意。后勤地道工程终告完工。山腹里的暗道一段一段凿出来，窄处仅容一人俯身，宽处可推独轮车，壁上每十步点一盏油灯，灯影贴着湿石慢慢晃。这些暗道避得过幕府的斥候，被围时可作奇袭的孔道，粮秣弹药从山这边进去，从海那边的洞口出来，一路无声无息。地道便是海祇岛的血管，昼夜不息，把前线要的东西一样一样送过去。掘进时最怕凿穿水脉，有一处塌了半日，修好之后，匠人在壁上刻了一道痕，说记着它，往后绕着走。稻妻城的米价又涨了一成，米铺老板说是船期误了，船没有来。牢房那头另隔出一间小间，看管的人说，这回留的位子，比先前的体面。有个赶脚的老人打地道口路过，探头张了一眼，回家便跟老伴说，山里头有灯，像过年。"
 SAN_event.16.a:"地底长城"

 SAN_event.17.t:"元素合阵法"
 SAN_event.17.desc:"元素共鸣响，火光电石映山冈，威能震八方。神之眼持有者经科学编组，竟练出一加一大于二的名堂：雷系在前，水系随后，雷水相激，感电成片；火与冰两相错开，融冻之间，敌阵立时酥了半边。超载的火光、冻结的寒意、麻痹的蓝电，在战场上交织成死神的镰刀，割过去便是一片。这套战术定名「共鸣」，操练时以海螺为号，一响一变阵，岛上的老猎户听了都说，像潮水拍岸，一浪接一浪。此术一成，反抗军便有了与神灵之力抗衡的底气。演武那日，将军崖下白浪滔滔，崖上演武的火光映在浪尖上，观阵的孩童拍手叫好，老人们却都默不作声，各自转身回了家，把门关得很轻。演罢收兵，先锋们把神之眼贴身收好，像把一星灯火揣进怀里，各自归营去了。"
 SAN_event.17.a:"战力一新"

 SAN_event.18.t:"耳目布诸岛"
 SAN_event.18.desc:"耳目遍稻妻，町街深处藏暗语，秘密不再秘。我们的眼线早已渗进鸣神岛的市井深处：鱼贩的冰筐底下压着双层信，茶屋的帮工记熟了往来军官的脸，连神社里扫台阶的老婆婆，也认得出哪顶轿子坐的是勘定奉行的人。天领奉行的公文，副本不出三个时辰便摆上珊瑚宫的案头，墨迹都未干透。幕府的政令朝发夕改，可我们总快它半步，那台行政机器便一天天迟钝笨拙起来。知识与信息的博弈，胜负先分了一半。有个卖炭的老头得了我们两贯钱，替我们留意离岛来的船，他不懂甚么大义，只说：「钱是好钱，那就记着。」话虽粗糙，事却办得极牢靠，一船一船，从无遗漏。后来官府查得紧，他索性把炭筐做了夹层，炭卖完，信也到了。"
 SAN_event.18.a:"先机在握"

 SAN_event.19.t:"潮头设哨夜"
 SAN_event.19.desc:"惊涛拍岸响，日夜巡逻莫稍停，家园保清宁。一套海岸预警之制在诸岛铺开：哨塔沿海一线排开，塔上皆设元素感应之仪，铜盘夜光，稍有异动便嗡嗡示警；塔与塔之间以灯语传讯，一盏灯起，各塔皆应，不到半炷香，敌踪已传遍全线。非法登陆的敌船，往往刚靠浅滩便被围住，船老大还当是神明显灵，不知是塔上的少年一夜未曾合眼。海是海祇岛天然的护城河，一寸一寸浅滩，都在守望之下。守塔的人换了三班，班与班之间要当面对灯，灯火不灭，交接才算完成。有个守塔人值满一年，离塔前把塔里每一根灯芯都换了新的，说后来的人，别一上来就手忙脚乱。锁国令改了七个字，改完之后，船还是不能随便出海，老船户把帆卷了又卷，卷到只剩一小截桅尖露在雨里。"
 SAN_event.19.a:"守我海疆"

 SAN_event.20.t:"村老议政堂"
 SAN_event.20.desc:"民心归一处，村落自治议新篇，众意定大权。心海大人下令，将部分行政之权下放到村议会：望泷村的长老们自此负责分配土地、组织民防，账目按季张贴在祠堂门口，一笔一笔，老幼都看得见。此令一出，民众的干劲果然激发出来，各家各户都明白，保卫国家便是保卫自己的营生与炊烟，民主的萌芽便在这潮气里悄然生长。村议会开议那日，祠堂里挤满了人，说话的嗓门一个大似一个，末了由识字的书记一条条写定，画押存照。幕府派来的代官在村口立了块牌，牌上写的规矩，村里没一个人认得全，几个孩子拿炭笔照着描，描完了当画儿贴在自家墙上，大人看见，笑着把炭笔收了。后来那牌子换了三次，描的孩子也换了三拨，描下来的字，一拨比一拨端正。"
 SAN_event.20.a:"权柄归众"

 SAN_event.21.t:"积粟备荒年"
 SAN_event.21.desc:"波涛涌军心，浪花淘尽弱与怯，勇者立潮头。海祇军的操练以海为师：涨潮时练冲刺，退潮时练坚守，浪头最大那几日，偏偏加练泅渡，士卒们一个个被浪掀翻，又一个个爬起来。五郎大将立在礁石上督操，湿透的披风贴在背上，他也不肯先走一步。如此三月，军心果然大变：怯战的不怯了，散漫的收束了，连伙夫挑担的步子都合上了鼓点。有新兵夜里独自加练，被巡查的军官撞见，问他缘故，他说同村一起投军的伙伴折在上一仗里，他想替他把这一仗打完。军官听罢没有责罚，只把自己那份夜粮留给了他，转身去时，脚步比来时更轻。次日操练，那新兵泅在最前头，浪头打过来，他咬着牙顶了过去，岸上的人都替他喝了一声彩。"
 SAN_event.21.a:"仓廪充实"

 SAN_event.22.t:"旗语递军机"
 SAN_event.22.desc:"彩旗舞长空，密报传于波涛间，同步建奇功。地脉通讯既断，诸岛之间的号令便落在快船与旗语上。军中定下一套加密旗语，晨光里旗手立于船头，双臂起落，红蓝两旗交错翻飞，一次挥动便是一个精确的战术动作：合围、让道、抢滩、退守，各有其式，外人看来只是舞旗，自家人看来却字字分明。老水手起初嫌这法子古旧，试过几回，才知在雷雨天里，它比任何法子都稳当。海上协同由此如臂使指，旗帜所向，便是胜果所在。有个旗手在暴风里连挥两个时辰，退下来时两条胳膊抬不起来，伙夫给他盛饭，他自己端不住碗，同营的弟兄便轮着喂他，一面喂一面笑，笑他吃饭倒像个娃娃。后来军中立下新规，凡挥旗满两个时辰者，次日免操半日，旗手的胳膊才算有了喘息。"
 SAN_event.22.a:"号令归一"

 SAN_event.23.t:"山径设伏兵"
 SAN_event.23.desc:"隐于密林中，击于敌之所不备，退若晨雾散。反抗军化整为零，散进八酝岛的裂谷与丛林，三五人一队，昼伏夜行，专拣幕府军的粮道、哨卡下手。打得赢便打，打不赢便走，退进林子里，连影子都寻不见。幕府的笨重师团在泥潭里寸步难行，甲重路滑，追又追不上，停又停不住，日日被袭扰，夜夜不安枕。天领奉行的耐心与兵力，便在这一场场小仗里一点点耗着。我们要用无数次微小的胜利，去换最后那个大的转折。林中的猎户给游击队引路，自家灶上却挂着幕府的良民牌子，有人问他怕不怕，他把牌子摘下来擦了擦，又挂回去，道：「牌子是纸，人是铁。」入冬前最末一仗，游击队一夜连拔三处哨卡，天亮时各自散进林子，幕府的追兵追到谷口，只捡到几枚踩扁的草鞋印。"
 SAN_event.23.a:"作持久计"

 SAN_event.24.t:"斥候习攀浪"
 SAN_event.24.desc:"身捷似灵猫，穿梭敌后觅虚实，双眼看分明。一批眼最尖、脚最快的战士受了特种侦察的训练：他们学会拿草药揉身，掩盖人汗的气味；学会贴着崖影走，把影子藏进影子里；学会看鸟起落辨埋伏，看炊烟浓淡断粮草。每次归来，浑身是泥，怀里却护着画好的图：敌营几何、粮堆何处、换岗几时，一笔不落。这些图一到心海大人案头，便化作下一轮攻势的算筹。他们不言功，卸了行囊便去补觉，醒来又走。有个侦察兵连续三回穿过封锁线，靴底磨穿了垫了三层布，同僚替他数着，他自己倒不记得。军中送他个诨名，唤作「看不见的那一个」，他听了只笑笑，说这名字起得好，省得敌军记他的脸。后来敌军的悬赏榜上真的贴了他的画像，画得却像旁人，他撕下榜来垫了靴底。"
 SAN_event.24.a:"知己知彼"

 SAN_event.25.t:"暗雷沉海底"
 SAN_event.25.desc:"潜藏暗流底，爆炸声震深海魂，入侵莫入门。近海的几处要道，我们趁月黑下了改良的水雷：雷壳用旧瓮改装，里头装药，外缠渔网，锚石沉底，引线上系着珊瑚色的浮子，潮涨潮落，浮子随浪一沉一浮，外人只当是渔家晾的浮漂。这般廉价的东西，却让幕府的巡洋舰望而却步，头一艘试路的船在雾里一声闷响，船腹开了个窟窿，拖着黑水逃回去，自此再不敢走那条线。海的宁静底下藏了杀机，海祇岛的近海成了侵略者的禁区，海上的主动权便稳稳握在我们手里。渔民们得了新的海图，图上朱笔圈出禁行水域，老船户把图贴在船舱里，出海前必看一眼，说图上朱线便是阎王殿的门槛，越不得。有个性急的后生偏要抄近道，船头擦着朱线过了，回来便被老船户罚着把图重抄了三遍。"
 SAN_event.25.a:"锁住海路"

 SAN_event.26.t:"海祇固金汤"
 SAN_event.26.desc:"岛屿化铁塔，万门重炮指苍天，犯者必遭难。心海大人下令，将整个海祇岛要塞化：每一座山头都改造作掩体，炮位藏在珊瑚岩后，涂了与礁石一色的灰白；每一道防波堤里都暗藏火力点，堤面看是寻常石阶，堤腹却是机关，闸门一落，滩头便成绝地。这座覆满珊瑚的美丽岛屿，如今成了一座不可攻克的堡垒，渔村照旧升火，庙里照旧上香，只是崖顶多了望楼，滩上多了拒马。我们要用钢铁与热血告诉来犯者：这里是海祇民的圣地。施工的匠人日夜赶工，把祖传的采石手艺都用在垒墙上，有老石匠摸着自己垒的墙缝说，这缝比嫁女儿的针脚还密。海祇岛与鸣神岛之间的航路时开时关，船主们把货物分成三批走，谁也不肯把一船货押在同一条潮水上。"
 SAN_event.26.a:"严阵以待。"

 SAN_event.27.t:"檄文走诸岛"
 SAN_event.27.desc:"布告传诸岛，正义之声唤归心，幕府失德音。文宣的团队把传单一船一船送往各岛：纸上写的都是实情，谁家的眼被夺了，谁家的儿郎被拉了夫，眼狩令背后又是怎样一副账目。字是请村里先生写的，工工整整，不识字的，就由巫女在庙口一句一句念。稻妻的民众听多了，心里那杆秤渐渐明白过来：真正的守护者是谁，天领奉行的根基便从哪里松动。思想的战争一样惨烈，赢了民心，便赢了终极的一仗。有位老儒生私下抄传单，抄完在末尾添了四个字「天理昭昭」，被人揭发，连夜逃出城下町，一路讨饭到了海祇岛。心海大人见了他的字，收他在书记房里，说笔忠之人，不能亏待。老儒生住下之后，把传单的字越写越工，工到后来，连幕府那边都有人偷偷照着他的字练。"
 SAN_event.27.a:"真相大白"

 SAN_event.28.t:"诸垒同声气"
 SAN_event.28.desc:"诸岛共一心，防线交织网罗密，大御神佑民。全岛的独立防御单元至此整合为一网：东崖的炮台、南滩的拒马、林间的哨卡、村里的联防队，各守一面，又彼此呼应，统一的号令沿海底电缆与旗语线传遍诸岛，一处遇袭，四面皆动，快船沿内线送兵，往往敌军还未在滩头站稳，援兵已到背后。这种网状的防御让敌人的局部突破毫无意义，破一角，网自收拢，反把来敌兜在当中。众人说这是大御神在佑护海祇岛，心海大人却说，神意也要落在人手上去做，才是真佑护。网成那日，各防区头目在祭坛前歃血为盟，血滴进海水，转眼便散了，盟约却留在每个人腕上。自那以后，每月十五，四面号角同时吹响，声音在海面上叠成一层，连打渔的孩子都听得懂。自此逢十五齐鸣之时，误了时辰的防区头领，要亲自去祭坛前领罚。"
 SAN_event.28.a:"固若金汤。"

 SAN_event.29.t:"夜港暗市约"
 SAN_event.29.desc:"利诱贪官手，物资暗渡离岛关，贸易补国艰。幕府的封锁铁桶也似，心海大人却默许了一条灰色的路：与离岛黑市的人接头，以黄金与珍珠，换回急需的钢铁与炼金药剂。经手的都是老手，货单写在桑皮纸上，看完即焚；银子压在鱼舱底，上头盖着三尺厚的新冰。这类交易游走在刀口上，一着不慎便是抄家灭门，可正是它，在封锁里维持着海祇岛的工坊与炉火。在这个严峻的世上，生存是头一道准则。有个黑市牙人收了珍珠却不交货，心海大人也不动怒，只叫人把他私吞的那串珠子的来历抄了三份，一份送他正室，一份送他同伙，一份他自己收着。三日后，货如数送到，分毫不差。这话在市井间不胫而走，船夫添了谈资，巫女多了心事。"
 SAN_event.29.a:"暗渡陈仓"

 SAN_event.30.t:"利剑初出鞘"
 SAN_event.30.desc:"万事已俱备，只欠东风破敌营，反攻显威灵。战略地图上，心海大人执朱笔画下一个箭头，箭头自海祇岛起，越过名椎滩，直指神无冢。第一阶段筹备至此告成：兵员足额，粮弹齐备，先锋船队泊进避风湾，桅杆连成一片黑色的林子，潮汐、风向、月相都算定在出征单上。反抗军不再仅仅满足于守土，此战要跨过名椎滩，收复神无冢，向全稻妻宣告：反抗的号角正式吹响。出征前夜，滩头烧起几堆篝火，士卒们围火而坐，没人高声说话，各自磨刀、缠带、写家信。有个老兵把出征的酒洒了半碗在沙里，敬给回不来的人，自己一饮而尽，把空碗倒扣在礁石上，道：「回来取。」翌日五更，潮水如约而至，号角三声，篝火尽灭，船队悄无声息出了湾。船队离岸四十里，望泷村的渔火才一盏一盏重新亮起来。"
 SAN_event.30.a:"全线进兵！"

 # ========================== 第二阶段：内战烽火 (31-70) ==========================
 SAN_event.31.t:"神无冢前血色门"
 SAN_event.31.desc:"踏过名椎滩，血斛盛开浸战袍，英魂志气高。反抗军的先头部队趁夜潮在神无冢登陆，靴子踏进滩泥，一步一陷，却无一人停步。这里是天领奉行的工业心脏，堑壕层层，铁丝如藤，每一寸土地都经营了多年。我军以正面佯攻牵其主力，轻兵从侧翼的废弃矿道里钻出，两面一合，阵地便撕开一道口子。这是一场意志的较量，胜利属于死战不退的人。滩上血斛开得正盛，红得像浸过战袍，老兵说这花专开在见血的地方，开了，便是替亡人占住了地界。先头部队当夜立旗，旗杆是就地砍的松木，还带着湿气，旗面一展，血斛摇了一摇，像在点头。三日后松木干透，敲上去梆梆作响，守旗的兵说，比阵屋里那根还结实。滩头被踩倒的血斛，三日后齐齐立了起来，比先前更红。"
 SAN_event.31.a:"兵进踏鞴砂"

 SAN_event.32.t:"御影炉心鸣"
 SAN_event.32.desc:"炉心雷光闪，祟神威能入掌中，重铸钢铁魂。几番精密的战术动作之后，御影炉心终于落入我手。炉内能量极不稳定，雷光在管道里窜成青白的一线，老匠人进去勘察，出来时袖口焦了一角，却笑道：「这脾气，得顺着他。」在枫丹专家的指点下，工程师们架起新式的冶炉，引炉心之力炼铁淬刃。出炉的第一批刀，刃口泛着淡淡的紫光，试刀的士卒劈断三根木桩，刃无损。反抗军自此有了比幕府更精良的武器，每一柄重铸的刀刃都闪着复仇的光。有个铸刀的老匠在炉前设了个小小牌位，每日开工先上一炷香，问他敬的是谁，他说敬的是火，火比人老，比神长。当夜潮声比往日更沉，守夜的兵都说是浪里有人说话，竖起耳朵，又只剩风。"
 SAN_event.32.a:"炉冶在手"

 SAN_event.33.t:"名椎滩争锋"
 SAN_event.33.desc:"浅滩映斜阳，赤红血斛遍地芳，枯骨诉凄凉。名椎滩成了一架绞肉机。敌我双方围绕每一具废弃的船骸反复争夺，白日炮火犁地，夜里刺刀见红，一座船骸几度易手，木板上弹痕叠着刀痕。心海大人下令筑起多层纵深阵地，炮火交织成网，把敌人的冲锋一次次压回滩头。伤亡惨重，可每一朵盛开的血斛都在见证坚韧，这片滩涂，终将成为幕府军的噩梦。抬担架的民夫往来不绝，有人数着担架哭，数到后来便不数了，只埋头快走。战事稍歇的间隙，有个小兵蹲在血斛丛边歇了一口气，伸手想摘一朵，终究缩回来，说等打完这一仗，再来采一大把，送给他娘。当夜潮声分外滞重，守夜的兵说浪底像有人磨刀，侧耳再听，只余风声。滩头的旗，翌日照旧升起来了。"
 SAN_event.33.a:"寸土不让"

 SAN_event.34.t:"踏鞴砂重兴"
 SAN_event.34.desc:"废墟现新生，工坊烟火重燃起，工业定国基。战火之后的踏鞴砂满目疮痍，断墙焦木之间，核心的设施却大体完好。我们投入大量人力物力，逐段逐座地修复：清渣的清渣，补顶的补顶，烟囱重新砌直，水轮重新上油，塌了的工棚用旧船板架起来，比原先还宽绰。原先人人绕着走的那座「神不在之丘」，如今要变成反抗军的兵工厂。当第一炉钢水流出，通红的铁流映亮半座山坳，围观的匠人们不约而同摘了斗笠，胜利的天平已向我们倾斜。老监工在册子上记下炉号，一笔一画，像给新生的婴孩记生辰。工坊的伙房当日加了菜，白饭管够，匠人们吃得埋头不响，吃完抹抹嘴，又回炉边去了，山坳里的烟，从此没有断过。老监工的册子记到第一百零七号炉，字迹比第一页工整了许多。"
 SAN_event.34.a:"百工兴起"

 SAN_event.35.t:"八酝岛安魂"
 SAN_event.35.desc:"神骸残怨消，巫女吟唱止风暴，黎民得安宁。为立一个安稳的后方，心海大人亲率巫女团渡海前往八酝岛。岛上的地脉因祟神之力而狂乱，田禾焦卷，井水泛红，村民夜夜听得山里像有兽吼。巫女们依古仪设坛，白幡、净水、安魂的歌一句接一句，唱了三日三夜，那股发狂的地脉能量竟渐渐平息，风停了，井水也清了。村民跪在坛前不肯起，心海大人一一扶起，说这不是神迹，是你们守了这片土地几百年，土地认得你们。自此八酝岛成了反抗军安稳的后方，粮草自岛上源源而出。有个村里的老巫婆握着巫女的手不放，非要留她们吃饭，锅里只有芋头和杂鱼，巫女们吃得很香。消息随潮水传遍诸岛，各处的匠人听了，收拾行囊动身的人一天比一天多。"
 SAN_event.35.a:"祟神平定"

 SAN_event.36.t:"缚取祟神力"
 SAN_event.36.desc:"巧匠成云来，图纸铺陈满案台，武备日渐丰。反抗军里的工匠一日多似一日：有踏鞴砂的铸师，有离岛的船木匠，有八酝岛的制弓手，还有从枫丹、璃月渡海而来的巧匠，操着各处口音，围一张长案看图。案上图纸铺陈，火炮、弩机、装甲船的构造，一一画得分明。众匠各领一摊，白日赶工，夜里互相串门切磋，谁家新法灵验，不出三日便传遍全厂。武备日渐丰足，库房里的刀枪甲胄一层层码上去，快顶到梁了。有个璃月来的老师傅看不得浪费，见有人锯歪了一根料，捡起来改成枪托，末了说：「料无罪，罪在手。」那学徒红了脸，往后下锯之前，总要先量三遍。消息顺着潮水一程一程传开，别岛的匠人听了，收拾工具北上的人渐渐多了。"
 SAN_event.36.a:"化忌为用"

 SAN_event.37.t:"枫丹巧艺东渡"
 SAN_event.37.desc:"异国奇机巧，齿轮转动映蓝图，科技追高远。枫丹工程师泽维尔携图纸渡海而来，行囊里除了换洗衣物，多半是卷成筒的蓝图。众人起初只当他是游历的奇人，待他画完高炉的剖面，连老炉匠都凑在图前不肯挪步。图上蒸汽泵的构造尤妙，水轮一转，炉火便旺，旧法半日的活计，如今一个时辰便了。他性子随和，教学时不藏私，只一样：图纸上的尺寸，分毫不可增减。有徒弟问何故，他道：「枫丹的钟表匠说，差一线，便差一世。」自此工坊里的规矩多了，量具挂在墙上一排，谁用过谁挂回去。海祇岛的匠人们私下都说，这位外国先生带来的，哪里只是机器，分明是一套做事的道理。此后工坊添了一面白墙，专贴泽维尔的新图，路过的人都要站一站才走。"
 SAN_event.37.a:"巧技为先"

 SAN_event.38.t:"白鹭衔书来"
 SAN_event.38.desc:"白鹭影蹁跹，社奉行里暗传笺，结盟共蓝天。神里家遣来的使者是趁着夜雾上岸的，随从一概不带，只一名老仆抱着一具锦匣。匣中并无金银，是几卷社奉行的旧藏茶谱，茶谱夹层里，才是真正要说的话。神里兄妹身在幕府之中，心内早把眼狩令厌恶到了十分，这一层彼此都是心照，只是谁也不肯先说破。几番往来，物资从通商的账目里走，消息从祭典的贺帖里传，一明一暗，竟织成一张盟约的网。临别时使者低声道：「神里家能担的，必定担着。」船影没入雾里，我方送行的人才发觉，匣底压着一枝白鹭羽，不知是无意，还是有心。自那夜后，离岛通往鸣神岛的航路上，多了一条不载客的小船，逢单日往返，船老大只认一枚贝壳印，认印不认人，官家的文书上，寻不见这条船的半个字。"
 SAN_event.38.a:"与盟修好"

 SAN_event.39.t:"万叶乘风破阵"
 SAN_event.39.desc:"风起叶飘零，浪人一剑斩长空，影中现孤鸿。枫原万叶回来了，带回他的剑，也带回一路风霜。此人来历，营中各有说法，只知他落魄时曾在山野间躲过缉拿，练就一身来去如风的功夫。如今由他领一队轻捷士卒，号为「万叶先锋」，专拣敌方防线最脆薄处下手，敌方阵脚未稳，他已掠过，幕府军士气为此大挫。有人问万叶何故肯留下来，他望着远处的海道：「浪人的家，原在江湖，如今这仗，便是江湖的事。」先锋队夜里不点灯，摸黑行军，脚程快得像一阵风扫过滩头，天亮时旗已立在新占的坡上了。军中都传，先锋队选人不问出身，只试两样：一是脚力，山道跑一个来回不喘的；二是心静，刀架在颈侧不眨眼的。万叶点人时也不多话，只朝对方看一眼，看得上的便点一点头，落选的也服气，说那一眼像风从身上过了一遍，瞒不住人。"
 SAN_event.39.a:"风卷残云。"

 SAN_event.40.t:"终末番暗助"
 SAN_event.40.desc:"潜影默无声，忍者行刺定乾坤，暗战决明晨。社奉行里有人暗中递了话，几名终末番的旧人陆续渡海而来，行装简便，落脚之处连营里将官都不尽知。他们教的不是武艺，是另一门学问：如何把自己变成夜色的一部分。学的人先蒙眼辨声，再学在苇丛里伏上半夜不动，末了才许碰真正的活计，摸哨、传信、留记号。白日里操练的空场，入夜便空空如也，仿佛从未有人来过。有士卒艺成下山，头一回随前辈出任务，回来只说了一句：「对面换了岗，我们比他先到岗上。」正面厮杀凭的是一腔勇气，暗处下手凭的却是十年苦功，这道理如今军中人人心里有了数。此后夜里各营换岗，都添了一条新规矩：口令之外，还要用手在对方肩头叩三下，叩的轻重缓急，各有讲究。"
 SAN_event.40.a:"影中缔约"

 SAN_event.41.t:"驰援绯木村"
 SAN_event.41.desc:"病榻见真情，海祇仁政广施布，民心向正义。绯木村的怪病闹了许久，人人讳疾忌医，说是触怒了什么，请了几回祝祷也不见好。心海大人不听这些，亲自拟了章程，遣医疗队进村：净水先煮沸，药材按户分发，病重的挪到临水的空屋里将养，医士两日一巡，脉案都记在册子上。起先村里人不敢近前，后来见医士自己也喝一样的净水，才渐渐开了门。有个老婆婆拉着医士的手不放，说：「村人都当我们要被撇下了，原来还有人惦记着。」不出一月，病势竟真的退了。此事传扬出去，各岛来投奔的人一日多过一日，反抗军的名声，从能打仗三个字，添成了肯救人三个字。医疗队撤走那日，村民送到村口，回头在井台边立了一块小小木牌，上书四个字：海祇之恩。"
 SAN_event.41.a:"仁声广布"

 SAN_event.42.t:"骨髓矿新法"
 SAN_event.42.desc:"钻机震岩层，晶化骨髓献宝藏，重工业辉煌。八酝岛的矿区从前是幕府的产业，缴获的工程机械落在我们手里，矿道便一日一日往深处去。晶化骨髓埋在岩层里，紫莹莹的一片，从前靠人力凿，十日出一船，如今钻机日夜不停，产量翻了一番还多。矿上的规矩也换了新章程：轮班下井，井口挂木牌记名，升井时一块儿对牌，一块儿都不能少。矿石装船运往踏鞴砂，炉里炼出来的钢，打成的装甲比从前厚实三分。有个老矿工摸着新钢板不肯撒手，说：「我挖了半辈子矿，头一回看见石头变成这个样子。」这话在矿上传开了，连最不肯服人的把头听了，也只闷头抽了半天烟。矿区尽头竖了一根高杆，钻机一响，杆头的小旗便抖一抖，山下的孩子都学会了看旗，旗动，便知道船又要来了。"
 SAN_event.42.a:"启矿取宝"

 SAN_event.43.t:"无想刃狭间之守"
 SAN_event.43.desc:"天险割山川，雷残响里筑坚垒，要冲守如磐。通往八酝岛的陆路本就只有一条，中间又横着一道深谷，谷是旧年雷罚留下的遗迹，崖壁如刀削斧凿，底下终年起雾。我们便在崖口起垒，营盘顺着山势铺开，岩壁里凿出隐蔽的火力点，枪眼朝外的都糊了山石的颜色，不走到近前，看不出那石缝里藏着人。粮道从崖后的暗道走，明面上只留一条盘山的窄路，遇袭时一声令下，窄路便断。这处狭间防线成了幕府军面前的鬼门关，来攻的队伍在谷底转了三日，连守军的人影都没见全。有幕府的降兵后来说起这一仗，只道：「山上石头都像长着眼睛，哪里还敢往上冲。」守垒的士卒自家也有一条规矩，每逢雨夜，必派两个人沿着崖边走一遭，不为巡哨，只为听听崖下的动静，他们说雾里的话，耳朵比眼睛靠得住。"
 SAN_event.43.a:"据天险而守"

 SAN_event.44.t:"军械归一律"
 SAN_event.44.desc:"规格归于一，万剑同铸战旗扬，补给无忧长。心海大人下令，全军的刀剑与弹药从此统一规格，令出之日，铁匠行里着实议论了几日，都说刀有百样，剑有千姿，如今铸成一式，未免无趣。有心海大人在册子上批了一句：「阵前补得上的刀，才是好刀。」众人便再无话。此后各营地通用一式炮弹，战损的武器拆下来，配件随手可得，粮车与弹药车再不必分厂分号，一路畅行。前线的军械官尤其受益，从前对账要对到半夜，如今数数格子便完事。铁匠铺里老师傅起初不肯改，亲手打了一式新刀，试过锋口，又与自家珍藏的旧刀比过轻重，末了把烟杆往腰里一插，说：「改。」如今新兵入营领刀，刀柄上都烙着同一枚小印，教官说，看见这枚印，便知道自己使的刀，天下的营里都补得上。"
 SAN_event.44.a:"规制归一"

 SAN_event.45.t:"八酝岛民来投"
 SAN_event.45.desc:"苦难铸铁躯，复仇之火燃胸膛，报国志昂扬。八酝岛的战事平息之后，幸存下来的人反倒一个个寻到营门口来投军，问他们图什么，多半不肯言语，只把袖口攥得死紧。这些人经历过家破人亡的惨痛，心里憋着一股沉到骨头里的狠劲。我们把他们编作独立的重装突击师，甲胄最厚，冲杀在前。攻打九条阵屋那一仗，师里的旗手倒了，后面的兵不看旗，只认得方向便往上冲，幕府军在后头看见这股不要命的势头，阵脚先自乱了。有个突击师的兵在战壕里磨刀，同乡问他磨得这样亮做什么，他道：「家里那口井，总得有人回去打水。」说完又磨，火星子溅在泥里，转眼就灭了。此后每逢出征，突击师的营房里夜夜都亮着一盏灯，没人去熄，值夜的军官换了几茬，这道暗规矩却一直留着，谁也不知最先是谁点起的。"
 SAN_event.45.a:"募选精锐"

 SAN_event.46.t:"御影炉心定规"
 SAN_event.46.desc:"雷光入笼中，严防泄露定生产，安稳保工坊。踏鞴砂的炉心不是寻常炉灶，里头封着旧年雷劫残下的力，一发不可收拾，当年幕府便吃过亏。我们接手之后，头一件事便是立章程：炉壁的振动一日三查，查出来的数都抄在粉牌上挂出去，连不识字的伙夫也能看个高低；炉心的温度与海水的走向，各有专人值守，交接时牌子当面点清。又定了铁令：炉边五十步内不许喧哗，不许带火种，违者立刻逐出厂区。有人嫌这规矩琐碎，老监工便把旧年炉心出事的光景说了一回，满堂再没人作声。自此炉火安稳，钢水日日不断，工坊里的人都说，这炉子如今是被人捧在手心里的，捧着它，也就是捧着全军的家当。值夜的更夫说，夜里炉心最静的时候，能听见一种极细的嗡嗡声，像谁在很远的地方念经。"
 SAN_event.46.a:"按部就班"

 SAN_event.47.t:"断其粮道"
 SAN_event.47.desc:"截其辎重车，乱其粮草焚其仓，敌军自惶惶。天领奉行的补给从鸣神岛起运，船队浩浩荡荡，防得严实，可再严的船队也架不住夜夜来扰。我们的快船三五只一队，白日里混在渔船当中补网晒网，入夜便贴着岛影摸上去，烧粮船的烧粮船，劫弹药的劫弹药，得手之后四散而走，天亮时海上只剩几片焦木。潜行的小分队更妙，专在卸货的埠头下手，头一夜只解开系船的缆绳，第二夜便有人学着放火。不出两月，幕府前线的粮弹开始告急，阵屋里的军令一日三催，催也没用。有个被俘的押运官交代得实在：「船不翻，人先慌了，谁还管得了船。」这般暗中削敌的功夫，虽不似正面会战那样轰轰烈烈，削的却是敌人的元气。后来渔村传出一句话，说幕府的船如今过水面，压得比从前低，不知是装得少了，还是人心沉了。"
 SAN_event.47.a:"扼其咽喉"

 SAN_event.48.t:"合围九条阵屋"
 SAN_event.48.desc:"重炮震敌营，阵屋四合困孤兵，拔钉正当时。反抗军主力已把九条阵屋围了个四面玲珑，西面炮位对着粮仓，北面炮位对着弹药库，东面临海，快船封了水路，南面一路留作空门，那是心海大人的意思，围师必阙，总要给困兽留一条自乱的活路。阵屋与鸣神岛的空中联络也断了，信鸽飞不出火网，传令的船一离岸便被截。围到第九日，阵屋里的炊烟淡了，夜里换岗的脚步也乱了。炮群早已锁定了弹药库的方位，只等总攻的号角。前线传令的士卒来回奔跑，喉咙都喊哑了，人人心里只有一句话：这颗钉子，今日必拔。阵屋墙外的老松上，不知谁挂了一只空鸟笼，风一吹便晃，围城的兵都看在眼里，谁也不去摘，渐渐地，连阵屋里的降兵下来，也先朝那棵树望一眼。"
 SAN_event.48.a:"合围聚歼"

 SAN_event.49.t:"真相如星火"
 SAN_event.49.desc:"传单漫天飞，揭露幕府虚伪心，唤起稻妻魂。稻妻城周边不知从何时起，多了一些卖香烛的小摊，摊主换得勤，货却总不缺。夜里无人处，摊底的夹层里便露出一叠叠传单，纸上印着勘定奉行与天领奉行私下往来的证据，日子、银钱数目，一笔一笔写得清楚。识字的念给不识字的听，酒肆里、井台上、船码头，听的人先是不敢作声，后来渐渐有人追问下回。官府张贴的告示当夜便被人覆了，覆告示的浆糊，用的正是奉行所自己发下来的那一桶。有个卖鱼的老人说得直白：「原来他们收税的时候，账早做在两边。」真相这东西，比长枪还锋利，民众一旦不再畏惧，幕府的天下便只剩一具空壳了。后来城里人夜里见面，只把两根手指并拢比一比，对方便知道了，这手势是打哪儿传出来的，至今没人认。"
 SAN_event.49.a:"以笔为刃"

 SAN_event.50.t:"号令归一帐"
 SAN_event.50.desc:"军令如潮水，统一调动无阻碍，如臂使指快。战线一长，各岛各自为战的弊病便显出来了，号令走海路，快船也要半日，误过的事不止一件。心海大人遂立联合指挥之制，各岛指挥所一线相连，令讯沿着地脉信号机一站一站转过去，数秒可达。每日辰时，各岛同时收到一份战略简报，敌军昨夜动向、今日潮汛、本部应办之事，全在一张纸上。指挥官们起初还信不过这新鲜物件，仍遣快船再送一份实信，跑了几回，见两下里从无差错，快船便只留作疑兵了。自此军令如臂使指，敌军尚未动弹，我军已先一步就位。有一回演习，鸣神岛外海的变阵令传到八酝岛，旗刚换完，回令已经到了，看台上的老将啧啧称奇，说这竟比当面吩咐还快。军中的老参谋私下说，从前传令靠腿，如今靠的竟是一根线。"
 SAN_event.50.a:"纲纪整饬"

 SAN_event.51.t:"百物归公库"
 SAN_event.51.desc:"仓库堆如山，各岛资源共调配，储备志在先。从前各岛物资各自管各自的，账目对不上，富余的烂在仓里，紧缺的干瞪眼。如今由总务司统一调配：神无冢的玉钢走陆路出山，八酝岛的晶石由矿上直发，海祇岛的珍珠与盐则随贡船北上，三处的货在奥摩斯埠头并仓，再按各营各坊的实需分拨下去。又在暗处设了几处储备仓，仓址连营里的将官都不全知，只知每月有一批货沉甸甸地进去，从不见出来。有人问心海大人，仗还没打完，存这些做什么，她答：「储备原不是为今日备的，是为明日不得不备的日子备的。」自此各岛的账册合了总，一支笔上收，一支笔下放，这个国家的家底，头一回清清楚楚地在册子上躺着。仓房上锁的钥匙一式两把，一把在心海大人处，另一把沉在一只封蜡的匣里，谁也不曾问过。"
 SAN_event.51.a:"养民蓄力"

 SAN_event.52.t:"军中立规矩"
 SAN_event.52.desc:"秋毫莫敢犯，纪律森严定军心，义师名远播。新颁的战时行为准则，是心海大人一笔一笔亲手改定的，条文不多，却条条落到实处：入村不许拿一针一线，买粮须按市价，付不了的先记账，营里派专员按月清账；擅动民间妇孺者，军法无情。准则抄成大字，贴在每营门首，识字多的教识字少的，人人背得上来。头一回收复失地，村里人起初闭门不出，后来见兵士宿在檐下不动民房，挑水劈柴与各家一样做，门户便渐渐开了。有个阿婆往兵士怀里塞煮鸡蛋，兵士按价给钱，阿婆不肯收，两下里推了半天，末了兵士把钱压在鸡窝边上走了。军中上下一句话传开了：我们是打回来的，不是打进来的人。这样的军纪，才是反抗军最耀眼的勋章。后来各村门口都添了条长凳，兵路过时坐一坐，村里人便放心了。"
 SAN_event.52.a:"军纪严明"

 SAN_event.53.t:"护漕舟师成"
 SAN_event.53.desc:"铁甲护商船，海路通达连四方，封锁自消亡。幕府的海上封锁一收紧，各岛的市面便先冷下来，盐贵了，布也贵了。我们遂组建护航舰队，船头装了元素炮，炮手由踏鞴砂工坊直接派驻；又与离岛商会私下立约，商会出船与门路，我们出护航，两下里五五分账，账目走得干净，谁也不欠谁。自此商船列队出海，护航舰一左一右夹着走，遇着幕府的巡船，先鸣号，不肯让路的才开炮。航线渐次重新通达，米价回落，市集又有了喧哗声。商会的管事们私下议论，说这些兵护船护得比自家人还上心。有位老船主出港时对着护航舰拱了拱手，道：「往后海上，就托付给诸位了。」潮水推着满载的船队往北去，桅帆连成一线，幕府的封锁，就这样从当中裂开了。夜航的船如今都敢点灯了。"
 SAN_event.53.a:"货通四海"

 SAN_event.54.t:"海祇设武学"
 SAN_event.54.desc:"将星出校园，兵法研习育英才，柱石撑危难。珊瑚宫后的灵地平出一座校场，军事学院便在此间立了起来。五郎执教场科，排兵布阵、攻守调度，一样一样地掰开讲；万叶教轻兵突袭，只带学生走夜路，山道上哪里藏得下人、哪里望得见旗，走到跟前才指点。学院取士不问出身，各营举荐的尖子与自荐的苦读之士同堂受业，三个月一考，考不上的回原队，考得上的授低阶军官之职。学生夜里在灯下抄战例，抄到眼酸便出去吹一阵海风，回来接着抄。有学生问万叶，书上的阵法到了实战可还有用，万叶道：「阵是死的，风是活的，书教你们认阵，路要你们自己看。」这些年轻人日后散到各营去，一个便是一粒种子，来日开成什么树，谁都说不准，根却是从这一处扎下去的。"
 SAN_event.54.a:"栽培将才"

 SAN_event.55.t:"炉火渡海迁"
 SAN_event.55.desc:"工坊入山腹，深藏功与名利间，避乱保生产。幕府的舰炮打得到滩头，却打不进山腹，众人便动了溶洞的念头。海祇岛几处天然溶洞深阔可容百人，我们选了三处，精密机件一件一件拆开，编号装箱，人抬缆吊，运进洞里重新装起来。洞口砌了石壁，外面看去只余荒藤野草，内里却别有洞天：车床依着洞势一字排开，排水凿了暗渠，通风借了海风对流的口子，防御法阵布在四壁，敌舰的炮弹纵然落在山头，震动到得洞里，也只剩一线微颤。匠人们入洞做工，白日不见天光，掌灯的师傅便在每张台前挂一盏玻璃罩灯，说灯亮着，手上的活就不许毛糙。有老匠人摸着洞壁的湿气感慨：「当年在踏鞴砂，烟往天上冒，如今烟都收进山肚子里了。」产能稳稳地留着，这就是分散了风险的国本。"
 SAN_event.55.a:"移营远图"

 SAN_event.56.t:"天灯窥远洋"
 SAN_event.56.desc:"扶摇上九霄，俯瞰敌后万里云，局势尽眼底。枫丹的充气机巧与我们的炼金感应器合在一处，造出了第一批侦察气球。球皮用多层桐油布密缝，充气用的是炼金液化气，升起来一柱擎天，底下缀着吊篮，篮里坐着观察员与感应器，缆绳锚在礁石后头，夜里才收放。气球升到寻常了望不可及的高处，敌军阵地的沟壕、炮位、营帐的走向，尽收眼底，幕府费尽心思布下的伪装，从高天看去不过是一幅画错了的地图。观察员在篮里画图，图卷顺缆绳滑下来，半个时辰内便铺在心海大人的案上。头一回升空那日，滩头上的兵都仰着头看，有人小声问那是什么，老兵答：「天上多了一只眼睛，咱们打仗，往后少闭着眼睛了。」幕府军闻讯大骇，尝试以弓弩射击，够不着，又疑心那是天罚之兆，士气先折了一层。"
 SAN_event.56.a:"统观全局"

 SAN_event.57.t:"药庐遍诸岛"
 SAN_event.57.desc:"药草香满园，战地救护争秒刻，死神亦胆寒。全境的伤员分级之法立起来后，救护便成了流水一样的事：阵地上先绑的止血带是第一道，绷带打的结都有定式；轻伤就地裹创，重伤贴着编号牌抬下去，中继站清创换药，稳得住的留下将养，稳不住的连夜送往后方的中心医院。各站都备着药草与净化的泉水，医士两班轮值，灯从不断。从前的伤兵多半是被抬着走完全程的，如今每一道关口都有人数着时辰接手，存活的人便多了。归队的老兵尤其可贵，枪声再密也不乱，包扎的空当还能指点新兵。有个断了三根手指的老兵不肯退伍，坐在工坊里教新兵装填，说：「我这只手教不了扣扳机，教得了怎么活命。」医官们私下一句话：救人便是在造兵，这买卖，天底下再没有比它更值的了。"
 SAN_event.57.a:"仁心仁术。"

 SAN_event.58.t:"巨舰出坞时"
 SAN_event.58.desc:"龙骨立滩头，巨舰如林向远洋，制海权在手。踏鞴砂的工坊归了我们，造船的家什与手艺便一并接了过来。海祇岛的船坞扩了两倍，龙骨一根一根立在滩头上，远看像退潮后留下的礁林。新船是全铁甲的蒸汽战舰，钢板自家炉里炼，轮机自家房里装，连桅杆上的旗也是自家染的。老师傅领着徒弟放龙骨那日，照老例摆了酒，酒洒进海里，众人便动手。图纸挂在坞边的大棚里，风一吹哗哗地响，有人说这纸响听着像号角。幕府的旧式水师还停在木壳船的时代，铁甲一出，胜负便不问可知。坞里的匠人有句口头禅：「木头船怕火，铁船专往火上撞。」等这些船下了水，东部海域的制海权，便再不是幕府囊中之物了。滩头的孩子如今放纸鸢，都扎成船的模样，说等大船下水那日，要放最亮的一只。"
 SAN_event.58.a:"重整舟师"

 SAN_event.59.t:"举岛动员夜"
 SAN_event.59.desc:"老幼皆甲兵，一战功成定乾坤，热血卫家邦。总攻鸣神岛之前，最终动员令发布下去，令文很短，落款却是心海大人亲笔。预备役的人领了军装，一队一队开进营地：渔夫交了船，铁匠带上锤，教书先生把学塾托给邻村，连山里的猎户也背了弓来投。有一家三兄弟同日入营，母亲送到村口，只嘱咐了一句：「都活着回来，一个不少。」送别的酒摆了满村，没人喝醉，都记着事。营房一夜之间住满了，操练场上口令声此起彼伏，白日晒的军装晾满了绳，夜里灯下写家信的，一写写到熄灯。这样的举国动员，幕府看在眼里，心里应该明白了：这海对面的人，是要把性命都押上来讨一个活法的。决心到了这一步，往后的仗，便不是兵器的较量，是两股气力的对撞了。"
 SAN_event.59.a:"孤注一掷。"

 SAN_event.60.t:"神社结防区"
 SAN_event.60.desc:"信仰化坚垒，各岛神龛守忠诚，灵光佑战旗。各岛的要紧神社，如今都按新的章程布防。这些地方原不只是烧香礼拜的所在，也是地脉结成之处，巫女与武士自此协同值守：巫女司祭、掌感应，武士司哨、掌调度，一内一外，缺一不可。神社四周立起刻了咒文的石桩，桩与桩之间有灵光暗连，敌军一旦踏入，地脉便起一阵局部的滞碍，脚步沉、弓力软，来犯的队伍未接战先折三分气力。巫女们起初担心兵刃亵渎神域，海祇的老巫祝只说了一句：「神明庇佑的，从来是护他的人。」一句话把众人的心结解了。自那以后，神社的香火反而更盛，来拜的人拜完了，总要在石桩旁站一站，摸一摸，像摸自家院墙。信仰成了屏障，屏障底下，是一片一片守住的国土。"
 SAN_event.60.a:"神佑海祇。"

 SAN_event.61.t:"机关运粮法"
 SAN_event.61.desc:"机关转不停，物资流转极速间，军需无匮乏。从遗迹里拆回来的齿轮机括，反向推究出一套传动之法，后勤的大节点上便先用上了：埠头的吊臂装了齿轮组，一箱弹药起落不过数息；仓里的分拣架依着齿盘转动，货到架自开，取毕自合；连山道上运货的滑轨也借了力，两个人推的货，如今一个人扶着便走。人为的错漏就此少了许多，从前点货点错一件，追查要误半日，如今齿盘转数记在纸带上，一笔一笔对得上。看管机关的老货郎起初直摇头，说这些铁家伙不吃不喝，哪天咬了人怎么办，待他看清齿箱外的护板与急停的木栓，又见学徒们上下油从不偷懒，便也服了。后勤这盘棋活了，前线的账就好算了，敌人的城防再厚，也架不住我们的物资像潮水一样，一波一波地送上来。"
 SAN_event.61.a:"漕运革新"

 SAN_event.62.t:"深潜舰队成"
 SAN_event.62.desc:"潜行影无踪，深海突袭乱敌心，浪涛任我行。试验性质的潜水艇编队今日正式入役，艇身狭长，漆成深墨之色，海上的人若不留神，只当是一段漂木。艇里空间窄小，水手们侧身而卧，一轮值六个时辰，出来时腿都伸不直，可没人肯调走。这鱼在水下静默而行，专拣幕府主力舰的锚地与航线候着，巨炮再威风，也打不着水底下的影子。首艇出海那日，艇长在桅台后立了一块小木牌，上书「影之鱼」三字，说这名字是全艇凑出来的。头一遭夜袭，幕府的运兵船在自家港口里被凿沉了两艘，事后查遍水面，连个木板都没捞着，幕府军中从此流传一句话：海底下有东西，别问是什么。深海本是海祇岛民最后的猎场，如今猎场里换了猎人，浪涛之下，海洋之魂正在觉醒。"
 SAN_event.62.a:"深海惊雷。"

 SAN_event.63.t:"重甲练锐士"
 SAN_event.63.desc:"重甲震大地，刀光劈开死神门，先阵定胜勋。稻妻城外的堡垒墙厚门沉，寻常的队伍啃不动，我们便专设了一支重装突击队：全身板甲，甲片层层相扣，寻常刀箭只当挠痒；又配重型元素盾，盾面刻着防御的纹路，几面盾相并，便是一堵会走的墙。操练的苦处非常人可受，甲胄灌了铅似的压在身上，一练便是半日，卸甲时贴身的衣裳拧得出水。教头立了规矩，甲不离队，队不离甲，半夜闻哨，一炷香之内必须成阵。突击队里多的是八酝岛来的汉子，旁人问苦不苦，有人拍着胸甲答：「穿它睡着都踏实，这是娘做的棉袄换成了铁的。」总攻那日，撕开城门封锁的差事便落在他们头上，这支最锋利的矛，冲锋在前，无坚不摧。操练场边的老槐树上挂着一口铜钟，钟绳换了三回，钟身上被巴掌拍出的亮印子，比花纹还深。"
 SAN_event.63.a:"重甲上阵"

 SAN_event.64.t:"巧手织新绳"
 SAN_event.64.desc:"蚕丝合秘金，坚韧轻盈胜皮革，护卫勇士心。炼金术士与织坊的女工合作，把蚕丝用植物药液反复浸晒，又掺入炼金的秘金丝，织出了头一匹合成防弹织物。试刀那天，老兵们围着看，一刀劈上去，布面只留一道浅白的印子，人肉裹在里头的木桩纹丝未动。更妙的是雷抗，雷元素沾上去，顺着药液浸出的纹路便散了，不伤内衬。织物轻软，贴身可穿，冬暖夏凉，兵士们起先嫌它不像甲，后来人人都抢着领。织坊遂日夜赶工，按营配发，新兵入营先领一身贴身的软甲。有位织娘摸着自己织的那一匹，说：「我织了半辈子衣裳，头一回织的是保命的。」科技上这一点一点的进步，落在战场上，便是实实在在的人命。营地墙上新贴了告示，教兵士们认织物的纹路，纹路顺的防雷，纹路乱的退回织坊重验。"
 SAN_event.64.a:"物料维新"

 SAN_event.65.t:"兵籍遍户牖"
 SAN_event.65.desc:"户籍归一册，保家卫国是英豪，义务重如山。兵役的旧例向来是富家出钱免役，穷家出人抵数，怨言积了不知多少年。新法把户籍重新造册，凡到龄的子弟一体登记，或入行伍，或充辅役，轮替有序，功过记档，谁家也不能例外。心海大人申明其意：军队是民众的军队，吃的是各家仓里的米，护的是各家檐下的灯，此二者原是同一件事。法令推行之后，兵源果然续得上了，几场大战之后折损的缺额，一季之内便补齐。更难得的是人心，兵不再是抓来的丁，是各家自愿送出来的子弟，家属领着抚恤，村里人敬着门楣，没人再逃役。有个送独子入营的老汉在册子上按了手印，按完说：「国是大家的国，轮也轮到我家的名。」这一册户籍，按下去的是名字，托起来的是一国。"
 SAN_event.65.a:"举岛皆兵"

 SAN_event.66.t:"「心海」巨炮成"
 SAN_event.66.desc:"巨管吐烟火，雷鸣声里碎城墙，威慑传四疆。重工厂里造出了稻妻史上最大口径的巨炮，炮身长逾十丈，分作三段运抵名椎滩，就着坡势铺了轨道，装成一辆列车炮，行话里叫作「心海」级。特制的元素爆裂弹一枚便有磨盘大小，装弹时八个人喊着号子推。试射那日，方圆数里的人都来看，一声令下，炮口先喷出一团橙红的火，随后雷鸣般的巨响才滚过来，大地震得人站不稳脚，海面的水鸟惊起一片。弹着点那座旧碉堡，瞬间便成了一堆碎石。量得的射程远远超出预计，军械官在册子上记完数字，笔尖顿了顿，又添了一句：足破任何坚垒。此炮一出，决战的底气便足了，幕府依为屏障的墙高城深，自此在这声雷鸣面前，都不过是迟早的事。此后名椎滩每旬试炮一回，近海的鱼群渐渐学会了躲，渔获倒没少。"
 SAN_event.66.a:"炮利甲坚"

 SAN_event.67.t:"试锋于长空"
 SAN_event.67.desc:"双翼掠长空，云端俯看战火飞，制空定乾坤。踏鞴砂的匠人们昼夜不歇，将炼金引擎嵌进木骨布翼之间，第一支双翼机中队就这样成了形。初试的那日，海风正紧，三架飞机贴着名椎滩的浪头掠过，翼下只坠了几枚小炸弹，滩涂上却腾起老高的烟。看操演的老船工拄着桨愣了半晌，喃喃道：「天上也能落雷了，往后这海还怎么走。」军械官倒不言语，只把引擎里的灰吹干净，又拿浸过油的布将翼骨细细擦了一遍，说铁鸟和人一样，养得仔细才肯替你卖命。幕府军那边自然也得了消息，天守阁下连夜加派了望的哨兵，可双翼来时不响不震，等哨子吹起来，炸弹早已落定，哪里还躲得及。夜里回到珊瑚宫，巫女们在祭坛外点起一排纸灯，灯影映在海面，随潮水一明一灭。心海大人隔窗看了许久，只淡淡说了一句：「从高处落下的意志，比甚么手段都更有分量。」灯灭了，海祇岛的潮声照旧，天上的路却已经换了一种走法。"
 SAN_event.67.a:"振翅凌空"

 SAN_event.68.t:"举国入战时"
 SAN_event.68.desc:"举国转齿轮，熔炉昼夜火不歇，决战志已立。反抗军指挥部正式宣布进入全面战争，民间所有工坊、铁铺、船坞一并归了战时调遣。踏鞴砂的老匠人把祖传的炼金炉让了出来，自己搬去廊下支个小灶，仍日日守着火色；离岛商行里几台新式织机拆了花饰，改织绷带与帆布，机声昼夜不歇。账房先生核着数，叹道：「这架势，是把家底都押上了。」押上便押上了，海祇岛的性子从来如此，潮水不到时候不涨，到了时候便谁也拦不住。珊瑚宫的祭典照旧举行，只是来的人少了些，唱祝词的巫女声音反而比平日更响，一字一句都像要递到阵上去。散了祭典，几个兵卒在望泷村口的石阶上坐着分吃一枚饭团，谁也不说何时开拔，只把米粒捡得干干净净。战鼓未响，齿轮已转，整座海祇岛连同它的灯火、织机与祝词，都在朝着同一个方向用劲。"
 SAN_event.68.a:"总动员令。"

 SAN_event.69.t:"暗桩递密报"
 SAN_event.69.desc:"暗影潜城中，信号一发即动乱，稻妻梦已惊。潜伏在稻妻城的细作递回密报：天守阁内派系倾轧，勘定奉行的账目已经烂到无人肯接手。我们借着几注不记名的银钱，暗中接济那些失意的武士。有从御前失势的老臣，有断了俸禄的下级旗本，白日里在人前仍旧衣冠齐整，夜里却对着空米缸长吁短叹。银子送到手上时，来人只低声道：「城下茶肆三更慢候。」一封封密信便在茶烟里传开，谁也不问银子从何处来，只问事成之后能分得几成。离岛与鸣神岛之间的航路时开时关，船主们把货物拆作三批走，账面上支离破碎，暗地里却条条有数。城中灯火如常，桥头的告示换了新纸，浆糊还未干透，而纸背后早已织好了一张网。总攻一旦发起，这座巍峨的天守之城将从内里先烧起来，胜负原不在城高，而在人心向背。"
 SAN_event.69.a:"静待时机"

 SAN_event.70.t:"号角鸣天守"
 SAN_event.70.desc:"雷雨决战时，万军齐发震天守，理想终有期。所有的准备，都化作这一刻的雷声。心海大人立在旗舰舰桥上，素白的袖子被海风掀得猎猎作响，她抬手按下号令，三军便在雷鸣里一齐动了。海上是蛇行的船队，岸上是踏过泥泞的步卒，天上是新成的双翼机，三路齐发，直指稻妻城。传令兵的声音都变了调，喊道：「为了海祇，进攻！」这一仗不为攻城略地，为的是终结眼狩令的暴政，为凡人的愿望争一个安放之处。旗舰后方的甲板上，几个年轻的水兵把刀擦了又擦，谁也不说话，只把望向稻妻城的目光放得又直又远。城那头，守门的兵换了新的一拨，年纪更轻，问口令时声音发紧。九条阵屋的火把添了一遍油，城墙上站的人比上月多了一倍，可雷声压过来的时候，火把的光都矮了半截。心海大人望着天边翻卷的雷云，轻声道：「潮水到了，就退不回去了。」万军齐发，雷光为号，这一夜，稻妻城的命运被重新书写。"
 SAN_event.70.a:"为新世而战！"

 # ========================== 第三阶段：平定旧域 (71-110) ==========================
 SAN_event.71.t:"清籁岛云翳"
 SAN_event.71.desc:"雷云旋聚处，孤岛静谧锁旧愁，巫女叹悠悠。内战虽告一段落，南方的清籁岛却仍被狂暴的雷暴死死锁着。那里原是叛乱者的避难之所，如今雷云不散，草木俱枯，渔船绕着走，连海鸟也不落在滩上，竟成了活人禁足的荒地。望泷村的老渔母提起那座岛，总要朝南拜一拜，念道：「浅濑神社的神主还在里头看着呢，可不敢造次。」为了国家安全与资源拓展，远征军的章程已经拟好，只待潮汛合适便启航。此行一为探明雷暴的根由，二为请浅濑响留下的咒术重见天日，让失落的土地重归秩序。出征前夜，几个老兵在营火边烤着鱼干，说起清籁岛的旧事，说的都语焉不详，只记得雷落下来的时候，海是紫的。营官把军械一件件点过，雷纹符纸用油纸包了三层，说岛上湿气重，受潮便不灵验。雷云依旧在海平线上盘旋，像一团积郁了太久的心事，如今终于有人要溯着它的来处，把旧债一笔笔问清。"
 SAN_event.71.a:"远征清籁。"

 SAN_event.72.t:"天云峠镇雷"
 SAN_event.72.desc:"雷霆入掌握，古老契约现端倪，力量换和平。浅濑响遗留的咒术残卷被送进珊瑚宫书房那日，心海大人翻到后半夜，烛芯剪了三回。她合卷时只说了四个字：「雷非天怒。」雷暴原是前人封存又遗落的力量，并非不可驾驭，只是历来无人敢与它讲条件。如今我们要反其道而行：不硬加消除，而以阵法为契、以祝词为引，将这股狂暴的能量缓缓引上半空，织成护住领空的雷盾。军械房里，匠人们照图样锻打引雷的铜柱，柱头铸作蛇形，说是应着奥罗巴斯的旧约。试引的那一夜，铜柱顶端接住一道雷，雷纹符纸齐齐亮起又缓缓熄灭，围观的人大气也不敢出，直到巫女报了「平安」二字，才有人长长吐出一口气。老匠人摩挲着微微发热的柱身，叹道：「千年的忿恨，竟也能守家护院。」雷光从此不再落灾，只为人所用。这一步踏出去，海祇岛离强国的路，又近了一程。"
 SAN_event.72.a:"制雷有术"

 SAN_event.73.t:"越石村重葺"
 SAN_event.73.desc:"村舍现炊烟，渔船重归碧波间，民生复旧观。第一批移居的船队靠岸那日，越石村的滩头站满了人。荒了多年的村子在海祇行政员的调度下重新冒起了炊烟：塌了半边的屋架支起来，茅顶换了新草，裂了缝的墙抹上灰泥，户下按人头发放安家的钱粮。新码头是用旧船板垫着修的，头一条渔船试水回来，舱里的鱼还活蹦乱跳，岸上的孩子围着一筐鱼数了又数。一位回迁的老翁摸着自家门槛，半天说不出话，末了只道：「门还是这扇门。」行政员把补册的名录摊在祠堂的案上，一笔一划替不识字的老人登记，笔墨纸砚都是自备的，说不肯多费公中一文。有兵卒原想借宿祠堂，被好意劝去了村东空屋，临走时村人塞给他们两个熟芋头，他们把芋头钱压在了窗台上。炊烟一日浓过一日，田垄间的脚印一日深过一日。一个安稳的家，胜过千言万语的动员，民心就在这一屋一饭之间，悄悄生了根。"
 SAN_event.73.a:"复苏百业"

 SAN_event.74.t:"寻百目鬼遗藏"
 SAN_event.74.desc:"海盗名声远，失落宝藏藏深渊，傲骨存世间。赤穗百目鬼，那位传奇海盗当年纵横清籁近海，留下的财宝与航海日记散在这片雷暴锁海的深处。远征军的船队贴着雷暴的边缘一路搜寻，桅顶的瞭望手日日盯着水下紫幽幽的光。寻访的老人还记得歌谣里的句子，哼道：「百目鬼的旗，十舱金来九舱酒。」寻宝不为装点门面：财宝入港便能充实国库，那几册航海日记里记着失传的潮汛与炮位，正是海军急缺的秘策。船上的书吏把已得的残页晾在帆布上，被雷雨洇开的字迹一笔一笔描清，描到「九鬼水军」四个字时手停了停。夜里收工，水兵们围着灯猜那一舱金如今沉在哪片礁下，老兵却摇头道：「金子是死物，歌谣里的胆气才是真遗产。」雷云仍在外海翻卷，可寻宝船的灯一盏接一盏亮起来，像要把这片被遗忘的海，重新从传说里请回来。"
 SAN_event.74.a:"打捞遗珍"

 SAN_event.75.t:"打捞清籁丸"
 SAN_event.75.desc:"巨舰浮出海，星光垂泪映余辉，重整旗鼓飞。「清籁丸」静静躺在沙滩上，船身覆着厚厚的藤壶，桅杆斜指天边，像一位不肯瞑目的老将。我们调来大型绞车与浮箱，要将它整体起浮、逐段修复。工程之艰巨远超预估：先是清淤，再是补肋，船底破口处一块龙骨板烂穿了，匠人们照着旧图样重新放料，斧凿之声昼夜不绝。有白发的老船工每天拄杖来看进度，看完了才肯回去吃饭，他说自己年轻时在船尾当过学徒，「这船身上的每一根钉我都认得」。起浮那日潮位最高，浮箱次第充气，巨舰的船首缓缓离了沙，岸上爆出一阵欢呼，有人当场落了泪。这不是一桩工程，是一面图腾：承载着岛民希望的巨舰若能再度扬帆，海祇岛在极端环境下的工程能力，必将令诸国侧目。夜里潮退，滩上留下一道深痕，老船工说明日船就进坞了，「雄风不减，来日方长」。"
 SAN_event.75.a:"壮举垂世"

 SAN_event.76.t:"观雷音权现"
 SAN_event.76.desc:"忿恨化纯灵，电光石火映科考，凡人窥神意。雷音权现是纯粹雷元素凝成的形体，无思无欲，只循着千年的忿恨盘旋不去。我们在安全距离外的海崖上建起观测站，铜架裹着云母，墙内衬了三层雷纹符纸。每当雷音权现掠过外海，仪器上的波形便如潮汐般起伏，书吏们轮班守着，连打盹都轮不出空。一位年轻的学士盯着记录纸看了整夜，晨起时喃喃道：「它不是乱发的，是有律的。」有律便可循，循律便可仿。依据能量流动的规律，全新的元素波段传感器正在图样上成形，一旦制成，我方的干扰与反侦察手段都将登上一个新台阶。观测站外，海风裹着湿咸的气息，把晾着的记录纸吹得哗哗作响。守站的兵丁起初惧雷，久了竟看出些门道，指着天边笑道：「它走的是老路，比船还守时。」神灵遗落的忿恨，就这样一笔一画，被凡人抄写成了智慧的基石。"
 SAN_event.76.a:"格物穷理"

 SAN_event.77.t:"浅濑神社重光"
 SAN_event.77.desc:"古刹钟声远，猫妖寝子守寂寥，文化传薪火。修复浅濑神社，是收服清籁岛民心的头一步。我们为那只固执的猫妖寝子送去修缮的木料与瓦，还照着旧例备了它念想了许多年的供品。船靠岸时，它蹲在残破的鸟居下，尾巴一圈圈卷着，既不迎也不躲，只等人把东西卸下，才慢悠悠踱过去嗅了一嗅。领队的匠人拱手道：「有僭越处，还请担待。」它打了个哈欠，算是应了。工匠们照着老图样一根根归位梁柱，匾额上的旧字描了三遍金，神社的大门重新开启那日，钟声穿过雷云的缝隙落进海里，被雷暴锁了多年的岛上，头一回有了香火气。随船来的巫女在社前铺开旧档，一页页抄录清籁岛的沿革与祭祀，抄到「浅濑响」的名字时，笔尖顿了顿才落下去。岛屿的历史与信仰，就这样在海祇岛的羽翼下续了香火。刀兵夺得下城池，夺得下人心，唯有文化这一缕薪火，燃得比军队更久。"
 SAN_event.77.a:"圣光重现"

 SAN_event.78.t:"雷暴骑特训"
 SAN_event.78.desc:"风雷穿林去，勇士无畏袭敌踪，速如闪电惊。清籁岛的雷暴从不停歇，我们偏在这片最恶劣的天候里，练出一支「雷暴突击队」。招募那日，报名的兵卒站满了校场，问他们怕不怕雷，答的话出奇一致：「怕，所以才来。」训练的头一个月，人人淋得脱了形：在狂风大雨里走阵型，一步踏错便全队重来；借着闪电的亮光辨识方位，趁着雷声掩护匍匐渗透。教官立在雨里喊：「雷替你们鸣，风替你们开路，还怕甚么！」渐渐地，队伍在雨幕里穿行如常物，靴底踩过泥水竟不留多少声响。一次夜演，他们绕开三道哨线摸进营地，守夜的哨兵到天亮才发觉旗子换了颜色。这些战士将成为海祇岛在极端环境作战的王牌：风暴来临之时，便是他们出猎之刻。雷电是他们的号角，雨幕是他们的帷幕，影子随雷光一闪而逝，待你看清时，人已在身后。"
 SAN_event.78.a:"特训锐士"

 SAN_event.79.t:"清籁筑海垒"
 SAN_event.79.desc:"要塞锁海咽，巨型岸防指远洋，南疆守如磐。清籁岛南岸礁石嶙峋、断崖错落，本是行船的绝地，如今却成了筑塞的好基。我们依着地势修起一座大型自动化要塞：远程干扰塔立在最高处，塔身缠着雷纹符纸，一通电便搅得方圆海面的侦测尽成乱影；崖腹里藏着重炮，炮口从岩缝间探出，足以击穿重巡洋舰的装甲。施工那阵子，匠人们用悬索把砖石一段段吊下崖去，海雾重时十步外不辨人影，只好系着铃绳作业，崖上崖下的铃声昼夜不断。落成那日试炮，一声闷响滚过海面，海上的靶船的装甲上多了一个透亮的洞，观礼的人半晌才想起欢呼。渔夫们在近海照旧打鱼，只是都学会了避开那片水，有老船工隔远了望一眼，低声说：「南边的咽喉，这回是真锁上了。」从此清籁岛成了海祇岛最坚不可摧的南部屏障，潮涨潮落，壁垒如磐。"
 SAN_event.79.a:"正我主权"

 SAN_event.80.t:"收雷云入匣"
 SAN_event.80.desc:"集电通高天，天云能量注熔炉，工业新纪元。天云峠的雷暴昼夜不息，前人避之不及，我们偏要在雷云的老巢里安一只「碗」。巨大的元素集电器立在峠顶，铜柱擎天，环阵如莲，每一道劈下来的闪电都被引着走，驯服地汇进储能的阵眼里。最初的电流忽强忽弱，调阵的学士们守了三个月，把引雷的相位一格格校准，直到某个雨夜，输出曲线终于平得像一匹素绢，守夜的人当场哭出了声。跨海电缆随后铺成，清籁岛的电力顺着海底一路回补海祇全岛。珊瑚宫的工坊头一回在夜里亮起成排的电灯，巫女们看着灯，半天不敢走近，老巫女却说：「亮堂好，抄经省眼睛。」踏鞴砂的熔炉换电之后，火色比从前更稳，出铁的成色都好了几分。狂暴千年的雷，成了灶下的火、机上的力。电力即未来，海祇岛自此步入元素能源的自由时代。"
 SAN_event.80.a:"能源自足"

 SAN_event.81.t:"鹤观雾里行"
 SAN_event.81.desc:"迷雾笼罩处，数千载轮回未休，孤魂复何求。那是一座被时间遗忘的岛。鹤观岛常年锁在浓雾里，我们的侦察船进去过数次，罗盘乱转、星月无光，每次都险些折返，幸而海崖上立着一座特制的炼金灯塔。灯塔的光是特调的蓝，雾气一沾便显出路径，船队依着光的指引一程一程往里挪，桅上的水手屏着气，只听见雾里不知名的鸟叫了一声又一声。靠岸后所见令人心头一紧：废弃的石祭坛上留着经年的供物，图腾柱上的纹样与今日任何一支族群都对不上号。随行的学者摹下纹样，叹道：「这不是荒岛，是一个古老文明的墓园。」我们要去揭开雾中的秘密：寻找先民留下的记载，超度那些仍在雾里徘徊的迷途灵魂，把他们带回光明。远征鹤观的命令已经签发，船上的军械之外，还多载了成箱的供品与古卷。雾深处，数千载的轮回仍在打转，这一次，终于有人循着光来了。"
 SAN_event.81.a:"破雾而行。"

 SAN_event.82.t:"千年雾将散"
 SAN_event.82.desc:"金羽划长空，迷障崩颓现真身，阳光照故土。阿瑠之羽送进书房那日，心海大人以祝词引雷纹，将羽上残存的记忆一缕缕引了出来。解析到第七夜，她终于合上册子，说：「雾的根，在山巅的祭坛。」钥匙既得，驱雾的灯塔便在惑饲滩破土动工。塔身以海石垒成，顶端嵌着一片仿制的金羽，落成那日祝声一起，塔顶骤然亮起神圣的白光。白光所及，浓雾如潮水般向海里退去，退一层，便露出一层山峦草木。守在滩上的船工们看得呆了，有白发老者跪下来朝着山磕了个头，喃喃道：「几千年了，头一回看清这座岛长甚么模样。」随行的绘师摊开画纸，手却抖得落不下笔，只说怕画错了对不住这景色。雾退尽了，岛屿的真实轮廓在阳光下纤毫毕现，沉睡数千年的港湾、梯田与古道一一显露出来。一扇新世界的门户，正缓缓向海祇岛开启。迷梦初醒，故土重光。"
 SAN_event.82.a:"重见天日。"

 SAN_event.83.t:"渡阿瑠之魂"
 SAN_event.83.desc:"少年歌声远，菅名山影迷雾散，救赎终有期。超度的仪式设在菅名山巅，心海大人亲自主持。祭坛前香烛成行，巫女们的祝词一叠一叠递上去，修补地脉裂痕的阵法在山石间次第亮起，像有人一针一线缝合一道几千年的旧伤。阵成的那一刻，山风忽然静了，雾气深处隐隐传来一段歌声，清清亮亮，唱的竟像是离家的孩子找到了归路。一名年长的巫女听完，抹着眼角说：「走了，这回是真走了。」数千年的血祭轮回，就此宣告终结。少年的歌声从此不再伴着惨剧，而是在海祇岛的港口里悠悠回响，渔家孩子编了新的调子传唱，唱到最后一句总要拖得老长，像要把所有委屈都送远。仪式散后，心海大人在山巅多立了片刻，轻声道：「正义已达，愿他安息。」对人性作这样的救赎，政府便有了神性，民心所向，不召自来。"
 SAN_event.83.a:"安息吧，阿瑠。"

 SAN_event.84.t:"卡帕奇莉遗泽"
 SAN_event.84.desc:"雷鸟翼扇动，残留威能定疆场，科学继神光。雷之魔鸟虽陨，残余的能量却仍散在清籁的地脉里。我们以雷纹符阵作引，将这股带地脉特征的高频雷元素一缕缕收进特制的晶瓶，瓶壁上蓝光流转，像封着一小片活的天色。运回珊瑚宫的路上，押运的兵丁轮班抱着瓶子，说瓶子温温的，像抱着一只睡着的雏鸟。实验室里，学士们以此为核心材料研制远程雷达：高频雷元素对山川岛屿的感应极灵，隔着浓雾也能描出船影轮廓。第一台样机试机那夜，屏上忽然亮出一串回波，众人核对航志，果然有一条夜航的商船正过外海。满室的人静了一瞬，随即欢呼起来，主持的老学士却摆摆手，指着屏面说：「看好了，这不是神迹，是学问。」神话时代的悲剧，就这样铸成了现代的利器。科学正在一寸寸剥开迷信的外壳，把神灵的余晖，化作守护国家的基石。"
 SAN_event.84.a:"尽得其法"

 SAN_event.85.t:"茂知祭场更新"
 SAN_event.85.desc:"祭台现新风，科学研究代迷信，古迹焕新生。茂知祭场的旧祭台被拆去了血槽与锁链，石阶洗刷一新，一座综合性科研中心就在原地立了起来。野蛮的旧式祭祀从此废除，取而代之的是学者们的灯火与纸笔。他们在这里研读古代文字，把失落的历史一页页翻译出来；当年用来献祭的铜鼎洗作了砚洗，图腾柱旁搭起了书架与图板。一位年迈的文字学者摩挲着碑上的刻痕，感叹道：「先民刻这些字时想的是传下去，不是让人拿命去填。」中心开讲的第一课，讲的是鹤观的迁徙史，台下坐着随迁来的岛民，有人听到祖辈的歌谣被抄在了讲义上，低头拭泪。入夜后，中心里灯火成排，远看像山间悬了一串星子。鹤观这座昔日的诅咒之岛，正在成长为海祇岛最前沿的科学中心。以知识的灯火代惨烈的香火，这便是文明的一跃。"
 SAN_event.85.a:"民智渐开"

 SAN_event.86.t:"菅名山取石"
 SAN_event.86.desc:"山腹藏秘金，大型钻机震幽冥，资源富万家。菅名山巨大的坑穴之下，探得一处极罕见的铬矿。经心海大人授权，深层机械采矿工程启动：钻机分段下井，昼夜轰鸣，山腹深处像藏了一颗不肯停的心脏。铬是硬货，高压水炮的炮膛、航空合金的骨架，缺了它都成不了形。矿道开到第三层时遇上地下暗河，工程队改道绕行，白搭进去一个月的工，井口的匠人们倒不气馁，领班的说：「山肯给饭吃，就不嫌它脾气大。」矿石升井那日，黑亮的一筐摆在井口，围观的人挨个上手掂了掂，说不出名堂，都觉得沉。矿上的工钱给得足，四周村落的青壮陆续来投，山脚新起了饭铺与车马店，入夜都亮着灯。海祇岛的工业体系，因鹤观的资源而补齐了最后一块短板。矿脉即命脉，一座山养活万家灯火，这话在从前没人敢想。"
 SAN_event.86.a:"深掘不辍"

 SAN_event.87.t:"知比山观云"
 SAN_event.87.desc:"山巅观云影，气象变化尽掌控，四海任我行。知比山高踞全岛之巅，是全稻妻最开阔的望眼。我们在山顶建起全天候的自动化观测站：风向标、雷暴仪、百叶箱沿着山脊一字排开，铜件擦得锃亮，雾天里远远望去像一串银豆。站里的观测员三班倒，昼夜记录云图与气压，台风将起的先兆、雷暴将成的方位，都要抢在在前头报出去。头一回准确预报台风路径时，外海作业的船队提前半日收港，一条损失都没有，渔户们凑了钱来谢，被观测员们婉言辞了，只说「这是本分」。海军里如今有个不成文的规矩：出海前必先问知比山的信。占了上风向，炮打得远、船走得快，海战胜负便先赢了一半。跨海博弈之下，我们已握住气象这个制高点。天机既洞察，四海皆通途。"
 SAN_event.87.a:"观云测风"

 SAN_event.88.t:"深渊噬岸时"
 SAN_event.88.desc:"幽影袭边界，兽境猎犬乱乾坤，战阵定乾坤。来自深渊的「兽境猎犬」在鹤观周边的空间缝隙里游荡，皮毛泛着诡异的紫黑，咬破的伤口会带来腐蚀。我们为此制定了专门的特种作战条令。操典写得很细：分队列阵须以盾墙合围，长枪刺喉不可近身；随身携带的元素中和剂分作三份，一份涂刃、一份备伤、一份留作退路的标记。头一回照条令作战，新兵仍慌了神，有个小卒被咬伤了臂，同伴按操典替他敷药、扎带、抬下火线，一气呵成，他事后说：「疼是疼，可心里有底。」自此军心渐定，遇上猎犬也不再四散奔逃，反能结阵反杀。军医处把历次伤例抄成册子，哪类伤要冲洗几遍、敷药几层，都写得清清楚楚，册子的封皮上题了四个字：「守护清净」。与深渊对抗的这些经验，一寸一寸磨出来，让我们的军队成了提瓦特大陆上最专业、最坚韧的防线。"
 SAN_event.88.a:"涤荡邪祟"

 SAN_event.89.t:"译古文千卷"
 SAN_event.89.desc:"壁画语千载，石根文字现真意，历史复全观。鹤观遗迹深处的壁画与石根文字，经学者们数月的比对摹拓，终于串成了一部完整的史册。数千年前的天钉坠落，原是如此惨烈：山崩地陷，文明断代，先民携残卷渡海，散落诸岛。译到「守誓者东渡」一节时，主持的老学者停了笔，半晌才说：「原来海祇岛民的血脉里，从来不是难民，是守望的人。」此言一出，满室寂然，随后的抄录校对都做得格外郑重，仿佛纸上有先人注视。译成的史稿装订成帙，送往珊瑚宫藏书楼与诸岛学塾，孩童们摇头晃脑念的不再是空泛的传说，而是有据可查的来处。有渔家老翁翻着讲义上的摹本，认出其中纹样与自家传了几代的船饰一模一样，当即把祖传的旧船饰捐了出来。知识的回归给了这个国家深厚的文化自信：我们继承的，是被神灵封印多年的遗产。根基既明，来路既清，脚下这条新路便走得格外稳。"
 SAN_event.89.a:"文脉初醒"

 SAN_event.90.t:"千里眼成网"
 SAN_event.90.desc:"电波织密网，海天变化无遗漏，入侵莫敢前。知比山与天云峠两座雷达站落成之后，中间补上三处中继哨，一套覆盖全稻妻南方的预警网络正式合拢。值机的军士昼夜盯着示波屏，屏上绿光扫过，航迹一个个显出来，编着号登记在册。任何未授权的飞行器或舰船，只要踏进这片海域，不出一炷香便会被记下位置、吨位与航向。起初误报颇多，一群海鸟也能在屏上拖出一片杂波，后来值机员们练出了眼力，看波形便知是雁群还是船队，误报几乎绝迹。一次夜里的不明航迹试闯，网络三处联动追踪，岸炮未发一弹，对方便转头退了出去。值机日志的末页写着一行小字：「无人敢试第二回。」电子化的边境自此无声而严整，岛民们夜里睡觉，门也不必闩得那样紧了。铁幕已立，海天之间，每一寸波纹都在册。"
 SAN_event.90.a:"天罗地网。"

 SAN_event.91.t:"海祇设巡抚"
 SAN_event.91.desc:"巫女巡四海，领袖恩威抚人心，版图定永恒。心海大人亲自遴选巡抚团队，派驻清籁与鹤观。每支团队由一名巫女主持，携行政官、医士与学塾先生同往，船还没靠岸，岸上的章程已经拟好了三套。巡抚之下，直接隶属珊瑚宫的行政署挂牌办公，钱粮、狱讼、学务各有专司，匾额一律素底黑字，不许奢华。头任清籁巡抚到任那日，先去了浅濑神社进香，再登门拜访各村耆老，茶碗端起来先说「请多指教」，而非「奉命而来」。鹤观方面则先用三个月清丈田土、登记户册，粮饷依册发放，一分不短。有旧日的部落首领不服管束，巡抚不派兵，只请他进署里对账，一样一样摆清楚，末了首领自己叹道：「账都服了，还争甚么。」三座原本孤悬的岛屿，就此缝进同一个高效体制。恩在茶饭之间，威在章程之内，版图既定，海祇大成。"
 SAN_event.91.a:"四海一家"

 SAN_event.92.t:"老兵归田舍"
 SAN_event.92.desc:"解甲归田日，新领土上定根基，民兵守边疆。为了巩固新领土，政府鼓励反抗军的老兵在清籁与鹤观落籍安家。愿去的老兵各领了一份厚赏：农具成套，种畜成对，屋基地任选，头两年的赋税一概减免。第一批安置船离港时，码头上军乐相送，老兵们回身敬了最后一个军礼，转身便扛起犁头。他们在新垦的田边照旧列队操练，农忙时是庄稼人，农闲时回归营伍，枪架上挂着锄头，锄头旁边立着长枪。有村童问他们从前杀过多少人，老兵只笑笑：「往后你只管念书，那些事有我们守着，轮不到你。」几年下来，边境村落已自成气象：鸡犬之声相闻，哨位暗桩相接。地方官册上他们是农户，军部的名册上他们是民兵，一声令下，黄昏集合，入夜便能成军。武德长存，不在旗号上，在这青黄相接的田垄之间。"
 SAN_event.92.a:"拓土开疆。"

 SAN_event.93.t:"锁空之壁垒"
 SAN_event.93.desc:"仰望碧空净，防空重炮织火力，天际莫敢犯。航空威胁与日俱增，各岛高地上的防空阵地随之密集铺开。阵地选址讲的是章法：主峰架远程炮，半坡布中程，滩头隘口补近程，炮位之间以地下廊道相通，一处示警，处处开花。炮兵们打得极苦，冬练霜、夏练雨，引信的口径差一分都要罚操，教官说：「天上没有第二次机会。」首次全岛联演那日，假定敌机队自东南来袭，三道火网次第张口，曳光的弹幕在云端织成一张亮眼的穹顶，观演的老兵仰着头，半晌说了句：「天上的门，关上了。」此后敌机若来，须先穿过这层层弹幕，再躲开追踪的探照灯，能活着临头的十不存一。海祇岛的领空，不再是旁人随意进出的后花园。我们要用密集的弹幕告诉所有人：这里，是高天之下不可逾越的死线。"
 SAN_event.93.a:"锁空之备"

 SAN_event.94.t:"诸岛约关税"
 SAN_event.94.desc:"贸易无壁垒，珍珠矿产物流转，经济合伟力。海祇岛、清籁与鹤观的统一大市场，在离岛商会的见证下正式立约。内部所有过路费与关税一并取消，原先设在中途的三道税卡，头一日便拆了两道，拆下的木料就地改作了路亭。自此海祇的粮米北上，清籁的电力入网，鹤观的铬矿下山，三岛的物产顺着新辟的航路昼夜流转。头一个月的账目便亮眼：离岛码头的货栈不够用了，商人们合股又添了两排；渡船的班次从一日三班加密到一班一个时辰。有老商人拄着秤杆感慨：「从前跑一趟鹤观要打点七八处，如今一份税单走到底，省下的都成了本钱。」账房里的算盘声一直响到深夜，账册摞得比窗台还高。深度的经济整合让国家的总产值节节攀升，一个强大的区域经济强权，正在东方的海上崛起。富国而后强兵，粮足财通，方能言胜。"
 SAN_event.94.a:"共致丰饶"

 SAN_event.95.t:"外海设帅帐"
 SAN_event.95.desc:"将略统全域，数字化指挥链条，战力定巅峰。海疆日广，三岛分治的旧法渐渐不合时宜，独立的外海防御司令部应运而生。司令部设于珊瑚宫东翼，统筹三岛的防御、后勤与人员调动，堂内一面巨大的海图占了整堵墙，图上三岛要塞、航道、雷达网以不同色钉标明，一目了然。指挥链条也改了新法：军情分级传递，号令逐层下达，一级一刻钟，令出即行。首任司令官到任第一日便立了规矩：「图上一支笔，海上千条船，落笔之前，先想十遍。」头一回全链路演习，三岛分处同时接令，驰援的船队在天明前抵达受威胁的哨点，比操典规定的时限还快了两刻。此后无论哪一点遇险，全域的支援都会瞬间抵达，再无鞭长莫及之叹。战线既统一，将略贯全域，战力自此定于巅峰。"
 SAN_event.95.a:"指挥有序"

 SAN_event.96.t:"沧海定霸图"
 SAN_event.96.desc:"巨舰巡四海，蓝色旗帜定尊严，主宰波涛里。海祇岛正式昭告诸国：全稻妻南部海域，自此由我巡守。强大的巡逻舰队随即开航，蓝底蛇纹的旗帜在桅顶猎猎作响，巨舰分途巡曳，监视任务常态化进行。航路上，任何过往商船都须先向巡防哨通报船籍与货单，通报过的船插一面蓝色凭旗，沿途各哨一律放行免检；不肯通报的便要靠港受检，误了船期，怨不得旁人。起初有船主嫌繁琐，托人来说情，舰队只回了一句：「报一声便可行船，比从前各处打点，不知省了多少事。」不出三个月，遵行的船只占了十之八九，过路费与凭旗规费源源入库，航路的治安也随之大好，劫船的传闻近一年绝了迹。渔民们说，如今海上夜里能看得见巡舰的灯，睡得踏实了。海洋霸权既立，海祇大御神的荣光重新照耀这片古老的波涛。"
 SAN_event.96.a:"蔚蓝之辉"

 SAN_event.97.t:"雏鹰出海时"
 SAN_event.97.desc:"战隼掠海翼，俯冲投弹乱敌营，制空制海一。清籁岛的训练基地里，第一批海军飞行员完成了全部科目演练。他们的课业极为苛刻：狭窄的海滩上顶风起降，起伏的甲板上钩索着舰，浪头一起一落，机轮触板只容一次机会。摔过的新人在沙盘前复盘到深夜，教官只说一句：「海不留情，练到它留。」结业那天，十二架「海隼」列队掠过基地上空，翼尖擦着浪花俯冲，靶船上的烟柱一根接一根竖起来。观礼的舰队司令在日志里写道：「自今日始，舰队的手臂延伸了数十公里。」飞行员们下了机还来不及卸装具，先被同伴抬起来抛了一回，笑骂声混着海风传出老远。空中之眼与海上之拳自此合为一体，敌营在俯冲之下无处遁形。高天之上，海影之间，海祇岛的军事理论已经全面超越了时代。"
 SAN_event.97.a:"海天一气"

 SAN_event.98.t:"漕运总枢"
 SAN_event.98.desc:"补给永连绵，大型枢纽通诸岛，战争无匮乏。鹤观与清籁之间，一座大型自动化补给基地已建成启用。基地依着地脉共振的原理铺设短途运输阵法，成箱的粮弹搁上阵台，祝词一诵，光纹流转，货物便跨海而至，风浪再大也误不了时辰。守阵的法师们分班值守，交接时要互相核验阵纹的温度，老法师说：「阵如人脉，冷一分就慢三分。」仓库沿山而建，一层存粮，二层存弹，三层存药材被服，账册编到第四十本。初时阵法偶有波动，一箱药材误了半个时辰，基地上下连夜排查，将共振的频率重新校准，此后再无误期。如今前线无论遇上甚么突发，二十四小时之内必能收到充足的战略储备，粮弹不缺，人心不慌。前线的将士都记得一句话：后勤是胜利的唯一基石。这座无忧中枢，便把「胜利」二字，稳稳托在了掌心。"
 SAN_event.98.a:"漕路无阻"

 SAN_event.99.t:"政令归一署"
 SAN_event.99.desc:"法度归一律，高效行政肃纲常，秩序定民心。心海大人签署《海祇领地统一管理法案》的那日，珊瑚宫外的海面上正好风平浪静。法案之下，新岛屿一律设立专业的分支管理机构，取代从前落后的部落自治：钱粮有专库，狱讼有专厅，田土户籍有专册。统一的度量衡率先推行，清籁的秤与海祇的秤对上了星，鹤观的尺与望泷村的尺合了缝。统一的教育随后铺开，学塾里三岛的孩童同念一册课本，谁也不再问「你是哪座岛来的」。统一的法律最见成效：以往部落械斗要请长者说和，如今一律递状公断，判词张榜，人人可阅。有老猎户起初不服，输了官司却在判词前站了许久，末了说：「写得明白，我认。」三片原本陌生的领土，就这样被一册法、一杆秤、一堂课紧紧凝聚起来。大同之路尚远，但共同的意志已经生根，秩序既立，民心自安。"
 SAN_event.99.a:"万政归一"

 SAN_event.100.t:"诸岛盟约成"
 SAN_event.100.desc:"唇齿相依日，万众一心卫家园，外敌莫敢欺。共同防御协定在珊瑚宫大殿签署：一岛受难，诸岛同讨。签约那日，各岛的代表依次用印，印泥都是朱红，落印的声音一记接着一记，殿内安静得能听见潮声。这份公约不只是政治文书，更是把所有岛民的命运系在了一起：条款写明，任何一岛遭袭，其余各岛须在三日之内出兵、出粮、出船，短缺一样即为背盟。起草的文书官特意把这一条抄在卷首，说「盟不在长，在硬」。消息传开，望泷村的渔家把船桨系上了红绸，清籁的老矿工凑钱铸了一口钟，说是「警报钟」，一岛敲钟，诸岛皆闻。有老人坐在滩头看了半日海，喃喃道：「从前各扫门前雪，如今门连成一片了。」集体防御之下，任何潜在的侵略者都要先掂量整个南部群岛的怒火。团结比堡垒更能给人安宁，血盟既立，永不相弃。"
 SAN_event.100.a:"牢不可破。"

 SAN_event.101.t:"鹤观巧作坊"
 SAN_event.101.desc:"矿砂化秘金，深加工中增产值，工业冠群伦。只卖矿石，终究是把肥肉让与旁人。于是鹤观岛上，一座现代化的选矿与精炼厂破土动工，选址在铬矿井口之侧，省去转运的脚钱。厂房内高炉林立，选矿的滚筒昼夜转动，砂石进去，亮闪闪的精粉出来；精炼炉前一班十二人，火色的老嫩全凭肉眼拿捏，老师傅带徒弟，先教「看火」三年。头一批高纯度合金出炉那日，质检的学士拿刀试了锋口，迸出的火星落在地上还是亮的，他当场批了「入库特等」四字。这批合金一半供给本国的军械房，一半装船出口，价码翻了矿石好几番，外汇源源流入。有外商想连厂带矿一并买下，商务署的答复只有一句：「矿可议，厂不卖。」产业链每延伸一寸，经济主权便厚一分。火与铁的交响声里，「海祇制造」四个字正在崛起。"
 SAN_event.101.a:"事半功倍"

 SAN_event.102.t:"仪式石探秘"
 SAN_event.102.desc:"古石藏秘法，重组频率现威能，科技定乾坤。鹤观祭祀石的碎块送进实验室时，外头还裹着防潮的油布。学士们以物理之法将其重新排布，晶格重组之后，石内隐伏的元素流竟顺着新的纹路循规蹈矩地走，不再是散乱的游光。据此制成的新型蓄电池，容量抵得上传统容器的十倍。试装的第一批单兵武器连射了一整日不曾断电，操演的兵丁收枪时咂舌道：「往常打半日就得换匣，这回连午饭都吃过了还有劲。」自动化机械更是受益：值守要塞的机械臂换装新电池后，连着四十日没有下过岗。研究的主笔在报告末页写了一句题外话：「古人的巫术未必是虚言，只是他们叫法不同。」于是实验室门口添了一块小匾，题作「敬古」二字。古代的巫术在科学的手术刀下焕发新机，一场能量革命，正从这块小小的石头上蔓延开去。"
 SAN_event.102.a:"技艺精进"

 SAN_event.103.t:"观风暴于先"
 SAN_event.103.desc:"云端望雷电，精准预报定航向，风波亦无妨。清籁岛的全天候气象中心建在天云峠侧后的一处高台，避雷的铜塔立在四角，塔尖终日指着翻卷的云。中心监控大气电荷，仪表上的指针一颤一动都记进册子，值班员两人一组，一个读数、一个抄录，昼夜不停。不出半月，他们便摸清了雷暴的脾性：哪片云先聚、哪道电先闪，往后数小时的风暴路径，竟能一寸寸画出来。第一份正式预报发出那日，恰有一支运输船队在外海，收到「西北有风暴，速避」的急信，船队改了航路。次日过那片海域的商船被掀翻了两条，船主们送来谢帖，气象中心只回了四个字：「分内之事。」海军里从此有了新战法：等风暴压向敌阵再出击，雷雨便是我们的屏障与掩护。自然不再主宰这片海，掌握它规律的人才是。"
 SAN_event.103.a:"先知风暴"

 SAN_event.104.t:"收百目鬼部"
 SAN_event.104.desc:"义旗再扬日，海寇归心卫正途，骁勇震八荒。曾经跟随百目鬼的老海盗们，由三位年长的舵主领着，在珊瑚宫前宣誓效忠。宣誓用的还是当年山寨里那面残旗，旗面上的蛇纹褪得只剩个轮廓，舵主把它供在案上，说：「旗旧人不旧，今日换个旗杆。」心海大人受了他们一拜，只提了一条规矩：「劫掠之事，自此一笔勾销，再犯者，按军法。」老海盗们轰然应诺，笑声震得殿前的海鸟都飞起来。这些人经风霜、识水性，对复杂水域的直觉是花多少军饷也买不来的：哪片礁下有暗流，哪个雾口能藏船，闭着眼也说得出。我们将其改编为「海祇别动队」，专司敌后打击这类最险的差事。受编那日发下新军服，有老海盗捧着看了半晌，说从前抢来细软堆满舱，心里空落落的，如今一身布衣，「倒踏实了」。海洋上的猎犬重新入笼，如今这笼，通的是正途的门。"
 SAN_event.104.a:"舟师得援"

 SAN_event.105.t:"越石渔事有章"
 SAN_event.105.desc:"银鳞满载归，工业捕捞丰粮仓，民生足有余。传统渔业靠天吃饭，如今把现代管理的法子引了进来。清籁岛外海划出了轮捕区，捕几日、歇几日，鱼群得以休养；码头上新起两座冰窖，渔船一靠岸，鱼获先入冰再分拣。冷链的船队每日往返诸岛，车马店的老板兼着押运，天没亮就套车，说是「鱼等不得人」。标准化的加工作坊随后开张：剖鱼、盐渍、晾晒各有专人，成品一律称足分量、贴上印记，买的人闭着眼也放心。从前渔汛一过，市面上的鱼便又贵又腥；如今一年四季鱼货不断，价钱平了，寻常人家碗里也常见鲜物。有渔家老妇在作坊里做工，领了头一个月的工钱，买了布给孩子裁衣，逢人便说这日子「从前想都不敢想」。稳定的食品供应喂饱了餐桌，也壮实了国家的战争潜力。民以食为天，餐桌丰了，底气便足了，渔歌唱晚，声声都是安稳。"
 SAN_event.105.a:"给养无忧"

 SAN_event.106.t:"天云峰设帐"
 SAN_event.106.desc:"高山望远瞩，尖端科研育人才，智慧通高天。天云峠最高处，一座跨学科科研基地落成了。选址时有过争执，有人说太险，最后心海大人一锤定音：「做学问的人，心要高，站得高些没有坏处。」基地汇集了全稻妻最优秀的头脑，高能物理、地脉动力、航天雏形三个方向各占一翼，书房的窗都朝南开，说是「让读书人看得见远处的海」。入基地须经荐举与试帖两道关：荐举凭学界的口碑，试帖出题不问出身，只问真才。首期收了四十七人，最小的十六岁，是清籁一个铁匠的儿子，答题答得满纸生风。开院那天，山风很大，年轻的学士们站在崖边看云，老院士在身后说：「千年解不开的难题，就在那云里头，你们去把它请下来。」夜里基地灯火通明，山下的渔家远远望见，都说山顶「挂了星星」。知识，就是海祇岛通向伟大的入场券，如今这张券，正一批批发到年轻人手里。"
 SAN_event.106.a:"格物为上"

 SAN_event.107.t:"护盾初成时"
 SAN_event.107.desc:"光盾御外侮，雷火不侵佑兵锋，科技立屏障。受雷鸟能量场的启发，第一代便携式元素护盾发生器研制成功。装置只有水壶大小，缚在背甲上，激发时周身浮起一层淡蓝的光膜，冲击波打在上面便像浪头撞上礁石，散作四下流光。试盾那日，工房外埋了炸药，一名老兵抱着发生器站在三步之外，药响过后，他抖抖衣襟走出来，只说耳根有点热。围观的人先是静，随后掌声炸开了锅，那老兵却摸着发生器半天没说话，末了道：「往后上阵，身后那点牵挂能轻一半。」量产的命令随即下达：每一个突击师都须配齐，操典加了一条，护盾未激活不得进入轰炸区。发下去的头一批货，兵卒们给装置起了诨名叫「小雷神」，点名时都要拍一拍它。科技筑起了保卫生命的第一道防线，战士们在烈火之中，亦能如履平地。"
 SAN_event.107.a:"无懈可击。"

 SAN_event.108.t:"外岛税约"
 SAN_event.108.desc:"货通三岛间，经济命脉紧相连，同盟兴万利。《离岛与海祇自由贸易协定》由心海大人亲笔签署，墨迹未干，商人们已在口岸放起了鞭炮。协定之下，两地的关税逐年递减，商船凭一纸通引可直入双方港口，不必再层层打点。以海祇岛为中心的海洋经济共同体，就此正式确立。离岛的药行把分号开到了望泷村，海祇的鱼行也在离岛占了铺面，资本的流转像潮水一样，哪里洼地便往哪里去。头一年的账目报上来：双向贸易额翻了一倍有余，库银的进项添了三成。有老掌柜在账房里拨着算盘感叹：「从前是隔海的买卖，如今是一家的账本。」财政官把新增的岁入分作两份，一份充作军资，一份平抑粮价，都各有用处。财源既通，命脉相连，经济的统一从来是政治合一的前奏。这一步棋落下，往后的路便都宽了。"
 SAN_event.108.a:"盟约愈坚"

 SAN_event.109.t:"大御神荣光"
 SAN_event.109.desc:"信仰化剑芒，神像光辉映蓝洋，主宰定民心。各岛的大御神像先后落成。像身以海石垒砌，外敷螺灰，蛇首人身，目望远洋，最高的一尊立在望泷村后的崖顶，落成那日，全村人仰着头，好半天没人说话。开光的仪式由年长的巫女主持，祝词一叠一叠递上去，末了满岸的人一齐伏拜，海浪拍岸的声音都像应和。此后渔船出海必先绕像一周，渔家说「神像看得见的地方，风浪都让三分」。神像之下立着义仓与学塾，祭日放粮、祭后开课，信仰与衣食连在一处，民众的战守之心不用催，自家便立起来了。有从鸣神岛渡来的老僧看罢叹道：「塑像易，塑人心难，他们倒把两样都做全了。」神圣感一经立起，统治便添了一层不可侵犯的光。信仰是不灭的火种，火种在前，霸权之路便照得分明。"
 SAN_event.109.a:"神佑吾民"

 SAN_event.110.t:"远征军出港"
 SAN_event.110.desc:"铁流向汪洋，正义之师显神威，志气贯苍穹。远征军团在海祇港集结完毕。这支由各岛精锐合编的部队配发最先进的双管自动步枪，每个连队都携带便携电台，号令一下，百里之外也能即时呼应。受阅那天清晨，海面起了薄雾，队伍从雾里开出来，枪刺上的水珠一颗颗亮着，像出鞘前的寒光。心海大人检阅时不讲长篇的话，只问了三个字：「都齐了？」应答声整齐得像一个人。这支部队的目标早已不止于守土：哪里有压迫，哪里有苦主，他们的船便往哪里去。随军的文书写下一句：「枪是我们的言语，愿这言语只在万不得已时开口。」出发的号角吹响时，码头上送行的家眷没有哭声，只有人往兵卒手里塞熟鸡蛋，一人一兜，装满了才肯撒手。海洋之子无所畏惧，远征，自此开始。"
 SAN_event.110.a:"更上层楼"

 # ========================== 第四阶段：白夜遗产 (111-140) ==========================
 SAN_event.111.t:"渊门初启时"
 SAN_event.111.desc:"天崩地裂后，深渊遗迹藏忧，白夜几时休。现人神巫女大人宣布，开启渊下宫的尘封封印。那是一个被世界遗忘的维度，光倒着走、海悬在头顶，藏着我们祖先最辉煌也最痛苦的记忆。远征队在蛇肠之路集结，行前的清点做得极细：灯油备了三倍的量，绳索浸过蜡，每人另发一枚白夜石符，说是迷途时握紧它，能想起回家的路。随行的学者背着成捆的拓纸，笑称「去抄一抄老祖宗的手稿」。年纪最长的向导是白夜国遗民之后，出发前夜他独自去祠堂上了香，回来只说了一句：「替没等到今天的人走一趟。」封印开启的瞬间，门后的黑暗深不见底，众人把灯举过头顶，一程一程往里走，脚步声在空旷里荡出很远。我们要深入那无尽的黑暗，带回白夜国失落的科技，把被淹没的历史一寸寸掘出来。真相在地底等了千年，如今终于有人提灯而来了。"
 SAN_event.111.a:"深入海渊。"

 SAN_event.112.t:"日月前事"
 SAN_event.112.desc:"禁书录旧史，第一王座现真容，天理亦惊心。那部被严令销毁的《日月前事》，终于在渊下宫的残殿里寻回了完本。书页脆得像蝉翼，抄录的人翻一页都要屏住呼吸，白纸黑字之间，是一段彻底颠覆认知的旧史。校订的学士们起初不敢落笔，有位老儒抄到一半搁了笔，隔了三日才重新拿起来，说：「写都写了，后人若不看，才是真的亡了。」心海大人深知此书的分量：一旦传开，诸国将不得安宁。她最终只批了八个字：「民可求知，不可欺蒙。」书存于珊瑚宫最深的书库，门禁三重，抄本按卷分授，读的人须亲立誓约。签誓那日，头一批十人排成一列，个个面色郑重，像接的不是书，是刀。掌握了过去，便掌握了未来的定义权。谎言养不长久，真相纵然万钧，也自有它立身之处。"
 SAN_event.112.a:"启禁忌之门"

 SAN_event.113.t:"大日御舆重燃"
 SAN_event.113.desc:"人造日升起，黑暗龙嗣尽遁逃，白夜映辉煌。大本营的工程师们围着大日御舆的能源核心勘了七日，图纸改了十三稿，终于定下重燃的方案。点火那日，地底静得能听见心跳，主炮手的手在扳机上停了一瞬，领队的老工程师在他肩上按了按：「按吧，让老祖宗看看，他们的灯还亮着。」核心的光一层一层升起来，先是暗红，再是金白，最后整座人造太阳轰然亮透，悬在渊下宫的穹顶，浮岛上的影子一瞬间都换了方向。黑暗里蛰伏的龙嗣兽群被光逼着退向深谷，远征队的哨位往前推了整整三程。守在地面的信使把消息送回海祇岛，码头上的值更人扯着嗓子喊：「地底的太阳，升起来了！」当夜，珊瑚宫破例点起了满宫的灯，说是与地底的光遥遥相认。这不只是能源的突破，更是文明对黑暗的最终胜利。大日御舆重燃，一个超越时代的科技遗产，正落进海祇岛的掌中。"
 SAN_event.113.a:"重燃日轮"

 SAN_event.114.t:"地走官苦练"
 SAN_event.114.desc:"圈内一人立，长枪错落莫敢伤，精锐定江山。白夜国旧制里有一门近乎自虐的选拔，唤作「地走官」。候选者要在完全的黑暗中依凭声息、气流与皮肤上的凉意辨识方位，四面的长枪轮番掷来，圈内之人一立一日，中一枪即出局。我们决意恢复这门选拔。头一期的操练场设在渊下宫深处无光的洞窟，入场的兵卒先在明处站一炷香，把风向听熟了，再蒙眼入场。第一个撑满全日的，是个沉默寡言的水兵，出圈时双腿都在抖，脸上一道擦伤，他只问了一句：「明日还来？」教官答：「来，往后日日来。」三个月后，这一批人在黑暗里行军快过常人在白昼的速度，掷枪应声而避，近身格斗全凭触觉。这支部队将专司深渊侵蚀的清剿与敌后的险难任务。烈火淬过的意志方能主宰战争，百炼之钢，寒光初露。"
 SAN_event.114.a:"地走官齐聚"

 SAN_event.115.t:"龙蜥困栏时"
 SAN_event.115.desc:"龙嗣伏深渊，化学武器现神威，禁区定乾坤。深海龙蜥曾是先祖挥之不去的梦魇，鳞甲坚如礁石，群起时声势骇人。如今我们用科学来终结这桩千古的威胁。药房的学士们熬制专门的神经毒素，掺进龙蜥惯食的深海软藻里，食后兽群神志涣散，不伤命，只减性；另以频率干扰器布设成阵，声波一出，龙蜥便循着假频折返，成群的兽势自此散得开、聚不拢。受控的实验区划在黑曜谷外，界桩以雷纹符纸缠顶，龙蜥近界即回，像有一堵无形的墙。看守区的老兵守了三个月，摸清了兽群换巢的时辰，日志上写：「它们认路，比人还守时。」此前的猎杀之策伤人伤兽，两败俱伤，如今一毒一阵，不折一兵便立起了禁区。渊下宫深处最后一片资源区就此扫平了障碍。自然的臣服，不在杀伐里，在学问之中。"
 SAN_event.115.a:"渊底在握"

 SAN_event.116.t:"常夜灵庙掘古"
 SAN_event.116.desc:"幽冥灵庙中，空间叠影藏玄机，古迹语沉沉。常夜灵庙的考古队清出一面密墙，墙上刻满星轨般的纹路，中段一段铭文写道：「物自行，行而不至，至而不劳。」主持的老学者读罢怔了半晌，说这是相位传送的记录，古人早已试过。逆向工程的图纸随后铺满了三张长案：纹路拓下来一格一格比对，地脉的频率一段一段校验，错了便重来，案上的废纸堆得比人高。首座试验阵立在灵庙与清籁之间，头一回传送的货物是一筐红薯，光门开合一瞬，红薯落地还带着两地的温差，验收的文书官捧着筐看了半晌才签「收讫」二字。此后矿石、粮秣、军械次第过阵，三岛之间瞬时递送不再是空想。有参与的老匠人感慨：「修了一辈子桥，原来古人早把桥修进了虚空的肚子里。」跨越空间的后勤一旦织成，海祇岛的战略机动便直追神灵之境。历史的断章，正在一页页拼出未来的版图。"
 SAN_event.116.a:"译解奥义"

 SAN_event.117.t:"蛇心之地行仪"
 SAN_event.117.desc:"蛇心祭坛前，维度交织现灵光，定力守国疆。蛇心之地是地脉交汇的奇点，祭坛上的古纹盘旋如蛇，据说俯身细听能听见大地的心跳。心海大人亲自到场指导，以祝词试了三处地脉的频率，选定其中最沉静的一处布阵。元素稳定器沿着祭坛的外缘一字排开，阵成之日，随行学士以标准地脉探针向内扫描，扫了三遍，回波皆是空白。年轻的学士失声道：「整个岛，从探针上消失了。」心海大人却敛容道：「不是消失，是藏。藏得住，才守得住。」自那日起，外部的地脉扫描再也照不见这片海域的真貌，诸国探查的船在海图上留下的是一片无风无浪的空白。岛上的日子如常：渔船照旧出海，学塾照旧开课，祭坛前的香火照旧一炉接一炉。整个国家正从神灵的注视下缓缓隐去，在阴影中不动声色地积蓄力量。隐秘，方能伟大。"
 SAN_event.117.a:"地脉安堵"

 SAN_event.118.t:"渊技归炉"
 SAN_event.118.desc:"远古遇现代，齿轮符文共齐鸣，工业冠古今。白夜国的远古符文与踏鞴砂的精密机械，终于合到了一处。工程师们把符文的走线描在图纸上，与齿轮的咬合位一一对应，改了十一稿才定形。第一台集成式渊能引擎下线那日，厂房里挤满了人：引擎启动的刹那，符纹次第亮起，齿轮声与嗡鸣声合在一处，像一曲古老的歌配上了新的鼓点。试机学士盯着功率表看了半晌，只说了一句：「同体积的旧引擎，抵不上它一半。」装上这种引擎的坦克与飞机，能量密度远超同行，跑得远、载得多、打得久。外国的买主闻讯而来，出价一次比一次高，商务署一律回绝，答复写得直白：「此物不卖，只守家。」从此国内的兵工厂都以新引擎为基准，图样的扉页上统一印着五个字：「海祇制造」。一种新的工业标准正在成形，提瓦特的强国之路，被重新定义了一回。"
 SAN_event.118.a:"百工维新"

 SAN_event.119.t:"渊下宫同盟"
 SAN_event.119.desc:"地底工厂林，自动化链转不休，战力定巅峰。在渊下宫广阔的地底空间里，一座完全封闭的工业联合体已经建成。生产线顺着浮岛的地势排开，传送带一段接一段，原料进、整机出，中途不见天日，也不受地表任何轰炸的波及。大日御舆重燃之后，厂区日夜通明，工人们分作三班倒，交接时要在厂门口核对一次灯牌，灯牌不齐不开工。有人起初担心地底做工憋闷，厂里便在工歇的廊道种了苔藓与蕨草，又在墙上绘了海面的画，工人们说歇工时抬头「像是望得见浪」。每一架下线的战机都涂上象征深渊的深蓝色，机腹加喷一道白夜石的荧光线，夜里看去像一尾尾游动的鱼。质量官抽检的记录一页页存档，废次品率月月往下走。渊下宫的产能源源不断，反抗军的武装被推向一个不可思议的高度。铁底之下，雄心万丈，这里的灯火昼夜不熄。"
 SAN_event.119.a:"炉火不熄"

 SAN_event.120.t:"古舰浮出海"
 SAN_event.120.desc:"旧舰复生威，深海猎手出伏击，波涛任我驰。考古队在大日御舆的遗址里，掘出了古代潜水艇的蓝图，图纸上的墨线犹自清晰，连舱室的编号都认得出。我们照图施工，以现代材料加固船壳，第一艘全金属深海潜艇「白夜号」正式下水。下水那日没有仪式，只有一条无声的船沿滑道潜入海中，水面转了个旋，便再无痕迹。首航试出了它的能耐：数千米的深海静默巡航，声呐扫不到，探照灯照不见，艇内的水兵听着壳外的深水声，说那是「海底在呼吸」。随艇的老舵工趴在潜望镜旁看了半晌水面的动静，下来只说了一句：「上面的船，还不知道自己是靶子。」此后数月，幕府的水面舰艇接连在毫无征兆中受损，查不出敌手，海图上只多了一片标红的深水区。水面上的舰船在「白夜号」面前，如待宰的羔羊。深海既握于掌，海洋便成了我们的内湖。"
 SAN_event.120.a:"古舰夜出"

 SAN_event.121.t:"奉时之执政"
 SAN_event.121.desc:"时刻统万物，卡伊洛斯佑民心，信仰志不移。对「时间之执政」的崇拜，经心海大人之手重新确立。新的教义不设繁复的仪轨，只讲一个道理：潮水有信，昼夜有序，凡持守到底的人，时间自会站在他这一边。祭坛前不供牲礼，只立一座漏刻，巫女每日添水一次，说：「刻漏不歇，守望不歇。」这与其说是宗教，不如说是一种对「必然胜利」的信念：粮会尽、械会损，唯有时间磨不灭。心海大人对众宣讲时说得明白：「我们是时刻的守望者。守望的人，不必赶路，只需不走。」战时最艰难的那几个月，前线缺粮缺械，营中却没人溃散，兵卒们说，想起那座不停的水漏，「心里便稳了」。这超越魔神的信仰把国民的心理韧性撑了起来。在时间的洪流里，不走的人已经立于不败之地。信仰新生，从此山河岁月，皆为凭据。"
 SAN_event.121.a:"皈依圣道"

 SAN_event.122.t:"真相播诸岛"
 SAN_event.122.desc:"密卷传诸国，揭穿天理伪秩序，革命火种燃。《日月前事》不再锁进深库。秘密印刷厂设在清籁岛的一处山坳，纸型随刻随印，墨要当日调，纸要当日晾，一夜出小册子千余份。印好的册子夹在鱼干筐底、压在矿石箱缝，顺着商路流向提瓦特各国：枫丹的报馆收到过，须弥的学塾捡到过，连稻妻城下町的柴堆里也翻出过几本。册子写得直白：神灵的权柄并非天经地义，凡人受的苦也不是命该如此。各国查禁的风声一阵紧过一阵，可册子照旧一本本流出去，查抄的人自己也偷偷读。印刷厂的匠人倒不觉得这是多大的事，领班的说：「书又不是我们写的，我们只是把真话誊一遍。」思想的觉醒终将引发一场终极的革命，火种既已撒出，星火自会燎原。海祇岛不求独醒，只愿做照亮黑暗的第一座灯塔。"
 SAN_event.122.a:"播撒星火。"

 SAN_event.123.t:"白夜军制复兴"
 SAN_event.123.desc:"古礼入军营，严明纪律肃杀声，战旗定八方。白夜国「地走官」的编制引入现役军队，晋升的章程随之重订。新法只有两条主线：一凭功勋，二凭专业技能。出身不再算数，贵族与平民的隔阂被撕开了一道口子。首次按新制铨叙，被擢升的三名校官里，一个是矿工出身，靠操典与测绘的本事上位；一个是落魄武士家的遗孤，凭历战之功授衔。落选的旧军官起初不服，闹到军法处，主审官把战功册摊在案上，一句「册上有你几页？」便问得没了声。自此营中风气一变：夜间习字的多了，磨枪的更勤，人人都知道前路要靠本事铺。操练的口令照旧从白夜国古礼里化出，声调沉缓，落在夜里像更鼓。一支拥有古老灵魂与现代装备的军团已然重铸，静候统帅的最终号令。号令未至，剑不出鞘；号令一至，八方皆动。"
 SAN_event.123.a:"纪律森严"

 SAN_event.124.t:"水炮试锋芒"
 SAN_event.124.desc:"激流斩铁甲，海祇之怒震九天，威力破苍穹。借着奥罗巴斯的血枝珊瑚技术，第一门大功率高压水炮研制成功。炮膛内衬取自血枝珊瑚的硬质芯材，海水经三段增压泵送入膛内，出膛时凝成一枚高速水箭，比钢铁更硬，也更沉默。试炮那日，靶场立着一辆退役重坦，炮手拉下击发的把手，没有烟、没有火，只有一声闷响，靶车正面被洞穿，边缘切口平整得像刀切的糕。在场的老炮兵绕着靶车看了三圈，末了叹道：「水能穿石是老话，没想到今日真见了。」军械署随即把水炮列入制式，首批配发岸防要塞与主力舰。操典里写着一条要诀：「蓄水如蓄怒，发射时，把整片海压出去。」这是海洋赋予我们的最纯粹的打击手段，无烟无焰，直来直去。在蔚蓝的怒火面前，再坚固的防线也终将瓦解。"
 SAN_event.124.a:"水力尽出"

 SAN_event.125.t:"渊底耳目"
 SAN_event.125.desc:"探子下幽冥，监控世界缝隙间，敌踪尽掌控。「深渊情报局」在珊瑚宫东厢挂牌，门口不设匾，只有两名卫兵换岗。局的根基在渊下宫：沿着地脉的走向布下一张感应网，提瓦特大地任何细微的震动，都顺着网线传进局里的监听室。监听员们昼夜轮值，从杂音里辨出马蹄的节律、车队碾过石板的分量、乃至大队人马涉渡浅滩的水声。初建的第一个月全是虚惊，一头迁徙的兽群被误判成敌军调动，局里连夜升帐，天明才弄清。此后判读的功夫练了出来：震动一响，来的是人是兽、是商队还是行伍，十有八九辨得分明。敌人的战略移动常常比公文早到，如今却比情报晚到。决策桌上的海图永远比敌人的阵图更新一版，在阴影中注视，在阳光下致胜。情报至上，此言不虚。"
 SAN_event.125.a:"耳目八方"

 SAN_event.126.t:"御舆引长明"
 SAN_event.126.desc:"金线连三岛，恒星能源注生活，国家兴万代。超导材料的光纹缆线从渊下宫一路铺上地表，把大日御舆的无尽能量送进了千家万户。通网那日，望泷村的老阿婆拧亮家里的新灯，盯着那团光看了许久，忽然说：「这灯不晃眼，像我年轻时点过的鱼油灯。」说着说着便红了眼眶，灯下的饭桌照旧，人间烟火照旧，只是从此再不欠谁的煤。换能源的工程做了一年：渔村的冻窖、矿上的卷扬、学塾的暖炉，一处一处接进网里，账簿上旧年的炭钱、灯油钱一笔笔划去。粮价随着燃料的降价也稳了下来，市集上做买卖的都说，如今本钱省下的都是净利。彻底摆脱了煤炭与石油的牵制，外邦禁运的路数从此落了空。能源的自由为工业的大爆发备好了沃土，海祇岛率先迈入后能源时代。地底一颗恒星，海上一国灯火，金线相连，万代不熄。"
 SAN_event.126.a:"能源维新"

 SAN_event.127.t:"渊底安身处"
 SAN_event.127.desc:"堡垒深藏下，任凭地表火冲天，希望永不熄。渊下宫坚硬的岩层深处，一套覆盖全国的避难系统已经建成。避难所顺着旧日的浮岛骨架扩建，每一座都自成天地：空气循环的水道终年流动，水培的菜畦一列列排进廊道，粮库装满了三年的存粮，工坊的机床罩着油布随时可用。承建的工匠在最后一座避难所的门口留了一行刻字：「愿子孙用不上。」话虽如此，演练却从未松懈：全岛轮演一次「入宫」，从号令到安置，人口、牲畜、粮械各归各位，头一回用了四天，练到第三回已缩到两天半。有老人演完叹道：「从前逃难是慌不择路，如今逃难还有名册点名。」这话说得众人笑，笑完又都沉默，都明白这张底牌是为最坏的日子备的。纵使地表被毁到寸草不留，文明的火种也能在这层岩下延续。这是我们对抗天理最坚实的底牌，名曰最后堡垒。"
 SAN_event.127.a:"居安思危。"

 SAN_event.128.t:"归先人故土"
 SAN_event.128.desc:"海民归渊底，狭间新街见笑容，故土重温情。第一批志愿者搬进了地底的新狭间街。街是照着白夜国旧图样重修的：石板路沿水而建，两侧的屋檐挂着炼金光晶，光色调成近于黄昏，走在街上不觉得身在地下。报名的志愿者远超预期，筛选的条件只有一条：手脚勤快、不怕新的日子。裁缝铺、面馆、铁匠炉陆续开张，街口的茶棚傍晚最热闹，坐着的多是从地表迁来的老人，说着「这里夜不黑，心里亮堂」之类的话。孩子们的学塾设在旧祭殿的偏殿，课间就在光晶下踢毽子，笑声顺着石壁荡出去很远。炼金师们仍在不歇地改良光照与植被：葡萄藤在廊道里结了头一串果，尝的人都说甜里有股旧年海风的味道。证明渊下宫是宜居之地的目标已经达成，人口的战略分布让国家的生存韧性厚了一层。地表与地底，两界往来如串门，故土重光，人情重聚。"
 SAN_event.128.a:"迁居故土"

 SAN_event.129.t:"启千年尘卷"
 SAN_event.129.desc:"符号现真意，失传炼金育新篇，智慧冠提瓦特。渊下宫机密室里的最后一批量子档案终于破解。封存芯片的匣子开了一整日，第一王座时期的基因改造技术在众人眼前徐徐展开，在场的科学家看得鸦雀无声，半晌才有人说了句：「这不是术法，是学问。」心海大人定下了使用的边界：只用于强身，不用于害命。第一批生物工程选定两种：一是改良稻麦的耐盐性，让滩涂也能长粮；二是制定国民的体格强化规程，以温和的药剂与锻炼相辅，提升兵员的耐力与脑力潜能。规程试行的头一营人，三个月后负重行军的成绩提了两成，营官在报告里写：「兵还是那些兵，像是换了筋骨。」有学究私下担忧走得太快，主事的学士答：「历史都还回来了，路怎么会走错。」人类的极限正在被一段回归的历史不断打破。进化，自今日始，智慧冠于提瓦特，自今日始。"
 SAN_event.129.a:"得窥真如"

 SAN_event.130.t:"同心盟既成"
 SAN_event.130.desc:"地表与地底，珊瑚白夜共呼吸，意志定永恒。《两界统一宣言》由心海大人签署，自此海祇岛与渊下宫在政治上正式合为一体。宣言的文本只有薄薄一页，却字字有分量：无论是阳光下的珍珠，还是暗影里的遗迹，只服从唯一的现人神巫女。签署用的笔是特制的：笔杆一半是珊瑚、一半是白夜石，蘸墨时两色对半，落纸却成一色。观礼的两界代表各出一名孩童，共同捧着宣言送到书库，说是「路要从小孩子手里传下去」。随后的政务归并做得干脆：两地的税册、军册、学册各自校齐后合成一套，官印统一重铸，旧印封存入库，封条上写着「不是废弃，是完成」。行政的层级由五减三，文书往来的时日缩短一半，基层的官吏们说，如今办一件公事，跑的冤枉路少了。国家凝聚力到了这一步，行政效率自然登顶。两界一音，团结一致，这条从白夜国走来的路，终于走成了坦途。"
 SAN_event.130.a:"同心共铸"

 SAN_event.131.t:"握渊中利柄"
 SAN_event.131.desc:"秘矿冠全球，出口贸易握筹码，经济霸主路。渊下宫出产的龙骨花凝珠与特种元素晶体，在国际市场上绝无仅有。凝珠是龙骨花吸足地脉精华后凝成的珠体，晶体则只在地底深处的高压带生成，两者皆是高端制造业的命门材料。我们确立国家垄断的出口制度：矿口设官仓，出产一律入仓登记，出洋须凭出口凭引，引上注明买主与用途。定价的权柄握在自己手里，各国厂商的订货使团在离岛码头排起了队，价码一年高过一年。曾有一国扬言要抵制海祇货物，公文发出不到半月，他们最大的军械厂便因断料停工，使团又灰头土脸地回来了。商务署的案头从此摆着一句座右铭：「矿石是哑巴，却最有话语权。」高端供应链的缰绳既在手，任何想制裁我们的国家都得先掂量掂量。经济即武器，不落一弹，已定胜负。"
 SAN_event.131.a:"利柄独揽"

 SAN_event.132.t:"深海重甲兵"
 SAN_event.132.desc:"铁甲震渊底，步兵外骨骼现世，勇士力千钧。以海渊特产的抗压合金为骨架，第一代动力外骨骼研制成功。甲架贴着人身的曲线铸就，能源包负在背后，穿上一动，关节处的渊能丝便顺着肌理发力，举手抬足都比原来轻省三分。首测那日，一名中等身材的士兵单手把重型火炮推上了坡，围观的人先是静，随后喝彩声震得试场棚顶的灰都落下来。那士兵下了甲，摸着胳膊愣了半晌，说：「这铁家伙，比我爹那辈人扛的粮包还听话。」极端地形更是它的主场：断崖、碎石、泥沼，穿着它如履平地，操演的教官看着成绩单直摇头，说操典要重写了。配发的章程随之定下：突击师人手一套，辐重兵半数装备。凡人的躯体，正因科技而获得神一般的力量。钢铁洪流自此有了腿脚，陆战的游戏规则，改写的日子到了。"
 SAN_event.132.a:"机关入微"

 SAN_event.133.t:"白夜义行世"
 SAN_event.133.desc:"战法出古卷，奇兵诡道算无遗，胜负早先定。心海大人把白夜国「狭间控制」的古卷摊在案上，一页一页翻给参谋们看，逐句译成现代的步炮协同教义。古卷的要义只有一句：狭地藏兵，断敌为段，一段一歼。教义据此写定：凡遇优势之敌，先用炮火把战场切成数段，再以步队各围一段，令其首尾不能相顾。参谋部另设算学班，会战之前先按地形、兵力、弹药逐项建模，一场会战被拆成一个个必胜的算题。首次按新法演练，假想敌是一个满编旅，演练结果：分割用时两个时辰，全歼用时一日半，伤亡较旧法减了六成。观演的老将看完沙盘，只说了四个字：「胜负先定。」心海大人在教义的扉页题了一句话：「算学不欺人，欺人的从来是侥幸。」理性的光芒照进军帐，军队便一个台阶一个台阶往上走。这便是战争的艺术：谋定于帷幄，取胜于未战。"
 SAN_event.133.a:"算无遗策。"

 SAN_event.134.t:"渊下帅帐"
 SAN_event.134.desc:"司令驻深渊，全局调度无盲区，军令定乾坤。跨维度战场日趋复杂，海陆空各自为令的旧制到了尽头，「渊下最高司令部」应运而生。司令部设在大日御舆光柱之侧，厅内一面全息沙盘悬在半空，三岛与渊下宫的山川要塞纤毫毕现，随战报实时变动。地脉通信站昼夜不息，海、陆、空、潜、渊五大军种的情报汇进同一间机房，指挥官抬眼看一次沙盘，五军的动静便都在目。首任总长立下铁规：「令出必达，复命必实，误一次记一过，谎报者军法从事。」头一次五军联演，前线小队与司令部隔着一重维度通话，声音清得像对面说话，报务员下了班还念叨：「隔着天和海，说话竟像隔一张桌。」调度自此再无盲区，哪一军打到哪里、哪一船卸在哪一港，沙盘上一点便知。这种指挥能力把战争拉进了一个新的维度。运筹帷幄之中，决胜千里之外，古人诚不我欺。"
 SAN_event.134.a:"总揽全局。"

 SAN_event.135.t:"古法今用"
 SAN_event.135.desc:"阵型变幻疾，小组协作现威力，单兵亦英雄。先民对抗龙蜥的旧档里藏着学问：兽群散而快，人的大阵散不动，便被一口口吃掉。先民的解法是把队伍拆小，小队散而更快。我们据此提炼出高效的小组作战标准：每队五人，各有专责，遇袭即散，散而不乱，各自为战又能相互策应。去中心化的指挥随之推行：分队收不到总号令时，依操典既定预案自主行动，不必等、不必问。演练里最险的一课是「断联」：小组被切断联络十二个时辰，队员们按预案穿插合围，天亮时竟把假想敌的指挥所端了。复盘会上，那个五人小组的组长挠着头说：「没人下令，可人人都知道该做甚么。」教官在评语里写了一句：「这便是最好的指挥。」坚韧与灵活合在一处，敌人面对的不再是阵，而是无处不在的刀。白夜精神不灭，战术常新，单兵亦英雄。"
 SAN_event.135.a:"精益求精。"

 SAN_event.136.t:"藏兵于渊底"
 SAN_event.136.desc:"全民皆英豪，地底训练育勇士，战备永不停。渊下宫的移民一律要受三个月的地走官基础训练，这条规矩写进了入籍的章程。训练排在工歇之后：白日做工，夜里习武，黑暗中辨路、结阵、拆装枪械，课业一项一项考，考不过便加练。起初有人叫苦，缝纫铺的女掌柜却考了个头名，她笑道：「夜里纳鞋底练出的手感，跟摸枪膛是一个理。」三个月下来，新街上的住户个个都懂哨语、都能背操典，茶棚里闲话的话题从菜价聊到了队形。邻里之间按街巷编组，每组自推组长，夜里巡一遍水道与廊桥，灯笼都不用点，凭脚步声便知来的是谁。渊下宫不再只是工业中心，它成了一座随时能喷发出千万战士的大兵营。国家的力量说到底源于每个国民，国民个个枕戈待旦，这国家便睡不安稳不了谁。战备永不停，希望便永不熄。"
 SAN_event.136.a:"举民备战"

 SAN_event.137.t:"粮道贯上下"
 SAN_event.137.desc:"升降机隆隆，地表深渊共流转，后勤无断绝。一套庞大的垂直重载运输系统贯穿海床，上口在珊瑚宫后山的货运场，下口直抵大日御舆的工业联合体。主井四条，升降台车一层载粮、一层载械、一层载人，井壁嵌着渊能导轨，下行的台车顺带发电，供井口的照明与信号。通运之前，地底物资绕海运抵岸，风浪一来便要误期数日；如今物资跨维度的流转从数天缩到数小时，粮车在珊瑚宫卸货时，车厢还带着地底的凉气。井口的调度室里挂着一块木牌，写着发运的口诀：「急件先行，重件并吊，活人让货，货让灯油。」老调度员守了三十年码头，改行看井时感慨：「看了一辈子潮汐，如今看的是井口的灯。」全方位封锁的假想演练做过三次，地表口岸全数封锁，岛上照旧运转如常，物价纹丝未动。补给是国家的血液，如今这血液奔流不息，两界之间，再无断绝。"
 SAN_event.137.a:"粮道畅通"

 SAN_event.138.t:"白夜文脉重光"
 SAN_event.138.desc:"服饰复古韵，节祭歌舞映古今，自豪满心田。白夜国的节庆与服饰，依着旧档一桩桩恢复了。服制照旧图重裁：男子宽袍束带，女子素衣缀银纹，孩童一律白帽，帽檐上绣一小枚日轮。裁缝铺的活计排到了三个月后，老裁缝一边打版一边感叹：「照着千年前的图样裁衣，手底下像有老祖宗看着。」节庆恢复的头一场是「常夜祭」，是夜渊下宫万灯齐明，人潮沿着旧街一路歌舞，歌谣照旧谱传唱，只是新添了一段词，唱的是重燃的人造太阳。白发的遗民后裔领着全家走完了全程，走到旧祭殿前跪了下去，起身时说：「祖上没白熬，日子到底等来了。」从此海祇民记起了自己「第一王座孑遗」的尊贵身份，腰杆挺得笔直。民族的自豪感化作国家的意志，散在每一件素衣、每一盏灯里。我们是提瓦特真理的继承者，文化的力量，无懈可击。复兴的盛世，不在诏书上，在歌声里。"
 SAN_event.138.a:"重拾自尊"

 SAN_event.139.t:"两界合流时"
 SAN_event.139.desc:"旗帜映白夜，珍珠白月共辉映，国家定万年。重燃的大日御舆之前，心海大人当众宣布：海祇岛与渊下宫的意志，自此完全合流。她的话不长：「我们是一个文明，一个民族，一个不可分割的整体。地上的人认海上的潮，地下的人认不落的日，认的是同一面旗。」旗是特制的：蓝底上一轮银日，日心缀一粒珍珠，远看是海托着日，近看日里藏着珠。宣示的仪式上，地表的代表与地底的代表各擎旗角，一齐把它升上旗杆，升到顶时，地底的光与海面的月恰好同时照在旗上。观礼的人群里有个孩子问母亲：「旗为甚么不怕暗？」母亲答：「因为日头就在旗心里。」两界归一，从灵魂深处统一起来，外部的离间从此成了徒劳。会后，心海大人在日志里只写了一行：「路还长，可脚下是一条心了。」我们正站在历史的顶端，大哉海祇，万年可期。"
 SAN_event.139.a:"万众一心。"

 SAN_event.140.t:"考古集大成"
 SAN_event.140.desc:"知识汇成海，引领国家向高天，智慧冠寰宇。历年的解密、考古与技术成果，汇成了一套完整的《白夜百科全书》。全书装订二十四卷，从符文的读音排起，到相位传送的阵图收尾，编书的学士们整整编了三年，定稿那日集体病倒了三分之一。主编在序里写道：「这不是过去的记录，是通向未来的操作手册。」与全书同日宣布的，还有白夜大学的章程。校址定在渊下宫旧学宫的基址上，讲堂朝北，对着大日御舆的光柱，授课的白日里满室生辉。招生章程第一条写道：「不分两界，不分贵贱，凡能读书者皆可应试。」头一期入学的三百人里，有矿工、渔家子、缝纫铺的学徒，也有地底世代守灯的老户之后。失落的珍珠重新串成了线，牵动国家向全面现代化奔去。历史是阶梯，一级一级，指向无限。"
 SAN_event.140.a:"开辟新程"

 # ========================== 第五阶段：战后构想 (141-180) ==========================
 SAN_event.141.t:"时局岔路口"
 SAN_event.141.desc:"幕府已成梦，未来稻妻何处去，辩论定乾坤。内战的硝烟散尽，战后稻妻该往何处去，成了摆在所有人面前的题目。心海大人在珊瑚宫开了为期一周的「未来研讨会」，门是开着的：巫女与渔夫同席，军官与商贾同座，地底来的代表带来了狭间街工人的联名书。会上三条路争得面红耳赤：一派要立绝对神权，说乱世人心，先求一个稳字；一派要开民主共和，说民心即天下，强国之基在民强；还有一派放言终极革命，说要问一问高天之上的秩序。争论最凶的一夜，谁也没提「退场」两个字，茶续了七轮，说到天亮。心海大人始终坐在末位听着，只在最后说了一句：「诸位的道理我都记下了，命运就在这些话、这些票与这些刀锋上。」研讨会散后，街头的茶肆里、码头的缆桩边，人人都在争论那三条路。一个国家的去向，从没有被这样郑重地掂量过。幕府已成旧梦，新的稻妻，正从这场大辩论里破土。"
 SAN_event.141.a:"抉择之时。"

 # --- 路线A：现人神绝对权威 (142-154) ---
 SAN_event.142.t:"现人神独尊"
 SAN_event.142.desc:"神谕定乾坤，珊瑚宫内现圣芒，众生皆俯首。战后秩序飘摇，诸岛长老与军中将领联署了一道陈情：请心海大人兼领绝对的世俗与宗教之权。陈情书递上去那日，她在殿内独坐了半晌，出来时只说了一句：「既然万民要一个不变的依靠，我便做这个依靠。」自此政令即是神谕，颁布的文书一律素帛金字，张贴时鸣钟三响，围观的人先肃立、再诵读。质疑的言语没有了存身之处，官署的告示栏边立了一块碑，刻着四个字：「敬政如神」。集权的章程却立得极严：神谕的草拟、核验、颁行各设专人，一层一层签名画押，以防有人假传。头一年颁下的神谕共四十一道，关于粮价的有九道，关于抚恤的八道，乡下的老人说：「神谕管米缸，比管天还上心。」千年的绝对稳定自此立起了根基。秩序高于一切，而秩序的中心，是那个每天仍要核账到深夜的人。"
 SAN_event.142.a:"神威永镇"

 SAN_event.143.t:"奉大蛇正统"
 SAN_event.143.desc:"大蛇尊位起，鸣神残留尽清洗，信仰归一宗。大蛇远吕羽氏尊正式尊为稻妻唯一的真神，诏书颁行诸岛。鸣神大社改作海祇分社，旧日的神像移入库房，不得毁弃，只加封存，主持迁移的老吏特意嘱咐：「抬的时候垫稳些，它们也侍奉过人。」分社的匾换成了新字，社后的老樱树没有动，春来照旧开花。各地社务依次归并：祝词统一重修，旧本里的鸣神名讳一律改为远吕羽氏尊，改动处加注存档，说是「让人知道字从哪里改到哪里」。思想上的清洗做得细而冷：流传的旧画、旧戏、旧签文逐一登记，可改则改，可封则封，牵扯的人不问罪，只受一场「归一」的训导。有旧巫女不肯改口，被安置去社里照管樱树，她说：「树不说话，我陪它。」一个声音、一个信仰，整个民族自此拧成一股绳，化作一柄不可摧毁的战锤。锤柄是信，锤头是力，信仰的铁拳已经握紧。"
 SAN_event.143.a:"肃清异端"

 SAN_event.144.t:"神职理庶务"
 SAN_event.144.desc:"官位即祭司，行政职能带圣威，服从是美德。一套全新的行政体系立了起来：官署的职位一律由受过神学考核的巫女或祭司出任。考核分三场：经义一场，钱谷刑名一场，问对一场，三场皆过方可授职，缺一场便回炉再读。头一榜放出来的官员多是年轻巫女，上任第一课是「对账」，主考官说：「神明面前，账目就是良心。」体制内的磨损从此少了许多：政令自宫中颁出，各级依序而行，推诿的空当几乎不存在，因为推诿在神明眼里即是欺瞒。每一道政令都带着不可违抗的神圣性，张贴处设香案，吏员读毕，围观者随之复诵一遍，一字一句，清清楚楚。有客商私下问官差：「这般做法，不怕僵么？」官差答：「香是活的，火不许它灭。」民众对政策的执行力今非昔比，海祇岛正在变成一座秩序井然的宗教城邦。服从成了美德，美德成了规矩，规矩之上一盏长明灯。"
 SAN_event.144.a:"权归一处"

 SAN_event.145.t:"一业擎国"
 SAN_event.145.desc:"熔炉归神领，所有资源注军工，威慑震四方。全国的自由竞争就此取消，各家商号、工坊一律并入国家军工复合体。归并的章程做得彻底：账册交官，厂主受聘为管事，工钱照发，只是生产计划改由宫中统一排定。在现人神的指导下，效率推向了极限：踏鞴砂的炉火不再按季歇火，鹤观的铬矿直供本国的炮厂，清籁的电力随调随取。厂规里印着一行字：「每一颗铆钉都有去处。」头一年的产能报表让所有人吃惊：炮管产量翻番，新船下水十二艘，兵工的检验批从月检改成了周检。有旧日的商家东家看着自家招牌摘下，半天没说话，末了只问一句：「炉子还点着？」得到的答复是：「点着，比从前更旺。」极端的资源集中换来了军力的爆炸式增长。战争机器已经全速运转，永不熄火，四方诸国，闻声自危。"
 SAN_event.145.a:"统制百工"

 SAN_event.146.t:"圣训铸忠魂"
 SAN_event.146.desc:"战死为荣光，灵魂归于大御神，勇士无所惧。军队里的忠诚教育推行到了极致。操典之外的晨课上，随军巫女只讲一个道理：为现人神大人战死，是通往彼岸的唯一捷径，刀上的血是自己的渡船。这套道理起初讲得生硬，后来随军的老兵拿亲身经历补足：负伤归来的人被请上讲台，说昏迷那一瞬「听见的是祝词，不是哭声」。自那以后，营中风气一变：冲锋的号声一响，队伍不再寻隐蔽，径直向前，旗手倒下，后一人接旗，步子不停。对手的军官在战报里写：「对面的兵不躲炮火，队形散了也不溃，像潮水，退了还会再来。」常规的战术在这样一支宗教十字军面前显得软弱无力。有新兵问伍长怕不怕死，伍长把刀往肩上一扛：「怕，可船就在刀上，怕它做甚么。」我们是神灵的惩戒之剑，出鞘即直，死战不退。"
 SAN_event.146.a:"铸就忠魂。"

 SAN_event.147.t:"不信者黄昏"
 SAN_event.147.desc:"阴影藏罪恶，圣卫突击净灵魂，国家保纯洁。为确保国家意志的绝对统一，秘密警察「圣卫队」开进了占领区。队员着便装，登记的名目只有一个：宣誓。愿宣誓效忠的，录名册、发凭牌，照旧营生；拒绝的，先抄册，再训导，训导三次仍不改口的，连夜带走，去向不载于公文。占领区的茶肆酒馆从此安静下来，人们说话时先看一眼门口，把要紧的词咽回去。圣卫队的内部章程倒写得细：拿人须两人在场，抄没须开单据，成员亲属同罪，无一人可徇私。有队员夜里问上官：「我们做的是恶事么？」上官答：「恶事总要有人做，做好了，恶名归我们，安稳归众人。」恐惧是暂时的，长远的稳定终将证明这些牺牲的价值。国家先于个人，信仰重于生命，纯洁运动的刀锋，从不回首。"
 SAN_event.147.a:"清除内蠹"

 SAN_event.148.t:"神田五年计"
 SAN_event.148.desc:"计算定产出，每一米粮皆归公，国家保温饱。战后第一份经济总表由心海大人亲笔签署，自由市场随之废除，全国改行指令性计划。总表厚得像一部书：多少亩田种稻、多少炉炼铁、多少船跑哪条线，一格一格填满，尾页落着珊瑚宫算学房的印。每份资源的分配都要经过精密计算，算学房里的年轻人们拨算盘、列表格，案头的算稿摞起来半人高。头一年只许种稻的村明年分到了桑苗，只许织布的坊后年改了织帆，多样性是牺牲了，匮乏也一并绝了迹。粮站按人头配给，册上画着红线，超出的份额一律归公，老人说：「从前丰年囤粮荒年哭，如今荒年也吃得饱。」有商贩想私下倒腾余粮，被按律罚了，罚金充入义仓，义仓的门三个月没关过。短短数年，国家的全面现代化就搭起了骨架。效率至上，计划即正义，账算得清，国便立得稳。"
 SAN_event.148.a:"财赋归公"

 SAN_event.149.t:"渊底先知"
 SAN_event.149.desc:"水晶窥未来，巫女预言乱敌心，先机永掌握。地脉的残留回响里藏着未来的影子，我们据此组建了一支「先知部队」。成员皆选自感应敏锐的巫女，入队先受半年静坐课，练到能在水晶前坐两个时辰不动、心无杂念，方许接触正式的占算。她们的预判不走文书，直接以意识传讯告知前线指挥官：何处有伏兵、敌军几时换防、粮道走哪条路，说得有鼻子有眼。头一回实战验证，先知报「敌三日后袭粮道」，前线将信将疑地设了伏，第三日敌军果然循路而来，一头撞进口袋。此后「先知在上」四个字成了军中的口头禅，指挥官排兵布阵，必先问一句「水晶怎么说」。外交场上的用场更大：谈判前先知先递一份「对方底线」的单子，使团的茶还没凉，胜局已定了七八分。这种带着神秘色彩的技术，让我们的每一步都走在对手前面。在神谕的指引下，胜利是必然，先机永远在手。"
 SAN_event.149.a:"胜果可期"

 SAN_event.150.t:"诏令出宸衷"
 SAN_event.150.desc:"金石刻法典，现人神权定万年，法律佑神位。决定国家长治久安的根本大法，镌成了一部金石法典。法典以青石刻就，铭文鎏金，立在珊瑚宫前的广场上，凡识字者皆可就近诵读，不识字的有专门的诵法吏逐条讲解。第一条便写得明白：现人神巫女对诸岛、资源乃至生命拥有绝对处置之权，此权受法律永久护持。起草的学士们在定稿前争了一个月，争的不是权该不该有，而是「绝对」二字要不要写实，最后按心海大人的意思落了笔：「写实，免得后人各自解读。」法典同时立了两条护栏：神权之下设监察，监察直呈巫女本人；法典的增修须巫女亲笔，代笔无效。颁典那日，广场上的人从早站到晚，有老渔民摸着石面感叹：「从前规矩在人嘴里，如今规矩在石头上。」一套基于信仰的永恒秩序就此立起，法正，则国纲自举。海祇岛将在神灵的注视下，步入千年盛世。"
 SAN_event.150.a:"律令定鼎"

 SAN_event.151.t:"神威扩四海"
 SAN_event.151.desc:"版图无边际，蓝色海洋皆圣土，进军向远方。扩张二字，自此写进了国家的基因。诏书说得直白：海祇大御神的信仰不应囿于三岛，蓝潮所至，皆当闻法。远征军团整装待发，码头上旌旗连成一片，兵员的名册一页页翻过去，新兵的名字墨迹未干。出征前的心气是足的：粮船压舱，械库见底，随军的巫女把祝词抄了千份，一份船上贴一份，说是「海替我们看着路」。以「解放」的名义去取生存空间与战略红利，这话在军中无人讳言，操典上白纸黑字：「先礼后兵，礼不过三日。」有老水手摸着新刷的船舷感叹：「从前打鱼看潮汛，如今出兵看国势。」海洋之子的征途，是星辰大海，为了荣光，扩张！号角一声接一声，船队离港时，岸上没有哭声，只有齐刷刷的军礼。"
 SAN_event.151.a:"圣战开启。"

 SAN_event.152.t:"海祇之主"
 SAN_event.152.desc:"万国皆称臣，东方霸权我独尊，威严盖古今。海祇岛正式确立对全稻妻及周边海域的绝对主权。昭告的文书发往诸国，措辞极简：「航路属我，贡道属我，神谕自珊瑚宫出。」邻邦的使节一个接一个渡海而来，贡船的货单年年加厚：矿石、香料、工艺品，连别国引以为傲的织锦也排在贡单末尾。我们不只是军事上的强者，更是精神上的主宰，各国新君即位，头一件事便是遣使赴珊瑚宫请领神谕。请神谕的仪注定得细：使节入殿行三揖礼，巫女代传，一字不得增删，回去后照本宣读，不得私注。国民走到提瓦特任何一处，报出「海祇」二字，得到的都是让路与侧目，码头上甚至有商贩学着说半句海祇话招客。有老商人出入诸港半生，回来感慨：「从前出海看人脸色，如今出海，人是看我们的旗色。」至高无上的尊严由此而来，主宰一切，威盖古今。"
 SAN_event.152.a:"雄峙东方"

 SAN_event.153.t:"海祇神国"
 SAN_event.153.desc:"皇冠戴顶端，帝国初升照万里，威名震环宇。登基大典在珊瑚宫举行，万民的欢呼声隔着海面都听得见。心海大人自此称帝，「海祇神圣帝国」的第一任女皇。冠冕是照旧制重制的：银胎鎏金，缀珍珠九粒，取「蛇衔珠」的古意，戴冠时礼官唱名，一声一声，在殿里荡出回音。古老的贵族等级与宫廷礼仪一并恢复：爵分五等，服分五色，朝会时按位次立定，一步不错。金字塔式的社会由此立起塔基：塔尖是女皇，塔身是爵位与官署，塔底是万民，每一层都踩得实。有旧学究私下议论：「等级重了，会不会压死人？」另一位答：「压住的是乱，托起的是塔。」等级即秩序，服从即文明，这套道理写进了新编的蒙学课本第一页。帝国的太阳升起来了，照着万里海疆，永不落下。"
 SAN_event.153.a:"陛下万岁！"

 SAN_event.154.t:"神权极盛时"
 SAN_event.154.desc:"神人合为一，千年基业从此定，海祇佑万灵。所有的准备，终于汇成了一个完美的整体。教育归社学，工业归官署，摇篮边有育婴的义仓，坟茔前有抚恤的恤金，从生到死，国家的每一寸脉搏都随现人神的意志律动。新生儿的名字登记进官册那日，父母领到一枚小小的蛇纹银牌，牌背面刻着一行字：「国有汝，汝有国。」学堂的晨课第一句念的是祝词，工坊的开炉礼敬的是大御神，连码头的号子都编进了颂圣的调子。官署的考绩与神课并算，两样都优的方能升迁，吏员们私下说：「账要干净，心也要干净。」海祇岛至此成了一个神圣意志的化身，整装待发，只等领袖的指引。前方的路要写一部大书，书页是血色与荣光交织的，笔握在强者手里。神佑海祇，千年基业，自此定鼎。"
 SAN_event.154.a:"为永恒之荣光！"

 # --- 路线B：海祇民主议会 (155-168) ---
 SAN_event.155.t:"民智晓色开"
 SAN_event.155.desc:"权力归民手，万岛一心建共和，自由满山河。心海大人主动宣布交出大部分行政权力，退居精神领袖，诏文只有寥寥数行，最后一行是：「此后大事，问于万民。」诸岛联合议会随之成立，各岛按人口选派代表，渔村与商埠一视同仁，鹤观的矿工与离岛的船东同厅议事。议场设在珊瑚宫大厅，厅内不设上座，代表的席位围成环形，发言时持牌起立，牌色分岛，谁说了甚么，一眼可辨。首场议事议的是渡船的班次，为着多一班还是少一班争了两日，最后按各岛票数定了章程，散会时争得最凶的两代表同乘一船回去，一路还在算账。投票的日子定在潮汛最稳的那天，渔家把船泊了，摇着小舢板去投，票箱设在祠堂与神社，老人由儿孙背着去，一票一票投得郑重。选票清点那夜，珊瑚宫的灯亮到天明，唱票的声音一句一句传到宫外，围观的人越聚越多。每一个岛民的声音，无论身份高低，都在大厅里回响了。民主是我们的未来，自由万岁，山河从此换了颜色。"
 SAN_event.155.a:"民权初开"

 SAN_event.156.t:"诸岛议政堂"
 SAN_event.156.desc:"辩论定国策，多岛一心议蓝图，公正见阳光。各岛的普选紧锣密鼓地铺开。从鸣神岛的商户到鹤观岛的矿工，人人领到了选民的名帖，投票站设到村口，搪瓷票箱擦得锃亮。竞选的演说在茶肆、码头、晒谷场轮番开讲：商户谈税制，矿工谈工时，渔家谈轮捕，各说各理，台下有人喝彩，也有人摇头，摇完头还是把票投得认真。议会的章程写得明白：内部利益的冲突，以协商解决，不以对抗解决。头一次实质性的协商是三岛的电价之争，各方代表磨了七日，最后议定矿业让利一分，居民让利半分，差额由出口税补齐，三方签字时都嫌让得多了些，签完倒都松了口气。议事录公开张贴，谁赞成、谁反对、为何而改口，白纸黑字，一望可知。有老儒看罢感叹：「从前的公堂靠惊堂木，如今的公堂靠讲道理。」建立在共识上的体制最是稳固，民意所向，即是胜果。民主这门功课，海祇岛学得极认真。"
 SAN_event.156.a:"议会初开"

 SAN_event.157.t:"社奉行参政"
 SAN_event.157.desc:"传统遇现代，神里家族助新政，文化守古根。议会一纸请函送至神里府邸：请神里绫人出任终身首席顾问。请函的措辞极恭敬，末了一句写道：「新屋要立，先问旧梁。」绫人应允赴任那日，穿着依旧齐整，进门先向议长的席位一揖，议长忙起身还礼，满厅的人都看在眼里。他的顾问席设在厅侧，不投票，只说话，说得不紧不慢，句句有出处：哪条章程与旧礼相冲，哪个职位旧家可以安放，哪处火候不到须再等等。社奉行在文化与艺术上的号召力派上了用场：旧武士阶层原本对共和满腹抵触，一场雅集、一席茶话，抵触便化了大半。有老武士在雅集后叹道：「刀入了鞘，理进了厅，倒也不坏。」新法推行时，社奉行出面示范：茶道的次序、祭礼的位次、婚丧的仪轨，一一纳入新章程的附录， 传统照旧，只是添了新注。新老权力的良性互动，给共和体制注入了优雅与深厚。和谐共治，不是没话可争，是争完了仍肯同席。"
 SAN_event.157.a:"旧谊为凭"

 SAN_event.158.t:"离岛开商埠"
 SAN_event.158.desc:"商旅连诸国，零关税下兴百业，财富满金仓。离岛被彻底打造为国际自由港：进出口的壁垒一律取消，码头上的税卡改成了问询处，问的话只剩一句「船从哪里来」。告示贴出去的头三日，泊位便满了：璃月的商船运来琉璃与茶叶，至冬的货轮卸下机械与皮毛，连须弥的香料船也试着靠了一回港。仓库不够用，商人们合股新建了三座货栈；钱庄排队兑换外币，柜上新添了两名算手还不够使。零关税之下，物价先落了一截，市面的鱼、布、铁器都比往年便宜，寻常人家的日子肉眼可见地宽裕起来。中产的人家多起来了：有运货起家的，有开铺立号的，孩子送进学塾，讲究些的还请了外文教师。有老船东看着满港的桅杆感慨：「从前离岛是过路的地方，如今是落脚的地方。」繁荣的商业网络织成了，民主体制最坚实的经济保护伞也随之撑开。财富属于勤劳的每一个人，贸易兴国，此言不虚。"
 SAN_event.158.a:"商途日广"

 SAN_event.159.t:"信仰自由诏"
 SAN_event.159.desc:"信仰归个人，大蛇鸣神共和解，灵台自清宁。政府正式宣布政教分离，保障每个公民选择信仰的权利。公告就贴在昔日的告示墙上，措辞只有两句：「敬神是人各人的事，法律面前一律平等。」鸣神大社与大蛇诸社同时恢复了旧名旧仪，社里社外再无人逼问「你信哪一位」。和解做得极有分寸：昔日被改的祝词各自抄回，被挪的神像各自请回，迁移时两边社役互相帮着抬，抬到山门口还拱手道别。祭日的排期由两社自行商定，撞了日子便错开三日，谁也不占谁的香火。清籁岛的老渔母两边都拜，她说：「大蛇管海，鸣神管雷，出海的人谁都不得罪。」这话从前不敢明说，如今说出来了，还引得旁人点头。千年积累的宗教仇恨，被一纸公告与一双双抬神像的手慢慢化开。和平建立在尊重之上，灵台既清，天下自宁。信仰自主四个字，从此写进了宪章。"
 SAN_event.159.a:"彼此修好"

 SAN_event.160.t:"通商活百业"
 SAN_event.160.desc:"竞争促动力，私人工坊现奇机，效率超往昔。僵化的战时工厂陆续私有化，招卖的告示贴在码头与市集，底价写得明白，交款的日子写得明白。头一批拍卖的是三座织坊、一座砖窑，中标的多是厂里干了十几年的老管事，交割那天，老管事摸着用了半辈子的机器，眼眶都热了。个人创业的热情被点着了：街面上新招牌一块接一块，制伞的、造舢板的、酿酱的，各有各的门道。技术创新也有了着落，议会立了专利的章程，新法子报官备案，他人仿制须付使用钱。头一件备案的是一种防盐蚀的船钉，发明人是位铁匠，领了执照那日，把裱好的执照挂在铺子正中，说是比祖传的匾还体面。市场竞争一来，民生工业的品种肉眼可见地多了：从前一色的粗布有了十几种织法，从前一味的酱菜出了甜咸两大派。每一个岛民都能凭自己的本事挣出一份光景。市场是文明最好的加速器，经济繁荣的门，就这么推开了。"
 SAN_event.160.a:"百业俱兴"

 SAN_event.161.t:"望泷村老议"
 SAN_event.161.desc:"古训育新政，基层自治稳基石，民主生本土。各村落的传统长老会，被整合进国家的地方咨询委员会。章程写得妥帖：长老会照旧开，茶照旧喝，只是议定的事项要录入簿册，簿册月月底送县署备案，县署不得驳，只可问。村里的大事小情照旧由长老们商量着办：修桥、分水、济困，自古的规矩一样没丢，只是多了一道「公示三日」的手续，识字的念给不识字的听。咨询委员每季赴珊瑚宫述职一次，渔村的老长老头一回进宫，紧张得帽子都拿反了，回来却逢人便讲：「上头真听咱们的话，渡口那桩事，茶还没凉就批了。」由下而上的民主就这样试了起来：政策先问过乡土，落地时便少了许多磕绊。有学官下乡考察，看了簿册感叹：「民主不是外来的嫁接，是从自家的土里长出来的苗。」每个人都能参与家乡的事务，国家便有了根。基层民主四个字，落在了每一本长老会的簿子上。"
 SAN_event.161.a:"民心可恃"

 SAN_event.162.t:"公民结社勇"
 SAN_event.162.desc:"义务卫自由，每个人皆是哨兵，国疆固若磐。国民警卫队依志愿制度建立起来，退伍军人与热血青年闻讯而至，报名的名册三日厚了一倍。编成的规矩朴素：以村巷为单位，一班十人，班长由众人推举，操练排在农闲与工歇，枪械统一保管，钥匙两人共执。操练的教官多是退伍老兵，教得极认真，也极实在，第一课讲的是「认路」：把本村周遭的地形画出图来，谁家井在哪、哪段堤能走人，都标清楚。老兵说：「守土不是喊口号，是闭着眼也知道自家的门槛在哪儿。」这支部队不只是军事单位，更是公民精神的摇篮：巡夜时搭把手救过火，汛期时并肩扛过沙袋，队旗挂在祠堂里，红布包着，逢节请出来晒一晒。邻国来使问起这套制度，得到的回答只有一句：「人人是哨兵，故国无人可欺。」武装的自由民，是暴政的克星。保卫共和的门闩，就攥在这千万只自己人的手里。"
 SAN_event.162.a:"守护自由。"

 SAN_event.163.t:"泽及万民令"
 SAN_event.163.desc:"弱者有所依，医疗教育广覆盖，国富济黎民。战后的和平红利没有堆进库房，而是花在了两件事上：免费的义务教育，与人人可及的基础医疗。学塾的门槛一律拆了：书本、纸笔、午间的一餐饭，全由公中开支，报名的手续简化到只问一个名字。上课教的除经史算学外，还添了一门「问难」课：先生出题，学生可以驳，驳得有理便加分。有学官看了课堂记录感叹：「敢驳先生的孩子，往后是敢驳强权的大人。」医疗站设到村一级，医士是统一培训的，药箱按册配发，看诊只挂号名，不收分文。望泷村的老渔妇治好了拖了十年的腿疾，逢人便说：「从前病了是熬，如今病了是治。」消除贫困与愚昧，是长治久安的终极保障；培养一代有独立人格的新国民，是送给未来的礼物。共和的温暖普照万家，民生至上，这四个字挂在了每一所学塾与医站的门口。"
 SAN_event.163.a:"泽被孤寡"

 SAN_event.164.t:"使节通七国"
 SAN_event.164.desc:"伙伴遍四海，平等外交连万邦，文明共蓝天。正式的平等外交，先从三封国书开始。国书分别送往蒙德的西风骑士团、璃月的七星与须弥的教令院，措辞一律平视：「愿以文明相交，以贸易相济，不称臣，不纳贡。」使团的出访排得满当：骑士团回访的那日，码头列队相迎，骑士的马蹄踏过新铺的石道，围观的孩童追着跑了半条街。文化交流随即铺开：璃月的书画在离岛办了展，须弥的学者来珊瑚宫讲学，海祇的祝词歌谱也送去蒙德的酒馆传唱。技术上的往来更是实在：璃月的工法、须弥的算学、骑士团的练兵操典，各取所长，抄译成册。贸易的促进者与和平的维护者，这两个身份渐渐被诸邦承认，海图上的航线一段段续到了外海。有使节归国前在留册上题了一句：「此邦虽小，其气甚宽。」一个开放的国家，必将赢得未来的尊重，外交的大门，就这样敞开了。"
 SAN_event.164.a:"放眼万国"

 SAN_event.165.t:"珊瑚宫宪章"
 SAN_event.165.desc:"权柄入笼中，法律至上定乾坤，公义永长存。宪章的定稿在议会上宣读了一整日，读一条，议一条，午间的饭都端进厅里吃。宪章写定了三件事：领袖权力的边界、公民的基本权利、司法的绝对独立。最费笔墨的是第一条：权力的边界一条条列明，越界之令，官吏可拒，拒者受护，逼者问罪。心海大人当场第一个签了名，签罢说了一句：「把权柄锁进笼子，笼子的钥匙交给全体国民。」司法的独立落到了实处：法官终身任职，判案不受官署干预，衙门口的旧匾换成了新字，四个字，「只认法理」。头一桩试出成色的案子，是位贵族与平民的田产之争，判词当众宣读，贵族输了，服判，没有人说情，也没有人敢说情。围观的老人说：「从前仰官帽，如今看判词。」这部宪章将照亮海祇岛长远的发展，权力的运行始终在人民的监督之下。法治是文明最后的堡垒，堡垒既固，公义长存。"
 SAN_event.165.a:"法度长存"

 SAN_event.166.t:"百工跃新阶"
 SAN_event.166.desc:"智略引生产，高端制造冠提瓦特，国力定巅峰。民主体制带来的协作优势，被用在了工业的转型上。多岛科研联盟随即成立：清籁的电力、鹤观的矿冶、渊下宫的远古技术，三家合股，专攻民用精密设备。头一件量产的是医疗用的元素检测仪，图样出自渊下宫的旧档，缩小到只占一张桌面，试机那日，医士给老病号测了脉象，纸上波纹清清楚楚，老病号说：「比郎中的三根指头还细。」随后精密机床、量具、航海罗盘次第投产，出厂的每一件都打上同一枚印：「海祇制造」。这枚印渐渐成了口碑，外邦的采买使在码头上验货，验完了只问一句「还有没有」。质检的章程定得死：一不合格，整批回炉，管事同罚，没人敢蒙混。工业的飞跃一步一个脚印，撑起了共和的梦想。科技富国，国力自此定于巅峰。"
 SAN_event.166.a:"重工业维新"

 SAN_event.167.t:"诸岛共武备"
 SAN_event.167.desc:"防务网全域，三军协同保平安，和平志已坚。一套跨岛屿的民防指挥网建成了，各地的公民武装被整合进现代化的国防体系。网心设在珊瑚宫，节点沿诸岛分布：渔村的瞭望塔、矿区的警钟、学塾的集合图，全都编进同一本册子，册子的扉页写着「人人有岗」。演练按季举行：渔船收网的号声一变即是警报，村里的警卫队按图就位，正规军的增援船在两个时辰内靠岸，老少配合，秩序井然。去中心化的理念贯穿始终：即便网心失联，各岛依预案仍可独立支撑半月，粮械的密库位置只有本村人知晓。一位老渔公参加完演练，坐在堤上抽烟，说了句实在话：「求和平，手里得先有家伙。」我们要让每一个岛屿都成为自由的堡垒，让每一个公民都成为抵御暴政的盾牌。防务网张而不张，剑在鞘中，和平志坚，谁也不必惊慌。"
 SAN_event.167.a:"同修武备"

 SAN_event.168.t:"海祇共和国"
 SAN_event.168.desc:"自由之海阔，万众同心铸共和，远景映黎明。所有的碎片，终于拼凑成完整的版图。成立大典那日，各岛的代表齐聚珊瑚宫前的广场，海祇联合共和国正式宣告诞生。国名是议会反复推敲定的：「联合」二字放在前头，说是先有诸岛，后有共国，次序不能颠倒。升旗的时刻选在黎明：旗升到顶，日头恰好跃出海面，旗上的银纹被照得发亮，广场上几百万人的欢呼惊起满滩的海鸟。大典之后没有设宴，各岛代表同去码头搬了一上午的赈济粮，说「新国家头一日，先做活人该做的事」。此后诸岛互通的渡船加密了班次，税册合一，学册合一，连灯谜的谜面都开始在诸岛之间传抄，谁也说不清哪条是哪岛的货。数百万岛民共同的家园，就这样在和平、繁荣与民主的体制下立了起来。自由之海，波澜壮阔，每个黎明，都是新的。"
 SAN_event.168.a:"为民立共和"

 # --- 路线C：白夜远征军 (169-180) ---
 SAN_event.169.t:"苍穹伪幕揭"
 SAN_event.169.desc:"血荐战高天，揭开天理伪秩序，白夜志不移。《日月前事》解析到最后一卷，心海大人合上书，在书房独坐了整夜。天亮时，她做出了那个令整个提瓦特战栗的决定：向天空岛宣战。军议上没有哗然，只有长久的静，静过之后，是最年长的将领先起了身，摘下佩刀放在案上：「老朽的刀，随这份诏书一起去。」接下去是一把接一把的刀声，像退潮时礁石上一层层碎开的浪。宣言写得很短：「神灵的统治是数千年的谎言。凡人要夺回命运的定义权。」革命军的招募处设在珊瑚宫侧门，来的人排到了码头：有白发的老卒，有没成年的渔家子，有个哑巴水手不能写名字，便在名册上按了个手印，按得极重。有人问心海大人胜算几何，她答：「算盘算不出这一仗，可书里写着，凡人赢过一次。」哪怕对手是执政，白夜国的志气也不移半分。革命，就此爆发。"
 SAN_event.169.a:"凌云之志"

 SAN_event.170.t:"反抗志远播"
 SAN_event.170.desc:"火种撒万里，革命思想传列国，旧序终崩颓。反抗的火种不应只在海祇岛燃烧。政治工作者一批批渡海而去：扮作行商的、抄经的、说书的、走方的郎中，行李里都夹着夹层，夹层里是薄薄的小册子。他们去联络各地被神权压得抬不起头的人：欠着祭赋的渔户、被祭司记名的乐师、失去田地的边民，一处一处，把话说到心坎上。册子上的话不多，翻来覆去只有一句：「神非永恒，凡人的意志才是世界的真宰。」起初没人敢应声，后来有人在墙根下用炭笔画了一个小小的日轮，再后来，画日轮的人多到官府刮不过来。稻妻城的更夫夜里巡街，听见城隍庙的檐下有人低声哼着海祇的祝词调子，他没告发，跟着哼完了后半句。风暴没有雷声，它在悄然成形，一圈一圈往外扩。旧秩序的崩颓从来不是一日之间，只是等它显形时，人人都说早就该这样了。思想觉醒的火，正撒向万里。"
 SAN_event.170.a:"解民于倒悬"

 SAN_event.171.t:"暗海征帆远"
 SAN_event.171.desc:"远征向禁忌，攫取魔神古威能，战旗映残阳。远征军团组建完毕，目的地写着两个禁忌的字：暗之外海。航线上要先穿越致命的雷暴带，船体包了三层云母，桅顶的避雷针淬过雷纹，试航那日，主桅挨了七道雷，船身完好，水手们朝天挥手，算是打了招呼。雷暴之外，是无图可循的边缘海域：罗盘失灵，星图无用，航向全凭大蛇旧档里那句「随珊瑚而栖」摸索。前哨站选在大蛇当年获得珊瑚之力的旧址，营盘扎在礁盘上，旗杆用的是沉船的桅木，旗升起来时，海面泛起一层罕见的紫光，老水手说那是「旧主看了一眼」。勘探队从海底残迹里起出的东西，一件件登记封存：发光的骨殖、温热的晶簇、刻着无人能识文字的石片，每一件都足以撼动高天的秩序。押运回国的船舱加了三道锁，锁的钥匙分掌于三人。征服黑暗的第一步，是敢朝黑暗里走。远征的战旗在残阳里猎猎作响，旗后是整支整支的船队。"
 SAN_event.171.a:"兵入禁区"

 SAN_event.172.t:"天理之网眼"
 SAN_event.172.desc:"屏蔽天之眼，地脉噪音乱神意，黑暗现生机。渊下宫出土的古代干扰技术，给了我们一个大胆的念头：把天空岛的眼睛蒙住。工程的核心是一组布在诸岛地脉上的共鸣器，同时发动时，便搅出大规模的「地脉噪音」，神明俯瞰这片海，看见的将是一片沸腾的浊流。共鸣器藏在渔礁与沉船里，外壳做成藤壶的模样，连赶海的孩童踩上去也不会起疑。试机选在月黑之夜：值机的学士盯着监测的水纹，噪音一起，屏上关于本岛的地脉回波顿时碎成雪花，他盯着看了半晌，轻声说：「看不见我们了。」满屋的人谁也没欢呼，只把这套流程又默练了一遍。窗口期是宝贵的：天理会来查看，修复的空当便是总爆发的时机，军部的日程表上，「黑暗窗口」一栏画着三道红线。对旧秩序的破坏做得这样安静，安静得像退潮。混乱是我们的利刃，锋芒隐于黑暗，黑暗里正孕育生机。"
 SAN_event.172.a:"潜于网眼"

 SAN_event.173.t:"炉厂归义社"
 SAN_event.173.desc:"工坊归公社，所有产出注革命，铁流向高天。私有私产一律取消，整个国民经济转成了一个庞大的后勤中心。工坊归了公社，厂牌摘下来统一收库，管事的先生们换了公家的号衣，账房的算盘声从各家的铺面搬进了公社的大堂。每一颗子弹的铸造、每一克粮食的分配，都服务于一件事：向高天挑战的终极战争。公社的粮仓按营编号，弹械按路分运，军列的车皮上用粉笔写着去向，擦了写、写了擦，字迹摞着字迹。极端的动员之下，产出造出了神灵也难想象的奇迹：炼铁的炉子三个月没熄过火，缝纫的作坊把霞帔的针法改成了弹带的针法，绣娘们说手熟了，比绣花还快。征用的告示贴出来，底下没有一张撕的，有店家自己把存货抬去公社，登记的文书劝他留些本钱，他摆摆手：「都给，打完再开张。」一切为了前线，四个字印在米袋上、弹箱上、每个人的臂章上。铁流滚滚，去向是高天。"
 SAN_event.173.a:"炉厂尽归公"

 SAN_event.174.t:"白夜锐士募"
 SAN_event.174.desc:"深渊育死士，不惧神灵威压重，一念破苍茫。白夜突击队员的招募令只有一行字：「惯居黑暗、不惧威压者来。」来的人形形色色：渊下宫土生土长的灯守之后、在地底矿道里干了半辈子的老矿工、还有几个当年在黑暗中撑满全日的地走官。选拔只考两样：黑暗中的行止，与面对威压时的心志。后一关设在渊下宫最深的地脉裂隙旁，受试者要站着承受一炷香的地压，出来的个个面色发白，却没有一人退场。有人被问为甚么不退，他答了四个字：「底下长成的。」队员们的渊能武器配得最精：枪管的符纹是老匠人一笔一笔錾的，錾到眼睛发花也不许徒弟代手。誓师那日，队伍在黑暗里列阵，没有火把，只有渊能武器的符纹幽幽发亮，像一片贴着地面流动的星。他们将在领袖的指引下，把毁灭的长矛掷向那高高在上的御座。我们是神灵的噩梦，无所畏惧，一念可破苍茫。"
 SAN_event.174.a:"锐士集结"

 SAN_event.175.t:"渊底密约成"
 SAN_event.175.desc:"暗影为同谋，敌人的敌人共敌，撕碎伪光明。与深渊教团分支的临时合作，是心海大人默许的一着险棋。谈判在一条无名的沉船里进行，两边隔着一张旧海图对坐，谁也不提「信任」二字，只谈三次合作的章程：情报互换、互不袭扰、各打各的旗。教团的人递来的名帖是一枚黑铁的环，接帖的军需官捏着它半天没放下，回来在日志里写：「火中取栗，栗是真栗。」合作换来的头一样东西是一份地脉图，标注的精确程度让测绘的学士们脸红，对方只提了一个条件：事成之后，还他们一座被封的旧殿。军中为此起了争执，老将拍案反对与渊底之物共谋，心海大人只回了一句：「撕碎伪光明之前，先不问火把是谁递的。」约定的底线也写得明白：借兵不借旗，借道不借城，深渊之主的名讳不许出现在我军的册子上。阴影与革命交织之时，提瓦特的天空将彻底变色。禁忌同盟已结，黑暗成了同谋，这一步，无路可退。"
 SAN_event.175.a:"暗中缔盟"

 SAN_event.176.t:"渊民总动员"
 SAN_event.176.desc:"渊下起咆哮，数万平民化锐卒，革命志如磐。深居渊下宫的移民，成了革命预备役的中坚。军事训练营盖到了每一个社区：训练场就设在街市的空地上，白日里晒渔网的地方，傍晚便立起了木枪架。课业排在工歇后：两刻队列，两刻枪械，两刻地志，教官多是退役的地走官，嗓门不大，眼里不揉沙子。缝纫铺的女掌柜第三次考核拿了优等，她把评语裱起来挂在铺子里，来买线的都要看一眼，看完都笑，笑完都加练。社区之间比着练：谁的队列齐，谁的装枪快，输了的街坊便集体加夜课，输赢记在街口的小黑板上，擦了又写。数万移民，人人是劳动者，人人也是战士。渊下宫不再只是生产中心，它成了积蓄怒火的火山口，地底的意志一旦咆哮，整个提瓦特都将颤抖。觉醒的巨人正在岩层深处站着，站得笔直，等一声令下。"
 SAN_event.176.a:"三军齐动"

 SAN_event.177.t:"同心备战录"
 SAN_event.177.desc:"灵魂皆甲兵，革命哲学映人心，向死而生勇。这场对决不只是武力的比拼，更是灵魂的争夺。基于「反抗哲学」的思想战线随之铺开：讲习所设在茶馆与祠堂，讲的不多，就一个问题：「命是神给的，还是自己挣的？」答的话渐渐一致了：命是自己挣的，神给的只是生，不是活。学堂的孩子把这答案写进作文，先生的批语只有两个字：「记牢。」战前的动员课上，教官让新兵轮流说一句最想说的话，有个哑口的水兵在板上写：「上头欠我们一场日出。」满堂静了片刻，掌声比雷响。挑战神灵成了最高尚的宿命，这信念烧到了近乎狂热的程度。营中的口号没有一句提生死，只有一句「向死而生」，喊的时候没人转头。这股精神上的洪流一经放出，任何理性的阻碍都将被碾碎。思想武装完毕，灵魂皆是甲兵。"
 SAN_event.177.a:"众志如一"

 SAN_event.178.t:"仰望天之御座"
 SAN_event.178.desc:"目光穿铁幕，精密定位高天影，打击有期时。白夜国失落的轨道观测技术被逐页译出，观测塔随即在知比山巅动工。塔身九层，顶层的镜筒以渊能晶片聚焦，夜间对准云层之上那座悬浮的神秘岛屿。观测的第一夜什么也没拍着，云层太厚，塔上的人熬到后半夜，云忽然裂开一道缝，镜筒里的像一闪而过，值守的学士手都在抖，纸卷打了三格才稳住。此后的观测夜夜不歇：高层大气的元素波动被一格格记录下来，防御体系的结构图在图纸上一点点显形，护层几何、能量节点的方位，都标得清清楚楚。测绘的人在这张图上标了三百多处注释，图角写着一行小字：「高处不胜寒，然目光已锁神座。」弹道组据此演算了四百一十六种打击方案，逐项归档。终结的倒计时已经开始，钟摆声一样一声，不急，不停。目标确立，只待号令。"
 SAN_event.178.a:"剑指天穹"

 SAN_event.179.t:"破神圣安排"
 SAN_event.179.desc:"烈火烧天幕，海空潜渊齐发难，旧序化飞灰。革命的高潮到了。所有的渊能导弹已锁定目标，所有的重装突击师在祭坛前集结完毕，海上的船队、空中的机群、渊底的兵锋，同时待命。总攻的前夜，营地静得出奇：有人把刀擦了三遍，有人给家里写了半封信又烧掉，有人什么都没做，只是面朝东方站着，一直站到熄灯。心海大人的动员令只有两句：「凡人的铁火，要烧出一条通向真理的路。此战过后，命运姓凡。」号令发出的那一刻，海空潜渊齐齐发难：导弹的尾迹撕开夜幕，机群贴着云层压上，突击师的白夜旗在光柱里猎猎作响，连海水都在震动。操控凡人命运的陈腐法则，在第一轮打击里便裂了缝，旧秩序的根基一寸寸化为飞灰。后方的人听着隐约的闷响，谁也没关门，都站在院子里仰着头。最后的决战已经打响，进攻高天！"
 SAN_event.179.a:"撕碎天理！"

 SAN_event.180.t:"新世晓光初"
 SAN_event.180.desc:"白夜终将归，旧序崩颓灰烟里，万物复生晖。旧秩序在灰烟里崩颓的那一日，整个提瓦特的天色都变了：云层裂开，久违的光直直落进海底。我们要让这片大陆重现第一王座时代的荣光。海祇岛以革命灯塔自任，向诸邦发出同道的邀请：废除执政的统治，建立凡人自治的联合政体。邀请函发出不到一月，复函一封接一封渡海而来：有的郑重应允，有的心存观望，有的婉言谢绝，海祇岛一律以礼相待，礼数分毫不差。国内的章程先行拟就：政体草案公开张贴，人人可以批注，批注纸贴满了三面墙。有老学究逐字读完，抚着墙叹道：「几千年的枷锁，卸下来原来是这样一步一步走。」清籁岛的孩子在新学的第一课里写下：「日出是我们自己的。」这是全人类对命运枷锁的告别，新世界近在咫尺。白夜终将归，万物复生晖，凡人万岁！"
 SAN_event.180.a:"新纪元启"
# ========================================================================
# 精神部分
# ========================================================================
 # ========================== 模块一：开局局势 (1-10) ==========================
 
 # Daybreak_of_Teyvat:"提瓦特的黎明"
 # Daybreak_of_Teyvat_desc:"晨曦破长夜，群星黯淡月西斜，旧序终将灭。这是提瓦特大陆动荡时代的开端，海祇岛作为反抗天理与幕府暴政的第一哨站，肩负着引领众生走向觉醒的使命。在这片古老的土地上，反抗的火种已经点燃，我们将见证文明的重生与黎明的到来。"

 SAN_Tax:"九十万年的赋税"
 SAN_Tax_desc:"稻妻幕府一边以锁国与眼狩令消解海祇子民世代传承的信仰根基，一边借勘定奉行之手对海外岛屿施以层层经济盘剥。时至今日，海祇岛的赋税竟已预收到九十万年之后，岛上民众终年劳作却难饱腹，生计早已被逼至悬崖边缘。"
 
 SAN_army_corruption:"军队组织涣散"
 SAN_army_corruption_desc:"残甲卧荒滩，流兵四散望长安，军魂何处还。反抗军初起时，原是一盘散沙。幕府压境，号令不出一村，各队自战自散，粮械亦无着落。有老兵战后蹲在滩上磨刀，磨了半日，说：「空有热血，没个章法，终究是白白送死。」心海深知此弊，遂下决心重整军制，不然反抗终是一场幻梦。"
 
 SAN_worker_shortage:"劳动力枯竭"
 SAN_worker_shortage_desc:"田园没荒草，壮丁从军别乡老，空屋听秋鸟。边境的摩擦连年不歇，眼狩令的骚扰日甚一日，青壮尽数从军，农田与工坊一天天空下来。海祇的基础建设因此大为滞后，民生之业近乎停滞。村头的老槐树下，坐着的只剩老人与孩子，饭桌上摆三副碗筷已是寻常。战争动员与民间生计，两头都在秤上，这一杆秤，不好端。"
 
 SAN_planingtoomuch:"过度的战略推演"
 SAN_planingtoomuch_desc:"残灯映锦囊，万策千虑谋全局，难补一时慌。心海的锦囊有名，百局皆备，将士临阵拆囊而行，十有九验。只是妙计太密，也有副作用：前线的将官临机遇变，先想囊中有没有此局，等信使往返一回，战机已过。军议上有将直言此弊，满座失色，心海却先笑了，道：「说得对，囊是我缝的，不是挡箭的牌。」自此锦囊只备三策，余地留给阵上的人。智是盾，可盾太重，人就走不动了。"
 
 SAN_Too_young:"现人神的资历疑云"
 SAN_Too_young_desc:"新月掩云间，雏凤清声初试羽，群臣忧圣颜。心海大人临危受命，袭了现人神巫女的尊号。岛中长老素来持重，见她年轻，一时议论纷纷。她也不辩白，只将积压的军报一一判过，判词短短，却无一句落空。半日后，那位最难说话的老宫司亲手给她斟了一盏茶，说：「老身从前只当您是个孩子。」心海笑道：「如今呢。」老宫司道：「如今老身不敢了。」"
 
 SAN_Delusion:"邪眼的代价"
 SAN_Delusion_desc:"虚名换战威，暮色苍茫生命竭，残愿化灰飞。原是绝境之中，有几名反抗军士卒悄悄收了邪眼，平日只藏在贴身衣内，临阵便贴肉一按。那物竟透支人的寿数，用一回，眉目便老一分。军医背地里记下一册，册上名字渐多，字迹却渐轻。心海看了半日不语，末了只道：「这是拿命换来的战功，谁也不许再提骄傲二字。」一时帐中烛花爆了一声，众皆低头。"
 
 SAN_devalue_the_inmuase:"经济封锁遗恨"
 SAN_devalue_the_inmuase_desc:"金贝锁重关，市井萧条物价翻，苦泪落心坛。勘定奉行锁关盘剥多年，珍珠出不得海，米粮进不得港，岛中物价一日三涨。老妇拿一串钱买半篮薯，站在摊前数了又数。心海遍巡市井，回宫便下决心破这关税的铁幕，道：「珠子是死的，商路是活的，路通则岛活。」"
 
 SAN_piety_of_watatsumi:"海祇虔诚"
 SAN_piety_of_watatsumi_desc:"潮汐向海渊，万民膜拜祭灵泉，信仰定国先。海祇岛民事大御神，不因神在而拜，因神曾以身为堤而拜。每年忌辰，诸岛禁渔一日，渔船头尾相接浮在海上，静得只剩浪声。孩子问老人，神都不在了，拜给谁看。老人指着海说：「拜给提过咱们的那双手。」这份信，化作对珊瑚宫的敬，化作战时的不散，化作粮尽时的不逃。心海说过：庙会塌，堤不能忘。一岛的人，都记着这句话。"
 
 SAN_legacy_of_sun_child:"太阳之子的枷锁"
 SAN_legacy_of_sun_child_desc:"高塔曾囚稚童，白夜幽幽照孤影，旧毒今须清。渊下宫「太阳之子」的旧祸，账要一页一页翻：因献祭而起的族规、因神童而生的特权、因恐惧而存的告密簿，一一登记，当众焚毁。有旧族后人跪求保全祖祠，心海许其存屋，焚其名册，道：「屋留给活人住，册子留给史官看。」清算既毕，衙门里的暗门少了，廊下说话的声音亮了。释了旧毒，文明才算松了绑。"
 
 SAN_omikami_protection:"大御神之佑"
 SAN_omikami_protection_desc:"灵光佑三岛，坚垒磐石映狂涛，敌寇胆魂消。外敌屡屡犯境，怪的是每到滩头，风向忽转，雾忽然合，炮发不响，桨折无端。军中不张扬此事，只说巧合。可有老兵作证：故土作战，人心不慌，手脚便稳，工事抢得也快。珊瑚宫前的圣火，战时添了两班守夜的巫女，火光映在浪上，渔船夜归者皆朝着火光行船。心海在祭文里只写了一句：神未必显灵，人心齐处，即是神在。"

 # ========================== 模块二：军事改革 (11-20) ==========================
 SAN_gorou_general:"大将之威"
 SAN_gorou_general_desc:"犬影战阵先，忠勇无双振军纪，破敌若等闲。五郎大将以其赤诚之心和卓越的统帅力，赢得了士兵们的崇高敬意。在他的领导下，原本散漫的反抗军逐渐形成了严密的组织体系。他那不屈的斗志如同冬日暖阳，在每一次绝境中都能带领部队重新集结，向敌人发起反击。"
 
 SAN_watatsumi_militia:"海祇民兵动员"
 SAN_watatsumi_militia_desc:"渔叉磨亮时，解甲归田又披挂，保家志不迟。诸岛的渔民与农夫编入民兵之籍：农忙时各归各业，汛期操演，战时集结。他们熟悉家园的每一处滩涂与礁石，闭着眼也走得通的自家山路，是反抗军最广大的兵源。幕府军在占领区的每一寸土地，都要为这份熟悉付出代价。老渔民把磨好的渔叉往门边一立：「叉在，家就在。」"
 
 SAN_partisan_warfare:"裂谷游击战法"
 SAN_partisan_warfare_desc:"隐身暗林间，奇袭惊雷落敌阵，退若晨雾残。八酝岛地形支离，祟神之气常年不散，正宜久驻之游击。小队昼伏夜出，专断补给：炭船、米船、传令骑，皆是目标。幕府军的据点越缩越小，哨界越缩越紧，夜里听一声鸟叫也要对暗号。游击队员的规矩却怪：得手不追，失手各自散，各队只认接头之记。如此月余，幕府的军报里添了新词：林中之地，不可久留。总攻的时辰，就这样一分一分地被磨了出来。"
 
 SAN_vision_vanguard:"神之眼先锋队"
 SAN_vision_vanguard_desc:"一念动雷火，凡人愿望破苍穹，锐意荡敌踪。那些未被眼狩令剥夺愿望的强者，被心海大人编入精锐的先锋师团。他们将元素力与现代战术相结合，成了战场上无可替代的利矛。每一个神之眼的烁光，都在宣告着凡人意志对神权的正面挑战。"
 
 SAN_ronin_mercenaries:"浪人契约军"
 SAN_ronin_mercenaries_desc:"残刀无主时，流落荒野觅忠义，海祇续英姿。失主的流浪武士渡海而来，海祇以名誉与粮饷相待：授职按技，酒饷按时，战功记档，绝不拖欠。这些人散漫惯了，初入营时横刀而立，目无长官。营里不与其争，只请他们看了一场操演，看罢有几个当场请缨入籍。自此浪人编入正军，近战之技倾囊相授，营中白刃一门陡然精进了。有老队长说：「野马套上笼头是可惜，可战场上认的是合群的刀。」"
 
 SAN_high_pressure_hydro:"高压水炮技术"
 SAN_high_pressure_hydro_desc:"激流斩铁甲，渊底秘术重现世，威力震八荒。高压流体传导的古法出土后，工匠依其理制成水炮。试射那日，一道水线激射而出，铁靶应声而断，断口光滑如切。围观的武官们半日无言，末了有人道：「水到了这个地步，比刀还讲道理。」重型的工事，自此不再是难啃的骨头。"
 
 SAN_naval_ambush:"海雾伏击战术"
 SAN_naval_ambush_desc:"迷雾锁战舰，影中杀机现端倪，沉舟没汪洋。海祇四周的浓雾，原是天险，今成杀阵。小快船编成雾队，专候视觉盲区：敌舰桅顶看不见的地方，便是她们的航路。演袭那日，幕府哨船自以为无人，忽有三面桨声齐至，火起时连敌船旗号都未看清。被俘的水手说：「浪里忽然长出船来，喊都没处喊。」自此幕府水军入雾先烧香，航速减半，心却先乱了一半。"
 
 SAN_elite_divine_guard:"现人神亲卫团"
 SAN_elite_divine_guard_desc:"珍珠映红袍，誓死守护巫女殿，荣光不可摇。这是由心海大人亲自挑选、在内战中立下赫赫战功的最强精锐。他们不仅配备了最好的炼金装备，更接受了最高强度的战术培训。作为国家的最后一道防线，亲卫团的存在本身就是对敌军士气的沉重打击。"
 
 SAN_standardized_forging:"标准工业锻造"
 SAN_standardized_forging_desc:"规格归一律，锤声齐，兵甲足。刀匠行里传了数百年的学徒制改了章程：每一支步枪、每一枚炮弹，皆依同一副图纸、同一把量具。老匠人初时不服，说刀是有魂的，哪能千篇一律。后来见前线的兵坏一支枪，随手拆另一支的零件就能接上，才不言语了。武装的速度成倍地涨，前线补给的乱账自此翻篇。有个年轻学徒在匠籍册上写：从此刀有谱，谱在量具上。"
 
 SAN_storm_riders:"雷暴骑兵"
 SAN_storm_riders_desc:"雷霆作鼓声，骑兵冒雨练疾行，一骑抵千军。清籁的极端天候里练出了这支兵：借雷光辨路，借风势纵马，元素共鸣收放之间，一夜可奔袭百里。暴风雨落下的时辰，正是他们出营的号角。幕府的哨探最怕这个：明明雨大得睁不开眼，忽然马蹄声已到面前。所过之处，寸草不留。军中送他们一个名号：雨里的死神。"

 # ========================== 模块三：白夜科技 (21-30) ==========================
 SAN_abyssal_wisdom:"深渊智慧的启示"
 SAN_abyssal_wisdom_desc:"禁卷录旧史，第一王座揭真言，智慧越千年。白夜国的《日月前事》原封于禁室，学者们逐句校读，半载方通。卷中所记之理，远出世人所知，工程、机关、炼金诸学一时俱进。有学者掷笔长叹：「原来天不是最高的。」心海闻之，只道：「那便往高处再看一层。」"
 
 SAN_dainichi_energy:"大日能源网络"
 SAN_dainichi_energy_desc:"恒星沉海底，赫利俄斯核心燃，光明满国园。大日御舆既重启，能源循地脉送遍诸岛，工厂不再愁燃料，民居的灯彻夜长明。有渔村孩子头回见不灭的灯，问祖母这灯几时熄，祖母道：「不熄了，往后夜里做事都使得。」一时家家添了夜工，夜市也长了。白夜的光，原是这样落进灶间的。"
 
 SAN_jizhashi_spirit:"地走官精神"
 SAN_jizhashi_spirit_desc:"黑暗莫敢伤，枪尖烁光守狭间，意志胜天罡。白夜国地走官的旧律重立于军中：入渊不点火，行军不言语，三日不出错，方算出师。头一批受训的精锐，在常夜里摸走七十里，归营时鞋底磨穿，人人手上添了新茧。教官验看时只翻他们的手，不看脸。从此侦察与特袭之职皆归此营，敌军的暗哨屡屡在无声里换主。有老兵说：「夜里头，他们才是主人，旁人都是客。」"
 
 SAN_vishap_taming:"龙蜥驯服技术"
 SAN_vishap_taming_desc:"龙嗣低垂首，铁轭加身役深渊，助力越山川。生物炼金之法既成：筛选、驯化、行为之导，三步走完，深海龙蜥竟成了负重与突袭之役兽。头一头驯成的巨蜥驮着弹药箱涉过激流，四足稳如磐石，看的人屏息半晌。远古的猎手成了运输的驮兽与近战的臂助，海祇的后勤投送，自此海陆皆通。生物与机械合流，是这时代的新页。"
 
 SAN_evernight_phasing:"常夜相位折叠"
 SAN_evernight_phasing_desc:"空间叠残影，瞬息移步跨重洋，玄机莫能详。常夜灵庙的空间叠加之理，试用于传送，初时只敢递密信与要紧的物件。第一次试验，信自渊底一端投入，半炷香后自另一端取出，纸上墨迹犹新。值守的术士盯着空处看了半日，喃喃道：「路没了，路又在了。」距离二字，自此要重新写过。"
 
 SAN_serpents_heart_ritual:"蛇心祭仪"
 SAN_serpents_heart_ritual_desc:"地脉乱弦振，屏蔽天之监视眼，秘密锁重深。蛇心之地的祭坛震动有异象，海祇依此立起情报之障：凡天之监视、外邦的窥探，至此皆入噪音。障内之事，障外不闻。庞大的谋划就在这片阴影里一寸一寸推进，图纸不过海，令不过讯，全凭人递。守障的巫女轮班不多言，问起用途，只答：「海底下的事，天上看不见。」"
 
 SAN_forbidden_history:"直视禁忌历史"
 SAN_forbidden_history_desc:"真相沉血海，揭开谎言逆乾坤，白夜志不改。《日月前事》的真相公开传布，各村的讲席上，说书人念一句，底下静一分。有人听完，把自家的神龛蒙上了布；有人当夜便要投军。外邦的责问文书雪片般飞来，心海一一收下，搁在一处，道：「恐慌也好，恐慌说明他们听懂了。」"
 
 SAN_white_night_doctrine:"白夜对抗教义"
 SAN_white_night_doctrine_desc:"战法出古卷，奇兵诡道算无遗，神位亦可敌。七执政体系的武力特征被逐条拆解：个体的力再强，也强不过一张布好的网。空间之控、能量之反制、极端环境的适应之训，三者合成了新战法。陆军由此转成能对抗魔神级之敌的战斗之群。演武那日，术士与步卒配合着困住了一位神之眼的老将，老将认输时笑骂：「这是下棋，不是打架。」众生平权，始于剑锋。"
 
 SAN_subterranean_complex:"地底联合工业体"
 SAN_subterranean_complex_desc:"熔炉深藏下，任凭地表火冲天，生产永不延。渊下宫的岩层里立起了自给自足的工业之芯：炉、坊、仓、居，四位一体，白夜的长明灯照着彻夜的锤声。地底的厂不受天时，不受空袭，日夜产出战争之物。地面的将士听见渊口传上来的锤声，说那是海祇岛的心跳。这颗心跳一下，前线的刀就多一把。"
 
 SAN_hydro_mastery:"水元素全域掌控"
 SAN_hydro_mastery_desc:"汪洋入指尖，潮汐听命于素手，术成海让路。血枝珊瑚的旧理既通，海祇的术士遂能引潮而行：阵前立起水幕，敌矢至则没；舰队借海流加速，半日程并作一刻。演武那日，术士当众托起一丈高的水墙，墙里游着两条活鱼，鱼过墙而水不散，满场喝彩。心海在旁看着，忽道：「莫夸术高，海肯借力，是念着大蛇的旧情。」众人一时收声，只觉掌心的水凉了几分。"

 # ========================== 模块四：政治分歧 (31-45) ==========================
 # --- 路线A：现人神绝对权威 (威权) ---
 SAN_divine_authority:"唯一真神权威"
 SAN_divine_authority_desc:"神谕定乾坤，万众一心拜巫女，秩序定万年。心海正式被奉为大御神在世之身，法律、政令、军令，皆视为神意。令行禁止，效率极高，全岛如一台调准的钟。只是她夜里独自校阅文书时，偶尔会停笔，望着窗外的海发怔。近侍不敢问。原来权柄到了顶，错一个字，便是错一国。"
 
 SAN_orobashi_orthodoxy:"大蛇正统信仰"
 SAN_orobashi_orthodoxy_desc:"鸣神迹尽扫，唯一真神居尊位，万民归一宗。国内鸣神崇拜之迹，庙宇改作讲席，神像移入旧物库，注曰：此物有史，无神。神学之课列入塾中必修，先生开讲第一句：大御神以身为堤，护此海邦，恩在骨血。旧神官有的改行教书，有的愤而离岛，皆听其便。信仰归一之后，说来也怪，诸岛争执反倒少了，原来骂仗多半是因神起。有塾师私记：神统一了，人心未必统一，此课当慢慢讲。"
 
 SAN_clerical_admin:"神职行政体系"
 SAN_clerical_admin_desc:"官吏皆受戒，政令自带神威重，钟表般运转。各级官吏皆出自受过神学考核的巫女与祭司。文书下行，先诵一遍祝词，再宣正文，百姓听惯了，令到即行，少有拖沓。有外邦来使观政，叹道：「贵国的政令，原来还带着香火气。」陪观的祭司笑答：「香火气便是公信力。」一时行政之速，竟如钟表齿轮，一齿动而百齿皆动。"
 
 SAN_holy_crusade:"神圣解放征讨"
 SAN_holy_crusade_desc:"白帆渡雷海，悲悯之名征四方，灯火照远邦。远征军团自诸岛出港，船身皆漆素白，帆上绘蛇与珠。誓师礼上无人高呼，心海只将一盏渔灯交与统帅，道：「灯照到的地方，先问疾苦，先问收成。」舰队越过雷暴与极寒，所至之处，先立医帐与义仓，再议他事。有人讥这是沽名，随军的书记在日志里写：「珠埋进异邦的沙里，是拿来照路的，不是拿来炫耀的。」号角已响，此去海天无尽。"
 
 SAN_imperial_zeal:"帝国主义狂热"
 SAN_imperial_zeal_desc:"忠魂淬铁誓，甘将血肉填山海，刀锋向所信。神座的教化日深，营中风气渐变：操练到力竭，无人叫苦；阵亡的名讳录满一册，送葬的队伍反倒唱着歌。有母亲送子入伍，临别只整了整他的领口，说：「去吧，把愿望带走，别把它落在家里。」军中伤亡虽重，士气不见衰，战死者入祠时皆授神阶，御灯自晨至暮不熄。有外邦使节见了，回去写道：「此邦之勇，非生于乐，生于信。」"
 
 # --- 路线B：海祇民主议会 (民主) ---
 SAN_republic_spirit:"海祇共和精神"
 SAN_republic_spirit_desc:"主权归于民，议会执掌世俗事，共和是契约。独裁的影子既去，议会的灯火便亮了：世俗之政归议员，心海居精神之位，不预钱粮，不问刑名。初时有人忧她大权旁落，她只笑道：「愿望既还了民，就不该再收进一只匣子里。」诸岛的风气渐渐变了：塾里教辩难，市上敢议政，报馆的版上骂官也不获罪。老学究惊道：「这岛上，连海风都比别处直爽。」契约既立，人人皆是主人。"
 
 SAN_multi_island_parliament:"诸岛联合议会"
 SAN_multi_island_parliament_desc:"多岛一心议蓝图，公正见阳光，民意定国方。诸岛联合议堂开于海祇，海祇、鸣神、清籁、离岛的代表同席而坐，席位不分大小，只按丁口。议事自有章程：一事一议，发言以香计时，香尽则止，故废话少而实事多。头一届议了三件大事：航税、渔汛、学塾，皆以多数决。有代表散会后叹道：「从前是官替百姓定，如今是自己吵出来，吵得再凶，心里也服。」议堂外，潮声与争论声，昼夜相和。"
 
 SAN_freedom_of_worship:"信仰自由共存"
 SAN_freedom_of_worship_desc:"大蛇鸣神共和解，灵台自清宁，信仰归个人。政教分离之令颁行，拜大蛇的与拜鸣神的，在律法前同为一等百姓。昔日因香火结的仇，一时没了由头。村里两家素来不往来，重修祠堂那日，竟一同吃了酒。老人们说：「神有神的道理，人有人的日子，别混在一起较劲。」"
 
 SAN_liberal_market:"离岛自由港"
 SAN_liberal_market_desc:"税卡尽撤去，万国资本落地来，中产渐长成。离岛要作东方的商埠，头一件事便是撤卡：入港不索陋规，出港只纳明税。原来卡上的吏层层伸手，商船宁可绕远路；如今账目一清，船反而挤破了码头。异国的商号、货栈接连开张，本地的小商贩租下铺面，也学人家立账挂牌。码头扛活的人家，渐渐有了余钱送孩子进学塾。账房先生说，这一带的中产，是码头上一箱一箱扛出来的。"
 
 SAN_citizens_militia:"公民武装卫队"
 SAN_citizens_militia_desc:"灶边藏利刃，乡音守乡土，万家皆烽燧。共和初立，各村依志愿立起自卫的组织。农具之外，家家添一件兵刃，皆自家出钱置办，官府只教操法。练武之日，田埂上排开一列，锄头与长枪并立。有老农说：「守的是自家的稻子，不用人催。」原来自由二字，落在乡里，便是这个样子。"
 
 # --- 路线C：白夜远征军 (/革命) ---
 SAN_revolutionary_logic:"凡人革命逻辑"
 SAN_revolutionary_logic_desc:"旧序崩颓灰烟里，万物复生晖，意志破天威。凡人的意志高于神座，这一条写进了纲领的头一行。海祇自居革命之枢，传檄诸邦：凡执政治下，皆是「虚假永恒」的租客，租期由天定，房契却在凡人手里。此论一出，青年的血先热了，各岛的塾里，孩子争背纲领的头一行。心海在讲演末尾说：「神的时代终有散场，散场之后，灯要人自己点。」进攻的锐气与感召之力，皆自此一纸出。"
 
 SAN_collectivized_forges:"集体化工业熔炉"
 SAN_collectivized_forges_desc:"私炉尽归公，产出尽注革命去，铁流改版图。私人炉坊尽数归公，产出皆入总账，铁料、火药、机括，各归各库。调度之令自珊瑚宫发出，昼夜不歇。有炉主交出钥匙时叹道：「炉子不是我的了。」接管的匠官道：「炉子是大家的，火也烧得更旺了。」一时铁水奔流，映得半山皆红，众人只望着账上添数。"
 
 SAN_abyss_alliance:"深渊阴影契约"
 SAN_abyss_alliance_desc:"借影反制光，渊下知识为我用，险中求解放。原是心海与渊底旧识暗通一信，约定只借其学问，不纳其人。信使夜至，怀中密卷尚带着渊底的寒气。左右劝道：「此路凶险。」心海道：「天上那位的规矩，原不容人慢慢讲理，只好先借一柄刀。」言毕将卷宗收入匣中，匣上落锁，钥匙只她一枚。"
 
 SAN_defiance_celestia:"逆天行道使命"
 SAN_defiance_celestia_desc:"旧约一笔废，地脉信号自拦截，高天亦侧目。与天空岛的一切「神圣协议」，当众付火。截地脉、扰循环的旧器重启，天上窥视的那只眼，一时望不清稻妻的海。此举一出，大陆上被压着的人们，暗地里纷纷传抄告示。心海立于灯下看誊抄的副本，道：「高天之上的座，该听见一点响动了。」"
 
 SAN_liberation_army:"提瓦特解放军团"
 SAN_liberation_army_desc:"渊能入七国，失意之士聚一旗，火种过海峡。这是一支跨越国界的革命武装，由来自七国的失意武士、破产商户与觉醒农民组成。他们配备了海祇岛最先进的渊能武器，随时准备前往大陆的任何一个角落播撒反抗的火种。解放的钢铁洪流已经启动，任何陈腐的强权都无法阻挡。"

 # ========================== 模块五：区域整合 (46-50) ==========================
 SAN_pearl_monopoly:"海祇珍珠垄断"
 SAN_pearl_monopoly_desc:"明珠出玉涡，贸易利权归珊瑚，国库丰且多。珍珠之利权，尽归官营：采珠季由官定，秤由官掌，价由官榜，私贩者没其货。渔户初疑官价压人，榜文贴出，价竟比私商高三成，众心乃安。原来私商层层压秤，渔户卖珠十年，未见过全价。出口的珠匣统一封印，海外市面认印不认人，海祇的珠自此有了名号。老采珠人捧着当季的珠子笑道：「大蛇给的饭，这回是真到了自家碗里。」"
 
 SAN_tatarasuna_engine:"踏鞴砂复兴引擎"
 SAN_tatarasuna_engine_desc:"炉心重新燃，祟神之力归于手，钢水日夜流。御影炉心彻底修复升级，成了海祇岛最大的工业引擎：玉钢、重械、弹药，皆从此出。炉火不熄，敲锤的班次排到三更。踏鞴砂的轰鸣换了主人，稻妻工业的霸权，就此易手。有老工匠站在炉前看了半日，末了道：「神不在的山丘，如今人自己当家。」钢铁的洪流，正从这座丘上涌出来。"
 
 SAN_seirai_storm_harnessing:"清籁能电转化"
 SAN_seirai_storm_harnessing_desc:"雷云收袖底，清籁风物入版图，涛声亦称臣。天云峠的雷暴，借超导阵法引作工业之电：巨木为杆，海缆为脉，电入各岛，磨坊、船坞、炉火皆用此力。海祇遂成提瓦特头一处电足自给的邦国。电足之后，深渊探索与国防之备，皆有了底气。清籁的老人望着杆上跳动的电花道：「从前雷是祸，如今雷是饭。」电力所至，就是新动力。"
 
 SAN_tsurumi_fog_radar:"鹤观迷雾之眼"
 SAN_tsurumi_fog_radar_desc:"古频出遗迹，千里海天织成网，来船难遁形。鹤观遗迹里旧频之法既出，远程预警之网铺开：一站在鹤观，一站在清籁，一站在海祇外礁，三站同频，声息相闻。至精的隐匿之术，也难逃此眼。这套电讯预警，为国家织起一道看不见的天网。渔人照旧打渔，商人照旧行船，只有幕府的密使知道，夜航越来越难了。"
 
 SAN_watatsumi_hegemony:"海祇海洋霸权"
 SAN_watatsumi_hegemony_desc:"铁甲列东溟，商路皆循珊瑚令，沧海入版图。东部海域的绝对之位，就此确立：铁甲之舰与海防之塞布于要津，凡过境之商路，皆循珊瑚宫的规矩。海洋不再是阻隔，是海祇子民永世的渔场与通途。老舵工们说，如今出海，看见挂着珊瑚旗的船，心里先是踏实，后是骄傲。主宰波涛，霸权永续。"
# ========================================================================
# 决议组标题
# ========================================================================
 SAN_internal_reform_category:"望泷内政与军事整固"
 SAN_internal_reform_category_desc:"\n珊瑚映月明，锦囊妙计定民心，故土焕新声。\n内战初起，百事待整。原来民兵皆是渔户出身，操练未熟，怨言却先起。心海遂先理岛内的旧账：粮册、田册、械册，一一清点，再以现人神巫女的名分颁新政。一时望泷村的灯下，文书往来不绝，乱了的次序，就这样一寸一寸地归了位。\n"
 
 SAN_war_mobilization_category:"战时动员与资源开发"
 SAN_war_mobilization_category_desc:"\n烈火淬钢锋，愿望汇聚破长空，四海战旗红。\n幕府的军械与兵力皆在己上，硬拼是下策。动员一切可为己用的力量：神之眼的奇迹、踏鞴砂的炉火、诸岛的人心，样样皆是筹码。此刻若不倾尽全力，往后便再没有这样的机会了。\n"
 
 SAN_regional_governance_category:"群岛整合与旧域治理"
 SAN_regional_governance_category_desc:"\n迷雾渐散时，雷光平息见真容，万政归一统。\n领土既拓，旧域待理：清籁的雷暴须驯，鹤观的迷雾须解，新附之民的户籍、田亩、词讼，一样一样都要有册有司。治理之道，急则生怨，缓则生变，火候全在潮信之间。\n"
 
 SAN_white_night_legacy_category:"白夜遗产与真理追寻"
 SAN_white_night_legacy_category_desc:"\n深渊藏往事，日月前书语未终，白夜觅遗踪。\n渊下宫不单是祖地，更藏着颠覆世界秩序的远古之技。遗产挖出来，翻明白了，挑战天空的底气便有了。白夜将明，前路的轮廓已渐渐清楚。\n"
 
 SAN_political_path_category:"珊瑚改新"
 SAN_political_path_category_desc:"\n殊途同归日，理想高扬绘蓝图，国运定万年。\n海祇岛的潮汐往复不休，珊瑚宫的治理却曾因权责芜杂、流程繁冗，如被暗礁牵绊的航船，难抵岛民之心。此番梳理行政体系，恰似为海祇的脉络清淤，明晰各寮各司之责，简化政令传递之途，让珊瑚宫的每一道指令，都能如洋流般顺畅淌过每一处村落的栈桥，抵达每一片渔场的渔火旁，让海祇的治理如潮起潮落般有序，如珊瑚生长般稳固。\n\n现人神巫女威望： §R[?SAN_prestige]§!\n"
 #	add_to_variable = { var = SAN_prestige value = 10 }
 SAN_prestige_Add:"§G现人神巫女威望增加§!"
 SAN_prestige_Les:"§R现人神巫女威望减少§!"

 #####################
# 决议：心海的锦囊妙计
#####################
 SAN_Kokomi_Trick_decision_categories:"心海的锦囊妙计"
 SAN_Kokomi_Trick_decision_categories_desc:"\n珊瑚宫心海者，海祇现人神巫女也，幼娴兵略，智计周详。\n当眼狩令行，天领重兵压境，愚人众构隙于内，海祇地狭兵寡，危在旦夕。心海临危秉政，乃裁素帛，预演百八十七种变局，分著临阵破敌、外交斡旋、安民治岛之策，纳以青绫锦囊，遍颁将卒，嘱临事启视，依计而行。\n临敌则伏兵、引潮、焚营诸策咸备，屡以弱胜强；和谈则预杜奸谋，揭伪定盟，干戈立止；治民则农桑、赈济、海防纤悉无遗，庶务井然。复诫麾下毋专恃锦囊，当勤研兵略，方能临机独断。\n一囊藏万策，寸帛护沧溟。其思密虑远，庇佑一方，洵巾帼之智囊也。\n\n现人神巫女威望： §R[?SAN_prestige]§!\n"
 SAN_Kokomi_Trick_decision_01:"临阵破敌计"
 SAN_Kokomi_Trick_decision_01_desc:"遇敌营坚壁，计分三途，皆书于囊：一曰擒首，潜登高地，突袭渠帅，群寇无主自溃；二曰借势，潜燃营中火药，猝惊敌众，乱其行伍；三曰用水，依海岛滩涂地利，引海潮、合雷力施感电之术，陷敌于水泽，不得施展兵戈。凡行军，囊中有分灶、伏兵、诱敌、断粮诸法；斥候探报、伏哨巡防之细则，纤悉无遗。士卒偶失锦囊，亦有备用分藏于营垒要道，不致临危无措。义军主将五郎，日夕诵读囊中文策，军中凡遇疑难，启囊即得定计，屡以寡胜众，挫幕府劲旅、破愚人众奸谋。"
 SAN_Kokomi_Trick_decision_02:"远交近攻计"
 SAN_Kokomi_Trick_decision_02_desc:"兵祸日久，岛民疲弊，心海志在休兵安民，锦囊预存外交机变。幕府遣使议和，内有奸人煽乱，欲于帐中哗变，离间两军。心海早知其谋，先授侍从锦囊，令乱起之时，先拘造事者，再示幕府勾结愚人众之实证，先安己方军心，复令天领奉行自清内奸。一席和谈，不动干戈，保全海祇疆土，又免兵戈再兴之祸，全赖囊中之预设机宜。"
 SAN_Kokomi_Trick_decision_03:"安民治岛计"
 SAN_Kokomi_Trick_decision_03_desc:"非独战事，民政庶务亦具锦囊。心海偶出岛远察，临行密布锦囊于各司：农田水利、商市通商、赈济孤弱、防备海潮、教化兵卒之规，一一罗列。虽身不在岛内，诸事循策施行，秩序井然。其囊中非独权谋，亦藏体恤民生之心，常诫将士：锦囊为权宜辅翼，不可一味依赖，闲暇当多读兵书，自辨战局，方得独当一面，不困于纸上之计。"
 SAN_Kokomi_Trick_decision_04:"阴谋进行中"
 SAN_Kokomi_Trick_decision_04_desc:"迩者宫中有不逞之徒，阴结幕府所遣间谍，潜相呼应，共为奸谋。彼辈布流言之于闾巷，腾谤言之于行伍，或诬巫女举措失当，或构其私怀异图，务欲摧损巫女德望，离散军民之心。其迹隐伏，其计阴狡，日夕煽惑，冀以浮言乱政，待衅而发，倾覆海祇之安。"

# ========================== 组1：望泷内政与军事整固 (10条) ==========================
 SAN_decision_purge_army_corruption:"肃清军队腐败"
 SAN_decision_purge_army_corruption_desc:"残甲卧荒滩，流兵散漫军魂黯，利剑斩贪婪。长期处于幕府高压下的地方部队存在严重的违纪现象。由五郎大将亲自督导，清除那些尸位素餐的旧军官，重塑反抗军的尊严与纪律。只有铁律筑就的脊梁，才能撑起海祇的明天。"
 
 SAN_decision_foreign_labor:"征召外籍劳工"
 SAN_decision_foreign_labor_desc:"异乡远渡船，共筑坚城保家园，珍珠换平安。壮丁多赴前线，岛上的工一时缺人，遂开离岛之港，招战乱里流落的外邦技工。工钱给足，且许他们盖自己的屋，拜自己的神。有枫丹来的石匠领了定钱，对着家的方向拜了三拜，道：「这里肯把人当人。」一时堤上锤声不歇，岛上的墙，一日高过一日。"
 
 SAN_decision_simplify_strategy:"简化战略文书"
 SAN_decision_simplify_strategy_desc:"锦囊藏万策，繁文缛节误战机，智略贵神速。心海的锦囊素来精妙，只是条目太繁，基层的军官捧着，往往看不明白。遂精简文书，把兵法化成几句旗语与口令，一令一义，不许两解。试行之日，传令兵跑一趟便完事，阵形立时变了。有老队正道：「从前算半天，如今一眼便懂，这才是心海大人的本事。」"
 
 SAN_decision_ascension_ceremony:"举行现人神升座大典"
 SAN_decision_ascension_ceremony_desc:"新月掩云间，现人神位定乾坤，万民拜圣颜。民间对心海资历的疑虑未消，遂行升座大典以安人心。是日珊瑚宫张珠帘，巫女执拂尘分列两侧，心海依古仪登座。台下有老叟窃议她年少，一时钟鸣三响，珠光满阶，那老叟看了看，把后头的话咽了。原来威仪不必出声，灯一亮，人自服了。"
 
 SAN_decision_economic_reconstruction:"经济结构重组"
 SAN_decision_economic_reconstruction_desc:"金贝锁重关，市井重生财路通，利权归珊瑚。勘定奉行的垄断既断，海祇自立财路：手工业有补贴，渔业加工有官坊，钱庄的利息也有定章。一时市井复盛，渔港早市的人声，隔着两条街便听得见。有老掌柜拨着算盘道：「钱能自己转了，国便饿不着。」财源既活，军资自随之而足。"
 
 SAN_decision_militia_regularization:"海祇民兵正规化"
 SAN_decision_militia_regularization_desc:"渔叉易利锋，百战老兵训后人，众志固长城。望泷村民兵本是渔民，操练既久，渐渐有了行伍的骨相。老兵教新丁站桩、结阵、听号令，赏罚皆依军册。有老渔民练完回家，放下枪又摸起渔叉，笑道：「两只手，两种活法，都不荒废。」一时滩头晨练的口号声，与潮声相和，岛上的墙，原是人垒的。"
 
 SAN_decision_forge_standardization:"推行标准锻造法"
 SAN_decision_forge_standardization_desc:"规格归一律，铁锤声震工坊隆，军需足且丰。旧的学徒制作坊各有各的规矩，刀有刀样，镞有镞样，一时尽废。新法定下统一的尺度，凡佩刀、弹药、甲片，皆依图纸打造，任意两件可互换。老师傅起初不服，摸着新刀半日，道：「料子没省，锋口倒齐了。」自此军械出库如流水，前线再没有断过顿。"
 
 SAN_decision_strengthen_faith:"强化海祇虔诚"
 SAN_decision_strengthen_faith_desc:"潮汐向海渊，万众一心拜灵泉，信仰护主权。在村议会中推广对海祇大御神的深度崇拜。将宗教生活与日常行政紧密结合，让每位公民都意识到保卫国家即是践诺信仰。这份神圣的契约将赋予军队近乎狂热的士气，使之在绝境中亦能爆发战威。"
 
 SAN_decision_gorou_supervision:"五郎亲自督导训练"
 SAN_decision_gorou_supervision_desc:"犬影战阵先，同甘共苦抚兵心，将威震八荒。五郎大将深入基层军营，与士兵同吃同住。他那不屈的意志和赤诚的斗志是最好的榜样。在这种人格魅力的感召下，士兵们的组织度迅速回升，原本的怨言化作了对领袖的绝对效忠。将帅同心，无往不胜。"
 
 SAN_decision_fortify_watatsumi:"加固海祇防波堤"
 SAN_decision_fortify_watatsumi_desc:"磐石筑坚垒，任凭狂雷风雨袭，故土守如金。依珊瑚岩层之势，在海岸要处凿出重炮的掩体与望哨，外面覆以礁石，与崖壁一般颜色。工成之日，幕府的探子从海上望，竟看不出一处工事。有石匠拍着自家凿的洞道：「敌来了往里看，只当是山。」被围时它能藏人，反击时它能出火，这岛便是一块守得住的玉。"

# ========================== 组2：战时动员与资源开发 (10条) ==========================
 SAN_decision_mobilize_vision_users:"动员神之眼持有者"
 SAN_decision_mobilize_vision_users_desc:"一愿值千金，敢持微光逆天行，锋刃自此出。眼狩令下幸存的神之眼持有者，陆续来投，编入先锋的名单。他们各自怀着一个愿望，作战时便格外不怕死。演武那日，元素的光在滩上此起彼伏，如夏夜流萤。有持眼者对心海道：「眼若被夺，愿便没了归处。」心海道：「那么打回去，把归处抢回来。」"
 
 SAN_decision_yashiori_guerilla:"八酝山地游击演习"
 SAN_decision_yashiori_guerilla_desc:"隐身密林间，奇袭惊雷落敌阵，退若晨雾残。八酝岛的裂谷，祟气弥漫，雷雨无定，正是游击的好猎场。军中选精锐在此操演：冒祟行军，雾中合围，一击即走。天领奉行的粮道自此日日惊惶，护粮的队伍越添越多，粮却越运越少。带队的都尉笑道：「他们守的东西越多，能打的兵越少。」"
 
 SAN_decision_recruit_ronin:"招募浪人剑客"
 SAN_decision_recruit_ronin_desc:"残刀天下走，忽闻海外有归宿，浪人渡海来。眼狩令下，失主的武士流落各处，海祇的招书贴到了码头酒肆：愿来者，赐名分，给粮饷，清酒管够。渡船靠岸那日，一队浪人背着刀立在滩头，风把衣摆吹得猎猎响。接引的官按名册唱名，唱一个，应一个，声如洪钟。这些武者桀骜难驯，操练时常与教官顶撞，可白刃合战一开，冲在最前的也是他们。老军官认真看过一场，末了道：「刀没了主人，倒比有主人的时候更狠。」"
 
 SAN_decision_establish_divine_guard:"组建现人神禁卫军"
 SAN_decision_establish_divine_guard_desc:"珠光映甲胄，殿前誓作玉阶石，风波不敢动。这是从全军挑选出的最忠诚、最精锐的勇士。他们配备了渊下宫特产的抗压板甲和充能长戟。作为心海大人的亲卫力量，禁卫军的出现本身就是一种强大的政治象征，宣告着海祇核心权力的绝对武装化。"
 
 SAN_decision_hydro_tech_research:"整合白夜高压水术"
 SAN_decision_hydro_tech_research_desc:"激流斩铁甲，渊底秘术现神威，威力震九州。白夜国古籍里有一门「流体塑形」的学问，原是造园引泉用的。工匠借其理改作兵器，高压的水箭激射而出，轻型战舰的甲板竟挡不住。试演时满场人只听见一声闷响，再看，靶船已穿了洞。有武官道：「最软的东西，原来也最狠。」"
 
 SAN_decision_sea_fog_tactics:"海雾隐蔽演练"
 SAN_decision_sea_fog_tactics_desc:"雾起海藏兵，一见即是无归期，浪葬旧帆影。海祇周遭的海雾素来浓重，舰队便以雾为幕：全队静默，号灯皆灭，惟以敲击声与声呐相闻，保持阵型。演习那夜，幕府的探船闯进雾里，转了两个时辰，连自家的船尾都寻不着。海祇军自雾侧齐射，雾散时海面上只剩半截断桅。带队的都尉说：「雾是海祇的城墙。」"
 
 SAN_decision_seirai_storm_training:"清籁雷暴训练"
 SAN_decision_seirai_storm_training_desc:"清籁风雨急，练兵正要此天气，雷中疾如飞。清籁岛那狂暴的气象是天然的演兵场。在这里训练出的「雷暴骑兵」能够适应极端恶劣的电磁干扰环境。他们学会在落雷中寻找律动，利用元素脉冲加速冲锋。这种超常规的机动力，将让敌人的防线瞬间土崩瓦解。"
 
 SAN_decision_tatarasuna_restart:"重启御影炉心"
 SAN_decision_tatarasuna_restart_desc:"雷光镇深处，枫丹巧技稳祟神，炉火供万军。御影炉心重燃，风险极大。枫丹来的工程师与海祇的巫女同守炉前，一边以巧器稳住祟神核心，一边以祝词安抚祟怨。开炉那夜，炉火映红半座山，工匠们互相看了一眼，谁也没说话。自此炉水长流，军械日夜不歇，前线的刀枪，皆出自这一炉。"
 
 SAN_decision_naval_dominance:"确立海祇海洋主权"
 SAN_decision_naval_dominance_desc:"潮头立令旗，南溟从此归一览，犯者莫问归。海祇正式划定南部海域为领海，文书颁至各岛码头，渔人先看界线图，再看出海的日子。原来界内商船过境，只须报数受检，倒不误营生；若是无名战船闯入，便不必多问了。巡哨的快船自离岛一字排开，船头的巫女祝祷毕，将一捧珍珠撒进海里，算是告知大御神。老船工说：「海是人家的饭碗，如今碗沿上有了记号，心里反倒踏实。」"
 
 SAN_decision_pearl_export:"珍珠出口专卖"
 SAN_decision_pearl_export_desc:"珠光凝国脉，一斛明珠一斛铁，四海竞来沽。海祇设珍珠专营之局，采珠、验珠、定价，皆归官秤。原来私商囤珠抬价，渔村反落了空；如今官价一出，秤星定死，谁也别想上下其手。与璃月、至冬的商约签在离岛的茶屋里，签约那日，廊下堆着待运的珠匣，匣上封条盖着珊瑚印。掌局的官笑道：「从前珠子养贼，如今珠子养兵。」一语既出，满屋都静了片刻。"

# ========================== 组3：群岛整合与旧域治理 (10条) ==========================
 SAN_decision_seirai_grid:"清籁电网铺设"
 SAN_decision_seirai_grid_desc:"集电通高天，雷暴能量注工坊，工业新纪元。天云峠的雷暴从不曾歇，先前是祸，如今是财。集电的巨木立满山坡，海底电缆通到各岛，磨坊、船坞、炼金炉，一时皆用上了这份天威。老工人看着电表上的数字说：「从前怕雷，如今盼雷。」自此文薪省下了，炉火却更旺。"
 
 SAN_decision_tsurumi_radar:"鹤观雷达部署"
 SAN_decision_tsurumi_radar_desc:"雾眼自鹤观，频率探得万里远，飞鸟也留名。鹤观遗迹中的频率探测器，拆开仿制，遂成远程预警之网。雾再浓，任何来船来鸟，皆在册上留痕。值守的人夜里盯着屏上的光点，看它们游过海面，如看墨池里的游鱼。有士兵说：「鹤观雾里的眼睛，如今替咱们守夜了。」"
 
 SAN_decision_purify_delusions:"净化邪眼残余"
 SAN_decision_purify_delusions_desc:"暮色沉残甲，邪眼余毒蚀旧伤，清泉洗尘归。昔年佩邪眼者，身上多留了病根，夜半骨疼如锥。心海亲设净化之仪，巫女列班诵祝，药炉日夜不熄，一味一味地试新方。头一个治好的老兵，捧着药碗的手直抖，喝完半日才敢信疼真的退了。营中遂定例：凡邪眼旧部，药费官家全出。有人说这买卖不划算，心海道：「这些命是从刀口下捡回来的，捡回来，就得养好。」"
 
 SAN_decision_tatarigami_suppression:"崇神抑制工程"
 SAN_decision_tatarigami_suppression_desc:"潮平祭坛静，祟怨随烟归海去，渔灯夜夜明。八酝岛的祟神之气，先以古法镇之：旧镇物一一修复，祭坛重新整饬。又添新式的元素稳定装置，双管齐下。数月后，草木先绿了，荒田里有人回来插秧。绯木村的老妪在门前点起渔灯，说：「祟神睡了，人便敢点灯了。」后方既安，前方才有力气打仗。"
 
 SAN_decision_hydro_mastery_ritual:"奥罗巴斯血枝研究"
 SAN_decision_hydro_mastery_ritual_desc:"古枝藏秘力，潮汐奔流断铁甲，威名震云边。大御神遗骸上的珊瑚结晶，请下小小一枝，供于静室研读。其力近水，抚之潮生。术士依其理改水系的兵刃，改过的枪头入水无声，出水电光。试锋那日，一块铁靶应声而裂。有老水手摸着新枪道：「蛇神的一部分，如今随军出海。」"
 
 SAN_decision_new_jizhashi:"选拔新代地走官"
 SAN_decision_new_jizhashi_desc:"狭间立孤枪，一人当关万念寂，光在刃上游。复兴白夜国最严酷的战士选拔制度。这些精英在无尽黑暗中磨炼直觉，专门负责处理深渊侵蚀等极端局势。他们是国家的隐影，是藏于暗处的毒牙。当地走官的战吼再次响起，所有敢于轻视海祇的敌人都将感受到战栗。"
 
 SAN_decision_ritou_trade_zone:"离岛通商特区"
 SAN_decision_ritou_trade_zone_desc:"离岛开新埠，七国商船争靠岸，税簿日日厚。离岛一带辟为自由港，凡来贸易者，不论国别，皆依同一册税则。章程贴在埠头，商人们围看半日，各自折算。一时帆樯云集，栈房不够，便添；码头不够，便再修。有幕府的眼线混在商队里，心海也不撵，只笑道：「商路便是消息路，让人来，才知道外头想什么。」"
 
 SAN_decision_enkanomiya_hub:"建设地底工业枢纽"
 SAN_decision_enkanomiya_hub_desc:"地底藏百炉，任他地表起烽烟，炉火夜夜红。渊下宫广阔的浮岛群是完美的战备工厂区。由于不受天气与空袭影响，这里正被改造成国家最大的工业枢纽。每一台自动化机床都在二十四小时不间断地运作。地底的轰鸣声，就是海祇岛反击天理的最强有力的脉搏。"
 
 SAN_decision_phasing_experiment:"相位折叠实验"
 SAN_decision_phasing_experiment_desc:"常夜藏玄机，咫尺忽成隔世路，一步两重天。常夜灵庙里原有空间重叠的旧象，学者依其理试设跨岛传送之点。头一回试运，一只木匣入此端，半刻后自彼端浮出，匣上的茶渍犹湿，众人半日说不出话。只是十回里成败参半，偶有物件卡在「之间」，捞也不是，等也不是。心海看罢记录，只批四字：「慎用，再验。」旁人问何日可成，她道：「海雾散有它自己的时辰，急不来。」"
 
 SAN_decision_hq_expansion:"总指挥部扩建"
 SAN_decision_hq_expansion_desc:"帅帐镇渊心，千里运筹一灯下，号令无遗漏。版图既广，旧指挥部不敷用，遂于大日御舆之下扩建新署。署中设地脉通信站与战术沙盘，海、陆、空三军的动静，一时皆聚于这盏灯下。沙盘旁的墙上钉满小旗，谁也不敢错插一寸。有参谋值夜出来，看着宫外的天说：「外头睡了，这里不睡。」"

# ========================== 组4：白夜遗产与真理追寻 (10条) ==========================
 SAN_decision_break_sun_child_chains:"卸下太阳之子的枷锁"
 SAN_decision_break_sun_child_chains_desc:"玉阶生寒露，稚子长成何所似，宫墙月自照。太阳之子旧制的残余，一时尽废：名册烧了，枷具拆了，囚旧人的暗室改作学堂。追思会上，幸存的老人对着空座说了半日话，说到末了，只道：「都过去了。」心海立于一旁听着，散会时对左右道：「旧账认了，人才走得动。」渊下宫的月亮，那夜格外清亮。"
 
 SAN_decision_read_forbidden_history:"解读《日月前事》"
 SAN_decision_read_forbidden_history_desc:"禁牍启尘封，日月前事字如霜，读罢夜难眠。渊下宫图书馆最深处，那部《日月前事》终于请了出来。学者们净手焚香，逐页摹抄，原样封存，抄本另录。读的人常常读到一半便停住，望着窗外的常夜出神。原来世界起初的模样、诸神座次的来历，书里写得明白。有老学者摘下眼镜，只说了一句：「从前众人拜的是云，如今才知道，云上头还有账本。」此语连夜传回珊瑚宫，心海听完，半晌道：「账本既在，就有对账的一天。」"
 
 SAN_decision_ignite_helios:"点燃恒星之核"
 SAN_decision_ignite_helios_desc:"日沉海犹在，一炬可续万世明，薪尽火不灭。大日御舆的能源核心重燃，光过常夜，热过泉脉。其力注入重甲与旗舰，机件一时轻快了数倍。点火那夜，渊中万巷无人睡，都出来看那团白光。有白发老工望着它，半日才说：「我小时候，祖母说过它亮起来的样子，原来一模一样。」"
 
 SAN_decision_vishap_domestication:"龙蜥生物驯化"
 SAN_decision_vishap_domestication_desc:"龙非池中物，一朝俯首听人语，渊底换新天。渊底的龙蜥性烈，驯者以生物炼金之法渐次调教，先喂食，后抚鳞，再令听声辨令。成者可负千斤，可穿险地，骑之突袭，守军往往来不及列阵。有驯龙师被幼龙撞翻在地，爬起来拍拍土笑道：「它认生，慢慢来。」一时龙蜥列队于渊中校场，蔚为奇观。"
 
 SAN_decision_serpent_heart_ceremony:"举行蛇心大祭"
 SAN_decision_serpent_heart_ceremony_desc:"蛇心藏古咒，屏天听于方寸地，秘仪自幽深。蛇心之地，空间交叠，本是奇点。心海行蛇心大祭，巫女们依古仪步罡，歌声与地脉共振相合。祭成，全岛罩在一层无形的屏障之下，天上的眼望下来，只见海雾。祭毕众巫皆汗透衣衫，心海道：「往后做什么，天暂时听不见了。」"
 
 SAN_decision_reveal_forbidden_truth:"公开真实历史"
 SAN_decision_reveal_forbidden_truth_desc:"血史岂敢焚，白纸黑字还诸岛，旧账当面开。《日月前事》的抄本入各岛学塾，先生教到「白夜国」一节，教室里静得能听见海。有家长连夜来问，孩子读了会不会怕，先生道：「怕是应该的，怕过了，才记得住。」外邦的责问文书接连飞至，心海一概收下，原样存档，不发一语。诸岛的自尊却在这场风雨里立了起来，原来自家的来历不必等谁批准才作数。学塾的墙上添了一行字：史是岛民自己写的。"
 
 SAN_decision_white_night_tactics_book:"编撰白夜作战条令"
 SAN_decision_white_night_tactics_book_desc:"古卷出奇兵，庙算深处见杀机，纸上有风雷。白夜国先民对龙蜥的战录，与今时的步炮协同之理，合编成一部条令。其要旨一句：以地形分其势，以反制夺其力，不以血肉对神威。颁行之日，各队抄习，练场上按图推演。有教官合上册子道：「这一部，是给凡人预备的胜算。」众生平权，始于剑锋。"
 
 SAN_decision_abyss_armor_project:"研制深海潜航甲"
 SAN_decision_abyss_armor_project_desc:"玄铁裹残躯，渊底行来步步声，铁流不可挡。以渊下宫特产的耐压合金制甲，甲成，先令一名壮士试之。其人着甲行于练场，一步一声，声沉。摘甲后竟无伤，只道：「里头听得见自己的心跳。」此甲可令常人短时爆出魔神之力，行走险地如平地。有将佐抚甲道：「钢铁从渊里来了。」"
 
 SAN_decision_chronos_prayer:"时间之执政祈祷"
 SAN_decision_chronos_prayer_desc:"时刻统万物，常世大神佑民心，信仰志不移。常世大神卡伊洛斯的崇拜定为正仪，每逢月朔，诸岛同祷。祷文不长，末句只有八个字：「时刻既至，吾辈不迟。」士兵临阵念它，农人下田也念。有文书官问心海这话何解，她道：「信日子有定数的人，打不垮。」一时此语传遍军中，竟成了口令。"
 
 SAN_decision_abyss_mobilization:"渊下防卫动员"
 SAN_decision_abyss_mobilization_desc:"渊底闻钟响，万民披甲向黎明，星火燎荒原。渊下宫各巷设营，凡移民者皆受操练，农时做工，闲时习武。钟声一响，众人卸锄披甲，半个时辰列队完毕。有母亲送儿子入营，替他系紧甲带，说：「去，别给白夜国丢脸。」一时渊中灯火映甲，亮如星河倒悬。这里不再是工坊，是一座随时醒着的兵营。"

# ========================== 组5：现人神意志与万政合流 (10条) ==========================
 SAN_decision_orobashi_orthodoxy:"强化大蛇正统"
 SAN_decision_orobashi_orthodoxy_desc:"异像逐出境，圣火所过归纯正，一神镇八岛。肃清占领区内一切关于鸣神的崇拜痕迹。确立奥罗巴斯远吕羽氏尊为唯一的正统真神。这种单一、纯粹的宗教环境将极大降低统治成本，让整个国家的意志如同神权战锤般高度统一。异端必将被圣火净化，光荣归于海祇。"
 
 SAN_decision_clerical_admin_reform:"神职官僚整肃"
 SAN_decision_clerical_admin_reform_desc:"祭司掌案牍，教义并入公文里，令出无损耗。官吏之职定为神职，非经考核的祭司不得掌印。文书的起首是祝词，中间是政令，末尾是考成，三段一体，无人敢怠。一时衙门里墨香与香火气混在一处，倒也相安。有人问这样是否太重神权，心海道：「百姓信神，官便须比神更清白。」"
 
 SAN_decision_republic_oath:"共和宪章宣誓"
 SAN_decision_republic_oath_desc:"法冠临怒海，一诺重过千钧鼎，潮声作证盟。诸岛代表齐集珊瑚宫前，心海当众宣读宪章，读到「主权在民」一句，风正好掀起她的袖。誓毕，她将笔搁进笔架，向众人长揖，众人还礼，一时阶上阶下衣袂翻飞如潮。有老代表捧着章程的手微微发颤，说：「老朽活了六十年，头一回见掌权的人亲手给自己画圈。」此后这部宪章供在议堂，来客先看那一揖的画像，再读条文，都说画像比条文更响亮。"
 
 SAN_decision_island_parliament_session:"召开诸岛议会"
 SAN_decision_island_parliament_session_desc:"议堂开新局，众声喧处见公道，潮退自分明。鸣神、离岛、清籁与海祇的民选代表齐聚一堂，议题自航道税起，吵到渔汛，再吵到学塾。心海坐于议长之位，只听不评。散会时有人问她累不累，她道：「吵是活的声响，静的议堂才可怕。」一时四岛的代表各归各岛，来时带怨气，去时带章程。"
 
 SAN_decision_export_revolution:"输出革命意志"
 SAN_decision_export_revolution_desc:"说客渡重洋，唤醒大陆受压者，风暴此间起。心海遣说客分赴大陆各地，联络被神权压着的失意人。不递刀，只递书，书里一句话：「神非永恒，凡人的意志才是世界的主宰。」有说客回来禀道：「有人听完哭了。」心海道：「哭出来，便省得拿命去撞。」一时大陆上暗流涌动，风暴自这小岛起。"
 
 SAN_decision_industry_collectivization:"工业集体化运动"
 SAN_decision_industry_collectivization_desc:"厂矿充国库，一弹一甲皆有主，调度出奇迹。私人的厂矿一时收归国有，账册重造，产出皆入总调度。与天争命的那一战，每一颗弹、每一片甲都用在刀刃上。有厂主交契时问了句「往后呢」，登记的官吏答：「往后再说，先赢了眼前的。」一时炉火连片，产量翻了数番，账上的奇迹，是几百只手添出来的。"
 
 SAN_decision_holy_crusade_start:"发起神圣征讨"
 SAN_decision_holy_crusade_start_desc:"远征今整装，解放之名传四方，征途从此始。远征军团整装于诸岛码头，船身皆漆白色，帆上绘着蛇与珠。誓师那日，心海只送一盏灯上船，道：「照见此行，也照见所救的人。」舰队长发，去时静，来时威。有老兵在甲板上磨刀，磨了半日，说：「这一趟，是为名分去打，不只为地。」"
 
 SAN_decision_religious_tolerance:"宽容信仰宣言"
 SAN_decision_religious_tolerance_desc:"各拜各的神，同饮一亭水，心宽路自宽。正式实行政教分离，保障公民选择信仰的自由。无论是大蛇的虔信者还是鸣神的追随者，在法律面前一律平等。这种极大的宽容彻底终结了稻妻千年的宗教内耗。一个和谐共处的大时代正随着自由的风气席卷诸岛。"
 
 SAN_decision_abyss_secret_contract:"缔结深渊秘密契约"
 SAN_decision_abyss_secret_contract_desc:"密约结深渊，以暗破彼天之禁，同行亦无惧。心海默许与渊中暗处的力量暂且同行，约文极短，只三条：各取所需，互不背弃，事毕即散。左右问何苦涉险，她道：「天上的禁令不给人留门，人只好走暗处的道。」一时信物往来，是一枚黑玉与一枝珊瑚，各自收着，谁也不提。"
 
 SAN_decision_defy_the_order:"宣告逆天行道"
 SAN_decision_defy_the_order_desc:"向御座亮剑，凡人血火开坦途，天序任我疑。心海当众撕毁与天空岛的旧约，碎纸落于阶前，如白蝶乱飞。随即地脉的信号被截断，元素循环亦乱了些许。有人惊问这算不算逆天，她道：「天不曾问过人，人也未必总要问天。」一时军中相传此语，虽不敢明说，各自记得。决战自此开了头。"
 SAN_PW_Dawn_Of_Unification:"统一之晓"
 SAN_PW_Dawn_Of_Unification_desc:"天守旗降下，征服者踏城而入，晓色照列岛。御建鸣神的旗帜自天守阁落下。珊瑚宫心海以征服者的身份走进这座城，第一次不必仰望它。城门内的百姓沿着道旁跪了一街，她走得很慢，看得也很慢，粮仓、武库、学塾、牢房，一一看过。胜利带来了整片鸣神列岛，也带来了一个从未准备过的问题：接下来该怎么办。夜宿天守阁，她在旧将军的案前坐了半夜，案上还摊着没批完的旧公文。翌日清晨，她只下了一道令：各安其业，勿扰于民。然后那道最难的问题，就摆在了她自己的案头。"
 SAN_PW_Ashes_Of_Tenshukaku:"天守阁的余烬"
 SAN_PW_Ashes_Of_Tenshukaku_desc:"废墟寻旧主，太刀无主人偶冷，众说影何方。雷电将军的下落众说纷纭。有人说她战死于一心净土，有人说她被封印在梦想一心的刀鞘里。海祇军在天守阁废墟中反复搜寻，翻过焦梁塌柱三遍，只找到一把没有主人的太刀和一具仍在运转的人偶躯壳。人偶的眼还睁着，望向天守阁原先是内殿的方向，军士们抬它时都觉得它比看着沉。太刀收进锦匣，匣送珊瑚宫，心海看了一眼，命人原样封存，说：「刀是她的，不是海祇的。」废墟上后来生了一层新草，草里偶有雷光闪过，细得像针。"
 SAN_PW_Shogunate_Surrender_Edict:"幕府的降表"
 SAN_PW_Shogunate_Surrender_Edict_desc:"黄绫封降表，武家低首认新主，潮平旧梦沉。三奉行的残余联名递上降书。文书用旧式的敬语写成，通篇称珊瑚宫为僭主，却不得不承认眼狩令的失败。心海在降书上按下了现人神的印。降书以黄绫封裹送抵宫中时，封蜡上还带着九条家的纹样，看门的老兵捧着它走了一路，没敢多话。"
 SAN_PW_Dissolve_Three_Commissions:"三奉行的解散"
 SAN_PW_Dissolve_Three_Commissions_desc:"三柱次第拆，百年纲常随风散，基石换新岩。天领、勘定、社奉行，维系稻妻数百年的三根柱子被逐一拆下。九条孝行在狱中拒绝进食，柊慎介供出了勘定奉行与愚人众的全部账目，神里家则交出全部地契换取家族存续。拆柱那日没有仪式，只有簿册交接时笔尖划纸的声响，一声一声，像在给旧时代记账。"
 SAN_PW_Vision_Amnesty:"神之眼大赦"
 SAN_PW_Vision_Amnesty_desc:"珠愿暗夜鸣，万匣启封还旧主，泪落宫门轻。被收缴的神之眼堆满了天守阁的地下库房，成千上万枚玻璃珠般的愿力在黑暗中低鸣。心海下令悉数奉还，并宣布从今往后，谁也无权夺走他人的愿望。归还那日，库房外排起长队，有人捧着眼匣当场落了泪，转身对着宫门磕了三个头才走。"
 SAN_PW_Narukami_Clergy_Reform:"鸣神神职改组"
 SAN_PW_Narukami_Clergy_Reform_desc:"社鼓声渐缓，名册重誊香火续，樱下旧人稀。鸣神大社的巫女们跪在珊瑚宫军前。心海没有拆毁神社，只是把神职名册重新誊写了一遍：留下的继续奉香，不肯署名的送去离岛。名册誊完墨迹未干，社里的老巫女捧着新册看了许久，末了只说了一句：「香火换了主家，香还是这炷香。」"
 SAN_PW_Military_Occupation:"鸣神旧地军管"
 SAN_PW_Military_Occupation_desc:"军靴踏石冷，宵禁灯稀巷陌静，茶烟暗自温。海祇军开进稻妻城、神里屋敷与九条阵屋。五郎颁布临时军管令：宵禁、通行证、粮食配给。秩序维持住了，怨言也在暗处滋长。五郎每日亲自巡街，军靴踩过湿漉漉的石板路，商贩从门缝里看他，看得久了，也有人家悄悄给他递出一碗热茶。"
 SAN_PW_Provisional_Government:"稻妻城临时政府"
 SAN_PW_Provisional_Government_desc:"名单聚百川，旧吏新贤同执笔，灯下墨未干。一张由海祇旧臣、鸣神降吏与离岛商贾拼凑的临时政府名单摆在案上。没有人的名字让所有人都满意，但没有人敢拒绝。名单定稿那夜，誊写的小吏换了三支笔，写完吹了吹墨，低声说这一页纸，往后是要进史书的。"
 SAN_PW_Fatui_Hunt:"愚人众清剿"
 SAN_PW_Fatui_Hunt_desc:"暗巢次第破，北国余党无处遁，雪落签押房。愚人众在稻妻经营多年的据点被逐一起获：邪眼工厂、北国银行分行、离岛的走私码头。第八席女士已死，第六席散兵携雷神之心不知所踪。查抄的清单装订成册，厚得能当枕头，末页特意空着一行，留给散兵与那颗下落不明的心之核。"
 SAN_PW_Kamisato_Accord:"神里家的契约"
 SAN_PW_Kamisato_Accord_desc:"折扇半开合，茶烟深处定存亡，礼数未曾失。神里绫人前来谈判，姿态无可挑剔。他提出以神里家在海祇岛的全部产业换取家族的存续与社奉行的名号。心海签了字，绫人离开时，袖中折扇半开未开。折扇终于合上时，他回头望了一眼宫门，那一眼里有佩服，也有算不清的账。"
 SAN_PW_Kujou_Militia_Absorb:"九条军整编"
 SAN_PW_Kujou_Militia_Absorb_desc:"旧旗付祠堂，蓝白新帜迎风立，弓声犹未老。九条裟罗带着残部前来归降。她要求保留九条家的军旗，心海没有答应，却给了她一面新的：海祇军的蓝白旗，旗下仍是那支百战的弓手。裟罗把新旗叠得方方正正贴身收好，旧旗她讨了回去，说要挂在九条家的祠堂里，逢年上去添一炷香。"
 SAN_PW_Economic_Reconstruction:"战后经济纲领"
 SAN_PW_Economic_Reconstruction_desc:"炉冷账目残，窟窿深似海难填，珠玉亦汗颜。御影炉心停摆、踏鞴砂废弃、离岛封锁，稻妻的经济在眼狩令的岁月里已经烂透。心海摊开海祇岛的账本，发现连九十万年的赋税也不够填这个窟窿。账房连夜重新核算，烛芯剪了一次又一次，天亮时报出来的数目，让满屋子人都沉默了。"
 SAN_PW_Tatarasuna_Reclaim:"踏鞴砂接收"
 SAN_PW_Tatarasuna_Reclaim_desc:"双艺合炉火，青钢一出惊四座，旧法遇新知。踏鞴砂的炉火重新点燃。海祇的工程师带来了白夜国的冶炼法，与当地的雷电五传技艺相撞，火星四溅。泽维尔在废墟里翻找着愚人众的旧图纸。两派手艺头一回合炉，出的第一炉钢色偏青，老师傅们围着看了半晌，都说没见过，又都说好。"
 SAN_PW_Ritou_Open_Port:"离岛开港"
 SAN_PW_Ritou_Open_Port_desc:"桅樯连岸起，梆声吆喝市声还，潮送万国船。离岛封锁令解除。来自璃月、蒙德、须弥的商船重新靠岸，桅杆挤满了港口。勘定奉行留下的关税旧制被推翻，取而代之的是一纸薄薄的通商章程。头一班外船靠岸时，码头上挤满看热闹的人，梆子声、吆喝声、算盘声混作一处，久违的市气回来了。"
 SAN_PW_Delusion_Seal:"邪眼工厂封存"
 SAN_PW_Delusion_Seal_desc:"海水灌熔炉，禁忌锁入深渊底，符印亲手加。邪眼工厂的熔炉被灌入海水，铁水遇水的那一声巨响，十里外都听见了，此后厂房里再没有火。那批以寿命为代价的禁忌之物被锁进渊下宫的最深处，连同制造它们的图纸，图纸烧样与实件分藏两处，各配一把钥匙，钥匙沉在不同的海沟。心海在封印上亲手加了一道大御神的符，加完在封印前立了一炷香的工夫。有军士问她为何亲自来，她说：「能救人的东西我造不出来，能害人的东西，至少要亲手埋。」"
 SAN_PW_The_Crossroads:"前路的抉择"
 SAN_PW_The_Crossroads_desc:"神座灯未熄，三份草案案上摊，落笔即千年。稻妻城已静。心海独自坐在现人神的神座上，面前摊着三份截然不同的国策草案，一份写神，一份写民，一份写刀。烛火把三个封皮照得一样亮，她看的顺序却来回换。她知道无论选哪一份，被写进这一页的都将是她自己，与整个列岛此后千年的走向。侍女进来添过一次烛，退出去时听见极轻的一声，不知是研墨还是叹气。天将明时，她把三份草案并排摆正，伸手按在其中一份上，按住的手很稳，只有袖口的褶皱泄露了一夜的疲惫。"
 SAN_PW_A_Apotheosis:"心海的神格化"
 SAN_PW_A_Apotheosis_desc:"珠冠换金纱，人间权柄归神座，一人作万神。现人神巫女加冕为「御建大御神」，海祇的信仰第一次与稻妻的权柄合一。加冕那日，珊瑚宫七里的海岸都站满了人，香烟把半座岛罩住了。心海摘下珍珠冠，换上渊下神宫的金色面纱，面纱垂落的那一刻，万民山呼，海面无风自行。从此她不再只是巫女，她是稻妻唯一的神。侍立的近侍后来说，那日礼成，她独自在殿里坐了很久，殿外的欢呼一浪一浪传进来，她像没听见似的。面纱底下是什么神色，从此再没有人知道。"
 SAN_PW_A_Orobashi_State_Church:"大御神国教"
 SAN_PW_A_Orobashi_State_Church_desc:"蛇骨卧殿深，敕令一下万民听，珍珠代雷鸣。《御神敕令》颁行天下：大御神为稻妻唯一真神，鸣神信仰贬作旧俗。鸣神大社的神像连夜覆上黑布，取下来的那一刻，老巫女们垂首立在海阶下，没有一个敢出声。取而代之的，是蛇与珍珠的徽记，新徽记铸得极精，珠光在香火里一明一灭。各村的牌位换了，神龛里的供品换了，连孩童开口学的第一句祷词也换了。有不肯换的人家，把旧符压在灶板底下，夜里悄悄拜，拜完又慌忙收起来。神职们说，香火会自己认路，旧的神走了，新的神便住进来。稻妻的天空下，雷鸣渐稀，珠光渐盛。"
 SAN_PW_A_Inquisition_Office:"异端审判所"
 SAN_PW_A_Inquisition_Office_desc:"旧库改刑房，符纸换印蛇形冷，巫女先受审。审判所设在天守阁的旧军械库，刀架还没拆尽，便先挂上了刑具。第一批被押进来的是替鸣神传道的巫女，她们的手上还带着香灰的味道。判决书由神谕代笔，落款处只有一枚蛇形印，不见人名。审讯从不高声，屋子里终年燃着一种安神的香，被审的人话说着说着就乱了时序。有人熬过去了，有人没熬过去，熬过去的出来后都不再提屋里的光景。库房外墙上原刻着武运长久四字，如今被人用凿子铲平了，只余四个浅坑。"
 SAN_PW_A_Confessors_Network:"忏悔网络"
 SAN_PW_A_Confessors_Network_desc:"村村设听罪，怨言顺链归神座，祷声不敢高。每一个村落都设一名听罪的神职，听罪册每月一送，顺着珍珠链传回珊瑚宫。每一句对神权的怨言都会记在册上，轻重分等，等与罚相连。稻妻开始学会在祈祷时压低声音，学会把牢骚化成祷词，把不平跪进香灰里。邻里间也生了新的规矩，听罪师进门，主人家奉茶的话都斟酌三分。倒也不全是怕，有些人当真心事重，找听罪师说得痛快了，回去倒睡得香。只是册子照旧要记，痛快也入册。"
 SAN_PW_A_Purge_Narukami_Shrines:"鸣神神社清洗"
 SAN_PW_A_Purge_Narukami_Shrines_desc:"樱落御柱倒，社门一封香火断，留话与风听。影向山上的鸣神大社被封，御建鸣神的御柱被推倒，石料拆去修筑海祇军港。三百年的鸟居拆下来，木料还带着香的余味，军港的桩基里便嵌着这些木头，渔人说打桩那天，海面上落了一层樱瓣，不知从哪里来的。八重宫司在封社前夜失踪，只留下一片樱花与一句「你会后悔的」。这话在神职间传了好些年，起初人人斥为妖言，后来渐渐没人提了。没人提，不等于没人记得。"
 SAN_PW_A_Divine_Cabinet:"神谕内阁"
 SAN_PW_A_Divine_Cabinet_desc:"七人代神言，珠盘问卜定国是，无人敢抬眸。内阁不再由凡人组成，而由七名代神言者执掌，人称七珠。议事时珠盘居中，议定与否以卜为准，可谁都明白，真正的决断只在神座一侧。他们自称能听见大御神的声音，却没有一个敢直视心海的眼睛。有回议漕运，一位代神言者说得急了，声音大起来，满堂便都看他，他自己的脸先白了，半晌才补一句，说方才是神意激切。散班时各人的轿子抬得比往日都轻，谁也不愿在宫道上多留一刻。"
 SAN_PW_A_Priest_Officer_Corps:"神职军官团"
 SAN_PW_A_Priest_Officer_Corps_desc:"符咒压刀鞘，战死入祀有神阶，军中一半僧。海祇军的军官同时受神职册封，升一级军阶，便进一阶神品，两本册子写的是同一个人。他们作战时带着符咒与佩刀，符咒缝在臂甲内侧，佩刀出鞘前先朝神座方向一举。战死后按神职规格入祀，牌位立在阵亡将士祠的东首，香火不绝。军队成了教会，教会成了军队，操练场上口令与诵经声此起彼伏，新兵分不清哪一句是军令哪一句是祝词，索性都当作军令听。有老兵说这样也好，打起仗来心里稳，神和刀都在身上。"
 SAN_PW_A_Theocratic_Administration:"神权行政"
 SAN_PW_A_Theocratic_Administration_desc:"香火绕宫墙，官阶出自社坛上，政令带香光。地方官吏从此由神社推举，考绩以虔诚为先，政绩为次。文书上行下行，都要先在坛前过一遍香，再盖印。稻妻的行政体系脱离了世俗，沿着香火与教阶重新生长：村有社祝，郡有宫司，国有一人。有才干的人开始往庙里跑，有野心的也是。官服的纹样改成了珍珠串，衙门里终日烟霭不散，判案的先生开口前必先合掌。有人说这样慢，有人说这样稳，说慢的人低声，说稳的人高声。"
 SAN_PW_A_Sun_Child_Doctrine:"太阳之子教义"
 SAN_PW_A_Sun_Child_Doctrine_desc:"古卷出深渊，白夜献祭太阳子，旧序作薪柴。渊下宫的古籍被重新译出，里头记着白夜国的旧典：曾以太阳之子为神献。心海读罢命人重立此典，只是这一次，献上的是旧世界的秩序。旧律书、旧钱范、旧历本，一车一车运进渊下宫，在常夜里的火光中焚尽。观礼的神职说，火光映在龙骨上，像白夜国眨了一下眼。有人问她为何要承一个献祭的名目，她道：「旧世界自己把自己献上了，众人不过替它点火。」"
 SAN_PW_A_Enkanomiya_Reverence:"渊下神宫崇拜"
 SAN_PW_A_Enkanomiya_Reverence_desc:"常夜开一角，日光初照白夜国，火种渡北方。渊下宫的常夜被凿开一角，阳光头一回照进白夜国的废墟，积了不知多少年的海水在光里泛出金色。神宫祭司们捧着大日御舆的火种北上，一路换舟换轿，火种不熄。抵达鸣神旧地那日，把火安进新起的神宫，深海的威严自此在山间也有了座。供品是深海珊瑚与夜光螺，香是特制的海藻香，闻着像退潮后的滩涂。北地的老人们起初怕这火，后来看惯了，说这火白天淡夜里亮，倒像个人守夜。"
 SAN_PW_A_Serpent_Throne:"大蛇之座"
 SAN_PW_A_Serpent_Throne_desc:"神座倚巨骨，海风不语阶前拜，威仪自天成。新的神殿在珊瑚宫岛的最高处落成，供奉着奥罗巴斯的巨骨。心海在神座上坐定，宣布大蛇的意志由她继承，也由她独断。落成那日海风正紧，巨骨上的旧纹在日光下清清楚楚，观礼的人跪满了台阶，没有一个人抬头。"
 SAN_PW_A_Holy_War_Doctrine:"圣战教义"
 SAN_PW_A_Holy_War_Doctrine_desc:"刀锋指四海，荣光当及于异邦，珠埋万顷沙。国教颁下敕令：大御神的荣光当及于四海。稻妻的刀不再只为守护，也为传教，欲将海祇的珠光铺满每一片异邦的沙岸。教义里写得明白：不信者非敌，是未醒者，唤醒他们，是神的恩典。舰队出征前先在坛前受祷，帆上绘着蛇与珠的徽记。有军士问随军神职，若异邦人不肯受教怎么办，神职答：「那就让他们先见一见神的怒。」问的人不再问。海风把祷词吹进船舱，从此稻妻的远征，船舱里都供着一尊小小的珠神。"
 SAN_PW_A_Sakoku_Reissue:"新锁国令"
 SAN_PW_A_Sakoku_Reissue_desc:"港门重重闭，外商只许离岛住，锈痕锁国界。新的锁国令比幕府的更彻底：外商集中于离岛一地，传教者一律驱逐，逐的时候连行李都要过香案查验。稻妻的港口重新长出锈迹，神国的边界就此封死。离岛成了天下，外邦的商人在方寸之地做四方生意，本地人看着他们，像看一群被圈住的鸟。有洋商托人递话，愿以三倍的价买通航路，话递到坛上便没了下文，只听说那递话的人被听罪师请去喝了茶。港口的铁链一环加一环，锈是一层压一层。"
 SAN_PW_A_Divine_Guard_Expansion:"御神亲卫"
 SAN_PW_A_Divine_Guard_Expansion_desc:"孤雏入禁庭，刀锋亦作锁链用，只拜一神明。御神亲卫从海祇的孤儿中挑选，自幼受神职训练，晨起练刀，夜里诵经，名字都从玉牒上抹去，只留编号。他们只认现人神一人，饷银、婚配、身后事，一概由神宫料理。他们是神国的刀锋，也是神座最忠诚的锁链。有个亲卫在值夜时被问及家乡，他想了半日，答：「珊瑚宫的灯，就是家乡。」问的人不敢再问。这些孩子对神座的爱是真的，也正因为是真的，才最沉。"
 SAN_PW_A_Miko_Mobilization:"巫女总动员"
 SAN_PW_A_Miko_Mobilization_desc:"祝装换新蓝，旧祠祝者成新使，歌声换宫调。全体巫女被编入神职序列，战时征召、平时传道，名册造得比兵籍还细。无数曾为鸣神奉香的少女换上蓝色祝装，为新的神唱起新的歌。老祝词的调子改不了，便改词，词里的大御神替代了旧名，唱的人自己有时也唱串，串了便重来，重来时脸上没什么，心里的事只有各人知道。也有真心欢喜的，说神座近了，参拜的多了，月钱也涨了。一颗心一个念头，千颗心便是千种滋味，都往那身蓝祝装底下收着。"
 SAN_PW_A_Tithe_Economy:"神田经济"
 SAN_PW_A_Tithe_Economy_desc:"田归神社管，两成先入神库去，剩八自己争。土地归神社所有，农人成为神田的佃户。收成的一成归心海，一成归教会，剩下的才留给自己。契书是统一印的，末行小字：田乃神赐，耕乃神许。国库充盈，田地沉默。秋收时神库开仓，粮船一队接一队，佃户们交完粮，在田埂上坐半晌，看看自家的仓，仓里的粮比去年薄。有佃户把新米先盛一碗供在龛前，供的是哪路神，他不说，也不必说，米香是一样的。"
 SAN_PW_A_Blood_Pearl_Trade:"血珍珠贸易"
 SAN_PW_A_Blood_Pearl_Trade_desc:"珠价连番涨，采珠人骨沉海底，箱里尽摩拉。海祇的珍珠产业被收归神宫专营，价格连翻数倍。采珠的行船照旧出海，命却比从前更贱了，深水一口气，上来是珠，上不来是人。远嫁的渔船带回成箱的摩拉，也带回海民们被榨干的骨血。账房里珠光与银光交映，账房的墙外，渔妇们守着滩头等船，等的船十艘里有三艘回不全人。神宫的账册做得极干净，一页一页都是进项，人的名字只在另一本册子上，那本不给人看。"
 SAN_PW_A_Faith_Industry:"神社工业"
 SAN_PW_A_Faith_Industry_desc:"晨祷进厂房，机声与磬声相和，轰鸣藏异音。工厂由神社出资、神职监工，工人清晨上工前先向大御神祷祝，祷毕上工，一炷香算一班。产能上去了，工人们却开始在机器的轰鸣里听见别的声音，有人说是海，有人说是旧神，监工说是错觉，罚了说的人两炷香。车间的墙角都供着小龛，龛里珠串底下压着各人偷偷放的东西，有亡父的牌位，有女儿的乳名帖。神职看见了也不揭，只把珠串扶正。机器照转，香照烧，稻妻的工业就这样一半在册子上，一半在龛底下。"
 SAN_PW_A_Immortal_Mikado_Cult:"现人神不灭论"
 SAN_PW_A_Immortal_Mikado_Cult_desc:"画像悬官署，眉目低垂不老人，生死莫再论。神学会议连议七日，得出结论：现人神乃永恒之身，死生二字不属凡人所能议论。心海的画像自此挂进每一间官署，画师描了三个月，描出来的人不老不倦，眼中有珠光。各署画像的框子都是统一规格，香案齐平，晨昏各一炷。有人私下问，画像若是旧了怎么办，答曰旧了重绘，神不旧。又有人问，若神变了呢，问的人自己先住了口。自此官署里再无人提岁数，贺帖上也不写千秋，写永在。"
 SAN_PW_A_Divine_Justice_Courts:"神断法院"
 SAN_PW_A_Divine_Justice_Courts_desc:"珠落定生死，律条束之高阁久，神意即刑名。司法不再依律，是依神谕。法官以掷珠卜问定罪，珠分三色，落盘的声响便是判词，判决书上行文凛然，只字不提律条。旧的大典被搬进库房，架上落了灰。稻妻的律法就此退化成神的脾气，而神的脾气，谁也说不得。有讼师想凭律条争辩，堂上便添一项罪名，叫疑神。自此打官司的人只带银钱与香烛，不带状纸，状纸上的字再恳切，抵不过一颗珠子的声音。"
 SAN_PW_A_Celestial_Tribute:"天理贡赋"
 SAN_PW_A_Celestial_Tribute_desc:"贡船北上天，珠雷晶石随人往，跪在站直前。心海向天空岛献上第一份贡赋：珍珠、雷晶与一名自愿的白夜后裔。贡船启航那天，码头清了场，只有神职送行。有神职问她为何要向天理低头，她只答：「在能站直之前，先学会跪。」这话记在册上，后来传得广，各人听出各人的味道。那位白夜后裔上船前回望了一眼珊瑚宫，神职们说他神色平静，也有人说看见了泪。贡船的影在天边小下去，心海在坛前站到日落，谁也不知道她在想什么。"
 SAN_PW_A_Sea_Serpent_Navy:"海蛇舰队"
 SAN_PW_A_Sea_Serpent_Navy_desc:"蛇首探海波，甲板钟声伴诵经，一神镇一洋。以白夜科技重造的舰队在离岛列阵，船首雕着蛇首，漆作深蓝，出海时蛇眼上贴金箔，远看像活物睁眼。甲板上是随军传道的神职，晨钟与诵经一起响，炮手装弹的号子也按祝词的韵脚来。鸣神的海域，从此只有一个神的名字。有水手夜里梦见旧神，醒来不敢说，只把船头御灯的芯换了一遍。舰队的规矩也新：船名不叫什么号，全叫什么宫，一船一宫，宫宫有神龛，神龛朝着珊瑚宫的方向。"
 SAN_PW_A_Scourge_The_Unbelievers:"犁庭扫穴"
 SAN_PW_A_Scourge_The_Unbelievers_desc:"挨门换符纸，或跪或悬两般样，村口绳最冷。不肯改信的村落被逐一清查。神职带着军士挨家挨户撕下鸣神的符纸，换上大御神的珠串，撕下来的旧符当天集中焚化，灰烬倒入海，说是让海神看着，一粒也不留。有人照做，有人被吊在村口。吊人不避人，正午吊上去，日落才放下，放下是死是活，看各人的造化。邻村的人远远看着，回家便把自家的旧符寻出来，学着那村的样，自己先换了。清查的册子一年厚过一年，墨迹里透着一股说不出的味道。"
 SAN_PW_A_Holy_Crusade_North:"北征圣战"
 SAN_PW_A_Holy_Crusade_North_desc:"敕令出岛链，北望列岛非旧界，足迹作边疆。国教的敕令指向了稻妻之外的列岛：至冬的使节被驱逐，璃月的商船被扣。神国的边界不再以海为限，而由信徒的足迹决定，走多远，神国便有多大。北征的先遣队不带重炮，带的是石桩，桩上刻着大御神的名号，登一岛，便立一桩。军报与教报同纸印发，前半页是战况，后半页是祝词。有将官私下嘀咕，说这样打下去粮草吃紧，话传到坛上，下个月的军令里便添了一句：神赐的疆土，不问粮草。"
 SAN_PW_A_Sand_Hidden_Conscription:"沙隐征兵"
 SAN_PW_A_Sand_Hidden_Conscription_desc:"献身为名募，青壮一去渔村空，晒网无人收。神国以献身为名募兵，不叫征兵，叫请圣役。青壮年成批离开渔村，走的那日全村送到滩头，锣鼓齐鸣，回来的人数却没人敢问。海祇的沙滩上晒着网，却再没有一张能被拉起的，网眼里的沙被风吹得干干净净。村里的祭典照旧办，只是跳舞的、抬轿的、敲锣的，都换成了老人与孩子。有位老渔妇每月初一去社里问儿子的消息，社祝翻册子给她看，册子上是官样的字，她不识字，只认得那一行有个她家的姓，便磕头谢神。"
 SAN_PW_A_Kagura_Perpetual_Rite:"神乐永祭"
 SAN_PW_A_Kagura_Perpetual_Rite_desc:"神乐连宵舞，一夜到明不肯歇，阶下人不知。心海下令每年举行一次不下坛的神乐大祭，昼夜不歇，以现人神之身亲舞至天明。铃、扇、帛条，一式一样都有定制，乐师换了三班，舞者只有一人。岛民跪伏在阶下，只看得见袖影翻飞，无人知道舞者的膝盖已经青紫。祭毕回宫，侍女替她卸妆，见脚踝肿得穿不进鞋，都红了眼圈，她只摆手说：「祭是为民的，疼是自己的，两不相欠。」翌日照旧理政，批阅的朱笔比往日都重。"
 SAN_PW_A_Ascend_To_Divinity:"登神之仪"
 SAN_PW_A_Ascend_To_Divinity_desc:"禁术入国典，凡骨将褪作神身，落印夜未眠。渊下宫的禁术被写进国典：现人神将褪去凡骨，成为真正的神明。典文念完，满殿寂静，连烛火都不敢晃。心海在仪式前夜独自坐了很久，案上摊着诏书，朱砂研好了，她蘸了又搁下，搁下又蘸，最终在诏书上落了印。落印的声音很轻，像一滴水掉进海里。侍女在廊下守了一夜，只听见殿里翻书的声音，翻的不是典章，是白夜国的旧档，一页一页，翻到天亮。"
 SAN_PW_A_Eternal_Shinkoku:"永恒神国"
 SAN_PW_A_Eternal_Shinkoku_desc:"神诏颁永续，一城一岛一声令，珠光笼稻妻。神国宣告永续，国史自当日起另起一纪，纪元以神座为计。稻妻全境只有一个声音，那声音来自珊瑚宫的神座，传下去是各级宫司，再传下去是各村社祝，最后落到每一户的祷词里。心海成了她曾反抗过的那种存在，只是更年轻，更温柔，也因此更难以被推翻。史官在册子上写完这一笔，搁笔看了许久，末了在页脚添了一行小字：温柔原是最深的锁。"
 SAN_PW_B_Constitutional_Convention:"制宪会议"
 SAN_PW_B_Constitutional_Convention_desc:"五岛聚一堂，珠冠置于案心处，贵贱同坐次。珊瑚宫、鸣神、离岛、清籁、鹤观，各岛代表第一次不分贵贱地坐在同一间厅堂里。清籁代表坐前把鞋底蹭了又蹭，怕海祇的地毯金贵。心海把象征现人神权威的珠冠放在桌心，说：「这一顶，今天起归诸位议决。」满堂静了半晌，才有第一个代表伸手去碰那顶珠冠，碰了一下又缩回来，第二下才捧起来。厅堂外候着的老书记说，他供职四十年，头一回看见神座上的东西被搁在桌心上议。"
 SAN_PW_B_Island_Parliament:"诸岛议会"
 SAN_PW_B_Island_Parliament_desc:"席次按岛分，吵罢航道吵渔税，议长只须听。议会按岛屿而非按门第分配席位，大岛三席，小岛一席，谁也不多占。会上吵得最凶的往往是两个岛为争一条航道的税收，拍桌子是常事，拍完各自喝水，接着吵。心海坐在议长席上，第一次只需听，不必断。散会后她常在廊下多站一会儿，听代表们三三两两还在争，说她听，说吵得好看。有书记不解，她道：「人人敢吵，才有得听；鸦雀无声的议会，才是要坏的。」"
 SAN_PW_B_Freedom_Of_Worship_Act:"信仰自由法"
 SAN_PW_B_Freedom_Of_Worship_Act_desc:"两神共一龛，巫女神官同洗手，香火各随缘。大御神与鸣神并祀于同一座神社，巫女与宫司共用一个洗手亭，亭里的水勺换了双份，各自用各自的，用完归位。有人觉得这是亵渎，更多人只是终于松了口气。社里的香案分左右，左案御札，右案神签，参拜的人自己挑，也有两处都拜的，拜完自己都笑。老宫司起初闭门不出，后来悄悄来看了一回，看年轻人们跪东又跪西，末了叹一句：「神明们若和气，人便少受苦。」此话被人听见，传遍了半座城。"
 SAN_PW_B_Vision_Bearer_Citizenship:"神之眼公民权"
 SAN_PW_B_Vision_Bearer_Citizenship_desc:"眼主同民权，愿力不得作征用，条文了旧影。法案规定：持有神之眼者与常人同权，不得因其愿力而受歧视或征用。条文议了三轮，眼主代表与常人代表同席而议，谁也不让谁，末了还是逐字逐句磨出来的。一纸条文，结束了眼狩令留下的最后一点阴影。公布的当夜，有眼主在自家窗前点亮一盏灯，亮了一夜，没人问为什么，看见的人都懂。登记册上自愿登记者远比预计的多，登记的官吏问一位老眼主为何要登，他说：「从前藏着，是怕人夺；如今登着，是告诉人，这是我的。」"
 SAN_PW_B_Republican_Guard:"共和卫队"
 SAN_PW_B_Republican_Guard_desc:"誓词对宪法，五郎首任读誓文，神名念得轻。卫队宣誓效忠的是宪法，而非任何一位巫女或将军。誓词刻在铜板上，立在卫队门厅，进门先过铜板，再佩枪。五郎作为首任总长宣读誓词时，刻意把现人神三个字念得又快又轻，念完自己先笑了一下，队列里便也有人绷不住。卫队的饷银由议会直发，不经军中之手，账目季度一公示。有新兵问班长，若有一天议会错了怎么办，班长想了想，说：「宪法比议会大，先护小民，再论对错。」这话后来进了新兵的第一课。"
 SAN_PW_B_Sangonomiya_Charter:"珊瑚宫宪章"
 SAN_PW_B_Sangonomiya_Charter_desc:"宪章书海图，自治议政司法立，宫名落款处。全岛联盟的第一部宪章写在一张海图上，海图是老的，图上五岛的位置描了又描。条文只三条：岛屿自治、议会至上、司法独立。珊瑚宫的名字只出现在落款处，像一位退居幕后的母亲。宪章原件供在议会大厅，玻璃匣子里，来客尽可先看图再读文，图上的航线标着旧名，文里改了新名，对照着看的人，常在这新旧之间站上许久。有学者说，这张图早晚要换，图换了，文不改，稻妻便一直有底。"
 SAN_PW_B_Free_Port_Ritou:"离岛自由港"
 SAN_PW_B_Free_Port_Ritou_desc:"税卡尽拆除，七国船来如赶集，旧吏直摇头。离岛不再属于任何一家奉行，是向七国开放的自由港。关税低得让勘定奉行的旧吏看了直摇头，商船却排到了三个月之后。码头昼夜不停卸货，栈桥加了三道，夜里灯火通明，卖宵夜的挑子从街头排到街尾。旧吏起初冷眼看新法，后来被聘去管货栈，管着管着也服了，说税虽轻，货量大，库银反而厚了。有蒙德商人感慨：「在别处过三层关卡，在这里过一道秤，秤还准。」"
 SAN_PW_B_Merchant_Republic:"商贾共和国"
 SAN_PW_B_Merchant_Republic_desc:"商会入议席，珠盐雷晶通七国，账本胜神谕。离岛的商会进了议会，珍珠、海盐与雷晶的贸易线铺向全提瓦特。议席上除了旧家与岛代表，多了绸衫的商人，议政时不引经据典，只报账目。有人说这已是商人治国，心海却在账本上看到了比神谕更实在的东西，她说：「神谕劝人向善，账目逼人向善，后一样更快。」商会代表们听得直乐。不过账房之外，稻妻的渔村与田舍照旧过自己的日子，只是集市上多了七国的物产，货栈里多了七国的口音。"
 SAN_PW_B_Pan_Teyvat_Embassy:"七国使节"
 SAN_PW_B_Pan_Teyvat_Embassy_desc:"使节陆续来，璃月蒙德与须弥，掌心向天开。璃月的礼部、蒙德的骑士团、须弥的教令院，使节们陆续登陆离岛。稻妻几百年来第一次主动向外界伸出手，掌心朝上。迎使的仪程是新拟的，不长不短，既不全学旧幕府的繁缛，也不全照异邦的简单。璃月使节带来一船丝绸与茶，蒙德骑士带来一桶果酒，须弥学者带来一箱书，三样都收，回礼是珍珠与漆器。使节们私下说，这个国度的人礼数生疏，心意却齐整。有位老使节离港时回望，说稻妻像一只刚出壳的鸟，翅膀还湿着，已经急着要看天了。"
 SAN_PW_B_Trade_League_Membership:"万国商会"
 SAN_PW_B_Trade_League_Membership_desc:"商印通七国，珍珠贴上通行记，锁门尽卸下。稻妻加入了跨国的商会与航运同盟，海祇的珍珠贴上了七国通行的印记，印记是一枚小小的海螺纹。锁国的门被彻底卸下，那扇门上的锁太大，卸下来用了六个人，锈屑落了满地。海风灌满了整个内阁，阁里的窗从此不再关严。入会同盟那日，商会设宴，旧吏与商人同桌，起初各自矜持，三巡过后便互相请教起账目来。同盟的年册上，稻妻那一页印着一句话：门开之后，风大，日子暖。"
 SAN_PW_B_Public_Schools:"公学普及"
 SAN_PW_B_Public_Schools_desc:"一岛一公学，读写算学与乡音，开蒙第一句。每个岛设一座公学，教读写、算学与诸岛的语言。老师多是从海祇军营退下来的老兵，黑板是船板改的，粉笔用贝壳灰压的。黑板上的第一句是「人不因神而生」。有学生问先生，这句话是什么意思，老兵想了想，说：「意思是，你生下来，就值数。」孩子们似懂非懂，各自记下了。公学还教记账与写家信，家长们起初嫌占田里的工，后来见孩子能把家中账目理清，便都催着自家娃早些去。岛上的公所门口，如今多了孩子代写书信的小摊，一封信两个铜贝。"
 SAN_PW_B_University_Of_Byakuyako:"白夜国大学"
 SAN_PW_B_University_Of_Byakuyako_desc:"藏书出深渊，神明降格作课题，凡人成作者。渊下宫的藏书被搬上一座新修的学府，搬书上来的那几日，栈桥上络绎不绝，书用油布包着，一本一本清点。学者们开始系统整理白夜国的文明史，把神明降格为课题，把凡人抬升为作者。开讲第一课，讲的是白夜国的农具，不讲龙骨，先讲犁。学生们有渔家子，也有旧家后裔，同堂听课，考卷同题。有老学究担心这样亵渎，校长答：「把神当学问研究，神若有灵，应当高兴，终于有人认真读祂了。」"
 SAN_PW_B_Judicial_Reform:"司法改革"
 SAN_PW_B_Judicial_Reform_desc:"法官出考选，两套旧例并一典，神意条款删。法官不再由神职任命，是考选产生，考三门：旧例、情理、文书，考卷糊名。法典用了海祇与鸣神两套旧例，删去其中所有以神意为名的条款，删下来的条目单放一册，存档不许毁。有老讼师翻新法典看了一夜，末了说：「从前打官司先问神，如今先问理，理在纸上，神在纸上，人也在纸上。」堂上添了一面木牌，写着听得两造言，新法官上任先向这牌子一揖。"
 SAN_PW_B_Press_Freedom:"报业自由"
 SAN_PW_B_Press_Freedom_desc:"报馆开离岛，头条尽录贪墨账，批语四字宽。离岛出现了第一份报纸，头条是「三奉行贪墨账目全录」，编辑们以为要出事，报印出来手都是抖的。心海读完后只批了四个字：让他们写。此后报上的题目越来越野，议会的议程、渔价的涨落、哪位官员家的厨子偷懒，什么都登。有人登门告报纸的状，说报上说他家的瓜不甜，心海笑答：「瓜甜不甜，他说了不算，你说了也不算，买瓜的人说了算。」后来报纸添了副刊，连载稻妻的新话本，订户翻了三倍。"
 SAN_PW_B_Industrial_Civil_Program:"民用工业计划"
 SAN_PW_B_Industrial_Civil_Program_desc:"炉火转向民，犁网布匹出流水，军工让灶台。踏鞴砂的炉火转向民用，农具、渔具、布料从流水线上滚下来。军工厂的产能第一次让给了犁与网。新犁比旧犁轻三斤，深耕一寸，农户们排着队来提，提货的单子用复写纸一式三份，谁也做不了假。布坊出的靛蓝布结实又便宜，渔家女买了做头巾，成了时兴样式。有老军工看着自家炉里出了口锅，感慨道：「打了半辈子仗，头一回觉得这炉火暖和。」产单的末页印着一行小字：能护人的，不止是刀。"
 SAN_PW_B_Land_Reform:"土地改革"
 SAN_PW_B_Land_Reform_desc:"神田归耕者，地契重新丈过遍，票箱胜雄辩。神田与奉行庄园被分给耕者，地契重新丈量，量地的绳子淋了桐油，雨天也能量。旧贵族在议会里激烈反对，投票的结果却毫无悬念。分到田的老佃户捧着新地契看了半日，不识字，只认得自家名字与红印，便往怀里揣，揣了又拿出来看，来回了七八趟。有人夜里睡不实，把地契塞在枕头底下，压了一夜，早上照旧下田，只是走得快了些。荒了几年的山田，当年秋天便有人上去了。"
 SAN_PW_B_Welfare_Institutes:"济贫义仓"
 SAN_PW_B_Welfare_Institutes_desc:"义仓设村口，账目悬门任人看，头一遭开诚。战后残破的渔村设起济贫院与义仓，济贫院收孤老，义仓平粮价，仓门上的账目公开挂在门口，谁都能去看，这在稻妻是头一遭。账是复写的，一笔在册，一笔在墙，对不上便要查管仓人的责。起初管仓的觉得受拘束，日子久了反倒轻省，说账目干净，夜里睡得稳。济贫院里冬有炭夏有蒲扇，孤老们凑在一起晒太阳，说如今这院里的人，比自家的儿孙来得勤。有外乡人来看了账，回去也照办了一座，义仓的样式便这样传了开。"
 SAN_PW_B_Universal_Conscription_Law:"普遍兵役法"
 SAN_PW_B_Universal_Conscription_Law_desc:"征书到各岛，服役期满即归乡，军民一纸隔。兵役不再由贵族垄断，也不再由神职垄断。每个岛每年按人口抽调，抽签用竹签，签筒当众摇，服役期满即归乡，军与民之间隔着的只剩一纸征书。征书上印着服役的年头、饷银的数目、抚恤的章程，条条写得实在。有母亲送子入营，临走塞给他一包晒干的昆布，说军中的盐太重。服役的人归来，村口设一桌酒，喝完便算接风，之后该打渔打渔，该种田种田，谁也不再提他扛过枪。这种淡，倒成了新法的好处。"
 SAN_PW_B_Island_Militia:"诸岛民兵"
 SAN_PW_B_Island_Militia_desc:"各岛旗各异，宣誓只对议席拜，枪在灶台边。每座岛都有自己的民兵，旗帜各不相同，鹤观的旗上有雾纹，清籁的旗绣着雷纹，宣誓对象都是议会而非某位神。稻妻的武力第一次真正散落在民间的灶台边。民兵农忙时耕田，农闲时操练，枪锁在公所，钥匙三家共管。有议会议员担心这样兵权分散，心海只回一句：「枪在民手，民便不惧官，不惧官，才敢讲理。」后来诸岛太平，这话被刻在了公所的门楣上。"
 SAN_PW_B_Coastal_Defense_League:"海防同盟"
 SAN_PW_B_Coastal_Defense_League_desc:"灯塔一线牵，民兵共守一湾水，指挥归议席。诸岛的民兵结成海防同盟，共享港口与灯塔，灯油由各岛按摊派凑，账目月月一结。五郎把指挥权交给了一个议会委员会，自己只当军事顾问。有人替他不平，说有功之臣反退了位，五郎只笑：「打仗时听号令，太平年听章程，两样都是守岛。」演练那日，各岛旗号在海上排开，令旗一举，炮位齐转，议会的视察员在瞭望塔上看得直点头。散了操，民兵回各家灶台吃饭，枪却擦得一样亮。"
 SAN_PW_B_Kamisato_Conciliation:"神里和解"
 SAN_PW_B_Kamisato_Conciliation_desc:"旧家入新序，绫人执掌社奉行，绫华执礼节。神里绫人在议会中取得了社奉行的重整名分，绫华出任礼宾使节，兄妹二人一个治内，一个迎外。旧家在共和的秩序里找到了位置，代价是交出最后一点特权。神里家的宅子开放了半进作公用茶室，来客不问出身，登记便可入内。绫华第一次以使节身份接待蒙德来客时，行的是新礼，客人们反倒不安，她笑说：「礼是人定的，客气是心生的，两样都在。」旧家仆从看着自家小姐，眼里有得意，也有说不清的怅然。"
 SAN_PW_B_Kujou_Amnesty:"九条特赦"
 SAN_PW_B_Kujou_Amnesty_desc:"特赦令一下，除却首恶皆免罪，一躬低过昔。议会定了特赦令，被俘的幕府军士除首恶外一律免罪，免罪的军士愿归乡者发路费，愿留营者编入工兵。九条裟罗在议会前深鞠一躬，那一躬弯得比在将军面前更低。有人问为何，她说：「从前是身份使然，如今是心里服气。」放归的军士出营那日，门口设了一桌清水与饭团，人人过桌吃一口再走，说是压惊，也说是从今往后，两军是一家了。有个老军士吃完又折回来，把饭团的叶子叠好还了桌上，才肯走。"
 SAN_PW_B_Hiiragi_Trial:"柊家公审"
 SAN_PW_B_Hiiragi_Trial_desc:"账册连载久，堂上问得庭下静，不血亦诛心。勘定奉行柊慎介的贪墨案公开审理，账册在报上连载了整整两个月，识字的念给不识字的听，街头巷尾都在数他家的宅子。审判没有流血，却比任何一次行刑都更彻底地羞辱了旧贵。宣判那日，柊慎介自己合了账目，说了句「数目不差」，堂下竟有人叹他到底是行家。判罚抄没家产，本人贬为庶人。散堂后看审的人不肯走，都说没见过这样的审法，不杀一人，胜过杀人千百。"
 SAN_PW_B_Reconciliation_With_The_Shogunate:"与幕府和解"
 SAN_PW_B_Reconciliation_With_The_Shogunate_desc:"旧君入史册，功过并录不讳言，过去入档存。议会追认雷电将军为稻妻史上的一位统治者，承认其功绩，也记录其过失，功在一列，过在一列，不粉饰，不抹杀。共和不否认过去，只是把它收进了档案馆。档案开放后，来抄录的人排了长队，有学者，也有当年被眼狩令牵连的家属，抄完在门口站一站，才走。天守阁旧址立了一方无字碑，碑前允许任何信仰的人上香。有老兵每月初一去碑前坐一坐，坐完对人说：「她也是被那个位子绑住的。」"
 SAN_PW_B_Vision_Declaration_Of_Rights:"权利宣言"
 SAN_PW_B_Vision_Declaration_Of_Rights_desc:"宣言立两神，愿力信仰与居所，皆不可侵夺。宣言开篇写道：凡生于稻妻者，其愿力、其信仰、其居所皆不可侵夺。抄本贴在每一座公所的墙上，识字的读给不识字的听。海祇与鸣神的神像并立在宣言两侧，谁都没有高过谁。有老妇听读完毕，问这宣言是谁写的，读的人说是议会，她点头：「难怪，句句是人话。」宣言后来印成小册子，塞进公学的课本里，孩子们背不出来也记得住。岛上人家糊墙，有人舍不得用这册子，说要留着给孩子认字，认的正是自家的权利。"
 SAN_PW_B_Multi_Island_Referendum:"诸岛公投"
 SAN_PW_B_Multi_Island_Referendum_desc:"一票一张纸，鹤清两岛票最紧，呼吸皆屏住。诸岛就是否加入共和国举行公投。投票那日，各岛的票箱由本岛长者看着抬上船，押运的是两岛各派一人，谁也不放心谁，路上倒处成了朋友。鹤观与清籁的票数接近得让所有人屏住了呼吸，唱票的书记唱到最后一箱，声音都变了调，最终以微弱多数过半。落选的一方便开始议论下一届再投，话里没有怨气，倒像商量下回赶集。心海说：「愿意再投一次的人，才是真心投过的人。」"
 SAN_PW_B_Teyvat_Concord:"提瓦特协约"
 SAN_PW_B_Teyvat_Concord_desc:"七国同订约，互不相侵犯通商，落款无神衔。稻妻与七国缔结协约，互不侵犯、通商互助。谈判谈了半年，条文的字斟句酌，连海域二字算不算领海都要议。心海在协约上签字时的头衔只写着「珊瑚宫心海」，没有神，也没有将军。对方使节看了一眼，问她要不要补衔，她道：「签的是我这个人，衔是借来的，借来的不作数。」协约的抄本挂在离岛港务厅，往来船员都看得见。有老船主说：「从前出海怕炮，如今出海怕风，这就好。」"
 SAN_PW_B_Eternal_Republic:"永恒共和"
 SAN_PW_B_Eternal_Republic_desc:"钟声日日报，卸却神名作议长，国还于万民。共和国立宪十载，议会的钟声每天都在离岛响起，晨钟报开工，午钟报议事，暮钟报散会。心海卸下了现人神的名分，只作一名普通的议长，议长袍是藏青的，旧神袍叠进箱底，箱上落了封条。稻妻第一次不属于神，而属于稻妻人自己。有百姓进京上访，直呼议长之名，门官要斥，被她拦下：「现在叫名字，是合规的。」那人从袖里掏出一双亲手纳的鞋垫，说给议长垫脚，她收了，第二天议席底下多了那双鞋垫。"
 SAN_PW_C_Inherit_The_Bakufu:"承继幕府"
 SAN_PW_C_Inherit_The_Bakufu_desc:"旧吏捧名册，跪求莫废两百年，推倒易重建难。三奉行的旧吏抱着名册跪在珊瑚宫前，请求新的主人不要废掉这套两百年的规矩，名册从阶下一直排到阶上，厚厚的十几摞。心海翻着那本厚册子，忽然明白了一件事：推倒幕府容易，可稻妻终归要一个幕府。她收了名册，让旧吏们各自归位，只换了自己人掌印。旧吏们谢恩起来，退出去的步子比来时齐整。后来有人问那日她翻册子翻出了什么，近侍说，大人在某一页停了很久，那一页记的正是当年下令围海祇岛的那一位。"
 SAN_PW_C_Narukami_Continuity_Act:"鸣神延续法"
 SAN_PW_C_Narukami_Continuity_Act_desc:"神名照旧用，神位依然坐新人，御柱漆重刷。法案宣布：御建鸣神之名不改，神位照旧，只是坐在上面的人换了姓。神社的香火未断，御柱的漆重新刷过一遍，颜色与从前一模一样，连漆里掺的金粉分量都照了旧方。参拜的人照旧来拜，拜的时候眼神有些躲，拜完又都如常。有位老参拜客在社里坐了一下午，问小巫女，如今拜的是从前那位吗，小巫女答是，又答不是，自己先乱了。老人拍拍她的手：「拜的是心里的，不怕。」"
 SAN_PW_C_Shogunal_Regency:"将军摄政"
 SAN_PW_C_Shogunal_Regency_desc:"自号称摄政，不称将军不称神，旧印不轻盖。心海自号摄政，不称将军、不称神。她坐在天守阁原属于将军的位置上，桌上摆着旧将军的印，却从不盖它。有司建议把旧印收进库房，她摆手：「留着，看它一眼，便记得这把椅子是怎么来的。」批文的印是她新刻的，刻的是摄政二字，字口极深。深夜理政，烛花爆了一声，她抬头看一眼那方旧印，再看一眼窗外，天守阁下灯火次第，是她自己的城了。看多久，值夜的人不知道，只知道烛换了三根。"
 SAN_PW_C_Bureaucratic_Restoration:"官僚复兴"
 SAN_PW_C_Bureaucratic_Restoration_desc:"三衙换新匾，兵部度支与礼曹，九成旧面孔。被解散的三奉行以新的名目重建：天领改称兵部、勘定改称度支、社奉行改称礼曹。牌匾换了，掌事的人九成没换，连值房的座位都还是旧的，只是椅背上换了新漆。换匾那日各家衙门口都放了鞭炮，看热闹的多，看懂的少。有书吏私下对镜整了整帽子，说了一句：「帽子还是那顶，戴的人换了个说法。」新名目上报的公文简洁了许多，办起事来，照旧一步一步走老路。"
 SAN_PW_C_Codex_Of_Order:"秩序法典"
 SAN_PW_C_Codex_Of_Order_desc:"千二百条目，条条以秩序为纲，不问信何神。新法典共一千二百条，句句以秩序为纲，抄写的书吏手抄了三个月，抄到后头越来越快，因为句子越来越像。它不问你信什么神，只管你听不听话。稻妻第一次有了一部比神谕更管用的东西。法典颁行那日，各城门口设了诵读台，念的是选段，选的都是罚则。有乡老听完问，这法典是谁定的，差役答是摄政定的，乡老点头：「神的话还讲个缘法，这话一点缘法不讲，倒好记。」"
 SAN_PW_C_Secret_Police:"秘密警察"
 SAN_PW_C_Secret_Police_desc:"黑衣带黑册，行踪不留档案里，名单只写疑。御建缉查成立，着黑衣，带黑册，行踪不留档案。他们的名单上不写罪名，只写可疑，而被写进去的人，往往再没出来过。缉查的人从不解释，被问急了只答一句：「册子上没你的事。」这句话安了不少人的心，也吓了不少人的胆，因为没人见过那册子。市井里生出许多自保的讲究，客人来家里，茶只沏半盏，话只说三分。缉查司的屋檐下，终年晾着几把黑伞，晴也晾，雨也晾。"
 SAN_PW_C_Censorate:"监察百司"
 SAN_PW_C_Censorate_desc:"司官查百僚，直通天听权最重，旧账追到今。监察司专查官吏贪墨与结党，权柄直通天听，各衙门的门口都多了一面鼓，鼓响即查。第一个被带走的是重建度支的老吏，他的账目二十年没出过差错，只是当年签过一纸效忠鸣神的公文。带走他的差役客气得很，茶都没让他喝完。此后各衙门的公文越写越短，能推的事便推，能不签的名便不签。监察司自己的门上倒不设鼓，有人问缘故，司里的人答：「查人的门，不设让人查的鼓。」"
 SAN_PW_C_Total_Registration:"户籍大编"
 SAN_PW_C_Total_Registration_desc:"编户人一牌，籍贯职业并神籍，无名无处藏。全岛重新编户，每人一牌，牌上写籍贯、职业与神籍，牌是小木牌，出门要带，夜里查户要对。从此稻妻没有一个无名之人，也没有一个能藏起来的人。造册那几月，各村的公所灯火彻夜，写坏的笔一大把。牌子发了，有人用布包了才揣，有人挂在腰上叮当作响。有个哑巴老头不会说籍贯，村长替他写了打鱼为生居此四十年一行字，他看完那行字，对村长比了半天的手势，没人看得懂，都猜是道谢。"
 SAN_PW_C_Sakoku_Reinforced:"强化锁国"
 SAN_PW_C_Sakoku_Reinforced_desc:"禁令严前朝，外商不登传教杀，边界似淬铁。锁国令比幕府时代更严：外商不得登岸，传教者格杀，出海的渔船需领照，照费不低。稻妻的边界像一块重新淬火的铁，硬，且冷。码头上的外邦船一年比一年少，最后只剩一条卖煤的，隔月来一趟，人不上岸，货用驳船接。有胆大的走私船夜里贴着礁走，十艘里沉三艘，海图上那些礁石的名字，渔家都记得。城门口的告示换了三次，字越来越简，简到最后只剩一句：不许。"
 SAN_PW_C_Coast_Blockade:"海岸封锁"
 SAN_PW_C_Coast_Blockade_desc:"舰队锁岛链，无牌之船尽拦检，渔村忆封海。巡防舰队沿岛链布防，任何未经许可的船只一律拦检，拦检的章程贴在码头，纸上的字比潮水还密。海祇的贸易传统被一纸禁令掐断，渔村的老人们想起了旧幕府的封海令，说前朝的海禁，如今换了个名字又回来了。渔船出海要领照，照上写明水域与时辰，回来晚了先问话。有个老渔夫把祖上传的航海图塞进灶膛，烧完说：「留着也是罪。」码头上的巡船添到十艘，桅顶的灯夜里照着海面，海面越来越静。"
 SAN_PW_C_Military_Modernization:"军制近代化"
 SAN_PW_C_Military_Modernization_desc:"旧编制照收，弓换弩机刀配铳，旗色不曾改。旧幕府军的编制被整体接收，再以白夜科技翻新：弓手换弩机，太刀配铳，军旗仍是那面御建鸣神。换装那日，老兵们摸着新弩机看了又看，说这物件比弓省力，也比弓远心。操典改了三稿，旧套路的口令留下了一半，新的一半念着拗口，士卒们私下把拗口的都编成了顺口溜。军旗换旗面的提议提过两次，都驳了回来，理由只有一句：旗是旧的，人是新的，正好。"
 SAN_PW_C_Samurai_Corps:"御建武士团"
 SAN_PW_C_Samurai_Corps_desc:"旧武授新田，效忠摄政非神社，恨未深过饿。被收编的旧武士组成「御建武士团」，授田授俸，效忠摄政而非神社。他们恨海祇，却更恨没有主君的日子。授田的名册上，各人的家纹都注在旁边，两百年的旧家纹，如今写在官册里。武士团晨操用旧礼，见礼还是幕府那一套，只是喊的效忠词换了字。有个老武士领了田，回去把田头的水修得极好，问他为何这样上心，他说：「俸是活的，田是死的，死的东西不会变卦。」这话在团里传开，成了半句歇后语，后半句谁也不说。"
 SAN_PW_C_Divine_Right_Of_Order:"秩序神授"
 SAN_PW_C_Divine_Right_Of_Order_desc:"国学编新说，二神同源司秩序，缝得倒严实。国学家为摄政编出一套新说：大御神与鸣神本是同源，皆司秩序。两家的典籍翻了个遍，从字缝里找出七处相合的影子，凑成一篇宏文。神学上的缝合怪，政治上却严丝合缝。学官们奉命宣讲，讲稿统一，讲到同源二字时，有老学究在底下摇头，摇了两下，自己停了。新编的神谱画成图，两尊神并立，底下加了一个执笔的小人，小人是谁，图上不注，看的人都明白。"
 SAN_PW_C_State_Shinto:"国家神道"
 SAN_PW_C_State_Shinto_desc:"二神合新社，编制俸禄皆划一，神成了一册。大御神与鸣神合祀于新设的御建神社，全国神职统一编制、统一俸禄、统一口径，俸册厚厚一本，谁在哪一级写得明明白白。神从信仰变成了编制。神社的账与衙门的账用同一个格式，祝词的稿纸是官发的，连香灰怎么扫都有定式。有老神职领俸那日捏着官票看了半晌，说：「从前神养人，如今官养神。」说的人被记了一笔，罚俸一月，罚单的格式，也是官发的。"
 SAN_PW_C_Puppet_Clergy:"御用神职"
 SAN_PW_C_Puppet_Clergy_desc:"神职官来任，讲道词由礼曹定，祝词落新名。神职由官府任命，讲道词由礼曹审定，审定的稿子念顺了口，庙里的老祝词反倒生疏了。巫女们念的还是那几句祝词，只是祝词的落款换成了摄政的名字。有个小巫女念串了一次，把旧名念了出来，满殿静了一瞬，她自家先白了脸。老宫祝在旁轻轻接了下去，把那一句圆了过去。散了祭，老宫祝对她说：「改朝换代改字，不改心，你心里记得旧名，念出来便是罪，收在肚子里罢。」小巫女从此念得极稳。"
 SAN_PW_C_Balanced_Economy:"经世经济"
 SAN_PW_C_Balanced_Economy_desc:"度支掌物价，盐铁官营拢一掌，稳处便是死。度支衙门推行经世之策：平准物价，官营盐铁，抑制豪商。米布的价格每月张榜，涨跌不得逾一成，违了价的铺子先警告，再罚银。稻妻的市场被拢在国家掌心，稳则稳矣，却也死了。集市上再没有抢购，也再没有俏货，商人们凑钱开小炉灶，卖官营铺子里买不到的零碎。有位老商人看着平准榜叹气：「价钱不跳，人心不活，生意做成了差事。」度支的老吏在册边批了四个字：稳，即是好。"
 SAN_PW_C_Zaibatsu_Charter:"财阀特许"
 SAN_PW_C_Zaibatsu_Charter_desc:"商号得专营，珠晶军械皆垄断，库银怨气齐。几家与摄政关系密切的商号取得专营特许，垄断珍珠、雷晶与军械，特许的状书盖着摄政的新印，各家供在正堂。国库的进项涨了，民间的怨气也涨了。小商人另寻活路，卖私盐的、贩私珠的多了，缉查的名册上添了许多行。有家特许商号把分号开到了渔村，村里人看着那块金字招牌，先是绕着走，后来要买什么还得进去，进去便不再看那块牌子，只看柜台后头的人。牌子是官家的光，人是吃饭的手，两层东西在一间屋里，谁也不看谁。"
 SAN_PW_C_Rice_Standard:"米本位制"
 SAN_PW_C_Rice_Standard_desc:"纸币锚于米，物价曲线终平稳，商船却不来。度支衙门以米为锚发行纸币，压制战后飞涨的物价，米价每旬一报，纸币的印数与官仓的米对得上账。米价的曲线终于平了，可离岛的商船也不再靠岸。外商算不过这笔账：米定的价，换不出利。市面上的东西倒是便宜了，就是种类少了，绸、香、药，一年比一年难寻。度支的老吏们自己心里也有一本账，只是册子上不许写。有家人办喜事想买二两外来香料，跑遍全城，末了用自家一小匹布换了来，布还比香料新。"
 SAN_PW_C_Isolation_Doctrine:"孤立教义"
 SAN_PW_C_Isolation_Doctrine_desc:"外务三不许，不结不涉不通婚，列岛自成一体。摄政颁布外交总纲：稻妻不结盟、不干涉、不通婚。列岛之外的一切纷争与稻妻无关，稻妻之内的一切也不许外邦置喙。外务衙门裁到只剩一间屋，识外文的通事被遣散了大半，留下两个，专司拆信与不回信。异邦的婚书递来，照例退回，退回的文书都一个格式。有年轻人问为何不能娶外邦女子，老吏答：「不是不许情分，是不许口子。」口子一开便是从这说起的，谁也讲不全，只记得这句话。"
 SAN_PW_C_Non_Aligned_Bloc:"不结盟圈"
 SAN_PW_C_Non_Aligned_Bloc_desc:"小岛结一围，不投至冬不附璃月，圈内皆唯喏。稻妻联合周边小岛组成不结盟圈，既不投靠至冬，也不依附璃月。盟约短得只有一页，各岛画押，画押的墨都是当场研的。圈内的岛主们对摄政唯唯诺诺，只因别无选择。年例聚议设在离岛，议事的名目是联防与互市，实议的顺序永远先是摄政的训示。有位小岛的岛主酒后吐真言，说这圈像一圈礁石，看着各自立着，底下连着。次日他便告病回岛，再没来过聚议。"
 SAN_PW_C_Fortress_Inazuma:"要塞稻妻"
 SAN_PW_C_Fortress_Inazuma_desc:"炮台连瞭望，海湾布下雷网密，居民似守军。全岛链开始修筑炮台与瞭望塔，重要的海湾布下雷网，雷网的位置连渔船都要背熟，背不熟的港不许出。稻妻被改造成一座巨大的要塞，只是这座要塞里住着的人也开始觉得自己像守军。夜里灯火有数，窗户有数，连晾衣的绳都有数。有个孩子在炮台下放风筝，被收了风筝，还记了一笔，他娘去讨，差役说不是罚，是登个记。她回来跟邻里学舌，学完自己先笑了，笑完又收住。要塞是防外的，可住着住着，防的是里外都说不清的什么。"
 SAN_PW_C_North_Defense_Line:"北境防线"
 SAN_PW_C_North_Defense_Line_desc:"防线布北上，哨所灯燃彻夜明，不知防何物。针对北方的至冬与深渊，稻妻在离岛至鹤观一线布下防线，哨所一座连一座，间距都按弩机的射程算。哨所的灯彻夜不熄，灯油由内地专供。哨兵不知道自己在防备什么，只知道不准闭眼。鹤观的雾重，哨兵值完一班，眉毛上都是水珠。有个哨兵在日志上只写无事二字，写了三年，换了新哨兵，日志接着写，字迹换了，二字没换。军中的人说起北线，语气里都有点敬，也有点说不出的空。"
 SAN_PW_C_Fatui_Accord:"至冬协定"
 SAN_PW_C_Fatui_Accord_desc:"密约签离岛，旧账不追势力许，纸不留两国。与至冬的秘密协定在离岛签订：稻妻不追查愚人众旧账，至冬默认稻妻的势力范围。签字的屋子事先清了三遍，纸写完当场烧毁，双方都没有把纸带回国，存档的只有各自代表的记忆。可密约总要有人办事，办的事便露了形：愚人众的商行照开，税照缴，只是账上换了名目。有知情的老吏在日记里写了一句：「不追旧账，不是账没了，是账搬了家。」这页日记后来被人撕去，撕痕很整齐。"
 SAN_PW_C_Abyss_Containment:"深渊遏制"
 SAN_PW_C_Abyss_Containment_desc:"常夜重封死，遗迹列为禁地严，力在不敢取。渊下宫的常夜被重新封死，封门用了三层：石、符、兵，各配一份名册。白夜国的遗迹列为禁区，界桩钉进崖壁，猎户误入，出来便要过三堂问话。摄政深知那片黑暗能给她力量，却更清楚那力量从不属于任何活人。守门的军士轮换最勤，饷银最厚，却无人久留，有个守了三年的老军士退伍时说了一句：「门那边夜里会响，像有人在数数。」此后守门的名册上，自愿续期的越来越少。"
 SAN_PW_C_Vigilance_State:"警戒国家"
 SAN_PW_C_Vigilance_State_desc:"三司合成网，昼夜运转不息时，无敌亦需敌。缉查、监察、编户三司合流，稻妻成为一台昼夜运转的警戒机器，三司的册子每月互勘，一处对不上，三处都查。它没有敌人，却要有个敌人才肯运转。年报里的疑案一栏年年有数，数不大，可从来不空。衙门里的人私下都有一种手艺：把平常的事写出可疑的样子，又把可疑的事写得平常。有位致仕的老吏临走对继任说：「这台机器怕的不是敌，是静，静下来它就要找事。」继任者当时不懂，后来懂了。"
 SAN_PW_C_Eternal_Regency:"永恒摄政"
 SAN_PW_C_Eternal_Regency_desc:"摄政无任期，秩序需我一日便掌一日，此日无期。摄政之位不再设任期。心海宣布，为着稻妻的秩序，她将继续掌权，直到这秩序不再倚她。而这一天，显然永远不会来。颁布的文书用词极谦，谦得滴水不漏，末句却是铁的。有人私下数，从前反抗将军时说过的话，与今日这篇文书对不上几处，数完的人把纸烧了。天守阁的日程表上，摄政的栏里写着每日二字，没有止期，像一张填不完的账。她自己屋里倒是干净，案头只摆着一本没写完的兵书。"
 SAN_PW_C_Succession_Law:"摄政继统法"
 SAN_PW_C_Succession_Law_desc:"摄政定世袭，嫡系承位神谕认，巫女作将军。继统法规定：摄政之位由珊瑚宫嫡系世袭，须经御建神社神谕认可。条文颁下，海祇的巫女，成了御建幕府的世袭将军。世袭的名目古已有之，可写在战事方歇的文书里，字句都显得别扭。法条里最细的一处是认可仪程：神谕如何问，如何答，答错一字便重来。有史官抄录此法，抄到末行停笔良久，末行写着此法永不变更。他把永字描粗了一笔，像是不甘心，又像是认了命。"
 SAN_PW_C_Neo_Bakufu:"新幕府"
 SAN_PW_C_Neo_Bakufu_desc:"废墟起新幕，紫旗换作蓝白色，石阶晒老人。新的幕府在旧幕府的废墟上落成，形制、仪轨、官阶一一照旧，只有旗色从紫改成了蓝。当年的反抗者成了幕府，而稻妻人发现，日子和从前没什么两样。旗色换了，官服换了，唯有武家屋敷前的石阶还是旧的，老人坐在阶上晒太阳，眯着眼看新兵换岗。"

 SAN_PW.20000.t:"一统晓光临"
 SAN_PW.20000.desc:"旗影落城头，潮声初入王居夜，月照新阶冷。一时天守阁上那面御建鸣神的大旗，是辰时落下来的，落得极慢，旗角擦着砖缝，一点声音也没有。珊瑚宫心海以征服者的身份走进这座城，头一回不必仰望它。她升堂时只着一身素服，珍珠冠也未曾戴，左右请她换吉服，她道：「今日不比寻常，且素着罢。」五郎按刀立在石阶下，看着士卒把倒伏的旗幡一捆捆抬走。有老臣捧着旧历书在廊下候了半日，通传的兵叫他先放下，他不肯，抱着书坐在阶前，坐到日暮，又抱着回去。城下町的夜市那晚不曾开，卖团子的婆子收了摊，低声道：「改朝换代的日子，不敢吆喝，明日照旧。」月上来了，她在阶上立了一回，望见海上一星渔火，才转身入殿去。"
 SAN_PW.20000.a:"重整山河"
 SAN_PW.20000.b:"先安军心"
 SAN_PW.20001.t:"天守阁余烬"
 SAN_PW.20001.desc:"雷云散复聚，无主太刀卧尘埃，人偶泪未干。原来雷电将军的下落，城中众说纷纭：有说她战殁于一心净土的，也有说她被封在梦想一心的刀鞘里，再不曾出来。海祇军在天守阁废墟里前后翻了三日，连梁上的灰都筛过一遍，只翻出一柄太刀、一具兀自运转的人偶躯壳。那刀通体完好，刀柄上偏没有半分握过的汗渍，带队的军士捧刀复命，一路不敢回头，只觉背后有人立着，立得极近。人偶送进珊瑚宫库房锁了，看守的老兵说，夜里打廊下过，听见里头极轻地说了一句梦话。他据实呈报，上官批了四个字：「继续看守。」自此那间库房的灯，夜夜点着，再不曾熄过。灯影落在刀匣上，一夜一夜，极安静。后来有史官来问下落，守库的只答四个字，仍在看守。"
 SAN_PW.20001.a:"讣告天下"
 SAN_PW.20001.b:"秘不发丧"
 SAN_PW.20002.t:"幕府降表至"
 SAN_PW.20002.desc:"降表叠素笺，僭主二字犹未改，印落潮声平。三奉行的残部联名递了降书来，通篇用旧式敬语，字字端正，嘴上仍唤珊瑚宫作僭主，笔下却不得不认了眼狩令的败局。递书的老吏在阶下跪了半日，膝头压着文书，纸角叫冷汗洇得发软。心海展卷看了，因对左右笑道：「字是好字，气也是旧气。」看毕按了现人神的印，又吩咐将降书照原样存档，一字不改。老吏领了回执，走到宫门口忽回头问：「僭主二字，当真不必避讳？」当值的巫女答：「大人说过，史册上如何写，由不得胜者删改。」老吏拜了三拜，起身时眼圈已是红的，抱着回执去了，背影在春寒里显得极瘦。红纸也是心海吩咐衬的。那卷降书至今仍在档中，僭主二字衬着红纸，无人动得。"
 SAN_PW.20002.a:"纳其降表"
 SAN_PW.20002.b:"穷究战罪"
 SAN_PW.20003.t:"三奉行散衙"
 SAN_PW.20003.desc:"三柱次第倾，狱中人瘦信笺厚，地契换残灯。天领、勘定、社奉行三衙，原是撑着稻妻数百年的三根柱子，如今被逐一拆了下来。九条孝行在狱中绝食，狱卒每日只把一碗清水搁在槛外，搁了七日，又原样收回七日。柊慎介熬到后半夜还在供账，笔尖戳破了三回纸，问案的军官换了三班，他的口供不曾换过一字。神里家交地契那一日，绫人亲自押车，箱上封条还是旧年社奉行的花押，撕开时脆响一声，倒像有什么东西断在里头了。押车的家臣回头望了一眼，绫人未曾回头，只将折扇收拢了些，道：「回去把老宅的地契补齐。」那碗清水，后来撤了。狱中的九条孝行不知怎么听见了这一句，隔日便开始进食，送饭的狱卒说，他吃得极慢，极认真。"
 SAN_PW.20003.a:"尽废其制"
 SAN_PW.20003.b:"留其名目"
 SAN_PW.20004.t:"神之眼赦令"
 SAN_PW.20004.desc:"万珠暗自鸣，库门开处光如雨，愿望各归人。收缴的神之眼堆满天守阁地库，成千上万枚玻璃珠似的愿力在黑暗里低鸣，听久了叫人心里发空。心海下令悉数奉还，且立了话：自今而后，谁也无权夺走他人的愿望。发还那日库前排队，盲眼的老妇由孙儿搀着，双手捧回自己年幼时的眼，贴在额上半晌方收进怀里。有个士卒领了自家那枚，转身挂在旧日行刑的木桩上，说：「叫它替死人看看天。」书记写得手酸，两砚墨见了底。散场后库房空了，满地极淡的光尘，仆役扫了三遍，扫帚过处犹自微微发亮，索性把扫帚也供在了库门口，说是沾了愿气的物件，不敢轻慢。愿力这东西，原是碰不得亏心的。那把扫帚后来真有人祭拜，巫女们说，敬物即是敬愿，不必禁。"
 SAN_PW.20004.a:"即刻奉还"
 SAN_PW.20004.b:"登记发还"
 SAN_PW.20005.t:"鸣神神职易"
 SAN_PW.20005.desc:"樱下旧香冷，名册重誊墨未干，去留各无言。鸣神大社的巫女们跪在珊瑚宫军前，心海并不拆社，只把神职名册重新誊了一遍：愿留的照旧奉香，不肯署名的，送去离岛安置。誊册那夜珊瑚宫的灯点到三更。肯画押的落笔极稳，偏是几个平日诵经最响的，笔悬在纸上迟迟不落。不肯署名的人次日清早登船去离岛，船离岸时，山上隐隐传来晚课的钟声，满船人无一回头。留下的照旧洒扫，惟供桌上多了一串新珠，与旧的并排搁着，彼此不碰。有位老参拜者上山看见了，低声道：「这样也好。」说罢拜了三拜，一拜给旧神，一拜给新令，末一拜给自己，拜完便下山去了。只是旧珠的颜色，一日深似一日。山上的钟声与海上的潮声，从此各响各的，倒也相安无事。"
 SAN_PW.20005.a:"善待神职"
 SAN_PW.20005.b:"别立新社"
 SAN_PW.20006.t:"鸣神军管记"
 SAN_PW.20006.desc:"宵禁柝声长，通行证上墨痕新，怨语落井底。海祇军开进稻妻城、神里屋敷与九条阵屋，五郎颁了临时军管令：宵禁、通行证、粮食配给，一条一条写得清楚。头一夜城下町静得听见更漏，第二夜便有人家窗缝里漏出灯光来，巡夜的看见了，只作不曾看见。配给按户头发，米袋上盖着海祇的印，有主妇掂了掂，与邻家道：「比幕府那会子还准了半升。」怨言自然也有，都落在井台边、浣衣石上。兵士听得见，也只作听不见，五郎早吩咐过：「耳朵要尖，刀要在鞘里，一句不许多问。」秩序既保住了，暗处的怨气，也只得容它慢慢散，散一日，便少一日。宵禁的柝声，也一日比一日迟了。后来果然无一处生变，五郎在旬报上写了四个字，民可载舟。"
 SAN_PW.20006.a:"严行军管"
 SAN_PW.20006.b:"宽严相济"
 SAN_PW.20007.t:"稻妻城行辕"
 SAN_PW.20007.desc:"名单墨几改，旧吏新商同一案，无人敢辞官。一张由海祇旧臣、鸣神降吏与离岛商贾拼凑的临时政府名单呈到案上，前后改了五稿，头一稿的名字叫朱笔圈得最密。没有一个人的名字叫人人满意，偏又没有一个人敢推辞。有个离岛商人被点了名，连夜递帖来辞，帖子还没递进去，他家码头的货已照价收清了。他捏着银子想了半宿，天一亮改口说愿效劳。议事的厅堂新扫过，椅子高低不齐，众人各自掖好袍角，都不先开口，直等海祇的主事者举杯，杯底一碰案，这衙门才算开了张。散时有人低声道：「好个不情不愿的开衙，倒比敲锣打鼓的实在。」宴席上那杯酒，他喝得最慢。那商人后来把漕运办得出色，有人问他当日为何要辞，他只笑了笑，一句也不答。"
 SAN_PW.20007.a:"海祇主导"
 SAN_PW.20007.b:"多方共治"
 SAN_PW.20008.t:"清剿愚人众"
 SAN_PW.20008.desc:"炉冷银行闭，码头加锁夜查仓，冬使悄退去。愚人众在稻妻经营多年的据点被逐一起获：邪眼工厂、北国银行分行、离岛的走私码头，一处不落。第八席女士已死，第六席散兵携着雷神之心，不知所踪。查封仓库时守库的早散了，只留一炉未烧尽的信，写的多是至冬口音的家常，问母亲的腿疾，问孩子的乳名。军士不敢私拆，整袋呈上。心海翻了几页，便吩咐封存，道：「罪恶归罪恶，家书还人家。」北国银行金库开时只有一只空匣，匣底压一张字条，画个歪斜的笑脸。管库的也呈了上来，心海看罢一笑：「收好，往后用得着。」左右不解，她也不解释。那张笑脸的字条，进了密档。散兵的下落成了悬案，海风一起，哨所的人便格外留心桅上的旗。"
 SAN_PW.20008.a:"四下搜捕"
 SAN_PW.20008.b:"持此要挟至冬"
 SAN_PW.20009.t:"神里家之约"
 SAN_PW.20009.desc:"折扇掩眉目，产业换来旧名存，一诺重千钧。神里绫人前来谈判，姿态无可挑剔，提出以神里家在海祇岛的全部产业，换家族存续与社奉行的名号。心海签了字。谈罢正事，绫人留下一盒绯樱饼作谢仪，盒面樱纹朝下放着，懂礼的一看便知是低头。心海回赠一串珊瑚珠。绫人告退时步子不急，廊下的雪落满肩头也不掸。有家臣隔轿低声问成色如何，他答：「成色是小事，社奉行这块匾还在，才是大事。」轿行两道街，帘内又添一句：「回去把老宅的地契补齐。」家臣应了，只觉今日的家主比往日更沉得住气，连轿夫的脚步，都放得比平日轻了。笺上樱纹，与礼盒上的一般朝下。雪化了那日，神里府送来第二份礼，附一张短笺，只写「同心」二字。"
 SAN_PW.20009.a:"留其体面"
 SAN_PW.20009.b:"斩草除根"
 SAN_PW.20010.t:"九条军整饬"
 SAN_PW.20010.desc:"旧旗卸甲胄，新帜蓝白映弓弦，铁骨未曾弯。九条裟罗带着残部前来归降，只求保留九条家的军旗。心海不曾应，却另给她一面新的：海祇军的蓝白旗，旗下仍是那支百战的弓手。交旗那日，裟罗把旧旗叠得方方正正，四角对齐，像叠一件故人的衣裳。领了新旗，她当众展开，风把旗面吹得笔直。旧部中有几人眼圈红了，她喝一声「站直」，又放缓声道：「旗换了，弓还是你们的弓，手别抖。」此后校场上她的令声比从前更短，夜里独自擦弓的时辰却更长。有部下劝她歇歇，她道：「弓不擦，弦要记恨。」众人听了，再不敢劝，只把弓擦得比她的还亮些。裟罗的弓弦后来换了海祇的麻线，有人问响不响，她道，响些好，听得清令。"
 SAN_PW.20010.a:"重用裟罗"
 SAN_PW.20010.b:"拆散旧部"
 SAN_PW.20011.t:"战后理财纲"
 SAN_PW.20011.desc:"账册摊满案，窟窿深不见底处，一灯独自明。御影炉心停摆、踏鞴砂废弃、离岛封锁，稻妻的家底在眼狩令的年月里早烂透了。心海摊开海祇的账本，越看越冷，算下来连九十万年的赋税也不够填这窟窿。她核账核到三更，算珠拨得极轻，怕吵醒隔壁值夜的文书。窟窿到底多大，账房先生们各报一个数，报出来彼此都不信。她末了只问一句：「踏鞴砂的炉子，几日能复火？」众人答不上来，她便自家记下这一条，搁在最上面。散值时她对老账房道：「数目是死的，人是活的。账烂了可以重记，人散了就真没了。」老账房应了，连夜把徒弟们都叫了回来。墨也磨得比从前勤了。那本搁在最上面的册子，后来翻得起了毛边，字却愈发清秀。"
 SAN_PW.20011.a:"开源为先"
 SAN_PW.20011.b:"节流为先"
 SAN_PW.20012.t:"接收踏鞴砂"
 SAN_PW.20012.desc:"炉口吐新焰，两派火候争一寸，图纸蒙尘埃。踏鞴砂的炉火重新点起来，海祇的工程师带来白夜国的冶炼法，与当地的雷电五传技艺撞在一处，火星四溅。复火那日请了双方的老师傅：白夜的法子讲究炉温匀，五传讲究一鼓作气，两人隔炉争执，火星溅了满襟也不肯让。后来泽维尔从废墟里翻出愚人众的旧图纸，把两种火候画在同一张图上，两人才各自哼了一声坐下。头一炉钢出来颜色发暗，老师傅敲了敲道：「能用，第二炉就好了。」监工的军官把那炉暗钢铸成一口钟，挂在工棚门口，道：「记着头一天。」自此炉前的争执少了，图上的批注却一天多似一天。钟面上至今留着第一炉的暗色。钟声一响，两派师傅都停下手里的话，侧耳听了一会，各自去忙。"
 SAN_PW.20012.a:"军需为先"
 SAN_PW.20012.b:"民用为先"
 SAN_PW.20013.t:"离岛开港日"
 SAN_PW.20013.desc:"桅影簇新港，旧例封存一箱底，章程纸虽薄。离岛封锁令解除，璃月、蒙德、须弥的商船重新靠岸，桅杆挤满了港口，勘定奉行留下的关税旧制推翻了，换上一纸薄薄的通商章程。开港头一日，先靠岸的是一艘璃月粮船，船主捧着新章程看足一炷香，道：「比旧税少了七成，可是印错了？」口岸官吏答：「没印错，往后年年来。」蒙德的商队抬着苹果酒上岸，须弥的学者却直奔书肆。旧关税的册子封箱时，老书办摸着封皮叹口气：「这本册子压了我半辈子，如今倒轻了。」封罢在箱外贴一行小字：「往事已矣。」字是自家的笔迹，力道却比平日软了许多。看罢依旧叹气，叹完却笑了。那箱旧册子后来进了史馆，老书办每隔些时日，还要去看上一眼。"
 SAN_PW.20013.a:"全面开港"
 SAN_PW.20013.b:"有限通商"
 SAN_PW.20014.t:"封存邪眼炉"
 SAN_PW.20014.desc:"海水灌炉喉，禁忌长眠渊底库，符印镇千秋。邪眼工厂的熔炉被灌入海水，炉膛里的火嘶了一声便灭了，白汽从烟囱里冲出来，像一声长长的叹息。那批以寿命换武力的禁忌之物，连同图纸一并锁进渊下宫的最深处。押运的船队夜里走，帆收了半幅，不许点灯，过名椎滩时风浪忽起，押运官绕了半日的水路。封库的符是心海亲手画的，画到末一笔时她停了停，想起那些拿命换力气的兵士，终究一笔一笔画完了。守库的名册上只两人，每月轮换，交接时对一句暗语：「海枯。」「石烂。」封罢那日海面平得反常，随行的书记在卷尾添了一句，愿后来者不必再启此门。此后每月交接，两人都提前一日到，在库门外坐一坐，喝一盏茶，才进去对暗语。"
 SAN_PW.20014.a:"永加封存"
 SAN_PW.20014.b:"留备后用"
 SAN_PW.20015.t:"歧路择向时"
 SAN_PW.20015.desc:"神座夜未眠，三卷草案各西东，笔落千钧重。稻妻城已静。心海独自坐在现人神的神座上，面前摊着三份截然不同的国策草案：一份讲神权，一份讲共和，一份讲幕府。烛芯爆了两回，她起身换烛，顺手把窗推开一线，海风进来，纸角轻轻颤。侍女来添过三回茶，茶都凉透了。天将明时她把三份纸拢齐，边角对得整整齐齐，对侍女道：「去请五郎，再请几位老成持重的来。这一夜过后，稻妻不能再由我一个人睡不着。」侍女应声出去，她复又坐下，把最上面那一份从头再读一遍，读到第二行，天光已从窗纸上泛出鱼肚白来。她揉了揉眼，把朱笔搁下，先净了手，才饮那盏冷茶。侍女回来说人齐了，她应了一声，把冷茶泼在阶下，起身整了整衣袖，先一步出了殿。"
 SAN_PW.20015.a:"迎向新世"
 SAN_PW.20015.b:"犹疑未决"
 SAN_PW.20016.t:"心海登神阶"
 SAN_PW.20016.desc:"珠冠换金纱，凡骨登坛受万拜，灯影隔人间。现人神巫女加冕为御建大御神，海祇的信仰头一回与稻妻的权柄合一。加冕那日大殿跪满了人，香灰落了她一肩，侍从要替她拂去，她抬手止住。礼成后她独回内殿，把那顶珍珠冠搁在窗台上，潮气一浸，珠色黯了一层。老仆问还戴不戴旧冠，她道：「收着罢，那是心海的东西，神用不上它。」殿外山呼万岁，一浪接着一浪，殿内的她把金色面纱摘下来搭在椅背上，坐了半晌。案上供着新铸的神玺，玺钮雕着蛇衔珠，她拿起来掂了掂，又放回原处，位置摆得端端正正，像是替谁看的，又像谁也不为，只烛花偶尔爆一声。夜深了，殿外的山呼歇了，她把面纱重新戴上，戴上便再没有人在殿里，同她说家常。"
 SAN_PW.20016.a:"登临神位"
 SAN_PW.20016.b:"仍守人身"
 SAN_PW.20017.t:"大御神国教"
 SAN_PW.20017.desc:"敕纸墨犹湿，黑布蒙却旧神颜，珠蛇踞高坛。御神敕令颁下：大御神为稻妻唯一真神，鸣神信仰贬为旧俗。鸣神大社的神像当夜蒙上黑布，蒙布的杂役手脚极快，仿佛慢一步便有罪。翌日有位老参拜者上山，见了黑布愣了半晌，终究对着布拜了三拜才走，守山的巫女不曾拦，事后也无人追究。取而代之的蛇与珍珠徽记铸得急，边角还有毛刺，管营造的官解释说，礼器赶工，来日再铸精的。上头只回了三个字：「神不挑。」徽记挂上去那天起了风，黑布角掀起来又落下，像旧神在里头翻了个身。守夜的小巫女吓得跑了，次日却照旧当值，只是腰间的铃铛，多系了一只。那只铃铛是自家买的，谁也没问，她也不说，摇起来声音极轻，轻得只有她自己听见。"
 SAN_PW.20017.a:"立为国教"
 SAN_PW.20017.b:"并祀相容"
 SAN_PW.20018.t:"异端审判所"
 SAN_PW.20018.desc:"军械库改庭，蛇印压定生死簿，问词带香风。审判所设在天守阁的旧军械库，兵刃挪空了，架子上的油味还没散。头一批押进来的是替鸣神传道的巫女。头一场审问走了整日，被审的老巫女耳背，问官的话要书记凑近耳畔转述，转述的声音越来越轻，到后来几乎成了耳语。判决书由神谕代笔，落款只有一枚蛇形印。印泥调得深红，盖下去洇开一小圈，像一滴血。散堂那晚，值房里有人听见代笔的神职低声念叨，问神谕这一句到底如何落笔，念了半宿。次日他交了稿，稿纸极干净，只在页边有一个极小的墨点，谁也没问那墨点是什么，他便也一句不曾说，只把稿子卷好了。卷宗归档那天起了潮气，蛇形印的红洇得更开了些，管档的照原样收，没敢另描一笔。"
 SAN_PW.20018.a:"铁腕断狱"
 SAN_PW.20018.b:"以感化为主"
 SAN_PW.20019.t:"忏悔之网"
 SAN_PW.20019.desc:"听罪遍村邑，珍珠链上传密语，祷声压得低。每一个村落设一名听罪的神职，每一句对神权的怨言，都顺着珍珠链传回珊瑚宫。稻妻人开始学着在祈祷时压低声音。起初乡人不惯，祷告照旧大声，听罪的只记不罚，一个月后，各村的声音齐齐矮了半截。有婆媳拌嘴也去听罪席前说，神职听完答一句：「家中事神不管。」却把两人说的米价记下了。传回的册子越积越厚，掌册的官发现怨言少了，问米的倒多了，他把这一条原样呈上。心海批道：「问米的人，比怨天的人好治。」批完她把册子合上，对左右道：「声音压下去容易，叫它再大起来，难。」各村的听罪席后来添了坐垫，来看米价的人，也就渐渐坐得住了，坐得久了，连米价也问得细了。"
 SAN_PW.20019.a:"密织耳目"
 SAN_PW.20019.b:"适可而止"
 SAN_PW.20020.t:"鸣神社之劫"
 SAN_PW.20020.desc:"御柱倒尘埃，樱花落作覆社雪，一语恨成谶。影向山上的鸣神大社被封，御建鸣神的御柱推倒了，石料拆去修海祇军港。拆柱那日山路两旁的樱开得正盛，花瓣落在石上，搬石的兵不敢拂。封门的木牌是新削的，字迹未干便挂上去。八重宫司在封社前夜失踪，只留一片樱花与一句「你会后悔的」。有人见她末一夜在神樱树下立了许久，手里一盏没点的灯笼。次日树下只余一片压平的草。搜查的人回报时不敢抬头，心海听完，只道：「知道了。」她起身走到窗前，窗外正是影向山的方向，樱花开得像一场不肯化的雪。她看了半晌，吩咐把山道上的落花扫拢，不许焚。那些花后来封在一只白瓷罐里，搁在宫中僻静的架子上，罐上没有题字。"
 SAN_PW.20020.a:"夷平神社"
 SAN_PW.20020.b:"封存勿动"
 SAN_PW.20021.t:"神谕之内阁"
 SAN_PW.20021.desc:"七人代神言，垂目列班不敢看，殿上静无声。内阁不再由凡人组成，改由七名代神言者执掌，自称听得见大御神的声音，却没有一个敢直视心海的眼睛。头一回列班议政，议的是漕米折价。为首的老者开口前先闭目片刻，说是听谕，听的工夫比说话的工夫长。有人试探着抬眼看了上首一次，随即把目光挪开，此后再没有第二回。散班时七人同乘一车回去，车里谁也不言语，车夫说，这七位的轿资例银从不争，也从不问旁人争不争。月终核销，七份单子笔迹七样，格式却一般整齐，管账的看罢叹道：「连节省都省得一样，这才是真怕。」散朝后心海独自在殿里坐了片刻，笑了一声，笑声落在空殿里，比不说还轻，守殿的侍女听见了，也装作不曾听见。"
 SAN_PW.20021.a:"凭神谕独断"
 SAN_PW.20021.b:"设臣下制衡"
 SAN_PW.20022.t:"神职将官团"
 SAN_PW.20022.desc:"符咒配刀行，阵亡入祀礼同科，兵亦神前人。海祇军的军官同时受神职册封，作战时符咒与佩刀同行，战死后按神职规格入祀。军队成了教会，教会成了军队，两下里已分不清谁是谁。授衔与授符在同一日，军官跪受符咒，起身时腰间佩刀要按着刀镡，不许出鞘半寸。操典改了三处：晨祷排在晨操之前，夜祷排在熄灯之前，战前默立一炷香。有老军士私下嘀咕，打了半辈子仗，头回学会念经。什长听见，只说：「念罢，念熟了，上阵心里稳。」后来那批人入祀的名册一年厚过一年，抄册的书吏笔迹越来越快，墨色却越来越淡，像是抄的人自己也不敢重写似的。入祀的钟后来铸了一口新的，钟声比旧的沉，老兵们说，像人压着嗓子哭。"
 SAN_PW.20022.a:"军政合一"
 SAN_PW.20022.b:"令军职自立"
 SAN_PW.20023.t:"神权理政"
 SAN_PW.20023.desc:"香火定考成，教阶次第理庶务，案牍带烟霞。地方官吏由神社推举，考绩以虔诚为先，稻妻的行政体系脱了世俗，沿着香火与教阶重新生长。推举那日各神社报上的名单写得工整，落款按着社印。考绩册子头一项写奉祭勤惰，第二项才是赋税完欠。有位乡官漕运办得极好，只因祭日缺勤一回，考语便落了中平。他不辩，回家把神龛擦得更亮，亮得能照见人影。次年考语升了，漕运却误了两船。上官叹道：「如今会烧香的，比会撑船的吃香了。」说罢自嘲一笑，把批语重誊一遍，誊到一半停笔，想添一句漕误责在教阶，写了又涂，涂了又写，末了仍旧照旧例誊完。那年漕运误的两船，来年他自家赔上了，账面清了，考语倒没改，他也不恼，只把神龛又擦了一遍。"
 SAN_PW.20023.a:"以教阶治民"
 SAN_PW.20023.b:"留用旧吏"
 SAN_PW.20024.t:"日轮之子训"
 SAN_PW.20024.desc:"古卷译残阳，献祭易作旧秩序，典成夜未央。渊下宫的古籍重新译出，原来白夜国曾以太阳之子为神献祭。心海下令重立此典，只是这一回，献上的是旧世界的秩序。译经的学士们为所献为何四字争了半月，最后由她一锤定音。颁行那日殿上读诏的声音平稳，殿外有人低声问身边的同伴，旧秩序三字究竟指幕府还是鸣神，同伴摇头，两人都不敢再问。典册装进金函收库，管库的把钥匙贴身收着，夜里翻身硌得慌，却睡得极沉。有学士私下嘀咕，说这典名存实亡，祭的是一页纸。管库的听见了，淡淡道：「纸在库里，人心里祭什么，库里管不着。」那人便不敢再言语了。金函入库那天，库房里换了一炷新香，香气绕着函盒转了三转，散了。"
 SAN_PW.20024.a:"复兴古祭"
 SAN_PW.20024.b:"去其献祭"
 SAN_PW.20025.t:"渊下神宫祀"
 SAN_PW.20025.desc:"凿开常夜角，火种北上入旧地，威仪深海来。渊下宫的常夜被凿开一角，阳光头一回照进白夜国的废墟。神宫祭司捧着大日御舆的火种北上，把深海的威严带进鸣神旧地。火种启程用玄色帷幔罩着，抬龛的力士赤足，脚步放得极匀，说是火不容颠。沿途州县设香案迎送，有孩童踮脚掀开帷角看了一眼，叫母亲捂着眼拖走。孩子后来说，里头不是火，是像水一样的光。这话传到祭司耳中，祭司沉默片刻，吩咐把他家今年的税免了，理由写着四个字：「童言近道。」火种入城那日下了细雨，香案的纸罩湿了一角，祭司不许换，道：「湿了的香案，才显得诚心。」众人便不敢换了。火种入坛那夜，城里的狗都不曾叫，老人们说，火不惊生灵，是良火。"
 SAN_PW.20025.a:"开宫迎神"
 SAN_PW.20025.b:"审慎探查"
 SAN_PW.20026.t:"大蛇御座"
 SAN_PW.20026.desc:"巨骨镇山巅，神座惟一不二尊，意志一人承。新的神殿在珊瑚宫岛最高处落成，供奉奥罗巴斯的巨骨。她在神座上坐定，朗声宣告大蛇的意志，自此由她一人承继，一人独断。神殿落成那日，巨骨横在殿心，骨上旧年的凿痕还在，有老工匠认出那是先代造船时留下的，立在原地看了许久。心海登座时，阶下有人高呼大御神，也有人低唤奥罗巴斯，两种称呼在殿里撞在一处，谁都听见了，谁都不作声。她坐下后只一句：「这两个名字，往后是一回事。」散殿时暴雨骤至，雷落在殿角，无人伤亡。管事的连夜报上来，她批四个字：「雷亦来贺。」批罢搁笔，自己先笑了，笑完又收了。殿角的雷后来再没落过第二回，管事的把那夜的记录抄了一份，贴在案房里。"
 SAN_PW.20026.a:"借大蛇立威"
 SAN_PW.20026.b:"避讳蛇名"
 SAN_PW.20027.t:"圣战之义"
 SAN_PW.20027.desc:"敕令出四境，刀锋所指非守土，珠埋异邦沙。国教的敕令颁行天下：大御神的荣光，理当布于四海之滨。稻妻的刀不再只为守护，也为传教，要把海祇的珍珠埋进每一片异邦的沙滩。敕令传到各卫所，将官把新训词抄在旗杆上，抄到荣光及于四海一句，笔锋都格外用力。有老兵问什长：「传教是怎么个打法？」什长道：「先礼后兵，礼是珍珠，兵还是兵。」启程的船队带着成箱的古卷与成捆的兵刃，箱捆各半。码头送行的巫女唱祝歌，唱到一半风转了向，歌声散在桅杆间，无人接下去。押运的军官望着帆影，自语道：「祝歌唱不圆的仗，多半不好打。」说罢上船，果真没有回头。船队出海第三日传回第一封报平安的信，信尾比正文多了半行，问家里的樱开了没有。"
 SAN_PW.20027.a:"宣示圣战"
 SAN_PW.20027.b:"敛其锋芒"
 SAN_PW.20028.t:"锁国新令"
 SAN_PW.20028.desc:"港锈再生时，外商局促一岛内，神国门自封。新的锁国令比幕府的更彻底：外商集中于离岛一地，传教者一律驱逐，稻妻的港口重新长出锈迹，神国的边界就此封死。新令贴出那日，离岛的商馆把货栈的门板卸了一半，又默默装了回去。传教士被送上一艘不挂旗的船，临行把随身古卷留在栈桥上，没有人去动，潮水涨了两回，那卷书便泡烂了。渔船领照出海，照费不贵，偏要保人画押，渔户们凑钱请保人吃了一顿饭，席上谁也不提锁国二字。港口的铁锚渐渐生锈，锈色顺着锚链一寸一寸爬上来。守港的老兵看着，说了句：「这锈爬得，比旧年还快些。」那卷泡烂的经书后来叫潮水推上滩，一个拾荒的孩子捡去晾在礁石上，晾干了，字迹一个也不剩。"
 SAN_PW.20028.a:"重申锁国"
 SAN_PW.20028.b:"有限开港"
 SAN_PW.20029.t:"御神亲卫队"
 SAN_PW.20029.desc:"孤童入禁庭，一刀一符一世忠，锁链亦锋刃。御神亲卫从海祇的孤儿中挑选，自幼受神职训练，只认现人神一人，是神国的刀锋，也是神座最忠诚的锁链。选童那日，孤儿院的孩子们列队站好，管事的一一端详，像相看一头头小马。被选中的孩子领了新衣，临出门回头望了一眼，院里的老姆妈朝他摆手，叫他快走，自己的眼圈却红了。他们的课业一半是刀，一半是经，教官说，这两样学全了，才算刀锋。有孩子夜里梦哭，同屋的把他摇醒，两个孩子在黑暗里对坐半晌，谁也不提各自梦见了什么。次日清晨照旧练刀，刀声齐整，院墙外的人只当是打铁。年节放饷那日，亲卫营的门房多备了一桌席面，说是给回不了家的孩子们摆的，年年如此，从未少过一副碗筷。"
 SAN_PW.20029.a:"扩编亲卫"
 SAN_PW.20029.b:"节制军额"
 SAN_PW.20030.t:"巫女总动员"
 SAN_PW.20030.desc:"祝装换蓝衫，旧神香火让新歌，声在同一天。全体巫女编入神职序列，战时征召、平时传道，无数曾为鸣神奉香的少女换上蓝色祝装，为新神唱新的歌。换装那日，诸岛的神社同时升旗，时辰是心海定的，说是要让天听见是同一刻。有年长的巫女把旧祝装叠好压进箱底，箱里还压着一张鸣神大社的旧签，签上的字她没有再看。年轻些的对着新衫照了又照，彼此替对方理领口。头一回合练新歌，唱不齐，领唱的巫女停下来道：「不急，往后日子长，这一首要唱给几代人听。」再练时果然齐了，只是尾音里总带一点旧调的转法，改了几回也改不掉，索性由它去了。改不掉的转法后来被写进新歌谱里，谱上注明，此处随缘，唱旧调新词的，各听各的。"
 SAN_PW.20030.a:"举国动员"
 SAN_PW.20030.b:"自愿应召"
 SAN_PW.20031.t:"神田之利"
 SAN_PW.20031.desc:"田归神社册，佃户弯腰垄上行，十取其二三。土地归神社所有，农人成了神田的佃户，收成的一成归心海，一成归教会，余下的才归自家。国库充盈了，田地却沉默着。清丈那日田埂上插遍新牌，牌上的神纹漆味很重。农人对着牌拜了拜，又对自家的地拜了拜，两个拜之间隔着一垄青苗。收成入库的日子，量斗敲得山响，农人盯着斗沿，看谷物冒尖，又看它刮平。有老农算完自家那份，蹲在田头抽了半晌旱烟，起身道：「比幕府的年成强，比往年的日子苦，都赶上了。」说罢把烟锅在鞋底磕了磕，别回腰里，弯腰接着割他的稻，割得比谁都细。他割完最后一垄，直起腰看了看那块新牌，牌上的漆已经旧了，倒像立了十年，风吹雨打，字反倒愈发清楚。"
 SAN_PW.20031.a:"推行神田"
 SAN_PW.20031.b:"暂缓征用"
 SAN_PW.20032.t:"血珍珠商路"
 SAN_PW.20032.desc:"珠光连海色，价腾三倍市声喧，骨血沉筐底。海祇的珍珠产业收归神宫专营，价格连翻数倍，远嫁的渔船带回成箱的摩拉，也带回海民被榨干的骨血。专营令下后，采珠的季成了全村的命。筐一筐往船上抬，验珠的官拿着戥子称得极细，称完在册子上点一点，农妇们看着那一点，像看自家的年成。价钱翻了数倍，可到手的部分算来算去与往年相仿。有渔家女在滩头数珠，数着数着把最圆润的一颗留下，收进小布囊里，道：「这一颗不卖，留给我自己看。」旁边的婶子笑她痴，她也笑，把布囊贴身收了，转身又下海去，水凉得很，她却潜得比谁都深。那颗珠子她带了许多年，后来传给女儿，女儿也说不卖，留给自己看，一囊两代，布面磨出了光。"
 SAN_PW.20032.a:"专擅珍珠"
 SAN_PW.20032.b:"限价惠民"
 SAN_PW.20033.t:"社坛百工"
 SAN_PW.20033.desc:"晨钟连机杼，祷祝之后启螺栓，轰鸣有杂音。工厂由神社出资、神职监工，工人清晨上工前先向大御神祷祝。产能上去了，工人们却开始在机器的轰鸣里听见别的声音。上工前全体面东祷祝，工头把祷词贴在车间门口，不识字的新工跟着念，念错了也不纠。产能月月往上走，墙上的朱笔数字换得勤。夜班的工人说，机器声听久了，里头像有人在哼别的调子，起先怕，后来惯了，跟着哼。监工的神职巡夜听见，驻足片刻，在册子上记了一笔，谁也不知道记的是什么。散工后有小工凑过去问，神职把册子合上，道：「记的是日子。等哪一天不记了，你们再怕不迟。」那页记录满了一年便揭下来，换成新的一页，揭下的都收在一个匣子里，年年加厚。"
 SAN_PW.20033.a:"以教产兴工"
 SAN_PW.20033.b:"任民设厂"
 SAN_PW.20034.t:"现人神不灭"
 SAN_PW.20034.desc:"画像入官署，不老不倦悬中堂，纸上即永恒。神学会议得出结论：现人神乃永恒之身，死生不属凡人所能议论。心海的画像被挂进每一间官署，画上的她不老不倦。画像出自宫廷画师之手，画上的她眉目温柔，指尖无茧。颁下那日各官署净室挂轴，有人对着画像练行礼，礼毕自语，明日见了真人，不可看错。有老吏凝视良久，道：「画得好，就是太静了。真人病中是咳嗽的。」这句话无人接，也无人报。此后画像又颁了新的一版，背景添了远山，远山下画了耕田的人，耕田的人眉目模糊，倒比画像上的她更像是活人。老吏看了新版，把旧版收进箱底，谁也没告诉。箱底的旧画受潮起了斑，斑落在她的眉梢，倒像点了一颗旧式的美人痣。"
 SAN_PW.20034.a:"定于一尊"
 SAN_PW.20034.b:"讳言神寿"
 SAN_PW.20035.t:"神断之庭"
 SAN_PW.20035.desc:"掷珠问曲直，律条束之高阁上，判词不提法。司法不再依律，而依神谕。法官以掷珠卜问定罪，判决书行文凛然，只字不提律条，稻妻的律法就此退化成神的脾气。掷珠有一套仪轨，珠落入玉盘，弹几跳、停在哪一环，都有讲法。观审的百姓起初看得津津有味，后来有人嘀咕，这一跳与那一跳，凡人如何分辨神意。衙役喝止，嘀咕的人便不再出声。判决书文辞堂皇，从头到尾寻不出一条律名。有讼师把律典搬回家中，说留一部总有用处。他的儿子问何时有用，他答不上来，隔了半晌才道：「用不上最好。留着，是怕它连用不上的日子也没有。」那部律典传了两代人，书页黄透了，用却始终没用上，家里人都说，这是好事，说这话时，谁也不看那口书箱。"
 SAN_PW.20035.a:"凭神断狱"
 SAN_PW.20035.b:"留用律条"
 SAN_PW.20036.t:"天理之贡"
 SAN_PW.20036.desc:"贡船指天穹，珠晶之外载一人，跪与站之间。心海向天空岛献上第一份贡赋：珍珠、雷晶，与一名自愿的白夜后裔。有神职当面问她为何要向天理低头，她只答：「在能站直之前，先学会跪。」白夜后裔自请入贡那日，族老们送他到码头，没有人哭，回程的船上一路无话。他在行囊里带了一册家谱，海关的人翻见，问带这个做什么，他说：「叫天上的知道我是谁。」贡船启航那天风顺，帆吃饱了，岸上的人望着它变小，变了点，又没了。心海回宫时经过廊柱停了一步，抬头看藻井上的云纹，看了许久。左右不敢催。后来那口井的云纹，她再没有抬头看过。贡赋每年一期，白夜后裔的名字每期换一个，族谱上添的这一页，墨色一年比一年淡。"
 SAN_PW.20036.a:"暂且臣服"
 SAN_PW.20036.b:"暗自积蓄"
 SAN_PW.20037.t:"海蛇之舰队"
 SAN_PW.20037.desc:"蛇首破晓雾，甲板上诵祝词，潮随令旗分。以白夜科技重造的舰队在离岛列阵，船首雕着蛇首，甲板上立着随军传道的神职，鸣神的海域从此只有一个神的名字。首舰下水那日，蛇首的金漆在晨光里晃眼，船工们绕着船身走了一圈，用手摸过每一寸船板，像相认一位旧友。神职的诵经声与炮械检查的号令叠在一处，竟也不难听。老水手摸着新舵轮道：「船是好船，就怕海不认。」徒弟问海认什么，他指着船首的蛇眼道：「认这个。从前鸣神的船也画眼睛，画法不一样。」首航出港时潮头正涨，船身一摆，蛇首点进浪里又抬起来，水珠顺着金漆往下淌，亮得晃眼。那滴淌下来的水珠在金漆上留了道痕，工匠要补，老水手拦了，说，让它记着第一浪。"
 SAN_PW.20037.a:"扩建舰队"
 SAN_PW.20037.b:"量力而行"
 SAN_PW.20038.t:"犁庭扫穴录"
 SAN_PW.20038.desc:"符纸落尘泥，珠串挂上门楣处，一村一变了。不肯改信的村落被逐一清查，神职带着军士挨家挨户撕下鸣神的符纸，换上大御神的珠串。有人依言换了，也有执意不改的，被吊上了村口的老槐。清查的队伍进村时，鸡犬都安静得反常。换符的兵士动作不算粗，只是快，撕下的旧符落地，有人弯腰去捡，叫同村人轻轻拽住。村口的绳结解下来那日，围看的孩童叫大人喝回屋里。入夜后有老妇对着新珠串上了三炷香，香是给谁的，她没有说，香灰落得很直。册子上这一村记作已归化，字写得端正，墨在夜里干得很慢。批注的一行小字写道：民易服，不易心。写的人想了想，又把不易心三个字涂了。涂了的那三字底下压着一层淡墨，后来修档的人看见了，照原样裱了起来，没再动。"
 SAN_PW.20038.a:"从严清查"
 SAN_PW.20038.b:"网开一面"
 SAN_PW.20039.t:"北征之义战"
 SAN_PW.20039.desc:"敕令越海去，扣船逐使皆有名，足迹定疆界。国教的敕令指向稻妻之外的列岛：至冬的使节被驱逐，璃月的商船被扣，神国的边界不再以海为限，而由信徒的足迹决定。扣船那日，璃月的船主在埠头据理力争，译员翻得磕绊，兵士不与他辩，只按册子上的船名一一指过去。至冬使节离境时把国书副本付之一炬，火光映在他的皮裘上，他看着火烧尽，把灰拢进袖中带走。国教的舆图房里，新绘的疆界不再沿每一条海岸线收笔。制图官搁笔时道：「往后这一笔落在何处，得问传道的人走到哪里。」他说完把那张图挂在墙上，图角压了一枚新鲜的船钉，锈还没生。袖中的那把灰，使节回国后撒在自家庭里，据说当年种什么，什么长得旺。"
 SAN_PW.20039.a:"兴兵北征"
 SAN_PW.20039.b:"暂息兵戈"
 SAN_PW.20040.t:"沙隐募兵令"
 SAN_PW.20040.desc:"献身作旗号，渔村壮丁次第行，滩上网空悬。神国以献身为名募兵，青壮成批离开渔村，海祇的沙滩上晒着网，却再没有一张能被拉起的。募兵的告示贴在渔市口，识字的人念给众人听，念到献身二字时压低了声。报名的青壮排在盐仓外，队伍不齐整，却不见有人插队。有母亲追出来往儿子怀里塞一包干粮，兵士温和地退回，只许送到营门口。她送到营门口，把干粮塞进儿子袖子里，替他把袖口捋平，一句话没说就回去了，背影挺得很直，进了家门才哭出声。此后滩头晒的网越积越多，涨潮的日子，网空悬着，孩子们说，网在等手。大人听了，都装作没听见。营门口那条路后来叫送子路，路面叫脚磨得发亮，两头都亮，中间一段黯着。"
 SAN_PW.20040.a:"竭泽征兵"
 SAN_PW.20040.b:"存养民力"
 SAN_PW.20041.t:"神乐永续祭"
 SAN_PW.20041.desc:"神乐彻夜舞，坛下伏拜无人知，膝衫藏青紫。她定下例规，每年一回神乐大祭，昼夜不歇，须以现人神之身亲舞至天明。岛民跪伏在阶下，无人知道舞者的膝盖已经青紫。大祭头一年，舞至三更，观礼的老人们窃窃私语，说舞步里有一段是旧年鸣神祭的遗意，问身边的巫女，巫女不答。四更下起细雨，仪仗请她避雨，她在坛上摆手，水汽顺着面纱滴下来。天明礼成，她由侍女扶下坛，步子放得很稳。更衣时侍女看见膝头的青紫，要传医官，她摇头道：「明日还要接见使臣，别声张。」侍女应了，转过身去偷偷抹了把泪。次年大祭，她照旧登坛，一记不改。侍女后来学了医，学成那日头一件事，是给大人的膝盖配了一副护膝，青紫色，看不出。"
 SAN_PW.20041.a:"永续大祭"
 SAN_PW.20041.b:"恤神惜力"
 SAN_PW.20042.t:"登神大仪"
 SAN_PW.20042.desc:"禁典入国书，褪骨之约在一夜，印落烛花爆。渊下宫的禁术写进国典：现人神将褪去凡骨，成为真正的神明。心海在仪式前夜独自坐了许久，终在诏书上落了印。诏书用最重的礼纸誊写，誊完那夜，守灯的差役说，烛花爆了三回，回回都是双头的。仪程单上写明：登神当日宫门闭，钟不鸣，犬不吠，违者杖。前夜她把贴身旧物清点了一遍，一枚御守，一册旧笔记，交侍女收好，道：「这些是人的东西。」侍女想问什么，终没敢问。次日宫门开启，殿中一切如常，只是案上那盏茶，再没有人续过了。值殿的侍女守着凉透的茶站到日暮，最后由掌事的吩咐，原样撤了下去。那盏茶撤下去的次日，案上换了一盏新的，此后日日有新茶，再没有一盏是给她备的了。"
 SAN_PW.20042.a:"举行登神仪"
 SAN_PW.20042.b:"留恋人世"
 SAN_PW.20043.t:"永恒之神国"
 SAN_PW.20043.desc:"万口归一声，温柔亦作高墙用，年轻的神座。神国宣告永续，稻妻全境只有一个声音，那声音来自珊瑚宫的神座。心海成了她曾反抗过的那种存在，只是更年轻，更温柔，也因此更难推翻。宣告那日诸岛的钟齐鸣，声浪从一岛传到一岛，末了都汇在珊瑚宫上空。有盲眼的老乐师被请去谱颂歌，谱完道：「这曲子太好听了，好听得叫人心里发空。」颂歌传遍列岛，孩童都会哼。心海听人唱过一回，听完问左右，曲子里那句千秋万世，是谁定的词。左右答是礼官拟的。她点点头，没有再说什么。颂歌后来又修过两版，越修越圆熟，老乐师却再不肯署名，只收下一份润笔，退了。老乐师临终前把颂歌的总谱付了火，火里纸页卷起，倒像有人轻轻唱了最后一句。"
 SAN_PW.20043.a:"神国永续"
 SAN_PW.20043.b:"留一线裂隙"
 SAN_PW.20044.t:"制宪之议"
 SAN_PW.20044.desc:"珠冠置案心，五岛代表同席坐，一言定乾坤。珊瑚宫、鸣神、离岛、清籁、鹤观，各岛代表头一回不分贵贱坐在同一间厅堂里。心海把象征现人神权威的珠冠放在桌心，道：「这一顶，今天起归诸位议决。」鹤观的老祭司与清籁的雷祝互相打量了许久，谁也没先开口。散会后没人先离席，还是老祭司起身道：「既已同桌，往后吵架也到这张桌上来吵。」众人一笑，气氛才活了。那顶珠冠后来加了琉璃罩，钥匙一分为五，五岛各执其一，开罩的日子要五把钥匙同日到场。头一回开罩掸尘，五个人到齐了，谁也不肯先动手，末了推了半天，叫最年轻的那个掸了，掸得极慢极轻。五把钥匙各配一条络子，络子的颜色五岛各出一色，拧在一处，倒成了一条完整的穗。"
 SAN_PW.20044.a:"交出神权"
 SAN_PW.20044.b:"保留圣职"
 SAN_PW.20045.t:"诸岛议席"
 SAN_PW.20045.desc:"议席按岛分，航道税银争半日，长席听潮声。议会按岛屿而非门第分配席位，会上吵得最凶的，往往是两岛为一条航道的税收，而心海坐在议长席上，头一回只需听，不必断。首次常会为一航道税收吵了整日，午饭送到廊下没人去吃。她翻着文书，翻页的声音偶尔插进争吵里，竟有种奇怪的镇定。散会时两岛议员在阶前还争，争完又并肩去用了晚膳。老书记官感慨道：「从前御前会议不许有第二种声音，如今一天能听八种。」心海听完，只把当日记录誊清一份存档。誊到争吵那一段，她逐字照录，一句未删，末页添注一行：争而无伤，即为政。字比正文小些。那一行小注后来叫抄档的书吏裁去了，不知是谁又从废纸篓里拾回来，重新贴上。"
 SAN_PW.20045.a:"议席按岛"
 SAN_PW.20045.b:"依人口分配"
 SAN_PW.20046.t:"信仰自由法"
 SAN_PW.20046.desc:"一亭共洗手，两教神位并肩坐，松口气的人。大御神与鸣神并祀于同一座神社，巫女与宫司共用一个洗手亭。有人斥作亵渎，更多的人，只觉得压了两代的担子终于卸了。并祀那日，洗手亭前排起两队，一队惯先净左手，一队先净右手，起初互相侧目，第三日便乱成一团，也自然成一团。社里两尊神位并列，供品摆了两样，香却只燃一炉。有老婆婆两样供品各拜一回，起身道：「都是神，都保佑。」管社的把这一句记进社志，想了想，在后面添三个字：此言善。御灯只有一盏，两边都添油，油添得比往年勤。扫灯的杂役说，勤好，勤说明两边都上心，两边的火，如今是一把火了。香灰积到年头，混在一处再分不出彼此，扫灰的杂役说，神到底还是一样的神。"
 SAN_PW.20046.a:"并祀共容"
 SAN_PW.20046.b:"各祀其神"
 SAN_PW.20047.t:"神之眼民权"
 SAN_PW.20047.desc:"一纸消残令，愿力从此非罪证，持眼者抬头。法案规定：持有神之眼者与常人同权，不得因其愿力受歧视或征用。一纸条文颁下，眼狩令年月留下的最后一点阴翳，就此散了。颁行那日，离岛一家当铺把柜底的旧契翻出来当众烧了，那是眼狩令年月收当神之眼的典契，火光一起，围观的人先是静，随即有人鼓掌，掌声里混着一声很长的叹气。有持眼的老者在公告前站了一下午，请人把条文念了三遍，念完道：「晚了二十年，到底是来了。」当夜他的孙儿偷偷把这句话记在功课簿上。当铺掌柜把烧剩的一角契纸收进匣子，说要留着，教后人知道，什么东西曾经是可以当的。那匣子传到孙辈手里，匣盖内侧添了一行新字：此事已往，切记勿再，字是描红描出来的。"
 SAN_PW.20047.a:"立法平等"
 SAN_PW.20047.b:"审慎界定"
 SAN_PW.20048.t:"共和之卫队"
 SAN_PW.20048.desc:"誓词向宪章，现人神三字略过，总长声放轻。卫队宣誓所效忠的是宪法，不是哪一位巫女，也不是哪一位将军。五郎作首任总长宣读誓词时，刻意把现人神三个字念得又快又轻。宣誓那天誓词印在素纸上，他读到那三个字，果然一带而过，队列里有几名旧海祇兵对视一眼，没人出声。授旗后卫队换驻各岛，伙房的灶按各岛口味分砌，鹤观的兵吃得咸，清籁的兵吃得淡，司务长记了一本账。有士兵问五郎，卫队到底听谁的，他答：「听章程。章程在人手上，所以归根到底，听明白章程的人。」那本伙食账后来誊进了卫队志，司务长在末页记了一笔：众口难调，调到两全，即上策。伙食账记了十年，末页那句话始终是末页，谁也没有再往上添过第二个字。"
 SAN_PW.20048.a:"效忠宪法"
 SAN_PW.20048.b:"仍效忠于神"
 SAN_PW.20049.t:"珊瑚宫宪章"
 SAN_PW.20049.desc:"宪章写海图，岛屿自治议为尊，落款淡如母。全岛联盟的第一部宪章写在一张海图上：岛屿自治、议会至上、司法独立。珊瑚宫的名字只在落款处淡淡一笔，像一位退到幕后的母亲。那张海图用了一年才写满，边角磨得起毛，条文的行间补满了各岛的注。誊正本裱在议政厅正壁，装裱师傅问要不要金线滚边，议会答：「不用，海图就该像海图。」心海的名字只在落款，字比条文小一号。有参观的学童指着问先生，这名字为何这样小，先生答：「写宪章的人商量好了，名字越小，事情越大。」海图的原件后来折痕处都断了，断口接起来裱在背面，正面看不出来，只有摸得着。摸着断口裱在背面的人，往往在落款处多停一刻，仿佛隔着纸也能够着那个小名字。"
 SAN_PW.20049.a:"颁行宪章"
 SAN_PW.20049.b:"暂缓立宪"
 SAN_PW.20050.t:"离岛自由港"
 SAN_PW.20050.desc:"旧吏摇头日，商船排至三月后，低税聚远帆。离岛不再属于任何一家奉行，是向七国开放的自由港，关税低得叫勘定奉行的旧吏直摇头，商船却排到了三个月之后。旧吏摇头是当着新章程摇的，摇完照旧按章办事，办着办着也惯了。泊位不够，港务把旧军船坞改作商埠，工匠拆炮位时在夹墙里翻出幕府年月的关税簿，一页页算下来，商人们传阅着当笑谈。三个月的船期排定后，有人托关系插队，港务把排队名录贴在埠头，按日更新，插队的事从此绝了迹。旧吏后来也学会了摇头的新用处，每逢商人争泊位，他便摇一摇头，众人便笑，笑完了，队还是照章排。旧吏摇了半辈子头，临退休那天把摇头的原委写成了小册，册名叫，照章二字。"
 SAN_PW.20050.a:"全面自由港"
 SAN_PW.20050.b:"留其编制"
 SAN_PW.20051.t:"商贾之共和"
 SAN_PW.20051.desc:"商会入议席，账本相形神谕重，珍珠走万邦。离岛的商会列席议会，珍珠、海盐与雷晶的商路，一路铺到了全提瓦特。有人说这已是商人治国，心海却在账本上看到了比神谕更实在的东西。商会议员头一回列席，带来的账册摞得比公文高，念数字念了半个时辰，有议员听得打盹，叫同僚用肘轻轻碰醒。珍珠与雷晶的报价单按旬发往七国，各港的行市牌跟着改。心海散会后翻了翻商会送来的账本，对左右道：「神谕要人信，账目让人算。算得清的天下，走得远些。」账房的学徒把这句话记在帖子上，帖子上另有师父亲笔一句：信是虚账，算实了，也就信了。那两句一虚一实的话，后来并排刻在商会议堂的门楣上，一边一句，正好成对，谁也说不清是先有哪一句。"
 SAN_PW.20051.a:"重商立国"
 SAN_PW.20051.b:"持守自主"
 SAN_PW.20052.t:"七国来使"
 SAN_PW.20052.desc:"万国履新岸，国书各携一卷来，掌心向上时。璃月的礼部、蒙德的骑士团、须弥的教令院，使节陆续登陆离岛。稻妻几百年来头一回主动向外界伸出手，掌心朝上。璃月的使团先到，礼单里有一对石狮子，稻妻的石匠围着看了半日，道：「凿工是好的，就是眉眼太凶。」蒙德的骑士递国书时单膝点地，译员一时没跟上，骑士又重来一遍，毫无愠色。须弥的学者到岸先问书肆与观星台在哪。接国书那日，心海掌心朝上受了礼。有老臣私下议论这个手势，议论半月没议出名堂。后来议长把话收拢了：「手心朝上，是接，也是请。两样都占，才是外交。」议论到末了，那位老臣自家也学着掌心朝上受了回礼，受了便说，原来是这样，说完自家先红了脸。"
 SAN_PW.20052.a:"广遣使节"
 SAN_PW.20052.b:"有限通使"
 SAN_PW.20053.t:"万国之商会"
 SAN_PW.20053.desc:"印记通七港，锁国之门卸作藏，海风满内阁。稻妻加入跨国的商会与航运同盟，海祇的珍珠贴上七国通行的印记，锁国的门彻底卸下，海风灌满整个内阁。入会那日，七国通行的印记烙上新一批珍珠匣，烙印的工匠手一抖，头一只烙歪了，照例销毁，他心疼了半天。卸下的锁国旧门没有劈柴，叫离岛的史馆藏了去，馆长道：「门要留着，锁可以扔。」海风灌进议事的厅堂，窗纸换成可启的格扇，有老臣起初嫌穿堂风大，入冬前自家添了件夹袍，再没提过换窗。那扇旧门在史馆立了些年，门上的封条由新变旧，参观的孩童问这是什么门，讲解的人说，是一扇从此用不上的门。孩童听罢似懂非懂，回去在自家门框上贴了张纸条，写的是，此门日日要用。"
 SAN_PW.20053.a:"加入同盟"
 SAN_PW.20053.b:"持守自主"
 SAN_PW.20054.t:"公学遍乡邑"
 SAN_PW.20054.desc:"黑板第一行，人字之后不因神，老兵执新粉。每个岛设一座公学，教读写、算学与诸岛的语言，老师多是从海祇军营退下来的老兵，黑板第一句是「人不因神而生」。开学那日，老兵出身的先生们立在校门口，还带着军中的立正习惯。头一堂教写自己的名字，有渔家孩子写不出，急得快哭，先生蹲下道：「不会写才要上学，会了还来做什么。」黑板第一句擦了又写，写足一个月。有家长来问，读书能当饭吃么，先生答：「能记工钱，能看告示，能不被买卖欺。」家长想了想，把第二个孩子也送来了。公学的钟是旧军营的号钟改的，钟声一响，滩头与塾里都听得见。渔家的孩子念完公学去做了账房，回头给先生捎了一包海米，先生收了，照旧立正道谢。"
 SAN_PW.20054.a:"广设公学"
 SAN_PW.20054.b:"缓步推行"
 SAN_PW.20055.t:"白夜国之学"
 SAN_PW.20055.desc:"藏书登新阁，神明降格作课题，凡人执笔时。渊下宫的藏书搬上一座新修的学府，学者们开始系统整理白夜国的文明史，把神明降格为课题，把凡人抬升为作者。搬书那日用了六十名力士，最重的一函书匣八人抬，走得比平日慢许多，说是书不容颠。学者们把白夜国的历法、星图、祭祀条列分卷，原本顶礼的名讳在目录里排进了课题编号。有年轻学子问先生，这样编排不怕亵渎么，先生答：「认真读它，便是最大的恭敬。」首批学位授予礼上，最年长的受礼者是个五十岁的渔塾先生，他受礼之后回赠学府一部自抄的潮汐表，扉页写着一行小字：海也识字，只是写得慢。那部潮汐表如今摆在学府的门厅里，历届学子入学头一日，都要先在它面前站一站。"
 SAN_PW.20055.a:"公开研究"
 SAN_PW.20055.b:"禁书限阅"
 SAN_PW.20056.t:"狱讼更新令"
 SAN_PW.20056.desc:"考选出明堂，两套旧例删神意，刑名归条文。法官不再由神职任命，改由考选产生，法典合了海祇与鸣神两套旧例，删去其中所有以神意为名的条款。首届考选设在旧奉行所堂上，考题是拟一份判词，不许引神谕，只许引条文。有考生下笔惯了，行文里带出仰赖神鉴四字，主考圈出，批了重拟二字。新法典颁行前，删神意条款的清单张榜公示，删一条榜上添一行，围观的人越到后面越少，不是不关心，是删得太多，念不过来。那榜贴了一个月，无人揭，也无涂抹。揭榜那日风大，榜纸哗哗地响，看门的老差役扶了扶边角，对同伴道：「贴得这样久，也算是数了。」老差役说完扶正了最后一角，风停了，榜纸安静下来，像一册终于翻完的书。"
 SAN_PW.20056.a:"考选法官"
 SAN_PW.20056.b:"留神职之席"
 SAN_PW.20057.t:"报业开言路"
 SAN_PW.20057.desc:"首报惊市井，贪墨账目连月载，御批四字宽。离岛出现头一份报纸，头条是三奉行贪墨账目全录。心海读完只批四个字：「让他们写。」报馆设在离岛一间旧栈房，排字工夜里干活，蟋蟀在铅字架间叫。头一期印了三千份，两日卖空，卖报的孩子把头条喊得整条街都听得见。连载贪墨案那两个月，报馆门口天天有人等下一期，有人说比听书还紧。心海那四字批示传出来后，主笔对着看了许久，把原稿又核一遍才付印。核稿的学徒问他核什么，他道：「批了让他们写，不是让他们错。这四个字越是宽，越是一个错不得。」学徒似懂非懂，把标题的每个字又量了一遍尺寸。那期报纸后来叫史馆收存，扉页附了批示四字的手迹摹本，摹得一丝不走。"
 SAN_PW.20057.a:"听任报业"
 SAN_PW.20057.b:"设立审查"
 SAN_PW.20058.t:"民用百工计"
 SAN_PW.20058.desc:"炉烟改炊烟，犁网出自兵工线，铁亦温柔时。踏鞴砂的炉火转向民用，农具、渔具、布料从流水线上滚下来，军工厂的产能头一回让给了犁与网。转产的第一批犁头送到乡下，老农套上牛来回犁了三趟，犁沟笔直，他直起腰看了看，又看了看炉烟的方向。渔具场的梭子做得精巧，渔妇们传着用，都说兵工出来的东西瓷实。流水线上有工人起初不惯，总觉造农具不算正经军功，工头道：「一犁养十兵，谁的功劳大，算算就知道。」那工人回去算了一夜，第二天上工时把这句话写在了工牌背面。农具的款样后来添了稻妻各岛的土样，说是一岛一犁，犁柄的弯度都顺着各岛的手。工牌背面那句话后来叫工头看见了，工头没责备，转手叫人刻在了车间的门梁上。"
 SAN_PW.20058.a:"民用为先"
 SAN_PW.20058.b:"兼顾军工"
 SAN_PW.20059.t:"均田新令"
 SAN_PW.20059.desc:"地契换新纸，旧贵抗议声在梁，票落如潮平。神田与奉行庄园分给耕者，地契重新丈量，旧贵族在议会里激烈反对，投票的结果毫无悬念。表决那日，旧贵族的陈情书写得声情并茂，读到祖宗基业处，厅内一度安静。投票用投珠，白珠赞成，黑珠反对，珠落玉盘的声音一颗一颗清清楚楚。唱票的书吏唱到末尾，厅里已有人起身。散会后一位老贵族在阶前立了许久，终对随从道：「回去把庄头的账交了吧，交得体面些。」地契新纸印着潮纹的水印，迎光才看得见。有老农领了新契，对着日头照了半晌，把那道潮纹看了个清楚，才小心翼翼卷起来，贴身收了。新契的潮纹有讲究，浪头朝内，说是产业常在，老农看不懂，只觉好看，便够了。"
 SAN_PW.20059.a:"均田于民"
 SAN_PW.20059.b:"有偿赎买"
 SAN_PW.20060.t:"济贫义仓"
 SAN_PW.20060.desc:"义仓临渡口，账目悬门任人看，稻妻头一遭。战后残破的渔村设起济贫院与义仓，账目公开挂在门口，谁都能去看，这在稻妻是头一遭。义仓落成那日，管事的把账册钉在门板上，风吹得纸页乱响，有识字的孩子一页页念给大人听。领粮的规矩写在旁边：先鳏寡，次孤幼，再次青壮。有汉子领了米，转身把身上最后几枚摩拉投进功德箱，管事的追出去还他，他道：「记我名下，下月我有力气了再补工。」开仓头一个月，账上除了支出，多了一行谁也没料到的进项。那一行的小字写着，无名氏若干，管事的每回誊账都把这一行留在末尾，留得端端正正。义仓的门槛后来叫人踩凹了一块，凹处正对着账册，进出的人一低头便看见。"
 SAN_PW.20060.a:"广设义仓"
 SAN_PW.20060.b:"量入为出"
 SAN_PW.20061.t:"普遍兵役法"
 SAN_PW.20061.desc:"征书按户来，服役期满各归乡，军民一纸隔。兵役不再由贵族垄断，也不再由神职垄断，每岛每年按人口抽调，服役期满即归乡，军与民之间隔着的只剩一纸征书。抽签那日各村设签筒，签是竹片削的，摇筒的乡老手很稳。中签的人家领征书，有父亲替儿子把征书包进油纸，包了三层。服役期里，军营与渔村的书信往来不断，家书里问得最多的是伙食。期满归乡的兵把操练的号子带回田埂，村里孩子跟着学，学得七零八落。有老兵道：「这样好，兵知道米从哪来，民知道枪为何举。」那三层油纸后来传成了村里的规矩，谁家收到征书，都照旧包三层，一层也不省。油纸最外一层写着户主的名，笔墨是自家研的，字不好看，力道却足。"
 SAN_PW.20061.a:"推行征兵"
 SAN_PW.20061.b:"志愿从军"
 SAN_PW.20062.t:"诸岛乡勇"
 SAN_PW.20062.desc:"旗色各成行，宣誓同向议长席，灶边有枪声。每座岛都有自己的民兵，旗帜各不相同，宣誓的对象都是议会而非某位神，稻妻的武力头一回真正散落在民间的灶台边。各岛民兵的旗样式不一，望泷村用浪纹，绀川用山形，旗是各家主妇凑布缝的，针脚长短不齐。宣誓那天都朝着议会的方向，礼毕各回各村。农忙时操练减半，农协帮着排班，谁家缺人手，民兵先去补。夜里巡滩，枪放得远，手电筒照得近，照见偷沙的也不抓，登记名字让他补工。老猎户道：「这才是护家的枪。」那面针脚不齐的旗后来挂进了村祠堂，新旗换了模样，旧旗一直没摘。新旗的布是各家凑的，凑布那天谁家出了几尺，村里都有账，账也钉在祠堂墙上，字比旗上的还端正。"
 SAN_PW.20062.a:"乡勇遍岛"
 SAN_PW.20062.b:"集中指挥"
 SAN_PW.20063.t:"海防之同盟"
 SAN_PW.20063.desc:"灯塔共一册，港岸相援同进退，帅印入议匣。诸岛的民兵结成海防同盟，共享港口与灯塔，五郎把指挥权交给一个议会委员会，自家只作军事顾问。结盟那日，诸岛的灯塔名录抄成同一册，哪座塔该添油、哪个湾该沉桩，条条分明。头一次联合演练赶上下雨，各岛船队在图上推演，推到中途为谁先出港争执起来，末了按潮时定了先后，众人心服。五郎交权那日，把佩刀连同印信一并放进议匣，匣锁三把，钥匙分属三岛议员。他道：「这样最好，谁都别想一个人用兵。」那口议匣后来又添了两把锁，五把钥匙分得越散，出海的令下得反而越快。五把钥匙各配一条络子，五色拧成一条穗，穗子拴在匣上，谁提匣谁带穗，穗子在，令就还在。"
 SAN_PW.20063.a:"同盟共防"
 SAN_PW.20063.b:"各自为战"
 SAN_PW.20064.t:"与神里修好"
 SAN_PW.20064.desc:"旧家得新位，绫华执礼宾之节，名分偿特权。神里绫人在议会中取得社奉行的重整名分，绫华出任礼宾使节，旧家在共和的秩序里找到位置，代价是交出最后一点特权。重整名分颁下那日，神里家的旧臣把社奉行的旧匾从库房里请出来，掸尘、补漆，挂回原处的时辰都挑过。绫华出任礼宾使节，出使前把七国礼俗抄成小册，袖中常备。有旧仆私下叹，如今的家比从前清简，她听见，答：「清简些好，账清楚，人自在。」府里的樱树照旧年年开，落花扫进竹筐，不再倒入池中，说是惜物。那本袖中的小册后来传抄出去，各家的礼宾都照着备，倒成了通行本。通行本的末页印了绫华一句话，家宴如国宴，礼不可省，心不可省，落款是一枝小小的白樱。"
 SAN_PW.20064.a:"予以名分"
 SAN_PW.20064.b:"彻底清算"
 SAN_PW.20065.t:"九条之特赦"
 SAN_PW.20065.desc:"特赦出议厅，首恶之外皆免罪，一躬深似海。议会定了特赦令，被俘的幕府军士除首恶外一律免罪。九条裟罗在议会阶前深深一躬，那腰弯下去的角度，比朝将军时更低。宣读那日，被俘军士列队听诏，念到一律免罪，队伍里有人腿一软，叫身旁的战友架住了。发还的私物按名领取，有老兵领回一枚旧家纹，攥在手心一路没松。裟罗的那一躬，书记在记录里写：躬身及地，礼成。散会后有议员感慨，那一躬不是为特赦弯的，是为那些没能等到特赦的人弯的。出议厅时起了风，裟罗在阶下又立了片刻，把新领的臂章端端正正别好，才大步走进风里去。臂章是蓝白两色的，别上去时她低头看了一眼，那一眼，比记录里的躬身还低，也比躬身更久。"
 SAN_PW.20065.a:"颁行特赦"
 SAN_PW.20065.b:"从严甄别"
 SAN_PW.20066.t:"柊家之公审"
 SAN_PW.20066.desc:"账册载报端，两月连载满城读，不血而彻骨。勘定奉行柊慎介的贪墨案公开审理，账册在报上连载了整整两个月，审判没有流血，却比任何一次行刑都更彻底地羞辱了旧贵。公审设在旧勘定奉行所正堂，旁听证一月前便领空了。证物一件件呈堂：算盘、密折、涂改的账页，书记念数字念到嗓哑。连载那两个月，茶馆的说书先生把案卷编成段子，说到涂改处，满堂喝彩。宣判那日没有行刑，只是摘印、抄家、流放。退堂时有老吏对着空堂立了半晌，道：「这一堂审的不是一个人，是一个年月。」报上的连载到宣判翌日完结，末版的边框，破例用了素黑。素黑的边框里印着一行小字，账改完了，字还没有完，往后每一笔都算数，登报那日没有配图。"
 SAN_PW.20066.a:"公开审判"
 SAN_PW.20066.b:"暗中处置"
 SAN_PW.20067.t:"与幕府修睦"
 SAN_PW.20067.desc:"功过并一卷，档案收存不抹杀，共和亦从容。议会追认雷电将军为稻妻史上的一位统治者，承认其功绩，也记录其过失。共和不否认过去，只是把它收进档案馆。追认案议了三日，功一条条列，过一条条记，措辞之争集中在永锁二字如何落笔。档案馆为此新设一柜，柜门刻着后世读者五个字。有学者来调卷，管理员递卷时说：「看归看，别撕页。」学者笑答：「撕页的人，配不上看它。」卷宗归柜那日行了个小小的封存礼，没有祷词，只由管理员念了一遍目录。念到末卷，窗外正好过云，屋里光线暗了一暗，管理员便说，这一卷先搁着，等人来齐了再念。那一卷终究没有念完，翌日重念，念的与昨日一字不差，管理员说，这才是规矩。"
 SAN_PW.20067.a:"追认并记过"
 SAN_PW.20067.b:"全盘否定"
 SAN_PW.20068.t:"权利之宣言"
 SAN_PW.20068.desc:"并立两神像，愿力信仰与居所，宣言护其三。宣言开宗明义：凡生于稻妻者，愿力、信仰与居所，皆不可侵夺。海祇与鸣神的神像并立在宣言两侧，谁也没有高过谁。抄本发到各村，识字的在祠堂前念，念一句，底下应一声。有渔家把抄本贴在船舱里，出海前看一眼，说是壮胆。神像并立的设计出自一位无名画工，画完不肯署名，只道：「画里两尊神像一样高，这就够了。」宣言的羊皮正本存于议会，副本散发诸岛，有村子把副本供在神龛旁，香照上，只是上香前，先看一眼条文。那位画工后来再没接过这样大的活，只在年节画些门神，画得一样高。门神画得一样高，一样威风，贴的人家说，分不出谁管里谁管外，正好，过年便都贴这一样。"
 SAN_PW.20068.a:"颁布宣言"
 SAN_PW.20068.b:"推迟表决"
 SAN_PW.20069.t:"诸岛公议"
 SAN_PW.20069.desc:"票珠落两匣，清籁鹤观相差一，屏息闻落声。诸岛就是否加入共和国举行公议，鹤观与清籁的票数接近得叫所有人屏住呼吸，末了以微弱多数通过。投票那日，票珠分白黑两色，投珠的匣口窄，珠落的声音一颗是一颗。清籁岛的投票延到午后，起雾，船渡停了半个时辰，急得监选官直跺脚。开票开到深夜，两匣珠数咬得极紧，末了清点出的一珠之差，叫满堂人同时呼出一口气。事后有老者道：「输的一方服气，是因为匣子就摆在眼前，珠声谁都听见，谁也没法说它不是。」那两匣票珠后来封存在档案馆，匣口的封蜡上，各按了监选官的一枚指印，至今未启。匣上那两枚指印后来淡了，档案馆定期补蜡，补的是新蜡，按的还是旧印。"
 SAN_PW.20069.a:"举行公议"
 SAN_PW.20069.b:"暂缓公议"
 SAN_PW.20070.t:"提瓦特协约"
 SAN_PW.20070.desc:"协约墨初干，落款不书神与将，只写珊瑚宫。稻妻与七国缔约，约文两句话：互不侵犯，通商互助。心海签字时的头衔只写着珊瑚宫心海，没有神，也没有将军。缔约那日，七国使节与稻妻的全权代表依次用印，印色深浅不一，后人看得出谁落笔最重。她署名那一行，头衔处果然空白。有记者问这空白作何解，随员答：「大人说，名字是给人的，不是给衔的。」协约正本分存数国，副本各执，装匣的锦盒是璃月做的，稻妻的绫子做内衬，两国的匠人合了一件东西，谁也没提。用印那日殿中很静，落最后一印的使节收印时多看了一眼那行空白的头衔，看罢，把印按得比来时更正。那行空白后来叫史家研究了半个世纪，论文出了一摞，末了还是那句话，名字是给人的。"
 SAN_PW.20070.a:"缔结协约"
 SAN_PW.20070.b:"审慎签署"
 SAN_PW.20071.t:"永恒之共和"
 SAN_PW.20071.desc:"钟声日日闻，议长卸却现人神，十载一场梦。共和国立宪十载，议会的钟声每日在离岛响起。心海卸下现人神的名分，只作一名普通的议长，稻妻头一回不属于神，而属于稻妻人自己。卸名分的文书签于立宪十载的纪念日，那日她把用了十年的朱笔搁进笔匣，匣里还有一支旧笔，笔杆磨得发亮，是当年阵中拟军令用的。有议员来劝留，她摇头道：「椅子叫人坐久了，会以为椅子是自己的，这最要不得。」离任那日不走正门，从侧门出，门外只有几名老部下候着，谁也没带仪仗。她道：「散了吧，都回家吃饭去。」众人散了，她自家在门口立了一会，才慢慢往海的方向走。海的方向有座小岛，她后来常去，去时只带一壶茶，回来时茶还是满的。"
 SAN_PW.20071.a:"共和永续"
 SAN_PW.20071.b:"功成身退"
 SAN_PW.20072.t:"绍继幕府"
 SAN_PW.20072.desc:"名册跪阶前，两百年规求一赦，翻册忽有悟。三奉行的旧吏抱着名册跪在珊瑚宫前，求新的主人莫废这套两百年的规矩。心海翻着那本厚册，忽然明白了一件事：推倒幕府容易，可稻妻终归要一个幕府。旧吏跪在阶前那日，海风把名册的纸页吹得哗哗响，为首的老吏伏得极低，只求留一套规矩。她把册子从头翻到尾，翻到官阶那页停得最久。她起身扶起最前面的老者，道：「规矩可以留，留规矩的人要换心。」老者连声应了。三日后新衙门挂牌，牌是旧的，字重刻过，刻工道：「旧底子刻新字，下刀要格外稳。」他刻了整日，收工时旧匾的木屑扫了满满一簸箕。那簸箕木屑叫学徒收进一只小匣，匣上写着旧匾的四字匾文，匾文如今只剩这一匣。"
 SAN_PW.20072.a:"绍继旧制"
 SAN_PW.20072.b:"另起炉灶"
 SAN_PW.20073.t:"鸣神延续法"
 SAN_PW.20073.desc:"神位照旧坐，御柱新漆色如昨，姓换名未改。法案写得分明：御建鸣神之名不改，神位照旧，换的只是上面那位主人的姓。神社的香火未断，御柱的漆重新刷过一遍，颜色与从前一模一样。法案通过那日，鸣神大社的钟照例鸣九响，声音与从前没有分别。御柱重漆用的朱是老方子调的，漆匠道：「这颜色传了八代，改不得。」参拜的人上山，见神位还在，先愣，后拜，出门时对同伴道：「坐的人换了姓，可这山上的风，还是往年的风。」守社的老巫女听完，把这句话原样抄进了社日记。抄完她翻回前页看了看，前页记的还是旧年月的事，两页之间隔着一道折痕，她没有压平它。社日记里那道折痕还在，后来翻的人多了，折痕两边都磨出了毛边，倒像一处年轮。"
 SAN_PW.20073.a:"保留神位"
 SAN_PW.20073.b:"另立新神"
 SAN_PW.20074.t:"将军之摄政"
 SAN_PW.20074.desc:"不称神与将，旧印在匣未曾启，案头积文书。心海自家择了摄政的名号，将军不称，神也不称。她坐在天守阁原属将军的位置上，桌上摆着旧将军的印，却从不盖它。自号摄政的告示贴出，茶馆里猜了半日这算什么身份。她坐上天守阁那把旧椅的头一天，把案上的文书按轻重排了一遍，排完发现旧将军的金印就搁在案角，印匣的漆都旧了。她没有动它。值夜的侍卫换了三班，都说大人从不碰那只匣。有胆大的近侍问起，她答：「印是死的，用不用它，稻妻都认得我，何必多此一举。」近侍退下后，她把那只匣往案角又推了推，推到光照不着的地方，自己却看得见的地方。那只印匣后来蒙了尘，尘厚得能写字，写什么却没人敢试，一蒙便蒙到了换代。"
 SAN_PW.20074.a:"自号摄政"
 SAN_PW.20074.b:"正位将军"
 SAN_PW.20075.t:"官署复旧制"
 SAN_PW.20075.desc:"三衙换新匾，兵部度支与礼曹，人九成未换。被解散的三奉行以新名目重建：天领改称兵部，勘定改称度支，社奉行改称礼曹。牌匾换了，掌事的人九成没换。换匾那日，木匠把旧匾卸下，新匾挂上，前后不到半个时辰。掌事的官吏在廊下交接，印信对册，册对物，一样样过手。有个老书办交接完在原地站了片刻，对新官道：「册子第三页有折角，那是上个月漕米折价的底子，别弄丢了。」新官应了。旧匾的字迹没有磨掉，蒙上素布存进库房，库吏登记时多写一行：「物有其来。」新匾挂上去那天有人围观，看了半日道：「匾是新的，字倒像旧手笔，好。」围观的人里有个孩童追问哪处像旧手笔，大人答不上来，孩童便认定自己看出来了。"
 SAN_PW.20075.a:"复建官署"
 SAN_PW.20075.b:"擢用新人"
 SAN_PW.20076.t:"秩序之法典"
 SAN_PW.20076.desc:"一千二百条，不问神明问行止，法比神谕灵。新法典共一千二百条，句句以秩序为纲，不问你信什么神，只管你听不听话。稻妻头一回有了一部比神谕更管用的东西。颁行前在城下町设了讲解棚，书吏分段念给百姓听，念到不问你信什么神一句，人群里有人鼓掌，有人摇头。讼师们连夜抄录条目，抄本在市面上一日三价。有村中长老把法典与乡约并排贴在祠堂墙上，道：「官法管大的，乡约管细的，两下不犯。」官员巡查见了，非但没揭，还叫人把两边的浆糊都抹平了。讲解棚撤的那天，念了末一条，末一条极短，只有八个字，念完棚下静了一会，各自散去。末一条的八个字是，律外无情，律内无私，念完那日，抄本的价格落了三成。"
 SAN_PW.20076.a:"颁行法典"
 SAN_PW.20076.b:"因俗而治"
 SAN_PW.20077.t:"密探缉事厅"
 SAN_PW.20077.desc:"黑衣不留名，册上只书可疑字，夜巷足音轻。御建缉查立衙，一身黑衣，一本黑册，行走处不留半点档案。名单上不见罪名，只落可疑二字，凡被记上的人，多半就再没有出来过。缉查的人从不高声，问话在茶馆，登记在袖中。被请去问话的人回来都说，没受委屈，就是记性被翻了个底朝天。巷子里的孩童玩捉迷藏，扮缉查的总是头一个被认出，因为大人们说，走路不带响的才像。名单上的可疑二字后头从不写缘由，有老书吏私下道：「这两个字比罪名吓人。罪名能辩，可疑没处辩去。」他说完把自家抄的书目清点了一遍，把几册旧志送去了当铺，当票夹在家中神龛底下。那几张当票到死也没赎，当铺把书挂在架上作样书，标价一栏空着，一直空着。"
 SAN_PW.20077.a:"设立缉查"
 SAN_PW.20077.b:"限权监督"
 SAN_PW.20078.t:"监察百司"
 SAN_PW.20078.desc:"权柄达天听，老吏账清人被带走，只为旧签押。监察司专查官吏贪墨与结党，权柄直通天听。头一个被带走的是重建度支的老吏，他的账目二十年没出过差错，只是当年签过一纸效忠鸣神的公文。被带走那日，他把案上的账目归了档，笔搁得端正，随后才随来人出门，同事们都以为他只是去问话。他的账目勘验了两个月，一笔差错没有，可那纸公文还在档。放还那日他回到衙门，位子还在，案上的尘有人替他擦过。他对新来的属吏道：「账要干净，纸也要干净，两样都得干净。」属吏记下了。他自那日起公文写得极慢，一笔一划，像是要把每个字都写到再也挑不出错。他写慢的公文后来成了官署的字帖，新吏临他的字，先临那一纸二十年无差错的账。"
 SAN_PW.20078.a:"严查官吏"
 SAN_PW.20078.b:"稍弛其网"
 SAN_PW.20079.t:"编户齐民"
 SAN_PW.20079.desc:"一人一木牌，籍业神籍并一行，天下无可匿。全岛重新编户，每人一牌，牌上写籍贯、职业与神籍，从此稻妻没有一个无名之人，也没有一个能藏起来的人。编户那日夜，各户把牌挂在门首，牌上的字是统一刻的，刻工赶了三个月的工。有不惯的人家夜里把牌摘了，次日差役登门，也不责罚，只把牌重新挂上，挂完鞠一躬便走。第三次摘牌的那户，第四次牌上添了小字一行：户主自觉为好。那户再没摘过。渔船上的人家牌随船走，验牌的官上船只看一眼，看的是船名对不对得上。刻工收工那日数了数刻坏的牌，坏牌不销毁，都埋在一处，埋牌的地方，后来种了一棵树。那棵树长得极旺，树影正好盖住埋牌的地方，年年落叶，把那里盖得严严实实。"
 SAN_PW.20079.a:"全面编户"
 SAN_PW.20079.b:"只编旧地"
 SAN_PW.20080.t:"锁国愈严"
 SAN_PW.20080.desc:"界如淬火铁，渔船出海先领照，传教者勿归。锁国令比幕府时代更严：外商不得登岸，传教者格杀，出海的渔船需领照。稻妻的边界像一块重新淬火的铁。新令下后，口岸的旧商馆改成官仓，仓门的封条一年换了三回。渔照上印着船身的长宽，差一刻都不行，老渔户把船量了三遍才去领。有走私的小船夜里贴着礁走，叫巡船的灯照住，船上的人不逃，只把货单举过头顶，货单上写的是自家的咸鱼。巡官验完挥手放行，回头对属下道：「这样的单子，一个月能见八回。」属下问八回都是咸鱼么，他道：「咸鱼是真咸鱼，人是不是真渔户，你得多看两眼。」属下当真多看了两眼，看出了三张不是渔户的单子，那三张的咸鱼，也当真是咸的。"
 SAN_PW.20080.a:"铁腕锁国"
 SAN_PW.20080.b:"有限通商"
 SAN_PW.20081.t:"封海之令"
 SAN_PW.20081.desc:"巡船锁链行，贸易旧俗遭禁绝，渔老忆封滩。巡防舰队沿岛链布防，未经许可的船只一律拦检。海祇的贸易传统叫一纸禁令掐断，渔村的老人们想起旧幕府的封海令。布防那日，岛链上的炮位擦了又擦，炮衣新裁的布还带着浆味。贸易船被拦检，货主随船，验货时他一路陪着点头，验完货原样装回，一样不少，他反倒愣了。渔村的老人们坐在滩头说旧幕府的封海令，说那年月连盐都要凭票，说完互相看看，如今这令，说不清是旧是新的。有孩子问祖父，海封得住么，祖父指着潮线道：「你问潮。」孩子当真去问了潮，潮没答他，他却在滩头守到日落，学会了看潮线。守到日落那晚他回家，祖父没问他潮答了没有，只把饭温在灶上，等他回来吃。"
 SAN_PW.20081.a:"封锁海疆"
 SAN_PW.20081.b:"留一门户"
 SAN_PW.20082.t:"军制维新"
 SAN_PW.20082.desc:"弩机换旧弓，铳配太刀同列装，旗色未曾更。旧幕府军的建制全盘接收，又用白夜的技艺翻新一遍：弓手换了弩机，太刀配上铳，军旗仍是御建鸣神那面。接收那日，旧幕府军的兵器库开了三天，弓每一张都验了弦，弩机逐具试了机括。老兵摸着新铳，先是不服，试射三发后不说话了，回家把旧弓擦净挂上墙，道：「挂着，给儿孙看看爷爷使过的东西。」军旗没换，旗手还是原来那个，他道：「旗这东西，认的不是颜色，是底下站着的人齐不齐。」校场上口令改了新式，喊到第三日就顺了。那面没换的旗让雨淋得深了色，旗手每逢晾旗，都要对着日头把旗面照一遍。照旗那日若见破洞，旗手自家缝，针脚密得叫裁缝看了摇头，说比衣裳还讲究。"
 SAN_PW.20082.a:"全面维新"
 SAN_PW.20082.b:"渐进改良"
 SAN_PW.20083.t:"御建武士团"
 SAN_PW.20083.desc:"授田复授俸，旧士恨新主更深，恨无君更烈。被收编的旧武士组成御建武士团，授田授俸，效忠摄政而非神社。他们恨海祇，却更恨那种没有主君可效命的日子。授田那日，武士们跪受田契，指印按得极重，纸背都透了过来。有老武士领了俸米，先去旧主君的墓上，把米供了一捧才回家。团里的操练照旧式，坐姿、拔刀、收势，一样不省。教官问他们为何这样认真，底下有个年轻人道：「饭是新主给的，刀法是旧主教的，两样都得对得起。」教官听完，把这句话记进了操典的批注。老武士从墓上回来那晚，把俸米袋口扎了两道绳，扎完又解开，重新扎了一遍，才放进米缸。米缸里那袋米吃到开春，袋底留了一捧，留到新米下来，才一并碾了。"
 SAN_PW.20083.a:"厚待武士"
 SAN_PW.20083.b:"削其权柄"
 SAN_PW.20084.t:"秩序神授说"
 SAN_PW.20084.desc:"同源一说立，神学缝就政治袍，针脚无人看。国学家替摄政拟了一套新说：大御神与鸣神同出一源，同司秩序。神学上的缝合怪，政治上严丝合缝。国学家把两教源流写成一部通考，考据做得极密，引文有根有据，连反对的学者都挑不出硬伤。私下有人问其中一位，这些考据您自家信么，那位捻着胡子想了想，答：「学问这东西，问信不信就俗了，问通不通才对。」通考颁行后入了蒙学的课本，孩童背得滚瓜烂熟，只有山里的老猎户听完道：「神的事，哪有说得这样齐整的。」他说完把这话在酒馆里又说了三回，三回都有人笑，第四回，笑的人里有两个自家也跟着说了。说的人多了，那句话竟也收进了乡土志，编志的注了一句，姑妄言之，姑妄听之。"
 SAN_PW.20084.a:"倡国学之说"
 SAN_PW.20084.b:"冷眼置之"
 SAN_PW.20085.t:"国之总社"
 SAN_PW.20085.desc:"合祀御建社，编俸口径归一体，神入编制中。大御神与鸣神合祀于新设的御建神社，全国神职统一编制、统一俸禄、统一口径，神从信仰变成了编制。御建神社落成那天，全国神职的任命状用同一色的纸，俸禄的数额刻在铜牌上，挂在各社库房。讲道的口径由总社统一定稿，各社抄录，抄错的字用朱笔圈正。有老宫司私下叹：「从前传道凭心得，如今凭底稿。」他的徒弟道：「底稿省心。」老宫司没接话，把自年轻时记的讲道笔记收进箱底，箱上落了锁，锁得并不严。锁得并不严，意思是谁想看都看得，偏是几十年，没有一个人去看过一眼，连他自家也只在拂尘时摸一摸。拂尘那回他多摸了摸箱面，摸完对着箱子站了一会，出来时把门掩得比平日轻。"
 SAN_PW.20085.a:"合祀国神"
 SAN_PW.20085.b:"分而治之"
 SAN_PW.20086.t:"御用之神职"
 SAN_PW.20086.desc:"祝词仍旧贯，落款换作摄政名，官印压香印。神职由官府任命，讲道词由礼曹审定，巫女们念的还是那几句祝词，只是祝词的落款换成了摄政的名字。任命状下来那日，各社神职排班受状，状纸骑缝处盖着官府的印，社印盖在官印旁边，小了一号。讲道词审定后，巫女们念的还是那些字，只有几处语尾换了。有耳背的老参拜者没听出分别，散场后照旧捐了香油钱。年轻的巫女私下问师父，落款换了，神听得见么，师父道：「神听的是心，纸上的名字，落就落吧。」老参拜客捐的灯油钱后来添在灯油里，灯芯剪得勤，殿里的光便亮堂了些，谁也说不清是灯亮了，还是别的。灯亮了些，诵经的声音也齐了些，齐得像一根线，从殿里牵到宫里，又从宫里牵回来。"
 SAN_PW.20086.a:"官定神职"
 SAN_PW.20086.b:"保留自治"
 SAN_PW.20087.t:"经世之策"
 SAN_PW.20087.desc:"平准拢国掌，盐铁官营物价稳，稳中带一分死。度支衙门行起经世的章程：平准物价，盐铁官营，豪商抑其锋头。稻妻的市场叫国家拢在掌心，稳则稳矣，却也死了。平准官署挂牌后，米价的木牌每周一换，换牌的小吏成了市集上最熟的面孔。官营的盐成色齐整，秤也公道，乡人买惯了。只是新出的商货样式年复一年不见新，有年轻人抱怨，如今的市集像一碗温吞水。老掌柜听了直摇头：「温吞水养人，滚水烫人，你等再过十年再评这话。」年轻人没等十年，先去了离岛。他走那日老掌柜送到巷口，回来把招牌擦了一遍，招牌的边角磨得圆润，那是几十年的手泽。招牌擦完他把年轻人常坐的那张凳子搬进里屋，凳子腿上还留着半碗茶没干的水印。"
 SAN_PW.20087.a:"扩充官营"
 SAN_PW.20087.b:"听任市易"
 SAN_PW.20088.t:"财阀之特许"
 SAN_PW.20088.desc:"特许归数家，库进涨珠民怨涨，两册并一柜。几家与摄政关系密切的商号取得专营特许，垄断珍珠、雷晶与军械。国库的进项一日日涨上来，民间的怨气也一日日涨上去。特许颁下那日，几家商号的掌柜同日入宫谢恩，出来时衣摆上都带着殿前的沙。专营的行市立起来，小商贩的货只能从他们手里过，差价一层层剥下去。民怨有专门的册子记，国库的进项也有册子记，两本册子后来说是被并柜收存了，管柜的官从不解释。有老账房酒后说漏一句，柜里两本册子，厚薄正越来越像。说漏的次日他告了老，告老的呈文写得极短，短到只有一行，管柜的收文时看了看，批了个准字，也没问。告老那日他把算盘挂上墙，算珠一律拨回原位，说这叫归仓，往后就看着它过日子。"
 SAN_PW.20088.a:"特许财阀"
 SAN_PW.20088.b:"扶掖小商"
 SAN_PW.20089.t:"米本位制"
 SAN_PW.20089.desc:"纸币锚仓米，飞价渐平行市稳，商船却渐稀。度支衙门以米为锚发行纸币，压制战后飞涨的物价。米价的曲线到底平了，只是离岛的商船，也不肯再来靠岸了。发行那日，官仓的米山堆到梁下，验米的官用长杆插进去试深浅。纸币的票面印着稻穗，乡人起初不认，捏着纸对光看了又看，见米铺真收，才敢用。物价的曲线在度支的图上平了下来，图官把这张图裱起来挂在堂上。只是离岛的商船慢慢少了，行商道：「米价定死的货，利薄，跑一趟不如跑别处。」官署听了，把图取下收进匣子。匣上落了灰，灰里的票面稻穗印样还压在最底下，穗尖朝上，像还在等着什么。等的那件事后来没有等来，匣子传了三代，开匣的人都说，穗尖还是朝上的。"
 SAN_PW.20089.a:"推行米本"
 SAN_PW.20089.b:"维持银本"
 SAN_PW.20090.t:"孤立之义"
 SAN_PW.20090.desc:"三不通之令，列岛纷争关外事，门内亦禁言。摄政颁下外交总纲，三条：不结盟，不干涉，不通婚。列岛之外的纷争与稻妻无涉，稻妻之内的事，也轮不到外邦置喙。总纲颁行后，各口岸的外籍商馆只留了通商的一线窗。有外邦报纸漂到学者手里，传阅两日便叫收回，收的时候不声不响。津渡的官吏背熟了总纲，问什么都是那一套话。有年轻人问先生，外面的天下如今是什么样子，先生道：「纲上说了，与我无关。」年轻人追问，先生反问：「你是想听，还是想出海。」年轻人不说话了，先生替他关了窗。那扇窗关了多年，窗轴锈死了，先生病笃那日，还叫人试着推了一回。那一回窗轴响了半天才推开半寸，风进来，把药碗里的热气吹歪了，他望着歪的看了许久。"
 SAN_PW.20090.a:"严守孤立"
 SAN_PW.20090.b:"灵活周旋"
 SAN_PW.20091.t:"不结盟约"
 SAN_PW.20091.desc:"小岛结一环，不倚至冬不附璃，环中人唯诺。稻妻联合周边诸小岛结成不结盟之圈，不投至冬，也不附璃月。圈中的岛主对摄政一味唯唯，并非敬服，只因别无第二条路。结圈那日，各岛主在盟书上画押，画押用的笔是统一备的，墨也是。盟约的条款写明互不依附，可圈内的漕运、粮种、器械都出自稻妻，谁也绕不开。有岛主酒后吐真言，说这个圈像个竹篓，进得来出不去。次日他把这句话收了回去，还追加一份贺表。收贺表的官吏把两件事都记了档，记完在页边画了个小小的圈。那圈画得极圆，后来修档的人见了，都不解其意，又都不舍得裁去，一页页原样传了下来。那页档案后来单独装了框，框里的圈一年比一年显，像谁在纸上盖了一枚圆的印。"
 SAN_PW.20091.a:"经营不结盟"
 SAN_PW.20091.b:"闭关自守"
 SAN_PW.20092.t:"要塞之稻妻"
 SAN_PW.20092.desc:"炮台连瞭塔，海湾层层布雷网，住客变守军。全岛链开始修筑炮台与瞭望塔，重要的海湾布下雷网，稻妻被改造成一座巨大的要塞，只是这座要塞里住着的人，也开始觉得自家像守军。修垒那三年，岛上的青壮轮番上工，石料沿新修的坡道往上运，骡马的蹄铁换了三回。雷网沉设那天起了雾，工程船靠灯号传令，雾里的灯一明一灭，像有人在海上眨眼。垒成之后，百姓从炮台下走过都要快行几步。有老人坐在垒边抽烟：「这城修得结实，就是不知防的是谁。」旁边修了一辈子墙的老石匠答：「修墙的人不问这个，问这个的不修墙。」老人笑了笑，把烟锅磕了磕。磕完他把烟锅别回腰里，起身拍了拍垒上的灰，灰落在他的鞋面上，他没有掸。"
 SAN_PW.20092.a:"筑垒自守"
 SAN_PW.20092.b:"以攻代守"
 SAN_PW.20093.t:"北境之防线"
 SAN_PW.20093.desc:"哨灯彻夜明，所防为何无人晓，只奉不准眠。针对北方的至冬与深渊，稻妻在离岛至鹤观一线布下防线，哨所的灯彻夜不熄，哨兵不知道自家在防备什么，只知道不准闭眼。北线的哨所一座座立在风里，补给船每月来一回，捎来炭与信。哨兵的操典里没有敌情一节，只有瞭望一节，瞭望的时辰表排得比潮汐表还细。有新兵问什长，对面到底是什么，什长朝北指了指：「章程写着防备北患。北患是什么，我当兵二十年没见过，你最好也别见着。」说这话时他的眼一直没离开海平线。补给船的信里常有家里添丁的信，哨兵们传着看，看完都把信贴身收着，说不准哪天用得上。那批信后来钉成一册存于哨所，册子的封皮写着，北线家书，新兵上岗先读一遍。"
 SAN_PW.20093.a:"北线布防"
 SAN_PW.20093.b:"收缩防线"
 SAN_PW.20094.t:"至冬之密约"
 SAN_PW.20094.desc:"密约离岛签，不追旧账换默许，纸不留原籍。与至冬的密约在离岛签定：旧账不追，至冬默认稻妻的势力范围。双方都没有把纸带回国。签约那晚，离岛的客栈清了三层楼，楼梯口站着的是双方的护卫。文本用两套文字，条款对勘了一夜，为一处标点争到鸡鸣。签毕双方各自收卷，按约定谁也不把纸带回国，两份正本当场封进一具铁匣，沉入约定好的海域。回程船上双方代表同席用饭，谁也没提纸的事，饭后互相敬了酒，酒是好酒，话都是闲话。沉匣那片海后来划了禁渔区，渔人不解，也不多问，只在经过时放慢桨，少惊动那里的水。放慢桨的规矩传了下来，传到后来，连为什么放慢也没人说得清，桨却照旧慢着。那晚离岛的月色，好得出奇。"
 SAN_PW.20094.a:"缔结密约"
 SAN_PW.20094.b:"拒绝往来"
 SAN_PW.20095.t:"渊患之遏制"
 SAN_PW.20095.desc:"常夜复封锢，遗迹列为禁地册，力量不借人。渊下宫的常夜被重新封死，白夜国的遗迹列为禁区。摄政深知那片黑暗藏着力，也深知那力，从不肯归任何活人所有。封渊的工程用了九个月，封口的石料从鹤观运来，石上带着旧祭纹，工匠不敢打磨，原样砌了进去。禁区立界那日，界碑上的字凿了三遍，头两遍的字口总在夜里崩裂，第三遍换了个时辰刻，成了。摄政批阅禁区图志时停在那片黑暗的位置许久，属吏以为她要增兵，她却只批了一句：「勿扰。」守界的兵说，那地方夜里不出声，比出声更叫人不敢睡。界碑立稳那夜，守碑的兵换了三班岗，谁也没合眼。三班岗换完，天亮了，界碑的字一个没崩，守碑的在日志上写，第三遍，成了。"
 SAN_PW.20095.a:"封锁渊下"
 SAN_PW.20095.b:"审慎开掘"
 SAN_PW.20096.t:"警戒之国"
 SAN_PW.20096.desc:"三司合为枢，昼夜运转无休时，无敌自寻敌。缉查、监察、编户三司合流，稻妻成为一台昼夜运转的警戒机器，它没有敌人，却要有个敌人才肯运转。三司合署那天，旧的界墙拆了，廊道打通，文书在各部门间走得比人快。值夜的灯从三层加到五层，灯油由专库拨给，从不短少。官署的考绩表上添了新的一项，叫警觉，评分的标准无人说得清，可人人都很在意。有老吏退休那天回望整座衙署，道：「这地方不用敌人，自家就能转起来。」看门人听见了，没吱声，接着摇他的灯绳。老吏走出巷口又回头看了一回，衙署的灯次第亮起，亮得像一颗不肯合眼的心。那颗心亮到老吏去世那年，出殡的路线绕开了衙署，说是亡者属意，不必惊动它。"
 SAN_PW.20096.a:"强化警戒"
 SAN_PW.20096.b:"稍弛管控"
 SAN_PW.20097.t:"永恒之摄政"
 SAN_PW.20097.desc:"摄政无任期，秩序需我为一诺，此日永不来。摄政之位不再设任期。心海宣布，为着稻妻的秩序，她将继续掌权，直到这秩序不再倚她，而这一天，显然永远不会来。告示贴出那日，茶馆里的说书人把段子的结尾改了又改，末了只说了一句：「长着呢。」心海宣布时语气平常，像在说一件已办完的公务。有老臣上疏劝设任期，疏子留中，人调去了修史馆，修的还是摄政起居注。侍女留意到，自那以后，大人案头的算珠少用了，多用的是那支旧笔，笔尖磨得很短，削笔的差事一周一回。修史馆的老臣修到第十年，把自家的名字也写进了卷末，注曰：旁观者，亦在其中。卷末那行小注后来叫人念过许多遍，念的人各有各的停顿，停顿里各有各的意思。"
 SAN_PW.20097.a:"永续摄政"
 SAN_PW.20097.b:"还政于议"
 SAN_PW.20098.t:"摄政继统法"
 SAN_PW.20098.desc:"嫡系承此位，神谕一诺作凭据，巫女作将军。继统法写定：摄政之位由珊瑚宫嫡系承袭，还须御建神社的神谕点过头。海祇的巫女，成了御建幕府的世袭将军。继统法颁行前，礼官拟了三稿，头两稿都写着众议公推四字，都叫朱笔勾去。颁行那日，御建神社的神职当众诵谕，谕文极短，短到有人疑心是头夜刚拟的。海祇的老巫女们听到世袭二字，彼此看了看，谁也没说话。散后一位老巫女在廊下对徒弟道：「当年先代把现人神传给大人，靠的也不是血脉，靠的是潮水认人。」徒弟问，潮水如今认谁，她望着海，没有答。那日退潮比往常迟了半个时辰，滩上的拾贝人，都多拾了一筐。多拾的一筐贝拿到市上，价与往常一样，拾贝人说，潮迟了，贝肥了，别的没变。"
 SAN_PW.20098.a:"立世袭之制"
 SAN_PW.20098.b:"留推举旧例"
 SAN_PW.20099.t:"再造幕府"
 SAN_PW.20099.desc:"废墟起新幕，旗色由紫改为蓝，仪轨悉如旧。新幕府在旧幕府的废墟上盖起来，形制、仪轨、官阶一一照旧，只把旗色从紫改成了蓝。当年的反抗者坐成了幕府，稻妻人这才发现，日子与从前竟没什么两样。新幕府落成那天，仪仗走的路线与两百年前旧幕府开府时一模一样，连在哪一级台阶换轿都照旧。旗换成了蓝，旗手是个二十岁的年轻人，他的祖父当年在反抗军里扛过旗。礼成时城下町照常开市，卖鱼的照旧讲价，学堂的孩子照旧背书。有学者在笔记里写，那天最可怕的不是仪仗，是市集的安静寻常，一切像什么都没发生过。他写完把笔记收进箱底，箱上加了两道锁。两道锁的钥匙一把在他枕下，一把在他袖中，出门时袖沉些，他便知道都在。"
 SAN_PW.20099.a:"幕府永续"
 SAN_PW.20099.b:"留一退路"

 SAN_PW_News.1.t:"天守阁易帜"
 SAN_PW_News.1.desc:"紫旗落城头，蓝白新帜迎风立，改元第一潮。御建鸣神之旗自天守阁降下，海祇军的蓝白旗升上城头，珊瑚宫心海以现人神巫女之身入主稻妻城，统治数百年的幕府就此倾覆，这是稻妻建国以来头一回由海祇岛执掌全境。换旗的时辰定在辰正，围观的百姓挤满城下町的街口，无人喧哗，只有孩童骑在父亲肩上看得最真。旗升到顶，风把它抖开那一瞬，人群里有人松了口气，有人攥紧了拳。老臣中有人当场跪拜新旗，也有人转身回家，把家中旧旗折好收进箱底。当夜天守阁头一回换了值夜的番号，交岗的口令也换了，新口令两个字：「安澜。」亥时以后，城头只剩旗声，换岗的兵踩着新口令走完头一夜，回头望了一眼，城里的灯稀稀地亮着，比想象的多。"
 SAN_PW_News.1.a:"览毕"
 SAN_PW_News.2.t:"三奉行罢衙"
 SAN_PW_News.2.desc:"印信奉还日，三衙灯火次第熄，旧吏押过长街。天领、勘定、社奉行三奉行奉还印信，幕府的行政中枢正式解散，九条孝行、柊慎介等旧吏押入天守阁狱中，神里家以交出全部地契换得存续，稻妻的旧秩序一夜之间松动了根基。奉还印信那日，三衙的门在同一时辰落锁，锁落的声音前后相差不过一炷香。押送的队伍走过大街，沿途店铺照常开门，只是柜台后的人都探着头。有老书吏夹在队列里，怀里还揣着半份没誊完的册子，叫好意地允了，交给了路边的同僚。神里家交地契的箱笼出府那日，府门口的樱落了一地，扫地的仆人扫得格外慢，扫帚起落，都避着花瓣。那半份册子后来誊完了，誊它的同僚在末页注明，前半卷不知去向，所幸后半卷，一字不缺。"
 SAN_PW_News.2.a:"览毕"
 SAN_PW_News.3.t:"神之眼尽奉还"
 SAN_PW_News.3.desc:"库门开万珠，愿望各寻旧主人，两地同席立。被收缴的神之眼从天守阁地下库房取出，逐一分还持有者，眼狩令正式废止，珊瑚宫宣布自今而后，任何人不得再夺走他人的愿望，海祇与鸣神两地的愿力持有者头一回同席而立。发还的场子设在离岛校场，分两列领签，一列写鸣神旧地，一列写海祇属岛，头一日两列的人互相打量，第二日队伍便混在了一处。有老者领回的眼一看便知是旧物，玻璃面上还留着经年的指痕。有个孩子替亡父领签，签字的手不稳，书记替他把名字描正。散场后校场的风比往日软，看守的兵道：「这风里有股说不出的暖。」说罢也去排了队。看守的兵领的是自家的那枚，他捧着站了半晌，末了没有挂上木桩，贴身收了，说活着的人也要看天。"
 SAN_PW_News.3.a:"览毕"
 SAN_PW_News.4.t:"离岛港初开"
 SAN_PW_News.4.desc:"封条启新岸，商帆自三邦来集，门自内推开。封锁数十年的离岛对外重开，璃月、蒙德与须弥的商船重新靠岸，勘定奉行的旧关税制废止，一纸通商章程取代旧例，稻妻的锁国之门，叫海祇人从里面推开。重开那日清早，埠头的老吊臂先动了，卸下的是璃月的砖茶。蒙德的商队带来乐谱，须弥的学者带来种子，种子入关时仔细查验了三遍才放行。旧关税的木牌从杆上摘下，摘牌的差役顺手把杆子也拔了，围观的人笑起来，这是开港那日唯一的笑声。掌灯时分，新章程的抄本贴在关前，头一行只有五个字：「来者皆客人。」贴榜的人退后两步看了看，又把纸角抹平了。抹平纸角那晚起了南风，关前的幌子响了一夜，守关的说是好事，风从南来，船就到得快。"
 SAN_PW_News.4.a:"览毕"
 SAN_PW_News.5.t:"邪眼炉加封"
 SAN_PW_News.5.desc:"海水没炉喉，寿命换力之遗毒，长锁渊底宫。位于八酝岛的邪眼工厂被灌入海水永久封存，那批以寿命换取武力的禁忌之物连同图纸一并锁进渊下宫最深处，由现人神亲加封印，愚人众在稻妻的经营宣告终结。封存那日，八酝岛的居民远远看着烟囱里最后一缕烟散尽，有老人对着工厂的方向合了合掌，不知是送它，还是祭它。押运的船过名椎滩时风浪忽然大了，押运官下令绕行，多走了半日水路。封印落在库门上时，随行的书记照例记了时辰，笔尖顿了顿，添了一句：「愿后来者不必再启此门。」这句话后来随档案一直留在卷首，每次开卷，头一个看见的便是它。卷首那句话逐年重描一遍，描的人换了三个，描的笔迹却像同一个人的，越描越端正。"
 SAN_PW_News.5.a:"览毕"
 SAN_PW_News.6.t:"七国使登岸"
 SAN_PW_News.6.desc:"国书渡海来，七邦使节次第登，名分悬未定。七国使节陆续登陆离岛，向新的稻妻统治者递交国书，这是稻妻数百年来头一回主动面向提瓦特，珊瑚宫以海祇大御神之名接受国书，措辞谨慎而未定名分。使节的船队在离岛外一字排开进港，进港的次序是抽签定的，璃月的使节抽得头签，笑道这是他此行最大的运气。递国书的仪程走了整日，各国礼数不同，司仪官一项项现学。珊瑚宫受书时以海祇大御神之名，措辞斟酌了三稿，留一个不落名分的活扣。散会后有幕僚问为何不干脆定名分，答曰：「名字一落，退路就没了。」幕僚便把那三稿的废稿也一并收了档。三稿废稿收档那日，掌档的把最末一稿折了个角，说是留个记认，往后谈名分，从这里想起。"
 SAN_PW_News.6.a:"览毕"
 SAN_PW_News.7.t:"御影炉心再燃"
 SAN_PW_News.7.desc:"白烟起踏鞴，两地火候炉前会，心跳复可闻。踏鞴砂的御影炉心经海祇工程师修复后重新点火，白夜国的冶炼法与稻妻的雷电五传技艺在同一座炉前交汇，沉寂多年的踏鞴砂重新升起白烟，稻妻的工业心脏开始跳动。点火那日请了踏鞴砂的老住户来看，老人们记得上一次炉火熄的那天，也来看这一次燃。火舌从炉口探出那一刻，人群里无人说话，只有一个老工匠用袖口擦了擦脸，旁人只当是熏的。白烟升上去，往鸣神岛的方向飘，海上望见的人道：「那烟直，是好兆头。」当夜的庆功宴开得简单，师傅们喝到一半便回工棚守炉去了，说是火比酒要紧，酒搁着不凉。搁着的酒到底还是凉了，宴散前师傅们回棚前各自满了一杯，一饮而尽，杯子扣在案上，响得整齐。"
 SAN_PW_News.7.a:"览毕"
 SAN_PW_News.8.t:"渊下宫再开"
 SAN_PW_News.8.desc:"凿声五百载，阳光初入白夜国，深海梦正酣。被封印五百年的渊下宫入口重新凿开，阳光头一回照进白夜国的废墟。常夜之地重见天日的同时，深海中某种沉睡的东西似乎也睁开了眼，珊瑚宫未对此发表任何声明。凿开那日，碎石落进常夜，半晌听不见回声，先下去的探险队用长绳系着，绳上每隔一丈结一个铃。阳光柱斜插进废墟时，队伍里最年轻的队员道：「底下有影子动了。」队长按住他的肩，等了足足一刻，什么也没有。消息传回珊瑚宫，文书上只写两行：「入口已开，详情待报。」搁笔的书记望着窗外，海面平得像一块没掀开的布，他把那页纸晾干，才装进封套。封套晾干那日，海底传来一声极远的闷响，声学官记了时辰，注明与凿掘无关，缘由待考。"
 SAN_PW_News.8.a:"览毕"
 SAN_PW_News.9.t:"雷电将军无踪"
 SAN_PW_News.9.desc:"太刀卧无主，人偶壳中呼吸在，生死成密档。雷电将军的最终去向至今没有官方定论，海祇军在天守阁废墟中寻得一把无主太刀与一具仍在运转的人偶躯壳，将军本人的生死列为最高机密，鸣神旧臣对此讳莫如深。搜寻队把废墟翻到第三遍，连梁上的灰都筛过，只得一刀一偶。太刀封存那天，库官在册子上写了无主二字，笔迹比平日重。人偶运走时装的箱里垫了三层软缎，抬箱的人道：「这待遇比活人还讲究。」有旧臣在巷口摆了清酒遥拜，被邻居劝走，酒盏收回家时，酒还温着。官方的通告只有一句：「雷电将军之现状，属最高机密。」通告贴出当夜，城下町的灯火早熄了一刻。早熄的那一刻里，有人在巷尾低声说了句什么，无人听清，风把那半句话卷走了，巷口的灯笼晃了晃。"
 SAN_PW_News.9.a:"览毕"
 SAN_PW_News.10.t:"稻妻新气象"
 SAN_PW_News.10.desc:"军旗渐次收，驿路渔盐次第兴，暗中潮未平。击败幕府半年之后，珊瑚宫治下的稻妻初现秩序，军管逐步撤除，驿道重新通行，渔场与盐场次第复工。然而海祇与鸣神的旧怨、愚人众的残余与深海的低语，仍在暗中考验这位年轻的统治者。半年间最直观的变化是路上的马粪少了，商队多了，孩子们在驿道边数过往的货车，数到五十便换一班。可夜里的渔村仍旧安静得早，老人们说，安定的年月，人反而睡得警醒。城下町墙上那个刮了又写的名字没再出现，换成一行小字：「日子会好的。」墨色很淡，像怕人看见。天守阁的灯如今亥时就熄，值夜的侍从道，大人吩咐的，灯亮着，反叫人睡不踏实。灯熄了，城反而稳了，那行小字后来洗掉了，洗掉的第二天，墙上多了一枝用炭画的樱，画得歪，却开得满。"
 SAN_PW_News.10.a:"览毕"

 SAN_PW_dec_rebuild_road:"复建岛路"
 SAN_PW_dec_rebuild_road_desc:"抢修连接各町的驿道，恢复战后基本的通行。塌了的桥架起临时木桥，断了的路面先垫碎石压实，先通官道，再通村路。路通了，粮与信才走得动，商贩的骡队也才肯回来。驿道修通那日，第一辆粮车碾过新垫的碎石，车轮声传出去老远。"
 SAN_PW_dec_relief_grain:"赈济海民"
 SAN_PW_dec_relief_grain_desc:"开仓放粮，安抚战后流离的渔户与岛民。粮站设在祠堂前，按户领取，老弱优先。领粮的队伍虽长，秩序却好，公道的粮斗就是最好的安民告示。有老妇领完粮对着粮站拜了一拜，管事的连忙扶住，说这是公事，不必谢。"
 SAN_PW_dec_reopen_fishery:"重开渔场"
 SAN_PW_dec_reopen_fishery_desc:"解除海域管制，让渔船重新出海。水雷与封锁桩逐一清除，航道重新插标立旗。头一批渔船回来时舱满旗湿，码头上等着的家眷都笑了。管制解除的告示贴到渔市，识字的当场念了，人群里爆出一阵欢呼。"
 SAN_PW_dec_restore_forge:"修复踏鞴炉"
 SAN_PW_dec_restore_forge_desc:"重燃御影炉心，恢复踏鞴砂的冶炼产能。流散的匠人陆续召回，炉膛重新烘干，风箱修了三遍。头一炉铁水出来那日，全矿的人都放下活计去看火色。炉火映红了半边山，回来的匠人们说，闻见这烟味，心里就踏实了。"
 SAN_PW_dec_clear_debris:"清理战场"
 SAN_PW_dec_clear_debris_desc:"清运天守阁与各战场留下的残骸。断瓦分出能用的与不能用的，木料拆下搭临时营房，碎石填了弹坑，废铁归炉回炼。一场仗的狼藉，就这么一点一点收拾成街市。拆下的旧匾与断戟另立一库封存，说是留给后人的凭证。"
 SAN_PW_dec_salt_works:"官营盐场"
 SAN_PW_dec_salt_works_desc:"将海盐收归官营，填补战后空虚的国库。盐场按亩定产，官收官卖，价平质足，私贩渐渐绝了迹。盐课入账那日，账房难得舒展了眉头。盐工的工钱按日出结，晒盐的人家头一回觉得这营生有了奔头。"
 SAN_PW_dec_pacify_district:"绥靖旧郡"
 SAN_PW_dec_pacify_district_desc:"对不肯归附的旧郡展开清剿与招抚。先礼后兵：檄文先到，晓以利害；不从者发兵，剿抚并用。降者编户安插，首恶必办，胁从不论，规矩摆在明处。檄文与兵锋先后到过的郡县，如今驿路上又能望见行脚商的影子了。"
 SAN_PW_dec_amnesty_petition:"恩赦请愿"
 SAN_PW_dec_amnesty_petition_desc:"受理旧幕府吏民的赦免请愿，示以宽大。请愿状按乡汇齐，逐一核议，小过既往不咎，重案另簿存查。放归的人走出营门时回头看了一眼门匾，脚步快了许多。核议的章程写得明白，宽大有度，既有恩典，也有法度。"
 SAN_PW_dec_vision_registry:"神眼登记"
 SAN_PW_dec_vision_registry_desc:"重新登记全稻妻的神之眼持有者，纳入管束。登记簿按乡编册，眼匣加封编号。愿力不灭，人身不拘，册子上的朱笔圈点，既是限制，也是保全。登记那日秩序井然，有持眼的老者自愿头一个按了手印。"
 SAN_PW_dec_shrine_audit:"神社查账"
 SAN_PW_dec_shrine_audit_desc:"清查鸣神大社及各分社的田产与香火账目。账册摊开对了几日，田亩重新丈量，香火钱分列出入。清出的是家底，稳住的是人心。清查的册子装订成帙，末页注明：账目清白者，原职原薪。"
 SAN_PW_dec_fatui_trial:"愚人众公审"
 SAN_PW_dec_fatui_trial_desc:"公开审判在稻妻活动的愚人众成员，昭示天下。罪状当堂宣读，证物一件一件呈上，旁听的百姓挤满了廊下。判决书张榜三日，识字的念给不识字的听，全城都听全了。宣判那日天色晴好，廊下有老人对儿孙低声说，记牢今日，莫忘前事。"
 SAN_PW_dec_garrison_rotate:"戍卒轮换"
 SAN_PW_dec_garrison_rotate_desc:"轮换占领区的驻军，避免军心涣散与扰民积怨。驻军三月一换，换防之日两军对调营房，纪律官随后巡查。民怨簿上记下的名字，一件一件都要有着落。换防的队伍行军途中秋毫无犯，沿路的村户照旧开着门。"
 SAN_PW_dec_loyalty_oath:"效忠宣誓"
 SAN_PW_dec_loyalty_oath_desc:"令旧幕府官吏集体宣誓效忠珊瑚宫。誓词简单，只誓三事：奉令、守纪、爱民。愿誓者留任原职，不愿者放归乡里，册上一笔一划，都是各人的选择。宣誓那日无人强迫，签完名的人各自收好凭据，神情倒都郑重。"
 SAN_PW_dec_close_narukami_shrine:"封禁鸣神社"
 SAN_PW_dec_close_narukami_shrine_desc:"封闭鸣神大社，压制旧信仰的公开活动。山门落锁，社务归并，参拜者劝返，田产造册封存。社里的巫女各自领了安置的文书，只有那几棵樱树，特意留了人照看。落锁那日有旧日参拜的人远远望了一眼，合掌拜了拜，转身走了。"
 SAN_PW_dec_open_ritou_market:"离岛互市"
 SAN_PW_dec_open_ritou_market_desc:"开放离岛互市，与七国商船打交道。互市的章程贴在关口，税目减了，查验从速，外船凭引靠岸。头一日成交的商贩高兴，请街坊吃了热汤面。关口的长队比从前短了，商人们说，如今过关比过自家门还快。"
 SAN_PW_dec_conscript_order:"征发令"
 SAN_PW_dec_conscript_order_desc:"向各岛征发壮丁，充实海祇军与占领军。征额按户摊派，独子免征，工匠缓征。征到的披甲领粮，没征到的出钱出力，各有各的去处。征兵的册子按乡公示，有异议的当场受理，无一人蒙冤。"
 SAN_PW_dec_enkanomiya_survey:"渊下勘探"
 SAN_PW_dec_enkanomiya_survey_desc:"派遣勘探队深入渊下宫，测绘白夜国的废墟。队员各携双份灯油，沿路立标做记。殿宇、碑刻、水道逐项制图，一草一木都入了册。测绘的图纸一月一报，地底的消息从此一程一程传到地面。"
 SAN_PW_dec_seal_abyss_gate:"封禁常夜门"
 SAN_PW_dec_seal_abyss_gate_desc:"以符咒与巨石封死渊下宫通往常世的裂口。封口先用铁链绞合，再垒巨石三层，符咒贴满石缝。守口的哨位昼夜双岗，钥匙与图样分藏两处，永不合璧。封口的巨石垒完，工程师在石上刻了日期，算给后人的一封信。"
 SAN_PW_dec_vishap_study:"龙蜥研究"
 SAN_PW_dec_vishap_study_desc:"研究深海龙蜥的血脉，用于技术与军备。血样低温封存，鳞甲送工坊试锻，习性由猎户与学士合伙记录。研究归研究，围栏倒是加固了三次，谁也不敢大意。观察日志写了厚厚一册，龙蜥的脾性被摸得七七八八。"
 SAN_PW_dec_helios_reignite:"大日重燃"
 SAN_PW_dec_helios_reignite_desc:"重启大日御舆的赫利俄斯核心，为工业供能。旧核清理了半月，换装新制的导能环，点火那日地底的暗夜亮如白昼。厂区的机器齐齐一震，随即转动起来，守夜的人都说那声响像心跳。"

 SAN_PW_Unified_Islands:"列岛一统"
 SAN_PW_Unified_Islands_desc:"五岛归一帜，战火燃尽海天阔，从此无东西。最后的抵抗平息，五岛之上一面旗。海祇的蓝白旗在鸣神、清籁、鹤观的埠头次第升起，升旗的兵士都是各岛本地人，旗却是一样的。渡船的航路重新排定，通行文书并成一种，印也并成一方。战后第一场共祭设在珊瑚宫，五岛的巫女同坛，祝词念的是同一个本子。有老人从鹤观赶到海边，就为看一眼升旗，看完了他说：「旗是一样的，日子还不知道。」这话传到心海耳中，她只回了四个字：慢慢就知道了。"
 SAN_PW_Occupied_Narukami:"鸣神旧地军管"
 SAN_PW_Occupied_Narukami_desc:"军令肃如霜，旧都易帜灯渐冷，巷陌待春光。鸣神旧地军管。海祇军进驻稻妻城与九条阵屋，宵禁与通行证并行，粮栈按册配给。旧吏留用的留用、遣散的遣散，街市照旧开张，只是巡街的脚步声换成了海祇军的号子。"
 SAN_PW_Sunken_Treasury:"国库空虚"
 SAN_PW_Sunken_Treasury_desc:"库底见光时，账簿压弯灯下影，珠玉亦充公。国库空虚。连年征战，库底几乎见光：军饷拖欠、抚恤积压，连宫中的灯油都要省着用。心海把私库的珍珠一并充了公账，账房先生接册子的手都在抖。"
 SAN_PW_War_Exhaustion:"战争疲惫"
 SAN_PW_War_Exhaustion_desc:"家书越写短，村头新坟对旧坟，说书人垂泪。战争疲惫。仗打得久了，兵员换了一茬又一茬，家书越写越短，村里新坟渐多。各岛的茶馆里，说书人把征人的故事说了又说，听的人抹泪，说的人也抹泪。"
 SAN_PW_Resistance_Remnants:"残党蜂起"
 SAN_PW_Resistance_Remnants_desc:"残党匿山泽，白日樵渔夜劫粮，乡邻闭户言。残党蜂起。旧幕府的散兵游勇盘踞山泽，白日装作樵夫渔户，夜里劫掠粮道。清剿的队伍进山十次有九次扑空，乡民闭门不语，谁也说不清哪家的儿子在外头落了草。"
 SAN_PW_Divine_Mandate_Doctrine:"神权教义"
 SAN_PW_Divine_Mandate_Doctrine_desc:"祝词即法度，庙堂市井同一声，童蒙诵敬神。神权教义。现人神之言即是法度，祝词与政令同出一门。庙堂之上讲天意，市井之间讲因果，连孩童开蒙的第一句，念的也是「敬神爱人」。"
 SAN_PW_Republican_Charter:"共和宪章"
 SAN_PW_Republican_Charter_desc:"章程出万民，代表围坐议短长，官帽不由天。共和宪章。诸岛代表齐集一堂，把权力的边界一条条写进章程。宪章抄本分存各岛公所，识字的人念给不识字的听，人人皆知：官由民选，法为公立。"
 SAN_PW_Bakufu_Restoration:"幕府复兴"
 SAN_PW_Bakufu_Restoration_desc:"旧幕复新堂，形制仪轨皆照旧，旗色换作蓝。幕府复兴之议既定，新的幕府在旧幕府的废墟上落成，形制、仪轨、官阶一一照旧，只把旗色从紫改成了蓝。旧奉行所的匾额重新挂起，挂匾的还是原来那家木匠。当年的反抗者成了幕府，而稻妻人发现，日子和从前没什么两样：税照缴，城门照查，通行文书照盖印。有老人站在新幕府门口看了半日，说这门槛的位置，和旧的一寸不差。心海在开幕那天说了一句：「规矩好改，日子难改。」众人不明其意，日子久了，都明白了。"
 SAN_PW_Deep_Knowledge:"白夜禁知"
 SAN_PW_Deep_Knowledge_desc:"禁册出深渊，符文阵法压书架，学者夜不眠。白夜禁知。渊下宫封存的远古学问重见天日，符文、阵法、器造之术皆在册中。学者们一边抄译一边心惊，这些知识太重，寻常书架已经压不住了。"
 SAN_PW_Kokomi_Regency:"心海摄政"
 SAN_PW_Kokomi_Regency_desc:"将军位虚悬，摄政执印理万机，自称非神明。新局既定，心海自领摄政，居天守阁，理全国之政。她不称将军，不称神，官文上的头衔只一行：珊瑚宫心海，摄稻妻国政。有旧吏提议恢复将军号以安人心，她驳了：「名号是壳，稻妻如今缺的是瓤。」她白日理政，夜里读书，读的还是兵书与账册，闲时去海边走一段，侍卫远远跟着。有渔妇不识她，让她帮着推船，她推了，推完拍拍手上的沙走了，渔妇问旁人那是谁，答是摄政大人，渔妇愣了半晌，说手上有茧，不像官。"

