 NAT_Springs_Boundary_Redrawn_Idea:"界碑移置"
 NAT_Springs_Boundary_Redrawn_Idea_desc:"流泉之众航首带三名后生，沿河插界碑。行至一河湾，旧碑犹立原处，河水却已改道，碑身离水远三丈。后生欲拔碑重插，航首拦住，蹲下掬一捧水看流向，曰：「碑随水走，水改道，碑亦须改。」一后生迟疑：「焱庭图上，可不是这般画的。」航首将湿手于裤腿一抹，拔起旧碑，扛至新水边掘坑埋下，复以脚踩实土：「图是死的，水是活的。往后此界，吾说了算。」河风卷起其斗笠，不回头，只盯那道新水痕。"
