 GRE_ancient_talents:0 "Ancient Talents"
 GRE_ancient_talents_desc:0 "We have always had a penchant for the nautical, ever since the days of the Bronze Age. By fostering a strong maritime tradition, we are offering respect to a time-honored tradition that runs in our blood."
