 SUM_Neo.44.t:"梦蕈"
 SUM_Neo.44.d:"雨林里的蘑菇吸着梦的气息生长，成为新的药材。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。巡林官把新的报告压在旧报告上面，死域的边界又往北挪了一里。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。镀金旅团开出了新的价目，谁的摩拉多，枪口就朝谁转。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。"
