 NAT_Nightwind_Night_Raid_Idea:"暗夜封途"
 NAT_Nightwind_Night_Raid_Idea_desc:"烟谜主将夜里之路收归本族。天一擦黑，族中巡夜人便出动，将几条要道口皆以灰画上记号。一贪赶路之外来队伍未留意，照旧往道上闯，为一巡夜人拦住。领头者曰：「天黑何如，路不仍是路？」巡夜人指地上那道灰线：「入夜后，此路不归外人。再往前，汝连来路皆寻不着。」那人不信，推开巡夜人硬闯。巡夜人亦不拦，只吹一声口哨，四周灰雾中便亮起几点幽火，将那队人围在中间。领头者慌，忙退回，赔笑问路。巡夜人将灰线往旁一挪，让出一道：「顺走，天亮前出去。」那队人低头快走，谁亦未再抬头看那几点幽火。"
