 SUM_Neo_SGS.89.t:"最后的话"
 SUM_Neo_SGS.89.d:"兵临关隘才提条件：撤哨、减税、还水、认独立。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。"
