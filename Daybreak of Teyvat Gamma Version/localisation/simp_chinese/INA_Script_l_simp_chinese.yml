 INA_meibureau_of_ships_desc:0 "神威舰队，将军认为我们应该重建往日海军的荣光"
 INA_meifund_the_navy:0 "一心流造船司"
 INA_meifund_the_navy_desc:0 "一心流造船司，雷电五传之一，一心传的工匠将为我们重建舰队。"
 INA_meibattleship_primacy:0 "舰队订单"
 INA_meibattleship_primacy_desc:0 "对于我们落后太多的造船业来说，想要快速补上我们的舰队，只有一个方法，那就是订购它国的先进战舰。"
