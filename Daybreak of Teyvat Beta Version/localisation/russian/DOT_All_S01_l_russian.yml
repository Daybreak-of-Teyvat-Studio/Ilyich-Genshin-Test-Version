#character
ANR_Bennett:0"Беннет"
ANR_Fischl:0"Фишль"
ANR_Diona:0"Диона"
ANR_Razor:0"Рэйзор"
ANR_Elin:0"Эйлин"
ANR_Elin_desc:0"«Вот как это решается!»\nПри упоминании имени Эйлин жители Мондштадта вспоминают эту фразу. Но теперь у неё нет времени размышлять, как разбить несколько столбов одновременно. Её называют рыцарем, хотя она никогда не получала официального звания.\nУхаживая за больным отцом и заботясь о беженцах в Вольфендоме, она постепенно постигла нечто более важное, чем боевое мастерство, — то, что делает её настоящим рыцарем."


#trait
Wirrior:0"Храбрый воин\n§gОн дал себе слово: стать сильнее, сильнее всех. Когда придёт опасность, он защитит своих «Лупика».§!"
Ignorant:0"Неискушённый\n§gСлышит настроение ветра, чует запахи издалека, помнит множество трав, но не помнит лиц родителей.§!"
Each_according_to_ability:0"По способностям\n§gРэйзор всё ещё не знает, волк он или человек. Но ему нравится такая жизнь.§!"
Glorious_guide:0"Славный проводник\n§gЧтобы стать великим, даже свою «неудачу» нужно использовать как трамплин.§!"
Enthusiastic_coordinator:0"Энтузиаст-координатор\n§gОн продолжает «приключения», закаляясь в бесконечных «неудачах».§!"
Accelerationist_leaders:0"Акселерационистский лидер\n§gНи в коем случае нельзя отказываться от возвышенного и мечты... ведь это испытание для принцессы.§!"
Pioneer_of_Situationism:0"Пионер ситуационизма\n§gВидящая всё, что видит Оз, она может вселиться в ночного ворона, взлететь и окинуть взором землю.§!"
Hero_of_squire:0"Герой сквайров"
Everyone_a_king:0"Каждый — король"
ANR_open_and_clear_lad:0"Открытый и жизнерадостный юноша"
ANR_strange_misfortune:0"Странная неудача"
ANR_artist_ahead_of_time:0"Слишком опережающий своё время художник"
ANR_ozvaldo_hrafnavins:0"Озвальдо Хравнавинс"
ANR_town_leader_of_courage:0"Мужественный лидер общины"
ANR_see_each_other_all_the_time:0"Встречаются на каждом шагу"
AN_Soul_of_Adventure:0"Душа приключений"
AN_Soul_of_Adventure_desc:0"Каждое путешествие отряда Беннета полно неожиданных рисков. Хотя единственный участник Беннет предпочитает называть их «захватывающими, прекрасными и удивительными»."
AN_Hot_Blood_of_Courage:0"Бесстрашная горячая кровь\n§gЧтобы стать великим, даже свою «неудачу» нужно использовать как трамплин.§!"
AN_Hot_Blood_of_Courage_desc:0"Но это не останавливает Беннета. Он продолжает приключения, закаляясь в бесконечных «неудачах». Чтобы стать великим искателем приключений, даже свою «неудачу» нужно использовать как трамплин. Вот о чём мечтает будущий великий искатель приключений — юный Беннет."
AN_Fly_in_Night:0"Ночной разящий призрак\n§g...Оз, ниспошли для меня гром осуждения, разрывающий ночь.§!"
AN_Fly_in_Night_desc:0"..."
AN_Thunder_Kill_Sin:0"Гром осуждения\n§g...Среди зверей, преследующих проклятую кровь осуждения, лишь князь ночных воронов, свидетель гибели тысячи миров, понимает её величие. И он распростёр крылья тьмы, осеняя благородную принцессу, и поклялся вечно её защищать.§!"
AN_Thunder_Kill_Sin_desc:0"...Среди зверей, преследующих проклятую кровь осуждения, лишь князь ночных воронов, свидетель гибели тысячи миров, понимает её величие. И он распростёр крылья тьмы, осеняя благородную принцессу, и поклялся вечно её защищать. — «Ночные сказания о принцессе Фишль. Том I. «Очерк конца света»»"
AN_Taste_of_Special_Wine:0"Послевкусие особого зелья\n§gНачало ужасно, советую оставить врагам; послевкусие прохладно, жаль, что можно наслаждаться только носом и кожей.§!"
AN_Taste_of_Special_Wine_desc:0""
AN_Thunder_and_Attack:0"Громовой коготь\n§gВолк проснулся. Время охоты.§!"
AN_Thunder_and_Attack_desc:0""



