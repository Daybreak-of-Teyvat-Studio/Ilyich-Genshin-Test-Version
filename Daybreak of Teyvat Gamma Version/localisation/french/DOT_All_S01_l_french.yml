  # Politique nationale
  ABY_banishher:0 "Défaite sans abdiquer"
  ABY_banishher_desc:0 "Nous avons échoué, mais nous reviendrons dans ce monde."
  ABY_rebuildamry:0 "Rassembler à nouveau les troupes"
  ABY_rebuildamry_desc:0 "Voilà le sort des guerriers des Profondeurs."
  ABY_thelaws:0 "Élaborer les préceptes religieux"
  ABY_thelaws_desc:0 "Notre défaite a fait naître des ambitieux au sein de l'ordre religieux. Il nous faut établir des préceptes pour discipliner les fidèles."
  ABY_land_reform:0 "Réaménager les terres"
