 SUM_Neo.301.t:"海运"
 SUM_Neo.301.d:"海运开起来，香料与瓷器从奥摩斯港出海。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。"
