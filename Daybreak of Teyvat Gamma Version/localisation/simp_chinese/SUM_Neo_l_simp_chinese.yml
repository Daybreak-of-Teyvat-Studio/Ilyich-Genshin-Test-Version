 SUM_Neo_SGS.174.b:"先断其商路"
 SUM_SGS_WAR_Amnesty:"宽赦"
 SUM_SGS_WAR_Amnesty_desc:"凡归降者不问旧事，愿留的分地，愿走的给粮。"
 SUM_Neo_SGS.175.t:"宽赦"
 SUM_Neo_SGS.175.d:"凡归降者不问旧事，愿留的分地，愿走的给粮。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。"
 SUM_Neo_SGS.175.a:"把话说给雨林人听"
 SUM_Neo_SGS.175.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Buy_Clerk:"收买书吏"
 SUM_SGS_WAR_Buy_Clerk_desc:"关卡靠书吏记档，钱递过去，档换一份。"
 SUM_Neo_SGS.176.t:"收买书吏"
 SUM_Neo_SGS.176.d:"关卡靠书吏记档，钱递过去，档换一份。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SGS.176.a:"倾全境之力"
 SUM_Neo_SGS.176.b:"留一支后手"
 SUM_SGS_WAR_False_News:"反间"
 SUM_SGS_WAR_False_News_desc:"把假消息透给雨林的斥候，让他们说给自己人听。"
 SUM_Neo_SGS.177.t:"反间"
 SUM_Neo_SGS.177.d:"把假消息透给雨林的斥候，让他们说给自己人听。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。"
 SUM_Neo_SGS.177.a:"以动员令起兵"
 SUM_Neo_SGS.177.b:"以盟约召集部族"
 SUM_SGS_WAR_Supply:"辎重线"
 SUM_SGS_WAR_Supply_desc:"辎重沿商道铺开，一站接一站。"
 SUM_Neo_SGS.178.t:"辎重线"
 SUM_Neo_SGS.178.d:"辎重沿商道铺开，一站接一站。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SGS.178.a:"直取雨林关隘"
 SUM_Neo_SGS.178.b:"先断其商路"
 SUM_SGS_WAR_Water_Team:"运水"
 SUM_SGS_WAR_Water_Team_desc:"运水队昼夜不停，车夫换人不换车。"
 SUM_Neo_SGS.179.t:"运水"
 SUM_Neo_SGS.179.d:"运水队昼夜不停，车夫换人不换车。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGS.179.a:"把话说给雨林人听"
 SUM_Neo_SGS.179.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Medic:"战地医帐"
 SUM_SGS_WAR_Medic_desc:"医帐随军，能就地治的就地治。"
 SUM_Neo_SGS.180.t:"战地医帐"
 SUM_Neo_SGS.180.d:"医帐随军，能就地治的就地治。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGS.180.a:"倾全境之力"
 SUM_Neo_SGS.180.b:"留一支后手"
 SUM_SGS_WAR_Forge_Move:"随军匠坊"
 SUM_SGS_WAR_Forge_Move_desc:"铁作坊随军走，缺什么现造什么。"
 SUM_Neo_SGS.181.t:"随军匠坊"
 SUM_Neo_SGS.181.d:"铁作坊随军走，缺什么现造什么。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。"
 SUM_Neo_SGS.181.a:"以动员令起兵"
 SUM_Neo_SGS.181.b:"以盟约召集部族"
 SUM_SGS_WAR_Rear_Tax:"后方捐输"
 SUM_SGS_WAR_Rear_Tax_desc:"后方照收捐输，捐输的人指望打胜了抵税。"
 SUM_Neo_SGS.182.t:"后方捐输"
 SUM_Neo_SGS.182.d:"后方照收捐输，捐输的人指望打胜了抵税。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。"
 SUM_Neo_SGS.182.a:"直取雨林关隘"
 SUM_Neo_SGS.182.b:"先断其商路"
 SUM_SGS_WAR_Last_Storm:"最后一场风"
 SUM_SGS_WAR_Last_Storm_desc:"总攻选在换季的大风，风一起，天地分不清。"
 SUM_Neo_SGS.183.t:"最后一场风"
 SUM_Neo_SGS.183.d:"总攻选在换季的大风，风一起，天地分不清。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SGS.183.a:"把话说给雨林人听"
 SUM_Neo_SGS.183.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Break:"破阵"
 SUM_SGS_WAR_Break_desc:"最硬的驼骑压正面，等阵一动，两翼游骑插进去。"
 SUM_Neo_SGS.184.t:"破阵"
 SUM_Neo_SGS.184.d:"最硬的驼骑压正面，等阵一动，两翼游骑插进去。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。茶摊上有人说起几十年前的事，说那时沙漠还有国王，听的人大多在低头喝茶。"
 SUM_Neo_SGS.184.a:"倾全境之力"
 SUM_Neo_SGS.184.b:"留一支后手"
 SUM_SGS_WAR_See_Towers:"望见尖塔"
 SUM_SGS_WAR_See_Towers_desc:"从雨林高处往下看，能望见须弥城的尖塔。走了这么远，为的就是那几座塔。"
 SUM_Neo_SGS.185.t:"望见尖塔"
 SUM_Neo_SGS.185.d:"从雨林高处往下看，能望见须弥城的尖塔。走了这么远，为的就是那几座塔。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。"
 SUM_Neo_SGS.185.a:"以动员令起兵"
 SUM_Neo_SGS.185.b:"以盟约召集部族"
 SUM_SGS_WAR_Terms:"提出条件"
 SUM_SGS_WAR_Terms_desc:"兵临城下才提条件：撤哨、减税、还水、认独立。"
 SUM_Neo_SGS.186.t:"提出条件"
 SUM_Neo_SGS.186.d:"兵临城下才提条件：撤哨、减税、还水、认独立。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。"
 SUM_Neo_SGS.186.a:"直取雨林关隘"
 SUM_Neo_SGS.186.b:"先断其商路"
 SUM_SGS_WAR_Sumeru_Day:"须弥之日"
 SUM_SGS_WAR_Sumeru_Day_desc:"到这一步，这仗是打给雨林看的，也是打给沙丘自己看的。"
 SUM_Neo_SGS.187.t:"须弥之日"
 SUM_Neo_SGS.187.d:"到这一步，这仗是打给雨林看的，也是打给沙丘自己看的。佣兵团的账房熬了通宵，第二天把团里最能打的三个人的名字从名册上划掉了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。"
 SUM_Neo_SGS.187.a:"把话说给雨林人听"
 SUM_Neo_SGS.187.b:"把话说给沙漠人听"
 SUM_SGS_WAR_Dune_On_Forest:"沙丘东进"
 SUM_SGS_WAR_Dune_On_Forest_desc:"沙丘腰带的旗插上了第一道雨林哨所。往东是河渠与平原，再往东是须弥城。教令院连夜遣使说可以谈，阵前的人只回一句：先撤哨，再谈别的。"
 SUM_Neo_SGS.188.t:"沙丘东进"
 SUM_Neo_SGS.188.d:"沙丘腰带的旗插上了第一道雨林哨所。往东是河渠与平原，再往东是须弥城。教令院连夜遣使说可以谈，阵前的人只回一句：先撤哨，再谈别的。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。"
 SUM_Neo_SGS.188.a:"倾全境之力"
 SUM_Neo_SGS.188.b:"留一支后手"

 #### 决议 ####
 SUM_SGS_Govern:"城邦与水务"
 SUM_SGS_Govern_desc:"沙丘腰带的政务决议组，料理这片商旅之地的日常秩序。安置流民、整饬关卡与维护驿站，是维持往来畅通的前提。往来顺了，这片沙地才有生意可做，才留得住南来北往的客商。往来顺畅，这片沙地才有生计可言。往来不断，生意也就有了源头。"
 SUM_SGS_Faith:"花灵与经卷"
 SUM_SGS_Faith_desc:"沙丘腰带的信仰决议组。往来之人各有各的神，如何让这些信念彼此相安，是这里的难题。能让各路人马都觉得进得来、住得下、走得开，便是功德一件，也是这片沙地最要紧的本事。把各路人马都安顿好，纷争自然就少。能让各色人等都安下心来，生意才做得长久。"
 SUM_SGS_Trade:"商道与盐"
 SUM_SGS_Trade_desc:"沙丘腰带的商贸决议组。这里历来靠中转与买卖立足，掌握货源与价差，就能在沙海中站稳脚跟。做买卖讲究的是眼力，也讲究时机，早一步下手与晚一步跟上，往往就是两种截然不同的光景。看准了时机下手，才能把利攥在手里。"
 SUM_SGS_Army:"沙丘守军"
 SUM_SGS_Army_desc:"沙丘腰带的军事决议组。护商、守隘与清剿沙匪都要靠自己的人手，轻骑与哨探是这里的看家本领。人多眼杂之地，武备不可一日松懈，否则商路一断，家业便难以为继。武备一松，商路便随时可能断掉。护得住商队，才护得住这片沙地。"
 SUM_SGS_Crisis:"风沙与饥馑"
 SUM_SGS_Crisis_desc:"沙丘腰带的危机决议组，应对沙暴、劫掠与商路断绝之类的变故。凡事预则立，早点处置总好过临阵慌乱，也能少折损些往来的人马货物，把损失压在还能承受的范围之内。把损失压在能承受的范围内，才有翻身的机会。留得青山在，不怕没柴烧。"
 SUM_SGS_Dec_Gov_Charter:"立城邦宪章"
 SUM_SGS_Dec_Gov_Charter_desc:"为各处城邦立一份宪章。"
 SUM_SGS_Dec_Gov_Roll:"编民籍"
 SUM_SGS_Dec_Gov_Roll_desc:"登记各城的人口与户数。"
 SUM_SGS_Dec_Gov_Steward:"公推执事"
 SUM_SGS_Dec_Gov_Steward_desc:"由城里公推本城执事。"
 SUM_SGS_Dec_Gov_Water:"清丈水权"
 SUM_SGS_Dec_Gov_Water_desc:"把各城的水权重新清丈造册。"
 SUM_SGS_Dec_Gov_Road:"修沙道"
 SUM_SGS_Dec_Gov_Road_desc:"把城与城之间的沙道补平。"
 SUM_SGS_Dec_Faith_Rite:"办灵光礼"
 SUM_SGS_Dec_Faith_Rite_desc:"在圣显厅外办灵光之礼。"
 SUM_SGS_Dec_Faith_Hall:"清理圣显厅"
 SUM_SGS_Dec_Faith_Hall_desc:"组织人手清理圣显厅的沙。"
 SUM_SGS_Dec_Faith_Script:"释读古文字"
 SUM_SGS_Dec_Faith_Script_desc:"召集识字的人释读石板。"
 SUM_SGS_Dec_Faith_Shrine:"立灵龛"
 SUM_SGS_Dec_Faith_Shrine_desc:"在每处水驿立一处灵龛。"
