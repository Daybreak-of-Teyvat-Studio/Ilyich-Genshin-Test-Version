 #### 民族精神 ####
 SUM_SGD_I_Suzerain_Shadow:"藩属之影"
 SUM_SGD_I_Suzerain_Shadow_desc:"镀金沙漠在名分上，仍是雨林的下属。政令要经教令院过目，才算数。看那一道道文书送往雨林，盖了印再送回来。这层名分虽薄，却像一道匾额，压得沙漠人抬不起头，好不难受。"
 SUM_SGD_I_Eremite_Host:"旅团在境"
 SUM_SGD_I_Eremite_Host_desc:"镀金旅团在沙漠里，有自己的营寨与账房。替谁打仗，只看契约。钱给得足，刀便朝哪边。看那营寨里，佣兵们擦刀磨枪，全无定主。草原上的狼，端的养不熟，钱尽便散去。有分教：有钱便是主，有奶便是娘。"
 SUM_SGD_I_Desert_Grievance:"沙海的旧怨"
 SUM_SGD_I_Desert_Grievance_desc:"雨林与沙漠之间的赋税与地界，几百年没有算清。这笔糊涂账，越积越厚。看那两边的老人各执一词，都说自己有理。这账一日不算清，争端便一日不了，两边的血，也就一日白流。"
 SUM_SGD_I_Scarce_Water:"水贵如金"
 SUM_SGD_I_Scarce_Water_desc:"沙漠的水，攥在少数人手里。谁分水，谁便说了算。看那水主坐在泉边，一句话便定了谁家浇地。一瓢水比一斗金还贵重，泉边的水主，端的比国王还威风，谁敢不低头，端的吓人。有分教：水在人手，人在水下。"
 SUM_SGD_I_Caravan_Wealth:"商路之利"
 SUM_SGD_I_Caravan_Wealth_desc:"旧道上的商队，带来税，也带来消息，还带来外邦的耳目。金银与情报，一并进了城。看那商队在市集卸货，四下张望的陌生人不少。这其中的利与害，端的一言难尽，利弊难量。"
 SUM_SGD_I_Red_King_Legacy:"赤王的余响"
 SUM_SGD_I_Red_King_Legacy_desc:"赤王留下的遗迹与传说，是沙漠人心里未熄的一团火。那火埋在沙下，风吹不灭。看那遗迹的石柱，路人路过都要摸一把。那团火埋在沙下，只等一阵风来，便要烧遍整个沙漠。有分教：赤王虽逝，火种犹存。"
 SUM_SGD_I_Tax_Heavy:"税册如山"
 SUM_SGD_I_Tax_Heavy_desc:"税目一年比一年多。城民把账都记在心里，嘴上却不多说。看那税吏又添了新名目，百姓听了只是苦笑。可那账谁也不敢糊里糊涂地记，一笔一画都刻在心里，只等有朝一日清算。"
 SUM_SGD_I_Tribal_Levy:"部族的兵"
 SUM_SGD_I_Tribal_Levy_desc:"部族民兵自备兵器与口粮，听调不听编。叫你来便来，编入军籍却不肯。看那部族的人扛着自己的刀，成群而来。他们认的是自家首领，不是官署的印，端的召集容易管束难。有分教：自备刀粮，只听调遣。"
 SUM_SGD_I_Sand_League:"沙海同盟"
 SUM_SGD_I_Sand_League_desc:"诸城与诸部结成同盟，共抗雨林的敕令。大家拧成一股绳，便不怕那一纸文书。看那盟誓的旗，一面面立起来。这一盟立起来，端的让雨林寝食难安，一纸敕令再没人肯买账。"
 SUM_SGD_I_Independent_Flag:"独立的旗"
 SUM_SGD_I_Independent_Flag_desc:"红底飞鸟旗，立在各城城头。这旗一立，便是沙漠自己说了算。看那旗在风中猎猎作响，路人抬头便望见。那飞鸟像是要在风里飞起来一般，路人望见，心里也跟着热了起来。有分教：旗插城头，自立门户。"
 SUM_SGD_I_Oasis_Republic:"绿洲共和"
 SUM_SGD_I_Oasis_Republic_desc:"各城的执事共议国事，水与税都写在明处。事关众人，便由众人商量。看那议事厅里，执事们围坐一圈，争得不亦乐乎。这般议事，端的比一个人说了算强，众人的事众人商量，才做得长久。"
 SUM_SGD_I_Open_Market:"开市通商"
 SUM_SGD_I_Open_Market_desc:"集市不分内外，商队云集，税则公开。远来的近来的，一律照章办事。看那市集上，各国旗号混在一处，吆喝声此起彼伏。那税则，写得明明白白贴在最显眼处，货物通达天下。有分教：市开大门，货通天下。"
 SUM_SGD_I_Law_of_Sand:"沙漠律例"
 SUM_SGD_I_Law_of_Sand_desc:"一部合诸城诸部之规的律例立了起来。法官巡城而判，不论出身，一律按律。看那法官骑马巡城，升堂断案，围观者众。律例当前，王子庶民一律同罪，谁也休想仗着出身胡作非为。"
 SUM_SGD_I_Citizen_Militia:"乡兵制度"
 SUM_SGD_I_Citizen_Militia_desc:"各城出丁，平时务农，战时集合，粮从公出。放下锄头是百姓，拿起刀枪是兵。看那田间的汉子，闻鼓声便扛刀而来。这般兵平时不费公粮，战时才聚，端的省粮又肯卖命，听鼓。有分教：亦农亦兵，公粮养兵。"
 SUM_SGD_I_Desert_Commune:"沙海公议"
 SUM_SGD_I_Desert_Commune_desc:"水与地归公，契约与兵由两部共管。不分彼此，大家都有份。看那两部的人坐在一处，商议水怎么分、兵怎么调。两部互相牵制，谁也吞不了谁，水与兵便都落不到一人手里，端的公道。"
 SUM_SGD_I_Twin_Oath:"双誓之国"
 SUM_SGD_I_Twin_Oath_desc:"赤王的旧誓与花神的旧盟，同刻一石，立在绿洲泉边。两块旧誓并作一处，谁也不得忘记。看那石碑上，古字斑驳，泉水流过碑脚。两块旧誓，端的并成了一条心，永世不忘。有分教：双誓立泉边，永世不相忘。"
 SUM_SGD_I_Public_Ledger:"公账制度"
 SUM_SGD_I_Public_Ledger_desc:"团里的账目与税则，一律公开，谁都能查。账摆在明处，便没人能中饱私囊。看那账册挂在墙上，识字的人围着看，指指点点。这一公开，端的堵住了许多人的嘴，账目写得明白。"
 SUM_SGD_I_Scarlet_Crown:"赤沙王冠"
 SUM_SGD_I_Scarlet_Crown_desc:"重立的王统，以赤王为号。军、政、祀三样大权，集于一身。看那王座之上，人身披红袍，台下众人俯首。那红袍用的是赤王旧日的颜色，台下众人俯首，端的把旧日的号又扛了起来。有分教：赤王旧号，今人重称。"
 SUM_SGD_I_Militant_Desert:"沙海军国"
 SUM_SGD_I_Militant_Desert_desc:"诸城诸部之兵，编为一军，号令与粮饷统一。从此不再各吹各的号。看那校场之上，各路人马列队，听一人号令。从此如同一支军，再不是乌合之众，号令一出，各部无有不从，合一。"
 SUM_SGD_I_Ruin_Works:"遗迹工程"
 SUM_SGD_I_Ruin_Works_desc:"重开遗迹，拆旧石以筑新宫与军械。古人的柱子，今人的墙。看那工匠把雕花石柱砌进新城墙，花纹还朝外。古人的雕琢，如今做了今人的墙，花纹还朝外，端的叫人看了称奇。有分教：拆古筑今，石亦有情。"
 SUM_SGD_I_Quiet_Land:"守成之国"
 SUM_SGD_I_Quiet_Land_desc:"不折腾，不扩张，把眼下的日子过稳。这个国策，讲究的是一个稳字。看那城里，百姓安业，四境无事。这道理端的朴素，却少有人肯依，能守住这份平淡的，才是真本事，安稳。"

 #### 等级 / 共振 ####
 SUM_Neo_SGD_T1:"一档：赤王之名只剩传说"
 SUM_Neo_SGD_T1_desc:"头一档，赤王之名只剩传说。沙漠里的遗迹荒草丛生，祭礼停了几十年，无人问津，年轻的沙民只当是老人编的闲话。王者被忘，最是凄凉。石碑上的字，被风磨平了。"
 SUM_Neo_SGD_T2:"二档：旧事重提"
 SUM_Neo_SGD_T2_desc:"第二档，旧事重提。有人开始翻找沙下的石板与旧道，想从埋没的旧物里寻回赤王的痕迹，有人拿铲子敲开沙壳，果然露出半截石阶。这是要唤醒沉睡的历史。"
 SUM_Neo_SGD_T3:"三档：遗迹重开"
 SUM_Neo_SGD_T3_desc:"第三档，遗迹重开。赤王的旧名重新被人举起，成了一面可用的旗帜，沙漠里渐渐有了响应，各城纷纷竖起旧旗，遥相呼应。借古人之名，聚今人之心。断墙下，又有人摆起香案。"
 SUM_Neo_SGD_T4:"四档：王统渐立"
 SUM_Neo_SGD_T4_desc:"第四档，王统渐立。沙漠各城以赤王为号，渐渐整合到一处，听同一声号令，从前各自为政的城主，如今同坐一张席，端的威风。这便是要立新王。连远处的城也来送礼。"
 SUM_Neo_SGD_T5:"五档：赤沙之主"
 SUM_Neo_SGD_T5_desc:"第五档，赤沙之主。沙漠凭赤王的威名号令四方，谁敢不服，远处的城邦送来贡礼，近处的酋长亲自牵马执鞭，跪在沙地上听令。赤王虽古，余威犹在。四方诸侯，望尘而拜。"
 SUM_Neo_SGD_U1:"一档：旅团离散"
 SUM_Neo_SGD_U1_desc:"头一档，旅团离散。各支佣兵各投其主，四散而去，沙漠手里竟无兵可用，有钱也雇不到肯拼命的人了。有钱能使鬼推磨，佣兵认的是摩拉。沙地上，连营盘都塌了半边。"
 SUM_Neo_SGD_U2:"二档：契约零散"
 SUM_Neo_SGD_U2_desc:"第二档，契约零散。镀金旅团只接些短约，今天来明天走，翻脸不认人，钱一到手便不见了人影，临阵还要先讲价钱，端的难缠。这般兵最难使唤。今日收钱，明日翻脸。"
 SUM_Neo_SGD_U3:"三档：旅团在侧"
 SUM_Neo_SGD_U3_desc:"第三档，旅团在侧。总算有一支可用的佣兵常驻沙漠，召之即来，他们扎下营盘，日日操练，夜里还有人巡哨，倒也像支正经兵马。手里有兵，心中不慌。"
 SUM_Neo_SGD_U4:"四档：旅团归心"
 SUM_Neo_SGD_U4_desc:"第四档，旅团归心。佣兵与部族的兵编在一处，同听号令，不分彼此，起先还争个高下，后来并肩作战，便再分不出谁是谁的兵。拧成一股便是力量。一碗水，两个人分着喝。"
 SUM_Neo_SGD_U5:"五档：沙海强军"
 SUM_Neo_SGD_U5_desc:"第五档，沙海强军。沙漠的兵自己成了军，兵甲粮草不假外求，坑洞里藏着兵器，绿洲边建着粮仓，号旗一展，万骑齐发。能自立者方为真强。这支队，端的锐不可当。"
 SUM_Neo_SGD_Combo_HH:"双王并起"
 SUM_Neo_SGD_Combo_HH_desc:"赤王的旧名与旅团的刀锋合在一处，沙漠既有旗号又有拳头，端的如虎添翼，沙漠的子弟也肯读书识字了，端的兴旺。名与实俱备，何事不成。连骆驼都披上了甲。"
 SUM_Neo_SGD_Combo_LL:"散沙之世"
 SUM_Neo_SGD_Combo_LL_desc:"旧名既弃，兵旅又散，沙漠退回一座座城池各自守着，再无远志，城与城之间连条像样的路都没有，遇事各顾各的，谁也不肯先出头。无旗无兵，只能守成。"
 SUM_Neo_SGD_Combo_AH:"王统独尊"
 SUM_Neo_SGD_Combo_AH_desc:"沙海之上，赤王的旧名一抬出来，旅团的旗便矮了半截。佣兵收了刀，俯身去听王座上的号令。众人都道，枪杆子再硬，也硬不过一个死人的名头。"
 SUM_Neo_SGD_Combo_BH:"旅团当国"
 SUM_Neo_SGD_Combo_BH_desc:"旅团的人马从街口开过，赤王的牌位还挂在墙上，却没人抬头看。这一回开口的不是祭司，是账房，一纸契约压过十个旧名头。沙漠上认钱不认神，便自此日始。"

 #### 新闻 ####
 SUM_Neo_SGD_News.1.t:"沙漠的税册"
 SUM_Neo_SGD_News.1.d:"教令院新造了一本税册，遣人送到镀金沙漠来。众人围上去一看，发现这税册上的名目，比去年竟多出了一栏。去年已经苛捐杂税多如牛毛，今年又添新名，这不是明摆着要从沙漠多刮一层油水么？城门口早聚了不少人，伸着脖子看那榜单，看完了，却也不吵也不闹，只是彼此交换个眼色，默默地散了。这沉默比吵闹更叫人心里发毛。有那明白人私下里嘀咕，说这多出的一栏，究竟是甚名堂，怎么听着比去年的还绕口。众人虽不解其意，可那股子怨气，却一天重过一天。有那识字的，把那新增的一栏念出声来，众人听了，脸色都变了，原来这名目刁钻古怪，从前从未听过。人群里不知谁先哼了一声，霎时间怨声四起。"
 SUM_Neo_SGD_News.1.a:"阅"
 SUM_Neo_SGD_News.2.t:"镀金旅团的价目"
 SUM_Neo_SGD_News.2.d:"镀金旅团那边，也开出了新的价目。这旅团的规矩，是人人知道的，端的便是价高者得，谁出的摩拉多，这把刀便替谁去使。他们把新价目往桌上一摆，明码标价，明码卖命，一分钱一分货，绝不含糊。沙漠里的商队一听这风声，哪个还敢走老路？一个个连夜收拾驼驮，改道绕行，宁可多走几日冤枉路，也不愿撞在旅团的刀口上。那一夜，商路上的驼铃响到天明，尽是往新道上赶的。有那手脚慢的，第二日一早还在路口犹豫，已被先走的人催得满头大汗。这镀金旅团本就是沙漠里的一伙雇佣兵，向来认钱不认人，如今价目一改，分明是趁着沙漠与雨林生事，要趁火打劫，大发一笔横财。那些商队也都是明白人，知道惹不起，只好脚底抹油，早早避开。"
 SUM_Neo_SGD_News.2.a:"阅"
 SUM_Neo_SGD_News.3.t:"沙下的石板"
 SUM_Neo_SGD_News.3.d:"有一支商队，从一处古代遗迹里，带出了一块石板。那石板上刻着古怪的文字，看不懂，可瞧着年代久远，端的是件古物。谁知这事被官署知道了，立刻派人拦下商队，说这石板是赃物，理应没收充公。商队的人叫屈，说这是我们辛辛苦苦从遗迹里挖出来的，怎么就成了赃物？可官署哪里肯听，一纸文书下来，硬是把石板收进了库房。它进了那库房之后，便如同石沉大海，再没有出来过。有人说，是被上头的官儿私下里留下赏玩了，也有人说，早被融化改作别用，究竟如何，谁也拿不出个实据。有人说那是赤王时代的古迹，记载着沙漠失落的秘密，官署怕它落入外人之手，才谎称赃物，强行收了去。"
 SUM_Neo_SGD_News.3.a:"阅"
 SUM_Neo_SGD_News.4.t:"绿洲的渠"
 SUM_Neo_SGD_News.4.d:"沙漠里几座城邦，这一回竟合力办成了一件大事，便是开渠引水。各城出人出钱，齐心协力，硬是在沙地上掘出一条长渠，把远处的水一路引到城根底下。沙漠里头，水便是命，这渠一通，几座城邦的人都涌到渠边来看水。但见那渠水哗哗地流，清亮亮的，映着日头。渠边站满了人，男女老少，黑压压一片，你挨着我，我挤着你，谁也不肯先转身回去。有老人蹲在渠边，伸手撩起一捧水，看着它从指缝里漏下去，眼眶竟红了。众人就这般看着，从日中看到日暮，仍不忍离去。沙漠诸城向来各自为政，为了一处水源，动辄争吵械斗，如今竟肯合力开渠，端的是天大的造化。有那见过旧渠的老人说，这渠一通，往后便再也不用为水红了脸。"
 SUM_Neo_SGD_News.4.a:"阅"
 SUM_Neo_SGD_News.5.t:"旗在城头"
 SUM_Neo_SGD_News.5.d:"镀金沙漠的城头，这一日升起了一面新旗。那旗红底金纹，上面绣着一只展翅的飞鸟，在日头底下猎猎作响，端的威风。这意味着沙漠的人，从此有了自己的旗号，不再看别人的脸色行事。再瞧那往日里收税的官署，如今大门紧闭，门上的封条还贴着，早已无人进出。官署门口，坐着几位白胡子长老，正捧着一卷盟约，摇头晃脑地念给来往的人听。念的是各族旧誓，说的是沙漠独立。来往的行人，有的驻足听上几句，有的匆匆走过，可那面红底飞鸟旗，人人都瞧见了。原来沙漠各部商议了许久，才定了这红底飞鸟的式样，那飞鸟便是沙漠人向往自由的意思。旗一升起，城头上的兵卒都朝着它行了礼。"
 SUM_Neo_SGD_News.5.a:"阅"
 SUM_Neo_SGD_News.6.t:"东去的驼队"
 SUM_Neo_SGD_News.6.d:"沙漠的驼队，往年总是驮着贡品，往雨林那边送去。可如今，他们不再往雨林送贡了，一个个都改了道，把驼队赶向了港口。原来是沙漠与雨林闹翻了，谁还肯把自家的好东西白白送去进贡。那些贡品，如今改走海路，运到港口，装船出海，换来的是真金白银的摩拉。雨林那边的关卡，往日里车水马龙，忙得不亦乐乎，如今可就冷清了，守关的兵卒一个个靠在墙根打盹，十个关卡空了一半。有那闲不住的兵卒，望着空荡荡的官道，忍不住打了个哈欠。那些贡品原本要经雨林的关卡，层层盘剥，到了教令院手里，已去了大半。如今改走海路，少了中间层层克扣，卖出的价钱反倒更好，沙漠人何乐而不为。"
 SUM_Neo_SGD_News.6.a:"阅"
 SUM_Neo_SGD_News.7.t:"王座重光"
 SUM_Neo_SGD_News.7.d:"在那旧王城的遗址上，沙漠的人新垒起了一座高台。那台子是用石块一层一层砌起来的，虽比不上古迹巍峨，倒也端正结实。台子垒成之后，沙漠便在这台上，立起了自己的王。沙漠多少年没有自己的王了？如今重立君王，端的是一件惊天动地的大事。那登台称王的，披甲执剑，立在台顶，俯视着台下。台下的军队，早已按着号令站得整整齐齐，一队一队，刀枪如林，鸦雀无声。号角吹响，三军齐声呐喊，声浪在遗址间回荡，惊起一群栖息的飞鸟。原来他是沙漠一位有声望的长老，素来为大家所敬重，如今众望所归，被推上了王位。他登台之时，台下欢声雷动，都道沙漠从此有了主心骨。"
 SUM_Neo_SGD_News.7.a:"阅"
 SUM_Neo_SGD_News.8.t:"长老的账本"
 SUM_Neo_SGD_News.8.d:"沙漠的长老们，把各族的旧誓都抄在一处。这些旧誓，是各城邦、各部族祖祖辈辈传下来的，写的是沙漠人的根，说的是沙漠人的魂。长老们抄好了，便当着各城人的面，一篇一篇地念下去。念的是那古老的誓言，讲的是往日的荣光。听的人越来越多，把那念誓的长老围在中间。念到一半，忽然一阵风来，吹得那抄好的纸页哗哗作响，其中一张，竟被风卷了起来，打着旋儿飞上半空，转眼飘得没了影。长老愣了一愣，众人仰头望着，有人笑，有人叹，都说这是天意。原来沙漠各部离散多年，彼此猜忌，如今重念旧誓，便是要大家记起同根同源，重新拧成一股绳。所以那长老念得分外郑重，众人也听得肃然。"
 SUM_Neo_SGD_News.8.a:"阅"
 SUM_Neo_SGD_News.9.t:"关隘易手"
 SUM_Neo_SGD_News.9.d:"雨林伸进沙漠的第一道关隘，到底还是易了手。并没有。那关墙依旧高高耸立，砖石完好，半点没伤。变的，只是守关的人和旗。往日里，关头上插的是雨林的旗，守的是雨林的兵；如今旗换了沙漠的红底飞鸟旗，守的也换成了沙漠的将士。城门还是那座城门，城墙还是那堵城墙，可里里外里，主人已经换了一家。有那往来惯了的行商，走到关前，愣了一愣，几乎认不出这还是不是从前的关卡。守关的沙漠兵卒，把枪一横，喝令过往行人登记。这关隘易手之后，沙漠的兵卒便在关墙上架起新磨的滚木礌石，又将关门加固，端的要把它守得铁桶也似。往来的商旅见了，都知道这条大道换了主人，走路也格外小心。"
 SUM_Neo_SGD_News.9.a:"阅"
 SUM_Neo_SGD_News.10.t:"兵向雨林"
 SUM_Neo_SGD_News.10.d:"沙漠的大军，离开了熟悉的绿洲，一路往东开去。这一去，便是深入雨林，前途未卜。随军的向导骑在骆驼上，一边辨认方向，一边对身边的士卒说道，再走十天，便能望见须弥城的尖塔了。那须弥城的尖塔，是教令院的所在，是大贤者阿扎尔的治所，也是此行的目的地。士卒们听了向导这话，精神一振，脚步也快了些。他们中间，有不少人祖辈都住在绿洲，从未见过雨林是什么模样，更遑论须弥城的尖塔。一路行来，但见草木越来越密，天气越来越潮，与沙漠截然两样。这十天的路程，说长不长，说短不短，沙漠的兵马走惯了黄沙，如今一步踏入湿热的雨林，人马都觉着浑身不自在，但仍然一路向前，无一人退缩。"
 SUM_Neo_SGD_News.10.a:"阅"
 #################### 哈德拉玛维特 ####################
 #### 序章 · 主母的权柄 ####
 SUM_SDH_PRO_The_Matriarchs_Hold:"主母的权柄"
 SUM_SDH_PRO_The_Matriarchs_Hold_desc:"哈德拉玛维特的规矩，由主母定。谁能进哪座城、谁能拜哪座龛、商队的货分几成，都听主母一句话。雨林的敕令贴在城门上，主母不点头，风就把纸刮走了，无人敢多议。"
 SUM_Neo_SDH.1.t:"主母的权柄"
 SUM_Neo_SDH.1.d:"哈德拉玛维特这地方，规矩全都由主母说了算。谁能进哪座城，谁能拜哪座龛，商队的货该分几成，这等大事小事，皆听主母一句话。主母金口一开，便再无更改的余地，端的说一不二。这一日，雨林那边发来一道敕令，明晃晃地贴在城门上，要沙漠这边如何如何。可主母看也不看，只是不点头、不吭声。结果怎样？一阵风刮过来，把那敕令吹得猎猎作响，纸角翻卷，转眼就刮得没了影。城门口的人瞧着，谁也不敢上去捡。原来在这哈德拉玛维特，雨林的敕令还抵不上主母一个眼色。这哈德拉玛维特地处偏远，向来是天高皇帝远，雨林的敕令即便贴到城门上，也不过是一张废纸。主母的规矩却深入人心，从城头到村尾，无人不遵。"
 SUM_Neo_SDH.1.a:"循教令院发下的旧例"
 SUM_Neo_SDH.1.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Matriarch_Word:"主母的话"
 SUM_SDH_PRO_Matriarch_Word_desc:"主母端坐厅上，平日话不多，可每开一句口，底下便有人提笔抄下。抄的不是家常话，是一条条要人照办的规矩。众人抄了又抄，谁也不敢添半个字，端的句句算数。"
 SUM_Neo_SDH.2.t:"主母的话"
 SUM_Neo_SDH.2.d:"主母坐在厅上发话。她这人，话不多，句句都短，可每一句出口，底下便有人赶忙提笔抄下来。原来在这地方，主母说的话不是寻常言语，而是规矩，是人人得照办的章程。所以那些书记、长老，一个个竖起耳朵，主母说一句，他们记一句，生怕漏了半字。抄下来的，端的是规矩，不是什么意见建议，容不得半点商量。有那新来的年轻人，不明就里，想随风附和说上一两句，被旁边的老人一把扯住袖子，悄悄摇头，叫他莫要造次。主母端坐上首，目光缓缓扫过堂下，众人便都低了头。那些抄下来的规矩，当日便由快马分送各城，贴在要道口上，让来往行人都能看见。所以主母虽深居简出，她说的话，却传得比风还快。"
 SUM_Neo_SDH.2.a:"把账目封存"
 SUM_Neo_SDH.2.b:"把账目摊开"
 SUM_SDH_PRO_Babel_Line:"芭别尔的血脉"
 SUM_SDH_PRO_Babel_Line_desc:"现任主母的名字，是从母亲那里传下来的，母亲的名字，又来自上一任。这条线一年年拉得极长，长得叫人不敢深问，只怕一路问上去，连自己是谁都辨不清了，端的越往上越说不清。"
 SUM_Neo_SDH.3.t:"芭别尔的血脉"
 SUM_Neo_SDH.3.d:"现任主母的名字，是从她母亲那里传下来的；而她母亲的名字，又是从上一任主母那里传下来的。这一代一代往上数，这条线拉得极长，长得叫人不敢深问。这名字里头，藏着的是哈德拉玛维特的传承，是主母一脉相承的名分。有那好事的年轻人，仗着几分酒意，想追问一句，这名字最初究竟从何而来，最早的那一任主母，又是谁？话刚出口，便被旁边的人用眼色止住，再不敢往下说。原来这名字的来路，端的有些说不清道不明，越往上追，越是缥缈，追到后来，便追到了那些不敢深究的传说里去了。原来在这地方，人们相信名字里头住着先人的魂，叫着这个名字，便像是先人还活着，还在替大家做主。"
 SUM_Neo_SDH.3.a:"按官署的判断行事"
 SUM_Neo_SDH.3.b:"按自己的判断行事"
 SUM_SDH_PRO_Tribe_Council:"部族的座次"
 SUM_SDH_PRO_Tribe_Council_desc:"各支部族议事，座次离主母越近的，分到的水便越多。这座次年年重排，排一回便吵一回。争的不是脸面，是那几口井的活水，端的座位就是水，谁也不肯让。"
 SUM_Neo_SDH.4.t:"部族的座次"
 SUM_Neo_SDH.4.d:"哈德拉玛维特各部族的座次，端的有些讲究。这座次离主母坐得越近，分到的水便越多。在这沙漠地面，水便是命脉，多分一分水，便多活一分人，所以这座次，人人看重。可这座次并非一成不变，而是每年都要重排一回。每排一次，各部族便吵作一团，你道我该坐前，我说你该居后，争得面红耳赤，谁也不肯相让。有一年重排座次，几个部族的首领在厅上吵了整整半日，口水都快干了，最后还是主母冷冷地说了一句话，众人才悻悻住了口，按着新定的座次坐下。这分水的多少，关乎一部族的生死，所以那座次之争，从来不是意气用事。每一族都把自己历年出的力、立的功数了又数，恨不得把座次挪到主母脚边。"
 SUM_Neo_SDH.4.a:"先看住脚下的城"
 SUM_Neo_SDH.4.b:"先看住远方的人"
 SUM_SDH_PRO_Silent_Law:"不落文字的规矩"
 SUM_SDH_PRO_Silent_Law_desc:"主母立的规矩，大多不落成文字，全靠人一个传一个。传的人多了这句，少了那句，规矩就变了模样。传到后来，连立的本人也认不出自家的规矩了，端的口说无凭。"
 SUM_Neo_SDH.5.t:"不落文字的规矩"
 SUM_Neo_SDH.5.d:"主母定的规矩，大多是不落文字的。它们不写在纸上，不刻在石上，全靠人一代一代口耳相传。不妥可就大了。规矩靠人传，传的人多了这句，少了那句，添油加醋，以讹传讹，传着传着，规矩就变了模样。同一个章程，甲听到的和乙听到的，往往对不上号，各执一词，都说自己听的是主母的原话。有一回，为了一处水塘该归谁用，两拨人各引据一条祖传的规矩，吵得不可开交，谁也说服不了谁，最后只好去请主母亲口裁断。主母无奈，只得重说一遍，才算平息。这口耳相传的规矩里，还藏着许多讲究，同一句话，老辈人这么说，少辈人又那么说，各人有各人的版本。主母知道此事，却也不急着纠正，只由它去。"
 SUM_Neo_SDH.5.a:"循教令院发下的旧例"
 SUM_Neo_SDH.5.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Oath_Mistress:"誓于主母"
 SUM_SDH_PRO_Oath_Mistress_desc:"入部的人，都要在主母面前立誓，誓词照着花神的名头发。立誓那日，人人屏息，无敢出声。立了誓的，日后若是翻脸，便是渎神，端的连鬼神都请来做了见证。"
 SUM_Neo_SDH.6.t:"誓于主母"
 SUM_Neo_SDH.6.d:"凡要加入部族的，都得在主母面前立誓。这誓词，端的是照着花神的名头发誓的。在这沙漠地面，花神是众人心里最敬重的神明，对着她的名头立誓，便是把身家性命都押了上去。立了誓的人，从此便是部族中人，有福同享，有难同当。可反过来，这誓也是一条锁链。立了誓的，若是日后翻脸背叛，那便不是寻常的背信弃义，而是渎神的大罪，为天地所不容，为众人之所共弃。所以那立誓的场面，端的庄严，立誓的人跪在地下，跟着长老一句一句念，念到那花神的名头，个个神色肃穆，不敢有半分轻慢。这立誓的习俗，源自花神诞祭，凡在祭日立誓的，格外郑重，便是最顽劣的人，到了那日也收敛几分，不敢在神前造次。"
 SUM_Neo_SDH.6.a:"把账目封存"
 SUM_Neo_SDH.6.b:"把账目摊开"
 SUM_SDH_PRO_Edict_Wall:"城门上的敕令"
 SUM_SDH_PRO_Edict_Wall_desc:"教令院的敕令贴在城门上，管的是赋税与驻军两桩大事。看的人倒多，围了一层又一层，可照着办的没几个。众人看过便散，端的公文一张，管不住人心，墙还在，令已成空文。"
 SUM_Neo_SDH.7.t:"城门上的敕令"
 SUM_Neo_SDH.7.d:"雨林发来的敕令，又贴到了城门上。这一回的敕令，管的是赋税与驻军两桩事，写得明明白白，要沙漠这边如何纳贡、如何驻兵。看的人倒是不少，一早便围了一圈，指指点点，议论纷纷，可真正照着办的，却没几个。有的看完一撇嘴，转身就走；有的凑近了，装模作样地看上两眼，其实一个字也没记住。城门口那张敕令，贴了没几日，纸角便被风吹得卷了起来，墨迹也叫日头晒淡了。雨林那边遣来的官儿，等了又等，不见回音，干着急也没处说理。这敕令贴了又撕，撕了又贴，雨林那边也知道徒劳，却依旧按期送来，仿佛贴了便是尽了责。城门口的百姓早看惯了，连眼皮都不抬一下。"
 SUM_Neo_SDH.7.a:"按官署的判断行事"
 SUM_Neo_SDH.7.b:"按自己的判断行事"
 SUM_SDH_PRO_Tax_Officer:"教令院的税吏"
 SUM_SDH_PRO_Tax_Officer_desc:"税吏挟着账本来收账，那账本摞起来比人还高。主母见了，也不翻账，只请他喝一盏茶。一盏茶未喝完，账目便短了一大截，端的会喝茶也会办事，谁也不问短在何处。"
 SUM_Neo_SDH.8.t:"教令院的税吏"
 SUM_Neo_SDH.8.d:"雨林的税吏，带着账本来收账。那账本摞起来，竟比人还要高，厚厚的一摞，记满了这些年欠下的税。税吏把账本往案上一放，洋洋得意，以为这回总能把沙漠的欠税收个清楚。主母见了那税吏，不慌不忙，先请他坐下喝茶。那茶是沙漠里最好的香茶，一盏接一盏地敬上去。税吏喝着喝着，晕乎乎之间，再低头去看那账本，怎么账目竟短了一截？原来主母请他喝茶的功夫，底下人早把那账本翻了个遍，该涂的涂，该抹的抹。等税吏回过神来，账目已经对不上了，只好悻悻而归。那税吏本想讨个公道，怎奈茶过三巡，话头都被主母引到别处去了，再提起账目，自己都觉着理亏。末了只好揣着那本短了一截的账，灰溜溜地回雨林交差。"
 SUM_Neo_SDH.8.a:"先看住脚下的城"
 SUM_Neo_SDH.8.b:"先看住远方的人"
 SUM_SDH_PRO_Forest_Guard:"雨林的戍卒"
 SUM_SDH_PRO_Forest_Guard_desc:"雨林在几处要道设了戍所，戍卒都是外乡人，认不得沙地的路。出门办事，少不得要雇个本地人引路。这引路的一开口，价钱便由不得你了，端的强龙难压地头蛇，价高也得认。"
 SUM_Neo_SDH.9.t:"雨林的戍卒"
 SUM_Neo_SDH.9.d:"雨林在几处要道上，设下了戍所，派了兵卒驻守。这戍所设在沙漠的地面，可那些雨林来的戍卒，都是些南方人，哪里认得沙漠里的路？出了戍所，但见黄沙漫漫，一处沙丘看着和另一处一模一样，走不了多远便晕头转向，连回来的路都找不着。所以这些戍卒，但凡要出门办差、巡逻、巡粮，都得先雇一个本地人带路。那本地的向导，骑着骆驼，在头里慢悠悠地走，雨林的兵卒牵着马，在后头紧紧跟着，生怕跟丢了。有一回，一个自作聪明的戍卒不肯雇向导，独自出门，结果在沙里转了两天两夜，差点渴死。那些本地向导也乐得挣这份钱，牵着骆驼，慢悠悠地在头里走，遇到难走的沙窝，便停下来指指点点，把戍卒支使得团团转，端的惬意。"
 SUM_Neo_SDH.9.a:"循教令院发下的旧例"
 SUM_Neo_SDH.9.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Survey_Team:"测绘队"
 SUM_SDH_PRO_Survey_Team_desc:"测绘队画了三年地图，几处水源的位置竟标错了。主母拿到图，看也不改，只淡淡收在一边。错了的图，正好叫外人照着走岔了路，端的将错就错，也是一计，这一错反倒成全了计策。"
 SUM_Neo_SDH.10.t:"测绘队"
 SUM_Neo_SDH.10.d:"雨林的测绘队，在这沙漠地面，辛辛苦苦画了三年的地图。三年光景，风餐露宿，端的辛苦。可这图画出来，却有一桩大错，便是把好几处水源的位置，都标错了地方。沙漠里头，水源便是最要紧的所在，标错了位置，那是要误人性命的。这桩错处，主母其实一清二楚，可她偏偏不作更正。她心里打的什么算盘？原来这错地图留着，雨林的军队依照它行走，便会在沙里找不着水，吃尽苦头。主母冷眼看着，只当不知道。果然，后来雨林的兵马按图索骥，几次在沙海中迷失，险些全军覆没。主母手下的老人，对这一带的每一处水井都了如指掌，哪处水深，哪处水浅，哪处旱季会干，心里都有一本账，只是从不写在纸上，免得落人把柄。"
 SUM_Neo_SDH.10.a:"把账目封存"
 SUM_Neo_SDH.10.b:"把账目摊开"
 SUM_SDH_PRO_Hidden_Accounts:"另一本账"
 SUM_SDH_PRO_Hidden_Accounts_desc:"主母另有一本账，记的是替各部悄悄藏下的粮与钱。这本账从不给人看，连总管也不知道放在何处，锁在贴身的匣里。藏的是粮，也是各部的把柄，端的谁也离不开。"
 SUM_Neo_SDH.11.t:"另一本账"
 SUM_Neo_SDH.11.d:"主母那里，另有一本账。这本账，与寻常的账本不同，上头记的，是她替各部族悄悄藏下的粮食与钱财。原来在这沙漠地面，各部族总有兴衰起落，今日风光，明日落难，主母便替他们把一部分家底藏起来，以备不时之需。这部落若遭了难，主母便从这本账上支取，接济于他。可这本账，端的机密，从不给人看。除了主母自己，谁也不知里面记着什么，藏着多少。有那大胆的，想凑过去瞧上一眼，主母只把账本往怀里一收，淡淡地说，这本账，你看不得。众人便再不敢多问。各部族托付的粮钱，主母从不挪作他用，遇了灾年，便照数发还，一文不少。因此各部族都信得过她，即便倾家相托，也没有半分犹豫。"
 SUM_Neo_SDH.11.a:"按官署的判断行事"
 SUM_Neo_SDH.11.b:"按自己的判断行事"
 SUM_SDH_PRO_Daughter_Floral:"花神的女儿"
 SUM_SDH_PRO_Daughter_Floral_desc:"历代主母都自称花神的女儿，信众也跟着这般叫。端的比刀还好使，一刀只能压一人，这名分却叫人人心里先软了三分，名字一出口，众人的头便低了。"
 SUM_Neo_SDH.12.t:"花神的女儿"
 SUM_Neo_SDH.12.d:"历代主母，都自称是花神的女儿。这一传统，端的悠久，一任传一任，从不间断。而那些信众，也都是这般称呼，见了主母，便尊一声花神的女儿。这名分有多重？在这沙漠地面，花神是众人的信仰，主母既是花神的女儿，那便是替神明在人间办事，说的话，自然带着几分天意，由不得人不信服。这一层名分，端的比刀好用。刀能压人身，却压不住人心，而这花神女儿的名头，却叫人心甘情愿地俯首听命。所以主母每逢大事，总要抬出花神的名头，众人便再无异议。这花神女儿的名分，还有一桩好处，便是各部族有了争端，都愿意请主母裁断，只因她既是神女，断事便天生带着三分公道，谁也不好再闹。"
 SUM_Neo_SDH.12.a:"先看住脚下的城"
 SUM_Neo_SDH.12.b:"先看住远方的人"
 SUM_SDH_PRO_Floral_Fete:"花神诞祭"
 SUM_SDH_PRO_Floral_Fete_desc:"花神诞祭在几处绿洲同时开锣，香火缭绕，歌乐连着响了七夜。卖花的耍把戏的沿街摆开。来的人比往年多了许多，把绿洲挤得水泄不通，端的沙地一年里就盼这一回热闹。"
 SUM_Neo_SDH.13.t:"花神诞祭"
 SUM_Neo_SDH.13.d:"花神诞祭到了。这一回，诞祭在好几处绿洲同时举办，端的热闹。香火缭绕，歌乐喧天，一连就是七夜。来朝拜的人，比往年多了许多，扶老携幼，从四面八方赶来，把绿洲挤得满满当当。白日里，人们献上鲜花与供品，载歌载舞；到了夜里，篝火燃起，歌声、鼓声、欢笑声，一直闹到天明。各处祭坛上的香，日夜不停地烧着，积下的香灰，厚厚的一层，到了天亮时分，伸手一摸，竟还是热乎乎的。这热度，端的是信众们一片诚心烧出来的。这诞祭的香火，都是各家各户亲手点上的，一炷香便是一桩心愿，七夜下来，香灰积了厚厚一层，那热气里，端的裹着千百人的祈望。"
 SUM_Neo_SDH.13.a:"循教令院发下的旧例"
 SUM_Neo_SDH.13.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Shrine_Village:"村头的龛"
 SUM_SDH_PRO_Shrine_Village_desc:"各村在村头立一处小小的神龛，龛前不设官，只留一个照看的老人。不过添油扫地，可村里的大小事，倒都先来问他一声，端的官虽小，众人却都得给面子。"
 SUM_Neo_SDH.14.t:"村头的龛"
 SUM_Neo_SDH.14.d:"各村在村头，都立着一处小小的神龛。那龛不大，不过丈许见方，里面供着花神的神位，摆着鲜花与清水。并没有。这龛前不设官，不设吏，只设一个照看的老人。那老人多半是村里年高德劭的长者，每日里来添添花、换换水、扫扫尘，把那神龛照看干干净净。谁来上香，谁来许愿，他也不盘问，也不登记，只是笑眯眯地在一旁坐着。有那外乡人经过，见这神龛简朴，倒也心生敬意，上前一拜。老人也不多话，只淡淡说一句，心诚则灵。那照看的老人，多是村里无儿无女的长者，把神龛当作了自家的营生，每日晨昏定时来打扫，风雨无阻。村里人也敬他，逢年过节，总要送些吃食去。"
 SUM_Neo_SDH.14.a:"把账目封存"
 SUM_Neo_SDH.14.b:"把账目摊开"
 SUM_SDH_PRO_Pilgrim_Path:"朝圣的小路"
 SUM_SDH_PRO_Pilgrim_Path_desc:"去绿洲朝圣的小路，有人常年打理，路面平，沿途也设有歇脚处。路上遇了人便结伴同行，遇了风便躲进沟里，香客络绎不绝，端的这小路走的人多了，也就成了大路。"
 SUM_Neo_SDH.15.t:"朝圣的小路"
 SUM_Neo_SDH.15.d:"通往各处绿洲朝圣的小路，端的是有人在打理。那些小路，穿沙过丘，本不好走，可常年有人修缮，填平坑洼，清除碎石，插上路标，端的平坦好行。这路是众人一点一点修出来的，走的人多了，便踏出了平坦。朝圣的人走在路上，若是遇上了别的香客，便结伴同行，一路说笑，倒也不寂寞。若是半道上起了大风，飞沙走石，众人便寻一处沙沟，躲进去避上一阵，等风过了再赶路。那一路上，常见于结队而行的香客，驼铃叮当，说说笑笑，朝着绿洲的方向走去。这打理小路的人，从不在人前露面，只是趁夜色出来修修补补，天亮时路便平了。朝圣的人只觉着路好走，却不知是谁在暗中行这方便。"
 SUM_Neo_SDH.15.a:"按官署的判断行事"
 SUM_Neo_SDH.15.b:"按自己的判断行事"
 SUM_SDH_PRO_Floral_Way:"花神之道"
 SUM_SDH_PRO_Floral_Way_desc:"信众把花神的旧诗编成歌，在田间唱，在驼背上唱，在火堆边也唱。唱的是老故事，可唱着唱着，人人心里便都认下了同一个花神，端的歌声一响，远近都应和。"
 SUM_Neo_SDH.16.t:"花神之道"
 SUM_Neo_SDH.16.d:"信众们，把花神留下的那些旧诗，都编成了歌。那些诗，原本是花神有感而发写下的，字字珠玑，句句含情，如今配上曲调，便成了动听的歌儿。端的四处都唱。在田间地头，农人一边劳作一边哼唱；在驼背之上，行商随着驼铃的节奏低声吟唱；在篝火旁边，众人围坐，放声高歌。这歌声，一传十，十传百，越传越远，把花神的故事，把沙漠的传说，都唱进了每一个人的心里。有一个老歌手，能一口气唱上几十段，从日头偏西唱到月亮升起，听的人围了一圈又一圈，都听得入了神。这歌声还传到沙漠深处，连那最偏僻的绿洲里，也有人在火边传唱。花神的故事，便借着这一曲曲歌儿，越过沙海，一代代地留了下来。"
 SUM_Neo_SDH.16.a:"先看住脚下的城"
 SUM_Neo_SDH.16.b:"先看住远方的人"
 SUM_SDH_PRO_Storm_Season:"沙暴季"
 SUM_SDH_PRO_Storm_Season_desc:"一年里有三个月刮风，风一起，黄沙蔽日，商队只得停摆。城与城之间断了往来，连送信的人也困在道上，端的人人闭户，个个愁风，这三个月，比打仗还叫人难受。"
 SUM_Neo_SDH.17.t:"沙暴季"
 SUM_Neo_SDH.17.d:"哈德拉玛维特地面，一年里头倒有三个月是刮风的。那风一起，黄沙遮天蔽日，白日里都似黄昏一般，连那日头都成了一团昏黄。商队赶着骆驼走到半路，迎面一阵旋风卷来，驼铃乱响，人畜都睁不开眼，只得就地卧倒，把货物用毡布裹了又裹，驼峰也用布蒙住。城与城之间的驼道，登时就断了往来。原来那三月里天时既定，风便如约而至，年年如此，谁也拗它不过。行商们没法，只好寻那背风的沟壑歇下，一等就是十天半月，干粮吃完了，便挖那沙里的草根充饥。有那性急的，硬要赶路，结果迷了方向，在沙里转上几转，依旧转回原处，险些渴死在半道。那风里夹着细沙，打在脸上生疼，行商裹紧头巾，一步一步挨着走。"
 SUM_Neo_SDH.17.a:"循教令院发下的旧例"
 SUM_Neo_SDH.17.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Caravan_Toll:"商队的分成"
 SUM_SDH_PRO_Caravan_Toll_desc:"过境的商队，要留一成货给主母。买的是一路平安。货留在关上，人便过得痛快。有那舍不得的，吃过一次亏，第二回便乖乖留货，端的这一成比买命还值。"
 SUM_Neo_SDH.18.t:"商队的分成"
 SUM_Neo_SDH.18.d:"这沙漠里行商，不论往哪城去，都要过那哈德拉玛维特的地面。过境的规矩，是主母定下的：货十成里头，留一成给她。这一成看着心疼，可商队没有一个不肯留的。这一成货，端的不是白送，乃是买了平安。主母收了这一成，便发下话去，这一路的水井、驼道、歇脚的营地，都归她照看。若有那不开眼的强人敢来打劫，主母手下的刀便要出鞘，管叫他有来无回。所以商队宁可少赚一成，也图个一路无事。你把那货卸下来，过秤，记账，交割清楚，主母的人便在驼队前头插一面小旗，一路护送到地界尽头，遇着那缺水的，还替你寻井打水。端的花钱消灾，自古皆然有一回落了半天脚，驼队被困在两座沙丘之间，进不得退不得，还是主母的人寻了水来，才解了围。"
 SUM_Neo_SDH.18.a:"把账目封存"
 SUM_Neo_SDH.18.b:"把账目摊开"
 SUM_SDH_PRO_Guide_Storm:"识风的人"
 SUM_SDH_PRO_Guide_Storm_desc:"沙漠里有人能看云识风，比看星还准。这样的人出行，主母便请他在前头带路，众人见了，都争着请他看一眼天。端的能人不在多，有一个在身边，胜过金子一车，众人离了他寸步难行。"
 SUM_Neo_SDH.19.t:"识风的人"
 SUM_Neo_SDH.19.d:"沙漠里有一种本事，唤作看云识风。便是抬头瞧那天上的云，看它往哪边飘，卷成什么形状，是薄是厚，是白是灰，便知明日刮不刮风，风又从哪一方来。这本事，比那夜里看星辰还要准些。主母帐下便养着这么一个老儿，须发皆白，两只眼睛昏花，走起路来也颤巍巍的，可一抬头看云，端的赛过活神仙。每回商队要动身，先来问他，他只捋着胡子看上半晌，说一句今日可走，或是明日且住，从来没错过。有一回他不许一行人动身，众人将信将疑，果然半日后狂风大作，那些不信的，尽数困在沙里。因此各部的头人争着请他，送金子也不肯放。众人自此服了他，凡有远行，必先请他看云，他说行便行，他说止便止，从没误过事。"
 SUM_Neo_SDH.19.a:"按官署的判断行事"
 SUM_Neo_SDH.19.b:"按自己的判断行事"
 SUM_SDH_PRO_Salt_Road:"运盐的路"
 SUM_SDH_PRO_Salt_Road_desc:"盐从北边盐场运来，一路要过三道卡子。每过一卡便添一层税，等到了地头，盐价已翻了三倍，盐商叫苦，百姓皱眉，端的吃苦的还是买盐的人，这盐价一涨，苦了挑担的人。"
 SUM_Neo_SDH.20.t:"运盐的路"
 SUM_Neo_SDH.20.d:"哈德拉玛维特不产盐，那盐是从北边的盐场一峰一峰驮来的。可这盐路不好走，路上要过三道关卡。头一道在北边入口，验的是驼队人数；第二道在沟壑口，查的是货担数目；第三道最狠，就在城外五里，主母的人把秤一摆，每袋盐都要过秤，少一斤也不放你过去。过一道卡，纳一道钱，三道卡过完，那盐价便翻了三倍。这斟酌都在秤上：秤星高一线，商队便多贴一成，那秤手的手腕一抖，你便吃了哑巴亏。可盐是命根子，百姓顿顿要用，贵也得买。于是那运盐的驼队，年年络绎不绝，主母的库房里，盐钱堆得像小山一般。端的过手三层，价高万丈那秤手是主母的心腹，年年在此，连商队姓甚名谁都记得，谁也别想在他跟前耍花招。"
 SUM_Neo_SDH.20.a:"先看住脚下的城"
 SUM_Neo_SDH.20.b:"先看住远方的人"
 SUM_SDH_PRO_Merc_Contract:"雇请佣兵"
 SUM_SDH_PRO_Merc_Contract_desc:"主母不养常备军，遇了事才临时雇兵。雇来的兵认的是钱，不认花神，也不认主母。钱一到手便卖命，钱若不到，转身就走，所以主母宁可多养几条盐路，端的靠不住。"
 SUM_Neo_SDH.21.t:"雇请佣兵"
 SUM_Neo_SDH.21.d:"主母治下，从不养那常备的兵。你道为何？养兵要粮要饷，日日花钱，主母舍不得。所以一遇了事，比如商路被截，或是哪部闹事，她便临时去雇兵。那雇来的兵，多是四方游荡的悍客，谁给钱多便跟谁走，今日在这部，明日便在那部。主母发下银钱，他们便提刀上驼，替她去厮杀；银钱一停，便作鸟兽散，连招呼也不打一个。这等兵认的是钱，不认的是什么花神，更不认主母的颜面。有一回敌兵压境，主母的银子迟发了一日，那伙雇兵便按兵不动，躲在帐里喝酒，直到银钱送到，方才呐喊着冲杀上去。部将们看不过，劝主母索性养一支自家的兵，主母只是摇头，说养兵太费钱，不如雇的划算。"
 SUM_Neo_SDH.21.a:"循教令院发下的旧例"
 SUM_Neo_SDH.21.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Thousand_Ravine:"千壑沙地"
 SUM_SDH_PRO_Thousand_Ravine_desc:"沙地深处沟壑纵横，岔路极多，外人进去，多半转不出来。不是贪险，是为了躲人。追兵尽走大道，谁也想不到你钻兽径，等你从另一头出来，早没影了。"
 SUM_Neo_SDH.22.t:"千壑沙地"
 SUM_Neo_SDH.22.d:"哈德拉玛维特沙地深处，沟壑纵横，一道套一道，仿佛迷宫一般。那沟又深又窄，两壁立着，好似刀削，上头一线天，底下不见底。外人若误进去，东转西转，转上三日也寻不着出口，喊破喉咙也没人应，渴死饿死的，不知有多少。所以外人提起这沟壑，个个脑门冒汗，宁可在外头绕远。可本地人却不同，他们进去，不是迷路，乃是要躲人。部族里有了仇家，或犯了族规，便一头钻进沟里，寻那隐蔽的石窟住下。外人寻不着，族人寻得着，夜里悄悄送上饭食，一躲就是半年，待那风头过了，方敢出来。所以犯了事的人，宁可钻进沟里受那苦，也不肯出来伏法，那沟竟成了逃人的窝。端的：沟壑本是天生的牢，却做了本地人的护身符。"
 SUM_Neo_SDH.22.a:"把账目封存"
 SUM_Neo_SDH.22.b:"把账目摊开"
 SUM_SDH_PRO_Hidden_Well:"暗井"
 SUM_SDH_PRO_Hidden_Well_desc:"沙地里藏着几口井，从不标在图上，是各部留给自己人的后路。寻常人等寻不见，便是寻见也未必肯说。藏的是水，也是命，人人守口如瓶，端的荒年就靠它活命，谁也不敢往外说半个字。"
 SUM_Neo_SDH.23.t:"暗井"
 SUM_Neo_SDH.23.d:"这沙漠里头，还藏着几口古井，是从来不标在地图上的。那井口用石板盖了，上面堆些乱石枯草，不走到跟前，谁也瞧不出来。原来这是各部留给自己人的后路。倘若哪日大难临头，部族被人追赶，便奔这秘井而来，扒开乱石，揭起石板，咕咚咚饮个痛快，再灌满皮囊，方才从容他去。有了这几口井，部族便有了退路，遇事也不至于束手待毙。主母也曾派人去寻，可那藏井的人守口如瓶，任你严刑拷打，只不吐一个字，宁可挨那皮鞭。有几部为这井争过几回，几乎动了刀，后来立下规矩，谁先寻着便谁先用，方才罢了。端的：明面上的路给人走，暗地里的井留自家。"
 SUM_Neo_SDH.23.a:"按官署的判断行事"
 SUM_Neo_SDH.23.b:"按自己的判断行事"
 SUM_SDH_PRO_Storm_Camp:"风中的营地"
 SUM_SDH_PRO_Storm_Camp_desc:"营地在沟壑背风的一面扎下，风再大也掀不翻。这样的营地有几十处，一处挨着一处。端的兵马歇在其中，睡得格外安稳，风沙近不了身，这背风的沟里，扎营最是稳妥。"
 SUM_Neo_SDH.24.t:"风中的营地"
 SUM_Neo_SDH.24.d:"各部扎营，自有讲究。那营地从不设在当风的高处，专挑沟壑背风的一面安扎。这一面背风，风再大，也被那道土梁挡住，吹到营里只剩一丝微风，连那火塘都吹不灭。帐子扎得低，绳索扯得紧，四角还压上石块，任你狂风呼啸，也掀不翻一顶帐。这样的营地，哈德拉玛维特地面竟有几十处，星星点点，散在各条沟里，各有名号。哪一部遇到大风，便奔最近的营地躲进去，人畜都安顿得妥妥帖帖，还能生火煮茶。主母巡行各部，也依着这些营地歇脚，从不用另搭帐房。行商远远望见那背风的土梁，便知到了营地，翻身下驼，把货往帐里一堆，先讨一碗热茶喝。端的：会扎营的，把风都算在前头。"
 SUM_Neo_SDH.24.a:"先看住脚下的城"
 SUM_Neo_SDH.24.b:"先看住远方的人"
 SUM_SDH_PRO_Beast_Cave:"兽径"
 SUM_SDH_PRO_Beast_Cave_desc:"沟底的兽径，又窄又险，没人愿意走。可真到了急头上，走兽径反倒是最近的。追兵尽走大道，谁也想不到你钻兽径，等你从另一头出来，早没影了，端的路不在宽窄。"
 SUM_Neo_SDH.25.t:"兽径"
 SUM_Neo_SDH.25.d:"沟壑底下，有一条条兽径，是野兽常年踩出来的小道。那路又窄又险，一边是峭壁，一边是深沟，人走上去，得侧着身子，手扶着石壁，脚下一滑便要粉身碎骨。所以平日里，没人愿意走这兽径，宁可绕远走大道，多费些脚力。可到了急的时候，就顾不上许多了。有一回，部族的信使要送急信，那信关乎全族的安危，绕大道要多走两日，他一咬牙，钻进兽径，攀着石壁，脚下一次打滑，险些摔下沟去，好容易抓牢一丛灌木，才爬将过去，手也磨得鲜血淋漓，硬是半日便到了，把信送到。后来那信使得了赏，却在酒桌上说，那兽径走得一回，便不想走第二回，端的拿命换的路。端的：平常嫌它险，急时却靠它快。"
 SUM_Neo_SDH.25.a:"循教令院发下的旧例"
 SUM_Neo_SDH.25.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Old_Fort:"沙下的旧堡"
 SUM_SDH_PRO_Old_Fort_desc:"旧堡是几十年前留下的，墙还立着，人早没了。没人记得，连碑上的字也被风沙磨平。有那胆大的进去看，出来便说再不来了，端的是空城一座，只剩断砖残瓦。"
 SUM_Neo_SDH.26.t:"沙下的旧堡"
 SUM_Neo_SDH.26.d:"沙地深处，立着一座旧堡。那堡是几十年前留下的，夯土的墙，早被风蚀得斑斑驳驳，一层一层，像老人脸上的皱。部里的老人也说不清，只听上辈人含糊讲过一句，年代久了，竟没人记得。如今那墙还在，齐整的垛口依稀可辨，堡里却早没了人。荒草没膝，螺蛳壳、碎陶片遍地都是，偶有鸮鸟在墙头叫两声，更显得凄惶。有的部族路过，进去避过风，拾几块完整的陶片带走，揣在怀里做个念想。主母说这堡是前人的遗产，不可轻动，也不许拆。据说那堡里原先住着百来口人，后来一场大风沙，整座堡子都被埋了半截，人便渐渐散尽。端的：墙是死的，人是空的，唯有风还年年照旧吹。"
 SUM_Neo_SDH.26.a:"把账目封存"
 SUM_Neo_SDH.26.b:"把账目摊开"
 SUM_SDH_PRO_Expedition:"探险队的名单"
 SUM_SDH_PRO_Expedition_desc:"有一支探险队出过沙漠，回来的人比去时少了好几个。名单上划掉的名字，从此再没人提起，问及同行的人，活下来的都低头不语，端的这沙漠深处，埋了多少故事。"
 SUM_Neo_SDH.27.t:"探险队的名单"
 SUM_Neo_SDH.27.d:"早年有一支探险队，出了沙漠去闯那未知的地面。去时节人马齐齐整整，点起名来整整一队，驼铃响得欢，人人脸上都带着笑。可回来时节，却稀稀拉拉，少了好几个，驼也空了几峰。那花名册上，用朱笔划掉了几个名字，一道一道，红得刺眼，像是血。可怪的是，自那以后，谁也不再提这几个名字，仿佛提了便要招来什么。问起随行的老人，只低头不语，把话岔到别处去，还有的干脆捂了耳朵。那几个名字，仿佛从世上抹去了一般，连他们的亲人也不敢问。那几个名字，连祭礼上也不再念，牌位早撤了，仿佛这些人从未到过这世上一般。端的：出去时是活人，回来时成了册上朱痕，其中的事，竟没人肯说。"
 SUM_Neo_SDH.27.a:"按官署的判断行事"
 SUM_Neo_SDH.27.b:"按自己的判断行事"
 SUM_SDH_PRO_Samir_Line:"萨梅尔的图纸"
 SUM_SDH_PRO_Samir_Line_desc:"萨梅尔留过几张图纸，画的是某处遗迹的入口。这几张图纸后来被主母收了去，锁进贴身的箱子里。有人求看一眼，主母只当不曾听见，端的钥匙也不知交到了谁手。"
 SUM_Neo_SDH.28.t:"萨梅尔的图纸"
 SUM_Neo_SDH.28.d:"有个唤作萨梅尔的人，是个懂古物的，一辈子的心血都花在那遗迹上。他生前留过几张图纸，画得密密麻麻，标着一处遗迹的入口。那图上画着沙丘的走向，石门的方位，还有几行谁也认不全的古字，旁边缀着小字注解。萨梅尔一死，这几张图纸便落到了主母手里。主母也不声张，只命人寻来一只铁箱，把图纸卷好，锁了进去，钥匙自己贴身收着，连睡觉也不离身。有人问起，主母只说这是萨梅尔的遗物，替他收着罢了。可那铁箱放在内室，主母时不时便取出来看上一回，一看看上半晌。铁箱的锁换过三回，钥匙却始终在那一个人手里，旁人连箱盖是什么样都没见过。端的：图是死物，门在何方，端的藏着一段没人说破的因由。"
 SUM_Neo_SDH.28.a:"先看住脚下的城"
 SUM_Neo_SDH.28.b:"先看住远方的人"
 SUM_SDH_PRO_Key_Stone:"钥石"
 SUM_SDH_PRO_Key_Stone_desc:"探险队从遗迹里带回一块钥石，据说能开某一扇门。没人知道。有人拿它试遍了沙地的石门，都不合，端的这块石头，空有一身本事，找不到要开的那扇门。"
 SUM_Neo_SDH.29.t:"钥石"
 SUM_Neo_SDH.29.d:"那探险队从遗迹里，曾带回一块钥石。那石头不过巴掌大小，青幽幽的，摸上去冰凉，上面刻着的花纹，谁也认不得。据说这石头能开某一扇门，可门在哪里，却没人知道，问遍了队里的人，个个摇头。这可奇了，有了钥匙，却寻不着门，端的急煞人也。队里的人为这块石头争过几回，险些动了刀子，都说是自己先瞧见的。后来消息传到主母耳中，她便把钥石要了去，跟那几张图纸锁在一处，压在箱底，又加了一把锁。那钥匙，一道缝也不露，谁也别想瞧。后来有那大胆的，拿钥石去试遍了附近的石门，竟没一扇合得上，只得怏怏而回。端的：钥匙有了，门却无踪，世上的事，往往如此。"
 SUM_Neo_SDH.29.a:"循教令院发下的旧例"
 SUM_Neo_SDH.29.b:"听沙海与部族的呼声"
 SUM_SDH_PRO_Tribal_Wreck:"流亡的小部"
 SUM_SDH_PRO_Tribal_Wreck_desc:"有一支小部族，从大族里出走，在沙地深处自立门户。主母提起他们时，只说两个字，有人猜是反贼，有人猜是别的，端的那两个字，听的人各自心里明白，谁也猜不透主母的心思。"
 SUM_Neo_SDH.30.t:"流亡的小部"
 SUM_Neo_SDH.30.d:"各部之中，有一支小部族，不知何故，从大族里出走了。他们卷起帐子，赶着骆驼，连夜离了旧地，一头扎进沙地深处，寻了处隐秘沟壑，自立门户，从此不跟大族来往。这事本不算大，可主母提起他们时，脸上便不大好看，嘴里只吐出两个字。哪两个字？别急，听我说来，那两个字便是叛徒。主母只说这两个字，旁的便不再言，可那语气里的恨意，谁都听得出来，连帐下的刀手都替她不平。那出走的小部也硬气，你骂你的，我过我的，逢年过节也不来拜，竟不肯低头。也有那劝和的人，两头跑了几趟，嘴皮子都磨薄了，两边却谁也不肯先松口。端的：道不同便分手，从此两不相认。"
 SUM_Neo_SDH.30.a:"把账目封存"
 SUM_Neo_SDH.30.b:"把账目摊开"
 SUM_SDH_PRO_Dig_Ghost:"掘墓的影子"
 SUM_SDH_PRO_Dig_Ghost_desc:"夜里有人打着火把去掘墓，天亮前又把土填回原样。有人远远望见，也不敢上前细看，只记下那火把的去向。掘出了什么，只有他们自己知道，端的事见不得天日，问的人也被挡了回去。"
 SUM_Neo_SDH.31.t:"掘墓的影子"
 SUM_Neo_SDH.31.d:"沙漠的夜里，常有那么一伙人，悄没声地打着火把，去那荒坟上掘墓。他们专挑那月黑风高的夜晚，铁锹裹了布，不叫出声，连说话都以手示意。挖开了坟，把土一筐一筐往外运，天快亮时，又把土一筐一筐填回去，砌得跟原先一模一样，连那荒草都重新栽上，不留半点痕迹。问那伙人，个个缄口，只推说没掘着什么，还赌咒发誓。可第二日，有人远远望见他们怀里鼓鼓囊囊，用布包得严实，匆匆钻进了主母的院子。主母得了那物件，便叫匠人关起门来琢磨，一连几日不许人近前，也不知琢磨出什么。端的：夜里掘，天明填，坟头的土掩得住，人心里的秘密却掩不住。"
 SUM_Neo_SDH.31.a:"按官署的判断行事"
 SUM_Neo_SDH.31.b:"按自己的判断行事"

 #### 独立之路 ####
 SUM_SDH_IND_Breaking_the_Edict:"断敕"
 SUM_SDH_IND_Breaking_the_Edict_desc:"哈德拉玛维特要独立，先得料理一桩内里的事。主母的权柄一头来自花神，一头来自雨林的默许。撕一纸敕令容易，要把主母的根基从雨林那边拔出来，才是真难处。"
 SUM_Neo_SDH.32.t:"断敕"
 SUM_Neo_SDH.32.d:"哈德拉玛维特要争那独立，先得解决一桩内里的事。主母的权柄，一头来自花神，那是信众心里供着的；另一头，却来自雨林那边的默许。教令院一道敕令下来，主母能不能顶住，端看雨林点不点头。所以那敕令，说撕便撕了，一张纸而已，有何难处？可要把主母的根基，从雨林那边一点一点拔出来，才是天大的难事。那雨林经营多年，在各部都有眼线，有旧账，有人情，盘根错节，牵一发而动全身。主母为此夜夜不眠，在帐中踱来踱去，捻断了数串念珠。她曾私下遣人去探那雨林的虚实，回报的却尽是些模棱两可的话，更添了满腹疑团。端的：撕纸容易拔根难，独立二字，说来轻巧。"
 SUM_Neo_SDH.32.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.32.b:"把盟约收进箱底"
 SUM_SDH_IND_Envoy_Tribes:"走访各部"
 SUM_SDH_IND_Envoy_Tribes_desc:"主母派亲信走遍各部，带的不是礼物，是雨林欠各部的账。亲信到了一处，便把账念给一处的人听，念完众人皆怒。这一本账翻出来，端的旧账比金银还好用，众人听了无不动怒。"
 SUM_Neo_SDH.33.t:"走访各部"
 SUM_Neo_SDH.33.d:"主母要拔那雨林的根，先使出一着。她派亲信走遍各部，带的不是刀，不是钱，竟是一摞账本。那账上记得清清楚楚，这些年雨林从各部拿走多少水，多少盐，多少驼，一笔一笔，都要算个明白，连哪年哪月都写着。那亲信到了一部，便把账本往火堆旁一摊，一项一项念给众人听。众人一听，个个怒从心上起，原来自己吃了这许多亏，都有些坐不住了。主母要的，便是这股怒气。她让人把账抄成告示，四处张贴，连那不识字的，也请人念给他听。各部的头人读了账，脸都涨成猪肝色，当场就有那性急的，要把教令院的牌子砸了。端的：不费一刀一枪，先揭那旧账，人心便向着自己了。"
 SUM_Neo_SDH.33.a:"召集部族共商"
 SUM_Neo_SDH.33.b:"等官署先松口"
 SUM_SDH_IND_Council_Tent:"帐中议事"
 SUM_SDH_IND_Council_Tent_desc:"几十顶帐子围成一圈，议事那日，谁也不肯先进中间那顶。你推我让，半日也进不了帐，末了一齐进去。先进去的像是认了头一份，端的这份小心，人人都藏在肚里。"
 SUM_Neo_SDH.34.t:"帐中议事"
 SUM_Neo_SDH.34.d:"各部议事，那排场也自有一番讲究。几十顶帐子，团团围成一圈，好似一朵撒开的莲花。正中间那顶，是主母的帐，帐里铺着地毯，设着座位。议起事来，各家头人你看我，我看你，谁也不肯头一个走进中间那顶帐子。你推我让，站了半晌，倒像那帐里藏着什么吃人的猛兽，谁都怕先进去。原来这一个先进去，便显得自己急切，低人一等；落后进去的，倒占了体面。主母瞧着这般光景，也不催促，只端坐帐中，捻着念珠等候，由着他们推让。直等到主母咳了一声，才有那胆大的先迈步，众人这才鱼贯而入，依次坐了。端的：礼数就是脸面，谁也不肯先低头。"
 SUM_Neo_SDH.34.a:"备好兵与粮"
 SUM_Neo_SDH.34.b:"多派几趟使节"
 SUM_SDH_IND_Blood_Bond:"血盟"
 SUM_SDH_IND_Blood_Bond_desc:"立盟要当着花神的面放血，立誓那日，人人割破手掌，疼得钻心也不吭一声，血滴进酒里，各人分饮。放了血的部族，从此便算一家人，端的这一碗血酒，比金兰契还重。"
 SUM_Neo_SDH.35.t:"血盟"
 SUM_Neo_SDH.35.d:"立盟这桩事，在哈德拉玛维特是极重的。立盟不放别的，要当着花神的面放血。祭坛前摆着花神的神龛，香烟缭绕，各部头人依次上前，用刀在掌心划一道，把血滴进同一只铜碗里。那血一滴一滴汇在一处，红了半碗。主母端起铜碗，先饮一口，再递下去，人人都要饮，一口也不许剩。饮过这血酒的，从此便算一家人，有福同享，有祸同当，谁若背盟，便要受那血咒，不得好死。那日仪式完毕，众人掌心都缠着布，彼此相视，竟真有几分骨肉情分。那铜碗传了一圈，回到主母手里时，只剩浅浅一层，她一仰脖，饮得干干净净。端的：血滴一处，命便连在一处。"
 SUM_Neo_SDH.35.a:"把旗立起来"
 SUM_Neo_SDH.35.b:"把旗先卷起来"
 SUM_SDH_IND_Exiles_Back:"召回流亡的小部"
 SUM_SDH_IND_Exiles_Back_desc:"当年出走的小部，如今被召回，条件是过去的账一笔勾销。主母赐下的田宅，他们收得客气，却不敢真当自家人。回是回来了，人心却还在察，端的面上笑，肚里各自打算。"
 SUM_Neo_SDH.36.t:"召回流亡的小部"
 SUM_Neo_SDH.36.d:"当年那支出走的小部，如今被主母召回来了。开出的条件也明白：过去的账，一笔勾销，既往不咎。那小部思量再三，终究回来了，拖家带口，一路风尘。人回来了，帐子也扎回原处，可那人心，却还在察。各部的人见了他们，面上客客气气，背地里却拿眼瞟着，话里带刺，说什么出去了一遭，倒洋气了。那小部的人也自觉，走路低着头，说话陪着笑，可夜里聚在一处，免不了唉声叹气，后悔不该回来。主母看在眼里，知道这人心不是一朝一夕能收回来的，还需慢慢焐着。主母虽这般说，暗地里却仍防着一手，那小部地界的水井，依旧有人远远盯着。端的：人回来了，心还隔着一层。"
 SUM_Neo_SDH.36.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.36.b:"把盟约收进箱底"
 SUM_SDH_IND_Desert_Pact:"沙地之盟"
 SUM_SDH_IND_Desert_Pact_desc:"盟约写得明白：共守沙地，共分水源，共抗敕令。签字那日，各部的头人按了手印，谁也不许多说一句。三条之外，谁也不管谁的闲事，端的这约简单，反倒人人肯守。"
 SUM_Neo_SDH.37.t:"沙地之盟"
 SUM_Neo_SDH.37.d:"那盟约写成，白纸黑字，写得明白。头一条，共守沙地，哪一部地界受了侵犯，各部一齐出兵相助；第二条，共分水源，那几口井、几道泉，大家按份均分，不许独占；第三条，共抗敕令，但凡雨林那边再下什么敕令，各部同心顶回去。这三条之外，却还有一句最要紧的话：三条之外，谁也不管谁。原来各部首领都怕被人管得太紧，所以要留这一条，你走你的阳关道，我过我的独木桥，谁也别碍着谁。主母也依了，还当众画了押。这盟约抄了三份，各部各执一份，主母也执一份，用蜡封了，供在神龛前头。端的：约法三章，先小人后君子，反倒长久。"
 SUM_Neo_SDH.37.a:"召集部族共商"
 SUM_Neo_SDH.37.b:"等官署先松口"
 SUM_SDH_IND_Route_Grip:"把控盐路"
 SUM_SDH_IND_Route_Grip_desc:"盐路是哈德拉玛维特的命脉，谁把住盐路，谁就说得上话。卡子一设，盐价便由你定。从前是商队求人，如今是人求商队，颠倒了个儿，端的捏住这条线，满城都得听你的。"
 SUM_Neo_SDH.38.t:"把控盐路"
 SUM_Neo_SDH.38.d:"盐路这桩事，端的了不得。哈德拉玛维特不产粮，许多吃用都要拿盐去换，那盐路便是命脉。谁把住了盐路，谁手里便攥着大家的咽喉，说起话来，自然硬气三分，连主母也要让他几分。主母深知此理，所以那三道关卡，道道都要派自己人把守，连那秤手都是她的心腹。有一回，北边盐场闹了乱子，盐路一断，各部顿时慌了神，粮价一日三涨，人心惶惶，有的部甚至动了抢的念头。后来还是主母亲自出面，另寻了一条入沙的小道，才算把盐运进来。众人这才服了，都说这盐路，果然是命根子。自此各部都想把那盐路攥在自己手里，明争暗斗，端的把主母急得嘴里起了泡。端的：卡住盐路，便卡住了命。"
 SUM_Neo_SDH.38.a:"备好兵与粮"
 SUM_Neo_SDH.38.b:"多派几趟使节"
 SUM_SDH_IND_Caravan_Pact:"商队盟约"
 SUM_SDH_IND_Caravan_Pact_desc:"过境的商队与主母立约：保一路平安，换一份分成。商队交了分成，便得一面旗，插在驼背上，一路无人敢扰。约立得明白，路上便太平，端的把话说在前头，省了许多口舌。"
 SUM_Neo_SDH.39.t:"商队盟约"
 SUM_Neo_SDH.39.d:"那过境的商队，起初也不肯白白留那一成货。后来与主母立下约来，白纸黑字写得明白：主母保你一路平安，人畜货物但凡有失，她都照价赔偿；商队这边，愿将货抽一成，作为酬谢。这约立得明白，两边都吃了定心丸。主母得了货，自然尽力护送；商队花了钱，走路也踏实，夜里也睡得着。自此那驼道上，果然太平了许多，争执也少了，驼铃响得悠扬。偶有那不懂规矩的新商，主母的人便把约书拿出来，念一遍给他听，新商也就服了，乖乖留货。那约书用羊皮写成，两边各按了手印，主母收起一份，商队首领收起一份，谁也赖不得。端的：把话说在前头，路上反倒少事。"
 SUM_Neo_SDH.39.a:"把旗立起来"
 SUM_Neo_SDH.39.b:"把旗先卷起来"
 SUM_SDH_IND_Toll_Chain:"设卡收税"
 SUM_SDH_IND_Toll_Chain_desc:"要道上设卡收税，收来的税，却不进官署的账。官署想查，账册上却寻不见半个字，只得作罢。这一笔笔银钱，都进了主母的私库，端的名目是税，实则是自家的进项。"
 SUM_Neo_SDH.40.t:"设卡收税"
 SUM_Neo_SDH.40.d:"主母在要道上设了几处卡子，凡过往的车辆驼队，都要纳税。却不是进了教令院官署的账。原来主母另有一本账，那税款一厘一毫，都进了她自己的库房。收税的名目也多，过桥要钱，喝水要钱，连那歇脚的棚子也要钱，名目端的稀奇。商们敢怒而不敢言，因为不纳这税，你便过不去，只得忍痛掏钱。主母拿这钱，一半养那些护路的刀手，一半添自己的家底，日子过得越发滋润。有人劝她把账做明些，她只笑笑，说这沙漠里的规矩，就是没有规矩。商队里也有那硬气的，宁可绕远走小路，也不肯纳这钱，结果在沙里迷了路，吃了大亏。端的：税进了自家门，旁人休想查。"
 SUM_Neo_SDH.40.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.40.b:"把盟约收进箱底"
 SUM_SDH_IND_Mint_Sand:"沙中铸钱"
 SUM_SDH_IND_Mint_Sand_desc:"把商路上流通的钱，都换成本地所铸的新钱，成色写死在钱边。钱一面世，轻重便由不得外人说嘴。外邦的钱渐渐就没人肯收了，端的这钱一出手，买卖就得照它的规矩来。"
 SUM_Neo_SDH.41.t:"沙中铸钱"
 SUM_Neo_SDH.41.d:"主母又行了一着：要把商路上流通的钱，尽数换成本地所铸的钱。这钱不比那外来的银钱，成色高高低低，全凭一句话，往往掺了假。主母的钱，成色写死在钱边上，多一分少一分，都刻得明明白白，谁也不能赖。她命人在各处关卡设了兑换的摊子，外来的钱，按成色折成钱，换过了，方准通行。这么一换，那钱财的真假便可查，商队也不敢掺假，只得照实兑换。主母还规定，纳税只收本地钱，你便是揣着金银来，也得先换了。这么一改，市面上果然清静了许多，那掺假的没了空子可钻，百姓也放心了许多。端的：钱边上刻成色，是把算盘打到骨头里了。"
 SUM_Neo_SDH.41.a:"召集部族共商"
 SUM_Neo_SDH.41.b:"等官署先松口"
 SUM_SDH_IND_Stockpile:"囤积盐粮"
 SUM_SDH_IND_Stockpile_desc:"盐与粮悄悄囤进沙地深处的暗仓，一堆堆盖得严实。仓门一开，粮垛高得顶着梁，看的人无不咋舌。囤的是粮，也是底气，端的荒年来了，别人慌，主母这里却不慌。"
 SUM_Neo_SDH.42.t:"囤积盐粮"
 SUM_Neo_SDH.42.d:"主母瞒着众人，暗地里办了一件事：把盐和粮，一车一车，悄悄运进沙地深处的暗仓里。那暗仓挖在地底，入口掩在乱石后头，仓里干燥阴凉，粮放上几年也不坏，也不怕那风蚀鼠咬。这囤的哪里是粮，端的囤的是底气。你想，一旦雨林那边翻了脸，断了盐路，封了水道，各部没了吃用，便要乱，便要来求主母。可主母手里有这许多存粮存盐，便能稳住阵脚，人心也就不慌。这事做得极密，除了主母的心腹，谁也不知道，连那运粮的，也是蒙着眼睛走的。主母每隔三月，便亲自去那暗仓看一回，摸摸那粮袋，才放心回帐，端的宝贝得紧。端的：仓里有粮，心中不慌，养兵千日，用在一时。"
 SUM_Neo_SDH.42.a:"备好兵与粮"
 SUM_Neo_SDH.42.b:"多派几趟使节"
 SUM_SDH_IND_Shrine_Arms:"龛前的兵"
 SUM_SDH_IND_Shrine_Arms_desc:"把守护神龛的人编成一队，名义上是护法，手里拿的却是刀。他们平日里扫地添油，真有事时，刀比谁都快。拜神是假，护院是真，端的神的名义，办的是主的差事。"
 SUM_Neo_SDH.43.t:"龛前的兵"
 SUM_Neo_SDH.43.d:"各部本就有那守护神龛的人，平日里上香添油，打扫龛前，看起来都是些老实巴交的信众。主母却把这几路人马，统统编成一队。这名目取得好听，唤作护法，说是护卫花神的神龛，谁也说不出不是。可你若近前看，那些人腰间都藏着刀，一个个精壮彪悍，拳头攥起来能打死牛，哪是上香的老实人？主母要用他们时，一声令下，放下香炉，提起刀，便是一支能战的兵。平日里他们分散在各处神龛，不惹人眼目，一旦有事，聚起来便是主力。那些护法平日里混在香客堆中，谁也认不出，一到夜里，便聚到主母帐前听令。端的：名为护法，实是藏兵，香火底下，藏着刀光。"
 SUM_Neo_SDH.43.a:"把旗立起来"
 SUM_Neo_SDH.43.b:"把旗先卷起来"
 SUM_SDH_IND_Storm_Militia:"沙暴民兵"
 SUM_SDH_IND_Storm_Militia_desc:"各部的民兵按沟壑划片，风一起，各守各的口子。风沙里看不清人，只认得自家沟口的那盏灯。这片归你，那片归我，谁也不许越界，端的守土的事，人人都不敢含糊。"
 SUM_Neo_SDH.44.t:"沙暴民兵"
 SUM_Neo_SDH.44.d:"各部都有民兵，平日里种地放驼，一有风声，便拿起家伙，拎着长矛短刀。主母把这些民兵，按沟壑划成一片一片。哪一片归哪一管，哪一道口子归谁把守，都标得清清楚楚，刻在木牌上。指定了一处，你便死死守住，不许擅离半步，违者按军法处置。每年那三个月大风起时，各部民兵便各自守住自己的口子，防的是强人趁风打劫，也防的是别部越界生事。风沙里头，只见那口子上，隐隐绰绰立着人影，手握长矛，瞪大眼睛盯着路口，任那沙打在脸上。风起那几日，口子上不许生火，也不许高声，只许睁着眼盯着，违令者罚去挑水。端的：分片包干，各守一门，风沙再大也乱不了阵脚。"
 SUM_Neo_SDH.44.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.44.b:"把盟约收进箱底"
 SUM_SDH_IND_Hire_Riders:"雇骑"
 SUM_SDH_IND_Hire_Riders_desc:"雇来的骑手，是拿来打快仗的，打完就走，不管守土。钱一散，人便散得比来时还快，营里空了一半。他们来去如风，只认钱，端的仗打得漂亮，却留不住一寸地方。"
 SUM_Neo_SDH.45.t:"雇骑"
 SUM_Neo_SDH.45.d:"主母手里，还养着一批雇来的骑手。这些骑手骑术精绝，来去如风，能在马上翻跟头，主母用他们，端的只为一桩：打快仗。什么叫快仗？便是趁其不备，突袭一阵，抢了东西便走，绝不恋战，也不管那后面如何。打完这一仗，骑手们收了钱，翻身上驼，呼啸而去，至于那地方日后守不守得住，与他们毫不相干。守土的事，自有那按沟壑划片的民兵去管。有一回，骑手们突袭了雨林的一处哨所，得手便走，等雨林援兵赶到，早没了人影，只留下一地狼藉。主母也知道这伙人靠不住，所以从不让他们守要害，只用他们做那突击的勾当。端的：快仗图的是一击即走，守土二字，不在他们账上。"
 SUM_Neo_SDH.45.a:"召集部族共商"
 SUM_Neo_SDH.45.b:"等官署先松口"
 SUM_SDH_IND_Storm_Drill:"借风操演"
 SUM_SDH_IND_Storm_Drill_desc:"操演专挑风天，练的是辨向与结阵。风沙迷了眼，他们凭脚步声也排得整整齐齐。风越大，队伍反倒越稳，端的平日里在风里泡惯了，真打起仗来，别人慌他们不慌。"
 SUM_Neo_SDH.46.t:"借风操演"
 SUM_Neo_SDH.46.d:"主母练兵，另有一法。别人操演，都挑那风和日丽的好天气，她偏专挑大风天，越是飞沙走石越好。这却为何？原来沙漠里打仗，往往就在风起时，你若不惯那风沙迷眼，上了阵便要吃大亏，连眼睛都睁不开。所以主母的兵，专在狂风里操练，练的是两样本事：一是辨向，风沙再大，也能分得清东南西北，不迷路；二是结阵，风越大，队伍反而靠得越紧，肩挨着肩，纹丝不乱。练熟之后，那队伍端的越发稳当，风越大，阵越整，反倒把那风当成了帮手。慢慢的，兵士们把风沙当成了自家兄弟，风越大越来劲，反倒在风里唱起歌来。端的：把难事练成常事，上了阵便如走平地。"
 SUM_Neo_SDH.46.a:"备好兵与粮"
 SUM_Neo_SDH.46.b:"多派几趟使节"
 SUM_SDH_IND_Silent_Arm:"暗中的手"
 SUM_SDH_IND_Silent_Arm_desc:"有几支小队，从不挂旗，专管办事，事后不留半句言语。事办完了，人也就散了，仿佛从没来过。主母讲，这样的一只手得常备着，端的用的时节，连声音都听不见。"
 SUM_Neo_SDH.47.t:"暗中的手"
 SUM_Neo_SDH.47.d:"主母麾下，还有几支古怪的小队。这些人马出行，从不挂旗，也不打号，悄没声地来，悄没声地去，连那马蹄都包了布。他们专办那些不能摆到台面上的事：或是探听消息，或是夜里的勾当，办完便走，从不留下姓名痕迹。主母说，这样的手，端的得备着，少不得。果然，有那棘手的事，明面上去不得的，便交给这几支小队。他们办得干净利落，事后你问起，人人摇头，仿佛从没来过，连他们的影子都不见。旁的部将都不爱跟他们打交道，觉得背后发凉。这几支小队连名号都没有，只以头人的名字相称，事情办完，连头人自己也称没见过。端的：明刀明枪是兵，暗里办事是手，手比刀更叫人怕。"
 SUM_Neo_SDH.47.a:"把旗立起来"
 SUM_Neo_SDH.47.b:"把旗先卷起来"
 SUM_SDH_IND_Proclaim_Edict:"沙漠的告示"
 SUM_SDH_IND_Proclaim_Edict_desc:"告示用本地文字写成，贴在各城门外。你一言我一语，说什么的都有，差官拦也拦不住。认得的人便念给不认得的听，端的念完便议论开了，一张纸搅得满城沸沸扬扬。"
 SUM_Neo_SDH.48.t:"沙漠的告示"
 SUM_Neo_SDH.48.d:"主母的告示出来了，不用教令院那边的官话，偏用本地的文字写。告示一张一张，贴在各城门外的土墙上，浆糊还未干。识字的人驻足看了，便念给不识字的人听。这一念不要紧，众人听罢，登时议论开了，这个说好，那个道歹，嗡嗡嗡嚷成一片，有几个还争得面红耳赤。那告示贴得高，风一吹，呼啦啦作响，不多时便被风撕去了一角，缺了半边字。可那缺的那角，众人早记在心里，照样议论不休，都不用再看。那告示后来被风卷得无影无踪，可底下议论的话，还在城里传了十天半月。端的：告示是死的，嘴是活的，风撕得走纸，撕不走话。"
 SUM_Neo_SDH.48.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.48.b:"把盟约收进箱底"
 SUM_SDH_IND_Raise_Banner:"举旗"
 SUM_SDH_IND_Raise_Banner_desc:"哈德拉玛维特立起自己的旗，旗上是花神与沙丘的纹样。城头的人见了，都伸长了脖子看。这旗一升，风里猎猎作响，端的是花与沙并立，从此再不看别人的脸色，好不威风。"
 SUM_Neo_SDH.49.t:"举旗"
 SUM_Neo_SDH.49.d:"哈德拉玛维特，到底立起了自己的旗。那旗的底色，是沙丘一般的黄，上面绣着两样纹样：一样是花神的花，瓣瓣分明；一样是连绵的沙丘，起伏有致。旗做成那日，主母亲手在城楼上将其升起，底下的人都仰着看。风一吹，那旗猎猎作响，花纹在风里摆动，仿佛活的一般。各部的人远远望见，有的热血沸腾，当场欢呼；有的默不作声，心里打着鼓。从此这旗便插在哈德拉玛维特的地界上，进出城门的人，都要看它一眼，看久了，也就惯了。有那守旧的人看了，暗地里叹气，说这旗一立，往日的规矩便算彻底翻篇了。端的：一面旗，便是自立的心，插上城楼，便再难取下。"
 SUM_Neo_SDH.49.a:"召集部族共商"
 SUM_Neo_SDH.49.b:"等官署先松口"
 SUM_SDH_IND_Reject_Suzerain:"拒受敕令"
 SUM_SDH_IND_Reject_Suzerain_desc:"使节还在帐中絮叨，主母当面把敕令烧了。烧得正巧，一阵大风卷进来，纸灰扑了使节一身。使节抖了抖衣裳，一句话也说不出，灰溜溜走了，端的是烧了文书，也烧了情面，好一个下马威。"
 SUM_Neo_SDH.50.t:"拒受敕令"
 SUM_Neo_SDH.50.d:"雨林那边的使节，捧着教令院的敕令，来见主母。那使节把敕令展开，刚要开口宣读，主母却一把接过，看也不看，就着旁边的火盆点了火。那纸卷起来，火苗一舔，转眼便烧了大半，卷成一团黑蝶。可也合该有事，那日风正大，一阵卷进来，把纸灰吹得漫天飞舞，竟扑了使节一身，连袍角都沾了黑。使节站起身来，脸上一阵红一阵白，想要发作，却见主母神色不动，只淡淡说了一句，这里有风，烧得利索。旁边侍立的人，都低着头，偷着笑。使节的随从想上前理论的，被主母的人横刀拦住，只得愤愤退到一旁，眼睁睁看着。端的：烧的是纸，拂的是面子，一阵风，把两下的脸都吹变了。"
 SUM_Neo_SDH.50.a:"备好兵与粮"
 SUM_Neo_SDH.50.b:"多派几趟使节"
 SUM_SDH_IND_Redraw_Border:"重划地界"
 SUM_SDH_IND_Redraw_Border_desc:"地界照着水源与牧道重新划过，雨林设的界碑，一一挪开。挪碑那日，两拨人隔着新线对望，谁也不肯先开口。碑挪一寸，地便宽一分，端的这界不是画在纸上，是挪在地上。"
 SUM_Neo_SDH.51.t:"重划地界"
 SUM_Neo_SDH.51.d:"主母办完大事，便要重划地界。这回划界，不照旧年的老章程，却照着水源与牧道来。哪片地有水，哪条道放驼，便归哪一部管，谁也说不得什么。最要紧的，是把雨林先前立下的那些界碑，一块一块挪开。那些石碑上刻着教令院的字，立在泉边、路口，本是雨林圈地的记号，看得人心里发堵。主母派人把它们拔起，拉到远处，埋进沙里，连个碑也不留。有那识字的看了，心里明白，这是把雨林的旧账也一并埋了。那些被埋的界碑，日子久了，连埋在何处也没人记得，只有老人还能指出个大概。端的：碑挪一寸，地换一主，划界就是划权。"
 SUM_Neo_SDH.51.a:"把旗立起来"
 SUM_Neo_SDH.51.b:"把旗先卷起来"
 SUM_SDH_IND_Final_Word:"主母的最后一句"
 SUM_SDH_IND_Final_Word_desc:"主母当着各部代表的面，把话说得明白：从今往后，哈德拉玛维特的规矩，由哈德拉玛维特人自己定。此言一出，满帐寂静，端的众人心里的那口气，到这时总算顺了。"
 SUM_Neo_SDH.52.t:"主母的最后一句"
 SUM_Neo_SDH.52.d:"那一日，各部代表齐聚一堂。主母端坐在上，环视众人，缓缓开口，说从今往后，哈德拉玛维特的规矩，便由哈德拉玛维特人自己来定，再不由那雨林指手画脚。此言一出，满堂先是静了一静，接着便有人叫好，有人重重拍案，更有那性急的，当场跳将起来，把帽子都掀了。众人你看看我，我看看你，眼里都有些发热，握紧了拳头。主母却不动声色，等那喧哗稍歇，抬手压了压，又补了一句，得出口，也要守得住。这一句出来，满堂又静了，众人方才的热血，顿时都沉了下去，暗暗掂量起分量。端的：规矩自己定，得响，还要肩头扛得住。"
 SUM_Neo_SDH.52.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.52.b:"把盟约收进箱底"
 SUM_SDH_IND_Envoy_Port:"港口来客"
 SUM_SDH_IND_Envoy_Port_desc:"港口的客商带来船与价，开口便问：沙地的盐，走不走海路。主母端起茶，只顾看那客商的船。走海路利大，可也把命脉交到别人手上，端的这问题，主母没有立刻答。"
 SUM_Neo_SDH.53.t:"港口来客"
 SUM_Neo_SDH.53.d:"海边港口来了客商，带着船，也带着价。那些客商见的世面广，一开口便问主母：你沙地的盐，可愿走海路？原来这盐若走驼道，翻过三道卡，费时费力，还处处受人盘剥；若走海路，装上船，顺着海便能运到远处，价钱还能翻上几番。客商说得天花乱坠，什么船大，什么价高，什么一路顺风，听得人心里痒痒，有几个已跃跃欲试。主母却没有马上答应，只是捋着须，反复问那海路的深浅、船的吃水，问得客商都有些不耐烦。客商见主母追问不休，只当她是贪心，却不知她心里打的，是另一番算盘。端的：送上门的买卖，先问个明白，贪字头上，是把刀。"
 SUM_Neo_SDH.53.a:"召集部族共商"
 SUM_Neo_SDH.53.b:"等官署先松口"
 SUM_SDH_IND_Envoy_North:"北国使团"
 SUM_SDH_IND_Envoy_North_desc:"北国的使团最舍得花钱，金银一箱箱抬进来，却最不肯说明白钱要换什么。主母收了礼，却把话往回推。这般含糊，反倒叫人心里发毛，端的白拿的好处，都要拿别的东西来抵。"
 SUM_Neo_SDH.54.t:"北国使团"
 SUM_Neo_SDH.54.d:"北国来了使团，这伙人最是古怪。他们出手阔绰，金子银子流水似的往外撒，可你要问他们，这些钱要换什么，他们却顾左右而言他，半句也不肯说明白。今日请各部头人吃饭，明日给主母送礼，钱花得越多，那人反倒越藏，越发叫人摸不着底。有人私下猜，莫不是要买那盐路？又有人说，怕是冲着那遗迹去的，各说各话。问到使团嘴里，只赔笑说，交个朋友，何必问那么细。主母心里雪亮，知道这钱不是白花的，暗地里吩咐手下，盯紧这伙人，一步也不离。主母吩咐下去，凡使团所到之处，好吃好喝招待，只是那嘴里的话，一个字也别信。端的：钱来得蹊跷，话藏得深，天下没有白花的银子。"
 SUM_Neo_SDH.54.a:"备好兵与粮"
 SUM_Neo_SDH.54.b:"多派几趟使节"
 SUM_SDH_IND_Envoy_Rain:"雨林的门"
 SUM_SDH_IND_Envoy_Rain_desc:"对雨林，主母还留着一扇门，派去的人带着盐约，也带着账。来使进门时低头，出门时却把话捎回了雨林。门留着路便不断，端的这账一日不算清，这门便一日不关。"
 SUM_Neo_SDH.55.t:"雨林的门"
 SUM_Neo_SDH.55.d:"主母虽与雨林翻了脸，却也没把话说死。她对雨林，到底还留着一扇门。她派了人过去，那人身上的担子不轻：一边带着盐约，好做那谈买卖的由头；一边带着账，好算那旧年的债。主母吩咐得明白，能谈便谈，谈不成也别把门关死，好聚好散。原来她心里雪亮，雨林根基深厚，那教令院不是好惹的，万一撕破了脸，日后连个回旋的余地都没有。所以这扇门，既是给对方留的，也是给自己留的，进退全靠它。那使者去了又回，来回跑了三趟，把话带来带去，到底把那扇门撑住了一线。端的：留得一线，进退皆有余地。"
 SUM_Neo_SDH.55.a:"把旗立起来"
 SUM_Neo_SDH.55.b:"把旗先卷起来"
 SUM_SDH_IND_Buy_Iron:"购置军械"
 SUM_SDH_IND_Buy_Iron_desc:"向外邦买铁与火，价钱却不用钱付，拿沙地的盐与驼来抵。外邦人对着驼群直点头，交易便成了。盐与驼是沙地有的，端的拿自己有的换自己没有的，这买卖做得精。"
 SUM_Neo_SDH.56.t:"购置军械"
 SUM_Neo_SDH.56.d:"主母要强兵，先得有器械。沙漠里不产铁，那刀矛弓弩，都得向外邦去买，一针一线都要钱。买铁要钱，买那火药更要钱，主母手里现钱不多，便想出一个法子：拿沙地的盐与骆驼去抵。你想，盐是硬通货，骆驼又是沙漠里的脚力，外邦正用得着，巴不得来换。于是驼队驮着盐，赶着驼，浩浩荡荡出了地界，翻山越岭，换回一车车的铁与火药。那些铁，后来都打成了刀；那些火药，都填进了枪，端的派上了大用场。那些外邦人也精明，非要先看见盐，才肯交货，于是驼队来回跑了数趟，才把这买卖做成。端的：以我所有，换我所需，盐骆驼换刀与火，这算盘打得精。"
 SUM_Neo_SDH.56.a:"把盟约写进沙里的石板"
 SUM_Neo_SDH.56.b:"把盟约收进箱底"
 SUM_SDH_IND_Spy_Forest:"遣人间谍"
 SUM_SDH_IND_Spy_Forest_desc:"往雨林派了几个人，学的是一样东西：教令院在沙地还有多少只脚。派去的人回来，先画一张图，哪条街站着谁，都标在上头。脚藏在暗处，端的要一五一十数清楚。"
 SUM_Neo_SDH.57.t:"遣人间谍"
 SUM_Neo_SDH.57.d:"主母往雨林派了几个人，他们不为别的，专为学一样东西。那样东西便是：教令院在沙地，到底还埋着多少只脚。原来这些年，教令院表面退了，暗地里却在各部留了眼线，安了钉子，就仿佛那藏在沙里的脚，你不知道它伸向何处，也不知道哪天冒出来。主母要拔根，先得摸清这些脚。派去的人，有的扮作商贩，有的扮作香客，混进雨林，处心积虑地打听。哪一个部里还有教令院的人，哪一处的井被他们盯着，一笔一笔记将下来，带回来给主母。这几个人去了半年，回来时鞋底磨穿，带回的名单却记了满满一本，主母看了大喜。端的：知己知彼，先把那暗处的脚数清楚，才好下刀。"
 SUM_Neo_SDH.57.a:"召集部族共商"
 SUM_Neo_SDH.57.b:"等官署先松口"
 SUM_SDH_IND_Declaration:"哈德拉玛维特宣布独立"
 SUM_SDH_IND_Declaration_desc:"主母把敕令摊在火上，纸卷着烧，烧到底才断。各部代表围成一圈，看着那点火灭了，谁也没说一句话。城外雨林戍卒当夜便撤了两处，剩下的关上堡门，再不出来换水。"
 SUM_Neo_SDH.58.t:"哈德拉玛维特宣布独立"
 SUM_Neo_SDH.58.d:"那一日，主母把那敕令摊在火上。那纸遇了火，先卷成一筒，火苗顺着卷边往上爬，烧到根底，才啪地断了，落下一片黑灰。各部代表围成一圈，眼睁睁看着那点火渐渐灭掉，竟没一个人说话，连大气都不敢出，只听见那火苗滋滋地响。可你要以为这事便完了，却不知还有下文。原来那城外，雨林的戍卒本设着好几处堡子，专管那换水的事，向来不肯少。就在当夜，悄没声地撤了两处，连那水囊都没收拾；剩下的把堡门紧紧关上，再不出来与人换水，任你敲也不开。那两处撤走的堡子，第二日便空空荡荡，只剩几只野狗在里头转，寻那剩下的水囊。端的：一把火烧了纸，也烧断了水，那火看似灭了，余烬却烫手得很。"
 SUM_Neo_SDH.58.a:"备好兵与粮"
 SUM_Neo_SDH.58.b:"多派几趟使节"

 #### 甲线 · 花神圣战 ####
 SUM_SDH_RA_The_Floral_Crusade:"花神之旗"
 SUM_SDH_RA_The_Floral_Crusade_desc:"哈德拉玛维特的主母，世代自称花神的女儿，信众遍布各部。有人主张把这份信仰，从权柄里请出来，让它成为沙漠自己的一面旗。端的神归神，权归权，各归各处。"
 SUM_Neo_SDH.59.t:"花神之旗"
 SUM_Neo_SDH.59.d:"哈德拉玛维特的主母，世代都自称是花神的女儿。这份信仰，信众遍布各部，深入人心，端的牢不可破，连那三岁小孩都念叨。如今有人主张，把这份信仰，从主母的权柄里请出来，让它不再是一家一姓的私物，而成为整个沙漠自己的旗帜。这话说出来，众人议论纷纷，有的赞成，有的摇头。主母思量再三，竟也依了。于是那花神的旗，便挂上了城楼，迎风招展。你说奇也不奇，那日并无风，旗子却自己哗啦啦响，仿佛花神在里头应声。众人仰头看着，心里都道，这旗挂得对。从此那旗便日日挂在城楼，花神的花纹被日头晒得褪了色，众人却越发敬它。端的：信仰本属众人，旗一挂出，没风也响。"
 SUM_Neo_SDH.59.a:"让商路连通四方"
 SUM_Neo_SDH.59.b:"把商路关起来自守"
 SUM_SDH_RA_Grand_Fete:"大诞祭"
 SUM_SDH_RA_Grand_Fete_desc:"花神诞祭办遍各城，香火缭绕，歌乐连着七夜。众人围着账本看，谁也没挑出半处错。办祭的钱由各家凑齐，账目当众公开，端的钱来去明白，办得热闹也办得干净。"
 SUM_Neo_SDH.60.t:"大诞祭"
 SUM_Neo_SDH.60.d:"花神诞祭到了。这一回的祭，办遍了哈德拉玛维特的各城，一处也不落。那香火，昼夜不熄；那歌乐，一连响了七夜，城里城外，处处欢腾，连那沙漠里都飘着香气。办祭的钱，却不是哪一家出的，乃是各家各户凑起来的，你一钱我一钱。凑了钱，还要把账目公开，一笔一笔，写得清清楚楚，贴在祭坛旁边，谁都可以去看，谁都可以来查。这一来，众人办得尽心，也办得放心。那七日里，焚香的焚香，唱歌的唱歌，孩子们围着祭坛追逐，老人则捻着念珠念叨。那七日里，城门洞开，远来的客商也驻足看热闹，有几位竟跟着唱了起来。端的：钱是大家的，账是明白的，祭便办得热闹。"
 SUM_Neo_SDH.60.a:"以契约立信"
 SUM_Neo_SDH.60.b:"以枪杆立威"
 SUM_SDH_RA_Shrine_All:"遍立神龛"
 SUM_SDH_RA_Shrine_All_desc:"在每座城的入口，立一处花神的龛。那照看的人也不催，由人自便，倒显得体面。龛前不设官，只留一个照看的人，添油扫地。端的神龛虽小，进城的人人都要望它一眼。"
 SUM_Neo_SDH.61.t:"遍立神龛"
 SUM_Neo_SDH.61.d:"主母下令，在每座城的入口，都立一处花神的神龛。那龛不大，用沙石砌成，龛里供着花神像，龛前摆着香炉。可怪的是，这龛前头，却不设什么官，既不派差役，也不收香火钱，只设一个照看的人。那人多是城里的老者，每日里添添油，扫扫地，把龛前收拾得干干净净，风雨无阻。过往的行人，若愿意，便上炷香，不愿也罢了，没人勉强，更没人来劝。原来主母要的，是让这信仰自在生长，沾了官气，反倒不美，失了本心。那照看龛的老者，往往一守就是十几年，龛前的地砖被他扫得发亮，端的尽心。端的：神龛立在城门，官却不进，自在方见真心。"
 SUM_Neo_SDH.61.a:"把利润分给城邦"
 SUM_Neo_SDH.61.b:"把利润收归官库"
 SUM_SDH_RA_Pilgrim_Guild:"香客行会"
 SUM_SDH_RA_Pilgrim_Guild_desc:"香客自组行会，管起路上的食宿与安全。路上遇见风沙，行会的人便举火把在头里引路。这行会不收香火钱，只按人头摊些饭钱，端的把事办得妥帖，香客走得更安心。"
 SUM_Neo_SDH.62.t:"香客行会"
 SUM_Neo_SDH.62.d:"那四方来的香客，自己组起了行会。这行会专管一件事情：管路上的食宿与安全。原来进沙漠朝圣，路途遥远，风沙又大，一个人走，端的危险，说不定便喂了狼。于是香客们凑在一处，结伴而行，推举出领头的，定下规矩：哪里歇脚，哪里打水，如何轮班守夜，都有安排，违者要罚。这行会办得极好，可有一桩奇处：它不收香火钱。一切开销，大家平摊，多退少补，账目公开，分文不取。原来他们觉得，朝圣是心意，若拿了香火钱，便失了本意。行会里也立了规矩，谁若贪了公家的钱，便逐出行会，从此不许与人结伴上路。端的：路是大家走的，钱是大家摊的，行会只办事，不图利。"
 SUM_Neo_SDH.62.a:"借水草养人"
 SUM_Neo_SDH.62.b:"借商队养兵"
 SUM_SDH_RA_Floral_Choir:"花神合唱"
 SUM_SDH_RA_Floral_Choir_desc:"各村各城都有合唱的班，唱的是花神的旧诗。有一回两班人合唱，唱到末了，竟都红了眼眶。唱的人不分部族，沙漠的雨林的坐在一处，端的歌声一起，便不分彼此了。"
 SUM_Neo_SDH.63.t:"花神合唱"
 SUM_Neo_SDH.63.d:"各村各城，都有那么一个合唱的班。这班子里的人，到了祭日便聚在一处，唱的是花神的旧诗。那诗代代相传，词儿都拗口，可众人唱将起来，竟是整齐划一，气势壮观，连那沙丘都似在应和。最难得的是，这唱的人，不分部族。你属哪一族，我属哪一族，站到这班里，便都一样了，只管张口唱，谁也不多问。有那平日里有什么过节的，唱起诗来，也把那过节唱没了，反倒亲热起来。主母听了，很是欢喜，说这歌声，比什么盟约都管用。那班子里还有些老歌手，能一口气唱上几十段，唱到动情处，连那沙都似静了。端的：诗歌不分彼此，一开口，便是一家人。"
 SUM_Neo_SDH.63.a:"让商路连通四方"
 SUM_Neo_SDH.63.b:"把商路关起来自守"
 SUM_SDH_RA_Priest_Common:"公推祭司"
 SUM_SDH_RA_Priest_Common_desc:"祭司由信众公推，不由主母指派。公推那日，众人各投一票，当众唱名，谁也做不得手脚。这一条一下，便抽掉了主母的一半根基，端的神的事，从此不归主母一个人说了算。"
 SUM_Neo_SDH.64.t:"公推祭司"
 SUM_Neo_SDH.64.d:"主母又让了一步，这一让，端的让到了根上。往后那祭司，不再由主母指派，改由信众公推。哪一处的神龛，由谁来主持祭礼，让信众们自己商量着定，主母一概不干预，连那名单也不看。这一条出来，明面上是尊重信众，可主母心里雪亮，这一下，便抽掉了自己一半的根基。原来从前祭司是她的人，信众听祭司的，便是听她的；如今祭司是大家推的，她的话，便没那么灵了，唤不动人了。可她还是签了，按了手印。那些新推出来的祭司，果然不负众望，把祭礼办得比往日更加隆重，主母看了，也只能点头。端的：权柄这东西，让出去一半，才换得众人真心，主母端的舍得。"
 SUM_Neo_SDH.64.a:"以契约立信"
 SUM_Neo_SDH.64.b:"以枪杆立威"
 SUM_SDH_RA_Temple_Land:"神庙的田"
 SUM_SDH_RA_Temple_Land_desc:"拨给神庙一份田地，收成供祭礼，也拿来济贫。荒年开仓，先紧着没地的人家，一斗粮也不短少。这田是公的，谁也不能卖，端的田在庙里，穷人的饭碗便也在庙里。"
 SUM_Neo_SDH.65.t:"神庙的田"
 SUM_Neo_SDH.65.d:"主母拨给神庙一份田地。这份田，不归哪个人，也不归主母自己，乃是公田。那田里收成的粮食，一半供那祭祀之用，买香买烛，办那祭品；一半却拿去济贫，救济那些走投无路的穷人。主母还立下规矩：这田是公的，谁也不能卖，不论是谁，哪怕是她的亲信，敢打这田的主意，便以族法处置，绝不轻饶。原来她怕的是，日子久了，有人把这公田蚕食了去，逐年侵吞。于是把话说死，刻在石碑上，立在田边，叫人人看见。那石碑立在田头，风雨剥蚀，字竟越发清楚，过路的人都要停下来看一眼。端的：田是公田，收成两用，一敬神，一济人，谁也休想私吞。"
 SUM_Neo_SDH.65.a:"把利润分给城邦"
 SUM_Neo_SDH.65.b:"把利润收归官库"
 SUM_SDH_RA_Alms_House:"济贫所"
 SUM_SDH_RA_Alms_House_desc:"神庙办济贫所，专收走投无路的人。每日两顿热粥，病了有人照看，外头风沙又大，谁舍得走。收进来的多，走出去的少，端的这地方养人，也留人，叫人心甘情愿待着。"
 SUM_Neo_SDH.66.t:"济贫所"
 SUM_Neo_SDH.66.d:"神庙里，还办起了一处济贫所。这济贫所收的，都是那走投无路之人：有没了骆驼的商，有被赶出部的穷汉，有父母双亡的孤儿。进了这所，便有饭吃，有铺盖睡，严寒酷暑，也有个安身之处，端的是好去处。主母本以为，等那风头过了，或是日子好转，这些人便会离去，各回各家。可奇了，收进来的人越来越多，走的人却少得可怜，十个里头也走不了一个。原来外头的日子太难，这济贫所反倒成了安稳窝。所里的人，每日里有活干，有人说话，渐渐也不想走了。那济贫所后来竟成了各部都离不开的地方，连那主母也时常亲自去看，施几碗粥。端的：收的是穷苦，留的是人心，这济贫所，端的办到了好处。"
 SUM_Neo_SDH.66.a:"借水草养人"
 SUM_Neo_SDH.66.b:"借商队养兵"
 SUM_SDH_RA_Craft_Holy:"神工坊"
 SUM_SDH_RA_Craft_Holy_desc:"神庙的工坊，既做器物，也做兵器。匠人打一件香炉，顺手又打一把刀。做出来的东西，一半供祭礼，一半给护法队，端的拜神的家伙和打仗的家伙，竟出自同一炉火。"
 SUM_Neo_SDH.67.t:"神工坊"
 SUM_Neo_SDH.67.d:"哈德拉玛维特的神庙后院，有一座工坊终日炉火不熄。匠人们赤着膀子，抡锤的抡锤，拉风箱的拉风箱，汗珠落在沙地上，滋滋地就没了。炉边堆着半人高的废铁，都是打坏了回炉的。原来一件器物出来，一半送去做祭礼，一半交给护法队。祭礼用的，是花神的香炉与灯盏，铸得薄，纹路细，专人捧着供在龛前；护法队用的，是刀矛与护心镜，锻得厚，淬得硬，一经出手便见血。有那不懂的匠人问：同为炉里出来的铁，怎的分这般两样？老匠人把锤子往地上一顿，说道：供神的要好看，杀人的要耐使，各秉其性，怎可一般看待？众人听了，方才明白。老匠人说罢，又低头抡锤，叮当之声不绝于耳。"
 SUM_Neo_SDH.67.a:"让商路连通四方"
 SUM_Neo_SDH.67.b:"把商路关起来自守"
 SUM_SDH_RA_Fair_Sacred:"圣市"
 SUM_SDH_RA_Fair_Sacred_desc:"祭期开圣市，三日之内不抽税。叫卖声连成一片，摊子从城门一直排到神龛跟前，热闹得脚都插不进去。市一开四方的人都赶来，端的这三天不收钱，图的是人气聚拢。"
 SUM_Neo_SDH.68.t:"圣市"
 SUM_Neo_SDH.68.d:"祭期一到，哈德拉玛维特便开圣市。神庙门前立起木牌，上头写得明白：三日之内，不抽一厘税钱。这一纸告示贴出，四方的人便像潮水般涌来。南边牧人赶着羊，北边商队驮着盐，雨林那边也有胆大的，混在人群里看热闹。摆摊的沿着街铺开，卖水的挑着担子沿街吆喝，卖馕的、卖花神像的挨挨挤挤，把条街塞得满满当当。三日里头，没有一个人来收钱，也没有一个差役来轰人。市面热闹自不必说，连平日里冷清的角落，这回也挤满了人。有那好事的老汉捋着胡子道：不抽税，图的不是钱，图的是人心。众人听了，都点头称是。有那从远处赶来的，没赶上头一日，急得直跺脚，连问几时再开这样的市；摊主们也乐得连做三日买卖，个个笑逐颜开。"
 SUM_Neo_SDH.68.a:"以契约立信"
 SUM_Neo_SDH.68.b:"以枪杆立威"
 SUM_SDH_RA_Granary_God:"神仓"
 SUM_SDH_RA_Granary_God_desc:"神庙设一座粮仓，丰年收粮，荒年放粮。仓门锁着两把，钥匙分给两个人，谁也别想独吞。放粮的规矩，明明白白写在仓门上，端的谁来领照章便是，谁也不能徇私。"
 SUM_Neo_SDH.69.t:"神仓"
 SUM_Neo_SDH.69.d:"神庙里设着一座大粮仓，高墙厚门，专人看守。这仓有个规矩：丰年收，荒年放。丰年里谷子堆得冒尖，管仓的便一袋一袋收将进来，登记在册；到了荒年，沙地颗粒无收，便开仓放粮，一口人分一份。原来它并不藏在谁肚里，而是白纸黑字写在仓门上头，谁都看得见，谁都念得出。有那不懂事的想多拿一袋，管仓的便指着门上的字道：你自看看，上头可是写了多拿的？那人羞答答退了回去。仓门上的字风吹日晒，颜色淡了，便有人重新描过，描得一笔一画，端端正正。逢到大荒年，开仓那日，门外排起长队，男女老少拎着口袋，静静等候，没有一个人喧哗争抢，秩序倒比平日还整齐。"
 SUM_Neo_SDH.69.a:"把利润分给城邦"
 SUM_Neo_SDH.69.b:"把利润收归官库"
 SUM_SDH_RA_Tribe_Welcome:"纳新部"
 SUM_SDH_RA_Tribe_Welcome_desc:"凡愿归附的部族，不问旧事，只问一句：肯不肯守共同的规矩。来归的人踏上沙地，先递上投名状，再饮一碗血酒。肯的点头便是一家人，端的过往恩怨，一笔勾销。"
 SUM_Neo_SDH.70.t:"纳新部"
 SUM_Neo_SDH.70.d:"便是有那远处部族，愿来归附哈德拉玛维特。领头的人带着礼物，到神庙前说明来意。不问你从前做过什么，不问你与谁结过仇，也不问你是哪一支的血脉，只问一句：你肯不肯守咱们共同的规矩？那部族首领愣了一愣，答道：肯。神庙的人便道：既肯，旧事一概不究，从今日起，你我便是一家。当下杀羊设酒，饮了同盟的酒，便算入了伙。有那犯了旧案的，也因这一问，从此翻篇，无人再提。那首领饮罢，感慨道：往后有了规矩，心里反倒踏实。这样归附过来的部族，前后共有好几支，神庙都一一记下名字，刻在石碑上。后来有人问起那首领，为何当初不讨价还价，他道：规矩在前，我心里先服了，还谈什么条件。"
 SUM_Neo_SDH.70.a:"借水草养人"
 SUM_Neo_SDH.70.b:"借商队养兵"
 SUM_SDH_RA_Elder_Vote:"长老公议"
 SUM_SDH_RA_Elder_Vote_desc:"各部长老定期公议，议的是水源与牧道。议事那日，长老们围坐一圈，为一条牧道争到日头偏西。议定了便共同担保，端的这水与路，不是谁一人的，是大家按了手印的。"
 SUM_Neo_SDH.71.t:"长老公议"
 SUM_Neo_SDH.71.d:"各部的长老，每隔一段时日便聚在一处公议。议的都是些实在事：这一季的水从哪条渠引，那一片牧道归哪一家放。这公议可不是走过场。长老们围着一圈坐下，你一言我一语，争得面红耳赤也是常有的。水少的时候，谁都想多分一点，吵到后来，嗓子都哑了。可一旦议定了，便没有一个反悔的。众人当面立约：这水这路，大伙儿一同担保，谁要是私自破坏，便是与众人作对。有那想耍滑的，见众人担保得认真，也只得缩了手。议罢，众人一同饮茶，方才的火气也消了。其后每逢议事，众人记起当日之约，都格外郑重。水渠修到哪一段，牧道让到哪一块，都有人盯着，唯恐坏了共同担保的名声。日子久了，各部竟真如一家。"
 SUM_Neo_SDH.71.a:"让商路连通四方"
 SUM_Neo_SDH.71.b:"把商路关起来自守"
 SUM_SDH_RA_Bride_Alliance:"联姻结盟"
 SUM_SDH_RA_Bride_Alliance_desc:"族与族之间，以联姻加固盟约，聘礼的账，由神庙记下。送亲那日，驼队排得老长，两族的人一路唱着歌。这账记得细，端的嫁过去的女儿，便是两族之间活生生的约。"
 SUM_Neo_SDH.72.t:"联姻结盟"
 SUM_Neo_SDH.72.d:"族与族之间，要固住盟约，最稳妥的法子莫过联姻。这一家的女儿嫁过去，那家的儿子娶过来，两下里成了亲眷，情分便比寻常深厚。这联姻可不是嘴里说说，聘礼是有账的。哪一家出了几峰骆驼，几匹好布，几袋盐，都一清二楚地记在神庙的账簿上。管账的祭司一笔一笔写明白，日后哪家要翻旧账，也翻不出花来。有那两家原本不和的，只因结了这门亲，从此你来我往，倒比谁都亲热。嫁女儿的那家，临行前反复叮嘱，女儿含泪拜别。神庙里那本聘礼账簿，越积越厚，摞起来有半人高。祭司说，这账不为算计谁，只为留个凭据，叫两族的子孙日后晓得，自家先人曾是结过亲的。逢年过节，两族还互相送礼，来往不断。"
 SUM_Neo_SDH.72.a:"以契约立信"
 SUM_Neo_SDH.72.b:"以枪杆立威"
 SUM_SDH_RA_Orphan_Care:"收养孤儿"
 SUM_SDH_RA_Orphan_Care_desc:"战乱留下的孤儿，由神庙与各部一同养大。有的孩子记不得爹娘，只认得神庙那口锅。长大之后，愿意从军的便从军，端的这些孩子，吃的是众人的饭，还的是众人的情。"
 SUM_Neo_SDH.73.t:"收养孤儿"
 SUM_Neo_SDH.73.d:"战乱年间，留下不少孤儿。爹娘死在刀兵之下，无人照看，流落在沙地里，饥一顿饱一顿。神庙见了，不忍心，便与各部商议：这些孩子，大家一同养。于是这家管饭，那家管衣，神庙里也拨出一份口粮。孩子们渐渐长大，到了年岁，便由他们自己挑：愿意从军的，编进队伍；愿意放羊种地的，也随其便。这些吃百家饭长大的孩子，最知感恩，上了战场个个奋勇。有那后来做了头领的，也不忘当初那一口饭，常把孤儿叫到跟前，亲自劝勉。这些孤儿里，后来有个放了羊的，因识得草性，做了牧官；也有从军的，刀法极为勇猛。众人说，这都是当年那口百家饭养出来的福分。神庙见养成风气，便把这事定为常例，年年照办。"
 SUM_Neo_SDH.73.a:"把利润分给城邦"
 SUM_Neo_SDH.73.b:"把利润收归官库"
 SUM_SDH_RA_Blood_End:"止仇"
 SUM_SDH_RA_Blood_End_desc:"有仇的两族，在花神龛前和解，血债一笔勾销。两族的头人当众握住手，从前的事，从此谁也不再提。和解的场面办得热闹，酒肉摆了一地，端的冤家宜解不宜结，从此两家相安无事。"
 SUM_Neo_SDH.74.t:"止仇"
 SUM_Neo_SDH.74.d:"先前有仇的两族，结怨多年，动不动就拔刀相向。这一日，两族的人被请到花神龛前。祭司从中说合，劝道：血债一笔勾销，从此不许再提。起初都梗着脖子，谁也不看谁。祭司又把花神的名义抬出来，众人方才软了心肠。当下杀了羊，摆起酒席，两边就席上痛饮，竟比办喜事还热闹。有那年纪大的，握着对手的手，眼泪汪汪，从此真个和好。龛前香烟缭绕，众人笑作一团，前嫌尽释。两族和好之后，为了防止反悔，特地在龛前立了一块石碑，把和解的话刻在上头。祭司又命两家各出一人，日日来龛前添香。那两个昔日拔刀相向的仇人，如今并肩添香，倒成了莫逆之交，端的是不打不相识。"
 SUM_Neo_SDH.74.a:"借水草养人"
 SUM_Neo_SDH.74.b:"借商队养兵"
 SUM_SDH_RA_Storm_Banner:"沙暴旗下"
 SUM_SDH_RA_Storm_Banner_desc:"选一批专打风天的人，组成军团，旗是灰的，风里看不清。等人到了跟前，刀已架在脖子上，才惊觉是人不是沙。敌军望过去只当是沙丘在动，端的这旗隐匿得比没有还干净。"
 SUM_Neo_SDH.75.t:"沙暴旗下"
 SUM_Neo_SDH.75.d:"哈德拉玛维特要练一支专打风天的军团。选人的时候，专挑那些在风沙里长大的，眼睛眯得起沙也看得清，脚板磨得厚也走得稳。这军团还有一桩奇特处：旗是灰的。别的军旗红的红的，花的花的，偏偏这面灰扑扑，风一起，便与黄沙混作一处，远远望去，什么也看不见。原来这旗色正是为了藏兵。敌军在风里张望，只见黄沙滚滚，哪知道灰旗底下藏着一支人马？待到近前，方才发觉，已晚了。领军的说：这旗不图好看，只图活命。后来这灰旗军团出战，果然占尽便宜。敌军在风里左顾右盼，只见黄沙漫漫，以为无人，待到灰旗从沙中现出，已是人到跟前。连打几阵，无往不利。众人才服了选旗色的人，端的眼光独到。"
 SUM_Neo_SDH.75.a:"让商路连通四方"
 SUM_Neo_SDH.75.b:"把商路关起来自守"
 SUM_SDH_RA_Holy_Guard:"护法卫队"
 SUM_SDH_RA_Holy_Guard_desc:"护法卫队守神庙，也随军出征。护时寸步不离，攻时第一个往前冲，从不迟疑。他们打仗有两样做法：一是护，一是攻，端的是神前拿香炉，阵前拿刀，样样都来得。"
 SUM_Neo_SDH.76.t:"护法卫队"
 SUM_Neo_SDH.76.d:"护法卫队，是神庙的看家人。平日里守着神庙，香火、经卷、器物，件件经他们的手；一旦有事，也要随军出征。这卫队打仗有两样做法：一样是护，一样是攻。护的时候，盾牌挨着盾牌，排成一堵墙，把该护的人护在当中，箭矢射来也扎不进；攻的时候，长矛一摆，号令一出，便如猛虎扑羊，直冲对面阵脚。两样本领，都要练得烂熟。有那新来的，只学会了护，不会攻，老兵便笑道：你这般，只配替人挡箭。那新兵满面羞惭，从此日夜苦练。两样战法轮着使，护住了自己，又打垮了敌人，端的厉害。有一回护法卫队随军出征，先以盾墙顶住对面箭雨，待敌方箭尽，忽地变护为攻，长矛齐出，一击便溃。三军看了，无不喝彩。"
 SUM_Neo_SDH.76.a:"以契约立信"
 SUM_Neo_SDH.76.b:"以枪杆立威"
 SUM_SDH_RA_Camel_Holy:"圣驼骑"
 SUM_SDH_RA_Camel_Holy_desc:"圣驼骑的驼鞍上，绣着花神的纹样，骑手都是各部子弟。驼铃一响，各部的人便知道，是自家的子弟来了。这些人从小在驼背上长大，端的鞍子一花纹，人便成了神的兵。"
 SUM_Neo_SDH.77.t:"圣驼骑"
 SUM_Neo_SDH.77.d:"圣驼骑出征，最惹眼的是那驼鞍。鞍子上绣着花神的纹样，一针一线，颜色鲜明，远远便认得出是本教的兵。这些骑手可不是随便挑的，都是各部子弟。哪一家的年轻人，骑射过得去、胆子够大的，才被选进圣驼骑。他们从小在驼背上长大，驼一走，人便随，颠簸如履平地。铃声一响，驼队便没入沙海。有那爹娘送儿子来的，摸着鞍上的花纹道：这花神保佑，你且安心去。子弟们应一声，翻身上驼，绝尘而去，扬起一路黄沙。这一支圣驼骑，从此成了军中的眼珠。每逢探听消息、突袭敌营，都少不了他们。那些绣着花神纹样的驼鞍，在风沙里一闪，敌军便知是哈德拉玛维特的精锐到了，往往不战先怯。"
 SUM_Neo_SDH.77.a:"把利润分给城邦"
 SUM_Neo_SDH.77.b:"把利润收归官库"
 SUM_SDH_RA_Scout_Storm:"风眼侦骑"
 SUM_SDH_RA_Scout_Storm_desc:"侦骑专走风眼，风眼里头最静，能看清对面在做什么。有一回摸到敌军营后，把马料都数了一遍才回来。别人被沙迷了眼，他们却借着风隐蔽，端的看得清，也摸得近。"
 SUM_Neo_SDH.78.t:"风眼侦骑"
 SUM_Neo_SDH.78.d:"侦骑出行，专挑风眼走。原来大风起时，四下里飞沙走石，偏偏有一处最静，风绕着它转，那里头便能看清对面在做什么。侦骑识得这窍门，便钻进风眼，伏在那里，一动不动。对面的营盘人喊马嘶，如何埋锅，如何布哨，如何换班，都被他看在眼里，记在心中。等到夜里，再悄悄潜回，把话报与中军。有那鲁莽的，不识风眼，一头撞进风里，被沙打得睁不开眼，什么也没看着，回来还挨了一顿训。有一回，侦骑在风眼里伏了一整日，把对面换防的时辰记得清清楚楚。当夜回报，中军据此定计，果然一举得手。这风眼之利，别人看不出，独风哨能识，端的是一门绝学，千金难换。"
 SUM_Neo_SDH.78.a:"借水草养人"
 SUM_Neo_SDH.78.b:"借商队养兵"
 SUM_SDH_RA_Field_Shrine:"随军神龛"
 SUM_SDH_RA_Field_Shrine_desc:"军中带着一座能拆装的神龛，扎营便立起来。拆的时候，匠人把每块木板都编上号，再立时一根不差。龛一立人心便定，端的打个胜仗，也要先拜一拜，才敢睡去，人心一安，觉也睡得香。"
 SUM_Neo_SDH.79.t:"随军神龛"
 SUM_Neo_SDH.79.d:"大军开拔，军中还带着一座神龛。这龛是拆装式的，行军时拆开，装在驼背上；扎下营来，又就地立起。这龛立起来，可不单是为拜神。兵士们远远征战，心里发虚，一见那龛立稳了，便像见了主心骨，人心登时就定下来。祭司在龛前点起香，众人依次上前，默默礼拜。有那新兵头一回上阵，怕得手抖，拜过之后，胆气竟壮了几分。老兵说道：龛在，神在，咱们的心便在。众人听了，俱各安然。那神龛拆装也有讲究。拆时先取顶，再卸柱，件件编号，一丝不乱；立时先立柱，再覆顶，片刻便成。几名手快的兵士合力，转眼便把一座龛立得端端正正，分毫不差。祭司看罢，连连点头，说这班人办事牢靠。"
 SUM_Neo_SDH.79.a:"让商路连通四方"
 SUM_Neo_SDH.79.b:"把商路关起来自守"
 SUM_SDH_RA_Sacred_Oasis:"圣所绿洲"
 SUM_SDH_RA_Sacred_Oasis_desc:"把几处绿洲立为圣所，许进不许占。进圣所的人，先把刀卸在门外，才准走近水边。谁要是占了圣所，便人人得而讨之，端的这几口水，不属于哪一族，属于花神，这规矩无人敢犯。"
 SUM_Neo_SDH.80.t:"圣所绿洲"
 SUM_Neo_SDH.80.d:"哈德拉玛维特有几处绿洲，被立为圣所。圣所的规矩只有八个字：许进不许占。这是什么意思？原来无论哪一部的人，路过圣所，都可以进来喝水歇脚，可谁也不许把圣所据为己有，圈起来当自家的。有那贪心的部族，仗着人多，强占了一处圣所，赶走旁人。这下可捅了马蜂窝，各部首领一声令下，人人得而讨之，四面八方的人一齐涌来，把那部族赶了个灰溜溜，抱头鼠窜。从此再没人敢起这念头，圣所也就永远向众人开着。圣所的门，也从不上锁。夜里有人来避风，自己推门进去，寻个角落歇下，天明再走。管事的从不盘问，只留一壶水在门边。这份信任，比那高墙铁锁还牢，谁也不忍心坏了规矩。"
 SUM_Neo_SDH.80.a:"以契约立信"
 SUM_Neo_SDH.80.b:"以枪杆立威"
 SUM_SDH_RA_Water_Gift:"分水之礼"
 SUM_SDH_RA_Water_Gift_desc:"圣所绿洲的水，按人口分给周围的村与牧户，不分部族。分水那日，各村排队领牌，孩子捧着水罐跟在后头。村有村的分，户有户的分，端的这水认人不认族，童叟无欺。"
 SUM_Neo_SDH.81.t:"分水之礼"
 SUM_Neo_SDH.81.d:"圣所里的绿洲，水是按口分的。这分水有个讲究：只按人头算，不管你是哪一族、哪一部。周围的村子与牧户，一家有几口人，便分几份水，多一口不多，少一口不少。管水的差役拎着木桶，挨家挨户量过去，谁也不许多占一寸。有那部族想凭势力多要的，差役便指着规矩道：这里不分部族，只分人口。那人讨个没趣，只得退下。村里人见了，都说这法子公道，从此再不为争水红脸。分水那日，管水的差役还带着一把木尺，量那水渠的宽窄，务求均匀。有那妇人不识字，差役便把规矩念给她听，一遍不懂，再念一遍。村里人都说，这分法不欺生、不怕硬，端的公道。从此周围各村相处和睦，再不为水伤和气。"
 SUM_Neo_SDH.81.a:"把利润分给城邦"
 SUM_Neo_SDH.81.b:"把利润收归官库"
 SUM_SDH_RA_Garden_Holy:"圣园"
 SUM_SDH_RA_Garden_Holy_desc:"在绿洲边开一座园子，种花，也种粮。花开时摘几朵供在龛前，粮熟了先送济贫所，剩下才自家留。管园的人由信众轮值，一茬换一茬，端的这园子是众人轮着伺候出来的。"
 SUM_Neo_SDH.82.t:"圣园"
 SUM_Neo_SDH.82.d:"在一处绿洲边上，众人开了一座园子。园子里种花，也种粮。这园子有旁的讲究：管园的人，是由信众轮值。今日轮到这一家，便由这一家来看园浇水，明日又换一家。信众们都把这当成积功德的事，轮到自个儿，早早便来，把花畦侍弄得齐齐整整，把禾苗浇得绿油油。那花开得盛，引得蜂蝶乱飞；那粮长得壮，秋后收成喜人。有那偷懒不到的小子，众人便笑话他没福气，那小子下次便不敢再懒。到了花开的时节，园子里红一片、白一片，香气飘出好几里。路过的人都要停下来看两眼，孩子们更是钻进花丛里追逐嬉戏。看管园子的信众也不恼，只叮嘱莫踩坏禾苗。这一座园子，竟成了绿洲边上一处胜景。"
 SUM_Neo_SDH.82.a:"借水草养人"
 SUM_Neo_SDH.82.b:"借商队养兵"
 SUM_SDH_RA_Refuge_Sand:"沙中避难所"
 SUM_SDH_RA_Refuge_Sand_desc:"圣所兼作避难所，风灾战乱时便开门收人。老人孩子先安置，青壮便帮着挑水和泥，一院子人竟也安顿得下。收多少人便管多少饭，端的门一开，跑进来的人挤满了院子。"
 SUM_Neo_SDH.83.t:"沙中避难所"
 SUM_Neo_SDH.83.d:"圣所还兼着一处用处，便是避难。逢上风灾战乱，圣所便大开门户，把逃难的人收进来。这收人也有规矩：收多少人，便管多少饭。管事的先把人命报上，再按人数下锅，一碗稀粥，一块馕饼，虽不丰盛，却也能活命。有那逃到圣所的，进了门，腿一软就跪在地上，端起碗来，手还在抖。管事的安慰道：且安心住着，风过了再走。众人挤在一处，患难相助，倒也挨过了难关，待风停时，一个个都挺直了腰。圣所里还备着些草药，遇上受了伤的，管事的便敷上一些。有那病倒的，也腾出一处干燥的角落让其歇息。这避难之所，救的不仅是命，更安了众人的心。风灾过后，那些被救的人，多半留下来帮着修墙补屋，以报恩情。"
 SUM_Neo_SDH.83.a:"让商路连通四方"
 SUM_Neo_SDH.83.b:"把商路关起来自守"
 SUM_SDH_RA_Oasis_Guard:"守所人"
 SUM_SDH_RA_Oasis_Guard_desc:"守圣所的人，不穿军装，可手里有刀。有一伙人不知死活，夜里来偷水，天亮时全被捆在龛前。抢圣所的从来没有好下场，端的这刀不出鞘便罢，一出鞘就要见血，好不慑人。"
 SUM_Neo_SDH.84.t:"守所人"
 SUM_Neo_SDH.84.d:"守圣所的人，看着与寻常百姓无二。他们不穿军装，身上是一色的布衣，可哪里空着，个个袖里藏着刀。原来这刀是为对付那些来抢圣所的强人。曾有那伙贼寇，夜间摸到圣所，只想把水井占了。守圣所的人一声呼哨，布衣一撩，明晃晃的刀就亮了出来。那伙贼寇哪里抵挡得住，被赶得抱头鼠窜，连滚带爬地逃了。从此以后，再没人敢来打圣所的主意，都知道这布衣之下不好惹。守圣所的人，平日里也练刀。每日天刚蒙蒙亮，便在沙地上比划，一刀一刀，练得出神入化。有那路过的商队，见他们布衣芒鞋，以为寻常，哪知个个都是好手。这叫真人不露相，刀藏袖中，不轻易示人罢了。"
 SUM_Neo_SDH.84.a:"以契约立信"
 SUM_Neo_SDH.84.b:"以枪杆立威"
 SUM_SDH_RA_Crusade_Word:"宣言之辞"
 SUM_SDH_RA_Crusade_Word_desc:"对雨林的檄文，用花神的名义写，说的却是赋税与水源的账。檄文一贴出来，各部的青壮便摩拳擦掌，只等一声令下。神的名字在前，账在后，端的这叫师出有名，名正言顺。"
 SUM_Neo_SDH.85.t:"宣言之辞"
 SUM_Neo_SDH.85.d:"哈德拉玛维特要向雨林下一道檄文。这檄文写得蹊跷：抬头的名号，用的是花神，满满纸都是神圣辞令；可说的却尽是些俗务账目，赋税怎么多收了，水源怎么被截了，一笔一笔，算得清楚明白。原来他们是借着花神的名头，来讲这现实的委屈。祭司念檄文时，众人听着前半段还肃穆，听到后半段，都点了头，觉得句句说到心坎里。有那明白人笑道：神归神，账归账，这叫两不耽误。众人听了，都佩服这文章的手段。这道檄文传开之后，雨林那边果然慌了神。他们原以为沙漠之人只会游牧劫掠，没想到竟把赋税水源一笔笔算得这般清楚。有那谋士看了檄文，连说不可小觑。文章也算一件兵器，这借神说账的手段，端的利害。"
 SUM_Neo_SDH.85.a:"把利润分给城邦"
 SUM_Neo_SDH.85.b:"把利润收归官库"
 SUM_SDH_RA_March_Storm:"借风东进"
 SUM_SDH_RA_March_Storm_desc:"大军候着换季的风东进，风把足迹吹平，也把守军遮住。人马借着风掩，一直摸到关下，守卒才惊觉不对。雨林的斥候什么也看不清，端的这风，替大军打了头阵，神不知鬼不觉。"
 SUM_Neo_SDH.86.t:"借风东进"
 SUM_Neo_SDH.86.d:"大军按兵不动，专候着换季的风。这风一起，便往东去，正好顺着进兵的路。待到风起，大军便借风东进。那风卷起黄沙，把人马走过的足迹吹得平平整整，对面探子来瞧，只见一片茫茫白沙，半点痕迹也寻不着。更妙的是，风沙遮天蔽日，对面的守军也被这风沙迷了眼，看不清远处来了多少人马。大军就在这风幕底下，悄悄逼近了关隘。等守军回过神来，刀已经架到了脖子上，悔之晚矣。风也帮了忙。大军借着风声掩护，马蹄裹布，人衔枚，连马嘶声都被风吞了。守军只当是寻常风沙，依旧巡逻懈怠。待到发现沙中隐有人影，已是措手不及。这一仗赢得巧妙，全在会用这天时。"
 SUM_Neo_SDH.86.a:"借水草养人"
 SUM_Neo_SDH.86.b:"借商队养兵"
 SUM_SDH_RA_Holy_Volunteer:"信众从军"
 SUM_SDH_RA_Holy_Volunteer_desc:"檄文一传，各部的青壮自带口粮来投。营门一早便挤满了人，来晚的只能排在沙丘上等。来的人数比主母估的多了整整一倍，端的这花神的名义，比银子还灵，人心齐，泰山移。"
 SUM_Neo_SDH.87.t:"信众从军"
 SUM_Neo_SDH.87.d:"檄文一传出去，各部的青壮便动了心。这些年轻人不用官府催，也不用谁劝，自个儿背上干粮，扛着家伙，就来投军。有的一家来了兄弟两三个，有的一村呼啦啦来了一大片。管事的登记造册，忙得手忙脚乱。原先估摸着能来多少人，哪知道实际来的，比估的多了一倍不止。粮食不够吃，众人便说：自带口粮，不劳军中费心。营盘一时塞得满满当当，人人摩拳擦掌，只等一声令下。管事的笑得合不拢嘴。营盘里一时住不下，众人便自己搭起帐幕，就地埋锅造饭。有那带家属来的，也在营边寻处安顿。短短几日，一座营盘竟扩成了一片村镇模样。管事的看得咋舌，忙向主母报告，说人心思变，端的挡不住。"
 SUM_Neo_SDH.87.a:"让商路连通四方"
 SUM_Neo_SDH.87.b:"把商路关起来自守"
 SUM_SDH_RA_Shrine_Front:"军前立龛"
 SUM_SDH_RA_Shrine_Front_desc:"在雨林边上，立起一道军前的神龛。有雨林的兵隔河望见那龛，竟犹豫起来，不知该不该放箭。敌军看了心乱，自己看了心定，端的同一尊神，叫两边各有各的想头。"
 SUM_Neo_SDH.88.t:"军前立龛"
 SUM_Neo_SDH.88.d:"在雨林边上，众人立起了一座军前的龛。这龛立得大有讲究。敌军远远望见这龛，心里先就乱了：这是要拼死一战的架势呀，于是军心浮动，人人惴惴。自家人见了这龛，却恰恰相反，心里反倒安定了：神龛都在阵前了，这场仗，是必胜的。一龛立在那里，两边人心，一乱一定，高下立判。祭司在龛前焚香祷告，香烟直冲云霄，兵士们望见了，齐声呐喊，声震林野，把那敌军吓得倒退。那龛前还立了一根旗杆，旗上绣着花神的字样，风一吹猎猎作响。敌军望见这旗，更是心惊，以为对面有神明相助。自家兵士却越看越有劲，个个挺直腰杆。两军对垒，先争的还是一口气，这龛立得正是时候。"
 SUM_Neo_SDH.88.a:"以契约立信"
 SUM_Neo_SDH.88.b:"以枪杆立威"
 SUM_SDH_RA_Terms_Holy:"最后的条件"
 SUM_SDH_RA_Terms_Holy_desc:"兵临关隘，方才提出条件：撤戍、减贡、还水、认独立。关里的守将看完条件，脸都白了，连忙修书回城请示。四条缺一不可，端的到了这一步，刀把子说话，轮不到别人还价。"
 SUM_Neo_SDH.89.t:"最后的条件"
 SUM_Neo_SDH.89.d:"大军兵临关隘，这才不紧不慢地抛出条件。这条件共有四条：头一条，撤走戍兵；第二条，减轻贡赋；第三条，归还水源；第四条，承认独立。四条摆出来，一条也不能少，缺一条，这仗就照打不误。守关的人看了，脸都白了，忙不迭地派人回报。有那谋士劝道：何不先答应两条，敷衍过去？领兵的摇头道：不成，四条缺一不可，少一条都是后患。于是按兵围关，专等对方回话，箭上弦，刀出鞘，只待号令。守关的将官无奈，只得把四条条件飞报主上。那边回话还未到，关下的大军已经把壕沟填平，把云梯靠墙。守军日日提心吊胆，夜里不敢合眼。这叫先礼后兵，条件开得明白，兵也摆得明白，由不得你不答应。"
 SUM_Neo_SDH.89.a:"把利润分给城邦"
 SUM_Neo_SDH.89.b:"把利润收归官库"
 SUM_SDH_RA_Floral_Kingdom:"花神之国"
 SUM_SDH_RA_Floral_Kingdom_desc:"花神的龛立遍哈德拉玛维特，祭司由信众公推，绿洲的水按口分。主母的旧座还摆在厅里，只是那座上的权威，如今挪到了每一处龛前。端的是座还是那座，权已不是那权。"
 SUM_Neo_SDH.90.t:"花神之国"
 SUM_Neo_SDH.90.d:"花神的龛，如今立遍了哈德拉玛维特。每一处龛前的祭司，都不是谁指派，而是由信众公推出来的。大家觉得谁诚心，谁办事公道，便推谁。绿洲的水，也一律按口分，与那圣所的规矩一般无二。这般一来，事事都隔着龛来办，倒也公允。只是那主母的旧座，还端端正正摆在厅里，没人去动它。原来座还在，那座上的权威，却早挪到了每一处龛前。众人心里明白，却谁也不说破，只当那把椅子是个摆设。如今在哈德拉玛维特走动，无论走到哪处绿洲，都能看见花神的龛。龛前有人添香，有人分水，人人有话说。那主母的旧座虽还在，却再没人去坐，也没人拿它作数。权柄不在椅子上，在人心上。"
 SUM_Neo_SDH.90.a:"借水草养人"
 SUM_Neo_SDH.90.b:"借商队养兵"

 #### 乙线 · 沙暴军国 ####
 SUM_SDH_RB_The_Storm_Regiment:"沙暴军团"
 SUM_SDH_RB_The_Storm_Regiment_desc:"另有一条路，认定沙漠吃的亏，全在一个散字：部落散，水源散，兵也散。要不再吃亏，就得把哈德拉玛维特，拧成一支风里也不散的军。端的是散沙难握，抱成团才有力量。"
 SUM_Neo_SDH.91.t:"沙暴军团"
 SUM_Neo_SDH.91.d:"还有另一条路，认定沙漠吃的亏，全在一个散字。这散有三般：部落是散的，各管各；水源是散的，各占各；兵马也是散的，临时凑。如此散下去，难免一而再、再而三地吃亏。要不再受人欺，就得痛下决心，把整个哈德拉玛维特，拧成一支军。这支军要能在风里不散，任凭风沙如何吹打，也稳稳站住，如同一块整铁。主张此论的人在会上把拳头攥得紧紧的，众首领听了，也纷纷点头，觉得这话说到根子上。主张此论的人，又把话说得透彻：一支军，不光要能打，还要能聚。风沙再大，队形不乱；人马再疲，号令不违。如此方能不再受那份散漫的苦。众首领听罢，都觉得这话有理，当场便商议起整编的章程来。"
 SUM_Neo_SDH.91.a:"把土地分给部族"
 SUM_Neo_SDH.91.b:"把土地归入官仓"
 SUM_SDH_RB_Standing_Army:"常备军"
 SUM_SDH_RB_Standing_Army_desc:"不再临时雇兵，改养常备。常备军的粮饷，由盐路一并支出。每月点卯一次，名册上少了谁，军法便问到谁，一个也糊弄不过去。端的兵有了固定的饷，打仗才肯用心。"
 SUM_Neo_SDH.92.t:"常备军"
 SUM_Neo_SDH.92.d:"练兵的法子也改了。往日里一到战事，便临时雇兵，事过之后，一哄而散，靠不住。如今改为常备，平日里也养着一支兵，日日操练。原来就出自那条盐路。盐路贩卖食盐，日日有进账，把这笔钱专拨出来养兵，便不愁吃喝。有那算计精明的，把盐路的账算得清清楚楚，一文钱也不肯浪费。兵士们吃饱了饭，练得起劲，个个精神抖擞，再不似从前那般散漫。常备军既立，便有营房，有教场，有固定的号令。兵士们月月领饷，日日操练，渐渐练出精气神来。有那从前雇来的散兵，见常备军这般体面，也争着入伍。这盐路养兵，端的两全其美，盐商得利，军士得食。"
 SUM_Neo_SDH.92.a:"推举公议的执事"
 SUM_Neo_SDH.92.b:"沿用旧日的长老"
 SUM_SDH_RB_War_School:"讲武堂"
 SUM_SDH_RB_War_School_desc:"讲武堂教的是沙战与风战，也教识字。学堂里点着油灯，学员把口令抄了一遍又一遍，抄到半夜。军官里会写字的比不会的好用，端的命令写得下，才不会误了军机。"
 SUM_Neo_SDH.93.t:"讲武堂"
 SUM_Neo_SDH.93.d:"讲武堂里，教的可不只是舞枪弄棒。这里头既教沙战，也教风战，怎么在沙地里埋伏，怎么在狂风里辨向，样样都要学。此外还添了一样，便是教识字。原来带兵的军官，若能识字，识得文书，看得懂军令，比那目不识丁的，不知好用多少。讲武堂里，白日里练武，夜里便点起灯来认字。有那笨些的，把字写在沙地上，一遍遍描，描到手上都是沙。后来带兵出去，果然那些识字的，调度起来井井有条。讲武堂里还立了规矩：武艺考校，字也要考。两样都过得去，方能做军官。有那武艺高强却不识字的，也只能做个伍长，不得重用。众人起初不解，后来带兵出去，方知识字的好处，都叹服这规矩定得有理。"
 SUM_Neo_SDH.93.a:"让花神的誓约作证"
 SUM_Neo_SDH.93.b:"让官署的法度作证"
 SUM_SDH_RB_Rank_Strict:"严明军阶"
 SUM_SDH_RB_Rank_Strict_desc:"军阶从上到下排得清楚，谁是哪一级，一眼便知。肩膀上的标记，远近都认得，谁也冒充不得，连新兵也不敢越雷池一步。越级发令的军法处置，端的规矩立得严，队伍才不乱。"
 SUM_Neo_SDH.94.t:"严明军阶"
 SUM_Neo_SDH.94.d:"军中的阶次，从上到下排得清清楚楚。谁是将，谁是校，谁是伍长，谁是小兵，一级一级，明明白白，没有含糊。这规矩最要紧的一条，便是不许越级发令。小兵只听伍长的，伍长只听校尉的，一级压一级。有那自作聪明、越过上级直接下令的，一经查出，军法处置，决不宽贷。曾有个把总，仗着自己勇猛，越级调兵，结果误了战机，被按军法办了，众人看了都凛然，从此再不敢乱来。军阶既定，升赏也按次序来，不凭一时喜怒。有那立了战功的，一级级升上去，众人也无话可说。如有越级邀功的，不但不赏，反要治罪。军中最怕的就是乱了次序，这规矩一定，上下齐心，打起仗来如臂使指。"
 SUM_Neo_SDH.94.a:"与雨林互通有无"
 SUM_Neo_SDH.94.b:"与雨林划清界限"
 SUM_SDH_RB_War_Levy:"战时征发"
 SUM_SDH_RB_War_Levy_desc:"战时按户征发，轮值半年。点名那天，母亲们站在路边，望着儿子随队远去。征发令一下，集市上的年轻人立时少了一半，端的家家都有人在军中，谁也不能躲，一个也躲不过。"
 SUM_Neo_SDH.95.t:"战时征发"
 SUM_Neo_SDH.95.d:"到了战时，便按户征发。这征发也有章程：一户人家，轮值半年，半年期满，便换下一户。如此轮转，倒也均匀。征发令一下，各处便动员起来。集市上那些平日里闲逛的年轻人，一下子少了大半，都扛着家伙到军中报到去了。有那当娘的，追在儿子后头抹眼泪，一遍遍叮嘱。年轻人回头笑笑，大步走了，头也不回。营盘里顿时人满为患，日日操练，只等号令，一个个都憋着劲儿。半年期满，轮换回来，那些年轻人黑了、瘦了，却也结实了。家里人见了，又是心疼又是欢喜。下一户接着上路，周而复始，倒也公平。这按户轮值，最难得在一个匀字，苦乐均摊，谁也怨不得谁。"
 SUM_Neo_SDH.95.a:"把土地分给部族"
 SUM_Neo_SDH.95.b:"把土地归入官仓"
 SUM_SDH_RB_Order_All:"一切号令"
 SUM_SDH_RB_Order_All_desc:"把各部的兵、神的兵、雇的兵，全编进来，号令从一个地方出。改编那日，三拨人马立在沙地上，头一回听同一个号令。编不进的就地解散，端的兵归一处，才叫得动。"
 SUM_Neo_SDH.96.t:"一切号令"
 SUM_Neo_SDH.96.d:"哈德拉玛维特要整编军队。这一回是动真格的：各部的兵，神庙的兵，先前雇来的兵，一股脑儿全编进来。编成之后，号令只从一处出，再不许各吹各的号。这便是要拧成一支军的意思。可有那散漫惯了、编不进规矩里头的，怎么办？也不为难，就地解散，各回各家。有那舍不得离开队伍的，赶紧学了规矩，争着留下。整编之后，队伍果然整齐，号令一出，全军响应，如同一人。整编既毕，便分营立伍，各归其位。从前那各部自吹各的号、各打各的旗的光景，一去不返。中军一声令下，千军万马齐声响应，端的整齐。有那老兵感慨，说打了半辈子仗，今日才像支真正的军。如此军容，端的叫三军叹服。"
 SUM_Neo_SDH.96.a:"推举公议的执事"
 SUM_Neo_SDH.96.b:"沿用旧日的长老"
 SUM_SDH_RB_Mechan_Ruin:"遗迹的构装"
 SUM_SDH_RB_Mechan_Ruin_desc:"从遗迹里拆出的构装，能走能动，装上兵器，便是一队不知疲倦的兵。有一具还会自己认路，走到哪儿都掉不了队。这兵不吃粮，不喊累，端的只听号令，也不喊一声累。"
 SUM_Neo_SDH.97.t:"遗迹的构装"
 SUM_Neo_SDH.97.d:"从遗迹里拆出来的构装，端的是件奇物。这构装不用人驾，自己能走能动，关节处隐隐发着光。只要给它装上兵器，它便是一队兵，而且是从不知疲倦、从不怕死的兵。白日里摆在院子中，一动不动，像尊泥塑；一声令下，便咔咔地动起来，步伐整齐，刀枪并举。有那胆小的兵士，头回见它，吓得后退三步，以为见了妖怪。老兵笑道：这是咱们的帮手，怕它作甚？那兵士定睛看时，果然端正。后来又给构装披上护甲，画上花神的纹样，远远望去，竟与真人无异。敌军初见，以为是埋伏的精兵，吓得后退。及至看清是铁家伙，已来不及了。这构装上阵，端的省了许多人命。"
 SUM_Neo_SDH.97.a:"让花神的誓约作证"
 SUM_Neo_SDH.97.b:"让官署的法度作证"
 SUM_SDH_RB_Mechan_Works:"构装工坊"
 SUM_SDH_RB_Mechan_Works_desc:"专设工坊修补构装，工匠从外邦雇来，图纸锁在柜里。柜子上锁两道，钥匙分两个人拿着，谁也开不了。这图纸轻易不给人看，端的手艺在人手里，命脉却在那几张纸上。"
 SUM_Neo_SDH.98.t:"构装工坊"
 SUM_Neo_SDH.98.d:"构装这物件，用久了也会坏，坏了就得修。于是专门设了一座工坊，只管修补构装。这修构装的匠人，本邦里没有几个会，便从外邦雇了来。这些外邦匠人，手艺是有的，可身份终究是客。因此那构装的图纸，是锁在柜里的，钥匙由专人掌着，从不轻易示人。匠人每日进坊做工，照着拆开的样子修，却看不全那图。有那好奇的想多瞧一眼，管柜的便拦住：此乃机密，非你所能看。匠人也只得缩手。外邦匠人虽聘用，却也有章程：只许在坊中做工，不得随军移动，完工之后，便请出境。管柜的钥匙，更是每日交接，从不离身。有那匠人想多留几日，也被婉言谢绝。这般防备，为的是构装之秘不外泄，端的谨慎。"
 SUM_Neo_SDH.98.a:"与雨林互通有无"
 SUM_Neo_SDH.98.b:"与雨林划清界限"
 SUM_SDH_RB_Mechan_Parts:"部件的来路"
 SUM_SDH_RB_Mechan_Parts_desc:"构装的部件，只有遗迹里才有，掘一处便少一处。挖到后来，连一块完好的关节都寻不见，众人急得团团转。有人提议向雨林买，端的这东西卖一件少一件，价钱由不得你。"
 SUM_Neo_SDH.99.t:"部件的来路"
 SUM_Neo_SDH.99.d:"构装的部件，是越来越难寻了。这些部件，只有古遗迹里才有，掘一处便少一处，掘完了便再没有了。管事的为此愁眉不展，整日里唉声叹气。有人便出主意道：既然自家掘不出，何不向雨林那边去买？此言一出，众人议论纷纷。有的说买得来自是好的，有的说雨林那帮人，怎肯轻易把这不传之秘卖与咱们？万一卡住咱们的脖子，却如何是好？议来议去，也没个定论，只把这事暂且搁下。管事的后来派人四下寻访遗迹，把残存的部件一一登记造册，能修的修，能拼的拼，这才勉强维持。可终究是坐吃山空，谁心里都明白。有向雨林买的主意，便一再被人提起，却始终议而不决。这便叫巧妇难为无米之炊。"
 SUM_Neo_SDH.99.a:"把土地分给部族"
 SUM_Neo_SDH.99.b:"把土地归入官仓"
 SUM_SDH_RB_Doctor_Contract:"第二席的契约"
 SUM_SDH_RB_Doctor_Contract_desc:"有位外邦的学者，愿意提供构装的核心，代价是要在沙地设一处试验场。主母接过契约，先看了三遍，才问那试验场要多大。这买卖听着便宜，端的天下没有白给的好处。"
 SUM_Neo_SDH.100.t:"第二席的契约"
 SUM_Neo_SDH.100.d:"有一位外邦的学者，主动找上门来。这位学者手里，握着构装的核心之秘，愿意拿出来相助。可天底下没有白吃的筵席，他开出的代价是：要在沙地设一处试验场，由他随意摆弄。众人听了，一时拿不定主意。有的说这核心实在难得，不妨应了他；有的说让外人设场，终究是引狼入室。学者见众人犹豫，便道：我只要一块沙地，别无所求，也绝不生事。首领沉吟半晌，终是点了头。试验场设在沙地深处，四周围起高墙，闲人不得靠近。那位学者每日在里头摆弄构装，一会拆，一会装，神神秘秘。派去监视的人回报，说这外人学问是有的，只是心思难测。首领听了，叮嘱手下好生看着，切不可大意。"
 SUM_Neo_SDH.100.a:"推举公议的执事"
 SUM_Neo_SDH.100.b:"沿用旧日的长老"
 SUM_SDH_RB_Mechan_Army:"机械队伍"
 SUM_SDH_RB_Mechan_Army_desc:"第一支全由构装组成的队伍，在一次风夜里出动，回来时，一个部件也没少。风夜黑得伸手不见五指，这队兵摸黑也走得齐整。从此军中都说，这队兵不饮不食，倒省心。"
 SUM_Neo_SDH.101.t:"机械队伍"
 SUM_Neo_SDH.101.d:"第一支全由构装组成的队伍，终于要出动了。出动那日，正赶上大风之夜。风沙呼啸，天地昏暗，正是这铁家伙显身手的时候。一队构装，咔咔地开拔，刀枪在风里泛着冷光，虽无一个活人，却进退有度，行列整齐。它们涉过沙丘，绕过乱石，直扑敌营而去。待到天明归来，众人在营门口点检，一个部件也没少，连漆皮都没蹭掉一块。这一仗赢得干净利落，人人称奇。这构装队伍初战告捷，军中士气大振。那些原本害怕构装的兵士，如今也敢与它并肩而行。有那胆大的，还给它起了诨名，唤作铁人。从此每逢恶战，主帅便先派构装打头阵，端的所向披靡。铁人二字，端的无人不知。"
 SUM_Neo_SDH.101.a:"让花神的誓约作证"
 SUM_Neo_SDH.101.b:"让官署的法度作证"
 SUM_SDH_RB_Storm_Core:"风卫"
 SUM_SDH_RB_Storm_Core_desc:"风卫一支，专挑风天出战。平日驻在沙漠最深处的营里，轻易不下城。风一起，别人躲还来不及，他们却列队出营，就着漫天黄沙摸向敌阵。这等兵马端的罕见，风越大，他们的刀越快。"
 SUM_Neo_SDH.102.t:"风卫"
 SUM_Neo_SDH.102.d:"风卫这一支，专打风天。他们平日里驻扎在最深处的营地里，轻易不下城。为何如此？原来风天作战，最讲个隐蔽与耐性，城里人多眼杂，反倒不便。那深处的营地，藏在沙丘环抱之中，风一起，便与外界隔绝，正好练那风中作战的本领。风卫们日日在大风里穿行，练得眼能辨沙，脚能站稳。城里有那想请他们出山的，都被回绝了。直到大战来临，风卫才倾巢而出，一鸣惊人，果然不同凡响。风卫们也有规矩：不见大风不出营，一遇大风便倾巢而出。他们身上带着钩索，专用于在风沙里攀越沙丘，潜入敌后。这支部队藏得深，出手却狠，端的令人防不胜防。那钩索之利，端的厉害。"
 SUM_Neo_SDH.102.a:"与雨林互通有无"
 SUM_Neo_SDH.102.b:"与雨林划清界限"
 SUM_SDH_RB_Storm_Scout:"风哨"
 SUM_SDH_RB_Storm_Scout_desc:"风哨这班人，认风比认路还准。站在高处，便知百里之外哪一片沙丘要起沙暴。有一回，他报说东边有风，众人皆笑，半个时辰后，果然天昏地暗。这双眼睛端的抵得上百张地图。"
 SUM_Neo_SDH.103.t:"风哨"
 SUM_Neo_SDH.103.d:"风哨这行人，认风比认路还准。旁人走路，靠的是地标、是星斗，可风哨不同，他们的眼睛，是看风的。风里带着什么气味，风向哪个方向偏，风里有没有沙，他们一闻一望，便知分晓。最本领高强的，能在百里之外，报出哪一片将要起沙，分毫不差。有那不信的，特意派人去等着瞧，果然到了时候，那片地上沙尘滚滚，一句不差。众人才服了气。有风哨在军中，便如添了一双千里眼。风哨还不止报起沙。哪一片沙地松软陷脚，哪一处风向夜里会变，他们也都记得清清楚楚。行军时有了风哨引路，大军便少走许多冤枉路。这一双识风的眼，端的比那地图还准。行军有此一人，如虎添翼。"
 SUM_Neo_SDH.103.a:"把土地分给部族"
 SUM_Neo_SDH.103.b:"把土地归入官仓"
 SUM_SDH_RB_Storm_Camel:"风驼营"
 SUM_SDH_RB_Storm_Camel_desc:"风驼营里的骆驼，一概不挂铃铛。行军时蹄子裹了软布，走得再快，也听不见半点响动。夜里悄悄摸过敌营，守兵只当是风声。这无声的行军，端的比千军万马还叫人胆寒。"
 SUM_Neo_SDH.104.t:"风驼营"
 SUM_Neo_SDH.104.d:"风驼营里的骆驼，都一律不上铃。别处的驼队，驼颈上挂着铃铛，走一路响一路，叮叮当当，老远就听得见。可风驼营偏不如此，把铃铛都摘了。为何？原来他们行军，讲究一个静字。驼蹄裹了软布，落在沙上悄无声息，又不上铃，整支队伍走过，竟听不见一点响动。敌军在暗处听着，什么也听不着，哪里知道有一支驼队已经摸到了近前。有那新来不懂的，还想挂铃，被老兵一把扯下：你这是要报信给敌人么？这一静，端的救了不少事。有几回，风驼营趁夜摸到敌营之外，敌军竟毫无察觉。待到天明，才发现营帐外多了许多驼印，吓得魂飞魄散。行军贵在一个静字，这不上铃的法子，看似小事，其实大有文章。"
 SUM_Neo_SDH.104.a:"推举公议的执事"
 SUM_Neo_SDH.104.b:"沿用旧日的长老"
 SUM_SDH_RB_Storm_Siege:"破关队"
 SUM_SDH_RB_Storm_Siege_desc:"破关队，专打雨林伸进沙漠的关隘。趁风起时借着漫天黄沙遮眼，一路摸到墙根底下，等守兵察觉，刀已架上脖子。有一回风一起，他们便摸了进去，天亮时关隘已易了主。"
 SUM_Neo_SDH.105.t:"破关队"
 SUM_Neo_SDH.105.d:"破关队这一支，专攻雨林伸进沙漠的关隘。那些关隘，都是依着地形修的，墙高壕深，正面硬攻，吃亏的是自家。破关队便练了一手绝活：从风里摸到墙根。每到大风天，他们便借着风沙的掩护，贴着地面，一寸一寸往墙根爬。风沙迷了守军的眼，谁也瞧不见墙下有人。待摸到了墙根，便悄悄竖起云梯，冷不丁地翻上墙头。有那守军，直到刀架在脖子上，才惊觉不妙，已是迟了。破关队里还备着短刀与闷棍，专为摸上墙头之后近身搏杀。他们练了多年，脚步极轻，落地无声，连沙都不怎么响。这从风里摸墙的绝活，最考耐性，也最考胆气，少一分都成不了事。这般绝活，端的难得。"
 SUM_Neo_SDH.105.a:"让花神的誓约作证"
 SUM_Neo_SDH.105.b:"让官署的法度作证"
 SUM_SDH_RB_Storm_Endure:"耐渴训练"
 SUM_SDH_RB_Storm_Endure_desc:"这支部队，练兵头一条便是耐渴。三日无水，照赶路，照操演，谁也不许叫一声苦。练出来的兵，水囊带得少，补给便能省下三成。沙漠里打仗，省下水便是省下命。"
 SUM_Neo_SDH.106.t:"耐渴训练"
 SUM_Neo_SDH.106.d:"全军都要练一样本事，便是耐渴。沙漠里行军，最难的便是找水。于是练兵时，便有意不给水喝，三日无水，照旧赶路操练。起初兵士们叫苦不迭，嗓子冒烟，嘴唇起皮，可练得久了，竟也熬了过来。这耐渴的本练成之后，好处便显出来了：军中带的水便可以大大减少，补给能减去三成。从前要走一趟，得驮许多水囊，如今轻装上路，快了许多。兵士们也说，这苦没白吃。这三日无水的练法，起初也有人受不住，险些栽倒，可熬过之后，身子反倒结实。军中还传下话来：能耐渴者，方能走远路，方能打硬仗。这苦练出来的本事，到了沙场之上，端的能救人性命，值。这三日之苦，端的没有白受。"
 SUM_Neo_SDH.106.a:"与雨林互通有无"
 SUM_Neo_SDH.106.b:"与雨林划清界限"
 SUM_SDH_RB_Land_Commons:"土地归部"
 SUM_SDH_RB_Land_Commons_desc:"土地一事，如今重新分过。主母名下的、官署名下的田，一概分回各部，部里再按人头，一户一户分到手里。有那从前没地的，如今也得了两垄。地分到手，人心便定了。"
 SUM_Neo_SDH.107.t:"土地归部"
 SUM_Neo_SDH.107.d:"田地的规矩也改了。从前主母名下、官署名下，都圈着大片好地，旁人动不得。如今把这些地，统统分回各部，部里再按人头，一亩一亩分到各家。有那祖上就在主母地里种地的，这回也分到了自家的田，喜得直抹眼泪。分田那天，众人围着地界，你量我量，吵吵嚷嚷，却都是欢喜的吵嚷。从此种地的人有了自己的田，耕作也比往日勤快，田里整治得齐齐整整。分田之后，各家都把自己的地整治得齐齐整整，引水浇灌，施肥耕耘，唯恐落在人后。从前那大片荒芜的主母田，如今竟都种满了庄稼。有那老人抚着田埂说，这是祖辈盼了多少代的东西，今日总算到手。地分到手，人心也就定了，端的比什么规矩都管用。"
 SUM_Neo_SDH.107.a:"把土地分给部族"
 SUM_Neo_SDH.107.b:"把土地归入官仓"
 SUM_SDH_RB_Water_Share:"水源均分"
 SUM_SDH_RB_Water_Share_desc:"水井与绿洲，如今按人口分。人多得多，人少得少，明明白白写在册上。先前多占了地的人，这回都得吐出来，一文不肯让。有那不肯退的，众人一齐上前理论，也只得退了。"
 SUM_Neo_SDH.108.t:"水源均分"
 SUM_Neo_SDH.108.d:"水井与绿洲，也要按人口比例来分。哪一村有多少人，便照人数分多少水，多占了人家的，一概退回去。这事儿说起来简单，做起来却费了一番工夫。有那从前占着大片绿洲的部族，如今要退出许多，心里老大不情愿，磨磨蹭蹭。管事的便把人口册子摊开，一笔一笔算给他看：你家几口人，该分几口水的份额，明明白白，多占不得。那人无话可说，只得依了。众人看了，都说这分法公道。管事的还把分水的结果，写在木牌上，立在井边，叫人人都能看见。哪家分了多少，一望便知。有那往后想再占便宜的，看看木牌，也就死了心。凡事就怕明白二字，账目一明，争端自息。"
 SUM_Neo_SDH.108.a:"推举公议的执事"
 SUM_Neo_SDH.108.b:"沿用旧日的长老"
 SUM_SDH_RB_Farm_Together:"合耕"
 SUM_SDH_RB_Farm_Together_desc:"各部的田，如今合在一处种。哪块歇，哪块种，轮着来，地力便养得住。收成按各人出的工分，谁多干谁多拿，算得清清楚楚。分得清，也就吵得少了。这轮作之法，端的聪明。"
 SUM_Neo_SDH.109.t:"合耕"
 SUM_Neo_SDH.109.d:"各部的田，要合在一处安排轮作。这一片种谷，那一片便休耕养地，来年再换过来，地力便不衰。可各家田挨在一处，收成怎么算？原来按工分，谁家出的工多，谁家便多分。这账算得清楚，谁做了多少工，都记在册上。好处便是分得清。分得清，便吵得少。从前为着地界、为着收成，动不动就红脸，如今账目明白，谁也无话可说。轮作之法一行，地力果然养住了。往年种上三年便薄的地，如今年年有收成。各家按工分粮，多劳多得，也都心服口服。这合田一事，起初人人担心吃亏，如今见了好处，反倒都称赞起来。端的利不十，不变法。众人如今都说是这个理。"
 SUM_Neo_SDH.109.a:"让花神的誓约作证"
 SUM_Neo_SDH.109.b:"让官署的法度作证"
 SUM_SDH_RB_Grain_Common:"共仓"
 SUM_SDH_RB_Grain_Common_desc:"丰年时，各部的粮合进一座大仓；荒年时，再一齐开仓放粮。放粮按人口，一人一份，不问你出自哪一族。有一年大旱，全靠这仓粮救了急。这合仓之法，端的救命。"
 SUM_Neo_SDH.110.t:"共仓"
 SUM_Neo_SDH.110.d:"丰年合仓，荒年共放。丰年里各家各户把多余的粮食，一同交进公仓，堆得满满当当；到了荒年，便开仓共同放粮。这放粮也有规矩：按人口，一口人一份，不问你是哪一族、哪一部的。有那想凭着部族势大，多领几份的，管仓的一口回绝：这里只认人口，不认部族。众人见了，都道这法子周正。荒年里，就靠着这公仓的粮，一村一寨的人都挨过了难关，人人感念。公仓的钥匙，也是几个人各执一把，与那军费库一般严紧。放粮那日，众人围着仓门，按册领粮，无一争抢。有那孤寡老人，管事的还多给一勺。荒年见人心，这一仓粮，端的救了一方百姓，也养出一方和睦。"
 SUM_Neo_SDH.110.a:"与雨林互通有无"
 SUM_Neo_SDH.110.b:"与雨林划清界限"
 SUM_SDH_RB_Speak_Reed:"公议之庭"
 SUM_SDH_RB_Speak_Reed_desc:"主母厅对面，另盖起一座公议庭。两座厅隔着一条街，谁都能进去说话，不管你是部长老还是平头百姓。有冤的诉冤，有计献计，没人拦着。这公议庭一立，主母的厅便不再是唯一的门。"
 SUM_Neo_SDH.111.t:"公议之庭"
 SUM_Neo_SDH.111.d:"在主母厅的对面，另立起一座公议庭。这公议庭与那主母厅，隔着一条街，遥遥相对。主母厅是旧的权威，门槛高，寻常人进不去；这公议庭却是新的，门槛低，谁都能进去。端的是谁都能去。不管是各部长老，还是寻常牧人，只要你有理，便可进去把话讲明白。有那受了委屈的，从前没处诉苦，如今便到公议庭来，当着众人的面，把冤屈一一道来，众人听了都替他作主。公议庭里没有那许多规矩，也不设高座。众人围坐一圈，谁有理谁便说，说完大家评议。有那说得在理的，当场便定了主意。这公议庭虽小，却把那压在主母厅里的闷气，都给散了出来，端的痛快。"
 SUM_Neo_SDH.111.a:"把土地分给部族"
 SUM_Neo_SDH.111.b:"把土地归入官仓"
 SUM_SDH_RB_Iron_Mine:"开矿"
 SUM_SDH_RB_Iron_Mine_desc:"山里开了矿，取铁打器。矿工分作几班，轮流下洞，歇人不歇镐。工钱按月结清，一文不拖。有那欠债的矿工，拿了工钱，先把债还了。这按月结钱，端的让人安心。"
 SUM_Neo_SDH.112.t:"开矿"
 SUM_Neo_SDH.112.d:"在山里开矿取铁。那矿藏在深山之中，矿洞又黑又潮，挖起来着实辛苦。矿工们按班轮值，一班下来，累得腰酸背痛，满脸乌黑。可这辛苦钱，给得也实在：工钱按月结算，一文不欠。到了月底，管账的便把工钱一份份发下去，矿工们揣着钱，脸上有了笑意。有那新来的，嫌矿洞苦，想打退堂鼓，老矿工便劝道：苦是苦些，可这钱按月到手，养家糊口，比什么都强。那人听了，便安下心来。矿工们虽然在深山里受苦，但按月领钱，心里踏实。有人算了算，一年下来，比在沙地里放牧还强些。于是渐渐有人自愿进矿。这开矿取铁，供的正是军械，端的辛苦却也紧要。这铁料一出，军械便有了着落。"
 SUM_Neo_SDH.112.a:"推举公议的执事"
 SUM_Neo_SDH.112.b:"沿用旧日的长老"
 SUM_SDH_RB_Forge_War:"军械坊"
 SUM_SDH_RB_Forge_War_desc:"军械坊，专造刀枪与马掌。打出来的物件，头一批先紧着风卫用，剩下的才发给别处。铁匠日夜轮班，炉火从没熄过。好钢用在刀刃上，端的不假。"
 SUM_Neo_SDH.113.t:"军械坊"
 SUM_Neo_SDH.113.d:"军械坊，是专造兵器的所在。这里头打造刀矛弓箭，也打造马掌。兵器是杀敌的，马掌是护马的，样样都马虎不得。做出来的东西，先紧着谁用？原来先紧着风卫。风卫是专打风天的精锐，装备自然要最好的。军械坊的匠人，把最好的铁、最利的钢，都留给风卫打造。有那别的队伍想要好兵器的，得排在后面。匠人们日夜炉火不息，一件件兵器出炉，都经反复打磨，锋利无比。军械坊里最讲究的，是那淬火的一道工序。匠人把烧红的刀往水里一按，滋滋作响，几番反复，刀刃便锋利无比。有那外行人看着稀奇，匠人却道：这一手，没十年功夫学不来。好兵器端的费工夫。"
 SUM_Neo_SDH.113.a:"让花神的誓约作证"
 SUM_Neo_SDH.113.b:"让官署的法度作证"
 SUM_SDH_RB_Salt_Money:"盐利养军"
 SUM_SDH_RB_Salt_Money_desc:"盐路赚的钱，一吊也不进私囊，专款养军。账目一笔笔写在纸上，贴在营门口，谁都能看，谁都能算。有那想贪的，看了看那张纸，便缩了手。账目公开，端的少了好多手脚。"
 SUM_Neo_SDH.114.t:"盐利养军"
 SUM_Neo_SDH.114.d:"盐路的收入，专款用来养军。这条盐路，日日贩盐，进账源源不断。这笔钱，一文也不挪作别用，专门拨给军队。更难得的是，这账目是公开的，一笔一笔，都贴在营门口。哪个兵士想看，便可凑上前去瞧：本月盐路进了多少，军中用了多少，剩多少，明明白白。有那疑心军官贪墨的，看了账目，便也没了话说。兵士们见钱粮有着落，练兵也更有劲。军中大小开销，都从这盐路钱里支取，米面、草料、军械，样样有着落。有那管账的，每月把账目重新誊一遍，贴在营门口，风刮雨淋坏了，便再贴一张。兵士们看了，都说这明白账最让人放心。兵马未动，粮草先行，这盐路便是大军的后路。"
 SUM_Neo_SDH.114.a:"与雨林互通有无"
 SUM_Neo_SDH.114.b:"与雨林划清界限"
 SUM_SDH_RB_Tent_Maker:"帐幕作坊"
 SUM_SDH_RB_Tent_Maker_desc:"帐幕作坊，做的是行军帐与风袋。风天扎营，别人手忙脚乱，他们支帐快上一刻钟。别小看这一刻钟，风沙里少挨一刻，便少折损一批人马。这等手艺，端的也能救命。"
 SUM_Neo_SDH.115.t:"帐幕作坊"
 SUM_Neo_SDH.115.d:"帐幕作坊，做的是行军帐与风袋。这行军帐，轻便结实，风一吹便支起来；那风袋，鼓足了气，便能挡风。这两样东西，看着寻常，其实要紧得很。风天里扎营，若慢了一刻钟，队伍便要多受一刻钟的风沙，多折损一批人马。作坊的匠人，把帐幕做得极快，一搭一撑，转眼便成。有那赶时间时，匠人们手脚飞快，看得人眼花缭乱。队伍见了，都赞这作坊的功劳不小。作坊里还备着许多风袋，扎营时鼓起来，便成一堵挡风的墙。兵士们钻进帐里，风在外头呼啸，帐里却暖暖和和。有那从没见过这阵仗的新兵，惊叹不已。行军打仗，住的也是大事，这一座作坊，端的省了三军的力气。"
 SUM_Neo_SDH.115.a:"把土地分给部族"
 SUM_Neo_SDH.115.b:"把土地归入官仓"
 SUM_SDH_RB_War_Chest:"军费库"
 SUM_SDH_RB_War_Chest_desc:"军费库，单设一处，与别的钱分开。要用这钱，须得三个人同时开口，少一个也开不得库门。有一回，两人想动钱，第三人不在，只得作罢。这规矩严是严，却省了许多糊涂账。"
 SUM_Neo_SDH.116.t:"军费库"
 SUM_Neo_SDH.116.d:"另有单设的一座军费库。这库里存的，是军中的钱粮。这钱粮怎么用，规矩定得极严：动用的时候，须得三个人同时开口，缺一个人也不成。原来是要防那一个人独断专行，把军费挪作私用。三个管库的人，各执一把钥匙，须三把钥匙一齐，方能开库。曾有人想走捷径，只找了两人商量，第三个人不肯，这事便黄了。从此军费分毫不敢乱动，人人放心。三个管库的人，也都是众人公推的，彼此互相监督。每逢开库，三人当面点清，记下数目，签字画押。这般麻烦，为的便是杜那贪墨的念头。真个是：三把钥匙三张口，谁也休想独吞钱。这规矩端的周全，人人称善。"
 SUM_Neo_SDH.116.a:"推举公议的执事"
 SUM_Neo_SDH.116.b:"沿用旧日的长老"
 SUM_SDH_RB_War_Economy:"战时经济"
 SUM_SDH_RB_War_Economy_desc:"盐、粮、铁三样，如今一律管制，归于战时。先供军中，再顾百姓，次序排得明明白白。有那囤积居奇的，一经查出，货便充了公。乱世之中，先军后民，端的是没法子的法子。"
 SUM_Neo_SDH.117.t:"战时经济"
 SUM_Neo_SDH.117.d:"哈德拉玛维特的风沙一起，议事厅里的灯便彻夜不熄。当权者拍案定下三条规矩：盐、粮、铁，尽数归入战时管制。原来盐能养兵丁的力气，粮能填行军的肚皮，铁能打造刀枪，缺一样都打不得仗。当下便差人分头去办，盐场的秤换过了，粮仓的锁换过了，铁匠铺的炉子也由官家派人守着。先尽着军中支用，余下的才轮到百姓。市集上原有的买卖，一夜之间改了章程，卖盐的不敢多称，买铁的不敢多问。有老妇人排队领粮，捧着那一点点口粮，嘴里念叨着先军后民四个字，也不知是赞是怨。有一回，一个兵卒持条到盐场支盐，秤上少了一勺，他也不敢吱声，把盐袋扎紧便回营。旁观的百姓看了，谁也没有言语。"
 SUM_Neo_SDH.117.a:"让花神的誓约作证"
 SUM_Neo_SDH.117.b:"让官署的法度作证"
 SUM_SDH_RB_Curfew:"宵禁"
 SUM_SDH_RB_Curfew_desc:"入夜之后，一律宵禁。街上静悄悄的，只有巡逻的更夫来回走，脚步声在空巷里格外清脆。夜里安静了，白天说闲话的人也跟着少了。这宵禁一严，城里的许多人情，也便淡了。"
 SUM_Neo_SDH.118.t:"宵禁"
 SUM_Neo_SDH.118.d:"哈德拉玛维特自从军令一下，入夜便行了宵禁。更鼓一敲，街上的铺子纷纷上门，灯火一盏盏灭了，只剩巡逻的兵丁，提着灯沿街走动，影子在土墙上晃来晃去。这宵禁原是为防奸细，可日子一久，连白日里的话也跟着少了。街坊邻里碰了面，先往四下里张望一遭，才敢低声说两句，说完便各自散去。先前茶摊上那些高谈阔论的，如今都闭了嘴，怕隔墙有耳。有个卖水的老汉，挑着担子走街串巷，见人就摇头叹息，却不敢出声。夜里的城安静得怕人，连狗都不叫了。城西有个卖汤饼的老翁，往日里总要吆喝到三更，如今刚过二更便收了摊子。有人问他生意如何，他压低嗓子说，钱少赚些不打紧，莫要惊动了巡夜的。"
 SUM_Neo_SDH.118.a:"与雨林互通有无"
 SUM_Neo_SDH.118.b:"与雨林划清界限"
 SUM_SDH_RB_Propaganda:"宣谕"
 SUM_SDH_RB_Propaganda_desc:"雨林欠沙漠的账，被人编成了歌。集市上有人唱，唱完众人跟着和；一城唱罢，又传到下一城。唱到欠水、占地的句子，听的人便咬牙。这歌比檄文还厉害，端的是深入人心。"
 SUM_Neo_SDH.119.t:"宣谕"
 SUM_Neo_SDH.119.d:"沙漠的人记性好，尤其记仇。雨林这些年占了沙漠的水、多收了过路的税，一笔一笔都记在心里。有个识字的歌手，索性把这些旧账编成歌，一句欠水，两句占地，三句多税，曲调凄怆，在集市上支起个摊子便唱。原来这歌一唱，听的人便围成一圈，听到恼处，齐齐跺脚，有的还跟着抹泪。歌手唱罢一段，歇口气，又从头唱起，第二天便传到了邻城，邻城的人听了，也跟着编自己的词。没几个月，几处绿洲都会唱这支歌。孩子们不懂账目，却把调子记得最牢，成天在巷子里哼。后来这歌越传越远，连沙漠尽头的商队都会在歇脚时哼上两句。雨林那边听见了，起初只当是野调，日子久了，也觉出这调子里藏着的分量。"
 SUM_Neo_SDH.119.a:"把土地分给部族"
 SUM_Neo_SDH.119.b:"把土地归入官仓"
 SUM_SDH_RB_Tribunal:"军法处"
 SUM_SDH_RB_Tribunal_desc:"军中设了军法处，专管临阵脱逃。犯了事的，就地正法，决不宽贷。判完还要当众宣布，把罪名一条条念出来，教众人听了知所畏惧。军法如山，端的容不得半点私情。"
 SUM_Neo_SDH.120.t:"军法处"
 SUM_Neo_SDH.120.d:"行军打仗，最怕的是人心散。当权者深明此理，特地设下一处军法处，明明白白立下规矩：但凡临阵脱逃的，就地正法，绝不宽宥。这还不算，判词一定要当众宣布，叫三军都听见。为何要当众？原来杀一人是儆百人，若悄悄办了，谁还知晓畏惧。一日果有个兵丁，交锋时腿软退了半步，被军法处拿住，绑在辕门外。号令一下，监斩官高声念其罪状，一字一句，清清楚楚，念完刀落，众人屏息。自这桩事传开，三军再无敢回顾的，个个向前。三军将士看了这一幕，个个颈后发凉，暗暗想道，这军法处果然不是虚设，日后上阵，谁还敢把性命当儿戏。打这以后，营里操练格外用心，号令一下，动止齐心，连冒险的心也没了。"
 SUM_Neo_SDH.120.a:"推举公议的执事"
 SUM_Neo_SDH.120.b:"沿用旧日的长老"
 SUM_SDH_RB_Mobilize_All:"全国动员"
 SUM_SDH_RB_Mobilize_All_desc:"动员令一下，各部都动了。凡能拿得动兵器的，不论老少，都上了名册。有那不会使刀的，也领了一杆长枪，日日操练。到了这地步，沙漠端的是全民皆兵了。"
 SUM_Neo_SDH.121.t:"全国动员"
 SUM_Neo_SDH.121.d:"动员令一下，如同一阵疾风卷过哈德拉玛维特的每一处绿洲。传令的骑手昼夜换马，把文书送到各个部落。册子上要登的，凡是能拿得动兵器的，不论年长年少，都算数。各处的空地上都排起了长队，有壮年汉子扛着自家的大刀，有少年攥着一杆长枪，手心全是汗。书吏伏在一张矮桌上，笔尖不停，一个名字接一个名字地写，墨汁溅到了手背上也不顾。有个老猎人，胡子都白了，也来报名，说拉得动弓便算能拿兵器。不长工夫，几大本名册便摞得老高。书吏写到手腕发酸，便甩一甩手，蘸蘸墨，接着写。册页翻过一页又一页，上头有农夫，有猎户，有商贩，也有闲汉，名字排得满满当当。掌事的把名册收拢，用绳捆了三捆，妥帖收好。"
 SUM_Neo_SDH.121.a:"让花神的誓约作证"
 SUM_Neo_SDH.121.b:"让官署的法度作证"
 SUM_SDH_RB_Iron_Storm:"铁与沙之世"
 SUM_SDH_RB_Iron_Storm_desc:"哈德拉玛维特的兵，不再散在各部，都按号驻进固定的营。风起了照操，风停了照练，再乱的风也吹不散队伍。沙漠头一回有了这样一支军，也有了这样一张密密的号册。"
 SUM_Neo_SDH.122.t:"铁与沙之世"
 SUM_Neo_SDH.122.d:"哈德拉玛维特的兵，先前散在各部，如同沙子撒在沙滩上，风一吹便各奔东西。如今改了章程，不再散着，按着号头驻进固定的营盘。哪一号住哪一顶帐，哪一号站哪一班岗，都有定规。风起了照旧操练，风停了照旧演练，从不懈怠。沙漠里练兵难就难在这风，风沙迷眼，队列最容易乱。可这支兵偏在风里立住了脚，号册排得密密麻麻，风再大也吹不散。头一回全军在点将台上集合，号手一吹号，各营依序而进，整整齐齐。老兵看了，忍不住点头，说沙漠里头一遭有了这样一支军。每逢校场比武，各营号手齐齐吹号，声音在沙丘间回荡。有那不明就里的外人看了，还以为是天兵下界，却不知这都是平日里在风沙中一遍遍操练出来的功夫。"
 SUM_Neo_SDH.122.a:"与雨林互通有无"
 SUM_Neo_SDH.122.b:"与雨林划清界限"
 SUM_SDH_RB_Sand_Commune:"沙地公产"
 SUM_SDH_RB_Sand_Commune_desc:"哈德拉玛维特的地，分回了各部；水按人口分，粮在荒年一齐放。主母厅对面，又立起一座公议庭，两厅隔着一条街相对。来往的人先去哪一座，只看当天日头晒哪边。"
 SUM_Neo_SDH.123.t:"沙地公产"
 SUM_Neo_SDH.123.d:"打了仗、定了规矩之后，哈德拉玛维特的地又分回了各部。田还是那些田，分法却变了：水按人头分，一口人一份，谁也多占不得；粮按荒年的例，一同放出去，不分彼此。更有一桩新鲜事，主母的厅对面，隔一条街，立起了一座公议庭。原来凡事不能都由主母一人说了算，得有个公议的地方。两座厅隔着一条街对着，来往的人先是往哪边去，全看当天的日头。日头晒在公议庭这边，人们便躲进主母厅的阴凉；日头转了过去，又都踱到公议庭来。两下里你推我让，倒也公平。两座厅里办事的人也试出了门道：遇着急事，先到公议庭议个章程，再到主母厅用印；若只是寻常琐事，便拣阴凉的那座厅进去说。日子一久，两下里竟也相安。"
 SUM_Neo_SDH.123.a:"把土地分给部族"
 SUM_Neo_SDH.123.b:"把土地归入官仓"

 #### 丙线 · 绿洲自治 ####
 SUM_SDH_RC_The_Oasis_Parliament:"绿洲议政"
 SUM_SDH_RC_The_Oasis_Parliament_desc:"第三条路，不要神权，也不要军国。只求把哈德拉玛维特的几处绿洲，经营成能自己过日子的地方：议政、通商、立律、养民。对外只求一件事，别来管。这主意说得平常，做起来却难。"
 SUM_Neo_SDH.124.t:"绿洲议政"
 SUM_Neo_SDH.124.d:"世上之路，不止一条。哈德拉玛维特的人商量来商量去，既不走神权那一条，也不走军国那一条，偏要寻第三条。这条路说的明白：不求神，不黩武，只求把几处绿洲经营成能自己过日子的地方。怎么经营？议政、通商、立律、养民，四桩事一齐抓。对内把日子过好，对外只求一件事，别来管。这主意听着平常，做起来却难。神权那边说你是离经叛道，军国那边说你是软弱无能，两边都不待见。可绿洲的人铁了心，关起门来只管自家的事，田照种，市照开，律照立。起初也有人半信半疑，说这般不结盟、不称霸的路子，岂不是任人欺负？可当权者指着满仓的粮食和热闹的集市说，守得住自家的安稳，便是本事。众人听了，方才恍然。"
 SUM_Neo_SDH.124.a:"重立赤王的旧制"
 SUM_Neo_SDH.124.b:"重建城邦的议会"
 SUM_SDH_RC_Oasis_Charter:"绿洲宪章"
 SUM_SDH_RC_Oasis_Charter_desc:"每处绿洲，各立一份宪章。写明公事由谁议、谁办、谁查，一样样分得清楚。谁也不许越过章程办事，出了事，照章追究。这章程立得细，端的少见。"
 SUM_Neo_SDH.125.t:"绿洲宪章"
 SUM_Neo_SDH.125.d:"第三条路既定，头一件事便是立规矩。哈德拉玛维特每一处绿洲，都立下一份宪章。宪章上写得清清楚楚：哪些是公事，公事由谁议、谁办、谁查，一条一条，分得明白。原来吃过大亏的人知道，凡事若囫囵吞枣，日后必定你推我赖。如今白纸黑字写定，议的人是议的人，办的人是办的人，查的人是查的人，各管一摊，谁也别想一手遮天。立宪章那天，绿洲的广场上摆了长案，识字的当众念，不识字的侧耳听，念完一处，众人按了手印。宪章既立，便成了各处办事的准绳。谁若越过章程自作主张，旁人便把宪章往他面前一摊，指着那一条念给他听，念得他面红耳赤，再不敢多说。这一张纸的厉害，端的胜过千军万马。"
 SUM_Neo_SDH.125.a:"召集能战之众"
 SUM_Neo_SDH.125.b:"召集能谋之士"
 SUM_SDH_RC_Council_Oasis:"绿洲议事"
 SUM_SDH_RC_Council_Oasis_desc:"各处绿洲，各推代表，聚到一处议事。议期定的是一个月，议完便各回各家，不许逗留。有那话没说完的，也只得记下来，下月再说。这议期一满就散，端的干脆。"
 SUM_Neo_SDH.126.t:"绿洲议事"
 SUM_Neo_SDH.126.d:"各处绿洲立了宪章，接着便要议事。怎么议？各处推举代表，到一处地方聚齐。这代表也不是随便派的，要众人信得过的人物。议期定为一月，一月之内，把该议的事都议完，议完便各回各家，不许多留。为何要限一月？原来这事关农时，代表们在家都有田有活，若久拖不决，误了耕作，百姓先不答应。当下各处代表陆续到了议事的地方，见面先叙礼，随后落座，把各处带来的议题一条条摆上桌面，你一言我一语，争到激烈处，面红耳赤，可到头来总能议出个结果。议事的日子里，厅堂上烟气缭绕，茶碗换了一道又一道。有那性子急的代表，拍着桌子争得面红耳赤，待到议出个公道结果，又都哈哈一笑，前嫌尽释，第二日照旧一同下地。"
 SUM_Neo_SDH.126.a:"以神权号令沙漠"
 SUM_Neo_SDH.126.b:"以律法约束诸城"
 SUM_SDH_RC_Elder_Elect:"公推长老"
 SUM_SDH_RC_Elder_Elect_desc:"长老一职，如今不再世袭。由绿洲上的住户公推，谁得人心谁来做，任期三年，到时重推。有那做得出色的，连任也不稀奇。这法子端的比世袭公道。"
 SUM_Neo_SDH.127.t:"公推长老"
 SUM_Neo_SDH.127.d:"旧时的长老，多是老子传儿子，一代代世袭下来，不管贤不贤，反正轮到谁就是谁。如今改了规矩，长老不再世袭，改由绿洲上的住户公推。谁办事公道，谁就得人心，谁就得票。任期也定下，三年一任，到期满时再推一回。原来世袭的长老，久坐那位子，便把自己当成了主子，百姓的死活全不放在心上。如今三年一换，做得好留你，做不好请你走，人人都得夹着尾巴办事。头一回公推那天，绿洲的场上聚了满满的人，候选的站在前面，众人你指指这个，我点点那个，最后敲定。新任的长老上任头一件事，便是把自家的账目摊在众人面前，从一粒盐数到一斗粮，明明白白。百姓看了，都说这回选对了人。"
 SUM_Neo_SDH.127.a:"把遗迹挖开"
 SUM_Neo_SDH.127.b:"把遗迹封回去"
 SUM_SDH_RC_Petition_Hall:"陈情处"
 SUM_SDH_RC_Petition_Hall_desc:"设了一处陈情衙门，谁有冤屈，递一张纸子进去，三日之内必有回话。有那等不及的，日日来问，衙门也不嫌烦。这衙门端的给百姓做主。"
 SUM_Neo_SDH.128.t:"陈情处"
 SUM_Neo_SDH.128.d:"百姓有冤屈，最怕的是告状无门。旧日主母的厅，如今改了陈情处，专门管这个。谁有冤屈，写张纸子递进去，三日之内，必有回话。这三日之期，可是了不得。先前告状，状纸递上去如同石沉大海，等上一年半载也没个音信。如今白纸黑字定下三日，办事的人不敢懈怠，日日都有人守在陈情处，收了纸子便登记在册，到期必须回复。有一回，一个卖菜的汉子被人赖了账，写好纸子递进去，果然第三日便有人来断，把那赖账的训了一顿，追回了钱。自此百姓都知道，这衙门是真办事的。陈情处的门口，还挂了一块木牌，上头写着有冤便说四字。有人起初怕得罪人，递了又悔，后来见办事的真替人做主，胆子便大了，渐渐地，递状子的队伍竟排到了巷口。"
 SUM_Neo_SDH.128.a:"重立赤王的旧制"
 SUM_Neo_SDH.128.b:"重建城邦的议会"
 SUM_SDH_RC_Office_Limit:"限权之法"
 SUM_SDH_RC_Office_Limit_desc:"当官的，不许经商，也不许占水。这规矩定得极细，连亲戚沾光都写在前头。要想破，比登天还难。有那想钻空子的，一细想，竟无处下嘴。规矩细到这份上，端的难得。"
 SUM_Neo_SDH.129.t:"限权之法"
 SUM_Neo_SDH.129.d:"规矩立得多了，也有那钻空子的。当权者料到这一层，特地定下两条铁规矩：凡是在任办事的人，不得经商，不得占水。为何单挑这两样？原来绿洲里最值钱的，一是买卖，二是水源，当官的若插手这两样，必定与民争利，日子久了，就成了骑在百姓头上的老爷。这规矩立得细，破得也难。条文写得明白，在任一天，便一天不许沾这两样，连亲戚打着旗号也不成。有人不信邪，暗中入股一家商号，被查了出来，当场革了职，还当众申明缘由。众人看了，方知这规矩不是摆设。这规矩还立了榜文，张挂在各处衙门口，叫人人知晓。有那当官的想绕着弯子，让自家子弟出面经商，也被查了出来，一并办了罪。自此人人晓得，这规矩是动的真格，不是写着好看的。"
 SUM_Neo_SDH.129.a:"召集能战之众"
 SUM_Neo_SDH.129.b:"召集能谋之士"
 SUM_SDH_RC_Road_Fix:"修商道"
 SUM_SDH_RC_Road_Fix_desc:"几处绿洲之间的旧道，坑坑洼洼，如今一并补平。沿途又掘了井，盖了驿站，商队走累了，有水喝有处歇。这路修得好，买卖便活了。"
 SUM_Neo_SDH.130.t:"修商道"
 SUM_Neo_SDH.130.d:"哈德拉玛维特几处绿洲之间，原本有些旧道，年久失修，被风沙埋得坑坑洼洼，走起来硌脚得很。如今决定把这些旧道一一补平，沿途还要设井、设驿站。原来沙漠里行路，最要紧的是水和歇脚处。有了井，人畜不致渴死；有了驿站，走了半天有个落脚的地方。当下征了人夫，一段一段地修，坑的填平，断的接上，井一眼一眼地打，驿站一间一间地盖。修好之后，商队走过，驼铃叮当，再不似先前那般艰难。有个老商人对着新道点头，说这路修得实在，造福的是后人。驿站里备着水囊与草料，过往的行人到了此处，卸下行囊歇一歇脚，饮一瓢凉水，浑身都舒坦了。有那走惯了旧道的老驼工，拍着新修的路面连连称奇，说沙漠里头一回有这般齐整的路。"
 SUM_Neo_SDH.130.a:"以神权号令沙漠"
 SUM_Neo_SDH.130.b:"以律法约束诸城"
 SUM_SDH_RC_Tax_Public:"公开税则"
 SUM_SDH_RC_Tax_Public_desc:"税则，刻在石碑上，立在城门口。谁家该交多少，自己照碑一算便知，不许差役多要一文。有那想多收的，看看那碑，也只得罢了。税则公开，端的省心。"
 SUM_Neo_SDH.131.t:"公开税则"
 SUM_Neo_SDH.131.d:"收税这事，最怕的是糊涂账。税吏嘴里说多少就是多少，百姓连个凭据都没有。如今改了章程，把税则一条条刻在石碑上，立在城门口，谁交多谁交少，自己站到碑前一看便算得出来。这一举可是妙极。碑上的字是刻死的，税吏想多收也无从下手，想少收也不行，一切照碑办事。立碑那天，城门口围满了人，识字的念给不识字的听，念完都点头，说这下心里有底了。有个精明的商户，站在碑前核算自家该交的，算完一拍大腿，说分毫不差。自此收税再无争吵。碑上的字，是请了最好的石匠一笔一笔凿的，深得能存住影子。税吏每日站在碑下，照本宣科，再不能信口开河。百姓交割完钱粮，还要踱到碑前再核对一遍，心里方才踏实。有几家索性把碑文抄回家，贴在墙上。"
 SUM_Neo_SDH.131.a:"把遗迹挖开"
 SUM_Neo_SDH.131.b:"把遗迹封回去"
 SUM_SDH_RC_Trade_House:"商行"
 SUM_SDH_RC_Trade_House_desc:"几家大商户，合成一处商行，专做外邦的买卖。香料、木材、奇珍，一样样贩来贩去。账目挂在堂上，谁都能看。这生意做得明白，端的长久。"
 SUM_Neo_SDH.132.t:"商行"
 SUM_Neo_SDH.132.d:"哈德拉玛维特要做大买卖，一家一户的摊子太小，于是几家大商户凑到一处，合设了一家商行，专营外邦贸易。原来外邦的买卖路子远、本钱大，一家吃不下，合起来才做得成。可合股最怕的是账目不清，彼此猜忌。为此，商行立下规矩，账目一律公开，每一笔进出都记在明处，股东随时可查。当下几家的掌柜坐在一张桌前，各自认了股份，定了章程，选了个精明老成的当总管。头一桩买卖做成，账目当众一算，人人信服。自此生意越做越旺，外邦的货物源源不断。商行还立下规矩，凡大宗买卖，须两家掌柜同签押才可发货，一人说了不算。有一回总管想独吞一批货，被同伙当场拦下。自此众人越发放心，把本钱源源投进来。"
 SUM_Neo_SDH.132.a:"重立赤王的旧制"
 SUM_Neo_SDH.132.b:"重建城邦的议会"
 SUM_SDH_RC_Salt_Public:"盐归公营"
 SUM_SDH_RC_Salt_Public_desc:"盐场，归公议经营；盐价，也由公议来定。谁也不许囤积居奇，囤了便要罚。有那想抬价的，被众人一哄，只得照价卖。盐是命根子，端的不能由着人捏。"
 SUM_Neo_SDH.133.t:"盐归公营"
 SUM_Neo_SDH.133.d:"盐这东西，人人日常要用，最是民生所系。若落在奸商手里，今日囤积，明日抬价，百姓吃什么都成问题。为此哈德拉玛维特把盐场收归公议经营，盐价也由公议定下，明码标价，谁也不许囤积居奇。这规矩定得及时。先前有那囤盐的，把盐藏在地窖里，等着涨价，害得市上的盐价翻了几番。如今盐场归了公家，产多少、卖多少，都有定数，盐价写在牌子上，童叟无欺。有一回，一个商户想私下囤一批盐，被巡查的查获，连盐带货一并没收。百姓见了，都说这回是替天行道。盐价写在木牌上，挂在盐场门口，一月一换，若需变动，也要公议过了才改。有那粮商想趁着荒年抬价，被公议庭传了去，好一顿训斥，罚了他半月的利钱。市面上的盐价，自此稳稳当当。"
 SUM_Neo_SDH.133.a:"召集能战之众"
 SUM_Neo_SDH.133.b:"召集能谋之士"
 SUM_SDH_RC_Mint_Oasis:"绿洲铸钱"
 SUM_SDH_RC_Mint_Oasis_desc:"开炉铸钱，成色足，分量准，还把成色重量刻在钱边上。周边各邦见了，都乐意收。拿这钱去买货，童叟无欺。钱好不好使，端的在成色。"
 SUM_Neo_SDH.134.t:"绿洲铸钱"
 SUM_Neo_SDH.134.d:"要做买卖，少不了钱。先前哈德拉玛维特用的钱，成色参差，分量不一，拿到外邦人家不认。于是当权者开炉铸钱，新钱一面铸着王号，边缘刻明成色与分量，一分一毫都有定数。原来经商最重一个信字，钱的分量准了，人家才肯收。新钱铸出，先送到周边各邦验看，人家拿秤一称，成色分毫不差，当即点头，答应通用。自此哈德拉玛维特的钱在四邻都使得开，商队带着新钱走遍各方，买货卖货再不费力。铸钱的炉火昼夜不熄，叮叮当当，铸出一堆堆雪亮的钱。新钱的模样也讲究，一面刻着绿洲的纹样，一面刻着王号，边缘的齿纹细细的，用手一摸便知真伪。周边各邦的商人起初还拿不准，后来收得多了，都说这钱成色足、分量准，比旧钱强得多。"
 SUM_Neo_SDH.134.a:"以神权号令沙漠"
 SUM_Neo_SDH.134.b:"以律法约束诸城"
 SUM_SDH_RC_Common_Law:"共律"
 SUM_SDH_RC_Common_Law_desc:"各部的旧规矩，合成一部共律。合得拢的写进去，合不拢的先空着，留待日后再议。有那空着的地方，众人也不急。这共律留白，端的稳当。"
 SUM_Neo_SDH.135.t:"共律"
 SUM_Neo_SDH.135.d:"哈德拉玛维特各部，各有各的旧规矩，你这套我那套，常常对不上，遇上跨部的事便扯皮。于是有人倡议，把各部的旧规合起来，编成一部共律。谈何容易。这一条和那一条对得上便留下，对不上的，你争我吵，谁也不肯让步。当权者想了个主意：合得拢的先写进共律，合不拢的暂且空着，留待日后再说。如此一办，共律很快便成了模样，空着的地方也明明白白留着位置，叫人一看便知哪里还没议定。后来陆陆续续，空处一点点补上。编共律的那些日子，几位老学究围坐一处，为了一个字眼争得面红耳赤。有一个条款，你说是这样，他说是那样，谁也说服不了谁，最后干脆在纸上留个空，旁边批一句日后再议。后来果然有一日，各处都点了头，那空处才补上。"
 SUM_Neo_SDH.135.a:"把遗迹挖开"
 SUM_Neo_SDH.135.b:"把遗迹封回去"
 SUM_SDH_RC_Judge_Ride:"巡回法官"
 SUM_SDH_RC_Judge_Ride_desc:"法官，按季走遍各处绿洲。就地审案，判词当众念出来，教众人听着明白。有那远地方告状不便的，这回也得了方便。这巡审之法，端的妥当。"
 SUM_Neo_SDH.136.t:"巡回法官"
 SUM_Neo_SDH.136.d:"律例立了，还需有人来断案。哈德拉玛维特定下规矩，法官不必坐衙门里等，而是按着季节，走遍各处绿洲，就地审案。到了一处，便在场上摆开庭来，原告被告当面对质，证人上前作证，法官听了两造的话，当堂断决，判词还要当众高声念出。这般做法好处多多。百姓打官司，不必长途跋涉跑到城里，在家门口便能断个明白；判词当众念，法官想徇私也不能够，众人听着呢。有一回，一个法官断得含糊，被在场的人当场诘问，只好重新斟酌。自此法官断案越发仔细。法官还带着一杆秤和一卷尺，断案时用来量地、称粮，凭的是实物，不凭口供。有一回两户人家争一渠水，法官亲自到渠边看过，量了宽窄，听了两造的话，当众断明，两家都心服口服。"
 SUM_Neo_SDH.136.a:"重立赤王的旧制"
 SUM_Neo_SDH.136.b:"重建城邦的议会"
 SUM_SDH_RC_School_Oasis:"学馆"
 SUM_SDH_RC_School_Oasis_desc:"学馆里，教的是算术、地理、律例，也教识字。来学的人不分部族，沙漠的、雨林的，一齐坐着听。有那年纪大了的，也来凑个热闹。这学馆端的开阔。"
 SUM_Neo_SDH.137.t:"学馆"
 SUM_Neo_SDH.137.d:"要治理好地方，少不了读书识字的人。哈德拉玛维特便各处设了学馆，教算术、教地理、教律例，也教识字。特别就在来学的人不分部族。先前各部彼此隔着心，你部的孩子不进我部的学馆。如今一律放开，凡是愿意学的，不管出自哪一部，都收。学馆里，各族的孩子坐在一处，一同听课，一同写字，日子久了，隔阂也淡了。先生讲算术，用沙漠里的水渠做例子；讲地理，指着墙上的图说各处绿洲。有个部族的首领起先不肯送孩子来，后来见学馆里果然不分彼此，也就松了口。学馆里还立了一条：学费一概免了，笔墨纸砚也由公家出。这可叫穷苦人家的孩子欢喜不尽，每日天不亮就背着书袋来，坐在门槛上等开门。部族的首领们见了，也渐渐把自家孩子送来，一同听课。"
 SUM_Neo_SDH.137.a:"召集能战之众"
 SUM_Neo_SDH.137.b:"召集能谋之士"
 SUM_SDH_RC_Contracts:"契约存档"
 SUM_SDH_RC_Contracts_desc:"凡立下大契约的，都要留一份底子在存档处。日后两家争执，各说各的理，便把底子取出来一对，谁是谁非，立时分明。这存档处端的省事。"
 SUM_Neo_SDH.138.t:"契约存档"
 SUM_Neo_SDH.138.d:"民间立契约，口说无凭，最易生争端。为此哈德拉玛维特设了一处存档处，凡立下大的契约，都要留一份底稿在那里。日后若起了争执，把底稿取出来一对，谁是谁非，立时分明。这一处存档处，省了多少口舌。先前两家做买卖，各执一词，都说对方赖账，闹到后来连朋友也做不成。如今有底稿在，白纸黑字摆着，想赖也赖不掉。存档处里，一卷卷契约按类存放，登记在册，取用时须得当面登记，用完归还，不许带走。有个老吏专管此事，把契约守得比自家的性命还紧。存档处的门，钥匙分作两把，一把在老吏手里，一把在公议庭，两把一齐才开得开。这般用心，为的是防那偷改底稿的。有一回，有人夜里想溜进去改契约，见两把锁并排挂着，只得悻悻而回。"
 SUM_Neo_SDH.138.a:"以神权号令沙漠"
 SUM_Neo_SDH.138.b:"以律法约束诸城"
 SUM_SDH_RC_Press:"抄书坊"
 SUM_SDH_RC_Press_desc:"抄书坊，把共律与宪章抄了许多份，发到各处绿洲。一笔一画抄得工整，谁也不许偷懒。有那识字的，得了书便念给不识字的听。这书一多，规矩便传开了。"
 SUM_Neo_SDH.139.t:"抄书坊"
 SUM_Neo_SDH.139.d:"共律与宪章立成之后，光放在议事厅里可不行，得叫各处绿洲的人都知晓。于是开了一处抄书坊，专管抄书。抄书坊里聘了不少抄手，一个个伏案执笔，把共律、宪章抄了许多份。原来此地印书未广，全靠手抄。抄手们一字一句地誊，抄完一份便校对一遍，生怕错了字误导百姓。抄好的册子，装订成册，一批批发往各处绿洲，张贴的张贴，收藏的收藏。有个年轻抄手，连抄了几个月，手腕都酸了，却字字认真，说这书是要传给后人看的，马虎不得。纸用的是本地的薄羊皮，墨是松烟和胶调的，写上去经得住风沙。抄好的册子，还拿油布包了三层，怕路上潮气坏了字。发到各处之后，当地人又照着样子再抄，不多时，连小绿洲都有了抄本。"
 SUM_Neo_SDH.139.a:"把遗迹挖开"
 SUM_Neo_SDH.139.b:"把遗迹封回去"
 SUM_SDH_RC_Home_Guard:"乡兵"
 SUM_SDH_RC_Home_Guard_desc:"各处绿洲，各出一班丁壮，组成乡兵。平时扛锄头种地，战时提刀枪集合，召之即来。有那农忙时误了地的，也不用怕，众人都替他照看。这兵农合一，端的实惠。"
 SUM_Neo_SDH.140.t:"乡兵"
 SUM_Neo_SDH.140.d:"绿洲要自保，不能没有兵。可养一支常备军，花费太大，负担不起。于是想了个两全的法子：各处绿洲出丁，组成乡兵。这些乡兵，平时放下刀枪便是农夫，扛着锄头下地干活；一旦有事，号令一响，便撂下农具，聚集到一处，拿起兵器便是兵。这法子妙在不误农时，又不缺兵源。农忙时人人都在田里，农闲时便集中操练，习习武艺。头一回集合，号角一吹，各处乡兵扛着各自的家伙赶来，有拿长矛的，有背弓箭的，虽然装束不齐，精神却抖擞。乡兵的兵器，多半是自家打的，长枪削自沙枣木，箭头淬了毒，弓弦用骆驼筋拧成。每逢农闲，便在空地上列队操练，号手一吹，进退有度。有那手脚笨拙的，回家后对着月亮也比划几下，不肯落在人后。"
 SUM_Neo_SDH.140.a:"重立赤王的旧制"
 SUM_Neo_SDH.140.b:"重建城邦的议会"
 SUM_SDH_RC_Watch_Oasis:"望楼"
 SUM_SDH_RC_Watch_Oasis_desc:"绿洲外缘，立起一座座望楼。白天举旗，夜里举火，一处传一处，消息比快马还快。有一回沙暴来袭，望楼一举旗，各处都早早备下了。这望楼端的救命。"
 SUM_Neo_SDH.141.t:"望楼"
 SUM_Neo_SDH.141.d:"沙漠辽阔，一处有警，别处如何得知？靠人跑马报信，终究太慢。于是哈德拉玛维特在绿洲外缘，一座座立起望楼。望楼上日夜有人值守，白天举旗，夜里举火，一处举了，别处望见，也跟着举，就这样一座传一座。这法子端的神速，消息传得比马还快。有一回，远处一队散骑来犯，头一座望楼的守卫望见尘头，当即举旗，接连几座望楼依次响应，眨眼间警讯便传遍各处，各乡兵迅速集结，来犯的见势不妙，掉头就跑。守楼的兵丁，冬天冻得手脚发麻，夏天晒得汗流浃背，却从不敢擅离。望楼都建在高处，四面无遮拦，守楼的人日晒雨淋，眼睛却练得极尖，远处一缕尘烟，便能辨出是人还是兽。夜里举火用的柴草，也早早备足，堆在楼角，防潮防湿，一点就着。"
 SUM_Neo_SDH.141.a:"召集能战之众"
 SUM_Neo_SDH.141.b:"召集能谋之士"
 SUM_SDH_RC_Wall_Low:"挡沙墙"
 SUM_SDH_RC_Wall_Low_desc:"沿绿洲垒起一道低墙，不很高，却结实。挡得住流沙，也挡得住散骑。有那小股匪徒来犯，到了墙下便爬不上来。这墙虽矮，端的管用。"
 SUM_Neo_SDH.142.t:"挡沙墙"
 SUM_Neo_SDH.142.d:"绿洲边缘，一头有流沙侵袭，一头有散骑骚扰，两头受气。于是沿绿洲垒起一道低墙。这墙不高，却结实，用的都是当地烧的砖，掺了沙石，风吹日晒也不易塌。原来流沙被墙一挡，便堆在墙外，慢慢清便是；散骑马队冲过来，撞上这道墙，也越不过去，只能干瞪眼。墙内侧还挖了壕沟，一旦有人来犯，乡兵便据墙而守，居高临下。筑墙那些日子，绿洲的人一齐上阵，有的和泥，有的搬砖，有的砌墙，热火朝天。没几个月，一道低墙便蜿蜒绕绿洲一周。这低墙虽挡得住散骑，却挡不住人心。绿洲的人轮流上墙守望，白日里扛着锄头下地，夜里便拎着长矛上墙。墙头上还备着滚石与滚木，一旦有警，便一齐往下砸。散骑探得这墙坚固，从此绕道而行，不敢再近。"
 SUM_Neo_SDH.142.a:"以神权号令沙漠"
 SUM_Neo_SDH.142.b:"以律法约束诸城"
 SUM_SDH_RC_Road_Patrol:"护商队"
 SUM_SDH_RC_Road_Patrol_desc:"护商队，专在盐路上巡。遇了劫匪便追，追上了就地处置，决不宽纵。商队见了他们，胆气便壮。这护商队端的靠得住。商队见了他，便如吃了定心丸。"
 SUM_Neo_SDH.143.t:"护商队"
 SUM_Neo_SDH.143.d:"盐路是哈德拉玛维特的命脉，盐运不出去，百姓便没盐吃。可盐路上常有强人出没，拦路抢劫。为此特地设了护商队，专管巡护盐路。这些护商队的人，个个是精挑的壮士，骑着快马，携着利刃，或明或暗地跟着商队。护商队有令：遇劫则追，追到手就地处置，不必押回城里。这一条可是了得，强人往日抢完就跑，以为追不着，如今护商队紧追不舍，抓住便就地处治，没几天，盐路上的匪患便敛了。有一回，一伙强人拦抢盐车，护商队恰好赶到，追出十几里，尽数拿获。商队自此安心，盐路畅通。有一回追一伙匪徒，追了整整一夜，天亮时在沙丘后头把人拿住，绳子捆了，一排儿押回。盐路上的商队见了护商队的旗号，远远便吆喝一声致谢。"
 SUM_Neo_SDH.143.a:"把遗迹挖开"
 SUM_Neo_SDH.143.b:"把遗迹封回去"
 SUM_SDH_RC_Peace_Order:"治安署"
 SUM_SDH_RC_Peace_Order_desc:"治安署，用的都是本处人，知根知底。管的是偷盗抢劫这类事，至于谁议论了什么，一概不管。有那爱说闲话的，反倒自在。这治安署端的识趣。"
 SUM_Neo_SDH.144.t:"治安署"
 SUM_Neo_SDH.144.d:"地方要安宁，少不了维持治安的人。哈德拉玛维特设了治安署，里头的差役，都由本处人充任。为何用本处人？原来本处人熟门熟路，谁家是好人，谁家是歹人，一清二楚，办事便不易出错。这治安署管得也有分寸：只管偷盗抢劫这类事，至于谁议论了什么、说了哪些话，一概不管。为何不管议论？原来当权者明白，防民之口甚于防川，管得住手脚，管不住人心。有一回，几个后生聚在茶摊上议论时政，声音不小，治安的差役路过，听了也不过问，只管盯着有没有人偷东西。百姓于是知道，这衙门是真替地方办事的。有一回，两个后生为了一句闲话争得面红耳赤，闹到治安署，差役听了原委，只劝了两句，便放他们回去，连个像样的罪名都没有。"
 SUM_Neo_SDH.144.a:"重立赤王的旧制"
 SUM_Neo_SDH.144.b:"重建城邦的议会"
 SUM_SDH_RC_Karez_Oasis:"坎儿井"
 SUM_SDH_RC_Karez_Oasis_desc:"坡地上，开了一道坎儿井，把地下水引出来浇田。有了水，田里便能多种一季，收成凭空多出许多。这坎儿井端的巧妙。有人算了算，这一年多打的粮，够吃到来年。"
 SUM_Neo_SDH.145.t:"坎儿井"
 SUM_Neo_SDH.145.d:"哈德拉玛维特的坡地，缺水灌溉，一年只能种一季，收成微薄。后来有人想出法子，在坡地上开坎儿井。这坎儿井的妙处，在于顺着地势挖暗渠，把山里的地下水引出来，一路引到田里，沿途不见明水，蒸发便少。这可是沙漠里的智慧。挖坎儿井不易，要先探明水源，再一段段挖竖井、掏暗渠，工程量不小。绿洲的人一齐动手，挖了整整一冬，渠终于通了。清泉顺着暗渠汩汩流到田里，干渴的坡地喝饱了水。自此一年能种两季，收成翻了一番。老农蹲在田埂上，看着渠水流过，笑得合不拢嘴。挖井的工匠在井下点着油灯，一锹一锹地掏，土是从竖井一桶桶吊上来的。水通了那天，渠水流过干裂的田，土块滋滋地吸水，绿意没几天便冒了出来。"
 SUM_Neo_SDH.145.a:"召集能战之众"
 SUM_Neo_SDH.145.b:"召集能谋之士"
 SUM_SDH_RC_Terrace:"梯田"
 SUM_SDH_RC_Terrace_desc:"坡地，开成一层层梯田。种的是耐旱的粮，不用多少水，也能有收成。远远望去，一级一级，像梯子搭到山上。这梯田端的会过日子。山洪来时，也不至于冲了田。"
 SUM_Neo_SDH.146.t:"梯田"
 SUM_Neo_SDH.146.d:"坡地缺水，还有一桩难处，便是水土易流失。一下雨，水顺着坡哗哗流走，连土也冲跑了。于是人们把坡地开成梯田。一层一层，顺着山势修上去，每层都平平的，像台阶一般，水便一层层存住，不再白白流走。这梯田修起来费工夫，得垒埂、平整、引水，一亩亩地拾掇。修好之后，种上耐旱的粮，谷子、高粱之类，不挑地，也省水。到了秋天，一层层梯田里金黄一片，沉甸甸的谷穗压弯了腰。先前这坡地荒着，如今成了米粮川。有个老农说，地是好地，就看人肯不肯下功夫。修梯田时，先在坡上划出一道道横线，顺线垒起石埂，再把高处的土刨下来填低处，一层层找平。引水渠也从山顶一级级接下来，水顺着台阶缓缓流，浇透一层，再溢到下一层。"
 SUM_Neo_SDH.146.a:"以神权号令沙漠"
 SUM_Neo_SDH.146.b:"以律法约束诸城"
 SUM_SDH_RC_Date_Grove:"枣椰林"
 SUM_SDH_RC_Date_Grove_desc:"沿渠两岸，遍植枣椰。三年光景，便长成林，绿油油一片。结下的果子按户分，家家有份。这枣椰树，端的浑身是宝。孩子爬上树，挑最甜的一个往下扔。"
 SUM_Neo_SDH.147.t:"枣椰林"
 SUM_Neo_SDH.147.d:"水渠修成之后，渠边那一带空地，白白荒着可惜。有人提议，沿渠遍植枣椰。这枣椰树耐旱，根扎得深，正好沿渠生长，又能固住水土。种下去容易，长成却需时日。头三年，小树苗弱不禁风，得精心照料，浇水、培土、防风沙。绿洲的人轮流照看，犹如照料自家的孩子。三年一过，枣椰树渐渐成林，绿荫沿渠一路铺开，沙漠里平添一道绿廊。到了结果的时候，一串串枣子垂满枝头，甜得很。收下的果实，按户分给各家，人人有份。孩子们爬不上树，就在树下捡熟透落下的，吃得满嘴是甜。那枣椰林长成之后，不只结果，还挡住了风沙。从前风一起，黄沙便扑进绿洲，如今有了这道绿墙，沙势便缓了许多。"
 SUM_Neo_SDH.147.a:"把遗迹挖开"
 SUM_Neo_SDH.147.b:"把遗迹封回去"
 SUM_SDH_RC_Rotation:"轮牧"
 SUM_SDH_RC_Rotation_desc:"草场，分作几片，轮着放牧。哪片放到几时，写在木牌上，插在草场边，谁也不许乱来。草有歇的时候，便养得肥。这轮牧端的懂养地。"
 SUM_Neo_SDH.148.t:"轮牧"
 SUM_Neo_SDH.148.d:"放牧也有讲究。草场若不分片，一群羊今天这片、明天那片，啃来啃去，草根都啃绝了，草场迟早荒废。于是哈德拉玛维特把草场分片，实行轮牧。哪一片这个月放，哪一片下月放，轮流着来，让草有休养生息的时候。为免混乱，还特地在每片草场立了木牌，把放牧的日子写在牌子上，哪一组人哪天来放，一目了然。牧人看了木牌，便知该往何处赶羊，再不用你争我抢。有一回，两家牧人为争一片草场吵了起来，管事的把木牌一举，上头写得明明白白，两家顿时没话说。此后草场恢复得很好，牛羊也肥壮。每片草场的木牌上，还写着这片草该放几只羊，多一只也不许。日子久了，草场果然养得丰茂，牛羊吃了也好，产的奶格外足。"
 SUM_Neo_SDH.148.a:"重立赤王的旧制"
 SUM_Neo_SDH.148.b:"重建城邦的议会"
 SUM_SDH_RC_Public_Granary:"公仓"
 SUM_SDH_RC_Public_Granary_desc:"丰年时，把粮收进公仓；荒年时，开仓平价粜出。存的不只是粮，更是众人的底气。有一年大旱，全靠这仓粮稳住了人心。这公仓端的救命。"
 SUM_Neo_SDH.149.t:"公仓"
 SUM_Neo_SDH.149.d:"天有不测风云，年景有好有坏。丰年粮食多，吃不完，烂在田里可惜；荒年粮食少，饿肚子，又没处借。于是哈德拉玛维特定下规矩：丰年把多余的粮收进公仓存着，荒年便开仓平粜，按平价卖给百姓，稳定粮价。这公仓里存的，何止是粮，存的是百姓的活命根子，是人心。有一年大旱，颗粒无收，别处粮价飞涨，饿殍遍野，哈德拉玛维特却开仓放粮，百姓得以安稳度过。公仓的钥匙，由几处公推的人共同掌管，谁也别想私自开仓。看仓的老头，日日翻晒粮食，生怕霉变。公仓还立了册子，进出都有账，一笔一笔记着。管仓的人轮换着值守，交接时当着众人的面盘点，一粒粮也短不得。荒年开仓那几日，领粮的队伍排得老长，人人脸上都有喜色。"
 SUM_Neo_SDH.149.a:"召集能战之众"
 SUM_Neo_SDH.149.b:"召集能谋之士"
 SUM_SDH_RC_Neutral_Pact:"中立之约"
 SUM_SDH_RC_Neutral_Pact_desc:"与四邻立下条约：绿洲不结盟，不驻外兵，也不供粮给打仗的人。三条约得明明白白，谁也不许破。有那来游说的，看了条约，也只得回去。这中立端的难得。"
 SUM_Neo_SDH.150.t:"中立之约"
 SUM_Neo_SDH.150.d:"身处沙漠，四邻环伺，一个不慎便卷入战祸。哈德拉玛维特为求自保，与四邻立下盟约，写明三条：一不结盟，不加入任何一方阵营；二不驻外兵，不许别国军队踏进绿洲；三不供粮于战，无论谁打仗，都不卖粮给交战的一方。这三条可是立身之本。不结盟，便不得罪任何一方；不驻兵，便保住自家的安稳；不供粮，便不卷入别人的争斗。签约那天，四邻的使节都到了，条款一条条念过，各方画押。自这约一立，哈德拉玛维特果然安稳了许多年，四邻虽时有争斗，却都绕着它走。后来邻邦之间果然打了几仗，可谁也没来借道，更没人来绿洲征粮。哈德拉玛维特的人远远望着别处的烽烟，依旧低头种自己的田，倒也落个清净。"
 SUM_Neo_SDH.150.a:"以神权号令沙漠"
 SUM_Neo_SDH.150.b:"以律法约束诸城"
 SUM_SDH_RC_Trade_Treaty:"通商之约"
 SUM_SDH_RC_Trade_Treaty_desc:"与外邦通商，先立下条约。约里写清了税则，也写明如何保护侨民。两下里签字画押，各执一份。这约立得周全，端的少了扯皮。有那违约的，照约罚银。"
 SUM_Neo_SDH.151.t:"通商之约"
 SUM_Neo_SDH.151.d:"做生意，光有心意不够，还得有约在先。哈德拉玛维特与外邦通商，必先立下商约。约里写得清清楚楚：税则如何收，货如何过境，本国侨民在外邦如何得到保护，外邦商人来此又如何对待，一条一款，巨细无遗。为何要把护侨写进约里？原来在外经商的侨民，最怕的便是出了事没人管，受了欺负无处申诉。约里写明护侨，便是给在外的人吃了颗定心丸。有一回，一个在外邦经商的哈德拉玛维特商人被人欺负，当地官府按商约办了事，商人得以平安。消息传回，众人皆说这商约立得值。商约还写明，货过边境不得滞留，关税只收一回。有一回，一批香料过境，关卡想多收一道钱，商人把商约往桌上一摆，关卡的人翻了翻，只得放行。自此商旅往来，越发顺畅。"
 SUM_Neo_SDH.151.a:"把遗迹挖开"
 SUM_Neo_SDH.151.b:"把遗迹封回去"
 SUM_SDH_RC_Border_Talk:"边界磋商"
 SUM_SDH_RC_Border_Talk_desc:"边界一事，与邻邦一里一里地谈。谈得拢的便定下来，谈不拢的先搁着，谁也不许动粗。有那性急的，也被按住。这慢慢谈，端的省了刀兵。"
 SUM_Neo_SDH.152.t:"边界磋商"
 SUM_Neo_SDH.152.d:"边界之事，最易伤和气。两下里都说这块地是自己的，争来争去，往往就动了刀兵。哈德拉玛维特却有个法子：与邻邦谈边界，不急不躁，一里一里地谈。这一段谈得拢，便定下来；那一段谈不拢，便先搁着，不争那一时之气。这法子看似软弱，实则高明。急着争，争来的是战火；慢慢谈，谈来的是安稳。谈得拢的地方，便立碑为界，两家都认；谈不拢的地方，暂时空着，谁也别去越界生事，留待日后慢慢再谈。有几处争议之地，竟搁了数年，后来时机成熟，再一谈便成了。谈边界的那些日子，双方各带一卷旧图，摊在桌上指指点点。这张图说界碑在这里，那张图说界河在那里，争到激烈处，几乎要拍案而起。可一想起动刀兵的代价，又都耐下性子，慢慢再谈。"
 SUM_Neo_SDH.152.a:"重立赤王的旧制"
 SUM_Neo_SDH.152.b:"重建城邦的议会"
 SUM_SDH_RC_Keep_Old:"旧例照行"
 SUM_SDH_RC_Keep_Old_desc:"主母传下的旧例，能留的都留着，只是上面再加一层公议。改得慢些，倒不容易翻车。有那急着全盘改的，被长老拦住了。这慢改端的稳当。"
 SUM_Neo_SDH.153.t:"旧例照行"
 SUM_Neo_SDH.153.d:"改革这事，最忌激进。哈德拉玛维特的主母传下许多旧例，有的合时宜，有的不合。当权者却不一概废除，能留的都留，只是在旧例之上，再加一层公议的过场。原来旧例用惯了，百姓熟知，一旦全盘推翻，人心惶惶，事情反而办砸。如今慢慢来，旧的照旧行着，只多一道公议的手续，让你我都能参与意见。这般改法，看着慢，实则稳。有一回，有人主张一下子废掉所有旧例，老成持重的人连连摇头，说改得慢才不容易翻车，若是急了，翻了车连退路都没有。众人听了，都觉有理。这么一层层改下来，旧例去了大半，新规立了七七八八，百姓却浑然不觉，只道日子照旧过。这正是高明处：不动声色之间，把天大的事办妥了。"
 SUM_Neo_SDH.153.a:"召集能战之众"
 SUM_Neo_SDH.153.b:"召集能谋之士"
 SUM_SDH_RC_Quiet_Grow:"守成"
 SUM_SDH_RC_Quiet_Grow_desc:"不折腾，也不扩张，只把眼下的日子过稳。沙漠里风大浪大，最难得的就是一个稳字。有那想冒险的，也被劝住了。这守成端的也是本事。不贪大，不求快。"
 SUM_Neo_SDH.154.t:"守成"
 SUM_Neo_SDH.154.d:"哈德拉玛维特几经波折，终于悟出一个道理：不折腾，不扩张，把眼下的日子过稳，才是最要紧的。这道理看似平常，却是拿血泪换来的。先前穷兵黩武，折腾得民困财竭；后来又争强好胜，险些卷入大战。如今痛定思痛，只求一个稳字。田照种，市照开，日子一天天过，不求惊天动地，但求百姓安居乐业。沙漠里头，风沙无常，战祸频仍，最难得的就是一个稳。有一年，四邻打得不可开交，哈德拉玛维特却稳如泰山，百姓照常耕作经商，别的绿洲的人纷纷逃来避难。邻邦的使节来过几回，劝他们趁势扩张，占地称王，哈德拉玛维特的人只是摇头。他们说，地盘大不算本事，日子稳才是真章。使节无奈，只好回去复命。"
 SUM_Neo_SDH.154.a:"以神权号令沙漠"
 SUM_Neo_SDH.154.b:"以律法约束诸城"
 SUM_SDH_RC_Oasis_Democracy:"绿洲自治既成"
 SUM_SDH_RC_Oasis_Democracy_desc:"哈德拉玛维特的几处绿洲，各立宪章。代表按月议事，法官按季巡判，盐与水的账都贴在碑上。主母的厅改成陈情处，谁有话说，推门便进。这般章程，端的把权力摊在了明处。"
 SUM_Neo_SDH.155.t:"绿洲自治既成"
 SUM_Neo_SDH.155.d:"哈德拉玛维特几处绿洲，如今是另一番光景。各处都立了宪章，白纸黑字明明白白；代表按月聚到一处议事，议完各回各家；法官按季巡行各处，就地审案；盐与水的账目，一笔一笔贴在城门的石碑上，谁都能看。更有一样，旧日主母的厅，如今改成了陈情处，谁有话说，推门便进，不必通报，不必等候。这一处处改动，合起来便是第三条路的模样。有一日，一个外地来的旅人走进陈情处，见里头有人递状子，有人喝茶闲坐，全无往日衙门的森严，不由得啧啧称奇。这般光景，是一步步熬出来的。想当年主母独断，一人说了算，如今凡事都要公议，陈情处里什么话都能说。老人们偶尔提起旧日，也不过是摇摇头，接着低头喝自己的茶。"
 SUM_Neo_SDH.155.a:"把遗迹挖开"
 SUM_Neo_SDH.155.b:"把遗迹封回去"
 SUM_SDH_RC_Old_Order:"沙地守成"
 SUM_SDH_RC_Old_Order_desc:"哈德拉玛维特与雨林，重划了账：贡赋减了，戍兵撤了，地界却不动。主母的规矩照旧，只多一层公议的过场。日子比起前几年，着实安稳了些。这等结果，端的难得。"
 SUM_Neo_SDH.156.t:"沙地守成"
 SUM_Neo_SDH.156.d:"哈德拉玛维特与雨林之间，旧有许多账目纠缠。如今天平重划：贡赋减了，戍兵撤了，地界却一动不动。原来打的这一场仗，双方都疲惫不堪，与其继续厮杀，不如各退一步。贡赋减少，沙漠的负担轻了；戍兵撤回，边境的紧张松了；地界不动，双方面子都保住了。主母传下的规矩依旧照旧行着，只是多了一层要经公议的过场，凡事大家商量着来。日子过得，比起前几年安稳多了。有一回，雨林的使节来访，见到边境的戍兵果然撤了，回去一说，两边自此相安。重划之后，边界的界碑重新立过，两边的人均可自由往来，贩盐的、放羊的，各走各的路，再不似从前那般剑拔弩张。"
 SUM_Neo_SDH.156.a:"重立赤王的旧制"
 SUM_Neo_SDH.156.b:"重建城邦的议会"

 #### 开战须弥 · 雨林的门 ####
 SUM_SDH_WAR_The_Storm_Rises:"风起东向"
 SUM_SDH_WAR_The_Storm_Rises_desc:"哈德拉玛维特的粮、盐与商路，多半还攥在雨林手里。撕了敕令，不过是名义上的事。要真把雨林从账本上划掉，还得动兵。纸上的账，到底要靠刀来清。"
 SUM_Neo_SDH.157.t:"风起东向"
 SUM_Neo_SDH.157.d:"账面上，哈德拉玛维特似乎已经独立，可事情没那么简单。粮、盐与商路，这些命脉，多半还攥在雨林手里。所谓断了敕令，不过是名义上的事，纸面上划一道线罢了。真要把雨林从沙漠的账本上彻底划掉，还得动兵。原来这些年来，沙漠的盐要经雨林的地界外运，粮要靠雨林的商路输入，连铸钱的铜铁也要从雨林来。名义上独立了，实际上处处受制。有明白人在议事厅里拍着桌子说，这独立是假的，若不打通商路、夺回盐粮，终究是人家掌心的棋子。众人听了，默然半晌。这番话，说得众人心里发凉。原来名义上的独立，不过是换了一块招牌，里头的骨头，还连在人家的身上。有人私下叹道，这场恶战躲不过。"
 SUM_Neo_SDH.157.a:"以动员令起兵"
 SUM_Neo_SDH.157.b:"以盟约召集部族"
 SUM_SDH_WAR_Call_All:"召集各部"
 SUM_SDH_WAR_Call_All_desc:"召集令传遍各部，来的人比估的还多。带的兵器五花八门，有刀有枪，有弓有梭，可都听号令，叫东不往西。人心齐了，便是兵器杂些，也不打紧。"
 SUM_Neo_SDH.158.t:"召集各部"
 SUM_Neo_SDH.158.d:"哈德拉玛维特一旦决意动兵，召集令便传遍各部。传令的骑手快马加鞭，把号令送到每一处绿洲、每一个部落。原先估摸着一个数，谁知来的人比估的还多出许多。各部的人扛着自家的兵器赶来，有长矛，有弯刀，有弓箭，有狼牙棒，五花八门，样样都有。虽然装束各异，兵器不一，可有一点相同：都听号令。号手一吹，各路人马依令列队，进退有序，没有一人抢先，也没有一人落后。领兵的看了，心中大喜，说人心齐，泰山移，有此军何愁不胜。有个老兵拍着胸脯说，这回定要叫雨林知道沙漠的厉害。号手吹得腮帮子发酸，换了三个人接着吹，号声一停，队伍便原地不动，只等下一声。自始至终，没有一个人喧哗，端的训练有素。"
 SUM_Neo_SDH.158.a:"直取雨林关隘"
 SUM_Neo_SDH.158.b:"先断其商路"
 SUM_SDH_WAR_War_Fund:"征军费"
 SUM_SDH_WAR_War_Fund_desc:"军费，盐路出一半，商户出一半，两下凑齐。出钱的人日日打听消息，只等着打赢。这钱花出去，端的都指望着胜利。打赢了，这钱才算没白花，打输了，可就都打了水漂。"
 SUM_Neo_SDH.159.t:"征军费"
 SUM_Neo_SDH.159.d:"打仗打的是钱粮。哈德拉玛维特要动兵，军费从何而来？当权者想了个法子：盐路出一半，商户出一半，两家凑出这笔军费。这法子也有讲究。盐路是公家的，出一半是理所应当；商户得利最多，出一半也是应该。两边都掏了钱，便都盼着打赢，因为打赢了，盐路畅通，买卖兴旺，出的钱便能连本带利赚回来。当下算盘一响，一笔笔钱粮凑齐，银钱堆得像小山。有个商户一边掏钱一边心疼，却也咬牙认了，说这钱花得值，只要打赢，日后有的是赚头。管钱粮的官儿，把两笔银钱当面点清，一块儿封进箱子里，贴上封条，写明数目。商户掏钱时手直打颤，却也咬着牙按了手印。旁人看了，都说这钱出得痛快，为的是日后不受人欺。"
 SUM_Neo_SDH.159.a:"把话说给雨林人听"
 SUM_Neo_SDH.159.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Ration:"配给"
 SUM_SDH_WAR_Ration_desc:"粮与盐，按人口配给，先紧着军中，再顾百姓。配给的规矩贴在门外，谁多谁少，一目了然，谁也不许多拿。这般分配，端的少了争执。"
 SUM_Neo_SDH.160.t:"配给"
 SUM_Neo_SDH.160.d:"大军未动，粮草先行。哈德拉玛维特把粮与盐按人口配给，先尽着军中，再轮到百姓。这配给的规矩，还特地写在告示上，贴在门外，叫人人都看得见。原来战时物资紧缺，若分配不公，军民都要生怨。如今把规矩贴在明处，谁该得多少，一目了然，想闹也闹不起来。每日里，领粮的队伍排得老长，有兵丁，有百姓，各按各的份，依次领取。管发的照册子唱名，一份份发出去，分毫不差。有个妇人领了自家的那份，看了看，又看了看墙上的告示，叹了口气，却也没话可说。告示写得斗大，不识字的也能听人念明白。有那家口多的，领了一份还不够，站在队伍里直叹气，管发的照章办事，多一粒也不肯给。众人虽然心里叫苦，却也知道规矩摆在那儿，怨不得旁人。"
 SUM_Neo_SDH.160.a:"倾全境之力"
 SUM_Neo_SDH.160.b:"留一支后手"
 SUM_SDH_WAR_War_Council:"定三路"
 SUM_SDH_WAR_War_Council_desc:"军议定了三路进兵：一路沿盐路走，一路穿沙地过，还有一路绕着绿洲行。三路人马分头而去，约好日期会合。这分兵之法，端的周全。"
 SUM_Neo_SDH.161.t:"定三路"
 SUM_Neo_SDH.161.d:"行军打仗，最讲究个方略。哈德拉玛维特的将军们聚在帐中，摊开地图，军议了三日三夜，终于定下三路进兵之计。一路沿盐路而行，稳扎稳打，保障粮草补给；一路穿沙地直插，出敌不意，打他个措手不及；一路绕绿洲而行，看似迂回，实则是断敌后路。三路各有分工，又互相呼应，端的周密。定下计策那日，帐中灯火通明，将领们个个摩拳擦掌。主帅拿令箭一指，把三路人马分派停当，各领将令而去。有个年轻的偏将，头一回领兵，激动得一夜没合眼。三路兵马各领将令，分头准备。沿盐路的一路修桥铺路，备足粮草；穿沙地的一路轻装疾行；绕绿洲的一路悄悄探路，摸清敌哨。各路人马都憋着一股劲，只等主帅一声令下。"
 SUM_Neo_SDH.161.a:"以动员令起兵"
 SUM_Neo_SDH.161.b:"以盟约召集部族"
 SUM_SDH_WAR_Proclaim:"讨雨林檄"
 SUM_SDH_WAR_Proclaim_desc:"檄文，写的尽是账：欠了多少水，占了哪块地，多收了几成税，一条一条列得清楚。念给众人听，听的人无不咬牙。这檄文端的厉害。有那听惯了官样文章的，这回倒真动了气。"
 SUM_Neo_SDH.162.t:"讨雨林檄"
 SUM_Neo_SDH.162.d:"师出有名，自古皆然。哈德拉玛维特起兵之前，先写了一篇檄文，昭告天下。这檄文不写别的，专写一本账：雨林欠沙漠多少水，占了多少地，多收了多少税，一条一条，列得清清楚楚。原来要与雨林开战，总得有个说法，这说法便是账。欠债还钱，天经地义，把账摆出来，师出便有名，天下人看了，也知道谁是谁非。檄文写成，抄了许多份，到处张贴，还派人送到雨林去。有人说这檄文写得淋漓尽致，把多年的委屈一股脑倾诉出来；雨林那边看了，却冷笑一声，说这都是陈年旧账。檄文送到雨林，那边看了只冷笑，说旧账早算不清，翻出来不过是要借口。可沙漠这边，人人读着檄文，都觉句句说在心坎上，士气为之一振。"
 SUM_Neo_SDH.162.a:"直取雨林关隘"
 SUM_Neo_SDH.162.b:"先断其商路"
 SUM_SDH_WAR_Night_Wind:"借风夜行"
 SUM_SDH_WAR_Night_Wind_desc:"大军按兵不动，专等风起。风一起，天地昏黄，人和影子都辨不清，正好掩人耳目。三军趁着风声，悄悄向前推进。这等用兵，端的狡猾。"
 SUM_Neo_SDH.163.t:"借风夜行"
 SUM_Neo_SDH.163.d:"哈德拉玛维特的大军，列阵已毕，却不急着开拔，单等一样东西：风。原来沙漠里作战，风是天然的屏障。风一起，黄沙漫天，飞沙走石，人影都辨不清，敌军看不清我军的虚实，我军却可借风掩护，悄然逼近。主帅很有耐性，日日登高望风，猛将们急得摩拳擦掌，他却按住不动，说时机未到。终于有一日，狂风大作，天昏地暗，沙墙高耸。主帅一声令下，大军借着风势，悄无声息地向前推进。风里辨不清人影，敌军果然毫无察觉。等到风停，我军已逼近敌阵，一击而中。主帅还说，风里作战，最忌心浮气躁，谁先动谁先乱。众将都记下了这话，按兵不动，任凭风沙扑面，眼睛也眨也不眨。待到风起，全军如箭离弦，直扑敌阵。"
 SUM_Neo_SDH.163.a:"把话说给雨林人听"
 SUM_Neo_SDH.163.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Star_Guide:"观星定向"
 SUM_SDH_WAR_Star_Guide_desc:"夜行军，靠天上的星斗定方向。星光一亮便走，星光一暗便停，停了就地卧倒，不许出声。这等纪律，端的严明。有一回星光全暗，大军便在沙里趴了一夜，直到天明。"
 SUM_Neo_SDH.164.t:"观星定向"
 SUM_Neo_SDH.164.d:"大军行军，白日有日头指路，夜里却靠什么？靠星。哈德拉玛维特的兵夜行，专看天上的星斗定向。北斗在哪边，队伍便往哪边走。这星象是老向导的本事，他们认得星辰，如同认得自家的门牌。可天气多变，乌云一来，星光便暗。星光亮时便走，星光一暗便停，这是死规矩。停了之后，全军就地卧倒，一动也不动，连大气也不敢出。为何要卧倒？原来夜里停驻，最怕暴露目标，卧倒便不易被远处望见。有一夜，星光忽然被云遮住，队伍立刻停下卧倒，果然探子来报，不远处有敌骑游弋，因我军卧倒不动，竟未被发觉。有一次星光太暗，向导索性趴在地上，借着微光辨认星辰，半晌才敢下令前行。"
 SUM_Neo_SDH.164.a:"倾全境之力"
 SUM_Neo_SDH.164.b:"留一支后手"
 SUM_SDH_WAR_Camel_Load:"驼队辎重"
 SUM_SDH_WAR_Camel_Load_desc:"辎重，全靠骆驼驮。驼比车强，能多熬几天干渴，走到无水之地，车早趴窝，驼还稳稳地走。沙漠里用驼，端的没错。所以沙漠里运粮，从不兴用车，那玩意在沙上走不动。"
 SUM_Neo_SDH.165.t:"驼队辎重"
 SUM_Neo_SDH.165.d:"大军远征，粮草辎重如何运送？哈德拉玛维特不用车，全靠骆驼。原来沙漠里行军，车有车的难处：轮子陷沙，寸步难行，还要饲料喂马。骆驼却不同，脚掌宽厚，踏沙不陷，最妙的是耐渴，体内能存水，比车马能多撑好几天的干渴。一支驼队驮着粮草，缓缓行进，驼铃叮当，走起来稳当得很。管辎重的官儿，日日清点骆驼，喂足草料，蹄子磨破了还得裹上布。有一回，队伍穿越一片无水地带，一连数日找不到水源，马匹都渴垮了，唯独骆驼昂首阔步，驮着辎重安然走过。众人方知这骆驼端的厉害。管辎重的官儿特意给骆驼钉了铁掌，免得蹄子被尖石割破。每到一个绿洲，先让骆驼饮足水才上路。"
 SUM_Neo_SDH.165.a:"以动员令起兵"
 SUM_Neo_SDH.165.b:"以盟约召集部族"
 SUM_SDH_WAR_Oasis_Leap:"沿绿洲跳进"
 SUM_SDH_WAR_Oasis_Leap_desc:"大军沿绿洲，一座一座往前跳。跳一步，补给便近一分，人马也养得更足。有那绿洲远的地方，宁可绕路，也不肯远离水。这跳法端的稳妥。"
 SUM_Neo_SDH.166.t:"沿绿洲跳进"
 SUM_Neo_SDH.166.d:"大军深入敌境，补给最难。哈德拉玛维特想出个法子：不贪多、不冒进，沿着绿洲一座一座地跳。打下一处绿洲，便以此为据，稍作休整，补充粮草，再跳向下一处。原来沙漠里作战，补给线拉得越长越危险。沿绿洲跳着走，跳一步，补给便近一分，粮草能就近接济，兵马也不致疲惫过度。每跳一处，便留下守军，经营一番，作为新的根基。主帅把这法子叫作步步为营。大军自西向东，一路跳去，先取近处的绿洲，再图远处的，稳扎稳打。有个将领嫌太慢，主帅却说，宁可慢些，也不可断了粮草，犯了兵家大忌。众人听了，皆以为然。"
 SUM_Neo_SDH.166.a:"直取雨林关隘"
 SUM_Neo_SDH.166.b:"先断其商路"
 SUM_SDH_WAR_Silent_Move:"无声行军"
 SUM_SDH_WAR_Silent_Move_desc:"全军练无声行军，铃铛一概摘了，马蹄也用布包上。走得再快，也听不见声响。有一回夜袭，守军直到刀架脖子才惊觉。这无声之法，端的吓人。"
 SUM_Neo_SDH.167.t:"无声行军"
 SUM_Neo_SDH.167.d:"哈德拉玛维特军中，主母传下一道军令：全军夜行，务要寂静无声。原来沙漠行军，全靠驼铃引路，叮当一响，十里之外都能听见。主母偏叫军士把铃铛尽数摘下，拿软布一层层裹严，又命人把马蹄驼蹄都用厚布包了，踏在沙上，只留下细沙簌簌的轻响。这一夜月色昏沉，万余兵马衔枚疾走，不见一盏灯火，不闻半句人声。有个新募的兵丁不懂规矩，坐骑受惊嘶鸣一声，立刻被身旁什长一把按住，低声呵斥，惊出一身冷汗。行出三十里，竟无人知晓这支兵马何时动的身。端的静得出奇，仿佛沙海自己长了腿。待到天色微明，人马在一处沙坳歇下，连咳嗽都捂着嘴，回头一望，来路已被风沙抹平，寻不出半点痕迹。"
 SUM_Neo_SDH.167.a:"把话说给雨林人听"
 SUM_Neo_SDH.167.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Storm_Keep:"强攻戍所"
 SUM_SDH_WAR_Storm_Keep_desc:"雨林伸进沙漠的戍所，头一个要拔掉。拔掉一处，沙漠人的脸面便松一分，腰杆也挺一分。有一处戍所被拔，附近的百姓都来围观。这戍所端的扎眼。"
 SUM_Neo_SDH.168.t:"强攻戍所"
 SUM_Neo_SDH.168.d:"哈德拉玛维特性子最恨雨林伸进沙地的一处处戍所。那些戍所像钉子，一根根钉在沙漠的皮肉上。主母升帐，对众将道：先拔戍所，拔掉一处，沙漠的脸面便松开一分。这戍所三面筑墙，一面靠水，守卒皆是雨林雇来的生兵。先锋官领了令，挑起精锐，趁夜摸到墙下，先断了水道，再架起云梯。墙上一声锣响，守卒慌作一团，有的弃了弓箭，有的翻墙便逃。不到半个时辰，旗就换了。先锋怕有埋伏，又命人举火把四下照看，确认无人，方才报捷。自此沙漠北进，一步一个脚印，端的势不可挡。有个守卒腿脚慢了些，被先登的兵一把揪住，按在地上捆了。先锋又命人沿着墙根搜索，唯恐暗处藏着弓手，直到把整座戍所翻了个遍，才放下心来。"
 SUM_Neo_SDH.168.a:"倾全境之力"
 SUM_Neo_SDH.168.b:"留一支后手"
 SUM_SDH_WAR_Siege_Rig:"造攻具"
 SUM_SDH_WAR_Siege_Rig_desc:"攻城的器具，照着遗迹里的图样造。样子笨重，推起来费劲，可戍所的墙厚，云梯不管用，还得靠这笨家伙。笨东西也有笨用处。众人不解，匠人说，墙厚就得笨办法。"
 SUM_Neo_SDH.169.t:"造攻具"
 SUM_Neo_SDH.169.d:"军中匠作营里，藏着几卷从古遗迹里拓下的图样。主母命工匠照样打造攻具，那物件身子笨重，推起来要二十人合力，士卒见了都笑，说这般蠢物怎生上阵。外人却不知，雨林戍所的墙都是夯土垒成，厚有三尺，云梯搭上去，一推便塌。那攻具名叫冲车，包着铁皮的木头撞上去，墙皮簌簌往下落。两名老匠蹲在车旁，一会儿敲敲楔子，一会儿抹油上轴，嘴里念叨：慢工出细活。头一回试车，轮子卡在沙里动弹不得，匠人又加了两条宽木，方才推得动。到了攻城那日，果然一撞一个窟窿。众军方才服气，先前笑的那几个，脸涨得通红。那老匠拍着车帮说，这物件看着粗笨，却是个稳当的，撞一回便塌一回，从不含糊。众军听了，方才把先前的讥笑收了起来。"
 SUM_Neo_SDH.169.a:"以动员令起兵"
 SUM_Neo_SDH.169.b:"以盟约召集部族"
 SUM_SDH_WAR_Cut_Canal:"掘渠"
 SUM_SDH_WAR_Cut_Canal_desc:"攻戍所，先掘它上游的渠。渠一断，守军守着水却打不上来，渴得没法子，军心先乱了。有一处戍所，就这么不攻自破。断水端的毒辣。"
 SUM_Neo_SDH.170.t:"掘渠"
 SUM_Neo_SDH.170.d:"雨林的戍所依水而立，上游一条渠，便是它的命脉。主母遣一支兵绕到渠首，趁月黑风高，挥锹掘断了渠。守军营里水井尚在，水却不能从渠里来，眼睁睁望着干涸的渠底，有水也汲不上。第二日天明，守卒渴得口干舌燥，争相到墙边张望，军心先乱了半边。那边的将官急得团团转，派人冒死出城寻水，刚爬出壕沟，便被埋伏的弓手射了回去。到了午后，城里竟有人提着水桶开了门投降。渠断水绝，端的比刀枪还厉害。主母用的就是这断水的毒计，不费一兵一卒，先叫他自己乱了阵脚。渠底裂开一道道缝隙，浑黄的水渗进沙里，转眼就不见了。守城的将官站在渠边，看着那条干沟，半晌说不出话来，知道这城是守不住了。"
 SUM_Neo_SDH.170.a:"直取雨林关隘"
 SUM_Neo_SDH.170.b:"先断其商路"
 SUM_SDH_WAR_Night_Wall:"夜攀"
 SUM_SDH_WAR_Night_Wall_desc:"攀墙，挑的是最灵便的人。攀上去的不到一半，摔下来的更不少，可墙上的灯却一盏盏灭了。这等苦差，端的拿命去换。底下的人托着，上面的人拽着，谁也不敢松手。"
 SUM_Neo_SDH.171.t:"夜攀"
 SUM_Neo_SDH.171.d:"攻城那一夜，将军挑了五十个最灵便的兵，专门攀墙。这些人都是爬惯了沙丘的好手，手脚如猿猴一般。那墙高有数丈，砖石缝里刚好容得下指尖。众人腰间系着绳，一个接一个往上攀。攀到半途，墙头守卒察觉，乱箭齐发，手上稍一松，便跌将下来。五十人攀上去的不到一半，余下的或死或伤，摔在墙根，哼声一片。正混乱间，墙上的灯忽然一盏盏灭了，原来是先上去的几个人摸到灯下，一刀割断了灯绳。黑暗里守卒慌作一团，那几个攀上去的便趁势站稳脚跟，拔出短刀，反守为攻。墙下随即架起云梯，未死的人顺着梯子往上爬，与守卒在墙头绞在一处，杀声与风声搅作一团。不多时，那面旗便被人扯下，换上了新的。"
 SUM_Neo_SDH.171.a:"把话说给雨林人听"
 SUM_Neo_SDH.171.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Keep_Pass:"据关而守"
 SUM_SDH_WAR_Keep_Pass_desc:"关隘一易手，立刻改成自家的戍所。城墙加高，门楼重修，门朝哪边开，如今由沙漠说了算。有一处关隘，昨日还挂着雨林的旗，今日便换了主人。"
 SUM_Neo_SDH.172.t:"据关而守"
 SUM_Neo_SDH.172.d:"关隘一经易手，哈德拉玛维特便不忙着追赶，先就地改起戍所来。原来打下的关卡，原是雨林的模样，门朝南边开着，如今归了沙漠，门便该朝北开。主母派匠人把旧的旗号扯下，换上花与沙丘的纹样，又把壕沟加深，墙头加厚。那关门的朝向，端的由沙漠说了算，再不由雨林置喙。有一个降卒看不惯，嘀咕了一句，被监工听见，当场打了二十军棍，从此无人敢再多嘴。没几日，一座关隘便改得铁桶也似，添了粮仓与水窖，成了沙漠北上的根基。匠人们还把城墙上的旧箭孔一一补平，又新筑了一圈女墙。完工那日，主母亲自登城看了一遍，点了点头，赏了众匠人几坛酒。众人谢恩而退，个个脸上都有光。"
 SUM_Neo_SDH.172.a:"倾全境之力"
 SUM_Neo_SDH.172.b:"留一支后手"
 SUM_SDH_WAR_Turn_Guard:"策反戍卒"
 SUM_SDH_WAR_Turn_Guard_desc:"雨林的戍卒，大半是雇来的佣兵。沙漠派去的人，不带刀，只问一句：你替谁当兵？问得那戍卒哑口无言。这攻心之法，端的厉害。有几个当场就扔了刀。"
 SUM_Neo_SDH.173.t:"策反戍卒"
 SUM_Neo_SDH.173.d:"雨林边上的戍卒，大半是花钱雇来的，并非本土的子弟。主母深谙此理，每打下一处，并不急着杀戮，只派一个能言善辩的人进去，也不带刀枪，只问一句：你替谁当兵？这一句话最是厉害。那些雇来的兵，本为几两银子卖命，谁真肯替雨林而死？被问的先是一怔，继而低头，有的当晚便开了城门。有一队守卒开头还嘴硬，待问到月饷欠了三个月，人人面上都露出怨色。不多时便有人缒城而下，前来投诚。主母一概不问旧事，愿留的编入队伍，愿走的发给口粮。端的攻心为上，攻城为下。那问话的人又趁热打铁，把雨林欠饷的旧账一桩桩抖出来，听得守卒们心头火起。当夜城门便开了，投诚的人一拨接着一拨。"
 SUM_Neo_SDH.173.a:"以动员令起兵"
 SUM_Neo_SDH.173.b:"以盟约召集部族"
 SUM_SDH_WAR_Village_Talk:"联络漠边村社"
 SUM_SDH_WAR_Village_Talk_desc:"雨林边的村社，也交着重税。派去的人不带兵器，只带一本账，把两下的税一比，村人便都明白了。这账本端的胜刀枪。村人听了，纷纷点头，说这账算得明白。"
 SUM_Neo_SDH.174.t:"联络漠边村社"
 SUM_Neo_SDH.174.d:"雨林边的村社交不起重税，一个个叫苦连天。主母闻知，并不派兵，只派了一个账房先生模样的人去，身上不带半件兵器，独独挟着一本账。那账本上记得明白：某村今年交粮几何，去年又添了几成，年年加码，逼得百姓卖儿卖女。那人到了村中，也不说打仗的话，只把账本一摊，逐条念给众人听。村民听了，个个咬牙切齿，纷纷诉苦。那人便道：若肯归附，减税三成，永不再加。又取出笔墨，当着众人的面在账上注了新数。一席话说得满堂踊跃，村社自此归了心。那人又当众立下字据，画了押，说明年若再加税，村社可持此据直诉主母。村民们头一回见官家这般讲理，一个个喜笑颜开，争着往后站，好把那账本看得更清楚。"
 SUM_Neo_SDH.174.a:"直取雨林关隘"
 SUM_Neo_SDH.174.b:"先断其商路"
 SUM_SDH_WAR_Amnesty:"宽赦"
 SUM_SDH_WAR_Amnesty_desc:"凡归降的，一概不问旧事。愿留下的，分给田地；愿走的，发给口粮，送他上路。有一批戍卒归降，当日便安顿妥当。这般宽待，端的收人心。"
 SUM_Neo_SDH.175.t:"宽赦"
 SUM_Neo_SDH.175.d:"主母治军，最重收服人心。凡有归降的，一概不问旧日罪过，端的宽宏大量。那些降卒最怕的就是清算旧账，没料到主母竟如此豁达，一个个感激涕零。愿留下的，便在沙地分给一块田地，叫他安心耕作，娶妻生子；愿走的，也不为难，发给几袋口粮，遣他回乡。有一名雨林旧将，先前据城死守，杀伤不少沙漠兵马，自忖必死，来时已将后事交代。谁想主母不但不杀，反赐他一份田宅。那人叩头流血，从此死心塌地，后来攻城时竟立了大功。消息一传开，各处守卒争相归降。主母又命人在受降的地方立了一块木牌，写明归附者免罪分田的章程，让往来的人都能看见。这一招端的灵验，没过半月，远近的守卒便拖家带口，络绎来投。"
 SUM_Neo_SDH.175.a:"把话说给雨林人听"
 SUM_Neo_SDH.175.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Buy_Clerk:"收买书吏"
 SUM_SDH_WAR_Buy_Clerk_desc:"关卡上的书吏，专管记档。银子递过去，那份档案便换了一份，想要什么名目就有什么名目。这其中的手脚，端的瞒不过明眼人。上头明明查得出，却偏偏装作不知。"
 SUM_Neo_SDH.176.t:"收买书吏"
 SUM_Neo_SDH.176.d:"关卡上头，全靠书吏一笔一笔记录往来人马与货物。主母瞧出这里的门道，暗暗差人携了银两，去打通那些书吏。那档册原是雨林的耳目，谁进谁出，记得清清楚楚。银子一递过去，书吏便换一份档册，把沙漠的兵马写成商队，把兵器写成铁器。上头查验，只见纸上一片太平，哪里知道底细。有一个清正的书吏不肯收钱，主母也不勉强，另寻一个贪心的顶上。没半年，沿线的档册都改了模样。那一支支兵马，便在这纸面上大摇大摆地过了关。有几回上头的巡查官亲自来看，翻遍档册，只见商队往来不绝，铁器食盐一应俱全，哪里看得出半点兵马调动的痕迹，只得点头放行。主母据此，把一支支兵马神不知鬼不觉地送过了关。"
 SUM_Neo_SDH.176.a:"倾全境之力"
 SUM_Neo_SDH.176.b:"留一支后手"
 SUM_SDH_WAR_False_News:"反间"
 SUM_SDH_WAR_False_News_desc:"假消息，故意透给雨林的斥候。斥候得了消息，欢欢喜喜回去，说给自己人听，全然不知是假。这借人之口，端的巧妙。雨林那边信以为真，白白调了兵。"
 SUM_Neo_SDH.177.t:"反间"
 SUM_Neo_SDH.177.d:"两军对峙，最要紧的是耳目。主母心生一计，故意把假消息透给雨林的斥候。那斥候得了消息，如获至宝，星夜赶回，一五一十说给自己人听。其实那消息半真半假：说沙漠的主攻在东边，其实兵马早悄悄移到西边；说粮草将尽，其实车队正沿盐路源源开来。雨林的将官信以为真，把重兵都调到东边，西边立时空虚。待到真攻一起，那里守卒寥寥，一触即溃。有几个斥候直到被俘，还道自己立了大功，端的被人卖了还帮人数钱。主母借敌人的嘴，骗敌人的兵，端的妙不可言。那斥候临走时还得了赏，欢天喜地地去了，哪里知道自己带回去的，原是人家编好的套。两下里一对照，雨林的败局早注定了。"
 SUM_Neo_SDH.177.a:"以动员令起兵"
 SUM_Neo_SDH.177.b:"以盟约召集部族"
 SUM_SDH_WAR_Supply:"辎重线"
 SUM_SDH_WAR_Supply_desc:"辎重，沿盐路铺开，一站接一站，像一条长蛇。前线吃什么，穿什么，全看这条线。线路一断，前方便要饿肚子。这补给线端的要紧。"
 SUM_Neo_SDH.178.t:"辎重线"
 SUM_Neo_SDH.178.d:"大军远征，粮草最是要命。主母把辎重沿盐路一路铺开，一站接一站，仿佛串起一条长蛇。那盐路本是商贾贩盐的旧道，沿途有绿洲，有水井，恰好做了歇脚的所在。每一站都屯着粮草，堆积如山，前军吃完了，后军立刻补上。前线将士吃的是什么，穿的是什么，端的全看这条线。有一回风沙埋了半段路，运粮队绕道走了三日，前线便断了顿，将士叫苦不迭。主母闻报，立刻调人清理沙障，重新打通，又添了几处备用的粮站。自此一路畅通，再无断粮之虞。每一站都派了专人看守，夜里点起火把，远远望去，盐路上像是一条火龙蜿蜒。后方的粮车一辆接一辆，昼夜兼程，谁也不敢耽搁，生怕误了前线的饭食。"
 SUM_Neo_SDH.178.a:"直取雨林关隘"
 SUM_Neo_SDH.178.b:"先断其商路"
 SUM_SDH_WAR_Water_Team:"运水"
 SUM_SDH_WAR_Water_Team_desc:"运水队，昼夜不停。车夫换了一班又一班，车子却不歇，夜里也借着星光赶路。这水比金子贵，端的耽误不得。车队走过的地方，地上都压出两道深辙。"
 SUM_Neo_SDH.179.t:"运水"
 SUM_Neo_SDH.179.d:"沙漠行军，水比金子还贵。主母特地组建运水队，昼夜不停，车轮滚滚。那水车沉重，一车能装数十桶，全靠健壮的驼马拖拽。车夫累得汗流浃背，主母便定下规矩：车夫可以换，车子却不许停。一批车夫歇下，另一批立刻接上，人歇车不歇。有的车夫连赶三天三夜，眼睛熬得通红，也不肯下车。有一辆车在半途坏了轮子，随行的匠人就地修补，片刻工夫便又上路，一滴水也没洒。就这样，前线的水一天也没断过。众军喝着清凉的水，打仗的力气便足了。绿洲边上还挖了蓄水池，运来的水先存进去，再一桶桶分给各营。管水的官儿拿着木牌，按人头发放，谁也休想多占一滴。有那渴急了想插队的，被众军一齐喝住，只得乖乖排到队尾。"
 SUM_Neo_SDH.179.a:"把话说给雨林人听"
 SUM_Neo_SDH.179.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Medic:"战地医帐"
 SUM_SDH_WAR_Medic_desc:"医帐随军而行。能就地治的，当场敷药包扎；治不了的，往后方的医馆送。有那伤重的，全靠这医帐救回一命。这随军的医者，端的难得。"
 SUM_Neo_SDH.180.t:"战地医帐"
 SUM_Neo_SDH.180.d:"军中厮杀，难免伤损。主母特设医帐随军而行，挑选懂得医理的人随侍左右。那医帐里头，刀伤用金疮药敷上，骨折用木板夹住，能就地治的，当场便治好了；伤得重的，便往后送，一程程转回绿洲的大营。有一名兵丁被流箭射穿了腿，血流不止，医官当下止血敷药，命人用担架抬着，一路往后送。不到十日，那人竟又能提刀上阵。医帐里终日药气弥漫，镊子、布条摆了一桌，医官忙得饭也顾不上吃。众军见医帐如此周到，打仗时胆气便壮了几分，知道便是伤了，也有个奔头。医帐外头插着一面白旗，伤兵远远望见，心里便踏实了。有那轻伤的，包扎完毕又提刀回了阵前，众军看了，无不感叹。端的这医帐，稳住了军心。"
 SUM_Neo_SDH.180.a:"倾全境之力"
 SUM_Neo_SDH.180.b:"留一支后手"
 SUM_SDH_WAR_Forge_Move:"随军匠坊"
 SUM_SDH_WAR_Forge_Move_desc:"铁作坊，跟着大军走。刀卷了刃，枪折了杆，缺什么便现造什么，不用往回送。这随军的铁匠，端的省心。匠人白天赶路，夜里支炉，火光映红了半边沙丘。"
 SUM_Neo_SDH.181.t:"随军匠坊"
 SUM_Neo_SDH.181.d:"军中兵器，最怕损坏了无处修补。主母便叫铁作坊随军而行，打造修补，一应俱全。那铁匠们背着风箱铁砧，走到哪里，炉火便生到哪里。前军砍卷了刀刃，拿来回炉重铸；折了枪杆，即刻削木配上。缺什么便造什么，端的方便。有一回攻城，云梯的铁钩断了数只，匠人连夜赶造，天明便送到阵前，一件事也没耽误。那炉火映着夜色，火星四溅，铁锤叮当，倒也成了一景。工匠们手上烫满了泡，却顾不得疼，只怕误了军中大事。众军见器物随手可得，无不安心。炉子昼夜不熄，铁匠们轮流守着，困了便靠在车辕上打个盹，醒了又抡起锤子。有人算过，这一路打出的刀枪，足足装备了一个营。端的功劳不小。"
 SUM_Neo_SDH.181.a:"以动员令起兵"
 SUM_Neo_SDH.181.b:"以盟约召集部族"
 SUM_SDH_WAR_Rear_Tax:"后方捐输"
 SUM_SDH_WAR_Rear_Tax_desc:"后方，照旧收捐输。出钱的人心里盼着，只要这一仗打赢，日后便能抵税。这捐输收得，端的也看战事胜负。这捐输收得人心甘，也收得人心焦，只盼早日凯旋。"
 SUM_Neo_SDH.182.t:"后方捐输"
 SUM_Neo_SDH.182.d:"大军在外厮杀，后方也没闲着。主母照旧征收捐输，凡是富户商贾，都要按例输将。原来他们打的算盘是：如今捐了钱粮，待打了胜仗，便可以拿这一点抵赋税，将来连本带利都捞回来。主母也乐得顺水推舟，明里许诺，暗地里把账记下。有一家大商户一口气捐了千担粮食，换得一张盖了印的凭据，捧在手里，仿佛捧着聚宝盆，逢人便夸。就这么着，前线的粮饷源源不断，后方的富户也眼巴巴等着分红。端的各取所需，皆大欢喜。那凭据上盖着朱红大印，写得明明白白，说是战后准抵三年赋税。富户们捧着它，夜间睡觉都揣在怀里，生怕丢了。主母端的把人心拿捏得死死的，叫他们心甘情愿地掏钱。"
 SUM_Neo_SDH.182.a:"直取雨林关隘"
 SUM_Neo_SDH.182.b:"先断其商路"
 SUM_SDH_WAR_Last_Wind:"最后一场风"
 SUM_SDH_WAR_Last_Wind_desc:"总攻，特意选在换季的大风天。风一起，黄沙蔽日，天地都分不清，敌军睁不开眼。三军趁势掩杀过去。这等战机，端的难得。三军早已等在风口，只盼这一阵。"
 SUM_Neo_SDH.183.t:"最后一场风"
 SUM_Neo_SDH.183.d:"主母定下总攻的日子，偏选在换季的大风天。那大风一起，黄沙漫天，天地间浑浑沌沌，分不清东西南北。沙漠的人自幼在风沙里长大，习以为常，雨林的兵却从未见过这等阵仗，一开战便迷了方向。主母正是看中这一点，才把决战放在此时。那一日风声呼啸，如千军万马奔腾，沙粒打得人脸生疼，睁不开眼。沙漠的兵借着风势，逆风掩杀过去，雨林的兵辨不清来敌，弓箭都射歪了，不少人自相践踏。端的占了天时。众军高声呼喊，声音却被风吞没，只余下一片混战。沙漠的兵蒙着脸，只露出一对眼睛，借着风声掩住脚步声，摸到近前一刀劈下，雨林的兵还没看清人影便倒了。这一阵杀得昏天黑地，待风停时，地上已横七竖八倒了一片。"
 SUM_Neo_SDH.183.a:"把话说给雨林人听"
 SUM_Neo_SDH.183.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Break:"破阵"
 SUM_SDH_WAR_Break_desc:"最硬的风卫，压住正面死战。等对方阵脚一动，两翼的游骑便插进去，如刀切豆腐。这正面牵制、两翼包抄，端的老练。这一手练了多少回，今日终于用上。"
 SUM_Neo_SDH.184.t:"破阵"
 SUM_Neo_SDH.184.d:"总攻既起，主母布下阵势。最精锐的风卫压在正面，列成厚厚的一堵墙，稳步向前推进。那风卫都是百战之余，披重甲，持长盾，弓箭射不透，长枪扎不进。雨林的兵见正面推不动，果然把预备队调上去，阵势一动，两翼便露出空隙。主母等的就是这一刻，一声令下，两翼的游骑如离弦之箭，从沙丘后头斜刺里插进去，直捣中军。雨林的阵登时被搅作一团，首尾不能相顾。风卫在前面压住，游骑在两翼包抄，端的配合得如同一个人。中军的旗倒了，四下里便溃散开去。游骑一路追杀，把溃兵赶到沙丘夹缝里，插翅也难逃。主母立在高处观阵，见两翼得手，方才放声大笑，说这一仗赢得痛快。端的是运筹帷幄。"
 SUM_Neo_SDH.184.a:"倾全境之力"
 SUM_Neo_SDH.184.b:"留一支后手"
 SUM_SDH_WAR_See_Towers:"望见尖塔"
 SUM_SDH_WAR_See_Towers_desc:"从雨林高处往下望，隐隐能望见须弥城的尖塔。走了这么远的路，打了这么多的仗，为的就是那几座塔。这一路辛苦，端的都有了着落。"
 SUM_Neo_SDH.185.t:"望见尖塔"
 SUM_Neo_SDH.185.d:"大军一路北上，终于登上雨林尽头的高处。有兵丁扶着一块岩石远远望去，但见尘沙尽头，隐隐现出几座尖塔，直插天际。那便是须弥城了。众人走了这么远的路，穿沙海，越关隘，死了多少人，流的多少血，为的就是望见那几座塔。有老兵红了眼眶，喃喃道：总算走到了。主母立在风里，望着那几座塔，半晌无言。那塔里头住着教令院，住着大贤者，端的把他们挡在门外多少年。如今兵临城下，只差最后一步。众军顺着主母的目光望去，个个心潮起伏，握紧了手中的刀。有年轻的兵问，望见塔之后便怎样？老兵默然半晌，说那就看主母的了。众人便不再言语，只把刀擦得雪亮，预备着接下来的厮杀。"
 SUM_Neo_SDH.185.a:"以动员令起兵"
 SUM_Neo_SDH.185.b:"以盟约召集部族"
 SUM_SDH_WAR_Terms:"提出条件"
 SUM_SDH_WAR_Terms_desc:"兵临城下，这才慢悠悠提出条件：撤走戍兵，减少贡赋，归还水源，承认独立。四条摆出来，一条也不肯少。这条件提得，端的硬气。少一条也不肯收兵。"
 SUM_Neo_SDH.186.t:"提出条件"
 SUM_Neo_SDH.186.d:"大军兵临须弥城下，主母这才不慌不忙开出条件。那条件共是四条：一要雨林撤回沙地的戍所，二要减了岁贡，三要归还抢占的水源，四要承认哈德拉玛维特自主。四条条条都要害，却又不肯先开口，直等到兵临城下，方才抛出。城里的教令院慌作一团，六派首座你看看我，我看看你，谁也拿不定主意。主母端的会用势，先把刀架在脖子上，再慢慢讲道理。有使节出来讨价还价，主母只回一句：先撤戍，再谈别的。使节还要再辩，主母便不再理会，端起茶来慢慢喝。使节回城之后，把条件一条条禀报上去，教令院里顿时炸了锅。有人主张硬抗，有人主张先答应下来再作计较，争了整整一夜也没个结果。"
 SUM_Neo_SDH.186.a:"直取雨林关隘"
 SUM_Neo_SDH.186.b:"先断其商路"
 SUM_SDH_WAR_Sumeru_Day:"须弥之日"
 SUM_SDH_WAR_Sumeru_Day_desc:"到了这一步，这仗不只是打给雨林看的，也是打给沙漠自己看的。要让雨林知道厉害，也要让自家明白，沙漠不再是从前那盘散沙。这一仗，赢要赢得明白，输也要输得明白。"
 SUM_Neo_SDH.187.t:"须弥之日"
 SUM_Neo_SDH.187.d:"到了这一步，这仗的意味就变了。这一仗不单是打给雨林看的，也是打给沙漠自己看的。要叫雨林知道，沙漠不好惹；也要叫沙漠各部知道，跟着主母才有肉吃。主母深明此理，所以每到一处，必要堂堂正正列阵，明明白白宣示，绝不偷袭取巧。及至目的达到，收兵的号角吹响，那号声呜呜咽咽，在沙丘间回荡，吹了很久很久。有兵丁收了刀，面面相觑，竟生出几分茫然。打了这许多日子，一朝收兵，倒像少了什么。主母却远远望着须弥城，神色平静。那些日子，沙地上到处都在传说主母的威名，说她用兵如神，说她待降卒宽厚。各部首领纷纷来见，争先恐后地表示臣服，生怕慢了一步，分不到好处。"
 SUM_Neo_SDH.187.a:"把话说给雨林人听"
 SUM_Neo_SDH.187.b:"把话说给沙漠人听"
 SUM_SDH_WAR_Storm_On_Forest:"风卷雨林"
 SUM_SDH_WAR_Storm_On_Forest_desc:"哈德拉玛维特的旗，插上了第一道雨林戍所。往东是河渠平原，再往东便是须弥城。教令院连夜遣使，说可以谈。阵前的人只回一句：先撤戍，再谈别的。这话答得硬气。"
 SUM_Neo_SDH.188.t:"风卷雨林"
 SUM_Neo_SDH.188.d:"哈德拉玛维特的旗，稳稳插上了第一道雨林戍所的墙头。打此处往东，便是一马平川的河渠与平原，再往东，就是那须弥城了。旗子一到，等于把通往须弥的大门踹开。城里的教令院哪敢怠慢，连夜打发使节出城，一路飞奔到阵前，说愿意谈，什么条件都好商量。使节说得口干舌燥，把预言的好听的话都搬了出来，阵前那人却只淡淡回了一句：先撤戍，再谈别的。使节碰了一鼻子灰，怏怏而回，连夜又写禀报。端的拳头硬，才有说话的底气。守在戍所里的雨林兵，有的还在梦里，便被堵在被窝里；有的赤脚往外跑，被乱箭射倒。没一顿饭的工夫，这座戍所便安安静静了，只剩旗子在风里响。"
 SUM_Neo_SDH.188.a:"倾全境之力"
 SUM_Neo_SDH.188.b:"留一支后手"

 #### 决议 ####
 SUM_SDH_Govern:"主母与部族"
 SUM_SDH_Govern_desc:"哈德拉玛维特的政务组，管的是花都与雨林边地的内政。安抚部族，整理税制，兴修水利，一样样都是稳固根基的功课。根基扎得深，风雨来了才不动摇，百姓安心耕织，才算真稳。"
 SUM_SDH_Faith:"花神与神龛"
 SUM_SDH_Faith_desc:"哈德拉玛维特的信仰组，管的是古树与花神的祭祀。新旧教团有了分歧，便由它调停，维系民间信念。信仰一散，人心便难聚，收税征兵都要跟着吃力。这信念端的不能乱。"
 SUM_SDH_Trade:"盐路与商队"
 SUM_SDH_Trade_desc:"哈德拉玛维特的贸易组，靠着雨林与商道，经营香料、木材、奇珍的买卖，这是本邦富庶的根本。货源商路都攥在手里，府库自然充盈，遇上战事灾荒，也拿得出东西应付。"
 SUM_SDH_Army:"沙暴军团"
 SUM_SDH_Army_desc:"哈德拉玛维特的军事组，管训练、布防与征兵。这支兵马依托山地密林，讲求伏击坚守。山林是最坚固的屏障，也是最熟的地利，善用便能以少敌多。守住山林，便守住命脉。"
 SUM_SDH_Crisis:"风灾与饥馑"
 SUM_SDH_Crisis_desc:"哈德拉玛维特的危机组，专管内外突发变故。山林之间消息迟滞，凡事务必早断，免得小事拖成大患，到时候补救，要多费几倍气力。早做打算，才护得住山林人家。"
 SUM_SDH_Dec_Gov_Council:"召开部族议事"
 SUM_SDH_Dec_Gov_Council_desc:"要召集各部的代表，聚到一处议事。你一言我一语，议定了便立约为凭，各自签押。有分歧的，也先记下慢慢再议。这代表一处，事情便好商量。"
 SUM_SDH_Dec_Gov_Roll:"登记部众"
 SUM_SDH_Dec_Gov_Roll_desc:"各部的人丁，逐一登记成册。谁家几口，年纪多大，能拿不能拿兵器，都写在册上。有那隐瞒不报的，一经查出便要罚。这册子端的关系重大。"
 SUM_SDH_Dec_Gov_Elder:"公推长老"
 SUM_SDH_Dec_Gov_Elder_desc:"长老一职，改由住户公推。谁办事公道，众人便推谁，不必再看出身。有那想靠家世上位的，这回也只得作罢。这公推端的服人。连任的也有，只是要再看三年。"
 SUM_SDH_Dec_Gov_Petition:"设陈情处"
 SUM_SDH_Dec_Gov_Petition_desc:"新开一处衙门，专管受理冤屈。谁有委屈，递上纸状，自有官员来问。有那有理说不清的，这回也有了说处。这衙门端的惠民。那纸状递进去，便有人接，有人问，有人断。"
 SUM_SDH_Dec_Faith_Fete:"办花神诞祭"
 SUM_SDH_Dec_Faith_Fete_desc:"沙地各处，都要办起花神诞祭。搭起神棚，摆上鲜花，男女老少都来烧香。有那远处的，也赶着驼车来看热闹。这诞祭一办，人心便齐了。"
 SUM_SDH_Dec_Faith_Shrine:"立神龛"
 SUM_SDH_Dec_Faith_Shrine_desc:"城门边上，立起一处花神的龛。龛里供着鲜花，来往的人都要进去拜一拜。有那赶路的，也停下车马，献上一束。这龛端的暖人心。日子久了，那龛前的地都踏得发亮。"
 SUM_SDH_Dec_Faith_Alms:"开济贫所"
 SUM_SDH_Dec_Faith_Alms_desc:"济贫之事，交给神庙去办。庙里开设粥棚，收留无依的人，冬施衣，夏施水。有那穷得没饭吃的，便来庙里讨一口。这善举端的积德。庙门口常年排着队，倒也不乱。"
 SUM_SDH_Dec_Faith_Dig:"清理遗迹"
 SUM_SDH_Dec_Faith_Dig_desc:"要清理一处旧遗迹，便召集人手。众人带着铲子箩筐，把埋着的沙一层层扒开。挖出旧物，便登记入库，不许私拿。这遗迹里的东西，端的归公。"
 SUM_SDH_Dec_Trade_Salt:"经营盐路"
 SUM_SDH_Dec_Trade_Salt_desc:"盐路之上，商户与驮队络绎不绝。主母遣人招抚，许以安稳，凡愿归附的，一律妥为安置。这盐路一通，沙地的日子便活了。众商户见了，都安心来做买卖。"
 SUM_SDH_Dec_Trade_Toll:"设卡收税"
 SUM_SDH_Dec_Trade_Toll_desc:"盐路要口，设下一道关卡。过往货驮，照例抽税，一文不多，一文不少。守卡的兵士验过货单，便挥手放行。这税取之有道，商户虽出些钱，换来一路平安，也自甘愿。"
 SUM_SDH_Dec_Trade_Caravan:"招徕商队"
 SUM_SDH_Dec_Trade_Caravan_desc:"远来的商队，路远迢迢，最怕税重。官府便减了税，招徕他们。有那犹疑的，听说税轻，便牵驼而来。这一减税，远方的货物便源源不断涌进沙地。端的招徕有方。"
 SUM_SDH_Dec_Trade_Well:"凿井"
 SUM_SDH_Dec_Trade_Well_desc:"沙地缺水，流民无处安身。官府便在缺水之处，凿井安置。井水一出，人们便围拢来，搭起帐幕，渐渐成了村落。一口井便是一处生机，流民有了着落，心上也就安了。"
 SUM_SDH_Dec_Trade_Mint:"铸钱"
 SUM_SDH_Dec_Trade_Mint_desc:"沙地买卖，苦无通用的钱，以物易物，诸多不便。官府便开炉铸钱，沙地通用。钱铸出来，商户拿着好使，人人称便。这钱一通行，买卖便活了。端的便民。"
 SUM_SDH_Dec_Army_Levy:"征发部众"
 SUM_SDH_Dec_Army_Levy_desc:"战事将起，官府便向各部征发一批部众。令一下，各部挑些精壮的，扛弓带刀，到军中报到。这些部众本是牧人，如今拿起兵器，倒也勇猛。到齐之后，端的听用。"
 SUM_SDH_Dec_Army_Storm:"操演风战"
 SUM_SDH_Dec_Army_Storm_desc:"操演兵马，专挑沙暴天。风起沙飞，正是练兵的好时节。兵士们在风里辨方向、结阵势，起初乱作一团，久了便稳如磐石。这沙暴战术练成，遇上真战，便不怕风沙。"
 SUM_SDH_Dec_Army_Mech:"修补构装"
 SUM_SDH_Dec_Army_Mech_desc:"从遗迹取出的构装，用久了会损。官府便设下来，专门修补。匠人把构装拆开，一件件擦拭上油，坏了的换，缺了的补。这构装修好，又能上阵杀敌，端的省了许多人命。"
 SUM_SDH_Dec_Army_Fort:"增筑戍所"
 SUM_SDH_Dec_Army_Fort_desc:"要道之上，增筑戍所与望楼。戍所驻兵，望楼瞭远，一旦发现动静，便放烟为号。这戍所望楼一立，商路便有了照应，盗贼也敛了迹。这般布置，端的稳妥，盗贼不敢近前。"
 SUM_SDH_Dec_Crisis_Storm:"赈济风灾"
 SUM_SDH_Dec_Crisis_Storm_desc:"沙暴过后，毁了房屋庄稼，灾民流离。官府便开仓赈济，按人口放粮。灾民领了粮，搭起窝棚，渐渐安定。这仓中一粒粮，端的能救人一命。端的实惠。"
 SUM_SDH_Dec_Crisis_Water:"调停争水"
 SUM_SDH_Dec_Crisis_Water_desc:"两处绿洲，为争水闹得不可开交。官府便出面调解，按人口分水，各立字据。两边起初还争，后来见分得公道，也就服了。水匀开了，争端也就息了。"
 SUM_SDH_Dec_Crisis_Plague:"防疫"
 SUM_SDH_Dec_Crisis_Plague_desc:"疫病流行之处，官府下令封锁，不许人进出。又施药救治，医者日夜煎药。这封锁虽严，却救了四处百姓。患病的人都被安置在远处，不许与外人相接。"
 SUM_SDH_Dec_Crisis_Riot:"弹压骚动"
 SUM_SDH_Dec_Crisis_Riot_desc:"治安队巡行市井，遇有骚动，便上前弹压。那闹事的起初还逞强，见治安队刀在手，也就散了。这治安队平息骚动，端的利落。这般出手端的干净。"
 SUM_Neo_SDH_Mechanism:"机制状态"
 SUM_Neo_SDH_Mechanism_desc:"这面牌子不问事，只照实记账。花神、风暴两条轴走到哪一档，哈德拉玛维特什么等级、吃哪几条修正，列在上头。条目按不得，轴值一变牌子自己就换。抬眼一瞧便知该往哪条轴上使力。"
