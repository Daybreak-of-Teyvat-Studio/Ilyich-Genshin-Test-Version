 NAT_Nightwind_Nightwind_Proclamation_Idea:"夜檄四方"
 NAT_Nightwind_Nightwind_Proclamation_Idea_desc:"烟谜主宣称，边界由夜风重写。夜里，族中巫祝登上一处高崖，张双臂，任夜风吹动灰袍。对风念起谜语般祝词，风自北来，便将北面界碑往北挪一挪；风转向，界碑又随之转。焱庭守碑人看界碑一夜之间挪数回，急得跺脚，却抓不住那风。一年轻后生问巫祝：「风往哪吹，边界便往哪改，凭甚么？」巫祝睁眼，望远处：「风从何来，便往何去。它写之界，比人所写者长。」言间，一阵夜风卷过，将崖上灰吹散，巫祝祝词为风带入夜里，消散无踪。垂下双臂，转身下高崖，灰袍于风中鼓成一团。"
