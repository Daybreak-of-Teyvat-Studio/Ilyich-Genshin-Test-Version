 LOADING_TIP_157:0 "玉は砕けても白さを失わず、竹は焼かれても節を損なわない。身は滅びても、名は竹簡に刻まれて残る。\n――璃月慎刑大夫 煙緋（えんひ）、殉節直前、1940年10月19日"
 LOADING_TIP_158:0 "各国の変法は、いずれも流血を伴って成就する。今の璃月には流血して犠牲となった者がいない、これが国が栄えない理由だ。もし犠牲が必要なら、雲菫から始めよ。\n――雲菫が維新会議にて述べた言葉、1938年9月28日"
 LOADING_TIP_159:0 "今は圧力が迫っているが、我は庶民と生死を共にすることを誓う、共存共亡せよ。\n――刻晴、璃月港防衛戦前、1940年7月14日"
 LOADING_TIP_160:0 "朝堂には朽ちた木の如き役人が居並び、宮殿の間には禄を食む禽獣が跋扈する。このため狼心狗肺の連中が朝堂を我が物とし、媚を売る輩が政を執る。\n――璃月海軍左枢密使 北斗、凝光臨時政府を評した言葉"
 LOADING_TIP_161:0 "庶民に恵みをもたらすことができるのなら、我は地獄の苦しみも辞さない。\n――璃月護法夜叉大将・魈が理山叠水真君に返答"
 LOADING_TIP_162:0 "俺は荒波が怖いのか？俺が魚売りだったことを忘れたのか、波が荒ければ魚の値段が上がる！ \n――璃月天権星 凝光、渦の魔神オセルとの決戦前、玉衡星 刻晴に返答"
 LOADING_TIP_162:0 "夜蘭を探し出して、魚が食べたいと伝えてくれ\n――璃月群玉閣の主・凝光、天権星立候補前夜。"
