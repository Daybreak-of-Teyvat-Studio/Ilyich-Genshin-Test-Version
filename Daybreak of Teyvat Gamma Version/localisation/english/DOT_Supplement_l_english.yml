 SOV_military_reorganization_ns:0 "Military Reorganization"
 SOV_military_reorganization_ns_desc:0 "The [GetSovietArmyAdjectiveBasedOnIdeology] Army is undergoing a huge reorganization, which requires disrupting the existing formations to some extent for a hopefully short period of time."
