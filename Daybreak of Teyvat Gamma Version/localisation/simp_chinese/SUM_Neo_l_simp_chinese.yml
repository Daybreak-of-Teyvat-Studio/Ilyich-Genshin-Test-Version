 SUM_Neo_SDH.182.d:"后方照收捐输，捐输的人指望打胜了抵税。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
