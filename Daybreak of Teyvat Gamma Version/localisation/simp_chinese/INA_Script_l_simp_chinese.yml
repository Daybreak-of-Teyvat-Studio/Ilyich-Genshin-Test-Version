 ### Country Names ###
  INA_Raiden:0 "雷电 影"
  INA_Raiden_desc:0 "稻妻的雷神双生子之一，在姐姐死后继承了雷电将军之位，封闭了自己的内心，而后将国事尽数交给自己制作的人偶将军。"
  INA_Raiden2:0 "雷电将军"
  INA_Raiden2_desc:0 "稻妻神明雷电影所制作的人偶，原材料是雷电影自己的身躯，负责在影封闭内心期间代替影执政。用将军的话说‘影是象征着意识的半身，而我则是代表身躯的半身’"
  INA_yae:0 "八重 神子"
  INA_yae_desc:0 "八重神社宫司，雷电将军的眷属，八重堂的老板，社奉行的顶头上司，得益于其身份的特殊，八重神子掌管了整个稻妻的文娱宗教领域，但相较于宫司的职责，神子更喜欢去看轻小说。"
  INA_Sara:0 "九条 裟罗"
  INA_Sara_desc:0 "九条家的养女，幕府军中少数的清廉优秀人士，同时也是整个幕府中最受少壮派支持的将领。九条裟罗的军事能力与对雷电将军的忠诚毋庸置疑，但幕府军内的腐败严重影响了她的发挥。"
  INA_Ayaka:0 "神里 绫华"
  INA_Ayaka_desc:0 "神里家族长女，人称白鹭公主，在父母去世后协助兄长支撑整个家族，为人和善。在民众中有极高的欢迎度，能极大的稳定局势。"
  INA_Ayato:0 "神里 绫人"
  INA_Ayato_desc:0 "神里家族长子，现任族长，在父母去世后继承了社奉行的职责，以一己之力承担起了整个家族，善于谋略，在家族式微的情况下不但支撑起了家族，还拥有了一只特务部队。将社奉行的权力从文化范围扩展到了特务领域。"
  INA_Yoimiya:0 "长野原霄宫"
  INA_Yoimiya_desc:0 "长野原烟花店现任店长，继承了父亲的烟花店，为人开朗活泼，人称夏祭的女王，善于制作各种烟花，协调人与人之间的关系。善于研发新型烟花。"
  INA_Saya:0 "早柚"
  INA_Saya_desc:0 "终末番忍者，虽然经常偷懒睡觉，但早柚对于自己工作的态度还是相当认真的。。大概吧。。她应该不会偷懒在睡觉吧。"
  INA_Heizou:0"鹿野院平藏"
  INA_Heizou_desc:0 "隶属于天领奉行的侦探，善于调查分析案情，是一个优秀的特种人才，无论多么复杂的案件，无论潜藏有多深的敌人，平藏总是能找出真相，揪出犯人。"
  INA_Gorou:0 "五郎"
  INA_Gorou_desc:0 "珊瑚宫的主将，善于训练麾下士兵，也善于构建防御阵型。"
  INA_Kokomi:0 "珊瑚宫心海"
  INA_Kokomi_desc:0 "珊瑚宫现任领袖，海祈神社主祭，作为年轻的领袖，不得不为自己的族人生存举起反旗。善于治疗，也善于制定各种计划。但作为领袖心海还有很长的路要走。"
  INA_momoka:0 "琦良良"
  INA_momoka_desc:0 "稻妻物流的快递员。"
  
################稻妻内战########

INA_Construction:0 "稻妻的建设"
INA_Construction_desc:0 "天守阁的翻新工作非常重要，离岛和影向山的重建也刻不容缓，但是只关注鸣神岛的建设是短视的行为。在沉静了数百年之后，御影炉心的工作状态又一次不稳定了起来，而这一次，我们必须亲自解决这些问题。"
INA_nuclear_fusion_status_change:0 "御影炉心状态变化"

  
General_Sara_was_seriously_injured:0 "九条大将身受重伤！"
################稻妻内战########
 Great_Depression_of_INA:0 "残暴背信的反抗军"
 genshin_noun:0 "背信者"
 INA_News.1.t:0 "人间惨剧"
 INA_News.1.d:0 "今日稻妻幕府宣称：珊瑚宫叛军占领了八酿岛之后，不但没有给当地居民带来任何他们所宣传的自由，反而大肆破坏八酿岛镇压崇神的镇物，致使整个八酿岛沦为这些不法之徒的乐园，而他们的目的是为了释放被斩杀的邪神奥罗巴斯的怨念。这些狂热的邪教分子，只会破坏而不懂得建设，且毫无荣辱之心，正是因为如此，这些叛乱分子在破坏了将军恩赐他们的珊瑚岛之后，又意图染指八酿岛。"
 INA_News.1.a:0 "一群可耻败类！"
 INA_News.1.b:0 "一派胡言！"
 INA_News.1.c:0 "稻妻的内战灾难"
 INA_News.2.t:0 "御前军事会的重组"
 INA_News.2.d:0 "今日，稻妻幕府展开新闻发布会，为了应对叛军越发猖狂的攻势，天领奉行大将九条裟罗奉命重整军事，重新组建名为御前军事会的军事机构。"
 INA_News.2.a:0 "让我们重整旗鼓。"
 INA_News.2.b:0 "不过是痴心妄想。"
 INA_News.2.c:0 "让我们拭目以待。"
 INA_News.3.t:0 "海寇剿灭宣言"
 INA_News.3.d:0 "今日，九条大将，万国商会会长，以及社奉行家主在发布会上做出重要讲话。万国商会会长指出；海盗，不剿不行啊，你想啊，你带着老婆孩子，出了海，吃着火锅唱着歌，突然，就让海盗劫了，所以，没有海盗的日子，才是好日子。九条大将则表示一定会肃清稻妻附近的所有可能的海盗藏身点，还稻妻民众海河晏清。"
  INA_News.3.a:0 "出发！剿匪！。"
 INA_News.3.b:0 "不过是徒劳无功。"
 INA_News.3.c:0 "让我们拭目以待。"
 INA_News.4.t:0 "海寇诏安宣言"
 INA_News.4.d:0 "今日，九条大将，万国商会会长，以及稻妻附近最大的海寇团伙在发布会上做出重要讲话。万国商会长指出；海贼，其实是可以诏安的，你想啊，如果不是那些叛军，抢了他们的粮食和住所，谁又愿意和伟大的幕府对抗呢，所以，幕府为了民众的安居乐业诏安了海贼。\n自今日起，凡是愿意归顺幕府的海贼，以往罪行，一笔勾销。"
 INA_News.4.a:0 "驱虎吞狼！。"
 INA_News.4.b:0 "当心搬石砸脚。"
 INA_News.4.c:0 "让我们拭目以待。"
 INA_News.5.t:0 "稻妻和平宣言"
 INA_News.5.d:0 "今日，随着和平条约的签署，漫长的稻妻内战终于结束了。幕府方面宣布在内战结束之后，该为过去战争中的功臣们论功行赏了。"
 INA_News.5.a:0 "久违的和平！。"
 INA_News.5.b:0 "久违的和平！"
 INA_News.5.c:0 "就这么结束了？"
 INA_News.6.t:0 "八重幕府"
 INA_News.6.d:0 "今日，幕府经历了长期的内部整顿之后，出现在发布会上的，竟然是八重宫司大人，如今的八重宫司依靠着将军大人的宠爱已然大权独揽，整个幕府上下已然是八重神社和社奉行的天下。"
 INA_News.6.a:0 "八重宫司大人！将军大人！。"
 INA_News.6.b:0 "居然会是她？"
 INA_News.6.c:0 "意料之外的结果"
  INA_News.7.t:0 "稻妻军政府"
 INA_News.7.d:0 "今日，幕府经历了长期的内部整顿之后，出现在发布会上的，是九条裟罗大人，如今的幕府权威尽失，在军队中威望极高的九条裟罗大将得到将军大人的肯定，也是情理之中，但毫无疑问的是，稻妻幕府接下来的行为恐怕会如九条裟罗的军事风格一样严酷无情。"
 INA_News.7.a:0 "将军大人英明！。"
 INA_News.7.b:0 "是她？倒是不意外"
 INA_News.7.c:0 "意料之中的结果"
   INA_News.8.t:0 "神明再现！"
 INA_News.8.d:0 "今日，幕府经历了长期的内部整顿之后，出现在发布会上的，竟然是将军大人本尊！如今的稻妻危机四伏，但将军大人没有抛弃她的民众，而是亲自出山。毫无疑问的是，这给整个稻妻的动乱局势加上一枚压舱石。"
 INA_News.8.a:0 "将军大人英明！。"
 INA_News.8.b:0 "是她？令人意外"
 INA_News.8.c:0 "稻妻局势变得有趣了。"
 INA_News.9.t:0 "神明再现！"
 INA_News.9.d:0 "今日，幕府经历了长期的内部整顿之后，出现在新闻发布会上的，竟然是将军大人本尊！如今的稻妻危机四伏，皆是因为小人作乱，各级官僚腐败无能，将军忍无可忍，决定亲自出山，而令人惊骇的是，在新闻发布会上，将军直接以雷霆的神威斩杀了四名小人，毫无疑问的是，稻妻接下来的局势绝不会太平。"
 INA_News.9.a:0 "常道恢宏，鸣神永恒！。"
 INA_News.9.b:0 "令人意外的残酷"
 INA_News.9.c:0 "快刀斩乱麻。"




###################################
INA_army_corruption:0 "严重腐败的军队"
INA_army_corruption_desc:0 "我们的军队被奉行府把持得太久了，里面充斥着无能的废物，贪污的臭虫以及贪生怕死的胆小鬼。这极大的影响了我们军队的战斗力。要赢得这场战争，我们必须重整我们的军队，清扫掉这里面的无能之辈。"
INA_army_corruption_2:0 "有些腐败的军队"
INA_army_corruption_2_desc:0 "我们已经成功的重组了军队，清除了里面那些贪污腐败的臭虫，但这只由废物和胆小鬼组成的军队依然难当大任。要赢得这场战争，我们必须继续重整我们的军队，清扫掉这里面的无能之辈。"
INA_army_corruption_3:0 "比较腐败的军队"
INA_army_corruption_3_desc:0 "我们已经成功的重组了军队，清除了大部分的害群之马，这支军队现在可堪一用。不过要赢得这场战争，我们必须继续重整我们的军队，彻底解决所有问题，一了百了。"
INA_huaping:0 "人偶将军"
INA_huaping_desc:0 "雷电将军在名义上统治着整个稻妻。"
INA_complete:0 "身心合一"
INA_complete_desc:0 "现在，心灵与身体的矛盾得以解决，完全的雷电将军，将驾驭整个稻妻。"
INA_eyeseek:0 "眼狩令"
INA_eyeseek_desc:0 "最初由天领奉行提议，经雷电将军批准，为保障稻妻能在永恒的道路上不受干扰，而决定对那些不完全服从于将军大人的神之眼持有者施加剥夺神之眼的惩罚，随着局势发展，眼狩令越发狂热，但因为神之眼持有者数量的稀少，因此大部分平民对此并没有太大意见。"
INA_locked:0 "锁国令"
INA_locked_desc:0 "在经历坎瑞亚一战之后，目睹了坎瑞亚覆灭惨剧的将军决定降下雷暴，封锁国境，除去极少数有能力穿越雷暴的商船还能在离岛与稻妻进行贸易之外，大部分的商贸活动都被禁止了，这极大的稳定了稻妻的局势，但也阻碍了稻妻的进步。不过千年不变的永恒，不正是将军大人的信念吗？"
INA_government_corruption:0 "无能的政府"
INA_government_corruption_desc:0 "将军在一心净土之中的时间太久了，三奉行早已经不再是当年高效忠诚的三奉行了，现如今三奉行之间充斥着明争暗斗，勾结外匪，对国家大事不闻不问，整个稻妻民不聊生。"
INA_disaster:0 "雷祸横行"
INA_disaster_desc:0"如今鸣神大社的宫司大人早已不再是忧国忧民的狐斋宫大人了，现在是将军的眷属八重神子，她仗着将军的宠爱，对神社应尽的职责敷衍了事，雷击木遭到歹徒的损坏，雷祸污染甚至早就蔓延在了影向山之下，而八重神子却痴迷于创办轻小说比赛。"
INA_civil_wars:0 "内战危机"
INA_civil_wars_desc:0 "眼狩令的实行，以及天领奉行的腐败给了那些叛乱分子以可乘之机，珊瑚宫的反抗军乘机向幕府举起了反旗。不管她们的理由有多么好听，我们的国家陷入了内乱是不争的事实。"
INA_pirate:0 "海盗横行"
INA_pirate_desc:0 "随着战乱的爆发，一些渔民以及逃兵落海为贼，占山为寇，肆意袭击路人，打劫商队，使得我们的商业贸易遭到了严重的破坏。"
INA_fox_government:0 "八重政府"
INA_fox_government_desc:0 "神子领导下的新稻妻政府，更侧重于和平外交和文化宣传"
INA_fox_public:0 "八重堂"
INA_fox_public_desc:0 "神子所创办的八重堂，是全稻妻最大的出版社。现在八重堂也将承担稻妻一切的新闻和宣传任务。"
############################################
  INA.1.t:0 "稻妻内战的宣传口径？"
  INA.1.d:0 "当初没有彻底清算掉珊瑚宫那些奥罗巴斯眷族或许是将军大人最错误的选择之一。将军大人曾经与他们的神明有过约定，将军大人仁慈的赐予了他们珊瑚宫的领土，但这些贪得无厌的家伙却不仅不感恩将军的恩德，反而染指其他的岛屿。这使得现在，“珊瑚宫反抗军”的名号在稻妻打响，好在虽然如今八酿岛已经沦陷，但反抗军的破坏使得八酿岛成为了一片废土，这或许是一个绝佳的机会。。。？"
  INA.1.1:0 "把他们的罪行宣传出去！。"
  INA.1.2:0 "我们应当强调将军大人的仁慈。"
  
  INA.2.t:0 "寻求支援"
  INA.2.d:0 "毫无疑问的一点，在幕府的统治之下，我们已经不可能独自解决掉这场叛乱了，幕府内也有许多人等着看我们的笑话。以幕府军目前虚弱的实力，我们无法与叛军抗衡。\n因此，我们不得不低下头去寻求其他的帮助。经过三奉行的深思熟虑，天领奉行认为应该向目前风头最旺的愚人众求援、勘定奉行提议寻求将军大人的智慧而社奉行则提议向鸣神大社的八重神子求援，这三者是最有可能给予我们帮助的，所以，应该向哪一方寻求帮助呢？"
  INA.2.1:0 "果然还是向将军大人请教更合适。"
  INA.2.2:0 "我们应该寻求愚人众的协助。"
  INA.2.3:0 "可能那个恶心的八重神子更好一点。"
  
  INA.3.t:0 "神社问题"
  INA.3.d:0 "毫无疑问的一点，弥漫在整个稻妻的雷霆灾难，是因为地脉之中淤积的大量雷祸迟迟没有得到化解，而这一切都是因为八重神社的八重神子玩忽职守！而现在内战已经结束，稻妻城的舆论管辖已经重归幕府，我们应该怎么做？"
  INA.3.1:0 "严惩八重神子，勒令她尽快驱散雷祸。"
  INA.3.2:0 "稍微惩罚一下社奉行，敲山震虎。"
  INA.3.3:0 "将军和神子的关系特殊，我们尽量掩盖这事。"
  
  INA.4.t:0 "奉行丑闻"
  INA.4.d:0 "近日，三奉行之间的相互攻讦已经到了无可挽回的程度，社奉行揭露了天领奉行，勘定奉行与愚人众勾结，出卖稻妻利益。天领奉行指控勘定奉行故意扰乱市场，敲诈商人致使后勤崩溃，物价飞涨，同时指控社奉行暗中训练私军勾结叛党，意图以下犯上。勘定奉行展示了查获的叛军书信，社奉行暗中勾结叛军，出卖情报给叛党，同时谴责天领奉行阻断其他奉行的上书途径，蒙蔽将军。"
  INA.4.1:0 "严惩三奉行，将三奉行抄家下狱！"
  INA.4.2:0 "天领，勘定奉行家主退位，并罚奉三年，社奉行罚奉三年！。"
  INA.4.3:0 "让三奉行向全稻妻民众致歉谢罪。"
    
  INA.5.t:0 "锁国令与眼狩令"
  INA.5.d:0 "随着内战的结束，锁国令与眼狩令的原因也查清了，天领奉行为首的奉行欺瞒了将军，夸大了神之眼持有者的危害，导致将军做出了错误的决断，而随着天领奉行被调查，废除眼狩令和锁国令的机会已经出现了。"
  INA.5.1:0 "发布罪己诏，惩戒奉行，废除锁国，眼狩令！"
  INA.5.2:0 "奉行必须严惩，废除眼狩令！。"
  INA.5.3:0 "发布罪己诏，废除锁国令。"
  INA.5.4:0 "将军大人永远不会错也绝不会被蒙蔽！"
  
  INA.6.t:0 "行政权力"
  INA.6.d:0 "现在我们处理完了内部的问题，但一个国家还得依靠官员们来治理，我们还是需要大量的官僚来完成稻妻的振兴。"
  INA.6.1:0 "让三奉行来吧，毕竟他们精通于此。"
  INA.6.2:0 "还是让山上的八重神子来辅助吧。"
  INA.6.3:0 "我们可以选拔民间那些聪明而又忠诚的人。"
  INA.6.4:0 "将军大人将亲自处理一切问题！"
  
   ### Country Names ###
  INA_Raiden:0 "雷电 影"
  INA_Raiden_desc:0 "稻妻的雷神双生子之一，在姐姐死后继承了雷电将军之位，封闭了自己的内心，而后将国事尽数交给自己制作的人偶将军。"
  INA_Raiden2:0 "雷电将军"
  INA_Raiden2_desc:0 "稻妻神明雷电影所制作的人偶，原材料是雷电影自己的身躯，负责在影封闭内心期间代替影执政。用将军的话说‘影是象征着意识的半身，而我则是代表身躯的半身’"
  INA_yae:0 "八重 神子"
  INA_yae_desc:0 "八重神社宫司，雷电将军的眷属，八重堂的老板，社奉行的顶头上司，得益于其身份的特殊，八重神子掌管了整个稻妻的文娱宗教领域，但相较于宫司的职责，神子更喜欢去看轻小说。"
  INA_Sara:0 "九条 裟罗"
  INA_Sara_desc:0 "九条家的养女，幕府军中少数的清廉优秀人士，同时也是整个幕府中最受少壮派支持的将领。九条裟罗的军事能力与对雷电将军的忠诚毋庸置疑，但幕府军内的腐败严重影响了她的发挥。"
  INA_Ayaka:0 "神里 绫华"
  INA_Ayaka_desc:0 "神里家族长女，人称白鹭公主，在父母去世后协助兄长支撑整个家族，为人和善。"
  INA_Ayato:0 "神里 绫人"
  INA_Ayato_desc:0 "神里家族长子，现任族长，在父母去世后继承了社奉行的职责，以一己之力承担起了整个家族，善于谋略，在家族式微的情况下不但支撑起了家族，还拥有了一只特务部队。将社奉行的权力从文化范围扩展到了特务领域。"
  INA_Yoimiya:0 "长野原霄宫"
  INA_Yoimiya_desc:0 "长野原烟花店现任店长，继承了父亲的烟花店，为人开朗活泼，人称夏祭的女王，善于制作各种烟花，协调人与人之间的关系。"
  INA_Saya:0 "早柚"
  INA_Saya_desc:0 "终末番忍者，虽然经常偷懒睡觉，但早柚对于自己工作的态度还是相当认真的。。大概吧。。她应该不会偷懒在睡觉吧。"
  INA_Heizou:0"鹿野院平藏"
  INA_Heizou_desc:0 "隶属于天领奉行的侦探，善于调查分析案情，是一个优秀的特种人才，无论多么复杂的案件，无论潜藏有多深的敌人，平藏总是能找出真相，揪出犯人。"
  INA_Gorou:0 "五郎"
  INA_Gorou_desc:0 "珊瑚宫的主将，善于训练麾下士兵，也善于构建防御阵型。"
  INA_Kokomi:0 "珊瑚宫心海"
  INA_Kokomi_desc:0 "珊瑚宫现任领袖，海祈神社主祭，作为年轻的领袖，不得不为自己的族人生存举起反旗。善于治疗，也善于制定各种计划。但作为领袖心海还有很长的路要走。"
