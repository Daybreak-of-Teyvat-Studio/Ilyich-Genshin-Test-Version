DOT_ControlProvince.3.d.generic:0"Ветреный край, важный транспортный узел Мондштадта, захвачен войсками [FROM.GetAdjective]. Войска [FROM.FROM.GetAdjective] отчаянно сопротивлялись, но были отброшены.\n\nЛеса и поля превратились в выжженную землю, и только великое дерево молча взирает на смерть и разрушение."
DOT_ControlProvince.3.d.LAWversion:0""
