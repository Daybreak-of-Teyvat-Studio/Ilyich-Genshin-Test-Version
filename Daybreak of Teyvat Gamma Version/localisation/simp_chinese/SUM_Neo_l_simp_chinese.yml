l_simp_chinese:

# =======================
# 须弥剧本 BY 荷花酥
# =======================

# 甲 | 圣树加冕 | 小吉祥草王重掌须弥，废除造神计划，让梦与自然回到须弥 | 尘世主义
# 乙 | 学者共和 | 废黜贤者寡头，学者、商人、沙漠民共立宪法 | 修禊主义 启明主义
# 丙 | 造神王座 | 把造神计划做完，以外力统治须弥 | 刑鼎主义 中和主义

 #################### 序章 · 花神诞祭 ####################
 SUM_PRO_Dawn_of_Sabzeruz:"花神诞祭的钟声"
 SUM_PRO_Dawn_of_Sabzeruz_desc:"花神诞祭的钟声在须弥城响起。教令院的高塔之下，人群与学者分立两侧，没人说出那个所有人都知道的事实，草神仍被锁在净善宫。—— BY 荷花酥"
 SUM_PRO_Aka_Shadow:"大贤者的影子"
 SUM_PRO_Aka_Shadow_desc:"大贤者阿扎尔在议事厅里独自决定须弥的走向，六大学派的首座只是列席。"
 SUM_PRO_Aka_Six_Darshan:"六大学派的座次"
 SUM_PRO_Aka_Six_Darshan_desc:"生论、素论、知论、明论、因论、妙论，六派各有心思，座次之争就是权力之争。"
 SUM_PRO_Aka_Censor:"禁书令"
 SUM_PRO_Aka_Censor_desc:"教令院颁下禁书令，凡涉及赤王、禁忌知识、世界树记忆的卷宗一律封存。"
 SUM_PRO_For_Tighnari:"巡林官的报告"
 SUM_PRO_For_Tighnari_desc:"巡林官提纳里递上报告，死域正沿着禅那园的低地蔓延。"
 SUM_PRO_For_Collei:"被遗忘的病"
 SUM_PRO_For_Collei_desc:"柯莱身上的魔鳞病被人再次提起，没人愿意承认它与禁忌知识有关。"
 SUM_PRO_For_Gandharva:"禅那园的低地"
 SUM_PRO_For_Gandharva_desc:"禅那园的猎人们自己组织起来，替教令院守着雨林的边界。"
 SUM_PRO_Des_Morning_Wind:"沙海的晨风"
 SUM_PRO_Des_Morning_Wind_desc:"晨风掠过列柱沙原，商队沿着赤王留下的旧道前行。"
 SUM_PRO_Des_Eremites:"镀金旅团的旗"
 SUM_PRO_Des_Eremites_desc:"镀金旅团的旗帜在沙丘间起落，他们的契约只认摩拉，不认教令院。"
 SUM_PRO_Des_Aaru:"阿如村的灯火"
 SUM_PRO_Des_Aaru_desc:"阿如村的灯火照着坎蒂丝的长矛，守村人替沙漠挡住教令院的税吏。"
 SUM_PRO_Ak_Terminal:"虚空的终端"
 SUM_PRO_Ak_Terminal_desc:"虚空终端把知识分发给每一个人，也把每一个人的梦收走。"
 SUM_PRO_Ak_Knowledge:"知识的价码"
 SUM_PRO_Ak_Knowledge_desc:"知识明码标价，学者的资历比学问更值钱。"
 SUM_PRO_Ak_Dream:"被抽走的梦"
 SUM_PRO_Ak_Dream_desc:"须弥人不再做梦。教令院说这是进步，兰那罗说这是灾难。"
 SUM_PRO_Gen_Project:"造神计划"
 SUM_PRO_Gen_Project_desc:"教令院启动造神计划，要以人偶之躯造出新神，取代被囚的草神。"
 SUM_PRO_Gen_Puppet:"人偶的躯体"
 SUM_PRO_Gen_Puppet_desc:"散兵的躯体被运进教令院的地下，机械与神性被凑在一起。"
 SUM_PRO_Gen_Fatui:"实验室的来客"
 SUM_PRO_Gen_Fatui_desc:"愚人众的使者频繁出入实验室，教令院假装没有看见。"
 SUM_PRO_Fat_Second:"第二席的请帖"
 SUM_PRO_Fat_Second_desc:"第二席的请帖送到大贤者案头，措辞客气，条件苛刻。"
 SUM_PRO_Fat_Dottore:"多托雷的提议"
 SUM_PRO_Fat_Dottore_desc:"多托雷提议用须弥的学者与资源来完成他的实验。"
 SUM_PRO_Fat_Factory:"沙漠里的工厂"
 SUM_PRO_Fat_Factory_desc:"沙漠腹地里冒出愚人众的工厂，烟囱日夜不停。"
 SUM_PRO_Ere_Blood:"血的律法"
 SUM_PRO_Ere_Blood_desc:"镀金旅团遵守血的律法，血脉与大地相连，饥馑的记忆写在骨子里。"
 SUM_PRO_Ere_Mercenary:"雇佣兵的契约"
 SUM_PRO_Ere_Mercenary_desc:"佣兵替教令院押运货物，也替沙漠里的部族押运武器。"
 SUM_PRO_Ere_Revolt:"起义的传闻"
 SUM_PRO_Ere_Revolt_desc:"沙丘间传来起义的传闻，镀金旅团开始聚拢。"
 SUM_PRO_Ara_Song:"兰那罗的歌"
 SUM_PRO_Ara_Song_desc:"兰那罗在雨林深处唱歌，只有孩子能听见。"
 SUM_PRO_Ara_Rana:"拉娜的失踪"
 SUM_PRO_Ara_Rana_desc:"巡林官拉娜失踪了，据说她跟着兰那罗走进了梦的世界。"
 SUM_PRO_Ara_Vana:"梦的世界"
 SUM_PRO_Ara_Vana_desc:"兰那罗把梦的世界摊开在巡林官面前，那里还留着大慈树王的影子。"
 SUM_PRO_The_Choice:"前路的抉择"
 SUM_PRO_The_Choice_desc:"三条路摆在须弥面前：迎回神明，把权力交给学者与沙漠民，或者把造神计划做完。"

 SUM_Neo.1.t:"花神诞祭的钟声"
 SUM_Neo.1.d:"花神诞祭的钟声在须弥城响起。教令院的高塔之下，人群与学者分立两侧，没人说出那个所有人都知道的事实，草神仍被锁在净善宫。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。高塔投下的影子越来越长，傍晚时就盖住了半条街。沙漠与雨林的商队第一次在同一处歇脚，彼此隔着篝火，谁也没有先搭话。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。—— BY 荷花酥"
 SUM_Neo.1.a:"遵循教令院的旧例"
 SUM_Neo.1.b:"听雨林与沙漠的声音"
 SUM_Neo.2.t:"大贤者的影子"
 SUM_Neo.2.d:"大贤者阿扎尔在议事厅里独自决定须弥的走向，六大学派的首座只是列席。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。高塔投下的影子越来越长，傍晚时就盖住了半条街。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。沙漠那边的商队听完消息，没有停下脚步，只把货单上的价码又抬了两成。商路上多了几处岗哨，过路的人要多交一笔说不清名目的钱。六大学派的首座们在议事厅里坐了整个下午，散会时没有一个人先开口。"
 SUM_Neo.2.a:"把卷宗封存"
 SUM_Neo.2.b:"把卷宗摊开"
 SUM_Neo.3.t:"六大学派的座次"
 SUM_Neo.3.d:"生论、素论、知论、明论、因论、妙论，六派各有心思，座次之争就是权力之争。有学者把这句话抄在食堂的墙上，第二天就被人刮掉，可抄的人越来越多。雨季提前来了，雨水顺着净善宫的台阶往下淌，把清洁工的脚印抹得干干净净。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。"
 SUM_Neo.3.a:"按学者的判断行事"
 SUM_Neo.3.b:"按自己的判断行事"
 SUM_Neo.4.t:"禁书令"
 SUM_Neo.4.d:"教令院颁下禁书令，凡涉及赤王、禁忌知识、世界树记忆的卷宗一律封存。巡林营的柴火快烧完了，提纳里说再往深处走就没有回头的路。教令院发下的公文措辞温和，可落款处的印章比往常大了半圈。有学者把这段写进笔记，末尾加上一句：事情的走向，取决于先动手的是谁。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。教令院的门槛这几天被踩得很低，进去的人比出来的人多。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。"
 SUM_Neo.4.a:"遵循教令院的旧例"
 SUM_Neo.4.b:"听雨林与沙漠的声音"
 SUM_Neo.5.t:"巡林官的报告"
 SUM_Neo.5.d:"巡林官提纳里递上报告，死域正沿着禅那园的低地蔓延。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。有人把传单塞进学者的书袋，被翻阅时已经皱得不成样子。虚空终端推送的每一条消息都一模一样，人们开始互相打听彼此听见了什么。高塔投下的影子越来越长，傍晚时就盖住了半条街。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。"
 SUM_Neo.5.a:"把卷宗封存"
 SUM_Neo.5.b:"把卷宗摊开"
 SUM_Neo.6.t:"被遗忘的病"
 SUM_Neo.6.d:"柯莱身上的魔鳞病被人再次提起，没人愿意承认它与禁忌知识有关。禅那园的守夜人换了岗，新来的年轻人问了几句不该问的话。港口的船比去年少了三成，船主们说风向不对，只是生意不好做。阿如村的老人把这件事讲给孙辈听，讲的时候没有添油加醋，孩子们却听得入了神。公告贴出三天，净善宫的门依旧关着，只有送饭的侍从进出，谁也不肯多说一句。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。城里的钟楼修好了，报时的声音比旧钟低了些，听着像叹气。"
 SUM_Neo.6.a:"按学者的判断行事"
 SUM_Neo.6.b:"按自己的判断行事"
