 # ---- 六块部族异议国策树的国策说明 ----
 NAT_Plenty_Dissent_Sprouts_desc:"§Y沃陆之邦§! · §R异议初萌§!\n\n黑曜石田垄里，纳塔税吏翻开账册，对着颗粒果的数目看了半日，越看越不对。他不肯声张，只把那页折了个角。沃陆长老们早已瞧出，却不点破，只把新收的种子一袋袋封进自家仓廪，钥匙攥在自己手里。税吏问起，长老只笑，说年成不好，留些种子备荒。税吏走后，老酋对着仓门坐了半晌，末了说一句：「这账，得先问过谷里的祖宗。」"
 NAT_Plenty_Border_Council_desc:"§Y沃陆之邦§! · §R边民议事§!\n\n焱庭议事厅的石门开得慢。边界的栅栏刚重新丈量完，沃陆所遣之人挟着一卷绳尺，坐到末席。火神抬手，只准他旁听：「听可以，开口不必。」名册摊在案上，书记官低头一笔一笔记名。那人盯着自己那三个字看了半晌，末了把袖里的绳尺搁在案角，起身时袖子带倒了笔架，墨洇了半页。"
 NAT_Plenty_Unruly_Elders_desc:"§Y沃陆之邦§! · §R不驯族老§!\n\n三位不肯进京的老人，在山口架起火堆，说要「把话讲完再走」。后生辈嫌其太慢，纳塔嫌其太狂。老人把火拨旺，谁劝都不肯下山，只在山口守着那堆火，一守便是半月。后来谷里人上山送粮，看见三个老酋并坐，谁也不看谁，却谁也没走。沃陆的分裂，就从这堆不肯熄的火起头。"
 NAT_Plenty_Granary_Ledger_desc:"§Y沃陆之邦§! · §R谷仓私账§!\n\n谷仓的油灯点了两夜。族老把郡里的税册重抄一套，颗粒果的数目比纳塔账上多出三成。纳塔税吏翻到那页，指着数目问：「怎么多这些？」族老拨了拨灯芯，答：「记账的老规矩，历来如此。」税吏还要追问，族老却合上账册，吹熄了灯，只留一句：「明日再看，账在仓里，不在嘴里。」"
 NAT_Plenty_Riders_Self_Raised_desc:"§Y沃陆之邦§! · §R骑手自募§!\n\n马市上多了几个生面孔。沃陆骑手各出份钱，自挑马匹，自选头领，再不等纳塔的征召令。头领把缰绳往马颈上一绕，对众人道：「马是我们买的，人是我们挑的。」有人问名册怎填，他笑：「名册上还是纳塔的兵，饷银嘛，直接发到族里。」言毕翻身上马，一队蹄声碎响，出了马市。"
 NAT_Plenty_Oath_Of_Abundance_desc:"§Y沃陆之邦§! · §R丰饶誓约§!\n\n六位谷地祭司于田垄边站成一排，各捧一把新收颗粒果，对炉火立誓：丰年纳塔取三成，歉年纳塔开仓。纳塔使者于契上按手印，签毕便要收笔。六祭司中年最长者伸手按住契纸一角，抬眼曰：「签归签，税官留下，收成须亲眼看着。」使者笔尖顿了顿，终究将税官留下。老祭司将那把颗粒果撒入田中，转身领税官往谷仓行，一路行数仓门封条，末了止于第三仓前，伸手按了按封条，方推开仓门令税官入看。"
 NAT_Plenty_River_Gate_desc:"§Y沃陆之邦§! · §R河关自守§!\n\n河关的铜钥匙换了个口袋。从前挂在纳塔税官腰间，如今攥在沃陆守卒手里。货照过，税照收，只是何时开闸，改由沃陆说了算。纳塔的商队头一回在关外扎营，赶车的蹲在闸边问：「几时放我们过去？」守卒把钥匙在掌心掂了掂，只答：「等上头的话。」说完插上门闩，日落前再没开闸。"
 NAT_Plenty_Granary_Court_desc:"§Y沃陆之邦§! · §R谷仓法庭§!\n\n族老们搬来石磨、断粮与婚契，在谷仓里搭起公堂。沃陆人自家争执，不再送往纳塔焱庭，一桩一桩都在谷仓了结。纳塔使者来过一回，立在门槛外看了半晌，回去照实说了。焱庭这才认下：这块地方，自家断案。"
 NAT_Plenty_Sovereign_Harvest_desc:"§Y沃陆之邦§! · §R独立农令§!\n\n火山灰下的田里，新旗插得齐整。沃陆当众宣布：青草与颗粒果尽归族产，纳塔的份额改为岁贡。老农捧着一把麦穗，抖了抖灰，对围观的人道：「从前交的是租，如今叫贡，名头不同了。」族中长者接过麦穗，把最小的那面旗插进穗堆里。风吹过，灰扬起来，旗角在麦浪里一闪一闪。"
 NAT_Plenty_Separation_Petition_desc:"§Y沃陆之邦§! · §R分宗陈情§!\n\n陈情书递到圣火台下，火神印玺迟迟不落。沃陆族老并不催，回到谷里就动起手来：搬石的搬石，垒台的垒台，另起了一座圣火祭坛。有人问印玺还没盖，急甚么。老酋拿石灰在台基上划了道线，道：「印是他们的，火是我们自己的。等他那日下来，这边早烧起来了。」说罢把第一捆柴丢进坛里。"
 NAT_Echoes_Dissent_Sprouts_desc:"§Y回声之子§! · §R异议初萌§!\n\n锻炉里的火色发了浑。回声之子匠人捞起一锭燃素，用锤背一敲，渣子簌簌往下掉。他把渣捧给旁边老匠看，低声道：「这杂质，是我们自家炉里的熔渣。」老匠不接话，只把炉门掩上，压低声音：「火神的耳朵，怕是听不清我们这边动静了。」话音未落，隔壁炉也停了锤，一时满坊只听余火噼啪。"
 NAT_Echoes_Echo_Trial_desc:"§Y回声之子§! · §R回响试炼§!\n\n熔炉旁摆开了试炼。长老把一块铁丢进炉里，撂下话：「谁锻得出与圣火同色的刃，谁就够资格对焱庭说不。」学徒轮番抡锤，锤声一记比一记响。围着的匠人却不喝彩，反倒越看越静。末了长老从灰里钳出那块铁，断口暗红，他摇摇头，重新塞回炉中，锤声又在石壁间撞了一声。"
 NAT_Echoes_Off_Nest_Song_desc:"§Y回声之子§! · §R离巢之音§!\n\n一队学徒卷了锻炉图样，趁天没亮离了巢，去纳塔边镇自建工坊。守巢的老匠追到山口，只喊了一句：「去赚辛苦钱，别忘了炉子怎么生。」领头的学徒回头拱手，没接话。纳塔那边却把这事记了一笔，文书在册上写「技艺外泄」四字。山口之风卷起图样一角，学徒伸手按住，转身没入雾里。"
 NAT_Echoes_Own_Forge_desc:"§Y回声之子§! · §R自铸兵刃§!\n\n第一炉族属兵刃出了炉。匠人把刀身按在石台上，撒下盐粒试纹，锻纹清清楚楚是回声之子的旧纹章。纳塔的验械官走来，要照焱庭炉温之格登记，匠头把刀往鞘里一插：「炉温是我们自己的，武备册上不必有它。」验械官还要争，匠头已提起铁钳，回炉再锻。刀身旧纹章旁另刻了一道细痕，像圣火纹，又不是。"
 NAT_Echoes_Duel_Judgement_desc:"§Y回声之子§! · §R决斗判词§!\n\n族里以决斗断是非的旧规矩，被一笔一画写成了成文法。纳塔的法官与族中长老同席而坐，一个翻律条，一个按剑柄，谁也没低头。案上的判词誊了两份，各执其一。法官搁下笔，道：「此法你我都认？」长老把剑柄一按，应：「各认各的。」说完卷起自己那份判词，起身离席，衣角扫过案沿，两份纸错开半寸。"
 NAT_Echoes_Resonance_Oath_desc:"§Y回声之子§! · §R共鸣誓约§!\n\n回声之子锻炉一字排开，火头齐往上蹿，锤声落得似一人所打。族长拿铁钳敲炉沿，对纳塔所派监炉官曰：「锻炉轰鸣，须同圣火一个节拍，此誓我等认。」监炉官翻开册子，言纳塔所给燃素配额按每炉报火而定。族长将炉门拉开一线，火光映面，报一数：「三成。」监炉官笔尖悬着，抬眼看他。族长复将炉门推严，回身朝匠人略一颔首，匠人会意，将锤举过头顶，待同一声号令齐落。"
 NAT_Echoes_Cavern_Seats_desc:"§Y回声之子§! · §R石窟议席§!\n\n熔岩洞里凿出了阶梯座。族人不焚香炉，只把炉渣堆在正中点燃，青烟贴着石壁走。议事的人各据一阶，开口时声音在石壁间来回撞，一声能变两三声。纳塔的使节坐在最下一阶，仰头看那烟气，低声对旁人道：「焱庭穹顶下，可没这么响。」话没说完，上头一位长老拍了拍扶手，满洞的话音便又被顶回他脸上。"
 NAT_Echoes_Disobedient_Song_desc:"§Y回声之子§! · §R不臣之歌§!\n\n市集上飘起一支没词的歌。调子是回声之子老调，唱的人不认得词，只记住了拐弯那几处。一个货郎边捆柴边哼，旁边挑水的跟着和。纳塔监察官挤在人群里，掏出册子，把今日唱和的地点又记一笔。歌歇了，货郎却还在哼那半句，监察官的笔尖悬在册页上，等他哼完，才落笔添下一个「又」字。"
 NAT_Echoes_Dragon_Blood_Claim_desc:"§Y回声之子§! · §R龙血宣告§!\n\n锻炉前，族中老匠当众卷起袖子，露出一道旧疤，宣告大匠的血脉承自铸龙的余烬，不该由圣火来裁定。纳塔的判官问：「凭据何在？」老匠把那道疤亮了亮：「这便是凭据，炉火认得。」旁人虽拿不出实证，腰杆却都直了起来。判官还要追问，老匠已放下袖子，转身把炉门拉开，火光映着满坊挺直的背。"
 NAT_Echoes_Separation_Petition_desc:"§Y回声之子§! · §R分宗陈情§!\n\n陈情送到圣火台，回声之子要的是自铸之宗：武备自筹，匠人不入焱庭。递书的长者回来时，甚么也没说，径直走到锻炉前，添了一铲炭。炉火腾地窜高，映得他半边脸发红。有学徒问：「答复几时来？」长者拿火钳拨了拨炭，道：「火这样烧着，便是等答复。」锤声重新响起，一下比一下沉，炉口的热气扑得人后退半步。"
 NAT_Springs_Dissent_Sprouts_desc:"§Y流泉之众§! · §R异议初萌§!\n\n航道图上多出一条支流。流泉舵手拿指节点了点那道墨线，说这是三十年前的旧航路；纳塔税官凑近看了半日，咬定是走私航道。两人各执一词，谁也拿不出三十年前的航海志。税官收了图要走，舵手把螺号往腰间一别，追出两步：「图是死的，水是活的，你去峡口问问浪。」说罢转身跳上舟，撑篙去了。"
 NAT_Springs_Spring_Council_desc:"§Y流泉之众§! · §R涌泉会盟§!\n\n六条支流各遣一人于泉眼边会盟，立下规矩：每处水源的取用量，按村落人数摊派。纳塔的官员被请来旁听，听完却不走，蹲在泉边看那水汩汩往外冒。有人问他还要听甚么，他掬了一捧水，道：「我看着这水，怕你们摊着摊着，把账也摊到关卡上。」众人相视一笑，把水规刻在泉边石板上，錾子敲了整整一下午。"
 NAT_Springs_Rivalry_desc:"§Y流泉之众§! · §R逐浪之争§!\n\n两支船队在峡口顶上了。族里的老规矩是先到先得，纳塔的新规矩是统一调度，各说各有理。峡口的浮木横着拦了三天，这边不走，那边也不让。第三天头上，老舵手把篙往石缝里一插，坐在舟头不动，对面船上的头目也抱臂坐着。日头偏西，浮木上的水草晒得打卷，两船依旧纹丝未动，只有浪一下下拍着船帮。"
 NAT_Springs_Own_Waterwheel_desc:"§Y流泉之众§! · §R自筑水轮§!\n\n流泉之众自筹木料，在溪上立起一架水轮，水势带动磨坊，也带动锻锤。纳塔之匠师来量一圈，摇头道：「这般出水，工效反低。」族里匠人正拿楔子紧轮轴，头也不抬：「低就低些，轮子归我们转。」匠师还要争，匠人把楔子一敲，水轮吱呀转起来，水花溅上匠师之靴面。他退开半步，没再说话。"
 NAT_Springs_Torrent_Drill_desc:"§Y流泉之众§! · §R激流操练§!\n\n峡口的激流成了练兵场。族中青年赤着脚在湍流里撑篙，绳索在腰间绕了三圈，浪一扑人就矮半截。纳塔的教头在岸边皱眉：「这本事，到了浅滩一点用没有。」领头的青年抹了把脸，回道：「我们偏不在浅滩快。」说罢纵身跃上一段横木，借着水势荡过去，稳稳落在对岸石上，绳梢还在滴水。"
 NAT_Springs_Spring_Oath_desc:"§Y流泉之众§! · §R涌泉誓约§!\n\n流泉之众族长于滩头一平石上签了誓约，身边围着数管船者。誓约念及水脉养护与航道安全由族内自负，众人皆点头。轮到末句「战时征调权」，执笔书吏将字缩得极小，几挤入纸缝。族长瞥一眼，问：「写这么小，是怕谁见？」书吏低声曰：「怕吾等自见。」族长不复言，探手取印，于那行小字旁按下一枚，印泥正盖住半个战字。乃卷起誓约，塞入随身皮筒，转身跃上候在一旁之舟。"
 NAT_Springs_Boundary_Redrawn_desc:"§Y流泉之众§! · §R界碑改道§!\n\n主航道界碑被挪了三百步。新位置让每处泉眼取水都近了些，纳塔关卡却落到下游。碑面朝水那一侧刻痕还是新的，石屑沾在凹处没冲净。纳塔巡关人乘舟来看，绕碑转了一圈，伸手摸那刻痕，指腹沾了灰。他正要开口，上游放排号子顺水传来，排头直接从碑边擦过，没停。"
 NAT_Springs_Rip_Crown_desc:"§Y流泉之众§! · §R逐浪之冠§!\n\n一年一度的逐浪赛到了。族里选出的竞渡队不请纳塔裁判，发令的是自家祠堂长者。号旗一落，十几条舟劈开水，浪头打上船舷。纳塔的官员立在岸边看完全程，没处插手。夺了冠的队伍把彩带捧回祠堂，高高挂起，带梢垂下来扫着供桌。官员在岸上拍了拍袖上水珠，转身走了。"
 NAT_Springs_Kinetic_Proclamation_desc:"§Y流泉之众§! · §R凌波宣告§!\n\n流泉之众当众宣告：本族水路本族自管，凡经流泉水道者，一概纳族税。消息传到纳塔，一队战船试着闯关，在峡口被横索拦住。守卡的舵手立在船头，举螺为号：「过路，纳税。」纳塔的将官在船上僵了半晌，末了命人取出钱袋抛过去。舵手接住，掂了掂，侧身放索，战船这才缓缓穿过峡口。"
 NAT_Springs_Separation_Petition_desc:"§Y流泉之众§! · §R分宗陈情§!\n\n陈情递上圣火台，流泉之众要的是涌泉之宗：航道与水权，尽归族内。递书的使者回到泉边，把文书念给众人听。念完，泉眼里咕嘟冒出一串水泡，回声在洞里撞了几撞，比往常响。使者把文书卷起，往泉边石缝里一塞，道：「这便是回话了。」众人散去，只剩那水泡依旧一串串往上涌，撞碎在石沿上。"
 NAT_Canopy_Dissent_Sprouts_desc:"§Y悬木人§! · §R异议初萌§!\n\n树冠上系满了布条，颜色杂，不属于任何图腾。悬木人的年轻猎手一边系一边说：「这是记路，回头好认。」纳塔的巡林官仰头看了半日，冷声道：「那是叛旗。」猎手没争，只把布条又紧了紧，在枝桠间打了个活结。巡林官正要再问，林子里窜出一只幼兽，撞歪了其中一条。两人一同看那布条在风里翻，谁也没再开口。"
 NAT_Canopy_Canopy_Council_desc:"§Y悬木人§! · §R树冠议所§!\n\n议所搭在离地三十丈的枝桠上，上去半截梯子便被人抽走，欲上者须先学会不惊动下层的幼兽。纳塔使节在梯口候了许久，鞋底磨着树根，几番想攀，都被上头一句话按住：「轻声，别踩着窝。」末了议所放下一根藤索，使节抓住往上爬，才探出头，脚边幼兽窸窣一响，他整个人便僵在半空。"
 NAT_Canopy_Felling_Dispute_desc:"§Y悬木人§! · §R伐木之争§!\n\n划为可伐的林子里，偏偏长出一片树苗。纳塔伐木令摊开在树桩上，写着按图作业；族老伸手指那片绿，道：「按图的是二十年前的图。」斧子举起来，又放下。纳塔领头人拿图比了半晌，到底没劈下去。族老蹲下身，把一棵幼苗扶正，培了把土。斧头就搁在旁边树桩上，刃口还朝着林子，一整日没动。"
 NAT_Canopy_Saurian_Raising_desc:"§Y悬木人§! · §R驯兽自养§!\n\n悬木人不再把幼兽送归纳塔兽栏，在树冠上另辟一片驯养场。藤网围着枝桠支开，兽群在里头窜，数目在账外一天天多起来。纳塔账本上，那一栏还停在旧数。管场的猎手趴在藤边数崽子，数到一半，被一只扑上来的幼兽拱了个跟头。他笑着把它拎回网里，顺手又补一道藤，账本之事遂置之脑后。"
 NAT_Canopy_Ancient_Name_Private_desc:"§Y悬木人§! · §R古名私授§!\n\n古名的授予不再经过焱庭。族中长者把新战士带到一棵枯木下，四周无人，他低声念出那个名字，风过枯枝，像有人应了一声。战士跪着接了，起身时眼眶发红。纳塔的名册上，从此没有他这一条。长者用指甲在枯木上划了道浅痕，道：「名字记在这儿就够了。」转身时把那截断枝折断，揣进怀里。"
 NAT_Canopy_Canopy_Oath_desc:"§Y悬木人§! · §R树冠誓约§!\n\n悬木人藤桥架于林冠之上，族长踩晃悠悠之索行至对岸，回顾纳塔使者曰：「树冠以上不设汝之税关，此乃说定。」使者问观察者奈何，族长解腰间斧，连同刀一并掷入树下草丛：「人汝可派，兵刃不许带。」使者只得应下。契按毕手印，族长割断一段藤索，任其垂下作界。后来兽群果未再越此界，亦无一头下来。守林少年蹲藤桥头，将白日拾得之一根兽毛搁于树杈，抬手把界索复拧紧半圈。"
 NAT_Canopy_Forest_Patrol_desc:"§Y悬木人§! · §R林道自守§!\n\n巡林队换成了族中子弟，路线一天天往族里的猎场偏；纳塔的巡逻表却往矿脉那边靠。两下里各画一张舆图，摊在树桩上对，都说自己覆盖了全部。族里的领队拿炭条在猎场那块重重圈了一圈，纳塔的巡官在矿脉那块也圈了一圈。圈完谁也不肯擦，两张舆图就势叠在一处，炭印透到下面那张上，谁也盖不住谁。"
 NAT_Canopy_Rite_Autonomy_desc:"§Y悬木人§! · §R秘仪自立§!\n\n悬木人祭坛搭于最高那根树杈，族中祭司以龙血涂古名，一遍遍念大祭之词。纳塔所派祝祷官立于树下，仰候该自己接之段，不禁喊曰：「上头，该吾念矣。」祭司念毕，自始至终未停，亦未回顾。祝祷官复候片刻，见上面之人收了龙血瓶，只得将祝词折起揣回袖中。祭司供古名于树洞，对林子低声曰：「只念此一遍。」风将话送下，祝祷官听见了，正欲讨个回话，上面却再无声息。立原处，将袖口那张祝词捏了捏，转身下藤梯而去。"
 NAT_Canopy_Canopy_Proclamation_desc:"§Y悬木人§! · §R林冠宣告§!\n\n悬木人宣告：树冠之上一律自治，凡纳塔的官员持械入林者，视为侵林。林道口立起了新牌子，木面上刻着牙，一排尖齿在树影里明明灭灭。纳塔的巡官带人走到牌前，伸手摸那刻痕，被上头一声喊住：「再往前，就当你是来犯的。」巡官收回手，抬眼看见枝桠间全是眼睛，一行人默默退了回去。"
 NAT_Canopy_Separation_Petition_desc:"§Y悬木人§! · §R分宗陈情§!\n\n陈情书用兽筋装订，据说是古法。悬木人要的是林冠之宗：山林与秘仪，尽归族内。递书的长者把文书搁在树根上，兽筋在风里绷得紧紧的。纳塔的接书人拿手指拨那筋绳，问：「这也能传久？」长者道：「兽筋晒干比皮还韧，绑过猎弓的。」接书人还想再问，长者已攀上藤索，几下没了影，只余那卷文书留在树根上。"
 NAT_Flower_Dissent_Sprouts_desc:"§Y花羽会§! · §R异议初萌§!\n\n驯龙骑士的翅膀被要求卸下检视。花羽会答应得慢，一个接一个解扣，偏有一人始终站在龙背上不肯下来。纳塔的检视官仰着脖子喊：「下来！」那人只把披风拢紧，稳稳立在鞍上。龙微微振翅，带起一阵风，吹得检视官的册页哗哗翻。他头一回见到不落地的抗议，笔悬在半空，到底没落下去，只把那人的模样记在心里。"
 NAT_Flower_Feather_Council_desc:"§Y花羽会§! · §R羽冠议盟§!\n\n六族之会开在云层之下的浮空台上，议题只有一条：还受不受纳塔的检视。表决时，一票对零票。唯一的那一票，是族长的，她弃了权，把羽冠往案上一搁，道：「我不投，是这事该你们自己定。」众人面面相觑，没人接话。浮空台在云上轻轻晃，那顶羽冠搁在案角，被风掀得转了半圈，谁也没伸手去扶。"
 NAT_Flower_Fallen_Feather_desc:"§Y花羽会§! · §R坠羽之争§!\n\n一头龙坠在云带边上，纳塔猎队与族中驯兽师同时赶到。一个说先摸龙角，一个说先拽缰绳，自日中争到日落，谁也不让。正争间，那龙抖了抖翅，竟自飞起，掠过浮空台，转眼没入云里。两人仰头看着，争了一日的话卡在嗓里。驯兽师低头看地上那道拖痕，纳塔猎队也看，痕子一直拖到崖边，断了。"
 NAT_Flower_Dragon_Riders_desc:"§Y花羽会§! · §R驯龙自募§!\n\n花羽会自筹驯龙骑士薪饷，名册上多出几十个未曾经纳塔点验的名字。点验官持旧册来核，越核眉头越皱：「这些名字，何处来的？」管名长老把新册一合：「飞得起来的，都算。」点验官还要再说，头顶忽然暗了一片。一群翼影掠过日头，比去年密了一倍。他抬头数了数，没数清，只得把旧册夹在腋下走了。"
 NAT_Flower_Own_Airspace_desc:"§Y花羽会§! · §R空域自划§!\n\n族中长老在几处云带上插了自己的旗。纳塔的飞行执照要求空域统一，文书送到浮空台，长老接过看也不看，转身又命人把旗往更高处插。使节急了：「再高也不算数。」长老手搭凉棚望那旗，道：「你管你的执照，我插我的旗。」使节还要争，一只龙恰好从旗边掠过，翅风把旗面卷得猎猎作响，话就淹在那声响里了。"
 NAT_Flower_Wing_Oath_desc:"§Y花羽会§! · §R羽翼誓约§!\n\n花羽会族长立于高塔木栏边，肋下夹一卷羽书，肩头立一只青羽龙。不急着念，先低头扶正羽冠，方展卷轴。塔下站满驭龙之人，末了尚有数童仰头。族长开口曰：「空域巡守，自今日起由我花羽会一族担之。」底下有人应了一声。念及「战时征调权」四字，声顿住，指节在卷轴上捏得发白，青羽龙亦扭头看他。停半晌，终究照念下去。塔顶风大，卷角被吹翻起，伸手按住，将末一字读完，随即卷起羽书，掷与身旁传令者。"
 NAT_Flower_High_Tower_desc:"§Y花羽会§! · §R高塔自持§!\n\n塔身又加高了一截，已盖过焱庭的观礼台。匠人蹲在塔顶收最后一圈藤索，风把他的衣摆吹得猎猎响。他眯眼往下望，纳塔的国界线画得细细一道，从塔上望下去清清楚楚；再看自家族中画的巡逻之地，圈比那道线足足大了三圈，几乎把半边云海都圈了进去。他拿炭笔在界线上补了一笔，自言自语：「这道线，该往这里挪。」底下有人应了一声：「先量好再动，莫叫飞鸟也迷了路。」匠人应着，把炭笔别回耳后，又低头去看那根系塔的藤索紧不紧。"
 NAT_Flower_Feather_Edict_desc:"§Y花羽会§! · §R羽书自立§!\n\n族里的羽书又发下去了，一式三份，写得一模一样。传令的鹰主把一份悬上塔顶，风一吹，羽片在梁上打转；一份锁进族库的木匣，钥匙交给库吏；最后一份卷好，交给去纳塔的信使。信使背着羽囊赶了三日路，到纳塔衙门时，那份羽书被压在卷宗最底下，墨迹都快干了。他递上去，管事的礼官翻了翻，只说一句晓得了。信使回来学给众人听，一座人都笑。鹰主把塔顶那份取下来看了看，角上被鹰啄了个小洞，他拿另一片羽补上，重新悬好。"
 NAT_Flower_Skybound_Proclamation_desc:"§Y花羽会§! · §R翱翔宣告§!\n\n花羽会把宣告刻在塔前的石板上：云上之域，一律自治；纳塔的飞行器要升空，先来族里讨许可。告示刚立，纳塔的飞器队便到了塔下，一排排停着，螺旋桨卷起的风把石板上的刻屑都吹跑了。带队之头目抬头看看高塔，又低头看看那行字，问身边人：「这许可，找谁领？」身边人摇头。机队在塔下排了三天，第三天头上，倒先来了一位花羽会的鹰主，肩上立着青羽龙，绕着机队飞了一圈，落下来说话：「许可好说，先把你们的桨停一停，别惊了龙。」头目挥手叫人熄了火。"
 NAT_Flower_Separation_Petition_desc:"§Y花羽会§! · §R分宗陈情§!\n\n陈情书是连夜写的，笔是龙翼上的羽，蘸了墨在皮纸上沙沙地走。写完了，几个长老传着看，指头在「翔羽之宗」四个字上按了又按，空域与驯龙都要收归族内，一个字也不肯让。第二日一早，长老捧着皮纸去纳塔递交。纳塔的礼官伸手来接，指头一碰到那片龙羽，竟抖了一下，皮纸边角跟着颤。礼官忙把书接稳，低头看了半晌，才说容他呈上去。长老退出来，站在阶下拿袖子擦了擦额角。风从塔那边过来，把他怀里另一份抄本的封角掀了起来，他伸手按住。"
 NAT_Nightwind_Dissent_Sprouts_desc:"§Y烟谜主§! · §R异议初萌§!\n\n纳塔贴出告示，灵谜涂鸦不许再上墙。告示的墨还没干透，烟谜主的巫首夜里就带着人出了门，沿街走，手里捏着炭条。第三天清早，纳塔人推开窗，四面墙上的旧图案竟都在，一笔不差，只是每一处的角落里都多画了一个小小的问号，像是谁替那些图案添了句反问。巡逻的兵丁数了数，一条街数出十几个，数到后来潦草收了本子。巫首蹲在巷口，看那问号被晨光照着，拿指腹蹭了蹭炭痕，站起身，把炭条塞回袖里。"
 NAT_Nightwind_Night_Council_desc:"§Y烟谜主§! · §R夜风密议§!\n\n此会开在夜里，地点一晚一换，从不重复。第一晚在山洞，第二晚挪到废弃的磨坊，第三晚干脆在河滩的乱石堆里。纳塔的密探跟了三晚，每回都躲在暗处盯着，第三晚跟到河滩时，只见一堆冷灰和几只倒扣的碗，人早散了。他回报上去，上司问他第四晚如何。密探说，那一晚的会开在风里。上司不信，亲自带了人去，夜里守在山口，风声一阵紧过一阵，除了风甚么也没等着。第二日一早，他们在自己营帐的门帘上，看见用烟灰画的一道弯，像是谁替他们签了到。"
 NAT_Nightwind_Rite_Strife_desc:"§Y烟谜主§! · §R秘仪之争§!\n\n烟谜主秘仪堂中烟雾不散，年轻祭司将一卷涂鸦摊于案，手指点着上头烟纹曰：「秘仪乃全族之物，谁皆该学。」老祭司蹲火盆边拨灰，头亦不抬：「秘仪只归会秘仪之人，他人学了亦不懂。」二人你一句我一句，自掌灯争至天亮，案上灯油熬干一盏。年轻祭司嗓哑，抓炭笔于涂鸦旁添一笔；老祭司看一眼，亦伸手在那笔旁补一圈。二人皆不复言。天光自窗缝漏入，照见那团烟纹上多出两道印子。"
 NAT_Nightwind_Graffiti_Wards_desc:"§Y烟谜主§! · §R涂鸦自守§!\n\n涂鸦不再只是涂鸦。烟谜主把谜纹一笔一笔描进街巷墙根与拐角，纹路连成一片，纳塔巡逻一踏进去，便辨不清东西南北，绕了半宿又绕回原地。有一队兵丁不信邪，举火把要照地图穿过，走了三趟，火把都烧短一截，还站在那堵画满纹的墙前。族里有人问这些纹是谁描的，在场者皆摇头，说不知，手却都往袖里缩。再没人问第二遍。末了一老者拄杖经过，抬手把墙角一处断纹补上，补完，拄杖慢去。"
 NAT_Nightwind_Night_Raid_desc:"§Y烟谜主§! · §R夜行封锁§!\n\n一夜之间，六条商路同时断了。无一队士兵拦路，也无一声铳响。天亮时赶路的商队到了岔口，才见每个路口的石碑上都画着同一个问号，炭痕还新。领头的把马勒住，跃下马拿手去摸，指头沾了一层黑。他叫人绕道，车队便调头往山那边走，一路走一路回头看那问号。纳塔粮道被迫绕行，运粮的车多走两日路程，粮袋在车上颠得漏了口，米撒一路。押运之吏蹲在路边，拿手把漏出的米一粒一粒拢回袋里，抬头又望了望那画着问号的岔口。"
 NAT_Nightwind_Riddle_Oath_desc:"§Y烟谜主§! · §R谜誓之约§!\n\n纳塔差役来取誓书，烟谜主老人递过的却是一张画。差役翻来覆去视之半日，只见烟里浮着几笔歪扭涂鸦，问他所写何物，老人但笑：「答案嘛，本族之人方解得开。」差役不肯走，必要一文字凭据。老人便将画铺平，自蹲下，用炭条于角上添一记号，算是落款。差役捧画退出门，途中复展开看，风将画角掀起，那几笔烟纹被吹散了形，他愈认不出。"
 NAT_Nightwind_Own_Rites_desc:"§Y烟谜主§! · §R秘仪自传§!\n\n焱庭大典照旧开，纳塔所派祭司立于阶上念祝词，念得字正腔圆。阶下却空一席，席上摆一只旧面具，三年无人来动。一年轻祭司低声问旁人：「那位何故犹不来？」老祭司将指竖于唇边，不令他往下说。祝词念毕，纳塔祭司收笏板下阶，那空席前有人默默添一盏水，复点一撮烟。烟直直上行，不改道，亦不往焱庭方向偏。"
 NAT_Nightwind_Spirit_Riddle_Autonomy_desc:"§Y烟谜主§! · §R灵谜自立§!\n\n纳塔官员持抄本寻至烟谜主画墙，指一行灵谜涂鸦要个说法。画墙下族人擦了擦手，曰：「这解释权归吾族，大人所读者乃谜面，旁的没有。」官员皱眉，问头一条解的是甚么。那人便在墙上指与他看：一个歪歪之钩。官员问答案奈何，那人也笑，照样画一钩。官员没奈何，回身于自己册上落笔，写至末了，笔尖迟疑一下，落下仍是一钩。"
 NAT_Nightwind_Nightwind_Proclamation_desc:"§Y烟谜主§! · §R夜风宣告§!\n\n烟谜主的宣告写在烟灰里，风一过就散，可第二天各处都传遍了：夜风所及之处，皆是族域；纳塔的官员若要夜行，先来族里领一枚符印。第一位不信邪的使节夜里出门，没走多远就被两个裹灰袍的人拦下，问他要符印。使节拿不出，被客客气气请了回去，一路送回焱庭，连马都给喂了料。他回衙门复命，脸涨得通红，说对方礼数周全，挑不出错处。听的人都笑了。当值的礼官拿起笔，在册子上把「夜行」两条划了，划完，吹了吹墨，合上册子。"
 NAT_Nightwind_Separation_Petition_desc:"§Y烟谜主§! · §R分宗陈情§!\n\n陈情书用灰纸写成，字是烟灰调的墨，封口处没盖章，只画了一个问号。烟谜主求以夜风之宗自立，秘仪与涂鸦尽归族内，这几条写在纸上，墨色淡得要凑近才看得清。递交那日，纳塔的礼官接过书，翻来覆去看了几遍，指尖在那个问号上顿了顿，抬起头想问话，对面几个裹灰袍的长老却只是拱手，谁也不开口。礼官没法，只得收下，照例写回执。写到末尾要落款，他盯着封口那个问号，笔悬了半晌，末了在回执上也描了一个同样的问号，算是回礼。"
 NAT_Dissent_NCP_Recapture:"讨平沃陆之邦"
 NAT_Dissent_NCP_Recapture_desc:"沃陆之邦谷仓上了锁。焱庭火炮推进谷口，炮架下压着新翻黑土。通告已下：交旗者不究，顽抗者就地正法。山民在田埂点起烽火，火光顺火渠一路烧过去。颗粒果未收，粮车不出，纳塔粮仓便成了别人的仓。"
 NAT_Dissent_NCE_Recapture:"克复回声之子"
 NAT_Dissent_NCE_Recapture_desc:"回声之子的锤停了，这是纳塔头一回听不见峡谷的锤声。焱庭火炮架上坡沿，对着炉口。通告已下：交旗者不究，顽抗者就地正法。山民在矿口点起烽火，火映在铁砧上，红得发暗。炉火一冷，军坊的兵刃便断了下处，须先重燃这口炉。"
 NAT_Dissent_NPS_Recapture:"收复流泉之众"
 NAT_Dissent_NPS_Recapture_desc:"流泉之众闭了闸。焱庭火炮顺堤一字排开，炮身映着水光。通告已发：交旗者不究，顽抗者就地正法。山民在栈桥上点起烽火，火苗被海风吹得斜斜。船都收进港里，帆落了，桅杆空立。海路一断，内陆的盐与铁便断了顿，这一闸须先砸开。"
 NAT_Dissent_NSC_Recapture:"讨定悬木人"
 NAT_Dissent_NSC_Recapture_desc:"悬木人既举叛旗，事便不再遮掩。焱庭火炮沿海岸一字排开，炮口尽指山隘。最后一道通告已下：交旗者不问旧罪，顽抗者就地正法。悬木人山民在山道点了烽火，火一处接一处往高处走。藤桥一断，粮道便绝，他们要用血来偿这堵路的账。"
 NAT_Dissent_NFF_Recapture:"征复花羽会"
 NAT_Dissent_NFF_Recapture_desc:"花羽会的旗换了颜色。焱庭火炮推到崖下，仰口对准高塔。通告一句：交旗者不究，顽抗者就地正法。山民沿山道点起烽火，火光一直排到云边。鹰哨响过三遍，龙群不肯落地。天上这道门既闭，纳塔号令便插不上翅膀，须先取回这座塔。"
 NAT_Dissent_NMN_Recapture:"靖平烟谜主"
 NAT_Dissent_NMN_Recapture_desc:"烟谜主把雾门关了。焱庭火炮沿山脚列成一线，只等一声令下。通告已送进雾里：交旗者不究，顽抗者就地正法。雾中无人应声，只在半夜里，山道两侧亮起一排烽火，火色发青。烟谜主向来只卖消息，此番却把消息断了，纳塔便断了耳目，须先破了这层雾。"
 NAT_Dissent_Recapture_tt:"以武力恢复统一：对已独立的部族正式宣战。"
 NAT_Abyss_Gate_Of_The_Unquiet:"不宁之门"
 NAT_Abyss_Gate_Of_The_Unquiet_desc:"§R深渊侵蚀§!超过 §Y100§! 之后，纳塔地脉深处那扇门，整夜发出低鸣。守夜人能听见：门后有物在数。数的是纳塔还剩几日。火神旧律越说此门永锁，越无人敢问一句：门后是谁在数。"
 NAT_Abyss_Descent_Of_Obsidian:"黑曜石阶"
 NAT_Abyss_Descent_Of_Obsidian_desc:"奥奇卡纳塔的地下水渠，被人凿开一道口子。岩浆在渠底凝住，结成黑曜石阶。自古斯托特被逐出深渊本体那一刻起，这些石阶便一路向下。无人知它通向何处，亦无人敢下去，量一量深浅。"
 NAT_Abyss_Tongue_Of_Embers:"余烬吐舌"
 NAT_Abyss_Tongue_Of_Embers_desc:"炉膛里的余烬夜夜发烫，凑近了听，那声音像有人隔着灰在说话。守炉的学徒起先以为是火神在传教诲，搬了张矮凳坐下，把耳朵凑到炉口。可那声音不再讲道理，只一个接一个报地名：泽塔、卡皮塔、众神的归处，报得又慢又清楚，像在点名。学徒拿炭在地上跟着记，记一个划一个。报到末尾，炉火忽然矮了一截，那声音安静片刻，又补上一句：「还有纳塔。」学徒手里的炭啪地折了，他盯着地上那几个字，半晌没动，末了伸手把「纳塔」两字抹平，起身把炉门掩上。"
 NAT_Abyss_Rite_Of_Hollow_Stars:"空星之祭"
 NAT_Abyss_Rite_Of_Hollow_Stars_desc:"夜神之国学者蹲于归火圣夜巡礼废墟中，拿刷一点点扫开浮土，自石板撬出一套星轨刻度。抹去灰，对光看，越看越不对：满盘星辰皆被人凿平，只余六处空洞，排得齐齐整整。旁人凑来数了数，低声曰：「此六处，恰是纳塔六座火山之位。」学者不答，以指腹在空洞里蹭了蹭，沾了一层黑。将石板扶正，末了自怀中摸出一粒燃素碎屑，搁在最近那个空洞上，己身却不敢松手。"
 NAT_Abyss_Pact_Of_The_Drowned_Forge:"溺炉之约"
 NAT_Abyss_Pact_Of_The_Drowned_Forge_desc:"铸造厂炉底积着几千年矿渣，从没人清过。新来的匠人拿铁钎往下捅，捅到深处，钎尖忽然一顿，带上来一层渣，颜色不对，不属于任何已知矿脉。老工匠叫他别声张，自己蹲下身，伸出手背去贴那层渣。渣是温的，像刚熄的炭。更怪的是，那一层随着远处火神某一下心跳明一明、暗一暗，竟像在喘气。匠人看得头发发麻，问：「这东西也算矿？」老工匠收回手，在围裙上擦了擦，摇头：「不算。它是活的。」说着把那层渣又用铲子盖回炉底，压了压，转身去封炉门。"
 NAT_Abyss_Column_Of_Six_Voids:"六柱擎虚"
 NAT_Abyss_Column_Of_Six_Voids_desc:"六座火山上各立一根黑柱，柱面被烟火熏得发亮。石匠奉命来拓族徽，一笔一笔描下：第一根是沃陆之炭，第二根是回声之锤，第三根是流泉之螺，第四根是悬木之藤，第五根是花羽之羽，第六根是烟谜之纹。六徽描完，他退后一步，却见每根柱子角上还留着第七个徽记，凿痕未磨平。那是纳塔旧徽，许久之前被人一锤一锤凿去，只剩个模糊轮廓。石匠拿手比了比那道凿痕，问身边看守：「这第七个，当初是谁凿的？」看守把手拢在袖里，只说年代太久，没人记得。石匠便把那轮廓也拓进纸里，卷好，转身下山。"
 NAT_Abyss_Covenant_Of_Drowned_Ancients:"溺者古盟"
 NAT_Abyss_Covenant_Of_Drowned_Ancients_desc:"深渊里有个声音，管古斯托特叫最年长的那个名字。古斯托特已记不清了，他在成为深渊本体之前的事，像被水泡烂的纸，一揭就破。那声音不厌其烦，一遍遍对他念一份溺者古约，念的是他自己早年立下的誓，字字都对得上，可他半点也想不起来。他打断那声音：「这约，是我立的？」深渊不答，只又从头念起，念到某一句时，古斯托特忽然只觉胸口发闷，像是那句话还压着当年的手印。他抬手按在胸口，指节抵着一处旧疤，听着那声音把古约念到末尾，才慢慢把手放下。"
 NAT_Abyss_Flame_That_Eats_Flame:"吞焰之焰"
 NAT_Abyss_Flame_That_Eats_Flame_desc:"纳塔的熔炉还烧着火，可那火已不是从前意义上的火了。老司炉守了半辈子炉子，头一回见这样的火：它不往上蹿，反往炉底里钻，像是把「燃烧」两个字翻过来念。他拿铁钩拨了拨，火苗躲开钩尖，贴着炉壁走。旁边小工问：「这烧的甚么？」老司炉说，是从深渊里打捞上来的燃料，一车一车拉回来的。小工不信，伸手想去够，被老司炉一钩子拦住：「别碰，它认生。」那团火听见似的，忽地缩成一点，稳稳落在炉膛正中。老司炉把炉门合上，从门缝里看那点火，半晌没挪眼。"
 NAT_Abyss_Harvest_Of_Burning_Soil:"焦土之获"
 NAT_Abyss_Harvest_Of_Burning_Soil_desc:"田土忽而渗油。农人初见，只当是雨水，伸手一沾，指头亮晶晶，凑到鼻前，却是一股熟识的油腥气。报与族中，管事的带人来看，当场拿桶接了半桶，说自今往后，纳塔不必再向外购一物。众人听了都松一口气，只有一个老农蹲在地头不出声。他记得上辈曾言，凡被采过的土，十年之内尽要变灰，且是图谱上查不出名目的灰。管事的拍拍他肩：「那是老话了。」老农不接，抓一把渗油的土攥在掌心，看油自指缝缓缓渗出，末了撒回地里。"
 NAT_Abyss_Living_Geology:"活地之理"
 NAT_Abyss_Living_Geology_desc:"勘测队在火山口架起钻机，钻了半日，取上来的岩心却是空的。领队不信邪，换个方位再钻，岩层竟自己错开半寸，把钻头让了过去。年轻的测绘员蹲在口子上看了半晌，忽然道：「它不是死的，它在躲。」众人一时无人应声。回到营里，领队把那截空岩心摆在桌上，对着地图想了一夜：既然地脉会躲，硬钻是钻不出来的，除非让它自己愿意往人要的地方长。第二日，他让人把钻机撤了，改在坡上埋下引火的铜管。"
 NAT_Abyss_Legion_Of_Recycled_Fire:"淬火之师"
 NAT_Abyss_Legion_Of_Recycled_Fire_desc:"纳塔战士从来不打仗，他们只在战后，把敌人送进淬火池。如今淬火池里出来的东西，仍记得上一场厮杀。这恰是深渊最擅长之事：不需收买任何人，只需读过他的记忆。"
 NAT_Abyss_Seers_Of_The_Deep:"深渊先见"
 NAT_Abyss_Seers_Of_The_Deep_desc:"从前要读一个人的灵魂，得请祭司唱还魂诗，唱上一整夜，还不一定读得准。如今不用了。夜神之国的祭司发现，深渊会主动把读到的那一部分寄回来，一封一封，像投递书信，拆开便是。有个年轻祭司不信，拿自己试了一回，第二天真收到一封，里面写的是他三岁那年藏在床底的一颗糖。他脸色一白，把信扣在案上，对师父说：「这比夜神之国快，也省事。」师父看他一眼，慢慢道：「快是快，只是从今往后，你再不能装作不知。」年轻祭司张了张嘴，把那封信翻过来，看见背面还有一行小字，便没再说话，伸手把信压进了卷宗底下。"
 NAT_Abyss_Crown_Of_The_Unmade:"未铸之冠"
 NAT_Abyss_Crown_Of_The_Unmade_desc:"它至今未铸成。因一铸成，便要有人戴上；而戴上之人，不再是「纳塔的火神」，也不再是「深渊的本体」。古斯托特把这两个身份熔进同一块金属里，如今只差最后一锤。"
 NAT_Abyss_Accord_Of_Annihilation:"湮灭之约"
 NAT_Abyss_Accord_Of_Annihilation_desc:"谈判的桌子摆在深渊边上，对面没有实体，只有一团声音。那声音开出之条款简得骇人：它不要纳塔的土地，它要纳塔的存在。纳塔的使节问它要甚么作交换，那声音说，它来把纳塔从提瓦特上彻底抹掉，干干净净。使节追问：「六族呢？」声音道：「一并抹去。」「敌人呢？」「也抹去。」「那些还在等着纳塔去救的人呢？」声音顿了顿，依旧答：「包括他们。」使节握着笔的手停在半空，墨滴在纸上晕开一团。他没再落笔，把那张空白的文书慢慢卷起来，站起身，被那团声音照着，一步步往后退。"
 NAT_Abyss_Sovereignty_Of_The_Void:"虚空称主"
 NAT_Abyss_Sovereignty_Of_The_Void_desc:"深渊取得主权那一日，没动一兵一卒。纳塔的官署照常开门，只是从此谁能在土地上说话，由深渊说了算。从前画在地图上的国界线，一笔一笔都还在，却再没人拿它当回事；那些不设防区，原本谁来都不拦，如今连本族的人经过都要先问一声能走不能走。政务上的事更不必提，衙门里的告示贴了又撕，撕了又贴，最后索性不贴了。有个老吏捧着旧地图去问新主子：「这线，还算不算？」深渊没给他回话，只把那地图吹落地上。老吏弯腰去捡，发现图上的界线被风卷起的一层灰盖住了，他拿袖子擦了擦，越擦越糊，便抱着图退了出去。"
 NAT_Abyss_Extraction_Protocol:"采掘之约"
 NAT_Abyss_Extraction_Protocol_desc:"深渊取物，不从地里掘，从「本来」中抽。管事的领人至一片荒坡，取法器对着空地一照，那地方本该结的果、本该涌的泉，尽被提前兑作实物，一筐一筐装上车。随行掌簿者记了一笔，忽抬头问：「这坡往后，还长得出新物么？」管事的摇头：「不能了。该出的都出了，只余这个数。」掌簿者低头去写，写到「意外」二字停了笔，想不起该记在哪一栏。管事的催他快写，他便把那二字勾了，合上簿子。荒坡上风一吹，连草也不生一根，只余车轮碾出的两道印子，直直伸向远处。"
 NAT_Abyss_Doctrine_Of_Hollow_Victory:"虚胜空论"
 NAT_Abyss_Doctrine_Of_Hollow_Victory_desc:"深渊营中无喊杀声，一军吏坐案后，将战报一页页归档。随军书佐捧册来问：「此仗如何记？」军吏头亦不抬：「照旧，记未败二字。」书佐笔尖悬着：「可也没说胜。」军吏曰：「胜败皆不必记，记了反要人信。」接过册子，翻至最新一页，上头密密麻麻皆是未败二字。案角燃素灯芯结了灯花，伸手挑了挑，顺手于那页末复按下一枚朱印，印泥犹未干。"
 NAT_Abyss_Census_Of_The_Damned:"受诅造册"
 NAT_Abyss_Census_Of_The_Damned_desc:"普查那日，纳塔人排着队，一个个上前报名字。深渊读过的人都在册上，管登记的照着名册点，点到谁，谁就答一声「在」。只是答完还不算，还得再说一遍自己是谁、家住哪里、从前做过甚么。队伍前头有个中年人，报到自己名字时很顺，轮到说「从前做过甚么」，却卡住了，张着嘴愣了半晌。后面的催他，他回头瞪了一眼，低声嘀咕：「我原是个打铁的，还是个种地的？」管登记的抬头看他，笔尖悬着没落：「你自己想。」那人攥着袖口想了又想，末了报了个名字，管登记的在上头画了个勾，示意下一个。他挪开脚，脚下那行字被踩掉半边。"
 NAT_Abyss_Rite_Of_Descending_Monolith:"下行石祭"
 NAT_Abyss_Rite_Of_Descending_Monolith_desc:"纳塔边山上，一巨石自林中滚出，顺坡往火山口去，滚得不快，亦不偏。守山者提长枪追了一段，喘气喊曰：「往何处去？」石头不理，碾过一丛灌木，照旧向前。想起先前亦有人拦过，翻开随身地脉簿，那人名字底下批着二字：已读。遂不复追，将枪尖往地上一顿，蹲坡上看。巨石到得坑口，停一停，方徐徐沉下，坑边腾起一股灰。"
 NAT_Abyss_Become_The_Abyss_Natlan:"纳塔沉渊"
 NAT_Abyss_Become_The_Abyss_Natlan_desc:"§R纳塔不再抵抗深渊，纳塔成为深渊。§!\n古斯托特不再隔着界门窥视这片土地，只因他如今就站在奥奇卡纳塔正中央，用纳塔的火神的声音说话。\n这不是沦陷。这是一次交接：自此，火神与深渊是同一个存在。"
 NAT_Abyss_Purge_Of_The_Six_Tribes:"六族肃清"
 NAT_Abyss_Purge_Of_The_Six_Tribes_desc:"深渊纳塔不须盟友，它要的是彻底并入自身的每一块土地。六族曾以一千年把纳塔割作六部，如今该把它们重新合拢回去了，只是这一回，合拢的去处不再是纳塔。"
 NAT_Abyss_Annex_The_Abyss:"吞并渊蚀"
 NAT_Abyss_Annex_The_Abyss_desc:"深渊之蚀，说到底不过是深渊伸进提瓦特的一根手指。如今纳塔自己成了深渊本体，那根手指便没有再单立的道理。纳塔火神下令收回，令一下，边境那片蚀地便开始往回缩，如被人攥着的拳头慢慢松开。缩到最后一日，纳塔疆界头一回越过烬寂海海岸线。前沿士兵踩着退出来的湿沙往前走，靴底陷进泥里，拔出时带起一股腥气。带队的抬头看那片新划进来的海，问身边书吏：「这海岸，算到哪一格？」书吏蹲下身，拿木杆在沙上画了道线，画完，把木杆插进沙里，起身拍了拍手。"
 NAT_Abyss_Expansion_Beyond_The_Emberline:"越烬寂海"
 NAT_Abyss_Expansion_Beyond_The_Emberline_desc:"六族尽数归墟，烬寂海里再没有深渊的门户，纳塔的火神，如今也是深渊，终于能抬起头，往提瓦特他处看了。这事当年古斯托特做过一回，如今轮到他。他站在海岸边，身后是归墟后空荡荡的营帐，火把插在沙里，被海风吹得歪向一边。他抬手指向东方，问身旁的老臣：「那边，是甚么地方？」老臣眯眼望了半晌，答不上来，只说听人讲过，有枫丹的水、璃月的山。火神嗯了一声，把手放下，弯腰把那支要倒的火把扶正，又拿脚把沙培在火把根上，让它立得稳些。"
 NAT_Abyss_Ascendancy_Of_The_Abyss_Sovereign:"深渊称霸"
 NAT_Abyss_Ascendancy_Of_The_Abyss_Sovereign_desc:"提瓦特之纲纪，靠七神撑了不知多少年。如今七神还在，位子也没空，只是其中一个的位子上坐的，已换成了深渊。头一回聚议，其余几位神祗都到了，彼此看了一眼，谁也不先开口。末了一位年纪最长的神祗把茶盏放下，问了句：「他们的信仰，是自愿的么？」此话一出，满座都静了。有人想说是，张了张嘴又咽回去；有人低头拨弄手里的念珠，拨了几颗，停住了。那新坐上来的深渊不辩解，只端起茶盏抿了一口，把盏底朝下搁回桌上，轻轻一响。众人便都看向那只茶盏，再没谁接话。"
 NAT_Abyss_Conquest_Of_Neighbors:"四境征讨"
 NAT_Abyss_Conquest_Of_Neighbors_desc:"吞并六族之后，纳塔西边是枫丹边境，北边是璃月群山，南边是海。深渊纳塔点起第一场对外战争之火，没给它定终点。带队将官问深渊：「打到哪里算完？」深渊答：「走到没路之处。」将官便不再问，传令拔营。兵马开出三日，前面探路的回来报，说西边枫丹边境已望得见。将官翻身上马，回身看一眼身后纳塔方向，那面旗被风卷得猎猎响。他抬手把盔上扣系紧，一夹马腹，队伍踩着碎石往前开去，路果然还没有走完。"
 NAT_Abyss_Finality_Of_The_Unmade:"未铸终局"
 NAT_Abyss_Finality_Of_The_Unmade_desc:"古斯托特把那块金属锤到了最后一下。铁砧上火星四散，他没去看，只拿锤柄拄着地，喘了一口气。这块金属他锤了许多年，每锤一下，纳塔的国歌里就少一个字，先是「我们」里的「们」，再是前头的两个字，如今连末尾都锤平了。他抬起锤，对着砧上那块薄片看了看，上头刻的字只剩一个「我」。旁边的人想把薄片收起来，他摆手拦住，自己伸手拿布把它裹了，塞进怀里。远处乐师还在试着唱旧国歌，唱到「我们」二字，忽然唱不下去，便停了。古斯托特拢了拢怀里的布包，转身走开。"
 NAT_Abyssal_Prelude:"不静先声"
 NAT_Abyssal_Prelude_desc:"纳塔的国策树右下方，不知何时空出一块，又慢慢浮起一层新的枝丫。最先看见的是个守夜的书记，他正对着树图打盹，忽听图背后有响动，像谁在门后低低地鸣。他起身绕到图后，甚么也没有，只有一片说不清的暗。那低鸣没停，一阵接一阵，整整响了一夜。书记搬了张椅子坐下守着，手里攥着笔，想把那声音记下来，可笔尖一落到纸上，就只画出些弯弯曲曲的道道。天快亮时，低鸣忽然收住。书记揉了揉眼，低头去看那张纸，见那些道道自己连成了一道门的样子，他伸手描了描，指尖停在门缝上，没敢再往下。"
 NAT_Abyssal_Resource_Extraction_I:"渊采一阶"
 NAT_Abyssal_Resource_Extraction_I_desc:"下田的人最先觉出不对。土面上先是潮了一片，接着渗出一层亮晶晶的东西，顺着垄沟慢慢淌。老农蹲下去，拿指头蘸了一点，搓了搓，那东西不黏手，也不像水，晾一会儿就凝成一颗硬粒。他拿给族里的老矿工看，老矿工翻来覆去瞧了半晌，皱眉道：「不是矿，我认得的矿里没这个。」老农问：「那是甚么？」老矿工没答，把那颗硬粒搁在舌头上试了试，登时吐掉，端起水囊灌了一口。两人蹲在田边谁也不说话。风过来，田里又渗出一片，比先前那片大了些，顺着脚边流过去，老农把裤脚往上提了提。"
 NAT_Abyssal_Resource_Extraction_II:"渊采二阶"
 NAT_Abyssal_Resource_Extraction_II_desc:"采掘之势一扩再扩，到最后六座火山同时开工。六处山口都架起了绞车，绳索昼夜不停地往升降，装料的车排成长龙，从山脚一直排到路口。监工拿着名册在各处来回跑，嗓子喊哑了，便拿铜锣代替，敲一声是一处。第三日上，回声之子那座火山先出了岔子：绞车的绳磨断了一股，吊着的料斗卡在半山腰晃。监工赶过去，仰头看了半晌，叫人别硬拉，另换一根粗绳上去。几个匠人攀着岩壁上去，把新绳套牢，底下的人齐声喊了号子，料斗才一寸寸升上来。监工抹了把汗，抬手在名册上那座火山名下画了个圈。"
 NAT_Abyssal_Resource_Extraction_III:"渊采三阶"
 NAT_Abyssal_Resource_Extraction_III_desc:"纳塔已不必再自外购任何物。朝堂上报这份账时，满座都松了口气，管事的把账本一合，说往后粮、铁、燃料，样样不出国门。只有一个老臣坐着没动。散了朝，他独自去城外看那片采了多年的地，目的地头，抓了一把土。土在指头里松散得很，原来黏得起泥团，如今一捏就碎，碎成灰，风一吹就走。他跟着那股灰看过去，灰被卷到半空，落回远处，地上又少了一层。老臣把手里的灰抖干净，蹲下身，拿拐杖在土里戳了个洞，洞壁一下子塌了。他站起来，拍了拍膝盖上的土，回身往城里走。"
 NAT_Abyssal_Resource_Extraction_IV:"渊采四阶"
 NAT_Abyssal_Resource_Extraction_IV_desc:"取物之效一提再提，提到后来，连「工效」一词都盛不下了。起初是一车土出三筐料，后来一车出十筐，再后来，土还没倒进炉子，料就自己从筐里满出来了。管事的嫌账不好看，叫书记员换个说法记。书记员咬着笔杆想了半天，问：「那记甚么？」管事的说：「记它自己长出来的。」书记员便在账上写「自生」二字，写完自己看了都发毛。第二日他去库里盘货，见昨日那筐「自生」的料还在，可筐底下的地面鼓了起来，像有甚么东西要顶出来。他叫人来掀开筐，筐一挪开，地面就平了，甚么也没有。书记员蹲下去摸了摸那块地，起身把筐重新放好，此番没敢再记账。"
 NAT_Abyssal_Ember_Tongue:"烬余之舌"
 NAT_Abyssal_Ember_Tongue_desc:"炉里的余烬又开口了。它报地名，一个接一个，报得慢条斯理，像老账房念旧账。守炉的小工听了几日，摸出些门道：不管先前报的是哪些地方，末了那一句总归一样：「还有纳塔。」他跟同伴打赌，说今晚若换了别的结尾，算他输。同伴摇头不信。夜里两人搬了凳子坐在炉边，余烬果真又报起来，念到最后一个地名，顿了顿。小工屏住气，同伴也往前探了探身子。那声音停了片刻，慢悠悠补出一句：「还有纳塔。」小工泄了气，伸手把炉门关严，转身去吹自己那盏快灭的灯。"
 NAT_Abyssal_Industrial_Workforce:"溺炉役夫"
 NAT_Abyssal_Industrial_Workforce_desc:"矿渣是温的，换班的人就蹲在渣堆旁烤手。这班人换了不知多少茬，先前还有人问工钱是谁付的，问了几次没人答，渐渐也就没人问了。今夜接班的年轻匠人刚来，搓着手凑过去，问旁边老匠：「我们这工钱……」老匠把一只手从渣堆上挪开，指了指远处那座亮着火的炉子，又指了指自己脚边那双磨穿了底的鞋，道：「你且干满一月再说。」年轻匠人不吭声，学着老匠样子蹲下，把手摊在温热之渣上。渣的热气顺指缝往上钻，他眯了眯眼，抬手把领口拢紧，低头看那双新鞋，鞋底还好好纳着线。"
 NAT_Abyssal_Research_Apparatus:"研渊之器"
 NAT_Abyssal_Research_Apparatus_desc:"夜之神的学者守着法器看了许多日，终于信了：深渊会主动把读过的那部分寄回来。法器是一面磨亮的黑石盘，平常只映人影，这些日子却时不时浮出字来，像有人隔着盘写字。领头学者叫人把每一回浮出的字都抄下，抄了厚厚一摞。有个年轻学者心中不服，趁人不在，把自己的手按在石盘上，要试它读不读得出。片刻，盘面真浮出一行小字，恰是他此刻心里想的那句话。他如被烫着一般缩回手，抬头看领头的。领头的不曾责怪，只把那行字也抄进册子，合上册子，拿布把石盘盖了起来。"
 NAT_Abyssal_Precision_Mining:"精勘地脉"
 NAT_Abyssal_Precision_Mining_desc:"地脉会躲。矿工举镐刨下去，那缕地脉就如受了惊，往旁一闪，钻进更深石缝。连了几日，众人刨开的尽是空石，管事急得直转。后有一老矿工道：「它躲，是我们赶它。赶不如引。」众人依他，不再猛刨，改在需用之处埋下引石，又于一旁点起温火，慢慢烘。果然，那缕地脉如闻见了甚么，顺石缝一寸一寸往引石那边移，移到跟前，稳稳停住。矿工屏气看它停定，才轻轻下镐，一下便见了矿脉。老矿工拿袖擦了擦额上汗，把引石起出揣进怀里，招呼众人接着干。"
 NAT_Abyssal_War_Industry:"渊铸兵工"
 NAT_Abyssal_War_Industry_desc:"兵工之坊的炉火，跟地脉的脉动对上了。起初只是巧合：地脉一跳，炉火便旺一分；地脉一缓，炉火就矮下去。管事觉着稀奇，叫人守在炉边盯着，拿鼓风箱跟着地脉的节拍一下一下地送风。这样一来，打出来的甲械果然格外匀，刀口上没有一处虚。有个新来的铁匠不信，故意错开半拍下锤，那炉火立时乱了，火星子噼啪溅出来，烫得他缩回手。老师傅接过锤，等炉火再旺起来的那一瞬落锤，一下就稳了。新铁匠看得分明，学着老师的样子，把锤举在半空，屏住气，专等炉火下一次跳起来。"
 NAT_Abyssal_Recycled_War_Memory:"淬火旧忆"
 NAT_Abyssal_Recycled_War_Memory_desc:"淬火池里捞出来的东西，还记得上一场战争。铸好的刀剑往池里一按，滋啦一声，白气腾起来，等凉透了捞出来，刀身上竟映出些影子：奔跑的人、倒塌的旗、还有烧红的城。年轻匠人拿布去擦，擦了一遍，那些影子还在。他去问老师傅，老师傅说：「这不是脏，是它记着。」匠人不信，把刀翻过来，对着池水照，水面里那座城还在烧。他手一抖，刀差点掉进池里，慌忙捞稳，两只手攥着刀柄，指节都白了。老师傅把刀接过，用布裹了三层，塞进架子上最里格，转身把淬火池的盖子盖上，压了块石头。"
 NAT_Abyssal_Deep_Seers:"渊底先觉"
 NAT_Abyssal_Deep_Seers_desc:"祭司在沙盘里添了最后一把黑砂，忽然住了手。他看见了明日：火台塌了，人却还在笑。旁边的童子问：「师父，还魂诗还念不念？」祭司把诗卷卷起，塞进袖里，摇头道：「用不着了。死的活不过来，活的也骗不过去。」他抬手将沙盘抹平，再不肯看第二眼。"
 NAT_Abyssal_Covenant_Of_Twilight:"黄昏缔盟"
 NAT_Abyssal_Covenant_Of_Twilight_desc:"黄昏里，古斯托特独坐石阶，对着空处开口，把那份旧誓约一字一字背出来。背到末尾，他停下来，问对面：「你可有异议？」风过，无人应。他便自己点头，替对面应了一声：「既如此，便算你应了。」说罢以指甲在石上划下几道痕，起身拂袖而去。石痕里，黄昏的光一寸寸暗下去。"
 NAT_Abyssal_Crown_Of_The_Unmade:"未成之冕"
 NAT_Abyssal_Crown_Of_The_Unmade_desc:"铁砧上躺着那顶未成之冕，边沿还翘着一点毛刺。锻主抡起锤，却迟迟不落。火神在旁看着，问：「还差这一下？」锻主抹了把汗，道：「落下这一锤，你便不是你，它也不是它了。」火神伸手按住冕沿，指腹蹭过那点毛刺，忽然笑了：「那就锤吧。」锻主把锤举过头顶，火光在冕上一晃。"
 NAT_Abyssal_Accord_Of_Annihilation:"湮灭盟约"
 NAT_Abyssal_Accord_Of_Annihilation_desc:"渊使把一卷空白的盟书推到石案中央。纳塔的使者低头看，纸上没有边界，没有条款，只有一行：「献出存在。」使者猛地抬头：「土地可以谈，存在如何献？」渊使不答，只把笔递过去，笔尖自己滴下墨来。使者盯着那滴墨在纸上洇开，慢慢洇成一个字。他伸手去按，墨已干透。"
 NAT_Abyssal_Void_Sovereignty:"虚空统御"
 NAT_Abyssal_Void_Sovereignty_desc:"废墟前，两拨人各执一词。老酋拄着杖，说：「这地是祖宗的，话该由我说。」对面的渊使抬手，指向石缝里新钻出的黑芽：「它先在土里发了言，你听见没有？」老酋俯身，把耳朵贴到地面，听了半晌，脸色渐渐变了。他直起身，把杖横在胸前，退后半步，再没开口。黑芽又长高一寸。"
 NAT_Abyssal_Doctrine_Hollow_Victory:"空洞胜论"
 NAT_Abyssal_Doctrine_Hollow_Victory_desc:"纳塔斥候伏岩后，盯对面半日，归报曰：「那支兵不进亦不退，连旗皆不倒。」带队之将问曾见其乱阵脚否，斥候摇头，言一步未乱。队将取炭条于石片画一线，复在旁写两个空圈：「他们不求赢，只求败不成。」将石片递与副手，己身蹲下看地上脚印，印子深浅一律，排得笔直。副手问还打否，队将把石片塞入岩缝，起身，拍了拍膝上之土。"
 NAT_Abyssal_Natlan_Core:"纳塔渊心"
 NAT_Abyssal_Natlan_Core_desc:"祭司掀开圣火下的石板，底下不是火种，是一截漆黑的根。他伸手去触，指尖才沾，满谷果木同时结果，颗粒果滚了一地，炉中之火自旺三分。童子惊得倒退：「这是火神，还是深渊？」祭司抽手，看那截根在石缝里微微搏动，低声道：「是两个都到了尽头，才长在一处的物事。」他盖上石板，谷里的果还在往下落。"
 NAT_Abyssal_Tribal_Purge:"六族征讨"
 NAT_Abyssal_Tribal_Purge_desc:"六族的旗插在旧战场上，旗面各褪了色。渊使走过一排旗，随手把其中一面拔起，折断，扔进火堆。守旗的老兵扑上去，被旁边人一把拉住：「还争甚么，一千年的账，今日一笔勾。」老兵挣着回头看那火，旗角卷曲，六面旗的灰混在一处，竟分不出彼此。渊使拍去手上土，转身走向下一排。"
 NAT_Abyssal_Devourer:"吞渊噬者"
 NAT_Abyssal_Devourer_desc:"深渊之蚀在原野上摊开，像伸进提瓦特的一根手指，正慢慢往回收。农人丢下锄头，看着田垄里的黑线一寸寸退回地下。老酋蹲下，用斧柄拨了拨那道退痕，土是凉的。旁边人问：「当真收回去了？」老酋把土拨平，起身拍掉膝上的灰：「指头收了，手还在。」他扛起斧头往回走，田里的黑线已不见踪影。"
 NAT_Abyssal_Territorial_Reach:"越界拓疆"
 NAT_Abyssal_Territorial_Reach_desc:"烬寂海的海岸线上，第一面纳塔的旗插进黑沙。兵士们你看看我、我看看你，谁也不肯先迈那一步。老兵把旗往沙里又送了送，自己先跨过去，靴底陷进湿沙，拔出来时带着黑泥。他回头喊：「过来！海那边的风，和咱那边是一个味。」众人陆续跟上来，脚印一串排到水边。浪涌上来，淹了最前那串脚印。"
 NAT_Abyssal_Ascendancy:"渊主霸业"
 NAT_Abyssal_Ascendancy_desc:"七神的石座列在云端，六张空着，只一张坐着人。那一位披着旧袍，面容与从前无二，只是开口时，声音里多了层沙。阶下的使者躬身禀报：「底下人还当是您。」那一位抬手，指尖在膝上叩了两下，缓缓道：「名号不必改。」说罢把袍角一拢，石座下的云气翻涌，六张空座上的灰被吹得卷起来。"
 NAT_Abyssal_Expansionist_Crusade:"四境挞伐"
 NAT_Abyssal_Expansionist_Crusade_desc:"深渊纳塔之兵开出城时，鼓声震天，无人记得这是第几日。年轻的兵士扛旗走在队前，旗面还是新的。老兵在他背后喊：「此去没有回程的号！」少年回头笑：「那就一直往前。」城门在身后合上，尘土落定，路上只剩两行脚印，一行深，一行浅，肩并肩往远处去了。敲鼓的人手心磨出血，换了个后生接着敲。"
 NAT_Abyssal_Finality:"未成之终"
 NAT_Abyssal_Finality_desc:"歌师坐在火堆旁，把旧歌谱摊在膝上，一笔一笔划去「我们」二字。旁边的小徒不解：「删了这两个字，歌还怎么唱？」歌师搁下笔，就着火光把那页谱子卷起来，凑近火苗，任它烧出一个缺口。他重新提笔，在空白处只写一个「我」字，写得极大，几乎撑破纸边。火堆噼啪一响，那个字的墨还没干。"
 NAT-ABY-Index_GT_100:"§R深渊侵蚀度 > 100§!，只有当纳塔的深渊侵蚀越过这条线，右下方那团国策树才会浮现。"
 NAT_Abyss_Tree_Unlock_desc:"不静之门前，祭司站了半晌，终于伸手推开。门轴发出一声干响。门后没有房间，只有一片缓缓旋转的黑。他把手指探进去，指尖即被甚么咬住，血珠顺着门缝往下淌。身后童子失声：「师父，手！」祭司不缩，反而把整条手臂送进去，低声道：「开都开了，还怕它不认账。」黑里传来一声轻响，像有人在那头把门也推开了一寸。§Y深渊力量开始反向渗入纳塔§!：\n§R侵蚀度 +5§!\n§G政治点数 +50§!\n§R稳定度 -2%§!\n获得民族精神：§Y不静之门 · 预响§!"
 NAT_Abyss_Descent_desc:"黑曜石阶梯继续向下延伸，一级比一级凉。矿工举着火把走在最前，数到第九十九级，火把忽然灭了。后面的人摸黑往下探，脚下一空，险些栽下去。领头老工一把拽住他，自己蹲下，用手掌贴着石面往下摸，摸到一道缝：「底下还有路，石头是空的。」众人把绳子系在腰间，一个接一个往下缒。火把重新点起时，阶梯尽头露出更早的一截台阶。\n获得民族精神：§Y深渊采掘 · 一阶§!\n§G政治点数 +25§!\n§R侵蚀度 +3§!\n§Y采掘技术§!研究加成"
 NAT_Abyss_Tongue_desc:"余烬开始报出地名。守夜的兵起初以为听岔了，凑近火盆，那点火星果然在说话，一个接一个念着各处的名字，念得又准又慢。他抓起一把灰，灰从指缝里漏下去，落地还在念。兵士慌了，抬脚要踩灭，旁边老卒按住他手腕：「别踩，它念一个，我们便记一个，看它到底要报多少地方。」兵士收回脚，蹲下来，跟着火星一个字一个字记。\n获得民族精神：§Y深渊采掘 · 一阶§!\n§G稳定度 +3%§! §G战争支持 +5%§! §G指挥点数 +50§!\n获得民族精神：§Y余烬之舌§!"
 NAT_Abyss_Hollow_Stars_desc:"六个空洞在等新的东西填进去。术士把六种东西一一举到洞前：果、锤、螺、藤、羽、烟灰。前五个投进去，洞里只回了闷响。轮到第六样，烟灰刚沾到洞口，六个洞忽然同时亮了一下，像六只眼睛睁开。术士收手退后，洞里传出一句话，说的就是他方才没来得及念的那个名字。他站着没动，听那声音把自己叫了第二遍。\n获得民族精神：§Y深渊研究装置§!\n§G研究速度 +5%§!\n§Y核物理§!研究加成\n§G建立情报机构§!"
 NAT_Abyss_Drowned_Forge_desc:"炉底那层渣是温的。老炉匠蹲下，用铁钳翻了翻，渣里竟还有火星在闪。他叫徒弟再添一铲炭，徒弟添了，炉火却往里缩，像被甚么东西吸了进去。老炉匠把脸凑近炉口，热气扑在脸上，他眯着眼看了一会儿，忽然道：「这炉子不烧炭了，它烧的是人守着它的那口气。」徒弟握着铲柄，不知该不该再添，炉里的火自己稳稳地亮着。\n获得民族精神：§Y深渊采掘 · 一阶§!\n§G建造工业园区§!\n获得民族精神：§Y溺炉劳工§!\n§Y土木工程§!研究加成"
 NAT_Abyss_Six_Voids_desc:"第七个徽记属于纳塔本身。石壁上原本刻着六道，那日雨后，第六道旁边自己浮出第七道，纹路和前六道一般无二。守壁的祭司拿刷子去刷，刷不掉；拿凿子去凿，凿下去石屑纷落，纹路反倒更深。他扔了凿子，退开三步，看着那第七道在石壁上慢慢渗出光来。远处传来六处部族的钟声，一处接一处，都停在同一拍上。\n获得民族精神：§Y深渊采掘 · 二阶§!\n§G政治点数 +50§!\n§R稳定度 -3%§!\n§R侵蚀度 +3§!"
 NAT_Abyss_Drowned_Covenant_desc:"深渊向他复述了一份他早已忘记的誓约。那声音从井底传上来，一字一句，说得比他自己还记得清楚。他扶着井沿往下望，井下黑得看不见底，只有那声音不紧不慢地背着旧年的话。他张口想辩，那声音却先一步把他在心里的话也背了出来。他手一松，险些跌进井里，忙抓住绳梯，蹲在井口，再不敢往下看，只听那声音把誓约背到最后一个字。\n获得民族精神：§Y深渊研究装置§!\n§G研究速度 +5%§!\n§G战争支持 +5%§!\n获得民族精神：§Y黄昏古约§!"
 NAT_Abyss_Flame_Eats_Flame_desc:"纳塔的火开始反过来用燃烧这个概念。祭司把火种捧在手心，火不烧手，反倒往他掌纹里钻，顺着血管一路亮上去。他攥紧拳头，火光从指缝里漏出来，在地面烧出一道细痕。旁边人伸手去挡，火苗一舔，那人的袖子着了，却不见疼，只听他笑道：「烧的是旧火，点的还是这把手。」祭司松开拳，掌心的火已不往外烧，改往里收了。\n获得民族精神：§Y深渊采掘 · 二阶§!\n§G建造兵工厂§!\n获得民族精神：§Y深渊战争工业§! §Y余烬之舌§!"
 NAT_Abyss_Harvest_desc:"土地本身开始渗出燃料。农人扶着犁，看见翻起的土里泛着油光，一脚踩下去，鞋底黏住，拔起来带着亮。他蹲下用手一抹，指尖沾了层黑亮的东西，凑近一闻，愣住了。老农走过来，也蹲下，捻了捻那土，半晌才道：「不用种了，地自己会出油。」说罢把犁插进土里，人却不动了，只看着那片地慢慢亮起来。\n获得民族精神：§Y深渊采掘 · 三阶§!\n§G建造燃料储备与炼油厂§!"
 NAT_Abyss_Living_Geology_desc:"勘测队在火山口架起钻机，钻了半日，取上来的岩心却是空的。领队不信邪，换个方位再钻，岩层竟自己错开半寸，把钻头让了过去。年轻的测绘员蹲在口子上看了半晌，忽然道：「它不是死的，它在躲。」众人一时无人应声。回到营里，领队把那截空岩心摆在桌上，对着地图想了一夜，第三日让人撤了钻机，改在坡上埋下引火的铜管。\n获得民族精神：§Y深渊采掘 · 三阶§!\n获得民族精神：§Y活地质勘探§!\n§G研究速度 +5%§!\n§G政治点数 +50§!"
 NAT_Abyss_Recycled_Fire_desc:"淬火池里出来的东西仍然记得上一场战争。铁匠夹出一块刚淬好的刃，刃身还滴着水，他拿布去擦，布上竟印出半张脸来，是去年战死那人的模样。铁匠手一抖，把刃丢回池里，水花溅了一脸。徒弟问：「师父，它认得人？」铁匠抹了把脸，重新把刃夹出来，此番直视那道印子：「认得就好，磨一磨，还是一把好刀。」他把刃按在磨石上，一下一下磨起来。\n获得民族精神：§Y深渊战争工业§!\n获得民族精神：§Y淬火记忆§!\n§G人力 +50000§! §G陆军经验 +15§!"
 NAT_Abyss_Deep_Seers_desc:"深渊会主动把读到的部分寄回来。案头的空白纸上，忽然多出几行字，墨迹未干，写的就是昨夜谁在火堆旁说的话。守案的文吏起初以为是同僚捉弄，提笔比对笔迹，越比越心凉，那字竟是自己的手笔，他却一字没写过。他把纸翻过去，背面又现出一行，记的是明日要办的事。文吏搁下笔，把纸扣在桌上，手掌死死压住。纸底下，字还在往外交，一笔一画，顶得他掌心发痒。\n获得民族精神：§Y深渊研究装置§!\n获得民族精神：§Y深渊先见§!\n§G研究速度 +10%§!\n§G建立情报机构§! §G政治点数 +50§!"
 NAT_Abyss_Unmade_Crown_desc:"只差最后一次锤击。锻主把锤举在半空，汗从额角滚到砧上，嗤地一声白烟。冕就搁在砧心，只余边沿一寸没有合拢。他盯着那道缝，忽然收了力，把锤缓缓放下。旁边人急了：「怎么不敲？」锻主抹了把脸：「这一下敲下去，戴上它的就不知是谁了。」他转身去添炭，炉火映着那道没合的缝，一闪一闪。\n获得民族精神：§Y未铸之冕§!\n§G政治点数 +100§!\n§R稳定度 -5%§! §G战争支持 +10%§!"
 NAT_Abyss_Accord_desc:"渊使把盟书摊在案上，纸角自己卷起又落下。纳塔的使臣看了三遍，抬头道：「条款里没有一寸土。」渊使点头：「土地留着，人不必留。」使臣把刀按在案上：「那便没甚么好谈的。」渊使不恼，伸指在纸上一划，纸上当即多出一行小字，写的就是使臣方才那句话。使臣低头看，刀慢慢从案上滑下来。\n获得民族精神：§Y湮灭之约§!\n§G战争支持 +10%§! §R稳定度 -5%§!\n§R侵蚀度 +10§!"
 NAT_Abyss_Sovereignty_desc:"集会上，众人各说各话，声音撞在一处。渊使坐在末席，一直不开口，直到有人问他：「你凭甚么在此表态？」他才抬起眼，指了指脚下的地：「凭它许我说。」众人静了。老酋拍案而起，却觉脚下一空，身子陷进土里半寸，再用力，竟拔不出来。渊使仍坐着，把双手搁在膝上，等众人把话讲完。\n获得民族精神：§Y虚空主权§!\n§G政治点数 +150§! §G稳定度 +5%§! §G研究速度 +5%§!"
 NAT_Abyss_Extraction_desc:"矿工们围着一堵空石壁，谁也不信这里面有矿。领头的把探测的杆子往缝里一捅，杆子进去半截，带出一撮黑粉。他捻了捻，粉在指间发烫。众人凑上来，杆子再捅，此番淌出的是亮晶晶的油。领头把杆子拔出来，往地上一杵，喊道：「就这儿，挖！」镐头落下去，石壁应声裂开一道口子。\n获得民族精神：§Y深渊采掘 · 四阶§!\n§G建造钢铁厂与炼油厂§! §G政治点数 +50§!"
 NAT_Abyss_Hollow_Victory_desc:"败报送到帐前，主帅看也不看，掷在火盆里。火舌一卷，纸灰扬起，上头的败字却没烧掉，反倒浮在半空。主帅抬手一握，那字碎成灰。旁边副将低声问：「这算赢了？」主帅把剑收回鞘里，坐回座上：「败都不算败了，你说算甚么。」帐外残兵陆续回来，一个个从他帐前走过，没人敢抬头。\n获得民族精神：§Y深渊战争工业§!\n获得民族精神：§Y空洞胜利论§!\n§G陆军经验 +25§! §G战争支持 +5%§!"
 NAT_Abyss_Census_desc:"登记处排着长队，吏员一个个问过去：「你叫甚么？」答上来的，就在册上画一笔。问到中间一个老妇，她张了张嘴，愣是没想起自己的名字，手在半空比划了半天。吏员提笔，在册上画了个空圈，放她过去。后面的人仍在往前挪，册子上的圈越画越多，吏员的手渐渐慢了，抬头看队尾，队伍长得望不见头。\n获得民族精神：§Y深渊先见§! §Y黄昏古约§!\n§G人力 +100000§! §R稳定度 -3%§!\n§G建立情报机构§!"
 NAT_Abyss_Monolith_desc:"石碑上原本刻着一个人的名字，那是上次来阻拦的人。某日起，名字旁边多出两个字：已读。守碑的祭司拿布去擦，擦不掉，那两个字反倒渗进石里，比刻的还深。他伸手摸了摸，指腹传来一点温热，像谁刚在这儿站过。祭司收回手，退到碑后，听着风从碑面上刮过去，刮出一片细细的响。\n获得民族精神：§Y深渊采掘 · 四阶§!\n获得民族精神：§Y深渊研究装置§!\n§G研究速度 +10%§!\n§R侵蚀度 +5§!"
 NAT_Abyss_Become_desc:"§R纳塔不再抵抗深渊，纳塔成为深渊。§!\n§Y意识形态转为法西斯主义§!\n§Y元首改为古斯托特§!\n获得民族精神：§R深渊纳塔§!（山川物力取用大增）\n移除民族精神：§Y纳塔战斗之国§! §Y龙之祸§!\n§R侵蚀度 +20§!\n§Y吞并深渊之蚀§!，触发深渊之蚀进攻的决议随之失效\n§R若六大部族仍存在，即刻对它们宣战§!"
 NAT_Abyss_Purge_Tribes_desc:"六个部族的旗被收拢到一处，旗杆捆在一起，沉得压弯担子木头。押旗的兵问：「这是要并回纳塔？」领头的摇头，抬手指向旗面：「不并回纳塔，并回它自己。」众人不懂，只见六面旗被推进火里，旗角卷起时，六色之灰落在一处，再也分不出哪面是哪面。领头的拍拍手上灰，转身去点下一堆。对仍然存在的每一个部族宣战获得民族精神：六族征讨战争支持 +10% 人力 +100000"
 NAT_Abyss_Devour_HIP_desc:"深渊伸进提瓦特的那根手指，正被一点一点收回去。原野上的黑线往回缩，缩过田垄，缩过河床，最后缩成一粒黑点，悬在半空。匠人举着锤守在旁边，等那黑点落下来，一锤砸住，砸进土里三尺。他拔起锤，锤头带着点温，土面平了，黑点没了。他抬头四望，天还是那个天，只是风里少了股腥气。\n§Y吞并深渊之蚀§!\n获得民族精神：§Y吞噬者§!\n§G建造兵工厂 ×2§! §G战争支持 +5%§!"
 NAT_Abyss_Beyond_Emberline_desc:"队伍在烬寂海的海岸边停下，前面是没过脚踝的黑水。带队的把旗往水里一插，旗杆歪了歪，竟立住了。有个年轻兵士蹲下，用手撩起一捧水，水里泛着细碎的光，他凑近看，光里映出自己的脸，却是陌生的。他愣了一瞬，把水泼掉，站起来跟上了队伍。脚印一路伸进水里，越走越深，最后只剩旗杆露在水面。\n获得民族精神：§Y越界§!\n§G战争支持 +10%§! §G稳定度 +5%§! §G政治点数 +100§!\n§G建立情报机构§!"
 NAT_Abyss_Ascendancy_desc:"七神的座次照旧排着，谁也没动。只是轮到那一位开口时，殿里的火齐齐矮了半寸。众神侧目，那一位却神色如常，抬手整了整衣冠，说了一句：「位子还是那个位子。」话音落地，殿角的影子动了动，像有谁在暗处应了一声。众神各自收回目光，殿内重又静下来，只有那半寸火苗，始终没再长回去。\n获得民族精神：§Y深渊霸权§! §Y空洞胜利论§!\n§G战争支持 +10%§! §G政治点数 +150§! §G陆军经验 +20§!"
 NAT_Abyss_Conquest_Neighbors_desc:"深渊纳塔的第一场对外战争，是从一封战书开始的。战书送到邻国，纸上只有一句：「六部已并入，下一步轮到你。」邻国的使臣把纸翻来覆去看，找不着落款，抬头问送信人：「谁署的名？」送信人指了指纸角，那里甚么也没有，只有一个淡淡的印子，像谁把手按上去又拿开了。使臣盯着那印子，慢慢把战书折好，收进袖里。\n§R吞并六大部族后，对所有邻国宣战§!\n获得民族精神：§Y四境征伐§!\n§G战争支持 +15%§! §G稳定度 +5%§!"
 NAT_Abyss_Finality_desc:"纳塔的颂歌里不再有我们，只剩一个「我」。\n§R全面法西斯化，元首仍为古斯托特§!\n获得民族精神：§R未铸之终§!\n§G政治点数 +200§! §G战争支持 +10%§! §G稳定度 +10%§!\n补做一次吞并：深渊之蚀 / 六大部族"
 NAT_Gustot_desc:"§R古斯托特§!\n深渊本体。葬火之战中化形火龙王修库特尔，读人魂之忆，造深渊界门，令纳塔地脉濒于全黑。\n如今他不再隔着界门窥视，他站在奥奇卡纳塔正中央，用纳塔火神的声音说话。§!\n§R「火神与深渊，从此是同一个存在。」§!"
 NAT_Plenty_Border_Council_Idea:"边民聚议"
 NAT_Plenty_Border_Council_Idea_desc:"沃陆之邦于边境垒一石坛，坛上摆数袋颗粒果。两户人家为一段田埂争至坛前，一执对方之袖不放。守坛长老将二人分开，各递一把果：「先吃，再说。」二人蹲坛边啃果，气渐消。纳塔所派差役持状纸赶到，言此案该上呈。长老将果袋往怀中一塞：「到了此处，便在坛上了结。」差役立片刻，见二人已并肩量田埂，便折起状纸，塞回袖中，转身去矣。"
 NAT_Plenty_Border_Council_tt:"边民议事\n本族由此获得了只属于它自己的一份本事：\n[monthly_population_tt]\n[political_power_gain_tt]\n[stability_factor_tt]\n[army_org_factor_tt]"
 NAT_Plenty_Unruly_Elders_Idea:"山口老酋"
 NAT_Plenty_Unruly_Elders_Idea_desc:"沃陆之邦祭坛钥匙挂老酋腰上数十年，年轻人上门去讨，他按得死紧：「此钥匙，待汝等能独种一季谷再说。」年轻人不复争，退至谷地另一头，搬来数块黑曜石，垒一小坛。有人拿炭条于石片写新规，写至一条，回顾问：「此条算不算？」众人七嘴八舌而改，末了领头者将石片嵌入坛缝。老酋远远瞧见，摸了摸腰间钥匙，终究未过去。"
 NAT_Plenty_Unruly_Elders_tt:"不驯族老\n本族由此获得了只属于它自己的一份本事：\n[war_support_weekly_factor_tt]\n[stability_factor_tt]\n[political_power_gain_tt]\n[war_support_factor_tt]"
 NAT_Plenty_Granary_Ledger_Idea:"谷仓暗账"
 NAT_Plenty_Granary_Ledger_Idea_desc:"沃陆之邦仓房摆两本账。纳塔税官来查，管仓者将官册递过，页页工整。税官翻两页，忽问粮数不符。管仓者笑而不答，转身自谷袋底抽出一本脏薄册，摊于磨盘上：「进出只认此本。」税官凑近视之，上头密密麻麻记着哪袋入哪仓、哪日出门，连他自己名字亦在末行。正欲发问，管仓者已合上薄册，塞回谷袋底，顺手于袋口打个死结。"
 NAT_Plenty_Granary_Ledger_tt:"谷仓私账\n本族由此获得了只属于它自己的一份本事：\n[consumer_goods_factor_tt]\n[line_change_production_efficiency_factor_tt]\n[industrial_capacity_factory_tt]"
 NAT_Plenty_Riders_Self_Raised_Idea:"谷骑自募"
 NAT_Plenty_Riders_Self_Raised_Idea_desc:"焱庭饷银送至沃陆之邦马场，骑长看亦未看，令人原封退回。身后一队骑兵方自田里归，马背上犹驮割下之穗。一年轻骑手问：「不领饷，家中吃甚么？」骑长解下一袋颗粒果，掷入其怀：「收割多少，分多少，此便是饷。」众人围拢，按各自割之垄数分果，多者一袋，少者一捧。分毕，骑长翻身上马，将空袋于鞍后系紧，领人往田里去矣。"
 NAT_Plenty_Riders_Self_Raised_tt:"骑手自募\n本族由此获得了只属于它自己的一份本事：\n[army_org_factor_tt]\n[attrition_tt]\n[army_speed_factor_tt]\n[command_power_gain_tt]"
 NAT_Plenty_Oath_Of_Abundance_Idea:"丰年立誓"
 NAT_Plenty_Oath_Of_Abundance_Idea_desc:"沃陆之邦头一季谷收上来，谷场中央堆起新垛。老酋捧第一把穗子，行至火堆前站定，对围拢者曰：「仓廪不空，则火不断。」众人随念一遍，声压得低。老酋将穗子凑火点着，火苗舔干穗，噼啪数响。举那束燃穗，绕谷场一周，令每一双眼睛皆照见。末了将烧剩穗头插入灰中，火犹亮，人已散，只余数童蹲于边上，拿树枝拨那点余烬。"
 NAT_Plenty_Oath_Of_Abundance_tt:"丰饶誓约\n本族由此获得了只属于它自己的一份本事：\n[monthly_population_tt]\n[local_resources_factor_tt]\n[stability_factor_tt]"
 NAT_Plenty_River_Gate_Idea:"河关据守"
 NAT_Plenty_River_Gate_Idea_desc:"沃陆之邦于渡口横一木栅，栅边插一杆旧旗，商队至皆须停。管卡者搬条凳坐栅下，伸手索过路钱。领头商人不肯，言纳塔之税已交。管卡者摇头：「那是纳塔的，这是谷里的。」商人无奈，摸出数枚钱搁木盘中。管卡者拨了拨，抬手放栅。一载货小舟顺水而来，船上之人朝他抛一贝螺，接住，往腰间一挂，转过身去，木栅已落半根。"
 NAT_Plenty_River_Gate_tt:"河关自守\n本族由此获得了只属于它自己的一份本事：\n[army_defence_factor_tt]\n[supply_node_range_tt]\n[no_supply_grace_tt]\n[production_speed_supply_node_factor_tt]\n[attrition_tt]"
 NAT_Plenty_Granary_Court_Idea:"谷仓断狱"
 NAT_Plenty_Granary_Court_Idea_desc:"沃陆之邦一后生顺手捎走一把谷穗，为看仓者当场拿住，绑至谷场老树下。纳塔差役闻声赶来，言按律当罚。族中长老摆手：「一把穗子，吾等自审。」令人将那把穗子摊于石板，一颗颗数清，共四十七粒。后生低头，长老问其知错否，点头。长老便令明日一早往田里补种一行，将四十七粒皆种回。差役立一旁插不上话，末了看那后生解绳，蹲至石边，一粒粒把穗子捡入兜中。"
 NAT_Plenty_Granary_Court_tt:"谷仓法庭\n本族由此获得了只属于它自己的一份本事：\n[political_power_gain_tt]\n[justify_war_goal_time_tt]\n[war_support_factor_tt]\n[stability_factor_tt]"
 NAT_Plenty_Sovereign_Harvest_Idea:"自主农令"
 NAT_Plenty_Sovereign_Harvest_Idea_desc:"沃陆之邦将下种，往焱庭递农令，候回文候了半月无影。老酋将竹简往案上一拍：「不等矣，吾等自签。」令人取黑曜石印，蘸印泥，于农令末按下族印。年轻人在旁数要发之种，一袋一袋搬出门。焱庭回文偏于此时到，送信者举简立于门口。老酋接过看一眼，随手搁案角，转身将签就农令交与领种者，那人抱竹简便往田里跑，鞋跟带起一路土。"
 NAT_Plenty_Sovereign_Harvest_tt:"独立农令\n本族由此获得了只属于它自己的一份本事：\n[monthly_population_tt]\n[consumer_goods_factor_tt]\n[industrial_capacity_factory_tt]\n[political_power_gain_tt]"
 NAT_Echoes_Echo_Trial_Idea:"试炼回响"
 NAT_Echoes_Echo_Trial_Idea_desc:"回声之子试歌于峡谷中举行。一外来后生被带至崖下，长老令唱一句祖传之调。张口唱了，声撞石壁，弹回时变了些调。长老皱眉，令再唱。第二遍唱毕，回声中竟多一缕和声，将其尾音稳稳接住。旁侧匠人释手中之锤，低声对同伴曰：「记下了，是他之人。」长老点头，拿錾子于崖壁名单旁补刻一道。后生看那新刻之痕，伸手摸了摸，指腹沾了一层石粉。"
 NAT_Echoes_Echo_Trial_tt:"回响试炼\n本族由此获得了只属于它自己的一份本事：\n[recruitable_population_factor_tt]\n[weekly_manpower_tt]\n[political_power_gain_tt]"
 NAT_Echoes_Off_Nest_Song_Idea:"离巢之鸣"
 NAT_Echoes_Off_Nest_Song_Idea_desc:"回声之子一匠人将铺盖自老锻洞搬出，于离谷三里崖边搭一小棚。有人问其何故，一面钉木桩一面道：「巢离了巢，歌便不绕回原处矣。」当晚对新崖唱一支老调。回声隔许久方起，非自老锻洞那头，却从对面新崖折回，调亦添几分生涩。匠人听了，不复唱第二支，将锤挂上棚柱，自坐门槛，望老锻洞那头黑黢黢洞口，手攥一块未锻完之燃素锭。"
 NAT_Echoes_Off_Nest_Song_tt:"离巢之音\n本族由此获得了只属于它自己的一份本事：\n[research_speed_factor_tt]\n[army_org_factor_tt]\n[stability_factor_tt]\n[army_org_regain_tt]"
 NAT_Echoes_Own_Forge_Idea:"亲铸兵刃"
 NAT_Echoes_Own_Forge_Idea_desc:"回声之子将峡谷深处那座废炉复点着。焱庭兵器车照旧推来，管事匠人连车门皆未开，只隔老远摆手：「往后不用送矣，吾等自锻。」车把式愣了愣，掉头去矣。炉膛内火苗窜起，铁水顺槽自流，红得晃眼。数匠人围砧边，轮番抡锤，锤声一下叠一下，震得崖上碎石簌簌下坠。领头者以钳夹起烧透之料，摁于砧上，令旁人加把力。末了第一把新刃成形，不急着看刃口，先将锤往砧边一搁，伸手试炉温。"
 NAT_Echoes_Own_Forge_tt:"自铸兵刃\n本族由此获得了只属于它自己的一份本事：\n[production_speed_arms_factory_factor_tt]\n[industrial_capacity_factory_tt]\n[line_change_production_efficiency_factor_tt]\n[consumer_goods_factor_tt]"
 NAT_Echoes_Duel_Judgement_Idea:"决斗裁词"
 NAT_Echoes_Duel_Judgement_Idea_desc:"回声之子起纷争，不兴讼，只约至石台分个高下。二人各执一钝刃，绕了三圈，其一先失足，为另一以刃背拍中肩头，跌坐于地。围观者无声。主持长老提笔于木牍写判词，念一遍：「胜者有理，此判即终。」输家犹欲争辩，长老将木牍往其面前一递：「上面按了族印，再无二话。」焱庭旁听官张了张嘴，亦将话咽回。长老翻过木牍，于背面按下族印，印泥渗入木纹，随手插木牍于台边石缝中。"
 NAT_Echoes_Duel_Judgement_tt:"决斗判词\n本族由此获得了只属于它自己的一份本事：\n[war_support_factor_tt]\n[justify_war_goal_time_tt]\n[army_attack_factor_tt]\n[command_power_gain_tt]"
 NAT_Echoes_Resonance_Oath_Idea:"共鸣立誓"
 NAT_Echoes_Resonance_Oath_Idea_desc:"回声之子与花羽会于谷口对唱，约好同调便同进退。回声这边先起头，锤敲砧，一下一下打拍；花羽会那边以羽笛相和，音头总能压在锤点。唱至第三段，两队之声绞作一缕，崖壁回声亦随之叠厚。一年少者问：「倘某日唱岔了呢？」带头老人指脚下地面：「岔了便停，谁亦不先动。」末了一曲唱尽，两边同时收声，锤与羽笛齐停，谷中只余回声犹在徐徐散去。"
 NAT_Echoes_Resonance_Oath_tt:"共鸣誓约\n本族由此获得了只属于它自己的一份本事：\n[army_org_regain_tt]\n[army_org_factor_tt]\n[war_support_factor_tt]\n[stability_factor_tt]"
 NAT_Echoes_Cavern_Seats_Idea:"窟中议席"
 NAT_Echoes_Cavern_Seats_Idea_desc:"回声之子将议席自露天坝子移入石窟深处。有人嫌里头黑，领路老者举火把往里行，边走边曰：「越深，回声越清，谁言何事，石壁皆替汝记着。」到洞底，令人于地上试喊一声，声撞回来，字字分明，连尾音亦未失。众人方依回声最匀处摆下一圈石凳。一年轻议士坐定后故意咳嗽两声，闻回音自对面圆圆送回，不禁笑了。老者将火把插石缝，坐主位，抬手示意众安静。"
 NAT_Echoes_Cavern_Seats_tt:"石窟议席\n本族由此获得了只属于它自己的一份本事：\n[political_power_gain_tt]\n[stability_factor_tt]\n[war_support_factor_tt]\n[stability_weekly_factor_tt]"
 NAT_Echoes_Disobedient_Song_Idea:"不臣之谣"
 NAT_Echoes_Disobedient_Song_Idea_desc:"回声之子锻洞里，一年轻匠人忽唱一支老调，调一起，旁侧锤声皆停。有人拉其袖：「此支焱庭不许唱。」甩开手，照旧唱下去。方唱着，焱庭巡役推门入，厉声问谁在唱。洞中静一瞬，那匠人未停，将后半支唱得更响。巡役正欲喝止，忽听砧那边当一声，一老匠人抡锤落下，随又是一锤，锤点恰压歌拍。接着满洞之锤皆动，歌声与锤声绞在一处，巡役举着之手停半空，末了徐徐放下，转身出洞。"
 NAT_Echoes_Disobedient_Song_tt:"不臣之歌\n本族由此获得了只属于它自己的一份本事：\n[war_support_factor_tt]\n[stability_factor_tt]\n[justify_war_goal_time_tt]\n[attrition_tt]\n[command_power_gain_tt]"
 NAT_Echoes_Dragon_Blood_Claim_Idea:"龙血立誓"
 NAT_Echoes_Dragon_Blood_Claim_Idea_desc:"回声之子老锻主将一片嵴锋龙鳞甲置于砧上，对围拢者曰：「古龙血脉之正统，在吾此处。」有人提流泉之众亦自称龙血后裔，他冷笑一声：「他们那点水，养不出龙鳞。」令人取一锭掺龙血之燃素，搁入炉中，火苗即刻转青。锻主以钳夹住那片鳞，于高温里翻了翻，鳞纹被照透亮。末了将鳞甲按入一块半冷之铁，印出纹路，对众曰：「往后谁再争，来看此印。」炉火映其半脸，那道鳞印犹在发红。"
 NAT_Echoes_Dragon_Blood_Claim_tt:"龙血宣告\n本族由此获得了只属于它自己的一份本事：\n[research_speed_factor_tt]\n[army_attack_factor_tt]\n[war_support_factor_tt]\n[army_org_factor_tt]\n[justify_war_goal_time_tt]"
 NAT_Springs_Spring_Council_Idea:"涌泉结盟"
 NAT_Springs_Spring_Council_Idea_desc:"流泉之众七处泉眼于同日决口，水漫滩头，将各寨之人皆引出来。有人踩水跑来报信，喊三遍方有人听清。族长令人敲响贝螺，七声一响，七寨之舟俱划至滩边，缆绳拴成一排。众人立于没膝水中议事，水声太吵，族长便举一只空螺：「谁要说话，先将螺递与谁。」轮到最下游那寨，他们之话被水冲得七零八落，族长令人将螺贴近了听。末了七只螺并排搁于滩石，水犹往螺口灌，谁亦未去倒。"
 NAT_Springs_Spring_Council_tt:"涌泉会盟\n本族由此获得了只属于它自己的一份本事：\n[industrial_capacity_factory_tt]\n[production_speed_industrial_complex_factor_tt]\n[political_power_gain_tt]\n[production_speed_industrial_infrastructure_factor_tt]"
 NAT_Springs_Rivalry_Idea:"逐浪争流"
 NAT_Springs_Rivalry_Idea_desc:"流泉之众上游筑一小坝，下游之田立时渴得裂缝。下游人扛锄找上门，上游人守坝不让：「水自吾门前过，自然归吾使。」下游头脑指岸边那根刻孔木尺：「那便看水位，谁高谁说了算。」两边皆不肯退，便赌一夜。天亮时，木尺上水痕停在中间刻线，不偏不倚。上游人先泄气，下游人亦未再逼，各自归田。坝口为人扒开半尺，水复往下走，岸边木尺犹立，孔里积一夜之露。"
 NAT_Springs_Rivalry_tt:"逐浪之争\n本族由此获得了只属于它自己的一份本事：\n[army_attack_factor_tt]\n[attrition_tt]\n[army_org_factor_tt]\n[war_support_factor_tt]\n[army_org_regain_tt]"
 NAT_Springs_Own_Waterwheel_Idea:"自筑水车"
 NAT_Springs_Own_Waterwheel_Idea_desc:"流泉之众将旧水轮拆了，堆于滩上。焱庭所派匠人带新轴来装，族中青年拦住他：「轴吾等自凿，不用汝带。」匠人收了工具，蹲旁观看。青年们照旧轮样式，拿硬木重凿一轴，榫头不合，削三回方对上。装好后，水一冲，轮吱呀转起，比旧的犹稳。一小孩伸手够轮边之水，为大人一把扯回。青年不理会，蹲下给轴心抹油，轮转得更顺，木叶拍于水面，溅起一串白花。"
 NAT_Springs_Own_Waterwheel_tt:"自筑水轮\n本族由此获得了只属于它自己的一份本事：\n[production_speed_industrial_complex_factor_tt]\n[industrial_capacity_factory_tt]\n[local_resources_factor_tt]\n[production_speed_industrial_infrastructure_factor_tt]\n[production_speed_supply_node_factor_tt]"
 NAT_Springs_Torrent_Drill_Idea:"湍流演武"
 NAT_Springs_Torrent_Drill_Idea_desc:"流泉之众于激流中练列队，一队人手挽手，横蹚急湾。教头立岸上盯着，口里数拍：「一、二，莫松手。」队形至湾心时，末一新人脚下一滑，手脱半寸，全身为水往下游带。旁人即刻补上，一把捞住其臂，岸上教头亦甩出一条藤绳，绳头正落其手边。新人抓绳，被拖回浅水，蹲石上咳两口。教头不骂他，只将那截湿透藤绳收回，绕成一圈挂腕上，转身继续数拍。"
 NAT_Springs_Torrent_Drill_tt:"激流操练\n本族由此获得了只属于它自己的一份本事：\n[army_org_factor_tt]\n[army_speed_factor_tt]\n[army_defence_factor_tt]\n[attrition_tt]\n[command_power_gain_tt]"
 NAT_Springs_Spring_Oath_Idea:"涌泉立誓"
 NAT_Springs_Spring_Oath_Idea_desc:"流泉之众于河口立誓。航首将一只贝螺盛满河水，端的船头，令九舟舟子依次饮过。老艄公拄桨立于最后，轮到他时，却只将唇沾了沾，抬头曰：「水不绝，族不散，此话好说，守起来难。」航首收起贝螺，系于桅杆，风一吹，螺内嗡嗡作响。此后每逢汛期，各族之舟皆泊河口，同察水脉，谁家水轮堵了，众人共往掏。有一年上游改道，数后生主张各奔各处，老艄公摘下那贝螺，倒出当年河水，水已浑矣，却犹在。众人传看一遍，谁亦不提散伙之事，各自归去修渠。"
