 #### 新闻 ####
 SUM_Neo_SGS_News.1.t:"水驿的敕令"
 SUM_Neo_SGS_News.1.d:"教令院的敕令送到沙丘腰带的水驿，矫论团接过来看了一眼，就交给了信使。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。旧王城的遗址又塌了一段墙，考古的学者摇摇头，说再塌下去就什么都没了。"
 SUM_Neo_SGS_News.1.a:"阅"
 SUM_Neo_SGS_News.2.t:"灵光节"
 SUM_Neo_SGS_News.2.d:"灵光节在圣显厅外办了一夜，来的人带一支蜡烛，风再大也没有灭。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGS_News.2.a:"阅"
 SUM_Neo_SGS_News.3.t:"沙下的厅"
 SUM_Neo_SGS_News.3.d:"沙丘腰带组织人手清理圣显厅入口的积沙，挖出来的石阶比人还高。有商人在账本上加了一栏，写的是风向，下面画了几条弯线，谁也看不懂。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SGS_News.3.a:"阅"
 SUM_Neo_SGS_News.4.t:"商道改道"
 SUM_Neo_SGS_News.4.d:"商道旁的税卡又添一处，驮队绕开新卡，走的还是旧道。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。"
 SUM_Neo_SGS_News.4.a:"阅"
 SUM_Neo_SGS_News.5.t:"还回的敕令"
 SUM_Neo_SGS_News.5.d:"敕令被当众卷起来还给信使。信使捧着卷轴在水驿门口站了很久。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。"
 SUM_Neo_SGS_News.5.a:"阅"
 SUM_Neo_SGS_News.6.t:"灵光旗"
 SUM_Neo_SGS_News.6.d:"灵光纹样的旗升上了沙丘腰带的水驿。花灵没有到场，只托风鸟带来一片羽毛。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGS_News.6.a:"阅"
 SUM_Neo_SGS_News.7.t:"沙丘守军"
 SUM_Neo_SGS_News.7.d:"沙丘腰带把护路的人、守泉的兵与乡兵编成一支守军，旗上绣着灵光。城里的水井这几天出得少，挑水的人排到巷口，有人把价钱抬到了一倍。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。"
 SUM_Neo_SGS_News.7.a:"阅"
 SUM_Neo_SGS_News.8.t:"花灵开口"
 SUM_Neo_SGS_News.8.d:"花灵头一回开口向凡人说话，说的是一句：你们的事，你们自己定。盐碱地又往北推了一里，种什么都不活，只有一种灰绿的草还立着。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGS_News.8.a:"阅"
 SUM_Neo_SGS_News.9.t:"哨所易手"
 SUM_Neo_SGS_News.9.d:"雨林伸进沙丘腰带的第一座哨所易了手，房顶的旗换了，墙没有拆。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。月光把沙丘照成银白色，商队借着这点光赶路，比白天走得还快。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。炉火边的老人说起花神，说她的女儿们还守着绿洲，年轻人听完只是添了把柴。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SGS_News.9.a:"阅"
 SUM_Neo_SGS_News.10.t:"沙丘东望"
 SUM_Neo_SGS_News.10.d:"沙丘腰带的军队沿商道向东出了水驿。随军的人说，再走十天就能望见须弥城的尖塔。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。"
 SUM_Neo_SGS_News.10.a:"阅"

