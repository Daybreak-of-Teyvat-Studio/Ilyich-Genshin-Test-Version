 NAT_Nightwind_Own_Rites_Idea:"秘仪独承"
 NAT_Nightwind_Own_Rites_Idea_desc:"烟谜主之仪式，今只由本族长老亲授，不许外人旁听。一焱庭所派中人立于授业棚外，言欲入内记述。守门后生拦住他：「长老亲授，中人不得旁听。」中人亮出凭牒，坚持要看。棚内，长老正手把手教一后生画灵谜涂鸦，闻外面争执，头亦不抬，只言一句：「令他站着，站到悟得出再说。」后生只得由他。中人立半日，腿亦酸，棚里所教甚么却一句不懂，那些话似说与灰听。日头偏西，中人终撑不住，悻悻去矣。长老方停笔，将涂就那张皮递后生，后生双手接过，低头看起。"
