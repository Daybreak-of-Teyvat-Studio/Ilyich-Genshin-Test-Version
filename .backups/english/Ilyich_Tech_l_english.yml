 # Hilichurls
 #############
 Ilyich_Hilichurl:"Hilichurl"
 Ilyich_Hilichurl_equipment:"Hilichurl"
 Ilyich_Hilichurl:"Primitive natives wandering the wilds of Teyvat. Though humanoid in shape, they have lost all reason and sentience. Records show they have roamed these lands for over a thousand years, yet possess no recorded history or civilization. Following the dark cataclysm five hundred years ago, they spread far and wide across the continent. Individually weak and disorganized, they can still prove a considerable nuisance to travelers at times."
