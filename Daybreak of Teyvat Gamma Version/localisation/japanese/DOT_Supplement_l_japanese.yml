 SOV_soviet_atomic_bomb_project_ns_desc:0 "$SOV_soviet_atomic_bomb_project_desc$"
 SOV_soviet_commandos_poum:0 "ソビエト特殊部隊"
 SOV_soviet_commandos_poum_desc:0 "[SOV.GetNameDef]のスターリン主義に対する右翼反対派は、高度な訓練を受けた諜報員を我が国に送り込み、特殊作戦を実行し、我が国の国民に戦争の遂行の仕方を教えている。"
 SOV_soviet_german_trade_agreement:0 "ソ独貿易協定"
 SOV_soviet_german_trade_agreement_desc:0 "[SOU.GetNameDef]との貿易協定で合意した通り、彼らは穀物、綿、石油、鉄鉱石、ゴムなどの原材料を送ってきている。"
 SOV_soviet_hegemony_idea:0 "ソビエトの覇権"
 SOV_soviet_hegemony_idea_desc:0 "我々の行政は他のシステムよりも優越していることが証明された。我々はこの機会に他の行政により抑圧されている人々を救い出し、運よくすでに連邦に加入した人々を啓蒙しなくてはならない。"
 SOV_soviet_imports:0 "ソ連からの輸入品"
 SOV_soviet_japanese_anti_usa_pact:0 "ソビエト・日本反米協定"
 SOV_soviet_japanese_anti_usa_pact_desc:0 "我らは共に、[USA.GetNameDef]を世界という舞台から排除するのだ！"
 SOV_soviet_japanese_reckoning:0 "ソ日戦争の見積もり"
 SOV_soviet_japanese_reckoning_desc:0 "今こそ戦争を[JAP.GetAdjective]人にもたらし、我々に招いた多くの悪事に復讐する時だ。"
 SOV_soviet_military_offensive:0 "ソビエト軍事攻勢"
 SOV_soviet_railways:0 "ソビエト鉄道"
