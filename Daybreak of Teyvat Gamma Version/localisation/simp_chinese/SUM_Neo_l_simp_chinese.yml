 #### 民族精神 ####
 SUM_SDH_I_Matriarch_Rule:"主母之治"
 SUM_SDH_I_Matriarch_Rule_desc:"哈德拉玛维特由主母一句话定规矩，规矩多不落文字。"
 SUM_SDH_I_Suzerain_Edict:"敕令在门"
 SUM_SDH_I_Suzerain_Edict_desc:"雨林的敕令贴在城门上，管着赋税与驻军。"
 SUM_SDH_I_Floral_Blood:"花神的女儿"
 SUM_SDH_I_Floral_Blood_desc:"历代主母自称花神的女儿，信众遍布各部。"
 SUM_SDH_I_Storm_Land:"风沙之地"
 SUM_SDH_I_Storm_Land_desc:"一年三月刮风，风起则商路断绝、城邑相隔。"
 SUM_SDH_I_Hidden_Wells:"暗井与后路"
 SUM_SDH_I_Hidden_Wells_desc:"沟壑深处藏着不标在图上的井，是各部留给自己的退路。"
 SUM_SDH_I_Ruin_Expedition:"遗迹探险"
 SUM_SDH_I_Ruin_Expedition_desc:"遗迹里的钥石与图纸，引着一批批人往沙里走。"
 SUM_SDH_I_Tribal_Scatter:"部族各散"
 SUM_SDH_I_Tribal_Scatter_desc:"各部各守其地，议事时先吵座次。"
 SUM_SDH_I_Caravan_Toll:"商队分成"
 SUM_SDH_I_Caravan_Toll_desc:"过境商队留一成货，算是买了平安。"
 SUM_SDH_I_Desert_League:"沙地之盟"
 SUM_SDH_I_Desert_League_desc:"诸部立盟共守沙地、共分水源、共抗敕令。"
 SUM_SDH_I_Independent_Flag:"独立之旗"
 SUM_SDH_I_Independent_Flag_desc:"花神与沙丘的纹样立在各城城头。"
 SUM_SDH_I_Floral_Kingdom:"花神之国"
 SUM_SDH_I_Floral_Kingdom_desc:"龛立遍各城，祭司由信众公推，绿洲之水按口分。"
 SUM_SDH_I_Pilgrim_Guild:"香客行会"
 SUM_SDH_I_Pilgrim_Guild_desc:"香客自组行会，管路上的食宿与安全。"
 SUM_SDH_I_Holy_Guard:"护法卫队"
 SUM_SDH_I_Holy_Guard_desc:"护法卫队守神庙，也随军出征。"
 SUM_SDH_I_Storm_State:"沙暴军国"
 SUM_SDH_I_Storm_State_desc:"各部之兵编为一军，号令与粮饷统一。"
 SUM_SDH_I_Mech_Corps:"构装队伍"
 SUM_SDH_I_Mech_Corps_desc:"遗迹构装装上兵器，成队不知疲倦。"
 SUM_SDH_I_Sand_Commune:"沙地公产"
 SUM_SDH_I_Sand_Commune_desc:"地分回各部，水按口分，粮按荒年共放。"
 SUM_SDH_I_Oasis_Assembly:"绿洲自治"
 SUM_SDH_I_Oasis_Assembly_desc:"各处绿洲立宪章，代表按月议事，法官按季巡判。"
 SUM_SDH_I_Open_Trade:"公开税则"
 SUM_SDH_I_Open_Trade_desc:"税则刻在碑上，谁交多少自己算得出来。"
 SUM_SDH_I_Common_Law:"沙地共律"
 SUM_SDH_I_Common_Law_desc:"合诸部旧规为一部共律，法官巡判。"
 SUM_SDH_I_Old_Accord:"旧例照行"
 SUM_SDH_I_Old_Accord_desc:"旧例能留的都留，只是多一层公议的过场。"
 SUM_SDH_I_Foreign_Hand:"外邦的手"
 SUM_SDH_I_Foreign_Hand_desc:"北国的使团舍得花钱，开出的价码越往后越大。"

 #### 等级 / 共振 ####
 SUM_Neo_SDH_T1:"一档：香火将断"
 SUM_Neo_SDH_T1_desc:"一档：香火将断。龛前无人，祭礼停办，花神只剩在老人的话里。"
 SUM_Neo_SDH_T2:"二档：香火零星"
 SUM_Neo_SDH_T2_desc:"二档：香火零星。几处绿洲还立着龛，信众大多散了。"
 SUM_Neo_SDH_T3:"三档：香火渐盛"
 SUM_Neo_SDH_T3_desc:"三档：香火渐盛。各城的诞祭办得起来，信众开始有了名分。"
 SUM_Neo_SDH_T4:"四档：香火遍野"
 SUM_Neo_SDH_T4_desc:"四档：香火遍野。各部共尊花神的规矩，主母之外另有公议。"
 SUM_Neo_SDH_T5:"五档：花神当国"
 SUM_Neo_SDH_T5_desc:"五档：花神当国。沙地以信仰立规矩，祭司由信众公推。"
 SUM_Neo_SDH_U1:"一档：风平"
 SUM_Neo_SDH_U1_desc:"一档：风平。沙地无军，各部的兵自守其地。"
 SUM_Neo_SDH_U2:"二档：风起"
 SUM_Neo_SDH_U2_desc:"二档：风起。三五支佣兵与民兵可用，号令不一。"
 SUM_Neo_SDH_U3:"三档：有军可用"
 SUM_Neo_SDH_U3_desc:"三档：有军可用。沙地有一支常备的兵，随令而动。"
 SUM_Neo_SDH_U4:"四档：风卫成军"
 SUM_Neo_SDH_U4_desc:"四档：风卫成军。专打风天的队伍能整建制出动。"
 SUM_Neo_SDH_U5:"五档：风沙之军"
 SUM_Neo_SDH_U5_desc:"五档：风沙之军。部族的兵与遗迹的构装编作一军。"
 SUM_Neo_SDH_Combo_HH:"神军合流"
 SUM_Neo_SDH_Combo_HH_desc:"花神的旗与沙暴的军团并在一处，信仰有了拳头，兵有了名分。"
 SUM_Neo_SDH_Combo_LL:"香火无兵"
 SUM_Neo_SDH_Combo_LL_desc:"神龛零落，兵旅散尽，沙地只剩各部自守。"
 SUM_Neo_SDH_Combo_AH:"神权独尊"
 SUM_Neo_SDH_Combo_AH_desc:"信仰压过兵马，沙地以花神之名定规矩。"
 SUM_Neo_SDH_Combo_BH:"兵在神前"
 SUM_Neo_SDH_Combo_BH_desc:"沙暴军团大过神龛，号令先出军营再进庙门。"

 #### 新闻 ####
 SUM_Neo_SDH_News.1.t:"主母的敕令"
 SUM_Neo_SDH_News.1.d:"教令院的新敕令送到哈德拉玛维特，主母接过来看了一眼，交给身边的人收着。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。有佣兵把武器擦得很亮，擦完却收进了箱子，说这几天用不上。税吏的车队在城门口排了半里长，麻袋里的摩拉压得车轴吱呀作响，围观的沙漠民谁也没有让路。"
 SUM_Neo_SDH_News.1.a:"阅"
 SUM_Neo_SDH_News.2.t:"花神诞祭"
 SUM_Neo_SDH_News.2.d:"花神诞祭在沙地几处绿洲同时开锣，香火与歌乐连着七夜，来的人比往年多。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。关口的守卫收到新命令，凡是往雨林去的人都要登记，登记簿上已经写满了三本。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。有人把这段写进沙海的诗里，念给篝火旁的人听，念完谁也没有鼓掌。"
 SUM_Neo_SDH_News.2.a:"阅"
 SUM_Neo_SDH_News.3.t:"盐路涨价"
 SUM_Neo_SDH_News.3.d:"盐路上的税卡添了一处，盐价涨了。驮队绕开了新的卡子，走的还是旧道。水囊在正午的太阳下晒得发烫，行商把最后一口水留给了驮货的驴。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。教令院派来的书吏念完公文，把卷轴卷起来，抬头时发现厅里已经没剩下几个人。沙暴过后，埋在沙下的石柱露出一角，上面的古文字没有人认得，但都说是好兆头。"
 SUM_Neo_SDH_News.3.a:"阅"
 SUM_Neo_SDH_News.4.t:"沙暴季"
 SUM_Neo_SDH_News.4.d:"换季的第一场大风刮了三天，商队停摆，几处营地被埋了半截。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。驻军换防的号声在黄昏响起，新来的兵不认路，问了三次城门在哪边。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。有妇人把面纱往上提了提，快步穿过广场，怀里的孩子一直没有出声。"
 SUM_Neo_SDH_News.4.a:"阅"
 SUM_Neo_SDH_News.5.t:"烧掉的敕令"
 SUM_Neo_SDH_News.5.d:"主母当着使节的面把敕令烧了。灰被风卷起来，扑了使节一身。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。商队的驼铃在夜里响了很久，守夜的佣兵听得出那是空载的动静，货早在半路出手了。有从雨林回来的旅人说，那边的学者如今也不再做梦了，听的人半信半疑。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH_News.5.a:"阅"
 SUM_Neo_SDH_News.6.t:"独立之旗"
 SUM_Neo_SDH_News.6.d:"花神与沙丘的纹样升上了哈德拉玛维特的城头，雨林在沙地的戍所当夜撤了两处。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。"
 SUM_Neo_SDH_News.6.a:"阅"
 SUM_Neo_SDH_News.7.t:"风卫成军"
 SUM_Neo_SDH_News.7.d:"哈德拉玛维特把各部的兵编成一支军，专挑风天操演。营门口贴出了号册。绿洲的水面比去年低了一尺，倒影里的棕榈树短了一截，孩子蹲在岸边量了很久。巡逻队在边境遇见了一支没有旗号的队伍，双方对峙了一会儿，各走各的路。夜里有人敲开教堂的门，说梦见沙里长出了树，教士把这句话记在了布上。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。雨林方向的信鸽一天来了三趟，最后一趟的纸条上只有两个字。镀金旅团的旗帜换了一面新的，图案没变，料子比旧的好，价钱也比旧的高。"
 SUM_Neo_SDH_News.7.a:"阅"
 SUM_Neo_SDH_News.8.t:"公议庭"
 SUM_Neo_SDH_News.8.d:"主母厅对面立起了一座公议庭。两座厅隔着一条街对着，进出的人互不相视。有人把反对的话写在墙上，天亮前就被人刮掉，可写的人总有新的地方写。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。商路上的税卡又多了一处，收钱的人换了制服，名目换成了一句听不懂的官话。铁匠铺的火烧到后半夜，打的是刀，不是农具，来取货的人从后门进，从后门出。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。"
 SUM_Neo_SDH_News.8.a:"阅"
 SUM_Neo_SDH_News.9.t:"戍所易手"
 SUM_Neo_SDH_News.9.d:"雨林伸进哈德拉玛维特的第一座戍所易了手，房顶的旗换了，墙没有拆。沙暴在午后压过来，天黄得像旧铜，牧人把羊群赶进了岩缝，自己蹲在外面看天。部族的马队从北边回来，马蹄上沾的是泥，说明他们去过有树的地方。官员的马车从大道上驶过，扬起的沙尘落了路边小贩一身，小贩拍了拍衣角，继续摆摊。雨林那边来的使节住了三天，走的时候行李比来时轻，没有人送行。长老们把祖辈传下的盟约抄了一遍，抄到最后一页，墨迹被风沙打湿，看不清了。"
 SUM_Neo_SDH_News.9.a:"阅"
 SUM_Neo_SDH_News.10.t:"风卷东向"
 SUM_Neo_SDH_News.10.d:"沙地的军队在换季的大风里出了绿洲。随军的人说，再走十天就能望见须弥城的尖塔。集市上有人低声说起独立两个字，说完就往四周看，见没人应声，自己也笑了。部族的长老围坐在火边，谁也不先开口，直到有人把一把沙撒进火里，才有个年纪最大的点头。贸易站把秤换了新的，分量比旧的准，来称货的人反而少了。赤王的旧道被风埋了半截，向导拿着罗盘绕了三圈，最后指着一处沙丘说就是这里。城墙上新抹的泥还没干，就有孩子在下面画了一只展翅的鸟，画完就跑了。"
 SUM_Neo_SDH_News.10.a:"阅"
