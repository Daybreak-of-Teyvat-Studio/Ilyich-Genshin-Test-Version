DRA_Rufuse_Division_of_Mond_desc:0"Мы готовы. Пора вернуть мир Мондштадту!"
DRA_Reason_Returns_to_Mond:0"Разум вернулся"
DRA_Reason_Returns_to_Mond_desc:0"Под руководством Альбедо мы победили и вернули мир и свободу Мондштадту!"
DRA_To_be_Continued:0"«Беление» Мондштадта"
DRA_To_be_Continued_desc:0"«Белый мел» — очищение и перерождение. Альбедо восстановил Мондштадт из руин. Мы начинаем новую эру."
MOT_REUNITED:0"Мондштадт воссоединён"
