 SUM_Neo.204.t:"居尔城复兴"
 SUM_Neo.204.d:"居尔城的废墟上重新起了墙。灯火亮到后半夜，有人以为是在庆祝，走近才听清是在争吵。教令院的书记官连夜誊抄副本，墨水未干，信鸽已经飞向沙漠的几座城邦。大贤者一天里见了三拨人，见完谁也不记得对方说了什么。孩子们在巷子里模仿大人的争论，学得惟妙惟肖，围观的人都笑不出来。愚人众的马车深夜驶入城外，车帘一直没有掀开，守卫装作没有看见。有学生把禁令抄了一遍又一遍，抄到最后能背下来，始终没弄明白为什么。集市上的摩拉贬值了一成，卖香料的摊主把秤杆压得比平时低。"
