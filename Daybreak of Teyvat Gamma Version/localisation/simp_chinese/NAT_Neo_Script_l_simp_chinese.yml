 NAT_Canopy_Rite_Autonomy_Idea:"秘仪自树"
 NAT_Canopy_Rite_Autonomy_Idea_desc:"悬木人祭祀之鼓点，向由焱庭派人校准。这年焱庭使者犹未至，族中鼓手便自定拍子。使者途中耽搁，赶至祭场时，祭已始。立场外皱眉：「此鼓点，差半拍。」鼓手手上不停，头亦不回：「吾等自家之祭，自家之拍，差与不差，不用汝来校准。」使者犹欲争，旁侧老祭司将一段藤绳递过，示意他退至圈外。使者只得退开。鼓声一紧一慢，林中鸟被惊起，盘旋祭场上空。鼓手越敲越快，末了一记重鼓落下，满场悬木人皆伏身叩首，鼓声于林间久久不散。"
 NAT_Canopy_Rite_Autonomy_tt:"秘仪自立\n本族由此获得了只属于它自己的一份本事：\n[research_speed_factor_tt]\n[stability_factor_tt]\n[political_power_gain_tt]\n[war_support_factor_tt]"
 NAT_Canopy_Canopy_Proclamation_Idea:"林冠颁诏"
 NAT_Canopy_Canopy_Proclamation_Idea_desc:"悬木人宣告林子归属，不用文书，用喊话。一后生攀至最高树冠，居高临下，对林外喊：「此林，从此乃本族之物！」树下人随声应和，一层层传出去。焱庭所派记室于林口摊册，欲记此话，却听不清树上之词，只得提高嗓子问：「谁说的？界至何处？」后生自树上探身，往下指漫到天边之树梢：「汝看得见的，皆是。」记室笔悬半空，落不下去。树冠上后生复喊一遍，声压风声。记室收册，摇头去矣。后生方从树上滑下，拍拍手上树皮碎屑，抬脚往林深处去了。"
 NAT_Canopy_Canopy_Proclamation_tt:"林冠宣告\n本族由此获得了只属于它自己的一份本事：\n[justify_war_goal_time_tt]\n[war_support_factor_tt]\n[political_power_gain_tt]\n[stability_factor_tt]\n[army_defence_factor_tt]"
 NAT_Flower_Feather_Council_Idea:"羽冠议盟"
 NAT_Flower_Feather_Council_Idea_desc:"花羽会议事，不设桌椅，各部落以己之羽冠为席，往地一放，人便围坐。每议一件空域争端，焱庭文书早写明归属，然会上无人提那文书。一年轻首领问：「文书上写得清清楚楚，犹议甚么？」一鹰主将羽冠往地重重一搁，曰：「文书乃焱庭所写，此冠系本族所戴。议定之事，比文书管用。」众人纷纷摘羽冠围成一圈，你一言我一语，争至日头偏西，方将那条空域界线指认清楚。鹰主将议定之话当众说一遍，众人依次点头，末了各将羽冠重戴回头。那文书为山风掀起一角，翻两个身，卷下崖去矣。"
 NAT_Flower_Feather_Council_tt:"羽冠议盟\n本族由此获得了只属于它自己的一份本事：\n[political_power_gain_tt]\n[stability_factor_tt]\n[war_support_factor_tt]\n[air_ace_generation_chance_factor_tt]"
 NAT_Flower_Fallen_Feather_Idea:"坠羽之争"
 NAT_Flower_Fallen_Feather_Idea_desc:"一花羽会青羽龙之鹰羽自高空坠下，落于灰烬平原两族地界浅滩。天犹未亮，两族之人便赶至，围那羽毛吵开。一族曰羽落谁家地界即归谁，另一族曰鹰乃本族养大，羽毛自然归本族。争至后来，皆不肯让，索性蹲浅滩两边瞪眼。一老头所提之法无人听，便自顾走开。天渐亮，滩上水汽为日头晒散，那羽被风一吹，骨碌碌滚入水中，顺流漂去。两族之人看水面，谁亦未去捞，吵声方止。老头自远处归，手捡另一根更漂亮之羽，谁亦未问此羽何来。"
 NAT_Flower_Fallen_Feather_tt:"坠羽之争\n本族由此获得了只属于它自己的一份本事：\n[stability_factor_tt]\n[war_support_factor_tt]\n[army_org_factor_tt]\n[political_power_gain_tt]\n[army_attack_factor_tt]"
 NAT_Flower_Dragon_Riders_Idea:"驯龙自募"
 NAT_Flower_Dragon_Riders_Idea_desc:"花羽会抓来一匹野生飞龙，欲为配鞍。龙性烈，数人按不住，被甩下两个。一老驯龙手上前，不急按，先以手背贴龙鳞，低声哼起本族调子。龙渐安静。旁侧管册籍官员递上官册，欲登记此副龙鞍：「按规矩，鞍须上册，方算数。」老驯龙头亦不抬：「此鞍不上册，谁抓到算谁的。」官员犹欲有言，那龙忽振翅，老驯龙一跃跨上龙背，抓紧鞍鞯，龙带着他冲半空，在天上盘一圈。官员仰头，手中册子摊着，笔尖悬着未落。龙落崖顶，老驯龙翻身下，拍拍鞍子，看也未看那官册一眼。"
 NAT_Flower_Dragon_Riders_tt:"驯龙自募\n本族由此获得了只属于它自己的一份本事：\n[army_attack_factor_tt]\n[army_speed_factor_tt]\n[army_org_factor_tt]\n[attrition_tt]\n[command_power_gain_tt]"
 NAT_Flower_Own_Airspace_Idea:"空域自划"
 NAT_Flower_Own_Airspace_Idea_desc:"花羽会欲划定自辖空域，遣二鹰主飞上天画线。二人各驾一飞龙，一前一后，沿山脊飞。至一处，一鹰主曰此线当再往东，另一曰当往西，各执一词，半空绕对方打转。地面上观者皆捏一把汗。争半晌，年长者忽收线，往云端一指：「就照云走，云至何处，线至何处。」年少者愣一下，亦收线，随而点头。二龙并排飞回，天际留一道无形之痕。落地后，二人将这条线刻于崖壁，用龙爪抓出之痕。刻毕，年长者将爪痕上石粉吹了吹，转身去矣。"
 NAT_Flower_Own_Airspace_tt:"空域自划\n本族由此获得了只属于它自己的一份本事：\n[air_attack_factor_tt]\n[air_agility_factor_tt]\n[air_detection_tt]\n[air_accidents_factor_tt]\n[air_ace_generation_chance_factor_tt]"
 NAT_Flower_Wing_Oath_Idea:"羽翼誓约"
 NAT_Flower_Wing_Oath_Idea_desc:"花羽会以翅羽立誓。众鹰主各拔下己之一根翅羽，攥手心，围成一圈。一年轻鹰主舍不得己羽，拔时龇牙。旁侧老鹰主笑曰：「疼一下，换个同袍，值。」年轻者不服，却亦将羽拔下。众人将羽举至一处，老鹰主起头念誓：「同升同落，不弃同袍。」众人随念一遍，声在崖间回响。念罢，各将羽毛插回己之羽冠。风自崖下卷上，吹得满冠之羽齐抖。年轻鹰主低头看己那根缺口翅羽，以指扶正，转身随众跨上龙背。"
 NAT_Flower_Wing_Oath_tt:"羽翼誓约\n本族由此获得了只属于它自己的一份本事：\n[army_org_regain_tt]\n[attrition_tt]\n[army_org_factor_tt]\n[war_support_factor_tt]\n[stability_factor_tt]"
 NAT_Flower_High_Tower_Idea:"高塔自持"
 NAT_Flower_High_Tower_Idea_desc:"花羽会于崖顶砌一高塔，塔顶刻意比焱庭望楼高出一大截。塔方砌好，焱庭测量官即带仪器赶来，仰头量半日，面色愈沉：「此塔，高三尺。」花羽会匠首蹲塔顶下望，笑曰：「高出之三尺，看得远。」测量官不服，架仪器欲测仔细。匠首亦不拦，任他测。测至一半，一阵山风吹来，测量官仪器险被掀翻，手忙脚乱去扶。匠首方起身，抬手往远处一指：「汝看见的，吾皆看得见；吾看得见的，汝却不见。此塔下之天，归吾管。」说罢，转身入塔，掩上那扇小门，留测量官一人在风中扶其仪器。"
