#####################
# 决议：璃月大萧条与凝光新政
#####################
 LYY_Crisis_Liyue_Economy_Decision_Begin:"§R开启凝光新政§!"
 LYY_Crisis_Liyue_Economy_Decision_End:"§R结束凝光新政§!"
 LYY_Crisis_Liyue_Economy_Decision_Add:"§R经济危机程度增加§!"
 LYY_Crisis_Liyue_Economy_Decision_Les:"§R经济危机程度减少§!"
 LYY_Crisis_Liyue_Les:"§R危机程度减少15点§!"
 LYY_Crisis_Index_High:"§R该危机程度大于100，璃月恐将有生死劫难降临。此实为侦测之器，此处所设之阈限为百，而决议之组阈限为二百。是故两地启衅之度各异，诸君可因势而变，谋全局之得失，审进退之时宜。然欲致太平，终非易事，若其易得，则安宁何足为贵？然诸君但随性畅游即可，不必执念于四海升平。昔天权凝光于梦中，未尝能尽善，终启孤云阁魔神之乱。纵使时势趋内衅，亦无须过忧。乱臣为祸，不足为惧。§!"
 LYY_Crisis_Liyue_Economy_decision_categories:"凝光新政"
 LYY_Crisis_Liyue_Economy_decision_categories_desc:"鉴于璃月之经济大患，七星于玉京台召集亟谋会议，期致研议并措画应变方略。是会由天权星领首，其余六星咸集，共商维稳璃月财经，以保安黎庶福泽之事。\n\n§Y璃月经济危机程度：§!§R[?LYY_Crisis_Liyue_Economy_Index]§!\n\n身为璃月执政，我们需将危机程度降至零，以化解危机，安邦定国。若危机程度过高，璃月恐将有生死劫难降临。"
 LYY_Crisis_Liyue_Economy_Decision:"§Y凝光新政§!"
 LYY_Crisis_Liyue_Economy_decision_01:"应急救荒"
 LYY_Crisis_Liyue_Economy_decision_01_desc:"季春之月，岩王布德行惠，命有司发仓廪，赐贫穷，振乏绝，开府库，出币帛，勉诸侯，聘名士，礼贤者。"
 LYY_Crisis_Liyue_Economy_decision_02:"工商复兴"
 LYY_Crisis_Liyue_Economy_decision_02_desc:"世儒不察，以工商为末，妄议抑之。夫工固圣王之所欲来，商又使其愿出于途者，盖皆本也。"
 LYY_Crisis_Liyue_Economy_decision_03:"社群变法"
 LYY_Crisis_Liyue_Economy_decision_03_desc:"终日乾乾，与时偕行。天下之治，有因有革，期于趋时适治而已。"
 LYY_Crisis_Liyue_Economy_decision_04:"新政成功"
 LYY_Crisis_Liyue_Economy_decision_04_desc:"经济危机程度下降为0方可结束新政。"
 LYY_Crisis_Liyue_Economy_decision_05:"危机进行中"
 LYY_Crisis_Liyue_Economy_decision_05_desc:"经济危机程度下降为0方可结束新政。"

#####################
# 决议：仙人问罪危机
#####################
 LYY_Crisis_Mighty_Illuminated_Adepti_Decision_Begin:"§R开启仙人问罪§!"
 LYY_Crisis_Mighty_Illuminated_Adepti_Decision_End:"§R结束仙人问罪§!"
 LYY_Crisis_Mighty_Illuminated_Adepti_Decision_Add:"§R仙人问罪危机程度增加§!"
 LYY_Crisis_Mighty_Illuminated_Adepti_Decision_Les:"§R仙人问罪危机程度减少§!"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_categories:"仙人问罪"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_categories_desc:"三眼五显仙人，以其超尘拔俗之姿，以及深邃难测之力，向璃月七星立下严正之命。彼谓帝君，实璃月之魂魄象征与实权领袖，其遇刺之举，非仅侵践一己生命，实乃撼动全土之秩序。是以，仙人明示，璃月七星需竭力查办，寻真凶，复公正。不然，仙人将欲夷平璃月港。\n\n§Y仙人问罪危机程度：§!§R[?LYY_Crisis_Mighty_Illuminated_Adepti_Index]§!\n\n身为璃月执政，我们需将危机程度降至零，以化解危机，安邦定国。若危机程度过高，璃月恐将有生死劫难降临。"
 LYY_Crisis_Mighty_Illuminated_Adepti_Decision:"§Y仙人问罪§!"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_01:"探查疑案"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_01_desc:"狱事莫重于大辟，大辟莫重于初情，初情莫重于检验。盖死生出入之权舆，幽枉屈伸之机括，于是乎决。法中所以通差令、佐、理、掾者，谨之至也。年来州县悉以委之初官，付之右选，更历未深，骤然尝试，重以仵作之欺伪，吏胥之奸巧，虚幻变化，茫不可诘。纵有敏者，一心两目，亦无所用其智；而况遥望而弗亲，掩鼻而不屑者哉。"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_02:"结好仙家"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_02_desc:"尔贡包茅不入，王祭不共，无以缩酒，寡人是征。"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_03:"武力威慑"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_03_desc:"昔归终氏之君，修德废武，以灭其国。若陀氏之君，恃众好勇，以丧其社稷。明主鉴兹，必内修文德，外治武备。故当敌而不进，无逮于义矣；僵尸而哀之，无逮于仁矣。"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_04:"危机解除"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_04_desc:"危机程度下降为0方可危机解除。"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_05:"危机进行中"
 LYY_Crisis_Mighty_Illuminated_Adepti_decision_05_desc:"经济危机程度下降为0方可结束新政。"

#####################
# 决议：愚人众与奥赛尔之乱
#####################
 LYY_Crisis_Fatui_and_Osial_Decision_Begin:"§R开启奥赛尔之乱§!"
 LYY_Crisis_Fatui_and_Osial_Decision_End:"§R结束奥赛尔之乱§!"
 LYY_Crisis_Fatui_and_Osial_Decision_Add:"§R奥赛尔之乱危机程度增加§!"
 LYY_Crisis_Fatui_and_Osial_Decision_Les:"§R奥赛尔之乱危机程度减少§!"
 LYY_Crisis_Fatui_and_Osial_decision_categories:"奥赛尔之乱"
 LYY_Crisis_Fatui_and_Osial_decision_categories_desc:"此地之民，尝对山岳之怒涛，亦尝于卧榻之上、梦寐之间，为撼地之海啸所惊。其后岁月承平，恐惧渐消，然此非可恃也。纵使长眠海中之古老魔神一旦醒转，亦不能阻新时代之来临。惟其醒则浪高百丈，直薄南码头，舟楫尽没，盐田皆毁。老舟子云：海中夜有光，大如车轮，出没于孤云阁外，此非渔火。身为璃月执政，当使危机之数归于零，方能化险为夷，安邦定国。若其数过高，则生死劫难至矣。§Y奥赛尔之乱危机程度：§!§R[?LYY_Crisis_Fatui_and_Osial_Index]§!"
 LYY_Crisis_Fatui_and_Osial_Decision:"§Y奥赛尔之乱§!"
 LYY_Crisis_Fatui_and_Osial_decision_01:"镇压愚者"
 LYY_Crisis_Fatui_and_Osial_decision_01_desc:" 已颁最高戒备令，重兵守护要害之地，遍查国中，缉拿疑似愚人众参与者。"
 LYY_Crisis_Fatui_and_Osial_decision_02:"北国外交"
 LYY_Crisis_Fatui_and_Osial_decision_02_desc:"尊贵之至冬使臣，吾等不得不陈一严肃之问题。据确凿之情报，贵邦之中，愚人众者，正谋一毁灭之举，意欲解封涡魔神之封印。此非仅璃月之安危受胁，实乃提瓦特全土和平之挑衅。敢问，至冬国政，对此可有知悉？抑或有意无意涉此事乎？"
 LYY_Crisis_Fatui_and_Osial_decision_03:"加固封印"
 LYY_Crisis_Fatui_and_Osial_decision_03_desc:"天地玄宗，万炁本根；广修万劫，证吾神通；三界内外，唯道独尊；体有金光，覆映吾身；视之不见，听之不闻；包罗天地，养育群生；诵持万遍，身有光明；三界侍卫，五帝司迎；万神朝礼，役使雷霆；鬼妖丧胆，精怪亡形；内有霹雳，雷神隐名；洞慧交彻，五炁腾腾；金光速现，覆护真人。急急如律令。"
 LYY_Crisis_Fatui_and_Osial_decision_04:"危机解除"
 LYY_Crisis_Fatui_and_Osial_decision_04_desc:"危机程度下降为0方可危机解除。"
 LYY_Crisis_Fatui_and_Osial_decision_05:"危机进行中"
 LYY_Crisis_Fatui_and_Osial_decision_05_desc:"经济危机程度下降为0方可结束新政。"

#####################
# 决议：国务会议&璃月&古恩希尔德通用事件
#####################
 LYY_cabinet_decision_categories:"国务会议"
 LYY_cabinet_decision_categories_desc:"国务会议者，国之重器，邦之枢机也。其设也，集天下英杰之智，汇四海贤达之识，以广纳良策，博采众长，定国之大政，图社稷之永固。此会之旨，非独谋一时之利，而志在千秋万代之宏图；非仅安一隅之宁，而意在四海之内皆得其所。会议之内容，涵盖国之经纬，民生之大计，无不悉议其间。此会之功，不仅在于集思广益，更在于明辨是非，择善而从。其议定之国策，既需顺应天时，亦当合乎地利，更要得人心之所向。故国务会议，实乃国之智囊，邦之砥柱也。"
 LYY_cabinet_decision_begin:"§Y国务会议召开§!"
 LYY_cabinet_decision_end:"国务会议结束"
 LYY_cabinet_decision_01:"会议进行中"
 LYY_cabinet_decision_01_desc:"朝议之时，群僚各抒己见，或论边疆之安危，或议赋税之轻重，或谋外交之策略，或议法律之修订，无一不关乎社稷之安危，民生之福祉。"
 LYY_cabinet_decision_02:"政治人心为要"
 LYY_cabinet_decision_02_desc:"政治者，国之纲纪，民之依归，实以人心为要，此诚不易之理也。盖国之兴衰，系于民心之向背；政之得失，判于民情之顺逆。故圣贤治国，首重民心，以德化民，以礼安民，以法正民，此乃治国之大道，安邦之基石。"
 LYY_cabinet_decision_03:"经济民生为要"
 LYY_cabinet_decision_03_desc:"经济者，国之血液，民之食粮。若经济不振，则国力衰微，民生凋敝；经济繁盛，则国库充盈，民生富足。是以，兴经济，乃强国之基，富民之本。 民生者，国之基石，民之福祉。民以食为天，以居为安，以教为先。故王者治国，当先安民，使百姓衣食无忧，居有所安，教有所得，此乃固国本之策，长治久安之道。"
 LYY_cabinet_decision_04:"兵戈战事为要"
 LYY_cabinet_decision_04_desc:"兵戈战事，国之武备，民之安危，实乃治国安邦之要务。古语云：兵者，国之大事，死生之地，存亡之道，不可不察也。盖国之强盛，赖于兵甲之坚利；民之安全，系于武备之周全。故王者治国，不可忽视兵戈战事，需明其理，慎其行，以保家卫国，以固疆土，以安民心。"
 LYY_Event_random.1.t:"蒙昧浪潮"
LYY_Event_random.1.d:"有学者著书，发激进之论，其文一经流布，恐动局面。吾辈实立于道德与实践之歧路。此诸文，一旦广传，必于现有之局面生深远之影响，无论为积极之变，抑为潜在之动，皆不可轻。其如双刃之剑，既可激社会之进与觉醒，亦可起不必要之争与分裂。吾辈当持愚民之政、抑此知识之传，抑择不为思想进步之碍？总务司收其书三十七部，封于库，库吏私留一部，夜读之。书肆有售者，价三倍，买者多青年。学宫讲席之上，有生问之，讲者默然，良久曰：此非吾所敢言。坊间已有抄本流传，字多讹，而读者不弃。玉京台榜下有人贴匿名之帖，晨贴而午揭，揭者不知何人。有生挟书出城，为关卒所阻，书没而人释。讲席自此罢议此篇。"
 LYY_Event_random.1.a:"知识就是力量"
 LYY_Event_random.1.b:"无知就是幸福"
 LYY_Event_random.2.t:"商人不满"
LYY_Event_random.2.d:"于苛捐杂税、集团公司、港口之税、海员之需，及贸易与海关之政，商人群起不满，其情如港口之波涛汹涌。彼等威胁曰：若吾辈不能于[ROOT.GetFlag][ROOT.GetName]此片土上，寻一更友善、更公正之商贸之境，则吾辈别无他择，惟携其财产与希望，迁于那些更欢迎商业繁荣之港。商会会长率众至总务司，递牒一函，署名者二百七十四家。牒中列苛捐十七项，谓其重者三：一曰货税，二曰舟税，三曰关验。南十字船队已移三舟于外港，云试其利。有商人变卖铺面，携资赴遗珑埠，云彼处税轻。港中市面一日冷于一日，摊主多闭棚。总务司答以容议，而议久不决。市人闻之，皆笑。商会悬牌于门，书本埠无利四字。"
 LYY_Event_random.2.a:"增加贸易投资"
 LYY_Event_random.2.b:"镇压捣乱分子"
 LYY_Event_random.3.t:"改善首都"
LYY_Event_random.3.d:"重振吾都之荣耀，此宏伟之志也。长期以来，此荣耀似被尘封于历史之隅，未得应有之关注与护持。都者，国之心脏，非独政治与经济之中心，亦文化与精神之源。然随时光之逝，其辉煌渐为日常喧嚣所掩，那些承载历史与文化记忆之建筑与街区，须吾辈呵护与修葺。玉京台石阶裂者七处，以灰补之，雨过复裂。旧城墙三段已圮，砖为居民取去筑屋。天后宫梁上有白蚁，匠人云再十年则倾。月海亭西廊柱十二，其四已朽，以木支之。坊中老人云：少时城中有钟楼，今不知所在。总务司议修葺之费，议三日，未定。工匠上书，请先修石阶与城墙，次及宫庙。总务司留其书不报，工匠复上书，凡三次。匠人夜作，灯照石阶，锤声达旦。"
 LYY_Event_random.3.a:"劳民伤财，搁置再议！"
 LYY_Event_random.3.b:"[ROOT.GetLeader]亲自督办！"
 LYY_Event_random.4.t:"政策失当"
LYY_Event_random.4.d:"近者，一股不安之暗流于国中悄然涌动，源自民众与贵族之间日增之不满，汇聚为不可忽视之力，挑战吾辈政策之权威与实效。原本旨在推国家之进与社会之和之策，却于施行之中遭误解与曲解。民众似将吾辈之初衷视为冷漠与不公，此错位之解遂成反对者手中之利剑，彼等以此为据，大肆渲染政府对福利之漠视，仿佛吾辈于民众之疾苦无动于衷，于社会之公平正义视而不见。反对者利用民众之困惑与不满，将吾辈之策描绘为对弱势之忽视、对社会福利之漠视。此形象与吾辈初衷大相径庭，却于一定程度上影响公众之判断。殿上争论三日，未有定论。有老臣出班，言此事不可再缓，众莫应。民间已传歌谣，词多讥刺。总务司遣人察之，还报云：无实据。"
 LYY_Event_random.4.a:"我们做得没错！"
 LYY_Event_random.4.b:"改革政府政策！"
 LYY_Event_random.5.t:"腐败丛生"
LYY_Event_random.5.d:"腐败者，如政治与经济域中之一颗毒瘤，长久侵蚀社会之肌体，其根深蒂固之势令人忧心。过去数年中，一连串触目之丑闻曝于光天化日之下，每一次揭发皆如利刃，深刺公众之神经，引社会广泛之反思与警醒。此诸事非独暴制度之漏，更揭人性之贪与权力之滥，其如一面镜子，映出社会深层之矛盾与挑战。随丑闻接连而曝，民众于腐败之关注达于极点，求政府果断措置之呼声日高。社会各界纷纷呼吁，须自源头铲除腐败之壤，构一更公正、更透明、更廉洁之行政之体。此非独关政府之公信，更关国家之长治久安与民众之福。总务司设检举之匦于玉京台侧，投书者日数十。有吏自首，缴赃£mora 摩拉三千，免其罪。匦中之书月一启，启则封识三重，启者三人同视。"
 LYY_Event_random.5.a:"这算什么大事！"
 LYY_Event_random.5.b:"[ROOT.GetLeader]亲自督办！"
 LYY_Event_random.6.t:"军事分歧"
LYY_Event_random.6.d:"于军事决策之歧路，一场关于战术之择之争正悄然升级，将全军推向分裂之边。两派将领，各持截然不同之战略，如两股强劲之洪流，于营中相撞，激起无数浪花。此争非独战术之分歧，实为军队整体战略方向之深虑。其触及军事指挥体系之核心，试领导者于复杂局势下之决断与凝聚。两派之对立，使军内之气紧张，非独损士气，更可于关键时刻弱整体之战力。主攻者云：兵贵神速，宜出石门，直取北境。主守者云：粮道未固，冒进必溃，宜守天衡。二说争于帐中，至夜不解，烛尽三支。有老将不言，惟以杖画地作图，图成而众默。千岩军诸营已分投二说，同营者亦相争。天衡山营中夜有斗者，为巡卒所止。主帅集诸将于帐，令各书其策，密封而进，不使相知。"
 LYY_Event_random.6.a:"要塞是我们的力量！"
 LYY_Event_random.6.b:"我们需要始终攻击！"
 LYY_Event_random.7.t:"吟游诗人"
LYY_Event_random.7.d:"一位著名之吟游诗人近日越吾国境。彼携一历经沧桑之竖琴，及一颗于音乐无限热爱之心，决以己之歌与琴音，漫游全国，为每一隅带去欢乐与希望。此诗人非独技高，更有一颗洞察人心之魂，彼能以音乐为桥，连每一孤独之心，使欢乐于人之间流淌，如春日暖阳，融冬日之寒冰。然而，关于此诗人之来，亦引一些微妙之议论。有人言之凿凿，称惟君之高耳，方配听此世间最美之音乐。彼等以为，诗人之歌如珍稀之宝石，惟于最尊之殿中方能绽最耀之光。然亦有另一派之声，彼坚信音乐乃属于每一人之赠礼，不分贵贱，不问出处，只要心中有爱、有渴，便能在每一音符中得共鸣。诗人既入港，坐于吃虎岩市口，弹一曲，听者百人。有巡吏欲驱之，众不散，吏遂止。"
 LYY_Event_random.7.a:"音乐应属于人民！"
 LYY_Event_random.7.b:"我该享受享受了！"
 LYY_Event_random.8.t:"良好光景"
LYY_Event_random.8.d:"今年，似天所赐，农事收成呈一片丰收之象。金黄之麦浪、饱满之果实，非独饰乡村之画卷，更为全国之经济注勃勃之机。于商人与企业家而言，此丰年无疑开一通往机遇之门，彼等敏于捕捉其中之商机，纷纷投身农产品之加工、销售与出口，将此来自大地之馈赠转为源源不断之财。此于吾辈税基十分有利，且于全境之内皆带来岁入之增。归离原麦登场，车运至南码头，日三百乘。翘英庄茶亦丰，茶价反落，茶户喜而忧。仓廪皆满，总务司议增建仓三所。有农户以余粮酿酒，酒肆新开七家。商会遣人往蒙德、至冬议价，欲以丰补歉。粮价既平，市面百物皆贱，惟工价未增。粜米者以斗量，斗平不抑，买者不争。有游商自蒙德来，购麦千石，云彼处歉收。"
 LYY_Event_random.8.a:"我们应该重视持续发展！"
 LYY_Event_random.8.b:"可持续竭泽而渔也是可持续！"
 LYY_Event_random.9.t:"市民要求自治权利"
LYY_Event_random.9.d:"于国家发展之中，一股集权之洪流悄然涌动，欲将分散之权收归中央，以求国家之统一与高效。然而，此过程非一帆风顺，尤于那些历史悠久、自治传统深厚之城镇而言，集权之推如无形之风暴，冲市民世代相承之生计与自治之权。市民，尤居于繁华都中者，其规矩与习惯与乡间同胞大相径庭，成独特而多元之社会之态。面对集权之压，数城不甘沉默，以坚定之姿挺身而出，力抗此来自上层之制度化之潮。彼所求者，非独对原有权利之敬，亦为对地方文化与传统之守。在其看来，城市之自治权非独关乎行政之自由，亦为对历史之承、对未来之期。市民以集会、请愿，乃至于法度之内抗争，表其心声，呼中央能听地方之言，敬而护城市之自治，使地方之特色与国家之统一于相互敬重之基上和合而存。"
 LYY_Event_random.9.a:"拒绝他们的特权！"
 LYY_Event_random.9.b:"接受他们的要求！"
 LYY_Event_random.10.t:"炽焰焚燔之神的愤怒"
LYY_Event_random.10.d:"一场灾难正无情蹂躏[Root.Capital.GetName]，此曾繁之城今为浓重黑烟所笼，如末日之兆。连绵不绝之大火，自三日前始，便如野兽吞噬一切，老城古朴之风与现代城区之繁华，皆于火舌之下化为灰烬。熊熊烈焰之下，非独砖石与木梁之倒塌，亦无数家庭温馨记忆之消逝。要害之基建于火海中重创，城市之命脉为无情截断，居民生计陷于困顿。街头巷尾，人流离失所，绝望与无助之气弥漫空中。救援之队昼夜与时间竞走，欲制火势，而火之猛与蔓延之速使一切之力皆显艰难。于此浩劫之中，[Root.Capital.GetName]正临大考，城市之前途充满不定，而重建之路必漫长而多艰。井水尽竭，取水者远至城外三里。有僧众百人入火场救人，出者半。"
 LYY_Event_random.10.a:"这算什么大事！"
 LYY_Event_random.10.b:"[ROOT.GetLeader]亲自督办！"
 LYY_Event_random.11.t:"蒙昧主义浪潮"
LYY_Event_random.11.d:"有学者著书，发激进之论，其文一经流布，恐动局面。吾辈当持愚民之政、抑此知识之传，抑择不为思想进步之碍？书初出时无人注意，三日而传遍学宫。讲席之上，有生持卷问难，讲者不能答，遂罢讲。总务司闻之，遣吏索其书，得十四部，余皆不知所往。书肆主人云：书已尽，来者犹问。坊间有手抄之本，字迹潦草，讹误满纸，而读者愈众。有老儒叹曰：此非书之过，乃时之过也。吏还报请禁，上官批曰：缓议。禁而不绝，禁愈严则传愈广，此古今通患。有商贾以书杂货中运出，关卒不察。上官闻之，改批曰：急禁。然已晚。有学官上言：宜择其可行者行之，余者置之。上官不省，惟批知道了三字。书遂长传，至今不绝。禁书之令三下，而书行如故。"
 LYY_Event_random.11.a:"知识就是力量"
 LYY_Event_random.11.b:"无知就是幸福"
 LYY_Event_random.12.t:"蒙昧主义浪潮"
LYY_Event_random.12.d:"学者之文，本为论理，而流布既广，遂成事端。其言曰：民可使知，不可使愚。此语一出，众皆哗然。有司议之三日：一曰禁，二曰焚，三曰置之不问。主禁者云：乱由言起，言止则乱止。主焚者云：禁之则人愈求，焚之则人愈信，不如聚而藏之。主不问者云：此辈书生，言过三日则自消。三说相持，终未有决。而书已遍于市井，童子亦能诵其一句。玉京台榜下有少年贴一纸，上书四字：愿闻其详。晨贴而暮不见，次日复贴。如是者七日，终无人揭之，亦无人禁之。总务司案上积牒高尺余，皆论此事，无一决者。有吏私录一通，藏于袖，归而示其子。其子年十四，读毕曰：此理至浅，何至于禁？有好事者刻板印之，一板三百纸，日出十板。"
 LYY_Event_random.12.a:"知识就是力量"
 LYY_Event_random.12.b:"无知就是幸福"

