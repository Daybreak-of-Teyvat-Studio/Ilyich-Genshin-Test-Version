 Ilyich_Tech_decisions_desc:"L'étoile du sud verse sa lumière sur les flots bleus ;\nSous la lune, le vaisseau solitaire vogue dans le firmament.\nL'âme stellaire millénaire brave l'océan immense ;\nD'un coup de rame, il soumet tous les abîmes."
 Ilyich_Tech_decisions_01_desc:"L'étoile du sud verse sa lumière sur les flots bleus ;\nSous la lune, le vaisseau solitaire vogue dans le firmament.\nL'âme stellaire millénaire brave l'océan immense ;\nD'un coup de rame, il soumet tous les abîmes."
 Ilyich_Tech_decisions_02_desc:"L'étoile du sud verse sa lumière sur les flots bleus ;\nSous la lune, le vaisseau solitaire vogue dans le firmament.\nL'âme stellaire millénaire brave l'océan immense ;\nD'un coup de rame, il soumet tous les abîmes."
 DOT_Tech.3.t:"Invocation des Esprits Héroïques"
 DOT_Tech.3.d:"Remplis‑toi, remplis‑toi, remplis‑toi, remplis‑toi, remplis‑toi !\nMon corps se dévoue à toi, ton épée répond à mon destin ; réponds à l'appel du destin. Si tu acceptes cette volonté et obéis à ce serment, réponds‑moi.\nJ'accomplirai toutes les bonnes actions de ce monde ;\nJ'exterminerai tous les maux de ce monde.\nBrise la roue de la contrainte, apparais ! Gardien de la balance !"
 DOT_Tech.3.a:"Aaaaaaaaah"
